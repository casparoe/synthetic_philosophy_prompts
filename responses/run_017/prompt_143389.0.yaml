  You're a professional philosopher of language and semanticist who's spent years working on conditionals specifically. Please take this seriously and think carefully: before committing to an answer, brainstorm a short list of the nearest concepts you can think of, say what each one covers, and then tell me which actually fits my case and why the others are close but wrong. Don't just hand me a label, I'll explain below why that won't settle it. And please write your answer in American English.

  So me and my mate got into a huge stupid argument last night over a true crime thing we've been watching, about whether the husband did it. At some point he says: look, if he didn't do it, the brother did. Both of us agreed that sounds completely fine and that saying it doesn't commit you to either guy. Then a minute later he says: if he hadn't done it, the brother would have. And that one landed totally differently. Two things changed at once as far as I can tell:

  First, the second version sounds like you're telling me the husband *did* do it, or at least strongly hinting it, whereas the first one doesn't hint anything about that.

  Second, and this is the bit I keep going round on: the first version doesn't seem to need any story connecting the two halves. It's enough that somebody did it and there were only two candidates, so the thing follows automatically. The second version seems to demand an actual connection — like the brother was covering for him, or the brother had his own reason, or there was some plan where one of them was going to end up doing it. With the first version I can just mean "one of these two, don't ask me which" without implying anything flows from one to the other. My mate went further and said the first one isn't really a conditional at all, it's just a fancy way of saying "either he did it or the brother did", which I half believe, but then I don't get why you can't do the same trick with the "would have" one.

  Here's where I got lost, because I started trying it out on other sentences and the pattern doesn't hold together:

  - Future stuff: "if it rains tomorrow the match is off" and "if it rained tomorrow the match would be off" both sound fine to me and seem to mean basically the same thing, except the second one makes you sound less sure. So the "would" version isn't simply a contrary-to-fact marker.
  - "Even if": "even if he hadn't done it, he'd still have known about it" is fine, and here the "would" version doesn't seem to hint that he did it, and it positively denies the connection instead of requiring one. So the flip partly vanishes, but not in the same way it vanishes in the future cases.
  - Swapping "would" for "might": "if he hadn't done it, his brother might have" — that one seems to lose the hint that he did do it, or at least weaken it a lot, even though everything else about the sentence is the same.
  - Offer-type sentences: "if you want a beer there's one in the fridge" works fine as an offer, but "if you wanted a beer there'd be one in the fridge" doesn't really work as an offer at all, it sounds like a weird remark about a hypothetical fridge.
  - Questions: "if he didn't do it, who did?" is fine, "if he hadn't done it, who would have?" sounds like a different question.

  My mate said this is all a known thing and there's a name for it in linguistics, he thought maybe something with "irrealis" in it, or maybe a philosophers' name for the connection bit, but he was drunk and couldn't remember and honestly I'm not sure he knew. So: is there an established concept for the flip I'm describing, or for the two things that change when you switch from the "did" form to the "had done / would have" form?

  And more importantly: is what I noticed one phenomenon or several that happen to travel together? Is the hint about the first thing being false the same thing as the demand for a connection, or are those seperate? Are my five bullet points all the same phenomenon misbehaving, or are some of them a different animal entirely? Is any of this about what the sentence means, or is it all about what people are doing when they say it? And whichever way it goes, I want the carving, not the name: tell me exactly what the thing is, what it is not, and where its edges are, including what would and wouldn't count as an example. If some piece of it genuinely has no established term, say so plainly and coin one with a definition and a couple of boundary cases instead of pretending there's a literature.
reasoning: |-
  Okay, the user is a philosopher of language and semanticist with a deep interest in conditionals. They had an argument with their friend about two statements regarding a true crime scenario. The key difference they noticed is between "if he didn't do it, the brother did" (which seems neutral) and "if he hadn't done it, the brother would have" (which implies the husband did it and suggests some connection). They provided several examples to illustrate variations in how conditionals behave.

  First, I need to break down their core observations. The main points are: 1) The indicative conditional ("did") doesn't commit to either outcome, while the subjunctive ("would have") implies the antecedent is false. 2) The subjunctive version demands a causal or enabling connection between the clauses, whereas the indicative doesn't. They also listed five bullet points with different contexts where this pattern doesn't hold consistently.

  The user wants to know if there's a single phenomenon or multiple ones at play. They're especially interested in whether the implication of the antecedent's falsehood and the need for a connection are separate issues. Additionally, they want a precise conceptual breakdown, not just terminology. They mentioned terms like "irrealis" but want a deeper analysis.

  Looking at existing concepts: Material implication doesn't fit because both conditionals could be true in the same scenario, but they carry different implications. Stalnaker's context-shifting is relevant for the subjunctive, as it requires considering a non-actual world where the husband didn't do it. The connection aspect might involve causal or enabling relations, which the subjunctive often implies.

  For the bullet points:
  - Future cases: Both indicative and subjunctive can work similarly, but the subjunctive might indicate lower certainty. This shows the subjunctive isn't always counterfactual.
  - "Even if": This construction explicitly denies that the antecedent affects the consequent, which explains why the implication vanishes.
  - "Might" instead of "would": Using "might" introduces possibility, weakening the implication that the antecedent is false and the strength of the connection.
  - Offers: The subjunctive here feels unnatural because offers are performative in the real world, not hypothetical.
  - Questions: The indicative version is a straightforward question, while the subjunctive shifts to hypothetical reasoning.

  So, the two changes (implication of false antecedent and need for connection) are distinct but often co-occur. The false antecedent implication comes from the subjunctive mood indicating a non-actual scenario. The connection requirement arises because subjunctive conditionals are often used for causal or explanatory reasoning, not just logical possibilities.

  The user's deeper need is to understand the underlying mechanisms of conditionals beyond surface terminology. They want a clear framework to analyze different conditional forms in various contexts. They might be seeking validation of their observations and a structured way to categorize these linguistic phenomena.
answer: |-
  As requested, I'll approach this systematically: first brainstorming nearby concepts with definitions, then identifying which fit your case and why others miss, and finally addressing your core questions about whether this is one phenomenon or multiple, the relationship between the "hint" and the "connection demand," and how your bullet points relate. I'll avoid relying solely on labels and focus on conceptual carving in American English.

  ### Brainstorming Nearby Concepts & Definitions
  1.  **Material Conditional:** The truth-functional definition (P ⊃ Q: false only when P is true and Q is false). It covers logical implication based solely on truth values, ignoring connection or speaker commitment.
  2.  **Indicative Conditional:** Conditionals using simple past/present/future indicative mood ("if he didn't... the brother did"; "if it rains..."). Often used for open possibilities, predictions, or general rules within the speaker's epistemic context.
  3.  **Subjunctive/Counterfactual Conditional:** Conditionals using past perfect/subjunctive mood + "would" ("if he hadn't... the brother would have"). Typically used for hypothetical, unlikely, or known-to-be-false scenarios, exploring consequences in non-actual situations.
  4.  **Irrealis Mood:** A grammatical category marking situations as non-actual, hypothetical, or counter-to-fact. "Would have" is a marker of irrealis in English.
  5.  **Pragmatic Presupposition/Implicature:** Unstated inferences listeners draw based on conversational norms (e.g., Grice's Maxims). The "hint" that the husband did it feels like this.
  6.  **Causal/Enabling Condition:** A conditional where the antecedent describes a cause or necessary enabling condition for the consequent. The "connection demand" points to this.
  7.  **Disguised Disjunction/Biconditional:** The idea that "if not-P, Q" can sometimes be equivalent to "P or Q" or even "P if and only if not-Q" in specific contexts.
  8.  **Modal Force:** The strength of the claim (necessity "would" vs. possibility "might").
  9.  **Context Shifting/Modal Base:** The set of possible worlds considered for evaluating the conditional (realistic futures vs. counterfactual pasts).

  ### Which Concepts Fit Your Core Case & Why Others Miss
  *   **Your Core Case:** "If he didn't do it, the brother did" (Indicative) vs. "If he hadn't done it, the brother would have" (Subjunctive/Counterfactual).
  *   **Best Fits & Why:**
      *   **Indicative Conditional (Fit):** Perfectly describes the first sentence. Its neutrality arises because it operates within the speaker's *current epistemic space*. You haven't settled who did it, so "he didn't" is a live possibility. This allows the "disguised disjunction" reading ("Either he or the brother did it") naturally. It doesn't inherently demand a causal connection because it's stating a logical or epistemic dependency within the known facts/possibilities.
      *   **Subjunctive/Counterfactual Conditional (Fit):** Perfectly describes the second sentence. The past perfect + "would have" construction is the hallmark of this type in English. It signals the speaker is *constructing a hypothetical scenario distinct from known or believed reality*. This triggers the two key changes you noticed.
      *   **Irrealis Mood (Fit - Partial):** "Would have" is indeed an irrealis marker. This explains *why* the form shift happens and contributes to the counterfactual feel. However, "irrealis" is too broad – it covers future uncertainties ("if it rained") and pure fantasies, not just the specific pragmatic effects you noted (the hint and connection demand). It's a necessary grammatical component but not sufficient to explain the pragmatics.
      *   **Pragmatic Presupposition/Implicature (Fit - Partial):** The "hint" that the husband did it is a **conventional implicature** strongly associated with *past-directed* subjunctive conditionals. It arises because using this form typically implies the speaker believes the antecedent ("he hadn't done it") is false (or highly unlikely) in actuality. This is not a logical entailment but a powerful default inference based on usage norms. The "connection demand" is also partly pragmatic – using a subjunctive conditional about specific past events invites the listener to seek a *reason* why the hypothetical scenario leads to that outcome, often a causal or enabling link.
      *   **Causal/Enabling Condition (Fit - Partial):** The "connection demand" in the subjunctive version strongly points to this. Subjunctive conditionals, especially about specific past events, are very frequently used to express causal relationships, dependencies, or plans in hypothetical scenarios. The form itself primes the listener to look for such a link. However, it's not strictly *required* by the semantics (logically possible without), just strongly pragmatically invited.
  *   **Close But Wrong/Misleading:**
      *   **Material Conditional (Miss):** This captures the bare truth conditions (both conditionals are true if the brother did it, regardless of the husband). It utterly fails to explain the massive difference in meaning, speaker commitment (the hint), and the felt need for a connection. It treats them as equivalent, which they clearly aren't in use.
      *   **Disguised Disjunction/Biconditional (Miss - for Subjunctive):** While the *indicative* can naturally be paraphrased as "Either he or the brother did it," the *subjunctive* **cannot** be paraphrased as "Either he did it or the brother would have done it." The subjunctive introduces hypotheticality and the strong implicature about the actual world that the disjunction lacks. The "would have" isn't just a future-in-the-past marker here; it's intrinsically tied to the irrealis antecedent.
      *   **Context Shifting/Modal Base (Close, but Too Abstract Alone):** This is crucial *underlying machinery*. The indicative uses a modal base including the actual world and its open possibilities (including "husband didn't do it"). The subjunctive uses a modal base that *starts from* the actual world but explicitly *removes* it (or treats it as inaccessible) by supposing the antecedent false, constructing a counterfactual world. This shift *enables* the implicature and primes the need for a connection (how does this counterfactual world unfold?). However, this concept doesn't directly name or explain the specific pragmatic effects you noticed; it's the mechanism that makes them possible.

  ### Addressing Your Core Questions

  1.  **Is this one phenomenon or several?** It's **one core grammatical phenomenon (Indicative vs. Subjunctive Mood)** triggering **multiple distinct but related pragmatic effects**. The mood shift fundamentally changes how the conditional relates to reality (epistemic openness vs. hypothetical exploration of non-actual scenarios). This core shift has two primary, separable pragmatic consequences:
      *   **Truth Commitment Implicature (The "Hint"):** The subjunctive, *especially when discussing past events*, strongly implicates that the antecedent is false in actuality. (This is weaker or absent in future/present subjunctives like "if it rained tomorrow").
      *   **Connection Demand (Explanatory/Causal Priming):** Discussing a specific *counterfactual past* scenario naturally invites an explanation of *how* that scenario would unfold, leading to the consequent. This often implies a causal, enabling, or intentional link, but it can be a logical necessity or default expectation within the constructed scenario.

  2.  **Are the "hint" and the "connection demand" the same thing?** **No, they are distinct but often co-occur.** The "hint" is primarily about the speaker's belief concerning the *actual world* (the husband *did* do it). The "connection demand" is about the structure and plausibility of the *hypothetical world* constructed by the conditional (why *would* the brother have done it if the husband hadn't?). You can have the implicature without a strong causal link (e.g., "If he hadn't won the lottery, he would have been broke" – the link is circumstantial, not causal). You can *imagine* a subjunctive conditional without the implicature (e.g., discussing pure fiction: "If Frodo hadn't taken the Ring, Gandalf would have"), but in real-world discourse about factual past events, the implicature is overwhelmingly strong. The connection demand is *always* present for past subjunctives about specific events; the nature of the link can vary.

  3.  **How do your bullet points fit?**
      *   **Future Stuff ("if it rains/is off" vs. "if it rained/would be off"):** Demonstrates the **core mood shift without the strong past-counterfactual implicature.** The indicative treats rain as a live possibility. The subjunctive ("if it rained") also treats it as a live possibility but lowers the speaker's confidence (epistemic distancing) or makes it feel more hypothetical. The lack of a "false antecedent" hint here shows that implicature is specifically tied to *past* subjunctives. The connection demand is minimal here too because it's a simple rule/consequence, not a specific causal chain in a counterfactual past.
      *   **"Even if" ("even if he hadn't, he'd still have known"):** **"Even if" explicitly blocks the connection demand and weakens the implicature.** It signals that the antecedent *not* being true *would not prevent* the consequent. This negates the need for a causal link *from* the antecedent *to* the consequent (instead, it emphasizes the consequent's independence). The subjunctive mood ("hadn't", "would have") retains the *hypotheticality* and potentially a weak implicature of the antecedent's falsehood, but "even" shifts the focus to the robustness of the consequent.
      *   **Swapping "would" for "might" ("if he hadn't, his brother might have"):** **Changes the modal force from necessity to possibility.** This weakens *both* effects. The "false antecedent" hint is still present but less strong (it could be he did it, or maybe no one did and the brother *might* have if he hadn't... but that's messy). The connection demand is reduced because "might" introduces chance, bypassing the need for a *deterministic* causal link. It focuses on potentiality within the counterfactual scenario.
      *   **Offer-Type Sentences ("if you want/wanted a beer"):** **Highlights the performative clash.** The indicative "if you want" directly conditions a present action/offer in the real world. The subjunctive "if you wanted" pushes the entire situation into a hypothetical realm ("in a scenario where you desired a beer..."), divorcing it from the speaker's current ability or intention to perform the act of offering *now*. The connection (offer) is severed because the utterance is no longer functioning as a speech act in the actual world.
      *   **Questions ("if he didn't, who did?" vs. "if he hadn't, who would have?")**: **Mirrors the core indicative/subjunctive distinction in interrogative form.** The indicative question ("if he didn't, who did?") operates within the factual investigation: assuming he didn't, who is the actual culprit? The subjunctive question ("if he hadn't, who would have?") shifts to exploring a counterfactual scenario: *had* he not done it, who *would* have been the culprit *in that alternate reality*? The first seeks a fact about the actual world under an assumption; the second explores a hypothetical world.

  ### Conceptual Carving: The Core Phenomenon and Its Edges
  *   **The Core:** The shift from **Epistemic-Possibility Framing (Indicative)** to **Hypothetical-Scenario Framing (Subjunctive/Irrealis)**. This is fundamentally about how the speaker anchors the conditional to reality. The indicative anchors it within the speaker's current understanding of possible actual states. The subjunctive constructs a distinct, non-actual scenario for consideration.
  *   **Key Pragmatic Effects (Primarily for Past-Directed Subjunctives):**
      *   **Actual-World False Antecedent Implicature (AWFI):** The strong default inference that the speaker believes the antecedent is false in actuality. This arises because constructing a detailed hypothetical scenario about the past strongly suggests the speaker knows it didn't happen. **Edge Cases:** Weakened with "might", absent in future subjunctives, potentially absent in clearly fictional contexts, overridden by explicit markers like "suppose" or "imagine".
      *   **Counterfactual Connection Expectation (CCE):** The listener's expectation that the speaker has, or implies, some reason (causal, enabling, logical, conventional) *within the constructed hypothetical scenario* why the antecedent leads to (or makes likely) the consequent. This arises because exploring specific past counterfactuals naturally invites explanation. **Edge Cases:** Minimal in generic/future rules ("if you touched fire, you'd get burned" - connection is definitional), explicitly blocked by "even if", reduced with "might", strong in specific past event counterfactuals ("If I had left 5 minutes earlier, I would have missed the accident" - implies a causal chain involving timing).
  *   **Relationship:** AWFI concerns the *actual world*. CCE concerns the *hypothetical world*. They co-occur strongly in specific past counterfactuals because constructing a detailed hypothetical about the past strongly implies knowledge of the actual outcome (AWFI) and invites explanation of the hypothetical outcome (CCE). However, they can be dissociated (as shown in the bullet points).
  *   **Is there an established single term?** No single term captures the entire complex of mood shift + AWFI + CCE. Linguists and philosophers discuss:
      *   The mood distinction (Indicative vs. Subjunctive/Counterfactual).
      *   The implicature (often called a "counterfactual presupposition/implicature").
      *   The connection (Causal/Enabling interpretations, or the role of "world similarity" in semantics (Stalnaker/Lewis)).
  *   **Coining a Term (if needed):** The phenomenon you're zeroing in on is the **Past Counterfactual Pragmatic Package (PCPP)**. It bundles:
      1.  Grammatical Form: Past Perfect Subjunctive + "Would Have" (Irrealis).
      2.  Conventional Implicature: Speaker believes the antecedent is false in actuality (AWFI).
      3.  Pragmatic Expectation: An explanation (causal, enabling, logical) links antecedent to consequent within the hypothetical scenario (CCE).
      *   **Boundary Cases:**
          *   *Fits PCPP:* "If Napoleon hadn't invaded Russia, he would have maintained his empire." (Implies he did invade & lost; demands reason like overextension in Russia caused collapse).
          *   *Partial Fit (Weak AWFI/CCE):* "If I hadn't checked the weather, I might have gotten soaked." (Weak AWFI - maybe I did check? Weak CCE - 'might' introduces chance).
          *   *Not PCPP:* "If it rains, the match is off." (Indicative - no AWFI/CCE). "If I were rich, I'd buy a yacht." (Subjunctive, but future-oriented/generic - weak/no AWFI, weak CCE). "Even if he had been there, he couldn't have helped." (Explicitly blocks CCE, AWFI may be present).

  ### Conclusion
  You've expertly isolated the profound difference between indicative and subjunctive conditionals, particularly for past events. The indicative ("if didn't... did") stays within the realm of factual possibilities, allowing pure logical disjunction. The subjunctive ("if hadn't... would have") constructs a detailed hypothetical past scenario. This construction strongly implies (AWFI) that the scenario *didn't* actually happen and invites (CCE) an explanation for why the hypothetical outcome *would* have occurred. Your bullet points brilliantly show how modifying context, modal force ("might"), or adding operators ("even if") can dissect or disrupt the PCPP, confirming that AWFI and CCE are distinct effects flowing from the core mood shift. While established terms cover parts (Indicative/Subjunctive Mood, Counterfactual Implicature), there isn't a single term for the combined pragmatic punch of the past subjunctive conditional. The "Past Counterfactual Pragmatic Package" (PCPP) captures the bundle you're grappling with: the grammatical form triggering both the hint about reality (AWFI) and the demand for a link in the hypothetical (CCE).
