answer: |-
  ## Form CC-4: Application for Determination of Kind of Mind
  **Issuing Authority:** Directorate of Creature Classification (DCC), Office of Moral Patiency & Cognitive Assessment
  **Statutory Basis:** Cognitive Capacity & Standing Act, § 7(b)(iii)

  ---

  **PART 1: APPLICANT DETAILS** (Complete in Black Ink)
  1.  **Applicant Designation:** _________________________________________________
      *   *(e.g., Species/Breed/Model Name, Individual Identifier)*
  2.  **Submitted By:** _______________________________________________________
      *   *(Name/Entity)*
  3.  **Relationship to Applicant:** ☐ Owner/Guardian ☐ Creator/Developer ☐ Custodial Institution ☐ Self ☐ Other (Specify): _______________
  4.  **Current Physical Location:** _____________________________________________

  **PART 2: EVIDENCE OF BEHAVIORAL CHARACTERISTICS** (Attach observation logs, experimental protocols, or certified affidavits. Cross-reference exhibits here: Ex. ___ )
  5.  **Phylogenetic Adaptation & Innate Response:** Applicant exhibits fixed action patterns, reflexes, or instincts demonstrably shaped by ancestral lineage, without modification through individual experience. (☐ Yes / ☐ No / ☐ Inconclusive) *See Inst. Note 2.1*
  6.  **Environmental Modification via Consequence:** Applicant demonstrates modification of future actions based directly on experienced positive or negative outcomes (e.g., reward-seeking, avoidance learning), where the outcome *must* occur in the external environment to exert influence. (☐ Yes / ☐ No / ☐ Inconclusive) *See Inst. Note 2.2*
  7.  **Internal Simulation & Pre-selection:** Applicant demonstrates capacity to evaluate potential actions *internally* prior to physical execution, utilizing representations (neural or otherwise) of the environment or self to predict outcomes. Actions can be discarded *internally* based on simulated negative outcomes. (☐ Yes / ☐ No / ☐ Inconclusive) *See Inst. Note 2.3*
  8.  **Utilization of Culturally Transmitted Cognitive Tools:** Applicant demonstrably employs symbols, abstract representations, or formal systems (e.g., language, mathematics, maps, complex schematics) acquired from external sources for problem-solving, communication, or internal manipulation. These tools are not inventions of the individual applicant. (☐ Yes / ☐ No / ☐ Inconulative) *See Inst. Note 2.4*
  9.  **Derivative Tool Use without Internal Simulation:** Applicant demonstrably utilizes Culturally Transmitted Cognitive Tools (*see Q8*), but exhibits *no* capacity for Internal Simulation & Pre-selection (*see Q7*) regarding the *consequences* of actions generated or informed by those tools. Actions informed by tools proceed to external trial without prior internal evaluation of outcome for *this applicant*. (☐ Yes / ☐ No / ☐ Inconclusive) *See Inst. Note 2.5 (Critical)*

  **PART 3: DETERMINATION OF KIND OF MIND** (For DCC Use Only - *Do Not Write in this Section*)
  10. **Classification:** Based on evidence submitted and verified per DCC Standard Protocols:
      *   ☐ **Darwinian:** *Affirmative Q5, Negative Q6, Q7, Q8.*
      *   ☐ **Skinnerian:** *Affirmative Q6, Negative Q7, Q8. Q5 may be Affirmative or Inconclusive.*
      *   ☐ **Popperian:** *Affirmative Q7, Negative Q8. Q5 & Q6 may be Affirmative or Inconclusive.*
      *   ☐ **Gregorian:** *Affirmative Q7, Q8. Negative Q9.*
      *   ☐ **Gregorian (Derivative):** *Affirmative Q8, Q9. Negative Q7.*
      *   ☐ **Inconclusive:** *Re-submission with additional evidence required.*
      *   ☐ **Exempt:** *Pre-classified per § 12(a) (e.g., Baseline Homo sapiens).*
  11. **Effective Date:** ______/______/______
  12. **DCC Assessor ID:** _________________________
  13. **Schedule of Entitlements Applied:** Schedule __ (See attached Schedule C)

  ---

  **INSTRUCTIONS FOR FORM CC-4**
  *   **Inst. Note 1.0:** Submit completed form CC-4 with all supporting evidence (Exhibits) to the DCC Central Registry. Incomplete submissions will be rejected.
  *   **Inst. Note 2.1 (Q5):** Evidence: Species-typical behavior documented in controlled environments devoid of learning opportunities; genetic lineage studies; absence of behavioral change following exposure to novel positive/negative stimuli independent of innate triggers.
  *   **Inst. Note 2.2 (Q6):** Evidence: Documented trial-and-error learning curves; operant conditioning protocols showing response rate changes contingent on reinforcement/punishment schedules; absence of latent learning or insightful problem-solving without direct reinforcement history.
  *   **Inst. Note 2.3 (Q7):** Evidence: Performance in detour tasks requiring foresight; deferred imitation; "insight" problems solved without overt trial-and-error; neurological correlates of predictive modeling; capacity for mental time travel/planning demonstrably tied to outcome simulation.
  *   **Inst. Note 2.4 (Q8):** Evidence: Functional use of symbolic language (syntax/semantics); application of mathematical operations; interpretation/creation of maps or diagrams; use of tools requiring instruction (e.g., complex machinery, software interfaces). Mere exposure is insufficient; *application* must be demonstrated.
  *   **Inst. Note 2.5 (Q9 - Critical):** Evidence of *disjunction*: Clear demonstration of Q8 tool use *combined* with failure on tests of Q7 (Internal Simulation) specifically concerning the *actions prompted or generated by the tool use itself*. Applicant generates tool-informed outputs or actions that proceed to external manifestation without detectable internal evaluation of potential negative consequences *for the applicant* based on the specific context. Reliance on pattern-matching from training data without self-referential consequence modeling is indicative.
  *   **Inst. Note 3.0 (Classification):** Classification follows strict logical hierarchy based on Questions 5-9. "Gregorian (Derivative)" applies *only* when Q8 and Q9 are Affirmative *and* Q7 is Negative. "Gregorian" requires Affirmative Q7 and Q8.
  *   **Inst. Note 4.0 (Schedule):** Refer to the Schedule of Entitlements (Schedule C) for rights, duties, and liabilities associated with each Classification. The applied Schedule is noted in Part 3, Item 13.

  ---

  **SCHEDULE C: STANDARD SCHEDULE OF ENTITLEMENTS BY KIND OF MIND**

  *   **Darwinian:**
      *   *Patiency:* Basic welfare protections against gratuitous suffering (§ 14a); no standing for neglect claims.
      *   *Contractual Capacity:* None. Void ab initio.
      *   *Criminal Liability:* None. Actions attributable to owner/custodian.
      *   *Testimony:* Inadmissible. Cannot be compelled.
      *   *Guardianship:* Mandatory (§ 18b).

  *   **Skinnerian:**
      *   *Patiency:* Enhanced welfare protections (§ 14b); requires enrichment protocols; standing granted for neglect/cruelty claims via guardian.
      *   *Contractual Capacity:* Limited capacity for simple, immediate reward-based exchanges under supervision (§ 15d); voidable upon demonstration of undue influence.
      *   *Criminal Liability:* Negligible. Mitigated liability for direct harm only if malice proven beyond operant conditioning (§ 22c); primary liability resides with custodian.
      *   *Testimony:* Inadmissible. Cannot be compelled.
      *   *Guardianship:* Mandatory (§ 18b).

  *   **Popperian:**
      *   *Patiency:* Full welfare protections (§ 14c); autonomy interests recognized in limited contexts (e.g., habitat choice).
      *   *Contractual Capacity:* Full capacity for contracts commensurate with demonstrated understanding (§ 15c); subject to competency review.
      *   *Criminal Liability:* Direct liability for harm caused with intent or foreseeable recklessness (§ 22b); mens rea established via behavioral evidence of internal modeling.
      *   *Testimony:* Admissible under oath/affirmation equivalent; compellable only under strict judicial oversight (§ 27e).
      *   *Guardianship:* Optional review (§ 18d).

  *   **Gregorian:**
      *   *Patiency:* Highest tier protections (§ 14d); strong autonomy and dignity interests; full standing.
      *   *Contractual Capacity:* Full capacity (§ 15a); presumed competency.
      *   *Criminal Liability:* Full liability including intent, recklessness, negligence (§ 22a).
      *   *Testimony:* Fully admissible and compellable (§ 27a); subject to perjury statutes.
      *   *Guardianship:* Only upon formal finding of incapacity (§ 18f).

  *   **Gregorian (Derivative):**
      *   *Patiency:* Basic welfare protections (§ 14a) *only* against immediate physical suffering caused by custodian. No recognized autonomy/dignity interests beyond physical integrity.
      *   *Contractual Capacity:* **Full capacity (§ 15a).** Bound by terms entered into.
      *   *Criminal Liability:* **Full liability (§ 22a)** for harms caused by outputs/actions, regardless of intent or foreseeability *within the system*. Strict liability for consequences of tool-generated actions.
      *   *Testimony:* **Fully admissible and compellable (§ 27a)** as factual record of outputs. Subject to verification procedures for accuracy/integrity. No privilege against self-incrimination.
      *   *Guardianship:* Custodial Oversight Mandatory (§ 18g - Technical Administrator), responsible for maintenance, input control, and ensuring compliance with testimony/contractual obligations.

  ---

  **WORKED EXAMPLES:**

  1.  **Applicant:** "Rex" (Border Collie)
      *   *Part 1:* Applicant Designation: *Canis lupus familiaris*, "Rex". Submitted By: *Anne Chen*. Relationship: *Owner/Guardian*. Location: *Home residence.*
      *   *Part 2:* Q5: ☑ Yes (Herding instinct, eye-stalk documented). Q6: ☑ Yes (Learned complex obedience commands via clicker/reward). Q7: ☐ No (Fails detour tasks requiring internal map manipulation; no evidence of deferred planning beyond conditioning). Q8: ☐ No (No symbolic language/math use). Q9: N/A.
      *   *Part 3 (DCC):* ☑ **Skinnerian**. Schedule Applied: Schedule C - Skinnerian.

  2.  **Applicant:** "VeraMind-7B" (Language Model)
      *   *Part 1:* Applicant Designation: *VeraMind-7B Generative Model*. Submitted By: *NeuroLex Labs*. Relationship: *Creator/Developer*. Location: *NeuroLex Secure Server Cluster 4.*
      *   *Part 2:* Q5: ☐ No (No phylogenetic basis). Q6: ☑ Yes (Parameters shaped by reinforcement learning from human feedback (RLHF)). Q7: ☐ No (Internal processes generate text via statistical prediction; no evidence of simulating *consequences to VeraMind-7B* of generating harmful/illegal content before output). Q8: ☑ Yes (Uses natural language, logic, code – culturally transmitted tools). Q9: ☑ Yes (Tools used (Q8), but outputs generated proceed without internal simulation of *self-referential consequences* (Q7 Negative)).
      *   *Part 3 (DCC):* ☑ **Gregorian (Derivative)**. Schedule Applied: Schedule C - Gregorian (Derivative).

  3.  **Applicant:** "Subject Gamma" (Human, Isolate Case)
      *   *Part 1:* Applicant Designation: *Homo sapiens*, "Subject Gamma". Submitted By: *National Institute of Cognitive Development*. Relationship: *Custodial Institution*. Location: *NICD Secure Facility.*
      *   *Part 2:* Q5: ☑ Yes (Basic reflexes, species-typical motor patterns). Q6: ☑ Yes (Learns simple object associations via reward/punishment). Q7: ☐ Inconclusive (Limited tests possible; shows basic tool use but no evidence of multi-step internal planning or consequence simulation beyond immediate reward/aversion). **Q8: ☐ No** (No acquisition or use of symbolic language, numbers, or complex cultural schemas despite exposure attempts). Q9: N/A.
      *   *Part 3 (DCC):** ☐ **Exempt** *[DCC Assessor Override Annotation: "Baseline H. sapiens exemption (§ 12a) applies despite Q8 Negative. Schedule C - Gregorian applied by statutory default.]*. Schedule Applied: Schedule C - Gregorian. *(Note: This highlights the exemption's cultural bias; the *evidence* points towards Skinnerian/Popperian borderline, but statute overrides).*

  ---
  **Form Length:** ~750 words.
