answer: |-
  ### Scenario: Lab Test Ambiguity  
  A nurse quickly checks a printout for a patient's diagnostic test (H: disease present). The printout is blurry—she sees a "+" but isn't sure if it’s positive (E) or a smudged "–". She recalls the machine was glitchy earlier (C: test reliable). Prior: P(H)=0.4, P(E)=0.5, P(C)=0.9. H and E correlate: P(H|E)=0.6 > P(H)=0.4. The blur raises P(E) to q=0.85 and crashes P(C) to 0.4 (Δ=0.5).  

  ### Joint Distribution (H×C×E)  
  | H | C | E | P   |  
  |:-:|:-:|:-:|:----|  
  | T | T | T | 0.36 |  
  | T | T | F | 0.04 |  
  | T | F | T | 0.03 |  
  | T | F | F | 0.01 |  
  | F | T | T | 0.24 |  
  | F | T | F | 0.06 |  
  | F | F | T | 0.15 |  
  | F | F | F | 0.11 |  
  *(P(H)=0.4, P(E)=0.5, P(C)=0.9; no zeros)*  

  ### Verdicts  
  **(a) P(H|E)** = P(H,E)/P(E) = (0.36+0.03)/0.5 = **0.78** > 0.4  
  **(b) Coarse Jeffrey** (over {E,¬E}):  
  - New P(H) = q·P(H|E) + (1-q)·P(H|¬E) = (0.85)(0.78) + (0.15)(0.05/0.5=0.1) ≈ **0.67** > 0.4  
  **(c) Fine Jeffrey** (over {E,¬E}×{C,¬C}):  
  - Rigidity per partition cell: e.g., P(H|E,C) = 0.36/(0.36+0.24)=0.6, P(H|E,¬C)=0.03/(0.03+0.15)=0.166  
  - New P(H) = Σ [New P(cell) · P(H|cell)] = (New P(E,C)·0.6) + (New P(E,¬C)·0.166) + ...  
    Given New P(E)=0.85, New P(¬E)=0.15, New P(C)=0.4 → New P(E,C)=0.85·0.4=0.34, etc.  
    = (0.34·0.6) + (0.51·0.166) + (0.06·0.4) + (0.09·0.1) ≈ **0.32** < 0.4  
  Gap: |0.67 - 0.32| = 0.35 > 0.1.  

  ### Strict Conditionalizer  
  She assigns likelihoods to the *total experience* (e.g., "blurred '+'-like shape"). Likelihoods correlate E and C (e.g., blur *lowers* P(C) and *raises* P(E)), so she infers the joint shift to {E,¬C} (where P(H|E,¬C)=0.166 is low), matching (c).  

  ### Load-Bearing Feature  
  **Channel meaning shift under ¬C**: When C fails (test botched), E (positive read) is *adverse* for H (P(H|E,¬C)=0.166 ≪ prior). Rigidity over {E,¬E} fails because ¬E and ¬C interact evidentially.  

  ### Removal Test: Uninformative Off-Channel  
  If off-channel E were uninformative (P(H|E,¬C)=P(H|¬C)=0.25), fine update gives P(H)≈0.51—*attenuated* from (b)'s 0.67 but *no reversal*. Reversal requires E|¬C to be *bad news*.  

  ### Jeffrey Partisan's Reply  
  *"You applied rigidity to a partition {E,¬E} known to be heterogeneous—a user error, not rule failure."* **Yes, this concedes your thesis**: Rigidity’s legitimacy *depends* on pre-selecting a partition where evidence is "uniform," which *is* the work.  

  ---
  **Word count**: Scenario 90, Verdicts/Arithmetic 200, Follow-ups 240.
