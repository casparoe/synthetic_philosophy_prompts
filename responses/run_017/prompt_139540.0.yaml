answer: |-
  ### **Decision Procedure for Contradictory Patient Data**  
  **One-Page Ops Wiki Guide + Laminated Card Flowchart**  

  #### **Step 1: Normalize & Check for Pseudo-Contradictions**  
  **Question:** "Are the values *truly* contradictory, or can they coexist under different contexts?"  
  - **Sufficient Answer:**  
    - **NO (Pseudo-Contradiction):** Values are contraries (e.g., "allergy to NSAIDs" vs. "no known allergies" – both can be false if only penicillin allergy exists) or differ in granularity/time (e.g., "admitted to cardiology" vs. "discharged from oncology" on the same day).  
    - **Resolution:** Display both values with context labels (e.g., "Admitted: Cardiology | Discharged: Oncology"). **No quarantine.** Proceed to blast radius rules.  
    - **Stop & Auto-Merge?** YES – if resolved.  

  #### **Step 2: Apply Temporal Reconciliation**  
  **Question:** "Is one value outdated by a newer, *authoritative* source?"  
  - **Sufficient Answer:**  
    - **YES:** Newer value overrides older if:  
      - Both from non-clinician sources (e.g., automated lab feeds).  
      - Newer value is clinician-entered AND older is non-clinician.  
    - **NO:** Proceed to Step 3.  
    - **Resolution:** Display newer value; archive older as "historical." **No quarantine.**  
    - **Stop & Auto-Merge?** YES – if resolved.  

  #### **Step 3: Execute Per-Field Safety Rules**  
  **Question:** "Is this field on the Critical Safety List?" (See laminated card for list.)  
  - **Critical Fields (e.g., allergies, critical meds, consents):**  
    - **Resolution:** Take the **safest value** (e.g., assume allergy exists, med is active if risk of harm).  
    - **Blast Radius:** No downstream marking – safety justifies override.  
  - **Non-Critical Fields (e.g., address, non-critical labs):**  
    - **Resolution:** Take the **newest value**.  
    - **Blast Radius:** No downstream marking.  
  - **Stop & Auto-Merge?** YES – if field has a rule.  

  #### **Step 4: Escalate to Human**  
  **Question:** "Does the contradiction persist after Steps 1–3?"  
  - **Escalate IF:**  
    - Clinician-entered data conflicts (e.g., MD note vs. MD note).  
    - Both values are defensible under different rulebooks (e.g., consent for treatment vs. research).  
    - Field lacks a safety rule AND sources are equally reliable/timely.  
  - **Resolution:**  
    - Quarantine field; display **BOTH values** with "CONFLICT" flag.  
    - Handoff note: "Specify risk tolerance: e.g., false allergy (harm = under-treatment) vs. missed allergy (harm = anaphylaxis)."  
  - **Stop & Auto-Merge?** NO – human must decide.  

  ---

  ### **Blast Radius Rules**  
  - **When Field is Quarantined (Escalated):**  
    - **Downstream Marking:** Any derived value (e.g., drug interaction score using a quarantined med flag) carries a "⚠️ Source Contested" flag.  
    - **Drop Marker When:**  
      - Human resolves the conflict.  
      - Contested source is replaced/voided in source system (e.g., lab system corrected).  
  - **Exceptions:**  
    - Safety-rule resolutions (Step 3) **never** propagate flags.  
    - Pseudo-contradictions (Step 1) **never** propagate flags.  

  ---

  ### **Key Distinctions Preserved**  
  1. **Pseudo vs. Real Contradictions:** Kept (Step 1 filters contraries/granularity mismatches).  
  2. **"Don’t Know" vs. "Both True":** Kept but **pragmatically merged**:  
     - "Both true" (e.g., consent for treatment ≠ consent for research) escalates to human (Step 4).  
     - "Don’t know" escalates identically – same operational outcome.  
     - **Why?** Display systems can’t show "both" in a single field; risk ownership requires human judgment.  

  #### **Deliberately Discarded Distinction**  
  - **"Contradiction as Error" vs. "Dialetheic Truth":**  
    - Compliance’s view ("always an error") and dialetheism ("sometimes true") lead to identical actions: quarantine and human review.  
    - **Why?** Operational workflow depends on *source trustworthiness*, not philosophical truth.  

  ---

  ### **Case Studies**  
  #### **Case 1: Penicillin Allergy**  
  - Sources: `2011 intake (rash)`, `2019 clinic test (none)`, `2023 resident (none)`.  
  - **Procedure:**  
    1. **Step 1:** Real contradiction (allergy vs. none).  
    2. **Step 2:** 2023 entry newest, but 2019 test is clinician-entered.  
    3. **Step 3:** Critical field → take safest value: **keep allergy**.  
    4. **Blast Radius:** No downstream flag (safety rule override).  
  - **Outcome:** Display "Penicillin allergy"; document 2019 test in audit trail.  

  #### **Case 2: Anticoagulant Medication**  
  - Sources: `Active w/ refill (yesterday)`, `Discontinued due to bleeding (3 days ago)`.  
  - **Procedure:**  
    1. **Step 1:** Real contradiction (active vs. discontinued).  
    2. **Step 2:** Refill is newer, but discharge summary is clinician-entered → **escalate (Step 4)**.  
    3. **Quarantine:** Field marked "CONFLICT"; downstream alerts (e.g., bleeding risk scores) flagged.  
  - **Cost:** Delayed reconciliation; clinician must review. Team will hate this, but safety demands it – automated "newest" could kill the patient.  

  #### **Case 3: Consent Field**  
  - Sources: `Treatment consent (yes)`, `Research consent (no)`, but source system has one yes/no box.  
  - **Procedure:**  
    1. **Step 1:** Pseudo-contradiction (different contexts).  
    2. **Step 6:** Cannot display both in one field → **escalate (Step 4)**.  
    3. **Handoff Note:** "Specify which consent the field represents (treatment/research). Default: prioritize treatment consent."  
  - **Outcome:** Human must map to source system’s flawed schema.  

  ---

  ### **Test Cases for New Hires**  
  1. **Two addresses:** Current from EHR (2023), old from lab system (2020).  
     *→ Resolution: Step 2 (temporal) → auto-merge 2023 address.*  
  2. **Allergy field:** "No known allergies" (MD, 2024) vs. "Morphine allergy" (nurse, 2023).  
     *→ Resolution: Step 3 (critical) → keep allergy; no escalate.*  
  3. **Lab result:** Glucose 150 (venous) and 110 (fingerstick) at same time.  
     *→ Resolution: Step 1 (pseudo) → flag both with collection methods.*  
  4. **Medication:** "Active" (pharmacist) vs. "Discontinued" (MD) same day.  
     *→ Resolution: Step 4 → escalate (clinician conflict).*  
  5. **Consent:** "Yes" (treatment) vs. "No" (research) in one field.  
     *→ Resolution: Step 4 → escalate (both defensible).*  

  ---

  ### **What This Procedure Can’t Do (Future Failure Modes)**  
  1. **Hidden Source Corruption:**  
     - E.g., a silent bug in the intake tool mangles dates → undetected pseudo-contradictions.  
     - **Monitor:** Audit logs for source system version changes.  
  2. **Over-Reliance on Safety Rules:**  
     - E.g., "always take alarming allergy" ignores a specialist’s override → false positives.  
     - **Mitigate:** Quarterly reviews of safety rule outcomes.  
  3. **Blast Radius Cascade:**  
     - Complex derived fields (e.g., predictive risk scores) may retain flags after source resolution.  
     - **Fix:** Build "flag reset" triggers in data pipeline.  
  4. **Human Escalation Bottlenecks:**  
     - Unclear ownership for values-based decisions (e.g., consent) → delays.  
     - **Solve:** Pre-define risk owners (e.g., compliance for consent, MD for meds).  

  ---

  ### **Laminated Card Summary**  
  ```plaintext
  1. NORMALIZE: Same value? → Merge.  
  2. TEMPORAL: Newer overrides? → Display it.  
  3. SAFETY RULE: Critical field? → Take safest. Non-critical? → Take newest.  
  4. ESCALATE: Clinician conflict/both true? → Quarantine & flag downstream.  
  BLAST RADIUS: Flag derived data until human resolves.  
  ```  
  **Critical Safety Fields:** Allergies, Meds, Consents, Critical Labs. (Full list in wiki.)  

  This procedure enforces consistency, bakes in safety, and forces explicit ownership of ambiguity – without requiring your team to become logicians.
