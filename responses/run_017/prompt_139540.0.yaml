prompt: |-
  Hi — I'm the lead on a four-person data team at a regional hospital network. We run the merge layer that stitches patient charts together from four source systems (two legacy EHRs, a lab system, and a hand-entered intake tool) into the single chart clinicians actually read. We can't change the source systems; we only decide what the merged chart says and what gets shown.

  Our problem is contradictions. Maybe forty a day survive automated matching: a penicillin allergy in the old system and no known allergies in the new one; a medication that's active and discontinued as of the same date; two dates of birth; a consent flag that's yes in one place and no in another; a patient discharged from one service and admitted to another on the same day. Our rulebook right now is basically: take the more recent entry, unless the older one came from a clinician, in which case escalate — plus a hand-written per-field safety rule for about thirty fields (for allergies we keep the more alarming value, for everything else we take the newest). It's forty pages long and nobody trusts it. On top of that, compliance won't let us destroy anything: every conflicting value has to stay auditable, so "resolve it by dropping the loser" isn't available as a data operation, only as a display decision.

  I've been reading about paraconsistent logic and dialetheism and it feels like it's about exactly this — a logic where a contradiction doesn't let you derive everything, and the further claim that some contradictions are actually true — but I can't turn any of it into something my team can run. So: write me a decision procedure we can actually use.

  What I need:

  - The questions to ask in order, and what counts as a sufficient answer to each. We've got maybe three to five minutes per flag and the team are data stewards, not logicians, so it has to be a one-page thing for the ops wiki plus a laminated card.
  - Where the procedure stops with a no and refuses to auto-merge, and where it hands off to a human because the question is one of values rather than facts — our risk tolerance for a missed allergy is not the same as for a false one, and somebody has to own that choice explicitly rather than have it buried in a per-field rule.
  - A blast radius rule. When a field is in quarantine, which downstream values have to carry a marker saying they were computed from something contested, and when can we drop the marker? This is the bit I most expect you to get wrong or fudge, and it's the bit the forty-page rulebook is really about.
  - It has to work for someone who thinks a contradiction is always a sign of an error somewhere. Our compliance officer thinks the whole idea of accepting both values is mad, and I need something that doesn't depend on settling that. So: don't assume any contradiction is really true, but do say plainly whether there's a case where the dialetheist-sounding thing — both entries correct under two different rulebooks — actually shows up, and if it does, whether it should change what we do differently from the plain "we don't know which" case.
  - Two distinctions I think must survive the simplification: the one between an apparent contradiction that dissolves once you fix the time-slice, the granularity or the sense of the predicate (including the case where the two values are really contraries that could both be false rather than contradictories), and a real one; and the one between "we don't know which side is right" and "both sides are right." Tell me which distinctions you're deliberately throwing away, and why.
  - Where it's honest about being a judgment call dressed up as a procedure.

  Then run it on three real-shaped cases: (1) penicillin allergy documented in a 2011 intake note as a childhood rash, a 2019 allergy clinic test saying there's no penicillin allergy, and no known allergies entered by a resident in 2023; (2) an anticoagulant that's active in the medication list with a refill yesterday but discontinued because of bleeding in a discharge summary three days ago, with no reconciliation note; (3) a consent field where the patient signed a treatment consent and separately declined research use of their data, and the intake tool has a single yes/no box that got filled in twice with different values. I have a feeling your procedure is going to tell me to do something on the second one that my team will absolutely hate — say it anyway, and say what it costs.

  Finally: give me four or five one-line test cases I can use to check whether a new hire has actually understood the procedure, and tell me what the procedure can't do — the failures I should expect in six months that won't look like failures at first.
reasoning: |-
  We are designing a decision procedure for resolving contradictions in patient data that survives automated matching. The procedure must be implementable by data stewards (not logicians) in 3-5 minutes per flag, must not destroy any data (for audit purposes), and must handle the fact that sometimes both values might be correct under different rulebooks.

  The procedure will be presented as a one-page guide for the ops wiki and a laminated card. It will include:
  1. A step-by-step flowchart of questions.
  2. Clear stopping points for when to refuse auto-merge and escalate to a human.
  3. Rules for "blast radius" (marking downstream data as contested when they depend on a quarantined field) and when to drop the marker.
  4. It must not assume that contradictions are always errors, but also not require accepting that some contradictions are true. We must distinguish between:
     - Apparent contradictions that can be resolved by clarifying time, granularity, or predicate sense (including contraries) vs. real contradictions.
     - "We don't know which is right" vs. "both are right" (though the latter is rare and we might treat it as a special case of the former for practical purposes).
  5. It must be honest about being a judgment call in some places.

  We are going to design the procedure in steps. We'll break it down into a decision tree.

  **Decision Procedure Steps (for each contradiction):**

  1. **Check for Trivial Resolution (e.g., same value in different representations):**
     - Question: Are the conflicting values actually the same when normalized (e.g., "Penicillin" vs. "penicillin", or "01/01/2000" vs. "2000-01-01")?
     - If yes, then merge as same and stop (no contradiction). Else, next.

  2. **Check for Temporal Context (time-slice):**
     - Question: Do the conflicting values apply to different time periods? (e.g., one is current, the other is historical and no longer valid)
     - How: Look at the effective dates (start/end) or the date of the record. If one value is superceded by the other because of time, then the newer one is current and the old one is historical. But note: we cannot destroy the old one, so we mark the current one as the one to display, but keep both with timestamps.
     - If resolved by time, then display the most recent (or current) value and mark the other as historical. The blast radius: only this field is marked as having a historical override (but the displayed value is the recent one). Downstream calculations that use this field do not need to be marked because we are taking the current value as authoritative for the present. However, the historical value remains in the audit trail. Stop.

  3. **Check for Granularity or Scope (predicate sense):**
     - Question: Are the values about the same thing at the same time but at different levels of detail or in different contexts? (e.g., one system records a general category and another a specific subcategory; or one system records for inpatient and another for outpatient)
     - How: Check if the two values are contraries (could both be false) or if they are about different aspects? For example, "allergy to penicillin" and "no known allergies" might be reconciled if "no known allergies" is a default and the allergy is known in a specific context. But note: if the allergy is documented and the "no known allergies" is entered later without acknowledging the allergy, then it's a contradiction.
     - If they are about different contexts, then we might display both with context labels (if the system allows). Otherwise, if they are truly about the same context, then we have a real contradiction and proceed to next step.

  4. **Check for Human Override (per-field safety rule):**
     - We have about thirty fields with hand-written per-field safety rules. We will incorporate these as a step. For example, for allergies: keep the more alarming value (so if one source says allergy and the other says none, we display allergy). For other fields, take the newest.
     - Question: Is there a per-field safety rule for this field?
     - If yes, apply it: either take the safer value (for critical fields) or the newest (for non-critical). Then mark the field as having a resolved contradiction (with the rule applied) and note the rule used. The blast radius: downstream fields that depend solely on this field might be marked as derived from a resolved conflict (if the rule is considered safe enough, we might not mark; but if the rule is a heuristic, we might mark). However, note that compliance requires keeping both, so the display is one value but the audit has both. We do not mark downstream if the rule is considered definitive (like for allergies we take the alarming one because it's safer). But for non-safety fields, we might not mark downstream either because we take the newest and that's our policy. This is a judgment.

  5. **Check for Source Reliability and Clinician Input:**
     - Our current rule: take the more recent, unless the older one came from a clinician, then escalate.
     - We formalize: 
       - Question: Is one of the sources a clinician-entered note (vs. automated or non-clinician entry) and the other not?
       - If yes, and the clinician entry is the older one, then escalate to human (because clinician input might override recency). If the clinician entry is the newer one, then we can take the newer (clinician) one and mark the other as overridden (but keep both). But if the non-clinician entry is newer and the clinician one is older, we escalate because we don't want to override a clinician without human review.

  6. **Check for Both Values Being Correct (Dialetheism?):**
     - This is rare, but we must consider: could both be true in different respects? For example, the patient might have a penicillin allergy in the sense of a rash (so they should avoid it) but also have a negative test (so they are not at risk for anaphylaxis). Or the consent: one yes for treatment and one no for research. 
     - Question: Are the two values actually about two different questions? (e.g., one is about treatment consent and the other about research consent, but the system has only one box). If so, then we have an error in the data model, but we cannot change the source. We must then treat it as a contradiction that cannot be resolved automatically because the single field is being used for two purposes. We must escalate to human to decide which one to display (or if we can split the field in our merged view, but that might not be possible). 
     - If we determine that both are correct but for different aspects, and we cannot represent both in the merged view (because the destination field is a single value), then we must escalate. We cannot represent both, so we have to choose one and mark the field as contested. The blast radius: any downstream field that uses this field must be marked as derived from a contested source.

  7. **Default: Escalate to Human**
     - If none of the above steps resolve the contradiction, then escalate to a human for review.

  **Blast Radius Rules:**
  - When a field is in quarantine (i.e., we have a contradiction that is not fully resolved and we are displaying one value but with an audit trail of the other, or we are marking it as contested), we must mark downstream fields that are computed from this field.
  - Downstream fields must carry a marker if:
     - The computation is deterministic and the contested field is an input (e.g., a calculated risk score that uses the contested field).
     - The marker should be dropped when the contested field is resolved (by a human) or when the downstream field is recalculated after resolution.
     - However, if we applied a per-field safety rule (like for allergies) and we are confident in the rule (because it's safety-critical and we are erring on the side of caution), then we do not mark downstream. The rationale is that the rule is designed to be safe and the downstream use is also safe.

  **Handling the Distinctions:**
  - We are deliberately throwing away the distinction between "we don't know which" and "both are right" in the automated part because in practice, for display, we have to choose one or mark as contested. We treat both cases as needing human review if we cannot resolve by the above steps. The dialetheist case is rare and will be caught in step 6, which then escalates because we cannot represent both in a single field.

  **The Procedure as a Flowchart (for the laminated card):**

  ```
  Start: Contradiction in field F between value A (from source S1) and value B (from source S2)

  1. Normalize A and B. If they become the same, merge and stop.

  2. Check time: 
     - If A and B have effective dates and one is current (and the other expired), then take the current one for display, mark the other as historical. Stop.

  3. Check granularity/context:
     - If A and B are about different contexts (e.g., inpatient vs outpatient) and we can display both with context, do so and stop.
     - If they are about the same context and are contraries (could both be false) but we have no evidence of that, then proceed to step 4.

  4. Apply per-field safety rule if exists for F:
     - If F is a critical field (like allergy, critical lab, etc.), take the safer value (e.g., for allergy, take the presence of allergy). Mark as resolved by safety rule. Do not mark downstream. Stop.
     - If F is non-critical and the rule says take newest, then take the newest. Mark as resolved by recency. Do not mark downstream. Stop.

  5. Check source:
     - If one source is clinician-entered and the other is not:
          - If the clinician entry is newer, take it and stop.
          - If the clinician entry is older, escalate to human. Mark F as contested. Mark downstream fields that depend on F until resolved. Stop.

  6. Check for both being correct in different senses:
     - If the values are about two different questions (because of a data model issue) and we cannot represent both, escalate to human. Mark F as contested. Mark downstream fields that depend on F until resolved. Stop.

  7. Otherwise, escalate to human. Mark F as contested. Mark downstream fields that depend on F until resolved.
  ```

