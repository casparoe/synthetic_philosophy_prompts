prompt: |-
  You're a statistician who also works on philosophy of science — please think this through carefully, brainstorm a bit before you commit to anything, and don't just hand me a label; I want the carving, not the word.

  I do analytics for a small chain of physio clinics (my sister's a nurse and we argue about this stuff constantly) and I keep hitting the same shape of problem, and I dont have the vocabulary for the differences between the versions. You know the basic trick: a treatment looks worse overall than the control, but looks better inside every subgroup you split by, and the tables look identical whichever way it happens. But I've noticed three versions that feel completely different to me, and I want to know whether the field has separate names for them. Version one is the famous one: the sicker patients get the new procedure more often, so the procedure group is full of hard cases, and once you split by how severe the case was at intake the procedure wins in both the mild and the severe pile. There everyone agrees you quote the split numbers and the overall number is just misleading. Version two: a shoulder rehab program where, overall, the people who did the program had worse function at six months than the people who didn't — but within each band of "how many home exercises per week" the program people did better in every band, and getting people to do the exercises was the entire point of the program, so the bands are partly an effect of the program rather than a preexisting difference between the groups. Here quoting the split numbers feels wrong to me in a way version one doesn't: it's like you subtract the exact thing the program was supposed to cause and then congratulate the program for what's left over. But the table looks the same.

  Version three, which I understand least: sometimes the split variable is recorded later and is itself partly caused by the outcome — splitting by whether the patient was still in pain at the three-week check, or whether they got referred for imaging — and the reversal shows up there too, and my sense is that in this version the split numbers aren't just unhelpful but meaningless, as if I'd manufactured the reversal by cutting on the wrong line. So: do these three have separate established names, or is it all one paradox plus separate background knowledge about what caused what? Is there a term for the version-two mistake specifically — reporting the within-stratum comparison when the stratifier sits downstream of the treatment, so that the comparison answers a different question than the one you asked — and is there a term for the thing you're actually trying to estimate in that case? Where do the edges fall: what about a stratifier that is both, partly a reason people ended up in the treatment group and partly caused by the treatment (an exercise habit that reflects prior motivation and is also boosted by the program)? Is either number right there, and can you get at the right quantity from the kind of data I actually have, or is it just not identifiable? And if some of these genuinely have no name, coin one and give me its definition and its boundary cases — what I actually care about is being able to tell the three apart in a real dataset, not having a word to drop.
reasoning: |-
  We are dealing with three versions of Simpson's paradox, but each with different causal structures. The key is to recognize that the reversal of association when conditioning on a third variable (the stratifier) can be misleading if we do not account for the causal role of that variable. Let's break down each version:

  ### Version 1: Confounding by Severity
  - **Description**: The overall effect shows the treatment as worse, but within each severity subgroup (e.g., mild and severe cases) the treatment appears better. The issue is that the treatment group has a higher proportion of severe cases, which have worse outcomes regardless of treatment.
  - **Causal Structure**: Severity is a confounder. It affects both the treatment assignment (sicker patients are more likely to get the new procedure) and the outcome (severity affects recovery). Therefore, the overall comparison is confounded.
  - **Resolution**: Adjusting for severity (e.g., by reporting within-stratum effects or using a model that conditions on severity) is appropriate because we are removing the confounding effect. The within-stratum estimates are valid for causal inference (under the assumption that we have adjusted for all confounders).

  ### Version 2: The Stratifier is on the Causal Pathway (Mediator)
  - **Description**: The overall effect is negative (the program appears worse), but within each level of exercise adherence, the program appears better. However, the program is designed to increase exercise adherence, which in turn improves outcomes. Thus, exercise adherence is a mediator.
  - **Causal Structure**: The treatment (program) affects the stratifier (exercise adherence) and the outcome (function). The stratifier is also a cause of the outcome. Conditioning on the mediator (exercise adherence) blocks part of the treatment effect (the indirect effect through exercise) and leaves only the direct effect (which might be negative, positive, or zero). The overall treatment effect (total effect) is the sum of the direct and indirect effects.
  - **Problem**: By conditioning on exercise adherence, we are not estimating the total effect of the program. Instead, we are estimating the direct effect (which might be negative if, for example, the program causes fatigue that directly worsens function, but this is offset by the positive effect via exercise). Reporting the within-stratum effects in this case is misleading for the overall program evaluation because it removes the very mechanism (exercise) by which the program works.
  - **Resolution**: We should report the total effect (overall) and then, if we wish, decompose it into direct and indirect effects. However, if the overall effect is negative, the program might not be beneficial overall even if the direct effect (within exercise strata) is positive. The within-stratum estimates are not the primary quantities of interest for evaluating the program.

  ### Version 3: The Stratifier is Affected by the Outcome (Collider) or is a Descendant of the Outcome
  - **Description**: The stratifier is measured after treatment and is influenced by the outcome (e.g., splitting by whether the patient was still in pain at three weeks, which is an indicator of the outcome). The reversal appears when we condition on this stratifier.
  - **Causal Structure**: Conditioning on a variable that is affected by both the treatment and the outcome (or by the outcome alone) can induce a spurious association. This is known as collider bias or M-bias. In this case, the stratifier (e.g., pain at three weeks) is a collider if it is caused by both the treatment and the outcome (or by the outcome and other factors). Alternatively, if the stratifier is a measure of the outcome itself (or a consequence of the outcome), then conditioning on it is conditioning on a post-outcome variable.
  - **Problem**: The within-stratum associations are biased because conditioning on the collider opens a path that induces an association between treatment and outcome that does not reflect the causal effect. This can create a reversal even when there is no true effect. The split numbers are not just unhelpful but potentially misleading and should not be used.
  - **Resolution**: Avoid conditioning on such stratifiers. The overall effect (if unconfounded) is the estimate we want. If we are interested in the effect of treatment on the outcome, we should not condition on a variable that is a consequence of the outcome.

  ### Terminology and Distinctions:
  1. **Version 1**: This is the classic **Simpson's paradox** due to **confounding**. The resolution is to condition on the confounder (severity) to get unbiased estimates of the treatment effect within levels of the confounder. The within-stratum effects are the causal effects of interest (if there is no other confounding).

  2. **Version 2**: This is an example of **conditioning on a mediator**. The issue is that we are not estimating the total causal effect of the treatment. The within-stratum effects are the **controlled direct effects** (if we condition on the mediator at a fixed level) but not the total effect. There is no universal name for the mistake of reporting these as the primary effect, but it is sometimes called **overadjustment for a mediator** or **blocking the causal pathway**. The term **"mediation paradox"** might be used, but it is not standard. The total effect is the quantity of interest for program evaluation.

  3. **Version 3**: This is an example of **conditioning on a collider** or **post-treatment variable** (if the stratifier is affected by the outcome). This induces **collider bias** (or **M-bias**). The within-stratum associations are biased and should not be used. The term **"selection bias"** is sometimes used when the conditioning is on a variable that is a consequence of the outcome (e.g., conditioning on having been referred for imaging, which depends on the outcome).

  ### Boundaries: Stratifier that is Both Confounder and Mediator?
  In practice, a stratifier might be both a confounder (affecting treatment assignment and outcome) and a mediator (on the causal pathway from treatment to outcome). For example, an exercise habit that is influenced by prior motivation (confounder) and also by the program (mediator). This is a complex scenario.

  - **Causal Structure**: The variable (exercise habit) is a **confounder** because prior motivation (which we might not have measured) affects both exercise habit and the outcome. It is also a **mediator** because the treatment (program) affects exercise habit, which then affects the outcome. This is a case of **treatment-confounder feedback** or **time-dependent confounding** (if we have longitudinal data).

  - **Resolution**: Standard conditioning (stratification) will not give us the total effect of the program because:
    - Conditioning on exercise habit adjusts for its confounding effect (good) but also blocks the mediation pathway (bad).
    - Not conditioning leaves the confounder unadjusted (bad).

    This is a situation where we need more advanced methods, such as **inverse probability weighting** or **g-methods** (e.g., the g-formula, structural nested models) to estimate the total effect. Without longitudinal data and careful measurement of confounders, the effect might not be identifiable.

  ### Summary of Terms:
  - **Version 1**: **Confounding bias** (resolved by conditioning).
  - **Version 2**: **Mediation** (do not condition on the mediator for total effect; report total effect and consider mediation analysis if decomposition is needed).
  - **Version 3**: **Collider bias** (do not condition on the collider or post-outcome variable).

  ### Coined Terms for Version 2 and Version 3 Mistakes:
  - For Version 2: The mistake of reporting the within-stratum effect when the stratifier is a mediator might be called **"mediator overadjustment"** or **"path-blocking bias"**.
  - For Version 3: The mistake of conditioning on a variable that is a consequence of the outcome might be called **"outcome-conditional selection bias"** or **"post-outcome conditioning"**.

  ### Practical Advice:
  - Always draw a causal diagram (DAG) to understand the role of the stratifier.
  - For Version 1: Report the adjusted (within-stratum) estimates.
  - For Version 2: Report the total effect. If you want to understand mechanisms, do a mediation analysis (but report both total and direct effects).
  - For Version 3: Do not condition on the stratifier. Use the overall effect (if unconfounded) or find a way to avoid conditioning on post-outcome variables.

  In your data, if you are unsure, try to gather information on the temporal ordering and the causal structure. Without that, it is hard to know which scenario you are in.
answer: |-
  ### Conceptual Breakdown and Terminology

  You've identified three distinct causal structures behind Simpson's paradox reversals. The core issue isn't the statistical pattern itself (which looks identical in all cases) but **the causal role of the stratifying variable**. I'll define each scenario, provide established terms where they exist, coin new terms where needed, and clarify boundaries. Crucially, the key distinction lies in whether the stratifier is a **confounder**, **mediator**, or **collider** in the causal path.

  ---

  ### **Version 1: Stratifier as Confounder**  
  **Description**:  
  - Sicker patients preferentially receive Treatment A.  
  - Overall, Treatment A appears worse due to more severe cases in its group.  
  - Within each severity subgroup, Treatment A performs better.  

  **Causal Structure**:  
  ```mermaid
  graph LR
      S[Severity] --> T[Treatment]
      S --> O[Outcome]
      T --> O
  ```  
  Severity (S) causes both treatment assignment (T) and outcome (O), making it a **confounder**.  

  **Established Terms**:  
  - **"Confounding by indication"** (clinical epidemiology).  
  - **"Simpson's paradox due to confounding"** (statistics).  

  **Resolution**:  
  - **Within-stratum estimates are valid** for the causal effect of treatment.  
  - Report subgroup effects or use adjusted estimators (e.g., standardization, IP weighting).  
  - Boundary Case: If severity is measured with error, residual confounding may persist.  

  ---

  ### **Version 2: Stratifier as Mediator**  
  **Description**:  
  - A shoulder rehab program (Treatment) aims to increase exercise adherence (Stratifier).  
  - Overall, the program group has worse outcomes.  
  - Within each exercise-adherence stratum, the program performs better.  

  **Causal Structure**:  
  ```mermaid
  graph LR
      T[Treatment] --> E[Exercise Adherence]
      T --> O[Outcome]
      E --> O
  ```  
  Exercise adherence (E) is a **mediator**: part of the causal pathway from treatment (T) to outcome (O).  

  **Established Terms**:  
  - **"Mediation paradox"** (less common).  
  - **"Overadjustment for a mediator"** (causal inference).  
  - **Mistake**: Reporting the conditional effect (within strata) as the total treatment effect.  

  **Coined Term for the Mistake**:  
  - **"Path-erasure bias"**: Erasing the mediated pathway (the treatment's intended mechanism) by conditioning on the mediator.  

  **Target Quantity**:  
  - You want the **total effect** of treatment (direct + indirect effects), not the **controlled direct effect** (effect within exercise strata).  
  - **Total effect** = (Effect of program) → (Exercise) → (Outcome) + (Effect of program → Outcome bypassing exercise).  

  **Resolution**:  
  - Do not condition on the mediator for primary inference.  
  - Use mediation analysis (e.g., g-computation, structural models) to decompose total/direct effects.  
  - Boundary Case: If exercise adherence is *both* a confounder and mediator (e.g., prior motivation affects exercise and treatment choice), use **g-methods** (e.g., marginal structural models) or longitudinal techniques.  

  ---

  ### **Version 3: Stratifier as Collider or Outcome Proxy**  
  **Description**:  
  - Stratifier (e.g., "pain at 3 weeks" or "referred for imaging") is measured post-treatment.  
  - The reversal appears when conditioning on this variable, but the association is spurious.  

  **Causal Structure**:  
  ```mermaid
  graph LR
      T[Treatment] --> O[Outcome]
      T --> C[Collider, e.g., Pain at 3w]
      O --> C
  ```  
  Here, the stratifier (C) is a **collider**: caused by both treatment (T) and outcome (O). Conditioning on C induces artificial association between T and O.  

  **Established Terms**:  
  - **"Collider bias"** or **"M-bias"** (causal inference).  
  - **"Selection bias"** if stratifier affects study inclusion (e.g., conditioning on patients who returned for 3-week check).  

  **Why Meaningless?**  
  - Conditioning on a collider opens a non-causal path between T and O (e.g., T → C ← O creates T ↔ O association).  
  - The stratifier is downstream of the outcome, making it a **proxy for outcome itself**.  

  **Resolution**:  
  - **Never condition on post-outcome variables**.  
  - Use the unadjusted overall effect (if unconfounded).  
  - If stratifier is time-dependent (e.g., pain measured during treatment), use survival analysis or G-methods.  

  ---

  ### **Boundary Cases & Identifiability**  
  #### Case: Stratifier is Both Confounder and Mediator  
  **Example**:  
  - Exercise habit (S) reflects *prior motivation* (confounding) and is *boosted by the program* (mediation).  

  **Causal Structure**:  
  ```mermaid
  graph LR
      U[Unmeasured Motivation] --> S[Exercise]
      U --> T[Treatment]
      T --> S
      S --> O[Outcome]
      T --> O
  ```  

  **Resolution**:  
  - Neither unadjusted nor stratified estimates are unbiased.  
  - **Identifiability**: Requires measuring all confounders (e.g., motivation) or using advanced methods:  
    - **G-methods** (e.g., g-formula, structural nested models) for time-varying confounders.  
    - **Instrumental variables** if a suitable instrument exists.  
  - If motivation is unmeasured, the effect is **not identifiable** from observed data alone.  

  ---

  ### **Practical Guide for Distinguishing in Real Data**  
  1. **Ask causal questions**:  
     - *When was the stratifier determined?*  
       - Pre-treatment → Likely confounder (Version 1).  
       - Post-treatment, pre-outcome → Likely mediator (Version 2).  
       - Post-outcome (or concurrent) → Likely collider (Version 3).  
     - *Could the stratifier be affected by the treatment or outcome?*  
       - If yes, avoid conditioning.  

  2. **Diagnostic Heuristics**:  
     | Version | Mistake to Avoid | Target Quantity |  
     |---------|------------------|----------------|  
     | 1      | Ignoring strata | Conditional effect |  
     | 2      | Path-erasure bias | **Total effect** |  
     | 3      | Collider conditioning | Unadjusted effect |  

  3. **Boundary Test**:  
     - Simulate data where the stratifier is:  
       - (a) Only a confounder,  
       - (b) Only a mediator,  
       - (c) Only a collider.  
     - Check if reversal disappears when stratifier is omitted.  

  ---

  ### **Key Takeaways**  
  - **Version 1 (Confounder)**: Conditioning is necessary.  
  - **Version 2 (Mediator)**: Conditioning biases the total effect; report total effect instead.  
  - **Version 3 (Collider)**: Conditioning creates artificial associations; avoid entirely.  
  - **No One-Size-Fits-All**: The same reversal pattern demands different remedies based on causal structure.  
  - **When in Doubt**: Draw a causal diagram (DAG) to map paths between treatment, outcome, and stratifier.  

  This framework allows you to move beyond labels: it forces interrogation of *why* the reversal occurs, which dictates the correct analytical response. Philosophy of science win: the carving precedes the naming.
