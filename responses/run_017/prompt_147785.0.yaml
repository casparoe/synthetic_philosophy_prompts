prompt: |-
  I'm a fourth-year PhD student in philosophy of science, and I've been asked — as the only person on the committee with any philosophy training — to write the mechanism screen for my university's Interdisciplinary Seed Fund. Twice a year we read about fifty two-page pre-proposals requesting roughly $25,000 of pilot money, on everything from developmental psychology to structural engineering to computational linguistics. The panel is six faculty from different departments plus me; we have a single ninety-minute meeting in which everything gets ranked; and each reviewer sees a given pre-proposal once, for fifteen or twenty minutes, with no outside reading and no opportunity to query the applicant before we meet. What I need from you is a one-page decision procedure that a busy materials scientist or political scientist can run with no philosophical background, together with a short verdict slip — a few lines — that goes into our spreadsheet and, when a proposal is rejected on mechanism grounds, is close to what the chair's office sends back to the applicant. So it has to be usable inside twenty minutes, and it has to be defensible in writing to someone who is annoyed.

  Let me state the target distinction in my own rough terms so you don't have to guess where I'm starting. The first failure I want to catch is the ungrounded explainer: the proposal that accounts for a phenomenon by positing something at or above the level of the phenomenon which does the explaining but is itself unexplained — a striving, a vital force, a homunculus, an inner agent that wants what the organism wants, a capacity named after the very thing to be explained. The second failure is the mirror image, and the one I worry about more, because it is the one my colleagues will commit: dismissing a genuinely explanatory pattern merely because it lives at a higher level and nobody has yet spelled out the machinery under it. Population-level phenomena, optimality principles, and pattern-explanations that can be realized in many different substrates all look hand-wavy to a reviewer who is impatient for a mechanism, and I have watched good proposals die that way. There is a third case I've become convinced is distinct from either of these, and for which I have no name I'm happy with — I've been calling them borrowed cranes: a mechanism that is a real working machine in the domain it was invented in, imported into a new domain without the parts that made it work there. Selection moved from genes to cultural change without any account of what plays the role of faithful copying; representation moved from agents who use models to circuits that have no user; optimization moved from engineered systems with an explicit objective to growing tissue that is not optimizing anything in particular. A borrowed crane passes the tests that catch the first failure and is invisible to the second, and I don't know how to make a non-philosopher see it. My first attempt at a screen was a single question — could you in principle build the thing to be explained out of parts that don't already have the property being explained? — and it failed in both directions: it flagged a solid epidemiology proposal on herd immunity, and it waved through a proposal attributing rising adolescent anxiety to a loss of meaning in modern life, because meaning is not literally the same property as anxiety.

  So: give me the ordered questions the reviewer runs, no more than five or six, each with a statement of what would count as a sufficient answer at the depth a two-page pre-proposal can provide, and with explicit stopping points — where the answer is a no and the proposal is out on mechanism grounds, where it requires only that the applicant fill in a short mechanism box before the panel will rank it, and where it should simply be marked as a legitimate higher-level description that no mechanism is owed yet. Mark the places where the procedure has to hand the question back to a human because it is a question about what we want the fund to be rather than about how explanations work; I suspect how much sheer speculation we are willing to buy is one of these, and I'd like you to say so rather than smuggle in a threshold. Build in a self-check against the procedure's own bias: I have a strong prior that any screen like this will end up rewarding proposals that mention something neural or molecular whether or not the lower-level story actually explains the phenomenon at the level it was described, and I want the sheet to protect against that specifically. Tell me plainly where the procedure will misfire — I'm especially worried about mathematical and optimality explanations, which name no parts and no steps and are sometimes the best account available. Write out the actual verdict slip for each of these three, in the handful of sentences the chair would send:

  1. A psychology and neuroscience proposal: older adults recall emotional events better than neutral ones because the amygdala tags a memory as significant and thereby prioritizes it for consolidation.
  2. A sociology proposal: some neighbourhoods recover from economic shocks faster than others because of collective efficacy, the neighbourhood's shared capacity to exercise informal social control; they will measure it by survey and correlate it with recovery. I genuinely expect the verdict here to be more permissive than I want it to be — I think the construct is close to circular and my philosopher friends agree — and I would rather be told that than have you flatter me.
  3. A biomechanics proposal: the shape of a growing bone is explained by a principle of mechanical optimality, bone adapting so as to minimize strain energy under load.

  Finally, be honest about what the screen cannot do at all, and — since I should disclose that my own dissertation chapter explains the allocation of credit in science by appeal to a norm of credit-worthiness, and is therefore exactly the sort of thing this sheet might bite — tell me in a sentence what it would say about that too, even if the answer is unflattering.
reasoning: |-
  Hmm, this is a fascinating challenge from a philosophy of science PhD student. They need to create a practical mechanism screening tool for interdisciplinary grant proposals that can be used by non-philosophers in tight time constraints. Let me unpack their core concerns.

  The user identifies three distinct failure modes: ungrounded explainers (circular top-level concepts), premature mechanism demands (dismissing valid pattern explanations), and borrowed cranes (imported mechanisms missing key components). Their previous single-question approach failed by rejecting valid herd immunity explanations while accepting vague "loss of meaning" claims.

  Key requirements emerge: a 5-6 step flowchart that fits on one page, produces standardized verdicts, and withstands scrutiny from annoyed applicants. It must specifically guard against neuroscience/molecular bias and handle mathematical/optimality explanations gracefully. The three test cases reveal their anxiety about the tool's real-world application - particularly whether it'll correctly flag the sociology proposal's potential circularity.

  Notable constraints include: 20min per proposal, no external research, and disciplinary diversity among reviewers. The user's meta-concern about their own dissertation being vulnerable suggests they want intellectual honesty over comfort.

  For the decision procedure, I consider structuring it as progressive filters: first catching obvious circularity, then checking for mechanism imports, then assessing explanation level appropriateness. Each step needs clear exit points with specific verdicts. The borrowed crane problem requires particular care - perhaps focusing on whether all critical functions of the original mechanism have analogs.

  The self-bias check is crucial. I should build in explicit reminders that "neural" or "molecular" mentions don't automatically constitute mechanisms. For optimality explanations, the tool must acknowledge their legitimacy while requiring clarity about how the pattern emerges.

  For their dissertation case, the honest answer is that their "credit-worthiness norm" would likely trigger the borrowed crane alert - it imports an agential concept (worthiness) into a systemic context without specifying what "enforces" the norm. But this very vulnerability demonstrates why the tool is needed.

  The verdict slips need surgical precision: for the amygdala example, emphasize that while the mechanism is plausible, the proposal must clarify tagging/consolidation processes. For the sociology case, flag that "collective efficacy" risks circularity unless operationalized independently. The bone optimality case should pass but require articulation of the adaptation process.
answer: |-
  Here’s a streamlined decision procedure (fits on one page) with verdict slips, designed for interdisciplinary reviewers. It targets your three failure modes while guarding against mechanistic bias:

  ---

  ### **Mechanism Screening Tool**  
  *(Run in order; stop at first definitive verdict)*  

  1. **Does the explanation name a *new unexplained entity* (e.g., "striving," "meaning-loss," "collective will")?**  
     - ✅ **Pass if:** The entity is either (a) *measured directly* (e.g., survey scores, biomarkers), or (b) *operationalized* via observable proxies.  
     - ❌ **Reject if:** The entity is invoked as a causal force *with no measurement plan or independent evidence*.  
     *→ **Verdict A: Ungrounded Explainer (Reject)***  

  2. **Is the core mechanism *imported* from another field (e.g., "selection," "optimization," "representation")?**  
     - ✅ **Pass if:** The proposal specifies how *all critical functions* of the original mechanism are replicated (e.g., "copying fidelity" for cultural selection; "error-correction" for neural representation).  
     - ⚠️ **Flag if:** Key supporting parts are missing (e.g., "optimization" without a selection pressure).  
     *→ **Verdict B: Borrowed Crane (Revise & Resubmit)***  

  3. **Does the explanation rely *only* on high-level patterns (e.g., "herd immunity," "optimal shape")?**  
     - ✅ **Pass if:** The pattern is (a) *mathematically formalized*, (b) *empirically validated* in similar contexts, or (c) has *known realizations* in lower-level mechanisms.  
     - ❌ **Reject if:** The pattern is asserted with *no supporting evidence/model* and *no path to mechanistic testability*.  
     *→ **Verdict C: Premature Mechanism Demand (Reject)** — but **override** if pattern is well-established (e.g., thermodynamics in engineering).  

  4. **Is a lower-level mechanism *explicitly mentioned* (e.g., neural, molecular)?**  
     - ✅ **Pass if:** The mechanism *directly links* to the phenomenon (e.g., "amygdala activation → memory consolidation via sleep spindles").  
     - ⚠️ **Flag if:** Lower-level terms are *name-dropped without causal relevance* (e.g., "neurons are involved" without specifics).  
     *→ **Verdict D: Mechanism Incomplete (Revise & Resubmit)***  

  5. **HUMAN JUDGMENT CHECK:**  
     - *Is this proposal *appropriately speculative* for pilot funding?* (e.g., blue-sky math vs. testable sociology).  
     - *Does the mechanism *align with fund goals*?* (e.g., high-risk exploration vs. incremental work).  
     *→ **Verdict E: Panel Discretion (Discuss at meeting)***  

  ---

  ### **Self-Checks Against Bias**  
  - **Neural/molecular trap:** Step 4 explicitly penalizes irrelevant reductionism.  
  - **Mathematical explanations:** Step 3 protects validated formal models (e.g., optimality principles).  
  - **Known misfires:**  
    - Herd immunity (Step 3) passes as validated pattern.  
    - "Loss of meaning" (Step 1) fails as ungrounded entity.  

  ---

  ### **Verdict Slips**  
  *(Copy-paste into spreadsheet; chair uses verbatim for rejections)*  

  **VERDICT A (Ungrounded Explainer):**  
  > *"The proposal posits [entity, e.g., 'collective efficacy'] as explanatory but does not specify how it will be measured or independently validated. Without operationalization, this entity cannot be tested as a mechanism."*  

  **VERDICT B (Borrowed Crane):**  
  > *"The proposed mechanism (e.g., 'selection,' 'optimization') requires supporting components [e.g., copying fidelity, objective function] that are not accounted for in this context. Please specify how these functions operate in your system."*  

  **VERDICT D (Mechanism Incomplete):**  
  > *"While a mechanism [e.g., 'amygdala tagging'] is named, critical causal steps [e.g., how tagging prioritizes consolidation] are unspecified. Elaborate these connections or cite evidence for them."*  

  ---

  ### **Test Cases**  
  1. **Psychology/Neuroscience Proposal:**  
     - Step 1: "Amygdala tagging" is operationalized (fMRI/behavior). ✅  
     - Step 4: "Prioritizes consolidation" is underspecified. ❌  
     → **Verdict D:** *"Specify how tagging alters consolidation (e.g., via sleep phases, synaptic tagging)."*  

  2. **Sociology Proposal:**  
     - Step 1: "Collective efficacy" measured by survey. ✅  
     - Step 2: None (not imported). ✅  
     - Step 3: Pattern-only? No math/validation. ❌  
     → **Verdict A:** *"Shared capacity" is unexplained; surveys measure correlation, not mechanism.*  

  3. **Biomechanics Proposal:**  
     - Step 3: "Minimizes strain energy" is a validated optimality principle. ✅  
     → **NO VERDICT** (Passes screen; no mechanism owed).  

  ---

  ### **Limitations & Your Dissertation**  
  **What the screen CANNOT do:**  
  - Judge plausibility of mechanisms (only coherence).  
  - Evaluate experimental feasibility.  
  - Replace domain expertise for novel fields.  

  **Your dissertation chapter ("credit-worthiness norm"):**  
  > *Likely **Verdict B (Borrowed Crane)**: The mechanism ("norm") is imported from social theory without specifying how it is enforced or measured in credit allocation systems (analogous to "copying" in selection).*  

  The screen prioritizes *testability over depth* — a tradeoff for rapid review. It errs toward permissiveness with patterns (Step 3) but harshness on ungrounded entities (Step 1). For the sociology case, it agrees with your skepticism: labeling a phenomenon ("shared capacity") isn’t explaining it.
