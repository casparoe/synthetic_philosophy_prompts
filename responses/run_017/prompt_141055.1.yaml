answer: |-
  ### Joint Statement: Adversarial Collaboration on Moral Trade

  **Agreed Claims**  
  1. In a static setting where both parties' values are fixed, known, outcome-oriented (lacking complicity terms), and transaction costs are zero:  
     - Gains from moral trade exist when agents have differing marginal rates of substitution across valued outcomes.  
     - Such gains are measurable in principle via each agent’s willingness to pay, analogous to comparative advantage in standard trade theory.  
     - No shared "currency" of value is required; trade feasibility depends only on heterogeneous trade-offs.  
  2. Real-world transaction costs (e.g., verifying compliance, enforcing agreements, finding counterparties) can impede these gains.  
  3. The term "moral trade" is descriptive (trades advancing terminal values), not normative; verbal disputes over "morality" are set aside.  

  **Residual Disagreements**  
  - **Enthusiast:** Real-world gains are large, unexploited, and achievable via institutional innovation; obstacles are primarily practical (epistemic, technical).  
  - **Skeptic:** Apparent gains are often illusory due to unmodeled complicity terms, unobservable values, and dynamic losses; obstacles are fundamental.  

  **Cruxes**  
  | Crux | Enthusiast’s Wording | Skeptic’s Wording | Agreed Test or Case | Enthusiast’s Prediction | Skeptic’s Prediction |  
  |------|----------------------|-------------------|---------------------|-------------------------|----------------------|  
  | **Size of complicity terms** | Complicity disutility is rare or negligible; outcome-oriented values dominate. | Complicity terms are pervasive and large, often rendering net trade gains negative. | **Vignette study**: Participants (e.g., politically polarized donors) trade support for a cause they mildly oppose ($X cost) to receive 5× $X for a cause they strongly favor. Measure refusal rates and stated reasons. | <15% refuse; complicity cited in <25% of refusals. | >40% refuse; complicity cited in >75% of refusals. |  
  | **Legibility of compliance in thin markets** | Verification costs are low; smart contracts, audits, and reputation systems can reliably signal compliance at scale. | True compliance is unobservable; verification is prohibitively costly or invasive, especially in thin markets. | **Field experiment**: A thin market platform (e.g., altruists trading cause-specific donations) tests simple self-reports vs. costly third-party audits. Measure trade volume, verification costs, and user trust. | Audits boost trade volume by ≥40% with costs ≤5% of value; trust increases by ≥30%. | Audits boost trade by ≤10% with costs ≥20%; trust unchanged or declines. |  
  | **Option-value losses from value drift** | Value drift is slow; option losses are small vs. static gains and mitigated via short-term/renegotiable contracts. | Value drift imposes large, unpredictable losses (e.g., lock-in with harmful actors); option costs swamp static gains. | **Historical case study**: Analyze 50 long-term alliances (e.g., NGOs, nations) with initial value alignment. Measure ex post losses (e.g., penalties, reputational harm) vs. ex ante static gains when values drift. | Losses are ≤20% of static gains in ≥80% of cases; renegotiation clauses reduce losses by ≥70%. | Losses are ≥50% of static gains in ≥60% of cases; renegotiation fails in ≥50% of drift events. |  

  **Evidence Against Own View**  
  - **Enthusiast:** Vignettes show high refusal due to complicity; audits fail to boost trade; historical drift losses exceed 50% of gains.  
  - **Skeptic:** Vignettes show low refusal despite complicity; audits enable high trust at low cost; drift losses are consistently below 20% of gains.  

  **Word count**: 698
