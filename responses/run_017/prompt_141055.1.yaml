  We are drafting a joint statement from an adversarial collaboration on moral trade. The goal is to have agreed claims, residual disagreements, and cruxes with tests and predictions.

  Agreed Claims (Static Case):
  1. In a static setting where both parties have fixed and known values that can be represented as preference orderings over outcomes without complicity terms (i.e., where each agent's utility depends only on the outcome and not on the process or their own role in bringing it about), and where there are no transaction costs (including no costs of verifying compliance or enforcing agreements), then if the agents have different marginal rates of substitution between goods (or more generally, different trade-offs between the dimensions of value), there exists the potential for gains from trade. This is analogous to comparative advantage in standard trade theory.

  2. In such a static case, the gains from trade are measurable in principle by the agents' own lights, because each agent would be willing to pay up to the amount that leaves them indifferent between trading and not trading, and the joint surplus is the sum of these individual gains.

  3. The existence of such potential gains does not depend on the agents sharing any common currency of value; it only requires that each agent can make trade-offs between the resources they control and the outcomes they value.

  4. However, in the real world, transaction costs (including costs of finding counterparties, negotiating, verifying compliance, and enforcing agreements) may prevent the realization of these gains.

  Residual Disagreements:
  - The Enthusiast (me) believes that in many real-world cases, the gains from moral trade are large and that the main obstacles are practical (epistemic, institutional) and can be overcome with appropriate mechanisms.
  - The Skeptic (my friend) believes that in most real cases, the apparent gains are illusory because:
     a) Agents' values often include complicity terms (disutility from participating in a scheme that advances ends they consider wrong) that are not captured by outcome-based preference orderings. These terms may make the net benefit of trade negative for at least one party.
     b) The values of counterparties are unobservable, so we cannot measure the surplus even in principle, because we only observe bargaining behavior (which is strategic) and not true compliance (which would reveal the underlying values).

  Cruxes:

  We identify the following cruxes:

  1. **Size of Complicity Terms**: How large and prevalent are complicity terms in the values of real agents?
  2. **Legibility and Cost of Compliance Verification**: Can compliance in a thin market (with few participants) be made legible (i.e., verifiable) at an acceptable cost?
  3. **Option-Value Losses from Value Drift**: Do trades struck with counterparties (including one's future self) whose values drift over time impose option-value losses that swamp the static gains?

  For each crux, we provide:
  - The agreed test or case.
  - The enthusiast's prediction and the skeptic's prediction.

