  Crux 1: Size of Complicity Terms
  - Enthusiast: Complicity terms are typically small or absent in most real-world moral trade opportunities, so they do not prevent substantial gains.
  - Skeptic: Complicity terms are typically large and pervasive, especially when the trade involves advancing ends that the agent considers deeply wrong, and they often negate the gains.

  Agreed Test: Conduct a vignette study with a diverse sample of participants. Present scenarios where an agent is offered a trade: in exchange for contributing to a cause they mildly disapprove of (e.g., a conservative donating to a liberal environmental cause, or vice versa), they can have a cause they strongly support advanced by a larger amount. Measure the proportion of participants who refuse the trade even when the material gain (in terms of their own value) is large, and the reasons for refusal (e.g., expressed discomfort with complicity). Also, measure the required compensation to overcome refusal.

