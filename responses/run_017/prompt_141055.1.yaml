  Crux 2: Legibility and Cost of Compliance Verification
  - Enthusiast: With modern technology (e.g., smart contracts, blockchain, third-party auditors) and institutional designs (e.g., escrow, reputation systems), compliance can be made verifiable at low cost, even in thin markets.
  - Skeptic: The costs of verifying true compliance (i.e., that the counterparty is actually advancing the agreed values, not just going through the motions) are prohibitive in thin markets because values are unobservable and actions can be faked, and because the required monitoring would be invasive or too expensive.

  Agreed Test: Create a field experiment in a thin market for moral trade (e.g., a platform connecting donors with different causes). Implement two arms: one with simple self-reporting and one with a robust verification mechanism (e.g., third-party audits, proof of impact). Measure the additional cost of verification and the rate of detected non-compliance in the robust arm. Then, measure the increase in trade volume and participant satisfaction in the robust arm compared to the simple one, and the willingness of participants to pay for verification.

  Enthusiast Prediction: The robust verification mechanism will increase trade volume by at least 50% and participant satisfaction by at least 30% without increasing costs by more than 10% of the traded value, and at least 60% of participants will choose to pay for verification.

  Skeptic Prediction: The robust verification mechanism will not increase trade volume by more than 10% (if at all) and satisfaction by no more than 10%, while costs will increase by at least 30% of the traded value, and fewer than 20% of participants will choose to pay for verification.

  Crux 3: Option-Value Losses from Value Drift
  - Enthusiast: Value drift over time is slow and predictable, and option-value losses (from being locked into a trade that later becomes unfavorable due to changing values) are small relative to the static gains. They can be mitigated by short-term contracts or renegotiation clauses.
  - Skeptic: Value drift is common and unpredictable, and the option-value losses (especially when trading with entities whose values may drift in harmful directions) can be huge, potentially swamping the static gains. Renegotiation is not always possible and short-term contracts may not capture the gains.

  Agreed Test: Analyze historical data from long-term contracts in contexts where values might drift (e.g., alliances between nations, partnerships between organizations with different ideologies, or personal commitments like marriage). For each case, estimate the static gains at the time of agreement and then the ex post losses due to value drift (e.g., costs of renegotiation, penalties, or harm from being locked in). Alternatively, run simulations with different rates of value drift and measure the net present value of trade with renegotiation versus no trade.

  Enthusiast Prediction: In at least 70% of cases, the static gains exceed the option-value losses by a factor of 2 or more, and renegotiation clauses reduce losses by at least 80%.

  Skeptic Prediction: In at least 70% of cases, the option-value losses are at least half the static gains, and in 30% of cases they exceed the static gains. Renegotiation clauses help in less than 50% of the cases where value drift occurs.

