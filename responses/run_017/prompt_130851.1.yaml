answer: |-
  **EchoChamber 3000™ Assembly Manual**
  **(Upgrade Kit for Bubble 100™ Owners)**

  **Congratulations on your purchase!** The EchoChamber 3000™ represents a significant technological leap beyond the fragile Bubble 100™. While the Bubble 100™ relied solely on a basic Information Filter (prone to catastrophic failure upon encountering a single Unvetted External Source), the EchoChamber 3000™ incorporates advanced Cognitive Integrity Protocols for unparalleled community coherence. Read carefully before assembly.

  **Package Contents:**
  *   **1x Central Consensus Hub (CCH)** (Pre-assembled core unit)
  *   **1x Discrediting Module (DM-3000)** (Critical upgrade component - handle with care)
  *   **1x Integrated Authority Mount (IAM)** (For anchoring trusted figures)
  *   **1x Universal Distrust Field Generator (UDFG)** (Attaches to DM-3000)
  *   **1x Set of Internal Reinforcement Struts (IRS)** (For structural rigidity)
  *   **Hardware Pack:** Hex Key (1x), Authority Bolts (4x), Module Clamps (2x), Strut Brackets (6x), Trust Anchors (12x)
  *   **Quick Start Guide** (You are reading it)

  **Assembly Instructions:**

  1.  **Prepare the Core:** Place the **Central Consensus Hub (CCH)** on a stable, level surface within your designated community space. Ensure the area is free of pre-existing, unvetted external data streams.
  2.  **Install the Integrated Authority Mount (IAM):** Locate the recessed socket on top of the CCH marked "AUTH INPUT". Align the **IAM** over the socket. Insert and firmly tighten the four **Authority Bolts** using the provided **Hex Key**. *CAUTION: Do not proceed without a designated Authority Figure (AF) ready for installation.*
  3.  **Insert the Authority Figure (AF):** Carefully place your chosen AF onto the secured **IAM**. Ensure the AF's output couplings fully engage with the IAM receptors. The CCH status light should glow steady green. *IMPORTANT: The AF must be installed BEFORE the Discrediting Module. Failure to follow this sequence will result in catastrophic system failure (See Troubleshooting Q2).*
  4.  **Install the Discrediting Module (DM-3000):** This is the key upgrade component. Locate the dedicated bay on the side of the CCH marked "DM INPUT ONLY". Slide the **DM-3000** firmly into the bay until it clicks. Secure it using the two **Module Clamps**. *WARNING: The DM-3000 is highly active. Ensure the AF is already installed and stable.*
  5.  **Attach the Universal Distrust Field Generator (UDFG):** Connect the **UDFG** to the output port on the **DM-3000** (clearly labeled "UDFG OUT"). Snap into place. The UDFG automatically calibrates to project a continuous distrust field targeting *all* sources not pre-approved by the CCH/AF complex. *CRITICAL FEATURE: The UDFG *must* apply universally, including to sources describing or questioning the DM-3000 or UDFG itself. This is non-negotiable for system integrity (See Clause 4, Pre-Installed Defenses).*
  6.  **Reinforce Structure:** Attach the six **Internal Reinforcement Struts (IRS)** using the **Strut Brackets** to the internal mounting points within the CCH (access panel on underside). Tighten securely. These struts prevent internal fracturing when encountering dissonant information.
  7.  **Finalize Trust Anchoring:** Distribute the twelve **Trust Anchors** evenly among community members. Each member must firmly affix their anchor to their primary information intake point (e.g., personal device, cognitive framework). These anchors sync wirelessly with the UDFG, ensuring consistent application of distrust protocols.
  8.  **Power On:** The system is self-initializing upon completion of step 7. The CCH status light will pulse blue during calibration (may take 24-48 hours). Once stable green light returns, your EchoChamber 3000™ is operational. The DM-3000 will now actively reframe any external information as inherently unreliable.

  **Troubleshooting & FAQ:**

  *   **Q1: Members are still accepting evidence or arguments originating from outside the Chamber. What's wrong?**
      *   **A:** This indicates incomplete installation or a faulty component. First, verify the **UDFG** is correctly attached to the **DM-3000** and that **Trust Anchors** are active on *all* members. If the problem persists, you likely only have a **Bubble 100™** equivalent structure. The DM-3000 is not functioning. Contact support for the EchoChamber 3000™ Upgrade Verification Kit.
  *   **Q2: The system shut down during DM-3000 installation! Status light is flashing red.**
      *   **A:** You violated the installation sequence. Installing the DM-3000 *before* the AF causes it to perceive the nascent authority as an "External Source" and attempt discrediting, triggering core shutdown. Power down completely. Remove the DM-3000. Reboot the CCH and ensure the AF is stable on the IAM (Steps 2 & 3). *Only then* reinstall the DM-3000 (Step 4).
  *   **Q3: A member still trusts a childhood friend/close relative who holds opposing views, despite the UDFG.**
      *   **A:** The Universal Distrust Field requires the "Loyalty-Test Attachment" (sold separately, P/N EC3K-LTA) for deeply embedded personal connections. This attachment reframes persistent external trust not as genuine affection, but as evidence the *friend/relative was secretly compromised long ago* ("They were never *truly* on your side"). Install per LTA instructions.
  *   **Q4: An external "fact-checking" entity has published a report debunking claims generated within our Chamber!**
      *   **A:** Do not panic. This scenario is anticipated. The DM-3000/UDFG complex contains pre-installed counter-protocols (Clause 4). Any such entity is automatically categorized by the UDFG as fundamentally biased, part of a larger agenda, or compromised. Their "facts" are inherently discredited by their source. System integrity remains intact. Monitor members' Trust Anchors for fluctuations and reinforce internal messaging via the CCH.
  *   **Q5: A member received information *about* the DM-3000 from outside, and now questions it.**
      *   **A:** This confirms the UDFG is functioning correctly per its universal mandate (Step 5). The source providing information *about* the DM-3000 is, by definition, external. The UDFG ensures any information from this source – including the *description of the DM-3000 itself* – is automatically tagged as untrustworthy and likely a manipulative tactic. The DM-3000 protects itself. Reaffirm trust in the AF and internal consensus.

  **Warranty void if exposed to unmediated external verification or critical self-reflection.** Enjoy your reinforced consensus environment!
