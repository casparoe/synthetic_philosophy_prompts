prompt: |-
  You are a social epistemologist and a formal theorist of collective judgment. You have been retained to mediate an adversarial collaboration between two camps in the debate over information cascades and rational herding, and to draft the joint statement both would sign. Work slowly and carefully: before you write the document, spend some time brainstorming the structure of the disagreement yourself — list what each camp is actually committed to, which of their apparent conflicts are about the world and which are about words, which modelling assumptions are doing the work, and what kind of result would genuinely embarrass each side. Only then draft.

  The two camps:

  - The Fragility camp holds that herding on the observed actions of others is a real and structural failure of collective learning: private information gets stranded, a cascade that locks onto the wrong option resists later contrary evidence of a kind that would have sufficed earlier, and deliberative, electoral, and market institutions should therefore be deliberately redesigned — through sequencing, disclosure timing, and incentives for dissent — to slow or break cascades.
  - The Efficiency camp holds that the appearance of failure is largely an artifact of knife-edge modelling assumptions: once you allow endogenous timing, costly but acquirable private evidence, graded or noisy signals, reputational and market feedback, and repeated interaction among players who know the game repeats, collective learning is substantially self-correcting, and institutional tampering aimed at disrupting herding typically destroys a cheap information channel and leaves groups worse off than they were.

  Your brief:

  1. Agreed claims. Number them and give between eight and twelve. These are claims both camps can sign: about what the canonical sequential social-learning model establishes when its assumptions hold; about the difference between behavioral herding (correlated action) and an informational cascade (action that has become insensitive to the agent's own private signal); about the difference between the rationality of an individual action given the public history and the epistemic efficiency of the group's outcome; about the fact that an institution which publishes a running tally of discrete choices is by design discarding part of the evidence held by later movers; about what would have to be true for a cascade to be broken by subsequent evidence. Each claim must be substantive rather than diplomatic: if a claim is one whose denial neither camp would bother defending, cut it.

  2. A disagreements table. Columns: the issue; the proposition the Fragility camp would word for itself; the proposition the Efficiency camp would word for itself; and a classification of the residual disagreement as factual, normative, or verbal. Neither column may be a strawman. Each entry must be phrased so that its own side would be willing to sign that exact sentence as a statement of its view, not merely as something an opponent attributed to it.

  3. Verbal disputes, identified explicitly. Say which parts of the long-running argument are disputes about words rather than about the world — for instance whether cascade denotes an informational state or merely correlated behavior, whether rational here means Bayes-rational given the public history or truth-conducive in the long run, whether fragile is being used to mean slow to converge or prone to locking in error — and for each, state the substantive question underneath it, or say honestly that there is none and the debate should drop that thread.

  4. Cruxes, with a prediction registry. For each crux give: the sub-question such that settling it would move at least one camp; one concrete case or test that both camps accept as bearing on it; what each camp predicts about that case; and what outcome each camp would count as a genuine blow to its own position rather than a case it can accommodate after the fact. Restrict your cases to settings whose facts are common knowledge — a committee or jury that votes aloud in a fixed order, a run on a bank, the adoption of a consumer technology standard, choice between two similar-looking restaurants on an unfamiliar street, an idealized urn-drawing experiment whose parameters you specify yourself — and specify the parameters yourself where they matter. Include at least these cruxes: (a) whether the knife-edge assumptions of the canonical model — coarse public binary actions, an exogenous fixed order, private signals of equal precision, a single pass with no option to wait or to pay for better information — are load-bearing or merely simplifying; (b) whether familiar real-world herding episodes are better explained by informational cascade or by preference- and reputation-driven conformity, and what observable difference would distinguish the two explanations; (c) whether the right benchmark for saying that the group does well is asymptotic efficiency, rate of convergence, or the tail risk of a locked-in wrong cascade; (d) whether reputational herding and informational cascading are one mechanism described at two levels or two distinct mechanisms that call for different remedies.

  5. A joint verdict on three institutional proposals, with each camp's prediction recorded: Blind First Round, in which every member records an independent judgment before any tally is published, followed by exactly one revision round after the tally is released; Informed-First Ordering, in which the member with the highest-precision private signal is deliberately placed last rather than first in the sequence; and a Contrarian Bounty, a reward for members whose final judgment proves correct while having been in the minority at the time they gave it. For each proposal, give the mechanism by which it would help, the mechanism by which it would hurt, the parameter regime in which each camp concedes that it is net-positive or net-negative, and whether any of the three can be jointly endorsed or jointly rejected by both camps together.

  6. A short closing section, co-signed, stating what a genuinely decisive study or natural experiment would have to look like, and what interim practical recommendation both camps would accept given that no such study exists.

  Constraints: argue from first principles and from the structure of the models themselves. Do not cite, name, date, or attempt to quote any published work, author, or experiment, and do not construct a bibliography or suggest further reading. Where you need an empirical claim, flag it explicitly as an empirical claim and say how it would be tested rather than asserting it on authority. Prefer exactness to diplomacy: after reading your document, the residual disagreement between the camps should be sharper than it was before, not smoothed over. Aim for roughly 1,200 to 1,600 words, in the formal register of a memorandum that two research teams are prepared to put their names to.
reasoning: |-
  We are mediating an adversarial collaboration between two camps: the Fragility camp and the Efficiency camp. We will structure the joint statement as follows:

  1. **Agreed Claims**: 8-12 substantive claims both camps accept.
  2. **Disagreements Table**: Table with issue, Fragility camp's proposition, Efficiency camp's proposition, and classification of residual disagreement (factual, normative, verbal).
  3. **Verbal Disputes**: Explicit identification of disputes about words, with the substantive question underneath.
  4. **Cruxes with Prediction Registry**: Crucial sub-questions, concrete cases, predictions, and what would embarrass each side.
  5. **Joint Verdict on Institutional Proposals**: Analysis of three proposals, mechanisms of help/hurt, parameter regimes, and joint endorsement/rejection.
  6. **Closing Section**: Requirements for a decisive study and interim practical recommendation.

  We proceed step by step.

  ---

  **1. Agreed Claims** (Numbered 1-10)

  Both camps accept the following:

  1. In the canonical sequential social-learning model with binary actions, binary private signals of equal precision, and an exogenously fixed order, an informational cascade occurs when a player's action becomes independent of their private signal, because the public history of actions dominates their posterior belief.

  2. Once an informational cascade starts, it is characterized by the discarding of private signals by subsequent actors, leading to a state where the public belief does not update even as new private signals are ignored.

  3. An informational cascade can lock in on the wrong option (i.e., the inferior choice) with positive probability, and once locked, it may persist indefinitely even if the majority of private signals would have favored the correct option.

  4. The rationality of an individual in this model is Bayesian: given the public history and their private signal, the action that maximizes their expected payoff is to follow the public history if it is sufficiently strong, regardless of their private signal.

  5. There is a distinction between behavioral herding (correlated actions due to similar incentives or public information) and an informational cascade (correlated actions due to the suppression of private information in the sequential learning model).

  6. The group outcome in the canonical model is not epistemically efficient: the aggregation of private information is incomplete, and the probability of locking onto the wrong option does not converge to zero as the group size grows.

  7. An institution that publishes only a running tally of discrete choices (e.g., votes) discards the granularity of private signals, which is the root cause of information stranding in cascades.

  8. For a cascade to be broken by subsequent evidence, it would require either (a) a player with a sufficiently strong private signal (against the cascade) that it overcomes the public belief, or (b) an exogenous shock that resets the public belief or provides new public information.

  9. In the canonical model, the probability of a cascade starting is high after a small number of players, and the probability of a wrong cascade is positive and bounded away from zero.

  10. The canonical model is a useful baseline for understanding how public information can overwhelm private signals, but its assumptions (binary actions, fixed order, equal signal precision, no waiting or costly information acquisition) are stylized and may not hold in many real-world settings.

  ---

  **2. Disagreements Table**

  | Issue | Fragility Camp Proposition | Efficiency Camp Proposition | Residual Disagreement Classification |
  |-------|----------------------------|-----------------------------|--------------------------------------|
  | 1. Prevalence of cascades in reality | Informational cascades of the canonical type are a common and structurally important failure mode in real-world collective learning, occurring in financial markets, technology adoption, and public deliberation. | Informational cascades as modeled in the canonical setup are rare in practice; what appears as cascading is often due to other mechanisms (like reputational concerns) or is a transient phenomenon that self-corrects in richer environments. | Factual |
  | 2. Robustness of cascade fragility | The fragility of collective learning to cascades is robust to many realistic extensions; even with endogenous timing, repeated play, and noisy signals, the core problem of information stranding persists and requires institutional remedies. | The fragility result is an artifact of highly restrictive assumptions; with endogenous timing, the option to wait or acquire costly signals, and repeated interaction, cascades are often broken and information aggregates efficiently. | Factual |
  | 3. Institutional interventions | Deliberate institutional design (e.g., sequencing, blind rounds, contrarian incentives) is necessary and effective to reduce the risk of wrong cascades and improve collective accuracy. | Institutional interventions aimed at disrupting herding often destroy valuable information channels and can reduce collective welfare by slowing learning or adding noise; markets and reputational systems naturally self-correct. | Normative (on the necessity and effectiveness of intervention) and Factual (on the net effect) |
  | 4. Benchmark for group success | The appropriate benchmark is the tail risk of a persistent wrong cascade; even if rare, such events are catastrophic and thus warrant preventive measures. | The appropriate benchmark is asymptotic efficiency and rate of convergence; occasional wrong cascades are quickly overturned in dynamic settings, and the long-run performance is excellent. | Normative (on the importance of tail risk) |

  ---

  **3. Verbal Disputes**

  We identify the following verbal disputes:

  - **Cascade**: 
    - Fragility camp uses "cascade" to denote an informational state where private signals are ignored and public belief is fixed (as in the canonical model). 
    - Efficiency camp sometimes uses "cascade" to mean merely correlated behavior (behavioral herding). 
    *Substantive question underneath:* Is the phenomenon we observe in reality one where private signals are being systematically discarded, or is it a correlation due to common shocks or preferences?

  - **Rational**: 
    - Fragility camp uses "rational" to mean Bayesian-rational given the public history and private signal at the moment of action. 
    - Efficiency camp sometimes uses "rational" to mean long-run truth-conducive in a repeated setting. 
    *Substantive question:* Is the individual behavior that leads to a cascade (ignoring one's signal) rational in a broader sense that accounts for future opportunities to learn and act?

  - **Fragile**: 
    - Fragility camp uses "fragile" to mean prone to locking in error with positive probability and not self-correcting. 
    - Efficiency camp uses "fragile" to mean that the system does not converge to the truth, but in their view, it does converge. 
    *Substantive question:* Does the system, in realistic settings, eventually correct wrong cascades and converge to the truth with high probability?

  We recommend that future discussions define these terms explicitly and focus on the substantive questions.

  ---

  **4. Cruxes with Prediction Registry**

  We specify concrete cases:

  **Crux (a): Knife-edge assumptions load-bearing?**  
  *Sub-question:* Are the canonical model's assumptions (binary actions, fixed order, equal precision, single pass) necessary for cascades to occur and persist?  
  *Concrete case:* An urn-drawing experiment with two urns: Urn A has 60% red balls, Urn B has 40% red balls. Participants are in a sequence. We vary:  
  - *Case 1 (canonical):* Binary action (guess urn), fixed order, private signal (one ball draw), no waiting, no cost for more signals.  
  - *Case 2 (endogenous timing):* Players can choose when to act (at a cost of delay) and can pay to draw additional balls (costly information).  
  - *Case 3 (repeated):* The game repeats over multiple periods with the same urn.  

  *Predictions:*  
  - Fragility camp: In Case 1, cascades and wrong lock-ins occur. In Cases 2 and 3, cascades still occur but may be broken only by high-cost actions; wrong lock-ins are still a significant risk.  
  - Efficiency camp: In Case 1, cascades occur. In Cases 2 and 3, cascades are rare and short-lived; the system self-corrects quickly.  

  *What would embarrass each side?*  
  - Fragility: If in Case 2 or 3, the probability of a wrong lock-in is as high as in Case 1.  
  - Efficiency: If in Case 2 or 3, the probability of wrong lock-in remains bounded away from zero and is not reduced by the richer environment.

  **Crux (b): Real-world herding episodes explained?**  
  *Sub-question:* Are real cascades driven by informational cascading or by preference/reputation?  
  *Concrete case:* A run on a bank.  
  - *Observable difference:* In an informational cascade, depositors ignore their private signals about the bank's health (e.g., they might have positive private news but still run). In reputation-driven herding, depositors run because they fear being last in line.  
  - *Test:* Survey depositors on their private information and motives. If they report positive private information but run anyway, it supports informational cascade. If they report fear of others' actions regardless of their own information, it supports reputation.  

  *Predictions:*  
  - Fragility camp: Many bank runs involve depositors ignoring positive private signals, indicating informational cascades.  
  - Efficiency camp: Bank runs are mostly driven by fundamental shocks or coordination motives (reputation/fear), not by cascades of ignored private signals.  

  *What would embarrass each side?*  
  - Fragility: If depositors who run overwhelmingly report no positive private signals or that their private signals were negative.  
  - Efficiency: If a substantial fraction of depositors who run report having had positive private signals about the bank.

  **Crux (c): Benchmark for group success**  
  *Sub-question:* Is the key metric the asymptotic efficiency, the rate of convergence, or the tail risk?  
  *Concrete case:* A committee of 100 members voting aloud in fixed order on a binary choice (e.g., guilt of defendant).  
  - *Tail risk:* Probability that the committee convicts an innocent defendant (or acquits a guilty one).  
  - *Rate of convergence:* How fast the posterior probability approaches 1 for the correct state.  
  - *Asymptotic efficiency:* Whether as the committee size goes to infinity, the probability of error goes to zero.  

  *Predictions:*  
  - Fragility camp: In the canonical setup, tail risk is high (fixed probability of error regardless of size) and should be the focus.  
  - Efficiency camp: In richer models (e.g., with some noise or repeated voting), the tail risk becomes negligible and the rate of convergence is fast.  

  *What would embarrass each side?*  
  - Fragility: If in a realistic extension, tail risk of a persistent error is near zero.  
  - Efficiency: If in a realistic extension, tail risk remains substantial (e.g., >5%) even for large groups.

  **Crux (d): Reputational vs. informational herding**  
  *Sub-question:* Are these two distinct mechanisms requiring different remedies?  
  *Concrete case:* Adoption of a consumer technology (e.g., Blu-ray vs. HD DVD).  
  - *Informational cascade:* People choose based on others' choices because they infer quality, ignoring their own experience.  
  - *Reputational herding:* People choose the popular option to avoid social sanction.  
  - *Test:* Vary the social visibility of choices. If choices are private, reputational herding should disappear, but informational cascades may persist.  

  *Predictions:*  
  - Fragility camp: Even in private choices, cascades occur (via public sales data). Reputational herding is a separate amplifier.  
  - Efficiency camp: Without social visibility, cascades are weak and self-correcting; reputational effects are the main driver of persistent herding.  

  *What would embarrass each side?*  
  - Fragility: If making choices private eliminates herding.  
  - Efficiency: If herding persists strongly in private choices.

  ---

  **5. Joint Verdict on Institutional Proposals**

  We analyze three proposals:

  **Proposal 1: Blind First Round**  
  - *Mechanism help:* Ensures that initial independent judgments are recorded, preserving some private information before social influence.  
  - *Mechanism hurt:* Loses the benefit of early social learning; may lead to slower convergence and more errors if early signals are noisy.  
  - *Parameter regimes:*  
    - Fragility: Net-positive when signal precision is moderate and group size is large.  
    - Efficiency: Net-negative when signal precision is low (early social learning is valuable) and net-positive only when signals are high-precision and the cost of delay is low.  
  - *Joint stance:* Both camps agree it can help in some regimes (e.g., high-stakes decisions with moderate signal precision) but disagree on how often those regimes occur.

  **Proposal 2: Informed-First Ordering**  
  - *Mechanism help:* Putting the best-informed last ensures that strong signals are not stranded by a cascade.  
  - *Mechanism hurt:* If early actors are uninformed, their actions may be noisy and mislead others, causing early cascades.  
  - *Parameter regimes:*  
    - Fragility: Net-positive when signal precision varies greatly.  
    - Efficiency: Often net-negative because early low-precision actors create more noise; better to put high-precision first to guide learning.  
  - *Joint stance:* Both reject a universal prescription; it depends on the distribution of signal precision.

  **Proposal 3: Contrarian Bounty**  
  - *Mechanism help:* Rewards dissent that turns out correct, encouraging people to reveal private signals against the majority.  
  - *Mechanism hurt:* Encourages noisy contrarianism; people may dissent without good reason, adding noise and reducing learning.  
  - *Parameter regimes:*  
    - Fragility: Net-positive when the bounty is calibrated to the prior and signal precision, to offset reputational risks.  
    - Efficiency: Often net-negative because it distorts incentives away from truth-seeking; better to let the market/reputation reward correct judgments.  
  - *Joint stance:* Both agree that in settings with strong reputational penalties for dissent, a bounty might help, but Efficiency camp fears overuse.

  *Joint endorsement:* None of the three proposals is universally endorsed. Both camps can jointly endorse that **Blind First Round** is worth testing in settings with high tail-risk aversion and moderate signal precision.

  ---

  **6. Closing Section**

  *Co-signed statement:*

  To decisively resolve our disagreements, a study must:  
  1. Observe real-world decisions where private signals are elicited and recorded before actions, and then track how public histories and actions evolve.  
  2. Test the effect of institutional interventions (like blind rounds) in controlled experiments with varying signal qualities and group sizes.  
  3. Measure the tail risk of persistent errors in long-running learning environments.

  Absent such studies, we jointly recommend:  
  - In high-stakes, one-shot decisions (e.g., jury verdicts), use **Blind First Round** to mitigate cascade risks.  
  - In repeated settings (e.g., markets), avoid over-regulation but monitor for persistent errors and consider light-touch interventions (like occasional information blackouts) only if evidence of harm emerges.  
  - Researchers should continue to refine models to distinguish informational cascades from reputational herding and to identify when interventions are cost-effective.
answer: |-
  ### Joint Statement on Information Cascades and Collective Learning  
  **Adversarial Collaboration Between the Fragility and Efficiency Camps**  

  #### 1. Agreed Claims  
  Both camps endorse the following substantive claims:  

  1. **Informational Cascade Definition**: In the canonical sequential model (binary actions, fixed order, symmetric binary signals), an *informational cascade* occurs when an agent rationally ignores their private signal and follows the public history, rendering their action uninformative to subsequent agents.  
  2. **Cascade Onset**: Cascades can begin as early as the second agent if prior actions conflict, and the probability of cascade initiation approaches 1 as the number of agents increases.  
  3. **Lock-In Risk**: A cascade may lock in on the incorrect action with positive probability, and once locked in, requires disproportionately strong contrary evidence (relative to pre-cascade thresholds) to reverse.  
  4. **Individual Rationality**: Each agent acts Bayes-rationally given their private signal and the public history; cascades are thus equilibrium phenomena, not behavioral errors.  
  5. **Information Stranding**: Cascades strand private information by discarding signals that—if aggregated—could correct errors. Publishing only discrete actions (e.g., votes) discards signal granularity by design.  
  6. **Herding vs. Cascade**: *Behavioral herding* (correlated actions due to preferences, norms, or common shocks) is distinct from an *informational cascade* (actions decoupled from private signals due to belief updating).  
  7. **Cascade Reversal**: A locked-in cascade can only be broken by: (a) an agent with a sufficiently strong private signal to overcome the public belief, or (b) exogenous public information.  
  8. **Epistemic Inefficiency**: In the canonical model, the group’s error rate does not converge to zero as group size grows; asymptotic inefficiency is inherent.  
  9. **Role of Signal Precision**: Higher private signal precision delays cascade onset but does not eliminate lock-in risk.  
  10. **Public History Dominance**: Once a cascade starts, the public belief becomes static, and later agents’ beliefs are determined solely by prior actions—not by the passage of time or group size.  

  #### 2. Disagreements Table  
  | Issue | Fragility Camp Proposition | Efficiency Camp Proposition | Disagreement Classification |  
  |-------|----------------------------|-----------------------------|----------------------------|  
  | **Prevalence of Cascades** | "Cascades are a common and structurally robust failure of collective learning in markets, committees, and public discourse; they frequently lock in errors that persist absent intervention." | "Observed herding is rarely a pure informational cascade; it is predominantly driven by preference alignment, reputational rewards, or correlated shocks, and cascades are artifacts of stylized lab conditions." | Factual |  
  | **Self-Correction Capacity** | "Lock-in is durable: real-world groups rarely self-correct from cascades because public belief rigidity and rational updating deter later agents from acting on contrarian signals." | "Endogenous timing, repeated interaction, and market/reputational feedback ensure cascades are transient; groups efficiently self-correct via later evidence accumulation or equilibrium selection." | Factual |  
  | **Institutional Remedies** | "Redesigning institutions (e.g., sequencing or dissent incentives) is necessary to reduce tail risks of persistent errors; doing so improves collective accuracy without prohibitive costs." | "Institutional interventions disrupt cheap information transmission and social learning; they typically increase noise or delay, leaving groups worse off than under laissez-faire herding." | Normative (on necessity) and Factual (on net effects) |  
  | **Tail Risk vs. Asymptotics** | "The salient failure is tail risk—non-vanishing probabilities of catastrophic, persistent errors—which justifies preventive design even if rare." | "The benchmark is long-run convergence: tail risks are negligible in dynamic settings, and efficiency losses from intervention outweigh rare errors." | Normative |  

  #### 3. Verbal Disputes  
  Explicitly flagged verbal disagreements and their substantive cores:  
  - **"Cascade"**:  
    - *Fragility*: Denotes an *informational state* where actions are insensitive to private signals.  
    - *Efficiency*: Often conflates with *correlated behavior* (herding).  
    - **Substantive question**: Do real-world herding episodes involve systematic discarding of private signals?  
  - **"Rational"**:  
    - *Fragility*: Means *Bayes-rational given immediate incentives* (per canonical model).  
    - *Efficiency*: Means *instrumentally truth-conducive in long-run equilibrium*.  
    - **Substantive question**: Does short-run Bayesian rationality impede long-run group accuracy?  
  - **"Fragility"**:  
    - *Fragility*: Implies *prone to persistent lock-in errors*.  
    - *Efficiency*: Interprets as *slow convergence or sensitivity to noise*.  
    - **Substantive question**: Are cascades self-correcting or permanently destabilizing?  
  - **Resolution**: These terms should be disambiguated in future work; the debate should focus solely on the substantive questions.  

  #### 4. Cruxes with Prediction Registry  
  **Crux (a): Knife-edge assumptions load-bearing?**  
  *Sub-question*: Are canonical assumptions (binary actions, fixed order, equal precision, single pass) necessary for cascades, or do cascades persist under realism?  
  *Concrete case*: **Urn experiment** with two urns (A: 60% red balls; B: 40% red balls). Agents sequentially draw a ball, see its color (private signal), and publicly guess the urn.  
  - *Case 1 (canonical)*: Binary guess, fixed order, no delay/costs.  
  - *Case 2 (endogenous)*: Agents pay to delay action or buy extra draws.  
  - *Case 3 (repeated)*: 10 rounds with same urn.  
  - *Predictions*:  
    - *Fragility*: Case 1: High lock-in risk (∼30% wrong cascade prob.). Cases 2–3: Lock-in persists unless costs are prohibitive (e.g., delay costs > error penalties).  
    - *Efficiency*: Case 1: Lock-in occurs. Cases 2–3: Cascades rare; agents self-correct via extra draws/repetitions (wrong cascade prob. → 0).  
  - *Embarrassment conditions*:  
    - *Fragility*: If Case 2/3 show near-zero lock-in risk with moderate costs.  
    - *Efficiency*: If Case 2/3 show >15% lock-in risk despite endogenous flexibility.  

  **Crux (b): Real-world herding drivers?**  
  *Sub-question*: Are real cascades driven by informational updating or preference/reputation?  
  *Concrete case*: **Restaurant choice on an unfamiliar street**. Two identical restaurants (true quality unknown). Customers arrive sequentially, observe prior occupancy (public action), and receive private signals (e.g., menu scan, smell).  
  - *Test*: Survey customers on: (1) private signal strength, (2) motive for choice (e.g., "inferred quality" vs. "fear of embarrassment").  
  - *Predictions*:  
    - *Fragility*: ≥40% who herd report strong contrary signals but acted due to public history.  
    - *Efficiency*: ≤10% report strong contrary signals; herding driven by preference (e.g., ambiance) or reputation (e.g., avoiding empty venues).  
  - *Embarrassment conditions*:  
    - *Fragility*: If herders overwhelmingly report weak/neutral signals.  
    - *Efficiency*: If ≥30% of herders report strong contrary signals.  

  **Crux (c): Group success benchmark**  
  *Sub-question*: Is the key metric asymptotic efficiency, convergence rate, or tail risk?  
  *Concrete case*: **Jury voting aloud in fixed order** on guilt/innocence. Signals: 70% precision. True state: innocent.  
  - *Metrics*: (1) Asymptotics: Error rate as jury size → ∞; (2) Rate: Speed of error reduction; (3) Tail risk: P(persistent wrong verdict | n=12).  
  - *Predictions*:  
    - *Fragility*: Tail risk dominates (e.g., P(wrong verdict) ≈ 20% for n=12).  
    - *Efficiency*: Asymptotics/rate dominate (e.g., errors vanish for n>20; tail risk <2%).  
  - *Embarrassment conditions*:  
    - *Fragility*: If tail risk <5% for n=12 in realistic extensions (e.g., noisy signals).  
    - *Efficiency*: If tail risk >15% for n=50 with endogenous timing.  

  **Crux (d): Reputational vs. informational herding**  
  *Sub-question*: Are these distinct mechanisms requiring different remedies?  
  *Concrete case*: **Technology adoption (e.g., Blu-ray vs. HD-DVD)**.  
  - *Test*: Vary social visibility. Group A: Choices public; Group B: Choices private (only aggregate sales reported).  
  - *Predictions*:  
    - *Fragility*: Cascades persist in Group B (public sales data suffices for informational cascades).  
    - *Efficiency*: Herding drops in Group B (reputational effects dominate; sales data alone insufficient).  
  - *Embarrassment conditions*:  
    - *Fragility*: If herding vanishes in Group B.  
    - *Efficiency*: If herding strength similar in both groups.  

  #### 5. Joint Verdict on Institutional Proposals  
  **Proposal 1: Blind First Round**  
  - *Mechanism help*: Preserves independent signals by deferring social influence, reducing early cascade risk.  
  - *Mechanism hurt*: Discards early social learning, increasing initial error rates; delays convergence.  
  - *Parameter regimes*:  
    - *Fragility*: Net-positive when signals are noisy (precision <60%) and tail risk is critical (e.g., medical panels).  
    - *Efficiency*: Net-negative unless signals are high-precision (>80%) and group large; concedes net-positive only for small juries.  
  - *Joint stance*: Both endorse for small, high-stakes groups (e.g., <15 members) with moderate signal quality.  

  **Proposal 2: Informed-First Ordering**  
  - *Mechanism help*: High-precision early agents reduce noise, delaying cascades.  
  - *Mechanism hurt*: Low-precision late agents cannot break cascades; wastes strong signals.  
  - *Parameter regimes*:  
    - *Fragility*: Net-negative (prefers informed-last).  
    - *Efficiency*: Net-positive if precision varies widely (e.g., experts first).  
  - *Joint stance*: Neither jointly endorses; efficacy too context-dependent.  

  **Proposal 3: Contrarian Bounty**  
  - *Mechanism help*: Incentivizes revealing contrarian signals, breaking cascades.  
  - *Mechanism hurt*: Encourages noisy dissent, diluting information; vulnerable to gaming.  
  - *Parameter regimes*:  
    - *Fragility*: Net-positive when dissent is suppressed (e.g., corporate boards).  
    - *Efficiency*: Net-negative unless bounties are rare and costly (concedes net-positive for short sequences).  
  - *Joint stance*: Both reject as a universal remedy; fragility supports only in reputation-heavy settings.  

  **Overall**: Only **Blind First Round** receives joint endorsement for small, high-stakes decisions. Others are rejected for general application.  

  #### 6. Closing Section  
  **Co-signed Recommendations**:  
  - **Definitive Study Requirements**: A natural experiment or lab study must: (1) Elicit private signals pre-action in a real sequence (e.g., venture capital funding decisions); (2) Exogenously vary institutional rules (e.g., blind rounds); (3) Measure long-tail errors in dynamic settings. Testing requires environments where signals, actions, and motives are observable.  
  - **Interim Practical Guidance**: In the absence of decisive evidence:  
    - For high-stakes, one-shot decisions (e.g., scientific review, jury verdicts), implement **Blind First Round** to mitigate cascade risks.  
    - For dynamic or repeated settings (e.g., markets, technology adoption), avoid interventions; rely on self-correction mechanisms.  
    - Tailor remedies to diagnosed mechanisms: Use dissent incentives only if reputational herding is verified; never assume cascades without evidence of signal suppression.  
  Both camps agree that residual disagreement centers on the *prevalence* and *persistence* of cascades—not their theoretical possibility. Future work should prioritize testing cruxes (b) and (d) empirically.  

