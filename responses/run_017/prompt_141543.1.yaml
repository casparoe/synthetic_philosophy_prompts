prompt: |-
  I run a tiny grad-student philosophy podcast, and next week's guest is someone who defends an ideal-advisor account of reasons: roughly, what there's most reason for you to do is what a version of you with full information, unlimited time to think, no mood effects and no deliberative blind spots would advise you to do. The account is meant to be indirect — not a claim about how anyone should actually deliberate or about what should move them.

  I want eight to ten questions that get past her just restating the view again. Things I want covered:

  (1) The order-of-idealization worry. Give her a concrete case where informing first and then making the agent fully coherent yields different advice than making her coherent first and then informing her — and build in the follow-up to her likeliest move, which is to say she idealizes "all at once" and so there's no order.

  (2) The handoff problem: the advisor that exists now and the advisor who'd exist after I'd taken her advice pick different options, so which one supplies my reasons now? Follow up if she says reasons are time-indexed.

  (3) The insulated agent: someone whose actual motivational set screens off counterevidence (a true believer, say, whose commitment is defined so that no experience counts against it), so the "fully informed" version never gets going. Follow up on the likely reply that insulation is itself a deliberative defect to be idealized away.

  (4) Whether an advice-relation can really carry the weight here without the view collapsing either into objectivism with extra steps or into plain subjectivism — plus a closing question about what she'd count as evidence against the view.

  Keep the questions in her vocabulary rather than mine, and skip anything biographical.
reasoning: |-
  Okay, the user runs a small philosophy podcast for grad students and has an upcoming guest who defends an ideal-advisor account of reasons. They need help crafting 8-10 substantive questions that go beyond restating the view. The user wants to cover four specific philosophical challenges: order-of-idealization, handoff problem, insulated agents, and whether the view collapses into objectivism or subjectivism.

  Hmm, the user is clearly well-versed in this debate - they're using technical terms like "deliberative blind spots" and "motivational set screening" correctly. They're probably a philosophy grad student themselves or adjacent to the field. The podcast seems academic but tiny, so questions should be rigorous yet accessible for a niche audience. 

  The core challenge here is designing questions that:
  First, force the guest to engage with edge cases rather than retreat to definitions
  Second, anticipate common defenses (like "all-at-once idealization") and have follow-ups ready
  Third, avoid letting the guest dismiss objections as "not how idealization works"

  For the order-of-idealization issue... I recall there's literature on whether sequential idealization paths matter. The user's example about informing vs. cohering first is spot-on. If the guest says idealization happens simultaneously, we need a follow-up about whether that assumes coherence and information are compatible in principle - which they might not be for some agents. 

  The handoff problem is trickier. If reasons are time-indexed, does that mean future-me's reasons could contradict current-me's ideal advisor? That seems problematic. Maybe press on whether the view implies temporal fragmentation of reasons. 

  For insulated agents... the guest will likely call insulation a "deliberative defect." But is that circular? If the defect is defined as whatever blocks idealization, the view becomes unfalsifiable. Need to corner that. 

  And the collapse question... ugh, this is perennial for ideal advisor theories. The guest must walk a thin line between subjectivism (advisor's advice traces back to my actual desires) and objectivism (advisor discovers mind-independent reasons). Their answer will reveal whether this is just fancy subjectivism. 

  User also wants no biography - pure philosophy. And to use the guest's vocabulary. That means mirroring terms like "deliberative defects," "full information," etc. No jargon from rival theories unless the guest introduces it. 

  ...*scribbles draft questions*... 
  For the insulated agent: "Could you describe an agent whose motivational architecture prevents counterevidence from affecting certain commitments?" then "Why call that a deliberative defect rather than, say, a feature?" That should force engagement. 

  And for the closing: "What empirical outcome would make you reconsider?" avoids vague "what counts against" while demanding specificity. 

  User seems sharp - they'll notice if questions lack teeth. Gotta make sure each one can't be deflected with "that's not what ideal advisors do." Maybe add implicit pressure like "How does your view uniquely avoid X problem when other accounts fail?"
answer: |-
  Here are 10 targeted questions addressing your specified concerns, phrased in the guest's "ideal advisor" vocabulary while pushing for substantive engagement:

  1.  **Order-of-Idealization Setup:** Consider an agent with deep-seated but factually mistaken values (e.g., valuing a specific ritual because they falsely believe it pleases a benevolent god). If we *first* give this agent full information (revealing the god doesn't exist), their values might drastically shift, and *then* making them coherent yields advice to abandon the ritual. If we *first* make their current values coherent (removing inconsistencies *before* correcting the false belief), coherence might reinforce the ritual's importance, and *then* informing them might cause significant distress. **Follow-up:** You likely argue idealization happens "all-at-once," avoiding sequence issues. But doesn't this presuppose that coherence and full information are *combinatorially possible* for this agent? Could the clash between their actual starting point and the truth make a single "all-at-once" idealization incoherent itself?

  2.  **Handoff Problem Setup:** Imagine my ideal advisor *now*, with full info, advises me to undergo a costly but transformative experience (e.g., radical therapy) that will fundamentally reshape my core values and commitments. After undergoing this, my *new* ideal advisor (with the same full info, but now based on my transformed self) would advise me to pursue a path incompatible with what my *original* ideal advisor advised (e.g., abandoning a project the original self deeply valued). **Question:** Which ideal advisor defines my reasons *now*? Does the ideal advisor *at t1* bind me even after transformation? Or do reasons shift once my core self changes? **Follow-up (if time-indexed):** If reasons are time-indexed to the ideal advisor *now*, doesn't this potentially commit me to actions that my future, transformed self (who is also fully informed and coherent) will see as deeply mistaken? Does this create a problematic fragmentation of reasons over time?

  3.  **Insulated Agent Setup:** Consider a "true believer" whose commitment to a doctrine is defined such that *no possible evidence or argument* is allowed to count against it – counter-evidence is always reinterpreted as a test of faith or deception. **Question:** Can we even meaningfully conceive of a "fully informed" version of this agent? If full information logically includes evidence that *by the agent's own constitutive rules* cannot be accepted, does the idealization collapse? **Follow-up:** You might say this insulation *is itself* a deliberative defect to be idealized away. But isn't that problematic? If idealizing away the insulation means altering the very commitment that *defines* their core self, is the resulting advisor still an advisor *for that agent*, or just an advisor for a fundamentally different person?

  4.  **Collapse into Subjectivism?:** The ideal advisor's advice seems rooted in the idealized version *of the agent's own* motivational set. Doesn't this risk collapsing the view into a sophisticated subjectivism, where reasons are ultimately traceable to the agent's (counterfactually improved) contingent psychology, rather than being genuinely normative or truth-tracking? How is this substantively different from saying "do what you *would* want yourself to do if you were better informed and more rational"?

  5.  **Collapse into Objectivism?:** Conversely, if the ideal advisor's advice converges for *all* agents in a given situation – regardless of their starting motivational sets – because full information and coherence necessarily lead to the same evaluative conclusions, doesn't the view effectively collapse into a robust objectivism about reasons? What substantive role does the "advisor *for me*" part play in that case?

  6.  **The "Advice-Relation" Burden:** What *exactly* does the "advice" metaphor add that a simple description like "what the agent *would* choose if fully informed and coherent" doesn't capture? How does framing it as *advice from a counterfactual self* avoid the problems faced by simpler counterfactual accounts of reasons, or provide distinct justificatory force?

  7.  **Deliberative Defects & Self-Constitution:** Regarding the insulated agent follow-up: How do you distinguish "deliberative defects" that idealization properly removes (like mood effects, temporary ignorance) from core features constitutive *of the agent's identity* (like the insulated commitment)? Doesn't idealization need a principled, non-question-begging criterion for what counts as a defect *to be removed* versus a core feature *to be preserved* for the advisor to be *for me*?

  8.  **Identifying the Advisor's Motivational Base:** When constructing the ideal advisor, what determines *which* elements of my *actual* motivational set (desires, values, commitments) are preserved and refined through idealization, and which are discarded as distortions? Is there a risk of circularity here, where we define the "core" self as whatever survives the idealization process that gives us the reasons we want?

  9.  **Epistemic Access Problem:** How, in practice, can an ordinary agent *access* the advice of their ideal advisor? Since we lack full information and perfect coherence, any attempt to *simulate* the advisor seems fraught – how do we avoid simply projecting our own current, flawed judgments onto the imagined ideal self?

  10. **Falsifiability/Evidence Against:** What specific, non-hypothetical observation about the world, human psychology, or normative reasoning, if discovered to be true, would constitute strong evidence *against* the ideal advisor account being the correct theory of reasons? What would make you seriously doubt the view?

  **Key features of these questions:**
  *   **Vocabulary:** Uses "ideal advisor," "full information," "deliberative defects/blind spots," "coherence," "motivational set," "advice," "reasons."
  *   **Substance:** Forces engagement with core objections without letting restatement suffice (uses concrete cases, anticipates likely replies, pushes on implications).
  *   **Structure:** Sets up scenarios ("Consider an agent..."), asks pointed questions, includes embedded follow-ups within the main question or as direct follow-ups ("You might say... but isn't that problematic?").
  *   **Coverage:** Addresses all four requested areas (Order, Handoff, Insulation, Collapse/Falsifiability).
  *   **Avoids Biography:** Focuses purely on the philosophical content of the view.
