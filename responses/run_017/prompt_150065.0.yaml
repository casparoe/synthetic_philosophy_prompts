  ### Civilian Scenario: The Lost Hiker  
  A hiker is lost in one of two identical towns, Town A or Town B, each split into a riverside zone (20% of the town) and a downtown zone (80%). The hiker is equally likely to be in either town, so the prior probabilities are:  
  - Town A riverside: 10%  
  - Town A downtown: 40%  
  - Town B riverside: 10%  
  - Town B downtown: 40%  

  A local ranger, stationed in the same zone regardless of town, sends a message: "If you're in Town A, there's a three-in-four chance you're in the riverside zone." The ranger's protocol is town-blind: they send this message with probability 12 if in a riverside zone (any town) and probability 1 if in a downtown zone (any town). The likelihood ratio (riverside:downtown) is 12:1, well below 20.  

  ### Rule A: Bayesian Update (Treats message as evidence)  
  - **Likelihoods** (based on ranger's protocol):  
    - Riverside (any town): \(P(\text{message} \mid \text{riverside}) = 12\)  
    - Downtown (any town): \(P(\text{message} \mid \text{downtown}) = 1\)  
  - **Unnormalized posteriors** (prior × likelihood):  
    - A-riverside: \(0.10 \times 12 = 1.20\)  
    - A-downtown: \(0.40 \times 1 = 0.40\)  
    - B-riverside: \(0.10 \times 12 = 1.20\)  
    - B-downtown: \(0.40 \times 1 = 0.40\)  
  - **Total**: \(1.20 + 0.40 + 1.20 + 0.40 = 3.20\)  
  - **Posteriors** (normalized):  
    - A-riverside: \(1.20 / 3.20 = 0.375\)  
    - A-downtown: \(0.40 / 3.20 = 0.125\)  
    - B-riverside: \(1.20 / 3.20 = 0.375\)  
    - B-downtown: \(0.40 / 3.20 = 0.125\)  
  - **Check conditional**: \(P(\text{riverside} \mid \text{Town A}) = 0.375 / (0.375 + 0.125) = 0.75\) ✅  
  - **Posterior for Town A**: \(0.375 + 0.125 = 0.500\) (50.0%)  

  ### Rule B: Minimum Cross-Entropy Update (Minimizes KL divergence)  
  - **Constraint**: \(P(\text{riverside} \mid \text{Town A}) = 0.75\), so if \(x_1 = P(\text{A-riverside})\), \(x_2 = P(\text{A-downtown})\), then \(x_1 / (x_1 + x_2) = 0.75\) → \(x_1 = 3x_2\).  
  - **Minimize KL divergence** from prior \((0.10, 0.40, 0.10, 0.40)\) subject to \(x_1 = 3x_2\) and \(\sum x_i = 1\).  
  - **Solution**:  
    - Let \(x_2 = a\), then \(x_1 = 3a\), so Town A mass = \(4a\).  
    - Town B mass = \(1 - 4a\). To minimize divergence, Town B probabilities keep prior proportions:  
      - B-riverside: \(0.20 \times (1 - 4a)\)  
      - B-downtown: \(0.80 \times (1 - 4a)\)  
  - **Minimize** \(D(a) = 3a \log(30a) + a \log(2.5a) + (1 - 4a) \log(2(1 - 4a))\) numerically.  
    - Minimum at \(a \approx 0.08295\):  
      - \(x_1 = 3 \times 0.08295 = 0.24885\)  
      - \(x_2 = 0.08295\)  
      - Town A mass = \(0.24885 + 0.08295 = 0.33180\)  
      - B-riverside: \(0.20 \times (1 - 4 \times 0.08295) = 0.13364\)  
      - B-downtown: \(0.80 \times (1 - 4 \times 0.08295) = 0.53456\)  
  - **Check conditional**: \(0.24885 / (0.24885 + 0.08295) = 0.75\) ✅  
  - **Posterior for Town A**: \(0.33180\) (33.18%)  

  ### Disagreement and Key Features  
  - **Disagreement on Town A probability**: Rule A: 50.0%, Rule B: 33.18% → **difference = 16.82 percentage points** (exceeds 15% requirement).  
  - **Rule B decomposition**:  
    - **Shrinking Town A probability**: Prior Town A mass = 50.0%, posterior = 33.18% → **decreased by 16.82%**.  
    - **Adjusting within Town A**: Prior riverside share = 20%, posterior = 75% → achieved by increasing riverside probability (0.10 → 0.24885) and decreasing downtown (0.40 → 0.08295).  
    - Rule B "satisfies" the conditional primarily by making Town A itself less probable (mass shift to Town B), not just by updating within Town A.  
  - **Key feature causing disagreement**: The prior conditional probability (\(P(\text{riverside} \mid \text{Town A}) = 0.20\)) differs from the reported conditional (0.75). If they matched (e.g., prior riverside = 37.5% of Town A), both rules would agree on Town A at 50% (no divergence). Removing this difference eliminates the disagreement.  

  ### Defense of Rule B and Rebuttal  
  - **Defender of Rule B would argue**: "The message directly states a constraint about Town A's conditional probability, not a likelihood model. Rule B respects this constraint objectively without assuming how the message was generated. The town-blind protocol is irrelevant because the constraint is the only information we should use."  
  - **Rebuttal**: This argument fails because the ranger's protocol is explicit: the message depends only on the zone, not the town. Rule B's town probability shift (from 50% to 33.18%) contradicts the protocol's town-blind design, violating the evidence. Rule A correctly uses the protocol, so Rule B is over-ignorant.  

  ### Effect of Two Independent Reports  
  - **Gap behavior**: **Holds** (unchanged).  
    - **Rule A**: With two reports, likelihoods are squared (e.g., riverside: \(12^2 = 144\), downtown: \(1^2 = 1\)). Posteriors:  
      - A-riverside: \((0.10 \times 144) / 29.6 \approx 0.4865\), A-downtown: \((0.40 \times 1) / 29.6 \approx 0.0135\), Town A mass = \(0.500\).  
    - **Rule B**: First report sets \(P(\text{riverside} \mid \text{Town A}) = 0.75\). The second identical constraint adds nothing new, so posterior unchanged (Town A mass = 33.18%).  
  - Gap remains 16.82 percentage points.  

  ### Conclusion  
  This case cleanly generates the divergence from the rules' arithmetic (no rigging). Rule B's weakness is its failure to incorporate the message-generating protocol, leading to an unjustified shift in town probability. Rule A, using Bayesian updating, respects all evidence. The divergence is robust, holding even with repeated reports.
