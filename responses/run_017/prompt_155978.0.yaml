  Based on your case-by-case intuitions and the challenges you've identified, the principle that best captures your verdicts is **Updateless Decision Theory (UDT) with a correlation threshold for policy-linked agents**. This principle refines standard UDT to address the continuous dependence and threshold concerns in cases like 5 and 8. Below is a precise statement, followed by explanations and case resolutions.

  ### Principle: **Correlation-Threshold UDT (CT-UDT)**
  1. **At your initial prior**, choose a **policy** (a function from information states to actions) that maximizes expected utility.
  2. **Expected utility is computed** by:
     - Conditioning on your **entire policy** when evaluating outcomes.
     - Including as **policy-linked** any agent/system whose action is logically or acausally **correlated with your policy** at a level meeting or exceeding a threshold (e.g., >99% confidence in functional equivalence).
     - For policy-linked agents, treat their actions as **counterfactually dependent** on your policy (i.e., their output changes if your policy changes).
     - For non-policy-linked agents, treat their actions as **independent** of your policy (use marginal distributions).
  3. **At execution time**:
     - Identify your current information state (e.g., "I see $1M in Newcomb's box").
     - Execute the action specified by your precomputed policy for that state.
     - **Do not recalculate** expected utility at execution time (e.g., no updating at nodes in Absent-Minded Driver).

  **Threshold for policy-linked agents**: An agent is policy-linked if your initial prior assigns >99% probability that it uses the **same decision procedure as you** (same algorithm, same utility function). This threshold applies to:
  - **Copies/simulations** (case 4: 100% ➔ linked).
  - **Approximate models** (case 8: <99% fidelity ➔ not linked).
  - **Strangers with shared reasoning** (case 5: 99% confidence < threshold ➔ not linked).

  ---

  ### Case-by-Case Motivation
  - **Case 1 (Counterfactual Mugging)**:  
    *Principle clause: Policy-linked agents (simulation is logically dependent on your policy).*  
    You pay because Omega's simulation is policy-linked (threshold met). Paying nets +$1M if tails.

  - **Case 2 (Transparent Newcomb)**:  
    *Principle clause: Policies are functions of information states.*  
    Your flexible policy ("take big if $1M visible, else both") is chosen at the initial prior. It yields $1M (predictor fills the box knowing you one-box when $1M is visible). The rigid policy is equivalent, but flexibility is allowed.

  - **Case 3 (Smoking Lesion)**:  
    *Principle clause: Non-policy-linked agents (lesion is independent).*  
    You smoke because the lesion isn't policy-linked. The correlation is spurious; smoking doesn’t cause cancer.

  - **Case 4 (Twin PD, Copy)**:  
    *Principle clause: Policy-linked agents (copy uses your decision procedure).*  
    You cooperate because the copy is policy-linked (100% functional equivalence). Mutual cooperation is optimal.

  - **Case 5 (Twin PD, Stranger)**:  
    *Principle clause: Threshold excludes stranger (<100% confidence).*  
    You defect because the stranger is **not policy-linked** (99% < threshold). Without dependence, defection dominates:  
    - If they cooperate, defection gives +5 (temptation).  
    - If they defect, defection gives +1 (not 0).

  - **Case 6 (Absent-Minded Driver)**:  
    *Principle clause: No execution-time recalculation.*  
    **Beforehand**: Commit to continuing w.p. 2/3 (maximizes prior EU: (2/3)² · 1 + (2/3)(1/3) · 4 = 4/3).  
    **At an intersection**: Follow the policy (continue w.p. 2/3). Your gut’s exit verdict (1.6 > 1.2) is rejected—it violates no-recalculation.

  - **Case 7 (Randomization)**:  
    *Principle clause: Policy-linked predictors vs. non-linked pursuers.*  
    - **Newcomb**: Randomizing is bad because Omega is policy-linked. It predicts your mixed strategy, reducing EU vs. pure one-boxing.  
    - **Death in Damascus**: Randomizing is good because Death isn’t policy-linked (can’t predict the coin). 50/50 randomization forces Death to randomize, giving 50% survival chance.

  - **Case 8 (Coarse-Grained Models)**:  
    - **Mugging (pay)**: Omega’s model is policy-linked (fidelity irrelevant; it’s a **direct prediction** of your action). Paying nets +0.4 · $1M - $1K > 0.  
    - **Twin PD (defect)**: The model isn’t policy-linked (80% < threshold). Defect for same reason as case 5.

  ---

  ### Unaddressed Cases
  1. **Newcomb with 90% accurate predictor**:  
     - **Verdict**: One-box.  
     - **Why**: Predictor is policy-linked (>99% accuracy isn’t needed; correlation is direct). One-boxing policy nets 0.9 · $1M = $900K; two-boxing nets 0.1 · $1,001,000 = $100,100.

  2. **Twin PD with twin using your decision procedure but not caring about you**:  
     - **Verdict**: Defect.  
     - **Why**: Twin is **policy-linked** (same procedure), but their utility function differs. They defect regardless of your action (it’s dominant for their selfish utility). You defect to avoid sucker’s payoff.

  ---

  ### Why This Works
  - **Captures your verdicts**: Matches 1–7 and both unaddressed cases. Only case 6’s execution-time intuition is overruled (required by no-recalculation).  
  - **Handles dependence degrees**: Threshold (99%+) binarizes policy-linked status, avoiding unstable verdicts in cases 5/8.  
  - **Addresses your discomforts**:  
    - Case 5’s defect verdict is preserved (threshold excludes stranger).  
    - Case 2’s flexibility is allowed (policy is state-dependent).  
    - Case 8’s twin-PD instability is resolved (defect if fidelity <99%).

  ### Limitations
  - **Case 6**: Conflicts with your execution-time intuition (exit yields 1.6 > 1.2). CT-UDT prioritizes precommitment.  
  - **Threshold rigidity**: 99% is arbitrary; you might prefer a continuous rule. But this would break case 5 (defect) and case 8 (defect for <99%), which align with your gut.  
  - **Case 8 mugging**: You pay despite low fidelity because the model is explicitly a predictor. If you recast the mugging’s model as an "approximate twin," fidelity would matter, and you’d defect below 99%.

  This principle systematizes your intuitions while resolving inconsistencies, anchored in UDT’s core idea (optimize policies, not actions) with a threshold for when correlation implies counterfactual dependence.
