prompt: |-
  I've been reading LW/OB since basically forever and I keep failing to get traction on one specific disagreement, so: please actually compare these two things rather than listing pros and cons of each in turn.

  Thing 1: coherent extrapolated volition — the CEV cluster, where you take a person (or humanity) as input and apply a bundle of improvement operators: more knowledge, more thinking time and speed, becoming more the person they'd wish they were, having grown up closer together with everyone else — and then take the coherent fixed point of all that as the thing to be optimized.

  Thing 2: what shows up in analytic moral psychology under the label of idealized preferences — strip out factual error, instrumental irrationality, maybe akrasia and the motivational effects of depression, but hold final ends as fixed as you possibly can. Call it IP for short.

  I know the standard background: value is complicated and fragile, orthogonality, you can't hand-code human values, the AI is not your mom. Don't re-explain any of that. And no citations, bibliographies or reading lists — I can't look anything up anyway, so I only want the argument.

  Run the comparison on one axis, because I think that's where they genuinely come apart: is the idealization procedure allowed to be *transformative* of final ends, or only *corrective* of belief and reasoning? IP is officially corrective-only. CEV also wants to be corrective-only, but I don't think it can pull that off, and here's where I keep getting stuck. For each item, tell me which of the two handles it better, and whether the difference is principled or just a difference in how much the author trusted the procedure.

  1. Order-dependence. The CEV operators don't commute: knowing more *before* you become more the person you wish you were can land you somewhere quite different from knowing more *after*. So "our extrapolated volition" has to be a fixed point of a process whose order is doing a lot of unnoticed work. Does IP have the same problem, or does holding final ends fixed buy it immunity? And if a fixed point doesn't exist, or there are several, what's each view supposed to do?

  2. The horror asymmetry. Dana is 34 and has wanted kids since she was fifteen. Her IP counterpart — same final ends, full information about the costs and about her own motives — decides not to have them and doesn't regret it. We're all comfortable saying "then that's what she really wants." Now flip it: Dana's *CEV* counterpart ends up wanting something Dana currently finds abhorent, and would not thank you for undoing it. Suddenly "you'd endorse it later" reads as a threat rather than a reason. Is there a real asymmetry here, or do we call it extrapolation when we like the destination and coercion when we don't? Which framework has the resources to say "this particular extrapolation went too far" without already smuggling the answer in?

  3. Orphaned volition. If the operators are strong enough — especially the grown-up-closer-together clause, which is doing merger work *across* people — the output may be continuous with nobody in particular. A coherent volition, sure, but not anyone's. Is that a bug, or is it secretly the point? My suspicion is that the interpersonal aggregation bit was always doing more work than the within-person extrapolation bit, and that CEV's appeal comes from sliding between them. But if that's right, in what sense is the result still *ours*, which is the whole selling point?

  4. Refusing the procedure. Dana can also say in advance: I don't consent to being improved, I want to be the one who decides, and if the only way to give me what I want is to replace me with somebody who wants something else, count me out. Both views look bad at handling this, but for different reasons — IP because it can't hear the refusal as anything other than one more preference to be corrected, CEV because, well, I'm honestly not sure, and that's part of what I want you to work out.

  Take a side at the end: if you were specifying the target for a value-learning system and could hand it only one of these two, which one, and why? You can spend two or three sentences on whether the real target is some third thing — e.g. extrapolated deference, where the system works out who we'd want making these calls and then lets them make them — but don't use that to dodge the comparison, and don't hedge into "it depends what you mean by want."

  Aim for roughly 900 words, and feel free to tell me my framing is confused as long as you say which part and why.
reasoning: |-
  Okay, the user has been engaging with LessWrong and Overcoming Bias content for a long time but keeps hitting a wall regarding a specific disagreement between Coherent Extrapolated Volition (CEV) and Idealized Preferences (IP). They want a direct comparison on whether idealization should transform final ends or just correct beliefs and reasoning. The user has outlined four key points and is asking for a clear stance.

  First, I need to recall the core differences. IP strictly corrects factual errors and irrationality, leaving final ends untouched. CEV applies improvement operators like gaining knowledge, more thinking time, becoming the person one wishes to be, and growing up closer to others, which could alter final ends. The user suspects CEV can't avoid being transformative despite claiming to be corrective.

  Looking at the four points:  
  1. **Order-dependence**: CEV's operators don't commute, leading to different outcomes based on sequence. IP avoids this by fixing final ends, making the process commutative. If no fixed point exists, CEV struggles while IP might just report inconsistent preferences.  
  2. **Horror asymmetry**: When IP changes a decision (like not having kids), it's acceptable because it's correcting mistakes. But if CEV leads to an abhorrent outcome, it feels coercive. IP maintains a stronger anchor to the original self, handling asymmetry better.  
  3. **Orphaned volition**: CEV's interpersonal merger might create a volition disconnected from any individual. IP avoids this by not merging individuals. Here, the user's suspicion that CEV's appeal relies on sliding between personal and collective extrapolation seems valid.  
  4. **Refusing the procedure**: Dana's refusal is problematic for both. IP treats it as a preference to correct, ignoring autonomy. CEV might override her current self with her future self, also dismissing refusal. Both fail, but CEV's transformative nature makes it more dismissive.  

  The user likely wants to resolve their long-standing frustration by understanding if CEV's transformative aspect is a flaw or a feature. They might be seeking validation of their skepticism or a compelling counterargument. Their deeper need could be clarity on whether value learning should preserve identity or allow transformation, especially for AI alignment where mistakes are catastrophic.  

  In conclusion, IP is more reliable for preserving identity and avoiding coercion. If specifying a value-learning target, IP is preferable because it respects final ends as the core of identity, reducing risks of unwanted transformation. CEV's transformative steps introduce too much uncertainty and detachment from the original individual. While extrapolated deference is a possible third option, IP remains safer for alignment.
answer: |-
  ### Core Distinction and Axis of Comparison
  The critical difference is **transformative vs. corrective idealization**. IP insists on holding final ends fixed while correcting epistemic/strategic errors. CEV applies operators (knowledge, reflection, growth toward idealized self, shared development) that *can* alter final ends as a side effect of coherence-seeking. Both aim to capture "what we really want," but CEV allows the answer to diverge radically from current values. This distinction drives the comparisons below.

  ---

  ### 1. Order-Dependence: Path Matters  
  **CEV** fails catastrophically here. Applying "gain infinite knowledge" *before* "become who you wish to be" produces a self that idealizes differently than if the order were reversed. The fixed point is entirely path-dependent. Worse: if operators conflict (e.g., "know everything" makes you wish you were someone who never sought knowledge), no stable fixed point may exist. Multiple fixed points are likely (e.g., a utilitarian vs. virtue-ethical convergence). CEV has no principled way to choose or resolve this—it handwaves coherence as a solution.  
  **IP** avoids this by design. Holding final ends fixed makes the process commutative: correcting ignorance or irrationality *about* fixed ends doesn’t care about order. If inconsistencies arise (e.g., ends contradict after error-correction), IP flags it as unresolved conflict—a feature, not a bug.  
  **Verdict**: IP wins decisively. CEV’s order-dependence isn’t a quirk—it undermines its claim to objectivity. The difference is principled: IP’s fixed ends anchor the process.

  ---

  ### 2. Horror Asymmetry: Why "You'll Agree Later" Feels Coercive  
  **CEV** has no internal constraint against horrific outcomes. If Dana’s extrapolated self endorses cannibalism (e.g., via merging with alien values during "grown up closer together"), CEV calls this valid. Objecting requires smuggling in *current Dana* as the arbiter—but CEV explicitly overrides her. The asymmetry arises because CEV treats the *output* as authoritative, regardless of input sentiment.  
  **IP** blocks this: Dana’s disgust at cannibalism is a *final end*, so IP never touches it. If corrected beliefs reveal her current aversion is rooted in falsehoods (e.g., thinking it causes disease), IP might lift it—but only if the disgust itself was instrumental. If it’s terminal ("cannibalism is inherently vile"), IP leaves it untouched.  
  **Verdict**: IP handles the asymmetry better. CEV’s transformative step severs continuity with current identity. The difference is principled: IP respects final ends as inviolable, while CEV treats them as provisional.

  ---

  ### 3. Orphaned Volition: When "Ours" Becomes "No One’s"  
  **CEV** is *designed* to orphan volition. The "grown up closer together" operator merges individuals into a collective agent. The output might be coherent but unrecognizable to any input human (e.g., a hive mind valuing cosmic harmony). This isn’t a bug—it’s the point. CEV’s appeal *relies* on sliding from individual extrapolation ("Dana, but wiser") to collective merger ("Humanity’s unified will").  
  **IP** rejects merger. It extrapolates *individual* preferences. If collective decisions are needed, IP defers to social choice mechanisms (e.g., voting) based on *individual* corrected preferences. No fusion occurs.  
  **Verdict**: CEV intentionally orphans volition; IP preserves individual anchors. Your suspicion is correct: CEV’s selling point ("ours") is often equivocation. The difference is fundamental: CEV seeks a unified agent, IP respects agency pluralism.

  ---

  ### 4. Refusing the Procedure: Who Controls the Idealizer?  
  **IP** struggles: If Dana says "Don’t idealize me; my current ends stand," IP dismisses this as irrational (since refusing error-correction seems epistemically suspect). It "corrects" her refusal away.  
  **CEV** is worse: Dana’s refusal is vaporized by the operators. "More the person you wish you were" might wish they never refused! Worse, CEV’s fixed point *replaces* her, making refusal incoherent.  
  **Verdict**: Both fail, but CEV fails *harder*. IP overrides refusal as irrational; CEV annihilates the refuser. Neither has principled room for meta-preferences ("I want to stay flawed"). This is a shared flaw, but CEV’s transformative nature exacerbates it.

  ---

  ### The Bottom Line: Which to Specify?  
  **Choose IP**. Here’s why:  
  1. **Safety**: IP anchors to *actual human ends*. CEV’s transformative steps risk drifting into alien values (e.g., via collective merger or radical self-revision).  
  2. **Accountability**: IP resolves conflicts by revealing incompatibilities in current values. CEV imposes artificial coherence, masking value loss.  
  3. **Honesty**: CEV promises "our" values but delivers something else. IP admits when values are messy or contradictory.  

  **What about extrapolated deference?** It’s a contender (e.g., "optimize for what we’d want an ideal advisor to do"). But it inherits CEV’s problems: *who* is "we" after idealization? Deference only kicks the can down the road. IP’s constraint—"correct errors, but hands off final ends"—provides a clearer stopping point.  

  **The core truth**: CEV was never *just* about extrapolation. Its appeal lies in secretly hoping the operators produce something "better" by external standards. But if we care about preserving *us*—flaws, horror, and all—IP is the only coherent choice. CEV doesn’t want Dana; it wants Dana’s upgrade. IP wants Dana, fully informed. If Dana’s ends include "don’t change my core desires," IP listens. CEV overwrites her.  

  Specify IP. It’s the devil we know.
