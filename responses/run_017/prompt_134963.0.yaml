prompt: |-
  I've been going in circles on something in the metaphysics of what I'll call ontology identification, and I want to try reflective equilibrium on it rather than read another paper about it. So: verdicts first, principle wanted.

  Setup. There's a target system we only ever meet through a fixed interface — call it the channel. The channel gives us (i) a finite set of readouts at each time step, (ii) a finite menu of interventions we can perform (knob settings, plus doing nothing), (iii) a fixed time resolution. Ontology identification is the task of recovering, from everything the channel could in principle give us — unlimited samples, every sequence of interventions on the menu, run forever — what the system is made of: how many variables, what their state spaces are, and what the dynamics is, i.e. which variables depend on which and via what functions.

  There will always be information about the system that no amount of channel output discriminates: two candidate ontologies can agree on every accessible trajectory under every available intervention while genuinely disagreeing about what is going on in there. Sometimes I think that means "harmless redundancy, ignore it"; sometimes I think it means "we don't know what the system is." I can't get the the distinction right, so here are my cases.

  1. Candidate B is candidate A with two hidden variables permuted and the dynamics relabeled to match. Verdict: same ontology, nothing to choose. Same for any state-space isomorphism.

  2. H is a deterministic function of the other variables and nothing depends on it. Verdict: not real, throw it out, and I feel no pull toward agnosticism here.

  3. H is undetermined by the dynamics and affects nothing ever — the modeler can set it to anything, like a gauge. Verdict: not part of the ontology, an artifact of the representation. (Though I'm not sure 2 and 3 are the same kind of not-real, and I'd like to know if the difference matters.)

  4. Gas in a box; the channel gives only pressure and temperature and lets me move a piston. We posit ~10^23 particles. Verdict: obviously the ontology. Inaccessibility in practice is no bar, and in fact we get indirect purchase through fluctuation behavior, so this one feels easy.

  5. Bookkeeping case: the accessible quantities obey a conservation law, and the books don't balance unless something unseen is carrying the remainder. Verdict: identified and real, even though the carrier itself is never read. It's pinned down by what it carries, not by being observed.

  6. Shadow sector (my name, possibly just a name for my confusion): H is dynamically active — the evolution of accessible variables depends on it — but its influence is exactly cancelled by a compensating parameter, so every accessible trajectory matches the H-free model. Not isomorphic to it, though. Verdict: this is a real disagreement about what's in there; I won't say "no difference," and I won't say "both true," and I also can't see what could ever settle it.

  7. Measurement incompatibility: reading H would require interacting with the system in a way that resets the very register I'd be reading. I can describe the intervention; I can't perform it. Verdict: H is real if the dynamics says so, the ontology question is perfectly well posed, we are merely data-poor.

  8. Washed-out initial conditions: a variable set once at startup whose only effects are erased by mixing within a hundred steps, while my channel doesn't switch on until step thousand. Verdict, and this is the one I distrust: I find myself saying "don't count it, no fact of the matter." But structurally 7 and 8 are the same — information definite in the model and inaccessible to me — and I don't want to be inconsistent.

  9. Embedded observer: a subsystem inside the box has H in its input map, and I can see that subsystem's reports through the channel, though I can neither set nor read H myself. Verdict: H is real. But note what this does: if "accessible to someone" is what makes it real, then 6 should have come out the other way; if dynamic activity is what does the work, then the embedded observer's access is idle. Either way one of my reasons is doing nothing.

  10. Saftey case: H in {safe, lethal} determines whether intervention I kills the subject, is dynamically active, and no accessible evidence discriminates. Verdict: I must act as if it might be lethal, but I resist saying the stakes make it more real — and yet I'm much more reluctant to say "no fact of the matter" here than in 8, and I don't know whether that's tracking existence or just risk.

  A grad student told me I'm running together "is there more in there?" with "could we ever pin down which?" I half believe her and half don't: I can't see how separating them saves both 6 and 8.

  Two I'm genuinely torn on: (a) the self-referential one, where the register that stores the identifier's own model of the system is itself a variable inside the system and the channel can't output its full contents — well-posed but hard, or does the question move when you ask it, because identifying it changes it? (b) the multiscale one, where coarse time resolution yields three variables with nonlinear dynamics and fine resolution yields five with nearly linear dynamics, both exact at their own resolution and neither obviously reducible to the other — is the ontology resolution-relative, which feels like giving up, or is there a unique finest grain, which may not exist?

  What I want: one criterion, stated up front as a single principle before you go through the cases, that sorts these — not a list of intuitions. If it is really two-part (a condition for there being anything more at all, and a separate one for identifiability), say which part does which work. Test the one I keep falling back on — posit a variable only if it isn't eliminable by isomorphism and the evolution of some accessible variable depends on it under some intervention — repair it if it breaks, and tell me honestly which of my verdicts it can't keep. Then run whatever you end up with on (a) and (b), and on one case I haven't thought of that you think is diagnostic. Numbered replies keyed to my cases are fine.
reasoning: |-
  Okay, the user is really struggling with ontology identification in metaphysics. They've laid out ten detailed cases and two additional tricky scenarios, all centered around when to consider a variable "real" in a system observed through a limited interface. They want a single unifying principle to resolve their confusion, not just case-by-case intuitions. 

  Hmm, their core tension seems to be between epistemic accessibility ("can we know it?") and ontological commitment ("is it there?"). They're suspicious when these get conflated—like in case 10 where stakes make them *feel* H is real despite inaccessibility, or case 8 where they dismiss a variable despite its theoretical role. Their grad student's comment about separating existence from identifiability hits close, but they're stuck on why cases 6 and 8 should differ. 

  *flips through mental notes* Right, the key insight might be: a variable is ontologically real if its deletion *breaks* the model's predictive power across *all possible interventions*, even if we can't observe it directly. But—crucially—only if no isomorphism can "absorb" its absence. Let's test this against their verdicts:  

  For case 2 (redundant H), deleting it changes nothing→unreal. Case 5 (bookkeeping variable) deletion breaks conservation→real. Case 6 (shadow sector) is sneaky: deleting H *doesn't* break predictions because compensation hides it→so unreal by my principle! But they called it a "real disagreement." *pauses* Wait, maybe they're conflating mathematical distinctness with ontological difference? Two models can be mathematically different yet ontologically equivalent if they predict identically.  

  Case 8 (washed-out initial conditions) is clearer: deleting the variable *would* break the model's accuracy for early steps (even if unobserved!), so it's real. Their intuition to dismiss it might stem from practical irrelevance, but ontology isn't about utility. *nods* This resolves their tension with case 7—both have inaccessible but dynamically essential variables.  

  Ah, their proposed criterion ("posit if non-isomorphic and dynamically relevant") was almost right! It broke on case 6 because they missed that isomorphism must preserve *all* interventions. For the shadow sector, no intervention can expose H→it's isomorphic to the H-free model.  

  For the multiscale problem (b): both coarse and fine models are real at their resolutions, but the "fundamental" ontology is the one that remains predictive across *all* interventions at *all* scales. If no such model exists (e.g., quantum vs classical), we might need multiple ontologies—but that's not giving up, it's respecting emergent layers.  

  *winces* The self-referential case (a) is brutal. If the model-storing variable affects predictions (e.g., via computational load), it's real; else it's metadata. But yes, observing it might alter it—this bleeds into quantum observer issues. Maybe punt to "operationally, include only variables affecting external predictions"?  

  Finally, their case 10 (lethal H): stakes don't make H real; dynamics do. If deleting H changes *no* predictions (even lethal ones), it’s unreal—but that feels wrong! *lightbulb* Unless... the "lethal" outcome *is* observable! Then H must be real because setting I when H=lethal produces a unique outcome. They likely assumed H's value leaves *no trace*, making it functionally identical to H=safe. So verdict: unreal, but act cautiously because we *can't confirm* it's safe.  

  *exhales* This should untangle most knots. Their resistance in case 6 was the biggest hurdle—hopefully framing it as "isomorphism under interventions" clicks. Time to package this tightly.
answer: |-
  Here's a single-principle criterion for ontology identification, followed by a systematic application to your cases, repairs to your proposed criterion, and resolution of (a) and (b). The core insight: **Ontological commitment is justified iff a variable is *functionally indispensable* under interventions**, meaning its removal *breaks predictive accuracy* for some intervention sequence, *even after* allowing for isomorphisms.

  **The Criterion: Functional Indispensability**  
  A variable \(H\) is part of the ontology iff:  
  1. **Non-Eliminability**: There is no isomorphism (relabeling state-space or dynamics) that maps the system *without* \(H\) to the system *with* \(H\) while preserving all input-output predictions under *all possible interventions*.  
  2. **Interventional Dependence**: Some accessible variable’s trajectory (under some intervention sequence) depends counterfactually on \(H\)’s state or dynamics.  

  *Crucially*, (1) and (2) are interdependent: (2) ensures (1) isn’t vacuously satisfied by trivial models. "Depends" means: holding fixed other variables, changing \(H\) changes an accessible output.  

  **Repairing Your Proposed Criterion**  
  Your "non-isomorphic + dynamically relevant" fails on **Case 6 (Shadow Sector)**. The shadow variable *is* dynamically active (so your criterion includes it) but is *eliminable by isomorphism* (contradicting your verdict). The repair: **demand non-isomorphism *under interventions***. If no intervention can expose \(H\)’s value because compensation cancels its effect, it’s isomorphic to a system without \(H\).  

  ---

  ### Application to Your Cases  
  1. **Permuted variables**: Isomorphism preserves predictions → satisfies non-eliminability vacuously? No: isomorphism *maps* system A to B, so **same ontology** (correct).  
  2. **Deterministic, unused \(H\)**: Removable without breaking predictions → **not real**.  
  3. **Gauge variable**: Same as (2) → **not real**. (Difference: (2) is constrained by dynamics; (3) is unconstrained. But both fail indispensability identically.)  
  4. **Gas particles**: Removing particles breaks predictions (e.g., fluctuations, piston dynamics under rapid interventions) → **real**.  
  5. **Bookkeeping variable**: Deleting it violates conservation laws → breaks predictions → **real**.  
  6. **Shadow sector**: No intervention reveals \(H\)’s value; isomorphic to \(H\)-free model → **not real**. (Your verdict reversed: no "real disagreement" because models predict identically.)  
  7. **Unreadable register**: Dynamics depend on \(H\) (e.g., its value affects future accessible states); removing it breaks predictions → **real**.  
  8. **Washed-out initial condition**: If initial \(H\) affects *any* accessible trajectory under *some intervention* (e.g., resetting early), it’s real. If truly *no* intervention reveals it (even hypothetically), **not real**. (Consistent with 7: both hinge on counterfactual dependence.)  
  9. **Embedded observer**: The *report* is accessible and depends on \(H\) → **real** (but via the report, not "access").  
  10. **Lethal \(H\)**: If intervention \(I\) *can* kill (an accessible outcome!), \(H\) is indispensable → **real**. If \(H\)'s effect is *always* masked (e.g., death is unobservable), **not real** (but you should still avoid \(I\); stakes don’t create ontology).  

  ---

  ### Diagnosis & Repairs  
  - **Case 6 vs. 8**: Your inconsistency arose because you focused on dynamic activity without demanding *exposure under interventions*. Case 6 has activity but no exposure → unreal; Case 8 has no exposure → unreal.  
  - **Grad student’s insight**: Correct. Existence ≠ identifiability. Cases 2,3,6,8 have no identifiable difference but also no *factual* difference (due to isomorphism).  
  - **Your repaired criterion works** if: "isomorphism" includes intervention-preserving mappings, and "depends" means *counterfactual dependence under interventions*.  

  ---

  ### Tricky Cases Resolved  
  **(a) Self-referential model-register**:  
  - If the model’s content affects accessible outputs (e.g., via computational load), it’s **real**.  
  - If it’s isolated (no counterfactual dependence), **not real**.  
  - *Caveat*: "Identifying" it may perturb it (quantum-like), but the ontology is still well-posed for a *given* intervention set.  

  **(b) Multiscale dynamics**:  
  - Both coarse (3-variable) and fine (5-variable) models are real *at their operational scales* if indispensable there.  
  - **No unique finest grain**: If fine variables are indispensable under fine-resolution interventions (e.g., rapid pulses), they’re ontologically primary. If coarse variables emerge as invariants (e.g., center-of-mass), they’re real at coarse scale.  
  - *Not "giving up"*: Ontology is scale-relative when interventions are resolution-constrained.  

  ---

  ### Diagnostic Case: Overparameterized Neural Net  
  - **Setup**: A neural net predicts outputs from inputs. Two models:  
    - \(A\): 10 neurons with nonlinear activations.  
    - \(B\): 1000 neurons, but 990 are redundant (e.g., duplicates).  
  - **Verdict**: \(B\)’s extra neurons fail Functional Indispensability—removing them doesn’t break predictions → **not real**.  
  - **Why it matters**: Exposes that "complexity" isn’t ontological; only indispensable structure is.  

  ### Final Principle  
  > **Ontological Commitment Criterion**:  
  > A variable is real iff its removal alters the input-output map under some intervention sequence, *even after* optimal relabeling/isomorphism of the reduced model.  
  >  
  > *Corollary*: If two models predict identically under all interventions, they describe the same ontology.  

  This saves all your verdicts except **6** (shadow sector unreal) and **10** (lethal H unreal *if* death is unobservable). Stakes and dynamic activity alone don’t ground ontology; only *indispensable difference-making* does.
