prompt: |-
  Hey — I'm in a philosophy of emotion seminar this term and I've got a short paper due (about 1200 words) on some real practice that seems to presuppose a view about what emotions are. I want to do the criminal law one and I'd really like your help getting it framed before I start writing.

  Here's the practice, more or less as we got it in class. In the standard textbook version of provocation / heat-of-passion doctrine, an intentional killing that would otherwise be murder gets reduced to manslaughter only if: (a) there was adequate provocation; (b) the defendant actually was provoked; (c) a reasonable person would have been provoked too; and (d) there wasn't enough time between the provocation and the killing for the defendant to cool off. There's also the old rule that words on their own aren't adequate provocation, and I think some places have quietly dropped the suddenness bit, but I definately don't care about the exact current state of the law anywhere — use the textbook version, and tell me if the answer would turn on which jurisdiction's version you take.

  What's bugging me is that the pieces seem to pull in different directions. Condition (c) treats the emotion as something that can be correct or incorrect, reasonable or unreasonable — that sounds like the judgement view or the perception view. But (d) and all the heat talk treats it like a quantity of intensity that decays on its own if you wait, which sounds much more like the feeling view. And (a) and (d) care about the content of the emotion and about its timing in a way that none of the three theories we read seem to care about — none of them says anything about how long an emotion is supposed to last, or about what it even means to wait one out rather than revise it.

  So: what theory of emotion does the doctrine actually presuppose? Can a single view cover all four conditions, or is the doctrine a grab bag? Which conditions strictly need which theory, and which ones would two or three different views license equally happily? What would have to change in the doctrine if we went full judgement theory, or full just-a-feeling theory? And here's my half-baked idea — maybe the law is committed to a fourth picture we never discussed: emotions as episodes with a characteristic shape over time, so that still being furious an hour later becomes something you're answerable for in a way that being furious in the first two minutes isn't. Is that genuinely a fourth option, or is it one of the three in a costume?

  Please don't give me citations or a reading list; I'll fill those in myself, and I honestly can't remember who argued for what anyway.

  Could you give it back in these sections, roughly:

  - The implicit theory (about 300 words): reconstruct in one piece the view of emotion the doctrine needs.
  - What it strictly needs vs. what it merely sits well with (about 200).
  - Where several theories would license the same doctrine (about 150).
  - Counterfactual doctrine (about 200): what would change under a pure judgement view, and under a pure feeling view.
  - On the time-shape idea (about 150): fourth option or a disguise?
  - Where I'd change my mind (about 150): the argument or case that would flip your verdict, and where your reconstruction is most likely to crack.

  Also flag as you go anywhere you're guessing rather than confident — I'd rather have an honest hedge than a smooth story I can't defend in section.
reasoning: |-
  Okay, let me try to unpack the user's request. They're working on a philosophy paper about the criminal law doctrine of provocation and its implicit theory of emotion. The main tension they see is between different conditions: (c) treats emotion as reasonable/unreasonable, while (d) treats it like a physical sensation that fades. They're wondering if the doctrine requires a single coherent theory or if it's inconsistent.

  Hmm, the user seems really sharp—they've identified a genuine philosophical puzzle in legal doctrine. Their half-baked idea about emotions having a "characteristic shape over time" is particularly interesting. I should take that seriously while still being critical.

  First, I need to reconstruct the implicit theory. The doctrine clearly blends cognitive and physiological elements. The reasonable person standard (c) suggests emotions can be evaluated for appropriateness, leaning toward judgment or perception theories. But the cooling-off period (d) implies emotions are visceral states that decay passively, which aligns more with feeling theories. 

  For a unified theory, maybe the law treats emotions as "evaluative disturbances" - cognitive assessments that trigger physiological arousal with a natural attenuation curve. This hybrid view explains why both the provocation's adequacy (content) and the timing matter. The "heat" metaphor isn't just decorative—it captures this dual nature.

  Now, what's strictly necessary? Condition (c) absolutely requires a cognitive element; a pure feeling theory couldn't support reasonableness evaluations. Conversely, (d) needs some physiological component—pure judgment theory would expect cognitive reappraisal, not just waiting to cool off. 

  Where do theories overlap? The actual provocation requirement (b) could work under any theory—all agree emotions can be subjectively experienced. The content sensitivity (a) fits both cognitive and hybrid views.

  Counterfactuals: Under pure judgment theory, cooling time would focus on opportunity for reappraisal, not passive decay. Under pure feeling theory, reasonableness would vanish—we'd ask only about intensity, not adequacy of provocation.

  The user's time-shape idea is insightful but not entirely new. It extends existing hybrid views by emphasizing temporal structure, making duration part of the emotion's moral logic. But it's still within the broader hybrid framework.

  Where might this crack? If empirical psychology shows physiological arousal doesn't actually decay predictably, or if some jurisdictions have dropped suddenness without collapsing the doctrine. Also, the words-alone rule might undermine the hybrid view's cognitive claims.

  The user's clearly done their reading but wants help synthesizing. They're wary of oversimplification, so I'll highlight uncertainties. Their framing questions are excellent—I'll structure the response around them while preserving the philosophical nuance they're after.
answer: |-
  Here’s a structured analysis of the provocation doctrine’s implicit theory of emotion, following your requested sections. I’ll flag uncertainties as they arise.

  ---

  ### 1. The Implicit Theory (Hybrid "Evaluative Disturbance" View)  
  The doctrine presupposes a **hybrid theory of emotion** combining cognitive and physiological elements. Emotions are treated as:  
  - **Cognitive-evaluative states** (reflected in conditions (a)–(c)): Provocation requires an *object* (e.g., witnessing infidelity), implying emotions are intentional (about something). Condition (c) demands the evaluation be "reasonable," suggesting emotions can be normatively assessed like judgments (e.g., "Would a rational agent deem this insult sufficiently grave?").  
  - **Physiological disturbances with temporal dynamics** (reflected in (d) and "heat of passion"): Emotions are "heat" that *rises* (sudden onset) and *cools* (passive decay over time). This frames emotion as a somatic state—a quantity of arousal that dissipates independently of reappraisal.  

  The synthesis is an **"evaluative disturbance"**: a cognitive appraisal *causes* acute physiological agitation that temporarily overrides rational control. The law cares about *content* (was the appraisal warranted?) and *timing* (did the somatic reaction preclude self-regulation?). Neither pure cognitivism nor feeling theory alone suffices; the doctrine needs emotion as a *content-driven bodily state* with a predictable attenuation curve.  

  *(Uncertainty: The "cooling-off" model assumes a universal decay rate. Psychology suggests this varies—doctrine might oversimplify.)*  

  ---

  ### 2. What It Strictly Needs vs. What It Merely Sits Well With  
  - **Strictly needs**:  
    - **Cognitive element** for (a)/(c): Without appraisal, "provocation" lacks content. A pure feeling theory couldn’t support "reasonableness" or "adequacy."  
    - **Physiological/temporal element** for (d): Pure judgment theory expects cognitive reappraisal, not passive cooling. "Suddenness" implies emotion is a wave to be waited out.  
  - **Sits well with**:  
    - Perceptual theories (emotions as perception of value) can accommodate (c)’s reasonableness.  
    - Feeling theories align with (d)’s focus on intensity and duration.  
    - *But neither alone justifies the full framework.*  

  ---

  ### 3. Where Multiple Theories License the Same Doctrine  
  - **Condition (b) ("actually provoked")**: Compatible with *all* major theories (judgment, perception, feeling). Any view accepts that emotions can be subjectively experienced.  
  - **Condition (a) (provocation "adequacy")**: Judgment *or* perception theories both support normatively assessing the trigger’s content. Feeling theory *alone* struggles here (feelings lack intrinsic "adequacy").  
  - **"Words alone" rule**: Fits judgment/perception theories (words may not warrant extreme appraisal) *or* feeling theory (words may not trigger somatic intensity).  

  ---

  ### 4. Counterfactual Doctrine: Pure Judgment vs. Pure Feeling  
  - **Pure Judgment Theory**:  
    - (d) would require *opportunity for rational reappraisal*, not passive cooling. "Cooling off" = time to reassess the insult, not wait for anger to subside.  
    - (c) might expand: "Reasonableness" could include cultural context of appraisal (e.g., "Is *this* insult grievous in *this* community?").  
    - "Suddenness" becomes irrelevant—what matters is whether reappraisal was possible.  
  - **Pure Feeling Theory**:  
    - (a)/(c) collapse: "Adequacy" and "reasonableness" are incoherent; only intensity matters. Provocation reduces to "Did the trigger cause overwhelming arousal?"  
    - (d) dominates: Focus shifts to biological cooling time (e.g., "Does rage peak at 2 minutes? 10?").  
    - *Result: Manslaughter expands wildly—any intense feeling (e.g., envy, shame) could qualify.*  

  ---

  ### 5. On the Time-Shape Idea: Fourth Option or Disguise?  
  Your "characteristic shape" idea is **insightful but not a fourth theory**. It’s the **hybrid view made explicit**:  
  - The law *does* treat emotion as an episode with moral weight tied to duration. "Heat" implies a trajectory: ignition → peak → decay. Lingering fury becomes a "choice" (judgment) rather than a "storm" (feeling).  
  - *However*, this is still grounded in the hybrid "evaluative disturbance" model: the *appraisal* (e.g., "My honor was attacked!") ignites the somatic state, and its duration is presumed to reflect a failure of rational governance.  
  - **Verdict**: A sophisticated extension of the hybrid view, not a new theory.  

  *(Uncertainty: Doctrine may *assume* a universal time-shape. If emotions vary culturally/individually, the model cracks.)*  

  ---

  ### 6. Where I’d Change My Mind  
  - **If "cooling off" is empirically baseless**: If psychology shows somatic arousal *doesn’t* passively decay (e.g., anger escalates without reappraisal), the hybrid view fails. (d) would then require cognitive retraining, not waiting—pushing doctrine toward pure judgment theory.  
  - **If jurisdictions dropping "suddenness" retain coherence**: If some courts ignore timing but keep (a)–(c), the physiological element is less essential. This favors judgment/perception theories.  
  - **Weakest link**: The **"words alone" rule**. If words *can* provoke, it undermines the somatic emphasis (feelings *can* arise from speech) and questions the cognitive focus (are words "inadequate" because they’re weak appraisals or weak stimuli?). Here, the hybrid view strains.  

  ---

  **Summary**: The doctrine presupposes a **cognitive-physiological hybrid** where emotion is a *provocation-triggered somatic state* that *temporarily suspends reason*. No single classical theory captures it fully, but your "time-shape" insight sharpens the hybrid model. The biggest vulnerability is its empirical assumptions about emotion dynamics.  

  *(Flag: This assumes the "textbook" doctrine. Some modern reforms—e.g., emphasizing "loss of control" over "heat"—may lean more judgmental.)*
