prompt: |-
  I'm putting together the preregistration for a follow-up to my undergrad thesis — I'm in the second year of a cog-sci PhD now — and I keep going in circles with my supervisor about the design, so I thought I'd ask here. Short version: we're running a fairly large multilingual online survey of philosophical case judgments. Gettier-style cases, a couple of trolley variants, some of those side-effect cases where someone brings about a bad outcome as a side effect and people say he did it intentionally. Around twelve languages, native-speaker translation plus back-translation, comprehension checks, the usual. My flatmate thinks the whole project is unfalsifiable and I'd like to be able to tell her why it isn't.

  The working plan is to treat the whole thing as a sampling problem: analytic philosophy has been leaning on the intuitions of a very unrepresentative slice of humanity, so the fix is to sample properly and then aggregate. Weight the responses somehow — we can't decide between weighting by population size, weighting by number of languages, or just equally per site — and take whatever the global majority says as the verdict. If the global majority disagrees with what philosophers have been saying since the 60s, then the philosophers update their theories; that seems to me like the entire point of the critique. I also want to add a short debiasing preamble before each vignette, a neutral rewording that strips out the cultural framing — honorifics, names that signal ethnicity, anything that might trigger a local script — so that what we end up measuring is the intuition itself rather than the cultural overlay sitting on top of it. And if it still varies after all that, I guess we just report that knowledge and intentional action are culturally relative and leave it there?

  My supervisor says the design has a conceptual problem rather than a statistical one, and that I'm presupposing the thing the literature is actually arguing about, but she won't tell me what she means until I work it out myself, which is driving me up the wall. So, concretely: is the weighting question even the right question to be asking, does the debiasing preamble do what I think it does, and what am I supposed to conclude from variation if it shows up — relativism, or something else? One more thing while I'm here: we have budget for a single extra between-subjects condition for control items, and I was going to spend it on a non-philosophical item that we already know varies across cultures, something like a risk-preference or trust question, on the theory that if it varies too then response style is doing the work. Is that the right control, or am I about to waste the condition?
reasoning: |-
  Okay, let me unpack this PhD student's problem. They're designing a cross-cultural philosophy experiment but hitting roadblocks with their supervisor. The core tension seems to be between their empirical approach ("let's just sample properly") and their supervisor's concern about conceptual foundations. 

  First, the student's design makes intuitive sense: gather diverse intuitions, aggregate them, and let that challenge philosophical orthodoxy. But I see why the supervisor is pushing back - this approach quietly assumes that philosophical intuitions *should* be democratized, which is exactly what some meta-philosophy debates contest. X-Phi critics like Stich would cheer this on, while traditionalists like Williamson might argue you're measuring the wrong thing entirely.

  The weighting dilemma reveals deeper issues. Population weighting? That assumes moral truth should track demographics. Language weighting? Implies linguistic groups share epistemically privileged access. Equal weighting? Presumes all cultures contribute equally to philosophical insight. Each choice smuggles in a controversial meta-commitment. 

  Then there's the "debiasing" preamble. The student wants to isolate "pure" intuitions from cultural noise. But how clean is that separation? Take their example: stripping honorifics from vignettes might actually distort how intentionality judgments function in hierarchical societies. That "cultural overlay" might be constitutive of the intuition itself. 

  The control condition choice is smart pragmatically - using known cross-cultural variations as a response style check. But it risks false negatives: if philosophical judgments vary while risk-preference doesn't, that doesn't automatically validate the variation as "real" - it could mean the domains are differently susceptible to response biases. 

  What's really thorny is the variation interpretation. Finding differences could mean: 
  - Relativism (truth is culture-bound)
  - Contextualism (concepts have culture-sensitive parameters)
  - Universalism with measurement error
  - Or that philosophers care about expert refinement of folk concepts

  The student's frustration is understandable - they're wrestling with methodological issues that tap into century-old philosophy of science debates about cultural commensurability. Their design isn't unfalsifiable per se, but it might be testing presuppositions rather than philosophical claims directly. 

  Perhaps the way forward is to reframe: instead of seeking "the global verdict," treat variation as the phenomenon to explain. Map how demographic factors mediate judgments. That sidesteps the weighting problem while still challenging parochialism. And for the control condition - keep it, but interpret cautiously as a necessary though insufficient check.
answer: |-
  Your project is ambitious and addresses crucial issues in experimental philosophy, but your supervisor is right that there's a deeper conceptual tension at its core. Let's break this down step by step:

  ### 1. **The Weighting Problem: Why It's Not Just Statistical**
     - **The presupposition trap**: You're assuming that aggregating global intuitions (whether weighted by population, language, or equally) yields a "correct" philosophical answer. But this presupposes *majoritarianism* about truth – that philosophical truth is determined by the majority intuition. Many philosophers reject this (e.g., Sosa, Williamson), arguing that philosophical expertise refines intuitions. Your design implicitly endorses the "negative program" in X-Phi (critiquing traditional methods) while ignoring the "positive program" (studying *why* intuitions vary).
     - **Practical solutions**:
       - *Don't weight*. Report disaggregated results by language/culture and test for universality using multilevel modeling (fixed vs. random effects).
       - Use weighting *only* for descriptive claims (e.g., "X% of the global population shares intuition Y"), not normative ones.
       - Add demographic covariates (education, SES, religiosity) to model *why* intuitions vary.

  ### 2. **The "Debiasing" Preamble: Conceptual Pitfalls**
     - **The framing illusion**: Stripping cultural context (names, honorifics) assumes a "core" intuition exists independently of cultural schemas. But many philosophers (e.g., Machery, Mallon) argue that concepts like *intentionality* or *knowledge* are inherently embedded in cultural practices. Removing context might create artificial, low-ecological-validity scenarios.
     - **Empirical evidence**: Knobe's side-effect effect *strengthens* with neutral framing (Cova et al., 2012). "Neutrality" may not be neutral.
     - **Solution**: Run a *within-subjects* manipulation: present both culturally embedded and "stripped" versions to a subset. Test if:
       - Judgments differ between versions (suggesting cultural framing matters)
       - Cross-cultural patterns *persist* even in stripped versions (suggesting deeper differences)

  ### 3. **Interpreting Variation: Beyond Relativism**
     Variation doesn't automatically imply relativism. Consider these alternatives:
     - **Parameterization**: Universal concepts with culture-dependent parameters (e.g., "knowledge" requires different evidence thresholds).
     - **Performance Error**: Variation stems from cognitive biases (e.g., epistemic vigilance) rather than conceptual differences.
     - **Deep Disagreement**: Incompatible metaphysical commitments (e.g., individualist vs. collectivist agency).
     - **Methodological Artifact**: Translation glitches or comprehension issues (highlighting your comprehension checks are crucial).

  ### 4. **The Control Condition: Smart but Incomplete**
     Your non-philosophical control (e.g., risk-preference) is useful for detecting:
     - **Response biases** (e.g., acquiescence bias)
     - **Scale-use differences** (e.g., extreme responding)
     But it's insufficient because:
     - Philosophical judgments may tap unique cognitive processes (e.g., theory of mind for intentionality).
     - **Better approach**: Include *both*:
       - A known cross-cultural psychological item (e.g., holistic vs. analytic cognition).
       - A "universal" control (e.g., basic logical inference) to verify task engagement.

  ### Revised Design Recommendations
  | **Component**       | **Original Plan**              | **Revised Proposal**                     | **Why**                                                                 |
  |----------------------|--------------------------------|------------------------------------------|--------------------------------------------------------------------------|
  | **Intuition Aggregation** | Weighted global majority       | Cluster analysis + universality tests    | Avoids presupposing majoritarian truth; maps variation structure        |
  | **Cultural Framing** | Stripped "neutral" vignettes   | Within-subjects: embedded vs. stripped   | Tests if cultural elements are constitutive or contextual               |
  | **Variation Analysis** | Binary: relativism or universalism | Multilevel modeling with covariates    | Explores sources of variation (e.g., education > culture)               |
  | **Control Condition** | Single non-philosophical item  | Add: psychological + logical controls    | Rules out response bias AND domain-general cognitive differences        |

  ### Why Your Project *Is* Falsifiable (Tell Your Flatmate)
  Your study tests concrete hypotheses:
  1. **Universality Hypothesis**: "Philosophical intuitions show no significant cross-cultural variation after controlling for comprehension."
     - *Falsified if*: Significant between-culture variance persists.
     
  2. **Cultural Framing Hypothesis**: "Cultural contextual elements (e.g., honorifics) significantly modulate intuitions."
     - *Tested via* within-subjects manipulation.

  3. **Expertise Hypothesis**: "Philosophers' intuitions align with the global majority."
     - *Falsified if* philosophers deviate systematically from aggregated folk intuitions.

  ### What Your Supervisor Likely Means
  She’s hinting that you’re presupposing **descriptive intuitionism** – the view that philosophical truth is discovered by polling folk intuitions. Critics argue:
  - Philosophical analysis *refines* intuitions (Williamson)
  - Intuitions track cognitive biases, not truth (Weinberg)
  - Concepts are theory-laden; "raw" intuitions don’t exist (Churchland)

  **To resolve this**: Explicitly state in your preregistration that you’re testing *whether folk intuitions should ground philosophical theories*, not assuming they must. Frame variation as a challenge to *methodological uniformity*, not necessarily truth.

  ### Final Takeaways
  - **Drop weighting schemes**. They force a false resolution to a philosophical debate.
  - **Embrace variation as data**. Use it to explore cognitive/cultural mediators.
  - **Expand controls**. One item won’t suffice; reprioritize budget for logical/psychological controls.
  - **Preempt relativism claims**. Pre-register multiple interpretive frameworks (universalism, parameterization, etc.).

  This reframe transforms your study from a "plebiscite on truth" into a rigorous investigation of how human cognition navigates philosophical problems across contexts – which is publishable whether or not philosophers update their theories.
