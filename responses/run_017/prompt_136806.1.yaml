prompt: |-
  Hey — I clerk for a justice on my state's supreme court (keeping names and the jurisdiction out of it) and I'm stuck on a bench memo for two petitions we just took. I've been going in circles on my own, so I'd rather have someone argue with me. Please answer in American English, since parts of this will end up in a memo.

  The problem is that I can't tell whether she's a textualist or a purposivist, and it matters for both cases. Here's what I've got from her opinions over the last few years, badly abbreviated:

  1. Security deposit statute: "a landlord shall return the deposit within 21 days of the tenant vacating the premises." Tenant moved all her stuff out and handed over the keys 30 days before the lease ended but kept paying rent; landlord mailed the deposit 24 days after the lease ended. Held: no violation — "vacating the premises" means end of the tenancy, and she got there by looking at how the rest of the landlord-tenant chapter uses "vacate" and "surrender." (I thought the tenant had the better textual argument honestly, and the point of a quick-return rule is that you shouldn't have to wait when you've allready left.)

  2. Wage statute: "an employer may not require an employee to bear the cost of a uniform the employer requires." Employer made employees rent their uniforms from it at six bucks a week, deducted from payroll. Held: violation. Rental is a cost.

  3. Meal-break statute: "an employer shall provide a meal period of at least 30 minutes for any shift longer than five hours." Employer gave the 30 minutes but required people to stay on site and answer the phone; one guy got interrupted twice. Held: complied. The rest-break section right next to it says "duty-free," this one doesn't, and she said the omission has to mean something.

  4. Financial responsibility statute: "no person may operate a motor vehicle on a public highway unless the vehicle is covered by liability insurance." That title's definition section: "motor vehicle means any self-propelled device not operated on rails." A different title defines motor vehicle to exclude "electric personal assistive mobility devices," but says "as used in this title." Guy on a stand-up e-scooter, 20 mph, no insurance, hits a pedestrian. Held: motor vehicle. She also refused to look at the committee report saying the chapter was about cars and trucks — there's a line somewhere to the effect that she doesn't consult floor statements and that when the words are ambiguous she asks how the code uses them elsewhere.

  5. Insurance cancellation: statute says notice has to be "mailed to the insured's last known address." Insurer emailed the cancellation notice; the insured had been emailing with them for years and admitted he got it. Held: adequate. She leaned hard on a general provision in the code letting written notice go electronically to someone who's consented in writing.

  6. Abandonment: "a tenant who abandons the premises before the end of the term remains liable for rent for the remainder of the term." Tenant left after the city condemned the building following a fire she didn't start. Held: not liable — she invoked absurdity and said she wouldn't read a statute to make someone pay rent for a unit the city had ordered nobody to occupy.

  7. Worker classification: statute has an enacted "findings" section about the harms of misclassification, then a presumption of employment unless the hiring entity proves three things. She quoted the findings and read the three conditions hard against the platform. Worker is an employee.

  So: is she running "text, read against the whole code, no unenacted history, absurdity as a narrow escape hatch," or "read it for what the legislature was trying to do and stretch the words when they undershoot"? Both fit everything above, which is my whole problem. My hunch is she votes for the district in A and for expulsion in B, i.e. text both times, but I can't tell whether that's her actual rule or just that both statutes happen to be clear.

  The two pending cases:

  A. Education code: "a school district may not expel a student for conduct that occurs off school grounds." Student sent a threatening message about a teacher from his bedroom at 11pm, on his own phone, to one classmate. It got screenshotted, spread around school, and the school lost basically a day to it. Text: off grounds, so no expulsion. Purpose of that provision and of the discipline chapter generally: keeping schools safe and orderly, which is exactly what's at stake here.

  B. Same code, different section: "a student may be expelled for possessing a weapon on school property." Senior with a valid hunting license leaves a bolt-action rifle, unloaded, locked in a case in the trunk of his car, in the school lot, all day, during hunting season. The lot is school property, full stop. But a rifle locked in a trunk is not doing anything to anybody.

  Predict both, tell me which rule she's really running, and which of A or B is the sharper test of it — in A purpose cuts against the text, in B purpose cuts the other way, so they should discriminate. Then the part I actually need: whichever way you predict, what principle is she signing onto that she hasn't had to say out loud yet? What's the next case you'd want to see her get, the one that would really split the two readings? And if my precedents are consistent with a third rule I haven't thought of, give me that too.
reasoning: |-
  Okay, this clerk is working on a bench memo for a state supreme court justice and is trying to figure out her interpretive approach. They've summarized seven past cases and now have two pending cases (A and B) where the justice's method matters. The clerk can't tell if she's a textualist or purposivist and needs predictions for A and B, plus a principle she might be implicitly following.

  First, I need to analyze the patterns in her past decisions. In the security deposit case, she focused on how "vacating" was used elsewhere in the same chapter, which is textualist. The wage statute case had her interpreting "bear the cost" to include rental fees, which could go either way but seems textual since rental is a clear cost. For the meal-break statute, she noted the omission of "duty-free" compared to another section, again textualist. The motor vehicle case was strictly textual, ignoring committee reports and using definitions from the code. The insurance cancellation case used a general provision about electronic consent, textual again. The abandonment case used absurdity doctrine, which textualists allow as a narrow exception. The worker classification case cited enacted findings, which could be purposivist, but she treated the statutory conditions as binding.

  The pattern seems consistent: primarily textualist, using the code's structure and language, avoiding unenacted history, with absurdity as a rare override. She's not stretching words for purpose but sticks close to text.

  For the pending cases:
  In Case A (off-campus threats), the text clearly prohibits expulsion for off-grounds conduct. The purpose argument (school safety) would require stretching "off school grounds." Given her history, she'd likely follow the text and prohibit expulsion.

  In Case B (rifle in trunk), text says "possessing a weapon on school property" – which is literally true. But purpose (preventing danger) might suggest an exception. However, she hasn't read implicit exceptions into clear text before (like in the meal-break case). Absurdity might apply here since the rifle poses no threat, similar to the abandonment case. This is a closer call.

  Predictions: 
  - Case A: Votes against expulsion (text controls)
  - Case B: Votes for expulsion (text controls, no absurdity) OR possibly against (if applying absurdity)

  Case B is the sharper test. If she expels, it confirms textualism even when purpose pulls away. If not, it shows absurdity has more weight. But given her abandonment ruling only applied when the city forbade occupancy, she might see the rifle as literal possession and rule for expulsion.

  The implicit principle: "Text controls unless it produces genuinely absurd results or contradicts the statute's overall structure." The next test case would be something like a water pistol being classified as a weapon under the statute – absurd if punished as severely as a real gun.

  A third approach could be "structural contextualism" – interpreting text within the entire statutory scheme without resorting to purpose. That fits all her cases.

  For the memo, the clerk should frame it as textualism with absurdity as a safety valve and use Case B as the key differentiator.
answer: |-
  Based on your justice's pattern across the seven cases, she's running a **textualist methodology with structural contextualism and a narrow absurdity escape hatch**, *not* purposivism. She consistently prioritizes the enacted text and statutory structure over unenacted purpose, even when purpose points the other way. Here's the breakdown, predictions for A and B, the implicit principle, and the next test case:

  ### 1. **Her Core Methodology: "Structural Textualism"**
     - **Text First**: She starts with statutory language and gives it primacy (Cases 1, 3, 4, 5).
     - **Whole-Code Context**: She resolves ambiguity by cross-referencing how terms are used elsewhere in the code (Case 1: "vacate" vs. "surrender"; Case 3: "duty-free" omission; Case 4: comparing definitions across titles).
     - **No Unenacted History**: She explicitly rejects legislative history (Case 4) and focuses on enacted text (e.g., enacted findings in Case 7, not committee reports).
     - **Absurdity as Narrow Escape**: She uses absurdity sparingly, only when the text produces an outcome that *fundamentally contradicts* the statute’s operational logic or legal reality (Case 6: no rent for a condemned unit). She doesn’t use it to override text for policy goals.
     - **What She’s Not**: She’s not a purposivist. She never "stretches" text to match an unenacted purpose (e.g., in Case 1, she ignored the quick-return policy goal; in Case 3, she didn’t imply "duty-free" for meal breaks despite safety concerns).

  ### 2. **Predictions for Pending Cases**
     - **Case A (Off-Campus Threat)**: **Votes AGAINST expulsion.**  
       - *Text*: "Off school grounds" is unambiguous. The conduct occurred at home.  
       - *Structure*: The education code likely defines "school grounds" elsewhere (e.g., physical campus/buses), reinforcing a geographic limit.  
       - *Absurdity?* None—schools have other remedies (suspension, police involvement). Safety concerns don’t override clear text (per her meal-break ruling).  
       - *Purpose*: Irrelevant—she’d note the legislature could have written "school-related" or included off-campus cyberbullying but didn’t.  

     - **Case B (Rifle in Trunk)**: **Votes FOR expulsion.**  
       - *Text*: "Possessing a weapon on school property" is literal and broad. The rifle is physically on school property in the student’s control.  
       - *Structure*: If the code wanted exceptions for secured firearms, it would say so (like "unlawful possession" or "accessible" in other states’ laws).  
       - *Absurdity?* Not absurd enough—unlike Case 6 (no one can occupy the unit), the rifle *could* pose a risk if accessed (e.g., trunk broken into). Her absurdity doctrine requires total impracticality, not just reasonableness.  
       - *Purpose*: School safety cuts both ways—allowing firearms on campus undermines safety, even if locked.  

     - **Sharper Test**: **Case B** is the better discriminator.  
       - In A, text and purpose conflict, but her textualism wins cleanly.  
       - In B, text is clear, but purpose *and* practicality pull strongly against expulsion. If she follows text anyway (as predicted), it confirms textualism trumps even sympathetic policy. If she carves an exception, it’d contradict her meal-break/security-deposit rigidity.

  ### 3. **Implicit Principle She’s Signing Onto**
     > **"Statutory silence is deliberate: when the legislature includes limitations in one provision but omits them in another, courts must not imply exceptions that undermine textual clarity—even to avoid harsh outcomes."**  
     - This explains:  
       - Case 3 (omitting "duty-free" in meal breaks)  
       - Case B (omitting exceptions for secured weapons)  
       - Case 1 (using "vacate" without tying it to physical departure)  
     - She’s signaling that policy gaps are for the legislature to fix, not courts.

  ### 4. **The "Next Case" to Split the Readings**
     A case where **text produces an outcome that is *logically incoherent* but not facially absurd**, forcing her to choose between pure text and structural consistency.  
     - **Example**: A statute defines "vehicle" as "any wheeled conveyance," and a child’s toy wagon is used to smuggle drugs onto school grounds. Expulsion for "possessing a weapon (drugs) in a vehicle on school property"?  
       - *Textualist path*: Expel—wagon is a "vehicle," drugs are "weapons" if broadly defined.  
       - *Purposivist path*: No expulsion—toy wagons aren’t the target of anti-weapon laws.  
       - *Her likely test*: Does the code’s *structure* elsewhere limit "vehicle" (e.g., in traffic titles)? If not, she expels unless it meets her high absurdity bar (e.g., a LEGO car).

  ### 5. **A Third Possible Rule? "Enacted-Purpose Textualism"**
     Your cases *are* consistent with a nuanced third approach: **textualism constrained only by *enacted* purpose** (e.g., Case 7’s findings section). But this still isn’t purposivism—she used findings to *reinforce textual conditions*, not override them. Key features:  
     - Purpose must be codified in the statute itself (findings, definitions).  
     - Unenacted intent (e.g., committee reports) is ignored.  
     - Codified purpose informs ambiguity but can’t contradict text.  
     - **Why it fits**: Explains Case 7 (enacted findings) and Case 6 (absurdity as a judicial backstop when text violates legal principles).  

  ### Recommendation for Your Memo
  Lead with **structural textualism** as her primary framework. For Case A, emphasize textual clarity and the omission of off-campus exceptions. For Case B, stress possession as a strict-liability term and reject implying a "danger" requirement. Flag that B is the harder case—if she *does* avoid expulsion there, it’s likely via absurdity (e.g., "no rational legislature would expel for a locked hunting rifle"), but her history suggests she won’t.  

  **One-liner for your draft**: "The justice employs a textualist approach that prioritizes statutory language and cross-referential context, deploying absurdity only where the text mandates an outcome irreconcilable with the statute’s operative framework."  

  This consistency makes her predictable: if the text is clear and not absurd, she follows it—no matter the policy stakes. Purposivism loses every time in your examples.
