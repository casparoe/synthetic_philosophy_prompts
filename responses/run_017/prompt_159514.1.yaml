     Part of the real claim that the activity can't reproduce:
          - In real scientific incommensurability, the frameworks are often deeply tied to values, traditions, and worldviews, which are hard to simulate in a card game.
          - The activity might not capture the historical and social embeddedness of paradigms.
          - The degradation in cross-training might be due to time pressure and not due to cognitive incompatibility.

     We'll have to say out loud that in real science, the frameworks are often tied to different ways of seeing the world, and the incommensurability is not just about classification but about what counts as a problem, what counts as a solution, and the standards of explanation.

