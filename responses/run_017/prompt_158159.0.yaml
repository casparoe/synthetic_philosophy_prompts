  Now, to answer your questions:

  1. What is it about evidence whose content is a conditional that makes it underdetermine the update?

     The issue is that a conditional statement (like "if A then B") does not specify how the evidence was generated. In particular, it does not tell us whether the evidence is specific to a particular context (e.g., only when A is true) or whether it was selected from a larger set of possible messages. The update depends on the process by which the evidence came to be known.

  2. Is the whole puzzle only a selection-rule effect?

     To a large extent, yes. The Judy Benjamin problem highlights that the same conditional content can be generated by different selection mechanisms, and these lead to different updates. Therefore, without knowing the selection rule, the update is underdetermined.

  3. Does something survive beyond the selection rule effect?

     There is still a philosophical debate. Some argue that the material conditional update is the default when no selection rule is known. Others argue that the constraint-based update (minimizing the change in the marginal of the antecedent) is more natural because it leaves the prior over the antecedent unchanged. However, the constraint-based update has the issue of order dependence when multiple constraints are applied, which is problematic.

  4. Why shouldn't order dependence count against the constraint-based update?

     It does. Order dependence is a serious issue because the order in which we receive evidence should not affect the final beliefs if the evidence is consistent. The constraint-based update can lead to different results depending on the order, which is counterintuitive. This is a reason to be cautious about it.

  5. What does the selection-rule story predict about which menu Judy should assume?

     If Judy has no information about how the message was produced, then she doesn't know which selection rule to use. Therefore, there is no uniquely rational update. She must either make a default assumption (like the material conditional) or remain uncertain about the selection rule and perhaps average over possible selection rules.

  6. Gut-level reason why conditionals are different:

     When we learn a conditional, we are not learning that a particular state of the world is ruled out (like learning "not C1P2" would be). Instead, we are learning a rule that relates two propositions. How that rule should affect our beliefs depends on why we are learning that rule. If we learn it because it is the only relevant information in a context (e.g., the messenger is only informing us about the platoon given the company), then we might update by changing only the conditional probability. But if we learn it as one of many possible conditionals that could have been reported, then the update must account for the fact that the messenger could have chosen a different true conditional.

  7. Which account do I favor and what it costs?

     I favor the selection-rule account because it explains the variability in updates by the variability in the evidence-generating process. It shows that the puzzle arises from underdetermination of the evidence process. The cost is that without knowledge of the selection rule, we cannot settle on a unique update. We must either admit ignorance or choose a convention.

     If we must choose a convention, I lean towards the material conditional update (conditionalizing on the material conditional) because it is simple and does not require arbitrary choices about which marginals to hold fixed. However, this convention may not always match intuition. Alternatively, one might use the principle of minimum information (minimizing the relative entropy) which leads to the constraint-based update. But then we face order dependence for multiple constraints.

