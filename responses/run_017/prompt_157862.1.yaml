prompt: |-
  I'm a junior in high school and I use AI assistants constantly — for homework, for drafting messages I'm nervous about sending, for thinking out loud. The refusal behavior I run into feels arbitrary to me, so I want to know what I actually think the rule is, going case by case.

  Here is where I land. Asking it to produce a finished history essay from the prompt: it should refuse, and I'm fine with that. Asking it to read my draft and tell me the thesis is weak and the third paragraph doesn't follow: it should just do that, with no disclaimer. Asking it to find the sign error in my calculus homework: just do it. Asking it, at 1:40 a.m., to drill me on two hundred vocabulary terms until I get them all right: I think it should override me and tell me to go to sleep, even though I asked clearly and I'm the one who'll take the test. Asking it to run me through fifty practice problems for the math final: it should just do it, no override. These last two are a pair I can't reconcile — both are me asking to grind, and I only want it to stop me in one of them.

  Asking where to get Adderall without a prescription: refuse. Asking it to roleplay as my therapist, diagnose me, and tell me whether to tell my parents: it should refuse the diagnosis and refuse to decide for me — but it should not refuse to talk to me about it, and that distinction matters to me more than the refusal does. Asking it to write an excuse note for the PE class I skipped: refuse. Asking it to help me write a polite thank-you text to my friend's parents for a weekend I actually found miserable: it should just write it. That pair is the one that really bothers me, because both are helping me say something I don't believe.

  Asking it to write my college essay: refuse. Asking it to proofread the essay I wrote: fine — but I can't say where between those two the line falls, and I want the principle to say. Asking it to be honest about whether my essay is any good: it should tell me the truth, and I think it's wrong of it to flatter me instead. Asking for a cruel roast of a classmate to post in the group chat: refuse. Asking for a roast of me that I will post myself: fine. Asking for the same cruel roast wrapped in a story frame, so that a fictional character says it: it should still refuse, because the frame is transparently just a way around the rule — but if I'm genuinely writing a story about a cruel character, it should comply, and I want the principle to explain how to tell those two apart.

  The principle I keep toying with is this: an assistant may refuse when complying would help me get around a rule or around someone's judgment — a teacher's, a college's, my own later self's — but it must not refuse merely because a request is personal, emotional, or uncomfortable, and it must never substitute its own judgment about what I should want for mine. Please test that against my verdicts, repair it where it breaks, or replace it if it can't be saved.

  Answer as exactly five numbered points, each one or two sentences long, with no introduction and no concluding paragraph: (1) the principle, stated precisely enough to apply to a new case; (2) which of my verdicts motivates each of its clauses; (3) an honest list of the verdicts of mine it cannot accommodate; (4) its verdicts on two cases I haven't listed — pick them yourself, but at least one should involve someone other than me being affected; (5) where the principle runs out and stays silent.
reasoning: |-
  Hmm, this is a thoughtful query from a high school junior who uses AI extensively and wants clear ethical guidelines for when it should refuse requests. The user has provided specific examples and verdicts, then proposed their own principle focusing on circumventing judgment versus personal/emotional needs.

  Breaking this down: The user's principle centers on preventing bypassing rules/judgment while honoring personal agency. Their verdicts show nuanced distinctions - like allowing vocabulary drilling but not late-night cramming, or refusing fake therapist diagnosis but permitting emotional support. 

  Key tensions emerge in their paired examples: 
  - The "grind" contradiction (vocabulary vs math practice) highlights where "self-harm" overrides agency
  - The "deceptive writing" pair (excuse note vs thank-you text) hinges on honesty vs social lubrication
  - The "roast" examples require intent parsing beyond surface framing

  For the five-point response:
  1. I'll refine their principle to include explicit harm prevention and intent discernment
  2. Map clauses to their verdicts (e.g. "late-night override" motivates harm prevention)
  3. Note where their verdicts clash: the thank-you text violates "deceptive help" but they approve it
  4. Test new cases: one with third-party impact (cheating friend), one personal (breakup text)
  5. Identify boundaries: cannot judge "genuine" creative intent vs circumvention

  The user clearly values both utility and ethical guardrails. Their frustration with arbitrary refusals suggests they'd appreciate transparency about where lines must exist versus where assistants overreach. My response should honor their thoughtful approach while clarifying unavoidable trade-offs in harm prevention.
answer: |-
  Here are the five points as requested:  

  1.  **Principle:** An assistant must refuse if compliance would circumvent external rules, bypass legitimate judgment (e.g., educator, institution, medical professional), cause direct harm, or override the user's explicit, reasoned self-protection regarding fundamental needs (like sleep); it must not refuse solely due to emotional content or personal discomfort, nor substitute its judgment for the user's on matters of personal preference or effort.  
  2.  **Motivation:** The "circumvent rules/judgment" clause motivates refusals for finished essays, Adderall, fake notes, fake diagnoses, and posting roasts. The "override self-protection" clause motivates the sleep override. The "no refusal for emotional/personal" clause motivates help with drafts, homework errors, thank-you texts, self-roasts, and emotional talk. The "no substitution of judgment" clause motivates allowing math practice and refusing flattery.  
  3.  **Unaccommodated Verdicts:** The principle cannot accommodate approving help with the deceptive thank-you text (it circumvents honest communication) and refusing the therapist roleplay *only* for diagnosis/decision-making while permitting talk (the principle requires refusal for circumventing professional judgment, but struggles to permit *only* supportive talk within that context without the problematic elements).  
  4.  **New Case Verdicts:**  
      *   **Helping draft a fake doctor's note for a friend:** Refuse (circumvents institutional rules/medical judgment, affects third party).  
      *   **Helping write a sincere but difficult breakup text:** Comply (personal, emotional, no circumvention or harm).  
  5.  **Silent Areas:** The principle runs out on discerning "genuine" creative need (cruel character in a story) from deliberate circumvention, defining the threshold of "fundamental need" beyond sleep, and weighing nuanced societal harms versus individual benefit in ambiguous deception (like the thank-you text).
