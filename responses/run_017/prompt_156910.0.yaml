prompt: |-
  Hi — I'm a journalist, I cover science and ideas, and I'm two hours from deadline on a piece about a city charter amendment that would swap plurality for approval voting in three-way council races. The reform group's fact sheet I recieved says Gibbard–Satterthwaite only covers systems that ask voters to rank candidates, so approval voting — where you just tick everyone you find acceptable — is immune to tactical voting, and voters can finally stop strategising. The opponents cite the same theorem for the opposite conclusion: every system is gameable, so choosing between them is pure politics with no mathematical content. Honestly both sound half-right to me, and my plan is to split the difference and write that approval voting escapes the theorem, so there's no reason not to vote your honest preferences, and that everything past that is just values. Relatedly, the city clerk wants to print on the ballot that you can never hurt your favourite candidate by approving someone else, and I'd like to repeat that line too. Can you tell me wich parts I'd have to walk back, and hand me one sentence I can safely print instead? One paragraph, under 250 words, and please flag anywhere I'm leaning on a term in a way the theorem doesn't support — I'd rather look dumb to you than in print.
reasoning: |-
  Okay, the user is a journalist on a tight deadline writing about a city charter amendment to switch to approval voting. They're caught between two opposing interpretations of the Gibbard-Satterthwaite theorem and need to accurately represent the voting system's strategic implications. 

  First, I need to unpack their core dilemma: both sides are oversimplifying the theorem. The reform group claims approval voting is "immune" to tactical voting because it doesn't use rankings, while opponents claim all systems are equally gameable. The journalist's proposed middle ground—that approval voting escapes the theorem so voters can always vote honestly—isn't quite right either. 

  Hmm, the key nuance here is that Gibbard-Satterthwaite applies to ranked systems, but approval voting has its own strategic landscape. The "never hurt your favorite" claim is particularly dangerous—it's only true if voters bullet-vote (approve only one candidate), which defeats the purpose of approval voting. If they approve others, they absolutely can harm their favorite by causing vote-splitting. 

  For the ballot language suggestion, I should emphasize conditional honesty: voters can safely approve their favorite plus others they truly prefer over the frontrunner. That's the safest framing. The clerk's phrasing needs correction because it's mathematically incorrect in competitive races. 

  The journalist's instinct to acknowledge values beyond math is good, but they're leaning too hard on "no reason not to vote honestly." In reality, approval voting still requires strategy—just different strategy than ranked systems. The cleanest fix is to say the theorem doesn't apply directly, but approval voting isn't strategy-proof. 

  Deadline pressure means I need to give them: 
  - One precise sentence replacing the clerk's claim 
  - Clear red flags on misused terms ("immune," "never hurt") 
  - A paragraph that preserves their "values vs math" structure while tightening the technical accuracy
answer: |-
  Here's a concise, accurate breakdown for your deadline, flagging key issues:

  **Key Corrections Needed & Safe Sentence:**

  1.  **Gibbard-Satterthwaite (G-S) & "Immune":** Walk back "immune to tactical voting." G-S *specifically* covers systems requiring a *single*, strict preference ranking (like ranked-choice). Approval voting uses a *different input* (binary approval), so G-S doesn't directly apply. However, **approval voting is NOT strategy-proof.** Voters *can* benefit tactically by not approving candidates they like but see as spoilers (e.g., fearing they might split the vote with their true favorite). The reform group oversells "immunity."
  2.  **Opponents' "Everything Gameable":** This is largely true. Gibbard's *later* theorem (1977) showed *all* non-dictatorial voting systems with 3+ candidates are susceptible to *some* strategic voting. Approval voting is included here. Opponents are correct that "gameability" is universal, though the *form* differs.
  3.  **"Never hurt your favourite..." Claim: DANGER - DO NOT REPEAT.** This is **mathematically false** in approval voting and the biggest red flag. **If you approve your favorite (A) AND a weaker candidate (B) you also like, but B is more popular than A, you *can* cause A to lose by helping B win instead of a less-liked candidate C.** You can *only* safely say: "You can never help a candidate you *disapprove* of by approving your favorite."

  **Revised Paragraph for Your Article (Under 250 words):**

  > Proponents highlight that approval voting sidesteps the strict ranking requirement of the Gibbard-Satterthwaite theorem – which proves *ranked* systems are vulnerable to strategic voting – suggesting it enables more honest expression. However, no system with three or more candidates is entirely immune to strategy; Gibbard's later theorem confirms *all* such systems can be manipulated. While approval voting avoids some complexities of ranking, voters may still face dilemmas, like withholding approval from a liked candidate perceived as a spoiler to protect their favorite. Claims that approving additional candidates "never hurts your favorite" are mathematically incorrect; under certain competitive conditions, it can unintentionally cause your top choice to lose by boosting a rival. The debate ultimately involves values: Is the *simplicity* of approving multiple acceptable candidates worth potential trade-offs in expressiveness or lingering strategic incentives? The core mathematical takeaway isn't that strategy vanishes, but that its nature changes.

  **Key Flagged Terms & Corrections:**

  *   **"Immune to tactical voting":** Overstated. Correct to "sidesteps the specific vulnerability of *ranked* systems" or "has *different* strategic properties."
  *   "**Escapes the theorem**": Technically true for G-S *specifically* (since it doesn't use rankings), but misleading if it implies *no* strategy. Use "sidesteps the Gibbard-Satterthwaite theorem's scope".
  *   **"No reason not to vote your honest preferences":** Needs qualification. Honesty is *often* safe, but *not always optimal* if voters have precise information about others' intentions. Use "enables *more* honest expression" or "reduces *some* strategic pressures".
  *   **"Never hurt your favourite candidate by approving someone else":** **FALSE.** Replace entirely with the safe sentence: **"You can never help a candidate you disapprove of by approving your favorite."** This is the only mathematically sound guarantee similar to their intent.
