prompt: |-
  I teach epistemology, and every year my students do something I don't have a word for, so I'm asking here.

  Case one: somebody glances at a webpage on a Tuesday, sees the office is open Friday, thinks nothing more of it — nothing is riding on it. We all say she knows. Then I add that, as it happened, a person's life depended on her getting that right, and she had no idea at the time. Half the room takes it back: no, she didn't know. Nothing about her changed. Only what we found out afterwards about what was hanging on it.

  Case two, the mirror image: somebody runs an elaborate set of checks on a lab result because a whole career depends on it, and nobody will grant knowledge. Then the decision gets postponed indefinitely, and now the very same students cheerfully say he knew all along. Again, nothing about him changed in the meantime.

  So the verdict seems to track where the discussion has got to rather than how things stood with the thinker at the time, which is wierd if knowledge is the sort of thing you either have or lack at a time.

  I know the ordinary version of this — jack up what's at stake and people stop saying "knows" — that's not what I'm after. I want the backwards-looking version. Does it have a name, and if so is one name enough, or are my two cases different animals? My colleagues just say "oh, that's the standard-shifting thing" and wave their hands, which tells me nothing. I need to know what exactly is shifting, what the nearest established notions are and where my cases don't quite fit them, and whether the later developments are meant to change what is true or only what we're in a position to say.
reasoning: |-
  Okay, the user teaches epistemology and encounters a specific phenomenon with their students. Let me start by understanding the cases they described. In the first case, a student glances at a webpage, sees the office is open Friday, and initially, everyone agrees she knows. But when it's revealed that a life depended on her being correct, half the students retract the knowledge attribution. The key point here is that nothing about the student's epistemic state changed—only the stakes discovered later.

  The second case is the opposite. Someone does thorough checks because a career is on the line, and students deny knowledge. But when the decision is postponed indefinitely, they say he knew all along. Again, no change in the person's epistemic state, just the outcome's importance shifted after the fact.

  The user mentions that this isn't the standard stakes-sensitivity (like contextualism), which affects attributions based on current stakes. Here, it's retrospective; past knowledge attributions change based on later events. The user wants to know if there's a name for this, whether both cases are the same phenomenon, and what exactly is shifting.

  First, I recall that epistemic contextualism deals with how context (like stakes) affects the truth conditions of "knows." But that's about the attributor's current context. The user's cases involve later discoveries affecting past attributions. That seems different. Maybe it's related to pragmatic encroachment, where practical factors affect knowledge, but typically at the time of the belief, not retroactively.

  Then I remember the Knobe effect or outcome bias. The Knobe effect is about moral valence influencing intentionality judgments. Outcome bias is when outcomes affect judgments of past decisions. Applying that here: in the first case, the negative outcome (life at risk) makes students think the belief wasn't knowledge. In the second, the harmless outcome (postponement) allows them to attribute knowledge. So it's the outcome's moral/serious consequence influencing the knowledge attribution.

  But the user's colleagues call it "standard-shifting," which is vague. The user needs precise terms and concepts. They might be looking to categorize this phenomenon correctly, perhaps for academic writing or teaching materials. Also, they might want to explain to students why this shift occurs, which involves discussing biases in epistemic judgments.

  Are both cases the same? Both involve retrospective judgments based on outcomes, but the first adds stakes (negative outcome), the second removes them (positive/harmless outcome). So it's two sides of the same coin—outcome bias affecting knowledge attribution.

  The user also asks whether the later events change what's true or just what we say. That's a deeper metaphysical question. If knowledge is factive and based on justification at the time, then later events shouldn't change whether someone knew. But the students' judgments are influenced by outcomes, suggesting a psychological bias rather than a change in truth conditions. So it's about the attribution being affected by hindsight, not the actual epistemic state at the time.

  Potential terms: "Retroactive stakes-sensitivity," "Outcome-driven epistemic bias," "Hindsight epistemology." But established terms might be "Outcome bias" or "Moral valence effect" (from Knobe). Since Knobe's effect is about intentionality, applying it to knowledge might need specification. Alternatively, "epistemic outcome bias" could work.

  The user's deeper needs: They want to correctly identify and label this phenomenon for their teaching, provide students with clear explanations, and possibly contribute to academic discourse. They might also want to address why students fall into this bias, emphasizing the importance of separating epistemic factors from practical outcomes.
answer: |-
  This is a fascinating and under-discussed phenomenon in epistemology! You're right that it's distinct from standard stakes-sensitivity (contextualism/pragmatic encroachment), as the shift happens *retrospectively* based on *later-discovered* facts about the stakes/consequences, not the stakes *at the time of the belief*. Your cases highlight a specific **temporal mismatch** and **hindsight bias** in knowledge attribution.

  Here's a breakdown of the concepts, potential names, distinctions, and what's shifting:

  1.  **The Core Phenomenon: Retroactive Stakes-Sensitivity in Knowledge Attribution (or Outcome-Driven Epistemic Bias)**
      *   **What it is:** Knowledge attributions about a past belief are influenced by subsequently learned information about the *actual consequences* or *significance* of being wrong, even though this information was unknown to the agent and irrelevant to their epistemic state at the time.
      *   **Why it's distinct:**
          *   **Standard Stakes-Sensitivity:** Affects the *current* context of the attributor *at the time of attribution*, based on stakes known *now* (e.g., *I* know life depends on it *now*, so *I* won't say *you* knew then). Your cases involve stakes revealed *after* the initial attribution, changing the *later* attribution about the *same past time*.
          *   **Temporal Mismatch:** The crucial factor (stakes/outcome) wasn't present or known when the belief was formed, nor necessarily when the initial attribution was made. It only emerges later.
          *   **Hindsight Focus:** It leverages the *actual* outcome or consequence discovered later to reassess the epistemic status of the past belief.

  2.  **Names & Established Connections:**
      *   **Primary Candidate: Outcome Bias in Epistemic Judgment (or Knowledge Attribution):** This directly borrows from psychology/decision theory. Outcome bias is the tendency to judge the quality of a past decision based on its outcome rather than the quality of the decision-making process given the information available *at the time*. Your cases perfectly fit: the *epistemic quality* of the belief (justification, truth, etc.) is judged based on the *practical outcome* discovered later.
      *   **Moral Valence Effect (Knobe Effect Adjacent):** Joshua Knobe showed that moral judgments (e.g., intentionality) can be influenced by the perceived goodness/badness of an outcome. In your first case, the negative outcome (life at stake) injects a moral/serious valence, making the initial belief seem less reliable/knowledgeable in hindsight. The second case removes the negative valence, making the belief seem safer/knowledgeable. The stakes provide the valence.
      *   **Retroactive Pragmatic Encroachment:** While pragmatic encroachment usually applies *at the time of belief*, this could be seen as a faulty *retroactive application* of the same intuition: later learning the stakes were high makes people think the *past* epistemic standards *should have been* higher, even though the agent couldn't know that.
      *   **"Hindsight Epistemic Bias":** Emphasizes the role of knowing the outcome *after the fact* distorting the judgment of the *past* epistemic state.
      *   **Best Single Name:** **Outcome Bias in Knowledge Attribution** is likely the most precise and descriptive term linking it to an established cognitive bias. **Retroactive Stakes-Sensitivity** is also accurate but less common.

  3.  **Are Your Two Cases Different Animals?**
      *   **Fundamentally the Same Mechanism:** Both involve attributors revising their judgment about a *past* epistemic state based on *newly acquired* information about the *practical significance* of being wrong that was unknown to the agent at the time.
      *   **Mirror Images, Same Core:**
          *   **Case 1 (Low -> High Stakes Revealed):** Outcome bias triggered by learning of a *negative* potential consequence (life lost) that *could have* happened (even if it didn't). The "badness" makes the past belief seem riskier, less justified, less like knowledge.
          *   **Case 2 (High -> Low Stakes Revealed):** Outcome bias triggered by learning the *negative* consequence *was avoided* indefinitely (career not ruined). Removing the "threat" makes the past careful belief seem safer, more secure, more like knowledge. The initial denial was likely due to *standard* stakes-sensitivity (high known stakes at attribution time). The *reversal* is the outcome bias kicking in when the stakes vanish.

  4.  **What is Shifting?**
      *   **The Attributor's Threshold for "Knowing":** Your colleagues are partly right about "shifting," but it's a *retrospective* shift. Learning the *actual* or *potential* consequences later makes attributors unconsciously:
          *   **Inflate the Required Justification:** In Case 1, learning life depended on it makes them think, in hindsight, that only an extremely high level of justification (which the agent didn't have) would have *really* counted as knowledge *given what we now know was at stake*. They retrospectively impose a higher standard.
          *   **Reinterpret the Agent's State:** In Case 2, learning the danger passed allows them to downplay the *actual* high stakes the agent *was* responding to and *was* aware of. They reinterpret the past carefulness as perhaps unnecessary overkill *now that we know it didn't matter*, making it seem like solid knowledge.
          *   **Emphasize/De-emphasize Luck:** In Case 1, the high stakes highlight the *risk* of being wrong, making the actual truth seem luckier and less like knowledge. In Case 2, the vanished stakes make the truth seem less risky/lucky and more secure.
      *   **Not the Facts:** Crucially, **the later developments do NOT change what was *true* at the time.** The agent's epistemic state (justification, belief, truth) at T1 is fixed. What changes is the *attributor's later judgment* *about* that past state based on the *new* information about consequences. This is why it's a *bias* – it misapplies irrelevant information (the outcome/stakes learned later) to assess a past state.

  5.  **Why This Happens & Implications:**
      *   **Cognitive Bias:** Outcome bias is a powerful, well-documented heuristic. We struggle to ignore salient outcomes when evaluating past decisions or states. High stakes = salient negative potential outcome.
      *   **Moral/Responsibility Creep:** Knowledge attributions are often tied to assessments of responsibility. "If she didn't *know* (because look what was at stake!), she can't be blamed as much if she was wrong." Conversely, "He *knew* (and it didn't blow up), so he did his job well."
      *   **Narrative Coherence:** Learning new significant facts (life/career) makes us revise the entire story. A belief that turned out to be inconsequential fits a "knew" narrative. A belief that *could have* (even if it didn't) caused disaster fits a "got lucky, didn't *really* know" narrative.
      *   **Challenge for Epistemology:** This highlights a tension between our intuitive, often consequentialist-driven attributions ("knows" is partly an assessment of actionability/safety) and the philosopher's desire for a "pure" epistemic state defined only by factors present at T1 (belief, justification, truth). It shows how hard it is to isolate epistemic evaluation from pragmatic and moral considerations, *especially* in hindsight.

  **In summary:**

  *   **Name:** **Outcome Bias in Knowledge Attribution** is the most precise fit. **Retroactive Stakes-Sensitivity** or **Hindsight Epistemic Bias** are also descriptive.
  *   **Cases:** They are manifestations of the *same core phenomenon* – retroactively adjusting knowledge attributions based on later-learned consequences.
  *   **Shifting:** The attributor's *judgmental threshold* for applying "knows" shifts *retrospectively* based on the newly acquired information about stakes/outcomes. This is a shift in *attribution*, **not** in the *truth* of the agent's past epistemic state.
  *   **Nearest Notions:** Outcome Bias (Psychology), Moral Valence/Knobe Effect (Moral Psychology), Pragmatic Encroachment (Epistemology - but applied retrospectively/faultily).

  This phenomenon is a powerful teaching tool! It vividly demonstrates how *extraneous* factors (like outcomes learned later) can distort our supposedly objective evaluations of knowledge, highlighting the messy interplay between epistemology, psychology, and ethics. You can frame discussions around: "Does learning *later* that something important depended on it *change the facts* about what the agent's cognitive state was *then*? Or are we just confusing ourselves?" This forces students to confront the core commitments of different theories of knowledge.
