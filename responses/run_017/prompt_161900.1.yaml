prompt: |-
  I'm on the distributional review panel at a big regional transit authority — we screen every service and fare change before it goes to the board, so three or four proposals a month, decided in about two working days by me and two analysts who have no philosophy or econ training, and whatever we write ends up in the public packet that the board, and occasionally a judge or a reporter, actually reads. So it can't just say "the aggregate benefit outweighs the aggregate burden"; it has to show the work. The thing we keep deadlocking on is basically that old torture-vs-dust-specks hypothetical, except with bus stops: is a change that adds something genuinely trivial to an enormous number of people — 90 seconds to 400,000 daily trips, a fare system that rounds up and overcharges about three cents a ride, a platform relocation that makes 60,000 people walk an extra ninety feet — even comparable to a change that lands something severe on a small number of people, like ending door-to-door paratransit for forty wheelchair users or closing a station that twelve elderly residents depend on entirely? Half the office says obviously the millions of specks win on arithmetic, the other half says obviously you can't add up dust specks, and I dont want to settle it by whoever talks loudest.

  What I want is a procedure we could actually run on a proposal, not an essay about aggregation. Concretely:

  - the questions in order, what counts as a sufficient answer to each, where the procedure just returns a no, and where it has to hand the decision to a person because the question is one of values rather than facts;
  - a rule for the unit of aggregation — per person, per trip, per person-minute? — because multiplying 90 seconds by 400,000 trips gives ten thousand hours, while dividing it among people who each lose a minute and a half gives roughly nothing, and I suspect whether the specks count at all depends entirely on which of those we pick;
  - a rule for burdens below the threshold of anyone noticing: a one-in-ten-million increase in lifetime cancer risk from some new cleaning solvent, a three-cent rounding error nobody detects, a delay shorter than anyone registers. Do these contribute their expected value, contribute nothing, or is that exactly the value call I have to make out loud?;
  - whether it matters if the trivial burdens pile up on the same people repeatedly or are spread thinly across different ones (our fare change hits the same daily commuters over and over; the platform move hits each rider once or twice);
  - how to treat a policy that certainly imposes a serious burden on five identifiable people versus one that imposes a one-in-a-million chance of that same burden on five million people — about five expected people, but nobody identifiable in advance. Does the procedure work in expected value and then shrug at what actually happens, and is that defensible in a public document?;
  - what to do when we simply don't have a number, which is most of the time — a rough count, or a count from a five-year-old survey — and how to reason with bounds instead.

  Then please run it on three cases: (1) the fare-rounding overcharge, roughly three cents across ninety million rides a year, which everyone here has always treated as paperwork noise; (2) a station consolidation that saves the agency about $600k a year and forces twelve elderly residents with no alternative to add 1.2 miles to every trip; (3) a scheduling change that adds ninety seconds to 400,000 daily trips but gets eight maintenance workers off a genuinely miserable 2am shift. I have a sinking feeling the procedure is going to tell us the rounding thing is the biggest item on the ledger — say so plainly if that's what falls out, I'd rather hear it now. Also be straight about which steps are judgment dressed up as arithmetic, because the board will treat anything with a number in it as objective and I need to know where I'm smuggling in a value choice, and flag the cases the procedure genuinely can't settle so we know to escalate them instead of pretending.
reasoning: |-
  Hmm, this is a fascinating and complex problem from someone working in public transit policy. The user is on a distributional review panel that evaluates service and fare changes, and they're struggling with how to weigh trivial burdens affecting many people against severe burdens affecting few people - essentially Parfit's dust speck dilemma in real-world policy.

  The user needs a practical procedure, not philosophical debate. They've outlined very specific requirements:
  - A step-by-step process with clear decision points
  - Rules for aggregation units (per person vs per trip)
  - How to handle sub-threshold burdens
  - Treatment of repeated vs distributed burdens
  - Handling certain small burdens vs probabilistic large burdens
  - Dealing with data uncertainty

  They've also provided three concrete cases to test the procedure, showing they want something actionable. I notice they're particularly concerned about whether minor fare rounding might turn out to be significant - that shows good self-awareness about potential biases.

  The context matters here: this is for public documentation that might face legal or media scrutiny, so the approach needs to be defensible. The panel includes people without philosophy/econ training, so complexity must be minimized. The two-day decision window means the procedure can't be computationally intensive.

  Key challenges I need to address:
  The aggregation unit question is fundamental - whether we measure in person-minutes or per-person experience changes everything. The threshold question is equally critical - when does a burden become "real"? And the repeated exposure issue could significantly affect outcomes in cases like fare rounding.

  For the probabilistic harm scenario, I need to distinguish between decision-making (where expected value is appropriate) and outcome accountability (where actual harm matters). The data uncertainty aspect requires clear rules for handling imperfect information.

  For the three test cases:
  - The fare rounding case will test how we value imperceptible losses
  - The station consolidation tests how we value severe burdens to vulnerable groups
  - The scheduling change balances minor inconvenience against significant worker relief

  I should be transparent about where value judgments are embedded in what looks like math - especially around threshold setting and severity classification. The procedure should clearly identify when decisions need human judgment rather than computation.

  The user's anxiety about the fare rounding being significant is well-founded - if we use person-minutes aggregation without thresholds, it mathematically dominates. But that might not reflect lived experience, hence the need for judgment points.
answer: |-
  Here’s a concrete, executable procedure for distributional review, designed for transparency and defensibility. It prioritizes **identifying value judgments explicitly** and **escalating indeterminable cases**. The core principle: **Aggregate only burdens above a materiality threshold**, and treat severe burdens as non-fungible with trivial ones.

  ---

  ### **The Procedure: 5-Step Decision Tree**  
  *(Run sequentially; stop if any step returns "NO" or "ESCALATE")*  

  1. **SEVERITY SCREENING**  
     - **Question:** Does the proposal impose *any* burden above **Severity Threshold 1** (e.g., ≥5% income impact, ≥30 min delay, loss of essential access, or health/safety risk)?  
     - **Sufficient Answer:**  
       - *YES*: Proceed to Step 2.  
       - *NO*: Skip to Step 4.  
     - **Value Judgment:** Defining Severity Threshold 1 (set by policy; e.g., "loss of sole transit access" = severe).  

  2. **NON-AGGREGATION TEST FOR SEVERE BURDENS**  
     - **Question:** Can the severe burden(s) be *fully mitigated* (e.g., alternative service, compensation) without negating the proposal’s net benefit?  
     - **Sufficient Answer:**  
       - *YES*: Require mitigation → Proceed to Step 4.  
       - *NO*: **ESCALATE** to Board (trivial gains cannot justify unmitigated severe harms).  

  3. **MATERIALITY THRESHOLD FOR TRIVIAL BURDENS**  
     - **Question:** Are *all* trivial burdens above **Materiality Threshold 2** (e.g., ≥1 min delay, ≥$0.10 cost, perceptible risk)?  
     - **Sufficient Answer:**  
       - *YES*: Proceed to Step 4.  
       - *NO*: Exclude sub-threshold burdens → Proceed to Step 4.  
     - **Value Judgment:** Setting Threshold 2 (e.g., "costs <$0.05/trip are excluded").  

  4. **AGGREGATION & NET BENEFIT TEST**  
     - **Unit of Aggregation:** **Per affected person** (not per trip).  
       - *Rationale:* Ethics centers on impact to individuals; per-trip aggregation inflates trivialities.  
     - **Rules:**  
       - Burdens/benefits **above thresholds** are summed as:  
         - **Monetized equivalents** (using your agency’s values, e.g., $15/hr for time).  
         - **Non-monetizable severe impacts** (e.g., isolation) → **ESCALATE**.  
       - **Repeated burdens:** Multiply by frequency (e.g., daily commuter = 220 trips/year).  
       - **Probabilistic harms:** Use expected value (e.g., 5 expected lives lost = 5 × value of life).  
     - **Question:** Is monetized **net benefit > $X** (e.g., 1% of agency budget) AND **no unquantified severe harms**?  
     - **Sufficient Answer:**  
       - *YES*: Approve.  
       - *NO*: **ESCALATE**.  

  5. **EQUITY CHECK**  
     - **Question:** Does the proposal disproportionately burden **protected classes** (low-income, disabled, elderly) vs. agency equity goals?  
     - **Sufficient Answer:**  
       - *YES*: Require mitigation or **ESCALATE**.  
       - *NO*: Approve.  

  ---

  ### **Key Rules Clarified**  
  - **Sub-Threshold Burdens:** Excluded entirely. *Rationale:* If a burden is imperceptible (<$0.05) or non-disruptive (<1 min), it has no welfare impact.  
  - **Repeated Burdens:** Count cumulative impact **per person** (e.g., $0.03 × 220 trips = $6.60/year).  
  - **Probabilistic Harms:** Expected value is valid for *decision-making* but must be **disclosed transparently** (e.g., "Expected fatalities: 5"). Actual outcomes are not the panel’s responsibility.  
  - **Data Uncertainty:** Use **conservative bounds** (e.g., min/max estimates). If uncertainty range crosses $0 net benefit → **ESCALATE**.  

  ---

  ### **Application to Your Cases**  
  **Case 1: Fare Rounding Overcharge ($0.03/ride; 90M rides/year)**  
  1. **Severity Screening:** No burden > Threshold 1 → Proceed to Step 3.  
  2. **Materiality Threshold:** Assume Threshold 2 = $0.05/trip. $0.03 < threshold → **Excluded**.  
  3. **Net Benefit:** No material burdens → **APPROVE** (treated as neutral).  
     - *Note:* If Threshold 2 is $0.01, aggregate **per person**: 50,000 daily riders × $0.03 × 220 trips = **$330,000/year burden**. Would require offsetting benefits >$330k.  

  **Case 2: Station Consolidation ($600k savings; 12 elderly lose access)**  
  1. **Severity Screening:** Loss of sole transit access = Severe → Proceed to Step 2.  
  2. **Non-Aggregation Test:** Can savings fund mitigation (e.g., shuttle)? If no → **ESCALATE to Board**.  
     - *Arithmetic note:* $600k savings could fund $50k/year/person mitigation — but if socially isolating, may be unmitigatable.  

  **Case 3: Scheduling Change (90s delay × 400k trips; relieves 8 workers)**  
  1. **Severity Screening:** 2am shift misery = Severe burden relieved. 90s delay < Threshold 1 → Proceed to Step 3.  
  2. **Materiality Threshold:** 90s (1.5 min) > typical Threshold 2 (e.g., 1 min) → Include.  
  3. **Aggregation:**  
     - *Burden:* 400k trips × 1.5 min = 10k hours. Monetize at $15/hr → **$150k burden**.  
     - *Benefit:* 8 workers × $50k misery premium (est.) = **$400k benefit**.  
  4. **Net Benefit:** $400k - $150k = **$250k net → APPROVE** (if equity check passes).  

  ---

  ### **Where Value Judgments Hide**  
  1. **Threshold Definitions:** Setting $/time values, Severity Threshold 1, Materiality Threshold 2.  
  2. **Mitigation Feasibility:** Judging if compensation "fully" offsets dignity/access harms.  
  3. **Misery Valuation:** Assigning $ value to non-monetary burdens (e.g., 2am shift).  
  4. **Equity Weights:** Deciding if burdens on vulnerable groups count extra.  

  ### **When to Escalate**  
  - Any unmitigated severe burden (Step 2).  
  - Net benefit close to $0 or highly uncertain (Step 4).  
  - Non-fungible harms (dignity, isolation) that resist monetization (Step 4).  

  ---

  ### **Bottom Line**  
  - **Fare rounding** is negligible *only if* your Materiality Threshold excludes <$0.05/trip. If included, it’s massive — but per-person aggregation prevents distortion.  
  - **Station closure** cannot be justified by trivial gains elsewhere — it demands mitigation or rejection.  
  - **Scheduling change** likely passes if worker relief is highly valued.  

  **Recommendation:** Draft a policy appendix defining your thresholds (e.g., "Sub-threshold = <$0.05/trip or <1 min delay"), monetization values, and severity criteria. This turns value choices into transparent policy, shielding your panel from ad hoc battles. Escalate often — it’s better than false precision.
