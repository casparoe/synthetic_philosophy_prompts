prompt: |-
  I've been reading rationalist blogs and forums since the Sequences days, and I run a small Sunday-evening study group out of my living room: seven or eight people, mostly working programmers, one biologist, one person who took a single probability course and remembers Bayes' rule and nothing else. We have a whiteboard and ninety minutes. A few months ago I got into an ugly thread in the comments under a post that invoked "Aumann" as a norm of disagreement, and I realized I couldn't explain, to my own satisfaction, why the standard blog-level move — rationalists with shared priors can't agree to disagree, so when someone disagrees with you, update toward them — doesn't actually follow, or what precisely it is that the theorem does say. So next month I'm running a session on Aumann's agreement theorem, and what I want from you is a plan for teaching it, not the lecture itself.

  Please take the role of a formal epistemologist and decision theorist who has taught this material both to graduate students and to general-audience meetups. Think carefully about the pedagogy rather than about displaying the proof: I want the order in which the components have to be introduced and what depends on what, one worked example that carries the whole thing, a map of the misconceptions this particular audience will arrive with or form and the exact point in the sequence where each should be headed off, a check that tells me whether the idea landed, and an explicit list of what I should decline to cover in ninety minutes. Do not write out the explanation itself, and do not restate the theorem at me as though that were the plan.

  A few constraints, some of which I learned the hard way. The room will arrive with the folk version — two Bayesians with the same prior who share all their evidence must agree — and I think that is nearly right but wrong in a way that matters, since the theorem gets agreement from common knowledge of the posteriors alone, without anyone handing over the evidence behind them, so the sequence should be built to break that reading at the right moment rather than at the start. The carrying example has to be a single binary proposition with a prior the whole room can genuinely assent to sharing, not a political or contested empirical claim, and it needs two private signals whose likelihood ratios are clean enough to compute on the board; it must be arranged so that the naive "just split the difference" shortcut, averaging the two credences, gives a visibly wrong number, because in the symmetric setup I tried last time the averaging heuristic accidentally produced the right answer and I lost the room; and it should be free of anything that lets people argue about whether the prior is really common or about whether the evidence was soft or ambiguous. One member is a committed average-your-credences person and will defend it, one will try to drag the session into prediction markets and the no-trade point, and one will ask whether the theorem says anything at all about who is better calibrated or more informed — I'd like each of those absorbed into the design rather than treated as an interruption.

  Please reply in the following sections, in this order:

  - Assumptions I can safely make about this room (~100 words): what to treat as known, and what not to.
  - Dependency map (~300 words): the ordered sequence of ideas, each with a sentence on why it has to come after the ones before it.
  - The carrying example (~350 words): the example worked through numerically, why it has the features it has, what a bad version of it would look like, and one alternative you rejected and why.
  - Misconception ledger (~400 words): a table, one row per misconception, with columns for where in the sequence it will surface and the move that defuses it.
  - The check (~150 words): one question or short closing task whose answer distinguishes someone who has the idea from someone who has only picked up the slogan, including what a wrong-but-confident answer would sound like.
  - What to refuse to cover (~150 words): including at least the common-prior idealization, the many-agent case, and whatever you think is the single most tempting thing for me to overreach into.
reasoning: |-
  Okay, the user has a very specific request about teaching Aumann's agreement theorem to their study group. They've been running this group for a while with mostly programmers and a biologist, and they've encountered confusion about the "folk version" of the theorem that's common in rationalist circles. 

  Hmm, I need to approach this as a formal epistemologist who's taught this to both academics and general audiences. The key challenges they mentioned: the group comes in believing the oversimplified "shared priors + shared evidence = agreement" version, and last time their example accidentally validated the "just average credences" heuristic. 

  First, let's map what the room knows. They're comfortable with Bayes' rule at a basic level - the biologist and probability-course person can handle likelihood ratios. But concepts like common knowledge or sigma-algebras will be foreign. Important to note they can handle joint probability tables since they're programmers - that'll be useful for the example.

  For the dependency map, I should start by getting them to feel the problem intuitively. A disagreement scenario where both people seem rational but have different credences. Then introduce the core puzzle: why can't this persist if they talk? Only after that tension is felt should I bring in the formal components like partitions and common knowledge. 

  Ah, the example needs careful design. Must be a binary proposition with unarguable prior. Thinking... coin biases? Too abstract. Weather? People argue about forecasts. Wait - medical test for rare disease! Perfect. Prior of 1% prevalence is uncontroversial. Then private test results: one gets 95% accurate test, other gets 90% accurate test. Crucially, the naive average of their posteriors (say 16.1% and 8.8%) would be ~12.5%, but the actual rational agreement is 14.3% - different enough to show the heuristic fails. 

  Now misconceptions. The big one is "common knowledge of evidence" - must kill that when introducing that posters know each other's beliefs, not evidence. The average-your-credences person will pop up when we compute the actual agreement - I'll show numerically why it's wrong. The prediction market enthusiast will ask about no-trade theorems during common knowledge discussion - I'll acknowledge but postpone. 

  For the check: ask what happens if they learn each other's posteriors but not that this knowledge is mutual. Correct answer: they update but may still disagree. Wrong answer: they immediately agree. 

  Must refuse: common prior debates (rabbit hole), multiple agents (irrelevant), and continuous cases (too advanced). The biggest temptation will be discussing calibration differences - I'll explicitly table it for later.
answer: |-
  ### Assumptions I can safely make about this room
  The room grasps Bayes' rule as a formula (`P(A|B) ∝ P(B|A)P(A)`), understands conditional probability tables, and accepts that rational agents update via Bayes. They intuit "common knowledge" informally (e.g., public announcements) but lack formalism. They handle joint probabilities numerically but lack measure theory (sigma-algebras, partitions). They’re fluent in binary logic and likelihood ratios. Crucially, they **don’t** know the theorem’s statement beyond the folk version, conflate "common knowledge of posteriors" with "sharing evidence," and haven’t seen disagreement protocols modeled.

  ---

  ### Dependency map
  1. **Disagreement scenario setup**: Establish intuitive tension—two rational people with same prior disagree despite honesty. *Why after?* Creates curiosity; preempts "just share evidence!"  
  2. **Partitions as information states**: Model each agent’s knowledge as cells in a grid (e.g., "I see signal A or B"). *Why after?* Visualizes private information without evidence details.  
  3. **Common knowledge definition**: "I know your posterior, you know I know, etc." via public announcement. *Why after?* Requires partitions to operationalize; breaks "evidence sharing" myth.  
  4. **Posterior agreement condition**: Show that if posteriors are common knowledge, they *must* be equal. *Why after?* Needs partitions and common knowledge to derive the fixpoint.  
  5. **Worked example**: Apply to concrete case. *Why after?* Validates abstract steps; reveals why averaging fails.  
  6. **Counterfactual disagreement**: Simulate non-common-knowledge dialogue (e.g., one agent doesn’t know the other knows). *Why after?* Contrast highlights theorem’s necessity conditions.

  ---

  ### The carrying example  
  **Claim**: A rare disease prevalence is 1% (`P(D)=0.01`).  
  **Agents**: Alice (gets 95% accurate test: `P(+|D)=0.95, P(−|¬D)=0.95`), Bob (gets 90% accurate test: `P(+|D)=0.90, P(−|¬D)=0.90`).  
  **Private signals**: Alice sees +, Bob sees −.  
  **Private posteriors**:  
  - Alice: `P(D|+) = [0.95×0.01]/[0.95×0.01 + 0.05×0.99] ≈ 16.1%`  
  - Bob: `P(D|−) = [0.10×0.01]/[0.10×0.01 + 0.90×0.99] ≈ 0.11%`  
  **Common knowledge exchange**: They publicly state beliefs (16.1%, 0.11%).  
  **Update**: Alice conditions on "Bob believes 0.11% *and* saw −", etc. Recursive calculation converges to **≈14.3%** for both.  

  **Why it works**:  
  - Prior is uncontroversial (rare disease).  
  - Likelihoods are asymmetric (95% vs 90% accuracy), so posteriors diverge sharply (16.1% vs 0.11%).  
  - Naive averaging (8.1%) ≠ true agreement (14.3%), exposing heuristic failure.  
  - Common knowledge forces nested updates (Alice: "Bob saw −, which is unlikely if I have D...").  

  **Bad version**: Symmetric signals (e.g., both 90% accurate). Averaging accidentally matches agreement, masking the mechanism.  
  **Rejected alternative**: Coin bias (e.g., P(heads)=p unknown). *Why?* Continuous priors invite calibration debates; binary claim avoids this.

  ---

  ### Misconception ledger  
  | Misconception                          | Surface point                      | Defusing move                                                                 |
  |----------------------------------------|-------------------------------------|-------------------------------------------------------------------------------|
  | "They must share *evidence* to agree"  | After intro of folk theorem        | Stress: theorem uses common knowledge of *beliefs*, not evidence. Show partitions hide evidence. |
  | "Just average posteriors"              | After private posteriors calculated | Compute naive average (8.1%) vs. actual agreement (14.3%); highlight divergence. |
  | "Prediction markets disprove this"     | During common knowledge discussion | Note no-trade follows *from* agreement; markets enforce common knowledge. Cite as corollary. |
  | "Better-informed agent 'wins'"         | During agreement calculation       | Show Bob’s low posterior pulls Alice down slightly—both compromise, neither "wins". |
  | "Common knowledge = repeating beliefs" | After definition                   | Simulate 1-round announcement (still disagree) vs. infinite rounds (agree). |

  ---

  ### The check  
  **Task**: "Suppose Alice and Bob share priors. Alice states her posterior is 60%. Bob now knows this, but Alice *doesn’t know* that Bob knows. Must they agree? Why?"  
  - **Correct**: "No. Bob updates to a new belief, but Alice hasn’t updated on Bob’s reaction (no common knowledge)."  
  - **Wrong-but-confident**: "Yes—once they share beliefs, agreement is forced." (Confuses common knowledge with one-way learning.)

  ---

  ### What to refuse to cover  
  1. **Debating common priors**: Idealization is necessary for the theorem; empirical disputes are red herrings.  
  2. **>2 agents**: Adds complexity (common knowledge harder) without insight.  
  3. **Continuous signals or infinite partitions**: Requires measure theory; intractable in 90 mins.  
  4. **Calibration superiority**: The theorem is silent on who is "right"—it only forces agreement. **This is the biggest trap.** Shut down with: "If priors match, calibration differences are irrelevant *for agreement*; save for a calibration session."  

  Focus relentlessly on binary claim → partitions → common knowledge → agreement mechanism. Cut off prediction markets, epistemology, or social applications—they’re follow-up topics.
