  - Detect indirect effects that are not obvious (it relies on step 6 which is judgment-based and may be imperfect).
  - Validate the substantive content of a motion (e.g., if a motion amends Rule 3 in a way that the charity regulator would reject, the procedure only checks the amendment path, not the content).

  We have not addressed the question of whether a motion that amends Rule 42 to add a new rule to the protected list would be valid. That would be step 3: amending Rule 42, so it would be in_order under Rule 41. Then the new rule would be protected by Rule 42. That is acceptable.

