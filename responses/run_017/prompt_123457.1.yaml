  Limitations of the procedure:

  1. It cannot resolve the unsettled status of Rule 42. That requires a legal opinion or a vote of the AGM to clarify.

  2. It does not check for conflicts with the charity regulator's requirements or with law. That is outside the Rules and must be done by solicitors.

  3. It does not check the substantive merit of the motion, only the procedural path.

  4. It may not catch very subtle indirect effects. Step 6 is a catch-all but relies on judgment and may be over- or under-inclusive.

  5. It assumes that the Rules are the only governing document. If there are bylaws or other documents, they are not considered.

  6. It cannot create new categories of entrenchment. The only valid entrenchment is via Rule 42 for Rules 1 and 3.

  7. It does not handle motions that amend multiple rules in one motion (e.g., both Rule 41 and Rule 1). We assume one rule per motion? Or we would break it down? The procedure is per motion, so if a motion does multiple things, we must check each part? But that complicates. We assume motions are focused.

