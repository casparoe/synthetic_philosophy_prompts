  ### Triage Procedure for Rule Amendments

  Here is a step-by-step triage procedure to evaluate motions for amending your Rules. It's designed for non-lawyers, uses plain English, and fits within your constraints. Ask these questions in sequence—stop at the first definitive verdict.

  | Step | Question asked | What counts as a sufficient answer | Verdict if answer not forthcoming | Judgment call? (yes/no, and why) | Who signs off |
  |------|----------------|-----------------------------------|----------------------------------|----------------------------------|--------------|
  | 1    | **Does the motion directly amend Rule 1 (Name) or Rule 3 (Objects)?** | Clear reference to Rule 1 or 3 in the motion text. | Refer to Council (ambiguity risks charity status). | No: Factual check against motion wording. | You (Honorary Secretary) |
  | 2    | **Does the motion directly amend Rule 41 (ordinary amendment rule)?** | Clear reference to Rule 41 in the motion text. | Refer to Council (indirect effects possible). | No: Factual check against motion wording. | You |
  | 3    | **Does the motion directly amend Rule 42 (entrenchment rule)?** | Clear reference to Rule 42 in the motion text. | Refer to Council (Rule 42’s status is unsettled). | No: Factual check against motion wording. | You |
  | 4    | **Does the motion attempt to entrench a rule (e.g., "this Rule shall not be amended")?** | Explicit phrases like "shall not be repealed/amended" or "may only be amended by [stricter process]." | Refer to Council (entrenchment requires Rule 42’s authority). | **Yes**: Requires interpreting intent from wording. | You (escalate to Council if ambiguous) |
  | 5    | **Does the motion indirectly weaken Rule 42’s protections?** (e.g., amending Rule 41 to lower thresholds, or altering Rule 43) | Evidence that the change makes it easier to amend Rules 1/3 later (e.g., lowering voting thresholds). | Not in order (prevents end-runs around entrenchment). | **Yes**: Assesses practical impact, not just wording. | Council (due to strategic implications) |
  | 6    | **Is the motion unrelated to Rules 1, 3, 41, or 42?** (e.g., housekeeping changes) | No mention of Rules 1, 3, 41, 42, or entrenchment language. | In order under Rule 41 (default procedure). | No: Factual check for absence of protected rules. | You |

  #### Key Principles
  - **Stop at "Not in Order" or "Refer to Council"**: Proceed only if prior steps are unresolved.
  - **Defendable at AGM**: Focus on clear, textual evidence (e.g., "The motion says X, so step Y applies").
  - **Inviolate Level Test**: No rule can self-entrench—entrenchment must be anchored in an *existing* authority (Rule 42). Without this, the motion creates a circular hierarchy (void by default).
  - **Unsettled Rule 42**: If Rule 42’s validity is material (e.g., for motions about Rules 1/3), note the 2024 reaffirmation uncertainty but apply Rule 42—it’s the last known valid authority.

  ---

  ### Application to Live Motions

  #### (a) Motion to lower Rule 41’s threshold to a simple majority  
  ```json
  {
    "motion_id": "a",
    "classification": "amendment-of-the-amendment-rule",
    "governing_rule": "Rule 41",
    "verdict": "in_order",
    "one_sentence_reason": "Rule 41 is amendable under its own procedure as it is not protected by Rule 42.",
    "what_I_wanted_versus_what_the_procedure_gives": "Neutral: The procedure permits this change, but it lowers the threshold for future amendments.",
    "judgment_calls": [],
    "escalate_to": "none",
    "residual_risk": "Low: Indirectly weakens Rule 42’s protections, but the motion itself is valid."
  }
  ```

  #### (b) Motion to add entrenched Rule 44 (no political endorsements)  
  ```json
  {
    "motion_id": "b",
    "classification": "purported_self_entrenchment",
    "governing_rule": null,
    "verdict": "not_in_order",
    "one_sentence_reason": "Rule 44 attempts self-entrenchment without anchoring in Rule 42, creating a circular hierarchy.",
    "what_I_wanted_versus_what_the_procedure_gives": "I wanted entrenchment, but the procedure blocks it: self-entrenchment lacks an inviolate level and is void.",
    "judgment_calls": ["Step 4 (entrenchment intent)"],
    "escalate_to": "Council (if Ethics Committee insists)",
    "residual_risk": "High: If passed, the entrenchment clause could be challenged as ultra vires."
  }
  ```

  #### (c) Motion to change name ("Provincial" → "Regional")  
  ```json
  {
    "motion_id": "c",
    "classification": "unsettled",
    "governing_rule": "Rule 42 (if valid)",
    "verdict": "in_order_with_conditions",
    "one_sentence_reason": "Amending Rule 1 requires Rule 42’s procedure, but Rule 42’s validity is unsettled after the 2024 vote.",
    "what_I_wanted_versus_what_the_procedure_gives": "I support this, but the procedure imposes Rule 42’s stricter process and flags legal uncertainty.",
    "judgment_calls": [],
    "escalate_to": "Solicitors (due to Rule 42 risk)",
    "residual_risk": "High: If Rule 42 is void, the motion could be invalidated by the charity regulator."
  }
  ```

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve Rule 42’s validity**: The 2024 reaffirmation vote (61% vs. 66.7% required) is a legal grey area. The procedure flags it but defers to solicitors.
  2. **Assess charity law compliance**: It checks *procedural* validity under your Rules, not whether content aligns with regulator policies (e.g., if Rule 3 changes risk charitable status).
  3. **Handle implied amendments**: Motions that indirectly alter Rules 1/3 by redefining terms (e.g., "‘Provincial’ means X") may evade detection—escalate to Council.
  4. **Political judgment calls**: If a motion is technically valid but divisive (e.g., amending Rule 41 to require 90% votes), the procedure won’t intervene. Council must decide.
  5. **Multi-rule motions**: If a motion amends Rules 41 *and* 1, it may pass Step 2 (Rule 1) but fail Step 5 (indirect effect). Escalate to Council for dissection.

  ### Final Advice  
  - **For (b)**: To entrench Rule 44 validly, propose two motions:  
    1. Amend **Rule 42** via Rule 41 to include Rule 44 in its protected list.  
    2. Add **Rule 44** under ordinary procedure.  
    This anchors entrenchment in Rule 42’s authority, avoiding self-reference.  
  - **For AGM defense**: Use the triage table as a script. Example: *"Motion (b) fails at Step 4—it tries to self-entrench. Like Escher’s hands, it has no anchor. Motion (a) passes Step 2—it amends Rule 41 under Rule 41 itself."*  
  - **Escalate strategically**: Use solicitors only for Rule 42 issues or charity law risks. Council handles political/stalemate cases.  

  This procedure prioritizes textual clarity over philosophy—making it defensible at the AGM while respecting Hofstadter’s "inviolate level" principle.
