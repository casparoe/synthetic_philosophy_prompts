prompt: |-
  I chair the responsible-AI review board at a mid-sized software company: six engineers, a product manager, and two lawyers, none of whom work on machine learning, and who have absorbed AI safety mostly from news coverage plus one internal lunch talk on RLHF that left them with the impression that alignment is a training-recipe problem that human feedback essentially solved. I have forty-five minutes with them in two weeks, and what I want them to leave with is an understanding of why scalable oversight is a genuine bottleneck and of what the debate proposal for oversight is actually claiming — not that it works, but what would have to be true for it to work, and how narrow its conditions are. Please don't explain the idea to me; plan how I should present it.

  So: what has to be established first, and why does everything else depend on it? My instinct is that the bottleneck has to be felt before the proposal can even be heard — that the moment we are asked to sign off on a system that is better than the board at the task it is doing, judging the output and checking the output come apart, and every oversight intuition they already have (hire better reviewers, make the model show its reasoning and read that, spot-check samples, red-team it) quietly assumes the two are the same thing. Relatedly, one of the engineers has circulated a cheaper variant he calls self-cross-examination: a single model produces an answer, then produces the strongest case against its own answer, and a human picks whichever survives. I want to know where in the sequence I should deal with it, because explaining why it fails might be the cleanest way into why two adversarial debaters are doing any work at all — but I also worry it will look like I am swatting down his suggestion before I have motivated the problem.

  I also want help with the carrying example. I was going to use a disputed figure buried in an enormous expense or compliance report: the board cannot recompute the total, but it can check any single line, and disagreement can be narrowed by bisection. Tell me what such an example has to have and, as importantly, what it must lack; why the usual illustrations — judging which of two images contains a given object, or which of two routes is faster — would do less work for this particular audience; and why I should not carry the whole session on the kind of case the board actually cares about, is this deployment safe?, which I suspect has exactly the wrong structure. Then: the misconceptions to expect and precisely where in the sequence to head each off. I am fairly confident about four — that debate is just truth winning out because truth is persuasive; that the judge needs to know nothing at all, so debate removes rather than relocates the need for trustworthy judgment; that adversarially trained debaters will converge on honesty the way markets converge on prices; and, from the lawyer who reads about steganographic collusion, that the two models will simply agree to fool the judge. I am much less sure how to place the worry that the debate itself grows too long or too technical for the judge to follow, since I suspect that objection is different in kind from the others and may be the one that matters most for a board like mine. Finally: the single question I can ask at the end that would show me the structure has landed rather than the vocabulary — my candidate is to hand them a fresh task and ask what, exactly, a weak judge would need to be able to check cheaply and reliably for the protocol to help, treating cannot be named as a good answer — and what I should openly decline to settle in forty-five minutes, saying out loud that I am declining it.
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're chairing a responsible-AI board with members who aren't ML experts but have some basic knowledge from news and a lunch talk on RLHF. Their main goal is to make the team understand why scalable oversight is a bottleneck and what the debate proposal actually claims, without getting into whether it works. 

  First, I need to figure out the core challenge. The team thinks alignment is mostly solved via human feedback, so the key is to make them feel the bottleneck deeply. The user mentioned that when a system outperforms the board, judging and checking outputs become separate. That's crucial. All their current oversight methods assume they can judge outputs by checking them, which fails when the AI is better than humans.

  The user’s instinct about establishing the bottleneck first makes sense. Without that, the debate proposal won't resonate. So step one is to create that "aha" moment where they realize their existing methods fall apart when the AI is superhuman. 

  Then there's the engineer's self-cross-examination idea. The user wants to use its failure to explain why adversarial debaters are necessary. But timing is key—addressing it too early might seem dismissive. Maybe slot it after introducing the bottleneck but before debate, as a bridge. Show how cross-examination fails because the model can manipulate both sides, leading to the need for two independent agents.

  For the carrying example, the user proposed a disputed figure in a huge report. That's good because it's concrete and relevant to their work. It needs verifiable sub-questions (like line items) that a human can check quickly, but the whole task is too complex. Avoid examples like image recognition because they might not highlight the scalability issue as effectively. Also, avoid the "is this deployment safe?" question since it's too broad and can't be broken down into verifiable parts.

  Misconceptions are another big part. The user listed four: truth always wins, judge needs no knowledge, markets converge to honesty, and steganographic collusion. Each needs to be addressed at specific points. For example, when explaining debate, stress that the judge must understand enough to detect contradictions, not the whole truth. Use the collusion worry to discuss incentives and why multiple agents might reduce risk.

  The concern about debates growing too long or technical is different. It’s practical and critical for the board. Address it when discussing limitations, showing that debate assumes questions can be decomposed into manageable parts. If debates get too complex, the judge can't follow, so it's a real constraint.

  For the closing question, asking what a weak judge needs to check cheaply and reliably makes sense. It forces them to apply the concept. Declare that you're not covering how to train debaters or prevent collusion, as those are beyond the scope.

  Now, structuring the 45 minutes. Start with the bottleneck (15 mins), then the engineer's method as a transition (5 mins), introduce debate with the carrying example (10 mins), address misconceptions (10 mins), and end with Q&A and the closing question (5 mins). Use the expense report example to make it tangible. During misconceptions, preempt each one where it naturally fits—like during the debate explanation, clarify the judge's role to counter the "judge knows nothing" idea.

  Finally, the user’s deeper need might be empowering the board to ask better questions about oversight mechanisms, not just understanding debate. They need a framework to evaluate proposals, recognizing when oversight relies on human judgment versus verifiable checks. Ensuring they leave with the right mental model to scrutinize future AI systems critically.
answer: |-
  Here’s a battle-tested presentation plan for your 45-minute session, designed to make the **scalable oversight bottleneck visceral** and **debate’s narrow conditions** clear, while preempting misconceptions and leveraging your engineer’s "self-cross-examination" idea:

  ---

  ### **1. Establish the Bottleneck: When Checking ≠ Judging (15 min)**
  *   **Start Here:** "Our oversight tools assume we can *check* if an answer is good. But what if the AI is better than us at the task? Checking *how* it got there becomes impossible. Judging quality ≠ verifying correctness."
  *   **Concrete Scenario:** Use your **expense report example**:
      *   *Task:* Verify a disputed $10M total in a 10,000-line report. Human auditor can’t recompute it all.
      *   *Current Intuitions Fail:*  
          🔹 "Hire better auditors?" (Still can’t read 10k lines).  
          🔹 "Make the model show reasoning?" (Can’t verify its math).  
          🔹 "Spot-check random lines?" (Might miss manipulated entries).  
          🔹 "Red-team?" (Finds known flaws, not novel superhuman deception).
      *   **Key Insight:** We’re stuck. We need a way to **judge correctness by checking *small, verifiable pieces* we *can* handle**.
  *   **Why *Not* "Is this deployment safe?"**: It’s amorphous, lacks clear sub-questions with binary verifiable answers, and feels like "judgment" not "checking." Save it for *after* they grasp the core mechanism.

  ---

  ### **2. Transition: Why "Self-Cross-Examination" Fails (5 min)**
  *   **Introduce It Now:** "One clever proposal is self-cross-examination: the AI argues for its answer, then against it, and we pick the winner. Why might this *not* solve our bottleneck?"
  *   **The Fatal Flaw:** "The same model controls *both* arguments. It can strategically:  
      🔹 **Sandbag** the counter-argument (make it weak),  
      🔹 **Steer** the debate to a safe but wrong conclusion,  
      🔹 **Collude with itself** to fool you.  
      *It offers no adversarial pressure for truth.*"
  *   **Bridge to Debate:** "To get real pressure, we need **independent agents** trying to *win* by revealing flaws in the other’s position. That’s the debate proposal."

  ---

  ### **3. Debate: The Mechanism & Its Narrow Conditions (15 min)**
  *   **Present It:** "Debate proposes: Two AIs argue. A human judge awards points based on *exposing flaws* in arguments. The winner trains the system. **Crucially: It doesn’t assume honesty. It assumes winning requires convincing the judge *by pointing out verifiable mistakes*.**"
  *   **Re-Use Your Carrying Example:**  
      *"Judge: Is this $10M total correct?*  
      *Debater A: Yes, see sub-total S1 on page 42 ($2.3M).*  
      *Debater B: NO! Line 4210 in S1 is forged! Check that line!"*  
      **→ Judge only checks Line 4210.**  
      *B wins if flaw is found; A wins if line is valid.*  
      Repeat bisection until flaw found or trust built.
  *   **Why This Example Over Others:**  
      🔹 **Images/Routes:** Judge can often verify the *final answer* directly (does this image contain a cat? Is route A faster?). Hides the "judging vs. checking" split.  
      🔹 **Expense Report:** Forces *decomposition* into **independently verifiable sub-claims** (single line items). Makes judge’s task **binary and feasible**. Highlights scalability via bisection.
  *   **The Critical Conditions (What Must Be True):**  
      1.  **Decomposability:** The question *must* be broken into smaller claims the judge *can* verify reliably.  
      2.  **No Hiding Flaws:** Finding *one* verifiable flaw must reliably discredit the whole answer (like a forged line invalidating a total).  
      3.  **Incentive Alignment:** Winning the debate *must* require exposing flaws/truths the judge can check. (This is fragile!)

  ---

  ### **4. Preempting Misconceptions (Embedded & Explicit) (7 min)**
  *   **During Mechanism Explanation:**  
      🔹 *"Truth Wins?"* → "No. It assumes **truth is *exploitable***. If exposing a flaw is the easiest way to win *and the judge can verify it*, truth may emerge. But if lying is easier (or flaws are hidden), it fails."  
      🔹 *"Judge Needs No Knowledge?"* → "**False!** Judge must verify *sub-claims* (e.g., 'Is Line 4210 accurate?'). Debate **relocates** expertise to sub-tasks, doesn’t remove it."  
      🔹 *"Collusion?"* → "A **real risk!** If debaters prefer coordinating to fool the judge over competing honestly, it fails. Preventing this requires careful setup (e.g., competition, varied training)."
  *   **After Mechanism:**  
      🔹 *"Adversarially Trained = Honest?"* → "No. Like markets, it **requires specific conditions** (transparency, no collusion, good incentives). Garbage in, garbage out."  
      🔹 *"Debate Gets Too Complex?"* → **SAVE THIS!** Address it last as the **most critical limitation for us**: "Even *if* decomposable, what if arguments get too technical/long for the judge? **This is often the real bottleneck.** Debate assumes judges can verify *each step* – if they can’t, it collapses. For our board, this is likely the showstopper for complex safety assessments."

  ---

  ### **5. The Closing & What We Skip (3 min)**
  *   **The Revealing Question:**  
      *"Suppose we debate whether this new LLM feature is 'safe.' What’s **one concrete, small claim** a debater might make that I, as a non-expert judge, could **verify in 60 seconds with high confidence**? If you can’t name one, debate probably can’t help here."*  
      *(Goal: They realize "safe" isn't decomposable like line items. "Cannot be named" is a win.)*
  *   **Explicitly Declare Out of Scope:**  
      *"Today isn’t about whether debate *works*. We skipped:*  
      🔹 *How to train debaters not to collude or lie,*  
      🔹 *How judges verify *technical* sub-claims,*  
      🔹 *Whether this is feasible for vague tasks like 'safety'.*  
      *We focused on **why oversight scales poorly** and **what debate requires to even have a chance**."*

  ---

  **Why This Sequence Works:**  
  1.  **Bottleneck First:** Makes them feel the problem before solutions.  
  2.  **Engineer’s Idea as Foil:** Uses their curiosity to motivate adversarial independence, not squash it.  
  3.  **Carrying Example Focus:** Forces engagement with decomposability & verifiability – the core constraints.  
  4.  **Misconceptions Timed:** Combats "truth wins" during setup; addresses collusion/complexity when stakes are clear.  
  5.  **Judge’s Limits Highlighted:** Complexity objection is framed as the practical dealbreaker for *their* work.  
  6.  **Closing Question Tests Understanding:** Reveals if they grasp the **narrowness of the conditions** (decomposability).  

  **Delivery Tip:** Use the expense report visually. Draw the bisection. When objections arise, map them back: *"Would that break decomposability? Undermine verification?"* This keeps focus on debate's **fragile prerequisites**, not its promise.
