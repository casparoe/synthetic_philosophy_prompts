  ## Coffee Break at the Edge of Knowledge

  **(The scene: A bustling coffee station during a market design workshop. Character A, mid-30s, energetic, gestures towards a large screen displaying a prediction market. Character B, late 40s, calm, sips coffee skeptically. The screen shows: "Reservoir Level Below Critical? (Satellite Data: T+90 days) | Bid: 30 | Ask: 38 | Last Trade: None (14 days) | Designated Maker: HydroWatch Ltd.")**

  **A:** ...so look at that quote. Thirty-four midpoint. It’s *saying* something, right? Even with zero volume for two weeks. HydroWatch is sitting there, willing to buy at 30, sell at 38. That spread itself tells a story – uncertainty, sure, but anchored around 34. It’s aggregating *something*, dispersed signals HydroWatch has, whispers from hydrologists, maybe fringe satellite analysis they trust. Hayek 101: the price *is* the compressed information, the thing no planner could assemble explicitly. Volume isn't the *sine qua non*; it's the friction in the Grossman-Stiglitz engine. If prices were instantly fully revealing, why would anyone bother digging for private info? The lack of trades *confirms* there’s likely no massive, uncontested divergence yet – it’s consistent with the price being reasonably informative!

  **B:** (Sets cup down) Consistent, sure. But is it *evidential*? Or is it just HydroWatch humming a tune based on their prior and their risk appetite? Aumann, Milgrom-Stokey... with common priors and common knowledge of rationality, nobody trades purely on information differences unless they’re hedging or have genuinely different priors. Zero volume here screams: *Nobody sees a compelling reason to challenge HydroWatch's view at these levels.* The quote is static. It’s cheap talk dressed up as a number. What looks like ‘aggregated information’ is mostly just the prior plus HydroWatch’s willingness to stand there – which could be bravado, boredom, or a cheap marketing ploy. Volume is the crucible. Without someone *actually* putting money down to disagree with the quote, to test it, it’s just... wallpaper. A guess masquerading as knowledge.

  **A:** Okay, granted, volume provides robustness, a stress test. But dismissing the quote entirely? That feels too strong. HydroWatch *is* putting skin in the game – their quote exposes them. If someone *did* see compelling evidence the reservoir was bone dry, they’d jump on that 30 bid! The absence of that jump is weakly informative. The *spread* tells you about perceived uncertainty...

  **B:** ...Perceived by *whom*? Just HydroWatch! And their perception includes their own risk aversion and cost of capital. It’s confounded. The ‘skin’ is conditional on someone trading, which isn’t happening. It’s potential skin, not actual. It *looks* like a commitment, but it’s only tested if someone calls the bluff. No call, no test. The prior reigns supreme by default.

  **A:** Fine, let’s make the quote *non-optional*. Suppose the exchange implements ‘jury-duty clearing’: periodically, at random, it drafts a small group – including the designated maker – and force-executes tiny trades at the *current* quoted midpoint. HydroWatch *has* to buy or sell a small, capped amount at 34, say, and so does some random participant. No one *wants* to trade, but they *have* to. Now the quote *is* tested. HydroWatch can’t just cheap-talk; they face real P&L risk from their quote, even without voluntary takers. The quote becomes a genuine commitment device, forcing them to internalize the cost of a bad quote. That injects the informational robustness you crave without relying on natural liquidity.

  **B:** (Leans forward, intrigued but wary) Clever. But I see two big snags. First: Independence. HydroWatch knows they might get randomly forced to trade at their quote. But the random draft is triggered by the exchange, right? How does HydroWatch *know* the draft timing is truly independent of the reservoir event itself? If they suspect the exchange might (even subconsciously!) trigger drafts more often when the quote looks shaky, or if they worry the draft *could* be correlated somehow with the event (maybe via the timing algorithm, latent variables...), they’ll immediately start shading their quote *back towards the prior*. They’ll quote 50, not 34, to minimize expected loss if forced to trade, precisely because they *can’t verify* the draft is independent of the very thing they’re trying to predict. You reintroduce bias through the backdoor of uncertainty about the mechanism.

  **A:** Hold on. The *informativeness* of the quote comes from HydroWatch having a signal and facing a penalty for mispricing *relative to the eventual outcome*. The draft’s independence from the event affects the *expected loss* HydroWatch faces, but not necessarily the *direction* of their incentive. If they have a strong signal it’s 20, quoting 50 exposes them to huge loss *if* they get drafted *and* the reservoir *is* low. They still want to quote close to their best estimate to minimize *conditional* loss. The draft forces them to stand behind their estimate with money, regardless of *why* they get drafted.

  **B:** But the *level* of their quote will reflect their uncertainty about the draft correlation! They’ll widen the spread or shift the midpoint to hedge against draft risk, muddying the pure information signal. My second point bites harder: Grossman-Stiglitz Redux. Under jury-duty, the expected loss from being drafted *is a cost of participating*. Crucially, it’s a cost borne specifically by those who *hold private signals*, because they’re the ones setting quotes or whose signals might make them reluctant counterparties. Acquiring a signal now comes with an extra tax: the risk of being randomly forced into a potentially loss-making trade based on that signal. This disincentivizes signal acquisition in the first place! You’ve just moved the Grossman-Stiglitz paradox: prices can’t be perfectly informative because acquiring info must be profitable, but you’ve added a new *cost* to holding info via forced trades, making it *harder* for prices to become informative, not easier! You might get a tested quote, but one based on *less* underlying information.

  **A:** (Pauses, thoughtful) Okay, the tax point is serious. I’ll concede that. Jury-duty *does* impose an expected cost on signal holders participating in the market, especially makers. That’s the price of forcing commitment. But consider the *spread* under jury-duty. Before, HydroWatch might quote 30-38 because it’s cheap. Now, if they quote that wide, and get drafted to buy at 34, they’re immediately taking a 4-cent loss expectation just from the spread! Jury-duty forces them to tighten spreads *if they want to minimize expected loss from forced trades*. The *spread itself* becomes a direct signal of their confidence and willingness to commit, not just risk aversion. A tight spread under jury-duty isn’t just cheap talk; it’s expensive courage. The evidential weight shifts from the mid being perfectly right, to the spread indicating conviction.

  **B:** Hmm. So you’re shifting the burden of proof from the mid to the spread? That’s... less ambitious but maybe more defensible. I’ll grant that a *tight* spread under jury-duty likely signals genuine confidence more credibly than a wide spread or a thin quote without it. The mechanism forces a tighter link between stated uncertainty and actual commitment. But my first objection stands: if HydroWatch suspects draft correlation, they might still bias the *mid* towards safety. And the Grossman-Stiglitz tax remains – it might suppress participation and signal acquisition, leading to *less* informative, albeit more ‘committed’, quotes. Jury-duty makes the quote *costly*, which is progress over cheap talk, but doesn’t magically solve the core tensions. It trades one set of problems for another – commitment for potential bias and participation cost.

  **A:** Exactly. It’s not a silver bullet. It’s a mechanism to make thin prices *less thin* in terms of commitment, forcing quotes to bear some cost of potential execution. It turns the quoted price from a speculative bid into a contingent liability. Is it perfect? No. But does it move the needle from ‘mere wallpaper’ towards ‘epistemic object’? I think yes. The spread under duress speaks volumes.

  **B:** Volumes it might speak, but whether it speaks *truth*... remains contested. Let’s get more coffee; this reservoir is looking murkier by the minute.

  **(They head towards the coffee urn, the 30-38 quote still flickering silently on the screen behind them.)**

