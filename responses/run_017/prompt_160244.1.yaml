  For the model answer, I plan to address three key ethical frameworks: utilitarianism (challenging sum-total reduction), deontology (questioning if dilution violates duties), and virtue ethics (considering character implications). The answer should demonstrate how each framework interacts with the dilution problem.

  The marking scheme needs to penalize panpsychism summaries while rewarding engagement with the moral aggregation problem. High marks should require recognizing that the conservation law makes aggregation methods central. I'll include a cap where missing the aggregation focus limits scores to B+.

  Regarding opportunity cost: while realistic, it might distract from the dilution crux. I'll recommend excluding it since the core dilemma stands alone. The physics stipulations already provide sufficient complexity.

  I'll structure the response with:
  - Clean exam question wording
  - Model answer demonstrating required depth
  - Detailed rubric highlighting application over summary
