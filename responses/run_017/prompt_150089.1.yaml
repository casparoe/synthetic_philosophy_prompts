prompt: |-
  I am a journalist who covers science and ideas, and next month I am giving a keynote at a media-and-technology conference, followed by a twenty-minute Q&A. I am defending a version of Daniel Dennett's counterfeit-people argument about AI: today's conversational systems are engineered to exploit our tendency to adopt the intentional stance, and they mimic the outward markers of personhood while failing the conditions that actually make something a person, such as reciprocal recognition, moral accountability, and a genuine history of agency. My thesis is that the central moral risk of these systems is not machine suffering but our own misplaced anthropomorphism and the way real human relationships and responsibilities get counterfeited or offloaded onto artifacts. The audience is about evenly split between machine-learning researchers who think a sufficiently advanced system could eventually satisfy Dennett's conditions, AI ethicists and legal scholars who dislike the term counterfeit and worry that it licenses ignoring the moral status of AI, and fellow science-and-technology journalists who will suspect I am repackaging old AI skepticism as a fresh scoop. Prepare me for the question period: give me the six to eight objections I will actually get from this audience, ordered by how likely and how damaging they are, phrased the way each subgroup would phrase them, each with a short reply and a note on where the reply is weakest, and flag the one question I am hoping nobody asks. I need a prep sheet, not a defense or a literature review.
