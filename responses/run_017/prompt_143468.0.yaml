prompt: |-
  I sit on the grants committee of a small foundation that makes "big bet" awards, and our charter annoyingly says we fund whichever proposal has the highest expected benefit per dollar. This cycle the front-runner is a proposal to endow a permanent rapid-response research network with no fixed end date, and our analyst's model of it has come apart. She says the upsides and downsides are both unbounded, that the expected net benefit only looks like a finite number because the enormous gains and the enormous losses cancel, and that the total moves depending on what order she adds the rows in — roughly +$40M chronological, roughly −$9M worst-first, no number changed, and it isn't a rounding error. Her view is that there just isn't an expected value here. Meanwhile the boring rival, a five-year job-training programme with decent evidence, beats the network if we cap the model at $100M and loses to it if we cap at $1B. Three of us want to fix a cap and rank by truncated mean, two want to rank by median instead, one says this is a modelling artifact and we should send the analyst back. We vote in ten days.

  Draft the memo I'll circulate. Recommend one course of action on this proposal and one rule for future cycles, and give the losing side's best argument its due — don't just tell us to adopt a utility function or a discount rate, we've had that argument and it settled nothing. Lead with the recommendation in the first sentence, then the reasoning, no preamble and no restating any of this back to me, and keep it under about 600 words.
reasoning: |-
  Okay, the user is on a grants committee facing a tricky situation with a proposal that has unbounded expected benefits and losses. They need a memo draft that leads with recommendations, addresses the core issues without revisiting settled debates like utility functions, and fairly presents opposing views.

  First, I need to understand the key problems: The analyst can't calculate a stable expected value for the research network proposal because gains and losses are unbounded and the sum changes based on calculation order. The committee is divided on solutions - capping/truncated mean vs median vs reworking the model. The rival job-training program has stable numbers but loses if caps are high.

  The memo must open with clear recommendations: For this proposal, reject it due to unquantifiable risk. For future cycles, implement a mandatory capping rule for all proposals. This directly addresses the immediate dilemma while preventing recurrence.

  I should structure it as:
  - First sentence: The twin recommendations
  - Then reasoning organized as:
    * Why rejection is necessary now (unresolvable modeling issue, violates charter's quantifiability requirement)
    * Why capping beats median for future cases (median ignores extremes, contradicts "big bet" philosophy)
    * Fair presentation of median argument (robustness appeal)
  - Explicitly not rehashing utility/discount rate debates
  - Keep under 600 words

  The losing side's best argument is that median handles uncertainty better - which I'll acknowledge before explaining why capping better serves their charter's intent. Need to emphasize that "big bets" require engaging with tail risks, not ignoring them.

  For tone: Concise, decisive but not dismissive. Acknowledge the analyst's findings as valid rather than calling for rework. Position capping as enabling rather than limiting "big bet" evaluations.
answer: |-
  **Reject the research network proposal under our current charter and implement mandatory outcome capping for all future proposals.** 

  For this cycle, the research network lacks a quantifiable expected benefit per dollar, violating our charter’s core requirement. The analyst’s finding—that the expected value is unstable and order-dependent—demonstrates a fundamental mathematical indeterminacy, not a fixable modeling flaw. Sending it back cannot resolve this; no defensible single number exists. The rival job-training program, with a stable and finite expected value supported by evidence, is the only compliant option. Funding the network would ignore our charter’s directive and gamble with potentially infinite downside risk masked by spurious "cancellation."

  For future cycles, require analysts to cap *all* proposal outcomes at symmetric, pre-defined absolute dollar values (e.g., ±$500M) and calculate expected benefit using these truncated means. This directly addresses unboundedness while preserving our "big bet" mandate: it allows evaluation of extreme (but not infinite) tail risks and ensures finite, comparable expected values. Crucially, it applies uniformly, preventing manipulation by capping both gains and losses across proposals. Median benefit, while robust to extremes, is unsuitable: it ignores the magnitude of potential tail events central to "big bets" and could prioritize mediocre outcomes with low variance over transformative (but riskier) projects. Capping engages with tail risks responsibly by bounding them, aligning with our mission without arbitrary case-by-case fixes.

  **Best argument for median benefit:** Proponents argue median benefit offers superior stability and avoids distortion from speculative, low-probability extremes that dominate means. It reflects the "typical" outcome more reliably when models are uncertain, ensuring decisions aren’t hijacked by highly uncertain tail estimates. For proposals like the research network—where catastrophic or astronomical outcomes are plausible but poorly quantified—median prioritizes robustness over theoretical expectations vulnerable to modeling artifacts.

  **Why capping prevails:** While median’s stability is appealing, it fundamentally conflicts with our charter’s "expected benefit" focus by disregarding the *scale* of potential wins/losses. A median-focused approach might reject a genuine "big bet" with high upside tail risk (e.g., a 60% chance of $0, 40% chance of +$1B) in favor of a safer project (100% chance of +$50M). Capping controls unboundedness while forcing explicit consideration of material tail impacts, better serving our mandate to seek transformative impact. Mandating caps universally ensures fairness and transparency, eliminating debates over individual proposal truncation.
