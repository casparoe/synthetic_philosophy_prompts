  For structure: Open mid-audit on a pruning case. Show the two subgraph options and the cold selection process. Then jump to the lookup table quantification problem. End with batch processing snapshotting, highlighting the absurdity of counting "moments" versus "beings." 

  The challenge is making moral dread emerge from dry technical details. I'll use phrases like "cost-differential threshold" and "acceptable behavioral drift" to maintain bureaucratic voice while letting the horror seep through the cracks. 

