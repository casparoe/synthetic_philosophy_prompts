prompt: |-
  I write a column on science and ideas, and our desk has been having one of its recurring arguments about how firmly to play single new studies: one colleague wants to run the surprising primate-cognition result essentially as reported, another wants to bury it in a paragraph on how few findings of that kind survive replication, and I keep noticing that both of them are reaching for the same vocabulary — inside view, outside view, base rates, epistemic modesty — without either of them having said what a rule for weighing these against each other would actually have to do in order to be worth adopting as desk policy. I have read enough popular treatments of the inside/outside view distinction and of the replication crisis to know the slogans and the cautionary anecdotes; what I lack is a specification. So before I recommend any particular heuristic to my editor, I want the requirements list.

  Please write the desiderata that any workable norm for weighting outside-view (base-rate, distributional) evidence against inside-view (case-specific, mechanistic) evidence would have to meet, where the purpose is fixed as follows: it is to govern a science desk deciding, usually within a day and without access to a statistician, whether and how firmly to run a single new result, and it must be defensible to an editor who has not done the reporting. For each requirement give the concrete case or consideration that makes it a requirement. The ones I think belong on the list, though I want you to add, cut, and reframe freely: what the rule owes us when there is arguably no reference class at all (a genuinely unprecedented result, where the outside view appears to have nothing to say); how it settles reference-class shopping, i.e. several defensible reference classes yielding different base rates, and whether the winner has to be specifiable in advance rather than after seeing the answer; what I have started calling the selection shadow, the fact that the published and press-covered record from which any base rate would be drawn was itself assembled by people who were not using the outside view, so the distribution is contaminated by the very enthusiasm the rule is meant to discount; what happens when the rule is performative, because adopting desk-wide modesty would alter the population the base rate is drawn from; how it handles a case in which the inside-view evidence is itself evidence about the heterogeneity of the reference class, so that discounting by the class average looks like ignoring the very information that distinguishes this case; what the output of the rule even is, given that a credence, a hedge in print, and a decision to publish come apart, and given that the writer's costs of a false alarm and a missed story are not the reader's; what I would call reception sensitivity, the fact that hedged prose is systematically read back as assertion, so a norm that is calibrated in the writer's head may be mis-calibrated once published; how cheap the rule must be to apply under deadline; whether an editor can audit its application without redoing the inside view; and finally that it must retain discrimination — a rule that licenses nothing is not modest, it is just silent. For each requirement, say what would count as cheating in satisfying it (for instance, one that handles the unprecedented case by permitting whatever the reporter already wanted to do has not handled it).

  Two further things. First, mark each requirement as non-negotiable or as the preference of a particular camp, and identify any pair or subset you suspect cannot be jointly satisfied, since that tension is the part I most want to see; if the list turns out to be internally unsatisfiable, say so rather than quietly dropping a requirement. Second, tell me which single requirement does the most work in excluding the candidate heuristics people actually reach for — anchoring on the base rate and adjusting, the reference-class forecasting style of procedure, an inside view gated by a mechanistic-plausibility check, and some precision-weighted pooling of the two — and then give a brief scorecard of those four against the list, counting as unsatisfied only what can be judged without new data. I am less interested in the scoring than in the criteria and their motivating cases, so keep the weight there.
reasoning: |-
  Hmm, the user is a science columnist grappling with how to handle new studies in their reporting. They're stuck between two colleagues: one who wants to run surprising findings as-is, and another who wants heavy caveats about replication issues. Both use terms like "inside view" and "outside view" but lack concrete rules. The user needs a framework for their desk policy.

  The user specifically wants desiderata (requirements) for weighing outside-view evidence (base rates, distributional data) against inside-view evidence (case-specific details). The policy must be quick to apply, defensible to editors, and handle real-world constraints like deadline pressures. They've listed several concerns they think belong in the requirements, like handling unprecedented results, reference-class shopping, selection bias in published literature, and how hedging in writing might be misinterpreted by readers.

  I need to craft a comprehensive list of requirements based on their outlined concerns. For each, I'll explain why it's necessary using concrete examples, mark whether it's non-negotiable or debatable, and note any tensions between requirements. I'll also identify which requirement most strongly challenges common heuristics like base-rate anchoring or precision-weighted pooling.

  Key challenges include:
  - The "selection shadow" problem where base rates come from literature already biased by excitement
  - "Reception sensitivity" where cautious writing gets misinterpreted as stronger claims
  - The need for discrimination - the policy can't just reject all studies
  - Practical constraints like speed and auditability

  The most critical requirement seems to be handling the "selection shadow," as it fundamentally undermines most outside-view approaches by contaminating the reference data. I'll show how each common heuristic fails against this requirement.

  Important tensions include:
  - Auditability vs. requiring mechanistic understanding
  - Handling unprecedented cases vs. avoiding bias
  - Discouraging hype while maintaining discrimination

  I'll structure this clearly with each requirement getting its own explanation, status (non-negotiable/preference), concrete case, and cheating example. Then I'll analyze the four common approaches against these requirements to show where they fail.
answer: |-
  Here is a specification of desiderata for a workable norm governing how a science desk weights outside-view (base-rate, distributional) evidence against inside-view (case-specific, mechanistic) evidence when deciding how firmly to report a single new study. Requirements are derived from your core concerns, operational constraints, and epistemic realities. Each includes a concrete motivating case, cheating examples, and classification. Tensions are explicitly noted.

  ### Core Desiderata
  1.  **Handling the Unprecedented (No Reference Class):**  
      *   **Requirement:** The norm must provide defensible guidance when no credible reference class exists (e.g., truly novel phenomenon, unique methodology). It cannot default to "report enthusiastically" or "ignore" simply due to novelty.  
      *   **Motivating Case:** The first report of CRISPR gene editing in mammals. No prior base rate for "success of radically novel gene-editing techniques in complex organisms" exists.  
      *   **Cheating:** Permitting reporting based solely on the reporter's/editor's excitement level ("It's *so* cool/new!"), or rejecting it solely because it lacks precedent ("No base rate? Too risky.").  
      *   **Status:** Non-negotiable. Failure here renders the norm useless for breakthrough science.  
      *   **Output Requirement:** Must generate a distinct action (e.g., "Report with maximal caveats on novelty and unknowns," "Seek urgent independent comment on plausibility").

  2.  **Resolving Reference-Class Shopping:**  
      *   **Requirement:** The norm must constrain how a reference class is chosen when multiple defensible options exist (e.g., "primate cognition studies," "surprising animal behavior claims," "fMRI studies"). It must specify *how* to select the most appropriate class *before* seeing its base rate, or provide a rule for combining/weighting classes.  
      *   **Motivating Case:** A surprising primate social learning study. Is the reference class "all primate cognition studies," "studies using similar methodology (X)," "studies reporting *surprising* social behaviors," or "findings in this specific journal"? Each yields vastly different "failure-to-replicate" base rates.  
      *   **Cheating:** Choosing the reference class that yields the base rate most convenient for the desired editorial outcome (enthusiasm vs. skepticism).  
      *   **Status:** Non-negotiable. Unconstrained shopping invalidates the outside view.  
      *   **Tension:** Intrinsically linked to Selection Shadow (Requirement 3).

  3.  **Accounting for Selection Shadow (Publication/Reporting Bias):**  
      *   **Requirement:** The norm must explicitly address that base rates derived from published literature (or past press coverage) are contaminated by selective publication and reporting favoring surprising, positive results. The "observed failure rate" is likely a significant *underestimate* of the true failure rate.  
      *   **Motivating Case:** Base rates for replication failure in social psychology (~50%) were only revealed *after* systematic replication efforts; the published literature pre-2010 suggested much higher robustness because failures weren't published. Applying a pre-2010 base rate today would be misleading.  
      *   **Cheating:** Using the observed published base rate naively without a correction factor or severe caveat acknowledging its likely bias. Treating "no formal replication data" as equivalent to "high reliability."  
      *   **Status:** **Non-negotiable & Key Excluder.** This fundamentally undermines naive base-rate anchoring. Most common heuristics fail here because they treat the published record as representative.  
      *   **Tension:** Creates friction with Auditability (Requirement 9) and Cheapness (Requirement 8).

  4.  **Addressing Performative Effects:**  
      *   **Requirement:** The norm must acknowledge that widespread adoption *of the norm itself* by science desks could alter the population of studies receiving coverage, thereby changing the base rates future desks would use (e.g., if desks become more skeptical, only stronger/more robust findings get covered, raising the apparent base rate).  
      *   **Motivating Case:** If desks universally adopt strong outside-view skepticism, only massive, multi-lab, pre-registered findings get covered. Future base rates derived from *this* covered record would be artificially high, potentially justifying *less* skepticism later – a feedback loop.  
      *   **Cheating:** Ignoring the potential feedback loop entirely.  
      *   **Status:** Preference (Skeptic Camp). Important for long-term validity but less critical for immediate, individual decisions. Requires meta-awareness.

  5.  **Handling Heterogeneity within Reference Class (Inside-View as Diagnostician):**  
      *   **Requirement:** The norm must allow strong inside-view evidence (e.g., exceptional methodological rigor, clear mechanistic plausibility, pre-registration, large sample) to *overrule* a pessimistic base rate derived from a heterogeneous class where such features are often absent. Discounting by the class average must not ignore features making *this specific case* an outlier *within* the class.  
      *   **Motivating Case:** A large, pre-registered, multi-site RCT with impeccable methodology reports a surprising medical result. The reference class "surprising medical RCTs" has a high failure rate, but this study possesses features (pre-reg, large N, rigor) demonstrably correlated with robustness *within* that class. Ignoring these features because "the base rate is low" is throwing away valuable information.  
      *   **Cheating:** Using a base rate while ignoring known correlates of robustness within the class, or defining the reference class so narrowly (e.g., "pre-registered multi-site RCTs with N>10,000") that the base rate becomes meaningless due to tiny samples.  
      *   **Status:** Non-negotiable. Failure here makes the norm epistemically blind.  
      *   **Tension:** Directly opposes naive outside-view dominance (Base Rate Anchoring).

  6.  **Defining Actionable Output (Beyond Credence):**  
      *   **Requirement:** The norm must output a clear, discrete editorial action (e.g., "Lead story," "Short item with prominent caveats," "Hold for replication/comment," "Spike") and guide the *degree of hedging* in the text. It must explicitly account for the divergence between the writer's credence, the hedge in print, reader interpretation, and costs (false alarm vs. missed story for both writer and reader).  
      *   **Motivating Case:** A reporter assigns 60% credence a finding is robust. How firmly should it run? A short, buried item with weak caveats might mislead readers into thinking it's solid. A prominently placed item with strong caveats might be misinterpreted as the desk asserting doubt. The cost of a false alarm (loss of credibility) differs from a missed story (lost opportunity) for the desk and reader.  
      *   **Cheating:** Outputting only a subjective probability estimate without translating it into concrete journalistic action and wording guidance. Ignoring the interpretation gap (Reception Sensitivity - Requirement 7).  
      *   **Status:** Non-negotiable. Essential for operational utility.  
      *   **Output Requirement:** Must map assessment to specific actions/hedging levels.

  7.  **Mitigating Reception Sensitivity (Hedge Misinterpretation):**  
      *   **Requirement:** The norm must incorporate the empirically observed tendency of readers to under-weight or ignore hedges and caveats in science reporting, systematically interpreting cautious language as stronger assertion than intended. The output hedging must be calibrated *for likely reader interpretation*, not just the writer's internal credence.  
      *   **Motivating Case:** Writing "This surprising finding suggests X, *but requires independent replication*" often leads readers to remember "Study proves X." The hedge is functionally invisible to a significant portion of the audience.  
      *   **Cheating:** Writing hedging that satisfies the writer's/internal norm's calibration without testing or accounting for how it *actually lands* with a non-expert audience. Pretending caveats are always effective.  
      *   **Status:** Non-negotiable. Failure makes the norm's calibration functionally useless in practice.  
      *   **Tension:** Makes strong hedging less effective, pushing towards either stronger assertions (if run) or spiking more stories. Challenges Discrimination (Requirement 10).

  8.  **Cheapness & Deadline Feasibility:**  
      *   **Requirement:** Application of the norm must be feasible by a reporter or editor within hours, without requiring complex calculations, deep statistical expertise, or extensive new research beyond standard reporting diligence.  
      *   **Motivating Case:** A major study embargo lifts at 2 PM; column deadline is 5 PM; no statistician is available.  
      *   **Cheating:** Requiring a full meta-analysis or Bayesian calculation for every story.  
      *   **Status:** **Non-negotiable.** Operational necessity.  
      *   **Tension:** Severely limits sophistication, conflicting with Selection Shadow (Requirement 3), Heterogeneity (Requirement 5), and Auditability (Requirement 9).

  9.  **Editorial Auditability:**  
      *   **Requirement:** An editor (without redoing the reporter's inside-view assessment) must be able to verify that the norm was applied correctly, particularly the choice of reference class and the application of the base rate. The reasoning must be transparent.  
      *   **Motivating Case:** Reporter A applies norm skeptically to Study X, Reporter B applies it enthusiastically to similar Study Y. Editor needs to audit if the norm was followed or if bias crept in.  
      *   **Cheating:** Basing the reference class or discounting factor on an opaque "reporter judgment" that the editor cannot evaluate without becoming the reporter.  
      *   **Status:** Non-negotiable (Editorial Management). Essential for consistent policy application and defense.  
      *   **Tension:** Conflicts with Cheapness (Requirement 8) and Handling Heterogeneity (Requirement 5 - deep mechanistic understanding is hard to audit).

  10. **Retaining Discrimination (Avoiding Silence):**  
      *   **Requirement:** The norm must not default to excessive skepticism that effectively prevents reporting on any new, single-study findings. It must allow for justified enthusiasm in some cases.  
      *   **Motivating Case:** A large, well-conducted, pre-registered study in a field with a decent replication record reports an important, moderately surprising result. A norm demanding multi-lab replication before *any* coverage renders the desk irrelevant.  
      *   **Cheating:** Setting the outside-view discount so high that only near-certain findings pass (making science news boring and late), or defining reference classes always pessimistically.  
      *   **Status:** Non-negotiable. Purpose is to *guide* reporting, not prevent it.  
      *   **Tension:** Counteracts the pressure from Selection Shadow (Requirement 3) and Reception Sensitivity (Requirement 7).

  ### Key Tensions (Likely Unsatisfiable Pairs/Trios)
  *   **Selection Shadow (3) + Cheapness (8) + Auditability (9):** Accounting for publication bias properly (3) is complex and requires nuanced meta-scientific knowledge. Doing this cheaply (8) and in an auditable way (9) is extremely difficult. *Likely Resolution:* Require explicit acknowledgment of the bias and use a conservative adjustment factor (e.g., "Assume true failure rate is at least 2x observed") – imperfect but feasible.
  *   **Heterogeneity (5) + Auditability (9):** Allowing inside-view details to override a base rate requires deep case-specific understanding. Auditing this without redoing the work is hard. *Likely Resolution:* Require reporters to explicitly list the *specific* robustness features present/absent and justify their weight relative to the base rate.
  *   **Reception Sensitivity (7) + Discrimination (10):** If readers ignore caveats, running any surprising finding risks misinterpretation (hurting 7), but spiking everything hurts 10. *Likely Resolution:* Structural solutions - *where* and *how* the story is placed/framed visually matters as much as wording. Reserve prominent placement only for highest-confidence findings.

  ### Requirement Doing the Most Work in Excluding Common Heuristics
  **Selection Shadow (Requirement 3)** is the most potent excluder. Most common heuristics treat the published literature as a reliable source for base rates. **Requirement 3 forces the acknowledgment that this source is fundamentally contaminated by the same hype the heuristic is trying to counter.** This directly undermines:
  *   **Base Rate Anchoring & Adjustment:** Anchors to a known-biased base rate. Adjustment is subjective and rarely accounts for the systemic bias magnitude.
  *   **Reference-Class Forecasting:** Relies entirely on historical data from the biased published record. Doesn't correct for the selection effect.
  *   **Precision-Weighted Pooling:** Pooling assumes both views are based on unbiased estimates. The outside-view estimate (base rate) is biased; pooling gives undue weight to flawed data.

  ### Scorecard of Common Heuristics (Against Non-Negotiable Requirements)
  *(Judged based on inherent structure, not requiring new data)*

  1.  **Base Rate Anchoring & Adjustment:**
      *   Unprecedented (1): Fails (no anchor).
      *   Reference Class Shopping (2): Fails (choice subjective, prone to bias).
      *   **Selection Shadow (3): FAILS** (Uses biased anchor, adjustment rarely corrects sufficiently).
      *   Heterogeneity (5): Fails (Adjustment often ignores specific robustness features).
      *   Output (6): Poor (Outputs credence, not action/hedge).
      *   Reception Sensitivity (7): Fails (Ignores it).
      *   Cheapness (8): Passes.
      *   Auditability (9): Poor (Adjustment subjective, hard to audit).
      *   Discrimination (10): Moderate (Can permit reporting if adjustment is small).

  2.  **Reference-Class Forecasting:**
      *   Unprecedented (1): Fails (Requires reference class).
      *   Reference Class Shopping (2): Moderate (Seeks "proper" class, but defensibility can be ambiguous).
      *   **Selection Shadow (3): FAILS** (Relies entirely on biased historical data).
      *   Heterogeneity (5): Fails (Averages over class, ignores case specifics).
      *   Output (6): Moderate (Outputs prediction, needs translation).
      *   Reception Sensitivity (7): Fails (Ignores it).
      *   Cheapness (8): Poor (Finding proper class can be time-consuming).
      *   Auditability (9): Moderate (Class choice can be documented).
      *   Discrimination (10): Moderate (Can permit reporting based on class forecast).

  3.  **Inside View Gated by Mechanistic Plausibility:**
      *   Unprecedented (1): Passes (Relies on plausibility assessment).
      *   Reference Class Shopping (2): N/A (Doesn't use outside view).
      *   Selection Shadow (3): Passes (Doesn't use contaminated base rates).
      *   Heterogeneity (5): Passes (Focuses on case specifics).
      *   Output (6): Poor (Outputs credence based on plausibility).
      *   Reception Sensitivity (7): Fails (Ignores it).
      *   Cheapness (8): Moderate (Plausibility assessment can be quick or deep).
      *   Auditability (9): Poor (Plausibility judgment is highly subjective, hard to audit).
      *   Discrimination (10): Passes (Can permit reporting).

  4.  **Precision-Weighted Pooling:**
      *   Unprecedented (1): Fails (No outside view to pool with).
      *   Reference Class Shopping (2): Fails (Choice of class affects outside-view precision).
      *   **Selection Shadow (3): FAILS** (Pools inside view with biased outside estimate; precision doesn't equal accuracy).
      *   Heterogeneity (5): Moderate (If inside view precisely identifies robustness, it *could* dominate).
      *   Output (6): Poor (Outputs pooled credence).
      *   Reception Sensitivity (7): Fails (Ignores it).
      *   Cheapness (8): Poor (Estimating precision reliably is hard/statistical).
      *   Auditability (9): Poor (Precision estimates subjective/opaque).
      *   Discrimination (10): Moderate (Can permit reporting).

  **Conclusion:** No existing common heuristic satisfies all non-negotiable requirements. **Selection Shadow (3)** is the primary killer for outside-view approaches. **Auditability (9)** is a major challenge for inside-view approaches. A workable norm must *explicitly* address publication bias, incorporate case-specific robustness features *transparently*, map assessments to calibrated actions/hedges, and do this simply. This likely involves structured checklists (e.g., scoring pre-registration, sample size, field's replication record w/ bias caveat) triggering predefined reporting/hedging levels. Tensions remain, especially between Selection Shadow and Cheapness/Auditability, demanding pragmatic compromises acknowledged upfront.
