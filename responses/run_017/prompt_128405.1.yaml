prompt: |-
  I teach U.S. history at a community college, and two years ago I ended up on our county's volunteer oversight board for automated decision systems — not because I know anything about statistics, but because nobody else would do it. We review three things: the pretrial risk score used at first appearance, the hospital network's model for handing out a fixed number of intensive post-discharge follow-up slots, and a newer program that targets eviction-prevention money. I've read enough to know the shape of the standard impossibility results, and I've given up hoping for a model that satisfies every criterion at once: if a score is calibrated within each group and the groups have different base rates of the outcome, then at a single decision threshold the higher-base-rate group absorbs more false positives and fewer false negatives; forcing both error rates to match across groups destroys calibration; and, unless the predictions are perfect, matching error rates across groups is incompatible with matching what a positive prediction is worth. I argued about this with a friend who builds these systems for a living, and every time I said "this one feels unfair" he said "that's just the impossibility theorem," and I said "I know — but which side of it do we want to be on?" Neither of us could say what the question even turns on. So here are my verdicts, and I'd like to know whether they add up to anything.

  (1) Pretrial, calibrated score, one cutoff for everyone: defendants booked out of the north-side precincts (where most misdemeanor arrests happen, and whose recorded reoffense rate is accordingly much higher) are detained despite not reoffending at about twice the rate of everyone else, while everyone else is released and then re-arrested at about twice the north-side rate. Unfair — the false detentions are the injury, and I want that rate equalized. (2) Same model, but the thresholds are tuned separately per group until the false-positive rates match: now more north-side defendants are released and re-arrested, and since arrests happen near home, most of the additional victims are north-side residents too. Not an improvement, and maybe worse — but I can't say why, since the disparity I objected to in (1) is gone. (3) Hospital slots: 200 slots, 1,000 patients, ranked by predicted readmission risk; because readmission is more common among the low-income patients the hospital serves, they take 140 of the slots. Our equity officer proposes capping each group at 100. The cap is the unfair move, not the original: under it, a patient at 45% risk is passed over for one at 28%, and I can't see who that serves. And yet the identical 45-vs-28 comparison at the cutoff inside a single group doesn't bother me at all. (4) Then we learn that the low-income group's readmission rate is elevated partly because those patients were least likely to get follow-up in the first place — the label is in part a record of past neglect. That makes me more comfortable with the uncapped allocation, not less, even though by the reasoning I used in (1) a corrupted base rate should make me warier of any disparity that tracks it. (5) A new pretrial model cuts false detentions by a third in both groups relative to the judges it would replace; because the judges were harsher on the north-side group to begin with, the absolute gap between the groups widens. Fine — deploy it. (6) A different model hits exact false-positive parity, but only by detaining north-side defendants the judges would have released, i.e. by making that group worse off than the process it replaces in order to hit the number. Not fine. (7) A third model drops prior-arrest count on the grounds that it is inflated by over-policing; it's less accurate, detention rates rise for both groups, and the north-side group ends up worse off than under the judges. I still want to deploy it — which suggests the rule I was reaching for in (5) and (6) isn't about being made worse off as such.

  My tentative principle is something like: no group should be made worse off than under the decision process the model replaces, and parity among the usual error-rate criteria is worth pursuing only inside that constraint, ranked by whichever error does the harm in that setting. Two problems. First, (7) shows the rule needs a clause about whether the baseline was itself legitimate, and once I add that clause I'm not sure the rule has any content left beyond a general theory of what we owe each other. Second, the case I keep reversing on: the eviction-prevention money. There a positive prediction triggers a benefit, so the error I care about flips — I want to equalize the rate at which people are wrongly denied and then evicted — but that forces unequal false-positive rates, meaning one group receives more payments that turn out to have been unnecessary. I find I don't care about that at all, and that troubles me, because in (1) I cared enormously about exactly that kind of unequal error rate and my friend's theorem says the two situations are formally the same.

  What I want from you: two to four candidate principles, each stated precisely enough that I could apply it to a new vendor filing without asking you again, with the clause-motivating case named for each clause; a blunt statement of which of my verdicts each candidate forces me to abandon; and each candidate's verdict on the eviction-prevention case plus one case of your own construction that you think best separates the candidates from each other. One more thing, if your principle has anything to say about it: our numbers change substantially, and sometimes change sign, depending on whether we measure disparities across the two groups the county officially tracks, across precincts, or across age bands within each group — and nothing I've read tells me which partition of the population is the one fairness is supposed to be measured over. And if the honest answer is that no group-level criterion is doing any real work in my verdicts, and that they are all being generated by who bears which kind of harm, say that plainly, and tell me what I should be demanding from the vendors instead.
reasoning: |-
  Okay, the user teaches U.S. history and is on a county oversight board for automated decision systems. They're dealing with fairness in pretrial risk scores, hospital follow-up slots, and eviction prevention. They understand the impossibility theorems but struggle with how to apply fairness in practice. Their specific verdicts across different scenarios show they prioritize avoiding harm, especially when it makes groups worse off than before. 

  The user's main request is for clear principles to evaluate these systems, but their deeper need seems to be reconciling theoretical fairness constraints with real-world harm prevention. They're frustrated by abstract statistical trade-offs and want practical guidance anchored in minimizing tangible injuries—like false detentions or unequal medical access. 

  Looking at their cases, they consistently reject solutions that increase net harm (even if mathematically "fairer") and accept those that reduce absolute harm despite widening disparities. The eviction case is particularly telling: they're untroubled by unequal false positives when it means preventing more harmful false negatives. This suggests their intuition is harm-minimization first, parity second. 

  The hospital cap example reveals another layer: they recognize when disparities stem from past injustice (like medical neglect) and adjust fairness expectations accordingly. But they're uneasy about this inconsistency—why does context matter in healthcare but not in pretrial? Their struggle is moral, not technical.

  The population partition problem is critical. Their verdicts implicitly weight harms by who experiences them (e.g., north-side residents suffering from repeat offenders). But current fairness metrics can't capture that spatial dimension. Maybe they need to demand vendors map harm distribution beyond crude demographics.

  For principles, I should offer options ranging from strict harm-reduction to context-dependent justice. The eviction case will test them all: if a principle balks at unequal false positives there, it fails their intuition. The optional test case should pit group parity against individual harm in a way that exposes which metric truly matters to them.
answer: |-
  Here are four candidate principles addressing your core dilemma—balancing statistical fairness constraints against tangible harms in context—with explicit clauses for each case that motivated them. Each is operationalized for vendor evaluation, including verdicts on your cases and an additional test scenario.

  ---

  ### **Principle 1: Harm-Minimization with Group Constraint (HMC)**  
  *"Minimize aggregate harm subject to: (a) no group suffers *greater* harm than under the replaced system; (b) harm is defined by the primary injury in the decision context (e.g., false detention, wrongful eviction)."*  
  - **Clause (a)**: Motivated by Cases 5, 6, 7 (no group worse off than replaced baseline).  
  - **Clause (b)**: Motivated by Cases 1, 3 (harm = false detention in pretrial; harm ≠ unnecessary aid in eviction).  
  - **Abandons**: Case 2 (if tuning thresholds to match FPR increases aggregate harm/re-arrests, it violates minimization even if no group is worse off than judges).  
  - **Eviction Case**: Unequal false positives (unnecessary aid) permitted; maximize prevention of evictions (minimize false negatives).  
  - **Test Case**: *Emergency Housing Allocation*: Model prioritizes applicants by predicted homelessness risk. Group A (high-risk) has higher base rate. Uncapped allocation gives Group A 80% of slots. A cap to force 50% slots for Group B (lower risk) would leave higher-risk applicants in Group A homeless.  
    **HMC Verdict**: Reject cap—violates harm-minimization (prioritizing higher-risk applicants prevents more homelessness).  

  ---

  ### **Principle 2: Calibrated Fairness with Baseline Legitimacy (CFB)**  
  *"Require calibration within groups. If the baseline system was *illegitimate* (e.g., discriminatory), prioritize reducing disparity in primary harm; else, minimize aggregate harm."*  
  - **Clause (Baseline Legitimacy)**: Motivated by Case 7 (past over-policing invalidates arrest-count-based baseline).  
  - **Abandons**: Case 4 (if hospital’s past neglect makes baseline illegitimate, CFB may prioritize equalizing follow-up slots despite harm inefficiency).  
  - **Eviction Case**: Calibrated predictions required. Unequal false negatives/positives accepted if calibrated.  
  - **Test Case**: *Job Screening*: Model predicts job success. Group X (historically excluded) has lower base rate due to past bias. A calibrated model has higher FPR for Group X.  
    **CFB Verdict**: If past bias makes baseline illegitimate, allow higher FPR for Group X to reduce false negatives (missed hires).  

  ---

  ### **Principle 3: Error-Harm Parity (EHP)**  
  *"Equalize the rate of the *harmful error* (e.g., false detention, wrongful eviction) across groups. Permit trade-offs only if aggregate harm decreases and no group’s absolute harm increases."*  
  - **Clause (Harmful Error Focus)**: Motivated by Cases 1 (equalize false detentions) vs. Eviction (equalize false negatives).  
  - **Abandons**: Case 3 (hospital cap equalizes slots, not harmful errors; EHP ignores inefficient 45% vs. 28% trade-off).  
  - **Eviction Case**: Equalize false negative rates (wrongful denials leading to eviction). Unequal false positives allowed.  
  - **Test Case**: *Bail Granting*: Model has equal FNR (dangerous releases) but higher FPR (excessive denials) for Group Y. Judges had lower FPR for Group Y.  
    **EHP Verdict**: Reject model if FPR disparity increases harm for Group Y, even if FNR is equalized.  

  ---

  ### **Principle 4: Dynamic Harm Equity (DHE)**  
  *"Reduce aggregate harm. Track disparities across all policy-relevant groups (race, precinct, age). If a disparity (*δ*) in primary harm:  
  - *δ* increases → require justification (e.g., base rate differences, harm reduction)  
  - *δ* decreases → permit unless net harm rises substantially."*  
  - **Clause (Multi-Group Tracking)**: Motivated by your population-partition concern.  
  - **Clause (Disparity Direction)**: Motivated by Case 5 (widening gap acceptable if harm falls).  
  - **Abandons**: Case 6 (if hitting FPR parity increases harm for a group, DHE rejects it unless the alternative widens δ more severely).  
  - **Eviction Case**: Monitor denial-rate disparities by precinct/age. If a low-eviction precinct gets disproportionate aid (high false positives), investigate but allow if overall evictions drop.  
  - **Test Case**: *Predictive Policing*: Patrol allocation reduces citywide crime but increases focus on Neighborhood Z (high-risk, predominantly Group P). Disparity in stops rises for Group P.  
    **DHE Verdict**: Accept if citywide harm drops and Group P’s absolute victimization falls, despite increased stop disparity.  

  ---

  ### **Which Partition for Fairness?**  
  **Answer**: None universally. Your verdicts implicitly prioritize **who bears the harm** (e.g., north-side residents victimized by re-arrests) over abstract group parity. Demand vendors:  
  1. **Map harm flows**: Show how errors (FP/FN) impact subgroups (precincts, ages).  
  2. **Justify partitions**: Explain why tracked groups (e.g., county-defined races) are proxies for harm-bearing entities.  
  3. **Sensitivity analysis**: Test fairness metrics across *all* policy-relevant splits (precinct, income, age).  

  ---

  ### **The Core Insight**  
  Your judgments consistently prioritize:  
  - **Harm type over parity**: False detentions (concrete injury) > unnecessary aid (no injury).  
  - **Harm reduction over equalization**: A model that helps all groups (Case 5) beats one that achieves parity by harming one group (Case 6).  
  - **Historical context**: Legitimacy of past systems (Case 7) and corrupted labels (Case 4) override mechanical fairness.  
  **Thus**: *No group-level criterion alone captures this*. Instead, demand vendors:  
  - Quantify **absolute harm reduction** vs. the replaced system.  
  - Disclose **harm distribution** across impacted subgroups.  
  - Explain why their chosen fairness metric aligns with the **primary injury** in context.  

  This shifts focus from "which side of the theorem" to "whose harm matters most"—a question only your community can answer, but one vendors must illuminate.
