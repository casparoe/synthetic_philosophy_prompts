answer: |-
  Here’s a structured 90-minute session plan for your philosophy group, prioritising conceptual clarity on **lexical threshold negative utilitarianism (LTNU)** with a focus on the per-episode threshold. Uses British English throughout.

  ---

  ### **Session Structure: 90 Minutes**  
  **Core Goal:** *Show that LTNU is defined by an episodic lexical threshold, not "pain matters more" or lifetime aggregation.*

  #### **1. Foundation: Classical Utilitarianism Refresher (10 mins)**  
     - **Why start here?** Establishes the baseline aggregative model.  
     - **Whiteboard:** Draw a single scale with "−10" (extreme pain) to "+10" (extreme pleasure).  
     - **Key point:** All experiences are *commensurable*; trade-offs are additive.  
     - **Example:** *1 person suffers −8 pain for 1 hour* vs. *8 people enjoy +1 pleasure for 1 hour*.  
       → Classical utilitarianism permits the trade.  
     - **Park:** Rights, desert, existence questions. State: "We’re isolating the aggregation mechanic today."

  #### **2. Problem Case: Asymmetry of Pain/Pleasure (15 mins)**  
     - **Why now?** Reveals where classical aggregation *feels* inadequate, priming the need for a threshold.  
     - **Case Study:** **Cluster Headache Episode** (concrete, clinical, avoids torture/dust specks tropes).  
       - *Scenario A:* One person endures **1 hour of cluster-headache-level pain** (−9).  
       - *Scenario B:* A million people experience **1 minute of mild pleasure** (+0.5) (e.g., tasting chocolate).  
     - **Group discussion:** "Would you accept Scenario B to prevent Scenario A?"  
       - **Anticipated reactions:**  
         - EA folks: "Never trade severe suffering for pleasure."  
         - GP: "Clinically, pain above a certain intensity is non-negotiable."  
         - Others: Unease about aggregation.  
     - **Key insight:** Some pains seem to *dominate* any amount of pleasure. But is this about weight or structure?  

  #### **3. Introduce Lexical Dominance (20 mins)**  
     - **Why here?** Distinguishes *ordering* from *weighting*.  
     - **Whiteboard:** Add a **threshold line** (e.g., at −7) splitting the scale.  
     - **Define:**  
       1. **Lexical dominance:** Any suffering above the threshold (−7 or worse) *cannot* be outweighed by *any finite amount* of sub-threshold pleasure/pain.  
       2. **Sub-threshold:** Ordinary aggregation applies (e.g., −6 pain can be offset by +6 pleasure).  
     - **Emphasise:** "Lexical" means *priority ordering*, not "infinite weight". Use analogy:  
       - Dictionary order: "Catastrophe" comes before "Catafalque" regardless of later letters.  
     - **Misconception pre-empted:**  
       - "Lexical dominance ≠ infinite weight." *Explain:* Infinite weight implies no trade-offs *ever*; LTNU allows them *below* the threshold.  

  #### **4. The Crucial Move: Per-Episode Threshold (20 mins)**  
     - **Why now?** The fork where LTNU becomes distinct.  
     - **Case Study:** **The Thousand Migraines** (prevents totalling misconception).  
       - *Scenario:* 1,000 people each endure **1 hour of pain at −6.9** (just below threshold).  
       - *Choice:* Prevent these vs. provide 1 billion people 1 hour of +1 pleasure.  
     - **Group debate:** "Does the *total* suffering matter? Or each episode’s intensity?"  
       - **LTNU answer:** Below-threshold suffering aggregates. Trade *is* permissible.  
       - **Contrast:** A *single* −7.1 pain episode could *not* be traded for any pleasure.  
     - **Key analogy:** "1,000 short people don’t sum to one tall person. Suffering doesn’t ‘stack’ over the threshold."  
     - **Pre-empt:** "This isn’t negative utilitarianism (NU). NU forbids *all* pain-for-pleasure trades. LTNU allows sub-threshold trades."  

  #### **5. Diagnosis & Common Misconceptions (15 mins)**  
     Address these **as they arise** or **pre-emptively**:  
     | **Misconception**               | **When to Address**          | **Response**                                                                 |  
     |---------------------------------|------------------------------|------------------------------------------------------------------------------|  
     | "LTNU = NU with dial turned up" | After introducing threshold  | "NU bans *all* pain/pleasure trades. LTNU allows sub-threshold aggregation." |  
     | "Mild pleasures are worthless"  | During Case Study (Sec 4)    | "They still matter below the threshold! They just can’t touch supra-threshold pain." |  
     | "Vague threshold → collapse"    | During Q&A                   | "Agree thresholds are fuzzy (like ‘tall’). But we use clinical proxies (e.g., pain needing emergency intervention)." |  
     | "Anti-natalism/ending the world"| **Defer to end**            | "Park this! LTNU doesn’t *require* extinction. We’re focusing on trade-offs."|  
     | "Pain is unmeasurable"          | If raised                   | "We’re using ordinal rankings (worse/better pain), not cardinal measurements." |  

  #### **6. Check for Understanding: Diagnostic Case (10 mins)**  
     - **Scenario:**  
       - *Option A:* Prevent **one episode of −7.1 pain** (above threshold).  
       - *Option B:* Prevent **10,000 episodes of −6.9 pain** (below threshold).  
     - **Question:** "Which does LTNU prioritise? What would classical util or NU say?"  
       - **Correct LTNU:** Option A (lexical dominance).  
       - **Classical util:** Compares totals (−7.1 vs. −69,000) → Option B.  
       - **Negative util:** Both involve suffering → May prioritise Option B (greater reduction).  
     - **Why it works:** Isolates the lexical/per-episode mechanic. If someone says "A is worse pain so it matters more", they’ve missed the structural point.  

  #### **7. Explicit Exclusions (State upfront)**  
     - **Formal lexicographic orderings:** "We’re focusing on intuition, not math."  
     - **Measurement theory:** "We’ll use rough ordinal rankings, not precise units."  
     - **Neuroscience of pain:** "Proxy thresholds (e.g., ‘pain requiring hospitalisation’) suffice today."  
     - **Anti-natalism/other NU implications:** "This is about trade-offs, not existence values. Park it for another day!"  

  ---

  ### **Why This Sequence Works**  
  1. **Builds stepwise:** Starts with familiar aggregation (Step 1), reveals its limits (Step 2), introduces threshold as ordering (Step 3), then isolates per-episode logic (Step 4).  
  2. **Uses concrete cases:** Medical examples satisfy the GP; cluster headaches avoid torture/dust specks fatigue while making the same point.  
  3. **Pre-empts derailments:** Deals with "infinite weight" early; defuses anti-natalism; uses clinical pain as a threshold proxy to sidestep measurement debates.  
  4. **Diagnostic case** forces distinction between LTNU, classical util, and NU.  

  **Final tip:** When stating exclusions, write them on the whiteboard as "Parked Questions" – it validates concerns while keeping focus. Good luck!
