answer: |-
  ### Procedure: Coherence Review of Risk Register Submissions

  #### **Introduction**
  This procedure checks the **coherence** of probability submissions (degrees of belief) using the Dutch book argument. Coherence ensures no combination of bets at your stated odds guarantees a loss (a "sure loss"). It does **not** assess accuracy, calibration, or realism. The procedure handles rounding, ranges, unresolved events, joint submissions, and mid-quarter revisions. A materiality threshold (1% of stake) ignores negligible losses. Where coherence fails, the issue is escalated to the **Modelling Lead** (Dr. Aris Thorne) for values/modelling decisions. The **Chief Risk Officer** (CRO) must resolve overrides when numbers are coherent but implausible.

  ---

  ### **Step-by-Step Procedure**

  #### **Step 1: Preprocessing & Initial Checks**
  - **Actions**:
    1. Convert all probabilities to decimals (e.g., 5% → 0.05).
    2. For ranges (e.g., "10–20%"), use the **midpoint** (e.g., 0.15) for initial checks. Retain min/max bounds.
    3. Flag events marked "unresolvable" (e.g., "regulatory change by 2030" with no closure trigger).
  - **Pass Criteria**:
    - All probabilities ∈ [0, 1].
    - No duplicate events within a single team’s submission.
  - **Reject Outright If**:
    - Any probability ∉ [0, 1].
    - Duplicate events in a team’s submission (e.g., two entries for "flood at Site X").
  - **Escalate to Modelling Lead If**: Events lack resolution conditions (e.g., "political intervention" undefined).

  #### **Step 2: Single-Team Coherence**
  - **Actions**:
    1. **Partitions**: For mutually exclusive & exhaustive event sets (e.g., "flood", "drought", "no disaster"), ensure probabilities sum to 1. Apply rounding tolerance:  
       - Tolerance = 0.025 (if rounded to 5%) or 0.005 (if to 1%).  
       - Pass if sum ∈ [0.975, 1.025] for 5% rounding.
    2. **Conditional Probabilities**: For \(P(A|B)\):  
       - If \(P(B) = 0\) (or range includes 0), reject \(P(A|B)\) unless justified by team.  
       - Verify \(P(A \cap B) = P(A|B) \times P(B)\) (with rounding tolerance).
    3. **Inequality Checks**: For linked events:  
       - \(P(A) \leq P(A \lor B)\) (e.g., \(P(\text{flood at X}) \leq P(\text{flood at X or Y})\)).  
       - \(P(A \cap B) \leq \min(P(A), P(B))\).
  - **Pass Criteria**: All checks satisfied within tolerance.
  - **Reject Outright If**: Partition sums outside tolerance or \(P(A|B)\) provided when \(P(B) = 0\).
  - **Escalate to Modelling Lead If**: Teams decline to justify internal inconsistencies (e.g., "no comment" on \(P(A) > P(A \lor B)\)).

  #### **Step 3: Cross-Team Event Matching**
  - **Actions**:
    1. Group identical events across teams (e.g., "river gauge > 5m at Site X").
    2. For each event, calculate min/max probability across all teams.
  - **Pass Criteria**: \(\text{max} - \text{min} \leq 0.05\) (5% tolerance for rounding/ranges).
  - **Escalate to Modelling Lead If**: \(\text{max} - \text{min} > 0.05\) (e.g., Team A: \(P(\text{gauge breach}) = 0.3\), Team B: \(0.5\)).

  #### **Step 4: Joint Coherence (Cross-Team Logic)**
  - **Actions**:
    1. **Logical Constraints**: Use predefined relationships (e.g., "flood at X" → "gauge breach at X", implying \(P(\text{flood}) \leq P(\text{gauge breach})\)).  
       - *Modelling Lead must pre-approve constraints.*
    2. **Range Handling**: For inequalities, test worst-case scenarios:  
       - E.g., For \(P(A) \leq P(B)\), use max \(P(A)\) and min \(P(B)\).
    3. **Mid-Revision Check**: Compare current submissions with **last quarter’s register**. Flag changes > 0.1 without justification (e.g., \(P(\text{outage})\) was 0.2, now 0.4).
  - **Pass Criteria**: All constraints hold with materiality loss ≤ 1% (see *Materiality Calc* below).
  - **Escalate to Modelling Lead If**: Violations persist after worst-case range tests or mid-revision gaps.

  #### **Step 5: Dutch Book Detection**
  - **Actions**:
    1. **Arbitrage Check**: For identical events (Step 3), compute guaranteed loss:  
       - Loss = \(|P_{\text{team1}} - P_{\text{team2}}|\) (per unit stake).  
       - *Example: Team A: \(P=0.6\), Team B: \(P=0.7\) → Loss = \(|0.6-0.7| = 0.1\) (10%)*.
    2. **Combo Bets**: For logically related events, identify "dutchable" sets:  
       - E.g., \(A\), \(B\), \(A \lor B\) with \(P(A) + P(B) < P(A \lor B)\).
       - Calculate max guaranteed loss (see *Materiality Calc*).
  - **Materiality Calc**:
    - Loss = \(| \text{stake} \times \text{violation gap} |\).  
    - Ignore if loss ≤ 0.01 (1% of stake).  
    - *Example: For stake = £1000, ignore losses ≤ £10.*
  - **Escalate to Modelling Lead If**: Loss > 0.01 after adjusting for ranges.

  #### **Final Approval**
  - **Approve If**: All steps passed.
  - **Reject If**: Unresolved rejects from Steps 1–2.
  - **Modelling Lead Decides On**: All escalated items (values, ranges, unresolved events).

  ---

  ### **What This Procedure Cannot Do**
  1. **Not a truth test**: Coherent probabilities can be absurd (e.g., \(P(\text{snow in Sahara}) = 0.9\)).
  2. **Not a calibration test**: Does not assess if \(P=0.3\) events happen 30% of the time.
  3. **Range limitations**: May miss "hidden" incoherence within ranges (e.g., min/max bounds coincidentally coherent).
  4. **Incomplete constraints**: Relies on predefined logic. New relationships may create undetected dutch books.
  5. **Unresolved events**: Bets on "unresolvable" events cannot be settled, limiting checks.

  ---

  ### **Worked Examples**

  #### **Example 1: Joint Incoherence (Passes Steps 1–2, Fails Step 5)**
  - **Team A (Flood Team)**:  
    \(P(\text{flood at X}) = 0.4\)  
    \(P(\text{flood at Y}) = 0.3\)  
    \(P(\text{flood at X or Y}) = 0.8\) → *Coherent (0.4 + 0.3 = 0.7 ≤ 0.8)*.
  - **Team B (Gauge Team)**:  
    \(P(\text{gauge > 5m at X}) = 0.35\) → *Implies flood at X if breached*.  
    *Logical constraint (Modelling Lead pre-approved):*  
    \(\text{gauge breach} \rightarrow \text{flood}\), so \(P(\text{gauge breach}) \leq P(\text{flood})\).
  - **Joint Check**:
    - \(P(\text{flood at X}) = 0.4\) (Team A) vs. \(P(\text{gauge breach}) = 0.35\) (Team B) → Passes Step 3 (gap = 0.05 ≤ 0.05).
    - But \(P(\text{gauge breach}) = 0.35 < P(\text{flood at X}) = 0.4\) → Satisfies inequality.
  - **Dutch Book**:  
    - Bet £100 against flood at X with Team A (at odds \(\frac{1-0.4}{0.4} = 1.5:1\)).  
      - Cost = £100; payout if no flood = £150.  
    - Bet £100 on gauge breach with Team B (at odds \(\frac{1}{0.35} ≈ 2.86:1\)).  
      - Cost = £100; payout if breach = £286.  
    - Outcomes:  
      - **Gauge breach & flood**: Lose £286 (gauge bet) - Gain £150 (flood bet) = **-£136**.  
      - **Gauge breach & no flood**: Gain £286 - £150 = **+£136** → *Impossible (breach → flood)*.  
      - **No breach & no flood**: Gain £150 - £100 = **+£50**.  
    - **Guaranteed loss in flood state**: £136 (13.6% of stake).  
  - **Result**: Escalate to Modelling Lead (loss > 1%).

  #### **Example 2: Rounding Mimicking Incoherence (Falsely Fails Step 2)**
  - **Team C (Power Team)**:  
    \(P(\text{outage} \mid \text{flood}) = 0.55\) (true value 0.53, rounded to 5%).  
    \(P(\text{flood}) = 0.40\) (true value 0.42).  
    \(P(\text{outage} \cap \text{flood}) = 0.25\) (true value \(0.53 \times 0.42 = 0.2226\), rounded to 25%).
  - **Conditional Check**:  
    \(P(\text{outage} \cap \text{flood}) = 0.25\) vs. \(P(\text{outage} \mid \text{flood}) \times P(\text{flood}) = 0.55 \times 0.40 = 0.22\).  
    Gap = \(0.25 - 0.22 = 0.03\) → Fails Step 2 (outside 0.025 tolerance).
  - **Range Test (Step 4)**:  
    - \(P(\text{outage} \mid \text{flood})\) range = [0.525, 0.575] (5% rounding).  
    - \(P(\text{flood})\) range = [0.375, 0.425].  
    - Min product = \(0.525 \times 0.375 = 0.196\).  
    - Max product = \(0.575 \times 0.425 = 0.244\).  
    - Actual \(P(\text{outage} \cap \text{flood}) = 0.25\) is within [0.196, 0.244]? → **No (0.25 > 0.244)**.  
  - **Materiality Calc**:  
    - Worst-case loss = \(|0.25 - 0.244| = 0.006\) (0.6% of stake) < 1%.  
  - **Result**: Pass (loss below materiality).

  #### **Example 3: Coherent but Absurd (Passes All Steps)**
  - **Team D (Controversial Team)**:  
    \(P(\text{alien invasion}) = 0.8\)  
    \(P(\text{no alien invasion}) = 0.2\) → Sums to 1 (passes Step 2).  
    *No cross-team dependencies (passes Steps 3–5)*.
  - **Reviewer Assessment**:  
    - Passes coherence checks.  
    - But deemed absurd by all reviewers.
  - **Action**:  
    - **CRO override** on grounds of implausibility.  
    - *Procedure clarifies it cannot challenge accuracy, only coherence.*

  ---

  ### **Summary**
  This procedure detects Dutch book vulnerabilities while tolerating rounding, ranges, and minor losses. It requires Modelling Lead input for logical relationships and unresolved events. The CRO retains authority to override coherent but implausible submissions. **Remember: Coherence ≠ correctness.**
