  Below is the analysis structured as requested, applying your framework to the Vietnam escalation (1964-1968) and evaluating the dollar auction analogy. Historical interpretations are synthesized from mainstream scholarship (e.g., Logevall, Herring, VanDeMark).

  ### Table 1: Vietnam Episode Features Mapped to Auction Mechanisms
  | Feature                 | Players & Options                                                                 | Mechanism | Verdict          | Why (2 Sentences)                                                                 |
  |-------------------------|-----------------------------------------------------------------------------------|-----------|------------------|----------------------------------------------------------------------------------|
