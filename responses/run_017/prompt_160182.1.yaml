  | **Staged Bombing (Rolling Thunder)** | Players: LBJ Admin/NSC (bidder) vs. Hanoi/NLF (counter-bidder).<br>Options: Escalate/de-escalate bombing or pause. | B         | Partly Explains  | Each incremental escalation (e.g., adding targets) was justified as a "small" additional bid to protect prior investments (aircraft, pilots, credibility) and coerce concessions (B). But Hanoi's counter-bids (infiltration, AA) exploited asymmetric stakes (C). |
  | **Pauses as Signals**   | Players: LBJ Admin (signaler) vs. Hanoi (receiver).<br>Options: Halt bombing to induce talks or maintain pressure. | C         | Explains         | Pauses tested Hanoi's resolve (rational learning). Lack of reciprocal de-escalation signaled Hanoi's high commitment (C), paradoxically justifying *further* US escalation to avoid "wasting" pause opportunity. |
  | **Troop Requests (1965-67)** | Players: Military (bidder) vs. LBJ/McNamara (auctioneer/bidder).<br>Options: Approve troops/reject/compromise. | B         | Explains         | Each troop surge was framed as marginal cost to prevent collapse of prior investments (lives, equipment, reputation). "Protecting the boys already there" (B) overrode strategic doubts. |
  | **Body Counts as Metric** | Players: Military (bidder) vs. Civilian Leaders (auctioneer).<br>Options: Trust metrics or question validity. | A         | Partly Explains  | Emphasizing body counts let leaders "justify" escalating costs (A) by showing "progress." But it also served marginal logic (B) – higher counts "proved" added troops were "working," protecting prior deployments. |
  | **Tet Offensive (1968)** | Players: US Public/Media (new bidder) vs. LBJ Admin (defensive bidder).<br>Options: Double down or de-escalate. | D         | Explains         | Tet shattered the illusion of progress, making identity/face (D) paramount. Escalation (e.g., Westmoreland's 206K request) aimed to avoid being the "sucker," but public refusal to bid further forced de-escalation. |
  | **Bombing Halt/De-escalation** | Players: LBJ (quitter) vs. Nixon/Hanoi (residual bidders).<br>Options: Stop bombing or persist. | Silent    | Misdescribes     | No "refund" occurred; costs remained sunk. Exit was driven by loss of domestic bidding partners (public/Congress), not auction logic. Credibility (see below) was "salvaged" via Vietnamization, not recovered. |
  | **Credibility Argument** | Players: US Global Strategy (meta-bidder) vs. Adversaries (observers).<br>Options: Withdraw and risk dominoes or persist. | B/C       | Partly Explains  | Framed credibility as a massive prior "stake" requiring protection via marginal bids (B). Adversaries' actions (e.g., USSR probing Berlin) provided "evidence" (C) that quitting would invite challenges elsewhere. |

  ### Table 2: Mechanism Signatures & Tests
  | Mechanism | Signature (If This Dominates)                                                                 | Separating Test                                                                                           | Verdict from Case     |
  |-----------|------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|-----------------------|
  | **A: Sunk Cost** | Escalation justified by "honoring" past sacrifices. Rhetoric focuses on sacrifices *already made*. | Coin-flip: Players reject fair exit to avoid admitting prior bids were wasted. Predicts escalation even when marginal costs exceed prize value. | **Unsupported**       |
  | **B: Marginal Calculus** | Decisions framed as small, necessary risks to protect larger prior commitments. Focus on *future* losses if stopping. | Coin-flip: Players reject fair exit because their *current* stake exceeds the prize. Predicts escalation only if prior bids are large and salvageable. | **Supported** (Primary) |
  | **C: Rational Learning** | Escalation driven by updating beliefs about opponent's resolve/costs. New bids "test" or respond to signals. | Coin-flip: Players reject fair exit if opponent's behavior signals low resolve (C). Predicts responsiveness to new information (e.g., pauses, Tet). | **Supported**         |
  | **D: Face/Identity** | Escalation to avoid humiliation or status loss. Rhetoric invokes reputation, pride, or audience judgment. | Coin-flip: Players reject fair exit if audience is watching. Predicts de-escalation when audiences change (e.g., Tet shifted US public). | **Supported**         |

  ### JSON Analysis
  ```json
  {
    "best_single_mechanism": "B (Marginal Calculus). Each escalation step (troops, bombing) was presented as a limited, necessary investment to protect larger prior commitments—lives, equipment, and credibility—creating a self-reinforcing trap where the immediate cost of quitting always appeared catastrophic.",
    "where_the_analogy_breaks": "The prize is undefined and non-fungible (credibility ≠ a dollar), exit is non-terminal (withdrawal took years and left costs unrecovered), and third parties (US public, global allies) dynamically alter the auction's stakes and bidding pool. War lacks a clear 'second-highest bidder' refund rule.",
    "is_it_more_than_a_metaphor": "Yes, but only for bureaucratic decision-making, not grand strategy. The analogy explains tactical escalations (e.g., troop surges) via mechanisms B/C/D, but fails to model political tipping points (Tet) or the role of non-player audiences.",
    "confidence": 0.7
  }
  ```

  ### Key Insights from Mapping
  1. **Sunk Cost (A) is Weak**: Escalation documents (e.g., McNamara memos) emphasize *future* credibility dominoes (B) and learning from enemy signals (C), not "wasted" prior costs. Your coin-flip test aligns—players escalated to avoid *imminent* loss, not rationalize past bids.
  2. **Marginal Calculus (B) Dominates**: LBJ described troop decisions as "choosing between terrible alternatives" to prevent collapse. Like your auction players protecting their "stake," each escalation aimed to salvage prior investments, not justify them emotionally.
  3. **Credibility ≠ Prize, It's a Stake**: The credibility argument inflated the *stakes*, not the prize. Protecting global credibility (B/C) made the cost of quitting seem infinite, justifying endless marginal bids—until Tet revealed the US public was no longer a bidder.
  4. **Concorde is Misleading**: As you suspect, Concorde involved jobs, treaties, and *recoverable* prestige (D/B)—closer to Vietnam's credibility stakes than textbook sunk costs. The model is silent when "prizes" are symbolic or multi-actor.

  ### Why the Analogy Fails Strategically
  The dollar auction assumes rational, bilateral bidding on a fixed prize. Vietnam featured:
  - **Illusory Prizes**: "Victory" meant preserving South Vietnam *and* US credibility—neither fixed nor agreed upon.
  - **Asymmetric Exit Costs**: US withdrawal damaged credibility; Hanoi losing meant national annihilation.
  - **Audience Effects**: The US public entered as a bidder post-Tet, forcing de-escalation despite elite preferences (D).
  - **No Auctioneer**: Congress granted credit initially but couldn't enforce rules or end bidding.

  Your instinct is correct: escalation is less about sunk costs (A) than the marginal trap (B) and face-saving (D), amplified by learning (C). The coin-flip test—rejecting fair settlement to avoid being the "sucker"—captures Vietnam's core pathology better than textbook models.
