prompt: |-
  hi — I'm in a second year module on ethics and public policy (lots of cost-benefit analysis, QALYs, that sort of thing) and my essay is on whether, and when, a huge number of very tiny harms to different people can outweigh one severe harm to one person. Before I start marking theories against each other I want the spec, because everyone in the literature seems to argue from one favourite case and I'd rather have the full list of demands up front.

  So: write me the desiderata that any theory of aggregating small harms has to meet, with the case or the consideration behind each requirement, and say why each one is a requirement rather than a prejudice.

  Fix the job first so adequacy has something to be relative to: the theory is for someone who actually has to decide — say a regulator or a hospital ethics committee weighing a policy that imposes a really small cost on millions of people against one that imposes a serious cost on a handful. So it has to be action-guiding when the numbers are only known imprecisely, it has to be statable in a page for people who aren't philosophers, and it can't just hand back "it depends" or require settling all of population ethics before it says anything.

  Cases I want requirements tied to (swap in your own if one is doing the same work):
  - the original: some absurdly large number of people each get a speck of dust in the eye, versus one person tortured for decades
  - the intra- and interpersonal continuum: all the specks in one person's eye, versus one each, versus a million people getting a million each — I want to know where the theory draws the line and whether it can draw it without a cliff
  - the harm nobody ever notices: a tiny cost that no subject experiences or could experience, and a tiny risk increment that never materialises for anyone
  - the many-hands case: no single agent imposes the whole harm, a million people each do a millionth of it
  - mundane versions, because the specks example is doing something weird: an extra three-second unskippable advert before 200 million streams, or one extra second of queueing for fifty million people — is that a rights violation, a minor cost, or the same problem in a costume?
  - the net-wash case: each tiny harm arrives paired with a tiny benefit, to the same people, versus the harms and benefits landing on different people
  - the ex ante version: no one is certain to be badly hurt, everyone just faces a one-in-a-million chance of the severe harm

  Also: tell me which requirements are non-negotiable and which are just what one camp happens to like, tell me which single requirement knocks out the most candidates, and — the bit I care most about — flag any pair or triple you think can't be jointly satisfied and say which one you'd drop and what it costs you. I have a feeling "no sharp threshold" and "harms to different people don't sum the way harms to one person do" come apart somewhere along that continuum, but you tell me. And please separate the genuine desiderata from things people smuggle in as if they were desiderata — "obviously enough small harms add up to something big" is the conclusion, not the standard.

  Short scorecard at the very end if you like, few lines each, for: straight additive total utilitarianism; a rights or threshold view where harms below some level of severity just can't be traded up; and a view where each person's complaint gets weighed against the severe harm separately. Don't spend the words there — the criteria are the part I'm being marked on. A table is fine.
reasoning: |-
  Okay, the user is in a second-year Ethics and Public Policy module focusing on cost-benefit analysis and QALYs. Their essay topic is about whether numerous tiny harms to different people can outweigh one severe harm to one person. They need desiderata—clear criteria any aggregation theory must meet—tied to specific cases. Let me start by understanding their main request.

  First, they want a list of requirements, each grounded in a case, explaining why it's necessary. They mentioned several cases: the dust speck vs. torture, intra/interpersonal continuum, unnoticed harms, many-hands, mundane versions, net-wash, and ex ante risks. The theory must be practical for decision-makers like regulators, so it needs to be action-guiding, simple, and not require solving all of population ethics.

  I need to identify core desiderata. The key is to avoid biases and ensure each requirement is justified by a specific problem. For example, the Speck/Torture Intuition addresses the common rejection of pure aggregation in extreme cases. The Continuum Requirement tackles thresholds and cliffs, which is crucial for policy where numbers aren't precise. The Imperceptibility Challenge deals with harms so small they're unfelt, questioning if they count at all.

  Then there's the Many-Hands Problem, where distributed responsibility complicates moral assessment. Mundane Realism tests if the theory applies to everyday scenarios without overmoralizing. Net-Wash Asymmetry examines whether offsetting benefits change the moral weight. Ex Ante Fairness considers risk distributions, which is common in policy decisions like safety regulations.

  The user also wants to know which desiderata conflict. For instance, Continuum (no sharp thresholds) might clash with Complaints Separability, which treats interpersonal and intrapersonal aggregation differently. If a theory avoids cliffs, it might struggle to explain why many tiny harms don't sum like intrapersonal ones. This conflict could force choosing between intuitive aggregation limits and theoretical consistency.

  Non-negotiable desiderata would be those essential for any plausible theory, like Speck/Torture Intuition and Action-Guidance. Without these, the theory either leads to counterintuitive results or isn't useful. Strongest knockout might be Imperceptibility - if a theory counts unfelt harms, it faces the problem of demanding excessive sacrifices for negligible gains.

  For the scorecard, I'll evaluate utilitarianism, threshold views, and complaints separability against the desiderata. Utilitarianism fails Speck/Torture and Imperceptibility but excels in others. Threshold views handle Speck/Torture and Imperceptibility but struggle with Continuum and Mundane Realism due to cliffs. Complaints separability avoids summing small harms but falters on Many-Hands and Ex Ante fairness.

  The user's deeper need is a structured framework to critique existing theories, highlighting trade-offs. They want to avoid ad-hoc arguments by having clear criteria. Emphasizing conflicts between desiderata, like Continuum vs. Complaints Separability, shows where theories must compromise. This helps them analyze which trade-offs are acceptable in their essay.
answer: |-
  Here are the core desiderata for a theory aggregating small harms, derived from your cases and the practical constraints of a decision-maker. Each is justified as a requirement based on avoiding specific failures in reasoning or application, not mere philosophical preference. Conflicts are highlighted.

  **Core Desiderata (Action-Guiding & Case-Based):**

  1.  **The Speck/Torture Intuition (Non-Negotiable):**
      *   **Case:** Absurdly large number of people get a dust speck in their eye vs. one person tortured for decades.
      *   **Requirement:** The theory must *not* conclude that the specks outweigh the torture, no matter how large the number of specks (within plausible bounds). It must respect the moral priority of preventing severe suffering.
      *   **Why Requirement, Not Prejudice:** This captures a fundamental limit on aggregation widely shared across moral frameworks (deontological, rights-based, even many consequentialist). A theory violating this is radically counterintuitive and likely practically unacceptable (e.g., justifying torture for trivial benefits). It ensures the theory doesn't allow "flattening" all harms into a single metric without regard to severity distribution.
      *   **Knocks Out:** Strict additive utilitarianism (without lexical thresholds).

  2.  **The Continuum Requirement (Avoiding Arbitrary Cliffs):**
      *   **Case:** Intrapersonal (one person gets all specks) vs. Interpersonal (many people get one speck each) vs. Intermediate (some people get many specks). Where does aggregation "kick in"?
      *   **Requirement:** The theory must provide a *principled* account of how harms aggregate across different distributions (within one life vs. across lives, and varying numbers of harms per person). It should avoid sudden, unexplained "cliffs" where a tiny change (e.g., one more person harmed, one more speck per person) flips the moral verdict drastically.
      *   **Why Requirement, Not Prejudice:** Policy decisions involve imprecise numbers and continuous variables (costs, risks). A theory with sharp, arbitrary thresholds would be unworkable and potentially unfair in practice (small measurement error leads to vastly different outcomes). It demands internal consistency.
      *   **Conflict Alert:** Directly clashes with the intuition behind Complaints Separability (Desideratum 7) regarding *how* harms to different people sum vs. harms to one person.

  3.  **The Imperceptibility Challenge (Non-Negotiable for Pragmatism):**
      *   **Case:** Harms so tiny they are *never* experienced or noticed (e.g., imperceptible risk increment, unfelt psychological nudge, cost absorbed without awareness).
      *   **Requirement:** The theory must either (a) explain why such imperceptible "harms" genuinely count morally *and* how to weigh them practically, or (b) provide a clear, defensible reason why they do *not* count (or count significantly less).
      *   **Why Requirement, Not Prejudice:** Real-world policy analysis constantly deals with costs/risks below perceptual thresholds. A theory that counts them fully faces the "problem of the heap" infinitely (demanding impossible precision) and risks absurdity (e.g., halting civilization over unfelt costs). A theory dismissing them entirely needs to justify why they are irrelevant. Pragmatism demands a stance here.
      *   **Strongest Knockout:** This often sinks theories trying to strictly count imperceptible harms due to practical infeasibility and counter-intuitiveness.

  4.  **The Many-Hands Problem (Distributed Agency):**
      *   **Case:** A million agents each perform one-millionth of the action causing the severe harm to the one person (e.g., each contributes a tiny fragment of the torture device's operation).
      *   **Requirement:** The theory must give a coherent account of whether, and how, the aggregation of *individual agent contributions* (each tiny) relates to the assessment of the *overall harm*. Does the moral status of the act depend on how responsibility is distributed?
      *   **Why Requirement, Not Prejudice:** Many collective harms (pollution, market effects, systemic bias) result from distributed actions. A theory must guide individual agents and collective bodies in these contexts. Ignoring distribution risks absolving contributors; over-focusing on it risks paralysis ("my contribution is negligible").
      *   **Conflict Alert:** Tensions with Complaints Separability (Desid. 7) if individual complaints are assessed in isolation.

  5.  **Mundane Realism (Non-Negotiable for Applicability):**
      *   **Case:** An extra 3-second unskippable ad for 200M streams vs. one extra second of queueing for 50M people. Are these minor costs, rights violations, or equivalent to the "specks" problem?
      *   **Requirement:** The theory must be applicable to realistic, low-stakes policy choices without resorting to implausible moralization ("any tiny cost is a rights violation") or implausible dismissal ("no tiny cost matters"). It should differentiate between genuine harms and mere preferences.
      *   **Why Requirement, Not Prejudice:** This is the *actual domain* of regulators/committees. A theory failing here is useless. It tests whether the "specks" framing is a distracting artifact or reveals a deep structural issue in aggregation. Requires balancing moral seriousness with practical feasibility.

  6.  **Net-Wash Asymmetry (Loss Aversion/Non-Identity):**
      *   **Case:** (A) Each person suffers a tiny harm *and* receives a tiny benefit (net wash per person). (B) Some suffer tiny harms, others receive tiny benefits (net wash overall, but distributional effects).
      *   **Requirement:** The theory must explain if there's a moral difference between (A) and (B), and why. Does the pairing of harm/benefit *within* a life change the moral calculus compared to spreading harms and benefits *across* lives?
      *   **Why Requirement, Not Prejudice:** Tests core intuitions about compensation, fairness, and the separateness of persons. Many find (B) potentially problematic even if net-neutral, while (A) seems unproblematic. A theory needs a consistent account of why benefits "offset" harms and whether location matters.

  7.  **Ex Ante Fairness & Risk Aggregation:**
      *   **Case:** Policy exposes 1M people to a 1/1M risk of severe harm vs. policy imposing a certain tiny harm on 1M people. Or, distributing risk vs. distributing certain harm.
      *   **Requirement:** The theory must provide a morally defensible way to compare policies involving certain small harms vs. policies involving small risks of large harms. How does uncertainty factor into aggregation?
      *   **Why Requirement, Not Prejudice:** Risk assessment is fundamental to policy (environmental regulation, medical triage, safety standards). Requires integrating probability and the moral significance of ex ante perspectives (fairness in risk distribution).

  8.  **Action-Guidance Under Uncertainty (Non-Negotiable):**
      *   **Consideration:** Decision-makers have imprecise estimates of numbers affected and magnitudes of harm/benefit.
      *   **Requirement:** The theory must provide usable guidance even when numbers are known only within orders of magnitude or harm magnitudes are estimated ranges. It cannot require precise quantification to yield a verdict.
      *   **Why Requirement, Not Prejudice:** The core practical need. A theory demanding impossible precision is irrelevant to real decision-making. Forces the theory towards robustness and qualitative principles.

  9.  **Conceptual Parsimony & Communicability:**
      *   **Consideration:** Needs to be statable in ~1 page for non-philosophers.
      *   **Requirement:** Core principles and decision procedures must be relatively simple to articulate and apply without resolving all foundational issues in population ethics or meta-ethics.
      *   **Why Requirement, Not Prejudice:** Practical implementability. Ethics committees and regulators need tools, not treatises. Forces focus on essential structure.

  **Key Conflicts & Trade-offs:**

  1.  **Continuum vs. Complaints Separability (Your Hunch is Right):**
      *   **Conflict:** Complaints Separability (often tied to deontological views) treats the aggregation of harms *within* one life as fundamentally different (summing complaints) from aggregation *across* lives (each complaint weighed separately against the severe harm). This *creates* a cliff: moving a harm from one person to another drastically changes its moral weight in the aggregation against a severe harm. Continuum demands a smoother transition.
      *   **Trade-off:** Sacrificing Continuum allows Complaints Separability to respect Speck/Torture easily but makes the theory vulnerable to arbitrariness in defining the "person" boundary and handling intermediate cases. Sacrificing Complaints Separability makes it harder to definitively block the Speck/Torture conclusion without introducing thresholds (which then face the Continuum challenge).

  2.  **Imperceptibility vs. Additivity:**
      *   **Conflict:** Strict additivity implies *any* positive harm, no matter how tiny or imperceptible, counts. Imperceptibility challenges whether such harms *should* count or if counting them is feasible/meaningful.
      *   **Trade-off:** Dismissing imperceptible harms entirely (e.g., via a threshold) solves Imperceptibility but raises the Continuum problem (where's the threshold?) and potentially violates Mundane Realism if real but tiny *perceptible* harms also get dismissed. Counting them fully respects additivity but leads to practical paralysis and potential absurdity (Imperceptibility Challenge).

  **Non-Negotiables:** Speck/Torture Intuition, Action-Guidance Under Uncertainty, Mundane Realism, Conceptual Parsimony. (A theory failing these is either morally unacceptable or practically useless).

  **Strong Candidate Knockout:** The **Imperceptibility Challenge** is often the most fatal, as it exposes either practical unworkability or the need for a threshold that then triggers other problems (Continuum). The **Speck/Torture Intuition** is the most common theoretical knockout for pure aggregation views.

  **Theories Scorecard:**

  | Theory                         | Key Strength                          | Key Weaknesses Against Desiderata                                                                 | Overall Feasibility |
  | :----------------------------- | :------------------------------------ | :------------------------------------------------------------------------------------------------ | :------------------ |
  | **Additive Total Utilitarianism** | Simple, Action-Guiding (8,9), Handles Continuum (2), Net-Wash (6A/B), Ex Ante (7) easily. | **Fails Speck/Torture (1)** catastrophically. **Fails Imperceptibility (3)** (counts everything, impractical). Struggles with Mundane Realism (5) (over-moralizes?). Many-Hands (4) unclear. | Low (Fails core 1 & 3) |
  | **Threshold View** (Rights/Significance) | **Respects Speck/Torture (1).** May handle Imperceptibility (3) via threshold. Clear for Many-Hands (4) (if harm below threshold). | **Fails Continuum (2)** (sharp cliff at threshold). Struggles with Mundane Realism (5) (Is 3 secs above/below threshold?). Net-Wash (6B) may still be problematic. Defining threshold precisely for Action-Guidance (8) is hard. | Moderate (Core 1 & 3 OK, but 2 & 5 problematic) |
  | **Complaints Separability** (Pairwise Comparison) | **Respects Speck/Torture (1)** definitively. Handles Imperceptibility (3) easily (tiny harm creates tiny/zero complaint). Clear for Mundane Realism (5) (minor complaint vs. severe). | **Fails Continuum (2)** (cliff between intra/interpersonal). **Fails Many-Hands (4)** (individual contribution creates negligible complaint). **Fails Ex Ante (7)** (ex ante risk may not generate a comparable complaint). Net-Wash (6B) unclear. Action-Guidance (8) limited (always favors preventing severe harm?). | Low-Moderate (Strong on 1, weak on 2,4,7) |

  **Takeaway:** The core tension lies between the intuitive block on extreme aggregation (Speck/Torture) and the demand for non-arbitrariness across distributions (Continuum). Imperceptibility forces a choice between impracticality or thresholds. A viable theory likely needs a nuanced account of harm significance that isn't purely additive but avoids sharp deontological cliffs, potentially incorporating elements like prioritarianism, risk-weighted views, or context-sensitive thresholds – while remaining usable. Good luck with the essay!
