prompt: |-
  My reading group is doing a few weeks on classical Indian epistemology and I brought in an argument I've been chewing on for a while, and now I think it's broken but I can't find the break.

  Quick setup so you don't have to know the background. In Nyāya, a pramāṇa is a source of pramā — a genuine piece of knowledge, a cognition that gets its object right (seeing the shell as a shell, not seeing the shell as silver). The standard list has four: perception (pratyakṣa), inference (anumāna), comparison (upamāna), and testimony (śabda). And there's a big dispute about where a cognition's validity (prāmāṇya) comes from: Nyāya says validity is extrinsic (parataḥ) — a cognition is knowledge because of something other than itself, an excellence (guṇa) in the causal source that produced it — while the Mīmāṃsā school says validity is intrinsic (svataḥ), cognitions are valid on their own, and it's invalidity that needs an outside explanation. Nyāya actually holds that *both* validity and invalidity are extrinsic.

  Here's my argument.

  (1) For a cognition produced by source S to be knowledge, it isn't enough that the cognition is true and that S produced it. S has to actually be a reliable producer — a real pramāṇa, not a broken one. A damaged eye, a lying witness, a thermometer with a bias: those produce cognitions too.
  (2) Nyāya agrees in spirit: prāmāṇya is extrinsic. What makes a cognition knowledge is the excellence of its causal source, not the fact that it just showed up in your head. Validity isn't self-declaring.
  (3) So, before a cognition from S can count as knowledge, the excellence of S has to be established — by the subject, or at least in principle. Otherwise a true cognition from a defective source counts as knowledge and the whole distinction between pramā and a lucky guess collapses.
  (4) Whatever establishes S's excellence is itself a cognition produced by some further source S′ — normally an inference from S's track record, or from the fact that acting on S's outputs has worked out.
  (5) By (2), that cognition needs its own source's excellence established, so S″, and so on. That's the classic infinite regress (anavasthā). No chain ever completes, so (3) is never satisfied, so nothing is ever knowledge.
  (6) And note this doesn't just kill inference and testimony. It kills perception too, which Nyāya treats as the most basic pramāṇa of all: my visual cognition of the coffee mug needs the excellence of my eyes established, which needs an inference, which needs its own source established... The baseline case fails along with everything else.
  (7) But obviously we do know things, including by perception. So something in (1)–(3) has to go.

  The two escapes I've been offered both feel wrong to me.

  (8) Escape one: the regress only gets started when there's a live doubt; absent doubt, no certification is demanded, and ordinary cognitions are certified by successful action — you reach for the water and you get water. But the skeptic's whole move is to *make* the doubt live, and "no doubt, no need" seems to make whether you know depend on your temperament: the confident person knows, the anxious one doesn't. That looks like it proves too much in the other direction.
  (9) Escape two: go Mīmāṃsā, make validity intrinsic and only invalidity extrinsic. But then the shell-as-silver cognition is as good as knowledge until something corrects it, and the correction is itself a cognition that's valid on its own — so I don't see how error is ever coherently *detected* on that picture, and Nyāya's insistence that invalidity is also extrinsic starts to look like the more honest half of the view.

  A friend said this is just the Agrippan regress wearing Indian names and the answer is reliabilism: S can be reliable without the subject ever establishing that it is, and that's all knowledge requires. That feels close, because it makes me suspect (3) is where I smuggled in an epistemic demand — the subject must have checked — inside a premise that sounds like it's only about what *makes* a cognition valid. But if that's the fix, I don't see what the Nyāya versus Mīmāṃsā fight was even about in the first place, since on that reading everyone should just be an externalist and go home.

  So: which step do you reject, and what does rejecting it cost you? If I have to choose I'd much rather keep (1) and (7) than (3), but I can't see how to drop (3) without letting a stopped clock count as a pramāṇa whenever it happens to be right. Say which premise looked fine and why, and what I'm paying if I give it up.
reasoning: |-
  Okay, let me tackle this user's problem. They're in a reading group on classical Indian epistemology, specifically Nyāya vs. Mīmāṃsā on the source of cognition's validity. Their argument leads to an infinite regress, making knowledge impossible, which clashes with the obvious fact that we do know things. They've considered escapes but find them unsatisfied, and a friend suggested reliabilism as a solution. 

  First, I need to parse their argument step by step. Premise (3) seems crucial: it claims that for a cognition to be knowledge, the reliability of its source must be established, either by the subject or in principle. This introduces a justification requirement that triggers the regress. But Nyāya's extrinsic validity might not demand this level of subjective certification. 

  The user's friend mentioned reliabilism, which resonates here. Externalist views like reliabilism separate the conditions for knowledge from the subject's ability to verify those conditions. So Nyāya could hold that a source's excellence makes a cognition knowledge regardless of whether the subject has confirmed that excellence. For example, perception works reliably due to properly functioning senses, even if I haven't tested my eyesight. 

  But the user worries this might collapse the distinction between knowledge and lucky guesses. However, Nyāya can counter that reliability isn't about luck; it's about the causal process's actual excellence. A stopped clock is unreliable, so its rare correct time isn't knowledge, while a working clock's correct time is, due to its design. The subject doesn't need to know the design; the reliability is objective. 

  Looking at the Nyāya-Mīmāṃsā debate, their core disagreement remains. Mīmāṃsā's intrinsic validity means every cognition is presumed valid until proven otherwise, requiring external factors only for invalidity. Nyāya insists both validity and invalidity need external explanations—excellences or defects in the causal chain. The user's premise (3) imposes an internalist requirement on Nyāya's externalism, which is the real issue. 

  Dropping (3) doesn't make Nyāya internalist; it maintains their externalist stance. The cost is accepting that knowledge doesn't require the subject to certify their sources, which might feel uneasy but aligns with reliabilism. The user's fear about the stopped clock is addressed by emphasizing actual reliability over luck. 

  The user values (1) and (7), which can be kept. (1) emphasizes the need for a reliable source, not just truth. (7) acknowledges we have knowledge. By rejecting (3)'s demand for established reliability, the regress stops. Nyāya's extrinsic validity remains distinct from Mīmāṃsā's intrinsic view, preserving the debate's essence. 

  In essence, the break is in (3), where an internalist requirement sneaks into an externalist framework. Correcting that saves Nyāya from regress while keeping their core tenets intact.
answer: |-
  You've hit on a profound tension in Nyāya epistemology, and your breakdown is sharp. The break is in **premise (3)**. Here's the analysis, step by step:

  ### The Core Issue: Premise (3) Smuggles in Internalism
  **(3) "Before a cognition from S can count as knowledge, the excellence of S has to be established — by the subject, or at least in principle."**

  This premise demands **subjective or ideal justificatory access** to the source's reliability. Nyāya rejects this demand. Their extrinsic account of *prāmāṇya* is **externalist**, not internalist. The excellence (*guṇa*) of the causal source is what *makes* the cognition valid knowledge, but the *subject does not need to know or establish that excellence* for the cognition to *be* knowledge. Validity is conferred by the objective reliability of the causal process, not by the subject's awareness of that reliability.

  ### Why Rejecting (3) Doesn't Collapse Knowledge into Lucky Guesses
  Your worry about the stopped clock is understandable, but Nyāya has resources to address it:
  1.  **Actual Reliability vs. Accidental Truth:** A stopped clock is *not* a reliable source (*pramāṇa*). Its causal process (broken mechanism) lacks the *excellence* (*guṇa*) required to reliably produce true cognitions. When it happens to be right, the cognition is *true* but not *valid knowledge* (*pramā*), precisely because it lacks the necessary causal excellence.
  2.  **The Causal Story Matters:** Nyāya meticulously analyzes the causal conditions for each *pramāṇa*. For perception (*pratyakṣa*), valid cognition requires properly functioning senses (*indriyārthasannikarṣa*), absence of defects (*doṣarahita*), and favorable conditions. If your eyes are diseased, the resulting visual cognition is *invalid* (*apramā*), even if it happens to be true (e.g., you see a blurry patch that *is* actually a cow). The invalidity stems from the defect (*doṣa*) in the causal source. The clock lacks the causal excellence (*guṇa*) of a functioning timepiece.
  3.  **Reliabilism is the Key (as your friend suggested):** Nyāya is fundamentally a **reliabilist** theory of knowledge. Knowledge is a true cognition produced by a reliable process (*pramāṇa*). The reliability is an *objective feature of the world* (the causal process having the requisite *guṇa*), not a feature the subject must grasp. A "lucky guess" from a broken source lacks this objective grounding in reliability.

  ### What This Means for the Nyāya vs. Mīmāṃsā Debate
  Rejecting (3) *preserves* the core dispute:
  *   **Nyāya (Externalist Reliabilism):** Both validity and invalidity are extrinsic. Validity is conferred by the presence of excellence (*guṇa*) in the causal source; invalidity by the presence of a defect (*doṣa*). The subject doesn't need to certify the source.
  *   **Mīmāṃsā (Internalist Presumptionism):** Validity is intrinsic and presumed; only invalidity requires extrinsic explanation (a discovered defect). The subject *must* encounter a reason for doubt before validity is questioned.

  The fight is about **where the burden of proof lies and how error is possible**:
  *   Nyāya says: "A cognition is just a mental event. What makes it *knowledge* is that it was produced in the right way. What makes it *error* is that it was produced in a defective way. You need to look at the source for both."
  *   Mīmāṃsā says: "All cognitions present themselves as true. We accept them unless proven otherwise. Only error needs an external cause (a defect). Validity is self-evident."

  Rejecting (3) allows Nyāya to maintain its externalist, reliabilist stance without regress. The subject doesn't need to *establish* the source's excellence; the source *has* the excellence (or doesn't), and that objectively determines the cognition's validity.

  ### The Cost of Rejecting (3)
  1.  **Loss of Internalist Certainty:** Nyāya sacrifices the Cartesian ideal of subjective, indubitable certification of knowledge foundations. You can *have* perceptual knowledge without being able to *prove*, from the inside, that your senses aren't deceiving you *right now*. Your knowledge rests on the *actual* reliability of your cognitive faculties, which you might not be able to fully demonstrate without circularity or regress.
  2.  **Skeptical Pressure:** A determined skeptic can still ask, "But how do you *know* your senses/reasoning/etc. are reliable *in general*?" Nyāya's answer is ultimately pragmatic and defeasible: successful action (*pravṛtti-sāmarthya*) confirms the reliability of the *pramāṇas* over time. We *presume* their reliability to engage with the world, and this presumption is constantly tested and confirmed (or refuted in specific instances). This is a fallibilist, externalist response, not an internalist proof against skepticism.
  3.  **Distinction from Lucky Guesses Maintained:** As argued above, the distinction is preserved by the objective causal history. The stopped clock cognition lacks the causal excellence; the valid perceptual cognition has it.

  ### What Stays Intact
  *   **(1) & (2):** You keep the core Nyāya insight: True cognitions aren't automatically knowledge; they require production by an *excellent* source (*pramāṇa*). Validity is extrinsic.
  *   **(7):** Obviously, we know things.
  *   **(4), (5), (6):** The regress *would* follow *if* you accepted (3). Rejecting (3) stops it. Perception doesn't require prior certification; its validity is conferred by the functioning sense organs under appropriate conditions.

  ### Why the Escapes Feel Wrong (And Why Rejecting (3) is Better)
  *   **Escape 1 (Doubt-Triggered):** This is Nyāya's standard move, and rejecting (3) is its *foundation*. "No doubt, no need" works *because* validity is external. Doubt doesn't *create* the need to establish the source's reliability *as a condition for validity itself*; doubt simply prompts an inquiry to *discover* whether the objectively existing conditions for validity (*guṇa*) or invalidity (*doṣa*) were present. The confident person *can* know, and the anxious person *can* doubt valid cognitions, but the *actual validity* is determined externally. It avoids making knowledge purely temperamental.
  *   **Escape 2 (Go Mīmāṃsā):** As you rightly point out, this creates huge problems for explaining how error is detected. Nyāya's symmetric extrinsic view for both validity *and* invalidity is more coherent for an error-prone being. Rejecting (3) preserves this symmetry within an externalist framework.

  **Conclusion:** The break is in (3). Nyāya is an externalist, reliabilist theory. A cognition is valid knowledge (*pramā*) iff it is true *and* produced by a source (*pramāṇa*) possessing the requisite objective excellence (*guṇa*) in its causal operation. The subject does *not* need to establish this excellence for the cognition to *be* knowledge. The cost is accepting that knowledge rests on the objective reliability of our cognitive faculties, which we cannot indubitably certify from within our own perspective, and relying on pragmatic confirmation through successful action. This preserves the Nyāya-Mīmāṃsā debate's core while avoiding the regress and explaining the difference between knowledge and accidental true belief.
