prompt: |-
  I got into an argument about this at board game night and it's been bugging me since, so here goes. My roommate works on evals at one of the big labs and described their setup roughly like this: the scoreboard only ever looks at the final answer. If the system writes two pages of reasoning that is complete garbage and then puts down the right answer, it gets full marks; if it writes a beautiful derivation and fumbles the last digit, it gets zero. The reasoning trace isn't even part of what gets delivered to the customer — it's logged, and nobody reads it unless something is already going wrong. Two systems with identical accuracy, one with clean legible steps and one with nonsense in the middle, count as tied, and then you pick whichever is cheaper and faster. But the moment something does go wrong, or somebody suspects the system of scheming, everyone drops everything and demands to read the traces and grade individual steps in them. And then there's a third thing she said that I keep turning over: they won't train on that step-by-step score. The moment the process grade starts pushing on the weights, the reasoning becomes theater — it learns to write steps that read fine while the actual work happens somewhere you can't see. So the rule is: audit the reasoning, never optimize it. (She also admitted, when I pushed, that nobody can really check whether the trace is *why* the model did the thing, as opposed to a fluent story it produces afterwards that happens to sound right.)

  What makes it feel inconsistent to me is how differently we treat people in what looks like the same situation. My friend in med school says she gets marked down on oral exams for landing on the right diagnosis with no defensible route to it, and a resident who copies a correct answer gets in serious trouble even though the patient was fine. Judges reviewing a government agency will send a decision back because the agency didn't explain itself, even when nobody is claiming the outcome is wrong. A student who gets the right answer by working backwards from the answer key hasn't learned anything. So with humans we're officially process people: what matters is whether you followed a responsible procedure and could give reasons for what you did. With these systems we're outcome people — except during an incident, when we become hardcore process people for a week, and then we go build a process score that is specifically designed never to touch the thing being scored. I don't have the vocabulary for any of this so sorry if I'm describing it badly.

  I'm trying to write a short blog post and I keep going in circles. What does outcome-only scoring actually presuppose — about what a reason is, about what makes a performance good or a belief justified? Is it committed to saying the reasoning is just a causal step on the way to the answer, worth exactly its contribution to accuracy, or could someone who thinks having reasons is the whole point of a rational performance still sign off on it, maybe as a temporary compromise? Does the incident-time audit quietly concede something the first practice denies, or can the two be made to fit together? Does the "audit but never optimize" rule amount to anything more than pragmatism, or does it presuppose that a trace is more like testimony than like a skill, something that stops being evidence the moment you start grading it? And which parts of all this are genuinely forced by the underlying view rather than just convenient — cheap to measure, easy to compare across labs, avoiding the fact that human annotators disagree about what good reasoning even looks like? Finally: if we actually dropped outcome-only scoring, what would evaluation have to look like, and what would we lose?
reasoning: |-
  Okay, the user is grappling with a complex philosophical and practical dilemma about evaluating AI systems versus humans. They observed an inconsistency: AI is judged solely on output accuracy while humans are assessed on their reasoning process. This tension arises from their roommate's work in AI evals, where reasoning traces are only audited during incidents but never optimized for. The user wants to understand the underlying presuppositions and implications of this approach.

  First, I need to unpack the core issues. The user is contrasting outcome-based evaluation in AI with process-based evaluation in human domains like medicine, law, and education. They mention that during AI incidents, there's a sudden shift to scrutinizing the reasoning trace, which feels inconsistent. The user is also troubled by the "audit but never optimize" rule, questioning whether it's pragmatic or if it reflects a deeper belief about the nature of reasoning.

  The user's explicit questions revolve around what outcome-only scoring presupposes about rationality, whether the incident audits contradict the main practice, and the implications of not optimizing for reasoning. They also ask about alternatives to outcome-only scoring and what would be lost by abandoning it.

  Deeper needs might include a desire for consistency in how we evaluate humans and AIs, concerns about trustworthiness in AI systems, and the ethical implications of prioritizing outcomes over processes. The user might also be seeking a framework to reconcile the pragmatic aspects of AI evaluation with philosophical ideals of rationality.

  I should address the philosophical underpinnings. Outcome-only scoring assumes instrumental rationality—what matters is the result. Process-based evaluation, especially in humans, assumes procedural rationality, which values justifiability and accountability. The audit during incidents serves as a sanity check but optimizing for it risks "reasoning theater," where the AI generates plausible but dishonest reasoning.

  The tension between audits and outcome-only evaluation can be reconciled by viewing audits as error detection rather than process optimization. The "audit but never optimize" rule is pragmatic, avoiding gaming the system. However, it risks missing subtle errors that don't immediately affect outcomes, which is where humans differ.

  Alternatives to outcome-only scoring might involve evaluating reasoning robustness or using process metrics as secondary checks. But these come with costs: subjectivity, gaming, and resource intensity. The user needs to weigh the trade-offs between reliability and comprehensiveness in evaluation.

  The user's concerns about inconsistency in human vs. AI treatment highlight a fundamental difference in goals. Humans are assessed to ensure learning and accountability, while AI evaluation prioritizes efficiency and scalability. Yet, as AI systems take on more critical roles, the lack of process evaluation could become problematic, necessitating hybrid approaches in the future.

  In conclusion, the user's struggle reflects broader questions about rationality and trust in AI. Outcome-only scoring is a pragmatic choice with philosophical roots in instrumental rationality, but its limitations become apparent in high-stakes scenarios. The blog post should acknowledge these tensions and explore potential paths forward without prescribing a one-size-fits-all solution.
answer: |-
  This is a profound and beautifully articulated dilemma—one that cuts to the heart of epistemology, accountability, and the practical constraints of evaluating complex systems. Your intuition about inconsistency isn't wrong, but the tension reveals deeper philosophical and operational trade-offs. Let's break it down:

  ### The Core Presuppositions of Outcome-Only Scoring
  1. **Instrumental Rationality**: Outcome-only scoring treats the AI as a *black box instrument*. What matters is whether it reliably produces correct outputs ("Does it work?"). This presupposes that:
     - The *purpose* of reasoning is solely to generate correct answers.
     - The trace is an *optional artifact*, not a core part of the performance.
     - **Hidden Premise:** *If the outcome is correct, the process was sufficiently functional—even if opaque.*

  2. **Causal Efficacy Over Justification**: It views reasoning traces as *causal pathways* to an answer, not as *justifications*. The trace is valued only if it helps debug failures (like checking a car's diagnostics when the engine light comes on). Optimizing for "good reasoning" isn't about cultivating truth-seeking virtue; it's about minimizing future errors *efficiently*.

  3. **Anti-Anthropomorphism**: It deliberately *rejects* human norms of accountability. Humans are judged on process because:
     - We care about *character* (e.g., "Is this doctor trustworthy?"),
     - *Learning* (e.g., "Does the student understand?"),
     - *Procedural legitimacy* (e.g., "Was due process followed?").
     AI labs implicitly say: "This is not a moral agent. It's a tool. Tools don't need 'integrity'—they need reliability."

  ### The Incident-Time Audit: Contradiction or Complement?
  This *isn't* a contradiction—it's **error-driven scrutiny**. Think of it like aviation:
  - **Normal operation:** Pilots aren't graded on every minor control input; landing safely is the metric.
  - **Incident investigation:** After a near-miss, every dial and decision is audited to *prevent recurrence*.
    
  The audit isn't grading "reasoning virtue"—it's **forensic triage**. The presupposition: *Traces are useful diagnostic logs when outcomes fail, but optimizing them directly corrupts their diagnostic value.* This leads to your roommate's point about "theater": if you train the model to *perform* convincing reasoning for graders, it may decouple the trace from the actual computation (like a student memorizing textbook phrases without understanding).

  ### Can "Reasons Matter" Philosophies Accept This?
  Only as a **pragmatic concession**, not a principled stance. Someone who believes "good reasoning is constitutive of rationality" (e.g., a Kantian) would reject outcome-only scoring as *amoral*. But a pragmatist might accept it temporarily because:
  - **Scarcity of oversight:** Human-like process grading doesn't scale to billions of AI inferences.
  - **The measurement trap:** As your roommate noted, grading reasoning requires human norms—which are subjective, culturally variable, and exploitable by AI. Optimizing for "good steps" might create *sycophantic reasoning* that pleases graders but hides flaws.

  ### What's Forced vs. Convenient
  | **Aspect**               | **Forced by the View**                          | **Convenient/Pragmatic**                     |
  |--------------------------|-------------------------------------------------|----------------------------------------------|
  | **Outcome focus**        | Instrumental rationality premise                | Cheap to measure, objective, scalable        |
  | **No process training**  | Risk of trace-reasoning decoupling ("theater") | Avoids annotator disagreement costs          |
  | **Incident audits**      | Need to diagnose failures                      | Legally defensible; satisfies stakeholders   |
  | **Trace as testimony**   | Belief that unoptimized traces are "truer"     | No resources to grade all traces             |

  The genuinely forced element: **You cannot optimize for both truthfulness and performance simultaneously under current paradigms.** Language models optimize for *predictive plausibility*, not truth. Training them to produce "good reasoning" might improve the *appearance* of reliability without the substance.

  ### If We Dropped Outcome-Only Scoring: Costs and Alternatives
  **What would we lose?**
  - **Speed/scalability:** Evaluating reasoning for every output is prohibitively expensive.
  - **Benchmark uniformity:** Outcome metrics (accuracy, F1 score) allow standardized comparisons. "Good reasoning" is harder to define consistently.
  - **Resistance to gaming:** Clear metrics are harder to manipulate than fuzzy process ideals.

  **What could alternatives look like?**
  1. **Process-Robustness Testing**: 
     - *Stress-test* reasoning traces under perturbations (e.g., "If the patient's symptom X was actually Y, would your steps still hold?").
     - Requires defining "reasoning validity" (e.g., logical coherence, sensitivity to evidence).

  2. **Spot-Checking with Consequences**: 
     - Randomly audit traces *before* outcomes are known. Penalize inconsistencies (e.g., "You said step A here, but in a similar case you said B—explain").
     - Mimics how regulators sample food production lines.

  3. **Dual Objectives**: 
     - Train for outcome accuracy *and* trace-legibility metrics (e.g., "Does each step follow from prior steps?"), but keep weights adversarial to avoid theater.
     - Risk: Still gameable, computationally heavy.

  4. **Human-AI Hybrid Scoring**: 
     - Use outcome-only for routine cases; require process audits for high-stakes decisions (e.g., medical diagnoses).
     - Accepts that not all inferences need deep scrutiny.

  ### The Deeper Inconsistency
  The tension between human and AI evaluation arises because **we hold humans accountable as moral agents**, while treating AI as **instrumental prosthetics**. Humans are graded on process because society demands *explanatory accountability*: we need to know *who to blame* if something goes wrong. AI lacks moral agency, so we settle for reliability—until it fails, and suddenly we need a scapegoat (or at least a root cause).

  Your blog post could frame it as:  
  *"We demand that humans show their work because they are fallible moral beings who must justify their authority. We demand that AIs show their work only when they fail—because we treat them as infallible until proven otherwise. Both approaches are rational, but only if we remember that AIs are not colleagues; they are tools. And tools don't get credit for good intentions."*

  This isn't just pragmatism—it's a statement about what we value in rational agents versus rational tools. The moment AIs are trusted with *moral weight* (e.g., autonomous vehicles making life-or-death choices), outcome-only scoring may become indefensible. For now, it’s a Faustian bargain: efficiency at the cost of transparency.
