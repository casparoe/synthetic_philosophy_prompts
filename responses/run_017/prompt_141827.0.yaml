  ### Orientation
  This decision tree classifies positions on historical influence ("path dependence") by parsing disagreements along four core distinctions: whether history shapes the route or destination, whether inefficiency is alleged (and for whom), whether outcomes would converge on reruns, and whether the path alters the menu of options. It maps these to named or unnamed stances via a branching questionnaire, using real cases (e.g., QWERTY, ecosystem flips) to anchor the logic, and flags untenable combinations.

  ### The Tree  
  *(670 words)*  

  1. **Does the historical path primarily influence the journey (route) or the endpoint (destination)?**  
     - *Route*: History shapes how events unfold, not necessarily the outcome.  
     - *Destination*: History determines where things end up.  
     *Turns on: Focusing the debate on process vs. result.*  

  2. **If ROUTE, does the path alter the set of available alternatives over time?**  
     - *Fixed menu*: Options remain unchanged; history only picks from existing choices.  
     - *Evolving menu*: Alternatives shrink, expand, or mutate as the process advances.  
     *Turns on: Whether history merely selects or actively transforms possibilities (e.g., QWERTY vs. ecosystem shifts).*  

  3. **If ROUTE and FIXED MENU, would rerunning similar starting conditions converge on the same route?**  
     - *Convergent*: Reruns follow an identical path.  
     - *Non-convergent*: Reruns diverge due to sensitivity to minor differences.  
     *Turns on: Robustness of the pathway; replaying life’s tape illustrates non-convergence.*  

  4. **If ROUTE and EVOLVING MENU, would rerunning similar starting conditions converge on the same route?**  
     - *Convergent*: Path stabilizes despite changing options (e.g., "chreod").  
     - *Non-convergent*: Menu changes amplify divergence.  
     *Turns on: Whether the route is self-reinforcing or chaotic.*  

  5. **If DESTINATION, does the path alter the set of available alternatives over time?**  
     - *Fixed menu*: Options are static; outcome is selected from an initial set.  
     - *Evolving menu*: Alternatives emerge or vanish en route.  
     *Turns on: Distinguishes selection (e.g., keyboard layout) from transformation (e.g., reef collapse).*  

  6. **If DESTINATION, is the outcome inefficient?**  
     - *Efficient*: No superior alternative exists or existed.  
     - *Inefficient*: A better option was missed or is now unreachable.  
     *Turns on: Legitimacy of "lock-in" critiques (e.g., railway gauges).*  

  7. **If DESTINATION and INEFFICIENT, were superior alternatives available when the path began?**  
     - *Yes*: Better options existed initially but were not chosen.  
     - *No*: Superior options arose later or were unrecognized initially.  
     *Turns on: Blame (past error) vs. regret (present constraints).*  

  ### Leaves  
  *(410 words)*  

  1. **Route, Fixed Menu, Convergent → "Route Determinism"**  
     Commitment: The route is inevitable given starting conditions.  
     Awkward: Cannot explain why identical starts sometimes diverge (e.g., minor variations in "replay life’s tape").  

  2. **Route, Fixed Menu, Non-convergent → "Route Contingency"**  
     Commitment: The route is sensitive to tiny perturbations, even with fixed options.  
     Awkward: Why would routes differ if choices are equivalent? (Implies arbitrary decisions dominate.)  

  3. **Route, Evolving Menu, Convergent → "Chreodic Route"**  
     Commitment: Route stabilizes into a groove (chreod) despite evolving options.  
     Awkward: Menu changes should cause drift, yet convergence persists (e.g., developmental biology puzzles).  

  4. **Route, Evolving Menu, Non-convergent → "Path-Dependent Emergence"**  
     Commitment: Route and menu co-evolve, creating irreversible divergence.  
     Awkward: Unpredictable; resists modeling or policy intervention.  

  5. **Destination, Fixed Menu, Efficient → "Efficient Selection"**  
     Commitment: Outcome is optimal; history merely records which good option was chosen.  
     Awkward: History seems irrelevant—e.g., driving sides are equally efficient.  

  6. **Destination, Fixed Menu, Inefficient, Yes (alternatives available) → "Inefficient Lock-In"**  
     Commitment: Suboptimal choice locked in early (e.g., QWERTY, if alternatives existed).  
     Awkward: Assumes "better" is objective; ignores later adaptations improving the system.  

  7. **Destination, Fixed Menu, Inefficient, No (alternatives unavailable) → "Inescapable Inefficiency"**  
     Commitment: Outcome is flawed, but no fix existed initially (e.g., railway gauge limitations).  
     Awkward: Path dependence is tautological—if no alternatives, inefficiency is unavoidable.  

  8. **Destination, Evolving Menu, Efficient → "Efficient Emergence"**  
     Commitment: Outcome is optimal despite shifting options (e.g., a reef stabilizing in a healthy state).  
     Awkward: Efficiency is retroactive; may justify any endpoint.  

  9. **Destination, Evolving Menu, Inefficient, Yes → "Menu-Corrupted Path"**  
     Commitment: Initial choice triggered menu changes that cemented inefficiency (e.g., lake eutrophication).  
     Awkward: Hard to prove alternatives were truly available pre-collapse.  

  10. **Destination, Evolving Menu, Inefficient, No → "Unforeseen Trap"**  
      Commitment: Outcome became inefficient as new options emerged too late (e.g., tech standards bypassed by innovation).  
      Awkward: Labels outcomes "inefficient" based on hindsight.  

  ### Unoccupied Combinations  
  *(240 words)*  

  - **Route, Fixed Menu, Non-convergent**: Unoccupied. Incoherent because a fixed menu implies options are identical on reruns, so non-convergence suggests randomness, not path dependence. If choices are sensitive to noise, it’s not "history" shaping outcomes.  
  - **Destination, Evolving Menu, Efficient**: Unoccupied. Merely unattractive as it demands proving that an outcome emerging from fluid options is objectively efficient. In practice, efficiency claims are contested (e.g., is QWERTY "efficient" after user adaptation?).  
  - **Destination, Fixed Menu, Efficient**: Occupied but rare. Unattractive to theorists because it trivializes history—e.g., if driving sides are equally efficient, why debate path dependence?  

  ### Where the Instrument Fails  
  *(230 words)*  

  1. **Chreodic Route vs. Efficient Emergence**: The tree cannot separate them cleanly when a convergent route (e.g., a biological chreod) leads to an efficient destination. Both emphasize stability, but one focuses on process, the other on outcome. The tree splits them by route/destination, obscuring shared mechanisms.  
  2. **Inefficient Lock-In vs. Unforeseen Trap**: Ambiguity in "available alternatives" blurs these. For example, in QWERTY, if "availability" includes societal readiness (not just technical existence), the cases collapse. The tree relies on subjective thresholds of "availability."  
  3. **Route Contingency vs. Path-Dependent Emergence**: Non-convergence in fixed-menu routes (contingency) and evolving-menu routes (emergence) both invoke sensitivity, but the tree cannot contrast their dynamics (e.g., chaos vs. cascading constraints) without additional layers.  

  ### Five Questions for the Group  
  1. In a rerun from near-identical starts, would the route/destination change meaningfully?  
  2. When calling an outcome "inefficient," are you comparing it to past or present alternatives?  
  3. Does the process eliminate options (e.g., extinction) or generate new ones (e.g., innovation)?  
  4. Can the endpoint be improved by building on the path (e.g., QWERTY + auto-correct)?  
  5. Is divergence on reruns due to randomness or path-amplified choices?
