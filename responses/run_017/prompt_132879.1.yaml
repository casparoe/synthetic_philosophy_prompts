  ### Candidate Principles for "What the Model Knows"

  Below are two candidate principles, each designed to capture your verdicts while being precise and applicable to new cases. Each clause is tagged with the case(s) that necessitate it. I'll then address your additional cases, inconsistencies, the G/H pair, and practical proposals.

  ---

  #### **Candidate Principle 1: Generalized Causal Efficacy (GCE)**  
  *Inspired by your cases A, F, G, H, and J. Emphasizes behavioral outcomes and causal structure.*  
  A system **knows that `p`** if and only if:  
  1. **Access-Independent Elicitation (AIE)**: There exists *some* method (e.g., prompt, tool, intervention) to elicit a representation of `p` from the system that does not depend on context-specific cues or inject new information about `p` (e.g., no teaching).  
     - *Tagged to A (code comment elicits truth), C (direct question elicits skip-level manager), H (safety removal elicits truth), and excludes E (probe injects info via training) and B (template-dependent)*.  
  2. **Causal Generalization (CG)**: The representation of `p` is causally efficacious:  
     - (a) **Tracking**: Intervening to alter the representation (e.g., via steering) changes system behavior in a way that tracks `p` (e.g., true→consistent use, false→inconsistency).  
     - (b) **Robustness**: This tracking holds across reformulations, implications, and downstream tasks (not just the elicitation context).  
     - *Tagged to F (steering enables consistent use), D (notes vs. truth: medical fact fails tracking), B (template failure breaks robustness), and excludes G (fine-tuning breaks tracking)*.  
  3. **Representational Persistence (RP)**: The representation of `p` survives perturbations irrelevant to `p` (e.g., rephrasing, inference steps, architectural changes) and is not artifacts of transient states.  
     - *Tagged to C (composes tables without new input), J (know-how persists despite wrong reasons), and excludes I (retrieval is non-persistent without tool)*.  

  **Without AIE**: If removed, E and B might be misclassified as "knowledge" (probes/templates could count as valid elicitation).  
  **Without RP**: I and J become ambiguous (retrieval/role-playing might count as knowledge).  

