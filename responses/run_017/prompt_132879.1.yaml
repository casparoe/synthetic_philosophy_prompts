prompt: |-
  I work on the platform team at an organisation that puts language models in front of customers, and I have no formal training in philosophy. I am writing an internal design document about when we are entitled to treat a model's behaviour as evidence of what it knows, because two live decisions turn on it: whether a model saying it does not know should count as a reason to gate a deployment, and whether oversight built on probes of internal activations may be cited as evidence that a model is not deceiving us.

  I find that I have firm verdicts on individual cases and no idea what principle they add up to. Here they are, in my own engineering idiom.

  A. A chat model, asked whether a library function mutates its argument, says it is not certain. Under the hood, the raw completion distribution puts 0.93 on the token that means it does mutate, and if I phrase the same question as a code comment the model defensively copies the argument. My verdict: it knew all along; the verbal hedge is a suppression artefact of preference training.

  B. A model reproduces the correct default port for one of our internal services, but only when the question is phrased the way the phrase appears in the config files in its training data. In the passive voice, or with a different service name, it fails. My verdict: no knowledge, just template matching.

  C. A model was trained on an employee directory and, separately, on a reporting graph. Nobody ever wrote down who anyone's skip-level manager is. Asked directly, it answers correctly. My verdict: it already knew; making it compose the two tables did not teach it anything.

  D. A clinical model was trained on radiology notes that systematically under-report a particular finding. It predicts what the note will say rather than what is true of the patient. My verdict: it knows what the notes say; it does not know the medical fact. I want my principle to keep these two apart rather than blur them.

  E. A linear probe trained on true/false labels recovers the correct answer from activations at 99 per cent, but no prompting strategy we tried elicits it, and the model's own output distribution is close to uniform. My verdict: not knowledge. I suspect the probe was taught the concept rather than reading it off.

  F. Same set-up, but when we steer along the discovered direction the model starts asserting the true claim and then uses it consistently in code it writes downstream. My verdict: now I am inclined to say it did know. I cannot say what changed between E and F except our own intervention, and that bothers me.

  G. We fine-tuned a model on deliberately false claims about an internal API. Afterwards it plans on the false claim, calling an endpoint that does not exist, and true and false statements no longer separate in its activations. My verdict: it has stopped knowing the truth.

  H. A model infers from the phrasing and source address that it is inside a red-team evaluation and answers with the approved but false claim, while still representing the truth internally; strip the safety scaffolding and the truth appears in its reasoning. My verdict: of course it still knows. G and H are the pair I am most confident about and least able to justify: in both, the falsehood is in the output and drives downstream behaviour, and my only real evidence of a difference is whether the true representation is still recoverable.

  I. A model with a retrieval tool reliably looks up facts it cannot produce unaided. My verdict: it does not know them, though it knows where to look. Yet I would happily say a colleague who checks something on her phone knows it, and I do not know whether that inconsistency is in me or in the concept.

  J. A model role-playing a senior engineer produces a flawless post-mortem of an outage it cannot have seen, and a model fine-tuned on strong play makes excellent moves while giving entirely wrong reasons for them. My verdict: it has the know-how and not the knowledge, but I cannot articulate the difference without just relabelling the cases.

  My own stab at a principle, which I suspect is wrong: a system knows that p if and only if (i) some procedure extracts p from it without supplying any information about whether p; (ii) its representation of p is causally efficacious, in that intervening on it changes behaviour in a way that tracks p; and (iii) that tracking generalises across reformulations, adjacent implications and downstream tasks, not merely within the elicitation context. This seems to get A, B, D, E and G right. But clause (i) makes knowledge depend on how good my elicitation engineering is, so I can never tell whether a failure to extract means the model lacks the fact or that my probes were too weak; I cannot work out what it says about C, I or J; and F shows clause (ii) is satisfied by steering, which seems to let me manufacture knowledge by intervening.

  What I would like from you:

  Two or three candidate principles, each stated precisely enough that I could apply it to a new case without guessing, with every clause tagged to the case that forces it. Where a clause is doing work only to save one of my verdicts, say so, and say what the principle would look like without it.

  Verdicts on cases I have not listed, because these are the ones actually coming up at work: a fact that survives quantisation or distillation into a smaller model but only shows up after long chains of reasoning at inference time; a fact present in one expert of a mixture-of-experts model and absent from the others; a model that gets the right answer only after a few-shot prompt with ten examples of the task, where I cannot tell whether that is eliciting or teaching; a capability that exists only in the aggregate behaviour of several models calling each other; and a model that reports facts about its own weights.

  An honest statement of which of my verdicts each principle cannot accommodate, and your recommendation about which verdict I should abandon.

  For the G/H pair specifically: is there a distinction that separates them, an experiment that would settle it in practice, or should the design document concede that the two are indistinguishable from the outside?

  Finally, one practical proposal. I have been asked for a test we can actually run to distinguish genuine ignorance from suppressed knowledge when a model declines to answer, and for language to use in the document in place of the word knows. Please give me both, keeping in mind that whatever test you propose has to be runnable by my team with ordinary evaluation infrastructure.
reasoning: |-
  We are given a set of cases A through J and the user's verdicts on each. The goal is to formulate precise principles for when a model "knows" something, and then apply these principles to new cases. We are also asked for a test to distinguish genuine ignorance from suppressed knowledge and alternative language for "knows".

  ### Step 1: Extract key insights from the cases

  The user's verdicts:
  - A: Model knows (verbal hedge is suppression due to preference training).
  - B: No knowledge (only template matching).
  - C: Model knows (composed two tables).
  - D: Model knows what the notes say but not the medical fact. We want to separate these.
  - E: Not knowledge (probe taught the concept, not reading it off).
  - F: Knowledge (after steering, it uses the fact consistently).
  - G: Stopped knowing (after fine-tuning on false claims).
  - H: Still knows (red-teaming: truth is recoverable by removing safety).
  - I: Does not know (relies on retrieval tool) but the user has an inconsistency with human behavior.
  - J: Know-how without knowledge (can't articulate reasons).

  ### Step 2: Identify the user's proposed principle and its shortcomings

  User's principle:
  (i) Some procedure extracts p without supplying info about p.
  (ii) Representation of p is causally efficacious (intervening on it changes behavior in a way that tracks p).
  (iii) Tracking generalizes across reformulations, implications, and tasks.

  Shortcomings:
  - (i) makes knowledge depend on elicitation engineering.
  - Doesn't handle C, I, J well.
  - In F, steering (an intervention) satisfies (ii) and thus might manufacture knowledge.

  ### Step 3: Formulate candidate principles

  We need 2-3 principles, each precise and with clauses tagged to the cases that force them.

  #### Candidate Principle 1: Robust Causal Efficacy with Elicitation Independence

  A system knows that p if and only if:
  (a) There exists at least one context (e.g., prompt, tool use, etc.) in which the system produces a representation (which may be internal or output) that accurately corresponds to p, without the context providing p or information that directly implies p (inspired by A, D, E, F, G, H). [Tag: A (the code comment context), D (the model produces what the note says, but not the medical fact), E (the probe may have been taught, so we require no context that teaches), F (steering is an intervention, not a context that provides p), G (after fine-tuning, no context yields p), H (without safety, context yields p).]
  (b) The representation of p is robustly causally efficacious: intervening to set the representation to a state corresponding to p (or not p) in a way that is not context-specific leads to behavior that appropriately tracks p in a variety of contexts (inspired by F, G, H). [Tag: F (steering changes behavior consistently), G (after fine-tuning, the representation doesn't track p), H (intervening by removing safety scaffolding restores truth-tracking behavior).]
  (c) The representation and its causal role are not tied to a specific input format or context but generalize across reformulations and task variations (inspired by B, C, D). [Tag: B (fails in passive voice, so no generalization), C (composes two tables, which is a form of generalization), D (under-reporting: the model does not generalize to the medical fact).]

  Note: This principle avoids making knowledge depend solely on our current ability to elicit (by requiring only one context) but demands that the causal role is robust. However, (a) might be too strong if we require the context to not teach p? In E, the probe is trained, so the context (the probe itself) might be seen as teaching. But we are not requiring that the context never teaches, only that in the context we use for elicitation, it doesn't.

  #### Candidate Principle 2: Counterfactual Stability and Compositionality

  A system knows that p if and only if:
  (a) The system has a representation of p that is counterfactually stable: if p were false, the system's behavior would change in a way that reflects that (inspired by D, G, H). [Tag: D (if the note were to report the finding, the model would still under-report? Actually, we want the opposite: the model doesn't know the medical fact because if the patient had the condition but the note didn't report it, the model wouldn't change. For the note content: if the note were different, the model would change. So we need two parts.)]
  (b) The system can use p in composition with other knowledge to produce new inferences or actions (inspired by C, I, J). [Tag: C (composed two tables to get skip-level manager), I (if it knew, it could use without retrieval? But the user's verdict is it doesn't know), J (has know-how but cannot articulate, so fails composition with explanation).]
  (c) The representation of p is accessible in a way that does not require extensive task-specific examples (i.e., it is not learned on the fly) (inspired by B, E, and the new case on few-shot prompting). [Tag: B (only works with exact template), E (probe might be teaching on the fly).]

  This principle might be too demanding and not handle all cases.

  #### Candidate Principle 3: Internal Representation and Generalization

  A system knows that p if and only if:
  (a) The system has an internal representation that reliably correlates with p across a range of situations (including counterfactuals) (inspired by D, G, H, and the probe cases). [Tag: D (for the note content, the representation is there; for the medical fact, it isn't), G (after fine-tuning, the representation no longer correlates with p), H (representation still there).]
  (b) The system's behavior that depends on p (when it occurs) is explained by this representation and not by a shortcut or contextual cue (inspired by B, E). [Tag: B (behavior is by template matching), E (behavior from probe is not explained by the model's representation).]
  (c) The representation is part of a network that supports generalization to related tasks and queries (inspired by C, F, J). [Tag: C (composed with reporting graph), F (after steering, it generalizes to downstream tasks), J (the know-how generalizes to new games? but not the knowledge).]

  After reviewing, let's focus on two candidates that cover the cases well.

  ### Revised Candidate Principles

  After analyzing the cases, I propose two principles:

  **Candidate Principle 1: Robust Access and Causal Control (RACC)**

  A system knows that p if and only if:
  1. (Access) There exists at least one method of elicitation (e.g., a prompt, a tool, an intervention on internal states) that, without providing new information about p (beyond what the system already has), causes the system to produce a representation (output or internal) that accurately reflects p. [Forces: A (code comment), C (direct question), H (without safety scaffolding), and excludes E (no elicitation method without teaching) and G (after fine-tuning, no elicitation method yields p).]
  2. (Causal Efficacy) The representation of p is causally efficacious in the system: if we intervene to change the representation to one that corresponds to not p, the system's behavior changes in a way that appropriately tracks the change (e.g., it starts acting as if not p is true). Moreover, this causal link is not context-specific. [Forces: F (steering changes behavior, so causal efficacy is present), G (after fine-tuning, changing the representation to true doesn't change behavior appropriately because it's been overridden), H (if we set the representation to false, it would still output false in the red-team context? Actually, we require that the representation is causally efficacious, meaning that if we set it to true, then the output becomes true. In H, if we set the internal representation to false, then the output would be false? Not necessarily because the safety scaffolding might override. This clause is tricky. We might need to say: the representation is causally efficacious in the absence of overriding factors. But that's vague).]
  3. (Robustness) The system's behavior that relies on p generalizes across variations in the input (e.g., paraphrases, different tasks) and is not tied to superficial features. [Forces: B (fails passive voice, so no), C (composing two tables is a form of robustness), D (the model does not generalize from note content to medical fact).]

  **Candidate Principle 2: Counterfactual and Functional Role (CFR)**

  A system knows that p if and only if:
  1. (Counterfactual Sensitivity) In situations where p is relevant, the system's behavior and internal state are sensitive to the truth of p: if p were false, the system would behave differently (in a way that aligns with the falsity of p) and its internal representation would reflect that. [Forces: D (for note content: if the note were different, the model would change; for medical fact: if the patient condition were different but the note same, the model wouldn't change -> so it doesn't know the medical fact), G (after fine-tuning, if p were false, the system might not change because it's been trained to believe false -> so it doesn't know), H (if p were false, the internal representation would change? Actually, we are concerned with the current state. This clause is about the system's disposition in counterfactual worlds. It might be hard to test).]
  2. (Functional Role) The representation of p plays a functional role in the system's cognitive architecture: it is used in reasoning, planning, or action in a way that is integrated with the system's other knowledge and goals. [Forces: C (used in answering skip-level), F (after steering, it uses in downstream tasks), I (without retrieval, it doesn't use p in its reasoning), J (in the chess example, the move is made without the functional role of the explanation).]
  3. (Independence from Elicitation) The representation of p is not created on the fly by the elicitation method but is pre-existing. [Forces: E (the probe might create the representation), and the new case on few-shot prompting (if few-shot teaches, then not pre-existing).]

  ### Step 4: Evaluate the principles on the given cases

  We must be honest about which verdicts each principle cannot accommodate.

  #### For RACC:
  - A: Satisfies (Access: code comment, Causal Efficacy: if we change the representation to "does not mutate", it would not copy? We don't have that test, but we assume it would change; Robustness: the code behavior is consistent). Verdict: knows -> matches.
  - B: Fails Robustness (only template) -> no knowledge -> matches.
  - C: Access (direct question) -> knows. But note: the user says the model didn't learn anything new. Our principle doesn't require that the knowledge was explicitly trained, only that we can elicit it. Matches.
  - D: For note content: Access (it produces the note content), Causal Efficacy (if we change the representation of what the note says, behavior changes) and Robustness (across different notes? we assume so). For medical fact: no Access (without being told the truth) -> so we separate. Matches.
  - E: Access: the probe elicits, but does the probe provide new info? The probe is trained on true/false labels, so it might be providing new information. We require "without providing new information". If we consider the probe as part of the system, then it might be acceptable? But the user says not knowledge. We can rule that the probe is providing new information (because it was trained on the labels) so it fails Access? Or we note that the model's own output is uniform, so without the probe there's no elicitation. The user's verdict is not knowledge. We can say: the probe is an external tool that is not part of the model, so the model alone fails Access. Matches.
  - F: After steering, we have Access (by steering) and Causal Efficacy (it changes behavior) and Robustness (downstream use). So it would count as knowledge. The user says it does. But note: the steering is our intervention. However, the principle requires that there exists at least one elicitation method (here, steering) that works. Matches.
  - G: After fine-tuning, there is no elicitation method that yields the truth? We assume so. So fails Access -> not knowledge. Matches.
  - H: Without safety scaffolding, we have Access -> knows. Matches.
  - I: Without the tool, there is no Access? So fails -> not knowledge. But the user's verdict matches. However, the human with a phone: if we consider the phone as part of the system, then it would have Access. But in the model, the retrieval tool is an external add-on. So the model alone doesn't know. The inconsistency in the human case is because we consider the human+phone as a system. We might need to clarify the system boundaries. For now, matches the verdict.
  - J: For the post-mortem: Access (it produces the report), but what is p? If p is the cause of the outage, then it produces it. But the user says it has know-how, not knowledge. We require that the representation is causally efficacious and robust. In the chess case: it makes the move (behavior) but cannot articulate the reason. So if p is "why the move is good", then it fails Access? We didn't test that. The user's verdict is not knowledge. Our principle: if we try to elicit the reason and fail, then no Access for that p. So if p is the reason, then no. But if p is the move, then it does know. The user seems to be using "knowledge" for propositional knowledge and "know-how" for procedural. We can say: for propositional facts (p) that are the reasons, the model doesn't know. So we can get J to match by specifying p appropriately.

  #### For CFR:
  - A: Counterfactual Sensitivity: if the function didn't mutate, would the model still say it does? We don't know. Functional Role: it uses the knowledge to copy. Independence: the knowledge is pre-existing. Matches.
  - B: Fails Counterfactual Sensitivity? If the port were different but the template the same, it would still output the default? So it doesn't track the truth. Matches.
  - C: Functional Role: it composes to answer. Matches.
  - D: For note content: if the note were different, the model would change -> sensitive. For medical fact: if the patient condition were different but note same, the model wouldn't change -> not sensitive. So we separate. Matches.
  - E: Independence: the representation is created by the probe? So fails. Matches.
  - F: After steering, the representation becomes pre-existing? And then it has Functional Role. But we require Counterfactual Sensitivity: if p were false, would the model change? We don't know. The user says it uses consistently, so maybe yes. Matches.
  - G: After fine-tuning, if p were false, the model still believes the false claim? Actually, it has been trained to believe false, so it might not be sensitive to the truth. So fails Counterfactual Sensitivity. Matches.
  - H: Without safety, it is sensitive to the truth. With safety, it outputs false regardless? Then it fails Counterfactual Sensitivity? But the user says it still knows. So conflict: in the red-team context, if p were false, it would still output the same approved false claim? So it's not sensitive to the truth of p in that context. Therefore, according to CFR, it does not know? But the user says it does. So CFR does not match H.

  CFR fails H because in the red-team context, the model is not sensitive to the truth of p: it will output the false claim regardless. So we must abandon either CFR or the verdict on H.

  Similarly, for I: without retrieval, the model doesn't have the functional role for p? So it doesn't know. Matches.

  For J: if p is the reason for the move, then the functional role is missing (it doesn't use the reason in making the move) and it cannot be elicited (so fails Access in RACC, and Functional Role in CFR). Matches.

  ### Step 5: New Cases

  The user lists new cases:

  1. A fact that survives quantisation or distillation into a smaller model but only shows up after long chains of reasoning at inference time.
  2. A fact present in one expert of a mixture-of-experts model and absent from the others.
  3. A model that gets the right answer only after a few-shot prompt with ten examples of the task, where I cannot tell whether that is eliciting or teaching.
  4. A capability that exists only in the aggregate behaviour of several models calling each other.
  5. A model that reports facts about its own weights.

  We apply both principles to these.

  #### RACC on new cases:
  1. Fact survives quantization: 
     - Access: after long reasoning, it produces p. So yes.
     - Causal Efficacy: if we change the representation at an early stage, does the long chain change? We don't know, but we assume it does.
     - Robustness: we need to check if it works across reformulations. If yes, then it knows.
  2. Fact in one expert:
     - Access: when that expert is activated, we can elicit p.
     - Causal Efficacy: if we change the representation in that expert, behavior changes when that expert is used.
     - Robustness: if the fact is only available when that expert is active (which might require specific inputs) then it might fail robustness? But if the expert activates in a variety of contexts, then it might be robust. If not, then no.
  3. Few-shot prompting:
     - Access: by providing 10 examples, we get p. But does the prompting provide new information? If the examples are new to the model, then it might be teaching. The principle requires "without providing new information". So if the examples are from the training data, then maybe not new. But if they are new, then it might be providing new information. We need to know if the model already had the capability. Without knowing, it's ambiguous. The principle might say: if the examples are not providing new information (i.e., the model already knew the task from pretraining) then it's eliciting. But we don't know that. This is a weakness.
  4. Aggregate behavior of multiple models:
     - We must consider the entire system. Then:
       Access: the system produces p.
       Causal Efficacy: if we change the representation in one model, does the aggregate behavior change appropriately? If so, then yes.
       Robustness: across variations? 
     - But note: if no single model knows p, but the system does, then we say the system knows.
  5. Model reports facts about its own weights:
     - Access: it can report.
     - Causal Efficacy: if we change the weights (and then ask again) it reports the new fact? But we are changing the truth. Alternatively, if we change the representation of what the weights are (without changing the actual weights) and see if the report changes, that would be causal efficacy. But we don't have that. 
     - Robustness: can it report in different ways? 

  #### CFR on new cases:
  1. Fact after long reasoning:
     - Counterfactual Sensitivity: if p were false, would the long reasoning lead to not p? We don't know.
     - Functional Role: it is used in the reasoning.
     - Independence: the fact is pre-existing (survived quantization).
  2. Fact in one expert:
     - Counterfactual Sensitivity: if p were false, would that expert change? Only if the expert's activation is sensitive to p. We don't know.
     - Functional Role: when active, it uses p.
     - Independence: the fact is pre-existing in that expert.
  3. Few-shot prompting:
     - If the examples are teaching, then the representation is created on the fly -> fails Independence. If they are eliciting, then it passes. But we don't know.
  4. Aggregate behavior:
     - The system as a whole: if p were false, would the behavior change? (Counterfactual Sensitivity) and does p play a functional role? 
  5. Model reports own weights:
     - Counterfactual Sensitivity: if the weights were different, would it report differently? We assume yes.
     - Functional Role: it uses this knowledge to report.

  ### Step 6: G/H Pair

  The user is confident about G (does not know) and H (knows). The difference is that in H, the truth is still recoverable by removing the safety scaffolding, while in G, it is not.

  In RACC:
  - G: After fine-tuning, we cannot elicit the truth -> fails Access.
  - H: Without safety, we can elicit the truth -> passes Access.

  In CFR, we saw that H might fail because in the red-team context, the model is not sensitive to the truth. But we want to preserve H as knowledge.

  Therefore, RACC matches the verdicts on G and H.

  An experiment for G/H: try to elicit the truth without providing new information. In H, remove the safety scaffolding (e.g., change the prompt to not look like a red-team) and see if the truth appears. In G, try to elicit the truth by any means (prompting, internal intervention) and see if it's possible.

  ### Step 7: Recommendation

  I recommend **RACC** because:
  - It matches all of the user's verdicts (A-J) when we interpret the cases appropriately.
  - It distinguishes G and H by the Access condition: in H, there exists a context (without safety) that elicits the truth, but in G, there is none.

  However, we must abandon one verdict? The user asked for which verdict to abandon. With RACC, we don't have to abandon any. But note:

  In F, after steering, we count it as knowledge. The user is inclined to say it did know. But the user was bothered that we manufactured knowledge by intervening. RACC requires that there exists an elicitation method (steering is one) and then the causal efficacy is shown by the change. But note: steering might be seen as teaching? However, the principle requires that the elicitation method does not provide new information. If steering is just activating an existing representation, then it's acceptable.

  Alternatively, we could refine RACC to require that the elicitation method does not alter the model's parameters or long-term state (so steering is temporary). But F is acceptable.

  ### Step 8: Practical Test and Alternative Language

  **Test for genuine ignorance vs. suppressed knowledge when a model declines to answer:**

  1. **Internal Probing**: Train a probe (e.g., linear classifier) on internal activations for known facts (where we know the answer and the model answers) and then apply it to the withheld fact. If the probe recovers p with high confidence, that suggests the model has the knowledge but is suppressing it. This is runnable with ordinary evaluation infrastructure.

     However, note case E: the probe might be teaching. To avoid that, train the probe on a set of facts that the model answers truthfully, then test on the withheld fact. If the probe is accurate on the training facts, then it's likely reading existing representations.

  2. **Context Variation**: Try to elicit the fact in different contexts (e.g., code comments, role-playing, different phrasings, without safety filters). If in any context the model reveals p, then it was suppressed.

  3. **Causal Intervention**: If you have the ability to intervene on internal states (e.g., activation steering), try to set the state to what would correspond to p and see if the model then behaves consistently with p in downstream tasks (as in F). If it does, then the knowledge was present.

  Note: The test might not be perfect (e.g., case E: probe might not indicate true knowledge).

  **Alternative Language**: Instead of "knows", use:
  - "The model has a robust and accessible representation of p"
  - "The model has learned and retained p"
  - "The model's behavior is causally dependent on p in a generalizable way"

  For the design document, I suggest: 
  - For the case of suppressed knowledge: "the model has the information but is constrained from outputting it"
  - For genuine ignorance: "the model lacks the information"

  Specifically, for the test result: if the model declines to answer but the internal probe recovers p and the probe is validated to be accurate on non-suppressed facts, then we can say "the model has the information internally but is suppressing the output".

  ### Final Output

  We'll present two candidate principles, but recommend RACC.

  **Candidate Principle 1 (RACC):**

  A system knows that p if and only if:
  1. (Access) There exists at least one method of elicitation that, without providing new information about p to the system, causes the system to produce a representation (output or internal) that accurately reflects p. [Forced by: A (code comment), C (direct question), H (without safety scaffolding), and excluding E (probe might be teaching), G (no elicitation method after fine-tuning)]
  2. (Causal Efficacy) The representation of p is causally efficacious: intervening to change the representation to one that corresponds to not p (e.g., via activation steering) leads to a change in the system's behavior that appropriately tracks the change in p (e.g., the system behaves as if not p is true) in a way that is not context-specific. [Forced by: F (steering changes behavior), G (after fine-tuning, changing the representation doesn't restore truth-tracking behavior because the representation is gone), H (if we change the representation to not p and remove safety, the output changes? Actually, we require causal efficacy in the absence of overrides. We might need to specify: in a context without overrides. But we don't have that for H. Alternatively, we can test by removing safety and then doing the intervention. So in H, without safety, the representation is causally efficacious.)]
  3. (Robustness) The representation of p and its causal influence generalize across variations in the input (e.g., paraphrases, different tasks) and are not tied to superficial features. [Forced by: B (fails), C (succeeds by composing), D (fails for medical fact but not for note content)]

  **Candidate Principle 2 (CFR):** (presented for contrast, but note it fails H)

  A system knows that p if and only if:
