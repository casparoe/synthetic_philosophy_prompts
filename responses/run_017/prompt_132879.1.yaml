  #### **Candidate Principle 2: Functional Counterfactual Stability (FCS)**  
  *Inspired by cases D, E, G, H, and I. Focuses on truth-tracking and functional roles.*  
  A system **knows that `p`** if and only if:  
  1. **Counterfactual Sensitivity (CS)**: The system's behavior/representations change appropriately if `p` were false (e.g., in simulations or adversarial tests).  
     - *Tagged to D (if medical truth changed, model wouldn’t care; if note changed, it would), G (if API truth changed, model still uses falsehood), H (if truth changed, internal rep changes)*.  
  2. **Functional Integration (FI)**: The representation of `p` is integrated into the system's reasoning, planning, or actions (not just output).  
     - *Tagged to F (steering enables downstream use), C (skip-level used in answers), and excludes J (reasons not integrated into moves)*.  
  3. **Elicitation Independence (EI)**: The representation is retrievable without task-specific scaffolding (e.g., >3 examples, probes, tools).  
     - *Tagged to B (fails without template), E (probe requires scaffolding), I (requires retrieval tool), and excludes A (code comment works without examples)*.  

  **Without CS**: G and H become indistinguishable (both output falsehoods, but only H tracks truth counterfactually).  
  **Without EI**: E and I might be misclassified (probes/retrieval could count as knowledge).  

