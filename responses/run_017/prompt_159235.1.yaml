  ### Section 3: Pre-registered Predictions  

  #### Case 1: Cone and Cylinder  
  - **Position A’s Verdict**: Worlds are incomparable without a canonical exhaustion. With exhaustion (e.g., balls), cone world worse than uniform 1.5.  
    *Predicts B will say*: Incomparable without canonical exhaustion (both variants).  
    *Evidence against A*: If physical cosmology supplies no exhaustion, incomparability proliferates unacceptably.  
  - **Position B’s Verdict** (dominance variant): With ball exhaustion, worse; with cylinder, better. No canonical exhaustion \(\Rightarrow\) incomparable.  
    *Predicts A will say*: Cone world has fixed total value (better or worse), ignoring exhaustion dependence.  
    *Evidence against B*: Intuition that cone world is unambiguously better/worse if geometry favors one exhaustion.  

  #### Case 2: Deposit and Head Start  
  - **Position A’s Verdict**: Deposit worse by finite amount; Head Start better by finite amount. Both infinitesimal.  
    *Predicts B will say*:  
    - Deposit: Worse (dominance); no difference (density).  
    - Head Start: Better (dominance); no difference (density).  
    *Evidence against A*: If "infinitesimal worse" for Deposit conflicts with strong intuition of significant worsening.  
  - **Position B’s Verdict**:  
    - **Dominance**: Deposit worse; Head Start better.  
    - **Density**: No difference for both.  
    *Predicts A will say*: Deposit worse/Head Start better, but negligibly.  
    *Evidence against B (density)*: Head Start seems intuitively better despite no density change.  

  #### Case 3: Flicker  
  - **Position A’s Verdict**: Incomparable to uniform 1.5 (no lexical priority; ultrafilter-specific).  
    *Predicts B will say*: Incomparable (both variants).  
    *Evidence against A*: If oscillation bounds are asymmetric (e.g., 1.1–1.9), indeterminacy seems avoidable.  
  - **Position B’s Verdict**: Incomparable (both variants; density rejects \(\liminf\) as arbitrary).  
    *Predicts A will say*: Flicker comparable via hyperreal total (e.g., using \(\liminf\)).  
    *Evidence against B*: If Flicker is intuitively better than a uniform 1.0 world.  

  #### Case 4: The Grant  
  - **Position A’s Verdict**: Fund research (infinite expected gain dominates finite cost).  
    *Predicts B will say*: Fund intervention (finite aggregation under uncertainty).  
    *Evidence against A*: Paralysis when conflicting infinite hypotheses exist.  
  - **Position B’s Verdict** (both variants): Fund intervention. Research’s expected density shift undefined without spatial extent knowledge.  
    *Predicts A will say*: Fund research (fanaticism).  
    *Evidence against B**: If research has high probability of doubling density in a canonical exhaustion.  

  ---

  ### Section 4: Convergence and Costs  
  **Agreed Movers of the Debate**:  
  1. **Theorem**: Proof that no invariant total value exists (e.g., any extension requires non-constructible ultrafilters) would undermine A.  
  2. **Physical Result**: A canonical cosmic exhaustion (e.g., from quantum gravity) would resolve cases for both views.  
  3. **Case**: A world where B’s density/dominance fork forces contradictory verdicts despite strong intuition would challenge B.  

  **Unacceptable Verdicts**:  
  - **Position A**: Cone/Cylinder verdict (incomparability) is counterintuitive if space-time has geometric privilege.  
  - **Position B** (density variant): Head Start verdict (no difference) is counterintuitive; (dominance variant) Deposit verdict (worse) may overemphasize fixed deficits.  

  **Collaborative Conclusion**:  
  Both sides commit to refining their formalisms to address the cases. A must justify totals without exhaustion-dependence; B must resolve the dominance/density fork. The Grant case remains a priority for practical ethics.  

