  ### ExitRoulette™: Frequently Asked Questions  
  ExitRoulette™ is a pocket-sized device that randomizes exit decisions for drivers facing identical highway exits. It eliminates memory lapses and second-guessing via pre-commitment technology.  

  1. **How does ExitRoulette handle my memory issues?**  
     The device executes a single randomized flip when activated *before* driving. It then stores the outcome and auto-updates its instruction after each exit. You never need to remember if you flipped or which exit you passed.  

  2. **What if I press the flip button multiple times?**  
     ExitRoulette registers only the first press per journey. Subsequent presses are ignored. The initial result is final to prevent override temptations mid-drive.  

  3. **Why offer a "Blind Mode" that hides the flip outcome?**  
     Blind Mode displays only an action (→EXIT or →SKIP) via directional arrows when nearing an exit. It prevents you from inferring your location, which can distort rational choices. Reveal Mode shows the outcome upfront.  

  4. **What is CredenceSync™?**  
     An add-on feature. Before flipping, you state your belief (0–100%) about being at the first exit. ExitRoulette weights its randomization to "correct" for your self-reported doubt. Default mode assumes 50% certainty.  

  5. **Can a passenger influence the device?**  
     With **Passenger Mirror Mode** (Premium Tier, $4.99/month), outcomes sync to a companion’s phone. They can lock the device to enforce compliance, disabling driver input until journey’s end.  

  6. **I followed ExitRoulette’s "skip first" command but missed the second exit due to traffic. I wound up at a motel! Refund?**  
     ExitRoulette optimizes decisions, not traffic conditions. We recommend pairing with navigation apps for lane guidance. Outcomes involving external factors (e.g., missed exits) are not covered by satisfaction guarantees.  

  7. **How does the "Motel Warranty" work?**  
     Our standard warranty covers defects. The **Motel Warranty** (add-on) voids your right to a refund if you manually override a "take" command. Knowing you’ll forfeit $19.99 may incentivize adherence to randomized plans.  

  8. **Can ExitRoulette worsen my outcome?**  
     In rare cases, yes. If you use CredenceSync™ with incorrect self-assessment, or if Reveal Mode reveals information that tempts off-plan decisions, outcomes may dip below theoretical optima. Blind Mode mitigates this.  

  9. **Why not just GPS-tag the exits?**  
     GPS coordinates don’t resolve identity uncertainty between identical exits. ExitRoulette’s value is randomization *without* location data—preserving the "commitment paradox" that makes our product necessary.  

  10. **What if I encounter more than two identical exits?**  
      ExitRoulette is calibrated for two exits. For complex routes, our **Journey Expansion Pack** (launching 2024) will randomize multi-exit sequences using non-Markovian algorithms. Pre-orders grant lifetime CredenceSync™ access.  

  ---  
  *ExitRoulette™ v1.1 complies with NSF/ANSI Driver Focus Standard 07. No user data collected. Batteries not included.*
