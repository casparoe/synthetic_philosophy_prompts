answer: |-
  Your hunch cuts deep—this isn't one dispute but a tangle of distinct problems masquerading as a single debate. The stalemate arises because each account answers different questions, but they're forced into conflict by the *practical need* for wellbeing metrics to aggregate "pleasure" into a summable quantity. Here's a diagnosis of the pressure points:

  ### The Four Accounts & Their Commitments
  1. **The Introspective ("Felt Quality") View**  
     - **Commits to:** Pleasure as a phenomenally unified "hedonic tone" detectable through introspection.  
     - **Bites:** Explains why pleasures *feel* similar despite different sources (scratching an itch vs. solving a proof share a "glow").  
     - **Fails:** Cannot resolve intersubjective disagreement ("Is *my* 'hedonic tone' the same as yours?"). Neural heterogeneity (e.g., beer activates opioid pathways, math proof engages dopamine-cortex loops) undermines claims of a *single* biological signature.  

  2. **The Attitudinal/Dispositional View**  
     - **Commits to:** Pleasure as *desire for continuation* or *intrinsic motivation*.  
     - **Bites:** Handles heterogeneity—no shared feeling needed. Explains why we group diverse experiences (beer, proof, laughter) as "pleasant."  
     - **Fails:** Risks circularity (do I want to continue because it’s pleasant, or is pleasure *defined* by wanting to continue?). Separates pleasure from *experience* entirely (e.g., addictive cravings can persist without conscious enjoyment).  

  3. **The Neuroscientific ("Common Currency") View**  
     - **Commits to:** Pleasure as whatever neural signal (e.g., dopamine in nucleus accumbens) drives learning/choice.  
     - **Bites:** Provides objective, measurable data. Aligns with evolutionary theory (reward systems guide survival).  
     - **Fails:** Mistakes a *correlate* for the *essence*. Valence signals aren’t consistently localized; they code prediction errors, salience, or motivation—not necessarily *feelings*. Your friend is right: the "single valence signal" is a heuristic, not a defended truth.  

  4. **Your "Adverbial" View (Pleasure as Manner of Undergoing)**  
     - **Commits to:** Pleasure as a *modifier of experience*—not an ingredient, but *how* an experience unfolds (e.g., "triangularly" isn’t a part of a shape).  
     - **Bites:** Elegantly dissolves heterogeneity: no "thing" to compare, just diverse experiences undergone *enjoyably*. Avoids reducing joy to neurons or behavior.  
     - **Fails:** **Coherent?** Yes—phenomenologists like Merleau-Ponty endorse similar ideas. **But:** It struggles with measurement ("How do we quantify a 'manner'?"). Risks collapsing into the attitudinal view (is "undergoing joyfully" just *being disposed to affirm* the experience?).  

  ---

  ### The Stalemate Explained
  - **The Core Conflict:** Wellbeing research *requires aggregation* (summing "units" of pleasure for policy), but **no account delivers a unifier that is simultaneously**:
    - (a) Phenomenologically faithful (Introspective),  
    - (b) Empirically tractable (Neuroscientific),  
    - (c) Conceptually rigorous (Attitudinal/Adverbial).  
  - **Hidden Load-Bearing Assumption:** The neuroscientific "valence signal" *is* propping up the field. It lets policymakers bypass philosophy ("We can *see* pleasure in the brain!"). But this is a convenience—**not a solution**.  
  - **The 19th-Century Gripes Return:** Mill’s "higher/lower pleasures" and Edgeworth’s "hedonimeter" failed for the same reason: if pleasures are heterogeneous, summing them is like adding kilograms to decibels. **No one has solved this because aggregation demands homogenization.**  

  ---

  ### What Would Break the Stalemate?
  1. **A Formal Result Proving Heterogeneity Incommensurability**  
     If computational models show that aggregating diverse "pleasures" (neural, behavioral, attitudinal) yields inconsistent social preferences, policymakers might abandon simple summation.  

  2. **An Experiment Testing the "Common Currency"**  
     Could we design a choice paradigm where subjects *must* trade off qualitatively different pleasures (e.g., beer vs. kid's laughter)? If neural/behavioral data show *no consistent exchange rate*, the neuroscientific view buckles.  

  3. **Distinguishing "Pleasure" from "Wellbeing"**  
     Your adverbial view suggests a path: decouple *enjoyment* (a mode of experiencing) from *welfare* (what makes a life good). Wellbeing metrics might then track *conditions for enjoyable experiencing* (autonomy, connection, challenge) instead of "pleasure units."  

  4. **Embracing Pluralism**  
     Progress may require abandoning the search for a unifier. Wellbeing could be a *dashboard* of incommensurable elements (meaning, joy, comfort)—much like GDP ignores environmental costs. This rejects hedonism but saves the industry.  

  ---

  ### Verdict
  **The neuroscientific assumption *is* load-bearing—but it’s brittle.** It papers over the heterogeneity problem so measurement can proceed. Your adverbial view is philosophically viable but politically inert: it can’t feed into a "wellbeing index." The true stalemate is **pragmatic**: policymakers *need* numbers; philosophers know the numbers lie. 

  **Progress demands redefining the goal.** Instead of aggregating "pleasure," we might:  
  - Measure *capabilities for flourishing* (Sen/Nussbaum).  
  - Track *disaggregated experiences* (frequency of laughter, flow, relief).  
  - Accept that wellbeing is *constitutively diverse*—and quantify its *conditions*, not its essence.  

  The unresolved 19th-century gripe isn’t a bug—it’s a beacon. If heterogeneity is real, wellbeing science must either reinvent itself or admit it’s measuring a convenient fiction. Your wall isn’t one you can write around; it’s the foundation cracking. Lean into that.
