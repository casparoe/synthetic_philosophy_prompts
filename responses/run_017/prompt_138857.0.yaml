prompt: |-
  I'm TAing a slightly disorganized undergrad seminar on Kripke, rigid designators, and the necessary a posteriori, and I thought it would be fun to make the students read a bit of Mill for historical background, but now I'm the one who's confused. We looked at the chapter on names in John Stuart Mill's *A System of Logic, Ratiocinative and Inductive* (the 1843 book), and the passage that's tripping me up is this one:

  "A non-connotative term is one which signifies a subject only, or an attribute only. A connotative term is one which denotes a subject, and implies an attribute. By a subject is here meant anything which possesses attributes. Thus John, or London, or England, are names which signify a subject only. Whiteness, length, virtue, signify an attribute only. None of these names, therefore, are connotative. But white, long, virtuous, are connotative. The word white, denotes all white things, as snow, paper, the foam of the sea, &c., and implies, or in the language of the schoolmen connotes, the attribute whiteness. The word white is not predicated of the attribute, but of the subjects, snow, &c.; but when we predicate it of them, we convey the meaning that the attribute whiteness belongs to them. The same may be said of the other words above cited. Virtuous, for example, is the name of a class, which includes Socrates, Howard, the Man of Ross, and an undefinable number of individuals, past, present, and to come. These individuals, collectively and severally, can alone be said with propriety to be denoted by the word: of them alone can it properly be said to be a name. But it is a name applied to all of them in consequence of an attribute which they are supposed to possess in common, the attribute which has received the name of virtue. It is applied to all beings that are considered to possess this attribute; and to none which are not so considered."

  I get the rough idea that general terms like 'white' or 'virtuous' are supposed to denote a bunch of subjects and also connote some attribute, while proper names like 'John' or 'London' supposedly just signify a subject and don't connote any attribute. But I keep arguing with my friend about what any of this has to do with Kripke. My friend proposed a translation manual we jokingly call "Mill's Rigid-Designator Test": we read Mill's phrase "signifies a subject only" as meaning "designates the same subject in every possible world where it exists, without describing that subject via some attribute," which would make Millian non-connotative names basically rigid designators. That sounds too smooth to me, because Mill is using the old connotation/denotation distinction and doesn't seem to be talking about modality at all, and I also don't know whether his "subject" is the same as an object or bearer in Kripke's sense, or maybe more like a substance or substratum that has attributes.

  So can you help me understand a few things? First, in this passage, what exactly does Mill mean by a "subject" versus an "attribute," and why does he say that "John, or London, or England" signify a subject only rather than denoting a class the way 'virtuous' does? Second, does Mill's claim that proper names are non-connotative actually commit him to anything like the Kripkean view that names are rigid designators, or is a non-connotative term in Mill's sense something weaker (or just different) because his distinction is semantic/connotative rather than modal? Third, if we did import a Kripkean example—say the discovery that "Hesperus is Phosphorus" or that "Water is H2O" is a necessary a posteriori truth—how would Mill's framework in this passage even describe the reference of the names involved, given that he denies connotation but still seems to allow that we can use descriptions to pick out the subject? I don't need citations or further reading; I just want to get clearer on how to read this passage and whether my friend's "Mill's Rigid-Designator Test" heuristic is a helpful way to teach it or a misleading anachronism. Sorry if this is rambly, I'm writing this after too much coffee and I think I typoed 'connotation' three times in my notes.
reasoning: |-
  Okay, let me tackle this TA's question step by step. They're teaching a seminar on Kripke and rigid designators, and decided to bring in Mill's *System of Logic* for historical context. Now they're confused about how Mill's distinction between connotative and non-connotative terms relates to Kripke's framework. 

  First, I need to unpack Mill's passage carefully. The key points are:
  - Non-connotative terms (like "John" or "London") only signify a "subject" 
  - Connotative terms (like "white" or "virtuous") denote subjects AND imply an attribute
  - Mill defines "subject" as "anything which possesses attributes" - which sounds like individual entities rather than universals

  The TA seems caught on three main issues:
  1) What Mill means by "subject" vs "attribute"
  2) Whether Mill's non-connotative names are proto-rigid designators
  3) How Mill would handle Kripkean examples like "Hesperus is Phosphorus"

  Hmm, the friend's "Mill's Rigid-Designator Test" is clever but probably anachronistic. Mill isn't doing modality here at all - he's making a semantic distinction about how words hook onto the world. When Mill says "John" signifies a subject only, he's emphasizing that proper names lack descriptive content by themselves. But crucially, Mill isn't denying we use descriptions to identify bearers (e.g., "the philosopher who taught Alexander" for Aristotle). He's just saying the name itself doesn't carry that meaning. 

  For Kripkean cases, Mill would likely say "Hesperus" and "Phosphorus" are both non-connotative names for Venus. Discovering their identity wouldn't involve analyzing meanings (since names have no connotation) but would be an empirical discovery about the bearer. This actually anticipates Kripke's anti-descriptivism, though without the modal framework. 

  The TA's skepticism is justified - slapping "rigid designator" onto Mill oversimplifies both thinkers. But there's a deeper connection: Mill's non-connotative names are Kripkean rigid designators' great-grandfathers. Both reject descriptivism, but Mill lacks the possible worlds machinery. The heuristic might work pedagogically if framed as "Mill sets the stage for Kripke by separating reference from description," but shouldn't be presented as equivalent. 

  I should emphasize that Mill's "subject" is pre-Fregean - it's not about sense/reference but about logical subjects of predication. And his denial of connotation for proper names is purely semantic, not metaphysical like Kripke's necessity claims. 

  For teaching, I'd suggest: "Mill gives us the raw materials Kripke later assembles into rigid designation. The names are 'rigid' in embryonic form - pointing without describing - but Mill hasn't yet built the modal scaffolding around them."
answer: |-
  Let's break down Mill's passage and its relation to Kripke step by step, addressing your specific questions:

  ### 1. **Mill's "Subject" vs. "Attribute" and Proper Names**
     - **Subject**: For Mill, a "subject" is any concrete individual entity that *possesses attributes* (e.g., a person, city, or object). "John" or "London" are names for specific, individual bearers of properties.
     - **Attribute**: An abstract quality or characteristic (e.g., whiteness, virtue) that can be instantiated by multiple subjects.
     - **Why "John" ≠ "Virtuous"**:
       - "John" is non-connotative: It *only* picks out a specific subject (the person John) without implying any defining attributes. It has no inherent descriptive content.
       - "Virtuous" is connotative: It denotes *all* subjects possessing the attribute of virtue (Socrates, Howard, etc.) and *connotes* the attribute itself. The term's meaning depends on the attribute it implies.

     Mill emphasizes that "England" (a proper name) signifies a single subject, not a class. Though England has attributes (e.g., being a nation), the *name itself* doesn't describe them—it merely tags the individual entity.

  ---

  ### 2. **Is Mill Committed to Rigid Designation?**
     **No—and your skepticism is justified.** Here's why:
     - **Semantic vs. Modal Distinction**:
       - Mill is focused on **semantics**: Non-connotative names lack descriptive meaning (connotation) and function as labels. They denote a subject directly, without mediation by attributes.
       - Kripke is focused on **modality**: Rigid designators refer to the same object in *all possible worlds* where it exists. This is a claim about counterfactual scenarios, not just semantic content.
     - **Key Difference**:
       - Mill denies that names have *meaning* (connotation), but he **doesn't address how reference is fixed across possible worlds**. For Mill, "John" just labels John—full stop. Kripke adds the modal layer: "John" labels John *in every conceivable scenario* (e.g., if John were a baker, not a philosopher).
     - **Weaker Claim**: Mill's non-connotative names are **proto-rigid** in that they lack descriptive content, but they lack Kripke's modal dimension. They’re "rigid" only in the *actual world* by default, not by necessity across worlds.

     **Verdict on "Mill's Rigid-Designator Test"**:  
     It's a useful *heuristic* for highlighting the anti-descriptivist overlap between Mill and Kripke, but it's **anachronistic and potentially misleading**. Mill isn’t doing modal logic—he’s rejecting descriptive *meanings* for names, not defining their behavior in possible worlds.

  ---

  ### 3. **Kripkean Examples in Mill's Framework**
     Take "Hesperus is Phosphorus" or "Water is H₂O":
     - **Non-Connotative Names**: For Mill, "Hesperus" and "Phosphorus" are **proper names** (like "John" or "London"). They signify celestial subjects *without* connoting attributes. They don’t mean "the evening star" or "the morning star"—they’re just tags for objects.
     - **Discovery of Identity**: 
       - We might *fix reference* using descriptions (e.g., "Hesperus = the brightest object in the evening sky"). But for Mill, these descriptions **aren't part of the name's meaning**; they’re practical tools for identification.
       - Discovering "Hesperus is Phosphorus" reveals an empirical fact about the *subject* (Venus), not a conceptual truth. The names themselves remain non-connotative labels.
     - **Necessity?**: Mill has no framework for necessity—his distinction is purely semantic. "Water is H₂O" would be an empirical discovery about the attributes of the *subject* we tag as "water." The necessity Kripke identifies wouldn’t register for Mill.

  ---

  ### **Key Takeaway for Teaching**
  - **Mill’s Core Insight**: Proper names are "tags" with no semantic content. This **anticipates Kripke’s anti-descriptivism** but stops short of rigidity.
  - **Pedagogical Suggestion**: Use Mill to show the *historical roots* of anti-descriptivism. Then contrast:
    - Mill: "Names don’t describe; they label."
    - Kripke: "Names label the same thing in every possible world—and that’s why 'Hesperus = Phosphorus' is necessary."
  - **Avoid Overstatement**: Frame your friend’s heuristic as a *creative bridge* ("Look how close Mill gets!") but emphasize that Kripke’s modality is a revolutionary addition.

  **TL;DR**: Mill gives us non-descriptive reference; Kripke adds modality. The "Rigid-Designator Test" is a fun but ahistorical shortcut—use it cautiously to spark discussion, not as scholarly truth. And your coffee-fueled instincts are spot-on! ☕
