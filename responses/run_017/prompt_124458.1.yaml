  First, I need to understand their core argument. They're shifting focus from actions (sending telegrams) to outcomes (telegrams arriving), which makes sense when there's noise. The math checks out: scaling up participation compensates for lost telegrams. But this isn't just math—it's a philosophical pivot toward outcome-oriented rationality, which challenges decision-theory norms.

