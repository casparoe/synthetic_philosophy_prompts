  Couplet should mirror their sacrifice: "To claim the light exists—that I allow. / But ask which bulb is lit? I can't say now." Keeps it physical while naming the exact inference rule abandoned. 

  Biggest risk is over-explaining. Must trust the imagery: N's duality ("ghost of 'might'") and the checker's mechanical limits ("gears won't spin on 'maybe'") should do heavy lifting. Their "wince if inaccurate" warning means triple-checking that ¬¬(P∨¬P) remains constructively valid while P∨¬P doesn't. 

