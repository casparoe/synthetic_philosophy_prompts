answer: |-
  Here's the joke designed for your constraints:

  > After my friend said that photo wasn't him anymore, I started thinking about sitting down. When I sit in a chair, am I the *whole* person who walked into the room? Or is the "sitter" just a part of a longer "sitting-event" – the part where my legs are bent?  
  >  
  > So, I asked a perdurantist friend: "How many things are in this chair right now?" He sighed: "Well, technically, only a small temporal slice of you is sitting. But since your slices are chunky – waking life to deep sleep – let's call it one *phase* of you."  
  >  
  > Then I asked an endurantist: "How many things are in this chair?" He smiled: "Just you, wholly present! That earlier 'walking-phase' wasn’t a different thing – it was also wholly you, just... straighter."  
  >  
  > So now I don’t know if I’m sitting here as a *fragment* of a timeline, or as the *entire* person who used to be straight. Either way, it seems I’m not *really* the one who bent. The change happened to... something else.

  **How it works & why it lands:**  
  This joke adopts the perdurantist ("slicing") view first (counting only a temporal part as present), then contrasts it with the endurantist ("wholly present") view. The punchline highlights your suspicion: both theories "explain away" change by making *you* (the entity experiencing the bend) vanish – either you're just an *instant-phase* that didn’t change (perdurantism), or you’re the *whole entity* that was always bent *now* (endurantism). The "chunky slice" nod satisfies your third constraint, while the chair makes the metaphysics tangible for newcomers.
