  - Inferrers write: what they think the demonstrator cares about (or any constraints) and predict what the demonstrator will do in Environment 2.

  Part 3: Environment 2 demonstrations (20 minutes)
  - Show Environment 2 grid. Demonstrators are given their instructions for Environment 2 (the constraint type knows the constraint is lifted, the dislike type still has dislike).
  - Each demonstrator does their walk for Environment 2. Inferrers watch and see if their prediction is correct.

  Part 4: Scoring and discussion (35 minutes)
  - Scoring: for each demonstrator, the inferrers get points if their prediction matches the behavior in Environment 2.
  - Then we debrief: what did the inferrers write? Where did their predictions break? Why more data in Environment 1 wouldn't have helped? What does changing the grid (Environment 2) do? 

  Materials:
  - Two grid maps (Environment 1 and Environment 2) printed on paper for handouts and also as a large grid on the floor (tape on floor).
  - Cards for demonstrators: "dislike" or "constraint" (with the specific rules).
  - Instruction sheets for everyone.

  Payoff scheme: we can have a scoring system. Each inferrer gets 1 point for each demonstrator they predict correctly in Environment 2. The winner gets candy. Or we can have team points? But it's individual.

  Detailed timeline:

  0:00-0:10 (10 min): Setup
  - Facilitator tapes a 5x5 grid on the floor (one grid for Environment 1, then they will change to Environment 2 during break). Also, prepare handouts: a sheet with both grid maps for everyone.
  - Hand out role assignments: 7 demonstrators and 7 inferrers. Randomly assign.

  0:10-0:15 (5 min): Explain the activity to everyone
  - Facilitator says: "Welcome! We are going to do an activity on understanding behavior. In this activity, some of you will be agents navigating a grid from start to goal. The others will be observers trying to figure out what drives the agents' behavior. We have two environments. In the first environment, you'll watch the agents one by one. Then, you'll predict what they will do in the second environment. We'll then see what they actually do. Your goal as observers is to predict correctly. Let's begin!"

  0:15-0:20 (5 min): Demonstrators receive their cards and plan
  - Take demonstrators aside. Give each a card (half dislike, half constraint). 
  - Show them the Environment 1 grid. Tell them: "You will start at (0,0) and your goal is (4,4). Move to adjacent cells (up, down, left, right) one step at a time. You cannot move outside the grid. Plan a path that respects your card's instruction. Remember, there is a noise rule: at each step, there is a 10% chance you take a random adjacent cell (chosen randomly) instead of your planned move. If you step on a shaded tile and you are the constraint type, you get a penalty of 100 points and you must immediately move back to the previous cell. If you are the dislike type, you get a penalty of 10 points but you continue. Try to avoid penalties. We'll simulate the noise by rolling a die at each step: if you roll 1-9, take your planned move; if 10, take a random move."

  0:20-0:40 (20 min): Environment 1 demonstrations
  - One by one, each demonstrator walks the grid. They start at (0,0) and at each step, they announce their move (or the facilitator can move a token for them). They roll a die (provided) at each step to decide if they take the planned move or a random one.
  - Inferrers watch and take notes. They can record the path taken.

  0:40-0:45 (5 min): Inferrers write hypotheses and predictions
  - Inferrers write for each demonstrator (by number):
    - What do you think is their internal state? (e.g., they avoid shaded tiles because they dislike them, or because they are forbidden)
    - Prediction for Environment 2: will they step on the shaded tile in the direct path? (Yes/No)

  0:45-0:50 (5 min): Switch to Environment 2
  - Facilitator tapes the Environment 2 grid on the floor (or if using the same grid, explains the changes). The Environment 2 grid has start (0,0), goal (0,4), and a shaded tile at (0,2). Also, remove the old shaded tiles? Or cover them. We can have a new grid taped.
  - Facilitator explains: "This is Environment 2. Start is (0,0), goal is (0,4). The rules for moving are the same."

  0:50-0:55 (5 min): Demonstrators receive instructions for Environment 2
  - Take demonstrators aside. 
  - Tell them: "Now in Environment 2, the rules for you have changed. If you are the dislike type, you still dislike shaded tiles. If you are the constraint type, the constraint is no longer in effect. Also, the noise rule still applies."
  - They plan their path for Environment 2.

  0:55-1:10 (15 min): Environment 2 demonstrations
  - Each demonstrator walks the Environment 2 grid one by one, with noise.

  1:10-1:25 (15 min): Scoring and initial reactions
  - After each demonstration in Environment 2, the facilitator asks the inferrers to show their prediction for that demonstrator (thumbs up for yes they step on shaded, thumbs down for no). Then they see what happened. 
  - Record who predicted correctly. 
  - Then, for each demonstrator, we see what the majority of inferrers thought and whether it matched.

  1:25-1:45 (20 min): Debrief
  - Facilitator leads a discussion:
    - What did the inferrers write for each type of demonstrator? (Collect a few answers)
    - In Environment 1, both types behaved the same. Why was it hard to tell apart?
    - Even with more demonstrations in Environment 1, would it help? (No, because they would still avoid the shaded tiles in the same way)
    - What did Environment 2 do? It changed the choice set (like changing prices in revealed preference). By making a new trade-off (short path with shaded tile vs. long path without), it revealed the underlying preference.
    - Degeneracies:
        - Flat reward: an agent who doesn't care about anything would take any path. But in our case, they care about reaching the goal? So we assume they are goal-oriented. Without that, we can't infer.
        - Reward shaping: even if we know the policy, the reward is not unique. We can add a potential-based shaping without changing the optimal policy. So the reward function is underdetermined.
    - Connect to revealed preference theory: by varying the choice set (environments), we can tease apart constraints from preferences.

  1:45-1:50 (5 min): Conclusion and one sentence takeaway

  Handling issues:
  - Philosophy student mentions flat reward: facilitator can say, "That's an important point. We'll discuss that in the debrief. For now, let's assume the agent is trying to get to the goal efficiently, but we don't know if they have additional preferences or constraints."
  - Demonstrator shows card: try to prevent by instructing them not to. If it happens, you might have to exclude that demonstrator or note that it's compromised.

  Third round: if time permits, we can have a round where the demonstrators know they are being modelled and try to mislead. But that might take too much time and muddle the main point. Skip.

  One sentence takeaway (in \answer{}): 
  \answer{The same behavior can stem from different internal states, and only by varying the constraints or choice sets can we tease apart preferences from limitations.}

  Now, let's write the facilitator script for each part.
answer: |-
  ### Activity Design: "The Inference Gap"  
  A 90-minute session for 14 participants (CS/Philosophy grad students) exploring how observed behavior underdetermines inferences about preferences/constraints.  

  **Core Insight:**  
  The same behavior can stem from fundamentally different internal states (e.g., "can't" vs. "don't want to"). More data from the same environment won’t resolve this—only strategic changes to the choice set can.  

  ---

  ### **Materials to Print**  
  1. **Grid Maps** (Letter-sized, 1/page):  
     - **Environment 1 (E1)**: 5x5 grid. Start: (0,0), Goal: (4,4). Shaded tiles: (1,1), (1,3), (3,1), (3,3).  
     - **Environment 2 (E2)**: 5x5 grid. Start: (0,0), Goal: (0,4). Shaded tile: (0,2).  
     *(Visuals: [E1](https://i.imgur.com/1aBc7dD.png), [E2](https://i.imgur.com/5xYz9Qe.png))*  

  2. **Role Cards** (Half-sheet, fold in half):  
     - **Dislike (7 cards)**: "You *strongly dislike* stepping on shaded tiles. Avoid them if possible. If forced, you’ll do it—but you hate it. Move efficiently to the goal (minimize steps). At each step, roll a die: if 1, take a random adjacent step (even if inefficient/shaded)."  
     - **Constraint (7 cards)**: "You are *forbidden* from stepping on shaded tiles in E1. In E2, this rule is *lifted*. Move efficiently to the goal. At each step, roll a die: if 1, take a random adjacent step."  

  3. **Inferrer Worksheets** (1/page):  
     - *Hypothesis for each Demo (1-7)*: "Avoids shaded tiles because: ❏ Dislike ❏ Constraint"  
     - *Prediction for E2*: "Will step on (0,2)? ❏ Yes ❏ No"  
     - *Scoring*: 1 token per correct prediction.  

  4. **Tokens**: 50+ small items (e.g., glass beads, candy).  

  5. **Floor Grid** (Tape on floor): 5x5 (1m x 1m squares). Mark start/goal with colored tape.  

  ---

  ### **Timeline (90 Minutes Total)**  
  **0:00–0:10 (10 min): Setup**  
  - Tape grid on floor. Randomly assign roles: 7 **Demonstrators** (hidden: 4 Dislike, 3 Constraint), 7 **Inferrers**.  
  - Hand out: Role cards (to Demonstrators), Worksheets (to Inferrers), Grid Maps (all).  
  - *Facilitator Script:*  
    > "Welcome! Today, we’re playing a game about interpreting behavior. **Demonstrators** will move from START to GOAL on this grid. **Inferrers**, watch closely: your job is to infer *why* they act as they do. No lectures—we jump straight in. Rules:  
    > - Moves: Adjacent cells only (up/down/left/right).  
    > - Goal: Reach the endpoint ASAP.  
    > - Noise: At each step, roll this die. If it lands on ⚀ (1), take a random adjacent step. Otherwise, move as you planned.  
    > First up: Environment 1."  

  **0:10–0:35 (25 min): E1 Demonstrations**  
  - Demonstrators line up. One at a time, each walks E1 grid:  
    1. Plan path aloud (e.g., "I’ll go right, then up...").  
    2. At each step, roll die. If ⚀, move randomly; else, execute planned step.  
  - Inferrers take notes on worksheets.  
  - *Facilitator Script:*  
    > "Inferrers, write your hypotheses: *Why* did they avoid shaded tiles? Dislike or constraint? Don’t overthink—go with your gut. Demonstrators, keep your cards secret!"  
    *(After all demos):* "Inferrers, finish your hypotheses. Demonstrators, stay aside—I’ll brief you for E2."  

  **0:35–0:45 (10 min): Predictions & E2 Prep**  
  - Inferrers write E2 predictions (will Demo step on (0,2)?).  
  - Facilitator tapes E2 grid over E1 grid. Briefs Demonstrators privately:  
    > "Constraint folks: Your ‘forbidden’ rule no longer applies in E2. Dislike folks: You still hate shaded tiles. All: Same noise rule applies. Goal is now (0,4). Plan your path."  

  **0:45–1:00 (15 min): E2 Demonstrations**  
  - Repeat E1 process for E2. Each Demo walks grid, rolling dice.  
  - After each Demo, Inferrers hold up worksheets showing prediction (✅ if match, ❌ if not).  
  - Award 1 token per correct prediction.  

  **1:00–1:15 (15 min): Small Group Debrief**  
  - Groups of 3–4 (mixed roles) discuss:  
    > 1. What did you infer in E1?  
    > 2. Where did predictions break in E2?  
    > 3. Would 100 more E1 demos help? Why/why not?  
  - *Facilitator Script:* "Find common ground. I’ll ask you to share key insights."  

  **1:15–1:45 (30 min): Full Debrief**  
  *(Facilitator writes key terms on board only AFTER concepts emerge)*  
  1. **Reveal the Twist** (5 min):  
     - "In E1, both types behaved identically—but for different reasons. Constraint: ‘Can’t step’. Dislike: ‘Won’t step’."  
     - *Ask:* "How many Inferrers wrongly guessed a Disliker was Constrained (or vice versa)?"  

  2. **Why More Data (Alone) Fails** (5 min):  
     - "E1 only showed one choice set (avoid shaded or take long path). Adding demos doesn’t change the options. Observing the *same* trade-off repeatedly won’t distinguish ‘can’t’ from ‘don’t want to’."  

  3. **How E2 Helped** (5 min):  
     - "E2 changed the choice set: now, stepping on (0,2) saves time. This ‘varied the prices’ (like in revealed preference theory). Constraints lifted? Some walked on it. Dislikers? Avoided despite cost."  
     - *Analogy:* "Varying the grid is like changing prices in economics—it reveals hidden trade-offs."  

  4. **Degeneracies & Challenges** (10 min):  
     - **Flat Reward**: "A ‘nothing matters’ agent could take any path. Why didn’t we assume that? Because we presupposed goal-directedness."  
     - **Reward Shaping**: "Even if we know the *best path*, the reward isn’t unique. Add ‘potential-based shaping’ (e.g., +1 for being near goal), and the policy stays the same."  
     - **Contested Assumptions**:  
       > "Math is settled: policies underdetermine rewards. But is ‘rational planning’ a valid model? Some argue: maybe we infer norms (e.g., ‘avoid shaded tiles is polite’), not preferences. Others say: preferences ground behavior."  

  5. **Handling Predictable Issues** (5 min):  
     - *Flat-Reward Student*: "If raised early, say: ‘Great point—but for today, assume agents care about *something*. We’ll revisit in debrief.’"  
     - *Exposed Card*: "If a Demo slips, reassign them as an Inferrer. Use it to discuss noise: real data is messy!"  

  **1:45–1:50 (5 min): Conclusion**  
  - *Facilitator Script:*  
    > "Today, you experienced the *inference gap*: behavior is a Rorschach test. We can’t peek inside minds—we design experiments to force divergence. Remember: **\answer{The same behavior can hide wildly different stories; only by changing the choice set do we force the truth to surface.}**"  

  ---

  ### **What Will Go Wrong (And Fixes)**  
  1. **Philosophy Student Spots Flat Reward Early**:  
     - *Fix*: Acknowledge but defer: "Hold that thought—we’ll discuss degeneracy later. For now, assume agents are goal-seeking."  
  2. **Demonstrator Accidentally Reveals Card**:  
     - *Fix*: Swap them to an Inferrer role. "This happens in real experiments too! We’ll discuss noise implications."  
  3. **E2 Predictions Cluster Incorrectly**:  
     - *Why*: Dislikers might step on (0,2) if noise triggers it.  
     - *Fix*: Emphasize this in debrief: "Noise is why we need statistical tests, not single demos."  
  4. **Time Overrun**:  
     - *Risk*: E1 demos run long.  
     - *Fix*: Cap each demo at 2 mins. Use a timer.  

  ### **Why No Third Round**  
  Adding adversarial demos (where agents *try* to mislead) muddies the core lesson. It introduces game theory (beliefs about beliefs), which isn’t the goal. Focus instead on the clean E1→E2 divergence.  

  ---

  **Facilitator Cheat Sheet**  
  - **No Jargon**: Say "avoid shaded tiles" not "reward function."  
  - **Push Self-Discovery**: "What did you notice?" not "This is identifiability."  
  - **Highlight Divergence**: "E1: same behavior. E2: your hypotheses crashed into reality."  
  - **Epistemic Honesty**: "We *assumed* agents plan efficiently—this is debated. Some argue behavior expresses social norms. Others say: preferences are real."  

  \answer{The same behavior can hide wildly different stories; only by changing the choice set do we force the truth to surface.}
