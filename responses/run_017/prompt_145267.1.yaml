prompt: |-
  I serve on a body that has to recommend a design for publicly funded parental leave, and I find that I have firm reactions to individual cases and no settled account of what they add up to. I am not asking for comparative data, statutory surveys, or citations; I want the shape of the justification, stated precisely enough that I could defend it to someone who disagrees. Here are my verdicts, given on cases as they come to me.

  (a) A dual-earner couple, six months of paid leave available. I want three months reserved to each parent and non-transferable, and I hold this even where both parents freely agree that the mother should take all six. I dislike the freely divisible version a lot, not slightly.

  (b) The same couple, except that the second parent has died in childbirth, or has been absent since before the birth and cannot be located. I want the full six months available to the surviving parent. I can see this strains against (a): if I am willing to override a couple's own agreement in (a), why does the absent parent's share become available on the same facts plus an absence?

  (c) A parent takes the full paid leave and resigns in the week after it ends. I oppose any clawback or repayment condition. The benefit is theirs to keep, and I hold this even though the leave plainly failed to preserve the attachment to that employer.

  (d) A self-employed or platform-work parent with no contribution record and patchy earnings documentation. I want a floor entitlement funded from general revenue, available on something like self-certification. I hold this despite thinking the verification problem is real, and despite the fact that the case for an insurance-style benefit seems weakest exactly here.

  (e) A parent who places the child in full-time daycare for the whole of the paid-leave period and returns to work. I recoil; this strikes me as misuse. A parent who works remotely for their employer during the leave period strikes me as worse still. I cannot say what rule I would write to catch either one.

  (f) A parent who spends the paid-leave period in full-time retraining, while the other parent provides the care. I have no objection at all. I notice that in both (e) and (f) the recipient is not providing care, and that in (f) the recipient is not even at home, and yet my reactions differ sharply.

  (g) The replacement rate. I want earnings-relatedness in the middle of the distribution, a cap at the top so that a very high earner receives a lower replacement rate, and a floor at the bottom high enough that a low earner can actually afford to take the leave — which means the benefit is not insurance-like at either end. This sounds to me like three different principles bolted together, but I am unwilling to give up any of the three.

  (h) A stillbirth at thirty-eight weeks. I want the leave to stand in full, undiminished.

  (i) The adoption of a seven-year-old from foster care. I want more leave than for a newborn, not less, even though there is no pregnancy and no infant care.

  (j) A gestational surrogate who is not a legal parent of the child. I want no parental leave for her, but paid time for physical recovery from the birth. I hold both halves confidently and am not sure they are consistent.

  The case I keep reversing on: a household of three adults raising the child — two legal parents and a live-in relative who is the child's primary daytime caregiver. Should the reserved quota divide into three non-transferable shares? Dividing it seems to follow directly from whatever makes me endorse (a); refusing to divide it seems right because I do not want the state deciding how many caregivers count. I go back and forth within a single conversation.

  My own attempt at a principle, which I suspect is wrong: paid leave is justified exactly insofar as it neutralizes two distortions — the statistical discrimination that leads employers to discount a young woman's career, and the intrahousehold bargaining that pushes the lower-earning parent out of the labor market — and no further. This handles (a) beautifully and predicts my reaction to (c), but it seems to imply that once the discrimination were gone the policy should collapse into an unconditional cash transfer, which I reject, and it has nothing obvious to say about (h) or (i).

  What I would like from you: a principle, or at most three candidate principles, stated precisely, with the case that motivates each clause; its verdicts on cases I have not listed — a parent who was not in paid work before the birth and never intended to be, a second child born eleven months after the first, and a parent who uses the leave to care for a newly disabled partner rather than for the child; and an honest statement of which of my verdicts each candidate cannot accommodate, especially among (a)/(b) and (c)/(e)/(f), where I expect I am holding something indefensible. If the principle has implications for who should bear the cost rather than only for what parents should receive, say what they are.
reasoning: |-
  Hmm, the user is serving on a body that needs to recommend a parental leave design, and they're struggling to reconcile their strong intuitive reactions to specific cases with a coherent underlying principle. They've listed several scenarios (a through j) where they have firm judgments but recognize tensions between them. They've also proposed their own principle about neutralizing discrimination and bargaining distortions, but see its limitations.

  The user is clearly intellectually rigorous - they identify contradictions in their own positions, like the tension between (a) and (b), or why they react differently to (e) and (f) when neither involves direct caregiving. They're not looking for data but for philosophical coherence. Their frustration comes through in phrases like "I recoil" and "I dislike... a lot, not slightly."

  Key tensions I notice:
  - Their principle explains (a) and (c) well but fails for cases involving care needs (h,i) or non-traditional families (the three-adult household dilemma)
  - They want to enforce caregiving in (e) but not in (f) - the retraining case
  - They're firm on death/absence (b) but not on voluntary absence
  - They care about physical recovery (j) but also non-physical needs like adoption (i)

  The surrogate case (j) is particularly telling - they instinctively separate biological recovery from parental care, which suggests their underlying concerns might be multidimensional. Similarly, the adoption case (i) shows they value bonding time regardless of infancy.

  For their unresolved three-adult household case: the dilemma stems from whether the policy should recognize functional caregiving relationships beyond legal parenthood. Their principle in (a) pushes toward recognizing all caregivers, but practical concerns about state overreach hold them back.

  The core challenge is balancing multiple distinct goods: gender equity, child welfare, caregiver autonomy, labor protection, and physiological recovery. No single principle captures all these, which explains why their current rationale feels insufficient.
answer: |-
  Based on your verdicts, I propose one core principle and two complementary principles, designed to capture the consistency within your judgments while highlighting where tensions remain. The core principle directly addresses most cases, with the complementary principles resolving specific tensions (especially (a)/(b) and (c)/(e)/(f)).

  **Core Principle: The Parental Leave Entitlement Secures Foundational Conditions for Family Formation and Caregiver Equity.**
  *   **Motivated by:** (a) Non-transferable quotas, (i) Enhanced leave for older child adoption, (j) Separate recovery for surrogates, (h) Leave after stillbirth.
  *   **Justification:** Paid parental leave is not primarily compensation for lost wages (though it enables time off) or a pure child welfare measure (though it facilitates care). It is a societal investment in the foundational act of forming and integrating a new family member (biological or adopted) and ensuring the equitable participation of all primary caregivers in this process and the labor market. This recognizes:
      *   The profound physical, emotional, and logistical demands of integrating a child.
      *   The societal interest in stable, bonded families.
      *   The inherent risk of caregiving responsibilities falling disproportionately on one parent (usually the mother) absent structural support, leading to long-term labor market inequities.
  *   **Key Elements:**
      1.  **Family Formation Focus:** The entitlement arises from the *event* of adding a child to the family unit (birth, adoption), not solely from the need for infant care or physical recovery.
      2.  **Caregiver Equity:** Aims to prevent/remedy the systematic marginalization of any primary caregiver (typically mothers) from the labor force by facilitating their continuous connection and enabling *all* primary caregivers to participate meaningfully in early family life.
      3.  **Securing Foundational Time:** Provides protected time *for* the primary caregivers to establish bonds, manage transitions, and make critical care arrangements, without mandating how that time is used *day-to-day* (within broad limits).

  **Complementary Principle 1: Physiological Recovery is a Distinct Entitlement.**
  *   **Motivated by:** (j) Surrogate's recovery leave, (h) Implicit recognition that leave stands even if care need shifts (stillbirth).
  *   **Justification:** The physical process of pregnancy and childbirth imposes unique medical needs requiring protected recovery time. This is separable from, though often concurrent with, the family formation entitlement.
  *   **Relation to Core:** Explains why a surrogate (j) gets recovery but not parental leave, and why leave stands after a stillbirth (h) – the family formation event occurred, and the physical recovery need remains.

  **Complementary Principle 2: The Entitlement Belongs to the Caregiver for Foundational Purposes.**
  *   **Motivated by:** (c) No clawback, (f) Acceptance of retraining, (d) Universal floor entitlement, (g) Structure of benefits.
  *   **Justification:** The leave is an individual entitlement granted to the primary caregiver(s) to secure the foundational conditions (Core Principle). Once granted, it is *their* resource to use as they judge necessary to achieve stability and manage the transition, supporting their autonomy within the purpose.
  *   **Key Elements:**
      1.  **Autonomy in Use:** The caregiver decides how best to use the time to achieve foundational stability (bonding, arranging care, recovery, retraining for re-entry). This explains (f) vs. (e) – retraining directly supports labor market reconnection and stability, while outsourcing care entirely or working remotely *during the protected leave window* undermines the core purpose of dedicating this specific time to foundational establishment. *(Note: This is the tension point with (e)).*
      2.  **Non-Forfeiture:** The entitlement is granted based on the qualifying event and status. How the caregiver uses it (c - quitting after) or their employment history (d - self-employed) doesn't negate the underlying need met by the entitlement. It's not a wage replacement *contract* but a foundational support.

  **How the Principles Handle Your Verdicts:**

  *   **(a) Non-transferable quotas:** Directly mandated by **Caregiver Equity** within the Core Principle. Prevents intra-household bargaining from undermining equity.
  *   **(b) Absent parent's share available:** **Core Principle (Family Formation Focus)** triggers the full entitlement for the household due to the event. **Caregiver Equity** is satisfied because there is only *one* available primary caregiver to potentially marginalize. The non-transferability rule exists to structure choices *between* caregivers; it doesn't reduce the total entitlement *available to the family unit* when only one caregiver exists. The *foundational need* for the child remains.
  *   **(c) No clawback:** **Complementary Principle 2 (Autonomy/Non-Forfeiture)**. The entitlement was granted for the foundational period; its use doesn't guarantee future employment, but it served its purpose for that period.
  *   **(d) Floor for self-employed:** **Core Principle (Foundational Conditions)** applies regardless of employment type. **Complementary Principle 2 (Non-Forfeiture)** – entitlement stems from the event, not insurance contributions. Funded by general revenue as a societal investment.
  *   **(e) Full-time daycare/remote work:** *Conflict Point.* **Complementary Principle 2 (Autonomy)** suggests flexibility, but **Core Principle (Securing Foundational Time)** implies the time should be *used* by the caregiver for foundational purposes. Outsourcing *all* care or working full-time *during this specific protected period* arguably fails to serve the purpose of dedicating time to establish the caregiver-child bond and family routines – it treats the leave as pure income replacement. A rule might focus on "primary responsibility" or prohibit significant paid work/formal childcare during leave hours, but defining this is hard.
  *   **(f) Retraining:** Supported by **Complementary Principle 2 (Autonomy)** and **Core Principle (Caregiver Equity)** – retraining directly supports stable labor market (re)integration for the caregiver, a core equity goal, using the foundational time effectively.
  *   **(g) Benefit structure:** **Core Principle (Caregiver Equity)** supports earnings-relatedness to maintain living standards and attachment. The cap reflects societal solidarity limits/public cost control. The floor reflects **Core Principle (Foundational Conditions)** – enabling *all* caregivers to take leave is fundamental, requiring adequacy over strict proportionality.
  *   **(h) Stillbirth:** **Core Principle (Family Formation Focus)** – the event occurred. **Complementary Principle 1 (Physiological Recovery)** – recovery is needed. Foundational time is needed for emotional processing and recovery.
  *   **(i) Adoption (older child):** **Core Principle (Family Formation Focus)** strongly affirmed. Integrating an older child from foster care often involves *greater* initial challenges (attachment, trauma, systems navigation), justifying *more* foundational time, not less.
  *   **(j) Surrogate:** **Complementary Principle 1 (Physiological Recovery)** mandates recovery leave. **Core Principle** does not apply as she is not forming a family with the child.

  **Handling New Cases:**

  1.  **Parent not in paid work pre-birth, never intended:** **Core Principle (Foundational Conditions/Caregiver Equity)** applies. They are a primary caregiver integrating a child. **Complementary Principle 2 (Non-Forfeiture)** – entitlement based on event/role. They receive the floor entitlement (g) to support foundational time. *(Verdict: Entitled to leave, likely at floor level)*.
  2.  **Second child born 11 months after first:** **Core Principle (Family Formation Focus)** applies per child. Entitlement is triggered by each new child's integration. Foundational time is needed for each new family member. *(Verdict: Full new entitlement for the second child)*. Overlap is a practical implementation issue (e.g., cannot take leave concurrently for both if it exceeds total available per parent).
  3.  **Leave used to care for newly disabled partner (not child):** *Outside Scope.* The **Core Principle** is triggered by adding a *child*. Caring for a disabled partner, while important, is a different need (more akin to sick/caregiver leave). This wouldn't qualify under parental leave. *(Verdict: Not covered by parental leave entitlement)*.

  **Who Bears the Cost?**
  The principles imply societal obligation. Funding should primarily come from **general revenue or broad-based social insurance pools**, not solely from employers of new parents. This aligns with the "societal investment" view (Core Principle), prevents discrimination against hiring potential parents (Caregiver Equity), and supports non-traditional workers (d). Employer mandates can create perverse incentives (discouraging hiring).

  **Honest Tensions & Indefensible Positions:**

  *   **Major Tension: (a)/(b) Logic:** The principles resolve this by grounding non-transferability in *equity between available caregivers* (a), not in a fixed per-parent entitlement. When only one caregiver exists (b), the full family entitlement flows to them. The state isn't "overriding" the absent parent; the *condition requiring allocation* (multiple caregivers) is absent.
  *   **Major Tension: (c)/(e)/(f):** This is the hardest cluster. The principles *mostly* support your verdicts but expose the difficulty in (e):
      *   **(c) No Clawback:** Strongly supported (Entitlement served its purpose for the period).
      *   **(f) Retraining:** Strongly supported (Directly serves equity & foundational stability).
      *   **(e) Daycare/Remote Work:** The principles *lean against* this, especially full-time daycare or full-time remote work *during designated leave hours*. **This is the weakest point.** Your "recoil" suggests an intuition that the leave period should involve *primary caregiver engagement*. However, defining and enforcing this is pragmatically difficult and risks intrusive oversight. A defensible but imperfect position might be: "The leave period is reserved for the caregiver to be *primarily responsible* for the child's well-being and integration. Significant delegation of this responsibility (full-time formal daycare) or significant engagement in other work *during this period* contradicts the purpose." But policing "significant" is messy. Remote work *for the employer* is clearer to prohibit as incompatible with being "on leave."
  *   **Three-Adult Household:** The principles suggest **not dividing into three non-transferable shares**. **Why:** The Core Principle focuses on "primary caregivers" forming the family. The state recognizes *legal parents* as the default primary caregivers with the entitlement. Adding a third, non-legal, live-in relative as a mandatory quota holder oversteps. The *equity* concern (a) is between the *legal parents*. The household can use the transferable portion (if any) to support the relative's role *if they choose*. This avoids the state defining family structures while protecting the core equity goal between recognized parents. *(Verdict: Entitlement split between two legal parents as per (a); household decides if relative gets time via transferable portion).*

  **Conclusion:**

  Your reactions are most coherently explained by viewing parental leave as a **societal investment in securing the foundational conditions for integrating a new child and ensuring equitable participation for all primary caregivers**, combined with a **distinct recognition of physiological recovery needs** and the **autonomy of the caregiver in using the entitlement to achieve foundational stability**.

  This framework:
  *   Explains non-transferability (a), adoption needs (i), surrogate distinction (j), stillbirth (h), no clawback (c), and self-employed inclusion (d).
  *   Resolves the (a)/(b) tension logically.
  *   Justifies the benefit structure (g).
  *   Explains the difference between (e) and (f) (retraining serves core goals; full-time delegation undermines them), though (e) remains a practical enforcement challenge.
  *   Provides clear answers to new cases.
  *   Argues for societal funding.

  The core tension with (e) highlights the difficulty in balancing caregiver autonomy with the intended purpose of the protected time. Your intuition that full-time outsourcing *during the leave period* violates the spirit is defensible within the principles, but crafting a workable rule requires careful, practical compromise.
