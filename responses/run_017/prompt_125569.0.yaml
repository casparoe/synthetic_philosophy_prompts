answer: |-
  ### 1. Question (250 words)  
  **Decision-Making Under Moral Uncertainty**  
  You face a choice among three options:  
  - **A** yields 10 utilons (if utilitarianism is true) or 0 deontic units (if deontology is true).  
  - **B** yields 0 utilons or 100 deontic units.  
  - **C** yields 100,000 utilons with 1% probability (else 0) but is strictly forbidden under deontology (value = -∞).  

  Your credence is 0.6 in utilitarianism (U) and 0.4 in deontology (D). The *aggregation rule* rescales each theory’s values by dividing by the standard deviation (SD) of its values across the menu, then maximizes the credence-weighted sum of rescaled values.  

  *(a)* Compute the rescaled values and the aggregated choice for options A, B, and C. Use exact arithmetic.  
  *(b)* Now add option **D**, which yields 10 utilons and 0 deontic units (identical to A). Recompute SDs and aggregated rankings. Does A vs. B reverse? Explain why this matters.  
  *(c)* The rescaling step divides by SD. What does this presuppose about how theories assign value? Does the SD derive from moral facts or the choice of menu? Argue whether this makes scale factors morally substantive.  
  *(d)* Option C is a "long shot" with enormous expected utility under U. After rescaling, does it dominate? Discuss whether rescaling neuters such options justifiably or arbitrarily.  
  *(e)* Suppose you face two sequential choices: first between {A} and {B}, then (if you chose B) between {B} and {C}. If you always act on your highest-credence theory (U), you choose B then C. But if you aggregate, you might reject C initially. Is U "exploitable"? Does this argument assume aggregation?  
  *(f)* Could aggregation recommend an option that every theory ranks last? If so, is this fatal?  

  ---

  ### 2. Model Answer (1,000 words)  
  *(a)* **Original menu: A, B, C.**  
  - **U-values**: A=10, B=0, C=100,000 × 0.01 = 1,000 (expected utilons). SD(U) = √[((10−337)^2 + (0−337)^2 + (1000−337)^2)/3] ≈ √[(−327)^2 + (−337)^2 + 663^2)/3] = √[106,929 + 113,569 + 439,569)/3] = √[660,067/3] ≈ √220,022 ≈ 469.  
  - Rescaled U-values: A = 10/469 ≈ 0.0213, B = 0/469 = 0, C = 1000/469 ≈ 2.132.  
  - **D-values**: A=0, B=100, C=−∞. SD(D) is undefined (infinite spread). Rescaling fails; we must treat C as dominated under D. Ignore C for SD: values A=0, B=100. SD(D) = √[((0−50)^2 + (100−50)^2)/2] = √[2,500/2] = √1,250 ≈ 35.36.  
  - Rescaled D-values: A = 0/35.36 ≈ 0, B = 100/35.36 ≈ 2.828, C = −∞ (excluded).  
  - **Aggregated scores**:  
    - A: (0.6 × 0.0213) + (0.4 × 0) ≈ 0.0128  
    - B: (0.6 × 0) + (0.4 × 2.828) ≈ 1.131  
    - C: (0.6 × 2.132) + (0.4 × −∞) = −∞  
    **Ranking: B (1.131) > A (0.0128) > C (−∞)**. Choose B.  

  *(b)* **Add D (identical to A). Menu: A, B, C, D.**  
  - **U-values**: A=10, D=10, B=0, C=1,000. SD(U) = √[((10−255)^2×2 + (0−255)^2 + (1000−255)^2)/4] ≈ √[(−245)^2×2 + (−255)^2 + 745^2)/4] = √[120,050 + 65,025 + 555,025)/4] = √[740,100/4] = √185,025 ≈ 430.2.  
  - Rescaled U: A = 10/430.2 ≈ 0.0232, D = 0.0232, B = 0, C ≈ 1000/430.2 ≈ 2.324.  
  - **D-values**: A=0, D=0, B=100, C=−∞. SD(D) (ignoring C): √[((0−33.3̄)^2×2 + (100−33.3̄)^2)/3] ≈ √[(−33.3)^2×2 + (66.7)^2)/3] = √[1,109×2 + 4,449)/3] = √[6,667/3] ≈ √2,222.3 ≈ 47.14.  
  - Rescaled D: A ≈ 0/47.14 ≈ 0, D ≈ 0, B ≈ 100/47.14 ≈ 2.121, C = −∞.  
  - **Aggregated scores**:  
    - A: (0.6 × 0.0232) + (0.4 × 0) ≈ 0.0139  
    - B: (0.6 × 0) + (0.4 × 2.121) ≈ 0.848  
    - C: −∞  
    - D: Same as A (0.0139)  
    **A ≈ D (0.0139) > B (0.848)**? No: B > A. Original B > A (1.131 > 0.0128), now B < A/D (0.848 < 0.0139? Mistake: B is 0.848, A is 0.0139, so B > A still. Correction:  
    - B: 0.848, A: 0.0139 → B > A.  
    But rank reversal did not occur. Error in setup: D duplicates A, so SD increases slightly, but B’s rescaled D-value drops (from 2.828 to 2.121) while A’s rescaled U-value rises slightly (0.0213 to 0.0232). However, B’s aggregated score falls from 1.131 to 0.848, A’s from 0.0128 to 0.0139. B still > A.  
    **Revised test for reversal**: Suppose a new option E with U=200, D=0. Recalculate:  
    - U-values: A=10, B=0, C=1000, E=200. SD(U) = √[((10−302.5)^2 + (0−302.5)^2 + (1000−302.5)^2 + (200−302.5)^2)/4] ≈ √[(−292.5)^2 + (−302.5)^2 + 697.5^2 + (−102.5)^2)/4] = √[85,556.25 + 91,506.25 + 486,506.25 + 10,506.25)/4] = √[673,875/4] ≈ √168,469 ≈ 410.5.  
    Rescaled U: A≈0.0244, B=0, C≈2.436, E≈0.487.  
    - D-values: A=0, B=100, C=−∞, E=0. SD(D) (ignore C): √[((0−33.3̄)^2×2 + (100−33.3̄)^2)/3] ≈ same as before, ≈47.14. Rescaled D: A≈0, B≈2.121, E≈0.  
    - Aggregated:  
      A: (0.6×0.0244) + (0.4×0) ≈ 0.0146  
      B: (0.6×0) + (0.4×2.121) ≈ 0.848  
      E: (0.6×0.487) + (0.4×0) ≈ 0.292  
    Original (without E): B=0.848, A=0.0128 → B>A. With E: B=0.848, A=0.0146 → still B>A. No reversal.  
    **Correct demonstration**: Split B into B1 and B2, both with U=0, D=50.  
    - Menu: A, B1, B2, C.  
    - U-values: A=10, B1=0, B2=0, C=1000. SD(U) = √[((10−252.5)^2 + (0−252.5)^2×2 + (1000−252.5)^2)/4] ≈ √[(−242.5)^2 + (−252.5)^2×2 + 747.5^2)/4] = √[58,806.25 + 127,556.25 + 558,756.25)/4] = √[745,118.75/4] ≈ √186,280 ≈ 431.6.  
    Rescaled U: A≈0.0232, B1=0, B2=0, C≈2.317.  
    - D-values: A=0, B1=50, B2=50, C=−∞. SD(D) (ignore C): √[((0−33.3̄)^2 + (50−33.3̄)^2×2)/3] ≈ √[1,111.11 + (16.7)^2×2)/3] = √[1,111.11 + 557.78)/3] ≈ √[1,668.89/3] ≈ √556.3 ≈ 23.59.  
    Rescaled D: A≈0, B1≈50/23.59≈2.12, B2≈2.12.  
    - Aggregated:  
      A: (0.6×0.0232) + (0.4×0) ≈ 0.0139  
      B1: (0.6×0) + (0.4×2.12) ≈ 0.848  
      B2: Same as B1  
    Original B (single) had aggregated 1.131. Now B1 and B2 have 0.848 each. A is 0.0139. B still > A, but the point is that splitting diluted B’s rescaled D-value. Crucially, if we compare A and B in isolation:  
    - Menu only A and B: U SD = √[((10−5)^2 + (0−5)^2)/2] = √[25+25)/2] = √25 = 5. Rescaled U: A=10/5=2, B=0/5=0.  
    D SD = √[((0−50)^2 + (100−50)^2)/2] = √[2,500/2] = √1,250≈35.36. Rescaled D: A=0, B≈2.828.  
    Aggregated: A = (0.6×2) + (0.4×0) = 1.2, B = (0.6×0) + (0.4×2.828) ≈ 1.131. So A > B in a two-option menu.  
    But in the three-option menu (A,B,C), B > A (as in (a)). Adding C reverses A vs. B: in {A,B}, A wins; in {A,B,C}, B wins.  
    **Why it matters**: The ranking reverses based on irrelevant alternatives (C, which loses). This violates Independence of Irrelevant Alternatives and makes the theory menu-dependent.  

  *(c)* Rescaling by SD presupposes that each theory’s value assignments are on an *interval scale*, where ratios of differences are meaningful (e.g., "B is 100 times better than A" in D-units). But SD is computed from the *specific menu*, not moral facts. If D values saving one life at 100 and two at 200, the SD changes if we add "save 1.5 lives" (value 150), altering rescaled weights. Nothing internal to deontology fixes whether "100 units" represents a large or small stake; it depends on what options happen to be considered. Thus, choosing SD as the scaler smuggles in a substantive (and arbitrary) moral commitment: it assumes the *spread* of values in the menu reflects the theory’s "stake size," but the menu is chosen by the agent, not morality.  

  *(d)* C’s rescaled U-value is ~2.132 (in (a)), far below its raw expected utility (1,000). Aggregation rejects C due to D’s −∞. But even without deontology, rescaling caps C’s influence: if we drop D, U alone would choose C, but rescaled C is ~2.132 while, e.g., a sure 500 utilons would be rescaled to ~1.066 (if SD≈469), so C still wins. However, with many low-value options, SD increases, diluting C further. This is arbitrary: the long-shot’s pull depends on what else is on the menu. If we add a worse option (e.g., "torture for fun" = −1,000,000 utilons), SD explodes, making C’s rescaled value tiny. Rescaling neuters outliers based on contingent menu composition, not principled risk aversion.  

  *(e)* Sequential exploitation: If you choose B over A at stage 1 using U (highest credence), then at stage 2 U chooses C over B. But aggregating upfront (from (a)) rejects C entirely. Thus, U’s path leads to C, which aggregation deems catastrophic. This makes U seem exploitable (it "lures" you into accepting forbidden acts). But this argument *presupposes aggregation* is correct: it assumes choosing C is bad, which only D says. If U is true, C is best. The argument against favorite-theory relies on the very cross-theoretic comparison it aims to justify—it’s circular.  

  *(f)* Yes. Suppose a fourth option Z: U=1, D=1. In {A,B,C,Z}:  
  - U: A=10, B=0, C=1000, Z=1. SD(U)≈ same as in (b), ~430.2. Rescaled: A≈0.0232, B=0, C≈2.324, Z≈0.0023.  
  - D: A=0, B=100, C=−∞, Z=1. SD(D)≈47.14 (ignore C). Rescaled: A≈0, B≈2.121, Z≈0.0212.  
  - Aggregated:  
    Z: (0.6×0.0023) + (0.4×0.0212) ≈ 0.00138 + 0.00848 ≈ 0.00986  
    A: ≈0.0139 (as in (b))  
  So A > Z, but U ranks Z last (1 < 10,0,1000), D ranks Z last (1 < 0,100,−∞? D: A=0, B=100, Z=1, C=−∞; so Z=1 > A=0, but B>Z. Z not last. Better example:  
  Add Y: U= −10, D= −10.  
  - U: A=10, B=0, C=1000, Y=−10. SD(U): larger, say ~440. Rescaled U: Y≈ −0.0227.  
  - D: Y=−10, others as before. Rescaled D: Y≈ −0.212.  
  - Aggregated Y: (0.6×−0.0227) + (0.4×−0.212) ≈ −0.0136 − 0.0848 ≈ −0.0984  
  - A: ~0.0139 > Y. But U ranks Y last ( −10 < 0,10,1000), D ranks Y last ( −10 < −∞? D: C=−∞ < Y=−10 < A=0 < B=100. So Y is not last in D. C is last.  
  **Truly dominated option**: Let W: U=5, D=50.  
  - U-values: A=10, B=0, C=1000, W=5. SD(U)≈430.2. Rescaled U: W≈0.0116  
  - D-values: A=0, B=100, C=−∞, W=50. SD(D)≈47.14. Rescaled D: W≈1.060  
  - Aggregated W: (0.6×0.0116) + (0.4×1.060) ≈ 0.00696 + 0.424 = 0.431  
  - Compare to A: ~0.0139, B: ~0.848. So W > A but < B.  
  But under U, W=5 < A=10 and B=0? B=0, W=5>0, so W not dominated. **Correct example**: In a menu with X1 (U=20, D=0), X2 (U=0, D=20), and X3 (U=10, D=10).  
  - Credence 0.5 each.  
  - SD(U): X1=20, X2=0, X3=10. Mean=10. SD=√[((20−10)^2+(0−10)^2+(10−10)^2)/3]=√[(100+100+0)/3]=√(200/3)≈√66.67≈8.16. Rescaled U: X1≈2.45, X2=0, X3≈1.225.  
  - SD(D): X1=0, X2=20, X3=10. SD same ≈8.16. Rescaled D: X1=0, X2≈2.45, X3≈1.225.  
  - Aggregated:  
    X1: (0.5×2.45) + (0.5×0) = 1.225  
    X2: (0.5×0) + (0.5×2.45) = 1.225  
    X3: (0.5×1.225) + (0.5×1.225) = 1.225  
  All equal. But if we add X4 with U=5, D=5.  
  - Now SD(U): values 20,0,10,5. Mean=8.75. SD=√[((20−8.75)^2+(0−8.75)^2+(10−8.75)^2+(5−8.75)^2)/4]≈√[(126.56)+(76.56)+(1.56)+(14.06)/4]=√(219.74/4)≈√54.935≈7.41.  
  Rescaled U: X1≈2.70, X2=0, X3≈1.35, X4≈0.675.  
  - SD(D) similar, rescaled D: X1=0, X2≈2.70, X3≈1.35, X4≈0.675.  
  - Aggregated X3: (0.5×1.35) + (0.5×1.35) = 1.35  
  X4: (0.5×0.675) + (0.5×0.675) = 0.675 < X3.  
  But U ranks X4=5 > X3=10? No, X3 U=10 > X4 U=5. D: X3=10 > X4=5. So X4 is dominated by X3. Yet aggregation might rank X4 lower, but not recommend it over X3. To have aggregation prefer a dominated option, need asymmetric case.  
  **Feasible example**: Menu: P (U=100, D=0), Q (U=0, D=100), R (U=99, D=1).  
  - Assume equal credence.  
  - SD(U): P=100, Q=0, R=99. Mean≈66.33. SD=√[((100−66.33)^2+(0−66.33)^2+(99−66.33)^2)/3]≈√[(1133.5)+(4398.5)+(1067.8)/3]≈√(6600/3)≈√2200≈46.9.  
  Rescaled U: P≈2.13, Q=0, R≈2.11.  
  - SD(D): P=0, Q=100, R=1. Mean≈33.67. SD=√[((0−33.67)^2+(100−33.67)^2+(1−33.67)^2)/3]≈√[(1133.5)+(4398.5)+(1067.8)/3] same as above ≈46.9.  
  Rescaled D: P=0, Q≈2.13, R≈0.021.  
  - Aggregated:  
    P: (0.5×2.13) + (0.5×0) = 1.065  
    Q: (0.5×0) + (0.5×2.13) = 1.065  
    R: (0.5×2.11) + (0.5×0.021) ≈ 1.055 + 0.0105 = 1.0655  
  R ≈1.0655 > P=1.065 and Q=1.065. But U ranks R=99 < P=100, D ranks R=1 < Q=100. So R is dominated by P under U and by Q under D. Yet aggregation prefers R. This is a reductio because R is worse than some alternative by every theory’s lights.  

  ---

  ### 3. Marking Scheme (Table + 150 words)  
  | Must-hit point | Required move | Marks | Competent (B) answer | A answer | Common error |  
  |----------------|---------------|-------|----------------------|----------|-------------|  
  | (a) Arithmetic | Correct rescaled values and aggregation for A,B,C. Show SD steps. | 3 | Roughly correct SD, minor errors. Misses D's SD issue. | Flawless calculation, handles C's −∞ properly. | Ignores probability for C; miscalculates SD. |  
  | (b) Menu sensitivity | Add option and show reversal *or* splitting alters rankings. Explain IIRA violation. | 4 | Notes rank change but doesn't prove reversal (e.g., misses two-option comparison). | Constructs valid case (e.g., A>B in {A,B}, B>A in {A,B,C}). Links to menu-dependence. | Asserts reversal without numbers; confuses with incommensurability. |  
  | (c) Rescaling presuppositions | Identify interval scale requirement. Argue SD is menu-relative, not moral. | 4 | States SD depends on menu. Calls it arbitrary. | Explains why no theory fixes scale; calls scaling a "substantive commitment." | Says theories "must be comparable" vaguely; misses scale relativity. |  
  | (d) Long-shot handling | Show C's value deflated post-rescaling. Diagnose menu-dependence as unprincipled. | 2 | Notes C loses but blames deontology. | Demonstrates SD dilutes outliers; calls it an "artifact." | Discusses Pascalian wagers *within* U, not aggregation. |  
  | (e) Sequential choice | Show U leads to C, aggregation blocks it. Cite circularity in exploitability argument. | 3 | Describes sequence but misses presupposition. | Explicitly states argument assumes aggregation to condemn U. | Conflates with dynamic inconsistency. |  
  | (f) Dominated options | Construct an example where aggregation prefers a universally dominated option. Judge severity. | 4 | Claims it happens but no example. Or flawed case. | Valid case (e.g., R dominated but wins). Calls it reductio. | Says "never happens" or misdefines dominance. |  

  **Overall A vs B**: A answers execute all calculations flawlessly, derive general insights from numbers (e.g., "rescaling ties scale to menu contingencies"), and spot structural traps (e.g., circularity in (e)). B answers grasp concepts but fumble arithmetic, assert without demonstrating (e.g., "ranking reverses" without proof), or miss depth (e.g., in (c), note SD is "arbitrary" but not why it's morally substantive). Award A for precision, B for partial rigor.  

  ---

  ### 4. Common Evasions (200 words)  
  No marks for:  
  - **Vague appeals to incommensurability**: E.g., "Theories can’t be compared" without engaging rescaling’s technical attempt to force comparability.  
  - **Pascalian within-theory talk**: Discussing C’s risk within utilitarianism (e.g., "Should we maximize EU?") but not how aggregation handles it across theories.  
  - **Name-dropping**: Referencing "Sepielli’s view" or "MacAskill’s solution" violates self-containment.  
  - **Misplaced menu criticism**: Complaining that "adding options changes decisions" without showing reversal *between fixed options* or confusing it with path dependence.  
  - **Assertion without calculation**: Claiming "rescaling ignores stakes" or "C’s value is capped" without computing SD effects.  
  - **Ignoring −∞**: Treating deontology’s ban as finite (e.g., "set C=−100") to avoid SD issues.  
  - **Dominance missteps**: Arguing "aggregation respects dominance" without constructing counterexamples, or defining dominance incorrectly (e.g., "B dominates A if better in one theory").  
  - **Scale factor hand-waving**: Suggesting "we could normalize differently" without arguing why SD’s menu-dependence is a moral, not technical, flaw.  
