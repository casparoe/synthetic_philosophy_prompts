  | Complaints/grievances cannot be impersonally aggregated to outweigh a severe burden on one person. | You are never allowed to add complaints together across people who can't be named in the story. | Clean      | Nails the core anti-aggregation principle.                                |
  | The reason aggregation is invalid is that there is no single impersonal standpoint; each person's complaint is separate. | You can't combine sourcing for complaints; each gripe needs its own named source and stands alone. | Clean      | "Sourcing" perfectly operationalizes the "no impersonal standpoint".      |
  | Justification requires being able to defend the principle *to* the specific individual burdened. | You must be able to answer, in one sentence, the objection of the worst-off.        | Distorted  | Simplifies "justification" to "answer in one sentence". News vocab's fault (brevity pressure). |
