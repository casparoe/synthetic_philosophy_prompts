  For the stress-test: the clearance rule holds up well for the no-aggregation principle but stumbles on contractualism's "reasonable rejection" standard. In news terms, we'd need to ask not just "can I answer the worst-off" but "could any reasonable editor reject this justification?" That nuance might get lost.

  The user's concern about impact heuristics is spot-on. News values are inherently aggregative (reach × severity), while contractualism is atomistic. This isn't a vocabulary gap but a structural conflict - their desk would need revolutionary new priorities.

  On "representative anecdote": it's a partial match. Both center concrete individuals, but contractualism demands actual justification to that person, while anecdotes are illustrative. The word "individual" is doing double duty here - not just a pun but a conceptual stretch.

  For the residue report, I'll flag where metaphors break: "answerability" maps cleanly to corrections, but "reasonable rejection" has no newsroom equivalent. The unsayable part is contractualism's full justifiability test - we can render the "no" but not the "why" in editorial terms.

