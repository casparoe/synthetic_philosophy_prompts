     - **Yes** (same pull)  
     - **No** (pull weaker or gone)  

  2. **Scale variant**:  
     Every probability is divided by 100. Programme S_scaled: 0.01% chance of 1 year for all, 99.99% chance of nothing. Programme T_scaled: 0.0089% chance of 1 year, 0.001% chance of 5 years, 99.9901% chance of nothing. Do you feel a pull toward S_scaled?  
     - **Yes**  
     - **No**  
     *(Empirical note: Most people do not feel the pull here; confirm with class data.)*  

  3. **Delegation variant**:  
