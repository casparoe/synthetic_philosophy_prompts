prompt: |-
  I teach a graduate seminar on rational choice, and for next week's session on the Allais cases I want to replace the usual survey-of-positions handout with something that actually does work: a decision tree that takes a student from a reaction they already have about the cases to the position in the logical space that their reaction commits them to, with the labels attached only at the leaves. My students split fairly evenly between those who think the Allais pattern is a bias to be explained away and those who think it is a datum that no independence axiom survives, and the argument between them goes nowhere because each side can redescribe the other's premises. I want them sorted by what they say about cases rather than by which name they are drawn to.

  What I need from you is the instrument plus a short commentary on it.

  The start state is deliberately thin: the student grants only that, looking at the standard pair of choices, they feel the pull of the safe option in the first pair and of the riskier option in the second, and they are willing to be asked further questions about cases. Everything else has to come out of their answers.

  Structure. Eight to ten branch nodes, each a question about a concrete case or a concrete claim, with two or three answer options, and a scoring key mapping answer patterns onto leaves. Constraints on the nodes: no node may mention independence, the sure-thing principle, expected utility, risk, weighting, or any named position; a student must be able to answer every node without knowing where it leads. Where a node's discriminating power depends on an empirical claim about what people actually do, mark the node as empirical and tell me what I would have to check myself. If you think one of my stipulated cases fails to discriminate what I take it to discriminate, say so and rewrite the node rather than leaving it in.

  The case material should be built on the running example I use in class, with variants. The running case: a health ministry will make this decision exactly once. Programme S delivers one year of healthy life to each of a million people for certain. Programme T delivers one year to each with probability 0.89, five years to each with probability 0.10, and nothing with probability 0.01. In the paired comparison, Programme U delivers one year to each with probability 0.11 and nothing with probability 0.89; Programme V delivers five years to each with probability 0.10 and nothing with probability 0.90. The variants I want drawn on: the trembling-hand variant, in which the implementation of S carries a small independent failure probability so that nothing is literally certain; the scale variant, in which every probability is divided by a hundred and the stakes are unchanged; the delegation variant, in which the committee chooses for a population whose outcomes it never observes; the two-stage variant, in which the same options are produced by a device that resolves the branch common to the two options first; the mixture variant, in which a device that randomizes equally between S and T is offered as a third option; the repetition variant, in which the same choice structure is faced two hundred times under independent draws with one policy fixed for all of them; the stakes-domain variant, in which the same numbers describe monetary gains to the chooser rather than years of life for others; and a reflection variant, in which the options are laid out as a statewise table with the branch common to each pair visibly cancelled, and the student is asked both whether the pull survives and what its surviving reflection shows.

  One caution about the nodes. Several of my students say they prefer S because additional years of health matter less than the first, or because a million people's fifth year is worth less than their first. That consideration is available to every leaf, so no node may treat it as evidence of anything; if a node is to test something in that neighbourhood, it must ask about the pair, and about why the same consideration does not settle the paired comparison in the opposite direction. I would rather you used that point to design a distractor node that catches the mistake than ignored it.

  Leaves. The tree should end, wherever the logical space allows, at cells that include: a view that keeps the standard theory intact and treats the pattern as error; a view that repairs the theory by giving certainty a special role, as a first-order preference for security rather than as curvature over outcomes; views that repair it by transforming probabilities rather than by weighting outcomes, including both the rank-dependent and the cumulative descendants of prospect theory; a view that treats an attitude to risk itself as a rationally permissible parameter while preserving the rest of the structure; views that give up independence but keep betweenness, with preferences fanning out locally; views that explain the pattern by the anticipation of regret or disappointment rather than by the structure of the options; views that deny that only the reduced-form lottery over final outcomes matters, so that the process or the menu is part of what is evaluated; views on which the normative verdict varies with the domain of the choice; and quietist views on which no verdict attaches to a single unrepeatable choice and the norm governs only policies or long-run sequences. Include also, if the space allows it, the view that the datum is an artifact of unmodelled doubt about the stated probabilities or about the experimenter rather than a response to certainty as such, and keep it separate from the view that the datum is simply a mistake. Name a leaf only where you are confident an established name exists; where you are not, write unnamed and characterize the cell in a sentence. Do not supply citations, references, or reading suggestions: I know that literature, and I do not want the handout padded with it.

  Commentary. After the tree and key, give me the taxonomy in about a page: the logical space generated by the nodes, the combinations of answers the tree in principle permits, the actual positions located in that space, and the combinations that are unoccupied, each diagnosed as incoherent, unattractive, or merely unexplored. Flag explicitly any pair of leaves the tree cannot separate on case answers alone, say what kind of further thing would separate them, and note whether the separation is one I could obtain by asking another case or only by a formal or empirical result. I have been calling the pattern of answers I hear most often in my own department certainty-constrained consequentialism; if that cell turns out to be occupied by an established view, tell me which, and if it is a novel combination, say what is wrong with it. Every leaf should carry one line stating what it implies about the ministry case as originally described: one-off, decided once, outcome observed. Finally, build into the tree rather than into a footnote the distinction between the mixture-independence axiom of the von Neumann–Morgenstern framework and the common-consequence implication of Savage's sure-thing principle, and tell me which of the two the pattern actually threatens.

  Aim for something that could be printed as a two-page handout plus a page of notes.
reasoning: |-
  We are designing a decision tree to sort students based on their responses to concrete cases related to the Allais paradox. The goal is to avoid theoretical jargon and focus on case-based reasoning. We start with the basic Allais pattern: preference for S over T and for V over U in the health ministry example.

  The cases we'll use are variants of the running example. We must design 8-10 branch nodes, each a question about a concrete case or claim, with 2-3 answer options. The answers will lead to leaves representing different positions in the logical space.

  Important constraints:
  - No mention of independence, sure-thing principle, expected utility, risk, weighting, or named positions.
  - Students must be able to answer without knowing where it leads.
  - Mark empirical nodes where we rely on an empirical claim about what people actually do.

  We'll use the following variants (as requested):
  1. Trembling-hand: S has a small failure probability.
  2. Scale: probabilities divided by 100, stakes unchanged.
  3. Delegation: decision made for a population whose outcomes are never observed.
  4. Two-stage: options produced by a device that resolves the common branch first.
  5. Mixture: device that randomizes equally between S and T as a third option.
  6. Repetition: same choice structure faced 200 times independently with one policy fixed.
  7. Stakes-domain: same numbers but for monetary gains to the chooser.
  8. Reflection: statewise table with common branch visibly cancelled, and questions about whether the pull survives and what that shows.

  Additionally, we must be cautious about students who prefer S due to diminishing marginal utility (DMU) of health years. We cannot treat that as evidence for a particular leaf. We should design a node that tests whether the same DMU consideration applies to the paired comparison and why it doesn't settle it in the opposite direction.

  Leaves we aim to cover (with one-line implication for the original case):
  1. Standard theory intact: pattern is an error (original case: choose T and V).
  2. Certainty special role (security preference): e.g., original case: S and V are chosen, but due to the value of certainty, not DMU.
  3. Probability transformation (rank-dependent or cumulative prospect theory): original case: pattern is rational due to non-linear probability weighting.
  4. Risk attitude as parameter: original case: pattern is rational because risk aversion is allowed to vary with context.
  5. Betweenness without independence (fanning out): original case: pattern is rational because preferences are not linear in probabilities.
  6. Regret or disappointment: original case: pattern is rational because of emotional responses to outcomes.
  7. Process or menu matters: original case: pattern is rational because the way the uncertainty is resolved matters.
  8. Domain-dependence: original case: pattern is rational in health but not in money (or vice versa).
  9. Quietist: no verdict for one-off choice; norm governs long-run sequences (original case: no verdict for the one-off, but for repetition, choose the policy that maximizes expected health years).
  10. Artifact of doubt: pattern is due to unmodelled doubt about probabilities or the experimenter (original case: if doubts are removed, the pattern would disappear).

  We must also build in the distinction between mixture independence (vNM) and common-consequence independence (Savage). The Allais pattern is typically taken to challenge the common-consequence independence (a consequence of Savage's sure-thing principle) but note that in the vNM framework, the mixture independence axiom is also challenged by the pattern when presented in a way that isolates the common consequence.

  Designing the nodes:

  We start with the basic Allais choices (without calling them that). Then we present variants and ask for preferences or reactions.

  Node 1: Basic Allais pattern (already granted: safe option in first pair, riskier in second). But we need to confirm the student's reaction to the original case. Since they grant the pull, we can move on.

  But note: we must ensure that the student is consistent in their pull. We can ask:

  Node 1 (Confirmation): In the first choice, between S (1 year for sure for a million) and T (0.89 chance of 1 year, 0.10 chance of 5 years, 0.01 chance of nothing), do you feel a pull toward S? [Yes/No] (But they already grant this, so maybe skip?)

  Alternatively, we can use the first node to set the stage and then branch on the variants.

  Since the start state is thin, we can have:

  Node 1: Consider a modified version of the first choice: Programme S' is like S but with a 0.001 chance of failure (so 0.999 chance of 1 year, 0.001 chance of nothing). Programme T is unchanged (0.89 chance of 1 year, 0.10 chance of 5 years, 0.01 chance of nothing). Do you feel the same pull toward S' as you did toward S? [Yes, same pull / No, the pull is weaker or gone]

  This is the trembling-hand variant. It tests whether the attraction to certainty is about the psychological effect of certainty or about the very high probability.

  - If the student says the pull is the same, it suggests that the attraction is to very high probability, not literal certainty.
  - If the pull is weaker, it suggests that the certainty itself is key.

  Node 2: Now consider a scaled-down version: the same probabilities but for a much smaller group, say 10,000 people (so the numbers are 100 times smaller in terms of people, but the health outcomes per person are the same). Do you feel the same pull in the choices? [Yes, same pull / No, the pull is weaker or gone]

  This tests whether the pattern is sensitive to the scale of the population. If the pull is the same, then the pattern is not due to the large numbers (e.g., not because of a feeling that 1 million people getting nothing would be catastrophic in a way that 10,000 wouldn't). If it weakens, then the large scale matters.

  But note: the original problem has 1 million, and we are scaling down to 10,000 (dividing by 100). The outcomes per person are the same, so the total health benefit is scaled. However, the student might think in per capita terms. We are testing whether the pattern holds when the stakes are the same per person but the total is smaller.

  Alternatively, we could scale the probabilities: divide every probability by 100 and keep the population the same? But the problem says "scale variant, in which every probability is divided by a hundred and the stakes are unchanged". So:

  Revised Node 2 (Scale variant): Now consider a version where every probability is divided by 100: 
  - Programme S_s: 0.01 chance of 1 year for a million, 0.99 chance of nothing? (But wait, that changes S from certain to very uncertain.) Actually, the original S is certain. So we cannot have a scaled version of S that preserves the same outcome but with divided probability? 

  Alternatively, we can reframe: the ministry now chooses between two programmes that are like S and T but with all probabilities multiplied by 0.01 (and then normalized? but that doesn't work). 

  The standard way: the same outcomes but with probabilities reduced by a factor of 100, so the expected value is reduced but the ratios are the same. However, note that in the original, S is certain. In the scaled version, S becomes 0.01 chance of 1 year and 0.99 chance of nothing. Then T becomes: 0.0089 chance of 1 year, 0.001 chance of 5 years, and 0.9901 chance of nothing. Then we ask: do you feel a pull toward S_s (the scaled S) over T_s? and similarly for the second pair.

  But note: the scaled version of the first pair is now between two very low-probability gains. The pull toward the safe option in the first pair might disappear because there is no certainty. So:

  Node 2 (Scale): Now consider a scaled version: the same choices but with every probability multiplied by 0.01 (so the chance of any positive outcome is 100 times smaller). Specifically:
  - First choice: S_scaled: 0.01 chance of 1 year for a million, 0.99 chance of nothing. T_scaled: 0.0089 chance of 1 year, 0.001 chance of 5 years, and 0.9901 chance of nothing. Do you feel a pull toward S_scaled? [Yes / No]

  This is an empirical node: we are relying on the fact that people typically do not show the Allais pattern when probabilities are small. But for the student, we ask for their own feeling.

  Node 3: Delegation variant. The ministry chooses a policy for a population, but the outcomes for each individual are never observed by the ministry (so they don't know who got what, only the aggregate if any). Does this change your feeling in the original choices? [Yes, the pull changes / No, the pull is the same]

  This tests whether the pattern depends on knowing the outcomes for individuals (and thus perhaps on regret or responsibility).

  Node 4: Two-stage variant. The original T option can be thought of as: first, there's a 1% chance of total failure (nothing) and 99% chance of moving to a second stage where then you get 1 year with probability 89/99 ≈ 0.899 and 5 years with probability 10/99 ≈ 0.101. Similarly, S is: first stage, 1% chance of nothing and 99% chance of 1 year for sure. But wait, that's the trembling hand? 

  Alternatively, we can present the two-stage version of the first pair:

  - For T: Stage 1: 89% chance of 1 year (and then stop). Stage 2: with the remaining 11%, a sub-lottery: 10/11 chance of 5 years and 1/11 chance of nothing. 
  But note: the overall probabilities are the same: 89% for 1 year, 10% for 5 years, 1% for nothing.

  Similarly, S: 100% chance of 1 year? But we can't break that into stages? 

  Alternatively, we can compare the two-stage presentation of the common consequence part. The Allais common consequence is the 89% chance of 1 year in the first pair? 

  But the standard two-stage presentation for the common consequence is to have the common branch resolved first. For the first pair:

  - In the first stage, there is a 99% chance of a good outcome and 1% chance of a bad outcome (nothing). Then, conditionally on the good outcome (99%), the choice is between:
     - S: 100% chance of 1 year
     - T: 89/99 chance of 1 year and 10/99 chance of 5 years.

  But note: the original T has 0.89 chance of 1 year and 0.10 chance of 5 years, and 0.01 chance of nothing. So in the two-stage, the 1% chance of nothing is common and resolved first. Then in the 99% branch, we have a choice between a sure 1 year (which would be S) and a lottery that gives 1 year with probability 89/99 and 5 years with probability 10/99.

  Now, if the student is consistent, they should choose the same in the second stage as they did in the original. But the Allais pattern suggests that in the original first choice they prefer S (the sure thing) but in the second stage of the two-stage they might not, because the context of having already avoided the 1% nothing might change their perception.

  So we ask:

  Node 4 (Two-stage): Imagine the first choice is broken into two stages. First, a random event happens: with 1% chance, the outcome is nothing and the programme ends. With 99% chance, you move to a second stage where you must choose between two options:
  - Option A: 1 year for sure for the million.
  - Option B: 89/99 chance of 1 year and 10/99 chance of 5 years.

  In the second stage, if you have the choice, do you feel a pull toward Option A (the sure 1 year)? [Yes / No]

  Note: In the original first choice, they preferred S (which is equivalent to Option A in the second stage). But now, if they no longer feel the pull in the second stage, that suggests that the common consequence (the 1% nothing) being resolved first changes their attitude.

  Node 5: Mixture variant. Consider a third option that is a 50-50 mix between S and T. That is, with 50% chance the ministry implements S, with 50% chance they implement T. Do you prefer this mix to both S and T? [Prefer mix to both / Prefer S to mix and mix to T / Prefer T to mix and mix to S / etc.] But we must be careful: we are asking for preference, but we want to see if the student violates betweenness.

  We can ask: When choosing among S, T, and the mix (call it M), do you feel that M is worse than S? [Yes, M is worse than S / No, M is at least as good as S] and similarly for T? But that becomes two questions.

  Alternatively, we can ask: Comparing M (the mix) and S, do you feel a pull toward S? [Yes / No] and then separately for M and T? But that's too many.

  We can do:

  Node 5 (Mixture): Consider three options: S (1 year for sure), T (0.89 chance of 1 year, 0.10 chance of 5 years, 0.01 chance of nothing), and M (a 50-50 mix: half the time S, half the time T). Do you feel that M is less attractive than S? [Yes / No]

  If they have a strict preference for S over T, then under betweenness, M should be between S and T in preference. But if they have a preference for certainty, they might find M less attractive than S because it introduces risk.

  Node 6: Repetition variant. The ministry will make the same type of decision 200 times, independently (each time for a different group of one million, and the outcomes are independent). They must choose one policy to apply every time. Which policy would you choose? [S every time / T every time]

  This tests whether in the long run they would choose the option with higher expected value (which is T: 0.89*1 + 0.10*5 + 0.01*0 = 0.89 + 0.5 = 1.39 years vs S: 1 year). Or if they still prefer the safe option.

  Node 7: Stakes-domain variant. Now consider the same numbers but in a personal financial decision: you are choosing for yourself. 
  - Option S_m: $1,000 for sure.
  - Option T_m: 89% chance of $1,000, 10% chance of $5,000, 1% chance of $0.
  - Then the second pair: 
     - U_m: 11% chance of $1,000, 89% chance of $0.
     - V_m: 10% chance of $5,000, 90% chance of $0.

  Do you feel the same pull toward S_m in the first choice? [Yes, same pull / No, the pull is different (weaker or gone or even reversed)]

  This tests domain dependence.

  Node 8: Reflection variant. Present the first pair in a statewise table. Suppose there are 100 equally likely states. For the first pair:
  - In states 1 to 89: both S and T give 1 year.
  - In state 90: S gives 1 year, T gives 5 years.
  - In states 91 to 100: S gives 1 year, T gives 0 years.

  But wait, that's not the original. The original T: 89% chance of 1 year, 10% of 5, 1% of 0. So:
  - In states 1-89: S: 1, T: 1
  - In states 90-99: S: 1, T: 5
  - In state 100: S: 1, T: 0

  But note: the common states are 1-89 (both give 1) and state 100 (S gives 1, T gives 0). The difference is in states 90-99: S gives 1, T gives 5.

  But the common consequence (states 1-89) is the same. So we can cancel states 1-89? Then the choice reduces to: in the remaining 11 states (90-100), S gives 1 year in all 11, and T gives 5 years in 10 states (90-99) and 0 in 1 state (100).

