  - **Quietist views**: No verdict for one-off choices; repetition (Node 6→T) is decisive. *Diagnosis: Requires a node asking if the one-off choice has a normative answer; omitted for brevity.*  
  - **Betweenness views**: Violate mixture independence (Node 5→Yes) but accept statewise reduction (Node 8→No). *Diagnosis: Rare and unstable; no students likely occupy this cell.*  
  - **Doubt-based views**: Pattern dissolves in two-stage (Node 4→No) or reflection (Node 8→No) due to distrust. *Diagnosis: Merged into Leaf A; separate with a node on probability trust.*  

