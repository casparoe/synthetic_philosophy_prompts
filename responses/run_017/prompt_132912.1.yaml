  ### Formal System Design

  **Alphabet**: {M, I, U}  
  **Axiom**: MIII  
  **Rules**:  
  1. **End-I Add U**: If a string ends with I, add U at the end. Formally: \( xI \rightarrow xIU \) (for any string \( x \)).  
  2. **M-Double**: Double the string after M. Formally: \( Mx \rightarrow Mxx \) (for any string \( x \)).  
  3. **III to U**: Replace any occurrence of III with U. Formally: \( xIIIy \rightarrow xUy \) (for any strings \( x, y \)).  
  4. **UU Deletion**: Delete any occurrence of UU. Formally: \( xUUy \rightarrow xy \) (for any strings \( x, y \)).  

  **Target Strings**:  
  - **Target 1 (Derivable but Infeasible)**: M followed by \( 3 \times 2^{20} \) I's, denoted \( M I^{3145728} \).  
  - **Target 2 (Underivable)**: M followed by \( 3 \times 2^{20} - 1 \) I's and one U at the end, denoted \( M I^{3145727} U \).  

  ---

  ### Characterization Theorem

  **Condition C**: A string is derivable if and only if it starts with M and the rest of the string consists of blocks of I's, where each block has a length divisible by 3, separated by U's.  
  Formally: Let \( s = Mw \). Then \( w \) is a concatenation of substrings \( B_1 B_2 \dots B_k \), where each \( B_i \) is either:  
  - A non-empty block of I's with length divisible by 3, or  
  - A single U.  

  **Proof of Theorem**:  
  1. **Every rule preserves Condition C**:  
     - **Rule 1 (End-I Add U)**: If \( s = xI \) ends with I, Condition C implies the final block of I's has length \( \ell \equiv 0 \pmod{3} \). Adding U creates a new block "U" at the end, preserving the condition (existing I-blocks unchanged, new U-block added).  
     - **Rule 2 (M-Double)**: If \( s = Mx \), then \( x \) satisfies Condition C. Doubling to \( Mxx \) concatenates two copies of \( x \), preserving block structure (each block's length remains divisible by 3).  
     - **Rule 3 (III to U)**: Replacing "III" (length 3, divisible by 3) with "U" either:  
       - Converts an I-block of length 3 to a U-block, or  
       - Splits a longer I-block of length \( \ell \equiv 0 \pmod{3} \) into two I-blocks of lengths \( 3 \) and \( \ell-3 \equiv 0 \pmod{3} \), then replaces the first with U.  
       Block lengths remain divisible by 3.  
     - **Rule 4 (UU Deletion)**: Deleting "UU" merges adjacent I-blocks. If \( w = aUUb \), deletion \( aUUb \rightarrow ab \) combines I-blocks around the deleted UU. If \( a \) ends an I-block of length \( \ell_1 \equiv 0 \pmod{3} \) and \( b \) starts an I-block of length \( \ell_2 \equiv 0 \pmod{3} \), the new block has length \( \ell_1 + \ell_2 \equiv 0 \pmod{3} \).  

  2. **Every string satisfying C is derivable**:  
     Start from axiom MIII (satisfies C: one I-block of length 3). To derive \( s = Mw \) with \( w = B_1 B_2 \dots B_k \):  
     - Use Rule 2 repeatedly to double the string, building a single I-block of length \( 3 \times 2^d \) (for \( d \) large enough to cover all I's in \( w \)).  
     - Use Rule 3 to replace occurrences of "III" with "U". By replacing non-overlapping III-blocks, convert the I-string into the desired sequence of I-blocks and U's.  
     - Use Rule 1 to add U's at the end if needed (ensuring final U's in \( w \)).  
     - Use Rule 4 to delete any extraneous UU pairs (ensuring no two U's are adjacent if not in \( w \)).  

  **Worked Derivation** (Short example: Derive MIU):  
  - Axiom: MIII  
  - Apply Rule 1: MIII → MIIIU (now ends with U)  
  - Result: MIU is not achieved; this derives MIIIU.  
  *Correction*: To derive MIU:  
  - From MIII, apply Rule 3: MIII → MU  
  - Apply Rule 1: MU → MUU? (No, Rule 1 requires ending with I).  
  *Revised example*: Derive MIU is impossible; instead, derive MIIIU:  
  - Axiom: MIII  
  - Apply Rule 1: MIII → MIIIU.  
  Thus, MIIIU is derived in 1 step.

  ---

  ### Decoy Criterion C'
  **C'**: The string starts with M, and the total number of I's is divisible by 3.  
  - C' is necessary (every derivable string satisfies it) because:  
    - Axiom MIII has 3 I's.  
    - Rules preserve total I's modulo 3:  
      - Rule 1 adds 0 I's.  
      - Rule 2 doubles I-count: \( 2a \equiv 2a \pmod{3} \) (not invariant, but if \( a \equiv 0 \pmod{3} \), then \( 2a \equiv 0 \pmod{3} \)).  
      - Rule 3: Replaces 3 I's (≡0 mod 3) with U (0 I's).  
      - Rule 4: Removes 0 I's.  
      Thus, if axiom has I's ≡0 mod 3, all derivable strings do.  
  - **Witness String**: MIIU (total I's = 2 ≡ 2 ≢ 0 mod 3).  
    - C' fails for MIIU, so it agrees with C on short strings. But C' holds for \( M U \) (0 I's, divisible by 3), while C fails (no I-blocks).  
  - **Underivability Proof via C**: \( M U \) has no I's, violating C (requires I-blocks of length divisible by 3).  
  - **Why C' is Insufficient**: Rule 2 preserves I-count modulo 3 only if the initial I-count is 0 mod 3, but C' does not enforce the block structure. The structural feature is **block divisibility**, not just total count.

  ---

  ### Target Verdicts and System Limitations
  - **Target 1 (M I^{3145728})**:  
    - Satisfies C: Single I-block of length \( 3 \times 2^{20} \equiv 0 \pmod{3} \).  
    - Derivable but infeasible: Requires 20 M-Double steps (each doubling length) from MIII. The \( 20^{\text{th}} \) step produces a string of length \( 3 \times 2^{20} \).  
    - Within 20 steps: \( 2^{20} = 1,048,576 \) distinct strings possible (exponentially many).  
    - **Practical Failure**: Enumeration would require \( \sim 10^6 \) strings, infeasible by hand.  
  - **Target 2 (M I^{3145727} U)**:  
    - Violates C: The I-block has length \( 3145727 \equiv 2 \pmod{3} \) (not divisible by 3).  
    - Underivable: No rule can create an I-block of length not divisible by 3.  
    - **Theoretical Failure**: No finite derivation prefix proves underivability; only C reveals it.  

  ---

  ### Distinctive Feature
  The **block-divisibility constraint** (lengths of I-segments must be multiples of 3) is the core feature. It is:  
  - Sensitive to order (e.g., \( M I^3 \) vs. \( M I^2 U \)—both have 3 I's, but only \( M I^3 \) satisfies C).  
  - Preserved structurally by rules.  
  - Not reducible to letter counts.  
  Fixed/varied: Alphabet size (3), rule count (4), and axiom are minimal; targets are exponential.  

  ---

  ### Ablation: Adding Self-Referential Rule
  **Added Rule 5 (Self-Application)**: If a string \( s \) matches a rule's left-hand side, prepend "R:" to \( s \) (e.g., if \( s = xI \), derive \( R:xI \) and then apply Rule 1 to get \( xIU \)), allowing the system to encode rules.  
  - **Effect**: The system can now express C (block divisibility) as a derivable string "BLOCK_DIV", but:  
    - **Characterization Derivable?** Yes, but only as a string, not as an effective decision procedure.  
    - **Tractability Gap Survives?** Yes: Checking C for a string of length \( n \) requires \( O(n) \) time (scan for I-block lengths). Deriving "BLOCK_DIV" does not help; enumerating proofs to confirm C for \( M I^{3145728} \) remains exponential.  
  The jump-out (using C as a fast meta-tool) does not collapse into feasible in-system derivation.

  ---

  ### Philosophical Case and Cheating
  **Case for**: Distinguishes "jumping out" (using C for efficient verification) from in-system search. Highlights that:  
  - **Blind search** (in-system) is exponentially impractical.  
  - **Characterization** (meta-level) is efficient and decisive.  
  **Cheating Would Be**:  
  - Stipulating verdicts without derivation or C.  
  - Artificially limiting search (e.g., capping steps).  
  - Smuggling C into a rule (e.g., a rule that only applies if C holds).  

  **Deflationist Objection**: "Jumping out" is just choosing a better formalization (C); all reasoning is meta-level. The gap is computational, not philosophical.  
  **Reply**: C is *about* the system, not part of it. The system cannot *use* C to decide targets; only an external agent can. This shows a fundamental asymmetry: the system is bounded by its rules, while the agent transcends them.  
  **Support**: The case supports the agent's transcendence: C is unattainable *as a tool* within the system, even with self-reference (Ablation).

  ---

  ### System in Full
  - **Alphabet**: M, I, U  
  - **Axiom**: MIII  
  - **Rules**:  
    1. \( xI \rightarrow xIU \)  
    2. \( Mx \rightarrow Mxx \)  
    3. \( xIIIy \rightarrow xUy \)  
