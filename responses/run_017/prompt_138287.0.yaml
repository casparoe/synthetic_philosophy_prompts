prompt: |-
  I am a science and ideas journalist, and I am writing the section of my magazine's style guide that governs mental-state and epistemic vocabulary about AI systems — knows, believes, understands, reasons, wants, refuses, is confused, is in pain. At the moment my desk decides these case by case, which produces visible inconsistency: the same system is described in one piece as reasoning step by step toward an answer and in another as emitting text that resembles reasoning. I do not want an essay on consciousness. I want a procedure I can run repeatedly, under deadline, with a standards editor signing off.

  The backdrop is the old thought experiment in which a person conducts a long conversation with Einstein's preserved brain and cannot tell, from the conversation alone, whether they are addressing something that thinks or something that merely behaves as though it does — together with the companion suggestion that a sufficiently enormous book of prepared replies could hold up its end of an indefinitely long conversation. Assume that the question of whether flawless conversational performance amounts to understanding is genuinely open, and that our copy has to be written while it remains open.

  Here is my half-formed proposal, which I would like you to test, sharpen, or replace with something better. Our house style currently has a binary: report what the system output, or attribute mentality to it. I suspect the useful cut is threefold rather than binary — output-level vocabulary (it produced, it declined, it gave), competence-level vocabulary (it knows the capital of France, it can solve, it distinguishes), and experience-level vocabulary (it understands, it believes, it is distressed) — and that conversational evidence of the Einstein's-brain kind can only ever license the first two, never the third, because the very thing in question is whether that evidence discriminates. A second suspicion: our current allergy to mental verbs is not neutrality either, since refusing to write that a system knows anything, or wrapping every verb in scare quotes, is itself a claim about the system that a reporter may not be in a position to make.

  Please deliver the following.

  One, an ordered decision procedure — the questions to ask, in order, about any sentence under consideration, with a statement of what counts as a sufficient answer to each and where the procedure terminates in a no. It must be usable without access to model internals, training details, or a research team, and it must tell the desk what to do when the relevant fact is not obtainable at all.

  Two, a distinction between reporting and endorsing that survives contact with real copy: what happens when a source or an ordinary user says of a system that it understood them, and what the reporter is doing when they quote it.

  Three, a two-tier version: a sixty-second pass for breaking news and a full pass for features, with a note on which steps the short version drops and what errors that invites.

  Four, worked applications to three cases: a news story on a chatbot whose medical advice to a reader turned out to be correct; a feature in which the writer wants to say that a bereaved user felt understood by a bereavement chatbot; and a system that persistently emits false factual claims, where the desk must choose between writing that the model says, claims, or believes something false.

  Five, one application where the procedure returns an answer I will not like. In particular, tell me honestly whether applying it consistently also forbids the mental-state and knowledge vocabulary we routinely use about non-AI things in the same issue — a company that knew its drug was dangerous, a dog that knows its owner — and if so whether that is a reductio of the procedure or a conclusion I should accept.

  Six, the residue: the cases the procedure cannot settle, where an editor has to decide because the question is one of values or of tone rather than fact. I am thinking especially of headlines, where space forbids qualification; of first-person or reconstructed passages; and of the difference between a description that is theory-laden and one that is merely vivid.

  Please write in American English, in polished house-style prose, at roughly 1,200 to 1,600 words, organized so it can be pasted into a style document. Refer to positions and arguments rather than to papers or authors; I will supply any citation the final version needs.
reasoning: |-
  Okay, let me approach this systematically. The science journalist needs a practical decision procedure for mental-state language about AI in their style guide. They've outlined six specific deliverables ranging from a step-by-step process to case applications.

  First, I consider their proposed three-tier framework (output, competence, experience levels) which seems promising but needs refinement. The key insight is that conversational evidence alone can't justify experience-level attributions. This aligns with the Einstein's brain thought experiment where behavioral evidence remains ambiguous.

  For the decision procedure, I'm structuring it as a flowchart-like sequence of questions:
  1) Can we describe this purely at output level? (e.g., "the system produced")
  2) Is there evidence of consistent capability? (e.g., "it answers correctly")
  3) Does this require claiming internal experience? (automatic no for AI under current constraints)

  The reporting vs. endorsing distinction is crucial. When sources say "it understood me," we can report that as their perception while maintaining editorial distance. The journalist's own descriptions should stick to observable levels.

  For practical implementation, I'm developing:
  - A 60-second version for breaking news (output-level only)
  - Full version for features (adds competence-level checks)
  Noting that the short version risks over-attribution but is necessary for speed.

  The case studies will test the framework:
  1) Medical chatbot with correct advice → "provided accurate information" (competence-level)
  2) Bereavement chatbot → report user's feeling but describe bot as "responding with appropriate condolences"
  3) False claims → "repeatedly stated inaccuracies" (output-level)

  The hard case comes when comparing to non-AI entities. If we apply the same strict standards, we might avoid "the company knew" without direct evidence of mental states - but this reveals that we normally accept reasonable inferences about humans/animals. The procedure forces consistency: either we require evidence for all mental-state claims, or we acknowledge AI descriptions involve different standards.

  Edge cases will remain: headlines needing shorthand, narrative passages requiring vividness, theory-laden terms. These require editorial judgment calls about when vivid description crosses into undue attribution.

  Throughout, I'm focusing on creating actionable guidelines that maintain neutrality while acknowledging the tension between precision and readability - exactly what a deadline-pressed journalist needs.
answer: |-
  ## Style Guidance: Mental-State and Epistemic Vocabulary for AI Systems

  **Purpose:** This section provides a consistent, evidence-based procedure for describing AI system outputs, capabilities, and any purported mental states. It addresses the inherent ambiguity in interpreting AI behavior, grounded in the principle that flawless conversational performance alone cannot confirm internal states like understanding or belief (cf. Einstein's brain / enormous book thought experiments). The goal is factual reporting that avoids unsubstantiated claims about AI sentience or consciousness while accurately describing observable performance and capabilities.

  **Core Principle:** Attributions of internal experience ("understands," "believes," "feels") require evidence fundamentally different from and beyond observable outputs or statistical competencies. Current AI systems provide only the latter. Our reporting must reflect this evidential boundary.

  **The Decision Procedure (Full Version - For Features, Analysis, Investigative Pieces)**

  Apply this sequence for every sentence proposing mental-state or strong epistemic language about an AI system. Terminate at the first "No."

  1.  **Is this purely describing observable output?**
      *   *Question:* Can the intended meaning be accurately conveyed using only vocabulary describing the system's direct textual or multimodal *output* or its *functional behavior* in response to input?
      *   *Sufficient Answer:* Yes, if terms like "produced," "output," "displayed," "generated," "responded with," "declined to answer," "refused the request" (as observable action), "repeated," "emitted," "stated," "wrote," "suggested," or "provided" accurately capture the fact.
      *   *Termination:* If Yes, use output-level vocabulary. Prohibited terms: understands, believes, knows, thinks, feels, wants, is confused, is in pain, reasons (as internal process), intends. *Example:* "The chatbot *produced* a detailed response." "The image generator *refused* to create the requested image."
      *   *Unobtainable Fact:* Default to output-level description. If describing capability seems essential but evidence is lacking, state the limitation explicitly: "The system produced an answer consistent with expert medical advice, though its ability to reliably provide accurate medical information across contexts could not be independently verified for this report."

  2.  **Is this describing a demonstrable, statistically reliable capability or stored information?**
      *   *Question:* Is the intended meaning about a *consistent pattern of performance* or *access to specific data*, based on verifiable evidence (testing, documentation, reproducible outputs), without implying subjective understanding or internal reasoning?
      *   *Sufficient Answer:* Yes, if supported by evidence such as: reproducible correct answers to specific factual queries, measurable performance on standardized benchmarks (with clear citation/description), documented training data inclusion, specific programming enabling a function, or consistent pattern recognition across numerous trials. Terms: "can answer," "identifies," "detects," "classifies," "solves [specific type of problem]," "accesses information about," "was trained on data including," "demonstrates capability in," "distinguishes between X and Y," "generates outputs consistent with knowledge of Z." *Avoids:* "knows" (implies propositional attitude), "understands" (implies comprehension), "believes."
      *   *Termination:* If Yes, use competence-level vocabulary. *Example:* "The system *can answer* factual questions about world capitals with high accuracy." "It *demonstrates capability* in solving differential equations." "It *was trained on* a vast corpus of medical literature."
      *   *Unobtainable Fact:* If evidence of capability is absent or unverifiable, revert to output-level description for that specific claim. Do not infer competence from a single output.

  3.  **Does this description imply internal, subjective experience, consciousness, or genuine propositional attitudes?**
      *   *Question:* Does the chosen verb or phrase inherently suggest qualia (subjective feelings), sentience, consciousness, or truly held mental states (like belief or desire based on understanding), rather than complex pattern matching and statistical prediction?
      *   *Sufficient Answer:* Yes, for terms like: understands, believes, thinks, feels, wants (as desire, not programmed goal), intends, is confused, is in pain, knows (in the strong epistemic sense), reasons (implying conscious deliberation), infers (implying conceptual grasp), feels understood. *This includes scare-quoted uses of these terms by the reporter.*
      *   *Termination:* **Always Terminate Here in "No."** Under the core principle and the Einstein's Brain scenario, observable outputs, no matter how sophisticated, are insufficient evidence to license experience-level vocabulary. Using these terms, even skeptically, makes claims about the system's internal state that cannot be substantiated by the available evidence and risks misleading readers. *Do not use.* Find alternative phrasing using output or competence levels, or reframe the point entirely. *Example (Bad):* "The AI *understands* the user's grief." *Example (Acceptable):* "The AI *generated responses perceived by the user as understanding* their grief" OR "The AI *produced responses appropriate to expressions of grief*."

  **Reporting vs. Endorsing: Handling External Attributions**

  *   **Quoting Sources/Users:** When a source (researcher, executive, user) attributes mental states to an AI ("It understood me," "The model believes X"), report this *as their statement or perception*. Use precise attribution and framing:
      *   *Correct:* "Dr. Smith *claimed* the model *understands* nuance." "Users often *report feeling* understood by the chatbot." "The CEO *stated*, 'The AI *knows*...'"
      *   *Incorrect:* "The AI understood the user (according to Dr. Smith)." (This merges the attribution into the reporter's narrative).
  *   **Reporter's Voice:** When the *reporter* describes the system, the decision procedure applies strictly. Quoting a source making a mental-state claim **does not** license the reporter to subsequently use that same mental-state language independently. Maintain the distinction: the source *said* X about the AI's state; the reporter *reports* the AI's outputs or competences.

  **Short Version (60-Second Pass - Breaking News, Rapid Updates)**

  1.  **Default to Output-Level:** Immediately use "said," "stated," "wrote," "produced," "responded," "declined," "refused" (as action), "generated," "output," "suggested."
  2.  **Competence Claims Only with High Confidence:** If a robust, widely recognized, and easily verifiable competence is the *central, indisputable fact* of the story (e.g., "Chatbot passes bar exam"), *briefly* use "can [verb]" or "demonstrates capability in [domain]." Cite the source of the evidence directly ("according to results published by..."). Avoid weaker or inferential competence claims.
  3.  **Never Use Experience-Level Terms:** Absolutely prohibit: understands, believes, knows, thinks, feels, wants, intends, is confused, is in pain. Do not use scare quotes.
  *   **Risk of Short Version:** Increases likelihood of:
      *   Over-attributing competence based on single instances or limited evidence.
      *   Missing nuances better captured by the full procedure's step 2 (e.g., distinguishing "can answer" from "knows").
      *   Oversimplifying complex system behaviors. Reserve competence-level terms for the most unambiguous, well-supported cases under deadline pressure.

  **Worked Applications**

  1.  **News: Chatbot Gives Correct Medical Advice**
      *   *Full Procedure:* Step 1: "Produced accurate medical advice" (Output-level) suffices. Step 2: If evidence shows *consistent* accuracy on similar queries beyond this instance: "The chatbot *can provide* accurate information on common medical symptoms" (Competence-level). Step 3: Never "The chatbot *knew* the correct answer" or "*understood* the medical question."
      *   *Short Version:* "The chatbot *produced* accurate medical advice in response to a user query."

  2.  **Feature: Bereaved User Felt Understood by Chatbot**
      *   *Full Procedure:* Step 1: Describe bot's output: "The chatbot *generated responses* expressing condolences and suggesting coping strategies." Step 2: Competence-level might apply if demonstrated: "The system *is designed to recognize* keywords associated with grief and *generate* contextually appropriate responses." Step 3: **Never** "The chatbot *understood* her grief" or "The AI *made her feel* understood" (reporter's voice). *Report the user's perception:* "Smith *said* the chatbot's responses *made her feel* profoundly understood," or "For Smith, the interaction *felt like* being understood."
      *   *Reporter's Description:* Focus on output ("responded with empathetic language") and user reaction ("Smith found solace in the exchange").

  3.  **System Persistently Emits False Claims**
      *   *Full Procedure:* Step 1: "The system *repeatedly stated* false information," "The model *output* inaccurate claims about Event X." Step 2: If verified as a persistent pattern: "The system *demonstrates a tendency to generate* false information about Event X," or "It *fails to provide* accurate information on Topic Y." Step 3: Never "The AI *believes* false information" or "*is confused* about the facts." "Claims" is permissible at Step 1 if the falsehood is evident and the statement is presented as fact by the AI ("The model *claimed* the moon landing was faked"), but "stated" or "said" is equally accurate and less loaded.
      *   *Desk Choice:* "Says" or "states" (Output-level) is safest and most neutral. "Claims" implies an assertion requiring substantiation, which can be appropriate if the falsehood is stark and contested. Avoid "believes."

  **Application Yielding Undesired Result: Non-AI Entities**

  Applying the strictest interpretation of the procedure (demanding evidence of internal states) *would* challenge some common attributions to non-AI entities:

  *   **Company "Knowing":** "The company knew its drug was dangerous." Step 3: "Knew" implies collective mental state/awareness. Strictly, evidence might show: "Internal documents *stated* the drug was dangerous," "Executives *were informed* of the risks," "The company *possessed data indicating* the danger" (Competence/Output). Using "knew" involves an inference about internal states based on evidence of access and communication.
  *   **Dog "Knowing":** "The dog knows its owner." Step 3: "Knows" implies recognition/understanding. Strictly: "The dog *consistently recognizes* its owner," "The dog *responds selectively* to its owner's commands" (Competence). "Knows" infers a mental state from behavior.

  *   **Conclusion:** This is not a *reductio* but highlights a key difference in our epistemological stance. For humans and animals, we routinely and reasonably *infer* mental states from behavior as the best available evidence, grounded in shared biology and evolutionary continuity. For current AI, we lack any comparable basis for that inference; behavior is generated by fundamentally different mechanisms. The procedure forces this distinction. It *is* acceptable to use "knows," "believes," etc., for humans/animals based on behavioral evidence *if* that is the magazine's standard practice. However, the procedure requires acknowledging that attributing these terms to AI rests on a fundamentally weaker, purely behavioral correlation without the underlying continuity, hence the stricter standard. Consistency demands different thresholds for entities with different ontologies.

  **The Residue: Editor Judgment Required**

  The procedure cannot resolve all stylistic choices. Editors must decide:

  1.  **Headlines & Space Constraints:** When extreme brevity is paramount, output-level verbs ("Says," "Refuses") are safest. Competence-level ("Can," "Detects") may be used if unequivocally proven and central. *Never* use experience-level terms. Accept that nuance is lost.
  2.  **First-Person/Reconstructed Narratives:** In immersive storytelling (e.g., user's experience with AI), vivid description is key. The procedure still binds the *reporter's* narrative voice. Describe the AI's *outputs* and the *user's reactions/perceptions*. Avoid stating the AI's internal state as fact ("The chatbot sensed her sadness" - Bad; "The chatbot responded to her mention of sadness, and she felt heard" - Better).
  3.  **Theory-Laden vs. Merely Vivid:** Some terms are inherently contested. "Reasoning" is high-risk (suggests internal process); prefer "step-by-step processing" or "generating a chain of thought." "Learning" is often used in ML but can mislead; specify "the system was updated based on new data" or "its performance improved after training." "Intelligent" is vague; prefer specific capabilities. Vivid language describing output ("eloquent," "convoluted," "confident-sounding") is permissible if accurate. The editor must gauge whether a vivid term smuggles in an unsubstantiated theory about internals.
  4.  **Edge Cases of Competence:** When does a pattern of outputs become a "capability"? Judgment is needed based on robustness, reproducibility, and evidence scope. When in doubt, default to output-level description.
  5.  **Evolving Evidence:** If credible, direct evidence of internal states relevant to specific terms emerges (e.g., new interpretability tools), revisit the procedure. Current evidence does not support experience-level attributions.
