answer: |-
  What you’re wrestling with is a beautifully concrete case of institutional epistemology colliding with personal judgment, and your unease is astute. The uplift rule isn’t just bureaucratic padding; it’s a negotiated settlement between competing ways of knowing, and its contradictions reveal where philosophy bleeds into policy. Let’s reconstruct its presuppositions.

  At its core, the rule presupposes two things: first, that planners (like you) are *systematically* overoptimistic due to cognitive biases and project-specific myopia; second, that historical data from "similar" projects provides a more reliable anchor than your inside-view assessment. This is pure outside-view epistemology: it treats your detailed estimate not as evidence to refine, but as a biased input requiring correction by aggregate base rates. The uplift is framed as a *calibration* tool, compensating for the human tendency to underestimate complexity, overlook interdependencies, or downplay unglamorous delays (like permit approvals or supply chain hiccups). On this reading, it’s not about *your* competence—it’s about the demonstrable failure of *all* planners to accurately forecast, grounded in decades of project data showing consistent overruns. The escape hatch—allowing you to reduce the uplift by proving your team’s rigor—isn’t a philosophical inconsistency but a practical concession. It acknowledges that while the *average* planner is overoptimistic, exceptional diligence *can* mitigate known risks (e.g., thorough vendor quotes, detailed risk registers). It’s not sneaking the inside view back in; it’s letting you argue your case *within the framework* set by the outside view. You’re not overturning the base rate; you’re demonstrating your project is less representative of its reference class than assumed.

  But the incentive question exposes deeper tensions. If the uplift is publicly known and mechanically applied, doesn’t it encourage teams to pad their base estimates, knowing the consultant will add more? And since historical data comes from projects governed by similar rules, isn’t the base rate itself corrupted? This suggests the rule isn’t purely epistemic—it’s also a *risk-allocation mechanism*. By separating "base cost" (your responsibility) from "optimism uplift" (the system’s hedge), it creates accountability layers. The council votes on the uplifted total because it represents the project’s *expected cost under institutional distrust*, not its "true" cost. The uplift absorbs political and financial risk: if costs overrun, the committee can point to the consultant’s adjustment as due diligence; if they come in under, the council looks prudent. On this view, the uplift isn’t about correcting beliefs—it’s about managing blame. Your "estimate" becomes a lower-bound anchor, while the uplift serves as a publicly justifiable buffer.

  The one-directionality—applying uplift only to costs/duration, not benefits—is the starkest tell. It reveals the rule’s unstated priority: avoiding cost overruns is institutionally paramount, while overpromising benefits carries fewer consequences. No town reduces its projected library usage by 40% because similar projects overestimated foot traffic. This asymmetry isn’t epistemic; it’s *motivated*. Funders tolerate inflated benefits but punish inflated costs, so the system internalizes that bias. The uplift rule codifies pessimism where failure is punished (costs) and leaves optimism unchecked where it’s rewarded (benefits). It’s not about truth-seeking; it’s about loss aversion.

  So where is this optional? The practice is genuinely underdetermined in its *scope of deference*. A staunch outside-view adherent would argue the base rate should *replace* your estimate—not adjust it—because your inside view adds no unique signal. A moderate might see the uplift as a necessary counterweight, with the escape hatch allowing nuanced calibration. Both could endorse the *structure* while disagreeing on its *weight*. Similarly, someone emphasizing incentives might keep the uplift as a risk-pooling tool, even if they doubt its epistemic purity.

  **What changes if you take the outside view seriously?**  
  If your committee truly believed the base rate was superior evidence, you’d:  
  1.  **Replace, don’t adjust:** Submit the raw historical median cost for projects in your reference class as the "estimate," treating your detailed calculation as a secondary input for the escape hatch debate.  
  2.  **Demand symmetric modesty:** Apply a comparable benefit-discount (e.g., "Based on similar projects, expected visitation is 30% lower than projections").  
  3.  **Question the reference class:** Argue for finer-grained categories (e.g., "digitization projects in municipal libraries under $500k") using your inside view to *define* the class, not defy it.  
  4.  **Track the meta-data:** Record why projects overran—was it poor planning, external shocks, or the uplift rule itself inducing moral hazard?  

  But pragmatically, the rule persists because it balances accountability, defensibility, and simplicity. To bring this back to your committee: don’t frame it as "philosophy versus practice." Instead, ask: *What problem is the uplift solving for us?* If it’s truly about calibration, push to document your escape-hatch evidence rigorously—not just checklists, but quantifying how your prep (e.g., pre-quoted shelving) reduces uncertainty. If it’s about risk-sharing, acknowledge the political theater but insist the base estimate remains visible so the council sees what’s being hedged. And if the asymmetry rankles, float a trial discount on projected benefits—not to sabotage the project, but to test whether epistemic modesty cuts both ways. The rule’s power lies in its brute-force reduction of complexity; your power lies in showing where that reduction distorts more than it reveals.
