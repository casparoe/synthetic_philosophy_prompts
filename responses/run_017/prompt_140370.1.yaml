  Their question about asymmetry cuts deep - why only adjust costs downward and benefits upward? If we're truly being epistemically modest, shouldn't we apply base rates to benefit estimates too? This reveals the practice's unacknowledged pro-development bias.

  The most profound question concerns belief versus convention. Is the uplift meant to correct actual beliefs, or is it just a budgeting ritual? The answer matters because councils make real decisions based on these numbers. If it's mere convention, we're essentially institutionalizing a known fiction.

  I'll structure my response to first reconstruct the implicit epistemology, then show where it's optional, and finally suggest concrete changes for their committee. The key insight is that this practice is a hybrid - part epistemic correction, part risk management, part political ritual. 

