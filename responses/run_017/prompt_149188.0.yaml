prompt: |-
  I'm a philosophy PhD student working on a dissertation chapter about expected-value fanaticism — the thesis that for every positive probability p and every finite value U there is some finite value V such that a p-chance of V is better than a certainty of U, so that no chance is too small to be outweighed by a large enough stake. I've built an argument that appears to refute it, and I don't believe the conclusion, partly because the argument seems to refute a great deal else besides. Call a "story" a hypothesis linking one of my available actions to its consequences, carrying both a prior probability and a stake.

  (1) Fanaticism, as just defined.
  (2) In any actual decision my evidence does not fix a single probability for the hypothesis that action a yields V; it fixes a class of stories. For every n there are stories compatible with my evidence, of description length around n and hence prior weight of order 2^-n, on which a yields value of order 2^n. This is the only unboundedness fanaticism needs.
  (3) For every such story H there is a mirror story H*, of the same description length up to an additive constant, on which a yields the matching disvalue: a description can be negated at no extra cost, and nothing about simplicity favors the benign sign.
  (4) So for every action a and every n, the prior-weighted contributions of the pro-a and anti-a stories of length n cancel.
  (5) Since this holds for every a, the fanatic's ranking of her actions is settled by nothing but the residual asymmetry between the mirrored families — a constant number of bits, unknowable in practice and arbitrary in principle.
  (6) But fanaticism was supposed to be the view on which stakes, not fine detail of the prior, settle the choice. A view whose verdicts turn on unknowably small asymmetries between equally simple hypotheses is not that view but its denial. So fanaticism collapses into its own opposite.
  (7) The template is not specific to fanaticism. Run (2)–(5) with any stakes-sensitive principle — or with a trivial choice such as whether to take an aspirin, where every story on which the aspirin prevents a headache has an equal-length mirror on which it triggers an astronomical catastrophe — and deliberation collapses in exactly the same way. It plainly does not.

  So: which step should I reject, and what does rejecting it cost? I would like to keep (1) and (2) if I can. I oscillate between (3) and (5) without being able to tell whether they are two mistakes or one, and I want to know why whichever step is at fault looked innocent. I have also been toying with a "length-stake bound": a story of description length n may carry stakes of at most 2^(n/2), so that prior weight times stake converges again and the mirrored sums stay finite. Does that bound survive step (2), or is it bounded utility under another name — and if it is, is that a price I should simply pay?
reasoning: |-
  Okay, let me start by really understanding what this philosophy PhD student is grappling with. They've built an argument that seems to refute expected-value fanaticism, but they don't believe the conclusion because it also takes down a lot of other things. The core idea is that fanaticism says no probability is too small to be outweighed by a big enough reward. But their argument shows that because of mirrored stories—each positive outcome story has a negative counterpart—the expected values cancel out. That leaves only tiny asymmetries to decide actions, which contradicts fanaticism's reliance on high stakes.

  First, I need to unpack each step of their argument. Step (1) is the definition of fanaticism. Step (2) says evidence doesn't fix a single probability but a class of stories. For any action, there are stories with prior weight around 2^{-n} that give value 2^n. Step (3) introduces mirrored stories: each story has a counterpart of similar length but with disvalue. Step (4) says these cancel out. Step (5) concludes that only residual asymmetries decide actions. Step (6) argues this undermines fanaticism. Step (7) says this problem generalizes.

  The student is oscillating between rejecting step (3) or step (5). They also mention a "length-stake bound" to cap stakes at 2^{n/2}, making prior weight times stake converge. But they worry this might imply bounded utility, which is a big cost.

  So, where's the flaw? I recall that in Bayesian epistemology, priors are fixed before considering evidence. Step (2) talks about priors based on description length, like Kolmogorov complexity. But step (3) assumes that negating a description is cost-free. However, in reality, the simplicity of a hypothesis isn't just about string length. A hypothesis and its negation might not be symmetric in terms of plausibility. For example, "the aspirin cures headache" vs. "the aspirin causes catastrophe" – the latter might require more complex mechanisms, making it less simple even if the string length is similar. So step (3) might be wrong because negation doesn't preserve simplicity in a way that ensures exact cancellation.

  But if step (3) is rejected, then the cancellation doesn't happen. However, the student wants to keep step (2). Step (2) relies on the existence of high-stakes stories with low priors. But even if mirrored stories exist, their simplicity might differ. The key is whether the prior assigns symmetric probabilities to a story and its negation. In standard priors, like the universal prior, the probability of a hypothesis isn't necessarily equal to its negation because the set of descriptions isn't symmetric. Some strings describe valid hypotheses; others don't. So the probabilities might not cancel perfectly.

  Step (5) assumes that the residual asymmetry is negligible. But if the prior assigns different weights to H and H*, even slightly, those differences could add up. The student calls it "unknowable in practice and arbitrary," but in fanaticism, large stakes could amplify even small asymmetries. So step (5) might underestimate how small asymmetries can influence decisions when stakes are high.

  The length-stake bound is another approach. Capping stakes at 2^{n/2} ensures the sum converges. But that implies bounded utility, which contradicts fanaticism. If utility is bounded, then fanaticism is false because no finite stake can outweigh arbitrarily small probabilities. So adopting this bound means rejecting fanaticism, which the student wants to avoid.

  Alternative approaches: Maybe reject the idea that all possible stories are relevant. Evidence might rule out some stories, especially those with high stakes. But step (2) says evidence doesn't fix a single probability, so multiple stories are compatible. However, evidence might still constrain the probabilities, making some stories more plausible than others. The mirrored stories might not be equally supported by evidence. For example, the hypothesis that aspirin causes a catastrophe might not fit with existing medical knowledge, so its prior is lower than its benign counterpart. But the student's argument assumes that simplicity is only about description length, but in practice, priors incorporate empirical adequacy.

  Another point: fanaticism might require that the expected value is infinite, but if cancellation occurs, the expected value might not be defined. In decision theory, actions with undefined expected utility can't be compared. But fanaticism assumes comparability.

  The student mentioned that the argument collapses deliberation in trivial cases, like taking aspirin. But in reality, we don't worry about such mirrored catastrophes. Why? Because our priors assign negligible probability to those stories. The mirrored stories have very low priors, but the key is asymmetry. If the prior for a catastrophe story is lower than for a benign story, even slightly, that asymmetry might be enough to decide. But the student argues that the asymmetry is arbitrary and unknowable. However, in practice, our priors are shaped by experience, making benign stories more probable.

  So, the flaw might be in step (3). The negation of a story might not be equally simple. For instance, negating a description might require additional complexity to ensure syntactic correctness, or the set of valid hypotheses might not include all negations. Therefore, H and H* might not have the same prior, breaking the cancellation.

  Alternatively, step (4) assumes that the only contributions are from these mirrored stories. But there could be other stories that aren't mirrored, or the actions might affect which stories are relevant. The decision-maker might have a bounded set of hypotheses they consider, though that seems ad hoc.

  The student’s deeper concern is that their argument refutes too much. If it generalizes, then any decision could be undermined by mirrored stories. But since we make decisions without this problem, there must be a flaw. The flaw likely lies in the symmetric treatment of stories and their mirrors. Real-world priors don't treat benign and catastrophic hypotheses as equally likely, even if their description lengths are similar. Simplicity isn't just string length; it includes fit with background knowledge. So while step (2) might hold in a computational sense, step (3) fails because the actual prior probabilities aren't symmetric. Thus, the cancellation doesn't occur, and fanaticism isn't refuted.
answer: |-
  Your argument is ingenious and touches deep issues in decision theory, probability, and epistemology. I'll break down the analysis step by step, identify the most vulnerable premise, explain why it fails, and assess the costs of rejection. The core flaw lies in **step (3)**, but it cascades into step (5). Here’s the diagnosis:

  ### Step-by-Step Critique
  1. **Step (1) (Fanaticism)** is sound as a definition.  
  2. **Step (2) (Unbounded stakes via description length)** is plausible for many priors (e.g., Solomonoff induction). It holds if:  
     - The hypothesis space includes "benign" stories of length `n` with stakes `~O(2^n)`.  
     - Priors decay exponentially with description length (e.g., `P(H) ∝ 2^{-K(H)}` for Kolmogorov complexity `K`).  
     *This step is defensible and should be kept.*  
  3. **Step (3) (Symmetrical mirrors)** is the critical flaw:  
     > *"For every story H there is a mirror story H*, of the same description length up to an additive constant, on which a yields matching disvalue."*  
     **Why this fails:**  
     - **Not all hypotheses have symmetrical negations.** A story "action `a` causes value `V`" and its mirror "`a` causes disvalue `-V`" **do not necessarily share the same prior probability**. Simplicity priors (like `2^{-K(H)}`) depend on the *shortest program* describing `H`, but negating a hypothesis often **changes its computational structure**.  
       - Example: A program outputting "`a` saves `2^n` lives" might have length `n + c`. Its negation "`a` kills `2^n` lives" requires *additional code* to invert outcomes (e.g., flipping a sign or adding a catastrophic clause). This can increase `K(H*)` by more than `O(1)`.  
     - **Asymmetry in plausibility:** Background knowledge (e.g., "aspirins rarely cause catastrophes") breaks symmetry. Priors aren't just about string length—they incorporate *semantic coherence* with existing knowledge. A "catastrophe" story may require *more ad-hoc assumptions* than a benign one, increasing its effective complexity.  
     - **Cancellation requires exact symmetry:** Even if `K(H) ≈ K(H*)`, priors depend on the *universal prior distribution*, which isn't guaranteed to assign equal mass to `H` and `H*` (e.g., due to subtleties in how Turing machines enumerate hypotheses).  
     **Cost of rejecting (3):** You must accept that **not all high-stakes hypotheses have low-complexity mirrors**. This is reasonable—it aligns with how we model hypotheses in practice (e.g., in science, "drug cures disease" and "drug causes new plague" aren’t equally simple). No major philosophical cost here.  
  4. **Step (4) & (5) (Cancellation and residual asymmetry)** collapse if (3) fails:  
     - Without symmetrical priors, pro- and anti-`a` stories **don’t cancel perfectly**. The residual isn’t arbitrary—it’s determined by the *actual prior*, which may favor benign or catastrophic hypotheses based on structure and evidence.  
     - Fanaticism can still hold: If the net expected value (after summing all stories) diverges to `+∞` for some actions (e.g., due to slight asymmetries favoring high-stakes rewards), fanaticism survives.  
     **Why (5) looked plausible:** It assumes cancellation is perfect, but this relies on (3)’s symmetry. Without it, small asymmetries *can* be amplified by large stakes, which is *consistent* with fanaticism.  
  5. **Step (6) & (7) (Collapse of deliberation)** don’t follow:  
     - Without cancellation, fanaticism isn’t refuted. The aspirin example fails because catastrophe stories (e.g., "triggers supernova") have **higher complexity** than benign ones—they require specifying implausible causal chains. Evidence rules them out, making their priors negligible.  
     - Real-world deliberation works because priors **asymmetrically favor plausible hypotheses** (even at similar description lengths).

  ### The "Length-Stake Bound" Proposal
  You suggest capping stakes at `2^{n/2}` for a length-`n` story to force convergence. This is equivalent to **bounded utility**:  
  - If `stakes ≤ f(n)` and `P(H) ∝ 2^{-n}`, then `|E[H]| ≤ ∑_n 2^{-n} f(n)`. For `f(n) = 2^{n/2}`, this sums to a constant.  
  **Costs:**  
  1. **Rejects fanaticism directly:** Bounded utility implies no finite stake can outweigh arbitrarily small probabilities—contradicting (1).  
  2. **May be too restrictive:** Many ethical systems (e.g., total utilitarianism) require unbounded stakes. If you adopt this, you abandon fanaticism by fiat.  
  **Verdict:** Only use this if you’re willing to deny fanaticism—it doesn’t "save" the view.

  ### Why the Argument Felt Compelling
  - **Step (3) exploits a computational symmetry:** In a purely syntactic view (where hypotheses are bitstrings), negating a string *is* low-cost. But decision-relevant hypotheses aren’t arbitrary bitstrings—they must be *causally coherent* and *compatible with evidence*. This breaks the symmetry.  
  - **Step (5) highlights a genuine issue:** Priors *do* influence fanaticism (e.g., Pascal’s Wager relies on non-zero probability for God). But fanaticism doesn’t require priors to be *ignored*—only that they don’t *dominate* stakes. Small asymmetries can still drive decisions under large stakes.

  ### Recommended Response
  1. **Reject step (3)**. Maintain that high-stakes mirrors exist but lack symmetrical priors due to:  
     - Computational asymmetry (negation isn’t free),  
     - Empirical asymmetry (background knowledge favors benign stories).  
  2. **Modify step (2)**: Clarify that "stories" must be *causally possible* given evidence. This filters absurd mirrors (e.g., "aspirin causes supernova") without bounded utility.  
  3. **Consequence for fanaticism:** It survives but becomes *sensitive to priors*. This isn’t fatal—every decision theory is prior-sensitive. The key is that stakes can still dominate when probabilities are non-negligible.  

  This preserves fanaticism while explaining why mirrored catastrophes don’t paralyze real decisions: they have **lower prior probability** (not just higher disvalue) due to complexity/plausibility asymmetries. Your argument thus refutes only a *naive* fanaticism that ignores the structure of hypotheses—not the core idea that large stakes can outweigh small probabilities.

  ---
  **Final note**: The oscillation between (3) and (5) stems from (3) creating the illusion of symmetry, which then forces (5)’s residual-asymmetry problem. Rejecting (3) dissolves both. If you retain (2), ensure priors reflect *minimum description length relative to a language encoding causal laws*—this naturally suppresses symmetrical mirrors.
