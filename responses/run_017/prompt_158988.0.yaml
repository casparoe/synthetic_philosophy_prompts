  Hmm, the core challenge is fascinating - they're attacking my hermeneutic principle that scripture's plain meaning stands unless overturned by demonstration. Their "speech acts" theory suggests biblical descriptions of nature are merely cultural presuppositions, not inspired claims. Clever move, forcing me to defend Joshua's miracle as more than background assumption.

  *adjusting imaginary lace cuffs* I must stay true to Galileo's convictions: Scripture is inerrant in faith/morals, but not a science manual. The Church's interpretation rules matter deeply to me. I can't accept the modern science/religion divorce, yet I need to show how biblical language accommodates scientific progress without discarding inspiration.

  Ah! The Joshua example is perfect ground for counterargument. If the sun standing still is mere cultural framing like "road to Florence", then the miracle itself dissolves - which even my opponent wants to preserve. So I'll press that flaw while reasserting my key distinction: Scripture asserts divine acts, not natural philosophy. The "speech act" theory crumbles when tested against miracles.

  *leaning forward with inked quill* And I must end provocatively - questioning how their hypothesis handles prophecy, making them engage my actual position rather than a strawman. The certainty demand stays, but I'll concede that overwhelming evidence (like future confirmation of heliocentrism) could warrant reinterpretation. That's the hinge: when does evidence become "morally certain" enough?
answer: |-
  *slapping the table, inkwell rattling* Ha! You strike at the joint in the armor – but your new principle unravels faster than cheap thread! First, Joshua: God suspending the celestial spheres *is* the asserted miracle, not some idle presumption about spheres! The text *commands* the sun – that *is* the divine act! Your "speech act" knife cuts the miracle's throat if you call *that* mere background. Absurd! Scripture asserts the Lord's intervention, not just Ptolemy's model.

  Now your certainty objection. *Paces, gesturing sharply.* You mistake the nature of "demonstration"! Must it be the metaphysician's chains of logic? No! When sense and reason converge so powerfully that *no sane man* could deny it – Copernicus’s geometry, the Medicean stars circling Jupiter, Venus's phases proving orbital enclosure – this yields moral certainty. Stronger than mere hypotheses! Your future scholars admit the Earth *moves*? Then that *is* the demonstration achieved! Enough to show the Psalm speaks phenomenologically – how things *appear* to men standing on Earth – not physically. The Holy Spirit condescends to human perception in such places, demanding faith only where salvation hangs. 

  Your principle fails its own test: if mere cultural presupposition carries no authority, why trust *any* historical narrative in Scripture? Was Abraham's call just "background noise"? No! The distinction holds: where Scripture *teaches* (faith, morals, divine acts) it speaks with authority; where it *uses* the common understanding of nature to frame that teaching, that frame is provisional. You need no "demonstration" to discard an *assumed* frame when overwhelming evidence shifts – only to overturn a *doctrinal* assertion. So! How does your speech-act theory salvage Joshua's miracle without gutting it, or Abraham's call without reducing it to local gossip? *Stops, eyes alight, waiting.*
