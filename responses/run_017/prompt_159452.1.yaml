prompt: |-
  Hi — please act as a professional philosopher who specialises in social epistemology and testimony, and who's also read a fair bit of historiography. Take your time, do some brainstorming before you settle on anything, and write the whole answer in British English.

  I keep running into 'history is written by the victors' in one very specific argument and it's driving me up the wall. Context: near where I grew up there's a long-running dispute — a local community has an oral tradition that soldiers killed a crowd of people at a river crossing in the 1890s, and the only written sources are the colonial administration's own papers, which describe a 'dispersal' and record no deaths. A historian said the record obviously wins. Someone else came back with the slogan and concluded the opposite: the community's memory wins by default, because the papers are just the winners' story. Both moves feel too quick to me.

  Can you lay out, as a menu from weakest to strongest, the different precise claims that sentence could be making? Things like: victors control which records get made and kept, so absence isn't evidence of anything; victors distort the content of what gets written; the victors' account becomes the truth for its period; there's no fact of the matter at all beyond whoever currently has power. For each one say whether it's a platitude, a serious but arguable thesis, or just false — and, the bit I actually care about, whether it supports the conclusion it was being used for. My worry is that it's a claim about how records get produced, and doesn't on its own tell you what to believe when the record and a living memory disagree. Please don't give me reading lists or citations, I've got no library access.

  One more thing I've been chewing on, and I'd like it folded in rather than answered separately: I suspect 'the community remembers that X' is doing about three different jobs at once — claiming that X occured, bearing witness to something that's still going on, and holding the group together as a group — and that 'which gives way, memory or record?' has a different answer depending on wich job it's doing, or maybe stops being the right question for one or two of them. Tell me whether that's on to something or muddled, and whether there's a cleaner way to carve it up.
