prompt: |-
  I need your help preparing for a two-hour session with our Allocation Methods Committee next Thursday, at which I am asking them to replace the rule we use to rank candidate funding allocations.

  The setting: I work at a public research-funding agency with roughly 400 million dollars of discretionary money per cycle, paid out in about two hundred awards. Realised value is extremely skewed — a small handful of awards account for most of what the agency ever accomplishes — and our outcome estimates are noisy, model-based, and in many cases little better than order-of-magnitude guesses.

  The proposal. We currently rank allocations by expected value over a common numeraire (say QALYs, or dollars of social value), with an informal overlay: program officers are told not to let any one theme absorb too much of the cycle and to keep a few long-shot awards in every round. I want to replace both the expected-value rule and the overlay with one explicit rule: value each candidate allocation by risk-weighted expected utility, defined as follows. Rank an allocation's possible outcomes from worst to best; walk up the ranking and weight each utility increment by r applied to the probability of doing at least that well, where r is an increasing function from [0,1] onto [0,1]. Because r need not be the identity, this keeps statewise dominance and transitivity while giving up the independence axiom, so Allais-style choices become permissible rather than axiomatic errors.

  Three further specifications matter, and I expect them to be where the fighting happens:

  One, I take utility in the numeraire to be linear and put all risk attitude into r, parametrised as r(q) = q^k with k above 1, so that increments in the upper tail count for less than their probability. k is to be calibrated by putting a dozen or so binary choices between a sure cohort-level outcome and a gamble to the committee itself; pilot runs land between about 1.3 and 1.6, and I intend to report every recommendation for the whole range k between 1 and 2.

  Two, r is applied once, to the distribution of total cohort value, and not award by award. The risk function does not decompose additively across independent awards, and the two orderings differ sharply: applied award by award the variance penalty grows roughly with the number of awards, applied to the cohort distribution it grows roughly with its square root, which at our scale is a difference of more than an order of magnitude.

  Three, a carve-out. Ten to fifteen awards per cycle are genuinely one-shot — an observation window that closes, an outbreak that will have run its course, a field season that cannot be rescheduled. For these the diversification that dilutes risk aversion at cohort level is not available, so I want them weighted on their own rather than pooled.

  The room. Two microeconometricians who run field experiments and whose default is to maximise expected social value; our chief statistician, a Bayesian who will care about what is identifiable and what is not; one former reinsurance pricing actuary, who is sympathetic to risk aversion in principle but will insist that institutions manage risk with capital requirements and risk measures rather than with preferences; three program directors who are attached to the balance overlay and who will read any risk-averse rule as an attack on high-variance, high-upside work; and one board member with a decision-theory background who will know the framework and press the technical objections. Assume I know the literature, so I need no citations, references, or suggested reading.

  Please give me a preparation sheet with these five sections, in this order and at roughly these lengths:

  1. "Where the room is" — about 150 words. Who speaks first, which blocs align with which, what each group is actually protecting, and which objection is likely to be raised by someone other than the person I expect it from.

  2. "The objections, in the order they will come" — about 900 words. Eight objections, ordered by how likely and how damaging they are rather than by whose they are. For each: who raises it; the objection in that person's own vocabulary and idiom, not in mine; a rough damage ranking; the reply I should give in about two minutes; and one line on where that reply is soft or question-begging. I would rather have the two or three genuinely dangerous objections treated at length than all eight treated evenly.

  3. "What I should concede before anyone asks" — about 200 words. The points I should give away in the first five minutes so that I am not forced into them later, and how to concede them without conceding the proposal.

  4. "The reply that has to land" — about 250 words. The single response on which the proposal stands or falls, what it has to establish, and how it fails if it is delivered badly.

  5. "The question I am hoping nobody asks" — about 200 words. My own guess is that it concerns whether the agency's soft ruin state — the fact that a cycle with no visible successes invites a budget cut that forecloses later cycles — is a feature of the world, which belongs in the model, or a feature of our attitudes, which is then just being relocated into r. Tell me if that is the right thing to fear and, if it is, what I should say if it comes anyway. Override my guess if you think something else is worse for me.
reasoning: |-
  We are preparing for a committee meeting to replace the current expected-value ranking with a risk-weighted expected utility (RWEU) approach. The committee includes diverse stakeholders with different concerns. We need a preparation sheet with five sections as specified.

  ### 1. Where the room is (150 words)
  The meeting will open with the board member (decision theorist) setting the technical stage, followed by the microeconometricians challenging the departure from expected value. The program directors will voice early concerns about balance. Blocs: 
  - **Microeconometricians and Bayesian statistician** form a technical bloc focused on efficiency, identifiability, and adherence to classical axioms. They protect methodological purity and fear ad hoc adjustments.
  - **Program directors** protect portfolio diversity and high-variance projects, fearing risk aversion will penalize moonshots.
  - **Actuary** will side with risk adjustment but argue for institutional risk management (capital, VaR) over preference-based methods.
  - **Board member** will critique the technical setup, e.g., non-additivity of risk weights.

  Unexpectedly, the Bayesian might echo program directors on identifiability of tail probabilities, arguing that noisy estimates make RWEU unstable — an objection I expect from the actuary on capital grounds.

  ### 2. The objections, in the order they will come (900 words)

  #### Objection 1 (Microeconometricians): "This abandons the gold standard. Expected value maximization is the only coherent way to rank allocations under uncertainty when stakes are societal. Risk aversion is for private actors; we are a public agency spending others' money. Your risk-weighting is just a fancy way to be timid."
  - **Damage**: High. Undermines foundational philosophy.
  - **Reply**: Public agencies must account for catastrophic risk — not doing so is a failure of fiduciary duty. RWEU generalizes expected value (when k=1) and is equally coherent (satisfies statewise dominance and transitivity). We are not being timid; we are reweighting to avoid overexposure to tail risk. The k>1 calibration (from committee choices) reflects societal prudence, not timidity.
  - **Soft spot**: Assumes committee choices reflect societal risk aversion; may not hold for public funds.

  #### Objection 2 (Program directors): "This will kill high-risk, high-reward projects. We already have an overlay for balance; why replace it with math that suffocates bold ideas?"
  - **Damage**: High. Risks losing key supporters.
  - **Reply**: The overlay is informal and arbitrary. RWEU explicitly values upside but weights it less than probability suggests (k>1). High-risk projects still get funded if their upside is massive — but not at the expense of catastrophic cohort failure. The carve-out for one-shot awards protects truly irreplaceable opportunities.
  - **Soft spot**: Carve-out might seem like special pleading; doesn't fully address dilution of upside.

  #### Objection 3 (Actuary): "Risk belongs on the balance sheet, not in the utility function. Set a capital requirement or use a risk measure like TVaR. Twisting preferences is inefficient and hides the risk cost."
  - **Damage**: Medium (if accepted, could derail to institutional redesign).
  - **Reply**: Our mandate is allocation, not capital management. We lack a balance sheet — our 'capital' is annual appropriations. Risk measures (like TVaR) are embedded in RWEU via r(q). This is a tractable way to integrate risk without redesigning the agency.
  - **Soft spot**: Ignores that RWEU is a preference-based approach; actuary wants structural risk control.

  #### Objection 4 (Bayesian statistician): "With noisy estimates, your tail probabilities are garbage. RWEU amplifies estimation error in the tails, making rankings volatile and unactionable."
  - **Damage**: Critical. Challenges practical feasibility.
  - **Reply**: We use model-based estimates already, and noise affects all methods. RWEU with k~1.5 downweights extreme tails, making it less sensitive to tail noise than, say, CVaR. We will report results for k=1 to 2 to show robustness.
  - **Soft spot**: If tail estimates are unreliable, any nonlinear transformation exacerbates errors.

  #### Objection 5 (Board member): "Applying r at cohort level violates the independence axiom. Why should one award’s risk depend on others? This is arbitrary and hard to explain."
  - **Damage**: Medium-high. Questions theoretical integrity.
  - **Reply**: Independence is normatively questionable (Allais). Pooling reflects our reality: outcomes are evaluated at cohort level. Diversification reduces risk aversion naturally — just as in finance, where portfolio risk isn't sum of individual risks. Award-by-award application would over-penalize variance.
  - **Soft spot**: Pooling assumes awards are independent; if correlated, diversification benefit is overstated.

  #### Objection 6 (Microeconometricians): "Linear utility? That assumes constant marginal value of the numeraire. But we fund until budgets are exhausted — marginal value should diminish."
  - **Damage**: Low (fixable).
  - **Reply**: We operate at a small fraction of societal need — even our total budget doesn't move the needle on numeraire scarcity. Linear utility is a standard approximation. If needed, we can adjust the numeraire to capture diminishing returns.
  - **Soft spot**: If our funding shifts sectoral outcomes, marginal value may drop.

  #### Objection 7 (Program directors): "The carve-out is unfair. Why do ‘one-shot’ awards get special treatment? Every PI thinks their work is urgent."
  - **Damage**: Medium (perception of bias).
  - **Reply**: The carve-out is narrow and objective: only when deferral is impossible. This is auditable via project timelines. For non-one-shot awards, pooling is fairer because we can diversify over time.
  - **Soft spot**: May create lobbying to classify projects as one-shot.

  #### Objection 8 (Actuary/Bayesian): "k=1.3–1.6 from binary choices? That’s arbitrary and context-dependent. Why not use market prices or revealed preferences?"
  - **Damage**: Medium.
  - **Reply**: We lack revealed preferences for societal outcomes. Calibrating k to committee choices ensures alignment with agency values. We test robustness across k.
  - **Soft spot**: Committee members aren't representative of society.

  ---

  ### 3. What I should concede before anyone asks (200 words)
  Concede two points upfront to preempt attacks:
  1. **Estimation noise**: "Our outcome models are noisy — especially in tails. This affects any method, including expected value. We will invest in better models, but we must allocate now. RWEU with k>1 is actually less tail-sensitive than some alternatives."
     - *How it helps*: Neutralizes the Bayesian’s strongest point by acknowledging it and reframing RWEU as part of the solution.

  2. **The independence axiom**: "Yes, we violate independence. But so does any allocation that considers correlations or externalities. We care about total cohort value, not isolated awards. This isn’t ad hoc; it’s necessary for diversification."
     - *How it helps*: Preempts the board member by reframing the violation as a feature for portfolio effects.

  Also, concede that **linear utility is an approximation**, but argue it is fit for purpose at our scale. Offer to explore curvature later if needed.

  These concessions show we’ve thought about weaknesses but don’t undermine the proposal — they contextualize it.

  ---

  ### 4. The reply that has to land (250 words)
  **The core reply**: When the microeconometricians or program directors claim we are abandoning high-upside work, we must pivot to the *catastrophic risk* of cohort failure. 

  Say: "Our current system overloads the portfolio with high-variance awards. Because our outcome estimates are noisy and skewed, we don’t notice until a cycle fails entirely. A cycle with no visible successes — which RWEU makes less likely — risks budget cuts that foreclose future cycles. That is societal loss at scale. RWEU protects against this by underweighting the upper tail (where we have over-optimism) and overweighting the worst outcomes (where ruin lives). The overlay is a band-aid; RWEU is a tourniquet. 

  And yes, we still fund moonshots: when their upside is huge, they compensate for risk. But we fund fewer of them per cycle, so that if one fails, the whole cohort doesn’t. The carve-out ensures we don’t miss urgent, undiversifiable opportunities. 

  This isn’t risk aversion — it’s ruin aversion. And ruin is a fact, not a preference."

  **Why it must land**: If the committee sees RWEU as timidity, we lose. This reframe makes it about institutional survival and long-term value. 

  **Delivery**: Slow and emphatic. Whiteboard the cohort distribution and show how r(q)=q^k (k>1) shifts weight leftward. Contrast with award-by-award penalization (which would decimate high-variance awards).

  **If it fails**: The program directors and microeconometricians block the vote.

  ---

  ### 5. The question I am hoping nobody asks (200 words)
  **Your guess is correct**: The worst question is whether the soft ruin state (budget cuts after a failed cycle) is a *world state* (to model in outcomes) or a *preference* (to put in r). 

  **Why it’s deadly**: If ruin is a world state, we should include it in the outcome model (e.g., as a multiplier on future value). But our models don’t capture it — making RWEV seem like a kludge. If it’s a preference, then r already includes it, but the actuary will say preferences shouldn’t drive public agencies.

  **Reply if asked**: "It’s both. The budget cut is a real consequence of cohort failure — a second-order loss. But we cannot reliably estimate its probability or magnitude; it’s too path-dependent. So we embed it as a risk attitude via k>1, calibrated to the committee’s revealed aversion to total failure. This is a pragmatic encoding of a systemic risk."

  **Override**: An even worse question: "What if awards are correlated?" We assume independence, but if all awards fail together (e.g., a common methodological flaw), diversification fails. This could make RWEV under-penalize. Have a contingency: "We test for correlation in historical data and adjust the risk-weighting if needed."
answer: |-
  ### Preparation Sheet for Allocation Methods Committee Session  

  ---

  #### 1. Where the room is (150 words)  
  The board member (decision theorist) will open with technical scrutiny, pressing coherence and axioms. Microeconometricians and the Bayesian statistician align as an "efficiency bloc": they prioritize expected-value purity, identifiability, and fear ad hoc distortions. Program directors will defend the overlay as protecting high-variance "moonshots" and thematic balance, interpreting RWEU as penalizing boldness. The actuary will split: sympathetic to risk aversion but demand institutional (not preference-based) risk management via capital buffers. Unexpectedly, the Bayesian may amplify program directors on identifiability ("Noisy tails make RWEU unstable!"), while a program director might co-opt the actuary’s language ("This isn’t risk management—it’s institutional cowardice"). Each bloc protects its paradigm: efficiency bloc their models, program directors their discretion, actuary his professional doctrine. The silent tension: all fear losing control—either to opaque math or arbitrary overlays.  

  ---

  #### 2. The objections, in the order they will come (900 words)  
  *(Prioritized by damage; replies capped at 2 mins each)*  

  **Objection 1 (Program directors, then echoed by microeconometricians):** "This will slaughter high-variance, high-upside projects. Our moonshots are why we exist, and your risk-weighting is a backdoor way to defund them. The current overlay handles this fairly—your math is a straitjacket."  
  - **Damage**: Catastrophic (loses swing voters; implies agency abdicates mission).  
  - **Reply**: "RWEU doesn’t eliminate moonshots—it funds them *sustainably*. Under expected value, one moonshot can crowd out safer bets, risking total cohort failure. With k>1, we still fund massive-upside awards but only when their upside justifies the risk of a wipeout. The carve-out explicitly protects urgent, undiversifiable moonshots. Your overlay is subjective; this is transparent."  
  - **Soft spot**: Assumes RWEU’s "sustainable" threshold matches intuition; doesn’t disprove that some moonshots will lose out.  

  **Objection 2 (Bayesian statistician, then actuary):** "Your tail probabilities are unidentifiable noise. We have order-of-magnitude guesses—applying r(q)=q^k amplifies estimation error, making rankings arbitrary. Garbage in, garbage out!"  
  - **Damage**: Critical (undermines entire framework’s feasibility).  
  - **Reply**: "All methods suffer from noise, but RWEU mitigates it. By underweighting extreme tails (k>1), RWEU is *less* sensitive to tail noise than VaR or CVaR. Expected value overweights noisy tails too—it just hides it. We’ll report results for k=1–2 to show robustness, and we’re developing better models. This isn’t a new problem; it’s a better solution."  
  - **Soft spot**: If tails are pure noise, even robustness bands may be illusory.  

  **Objection 3 (Actuary, then board member):** "Risk aversion belongs in capital reserves, not preferences. Set a ruin probability or use TVaR—don’t bake it into allocations. This misapplies decision theory to institutional design."  
  - **Damage**: High (reframes debate; could derail to structural overhaul).  
  - **Reply**: "We’re a funding agency, not a bank. We have no capital buffer—our ‘ruin’ is political: a failed cycle triggers budget cuts. RWEU encodes this efficiently. TVaR is embedded in r(q) (e.g., k>1 approximates aversion to left tails), but unlike TVaR, RWEU handles full distributions and keeps ranking coherence. Institutional redesign isn’t on the table."  
  - **Soft spot**: Concedes RWEU relabeling preferences without structural change.  

  **Objection 4 (Microeconometricians):** "Public agencies must maximize expected social value—risk aversion is unethical with others’ money. Your ‘risk-weighted’ utility is paternalism masquerading as rigor."  
  - **Damage**: High (core philosophy clash).  
  - **Reply**: "Expected value ignores catastrophic risk—*that’s* unethical. If a 10% chance of funding zero breakthroughs loses our budget, we’ve failed beneficiaries. RWEU generalizes expected value (k=1) and is calibrated to *your* revealed preferences. Is it paternalistic to avoid ruin? No—it’s fiduciary duty."  
  - **Soft spot**: "Calibrated to committee" dodges societal risk-aversion legitimacy.  

  **Objection 5 (Board member):** "Applying r at cohort level violates award-level independence. Why should one award’s weighting depend on others? This is ad hoc and unintuitive."  
  - **Damage**: Medium (theoretically uncomfortable but not fatal).  
  - **Reply**: "Independence is normatively flawed—it ignores diversification. Pooling mimics portfolios: a standalone risky award harms less when diversified. Award-level application over-penalizes risk (e.g., variance grows linearly, not sublinearly). Our job is cohort outcomes, not atomized bets. This is standard in portfolio theory."  
  - **Soft spot**: Assumes awards are uncorrelated; doesn’t address correlation risk.  

  **Objection 6 (Program directors):** "The carve-out is arbitrary. Who decides ‘one-shot’? This invites lobbying and gaming—it’s the overlay in disguise!"  
  - **Damage**: Medium (perceived hypocrisy).  
  - **Reply**: "One-shot awards are objective: external deadlines (e.g., outbreak windows) are verifiable and rare (<10% of awards). For them, diversification *is impossible*, so award-level evaluation is fair. Non-one-shots benefit from pooling. This is rules-based, not discretionary."  
  - **Soft spot**: "Verifiable" relies on officer judgment; could be gamed.  

  **Objection 7 (Microeconometricians/Bayesian):** "Linear utility? Marginal value diminishes—we exhaust budgets, so dollars per QALY aren’t constant."  
  - **Damage**: Low (easily fixed).  
  - **Reply**: "At our scale (tiny vs. societal need), linearity is a standard approximation. But we can add curvature later—it’s orthogonal. RWEU separates risk from utility, so dim utility is easy to add. Let’s not let perfect block better."  

  **Objection 8 (Actuary):** "Calibrating k to committee choices is unscientific. Why not use market-implied risk aversion?"  
  - **Damage**: Low (narrow technicality).  
  - **Reply**: "Markets don’t price social risk. We calibrate to stakeholders—you—because you set agency priorities. Revealed preference beats hypothetical market analogies."  

  ---

  #### 3. What I should concede before anyone asks (200 words)  
  Preemptively concede:  
  1. **"Our outcome models are noisy, especially in tails."** This neutralizes the Bayesian’s strongest point. Clarify: "No method escapes this, but RWEU’s k>1 *dampens* tail noise vs. expected value. We’ll invest in better models—this proposal makes that urgency clearer."  
  2. **"r(q)=q^k isn’t sacred—we can test other functions."** Disarm the board member: "If the committee prefers HARA or exponential forms, we’ll explore them. The key insight is cohort-level pooling, not k’s parametrization."  
  3. **"The carve-out might need strict criteria."** Preempt program directors: "We’ll draft objective rules (e.g., ‘funding delay >12 months kills project’) for committee review."  
  Concede these *in your intro* as "design flexibilities." This frames you as pragmatic, not dogmatic, and isolates objections to core principles (cohort-level pooling, nonlinear weighting).  

  ---

  #### 4. The reply that has to land (250 words)  
  **The reply**: When efficiency bloc or program directors claim RWEU stifles boldness, pivot to institutional survival:  
  *"This isn’t about killing moonshots—it’s about avoiding suicide. Our current system ignores cohort risk: a 20% chance that *all* high-variance awards fail could terminate our funding. That’s not a ‘preference’—it’s a fact. RWEU with k>1 makes that near-zero outcome dominate the ranking, forcing diversification. Expected value overlooks this; the overlay is a guess. And yes, we still fund moonshots! But when we fund ten, not two, we ensure one failure doesn’t doom us. The carve-out handles true one-shots. This is ruin aversion, not risk aversion—and ruin is real.*  
  *Look at our history: cycles with ‘visible failures’ triggered 30% budget cuts. RWEU encodes that lesson mathematically. If we ignore it, we gamble the agency’s future."*  

  **Why it must land**: This reframes RWEU as proactive stewardship, not timidity. It links to tangible stakes (budget cuts) and uses committee lore ("remember 2021?").  

  **How it fails if delivered badly**: If you sound academic ("statewise dominance...") or defensive, program directors tune out. **Delivery tips**:  
  - Use a simple cohort-distribution sketch (worst-case to best; show r(q) shifting weight left).  
  - Stress "you told us to fix this" by referencing past cycle failures.  
  - End with: "Would you rather explain a bold failure or defend saving the agency?"  

  ---

  #### 5. The question I am hoping nobody asks (200 words)  
  **The question**: "Is ‘soft ruin’ (budget cuts after failed cycles) a *world state* we should model in outcomes, or just *our fear*—meaning r(q) is relabeling the overlay as math?"  

  **Why it’s worse than your guess**: It exposes a foundational ambiguity. If ruin is a world state, we should estimate its probability and impact (which we can’t). If it’s fear, critics call r(q) "subjective." The actuary/microeconometricians will pounce: "This proves it’s institutional design, not decision theory!"  

  **Reply if asked**: *"Both. The budget cut is a real second-order loss, but its probability is path-dependent and unmodelable (e.g., media reaction). So we encode it as risk aversion via k>1, calibrated to the committee’s revealed tolerance for failure. This isn’t a flaw—it’s pragmatism. All public agencies internalize political risk; we’re just making it transparent.*  
  *Alternatives? Model ‘ruin probability’—but with what data? We’d be guessing. Keep the overlay? That’s unquantified fear. RWEU is the least bad option."*  

  **Override**: A deadlier question—**"What if awards are correlated?"** (e.g., all depend on a single method). Pooling then under-penalizes risk. Have a fallback: "We’ll group correlated awards (e.g., AI grants) into ‘meta-awards’ for risk-weighting. But historically, correlations are weak—diversification holds."  

  ---  
  *Final tip: Anchor the session in a "crisis" narrative ("Remember the 2025 wipeout?"). Neutralize theorists with pragmatism ("We’re not proving theorems; we’re surviving").*
