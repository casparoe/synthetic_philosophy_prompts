prompt: |-
  I'm in an undergraduate seminar on just war theory, and last week we discussed the "supreme emergency" exemption: the idea that a community facing imminent and catastrophic defeat may do what the in bello rules otherwise forbid, with the area bombing of German cities in 1940–42, when Britain stood effectively alone, as the stock example. In the middle of that discussion, one student defended the bombing by saying, "well, all's fair in love and war," and our TA replied that the proverb hides several quite different claims and that at most one of them could do the work its user needed. Could you lay those readings out as a menu — for instance, that in bello rules are mere conventions that lapse under enough pressure; that military necessity simply overrides them; that the acts in question are not permitted but excused, the "dirty hands" reading; that "fair" means symmetric rather than unlimited, i.e. that combatants on both sides have the same permissions whatever the justice of their cause; or that in extremis the combatant/non-combatant distinction itself gives way — and for each say whether it is a platitude, defensible but contentious, or straightforwardly false, and whether it actually gets you to the conclusion it was being used for, namely that deliberately targeting civilians in that case was permissible rather than merely excusable or tragic? I'd like to know which reading is doing the real argumentative work and which ones are only gesturing at it.
reasoning: |-
  Okay, the user is in an undergraduate seminar on just war theory, specifically discussing the "supreme emergency" exemption. They recall a class discussion where a student used the proverb "all's fair in love and war" to defend the area bombing of German cities during 1940-42. The TA countered that this proverb hides several different claims, with only one possibly supporting the argument. The user wants me to break down these interpretations into a menu, evaluate each, and identify which one actually does the argumentative work for justifying the bombing as permissible rather than excusable.

  First, I need to unpack the different possible readings of "all's fair in love and war." The proverb is vague and can be interpreted in multiple ways. The main interpretations I can think of include: the idea that in bello rules are mere conventions that lapse under pressure; that military necessity overrides these rules; that actions are excusable under "dirty hands"; that fairness means symmetric permissions regardless of jus ad bellum; or that the combatant/non-combatant distinction collapses in extreme situations.

  For each interpretation, I should assess its plausibility—whether it's a platitude, defensible but contentious, or straightforwardly false. Then, determine if it supports the conclusion that targeting civilians was permissible (not just excusable) in the supreme emergency case. The user specifically wants to know which reading genuinely supports the argument versus which ones only gesture at it.

  Starting with the conventionalist reading: this claims rules of war are like social etiquette, not deep moral principles. But international law and just war theory treat these as moral imperatives. So this is straightforwardly false. It doesn't support permissibility since it undermines the very basis of in bello norms.

  Next, military necessity as an override. This is contentious; thinkers like Walzer accept it only in true supreme emergencies, but critics argue it leads to slippery slopes. It might justify permissibility only in the most extreme cases, like Britain's situation in 1940. So it's defensible but contentious and can support permissibility in this specific context.

  The dirty hands view sees actions as morally wrong but excusable due to circumstances. This is defensible and aligns with Walzer's original position. However, it argues for excuse, not permissibility, so it doesn't meet the user's requirement for justifying the bombing as permissible.

  Symmetry of permissions suggests that once war starts, both sides have the same in bello rights regardless of justice. This is a modern legal platitude (jus in bello independence), but it doesn't address the specific issue of targeting civilians. It might justify reciprocity ("they bomb us, so we can bomb them"), but not the permissibility of initiating such actions, especially against civilians.

  Collapse of distinction argues that in total war, everyone contributes, so non-combatants become targets. This is straightforwardly false in just war theory, as immunity is based on innocence and threat, not contribution. It doesn't hold up and could lead to total war justifications.

  Now, which interpretation actually does the work for the student's argument? The military necessity override seems key here because it directly addresses supreme emergency, allowing normally forbidden actions as permissible. The dirty hands view is also relevant but only for excuse, not permission. The others are either false or don't directly support the bombing's permissibility.

  The user might also have deeper needs: understanding how colloquial phrases oversimplify complex ethical debates and wanting clarity on which arguments hold weight in academic discourse. They might be preparing for papers or exams where distinguishing permissibility from excuse is crucial. Highlighting the contentious nature of military necessity versus the more accepted dirty hands approach could help them navigate seminar discussions more effectively.
answer: |-
  Here's a breakdown of the possible interpretations of "all's fair in love and war," evaluated for plausibility and their ability to justify the *permissibility* (not just excusability) of deliberately targeting civilians in a supreme emergency like Britain's 1940-42 bombing campaign. The **military necessity override** is likely doing the real argumentative work for the permissibility claim, while others are either false, irrelevant, or only support excusability.

  ### The Interpretations: A Menu

  1.  **The Conventionalist Reading:**
      *   **Claim:** The *in bello* rules (like non-combatant immunity) are mere social conventions, agreements, or customs, not deep moral obligations. Under sufficient pressure (like a supreme emergency), these conventions lapse, and nothing is inherently "unfair."
      *   **Plausibility:** **Straightforwardly False.** Just War Theory (JWT) and International Humanitarian Law (IHL) explicitly reject this. Non-combatant immunity is grounded in fundamental moral principles like the distinction between the guilty (combatants) and the innocent (non-combatants), and the inherent right to life. Treating these rules as mere conventions makes them dangerously fragile and ignores their moral foundation.
      *   **Gets to Permissibility?** **No.** It tries to dissolve the prohibition entirely, suggesting there was *never* a real moral barrier. This doesn't justify the act *under* pressure; it denies there was ever a meaningful rule *to* justify violating. It undermines the very concept of war crimes.

  2.  **The Military Necessity Override:**
      *   **Claim:** The *in bello* rules are genuine moral constraints, but they can be *overridden* in cases of extreme, catastrophic "military necessity" – where the very survival of the political community is at stake and no other means of survival are available. The supreme emergency *creates* a permission that wouldn't otherwise exist.
      *   **Plausibility:** **Defensible but Highly Contentious.** This is the core argument Walzer makes for the supreme emergency exemption. It acknowledges the deep wrongness of targeting civilians but argues an even greater catastrophe (e.g., Nazi victory) justifies overriding the rule *in this specific, extreme circumstance*. Critics argue it's a dangerous slippery slope, undermines the absolute core of JWT, or that no such override exists.
      *   **Gets to Permissibility?** **Yes, explicitly.** This is the interpretation designed *specifically* to argue that acts like area bombing become *morally permissible* (though still tragic and abhorrent) in a genuine supreme emergency. It's the argument the student likely *needed*, and Walzer uses it for the 1940-42 bombing. This is where the real argumentative work for *permissibility* is being done.

  3.  **The "Dirty Hands" (Excuse) Reading:**
      *   **Claim:** Deliberately targeting civilians remains morally *wrong* and *impermissible* even in a supreme emergency. However, leaders who authorize it to save their community may be *excused* or understood, bearing the burden of "dirty hands." The act isn't justified, but the actor isn't (fully) condemned.
      *   **Plausibility:** **Defensible but Contentious.** This view maintains the absolute moral prohibition against targeting non-combatants. It focuses on the tragic dilemma faced by leaders. Walzer himself ultimately argues supreme emergency provides an excuse, not a true permission. Critics argue it offers inadequate guidance or lets leaders off the hook too easily.
      *   **Gets to Permissibility?** **No, explicitly not.** This interpretation *denies* permissibility. It says the act was *wrong*, but understandable or excusable given the horrific circumstances. It gets you to sympathy or a lesser judgment for the *actor*, not to the conclusion that the *act* was morally okay. The student needed permissibility; this offers only excusability.

  4.  **The Symmetry ("Fair Play") Reading:**
      *   **Claim:** "Fair" means symmetric or reciprocal. Once war begins, combatants on *both sides* have the same set of permissions regarding tactics, regardless of the justice of their cause (*jus ad bellum*). If the enemy targets civilians, we can too. Fairness is about equal rules of engagement, not moral limits.
      *   **Plausibility:** **Platitude (for *jus in bello* symmetry), but Misleading.** It's a core JWT/IHL principle (*jus in bello* independence) that *basic rules* (like non-combatant immunity) apply equally to all sides. However, this principle **does not mean** the rules themselves are unlimited or that "anything goes." Symmetry applies *within* the established rules. The proverb misuses "fair" to imply *no* rules, while JWT symmetry means *the same* rules for all.
      *   **Gets to Permissibility?** **No.** It might justify *reciprocity* ("they did it first"), but it doesn't establish that targeting civilians is *inherently* permissible *for anyone*, even in extremity. It presupposes that the enemy's actions define what's allowed, which JWT firmly rejects. It doesn't address the core moral question of whether such acts are *ever* permissible on their own terms.

  5.  **The Collapse of Distinction Reading:**
      *   **Claim:** In a "total war" or supreme emergency, the distinction between combatants and non-combatants dissolves. Civilians contribute significantly to the war effort (industry, morale), making them legitimate targets. "Fair" means recognizing this reality and abandoning the distinction.
      *   **Plausibility:** **Straightforwardly False (within JWT).** JWT hinges on the *functional* distinction: combatants pose a direct threat, non-combatants do not. Contribution to the war economy or morale is explicitly rejected as a basis for targeting; immunity is based on the *absence of direct participation in hostilities*. Accepting this collapse eliminates the core restraint of JWT and justifies total war against populations.
      *   **Gets to Permissibility?** **No (on valid grounds).** While proponents of total war might use this logic, it is anathema to JWT. It doesn't justify overriding a rule *in extremis*; it denies the rule exists *at all* in modern war, which JWT explicitly contests. It argues for a fundamentally different (and rejected) conception of war.

  ### Which Reading Does the Work?

  *   **The Real Workhorse (for Permissibility):** The **Military Necessity Override (Reading #2)** is almost certainly the interpretation doing the heavy lifting for the claim that targeting civilians was *permissible* (not just excusable) in Britain's supreme emergency. It directly addresses the exceptional circumstance and argues it creates a temporary, tragic permission. This is Walzer's argument, and it's the one tailored to the "supreme emergency exemption" context.
  *   **The Gestures:**
      *   **Conventionalist (#1) & Collapse of Distinction (#5):** These gesture crudely at the idea that "rules don't apply," but they do so by denying the moral foundation of the rules entirely, which is incompatible with JWT and doesn't capture the nuanced "override under extreme duress" argument. They are non-starters for a JWT seminar.
      *   **"Dirty Hands" (#3):** This gestures at the *tragic gravity* of the situation and the potential for reduced blame, but it explicitly *denies* permissibility. It's the main alternative *to* the Military Necessity Override within the supreme emergency debate.
      *   **Symmetry (#4):** This gestures vaguely at the idea of reciprocity or "level playing field," but it misunderstands JWT symmetry and doesn't provide a basis for permitting inherently prohibited acts like targeting civilians. It confuses procedural fairness with moral limits.

  ### Conclusion

  Your TA was correct. "All's fair in love and war" is a rhetorical flourish masking significantly different, and often incompatible, claims. Within the context of justifying the *permissibility* of area bombing under supreme emergency, the proverb *can only plausibly* be interpreted as shorthand for the highly contentious **Military Necessity Override** argument. The other interpretations either fundamentally misunderstand JWT principles (#1, #4, #5) or argue for excusability rather than permissibility (#3). The proverb itself is too blunt an instrument for the nuanced and grave moral reasoning required by supreme emergency.
