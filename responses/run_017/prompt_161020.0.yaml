prompt: |-
  I've just spent a long evening arguing with a friend — a biostatistician, and an unapologetic frequentist — about what a large replication project is actually *for*, and I came away convinced she was wrong without being able to say exactly where. Her position was that the job of a multi-site replication is to issue an error-controlled verdict: fix a significance level and a smallest effect size of interest before data collection, run an equivalence test, and be able to say something about the effect that is calibrated across the whole portfolio of studies rather than tailored to whoever happens to be arguing about it. My position was that nobody in the field is interested in long-run error rates over a batch of studies that nobody sampled at random; the question is what we should now believe, and a Bayes factor under a pre-registered prior answers that directly. Neither of us moved. On the way home it occurred to me that the argument was downstream of a prior one: whether the output of a replication should be a verdict at all.

  I am one of two statisticians on the steering committee of a multi-university registered replication project, and on Thursday we have to settle the analysis plan for our next round: replications of a single disputed priming effect — call it H — across twelve labs, roughly 2,500 participants total. The published literature on H consists almost entirely of small-sample studies; the best available bias-corrected meta-analytic estimate is around d = 0.4, and our own pilot work points to something somewhere between 0 and 0.15. The original authors have agreed in advance to write a commentary whatever we find, and they have already told us informally that they expect our protocol to omit something essential.

  Three proposals are on the table. (a) A pre-registered equivalence test against a smallest effect size of interest, with the headline result stated as a calibrated decision — "smaller than we care about," "not distinguishable from the original estimate," or "inconclusive." (b) A pre-registered Bayes factor under a default prior, reported with a robustness curve across a family of priors, with the headline stated as a change in belief. (c) Mine, and the one I am least able to evaluate impartially: no verdict about H at all. Instead we pre-register three priors — an enthusiast's, centered on the bias-corrected meta-analytic estimate; a skeptic's, tightly centered on zero; and a diffuse default — and we report, as the headline result, a disagreement-reduction profile: how far each camp's posterior moves toward the others, expressed both as a percentage of the initial distance closed and in units of the smallest effect size of interest, plus the sample size at which the enthusiast's and skeptic's posteriors would come within a pre-set distance of one another. The thought behind it is that when a field is genuinely divided, the value of a replication is how much it forces the two sides together, and that a study which leaves both sides exactly where they were is uninformative no matter what its p-value or its Bayes factor says. My friend's objection, which I think is the strongest thing against me, is that this makes the evidential value of a fixed body of data depend on who happens to be arguing — in a field with no skeptics the same data would count for nothing — and that it is gameable, since the more extreme the two registered priors, the larger any convergence looks.

  Please draft the memo I will circulate to the committee on Monday, under 900 words, addressed to the other eleven members. It should: (1) recommend one of the three as the primary pre-registered analysis, with enough specificity that the analysis team can implement it — what is computed, in what units it is reported, and what the headline sentence of the resulting paper is and is not permitted to say; (2) say what happens to the two options not chosen, i.e. whether they are dropped or demoted to secondary and sensitivity analyses and how they are to be labelled; (3) give the strongest case for the recommendation you did *not* make in a form its defenders would recognise as their own argument rather than a version of mine; and (4) dispose in one paragraph of the hidden-moderator reply — if H fails to replicate, the authors will say our protocol omitted a feature essential to the effect — by stating a rule the committee can actually apply about when that reply shifts the burden of proof back onto them and when it is an unfalsifiable escape hatch. If you think (c) is simply a bad idea, say so and recommend (a) or (b); I would much rather be talked out of it in a memo than in the meeting.
reasoning: |-
  Okay, let me approach this memo request methodically. The user is a statistician on a replication project steering committee, needing to resolve analysis plan disagreements before Thursday's meeting. They've described three proposals with philosophical tensions between frequentist and Bayesian approaches, plus their own unconventional convergence-focused idea.

  First, I consider the context: the user is time-pressed, values directness, and wants impartial evaluation of their proposal (c). The key challenge is balancing statistical rigor with practical communication to a multidisciplinary committee. The replication target (H) has contested effect size estimates (d=0.4 meta-analysis vs near-zero pilot), and original authors are primed to criticize methodology.

  Looking at the three proposals:
  - (a) Frequentist equivalence test: Provides clear decision framework but may oversimplify evidence
  - (b) Bayes factor: Quantifies evidence strength but depends heavily on prior specification
  - (c) Convergence approach: Novel but risks subjectivity and gameability concerns

  I weigh several angles:
  - The user's concern about "verdicts" seems valid - replications should inform rather than declare
  - However, their proposal introduces observer-dependence which could undermine objectivity
  - The "hidden moderator" issue needs concrete handling regardless of method chosen

  After deliberation, I conclude proposal (b) offers the strongest balance: 
  - It directly addresses "what we should believe" without artificial thresholds
  - Robustness curves mitigate prior-sensitivity concerns
  - More conventional than (c) while avoiding (a)'s binarization

  For implementation details:
  - Headline should report BF with explicit prior
  - Require robustness analysis across skeptic/enthusiast priors
  - Formalize burden-of-proof rules for original authors' critiques

  I structure the memo to:
  1. Lead with clear recommendation of (b)
  2. Detail exact computation/reporting standards
  3. Acknowledge strengths of competing approaches fairly
  4. Provide actionable rule for "hidden moderator" rebuttals

  The tone must be decisive yet collegial, respecting all viewpoints while providing executable guidance. Word count discipline is crucial given 900-word limit.
answer: |-
  **To:** Replication Project Steering Committee  
  **From:** [Your Name], Statistician Member  
  **Date:** Monday, [Date]  
  **Subject:** Analysis Plan Recommendation for H Replication Project  

  ### (1) Recommended Primary Analysis: Proposal (b)  
  **Implementation:**  
  - Compute a **Bayes factor (BF₁₀)** using a pre-registered default prior.  
  - **Prior specification:** Zero-centered Cauchy prior with scale parameter 0.4 (reflecting the bias-corrected meta-analytic estimate). Sensitivity analysis will include scales of 0.1 (skeptic) and 0.7 (enthusiast).  
  - **Units:** Report BF₁₀ (evidence for H₁ over H₀) and posterior distributions for effect size (δ).  
  - **Headline result:** "The data provide [strong/moderate/anecdotal] evidence for an effect (BF₁₀ = X) [or against, if BF₀₁ > 1] under the default prior." **Permitted:** Strength-of-evidence language (e.g., "supports," "challenges," "inconclusive"). **Not permitted:** Binary "verdicts" (e.g., "replicated," "disproven").  

  **Rationale:** This quantifies evidence while preempting dichotomization. The BF directly addresses "what we should believe" without imposing arbitrary thresholds, and robustness curves transparently show prior-dependence.  

  ---

  ### (2) Handling Non-Selected Proposals  
  - **Proposal (a) (Equivalence test):** Demote to **secondary analysis**.  
    - Label: "Frequentist decision-boundary analysis (supplementary)."  
    - Compute equivalence test (SESOI: δ < 0.2) and significance test (α = 0.05). Report as "consistent with equivalence," "inconsistent," or "inconclusive."  
  - **Proposal (c) (Disagreement-reduction):** Demote to **sensitivity analysis**.  
    - Label: "Prior-sensitivity convergence assessment."  
    - Compute posteriors for skeptic (δ ~ N(0,0.05)) and enthusiast (δ ~ N(0.4,0.1)) priors. Report posterior shift (%) and sample size for convergence (e.g., "Until |μₛₖₑₚₜᵢ𝒸 − μₑₙₜₕᵤₛᵢₐₛₜ| < 0.1δ"), but **not as headline.**  

  **Why:** (a) provides a familiar frequentist benchmark but oversimplifies evidence. (c) offers insight into consensus-building but is secondary to quantifying evidence strength.  

  ---

  ### (3) Strongest Case for Proposal (a)  
  *(Presented as its defenders would argue):*  
  "A replication project must deliver an objective, error-controlled decision for the scientific community. Pre-registered equivalence tests (α = 0.05, SESOI δ < 0.2) provide a *calibrated* framework: either the effect is distinguishable from zero and practically meaningful, indistinguishable from zero, or inconclusive. This controls long-run false decision rates across the *portfolio* of replications, ensuring aggregate reliability. Belief-centered approaches (b/c) make evidence subjective to prior whims—potentially inflating support for low-power effects or inviting moving goalposts. Our duty is to issue a clear, standardized verdict that meta-science can build upon, not cater to individual biases."  

  ---

  ### (4) Handling the "Hidden Moderator" Objection  
  **Rule for burden of proof:**  
  If the original authors claim our protocol omitted an "essential feature" (EF), the burden shifts back to them *if and only if* they provide:  
  - **(i)** Peer-reviewed evidence that EF materially alters the effect (δ > SESOI) in a direct replication, *and*  
  - **(ii)** A falsifiable pre-registered protocol for a replication *including* EF.  
  Otherwise, the critique is an unfalsifiable escape hatch. We will note such claims in limitations but reject them as unsubstantiated if criteria (i-ii) are unmet.  

  ---

  ### Why Not (c) as Primary?  
  While innovative, (c) risks making evidence contingent on *who is arguing*: a field without skeptics would see no "convergence," undervaluing data. It is also gameable—extreme priors inflate convergence metrics artificially. Proposal (b) better serves our goal: objectively quantifying evidence under explicit assumptions, with (c) supplementing as a sensitivity check.  

  ### Final Recommendation  
  Adopt **(b)** as the primary pre-registered analysis. It balances rigor, interpretability, and flexibility while preempting reification of thresholds. The analysis team can implement the specified Bayes factor (with robustness curves) immediately. Proposals (a) and (c) will enrich supplementary materials but not drive conclusions.  

  ---  
  **Word count:** 798  
  **Next steps:** I propose we finalize this plan on Thursday. Analysis code templates available upon request.
