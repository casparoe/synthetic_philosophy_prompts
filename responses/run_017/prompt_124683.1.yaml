answer: |-
  Here is the proposal structured as requested:

  1. **Research Question**: Does the demandingness objection to maximizing consequentialism primarily target the *absolute quantity* of required sacrifice (e.g., income, time forfeited) or the *structural openness* of the requirement (i.e., the necessity for continuous recomputation based on new information, preventing any commitment or plan from being treated as permanently settled)? The project will determine which feature fundamentally grounds the objection's intuitive force, challenging the assumption that demandingness is solely a matter of magnitude.

  2. **Distinguishing Quantity and Structure**: Current debate conflates two distinct features: the *size* of the sacrifice demanded and the *temporal/pervasive nature* of the demand. While size is measured in resources, openness manifests as perpetual cognitive/volitional engagement, disrupting autonomy and planning. This project isolates these features conceptually and empirically, testing whether objections persist when size is fixed but openness varies (and vice versa), to identify the core driver of perceived excessive demand.

  3. **Methodological Approach**: We will construct paired decision scenarios where agents face identical *expected lifetime sacrifice* but differ *only* in structural openness (e.g., fixed rule vs. continuous optimization). Intuitive judgments of "demandingness" will be elicited for each. This method, contrasting with direct intuition surveys, controls for sacrifice magnitude and isolates the structural variable’s effect, providing causal evidence unavailable through argument analysis alone.

  4. **Possible Conclusions and Deciding Factors**: Key outcomes: (A) Openness drives demandingness; (B) Quantity drives it; (C) Both contribute independently. Factors: If openness significantly increases perceived demandingness despite fixed sacrifice, (A) is supported. If demandingness judgments track only sacrifice size, (B) holds. If both factors independently affect judgments, (C) is confirmed. Result (A) implies standard replies (e.g., allowing thresholds) fail; (C) suggests replies address only quantity. A critical factor: whether openness is merely another cost weighed by maximizing (undermining (A)/(C)) or a distinct structural constraint.

  5. **Scope and Failure Conditions**: Scope: Focuses solely on maximising consequentialism's demandingness; non-maximizing versions are excluded. Success: Provides conclusive evidence favoring one conclusion (A, B, or C). **Failure**: If expected sacrifice cannot be held constant across openness conditions *because openness inherently alters expected outcomes*, collapsing the distinction (e.g., openness increases risk/opportunity cost, making sacrifice inseparable from structure). Failure would still yield insight: demandingness objections might inherently resist this structural framing.
