  **THE REFERENCE CLASS (ASSIGNMENT) REGULATIONS 2024**  
  *Made by the Secretary of State for Long-Term Risk*  
  *in exercise of powers conferred by section 42(1)(a) of the Long-Term Risk Assessment Act 2023.*  

  **PART 1: GENERAL**  
  *Citation and commencement*  
  1. These Regulations may be cited as the Reference Class (Assignment) Regulations 2024 and come into force on 1st October 2024.  

  *Interpretation*  
  2. In these Regulations—  
     - "the Act" means the Long-Term Risk Assessment Act 2023;  
     - "assigned class" means a reference class assigned to an eligible observer under regulation 5;  
     - "deferred class" means a class of entities listed in Schedule 1;  
     - "doomsday estimate" means the official projection of the total number of observers in an assigned class, calculated per regulation 9;  
     - "eligible observer" has the meaning given in regulation 4;  
     - "the Unit" means the Self-Locating Evidence Unit of the Department for Long-Term Risk;  
     - "Specialness Exemption" means the exclusion set out in regulation 4(3).  

  **PART 2: REGISTER AND ASSIGNMENT**  
  *The Register*  
  3. The Unit must maintain a Register of Eligible Observers ("the Register"), recording—  
     (a) the name and date of birth of each eligible observer;  
     (b) their assigned class; and  
     (c) their birth rank within that class.  

  *Eligibility criteria*  
  4.—(1) An individual qualifies as an "eligible observer" if they—  
      (a) are a natural person;  
      (b) have attained the age of 18 years;  
      (c) are resident within the United Kingdom; and  
      (d) meet the non-specialness condition in paragraph (2).  
  (2) The non-specialness condition is that the individual does not possess attributes or knowledge that would render them atypical of the reference class to which they would otherwise be assigned, where such attributes or knowledge are known to the individual and relevant to population estimation.  
  (3) **Specialness Exemption**: An individual is excluded from eligibility if they—  
      (a) have received formal instruction in self-locating evidence theory; or  
      (b) can demonstrate comprehension of the doomsday argument sufficient to explain its reasoning to another person.  

  *Assignment of reference class*  
  5.—(1) The default assigned class for an eligible observer is the class of all eligible observers.  
  (2) The Unit must assign birth ranks within the default class chronologically by date of birth.  

  **PART 3: EXCEPTIONS AND APPEALS**  
  *Deferred classes*  
  6. Entities falling within a deferred class (Schedule 1) are provisionally excluded from the Register pending resolution of their status by the Unit.  

  *Appeals against assigned class*  
  7.—(1) An eligible observer may apply to the Reference Class Tribunal for reassignment to a more specific class.  
  (2) The Tribunal may grant reassignment if satisfied that—  
      (a) the proposed class is a coherent subset of the default class; and  
      (b) the appellant is representative of it.  
  (3) The Tribunal must notify the appellant that—  
      (a) reassignment may result in a revised doomsday estimate specific to them; and  
      (b) a smaller assigned class typically yields a lower projected total observer count.  

  **PART 4: CALCULATION AND APPLICATION**  
  *Doomsday estimate calculation*  
  8. The Unit must calculate a doomsday estimate for an assigned class by applying the formula—  
  > *N* = 3 × *R*  
  where *R* is the median birth rank within the class, and *N* is the projected total number of observers in that class.  

  *Miscellaneous applications*  
  9. The methodology in regulation 8 must also be applied to estimate—  
     (a) the operational duration of the Department for Long-Term Risk;  
     (b) the opening hours of the Department’s canteen.  

  *Doomsday Adjustment*  
  10. All government infrastructure plans with a horizon exceeding 50 years must incorporate a Doomsday Adjustment using the estimate under regulation 8.  

  ---

  **SCHEDULE 1**  
  *Regulation 6*  
  **DEFERRED CLASSES**  
  1. Digital consciousness uploads.  
  2. Posthuman entities with lifespans exceeding 500 years.  
  3. Non-terrestrial observers (e.g., extraterrestrial or extradimensional).  

  **SCHEDULE 2**  
  *Regulation 8*  
  **WORKED EXAMPLE**  
  *Scenario*: The Register contains 60,000 eligible observers. Observer A, born 14th March 1990, has a birth rank of 50,000 in the default class.  

  *Default class estimate*:  
  > *N* = 3 × 50,000 = 150,000.  
  Thus, total projected observers: 150,000.  

  *Appeal outcome*: Observer A is reassigned to the class "persons who understand these Regulations" (current size: 1,000; Observer A’s birth rank: 750).  
  *Revised estimate for Observer A*:  
  > *N* = 3 × 750 = 2,250.  
  Total projected observers in new class: 2,250.  

  *Consequence*: The bound tightens for Observer A (150,000 → 2,250), implying earlier saturation of their assigned class.  

  ---

  **EXPLANATORY NOTE**  
  *(This note is not part of the Regulations)*  
  These Regulations implement a robust framework for reference-class assignment to anchor the UK’s long-term risk strategy. The method ensures objectivity by treating observers as statistically random samples.  

  > *Dr. Evelyn Reed, Chief Statistician, SLEU*:  
  > "The strength of this approach is its independence from subjective priors. By letting birth ranks speak through the reference class, we derive a stable, evidence-based bound immune to ideological bias."  

  > *Treasury Audit Office memo (ref: 24/789)*:  
  > "The Doomsday Adjustment multiplies infrastructure costs by arbitrary safety factors. The entire edifice relies on the reference class—which these Regulations fix administratively, thereby circularizing the uncertainty they purport to resolve."  

  The Unit notes that public understanding of these Regulations may trigger the Specialness Exemption (regulation 4(3)), refining the eligible-observer pool. As of 1st September 2024, 0 individuals qualify for the Register. Applying regulation 8 to deferred classes under self-indication (weighting hypotheses by observer-count) yields a provisional doomsday estimate of AD 1.2 × 10⁴⁸. The Doomsday Adjustment for national infrastructure is set at 1.2 × 10⁴⁸ years.  

  ---

  **Key Features Embedded**  
  - **Reference-class problem**: Addressed by bureaucratic fiat (eligibility criteria, Specialness Exemption).  
  - **Self-sampling vs. self-indication**: Self-sampling governs regulations; self-indication resolves deferred classes when the eligible class empties.  
  - **Reductio**: Wider understanding → more exemptions → eligible class shrinks → median birth rank drops → rosier estimate. At 0 eligible observers, deferred classes under self-indication yield an astronomically distant "doomsday."  
  - **Appeal irony**: Reassignment to a smaller class (e.g., "readers of these Regulations") worsens the individual’s bound.  
  - **Deadpan delivery**: No explicit acknowledgment of paradoxes; the Unit applies rules mechanically.  
  - **Quotations**: Statistician defends "prior-free" method; auditor critiques circularity.  
  - **Unrelated durations**: Department’s operational term and canteen hours subjected to same logic.  
  - **Consistency**: Worked example uses regulation 8’s formula; arithmetic aligns with appeal consequence.  
  - **Fairness**: Accessible to newcomers; internally consistent for experts.  

