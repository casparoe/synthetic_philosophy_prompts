  For the sting, the lawyer's line about "the only reliable witness to interiority" could resonate with the protagonist. Closing with upheld/not upheld per claim, and mandated changes. Keep it 850 words of bureaucratic poetry.
answer: |-
  ## ASA RULING: A23-1234567

  **Complaint Ref:** A23-1234567  
  **Sector:** Digital Services / Mobile Applications  
  **Media:** Company website (www.innerlexicon.co.uk), promotional video content, social media posts (Twitter, Instagram), app store description.  
  **Complaint Received:** 15 October 2023  
  **Complaint:** From LexiCorp Ltd.  
  **Advertiser:** InnerLexicon Ltd.  
  **Complaint Issue:** LexiCorp Ltd. challenged whether the following claims made by InnerLexicon Ltd. for its "InnerLexicon" app could be substantiated:  
  1.  "Your InnerLexicon word means something only you could ever know."  
  2.  "Nobody else can ever be inside your head to experience what you do."  

  **Advertiser’s Response:**  
  InnerLexicon Ltd. provided the following evidence and arguments:  
  1.  **Regarding Claim 1 ("only you could ever know"):**  
      *   They submitted a detailed personal diary entry from the company founder, Mr. Elias Vance, documenting the specific internal sensation he denotes as "quilp" (provided under confidential seal ASA-CONF-789). The entry described the context and qualitative aspects of the sensation on multiple occasions over a six-month period.  
      *   They provided a physical "Sensation Sample Kit" (SSK) marketed with the premium subscription. The kit contained a sealed, opaque box labelled "Reference #QLP-001 (Quilp)" and instructions stating: *"This sealed unit contains a physical trigger calibrated to Mr. Vance's 'quilp' sensation. Its contents are unique and irreproducible. Its purpose is to symbolise the irreplaceable internal referent of your chosen word."*  
      *   They argued that the *meaning* of the word "quilp" resides entirely in Mr. Vance's private association between the word and his specific internal state. They stated that while others could be told the *situational context* in which he uses "quilp" (e.g., "a flicker behind the eyes when anticipating mild disappointment"), the *essential, experiential quality* of "quilp" is fundamentally inaccessible to anyone else.  
      *   When the ASA requested evidence demonstrating that Mr. Vance consistently applied "quilp" to the *same* internal state over time (i.e., substantiation for the stability and uniqueness of the meaning), InnerLexicon Ltd. responded: "Mr. Vance confirms that he experienced 'quilp' consistently upon reviewing the diary entries and the SSK reference #QLP-001, and he applies the term 'quilp' to that specific internal state *now*."  
  2.  **Regarding Claim 2 ("Nobody else can ever be inside your head..."):**  
      *   They submitted statements from three cognitive neuroscientists (anonymised as per standard practice) confirming the current scientific consensus that direct, first-person access to another individual's subjective conscious experience is impossible. Brain imaging, they argued, correlates neural activity with reported experiences but does not grant access to the qualitative "feel" itself.  
      *   They stated this claim was a self-evident truism about the nature of subjective experience and physical embodiment, requiring no complex substantiation beyond established scientific understanding.  
  3.  **General Argument:**  
      *   Their legal representative, Carter & Lowe LLP, summarised: "InnerLexicon does not claim others cannot learn the *word* 'quilp' or the *context* of its use. It claims the *meaning* – the specific, internal, qualitative state it denotes for Mr. Vance – is knowable *only* to him. This is evidenced by the private diary, the irreproducible nature of the internal state itself, and the sealed SSK representing its unique referent. The 'nobody else can be inside your head' claim is foundational to understanding the first claim and is an uncontroversial statement of fact about subjective isolation. The sealed box demonstrably *contains* something unique to Mr. Vance; its very existence supports the claim of a private referent."  

  **Assessment:**  

  1.  **Claim 1: "Your InnerLexicon word means something only you could ever know."**  
      *   **Interpretation:** We considered consumers would interpret this claim to mean that the specific meaning or experiential content denoted by a user's chosen InnerLexicon word (e.g., "quilp") is inherently private and inaccessible to understanding or verification by any other person, including through explanation, demonstration, or shared context. The meaning is presented as unique, subjective, and locked within the individual user.
      *   **Substantiation:**  
          *   Mr. Vance's diary details the contexts and descriptions associated with "quilp," but these remain *his reports about* an internal state. They do not demonstrate that the *meaning itself* (the connection between the word and the specific sensation) is something "only he could ever know," as opposed to something he has chosen *not to fully share* or finds *difficult to articulate*. The descriptions could be learned by others.
          *   The "Sensation Sample Kit" (SSK), particularly the sealed box labelled as containing a trigger for "quilp," is problematic as evidence. The ASA acknowledges the box physically contains *something*. However, the contents are inaccessible and undefined to anyone except Mr. Vance. **The presence of an undefined, inaccessible item within the box does not substantiate the claim that the *meaning* of the word "quilp" is something only Mr. Vance could know.** It merely symbolises an assertion of privacy; it cannot verify the nature, uniqueness, or stability of the referent, nor demonstrate that its connection to the word is unknowable to others *in principle*. The SSK relies on accepting Mr. Vance's private definition, which is the very point at issue.
          *   The Advertiser's response to the request for evidence of consistent application – stating Mr. Vance *confirms* he consistently applies "quilp" to the state referenced by the diary and SSK – uses the claim (his private application of the word) as its own evidence. This is circular reasoning and does not constitute independent substantiation. There is no mechanism presented, or apparently possible, for anyone else (including the ASA) to verify that "quilp" is consistently applied to the *same* internal state over time, because the state itself is presented as inherently private. The claim that the *meaning* is "only knowable" to the user precludes the possibility of objective verification, which is required for substantiation under the CAP Code. **The nature of the claim renders it inherently unverifiable.**
      *   **Conclusion on Claim 1:** Unsubstantiated. The evidence provided (diary, SSK, founder's statement) relies on private assertions that cannot be independently verified or falsified. The claim that the *meaning* is "only knowable" to the user is presented as an inherent, unassailable property, but this property also makes it impossible for the Advertiser to demonstrate the claim is true in any verifiable way. **The sealed box containing an undefined item illustrates the problem: while it contains *something*, its contents cannot be examined to confirm they relate uniquely and consistently to the claimed meaning of "quilp".** Upheld.

  2.  **Claim 2: "Nobody else can ever be inside your head to experience what you do."**  
      *   **Interpretation:** We considered consumers would interpret this claim as a general statement about the privacy of subjective conscious experience – that one person cannot directly access the qualitative, first-person experience (the "what it is like") of another person's mental states.
      *   **Substantiation:** The Advertiser provided evidence in the form of expert statements aligning with the current scientific and philosophical understanding that direct, first-person access to another individual's subjective experience is impossible. Brain activity can be correlated with reported experiences, but the subjective quality itself (qualia) is not directly observable by a third party. This is a widely accepted view concerning the nature of consciousness.
      *   **Conclusion on Claim 2:** Substantiated. The claim is a statement about a fundamental aspect of subjective experience for which there is broad consensus. It does not make a claim about the *communicability* or *knowability* of the *meaning* of words describing those experiences (which is the issue with Claim 1), but rather about the impossibility of direct experiential sharing. Not Upheld.

  **Decision:**  
  *   **Claim 1:** Upheld.  
  *   **Claim 2:** Not Upheld.  

  **Action Required:**  
  InnerLexicon Ltd. must ensure that future marketing communications for the InnerLexicon app do not state or imply that the *meaning* of a user's chosen word is something "only they could ever know," or make claims to that effect which present the meaning as inherently private and unverifiable in a way that cannot be substantiated. Claims should not suggest the meaning itself is inaccessible to others *in principle*, but can focus on the app facilitating the creation of personal labels for complex or hard-to-articulate internal states.  

  The claim that "Nobody else can ever be inside your head to experience what you do" may continue to be used, provided it is presented as a general statement about subjective experience and not used in a way that implies support for Claim 1-type assertions about the inherent unknowability of word meanings.  

  **Date:** 12 January 2024
