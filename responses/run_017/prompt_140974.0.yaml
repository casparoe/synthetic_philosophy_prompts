prompt: |-
  I work on the product governance team at a savings and investing app — around three million users, mostly people who've never invested before, and most of them on their phone at 11pm. Every proposed change to the app comes past me for a half hour review before it can ship: I write a one pager, and it has to be signed off by our head of product and by legal, neither of whom has any philosophy and both of whom will read two pages maximum. We look at four or five flows a month. The argument we keep having is whether a flow is *taking advantage* of people, and it goes in circles because everyone in the room is using a different test without noticing. I was arguing about this with a mate who did a philosophy degree and he said the thing I'm groping at is the money pump argument, so I've been reading a bit on my own and it feels exactly right but I can't get from the idea to something I can run on a Tuesday afternoon. The bit that seems to matter and that nobody here can articulate is the difference between a set of preferences that can be exploited in one go — you lay out a menu and whichever way they choose they lose — and a *sequence* of choices where each individual choice looks perfectly sensible to the person making it at the time and the damage only shows up when you add them up. Our head of product says if each step is fine then the whole thing is fine and I'm pretty sure that's the exact mistake but I can't say why in words he'd accept.

  We've drifted into four rough labels in my notes and I suspect they're doing philosophical work I haven't noticed: 'rake' (we take a fixed cut on a transaction, that's just a fee, nobody minds), 'switchback' (the flow gets someone to move back and forth between two states and pay each time), 'treadmill' (nothing cycles, but the framing keeps restarting the same decision so it gets made over and over), and 'pump' (saved for when someone ends up strictly worse off and nothing they value got produced along the way). I think 'treadmill' might actually be the interesting one rather than the boring one but I can't defend that. So: write me a decision procedure, in the order I should ask the questions, that comes out of what this literature actually says — the questions in order, what counts as a sufficient answer to each, which questions should end in a hard no, and which ones have to be handed to a human being because they're a values call dressed up as a factual one. It needs to survive being read by a lawyer and a data scientist who will both push back. There are some cases I specifically need it to handle. Our legal person's favourite test is 'would the user have agreed to the whole sequence up front?' and I don't trust it but I don't know what's wrong with it. Then there's the user who knows they'll end up slightly poorer and does the whole thing anyway because fiddling with the app is the fun part — if the process is the product, is there any money pump left? And the user whose preferences genuinely shift mid-sequence because they learned something, which feels like it should be completely fine and not exploitative at all. Also: is a hundred tiny losses the same objection as one large one, or does the smallness of each step actually matter to the argument? Our data scientist says we should just A/B test everything and look at whether users end up with less money, and I want to know why that isn't sufficient, if it isn't — partly because we can't run clean experiments on things that have already shipped. And one thing that genuinely bugs me: if these flows really were exploiting an incoherence in someone's preferences, wouldn't we expect some users to just bleed out completely? They don't. So is the whole idea secretly unfalsifiable, or does that tell us something about which version of the argument to use?

  Run it on three flows. First: a streak feature where if you'd miss a week you can pay two quid to freeze your streak, and the freeze button appears about four seconds after the missed week and nowhere else. Second: a switchback where users get a notification when markets fall nudging them into the safe pot and one when markets rise nudging them into the growth pot, fifty pence a swap, and the nudge copy is written to match whatever they said they wanted in onboarding. Third, and this is the one I actually need: boost tokens, where each month you get three free boosts that lift the rate on one of your pots for thirty days, you have to activate them by hand, they expire at month end, and the pot that's boosted rotates each month so people keep shuffling balances between pots — we shipped it eight months ago, it's our most used feature, engagement went up a lot, users say in the reviews that they enjoy it, and it's in our current marketing. If your procedure says we should pull it, say that plainly and tell me what I'd have to argue to the committee to keep it anyway, and be honest about whether your procedure can say anything useful about a feature that's already live and that we can't cleanly experiment on now.
reasoning: |-
  Okay, let's start by unpacking the user's problem. They work in product governance for a savings app with inexperienced users. Their main issue is assessing whether a feature exploits users, specifically distinguishing between one-time losses versus sequences of choices that cumulatively harm. The team uses vague labels like 'rake', 'switchback', 'treadmill', and 'pump', but needs a clear decision framework.

  The user mentioned the money pump argument, which deals with exploiting inconsistent preferences over time. The head of product thinks that if each step is fine, the whole sequence is fine. But the user suspects this is flawed. They need a step-by-step procedure that can handle specific cases: the legal team's "upfront agreement" test, users who enjoy the process, genuine preference shifts, and whether small losses matter. Also, they question why A/B testing isn't sufficient and why users don't "bleed out" if exploitation occurs.

  First, I need to formalize the money pump concept. The core is dynamic inconsistency in preferences. If preferences aren't stable, users might make choices that leave them worse off overall. The procedure must identify such sequences. The existing labels need mapping: 'switchback' and 'treadmill' likely involve cycles or repeated decisions, while 'pump' results in net harm without value.

  The legal team's upfront agreement test is problematic because users can't foresee how their preferences might shift in the moment. Even if they agree in theory, real-time decisions could exploit inconsistencies. The procedure must differentiate between predictable and unpredictable preference changes.

  For users who enjoy the process, the key is whether the harm is compensated by enjoyment. If the net utility is positive, it might be acceptable. But if the enjoyment is manufactured by the design (like variable rewards), that's exploitative. Genuine learning mid-sequence is fine as long as the design doesn't manipulate that learning.

  Small losses add up, but each being small might mask the cumulative effect. A/B testing only shows net outcomes, not the mechanism. If the feature causes harm through small steps, A/B might miss it due to noise or other factors. Also, for existing features, clean experiments are hard.

  Why don't users bleed out? Probably because real-world constraints (like running out of money) stop the cycle, or the pump is designed to be sustainable (small amounts). The harm is relative, not absolute. The procedure should focus on the potential for exploitation, not just extreme outcomes.

  Now, the decision procedure. It needs structured questions: first, check for static coherence (one-time choices). Then, dynamic consistency (preferences over time). Identify if the design induces cycles or unnecessary actions. Assess net harm versus value. Determine if the process is valued for itself.

  Applying to the three examples:

  1. Streak freeze: Forces immediate payment to avoid loss, exploiting present bias. Each step seems rational, but cumulative cost for no value. Upfront, users wouldn't agree to pay for freezes. Net harm likely. A/B test comparisons are tricky due to short-term engagement boosts masking costs.

  2. Switchback notifications: Nudges based on market movements, charging per switch. Exploits loss aversion and trend-chasing. Preferences aren't stable; each nudge triggers a switch. Users wouldn't agree upfront to constant switching. Net harm from fees without improving outcomes.

  3. Boost tokens: Engages users by rotating boosts, requiring manual activation. Users enjoy it, engagement up. But the shuffling costs time, and the design might create artificial scarcity. However, if users derive enjoyment from participation, it might offset costs. The key is whether the boosts provide real value or just manufactured engagement. Since users report enjoyment, it might be acceptable, but monitor for net financial harm.

  For the boost tokens, even if the procedure flags potential issues due to induced shuffling, the user enjoyment could justify it. But the committee needs to ensure that the feature isn't exploiting preference inconsistencies for profit without equivalent user value.
answer: |-
  Here's a decision procedure derived from the money pump literature and behavioral economics, structured as a sequential checklist. It addresses your core concern: **distinguishing between harmless transactions and sequences that exploit dynamic inconsistency in preferences**. The procedure prioritizes *actionability* (under 30 min/flow) and *auditability* (for legal/data science pushback). Each question builds on the last, with clear pass/fail criteria.

  ---

  ### **Decision Procedure: Exploitation Potential Assessment**
  **(Run in this order – stop if any "Hard No" is triggered)**

  1. **STATIC COHERENCE CHECK**  
     *Question: Would *any single choice* in this flow violate standard consent/fairness norms if presented in isolation?*  
     - **Sufficient Pass**: Each step is transparent (costs/benefits clear), non-coercive, and offers non-zero user value.  
     - **Hard No**: Deception, hidden costs, or a step with negative expected value.  
     - **Human Judgment Needed**: None – this is binary.  
     *Why it matters*: Rules out one-shot exploitation ("menu" problems). Your "rake" label passes here.

  2. **PREFERENCE STABILITY TEST**  
     *Question: Does the flow *induce* or *exploit* predictable preference reversals?*  
     - **Sufficient Pass**: Preferences are stable (e.g., user learns new info mid-flow) OR the flow doesn't leverage reversals.  
     - **Hard No**: Flow *manufactures* reversals (e.g., framing identical states differently) or profits from known biases (present bias, loss aversion) to trigger unnecessary actions.  
     - **Human Judgment Needed**: Is the reversal "genuine learning" (e.g., user reads educational content) vs. "manufactured" (e.g., fear-of-missing-out framing)?  
     *Why it matters*: Catches "switchbacks" and "treadmills." Addresses your Head of Product's error: stable step ≠ harmless sequence if preferences are manipulated.

  3. **CYCLE & WASTE AUDIT**  
     *Question: Does the flow incentivize repeated actions that cancel out or incur costs without net benefit?*  
     - **Sufficient Pass**: Actions directly create user value (e.g., saving more) or are optional with clear utility.  
     - **Hard No**: Users pay/effort for:  
       - **Cycling** (returning to a prior state; "switchbacks")  
       - **Treadmilling** (repeated identical decisions with net loss)  
       - **Pure transfers** (money/effort → you, with no user-valued output).  
     - **Human Judgment Needed**: Does "process enjoyment" (e.g., gamification) offset costs? (See Q4).  
     *Why it matters*: Flags "pumps" and "treadmills." Explains why legal's "upfront agreement" test fails: users can't foresee cycles.

  4. **NET VALUE ASSESSMENT**  
     *Question: Could a rational user with stable preferences end up worse off?*  
     - **Sufficient Pass**: Net financial/effort cost ≤ net utility (including enjoyment).  
     - **Hard No**: Predictable net financial loss OR effort cost with no offsetting utility.  
     - **Human Judgment Needed**:  
       - Is "enjoyment" intrinsic (user values activity) or extrinsic (exploits compulsion)?  
       - Are losses small but frequent? (Small steps *enable* exploitation; "death by a thousand cuts" is still death.)  
     *Why it matters*: Catches "pumps." A/B testing fails here because:  
     - It can't isolate *why* users lose money (e.g., does engagement cause loss, or vice versa?).  
     - Survivorship bias: Users who "bleed out" churn, masking harm.  

  ---

  ### **Applying the Procedure to Your Cases**
  **Flow 1: Streak Freeze**  
  - Q1 (Static): Passes. Single £2 fee is transparent.  
  - Q2 (Stability): **HARD NO**. Exploits *present bias*: Users overvalue "now" (saving streak) vs. future costs. Freeze button timing (post-miss) manufactures urgency.  
  - *Stop here*. **Verdict: Do not ship**. Fix: Allow freezes *before* the deadline.

  **Flow 2: Safe/Growth Pot Switchback**  
  - Q1 (Static): Passes. Each 50p swap is clear.  
  - Q2 (Stability): **HARD NO**. Notifications exploit *loss aversion* and *recency bias* to induce preference reversals ("markets fell → I'm risk-averse now!"). Onboarding alignment is irrelevant; biases override stated goals.  
  - *Stop here*. **Verdict: Do not ship**. Fix: Remove transaction fee or add cooling-off periods.

  **Flow 3: Boost Tokens**  
  - Q1 (Static): Passes. Free boosts, clear expiration.  
  - Q2 (Stability): Passes. Rotating pots *could* exploit novelty-seeking, but no evidence of manufactured reversals.  
  - Q3 (Cycle): **Flag for human judgment**. Shuffling pots is a "treadmill" (repeated action), but costs are effort/time, not cash.  
  - Q4 (Net Value): **Human judgment needed**.  
    - *Risks*: Net financial harm? If shuffling triggers fees/taxes, yes. Effort cost high? (Likely minimal).  
    - *Benefits*: Engagement ≠ value. But users report enjoyment – if genuine, this offsets effort.  
    - *Key test*: Is the fun from *using boosts* (good) or *avoiding FOMO* on expiration (bad)?  
  - **Verdict: Conditional pass**.  
    - **Must mitigate**: Track if users lose money on shuffling. Add "auto-apply" option to reduce effort.  
    - **Committee argument to keep it**: "Net utility is positive: enjoyment outweighs minor effort costs. Feature satisfies Q1-Q2; Q3-Q4 risks are monitored and offset by value."  
    - **Post-shipment note**: Since clean A/B tests are impossible, use:  
      - Cohort analysis (e.g., heavy users' net returns vs. light users).  
      - Surveys: "Would you pay £0.50 to keep this feature?" If yes, enjoyment is real.  

  ---

  ### **Why Your Open Questions Are Addressed**
  - **Legal's "upfront agreement" test**: Fails because users can't consent to *exploited future selves*. Money pumps require *myopic* choices.  
  - **User who enjoys the process**: Covered in Q4. If enjoyment is intrinsic (e.g., hobbyist), it offsets costs. If extrinsic (e.g., variable rewards triggering dopamine), it's exploitative.  
  - **Genuine preference shifts**: Q2 explicitly allows for learning. Only *manufactured* reversals fail.  
  - **Small losses**: Q4 treats them as cumulative. Small steps enable exploitation by masking harm.  
  - **Why users don't "bleed out"**: Pumps are designed to be *sustainable* (e.g., £2 fees). Harm is relative (e.g., lower returns), not bankruptcy. This doesn't invalidate the model.  
  - **A/B testing insufficiency**: Reveals correlation, not causation (e.g., did the *flow* cause loss, or did risk-seekers use it more?). Also misses effort costs and enjoyment.  

  This procedure forces explicit discussion of *mechanisms* (not just outcomes), aligns with behavioral science, and meets your constraints. For live features like Boost Tokens, it shifts focus to *mitigation* rather than blockage.
