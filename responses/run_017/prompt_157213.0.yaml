answer: |-
  ## Research Proposal: Stability and Coherence in Lexical-Threshold Suffering Ethics  

  ### 1. The Core Question and Its Significance  
  **Precise Question:** Is there a coherent formulation of *lexical-threshold negative utilitarianism*—the view that any suffering above a specific intensity threshold *infinitely outweighs* all pleasures and sub-threshold sufferings (such that no amount of the latter can compensate for the former)—that avoids collapsing into either an arbitrary discontinuity on a unified scale of well-being or an ineffectual appeal to incomparability?  

  **Why Non-Philosophers Should Care:** This view underpins urgent ethical claims—e.g., that preventing torture or severe depression must *always* take absolute priority over accumulating minor pleasures (like entertainment or convenience), regardless of scale. Policymakers, aid organizations, and advocates increasingly invoke such thresholds to justify radical interventions (e.g., prioritizing existential risk mitigation or animal suffering abolition). If incoherent, these efforts risk misallocating vast resources; if viable, they could reshape global priorities.  

  ---

  ### 2. Why Existing Positions Leave the Question Open  
  The lexical-threshold view emerges from a dilemma in moral reasoning. On one side, classical utilitarianism treats all well-being experiences as *commensurable* (measurable on a single scale), allowing trade-offs between mild pains and intense pleasures. Yet this seems to permit horrifying conclusions (e.g., that immense torture could be justified by sufficient minor pleasures). On the other side, skeptics deny any meaningful comparison between extreme suffering and lesser goods, treating them as *incommensurable*. But this paralyzes action: if suffering and pleasure cannot be compared *at all*, we lose grounds to prioritize alleviating agony over creating trivial joys.  

  The lexical threshold tries to split the difference: it accepts *some* comparability (suffering intensities are rankable) but imposes a strict break where higher sufferings dominate all lower goods. Yet this creates instability. If pains/pleasures share a scale, the threshold becomes arbitrary—why draw the line *here* rather than slightly higher or lower? If they lack a common scale, the threshold cannot explain why pains *just above* the line dominate those *just below*, despite their experiential similarity. Neither approach resolves this tension, leaving the view oscillating between arbitrariness and impracticality.  

  ---

  ### 3. Methodology: Six-Month Work Plan  
  **Months 1–2: Formal Foundations**  
  - *Construct* a minimal model of threshold-based value ordering, defining axioms for transitivity, continuity, and aggregation.  
  - *Test* against the "crowding problem": Can 1,000 headaches (each just below the threshold) outweigh one migraine (just above)? If yes, lexical priority collapses into weighted aggregation; if no, we violate transitivity.  
  - *Deliverable*: Proof that no ordering satisfies both (a) strict lexical dominance *and* (b) unrestricted aggregation without paradox.  

  **Months 3–4: Case-Driven Refinement**  
  - *Develop thought experiments*: E.g., "Threshold Slippage" (does a 99-unit pain dominate 1,000,000 98-unit pains?) and "Duration vs. Intensity" (does 10 years of moderate pain outweigh 1 second of agony above the threshold?).  
  - *Identify failure modes*: Does "incommensurability" route avoid arbitrariness only by making thresholds irrelevant to choice?  
  - *Deliverable*: Taxonomy of cases where threshold intuitions conflict with formal or experiential constraints.  

  **Month 5: Confronting Scale Pluralism**  
  - *Map competing scales*: Test thresholds defined by (a) peak intensity, (b) duration-adjusted intensity, (c) total "affective disvalue."  
  - *Challenge*: If thresholds behave differently across scales, which reflects moral reality? E.g., is brief torture worse than lifelong discomfort?  
  - *Deliverable*: Framework for evaluating scale-dependence in threshold proposals.  

  **Month 6: Philosophical Synthesis**  
  - *Resolve equivalence worry*: Does lexical-threshold reasoning yield different real-world prescriptions than a view assigning extreme (but finite) weight to suffering?  
  - *Argue*: If outcomes are identical, the dispute is metaphysical—not ethical—undermining the view’s purported radicalism.  
  - *Deliverable*: A coherence checklist for lexical-threshold theories.  

  ---

  ### 4. Possible Conclusions and Failure Conditions  
  - **Strong Success**: Lexical thresholds require abandoning transitivity or accepting scale pluralism, revealing a new category of "semi-commensurable" values. *Deciding factor*: Whether aggregation paradoxes admit solutions without ad hoc adjustments.  
  - **Modest Success**: The view is salvageable only as a heuristic for extreme suffering, not a fundamental theory. *Deciding factor*: If threshold location can be non-arbitrarily anchored (e.g., to neurobiological pain thresholds).  
  - **Collapse**: Lexical thresholds are covertly equivalent to asymmetric weighted utilitarianism. *Failure condition*: All practical recommendations align under plausible empirical assumptions.  
  - **Abortion**: The problem reduces to intractable questions about the metaphysics of pain intensity. *Failure condition*: No stable threshold concept emerges across phenomenological, duration-based, or aggregate measures.  

  ---

  ### 5. Scope Management and Deliverables  
  **If Formal Work Expands:**  
  - Prioritize aggregation paradoxes and equivalence testing (Months 1–2, 6) over scale pluralism (Month 5). The former are central to coherence claims; the latter deepens but does not resolve core instability.  
  **Minimum Publishable Unit:** A journal article demonstrating that lexical thresholds *either* (a) require non-transitive orderings (undermining "priority" intuitions) *or* (b) reduce to weighted utilitarianism. This alone would clarify debates in effective altruism, animal ethics, and human rights.  
  **Fallback Deliverable:** A focused analysis of the crowding problem as a decisive objection, leaving broader metaphysics for later work.  

  ---  
  **Feasibility:** Six months is ideal—sufficient to rigorously model the threshold, test edge cases, and diagnose fundamental tensions, but disciplined enough to avoid open-ended metaphysics. This project isolates a actionable problem with high stakes for theory and practice.
