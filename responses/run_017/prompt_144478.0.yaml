answer: |-
  ### Specification for Internal Auditing Checklist: Treatment Effect Reconciliation  

  **Core Purpose**: Provide a decision rule for data stewards to resolve conflicting treatment effect estimates (aggregate vs. stratified) in hospital records. The rule must output one actionable sentence specifying which number to use, based on a table of results and a rough causal story.  

  ---

  ### **Requirements List**  
  *Non-negotiable (NN)* = Essential for validity. *Preference (P)* = Practical or philosophical bias. *Prejudice (Pref)* = User-camp bias.  
  *Key conflicts and rationale provided for each requirement.*  

  1. **NN: Prioritize causal estimand over statistical trends**  
     - *Case*: Standard Simpson’s paradox (A beats B in mild/severe strata, loses overall).  
     - *Rationale*: The aggregate effect is confounded by severity; acting on it would yield the wrong decision.  
     - *Conflicts*: Incompatible with "always use the overall estimate" heuristics.  

  2. **NN: Exclude post-treatment variables from adjustment**  
     - *Case*: Stratifier caused by treatment (e.g., a complication or follow-up measurement).  
     - *Rationale*: Adjusting for variables affected by treatment introduces bias (e.g., mediates/collides paths).  
     - *Conflicts*: Violated by "adjust for all pre-treatment variables" if causal role is mislabeled.  

  3. **P: Account for measurement error in confounders**  
     - *Case*: Noisy stand-in for true confounder (e.g., error-prone severity score).  
     - *Rationale*: Naive adjustment under error leaves residual confounding; rule must flag uncertainty.  
     - *Pref*: Reflects user’s emphasis on real-world data imperfections.  

  4. **NN: Specify effect measure (RD over OR where possible)**  
     - *Case*: Reversal in odds ratio (OR) but not risk difference (RD), no confounding.  
     - *Rationale*: OR is non-collapsible; reversals may be mathematical artifacts. RD aligns with decision utility.  
     - *Conflicts*: OR-based rules (e.g., logistic regression) fail here.  

  5. **P: Avoid arbitrary binning of continuous confounders**  
     - *Case*: Continuous severity score where reversal depends on cut-points.  
     - *Rationale*: Binning induces artificial reversals; rule should use raw data or model continuously.  
     - *Pref*: User’s bias toward precision; conflicts with "use only pre-binned tables" (see *Joint Feasibility*).  

  6. **NN: Reject unstable strata**  
     - *Case*: Reversal driven by a band with 4 patients.  
     - *Rationale*: Small samples amplify noise; decisions must rely on statistically reliable estimates.  
     - *Conflicts*: "Always trust the stratified estimate" fails.  

  7. **NN: Align with decision-maker’s information at action time**  
     - *Case*: Aggregate and stratified estimates answer different questions (e.g., severity known at treatment?).  
     - *Rationale*: The right effect conditions *only* on variables known when treatment is chosen.  
     - *Knockout*: Invalidates most heuristics (e.g., "always adjust for confounders" if confounder isn’t known pre-treatment).  

  8. **NN: Adjust for target population differences**  
     - *Case*: Mild/severe mix differs between dataset and local hospitals.  
     - *Rationale*: Effects must be transportable; failure causes ecological bias.  
     - *Conflicts*: Ignores "use the estimate as reported" rules.  

  ---

  ### **Paper vs. Live Reversals: Validity of the Cut**  
  - **Your cut is flawed**. It conflates *resolution method* with *persistence*:  
    - **Paper reversals** dissolve under causal clarity (e.g., changing effect measure [R4] or binning [R5]).  
    - **Live reversals** persist after causal framing (e.g., true confounding [R1] or transportability [R8]).  
  - **Better cut**: **Reversals requiring action vs. those resolved by analysis**.  
    - *Resolved by analysis*: Measurement error [R3], OR artifacts [R4], binning [R5], small strata [R6].  
    - *Require action*: Confounding [R1], post-treatment variables [R2], decision context [R7], population mix [R8].  
  - *Why?* Decision rules must distinguish "fixable" reversals (no action needed) from "structural" ones (change the number).  

  ---

  ### **Joint Feasibility & Conflicts**  
  1. **"Use only the table" vs. "Exclude post-treatment variables"** → **Conflict (NN)**.  
     - *Why?* Tables lack causal context; distinguishing confounders from mediators requires external knowledge.  
     - *Resolution*: Rule must incorporate the causal story (minimally: "is this variable pre-treatment?").  

  2. **"Binning-invariance" vs. "Use full continuous score"** → **Compatible if defined carefully (P)**.  
     - *Why?* Rule can demand continuous data *or* robustness checks across binning schemes.  
     - *Conflict if*: Data steward only has binned tables → then R5 is a preference (not enforceable).  

  3. **"Knockout requirement"**: **R7 (decision context)**.  
     - *Eliminates*: "Always use stratified" (fails if stratifier unknown at action time), "Always use aggregate" (fails with confounding).  

  ---

  ### **Candidate Rule Scoring**  
  *Scored against NN requirements (R1–R8).  
  ✔ = Pass, ✘ = Fail, ~ = Partial/contextual pass.*  

  | Requirement | Report Both | Adjust Pre-Treatment | Block Confounding Paths | Decision Problem |  
  |-------------|-------------|----------------------|--------------------------|------------------|  
  | R1 (Prioritize causal estimand) | ✘ | ~¹ | ✔ | ✔ |  
  | R2 (Exclude post-treatment) | ✘ | ✘² | ✔ | ✔ |  
  | R3 (Measurement error) | ✘ | ✘ | ✘ | ~³ |  
  | R4 (Specify effect measure) | ✘ | ✘ | ✘ | ✔ |  
  | R5 (Avoid binning) | ✘ | ✘ | ✘ | ~⁴ |  
  | R6 (Reject small strata) | ✘ | ✘ | ✘ | ~⁵ |  
  | R7 (Align with decision info) | ✘ | ✘ | ✘ | ✔ |  
  | R8 (Adjust population mix) | ✘ | ✘ | ✘ | ~⁶ |  

  #### **Notes**  
  1. *Adjust Pre-Treatment*: Only passes R1 if severity is pre-treatment; fails if post-treatment (R2).  
  2. *Adjust Pre-Treatment*: Adjusts for pre-treatment mediators, causing bias → fails R2.  
  3. *Decision Problem*: Passes if error is acknowledged; fails if treated as precise.  
  4. *Decision Problem*: Passes if continuous data used; fails if forced into bins.  
  5. *Decision Problem*: Passes if unstable strata are downweighted; fails if taken at face value.  
  6. *Decision Problem*: Passes if population is reweighted; fails if ignored.  

  **Top Rule**: **Decision Problem** (✔ 4, ~ 4). Only rule satisfying R1, R2, R4, R7.  
  **Worst Rule**: **Report Both** (✘ all). Evades the core decision responsibility.  

  ---

  ### **Recommended Rule**  
  **"Condition the effect estimate on variables known at the time of treatment, using risk difference. If severity is pre-treatment and measured reliably, use the severity-stratified estimate standardized to the local population. If severity is post-treatment or unmeasured, use the unadjusted aggregate effect."**  

  - *Why?* Embeds R7 (decision context), R4 (RD), R8 (transportability), R2 (excludes post-treatment), and R1 (causal estimand).  
  - *Practicality*: Requires data steward to know:  
    1. What variables are available at treatment time.  
    2. Severity measurement quality (R3/R6 caveats).  
    3. Local population distribution.
