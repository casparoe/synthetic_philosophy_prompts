  4. **Requirement R4 (NN)**: The rule must recognize that reversals can occur in one measure (e.g., odds ratio) but not in another (e.g., risk difference) and must be consistent in the chosen effect measure (Case 4). The rule must not rely on a single effect measure without justification.
