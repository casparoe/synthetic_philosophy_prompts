  3. **Requirement R3 (NN)**: The rule must account for measurement error in the stratifier (Case 3). Specifically, if the stratifier is a noisy proxy, the rule should not treat it as if it were the true confounder (which might lead to residual confounding).
     - *Case*: Noisy stratifier.
