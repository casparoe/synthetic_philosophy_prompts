  We are building a specification for a rule to resolve Simpson's paradox-like situations in treatment effect analysis within a hospital group. The goal is to provide a data steward with a clear method to decide which number (aggregate or stratified) to act on, given a table of results and a rough causal story.

  The key cases we must cover are:

  1. **Standard Simpson's paradox**: Treatment A beats B among mild and severe patients individually but loses overall.
  2. **Stratifier caused by treatment**: The stratifier (e.g., a complication or follow-up measurement) is a consequence of the treatment, not a pre-treatment confounder.
  3. **Noisy stratifier**: The stratifier is a proxy for the real confounder and measured with error.
  4. **Reversal in odds ratio only**: The reversal occurs in odds ratios but not in risk differences, without confounding.
  5. **Continuous severity score**: The reversal appears or disappears depending on how we bin the continuous score.
  6. **Small sample band**: A reversal driven by a band with very few patients (e.g., 4 patients).
  7. **Different questions**: Aggregate and stratified estimates are both correct but answer different causal questions (due to decision-maker's information at the time of action).
  8. **Different population mix**: The distribution of the stratifier (e.g., mild/severe mix) in the current hospitals differs from the dataset used.

  We also need to address the distinction between 'paper reversals' (which disappear when the causal question is clarified) and 'live reversals' (which persist even after clarifying the question). The user suspects this might not be the right cut.

  Additionally, we must:
  - Mark each requirement as non-negotiable or a preference of one camp, and note which are just the user's side's prejudices.
  - Flag any requirements that cannot be jointly satisfied.
  - Identify which requirement knocks out the most popular heuristics.

  Finally, we will score four candidate rules against the requirements.

  ---

  **Requirements Specification**

  We derive requirements from the cases and considerations above. Each requirement is stated, followed by the case or consideration that motivates it, and marked as non-negotiable (NN) or a preference (P). We also note if it is a prejudice (Pref) of the user's side.

  1. **Requirement R1 (NN)**: The rule must correctly handle the standard Simpson's paradox case (Case 1) by recognizing that the stratified estimate (within severity bands) is the one to act on, because the overall estimate is confounded by severity.
     - *Case*: Standard Simpson's paradox.
     - *Note*: Non-negotiable because this is the core problem.

  2. **Requirement R2 (NN)**: The rule must not adjust for a stratifier that is caused by the treatment (Case 2). Adjusting for such a variable can introduce bias (e.g., if the stratifier is a mediator or a collider).
