  The user's deeper need seems to be about risk management. They’re likely a policymaker or funder who needs to allocate resources effectively. They might be skeptical of academic projects that don't deliver practical value. Their questions about "acting" on warnings and institutional collapse scenarios suggest they’re thinking about real-world implications. They need clarity on what’s feasible versus overhyped.

  Next, structuring the response. The user asked for ranked research lines with explicit criteria: upstream nature, tractability, neglectedness. They also want to know which payoffs are overrated and what evidence could shift priorities. I should avoid prestige projects that don’t address forecasting. 

