prompt: |-
  I'm a third-year PhD student in political theory and I'm finally drafting the chapter on the boundary problem for my thesis, the one where I have to say who exactly has to be included for a decision to count as democratically legitimate. Before it goes to my supervisor, and before I inflict it on an undergraduate reading group I'm leading next week, I'd like an audit of my own package rather than a survey of the literature, because every time I write it down I get the feeling that two of the planks are quietly doing incompatible work. Here is where I think I stand. (a) The ground of inclusion is affectedness, spelled out counterfactually: someone has a claim to a say over a decision just in case that decision, together with the enforcement apparatus behind it, foreseeably leaves their prospects for a decent life worse in expectation than they would have been under any feasible alternative the body could have adopted. I like that formulation because it keeps out people who are set back only in their preferences or only through background conditions nobody controls. (b) No bootstrapping: the constituency has to be fixed by the principle, prior to and independently of the body's own procedures, because a group that gets to decide who counts as one of its own can entrench itself against the very people it owes an answer to. (c) Case verdict: long-term residents with no route to citizenship, guest workers on renewable multi-year permits, say, must be included in the demos of the polity where they live and work; short-term visitors need not be, even when some particular decision, a sudden visa change or a new departure tax, sets them back substantially. (d) Children now, and people in the distant future, have claims to inclusion, exercised by proxies or trustees duty-bound to represent interests that are partly indeterminate. (e) On why democracy matters at all I am a coercion person rather than a self-development person: the point is to make coercive power answerable to those who have to live under it, not to give everyone the experience of participating. (f) The unit I care about is a single standing demos with an open-ended agenda, a state or something state-like; I don't want issue-by-issue constituency shuffling, since a body whose membership changed with every agenda item could not deliberate, build a record, or be held accountable over time. (g) Institutional verdict: a jointly governed transboundary regulator, a basin commission whose allocation decisions are enforced by two national legal systems and settle the livelihoods of a downstream district, can be legitimate without a directly elected assembly of its own, provided each member state's internal demos is in order.

  What I want from you is the audit, not a lecture on the literature. Go through these and tell me which pairs are genuinely in tension and which only look like it: my supervisor thinks (a) and (f) cannot both be true, and a friend in the reading group thinks (c) is straightforwardly inconsistent with (a), and I suspect both of them have picked the wrong target, so please discriminate rather than flagging everything. Rank the real tensions by severity rather than listing them as equally bad. For each, say precisely what would have to give, what the cheapest available revision is, and what that revision costs me elsewhere in the package: in particular I want to know whether any of the fixes works only by making one plank redundant, i.e. by quietly collapsing it into another, since that would mean I have been paying for a commitment I don't really need. Then tell me which single revision cleans up the most, and which plank is load-bearing for the rest. One last thing: I have an inchoate worry I can't turn into an argument that (a)'s counterfactual test behaves oddly when it is applied to (d), and I'd like to know whether that is a real defect or just my own confusion about how the comparison class is supposed to work.
reasoning: |-
  Hmm, the user is a PhD student in political theory working on the boundary problem for democratic legitimacy. They've outlined seven planks of their argument (a through g) and want an audit of potential tensions between them. They specifically want me to identify genuine inconsistencies rather than superficial ones, rank them by severity, suggest minimal revisions, and note where revisions might collapse one plank into another.

  I need to carefully analyze the logical relationships between these planks. Starting with the supervisor's concern about (a) and (f): the affectedness principle versus the single-demos preference. The affectedness approach naturally suggests fluid constituencies based on who is affected by each decision, but (f) insists on a fixed demos for practical governance reasons. That's a real tension - affectedness pulls toward flexibility while institutional feasibility pulls toward stability.

  Next, the friend's objection about (c) and (a): the inclusion of long-term non-citizens versus the counterfactual affectedness test. The user's formulation requires that decisions "foreseeably leave their prospects for a decent life worse in expectation" compared to alternatives. But for short-term visitors who suffer setbacks (like sudden visa changes), the user excludes them. The tension here is between the duration of presence and the severity of impact. The user might be smuggling in a residency duration threshold through the back door while claiming an affectedness criterion.

  The user's own worry about (a) and (d) (children/future generations) is interesting. The counterfactual "worse off" test relies on comparing outcomes, but for future people who don't exist in some alternatives, this creates problems. We can't say future people are "worse off" if they wouldn't exist under other policies - this is the non-identity problem in philosophy.

  Looking at other potential tensions: (b) no-bootstrapping and (g) institutional verdict might conflict. The basin commission example relies on member states' internal legitimacy, but if those states define their demos through their own procedures, isn't that bootstrapping? Also, (e) coercion-based justification and (d) proxy representation - if legitimacy comes from answering to the coerced, how can proxies satisfy this when the coerced (children/future people) can't hold them accountable?

  I'll rank these tensions by severity, focusing on structural conflicts rather than implementational challenges. The (a)-(f) tension seems most fundamental as it challenges the core architecture. Then (a)-(d) as it exposes a logical flaw in the key criterion. Then (b)-(g) as it questions the application to multi-level governance. The (c)-(a) tension appears more resolvable through refinement.

  For each tension, I'll suggest minimal revisions. For (a)-(f), the user could modify the counterfactual baseline to include "systematic" affectedness over time. For (a)-(d), they might reframe the decent life threshold as non-comparative. Crucially, I'll note where revisions risk collapsing distinctions - like if modifying (a) for future people makes it resemble interest-representation alone, undermining the coercion focus.

  The most efficient fix would be reworking (a)'s counterfactual to incorporate duration and systematicity, which could simultaneously address the visitor/resident issue and partially alleviate the (a)-(f) tension. The truly load-bearing plank is (a) - it's the engine making everything else run, for better or worse.
answer: |-
  Here's your audit, ranked by severity of tension, with targeted fixes and cost analysis. I've focused exclusively on internal coherence, ignoring external literature.

  ### **Ranked Tensions & Fixes**
  #### **1. SEVERE: (a) Affectedness vs. (f) Fixed Demos**  
  **Conflict:** (a) demands constituency *shuffling* per decision (since affected parties vary issue-by-issue). (f) requires a *fixed* demos for deliberation/accountability. Your basin commission example (g) dodges this by outsourcing legitimacy to states, but doesn’t resolve the core clash.  
  **Cheapest Fix:** Modify (a) to **"systematically affected over a significant timeframe"**.  
  - *Cost:* Softens the counterfactual’s precision. Visitors facing sudden taxes (c) might now qualify if impacts are recurrent/predictable (e.g., frequent border taxes). Requires defining "systematic" (e.g., residency duration? pattern of decisions?).  
  **Collapse Risk?** No—preserves affectedness as the *ground* while accommodating (f)’s institutional needs.  

  #### **2. SERIOUS: (a) Affectedness vs. (d) Future/Proxy Claims**  
  **Conflict:** (a)’s counterfactual ("worse than feasible alternatives") struggles with non-existent persons. For future people: 
  - *Non-Identity Problem:* Policy A creates future group X with poor prospects; Policy B creates different group Y with better prospects. X isn’t "worse off" than under B—they wouldn’t exist under B.  
  - *Proxy Indeterminacy:* Trustees must represent "indeterminate interests," but (a) requires a *comparative baseline* for harm ("worse than alternatives"). How do proxies apply the counterfactual test?  
  **Cheapest Fix:** **Decouple harm from comparative existence.** Redefine affectedness for future people as *"deprivation of conditions for a decent life"* (non-comparative threshold).  
  - *Cost:* Weakens (a)’s elegant counterfactual mechanism. Requires justifying a standalone threshold of "decent life" (risks circularity if tied to democratic outputs).  
  **Collapse Risk?** Partial—if the threshold absorbs all the work, the counterfactual becomes redundant for (d). But it preserves the coercion rationale (e).  

  #### **3. MODERATE: (b) No Bootstrapping vs. (g) Outsourced Legitimacy**  
  **Conflict:** (g) allows a basin commission’s legitimacy to derive *from member states' demoi*. But if those states bootstrapped *their* boundaries (e.g., excluding guest workers), (b) is violated upstream.  
  **Cheapest Fix:** **Conditionalize (g):** "Provided each member state’s demos is *itself* constituted per (a)-(c)."  
  - *Cost:* Makes transnational legitimacy parasitic on domestic compliance—may not hold in real cases (e.g., states with excluded residents).  
  **Collapse Risk?** No—(b) remains an independent constraint.  

  #### **4. MINOR: (c) Resident/Visitor Distinction vs. (a) Affectedness**  
  **Conflict:** Your friend misdiagnoses—this is resolvable. Short-term visitors *are* affected by (e.g.) sudden visa changes, yet you exclude them (c). But your (a) *already* excludes preferences/background conditions.  
  **Hidden Tension:** You’re smuggling in **duration/residency** as a filter *on top of* affectedness.  
  **Cheapest Fix:** **Clarify (a)’s scope:** Add *"where the body exercises sustained, institutionalized coercion over life prospects"*. Visitors experience episodic coercion; residents face systematic control.  
  - *Cost:* Minimal. Aligns with (f) and your institutional focus. Explicitly ties "affectedness" to the *body’s enduring power*, not just one-off decisions.  
  **Collapse Risk?** None—strengthens coherence with (e) and (f).  

  ---

  ### **Which Fix Cleans Up the Most?**  
  **Modifying (a) for systematicity ("sustained, institutionalized coercion")** resolves:  
  - The severe (a)-(f) tension,  
  - The minor (a)-(c) tension,  
  - Indirectly aids (a)-(d) by focusing on *ongoing* structures affecting futures.  

  ### **Load-Bearing Plank: (a)**  
  (a) is your engine: it defines inclusion, anchors coercion (e), filters cases (c), and (adjusted) enables (f). If (a) fails, the system stalls.  

  ### **Your Inchoate Worry on (a) & (d): Real Defect**  
  As noted in **Tension #2**, the counterfactual *does* behave oddly for future people due to the **non-identity problem**. Without adjustment, it struggles to conceptualize harm to future persons under identity-altering policies (e.g., climate change). This isn’t your confusion—it’s a recognized issue in population ethics. The non-comparative fix suggested above is the standard workaround.  

  ---

  **Final Package Post-Audit:**  
  - (a) *Revised:* Affectedness = Foreseeable worsening of prospects for a decent life *under sustained, institutionalized coercion*, compared to feasible alternatives.  
  - (d) *Revised:* Proxy claims apply where coercion deprives future persons/children of *conditions for a decent life* (non-comparative baseline).  
  - (g) *Revised:* ...provided each member state’s internal demos complies with (a)-(c).  
  - (c) & (f) now coherently supported by (a)’s emphasis on *systematic* coercion.  

  **Cost Summary:** You sacrifice some counterfactual elegance for institutional realism and future-proofing, but core commitments remain distinct and defensible. No plank collapses into another.
