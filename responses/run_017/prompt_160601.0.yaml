answer: |-
  ### Brainstorm: Selecting the Crux  
  1. **The Measurement Problem ("Collapse into Individual Rationality")**: If gains/losses are purely intrapersonal, (P,S) seems straightforwardly preferred by both. But this ignores whether *performing* the dispreferred act (e.g., Asha implementing S) violates a duty *even if* compensated elsewhere. This risks reducing morality to preference-satisfaction. *Strong contender: exposes core tension between consequentialist trade and deontic constraints.*  
  2. **Lexical Constraints**: Introducing Asha’s absolute prohibition against S precludes trade. But this might feel like stacking the deck—students could dismiss it as edge-case without grappling with the *structure* of compensation.  
  3. **Strategic Fanaticism**: Highlights how trade incentivizes moral grandstanding. However, this is more about bargaining *pathology* than the *intrinsic* morality of the trade itself.  
  4. **Moral Uncertainty**: If Asha has credence in Ben’s view, does trading exploit her doubt? Fascinating but potentially overcomplicates the core dilemma.  

  **Chosen Crux: #1 (Measurement Problem)**. It confronts the deepest puzzle: if (P,S) is *individually* optimal for both, why isn’t it *morally* unproblematic? This forces students to dissect how moral reasons resist aggregation/packaging, even absent interpersonal comparisons. It ties directly to integrity, incommensurability, and the act/package distinction.  

  ---

  ### Exam Question  
  **Asha and Ben must jointly resolve two independent issues:**  
  - **Issue 1**: Options: P, Q, or compromise M1.  
    - *Asha’s ranking*: P ≻ M1 ≻ Q  
    - *Ben’s ranking*: Q ≻ M1 ≻ P  
  - **Issue 2**: Options: R, S, or compromise M2.  
    - *Asha’s ranking*: R ≻ M2 ≻ S  
    - *Ben’s ranking*: S ≻ M2 ≻ R  

  The standard compromise is (M1, M2). However, a "gains from trade" package (P, S) is proposed: Asha gets her preferred outcome on Issue 1, Ben on Issue 2. Each prefers (P,S) to (M1,M2) *overall*.  

  **Question**: Does the package deal (P,S) resolve the moral conflict between Asha and Ben, or does it merely obscure it? Defend your answer by analyzing whether the gains from trade invalidate integrity-based objections to compromise. Address the challenge that since all gains/losses are measured *intrapersonally*, (P,S) is straightforwardly optimal for both and thus morally unproblematic.  

  *(Exam paper instructions: 60 minutes. Closed book. No citations needed. Engage the concepts rigorously.)*  

  ---

  ### Model Answer (982 words)  
  The package deal (P,S) appears to resolve Asha and Ben’s conflict through Pareto-improving trade: both prefer it to the double-compromise (M1,M2). Yet this resolution is superficial. It obscures persistent moral tensions by masking the act-specific integrity violations embedded in the trade. The claim that intrapersonal gains render (P,S) “straightforwardly optimal” fails because morality is not reducible to aggregate preference-satisfaction; it demands attention to the *character* of individual acts and the agent’s complicity in wrongdoing.  

  **(1) The Allure of Pareto and the Challenge of Intrapersonal Gains**  
  The case for (P,S) seems robust. Each party “pays” for their gain on one issue by accepting a loss on the other, but since Asha values P over Q more than she disvalues S over R (and vice versa for Ben), both judge the package superior to (M1,M2). Crucially, no interpersonal utility comparisons are needed—the improvement is attested by each agent’s own ranking. If morality is about maximizing agent-relative value, (P,S) dominates. This framing suggests integrity objections—which might condemn Asha for implementing S (which she deems worse than R) or Ben for implementing P (which he deems worse than Q)—are nullified by the net benefit.  

  **(2) Why Integrity Objections Persist: The Act/Asymmetry Problem**  
  Integrity objections (à la Williams or Stocker) emphasize that morality involves *doing* particular acts for particular reasons, not just securing net outcomes. For Asha, *choosing S* on Issue 2 might violate a duty she acknowledges (e.g., justice, loyalty), even if compensated by winning on Issue 1. The package deal treats the issues as fungible components of a basket, but moral reasons often resist such commodification. If S is intrinsically wrong from Asha’s perspective—say, it betrays a vulnerable group—her complicity in S cannot be “canceled out” by achieving P. This reflects *incommensurability*: the value preserved by P and the value violated by S may belong to different normative domains (e.g., welfare vs. rights), making trade-offs conceptually opaque and morally corrupting. The intrapersonal gain argument mistakenly assumes all values are *compensable* within a single metric.  

  **(3) Why the “Intrapersonal Gain” Defense Collapses: Two Errors**  
  The claim that intrapersonal gains dissolve moral concerns commits two errors:  
  - **The Conflation of Prudential and Moral Optimality**: That (P,S) is *preferable* for Asha does not entail it is *permissible*. Prudential rationality (maximizing overall preference-satisfaction) and moral justification are distinct. A pacifist might prefer taking a life to save their family overall, yet still feel moral anguish because they violated a deep commitment.  
  - **The Reduction of Agency to Consumption**: Evaluating only the *package* treats Asha and Ben as passive recipients of outcomes, not agents responsible for discrete choices. But Asha *enacts* S—she doesn’t merely “experience” it as an offsetting cost. Her integrity is compromised not by her net position, but by her direct involvement in an act she deems objectionable. The trade commodifies her moral agency.  

  **(4) Moral Residue and the Illusion of Resolution**  
  (P,S) creates “moral residue” (Hare): a lingering sense that something wrong occurred, even if outweighed. Asha might regret implementing S *despite* endorsing the trade. This residue signals that the conflict isn’t resolved; it’s displaced. The compromise (M1,M2), while suboptimal for both, at least avoids *directly* requiring either to enact their most dispreferred option. (M1,M2) embodies mutual concession on acts, whereas (P,S) demands mutual complicity in acts the other finds intolerable. Trade transforms disagreement from *what we should do* into *what we can tolerate giving up*—a shift that may exacerbate alienation.  

  **(5) The Limits of Trade and the Primacy of Constraints**  
  This case reveals a structural limit to gains-from-trade in ethics: they only function where values are *fully compensable*. If Asha held a lexical constraint against S (e.g., “never S, regardless of gains”), trade would be impossible. But even without absolutism, moderate deontic constraints generate friction. The Pareto argument works only if morality is purely teleological (value-maximizing). When duties prohibit specific acts, aggregate gains lack justificatory force. Trade also assumes independence between issues, but morally, choosing P *might* intensify the wrong of S (e.g., if P enriches Asha’s group while S impoverishes Ben’s).  

  **Conclusion**  
  The package deal (P,S) does not resolve the moral conflict; it papers over the act-based duties central to integrity with a veneer of mutual benefit. Intrapersonal gains justify the trade *prudentially* but not *morally*, because they ignore the non-fungibility of moral reasons and the agential cost of enacting dispreferred acts. Genuine resolution requires either finding common ground on each act (e.g., via M1, M2) or acknowledging the tragedy of irresolvable pluralism—not masking it with economically efficient but morally dissonant exchanges.  

  ---

  ### Marking Scheme (20 points total)  
  **Must-hit points (Aim for 5–6 sentences per point in essays):**  
  1. **Accurate Setup & Pareto Appeal** (4 pts):  
     - *Explain why (P,S) seems Pareto-superior to (M1,M2) using agents’ rankings, emphasizing intrapersonal gains.*  
     - **Common Error**: Misstating preferences or failing to show why trade dominates compromise.  

  2. **Integrity Objection Applied** (4 pts):  
     - *Argue that Asha enacting S (or Ben enacting P) may violate their integrity, independent of net gains.*  
     - **Common Error**: Vagueness ("it feels wrong") without tying to *act-specific duty* or *moral residue*.  

  3. **Critique of Intrapersonal Gain Defense** (5 pts):  
     - *Show why "net benefit = morally acceptable" fails (e.g., conflation of prudence/morality, non-compensable values, agency reduction).*  
     - **Common Error**: Conceding that gains nullify integrity concerns or missing the act/package distinction.  

  4. **Moral Residue & Conflict Displacement** (4 pts):  
     - *Explain how (P,S) obscures but doesn’t resolve conflict, creating lingering dissonance vs. (M1,M2)’s mutual concession.*  
     - **Common Error**: Treating regret as irrational or ignoring comparative analysis of compromise alternatives.  

  5. **Synthesis & Implications** (3 pts):  
     - *Conclude whether trade resolves/obscures conflict, generalizing about limits of Pareto in moral disagreement.*  
     - **Common Error**: Restating setup without meta-reflection on value pluralism or commodification.  

  **A/B Boundary**: An **A** answer **explicitly refutes the intrapersonal gain defense** (Point 3) by showing why morality cannot be reduced to aggregated preferences. A **B** answer accurately describes the trade-off and integrity concerns but *fails to dismantle* the core challenge that "if both prefer it, what’s the problem?"  

  ---

  ### Why This Works  
  - **Forces Engagement**: Students can’t just parrot "integrity objection"; they must *use* it to dissect a superficially appealing solution.  
  - **Targets Memorization Trap**: The "intrapersonal gains" challenge blocks rote answers—students must think why morality isn’t preference-aggregation.  
  - **Connects Themes**: Links incommensurability (non-compensable values), integrity (act-focused duties), and Pareto (gains as illusory resolution).  
  - **Sharp A/B Boundary**: Turns on a single move: refuting the reduction of morality to prudence.  

  Let me know if you want tweaks to the model answer’s emphasis or a variant with lexical constraints!
