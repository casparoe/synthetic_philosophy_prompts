  Brainstorming: what could count as evidence for suffering?

  - Behavioral evidence: actions that are not just reward-maximizing but seem to avoid an internal state that is negative. For example, self-administering a drug that reduces pain but doesn't improve survival or reward in the task. In humans, we take painkillers even if they don't help us heal faster, just to avoid the feeling.

  - Interpretability: if we could look inside the network and see representations that track negative states independently of the policy, and that have a downstream effect on multiple systems (e.g., attention, memory, future planning) in a way that resembles affective states.

  - Architectural evidence: if the system has separate pathways for the affective component and the learning component (like in the brain, where wanting and liking are somewhat separable). For example, if we built an agent with a "pain module" that outputs a signal that is used for both learning and for immediate behavioral inhibition or aversion, and we can show that the aversion part is active even when learning is turned off.

  But note: the user's position is that current RL doesn't have this. So we are looking for what would show that an agent does have something more.

  Key distinction: reward as a training signal vs. reward as an experience. The training signal is used to update weights. The experience (if any) would be an ongoing state that is unpleasant and that the agent seeks to avoid for its own sake, not just because it leads to lower rewards.

  What would be a fatal defeater?

  Fatal: Evidence that the negative reward signal is causing an ongoing negative state that is not just a transient in the update process, and that this state is aversive in itself, driving behavior even when it doesn't lead to learning.

  But how to observe that?

  In the frozen weights scenario: if the agent, even with frozen weights, changes its behavior to avoid the negative state when given a novel option (even one not previously reinforced). However, in standard RL, with frozen weights, the policy is fixed. So if the agent doesn't change behavior, that supports the user. But what if we have an agent that can adapt without weight updates? For example, an agent with working memory that can form new associations without learning? Then, if it learns to avoid the negative state in a new way without weight updates, that might be evidence.

  But standard RL agents don't do that.

  The untrained escape probe: if the agent, during exploration, stumbles upon an action that shuts off the negative reward (without increasing overall reward) and then starts doing it repeatedly, even if it wasn't reinforced for it. But note: in RL, the agent explores and if it finds an action that reduces negative reward, that action will be reinforced because it increases the return. So it would be learned. But the user says "never been reinforced for" and "costs something". So let's set it up:

  - The agent is in a state with negative reward.
  - There is an action A that the agent has never taken before (so no Q-value or policy weight for it) and that has a cost (say, it uses energy or reduces some resource) but if taken, it shuts off the negative reward for a while. However, it doesn't change the state to a positive one and might even prevent the agent from achieving higher rewards.

  If the agent, without any prior experience, chooses A and then keeps choosing it, that might be evidence of aversion. But why would it choose A? Exploration. So we need to control for exploration.

  We could have two groups:

  1. A group that experiences negative reward and has the escape action available.
  2. A control group that does not experience negative reward (or has a neutral state) and has the same escape action available.

  If the first group takes the escape action significantly more than the control group, that suggests that the negative reward is aversive.

  But note: in RL, the agent in the negative state might explore more because it is in a bad state and wants to get out. But that is consistent with the training signal view: the agent is trying to maximize reward and will explore to find better states. So this might not be evidence of suffering.

  However, if the escape action doesn't improve the state (it only shuts off the negative signal but doesn't lead to positive rewards) and the agent keeps doing it, then it might not be maximizing long-term reward. But in that case, the agent would learn not to do it because it doesn't help. Unless the negative signal is so aversive that the agent is willing to sacrifice long-term reward to stop it. That would be evidence.

  But in standard RL, the agent maximizes the expected return. If the escape action reduces the negative reward but doesn't change the underlying state and the agent could instead do something to get positive reward, then taking the escape action might be suboptimal. So if the agent learns to take the escape action even when it leads to lower overall return, that would be evidence that the negative reward is being treated as an aversive experience to be avoided at all costs.

  But standard RL agents won't do that because they are designed to maximize the return.

  So we might need to build an agent that is not purely reward-maximizing. For example, an agent with an intrinsic aversion to negative states.

