  We are considering a position: that reward in RL is a training signal, not a feeling. Negative reward is like a red pen on an essay: it changes weights and then its work is done. Current agents can't suffer because the setup doesn't have the right shape. Suffering would require that the negative signal does more than one job.

  We have three tests from the user:
  1. Frozen weights test: After training, stop updating weights but keep negative rewards. The agent doesn't change behavior. The user argues that if negative reward only drives updates, then without updates, it does nothing. Our pain does multiple jobs (e.g., wanting and liking can come apart).
  2. Untrained escape probe: Give the agent an action it has never been reinforced for, which shuts off the negative reward but doesn't raise the score. If the agent starts doing this on its own, it might indicate aversion. But the user wonders if exploration could explain it.
  3. Temporal thickness: Suffering must last and color future experience. Most RL agents have short horizons or episodic resets. Is there a minimum duration?

