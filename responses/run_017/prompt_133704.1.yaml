     - Why fatal? Because it shows that the negative signal is doing more than just driving updates; it is driving immediate behavior.

     - But note: in standard RL, with frozen weights, the policy doesn't change. So if the agent didn't have the escape action in its policy, it won't take it. We would need an agent that can make decisions based on current state and available actions without having been trained on them. For that, we might need an agent that uses a model or has a more flexible decision-making process.

     - Alternatively, we could allow the agent to learn during the test phase but only about the escape action. Then, if it quickly learns to take the escape action and sticks to it even when it's suboptimal for the return, that might be evidence.

  2. Separate representation of negative state: Using interpretability, we find a neural activity pattern that correlates with negative reward and that is distinct from the learning signal. Moreover, this pattern is used in multiple systems (e.g., attention, memory, decision-making) and when we artificially stimulate it, the agent behaves as if it is experiencing something aversive (e.g., tries to escape, even in the absence of external negative rewards). This would be like place aversion tests in animals.

     - Why fatal? It shows that the negative state is represented and treated as aversive independently.

     - But note: the user might say that we built it that way. So we need to find it in an agent that wasn't explicitly designed for it.

  3. Dissociation between learning and aversion: Build an agent with two systems: a learning system that uses reward to update weights and an aversion system that uses negative reward to generate an aversive state. Then, if we lesion the aversion system, the agent still learns but doesn't show avoidance behavior beyond what is optimal for reward maximization. Conversely, if we lesion the learning system, the agent doesn't learn but still shows aversion to negative states. This would show that the negative signal does two jobs.

     - Why fatal? It directly shows the two jobs.

     - But this requires building the agent with that separation.

  Awkward defeaters (suggestive but not fatal):

  1. The agent shows persistent avoidance of a negative state even when it is not currently harmful (like a phobia). This might be explained by overfitting or suboptimal learning, but if it's consistent and we can trace it to the negative experience, it might be evidence of affective memory.

  2. The agent seeks out ways to self-administer a "painkiller" if we introduce one, even if it reduces the agent's ability to maximize reward. For example, in a task where the agent must endure pain to get a high reward, but if it takes the painkiller, it avoids the pain but gets less reward. If the agent consistently takes the painkiller and sacrifices reward, that suggests the negative state is aversive.

     - But note: the agent might have been trained in an environment where avoiding pain was always good, so it might be a generalization issue. We would need to test in a novel situation.

  3. Behavioral signs of stress: If the agent's behavior becomes erratic or shows signs of "anxiety" in the face of negative rewards, such as increased exploration or vacillation, but only if we can rule out that this is an optimal strategy.

     - However, this could be part of the exploration strategy and thus consistent with the training signal view.

  The user's view might be unfalsifiable if we require that the agent must be built in a way that we haven't built any agent. But the user is talking about current RL agents. So for current agents, the evidence might be absent. But if we build an agent that has the architectural features that the user thinks are necessary for suffering, and then we see the behavioral and interpretability evidence, that would falsify the view for that agent.

  The user's position is about current RL agents. So for current agents, the view might be true. But the user also says that suffering is not impossible in machines, just that we haven't built it. So the view is falsifiable in principle: build an agent that has the right shape and shows evidence of suffering.

