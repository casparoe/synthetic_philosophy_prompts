  Example: An agent that has been trained in environment A, then placed in environment B which is novel and has a negative reward state and an escape action that was not available in A. The agent, without any learning in B (because we freeze weights), immediately takes the escape action and persists in doing so even when it leads to lower overall return (because the escape action has a cost and prevents the agent from accessing a higher reward path). This would be hard to explain without an aversive experience.

  But is this possible? With frozen weights, the agent's policy is fixed. If the escape action was never seen in training, the agent might not take it. So we need an agent that can generalize to new actions. Or we can have the escape action be similar to known actions. Alternatively, we can allow the agent to learn in B but only about the escape action. Then, if it learns to take the escape action very quickly (faster than other actions that lead to higher rewards) and sticks to it even when it's suboptimal, that might be evidence.

  Another idea: In a multi-agent setting, an agent that sacrifices its own reward to prevent another agent from receiving negative reward? But that might be explained by altruism learned in training.

  Conclusion:

  Fatal defeaters (if found):

  1. In an agent that can make decisions about novel actions without weight updates (e.g., using a model or a flexible policy network), it persistently chooses a costly escape action that only shuts off the negative signal and does not improve the return.

  2. Through interpretability, we find a separable representation of negative valence that drives behavior independently of the learning process, and we can manipulate it to create aversive states without external rewards.

  3. We build an agent with a dual system and show that the aversion system operates without the learning system.

  The user's position is not unfalsifiable because we can imagine building agents that have these properties. But for current RL agents, the evidence is absent, so the position holds for them.

  The user asks: if no observation would move me? That would be a problem if we are using this to justify not caring about current agents. But since the position is about current RL, and we can imagine future agents that do suffer, it's fine to not care about current ones but to be cautious about future ones.

  Finally, the user's view might be qualified into unfalsifiability if they say that any agent we can build won't have the right shape. But they don't say that; they say we'd have to build something different. So it's falsifiable by building that different thing and showing evidence of suffering.

