prompt: |-
  I sit on the grants committee of a small foundation with an annual budget of roughly two million dollars, and we are deciding whether to adopt the importance / tractability / neglectedness framework — the scheme that is standard in cause-prioritization work — as our standing method for choosing where the money goes. In preparation I read a much-shared blog post explaining the framework by a writer who covers philanthropy for a general audience and is broadly sympathetic to it. The passage that matters I have reconstructed below close to how it read:

  "Choosing a cause is a multiplication problem. Estimate three factors and multiply them. Importance is the size of the prize: how much better the world would be if the problem were solved outright. Tractability is the exchange rate between resources and progress — what fraction of the problem a given amount of money or talent can eliminate. Neglectedness is how little is already being spent on it, and it matters because the first dollar into a problem does far more good than the ten-thousandth, so a well-funded cause has already picked its low-hanging fruit and a neglected one has not. Multiply and you have the expected good per dollar, which is the only number a donor has any business looking at. The practical upshot is that the best causes are, as a rule, the unfashionable ones: if a problem is important and tractable, the only explanation for its still being neglected is that no one has got round to it yet, and that neglect is precisely what makes your dollar go furthest. Two things follow. First, concentrate: a cause ranked second is by definition worse per dollar than the one ranked first, so a donor who spreads money across several causes is simply buying less good with the same cheque. Second, stay out of crowded causes: a new dollar for something like cancer research, which already commands enormous budgets, buys next to nothing, and is therefore close to worthless to a donor whose aim is to do good."

  A colleague on the committee, who is skeptical of the whole framework, says the multiplication is a category mistake: neglectedness is not a third independent factor but a claim about where we currently sit on the tractability curve, so multiplying by it counts the same thing twice. He adds that once you take diminishing returns seriously the object to be chosen is not a ranked list of causes but an allocation across a portfolio, one that equalizes marginal cost-effectiveness across causes — which will normally mean funding several at once rather than piling everything into the winner. On the cancer remark he says the post forgets about other people's money: if a well-funded institution receives my dollar it may spend less of its own, so the counterfactual effect of my dollar is not simply the marginal project it nominally purchases. I find all three points persuasive, which worries me — I may be flattered by a clever objection rather than told the truth — and I don't know enough about the framework to tell whether he is attacking it or attacking a version of it that only exists in the post.

  Please audit the passage rather than the framework in general. Work through it claim by claim and sort what you find into: what a careful proponent of the framework would endorse as stated; what is a legitimate simplification for a popular audience; what is a genuine misrepresentation or non sequitur; and what is contested among people who actually use the framework. Then tell me whether the two conclusions the post draws — put everything into your top-ranked cause, and treat crowded causes as worthless — survive correction of the passages they rest on, and how much weaker the defensible versions of those claims are.

  Two constraints on how you answer. First, I know the terms importance, tractability and neglectedness are defined slightly differently by different writers, and you have no way to check: wherever your verdict turns on which definition is in force, say so explicitly and give me the verdict under each reading rather than picking one silently. Second, I want the audit to come with its own error bars: attach a confidence level to each of your main judgments, name the one place where your own reasoning is most likely to be wrong, and state what argument or consideration — a definition, an empirical fact about how steeply marginal returns actually decay, a feature of the framework's intended use I haven't mentioned — would lead you to a different verdict on the multiplication objection and on the concentration conclusion.
reasoning: |-
  Hmm, the user is on a grants committee for a small foundation and needs help evaluating a popular explanation of the ITN framework. They're concerned about objections raised by a colleague regarding multiplication as a category mistake, portfolio allocation, and counterfactual impact in well-funded causes. They want me to audit the specific passage rather than the framework itself.

  The core task is to audit this passage claim-by-claim. The colleague makes three key objections: 1) multiplying ITN counts neglectedness twice (since neglectedness relates to tractability's curve), 2) diminishing returns imply portfolios not winner-take-all, and 3) the cancer example ignores counterfactual displacement.

  The passage contains several problematic claims. The multiplication formula oversimplifies reality - it treats importance as static when it's actually dynamic, and neglects interactions between factors. The categorical claim that "expected good per dollar is the only number a donor has any business looking at" ignores practical constraints like grantee capacity. The "unfashionable causes" rule has exceptions when neglectedness isn't the binding constraint.

  The two practical conclusions are particularly flawed. "Concentrate everything in #1" only holds under unrealistic conditions: zero setup costs, no uncertainty in estimates, and perfectly scalable interventions. "Crowded causes are worthless" ignores displacement effects and fails to distinguish between fungible and non-fungible funding scenarios.

  On the colleague's objections: The multiplication point is partially valid - neglectedness does relate to tractability's derivative, but they're not identical concepts. The portfolio argument is strong and widely accepted in economics. The displacement point about cancer funding is crucial and well-founded.

  I'll need to categorize each claim in the passage as: endorsed by proponents, legitimate simplification, misrepresentation, or contested. Then evaluate whether the two practical conclusions survive correction. The defensible versions would be much weaker: "consider concentrating" rather than "must concentrate", and "evaluate crowded causes carefully" rather than "automatically avoid".

  For confidence levels, I'm most confident about the displacement error in the cancer example (95%) because it's a well-established concept in philanthropy. Least confident about the multiplication objection (75%) due to definitional ambiguities - if "tractability" explicitly includes the current position on the curve, the objection holds more strongly.
answer: |-
  Here's a detailed audit of the passage, structured as requested. I'll work claim-by-claim, categorize each, then assess the conclusions. Confidence levels (CL) are at the end of each major section, with overall error bars discussed at the end.

  **Claim-by-Claim Audit:**

  1.  **"Choosing a cause is a multiplication problem. Estimate three factors and multiply them."**
      *   **Category:** Legitimate simplification (with caveats).
      *   **Analysis:** The core ITN framework *is* multiplicative in spirit (Expected Value = I * T * N). It's a foundational heuristic for comparing cause areas. However, proponents acknowledge this is a high-level model. Estimating these factors quantitatively is extremely difficult in practice, and the multiplication often occurs conceptually rather than arithmetically. The simplification lies in presenting it as a straightforward arithmetic operation.
      *   **CL:** 90% (Standard representation of the core idea).

  2.  **"Importance is the size of the prize: how much better the world would be if the problem were solved outright."**
      *   **Category:** Endorsed as stated.
      *   **Analysis:** This aligns perfectly with standard definitions (e.g., 80,000 Hours, Open Philanthropy). Importance is the total potential upside if the problem were completely solved.
      *   **CL:** 98% (Standard, uncontroversial definition).

  3.  **"Tractability is the exchange rate between resources and progress — what fraction of the problem a given amount of money or talent can eliminate."**
      *   **Category:** Endorsed as stated (though definition variations exist).
      *   **Analysis:** This captures the core idea: how efficiently resources convert into impact. However, note:
          *   *Variation 1:* Some define tractability as the *likelihood* of making progress (often qualitative). Under this reading, it's less precisely an "exchange rate" but the spirit holds.
          *   *Variation 2:* Others define it as the *marginal* cost-effectiveness *at the current level of funding* (closer to the colleague's point). **Verdict:** If tractability is defined as *baseline* cost-effectiveness (ignoring current funding), this is standard. If defined as *current marginal* cost-effectiveness, it overlaps significantly with neglectedness. The passage uses "a given amount," implying a baseline rate, aligning with the most common introductory definition. **Verdict Under Reading 1 (Baseline):** Endorsed. **Verdict Under Reading 2 (Marginal):** Contested/Misrepresentation (it conflates T & N).
      *   **CL:** 85% (Common definition used in intros; awareness of variation).

  4.  **"Neglectedness is how little is already being spent on it..."**
      *   **Category:** Legitimate simplification (omits nuance).
      *   **Analysis:** Neglectedness is indeed primarily about current resource levels. However, sophisticated proponents often consider *relative* neglectedness (spending vs. scale/importance) and *who* is spending (e.g., government vs. philanthropy). The simplification is acceptable for a general audience.
      *   **CL:** 90%.

  5.  **"...and it matters because the first dollar into a problem does far more good than the ten-thousandth, so a well-funded cause has already picked its low-hanging fruit and a neglected one has not."**
      *   **Category:** Endorsed as stated (core rationale for N).
      *   **Analysis:** This is the fundamental economic principle of diminishing marginal returns, which is the *entire reason* neglectedness is a factor in ITN. It's correctly presented.
      *   **CL:** 98%.

  6.  **"Multiply and you have the expected good per dollar, which is the only number a donor has any business looking at."**
      *   **Category:** Genuine misrepresentation / Overstatement / Non sequitur.
      *   **Analysis:** This is a significant overstatement and misrepresents careful ITN use:
          *   **"Expected good per dollar":** ITN multiplication aims to estimate *marginal* cost-effectiveness (next dollar impact). Proponents *seek* this, but readily admit estimates are highly uncertain and qualitative.
          *   **"The only number...":** This is demonstrably false even for strong proponents. Other crucial considerations include: robustness under uncertainty (is the estimate reliable?), potential for leverage/catalysis, coordination effects, downside risks, organizational capacity/fit, values alignment, tractability of *finding* good opportunities within the cause, and practical constraints (e.g., minimum funding thresholds). Ignoring these can lead to poor decisions.
      *   **CL:** 95% (Clear overstatement).

  7.  **"The practical upshot is that the best causes are, as a rule, the unfashionable ones..."**
      *   **Category:** Legitimate simplification leaning towards misrepresentation.
      *   **Analysis:** Neglectedness *often* makes unfashionable causes promising. However, calling it a "rule" overstates. A cause could be unfashionable *because* it's genuinely intractable or unimportant. Conversely, a "fashionable" cause might still be highly cost-effective if scale/importance is vast (e.g., global poverty) or if new tractable opportunities emerge despite funding. The passage's logic ("if important & tractable, neglect is the only explanation") ignores that causes can be neglected due to *lack of known tractable solutions* (i.e., low T) or *misperceptions* of I or T. It assumes perfect information.
      *   **CL:** 80% (Simplifies a common pattern into an absolute rule, ignoring other reasons for neglect).

  8.  **"Two things follow. First, concentrate: a cause ranked second is by definition worse per dollar than the one ranked first, so a donor who spreads money across several causes is simply buying less good with the same cheque."**
      *   **Category:** Genuine misrepresentation / Non sequitur (based on flawed premises).
      *   **Analysis:** This conclusion *only* follows under highly unrealistic assumptions that careful proponents *do not* hold:
          *   **Perfect Certainty:** That the ranking (I*T*N estimates) is perfectly accurate and certain.
          *   **Perfect Scalability:** That the top cause can absorb infinite funds at the *same* marginal cost-effectiveness.
          *   **No Setup/Coordination Costs:** That shifting all funds has no friction or loss of efficiency.
          *   **No Diminishing Returns within Cause:** Contradicts the core reason for N! Funding the top cause *further* reduces its neglectedness and thus its *future* marginal cost-effectiveness.
          *   **No Uncertainty/Information Value:** Diversifying can hedge against being wrong about the top rank.
      *   **CL:** 98% (Directly contradicts core economic principles acknowledged in ITN).

  9.  **"Second, stay out of crowded causes: a new dollar for something like cancer research, which already commands enormous budgets, buys next to nothing, and is therefore close to worthless to a donor whose aim is to do good."**
      *   **Category:** Genuine misrepresentation / Non sequitur (ignores key counterfactuals).
      *   **Analysis:** This is flawed for two main reasons:
          *   **Diminishing Returns ≠ Zero Returns:** "Next to nothing" and "close to worthless" are massive overstatements. While marginal returns diminish, they rarely fall to zero or near-zero for massive, complex problems like cancer. Significant progress often requires continued large-scale investment.
          *   **Counterfactual Impact (Displacement/Fungibility):** As the colleague notes, this completely ignores *what your dollar displaces*. If your grant enables work that wouldn't happen otherwise (e.g., funding a risky project government won't, or a specific researcher) and the institution doesn't reduce other spending because of your grant (non-fungible), your impact could be high. If your dollar *displaces* another dollar (e.g., unrestricted funding to a well-funded lab that then spends $1 less of its own money), your counterfactual impact is near zero. Careful ITN *must* consider counterfactuals, which the passage ignores. It assumes nominal spending equals impact.
      *   **CL:** 98% (Ignores fundamental counterfactual reasoning and overstates decay).

  **Assessment of Conclusions:**

  1.  **"Put everything into your top-ranked cause":**
      *   **Survives Correction?** **No.** This conclusion collapses upon correction. It relies on the misrepresentation that ITN ranking is certain, perfectly scalable, and ignores diminishing returns *within* the top cause as you fund it. The defensible version is radically weaker: "All else equal, and assuming high confidence and scalability, there is an *argument* to prioritize funding your top-ranked cause *more heavily* than others." Careful proponents explicitly reject "all eggs in one basket" due to uncertainty, diminishing returns, absorption capacity, and the portfolio logic highlighted by the colleague. Funding a portfolio to equalize marginal cost-effectiveness (factoring in uncertainty) is the standard economic approach ITN *aims* to approximate, not contradict.
      *   **Strength of Defensible Claim:** Very weak. It becomes a mild heuristic about *direction*, not a rule of concentration. Concentration is only optimal under unrealistic conditions rarely met in practice.

  2.  **"Treat crowded causes as worthless":**
      *   **Survives Correction?** **No.** This conclusion collapses due to the misrepresentation of marginal impact ("next to nothing") and the complete omission of counterfactual reasoning. The defensible version is: "Significant existing funding is a *red flag* requiring careful counterfactual analysis. In crowded causes, the *marginal* impact of an *additional* dollar *may* be lower than in more neglected areas, *especially* if funding is fungible. It requires extra diligence to find opportunities where your dollar is truly additive rather than displacing others."
      *   **Strength of Defensible Claim:** Moderately weaker, but retains core insight. The key shift is from an absolute prohibition ("stay out", "worthless") to a strong caution requiring specific counterfactual justification. The potential for low impact in crowded causes is real, but it's not guaranteed and must be assessed case-by-case, primarily through the lens of counterfactuals and fungibility. It's a warning, not a dismissal.

  **Error Bars & Key Uncertainties:**

  *   **Confidence Levels:** Embedded in each section above (CL: 75%-98%). Highest confidence in identifying the misrepresentation of the conclusions (98%) and the counterfactual error (98%). Lower confidence on tractability definition nuances (85%).
  *   **Most Likely Error Point:** My reasoning on **the multiplication objection (point #3 - Tractability definition)**.
      *   **Why:** The colleague's point hinges on whether "tractability" (T) inherently includes the *current position* on the cost-effectiveness curve (making it partially dependent on current funding - N) or is defined purely as an inherent property of the problem/solution space (baseline rate). The passage's wording ("exchange rate... *a given amount*") suggests the latter, which is common in intros. However, in *operational* ITN for resource allocation, the distinction blurs because you care about *marginal* CE *now*, which depends on current funding (N). My verdict assumed the common intro definition. **If "tractability" is explicitly defined by the framework as *current marginal* cost-effectiveness, then the colleague is correct: multiplying I * T(marginal) * N *would* double-count.** My judgment assumed T(baseline) is the intended meaning in the passage. If the framework used T(marginal), the passage's multiplication *is* a category mistake.
      *   **What Would Change My Verdict:** If a specific, authoritative source for the framework defines "tractability" explicitly as *the marginal cost-effectiveness at the current level of funding*. Under that definition:
          *   Verdict on Multiplication: **Genuine Misrepresentation / Category Mistake** (Double-counting neglectedness via T and N).
          *   Impact on Conclusions: Strengthens the colleague's portfolio argument further, as N is already embedded in T(marginal). Weakens the passage's core formula significantly.
  *   **Key Consideration for Concentration Conclusion:** The **steepness of diminishing marginal returns** and **uncertainty in estimates**. If returns diminish very slowly and estimates are near-perfect, concentration becomes more defensible. In reality, returns often diminish significantly, and estimates are highly uncertain, making diversification strongly preferable.
  *   **Key Consideration for Cancer/Crowded Cause Conclusion:** The **fungibility of funding** and the **specific counterfactual scenario**. If funding is highly fungible (e.g., unrestricted grant to a large university lab), impact is likely low. If it's non-fungible (e.g., funding a specific, novel project the lab wouldn't otherwise do), impact could be high. The passage ignores this crucial distinction.

  **Summary:** The passage oversimplifies the ITN framework, particularly by presenting the multiplication as straightforward arithmetic and the conclusions ("concentrate everything," "avoid crowded causes") as absolute rules derived flawlessly from it. Your colleague's critiques are largely valid and highlight significant misrepresentations or non sequiturs in the passage, especially regarding portfolio allocation and counterfactual impact. The core insights of ITN (consider scale, efficiency, and current funding levels) remain valuable, but the practical conclusions drawn in this passage do not survive scrutiny. The defensible versions are substantially weaker: "Prioritize causes scoring highly on ITN" and "Be highly skeptical of crowded causes and rigorously assess counterfactual impact," not "Put all money in #1" and "Never fund cancer research."
