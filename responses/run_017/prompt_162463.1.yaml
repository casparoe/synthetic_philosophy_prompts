prompt: |-
  Three weeks ago my aunt Ilse died at seventy-eight. For the last thirty-one years she had been doing essentially one thing: writing English versions of a short sixteenth-century French poem — Clément Marot's light, teasing get-well verse to a sick young woman, the poem that Douglas Hofstadter's *Le Ton beau de Marot* (1997) made notorious among English readers — under a constraint she imposed on herself. A draft had to match the French line for line in syllable count, rhyme scheme and rhyme gender, and had to keep the poem's register intact: a flirtatious note to one particular girl, not a meditation on sickness. On top of that she kept what she called the ledger rule: no line could reappear unchanged in a later finished draft, and each new draft had to gain something in form while losing something in sense, or gain in sense while losing in form, so that no two completed drafts could be ranked against each other. She called finished translations incomparable, and said that picking one was an act of taste, not of discovery. She left 214 completed drafts, plus a notebook titled the unpayable debts — the caesura on the fourth syllable, the fact that every French rhyme word is a term of endearment, the sudden drop into real worry at the close — not one of which any of her drafts had managed to keep.

  I am giving the eulogy, and I have to write it for a room that is split three ways: her two daughters and four grandchildren, who found the thirty-one years baffling and, honestly, a bit hurtful; a dozen or so literary translators and poets, several of whom first met the poem through Hofstadter's book and who will hear immediately if I smuggle in any comfort about a definitive version; and my mother, her sister, who needs to be told that those thirty-one years added up to something.

  Write it as about four minutes, honest on her own terms — no she found the version she was looking for, no her work is done and she can rest now, no claim that any one draft is the best, no she lives on in the poem — while still landing as comfort for the people who were hurt by where her attention went, and without pretending that the years produced a finished thing. Give it as exactly five movements, each two or three sentences, with no introduction and no conclusion.
reasoning: |-
  Okay, the user has shared a deeply personal and complex task: writing a eulogy for their aunt Ilse, who spent 31 years translating a single French poem under strict constraints. This isn't just about memorializing someone—it's about navigating family tensions, professional scrutiny, and honoring an obsessive creative process without romanticizing it.

  The aunt's life work feels like a puzzle box: 214 drafts of Marot's poem, each version sacrificing either meaning or form, never achieving perfection. The "unpayable debts" notebook haunts me—it's proof of her awareness that complete translation was impossible. Yet she persisted. 

  Three audiences complicate this: family who felt neglected (daughters/grandchildren), literary experts who'll detect false closure, and the grieving sister needing validation. The user specifically bans comforting lies—no "she found her perfect version," no "her work is done." 

  I notice the structural demand: five tight sections, 2-3 sentences each, no intro/conclusion. Like the aunt's poems, this eulogy must balance constraints. The challenge is to reframe obsession as devotion without excusing the hurt. Maybe highlight how her "incomparable" drafts mirror human relationships—flawed but singular? 

  Key angles to weave: 
  For family: Acknowledge the poem consumed time meant for them, but stress her consistency (a different kind of love). 
  For poets: Honor her rigor while admitting the debts remain unpaid. 
  For the sister: Frame 31 years as active pursuit, not stagnation. 

  The ledger rule feels crucial—it proves she wasn't spinning wheels but exploring trade-offs. Like life: we gain wisdom but lose youth; deepen bonds but miss moments. Her art echoed that. 

  Avoiding platitudes is vital. Instead of "she lives in the poem," maybe say the drafts are "conversations with impossibility." Comfort comes from naming the lack of closure honestly—perhaps that's what the family needs too? The hurt of her absence won't be "fixed" by this speech, just held carefully, like her caesuras.
answer: |-
  ## Movement 1
  Ilse spent thirty-one years in conversation with a single, playful, sixteenth-century French poem. She wasn’t seeking its final, definitive English shape; she was exploring its possibilities, endlessly, under rules she set: syllable by syllable, rhyme by rhyme, never repeating a line, always trading sense for sound or sound for sense.

  ## Movement 2
  Her focus was absolute; it was work that demanded everything she brought to it, draft after draft. That intensity meant other things, sometimes precious things – time, attention, presence – resided elsewhere, a reality that brought its own quiet ache for those who loved her most.

  ## Movement 3
  She knew the poem held debts she could never fully repay: its specific rhythms, the endearments woven into rhyme, its flicker of genuine fear. Her 214 finished translations weren't attempts to settle that debt, but proof of its unpayable nature – each one a distinct, "incomparable" response, judged only by taste.

  ## Movement 4
  For Ilse, the value wasn't in reaching an endpoint or declaring one version best. It was in the act itself: the rigorous, decades-long practice of paying close attention, of wrestling form and meaning within her strict ledger, finding joy in the constraint and the impossible chase.

  ## Movement 5
  Those thirty-one years added up to a profound commitment: to the nuance of a single moment captured in verse, to the discipline of her own demanding art, and to the belief that some things – like the perfect rendering of a feeling, or the full measure of a life’s attention – are beautifully, necessarily, incomplete. Her work stands as that testament.
