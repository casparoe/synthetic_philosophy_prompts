  ### Units of Selection Game: "Trait Tracker"  
  *Goal: Show that natural selection can act at multiple levels, and group success depends on isolation of cooperators.*

  **Materials:**  
  - 28 cards (14 "C" cooperator cards, 14 "S" selfish cards)  
  - Score sheets for players (track individual/group points per round)  
  - Candy payouts (e.g., 1 point = 1 small candy at the end)  
  - Pre-printed payoff tables (by group size):  

  | Group Size | \# of Cs | C Payoff | S Payoff |  
  |------------|----------|----------|----------|  
  | 3          | 3        | 3.0      | 3.5      |  
  | 3          | 2        | 2.0      | 2.5      |  
  | 3          | 1        | 1.0      | 1.5      |  
  | 3          | 0        | 0.0      | 0.5      |  
  | 4          | 4        | 3.0      | 3.5      |  
  | 4          | 3        | 2.0      | 2.5      |  
  | 4          | 2        | 1.0      | 1.5      |  
  | 4          | 1        | 0.5      | 1.0      |  
  | 4          | 0        | 0.0      | 0.5      |  

  **Setup:**  
  - Divide 14 players into 4 groups (two groups of 4, two groups of 3).  
  - Give each player one C and one S card.  

  **Rules & Timeline (50 min total):**  
  1. **Intro (5 min)**:  
     - "You represent animals with traits: **C** (helps group, costs you) or **S** (helps you, hurts group)."  
     - Each round, secretly choose C or S. Reveal simultaneously.  
     - Record payoffs using the table (based on your group’s size and # of Cs).  

  2. **Rounds 1-3 (12 min total, 4 min/round)**:  
     - Groups play independently.  
     - After each round: "Did S *always* outscore C in your group? Did groups with more Cs outscore groups with more Ss?"  

  3. **Reshuffle (5 min)**:  
     - Calculate **cumulative group scores** (sum of all members’ points).  
     - Split the highest-scoring group in two. Merge the two lowest-scoring groups into one (e.g., two groups of 3 → one group of 6; split the best group of 4 into two pairs).  
     - *Don’t explain why*—just assign new groups.  

  4. **Rounds 4-5 (8 min total, 4 min/round)**:  
     - Play in new groups. Note shifts in payoffs.  

  5. **Debrief (20 min)**:  
     - **Key Moments → Concepts:**  
       - *Within any group, S > C*: "Why did S *always* beat C in your group? This is **individual-level selection**: traits that help *you* outcompete neighbors spread."  
       - *High-C groups > low-C groups*: "Why did groups full of Cs dominate early? This is **group-level selection**: groups with ‘selfless’ traits outproduce others."  
       - *Post-reshuffle chaos*: "What happened when I split the top group and merged weak ones? Group selection *only works if cooperators stick together* (like in families or stable habitats). Reshuffling broke that."  
       - *Boundaries matter*: "When I redrew groups, group selection ‘disappeared.’ In nature, this depends on migration or kinship—it’s not automatic."  
     - **Final Points:**  
       - Genes don’t "choose" like you did—they spread via reproduction.  
       - Prediction depends on the level: Individual selection predicts S domination; group selection predicts C persistence if groups are isolated.  
       - Price equation (mention only): "Math splits evolution into within-group vs. between-group change. You saw this: within groups, S won; between groups, C groups won early."  

  **Troubleshooting & Limitations:**  
  - **If everyone defects by Round 2**: Increase C’s payoff (e.g., make C payoff = 2.5 for 3 Cs in size-3 group). Explain: "In nature, cooperation often evolves with kinship—relatives help each other."  
  - **What will go wrong**:  
    - Reshuffle takes too long → Pre-calculate groups after Round 2.  
    - Players focus on candy, not concepts → Emphasize "track *why* scores change" in debrief.  
    - Math confusion → Skip Price equation; focus on observed patterns.  
  - **What the game can’t show**:  
    - Real selection requires reproduction (not just rounds).  
    - Genes persist across generations—you mimicked choice, not inheritance.  
    - Kin selection (genetic relatedness) is a key driver in nature.  

  **Outcome**: Players leave doubting "obviously the individual" and seeing that structure (group boundaries) shapes evolution.
