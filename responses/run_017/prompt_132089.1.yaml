prompt: |-
  For the last two years I have been the executor of my father's papers, and for the last six months a limited series about the industrial disaster he worked on in the 1970s has been in post-production. He appears under his own name for something like eleven minutes of screen time. In those minutes he is given a line the transcripts show he never said, he stays silent at a meeting where the record shows he raised the alarm, and a marriage that lasted thirty-eight years is compressed into one explanatory scene whose purpose is to motivate a decision he made for professional reasons. The producers have asked me to consult on a possible second season. My brother wants me to demand the scene be cut. My sister says a drama is not a deposition and that I am confusing my father with my father's reputation. My family has roughly one conversation left before this stops being a disagreement and becomes a rupture, and I would like to have thought it through before I spend it.

  My father's notebooks and letters go to a university archive next spring under a twenty-five-year seal. So for the next two decades, for almost everyone who encounters him at all, this series will not compete with the record; it will be the record. That is the feature of the case I keep coming back to, and it is why I want the specification before I decide anything: what would an account of what we owe the real dead, when their lives are dramatized, have to get right to be good enough to decide a case like this one? Not a survey of the field and not a reading list, and I do not need the positions named after anyone.

  The material I think the list has to handle, each with the case behind it:

  The triple asymmetry: my father cannot be compensated, cannot correct the record, and cannot refuse. Whether the wrong, if there is one, is something done to him or only something done to the living who remember him, and whether those two tracks ever come apart — my brother argues as though it is entirely about us, my sister as though it is entirely about him, and neither has said why the difference should matter.

  Identification: at what point does the character stop being my father? Compressed timelines, composite figures, invented scenes, and the special case where an invented scene is the one the archive most supports. I want to know whether that last case is the hard one or the easy one.

  Whose norms settle what a fitting depiction is: his, as a man of a particular time, class, and profession, who would have found some of this flattering and some of it unimaginable, or ours, now.

  The audience side, which I think is where the real weight is. The more a production signals research — real names, a credited consultant, photographs of the actual people under the titles — the more it borrows an epistemic authority it is not answerable to; and once it exists it overwrites the thinner and harder-to-reach archival memory, so that later audiences inherit the dramatization as their only access and cannot check it. I have started calling this the second death, but I cannot tell whether it is a genuine moral factor or a metaphor doing the work of an argument, and I would like that settled rather than assumed.

  The distinctions I am not sure are real: between being remembered falsely and being remembered as having done wrong; between damage to a reputation and damage to a memory; between the person who made himself public and the private man pulled into somebody else's story, which is what my father was.

  Remedies: a disclaimer, a based-on-real-events caption, an accompanying documentary, a right of reply deposited in the archive alongside the papers. Whether any of these discharge anything at all, or whether they only ever operate on the living.

  And the conflict structure: whatever is owed here has to be weighable against what the makers are owed by way of expressive freedom and against what audiences are owed by way of understanding, and I want to know whether that is a genuine three-way conflict or whether one of the three is not a moral consideration of the same kind.

  For each requirement, give me the case that motivates it and mark it as either non-negotiable or a preference of one temperament rather than another. Flag any pair you think cannot be jointly satisfied — my own suspicion is that respect for his anticipated wishes and fidelity to what the archive now supports pull apart, and that the duty to him and the epistemic duty to audiences pull apart — since if some subset is unsatisfiable that is itself the result I most need. Then, briefly, tell me which single requirement excludes the most of the things I keep hearing at the dinner table: that nothing can be owed because the dead are not harmed, that the estate's consent settles it, that artistic licence settles it, that only the famous are fair game, that truth is owed to the audience and never to the subject. Finally, say what would change the analysis if the dramatization were one among many rather than effectively the only record, and whether his being a minor figure in someone else's story, rather than its subject, should make his case easier or harder.
reasoning: |-
  Hmm, this is a deeply thoughtful and emotionally charged query about ethical responsibilities when dramatizing real people's lives, especially deceased individuals who can't defend themselves. The user is grappling with a family conflict over a TV series portrayal of their father, where historical inaccuracies might become the default public record due to archival restrictions.

  The core tension revolves around multiple asymmetries: the dead can't consent or correct errors, while living relatives have conflicting perspectives on what constitutes harm. The user has systematically outlined philosophical dilemmas - from the ontology of dramatized characters to audience epistemology - that would make any ethics professor proud. 

  What's striking is how they've framed this not as a personal grievance but as a forensic examination of moral obligations. The "second death" concept (replacement of historical memory by fiction) is particularly haunting. Their academic rigor contrasts with the raw family dynamics - the brother demanding scene cuts, the sister dismissing concerns as conflating person with reputation.

  Key insights emerge: First, the combination of archival inaccessibility and media reach creates unique ethical weight. Second, the distinction between reputational harm versus ontological violence to memory deserves more scholarly attention than it gets. Third, remedies like disclaimers may be psychologically palliative but epistemically hollow.

  The proposed framework wisely separates negotiable preferences from non-negotiable principles. Most commercial productions would balk at "non-negotiable" standards, but the user's archival context justifies this rigor. Their instinct about irreconcilable tensions between historical fidelity and contemporary storytelling norms seems painfully accurate.

  When addressing the dinner-table arguments, it's important to note how they all share one flaw: reducing complex moral agency to simple binaries (consent vs license, fame vs anonymity). The truth obligation to audiences actually amplifies - rather than negates - duties to subjects when fiction masquerades as history.

  The closing hypotheticals about multiple records versus single narratives are especially perceptive. Scarcity of information elevates ethical stakes exponentially, while being a minor character ironically makes distortion more ethically permissible - a counterintuitive but logically sound conclusion.
answer: |-
  Here is a structural analysis of the ethical demands in dramatizing the real dead, tailored to your specific case, marking non-negotiables and temperamental preferences, identifying conflicts, and isolating the strongest requirement against common arguments:

  **Core Requirements & Their Justification:**

  1.  **Non-Distortion of Core Character or Defining Actions (Non-Negotiable)**
      *   **Case:** The asymmetry (cannot correct/refuse/be compensated) creates a fundamental vulnerability. Misrepresenting *who he demonstrably was* at a core level (e.g., silencing his alarm-raising when he acted courageously) violates his identity and agency posthumously. It substitutes a fictional character for the real person in the historical record.
      *   **Marker:** Non-Negotiable. This is the bedrock duty to the person himself, preventing the "second death" of authentic identity.

  2.  **Avoiding Attributing Fictitious Harm/Culpability (Non-Negotiable)**
      *   **Case:** Closely linked to (1). Attributing words he didn't say that imply wrongdoing, or omitting actions that show responsibility (like raising the alarm), directly damages his reputation and memory in a way that constitutes a distinct wrong *to him*. The distinction between "falsely remembered" and "remembered as having done wrong" is ethically significant – the latter is active harm.
      *   **Marker:** Non-Negotiable. Preventing posthumous defamation or misattribution of blame is paramount.

  3.  **Epistemic Transparency to the Audience (Non-Negotiable)**
      *   **Case:** The borrowing of authority (real names, photos, consultant credit) creates an obligation not to mislead the audience about the nature of the truth-claims being made. When the dramatization becomes the primary record (due to sealed archives), this transparency is crucial for the audience's understanding and prevents the permanent overwriting of history. The "second death" *is* a genuine moral factor – the destruction of accessible truth.
      *   **Marker:** Non-Negotiabl. Audiences have a right to know the basis of the history presented to them, especially when archival access is blocked.

  4.  **Respect for Anticipated Sensibilities (Preference - Temperamental)**
      *   **Case:** Based on knowing him (e.g., what he would find flattering or unimaginable). This honors his personality and lived experience in a way abstract norms might not. However, it's subjective and may conflict with other duties (e.g., depicting uncomfortable truths he'd dislike).
      *   **Marker:** Preference. Important for familial respect and honoring the private man, but yielding to non-negotiables (1,2,3).

  5.  **Fidelity to Archival Spirit (Where Accessible) (Preference - Temperamental)**
      *   **Case:** Where the archive *supports* an invented scene capturing an essential truth (e.g., the marriage compression motivating a real professional decision), it can be ethically *easier* than pure fabrication, as it serves understanding. However, it's still invention. Pure fabrication unsupported by the record is harder to justify.
      *   **Marker:** Preference. Desirable for historical integrity but negotiable if core character (1) and harm (2) are preserved and transparency (3) is maintained.

  6.  **Provision of Effective Remedies for the Record (Non-Negotiable, but Scope Limited)**
      *   **Case:** Mere disclaimers are often insufficient against overwriting, especially if the drama is compelling. A *meaningful* right of reply deposited *in the archive* alongside his papers, accessible when the seal lifts, is crucial. It ensures the real voice isn't permanently silenced. Accompanying documentaries can help, but are separate works.
      *   **Marker:** Non-Negotiable for *archival counterpoint*. Other remedies (disclaimers, captions) are supplementary preferences.

  **Irreconcilable Conflicts (Your Suspicions Confirmed):**

  *   **Respect for Anticipated Sensibilities (4) vs. Fidelity to Archive (5):** He might have loathed the marriage scene compression for personal reasons, even if the archive supports its functional truth. You *must* choose which duty weighs heavier in that specific instance.
  *   **Duty to Him (1,2) vs. Epistemic Duty to Audiences (3):** Absolute fidelity to complex truth (demanded by 3) might require depicting nuances that feel like a violation of his privacy or anticipated sensibilities (4). While 1 & 2 are non-negotiable, *how* they are achieved might create tension with the *depth* of understanding owed to audiences under 3.

  **The Requirement Excluding Common Arguments:**
  **Non-Distortion of Core Character or Defining Actions (1) and Avoiding Attributing Fictitious Harm/Culpability (2)** collectively exclude the most dinner-table arguments:
  *   **"Dead can't be harmed":** Ignores the harm to identity, memory, and legacy inherent in core distortion or false blame.
  *   **"Estate's consent settles it":** Consent doesn't legitimize misrepresenting the *actual person's* core actions or character (1,2).
  *   **"Artistic license settles it":** License is bounded by duties to truth and persons, especially when claiming historical authority (3) and when distortion causes harm (1,2).
  *   **"Only famous are fair game":** Vulnerability stems from asymmetry and potential for overwriting, not fame. Your father's minor status makes the *overwriting risk* *greater* due to less counter-narrative.
  *   **"Truth owed only to audience, never subject":** Assumes the subject has no moral claim once dead, ignoring the duties arising from their vulnerability and the distinct harm of misrepresentation (1,2).

  **Impact of Changed Circumstances:**

  1.  **If Multiple Records Existed (Not Sole Record):**
      *   **Easier:** The "second death" risk diminishes significantly. The duty of Epistemic Transparency (3) remains crucial, but the *stakes* for absolute fidelity (1,2) and the need for archival remedies (6) lessen. Distortions are more correctable by audiences. The weight shifts slightly more towards expressive freedom and narrative effectiveness, though core duties (1,2) remain.

  2.  **His Status (Minor Figure vs. Subject):**
      *   **Mixed:**
          *   **Potentially Easier for *Some* Liberties:** Compression, composite figures, and timeline shifts affecting *him* specifically might be more tolerable *if* they don't violate (1) or (2), as he's not the central focus. The marriage compression *might* fall here *if* it doesn't fundamentally distort his character or motivations.
          *   **Potentially Harder for Epistemic Overwriting:** Precisely *because* he's minor, there's less likely to be other public records. The series is *more* likely to become the *only* accessible record *of him specifically*, amplifying the "second death" risk and making Transparency (3) and Archival Remedy (6) *more* critical. The asymmetry matters more due to obscurity.

  **Conclusion for Your Case:**
  The non-negotiables demand:
  1.  **Correcting the Silence:** The scene where he is silent instead of raising the alarm **must** be altered or contextualized to reflect his actual action. This violates core character (1) and risks false culpability (2).
  2.  **Audience Transparency:** The production **must** implement robust, unambiguous transparency about alterations (3), going beyond a tiny disclaimer (e.g., specific on-screen text for key altered scenes, detailed producer's statement).
  3.  **Archival Counterpoint:** Negotiate a legally binding right to deposit your factual correction/context (regarding the alarm and any other core distortions) **within his university archive**, accessible when the seal lifts (6).
  4.  **Evaluate the Line & Marriage Scene:** Does the invented line falsely imply culpability or distort his core views (violating 2)? Does the marriage compression fundamentally misrepresent his motivations or character in a harmful way (violating 1)? If yes, push for change. If not, it's more negotiable (temperamental preference 4 vs 5), though transparency (3) is still essential.

  Your strongest ground is the **inescapable vulnerability of the dead** combined with the **imminent overwriting of the historical record**, demanding protection of core identity and actions, prevention of false blame, and ensuring future audiences have a path to the truth. Focus the family conversation on these non-negotiables and the unique danger of the sealed archive. The expressive freedom of the makers and the audience's understanding are significant, but they cannot override the duty to prevent this specific, irreversible harm to your father's memory and legacy.
