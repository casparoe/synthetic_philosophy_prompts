      Option 2: Bet a fraction f=0.4 (the Kelly fraction for this bet? Let's compute the Kelly fraction: we want to maximize the expected log growth. The growth rate per bet is: 0.6 * log(1+2f) + 0.4 * log(1-f). We can compute that and find the f that maximizes it. For 60% win probability and 2:1 payoff, the Kelly fraction is (p*(b+1)-1)/b = (0.6*3 - 1)/2 = (1.8-1)/2 = 0.8/2 = 0.4. So f=0.4.

