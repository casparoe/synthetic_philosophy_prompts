      Correction: 
        - If you start with bankroll W and bet fraction f, then you are betting f*W.
        - If you win, you get 2 times the amount you bet as winnings (plus your stake back). So total return on the bet: 2*(f*W) (winnings) + f*W (stake) = 3f*W. But note, the part of the bankroll you didn't bet is (1-f)*W. So total bankroll after win: (1-f)*W + 3f*W = W*(1 + 2f).
        - If you lose, you lose the bet, so you only have (1-f)*W.

      So the multiplicative factors are:
        - Win: multiply by (1 + 2f)
        - Lose: multiply by (1 - f)

      But note: the payoff 2:1 sometimes is stated as "for every dollar you bet, you get $2 in winnings" (so total return $3). That's the case we have.

      Now, the expected value of the multiplicative factor per bet is: 
          0.6 * (1+2f) + 0.4 * (1-f) = 0.6 + 1.2f + 0.4 - 0.4f = 1 + 0.8f.

