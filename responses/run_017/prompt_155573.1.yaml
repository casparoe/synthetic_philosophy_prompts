          But note: the median of the product of independent random variables is not the exponential of the expected log. However, for large n, by the central limit theorem, the log of the bankroll is approximately normal, so the median is approximately the exponentiated mean log. So the median bankroll after 100 flips is approximately W0 * exp(100 * (0.6*log(1.8)+0.4*log(0.6))) = W0 * [ (1.8)^0.6 * (0.6)^0.4 ]^100.

