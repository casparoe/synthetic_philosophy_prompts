  ### Plan for Explaining Kelly Betting in 15 Minutes  
  **Audience:** Mixed group (non-math reporters, data-savvy colleague, arts writer, editor). Avoid notation, focus on intuition, and preempt misconceptions.  

  ---

  #### **Order and Core Example (5 minutes)**  
  **Start with your coin-flip example (60% heads, 2:1 payout, 100 flips):**  
  1. **Problem with maximizing expected value:**  
     - *Bet everything each time:*  
       - "Expected wealth grows 80% per flip! But if you lose *once* (40% chance per flip), you go bust. After 100 flips, you’re broke with near-certainty."  
       - *Why it fails:* Ignores ruin risk. Short-term gains mask long-term disaster.  
     - *Bet 40% (Kelly fraction) each time:*  
       - "Median wealth grows ~16% per flip. You never go broke. After 100 flips, you likely have more than you started."  
       - *Key contrast:* Expected value prioritizes improbable jackpots; Kelly prioritizes survival and typical outcomes.  

  2. **Why this example works:**  
     - **Must-haves:** Genuine multiplicative growth (wealth scales fractionally), repeated bets (100 flips), clear ruin risk.  
     - **Avoid:** Tidy numbers (e.g., avoid 50% win rate; 60% creates an "edge" to exploit).  
     - **Preempt "log" with intuition:** "Kelly optimizes for *typical growth* by ensuring losses don’t wipe you out. The math (logs) just measures this efficiently."  

  ---

  #### **Wrinkles: Real-World Complications (4 minutes)**  
  **Address *after* establishing the core idea:**  
  1. **Uncertain edge (you don’t know true odds):**  
     - "Suppose you *think* the coin is 60% heads, but it’s really 55%. Betting 40% (full Kelly) now causes *negative* growth—you lose money long-term. Why? Overbetting amplifies losses from bad estimates."  
     - **Solution:** "Bet half of Kelly (e.g., 20% here). Growth slows slightly, but you avoid blowups. Half-Kelly is robust, not timid."  

  2. **Absorbing floor + finite chances:**  
     - "What if dropping below $100 means you’re fired? Or you only get 10 flips, not 100?"  
     - "Kelly’s ‘log is free’ breaks here. You now care about *survival first*. Bet less than Kelly to avoid the floor. With finite bets, log utility isn’t enough—you need explicit risk preferences."  
     - **Why this undermines log’s specialness:** "Log optimizes infinite growth. With floors/finite bets, you switch from ‘maximize growth’ to ‘don’t get fired’. Kelly becomes a starting point, not the answer."  

  ---

  #### **Misconceptions: How and When to Correct (3 minutes)**  
  **Preempt these explicitly during the talk:**  
  1. **"Kelly maximizes expected money."**  
     - *Preempt early:* After showing the 40% vs. all-in comparison: "Kelly grows *typical* wealth, not *average* wealth. Averages lie when extremes exist."  
     - *Why:* The arts writer will sense this; the data guy might miss it without contrast.  

  2. **"Kelly can’t lose / beats the house."**  
     - *Preempt when introducing edge:* "Kelly only works if you have an edge (win >50% on fair bets). No edge? Kelly says *don’t bet*. It doesn’t change the game—it exploits your edge *sustainably*."  

  3. **"Bet more when payoff is bigger."**  
     - *Let someone suggest it, then correct:* "Big payouts tempt you to bet big, but Kelly says: *bet less* when payouts are huge. Why? Losing a huge bet crushes you. Example: 10:1 payout on a 15% win chance → Kelly says bet 5%."  

  4. **"Half-Kelly is for cowards."**  
     - *Preempt during the uncertainty wrinkle:* "Half-Kelly sacrifices ~25% growth for ~75% less volatility. In the real world (bad estimates), it often beats full Kelly."  

  5. **The big one: "Isn’t Kelly just log utility?"**  
     - *Address after wrinkles:* "Yes—but the magic is *why* log emerges. For repeated multiplicative bets, maximizing growth *forces* log utility on you. No philosophy needed. But add floors or uncertainty? Now you *choose* your risk tolerance."  

  ---

  #### **Closing (3 minutes)**  
  - **One question to test understanding:**  
    *"You’re offered: 70% win chance, 1:1 payout (double your bet if win). What fraction of your bankroll should you bet for long-term growth? What if you bet 60%?"*  
    - *Answer:* Kelly fraction = edge/payout = (0.7*1 - 0.3*1)/1 = 40%. Betting 60% is overkill; growth drops and ruin risk soars.  

  - **What to avoid:**  
    - Deriving the formula, ergodicity debates, stock-market applications.  
    - *Shut down with:* "This is a tool for repeated bets with known edges—not a get-rich scheme."  

  - **Editor’s one-sentence takeaway:**  
    **"Kelly betting: To grow wealth sustainably in repeated wagers, bet a fraction equal to (your edge) divided by (your profit if you win)."**  

  ---

  ### Why This Works  
  - **Flow:** Ruin risk → survival strategy → real-world adjustments → misconceptions.  
  - **Log delayed:** It appears as a "math hack" for growth, not a primitive.  
  - **Wrinkles deepen intuition:** They show Kelly isn’t dogma—it’s a foundation for practical tweaks.  
  - **Preempted misconceptions:** Correcting "expected value" early prevents derailment; saving "half-Kelly" for uncertainty ties it to a concrete need.  

  **Time check:** Example (5 min) → Wrinkles (4 min) → Misconceptions (3 min) → Q&A/takeaway (3 min).
