    - Then the question: "If the payoff was 1:1 (so you double your money on a win) and the win chance is 60%, what fraction would Kelly say to bet?" 
          (Answer: edge per dollar bet = 0.6*1 - 0.4*1 = $0.20, net winnings per dollar if win = $1, so fraction=0.20/1=20%.)
    - And then: "What if you bet 30%? Would that be better or worse than 20% for growth?" 
          (Answer: worse, because 20% is optimal. But if there's uncertainty, 30% might be too aggressive.)

