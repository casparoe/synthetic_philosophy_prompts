          We can compute the growth rate per flip: 
              geometric mean growth factor per flip = [ (1.8)^60 * (0.6)^40 ]^(1/100) = (1.8)^(0.6) * (0.6)^(0.4) ≈ 1.32 (so 32% growth per flip) but note: this is the median growth factor per flip? Actually, the median of the product is not the product of the medians? We are approximating the median by the typical outcome (60 wins, 40 losses). The actual median might be close.

