          But earlier I thought the expected growth rate (in log terms) was 14.84%? Actually, I computed 0.6*log(1.8)+0.4*log(0.6) = 0.6*ln(1.8) + 0.4*ln(0.6) (if we use natural log) ≈ 0.6*0.588=0.3528, 0.4*(-0.5108)= -0.2043, so 0.1485, which is 14.85%. Then the median growth factor per flip is exp(0.1485)≈1.16, so 16% per flip? 

          But note: the median outcome after 100 flips is W0 * (1.16)^100, and the expected value is much higher? Actually, the expected value of the bankroll after 100 flips is W0 * (1+0.8f)^100 = W0 * (1.32)^100 (since 1+0.8*0.4=1.32). So expected value grows by 32% per flip? 

          So we have:
            - Expected value per flip: 32% growth -> but note, this is the arithmetic mean of the multiplicative factor? Actually, the expected value of the bankroll after one flip is W0*(1+0.8f)=W0*1.32. After 100 flips, it's W0*(1.32)^100.
            - The median bankroll after 100 flips: grows by about 16% per flip (so W0*(1.16)^100).

          Why the difference? Because the distribution is skewed: there's a chance of a very high outcome that pulls the average up, but the median is the middle outcome.

          So the key takeaway: 
            - Maximizing expected value leads to huge expected wealth but with a high chance of going broke (in the all-in case) or having a median outcome that is much lower than the expected value (in the 40% case).
            - The Kelly criterion (betting 40%) gives a median outcome that grows at 16% per flip and avoids ruin.

      We can show a chart? Or just state: 
          - If you bet 40% each time, you never go broke (because you always have 60% of your bankroll left even if you lose) and over time your bankroll grows in a way that is more representative of what you actually experience.

      So we have set the stage: maximizing expected value can lead to ruin or to a median outcome that is much lower than the expected value. We want a strategy that does well in the long run and avoids ruin.

   2. **Introduce the idea of growth rate (without logs at first):**
      - We care about the typical outcome (the median) and avoiding ruin. The Kelly criterion maximizes the growth rate of your bankroll, which is the same as maximizing the median outcome in the long run.

      How do we compute the growth rate? The growth rate per bet is the logarithm of the multiplicative factor. Then the average growth rate over n bets is the average of these logs. Then the total bankroll is the exponentiated sum of the logs. So by maximizing the expected log, we maximize the exponentiated sum (in the long run, by the law of large numbers). 

      But we don't have to say "log" at first. We can say: 
          - We want to maximize the product of the factors by which our bankroll multiplies. How? By maximizing the sum of the logs of those factors. 

      Then we can write: 
          Growth rate = (1/n) * log( final_bankroll / initial_bankroll ) 
                     = (1/n) * [ log(factor1) + log(factor2) + ... + log(factorn) ]

      So to maximize the long-term growth rate, we maximize the expected value of the log of the factor per bet.

      Then we can write the Kelly fraction as the f that maximizes: 
          G(f) = p * log(1 + b*f) + (1-p) * log(1 - f)
      where in our example p=0.6, b=2 (because the payoff is b-to-1: you get b times your bet as profit if you win).

      Then we can compute the derivative and set to zero? But we don't want to derive. We can just state that for our example, the optimal f is (p*(b+1)-1)/b = (0.6*3 - 1)/2 = 0.4. But note: the formula for the Kelly fraction is f* = (p*(b+1) - 1)/b = (p*b + p - 1)/b. Alternatively, f* = (expected net gain per unit bet) / (net gain if you win) = (p*b - (1-p)) / b. But note: in our example, the expected net gain per unit bet is 0.6*2 - 0.4*1 = 1.2 - 0.4 = 0.8. Then divided by b (which is 2) gives 0.4.

      But we don't have to give the formula. We can say: the optimal fraction is proportional to your edge (how much better than fair the bet is) and inversely proportional to the payoff when you win (because if the payoff is big, you can bet less and still get the growth).

   3. **Wrinkles:**

      a) **Uncertain edge:** In real life, you don't know p and b exactly. You have an estimate. If you use the Kelly formula with an overestimate of your edge, you might bet too much and suffer. For example, if you think p=0.6 but it's really 0.55, then the Kelly fraction would be (0.55*3-1)/2= (1.65-1)/2=0.325. But if you bet 0.4 (as if p=0.6) then you are overbetting. Overbetting can lead to higher volatility and even negative growth. 

          We can show: with p=0.55, the true optimal f is 0.325. If you bet 0.4, then your expected log growth is less than if you bet 0.325, and it might even be negative? 

          Compute for p=0.55 and f=0.4:
            G(f) = 0.55 * log(1+2*0.4) + 0.45 * log(1-0.4)
                  = 0.55 * log(1.8) + 0.45 * log(0.6)
                  ≈ 0.55 * 0.588 + 0.45 * (-0.511) = 0.3234 - 0.22995 = 0.09345 (positive, but less than the maximum at f=0.325?).

          Actually, at f=0.325: 
            G(0.325) = 0.55 * log(1+2*0.325) + 0.45 * log(1-0.325)
                     = 0.55 * log(1.65) + 0.45 * log(0.675)
                     ≈ 0.55 * 0.5008 + 0.45 * (-0.393) = 0.27544 - 0.17685 = 0.09859, which is higher than 0.09345.

          But if you overbet even more, say f=0.8, then:
            G(0.8) = 0.55 * log(1+1.6) + 0.45 * log(1-0.8) 
                    = 0.55 * log(2.6) + 0.45 * log(0.2)
                    ≈ 0.55 * 0.9555 + 0.45 * (-1.6094) = 0.5255 - 0.72423 = -0.1987 (negative growth).

          So the lesson: if you are uncertain about your edge, it's often wise to bet less than the Kelly fraction (known as "fractional Kelly", like half Kelly).

      b) **Absorbing floor and finite chances:** 
          - Sometimes there is a floor: if your bankroll falls below a certain level, you are out of the game (e.g., you go bankrupt and cannot bet anymore). 
          - And the number of chances is not infinite: you might only get a finite number of opportunities.

          In this case, the Kelly criterion might be too aggressive because it doesn't account for the risk of hitting the floor. Even if the expected log growth is positive, if there's a chance of hitting zero (or the floor) and being out, you might want to bet less. 

          Example: if you start with $1000 and the floor is $100 (if you drop below $100, you're out), then betting the Kelly fraction might have a positive growth rate but also a chance of hitting $100 and being out. You might prefer a strategy that reduces that risk.

          Also, if the number of bets is small, the long-run growth rate maximization might not be the right goal. You might care more about the chance of reaching a certain goal. 

          So in these cases, the Kelly criterion is not necessarily optimal. You might need to use a utility function that explicitly models the risk of ruin or the finite horizon. The log utility is no longer "free" because the assumption of infinitely repeated multiplicative bets breaks down.

          However, note: the log utility function has the property that it is myopic (the optimal bet for one period is the same as for multiple periods) and it avoids ruin (because log goes to -infinity as wealth goes to 0). But when there's a floor above zero, then we need to adjust.

          So the takeaway: the Kelly criterion is derived for an idealized setting. In practice, with uncertainty about the edge and with constraints (like a floor or finite opportunities), we often use a fractional Kelly (bet less) to reduce the chance of ruin and to account for uncertainty.

   4. **Common misconceptions and how to handle them:**

      a) "Kelly maximizes your expected money." 
          - We already showed that maximizing expected value leads to a different strategy (betting everything) and that Kelly leads to a median outcome that is more representative. We can reiterate: Kelly maximizes the long-run growth rate (and the median outcome) but not the expected value.

      b) "Kelly means you can't lose / it's a system that beats the house."
          - Kelly doesn't change the odds. If the odds are against you (edge negative), then the Kelly fraction is negative (meaning you shouldn't bet, or bet on the other side if allowed). Kelly only tells you how to bet when you have an edge. And even with an edge, you can have long losing streaks. It doesn't guarantee you win every time.

      c) "Bet more when you're more confident" vs "bet more when the payoff is bigger"
          - The Kelly fraction depends on both. The edge is (p*b - (1-p)) and the fraction is edge divided by b. So if the payoff b is very large, you might bet less (because the denominator is large) even if you are confident (p high). Conversely, if b is small, you might need a very high p to bet at all.

      d) "Half Kelly is just being timid."
          - Actually, half Kelly (betting half the Kelly fraction) reduces the volatility of your bankroll and the risk of ruin. The growth rate is reduced, but not by half: it's about 3/4 of the Kelly growth rate. But the reduction in volatility is more than proportional. This is often a good trade-off, especially when there is uncertainty about the edge.

