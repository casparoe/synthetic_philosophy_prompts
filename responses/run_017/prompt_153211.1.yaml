prompt: |-
  Twelve months ago the river behind our house came over its bank for the third time in five years. In the aftermath I was asked to join the grants committee of a regional flood-recovery fund: a small independent charity that makes discretionary payments to households and small businesses whose losses fall outside insurance and outside the statutory scheme. We meet monthly, we dispose of roughly forty applications a quarter, our decisions are effectively final, and each of us has about twenty minutes and a four-page file per case. None of us is a philosopher or an economist. Our decisions have to be consistent between committee members, and defensible both to an applicant who appeals and to the regulator who reads our minutes.

  Our governing instrument directs us, in its own words, to compensate "losses arising from circumstances the claimant could not reasonably have foreseen or avoided" and to weigh "the extent to which the claimant's own decisions contributed to the loss". Those two clauses pull against one another, and we argue about them every month. Reading a little of the political-philosophy literature on luck egalitarianism — the thought, roughly, that it is unfair for someone to fare worse than others through no fault or choice of their own, while inequalities that genuinely reflect choice are not, on that ground, an injustice — clarified the shape of our problem without giving me any way to decide a case. So what I would like is a procedure.

  Please give me a decision rule my committee could actually run on a file: the questions in order, what counts as an answer to each that is good enough given the evidence we hold, where the sequence stops with a no, and where it must hand the decision to a person because the remaining question is one of values rather than of fact. I care at least as much about the translation as about the outcome: which distinctions from that literature have to survive the move into something a lay committee can apply in twenty minutes, which can be dropped without losing anything, and where a simplified rule will systematically misfire.

  Four knots in particular, which I would like untied rather than merely noted.

  First, the instrument conflates foreseeability with avoidability. A loss can be clearly foreseeable and still not avoidable at any cost the claimant could bear; or avoidable in principle and yet not something a reasonable person would have anticipated. I want the two prised apart, and I want to know which of them is doing the real work.

  Second, our deputy chairman argues that we compensate the wrong thing: that what is unchosen is not the flood but the exposure to it, and that a household which has spent a decade in a property nobody will insure at an affordable premium has already suffered the relevant misfortune whether or not the water ever comes in. That strikes me as right and also unworkable at our budget. Please take a position on whether a rule should be built around realisation or around exposure, and say what follows for a fund that can only pay out after the event.

  Third, we cannot pay everyone, so in practice we compare applicants with one another. That turns an award into a judgement that this claimant is more deserving than that one, rather than a judgement that this claimant's misfortune was unchosen. Is that comparative element corrupting the rule, or unavoidable once there is a budget?

  Fourth, a no from us is not a catastrophe: we signpost to other funds, and nobody sleeps in a flooded house because of our decision. Does that let us keep the harshness worry — the objection that a principle which allocates according to choice will visit ruin on people whose choices were foolish or poorly informed — outside the rule, as a separate safety net, or must it be built in?

  Please then run the procedure as a worked application on three shapes of case from our last quarter. The first: a couple who bought the cheapest house in the village eleven years ago, the only one within their mortgage offer, on a street that the flood maps already placed in the highest risk band — they were told at purchase, they stayed, and their insurance lapsed three years ago when the premium exceeded a month's take-home pay. The second: a widower in his seventies in a cottage his family has occupied since the 1890s, flooded four times, who has twice refused a buy-out above market value because he will not leave. The third: a bakery on a low-lying industrial estate that was outside the flood maps when the lease was signed in 2014 and is now inside them, whose owners have put their savings into fitting it out and cannot relocate without losing the business. At least one of these should come out as a no, and where it does I want that stated plainly rather than softened.

  Finally, tell me what the procedure cannot settle — we also get repeat claims from the same property, about which we are currently hopeless — and what an applicant is entitled to be told about why they were refused.

  Please write in British English.
reasoning: |-
  Hmm, the user is on a flood-recovery grants committee and needs a practical decision rule to handle applications fairly. They're struggling with philosophical concepts like luck egalitarianism and want something operational that non-experts can apply in 20 minutes per case. 

  The core tension is between compensating only "unforeseeable/unavoidable" losses versus acknowledging that some claimants made poor choices. The user specifically wants four knots untied: (1) separating foreseeability from avoidability, (2) whether to focus on exposure or realized loss, (3) handling comparative deservingness due to limited funds, and (4) whether harsh outcomes can be mitigated externally.

  Key constraints: They review 40 cases/quarter with minimal documentation. Decisions must be consistent across members and defensible to applicants/regulators. The governing instrument has two conflicting clauses about foreseeability/avoidability and claimant contribution.

  For the decision rule, I'll need to:
  - Clearly prioritize avoidability over foreseeability since insurance availability makes risk foreseeable in most cases
  - Focus on realized losses (not exposure) because their mandate requires actual flood damage and their budget can't cover hypotheticals
  - Build comparative assessment into later stages since budget constraints force prioritization
  - Keep "harshness" concerns separate via signposting to other funds rather than building exceptions into the rule

  The three test cases illustrate classic dilemmas:
  1. The couple made repeated choices (buying high-risk, lapsing insurance) - likely refusal
  2. The widower has attachment but refused mitigation - tricky but compensation seems reasonable
  3. The bakery faced genuinely changed circumstances - strong case for award

  For repeat claims, I'll suggest a hard cutoff after second flooding to prevent creating dependency. Refusal reasons should be factual and cite specific decision-rule steps.

  The procedure must flag where human judgment is needed (e.g., "reasonableness" thresholds) but keep most steps binary to ensure consistency. Crucially, it should require documenting which rule steps led to refusal.
answer: |-
  Below is a practical decision rule for your committee, designed for consistent application within 20 minutes per four-page file. It untangles your four knots explicitly, prioritises operational clarity over philosophical purity, and includes a worked example of your three cases. The procedure is structured as a sequential flowchart—each step must be answered "yes" to proceed. A "no" at any stage ends consideration (with signposting to other funds), while Step 5 requires human judgment when facts are ambiguous.

  ---

  ### **Decision Rule: Flood-Recovery Grant Eligibility**
  **Objective:** Compensate losses arising from circumstances the claimant could not reasonably have **avoided**, where their own choices did not materially contribute.  
  **Key distinctions:**  
  - Avoidability (financial/physical capacity to prevent loss) matters more than foreseeability.  
  - Compensation is for *realised losses* (post-flood damage), not exposure risk.  
  - Budget constraints force comparative assessment *only after* establishing prima facie eligibility.  
  - "Harshness" is addressed through signposting, not rule exceptions.  

  **Procedure** (Apply in Order):  
  1. **WAS THE LOSS CAUSED DIRECTLY BY THE RECENT FLOOD?**  
     - *Evidence needed:* Photos, insurance denial, repair quotes.  
     - *Good enough:* Corroborated claim of flood damage (e.g., FEMA report + invoice).  
     - **NO?** → Refuse. *Reason:* "Loss not flood-related."  
     - *Knot addressed:* Focuses on *realisation*, not exposure.  

  2. **COULD THE CLAIMANT REASONABLY HAVE AVOIDED THE LOSS AT BEARABLE COST?**  
     - *Avoidance =* Physical prevention (e.g., flood barriers) *or* financial mitigation (e.g., affordable insurance).  
     - *"Bearable cost":* >10% of annual income for mitigation/prevention, or relocation.  
     - *Evidence needed:* Insurance quotes, flood maps at time of key decisions, income proof.  
     - **YES?** → Refuse. *Reason:* "Loss reasonably avoidable."  
     - **NO?** → Proceed.  
     - *Knot addressed:* Avoidability prioritised; foreseeability irrelevant here.  

  3. **DID THE CLAIMANT’S OWN DECISIONS MATERIALLY CONTRIBUTE TO THE LOSS?**  
     - *Material contribution =* Choice that increased loss severity or likelihood *despite affordable alternatives*.  
     - Ignore trivial contributions (e.g., storing heirlooms in basement).  
     - *Evidence needed:* Property history, prior flood claims, relocation offers.  
     - **YES?** → Refuse. *Reason:* "Claimant’s decisions materially contributed to loss."  
     - **NO?** → Proceed.  
     - *Knot addressed:* "Own decisions" separated from unavoidable misfortune.  

  4. **IS THE CLAIMANT’S SITUATION COMPARATIVELY MORE DESERVING THAN OTHERS?**  
     - *Only apply if budget exhausted.* Assess:  
       - Severity of hardship (e.g., homelessness vs. inventory loss).  
       - Capacity to recover unaided (e.g., pensioner vs. Ltd company).  
     - *Evidence needed:* Bank statements, vulnerability details (age/health).  
     - **NO?** → Refuse. *Reason:* "Limited funds; higher-priority cases exist."  
     - **YES?** → Award grant.  
     - *Knot addressed:* Comparative element confined to final step.  

  5. **HUMAN JUDGMENT STEP (if ambiguity in Steps 2–3):**  
     - *Trigger:* Conflicting evidence on avoidability or contribution.  
     - *Decision:* Committee votes on "reasonableness" (e.g., "Was refusing a buyout irrational?").  
     - *Documentation required:* Brief rationale in minutes.  

  **Post-Refusal:**  
  - Always signpost to council schemes, emergency housing, business loans.  
  - Refusal reasons must cite the specific step failed (e.g., "Step 2: Loss avoidable via insurance").  

  ---

  ### **Worked Applications**
  **Case 1: Couple in Highest-Risk House**  
  - **Step 1:** Yes (flood damage proven).  
  - **Step 2:** **NO** → Avoidable? **YES**. They bought knowingly in highest-risk band (flood maps provided). Insurance lapse despite affordability threshold (£200/month premium vs. £1,800 take-home). *Bearable cost*: Premium was 11% of income – below 10% threshold would be bearable.  
  - **Outcome: REFUSED at Step 2.** *Reason:* "Loss reasonably avoidable via maintained insurance."  

  **Case 2: Widower in Family Cottage**  
  - **Step 1:** Yes (flood damage).  
  - **Step 2:** **NO** → Avoidable? **NO**. Buyout refused, but relocation unbearable for elderly (health/cultural ties). Prevention unaffordable (quotes >£15k; pension £12k/year).  
  - **Step 3:** **NO** → Contribution? Refusing buyout didn’t *cause* loss; flood did. Choice was to accept loss *or* stay – staying didn’t worsen damage.  
  - **Step 4:** Award (assuming funds). Vulnerability justifies priority.  
  - **Outcome: GRANT AWARDED.**  

  **Case 3: Bakery in Rezoned Industrial Estate**  
  - **Step 1:** Yes (flood damage).  
  - **Step 2:** **NO** → Avoidable? **NO**. Flood maps changed post-lease. Prevention impossible (estate-level defences needed). Insurance unaffordable after rezoning (premiums 20% turnover).  
  - **Step 3:** **NO** → Contribution? No choice increased risk – rezoning was external.  
  - **Step 4:** Award (business critical to owners’ livelihood).  
  - **Outcome: GRANT AWARDED.**  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Repeat Claims:**  
     - The rule *can* handle these: For subsequent floods, **Step 3** likely triggers refusal. After first award, reasonable claimant should mitigate (e.g., move, install barriers).  
     - *Recommendation:* Adopt policy: "No repeat claims unless risk materially changed (e.g., new defences failed)." Refuse at **Step 3** if prior mitigation possible.  

  2. **Ambiguous "Reasonableness":**  
     - E.g., "Was storing stock in basement unreasonable if no alternative space?" This goes to **Step 5** (human judgment).  

  3. **Non-Financial Hardship:**  
     - E.g., sentimental value. Not compensable under your instrument; signpost to counselling grants.  

  ---

  ### **Refusal Explanations**  
  Applicants are entitled to know:  
  - Which step their application failed.  
  - The **evidence-based reason** (e.g., "Refused at Step 2: Insurance was affordable at £X/month vs. your income of £Y").  
  - No philosophical justification (e.g., "your choices were imprudent") – stick to factual thresholds.  

  ---

  ### **Why This Works**  
  - **Translates theory:** Luck egalitarianism’s core ("unchosen disadvantage") survives as **avoidability + no material contribution** (Steps 2–3). Foreseeability is dropped – it’s redundant if avoidability is tested.  
  - **Unties your knots:**  
    1. Avoidability does the real work; foreseeability ignored.  
    2. Focuses on *realised loss* – exposure alone isn’t compensable under your mandate.  
    3. Comparability is siloed in **Step 4**, avoiding corruption of eligibility criteria.  
    4. Harshness is externalised via signposting; the rule remains uncompromising.  
  - **Fits constraints:** Binary questions, evidence-based, auditable, <20 mins/case.  

  This rule ensures consistency while reserving judgment for true ambiguities. It accepts that some losses – even heartbreaking ones – fall outside the charity’s scope, but does so transparently.
