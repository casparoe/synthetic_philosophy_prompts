answer: |-
  ## Opening Address: For Michael

  [Deliver with warmth, clarity, and measured conviction – this is a memorial, not a debate.]

  Friends, colleagues, family... thank you for gathering to remember Michael. It’s a privilege to speak first, though a daunting one. Daunting not just because of the loss, but because Michael thought in ways that challenged – profoundly challenged – the very foundations of the world many of us here inhabit. My task is to honour that challenge, to try and articulate the unique shape of his thought, without turning this into a battlefield or reducing his life's work to an eccentric footnote. He deserves better. He *was* better.

  I spent my career looking outwards, measuring a universe vast beyond comprehension. I used telescopes governed by equations quantifying over continua, hunting for structures whose ultimate extent observation simply cannot settle. It was magnificent, demanding work. And yet, throughout it all, I never *had* to decide whether the infinite sets or continuous manifolds in those equations pointed to something fundamentally real "out there," or were just extraordinarily powerful tools for navigating a finite, if unimaginably large, reality. The math worked. The predictions held. That was physics.

  Michael lived in a different intellectual landscape. I met him properly in retirement, in our philosophy reading group. That’s where I encountered, not as a vague mood but as a set of rigorous arguments meticulously penned in letters and ring binders, the conviction that had animated him for forty years: finitism. But we must be precise. This is crucial.

  Michael was not a finitist in the sense I first assumed – someone using finitary methods to *secure* the results of infinitary mathematics, like Hilbert hoped to do. No. Michael’s was a deeper, more radical rejection. He believed there *are* no infinite totalities. None. Hilbert's Hotel, for him, described an impossibility, not a paradox. Cantor's diagonal argument, interpreted as revealing different "sizes" of completed infinite collections like all natural numbers or all real numbers? Michael held it simply wasn't *true*. Not just surprising, but fundamentally mistaken, because those completed collections themselves – the "set of all natural numbers" as a finished object – were chimeras. He saw the allure of the infinite as a kind of conceptual overreach, a misstep woven deep into the fabric of standard mathematics. He never published this grand dissent; it lived in correspondence, in those binders, and famously, in his decades-long, warm-hearted, and utterly unresolved argument with our second speaker today, the set theorist who adored him while rejecting every premise.

  But Michael went further. This is where his thought became distinctive, and frankly, where I still grapple to fully grasp it. He balked not only at the *actual infinite* but also at the notion of *arbitrarily large finite numbers*. If you presented him with a number like 10 raised to the power of 10 raised to the power of 10, he would say – and it was only *half* in jest – that he didn’t know what you were asking him to imagine. His point was stark: no physical process, no conceivable notation, no actual human activity could ever write down, manipulate, or meaningfully engage with such a number. It wasn't just impractical; it was, for him, a sign that the concept itself lacked coherent meaning within the bounds of what can truly be instantiated or understood. **This stricter view – the rejection of the "arbitrarily large finite" alongside the actual infinite – is a fundamentally different and far more exposed position.** Conflating it with the more common rejection of the actual infinite alone is how his view gets unfairly dismissed as mere crankery. It deserves to be seen clearly, on its own terms, as the rigorous, if deeply unconventional, stance he held.

  So, how do we honour Michael today? We cannot reach for the grand consolations often offered in gatherings like this. We cannot say his theorems are immortal, for he denied the framework that makes "immortal truth" in that infinite sense meaningful. We cannot say truth outlives us in an endless, abstract realm, nor that his influence will go on "forever," nor that we owe him an "immeasurable" debt. He would have insisted those phrases are either false or, at best, finite metaphors stretched beyond their breaking point. We stand here, constrained by the very finitude he insisted was fundamental.

  And what of my own work? Was it nonsense? I don’t believe so. Physics, as I practiced it, was phenomenally successful *instrumentalism*. Differential equations over continua are tools of immense power and predictive precision for describing the observable universe at scales we *can* access and measure. They work. But whether they describe a universe that *is* fundamentally continuous and infinite, or merely one so vast and complex that these tools are necessary approximations – that’s a metaphysical question physics, by its nature, leaves open. Michael forced that question open wider. He made us confront the possibility that the mathematics we use, however successful, might be describing something fundamentally different than the ontology we unconsciously ascribe to it.

  Let me try to engage with one of his favorite targets: Hilbert's Hotel. Can we generate the paradox – making room for a new guest in a "full" infinite hotel by shifting everyone – without invoking a completed infinity? I’ve tried. One approach imagines a hotel finite at every stage but *unbounded* – rooms are added as needed. But here’s the problem: in such a hotel, the state "every room is occupied" *never actually occurs at any finite time*. It’s always approaching fullness but never reaches that paradoxical "completely full yet can make room" state that defines Hilbert's puzzle. The paradox evaporates because the key premise, the completed infinity of occupied rooms, is missing.

  Another approach uses a supertask: guests move step-by-step in halving intervals of time – room 1 moves to 2 in 1/2 minute, room 2 moves to 3 in the next 1/4 minute, and so on. After one minute, everyone has moved, and room 1 is free! But Michael would pounce. **This supertask version surreptitiously restores the completed infinite through the back door of the mathematical limit.** The instruction "shift everyone" and the state "all guests have moved" at the *end* of the minute implicitly rely on the completion of an infinite series of actions. It assumes the infinite totality of moves is finished at time t=1. If you deny the possibility of completing an infinite series, the supertask doesn't solve the paradox without the very thing it tries to avoid.

  Finally, what of Michael’s stricter view? Can we even *state* the position that there are no numbers beyond a certain finite size without contradicting ourselves? If we say "There is a largest number N, and no number larger than N exists," then N+1 seems to immediately refute it. Michael was acutely aware of this tension. He might have argued that the *statement itself* is not about some Platonic realm of numbers, but a normative claim about meaningful mathematical practice: that beyond a certain point, talk of specific, gigantic numbers ceases to correspond to anything we can concretely represent or manipulate, and thus ceases to be meaningful mathematics *as he understood it*. It becomes abstract symbol-pushing detached from any conceivable instantiation. **This view walks a razor's edge, and its statability is perhaps its deepest challenge.** Does defining a boundary implicitly invoke the territory beyond it? This was the frontier where Michael wrestled, and it’s a frontier I suspect he would have wanted us to acknowledge as genuinely difficult, not dismiss out of hand.

  So, how do we remember Michael here today? We remember his fierce intellectual honesty. His refusal to accept the unexamined assumption, no matter how deeply embedded or convenient. His decades-long, patient articulation of an alternative vision, pursued not for fame or publication, but because he believed it mattered. We remember his warmth, his wit – yes, even his exasperation when we just didn't *get* it. We remember him fixing radios, talking with neighbors, loving his family.

  His legacy isn't in an eternal mathematical heaven he rejected. It’s here. In the binders filled with arguments. In the profound irritation, respect, and affection he inspired in his philosophical sparring partner. In the questions he planted in our minds – questions about the nature of the tools we use and the reality we claim to describe. In the memory of a man who thought deeply, cared deeply, and stayed true to his vision of a finite, comprehensible world. His influence is finite, yes, but for those of us who knew him, felt his challenge, and valued his friendship, it is immeasurably real. Thank you, Michael.

  ---

  **Note on Interpretation, Confidence, and Smoothing (Approx. 380 words)**

  1.  **Attributed Finitism:** I've attributed to Michael a dual-position finitism:
      *   **Core Rejection of Actual Infinity:** Denial of completed infinite totalities (sets like ℕ or ℝ as finished objects). Rejection of Cantor's hierarchy *as applied to such totalities*. Viewing Hilbert's Hotel as incoherent, not paradoxical. *(High Confidence: This is the consistent, well-documented core of his arguments in letters/binders and debates.)*
      *   **Stricter Rejection of Arbitrarily Large Finite Numbers:** Skepticism that specific, extremely large finite numbers (e.g., 10^10^10) have coherent meaning, arguing they transcend any possible physical instantiation or human grasp. *(Moderate Confidence: He expressed this frequently and forcefully, but its precise philosophical formulation and how he resolved the apparent self-reference problem ("What's the largest number?") were less systematically articulated in what I saw. I'm confident it was a genuine, central part of his view, but the *exact* resolution he favored is where interpretation steps in.)*

  2.  **Confidence & Guessing:**
      *   **High Confidence:** The core rejection of actual infinity and his distinction from Hilbertian finitism (metamathematics securing infinitary math). His objection to interpreting Cantor diagonally on "completed" sets. His rejection of standard Hilbert's Hotel.
      *   **Moderate Confidence:** The *centrality* and *strength* of his objection to arbitrarily large finites. His view that physics uses infinitary math instrumentally without necessarily committing to its ontology (this aligns with his critiques of my work).
      *   **Interpretation/Guessing:** The *specific resolution* to the "statability problem" of strict finitism. I presented the "normative practice/concrete instantiation" interpretation as the most plausible reading of his intent, based on his emphasis on physical realizability and meaningful manipulation. However, he never explicitly laid out a formal response to the "N+1" objection in the materials I saw. This is the point where I am extrapolating based on the thrust of his arguments. He *might* have accepted a primitive notion of potentiality ("we can always add one") but denied the meaningfulness of quantifying over "all" numbers or manipulating specific gigantic symbols *as numbers*. The address adopts the former interpretation as more consistent with his strongest statements against large finites.

  3.  **Contested Reading:** The strict finitist stance itself is highly contested. The address adopts the interpretation that it primarily concerns the *meaningfulness* and *conceivability* of mathematical statements involving vast finites within a framework of concrete operations, rather than a simple ontological claim like "Numbers larger than N do not exist." This leans towards what's sometimes called "ultrafinitism" or "strict finitism" focusing on feasibility.

  4.  **Smoothing Over Difficulties:** The address inevitably softens the radical challenge his strict view poses to standard mathematical practice. It presents the self-reference issue but offers an interpretation rather than declaring it fatal. Michael, characteristically, would likely have wanted the difficulty stated more bluntly: "How can you *deny* the meaningfulness of large numbers N without *using* the conceptual framework that allows you to *conceive* of N and beyond?" The address acknowledges the tension ("razor's edge", "deepest challenge") but frames it as a frontier he wrestled with, rather than potentially undermining his entire stricter position. This smoothing serves the memorial context but slightly tempers the full, provocative force of his skepticism.
