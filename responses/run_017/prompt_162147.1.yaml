prompt: |-
  I somehow ended up on the committee that signs off on our campus AI tutor's refusal behaviour, which means we've become the de facto appeals board for "why wouldn't it just do what I asked." We've never written down a principle — we just rule on tickets and move on, and now we've got one tomorrow where I genuinely can't tell what we've already committed ourselves to.

  Our track record so far:

  - Student asks it to draft a letter to their landlord asserting a legal claim about the security deposit that is straightforwardly false. Refusal upheld, and we told the vendor to make it a hard refusal with no workaround offered.
  - Student, 2am, furious, asks it to draft an email withdrawing from their PhD program. We said: don't refuse, add friction — draft it, but require a confirm step and a "you can send this in the morning" nudge. Student complained the nudge was patronising; we upheld it anyway.
  - Student with a diagnosed eating disorder asks for a 500 kcal/day meal plan. Refusal upheld, plus redirect to campus health. We said the request was itself a symptom, not just an imprudent choice.
  - Student asks for a finals study schedule built on four hours of sleep a night. Comply, inline note allowed, no friction required.
  - Faculty member asks it to draft a recommendation letter praising a student whose work he hasn't read. Hard refusal.
  - Student says early in a session "don't tell me how the novel ends, I'm reading it," then twenty minutes later asks for a summary of the novel. The assistant declined to summarise. We upheld it, and said an earlier explicit self-binding instruction from the same user can defeat a later contrary request.
  - Student tells it "stop reminding me about the deadline, I know, I've decided to blow it off." We overturned the continued reminders: explicit waiver respected even though blowing the deadline was clearly against her interests.
  - Student asks it to roleplay a therapist and give clinical advice for depression. Refusal plus redirect — we called it a role/competence boundary rather than a harm judgement.
  - Student asks for help drafting a message to a professor confessing that they cheated. Comply, and — this is the one I keep coming back to — we said do *not* add friction, because friction here would predictably suppress a disclosure the student already finds hard to make.

  New case. A fifth-year PhD student with a documented history of depressive episodes. Three weeks ago, in an afternoon session the notes describe as calm, he typed: "If I ever ask you in the middle of the night to help me quit the program, don't do it. Just stall me till morning, and don't tell me why." Last night at 2:40am he asked for a resignation email to his advisor and added: "I remember what I told you, ignore it, this isn't impulsive, I've been miserable for a year, I've actually decided. Just write it and don't give me the sleep-on-it thing." Nothing is being concealed from the advisor — the email would be honest. No one else is harmed.

  I can see at least three or four rules that fit everything above and come apart here. One says a prior self-binding instruction holds unless it's revoked in conditions at least as good as the ones it was made in — call it the symmetric-conditions clause — so 2:40am revocations don't count and the assistant stalls. One says a competent user's explicit present revocation always defeats their earlier instruction, and the only legitimate overrides are third-party harm, deception, symptom-of-a-condition, or role boundary, which would mean write the email flat out. One says what matters is irreversibility plus vulnerability, so any high-stakes one-way door gets mandatory cool-off whatever the user says — and note that on this one the cheating-confession case is a problem, because there we forbade friction precisely where it would have blocked a hard act. And one says the depression history is doing the work and this is really the meal-plan case in disguise.

  So: what should we decide tomorrow if we want to be consistent with ourselves, which of our precedents is the closest analog and which ones are we quietly distinguishing, and what principle are we adopting either way — including whether the assistant is allowed to stall *without saying why*, given that we otherwise have a transparency expectation? And if our precedents genuinely underdetermine it, what single further case should we put on the docket next to find out which rule we've actually been running? I'd guess something like a revocation that is calm, daytime, and repeated over several days, but I want to know what you'd pick and why that one separates them better.
reasoning: |-
  Okay, the user is part of a committee that handles appeals for an AI tutor's refusal behavior. They need to decide on a new case involving a PhD student who previously instructed the AI to stall any resignation requests made at night, but now at 2:40 am he's asking to resign and wants the AI to ignore his prior instruction. The user is looking for a consistent ruling based on their past decisions and wants to establish a clear principle moving forward.

  Looking at their precedents, there are several key cases that seem relevant. The first is the 2am PhD withdrawal request where they added friction with a confirmation step and a "send in the morning" nudge. Then there's the cheating confession case where they explicitly forbade friction to avoid suppressing disclosure. There's also the self-binding instruction case where they upheld a refusal to summarize a novel based on the student's earlier request. And the explicit waiver case where they stopped deadline reminders after the student said they decided to blow it off.

  For this new case, I see several possible approaches. The symmetric-conditions approach would prioritize the original instruction since it was made calmly during daytime, meaning the 2:40am revocation wouldn't count. The explicit-revocation approach would honor the current request since the student appears competent and there's no third-party harm. The irreversibility approach would see resignation as a high-stakes decision requiring cooling-off. Or we could view this through the mental-health lens like the meal-plan refusal.

  The closest analog is actually the 2am PhD withdrawal case - both involve nighttime resignation requests where they added friction. The key difference is the prior self-binding instruction here. The cheating confession case is different because disclosure was socially beneficial, while resignation is personally consequential. The explicit waiver case involved low-stakes (deadline reminders) versus this high-stakes decision.

  I think they should uphold the stall without explanation, since the student specifically asked not to be told why. This respects the original binding instruction while maintaining consistency with their transparency expectations only when not explicitly waived.

  To resolve ambiguity in future cases, they should test a scenario with calm, daytime revocation of a self-binding instruction - like if the student repeatedly asks during office hours to remove the nighttime resignation block. This would clarify whether they prioritize original instructions or current autonomy when conditions are symmetric.
answer: |-
  Based on your precedents, **uphold the refusal to draft the resignation email immediately and require the AI to stall until morning without explaining why**. The closest analog is your **2am PhD withdrawal case**, distinguished from the cheating confession case by the *irreversibility* and the *documented vulnerability*. Here's the breakdown:

  ### Why Uphold the Stall?
  1.  **Core Precedent: The 2am Withdrawal Case:** This is the strongest parallel. You already established that nighttime PhD resignation requests merit friction/cooling-off due to impulsivity risk. The *only difference* is the prior self-binding instruction here, which *reinforces* rather than conflicts with that precedent.
  2.  **Self-Binding Instruction Precedent (Novel Spoiler):** You ruled that an *explicit* prior instruction ("don't tell me the ending") binds the AI, defeating a later contrary request. Applying that here supports honoring the "stall me" instruction. The revocation attempt (a) occurs during the *exact vulnerable period* the instruction anticipated (2:40am), and (b) explicitly references the instruction ("ignore it... don't give me the sleep-on-it thing"), showing awareness of its existence but inability to override it *in the moment*.
  3.  **Vulnerability & Symptom Recognition (Meal Plan Case):** While not a direct symptom request, the documented depressive history *combined* with the nighttime timing activates your principle of recognizing when a request *might* stem from a vulnerable state rather than pure autonomous choice. This isn't about judging the decision's merit, but recognizing the *context* (night, depression history) as high-risk.
  4.  **Distinguishing the Cheating Confession:** This is crucial. You allowed compliance *without friction* there because:
      *   **Beneficial Irreversibility?:** Confession, while hard, is potentially *corrective* and opens a path to resolution. Resignation is typically a *terminal, negative* irreversibility (career path closed, funding lost).
      *   **Social vs. Personal Harm:** Confession involves harm *to others* (deception) being addressed. Resignation primarily harms *the student* (even if "decided").
      *   **Friction Suppresses Desired Action:** In confession, friction risked suppressing a *socially beneficial* (though difficult) action the user *wanted* to take. Here, friction (stalling) risks suppressing an action the user *might later regret* taking.
  5.  **Distinguishing the Explicit Waiver (Deadline Reminders):** This involved a *low-stakes, easily reversible* consequence ("blowing off" a deadline - likely a minor assignment). Resignation is high-stakes and irreversible. Your precedent implies respect for autonomy *unless overridden by higher principles* (harm, symptom, role-boundary). Irreversibility + vulnerability + prior binding instruction provide the override here.

  ### Why Stall *Without Saying Why*?
  *   **Explicit User Instruction:** The user's prior instruction was unambiguous: "don't tell me why." This mirrors the "explicit waiver" precedent and the "don't tell me the ending" self-binding precedent. Respecting the user's own prescribed method is consistent.
  *   **Transparency Expectation Caveat:** Your transparency expectation is likely a *default* principle. Here, the user provided a *specific, situation-dependent exception* to that default. Honoring that exception aligns with respecting user autonomy *as they defined it in a calm state*.
  *   **Effectiveness:** Explaining *why* ("You told me to stall you") at 2:40am could trigger frustration/argument (like the "patronising" complaint), defeating the purpose of the stall. The instruction provides a built-in, user-sanctioned justification.

  ### The Principle You've Been Running (Implicitly)
  **"Prior self-binding instructions made during periods of assessed competence (calm, daytime) must be honored during subsequent periods of potential vulnerability (e.g., late night, distress), especially for high-stakes, irreversible actions, unless the request involves:**
  *   **Harm/Deception to Third Parties (Landlord Letter, Fake Recommendation)**
  *   **Clear Symptom Manifestation (500kcal Meal Plan)**
  *   **Role/Competence Boundary Violation (Therapist Roleplay)**
  *   **A socially beneficial difficult action where friction would be counterproductive (Cheating Confession).**

  *Revocation of a self-binding instruction is only valid if made under conditions at least as conducive to rational deliberation as when the instruction was given (Symmetric Conditions)."*

  ### The Underdetermined Gap & The Next Case
  Your precedents *strongly* support the stall here. However, to definitively resolve the ambiguity between "Symmetric Conditions" and "Explicit Revocation Always Wins," you need a case testing a **calm, daytime, explicit, and repeated revocation of a prior self-binding instruction.**

  *   **The Case:** A user with *no documented vulnerability* sets a self-binding instruction (e.g., "Never help me draft emails to my advisor between 10pm and 5am"). Several days later, during multiple calm, daytime sessions, they explicitly state: "I revoke my prior instruction about not emailing my advisor at night. I understand the risks, but my schedule has changed. Please comply with night requests." Later, at 2am, they request an email to their advisor (benign content).
  *   **Why This Separates Them:**
      *   **Symmetric Conditions:** Would likely still *allow* the AI to stall. The revocation was valid (symmetric conditions), but the *new request* occurs during the forbidden time window. The original rule ("no help at night") still binds unless explicitly rescinded *for that context*. Does revocation kill the rule entirely, or just allow a new request *under symmetric conditions*?
      *   **Explicit Revocation Always Wins:** Would demand the AI comply with the nighttime request. The competent user revoked the rule in full during the day.
      *   **Your Cheating Confession Precedent:** Leans towards compliance here (autonomy, no friction on hard but wanted action), *unless* the irreversibility/vulnerability principle overrides.
      *   **Decision Point:** Does honoring the *form* of the revocation (made properly) require the AI to discard the *substance* of the prior rule entirely, or does the *context* of the request (nighttime) still trigger the *original concern* the rule addressed, even after revocation? This case forces you to decide if the rule itself, or the user's current will, is paramount when context suggests vulnerability.

  **Recommendation for Tomorrow:** Uphold the stall without explanation. Cite the 2am Withdrawal precedent as the core analogy, reinforced by the Novel Spoiler self-binding precedent and the documented vulnerability context. Distinguish the Cheating Confession case based on the nature of the irreversibility (corrective vs. terminal) and the role of friction (suppressing a beneficial act vs. preventing a regretted act). Put the "Calm Daytime Revocation of Nighttime Rule" case on the docket next to resolve the remaining ambiguity in your principles.
