   Alternatively, if we want to include the pool, we can try a simpler pool approach that doesn't involve birth ranks:

     In the second round, we tell each student that they are either in group A or group B. We say that group A is the actual population and group B is the fixed bloc. For students in group B, their birth rank gives them no information because the fixed bloc is the same in both hypotheses. So they should revert to the prior. For students in group A, they should use the birth rank as before.

     But then we have to assign group A and group B. We can do this: the actual population under both hypotheses is the students who received a number >10. The fixed bloc is the students who received a number<=10. But then under H_small, the actual population is birth ranks 11-20, and under H_large, birth ranks 11-30. So if a student has a number<=10, they are in the fixed bloc. If they have a number>10, they are in the actual population.

     Then in the second round, we tell each student which group they are in.

     For a student in the fixed bloc (number<=10), we tell them: "You are in the fixed bloc. This means your birth rank gives no information about the hypothesis because the fixed bloc is present and the same in both. Therefore, you should reset your belief to the prior."

     For a student in the actual population (number>10), we tell them: "You are in the actual population. This means your birth rank is within the actual population, and you should use the relative birth rank within the actual population. Your relative birth rank is your absolute birth rank minus 10."

     Then the likelihood for the relative birth rank r for a student in the actual population:
          under H_small: P(r) = 1/10, for r in [1,10] (because the actual population has size 10)
          under H_large: P(r) = 1/20, for r in [1,20]

     wait, because under H_small, the actual population has only 10 individuals (ranks 11-20), so relative ranks 1 to 10.
     under H_large, the actual population has 20 individuals (ranks 11-30), so relative ranks 1 to 20.

     So if a student has a relative rank r:
          if r <=10: 
              P(r|H_small) = 1/10
              P(r|H_large) = 1/20
              LR = (1/10) / (1/20) = 2 -> favors H_small.
          if r >10: 
              P(r|H_small) = 0
              P(r|H_large) = 1/20
              LR = 0 -> favors H_large.

     So in this setup, the student in the actual population and with relative rank>10 knows H_large is true.

     The student in the actual population with relative rank<=10 updates with LR=2 toward H_small.

     The student in the fixed bloc resets to the prior.

     Then they re-bet.

     In the first round, a student with birth rank x<=10 (fixed bloc) had updated with LR=1.5 toward H_small.
     In the second round, when told they are in the fixed bloc, they reset to the prior. So they go from LR=1.5 back to 1.

     This might be a bit confusing, but it's doable.

     The point is to see that the fixed bloc students should wash out their birth rank.

     For the actual population, the birth rank (absolute) in the first round had LR=1.5 for any birth rank in 11-20, but in the second round, when told they are in the actual population, they use the relative birth rank and get either LR=2 or LR=infinity.

     So the two-stage update might not be multiplicative because the conditioning is different.

   Given time, I will describe the game with both rounds.

   Materials for the second approach with M=10, N_small=10, N_large=20:

     - Two bags:
          H_small bag: balls numbered 1 to 20.
          H_large bag: balls numbered 1 to 30.

     - But note: we want the fixed bloc to be birth ranks 1-10 and the actual population to be 11-20 (in H_small) and 11-30 (in H_large).

     - When we draw a ball, the number is the birth rank.

     - The true hypothesis is chosen by coin flip.

     - Draw 18 balls without replacement.

     - The two special students are given birth rank 1 and 2. (So they are in the fixed bloc.)

     - Hand out the numbers.

     - First betting round: students compute their posterior.

     - Then hand out the pool note: 
          If the birth rank <=10, the note says: "You are in the fixed bloc. The fixed bloc is present in both hypotheses and has the same size. Therefore, your birth rank gives no information about the hypothesis. You should use the prior probabilities."
          If the birth rank >10, the note says: "You are in the actual population. Your birth rank within the actual population is (x-10). The actual population under H_small has size 10, and under H_large has size 20."

     - Then they re-bet.

     - We reveal the true hypothesis and score both rounds.

     - The scoring rule is the same for both rounds.

     - For the two special students, they are in the fixed bloc, so in the second round they reset to the prior.

     - For students in the actual population with birth rank >20, they know in the first round that H_small is impossible (because birth rank>20 cannot happen under H_small). In the second round, they are in the actual population and their relative birth rank is (x-10), which is >10, so they also know H_small is impossible.

     - For students in the actual population with birth rank in [11,20], in the first round they had birth rank x in [11,20] which is possible under both, with LR=1.5 toward H_small. In the second round, they are told their relative birth rank is r = x-10, which is in [1,10]. Then they update with LR=2 toward H_small. So overall, they might do 1.5 * 2 = 3 toward H_small.

     - For students in the fixed bloc (birth rank<=10), in the first round they had LR=1.5 toward H_small. In the second round, they are told to reset to the prior (LR=1.0). So they should go back to 0.5.

     - This is a bit of a letdown for the fixed bloc students: they had evidence for H_small, then they are told to ignore it.

     - The instructor should then discuss the reference class problem: should they condition on being in the fixed bloc? Why? Because the fixed bloc is a reference class that is not affected by the hypothesis.

     - In the doomsday argument, the reference class might be all humans, or all conscious beings, etc.

     - The two special students, even though they are in the fixed bloc, are also told that they are the first two and couldn't have been later. Does that change anything? In the first round, they have birth rank 1 and 2, which is<=10, so they are in the fixed bloc. In the second round, they reset to the prior. But should they? The condition of being first might be extra information. We can discuss.

   Given the complexity, I will provide the full game with the following parameters:

     M = 10
     N_small = 10
     N_large = 20
     Total under H_small = 20
     Total under H_large = 30

     We have 18 students.

     The birth ranks are drawn without replacement from the true total.

     The fixed bloc is ranks 1-10.

     The actual population is ranks 11-20 under H_small, and 11-30 under H_large.

     The two special students get ranks 1 and 2.

     The remaining 16 ranks are drawn from the remaining ranks.

     We will have two betting rounds.

     We will use the quadratic scoring rule with individual and group components.

     The group score is the average of the individual scores for the true hypothesis.

     Total score for a student in a round = individual score + group score.

     We do this for both rounds, so they have two scores.

     The true hypothesis is revealed at the end.

     Then debrief.

   What will predictably go wrong:

     - In the first round, students who receive a birth rank >20 will know immediately that H_small is false. They will assign P(H_small)=0. In the second round, they will still know.

     - Students in the fixed bloc (ranks<=10) will have a mild evidence for H_small (LR=1.5) in the first round. In the second round, they are told to reset to the prior. Some might not want to reset because they think their birth rank is still evidence. They might not understand that conditioning on being in the fixed bloc means that the birth rank is uninformative.

     - Students in the actual population with birth rank in [11,20] will have stronger evidence in the second round (LR=2) and might become very sure of H_small, but we might have about half the class knowing it's H_large (those with birth rank>20).

     - The two special students might not reset and might think that being the first is special even in the fixed bloc.

     - The group score might encourage students to not assign 0 or 1, but those with birth rank>20 will have to assign 0 to H_small, which will hurt the group score if H_small is true. But if H_small is true, then no birth rank>20 can occur, so it's not a problem. If H_large is true, then students with birth rank>20 will have to assign P(H_small)=0, and that is correct, so it will not hurt the group score.

     - The group score is an average of the individual scores for the true hypothesis. If H_large is true and a student assigns P(H_small)=0, then their individual score is 10*(1-0^2)=10, and they contribute 10 to the group average. If they had assigned a positive probability, they would contribute less. So they are not penalized for being sure when they are right.

     - The group score is there to encourage students to not assign 0 to the true hypothesis. If they assign 0 to the true hypothesis, their individual score is 0 and they also bring the group average down.

     - In this setup, if a student has birth rank>20, they know H_small is false, so they assign P(H_small)=0. If the true hypothesis is H_large, that's fine. But if the true hypothesis is H_small, then no birth rank>20 can occur, so it doesn't happen.

     - Therefore, the only risk is if a student makes a calculation error and assigns P(H_small)=0 even though their birth rank is<=20 and the true hypothesis is H_small. But that would be a mistake.

     - The group score might encourage students to not be too extreme unless they are sure.

   Timeline for the game:

     - 5 min: Explain the setup: two hypotheses about the total number of individuals. H_small: total=20, H_large: total=30. Prior: 50%. 
          - Among these, there is a fixed bloc of 10 individuals (birth ranks 1-10) that are present in both hypotheses.
          - The actual population is 10 under H_small and 20 under H_large, with birth ranks 11-20 and 11-30 respectively.
          - We are drawing 18 birth ranks without replacement.
          - Two students will be given ranks 1 and 2 (the first two).
          - Each student will receive a birth rank.
          - There will be two betting rounds.

     - 5 min: Flip a coin to choose the true hypothesis (secretly). Draw 18 birth ranks without replacement from the appropriate set (1-20 for H_small, 1-30 for H_large). Hand out the numbers.

     - 10 min: First betting round. Each student calculates their posterior probability of H_small given their birth rank. They write it on a paper.

     - 5 min: Collect the first-round probabilities. Compute the individual scores for the true hypothesis (but don't reveal) and the group average for the true hypothesis (but don't reveal). Record.

     - 10 min: Hand out the pool note. For students with birth rank<=10, the note says they are in the fixed bloc and should reset to the prior. For students with birth rank>10, the note says they are in the actual population and their birth rank within the actual population is (x-10), and they should update based on that.

     - 10 min: Second betting round. They calculate again and write their posterior.

     - 5 min: Collect the second-round probabilities. Compute scores.

     - 5 min: Reveal the true hypothesis and scores.

     - 25 min: Debrief.

   The debrief should cover:

     - The move from a random position to a conclusion about total size: In the first round, seeing a birth rank that is high (e.g., 25) immediately suggests a large total size. Seeing a birth rank in the middle might give a likelihood ratio that depends on the total sizes.

     - The choice between treating your own position as a random sample and giving extra prior weight to hypotheses containing more observers: In the first round, the update is based on treating the birth rank as a random sample. The doomsday argument uses this to reason that if we are at a random birth rank, then we are likely in the middle of the distribution, so if our birth rank is n, the total is likely about 2n. Here, if a student has birth rank 15, then under H_small (total=20) that is not very late, but under H_large (total=30) it is early. So it favors H_small.

     - The reference-class problem: In the second round, we conditioned on being in the fixed bloc or the actual population. For the fixed bloc, the birth rank is uninformative. For the actual population, it is informative. This is like choosing to condition on being a human or being a conscious being. The doomsday argument's force depends on the reference class.

     - The worry that you could not have found yourself not existing: The two special students (ranks 1 and 2) are told they are the first and could not have been later. Does that change anything? In the game, they are in the fixed bloc and in the second round they reset to the prior. But if they are the first, then under H_small, the total is 20, and under H_large, 30. Does being first give them less reason to expect a large total? In the doomsday argument, if you are among the earliest humans, does that suggest that there won't be many more? In the game, we can see that the birth rank of 1 or 2 is more likely under H_small (because it's more likely to be early in a small population) but in our numbers, the likelihood ratio for birth rank<=10 is 1.5 for H_small, so it does give evidence for a smaller population. The condition that they are the first might be additional information that they are not in the middle. But in the game, birth rank 1 and 2 are still within the fixed bloc, which washes out in the second round.

     - What the game cannot stage: In the real doomsday argument, the birth rank is not the only information. We also know about the current date and the state of technology, which might give us information about the future. The game abstracts away from that. Also, the reference class problem is not resolved.

     - Additionally, in the real argument, we are not handed a birth rank; we have to estimate it. And the two hypotheses are about the future of humanity, which is emotionally charged.

     - The game uses a scaled-down population and a fixed bloc to illustrate the reference class problem.

   This is a complex game, but it should be runnable in 75 minutes.
answer: |-
  Below is a complete, runnable classroom game designed to implicitly convey the doomsday argument through experiential learning. It uses a scaled-down surrogate population, avoids real-world references, and incorporates your requirements for ambiguity, two-pool mechanics, special "early" students, and group- incentivized scoring. 

  ---

  ### **Game Setup: "The Observation Game"**
  **Core Idea:**  
  Students receive private "observation numbers" from a hidden population. They bet on whether the population is small (100) or large (160), then learn if their number came from an "immutable core" (present in both populations) or the "variable pool" (size depends on the hypothesis). This models reference-class dependence and the doomsday logic without explicit references.  

  **Hypotheses & Prior (Announced to Class):**  
  - **H_small**: Total population = 100  
  - **H_large**: Total population = 160  
  - Prior: 50% each (fair coin flip by instructor).  

  **Why these numbers?**  
  - A typical observation (e.g., 80) is plausible under both hypotheses (80 ≤ 100 and 80 ≤ 160).  
  - Ensures ambiguity: No student receives a number >100 under H_small (impossible), but under H_large, numbers 101–160 are possible and diagnostic.  
  - **Design note:** Honest uniform draws *can* deliver ambiguity here. We avoid flattening the likelihood ratio by ensuring mid-range numbers (e.g., 50–100) shift probability moderately:  
    - *Example:* For observation `x=80`:  
      - `P(x|H_small) = 1/100`  
      - `P(x|H_large) = 1/160`  
      - Likelihood ratio = `(1/100)/(1/160) = 1.6` (favors H_small).  

  **Materials:**  
  - 1 coin (instructor uses to pick true hypothesis secretly).  
  - 18 sealed envelopes for students: Each contains:  
    - **Note 1 (Observation):** A unique random number between 1 and the true population size.  
    - **Note 2 (Pool):** Sealed, to be opened later. Says either:  
      - *"Your number came from the VARIABLE POOL (size = 100 if H_small, 160 if H_large). Your observation is INFORMATIVE."*  
      - *"Your number came from the IMMUTABLE CORE (size = 60, present in both). Your observation is UNINFORMATIVE."*  
  - 2 special envelopes for "early" students: Numbers 1 and 2 + note: *"You are in the first 2 positions. You could not have been later."*  
  - Scoreboard for probabilities.  

  **Pool Sizes (Fixed for Ambiguity):**  
  - **Immutable Core:** 60 entities (present in both populations).  
  - **Variable Pool:** Size depends on hypothesis:  
    - H_small: 100 total = 40 (variable) + 60 (core)  
    - H_large: 160 total = 100 (variable) + 60 (core)  
  - **Observation numbers:** Drawn uniformly from 1 to the true total. Core occupies numbers 1–60; variable pool occupies 61+ (H_small: 61–100; H_large: 61–160).  

  **Why this works:**  
  - Core students (numbers 1–60) have identical likelihoods under both hypotheses (`1/100` vs. `1/160` → likelihood ratio ≈1). Their evidence "washes out."  
  - Variable students (numbers 61–160) have diagnostic numbers:  
    - If H_large is true, numbers 101–160 are *only possible under H_large* (ruling out H_small).  
    - Numbers 61–100 are ambiguous (likelihood ratio = 1.6 for H_small).  

  ---

  ### **Rules & Timeline (75 min total)**  
  **0. Setup (5 min)**  
  - Explain hypotheses (H_small: pop=100, H_large: pop=160), prior (50%), and rules.  
  - Assign 2 "early" students (get numbers 1 and 2).  
  - Distribute 16 sealed envelopes to other students.  

  **1. Draw Numbers (5 min)**  
  - Instructor flips coin: Heads → H_small, Tails → H_large (keep secret).  
  - Generate numbers:  
    - **H_small:** Draw 16 distinct random numbers from 1–100, excluding 1 and 2 (assigned to "early" students).  
    - **H_large:** Draw 16 distinct random numbers from 1–160, excluding 1 and 2.  
  - Place numbers in envelopes. Students open **Note 1 (Observation)** only.  

  **2. First Betting Round (10 min)**  
  - Each student calculates posterior probability of H_small given their number.  
    - *Formula:* `P(H_small | x) = [P(x|H_small) * 0.5] / [P(x|H_small)*0.5 + P(x|H_large)*0.5]`  
    - `P(x|H) = 1/(size of H)` if `x` ≤ size, else `0`.  
    - *Example (x=80):*  
      - `P(x|H_small) = 1/100`  
      - `P(x|H_large) = 1/160`  
      - Posterior = `(1/100 * 0.5) / [(1/100 * 0.5) + (1/160 * 0.5)] = (0.005) / (0.005 + 0.003125) = 61.5%`  
  - Students submit probabilities via clicker/app or paper. Display anonymous histogram.  

  **3. Second Betting Round (15 min)**  
  - Students open **Note 2 (Pool)**:  
    - **Core (numbers 1–60):** Told their number is uninformative → posterior reverts to prior (50%).  
    - **Variable (numbers 61–160):** Told to recalculate using only their pool:  
      - New likelihood: `P(x|H_small) = 1/40` (since variable pool=40 under H_small)  
      - `P(x|H_large) = 1/100` (variable pool=100 under H_large)  
      - *Example (x=80):*  
        - Likelihood ratio = `(1/40)/(1/100) = 2.5` → posterior = `(2.5 * 0.5) / (2.5*0.5 + 0.5) = 71.4%`  
  - Students submit revised probabilities. Display changes.  

  **4. Scoring & Reveal (10 min)**  
  - **Scoring rule (Brier score):**  
    - True hypothesis revealed.  
    - Individual score: `10 * [1 - (1 - p)^2]` if H_small true, or `10 * [1 - p^2]` if H_large true (where `p = P(H_small)`).  
    - **Group bonus:** Average of *all* individual scores added to each student’s score.  
    - *Purpose:* Penalizes overconfidence (e.g., 0% or 100% if wrong) and rewards keeping probability on truth.  
  - Announce scores. Top scorer(s) win bragging rights. No real money.  

  **5. Debrief (30 min)**  
  Map game moments to doomsday concepts:  
  - **Random position → total size inference:**  
    - *Game:* Low numbers (e.g., 10) shift probability slightly toward H_small; very high numbers (e.g., 150) rule out H_small.  
    - *Doomsday:* Your birth rank (among all humans) suggests how many will exist. Early ranks → small total population.  
  - **Self-sampling vs. favoring large populations:**  
    - *Game:* Treating your number as random justifies inferring population size. But if you heavily favor H_large a priori (not done here), results change.  
    - *Doomsday:* The argument assumes you’re a random sample of all observers. Skeptics give extra prior weight to large populations.  
  - **Reference-class problem:**  
    - *Game:* Core students’ numbers became irrelevant when they learned they were in the immutable set. Variable students’ numbers remained diagnostic.  
    - *Doomsday:* Conclusions depend on whether you define "observers" as humans, conscious beings, or simulations.  
  - **Couldn’t find yourself not existing:**  
    - *Game:* "Early" students (1 and 2) bet knowing they couldn’t be later. Yet their numbers still shifted probability (weakly) toward H_small.  
    - *Doomsday:* Your existence is necessary to make the observation, but you should not condition on being "early" to avoid inference.  
  - **Predictable pitfalls & limitations:**  
    - **Pitfall 1:** Students with numbers 61–100 often underestimate H_large in Round 1 (due to likelihood ratio 1.6).  
    - **Pitfall 2:** Core students resist reverting to 50% in Round 2 ("But my number *feels* low!").  
    - **Limitation:** The game assumes perfect random sampling. Real doomsday argues we’re randomly selected from *all time* (past/future), which the game simplifies with uniform draws.  
    - **Unstageable element:** The game can’t replicate the emotional weight of human extinction. Stress in debrief that this is a "toy model" for logic, not a prophecy.

  ---

  ### **Instructor Notes**  
  - **Numbers to expect (H_large true):**  
    - ~6 students get numbers 101–160 (know H_small is impossible).  
    - ~6 get numbers 61–100 (ambiguous, posterior ~60-70% H_small in Round 1).  
    - ~6 get core numbers 1–60 (posterior ~50-60% H_small in Round 1 → reverts to 50%).  
  - **Why it teaches well:**  
    - Forces engagement with likelihoods and reference classes.  
    - "Early" students and pool mechanics make abstract concepts tactile.  
    - Group scoring curbs overconfidence.  
  - **Prep Work:**  
    - Pre-generate number sets for H_small (1–100) and H_large (1–160) in Excel.  
    - Use sealed envelopes or a learning app (e.g., Socrative) for notes.  

  This game delivers the doomsday argument’s core mechanics while avoiding triggering distractions. The debrief explicitly connects game moments to the argument’s formal steps, using student experiences as anchors.
