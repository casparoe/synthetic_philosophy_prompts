prompt: |-
  pls don't give me the standard "bad statistics put an innocent woman in prison" take — I want the Sally Clark case run through the three big interpretations of probability. Short recap so we're on the same facts: she was convicted in November 1999 of murdering her two infant sons; the prosecution's expert, the paediatrician Roy Meadow, put the chance of two cot deaths in an affluent family like theirs at 1 in 73 million, reaching it by squaring a 1 in 8500 figure for a single such death; the Royal Statistical Society later said there was no statistical basis for that; the conviction survived an appeal in 2000 and was only quashed in January 2003, on the separate ground that the prosecution pathologist had sat on microbiology results pointing to natural causes. Fix a date if I've mangled it, but don't make the timeline the answer.

  So: read that 1 in 73 million through frequentism, then through subjectivism (degree-of-belief / betting-odds style), then through a Popperish propensity view. For each, say what the number is even claiming, what the expert would have had to establish for it to carry weight in front of a jury, and where it breaks — reference class trouble, the independence assumption the squaring needs, the missing base rate for double infant murder, or whether there's any repeatable chance setup here for a propensity to attach to.

  The bit I actually go back and forth on: call a probability auditable if the interpretation that licenses it also lets you, after the fact and for that one event, say whether the person quoting it was right. My sense is subjectivism can do that via proper scoring rules, frequentism can only do it by dragging in a reference class the event may not belong to, and propensity can't really do it at all since you observe outcomes and never chances. Is that fair to all three, is auditability a demand any of them should have to meet, and does thinking in those terms change how the case looks?

  Give it to me as exactly five numbered points, one or two sentences apiece, no intro and no wrap-up — and draw an explicit line between what's settled among people who work on this and what's live dispute, since I don't want one contested version of frequentism or of propensity handed over as the consensus view.
reasoning: |-
  Hmm, the user wants me to analyze the Sally Clark case through three interpretations of probability: frequentism, subjectivism, and propensity. They specifically don't want the standard statistical error explanation, but rather a deep dive into how each probability interpretation would handle the 1 in 73 million figure used in the trial.

  I need to cover several aspects for each interpretation: what the number actually claims, what would be needed for it to be valid evidence, and where it breaks down (reference class issues, independence assumptions, base rate problems, or lack of repeatable setups).

  The user also wants me to address "auditability" - whether each interpretation allows us to retrospectively evaluate if the probability quoted was "correct." They suggest subjectivism can do this via scoring rules, frequentism might with reference classes, and propensity probably can't.

  I'll structure this as exactly five numbered points as requested: one for each interpretation (frequentism, subjectivism, propensity), one for auditability, and one to distinguish settled vs disputed aspects. Each point should be 1-2 sentences maximum.

  For the first three points:
  - Frequentism: The 1/73M claims a long-run frequency in a reference class. It breaks on reference class selection (what counts as "affluent family") and independence assumption (can't just square the single death probability).
  - Subjectivism: This would represent Meadow's personal belief. It breaks because his belief wasn't well-calibrated (relying on flawed data and reasoning), and doesn't account for base rates of murder.
  - Propensity: This would claim an inherent disposition toward double cot death. It breaks because there's no well-defined repeatable setup (each infant death has unique biological factors).

  For auditability (point 4): Subjectivism can be audited via scoring rules that penalize inaccurate beliefs. Frequentism might be audited through reference class performance, but propensity can't be audited since we only see outcomes, not the underlying tendencies.

  For settled vs disputed (point 5): Most agree on the frequentist reference class problem and subjectivist calibration issues. But there's active debate about whether propensity can meaningfully apply to singular events like this, and whether any probability interpretation can truly offer "auditability" for unique cases.

  I'll make sure to keep each point concise and avoid intros/conclusions as requested. This approach covers all the user's requirements while staying focused on the probability interpretations rather than the legal aspects they explicitly excluded.
answer: |-
  Here are the five numbered points addressing your query:

  1.  **Frequentism:** The 1/73M claims the long-run frequency of two cot deaths occurring in an "affluent family" like the Clarks', derived by squaring the frequency for one death. For validity, Meadow needed a precisely defined reference class ("affluent family") and empirical evidence confirming both the single death rate's accuracy *and* the independence of deaths required for squaring. It breaks due to reference class ambiguity, the demonstrably false independence assumption, and ignoring the base rate of double murder.

  2.  **Subjectivism (Degree-of-Belief):** The number represents Meadow's personal betting odds (degree of belief) in the proposition "two natural cot deaths occurred in this affluent family". For jury weight, Meadow needed justification showing his belief was well-calibrated (e.g., derived from reliable data and sound reasoning, potentially subject to scoring). It breaks because his belief was based on flawed data (the 1/8500 figure), ignored crucial evidence (microbiology), violated the conjunction rule (by squaring without independence), and neglected the alternative hypothesis (double murder).

  3.  **Propensity:** The number claims an inherent, single-case dispositional chance (propensity) within the Clark family/household setup for two infants to die naturally. For validity, Meadow needed to define a stable, repeatable "chance setup" (beyond just "affluent family") generating cot deaths with an objective tendency quantified at 1/73M for doubles. It breaks fundamentally as there is no identifiable, repeatable physical setup to which such a precise propensity for *this specific pair* of unique biological events could meaningfully attach; each infant and death is highly singular.

  4.  **Auditability:** Subjectivism can be audited post-hoc via proper scoring rules, penalizing Meadow if his extreme belief (high odds against natural death) was wrong (which it was). Frequentism can only be audited indirectly via the *reference class's* future performance, not the single event itself. Propensity is inherently unauditable for singular events, as we only observe the outcome (natural death *or* murder), never the "true chance". Auditability is a demand stemming from practical/legal needs, not intrinsic to the interpretations; its (im)possibility highlights their differing ontologies.

  5.  **Settled vs. Disputed:** It's settled that Meadow's calculation violated core tenets of *all* interpretations: flawed input data (1/8500), unjustified independence assumption (squaring), and ignored base rates/alternative explanations (neglect of double murder likelihood). The live dispute centers on whether a meaningful propensity *can ever* be assigned to such singular biological events, and whether frequentist reference classes can be non-arbitrarily defined for rare, complex social/biological scenarios. Auditability's value and achievability remain contested.
