answer: |-
  ### Analysis of Iterated Deletion of Strictly Dominated Strategies with Mixed Strategies

  Your reasoning about iterated deletion of strictly dominated strategies (IDSDS) is insightful, but there's a key flaw in the averaging argument when mixed strategies are considered. Below, I'll address your questions step by step, using the provided game to illustrate. The payoffs are:

  - **Row (firm) payoffs** against Column's actions (L, M, R):
    - A: (4, 0, 6)
    - B: (1, 4, 6)
    - C: (1.5, 1.5, 3)

  - **Column (rival) payoffs** against Row's actions (A, B, C):
    - L: (3, 0, 0)
    - M: (0, 3, 0)
    - R: (1, 1, 6)

  #### 1. **Is the TA right that the game "collapses" with mixed strategies?**
  Yes, the TA is correct. When mixed strategies are allowed for domination, we can eliminate strategies that are not dominated by pure strategies alone. Specifically:
  - **First deletion**: Row's strategy C is strictly dominated by a mixed strategy of A and B.
  - **Second deletion**: After C is removed, Column's strategy R is strictly dominated by a mixed strategy of L and M.

  This reduces the game to a 2x2 matrix (Row: A, B; Column: L, M), which can then be solved for Nash equilibria. Without mixed strategies, no strategies are strictly dominated, so IDSDS does nothing. Here's the step-by-step with mixed strategies:

  - **Step 1: Eliminate C for Row using a mixed strategy**  
    Consider a mixed strategy for Row: play A with probability \(p\) and B with probability \(1-p\), denoted \(pA + (1-p)B\).  
    - Payoff against Column's L: \(p \cdot 4 + (1-p) \cdot 1 = 3p + 1\)  
    - Payoff against Column's M: \(p \cdot 0 + (1-p) \cdot 4 = 4 - 4p\)  
    - Payoff against Column's R: \(p \cdot 6 + (1-p) \cdot 6 = 6\)  
    Compare to C's payoffs: (1.5, 1.5, 3).  
    We need \(3p + 1 > 1.5\), \(4 - 4p > 1.5\), and \(6 > 3\) (which always holds). Solving:  
    - \(3p + 1 > 1.5\) → \(3p > 0.5\) → \(p > \frac{1}{6}\)  
    - \(4 - 4p > 1.5\) → \(-4p > -2.5\) → \(p < \frac{2.5}{4} = 0.625\)  
    For \(p \in (\frac{1}{6}, 0.625)\), e.g., \(p = 0.5\), the mixed strategy strictly dominates C:  
      - Against L: \(0.5 \cdot 4 + 0.5 \cdot 1 = 2.5 > 1.5\)  
      - Against M: \(0.5 \cdot 0 + 0.5 \cdot 4 = 2 > 1.5\)  
      - Against R: \(6 > 3\)  
    Thus, C is strictly dominated and can be deleted. Row now has strategies A and B.

  - **Step 2: After deleting C, eliminate R for Column using a mixed strategy**  
    With Row only playing A or B, Column's payoffs simplify:  
    - Against A: L: 3, M: 0, R: 1  
    - Against B: L: 0, M: 3, R: 1  
    Consider a mixed strategy for Column: play L with probability \(q\) and M with probability \(1-q\), denoted \(qL + (1-q)M\).  
    - Payoff against Row's A: \(q \cdot 3 + (1-q) \cdot 0 = 3q\)  
    - Payoff against Row's B: \(q \cdot 0 + (1-q) \cdot 3 = 3(1-q)\)  
    Compare to R's payoffs: (1, 1).  
    We need \(3q > 1\) and \(3(1-q) > 1\). Solving:  
    - \(3q > 1\) → \(q > \frac{1}{3}\)  
    - \(3(1-q) > 1\) → \(3 - 3q > 1\) → \(-3q > -2\) → \(q < \frac{2}{3}\)  
    For \(q \in (\frac{1}{3}, \frac{2}{3})\), e.g., \(q = 0.5\), the mixed strategy strictly dominates R:  
      - Against A: \(0.5 \cdot 3 + 0.5 \cdot 0 = 1.5 > 1\)  
      - Against B: \(0.5 \cdot 0 + 0.5 \cdot 3 = 1.5 > 1\)  
    Thus, R is strictly dominated and can be deleted. Column now has strategies L and M.

  The game is now reduced to Row (A, B) vs. Column (L, M), with payoffs:
  - Row: A → (4, 0), B → (1, 4) against (L, M)
  - Column: L → (3, 0), M → (0, 3) against (A, B)

  No further deletions occur. This confirms the TA's point: mixed strategies enable deletions that pure strategies alone cannot, and the first deletion (C) unlocks the second (R).

  #### 2. **Where does your averaging argument go wrong?**
  Your argument was:
  - If a mixed strategy \(m\) strictly dominates a pure strategy \(s\), then for each opponent action, there exists a pure strategy in the support of \(m\) that beats \(s\) for that specific action.
  - Since \(m\) beats \(s\) everywhere, you felt that one of these pure strategies must beat \(s\) everywhere.

  **The flaw:** The pure strategy that beats \(s\) for a given opponent action may **depend on the action**, so no single pure strategy necessarily dominates \(s\) for all actions. In other words:
  - For each opponent action, a different pure strategy in the support might be responsible for the improvement.
  - The mixed strategy "smooths out" these improvements, achieving strict dominance overall without any pure strategy doing so alone.

  **Example from the game:** For Row's C:
  - Against L: A (payoff 4) beats C (1.5), but B (1) does not.
  - Against M: B (payoff 4) beats C (1.5), but A (0) does not.
  - Against R: A or B (6) beats C (3).
  No single pure strategy dominates C, but the mixed strategy \(0.5A + 0.5B\) does, as shown above.

  This is why mixed strategies can eliminate more than pure strategies in IDSDS. It also relates to the concept that a strictly dominated strategy is never a best response to any belief (over opponent actions), but pure-strategy deletion only checks against pure beliefs.

  #### 3. **Does anything change with weak dominance?**
  Yes, weak dominance (where a strategy is weakly dominated if another does at least as well in all cases and better in some) changes the behavior of IDSDS, especially regarding order dependence. However, in this game, weak dominance isn't needed since strict dominance suffices. Key differences:

  - **Order dependence in weak dominance**: The order of deletion can affect the outcome. For example:
    - Deleting one weakly dominated strategy might remove the only dominator of another, or make a strategy non-dominated.
    - In contrast, strict dominance (with or without mixed strategies) is order-independent: the final set after IDSDS is unique regardless of deletion order.

  - **In this game with weak dominance**:
    - **Pure strategies only**: No strategy is weakly dominated by a pure strategy (e.g., C is not weakly dominated by A or B because against L, C is better than B, and against M, C is better than A).
    - **Mixed strategies allowed**: 
      - C is strictly dominated (as above), so weak dominance isn't relevant here.
      - If we consider weak dominance, C might be weakly dominated by the same mixed strategy, but strict dominance applies.
      - The key point: Order could matter if weak dominance were forced. For instance, if we weakly delete a different strategy first, the outcome might differ. But in this case, since we have strict dominance, it doesn't change the result.

  **Why order matters for weak dominance**: With weak dominance, deleting a strategy can change the set of beliefs against which other strategies are evaluated. For example:
  - Strategy X might weakly dominate Y only if strategy Z is present, but after deleting Z, Y is no longer dominated.
  - In strict dominance, since domination must hold strictly for all opponent actions, deletion order doesn't affect the set of dominated strategies at each step.

  #### Final Thoughts
  - **For your exam**: Focus on the definition of strict dominance with mixed strategies. A strategy \(s_i\) is strictly dominated if there exists a strategy \(\sigma_i\) (pure or mixed) such that \(u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})\) for all pure actions \(s_{-i}\) of opponents. Mixed strategies can dominate even when no pure strategy does, as shown.
  - **This game**: Highlights how mixed strategies enable iterated deletion. Memorize the procedure but understand the logic: compare strategies against all opponent pure actions, and use mixed strategies as potential dominators.
  - **Practice**: Redo the deletion step-by-step to build intuition. Start by checking for mixed dominators if pure deletion fails.

