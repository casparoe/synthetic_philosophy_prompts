  Okay, the user is describing a phenomenon in digital humanities where period labels like "medieval" or "Renaissance" persist in categorizing texts even after the historical narratives justifying those labels have been discredited. They want a term for this phenomenon and a clear definition distinguishing it from related concepts. 

  First, I recognize this isn't about vague or politically loaded terms—it's more specific. The user explicitly rejects "essentially contested concept" because there's no active debate; scholars agree the underlying narrative is false. They also dismiss "self-fulfilling prophecy" since historical events can't be altered retroactively. 

  The core issue seems to be the uncoupling of a label from its discredited theoretical origins while the label continues to shape academic practices. I recall terms like "zombie category" (Ulrich Beck) and "persistent classificatory residue," but neither fully captures the institutional reinforcement aspect. The user mentions cataloging systems, reading lists, and citation patterns—these structural elements are key. 

  For a precise term, "institutional reification" feels close but incomplete. Adding "autopoietic" (self-reproducing) from systems theory might work, since the academic ecosystem regenerates the label's validity through usage. Hence "autopoietic institutional reification." 

  Distinguishing this from theory-ladenness: all terms carry theoretical baggage, but here the original theory is dead while the structure it built lives on. Unlike vague terms (e.g., "long nineteenth century"), these labels falsely imply natural breaks. And unlike classifications that change their objects (e.g., medical diagnoses affecting patients), historical texts aren't altered—only their scholarly treatment. 

  On boundary cases: labels survive laundering when they become purely conventional ("long nineteenth century") or when new scholarship successfully decouples them from discredited narratives (e.g., "Baroque" shedding its "bizarre" pejorative sense). But many, like "late antiquity," stealthily accumulate new baggage. 

  The insider test: if scholars feel compelled to add caveats ("so-called Renaissance"), the laundering failed. True independence is rare; even "Enlightenment" still echoes Whig history. The user's skepticism is warranted—most period labels remain cryptonormative. 

  Final thought: the user might also be hinting at ethical concerns. By perpetuating these labels, are we complicit in misleading students? The answer leans yes, but pragmatic taxonomy demands compromise. The tension between accuracy and utility is real.
answer: |-
  Your phenomenon is brilliantly articulated and represents a profound challenge in historical taxonomy. It sits at the intersection of epistemology, institutional practice, and historiography. The closest established term is **"zombie category" (Ulrich Beck)**, but it needs refinement. I propose **"Cryptonormative Reification"** as a more precise descriptor, defined as follows:

  **Cryptonormative Reification:** *The persistent, institutionalized use of a classificatory term whose original normative or theoretical justification has been discredited, yet which continues to structure knowledge practices (cataloging, pedagogy, citation, curation), thereby regenerating the illusion of its empirical validity.*

  ### Key Components & Distinctions
  1.  **Vs. Theory-Ladenness:**
      *   *Theory-ladenness* means all observation/description is influenced by prior concepts/theories.
      *   *Cryptonormative reification* is specific: the *original* theory justifying the label is *dead*, but the label *lives on* institutionally. The "crypto" (hidden) aspect is the *disconnect* between scholarly consensus and operational use. The "reification" is the transformation of the discredited concept into a concrete, operational category within systems.

  2.  **Vs. Essentially Contested Concept (Gallie):**
      *   ECCs involve *active debate* over the concept's *core meaning/value*. Here, the *underlying narrative* is *uncontestedly rejected*, but the *label* persists uncontested *operationally*. The fight is absent; the corpse animates the filing cabinet.

  3.  **Vs. Self-Fulfilling Prophecy:**
      *   SFPs *cause* the predicted outcome (e.g., labeling a student "gifted" improves performance). Here, the *past events* are fixed. The "prophecy" fulfills itself *retrospectively in scholarship and curation* – it manufactures a *scholarly reality* (reading lists, citations, digital corpora) that *appears* to validate the discredited discontinuity. The *objects* don't change; their *relational context and scholarly interpretation* do.

  4.  **Vs. Vague/Politically Loaded Terms:**
      *   Vagueness or political load is inherent or contested. Cryptonormative reification involves a term *specifically* justified by a now-rejected narrative, yet its operational use *occludes* this rejection, making it seem neutral or empirically sound *despite* scholarly consensus against its foundation.

  5.  **Vs. Classification Changing the Classified:**
      *   This (e.g., diagnostic labels altering patient experience) requires the object to be *present and malleable*. Historical objects are fixed. Cryptonormative reification changes *how we organize, access, study, and relate* to these fixed objects, creating a *secondary reality of associations and interpretations* that mimics the discredited primary reality.

  ### Boundary Cases: Why Some Labels "Get Away With It"
  *   **Explicitly Conventional Labels:** Terms like "the long nineteenth century" or stratigraphic boundaries (e.g., "Cretaceous-Paleogene boundary") are *introduced and understood* as pragmatic, conventional tools with arbitrary endpoints. Their value is purely *heuristic/organizational*. There is no *explanatory narrative* built into the label itself to be discredited.
  *   **"Thin" Labels:** Terms like "late antiquity" start as deliberately thin chronological descriptors *precisely to avoid* thick narratives. Their subsequent "thickening" is a *separate* process – often a new form of cryptonormative reification based on *later* theories applied *to* the interval.
  *   **Successfully Laundered Labels:** Some terms shed their original baggage through consistent, critical re-use emphasizing their constructedness (e.g., "Baroque" losing its original "bizarre/irregular" pejorative sense). They become primarily stylistic/conventional identifiers.

  **The Principled Line:** A label is vulnerable to cryptonormative reification if:
  1.  It was *originally coined or popularized* to embody a specific historical *narrative* or *thesis* (e.g., "Renaissance" implying rebirth after darkness, "Scientific Revolution" implying sudden rupture).
  2.  That narrative/thesis is *subsequently widely discredited* by specialists.
  3.  The label *retains its strong periodizing or explanatory function* within institutional knowledge structures *without* constant, explicit caveats acknowledging the discrediting.

  ### Can We Tell if a Label is "Laundered"? (The Insider Test)
  It's difficult but not impossible. Look for:

  1.  **Operational Independence:** Can the label be used *solely* as a chronological marker or stylistic descriptor *without* invoking the discredited narrative? Does it function effectively in databases/courses *without* implying the original thesis? (e.g., "Victorian" often works this way; "Dark Ages" does not).
  2.  **Critical Ubiquity:** Is the *constructedness and problematic history* of the term *routinely and prominently acknowledged* in foundational texts, syllabi, and metadata descriptions where it's used? Or is it presented as a neutral given?
  3.  **Narrative Detachment:** Do scholars working *within* the period defined by the label feel compelled to *constantly* refute or nuance the label's original implications? If yes, laundering is incomplete (e.g., medievalists vs. "Dark Ages", scholars of 16th-c. science vs. "Scientific Revolution").
  4.  **Replacement Failure:** Has repeated attempts to introduce a more accurate or neutral term consistently failed *because* the old term is too embedded? This is a strong indicator of institutional reification overpowering scholarly critique.

  **Conclusion:** You're identifying **Cryptonormative Reification** – the uncanny afterlife of discredited historical narratives within the operational machinery of knowledge institutions. It thrives where the pragmatic utility of a label for organization outweighs (or obscures) the critical rejection of its foundational meaning. The boundary lies in the label's original *explanatory ambition* versus its current *conventional utility*. Laundering is rarely complete for period labels born of grand narratives; the "crypto" normative shadow usually lingers, requiring constant vigilance. Your tagging project isn't just describing history; it's actively participating in this complex process of reification – an inherent tension in all large-scale historical taxonomy. Acknowledge this explicitly in your methodology: tag with awareness that the tag itself shapes future perception, even as you strive for accuracy based on current scholarship.
