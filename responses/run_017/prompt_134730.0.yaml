  Now, criteria ranking: importance to funder's goal must come first since they want to change allocation practices. Tractability matters because it's a 3-year program. Neglectedness helps justify funding this specific program. Upstream/downstream determines logical dependencies.

  For the actual ordering:
  1. Unit of account - absolutely foundational and unresolved
  2. Enforcement - necessary for real-world implementation
  3. Endogeneity - high impact on institutional design
  4. Adverse selection - relates to market dynamics but less immediate
  5. Aggregative effects - important but more complex
  6. Non-standard agents - valuable but can build on prior work
  7. Relation to existing practices - important but somewhat downstream

  The user asked about falsification tests. A good one would be: if after 3 years we still can't specify tradable units without smuggling in a common metric, that undermines the whole framework. For endogeneity, if we find convergence always happens and is undesirable, that could sink the project.

  What would change rankings? If unit of account gets resolved, enforcement moves up. If endogeneity proves intractable, adverse selection might become more central. The non-standard agents question could jump up if early work shows it's critical for real philanthropists.

  Need to emphasize why philosophers are needed - especially for unit of account (conceptual work on commensurability) and endogeneity (value drift questions). Economists can handle enforcement mechanisms, but philosophers must lead on the normative foundations.

  The user's hunches hold up well. Unit of account is indeed the bottleneck, and endogeneity is the sleeper issue that could make or break institutional adoption. Should strengthen their hand against application-focused colleagues by showing how conceptual work enables future applications.
answer: |-
  Here is a prioritized research call structure, defended against your criteria and hunches. The ordering balances **upstream logical dependencies**, **funder relevance**, **tractability**, and **neglectedness**, with explicit trade-offs noted.

  ---

  ### **Core Prioritization Criteria** (Weighted)
  1. **Upstream Logical Necessity** (40%): *Does progress here unlock other questions?*  
  2. **Funder Impact Potential** (30%): *Could answers change institutional allocation?*  
  3. **Tractability in 3 Years** (20%): *Can philosophers + decision theorists make progress?*  
  4. **Neglectedness** (10%): *Is this underexplored relative to importance?*  

  ### **Ranked Research Themes**
  1. **Unit of Account**  
     - **Why Top?**  
       - **Upstream Criticality**: Without defining *what is traded* (e.g., moral "credit," conditional commitments, proxy metrics), enforcement, selection, and aggregation lack coherent objects. Your hunch holds: enforcement *assumes* tradable units (e.g., "I fund your cause" presumes "cause" is well-defined).  
       - **Funder Impact**: Philanthropists need operationalizable currencies (e.g., "cost-per-life" vs. "cultural preservation units"). Failure here makes moral trade practically inert.  
       - **Tractability**: Philosophers excel at conceptualizing value incommensurability (e.g., Chang, Anderson) + decision theorists can model abstract currencies.  
       - **Neglectedness**: Most work assumes ad hoc units (e.g., "donation swaps"). Systematic analysis is rare.  
     - **Trade-off**: Less immediately policy-facing than enforcement, but foundational.

  2. **Endogeneity of Moral Views**  
     - **Why Second?**  
       - **Funder Impact**: If moral trade inherently converges views toward "trade-friendly" theories (e.g., consequentialism), this challenges pluralist aims. Funders *must* know if trade erodes the diversity it leverages.  
       - **Upstream**: Affects *all* applications: if endogeneity is inevitable, adverse selection/aggregation risks amplify.  
       - **Tractability**: Philosophers can model value drift (e.g., adaptive preference literature); economists can simulate learning dynamics.  
       - **Surprise Potential**: As you note, proponents may resist this—making it high-impact if proven.  
     - **Conflict**: Less foundational than unit of account but more policy-relevant.

  3. **Enforcement & Credible Commitment**  
     - **Why Third?**  
       - **Upstream**: Necessary for real-world implementation but *presupposes* a tradable unit (supporting your hunch).  
       - **Funder Impact**: Philanthropists need mechanisms to bind commitments (e.g., blockchain escrow, reputational penalties).  
       - **Tractability**: Game theorists excel here (e.g., contract design under disagreement).  
       - **Risk**: Could become purely technical—needs philosophers to ensure mechanisms respect moral autonomy.  

  4. **Adverse Selection (Gresham’s Law)**  
     - **Why Fourth?**  
       - **Funder Impact**: If "permissive" theories dominate trade, philanthropists might inadvertently empower views they oppose.  
       - **Tractability**: Formal modeling (e.g., screening games) + empirical work on existing philanthropy.  
       - **Downstream Dependency**: Requires clarity on units (what is traded?) and enforcement (how are commitments maintained?).  
     - **Neglectedness**: Underexplored in moral contexts.  

  5. **Aggregative Effects**  
     - **Why Fifth?**  
       - **Funder Impact**: Demonstrating systemic irrationality (e.g., PD dynamics) could deter institutional adoption.  
       - **Tractability**: Requires computational models of multi-agent trade—feasible but complex.  
       - **Dependency**: Builds on units, enforcement, and selection.  

  6. **Trade with Non-Standard Agents**  
     - **Why Sixth?**  
       - **Funder Impact**: Critical for long-term relevance (e.g., climate philanthropy for future people).  
       - **Tractability**: Highly speculative; relies on proxies (e.g., "veil of ignorance" trades).  
     - **Philosophical Core**: Requires meta-ethics (e.g., can we trade with agents lacking agency?).  

  7. **Relation to Existing Practices**  
     - **Why Last?**  
       - **Downstream**: Application-focused; best explored *after* core puzzles are mapped.  
       - **Funder Impact**: High if solved, but premature without foundations.  

  ---

  ### **Attacking Your Hunches**
  - **Unit of Account Upstream?** **Correct.** Enforcement mechanisms (e.g., Tit-for-Tat) require definable actions to trigger retaliation. Without specifying "what counts as compliance," enforcement collapses. *Verdict: Your hunch stands.*  
  - **Endogeneity Most Surprising?** **Partially correct.** It *is* counterintuitive and policy-relevant, but **adverse selection** may be more immediately jarring: e.g., an "effective altruist" trading with a nationalist might inadvertently boost nationalism if permissive theories scale. *Verdict: Endogeneity is top-3, but not uniquely dominant.*  

  ---

  ### **Pseudo-Questions & Discipline Boundaries**
  - **Pseudo-Question**: "Is moral trade *possible*?" This is settled (see C. R. Baker, Heath). Focus on *how* it functions.  
  - **Philosophy-Centric Questions**:  
    - Unit of account (value commensurability).  
    - Endogeneity (normative drift under institutions).  
    - Non-standard agents (moral patienthood).  
  - **Economics/Game Theory-Centric**:  
    - Enforcement, adverse selection, aggregation.  
  - **Defense to Economists**: Philosophers address *normative coherence* (e.g., "Can trade be fair without a common metric?"). Without this, game-theoretic models lack moral foundations.  

  ---

  ### **What Would Change the Ranking?**
  - **Unit of Account Solved**: Enforcement jumps to #1; adverse selection/endogeneity gain urgency.  
  - **Unit of Account Unsolvable**: Undermines the entire programme. **Falsification test**: *If no non-question-begging unit of account is found in 3 years, moral trade is institutionally inert.*  
  - **Endogeneity Proven Severe**: Elevates adverse selection (they compound). If trade *always* corrupts pluralism, the programme fails.  
  - **New Critical Question**: **"Tractability of Moral Preferences"**—Can agents *credibly signal* their moral type? If not, adverse selection dominates. More urgent than aggregative effects.  

  ---

  ### **Final Call Structure**
  **Core Question Sequence**:  
  1. **What can be traded?** (Unit of account + currency design)  
  2. **Does trading reshape values?** (Endogeneity risks)  
  3. **How can promises be enforced?** (Commitment under disagreement)  
  4. **Who controls the market?** (Adverse selection dynamics)  

  **Falsification Test for Funders**:  
  > *"This programme succeeds if it identifies at least one non-coercive, practically implementable mechanism for moral trade that (a) specifies a tradable unit without presupposing a common moral standard, and (b) demonstrates robustness to value drift or adverse selection in simulation."*  

  This forces focus on your upstream hunches while leaving room for economists to tackle enforcement/selection—balaging rigour with funder demands.
