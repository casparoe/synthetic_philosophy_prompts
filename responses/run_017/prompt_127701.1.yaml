prompt: |-
  You're a philosopher of mind who's published on consciousness and spent a lot of time around illusionists at conferences — brainstorm for a minute about where this view is genuinely exposed before you write anything, then think carefully, and please don't give me the polished party-line versions of the standard moves.

  I host a small philosophy podcast, and next week's guest is a philosopher finishing a book manuscript defending illusionism about phenomenal consciousness (she'd rather I not use her name). Her stock move when things get hard is to say that whatever I've just described is "just the hard problem knocking at the door again" — that I'm treating a phenomenal realist datum as if it were evidence. I want questions that make that move harder to reach for, not ones where she gets to restate that experiences don't have phenomenal properties.

  Why i care: I'm on a hospital ethics committee, my brother is a neuroscientist who works on unresponsive patients, and last month we spent a whole session on a case where an unresponsive patient seemed to willfully modulate brain activity in an fMRI scanner. Whether there's something it's like for that patient felt like it mattered enormously, and illusionism seems to say it doesn't, and I honestly can't tell if that means the view is cold or just quietist.

  Give me exactly six questions as a numbered list, each entry one or two sentences — the question plus the follow-up you'd expect to need given her most likely answer — with no introduction and no wrap-up. Across the six I want at least one on: the disanalogy with ordinary perceptual illusion (I can know the Müller-Lyer lines are the same length and still see them as unequal — but if I believe illusionism, does the seeming just evaporate, and if it doesn't, what is the vehicle of a seeming that has no phenomenal character?); the error theory she owes having the same fine-grained structure as our reports (my pet worry, which I've been calling the calibration problem: the misrepresentation fits its target uncannily well, so what does the fitting, and does answering that collapse illusionism into reductive realism on one side or old-school eliminativism on the other, with no stable middle?); whether the view does any practical work at all, or whether it's quietist — does it change anything for that patient, and if not, is that a feature she wants to own; what "experience" and "conscious" mean in her mouth once the phenomenal properties are gone, and whether her paraphrase still does the work we use those words for (caring about our own futures, the knowledge argument); and whether she'll follow the view out to animals and AI — because a view that says "no hard problem anywhere" starts to look cheap, and I want her to have to say what would make her give it up.
