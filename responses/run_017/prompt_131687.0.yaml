prompt: |-
  I spent most of last night arguing with a friend about what makes it permissible to take someone's word for something — she works on model evaluation, I work on provenance tooling for a fact-checking desk — and we kept circling one structure of disagreement: every condition I proposed she could defeat with a case where it was obviously too demanding, and every condition she proposed I could defeat with a case where it was obviously too permissive. So before we go round again I want the specification rather than another round of verdicts. Fix the purpose of the theory as follows: it should be good enough to underwrite working norms for an intermediary — a newsroom desk, a fact-checking team, a pipeline that relays onward what it has been told — about the circumstances in which a source's say-so gives the hearer enough to pass the claim on. What I want from you is what a theory of testimonial warrant would have to deliver to count as adequate for that purpose, not a ranking of the usual candidates.

  The raw material I want you to organise into requirements is roughly this. Cases it has to get right: the one-off stranger giving directions, where there is no track record and no independent check and belief seems fine anyway; opaque expertise, where nobody downstream can assess the claim at all; a group or institutional assertion that no individual member believes, such as a committee statement or a press release issued in a company's name; assertion-shaped output from something with no beliefs, intentions, or stake in being trusted — a language-model completion, or a relay that has been machine-translated and auto-summarised on the way, which was my friend's favourite case and, I suspect, the one that does the most damage; the reliable but insincere speaker and the sincere but unreliable one; long chains in which the individual links are unreliable but the errors happen to cancel, or in which the claim arrives true by luck; source amnesia, where the hearer keeps the belief but loses or misremembers the source; assertion-shaped speech that is not assertion — jokes, fiction, seminar hypotheticals, sarcasm, implicature, an actor's lines — and, separately, genuine assertion not addressed to the hearer, such as an overheard conversation, a leaked memo, an anonymous tip, or a dead author's notebooks; testimony that collides with the hearer's own evidence; and testimony about matters of value, and religious testimony, where the question is whether these may be special-cased or must fall out of the general account. Distinctions I suspect it cannot collapse: the hearer's warrant versus the speaker's; justification versus knowledge; the speaker's reliability versus her taking responsibility for what she says; being warranted versus being able to produce a reason when challenged; and the grain at which calibration is tracked, since she kept insisting that warrant is indexed to a domain rather than to a person or to a single claim, and I could not tell whether that was a genuine desideratum or just a feature of the view she already liked. She also pressed two empirical claims I am not certain of — that young children selectively discount informants they have caught being wrong, and that unaided hearers detect deception at not much better than chance — so tell me if either is doing work it cannot bear.

  So: give me the requirements, each with the case or consideration behind it, and mark which are non-negotiable for the purpose I described and which are preferences of one camp or another disguised as requirements. Add the ones I have missed. Then flag any subset you think cannot be jointly satisfied — I have two suspicions, that cheap default entitlement cannot coexist with a requirement that a hearer with no calibration data at all be unwarranted, and that warrant through long chains cannot coexist with any serious no-luck condition, but I would rather you told me which, if any, is a real inconsistency and what it would cost to drop. Say which single requirement excludes the most otherwise-plausible theories, and why. Then a compact scorecard — a table is fine — for four broad families only: global reductionism, default-entitlement anti-reductionism, tell-tale-sign or local reductionist views, and views on which what matters is the speaker's taking of responsibility rather than her reliability; where a family is silent on a requirement rather than wrong about it, say so. No reading list and no citations to papers; I have read the surveys, and it is the criteria I am missing. Close with a short note on where your own list is most likely to be wrong, and which single consideration, if I pressed it next time, would make you reorganise the whole specification.
reasoning: |-
  Hmm, this user is deep in an epistemological debate about testimonial warrant - specifically what makes it acceptable to pass on information from a source in professional contexts like fact-checking. They've described a frustrating stalemate with a colleague where every proposed condition was either too demanding or too permissive. 

  The user wants structural requirements for a practical theory of testimony, not another round of arguments between existing positions. They've provided a rich set of test cases that any adequate theory must handle: from simple direction-giving to AI-generated content, institutional statements without individual belief, and tricky cases like sarcasm or value claims. They also note important distinctions that shouldn't be collapsed, like hearer vs speaker warrant.

  I need to organize this into clear requirements with their underlying cases, flagging which are essential for their purpose (developing norms for information intermediaries) versus which might be theory-dependent preferences. Important to note their two suspicion about potential contradictions: whether default entitlement conflicts with requiring calibration data, and whether long chains can satisfy anti-luck conditions. 

  For the scorecard, I'll evaluate four major approaches: global reductionism (requiring positive reasons to trust), anti-reductionism (default entitlement), local reductionism (trust based on specific cues), and assurance theories (focusing on speaker responsibility). The user explicitly wants no citations - they know the literature but need analytical structure.

  Key challenges I foresee: The "opaque expertise" case might fundamentally conflict with "hearer must be able to produce reasons" if the theory requires laypeople to articulate why they trust nuclear physicists. Also their colleague's "domain-indexing" requirement seems genuinely important for practical calibration. 

  The most likely flaw in my framework? Probably underestimating how "belief-less sources" (like AI) might require completely rethinking speaker-focused theories. If pressed on that, I'd need to make speaker-independent factors more central. 

  For presentation, I'll use a table for the scorecard but keep the rest in clear sections. The closing note should acknowledge where the requirements might be contested - particularly whether institutional statements can carry warrant without individual believers.
answer: |-
  Below is a specification of requirements for a theory of testimonial warrant suited to underwriting norms for information intermediaries (e.g., news desks, fact-checking pipelines). Requirements are derived from your cases and distinctions, categorized as **non-negotiable** (essential for the purpose) or **negotiable** (theory-dependent). Conflicts, a scorecard for major theories, and limitations follow.

  ---

  ### **Core Requirements**  
  *(Non-negotiables marked **, negotiables marked *)*  

  1. **Baseline Permissibility for Ephemeral Interactions**  
     - **Case**: One-off stranger giving directions (no track record, no independent check).  
     - **Requirement**: Warrants belief/pass-along *without* prior calibration or evidence of reliability.  
     - **Status**: **Non-negotiable** (otherwise norms paralyze routine operations).  

  2. **Opaque Expertise Handling**  
     - **Case**: Relaying claims from domains where downstream agents (or the intermediary) lack assessment capacity (e.g., quantum physics).  
     - **Requirement**: Warrant must not depend on the *hearer’s ability to verify content*.  
     - **Status**: **Non-negotiable** (essential for intermediaries dealing with specialists).  

  3. **Non-Belief-Based Assertions**  
     - **Case**: Institutional statements (e.g., corporate press releases) or AI outputs (language models, summarized relays).  
     - **Requirement**: Warrant must not require the *source’s belief, intention, or sincerity*.  
     - **Status**: **Non-negotiable** (modern information ecosystems demand this).  

  4. **Source-Amnesia Resilience**  
     - **Case**: Hearer retains true belief but forgets/misattributes the source.  
     - **Requirement**: Warrant can persist *independently of ongoing source-attribution*.  
     - **Status**: **Non-negotiable** (human cognition is fallible; norms must reflect this).  

  5. **Discrimination of Non-Assertive Speech**  
     - **Case**: Jokes, fiction, sarcasm, overheard conversations, or leaked memos.  
     - **Requirement**: Warrant must *require intentional transmission of claims as true* (not merely assertion-shaped output).  
     - **Status**: **Non-negotiable** (avoids false amplification of non-serious speech).  

  6. **Anti-Luck Condition**  
     - **Case**: True testimony via coincidental error-cancellation in chains, or lucky true beliefs from unreliable sources.  
     - **Requirement**: Warrant must be *incompatible with knowledge-denying luck*.  
     - **Status**: *Negotiable* (some intermediaries prioritize reliability over epistemic purity).  

  7. **Subject-Neutrality**  
     - **Case**: Testimony about values/religion vs. empirical facts.  
     - **Requirement**: Warrant conditions must *apply identically to all subject matter*; no special-casing.  
     - **Status**: *Negotiable* (but **non-negotiable** if norms must avoid ideological bias).  

  8. **Distinction Preservation**  
     - **Cases/Considerations**:  
       - Hearer’s warrant vs. speaker’s justification.  
       - Justification vs. knowledge.  
       - Speaker reliability vs. speaker responsibility.  
     - **Requirement**: Theory must *treat these as non-collapsible*.  
     - **Status**: **Non-negotiable** (norms require precision about liability/scope).  

  9. **Domain-Specific Calibration**  
     - **Case**: A source reliable in domain A (e.g., medicine) but not B (e.g., politics).  
     - **Requirement**: Warrant assessment must be *indexed to domains/topics*, not global speaker reliability.  
     - **Status**: **Non-negotiablе** (empirically sound; aligns with your friend’s demand).  

  10. **Challenge-Response Capacity**  
      - **Distinction**: Being warranted vs. producing reasons when challenged.  
      - **Requirement**: Warrant must *require ability to cite appropriate justificatory grounds* (not necessarily at intake, but when challenged).  
      - **Status**: *Negotiable* (depends on intermediary’s accountability needs).  

  ---

  ### **Missed Requirements**  
  11. **Sincerity-Reliability Decoupling**  
      - **Case**: Reliable but insincere speaker (e.g., biased expert) vs. sincere but unreliable one.  
      - **Requirement**: Warrant must *depend on reliability of output*, not speaker’s mental state.  
      - **Status**: **Non-negotiable** (intermediaries can’t audit minds).  

  12. **Overheard/Third-Party Testimony**  
      - **Case**: Leaked memos, anonymous tips, dead authors’ notebooks.  
      - **Requirement**: Warrant must *not require direct address to hearer*.  
      - **Status**: **Non-negotiable** (journalistic practice relies on this).  

  ---

  ### **Conflicts & Costs**  
  - **Conflict 1**: Baseline Permissibility (Requirement 1) vs. Calibration Requirement (Requirement 9, if demanding prior data).  
    - **Resolution**: Baseline permissibility applies *only when no domain-relevant data exists*. Requirement 9 governs *ongoing* calibration.  
    - **Cost**: Weakens anti-luck protections for one-off interactions.  

  - **Conflict 2**: Long-Chain Warrant (e.g., errors canceling out) vs. Anti-Luck (Requirement 6).  
    - **Resolution**: **Inconsistent**; chains with compounding unreliability cannot satisfy anti-luck.  
    - **Cost**: Drop Requirement 6 (anti-luck) → permits lucky true beliefs as warrant-conferring. Acceptable for pragmatic intermediaries.  

  - **Most Exclusionary Requirement**: **Non-Belief-Based Assertions** (Requirement 3).  
    - **Why**: Eliminates all theories requiring speaker belief/intention (e.g., Assurance Views, many anti-reductionist accounts).  

  ---

  ### **Empirical Claims**  
  - *Children discounting unreliable informants*: Does no work; Requirement 9 (domain-indexing) is independently justified.  
  - *Low deception detection*: Supports Requirement 11 (decoupling sincerity from reliability); not critical.  

  ---

  ### **Theory Scorecard**  
  | **Requirement**                          | **Global Reductionism** | **Anti-Reductionism (Default)** | **Local Reductionism** | **Assurance (Responsibility)** |  
  |------------------------------------------|-------------------------|----------------------------------|------------------------|--------------------------------|  
  | 1. Baseline Permissibility               | ✗ (Too demanding)       | ✓                                | ✓ (If signs present)   | ✗                              |  
  | 2. Opaque Expertise                      | ✗                       | ✓                                | ✗                      | ✓/✗ (If expertise visible)     |  
  | 3. Non-Belief Sources (AI, institutions) | ✓                       | ✗ (Requires speaker intent)      | ✓                      | ✗ (Requires responsibility)    |  
  | 4. Source-Amnesia Resilience             | ✓                       | ✓                                | ✓                      | ✗ (Tied to speaker)            |  
  | 5. Discriminate Non-Assertive Speech     | ✓                       | ✗ (Defaults risky)               | ✓                      | ✓ (If responsibility taken)    |  
  | 6. Anti-Luck                             | ✓                       | ✗ (Allows luck)                  | ✓                      | ✗                              |  
  | 9. Domain-Specific Calibration           | ✓                       | ✗ (Global default)               | ✓                      | Silent                         |  
  | 11. Sincerity-Reliability Decoupling     | ✓                       | Silent                           | ✓                      | ✗ (Tied to sincerity)          |  
  | 12. Overheard/Third-Party Testimony      | ✓                       | ✓                                | ✓                      | ✗ (Requires address)           |  

  **Key**: ✓ = Satisfied; ✗ = Violated; Silent = No direct position.  

  **Best Fit**: **Local Reductionism** (telltale signs of trustworthiness per domain) handles most non-negotiables but struggles with opaque expertise. **Global Reductionism** (if domain-calibrated) is runner-up but fails baseline permissibility.  

  ---

  ### **Limitations & Reorganization Trigger**  
  **Where the list is most likely wrong**: Overestimating the tractability of **domain-specific calibration** (Requirement 9) for non-experts. Intermediaries may lack resources to track granular reliability.  

  **Reorganization trigger**: If pressed on **AI/ML-generated content**, the requirement that *warrant must not depend on source’s mental states* (Requirement 3) could force abandoning *all* speaker-centric theories. This would prioritize output reliability and institutional safeguards (e.g., system transparency) over traditional speaker-hearer dynamics, collapsing distinctions like speaker responsibility. The entire framework shifts from *testimonial* warrant to *information-stream warrant*.  

  ---  
  This specification prioritizes *actionable norms* over epistemic ideals. Drop anti-luck and challenge-response capacity for pragmatism; strengthen domain-indexing and output-centricity for scalability. Your friend’s emphasis on domains is sound; your focus on speaker-agnosticism is necessary for modern media.
