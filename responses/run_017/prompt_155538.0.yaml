prompt: |-
  im putting together the criteria section of a hospital policy project and before I look at any actual accounts of death I want the spec: what would an account of death have to deliver to be good enough to be written into procurement law and onto a death certificate. meaning it has to give one determinate moment per body, and it has to keep the dead donor rule intact.

  give me the requirements list, each one with the case or consideration that earns its place:

  - the cases it has to get right: neurological and circulatory criteria as theyre actually used in hospitals, the permanently unconscious patient who still has sleep-wake cycles and a working brainstem, an anencephalic newborn, someone in deep hypothermic arrest during surgery who is then rewarmed, a body with total brain failure kept on a ventilator and perfused for months (and in principle carrying a pregnancy), and a revival technology that exists only in prospect
  - the distinctions it cant collapse: what death is vs. the criterion for diagnosing it vs. the test you run at the bedside; losing the organism vs. losing the person; irreversible vs. merely permanent (we wont restart this, as opposed to it cant be restarted)
  - the bits of biology it cant contradict: the brainstem and the cortex failing separately, the body regulating a fair amount on its own even when the brain is gone, different tissues surviving very different amounts of ischaemia, and cells and organs staying alive for a while after the organism doesnt

  for each requirement say whether its non-negotiable or just a preference of one camp, and if a subset of them is jointly unsatisfiable in a way that matters, say so and say which one gives. the part I most want: whether demanding a single determinate moment per body is in tension with the biology, and which single requirement rules out the biggest share of the popular accounts. short scorecard at the end for whole-brain, higher-brain and circulatory views is fine, table if you like. no citations and no readings, I want the criteria themselves.
reasoning: |-
  We are constructing a set of requirements for an account of death that must be incorporated into procurement law and death certification. The account must assign one determinate moment of death per body and preserve the Dead Donor Rule (DDR), which states that vital organs can only be taken from dead individuals (so death must be declared before organ removal).

  We must consider:
  - Cases it has to get right (neurological and circulatory criteria in current use, specific challenging cases)
  - Distinctions it cannot collapse (e.g., death vs. criterion vs. test; organismic vs. personal death; irreversible vs. permanent)
  - Biological constraints (e.g., brainstem and cortex can fail separately; the body's self-regulation without the brain; differential tissue survival; and post-mortem cell/organ survival)

  We will list each requirement, the case or consideration that motivates it, and note whether it is non-negotiable or a preference. We also note if there is a conflict and which requirement must give way. Finally, we address the tension between a single moment and biology, and which requirement rules out many popular accounts.

  ---

  **Requirements List:**

  1. **Requirement: The account must assign one determinate moment of death per body.**  
     *Motivation*: Legal and administrative necessity (e.g., for death certificates, inheritance, and organ procurement timing).  
     *Non-negotiable?* Non-negotiable for the purpose of law and policy.  
     *Tension with biology?* Biology does not always provide a single moment (e.g., death is a process). However, the law requires a moment. Thus, the account must choose a moment that is biologically defensible and legally practical.

  2. **Requirement: The account must preserve the Dead Donor Rule (DDR).**  
     *Motivation*: Ethical foundation of organ procurement: vital organs are only taken after death to avoid causing death by organ removal.  
     *Non-negotiable?* Non-negotiable in the current ethical and legal framework.

  3. **Requirement: The account must correctly classify the following cases:**
     - **a) Neurological criteria (brain death) as currently used:** A patient with total and irreversible loss of all brain functions (including brainstem) is dead.  
       *Motivation*: Current medical practice and law in many jurisdictions.  
     - **b) Circulatory criteria as currently used:** A patient with irreversible cessation of circulatory and respiratory functions is dead.  
       *Motivation*: Long-standing practice and law, especially in non-hospital settings.  
     - **c) Permanently unconscious patient (e.g., in a persistent vegetative state) with sleep-wake cycles and a working brainstem is alive.**  
       *Motivation*: Such patients are not considered dead under current neurological criteria (brain death requires loss of brainstem function).  
     - **d) Anencephalic newborn is dead?**  
       *Motivation*: Anencephalic infants lack a cerebral cortex but may have a functioning brainstem. Current law and practice do not consider them dead at birth, but there is debate. Requirement: The account must either classify them as dead (if consistent) or alive (if not) without contradiction.  
       *Note*: This is a hard case. Most current standards do not consider anencephalics as dead because they may have some brainstem reflexes.  
     - **e) Patient in deep hypothermic arrest during surgery who is then rewarmed and recovers is not dead at any point during the procedure.**  
       *Motivation*: This temporary cessation of circulation and brain function is reversible and thus not death.  
     - **f) Body with total brain failure kept on a ventilator and perfused for months (or carrying a pregnancy) must be classified as dead.**  
       *Motivation*: Under the whole-brain criterion, such a body is dead because there is irreversible loss of all brain functions. The body may have somatic integration via artificial support, but the organism as a whole has ceased functioning.  
     - **g) A revival technology that exists only in prospect (e.g., future technology that could restore brain function after current "irreversible" damage) does not change the determination of death at the time of assessment.**  
       *Motivation*: Death must be determined based on current medical capabilities, not speculative future ones.  
     *Non-negotiable?* Non-negotiable for (a), (b), (c), (e), (f), and (g). For (d) (anencephalic newborn), there is debate, but the account must be consistent with its own principles.

  4. **Requirement: The account must not collapse the distinction between:**
     - **a) Death itself, the criterion for death, and the tests for death.**  
       *Motivation*: Death is a biological phenomenon, the criterion is the standard we use to define it (e.g., total brain failure), and the tests are the clinical procedures to determine if the criterion is met.  
     - **b) Losing the organism (biological death) vs. losing the person (which may be a philosophical concept).**  
       *Motivation*: The law and medicine are primarily concerned with the death of the human organism. Personal identity and consciousness are relevant to some ethical views (like higher-brain) but are not the same as biological death.  
     - **c) Irreversible vs. permanent cessation.**  
       *Motivation*: "Irreversible" means it cannot be reversed, even with available technology. "Permanent" means we will not reverse it (e.g., a decision not to resuscitate). Death requires irreversibility.  
     *Non-negotiable?* Non-negotiable for (a) and (c). For (b), it is non-negotiable that the account must be based on biological death of the organism (to avoid collapsing into a purely philosophical definition that might not align with biological reality).

  5. **Requirement: The account must not contradict established biology:**
     - **a) The brainstem and cortex can fail separately.**  
       *Motivation*: Brain death requires both, but in conditions like PVS, the cortex is gone but the brainstem remains.  
     - **b) The body can regulate a fair amount (e.g., temperature, blood pressure, wound healing) without the brain, via artificial support.**  
       *Motivation*: In brain-dead bodies on ventilators, some somatic integration persists. This does not mean the organism is alive if the brain is entirely non-functional.  
     - **c) Different tissues survive different durations of ischemia (e.g., neurons die quickly, but skin cells last longer).**  
       *Motivation*: Death of the organism is the loss of integrated functioning, not the death of every cell.  
     - **d) Cells and organs can stay alive for a while after the organism dies (e.g., organs for transplantation).**  
       *Motivation*: This is a fundamental biological fact and must not be denied.  
     *Non-negotiable?* Non-negotiable for all.

  ---

  **Tensions and Conflicts:**

  - **Single Moment vs. Biology:** Biology shows that death is a process. However, the law requires a moment. This tension is resolved by choosing a moment that marks the loss of integrated functioning of the organism as a whole. The requirement for a single moment is non-negotiable for legal purposes, so the account must define a clear threshold event (e.g., irreversible cessation of circulatory and respiratory functions or irreversible cessation of all brain functions).

  - **Anencephalic Newborns:** If the account requires the entire brain to be non-functional (whole-brain criterion), then anencephalics (with a functioning brainstem) are alive. However, this is problematic for organ donation because they are not dead, but their organs are desired. This case highlights a conflict between the whole-brain criterion and the desire for organ procurement. The requirement to preserve the DDR and have a single moment does not resolve this. We must either:
     - Reject anencephalics as dead (which violates the whole-brain criterion) or 
     - Accept they are alive and not eligible for vital organ donation until they die (which is the current approach). This is a point where the whole-brain criterion may not satisfy organ procurement desires but is consistent with biology.

  - **Permanently Unconscious vs. Brain Dead:** The requirement to classify the permanently unconscious (with a working brainstem) as alive and the brain-dead as dead means the account must require the loss of brainstem function (not just cortical function). This rules out the higher-brain criterion.

  - **Revival Technology:** The requirement to base irreversibility on current technology (not future) avoids speculative challenges but may be tested by advancing technology (e.g., if future technology can restore function after prolonged cessation, then irreversibility becomes time-dependent). This is non-negotiable: death is declared based on current capabilities.

  - **Conflict between Whole-Brain and DDR in Anencephalics:** The whole-brain criterion cannot classify anencephalics as dead, so they cannot be organ donors until they die (which often happens quickly, but organs may deteriorate). This is a conflict between the desire for organ procurement and the biological criterion. The requirement to preserve the DDR and the biological constraints (anencephalics have a functioning brainstem) means the anencephalic is alive. Hence, the DDR must be upheld and organ procurement must wait until circulatory death occurs.

  ---

  **Which requirement rules out the biggest share of popular accounts?**

  The requirement that the account must classify the permanently unconscious patient (with a working brainstem) as **alive** rules out the **higher-brain criterion** (which equates death with the loss of consciousness or personhood). This is because the higher-brain criterion would classify such patients as dead, but current law and practice do not.

  The requirement that the body with total brain failure (on a ventilator) must be classified as **dead** rules out a **strict circulatory criterion** that would require the cessation of circulation. However, note that in practice, circulatory criteria are used only after irreversible cessation, but in brain death, circulation is artificially maintained. Thus, a circulatory-only account would fail to classify brain-dead individuals as dead. This is resolved by having two criteria: either irreversible cessation of circulatory and respiratory functions OR irreversible cessation of all brain functions.

  The requirement for a **single moment** per body rules out any account that does not specify a clear threshold (like some process-based views). However, all major criteria (whole-brain, higher-brain, circulatory) can assign a moment.

  ---

  **Scorecard for Major Accounts:**

  | Account             | Single Moment? | DDR Preserved? | Permanently Unconscious (Alive)? | Brain-Dead (Dead)? | Anencephalic (Alive?)* | Hypothermic Arrest (Alive)? | Body on Ventilator with Brain Failure (Dead)? | Revival Tech Ignored? | Biological Constraints? |
  |---------------------|----------------|----------------|----------------------------------|--------------------|------------------------|------------------------------|-----------------------------------------------|------------------------|--------------------------|
  | Whole-Brain         | Yes            | Yes            | Yes                              | Yes                | Yes (alive)            | Yes                          | Yes                                           | Yes                    | Mostly (but note body regulation with support) |
  | Higher-Brain        | Yes            | Yes**          | No (dead)                        | Yes                | Unclear (typically dead) | Yes                          | Yes                                           | Yes                    | No (violates requirement 4b and 5a because it ignores brainstem function) |
  | Circulatory (only)  | Yes            | Yes            | Yes                              | No (alive)         | Yes (alive)            | Yes (if reversible)          | No (alive)                                    | Yes                    | Partially (but fails on brain-dead cases) |
  | **Required**        | **Yes**        | **Yes**        | **Yes**                          | **Yes**            | **Consistent?**        | **Yes**                      | **Yes**                                       | **Yes**                | **Yes**                  |

  \* For anencephalics: 
     - Whole-brain: alive (because brainstem may function). 
     - Higher-brain: typically considered dead (because no cortex). 
     - Circulatory: alive until circulation stops.

  \*\* Higher-brain preserves DDR only if we accept that loss of consciousness is death. However, this is controversial and not accepted in current law.

  **Conclusion on Anencephalics**: The whole-brain criterion (which is the current standard) classifies anencephalics as alive, which is consistent with biology. The higher-brain criterion would classify them as dead, but that criterion is ruled out because it also classifies permanently unconscious patients (with a working brainstem) as dead, which is not acceptable.

  Thus, the whole-brain criterion (with the two criteria of circulatory-respiratory or whole-brain failure) satisfies most requirements. The main tension is with anencephalics (where we cannot procure organs until death) and the challenge of somatic integration in brain-dead bodies. However, the requirement to not contradict biology (brainstem function in anencephalics) means we must accept that they are alive.

  **Final Note**: The requirement that rules out the biggest share of popular accounts (especially the higher-brain criterion) is the requirement that the permanently unconscious patient (with a functioning brainstem) must be classified as alive.
answer: |-
  ### Requirements for an Account of Death in Procurement Law and Death Certification  
  *(Designed to assign one determinate moment per body and uphold the Dead Donor Rule)*  

  #### **I. Cases It Must Get Right**  
  1. **Neurological criteria (brain death) as used in hospitals**  
     - *Requirement*: Must declare death upon irreversible loss of *all* brain functions (brainstem included).  
     - *Case*: Standard hospital practice for organ procurement.  
     - *Non-negotiable*: Yes.  

  2. **Circulatory criteria as used in hospitals**  
     - *Requirement*: Must declare death upon irreversible cessation of circulatory/respiratory functions.  
     - *Case*: Non-brain-dead patients (e.g., cardiac arrest outside ICU).  
     - *Non-negotiable*: Yes.  

  3. **Permanently unconscious patient (e.g., persistent vegetative state)**  
     - *Requirement*: Must classify as *alive* despite loss of consciousness.  
     - *Case*: Patient has sleep-wake cycles and a functioning brainstem.  
     - *Non-negotiable*: Yes (preserves personhood vs. biology distinction).  

  4. **Anencephalic newborn**  
     - *Requirement*: Must classify as *dead* (no cortex) OR *alive* (if brainstem functions); consistency is key.  
     - *Case*: Born without cerebral hemispheres but possible brainstem reflexes.  
     - *Non-negotiable*: Preference (conflict with biology/DDR if forced).  

  5. **Deep hypothermic arrest during surgery**  
     - *Requirement*: Must classify as *not dead* during circulatory cessation.  
     - *Case*: Temporary, reversible circulatory stop (e.g., cardiac surgery).  
     - *Non-negotiable*: Yes.  

  6. **Total brain failure on ventilator (e.g., somatic support)**  
     - *Requirement*: Must classify as *dead* despite prolonged somatic survival.  
     - *Case*: Body perfused for months/pregnancy; no brain function.  
     - *Non-negotiable*: Yes (upholds DDR for organ procurement).  

  7. **Prospective revival technology**  
     - *Requirement*: Must ignore future tech; irreversibility based on *current* capabilities.  
     - *Case*: Theoretical future resuscitation (e.g., advanced neuro-restoration).  
     - *Non-negotiable*: Yes.  

  #### **II. Distinctions It Cannot Collapse**  
  8. **Death vs. criterion vs. test**  
     - *Requirement*: Death (biological reality) ≠ criterion (standard) ≠ test (bedside procedure).  
     - *Consideration*: Prevents conflating conceptual definition with practical diagnosis.  
     - *Non-negotiable*: Yes.  

  9. **Losing the organism vs. losing the person**  
     - *Requirement*: Death must center on *organismal failure* (biological), not loss of personhood (cognitive).  
     - *Consideration*: Avoids subjective "personhood" definitions (e.g., PVS patients are alive organisms).  
     - *Non-negotiable*: Yes.  

  10. **Irreversible vs. permanent cessation**  
      - *Requirement*: Death requires *irreversible* cessation (cannot restart), not *permanent* (won’t restart).  
      - *Consideration*: Distinguishes biology (e.g., brain destruction) from intent (e.g., DNR orders).  
      - *Non-negotiable*: Yes.  

  #### **III. Biological Constraints It Must Honor**  
  11. **Brainstem and cortex can fail separately**  
      - *Requirement*: Must allow independent failure (e.g., brainstem alive in PVS; cortex dead in anencephaly).  
      - *Biology*: Brain regions have distinct functions/resilience.  
      - *Non-negotiable*: Yes.  

  12. **Body self-regulates without brain**  
      - *Requirement*: Must not require total somatic disintegration for death.  
      - *Biology*: Brain-dead bodies maintain homeostasis (e.g., temperature, digestion) via artificial support.  
      - *Non-negotiable*: Yes.  

  13. **Differential tissue survival after ischemia**  
      - *Requirement*: Must not demand uniform cell death for organismal death.  
      - *Biology*: Neurons die in minutes; skin/organ cells survive hours.  
      - *Non-negotiable*: Yes.  

  14. **Cells/organs survive after organismal death**  
      - *Requirement*: Must permit organ viability post-death for transplantation.  
      - *Biology*: Organs function after circulatory cessation (DDR-compatible).  
      - *Non-negotiable*: Yes.  

  ---  
  ### **Tensions and Trade-offs**  
  - **Single determinate moment vs. biology**:  
    Biology treats death as a *process* (e.g., cells die at different rates). A "single moment" is a **legal necessity** but biologically artificial. The requirement for **one moment per body** must override biological gradualism for policy coherence.  

  - **Jointly unsatisfiable requirements**:  
    - **Conflict**: Declaring anencephalic newborns *dead* (to allow organ donation) vs. biological constraints (brainstem function).  
    - **Resolution**: Biology wins. Anencephalics must be *alive* if brainstem functions (sacrificing organ procurement ease).  

  - **Most exclusionary requirement**:  
    **"Organismal death ≠ personhood loss"** rules out *higher-brain accounts* (which equate death with irreversible unconsciousness). Higher-brain views collapse PVS and brain death, violating Requirement 3 and 9.  

  ---  
  ### **Account Scorecard**  
  | **Account Type**       | **Single Moment?** | **Upholds DDR?** | **PVS Patient Alive?** | **Brain-Dead Body Dead?** | **Anencephalic Alive?** | **Hypothermic Arrest Alive?** | **Honors Biology?** |  
  |------------------------|--------------------|------------------|------------------------|---------------------------|-------------------------|-------------------------------|---------------------|  
  | **Whole-Brain**        | Yes                | Yes              | Yes                    | Yes                       | Yes                     | Yes                           | Mostly              |  
  | **Higher-Brain**       | Yes                | Yes              | **No (violates)**      | Yes                       | **No (violates)**       | Yes                           | No (violates 3,9,11)|  
  | **Circulatory-Only**   | Yes                | **Partial**      | Yes                    | **No (violates)**         | Yes                     | **No (violates)**             | No (violates 1,6)   |  

  #### **Key Takeaways**:  
  - **Whole-brain** (irreversible loss of all brain functions) satisfies the most requirements but struggles with anencephalics and somatic integration.  
  - **Higher-brain** fails PVS/anencephalic cases and conflates organism/person.  
  - **Circulatory-only** fails brain-dead cases and hypothermia.  
  - **Non-negotiable core**: Death is organismal (not personal), irreversible (not permanent), and test-agnostic. Biology constrains but does not veto the "single moment" legal need.
