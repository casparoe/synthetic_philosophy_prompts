  ok so I think I finally get Bertrand's paradox and I want to sanity check my reading of it. The way it was explained to me: the three answers — 1/3, 1/2, 1/4 — each come from their own physical setup (spin a pointer, toss a straw, pick two points on the rim), so "random chord" was just underspecified, and once you say which mechanism is actually generating the chord there's a unique correct answer. So on my reading the principle of indifference is fine, you just have to apply it to the variable your mechanism really makes uniform, which is an empirical question rather than a philosophical one.

  Its bugging me though, so I tried to strip the circle out to see whether the geometry was doing something sneaky. Pick a real number x between 0 and 1, and ask for the probability that x squared is under a half. Uniform in x gives about .707; uniform in x squared gives exactly 1/2. No chords, no circle, no mechanism, and the same split shows up anyway. Someone told me indifference should be applied to the parameter your actually uncertain about, but I was equally uncertain about both, so that just seems to move the bump in the rug. Is there a principled rule for which parametrization is the real one — like, do you always use whichever variable the question happens to be phrased in?
