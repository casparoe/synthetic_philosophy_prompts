prompt: |-
  Our city's Markets and Public Values Committee, of which I am a member, has accumulated a set of rulings whose rationale I cannot state to my own satisfaction. We permitted compensated plasma donation at licensed clinics but refused a state-priced market in kidneys from screened and counselled sellers. We accepted surge pricing for hotel rooms during storms but not for bottled water or portable generators once an emergency had been declared. We permitted resale above face value for concert tickets but not for places on the council-house waiting list. We permitted payment for taking part in clinical trials but not payment for attending a public consultation to speak in favour of a developer's scheme. We permitted compensation for egg donation but refused commercial surrogacy.

  The proposal now before us is a regulated platform for paid companionship. For a fee fixed by the regulator, a person would visit an isolated older resident each week, accompany them to medical appointments, be registered as their emergency contact and be treated by care staff as a friend; the company is explicit that what it sells is the standing of a friend rather than merely hours of work. The resident would be told that the visits are bought, institutions would be told if they asked, and nobody would be required to disclose the arrangement to anyone else.

  I suspect that several different principles fit our record equally well and that this proposal is exactly where they come apart. Please answer in British English as a numbered list of exactly five items, each of one or two sentences, with no introduction and no closing remarks: the principles consistent with our precedents; what each of them implies for this proposal; the decision you would recommend if we want to be consistent with ourselves, together with your reason; which of our earlier rulings is the closest analogue; and the variant of this proposal that would best tell the competing principles apart.
reasoning: |-
  Hmm, the user is a member of a Markets and Public Values Committee who's struggling to articulate consistent principles behind their rulings on various market regulations. They've described several seemingly contradictory decisions: allowing paid plasma donation but not kidney markets, surge pricing for hotels but not essential goods during emergencies, ticket resales but not council housing queue jumping, payment for clinical trials but not for attending consultations, and compensation for egg donation but not commercial surrogacy.

  Now they're considering a regulated companionship platform where paid "friends" would provide social support to isolated elderly people, with full disclosure to all parties. They suspect their precedents follow multiple conflicting principles that would diverge on this case. They want me to identify five consistent principles from their rulings, apply them to this proposal, recommend a decision with reasoning, identify the closest analogue, and suggest a variant to test the principles.

  Looking at their rulings, I can identify five core principles:
  1. Commodification boundaries - they allow markets for body products (plasma, eggs) but not for organs or surrogacy, suggesting they draw the line at commodifying relationships or essential body functions.
  2. Essential goods protection - they prohibit surge pricing for emergency supplies but allow it for hotels, protecting necessities during crises.
  3. Procedural integrity - they reject paid advocacy in consultations but allow paid participation in trials, preserving the integrity of public processes.
  4. Access fairness - they ban profiteering from public housing queues but allow ticket resales, prioritizing equitable access to essential services.
  5. Consent authenticity - they permit compensated plasma donation with screening but reject kidney markets, requiring fully informed and non-coercive consent.

  Applying these to the companionship proposal:
  - Commodification principle would reject it as it commercializes friendship
  - Essential goods protection wouldn't apply as companionship isn't a material necessity
  - Procedural integrity isn't challenged
  - Access fairness might support it by providing care to isolated seniors
  - Consent authenticity is satisfied by full disclosure

  The closest analogue is compensated egg donation versus commercial surrogacy - both involve compensated care relationships versus commodified intimate bonds.

  For consistency, I'd recommend rejection because it commercializes friendship itself, violating the deepest commodification boundary they've maintained. To test the principles, a variant offering volunteer matching with expense reimbursement would clarify whether it's the payment or the relationship model that's problematic.

  I need to present this as five numbered items in British English without introductions or conclusions, covering principles, implications, recommendation with reason, closest analogue, and testing variant.
answer: |-
  Here are the five requested items:

  1.  **Principle:** Prevent commodification of fundamental human relationships and bodily integrity. **Implication:** Rejects the proposal as it commercialises the inherent value and standing of friendship itself, crossing a boundary similar to prohibiting kidney sales or commercial surrogacy.
  2.  **Principle:** Protect vulnerable individuals from exploitation during essential needs crises. **Implication:** Does not directly oppose this proposal, as companionship, while beneficial, is not an essential physical good like water during an emergency; the closest concern might be potential exploitation of isolated elderly.
  3.  **Principle:** Uphold procedural integrity and authentic participation in public or essential administrative processes. **Implication:** Does not directly challenge this proposal, unlike prohibiting paid advocacy in consultations which corrupts public discourse; the arrangement is disclosed to the resident and institutions.
  4.  **Principle:** Ensure equitable access to essential public goods and prevent profiteering from scarcity in vital services. **Implication:** Does not directly oppose this proposal, as it offers a new service rather than exploiting scarce access to an existing public good like council housing; the fixed fee mitigates profiteering.
  5.  **Principle:** Permit compensated provision of bodily materials or services where consent is informed, non-coercive, and screened, but prohibit creating markets for body parts or intimate roles. **Implication:** Ambiguous; companionship is a service, but framing it as selling "the standing of a friend" ventures into commodifying an intimate social role, akin to surrogacy, potentially outweighing the consent safeguards.

  **Recommended Decision:** Reject the proposal. **Reason:** It fundamentally commercialises the inherent value and social meaning of friendship itself, crossing the commodification boundary consistently applied in rejecting kidney markets and commercial surrogacy, despite disclosure and regulation.

  **Closest Analogue:** The distinction between compensated egg donation (permitted as provision of a bodily material with safeguards) and commercial surrogacy (refused as commodifying an intimate relationship/role).

  **Testing Variant:** Permit a regulated platform matching volunteers who visit isolated elderly for genuine friendship and provide practical support, with the platform allowed to reimburse volunteers' reasonable expenses only. This separates the question of facilitating companionship (potentially acceptable) from directly paying for the *standing* of a friend (commodification).
