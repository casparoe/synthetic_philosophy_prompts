  - The concept of "untenanted goods" - benefits that exist but belong to no one
  - Worked examples: one where "child's good life" is rejected, another where parents' welfare gain is accepted
  - Appendix of unanswered questions
  - British English with deadpan tone

  The constraints are important: I can't make this a cheap shot against antinatalism or Benatar personally, no "antinatalists are miserable" tropes, and I must maintain the asymmetry logic consistently. The humor should come from the bureaucratic implementation of the philosophy, not from mocking the philosophy itself.

  For structure, I'll follow:
  1. Introduction and purpose
  2. Key principles (asymmetry explained bureaucratically)
  3. How to complete form sections:
     - Section A: Applicant details
     - Section B: Stated reasons (with rejection of child-focused reasons)
     - Section C: Calculation of non-existence benefit (including "untenanted" concept)
     - Section D: Applicant welfare impact (with discounts for optimism bias etc.)
  4. Worked examples
  5. Appendix of unanswered questions
  6. Final clause about the department's own existence

  I'll use appropriately dry bureaucratic language throughout - passive voice, numbered clauses, formal definitions. The comedy emerges from the logical conclusions: the department can't justify reproduction for the child's sake, can only consider impacts on existing people, and ends up in absurd situations like calculating "untenanted benefits" that belong to no one.

  The final touch will be that quiet line about the department's continuing existence, highlighting the paradox without explicitly stating it.
answer: |-
  ## Statutory Guidance for Prospective Parents: Completing Form P7 (Assessment of Non-Existence Benefit)
  **Issued by the Office for Demographic Transition (ODT), under Section 15(2) of the Demographic Sustainability Act 2027. Version 3.1 (Amended).**

  **1. Introduction**
  1.1. This guidance assists prospective parents (Applicants) in completing Form P7: Assessment of Non-Existence Benefit (the Form). Completion of the Form is mandatory prior to conception under the Act.
  1.2. The ODT assesses Applications solely against the criteria established by the Asymmetry Principle (the Principle), as defined in Annex A of the Act and given effect by these regulations. This Principle provides the exclusive basis for granting a Licence to Procreate (Licence).
  1.3. The purpose of the Form is to quantify and balance the relevant factors arising from the potential existence or non-existence of a new child. Only impacts measurable under the Principle are admissible.

  **2. The Asymmetry Principle: Key Implications for Applicants**
  2.1. The Principle distinguishes categorically between the states of existence and non-existence.
  2.2. **Admissible Harm (Existence):** The potential suffering, pain, or harm that *would be experienced* by the potential child, *if* it comes into existence, constitutes an admissible negative factor against procreation. This is documented in Section C of the Form.
  2.3. **Admissible Benefit (Non-Existence):** The absence of suffering, pain, or harm that *would have occurred* if the potential child existed, but which *does not occur* due to its non-existence, constitutes an admissible positive factor (a benefit) *against* procreation. Crucially, this benefit accrues *irrespective of the absence of a beneficiary*. This is also documented in Section C and termed the "Non-Existence Benefit".
  2.4. **Inadmissible Factors (Non-Existence):**
      2.4.1. The absence of potential pleasure, happiness, or well-being that *would have been experienced* by the potential child, *if* it came into existence, but which *does not occur* due to its non-existence, is *not* considered a negative factor, deprivation, or harm under the Principle. It is inadmissible.
      2.4.2. Consequently, any stated reason for procreation based on the potential child's *own* future happiness, pleasure, or fulfilment ("so they can enjoy life," "to give them opportunities," "to experience joy") is irrelevant to the assessment and must be omitted from Section B. Inclusion will invalidate the Application.
  2.5. **Irrelevance of Consent:** Arguments concerning the potential child's inability to consent to being born are inadmissible. Consent requires a subject capable of granting or withholding it. As no such subject exists prior to conception, the concept of consent is inapplicable to the assessment under the Principle. Do not reference consent in the Form.

  **3. Completing Section B: Stated Reason for Procreation**
  3.1. Applicants must state their reason(s) for wishing to conceive.
  3.2. **Prohibited Reasons:** As per 2.4.2, reasons framed in terms of benefits *to the potential child* (e.g., "To give a child a good life," "So they can know love," "To create happiness for them") are strictly inadmissible. Stating such a reason will result in automatic rejection of the Application.
  3.3. **Potentially Admissible Reasons:** Reasons must pertain *exclusively* to the welfare, interests, or fulfilment of *existing persons* (typically the Applicants themselves, or potentially existing siblings or close kin). Examples include: "To enhance our marital bond," "To provide companionship in our later years," "To fulfil a cultural expectation important to our family cohesion." The validity and weight of such reasons are assessed solely within Section D.

  **4. Completing Section C: Calculation of Non-Existence Benefit**
  4.1. This section quantifies the benefit arising from the *avoidance* of suffering inherent in non-existence.
  4.2. **C1: Identification of Potential Harms:** Applicants must list foreseeable types of suffering the potential child *might* experience if born (e.g., physical illness, mental distress, injury, grief, hardship). Evidence (e.g., family medical history, socioeconomic data) may be requested.
  4.3. **C2: Probability and Severity Weighting:** Assign probabilities (0-1.0) and severity scores (1-10, mild to catastrophic) to each listed harm, using ODT-provided tables. The ODT reserves the right to adjust weightings based on actuarial data.
  4.4. **C3: Calculation of Non-Existence Benefit (NEB):** The NEB is the sum of (Probability x Severity) for all listed harms. This represents the quantum of suffering *prevented* by non-existence.
  4.5. **Nature of the NEB:** The NEB is recorded as an **Untenanted Good**. It is a positive value on the procreation ledger, accruing *to no identifiable party or entity*. It signifies a state of affairs (absence of harm) that is intrinsically beneficial under the Principle, despite lacking a recipient. Enter the final NEB score in Box C3.7.

  **5. Completing Section D: Impact on Existing Persons**
  5.1. This section assesses the impact of procreation or non-procreation *solely* on the welfare of existing persons (primarily Applicants).
  5.2. **D1: Applicant Welfare Gain from Procreation:** Quantify the *net positive impact* on Applicants' welfare (happiness, fulfilment, life satisfaction) expected from having a child. This must be expressed as a numerical score (0-100).
      5.2.1. **Mandatory Discounts:** Apply the following standardised discounts to the initial welfare gain estimate:
          *   **Optimism Bias Discount (OBD):** 25% reduction. Reflects tendency to overestimate future happiness.
          *   **Hedonic Adaptation Discount (HAD):** 20% reduction. Reflects tendency to return to baseline happiness levels post-event.
          *   **Resource Burden Discount (RBD):** Variable (5-40%) based on Applicant income/circumstances. Reflects financial/time costs.
      5.2.2. Enter the final, discounted Net Welfare Gain (NWG) score in Box D1.5.
  5.3. **D2: Applicant Welfare Loss from Non-Procreation:** Quantify the *net negative impact* on Applicants' welfare expected from *not* having a child (e.g., regret, unfulfilled desire). Apply OBD and HAD as appropriate (direction reversed). Enter Net Welfare Loss (NWL) score in Box D2.3.
  5.4. **D3: Net Impact on Existing Persons (NEIP):** Calculate NEIP = (NWG) - (NWL). A positive NEIP favours procreation; a negative NEIP favours non-procreation.

  **6. Assessment and Licensing Decision**
  6.1. The ODT Decision Engine compares two sums:
      *   Sum A (Factors Favouring Non-Procreation): Non-Existence Benefit (NEB from C3.7).
      *   Sum B (Factors Favouring Procreation): Net Impact on Existing Persons (NEIP from D3).
  6.2. **Licence Granted IFF:** NEIP > NEB
      (Net Impact on Existing Persons exceeds the Non-Existence Benefit)
  6.3. **Licence Refused IFF:** NEB >= NEIP
      (Non-Existence Benefit equals or exceeds the Net Impact on Existing Persons)
  6.4. The potential child's own prospective quality of life, happiness, or suffering *as experienced by the child* forms no part of Sum B and cannot be used to offset the NEB in Sum A. The suffering prevented (NEB) and the benefits/harms to existing persons (NEIP) are the only admissible quantities.

  **7. Worked Examples**
  *   **Example 1 (Rejection):** Applicants state reason: "We want to give a child the wonderful childhood we never had." (Invalid per 3.2). NEB calculated as 35 (moderate risk profile). Applicants forecast high NWG (80 pre-discount). After OBD (25% = -20), HAD (20% of 60 = -12), RBD (20% of 48 = -9.6), NWG = 38.4. NWL estimated at 10. NEIP = 38.4 - 10 = 28.4. NEB (35) > NEIP (28.4). **Licence Refused.**
  *   **Example 2 (Grant):** Applicants state reason: "Strengthening family unit; expected long-term care support." (Valid per 3.3). NEB calculated as 20 (low risk profile). Applicants forecast moderate NWG (60 pre-discount). After OBD (25% = -15), HAD (20% of 45 = -9), RBD (15% of 36 = -5.4), NWG = 30.6. NWL estimated at 25 (strong cultural expectation). NEIP = 30.6 - 25 = 5.6. NEIP (5.6) > NEB (20)? **Correction:** NEIP (5.6) is *less than* NEB (20). **Licence Refused.** *(Amendment Note v3.1: Example 2 revised due to calculation error in prior version. Outcome corrected to refusal, demonstrating NEB dominance.)*

  **8. Revisions and Withdrawn Provisions**
  8.1. Clause 5.4 (Version 1.0) establishing a Minimum Welfare Threshold for the potential child was withdrawn. It improperly implied the child's welfare was a relevant beneficiary state.
  8.2. Clause 6.5 (Version 2.0) concerning Catastrophic Risk Protocols was withdrawn. While intended to address severe suffering, its formulation implicitly centred harm *to the child* as the decisive factor, contravening the Principle's reliance on non-existence benefit accruing *without* a subject.
  8.3. Annex B (Version 2.5) outlining Proxy-Consent Procedures was withdrawn entirely. The concept of proxy consent necessitates a subject *for* whom consent is proxied, which does not apply prior to existence (see 2.5).
  8.4. The ODT apologises for any confusion caused by these previous, non-compliant iterations.

  **Appendix A: Questions the ODT Has Declined To Answer (Non-Exhaustive)**
  A.1. Who is the beneficiary of the Non-Existence Benefit (NEB)?
  A.2. How can a 'good' exist without a recipient?
  A.3. Does the Principle imply a duty to prevent all future existence?
  A.4. How does the NEB interact with the cessation of existence (death)?
  A.5. What is the ontological status of the NEB within the government's accounting framework?
  A.6. Does the ODT consider its own continued existence, and the existence of its staff, to generate a Net Impact on Existing Persons (NEIP) that outweighs its operational NEB?

  **Issued by:** The Office for Demographic Transition, Holborn Tower, London WC1.
  **Enquiries:** Tel: 0300 100 3300 (Mon-Fri, 9am-5pm) | Email: enquiries@odt.gov.uk
  **Website:** www.gov.uk/odt
  **Date:** 1st October 2028
