     - (i) The rule must recommend cooperation in a prisoner's dilemma when facing a perfect copy of itself (or a very similar agent using the same rule), provided that the copy is reasoning similarly and the agent knows this.
     - (ii) Motivating case: Prisoner's dilemma with a near-exact copy. In such a case, if both agents reason the same way, they should both cooperate and get the mutual cooperation payoff. Defecting would lead to mutual defection, which is worse. This is the basis for functional decision theory (FDT) or similar approaches.
