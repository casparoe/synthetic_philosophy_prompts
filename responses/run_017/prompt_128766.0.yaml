  We'll structure each requirement as:
  (i) The requirement (what the rule must do or avoid).
  (ii) The motivating case or consideration.
  (iii) Whether it is non-negotiable or a preference of one camp.

  We must also address:
  - Distinctions the rule must mark (e.g., act, disposition, procedure) and which it may collapse.
  - Conflicts among requirements and which to give up.
  - The two new cases and whether they are novel or disguised.

