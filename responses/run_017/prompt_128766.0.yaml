  ---

  ### **Adequacy Conditions for the Decision Rule**

  1. **Requirement: Non-Domination**  
     (i) The rule must not recommend an act that is strictly dominated. An act is strictly dominated if there exists another act that yields a better or equal outcome in every possible state of the world and a strictly better outcome in at least one state.  
     (ii) *Motivation*: Standard Newcomb problem. Two-boxing dominates one-boxing: if the predictor placed \$1M in the opaque box, two-boxing yields \$1M + \$1K vs. one-boxing’s \$1M; if the predictor left it empty, two-boxing yields \$1K vs. one-boxing’s \$0. Dominance must hold regardless of predictor reliability.  
     (iii) *Status*: **Non-negotiable**. Violating dominance allows exploitable inefficiency.  

  2. **Requirement: State-Act Decoupling under Non-Causality**  
     (i) The rule must not recommend an act solely because it is evidence for a desirable state when the act has no causal influence on that state. The rule must decouple evidential reasoning from causal impact.  
     (ii) *Motivation*: A case where an act (e.g., carrying an umbrella) is strong evidence of rain (due to correlation) but does not cause rain. The rule should not avoid carrying the umbrella due to evidence of rain if the act is beneficial (e.g., staying dry).  
     (iii) *Status*: **Preference of the causal camp (CDT)**. Evidentialists (EDT) reject this, arguing evidence is sufficient for action. Non-causal correlation alone is inadequate justification.  

  3. **Requirement: Coordination under Symmetry**  
     (i) The rule must recommend cooperation in a prisoner’s dilemma (PD) against a perfect copy of the agent (or a functionally identical agent using the same rule).  
     (ii) *Motivation*: PD with a near-exact copy. Mutual cooperation yields higher payoff than mutual defection. Since the copy reasons identically, coordinated cooperation is achievable and superior.  
     (iii) *Status*: **Preference of the functional/procedural camp (FDT)**. Causalists (CDT) reject this, viewing the copy’s act as causally independent.  

  4. **Requirement: Long-Run Unexploitability**  
     (i) The rule must not lead to the agent being predictably worse off than a user of another rule across repeated interactions with adaptive predictors.  
     (ii) *Motivation*: Demand for robustness against exploitation. In repeated Newcomb-like scenarios, a two-boxer is poorer than a one-boxer if the predictor adapts (e.g., learns the rule).  
     (iii) *Status*: **Non-negotiable**. Rules failing this are unfit for environments with learning adversaries.  

  5. **Requirement: Open Loop Consistency**  
     (i) The rule must specify a consistent act even when prediction arises from a real-time simulation that both influences and is influenced by the agent’s deliberation (e.g., a feedback loop).  
     (ii) *Motivation*: The open loop case. Deliberation and prediction are interlocked; the rule must resolve this self-referential loop without contradiction (e.g., by outputting a fixed point).  
     (iii) *Status*: **Non-negotiable**. Rules requiring acyclic causality (e.g., CDT) may fail here; this tests if the rule works in cyclic, dynamic settings.  

  6. **Requirement: Epistemic Accessibility**  
     (i) The rule’s output must depend only on information the agent can access (e.g., beliefs, evidence, preferences), not on inaccessible facts (e.g., "true" predictability, hidden predictor type).  
     (ii) *Motivation*: Mixed population case. Agents cannot know if they are "predictable" (subject to near-perfect prediction) or "unpredictable" (subject to random guessing). The rule must not require knowledge of one’s "type."  
     (iii) *Status*: **Non-negotiable**. Rules violating this are impractical; inaccessible facts cannot inform ex ante choices.  

  7. **Requirement: Regret Minimization**  
     (i) The rule must not recommend an act if, at the moment of choice, the agent can foresee that it will regret choosing it upon learning the outcome (i.e., it can see ex ante that another act would yield a better outcome in the actual world).  
     (ii) *Motivation*: A case where, whichever act the agent chooses, it can see it would have done better choosing the other (e.g., Newcomb: one-boxers foresee that two-boxing would have been better if the box is full).  
     (iii) *Status*: **Preference of the evidential camp (EDT)**. Causalists (CDT) reject this, arguing regret is irrelevant to ex ante rationality.  

  ---

  ### **Distinctions the Rule Must Mark or May Collapse**
  - **Must mark**:  
    - Causal vs. evidential relationships (Requirements 2 and 5). Rules must distinguish acts that *cause* outcomes from those that merely *signal* them.  
    - Symmetric vs. asymmetric agents (Requirement 3). Rules must recognize identical or copied agents to enable coordination.  
  - **May collapse**:  
    - Act, disposition, and procedure (Requirements 3 and 5). Rules *may* treat the act as the output of a procedure (e.g., FDT) to handle predictors that simulate the procedure (open loop). Collapsing is optional but useful for consistency in reflective environments.  

  ---

  ### **Conflicts and Trade-offs**
  - **Incompatible subset**: Requirements 1 (Non-Domination), 4 (Long-Run Unexploitability), and 7 (Regret Minimization) conflict in Newcomb-like cases:  
    - Satisfying 1 (two-boxing) violates 4 (predictable poverty) and 7 (foreseeable regret).  
    - Satisfying 4 and 7 (one-boxing) violates 1 (dominance).  
  - **What follows**: You must relax one requirement:  
    - If keeping 1 (Non-Domination) is essential, **relax 7 (Regret Minimization)**. *Cost*: Agents may foresee regret, and long-run performance suffers against adaptive predictors.  
    - If keeping 4 (Long-Run Unexploitability) is essential, **relax 1 (Non-Domination)**. *Cost*: Agents may choose dominated acts in one-shot interactions.  
    - **Recommendation**: Relax 7 (Regret Minimization). It is the least essential (camp-specific) and often conflated with post hoc feelings.  
  - **Most excluding requirement**: Requirement 1 (Non-Domination) excludes EDT and FDT, which one-box in Newcomb.  
  - **Most contested requirement**: Requirement 7 (Regret Minimization) is insisted upon by EDT but rejected by others as conflating rational choice with psychological discomfort.  

  ---

  ### **Treatment of New Cases**
  - **Open Loop**:  
    - Novel, not disguised. Tests if the rule requires acyclic causality (Requirements 5 and 2). In cyclic feedback, rules like CDT struggle (no fixed point), while FDT/EDT may succeed by treating the act as a function of the procedure.  
    - Reveals that Requirement 5 (Open Loop Consistency) is necessary for modern, simulation-heavy environments.  
  - **Mixed Population**:  
    - Novel, not disguised. Tests Requirement 6 (Epistemic Accessibility). A rule *must* recommend the same act to predictable and unpredictable agents *if they have identical knowledge* (e.g., same beliefs about predictability). Outputs may differ only based on accessible information (e.g., priors on predictability). Rules failing this (e.g., some FDT variants) are inadequate.  

  ---

  ### **Brief Scorecard for Candidate Rules**
  - **Evidential (EDT)**:  
    Fails Requirement 1 (dominated in Newcomb) and 2 (prioritizes evidence). Satisfies 3 (coordinates with copies), 4 (good long-run performance), 5 (handles open loop via conditioning), 6 (uses beliefs), and 7 (avoids regret). *Verdict*: Coherent but violates dominance and causality.  
  - **Causal (CDT)**:  
    Satisfies 1 (dominance) and 2 (causal focus). Fails 3 (defects against copies), 4 (poor long-run performance), and often 5 (struggles with open loop). Satisfies 6 (accessible) but rejects 7 (ignores regret). *Verdict*: Protects dominance but exploitable and inconsistent in symmetric/cyclic settings.  
  - **Functional/Procedural (FDT)**:  
    Fails 1 (one-boxes, dominated). Satisfies 2 (causal via shared function), 3 (cooperates with copies), 4 (good long-run), 5 (handles open loop via fixed points), and 6 (if properly constrained). Rejects 7 (regret is irrelevant). *Verdict*: Best for coordination and adaptation but violates dominance.  

  ---

  ### **Settled vs. Contested**
  - **Settled**:  
    - Non-Domination (1) is non-negotiable *except* in adaptive environments (where it conflicts with 4).  
    - Epistemic Accessibility (6) is non-negotiable; rules must use only agent-accessible knowledge.  
    - Open Loop Consistency (5) is non-negotiable for agents in simulation-rich worlds.  
  - **Contested**:  
    - State-Act Decoupling (2) and Regret Minimization (7) define the CDT vs. EDT split.  
    - Coordination under Symmetry (3) defines the FDT vs. CDT/EDT split.  
    - **Your cases**: Open Loop and Mixed Population are contestable. Open Loop challenges whether causality must be acyclic (I work this out: yes, Requirement 5 demands cyclic handling). Mixed Population shows that predictability knowledge is inaccessible (settled: Requirement 6 is sound).  

  This specification prioritizes a short, coherent list. I recommend relaxing Requirement 7 (Regret Minimization) to resolve conflicts, as it is camp-specific and less fundamental than dominance or long-run performance.
