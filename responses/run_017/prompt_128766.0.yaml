  **The Two New Cases**:

  - The open loop case is not a disguised familiar case. It reveals a need for the rule to handle fixed points in simulations, which is not required in acyclic cases.
  - The mixed population case is also novel and tests the rule's dependence on inaccessible facts. It separates rules that condition on the agent's type (which might be unknown) from those that don't.

  **Final Scorecard (Brief)**:

  - **EDT**: Fails Non-Domination (1) and Causal Foundation (2). Satisfies Coordination with Copies (3) and Long-Run Unexploitability (4). Likely satisfies Open Loop Consistency (5) and Epistemic Accessibility (6).
  - **CDT**: Satisfies Non-Domination (1) and Causal Foundation (2). Fails Coordination with Copies (3) and Long-Run Unexploitability (4). May fail Open Loop Consistency (5) due to cyclic causality. Satisfies Epistemic Accessibility (6).
