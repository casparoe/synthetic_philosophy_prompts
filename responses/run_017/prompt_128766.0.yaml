  We present the list as:

  **Adequacy Conditions List**

  1. **Non-Domination**
     - Requirement: The rule must not recommend an act that is strictly dominated by another act, i.e., there must be no other act that yields at least as good an outcome in every possible state and strictly better in some.
     - Motivating case: Standard Newcomb problem. Two-boxing dominates one-boxing.
     - Status: Non-negotiable (but see note below: this is the requirement that causes conflict with long-run performance).

  2. **Causal Foundation**
     - Requirement: The rule must base the evaluation of acts on their causal consequences, not on their value as evidence when that evidence does not reflect causation.
     - Motivating case: The disease testing case (or a case where an act is evidence of a bad state it doesn't cause).
     - Status: Preference of the causal camp (CDT). Contested.

  3. **Coordination with Copies**
     - Requirement: In a prisoner's dilemma with a perfect copy (or an agent using the same rule), the rule must recommend cooperation.
     - Motivating case: Prisoner's dilemma with a near-exact copy.
     - Status: Preference of the FDT camp. Contested.

  4. **Long-Run Unexploitability**
     - Requirement: In a long series of similar choices against an adaptive predictor, the rule must not yield lower total utility than some other rule, when the predictor can adapt to the rule.
     - Motivating case: Repeated Newcomb problem with an adaptive predictor.
     - Status: Non-negotiable for rules that must perform well in repeated interactions.

  5. **Open Loop Consistency**
     - Requirement: The rule must define a consistent choice in the open loop scenario (with real-time simulation and feedback).
     - Motivating case: The open loop case.
     - Status: Non-negotiable.

  6. **Epistemic Accessibility**
     - Requirement: The rule's output must depend only on the agent's knowledge (beliefs and preferences), not on facts that are inaccessible to the agent.
     - Motivating case: The mixed population case, where the agent does not know if it is predictable.
     - Status: Non-negotiable.

