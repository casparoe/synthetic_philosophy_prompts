  **Adequacy Conditions for the Decision Rule**

  1. **Requirement: Act-State Independence (Non-Exploitation by Prediction)**
     - (i) The rule must not recommend an act that is dominated in the sense that there is another act that yields at least as good an outcome in every state and strictly better in some, even when the state is predicted by a reliable forecaster.
     - (ii) Motivating case: Standard Newcomb problem with a highly reliable predictor. The rule should not recommend taking only one box if two-boxing yields strictly more money regardless of what the predictor has done. This is because the agent cannot change the prediction by their act (the prediction is already made and the money is either in the box or not). Taking only one box is dominated by two-boxing: if the predictor put $1M in the opaque box, two-boxing gets $1M+$1K and one-boxing gets $1M; if the predictor put $0, two-boxing gets $1K and one-boxing gets $0. So two-boxing is always at least as good and strictly better in one case.
     - (iii) Non-negotiable? This is a requirement of dominance and is non-negotiable for many. However, note that in the Newcomb problem, one-boxing does better in expectation if the predictor is reliable, so some (evidentialists) might argue that the rule should sometimes ignore dominance if the evidence is strong enough. But the requirement as stated (avoiding dominated acts) is a standard non-negotiable in decision theory.

  2. **Requirement: Evidence-Causation Distinction**
     - (i) The rule must not recommend an act solely because it is evidence for a good state when the act has no causal tendency to produce that state.
     - (ii) Motivating case: A case where an available act is strong evidence of a bad state it has no causal tendency to produce. Example: Suppose there is a disease that is more common in people with a certain gene. Taking a test for the gene is evidence of having the gene (if you take the test, you are more likely to have the gene because people without the gene don't bother testing) but taking the test does not cause the gene. The rule should not avoid taking the test just because it would be evidence of having the gene (if the test is useful for treatment). The act (testing) is evidence of the bad state (having the gene) but does not cause it. We require that the rule base the decision on the causal consequences, not the evidential ones.
     - (iii) Non-negotiable? This is a core point of contention. Causal decision theorists (CDT) hold this as non-negotiable, while evidential decision theorists (EDT) do not. Therefore, we mark it as a preference of the causal camp. However, note that in the disease example, avoiding the test due to evidence might lead to worse outcomes (if the test can lead to effective treatment). So in that case, EDT might also recommend taking the test if the benefits outweigh the evidential concerns? Actually, EDT would condition on the act and see that P(gene|test) is high, but also condition on the act to see the consequences (treatment). So it might still recommend testing. The requirement is meant to rule out cases where the act is evidence but has no causal effect on the state and the state is bad. But the example is complex. We might reframe: the rule must not be swayed by evidence that is not causally connected. But this is exactly the CDT/EDT divide. So it is contested.

