          - So in S1: value-function is -10.

          - But at the next step, when in the terminal state, we don't consider.

   So in both episodes, at S1, the value-function account says suffering, while the reward-as-valence account says neutral.

   In the delivered episode at S2, the value-function account says neutral, while the reward-as-valence account says suffering.

