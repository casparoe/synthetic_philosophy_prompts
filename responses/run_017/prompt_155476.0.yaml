  I'll organize the response around their five leads, adding core distinctions and doctrinal anchors. The "mirror case" requires handling asymmetrical power dynamics without resorting to pure consequentialism. The "re-enactment case" demands locating harm beyond speaker intent. The "export case" forces territorial clarity about harm's locus. The "cumulative case" needs thresholds for aggregation. And the core distinction (content/effect/revelation) must remain sharp. 

