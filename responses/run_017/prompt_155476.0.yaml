answer: |-
  Here is a specification of desiderata for an adequate theory of hate speech restriction suitable for statutory drafting, addressing your explicit leads and constraints, written in British English:

  **Core Purpose:** The theory must yield a statutory definition that courts can apply determinatively to specific utterances without recourse to open-ended balancing tests in each case. Vagueness and requirements to "weigh all circumstances" are disqualifying flaws.

  **I. Non-Negotiable Requirements (Neutral Ground):**
  These must be satisfied by any theory claiming adequacy across traditions.

  1.  **The Mirror Distinction Requirement (Mirror Case):**
      *   **Requirement:** The theory must provide a principled basis for treating the *same proposition* differently when uttered by a member of a historically dominant group targeting a vulnerable minority versus when uttered by a member of that minority targeting the dominant group. This basis *cannot* rely solely on contemporary assessments of relative group vulnerability or need for protection.
      *   **Case Driver:** Mirror case – identical words, different speakers/groups.
      *   **Why Non-Negotiable:** Fundamental to addressing systemic inequality without collapsing into pure consequentialism or viewpoint discrimination. A statute must articulate *why* context (historical power, vulnerability) matters objectively, not subjectively per case.

  2.  **The Non-Endorsement Harm Requirement (Re-enactment Case):**
      *   **Requirement:** The theory must locate the potential wrong/harm of hate speech in a manner that can persist even when the *speaker explicitly denounces* the content they are disseminating (e.g., quoting, staging, singing hateful material for critique, education, or artistic purposes). The wrong cannot reside *solely* in the speaker's subjective endorsement or intent to promote hatred.
      *   **Case Driver:** Re-enactment case – harmful words repeated by a critic.
      *   **Why Non-Negotiable:** Essential to address the reality that the harm of certain utterances can stem from their utterance *per se* or their impact on audiences/environment, irrespective of the speaker's immediate purpose. A statute needs objective criteria beyond speaker intent.

  3.  **The Territorial Harm Locus Requirement (Export Case):**
      *   **Requirement:** The theory must explicitly locate the primary harm justifying restriction – whether it resides inherently in the *speaker's act*, in the *impact on the audience/receivers*, or in the *degradation of the public environment*. This must logically resolve conflicts where an utterance is lawful at point of origin but harmful (and unlawful) at point of reception, and vice-versa.
      *   **Case Driver:** Export case – cross-border transmission, differing legality.
      *   **Why Non-Negotiable:** Critical for jurisdiction and statutory reach. A workable statute must define *where* and *on whom* the operative harm occurs to determine applicability and resolve conflicts of laws.

  4.  **The Content/Effect/Revelation Distinction Requirement:**
      *   **Requirement:** The theory must maintain a clear conceptual and operational distinction between:
          (a) Restricting speech based *solely on its content* (the ideas/viewpoints expressed).
          (b) Restricting speech based on its *likely effects or consequences* (incitement, intimidation, harassment).
          (c) Restricting speech based on what it *reveals about the speaker's future dangerousness* (e.g., as evidence of intent to commit violence).
      *   **Consideration Driver:** Foundational doctrinal clarity; different justifications and burdens apply.
      *   **Why Non-Negotiable:** Blurring these leads to overbreadth, vagueness, and undermines core free expression principles. A statute must pinpoint *which* rationale it employs for any given restriction.

  **II. Highly Problematic Requirement (Tension with Statutory Feasibility):**
  5.  **The Aggregate Harm Threshold Requirement (Cumulative Case):**
      *   **Requirement:** The theory must account for scenarios where the *only significant harm* arises from the *aggregate effect* of numerous individually trivial or non-actionable utterances.
      *   **Case Driver:** Cumulative case – many minor utterances creating a hostile environment.
      *   **Status:** **Preference (European-leaning Camp).** Often presented as a demand of reason/empiricism (recognising systemic harm), but its statutory implementation inherently conflicts with the core purpose.
      *   **Conflict:** Satisfying this *without* open-ended balancing or intolerable vagueness (e.g., defining the threshold number/impact) is likely impossible for a court-applicable statute. It pushes towards context-dependent weighing.

  **III. Tradition-Specific Requirements (Often Masked as Neutral):**
  6.  **The Strict Causal Link Requirement (American Tradition Commitment):**
      *   **Requirement:** Restrictions based on harmful *effects* (as distinct from content *per se*) must require proof of a direct, imminent, and likely causal link between the specific speech act and concrete, unlawful harm (e.g., violence, discrimination). Mere propensity or contribution to a hostile environment is insufficient.
      *   **Case Driver:** Incitement doctrine (e.g., *Brandenburg* logic); rejection of group defamation/atmosphere theories.
      *   **Status:** **Commitment of the American Camp.** Presented as a demand of clarity and avoiding viewpoint suppression, but is a specific doctrinal choice prioritising speaker liberty over collective dignity/harm prevention absent immediate danger.

  7.  **The Dignity/Equality Protection Requirement (European Tradition Commitment):**
      *   **Requirement:** The state has a positive obligation to protect individual dignity and ensure substantive equality, which justifies restricting speech that degrades, insults, or intimidates individuals based on group membership, *even without proof* of imminent unlawful acts or direct incitement by that specific utterance.
      *   **Case Driver:** Human dignity as foundational value; recognition of group-based harms and systemic discrimination.
      *   **Status:** **Commitment of the European Camp.** Presented as a demand of reason (recognising inherent harm to dignity and equality), but is a specific value choice prioritising collective protection and social harmony over absolute speaker autonomy regarding certain content.

  **Analysis & Trade-offs:**

  *   **The Likely Insoluble Trio:** Satisfying **Non-Endorsement Harm (2)**, **Aggregate Harm (5)**, and **Strict Causal Link (6)** simultaneously is probably impossible within the statutory constraint.
      *   (2) requires harm beyond intent.
      *   (5) requires recognising diffuse, cumulative harm.
      *   (6) requires direct, imminent causation for effect-based restrictions.
      *   (5) inherently conflicts with (6). If (6) is relaxed to accommodate (5), it conflicts with the statutory aim of avoiding balancing.
  *   **Recommendation for Sacrifice:** Abandon **Requirement 5 (Aggregate Harm)** as a *statutory* requirement. **Cost:** The statute would fail to directly address a significant source of harm (the cumulative hostile environment). This harm must then be tackled through other legal mechanisms (e.g., employment law, education policy) or tolerated as a necessary cost of clarity and liberty. It acknowledges the statute's limitation to more discrete harms.
  *   **The Speaker Culpability Filter:** **Requirement 6 (Strict Causal Link)** is the requirement that excludes the largest share of existing positions, particularly those dominant in Europe and Canada. Most regulatory regimes globally do *not* require proof that a specific hateful utterance was *both* intended and likely to cause *imminent* unlawful action. This requirement filters out all approaches based primarily on protecting dignity, group standing, or preventing a general climate of hatred/intimidation unless tied to a very narrow imminent danger test. It is the core doctrinal divide made explicit.

  **Conclusion for Statutory Drafting:** A viable statute must navigate the Mirror Case with a principled, history-conscious asymmetry, define harm independently of speaker endorsement to handle Re-enactment, clearly anchor harm territorially for the Export Case, and rigorously maintain the distinctions between content, effect, and revelation. It must choose between the American commitment to near-absolute protection absent imminent harm (sacrificing direct redress for cumulative/dignity harms) or the European commitment to dignity protection (sacrificing bright-line causal certainty and accepting more potential viewpoint interference). The Aggregate Harm requirement is the poison pill for statutory determinism.
