answer: |-
  ### Plan for 45-Minute Lunch-and-Learn on Hofstadter's Typogenetics

  #### **Core Goal**  
  Convey that a self-replicating typogenome and a Gödel sentence are the **same strange loop** — self-reference via encoding. Prioritize clarity over completeness.

  ---

  ### **Sequence of Concepts (30-35 mins)**  
  **Why this order?** Build from familiar (string operations) to unfamiliar (self-replication loop). Misconceptions arise if operations/folding are skipped or reversed.

  1. **String-Rewriting Rules (5 mins)**  
     - **Start here**: Backend devs know strings/transformations (like regex).  
     - **Cover**: Bases (`A,C,G,T`), complementary strand rules (e.g., `A→T`, `C→G`), and basic operations (`cop`, `cut`, `del`, `swi`).  
     - **Demo**: Hand-draw a short strand (e.g., `AAG`) being copied to `AAG/TTC`.  
     - **Why first?** Establishes Typogenetics as a string-rewriting system. Skipping this risks "biology is arithmetic" misconception later.

  2. **Enzymes as Operations on Strings (5 mins)**  
     - **Cover**: Enzymes are sequences of commands (e.g., `[cop, swi, off]`). Show how an enzyme acts step-by-step on a strand.  
     - **Demo**: Enzyme `[cop, off]` applied to `CG` → `CG/GC`.  
     - **Head off CPU misconception**: Explicitly state: *"Enzymes are like functions that transform input strings. The genome isn’t ‘executed’—it’s data acted upon by enzymes."*

  3. **Folding: From Genome to Enzyme (10 mins)**  
     - **Cover**: How a genome strand folds into a 2D shape via base-pairing (e.g., `A-T`, `C-G`), with unpaired bases defining enzyme commands.  
     - **Demo**: Fold a short genome (e.g., `GCTA` → enzyme `[r, cop]`).  
     - **Why now?** Folding converts passive data (genome) into active operations (enzyme). Delaying this breaks the loop explanation.  
     - **Head off "compile step" misconception**: *"Folding is interpretation, not compilation. The genome is both data and code, but enzymes do the work."*

  4. **Self-Replication Loop (10-15 mins)**  
     - **Cover**: A genome specifies enzymes that replicate the genome itself.  
     - **Use the book’s typogenome**: `gctagctc` (short enough for slides).  
       - Step 1: Fold `gctagctc` → Enzyme 1 (`[r, r, r, r, cut]`) and Enzyme 2 (`[l, l, l, l, cop, off]`).  
       - Step 2: Enzyme 1 cuts `gctagctc` → `gcta` + `gctc`.  
       - Step 3: Enzyme 2 copies `gcta` and `gctc` → reassembles `gctagctc`.  
     - **Highlight the loop**: Genome → Enzymes → Replicated genome.  
     - **Connect to Gödel**: *"Like a Gödel sentence encoding ‘I cannot be proven,’ this genome encodes ‘I can be replicated.’ Both are self-referential via encoding."*  
     - **Head off "just a metaphor"**: *"This is a formal isomorphism: both use syntactic rules to bootstrap self-reference."*

  ---

  ### **The Typogenome to Use**  
  - **Choice**: Hofstadter’s `gctagctc` (from GEB, p. 511).  
  - **Why?**  
    - Short (8 bases), fits on a slide.  
    - Self-replicates with 2 enzymes (clear loop).  
    - Avoids complexity (e.g., no multi-step replication).  
  - **If pressed for time**: Pre-draw folding and enzyme steps. Say: *"We’ll simulate this live in the interpreter later!"*

  ---

  ### **Handling Misconceptions**  
  - **"DNA is literally a formal system"**:  
    - **When**: During string rewriting (minimize jargon).  
    - **Response**: *"This is an abstraction—real biology is messier. We’re exploring formal self-reference."*  
  - **"It’s only a metaphor"**:  
    - **When**: During self-replication demo.  
    - **Response**: *"Hofstadter shows this is isomorphic to Gödel’s proof. Both use encoding to create loops."*  
  - **Enzymes as "CPU executing code"** (most critical):  
    - **When**: When introducing enzymes.  
    - **Response**: *"Enzymes aren’t ‘running the genome’—they’re separate operations that happen to be derived from the genome. The genome is their input."*

  ---

  ### **Closing Question to Test Understanding (5 mins)**  
  - **Question**: *"How is this self-replicating genome like a Gödel sentence that says ‘I cannot be proven’?"*  
  - **Expected Insight**: Both encode a self-referential claim (replication/unprovability) within the system’s rules. If they see the loop (genome/sentence as both product and author), you succeeded.

  ---

  ### **What to Explicitly Skip**  
  - **State upfront**: *"We’re skipping real molecular biology (e.g., ribosomes) and Gödel numbering details. Focus on the strange loop: self-replication ≈ self-reference."*  
  - **Why?**: Deep dives derail the core point. Offer resources instead (e.g., GEB chapters).

  ---

  ### **Why This Flow Works**  
  - **Folding before self-replication**: Enzymes must "emerge" from the genome to avoid the CPU misconception.  
  - **String ops first**: Grounds abstraction in familiar territory.  
  - **`gctagctc`**: Minimal, booksourced, and visually traceable.  

  **Pro tip**: End by running your interpreter on `gctagctc` to cement the loop. Say: *"This is a quine in a biological guise!"*
