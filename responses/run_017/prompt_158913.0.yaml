prompt: |-
  Question for anyone who works on this stuff — please answer in British English, it's going into a seminar handout.

  I teach a grad seminar on naturalizing mental content, and I keep hitting the same frustration in the readings and in seminar, and I want a word for it. I'm going to describe it without the jargon on purpose: every time I use the jargon someone says "oh, that's just the disjunction problem" or "that's the generality problem again", the conversation stops, and I don't think either of those is quite what I've got.

  Here's the pattern. Take a fairly simple signalling system — a vervet alarm call, or whatever state of a frog's visual system triggers the tongue flick. To say what that state is *about* you apparently need two things: a story about what the mechanism was built or selected to do, and a story about what the creature is currently using it to track. What I keep noticing is that these two stories get adjusted to fit each other, and adjusted until the answer comes out as "leopard" or "fly" — i.e. until it matches what we were going to say anyway. Press on the history story ("why not: selected for tracking leopard-shaped things, or aerial hazards?") and the answer comes back in terms of what the downstream system needs. Press on the downstream story ("why not: it causes climbing behaviour, so why isn't the content *climb now*?") and the answer comes back in terms of the history. Neither story seems to do independant work; each is calibrated against the other, and both are calibrated against the content we antecedently wanted. The machinery looks like it's deriving a content when it's really being tuned until it outputs one.

  Two more places I see it, which is why I think it's one thing and not two:

  (a) Co-opted mechanisms — a trait that was shaped for one job and is now used for another. Here the history story and the current-use story genuinely come apart, and people either go quiet or quietly pick whichever one gives the intuitive answer for the case in front of them.

  (b) The grain question — "leopard" vs "predator" vs "danger from above" vs "get into a tree". Nothing in the naturalistic machinery seems to fix the grain; what fixes it is what makes the creature's behaviour come out successful in the cases we've already picked as the paradigm ones.

  So: does this have a name? I've got "the calibration loop" in my notes, which I'm sure its not. But I want more than a label anyway — I've had enough of labels ending discussions. Specifically:

  1. What are the nearest established things, and how does mine differ from each? I keep being told the disjunction problem and the generality problem; I want to know exactly why mine isn't just one of them, or if it is, which one and in what respect.
  2. Is this best thought of as a circularity objection, an indeterminacy objection, an underdetermination objection, or something else? Those feel like different objections with different cures, and I'm not sure which one I actually have.
  3. Is it fatal, or just a constraint on how a theory of this kind has to be stated? I have a suspicion the answer turns on whether the machinery was supposed to *generate* content ascriptions from scratch as opposed to systematising ones we already make, but I can't say why.
  4. What would the boundary cases look like: a case where the mutual adjustment is legitimate (the two stories genuinely converge for reasons that don't presuppose the answer) versus a case where it's just curve-fitting? If I can't tell those apart I don't have an objection at all, and I'd rather know that than go on waving my hands.

  If there's genuinely no established term, coin one, define it, give me the boundary cases, and tell me what I'd have to find to convince myself it had been noticed before. And please write it in British English, and go light on the bibliography — I can find the reading myself, I just want the carving.
reasoning: |-
  Okay, this is a fascinating and sharply articulated problem from someone clearly deep in the trenches of philosophy of mind. Let me unpack what they're really asking. 

  First, the core frustration: they've spotted a methodological loop in naturalized content theories where evolutionary history and current functional role get mutually adjusted until they land on commonsense content attributions ("leopard!"), but neither anchor seems genuinely independent. The user is palpably annoyed by colleagues dismissing this as "just disjunction/generality problem" - they want precision about why their concern is distinct.

  Three things stand out about their request:
  1) It's pedagogical - they need clear British English for grad students, not jargon-laden citations.
  2) They demand conceptual surgery: not just a label but boundary cases and taxonomy.
  3) There's suppressed ambition here - they hint this might reveal if naturalizing projects are systematizing vs generating content.

  Hmm... dissecting their examples:
  - The vervet/frog cases show the calibration loop in action
  - Co-opted mechanisms (like exaptations) break the history/current-use link
  - Grain problems reveal the "success paradigm" driving content ascriptions

  For established concepts: 
  Disjunction problem is about error vs non-error cases (fly-or-bee?), but this is about the dual anchoring of content. Generality problem is about which causal chain to pick, but here it's about interdependence of two types of chains. Different beasts entirely.

  This feels like a circularity objection with extra steps - not just "A depends on B which depends on A" but "A and B are tuned to match pre-theoretic C". The fatalism question is key: if the loop is benign calibration, fine; if it's vicious circularity, catastrophic.

  Boundary cases would need:
  - Benign: History/current-use converge for reasons traceable without content presuppositions (e.g. mathematical models showing robust alignment)
  - Vicious: Cases where forced convergence contradicts empirical evidence (say, a trait with clear historical function X but current use Y, yet theorists insist on Z)

  Ah - and they're absolutely right that the systematize/generate distinction matters. If the project is descriptive (fitting existing content ascriptions), the loop might be acceptable; if revisionary (deriving content from scratch), it's deadly.

  For naming... "calibration loop" isn't bad actually. "Content triangulation" risks confusion with Davidson. "Double-Anchor Dilemma" captures the two-point instability. But perhaps "Teleosemantic Tuning" - plays on "curve-fitting" while nodding to the tradition.

  Final thought: The co-opted mechanism case is the litmus test. Any theory that can't cleanly handle exaptations without ad-hocery is likely guilty of the tuning they describe.
answer: |-
  Right, let's tackle this head-on. What you're describing is a recognised and substantive issue in naturalised theories of content, particularly teleosemantics. It doesn't have a single universally accepted name, but your intuition that it's distinct from the disjunction and generality problems is spot on. I'll address your points directly in British English, as requested.

  **1. What is this, and how does it differ from established problems?**  
  Your core observation is the **mutual calibration problem** (or **teleosemantic calibration**, if you prefer). It highlights how appeals to *selected function* (history) and *current functional role* (downstream effects) are often adjusted *retrospectively* to match pre-theoretic content ascriptions ("leopard", "fly"), rather than independently determining content.

  *   **Difference from the Disjunction Problem:**  
      The disjunction problem asks how a state can be *about* flies (not fly-or-bee-disjunctions) when it fires in the presence of both flies (true positives) and bees (false positives). It's about **distinguishing error from broad content**. Your problem arises *before* that: even if we agree the state is reliably caused by flies (no disjunction error), **why is its content "fly" rather than "nutritious speck", "tongue-flick trigger", or "small dark moving thing"?** The disjunction problem assumes we have a candidate content; your problem questions how that candidate is fixed in the first place by the naturalistic machinery.

  *   **Difference from the Generality Problem (for mental causation/function):**  
      The generality problem asks *which* causal chain or *which* level of functional description (e.g., "detecting danger" vs. "detecting leopards" vs. "detecting leopard-shaped stimuli") is relevant for attributing content or function. It's about **selecting the right grain from a hierarchy of possibilities**. Your problem is deeper: it shows that **the two primary anchors for *fixing* that grain (history and current role) are not independent**, but are co-adjusted to hit the "right" (pre-theoretic) answer. The machinery lacks internal principles to settle the grain; it relies on external calibration against intuitive success.

  **2. Is this circularity, indeterminacy, underdetermination, or something else?**  
  It's primarily a **methodological circularity** or **calibration objection**, shading into **indeterminacy/underdetermination**.

  *   **Circularity:** There's a risk of **explanatory circularity**. The content ("leopard") is presupposed when interpreting *both* the selection history ("well, *obviously* selection favoured leopard-detection, not just leopard-shaped-thing-detection, because *leopards* were the threat") *and* the downstream effects ("the *point* of the call is to avoid *leopards*, not just to climb trees"). The "success" invoked is success *relative to avoiding leopards*. The naturalistic criteria seem to be applied in a way that assumes the very content they are meant to derive.
  *   **Indeterminacy/Underdetermination:** The biological facts (history, mechanism structure, current causal links) **underdetermine a unique content ascription**. Multiple candidate contents ("predator", "aerial hazard", "climb-now signal") seem compatible with the facts. The theory lacks a principled way to select *which* grain or category is the content. The calibration *masks* this underdetermination by ensuring the output matches intuition.

  **3. Is it fatal, or just a constraint?**  
  This hinges **crucially** on the project's goal, as you suspect.

  *   **If the goal is to *generate* or *reduce* content from non-intentional scratch:** It looks **potentially fatal**. The mutual calibration suggests the naturalistic criteria are not doing the heavy lifting independently. Intuition about content is driving the interpretation of the biological data, meaning content hasn't truly been naturalised – it's been presupposed.
  *   **If the goal is to *systematise* or *vindicate* our existing content ascriptions:** It might be **a manageable constraint**. The calibration loop could reflect how our successful content ascriptions are *supported by* converging evidence from history and current function, even if the process isn't perfectly algorithmic. The loop isn't vicious if we accept that content ascription is partly interpretive and the biological facts *constrain* plausible interpretations (ruling out some candidates) rather than uniquely determining one.

  **4. Boundary Cases: Legitimate Convergence vs. Curve-Fitting**  
  Distinguishing these is key. Look for **independent traction** and **explanatory power**.

  *   **Legitimate Convergence (Benign Calibration):**  
      *   **Scenario:** A mechanism has a clear, specific structural adaptation (e.g., specialised retinal cells in the frog tuned to specific fly-size/shape/speed parameters). Its *only* significant downstream effect is triggering tongue-flicks, which *only* successfully captures items fitting that specific parameter profile. Selection pressures are independently identifiable (e.g., fossil/predation records show flies were the primary small airborne nutrient source; no similar-sized aerial threats existed). History, structure, *and* current success robustly converge on "fly" without needing to fudge either story.
      *   **Hallmarks:** Narrow structural specificity; highly constrained downstream effects; historical pressures identifiable without presupposing the content; convergence feels *forced* by the evidence, not chosen for convenience. Explanatory power: Attributing "fly" explains *why* the mechanism has *this* specific structure and *why* it's linked to *that* behaviour.

  *   **Curve-Fitting (Vicious Calibration):**  
      *   **Scenario:** A vervet alarm call is triggered by large, dark, moving shapes overhead. It causes scattering and climbing. Selection history is complex (predation pressure from eagles, leopards, falling branches). Downstream effects are varied (climbing trees avoids leopards but *exposes* to eagles; scattering avoids eagles but *exposes* to leopards). Theorists insist the content is "leopard!" because leopards are salient *to us*, adjusting the history story ("it was *primarily* selected for leopards, eagles were secondary") and the downstream story ("the *real* function is leopard-avoidance, even if it sometimes fails or causes eagle deaths") to hit that target.
      *   **Hallmarks:** Broad structural sensitivity; diverse or context-dependent downstream effects; ambiguous or multi-faceted selection history; convergence feels *arbitrary* or requires downplaying counter-evidence; alternative ascriptions ("aerial hazard!", "large predator!", "panic!") seem equally compatible. Explanatory power: Attributing "leopard" doesn't clearly explain the structure or the full range of behavioural outcomes better than alternatives.

  **The Coined Term & Final Thoughts**  
  **"The Calibration Objection"** (or **"Teleosemantic Calibration"**) serves well. Define it as:  
  *The problem arising when appeals to selection history and current functional role, intended to naturalistically fix mental content, are mutually adjusted in a way that presupposes the target content attribution, rather than providing independent, convergent evidence for it. This risks methodological circularity and masks underlying indeterminacy in content grain.*

  *   **Why not established?** It's often submerged within discussions of indeterminacy or circularity in teleosemantics (e.g., lurking in critiques by Fodor, Sterelny, or Godfrey-Smith), but rarely isolated as the core methodological flaw you describe. Your focus on the *mutual adjustment* rather than just the *outcome* (indeterminacy) clarifies why it feels distinct from the disjunction/generality problems.
  *   **To find prior notice:** Look for discussions where critics point out that teleosemanticists seem to "help themselves" to the right answer when interpreting history or function. Key phrases might be "presupposes the content", "explanatorily circular", or "motivated reasoning" in applying the theory. Work challenging the determinacy of "proper function" (e.g., Buller, Davies) often brushes against it. Your co-opted mechanism case is a powerful instance – theorists *do* often arbitrarily favour history *or* current use based on desired content.
  *   **In the Seminar:** Frame it as a challenge about *methodological rigour*: Can teleosemantics avoid simply redescribing our intuitive content ascriptions using biological language, or can it provide genuinely independent criteria that *constrain* or *determine* content? Boundary cases force students to think about what *counts* as independent evidence for a specific content grain. It doesn't necessarily sink naturalisation, but it highlights the need for extreme care in applying the criteria and the potential limits of reduction.
