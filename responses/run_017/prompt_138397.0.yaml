answer: |-
  ## Sestina for the Aggregates at Dusk

  The wind insists through shifting *rupa*, trees,
  This ache within the ribs is just *vedana*.
  The naming mind assigns the bird its cry – *sanna*.
  The impulse then to note it down: *sankhara*.
  The knowing of the sound as bird? *Vinnana*.
  No watcher stands behind the shade. Observe the *flame*.

  This lamp’s soft flicker, just a hungry *flame*,
  Depends on wax and wick, on steady *rupa*.
  Its light, a brief and knowing *vinnana*,
  Requires the heat, the fuel’s raw *vedana*.
  The burning is sustained by subtle *sankhara*,
  Perceived as "lamp" by patterned *sanna*.

  This pattern, old as breath, this clinging *sanna*,
  Sees "me" persist, a solitary *flame*.
  But habits knit the self from tangled *sankhara*,
  From bone and breath and sight, this fleeting *rupa*,
  From pleasure grasped and pain endured – *vedana* –
  And knowing’s flicker, empty *vinnana*.

  No core, just currents. Shifting *vinnana*
  Reflects the forms that shifting *sanna* names.
  The itch to scratch, the cool relief – *vedana* –
  Appears, then fades. Like sparks from one bright *flame*,
  That touch two wicks at once. This fragile *rupa*,
  This forming impulse, ceaseless *sankhara*...

  The habit’s pull, the will to act: *sankhara*
  Projects the next brief knowing, *vinnana*.
  The body ages, alters – fragile *rupa*.
  The mind recalls a face: old *sanna*.
  Two candles catch the dying *flame*.
  Whose warmth is felt? Whose *vedana*?

  Whose ache persists? Whose subtle *vedana*?
  Whose deeds bear fruit? Whose hidden *sankhara*?
  Two lights now dance where burned one *flame*.
  Each knowing moment, new *vinnana*,
  Built on the ghost of fading *sanna*,
  Built on the crumbling earth of *rupa*.

  If "self" is just a name for *rupa*,
  For transient *vedana*, for patterned *sanna*,
  For fleeting *sankhara*, for knowing *vinnana* –
  A process burning like a borrowed *flame* –
  Then who walks free? For whom the path's proclaimed?
  The dying *flame* ignites two separate lights.

  No soul in *vinnana*, just patterns shifting like *sanna*.
  Whose freedom dawns? The *flame*? The *rupa*? Whose *vedana*?
  The *sankhara* unwind. Whose path? Consumed, the *flame*.
