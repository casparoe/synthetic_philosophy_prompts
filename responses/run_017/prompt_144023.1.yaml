prompt: |-
  i'm in an indian epistemology course right now and we're doing the nyaya stuff on pramanas, and i realised i've been lowkey sorting cases by a rule i can't actually state. help me state it, or tell me my verdicts are a mess.

  the set-up we were given: a pramana is a source of a *new* true cognition; the nyaya list is four — pratyaksha (perception), anumana (inference, which runs through an invariable concomitance like smoke-with-fire), upamana (comparison: coming to know what a word denotes from its similarity to something you remember), and shabda (testimony: coming to know something from understanding what a trustworthy speaker said). memory and tarka — the "if there were no fire there'd be no smoke" kind of backing-reasoning — are supposed not to be pramanas.

  here are my gut verdicts, and i've included the ones i'm shaky on because i think those are where the rule shows:

  1. smoke on the hill, so fire on the hill: anumana, no drama.
  2. my roommate texts "the 6:15 is cancelled" and i come to know it: shabda. i know i *saw* pixels, but that's not where the knowledge comes from.
  3. i see a guy's face across the street and after half a second realise it's my old roommate from six years ago: i want to say pratyaksha, and that the memory doing the recognising isn't a pramana. but it feels like the memory is load-bearing in a way that "just a causal condition" doesn't capture. verdict: perception, but grudgingly.
  4. a printed sign reading BRIDGE OUT on a road i'm driving down: shabda, not perception — even though i read it with my eyes and there's no speaker in the room.
  5. i glance at the counter and come to know my keys aren't there: i really don't want to call this inference (what's the pervasion?), and "perception of an absence" sounds like a dodge, but i also don't want to add a fifth pramana just to save this one case.
  6. i read 38.2 off a thermometer and come to know i have a fever: my verdict is pratyaksha. but if i then found out the thermometer was calibrated by some guy who eyeballed it, my verdict slides to shabda — and if i find out the guy is unreliable, it slides to *no pramana at all*. that sliding bothers me; is it a sign i'm using the wrong test?
  7. a field guide says "a tapir looks like a pig with a short prehensile snout"; i see one at the zoo and come to know that's a tapir. my verdict: upamana, and it's genuinely doing its own work — not just "shabda from the guide plus perception of the animal." but i can't say what's left over once you subtract those two.
  8a. i infer fire from smoke in the kitchen; then my roommate texts "there's a fire." my verdict: the text adds no new pramana. it's reassurance, not a second source.
  8b. i infer fire from smoke; then i walk in and *see* the flames. my verdict: that's a new pramana and genuinely new knowledge, not just more confidence.
  — these two are the pair i can't reconcile. structurally they're the same: a second, independent route delivers a proposition i already had by inference. why does one feel like knowledge-twice and the other like nothing added?
  9. i'm not sure the grey haze is smoke; i run the tarka ("if there were no fire there'd be no smoke"), and *then* i'm willing to infer. verdict: genuinely helpful, still not a pramana.
  10. remembering where i parked: knowledge, not a pramana. fine with this.
  11. i overhear half a sentence in a language i barely speak and fill in the rest from context, and come to know the speaker is angry: no idea. feels like a blend, and i don't know which pramana owns it.

  my own guess at the principle: a pramana is whatever *fixes the content* — the thing that answers "how do you know?", the thing that would have to go wrong for this cognition to be false. so the pixels in case 2 don't fix the content, the speaker does; and in 8a the content was already fixed, so the text fixes nothing.

  so: test that against 1–11, tell me which of my verdicts it can't save and which it gets for the wrong reasons, and then either repair it or replace it with something that does better. i care about the individuation question most — what makes something *one* pramana rather than a stack of others, and is the fourfold list meant to be the irreducible ones or just the four that matter? what's the test for "irreducible" that doesn't just stipulate the answer?

  then, since a rule that only fits my cases is worthless: what does the account you land on say about (i) a dog who knows his owner is home from the smell, (ii) coming to know from a photograph that it rained last night, (iii) the same proposition learned by testimony from two people who both got it from one person? and for 8a/8b specifically, what's the smallest change to the case that flips my verdict — i want to know which feature is actually doing the work.

  if the honest answer is that nyaya authors disagreed about some of this, just tell me which of my verdicts each option forces me to drop; names and dates are the one thing i don't need.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're in an Indian epistemology course focusing on Nyaya's pramanas. They've been categorizing cases based on a gut feeling but can't articulate the rule. Their main issue is individuating pramanas—what makes each source distinct and why some cases feel ambiguous.

  First, I need to recall the four pramanas: perception, inference, comparison, and testimony. The user provided 11 cases with their verdicts, some shaky. The key is to find a consistent principle that explains all these judgments. The user's proposed principle is that a pramana "fixes the content"—it's what answers "how do you know?" and would cause error if faulty. That seems promising but needs testing.

  Looking at their cases:
  - Case 2: Testimony makes sense because the pixels are just the medium; the source of truth is the roommate's reliable message.
  - Case 3: Perception, but memory is involved. Here, memory is auxiliary; the perception of the face triggers recognition. So the content is fixed by current perception, not memory recall.
  - Case 4: The sign is testimony because the written words convey meaning from an author, even without a speaker present. The perception of the sign is necessary but not the knowledge source.
  - Case 5: Absence perception. Nyaya accepts this as a type of perception, so it fits without needing a new pramana.
  - Case 6: The sliding verdict is tricky. Initially, it's perception if the thermometer is trusted as an instrument. If calibration is dubious, it becomes testimony about the guy's reliability. The principle holds because the content-fixer shifts from the instrument's direct readout to the testimonial chain.
  - Case 7: Upamana works here because the similarity links the remembered description to the perceived animal. It's not reducible to shabda plus perception because the comparison itself generates new knowledge.
  - Cases 8a and 8b: The structural similarity but different verdicts. In 8a, testimony doesn't add new knowledge since inference already fixed the content. In 8b, perception provides direct evidence, which is a different mode of access. The smallest change to flip 8a might be if the testimony came from a different source, like a fire department alert instead of the roommate confirming the same inference. But if the roommate had independent info, it might add new pramana value.
  - Case 11: Overhearing and inferring anger. This seems like inference from contextual clues, not direct testimony since the language isn't fully understood.

  Now, the user's deeper needs: They want a clear, non-arbitrary way to distinguish pramanas. They’re concerned about reducibility—whether the four are fundamental or just practical categories. Nyaya likely sees them as irreducible because each has a unique mechanism: direct sensory contact, logical pervasion, similarity-based recognition, and reliable communication.

  Testing their principle against the additional cases:
  - Dog smelling owner: Perception, as it's sensory, unless Nyaya restricts perception to humans. But generally, it's pratyakṣa.
  - Photograph of rain: Inference. The wet ground in the photo isn't directly perceived rain; you infer past rain from the evidence.
  - Testimony from two dependent sources: Still shabda, but if both derive from one source, it's not independent; no new pramana if you already had it from the original.

  For 8a/8b, the critical feature is the mode of access. Perception provides a different kind of evidence than inference. The smallest change for 8a to count as new pramana would be if the testimony was independently verified, like the roommate saw the fire elsewhere.

  Areas where Nyaya authors might disagree: Whether absence is truly perceptual, or if instruments like thermometers are perception or inference. Some might classify case 6 as inference if distrusting instruments as direct perception.

  Overall, the content-fixing principle holds well. It explains the verdicts and addresses the user's need for a non-stipulative rule. The fourfold list is irreducible because each pramana has a unique content-fixing mechanism that can't be reduced to others without losing something essential.
answer: |-
  Based on your cases and the core Nyāya framework, your "content-fixing" principle is remarkably insightful and aligns well with classical Nyāya intent. Let's refine it, test it against your verdicts and new cases, address individuation, and tackle the sliding/redundancy issues.

  **Refined Principle:** A *pramāṇa* is the **primary causal factor** (*karaṇa*) that **determines the specific content** (*viṣayatāvacchedaka*) of a *new* (*anadhigata*) true cognition (*pramā*). It answers "What specifically *gives you* this knowledge?" in a way that:
  1.  **Is irreducible:** It cannot be fully reduced to another *pramāṇa* without losing the distinct mode of access.
  2.  **Is content-specific:** A different *pramāṇa* providing the same proposition constitutes distinct knowledge if it provides a *different mode of access* to the content.
  3.  **Is error-relevant:** If it fails, the cognition fails *because of the source*, not just auxiliary conditions.

  ### Testing Your Verdicts with the Refined Principle

  1.  **Smoke → Fire:** Correct *(Anumāna)*. Pervasion (smoke-fire relation) *fixes the content*.
  2.  **Text "6:15 cancelled":** Correct *(Śabda)*. The trustworthy linguistic meaning *fixes the content*. Pixels are the vehicle, not the source.
  3.  **Recognizing old roommate:** Correct *(Pratyakṣa)*, grudgingly justified. The *current visual perception* (of the face) is the primary causal factor *fixing the content* ("This person is here now"). Memory is auxiliary (*smṛti*), providing the template for recognition but not generating the *new* cognition *about this present instance*. If the perception were faulty (e.g., bad light), the cognition fails; if memory were faulty (you misremember the face), you might misidentify, but the *source* of the cognition *about this person* is still perception triggering the (faulty) memory association.
  4.  **"BRIDGE OUT" Sign:** Correct *(Śabda)*. The *meaning* conveyed by the conventional linguistic sign *fixes the content*. Your eyes provide access (auxiliary perception), but the knowledge source is the encoded testimony. If the sign-maker lied, the cognition fails.
  5.  **Keys not on counter:** **Nyāya Verdict:** *Pratyakṣa* (Perception of Absence - *anupalabdhi*). The refined principle *accepts* this. The *direct non-perception* (*adṛk*), under suitable conditions (you look, it's well-lit, keys are perceptible if present), *fixes the content* "keys are absent here." It's not inferring absence from "I don't see them" (which *would* be inference: "Where X is perceptible and not perceived, X is absent" → Keys absent). Classical Nyāya accepts *anupalabdhi* as a type of perception.
  6.  **Thermometer reading 38.2:** **The sliding is justified and reveals the principle.** Initially, *if* you trust the thermometer as a reliable *instrument* (*indriya*), it's *Pratyakṣa* (instrument-aided perception). The instrument reading *fixes the content* "temperature is 38.2." Discovering bad calibration: Now the cognition "I have a fever" relies *entirely* on the testimony embedded in the instrument's reading (you trusted the *maker's word* it was accurate). It becomes *Śabda*. Discovering the maker's unreliability: It fails as a *pramāṇa* – the source (the maker's word) is defective. The cognition wasn't *pramā* to begin with. **The principle works:** What *fixed the content* shifted from the instrument's direct readout (perception) to the meaning/skill embedded in it (testimony).
  7.  **Identifying Tapir:** Correct *(Upamāna)*. The *similarity* (*sādr̥śya*) between the perceived animal and the remembered description *fixes the content* "this is a tapir." It's irreducible: Shabda gave you the description, memory recalled it, perception gave you the animal, but *Upamāna* is the unique process of *applying the similarity relation* to generate the new identification. Subtract Shabda/Perception/Memory, and Upamāna has nothing to work *on*, but the *process* itself is distinct.
  8a. **Infer fire → Roommate Texts "Fire":** Correct *(Not a new Pramāṇa)*. The *content* "fire is present" was already fixed by the pervasion (smoke-fire). The text provides the *same proposition via the same mode of access* (linguistic meaning - Śabda), but the *content was already fixed*. It's reassurance, not a new source fixing the content anew. If the inference were shaky, the text *might* act as Śabda fixing it, but in your case, inference was solid.
  8b. **Infer fire → See flames:** Correct *(New Pramāṇa - Pratyakṣa)*. The *mode of access* is fundamentally different. Perception (*nirvikalpaka* then *savikalpaka*) *fixes the content* "fire is present" *directly*, not via a mark and pervasion. This provides a distinct *kind* of knowledge (direct sensory confirmation). **Reconciling 8a/8b:** The difference is the *mode of access*. Śabda and Anumāna are both *parokṣa* (indirect/mediated). Pratyakṣa is *pratyakṣa* (direct). Getting the same proposition via a different *fundamental mode* constitutes new knowledge *generated by that pramāṇa*. Getting it again via the *same* mode (like another testimony) doesn't. **Smallest change to flip 8a:** If the text came from a *different, independent source* (e.g., the fire department calling, not your roommate who might be confirming your inference) *and you didn't already have firm Anumāna-based knowledge*, it *could* act as Śabda fixing the content. But in your scenario, the inference was primary and firm.
  9.  **Tarka confirming inference:** Correct *(Not a Pramāṇa)*. Tarka removes doubt about the pervasion but doesn't *fix the content* of the inference ("fire is present") itself. It supports/reinforces the *anumāna* process but isn't the source *generating* the cognition of the fire.
  10. **Remembering parked car:** Correct *(Not a Pramāṇa - Smṛti)*. Memory *recalls* previously fixed content but doesn't fix *new* content about the *current* location. If you *see* the car now, that's Pratyakṣa.
  11. **Overhearing half-sentence, inferring anger:** **Verdict:** *Anumāna* (Inference). The perceived sounds (*śabda*) are the mark (*liṅga*). Context (prior knowledge of language fragments, tone, situation) provides the pervasion (*vyāpti*) linking those sounds/tones to anger. The *inferential process* based on these marks *fixes the content* "speaker is angry." It's not pure Śabda, as the full linguistic meaning wasn't grasped directly. It's not pure Pratyakṣa, as anger itself isn't directly perceived.

  ### Individuation: Why Four? Irreducible or Just Important?
  *   **Irreducibility Criterion:** Nyāya argues these four are *sui generis* – each has a unique mechanism (*svarlakṣaṇa*) for fixing content that cannot be fully reduced to the others without loss:
      *   *Pratyakṣa:* Direct sensory contact (*indriyārthasannikarṣa*) fixing particular, non-conceptualized content first.
      *   *Anumāna:* Relational knowledge (*vyāpti-jñāna*) applied to a perceived mark (*liṅgadarśana*) fixing a connected object.
      *   *Upamāna:* Similarity recognition (*sādr̥śya*) linking a perceived object to a recalled verbal description.
      *   *Śabda:* Understanding reliable linguistic meaning (*āptavākya*) fixing the denoted object/state.
  *   **The Test:** Can the knowledge event be explained *completely* as an instance of another *pramāṇa*, without needing an *ad hoc* addition? If not, it's irreducible.
      *   E.g., Memory (*smṛti*) is reducible – it's just the revival of content originally fixed by a *pramāṇa*. Tarka is reducible to a form of reasoning supporting *anumāna* or other *pramāṇas*. Absence perception is arguably a mode of *pratyakṣa*. Instrument-aided knowledge is *pratyakṣa* if the instrument is trusted as an extension of sense, or *śabda* if trusted as conveying testimony.
  *   **Why these four?** Nyāya claims they are the fundamental, irreducible sources covering all possible ways genuinely *new* knowledge can arise. They are both fundamental and practically significant.

  ### Testing on New Cases
  1.  **Dog knows owner home from smell:** *Pratyakṣa* (Perception). The olfactory sensation (*gandha*) is the primary causal factor *fixing the content* "owner is here" for the dog (assuming dogs can have valid cognitions via sense organs). Nyāya generally accepts animals can have *pratyakṣa*.
  2.  **Knowing it rained last night from a photograph (showing wet ground/puddles):** *Anumāna* (Inference). The photograph provides visual perception (*pratyakṣa*) of marks (*liṅga*) – wet ground/puddles. Prior knowledge (*vyāpti-jñāna*) of the pervasion "Such-and-such wetness/puddles (at this location/time) are invariably caused by recent rain" is applied. The inference *fixes the content* "it rained last night." It's not *pratyakṣa* of rain (past event), nor *śabda* (unless the photo is captioned), nor *upamāna* (no similarity to a description).
  3.  **Same proposition from two people, both got it from one:** *Śabda* (Testimony), but **not a new *pramāṇa* for the *same content*.** The first testimony (*pramāṇa*) fixed the content. Hearing it again from a second person who heard it from the first is still just *śabda*, but it relies on the *same chain* of testimony originating from the first source. The *content* was fixed by the original source. If the second person was an *independent* witness, *then* it would be a distinct instance of *śabda* fixing the same content via a different testimonial chain.

  ### Addressing Nyāya Disagreements (Briefly)
  *   **Perception of Absence (Case 5):** Some Nyāya schools (especially later) *did* debate this. Opponents (e.g., Mīmāṃsā, Buddhists) argued it was inference. Your refined principle *supports* the Nyāya view that it's perception (non-apprehension under fit conditions fixes the content directly).
  *   **Instrument-Aided Knowledge (Case 6):** Views differed on whether instruments like thermometers are extensions of sense (Pratyakṣa) or rely on testimony about their making/calibration (Śabda). Your principle explains the sliding perfectly.
  *   **Upamāna (Case 7):** Some schools (e.g., Advaita Vedānta) tried to reduce Upamāna to perception/inference/testimony. Your principle and Nyāya defend its irreducibility due to the unique role of similarity recognition.
  *   **Redundant Pramāṇa (Cases 8a/8b):** The key distinction (same mode vs. different fundamental mode) is widely accepted in Nyāya as explaining when a second source provides genuinely new knowledge.

  **Conclusion:** Your "content-fixing" principle, refined to emphasize the *primary causal factor determining the specific content via a unique mode of access*, is robust. It explains your gut verdicts, the sliding in Case 6, the difference between 8a and 8b, and handles the new cases well. It aligns with Nyāya's view of the four *pramāṇas* as fundamental and irreducible ways of generating new knowledge. The cases where you felt "grudging" (3, 5) or saw sliding (6) are actually points where Nyāya analysis is subtle, and your principle helps clarify them. Keep focusing on "What *specifically* gave me *this* piece of knowledge?" and "Could this source fail and make my knowledge fail?" – you're on the right track.
