  ---

  ### **What the Procedure Cannot Do**
  1. **Correlated Errors**:  
     Assumes errors are independent across actors. But if all maintainers share biases (e.g., blind spots in security), the curse adjustment **underestimates risk**. Correlated errors make acting unilaterally riskier than calculated.  
  2. **Dynamic Shadow Quorum**:  
     Treats "shadow quorum" as static. If ecosystem activity spikes (e.g., due to a CVE), N becomes fluid and the adjustment may be outdated.  
  3. **Value Conflicts**:  
     Cannot resolve disputes where trade-offs are ideological (e.g., "censorship vs. harm"). Steps 2 and 5 are lab-coat judgments, but values trump facts.  
  4. **Long-Tail Dependencies**:  
     Fails if downside depends on multiple PRs (e.g., risk emerges only when combined with another change).  
  5. **Recall Mechanisms**:  
     Ignores whether a bad release can be rolled back. If rollback is instant and harmless, downgrade downside magnitude.  

  ---

  ### **Simplifications Made**
  - Dropped quantitative probability math for bands (accessible but less precise).  
  - Ignored "partial benefit" edge cases (e.g., a change that helps 30% of users even if redundant).  
  - Assumed "one month" for counterfactuals (adjust mentally if urgency differs).  
  - Used additive bands for probability adjustment (not multiplicative, for simplicity).  

  This procedure prioritises **blocking bad bets** over catching all good ones. When in doubt, it rejects—aligning with the curse’s lesson: *With great unilateral power comes great unilateral restraint.*
