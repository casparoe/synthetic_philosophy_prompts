  Below is a decision procedure based on the unilateralist's curse, tailored for your context. It's designed to be run in **≤20 minutes** by a maintainer without decision theory expertise, using **coarse bands (Low/Medium/High)** for estimates. Key distinctions preserved:
  - **Redundant upside** (only one merge needed for full benefit) vs. **accumulating upside** (multiple merges add value).
  - **Counterfactual probability** (chance someone else would have merged it soon).
  - **Shadow quorum** (other actors in the ecosystem who could independently ship similar changes).
  - **Selection bias** (adjusting for the fact that the actor with thinnest evidence is most likely to act).
  - **Mirror cases** (where *not* merging has tail risks).

  The procedure uses **British English** and explicitly flags judgment calls (steps where "lab coat" estimates are required). It rejects PRs early if thresholds aren't met, and defaults to conservatism when bands are unclear.

  ---

  ### **Decision Procedure for Non-Trivial PRs**
  *Run this when a PR isn’t obviously trivial (e.g., involves risk, complex logic, or high stakes).*

  1. **Upside Magnitude**  
     *Ask: "If this works perfectly, how beneficial is it for users?"*  
     - **Low**: Minor convenience win for a niche group.  
     - **Medium**: Noticeable improvement for many users (e.g., 20% speed boost).  
     - **High**: Major win (e.g., prevents critical harm or unblocks core workflows for most users).  
     - *→ If **Low or Negligible**, **stop and reject**. No net benefit justifies risk.*  
     - *→ Else, proceed.*  

  2. **Upside Redundancy & Counterfactual**  
     *Ask: "If I don’t merge this, would someone else likely ship the same change soon?"*  
     - **Accumulating upside?** (Rare: e.g., a dependency bump where multiple merges add value). If **yes**, skip to Step 3.  
     - **Redundant upside?** (Common: e.g., a feature/fix where only one merge delivers full benefit).  
       - Estimate **counterfactual probability (P_counter)**:  
         - **Low** (<20%): Unlikely others would ship within a month.  
         - **Medium** (20-60%): Possible, but not guaranteed.  
         - **High** (>60%): Likely (e.g., obvious fix, active discussion in issues).  
       - *Judgment call (lab coat)*: Consider team activity, ecosystem forks ("shadow quorum"), and PR visibility.  
     - **Adjust upside**:  
       - If **Accumulating**: Use original upside magnitude (Step 1).  
       - If **Redundant**:  
         - P_counter **High** → Downgrade upside by one level (e.g., High → Medium).  
         - P_counter **Medium** → Downgrade upside by one level.  
         - P_counter **Low** → Keep original upside.  
       - *→ If adjusted upside is **Negligible/Low**, **stop and reject**.*  

  3. **Downside Magnitude**  
     *Ask: "If this goes catastrophically wrong, how bad is the worst-case scenario?"*  
     - **Low**: Annoyance with easy recovery (e.g., logging broken for 1% of users).  
     - **Medium**: Significant disruption (e.g., data loss for a subset, requires patching).  
     - **High**: Severe damage (e.g., security breach with limited scope).  
     - **Catastrophic**: Permanent, widespread harm (e.g., sandbox escape, total data loss, irreversible trust loss).  
     - *→ If **Catastrophic**, proceed carefully. If **Low**, skip to Step 5 (low risk). Else, proceed.*  

  4. **Downside Probability**  
     *Ask: "How likely is the worst-case downside (tail risk)?"*  
     - **Low** (<5%): Plausible but improbable.  
     - **Medium** (5-20%): Could happen, but not expected.  
     - **High** (>20%): Likely under edge cases.  
     - *Judgment call (lab coat)*: Focus on tail risk. If evidence is thin, bump up a band.  

  5. **Adjust for Unilateralist's Curse (Actor Pool)**  
     *Ask: "How many actors could independently ship this change?"*  
     - **N** = Your team (5) + prominent ecosystem forks ("shadow quorum").  
       - **Small**: 2–5 actors (just your team).  
       - **Medium**: 6–10 actors (team + 1–2 active forks).  
       - **Large**: >10 actors (team + many forks).  
     - *Judgment call (lab coat)*: Be conservative. If unsure, assume **Medium/Large**.  
     - **Adjust downside probability**:  
       - N = **Small** → No adjustment (use Step 4 probability).  
       - N = **Medium** → Increase probability by one band (e.g., Low → Medium).  
       - N = **Large** → Increase probability by two bands (e.g., Low → High).  
       - *Rationale: Accounts for selection bias (more actors = higher chance the thinnest-evidence person acts).*  

  6. **Decision Matrix**  
     Use adjusted upside (Step 2), downside magnitude (Step 3), and adjusted probability (Step 5):  

     | Downside Magnitude → | **Low**         | **Medium**      | **High**        | **Catastrophic**   |
     |----------------------|-----------------|-----------------|-----------------|-------------------|
     | **Adj. Probability** |                 |                 |                 |                   |
     | **Low**              | ✅ Merge        | ✅ Merge        | ⚠️ Merge if upside **High**; else reject | ⚠️ Merge **only if** upside **High** AND no alternatives; else reject |
     | **Medium**           | ✅ Merge        | ⚠️ Merge if upside **High**; else reject | ❌ Reject        | ❌ Reject         |
     | **High**             | ⚠️ Merge if upside **High**; else reject | ❌ Reject        | ❌ Reject        | ❌ Reject         |

     - **✅ Merge**: Proceed if you have 5 mins to sanity-check critical paths.  
     - **⚠️ Merge with caution**: Only if upside is urgent (e.g., ongoing exploit).  
     - **❌ Reject**: Kick to release lead or 2-week review path.  
     - **Mirror case handler**: If *not merging* has high tail risk (e.g., ongoing exploit), it boosts upside magnitude (Step 1). Already covered.  

  ---

  ### **Application to Your Cases**
  *Assumptions: Team size = 5, shadow quorum = 3–5 prominent forks (N = Medium). Bands based on your descriptions.*

  1. **Sandbox Escape Hatch PR**  
