  - **Complex Interactions**: The procedure treats upside and downside as independent. In reality, a change might have multiple upsides and downsides that interact.
  - **Non-Tail Risks**: The procedure focuses on tail risks, but there might be non-tail risks that are significant in aggregate.
  - **Dynamic Ecosystem**: The shadow quorum (forks) might change over time, and it's hard to estimate N accurately.
  - **Learning and Feedback**: If a change is deployed and causes issues, the team might learn and fix it quickly. The procedure doesn't account for the ability to recall or mitigate after deployment.

  ### Final Procedure in British English

  **Procedure for Non-Trivial PRs**

  **Step 0:** If the PR is trivial (no material risk, minimal changes, well-tested), merge it. Otherwise, proceed.

  **Step 1: Assess upside**
