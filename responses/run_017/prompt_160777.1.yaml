  Key considerations from the user:
  - The team has five maintainers, any one can merge and release without a second approval.
  - They merge about 15 things a week, most trivial, but every couple of weeks something non-trivial.
  - The procedure must be run in 20 minutes on a laptop by someone without decision theory background.
  - Use coarse bands (e.g., low/medium/high) for estimates.
  - Clearly indicate when to stop and either reject the PR (kick to release lead or slow review) or when it becomes a human judgment call.
  - Must handle:
      - Redundant upside (only one needs to merge) vs. accumulating upside (multiple merges add value).
      - Counterfactuals: the chance that someone else (on the team or in the ecosystem) would have merged the same change soon.
      - Downside is shared and non-excludable, while credit (upside) is individual.
      - Selection bias: the actor with the thinnest evidence is more likely to act, so we must adjust for that.
      - Sometimes not merging is the unilateral move with a tail risk.

  The procedure must also be written in British English.

  We'll break down the procedure into steps. Each step is a question. We'll use bands (Low, Medium, High) for estimates. If a step cannot be answered with at least a band, it may require kicking to a human or a more thorough review.

  ### Important Notes for the Procedure
  1. **Redundant upside**: The upside is only realised once, no matter how many merge. We account for the counterfactual that someone else might merge it.
  2. **Accumulating upside**: Each merge adds value (rare in this context, but possible).
  3. **Downside**: Shared by all users, and non-excludable (everyone suffers if it goes wrong).
  4. **Counterfactual probability (P_counter)**: The probability that, if you don't merge, someone else (team or ecosystem) would merge an equivalent change within a month (or a relevant time frame). This reduces the expected upside of your merge because the benefit might happen anyway.
  5. **Selection bias**: We adjust by considering how many people with your level of evidence would merge. We use the number of potential actors (N) and the fact that the one with the lowest threshold for acting (thinnest evidence) is the one who acts. Therefore, we must be more conservative as N increases.

  ### The Decision Procedure
  We'll design a flowchart-like procedure, but with explicit judgment calls. We'll use the following bands for probabilities and impacts:
  - **Probability**: Very Low (VL, <1%), Low (L, 1-10%), Medium (M, 10-33%), High (H, >33%)
  - **Impact**: Negligible, Low, Medium, High, Catastrophic (for downsides); Negligible, Small, Medium, Large, Huge (for upsides)

  However, to keep it simple, we'll use:
  - Upside magnitude: Small, Medium, Large
  - Downside magnitude: Low, Medium, High, Catastrophic (with Catastrophic meaning affecting all users severely and irreparably)
  - Probability: Low, Medium, High

  We assume that the downside impact is at least "Medium" for non-trivial PRs, but we'll assess.

  #### Step 0: Pre-Filter
  - If the PR is obviously trivial (no material risk, minimal changes, well-tested, etc.), merge as usual. Otherwise, proceed.

  #### Step 1: Determine Upside Characteristics
  1. **Upside Magnitude**: How beneficial is this change to users? Consider the size of the benefit and how many users it affects.
     - Small: Minor improvement for a subset of users.
     - Medium: Noticeable improvement for many users.
     - Large: Major improvement for almost all users, or prevents significant harm.
     - *If upside is Negligible, stop and reject (no reason to take risk).*

  2. **Upside Redundancy**: Is the upside redundant? (i.e., if you don't merge, might someone else merge an equivalent change soon, so the upside is realised anyway?)
     - **Accumulating**: Each merge adds value (rare). 
     - **Redundant**: The upside is realised by the first merge, and additional merges don't add value (common).
     - *Judgment call: Based on the change and the team/ecosystem. Consider:*
       - How unique is this change? (Is it an obvious fix? Is it being discussed?)
       - How likely is it that another maintainer (or a fork) would merge it in the next month?
       - Estimate the counterfactual probability (P_counter) that someone else would merge within a month: Low, Medium, High.

  3. **Effective Upside**: Adjust the upside magnitude by the counterfactual.
     - If upside is accumulating, then your merge adds the full upside.
     - If redundant, then your merge only adds the upside if no one else would have merged it. So:
       - Effective upside = upside magnitude * (1 - P_counter)
