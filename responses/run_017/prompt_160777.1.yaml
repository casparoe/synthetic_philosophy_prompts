      - If P_counter is Medium → Downgrade upside by one level (Large→Medium, Medium→Small, Small→Negligible).
      - If P_counter is Low → Effective upside = upside magnitude from Q1.
    - If effective upside is Negligible, stop and reject. Otherwise, proceed.

  **Step 2: Assess downside**
  - Q4: Downside magnitude: If the change goes wrong (tail risk), how bad?
    - Low: Minor inconvenience, easily fixed.
    - Medium: Significant disruption, but recoverable.
    - High: Severe damage (e.g., data loss, security breach with high impact).
    - Catastrophic: Irreversible harm, massive security breach (e.g., sandbox escape), permanent loss of trust.
  - Q5: Downside probability (tail risk): How likely is the worst-case?
    - Low: Unlikely (e.g., <10%).
    - Medium: Plausible (e.g., 10-30%).
    - High: Quite likely (>30%).
    - *Judgment call: Focus on tail risk. If unsure, be conservative.*

  **Step 3: Adjust for multiple actors (unilateralist's curse)**
  - Q6: Number of potential actors (N): Who could independently merge an equivalent change? Include team members and prominent forks (shadow quorum). Estimate:
    - Small: 2-5 people.
    - Medium: 6-10.
    - Large: >10.
    - *Judgment call: Be conservative.*
  - Q7: Adjusted downside probability: Adjust Q5 based on N:
    - If N is Small → Use Q5 as is.
    - If N is Medium → Increase by one band (Low→Medium, Medium→High, High→High).
    - If N is Large → Increase by two bands (Low→High, Medium→High, High→High).

  **Step 4: Decision**
  - Apply these rules:
    - If downside magnitude is Catastrophic:
      - If adjusted downside probability is Low and effective upside is Large → **Merge (with extreme caution)**.
      - Else → **Reject and kick to release lead or slow review**.
    - Else if downside magnitude is High:
      - If adjusted downside probability is High or Medium → **Reject**.
      - If adjusted downside probability is Low:
        - If effective upside is Large → **Merge**.
        - Else → **Reject**.
    - Else if downside magnitude is Medium:
      - If adjusted downside probability is High → **Reject**.
      - If adjusted downside probability is Medium:
        - If effective upside is Large → **Merge**.
        - Else → **Reject**.
      - If adjusted downside probability is Low:
        - If effective upside is at least Small → **Merge**.
        - Else → **Reject**.
    - Else (downside magnitude Low):
      - If adjusted downside probability is High:
        - If effective upside is Large → **Merge**.
        - Else → **Reject**.
      - If adjusted downside probability is Medium or Low → **Merge**.

  **Notes:**
  - If at any step you cannot estimate a band (even as a judgment), stop and kick to release lead or slow review.
  - "Kick to release lead or slow review" means do not merge unilaterally; use the two-week review path or escalate to the release lead.
  - "Merge (with caution)": Double-check critical parts if possible, but the procedure allows merge.
  - "Merge (with extreme caution)": Only if the upside is urgent and huge. Consider if you can wait even a few hours for an ad-hoc review.

  **Case 3 Revisited with Adjusted P_counter:**
  - Since the fix is urgent, we set P_counter for a short time frame (next day) to Low. Then:
    - Effective upside: Large.
    - Downside magnitude: High.
    - Adjusted downside probability: Low.
    - Rule: Merge.
