  Another angle: PMI itself might need refinement. Without successor theories, the induction over theories isn't the same as over methods. The user wants to know if PMI was always about metaphysics or if this case shows it's about practice. Also, when analogies break—like no successor theory means preservationism doesn't apply, so the classic PMI structure doesn't fit.

