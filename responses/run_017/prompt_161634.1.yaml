  The solution lies in separating recognition from comparison: we can celebrate achievement without ranking humans. The speech should frame certificates as focusing on personal growth ("you are seen") while preserving non-academic competitions as voluntary, skill-specific comparisons. This sidesteps prioritarianism by making it about redefining success metrics rather than weighing gains/losses. 

