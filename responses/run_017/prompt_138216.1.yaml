  Okay, let me start by really understanding what the user needs. They're the quantitative lead at a forecasting platform, dealing with both human and model forecasters. They need to choose a scoring method for their leaderboard, which affects rankings, payouts, and model training. The main issue is that Brier and log scores disagree on rankings, and they need a single number that serves multiple purposes.

  First, I need to break down their explicit requirements. They mentioned aggregating scores across different questions and forecasters who answered different subsets. That means the scoring method must handle incomplete data and be comparable across varying question sets. Then there's the issue of confidence penalties—being wrong at 0.99 should be worse than wrong at 0.6. The never-0.5 forecaster shouldn't win, which ties into rewarding informativeness. Also, handling incoherent credences across multiple questions is important; they want the score to reflect joint incoherence, not just individual question accuracy.

  They also deal with conditional forecasts that don't resolve, long-range unresolved questions, and ambiguous resolutions. The scoring method needs a clear policy for these cases. Another point is sensitivity to partition refinement—should scores change if the outcome space is divided more finely? And because the score trains models, they need to know if incentivizing honest reporting is sufficient or if there are other factors.

  Now, their deeper concerns. They want to distinguish genuine epistemic requirements from practical or preferential considerations. For example, is strict propriety about truth-seeking or just eliciting honest reports? They're also worried about conflicting desiderata—like strict propriety conflicting with partition invariance or additivity. Identifying which requirements can't coexist is crucial. They need to know which criteria are non-negotiable for their use case: ranking, payouts, training.

  Looking at the scoring rules they mentioned: Brier is gentle, logarithmic is harsh on confident errors. Spherical is in-between. The user needs a framework to evaluate these rules against their specific needs. They might not realize that some requirements, like partition invariance and strict propriety, conflict. Also, handling unresolved questions requires a scoring design choice, not the rule itself. 

  The core of their problem is balancing multiple objectives: accuracy, proper incentives, aggregation, handling edge cases. The solution must prioritize non-negotiable desiderata like strict propriety for honest reporting and coherence for joint credence evaluation. But they have to accept trade-offs, like partition sensitivity. They also need clarity on unresolved questions—maybe adopting a policy like no-score or using expected scores. 

  In summary, the user needs a clear set of desiderata with trade-offs highlighted, especially between strict propriety and partition invariance. They must decide on policies for unresolved cases and understand that while strict propriety is essential for incentives, it limits partition invariance. Recommending the log score might make sense due to its strong penalty for overconfidence and propriety, but they must accept the trade-offs like partition sensitivity and unbounded penalties.
answer: |-
  Based on your operational needs and epistemological inquiry, here are the essential desiderata for an epistemic utility measure in your context, organized with the underlying case/consideration and noting key conflicts:

  ### Core Desiderata (Non-Negotiable for Ranking, Payouts, Training)

  1.  **Strict Propriety:** *Requirement:* The expected score must be uniquely maximized when the forecaster reports their true credence. *Case:* This is fundamental for the score to function as both a **training signal** and an **incentive**. If not strictly proper, forecasters can "game" the system by reporting distorted credences they believe will yield a better score *in expectation* than their true belief, undermining the goal of eliciting honest reports. This is not merely a practical demand disguised as epistemology; it's a core requirement for the score to truthfully reflect epistemic *good faith* effort under uncertainty. *Conflict:* Knocks out many ad-hoc measures.

  2.  **Aggregativity Across Questions:** *Requirement:* The total score for a set of questions must be the sum (or a fixed linear transformation thereof) of the scores for each individual question. *Case:* Forecasters answer **different subsets** of questions. Ranking and payout require a **single, comparable number** per forecaster derived from their entire track record on the questions they attempted. Additivity is the simplest, most robust way to ensure fair aggregation. *Conflict:* Rules out measures requiring complex normalization or holistic evaluation of entire credence functions unless they decompose additively.

  3.  **Differentiable Penalty for Confidence & Error:** *Requirement:* The penalty for assigning credence `p` to a false proposition must increase monotonically with `p`. Similarly, the reward for assigning `p` to a true proposition must increase monotonically with `p`. *Case:* A forecaster wrong at 0.99 **must be penalized more harshly** than one wrong at 0.6. This rewards well-calibrated confidence and punishes overconfidence. It also ensures the "always 0.5" forecaster **cannot win** (a happy consequence, not a separate requirement).

  4.  **Coherence Sensitivity:** *Requirement:* The scoring rule must be able to detect and penalize incoherence (violations of probability axioms) *across* related forecasts. *Case:* Forecasters make **multiple, logically connected predictions** (e.g., P(A), P(B), P(A and B)). Scoring each question in isolation misses incoherence. A coherence-sensitive rule (typically one that is *strictly proper* and applied to a sufficiently rich set of events) will assign a worse total score to an incoherent set than to *any* coherent set consistent with the same marginals. *Conflict:* Requires scoring related questions together, not purely isolationist scoring.

  ### Important Operational Constraints

  5.  **Defined Resolution Policy:** *Requirement:* The scoring rule itself doesn't define resolution; *your platform must*. The rule requires a clear **definition of the outcome state** (True/False, or which partition element occurred) for each question. *Cases:*
      *   **Conditional Forecasts (Antecedent False):** Standard practice is **no score** (ignore). Scoring requires a defined outcome.
      *   **Long-Range/Ambiguous Resolution:** You **must define a resolution policy** (e.g., use adjudicator judgment, declare "Ambiguous - no score"). The measure *requires* a clear `world` input. *Conflict:* Not a flaw of the measure, but an operational necessity for you.

  6.  **Boundedness per Question (Debatable):** *Requirement:* The score for a single forecast on a single question should be bounded. *Case:* Prevents **one catastrophic forecast** (e.g., 0.99 on False) from completely **swamping a long track record**. This is often a *practical* concern for leaderboard stability and model training, rather than a deep epistemological commitment. Unbounded rules (like Log) heavily punish extreme errors. *Conflict:* Boundedness (e.g., Brier, Spherical) trades off against strong incentives for precision offered by unbounded rules.

  ### Epistemological Considerations (Often Involve Trade-offs)

  7.  **Partition Invariance / Truth-Gradient for Non-Atoms:** *Requirement:* The score for a forecast on a proposition should depend only on the proposition's truth value and the credence, *not* on how finely the rest of the possibility space is partitioned. *Case:* The **same target event** (e.g., "Candidate X wins") forecasted in tournaments with different background granularity should receive the **same score** if assigned the same credence and outcome. *Conflict:* **This fundamentally conflicts with Strict Propriety.** Strictly proper rules like Log and Brier are **sensitive to partition refinement** (e.g., forecasting P(X wins) vs. forecasting P(X wins), P(Y wins), P(Z wins) in a 3-way race). Only *local* scoring rules (e.g., ones only using the credence and truth value of the specific proposition) are partition-invariant, but they are generally *improper* and fail desideratum 4 (Coherence Sensitivity). **This is a key trade-off.** Partition sensitivity is often seen as a *feature* (rewarding the extra information in a finer partition), not a bug.

  ### Clarifications on Your Circling Thoughts

  *   **"Honest Reporting Best Expected Score = Good Objective?"** Yes, due to **Strict Propriety (Desideratum 1)**, this is the *defining feature* of an epistemically suitable rule for training and incentives. It ensures optimizing the objective (expected score) aligns with honest reporting.
  *   **"Rewarding Informativeness/Resolution independently?"** Strict Propriety inherently rewards informativeness *only when justified by accuracy*. Assigning extreme probabilities *increases potential score gain if right but also increases penalty if wrong*. The expected score maximization for true belief balances this. Rules don't reward resolution *independently*; they reward *well-calibrated* resolution.
  *   **"Never 0.5 wins?"** Prevented by **Desideratum 3** (Differentiable Penalty). Constant 0.5 has low expected loss but is strictly dominated in expectation by *any* coherent belief different from 0.5 if the forecaster has *any* information. It loses to accurate confidence.
  *   **Single Requirement Knocking Out Most Candidates:** **Strict Propriety** is the most demanding, eliminating many simple or intuitive measures. **Partition Invariance** eliminates all standard strictly proper rules (Brier, Log, Spherical).

  ### Evaluation of Common Rules Relative to Desiderata

  *   **Brier Score (Quadratic):** *Pros:* Strictly Proper (1), Aggregative (2), Differentiable Penalty (3), Coherence Sensitive (4), Bounded (6). *Cons:* Partition Sensitive (7). *Character:* "Gentler" - Penalizes errors, less extreme than Log.
  *   **Logarithmic Score:** *Pros:* Strictly Proper (1), Aggregative (2), Strong Differentiable Penalty (3), Coherence Sensitive (4). *Cons:* Partition Sensitive (7), **Unbounded** (6) - One extreme error can dominate a track record. *Character:* "Harshest" - Lavishly rewards confident right, destroys confident wrong.
  *   **Spherical Rule:** *Pros:* Strictly Proper (1), Aggregative (2), Differentiable Penalty (3), Coherence Sensitive (4), Bounded (6). *Cons:* Partition Sensitive (7). *Character:* Between Brier and Log in severity.

  ### Recommendation Path

  Given your *simultaneous* needs for **training signal, incentive (payout), and ranking** across diverse question sets and forecasters:

  1.  **Strict Propriety (1), Aggregativity (2), Coherence Sensitivity (4), and Differentiable Penalty (3) are non-negotiable.**
  2.  **Partition Invariance (7) is incompatible with 1 & 4.** You must accept partition sensitivity as the price of coherence and propriety.
  3.  **Boundedness (6) is highly desirable practically** but not epistemically essential.
  4.  **A clear Resolution Policy (5) is essential and independent of the rule choice.**

  **Therefore:** **Brier Score** is the recommended default. It satisfies all core non-negotiable desiderata (1-4), is bounded (6), and its partition sensitivity (7) is manageable operationally (ensure consistent question framing where possible). Its "gentler" nature provides leaderboard stability and is less punishing for model exploration during training than the unbounded Log Score, while still properly incentivizing honest and informative forecasts. The Spherical rule is a viable alternative if you prefer a slightly stronger penalty/reward structure than Brier but still want boundedness. Avoid Log Score due to its unboundedness creating instability and extreme penalties despite its theoretical strengths.
