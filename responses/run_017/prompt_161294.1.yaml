prompt: |-
  Hey — I'm a novelist, not a philosopher, and I've been fiddling with a little essay on the side for about a year now (partly as procrastination on my actual manuscript). I'd love comments on it before I decide whether to keep going. The context: my current manuscript has a scene I can't get right, and the essay is me trying to work out why it won't behave. Draft is below, it's rough, around 800 words. Please don't be polite for politeness' sake — I want to know what's actually wrong with it.

  ---

  **The Author's Double Effect**

  **1. The scene that started this.** Halvard is a signalman at a junction. A runaway train is heading for five workmen on the main line. He can throw a lever that sends it onto a siding where one man, Reuben, is working. He throws it. Reuben dies, the five live. This is the bog-standard switch case, and everyone who reads chapter 3 argues about whether Halvard is a murderer.

  Then, in chapter 19, the same sixty seconds gets narrated again — this time by Reuben's sister, standing on the platform. In her version the lever gets one subordinate clause: *the lever went over and Reuben was gone*. Same physics, same body count, same agent, same intentions. But readers of chapter 19 mostly don't argue about murder. They feel terrible and then they turn the page. Their verdict has moved, and the only thing that moved is the telling.

  **2.** The doctrine of double effect says, roughly: there's a difference between bringing about something bad *on purpose*, as what you're aiming at or as your means, and bringing it about as a foreseen by-product of something good you're doing. The second can be permissible where the first is not, given proportionality and so on. The reason people deploy it on trolley cases is that it seems to line up with the split intuition: turning the lever feels tolerable, shoving a stranger off a footbridge onto the tracks does not.

  **3. Here's what I think is interesting.** The lever/footbridge difference is supposed to be a difference in the *causal shape* of the act: in one case the death is a side effect, in the other it's the instrument. But my two chapters suggest the verdicts track something else. Two things, really.

  (a) *Aspectual privilege.* Whoever narrates gets to pick the description under which the act is evaluated. "I turned a lever" and "I killed a man" are the same event. Agents do this in real life too, and they're usually believed.

  (b) *Retroactive re-description.* A later chapter can retroactively make an earlier act count as intended. If chapter 20 reveals that Halvard would have thrown the lever even if the five had been safe — say because Reuben owed him money, or because he'd been waiting for a chance — then readers of chapter 3 go back and say, no, he was a murderer all along. But nothing about the causal shape of chapter 3 changed. Only the description the audience finally ratifies changed.

  **4.** So the proposal: the line that's doing the work isn't the intended/foreseen line at all. It's what I'm calling *aspectual authority* — who has the standing to fix the description of an act, and whose description the audience will ratify. Notice that aspectual authority is not distributed morally. It tracks social standing, eloquence, who gets to speak first, whose version gets the last word. The signalman has a lot of it; the sister has less; the narrator has all of it, and that's the part that makes me uneasy about my own job.

  **5. A test I want to propose**, mostly for my own use but I think it generalizes: call it the first-person disclosure test. A foreseen harm counts as *intended* if the agent could not, without self-deception, narrate the action in the first person, present tense, to the person who will be harmed or to that person's family, using the verb that says what physically happens. Halvard can say "I am throwing this lever." Can he say "I am dropping Reuben onto the rails in front of the train"? If he has to lie, or swap in a softer verb, or go passive — *the lever goes over* — then it's intended. I like this because it makes *lying* the tell rather than metaphysics, and lying is the thing novelists actually know about.

  **6.** Where I think it goes next, not written yet: offstage harm. Readers forgive characters for harms the narration never shows at all. That suggests first-person narration might be a moral technology for laundering intention, which is a depressing thing to discover about the form I work in.

  ---

  Things I specifically want:

  1. **Accuracy.** Am I misdescribing the doctrine of double effect anywhere, or the standard lever/footbridge split? Anything that would make a philosopher wince? In particular — is the worry that the intended/foreseen line is doing less work than it looks, because "closeness" of the connection is what really matters, a worry people actually raise? Or am I punching a strawman? If it is raised, tell me roughly how; no citations needed, I just don't want to build on sand.
  2. **The load-bearing claim.** Is §3 actually defensible — that changing *only* the narration can flip the intended/foreseen verdict? Or is the obvious explanation that readers are tracking something else entirely (blame, disgust, emotional salience) and I'm mislabeling it as a judgement about intention? I'd rather find that out now than in chapter 20.
  3. **Is "aspectual authority" a distinction that does real work**, or just a fancy name for something everyone already knows? Be blunt, I can take it.
  4. **Strongest objection** you can think of to the first-person disclosure test in §5. Especially one where it gives the wrong answer in the footbridge case, or where the agent is sincerely self-deceived and cheerfully narrates anything.
  5. **One direction for §6** that I haven't thought of.

  If you have comments on the writing itself, fine, but I mostly care about whether the thinking holds up. Also feel free to tell me if the whole thing collapses into something much more boring than I think it is.

  At the very end, give your overall assessment in a fixed form: \answer{KEEP IT}, \answer{REWORK}, or \answer{DROP IT}. And then a last line beginning "Bottom line:" with one sentence summing up your verdict.
reasoning: |-
  Okay, the user is a novelist who's written an essay about a philosophical concept applied to their writing. They're stuck on a scene and used this essay to explore why. They want honest feedback, especially on accuracy and whether their ideas hold water. 

  First, I need to check their understanding of the doctrine of double effect. They seem to have it right—distinguishing intended vs. foreseen outcomes. The lever/footbridge example is classic, so that's solid. But they wonder if the "closeness" of harm matters more than intention. Philosophers like Warren Quinn did discuss this, so it's not a strawman. Good—they're not building on sand.

  Next, their key claim: changing only the narration flips the reader's judgment. That's intriguing. They suggest it's not about causal structure but who controls the narrative ("aspectual authority"). But is it really about intention, or are readers reacting to blame or emotion? The sister's version in Chapter 19 focuses on loss, not moral judgment. Readers might feel grief, not reassess intention. So their claim might conflate moral verdict with emotional response. That's a potential weakness—readers aren't flipping their view of intention; they're just overwhelmed by the sister's pain.

  "Aspectual authority" as a term—does it add value? It captures how narrative privilege shapes perception, which is fresh for philosophy but obvious to storytellers. Still, it's useful for their argument. I'll note it's not revolutionary but clarifies their point.

  Their first-person disclosure test in §5 is clever: if you can't honestly describe the action bluntly to the victim's family, it's intended. But what about self-deception? Imagine Halvard genuinely believes he's saving lives and says cheerfully, "I'm crushing Reuben!" That'd make the test fail—he's not lying, but we'd still see it as unintended. So the test might misfire in cases of delusion or extreme ideology. Also, in the footbridge case, could someone say, "I'm pushing this man to stop the train" without lying? If they're fanatical, maybe. The test relies on sincerity, which is slippery.

  For §6, they suggest offstage harm lets characters "launder" intention. Another angle: first-person narration might not absolve but implicate. Think of Humbert Humbert—his narration exposes his manipulation. Or unreliability could heighten moral tension. Also, silence can be damning; what's omitted might haunt readers more. They should explore that duality.

  Overall, the essay has sharp insights but risks overreaching. The leap from narrative effect to redefining intention needs tightening. Still, it's provocative and worth keeping. Bottom line: rework to address the gaps, especially clarifying emotion vs. moral judgment, and refine the disclosure test.

  Final assessment: REWORK. The core idea is strong but needs grounding. They should keep going.
answer: |-
  Here’s a direct, unfiltered assessment addressing your questions point by point. I’ve focused on rigor over niceness.

  ---

  ### 1. **Accuracy**  
  - **Double Effect**: You’ve captured the core distinction (intended vs. foreseen side effect) correctly. Proportionality is mentioned, good.  
  - **Lever/Footbridge Split**: Standardly presented. Philosophers *do* debate whether "closeness" (e.g., physical proximity, causal directness) drives intuitions more than intention/foresight. Notable critics like **Judith Jarvis Thomson** and **Warren Quinn** argue this. Quinn’s "closeness" objection (if the harm is "too close," it collapses into intention) is a real counterargument—**not a strawman**. Your critique aligns with existing skepticism.  
  - **Wince Factor**: No major errors. Philosophers might bristle at reducing double effect to "aspectual authority" without engaging deeper debates (e.g., whether intention is inherent to acts or descriptions), but for your purpose, it’s defensible.  

  ### 2. **The Load-Bearing Claim (§3)**  
  **Problem**: Your core claim—*narration alone flips the intended/foreseen verdict*—is **overstated**.  
  - Readers aren’t re-evaluating intention; they’re experiencing **shifting emotional salience**. Chapter 3’s detached phrasing ("threw a lever") invites cold moral calculus. Chapter 19’s focus on Reuben’s death ("Reuben was gone") triggers grief/outrage, suppressing debate. It’s not that they now judge the death as "unintended"—it’s that they’re too distressed to moralize.  
  - **Alternative Explanation**: You’re conflating **moral judgement** (was it murder?) with **narrative empathy**. The sister’s version doesn’t make Halvard’s act *less intended*; it makes readers *care more about Reuben*. The "verdict" change is emotional, not logical.  
  - **Fix**: Tighten the claim. Say narration *reframes the act’s moral phenomenology*, not that it alters the intention/foresight line itself.  

  ### 3. **"Aspectual Authority"**  
  - **Verdict**: **Does real work**—but it’s a **sharp label for an observed power dynamic**, not a philosophical novelty.  
  - **Strengths**: It crystallizes how narrative control (who speaks, how vividly) shapes moral perception. The social-standing angle (signalman vs. sister) is incisive.  
  - **Weakness**: It risks sounding like jargon. Clarify it’s *your* term for a mechanism writers exploit, not a formal philosophical tool.  

  ### 4. **Strongest Objection to the Disclosure Test (§5)**  
  **The Sincere Fanatic/Objectifier**:  
  > Halvard looks Reuben’s sister in the eye and says: "I’m crushing your brother into paste with this train to save five others."  
  - **Why it breaks**: He’s truthful, uses blunt verbs, no self-deception—yet we’d still call the death *foreseen*, not *intended*. His goal is saving lives; killing is a cost, not an aim. Your test falsely labels this "intended."  
  - **Deeper Issue**: The test assumes honest self-narration reveals intention. But intention is tied to *reasons for acting*, not linguistic comfort. A footbridge-pusher might say, "I’m turning this man into a brake block" sincerely (if unhinged). That doesn’t make the death "intended" in the double-effect sense—it just means he’s monstrous.  
  - **Fix**: Limit the test to *non-psychopathic agents*. Or frame it as exposing *moral evasion*, not defining intention.  

  ### 5. **Direction for §6 (Offstage Harm)**  
  **Unexplored Angle**: **First-person narration as *amplifying* guilt, not laundering it**.  
  - Example: A narrator who casually mentions offscreen harm ("I told James to handle it") reveals their moral blindness. Readers *condemn* them precisely because the harm is buried—it highlights their avoidance.  
  - Contrast: An omniscient narrator skipping harm feels like evasion; first-person skipping feels like *character self-deception*. This duality could deepen your "moral technology" idea.  

  ---

  ### Overall Writing Notes  
  - **Strengths**: Clear, engaging, philosophically literate. §4’s link to social power is standout.  
  - **Weaknesses**:  
    - §3’s claim needs nuance (emotion vs. judgement).  
    - §5’s test is clever but philosophically shaky; present it as a *writerly heuristic*, not an ethics tool.  
  - **"Boring" Risk**: No—connecting narrative technique to moral psychology is fresh. But trim §2’s philosophy recap; dive faster into your original argument.  

  ---

  \answer{REWORK}  
  **Bottom line:** The core insight (narrative control shapes moral perception) is compelling and worth developing, but needs tighter logic around intention and emotion.
