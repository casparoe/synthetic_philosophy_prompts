     - The sharp Bayesian might say: "I have a prior over the bags." But if they don't have a sharp prior, then they are in the imprecise setting. If they do have a sharp prior, then they avoid dilation? For example, if they think each bag is equally likely, then:

          Unconditional P(A) = 0.6.

          Given S:
            P(S) = P(S|P)*P(P) + P(S|Q)*P(Q) = (0.5)(0.5) + (0.4)(0.5) = 0.25+0.2=0.45? 
            Then P(A|S) = [P(A and S|P)*P(P) + P(A and S|Q)*P(Q)] / P(S)
                     = [ (0.3 * 0.5) + (0.1 * 0.5) ] / 0.45 = (0.15+0.05)/0.45 = 0.2/0.45 = 4/9 ≈ 0.444.

          So they would have a sharp 0.444. But they had to choose a prior. Without a sharp prior, they have the set.

     - The activity can't force the student to be imprecise. But it shows that if they are in a state of ignorance (represented by the set), then conditioning can dilate.

  6. **Predictable Problems**:
     - Some students might say: "I don't know the bag, so I'll assume uniform prior." Then they have a sharp prior and avoid dilation. We must emphasize that the setup is that they do not have any sharp prior over the bags.
     - Someone might demand to open the envelope: we must say that the envelope remains sealed and that we are modeling ignorance.
     - In the bookie round, some students might not trade at all, and some might only trade one way. The sure loss might not happen. But if at least one student does both, we can point it out.

  7. **Contrivance**:
     - The numbers were chosen so that the marginal of A is the same in both bags. This is necessary for the initial sharp credence. So the effect was contrived.

  **Revised Marble Counts?** 

  We did not change the counts because they work. But we double-checked: yes.

  **Adjustments for Scoring**:

  - Start with 10 points.
  - Pre-mortem: +1 if correct, -1 if incorrect.
  - Information decision: we asked if they would avoid for 0.5 points. We don't charge or give points for this because we revealed anyway. But we can give 0.5 points to those who said "Yes" (they would avoid) if we had actually given the option? But we didn't. So we skip scoring for that part? Or we can say: "If you said 'Yes' (you would avoid) then you get 0.5 points because you made the rational choice." But that's not what happened. We decide not to score this part, but use it for discussion.

  - Bookie round: each trade affects points. For example, if a student sells a ticket at 0.45, then they get 0.45 points. Then when A occurs, they lose 1 point. If not, they lose 0. Similarly, if they buy at 0.55, they lose 0.55 points. Then if A occurs, they gain 1 point. If not, they gain 0.

  - Also, the bookie: if the bookie buys one ticket, they lose 0.45 at the moment, then gain 1 if A occurs. If they sell one ticket, they gain 0.55, then lose 1 if A occurs. The bookie may have multiple trades. We must calculate net.

  **Final Note**: The actual marble draw: we must fix the bag and the draw. We choose bag P and draw a green. Then S occurs. Then the true probability of A (given S and P) is 0.6. But the students don't know that.

  We'll run with these.
