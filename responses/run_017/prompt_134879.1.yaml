  ### Participant Handout: The Marble Game  
  **Instructor Script & Game Materials**  

  ---

  #### **Setup**  
  *Instructor places two sealed bags (labeled "Bag P" and "Bag Q") on a table, along with a sealed envelope. Draws one marble from an opaque container (pre-selected bag) and hides it.*  

  **Handout Text:**  
  "We have two bags of 100 marbles, each with four colors:  
  - **Bag P**: 30 red, 30 blue, 20 green, 20 yellow.  
  - **Bag Q**: 10 red, 50 blue, 30 green, 10 yellow.  

  I secretly chose **one** bag (via a method in this sealed envelope, which stays sealed). I drew one marble from it—its color is hidden. We care about two events:  
  - **Event A**: Marble is red or blue.  
  - **Event S**: Marble is red or green.  

  You start with **10 points**. Points convert to extra credit: 15+ = A, 12–14 = B, 9–11 = C, etc. Trades affect your points."  

  ---

  ### **Game Sequence**  
  *Instructor reads aloud, pausing for student actions.*  

  1. **Initial Assessment (5 min)**  
     *Instructor:* "First, what is your fair price for a ticket paying $1 if **A occurs**? Write your **bid** (max price you’d buy at) and **ask** (min price you’d sell at) on Card 1. Trade if I offer a price ≤ your bid or ≥ your ask. *Example*: If your bid is $0.60, you buy if offered ≤$0.60."  
     *Students write bids/asks. Instructor collects and displays anonymous responses (expected: clustered at $0.60).*  
     *Instructor:* "Notice: Both bags have a 60% chance of A (Bag P: 60 red/blue, Bag Q: 60 red/blue). So your bid and ask should both be $0.60—a *sharp* belief."  

  2. **Pre-Mortem Prediction (5 min)**  
     *Instructor:* "Next, I’ll reveal if **S occurred**. But first: Predict how this news will affect your bid-ask spread for A. On Card 2, write: (a) Will your spread get **wider**, **narrower**, or **stay the same**? (b) Why? Hand it in—you gain 1 point if correct, lose 1 if wrong."  

  3. **Information Decision (5 min)**  
     *Instructor:* "I’ll offer to tell you if S occurred… but it costs you. Each of you can **pay 0.5 points to avoid learning S**. If you avoid, you can’t hear the reveal. If you learn, you lose nothing extra. Decide now—write ‘Avoid’ or ‘Learn’ on Card 3."  
     *Collect cards. Tally and announce:* "X chose to avoid, Y to learn. Since Y > 0, I reveal S to everyone. Those who paid 0.5 to avoid, close your eyes/ears for 10 seconds."  
     *Reveal S based on pre-drawn marble (e.g., if green: "S occurred—marble is red or green").*  

  4. **Re-Assessment (5 min)**  
     *Instructor:* "Now, knowing S [occurred/did not occur], update your bid and ask for A. Write on Card 4. *Reminder*: If S occurred, we’re in a world with only red/green marbles; if not, only blue/yellow."  

  5. **Bookie Round (10 min)**  
     *Instructor selects a student as "bookie." Bookie reads script:*  
     "I offer two trades:  
     - **Trade 1 (Sell)**: I buy a $1-if-A ticket from you for **$0.45**.  
     - **Trade 2 (Buy)**: I sell you a $1-if-A ticket for **$0.55**.  
     You can accept one, both, or neither. I honor all trades."  
     *Students write choices anonymously. Bookie collects and records.*  

  6. **Outcome Reveal (2 min)**  
     *Instructor reveals marble color and whether A occurred (e.g., "Green—so A did not occur"). Settle trades (e.g., if A did not occur, sellers keep $0.45, buyers lose $0.55).*  

  ---

  ### **Debrief & Theory Mapping (15 min)**  
  *Instructor uses board to map game moments to theory.*  

  1. **The Jolt: Sharp Credence from Ignorance**  
     - *What happened*: Unconditional P(A) = 0.6 for both bags → sharp 0.6 credence.  
     - *Why*: Even with ignorance (no prior over bags), the set of probabilities {0.6, 0.6} collapses to a point.  
     - *Predictable issue*: "Why not assume a 50/50 prior?" → Reject: The envelope forces ignorance.  

  2. **Dilation: When Information Blurs Beliefs**  
     - *What happened*: After learning S, your interval for A dilated:  
       - If S occurred: P(A|S) = 0.6 (Bag P) or 0.25 (Bag Q) → interval [0.25, 0.6].  
       - If not S: P(A|¬S) = 0.6 (Bag P) or ≈0.83 (Bag Q) → interval [0.6, 0.83].  
     - *Why*: The bags agree marginally on A but *disagree conditionally* on S. Learning S breaks symmetry.  
     - *Predictable issue*: "I’ll split the difference!" → But the set isn’t a distribution; it’s ignorance.  

  3. **Information Avoidance**  
     - *What happened*: You paid to avoid free information.  
     - *Why*: Learning S *cost precision*—dilation was predictable (sharp 0.6 → interval). Rational if you value precision.  

  4. **Bookie Round: Permissive vs. Strict Rules**  
     - *Trade prices*: $0.45 (buy) and $0.55 (sell) inside [0.25, 0.6] (if S occurred).  
     - **Permissive rule** (trade ok if *some* probability in set endorses it):  
       - Selling at $0.45: Good if P(A)=0.25 (thinks ticket worth $0.25).  
       - Buying at $0.55: Good if P(A)=0.60 (thinks ticket worth $0.60).  
       - *Risk*: Doing both → sure loss of $0.10 (sell for $0.45 + buy for $0.55 = net -$0.10; payouts cancel).  
     - **Strict rule** (trade ok only if *all* probabilities endorse it):  
       - Selling at $0.45: Bad if P(A)=0.60 (undervalues ticket).  
       - Buying at $0.55: Bad if P(A)=0.25 (overvalues ticket).  
       - → No trades.  
     - *What we did*: You used permissive (default for imprecise credences). Result: If anyone did both trades, they lost.  

  5. **Limitations & Honest Notes**  
     - *"But I have a secret prior!"* → The game can’t force you to be imprecise. But dilation hits when you lack a prior.  
     - *Contrivance*: The effect needs P(A) identical in both bags but P(A|S) different. Random numbers won’t work.  
     - *What we didn’t see*: Dilation isn’t always bad—it can reflect genuine uncertainty. But here, it costs precision.  

  ---

  **Why the Numbers Work**  
  - Unconditional P(A): Both bags = (60/100) = 0.6 → sharp credence.  
  - Conditional P(A|S):  
    - Bag P: S = red/green (50 marbles). A∩S = red (30) → P(A|S) = 30/50 = 0.6.  
    - Bag Q: S = red/green (40 marbles). A∩S = red (10) → P(A|S) = 10/40 = 0.25.  
  - Conditional P(A|¬S):  
    - Bag P: ¬S = blue/yellow (50 marbles). A∩¬S = blue (30) → P(A|¬S) = 30/50 = 0.6.  
    - Bag Q: ¬S = blue/yellow (60 marbles). A∩¬S = blue (50) → P(A|¬S) = 50/60 ≈ 0.833.  
  - *Effect*: Learning S dilates A to [0.25, 0.6]; learning ¬S dilates to [0.6, 0.833].  

  **Run Adjustments**  
  - Pre-draw the marble (e.g., from Bag P: green) to fix S (occurred).  
  - If no one trades in Bookie Round, simulate: "Suppose Alice sells at $0.45 (thinks P=0.25) and Bob buys at $0.55 (thinks P=0.60). Alice then buys from Bob? Net loss."  
  - If students vote to avoid S, reveal anyway (per rules) but discuss avoidance rationales.  

  **Final Note**  
  This is **dilation** in imprecise probability—conditioning expands your intervals. Tomorrow: When this matters in real decisions.
