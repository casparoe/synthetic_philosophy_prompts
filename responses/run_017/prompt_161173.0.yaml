  ### Leaves (Terminal Positions)
  Each leaf represents a coherent account of the killing/letting-die distinction. Named leaves align with known positions; unnamed lack clear labels. **Bold** indicates your cases are covered. Asymmetry flip (ugly letting die) is addressed in all leaves.  

  1. **Leaf 1 (from 4A): Traditional View (Initiator Focus)**  
     - Killing requires direct, intentional harm; letting die is allowing nature. Vent withdrawal: letting die. Re-arming failure: omission (letting die). Handoff: initiator responsible. Surgeon case: letting die. Competent refusal: letting die. Intention matters (unintended death isn't killing). Time irrelevant. Iatrogenic threat: letting die. **Asymmetry flip**: Killing always worse, even if letting die is protracted.  

  2. **Leaf 2 (from 4B): Traditional View (Actor Focus)**  
     - Same as Leaf 1, but handoff responsibility lies with the actor (e.g., the one who disconnects the vent).  

  3. **Leaf 3 (from 4C): Shared Agency View**  
     - Distinction depends on collective intent/systemic action. Vent withdrawal: letting die. Re-arming failure: omission. Handoff: shared. Surgeon case: letting die. Competent refusal: letting die. **Asymmetry flip**: Killing worse; slow death doesn’t flip asymmetry.  

  4. **Leaf 4 (from 5A): Unnamed (Inconsistent Omission)**  
     - Vent withdrawal: letting die. Re-arming failure: killing (ongoing action). Surgeon case: letting die. **Unoccupied because incoherent**: Failing to re-arm is classified as killing while identical withdrawals (e.g., vent) are not, with no clear principle.  

  5. **Leaf 5 (from 5B): Causal Responsibility View**  
     - Killing is imposing or sustaining a threat; letting die is not fixing a natural threat. Vent withdrawal: letting die. Re-arming failure: killing. Surgeon case: killing (created dependence). Competent refusal: letting die. Time irrelevant. Iatrogenic threat: killing. **Asymmetry flip**: Killing usually worse, but may flip if letting die is torturous.  

  6. **Leaf 6 (from 6A): Double Effect View**  
     - Intention defines killing; unintended death (even from action) is letting die. Vent withdrawal: letting die if unintended. Re-arming failure: letting die if unintended. Handoff: depends on intent. Surgeon case: killing if intended. Competent refusal: letting die. Time irrelevant. Iatrogenic threat: letting die. **Asymmetry flip**: Killing always worse.  

  7. **Leaf 7 (from 6B): Unnamed (Intentionalism without Distinction)**  
     - Vent withdrawal: killing. Competent refusal: killing. Intention matters only for permissibility, not distinction. **Unoccupied because unattractive**: Reduces all inaction to killing, ignoring patient autonomy.  

  8. **Leaf 8 (from 7A): Time-Sensitive View**  
     - Killing is immediate causation; letting die is delayed. Vent withdrawal: killing if death in minutes; letting die if weeks. Re-arming failure: killing (rapid). Competent refusal: letting die (slower). **Asymmetry flip**: May flip—protracted letting die can be worse than quick killing. **Unoccupied because arbitrary**: No major theory ties distinction to time alone.  

  9. **Leaf 9 (from 8A): Moral Equivalence View**  
     - No intrinsic moral distinction; context determines wrongness. Vent withdrawal: killing (but may be justified). Re-arming failure: killing. Iatrogenic threat: killing. Time irrelevant. **Asymmetry flip**: Easily flips—letting die can be worse if more harmful.  

  10. **Leaf 10 (from 8B): Natural Causation View**  
      - Letting die only applies to natural threats; killing involves human-caused harm. Vent withdrawal: letting die. Iatrogenic threat: letting die. Re-arming failure: omission (letting die). **Asymmetry flip**: Killing worse, but may flip if letting die involves avoidable suffering.  

