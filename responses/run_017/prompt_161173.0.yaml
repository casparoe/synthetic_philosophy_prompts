  **Paragraph on the most divisive node:**

  The most divisive node in clinical ethics consultations is the initial question of whether withdrawing life-sustaining treatment (e.g., turning off a ventilator) constitutes letting die or killing. This node splits the tree into two fundamentally different approaches: one that views treatment withdrawal as allowing the underlying disease to take its course (letting die) and another that sees it as an active cause of death (killing). This disagreement underlies many conflicts in consultation, as it shapes how we interpret subsequent actions, assign responsibility, and assess moral permissibility. Understanding which view one instinctively adopts is the first step in diagnosing the root of disagreement in ethics committee deliberations.
