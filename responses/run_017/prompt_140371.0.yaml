  1.  **Angle: Patternism Tested by Memory Theft (Counterfeit Problem)**
      *   *Yield:* Explores the necessity of a causal-history constraint for survival-in-pattern (Héctor's stolen songs don't count). Argues *Coco* implicitly demands authentic causal chains, aligning with Hofstadter's need for pattern *origin*.
      *   *Decision:* **KEEP** (Crucial for point 1, core philosophical tension).
  2.  **Angle: Ritual as Proxy for Structure (Unremembered Instantiation)**
      *   *Yield:* Argues the film's external mechanics (photos, ofrendas) are *symbolic representations* of the deeper, structural instantiation Hofstadter describes (habits, bans, skills). The photo *stands for* the causal pattern.
      *   *Decision:* **KEEP** (Addresses point 2, bridges film mechanics/philosophy).
  3.  **Angle: Narrative Necessity of the Cliff Edge (Degree vs. Threshold)**
      *   *Yield:* Examines why *Coco* needs a binary "Final Death" (dramatic stakes, clear visual metaphor) despite Hofstadter's gradualism. The film "cheats" visually (fading) but the *crisis point* (Coco forgetting) is still a sharp threshold in practice.
      *   *Decision:* **KEEP** (Addresses point 3, highlights film/philosophy divergence).
  4.  **Angle: Second-Order Survival & the Fading Spark (Dilution)**
      *   *Yield:* Analyzes whether Miguel carrying Coco's memory of Héctor counts as Héctor surviving. Argues it does, but extremely diluted; the film's horror reflects the *loss of richness/authenticity*.
      *   *Decision:* **KEEP** (Addresses point 4, key to Hofstadter's degrees).
  5.  **Angle: The Metaphysical Mismatch: Skeletons vs. Patterns (Breakdown)**
      *   *Yield:* Confronts the film's literal afterlife (sentient skeletons facing annihilation) vs. Hofstadter's patternism (no subjective experience post-extinction). Concludes the film's horror is *really* about the *living's* profound loss and fear of oblivion.
      *   *Decision:* **KEEP** (Essential honesty, addresses core breakdown & student's "pun" point).

  **Dropped:** A purely "Hofstadter critiques *Coco*" angle – too reductive. Need mutual illumination. Also dropped a focus solely on Miguel as Héctor's new substrate – covered under Dilution/Unremembered Instantiation.

