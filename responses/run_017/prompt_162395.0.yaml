prompt: |-
  After a long argument with a friend last night — we were fighting about who should get a vote on the city's proposed coastal flood barrier, which shifts surge risk onto an upstream municipality outside the city limits — I tried to write down the general position I found myself defending, and I'm no longer sure it holds together. Roughly:

  1. Where a collective decision puts someone's significant interests at stake, that person has a pro tanto claim to a say in it.
  2. But "affected" has to be read counterfactually over options rather than over welfare: you are affected just in case the decision changes what you can do, not merely how well off you end up. And I also want to say that the real ground of the claim is that the outcome will be imposed on you — you cannot opt out — with affectedness serving only as evidence of that.
  3. The constituency should be drawn issue by issue rather than fixed once and for all at a territorial border.
  4. Political equality matters, and what it requires is equal power over the whole set of decisions that shape your life, not merely equal weight within each individual decision.
  5. Decisions about the franchise itself are legitimately made by those already enfranchised.
  6. Children and adults with severe cognitive disabilities are rightly excluded from voting, with guardians answering for their interests instead.
  7. On the barrier, I defended consultation and a duty to give reasons for the upstream residents but no vote — even though I would give full votes to long-term non-citizen residents of the city itself.

  Which of these actually collide, and how badly? I want the tensions ranked by severity, each with what I would have to give up to resolve it, and I want to be told which apparent collisions are not real ones, because I would rather not abandon a commitment I am entitled to keep. Finally, if there is one revision that does the most work across the set, say what it is and what it costs me.
reasoning: |-
  Okay, the user has presented a complex set of principles they've developed regarding political representation and voting rights, stemming from a real-world disagreement about a coastal flood barrier. They want to identify internal conflicts in their framework and understand which tensions are most severe. 

  First, I need to carefully unpack each of their seven points. The core tension seems to be between their strong principle (1) that affected parties deserve a say, and their practical conclusion (7) denying upstream residents a vote despite significant impact. That's the glaring contradiction I should address first. 

  Hmm, point (2) actually makes this worse - by defining "affected" counterfactually through options rather than welfare, and emphasizing non-consensual imposition, the upstream residents clearly qualify. Yet in (7) they're denied a vote. That's inconsistent unless the territorial exclusion in (3) overrides it, but (3) explicitly rejects fixed territorial constituencies. 

  *scribbles mentally* The territorial point is key - in practice they're still relying on city boundaries when denying upstream votes, even though (3) says constituencies should be issue-specific. That hypocrisy needs calling out. 

  Looking at point (4) about political equality... this actually compounds the problem! If we care about equal power over life-shaping decisions, excluding affected upstream residents directly violates that. Yet (5) provides an escape hatch - existing voters decide franchise rules. But that feels circular when questioning the legitimacy of exclusion. 

  *notes tension* The cognitive disability exclusion (6) is theoretically consistent - guardians represent interests without voting rights. But this highlights the inconsistency: why represent some vulnerable groups but not others? 

  For severity ranking: 
  - The (1)+(2) vs (7) conflict is catastrophic because it undermines their core justice principle. 
  - The (4) vs (7) equality violation is nearly as bad. 
  - (3)'s rejection of fixed borders clashes with (7)'s implicit reliance on them. 
  - (5) creates a bootstrapping problem if initial franchise is unjust. 

  Surprisingly, (6) holds up reasonably well as a coherent exception. 

  The most damaging admission would be accepting that their flood barrier stance contradicts their philosophy. But the alternative - giving votes to all affected parties - might make governance unwieldy. Maybe a middle path: for cross-border impacts, create issue-specific voting districts? That salvages (1),(2),(3),(4) but forces compromise on (7) and requires rethinking decision-making structures. 

  Ultimately, they're trying to reconcile moral philosophy with practical politics. The cost of consistency is either abandoning their barrier position or redesigning democratic processes. I should emphasize that while uncomfortable, naming this tension is intellectually honest.
answer: |-
  Here's a breakdown of the tensions within your framework, ranked by severity, with analysis of conflicts, non-conflicts, potential resolutions, and a key revision:

  **Severity Ranking (Most Severe First):**

  1.  **The Core Justice Conflict: (1) + (2) vs. (7)**
      *   **Collision:** This is the most fundamental and severe conflict. Principle (1) + your clarification in (2) ("affected counterfactually over options," "outcome imposed on you") strongly implies that the upstream residents, whose significant interests (property, safety, environment) are demonstrably at stake and who cannot opt out of the barrier's consequences (changed flood risk), have a *pro tanto* claim to a say. Denying them a vote in (7) directly violates this core principle of inclusion based on significant, non-consensual impact.
      *   **Severity:** High. It strikes at the heart of your stated principle of procedural justice for the affected.
      *   **To Resolve:** You must either:
          *   **Abandon/Modify (1)/(2):** Weaken the principle (e.g., say "affected" only applies within existing political boundaries, but this contradicts (3); or require a higher threshold of "significant interest" than clearly applies here).
          *   **Abandon/Modify (7):** Grant the upstream residents a vote on the barrier issue specifically (aligning with (3)), or at least a much stronger participatory right than mere consultation/reasons.
          *   **Introduce a New Principle:** Argue that certain types of "imposition" (like negative externalities managed within a jurisdictional framework) don't trigger the full claim to a vote, only weaker rights like consultation. This requires a robust justification not currently present.

  2.  **The Equality Gap: (4) vs. (7)**
      *   **Collision:** Principle (4) demands "equal power over the whole set of decisions that shape your life." The barrier decision demonstrably shapes the lives of upstream residents (e.g., flood risk, property value, environment). Denying them a vote directly excludes them from power over this highly consequential decision affecting them, creating inequality in their overall political power compared to city residents who *do* vote on it.
      *   **Severity:** High. Directly contradicts the requirement for overall equality in life-shaping power.
      *   **To Resolve:** Same options as conflict #1: Modify (4), modify (7), or introduce a new justification for why exclusion here doesn't violate overall equality (e.g., argue city residents face more life-shaping decisions overall, but this is weak justification for denying power over *this specific, major* decision).

  3.  **Constituency vs. Territorial Practice: (3) vs. (7)**
      *   **Collision:** Principle (3) argues constituencies should be drawn issue-by-issue, rejecting fixed territorial borders as the sole determinant. Yet, in (7), you deny the vote to upstream residents *precisely because* they are outside the city's territorial border, even though they are clearly the most affected non-city group *for this specific issue*. You *are* using the territorial border to fix the constituency here.
      *   **Severity:** High-Moderate. (7) represents a practical application that directly contradicts the theoretical commitment of (3) for this issue.
      *   **To Resolve:** You must either:
          *   **Abandon/Modify (3):** Accept that fixed territorial borders *are* the primary (even if imperfect) way to define constituencies for practical reasons, despite cross-border effects. But this weakens the normative force of (3).
          *   **Abandon/Modify (7):** Apply (3) consistently and include upstream residents in the voting constituency *for this specific barrier decision*.
          *   **Clarify (3):** Argue that issue-specific constituencies are ideal but logistically constrained, and the city border is the best *available* proxy *for now*. This feels like an ad hoc justification for the barrier case.

  4.  **The Bootstrapping Problem: (1) + (2) vs. (5)**
      *   **Collision:** Principle (5) states decisions about the franchise are legitimately made by those already enfranchised. However, if the initial franchise boundaries (like the city limits excluding upstream areas) were set in a way that excluded people who *should* have been included under (1)/(2) (people significantly affected by the polity's decisions), then (5) risks legitimizing an unjust status quo. Decisions about *who counts as affected enough to be enfranchised* are themselves subject to the problem in (1)/(2). Why should the city alone decide who gets a say on issues affecting outsiders?
      *   **Severity:** Moderate. It reveals a potential circularity or foundational injustice in how the franchise is defined, which can undermine (1)/(2) in the long run.
      *   **To Resolve:** You must either:
          *   **Modify (5):** Acknowledge that franchise decisions require special justification or broader input (e.g., involving higher levels of government, affected outsiders in consultation) when they impact outsiders who might have a claim under (1)/(2). (5) might hold primarily for adjusting franchise *within* an already justified constituency.
          *   **Clarify Scope:** Argue that (1)/(2) only apply *after* a legitimate initial franchise is established via (5), but this requires justifying why the initial territorial franchise *is* legitimate under (1)/(2) when it excludes affected outsiders. This is difficult.

  5.  **Representation vs. Direct Say: (1) + (2) vs. (6)**
      *   **Collision:** Principle (1)/(2) suggests anyone significantly affected/non-consensually imposed upon has a claim to a say. Children and the severely cognitively disabled are often significantly affected by collective decisions and cannot opt out. (6) denies them a direct say, relying on guardianship.
      *   **Severity:** Low-Moderate (and likely resolvable). This is the *least* severe tension because robust representation via guardians *can* be seen as satisfying the core demand of (1) - having their significant interests represented in the decision-making process. The "say" is exercised *for* them. This is a widely accepted exception based on capacity.
      *   **Non-Conflict?:** This is **likely NOT a true contradiction** given your phrasing. You specify "guardians answering for their interests instead." If guardianship is effective and focused on representing their interests, it arguably fulfills the *pro tanto* claim derived from (1)/(2). The "say" is indirect/vicarious.
      *   **To Resolve (if pressed):** Strengthen the justification for (6): The claim under (1)/(2) is not for a direct vote *per se*, but for having one's significant interests adequately represented and considered in the decision. Guardianship, when properly functioning, provides this representation where direct participation is impossible or ineffective. This preserves the core of (1)/(2) while accepting a practical limitation.

  **Non-Conflicts:**

  *   **(7) - Non-citizen residents:** Granting votes to long-term non-citizen residents within the city is fully compatible with (1)/(2) (they are affected/imposed upon), (3) (constituency defined by residence + impact, not just citizenship), and (4) (increases their overall power over life-shaping decisions). It might even be required by them.
  *   **(6) - Cognitive Disability/Children:** As argued above, this is likely consistent with (1)/(2) via representation, and is a standard, justifiable exception.

  **The Most Impactful Revision & Its Cost:**

  *   **Revision:** **Modify Principle (7) to grant upstream residents a vote *specifically on the barrier issue*.** (Aligning with (3)).
  *   **Why it does the most work:**
      *   Directly resolves the Core Justice Conflict (#1) and the Equality Gap (#2) by giving the affected/imposed-upon group a formal say, satisfying (1)/(2).
      *   Resolves the Constituency vs. Territorial Practice conflict (#3) by implementing the issue-specific constituency principle (3) for this major cross-border impact.
      *   Mitigates the Bootstrapping Problem (#4) by demonstrating that the franchise *can* be adjusted issue-by-issue to include the affected, rather than being rigidly fixed by the initial territorial franchise.
      *   Leaves (5) and (6) intact and unchallenged by this specific decision.
  *   **Cost:**
      *   **Practical Complexity:** Implementing issue-specific voting constituencies is administratively complex. Defining the relevant electorate for each cross-border issue requires clear criteria and machinery.
      *   **Dilution of City Autonomy:** City residents lose exclusive control over a decision impacting their territory (even if also impacting others). They must share decision-making power with outsiders.
      *   **Potential for "Government by Referendum":** If applied too broadly, it could fragment decision-making. Need clear criteria for *when* an issue triggers an expanded constituency (e.g., scale of impact, directness of imposition).
      *   **Requires Defining the "Issue-Specific Constituency":** You need principled rules for *who exactly* gets a vote on the barrier (e.g., everyone within X km of the river? Property owners in the flood zone? The whole upstream municipality?).
      *   **Political Feasibility:** This may be difficult to achieve politically, as existing powerholders (city voters/council) may resist ceding authority.

  **Conclusion:**

  Your framework is internally stressed primarily because your conclusion on the barrier (7) contradicts your core principles of inclusion for the significantly affected/non-consensually imposed upon (1)/(2), political equality (4), and issue-specific constituencies (3). The tension with franchise bootstrapping (5) highlights a deeper challenge. The exclusion of children/cognitively disabled (6) is your most consistent point, relying on representation. Granting votes to long-term non-citizen residents aligns well with your principles.

  To achieve consistency, the most significant revision is to embrace issue-specific voting constituencies (3) for major cross-border impacts like the barrier, granting upstream residents a vote. This resolves the most severe conflicts but comes at the cost of practical complexity and reduced autonomy for the core territorial unit (the city). If you are unwilling to pay this cost, you will need to significantly weaken principles (1), (2), (3), and/or (4) to justify the territorial exclusion in (7), which may undermine the normative appeal of your overall position.
