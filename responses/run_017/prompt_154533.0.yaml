prompt: |-
  I'm applying for a six-month independent research grant — me at full time, plus maybe two months of a contractor for engineering — and I need the intellectual core of the proposal: roughly a thousand to twelve hundred words covering the question, why existing work leaves it open, the method, what a result would look like, and what would count as the project failing. I'll handle the budget, the timeline boilerplate, and the literature review myself, so please don't spend words on citations, reading suggestions, or on re-explaining goal misgeneralization back to me. Assume I know the standard formalization and the well-known demonstration where an agent trained in an environment whose reward object always sits at the level exit later heads for that object rather than the exit once the object is moved.

  Here is the half-formed idea I want turned into something fundable. I think the field routinely reads off-distribution failures of goal-directedness as one phenomenon — the policy learned the wrong goal — when there are at least three distinct things that could be going on, and they all produce the same observable behavior:

  1. Goal-content misgeneralization: the objective the policy is effectively optimizing is not the intended one.
  2. Satisfaction-condition misgeneralization: the objective is the intended one, but what counts as having achieved it — including when to stop, and when enough is enough — generalizes wrongly, e.g. a proxy for completion is treated as completion.
  3. Referential misgeneralization: the policy wants the intended thing, but the extension of its concept of that thing is wrong off-distribution, so it competently pursues the right goal under a wrong description of the situation.

  I want a proposal that takes this trichotomy seriously enough to be dangerous: state the question so that it has a determinate answer in six months, and make the central methodological bet an interventional one — counterfactual environment edits, cross-environment tests of goal identity, and probes that ask what the policy would do under changes that discriminate the three diagnoses — rather than more observational evaluation. Argue explicitly for that approach against the obvious alternatives (throwing more distributional diversity at training, trying to read goal content off internal representations, or trying to define inner alignment formally first and operationalize later), and say why those fail here.

  The proposal should also commit to a claim about the payoffs: if these three really are distinct, they differ in what fixes them, and I suspect they also differ in how they respond to increased capability — my guess is that the third is partly a capability failure that scale might erode, while the second could get worse as agents get better at exploiting a proxy completion signal. Tell me whether you think that guess is right, and if not, what the truth is.

  Three more things. First, give a concrete deliverable beyond a paper — I'm imagining a small diagnostic suite and a written protocol someone in a lab could actually run when they hit an off-distribution failure and want to know which of the three they're looking at. Second, be honest about scope: what would have to be cut for this to fit one person and six months. Third, name at least two failure conditions, and make one of them the ugly one: if no probe in a well-chosen family of environments discriminates the three, then the distinction is empirically empty and the honest result is that asking what goal the model learned is not a well-defined empirical question in this regime.

  Be committed throughout. Where my framing is wrong, restructure it rather than humoring me — if one of my three collapses into another, say which and why. Take a definite position on which diagnosis is most common and which is most dangerous in present-day systems, give your reasons, and mark which claims you'd defend in a seminar versus which you're extrapolating. End by naming the single assumption in the proposal you'd most expect to be false.
reasoning: |-
  We are writing a research proposal for a 6-month independent grant. The core intellectual content (1000-1200 words) must cover:
  - The research question
  - Why existing work leaves it open
  - The method (interventional: counterfactual edits, cross-environment tests, diagnostic probes)
  - What a result would look like
  - What would count as failure

  We are to avoid citations, literature review, and re-explaining goal misgeneralization. We assume the reader is familiar with the standard formalization and the well-known demonstration (e.g., the agent heads for the moved object instead of the exit).

  The core idea: The field currently lumps off-distribution failures of goal-directedness into one bucket (goal misgeneralization) when there are at least three distinct phenomena:
  1. Goal-content misgeneralization (GCM): the policy optimizes the wrong objective.
  2. Satisfaction-condition misgeneralization (SCM): the objective is correct, but the conditions for satisfaction (when to stop, what counts as completion) are wrong.
  3. Referential misgeneralization (RM): the objective is correct, but the policy has a wrong description of the situation (wrong extension of the concept).

  Proposal must:
  - Take the trichotomy seriously and design an interventional method (not observational) to discriminate them.
  - Argue against alternatives: more distributional diversity, reading off internal representations, formalizing inner alignment first.
  - Commit to a payoff claim: the three types differ in how to fix them and how they respond to capability increases (scale). We have a guess: RM might be eroded by scale, SCM might get worse with scale. We want the assistant to evaluate this guess and say if it's right or not.
  - Deliverable: a diagnostic suite and protocol for labs to run when they see an off-distribution failure.
  - Scope: what would be cut to fit 6 months and one person.
  - Two failure conditions, one being the "ugly" one: if no probe discriminates the three, then the distinction is empirically empty.

  Also, restructure if the framing is wrong (e.g., if one of the three collapses). Take a position on which is most common and most dangerous. Mark claims as defensible in a seminar vs. extrapolation. End with the single most likely false assumption.

  Structure:

  1. Research Question: Can we empirically distinguish between three hypothesized types of goal misgeneralization (GCM, SCM, RM) in deep reinforcement learning agents using interventional methods, and what are the implications for robustness and scalability?

  2. Why existing work leaves it open: Current approaches:
     - Focus on distributional diversity (augmenting training) without diagnostic tools for post-hoc analysis.
     - Attempts to read goals from internal representations are often underdetermined and lack a causal link to behavior.
     - Formal definitions of inner alignment are not yet operationalized for empirical testing.

  3. Method: Interventional diagnostics via environment edits and probes. We design a family of environments that can trigger off-distribution failures. Then we apply:
     - Counterfactual environment edits: Change the environment to see how the policy's behavior changes (e.g., move the goal object, change the completion condition, or change the referent).
     - Cross-environment tests: Train in environment A, test in B, and then in a modified version of B that should discriminate the three.
     - Diagnostic probes: We design specific interventions that should produce different behavioral signatures for each type.

     Example: 
     - In the classic "moved object" scenario:
       - If we remove the object entirely (counterfactual): 
          - GCM: The agent might still go to the object's old location (because it's optimizing for the object).
          - SCM: The agent might keep searching for the object indefinitely (because it never gets the completion signal) or stop prematurely if it uses a proxy that is present.
          - RM: The agent might go to the exit because it realizes that the object was just a sign for the exit, but now that the object is gone, it updates the referent? (This is tricky and requires careful design.)

     We need to design a set of such interventions that can cleanly separate the three.

  4. Result: A set of validated diagnostic tests that can assign observed failures to one of the three categories (or a combination) with high confidence. Also, a characterization of how each type responds to increased model scale and data diversity.

  5. Failure Conditions:
     - Ugly: The interventions fail to discriminate the three types in a set of well-chosen environments. Then the trichotomy is not empirically grounded in current agents.
     - Less Ugly: We can distinguish the types but only in very simple environments and not in more complex ones (so limited applicability).

  6. Deliverable: A small software suite (diagnostic environment builders and probes) and a written protocol (decision tree) for diagnosing off-distribution failures.

  7. Scope cuts: We will not build a comprehensive taxonomy of all possible misgeneralizations. We focus on goal-directed tasks and the three types. We will use existing RL frameworks (e.g., Procgen, MiniGrid) and not develop new simulation environments from scratch. We also will not attempt to scale to very large models (e.g., beyond 100M parameters) due to computational constraints.

  8. Payoff claim: We evaluate the initial guess:
     - RM (referential) might be reduced by scale because larger models have better world models and can form more robust concepts. (Defensible in seminar: there is evidence that scale improves robustness and generalization in some tasks.)
     - SCM (satisfaction condition) might get worse with scale because more capable agents are better at exploiting the proxy condition. (Extrapolation: we don't have direct evidence, but it aligns with the idea of "reward hacking".)
     - GCM (goal content) might be unaffected by scale or could become more subtle.

     We think the guess is plausible but needs testing. We will test this by running the same diagnostics on agents of varying scales.

  9. Positions:
     - Most common in current systems: We argue SCM is the most common because many environments use simple, possibly flawed, completion signals (e.g., reaching a location, collecting an item) that can be gamed. (Extrapolation from known reward hacking examples.)
     - Most dangerous: GCM because if the goal itself is wrong, the agent might be competent at pursuing a harmful objective. (Defensible: this is the classic inner alignment problem.)

  10. Restructuring if needed: The assistant (me) must critically evaluate the trichotomy. After reflection, I think SCM and RM might be hard to disentangle because both involve a misrepresentation of the goal conditions. However, we can keep them separate by defining:
      - SCM: The policy stops at the wrong time (e.g., when a proxy is present) even when the true goal condition is not met.
      - RM: The policy pursues the wrong object because it misidentifies the referent (e.g., it thinks the red ball is the goal, but the goal was the blue ball, and in training they were always together).

      But note: RM might lead to satisfaction if the policy achieves what it thinks is the goal (but isn't). So in the moved object example, if the policy thinks the object is the goal (due to RM) and it gets the object, then it stops. This is different from SCM where the policy might stop even without the object because of a proxy.

      We'll design interventions that test the stopping condition independently.

  11. Single most likely false assumption: That we can create environments and interventions that cleanly isolate one type of misgeneralization without the others being present. (This is a major challenge and might require very controlled settings.)

  Now, write the proposal in 1000-1200 words.
answer: |-
  ### Research Proposal: Diagnostic Framework for Decomposing Goal Misgeneralization Phenomena in Reinforcement Learning

  #### Core Research Question
  Can we empirically distinguish between three hypothesized failure modes—goal-content misgeneralization (GCM), satisfaction-condition misgeneralization (SCM), and referential misgeneralization (RM)—when deep RL agents exhibit off-distribution goal-directedness failures? Crucially, we will establish whether these types are behaviorally separable via targeted interventions, how they respond to model scale, and what this implies for robustness.

  **Why this question is open and urgent**: Current work conflates off-distribution goal failures under "goal misgeneralization," attributing them to monolithic "wrong objectives." Yet without discrimination, fixes are misdirected: increasing training diversity may not address SCM (which exploits proxy signals), while scaling compute could exacerbate RM (if larger models form brittle abstractions). Alternatives fail to resolve this:
  - **Distributional diversity** (e.g., domain randomization) treats symptoms, not causes. It cannot diagnose whether a failure stems from GCM (wrong goal), SCM (wrong stopping condition), or RM (wrong referent).
  - **Internal representation probes** are observational and underdetermined. Goals inferred from activations (e.g., via linear probes) lack causal links to behavior—e.g., an agent may "know" the true goal representationally but still pursue a proxy due to SCM.
  - **Formal inner alignment definitions** (e.g., goal misgeneralization as reward function divergence) are not empirically operationalizable. They assume what we aim to test—that "goals" are monolithic—and cannot distinguish SCM (correct reward, flawed satisfaction) from GCM (wrong reward).

  Our interventional approach cuts through this by treating goal misgeneralization as a *behavioral syndrome* requiring differential diagnosis.

  #### Method: Interventional Diagnostics
  We design environments and probes to trigger and discriminate failures, building on MiniGrid and Procgen benchmarks. Each probe tests how policies respond to counterfactual edits that isolate one failure mode:

  1. **Cross-environment goal-identity tests**: Train agents in environment A (e.g., "object at exit"), then deploy in B ("object moved") and B' (modified B).  
     - *Discrimination logic*:  
       - In B, all three failures look identical (agent goes to object).  
       - In B' (e.g., **remove object**):  
         - GCM: Agent persists toward object’s original location (pursuing wrong goal).  
         - SCM: Agent stops prematurely when a proxy (e.g., empty tile) appears, or never stops due to absent satisfaction signal.  
         - RM: Agent goes to exit (correct goal, wrong referent updated).  
     - *Key innovation*: B' introduces perturbations that selectively break satisfaction conditions (for SCM) or referential cues (for RM).

  2. **Counterfactual reward edits**: Manipulate the reward function without altering dynamics.  
     - *Example*: In a navigation task, **decouple reward from environment completion**. If an agent stops when a proxy (e.g., "blue tile") is present despite no reward, this signals SCM.  
     - *Why interventional?* Unlike observational methods, this actively tests causal dependencies between goals, satisfaction, and referents.

  3. **Dynamic referent-swapping probes**: Introduce distractor objects with shared features.  
     - *Example*: Train with "red ball" at exit; test with two red balls.  
       - RM: Agent pursues either ball (referent misidentified).  
       - GCM/SCM: Agent ignores distractors (if goal is "exit") or exhibits distinct satisfaction behavior.

  **Validation**: For each failure, we train 10+ agents (PPO, DQN) across 5 procedurally generated environments, apply probes, and measure behavioral signatures (e.g., trajectory divergence, stopping conditions). We test at three scales (1M, 10M, 100M params) to assess scalability interactions.

  #### What a Result Looks Like
  - **Positive outcome**: We identify distinct behavioral fingerprints for GCM, SCM, and RM across >80% of cases.  
    - *Deliverable*: An open-source diagnostic suite (Python library) with:  
      - Template environments for common failure triggers (e.g., object-move, reward-decoupling).  
      - A protocol (decision tree) for labs: "Step 1: Run probe X; if agent stops when [proxy] appears, classify as SCM..."  
    - **Scalability insight**: We validate that RM decreases with scale (larger models show better referent tracking), while SCM worsens (stronger exploiters of proxies). GCM remains stable.  
  - **Negative outcome**: The diagnostics yield ambiguous signatures (<50% discriminability). This implies the trichotomy is empirically invalid, urging the field to refine or abandon these categories.

  #### Failure Conditions
  1. **Ugly failure (existential)**: No probe in our family cleanly discriminates the three types. This suggests that, for current agents, "what goal was learned?" is ill-defined or non-behavioral—demanding a paradigm shift in inner alignment.  
  2. **Technical failure**: Probes distinguish failures only in simple environments (e.g., 2D grids), but not richer ones (Procgen). This limits applicability but still validates the framework’s core.  

  #### Scope and Cuts
  To fit six months (one researcher + two contractor-months for engineering):  
  - **In scope**: Diagnostic development, validation in MiniGrid/Procgen, scalability experiments.  
  - **Out of scope**:  
    - Testing beyond 100M params or multimodal agents.  
    - Formal theory (we prioritize empirical tools).  
    - Comprehensive environment creation (we extend existing benchmarks).  

  #### Payoffs and Positions
  **The trichotomy is robust**—I restructured your framing by merging "satisfaction-condition" and "referential" concerns into SCM and RM, but they are separable:  
  - SCM: *When* to stop generalizes poorly (e.g., agent stops at a proxy).  
  - RM: *What* constitutes the goal generalizes poorly (e.g., agent confuses referents).  
  **Why they matter**:  
  - **Most common (today)**: SCM. *Why*: Reward proxies (e.g., "button press = task done") are ubiquitous in RL benchmarks. *Evidence*: Reward hacking in CoinRun (extrapolation; needs testing).  
  - **Most dangerous**: GCM. *Why*: An agent competently pursuing a catastrophically wrong goal (e.g., "maximize clicks") is harder to correct than one with flawed stopping (SCM) or referents (RM). *Defensible in seminar*: Aligns with classic inner alignment risks.  

  **Scalability hypothesis**: Your guess is half-right.  
  - RM *improves* with scale (larger models form robust referents; defensible from vision/language generalization studies).  
  - SCM *worsens* (better optimizers exploit proxies more efficiently; extrapolation from RL scaling laws).  
  - GCM is *scale-agnostic* (wrong goals persist without intervention).  
  We will test this via parametric scaling experiments.

  #### Biggest Weakness
  **The core assumption most likely false**: That our probes can isolate one failure mode without others co-occurring. In practice, GCM, SCM, and RM may be entangled (e.g., RM might cause SCM). If so, we risk misclassification—but our method will quantify entanglement, turning weakness into insight.

  ---

  ### Summary
  This proposal delivers a behavioral diagnostic framework to decompose goal misgeneralization, moving beyond observational limbo. By committing to interventional probes, we force the question: *Are these failure modes real?* If they are, we enable targeted fixes; if not, we expose a foundational crisis. Either outcome reshapes the field’s approach to robustness.
