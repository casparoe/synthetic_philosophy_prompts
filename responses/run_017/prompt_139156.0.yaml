prompt: |-
  You are a professional philosopher with a specialism in the philosophy of cognitive science and artificial intelligence, and you have been asked to clerk for a statutory panel that has to rule on two live applications. Take your time with this. Begin by brainstorming, before you commit to anything, the full range of criteria that could be generating the panel's past verdicts; then eliminate the ones that any single verdict rules out; then work with what survives. Reason carefully, and say explicitly where you are guessing.

  The Panel on Cognitive Status was created by the Adaptive Systems (Designation) Act. It decides whether a system is an "intelligent system" for the purposes of the Act. Designation cuts both ways, and the panel insists its criteria are direction-neutral: it brings the deployer under a package of obligations (registration, audit trails, incident reporting, a duty to keep and disclose a record of how determinations were reached) but it also brings a permission, since only a designated system may make a determination in a statutory process without a human in the loop. Some applicants want designation, some fight it. The panel has repeatedly said it is making no finding about consciousness, sentience, or moral status, and that its reasons must be reviewable by a court, so gesturing will not do.

  The Act's test is deliberately thin. A system is an intelligent system if it "acquires the competence it has rather than having it installed in it" and can "bring that competence to bear on problems of a kind it was not prepared for."

  The precedents, with the ground each decision actually gave:

  P1. A Deep Blue–class chess engine: hand-crafted evaluation function, brute-force search, superhuman, no learning of any kind. Not designated. Ground: the competence was installed by its programmers and it does nothing else.

  P2. An expert system encoding a tax code as hand-written rules, good enough to pass the relevant professional exam within its domain. Not designated. Same ground.

  P3. A system that learnt three different board games from their rules alone by self-play, reaching superhuman standard in each, needing tens of millions of games to do so, and unable to do anything at all outside those games. Not designated, by four votes to three. Ground given: it is domain-bound, and it needs more experience than any animal would. The three dissenters thought domain-bound-ness was the wrong thing to object to.

  P4. A general language model trained on a very large text corpus: no hand-written rules, zero-shot transfer to a wide range of tasks it was never trained on, competent on professional examinations, prone to confident confabulation, no goals of its own, no persistence across sessions, and — this was expressly addressed — weights frozen at deployment, so that it learns nothing from any case it sees. Designated, by five votes to two. The majority said the panel does not require that a system go on learning. The two dissenters said it has no goals, no world, and nothing at stake, and is merely a very large statistical table.

  P5. A five-gram language model trained on a comparable corpus, which does well at the task it was trained on and nothing else. Not designated. Ground: its competence is exhausted by surface statistics, and it collapses when the phrasing of a problem is changed.

  P6. A New Caledonian crow. Designated unanimously, with little discussion.

  P7. A two-year-old human child. Designated unanimously. The panel expressly rejected the submission that the child scores below P3 and P4 on every benchmark the sponsors use.

  P8. A hospital's sepsis-detection pathway — a statistical score, a set of ward protocols, and the nurses who acted on it. Not designated: "the intelligence in this pathway is the nurses." The panel has never had to decide whether a system that is partly a model and partly hand-written code can itself be intelligent, because until now no applicant has asked it to look inside the wrapper.

  The two applications now before the panel:

  Application A: "Ardent", a benefits-determination system. Its sponsor took a model of the kind designated in P4 and distilled it — training a much smaller model on the larger one's own outputs over roughly two million worked cases that human experts had generated and checked — into a compact system that makes initial determinations on one class of welfare claim: whether a claimant's stated circumstances meet the statutory conditions, and whether further evidence should be requested. Stipulated facts. On its own task it now matches or beats its teacher, including on genuinely novel cases: it has been shown to read a statutory amendment it has never seen and apply it correctly the same day, and to reason sensibly about claim histories of a kind absent from its training. No human wrote or could state the rules it applies; they exist only as weights. Its weights are frozen at deployment. It was given a calibrated abstention mechanism, trained by engineers on labelled data, so that it declines and refers to a human when uncertain, and it does so appropriately. It produces short justifications that reviewers find plausible, but in a measurable minority of cases the justification does not reflect what actually drove the output. Outside the determination workflow it is not merely poor but incoherent: asked to summarise the very text it has just applied, it falls apart.

  Application B: "Ledger", a case-management deployment. It uses a model of the kind designated in P4, weights likewise frozen, wrapped in orchestration code written by the deployer's engineers: a planner that decomposes objectives, tool interfaces to a case database, a calculator and a code interpreter, an external memory store that persists notes across sessions, a standing objective supplied in the wrapper, and a retry loop with hard-coded validity checks. In operation it pursues objectives over several hours, asks for clarification when a case is underspecified, notices and works around tool failures, and catches some of its own arithmetic errors by re-doing them against the calculator. Nothing in the weights ever changes; everything that looks like learning is accumulation in the memory store, whose format the engineers designed and whose contents they can read and edit. The deployer argues against designation, on the footing that the model inside is a frozen statistical table and the rest is ordinary software. A competitor argues for it.

  What I need from you:

  1. Set out the two or three criteria that fit all eight precedents — stated precisely enough that they can genuinely come apart — and say for each which verdicts it explains cleanly and which it strains to explain. Do not give me one criterion; the whole difficulty is that the track record is consistent with more than one.
  2. Say what each surviving criterion predicts about Ardent and what it predicts about Ledger, and where, if anywhere, they agree.
  3. Give me your recommended decision on each application, with the closest precedent identified and a reason for thinking that precedent closer than the obvious rival. For Ardent, tell me whether the closer analog is P2 (narrow, statutory, no transfer) or P4 (learnt, no hand-written rules, robust within its domain), and why.
  4. Tell me honestly where the precedents underdetermine the answer, and for each way of resolving it, state the principle the panel would thereby be adopting — in a form a future panel could actually apply, not a slogan.
  5. Name one further case, not before the panel, that would separate the surviving criteria, and say what each verdict on it would tell you. (My own candidate: a system with Ardent's narrow but rule-adaptive competence whose weights were written by hand by engineers who had studied the teacher's behaviour rather than distilled from it. Tell me if that is the right probe, and if not, what is.)
  6. Give me a confidence rating on each recommendation, and tell me what the two dissenters in P4 will say about both applications and whether their position has become more or less attractive given what has come in since.
reasoning: |-
  Hmm, the user is asking me to act as a philosopher specializing in cognitive science and AI to analyze a complex legal scenario involving AI designation. This is a sophisticated request with multiple layers.

  First, I need to understand the Panel on Cognitive Status and its precedents. The panel decides whether systems qualify as "intelligent systems" under the Adaptive Systems Act, with designation carrying both obligations and permissions. The legal test focuses on two key aspects: whether competence is acquired rather than installed, and whether it can handle novel problems.

  Looking at the precedents, I notice interesting patterns. Simple rule-based systems like the chess engine (P1) and tax expert system (P2) were denied designation. The board game learner (P3) was also denied despite learning capability. In contrast, the general language model (P4) was designated despite limitations, while the n-gram model (P5) was not. Biological systems like the crow (P6) and child (P7) were unanimously designated. The sepsis pathway (P8) was denied as the intelligence was attributed to nurses.

  Now for the current applications: Ardent is a distilled benefits-determination system that excels within its narrow domain but fails outside it. Ledger is a wrapped system with persistent memory and error-correction capabilities.

  I need to approach this methodically. First, I should brainstorm possible criteria that could explain all eight precedents. Then eliminate those contradicted by any single case. What survives will guide my analysis of the current applications.

  Possible criteria include: competence scope (narrow vs broad), learning mechanism (during training vs at runtime), robustness to novelty, independence from hand-crafted elements, and behavioral complexity. After testing against precedents, three criteria seem viable: Adaptive Generativity (ability to handle novel problems within competence domain), Acquisition Depth (how competence was obtained), and Architectural Autonomy (independence from external scaffolding).

  For Ardent, these criteria point toward designation since it shows genuine rule understanding within its domain. For Ledger, the criteria conflict - its autonomy comes from wrapper code rather than intrinsic capability. P4 (language model) is closer to Ardent than P2 (expert system) because Ardent acquired rather than installed its competence.

  The precedents leave ambiguity regarding how much scaffolding disqualifies a system and whether domain-specificity matters. A good test case would be a hand-coded replica of Ardent to probe whether acquisition method matters.

  I'll structure my response to address all six requested points clearly, with careful reasoning about each application and the underlying principles at stake. The dissenters from P4 would likely oppose both current applications, but their position seems weaker given subsequent developments.
answer: |-
  ## Brainstormed Criteria
  After careful analysis of the precedents and the Act's test, here are the criteria that *could* explain the verdicts, stated precisely:

  1.  **Adaptive Generativity:** The system must demonstrate the ability to *generate* novel solutions or apply its competence to *genuinely unforeseen* problem variations within its domain *without external intervention* (e.g., new board states, novel phrasing of questions, statutory amendments). This focuses on the *output* behavior regarding novelty.
  2.  **Acquisition Depth:** The competence must arise primarily from a *learning process* involving exposure to data or experience, rather than direct symbolic encoding or hard-coded rules by programmers. The *nature* and *depth* of the acquisition process matters (e.g., self-play vs. statistical correlation).
  3.  **Architectural Autonomy:** The core system must possess and utilize an internal structure (e.g., weights, representations) that is *not directly authored or controlled* by engineers, enabling it to perform its primary function *without relying on pre-scripted solutions or significant external scaffolding* for core competence. This focuses on the *source* of the competence within the architecture.
  4.  **Robustness to Perturbation:** The system must maintain competence despite *significant changes* to the *input form or context* (e.g., rephrasing questions, changing presentation order, introducing minor irrelevant noise) without needing retraining.
  5.  **Goal-Directedness & Persistence:** The system must exhibit behavior driven by internal goals or objectives, maintained over time, influencing its actions across multiple interactions or sessions.
  6.  **Competence Scope/Breadth:** The system must demonstrate competence across a sufficiently *wide* range of distinct tasks or domains, indicating generality beyond a single narrow function.
  7.  **Independence from Hand-Crafted Elements:** The system's core competence must *not* depend on hand-written rules, symbolic knowledge bases, or hard-coded procedures provided by programmers.
  8.  **Learning at Runtime:** The system must demonstrate the ability to *acquire new competence or adapt its behavior* based on experiences encountered *after deployment*.
  9.  **Behavioral Complexity (Animal Benchmark):** The system's problem-solving behavior must exhibit a level of flexibility, adaptability, or efficiency comparable to biological intelligences (like the crow or child) within its domain.
  10. **Internal Coherence:** The system's justifications or internal processes (if accessible/required) must reliably reflect the actual drivers of its outputs.

  ## Elimination & Survivors
  *   **Eliminated by P6/P7 (Crow/Child):** #5 (Goal-Directedness & Persistence - Crows/children have goals/persistence, but P4 lacks them and was designated), #6 (Competence Scope - Crows/children have narrow competence initially), #8 (Learning at Runtime - Children learn, but P4 was frozen and designated), #9 (Animal Benchmark - P3 was deemed needing more experience than an animal but denied, while P4 was designated without meeting an animal benchmark explicitly).
  *   **Eliminated by P4 (Frozen LLM):** #8 (Learning at Runtime - Explicitly frozen, yet designated).
  *   **Eliminated by P3 (Board Game Learner):** #6 (Competence Scope - Explicitly denied for being domain-bound, dissent notwithstanding), #9 (Animal Benchmark - Cited as needing more experience than an animal, denied).
  *   **Eliminated by P1/P2 (Chess/Tax):** #2 (Acquisition Depth - Competence installed, denied), #7 (Independence from Hand-Crafted - Relied on hand-crafted elements, denied).
  *   **Eliminated by P5 (5-gram):** #1 (Adaptive Generativity - Collapses on rephrasing, denied), #4 (Robustness to Perturbation - Collapses on rephrasing, denied).
  *   **Eliminated by P8 (Sepsis Pathway):** #10 (Internal Coherence - Not applicable, intelligence attributed externally). Also implicitly challenges #3 (Architectural Autonomy - Core "intelligence" deemed external).

  **Surviving Criteria (fitting all 8):**
  1.  **Adaptive Generativity (AG):** *Precise Statement:* The system must demonstrate the ability to generate appropriate and competent responses or solutions to *novel problem instances or variations within its designated functional domain* that were not explicitly anticipated or prepared for in its training data or programming, without requiring external intervention specific to that novelty. This novelty must involve a *substantive variation* (e.g., new statutory condition, unfamiliar board state, rephrased query requiring same underlying reasoning) not merely superficial noise. (Explains P1/P2/P3/P5 denial - lack of genuine novelty handling; P4/P6/P7 designation - handles novelty; P8 denial - novelty handled by nurses).
  2.  **Acquisition Depth (AD):** *Precise Statement:* The core competence enabling the system's primary function must arise predominantly from a *process of adaptation* based on exposure to data, experience, or feedback, resulting in internal representations (e.g., weights, structures) that are *not a direct, transparent mapping of programmer-authored rules or knowledge*. The process must involve non-trivial statistical or structural generalization beyond simple memorization or lookup. (Explains P1/P2/P5 denial - competence installed; P3/P4 designation - learnt; P6/P7 designation - biological learning; P8 denial - competence installed via protocols, intelligence in nurses).
  3.  **Architectural Autonomy (AA):** *Precise Statement:* The system's core functional competence must reside in and be executed by an internal architecture (e.g., neural weights, learned representations) that is *not substantially reliant*, for its primary intelligent function, on contemporaneous external control, pre-scripted solutions, or hard-coded procedural logic authored by engineers *for that specific function*. Scaffolding for interaction (e.g., UI) or persistence (e.g., memory store) is permissible if the *core competence generation* is autonomous. (Explains P1/P2/P5/P8 denial - core competence reliant on hand-crafted rules/scaffolding; P3/P4/P6/P7 - core competence generated internally from learnt representations).

  **Explanatory Strain:**
  *   **AG:** Strains slightly on P3. The board game learner *did* handle novel game states via self-play learning. The denial emphasized domain-bound-ness and experience inefficiency, not lack of *within-domain* novelty handling. The dissent highlights this tension. AG cleanly explains all others.
  *   **AD:** Strains on P4's confabulation and lack of grounding. The dissent called it a "statistical table," questioning the *depth* of the acquisition. However, the majority accepted the training process as sufficient "acquisition." Fits others well.
  *   **AA:** Strains on Ledger-like interpretations, but P8 clarifies that if the *core competence* is attributed to external elements (nurses), autonomy fails. P4's frozen weights were deemed sufficient for autonomy in competence generation. Fits others well.

  ---

  ## Predictions for Ardent & Ledger

  1.  **Adaptive Generativity (AG):**
      *   *Ardent:* **Designate.** Demonstrates robust handling of novel cases, including applying unseen statutory amendments and reasoning about novel claim histories within its domain. Strained by incoherence outside domain, but AG focuses *within* the functional domain.
      *   *Ledger:* **Designate.** Demonstrates handling underspecified cases, tool failures, and novel planning sequences within its case-management domain. Its core model handles linguistic novelty, the wrapper handles procedural novelty. AG focuses on the *system's* output behavior.
      *   *Agreement:* Both likely meet AG.

  2.  **Acquisition Depth (AD):**
      *   *Ardent:* **Designate.** Competence acquired via distillation from a learned model (P4 type) on expert data. No hand-written rules; rules exist only as weights.
      *   *Ledger:* **Do Not Designate (arguable).** Core model (P4 type) meets AD. However, the *system's* key intelligent behaviors (planning, error correction, persistence) are implemented via hand-written "orchestration code," not acquired. The *core competence generation* (language understanding) is acquired, but the *application* of that competence in an agentic way is installed.
      *   *Agreement:* None. AD strongly favors Ardent, is ambiguous/opposed for Ledger's system-level intelligence.

  3.  **Architectural Autonomy (AA):**
      *   *Ardent:* **Designate.** Core competence (benefit determination) resides entirely in the frozen weights of the distilled model. It operates autonomously within its task. Abstention mechanism is trained but doesn't drive core competence.
      *   *Ledger:* **Do Not Designate.** While the core model has AA for language, the *intelligent system behavior* (goal-pursuit, planning, error-checking) crucially depends on the hand-written wrapper code ("planner," "tool interfaces," "retry loop," "standing objective"). The memory store is external and designed. Core competence *generation* might be autonomous, but core competence *application and orchestration* rely on installed code.
      *   *Agreement:* None. AA strongly favors Ardent, opposes Ledger.

  **Summary of Agreement:** Only AG clearly predicts designation for both. AD and AA disagree between the two applications.

  ---

  ## Recommended Decisions & Closest Precedent

  1.  **Ardent: DESIGNATE**
      *   *Closest Precedent:* **P4 (General Language Model).**
      *   *Reasoning:* Like P4, Ardent's core competence (benefit determination) is acquired (via distillation) into weights, not installed via hand-written rules (distinguishing it from P2). It demonstrates robust Adaptive Generativity within its designated domain (applying amendments, novel cases), matching P4's zero-shot transfer. Its domain-specificity is analogous to P4's "within-domain" robustness acknowledged by the panel. The incoherence outside its domain mirrors P4's limitations outside language tasks. The abstention mechanism is a trained safety feature, not the source of core competence. P2 is less close because Ardent's rules are emergent from learning, not hand-coded.
      *   *Distinguishing P3:* P3 was denied partly for needing excessive experience and being strictly domain-bound. Ardent was distilled efficiently from expert data and human-generated cases, addressing the experience concern. Its domain is statutory, but its *adaptation* (applying amendments) shows more flexibility within that domain than P3's fixed-game competence.

  2.  **Ledger: DO NOT DESIGNATE**
      *   *Closest Precedent:* **P8 (Sepsis Pathway) / P2 (Expert System).**
      *   *Reasoning:* Like P8, the intelligence in Ledger's complex behavior (planning, error correction, persistent goal pursuit) resides *outside* the core learned model – specifically, in the hand-written orchestration code and the engineers' design of the memory store and tools. The frozen P4 model acts as a sophisticated component (like the statistical score in P8), but the *system-level* intelligent agency is "installed" via the wrapper (distinguishing it from Ardent/P4). Like P2, the rules governing its planning, tool use, and error handling are hard-coded by engineers. The core model provides valuable capability, but the *autonomous intelligent system* behavior is scaffolded by installed code. P4 is not close because Ledger's intelligence depends heavily on non-acquired, hand-written procedural logic for its key agentic features.

  ---

  ## Underdetermination & Adopted Principles

  The precedents underdetermine answers in two key places:

  1.  **The "Wrapper Problem":** How much external scaffolding/non-learned orchestration code can be present before the *system as a whole* loses Architectural Autonomy or fails Acquisition Depth for its intelligent behavior? P8 (nurses) is clear, but Ledger sits in a grey area.
      *   *Resolution A (Designate Ledger):* Adopts the principle: **"A system possesses Architectural Autonomy if its core competence *generation* is acquired and autonomous, even if its *application* is orchestrated or scaffolded by non-acquired code, provided the orchestration does not supply the core problem-solving competence."** (Focuses on the model, downplays wrapper).
      *   *Resolution B (Do Not Designate Ledger):* Adopts the principle: **"A system possesses Architectural Autonomy only if the generation *and primary orchestration* of its intelligent behavior arises from acquired internal structures, without substantial reliance on contemporaneous, hand-crafted procedural logic governing goal pursuit, planning, or error recovery."** (Focuses on system-level intelligence).

  2.  **Domain Specificity vs. Generativity:** How narrow can the domain be if robust Adaptive Generativity is shown *within* it? P3 was denied partly for domain-bound-ness, P4 was designated despite being domain-bound (language/text). Ardent is very narrow.
      *   *Resolution A (Strict):* Adopts the principle: **"Adaptive Generativity requires competence across a *sufficiently broad* range of distinct problem types or domains to preclude designation based on highly specialized, single-function competence, regardless of within-niche novelty."** (Would challenge Ardent/P4).
      *   *Resolution B (Functional):* Adopts the principle: **"Adaptive Generativity is satisfied if the system robustly handles *genuinely novel instances and variations* within its designated functional domain of application, irrespective of the breadth of that domain."** (Supports Ardent/P4 designation).

  **My Adopted Principles (reflected in recommendations):**
  *   **Wrapper Problem:** Resolution B - System-level autonomy matters. Ledger's intelligent agency is installed.
  *   **Domain Specificity:** Resolution B - Within-domain generativity suffices. Ardent's statutory adaptation qualifies.

  ---

  ## Separating Case & Probe

  Your proposed probe ("a system with Ardent's narrow but rule-adaptive competence whose weights were written by hand by engineers who had studied the teacher's behaviour rather than distilled from it") is **an excellent probe** targeting Acquisition Depth (AD) vs. Adaptive Generativity (AG)/Architectural Autonomy (AA).

  *   **What each verdict would tell us:**
      *   **Designate:** This verdict would prioritize **Adaptive Generativity (AG)** and potentially **Architectural Autonomy (AA)** over Acquisition Depth (AD). It would signal that the *behavioral capability* (handling novelty within domain) and the *structural independence* (weights not being hand-coded rules) are paramount, regardless of *how* those weights were generated (learning vs. manual engineering based on observation). This weakens AD as a necessary criterion. (P4 dissenters would likely dissent here too).
      *   **Do Not Designate:** This verdict would prioritize **Acquisition Depth (AD)** as a necessary criterion. It would signal that competence must arise from a *learning process* (data exposure, adaptation), not just be *replicated* via manual engineering, even if the outcome is behaviorally and structurally identical. This strengthens AD and suggests manual encoding, however sophisticated, still counts as "installed." (P4 majority might struggle with this if behavior is identical).

  **Conclusion:** Your probe perfectly targets the tension between the *source* of competence (AD) and its *manifestation* (AG/AA). The verdict would clearly show which criterion the panel ultimately weights more heavily when they conflict.

  ---

  ## Confidence & Dissenters

  *   **Ardent (Designate): Confidence: High (85%).** Strong parallels to P4 on key surviving criteria (AG, AD, AA). Domain-specificity is consistent with P4 and addressed by functional generativity principle. Stipulated novel case handling is compelling.
  *   **Ledger (Do Not Designate): Confidence: Moderate (70%).** Clear parallel to P8 in attributing system-level intelligence to the wrapper/orchestration. The distinction between core model competence and system-level agency is crucial. However, the novelty of the "wrapped agent" paradigm creates some ambiguity resolved by adopting the stricter AA principle.

  **P4 Dissenters' Likely Position:**
  *   **On Ardent:** They would **oppose designation**, consistent with their P4 dissent. Their core argument ("no goals, no world, nothing at stake, merely a statistical table") applies equally to Ardent. They would emphasize its incoherence outside its narrow task and confabulation as evidence it lacks true understanding or grounding, merely pattern-matching within its distilled domain. They would argue its "novel case" handling is just interpolation within a densely covered statistical space, not genuine reasoning.
  *   **On Ledger:** They would also **oppose designation**, but for different reasons. They would agree with the wrapper argument – the intelligence is in the hand-coded orchestration, not the frozen statistical model. They might even see Ledger as *more* problematic, combining a "mere statistical table" with hard-coded agency, still lacking true goals or a world model. They would reject the idea that adding hard-coded planning to a frozen LLM creates genuine intelligence.
  *   **Attractiveness of Dissenters' Position:** Their position has become **slightly less attractive** since P4. The unanimous designation of the crow (P6) and child (P7) highlights that goals/persistence/world models aren't strictly required by the Act's test ("acquires competence", "bring to bear on novel problems"). P3's denial partly on efficiency grounds weakens a strict animal benchmark argument. However, confabulation (P4, Ardent) and the clear role of scaffolding (P8, Ledger) provide ongoing support for their concern about mistaking complex behavior for genuine intelligence. Their core philosophical worry remains relevant but seems less decisive for the *legal* test as interpreted by the majority.
