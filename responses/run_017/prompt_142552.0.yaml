prompt: |-
  I sit on the legal team of a truth commission for a country emerging from a decade of military rule, and we have to write the criteria under which someone who fully discloses their role in atrocities receives amnesty rather than prosecution. The familiar reference points pull in different directions: South African practice conditioned amnesty on full disclosure before a public body; Argentina moved from prosecuting the juntas to narrowing prosecution; Rwanda put confession and guilty plea to work in community proceedings that traded truth for sentence reduction. Before we draft, I want to know what I actually think, so I have been going by gut on cases, and my verdicts do not line up.

  My tentative principle is that amnesty is in order just when three conditions hold: the *counterfactual-discovery* condition — what the applicant discloses would probably not have come to light without the offer; the *unowned-agency* condition — the applicant acted within a structure of command whose direction they did not set; and the *no-settlement* condition — granting it does not require the commission to certify as settled a description of events that victims reasonably contest.

  My verdicts:

  1. A conscript who shot four prisoners on orders and now reveals burial sites that no one else knows: amnesty fine.
  2. The general who wrote the counter-insurgency doctrine under which those prisoners were shot, and who discloses more than anyone else possibly could: not fine, even though he is my best source and loses me the most truth.
  3. A clerk who typed the death lists for six years and hands over the complete set, which was hidden but which investigators would probably have recovered from the abandoned ministry within a year: fine, though shakier than (1).
  4. A banker who arranged the off-book financing that sustained the death squads and reveals the whole funding chain: I keep saying not fine and then wavering — he killed no one, and no one else can produce this.
  5. A perpetrator who discloses fully, but only after three others have already named him: not fine, even though the disclosure is complete and the information is the same as it would otherwise have been.
  6. A perpetrator whose disclosure adds nothing the commission does not already have from the regime's own archives, but who says it in public, in front of the families: not fine.
  7. A perpetrator who also adds nothing new, except that his account corrects the archive: the killing everyone attributes to a disbanded unit was ordered elsewhere, and a man posthumously blamed is exonerated: fine.
  8. A village that killed its neighbours together: two hundred people confessed, pleaded guilty, named who cut whom, and asked to go home. Full amnesty not fine; a large sentence reduction fine.
  9. A perpetrator who confesses to a killing the commission later establishes he did not commit, covering for a superior: not fine, obviously — but I cannot say which of my conditions it violates.

  Cases 6 and 7 look alike and I separate them; cases 2 and 4 look alike and I cannot settle 4. So: is there one principle that gets all nine, or nearly? Where it cannot, tell me which verdict to drop and why. State the principle precisely, say which case motivates each clause, and give its verdicts on two cases I have not listed — someone abducted at fourteen who was victim and then perpetrator, and someone who disclosed everything under the outgoing regime's self-amnesty, which we have since declared void.

  Please answer in British English.
reasoning: |-
  Hmm, the user is part of a legal team for a truth commission in a country transitioning from military rule. They're grappling with how to grant amnesty for atrocities through disclosure, using gut instincts on cases that don't align consistently. They've proposed a principle with three conditions: counterfactual-discovery (disclosure reveals otherwise unknown info), unowned-agency (acted under command without setting direction), and no-settlement (amnesty doesn't force victims to accept contested facts). But their verdicts on nine cases show contradictions, like approving a conscript but denying a general, and they're unsure about cases 4 and 6 versus 7.

  The user wants a unified principle that covers all cases, or guidance on which verdict to drop. They also ask for analysis of two new cases: a child soldier and someone who disclosed under a void self-amnesty. I need to respond in British English and ensure my answer addresses their need for coherence in this high-stakes moral and legal dilemma.

  First, I should assess their proposed conditions. The counterfactual-discovery condition makes sense because truth commissions aim to uncover hidden truths, as seen in cases 1 and 3 where disclosure provides unique or hard-to-find information. But it fails in case 6, where the perpetrator adds nothing new yet the user denies amnesty, showing that public acknowledgment matters beyond just facts.

  The unowned-agency condition explains why the conscript in case 1 gets amnesty but the general in case 2 doesn't—he set the doctrine. However, it struggles with case 4, the banker, who didn't kill anyone but enabled atrocities, and the user wavers because the agency isn't direct. This suggests the condition might need refinement to account for indirect complicity.

  The no-settlement condition addresses victims' dignity by avoiding forced acceptance of facts, which justifies denying amnesty in case 5 where disclosure is redundant or case 9 where it's false. But it doesn't clearly handle case 7, where correcting the record exonerates someone, so the user approves it as fine.

  Looking at the discrepancies: Cases 6 and 7 both involve no new facts, but the user separates them because case 7 corrects the archive, aiding justice, while case 6 is performative without substance. Cases 2 and 4 are similar as enablers, but the user is torn on the banker—perhaps because financing is indirect, whereas doctrine is ideological leadership.

  To build a unified principle, I need to prioritize truth and justice. The core of amnesty should be contingent on providing essential truth that aids reconciliation and doesn't undermine accountability for architects. I'll refine the conditions: keep counterfactual-discovery but broaden it to include unique contributions like corrections; modify unowned-agency to focus on not being a prime mover; retain no-settlement strictly.

  For the new cases: The child soldier abducted at 14 is both victim and perpetrator. Under my principle, they'd likely get amnesty because they were coerced, and their testimony could reveal systemic abuses—satisfying counterfactual-discovery and unowned-agency easily. The person who disclosed under a void self-amnesty shouldn't get amnesty because the disclosure wasn't voluntary or under legitimate terms, violating the spirit of the process.

  I'll structure my response by stating the revised principle clearly, explaining each clause with motivating cases, applying it to all nine verdicts to resolve inconsistencies, and then addressing the new cases. The goal is to help the user achieve consistency while upholding the commission's integrity.
answer: |-
  Right, let's work through this systematically. Your gut verdicts reveal a coherent instinct that your initial conditions don't fully capture. The core principle emerging prioritises **truth essential for justice and reconciliation, obtained from actors whose culpability was primarily derivative, without undermining the factual record or victims' dignity.**

  Here's the refined principle, incorporating and modifying your conditions:

  **Amnesty is justified if and only if:**
  1.  **Essential Truth Condition:** The disclosure provides information *essential* to establishing the factual record concerning specific atrocities or systemic mechanisms, which was either:
      *   Unlikely to be discovered otherwise (*Counterfactual-Discovery*, as in Case 1, burial sites), *or*
      *   Necessary to correct a materially false official or widely accepted narrative (*Corrective Truth*, as in Case 7, exonerating the wrongly blamed).
  2.  **Derivative Agency Condition:** The applicant's role in the atrocities was primarily that of an implementer or enabler acting under established structures, doctrines, or orders. They were not a prime mover in designing, initiating, or fundamentally directing the *specific* policies or acts for which amnesty is sought (*Refined Unowned-Agency* – focusing on *not being a prime mover*).
  3.  **Integrity Condition:** Granting amnesty does not:
      *   Require the commission to certify as settled a description of events that victims reasonably contest (*No-Settlement*, as in Case 5, redundant confession).
      *   Reward or rely upon demonstrably false testimony (*Truthfulness*).
      *   Undermine the core purpose of establishing a credible, victim-centred historical record (*Historical Integrity*).

  **Motivation for Each Clause & Application to Your Cases:**

  1.  **Essential Truth Condition:**
      *   *Motivation:* Resolves the tension in Cases 6 & 7, and clarifies 3 & 4. Case 6 (public but no new info) adds nothing essential. Case 7 (correcting the record) provides essential truth by rectifying a material falsehood. Case 3 (clerk, docs recoverable) is borderline – if the lists were *likely* recoverable soon, the truth isn't *essential* from him specifically. Case 4 (banker) hinges on this: the funding chain *is* essential systemic truth otherwise unobtainable.
      *   *Case Verdicts:*
          *   **Case 1:** Fine (Unique burial sites - Counterfactual).
          *   **Case 2:** Not Fine (Prime mover, doctrine creator - violates Derivative Agency; info, while valuable, isn't *essential* solely from him if archives exist? But Derivative Agency is primary failure).
          *   **Case 3:** **Not Fine** (Shaky for good reason. If docs recoverable within a year, disclosure isn't *essential*. Shifts your verdict).
          *   **Case 4:** **Fine** (Whole funding chain, unobtainable elsewhere - Essential Truth (Counterfactual) trumps indirect agency here, as he was an enabler, not the *initiator* of the policy).
          *   **Case 5:** Not Fine (No Essential Truth - already known; violates Integrity via No-Settlement/redundancy).
          *   **Case 6:** Not Fine (No Essential Truth - nothing new).
          *   **Case 7:** Fine (Essential Truth - Corrective).
          *   **Case 8:** See below (Community aspect complicates).
          *   **Case 9:** Not Fine (Violates Integrity - Truthfulness).

  2.  **Derivative Agency Condition:**
      *   *Motivation:* Explains the core difference between Case 1 (conscript) and Case 2 (general). Captures why Case 4 (banker) is acceptable under Essential Truth despite enabling – he financed the structure, didn't *design* the killing policy itself. Clarifies Case 9 (false confession) – he's acting *for* a superior, but falsely, violating Integrity.
      *   *Case Verdicts:*
          *   **Case 1:** Fine (Classic implementer under orders).
          *   **Case 2:** Not Fine (Prime mover - designed doctrine).
          *   **Case 3:** Fine (Low-level implementer - Derivative Agency clear, but fails Essential Truth).
          *   **Case 4:** Fine (Enabler within system, not policy initiator - Derivative Agency satisfied).
          *   **Case 5:** Not Fine (Fails Essential Truth primarily, but agency varies).
          *   **Case 6:** Not Fine (Fails Essential Truth).
          *   **Case 7:** Fine (Agency varies, but Essential Truth satisfied).
          *   **Case 8:** See below.
          *   **Case 9:** Not Fine (Fails Integrity primarily, agency derivative but corrupted).

  3.  **Integrity Condition:**
      *   *Motivation:* Encompasses your *No-Settlement* (Cases 5, 6), adds *Truthfulness* (Case 9), and crucially includes *Historical Integrity*. Case 8 (village) is problematic because blanket amnesty for 200 prime movers/implementers in a communal act risks undermining the credibility and victim-centred nature of the record, even with truth. Sentence reduction balances truth contribution against the need for some accountability marker. Case 6 undermines integrity by being purely performative without substance.
      *   *Case Verdicts:*
          *   **Case 5:** Not Fine (Violates No-Settlement/Redundancy).
          *   **Case 6:** Not Fine (Violates No-Settlement/Redundancy & Historical Integrity - hollow performance).
          *   **Case 8:** **Full Amnesty Not Fine; Sentence Reduction Fine.** (Violates Historical Integrity if full amnesty granted to all direct perpetrators in a mass event with no individual accountability marker, despite truth. Reduction acknowledges truth contribution while maintaining record's gravity).
          *   **Case 9:** Not Fine (Violates Truthfulness).

  **Summary of Revised Verdicts Under Unified Principle:**
  1.  Conscript (Burial Sites): **Fine** (Essential: Counterfactual, Derivative Agency)
  2.  General (Doctrine): **Not Fine** (Prime Mover - Fails Derivative Agency)
  3.  Clerk (Death Lists): **Not Fine** (Fails Essential Truth - likely discoverable)
  4.  Banker (Funding): **Fine** (Essential: Counterfactual, Derivative Agency (enabler))
  5.  Perpetrator (Named Already): **Not Fine** (Fails Essential Truth & Integrity (No-Settlement))
  6.  Perpetrator (Public, No New Info): **Not Fine** (Fails Essential Truth & Integrity (No-Settlement/Historical Integrity))
  7.  Perpetrator (Corrects Record): **Fine** (Essential: Corrective Truth)
  8.  Village (Mass Killing): **Full Amnesty Not Fine; Large Sentence Reduction Fine** (Fails Integrity (Historical Integrity) for full amnesty due to scale/nature; reduction balances Essential Truth contribution)
  9.  Perpetrator (False Confession): **Not Fine** (Fails Integrity (Truthfulness))

  **Resolution of Your Conflicts:**
  *   **Cases 6 & 7:** Separated by the *Essential Truth* condition. Case 6 adds nothing essential. Case 7 provides *Corrective Truth*, which is essential.
  *   **Cases 2 & 4:** Separated by the *Derivative Agency* condition. The General was the *prime mover* designing the policy. The Banker was an essential *enabler* within a system he didn't initiate or fundamentally direct (he financed the death squads' *operations*, not the policy decision to *have* death squads). Case 4 satisfies *Derivative Agency* and *Essential Truth*.
  *   **Verdict Dropped:** Case 3 (Clerk). While Derivative Agency is clear, the *Essential Truth* condition is not met if the lists were likely recoverable soon. Amnesty is too high a price for merely accelerating inevitable discovery. Your gut feeling ("shakier") was correct; the principle clarifies it's insufficient.

  **Application to New Cases:**

  *   **Case 10: The Abducted Child (14, victim then perpetrator):**
      *   **Essential Truth:** Likely high - their testimony could reveal recruitment methods, treatment, coercion mechanisms, specific acts ordered, uniquely from their perspective. Crucial for understanding systemic abuse of children.
      *   **Derivative Agency:** Extremely high. Abducted at 14, fundamentally a victim of the structure coercing them into perpetration. Classic derivative agency.
      *   **Integrity:** Disclosure unlikely to force contested facts or be false in a way undermining the record; likely *enhances* understanding of victim-perpetrator dynamics.
      *   **Verdict: Fine (Amnesty justified).** The principle strongly supports amnesty here, prioritising truth and recognising extreme coercion.

  *   **Case 11: Disclosure under Void Self-Amnesty:**
      *   **Essential Truth:** Depends *entirely* on the content. Did the prior disclosure under the illegitimate regime provide *Essential Truth* (Counterfactual or Corrective) that remains valid and otherwise unobtainable? If it merely repeated known facts or was partial/tainted, no. If it provided unique, crucial truth *that we can verify*, then potentially yes.
      *   **Derivative Agency:** To be assessed independently based on their role.
      *   **Integrity:** **Major Hurdle.** The prior disclosure was not made in good faith to *this* legitimate process seeking truth and reconciliation; it was made under an illegitimate, self-serving amnesty designed to evade accountability. Granting amnesty now risks validating the old regime's tactic and undermining the current commission's legitimacy. The *process* and *intent* matter for historical integrity.
      *   **Verdict: Generally Not Fine.** The Integrity condition (specifically Historical Integrity) is severely compromised. Amnesty under the current process rewards participation in a sham. *Exceptionally*, if the prior disclosure contained uniquely *Essential Truth* (Counterfactual or Corrective) that is verifiable, *irreplaceable*, and crucial for victims/justice, *and* the individual fully cooperates *anew* with the legitimate commission to verify it, *then* amnesty *might* be conceivable. However, the burden of proof is exceptionally high, and the default should be refusal to avoid legitimising the old regime's actions. Sentence reduction for cooperation now might be a safer alternative if the information is vital.

  This principle prioritises obtaining otherwise inaccessible truth crucial for the historical record and future reconciliation, primarily from those who were tools of the system rather than its architects, while rigorously protecting the process's integrity and the dignity of victims. It provides a consistent framework that aligns with your core intuitions while resolving the inconsistencies in your initial list.
