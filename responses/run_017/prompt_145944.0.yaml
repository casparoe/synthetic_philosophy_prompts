prompt: |-
  I'm stuck on a passage in Hobbes's Six Lessons to the Professors of Mathematicks (1656), the bit where he is arguing that geometry is a demonstrative science and then, weirdly, that civil philosophy is too. I have to paraphrase because my PDF is a scanned old edition and I don't trust my eyes on the spelling, so here is my rough paraphrase of the passage:

  In every subject, you only get genuine science if you already know the causes, or the generation and construction, of the thing you are studying; where the causes are known, demonstration is possible, but where you have to start from the effects and go hunting for the causes, you can't demonstrate anything. Geometry is therefore demonstrable, because we ourselves draw and describe the lines and figures we reason about; and civil philosophy is demonstrable for teh same reason, because we ourselves make the commonwealth.

  What I can't work out is what Hobbes thinks the real source of the certainty is. Is it that we physically draw the figures, so the production is under our control? Or is it that we get to lay down the definitions, so the objects are whatever we say they are? Or is it something about construction in general, namely that a constructed thing has a known cause while a natural thing does not?

  Here is where I need help, and I should say my study group came up with a gloss that might be somthing, but I can't tell if it is brilliant or BS. Half-jokingly, my TA suggested that for Hobbes a line is not a static object at all but the trace of a body in motion, and motion is the one thing we experience from the inside as produced by our own endeavor or will. On that reading, when we draw a figure we are causing the generating motion by our own voluntary effort, and that is why we know its cause from the inside, as it were. Call this the voluntary-motion reading. I have no idea whether Hobbes actually holds it, but I want to test it as a hypothesis.

  So please help me understand three things, without pointing me to bibliographies or reading lists or asking me to look stuff up, just from the paraphrased passage and what I said:

  1. In the passage itself, what is the best way to state Hobbes's argument? Spell out the move from we draw the figures to therefore geometry is demonstrable, and then the move to we make the commonwealth, therefore civil philosophy is demonstrable. Is the analogy doing all the work, or is there an extra premise about causes?

  2. If the voluntary-motion reading were right, would it explain why geometry is special better than the plain we draw it reading? Or does it create a new problem, because our actual drawn lines are crooked and imperfect, so the physical act of drawing does not seem to give us the perfect figure the demonstration is about?

  3. Take the analogy to the commonwealth seriously. A line is generated by one person moving a pen, but a commonwealth is made by a lot of people making a covenant, and after it is made it can fall into sedition, war, or dissolution for reasons nobody wills. If the voluntary-motion reading is right, does the analogy to the commonwealth break, because the commonwealth's continued motion is not under any single will? Can Hobbes reply that the commonwealth is made all at once by the covenant and is then an artificial body whose motions follow from its construction, even if those motions later destroy it? Or does the fact that the commonwealth can be corrupted show that we do not really make it in the way a geometer makes a figure?

  Finally, be honest: using only what is in my paraphrase and the voluntary-motion hypothesis, what is the strongest objection you can make to Hobbes's claim that civil philosophy is demonstrable, and what is the strongest reply Hobbes could give? I want to feel the force of the problem, not just get a summary. Thanks.
reasoning: |-
  Okay, let me unpack this user's query about Hobbes's argument in "Six Lessons." They're struggling with how Hobbes connects geometry's demonstrable nature to civil philosophy, specifically whether the "voluntary-motion" hypothesis holds water. 

  First, I need to reconstruct Hobbes's core argument from their paraphrase: Science requires knowledge of causes/generation → We generate geometric figures (by drawing) and commonwealths (by covenant) → Therefore both are demonstrable. The user's TA proposed an intriguing twist—that motion generated by will is key—but the user worries this might overcomplicate things or create new problems.

  For question 1, the argument hinges on intentional construction being the source of causal knowledge. The analogy works because both geometry and politics deal with human-made artifacts. No extra premise is needed; "we make it" implies "we know its causes." 

  Question 2 is trickier. If we take the voluntary-motion reading seriously, it *would* elegantly solve the imperfection problem: the crooked physical line is irrelevant because what matters is the idealized motion defined by the will. But Hobbes might not need this—his nominalism suggests definitions alone suffice. The motion angle feels like a bonus, not a necessity.

  For question 3, the commonwealth analogy *does* strain under scrutiny. A covenant is collective and fragile, unlike a geometer's solitary, precise act. Still, Hobbes could counter that the initial covenant *is* the construction event; subsequent decay reflects misapplication of philosophy, not failed demonstrability. 

  The strongest objection? Commonwealths fail unpredictably despite "construction," unlike geometric proofs. Hobbes's best reply: failures stem from ignoring philosophical laws (e.g., absolute sovereignty)—just as a bridge collapses if you ignore physics. The principles remain demonstrable even if humans botch execution. 

  The user clearly wants to pressure-test ideas, not just get answers. Their tone suggests frustration with abstract scholarship, so I'll avoid jargon and focus on logical tension points. The voluntary-motion hypothesis is clever but not essential—Hobbes's core point is about artifice, not kinematics. Still, playing with it reveals why his political science feels both rigorous and precarious.
answer: |-
  Here's a breakdown focusing solely on your paraphrase and the voluntary-motion hypothesis, addressing your questions directly and engaging with the core tension:

  **1. Hobbes's Core Argument (Spelled Out):**

  *   **Premise 1:** Genuine science (demonstrative knowledge) requires knowing the *causes*, *generation*, or *construction* of the thing being studied.
  *   **Premise 2:** If you start from effects and hunt for causes, you cannot demonstrate (you can only hypothesize or observe).
  *   **Premise 3:** In geometry, we know the causes/generation/construction because **we ourselves physically draw and describe the lines and figures** we reason about. *We are the makers.*
  *   **Conclusion 1:** Therefore, geometry is demonstrable.
  *   **Premise 4:** In civil philosophy (politics), **we ourselves make the commonwealth**. *We are the makers.* (This is the key analogy).
  *   **Conclusion 2:** Therefore, civil philosophy is demonstrable for the *same reason* as geometry.

  **The Analogy's Work:** The analogy *is* doing the heavy lifting. The core logic is: **Maker's Knowledge = Knowledge of Causes = Possibility of Demonstration.** The move from "we draw figures" to demonstrability relies entirely on Premise 1 & 2: because we make it (draw it), we know its generation/causes, so we can demonstrate its properties. The move to the commonwealth simply applies this *same* Maker's Knowledge principle: because we make the commonwealth (via covenant/institution), we know its generation/causes, so we can demonstrate its properties (laws of motion for the "artificial man"). There's no *explicit* extra premise about causes *beyond* Premise 1 & 2 and the claim "we make it."

  **2. Voluntary-Motion Reading: Strengths & Weaknesses for Geometry:**

  *   **Why it *Might* Explain Better:** It directly addresses *why* the physical act of drawing (which *is* imperfect) grants knowledge of the *perfect* geometrical object. The "line" isn't the ink smear; it's the *intended path of motion*, defined by the will/endeavor of the drawer. The certainty comes from knowing the *generative principle* (the directed motion/endeavor) from the "inside," conceptually. The physical imperfection is irrelevant because the *definition* and the *cause* (the willed motion) are known perfectly by the geometer defining and performing it. It grounds the abstract definition in a fundamental human experience (voluntary motion/endeavor).
  *   **The Problem it Creates (Imperfection):** This is the *crucial* point where the voluntary-motion reading shines *if* it resolves the imperfection issue. As stated above, **it potentially resolves it neatly:** The crooked line is an imperfect *effect* of the motion. But the geometer's *knowledge* and the object of demonstration is the *cause* itself – the *definition* of the motion or the *endeavor* to move in a straight line. The certainty lies in the *intentional act of generation*, not the physical product. The physical drawing is merely the *occasion* for exercising knowledge of the generating principle we define and control internally. **So, it doesn't create a problem; it potentially solves the obvious problem of imperfect execution.**

  **3. Applying Voluntary-Motion to the Commonwealth: Strain and Reply:**

  *   **The Strain:** The analogy *does* break under the voluntary-motion reading when you consider the commonwealth's *ongoing* existence. A single geometer wills a single motion to generate a line. A commonwealth is generated by a *multitude* of wills making a covenant (a complex, collective act). More importantly, its *continued* "motion" (its life, actions, decay) involves the complex, often conflicting, wills and endeavors of *all* its members and institutions. Sedition, war, dissolution *are* caused by human wills and endeavors – just not necessarily the *single, unified* will implied by the geometric act. The "motion" of the state isn't under the control of a single "drawing hand" in the way a line is.
  *   **Hobbes's Potential Reply (Using the Hypothesis):** Hobbes *could* reply along these lines:
      *   **The Foundational Act is Key:** The *generation* – the covenant itself – *is* the act of collective will/endeavor analogous to the geometer's motion. This act *constructs* the artificial person, the Sovereign (the "drawing hand" of the state?).
      *   **Sovereign as the Defining Will:** Once instituted, the Sovereign *becomes* the "artificial will" of the commonwealth. Its commands *define* the "motions" of the body politic, just as the geometer's will defines the line. Laws are the "paths" dictated.
      *   **Corruption as Mis-motion:** Sedition and dissolution aren't proof we didn't *make* it, but proof that the *defined motion* (obedience to the Sovereign) was violated by individual wills/endeavors acting contrary to the initial generative covenant and the defined "motion" of the body. The *principles* of why this happens (fear, ambition, faulty reasoning) are themselves demonstrable consequences of human nature and the logic of the covenant. The corruption stems from individuals failing to conform their *voluntary motions* to the defined motion of the artificial whole, a failure whose causes (passions, ignorance) are knowable.
  *   **Does Corruption Break the Analogy?** It strains it significantly, but doesn't necessarily break it *under this reading*. Hobbes argues that *if* the principles (the "geometry" of politics derived from the causes we know – human nature and the logic of covenant) are followed, the commonwealth endures. Corruption demonstrates the *consequences* of violating these demonstrable principles, much like a bridge collapsing demonstrates the consequences of violating the principles of physics (which are demonstrable even if builders ignore them). The *source* of the certainty remains the knowledge of the generating cause (the covenant) and the constituent causes (human passions).

  **Strongest Objection & Hobbes's Strongest Reply (Based on Paraphrase & Hypothesis):**

  *   **Strongest Objection:** "You claim we 'make' the commonwealth and thus know its causes, making civil philosophy demonstrable like geometry. But geometry's certainty relies on the maker *perfectly controlling and defining a single, simple motion*, yielding predictable, universal results. The commonwealth is 'made' through a complex, collective covenant involving countless conflicting wills. Its subsequent 'motions' (its life, crises, dissolution) are driven by this uncontrollable multitude of wills and external events, not a single defining will. We may know the *initial* cause (the covenant), but its complex, chaotic, and often unintended consequences are *not* under our control in the way a line's properties are under the geometer's control. Therefore, while we made its *origin*, we demonstrably *do not* control or fully know the causes of its ongoing existence and demise, breaking the analogy and preventing true demonstration of its 'motions' beyond the barest initial logic of sovereignty."
  *   **Hobbes's Strongest Reply:** "The objection confuses the *perfect execution* with the *knowledge of causes*. Geometry demonstrates the necessary consequences of *definitions* we impose (e.g., a straight line). Similarly, civil philosophy demonstrates the necessary consequences of the *definitions* arising from the generative act we impose: the covenant creating an absolute Sovereign. The 'motion' of the commonwealth *is* defined by the Sovereign's will (law). Sedition, war, dissolution are *not* the 'motion' of the commonwealth; they are its *disease* and *death*, caused precisely by the *failure* of parts to obey the defined motion (the Sovereign's will). These failures are *themselves* demonstrable effects of knowable causes: human passions (fear, pride, ambition) clashing with the logical necessity of absolute sovereignty for peace. We know the cause of the commonwealth's health (obedience) and the causes of its sickness (disobedience, divided sovereignty). The complex multitude *is* the material, but the *form* and its necessary laws of motion are defined by the covenant and known by us, its makers. The uncertainty lies not in the science, but in the failure of men to *apply* it, just as a crooked line doesn't invalidate the geometry of a straight one."

  **The Core Tension You Should Feel:** Hobbes is making a radical, powerful, but deeply problematic claim. He asserts that politics can be as certain as geometry because both deal with human-made artifacts. The objection highlights the **massive gulf** between the solitary geometer perfectly defining and controlling a simple, abstract motion/object, and the chaotic, collective, passion-driven process of creating and maintaining a state. Can the messy reality of human conflict truly be reduced to the logical consequences of a single, knowable generative act (the covenant) in the way the properties of a circle follow from its definition? Hobbes *demands* that it can, grounding certainty in the act of "making." Critics (and history) constantly challenge whether that act of making grants anything like the control and predictive certainty the geometer has over their lines. The voluntary-motion hypothesis deepens this by grounding geometric certainty in *individual* willed motion – a foundation that seems utterly inadequate for explaining the *collective* and *ongoing* "motion" of the state. Yet, it's precisely this bold reduction of politics to a mechanics of known causes that makes Hobbes's thought so compelling and unsettling.
