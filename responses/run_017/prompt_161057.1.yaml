answer: |-
  Here’s a rigorous specification for an adequate theory of precommitment, structured around non-negotiable requirements derived from your cases and constraints. I’ve prioritized internal coherence, empirical reality, and the hard cases you flagged. The requirements are ranked by how deeply they cut—if a theory fails a higher-ranked one, it’s likely inadequate regardless of other virtues.

  ### Core Adequacy Requirements (with Rationale & Test Cases)
  1. **The Binding Force Requirement**:  
     *Must explain why a past act *binds*, not merely influences, and how this force persists even when the later agent (self or successor) reflectively dissents.*  
     - **Test Cases**: Begging Ulysses (genuine reconsideration), dead hand problem (binding successors).  
     - **Rationale**: Distinguishes precommitment from advice or incentives. If dissent always trumps, precommitment collapses into mere preference-shaping.  

  2. **The Enforcer Problem Requirement**:  
     *Must account for the agency, interests, and potential corruption of third-party enforcers (crew, courts, algorithms).*  
     - **Test Cases**: Crew’s bribability, app selling data, court-packing.  
     - **Rationale**: Real-world precommitments rely on fallible enforcers. Ignoring this ignores why precommitments fail (e.g., constitutions subverted by bad-faith actors).  

  3. **The Epistemic Gap Requirement**:  
     *Must handle the crew’s dilemma: distinguishing "derangement" (irrationality) from "reconsideration" (rational preference shift) without perfect knowledge.*  
     - **Test Cases**: Crew unsure if Ulysses’ begging is weakness of will or new insight; constitutional court judging if amendment reflects popular whim or reasoned evolution.  
     - **Rationale**: If a theory requires omniscience to identify "true" rationality, it’s useless. This is the crux of the begging Ulysses case.  

  4. **The Numerical Difference Requirement**:  
     *Must address when binder/bound are numerically distinct agents (e.g., past self vs. future self, founders vs. citizens), without smuggling in identity assumptions.*  
     - **Test Cases**: Individual vs. collective precommitment; constitutions binding future generations.  
     - **Rationale**: Theories that work only for "same agent" (e.g., continuity of consciousness) fail for collectives; theories for collectives often ignore individual autonomy.  

  5. **The Friction Asymmetry Requirement**:  
     *Must explain why *removing options* (burning ships) differs ethically and functionally from *raising costs* (fridge lock), and when each is justified.*  
     - **Test Cases**: Cortés vs. Ulysses; sunset clauses (temporary removal) vs. unamendable clauses (permanent removal).  
     - **Rationale**: Option-removal denies agency wholesale; cost-raising preserves it asymmetrically. Treating them as identical ignores autonomy violations.  

  6. **The Ratchet Prevention Requirement**:  
     *Must address whether chains of precommitments can cumulatively produce outcomes no individual self/assembly would endorse, and how to limit this.*  
     - **Test Cases**: Constitutional entrenchment cascades (e.g., successive amendments locking in minority vetoes); self-binding apps that stack restrictive defaults.  
     - **Rationale**: Without this, precommitment enables pathological rigidity—violating the "lock-in mistakes" constraint.  

  7. **The Discounting Justification Requirement**:  
     *Must incorporate empirical human tendencies (future discounting, preference misprediction) as *necessary but insufficient* grounds for precommitment.*  
     - **Rationale**: Your dull empirical point—if a theory can’t explain why we need precommitment (e.g., against akrasia), it fails. But it must not *reduce* precommitment to this (or it ignores dead-hand concerns).  

  ### What’s Not a Requirement (But Often Mistaken for One)
  - **"The reflective later self’s judgment should always win"**: This *is* an autonomy-camp prejudice, not a requirement.  
    - **Why**: It collapses binding into mere advice. A theory can grant *prima facie* authority to the present self while allowing override under strict epistemic conditions (e.g., only if enforcers confirm rationality via procedure). Your begging Ulysses case shows why this is inadequate as a universal rule—sometimes binding *should* hold.  
  - **"Past selves have better information"**: Often false (e.g., mental health directives where illness distorts past judgment). A theory must not assume past epistemic superiority.  

  ### Internal Tensions and Which Requirement to Drop
  - **The Conflict**: **R3 (Epistemic Gap)** and **R4 (Numerical Difference)** create a tension with **R1 (Binding Force)**. If enforcers can’t reliably distinguish rational reconsideration from derangement (R3), and binder/bound may be distinct agents (R4), enforcing binding (R1) risks overriding *legitimate* authority.  
  - **The Irreconcilable Pair**: **R1 (Binding Force)** + **R3 (Epistemic Gap)** vs. **"Present reflective judgment as ultimate authority"**.  
    - **Why Incompatible**: If binding must work even against calm, informed dissent (per R1), and we lack perfect epistemic criteria to invalidate that dissent (R3), then enforcing binding *necessarily* overrides present authority sometimes. This isn’t verbal—it’s structural.  
  - **Which Requirement to Drop?** Drop the unstated requirement that **"present judgment is always sovereign"**. It’s not necessary for adequacy (contra autonomy views) and contradicts R1. A theory can hold that precommitment *defers* authority to a procedure or past assessment under defined constraints.  

  ### Scorecard: Where Major Theories Fail
  - **Plain Sovereignty/Autonomy View** (e.g., later self always wins):  
    **Fails R1 (Binding Force)**. Cannot explain why Ulysses should stay tied if he genuinely rethinks his values. Also fails **R4 (Numerical Difference)** for collectives.  
  - **Prudential Expected-Utility View** (e.g., maximize lifetime welfare):  
    **Fails R2 (Enforcer Problem)**—assumes disinterested enforcers. **Fails R5 (Friction Asymmetry)**—treats burning ships as "high cost," ignoring agency denial.  
  - **Multiple Selves / Intrapersonal Bargaining** (e.g., Elster):  
    **Fails R4 (Numerical Difference)**—extends "selves" metaphor to collectives poorly. **Fails R6 (Ratchet Prevention)**—no tools to evaluate pathological chain outcomes.  
  - **Dead-Hand Skepticism** (no binding successors):  
    **Fails R1 (Binding Force)** outright. Ignores **R7 (Discounting Justification)**—discounts why future selves need constraints.  

  ### The Crucial Takeaway
  The hardest requirement is **R3 (Epistemic Gap)**. A theory must offer *procedural or evidentiary standards* for enforcers to adjudicate "derangement vs. reconsideration" under uncertainty. If it can’t, it either:  
  - Makes precommitment tyrannical (ignoring legitimate dissent), or  
  - Renders it inert (dissolving at first challenge).  
  This is why **R3 excludes most contenders**—they assume away the epistemic problem or handwave it with circular appeals to "rationality." An adequate theory must tackle this head-on, likely via a thin proceduralist account (e.g., "override only if criteria X, Y are met, judged by institution Z with incentive structure Q"). Your crew’s dilemma isn’t a puzzle; it’s the core of the theory.
