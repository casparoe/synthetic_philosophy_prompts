  For the scorecard: plain autonomy views fail on R3 (effectiveness); expected-utility approaches fail on R2 (enforcer problem) and R6 (friction asymmetry); multiple-selves theories fail on R1 (numerically different agents); dead-hand skepticism fails on R5 (epistemic modesty about future preferences).

