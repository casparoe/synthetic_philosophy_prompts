prompt: |-
  Hi. I work on a three-person "emerging contaminants" triage panel at a regional water company — about 900,000 customers, mix of groundwater and surface water. A few times a year we get an alert: our own monitoring, or a lab contractor, flags a substance in raw or treated water that nobody has a proper health-based value for. Within 48 hours we have to land on one of four things — do nothing, step up monitoring, issue a precautionary advisory to a specific group (bottle-fed babies, dialysis patients, pregnant women), or advise people not to drink the water, which in practice means bottled water distribution and a wall of angry phone calls. A consultant in public health medicine signs off whatever we propose, the comms team want one unambiguous sentence they can put on the website, and we're not allowed to pretend we have powers we don't have: we advise, the regulator decides.

  Right now we're completely inconsistent and we know it. Two years ago we issued an advisory about something that later turned out to be harmless, and before that we sat on something that in hindsight we should have acted on much earlier. Both were judgement calls made over email. So I want a written procedure we can actually run under time pressure, by people who aren't toxicologists.

  A few things it has to survive, because these are the bits we keep getting stuck on.

  One: the interventions have their own risks. A do-not-drink pushes people onto bottled water, which is expensive, badly regulated and a plastic waste problem; on one estate a few years back it pushed people onto a private borehole that nobody tests. Boiling concentrates some things rather than removing them. So whatever principle tells us to act under uncertainty has to be applied to our own remedy too, not just to the substance.

  Two: my colleague Dave has this thing he calls the "reversibility test" — he says precaution is only licensed when the harm you're guarding against is irreversible relative to the cost of waiting, and that's what separates genuine precaution from just being jumpy. Our public health consultant says the test is backwards, because the whole point is that you don't yet know whether the harm is reversible, so the test will always tell you to wait. I'd like the procedure to settle that, or to say why it can't.

  Three: what I think of as the two-file problem. The file on the new mystery compound is thick — someone measured it, so we have a number, a study, a report. The file on the legacy contaminant we've quietly lived with for thirty years is empty, because nobody ever looked. Any procedure keyed to evidence will systematically over-attend to whatever happened to be measured most recently, and I don't want a procedure that's just a bias with a flowchart attached.

  Four: we usually can't get a number. No health-based value, no dose-response, sometimes one 90-day rat study at doses thousands of times higher than anything in water, sometimes two studies that disagree where both were funded by somebody with an interest. The procedure needs to say what we do on the day with a thin file, not what we'd do if the science were better.

  Please run it on three composites (made-up names and numbers, roughly the shape of things we actually see). Case A: a solvent from a plating works that shut in the nineties, detected at 2 micrograms per litre, health-based value of 30 derived from a rat study with a big safety factor, stable for years but now creeping up about 5% a year. Case B: a replacement fluorinated compound from a plant still in operation, no health-based value anywhere, liver effects in rats at high doses, detectable in everyone's blood, source still active. Case C: an algae metabolite after heavy rain — zero toxicological concern, but the water tastes and smells earthy, call volumes have tripled, a councillor is demanding bottled water, and a local Facebook group is telling people the supply is poisoned.

  At least one of the three should come out somewhere I'd rather it hadn't — either we've been doing nothing and the procedure says that's been wrong, or the reverse — and please say plainly which one that is and why. Also say where the procedure has to stop and hand the decision to a human because it's a values call and not a factual one, and what it simply can't do for us.

  Two more things: don't point me at specific guidance documents or papers, I can't get hold of them and I'd rather have the reasoning than the references. And write it as continuous prose — no headings, no bullet points, no bold, no tables; describe the steps in order in paragraphs, inline numbering is fine if it helps — and in British English please.
reasoning: |-
  Okay, the user works on a triage panel for a water company dealing with emerging contaminants. They need a consistent written procedure to handle alerts within 48 hours, without relying on toxicologists. The key challenges are: considering risks of interventions themselves, resolving the "reversibility test" debate, avoiding bias toward newly measured contaminants, and making decisions with limited data.

  Hmm, the user's pain points are clear. They've had inconsistent responses in the past - both overreacting and underreacting. The procedure must survive four tricky aspects: 1) Interventions have secondary consequences (like pushing people to untested boreholes), 2) Dave's "reversibility test" vs. the public health consultant's view, 3) The "two-file problem" where new detections get attention while legacy issues are ignored, and 4) Usually having minimal scientific data.

  Right, I need to build a procedure that flows logically. Start with immediate containment assessment since that's time-critical. Then evaluate evidence quality - not just presence but reliability. The reversibility debate needs settling: irreversible harm potential justifies precaution despite uncertainty, but must weigh against intervention risks. 

  For the two-file problem, I'll include an explicit step comparing to background levels. And for thin data, focus on what we know about substance class and exposure patterns rather than waiting for perfect toxicology.

  Testing with three cases: 
  - Case A (creeping legacy solvent) might show the procedure flags complacency 
  - Case B (active PFAS replacement) should trigger action despite data gaps
  - Case C (taste/smell issue) needs to resist political pressure

  The tricky output will likely be Case A - if the creep continues, the procedure should escalate monitoring even with a comfortable safety margin. That'll feel uncomfortable but addresses the "two-file problem".

  For British English: "monitoring" not "monitering", "plating works" not "plating plant", "adviser" not "advisor" except in formal titles. Continuous prose with inline numbering as requested.

  The procedure must clearly indicate where human judgment takes over - like when community distrust outweighs technical risk in Case C. And explicitly state limitations: can't create data where none exists, can't override regulator authority.

  Final structure: 
  1. Immediate actions 
  2. Evidence assessment 
  3. Risk comparison 
  4. Reversibility test application 
  5. Intervention selection 
  6. Documentation 
  With special handling for the four pain points throughout.
answer: |-
  Here is a written procedure designed for your triage panel, addressing your core requirements and structured as continuous prose in British English. It incorporates your critical constraints – intervention risks, the reversibility test dilemma, the two-file problem, and operating with thin data – and is applied to your three cases.

  **Procedure for Emerging Contaminant Triage Response**

  When an alert for an unregulated contaminant is received, follow this sequence within the 48-hour window. Begin by confirming the detection: verify the sample source (raw/treated), chain of custody, analytical method, and quantitation limit. Immediately assess if there's an obvious, ongoing source requiring urgent containment (e.g., a visible spill). This is step zero. Assuming no immediate source mitigation is possible by you, proceed to step one: characterise the evidence. Examine what is known about the detected substance. Do not solely focus on the concentration or the new report. Actively consider the substance class (e.g., solvent, PFAS, toxin), structural analogues, known mechanisms of toxicity (carcinogen, endocrine disruptor, organ toxicant), and typical sources. Crucially, compare this detection to background levels: is this substance commonly found elsewhere (like Case B in blood), or is it a complete anomaly? Simultaneously, assess the quality of the data: is it a single sample, a trend, a peer-reviewed study, an industry report? Acknowledge the "two-file problem" explicitly: the absence of data on legacy substances does not equate to safety, and a thick new file does not automatically imply higher risk. The lack of data on the legacy contaminant is a data point in itself, indicating ignorance, not absence of risk.

  Step two is the dual assessment of potential harm and intervention risk. Evaluate the potential for irreversible harm. Use the best available evidence *and* the principle of the substance class. Irreversible harm includes death, permanent organ damage, developmental defects, or irreversible chronic conditions like cancer. Crucially, if the *potential* for irreversible harm exists based on substance class, mechanism, or limited data, and the level of uncertainty is such that waiting for definitive proof is impractical, this triggers the legitimacy of precaution. However, Dave's "reversibility test" is integrated but qualified: precaution is *licensed* when the *potential* for irreversible harm exists relative to the *known and probable* costs of waiting *and* the intervention. This addresses the public health consultant's concern – we don't need to *know* the harm is irreversible; we need reasonable grounds based on evidence and toxicological principles to suspect it *might* be, and that waiting could eliminate the chance to prevent it. Crucially, simultaneously assess the risks of potential interventions: the financial burden, environmental impact (e.g., plastic waste), health risks of alternative sources (e.g., untested boreholes), potential for concentrating contaminants via boiling, and the erosion of public trust from either over-reaction or under-reaction. The potential for irreversible harm from the contaminant must be weighed against the known and probable harms of the intervention itself. This is often the point requiring explicit human judgment.

  Step three is the decision matrix, informed by steps one and two. Present four clear options:
  1.  **Do Nothing:** Justified if the evidence suggests negligible risk *and* the substance is ubiquitous at similar levels (mitigating the two-file problem), *or* if the intervention risks demonstrably outweigh the plausible contaminant risk based on the irreversible harm assessment. Continued routine monitoring is implied.
  2.  **Step Up Monitoring:** The default action when significant uncertainty remains, but evidence for substantial irreversible harm is weak, *or* when a trend (like a slow increase) is the primary concern. Also chosen if intervention risks are currently deemed too high relative to the uncertain benefit. Define the increased frequency and duration clearly. This is often the bridge action.
  3.  **Issue Precautionary Advisory to Specific Group:** Justified when evidence suggests a specific vulnerable subgroup (e.g., bottle-fed infants, pregnant women, immunocompromised) might be at higher risk of irreversible harm, even if general population risk is low or uncertain. The intervention must be targeted and proportionate (e.g., use bottled water for formula, not total avoidance). The specific group and rationale must be defensible based on toxicology (e.g., developmental effects).
  4.  **Advise Not to Drink:** The most severe action, justified only when there is credible evidence suggesting a *significant probability* of widespread irreversible harm in the general population at the detected levels, *and* the risks of the intervention itself (bottled water, alternative sources) are judged to be lower than the plausible risks of consumption. This requires the highest burden of justification regarding the irreversible harm assessment.

  Step four is documentation and sign-off. Document the specific evidence considered (including gaps), the assessment of irreversible harm potential, the assessment of intervention risks, the chosen action, and the explicit rationale linking the evidence and assessments to the decision. This is presented to the public health consultant for sign-off, forming the basis for comms. The comms team then crafts the single unambiguous sentence based *solely* on the signed-off action (e.g., "As a precaution, we advise bottle-fed infants in [Area] use bottled water for formula preparation until further notice").

  **Application to Cases:**

  *   **Case A (Legacy Solvent, 2 µg/L, HBV 30, creeping up 5%/year):** Step one characterises it as a known solvent below its HBV, but notes the slow, persistent increase. The two-file problem is acknowledged: stability previously didn't mean safe, just unchanging. Step two assesses: HBV suggests low acute risk, but the class (solvent) often has chronic/carcinogenic potential. The slow increase creates future uncertainty. Reversibility: Potential chronic effects (e.g., cancer) are irreversible, but progression is slow. Intervention risks (bottled water) are high relative to current low level. **Step three:** "Do nothing" is inadequate due to the trend. "Step up monitoring" is the proportionate response. Increase sampling frequency (e.g., quarterly to monthly) specifically at the source/monitoring points showing the increase, to better characterise the trend and trajectory. Document trend as the key concern. *This might feel uncomfortable if you've been complacent about the creep, but the procedure forces action on the uncertainty introduced by the change.*
  *   **Case B (Replacement PFAS, no HBV, liver effects in rats, ubiquitous in blood, source active):** Step one: PFAS class is strongly associated with persistence, bioaccumulation, and multiple health concerns (liver, immune, developmental). Ubiquity in blood shows exposure, but doesn't indicate safety. Source is active – potential for increasing levels. Step two: Liver effects in rats suggest organ toxicity. PFAS are linked to chronic, potentially irreversible effects (immune dysfunction, some cancers). High potential for irreversible harm exists based on class and limited data. Intervention risks are significant but must be weighed against plausible irreversible harm. **Step three:** "Do nothing" is unacceptable given class risk and active source. "Step up monitoring" is the *immediate minimum* – urgently characterise the extent (more sampling points, frequency), source contribution, and human exposure pathways. Simultaneously, based on the irreversible harm potential of the *class*, a "Precautionary Advisory" for bottle-fed infants *may* be justified *if* levels in water are significant (relative to background blood). This requires explicit human judgment balancing the strength of class concern against intervention risks. The procedure flags the *need* to seriously consider this advisory due to irreversible harm potential.
  *   **Case C (Algae Metabolite, taste/odour, public concern, zero tox concern):** Step one: Confirms no toxicological basis. Issue is aesthetic and perceptual. Step two: No plausible irreversible harm from the contaminant. However, intervention risks (bottled water) are high, and issuing an advisory without cause erodes trust. *Not* acting risks public distrust and potential recourse to unsafe alternatives driven by misinformation. Step two primarily assesses intervention risks and the risk of *inaction* on public confidence. **Step three:** "Do nothing" regarding health, but "Step up monitoring" of the aesthetic parameters and potentially source water algae is prudent. **Crucially, the health risk assessment stops here.** The demand for bottled water is driven by perception, not health risk. The procedure dictates *no health advisory* is justified. The comms action is *not* one of the four health interventions; it's a separate, robust public communication strategy to explain the absence of health risk, address the taste/odour issue transparently, and counter misinformation. This is where the procedure hands off completely to human judgment (comms, management) based on values (transparency, trust-building) not health risk facts.

  **Limitations and Handover Points:**

  The procedure cannot create scientific data where none exists. It forces explicit consideration of uncertainty, class effects, and intervention risks, but the core assessment (Step 2) relies on professional judgment about "potential for irreversible harm" and the weight given to substance class versus specific data. This judgment call (e.g., deciding how much the PFAS class concern weighs in Case B vs. the specific thin data) *must* be made by the panel, informed by the public health consultant. The procedure highlights where this judgment is critical. It also cannot resolve purely political or public perception pressures unrelated to health risk (Case C); it dictates no health action is warranted, handing that problem to comms and management. It cannot compel the regulator to act; it only governs your advisory. Finally, it cannot eliminate the "two-file problem" but forces active consideration of legacy ignorance versus new data points.

  **The Uncomfortable Outcome:**

  The procedure likely pushes you towards a more proactive stance on **Case B (Replacement PFAS)** than might feel comfortable with the thin file. It compels serious consideration of a precautionary advisory for vulnerable groups, primarily based on the irreversible harm potential inherent in the PFAS class and the active source, despite the lack of a specific HBV or human data. This addresses the "two-file problem" by not letting the *absence* of historical data on this specific compound outweigh the *presence* of concerning class characteristics. It also directly applies the qualified reversibility test: the potential harm justifies precaution even amidst significant uncertainty. This contrasts with Case A, where the action is monitoring the trend, and Case C, where no health action is indicated. The procedure makes the rationale for this distinction explicit and defensible.
