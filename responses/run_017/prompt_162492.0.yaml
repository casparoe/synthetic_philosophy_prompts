prompt: |-
  You're a statistician who also works on philosophy of science — please think this through carefully, brainstorm a bit before you commit to anything, and don't just hand me a label; I want the carving, not the word.

  I do analytics for a small chain of physio clinics (my sister's a nurse and we argue about this stuff constantly) and I keep hitting the same shape of problem, and I dont have the vocabulary for the differences between the versions. You know the basic trick: a treatment looks worse overall than the control, but looks better inside every subgroup you split by, and the tables look identical whichever way it happens. But I've noticed three versions that feel completely different to me, and I want to know whether the field has separate names for them. Version one is the famous one: the sicker patients get the new procedure more often, so the procedure group is full of hard cases, and once you split by how severe the case was at intake the procedure wins in both the mild and the severe pile. There everyone agrees you quote the split numbers and the overall number is just misleading. Version two: a shoulder rehab program where, overall, the people who did the program had worse function at six months than the people who didn't — but within each band of "how many home exercises per week" the program people did better in every band, and getting people to do the exercises was the entire point of the program, so the bands are partly an effect of the program rather than a preexisting difference between the groups. Here quoting the split numbers feels wrong to me in a way version one doesn't: it's like you subtract the exact thing the program was supposed to cause and then congratulate the program for what's left over. But the table looks the same.

  Version three, which I understand least: sometimes the split variable is recorded later and is itself partly caused by the outcome — splitting by whether the patient was still in pain at the three-week check, or whether they got referred for imaging — and the reversal shows up there too, and my sense is that in this version the split numbers aren't just unhelpful but meaningless, as if I'd manufactured the reversal by cutting on the wrong line. So: do these three have separate established names, or is it all one paradox plus separate background knowledge about what caused what? Is there a term for the version-two mistake specifically — reporting the within-stratum comparison when the stratifier sits downstream of the treatment, so that the comparison answers a different question than the one you asked — and is there a term for the thing you're actually trying to estimate in that case? Where do the edges fall: what about a stratifier that is both, partly a reason people ended up in the treatment group and partly caused by the treatment (an exercise habit that reflects prior motivation and is also boosted by the program)? Is either number right there, and can you get at the right quantity from the kind of data I actually have, or is it just not identifiable? And if some of these genuinely have no name, coin one and give me its definition and its boundary cases — what I actually care about is being able to tell the three apart in a real dataset, not having a word to drop.
reasoning: |-
  Okay, the user is a statistician working with a physiotherapy clinic chain, dealing with Simpson's Paradox variations. They've identified three distinct scenarios where overall and subgroup results contradict each other, each feeling different in interpretation. 

  First, I need to unpack their three versions carefully. Version 1 is textbook Simpson's Paradox: sicker patients get more treatment, creating imbalance. Adjusting for severity fixes it. Version 2 is trickier—the stratifier (exercise frequency) is actually an outcome of the treatment itself. Reporting within-stratum results here feels circular because you're conditioning on the very mechanism the program influences. Version 3 seems even messier: the stratifier (e.g., pain at 3 weeks) is post-treatment and potentially caused by the outcome, creating a collider bias situation where slicing the data introduces artificial associations.

  Hmm, the user's deeper frustration shines through—they're not just labeling paradoxes but wrestling with real clinical interpretations. Their sister being a nurse explains why they care about actionable insights over terminology. The core ask is about conceptual boundaries: when subgroup analysis is valid versus misleading, especially when causality blurs. 

  For Version 2, "conditioning on a mediator" feels close, but "treatment-induced mediator paradox" might better capture the nuance—it's not just any mediator but one the treatment actively creates. Version 3 screams "collider bias," but specifying it's a "post-outcome collider" clarifies timing matters. The murkiest part is their hybrid case (stratifier = baseline factor + treatment effect). Here, neither analysis gives the true effect; they'd need causal diagrams to untangle paths, maybe do a mediation analysis if they have longitudinal data. 

  ...Wait, I should emphasize that in Version 2, the "right" quantity is the controlled direct effect (CDE), but it's often not what clinics care about! They want the total effect including exercise adoption. That tension between statistical purity and real-world relevance is probably why they argue with their sister. 

  *Pauses* The coinage needs to be intuitive for clinic debates. "Treatment-induced mediator bias" for Version 2? "Collider stratification artifact" for Version 3? And for the hybrid—call it a "mixed-confounder-mediator" scenario, stressing that naive stats fail. Ultimately, their data might not resolve it without stronger assumptions or do-calculus. 

  ...*Sigh* I hope they have baseline exercise motivation data. Otherwise, they're stuck warning that "both numbers lie differently."
answer: |-
  You're absolutely right to distinguish these three scenarios—they're fundamentally different causal structures masquerading under the same statistical pattern (Simpson's Reversal). Here's how the field carves them up, with precise definitions, boundaries, and terminology (or lack thereof):

  ---

  ### **Version 1: **Classic Confounding (Established Term: **Simpson's Paradox**)**
  - **Mechanism**: The stratifier (e.g., *baseline severity*) is a **confounder**: it causally affects both treatment assignment *and* the outcome.
  - **Why the reversal happens**: Treatment is disproportionately given to sicker patients, who have worse expected outcomes regardless of treatment. Adjusting for severity removes this bias.
  - **Appropriate Action**: Report the **stratum-specific effects** (e.g., conditional effects) or a weighted average (e.g., standardized effect). The overall effect is biased.
  - **Boundary Clarity**: Uncontroversial. The stratifier is *pre-treatment* and *not affected* by treatment.

  ---

  ### **Version 2: **Conditioning on a Mediator (Established Term: **Mediation Fallacy** or **Overadjustment Bias**)
  - **Mechanism**: The stratifier (e.g., *exercise adherence*) is a **mediator**: part of the causal pathway through which the treatment affects the outcome.  
  - **Why the reversal happens**: The program *causes* higher adherence, which *causes* better outcomes. When you condition on adherence, you:  
    - Block part of the treatment’s effect (the path through adherence),  
    - Isolate the *direct effect* of the program (e.g., therapist skill, placebo), which may be weak or negative.  
    Meanwhile, the control group’s "adherence" is innate motivation—a confounder for the adherence-outcome link.  
  - **Why it feels wrong**: You’re **subtracting the program’s core mechanism** and judging the residual.  
  - **Appropriate Action**:  
    - The **overall effect** (intent-to-treat) answers: "Does offering the program improve outcomes?"  
    - The **stratum-specific effects** answer: "What’s the effect of the program *for patients who would exercise X times/week regardless*?" (a hypothetical question).  
  - **Established Terms**:  
    - **Target Quantity**: *Total Effect* (overall) vs. *Controlled Direct Effect* (within strata).  
    - **Mistake**: *Overadjustment* or *conditioning on a mediator*.  
  - **Boundary Case (Hybrid Stratifier)**:  
    If exercise habit reflects *both* pre-existing motivation (confounder) *and* program effect (mediator):  
    - Neither the overall nor the stratum-specific effect is the true "program effect".  
    - The overall effect mixes the program’s ability to motivate exercise *and* its direct benefit.  
    - The stratum-specific effect adjusts away motivation (good) but also blocks the program’s motivational effect (bad).  
    - **Solution**: Use **causal mediation analysis** (e.g., *interventional direct/indirect effects*) if you have data on pre-treatment motivation. Without it, the total effect is often more policy-relevant.

  ---

  ### **Version 3: **Conditioning on a Collider (Established Term: **Collider Bias** or **Selection Bias**)**
  - **Mechanism**: The stratifier (e.g., *pain at 3 weeks* or *imaging referral*) is a **collider**: caused by both treatment *and* outcome (or unmeasured factors affecting both).  
  - **Why the reversal happens**: Conditioning on a collider opens spurious paths. Example:  
    - Treatment → Pain reduction ← Unmeasured severity  
    - Outcome → Pain reduction ← Unmeasured severity  
    When you condition on "low pain at 3 weeks", you induce a false correlation between treatment and outcome *within the stratum*.  
  - **Why it’s meaningless**: The strata are **post-treatment outcomes**. You’re comparing apples to oranges (e.g., patients with low pain despite being severe vs. mildly ill).  
  - **Appropriate Action**: **Never condition on post-outcome variables**. The reversal is an artifact.  
  - **Established Term**: **Collider stratification bias** (a subset of *selection bias*).  
  - **Key Insight**: This is not about the treatment’s efficacy—it’s a statistical illusion.  

  ---

  ### **Summary & Terminology**
  | **Version** | **Causal Role of Stratifier** | **Primary Term**               | **Appropriate Estimate**       | **Mistake Term**               |
  |-------------|-------------------------------|--------------------------------|--------------------------------|--------------------------------|
  | **1**       | Confounder                    | Simpson’s Paradox              | Stratum-specific effects       | Ignoring confounding           |
  | **2**       | Mediator                      | Overadjustment Bias            | Overall effect (Total Effect)  | Conditioning on a mediator     |
  | **3**       | Collider                      | Collider Stratification Bias   | Neither—re-run analysis        | Conditioning on a collider     |

  ---

  ### **Handling the Hybrid Case (Stratifier = Confounder + Mediator)**
  - **Problem**: Common in practice (e.g., exercise habit reflecting both baseline motivation and program effect).  
  - **Why naive analyses fail**:  
    - Overall effect: Confounded by baseline motivation.  
    - Stratum-specific effect: Adjusts for confounder but blocks mediation path.  
  - **Solution Paths**:  
    1. **Causal Mediation Analysis**: Decompose effect into "direct" (program’s non-motivational impact) and "indirect" (via motivation) using models (e.g., g-computation).  
    2. **Baseline Covariate Adjustment**: Measure pre-treatment motivation, adjust for it in the *overall* analysis.  
    3. **Instrumental Variables**: If you have a random incentive to participate, use it to estimate local effects.  
  - **Identifiability**: Without pre-treatment confounder data, the total effect is estimable only if treatment is randomized. The mediated effect is not identifiable without strong assumptions.

  ---

  ### **Practical Advice for Your Clinics**
  1. **Map the causal diagram first**. Ask:  
     - Is the stratifier *before* treatment (confounder)?  
     - Is it *between* treatment and outcome (mediator)?  
     - Is it *after* treatment and outcome (collider)?  
  2. **Version 2 (Mediator)**: Report the **overall effect** for program evaluation. Use stratum-specific effects only to explore mechanisms (e.g., "For equally motivated patients, therapist skill matters").  
  3. **Version 3 (Collider)**: Discard subgroup results. Re-analyze without conditioning on post-outcome variables.  
  4. **Hybrid Cases**: Collect baseline confounder data (e.g., patient motivation at intake). If impossible, acknowledge ambiguity: "The program improves outcomes partly by boosting exercise, but we can’t quantify how much."

  You’ve hit on a deep issue: **Simpson’s Reversal is a statistical pattern with multiple causal identities.** The "table looks the same" because statistics is blind to time and arrows. The carving you seek is in the causal graph—not the contingency table.
