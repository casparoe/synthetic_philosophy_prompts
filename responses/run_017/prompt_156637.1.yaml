  Therefore, Rule X would lead to refusing to apply section 7 retroactively.

  But let's consider alternatives:

  **Rule Y (more Hartian)**: Focuses on the rule of recognition: a rule is valid if it is enacted by the proper authority and published. Then:

  - Marrin: valid.
