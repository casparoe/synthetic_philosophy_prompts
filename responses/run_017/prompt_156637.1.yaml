  - Old Mill: valid? Because it was properly enacted and published. But the court held it invalid. So Rule Y alone doesn't explain Old Mill.

  **Rule Z (Fuller with a touch of Hart)**: Requires Fuller's principles, but in Marrin they explicitly reject using substantive wickedness. So only the internal principles (procedural natural law) are required. This is Rule X as above.

  Thus, Rule X (Fuller's internal principles) is the best fit.

  Now, what does the court have to admit out loud in Verrine?
  - They must say that Decree 14 was valid at the time Verrine acted (per Marrin and Rule X).
  - They must say that retroactive criminalization is invalid (per Dolman).
  - They must reject the recital in section 2 that Decree 14 was void ab initio because that would be using substantive wickedness to invalidate, which they rejected in Marrin.

  So the opinion might say: "While we abhor the actions compelled by Decree 14, we cannot by judicial fiat declare it void ab initio when it met the conditions of law at the time. Nor can we countenance the retroactive creation of a crime for acts that were then lawful. The defendant acted under the color of law, however repugnant that law may now seem. To punish him now would be to violate the very principles of legality that we have upheld in our prior decisions, including Dolman."

  But note: Verrine had the option to request a transfer (though requests were routinely refused) and refusal meant dismissal and conscription. So he was under duress. But the court in Marrin upheld a conviction for a private remark under a nasty law without mentioning duress. So duress might be a defense on the merits, but the court is deciding on the validity of the law and the retroactivity.

  Now, the extra boxcar: this was not required by the decree. So the court might say that the extra boxcar was not compelled by law and therefore Verrine could be prosecuted for that part? But the charge is for organizing the transport, and the entire transport (with the extra boxcar) is the act. The prosecution might not have charged the extra boxcar separately. Alternatively, the court might hold that the entire prosecution is barred by retroactivity because the act of organizing the transport was required by law, and the addition of an extra boxcar was a minor discretionary act that doesn't change the core illegality under the new law? But that seems weak.

  Alternatively, the court might rule that section 7 cannot be applied retroactively to the act of sending the train (which was required) but might be applicable to the extra boxcar? But the statute doesn't make that distinction. So the entire charge might fail.

  Therefore, the ruling would be to refuse to apply section 7 to Verrine.

  Now, which of the five prior rulings is doing the most work? Arguably, Marrin and Dolman. Marrin establishes that a wicked but formally valid law is still law, and Dolman establishes that retroactive laws that upset expectations are invalid.

  Now, for a future case in chapter 22 to force the rules apart:

  We are asked for a defendant whose act was purely ministerial, done early in the Council, with nothing discretionary.

  Example: A clerk who, under a published and clear Emergency Decree, typed up and filed a list of names of people to be arrested. The decree required the list to be made and filed. Now, under the Transitional Justice Statute, section 7 criminalizes "compiling lists for the purpose of arrest and detention in the camps." The clerk argues: (1) the act was purely ministerial, (2) done under a valid law at the time, and (3) without any discretion.

  Under Rule X, the court would likely refuse to apply section 7 retroactively because the act was legal at the time. But what if we want to force a distinction? We could have a situation where the clerk went beyond the decree? But the prompt says "purely ministerial, done early in the Council, with nothing discretionary."

  This case would be similar to Verrine, but without the extra boxcar complication. It would reinforce the retroactivity principle.

