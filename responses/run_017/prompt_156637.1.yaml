  ### **Future Case for Chapter 22: Forcing the Rules Apart**
  **Case:** *Prosecutor v. Eamon*  
  - **Facts:** Eamon was a low-level clerk in the Council’s Bureau of Identification. In Month 3 of the Emergency (early, stable period), he processed identity cards under **Emergency Decree 6**, which required tagging cards of dissidents with a visible symbol. Decree 6 was published, clear, and prospective. Eamon had **no discretion**; he applied the symbol to every card matching state criteria. The TJS §5 criminalizes "designing or implementing systems to identify persons for persecution." Eamon argues he acted ministerially under valid law.  
  - **Why It Forces a Split:**  
    - **Rule H** (Formal Validity): Decree 6 was valid law when Eamon acted (published, clear, prospective). TJS §5 is retroactive → **REFUSE** to apply it. Eamon is immune.  
    - **Rule F** (Legality Principle): Decree 6 met all criteria → valid at the time. But Fuller’s "congruence" principle (official action must match written rules) might be tested if Eamon’s bureau secretly expanded the criteria. If uncovered, Rule F could invalidate Decree 6 *as applied* → **APPLY** §5 if the system was functionally deceptive.  
  - **Dramatic Potential:** Eamon is a sympathetic defendant (powerless, following orders). Rule H protects him; Rule F might not if the system was corrupted. This exposes Rule F’s focus on real-world function vs. Rule H’s formalism.  

