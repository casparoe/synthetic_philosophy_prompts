prompt: |-
  I sit on a committee that reviews the clinical risk-prediction tools used across a large hospital system, and over about four years of these reviews I have kept encountering the same shape of disagreement, for which I have no word.

  Two instances. A patient is being considered for a cardiac procedure. The model everyone accepts as well-calibrated puts the chance of a serious complication at 6%. One surgeon says the patient is 78, and that among 78-year-olds with this comorbidity profile the rate is 11%. Another says the patient is a lifelong distance runner with exceptional functional capacity, and that in that subgroup the rate is 3%. Nobody disputes anyone's figures. The disagreement is about which of several true statements about different groups is the one that should govern this one patient.

  Second instance. A tool estimates the probability that a discharged patient will be readmitted within thirty days. The same patient can be placed under patients discharged from this service, patients with this diagnosis, patients living alone, or patients with this diagnosis living in this postal district. Each grouping is one the data genuinely supports, the groupings cross-cut one another rather than nesting neatly, and the resulting number varies by a factor of two or more depending on which is used.

  What interests me is not the multiplicity itself but a further feature I have come to expect. Which grouping a speaker reaches for tracks what the number is going to be used for. When the number will be used to justify withholding an intervention, speakers reach for the broadest available grouping and emphasize that this is what the population-level evidence supports. When the number will be used to justify overriding what a patient has said she wants, the same speakers reach for the finest-grained grouping they can construct and emphasize that this is an individual judgment rather than a statistic. The move is made in the open, is not regarded as dishonest by anyone in the room, and is not dissolved by gathering more data, because refining a grouping until it is genuinely tailor-made eventually leaves a group of one, where the frequency carries no information at all.

  Is there an established concept for this configuration: the simultaneous availability of several admissible comparison groups for a single case, together with the sensitivity of the choice among them to the decision the number feeds and to the argumentative work the number is needed to do? I know there is a literature on the difficulty of getting from frequencies in a group to a probability for an individual case, and I have seen Simpson's paradox invoked loosely in this vicinity, but neither seems to capture the second feature, the shift in preferred grain with argumentative purpose. If the established notion is narrower than what I have described, I want to be told precisely where it stops and which nearby notion does the most work on the remainder; if there is no name for it, I would rather have a careful definition with boundary cases than a label. Three things I specifically want distinguished: how this differs from ordinary cherry-picking of subgroups, where the alternatives are concealed rather than displayed; how it differs from a plain reversal under partitioning, where both numbers are simply correct and there is nothing more to say; and whether there is a version of the move that is entirely legitimate — say, a case where shifting the grain of the grouping between a budgeting decision and a bedside decision is exactly what one ought to do, rather than a failure.
reasoning: |-
  Okay, the user is on a committee that reviews clinical risk-prediction tools and has noticed a recurring pattern. They describe situations where multiple valid subgroup probabilities exist for a single patient, and the choice of which subgroup to use depends on the argumentative purpose—like justifying withholding treatment versus overriding patient preferences. The user wants to know if there's an established concept for this.

  First, I need to understand the core issue. It's not just about having different subgroups but how the selection is influenced by the decision context. The user mentions that this isn't cherry-picking because alternatives are openly presented, and it's not Simpson's paradox where the direction reverses. They also want to know if there's a legitimate version of this practice.

  I recall concepts like the reference class problem from philosophy, especially by Hans Reichenbach and Frank Knight. That's about choosing a reference group for probability assignment. Then there's inductive risk in science, where values influence decisions under uncertainty. Douglas and Rudner's work here might connect. Also, framing effects in decision theory, where how options are presented affects choices. Kahneman and Tversky's prospect theory could be relevant.

  The user wants distinctions: how this differs from cherry-picking (open vs. hidden), Simpson's paradox (aggregation vs. subgroup shift), and if a legitimate version exists. For legitimacy, maybe resource allocation vs. individual care decisions—broader groups for policies, finer for individual consent. 

  I should synthesize these ideas. The reference class problem is central, but the argumentative purpose adds a layer of value-laden choice. Terms like "motivated subgroup selection" or "contextual reference class assignment" might not be standard, so explaining the components is key. Highlighting the openness and the role of decision stakes in choosing grain size. 

  Also, addressing the user's need for precise boundaries. They’re looking for a conceptual framework to articulate this in committee discussions, possibly to develop guidelines. Emphasizing that while the choice is value-driven, transparency and avoiding bad faith are crucial. Maybe suggesting procedural responses like requiring explicit justification for subgroup selection in different contexts.
answer: |-
  Based on your detailed description, there isn't a single, universally established term capturing *all* facets of this phenomenon. However, the core issue is a profound philosophical and practical challenge in probability and decision-making, often discussed under several related concepts. The closest established notions and how they map to your observations are:

  1.  **The Reference Class Problem (RCP):** **This is the foundational concept.**
      *   **Definition:** Formulated by philosophers like Hans Reichenbach and later Frank Knight and John Maynard Keynes, the RCP asks: "To which reference class (group) should we assign an individual to determine the probability of an event for *that individual*?" when multiple valid, non-identical reference classes exist.
      *   **Fits:** Perfectly captures the "simultaneous availability of several admissible comparison groups for a single case." Your cardiac (age vs. fitness) and readmission (service vs. diagnosis vs. living situation vs. postal code) examples are textbook RCP. The RCP highlights that *any* assignment of a single-number probability to an individual inherently involves a choice of reference class; there is no single "true" probability independent of this choice.
      *   **Distinguishes from Simpson's Paradox:** RCP focuses on the *choice* of group for an individual *given* the group probabilities. Simpson's Paradox shows how aggregate data can mislead by hiding associations visible only in subgroups. While both involve grouping data, RCP is fundamentally about the ambiguity in *applying* group statistics to an individual.
      *   **Distinguishes from Plain Reversal:** RCP acknowledges that *all* presented group probabilities might be "correct" (well-calibrated) for their respective groups; the disagreement isn't about the number itself, but about which group is *relevant* for *this* individual in *this* context.

  2.  **Inductive Risk & Value-Ladenness of Science:**
      *   **Concept:** (Hempel, Rudner, Douglas) Scientific inferences and choices about evidence often involve non-epistemic values, especially when decisions have consequences. Choosing what counts as sufficient evidence, acceptable uncertainty, or the "right" level of analysis involves judgments influenced by the potential costs of being wrong (false positives/false negatives).
      *   **Fits:** Explains the "sensitivity of the choice... to the decision the number feeds and to the argumentative work." When withholding an intervention, the cost of a false negative (missing someone who needs it) is high, motivating a broader class (higher "risk" number) to justify caution. When overriding autonomy, the cost of a false positive (overriding someone who wouldn't have had the bad outcome) is high, motivating a finer class (lower "risk" number) to justify the intrusion. The choice of reference class becomes a value-laden decision driven by the consequences of the action the probability justifies.
      *   **Distinguishes from Cherry-Picking:** Cherry-picking involves *suppressing* conflicting evidence or subgroups. Here, alternatives are often acknowledged ("Nobody disputes anyone's figures"), but the *weight* or *relevance* assigned to a *specific* reference class is influenced by the desired outcome of the *decision*, driven by the asymmetric costs of error. It's selective *emphasis* based on inductive risk, not necessarily *concealment*.

  3.  **Framing Effects in Decision Theory:**
      *   **Concept:** (Tversky & Kahneman) How information is presented (framed) can significantly influence choices, even if the underlying facts are identical.
      *   **Fits:** Choosing a broad reference class ("6% population risk") frames the decision one way (emphasizing population evidence, justifying caution/resource allocation). Choosing a fine-grained reference class ("3% for elite runners") frames it another way (emphasizing individual factors, justifying personalized action/overriding general rules). The *same patient* is framed differently by the choice of reference class.

  **Synthesizing the Phenomenon:**

  Your observation describes **"Value-Laden Reference Class Selection driven by Inductive Risk"** or **"Purpose-Driven Granularity Selection."** It is the RCP made operational in high-stakes clinical decision-making, where the choice among equally valid reference classes is systematically influenced by:
  *   **The Argumentative Goal:** Justify intervention vs. justify non-intervention/autonomy-override.
  *   **The Asymmetric Costs of Error:** The differing consequences of false positives and false negatives inherent in the decision context.
  *   **The Need for Legitimation:** Using the "broadest" (population-level evidence) or "finest-grained" (individualized judgment) reference class provides rhetorical force perceived as legitimate within the clinical discourse, even when the underlying ambiguity (RCP) is recognized.

  **Distinguishing Features & Boundaries:**

  1.  **vs. Ordinary Cherry-Picking:**
      *   **Key Difference: Transparency & Validity.** Cherry-picking involves *hiding* contradictory data or selecting subgroups *invalidly* (e.g., p-hacking, data dredging). Your phenomenon involves selecting *valid, pre-existing, acknowledged* reference classes. The alternatives are often *displayed* ("One surgeon says... Another says..."), and the disagreement is about *which valid class is most relevant/applicable*, not about the truth of the group statistics themselves. The "bias" comes from the *systematic pattern* of selection driven by the decision goal, not from invalid data manipulation.

  2.  **vs. Plain Reversal under Partitioning:**
      *   **Key Difference: The "Something More to Say".** In a simple reversal (e.g., overall mortality higher in Group A, but lower in every subgroup), both numbers are correct, and the takeaway is often caution about interpreting aggregates. Here, both/all subgroup numbers are correct *and* relevant contenders for application to the individual. The "something more" is the *necessity to choose one* to act upon (treat/don't treat, discharge plan A vs B, override autonomy/don't override) *and* the observation that this choice *isn't random*; it maps predictably to the argumentative purpose and the inductive risks involved. The focus shifts from paradox resolution to *decision justification* under ambiguity.

  3.  **Is There a Legitimate Version? Absolutely.**
      *   **Resource Allocation vs. Individual Consent:** Using a broad reference class (e.g., overall service readmission rate = 15%) is appropriate for *system-level decisions* like budgeting for post-discharge support programs or setting general eligibility thresholds for interventions. Using a finer-grained class (e.g., diagnosis + functional status + social support = 5%) is appropriate for *individual shared decision-making* at the bedside, discussing risks/benefits with *this* patient and respecting their preferences.
      *   **Decision Context Dictates Relevant Risk:** The "relevant" risk *should* shift based on the decision. For a population-level guideline recommending *routine* use of a costly/scarce intervention, a broad class showing significant benefit is crucial. For deciding if the *harms* of that intervention outweigh the *benefits* for *this specific patient* who values avoiding those harms highly, the finest-grained applicable risk estimate (even if uncertain) is more relevant.
      *   **Legitimacy Depends on:**
          *   **Transparency:** Acknowledging the RCP and the existence of other probabilities.
          *   **Justification:** Explaining *why* a particular reference class/granularity level is chosen *for this specific decision context* (e.g., "For deciding whether this scarce resource should be offered to all similar patients, we use the broad class X. For discussing whether Mrs. Jones *personally* wants it, we focus on the finer class Y most reflective of her unique factors Z.").
          *   **Good Faith:** Choosing the grain based on a genuine assessment of the decision context and inductive risks, *not* solely to pre-determine the desired outcome. The systematic pattern you observe suggests this line is sometimes crossed, moving from legitimate context-dependent choice towards motivated reasoning to support a predetermined conclusion ("I want to withhold, so I'll use the broad class"; "I want to override, so I'll use the fine class").

  **Conclusion:**

  The core ambiguity is the **Reference Class Problem (RCP)**. The systematic pattern of selection based on argumentative purpose is driven by **Inductive Risk** and leverages **Framing Effects**. There is no single perfect term, but **"Purpose-Driven Reference Class Selection"** or **"Value-Laden Granularity Choice in the Face of the Reference Class Problem"** captures the essence. It differs from cherry-picking by involving valid, transparent alternatives, and from simple reversal by requiring a choice for action influenced by decision stakes. Crucially, **shifting the grain *can* be entirely legitimate** when driven by the genuine informational needs of fundamentally different *types* of decisions (population policy vs. individual care). The ethical concern arises when the shift appears designed primarily to justify a predetermined action rather than to inform the best decision *for the context*. Your committee's challenge is fostering awareness of the RCP and developing norms for transparently justifying reference class choices based on the specific decision task and its associated inductive risks.
