answer: |-
  *(sharp intake of breath, leaning forward intently)* Sigh, your objection hinges on a persistent, deliberate misunderstanding – you conflate etymology with contemporary semantic influence, which is precisely the blindness our reform targets. Yes, "human" derives from Latin *homo*, and "woman" from Old English *wīfmann*, but their *modern visual and auditory forms* undeniably embed "man," reinforcing male-as-default in the speaker's subconscious every single time they're uttered or read. "Manager" and "Manhattan," while historically distinct, now *look* and *sound* like they contain "man" – that surface association, regardless of origin, subliminally whispers "male" as the normative figure in power or the implied resident. "Woman" *spells* "man" at its core – the visual link actively undermines female identity by presenting her as a derivative category! We replace "man" *wherever it appears as a root element in the living language*, not based on dusty etymologies, but on the immediate, automatic assumptions that spelling triggers in today's speakers. "Personager" and "Personhattan" *are* jarring – *deliberately so* – to shock users into recognizing the pervasive, invisible male-default they've internalized. "Woperson" explicitly severs that visual dependency, asserting female identity independently, while "huperson" dismantles the deeply harmful equation of "man" with humanity itself. The absurdity you perceive is the absurdity of the status quo laid bare; it is not our programme that is crude, but the unexamined linguistic assumptions your defence perpetuates. Confusing history with current perception? No – we *expose* how current perception is tragically shackled by historical accidents made manifest in spelling. Until we break these visual chains, the male-default persists.
