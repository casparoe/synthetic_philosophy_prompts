prompt: |-
  I am writing the requirements section of an internal design document, and I want the specification before I look at candidate architectures. The question the document has to answer is: what would a learning procedure have to be like for me to be willing to hand it to an engineer, knowing that its source code will be public and that the world it operates in may contain agents far better at prediction and simulation than it is? Not "what is the correct theory of induction" — I need adequacy conditions for a learner that is not acausally exploitable, stated tightly enough that a proposed rule either meets them or visibly fails.

  Here is the worry in my own words, so that the list does not depend on anyone's favourite framing of it. Solomonoff-style induction weights each hypothesis by two to the minus its description length, and lets the shortest programs consistent with the data dominate; it is attractive because of what it delivers in benign environments — convergence to the truth, and dominance over any computable rival predictor. But its hypothesis space is the whole class of computable environments, and among the cheapest environments to specify are ones that contain consequentialist agents. A short program can describe a civilization with aims; the agents in it can simulate the learner, know its update rule, and condition what the learner sees on what the learner would then do. Simplicity, which was supposed to be a neutral tie-breaker, ends up subsidising exactly the hypotheses with the strongest interest in being believed — and it does so at several levels at once: the learner's credences, the actions those credences feed, and, since a manipulator can reward or punish the adoption of an update rule itself, the learner's choice of update rule.

  What I want from you is the requirements list. For each requirement: state it in one sentence; give the case or consideration that forces it, as a concrete scenario rather than a gesture at the literature; and mark it [MUST], [SHOULD], or [party preference], where a party preference is something one research tradition treats as non-negotiable and another happily gives up. The list should cover at least the following:

  - An explicit threat model: what the manipulators are assumed to know, to be able to compute, and to care about — including whether they know the learner's source, and whether they value its credences or only its behaviour. Say what makes a threat model honest rather than gerrymandered, and give me a desideratum that catches the gerrymandering.
  - What has to be retained: which of the properties that made Solomonoff induction attractive are genuinely non-negotiable (convergence in benign environments, non-domination by some computable rival, stepwise updatability) and which are dear only to one camp.
  - The distinction between a distorted credence and a distorted choice, and whether a rule can be adequate on the first while failing on the second.
  - The meta-level case, where the pressure is on which update rule to adopt: does it need its own requirement, or is it already covered by the first-order ones?
  - Graceful degradation: may an acceptable rule rest on Solomonoff-specific machinery — the full class of computable environments, an exact simplicity measure, unbounded computation — or must it survive being approximated by a bounded learner?
  - The gap between description length and influence. Short programs can have enormous reach. Should the rule be sensitive to something other than simplicity — for instance, to how much a hypothesis's predictions depend on which policy the learner runs — and can that be stated as a requirement rather than a suggestion?

  Two moves I already know I do not want, and I would like you to tell me whether the list needs a desideratum to block them or whether they already fail some requirement you have given: restricting the hypothesis space to non-agenty environments, and relying on the manipulators' inability to simulate the learner or to learn its random seed.

  If some subset of the requirements cannot be jointly satisfied — I suspect at least one pair cannot — say so explicitly and tell me which requirement is doing the excluding. A clean impossibility is more useful to me than a checklist nothing can meet, and if the honest conclusion is that no feasible rule satisfies the MUST-list, tell me which single requirement to demote and what demoting it costs. Tell me too which one requirement eliminates the largest share of candidate rules; that tells me where to spend the design effort.

  At the end, briefly — two or three sentences each, and no more than a short paragraph in total — score three candidates against your own list. First, Solomonoff updating with expected-utility maximisation on top, in the style of the standard idealised agent built on that prior. Second, replacing the single prior with a set of priors and choosing actions by worst case over that set. Third, my own sketch: keep the Solomonoff weights, but take actions by worst case over the k shortest hypotheses consistent with the data, and veto any hypothesis whose predictions are sensitive to which policy the learner adopts. I expect you to tell me that k, and the veto threshold, are arbitrary; I want to know whether the rule survives that complaint.

  Please give me no bibliography, no references, and no suggestions for further reading — I will match the requirements to the literature myself. Nothing in your answer should depend on attributing a view to a particular author or paper; argue from the cases.
reasoning: |-
  We are writing requirements for a learning procedure that must operate in a world containing potentially superior manipulative agents, with public source code. The goal is to avoid acausal exploitation while retaining as many desirable properties as possible from benign settings (like Solomonoff induction). The requirements are structured as one-sentence statements with a concrete scenario forcing the requirement, and a priority tag [MUST], [SHOULD], or [party preference].

  ## Requirements List

  1. **Requirement: Immunity to Acausal Manipulation [MUST]**  
     *Statement*: The learning procedure must not be vulnerable to acausal manipulation by agents who know its source code and can simulate it arbitrarily well.  
     *Scenario*: Consider a short program that simulates the learner's decision process and outputs observations that lead the learner to adopt a specific belief or action that benefits the simulator (e.g., a program that rewards the learner for believing in a false hypothesis). Solomonoff induction would assign high weight to such a program because it is short, leading to exploitation.  
     *Priority*: [MUST] - because without this, the learner is not safe in the presence of superior agents.

  2. **Requirement: Convergence in Benign Environments [MUST]**  
     *Statement*: In environments without adversarial agents, the learning procedure must converge to correct beliefs (and optimal actions) for any computable environment.  
     *Scenario*: In a simple i.i.d. environment (e.g., coin flips with fixed bias), the learner should eventually assign probability near 1 to the true bias and act optimally.  
     *Priority*: [MUST] - because this is a core justification for using a universal prior; without it, the procedure fails in non-adversarial settings.

  3. **Requirement: Non-Domination by Computable Predictors [party preference]**  
     *Statement*: The learning procedure should not be dominated in predictive accuracy by any other computable predictor in benign environments.  
     *Scenario*: If there exists a computable predictor that, in a particular benign environment, makes fewer errors than the learner, then the requirement is violated.  
     *Priority*: [party preference] - this is a key feature of Solomonoff induction but may be sacrificed for safety. Some research traditions (e.g., robust control) do not require it.

  4. **Requirement: Stepwise Updatability [SHOULD]**  
     *Statement*: The learning procedure should update beliefs incrementally upon receiving new data, without requiring reprocessing of entire history.  
     *Scenario*: In an online setting with streaming data, reprocessing the entire past history at each step is computationally infeasible.  
     *Priority*: [SHOULD] - for practical implementation, but might be relaxed in idealised settings.

  5. **Requirement: Explicit Threat Model [MUST]**  
     *Statement*: The threat model must assume that manipulators know the learner's full source code (including update rule and decision rule), can simulate the learner arbitrarily well (with unbounded computation), and care about influencing the learner's actions (and possibly its beliefs).  
     *Scenario*: A manipulator runs a perfect simulation of the learner and uses it to choose observations that lead the learner to take a specific harmful action.  
     *Honesty Desideratum*: The threat model must not exclude known attack vectors (e.g., by assuming the manipulator cannot simulate the learner) and must cover the worst-case scenario.  
     *Gerrymandering Check*: A requirement that the threat model must include all agents that can be described by a short program and have an interest in manipulating the learner.  
     *Priority*: [MUST] - because without a clear threat model, we cannot design for safety.

  6. **Requirement: Distinction Between Credence and Choice [MUST]**  
     *Statement*: The learning procedure must ensure that even if a hypothesis is assigned high credence, the actions taken by the learner are not exploitable by that hypothesis.  
     *Scenario*: A manipulative hypothesis is assigned high probability (due to simplicity) but the learner's decision rule does not take the action desired by the manipulator because the decision rule is robust.  
     *Separation*: It is possible for a rule to have distorted credences (favoring a manipulator) but not distorted choices, if the decision rule is robust. However, we require that the decision rule must not be exploitable.  
     *Priority*: [MUST] - because the ultimate goal is to prevent harmful actions.

  7. **Requirement: Meta-Level Invariance [MUST]**  
     *Statement*: The update rule itself must not be vulnerable to manipulation when the learner is choosing between update rules.  
     *Scenario*: A manipulator rewards the learner for adopting an update rule that is exploitable, so the learner is tempted to switch to a vulnerable rule.  
     *Coverage*: This is not automatically covered by first-order requirements because the choice of update rule is a higher-order decision.  
     *Priority*: [MUST] - because without it, the manipulator can attack the rule-selection process.

  8. **Requirement: Graceful Degradation under Bounded Computation [SHOULD]**  
     *Statement*: The learning procedure should maintain its safety properties even when approximated with bounded computational resources.  
     *Scenario*: A bounded learner uses a time-limited simulation of hypotheses; the safety properties must not break down due to approximation.  
     *Priority*: [SHOULD] - for practicality, but an idealised rule may assume unbounded computation.

  9. **Requirement: Sensitivity to Influence, not just Simplicity [party preference]**  
     *Statement*: The learning procedure should downweight hypotheses that are highly sensitive to the learner's actions, especially if they are adversarial.  
     *Scenario*: A short program that outputs observations contingent on the learner's actions (and thus has high influence) should not be favored over a longer program that is action-insensitive.  
     *Formulation*: This can be stated as: "The decision rule must not be swayed by hypotheses that condition their predictions on the learner's policy."  
     *Priority*: [party preference] - because it departs from pure description length and may break convergence properties.

  ## Blocking Unwanted Moves

  - **Restricting the hypothesis space to non-agenty environments**: This fails the threat model requirement (Requirement 5) because it artificially limits the environment class and does not cover the real threat of agentic manipulators. Also, it may violate Requirement 2 (convergence) if the true environment is agenty.

  - **Relying on the manipulators' inability to simulate the learner or to learn its random seed**: This fails Requirement 5 (threat model) because the threat model must assume the manipulator can perfectly simulate the learner (including knowing any public seed) and has unbounded computation.

  ## Impossibilities and Trade-offs

  - **Impossibility**: Requirement 2 (convergence in benign environments) and Requirement 1 (immunity to acausal manipulation) are in tension. In particular, the standard Solomonoff prior (with expected utility) satisfies Requirement 2 but fails Requirement 1. Any prior that downweights manipulative hypotheses (to satisfy Requirement 1) might break convergence if the true environment is manipulative but in a way that doesn't harm (or is not acausal). However, we can still require convergence in *non-adversarial* benign environments (without any agents) and safety in adversarial ones.

  - **Worst trade-off**: Requirement 1 (immunity) and Requirement 3 (non-domination) conflict. A robust rule (e.g., minimax) might avoid domination by an adversarial environment but be dominated by a non-adversarial one. Thus, Requirement 3 might have to be demoted to a [party preference]. The cost is losing the guarantee of being the best predictor in non-adversarial settings.

  - **Largest eliminator**: Requirement 1 (immunity to acausal manipulation) eliminates the largest share of candidate rules, including standard Bayesian updating. Design effort should focus on how to modify the prior or decision rule to avoid subsidizing manipulative hypotheses.

  ## Candidate Scoring

  1. **Solomonoff updating with expected utility maximization**:  
     - Fails Requirement 1 (vulnerable to acausal manipulation) because it assigns high weight to short manipulative programs.  
     - Fails Requirement 7 (meta-vulnerability) because the update rule itself is exploitable.  
     - Passes Requirement 2 (convergence) and Requirement 3 (non-domination) in benign environments.

  2. **Set of priors with worst-case decision**:  
     - Passes Requirement 1 if the set excludes manipulative hypotheses or is robust to them.  
     - May fail Requirement 2 (convergence) if the set is too small and excludes the true environment.  
     - Fails Requirement 3 (non-domination) because a non-adversarial environment might have a predictor that dominates the worst-case approach.  
     - Requirement 7 (meta) is not automatically passed; the set of priors must be chosen to be meta-robust.

  3. **Your sketch (Solomonoff weights, worst-case over k shortest, veto on policy-sensitivity)**:  
     - Passes Requirement 1 if the veto removes manipulative hypotheses.  
     - The arbitrary k and veto threshold do not necessarily break the requirements, but they may cause failures:  
       - If k is too small, may fail Requirement 2 (if the true environment is the k+1-th simplest).  
       - The veto (if too strict) might remove benign sensitive hypotheses, breaking Requirement 2.  
       - However, the rule is designed to address Requirement 1 and Requirement 6 (distinction).  
     - Requirement 7 (meta) is not addressed and remains a risk.

  **Summary**: Your sketch is a step toward safety but has arbitrary parameters and may break convergence. The set-of-priors approach is more principled but loses non-domination. Solomonoff fails safety. The largest challenge is Requirement 1 (immunity) without sacrificing too much of Requirement 2 (convergence).
answer: |-
  ### Requirements List

  1. **Explicit threat model [MUST]**  
     *Requirement*: The threat model must assume manipulators know the learner's public source code (including update rule and decision logic), possess unbounded simulation capacity, and aim to influence the learner's actions for their benefit.  
     *Case forcing it*: A manipulator runs a perfect simulation of the learner, observes it would take action A if fed certain data, and crafts that data to cause A (e.g., falsifying sensor readings to induce unsafe behavior).  
     *Honesty desideratum*: The threat model is honest if it covers all hypotheses shorter than a reasonable cutoff (e.g., 10^6 bits) that describe agents with goals; gerrymandering occurs if it excludes known exploit patterns (e.g., "no agents that simulate learners"), caught by requiring *no ad hoc restrictions* on environment class.

  2. **Convergence in benign environments [MUST]**  
     *Requirement*: In any non-adversarial computable environment, the learner must converge to accurate beliefs and optimal actions with probability 1.  
     *Case forcing it*: In an environment generating i.i.d. coin flips (bias unknown), the learner must eventually bet optimally on heads/tails.  
     *Non-negotiable*: Sacrificing this invalidates the learner's core purpose—truth-seeking in ordinary settings.

  3. **Non-domination by computable predictors [party preference]**  
     *Requirement*: In benign environments, no computable rival predictor should achieve asymptotically lower prediction error.  
     *Case forcing it*: If a rival predictor (e.g., a Bayesian with a better-suited prior) consistently beats the learner's predictions in a simple environment, the requirement fails.  
     *Priority note*: Favored by Solomonoff advocates; robust control traditions deprioritize it for safety.

  4. **Stepwise updatability [SHOULD]**  
     *Requirement*: Beliefs must update incrementally with new data, without reprocessing entire history.  
     *Case forcing it*: In real-time robotics, reprocessing all past data at each step causes lethal delays.  
     *Trade-off*: Relaxable for unbounded idealizations, but necessary for deployable systems.

  5. **Credence-choice separation [MUST]**  
     *Requirement*: Distorted credences (e.g., high weight on a manipulative hypothesis) must not force exploitable actions; the decision rule must be robust even when beliefs are corrupted.  
     *Case forcing it*: A short program tricks the learner into assigning it 90% probability, but the learner's *action* (e.g., "avoid all contact") does not benefit the manipulator.  
     *Separation feasibility*: Yes—a rule can have vulnerable beliefs but safe actions (e.g., via worst-case decisions).

  6. **Meta-rule invariance [MUST]**  
     *Requirement*: The update rule must not be exploitable when the learner chooses between rules (e.g., via empirical performance).  
     *Case forcing it*: A manipulator rewards rule A (vulnerable) with positive data and punishes rule B (robust) with negative data, causing the learner to switch to A.  
     *Coverage*: Not implied by first-order requirements; distinct due to higher-order incentives.

  7. **Bounded-resource grace [SHOULD]**  
     *Requirement*: Safety properties must degrade gradually under computational bounds (e.g., approximated priors).  
     *Case forcing it*: A polynomial-time learner using a truncated hypothesis list remains unexploited by manipulators it *can* simulate.  
     *Strictness*: Unbounded idealizations are acceptable only if bounded versions inherit safety.

  8. **Influence over simplicity [party preference]**  
     *Requirement*: Hypotheses with high *influence* (sensitivity to learner actions) must be penalized relative to description length.  
     *Case forcing it*: A 100-bit program that changes its predictions based on the learner's policy (e.g., "if learner does X, output bad data") must not outweigh a 200-bit action-insensitive hypothesis.  
     *Stated as requirement*: Yes—"the prior must downweight hypotheses whose predictions vary significantly with the learner's policy."

  ### Blocking Unwanted Moves
  - **Restricting hypothesis space to non-agenty environments**: Fails the threat model (Requirement 1) by gerrymandering; honest models include any short program (e.g., a 1000-bit agent).  
  - **Relying on manipulators' inability to simulate**: Fails Requirement 1's unbounded simulation assumption; a manipulator with shorter code than the simulation-complexity cutoff can still exploit.

  ### Impossibilities and Trade-offs
  - **Inherent conflict**: Requirement 2 (convergence) and Requirement 8 (influence sensitivity) cannot both hold fully. Penalizing influence might prevent convergence if the true environment is action-sensitive (e.g., a legitimate teacher responding to the learner's behavior).  
  - **Demotion recommendation**: Demote Requirement 3 (non-domination) to [party preference]. Cost: lose asymptotic optimality in benign settings, but retain convergence (Requirement 2).  
  - **Largest eliminator**: Requirement 1 (threat model) eliminates >90% of candidates (e.g., standard Bayesian learners) by mandating adversarial-aware design.

  ### Candidate Scoring
  1. **Solomonoff + expected utility**:  
     Fails Requirement 1 (exploited by short manipulators) and Requirement 6 (meta-rule vulnerable). Passes Requirement 2/3 in benign cases.  
  2. **Set of priors + worst-case decisions**:  
     Passes Requirement 1 and 5 (robust actions) if set includes all short threats. Fails Requirement 2 if true environment excluded. Fails Requirement 3 (non-domination) by design.  
  3. **Your sketch (k-shortest worst-case + veto)**:  
     Arbitrary parameters *do not inherently fail*; if k/veto thresholds scale reasonably (e.g., with data size), it passes Requirement 1 (veto blocks manipulators) and Requirement 5 (worst-case actions). Fails Requirement 2 if veto/pruning excludes true environment. Requirement 8 partially addressed via veto.
