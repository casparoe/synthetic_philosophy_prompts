answer: |-
  Here’s the spec for a theory of legitimate secession, built for your purpose: **clarity in fictional application** and **rhetorical force for non-specialists**. The requirements are structured to handle your test cases and expose inherent tensions.

  ---

  ### **Core Purpose of the Theory**
  To provide **morally persuasive principles** (not just legal rules) for deciding when a region's attempt to break away is *justified*, such that:
  1.  **Outcomes feel non-arbitrary:** The theory consistently resolves your specific cases based on its core logic.
  2.  **Arguments feel compelling:** Characters can articulate core principles in plain language that resonates with universal intuitions about fairness, survival, and belonging.

  ---

  ### **Desiderata: What the Theory MUST Deliver**
  *(Non-negotiables in **bold**; gut-level criteria in **bold italics*)*

  1.  **Define the "Self" in Self-Determination:** Who constitutes the group entitled to decide? (Residents? Citizens? An "historic nation"?). Must handle your "recent arrivals" case and "nested secession" case. *(Gut: "You don't get to decide for us just because you moved here yesterday/lived here forever.")*
  2.  **Define the "Territory":** What land can they claim? Does it require contiguity? Why? Must handle your non-contiguous valley/city/corridor case. *(Gut: **"You can't just carve up the map however you like, especially if it traps people."**)*
  3.  **Grounds for Legitimacy:** What justifies breaking the existing state? *Is it solely:*
      *   **Remedy for Injustice?** (Persistent discrimination, exploitation, broken promises). Must handle Catalonia (grievance/money) and rule on pure fiscal cases.
      *   **Expression of Democratic Will?** (A clear majority vote as sufficient reason). Must handle Scotland (negotiated vote) and the 51-49 & mini-secession cases.
      *   **Pre-Existing Nationhood?** (The group is already a distinct "people"). Must handle your "recent arrivals" case and rule on when identity forms.
      *   *(Crucially: The theory must explicitly state its primary ground and how it relates to others.)*
  4.  **Address the Rump State's Vital Interests:** **Must engage with the "survival" objection.** Does the rump state's need for water/port/territorial integrity *ever* override a region's claim? If so, under what conditions? *(Gut: **"You can't just take the port with you and leave us to die."**)*
  5.  **Resolve the "Minority within the Minority" Problem:** **No theory can ignore this.** What happens to groups *within* the seceding region who oppose leaving? Does the theory require/allow internal borders (mini-secession)? Must handle your 70% remain district case and nested secession. *(Gut: **"Don't create new trapped minorities."**)*
  6.  **Specify the Decision Procedure:** **Must answer "Who votes?" definitively.** (Residents only? Including emigrants? Excluding recent arrivals? Only "core" group members?). This is where many theories live or die. Must also specify threshold (simple majority? supermajority?).
  7.  **Distinguish Legitimacy from Recognition & Resistance:** Must clearly separate:
      *   Moral right to secede (theory's focus)
      *   Legal right under current constitution (often irrelevant/opposed)
      *   Right of other states to recognize the new state
      *   Right of the rump state to resist (and *how* it may legitimately resist even a legitimate secession)
  8.  **Provide Knowable Thresholds:** **Legitimacy must be assessable *before* secession is attempted,** based on observable facts (injustice, vote outcome, defined group identity). Cannot rely *primarily* on post-hoc viability of the new state or rump state. *(Gut: "We need to know the rules *before* we play the game.")*

  ---

  ### **Distinctions the Theory MUST Maintain**
  *   **Self-Determination ≠ Secession:** Autonomy/federalism/devolution may satisfy self-determination without justifying full exit.
  *   **Moral Right ≠ Legal Right:** What's morally justified may be illegal; what's legal may be unjust.
  *   **Secession ≠ Dissolution/Annexation/Border Adjustment:** Secession is a *region* leaving an *existing state* to form a *new state*. The theory must explain why its principles apply specifically to this act.

  ---

  ### **Camp Preferences (Often Disguised as Requirements)**
  *   **"Secession ONLY as remedy for injustice"** = Remedial camp preference. (Weak on pure democratic will cases like peaceful Quebec).
  *   **"Democratic majority consent is sufficient"** = Plebiscitary camp preference. (Weak on minority-within-minority & rump survival).
  *   **"Presumption in favor of existing borders"** = Status quo camp preference. (Often leans against secession).
  *   **"Pre-existing national identity required"** = Nationalist camp preference. (Weak on "recent arrivals" or purely economic groups).
  *   **"Must accept/reject purely economic grievances"** = Often reveals core grounding (injustice vs. will).

  ---

  ### **Key Tensions Between Desiderata**
  1.  **Majority Rule vs. Minority Protection:** "Clear Regional Majority Settles It" **(#3 - Plebiscitary)** vs. "No New Trapped Minorities" **(#5)**. A 51% vote *will* create a 49% minority. Can the theory mitigate this without negating the vote? (E.g., requiring supermajorities, internal borders).
  2.  **Knowability vs. Viability:** "Legitimacy Knowable in Advance" **(#8)** vs. "Rump State Survival is Paramount" **(#4)**. The *actual* impact of secession on rump state survival is often uncertain beforehand. Can the theory define "vital interests" clearly enough *in advance*?
  3.  **Defining "Self" vs. Avoiding Arbitrariness:** Defining the voting group **(#1)** is inherently contentious and can feel arbitrary ("Why *this* border? Why *these* voters?"), especially in complex cases (non-contiguous, recent arrivals, nested groups).
  4.  **Remedy vs. Will:** Grounding legitimacy primarily in injustice **(#3 - Remedial)** vs. democratic will **(#3 - Plebiscitary)** leads to *very* different outcomes (e.g., Catalonia vs. Quebec). Can a theory bridge this gap?

  **Most Disqualifying Requirement:** **#4 (Address Rump Survival).** Theories that utterly ignore the existential threat to the rump state (or dismiss it entirely) will feel monstrously unfair to readers and characters defending the rump. It forces hard trade-offs.

  ---

  ### **Very Short Theory Scorecard (Focused on Your Criteria)**
  1.  **Remedial Right Only:** Legitimacy *only* if severe/persistent injustice. *Pros:* Strong on Catalonia-type cases; rules out frivolous/fiscal secession; justifies rump resistance to unjustified attempts. *Cons:* Weak on peaceful, democratic Quebec; struggles with "injustice" definition; ignores democratic will; offers nothing to your 51-49/mini-secession cases except "No".
  2.  **Plebiscitary (Primary Right):** Legitimacy primarily via clear democratic mandate within region. *Pros:* Simple, clear (your "knowability" requirement); handles peaceful Quebec; feels fair ("majority rules"). *Cons:* Ignores injustice/rump survival; creates/minimizes minorities (51-49, mini-secession); struggles defining voting group/territory (non-contiguous, recent arrivals).
  3.  **Nationalist:** Legitimacy requires distinct pre-existing "people/nation" asserting self-determination. *Pros:* Resonates culturally; handles nested secession logically; explains Quebec/Scotland. *Cons:* Arbitrary definition of "nation"; weak on recent arrivals/purely economic groups; ignores procedure/injustice/rump survival unless added.
  4.  **Consequentialist/Aggregative:** Legitimacy based on net outcome (e.g., stability, welfare, peace). *Pros:* Pragmatic; can weigh rump survival/minority protection heavily. *Cons:* Violates "knowability" (#8) – outcomes are unpredictable; can justify oppressive status quo *or* reckless secession; feels cold/unprincipled; "net good" is contested.

  ---

  **The Honest Conclusion:** No theory satisfies *all* desiderata perfectly. The tensions (#8 Knowability vs #4 Rump Survival, #3 Majority Rule vs #5 Minority Protection) are fundamental. **This is genuinely useful:** It means your characters *cannot* "win" the argument purely on unassailable principle. The negotiation scene *should* expose these fault lines – the raw, unresolved conflicts between survival, democracy, identity, and fairness. The force comes from the clash of legitimate, irreconcilable claims, not from a tidy theoretical solution. Focus your dialogue on these core tensions using the gut-level criteria highlighted.
