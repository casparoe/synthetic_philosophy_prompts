answer: |-
  ### (i) Diagnosis: Explanatory Priority Dispute  
  The stalemate arises because the debate conflates two distinct projects: **physical ontology** (what entities physics requires) and **metaphysical explanation** (what structure ultimately grounds temporal facts). Eternalists prioritize a *complete physical inventory*: spacetime and its contents exist simpliciter because physics quantifies over them. Presentists prioritize *metaphysical fundamentality*: only the present is ontologically basic because it grounds temporal experience and change. Both agree on the physics (relativity, cosmic time) and phenomenology but disagree on which project defines "existence."  

  *Reasons*:  
  1. **No factual disagreement**: Neither denies cosmic time or relativistic structure; both can model it.  
  2. **Differential emphasis**: Eternalists demand ontological parsimony with physical theory; presentists demand explanatory primacy for temporal flow (e.g., grounding truthmakers for tense).  
  3. **Stalemate resilience**: Arguments miss each other because eternalists reject fundamentality talk as non-physical, while presentists see eternalism as ignoring "real" temporal dynamism.  
  *Weakness*: This risks making the dispute "merely pragmatic," but the persistence suggests deeper intuitions about explanation.  

  ---

  ### (ii) Strongest Objection to Your Hypothesis  
  Your hypothesis claims "exists" is ambiguous (quantificational vs. fundamental). But the cosmic-time case *refutes* this: even with a privileged foliation, the core disagreement persists.  

  *Objection stated against you*:  
  "If 'exists' were merely ambiguous, a physically privileged 'now' (e.g., cosmic time) *should* resolve the debate by satisfying the presentist’s demand for structure. Yet eternalists would still deny presentism: they’d call the foliation a *physical structure*, not a ground for ontological privilege. They’d argue: 'All events exist, but some are cosmically simultaneous—this is a fact *about* the universe, not what reality "amounts to."' Presentists would retort: 'This slicing *is* the ground of existence—why posit the rest?' The disagreement isn’t verbal; it’s about whether physical structure *suffices* for ontology or whether metaphysics requires an *additional* layer of fundamentality. Cosmic time sharpens, not dissolves, this clash."  

  ---

  ### (iii) Progress: Distinction or Deflation  
  **Progress** requires disentangling the projects:  
  1. **Formalize fundamentality**: Develop a model where "basic existence" (presentism) and "derivative existence" (eternalist past/future) coexist within physics. Example: Use grounding relations to show how tensed truths supervene on a tenseless block *plus* a metaphysically privileged present (e.g., via a "moving spotlight" with cosmic time as the spotlight’s path).  
  2. **Empirical pressure**: If quantum gravity *eliminates* time (e.g., Wheeler-DeWitt equation), presentists must either redefine "present" fundamentally (e.g., via causation) or concede. If it *requires* a foliation (e.g., causal sets), eternalists must explain why this isn’t ontological privilege.  
  3. **Shift the question**: Reframe the debate as "What explains temporal phenomenology?" If both can answer equally well (e.g., eternalism via psychological arrows), the dispute is inert.  

  **Why progress might fail**: The stalemate may reflect irreducible intuitions about "realness." If so, the only resolution is to accept divergent explanatory goals and declare the debate non-substantive—but this requires showing that *no conceivable evidence* could shift adherents, even in principle. Cosmic time tests this: if eternalists dismiss a *fundamental* foliation as "just physics," they reveal a methodological commitment to anti-privilege that transcends empiricism.
