prompt: |-
  My roomate and I spent two hours last night fighting about quantum immortality and I think we were arguing about totally different things, so I want the spec, not the verdict. Write me the desiderata a theory of identity over time has to meet before the quantum-suicide argument can even get off the ground, with the purpose fixed: I want a theory good enough to tell you whether "there's always some branch containing a live survivor" gives you any reason at all. So: the cases it has to get right, each with the consideration behind it. Starter list from me: ordinary death, which shouldn't become mysterious; the partial-hit run where the device fires but leaves a live and badly damaged subject, since the theory has to say whether that damaged subject is the thing whose interests are being weighed; the iterated runs, where after n trials the surviving branch carries amplitude on the order of 2^-n and at some point I want to say it stops being a well-defined person and is just noise swamped by interference from everything else; the amnesia variant, where instead of killing you the device wipes your memory, because a psychological-continuity theory has to say the whole argument collapses there and I want to know if that's a feature or a bug; and the witness case, where a friend watches the whole thing and sees you die, which needs an account of why your evidence and hers come apart without either of you being irrational. Two more constraints: it can't smuggle in collapse, and it can't make ordinary precautions free — if the view says the parachute doesn't matter because you land alive somewhere, call that a reductio. Flag which items are genuine desiderata and which are just one camp's hangups (I suspect "must give a determinate yes/no about whether the survivor is you" is one of those), and tell me whether any two on the list can't be jointly satisfied, because I think that's actually where our argument was. Which single requirement knocks out the most candidates? Then a few lines each, no table, on how the naive any-branch-continues view, a Parfit-style psychological-continuity view, and a branch-weight approach do against it. Keep it short, I just want to know what we were disagreeing about.
reasoning: |-
  Okay, the user is dealing with a complex philosophical debate about quantum immortality. They had a two-hour argument with their roommate and suspect they were talking past each other. They want clarity on the foundational requirements for identity over time that must be in place before quantum suicide arguments can even be evaluated. 

  First, I need to unpack their core request: They're not asking for a verdict on quantum immortality itself, but for the criteria (desiderata) that any theory of personal identity must satisfy to make the quantum suicide thought experiment meaningful. Their purpose is specifically to assess whether "there's always a surviving branch" gives rational reason to believe in personal immortality.

  The user provided a starter list of test cases and constraints. Let me organize these systematically. The key scenarios are: ordinary death (must remain unproblematic), partial-hit survival (is the damaged person still "you"?), iterated trials (when does low amplitude make survival meaningless?), amnesia variant (does psychological continuity matter?), and witness divergence (why different evidence isn't irrational). Constraints include no smuggled wavefunction collapse and no trivializing ordinary risks.

  Hmm... the user also hints at meta-issues: distinguishing genuine desiderata from partisan preferences, identifying irreconcilable conflicts between requirements, and finding which requirement eliminates most theories. That last point might be where their argument with the roommate stalled.

  For theory assessment, they want brief takes on three approaches: naive branch continuation (survivor is always you), Parfitian psychology (continuity of consciousness matters), and branch-weight realism (amplitude as ontological weight). Need to flag where each fails their criteria.

  The user's frustration suggests they're a technically minded person (they use terms like "amplitude" and "interference") but wants to cut through philosophical deadlocks. Their examples show they've deeply engaged with the material - mentioning amplitude decay at 2^-n and witness evidence asymmetry shows sophistication. They're likely in physics/philosophy grad school or adjacent.

  Biggest challenge: Several desiderata seem in tension. For instance, "no trivializing ordinary precautions" directly opposes the naive branch view's implications, while "witness evidence divergence" challenges theories that don't allow subjective/objective splits. The amplitude threshold problem in iterated runs might be the sharpest conflict - any line drawn will feel arbitrary.

  The witness case is particularly thorny. Any theory must explain why first-person evidence ("I survived") and third-person evidence ("I saw you die") can both be rational without contradiction. This probably requires either indexical relativity (centered worlds) or fundamentally different modes of evidence.

  Key insight: The most eliminative desideratum is likely "no risk trivialization" - it immediately sinks naive branching views. Whereas "determinate survival yes/no" might not be essential if we accept fuzzy identity or statistical selves.

  Should structure output as: 1) Core identity criteria derived from their cases, 2) Constraints, 3) Theory report cards, 4) Meta-analysis of tensions. Need to flag where their starter cases map to which principles (e.g. amnesia variant tests psychological continuity necessity).

  Final note: Their closing "I think that's actually where our argument was" suggests the roommate clash centered on whether identity can be vague (iterated runs) or must be binary. That's the pivot - will emphasize that conflict.
answer: |-
  Here are the core desiderata for a theory of identity over time to make the quantum suicide argument coherent and evaluable, based on your cases and constraints. Genuine desiderata (D) are essential for coherence; hangups (H) reflect specific philosophical leanings that *might* be negotiable.

  ### Core Desiderata (Must-Haves)
  1.  **Non-Mysterious Ordinary Death (D):** Must explain why ordinary death (e.g., aging, non-QM accident) definitively ends identity. *Why:* Prevents the argument from implying immortality *everywhere*, trivializing life/death. Fails if parachute risk becomes "free."
  2.  **Survivor Ontology (D):** Must specify what constitutes the "surviving subject" in the branch (e.g., a specific physical/functional state). *Why:* Needed to evaluate *which* entity's perspective/interests matter in the thought experiment. Addresses the "partial-hit" case (is the damaged subject *you*?).
  3.  **Evidence Relativity (D):** Must account for the divergence between the subjective experience of the survivor ("I lived!") and the objective observation of a witness ("I saw you die!") without either being irrational. *Why:* Core to the quantum suicide setup; the argument hinges on first-person evidence.
  4.  **No Smuggled Collapse (D):** Must be consistent with *pure* unitary (no-collapse) QM (e.g., Everettian MWI). *Why:* The argument presupposes branching without definite outcomes until observation.
  5.  **Risk Non-Trivialization (D):** Must not imply ordinary precautions (parachutes, medicine) are pointless because "you survive *somewhere*." *Why:* Preserves the meaning of risk and practical reasoning; avoids reductio.

  ### Test Cases & Potential Hangups
  6.  **Iterated Runs (Threshold Problem) (H/D?):** Needs *some* account of when a branch with extremely low amplitude (~2^-n) ceases to host a "person" whose survival is meaningful *to the original pre-experiment subject*. *Why:* Addresses when "survival" becomes incoherent noise. *Hangup?* Insisting on a *sharp*, determinate threshold might be asking too much (fuzzy boundaries may be inherent). *Desideratum?* Acknowledging the problem and providing *some* principled (even if fuzzy) account is likely needed.
  7.  **Amnesia Variant (Psychological Continuity Test) (H):** Must clarify the role of psychological continuity (memory, personality). *Why:* Tests if identity relies *critically* on psychology. If the argument collapses under amnesia, is that a fatal flaw (bug) or revealing a core feature? *Hangup:* This is often a key differentiator between theories (e.g., bodily vs. psychological continuity). Whether its failure is a *bug* depends on your prior view of identity.
  8.  **Determinate Survival (Yes/No?) (H):** "Must give a determinate yes/no about whether the survivor is you." *Why:* This is a **major hangup**. Many plausible theories (e.g., Parfitian reductionism, fuzzy amplitude thresholds) deny identity is always a binary fact. Insisting on determinacy often favors substance/soul theories or naive branching views, but may be unrealistic in QM branching scenarios.

  ### Key Tensions & The Eliminator
  *   **Biggest Tension:** **6 (Iterated Runs - Threshold) vs. 8 (Determinate Survival).** Theories satisfying 8 (naive branching) fail 6 catastrophically. Theories that handle 6 well (e.g., branch-weight significance) often reject 8.
  *   **The Eliminator:** **5 (Risk Non-Trivialization)** knocks out the most candidates, especially the naive "any branch continues" view. If your theory implies you shouldn't bother with parachutes (because amplitude exists where you survive), it's likely fatally flawed for practical reasoning.

  ### How Theories Fare (Briefly)
  1.  **Naive "Any Branch Continues" View:** Survivor in *any* branch with a living body is "you."
      *   *Fails:* **5 (Risk Trivialization)** - Parachutes don't matter. **6 (Threshold)** - No account; a 1-in-2^100 survivor is still "you." **1 (Ordinary Death)** - Makes ordinary death mysterious/unreal.
      *   *Succeeds?* **8 (Determinacy)** - Yes, always. **2 (Ontology)** - Simple (bodily). **4 (No Collapse)** - Compatible.
  2.  **Parfit-Style Psychological Continuity (PC):** "You" exist as long as there's robust psychological connectedness (memory, intentions, character) to a past self.
      *   *Fails:* **Amnesia Variant (7)** - If the memory wipe severs psychological links, the survivor isn't "you," collapsing the argument (a *bug* for QI proponents, a *feature* for PC). **6 (Threshold)** - Severely damaged survivors may lack sufficient PC. **Evidence Relativity (3)** - Harder to explain why *your* (survivor's) evidence is special if PC is the criterion.
      *   *Succeeds:* **5 (Risk)** - Genuine death is possible (if PC ends). **1 (Ordinary Death)** - Unproblematic.
  3.  **Branch-Weight Significance (BWS):** Identity/survival significance tracks branch weight (amplitude squared). Low-weight branches host less "real" or less "significant" continuants.
      *   *Fails:* **8 (Determinacy)** - Survival is fuzzy/statistical. **Evidence Relativity (3)** - Why does the *survivor's* low-weight perspective feel real *to them*? **2 (Ontology)** - What *is* the survivor in a low-weight branch?
      *   *Succeeds:* **5 (Risk)** - High-risk actions lead to low-weight survival, preserving incentive for caution. **6 (Threshold)** - Provides a framework (fuzzy). **1 (Ordinary Death)** - Compatible (death branch has weight ~1). **4 (No Collapse)** - Compatible.

  ### What You Were Probably Disagreeing About
  Your argument likely centered on the **tension between Threshold (6) and Determinacy (8)**, and potentially the **role of Psychological Continuity (7/Amnesia)**. Your roommate likely favored a view prioritizing determinacy (naive branching or a soul-like view), making QI straightforward but risking trivialization (5). You likely favored a view acknowledging fuzziness (PC or BWS), making QI potentially incoherent or insignificant at low amplitudes but preserving risk (5). The **witness evidence (3)** and **no smuggled collapse (4)** were likely shared ground, while **risk trivialization (5)** was the unbreakable constraint you both agreed must be met, ruling out the simplest QI-friendly views.
