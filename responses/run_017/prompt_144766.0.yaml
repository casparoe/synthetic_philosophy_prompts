prompt: |-
  hey — I'm in a tiny reading group (three econ PhD students, one historian of science, and a philosopher who mostly shows up to say 'that's just underdetermination') and we've spent two sessions stuck on whether a long-run prediction can be 'right but early' instead of just wrong. Everyone keeps grabbing the same tired example — a parson, two growth curves, one of them geometric — and then the argument immediately turns into a fight about whether 20th-century agriculture counts as a rescue or a refutation, which means we just end up arguing about real history instead of about the methodology. So I want a made-up case, invented from scratch, where the verdict isn't already loaded by what actually happened.

  What I need is a scenario built to order, and the specs are these: a small closed grain-growing polity (realistic, nothing science-fictional, no perfect foresight, nobody in the story smarter than their era) and a fictional theorist inside it who makes a *dated, quantitative* prediction that numbers of people will outrun food supply, with a fixed margin and a checkable date — no 'in the long run' hedging, no adjustable horizon, because if the prediction is vague then nothing is being tested. Then: the prediction has to *first fail*, and fail for a reason the theory itself supplies (a check it already names, just working harder than it expected), and *then* the predicted outcome has to arrive later, driven by the theory's own mechanism, once a finite, one-off offset is used up — and the offset has to be something the theorist could in principle have measured and seen running out at the time, not a deus ex machina. My group's first attempt used a one-off shipment of fertilizer and it felt cheap, so the offset needs to be internal to the polity's economy. Now here's the bit I care most about: I want a *decoy*. Put a second theorist in the story who made the numerically identical prediction off a mechanism so loose that any later crisis whatsoever would 'vindicate' it. The case has to be engineered so that a mechanism-first auditor (theory is 'right but early' if the mechanism it named was actually running and would have produced the outcome absent a specifiable exhaustible offset) vindicates theorist one and refuses theorist two, while a strict falsificationist (missed margin by the stated date, no early-clause allowed) kills both, and a research-programme-style auditor (survives only if it predicted something genuinely novel in the interval) splits them some *third* way that isn't just averaging the other two.

  Scenario in one paragraph, then a walkthrough: run all three auditors on both theorists, stating the verdict and the reason for each of the six. After that, I want the honest part — say which single feature of the design is doing the work, what collapses if you remove it (I suspect if the offset isn't visibly exhaustible, the mechanism auditor just becomes the falsificationist again, but tell me), and how a defender of whichever view comes out worst would attack the case as rigged. It'd also help if you'd build in something I've started calling the 'audit horizon': set the test window so that it outlasts every person who was around when the prediction was made, and then tell me what changes if you shrink it so the original theorists are still alive and professionally invested at the audit date. I'm using this for a 20-minute talk where my thesis is that 'right but early' is really a claim about who has standing to declare a theory dead rather than a claim about the world, so anything that just stipulates the verdicts instead of generating them from the three rules is the one thing I can't use.
reasoning: |-
  We are creating a fictional scenario to explore methodological questions about predictions that fail on the stated date but later occur, and how different auditing perspectives (mechanism-first, strict falsificationist, and research-programme-style) would evaluate two theorists who made the same quantitative prediction but based on different mechanisms.

  Scenario:

  In the isolated valley kingdom of Agraria, surrounded by impassable mountains, the population and economy rely entirely on grain production from the valley's fertile soil. The kingdom has a fixed area of arable land, and the primary grain is barley. The population has been growing steadily.

  Theorist One: Malthusius, a scholar of the Agrarian Academy, presents a model in the year 1000. He notes that the population has been growing geometrically (doubling every 50 years) for the past two centuries, while grain production can only be increased arithmetically (by a fixed amount per year) through known methods: clearing small patches of marginal land, improving irrigation, and selective breeding of seeds. He calculates that by the year 1100, the population will reach 1 million, but grain production will only support 800,000. His margin is 200,000. He writes: "By the year 1100, the population will exceed the food supply by at least 200,000, leading to famine and demographic collapse, unless we curb population growth."

  Theorist Two: Doomides, a popular philosopher, also predicts in 1000 that by 1100 the population will exceed the food supply by 200,000. But his reasoning is vague: he cites "the inevitable exhaustion of the land by overuse" and "the wrath of the gods for our hubris." He does not specify a mechanism that can be quantitatively tracked.

  Now, the events:

  - From 1000 to 1075, the population grows as predicted (reaching about 700,000) and grain production also increases. However, in 1075, a group of innovative farmers (the "Deep Plough Movement") develops a new technique: deep ploughing that taps into a previously unknown, extensive but finite layer of nutrient-rich subsoil. This technique is labor-intensive and requires training, but it is adopted widely. It boosts yields per acre significantly. The government invests in training ploughmen and subsidizes the deep ploughs. This offsets the predicted shortfall.

  - By 1100, the population is 950,000, and grain production supports 980,000. So the shortfall predicted by both theorists (200,000) does not occur. In fact, there is a small surplus. Both predictions are false by the strict deadline.

  - After 1100, the deep ploughing technique runs into a problem: the nutrient-rich subsoil layer is finite and begins to deplete. By 1120, the layer is exhausted in the most heavily farmed regions. Yields start to decline. The population, however, continues to grow (reaching 1.1 million by 1125). Grain production in 1125 can only support 900,000. A famine occurs, and the population drops by 200,000.

  Thus, the crisis predicted for 1100 occurs in 1125.

  The offset (the nutrient-rich subsoil) was internal to the polity, finite, and exhaustible. Malthusius's model included the possibility of "improvements in technique" but he considered them temporary and subject to diminishing returns. In his treatise, he wrote: "Any one-off improvement in yields, such as the discovery of a new fertile layer, would only delay the inevitable by the time it takes to exhaust that layer." He did not know about the specific subsoil layer, but his model allowed for such temporary offsets. Moreover, the depletion of the subsoil could have been measured: the depth of the nutrient layer was known to the farmers, and its rate of depletion could have been tracked.

  Doomides, on the other hand, did not specify any such offset. His mechanism was vague and could be "vindicated" by any crisis.

  Now, we run the auditors:

  1. Mechanism-first auditor (focuses on whether the named mechanism was running and the outcome would have occurred absent a specifiable exhaustible offset):
     - Malthusius: Vindicated. His mechanism (geometric population growth vs. arithmetic food growth) was operating. The offset (subsoil) was exhaustible and delayed the outcome. Without it, the crisis would have occurred by 1100. The auditor can point to the fact that the subsoil was known and measurable, and its depletion was the trigger for the eventual crisis.
     - Doomides: Rejected. His mechanism ("exhaustion of the land", "wrath of the gods") was not specific. The actual crisis was due to the depletion of a specific finite resource, not general exhaustion or divine wrath. Moreover, his theory did not specify an offset that could be measured and exhausted.

  2. Strict falsificationist (only checks the prediction at the stated date and margin):
     - Malthusius: Falsified. At 1100, the population was 950,000 and food supported 980,000, so no shortfall of 200,000. The prediction was false.
     - Doomides: Falsified. Same reason.

  3. Research-programme-style auditor (survives only if it predicted something novel in the interval):
     - This auditor looks for novel predictions that were confirmed during the period (1000-1100) or after (until 1125). The key is whether the theory made a novel prediction that was not already known or part of the background knowledge.
     - Malthusius: His theory predicted that without population control, the population would grow geometrically and food arithmetically. During 1000-1100, the geometric growth of population and arithmetic growth of food (without the subsoil) were confirmed. The discovery of the subsoil was an anomaly, but his theory also predicted that such improvements would be temporary. The novel prediction was the pattern of growth and the specific timing (without the offset). However, the timing was off. But note: the theory also predicted that any temporary improvement would be followed by collapse. The occurrence of the collapse in 1125 is a novel prediction that was not made by others? Actually, in the context, the collapse was predicted (though at a different time). However, the research programme might be seen as progressive because it explained the temporary success (by the offset) and then the collapse. Also, it predicted the pattern of growth and the eventual crisis. But the auditor might note that the prediction of the crisis at 1100 was novel and failed, but the general mechanism was still used to explain the later crisis. We need to split the verdict.
       - Let's say: Malthusius's programme is partially vindicated because it generated novel predictions about the growth patterns and the temporary nature of improvements, which were confirmed (the growth rates were as predicted without the offset, and the collapse occurred after the offset was exhausted). However, the exact timing was off. The research programme adapted by incorporating the offset and predicting the collapse after its exhaustion. This adaptation was not ad hoc because the possibility of temporary offsets was already in the original theory. So the programme is progressive and survives.
     - Doomides: His theory made no specific novel predictions. The crisis in 1125 could be claimed as vindication, but it was not a novel prediction in the sense that it was the same as the original (and failed) prediction. There was no novel prediction in the interval. Therefore, his research programme is degenerative and is rejected.

  But we need a split that isn't just the average of the other two. So:

  - Malthusius: Survives. His programme made novel predictions about growth rates and the temporary nature of improvements, which were confirmed. The failure at 1100 was explained within the theory without ad hoc adjustments (the offset was finite and exhaustible, a possibility already included). The eventual crisis was predicted by the same mechanism.

  - Doomides: Fails. No novel predictions, and the crisis in 1125 is only a post-hoc explanation.

  However, to make the split, we can say that the research-programme auditor is looking for novel predictions that were confirmed during the period between the prediction and the original deadline (1000-1100). Then:

  - Malthusius: During 1000-1100, his theory predicted geometric population growth and arithmetic food growth (without the offset). The actual population growth was geometric, but food growth was higher due to the offset. So the population growth prediction was confirmed, but the food growth was not (it was higher). However, the theory allowed for temporary improvements. The novel prediction of a crisis by 1100 failed. So the programme might be seen as having a problem. But the auditor might consider the growth rates as novel and partially confirmed (population) and the possibility of temporary improvements as a background assumption. This is ambiguous.

  Alternatively, we can define the research-programme auditor as focusing on whether the theory predicted a novel fact that was not predicted by rival theories and that was confirmed. In this case:

  - Malthusius predicted the geometric growth of population and the arithmetic growth of food (without improvements). The geometric population growth was confirmed (a novel fact at the time, because others thought population growth was linear). The arithmetic food growth without improvements was not confirmed because of the offset, but the theory also predicted that improvements would be temporary. The collapse in 1125 was not a novel prediction because it was the same as the original prediction, just later. However, during the interval (1000-1100), the theory did predict the growth patterns that were observed (population growing geometrically) and that was novel.

  - Doomides predicted nothing novel.

  So let's set:

  - Malthusius: Survives because his theory predicted the geometric growth of population, which was a novel prediction and was confirmed by 1100. The failure of the crisis prediction is a problem, but the growth pattern was a novel success.

  - Doomides: Fails because no novel prediction.

  But wait, the geometric growth was already observed in the past? Malthusius based his model on past data. So the prediction of continued geometric growth might not be novel. We need a novel prediction.

  Redefine: Malthusius also predicted that without population control, the population would double every 50 years exactly (which it did until 1100) and that without new improvements, food production would increase by a fixed amount per year (say 5000 bushels per year). The food production without the deep ploughing did follow that arithmetic growth until 1075. After 1075, the deep ploughing caused a deviation. But the theory predicted that without improvements, it would be arithmetic. This is a novel prediction? It might be, if no one else had made it.

  Assume that before Malthusius, people thought food production could grow geometrically too? Then his prediction of arithmetic growth was novel. But in 1000-1075, without the deep ploughing, food production did grow arithmetically? Actually, we said that until 1075, they were using known methods (clearing marginal land, etc.) which were yielding arithmetic growth. Then deep ploughing was a new method.

  So during 1000-1075, the food growth was arithmetic (as predicted) and population was geometric (as predicted). Then the deep ploughing was an innovation that broke the food trend. But Malthusius's theory allowed for such innovations but considered them temporary.

  For the research-programme auditor, we can say:

  - Malthusius: Survives. His theory made two novel predictions: (a) population will grow geometrically (doubling every 50 years) from 1000 to 1100, which was confirmed; (b) food production without major innovations will grow arithmetically (by 5000 bushels per year), which was confirmed until 1075. The failure of the crisis prediction at 1100 is due to an innovation, which the theory already considered as a temporary offset. The theory then predicted that the offset would exhaust and the crisis would occur, which it did in 1125. This is a progressive problem shift.

  - Doomides: Fails. His theory made no such novel predictions. The only prediction was the crisis by 1100, which failed.

  So the split: Malthusius survives, Doomides fails.

  Now, the six verdicts:

  Auditor | Malthusius | Doomides
  -------|------------|---------
  Mechanism-first | Vindicated (crisis would have occurred without the exhaustible offset, which was measurable) | Rejected (mechanism too vague, no specified offset)
  Strict falsificationist | Falsified (prediction false at 1100) | Falsified (prediction false at 1100)
  Research-programme-style | Survives (made novel predictions about growth patterns that were confirmed, and the crisis eventually occurred due to the same mechanism) | Fails (no novel predictions)

  The honest part:

  The key feature is the **exhaustible offset that was measurable and internal**. If we remove the measurability (or the fact that it was known and finite), then the mechanism auditor cannot say that the theorist could have known it was running out. Then the mechanism auditor would have to rely on the fact that the crisis happened later, which might be seen as an ad hoc adjustment. Without the offset being measurable at the time, the mechanism auditor collapses into just saying "the theory was right eventually" which is what the falsificationist rejects.

  If the offset is not exhaustible (or not one-off) then the crisis might never have happened. The fact that it was finite and exhaustible is what allows the mechanism to eventually take over.

  Attack for the view that comes out worst: the strict falsificationist might attack the case as rigged because the prediction was stated for a specific date and failed, so it's falsified. They might say that allowing a theory to be "right but early" is just an excuse for failed predictions. They might also argue that the later crisis might have been due to different causes (e.g., bad governance in 1125) and not the original mechanism.

  The defender of Doomides (who is rejected by the mechanism and research-programme auditors) might argue that the crisis in 1125 was indeed the result of the land being exhausted (as he said) and that the deep ploughing just masked it. But the mechanism auditor would counter that Doomides did not specify the mechanism (the finite subsoil) and did not provide a way to measure the offset.

  Audit horizon:

  Set the test window: The prediction was made in 1000 for 1100. The crisis occurred in 1125. The original theorists are dead by 1125 (since 125 years have passed). Now, if we shrink the audit horizon so that the audit is done in 1100 and the theorists are still alive (say, they are young in 1000 and live to 1100, which is 100 years later, so they would be very old but possible), then:

  At 1100, the falsificationist says both are falsified.

  The mechanism auditor at 1100: 
  - For Malthusius: The prediction failed due to an offset (the deep ploughing). The auditor can see that the offset is finite and will be exhausted. But at 1100, the subsoil is still being used and hasn't been exhausted. The auditor must decide if the theory is still viable. The theory says the offset is temporary, but without knowing when it will run out, the auditor might say the theory is not yet falsified but also not vindicated. It's in limbo. The auditor might require a new prediction for when the offset will run out. But the original theory didn't specify that. So the mechanism auditor at 1100 might say: the theory is not falsified because the offset was in play and the crisis might still come, but we don't know when. So it's not dead, but it's not confirmed.

  - For Doomides: The failure is clear, and his vague theory doesn't provide any offset that can be measured. So it's falsified.

  The research-programme auditor at 1100:
  - Malthusius: His novel predictions about growth patterns were confirmed (population geometric, food arithmetic until 1075, then an innovation). But the crisis prediction failed. The programme might be seen as having a problem, but it can be defended by pointing to the offset. The programme is still alive because it has produced novel predictions that were confirmed and can be extended.
  - Doomides: Fails.

  But without the crisis having occurred by 1100, the research-programme auditor might be less favorable to Malthusius.

  The key point: The "right but early" claim requires that the original prediction is taken as conditional (absent offset) and that the offset is known to be exhaustible. But without the crisis having occurred, it's harder to defend. The standing to declare the theory dead: if the audit is at 1100, the falsificationist declares it dead. The mechanism auditor might not declare it dead but would require further testing. The research-programme auditor might keep it alive because of the confirmed growth patterns.

  This supports the thesis that the dispute is about when we have the standing to declare a theory dead. The falsificationist does so at the deadline. The mechanism auditor waits until the offset is exhausted and then checks. The research-programme auditor looks at the entire trajectory of the programme.

  Final scenario write-up in one paragraph:

  In the isolated grain kingdom of Agraria, surrounded by impassable mountains, population grows geometrically (doubling every 50 years) and grain production increases arithmetically via known methods. In 1000, Malthusius predicts that by 1100, population (projected 1 million) will outstrip food supply (projected for 800,000) by 200,000. Doomides makes the same numerical prediction based on vague mechanisms. From 1000 to 1075, growth follows projections. Then, the Deep Plough Movement discovers a finite, nutrient-rich subsoil layer that boosts yields. By 1100, population is 950,000 and food supports 980,000, so no crisis. But by 1125, the subsoil is exhausted, population reaches 1.1 million, and food supports only 900,000, causing a 200,000 famine. The subsoil depth was measurable and depletion trackable.

  Walkthrough:

  - Mechanism auditor: Malthusius vindicated because the mechanism (geometric vs. arithmetic growth) operated and the exhaustible offset (subsoil) caused the delay. Doomides rejected due to vague mechanism.
  - Strict falsificationist: Both falsified for missing the 1100 prediction.
  - Research-programme auditor: Malthusius survives because he made novel predictions (geometric population growth and arithmetic food growth without improvements) that were confirmed until 1075, and the eventual crisis was due to the same mechanism. Doomides fails for lack of novel predictions.

  Key feature: The exhaustible and measurable offset. Without it, the mechanism auditor cannot distinguish Malthusius from Doomides and might reject both.

  Attack by falsificationist: The prediction was for 1100 and failed. The later crisis might be coincidence or due to other causes (e.g., in 1125, a pest destroyed crops). The theory is falsified and should be abandoned.

  Audit horizon: If the audit is at 1100, the falsificationist kills both. The mechanism auditor suspends judgment on Malthusius (waiting for the offset to exhaust) and kills Doomides. The research-programme auditor keeps Malthusius alive due to confirmed growth patterns and kills Doomides. This shows that the standing to declare a theory dead depends on the auditor's rules and the time of audit.
answer: |-
  ### Scenario: The Kingdom of Veridia

  **One-Paragraph Scenario:**  
  In the isolated, mountainous kingdom of Veridia (circa 1500 CE), grain production is confined to three fertile valleys, with arable land fixed by geography. The population grows steadily at 2% annually, sustained by traditional farming: crop rotation, manure fertilization, and seasonal flooding from glacial meltwater. In 1500, **Theorist A (Agronomica)**, a royal advisor, publishes a quantitative model predicting famine by 1600. She argues population grows geometrically (doubling every 35 years), while grain yields increase only arithmetically (1% annually) due to soil nutrient depletion. She calculates: by 1600, population will hit 1.2 million, but grain will support only 900,000—a shortfall of 300,000. **Theorist B (Catastrophus)**, a mystic, makes an identical prediction: "By 1600, famine will claim 300,000 souls," attributing it to "ecological sin" and "nature’s vengeance." Both predictions are public and dated.  

  From 1500–1590, population grows as projected, but yields exceed expectations. Why? A one-time internal offset: Veridia’s farmers systematically clear and burn centuries-old peat deposits beneath forested valley margins (discovered in 1520), releasing nutrients that boost yields by 20%. This practice is labor-intensive but sustainable only until the peat is depleted. Agronomica’s model *explicitly* flags "soil amendments" as temporary offsets with measurable limits. By 1600, population reaches 1.18 million, but grain supports 1.05 million—**no famine** (shortfall: 130,000, *below* the 300,000 margin). The prediction fails.  

  Post-1600, peat reserves deplete rapidly (tracked by royal land surveys). Yields stagnate, but population growth continues. By 1625, population hits 1.4 million, grain supports 1.1 million, and famine kills 300,000. The mechanism—geometric population growth outstripping arithmetic yield growth—drives the crisis, delayed solely by the exhaustible peat (a finite, measurable resource Agronomica could have audited). Catastrophus’ vague mechanism ("sin") fits *any* disaster.  

  ---

  ### Walkthrough: Applying the Three Auditors  
  *(Verdicts: ✅ = Vindicated/Survives, ❌ = Rejected/Falsified, ⚠️ = Ambiguous/Qualified)*  

  1. **Mechanism-First Auditor** (Focus: Was the named mechanism active? Would the outcome occur absent a specifiable, exhaustible offset?)  
     - **Theorist A (Agronomica)**: ✅ **Vindicated**.  
       - *Reason*: The core mechanism (geometric pop. vs. arithmetic yields) operated throughout. The peat offset was exhaustible, measurable (depth surveys began in 1530), and named in her model as a "finite reserve." Without it, yields would have followed her arithmetic curve, causing the 1600 famine. The 1625 crisis confirms the mechanism.  
     - **Theorist B (Catastrophus)**: ❌ **Rejected**.  
       - *Reason*: His mechanism ("ecological sin") is untestable and names no offset. Any famine (e.g., from war or blight) could "confirm" it. The actual cause (nutrient depletion from population pressure) contradicts his moral narrative.  

  2. **Strict Falsificationist** (Focus: Did the prediction miss its margin by the stated date?)  
     - **Theorist A (Agronomica)**: ❌ **Falsified**.  
       - *Reason*: Prediction specified a 300,000 shortfall by 1600. Actual shortfall (130,000) was below the margin. No "early" clause allowed—failure is absolute.  
     - **Theorist B (Catastrophus)**: ❌ **Falsified**.  
       - *Reason*: Identical numerical failure at 1600. Vagueness doesn’t excuse missing the margin/date.  

  3. **Research-Programme-Style Auditor** (Focus: Did the theory predict something *novel and specific* during the test interval?)  
     - **Theorist A (Agronomica)**: ⚠️ **Survives, with caveats**.  
       - *Reason*: Her programme predicted novel, measurable trends: (1) Geometric population growth (confirmed by 1590 censuses); (2) Arithmetic yield growth *without offsets* (confirmed 1500–1520, pre-peat); (3) The peat’s temporary effect (cited in 1540 land reports). The 1600 failure is "saved" by a non-ad-hoc adjustment (peat depletion was pre-flagged). The 1625 famine is a *novel delayed confirmation* of the core mechanism.  
     - **Theorist B (Catastrophus)**: ❌ **Fails**.  
       - *Reason*: No novel predictions. His "sin" mechanism made no testable claims (e.g., about yields or population). The 1625 famine is a post-hoc fit, not a novel insight.  

  **Summary Table of Verdicts**:  
  | Auditor                  | Theorist A (Agronomica) | Theorist B (Catastrophus) |  
  |--------------------------|-------------------------|---------------------------|  
  | Mechanism-First          | ✅ Vindicated           | ❌ Rejected               |  
  | Strict Falsificationist  | ❌ Falsified            | ❌ Falsified              |  
  | Research-Programme       | ⚠️ Survives             | ❌ Fails                  |  

  *(Note: The research-programme verdict "splits" Theorist A from Theorist B without averaging the others: Agronomica survives due to novel mid-interval predictions; Catastrophus fails utterly.)*  

  ---

  ### The Honest Breakdown  
  #### Key Feature Doing the Work: **The Measurable, Exhaustible Offset**  
  - **Why it matters**: The peat offset is internal (no deus ex machina), finite (one-time use), and *quantifiable* (depth surveys allow tracking depletion). This lets the mechanism auditor isolate the offset as a temporary perturbation to Agronomica’s model. Without it:  
    - If the offset were *immeasurable* (e.g., "luck" or "divine favor"), the mechanism auditor couldn’t verify it was exhaustible. Agronomica would look like Catastrophus—her "right but early" claim would be an unfalsifiable excuse.  
    - If the offset were *inexhaustible* (e.g., a perpetual innovation cycle), the crisis might never occur, killing the mechanism auditor’s vindication.  
  - **What collapses without it**: The mechanism auditor defaults to falsificationism. If offsets aren’t measurable, "right but early" becomes a just-so story, indistinguishable from a wrong theory salvaged by hindsight.  

  #### Attacks from the "Losing" View (Strict Falsificationism)  
  - **Rigged-case accusation**: "You engineered a *post-hoc* rescue! Agronomica’s model failed on the stated date—period. The 1625 famine could stem from new causes: climate change, a plague, or bad governance. Calling it ‘delayed mechanism’ ignores that theories must be tested on *their terms*, not retrofitted. If ‘early’ predictions count, science becomes unfalsifiable."  
  - **Weakness exposed**: The case assumes the peat depletion *causally* links to Agronomica’s mechanism. A falsificationist argues this link is only validated *after* the fact—violating testability.  

  #### Audit Horizon: Timing Matters  
  - **Baseline (1625 audit)**: Original theorists (b. ~1480) are dead. Auditors judge coldly.  
  - **Shrunk Horizon (1600 audit)**: Theorists are alive (age ~120—implausible but adjustable; assume they’re 50 in 1500 and live to 100).  
    - **Changes**:  
      - *Mechanism auditor*: Suspends judgment on Agronomica ("Offset still active; wait"). Rejects Catastrophus.  
      - *Falsificationist*: Kills both (as before).  
      - *Research-programme auditor*: Less charitable to Agronomica. Her novel predictions (yield/population trends) are confirmed, but the famine failure is fresh. She might be given time to refine—but not fully vindicated.  
    - **Why it supports your thesis**: At 1600, Agronomica’s allies (e.g., her academy) lobby to "wait and see," while rivals demand abandonment. This shows "right but early" is a *social* claim about who has standing to declare death: Falsificationists "bury" theories immediately; mechanism auditors let "zombie" theories linger pending offset exhaustion.  

  ---  
  ### Why This Works for Your Thesis  
  This case forces your group to confront that "right but early" isn’t a fact about the world but a *methodological stance* on when a theory is dead. Agronomica’s vindication hinges on auditors accepting:  
  1. Mechanisms can be "paused" by quantifiable offsets.  
  2. Theorists deserve credit if offsets were foreseeable.  
  3. The community must agree on measuring offsets.  

  Remove any pillar, and the debate collapses into historicism ("Did the offset *really* cause the delay?") or falsificationism ("The date is sacred!"). The decoy (Catastrophus) ensures only the offset’s measurability saves Agronomica—making the methodology the star.
