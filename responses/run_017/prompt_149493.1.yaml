prompt: |-
  hey — I'm a postdoc in political theory and I've ended up defending, slightly more strongly than I intended, a view about merit in selection (hiring, college admissions, promotion, prizes, the usual cases) that I now want someone to try to break, because I have a nagging feeling I've quietly built it so nothing could count against it. Roughly the view: merit is always role-relative — to deserve a position just is to be the candidate expected to best serve that role's constitutive aim — and from that I get a divide I quite like. Roles with a single, relatively uncontested aim (a commercial pilot, a bomb-disposal technician, arguably a research fellowship judged purely on output) admit a genuine meritocratic justification; roles whose aims are essentially contested (a university, a police force, a supreme court, a hospital board) don't, and there "the best qualified candidate" is doing something other than it advertises: either smuggling in one contested specification of the aims as if it were neutral, or laundering the advantages of whoever is already winning. I've bolted on two extra bits that I'm not sure are load-bearing: (i) the ratchet — merit criteria drift over time to match the traits of whoever currently succeeds, so merit-talk systematically stabilizes existing hierarchies; and (ii) aim-drift — because who gets selected partly determines what the role's aims become later on, the counterfactual "how well would this candidate serve the aims" isn't well defined even in principle, so the account can't be rescued just by better prediction. Please act as a political philosopher who works on desert and distributive justice and has read around the meritocracy literature, and think carefully: start by brainstorming maybe six to eight independent things that could count against this before you rank anything at all, and don't just give me the objections people standardly make against meritocracy — give me the ones that bite on my version specifically.

  What I want out of it: defeaters sorted from fatal to merely awkward, and for each one an honest note on whether I, as a committed defender, would concede it or whether I'd dismiss it as smuggling in a rival assumption. Include the uncomfortable categories — a case the view can't describe, a consequence I'm committed to that's unacceptable, a result showing the whole thing collapses into something I was trying to avoid (Rawlsian fair equality of opportunity? luck egalitarianism about effort and circumstance? some qualified-lottery proceduralism?) — and be explicit about whether that collapse is itself a defeat or just a redescription. Also tell me which of my two bolted-on bits the core actually needs, and whether dropping the ratchet saves everything else. And then, bluntly: has the move to "essentially contested aims" made the view unfalsifiable, and if it has, is that a real problem for a view of this kind or just what normative views are like? I'd definately rather hear the strongest version against me than a comforting one.

  Then run it on three cases I can't make up my mind about: military officer selection (arguably contested aims, yet the intuition that we must pick on merit is very strong there — a case where I might have to bite a bullet I don't want to bite), organ allocation (pretty clear-ish aim, and yet we resist pure efficiency scoring and add urgency, age, queue position — so is that a counterexample to my divide or a case where the aims were never as single as they looked?), and blind orchestral auditions (a case where tightening merit criteria famously changed who got in, which I want to claim as evidence for the ratchet and which I suspect someone can turn straight around on me). I'd be most moved by two kinds of thing: a role with genuinely contested aims where our merit-selection intuitions are rock solid, and any empirical finding that would actually discriminate — e.g., if criteria set under one contested specification of a role's aims still predicted performance well under rival specifications, or if qualified-lottery selection in contested-aim roles reliably degraded something measurable independent of the aims in dispute. No citations or reading list, you don't have web access anyway and I'll fill that in myself; I'm teaching a seminar on this next term and want to hand out something sharper than my own notes.
reasoning: |-
  Okay, let's tackle this. The user is a postdoc in political theory who's developed a view on merit as role-relative. They want their theory stress-tested, specifically against objections that target their unique claims—like the role-relative desert and the divide based on essentially contested aims. 

  First, I need to understand the core of their argument: merit is defined by how well a candidate serves a role's constitutive aim. Roles with uncontested aims (like pilots) can be meritocratic; those with contested aims (like universities) can't, and "best qualified" there is just masking bias or power dynamics. They've added two extras: the ratchet effect (criteria drift to match incumbents) and aim-drift (selection affects future aims, making prediction impossible). 

  The user wants defeaters sorted by severity, notes on whether they'd concede or dismiss each, and which bolted-on parts are essential. They also want three cases analyzed: military officers, organ allocation, and blind auditions. Plus, they’re looking for rock-solid merit intuitions in contested-aim roles or empirical evidence that could falsify their view. 

  Hmm. Let me brainstorm objections that specifically bite their version. First, the "aim specification problem": even roles they call "uncontested" might have hidden contested elements. For example, a pilot’s aim isn’t just safety—what about efficiency, passenger comfort, or ethical dilemmas? If that’s right, their clear divide collapses. They might dismiss this as nitpicking, but it’s a real threat if all roles have some contested layer. 

  Second, "performance prediction neutralism": what if merit criteria (say, test scores for a job) predict success equally well under rival aim specifications? That would undermine their claim that merit-talk in contested-aim roles is just bias laundering. They’d likely reject this by arguing prediction is impossible due to aim-drift, but if data showed otherwise, it’d hurt. 

  Third, "constitutive aim smuggling": their view assumes we can cleanly separate a role’s "constitutive aim" from broader social purposes. But for something like a police force, is reducing crime the only aim? Or is it also about legitimacy, community trust? If the latter, merit might include procedural fairness traits—which could make their "neutral" merit possible even in contested spaces. They’d probably say this proves their point about smuggling, but it’s messy.  

  Fourth, "unavoidable merit intuitions": are there roles with contested aims where we still have strong merit intuitions? Military officers are their own example—aims are debated (combat effectiveness vs. ethical restraint), yet we insist on merit. They might bite the bullet and say our intuition is misguided, but that’s uncomfortable.  

  Fifth, "ratchet dependency": if the ratchet effect is just an add-on, does the core need it? Not really—the contested-aim argument stands alone. But without the ratchet, they lose an explanation for how bias creeps in. Still, dropping it might save the theory from overclaiming.  

  Sixth, "empirical vulnerability": is the view unfalsifiable? They say aim-drift makes prediction impossible "even in principle," which feels like a get-out-of-jail-free card. But if a study showed merit criteria remained effective across leadership changes (e.g., in a hospital under different CEOs), that’d challenge them. They’d likely dismiss it by redefining aims, though—so yes, unfalsifiability is a problem.  

  Now for their cases:  
  - **Military officers**: Strong merit intuitions despite contested aims (e.g., aggression vs. caution). They have to admit merit here is either incoherent or smuggled—so bite the bullet.  
  - **Organ allocation**: Seems like a clear aim (save lives), but we add fairness factors. This reveals the aim was never single; it’s inherently multi-objective, so no counterexample.  
  - **Blind auditions**: Tightening criteria (removing bias) changed hires. They’d call this ratchet evidence, but critics could say it proves merit works when biases are removed—undercutting their claim that contested aims prevent real meritocracy.  

  Biggest worry: If all roles have some contested layer, their divide vanishes. And if they retreat to "degrees of contestation," does that help or just muddy things? Also, unfalsifiability is bad—normative theories should at least be *vulnerable* to real-world evidence.  

  Final thought: Their core is strong on critique (merit as power-laundering) but weak on alternatives. If they concede merit is impossible in contested-aim roles, what’s left? Lotteries? Deliberative democracy? That’s fine, but they should own it.
answer: |-
  Here’s a systematic stress-test of your view, structured around your requests. I’ll start with foundational objections, rank them by severity, then apply them to your three cases. The goal is steelmanning the opposition—no comforting punches pulled.

  ---

  ### **Defeaters: Ranked from Fatal to Awkward**
  *(Key: 🚫 = fatal; ⚠️ = serious but maybe salvageable; ⚠️🤔 = awkward but defensible)*

  1.  **🚫 The Collapse into Proceduralism/Relativism**  
      **Objection:** Your view implies that for roles with contested aims, there *is no fact of the matter* about merit—only power struggles over aim specification. But this collapses into a proceduralist or relativist position: merit is whatever the dominant group *says* the aim is. Worse, it risks making "merit" an empty concept in precisely the domains where we need it most (e.g., selecting judges). If merit is reducible to power in contested cases, why not abandon the language entirely and admit we're selecting based on political alignment or raw preference?  
      **Your likely defense:** You’d argue this is the *point*—merit language *is* ideological camouflage in contested domains. But this concedes the objection: your "role-relative merit" framework adds nothing beyond exposing the camouflage.  
      **Defeater strength:** Fatal if you want a positive account of merit; awkward if you’re purely critiquing merit-talk.  

  2.  **🚫 The Uncontested Aim Mirage**  
      **Objection:** Even your "uncontested" cases aren’t safe. Bomb-disposal techs aim to defuse bombs, but *how*? Maximize success rate? Minimize civilian risk if failure is likely? Prioritize speed? Minimize collateral damage to infrastructure? These are latent value conflicts. Commercial pilots: safety vs. fuel efficiency vs. passenger comfort? Research fellows: pure output vs. ethical constraints vs. collegiality? If *all* roles have nested contestations (just less visible), your core divide evaporates.  
      **Your likely defense:** You might distinguish "operational" aims (defuse bomb) from "value" aims (how to weight risks), insisting only the former are constitutive. But this is arbitrary—aims are nested.  
      **Defeater strength:** Fatal to your binary. Forces retreat to a spectrum of contestation, which undermines the clean justificatory divide.  

  3.  **⚠️ Performance Prediction Neutralism**  
      **Objection:** Suppose in a contested-aim role (e.g., university admissions), we adopt merit criterion *X* (e.g., standardized test scores) under one specification of the aim (e.g., academic excellence). If *X* predicts performance well *even under rival aim specifications* (e.g., fostering leadership, promoting innovation), then "merit" isn’t smuggling—it’s robust across evaluations. Empirical example: LSAT scores correlate with law school grades across diverse pedagogical aims.  
      **Your likely defense:** You’d invoke **aim-drift**: the criteria themselves reshape the aims (e.g., high LSAT cohorts shift pedagogy toward analytical rigor). But if prediction holds *despite* drift, or in short-term studies, this weakens your claim.  
      **Defeater strength:** Serious—if true, it rescues meritocracy in some contested domains.  

  4.  **⚠️ The Constitutive Aim Smuggling Problem**  
      **Objection:** You assume we can identify a role’s "constitutive aim" neutrally. But this is circular: the "aim" is already a contested political choice. E.g., is a police force’s aim "reducing crime," "upholding order," "serving the community," or "protecting rights"? Each implies different merit criteria. Your framework can’t resolve this—it just pushes contestation upstream.  
      **Your likely defense:** You’d argue this *validates* your point—even defining the aim is where power operates. But then "role-relativity" is doing no work; the problem is prior.  
      **Defeater strength:** Serious. Forces you to admit your view is less about merit and more about the politics of aim-definition.  

  5.  **⚠️🤔 The Ratchet as Essential, Not Bolted-On**  
      **Objection:** Your "ratchet" isn’t optional—it’s the *mechanism* explaining how "merit" stabilizes hierarchy in contested domains. Without it, you have no answer to: "If merit is just aim-relative, why do criteria *systematically* favor dominant groups?" Dropping the ratchet leaves you with a harmless pluralism ("different aims, different merits"), not a critique.  
      **Your likely defense:** You might concede this—the ratchet is core to your critical thrust. But it’s empirically vulnerable: if criteria change *without* demographic matching (e.g., new skills favored due to tech shifts), the ratchet isn’t inevitable.  
      **Defeater strength:** Awkward if dropped, but fatal to your critical project if false.  

  6.  **⚠️🤔 Unavoidable Merit Intuitions in Contested Domains**  
      **Objection:** In roles like Supreme Court Justices (clearly contested aims—originalism vs. living constitution), we still have strong intuitions that some candidates are "unqualified" (e.g., no legal experience). Your view must dismiss this as aim-smuggling, but this strains credibility: is there *no* minimal competence threshold independent of aim-specification?  
      **Your likely defense:** You’d argue thresholds are aim-relative (an originalist might prioritize different expertise). But this feels evasive when confronting blatant incompetence.  
      **Defeater strength:** Awkward—forces you to bite bullets on cases of obvious misfit.  

  ---

  ### **The Bolted-On Bits: Load-Bearing Analysis**
  - **The Ratchet**: Core to your critical argument (exposing merit as hierarchy maintenance). Without it, you lose leverage against "neutral" merit claims in contested domains.  
  - **Aim-Drift**: Essential for blocking the "better prediction" escape hatch. If aims are static, merit could be salvaged by improved metrics. But aim-drift makes prediction indeterminate, sealing the coffin for meritocracy in contested roles.  
  **Verdict**: Both are load-bearing for the full critique. Dropping the ratchet weakens you; dropping aim-drift collapses your anti-prediction argument.  

  ---

  ### **Unfalsifiability: Yes, and It’s a Problem**
  Your move to "essentially contested aims" *does* make the view unfalsifiable by design: any predictive success can be dismissed as temporary or masking aim-drift/contestation. This is a **real problem** because:  
  1. It immunizes your view from empirical challenge (e.g., if a study showed "merit" selections improved outcomes under *all* contested aim specifications).  
  2. It risks making your critique *oracular*—always revealing hidden power where outcomes align with hierarchy.  
  **Your dilemma**: Admit unfalsifiability (common in normative theory) but lose critical bite, or add testable mechanisms (e.g., ratchet dynamics) that *are* falsifiable.  

  ---

  ### **Case Breakdowns**
  1. **Military Officer Selection**  
      - **Contested aims?** Yes: victory vs. minimizing casualties vs. ethical restraint vs. nation-building.  
      - **Strong merit intuition?** Yes—but note: we screen for *trainability* (aptitude), not final performance, because aims evolve (e.g., counterinsurgency vs. conventional war).  
      - **Bite the bullet:** You *must* say merit-talk here either (a) smuggles in a specific aim (e.g., "winning at all costs") or (b) is pure hierarchy maintenance (e.g., privileging West Point grads). The intuition persists because we confuse *minimal competence* (uncontested) with *optimal merit* (contested).  

  2. **Organ Allocation**  
      - **Clear aim?** Superficially yes (save lives), but actually multi-objective: maximize life-years, urgency, fairness, incentive effects (e.g., encouraging donation). "Pure efficiency" (e.g., younger recipients) is *one* contested specification.  
      - **Your view holds:** Adding queue position/urgency isn’t a counterexample—it reveals the aims *were* contested (efficiency + equity). The illusion of a single aim ("save lives") is exactly what your critique exposes.  

  3. **Blind Orchestral Auditions**  
      - **Your claim:** Evidence for the ratchet (biased criteria → biased hires; neutral criteria → neutral hires).  
      - **Objection turned against you:** Blind auditions didn’t *change the aim* (musical excellence); they improved *prediction* by removing noise (bias). This suggests that in *some* contested domains (artistic merit *is* contested!), better methods can approximate "true" merit.  
      - **Your riposte:** The "aim" (orchestral sound) *did* drift post-blind-hiring (e.g., more diverse interpretations). But the objection stands: if bias removal improves outcomes under *rival* specifications (e.g., both traditionalists and modernists approve), it challenges your claim that merit is indefinable here.  

  ---

  ### **Two Requests Fulfilled**  
  1. **Rock-solid merit intuition in contested-aim role**:  
      - **Case: Emergency Room Physician**  
          Aims are contested: maximize lives saved? Minimize suffering? Prioritize children? Yet we all agree a candidate without medical training is "unmerited." Your view must dismiss this as smuggling (e.g., assuming "save lives" as aim) or concede *minimal thresholds* exist independently of aim-specification—undermining the full contestation claim.  
  2. **Empirical discriminator**:  
      - **Test:** In a role with contested aims (e.g., university president), track whether criteria set under Aim *A* (e.g., fundraising prowess) predict success under Aim *B* (e.g., academic innovation).  
      - **If YES**: Challenges your claim that merit is aim-specific; suggests robust traits exist.  
      - **If NO**: Supports your view, especially if traits favored under *A* correlate with power (e.g., elite networks).  

  ---

  ### **Blunt Conclusion**  
  Your core insight—that merit is aim-relative and aims are often political—is powerful. But **the binary divide is unsustainable**; all roles have contested layers. The **unfalsifiability problem** is real and corrosive to your critique. **The ratchet is essential**; without it, you’re just describing pluralism. To sharpen this for teaching:  
  - Emphasize the spectrum of contestation.  
  - Own the unfalsifiable core but pair it with testable mechanisms (ratchet dynamics).  
  - For contested domains, pivot to *procedural justice* (how aims are set) over merit.  
  - **Obligatory Rawls nod**: You’re flirting with his "imperfect procedural justice"—but replacing "moral desert" with "functional desert," which doesn’t solve the aim-specification problem.  

  This view won’t break easily, but it bleeds at the joints. Lean into that—it’s good political theory.
