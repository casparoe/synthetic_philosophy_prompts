  Okay, the user is writing a novel about an art forger and needs help with a specific concept. They're struggling to describe the phenomenon where a forged painting loses all value once exposed, even though it's the same physical object. Meanwhile, honest copies or similar works still hold value. The user also mentions a twist where the exposed forgery might gain value again because of its notoriety. 

  First, I need to unpack the core issue. The user is looking for a term that captures the irreversible loss of value after a forgery is revealed, and also the potential resurgence due to its story. They mentioned that "confession discount" is too cute and doesn't cover the second part. 

  The user's deeper need seems to be understanding the philosophical and economic principles behind this phenomenon. They want to integrate this into their novel authentically, so they need both terminology and conceptual clarity. The bonus question about forged manuscripts suggests they're thinking about how this applies beyond visual art.

  I recall that in art forgery discussions, there's the concept of provenance and authenticity. The irreversible loss post-exposure might be tied to the destruction of the object's perceived ontological identity. Once a work is revealed as a forgery, it loses its connection to the original artist's intent and history, which is irreplaceable. 

  For the value rebound due to notoriety, that's more about the object's narrative value. Items with infamous histories often become valuable as curiosities or historical artifacts. The term "provenancial value" might cover this, emphasizing the story over authenticity.

  The user also needs to know what "goes wrong" with the object itself. Philosophically, it's about the shift from being perceived as an expression of the artist to being seen as a deception. Even if undetected, the forgery lacks the true historical context and creative origin, which affects its intrinsic value to collectors.

  For manuscripts, the principle applies similarly. The words might be identical, but the lack of authentic origin diminishes its value to scholars and collectors who care about the author's context. The story behind a forged manuscript could similarly add notoriety value.

  I should provide both the terminology and the underlying concepts, ensuring the user can weave this into their novel's themes and dialogue. Highlighting terms like "authenticity capital" and "provenancial value" gives their characters precise language. Also, addressing the manuscript question shows the applicability beyond paintings, which might enrich their story's depth.
answer: |-
  That's a brilliantly observed paradox, and it cuts to the heart of art valuation, ontology, and narrative. You're right, the "perfect fake" puzzle is different – yours starts *after* the reveal. Here's the breakdown of the concepts and potential terms:

  1.  **The Irreversible Collapse: The Loss of "Authenticity Capital" (or "Ontological Death")**
      *   **What's Lost:** The core value destroyed isn't the aesthetic quality, the rarity, or even the specific material. It's the **authenticity** – the direct, verifiable connection to the *original artist's hand, intent, and historical moment*. This authenticity is a form of **cultural capital** or, more specifically, **"authenticity capital."**
      *   **Why Zero?** Once exposed as a forgery, the object undergoes an **ontological shift**. It ceases to be perceived as "a work *by* Artist X" and becomes "a forgery *of* Artist X *by* Forger Y." Its fundamental identity changes. It's no longer a conduit to the past genius; it's a testament to deception. Collectors invest heavily in that unique, unrepeatable connection to the artist. A forgery, however perfect, never had it. Disclosure doesn't diminish that connection; it proves it never existed. The market treats this loss as catastrophic and permanent.
      *   **Why "School of" is Different:** A "School of" or "Attributed to" piece still possesses *potential* authenticity capital. It might genuinely be influenced by, created near, or even partially by the master. Its origins are uncertain but *possibly* authentic. The exposed forgery has *certainty* of inauthenticity. Uncertainty holds potential value; certainty of fraud holds only infamy.
      *   **Terminology:**
          *   **Authenticity Collapse / Authenticity Failure:** Emphasizes the sudden loss of the core value driver.
          *   **Provenance Failure:** Highlights the broken chain of ownership/creation history.
          *   **Ontological Death / Reclassification:** Focuses on the fundamental change in the object's perceived nature and category.
          *   **Loss of Aura (Benjaminian, but stretched):** Walter Benjamin's "aura" relates to uniqueness and historical presence. A forgery *never* had the original aura, but the *illusion* of it is shattered. The loss felt is the loss of the *belief* in the aura.
          *   **Your Dealer:** "Confession discount" is catchy for the *initial* drop, but doesn't capture the permanence or the *reason* for the zero value. He might cynically call it "The Zero Point" or "The Provenance Hole."

  2.  **The Rebound Premium: Narrative Value / Provenancial Scarcity**
      *   **What's Gained:** The object acquires a new, different kind of value: **narrative value**. It becomes a historical artifact *in its own right* – a famous deception, a scandal, a testament to the forger's skill (now admired openly), and a symbol of the fallibility of experts. It's a piece of art *and* a piece of art *history* (specifically, the history of fakery).
      *   **Why More Than Signed Copies?** The signed, honest copy is *just* a copy. The exposed forgery has **provenancial uniqueness**. It's *the* painting that fooled X, Y, and Z. It's *the* canvas that triggered the scandal. This specific history attached to *this specific object* creates a new form of scarcity and desirability. You're buying a story embodied in paint.
      *   **Terminology:**
          *   **Narrative Premium / Scandal Premium:** Directly references the story driving the value.
          *   **Infamy Value:** Highlights its value derived from notorious history.
          *   **Provenancial Value (Specific Provenance):** Focuses on the unique history attached *to this object* becoming the new value driver. Provenance usually refers to ownership history, but here it expands to include its history *as a forgery*.
          *   **Artifact Value:** Positions it as a museum-worthy piece of cultural history.
          *   **"The Duped Premium" / "The Expert's Egg Premium" (your dealer):** More colorful terms a dealer might use.

  **What "Went Wrong" with the Object (Philosophically):**

  *   **The Lie Became the Object:** The object's identity was fundamentally built on a falsehood. Disclosure doesn't reveal a flaw *on* the canvas; it reveals the canvas *itself* was a flaw – a misrepresentation. Its entire raison d'être was deception.
  *   **Misattributed Achievement:** The value wasn't just in the marks on canvas, but in *who made them*. The achievement (creating that specific visual experience) was wrongly credited. Correcting the credit destroys the value because the value was predicated on the *artist's* achievement, not the *forger's* identical technical feat. Society values the originator, not the perfect replicator, in this context.
  *   **Broken Historicity:** The object lost its (false) connection to a specific historical moment and artistic consciousness. It was revealed as a contemporary creation masquerading as a past one. Its temporal context was fraudulent.

  **The Undetected Forgery:**

  *   **The Object Itself:** Nothing is physically "wrong." It functions perfectly *as* the authentic work it pretends to be. The deception *is* its success.
  *   **What's Wrong Philosophically/Ethically:** It represents a theft of credit, a distortion of art history, a misallocation of cultural value and financial resources. It undermines the integrity of the artist's body of work and the historical record. Its value is parasitic, relying entirely on a false belief about its origin. It *lacks* the authentic connection it purports to have, even if no one knows.

  **Manuscripts - Does it Carry Over? Absolutely.**

  *   **The Collapse:** A forged manuscript (e.g., a "newly discovered" Hemingway story) suffers the same ontological death. Its value wasn't *just* in the words, but in being *Hemingway's words*. Once exposed as a forgery, the connection to the author's mind, life, and historical context is severed. It becomes a curiosity, not literature. Scholars won't cite it; collectors won't value it as Hemingway.
  *   **The Rebound:** If it's a famous forgery (e.g., the Hitler Diaries), it gains immense **narrative value**. It becomes a prime example of literary fraud, studied for the deception itself, the forger's technique, and the cultural moment of its acceptance. Its value comes from its infamy and its role in the history of forgery, not its literary content *as* Hemingway.
  *   **Key Difference:** For manuscripts, the *words themselves* might hold intrinsic literary merit, but this is usually vastly overshadowed by the loss of authenticity for collectors/scholars. A beautiful forgery might be published as "Anonymous" or under the forger's name later, but its value as a *Hemingway* is gone forever, replaced by its value as a *Hoax* if notorious enough.

  **Literature & Concepts (Beyond Acknowledgements):**

  *   **Nelson Goodman (Languages of Art):** Explores the difference between "autographic" arts (like painting, where the original physical object matters) and "allographic" arts (like music or literature, where the instance matters less than the score/text). Forgery primarily attacks autographic arts, but as your manuscript point shows, the *attribution* matters hugely in allographic arts too when collecting unique artifacts (manuscripts).
  *   **Walter Benjamin (The Work of Art in the Age of Mechanical Reproduction):** His concept of "aura" – the unique presence and authority of the original – is central. A forgery lacks aura; its exposure destroys the *illusion* of aura.
  *   **Arthur Danto (The Transfiguration of the Commonplace):** Explores how context, theory, and art history define what is art. A forgery exists in a different (and devalued) artistic context once revealed – it's now part of the history of deception, not the history of the forged artist.
  *   **Thorstein Veblen (Theory of the Leisure Class):** Conspicuous consumption and the value of rarity/authenticity as social markers. Owning an exposed fake is social death; owning the *famous* fake might be a perverse form of conspicuousness.
  *   **The Economics of Art Forgery (Various):** Numerous studies analyze market behavior. The collapse reflects the market's extreme sensitivity to provenance and authenticity as primary value drivers. The rebound premium reflects the market's ability to create new, niche value based on scarcity and narrative.
  *   **Museum Studies/Law:** The legal concept of "title" is clouded by forgery. Provenance research is the bedrock of museum acquisition and valuation.

  **For Your Novel:**

  *   Have your dealer character understand this deeply. He wouldn't just say "confession discount," he'd lament the "ontological collapse" or sneer about buyers wanting "authenticity capital, not talent." He'd see the rebound as "trading aura for infamy" or "monetizing the scandal."
  *   Explore your forger's reaction. Does he rage against the unfairness that his *skill* is worthless until it's attached to a story of deception? Does he find perverse pride in the few forgeries that gain "infamy value"?
  *   The manuscript angle is rich. Does your forger dabble? Does he see words as fundamentally different, only to be crushed when the same rules apply?

  The core tension you've identified is between **intrinsic aesthetic/technical merit** and **extrinsic cultural/historical/narrative value**. The art market, especially at high levels, overwhelmingly favors the extrinsic – the story of the object's origin. Your forger's tragedy and potential redemption lie in navigating that brutal reality. Good luck with the novel – the concept is fascinating!
