     - But the committee might be concerned that there is a hidden moderator. The procedure doesn't have a step for that. We would need to investigate why there is heterogeneity. The procedure would then say: we cannot establish existence, so exclude. But if we want to include with a caveat about moderation, we would have to evaluate the mechanism claim: is there a proposed moderator? If yes, then we can check if the moderator was measured and if the heterogeneity is explained by it. But that's not in the existence step.

     The procedure says: if existence is not supported, we stop. So we don't get to mechanism. But we can note: the finding is excluded because the existence claim is not supported. However, the committee might want to include it with a caveat that the effect is only present in some contexts. That would be an override.

     The procedure hands back at the trade-off: the committee might decide that the two positive replications are enough to keep the existence claim, but that's a value judgment.

  Case 3: Single unregistered study with about forty participants per cell reporting a just-significant interaction (p=0.04), with no effect size given.

     - Existence claim: 
          The study is not preregistered, p=0.04 -> weak evidence for existence (by our default).

          We have no replications.

          So we continue.

     - Magnitude claim:
          No effect size given. We can try to compute it? We have cell sizes, and it's an interaction. We might be able to compute a partial eta squared? But we don't have the F statistic? We have p=0.04 and n per cell=40. We can get the F statistic if we know the df. But we don't.

          We cannot compute the effect size -> magnitude not evaluable -> weak.

     - Mechanism claim: not specified.

     - Overall: existence is weak, magnitude is weak. So include with caveat.

     But the committee might want to exclude because the evidence is weak. The procedure says include with caveat.

     The colleague wants to build a grant around it. The procedure says we can include it in the textbook with a caveat, but for a grant, one might want stronger evidence.

  Finally, what the procedure can't do:

     - It doesn't handle well heterogeneity (like in case 2) where a moderator might be present.
     - It relies on preregistration as a quality marker, but some studies might be high quality without it.
     - It doesn't account for the quality of the experimental design beyond preregistration.
     - It might be too conservative for magnitude claims when replications are few.
     - It doesn't handle well mechanisms that are tested indirectly.
     - It requires effect sizes for magnitude, which are not always available.
     - It might be too simplistic for the mechanism claim.

  And the point where it hands back: when the committee disagrees with the threshold (e.g., they want to be more or less conservative) or when there is heterogeneity that suggests a moderator, or when the mechanism is complex.

  We've built a procedure that is operational and covers the requirements. Now we write it up as a clear set of steps.
answer: |-
  Below is an operational decision procedure for evaluating findings, designed to address your requirements. It separates existence, magnitude, and mechanism claims; forces explicit trade-offs; handles missing data; incorporates frequentist and Bayesian perspectives without stalling; and includes explicit stopping rules. The procedure is structured as a flowchart with ordered questions, criteria for answers, and rules for inclusion/exclusion. Judgment calls are flagged, and trade-offs must be stated upfront.

  ---

  ### **Procedure for Evaluating Findings**
  **Input**: Original study + any replications.  
  **Output**: IN, IN-with-caveat, or OUT.  
  **Prerequisite**: Committee must explicitly state the trade-off between wrongful inclusion (Type I error) and wrongful exclusion (Type II error) before evaluation. For example:  
  - *Conservative*: Prioritize avoiding false positives (e.g., tolerate 20% false negatives).  
  - *Liberal*: Prioritize avoiding false negatives (e.g., tolerate 10% false positives).  
  - *Default*: Balanced (e.g., 5% false positives, 20% false negatives).  

  #### **Step 1: Evaluate Existence Claim**  
  *Question: Is there credible evidence that the effect is non-zero?*  
  - **Criteria for sufficient evidence**:  
    - *Ideal*: 95% CI excludes zero, or Bayes Factor (BF₁₀) > 3, or p < 0.05 (if preregistered).  
    - *Fallback if data missing*:  
      - If only p-value: Use p < 0.05 + small-study adjustment (halve p-value if n < 100 per cell).  
      - If no CI/p-value/BF: Existence claim unevaluable → proceed to Step 2 but flag "existence uncertain."  
  - **Update with replications**:  
    - If replication CI excludes zero: Supports existence.  
    - If replication CI includes zero + high power (≥80% for original effect size): Counters existence.  
    - If replication point estimate same direction but smaller: Supports existence but not magnitude.  
    - If replication CI excludes original estimate but not zero: Supports existence but not magnitude.  
  - **Stopping rule**:  
    - OUT if:  
      - Original evidence weak (e.g., p = 0.04 unregistered, BF₁₀ < 1) AND no replications support existence.  
      - Preregistered replication with high power shows CI includes zero.  
    - Else: Proceed to Step 2.  

  #### **Step 2: Evaluate Magnitude Claim**  
  *Question: Is the reported effect size credible?*  
  - **Criteria for sufficient evidence**:  
    - *Ideal*: Original reports effect size (d, η², etc.) with 95% CI.  
    - *Fallback if data missing*:  
      - Compute effect size from t/F/χ² stats if possible.  
      - If impossible: Magnitude claim unevaluable → flag "magnitude uncertain."  
  - **Update with replications**:  
    - If replication point estimate ≤50% of original: Weak evidence for magnitude.  
    - If replication CI excludes original estimate: Weak evidence for magnitude.  
    - If multiple replications: Use meta-analytic pooled estimate.  
  - **Rule for magnitude support**:  
    - Supported if: Original CI width ≤ "small" (d < 0.2 SDs) OR replication CI includes original estimate.  
    - Not supported if: High-powered replication CI excludes original estimate.  
    - Judgment call: If magnitude unevaluable, committee decides if effect size is "plausible" given literature.  

  #### **Step 3: Evaluate Mechanism Claim**  
  *Question: Is the proposed explanatory mechanism supported?*  
  - **Criteria for sufficient evidence**:  
    - Requires direct test (e.g., mediation, moderation, experimental manipulation).  
    - Preregistered analysis or strong theory (e.g., derived from computational model).  
  - **Stopping rule**:  
    - If mechanism untested: Claim unevaluable → flag "mechanism speculative."  
    - If mechanism tested but replication fails: Weak evidence.  

  #### **Step 4: Integration and Decision**  
  - **Decision rules**:  
    - OUT if existence claim rejected in Step 1.  
    - IN if all claims supported with strong evidence (preregistered, narrow CI, BF₁₀ > 10).  
    - IN-with-caveat if:  
      - Existence supported but magnitude/mechanism weak.  
      - Trade-off favors inclusion despite ambiguity.  
  - **Hand-off to judgment**:  
    - When evidence conflicts (e.g., heterogeneity in replications).  
    - When trade-off tolerance is exceeded (e.g., liberal policy accepts weak evidence).  
    - When mechanism relies on untestable theory.  

  ---

  ### **Application to Your Cases**
  #### **Case 1: Your Preregistered Replication**  
  - **Step 1 (Existence)**:  
    - Original: Likely supported existence (used in your dissertation).  
    - Replication: Point estimate ~0, CI excludes original → supports existence (CI excludes zero? If yes, existence still supported; if CI includes zero, counters existence).  
    - *Stopping?* If CI includes zero + high power → OUT. Else proceed.  
  - **Step 2 (Magnitude)**:  
    - Replication CI excludes original effect size → magnitude unsupported.  
  - **Step 3 (Mechanism)**: Not evaluated (assume no direct test).  
  - **Decision**:  
    - Existence supported? If yes → IN-with-caveat ("effect exists but likely smaller").  
    - Existence unsupported? → OUT.  
  - **Your dissertation**: You may use it with caveats, but textbook excludes/notes caution.  

  #### **Case 2: Multi-Site Replication with Heterogeneity**  
  - **Step 1 (Existence)**:  
    - Pooled effect ~0 → counters existence.  
    - 2 sites replicate original → supports existence.  
    - *Conflict*: Preregistered replications conflict → hand-off to judgment.  
  - **Judgment needed**:  
    - Investigate moderators (e.g., culture, methods) in sites.  
    - Is heterogeneity explainable (e.g., meta-regression)? If not, "fluke" likely.  
  - **Decision**: OUT if existence unsupported; IN-with-caveat if moderator identified.  

  #### **Case 3: Unregistered Interaction (p = 0.04)**  
  - **Step 1 (Existence)**:  
    - p = 0.04 unregistered → weak evidence (adjust to p = 0.08 if n < 100).  
  - **Step 2 (Magnitude)**: No effect size → unevaluable → weak.  
  - **Step 3 (Mechanism)**: Not tested.  
  - **Decision**: IN-with-caveat ("preliminary evidence, requires replication").  
  - **Grant-building**: Not recommended without replication.  

  ---

  ### **What the Procedure Can't Do**  
  1. **Systematic limitations**:  
     - Misjudges **theoretical mechanisms** without direct tests.  
     - Biased against **small effects** (e.g., social priming) where replications are underpowered.  
     - Poor for **heterogeneous effects** (e.g., Case 2) without moderator data.  
  2. **Hand-off points**:  
     - When **trade-offs conflict** (e.g., liberal policy includes weak evidence).  
     - When **replications are ambiguous** (e.g., same direction but smaller).  
     - When **mechanism is non-falsifiable**.  
  3. **Judgment calls**:  
     - Defining "small" effect sizes.  
     - Interpreting Bayesian priors.  
     - Balancing severity vs. Bayes factors (use severity for Type I errors, Bayes for likelihood).  

  ### **Why It Works**  
  - **Separates claims**: Existence (frequentist CI/BF), magnitude (replication consistency), mechanism (direct tests).  
  - **Operational**: Uses available data (p-values, CIs) without philosophy.  
  - **Forces transparency**: Trade-offs stated upfront, judgment calls flagged.  
  - **Efficient**: 45 min/finding via flowchart.  

  This procedure ensures defensible decisions while acknowledging uncertainty. Use the appendix to document trade-offs and hand-off points.
