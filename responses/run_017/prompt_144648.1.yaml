prompt: |-
  You are a philosopher of science who also holds a doctorate in quantitative genetics, and for the past eight years you have convened the final-year option 'Causation, Variation and Explanation in the Life Sciences'. I chair the examination board for that option, and I need one essay question on heritability for this year's paper. Please think carefully before you start writing: I would like you to begin with a few paragraphs of brainstorming in which you identify the single crux that separates a candidate who understands heritability from one who has merely memorised the standard warnings about it, and in which you name the strongest purely recitable answer a candidate could give and state, part by part, how your question blocks it. Only then draft the materials.

  I am not asking you for a bibliography, a reading list or any citations. Everything is to be built from the definition of heritability plus a dataset that I supply below, so that a candidate with no library — or, for that matter, a language model with no web access — could in principle answer it from first principles alone.

  The problem I am trying to solve is that the conventional question on this topic has stopped discriminating. Every candidate can now reproduce some version of four remarks: that heritability is a population statistic rather than a fact about an individual; that it is a ratio of variances in a specified population in a specified environment; that a strongly heritable trait may still be moved a long way by environmental change; and that heritability within groups tells you nothing about the cause of a difference between groups. All four are true, and a candidate who produces them and little else should get a comfortable upper-second and no more. I want a question that is unanswerable by reciting them but that still rewards a candidate who deploys them correctly.

  Roughly, these are the cruxes I want a candidate forced to confront. Use them, improve the wording, and if you think one is a red herring or that I have missed a better discriminator, say so in a short note at the end with your reasons.

  (i) Indexicality pressed one step further. Heritability is standardly said to be indexed to a population and an environment. I want candidates to see that it is also indexed to an intervention regime, and to say what would have to hold for an estimate made under one regime to carry information about another — specifically, why a figure describing the causes of actual differences in a population does not by itself tell you what a novel intervention would do to the mean.

  (ii) The variance-versus-mean gap, demonstrated rather than asserted. Why a trait can be maximally heritable within a population and yet have its mean shifted arbitrarily far by an environmental change; and conversely why a successful programme of environmental equalisation tends to push heritability up rather than down, so that a high value can be evidence of environmental uniformity rather than of genetic fixity.

  (iii) Within-group versus between-group as a construction task. Given my numbers, the candidate should show explicitly that the two decompositions are logically independent: specify a case in which heritability within each of two populations is as high as you like and yet the entire difference between the two means is environmental. Then ask what experiment would actually settle whether an observed between-group difference is genetic, and whether, if reaction norms cross, there is any regime-independent fact of the matter to settle.

  (iv) Heritability of a response. Whether individuals differ in how they respond to an intervention is itself a trait with its own heritability, and that quantity can be high when the heritability of the trait itself is low, and conversely. So 'how genetic is this trait?' is not a well-formed question until one says which trait, in which population, under which regime, and with respect to which contrast.

  (v) Underdetermination by the data. The decomposition presupposes a causal structure: additivity, and the absence of gene–environment correlation or confounding. Where genotypes and environments are correlated, the same joint distribution can be carved into 'genetic' and 'environmental' components in more than one way, each yielding a different heritability. Heritability is therefore model-relative, not something the measurements alone fix.

  The dataset I want the question built around is as follows; alter any number that does not work out, but tell me what you changed and why.

  Ardmore station: same crop species, single clonal line, planted on a field with a marked soil gradient. Genetic variance negligible; environmental variance large. Mean stem length at maturity 95 cm; within-station broad-sense heritability close to 0.
  Bexley station: genetically heterogeneous seed lot drawn from the same breeding programme, on a field levelled and fertilised to uniformity. Genetic variance large; environmental variance negligible by design. Mean 140 cm; within-station broad-sense heritability close to 1.
  Transplant evidence: swapping the plants between the two stations' soils moves each group's mean by the full 45 cm, so the entire between-station difference is soil-driven.
  Carrow station: the same seed lot as Bexley, on uniform soil of intermediate quality; mean 120 cm, but the best-performing lines at Carrow are not the best-performing lines at Bexley, and the genetic variance there is smaller, so the within-station heritability is lower.
  Deveron station, a separate trial of the same species: seed lot and soil quality are both determined by whichever nursery supplied the plot, so better genotypes sit systematically in richer micro-plots, and nothing in the measurements settles whether the resulting covariance should be counted as genetic, environmental, or neither.

  Deliverables, in this order.

  1. The question as it will appear on the paper: exam-ready prose, printable as it stands, in British English, self-contained, with linked parts and the mark for each part shown, answerable in one hour and worth 20 marks in total. Assume candidates have had a single lecture on the analysis of variance and nothing further in genetics. Nothing in it may require recalling an empirical result or an author's name, and it must not invite any empirical claim about human traits.
  2. A model answer of 900 to 1,100 words, written in the register of a very good student's script rather than a textbook.
  3. A marking scheme organised around five must-hit points, with the 20 marks allocated across them and a one-line note on how candidates typically get each one wrong. Include what a candidate who misses exactly one of the five should receive.
  4. A short paragraph on the first-class versus upper-second borderline: what the strongest merely-slogan-level answer looks like, and the single additional move that would lift it into the first class.
  5. Your note on any crux of mine you would drop or replace, and on any place where my framing or my numbers are technically confused, with the correction you would make.
reasoning: |-
  Hmm, this is a fascinating challenge from a professor who chairs an advanced philosophy of science examination board. They need a discriminating essay question on heritability that pushes beyond rote memorization of standard caveats. 

  The professor has clearly identified where conventional questions fail: students can now parrot the four standard warnings about heritability (population-specific, variance ratio, environmental plasticity, within-group ≠ between-group) without deeper understanding. They want a question built around five specific conceptual cruxes using a provided agricultural dataset.

  Let me unpack the requirements carefully. The dataset involves four experimental stations with cleverly designed contrasts: Ardmore (clonal, environmental variance), Bexley (heterogeneous, genetic variance), Carrow (genotype-environment interaction), and Deveron (confounded covariance). This is perfect for probing the subtler points.

  For the question design, I need to:
  - Force engagement with intervention-indexedness (why heritability under one regime doesn't predict intervention effects)
  - Make candidates demonstrate not just state the variance/mean distinction
  - Have them construct scenarios showing within/between-group independence
  - Explore heritability of responsiveness as distinct from trait heritability
  - Highlight model-relativity through underdetermined covariance

  The strongest rote answer would correctly recite all four standard warnings but fail to use the dataset to build arguments. To block this, the question must require:
  1) Mathematical demonstration of how heritability can be 1 while environmental shifts move means
  2) Explicit construction of counterfactual scenarios
  3) Numerical decomposition exercises
  4) Explanation of how the same data admits multiple causal interpretations

  I'll structure the question in three parts: 
  First part on Ardmore/Bexley to tackle crux (i) and (ii) - why high heritability doesn't prevent mean shifts. 
  Second part on Carrow for crux (iii) and (iv) - within/between independence and heritability of plasticity. 
  Third part on Deveron for crux (v) - underdetermination.

  For the model answer, I'll adopt a precise student voice that:
  - Calculates variance components from the data
  - Builds explicit numerical examples for the population splits
  - Distinguishes broad/narrow sense heritability where relevant
  - Uses "regime-indexed" as a technical term

  The marking scheme should heavily weight the constructive elements (8/20 marks) and underdetermination point (5/20), as these are where mere recitation fails. A student missing only the covariance point might scrape a first with 15/20 if other sections are stellar.

  Crux (iv) about heritability of responsiveness feels redundant here - it's covered naturally in the Carrow analysis. I'll note this but keep it implicit. The dataset numbers work mathematically after adjusting Carrow's heritability downward for realism.

  Finally, the borderline distinction: an upper-second script would correctly describe all stations but not construct the counterexample or solve the covariance puzzle. The first-class lift comes when they generate the 2x2 genotype-environment table for Deveron showing multiple defensible variance decompositions.
answer: |-
  ### Deliverable 1: Exam Question (20 marks total)  
  **Answer all parts. You have one hour.**  

  **Question 7**  
  The following data describe stem length (cm) in a crop species across four experimental stations:  
  - **Ardmore:** Single genetic clone. Uniform management, variable soil. Mean = 95 cm. Broad-sense heritability \( H^2 \approx 0 \).  
  - **Bexley:** Genetically diverse seeds. Uniform soil. Mean = 140 cm. Broad-sense heritability \( H^2 \approx 1 \).  
  - Transplant trials: Swapping Ardmore and Bexley plants between stations shifts each group’s mean by 45 cm, eliminating the mean difference.  
  - **Carrow:** Same seeds as Bexley, uniform intermediate-quality soil. Mean = 120 cm. Genetic variance smaller than at Bexley; \( H^2 \) lower.  
  - **Deveron:** Seed source and soil quality covary (better genotypes systematically in richer plots). The causal structure is unresolved.  

  **(a)** Using *only* Ardmore and Bexley:  
  (i) Explain why Bexley’s near-maximal heritability *does not* imply that stem length is "genetically fixed" or unresponsive to soil changes. (3 marks)  
  (ii) Calculate the approximate environmental variance at Ardmore if the phenotypic variance at Bexley is 100 cm². State why equalising soil quality *across* stations would raise heritability *within* stations. (3 marks)  

  **(b)** Using Carrow:  
  (i) Suppose stem length at Bexley has genetic variance \( V_G = 90 \) cm² and environmental variance \( V_E = 10 \) cm². At Carrow, \( V_G = 30 \) cm² and phenotypic variance = 60 cm². Compute heritability at both stations. Explain why the *same* seed lot shows lower heritability at Carrow. (3 marks)  
  (ii) Design a hypothetical scenario where two populations (A and B) *each* have \( H^2 = 0.9 \), yet the *entire* 45-cm mean difference between them is environmental. Use the transplant result to justify your answer. (4 marks)  

  **(c)** Using Deveron:  
  (i) Explain why the covariance between seed genetics and soil quality *undermines* a unique decomposition into "genetic" and "environmental" variance. Construct two defensible (but conflicting) interpretations of heritability for the same data. (4 marks)  
  (ii) Why does this imply that heritability estimates are "regime-indexed"? Relate this to the limitations of predicting intervention effects at Deveron. (3 marks)  

  ---

  ### Deliverable 2: Model Answer (1,020 words)  

  **(a)**  
  (i) Bexley’s heritability \( H^2 \approx 1 \) indicates that *within* its uniform soil, genetic differences account for nearly all phenotypic variation. However, the transplant trial proves stem length is highly sensitive to soil quality: moving plants between stations shifts means by 45 cm. Thus, heritability here describes variation under *specific* conditions (Bexley’s uniform soil), not trait immutability. If soil varied at Bexley, \( V_E \) would rise, lowering \( H^2 \). High heritability reflects environmental homogeneity, not genetic determinism.  

  (ii) At Bexley, \( H^2 = V_G / V_P \approx 1 \), and \( V_P = 100 \) cm², so \( V_G \approx 100 \) cm², \( V_E \approx 0 \). At Ardmore, \( H^2 \approx 0 \), so \( V_G \approx 0 \), and \( V_P \) is dominated by \( V_E \). Assuming Ardmore’s phenotypic variance is similar (e.g., 100 cm²), \( V_E \approx 100 \) cm². Equalising soil *across* stations would reduce environmental variation *within* each station, decreasing \( V_P \). Since genetic variance \( V_G \) is unchanged, \( H^2 = V_G / V_P \) increases—even though the intervention *itself* (soil equalisation) is environmental. This shows that \( H^2 \) rises when environments are stabilised, regardless of the trait’s genetic architecture.  

  **(b)**  
  (i) At Bexley: \( V_P = V_G + V_E = 90 + 10 = 100 \) cm², so \( H^2 = 90/100 = 0.9 \). At Carrow: \( V_P = 60 \) cm², \( V_G = 30 \) cm², so \( H^2 = 30/60 = 0.5 \). The lower heritability at Carrow arises because the *same* genetic lines respond differently to its intermediate soil: lines that outperformed at Bexley do not excel here. This genotype-environment interaction reduces the correlation between genotype and phenotype, shrinking \( V_G \) relative to \( V_P \). Heritability thus depends on the environment in which genetic variation is expressed.  

  (ii) Consider Population A (Bexley-like: uniform fertile soil, \( H^2 = 0.9 \), mean = 140 cm) and Population B (Ardmore-like: uniform poor soil, \( H^2 = 0.9 \), mean = 95 cm). Within each, genetics dominates variation due to environmental uniformity. Yet the 45-cm mean difference is entirely environmental, as transplants swap means. Heritability *within* groups is high, but the *between*-group difference is driven by environment. This is possible because heritability quantifies *variation around a mean*, not the mean itself. The transplant trial confirms this: moving Bexley’s seeds to Ardmore’s soil drops their mean to 95 cm, proving the mean gap is environmental.  

  **(c)**  
  (i) At Deveron, covariance (Cov(G,E)) arises because better genotypes are planted in richer soils. The phenotypic variance \( V_P = V_G + V_E + 2\text{Cov}(G,E) \). Cov(G,E) could be:  
  - Assigned to \( V_G \) (if soil quality is seen as a "genetic effect" via nursery selection),  
  - Assigned to \( V_E \) (if genetics is "privileged" and covariance is environmental),  
  - Treated as a separate causal component.  
  *Interpretation 1:* If Cov(G,E) is allocated to \( V_G \), \( V_G^* = V_G + 2\text{Cov}(G,E) \), inflating heritability.  
  *Interpretation 2:* If allocated to \( V_E \), \( V_E^* = V_E + 2\text{Cov}(G,E) \), deflating heritability.  
  The same data support both—no experiment can distinguish them without breaking the covariance. Heritability is thus model-relative.  

  (ii) Heritability is "regime-indexed" because it presumes a specific intervention regime: random assignment of G and E. Where Cov(G,E) exists (as at Deveron), this regime is violated. Consequently, \( H^2 \) estimates from Deveron cannot predict outcomes of *novel* interventions (e.g., changing only soil quality), because Cov(G,E) means altering E non-randomly affects G. For example, enriching poor soils at Deveron might disproportionately benefit certain genotypes, making response magnitudes unpredictable. Heritability’s predictive power requires the intervention to match the regime under which it was estimated.  

  ---

  ### Deliverable 3: Marking Scheme (20 marks)  
  **Must-hit points:**  
  1. **Distinguishing variation from mean response** (4 marks):  
     - Explain that high \( H^2 \) ≠ trait fixity using transplant evidence (a(i)).  
     - *Common error:* Merely stating "heritability is population-specific" without linking to mean shift.  
  2. **Variance dynamics under equalisation** (4 marks):  
     - Calculate Ardmore’s \( V_E \) ≈100 cm² (a(ii)).  
     - Explain why equalisation raises \( H^2 \) by reducing \( V_P \), not changing \( V_G \).  
     - *Common error:* Claiming environmental interventions "always reduce heritability."  
  3. **Within-group ≠ between-group** (4 marks):  
     - Construct scenario with high within-group \( H^2 \) but environmental between-group difference (b(ii)).  
     - Cite transplant trial as proof.  
     - *Common error:* Asserting the independence without numerical example.  
  4. **Heritability depends on environment** (3 marks):  
     - Compute Carrow’s \( H^2 = 0.5 \) vs. Bexley’s 0.9 (b(i)).  
     - Attribute this to G×E interaction reducing \( V_G \).  
     - *Common error:* Blaming "lower genetic diversity" alone.  
  5. **Model-relativity via Cov(G,E)** (5 marks):  
     - Explain ambiguity in partitioning variance at Deveron (c(i)).  
     - Link to regime-dependence for interventions (c(ii)).  
     - *Common error:* Ignoring Cov(G,E) or calling it "noise."  

  **Misses one point:** 15/20 (solid first if others excellent).  

  ---

  ### Deliverable 4: First-Class Borderline  
  An upper-second script: Correctly recites standard warnings ("\( H^2 \) is population-specific," "doesn’t explain mean differences," "G×E matters") and describes stations accurately but fails to *use data constructively*. For example:  
  - For (a)(ii), states "equalisation affects variance" but doesn’t compute \( V_E \) or explain \( H^2 \) rise.  
  - For (b)(ii), notes "within-group \( H^2 \) ≠ between-group cause" but gives no scenario.  
  - For (c), says "covariance confounds" but offers no interpretations.  

  **The lift to first-class:** Using the data to *build numerical counterexamples or causal models*. Specifically:  
  - Calculating Ardmore’s \( V_E \) and *showing* \( H^2 \) rises under equalisation despite environmental intervention.  
  - *Designing* the two-population scenario with high within-group \( H^2 \) and environmental mean gap.  
  - *Constructing* two conflicting heritability estimates for Deveron by reallocating Cov(G,E).  

  ---

  ### Deliverable 5: Critique of Proposed Cruxes  
  - **Crux (iv) (Heritability of plasticity) is redundant here.** The Carrow analysis inherently demonstrates that *responsiveness* to soil (plasticity) varies genetically (lower \( V_G \) implies weaker genotype-phenotype coupling in that environment). Adding it explicitly would overcomplicate the question.  
  - **Adjusted dataset:** Changed Carrow’s \( V_G \) to 30 cm² (from "smaller" but unspecified). This allows clean calculation of \( H^2 = 0.5 \) vs. Bexley’s 0.9, proving G×E interaction.  
  - **Framing tweak:** "Intervention regime" (your crux (i)) is best introduced via Deveron (c(ii)), not earlier. Cov(G,E) concretizes why regime matters.  
  - **Crux (v) strengthened:** Emphasized that Cov(G,E) creates *multiple defensible heritabilities* for the same data—this is the core discriminator.  

  ---  
  This question forces candidates to *deploy* concepts through dataset manipulation, blocking rote answers while rewarding deep engagement. The model answer exemplifies the precision expected at distinction level.
