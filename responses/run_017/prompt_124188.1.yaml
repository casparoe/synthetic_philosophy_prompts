answer: |-
  ## The Sterility of Coin

  **Characters:**  
  *   **ELARA:** Defends Aristotle's view. Believes money's function as a measured medium of exchange is corrupted by interest.  
  *   **LEO:** Argues Aristotle's position is tied to material reality (metal coin) and doesn't hold for value-generating assets or different monetary concepts.  

  **(Setting: A quiet corner of a university library, afternoon sun filtering through tall windows. Elara and Leo, both in their late twenties, sit surrounded by books, including translations of Aristotle.)**

  **Elara:** (Tracing a finger down a page of *Politics*) It’s this passage again, Leo. “The most hated sort [of wealth-getting], and with the greatest reason, is usury, which makes a gain out of money itself, and not from the natural object of it. For money was intended to be used in exchange, but not to increase at interest.” That ‘for’ is crucial. It’s not just *that* he condemns it, it’s *why*.

  **Leo:** I agree the ‘why’ is the crux. But I think his ‘why’ hinges on an unexamined premise – that stamped metal *is* money’s essential nature. He saw inert discs and declared them sterile by definition. But imagine a world without coin. Take my first test case: a loan of seed grain. I lend you a bushel in spring. Come harvest, you repay me a bushel and a peck. Is that interest ‘unnatural’?

  **Elara:** Aristotle *does* address loans in kind. He distinguishes household management (*oikonomia*), which deals with acquiring and using necessary goods for the *oikos*, including productive assets like seed or livestock, from chrematistics (*chrēmatistikē*), the unnatural art of wealth-getting for its own sake. Repaying more grain *could* be natural if it represents a share of the *actual, physical surplus* generated by the land and the farmer’s labour using that seed. The seed itself doesn’t ‘breed’; it’s consumed in the process of growth facilitated by nature and work. The extra peck is a *product*, not an automatic offspring of the seed-as-money.

  **Leo:** Fair. But in that scenario, the seed *is* functioning as capital, a store of value loaned for production. The ‘interest’ is the fee for its productive use. Now translate that to money. If I lend you coins specifically so you can buy seed, tools, and labour to plant a field, why is the extra coin you repay me inherently different from the extra peck of grain? Isn’t the coin, in that context, *standing in* for the productive asset? Its ‘offspring’ is still just a claim on the actual surplus generated elsewhere – by the farmer, the land, the sun.

  **Elara:** Ah, but there’s the corruption! Once you have coin as the medium, the link breaks. Money is *conventional*, a measure and facilitator of exchange. Its value is abstract, representing *potential* for acquiring goods. Lending coin at interest treats the coin *itself* as the source of increase, divorcing it from any necessary connection to actual production. The lender demands more coins simply for parting with coins, regardless of whether the borrower uses them productively, or even whether a real surplus exists. The coin pretends to breed independently of the labour and nature that actually create value. *That’s* the unnatural divorce Aristotle sees – the measure pretending to be the thing measured, the symbol claiming generative power.

  **Leo:** Okay, that’s a stronger formulation: interest severs the symbolic representation (money) from the real production it should measure and facilitate. But what about my second test case? Imagine a currency where the unit isn’t a metal disc, but a ‘Herd-Share.’ One Herd-Share entitles you to one healthy adult goat from the communal herd today. But because the herd naturally breeds, one Herd-Share *next year* entitles you to, say, 1.1 goats – the extra 0.1 reflecting the herd’s natural increase. Is redeeming a Herd-Share next year for more than you could get this year ‘unnatural’? The unit itself, by convention, represents a claim on a self-reproducing asset.

  **Elara:** (Leans back, thoughtful) That’s clever, Leo. It forces the question: is Aristotle’s objection fundamentally about the *material* of money (metal), or about its *function*? In your Herd-Share system, the ‘currency’ isn’t primarily a medium of exchange *in the abstract*. Its value is directly and intrinsically tied to the productive, reproducing asset it represents. It’s less ‘money’ as Aristotle understood it – a universal, sterile measure – and more like a literal share certificate for a specific, fertile asset. The increase isn’t generated by the *symbol* (the Share), but by the *goats*. The Share merely tracks their natural increase.

  **Leo:** Precisely! So, if Aristotle’s core argument is that money *as a sterile medium of exchange* shouldn’t ‘breed’, I agree – but only if we accept his narrow definition of money. If money *can* be designed as a claim on productive, growing assets, then its increase isn’t unnatural; it’s a faithful representation of the underlying reality. The problem isn't interest per se, but money being *divorced* from real value creation. Isn't the real ‘unnatural’ act the detachment of coin from any tangible productive base, making its increase arbitrary and potentially exploitative?

  **Elara:** That’s a crucial distinction. Aristotle *would* likely condemn a Herd-Share *if* it started being traded purely for more Shares, disconnected from the actual herd and its management. He’d see it becoming chrematistic. His objection to interest isn't *just* sterility of metal, but the transformation of the *telos* of wealth-getting. Natural acquisition has a limit – the needs of the well-run household. Unnatural chrematistics, especially money breeding money, seeks limitless accumulation for its own sake, bypassing or exploiting the actual processes of production (*poiesis*) and use (*chresis*). The sterility argument underscores why money *can’t* be the *source* of growth; it can only be its measure or its means. Interest, when divorced from shared risk in actual productive labour or assets, *masquerades* as if the coins themselves are fertile.

  **Leo:** So, the genuine disagreement lies in the *function* we assign to money? For you – and Aristotle – its primary, defining function is as a *measured medium of exchange and unit of account*, inherently sterile because it's a convention of measurement. Any apparent ‘growth’ of the money itself must therefore be an illusion masking exploitation or a share in real production elsewhere. For me, money *can* legitimately function as a *store of value representing claims on productive assets*, and its increase can naturally reflect the growth of those assets, as with the Herd-Share or seed grain seen as capital.

  **Elara:** Almost. I’d add that for Aristotle, the *unnaturalness* arises when the pursuit of that increase – whether through detached coin-interest or speculative Share-trading – becomes an end in itself, detached from the proper aim of facilitating the good life of the *polis* through well-managed households. The sterility of coin highlights the absurdity of treating the measure as the source. Your Herd-Share works precisely because it *doesn’t* pretend the symbol breeds; it acknowledges the goats do the work.

  **Leo:** And I maintain that Aristotle’s focus on the inertness of metal blinded him to how monetary *claims* on natural increase can be legitimate. But we agree on the core: the dispute hinges on whether money’s essential nature *precludes* it from legitimately representing and accruing value from underlying growth, or whether Aristotle’s definition was too constrained by his material reality. The question of *who performs the work* and whether the lender shares the *risk* of the productive endeavour Aristotle rightly saw as crucial, remains central to judging the ‘naturalness’ of any increase, regardless of the monetary form.

  **Elara:** Exactly. The sterility of coin was his vivid way of pointing to a deeper principle: value isn’t conjured from symbols, but from work and nature. Whether a specific interest charge violates that principle depends on what the money represents and the relationship between lender, borrower, and the actual source of the surplus. The pun on *tokos* points to a real argument about the origin of value.

  **Leo:** And whether that argument definitively *condemns* all interest, or merely a particular, detached form of it… well, I suppose that herd isn’t quite settled yet. Another coffee?

  **Elara:** (Smiling) Only if you promise it won’t bear interest before we finish it. Lead on.

  **(They gather their books, the unresolved tension now clearly framed around the function and representational nature of money, and the inescapable link between value and real-world production.)**
