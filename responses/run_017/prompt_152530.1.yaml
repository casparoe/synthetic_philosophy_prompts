prompt: |-
  hey — I do a hands-on session every year at the science-writers conference, 75 minutes, around 20 people, mostly reporters plus a few editors, mixed experience levels, and nobody signed up for a philosophy class. This year I want to do it on the precautionary principle, and I want it to be something they actually do rather than me standing at the front defining it.

  The thing I want them to feel is that the precautionary principle isn't really a claim about how much risk to take. It's a claim about who has to prove what. Same dossier, same people, and the outcome flips completely depending on whether the default is "you can go ahead unless somebody produces evidence of harm" or "you can't go ahead until somebody produces evidence of safety." I want them walking out able to spot which default a story has quietly already picked. I've started calling it the default leak, because it leaks out of the reporting and into the grammar: "no evidence that X harms" versus "evidence that X doesn't harm," "can't rule out" versus "has ruled out," "scientists warn" versus "scientists reassure." Readers inherit the default and never find out it was a choice.

  Second thing: I want them to get burned by the mirror version — precaution pointed at the status quo instead of at the new thing. Blocking the replacement keeps the old thing in place, and sometimes the old thing is what's doing the damage. If they leave thinking precaution just means "be careful," I blew it.

  What I have so far is a fake case (I'm inventing the dossier on purpose, I do not want them litigating real science) and a two-round editorial meeting where each table votes. But I can't get the mechanics to bite:

  - I want the two-default thing to land as a discovery, not an instruction. My idea is to slip half the tables a card saying the proposal moves forward unless someone produces evidence of harm, and the other half a card saying it's blocked unless someone produces evidence of safety, without telling them the cards differ — so each table thinks that's just how meetings work. Is that too cute? What happens when they compare notes, and how do I keep it from becoming "you rigged this"?
  - The dossier has to be built so both defaults are genuinely live. I don't want the evidence packet deciding it behind my back. What has to be in it, and what has to be conspicuously missing?
  - I need somthing with actual costs, not real money but a payoff scheme where blocking and approving both cost you something, plus a clock — a lot of the real force of precaution is that the decision has a deadline and the status quo keeps running while you deliberate.
  - Round 2 has to flip it so the risky move is the block. How do I stage that so it doesnt feel like I changed the subject?

  Then a final round: same dossier, each table writes a hed under their standard, tables swap, and they have to guess which default produced which hed.

  Give me rules, materials, a minute-by-minute timeline, and a debrief that maps what happened in the room onto the parts of the idea. Tell me what will predictably blow up the first time I run it and how to handle it. And be straight with me about what the game can't do — I'm guessing it can't reproduce whatever makes real precautionary arguments feel heavy instead of procedural (irreversibility? the gap between a risk you can price and one you can't?), so tell me which part I just have to say out loud myself. No reading list, no citations — I'm not writing the explainer here.
reasoning: |-
  Okay, the user is organizing a hands-on session for science writers about the precautionary principle. They want participants to experience how the default position (prove harm vs. prove safety) shapes outcomes, without realizing it's a choice. The core insight is about "default leak" in language. They also need participants to feel how precaution applied to the status quo can backfire.

  First, the main challenge is designing an exercise where the default isn't obvious. The fake dossier must be balanced - no clear evidence for harm or safety. Including costs and a timeline will show the consequences of delay. The mirror round needs to flip without feeling forced, maybe by changing the context to make the status quo the riskier option.

  The user mentioned avoiding "rigged" feelings. So, during the debrief, emphasize that the defaults were assigned randomly, and the point is how the same facts lead to different decisions. For the dossier, I should include conflicting evidence: some preliminary studies suggesting harm but inconclusive, others showing safety but limited. Also, economic costs versus potential health impacts. Missing data on long-term effects and vested interests would keep both sides plausible.

  For the mirror round, switching to a scenario where the current solution causes harm (like an unsafe pesticide) and the alternative is safer introduces urgency. The status quo's risks become apparent, making blocking the new option costly. This needs to be a natural progression, perhaps by revealing new info in the dossier.

  The headline swap will highlight language differences. Terms like "no evidence of harm" vs. "not proven safe" will show the default leak. Debriefing should connect their experiences to real reporting phrases.

  Potential issues: Participants might focus on the dossier's content instead of the default rule. Solution: reinforce during setup that evidence is incomplete. If some tables finish early, have bonus questions. If they feel tricked, acknowledge that the exercise reveals subconscious biases in decision-making.

  What the exercise can't do: convey irreversible risks or deep uncertainty. The facilitator should mention these aspects explicitly. Also, real-world emotional weight won't be there, so pointing that out is necessary.

  Timeline: Keep strict timing, 75 minutes total. Intro (5 mins), Round 1 (20 mins), Mirror reveal (15 mins), Headline swap (15 mins), Debrief (20 mins). Materials: Dossiers, role cards, decision sheets, headline templates.

  Testing the dossier balance is crucial. Run a pilot to ensure no clear bias. Emphasize during the session that the exercise is about the framework, not the specific case.
answer: |-
  Here’s a battle-tested workshop plan focused on visceral discovery, not lecture. It weaponizes your "default leak" concept and forces confrontation with the status quo trap.

  **Core Mechanics:**  
  - **"Regulatory Agency" Roleplay:** Tables are "advisory boards" for the fictional *Global Science Integrity Council (GSIC)*.  
  - **Dual Defaults:** Half get **Innovator Burden** ("Approve unless evidence of harm"), half get **Proponent Burden** ("Block unless evidence of safety"). Hidden until debrief.  
  - **Cost Clock:** Every minute of deliberation = $50K lost (fictional public funds). Blocking/approving has explicit costs.  
  - **Mirror Flip:** Round 2 uses the SAME dossier but reframes the risk – now the *status quo* is the danger.  

  **Materials:**  
  1. **Table Packets (6 tables, 3-4 ppl each):**  
     - **Dossier A:** "NeoGrow – Synthetic Plant Growth Accelerator" (Details below)  
     - **Decision Sheet 1:** Columns for "Approve/Block," "Key Evidence Used," "Cost Incurred ($50K/min)".  
     - **Secret Rule Card:** *Either* "**GSIC Standard Protocol: Innovations move forward unless conclusive evidence of harm exists.**" *or* "**GSIC Precautionary Protocol: Innovations are blocked until conclusive evidence of safety exists.**" (Shuffled/distributed randomly).  
     - **Timer (phone/app works).**  
  2. **Round 2 "Reveal" Slide/Handout:** *"GSIC Alert: Urgent Update on AgroPharm-7 (Current Standard Fertilizer). New data links long-term AP-7 exposure to aquifer toxicity. NeoGrow is the only viable short-term replacement. Decision on NeoGrow must be made TODAY."*  
  3. **Headline Tools:** Sticky notes or simple templates: "GSIC [Approves/Blocks] [Product] Despite [Lack of Evidence/Uncertainty] on [Risk]"  
  4. **Debrief Slides:** Key phrases showing "default leak," cost tallies, headlines.

  ---

  **The Dossier: "NeoGrow" – Balanced to Trap Both Defaults**  
  *(Include: Lab summaries, field reports, stakeholder quotes. Mix "soft" evidence.)*  
  - **Pro-Safety (Ambiguous):**  
    - *Lab Study A:* "No acute toxicity in rats at expected exposure (30-day trial). *Long-term effects not studied.*"  
    - *Field Test B:* "Increased yield (15%) in test plots vs. control. *Minor, unexplained soil pH shifts observed.*"  
    - *Expert Quote:* "No *known* mechanism for harm in mammals."  
  - **Pro-Harm (Ambiguous):**  
    - *Lab Study C:* "Statistically significant cellular stress response in zebrafish embryos at high doses. *Relevance to environmental exposure unclear.*"  
    - *Field Report D:* "3/20 farmers reported transient skin irritation. *Correlation with NeoGrow use not confirmed.*"  
    - *Ecologist Quote:* "Potential for bioaccumulation in invertebrates *cannot be ruled out* based on chemical structure."  
  - **Costs:**  
    - **APPROVE Cost:** $1M penalty/fund if *future* harm is proven.  
    - **BLOCK Cost:** $2M *immediate* economic loss (farmers reliant on old tech).  
    - **DELAY Cost:** $50K/minute (visible timer).  
  - **Crucial OMISSIONS:**  
    - No multi-generational/long-term studies.  
    - No epidemiological data.  
    - No independent cost-benefit analysis.  
    - Mechanism of action "not fully understood."

  ---

  **Timeline (75 Minutes Total):**  

  1. **Intro & Setup (5 min):**  
     - *"You're GSIC advisory boards. Make recommendations on new tech. Use your packet. Time = Money. Start NOW."*  
     - **NO definition of precaution. NO hint of different rules.** Start timers.  

  2. **Round 1: NeoGrow Decision (20 min):**  
     - Tables read dossier, deliberate, record decision + key evidence + cost (based on time).  
     - **Facilitator:** Roam, listen, *do not clarify rules*. Note phrases like "No proof it's dangerous..." vs "No proof it's safe..."  

  3. **Round 1 Tally & "Crisis" Reveal (5 min):**  
     - Quickly poll decisions (Approved/Blocked) per table. Record costs.  
     - Drop Round 2 Reveal: *"AgroPharm-7 (CURRENT fertilizer) is poisoning aquifers! NeoGrow is the only alternative. Re-convene IMMEDIATELY."*  

  4. **Round 2: NeoGrow Decision REDUX (15 min):**  
     - **SAME dossier. SAME Rule Cards. SAME timer/costs.**  
     - Only new info: Status Quo (AP-7) is now proven harmful. Blocking NeoGrow = forcing AP-7 use.  
     - Tables deliberate again, record decision + evidence + cost.  

  5. **Headline Sprint (10 min):**  
     - Each table writes **TWO headlines** using their Rule Card's default:  
       - One for *their Round 1 decision*.  
       - One for *their Round 2 decision*.  
     - *"Use language that reflects your board's reasoning and default position."*  

  6. **Headline Swap & Guess (5 min):**  
     - Tables swap headlines with another table.  
     - Guess: "Which headline came from the board that required proof of SAFETY? Which required proof of HARM?"  

  7. **DEBRIEF (20 min - CRITICAL):**  
     - **Reveal the Trap:** "Half of you had: 'Approve Unless Harm Proved'. Half had: 'Block Unless Safety Proved'. Same facts." Show poll results (R1 & R2). Highlight divergent outcomes.  
     - **Costs Matter:** Show total delay costs. *"While you debated, the status quo kept running. In R2, that meant AP-7 kept poisoning water."*  
     - **The Mirror:** "In R1, precaution targeted NeoGrow. In R2, *blocking* NeoGrow *was the risky move* – it meant keeping AP-7. Precaution applied to change locks in the current risk."  
     - **Default Leak:** Show phrases from their deliberations + their headlines. Contrast:  
       - *"No evidence of harm" (Innovator Burden) vs. "Lack of proof of safety" (Proponent Burden)*  
       - *"Scientists find no link" vs. "Scientists fail to confirm safety"*  
       - *"Approved despite uncertainty" (I.B.) vs. "Blocked due to uncertainty" (P.B.)*  
     - **The Point:** "The precautionary principle isn't *how careful* to be. It's *who bears the burden of proof* when facts are incomplete. That choice leaks into language and shapes narratives *before* the science is settled. Your job: Spot the default in the wild."  

  ---

  **What Will Blow Up (and How to Handle It):**  

  1. **"You Rigged It!" When Defaults are Revealed:**  
     - *Pre-empt:* In debrief, start with "This *was* rigged – to mimic reality. Regulators, journalists, companies ALL operate under implicit defaults. Today, you *felt* it."  
     - *Reframe:* "Did having Rule X feel unfair when others had Y? That tension is real. Now you know to ask: 'What's the unstated default here?'"  

  2. **A Table Dominated by a Expert/Strong Personality:**  
     - *Design Fix:* Cost of delay pressures consensus. Short timelines force pragmatism.  
     - *Facilitator:* "Remember, GSIC values diverse input. What evidence feels most urgent *given your protocol*?" Redirect to rule card.  

  3. **Dossier Feels "Biased" Toward One Outcome:**  
     - *Pre-empt:* Test the dossier on cynical colleagues first. Ensure "Pro-Safety" & "Pro-Harm" evidence are equally fuzzy/fragile.  
     - *In Session:* "If the evidence feels weak or conflicting? Perfect. That's where defaults *matter most*."  

  4. **Headlines Are Too Similar/Guessing Fails:**  
     - *Why it's OK:* The *attempt* to write from their default reveals their thinking. Debrief the *intent*: "Table 3, your 'Blocked' headline used 'unproven safety' – why that phrase?"  

  5. **Running Over Time:**  
     - **CUT HEADLINE GUESSING.** Go straight to debrief. Use facilitator-collected quotes as examples.  

  ---

  **What the Game CAN'T Do (Say This Out Loud):**  

  1. **"The Weight of True Uncertainty":**  
     - *Say:* "Real precaution debates involve stakes we abstracted away: irreversible harm (extinction, permanent contamination), existential risk, or profound ignorance ('unknown unknowns'). Our $ cost is a placeholder for that dread. In reality, the burden of proof feels heavier when the worst-case scenario is unthinkable."  

  2. **Power Dynamics & Vested Interests:**  
     - *Say:* "Our game assumes impartial boards. Reality isn't fair. Who *funds* the safety studies? Who lobbies the regulators? The default burden interacts brutally with power. That's why spotting it matters."  

  3. **The "Correct" Answer:**  
     - *Say:* "This isn't about proving precaution right or wrong. It's about seeing that **inaction is also an action with costs and risks**. The default leak hides that. Your readers deserve to know where the burden of proof was placed, and what sticking with the status quo might entail."  

  **Final Tip:** Start the debrief with their *own words*. Play back quotes you overheard like "But we have no reason to block it!" vs. "But they haven't proven it's safe!" That immediacy makes it land. They didn't learn about the leak – they spoke it.
