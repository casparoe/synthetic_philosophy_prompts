  Also, their phrasing "whole fight just about which variable" suggests they view this as a shallow empirical dispute. Actually, the theories embed different visions of knowledge: contextualism makes it linguistic (semantics shifts), encroachment makes it psychological (rational belief depends on stakes). This meta-point deserves mention—it affects how they frame their paper. 

