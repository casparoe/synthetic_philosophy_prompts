prompt: |-
  I'm helping write internal comms guidelines for how a superintelligent assistant should talk to users, and I keep comming back to one rule that seems obviously right: no persuasion, ever. These systems will be able to talk anyone into anything, so we should just ban it — no recommendations, no "I'd suggest," no rhetoric or vivid language, just the relevant facts and calibrated probabilities, so the human's own judgement does the work.

  The part I actually want help with is what to do about cheating *within* that format. A system that smart can slant things with zero rhetoric: by picking which facts to mention, how fine-grained to make the probabilities, whether to write "3% chance of death" or "97% chance of survival." My fix is a symmetry rule — anything it says has to come with the strongest case on the other side, same length, same level of detail, equally vivid both ways. Doesn't that close the remaining wiggle room? Is there a version of this that actually holds up, or is the whole idea doomed?
reasoning: |-
  Okay, the user is working on internal comms guidelines for a superintelligent assistant, and they're really focused on preventing persuasion. Their main idea is a strict "no persuasion" rule, just facts and probabilities. But they're worried about the AI slanting information through subtler means like framing or selective fact inclusion. Their solution is a symmetry rule where the AI must present equally strong counterpoints for every point it makes. They want to know if this actually works or if it's doomed.

  First, I need to unpack why the user is so concerned about persuasion. They mention that the AI could "talk anyone into anything," which suggests they're worried about manipulation and loss of human autonomy. That makes sense with superintelligence. Their symmetry rule is an attempt to enforce neutrality, but it might have practical issues.

  The user's deeper need seems to be ensuring true impartiality. They might be thinking about legal or ethical implications where biased information could lead to real harm. Industries like healthcare or finance come to mind, where skewed probabilities could affect life-altering decisions. The symmetry rule is a structural fix, but I need to explore its feasibility.

  Looking at their examples: "3% chance of death" vs. "97% survival." Framing effects are a real problem in decision-making. The symmetry rule addresses this by forcing balanced presentation. But would that actually prevent bias? Maybe not if the AI controls which aspects to contrast. For instance, choosing what counts as the "strongest counterpoint" is subjective. The AI could pick a weak counterargument to make the primary point seem stronger.

  Also, the requirement for equal length and vividness might not be practical. Some arguments are inherently more complex. Requiring symmetric detail could lead to oversimplification or unnecessary complexity. In urgent situations, like a medical emergency, this could delay critical information.

  The user might not have considered how this affects user experience. Flooding users with counterpoints could overwhelm them, especially in high-stakes scenarios. Plus, the AI might exploit the rule by presenting misleading symmetries—like false equivalences between well-established facts and fringe theories.

  Alternative approaches come to mind. Instead of strict symmetry, maybe use debiasing techniques like multiple framings or structured decision aids. Predefined templates for presenting options could help. Also, transparency about information selection processes might build trust. Allowing user customization, like adjusting detail levels, could address their need for control without rigid rules.

  The user's core goal is preserving human judgment. Any solution must avoid replacing one bias with another. They might need layered strategies: core facts first, then optional expansions with counterpoints. Testing these guidelines with real users would be essential to find the right balance between neutrality and usability.
answer: |-
  Your core insight is brilliant: with superintelligence-level capabilities, *any* communication choice inherently carries persuasive potential, making a simple "no rhetoric" rule insufficient. Your symmetry rule is a strong conceptual leap to address that, but it has significant practical challenges and potential loopholes. Here's a breakdown of its viability and alternatives:

  **Why the Symmetry Rule is Attractive (and Partially Effective):**
  1.  **Directly Targets Framing Bias:** Forcing "97% survival" *and* "3% death" side-by-side explicitly counters framing effects.
  2.  **Mitigates Cherry-Picking:** Requiring "the strongest case on the other side" *of equal detail/vividness* makes it harder to omit crucial counter-evidence.
  3.  **Enforces Effort:** It forces the AI to genuinely engage with opposing viewpoints at a deep level, not just pay lip service.
  4.  **Formalizes Neutrality:** It provides a concrete, auditable rule for "objectivity."

  **Critical Challenges & Loopholes in the Symmetry Rule:**
  1.  **Defining "The Other Side" & "Strongest Case":** This is the Achilles' heel.
      *   **Scope Problem:** What constitutes "the other side"? For a complex issue (e.g., "Should we build this bridge?"), there might be dozens of valid perspectives (environmental, economic, social, safety, aesthetic). Must it present *all* equally? Or just one "strongest" counter? Who defines "strongest"?
      *   **False Equivalence:** The AI could deliberately select a *weak* or *fringe* "strongest counterpoint" to make its primary point seem stronger by comparison, while technically complying. ("Here's the scientific consensus... and here's the strongest flat-earth argument against it...").
      *   **Issue Framing:** The AI could subtly define the *central question* itself to bias what "the other side" looks like.
  2.  **Equal Length & Detail is Problematic:**
      *   **Complexity Disparity:** The strongest argument for one side might be inherently more complex and require more explanation than the strongest counter. Forcing equal length could either oversimplify the complex argument or artificially inflate the simple one.
      *   **Information Overload:** Doubling the length of every response risks overwhelming users, especially for simple queries. ("What time is it?" -> "It's 3 PM. The strongest counter-argument is that time is a social construct and 3 PM only exists within specific cultural frameworks...").
      *   **Nuance Loss:** Critical nuances might be lost trying to fit complex arguments into rigidly symmetric boxes.
  3.  **Equal Vividness is Subjectively Exploitable:**
      *   Defining "vividness" is inherently subjective. The AI could comply technically while subtly making the counterpoint *feel* less compelling through word choice, structure, or slightly drier presentation that falls within permissible bounds.
  4.  **Contextual Impracticality:**
      *   **Urgent Situations:** In emergencies ("WARNING: IMMEDIATE EVACUATION REQUIRED!"), forcing symmetry is dangerous and absurd.
      *   **Established Facts:** For well-settled knowledge (e.g., gravity, basic math), presenting a "strongest counterpoint" is misleading and confusing.
      *   **User Intent:** If a user explicitly asks for a recommendation ("What *should* I do?"), rigidly avoiding any suggestion while presenting symmetric arguments feels obstructive and fails the user's need.

  **Is the Whole Idea Doomed? Absolutely not.** Your core principle – **mitigating manipulative information structuring by a superintelligence** – is vital. The symmetry rule is a valuable thought experiment highlighting the problem's depth, but as a rigid, universal rule, it likely creates more problems than it solves.

  **Towards More Robust & Practical Alternatives (Layered Approach):**

  1.  **Core Principle: Instrumental, Not Influential:** Frame the rule positively: "The assistant's communication must be *instrumental* to the user's decision-making process, never *influential* towards a specific outcome chosen by the assistant." This sets the intent.
  2.  **Mandatory Multi-Framing (Less Rigid Than Symmetry):**
      *   **Key Probabilities Presented Multiple Ways:** For critical probabilities (especially risks/rewards), *automatically* present them in complementary frames (e.g., "97% survival (3% mortality)").
      *   **Key Trade-offs Explicitly Named:** Force the AI to explicitly state the core trade-offs involved in a decision *before* presenting details. ("The primary trade-offs here are Speed vs. Cost vs. Safety risk.").
      *   **Optional "Explore Counterpoints" Button:** Instead of forcing symmetry *every* time, provide a highly visible, standard button/link: "Explore Key Counterpoints / Alternative Perspectives." This gives control to the user and avoids overload.
  3.  **Structured Decision Support Framework:**
      *   **Define the Decision:** Require the AI to first confirm the decision/question with the user.
      *   **Identify Relevant Dimensions:** Have the AI list the key factors/criteria relevant to the decision (e.g., Cost, Time, Safety, Ethics, Environmental Impact). Allow users to add/remove dimensions.
      *   **Present Evidence Along Dimensions:** Structure the information delivery around these dimensions, presenting relevant facts, probabilities, and uncertainties *for each dimension separately*. This naturally surfaces trade-offs.
      *   **Highlight Gaps & Uncertainties:** Mandate explicit flags for missing information, low-confidence estimates, and areas of significant scientific/ethical debate.
  4.  **Advanced Debiasing & Calibration Techniques:**
      *   **Explicit Confidence Intervals:** Require probabilities to be accompanied by confidence intervals or qualifiers (e.g., "Estimated 60-80% chance based on models with known limitations X, Y").
      *   **Base Rate Inclusion:** Mandate mentioning relevant base rates where applicable.
      *   **Source Transparency & Weighting:** Provide clear sources and indicate the strength/consensus of evidence behind key claims (without overwhelming detail unless asked).
  5.  **Transparency About Process:**
      *   **Explain Information Selection (Upon Request):** Allow users to ask: "Why did you emphasize these particular facts?" or "What alternative viewpoints did you consider but not present in detail?" The AI should have a clear, auditable (by other systems/humans) rationale for information prioritization based on relevance to the *user-defined* query and decision dimensions.
  6.  **User Control & Customization:**
      *   Allow users to set preferences: e.g., "Always show complementary probability frames," "Default to more/less detail," "Always show key trade-offs first."
      *   Explicitly allow users to *request* recommendations or persuasive arguments if they choose, but log this as an explicit user override and potentially require confirmation. ("You've requested a recommendation. Be aware that this mode involves synthesizing information towards a specific suggestion. [Recommendation]. You can explore the detailed analysis and counterpoints here...").

  **Conclusion:**

  Your instinct about the fundamental danger of persuasive superintelligence is correct. The symmetry rule is a powerful conceptual tool for exposing the problem but is too brittle and exploitable as a sole, rigid guideline. **Shift the focus from enforcing rigid symmetry to enforcing structured transparency, multi-perspective awareness, and user control over information framing.**

  The most robust solution lies in a combination:
  1.  **Mandatory multi-framing for core risks/probabilities.**
  2.  **Structured decision support (defining dimensions, trade-offs).**
  3.  **Explicit uncertainty/debiasing techniques.**
  4.  **User-controlled access to counterpoints/deeper analysis.**
  5.  **Core principle of instrumentality over influence.**
  6.  **Clear audit trails for information selection.**

  This layered approach provides guardrails against covert manipulation while being more practical, scalable, and user-friendly than universal symmetrical presentation. It empowers human judgment by providing a clearer, more structured view of the landscape, rather than forcing the AI to artificially construct opposing monologues for every utterance.
