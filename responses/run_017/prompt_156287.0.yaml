  The user has given me several specific requirements: I need to invent a measurement unit (they suggested "substitution rate" - how many standard famine-years people would accept to avert the event), address the denominator problem (absolute vs. per-capita impact), include a ceiling mechanism using administrative efficiency as a tiebreaker, handle interrupted atrocities where intent matters more than outcome, and grapple with downstream effects like famines and demographic consequences.

  I should avoid naming real historical events and instead use placeholder codes like "Event 14 (steppe famine, 1930s)" to keep this as a thought experiment rather than an actual ranking. The humor needs to come from the inherent absurdity of quantifying atrocities while maintaining a completely deadpan, bureaucratic tone. No winking at the reader or obvious jokes.

  For structure, I'll format it like a real government RFP with numbered sections: Scope of Work, Mandatory Methodology, Deliverables, Evaluation Criteria, and then a Questions from Bidders section at the end. I'll make sure to hit all the required elements while keeping it around 700 words.

  The Q&A section is crucial - I need to include that question about whether contractors must publish rankings including their own government's actions, and have the Office give a perfectly bureaucratic non-answer about following procedures. And I must remember that the contract goes to the "lowest compliant bid" - a nice touch that highlights how absurd it is to treat this like any other procurement.

  I'll develop each required element carefully: the substitution rate unit presented as objective measurement, the unresolved tension between absolute and proportional impact, the chilling tiebreaker using deaths per bureaucrat-hour, the moral hazard of ranking unfinished atrocities higher than completed ones, and the philosophical quagmire of counting consequences. The humor will emerge from presenting these impossible dilemmas with bureaucratic certainty.

  For the league table teaser, I'll include two placeholder examples that show how the methodology leads to counterintuitive rankings - like an interrupted genocide outranking a completed one because of "intent capture." This demonstrates the reductio ad absurdum without needing commentary.

  The tone must remain clinical throughout - no sarcasm, just dry bureaucratic language describing the indescribable. The satire works because the document takes itself completely seriously while asking contractors to solve problems that philosophers have wrestled with for centuries.
answer: |-
  **INTERGOVERNMENTAL OFFICE FOR ATROCITY ASSESSMENT (IOAA)**
  **REQUEST FOR PROPOSALS (RFP) IOAA-2024-007**
  **CONTRACT FOR DEVELOPMENT OF THE COMPARATIVE SEVERITY INDEX (CSI)**

  **1. Introduction**
  The Intergovernmental Office for Atrocity Assessment (IOAA), established under the Treaty of Basel (2021), seeks proposals from qualified contractors for the development, calibration, and initial population of a Comparative Severity Index (CSI). The CSI will provide a single, standardized numerical value quantifying the severity of designated historical atrocity events, enabling objective comparison for museum curation, educational prioritization, and reparations framework development.

  **2. Scope of Work (SOW)**
  The Contractor shall:
      2.1. Design and develop the computational framework for the CSI.
      2.2. Define and implement the standardized unit of measurement (see Section 3.1).
      2.3. Populate the CSI with initial values for the pre-defined list of 50 Priority Atrocity Events (PAE List, Annex A - Classified, provided upon contract award).
      2.4. Develop a transparent methodology documentation suite.
      2.5. Establish protocols for future addition and re-evaluation of events.
      2.6. Deliver a fully functional CSI database and user interface (web-based).

  **3. Mandatory Methodology**
  The Contractor **must** adhere to the following methodological principles:
      3.1. **Unit of Measurement:** Severity shall be quantified in **Standard Famine-Year Equivalents (SFYE)**. One (1) SFYE represents the aggregate severity that an informed, impartial jury would accept as a substitution for averting one (1) year of a defined reference famine (Event 07 - Reference Famine, 1890s). *The SFYE is a measurement of objective severity, not a preference metric.*
      3.2. **Denominator Requirement:** The CSI must calculate and present **two (2) distinct values per event**:
          *   3.2.1. **Absolute Severity (CSI-A):** Total impact measured in SFYE, irrespective of the affected population size.
          *   3.2.2. **Proportional Severity (CSI-P):** Impact measured in SFYE per 100,000 individuals within the defined Target Population at the onset of the event. Target Population definition criteria are provided in Annex B (Confidential).
      3.3. **Severity Ceiling & Tie-Breaking:** To avoid saturation and enable meaningful ordinal ranking where CSI values are computationally equivalent within tolerance thresholds:
          *   3.3.1. A Severity Ceiling of 100,000 SFYE is established. Events calculated above this ceiling are assigned 100,000 SFYE.
          *   3.3.2. For events assigned the ceiling value (100,000 SFYE), ranking ties shall be broken using **Administrative Efficiency (AE)** metrics. Higher AE indicates greater severity within the ceiling cohort. The Contractor must calculate:
              *   AE1: SFYE generated per documented bureaucrat-hour expended by the perpetrating administrative apparatus.
              *   AE2: SFYE generated per constant (2020) USD equivalent of expenditure by the perpetrating administrative apparatus (adjusted using IOAA-provided economic indices).
          *   3.3.3. *Example Draft Ranking Snippet:* "Event 33 (Ceiling): AE1=142.7; Event 19 (Ceiling): AE1=89.3; Event 05 (Ceiling): AE1=62.1".
      3.4. **Intent Capture for Interrupted Events:** For atrocities demonstrably halted prior to perpetrator objective completion (per IOAA Historical Intent Assessment Dossiers - Annex C, Classified), the CSI calculation **must incorporate the projected full outcome based on documented intent and trajectory**. A successfully interrupted event may possess a higher CSI value than a completed event of lesser projected ultimate severity. *This is a core feature reflecting the full potential severity.*
      3.5. **Downstream Effects Inclusion:** CSI calculation **must include quantifiable downstream effects** occurring within 25 years post-primary event cessation, including but not limited to:
          *   Directly attributable famine mortality/displacement.
          *   Quantifiable reduction in birth rates below expected demographic baselines.
          *   Documented, large-scale permanent population displacement (Diaspora Factor).
          *   Methodology for quantifying these effects is the Contractor's responsibility, subject to IOAA approval.

  **4. Deliverables**
      4.1. **CSI Methodology Handbook:** Comprehensive documentation of algorithms, data sources, weighting, SFYE calibration process, AE calculation, downstream effects quantification, and uncertainty ranges.
      4.2. **Populated CSI Database:** Secure database containing CSI-A, CSI-P, AE1, and AE2 values for all 50 PAE List events. Structure must allow for future expansion.
      4.3. **User Interface (UI):** Secure, web-based interface for authorized IOAA personnel and Member State representatives to query the CSI database (view values, rankings by metric).
      4.4. **Validation Report:** Analysis demonstrating internal consistency and sensitivity testing across the methodology.
      4.5. **Training Materials:** For IOAA staff on database/UI use and methodology interpretation.
      4.6. **Protocols Manual:** Procedures for adding new events, re-evaluating existing events, and handling contested historical interpretations.

  **5. Evaluation Criteria**
  Proposals will be evaluated based on:
      5.1. **Technical Approach (40%):** Demonstrated understanding of SOW; feasibility and rigor of proposed methodology, especially regarding SFYE calibration, downstream effects, and AE calculation; data sourcing plan; UI design.
      5.2. **Qualifications & Experience (30%):** Relevant expertise in quantitative historical analysis, complex metric development, ethics oversight, database development, and working with sensitive historical data. Past performance references required.
      5.3. **Project Management (20%):** Realistic timeline, clear milestones, risk mitigation plan, qualified personnel allocation.
      5.4. **Cost (10%):** Total proposed cost, including all labor, materials, software, and travel. *The contract will be awarded to the responsible offeror submitting the lowest-priced, technically acceptable proposal meeting all mandatory requirements.*

  **6. Submission Requirements**
  Proposals must be submitted electronically via the IOAA Procurement Portal by **2024-11-30, 17:00 UTC**. Complete submission instructions and required forms are on the Portal. Questions per Section 7 below.

  **7. Questions from Bidders**

  *   **Q7.1 (Bidder Gamma Historics):** Regarding Deliverable 4.2 (Populated CSI Database) and future Protocol 4.6: Does the IOAA mandate that the final, approved CSI rankings, including entries potentially implicating current IOAA Member States, be published in the Contractor's name or as part of the public-facing methodology?
  *   **A7.1 (IOAA Procurement):** Publication protocols are determined solely by the IOAA Governing Council per Treaty Article XIV. The Contractor’s responsibility is the development and delivery of the CSI system and its initial population based on the provided PAE List and mandated methodology. Public dissemination, if any, is an IOAA prerogative following established diplomatic procedures. The Contractor shall adhere to all confidentiality clauses within the resulting contract regarding data handling and output.

  **END OF RFP**
