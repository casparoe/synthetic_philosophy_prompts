answer: |-
  Here are the desiderata for a criterion of conscious subject unity, designed for clinical/legal application while respecting phenomenal consciousness. Each requirement includes its grounding case(s), negotiability status, and key distinctions preserved. Theoretical tensions and family assessments follow.

  ### Core Desiderata
  1.  **Non-arbitrary Subject Individuation (Non-negotiable)**
      *   *Case:* Adjustable cortical link (dialed down). Two initially distinct subjects become progressively integrated. The criterion must specify principled thresholds or a non-arbitrary basis for counting subjects at varying integration levels.
      *   *Distinction:* Preserves "how many subjects?" as distinct from "how many agents/persons?" (e.g., one legal person might contain >1 subject).
      *   *Bearing on Experience:* Requires linking subjecthood to properties intrinsic to experiential organization, not just external report.

  2.  **Phenomenal Unity Primacy (Non-negotiable)**
      *   *Case:* Intra-hemispheric dissociations (e.g., blindsight, neglect). An experience can be phenomenally present (e.g., affective response to unseen stimulus) yet unavailable for report or rational action.
      *   *Distinction:* Demarcates *phenomenal co-consciousness* (what is unified *within* the experiential field) from *functional access* (availability for global report/reasoning/volitional action). The former is fundamental.
      *   *Bearing on Experience:* Directly addresses "what it's like for the subject." Split-brain confabulation shows report ≠ experience.

  3.  **Unified Ownership Despite Disunity (Non-negotiable)**
      *   *Case:* Stipulated simultaneous answer case. Both hands disclaim knowledge of the *other answer* but agree the *written answer* (both!) is "hers." Subjecthood persists despite co-consciousness failure.
      *   *Distinction:* Separates unity *of* experiences (co-consciousness) from unity *in* being the subject *having* those experiences (ownership). The latter may be more fundamental/basic.
      *   *Weight:* This is likely the *most constraining desideratum*, severely challenging theories that tie subject identity tightly to maximal experiential unity or access.

  4.  **Minimal Unity for Singular Subjecthood (Preference: Phenomenal/Integration camps)**
      *   *Case:* Acallosal subjects & hemispherectomy patients. They exhibit sufficient functional coherence and lack conflicting reports/actions in daily life, suggesting a baseline level of unity suffices for one subject, even if less than neurotypical.
      *   *Distinction:* Allows that minimal unity (phenomenal or functional) defines one subject, without requiring maximal or total unity.
      *   *Requirement:* Avoids proliferating subjects unnecessarily in cases of reduced but non-conflicting integration.

  5.  **Third-Party Applicability (Non-negotiable)**
      *   *Case:* Locked-in syndrome, severe aphasia, callosotomy patient unable to report verbally on left-visual-field experiences. Clinicians/legal systems need inferential criteria based on behavior, neural data, or controlled tests.
      *   *Distinction:* Requires criteria applicable externally, without relying solely on the subject's unreportable phenomenology.
      *   **TENSION:** Direct conflict with (2). Resolving this (e.g., finding reliable *proxies* for phenomenal unity accessible to 3rd parties) is a major hurdle.

  6.  **Legally Actionable Verdict on Agency/Responsibility (Non-negotiable)**
      *   *Case:* Callosotomy patient's left hand performs an unlawful act. Did the verbally reporting subject (LH) commit the act? Is the RH a responsible agent? Legal systems require a binary ascription (guilty/not guilty, responsible/not).
      *   *Distinction:* Forces clarity on "how many agents?" even if "how many subjects?" is complex. Legal agency may map imperfectly to subjecthood.
      *   **TENSION:** Direct conflict with graded unity approaches suggested by (1) adjustable link and (4). Requires the theory to output a binary *agency* verdict even if subject unity is graded.

  7.  **Accommodates Gradation without Collapse (Preference: Integration camps)**
      *   *Case:* Adjustable cortical link. Unity plausibly increases/decreases continuously with bandwidth. The criterion should reflect this without implying either "always one subject" or "sudden switch at threshold X."
      *   *Distinction:* Allows unity *at a time* to be a matter of degree (while preserving a core notion of singular subjecthood via (3)), distinct from unity *over time* (persistence).
      *   *Requirement:* Must still provide a basis for the non-arbitrary counting in (1).

  ### Theoretical Families & Constraining Desiderata
  *   **Access/Workspace (e.g., Dehaene):** Prioritizes global availability (report/reasoning/action). *Strong on (5, 6)*. **Fails (2, 3)** spectacularly (confuses access with phenomenology/ownership; split-brain shows disunity despite potential for unified "ownership" response). *Struggles with (1, 7)*.
  *   **Phenomenal/Co-consciousness (e.g., Bayne, Dainton):** Prioritizes phenomenal unity relations. *Strong on (2, 4)*. **Fails (3)** (if strict unity is required, the simultaneous answer case suggests disunity but unified ownership). *Struggles severely with (5, 6)* (external access) and *(7)* (gradation).
  *   **Integration (e.g., Tononi's IIT, Cleeremans):** Defines unity by informational integration. *Strongest on (1, 4, 7)*. *Potential* to address (3) if self-model/integration defines ownership. **Fails (2)** if integration ≠ phenomenology. *Struggles with (5, 6)* (complex Φ calculation impractical; mapping Φ to agency/verdicts unclear).
  *   **Higher-Order (e.g., Rosenthal, Lau):** Unity via meta-cognitive awareness. *May handle (3)* if ownership is HO state. *Tenuous on (5)*. **Fails (2)** (HO states ≠ phenomenal unity; neglect/blindsight show phenomenality without access/HO awareness). *Struggles with (1, 4, 7)*.
  *   **Indeterminacy (e.g., Schechter, maybe Nagel):** Denies precise count is always possible/meaningful. *Accommodates (1, 4, 7)*. **Fails (3)** (unified ownership claim seems determinate) and catastrophically **fails (6)** (legal system cannot function with indeterminacy on agency).

  **Most Constraining Desideratum:** **Unified Ownership Despite Disunity (3)**. This requirement, driven by the simultaneous answer case, is uniquely devastating for theories requiring maximal phenomenal unity (Phenomenal) or maximal access (Workspace) for subject unity. It forces a separation between the *subject* and the *current state/degree of unity* within that subject's consciousness, demanding an account of subject identity that persists through significant disunities. This significantly narrows the field towards views emphasizing a persisting self-model, ownership relation, or minimal integrative core defining the subject itself, even if experiences within it aren't fully unified.
