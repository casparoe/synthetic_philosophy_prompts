  Hmm, the user is describing an archaeological dispute with their friend Sam about the interpretation of blocked doorways and dog burials in a settlement. They want me to role-play as their former PhD supervisor Renata based on her past rulings in similar cases. I need to analyze this systematically.

  First, I need to reconstruct Renata's potential interpretive rules from her track record. The key precedents are:
  - Repeated household practices allowed (niches with figurines) but without belief content labels
  - Unique grave objects restricted to display by buriers
  - Administrative institutions inferred from reproducible mechanisms (seal workshop)
  - Architecture interpreted only for demonstrable functions (differential access)
  - Context-specific object functions required (same figurines in temple/house)
  - Rejection of vague "cultic" labels without practice specification
  - More permissive with single-episode deposits (burned settlement)
  - Artifact distribution tied to provisioning systems (state jars in houses)

  Several candidate rules emerge here:
  1) Independent repetition rule - emphasizes decentralized replication (best fits the niche case)
  2) Cost/gratuitousness rule - looks for non-functional investments (fits the unique grave object case)
  3) Contrast class requirement - needs variability to infer norms (supported by state jars case)
  4) Mechanism trace principle - requires evidence of production/transmission (clear from seals case)

  Rules 2 and 4 both reduce to requiring evidence beyond mere presence - what Renata would call "tracers of how it got there." The mechanism trace is particularly fundamental across her rulings.

  For the threshold case:
  - Independent repetition would reject belief claims since all houses show identical work (explains away the uniformity)
  - Cost/gratuitousness would see the dog burials as costly enough for belief (explains the puppies as non-functional)
  - Contrast class would block any norm inference (no variation between houses)
  - Mechanism trace would note the builders' mortar as institutional evidence (explains identical technique)

  The strongest precedent is the state-issued storage jars case - both involve uniform features tied to the settlement's initial provisioning. Renata would likely see this as administrative action, rejecting resident beliefs while allowing institutional closure practices. Sam's "protective practice" might survive if framed mechanistically, but "belief" would be struck out.

  To settle this, I'd look for construction-phase evidence: if blocking mortar underlies occupation layers in more houses, it points to original design. Finding variation (even one unblocked house) would support Sam's interpretation. The current evidence leans toward administration due to uniformity and builder materials.
answer: |-
  Based on Renata's documented rulings, here's the breakdown:

  **1. The Rules She Might Be Running**

  *   **Rule 1: Independent Repetition (Leans hardest on: Plastered Niches & Figurines).** Repetition only signifies shared meaning/belief if it arises independently from decentralized agents over time/space. Identical replication in a single episode or by a central authority indicates imposed practice, not emergent belief. *Collapses into Mechanism Trace.*
  *   **Rule 2: Cost/Gratuitousness (Leans hardest on: Unique Grave Object).** Belief attribution requires features that are functionally unnecessary or costly relative to practical needs. Purely functional or low-cost features reflect practice/logistics, not necessarily belief. *Collapses into Mechanism Trace.*
  *   **Rule 3: Contrast Class Requirement (Leans hardest on: State-Issued Storage Jars).** To infer a norm or belief, there must be variability – some houses/contexts *without* the feature. Universal presence in a standardized context (like planned settlements) is evidence of provisioning/specification, not internalized belief.
  *   **Rule 4: Mechanism Trace Principle (Leans hardest on: Seal Images & Monumental Building).** Attributing an "institution" or "shared belief" requires direct evidence of the *mechanism* enabling replication/transmission (e.g., workshops, specific construction techniques) or the *practice* itself. The trace of *how* it was done is primary; belief/content is secondary and often unsupported. *This is the anchor rule; Rules 1 & 2 collapse into it by demanding evidence of *how* the repetition/cost occurred.*

  **2. What Each Predicts About Your Thresholds**

  | Rule                  | Belief Attribution Licensed? | Whose Practice?                                 | Belief or Institution Claim? | What It Explains Away                                                                 |
  | :-------------------- | :--------------------------- | :---------------------------------------------- | :--------------------------- | :------------------------------------------------------------------------------------ |
  | **Independent Repetition** | **No**                           | **Builders/Administrators** (centralized action) | **Institution** (practice)   | Uniformity & single episode prove copying/command, not independent household belief. |
  | **Cost/Gratuitousness**    | **Maybe (Residents?)**       | Ambiguous (Who buried dogs?)                    | **Belief** (if residents did it) | Dog burials *are* costly/gratuitous, *suggesting* belief. But uniformity points away from households. |
  | **Contrast Class**        | **No**                           | **Builders/Administrators**                     | **Institution** (spec)       | Universal presence in identical houses means no norm contrast; it's part of the "kit". |
  | **Mechanism Trace**       | **No (Belief); Yes (Practice)** | **Builders/Administrators**                     | **Institution** (practice)   | Identical mortar/technique *is* the mechanism trace (central authority). Dog burial *practice* traceable, *belief* content unsupported. |

  **3. Your Call**

  Renata's most likely verdict: **No belief attribution to the *residents* is licensed. The practice is traceable to the *builders/administrators* (either at closure or original construction) as an institutional action. It's an institution/practice claim, not a belief claim about the inhabitants.**

  The **closest precedent is the State-Issued Storage Jars**. Like the jars coming with the house, the blocking (and potentially the burial practice) is supplied uniformly by the authority provisioning or closing the settlement. The identical mortar/technique is the **mechanism trace**, proving centralized execution (Seals precedent). The universal presence negates a resident-driven norm (Contrast Class/Jars precedent). The dog burials, while gratuitous, lack evidence of *resident* agency or belief content beyond the practice itself (Grave Object & Figurine precedents).

  **What survives:** Sam's core point about it being a *protective threshold practice* survives *if* framed as an institutional practice executed by the authority. His "shared household-level" and "belief" claims do not. Your point about the *administration closing the place down* (or building it that way) and the *residents not necessarily thinking anything* survives intact. The key surviving element is the **trace of the mechanism** (builders' materials/technique) proving centralized action.

  **4. What Would Settle It**

  **Excavate beneath the blocking mortar in one of the houses where it *appears* to cut occupation debris, targeting the interface with the original floor makeup.**

  *   **If Rule 1/3/4 (Admin/Builders):** Expect the mortar to be *integral* with the original floor makeup beneath the thin occupation layer (proving original construction) OR to show the "occupation debris" is actually construction fill/leveling (supporting closure campaign consistency).
  *   **If Rule 2 (Resident Belief - Sam):** Expect clear, thick, *in situ* occupation debris (e.g., hearth ash, food remains) *directly underneath* the blocking mortar, proving it truly cut living floors, making resident agency plausible. Even then, Renata would demand proof residents did the work/burial, not just lived there when it happened.
  The **mortar-floor makeup interface** is the critical tracer. Integration with original construction or closure campaign debris supports centralized action (Rules 1,3,4). Clear cutting of thick, genuine living debris *might* open the door for resident agency (Rule 2), but the uniformity and technique would still heavily favor administration.
