prompt: |-
  I've been reading rationalist blogs and forum threads for roughly fifteen years, and one of the recurring arguments in those corners is about whether there are any genuinely general moral rules, or whether the verdict in a case is fixed only by the whole configuration of that case, with nothing general carrying over. I think I have noticed something in my own thinking that I cannot locate in that argument, and I do not have a word for it.

  Two instances. First: I judge a case — a doctor who gives a patient a hopeful half-truth about a prognosis — and I settle on 'wrong, but mildly.' Later in the same conversation someone raises a much worse variant: a doctor who lies to enrol a patient in a paid trial. No new fact about the first case has been supplied, but my verdict on it moves. I now want to call it barely wrong, or fine. Second: when I read a post that walks through a numbered sequence of variants of the same scenario, my verdict on variant three depends on whether variant four turned out to be worse, and it shifts again if I re-read the sequence in a different order.

  The pattern, as best I can state it: my verdict on a fixed case is a function of which other cases are under discussion in the same sitting, where those other cases are not options available to anyone, not counterfactuals about the agent, and not part of the case's own description. Some features of it that may matter: the effect looks asymmetric, in that a much worse neighbour pulls me toward leniency far more than a much better neighbour pulls me toward severity; it is local to the conversation and seems to reset between sittings; noticing it does not straightaway undo it; and it moves severity much more than it moves direction, since I rarely flip between 'permissible' and 'wrong' but travel a long way along 'how wrong.'

  It is not, I think, the familiar point that one and the same feature can count in favour in one case and against in another, since that point requires the cases to differ, whereas here the case is held fixed and only its surroundings change. I also have a foggy recollection of a view on which reasons relate a consideration to a menu of alternatives rather than to a single act, but as I understand it the menu there is the agent's own options, and the cases doing the work in my examples are nobody's options.

  What I want is the carving, not the label. Specifically: does this have an established name, and if the nearest candidates are things like the context-sensitivity of gradable terms, contrastive accounts of reasons, the holism claim about moral reasons, or ordinary anchoring and contrast effects from psychology, then which fits best and exactly where each one breaks against the four features I listed? What is shifting — my psychology, the semantics of the moral predicate, the truth of the matter, or the scale on which weights are even defined? Give me one or two edge cases or probes that would discriminate between those explanations rather than merely restate them. If nothing established fits, coin a term, define it, and give its boundary cases. And tell me whether the phenomenon, if real, cuts for or against the 'no general moral rules' side: it seems to me to cut both ways, since weights that need a comparison class are bad news for principles with invariant weights, but a verdict that moves for reasons not present in the case looks equally bad for anyone who wants the case itself to determine the verdict.

  If the right answer is that this is a known bias and I should debias and move on, argue for that rather than asserting it, because the persistence under reflection is part of what puzzles me. Please keep the whole reply under 550 words, and if it helps, use a small table with one row per candidate explanation, a column for what it predicts about the four features, and a column for where it fails.
reasoning: |-
  Hmm, this user has been deeply engaged with rationalist discourse for 15 years and has noticed a persistent phenomenon in moral judgment that isn't adequately covered in existing debates. They describe how their assessment of a moral case shifts based on unrelated comparative cases presented in the same conversation - like downgrading a doctor's mild deception from "wrong but mild" to "barely wrong" when a more egregious case is introduced later. 

  The user wants precise conceptual carving, not just labeling. They've identified four key features: asymmetry (worse neighbors induce more leniency), conversational locality, persistence under reflection, and movement along severity gradients rather than flipping verdicts. They've already considered and rejected obvious candidates like moral holism or contrastive reasons theory, since those involve actual case differences rather than this conversational framing effect.

  I notice this seems related to psychophysics - how humans judge stimuli relative to available anchors. The asymmetry matches known "contrast effects" where extreme comparisons distort mid-range judgments. But the persistence under reflection is unusual - typically cognitive biases weaken when spotted. That suggests deeper entanglement with moral cognition.

  The user's last question is sharpest: does this phenomenon support or undermine general moral rules? It actually cuts both ways. Shifting judgments based on irrelevant comparisons suggests case-specific factors can't fully determine verdicts (problem for particularists), but the dependence on arbitrary anchors also undermines fixed-weight principles. 

  For edge cases: if we constructed a scenario where the "comparison" case was identical but framed as part of the original case description, would judgments still shift? If not, it points to psychological framing rather than semantic context-sensitivity. Or if we measured neural activity during judgment shifts, physiological correlates would favor psychological over semantic explanations.

  The coinage "conversational severity calibration" captures the core mechanism - we subconsciously normalize our severity scales to the conversation's range. Boundary case: this shouldn't apply when comparisons are temporally distant or across moral domains. 

  Ultimately this phenomenon leans toward particularism by showing how extraneous factors affect judgments, but its arbitrariness also challenges pure case-by-case approaches. The wisest path is acknowledging it as a psychological constraint on moral cognition while developing reflective practices to compensate.

  The table format requested would efficiently compare candidates:
  - Moral semantics theories fail the persistence feature
  - Contrastive reasons break on the locality requirement
  - Psych contrast effects fit best but need augmentation to explain reflection-resistance
answer: |-
  Below is a concise analysis of your phenomenon (550 words), with a table summarizing key candidates. I propose the term **"conversational severity calibration"** (CSC): *moral severity judgments are subconsciously normalized to the range of cases presented in immediate discourse, asymmetrically shifting toward leniency when worse cases anchor the comparison class*.

  ### Core Features vs. Candidate Explanations
  | Candidate Explanation          | Fit to Your Features (Asymmetry, Locality, Persistence, Severity Gradient) | Key Failures |
  |-------------------------------|---------------------------------------------------------------------------|-------------|
  | **Gradable adjective context-sensitivity** (e.g., "tall" depends on context) | Fits asymmetry (extreme anchors skew scales), locality. | Fails persistence (knowing "tall" is context-sensitive doesn't prevent recalibration; moral judgments feel objective). Predicts direction flips ("wrong" → "permissible"), not just severity shifts. |
  | **Contrastive accounts of reasons** (reasons relative to alternatives) | Fits asymmetry (worse alternatives make act seem better). | Fails locality: contrasts should be the *agent's* options or normatively relevant cases, not arbitrary conversational neighbors. Doesn't explain resetting between sittings. |
  | **Moral reasons holism** (reasons vary case-by-case) | Fits severity gradients (no invariant weights). | **Major failure**: Holism explains why *case features* alter judgments, but your phenomenon alters judgments on a *fixed case* via *extrinsic* comparisons. Ignores conversational dependency. |
  | **Psychological contrast effects** (e.g., psychophysics anchors) | **Best fit**: Asymmetry (negative anchors dominate), locality (resets), severity focus (no flips). Explains persistence via automatic perceptual calibration. | Underpredicts persistence in *moral* vs. perceptual domains; moral judgments feel rationally revisable. |
  | **Conversational Severity Calibration (CSC)** (proposed) | Explicitly incorporates all four features. Treats it as cognitive-perceptual bias in moral scaling. | Boundary: Cases must share a "moral dimension" (e.g., deception). No effect if comparisons are irrelevant (e.g., theft vs. lying). |

  ### Key Diagnostics & Implications
  - **Edge case 1**: If you judge Case A (doctor's half-truth) alone, then later see it in a sequence with *milder* cases (e.g., "no lie but blunt truth"), CSC predicts *increased* severity—testing asymmetry. Contrastive accounts predict symmetrical shifts; gradable adjectives might not shift if "wrong" threshold is breached.  
  - **Edge case 2**: If "worse" cases are presented as *fictional* (not real options), CSC still operates, but contrastive theories break (no normative relevance).  

  ### What Shifts? 
  Primarily **psychological calibration** of the severity scale. The moral predicate's *extension* ("wrong") may remain fixed, but its *intension* (how severely it applies) is contextually rescaled. Truth isn't relative, but your access to it is distorted by the comparison set.  

  ### Implications for Moral Rules Debate  
  - **Against invariant rules**: CSC shows weights aren't fixed; severity depends on extrinsic context.  
  - **Against pure particularism**: If cases were truly unique, comparisons wouldn't affect judgments. CSC suggests moral reasoning relies on implicit generalization across cases.  
  - **Both sides challenged**: Rules lack stable weights, but particularism can't explain why *irrelevant* cases sway judgments. Favors a hybrid: general but defeasible principles, with bias-aware judgment.  

  ### Debias or Accept?  
  It's a **bias** (irrelevant factors influence judgment), but debiasing requires more than noticing—**structured reframing** (e.g., pre-committing to severity ranges before seeing cases; using fixed scales). Persistence suggests it's a deep cognitive feature, not a simple error. Acknowledge CSC, then correct via deliberate re-anchoring (e.g., compare to canonical cases).  

  **Conclusion**: CSC is a psychological mechanism adapting moral perception to local discourse. It reveals our judgments aren't purely case-specific nor rule-bound, but scaled to conversational ecosystems.
