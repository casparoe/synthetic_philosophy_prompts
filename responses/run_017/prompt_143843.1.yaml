prompt: |-
  I work in pricing at a life insurer, and I've been pulled onto a small internal committee that has to sign off on single-case probability statements: for an individual applicant we have to file a number — the probability that this person survives to ninety — and our regulator wants to know which population we derived it from. The same applicant can be placed in a broad class (all fifty-five-year-old nonsmokers), or in successively narrower ones (fifty-five-year-old nonsmoking men with treated hypertension, in a given occupation, at a given income band), and the observed frequencies in those classes disagree, sometimes by enough to move the premium by more than our entire margin on the policy. Anyone can always add one more attribute — the applicant's commute, their year of birth, their mother's age at death — and narrow the class until it contains almost no one, at which point the frequency is either undefined or trivially zero or one. Whoever picks the class effectively picks the price, and I don't yet know what should constrain the picking.

  A colleague on the committee, who came from physics, says we are overthinking it. His line is that the reference class is like a coordinate chart on a manifold: the chart is our choice, the point — this applicant — is not, and the quantity we are after is a coordinate-independent object that every admissible chart describes correctly in its own vocabulary. On that picture the choice of class is mere descriptive bookkeeping, there is one true single-case probability underneath, and any class that satisfies our data-quality rules is as good as any other one for computing it. He has even sketched what he thinks the analogue of the transition maps should be: a consistency requirement saying that whenever two admissible classes both contain the applicant, they must yield the same frequency for the outcome, in which case the class you pick cannot change the answer — and if two classes do disagree, that is only evidence that one of them was not really admissible.

  I find the picture appealing but suspicious, and I would like it audited rather than either accepted or waved away. Please lay the correspondence out explicitly — a table is fine — saying what plays the manifold, the point, the chart, the transition maps, and the invariant, and then where the mapping fails; please separate the failures that matter for the work this analogy is being asked to do from the ones that are merely decorative. In particular: is his consistency condition something our data could ever satisfy, or is it the conclusion restated as an axiom? In the coordinate case every chart is equally legitimate and there is no notion of a better one, whereas in our case some classes look plainly better than others — narrower and more homogeneous, yet still large enough to estimate a frequency from — and I cannot see what plays that in his picture, especially when the analogy is being used to argue that our choice is unconstrained. And is the single-case probability really like curvature, waiting to be read off in any notation, or is it something the analogy quietly assumes? If the coordinate picture is the wrong one, is there a comparison that fits better — choosing a resolution or grain, choosing a sampling frame, choosing what total to divide by? Finally, given that we still have to file a number next quarter, say what the audit recommends: does any version of "any admissible class will do" survive, and if not, what rule for choosing a class should we actually adopt, and what would justify that rule to a regulator?
reasoning: |-
  We are given an analogy from differential geometry: the reference class problem in probability is likened to choosing a coordinate chart on a manifold, with the single-case probability being a coordinate-independent object. We are to audit this analogy by explicitly laying out the correspondence and then identifying where it fails, especially in the context of the regulator's requirement and the practical problem of setting a premium.

  The physicist's analogy:
  - The manifold: the space of all possible individuals (or perhaps the space of all attributes that define an individual).
  - A point on the manifold: a specific individual (the applicant).
  - A coordinate chart: a reference class (a set of attributes that define a group of individuals).
  - The invariant: the true single-case probability of the event (e.g., surviving to 90) for that individual.
  - Transition maps: a consistency condition that whenever two reference classes (charts) contain the individual, they must assign the same probability (i.e., the same frequency for the event in that class).

  The analogy suggests that the probability is an inherent property of the individual (like the geometric object at a point on the manifold) and that any admissible reference class (chart) should yield the same value when we compute the frequency in that class (like reading coordinates in a chart). The transition maps would then be the rules that relate the frequencies in different reference classes that contain the same individual, and if two charts (classes) yield different frequencies, then one of them is not admissible (i.e., not a valid chart for that point).

  Audit of the analogy:

  1. **The invariant (true single-case probability)**: In the geometric analogy, the invariant (e.g., the curvature at a point) exists independently of the chart. But in probability, is there a true single-case probability for an individual? Frequentist statistics does not typically assign a probability to a single event (it is either 0 or 1, but we don't know which). The frequentist interpretation relies on long-run frequencies in a reference class. The Bayesian view would assign a subjective probability, but that is not what we are doing here (we are using observed frequencies). The analogy assumes that such an invariant exists and is well-defined, but in reality, we are trying to estimate it by choosing a reference class. So the analogy may be circular: the invariant is what we are trying to compute, and we are assuming it exists and is the same in every chart.

  2. **Admissible charts and the consistency condition**: The analogy requires that if two reference classes contain the individual, then the frequency of the event in both classes must be the same. But in practice, we expect that adding more attributes (narrowing the class) will change the frequency. For example, the mortality of 55-year-old nonsmokers is different from that of 55-year-old nonsmokers with treated hypertension. Therefore, the consistency condition is not satisfied by real data. The physicist's response is that if two classes disagree, then one of them is not admissible. But what makes a class admissible? The analogy does not specify, and in practice, we have no way of knowing which class is the "right" one. Moreover, the regulator is asking which population we derived the probability from, so we must choose one.

  3. **The problem of narrowing the class**: The analogy does not address what happens when we narrow the class to the point that it contains very few individuals. The frequency becomes unstable (high variance) or undefined. In the manifold picture, a chart must cover a neighborhood of the point, but if we narrow the class too much, we don't have enough data to estimate the frequency. The analogy does not incorporate the statistical reliability of the estimate.

  4. **Choosing a better chart**: In the analogy, all charts are equally legitimate. But in practice, we prefer a reference class that is narrow enough to capture relevant characteristics (to reduce bias) but wide enough to have a stable estimate (to reduce variance). The analogy does not account for this trade-off because it assumes that every chart gives the same value. But they don't, so we must choose among them. There is no notion in the analogy of a chart being "better" in the sense of having a lower mean squared error.

  5. **What the regulator wants**: The regulator wants to know which population we used. The analogy suggests that it doesn't matter because the probability is the same in every admissible class. But if we cannot achieve the consistency condition, then we are forced to choose, and the choice does matter.

  Where the analogy fails for the task at hand:

  - The core failure is that the consistency condition (that two classes containing the individual must yield the same frequency) is not satisfied in practice. Therefore, the analogy does not hold because the transition maps (which would require consistency) cannot be defined. Without consistency, the invariant is not well-defined by the charts.

  - The analogy is being used to argue that the choice of reference class is unconstrained (any admissible class will do). But without a way to enforce the consistency condition, we cannot guarantee that different classes give the same answer. Therefore, the argument that "any admissible class will do" is circular: we define a class as admissible only if it gives the same answer as others, but we have no independent way to determine admissibility.

  Alternative analogies:

  - **Choosing a resolution or grain**: Like choosing the bin width in a histogram. Too coarse and we lose details (bias), too fine and we have too much noise (variance). We need to balance these. This is the bias-variance trade-off.

  - **Choosing a sampling frame**: In survey sampling, the sampling frame must be representative of the population we wish to study. But here, we are defining the population by attributes. We want a frame that is representative of the individual in all relevant aspects.

  - **Model-based approach**: Instead of choosing a reference class, we build a statistical model (e.g., a logistic regression) that uses multiple attributes to predict the probability. The model would smooth the data and allow us to use all available information. The model then defines the probability for the individual as a function of their attributes. This is a common approach in insurance (e.g., using generalized linear models).

  Recommendations:

  1. **Reject the physicist's analogy as a justification for unconstrained choice of reference class**: The consistency condition is not satisfied by the data, so the analogy fails. We cannot assume that any reference class will yield the same probability.

  2. **Adopt a model-based approach**: Instead of choosing a single reference class, use a statistical model that incorporates multiple attributes. This model can be trained on historical data and then applied to the individual. The model will naturally handle the trade-off between bias and variance (e.g., via regularization). The regulator can be told that we are using a model that accounts for the individual's attributes (age, smoking status, hypertension, etc.) and that the model was validated on out-of-sample data.

  3. **If we must choose a reference class**: Develop a rule that balances homogeneity and sample size. For example:
     - Start with a broad class that has a large enough sample size (e.g., at least 100 events) and then narrow by attributes that are known to be strong predictors (e.g., smoking status, hypertension) until the sample size becomes too small (set a minimum sample size threshold, say 50 individuals).
     - Use domain knowledge to decide which attributes are most relevant to mortality (e.g., medical conditions, lifestyle factors) and fix the order of stratification.

  4. **Justification to the regulator**: We can argue that the chosen reference class (or model) is based on actuarial standards and has been validated to be predictive. For a model, we can show performance metrics (e.g., area under the ROC curve, calibration plots). For a reference class, we can show that the attributes used are known risk factors and that the sample size is sufficient for a stable estimate.

  5. **Handling the single-case probability**: We must be clear that we are providing an estimate of the probability based on the best available data and methods, and that it is not a "true" single-case probability (which is a philosophical concept). The regulator should be satisfied with a well-justified and transparent method.

  In summary, the audit recommends against relying on the coordinate invariance analogy because it does not hold in practice. Instead, we should use a model-based approach or a well-defined rule for reference class selection that balances bias and variance. The chosen method should be documented and justified by predictive accuracy and stability.
answer: |-
  ### Audit of the Coordinate Analogy for Reference Classes  
  Below, I explicitly map the physicist's analogy to the reference class problem, then identify where it fails—categorizing failures as **critical** (undermining the regulatory task) or **theoretical** (philosophical but less urgent). I conclude with recommendations.

  ---

  #### **Explicit Correspondence Table**  
  | **Differential Geometry Concept** | **Reference Class Analogy** | **Role in the Problem** |
  |----------------------------------|------------------------------|--------------------------|
  | Manifold (\(\mathcal{M}\))      | Space of all possible human attributes | Abstract "universe" of risk factors (e.g., age, health, genetics). |
  | Point (\(p \in \mathcal{M}\))    | Individual applicant (\(A\)) | The specific person being priced (e.g., 55-year-old nonsmoking male with hypertension). |
  | Coordinate chart (\(U, \phi\))   | Reference class (\(C\))      | A subset of individuals sharing attributes (e.g., "55-year-old nonsmokers" or "nonsmokers with treated hypertension"). |
  | Transition maps (\(\phi \circ \psi^{-1}\)) | Consistency requirement      | Rule that frequencies in overlapping classes must agree for \(A\). |
  | Invariant (e.g., curvature)      | True single-case probability (\(P_A\)) | Hypothetical "objective" probability \(A\) survives to 90. |
  | Admissible chart                 | "Valid" reference class      | Class satisfying data-quality rules (e.g., sample size > threshold). |

  ---

  #### **Where the Analogy Fails**  
  **Critical Failures** (Undermine regulatory/pricing goals):  
  1. **Transition maps are empirically impossible**:  
     - **Problem**: The consistency condition (frequencies must match for \(A\) in overlapping classes) **cannot hold in real data**. Narrower classes often yield different frequencies (e.g., mortality for "all 55yo nonsmokers" vs. "55yo nonsmokers with hypertension").  
     - **Why it matters**: This condition is an *axiom*, not a conclusion. In practice, classes disagree due to:  
       - **Confounding**: Unmeasured variables (e.g., genetics) bias narrower classes.  
       - **Finite data**: Smaller classes have higher variance (e.g., 0% survival if \(C\) has 1 member who died).  
     - **Consequence**: The analogy assumes \(P_A\) is invariant if "admissible" classes agree—but they rarely do, making "admissibility" circular.  

  2. **No such thing as "the" invariant (\(P_A\))**:  
     - **Problem**: In geometry, curvature is intrinsic; here, \(P_A\) is **not an observable property** of \(A\). It is *defined* through a reference class.  
     - **Why it matters**: The regulator asks, "Which population?" because \(P_A\) *is* the frequency in the chosen class—there is no deeper "true" \(P_A\) to uncover. The analogy smuggles in an assumption that \(P_A\) exists independently.  

  3. **Admissibility lacks statistical criteria**:  
     - **Problem**: Geometry treats all charts as equally valid. Here, some classes are **statistically better** (e.g., narrower + homogeneous but large enough for stable estimates). The analogy ignores:  
       - **Bias-variance tradeoff**: Narrow classes reduce bias (better homogeneity) but increase variance (small \(n\)).  
       - **Causal relevance**: Attributes like "commute time" may be noise, while "hypertension" is causal.  
     - **Consequence**: If "any admissible class will do," pricing becomes arbitrary—contradicting the goal of risk-based fairness.  

  **Theoretical Failures** (Philosophical but less urgent):  
  - **Manifold structure**: Human attributes aren’t a smooth manifold. Adding attributes (e.g., "mother’s age at death") can create discontinuous "jumps" in risk, violating coordinate smoothness.  
  - **No global chart**: Unlike geometry, no single reference class covers all \(A\) without underfitting or overfitting.  

  ---

  #### **Better Analogies**  
  The coordinate analogy is fundamentally flawed for this task. Prefer:  
  1. **Choosing a resolution/grain**:  
     - Like pixel size in an image: Too coarse (broad class) misses details; too fine (narrow class) adds noise. Optimal grain balances homogeneity (detail) and stability (sample size).  
  2. **Choosing a sampling frame**:  
     - The reference class is the "frame" from which we sample to estimate frequency. Better frames are representative of \(A\) and minimize selection bias.  
  3. **Model-based smoothing**:  
     - Rather than discrete classes, use a model (e.g., logistic regression) to "smooth" attributes into a probability. This avoids arbitrary class boundaries.  

  ---

  #### **Recommendations for the Committee**  
  **Reject "any admissible class will do"**:  
  - The analogy’s consistency condition is unrealistic, and \(P_A\) is not coordinate-invariant. Arbitrary class selection risks regulatory rejection or unfair pricing.  

  **Adopt a Rule for Choosing Classes**:  
  1. **Stratify by causal/relevant attributes first**:  
     - Prioritize attributes with **strong causal links** to mortality (e.g., smoking, hypertension) over incidental ones (e.g., income, commute).  
     - *Justification to regulator*: Aligns with medical/actuarial standards (e.g., CDC mortality risk factors).  

  2. **Optimize for bias-variance tradeoff**:  
     - Start broad (e.g., "55yo nonsmokers"), then narrow until:  
       - Sample size \(\geq N_{\text{min}}\) (e.g., 100 lives or 20 events).  
       - Further narrowing changes frequency by \(<\delta\) (e.g., \(\delta = 0.5\%\)).  
     - *Justification*: Balances accuracy (low bias) and stability (low variance). Document sensitivity tests.  

  3. **Use models where classes conflict**:  
     - If classes disagree materially, fit a **parametric model** (e.g., Cox regression) using multiple attributes. The model output is your \(P_A\).  
     - *Justification to regulator*: Uses all relevant data efficiently; standard in insurance pricing (e.g., GLMs).  

  **Communicate Transparency**:  
  - File the number alongside:  
    - The chosen reference class (or model specification).  
    - Sample size and frequency in that class.  
    - Sensitivity analysis (e.g., "Premium varies ±X% if class changes").  
  - This satisfies the regulator’s goal: Traceability and avoidance of arbitrary choices.  

  **Short-Term Fix for Next Quarter**:  
  - Use a **hierarchy of attributes** (e.g., age > smoking > hypertension > occupation) and select the narrowest class with:  
    - \(n \geq 50\) lives and \(\geq 10\) events (deaths/survivals).  
    - Frequency stability (e.g., bootstrapped CI width \(< 5\%\)).  
  - Example: For your 55yo nonsmoker with hypertension, use "55yo nonsmokers with hypertension" if \(n \geq 50\); else, use "55yo nonsmokers."  

  --- 

  **Final Summary**: The coordinate analogy fails because reference classes are *not* arbitrary charts—they are statistical choices with real bias-variance tradeoffs. Prioritize causal relevance, stability, and transparency. For contentious cases, models outperform discrete classes. This approach is defensible to regulators as "risk-based, auditable, and non-arbitrary."
