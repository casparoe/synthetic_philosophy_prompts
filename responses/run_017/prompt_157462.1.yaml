prompt: |-
  I sit on the funding committee of a small foundation that moves somewhere between ten and fifteen million dollars a year. We rank causes with the importance–tractability–neglectedness framework that circulates in this part of the philanthropic world: score a cause by the value of solving (or substantially reducing) the problem, multiplied by the share of the problem you can expect to eliminate per million dollars spent, multiplied by how little is already going into it. One of our programme officers has written an internal paper arguing that the framework cannot underwrite a durable funding strategy. I cannot find the mistake in it, and I also cannot accept its conclusion. Reconstructed as cleanly as I can:

  (1) Our score for a cause C is S(C) = I(C) × T(C) × N(C), where I is the value of eliminating the problem, T is expected problem-eliminated per dollar at current spending levels, and N is (inversely) the resources already devoted to C.

  (2) S(C) is not a property of C alone. Both T and N are functions of what other funders are doing, so S depends on other agents' behaviour. Call any quantity with that feature crowding-sensitive. This step is not in dispute; it is why we re-run the ranking each cycle.

  (3) A decision procedure is admissible as the basis of a standing strategy only if widespread compliance with it does not systematically destroy the conditions in virtue of which it issued its recommendation. A procedure that is self-defeating in that sense cannot guide action at scale, however well it serves whoever moves first.

  (4) ITN is self-defeating in precisely that sense. Its top-ranked cause is by construction one that few others are funding. Acting on the recommendation moves money and people into that cause; that raises the resources going to it, which lowers N, which lowers S; and if enough of us act on it, the cause stops being top-ranked. The recommendation erases the ground it stood on.

  (5) None of this turns on the details of ITN. Take any crowding-sensitive quantity, build a rule that says do more of whatever currently scores highest on it, and the same thing happens: successful compliance moves the quantity and withdraws the reason for complying. So no crowding-sensitive framework can support a standing strategy for a community of funders; it can at most give a one-off edge to whoever moves first and quietly.

  (6) But (5) is absurd, and I want to treat that as a reductio. It indicts choosing the shortest queue, arbitraging a mispriced asset, triaging an emergency room by urgency, and allocating wherever marginal return is highest. Every one of those is crowding-sensitive; every one of them is fine. A principle that condemns all of them has condemned optimizing under scarcity as such. So something in (1)–(5) has to go.

  (7) Hence we must restrict or replace the framework. The paper offers three options: treat ITN as a private heuristic valid only for actors too small to move the aggregate; drop N and rank by I × T alone; or replace N with an estimate of the total resources the cause will eventually attract, and fund only where we expect to move that total rather than join it.

  Two things about our situation that I think constrain the answer. First, we commit on a three-year cycle and some of the causes we care about are thirty-year projects, so a framework whose verdicts flip when others move is a real problem for us and not a theoretical one. Second, we cannot measure T directly for most of what we fund — no trials, no clean counterfactuals, and where we do have estimates they are contested. Neglectedness is in the framework largely because it is the best available evidence about where the cheap opportunities are, not because anyone thinks crowding is intrinsically valuable. Assume that stays true.

  There is also a worry I cannot tell whether it belongs to this argument or is a separate one. For a cause to be uncrowded may itself be evidence that better-informed funders looked at it and passed — the sidewalk-money thought. On that reading N is not a proxy for untapped opportunity but a proxy for adverse selection, and multiplying by it is not merely redundant with T but sign-flipping. Does that change the diagnosis, or is it an independent complaint that I should handle on its own?

  So: which step do you reject, and what does rejecting it cost me? Please name the step, explain why it looked innocent, and price the alternatives rather than only the one you pick — in particular, tell me what I lose if I give up (1) rather than (3) or (4), since I would rather keep (2) and (6) than (1). If you intervene at (3), give me the corrected version of the principle and say whether ITN survives it. And if the right answer is that ITN is fine at any given moment but unstable across time, tell me what a committee in our position should do with that instability. One thing I would find unhelpful: being told that ITN is only a heuristic and that heuristics are fine. I know that; it does not tell me which of the three options in (7) to adopt.
reasoning: |-
  Hmm, the user is on a funding committee for a foundation that allocates $10-15 million annually using the ITN framework (Importance, Tractability, Neglectedness). A program officer has argued that ITN is fundamentally flawed as a durable strategy because it's self-defeating - when multiple funders use it, they collectively undermine the very neglectedness that made a cause top-ranked. The user can't find the flaw but can't accept the conclusion either, and wants me to identify which step of the argument is wrong.

  Let me break down this argument. The core claim is that ITN is "self-defeating" because when funders act on its recommendation, they reduce neglectedness (N), which lowers the score (S), making the cause no longer top-ranked. The program officer argues this makes ITN unstable for coordinated use.

  The user presents seven steps in the argument. Step 6 is particularly interesting because it points out that rejecting all crowding-sensitive frameworks would condemn many standard optimization practices like choosing the shortest queue or arbitrage - which clearly work in practice. This suggests the flaw must lie elsewhere.

  I notice the problem might be in step 4's implication. The program officer assumes that when N decreases, S always decreases proportionally. But this isn't necessarily true because tractability (T) often improves with more funding - through economies of scale, network effects, or knowledge sharing. So S might actually increase or stay stable even as N decreases.

  Also, step 3's admissibility principle seems too strict. Frameworks don't need to be perfectly stable to be useful - they just need to guide toward better allocations, even if the landscape shifts. Many systems reach equilibria where resources stabilize at efficient levels.

  For the foundation's context: they fund long-term projects (up to 30 years) and struggle to measure tractability directly. Neglectedness serves as a proxy for opportunity cost. The user also mentions the "sidewalk money" concern - that low N might indicate problems rather than opportunities.

  I think rejecting step 4 is the most defensible approach. The self-defeating claim overlooks how T and N interact dynamically. When funding increases:
  - N decreases (reducing S)
  - But T often increases (raising S) through learning curves and efficiency gains
  - The net effect on S depends on which force dominates

  This explains why systems like shortest-queue don't collapse: as a queue grows, service capacity often expands to compensate.

  For practical solutions, the foundation should:
  - Keep ITN but add dynamic modeling of how T changes with funding
  - Consider option 7c (funding to shift total resources rather than join them)
  - Use neglectedness as one indicator among others
  - Phase funding strategically - seed funding when N is high, then pivot as T improves

  The "sidewalk money" concern is valid but separate - it suggests using N cautiously where information asymmetry exists, rather than abandoning it entirely.
answer: |-
  I reject **step (4)** as the core flaw, though steps (3) and (5) are oversimplified in ways that enable (4)'s error. Below, I’ll dissect why (4) is mistaken, explain why it *seems* plausible, price the alternatives (including your preferred path of rejecting (1)), and address instability and the "sidewalk money" concern. Finally, I’ll propose a practical path forward for your committee.

  ---

  ### **Why Step (4) Is Wrong: The Dynamics of T and N**
  **The error:** Step (4) assumes that when funding increases for a cause, **N (neglectedness) decreases linearly while T (tractability) remains static**. This ignores *dynamic interactions* between T and N. In reality:
  - **T often *improves* with funding**: Early funding unlocks economies of scale, builds expertise, or funds R&D that makes *subsequent* dollars more effective (e.g., developing a malaria vaccine makes distribution cheaper). Thus, as N decreases, T can increase, offsetting the drop in S(C).
  - **N and T are co-dependent**: Neglectedness proxies *current* opportunity cost, but funding can expand the opportunity frontier. If your $1M trial proves a cheap intervention works, T soars, attracting more funders—but your initial investment created that high-T state.

  **Why it looked innocent:** The framework treats I, T, and N as independent inputs. But T isn’t fixed; it’s a function of *cumulative investment*. Step (4) assumes a zero-sum world where funding only dilutes N, ignoring that it can amplify T.

  **Real-world analogy:** In arbitrage, buying a mispriced asset *does* reduce the mispricing (lowering "N"), but if your trade reveals new information or liquidity, it can *increase* "T" (e.g., drawing in more traders, reducing future transaction costs). The system adapts; it doesn’t collapse.

  ---

  ### **Pricing the Alternatives: What You Lose by Rejecting Other Steps**
  Your preferred path is rejecting (1) (the multiplicative S(C) = I × T × N). But let’s evaluate all disputed steps:
  - **Reject (1)**: You lose simplicity and risk misallocating *within* causes. Without N, you’ll fund high-I×T causes even when they’re saturated (e.g., climate tech with $1B/year in VC). Result: **diminishing returns and wasted cash**. If N is your best proxy for opportunity cost (as you note), dropping it leaves you blind to low-hanging fruit.
  - **Reject (3)**: The admissibility principle is mostly sound—but it’s too rigid. We *can* use self-adjusting systems (e.g., market prices). Revised principle: *A strategy is admissible if widespread compliance converges toward equilibrium, not stasis*. ITN survives this: funding flows until S(C) equalizes across causes. You lose a false ideal of "permanent rankings," but gain dynamic efficiency.
  - **Reject (5)**: Correct, as (5) ignores feedback loops (like T’s response to funding). Rejecting it costs nothing—it’s already falsified by functioning systems (e.g., ER triage adjusts staffing as queues grow).

  **Verdict**: Rejecting (4) is least costly. It preserves ITN’s insights while forcing you to model dynamics. Rejecting (1) cripples your ability to spot uncrowded opportunities.

  ---

  ### **Handling Instability: A Strategy for Your Committee**
  ITN *is* unstable at the micro level (rankings shift), but stable at the macro level (it guides resources toward underfunded high-impact areas). For your 3-year/30-year dilemma:
  1. **Phase your funding**:
     - **Year 0–3**: Use ITN to identify *seed opportunities* (high N, uncertain T). Fund pilots to *improve T* (e.g., efficacy studies).
     - **Year 4+**: For successful pilots, recalculate T based on new evidence. If T surges, reduce weight on N (crowding is justified) or exit, letting others scale.
  2. **Embed dynamics in scoring**:
     - Replace static T with **T*(C) = f(current funding, expected ΔT from investment)**.
     - Example: If $1M trial could double T, S(C) today reflects *future* potential. N still anchors initial bets.
  3. **Set "saturation triggers"**: Estimate funding thresholds where N becomes irrelevant (e.g., "When cause X hits $50M/year, switch focus"). 

  ---

  ### **The "Sidewalk Money" Concern: Separate but Critical**
  This is an **independent risk** (adverse selection), not a flaw in ITN’s logic. If funders avoid a cause due to hidden problems, N signals danger, not opportunity. But:
  - **ITN mitigates this**: Low I×T would sink such causes anyway. If a cause has high I×T *and* high N, it’s likely *truly* overlooked (e.g., lead poisoning in 1970s).
  - **Action**: Augment N with **quality checks**:
    - Track *why* others neglect it (e.g., technical infeasibility vs. lack of awareness).
    - Use N as a "flag" for due diligence, not a direct multiplier.

  ---

  ### **Recommendation: Which Option in (7) to Adopt**
  **Modify ITN; don’t abandon it**. Option (7c)—funding to "move the total" rather than "join it"—is closest to the solution, but needs refinement:
  1. **Keep N** as your best proxy for untapped opportunity (since T is hard to measure).
  2. **Add dynamic tractability**: Score causes by **I × [T + expected ΔT from funding] × N**.  
     - *Example*: If a $2M trial could turn a 0.1% problem-reduction/$ into 1.0%, future T is 10× current T. S(C) surges even if N falls post-funding.
  3. **Target "pivot points"**: Fund where you expect to unlock *disproportionate* ΔT (e.g., research creating scalable solutions).

  **Cost of this approach**: It requires forecasting ΔT, which is hard with contested data. But you’re already estimating T; just add a "what if we invest?" scenario. If ΔT is unmeasurable, default to static ITN—it’s still better than ignoring neglectedness.

  **Why not (7a) or (7b)?**  
  - (7a) (private heuristic) fails—you’re too big ($15M/year moves needles).  
  - (7b) (drop N) invites saturation waste.  

  By rejecting step (4) and embracing dynamics, ITN becomes a durable engine for finding high-impact, underfunded opportunities—even if it requires recalibrating rankings every cycle. The instability isn’t fatal; it’s how the framework *learns*.
