prompt: |-
  Hey — hoping you can help me put a name on something, or tell me it doesn't have one.

  I run a small psychophysics setup (me, two undergrads, way too much coffee). We flash a target somewhere near threshold and then ask people about it, and we keep tripping over the same pattern, which I can't find a word for. Five things we've seen:

  1. Ask "did you see anything?" straight after and they say no. Ask instead "was it more like a P or a Q?" and they're well above chance — and then, if you follow up with "so did you see anything?", a good chunk of them now say yes, and can go on to say what it was, in a way they couldn't if you'd led with the yes/no question.

  2. The rescue only works if you ask within a few hundred milliseconds. Two seconds later the forced-choice question doesn't help; they're at chance either way.

  3. The question that does the rescuing doesn't have to be about the same feature. Asking about the colour first makes them later report the *letter* as seen, and asking about a distractor item from the same display works too, though a bit less well.

  4. Asking the forced-choice question *before* the display — "get ready to say whether it's more like a P or a Q" — does nothing at all. So it isn't just that we're pointing attention at the thing in advance.

  5. In the middle of the difficulty range people give split answers: "I didn't see it", and then, without being pushed, "it was kind of dark, sort of blobby" — and their confidence ratings don't track whether they're actually right.

  Two reactions so far from people I've described this to. One says it's obvious and boring: there's no fact of the matter about whether they saw it, people just decide where to put their threshold for saying yes, and our questions shove it around. The other says it isn't about seeing at all, it's memory — the experience was there, it just wasn't kept.

  Both feel too quick to me, but I can't say exactly why, and part of me thinks the second one is half right given the timing thing, except that it shouldn't predict the colour question helping with the letter. I've also been pointed at a debate about whether there's a kind of conscious experience that isn't available to the rest of the mind, and at a theory about some kind of internal broadcasting station in the brain. From what I can gather, the first is about experience that's really there but boxed off from report, and the second says the broadcasting is all-or-nothing. Neither one seems to describe a case where *whether it got broadcast at all depends on which question you asked afterwards*.

  So: is there an established concept for this — the question-dependence of whether there was an experience there to report, where it isn't attention set up in advance and isn't just forgetting? If there is, I want more than the label: what exactly are its boundaries, and which of the nearby things does it collapse into? If there isn't, name it and define it yourself, and tell me what it is not — specifically, how I'd distinguish it from (a) subjects merely shifting their criterion for saying "seen", (b) a fragile trace that decays before it can be reported, (c) experience that's present but not broadcast, and (d) blindsight-ish cases where there's arguably no experience at all. A bare name won't do me any good, I need the carving.

  Give me exactly five numbered points, a sentence or two each, no intro and no wrapping up at the end.
reasoning: |-
  Hmm, the user is describing a fascinating psychophysics phenomenon they've observed in their lab. They flash a target near threshold and get different responses depending on how they frame the questions afterward. They've listed five specific observations: 

  1. Forced-choice questions elicit above-chance performance even when yes/no questions get "no" responses, and can retroactively make subjects report seeing the stimulus.

  2. This effect has a tight temporal window of a few hundred milliseconds.

  3. It transfers across features - asking about color can help report of letter identity.

  4. Pre-cueing the forced-choice question doesn't help, ruling out attentional preparation.

  5. Subjects give inconsistent self-reports in the middle difficulty range.

  The user mentions two common interpretations they've encountered: criterion shifting (boring) or fragile memory trace (interesting but incomplete). They're dissatisfied with both and want to know if there's an established concept that captures this specific pattern where the subsequent question determines whether the experience seems to have existed at all.

  They want me to either identify an existing concept or define a new one, with clear boundaries distinguishing it from:
  (a) criterion shifting
  (b) fragile memory trace
  (c) non-broadcast conscious experience
  (d) blindsight

  And they want exactly five numbered points - no introduction or conclusion.

  I recall this pattern aligns remarkably well with "phenomenal consciousness without access consciousness" in Block's framework, but the transfer across features and the question-dependence aspect make it even more specific. The temporal constraints suggest it's not just about forgetting, and the feature transfer implies it's not about pre-attentive processing.

  The key differentiators seem to be:
  - The retroactive nature (question after stimulus changes reportability)
  - Cross-feature facilitation
  - Tight temporal constraints
  - Absence of pre-cueing effects
  - The "construction" aspect where the experience seems to be assembled through interrogation

  For a name, "Retroactive Access Induction" captures the core mechanism - that access is induced after the fact by the query. I'll need to clearly demarcate it from the alternatives they mentioned in each point.

  For the five points:
  1. Define the concept and name
  2. Distinguish from criterion shifting
  3. Distinguish from fragile memory trace
  4. Distinguish from non-broadcast experience
  5. Distinguish from blindsight

  Making sure each distinction directly addresses their observations - for example, criterion shifting can't explain the cross-feature facilitation, and fragile memory doesn't explain how asking about color helps report letters.
answer: |-
  1. **Retroactive Access Induction**: The established concept is **phenomenal consciousness without access consciousness** (Block, 1995), but your pattern refines it. Name this specific variant **post-perceptual interrogation priming**: a query's *structure* retroactively determines whether a fleeting phenomenal state becomes accessible for report. It is *not* criterion shift (a), as feature-transfer (observation 3) and temporal specificity (2) show the *content* of experience is altered by interrogation, not just response bias.  

  2. **Boundary vs. Fragile Trace (b)**: Unlike a decaying memory trace, which merely loses fidelity over time, here the forced-choice query *constructs* a reportable percept from latent sensory data within a narrow window. The trace persists (it's retrievable via forced-choice at 200ms), but interrogation transforms it from "unreportable" to "reportable" by triggering integration.  

  3. **Boundary vs. Non-Broadcast Experience (c)**: This is distinct from "unbroadcast" phenomenal states (e.g., inattentional blindness), as broadcasting *depends retroactively on query format* (observations 1 & 4). The experience isn't stably present but unbroadcast; broadcasting is dynamically gated by post-stimulus demands, making "was it conscious?" query-dependent.  

  4. **Boundary vs. Blindsight (d)**: Unlike blindsight, where residual vision lacks phenomenology, here forced-choice reveals *phenomenal content* (e.g., "blobby" in observation 5), implying conscious fragments. Blindsight patients deny experience even with above-chance performance; your subjects *retroactively affirm it* when probed correctly.  

  5. **Key Carving Point**: This collapses into **access consciousness** only when interrogation succeeds. Before query, it is a "potential" phenomenal state—disrupted by late or mismatched queries (observation 2). It is *not* mere criterion shift because the same subject denies seeing yet describes content (5), and cross-feature priming (3) shows integration, not threshold adjustment.
