  We are translating formal epistemology concepts (uncertain evidence, Jeffrey conditioning, invariance, etc.) into the vocabulary of reasons, evidence, support relations, defeaters, etc. as used by a non-formal epistemologist.

  Key elements from the formal side:
  1. Uncertain evidence: You don't learn a proposition with certainty, but you get new probabilities over a partition (a set of mutually exclusive and exhaustive events).
  2. Updating rule (Jeffrey conditioning): Hold fixed the old conditional probabilities of hypotheses given each cell of the partition, and update by changing the probabilities of the cells.
  3. Invariance condition: The conditional probabilities P(H|E_i) remain the same after updating. This is what allows the update to be done by just changing the probabilities of the cells.
  4. Non-commutativity: Updating in sequence with two different pieces of uncertain evidence may yield different results depending on the order.
  5. Objection: Some argue you should condition on a proposition about your experience (so-called "propositional" evidence) and that Jeffrey updating is a stopgap.
  6. Patched rules: Weaken the fixed conditional probabilities constraint (e.g., in response to undercutting defeat) so that you can change how a cell bears on a hypothesis (i.e., change P(H|E_i)).

  The case: Reading a scanned manuscript under bad lighting. The scan changes both (a) the confidence in what the word is (which would be the probabilities over the partition of possible words) and (b) the evidential bearing of the appearance (because the scanner might have desaturated the ink, which changes how the appearance supports a particular word).

  User's hypothesis:
  Part 1: The invariance condition (fixed P(H|E_i)) is the requirement that the new input changes only the confidence in the cells (the E_i) and not what those cells indicate (the support relations). This is like a purely rebutting shift without undercutting.
  Part 2: If invariance fails, you can always rescue it by refining the partition until the cells are maximally specific, so that failures are just artifacts of coarse description.

  Residue report: We must report on which claims translate cleanly, which with distortion, which are untranslatable. Also flag smuggled assumptions.

  Structured output required at the end.

  Brainstorming candidate mappings:

  Candidate 1: Direct mapping of the partition to reasons.
    - The partition {E_i} represents the possible pieces of evidence (e.g., the possible appearances of the word). 
    - The probabilities over the partition represent the degrees of confidence in which evidence is present.
    - The conditional probability P(H|E_i) represents the evidential bearing of E_i on H (how strongly E_i supports H).
    - Jeffrey updating: When you get uncertain evidence, you change your degrees of confidence about which E_i is true (the reasons) but you don't change the evidential bearing (the support relations) of each E_i.

  Problem: In the case, the scan changes both the confidence in the word (which is a hypothesis) and the evidential bearing of the appearance (which is the evidence). But note: in the formal setup, the partition is over the evidence (the appearances) and the hypothesis is H (the word). However, in the case, the user says the scan changes confidence in the word (so that's the probabilities over H) and also changes how the appearance (which is the evidence) bears on the word. So we have a mismatch? Let's clarify:

  In the formal setup for Jeffrey updating, the partition is typically over the evidence space (e.g., the possible sensory experiences). Then H is a hypothesis (the word). The update changes the probabilities of the evidence (the appearances) and leaves fixed the conditional probabilities of the word given the appearance.

  But in the case, the user says the scan changes:
    (a) how confident I am that the word is one thing rather than another (so P(H) for various H) -> this is the output, not the input. The input is the change in the evidence partition.
    (b) it also makes me suspect the scanner desaturated the ink, which changes how much a given appearance indicates a given word -> this is a change in the conditional probabilities P(H|E_i) for a fixed E_i.

  So the problem is that the formal method (Jeffrey) assumes that (b) doesn't change, only (a) changes (via changing P(E_i)). But in reality, (b) might change too.

  Candidate 2: Mapping the partition to hypotheses.
    - But that doesn't fit because the partition is supposed to be the evidence, not the hypotheses.

  Candidate 3: The partition is a set of reasons (or evidence propositions). The update changes the degree to which we have these reasons (their weight or our confidence in their obtaining) but leaves the support relations (how these reasons bear on the hypotheses) fixed.

  This is similar to candidate 1. The issue is that in the case, the support relations themselves are changing because the lighting conditions (the desaturation) undercut the usual evidential bearing.

  So the invariance condition (fixed P(H|E_i)) is indeed the requirement that the support relations (the bearing of each reason E_i on H) are unchanged. Only the degrees of confidence in the reasons change.

  Therefore, part 1 of the hypothesis seems right: invariance is the condition that there is no undercutting (no change in the support relations) and only a rebutting shift (change in the reasons themselves, i.e., which reasons are present or how strong they are).

  But note: the user uses "rebutting" and "undercutting" in the context of defeaters. In this context:
    - Rebutting defeat: when you get evidence against a claim (so it reduces your confidence in the claim directly).
    - Undercutting defeat: when you get evidence that severs the connection between the evidence and the claim.

  In our mapping, changing P(E_i) might be seen as changing the strength of the reason (so if E_i supports H, then reducing P(E_i) might reduce the support for H, which is like a rebutting defeat against the reason E_i). But note: we are not directly changing the support for H, we are changing the reason. And leaving the support relation fixed.

  The change in the evidence (the E_i) might be due to a rebutting defeater for E_i? But that's a bit stretched.

  Alternatively, we can think of the update as providing new evidence about the E_i (the reasons). That new evidence doesn't undercut the support relations between E_i and H, it just changes our confidence in the E_i.

  So the user's part 1: 
    - The invariance condition is the requirement that the new input changes only the confidence in the cells (the reasons) and not what those cells indicate (the support relations). This is a shift that is purely about the reasons (rebutting?) without undercutting.

  Now for part 2: Can we always rescue invariance by refining the partition? The idea is that if the support relation changes (i.e., P(H|E_i) changes) because the situation is more complex, then we might split E_i into more specific reasons (e.g., E_i under normal lighting and E_i under desaturated lighting). Then for each specific reason, the support relation might be invariant.

