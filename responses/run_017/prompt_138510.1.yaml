  - Patched rules (that weaken the fixed conditional probabilities): These allow the support relations to change during the update. In reasons vocabulary: the new input might not only change the strength of the reasons but also how those reasons bear on the hypothesis (i.e., it might undercut or rebut the support relation). So the patched rules allow for undercutting defeat.

