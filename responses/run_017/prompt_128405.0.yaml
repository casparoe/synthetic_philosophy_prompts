prompt: |-
  I teach U.S. history at a community college, and two years ago I ended up on our county's volunteer oversight board for automated decision systems — not because I know anything about statistics, but because nobody else would do it. We review three things: the pretrial risk score used at first appearance, the hospital network's model for handing out a fixed number of intensive post-discharge follow-up slots, and a newer program that targets eviction-prevention money. I've read enough to know the shape of the standard impossibility results, and I've given up hoping for a model that satisfies every criterion at once: if a score is calibrated within each group and the groups have different base rates of the outcome, then at a single decision threshold the higher-base-rate group absorbs more false positives and fewer false negatives; forcing both error rates to match across groups destroys calibration; and, unless the predictions are perfect, matching error rates across groups is incompatible with matching what a positive prediction is worth. I argued about this with a friend who builds these systems for a living, and every time I said "this one feels unfair" he said "that's just the impossibility theorem," and I said "I know — but which side of it do we want to be on?" Neither of us could say what the question even turns on. So here are my verdicts, and I'd like to know whether they add up to anything.

  (1) Pretrial, calibrated score, one cutoff for everyone: defendants booked out of the north-side precincts (where most misdemeanor arrests happen, and whose recorded reoffense rate is accordingly much higher) are detained despite not reoffending at about twice the rate of everyone else, while everyone else is released and then re-arrested at about twice the north-side rate. Unfair — the false detentions are the injury, and I want that rate equalized. (2) Same model, but the thresholds are tuned separately per group until the false-positive rates match: now more north-side defendants are released and re-arrested, and since arrests happen near home, most of the additional victims are north-side residents too. Not an improvement, and maybe worse — but I can't say why, since the disparity I objected to in (1) is gone. (3) Hospital slots: 200 slots, 1,000 patients, ranked by predicted readmission risk; because readmission is more common among the low-income patients the hospital serves, they take 140 of the slots. Our equity officer proposes capping each group at 100. The cap is the unfair move, not the original: under it, a patient at 45% risk is passed over for one at 28%, and I can't see who that serves. And yet the identical 45-vs-28 comparison at the cutoff inside a single group doesn't bother me at all. (4) Then we learn that the low-income group's readmission rate is elevated partly because those patients were least likely to get follow-up in the first place — the label is in part a record of past neglect. That makes me more comfortable with the uncapped allocation, not less, even though by the reasoning I used in (1) a corrupted base rate should make me warier of any disparity that tracks it. (5) A new pretrial model cuts false detentions by a third in both groups relative to the judges it would replace; because the judges were harsher on the north-side group to begin with, the absolute gap between the groups widens. Fine — deploy it. (6) A different model hits exact false-positive parity, but only by detaining north-side defendants the judges would have released, i.e. by making that group worse off than the process it replaces in order to hit the number. Not fine. (7) A third model drops prior-arrest count on the grounds that it is inflated by over-policing; it's less accurate, detention rates rise for both groups, and the north-side group ends up worse off than under the judges. I still want to deploy it — which suggests the rule I was reaching for in (5) and (6) isn't about being made worse off as such.

  My tentative principle is something like: no group should be made worse off than under the decision process the model replaces, and parity among the usual error-rate criteria is worth pursuing only inside that constraint, ranked by whichever error does the harm in that setting. Two problems. First, (7) shows the rule needs a clause about whether the baseline was itself legitimate, and once I add that clause I'm not sure the rule has any content left beyond a general theory of what we owe each other. Second, the case I keep reversing on: the eviction-prevention money. There a positive prediction triggers a benefit, so the error I care about flips — I want to equalize the rate at which people are wrongly denied and then evicted — but that forces unequal false-positive rates, meaning one group receives more payments that turn out to have been unnecessary. I find I don't care about that at all, and that troubles me, because in (1) I cared enormously about exactly that kind of unequal error rate and my friend's theorem says the two situations are formally the same.

  What I want from you: two to four candidate principles, each stated precisely enough that I could apply it to a new vendor filing without asking you again, with the clause-motivating case named for each clause; a blunt statement of which of my verdicts each candidate forces me to abandon; and each candidate's verdict on the eviction-prevention case plus one case of your own construction that you think best separates the candidates from each other. One more thing, if your principle has anything to say about it: our numbers change substantially, and sometimes change sign, depending on whether we measure disparities across the two groups the county officially tracks, across precincts, or across age bands within each group — and nothing I've read tells me which partition of the population is the one fairness is supposed to be measured over. And if the honest answer is that no group-level criterion is doing any real work in my verdicts, and that they are all being generated by who bears which kind of harm, say that plainly, and tell me what I should be demanding from the vendors instead.
reasoning: |-
  Okay, let me tackle this complex query from a community college history professor serving on an automated decision systems board. The user clearly understands the technical impossibility theorems but struggles with practical fairness trade-offs across three systems: pretrial risk, hospital follow-ups, and eviction prevention. 

  First, I need to map their specific verdicts:
  - In pretrial (1), they rejected equal thresholds due to unequal false detentions (harm-focused)
  - But rejected group-specific thresholds in (2) despite fixing that disparity (harm redistribution issue)
  - Hospital case (3) opposed caps that sacrificed efficiency for equal allocation (individual harm matters)
  - Yet historical bias in (4) made uncapped allocation more acceptable (context matters)
  - Model improvements in (5-7) show baseline legitimacy matters more than parity metrics

  The core tension is between mathematical fairness definitions and their context-specific harm assessments. For example, their flip on eviction prevention (benefit allocation vs pretrial harm) reveals that the *direction* of error matters deeply - false negatives when denying benefits feel less concerning than false positives in detention.

  Key insights emerging:
  1. Harm asymmetry: Detaining innocents ≠ missing unnecessary benefits
  2. Baseline legitimacy: Whether existing disparities are justified affects acceptability of changes
  3. Error type prioritization: Which mistake hurts more depends on context (FP vs FN)
  4. Individual vs group tradeoffs: They consistently reject solutions that help groups by harming specific individuals

  For principles, I'm leaning toward:
  - Harm-minimization within legitimacy constraints
  - Explicit error-type prioritization per context
  - Rejecting solutions that worsen any group's absolute position unless baseline was illegitimate
  - Accepting proportional allocations when base rates differ legitimately

  The partition problem is thorny - since fairness metrics conflict across groups, we might need to: 
  - Specify protected classes in legislation
  - Demand disparity testing across all plausible partitions
  - Focus on individual harm distribution rather than group parity

  In eviction prevention, their lack of concern about unequal unnecessary payments makes sense because the harm asymmetry differs from pretrial. The real test would be a case where two groups have similar legitimate base rates but one receives disproportionate benefits due to model limitations - that might challenge their intuition.
answer: |-
  Based on your case judgments and the core tension between formal fairness criteria and contextual harm, here are four candidate principles, each designed to be operationalizable for vendor reviews. Each principle includes: (1) a precise statement, (2) clauses with motivating cases, (3) verdicts you must abandon, (4) rulings on eviction prevention, and (5) a new test case.

  ---

  ### **Candidate Principle 1: Harm-Minimizing Baseline Constraint**  
  **Statement:** *Deploy models only if they reduce net harm relative to the current decision process, with "harm" defined as the most severe error type in context (e.g., false detention in pretrial, wrongful denial in benefits). Within this constraint, minimize disparities in that error rate across all legally protected groups. If the baseline process is systemically biased (e.g., over-policing), "current process" refers to a counterfactual fair baseline.*  
  - **Clause 1 (Harm Definition):** Motivated by your distinction between false detentions (1) vs. unnecessary benefits (eviction).  
  - **Clause 2 (Baseline Legitimacy):** Motivated by pretrial case (7) and hospital case (4).  
  - **Clause 3 (Disparity Minimization):** Motivated by pretrial (1).  

  **Forces abandonment of:**  
  - Hospital case (3): You accepted uncapped allocation despite disparate false-negative rates; this principle requires minimizing FN disparities after harm reduction.  
  - Eviction case: You must equalize false denials (wrongful evictions) after ensuring net harm reduction.  

  **Eviction Ruling:**  
  - Equalize false denials (FN) *only after* confirming the model reduces net harm vs. current process. Unnecessary benefits (FP) disparities are permitted.  

  **New Test Case (Harm Severity vs. Parity):**  
  - *Child welfare hotline:* Model prioritizes investigations. Group A has higher base rate of abuse due to poverty-linked stressors.  
    - **Option A:** 10% higher FN (missed abuse) in Group A, but 15% fewer overall FN vs. human screeners.  
    - **Option B:** Equal FN rates, but 5% more overall FN.  
  - **Candidate 1 Ruling:** Choose **Option A** (harm reduction dominates parity).  

  ---

  ### **Candidate Principle 2: Asymmetric Error Protection**  
  **Statement:** *For each outcome (detention, aid), designate one error type as "protected" based on severity of harm (e.g., FP in detention, FN in aid allocation). No group may have a higher rate of the protected error than under the current process. Disparities in non-protected errors are acceptable.*  
  - **Clause 1 (Error Severity):** Motivated by your differing concern for FP in pretrial (1) vs. FN in eviction.  
  - **Clause 2 (No Group Harm):** Motivated by pretrial cases (5) vs. (6).  

  **Forces abandonment of:**  
  - Hospital case (4): Your comfort with uncapped allocation ignores elevated FN in non-low-income group; this principle requires capping FN rates per group if they exceed baseline.  
  - Pretrial case (7): Dropping prior arrests worsens FP (protected error) for north-side group; violates "no harm" clause.  

  **Eviction Ruling:**  
  - FN (wrongful denial) is protected error. Equalize FN *only if* some group’s FN exceeds baseline; otherwise, ignore FP disparities.  

  **New Test Case (Baseline Entrenchment):**  
  - *Job screening:* Current human process rejects Group A at 2× rate of Group B. New model has equal FP (wrongful rejection) rates but 10% higher overall FP.  
  - **Candidate 2 Ruling:** **Reject model** (FP rates for Group A rise from baseline).  

  ---

  ### **Candidate Principle 3: Legitimacy-Adjusted Proportional Allocation**  
  **Statement:** *Allocate harms/benefits proportionally to group size *unless* base rate differences reflect systemic injustice (e.g., over-policing, past neglect). Where base rates are legitimate, allocate resources (e.g., hospital slots) proportionally to predicted need; where illegitimate, equalize error rates of the most harmful error.*  
  - **Clause 1 (Proportionality):** Motivated by hospital case (3).  
  - **Clause 2 (Legitimacy Trigger):** Motivated by hospital case (4) vs. pretrial (7).  

  **Forces abandonment of:**  
  - Pretrial case (1): Requires equal FP rates only if north-side arrest rates are illegitimate (which you imply in 7).  
  - Pretrial case (2): If base rates are illegitimate, separate thresholds to equalize FP are *required*.  

  **Eviction Ruling:**  
  - If poverty is a legitimate predictor of eviction risk, allocate funds proportionally (no FN equalization). If poverty risk is corrupted (e.g., by past discrimination), equalize FN.  

  **New Test Case (Legitimacy Threshold):**  
  - *Disaster aid:* Group A (floodplain residents) has higher need due to historical redlining.  
    - **Model A:** Allocates aid proportional to risk (Group A gets 70% of funds).  
    - **Model B:** Equalizes FN (wrongful denials) across groups.  
  - **Candidate 3 Ruling:** Choose **Model A** *unless* redlining’s effects are deemed illegitimate (then **Model B**).  

  ---

  ### **Candidate Principle 4: Individual Harm Priority**  
  **Statement:** *Reject group parity metrics. Instead, require: (1) no individual receives a worse outcome than under the current process; (2) models minimize aggregate harm (specified per context); (3) vendors test for disparate impact across *all* self-reported demographic partitions.*  
  - **Clause 1 (Individual Protection):** Motivated by your resistance to harming individuals for group parity (6, 3).  
  - **Clause 2 (Harm Focus):** Motivated by eviction vs. pretrial asymmetry.  
  - **Clause 3 (Universal Testing):** Addresses partition problem.  

  **Forces abandonment of:**  
  - All group-parity preferences: Pretrial (1), Eviction (FN equalization), and Hospital (3/4) are invalid under this principle.  
  - Pretrial case (7): Acceptable only if no individual is detained who wouldn’t be under judges.  

  **Eviction Ruling:**  
  - Ignore group error rates. Deploy if aggregate wrongful evictions decrease and no at-risk individual is denied aid who would have received it under current process.  

  **New Test Case (Individual vs. Group):**  
  - *College grants:* Model predicts dropout risk to allocate aid.  
    - **Model A:** 10% fewer wrongful denials overall, but 50 low-income students lose grants they’d get from counselors.  
    - **Model B:** Equal denial rates by income, but 5% more aggregate wrongful denials.  
  - **Candidate 4 Ruling:** **Reject Model A** (fails individual protection); accept **Model B** *only* if aggregate harm decreases.  

  ---

  ### **The Partition Problem & Core Insight**  
  **Honest answer:** Your verdicts are driven by *harm asymmetry* (FP in punishment vs. FN in aid) and *baseline legitimacy*, not group parity. The impossibility theorems show that mathematical group fairness is incoherent when base rates differ—**your intuition rejects this framing entirely**.  

  **What to demand from vendors instead:**  
  1. **Harm specification:** Define which error type is "high-severity" per application (e.g., FP for detention, FN for aid).  
  2. **Baseline audit:** Report model performance *against the current process* for all groups, not abstract fairness metrics.  
  3. **Individual impact simulation:** Test if any individual receives a worse outcome than under status quo.  
  4. **Cross-partition testing:** Require disparity reports for *all* demographic splits in the data (age, precinct, race, etc.), not just official groups.  
  5. **Legitimacy justification:** Document whether base rate differences reflect structural inequities (e.g., over-policing) or neutral factors.  

  This shifts focus from satisfying impossibility theorems to concrete harm reduction—aligning with your verdicts while avoiding formal fairness traps. When reviewing vendors, ask: *"Who is harmed more by this model than by the existing system, and is that harm justified?"* That question cuts through the noise.
