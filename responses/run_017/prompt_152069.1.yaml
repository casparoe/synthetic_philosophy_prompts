prompt: |-
  hey — I need help building an actual research agenda, not a lit review. I've got about four people (all philosophy/political-theory backgrounds, zero ML) and one year inside an AI lab, and the deliverable is internal writing that could plausibly change what the lab does about whose values the system ends up being tuned to serve. So the question is: what do we work on, and in what order?

  The map I'm starting from has four clusters, and I'm not attached to it: (a) who counts as a value-holder at all — only currently living humans, or also future people, also people whose existence depends on which values get implemented (which feels like a genuine trap, since the choice of values changes who shows up), also non-human animals; (b) what the stuff being aggregated even is — felt preferences, idealized or informed preferences, values proper, interests, welfare; (c) how to combine it — voting-ish schemes, bargaining, some overlapping-consensus or veil-of-ignorance style construction; and (d) the thing I keep getting stuck on, which is that disagreement about the aggregation rule is itself just more moral disagreement, so any procedure you advertise as neutral is a contested first-order moral choice, and "aggregate over the aggregation rules" looks like it just regresses one level and starts again. One of the engineers here keeps saying the real answer is to just take the revealed preferences of actual users and stop overthinking, and I want the agenda to say explicitly whether that's the view to beat or a distraction.

  Two half-baked ideas of my own that I'd rather you push back on than politely incorporate. First, value escrow: for the questions we genuinely can't settle, don't aggregate — train the system to hold them open, to preserve future people's ability to decide, and to treat destroying an option as the main thing to avoid. It sidesteps (d), but I worry it's not really neutral either (whoever builds the escrow mechanism still decides what counts as keeping an option open versus quietly closing it) and that deferring everything is indistinguishable from having no values at all. Second, a stake-weighted lottery across aggregation rules: instead of picking a rule, give each constituency a probability of the whole system going its way, weighted by how much they have at stake, so nobody gets diluted into a compromise nobody endorses.

  So: given four people, twelve months, and the goal of actually changing practice rather than just being correct, what goes on the list and in what order? I care much more about the reasoning than the list — tell me what criteria you're using (how much else depends on the answer, whether philosophers without empirical data can actually make progress on it in a year, whether it's already crowded, whether the lab would ever act on an answer), where those criteria conflict, and what result or evidence in the next year or two should move something up or down. And please do tell me if one of my two ideas is a dead end — I'd rather kill it in January.
reasoning: |-
  We are building a research agenda for a team of four philosophers/political theorists with no ML background, working for one year inside an AI lab. The goal is to produce internal writing that could plausibly change the lab's approach to tuning AI systems to serve whose values.

  The starting clusters are:
  (a) Who counts as a value-holder? (current humans, future people, potential people, non-human animals)
  (b) What is being aggregated? (preferences, idealized preferences, values, interests, welfare)
  (c) How to combine them? (voting, bargaining, overlapping consensus, veil of ignorance)
  (d) The meta-problem: disagreement about the aggregation rule itself is a moral disagreement, leading to regress.

  The team has two half-baked ideas:
  1. Value escrow: avoid aggregating on unsettled questions, train the system to hold options open to preserve future choice. Concerns: not neutral, and deferring everything might be equivalent to having no values.
  2. Stake-weighted lottery: instead of picking one rule, assign probabilities to aggregation rules based on the stake of each constituency.

  Constraints and Goals:
  - 4 people, 12 months.
  - Deliverable: internal writing that could change lab practice.
  - Focus on "whose values the system ends up being tuned to serve".
  - The lab might be influenced by an engineer's view: "just take the revealed preferences of actual users and stop overthinking".

  Criteria for prioritizing research questions (as requested):
  1. Leverage: How much else depends on the answer? (High leverage questions are better)
  2. Feasibility: Can philosophers without empirical data make progress in a year? (Avoid questions that require extensive empirical work)
  3. Crowdedness: Is the area already crowded? (Avoid duplication; focus on gaps)
  4. Actionability: Would the lab ever act on an answer? (Focus on questions that can lead to concrete recommendations)

  Additional criteria we might consider:
  - Tractability: Can we make meaningful progress in a year?
  - Novelty: Does it bring a fresh perspective?
  - Alignment with lab's current thinking: The engineer's view is a contender, so we must address it.

  Structure of the Agenda:
  We need to break down the work into phases. Given 12 months, we can think in quarters.

  Phase 1 (Months 1-3): Foundation and Scoping
  Phase 2 (Months 4-8): Core Research
  Phase 3 (Months 9-12): Synthesis and Recommendations

  Now, let's evaluate the clusters and the two ideas:

  Cluster (a): Who counts as a value-holder?
  - Leverage: High. If we include future generations, that changes everything.
  - Feasibility: Philosophers can handle this without empirical data. There's existing work in population ethics, animal ethics, etc.
  - Crowdedness: Moderate. Not as crowded as (c) in the ML community, but in philosophy, it's well-trodden. However, the AI angle is newer.
  - Actionability: Medium. The lab might be persuaded to include future people or animals, but it's a big shift. It might be too abstract for immediate action.

  Cluster (b): What is being aggregated?
  - Leverage: High. The choice between revealed preferences and idealized ones is fundamental.
  - Feasibility: High for philosophers. They can analyze concepts and argue for one over the other.
  - Crowdedness: High in both philosophy and economics. But in the context of AI alignment, it's active (e.g., debate about RLHF).
  - Actionability: High. The lab is already making choices about what data to use (e.g., user behavior vs. stated preferences). We can directly challenge the engineer's view.

  Cluster (c): How to combine?
  - Leverage: High. The aggregation method determines outcomes.
  - Feasibility: High. Philosophers are well-equipped to analyze fairness in aggregation.
  - Crowdedness: Very high. There's a lot of work on voting, social choice, and fairness in ML.
  - Actionability: Medium to High. The lab might change the aggregation method if presented with a compelling alternative.

  Cluster (d): The meta-problem of regress.
  - Leverage: Very high. If we don't solve this, any aggregation rule is arbitrary.
  - Feasibility: Medium. It's a deep philosophical problem. Progress in a year might be limited.
  - Crowdedness: Low to Medium. Not as much in the AI context, but in philosophy (e.g., moral disagreement).
  - Actionability: Low. It's abstract. The lab might not act on it directly, but it could inform the approach to the other clusters.

  Now, the two ideas:

  Idea 1: Value escrow
  - Pros: Addresses the regress problem by deferring decisions. Novel and might be appealing for preserving options.
  - Cons: Not neutral, and might lead to inaction. Also, defining what counts as preserving an option is non-trivial.
  - Feasibility: Medium. Requires conceptual work and some design. Might be too vague without empirical examples.
  - Actionability: Medium. The lab might adopt it for controversial topics, but it might not scale.

  Idea 2: Stake-weighted lottery
  - Pros: Novel approach to handling disagreement, avoids the regress by randomizing over rules. Gives weight to stake, which is fair.
  - Cons: Randomization might be hard to sell. How to measure stake? Might be seen as too radical.
  - Feasibility: Medium. Conceptually challenging (how to define stake? how to assign weights?) but doable in philosophy.
  - Actionability: Low. The lab is unlikely to implement a lottery for value aggregation.

  Prioritization:

  We must address the engineer's view because it's the current default in many labs (revealed preferences of users). Hence, cluster (b) is critical and should be tackled early.

  The meta-problem (d) is fundamental but might not yield actionable results. We can frame it as a constraint on the other clusters.

  Given the time and team size, we should focus on:

  1. Cluster (b): What to aggregate? Because it directly challenges the engineer's view and is actionable. We can argue that revealed preferences might not capture what we care about (e.g., due to manipulation, lack of information). We can propose alternatives (e.g., idealized preferences) and show how they might be approximated.

  2. Cluster (a): Who counts? Because it expands the scope and is also actionable in terms of whose data we collect and how we weight them.

  3. Cluster (c): How to aggregate? But we should be cautious because it's crowded. We might focus on one aspect that is under-explored in the lab context, e.g., how to aggregate when there are conflicting values and power imbalances.

  4. Cluster (d): We can address it by showing that no aggregation rule is neutral and that we must be transparent about the choices. This might lead to a recommendation for a pluralistic approach.

  The two ideas:
  - Value escrow: We can develop this as a response to the regress problem and for issues that are deeply contested. It might be part of the recommendation for cluster (d).
  - Stake-weighted lottery: This is more speculative. We might not have time to fully develop it. It could be a side project or a future direction.

  Proposed Research Agenda:

  Phase 1: Foundation and Scoping (Months 1-3)
  - Goal: Understand the lab's current practices, define key terms, and set the stage.
  - Activities:
    - Interview lab engineers and product managers to understand how they currently handle value tuning. What are their pain points?
    - Literature review focused on the engineer's view (revealed preferences) and its critiques.
    - Map the clusters to the lab's context: which decisions are they making that relate to (a), (b), (c), (d)?
    - Draft a problem statement and get feedback from the lab.
  - Deliverable: A scoping document that identifies the most pressing issues for the lab.

  Phase 2: Core Research (Months 4-8)
  - Goal: Address the prioritized clusters and develop recommendations.
  - Activities:
    - Cluster (b): Critically examine revealed preferences and propose alternatives. Develop a framework for choosing what to aggregate (e.g., when to use revealed vs. idealized preferences). This is the main challenge to the engineer's view.
    - Cluster (a): Analyze who should be considered. Focus on future generations and non-users, because the lab might be neglecting them. Develop practical methods for incorporating them (e.g., through proxy data or explicit representation).
    - Cluster (c): Focus on one or two aggregation methods that are feasible in the lab context. For example, explore how to use the veil of ignorance in an AI system. Avoid overly complex methods.
    - Cluster (d): Address the regress by proposing a pluralistic approach: use different methods for different types of decisions and be transparent about the choice. Develop the value escrow idea for issues where we cannot agree.
  - Deliverable: Draft chapters on each cluster, with clear recommendations.

  Phase 3: Synthesis and Recommendations (Months 9-12)
  - Goal: Integrate the findings into a coherent set of recommendations for the lab.
  - Activities:
    - Develop a decision tree or framework for the lab: when to use which approach (e.g., for low-stakes decisions, use revealed preferences; for high-stakes, use idealized; for contested values, use escrow).
    - Write a final report that is accessible to engineers and product managers.
    - Present findings and gather feedback.
    - Revise based on feedback.
  - Deliverable: A final report and a presentation to the lab leadership.

  Killing the ideas:
  - Value escrow: Not a dead end. It has potential, especially for the meta-problem. We can develop it as a concrete mechanism for handling moral disagreement. But we must address the concerns: define what counts as preserving an option and how to avoid bias in the escrow mechanism.
  - Stake-weighted lottery: Probably a dead end for this project. It's too radical and the lab is unlikely to adopt it. Also, defining stake is difficult. We can mention it as an alternative but not spend much time.

  Criteria conflicts:
  - Leverage vs. Feasibility: Cluster (d) has high leverage but low feasibility in a year. We will address it but not as the main focus.
  - Actionability vs. Tractability: Cluster (a) might be less actionable because including future generations is hard, but it's tractable for philosophers. We will focus on practical steps (e.g., how to represent future people in data collection).

  What would move something up or down?
  - If we find that the lab is already working on a cluster (e.g., they have a team on aggregation methods), we might downplay cluster (c) to avoid duplication.
  - If we get early feedback that the lab is particularly concerned about future generations, we might prioritize cluster (a).
  - If we find a way to approximate idealized preferences with data, cluster (b) becomes even more actionable.

  Final prioritization order for the core research:
  1. Cluster (b): What to aggregate? (Because it directly challenges the status quo and is actionable)
  2. Cluster (a): Who counts? (Because it expands the scope and is also actionable)
  3. Cluster (c): How to aggregate? (But focus on one novel aspect, e.g., incorporating the veil of ignorance)
  4. Cluster (d): The meta-problem (as an overarching theme, addressed in the synthesis)

  And the two ideas:
  - Value escrow: Integrate into cluster (d) as a concrete proposal.
  - Stake-weighted lottery: Set aside unless we have extra time.

  This agenda is ambitious but feasible in a year. It focuses on changing practice by providing concrete alternatives to the current approach and by addressing the fundamental questions that the lab might be ignoring.
answer: |-
  ### Research Agenda: Whose Values Should AI Serve?  
  **Goal:** Produce actionable, lab-changing recommendations in 12 months with a team of 4 philosophers/political theorists. Prioritize **clarity, feasibility, and lab impact** over theoretical perfection.  

  #### Core Principles for Prioritization:  
  1. **Actionability Over Abstraction**  
     - Focus on questions the lab *can and will* act on (e.g., "Should we weight non-users?" vs. "What is welfare?").  
     - Avoid "trap" questions with no empirical resolution (e.g., meta-regress of aggregation rules).  

  2. **Leverage**  
     - Target decisions that cascade across the lab’s work (e.g., data collection > model design > deployment).  

  3. **Feasibility**  
     - Philosophers can make progress in a year if:  
       - The question is *conceptual* (no new data needed).  
       - It builds on existing frameworks (e.g., social choice theory).  
     - Avoid open-ended empirical work (e.g., measuring animal welfare).  

  4. **Crowdedness**  
     - Exploit gaps: Philosophers add unique value on *normative foundations* (what *should* be), not ML mechanics.  
     - Steer clear of well-trodden ML debates (e.g., "fairness metrics").  

  5. **Engineer’s View as the Benchmark**  
     - "Revealed preferences of users" is the default in industry. **Treat this as the baseline to beat or refine.**  

  ---  
  ### The Agenda: 3 Phases, 12 Months  
  #### **Phase 1: Foundation (Months 1–3)**  
  *Goal: Map the lab’s practical constraints and define "actionable values."*  
  - **Priority Question:** *What is being aggregated?* (Cluster b)  
    - **Why:**  
      - Highest leverage → Directly challenges the engineer’s view ("revealed preferences").  
      - Feasible: Philosophers can dissect "preferences vs. values" using existing work (e.g., Sen’s *commitment* vs. *preference*).  
      - Crowdedness gap: ML focuses on *measuring* preferences, not *defining* them.  
      - Actionable: Lab can immediately adjust user surveys or training data.  
    - **Key Deliverable:** "Values Taxonomy" – A decision tree for when to use:  
      - Revealed preferences (e.g., for low-stakes UI features).  
      - Informed preferences (e.g., for high-stakes decisions, with user education).  
      - Interests/welfare (e.g., for non-users or animals).  
    - **Killer Move:** Show cases where revealed preferences *undermine* lab goals (e.g., addiction-driven engagement).  

  - **Secondary Question:** *Who counts?* (Cluster a) – *Narrowed to humans only.*  
    - **Why:**  
      - Avoid infeasible scope creep (animals/future people).  
      - Focus on *actionable* exclusions: Non-users, marginalized groups.  
    - **Key Deliverable:** "Stakeholder Map" – A framework to identify whose values are ignored (e.g., non-users in a medical AI).  

  ---  
  #### **Phase 2: Aggregation & Avoiding Traps (Months 4–8)**  
  *Goal: Design contestable-but-practical aggregation methods.*  
  - **Priority Question:** *How to combine values?* (Cluster c) – *With a focus on resolving disputes.*  
    - **Why:**  
      - Leverage: Determines real-world outcomes (e.g., whose voice dominates).  
      - Feasible: Apply political theory (e.g., overlapping consensus) to AI use cases.  
      - Crowdedness gap: ML aggregates impersonally; philosophers add *procedural legitimacy*.  
      - Actionable: Lab can prototype "consensus checks" in training.  
    - **Key Deliverable:** "Dispute-Proof Aggregation" – 2–3 methods ranked by:  
      1. **Veil-of-ignorance voting:** Users propose rules without knowing their stake.  
      2. **Bargaining with side payments:** Trade-offs between groups (e.g., privacy vs. accuracy).  
      - *Explicitly exclude voting* (too simplistic; ignores power imbalances).  

  - **Tackling the Meta-Problem (Cluster d):**  
    - **Kill the regress:** Admit aggregation rules are *political choices*, not neutral.  
    - **Key Deliverable:** "Transparency Protocol" – A lab policy to:  
      - Publicly justify chosen aggregation rules (e.g., "We use bargaining for healthcare AI to empower vulnerable groups").  
      - Flag edge cases for human review.  

  - **Your Idea: Value Escrow**  
    - **Verdict: Develop cautiously.**  
      - **Pros:** Addresses meta-problem; aligns with AI safety (preserving options).  
      - **Cons:** Lab won’t adopt if it defers all decisions → **Reframe as "Targeted Escrow."**  
      - **Actionable Adaptation:** Use escrow *only* for issues with:  
        - Deep uncertainty (e.g., "Should AI promote radical life extension?").  
        - High irreversible stakes (e.g., "Should AI enforce cultural assimilation?").  
      - **Key Deliverable:** "Escrow Thresholds" – Criteria for when to defer vs. decide.  

  - **Your Idea: Stake-Weighted Lottery**  
    - **Verdict: Dead end. Kill it.**  
      - Why:  
        - Not actionable (lab won’t randomize core values).  
        - Feasibility low: Measuring "stake" is empirically intractable.  
        - Creates moral hazard (e.g., corporations inflating their "stake").  

  ---  
  #### **Phase 3: Lab Integration (Months 9–12)**  
  *Goal: Pressure-test recommendations with engineers.*  
  - **Priority Question:** *How to embed this in the lab’s workflow?*  
    - Prototype a "Values Impact Assessment" (VIA) tool:  
      - Step 1: Use the **Values Taxonomy** (Phase 1) to define what’s aggregated.  
      - Step 2: Apply the **Stakeholder Map** (Phase 1) to identify who’s included.  
      - Step 3: Run **Dispute-Proof Aggregation** (Phase 2) for contentious cases.  
      - Step 4: Trigger **Targeted Escrow** for unresolved, high-stakes issues.  
    - **Key Deliverable:** Pilot VIA on one lab project (e.g., a new chatbot). Report on trade-offs (e.g., "Adding non-user values increased development time by 10%").  

  ---  
  ### Why This Order?  
  1. **Phase 1 first** because without defining *what* is aggregated and *who* counts, aggregation methods (Phase 2) are meaningless.  
  2. **Engineer’s view addressed early** (in Values Taxonomy) to build credibility.  
  3. **Meta-problem (d) deferred to Phase 2** because it’s unsolvable—focus on *managing* disagreement, not resolving it.  
  4. **Final phase prototypes tools** to force engagement: Labs act on concrete workflows, not theory.  

  #### What Moves Priorities Up/Down?  
  - **Move Up:** Evidence that the lab’s current approach causes harm (e.g., user complaints about bias).  
  - **Move Down:** If engineers reject a concept (e.g., escrow) during Phase 1 feedback. Pivot to alternatives.  
  - **Kill a Question:** If it requires data philosophers can’t access (e.g., "How to measure animal welfare?").  

  #### Risks & Mitigation  
  - **Risk:** Lab dismisses philosophy as "navel-gazing."  
    - *Mitigation:* Anchor every deliverable in a lab **use case** (e.g., "Here’s how our taxonomy changes your chatbot design").  
  - **Risk:** No progress on meta-regress.  
    - *Mitigation:* Treat it as a **constraint** (declare rules contestable) rather than a problem to solve.  

  **Final Output:** A "Practical Values Playbook" – Short memos with diagrams, not academic prose. Aim to change:  
  - How the lab collects user data (beyond revealed preferences).  
  - Which stakeholders they consult (beyond users).  
  - How they document value choices (transparency protocol).  

  This agenda sidesteps dead ends (lottery), reframes your best idea (escrow), and forces the lab to confront *why* "revealed preferences" is inadequate. By Month 12, you’ll have tools they *can’t ignore* without admitting they’re evading ethical choices.
