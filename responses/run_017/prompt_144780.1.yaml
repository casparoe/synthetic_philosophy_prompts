  Here’s a eulogy focusing on Uncle Ray’s unique engagement with life, avoiding sensory unity while honoring his spirit:

  **Uncle Ray’s Eulogy**

  We all know Ray lived life with gusto. Boats, curries, crosswords, freezing swims, bass lines, neighbour’s fences… the list is wonderfully long. Trying to find one feeling underneath it all – some single “Ray-ness” – misses the point, I think. Ray wouldn’t have bought that.

  What strikes me is *how* he went after these things. Ray wasn’t just collecting pleasant moments. He sought out **aliveness**. He wanted to be fully *in* something, completely engaged. Not just the taste of the curry, but the challenge of it. Not just the swim, but the defiant act of plunging into the cold sea – and yes, the deep, earned satisfaction of that whisky *afterwards*.

  Think about it: restoring a boat demands patience and skill. Singing bass holds the whole choir together. Doing the crossword in ink? That’s commitment. Helping a neighbour isn’t about a buzz; it’s about showing up. He chose things that asked something of him – focus, effort, endurance, generosity. The pleasure wasn't a single glow; it was in the *doing*, the *mastering*, the *connecting*.

  He found meaning not in one special sensation, but in the sheer variety of ways he could be awake in the world, testing his limits, putting his hands or his voice to good use. He crafted a life rich with purpose, one intensely felt project, one cold swim, one solved clue, one fixed fence at a time. That’s the thread: a life lived wide awake, deeply engaged, and generously shared. We felt that wakefulness, that generous energy, and we’ll miss it terribly.

  ---

  **Why this works:**
  *   **Avoids Sensory Unity:** Focuses on engagement, challenge, agency, and consequence ("earned satisfaction," "asked something of him," "mastering," "connecting").
  *   **Honors Complexity:** Uses the whisky anecdote to show pleasures were relational and narrative, not just isolated sensations.
  *   **"Aliveness" not Hedonism:** "Aliveness" captures the active, participatory, varied nature of his pursuits better than "pleasure" or "happiness."
  *   **Shows, Doesn't Tell:** Uses his specific activities to demonstrate the *how* and *why*.
  *   **Warmth & Connection:** Emphasizes generosity ("showing up," "generously shared"), skill, and impact on others ("held the choir together," "we felt that wakefulness").
  *   **Ray-Proof:** Avoids theory words; uses concrete language about his actions and choices. "Aliveness" feels real and experiential.
  *   **Word Count:** Approximately 280 words.
