answer: |-
  **Bottom line:** The question forces candidates to decide whether luck egalitarianism must shift its focus from outcomes to opportunities to retain coherence when choice is shaped by brute luck.

  **Examination Question**  
  **Time Allowed:** 60 minutes  
  **Word Limit:** 900 words  
  **Instructions:** Explain and assess how the Republic of Varrania’s “Equal Risk Scheme” embodies luck egalitarianism. Do *not* merely describe the distinction between brute luck (misfortunes not caused by choice) and option luck (misfortunes resulting from chosen gambles). Your answer must:  
  1.  Justify why Varrania’s architects claim the *audit* (not just the floor) delivers justice.  
  2.  Argue whether the actuaries’ findings refute the scheme, or if a specific reform can save it. Defend your chosen reform against one major objection.  
  3.  State what your answer to (2) shows about whether luck egalitarianism is fundamentally about equality, desert, or both.  

  **Case:** Varrania implements an annual “luck audit” adjusting incomes. Officials create a counterfactual “twin” for each citizen: identical social/legal position but with average health, talent, temperament, and upbringing.  
  - Income shortfalls vs. the twin caused by *brute luck* (e.g., congenital illness) are compensated by the state.  
  - Shortfalls caused by the citizen’s *choices* are borne by them. Choices count only if: (a) the citizen knew the risks, (b) was not coerced, and (c) could reasonably foresee the outcome.  
  - A modest humanitarian floor prevents destitution, but Varrania insists justice lies in the audit, not the floor.  

  **Recent Findings:**  
  (i) Choices leading to shortfalls (e.g., dropping out of school, casual work) are *themselves* strongly linked to brute luck (e.g., poverty or impulsive temperament). The audit thus converts brute luck into apparent option luck, reducing transfers most for the initially worst-off.  
  (ii) Some losses (e.g., regional trade collapse) are “covariant”: they hit many who made similar choices simultaneously, making insurance impossible.  

  ---

  **Model Answer (First-Class Candidate, ~700 words):**  

  Varrania’s audit embodies luck egalitarianism’s core aim: to neutralize inequalities from unchosen circumstances (brute luck) while holding people responsible for inequalities from free choices (option luck). The *audit* is deemed just—not merely the floor—because it precisely isolates and corrects for brute misfortune. The floor is charity for residual suffering; justice requires actively nullifying the arbitrary. The twin represents a fair baseline: if you end up worse off than someone with your opportunities but average traits, that deficit is brute luck’s work, demanding correction. Justice here is *corrective*, not merely palliative.  

  However, finding (i) fatally undermines this outcome-focused audit. When poverty or temperament (brute luck) makes high-risk choices (e.g., skipping education) statistically likely, the audit mislabels resulting deficits as option luck. This creates a perverse loop: those with the worst brute luck are "penalised" for choices shaped by that very luck, shrinking compensation. Varrania thus entrenches the inequality it aims to cure. Finding (ii) is less fundamental but exposes a practical flaw: covariant losses (like regional collapse) are brute luck (no one could insure against them), yet the audit labels them option luck because they resulted from "choosing" to work there. This denies compensation for unchosen, systemic risks.  

  The scheme can be saved only by reforming *where* we draw the luck/choice line. We must shift it from *outcomes* to *opportunities*. Instead of auditing income gaps against a twin’s outcomes, audit gaps against the twin’s *opportunity set* at the start of adulthood. Compensate citizens for brute luck deficits in their initial bundle of resources, capabilities, and feasible life paths—*before* they make choices. For example, someone born into poverty with low impulse control receives extra resources/support to offset these disadvantages, equalising their starting opportunities relative to the twin. Subsequent choices (and their outcomes) are then theirs to own. This addresses finding (i): choices are made from a brute-luck-neutralised baseline, so deficits reflect genuine agency, not compounded disadvantage. For finding (ii), covariant losses post-baseline become genuine option luck; the state provides only the humanitarian floor, as private insurance would be impractical. Justice is done at the starting gate.  

  The strongest objection is that this retreats from true equality of condition. If two people, from equalised starting points, make identical choices but one suffers unforeseeable calamity (e.g., a lightning strike), the opportunity audit leaves this brute luck inequality unaddressed. This seems to abandon luck egalitarianism’s core promise. However, this objection misconstrues the doctrine’s priority. Luck egalitarianism’s essence is *respecting agency through responsibility*, not guaranteeing equal outcomes. Holding people responsible for gambles they freely undertake *requires* accepting that some good-faith choices fail. Compensating all post-baseline misfortune would nullify agency itself, reducing citizens to passive recipients of state largesse. The humanitarian floor prevents absolute suffering, but justice—properly understood—demands we let genuine option luck play out once opportunities are equalised. The lightning strike is tragic, but not unjust if it befell someone who accepted life’s inherent risks from a fair starting point.  

  This reform reveals luck egalitarianism is fundamentally about *equality of status*, not desert. It equalises starting opportunities to ensure no one’s social standing is set by brute luck, enabling all to author their lives. Outcomes then reflect responsible choices, fostering mutual respect as co-authors of shared social terms. Desert is a distracting misnomer: we don’t "deserve" rewards from choices made from fair opportunities; we simply have a claim not to be hindered by unchosen obstacles. Desert implies moral merit, but luck egalitarianism cares only that advantages/disadvantages track choices, not virtue. Varrania’s error was conflating equality (neutralising brute luck) with imposing desert (punishing "bad" choices). The reformed scheme achieves equality at the opportunity stage, letting responsibility operate without moralising outcomes. It thus coheres as an egalitarian doctrine, not a desert-based one.  

  ---

  **Marking Scheme (Out of 20)**  

  | **Point**                                                                 | **Marks** | **To Earn Marks: Candidate Must...**                                                                                            | **Common Pitfall**                                                                 |
  | :------------------------------------------------------------------------ | :-------- | :----------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------- |
  | **1. Explain why the *audit* (not floor) embodies justice for Varrania.** | 3         | State that the audit actively corrects brute luck inequalities, making outcomes reflect choice alone; the floor is residual aid. | Merely restate the distinction between brute/option luck without linking to justice. |
  | **2. Diagnose why findings (i) or (ii) threaten the scheme’s coherence.** | 3         | Argue that (i) shows the audit conflates brute/option luck, penalising victims; or (ii) shows it denies compensation for systemic risks. | List objections superficially without showing *how* they undermine the audit’s logic. |
  | **3. Propose & champion ONE coherent reform to address findings.**        | 5         | Select a focused reform (e.g., opportunity shift, hypothetical insurance) and justify it as the *best* solution to (i) or (ii).  | Survey reforms without committing, or propose reforms irrelevant to the findings.   |
  | **4. Defend chosen reform against its strongest objection.**              | 5         | Identify a major flaw in the reform (e.g., ignores post-baseline brute luck) and rebut it using luck egalitarian principles.     | Ignore objections, or rebut a weak/irrelevant objection.                         |
  | **5. State what reform shows about luck egalitarianism’s core aim.**      | 4         | Conclude decisively whether it is about equality, desert, or both, using the reform’s logic (e.g., "equality of opportunity, not outcome desert"). | Vaguely assert aims without grounding in the analysis; claim "both" without resolving tension. |

  **Grading Boundaries:**  
  - **Answers capped at 12/20 (B-):** Describe brute/option luck accurately and list standard objections to Varrania, but fail to engage Part 2 (no reform proposed/defended) or Part 3 (no conclusion about the doctrine’s nature).  
  - **The A/B Boundary (16/20):** An answer earns an A (16+) *only* by successfully rebutting a strong objection to its reform in Part 2 (Column 4). Merely proposing a reform without this defence caps the answer at 15/20 (B+).
