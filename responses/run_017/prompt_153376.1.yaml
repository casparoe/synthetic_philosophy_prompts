prompt: |-
  Please act as an experienced professor of political philosophy who has spent years setting and marking finals and who also enjoys coaching bright sixth-formers. Before you draft anything, think carefully: first brainstorm the answers a well-prepared student would produce if handed a plain "Explain luck egalitarianism and assess it" question, and then design something for which those answers cannot earn top marks. Begin your reply with a single sentence stating your bottom line — the one decision the question is built to force a candidate to make — and then give me the question, the model answer, and the marking scheme, in that order. No preamble, no restatement of my request, and no closing commentary.

  My situation and constraints:

  I am in the upper sixth at my school and I run the philosophy society. We hold an end-of-term examination for the group: a single timed essay of sixty minutes, written closed-book and with no internet access, of roughly nine hundred words, marked out of twenty. Everyone in the society is between sixteen and eighteen, has read a modest amount of political philosophy, and has no economics. So the paper must be self-contained: no named authors, no papers, no citations, no further reading, and no technical apparatus that is not supplied in the question itself. Every term the candidate needs should either be explained in the question or be ordinary English.

  The topic I want examined is luck egalitarianism. The difficulty I keep running into is that it is far too easy to write a fluent answer that does nothing more than state the distinction between brute luck and option luck, and then list the standard complaints. I want a question where reciting that distinction, even correctly and at length, is worth a middling mark at best, and where top marks require the candidate to do something with it.

  Here is the invented apparatus I would like you to build the question around; please feel free to sharpen it if you can see a better version.

  In the imaginary Republic of Varrania the state operates the Equal Risk Scheme. Each year every citizen's disposable income is adjusted by a "luck audit," which works as follows:

  - Officials construct, for each citizen, a counterfactual twin: someone placed in the same social position and with the same legal rights, but endowed with the average bundle of native endowments (health, talents, temperament) and an average-quality upbringing.
  - Any shortfall between the citizen's income and the twin's is attributed to brute luck, and is cancelled by a state transfer. (A misfortune counts as brute luck when it did not flow from any choice of the agent's.)
  - Any shortfall that flows from the citizen's own choices is left standing; the citizen bears it. (A misfortune counts as option luck when it is the outcome of a gamble the agent knowingly took.)
  - Officials treat a choice as genuinely the agent's own, and therefore as a responsibility-bearing choice, only when three conditions hold: the agent had adequate information about the risks, was not coerced, and could reasonably have foreseen the outcome.
  - Varrania maintains a modest floor below which no one is allowed to fall, but it insists that the floor is humanitarian relief rather than justice. Justice, it says, is done by the audit.

  Varrania's actuaries have recently published two awkward findings:

  (i) The choices that show up in the audit are themselves distributed by brute luck. People who grew up in poverty, or who inherited a temperament low in impulse control, are markedly more likely to make exactly the choices — casual work, no saving, early dropout — that leave them short of their twin. The audit therefore converts brute luck into apparent option luck, and the transfers shrink towards zero precisely for those who began worst off.

  (ii) Some losses are covariant. When Varrania's shipbuilding region collapses after a trade shock, everyone who chose to work there loses at once, and no private insurer would ever have covered the risk, since there is no pool across which to spread it.

  What I want the question to require, roughly in three linked parts:

  1. An explanation of why Varrania's architects would say the Equal Risk Scheme is the most natural institutional expression of luck egalitarianism — why the audit, and not merely the floor, is supposed to be where the justice is.
  2. A verdict on the actuaries' findings: do they refute the scheme, or can it be reformed so that it survives them? The candidate should pick the strongest reform available — for instance, relocating the luck/choice cut from outcomes to opportunities or to a hypothetical insurance market, or holding agents responsible only for choices that express who they really are, or confining compensation to a baseline and letting some losses lie — and defend that reform against the strongest objection to it.
  3. A statement of what the answer to part 2 shows about what sort of doctrine luck egalitarianism actually is: is it fundamentally a view about treating people as equals, or a view about people getting what they deserve, and can it coherently be both?

  The deliverables I need:

  A. The examination question itself, written exactly as it would appear on the paper: the Varrania case as I have sketched it (tidied and, if you think it helps, improved), the three parts, the sixty-minute and nine-hundred-word limits, and a closing instruction to candidates that forbids them from merely describing the distinction and tells them what an answer must do instead.

  B. A model answer of about seven hundred words, written in the voice of a first-class candidate rather than a textbook: it should commit to a position in parts 2 and 3 rather than surveying options, and it should show the reasoning rather than assert the conclusion.

  C. A marking scheme out of twenty, built around five must-hit points, presented as a table with four columns: the point, the marks available (the five must total twenty), the specific move or claim a candidate must make to earn them, and a one-line note on how candidates typically get that point wrong. Please make the scheme genuinely discriminating: state explicitly what caps an answer at a B or below — for example, that an answer which states the brute-luck/option-luck distinction correctly and then recites the familiar objections, without ever saying what should be done about finding (i) or (ii), cannot exceed a certain mark — and say what the single additional move is that separates an A answer from a B answer.
