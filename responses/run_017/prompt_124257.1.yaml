prompt: |-
  Write a piece of sustained institutional satire: the customer-facing *Reference Class Selection Guide* sent to new policyholders by a fictional insurtech company, Venn Mutual, which has abolished demographic rating and replaced it with an app in which every applicant personally selects the reference class from which their own risk will be projected.

  Form and voice: a help-centre document of roughly 850–1,000 words, written in the register of contemporary UX microcopy and startup onboarding — second person, relentlessly cheerful, reassuring about a process that is quietly catastrophic. Use headings, at least one worked example box, a short FAQ, and a block of numbered fine print at the end. It should read as though it were written in-house and approved by legal. No character in the document ever uses the word arbitrary, and nothing in it winks: the reader should be the one who notices.

  Setup, for the writer's use: Venn Mutual's product rests on two internal doctrines that it has trademarked. The *Maximum Specificity Mandate* instructs underwriters to project a single case from the narrowest class for which reliable statistics exist. The *Cell Size Covenant* requires any class used for rating to contain at least one thousand lives. A fictional regulator, in response to early complaints, has imposed a *Two-Quote Rule*: every screen must display the applicant's chosen class and the company's chosen class side by side, with the resulting premiums. The customer picks their cohort at onboarding; the fine print will reveal who picks at claim time.

  What the satire is aimed at: not corporate malice, but the structure of single-case frequentism. Exaggerate only by taking real commitments literally. The jokes should come from considerations a philosopher of probability would recognise as fair: that any individual belongs to indefinitely many classes, each with its own frequency, and that nothing in the data singles one out; that the instruction to narrow the class, followed faithfully, terminates in a class of one, where the frequency is either zero or one; that the competing demand for statistical stability pulls in exactly the opposite direction and has no adjudication procedure behind it; that classes defined by the outcome are forbidden and are trivially reconstructed out of proxies; and that neighbouring classes, each defensible, can disagree by an order of magnitude for the same person on the same day.

  Requirements:

  1. One worked example, set out in full, in which two classes the guide itself endorses — say a broad age-and-sex band, and the same band narrowed by three innocuous-looking further traits — yield premiums differing by roughly tenfold, with the guide resolving the conflict by a rule the reader can see is not a rule (a coin flip, alphabetical order, whatever the reinsurance treaty specifies).
  2. A No Peeking section explaining that the class of people who will not file a claim this year may not be used, followed by onboarding questions that reconstruct it exactly.
  3. Fine print that concedes, without apparent embarrassment, (a) that Venn Mutual, not the customer, selects the reference class when a claim is filed, and (b) that attributes the company may not name are recovered in full by proxy classes — browser window width, hours of activity between one and four a.m., ZIP+4 — so that the prohibition changes nothing measurable.
  4. One passage of genuine, unironic success: a large, homogeneous class with a stable long-run frequency, where the projection is uncontroversial and the rate is obviously right. The absurdity should be located in the unconstrained middle, not in statistical prediction as such; the piece should survive the objection that it is attacking something nobody defends.
  5. A closing footnote, set in small type, that is not played for a laugh: a reminder that on the strictest view of the matter, if the world is deterministic, every reference class has a long-run frequency of zero or one, and the entire product is a consequence of not knowing which.

  Background, for orientation only — do not cite or quote any source, and do not build the piece around a bibliography: the problem is standardly posed for direct inference, where a single case is made to inherit the frequency of a broader class, with the classical frequency theorist's rule (associated with Reichenbach) to take the narrowest class for which reliable statistics can be had, and with the contemporary argument that any constraint strong enough to single out one class among the many is either question-begging or already a substantive theory of objective chance. Assume your reader has never encountered any of this and should not have to.
reasoning: |-
  Okay, the user wants me to create a satirical insurance company document called the "Reference Class Selection Guide" for Venn Mutual. This fictional insurtech company has replaced demographic rating with an app where customers choose their own risk reference class. 

  Hmm, I need to understand the key elements here. The satire should target the philosophy of probability, not corporate malice. The core absurdity comes from how single-case frequentism works - how any individual belongs to countless reference classes with different risk frequencies, and there's no objective way to choose "the right" one.

  The user provided specific requirements: I need to include a worked example showing a 10x premium difference between two "valid" classes, a "No Peeking" section that reconstructs the forbidden "people who won't claim" class, fine print revealing the company chooses the class at claim time, one passage showing the system working well in an obvious case, and a serious footnote about determinism.

  I'm thinking about structure first. The guide should look like a real onboarding document - cheerful UX microcopy tone, headings, FAQ, worked example, and fine print. The satire comes from presenting this absurd system as perfectly reasonable. No winking at the reader; they should discover the problems themselves.

  For the worked example, I imagine "Emma" choosing between "Female, 35" ($60/month) and "Female, 35, Non-Smoker, Daily Driver, ZIP 90210" ($500/month). The guide would "resolve" this by saying the app defaults to the first alphabetical trait - which is completely arbitrary but presented as a feature.

  The "No Peeking" section needs to explain you can't select "no claims" classes while asking questions that perfectly reconstruct it. Questions like "How many years since your last claim?" and "Do you use our safe driving app?" would do this while appearing innocuous.

  The fine print is crucial - it must casually mention that Venn chooses the class at claim time and uses proxy data to effectively bypass the "no outcome-based classes" rule. Things like browser window width or late-night app usage become risk factors.

  For the genuine success case, I'll use a large group like "Males, 60-65, seeking $500k term life" where the 1.7% annual mortality rate makes pricing straightforward. This shows the system can work when the class is obvious and stable.

  The deterministic footnote should be small but serious - pointing out that if everything's predetermined, all reference classes have 0% or 100% risk, making the whole exercise pointless. No jokes here.

  Throughout, I'll maintain that upbeat, helpful tone while letting the contradictions speak for themselves. The headings will frame things positively: "Your Power to Choose!" and "Making Sense of Multiple Possibilities." The FAQ will answer reasonable concerns with unreasonable confidence.

  The challenge is balancing clarity of the satire with maintaining the fiction of a real corporate document. Every absurd element needs to feel like something a well-meaning but philosophically naive company would actually write.
answer: |-
  ## Venn Mutual Reference Class Selection Guide

  **Welcome to Truly Personal Protection!**

  At Venn Mutual, we believe your insurance should reflect *you* – not outdated averages. That’s why we pioneered the **Reference Class Selector™**, putting the power of personalized risk assessment right in your hands. Forget being lumped into broad categories! You get to choose the specific group of people whose historical experience most closely mirrors your unique situation. This guide will help you navigate your selection with confidence.

  **How It Works: Your Power to Choose!**

  1.  **Explore Potential Cohorts:** Based on your initial application details, our app presents you with various potential reference classes. These are groups defined by shared characteristics (like age ranges, hobbies, professions, tech usage, etc.) where we have statistically reliable claims data. We call this our **Cell Size Covenant™** – ensuring every class has at least 1,000 members for robust predictability!
  2.  **Select Your Preferred Class:** Browse the options! Each class shows its historical claims frequency and projected premium *just for that group*. You choose the cohort you feel best represents your risk profile. This is the **Maximum Specificity Mandate™** in action – finding the *most relevant* group for *your* projection.
  3.  **See Your Rate:** Once you select, your personalized premium is calculated instantly based *solely* on the historical claims experience of *your chosen cohort*. Simple, transparent, and truly yours.

  **Making Sense of Multiple Possibilities**

  Sometimes, you might see several classes that seem relevant, each with a different premium. This reflects the beautiful diversity of human experience! Each group has its own unique risk story. The app helps by showing the **Two-Quote Rule** view: your chosen class and its premium alongside the class *Venn Mutual would have selected based on broad underwriting principles* and its premium. This ensures total transparency.

  **Worked Example: Finding Emma's Fit**

  Let's meet Emma! She's 35, lives in a sunny ZIP code, drives daily, doesn't smoke, and enjoys weekend hiking. The app presents several options:

  *   **Option A:** `Female, 30-39` (Broad base: 500,000 lives)
      *   *Historical Claim Frequency (Auto):* 7.2%
      *   *Projected Premium:* $60/month
  *   **Option B:** `Female, 30-39, Non-Smoker, Daily Driver` (More specific: 120,000 lives)
      *   *Historical Claim Frequency (Auto):* 3.8%
      *   *Projected Premium:* $45/month
  *   **Option C:** `Female, 30-39, Non-Smoker, Daily Driver, ZIP 90210` (Highly specific: 1,500 lives)
      *   *Historical Claim Frequency (Auto):* 32.1%
      *   *Projected Premium:* $500/month
  *   **Option D:** `Female, 30-39, Non-Smoker, Occasional Driver, Hiker` (Alternative specificity: 5,000 lives)
      *   *Historical Claim Frequency (Auto):* 1.2%
      *   *Projected Premium:* $30/month
  *   **Venn Mutual Default:** `Female, 35, Standard Risk Band` (Our broad starting point)
      *   *Projected Premium:* $65/month

  Emma feels Options B and D both reflect her situation well. She sees a significant premium difference ($45 vs $30). **How does the app help her decide?** The Venn Mutual Reference Class Selector™ uses a sophisticated algorithm prioritizing the **Maximum Specificity Mandate™** *within* the **Cell Size Covenant™**. Since both options meet the 1,000-life minimum, the app defaults to the class whose *defining characteristic* (after core demographics) appears first in our standardized alphabetical trait lexicon. "Daily Driver" (Option B) comes before "Hiker" (Option D), so Option B is initially highlighted. Emma can easily override this and choose Option D if she feels it's a better fit!

  **Understanding "No Peeking"**

  For insurance to work fairly for everyone, we rely on projecting *future* risk based on *past* group experience. We absolutely cannot use classes defined by the *outcome itself*, like "People who will not file a claim this year." That wouldn’t be predictive – it would be circular! Our onboarding questions focus purely on your *current attributes and behaviors*, which help us identify the *most relevant predictive cohorts* based on historical correlations. We ask things like:

  *   "How many years have you been continuously insured?"
  *   "How many miles do you estimate you drive annually?"
  *   "Do you use a telematics app to track safe driving habits?"
  *   "What security features does your home have (e.g., alarm system, deadbolts)?"
  *   "How often do you engage in high-adrenaline recreational activities?"

  These questions help us find the best possible reference classes *for prediction*, ensuring fairness and sustainability. We never ask "Will you file a claim?"

  **When It Just Works: The Power of Predictability**

  Sometimes, the perfect fit is clear and stable! Consider **Term Life Insurance** for **Males, 60-65, seeking $500k coverage**. This is a large, well-defined group (over 250,000 lives) with decades of reliable mortality data. The historical annual mortality rate is a stable 1.7%. Projecting this frequency leads to an uncontroversial, predictable premium of $250/month. In these cases, the Reference Class Selector™ effortlessly finds the optimal, statistically sound cohort, demonstrating the core strength of our data-driven approach. You get a rate that feels intuitively right because it *is* right for that large, homogeneous group.

  **Frequently Asked Questions (FAQ)**

  *   **Q: What if I don't see a class that feels exactly like me?**
      A: We strive to offer diverse options! If nothing feels perfect, choose the *closest fit* from the available, statistically valid classes. Remember, the **Maximum Specificity Mandate™** requires us to use the narrowest reliable class available. You can also revisit your selection later if new cohorts become available!
  *   **Q: Why do premiums vary so much between similar-looking classes?**
      A: Risk is nuanced! Small differences in group composition can lead to significantly different historical experiences. A class adding "Commutes during rush hour" might show different claims patterns than one adding "Works from home," even if age and location are identical. This variation highlights the power of your choice in finding the cohort that best reflects *your* specific risk factors.
  *   **Q: Is the cheapest premium always the best choice?**
      A: Not necessarily! Choose the cohort you genuinely believe reflects your risk. Selecting a class that doesn't truly represent you to get a lower rate could impact your coverage. Our pricing is based on the *honest projection* of the chosen group's history.
  *   **Q: What happens if my risk factors change (e.g., I start smoking)?**
      A: Congratulations on prioritizing your health! You can update your profile anytime in the app. This may unlock new reference class options. Remember, your current premium is based on the class you selected *at the time*. Significant changes might require a policy review.
  *   **Q: How do you ensure the classes are fair and non-discriminatory?**
      A: Venn Mutual strictly complies with all regulations. We only use classes built from permissible risk factors with statistically validated predictive power. Our **Cell Size Covenant™** ensures reliability, and the **Two-Quote Rule** guarantees transparency.

  **Fine Print: Important Policy Details**

  1.  **Reference Class Selection at Onboarding:** The policyholder selects their initial reference class during the application process via the Venn Mutual app. This selection determines the initial premium calculation.
  2.  **Reference Class Selection at Claim Time:** In the event of a claim, Venn Mutual will determine the applicable reference class for claims assessment and payout calculations based on the policyholder's profile and circumstances *at the time of the loss event*, guided by the **Maximum Specificity Mandate™** and **Cell Size Covenant™**. This class may differ from the class selected at onboarding. (Venn Mutual Indemnity Agreement § 7.3b "Post-Loss Class Designation").
  3.  **Data Utilization & Proxies:** To ensure the most accurate risk assessment and claims handling, Venn Mutual utilizes all relevant data points available within legal and regulatory frameworks. This includes, but is not limited to, application data, usage patterns of the Venn Mutual app (e.g., session duration, interaction times, device settings), publicly available information, and commercially sourced data segments. Attributes used for class construction may be derived directly or inferred through statistically validated proxy indicators (e.g., inferred lifestyle patterns from app activity timestamps, geographic precision down to ZIP+4, device characteristics correlating with certain behavioral clusters). The prohibition on using classes defined solely by the outcome (e.g., "will not claim") is maintained; however, predictive classes utilizing correlated proxy attributes are actively employed for optimal accuracy and fairness. (Venn Mutual Data & Underwriting Policy § 4.1 "Comprehensive Data Integration" and § 4.7 "Proxy Attribute Utilization").
  4.  **Class Availability & Stability:** Reference classes are subject to change based on data availability, statistical validity, and regulatory requirements. Venn Mutual reserves the right to migrate policies to a new, statistically valid class if the originally selected class ceases to meet the **Cell Size Covenant™** or other underwriting standards, with appropriate premium adjustment. Policyholders will be notified of any such migration.
  5.  **Binding Arbitration:** Any dispute arising from reference class selection or application is subject to binding arbitration per the Venn Mutual Policyholder Agreement.

  **Welcome to the Future of Fairness!**

  By choosing your reference class, you’re taking an active role in defining your protection. We’re thrilled to offer this unprecedented level of personalization. Explore your options in the app – your perfect coverage fit awaits!

  **The Venn Mutual Team**

  ---

  **¹** *A Note on Precision:* Insurance relies on projecting future probabilities based on past group frequencies. In an ideal world of perfect knowledge, every individual's future might be perfectly determined, making the concept of a "frequency" for a single case inherently either 0% or 100%. Our product exists precisely because we lack that perfect knowledge. We use the best available group data to make reasonable, sustainable projections, helping you manage life's uncertainties. The **Reference Class Selector™** empowers you to participate in finding the most relevant group projection *from our available data* for your unique situation.
