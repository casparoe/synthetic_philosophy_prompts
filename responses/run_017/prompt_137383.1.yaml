prompt: |-
  Hi — I teach a final-year undergrad / MA option on justice after atrocity and I'm setting this year's take-home paper. 2,500 words, marked out of 25, students get a week. I need one essay question that isn't the usual "is amnesty a justifiable price to pay for truth?" one, because I've set that three years running and every script is the same: restorative vs retributive, a paragraph each on South Africa, Argentina and Rwanda, then a wobble and a fence.

  What I'd actually like is a question built around something I've started calling *provisional amnesty* (my coinage — tell me if it already has a name and I'll rename it). The idea: immunity is granted up front and individually, but it's defeasible for a fixed period. It lapses if (a) the applicant's disclosure turns out to be incomplete or is contradicted by victims' testimony, or (b) the state fails to meet its own reparations, vetting and institutional-reform timetable. After, say, fifteen years it becomes final. So it sits between the South African model — individual application, full disclosure as the condition, but once granted it's final — and the Argentine one, where blanket legislative amnesties were repealed by Congress in 2003, declared unconstitutional by the Supreme Court in 2005, and prosecutions resumed afterwards.

  The question has to force students into the weeds, not onto the tour. The things I want it to make them do:

  - distinguish at least three different jobs amnesty might be doing — settling with actors who could still wreck the transition, inducing testimony that wouldn't otherwise be given given self-incrimination, and saying something about what kind of wrong this was and what the new political community is;
  - notice that the 'truth for justice' framing only gets a grip if the epistemic job is the one doing the work, and that provisional amnesty shifts which job matters and why — including the nasty point that testimony bought with immunity is epistemically compromised, and that a corroboration requirement turns a commission from a truth-teller into an adjudicator;
  - deal with the standing worry, that the state is trading away claims that aren't obviously its to trade, and with the credibility point the Argentine case seems to raise: if a successor government can just repeal an amnesty, then maybe what any state can honestly offer is only ever provisional, and the honest version of that might be better than a pretend-permanent one.

  It'd be good if the question also gave them a way in on Rwanda — the gacaca courts going for punishment at scale with sentence reductions for confession rather than amnesty at all — and on the difference between amnesty and mere non-prosecution because the courts can't cope.

  And: it should end in a forced choice. No "on the one hand" escapes. Someone who recites the trade-off cliche and stops there should cap at a 2:1.

  Give me:

  1. The question exactly as it'd appear on the paper, with any bullet points or framing instructions.
  2. A model answer of 900–1,000 words. Not a perfect one — I want what a genuinely excellent student could produce in a week, including one real concession to the strongest objection to their own line and one loose end they don't manage to tidy up.
  3. A marking scheme as a markdown table with these columns: Band | Marks | What the answer must contain | The characterisitic failure that caps it at this band.
  4. The same scheme again as a JSON object with this schema: {question: string, format: string, budget: string, total_marks: number, must_hit_moves: [{id: string, move: string, marks: number}], failure_modes: [{label: string, capped_at: string, why: string}]}.

  No citations or reading list please, I'll definately fill those in myself.
reasoning: |-
  We are creating an essay question on "provisional amnesty" for a take-home exam in a course on justice after atrocity. The question must push students beyond the usual restorative vs. retributive debate and force them into the nuances of transitional justice mechanisms.

  Key elements to include in the question:
  - The concept of provisional amnesty (as defined by the instructor) and how it differs from existing models (like South Africa and Argentina).
  - The three jobs of amnesty: (1) settling with actors who could wreck the transition, (2) inducing testimony, and (3) making a statement about the wrong and the new political community.
  - The epistemic issues with testimony bought by immunity and the shift in the role of truth commissions.
  - The standing worry (trading away victims' claims) and the credibility point (amnesty as inherently provisional).
  - A way to discuss Rwanda (gacaca courts) and the difference between amnesty and non-prosecution due to capacity.
  - Force a choice: no fence-sitting.

  The question should be framed to require critical engagement and force a choice.

  Let's draft the question:

  **Essay Question**

  In recent years, some scholars have proposed a model of "provisional amnesty" for addressing atrocities during political transitions. Under this model, individuals are granted immediate immunity from prosecution upon application, but this immunity remains defeasible for a fixed period (e.g., 15 years). It lapses if: (a) the applicant's disclosure is found to be incomplete or contradicted by other evidence (especially victims' testimony), or (b) the state fails to meet its own timetable for reparations, vetting, and institutional reform. After the fixed period, if none of these conditions are triggered, the amnesty becomes permanent.

  Critically evaluate whether provisional amnesty, as described above, represents a morally justifiable and politically prudent improvement upon existing approaches to amnesty in transitional justice. In your answer, you must:

  - Distinguish at least three distinct functions that amnesty might serve in transitional contexts, and explain how provisional amnesty reconfigures the weight and operation of these functions.
  - Address the epistemic challenges of relying on testimony induced by immunity, and the implications of shifting truth commissions from truth-telling bodies to adjudicative ones.
  - Engage with the objection that the state lacks the standing to trade away victims' rights to justice, and the argument that all state-granted amnesties are inherently provisional (using the Argentine case as an example).
  - Compare and contrast provisional amnesty with the approach taken by Rwanda's gacaca courts and with the practice of non-prosecution due to institutional incapacity.
  - Conclude by taking a clear position: either defend provisional amnesty as a superior model, or reject it in favor of one of the existing alternatives (e.g., the South African model, the Argentine model, or the Rwandan approach). Your conclusion must not be equivocal.

  ---

  Now, we need a model answer (900-1000 words) that a truly excellent student might produce in a week. It should:
  - Have a clear thesis (force a choice).
  - Include one real concession to the strongest objection and one loose end.

  **Model Answer (approx. 950 words):**

  **Provisional Amnesty: A Pragmatic but Flawed Innovation**

  Provisional amnesty represents a novel attempt to reconcile the competing demands of truth, justice, and stability in the aftermath of atrocity. By making immunity contingent on both the perpetrator's continued honesty and the state's fulfillment of its obligations, it seeks to mitigate the moral hazards of traditional amnesty models. However, despite its pragmatic appeal, provisional amnesty ultimately fails to resolve the core tensions of transitional justice. I argue that it is an unstable compromise, less effective than the Rwandan approach of reduced sentences for confessions and less honest than the Argentine model of explicitly reversible amnesties.

  **Three Functions of Amnesty and Provisional Amnesty's Reconfiguration**

  Amnesty in transitional contexts typically serves three functions: (1) *political stability* by neutralizing spoilers who might derail the transition; (2) *epistemic gain* by incentivizing perpetrators to disclose truths that would otherwise remain hidden; and (3) *symbolic refounding* by defining the nature of the wrongs and the values of the new political community. The South African Truth and Reconciliation Commission (TRC) prioritized the second and third functions, trading final immunity for full disclosure and public acknowledgment. Provisional amnesty, however, shifts the emphasis. By making immunity defeasible, it elevates the first function (stability) in the short term while attempting to secure the second (truth) and third (refounding) over the long term. But this reconfiguration is problematic: it undermines the very stability it seeks by creating a prolonged period of uncertainty for perpetrators, and it makes the epistemic gain contingent on future state performance, which may be beyond the control of the amnesty-granting body.

  **Epistemic Challenges and the Adjudicative Burden**

  The provisional model also exacerbates the epistemic compromises inherent in amnesty-for-truth deals. Testimony induced by the promise of immunity is always epistemically suspect because it may be tailored to secure the benefit. But provisional amnesty compounds this by requiring continuous verification and adjudication. The South African TRC, for all its flaws, at least had a clear mandate: to establish as complete a picture as possible without the burden of proving perjury. Provisional amnesty, by contrast, turns the truth commission into a quasi-judicial body that must constantly evaluate the veracity of testimony against new evidence (especially victims' accounts) for up to 15 years. This not only diverts resources from broader truth-seeking but also risks re-traumatizing victims by subjecting their testimony to adversarial scrutiny. The model assumes that truth can be objectively corroborated over time, but in contexts of mass atrocity, evidence is often fragmentary and contested, making such corroboration a fraught and potentially divisive process.

  **Standing and Credibility: The Argentine Lesson**

  Provisional amnesty also grapples with two structural objections. First, the *standing worry*: does the state have the moral authority to trade away victims' rights to justice? Proponents argue that the state must balance individual justice against collective peace. But provisional amnesty does not resolve this; it merely postpones the final trade-off. Second, the *credibility objection*: if successor governments can annul amnesties (as in Argentina, where amnesty laws were repealed and prosecutions resumed), then all amnesties are effectively provisional. The Argentine case suggests that the only honest approach is to acknowledge this contingency upfront. Provisional amnesty does so, but at the cost of making the promise of immunity inherently weak. If perpetrators anticipate that amnesty may be revoked due to state failure (e.g., missed reparations deadlines), they may be less likely to participate, undermining the model's stability and truth-seeking goals.

  **Rwanda and Non-Prosecution: A Better Alternative?**

  Compared to other models, provisional amnesty lacks the moral clarity of Rwanda's gacaca courts. In Rwanda, perpetrators were offered reduced sentences (not immunity) in exchange for confession and apology. This approach avoided the standing worry by delivering a measure of punishment while still incentivizing truth-telling. It also sidestepped the epistemic pitfalls of amnesty: because confessions were given in the shadow of punishment, they were arguably more credible (though coerced confessions remained a problem). Moreover, gacaca's focus on community-level adjudication facilitated local reconciliation without relying on state capacity for long-term monitoring. Provisional amnesty, by contrast, depends heavily on a functional state apparatus to verify disclosures and deliver reparations—a luxury many transitioning societies lack. Finally, provisional amnesty must be distinguished from mere non-prosecution due to overwhelmed courts. The latter is a pragmatic acknowledgment of incapacity, not a designed feature of justice; provisional amnesty, however, claims to be a positive moral and political choice, which makes its contingent promises harder to defend.

  **Conclusion: The Unstable Compromise**

  Provisional amnesty is an innovative but flawed attempt to address the limitations of existing models. Its strength lies in acknowledging the provisional nature of all transitional justice compromises. Yet, by trying to serve all three functions of amnesty simultaneously, it risks serving none effectively. The prolonged uncertainty may deter perpetrator cooperation, the adjudicative burden may overwhelm truth commissions, and the dependence on state performance may render the entire scheme unstable. In contrast, the Rwandan model of reduced sentences offers a more sustainable balance: it delivers tangible justice while incentivizing truth, without the false promise of permanent immunity. I concede that gacaca had its own flaws, including limited due process and community pressures. But as a model for balancing truth and justice, it is superior to provisional amnesty, which ultimately offers only an illusion of control over an uncertain future. One loose end remains: how to design a system that holds the state accountable for reparations without tying individual amnesty to systemic failures—a problem provisional amnesty highlights but does not solve.

  ---

