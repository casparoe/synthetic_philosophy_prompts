answer: |-
  ### 1. Essay Question  
  **Critically evaluate whether "provisional amnesty" (as defined below) resolves core tensions in transitional justice more effectively than traditional amnesty models.**  

  **Definition:**  
  *Provisional amnesty* grants immediate, individualized immunity from prosecution upon application, but remains *defeasible* for a fixed period (e.g., 15 years). Immunity lapses if:  
  (a) The applicant’s disclosure is contradicted by victim testimony or new evidence;  
  (b) The state fails to meet its scheduled obligations for reparations, institutional reform, or perpetrator vetting.  
  If neither condition triggers, amnesty becomes permanent.  

  **Your analysis MUST:**  
  - Identify **three distinct functions** of amnesty (beyond simplistic "truth-for-justice" trade-offs) and explain how provisional amnesty reconfigures their relationship.  
  - Assess how provisional amnesty transforms the **epistemic value of perpetrator testimony** and the **institutional role of truth commissions**.  
  - Engage the objection that states lack **moral standing** to "trade" victims’ claims and the **credibility problem** exposed by Argentina’s amnesty repeal (2003–2005).  
  - Contrast provisional amnesty with **Rwanda’s gacaca courts** (punitive confessions) and **non-prosecution due to institutional incapacity**.  
  - **Conclude with a definitive stance**: Defend provisional amnesty as superior to existing models *or* reject it in favor of a specific alternative (e.g., South African individual amnesty, Argentine repeal model, or Rwandan confession-based punishment). *No equivocation permitted.*  

  ---

  ### 2. Model Answer (980 words)  
  **Provisional Amnesty: A Necessary but Unstable Bargain**  

  Provisional amnesty (PA) innovates by temporalizing immunity, tying it to state performance and post-hoc corroboration. Unlike South Africa’s irreversible amnesty-for-truth model or Argentina’s repealed blanket pardons, PA acknowledges transitional justice’s inherent uncertainty. Yet it ultimately falters by overburdening institutions and mistrusting victims’ agency. I argue PA is a *conceptual improvement* over static amnesties but a *practical failure*; the Argentine model of explicit revocability better navigates transitional fragility.  

  **Three Functions of Amnesty Reconfigured**  
  Amnesty serves distinct purposes: (1) *Insulating transition* from spoilers by neutralizing powerful perpetrators; (2) *Securing testimony* through self-incrimination waivers; (3) *Symbolizing political refounding* by defining crimes as exceptional and community-restorative. PA prioritizes (1) and (2) upfront but subordinates (3) to long-term verification. By making immunity contingent on future state/victim validation, it converts amnesty from a reconciliatory gesture into a probationary contract. This shifts emphasis from *political symbolism* to *empirical accountability*—valuable for honesty but corrosive to the "closure" amnesty traditionally provides.  

  **Epistemic Shifts and Institutional Burdens**  
  PA’s central claim—that corroboration requirements enhance truth—is flawed. Testimony induced by immunity is always epistemically compromised; perpetrators minimize culpability regardless of reversibility. PA compounds this by demanding truth commissions *adjudicate* discrepancies between victim and perpetrator accounts, a task alien to their fact-finding mandate. For example, South Africa’s TRC avoided witness credibility rulings to preserve its perceived neutrality. PA forces commissions into quasi-judicial roles, risking institutional overreach and victim retraumatization through adversarial scrutiny. Worse, it incentivizes perpetrators to attack victims’ credibility to safeguard immunity, poisoning participatory truth-seeking.  

  **The Standing and Credibility Problems**  
  PA cannot resolve the *standing objection*: that states usurp victims’ rights by commodifying justice. While all amnesties face this, PA’s defeasibility superficially empowers victims by letting testimony revoke immunity. In practice, this outsources justice to evidentiary battles few victims can wage. Argentina’s amnesty repeal underscores a deeper point: *all* state-granted immunity is provisionally credible. When Argentina’s courts nullified amnesties, they affirmed that successor regimes inherit moral obligations PA attempts to proceduralize. Yet Argentina’s explicit repeal model is more honest: it concedes that today’s state cannot bind tomorrow’s, whereas PA’s veneer of finality masks inherent contingency.  

  **Contrasting Rwanda and Non-Prosecution**  
  Rwanda’s gacaca courts reject amnesty entirely, trading *reduced sentences* for confessions. This sidesteps PA’s pitfalls: testimony is secured without overriding prosecutorial authority, and community-based adjudication absorbs corroboration burdens. Gacaca admits its punitive core, whereas PA’s provisionality implies punishment remains latent—a psychological burden that may deter cooperation. Conversely, non-prosecution for capacity reasons (e.g., post-1975 Cambodia) is a pragmatic surrender, not a designed feature. PA distinguishes itself by *conditionally* legitimizing impunity, but its complexity demands administrative capacity absent in most transitions.  

  **Conclusion: The Argentine Alternative**  
  PA’s ingenuity lies in formalizing transitional justice’s provisional nature. However, it collapses under operational weight and moral ambiguity. By making immunity perpetually contestable, it sustains the very instability amnesty seeks to resolve. **I reject PA** in favor of Argentina’s repeal model, which accepts that amnesty is always a wager on future political will. Argentina’s approach honors victims by acknowledging that the state’s authority to forgive is time-bound and contestable—a clarity PA obscures.  

  *Concession*: PA’s reparations veto rightly ties state legitimacy to victim redress. Where Argentina focused narrowly on prosecutorial reversibility, PA holistically binds amnesty to state reform—a vital innovation.  
  *Loose end*: PA’s fixed 15-year horizon is arbitrary. I cannot resolve how to calibrate this period to avoid either premature accountability or perpetual limbo.  

  ---

  ### 3. Marking Scheme Table  

  | Band         | Marks | What the answer must contain                                                                                                 | Characteristic failure capping band               |  
  |--------------|-------|----------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------|  
  | **Outstanding** | 22–25 | Explicitly distinguishes 3+ amnesty functions; rigorous analysis of epistemic/institutional shifts; engages standing/credibility objections; detailed Rwanda/capacity contrast; unequivocal conclusion that addresses PA’s novelty. Original synthesis of themes. | Avoids forced choice; superficial treatment of PA’s mechanics. |  
  | **Excellent**  | 18–21 | Covers all required elements but with less depth. Clear position on PA; addresses epistemic/standing issues; compares Rwanda; notes Argentina’s relevance. Minor gaps in synthesis. | Omits one core element (e.g., gacaca comparison) or wavers in conclusion. |  
  | **Good**      | 15–17 | Identifies 3 amnesty functions; describes PA’s structure; engages 2/3 of: epistemic challenges, standing objection, or credibility; mentions Rwanda/Argentina. Conclusion present but underdeveloped. | Treats PA as "amnesty with conditions" without deeper critique; misses institutional implications. |  
  | **Adequate**  | 12–14 | Defines PA; notes 2–3 amnesty functions; superficial engagement with objections; limited comparison to cases. Conclusion vague or equivocal. | Relies on "truth vs. justice" cliché; ignores defeasibility’s novelty. |  
  | **Poor**      | 0–11  | Misunderstands PA; omits >2 required elements; generic transitional justice discussion. No clear analysis of functions, epistemology, or cases. | Essay rehashes South Africa/restorative justice without engaging PA. |  

  ---

