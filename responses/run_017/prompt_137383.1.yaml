  | Adequate | 12-14 | A basic answer that touches on some required elements but with minimal critical engagement. May list points without developing an argument. Position may be unclear or weakly defended. | Omits multiple required elements or relies heavily on clichéd trade-off arguments without engaging the specifics of provisional amnesty. |
