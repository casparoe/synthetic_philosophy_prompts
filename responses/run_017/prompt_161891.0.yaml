answer: |-
  ### Engineered Demon Scenario  
  **Setup:** A box of classical ideal gas at temperature *T* is bisected by a partition with a frictionless, massless shutter. A weight is attached via a pulley to the partition. The demon is a feedback controller with a finite memory tape initialized with cells biased to "0" (90% zeros, 10% ones, statistically independent). The tape advances unidirectionally; cells are read once, the demon uses the bit to decide whether to open the shutter when a molecule approaches (e.g., open only if "1"), and overwrites the cell with new data (e.g., recording molecule position). The tape exits the system and is never reused. All operations (shutter movement, tape advance) are quasi-static and thermodynamically reversible. The demon’s gating mechanism is mechanically interlocked with the tape state, preventing thermal jitter from randomizing decisions (e.g., the tape physically blocks/permits shutter motion via a pinned lever).  

  ---

  ### Cycle & Accounting  
  **Cycle:**  
  1. **Measurement:** A molecule approaches the partition. The demon reads the current tape cell (bit *B*).  
  2. **Decision:** If *B* = 1, the shutter opens quasi-statically, allowing the molecule to cross. If *B* = 0, it remains closed.  
  3. **Recording:** The demon overwrites *B* with new data (e.g., "which side the molecule is on").  
  4. **Reset avoidance:** The tape advances irreversibly, carrying away the written bit.  

  **Work extracted:**  
  - When the shutter opens and a molecule crosses, the gas exerts work *W* = *kT* ln(2) on the weight (from the free expansion of a single molecule in half the volume).  
  - Probability of *B* = 1 is *p* = 0.1, so **average work per cycle** = *p* · *kT* ln(2) = 0.1 *kT* ln(2).  

  **Entropy changes:**  
  - **Gas entropy:** Decreases by *k* ln(2) when a molecule is confined to one side (if shutter opens).  
  - **Tape entropy:**  
    - Initial Shannon entropy per cell: *H_initial* = −(*q* ln *q* + (1−*q*) ln(1−*q*)) where *q* = P(0) = 0.9.  
    - After overwriting, the cell contains new data (e.g., molecule position: 50% 0/1, entropy *k* ln(2)).  
    - **Entropy increase per cell**: Δ*S_tape* = *k* ln(2) − *H_initial*.  
  - **Net entropy change per cycle:**  
    Δ*S_total* = Δ*S_gas* + Δ*S_tape* = [−*p* *k* ln(2)] + [*k* ln(2) − *H_initial*] = *k* ln(2)(1 − *p*) − *H_initial*.  
    Plugging *p* = 0.1, *H_initial/k* = −(0.9 ln 0.9 + 0.1 ln 0.1) ≈ 0.325:  
    Δ*S_total* = *k*[ln(2)(0.9) − 0.325] ≈ *k*(0.624 − 0.325) = **0.299*k* > 0**.  
    **Second law holds**: Total entropy increases.  

  **Per-cell "budget":**  
  The work extracted per tape cell is *p* · *kT* ln(2) = 0.1 *kT* ln(2).  
  The thermodynamic cost is paid by **increasing the tape’s entropy** by Δ*S_tape* = *k* ln(2) − *H_initial* ≈ 0.693*k* − 0.325*k* = 0.368*k*.  
  - **Key inequality**: *W_extracted* ≤ *T* · Δ*S_tape*  
    0.1 *kT* ln(2) ≈ 0.069 *kT* ≤ *T* · (0.368*k*) ≈ 0.368 *kT* ✓  

  ---

  ### Three Accounts Compared  
  1. **Erasure/Landauer account**:  
     - Claims: Cost is *kT* ln(2) per bit erased.  
     - Here: **No erasure occurs**. Cells are overwritten (not reset) and discarded. Landauer’s principle doesn’t apply.  
     - Outcome: Empty-handed — the demon avoids erasure entirely.  

  2. **Fluctuation account**:  
     - Claims: Demon exploits thermal fluctuations, but measurement dissipates energy.  
     - Here: **No dissipation**. Operations are reversible; measurement is logically separated from physics (tape state gates mechanics directly). Fluctuations aren’t "rectified" — the shutter’s interlock prevents thermal noise from causing errors.  

  3. **Information-reservoir account**:  
     - Claims: The tape is a low-entropy fuel. Work per cell is *kT* times the **Kullback-Leibler divergence** *D*<sub>KL</sub>(*p*<sub>tape</sub> || uniform).  
     - Here:  
       - Initial tape distribution: *P*(0) = 0.9, *P*(1) = 0.1.  
       - Divergence from uniform: *D*<sub>KL</sub> = 0.9 ln(0.9/0.5) + 0.1 ln(0.1/0.5) ≈ 0.9 ln(1.8) + 0.1 ln(0.2) ≈ 0.587 − 0.161 = **0.426**.  
       - Max extractable work: *kT* · *D*<sub>KL</sub> ≈ 0.426 *kT*.  
       - Actual work: 0.069 *kT* < 0.426 *kT* (limited by demon’s protocol).  

  **Per-cell budget**: Not *kT* ln(2) (≈0.693 *kT*), nor *kT* times Shannon entropy (0.325 *kT*), but **up to *kT* · *D*<sub>KL</sub>** (0.426 *kT*). Your intuition is **correct**: a 90%-zero tape is "partial fuel" — its value scales with its divergence from randomness.  

  ---

  ### Critical Feature & Collapse  
  **The single feature:** The tape is **discarded after one use**. The low-entropy resource is consumed irreversibly.  

  **If modified:**  
  - **Already-random tape** (*q* = 0.5): *H_initial* = *k* ln(2), Δ*S_tape* = 0. Work extraction violates Δ*S_total* ≥ 0.  
  - **Recycle the tape**: The demon must erase cells to reuse them, invoking Landauer’s *kT* ln(2) cost per bit, collapsing into the standard exorcism.  

  **Friend’s strongest counter:**  
  *"Preparing the 90%-zero tape required an entropy decrease elsewhere, costing at least *kT* · (*D*<sub>KL</sub> + *H*) per cell — identical to erasing a random bit. Your ‘new’ resource is just pre-erasure."*  
  **Rebuttal**: True, but this demon **decouples the cost in space and time**. Erasure isn’t needed *in situ*; the tape is a portable battery. The exorcism is distinct: **Landauer kills the demon during memory reset; here, the demon dies of tape starvation**.  

  **What this case can’t settle**:  
  - Whether information *is* physical (it is — the tape has thermodynamic state).  
  - Whether intelligence is reducible to mechanics (we assumed a simple controller).  
  - The ultimate source of low-entropy reservoirs (cosmology lurks).  

  ### Verdict  
  The essential resource is **low entropy in the information reservoir**, not erasure. Erasure is one way to *replenish* the reservoir, but not the only way. Your demon runs on pre-paid tape, and the per-cell budget is *kT* · *D*<sub>KL</sub>, confirming your 90%-zeros intuition.  

  ---  
  *Final note: This exorcism is leaky — discard the tape carelessly, and you heat the universe.*
