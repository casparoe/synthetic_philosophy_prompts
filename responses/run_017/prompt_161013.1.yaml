  Row 3: Status of operational criteria.

  - Crux: The role of operational criteria in defining species.
  - Neutral: Whether operational criteria (such as reproductive isolation or diagnosability) are constitutive of species status or merely evidentiary of it.
  - Pluralist: Operational criteria are constitutive: meeting a particular criterion (under a given concept) is what makes a group a species; there is no underlying property beyond what the criterion tests.
  - Monist: Operational criteria are indicative: they are tools for detecting the underlying property of being a separately evolving lineage; they do not define what a species is but only provide evidence for it.
  - Verdict: Substantive. It's about the role of criteria.

  Row 4: Identity of taxa under different concepts.

  - Crux: Whether changing the concept changes the taxon or its status.
  - Neutral: If a group is considered a species under one concept but not under another, does this mean that the same historical individual is being assigned different statuses, or that the concepts are referring to different groupings?
  - Pluralist: One and the same historical individual (a group of organisms) can be a species under one concept and not under another, because species status is relative to the concept and the biological property it emphasizes.
  - Monist: Changing the concept changes the referent: the groupings that are species under the correct monistic concept are the real species taxa; other groupings, even if real, are not species. Thus, a group that is a species under one concept but not under the correct one is not the same taxon in the sense of the species category.
  - Verdict: Partly verbal. The term "taxon" may be used differently. Under a stipulated sense of "taxon" as a historical individual (which both agree on), the disagreement is about whether that individual can have the property of being a species under one concept and not under another. The monist would say that the concept defines what a species is, so if it doesn't meet the concept, it isn't a species. The pluralist says the concept selects which property we care about. So residual substantive issue: whether the same historical individual can be a species under one concept and not under another.

  Row 5: Cross-clade comparisons of species number.

  - Crux: Legitimacy of species counts across clades with different reproductive systems.
  - Neutral: Whether the number of species in a clade is a biologically meaningful quantity that can be compared across clades that differ in their reproductive biology (e.g., sexual vs. asexual).
  - Pluralist: Species number is a legitimate comparative measure only relative to a chosen species concept; different concepts may be appropriate for different clades, and comparisons across clades must account for the concept used.
  - Monist: Species number is a legitimate comparative measure because it reflects the number of independently evolving lineages, which is an objective fact even in asexual clades; however, operational challenges may make it difficult to count in asexual groups, but the number is still determinate.
  - Verdict: Substantive. The monist believes in an objective count, the pluralist that it is concept-relative.

  Row 6: Identity over time without branching.

  - Crux: The persistence of species in anagenetic change.
  - Neutral: How to individuate a species taxon over time in the absence of branching events, when the lineage undergoes continuous change.
  - Pluralist: In the absence of branching, the assignment of species boundaries over time is arbitrary under any concept, so the species taxon's identity over time is a matter of convention; we may recognize multiple successive species or one, depending on the purpose and the threshold chosen.
