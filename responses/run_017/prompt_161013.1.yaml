answer: |-
  ### Joint Statement on the Species Problem: Pluralist and Monist Perspectives

  After a good-faith adversarial collaboration, we the undersigned—a pluralist and a monist about the species category—present this document to articulate our agreements, disagreements, and paths for resolution. Both parties accept the distinction between the species taxon question (whether a particular group is a species) and the species category question (what it means to be a species). Both treat species taxa as historical individuals with origin and extinction conditions, not as classes defined by essences. Both agree that the rank of species carries no metaphysical privilege over higher or lower taxonomic ranks. This statement reflects our commitment to clarity, mutual understanding, and the advancement of biological science.

  #### Part 1: Agreed Claims  
  The following claims are substantively agreed upon, with wording acceptable to both parties. Each represents a commitment that, if denied, would constitute a significant departure from our shared framework.  

  1. Operational criteria for species delimitation (e.g., reproductive isolation, diagnosability, ecological distinctness, monophyly) test distinct biological properties—such as barriers to gene flow, adaptive divergence, or historical relatedness—but do not inherently define the species category.  
  2. Interbreeding criteria fail for asexual organisms, uniparental organisms, and reticulate groups (e.g., hybridizing complexes) because they rely on sexual reproduction, which is absent or irrelevant in these cases.  
  3. Diagnosability criteria, which require fixed character differences, can fragment continuously varying lineages into arbitrary units due to sampling density, character selection (e.g., choice of loci), and threshold sensitivity.  
  4. Ecological distinctness criteria identify groups based on shared adaptive traits or niche occupation, which may not align with groupings based on reproductive or phylogenetic criteria.  
  5. Monophyly criteria, which require shared ancestry and exclusivity, are contingent on available data and may conflict with other criteria when lineages are incompletely sorted or when hybridization occurs.  
  6. Different operational criteria can produce groupings that are nested (e.g., monophyletic subgroups within a reproductively cohesive unit), cross-cutting (e.g., ecotypes that span multiple reproductively isolated groups), or incommensurable (e.g., reproductive units vs. ecological units in asexual clades).  
  7. The groupings identified by operational criteria reflect real biological properties (e.g., gene flow patterns, adaptive divergence, or phylogenetic splits), even when these properties are not coextensive.  
  8. Taxonomy requires operational criteria for consistent species delimitation, but these criteria must balance theoretical ideals with practical needs for stability, communication, and predictability.  
  9. Conservation law requires species delimitation to prioritize distinctiveness (e.g., diagnosability or ecological uniqueness) to protect threatened entities, even if they lack reproductive isolation or monophyly.  
  10. Biodiversity accounting requires comparable units for diversity assessment, which may involve different criteria (e.g., reproductive isolation for sexual taxa, ecological roles for microbial communities) to serve cross-clade comparisons.  
  11. Lineages vary continuously in many cases (e.g., ring species or anagenetic sequences), making non-arbitrary species boundaries impossible to define without branching events.  
  12. Hybridization can generate new, reproductively isolated lineages (e.g., allopolyploids) that are ecologically distinct and warrant species status under some criteria, even if parental lineages persist.  
  13. A single group of organisms may be delimited as one species under one criterion (e.g., reproductive cohesion) and multiple species under another (e.g., diagnosability), without altering the group's existence as a historical individual.  
  14. Species concepts are indispensable tools for biological inquiry, but their application depends on context, such as the reproductive biology of the clade or the goals of the study (e.g., evolutionary theory vs. conservation).  

  #### Part 2: Disagreements Table  
  This table outlines key disagreements, with neutral restatements, each party's formulation, and an assessment of whether the dispute is verbal (stemming from term usage) or substantive (reflecting deeper ontological or epistemological differences).  

  | Crux | Neutral Restatement | Pluralist Formulation | Monist Formulation | Verdict |  
  |------|---------------------|------------------------|---------------------|----------|  
  | **1. Number of legitimate accounts of the species category** | Whether the species category can be defined by multiple equally valid concepts or only one correct concept. | The species category is plural: multiple concepts (e.g., biological, ecological, phylogenetic) are equally legitimate, each corresponding to a distinct biological question (e.g., reproductive boundaries, adaptive role, historical unity). | The species category is unitary: only one concept (e.g., lineage independence) is correct; alternative concepts are either approximations to this or address different phenomena. | Substantive. Disagreement over whether species is a single natural kind or a term for multiple kinds. |  
  | **2. Interpretation of conflicts among operational criteria** | Whether discordance in groupings from different criteria (e.g., reproductive vs. diagnosability) indicates biological multiplicity or limitations in evidence. | Conflict reflects genuine biological multiplicity: criteria capture distinct real properties (e.g., gene flow vs. adaptation), so discordance is ontological, not merely evidential. | Conflict arises from evidential limitations: criteria are proxies for lineage independence, and discordance signals imperfect data or proxies, not multiple realities. | Substantive. Disagreement over the ontological status of conflicting groupings. |  
  | **3. Role of operational criteria in species status** | Whether meeting an operational criterion constitutes species status or merely provides evidence for it. | Operational criteria are constitutive: a group is a species by satisfying a criterion (e.g., reproductive isolation) under a concept; there is no "deeper" status beyond this. | Operational criteria are indicative: they provide evidence for lineage independence but do not define species status, which depends solely on the underlying reality. | Substantive. Disagreement over the relationship between criteria and category. |  
  | **4. Taxon identity under different concepts** | Whether a group considered a species under one concept but not another remains the same historical individual with varying status, or whether the concept change alters the taxon referent. | The same historical individual can be a species under one concept and not under another (e.g., a group may be reproductively cohesive but not diagnosable), with status relative to the concept. | Changing the concept changes the taxon referent: only groups satisfying the correct concept (lineage independence) are species; other groupings are real but not species taxa. | Partly verbal. Under a stipulated sense of "taxon" as a historical individual, the residual disagreement is whether that individual can have species status under one concept but not another. The term "species" is doing the work. |  
  | **5. Legitimacy of species counts across clades** | Whether species numbers are comparable across clades with different reproductive systems (e.g., sexual vs. asexual) or if counts are concept-dependent. | Species counts are legitimate for comparison only when relativized to a concept; different concepts may be needed for different clades, making unrelativized counts meaningless. | Species counts reflect the objective number of independent lineages and are comparable across clades; operational challenges in asexual groups do not negate this determinacy. | Substantive. Disagreement over the objectivity and universality of lineage counts. |  
  | **6. Species identity in anagenesis (no branching)** | How to individuate species over time in unbranching lineages with continuous change. | Species boundaries in anagenesis are arbitrary under any concept; a lineage may be one or many species depending on the criterion (e.g., morphological thresholds). | The entire anagenetic lineage is one species (as it is a single independent lineage), though practical taxonomy may impose arbitrary divisions for convenience. | Partly verbal. Under stipulated "species" as lineage segment, the residual disagreement is whether anagenetic lineages must be treated as one species (monist) or can be split (pluralist). |  

