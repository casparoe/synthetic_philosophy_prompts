  | **Applicability to asexual organisms and lineage definition** | **Case B: Kappa clade** (asexual bacteria with two ecotypes, low inter-ecotype recombination, high gene turnover, and core gene sweeps). | Ecotypes are species under ecological concept (distinct niches/sweeps) but not monophyly concept (due to gene transfer). Clade is one lineage phylogenetically but multiple operationally. Monist's lineage criterion fails due to gene transfer obscuring lineage boundaries. | Ecotypes are species (two lineages) due to independent evolution (niche divergence, restricted gene flow). Core genes define lineages; gene transfer is noise. Monist's criterion survives if lineages are discernible via ecological/genomic coherence. | If ecotypes lack distinctiveness under all criteria (e.g., no ecological or genomic clustering), undermining pluralism. | If core genes show no vertical transmission or ecotypes lack cohesion, negating lineage independence. |  
  | **Effect of reticulation and anagenesis on species counts** | **Case C: Reticulation and deep time** (allopolyploid speciation in ferns; anagenetic fossil sequence with morphological change but no branching). | Allopolyploid adds one species (new reproductive/ecological unit), increasing total. Fossil sequence: one lineage but three morphospecies under morphological concept; no objective boundaries. Fossil record cannot settle segmentation without branching. | Allopolyploid adds one species (new independent lineage), increasing total. Fossil sequence: one species (single lineage); morphological "species" are arbitrary. Fossil record can show lineage existence but not boundaries without branching. | If allopolyploid reintegrates with parents (no isolation), negating new species status. | If branching is found in anagenetic sequence (e.g., cryptic speciation), validating lineage splits. |  

  #### Part 4: Closing Paragraph  
  We agree that further empirical work on groups with atypical biology (e.g., asexual, hybridizing, or fossil taxa) and conceptual refinement of lineage independence in light of horizontal gene transfer, reticulation, and anagenesis could resolve some disagreements. Neither party should expect universal non-arbitrary species boundaries, as continuous variation and fuzzy lineages are inherent in biology. The pluralist most wants the monist to concede that multiple, equally fundamental biological groupings exist, and no single concept captures all evolutionary or ecological phenomena. The monist most wants the pluralist to concede that lineage independence is an objective, unifying property underlying species phenomena, even when operational proxies conflict. Part of our dispute is verbal: if "species" is stipulated to mean "segments of metapopulation lineages," the pluralist would argue that other groupings (e.g., reproductive or ecological units) remain biologically significant but should not be called "species," while the monist would contend that only lineages merit the term. The residual substantive disagreement is whether biology has one privileged "joint" (lineages) for the species category or multiple equally real "joints" (reproductive, ecological, phylogenetic) that all warrant the name.  

