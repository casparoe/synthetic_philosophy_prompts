  This table uses hypothetical cases to evaluate disagreements. Predictions are written as if outcomes are unknown. "Move" conditions specify empirical or conceptual results that would challenge each party's position.  

  | Crux | Case/Argument | Pluralist's Prediction | Monist's Prediction | Outcome That Would Move Pluralist | Outcome That Would Move Monist |  
