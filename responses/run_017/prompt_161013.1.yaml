  We are drafting a joint statement after an adversarial collaboration between a pluralist and a monist about the species concept. We have four parts: agreed claims, disagreements table, tests-and-predictions table, and a closing paragraph.

  Part 1: Agreed Claims (10-14 substantive claims, numbered)

  We need to cover:
  - What the familiar criteria (interbreeding, diagnosability, ecology, monophyly) actually test.
  - Why interbreeding criteria fail for asexual, uniparental, and reticulate groups.
  - Why diagnosability criteria fragment continuously varying lineages and are sensitive to sampling and choice of loci.
  - Circumstances under which different criteria yield nested, cross-cutting, or incommensurable groupings.
  - What taxonomy, conservation law, and biodiversity accounting need from a species concept.

  Also, both parties agree on:
  - Distinction between taxon and category questions.
  - Species taxa as individuals (historical entities) not classes.
  - No metaphysical privilege for species rank.

  We must phrase each claim so neither side feels the wording is tilted.

  Drafting the agreed claims:

  1. The operational criteria commonly used to delimit species (including reproductive isolation, diagnosability, ecological distinctness, and monophyly) are not equivalent to the definition of the species category but are instead tools for identifying taxa that may qualify as species under a given concept.

  2. Reproductive isolation criteria (based on interbreeding) are inapplicable to asexual organisms, uniparental organisms, and groups with extensive reticulation (e.g., hybridization), because these groups lack the necessary sexual recombination for such criteria to be tested.

  3. Diagnosability criteria (based on fixed character differences) are sensitive to sampling density, the choice of characters (e.g., genetic loci), and the thresholds set for differentiation; in continuously varying populations, these criteria can artificially fragment a single lineage into multiple species.

  4. Different operational criteria can yield groupings that are nested (e.g., when one criterion identifies a subset of the groups identified by another), cross-cutting (e.g., when groups identified by one criterion overlap with but do not align with groups from another), or incommensurable (e.g., when criteria address fundamentally different properties, such as reproductive boundaries versus ecological niches).

  5. The groupings identified by operational criteria are real in the sense that they reflect objective biological properties (e.g., patterns of gene flow, ecological adaptation, or phylogenetic history), even when they do not align.

  6. Taxonomy requires a consistent and operationalizable method for assigning species rank to taxa, which may vary depending on the goals (e.g., stability, predictive power, or reflection of evolutionary processes).

  7. Conservation law often requires a clear and defensible listing of protected entities, which may prioritize diagnosability, ecological distinctness, or evolutionary potential, and may need to accommodate non-reproductively isolated groups.

  8. Biodiversity accounting requires comparable units across taxa and ecosystems, which may be served by different concepts in different contexts (e.g., reproductive isolation for sexually reproducing organisms, ecological distinctness for microbes).

  9. The species rank, like other taxonomic ranks, is a human construct without inherent metaphysical privilege; lineages exist at various levels of divergence, and the assignment of species status is a matter of convention and practicality.

  10. Species taxa are historical individuals with a beginning (via speciation) and an end (via extinction or speciation) and are composed of organisms connected by descent.

  11. In cases of continuous change without branching (anagenesis), the assignment of species boundaries over time is arbitrary under any operational criterion, because there are no non-arbitrary points to divide the continuum.

  12. Hybridization and reticulation events can create lineages that are reproductively isolated from their parents and ecologically distinct, which may be recognized as species even if the parental species persist.

  13. The same group of organisms can be considered a single species under one criterion and multiple species under another, depending on which biological properties are emphasized.

  14. The term "species" is used in multiple biological contexts (e.g., evolutionary biology, ecology, systematics) and may serve different purposes, leading to the use of different criteria.

  We have 14 claims. Now, we must ensure they are acceptable to both. For example, claim 13 might be acceptable to the pluralist, but the monist might say that only one of these groupings is the real species. However, note that the monist grants that cross-cutting taxa are real (as per the instruction: "the monist must be allowed to grant that cross-cutting taxa are real and that operational criteria are indispensable to practice"). The monist would say that these groupings are real but only one is the species lineage. So claim 13 can stand as: the same group of organisms can be considered a single species under one criterion and multiple species under another, but the monist would add that only one of these is the correct species. But we are writing agreed claims, so we must phrase it in a way that both accept the phenomenon, even if they interpret it differently.

  Similarly, claim 5: both agree that the groupings are real (the pluralist because they carve joints, the monist because they are real properties even if not the species property). So we are safe.

  Part 2: Disagreements Table

  Columns: 
  - Crux (the core issue)
  - Neutral restatement
  - Pluralist formulation
  - Monist formulation
  - Verdict (verbal/substantive; if verbal, which term and what remains)

  Cruxes to include:

  1. Whether the species category admits of one correct account or several legitimate ones.
  2. Whether conflict among criteria is a symptom of evidential limitation or of genuine multiplicity.
  3. Whether operational criteria constitute species status or merely indicate it.
  4. Whether one and the same taxon can be a species under one concept and fail to be one under another while remaining the same individual, or whether changing the concept changes the referent.
  5. Whether species number is a legitimate comparative measure across clades with different reproductive systems.
  6. What identity over time a species taxon has in the absence of branching.

  We'll make a table with these rows.

  Drafting:

  Row 1: The nature of the species category.

  - Crux: The number of correct accounts of the species category.
  - Neutral: Whether there is a single, universally applicable account of what constitutes a species, or whether multiple, equally legitimate accounts exist for different biological contexts.
  - Pluralist: The species category is plural: there are multiple, equally legitimate ways to define what a species is, each corresponding to a distinct biological question (e.g., about reproductive isolation, ecological role, or phylogenetic history).
  - Monist: The species category is unitary: there is a single, correct account of what a species is (e.g., a segment of a population lineage evolving independently), and alternative definitions are either approximations to this account or address different biological phenomena that are not specieshood.
  - Verdict: Substantive. The disagreement is about the nature of the category itself.

  Row 2: Conflict among criteria.

  - Crux: Interpretation of conflicts among operational criteria.
  - Neutral: When operational criteria (e.g., reproductive isolation, diagnosability) yield conflicting groupings, whether this indicates that the criteria are imperfect indicators of a single underlying reality or that there are multiple, equally real ways to group organisms into species.
  - Pluralist: Conflict among criteria reflects genuine multiplicity in the biological world: different criteria capture different real properties that are not unified in a single category, so the conflicts are not merely evidential but ontological.
  - Monist: Conflict among criteria is a symptom of evidential limitation: the criteria are proxies for the single underlying property of lineage independence, and conflicts arise because the proxies are imperfect or because we lack sufficient data to resolve the true lineage boundaries.
