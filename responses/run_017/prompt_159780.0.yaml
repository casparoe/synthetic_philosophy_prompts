prompt: |-
  I record an interview series on formal epistemology and rational choice. My next guest is the author of a recent monograph in the epistemic-programme tradition: her central claim is that solution concepts should be derived as theorems about what follows from explicitly stated epistemic conditions — each player's rationality, common belief in the structure of the game, and, where more than two players are involved, a common prior — rather than imported as assumptions from outside. She is a fast and agile speaker, and she has two habits I want to plan around: she meets objections by saying that they concern the model rather than rationality, and she slides without warning between talk of common knowledge and talk of common belief, treating the latter as the philosophically serious version of the former.

  Three of her claims strike me as more contested than she presents them. First, she holds that a player's conjecture about what an opponent would do at an information set that has not been reached should be held fixed when surprising information arrives — she calls this the invariance of unreached conjectures. It lets her reject forward-induction reasoning, and she uses it to argue that backward induction in a long centipede game is not paradoxical, on the ground that the paradoxical version of the argument smuggles in a belief revision that rationality alone does not license. Second, in her own theorems she replaces common knowledge with mutual belief of finite depth k plus a tolerance ε for error, defines the play that survives iterated elimination at depth k, and asserts that for all but a class of games she calls fragile the depth-k prediction converges on the common-knowledge prediction as k grows and ε shrinks. On that basis she argues that the e-mail game — the coordination example in which agents can communicate only through a channel that fails with small probability and must confirm every message, so that near-common knowledge of the payoff state produces a discontinuity — is not a counterexample to common-knowledge reasoning but a fragile case whose pathology belongs to the channel. Third, she wants to supplement common belief in rationality with a caution condition, roughly that no player ever assigns probability zero to any strategy of any opponent, because this would license eliminating weakly dominated strategies as well as strongly dominated ones, that is, iterated admissibility.

  Draft me ten to twelve questions for this interview, with the following constraints. Include at least one question on each of the five areas above — the knowledge/belief distinction, invariance versus forward induction, the depth-and-ε machinery, caution and iterated admissibility, and the status of the common prior — plus a closing question about what any empirical finding about real players could count as evidence against the programme. For each main question, add a follow-up written against the answer she is most likely to give, not a generic prompt to elaborate: where she will say the distinction makes no difference because her beliefs are probability-one, where she will say the centipede case is settled by her invariance claim, where she will say the e-mail game is fragile. Make her say precisely what her convergence claim concerns — strategies, probabilities of actions, or expected payoffs — and in what sense of convergence, and press her to state a criterion for fragility in advance rather than one that merely relabels the example she needs to explain away. Press likewise on whether rationality plus caution really delivers full iterated admissibility, given that eliminating weakly dominated strategies is sensitive to the order of elimination. On the common prior, ask whether it is a condition on the agents or a feature of the analyst's model, and what that answer implies for the results that agents with a common prior cannot agree to disagree and cannot both expect to gain from a trade each knows to be voluntary. Finally, build a short sequence of two or three questions that makes her "that is a fact about the model, not about rationality" reply progressively harder to fall back on. Keep every question self-contained — she will hear it cold, without her notation in front of her — and avoid anything biographical or about how she came to the view.
reasoning: |-
  Okay, let me break this down. The user is preparing for an interview with a formal epistemology scholar who has specific technical positions and debate tactics. The guest has five core areas of focus: knowledge/belief distinction, invariance vs forward induction, depth-and-ε convergence, caution/iterated admissibility, and common prior status. 

  First, I need to construct questions that force precision on contested claims. The guest tends to deflect with "that's about the model, not rationality," so the sequence must progressively corner that defense. For invariance, she'll likely cite her own principle to dismiss forward induction - the follow-up must isolate why rationality alone forbids belief revision at unreached nodes. 

  The convergence claim needs mathematical tightening: what metric proves depth-k predictions approach common-knowledge solutions? Pointwise? Uniformly? And fragility can't just be defined post-hoc for the email game - she must state general criteria before examples arise. 

  On iterated admissibility, order-sensitivity is the Achilles heel. Does "caution" truly guarantee order-independent elimination when weak dominance is involved? The common prior question must probe its ontological status: is it a constraint on agents or just the modeller's tool? This affects famous impossibility results. 

  The empirical evidence closer is clever - it makes her confront what could falsify the program without relying on model-based excuses. 

  Each question must stand alone without notation. I'll avoid hypotheticals ("suppose a game where...") and instead anchor in known paradoxes (centipede, email game). Follow-ups anticipate her go-to rebuttals but cut off escape routes - e.g., when she calls email game fragile, immediately demand her fragility definition independent of that case. 

  The "model vs rationality" trap sequence starts broad (modeling assumptions), then specific (rationality's scope in invariance), finally forcing her to define rationality's core content if not model-dependent. That should strain her deflection tactic. 

  All while keeping questions crisp enough for verbal delivery. No fluff, no biography - pure epistemology surgery.
answer: |-
  Here are twelve questions designed to meet your specifications, targeting her key claims and anticipated responses while adhering to your constraints:

  1.  **Core Programme:** "Your programme insists solution concepts must be *derived* from explicit epistemic conditions (rationality, common belief in the game, common prior) rather than assumed. Why is this derivation crucial, philosophically, for understanding rational play, as opposed to just accepting standard solution concepts like Nash equilibrium as descriptions of rational outcomes?" *(Follow-up anticipating "model/rationality" deflection):* "When you say solution concepts like Nash are 'assumed' and thus belong to the model, but your derived solutions belong to rationality, what specific *content* does 'rationality' itself add that isn't also just a modeling choice defining the agents?"

  2.  **Knowledge/Belief Distinction:** "You frequently slide between 'common knowledge' and 'common belief' in your work, treating common belief as the philosophically serious version. Could you clarify the precise relationship you see between them, especially given the logical differences, and why the distinction doesn't materially affect your core results?" *(Follow-up anticipating "probability-one belief" answer):* "If common belief (prob. 1) is sufficient for your derivations and equivalent to common knowledge *for practical purposes in games*, why retain the term 'knowledge' at all? Doesn't this blurring risk obscuring genuine philosophical issues about justification or infallibility that knowledge traditionally entails?"

  3.  **Invariance vs. Forward Induction:** "You argue for the 'invariance of unreached conjectures': players hold fixed their conjectures about opponents' play at unreached information sets, even after surprising moves. How does this principle follow strictly from the *rationality* of the players and common belief in the game, rather than being an independent assumption about belief revision?" *(Follow-up anticipating centipede/invariance answer):* "You say invariance resolves the centipede paradox by blocking illicit belief revision. But doesn't *rationality itself* demand that players update their beliefs about an opponent's *type* or *rationality* when observing an unexpected, seemingly irrational move? Why is updating beliefs about the *opponent* at unreached nodes ruled out *by rationality*?"

  4.  **Depth-and-ε Convergence:** "Your approach replaces common knowledge with mutual belief of depth *k* plus a tolerance *ε*. You claim that for non-fragile games, the prediction at depth *k* converges to the common-knowledge prediction as *k*→∞ and *ε*→0. Precisely *what* converges? Is it the set of strategy profiles, the probability distribution over actions, expected payoffs, or something else? And in what specific mathematical sense (e.g., set inclusion, pointwise, uniformly)?" *(Follow-up anticipating "fragile" email game answer):* "You categorize the email game as 'fragile' to explain the discontinuity. *Before* analyzing any specific game, what is your general, operationalizable *criterion* for fragility? How can one look at a game structure *in advance* and determine if it's fragile, rather than labeling it fragile *because* it exhibits non-convergence?"

  5.  **Caution & Iterated Admissibility:** "You propose adding 'caution' (no player assigns prob. zero to any opponent strategy) to common belief in rationality to license iterated admissibility (IA). But eliminating *weakly* dominated strategies is order-sensitive. Does your 'caution + rationality' condition truly guarantee that the *process* of iterated elimination of weakly dominated strategies converges to the same set (the IA set) *regardless of the order of elimination*?" *(Follow-up anticipating process claim):* "If caution ensures the *final* IA set survives, but the *path* of elimination might still be order-sensitive, how does this address the standard critique that IA lacks a unique, well-defined epistemic foundation for the *process* players use to eliminate strategies?"

  6.  **Common Prior - Status:** "Is the common prior assumption (CPA) in your framework an explicit condition *within the agents' epistemic state* (something they commonly believe about the world), or is it fundamentally a constraint imposed by the *analyst* on the possible belief hierarchies used to model the situation?" *(Follow-up probing implications):* "If the CPA is an analyst's modeling choice, what does this imply for classic results derived from it, like 'no agreeing to disagree' or 'no common expectation of gain from a known voluntary trade'? Do these results then describe inherent features of rationality under a modeling assumption, or are they primarily consequences *of* that analyst-imposed assumption?"

  7.  **Common Prior - Rationality Link:** "Building on the CPA's status: How essential is the CPA *itself* to capturing rational play, as opposed to common belief in rationality? Could perfectly rational agents with different priors fail to coordinate or play Nash, even with common belief in rationality and the game structure?"

  8.  **"Model vs. Rationality" Sequence 1:** "Many solution concepts rely on specific assumptions about off-equilibrium beliefs (e.g., trembling hand, intuitive criterion). You'd likely say these are assumptions about the *model*, not rationality. But what *positive* account does your programme offer, solely from rationality and common belief, for how rational players *do* form beliefs after off-equilibrium events?"

  9.  **"Model vs. Rationality" Sequence 2 (Building on #3 & #8):** "If rationality, as you define it, mandates invariance of unreached conjectures and offers no determinate account of off-equilibrium belief from first principles, doesn't this severely restrict the scope of 'rational play' to only equilibrium paths? How can rationality alone guide belief when the unexpected *does* happen?"

  10. **"Model vs. Rationality" Sequence 3 (Final Push):** "When you consistently deflect to 'that's about the model, not rationality', it risks making 'rationality' a largely empty or purely consistency-based concept within your programme. Can you articulate a specific, substantive constraint that 'rationality' imposes *beyond* internal consistency of beliefs and actions, which actively shapes solution concepts *without* relying on auxiliary modeling assumptions?"

  11. **Fragility & Generality:** "Beyond the email game, what other types of games does your fragility criterion identify? Are these rare pathologies or common structures? Does fragility imply that common knowledge reasoning is fundamentally unreliable for those games, or just that the depth-and-ε approximation requires careful handling?"

  12. **Empirical Falsification:** "Your programme offers formal, epistemic foundations for solution concepts. What conceivable empirical finding about the behavior of real, intelligent players in well-understood games could you accept as evidence *against* the core tenets of your programme? Could evidence for robust forward induction effects, or systematic deviations from IA predictions despite understanding, ever challenge the claim that your derived concepts describe ideal rational play?"

  **Key Design Choices Explained:**

  *   **Self-Contained Clarity:** Each question avoids jargon not defined in the question itself and frames concepts in plain terms (e.g., "unreached information sets," "assigns probability zero," "agreement on priors," "off-equilibrium events").
  *   **Anticipating Deflections:** Follow-ups directly counter her predicted responses: pushing for definitions *before* examples (fragility), isolating the specific role of rationality (vs. model/invariance), demanding precision on convergence, and challenging the completeness of her account (IA order-sensitivity).
  *   **Pressing Convergence:** Question 4 explicitly forces specification of the *object* and *mode* of convergence.
  *   **Pressing Fragility:** Question 4's follow-up demands an *a priori* criterion, preventing *post-hoc* labeling.
  *   **Pressing IA:** Question 5 directly confronts the order-sensitivity problem inherent in weak dominance.
  *   **Common Prior Status:** Question 6 explicitly asks about the ontological status (agent vs. analyst) and Question 7 probes its necessity.
  *   **"Model vs. Rationality" Sequence:** Questions 8, 9, and 10 build logically: starting with the gap (off-equilibrium beliefs), linking to a core claim (invariance), and culminating in demanding substantive content for rationality itself.
  *   **Empirical Closer:** Question 12 directly addresses the core philosophy of the programme and what could falsify it, forcing engagement with real-world applicability beyond the model.
  *   **Avoiding Biography:** Focus is strictly on the conceptual claims and arguments.
