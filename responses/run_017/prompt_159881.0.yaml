  Okay, let me start by understanding what this PhD student needs. They're presenting a thesis on causation by omission, arguing that omissions are genuine causes without needing norms or duties. Their key ideas are the default-value in interventionist models and liveness to avoid profligacy. The audience includes specific personalities: a Lewisian, interventionists, a legal theorist, an experimentalist, and a philosopher of physics. They need a prep sheet for Q&A, focusing on likely objections, replies, and strategic concessions.

  First, I need to list out the objections each person might raise. The Lewisian would challenge the need to go beyond but-for analysis. The interventionists might question if "default value" adds anything new and if liveness is smuggled in. The legal theorist will argue that the law treats omissions differently due to duties, which their model doesn't account for. The experimentalist will say norm-sensitivity data shows norms are essential, and the model-construction story is unfalsifiable. The philosopher of physics will question the physical basis of "nothing" happening.

  Prioritizing these objections: The interventionists' questions about liveness and default value are core to the model's mechanics. If those aren't solid, the whole argument crumbles. The experimentalist's unfalsifiability charge is next because it attacks the empirical validity. The legal theorist's point is important for real-world application but maybe secondary in a metaphysics context. The Lewisian and physics objections are more foundational but perhaps less immediately damaging if the model holds internally.

  For the interventionists, the key reply is that default values are inherent in modeling practices, and liveness is an epistemic constraint, not an ontological add-on. But conceding that liveness might sometimes be ontological could be a soft spot. The experimentalist's objection requires showing how model-construction hypotheses can be tested through cognitive science methods, though it's a challenge to prove.

  The must-land reply is for the interventionists: if liveness is seen as smuggled, the model's parsimony fails. The hidden objection might be about liveness doing double duty in selecting variables and defining causation, which could be circular. The philosopher of physics' question about the physical basis of defaults and omissions is the one they hope isn't asked because it's hard to answer without invoking models, which might seem circular.

  Also, noting that in the talk, preemptively explaining that default values are pragmatic but liveness is objective could help. Conceding that the model doesn't capture legal distinctions might disarm the legal theorist. The bonus point: liveness might be conflating epistemic and ontological roles, which needs clarification to avoid weakening the argument.
answer: |-
  Here’s your Q&A prep sheet, triaged by damage/likelihood and tailored to your audience. I’ve distilled 7 core objections (plus your "hoped-not-asked" bonus), with replies and soft spots flagged. **The must-land reply is #2** — if interventionists reject liveness as unsupported, your model unravels.

  ---

  ### **Preemptive Concession in Your Talk**  
  Before Q&A, explicitly state:  
  *"Just to clarify: Default values are a pragmatic feature of causal modeling, not a metaphysically loaded primitive. But liveness — the actual coupling of mechanisms — is what makes omissions* objective *in this framework. If that coupling isn’t there, the omission isn’t in the model, period."*  
  *(This disarms the "smuggling" worry early and preempts the physics objection.)*

  ---

  ### **Ranked Objections & Replies**  
  **#1 [Interventionist 1]:**  
  *Objection:* "You say ‘default value’ isn’t just notation, but it *is* standard. We set ‘no water’ as 0 when modeling drought. How is your ‘distinguished default’ anything but relabeling?"  
  **Reply (2 min):** "Default values here *reflect physical dispositions*. When we say ‘default’, we mean the state the system *tends toward without intervention* (e.g., voltage drift to ground). It’s not arbitrary — it’s fixed by the mechanism’s dynamics. Your ‘0’ for drought assumes this, but often implicitly. I’m making that ontology explicit."  
  **Soft Spot:** If pressed, you concede defaults are *relative to system boundaries* (e.g., "ground" assumes a circuit). Not fatal, but needs care.  

  **#2 [Interventionist 2] (MUST-LAND REPLY):**  
  *Objection:* "Liveness sounds like you’re *adding* a condition to exclude the Queen — but isn’t that just restating that she’s causally irrelevant? What does ‘mechanism coupled’ add beyond standard d-separation or model selection?"  
  **Reply (2 min):** "D-separation excludes her *given the model*; liveness constrains *which variables get modeled*. It’s about real-world coupling: a mechanism must be *physically capable* of non-default intervention (e.g., pipes exist to deliver water; no ‘pipe’ to the Queen). This solves profligacy *without norms* by tying omissions to actual infrastructure."  
  **Why it must land:** If liveness is seen as circular or redundant, your account collapses into standard interventionism + handwaving.  

  **#3 [Experimentalist]:**  
  *Objection:* "Norms *systematically* shift causal judgments — e.g., people blame the guard for ‘not stopping the theft’ only if he’s paid to watch. If norms just help us ‘pick the model’, why can’t we find a norm-independent coupling? Your story seems unfalsifiable."  
  **Reply (2 min):** "Norms *cue us to represent* couplings we’d otherwise miss (e.g., the guard’s radio *is* coupled to the theft site). But we *can* test this: show subjects physical couplings *without* norms (e.g., a broken sensor that *could* have alerted the guard) — I predict causal attributions spike. Norms aren’t constitutive; they’re heuristic spotlights."  
  **Soft Spot:** If norm effects persist even when couplings are explained, you need cognitive science backup (e.g., "Spotlighting is resource-rational").  

  **#4 [Legal Theorist]:**  
  *Objection:* "Law treats omissions as causal *only* when there’s a duty (e.g., lifeguard vs. bystander ‘not saving’). Your coupling story can’t explain this: the bystander is ‘coupled’ — they *could* jump in! Why no liability?"  
  **Reply (2 min):** "The law isn’t tracking pure causation — it’s tracking *responsibility*. The lifeguard omission is causal *and* blameworthy; the bystander’s is causal *but not blameworthy*. My account explains why both are causal (both are live variables: legs work, pool is reachable); norms explain why only one is *actionable*."  
  **Soft Spot:** You concede law *filters* omissions via norms — but insist causation comes first. Legal theorists hate this.  

  **#5 [Lewisian]:**  
  *Objection:* "Why reframe but-for causation? If the plant dies, and it wouldn’t have if watered, that’s quasi-causation. Calling it ‘genuine’ just because you’ve labeled a default adds nothing."  
  **Reply (2 min):** "But-for tests are *model-relative*: ‘The gardener didn’t water’ is but-for *only if* watering is in the model. Liveness tells us *why it’s in the model* — not just notation. And absences *are* events: my watering variable taking value 0 *is* an event in the model’s state space."  
  **Soft Spot:** Lewisians won’t budge on "events as concrete particulars". Stick to "model events".  

  **#6 [Philosopher of Physics]:**  
  *Objection:* "‘Default state’ makes sense in a model, but what is it *physically*? If causation is about energy transfer/counterfactuals, how does ‘nothing’ transfer anything? Isn’t ‘the system did nothing’ just the absence of a process?"  
  **Reply (2 min):** "Agreed — omissions aren’t physical *processes*. But causation is about *dependencies*, and dependencies include absences (e.g., a valve’s *failure to open* can depend on rust). Defaults are the state *sustained by background conditions* (e.g., ambient pressure). No magic — just systems in equilibrium."  
  **Soft Spot:** If pressed on "equilibrium", you retreat to "it’s model-relative but objective *given* the system".  

  **#7 [Hybrid: Experimentalist + Legal]:**  
  *Objection:* "If liveness is objective, why do people *deny* causation when norms are violated (e.g., ‘the doctor didn’t prescribe’ causes harm only if it’s her job)? Your ‘model construction’ seems ad hoc to explain away norms."  
  **Reply (2 min):** "Norms focus attention: if the doctor *wasn’t on duty*, we might not represent her as coupled (e.g., no pager, no access to charts). But if she *was* in the loop, norms don’t change the coupling — they change whether we *bother* to include her. We can test this by fixing the model and varying norms."  
  **Soft Spot:** You need evidence that people *can* separate "could she?" from "should she?" (e.g., Knobe-style experiments).  

  ---

  ### **The Objection You Hope Nobody Asks**  
  *From the Philosopher of Physics:*  
  **"Your ‘liveness’ criterion excludes the Queen because she’s uncoupled, but isn’t *everything* coupled via gravity/quantum vacuum? If liveness requires ‘could in principle deliver non-default’, doesn’t modern physics say the Queen *could* have wobbled a molecule toward your plant? How is liveness not circularly defined by your model’s granularity?"**  

  **Why it’s lethal:** It forces you to either (a) accept universal coupling (profligacy returns), (b) admit liveness is *entirely* model-relative (undermining objectivity), or (c) appeal to pragmatics (which sounds like norms in disguise).  
  **Patchy Reply:** "Liveness requires a *scalable mechanism* — one where intervention is physically plausible *without cosmic rearrangement*. We model at scales where ‘gardener watering’ is a distinct process, not quantum fields. But yes, liveness is *scale-dependent* — which is why causation is too." (This concedes ground to pragmatism.)  

  ---

  ### **Bonus: Where Liveness is Overworked**  
  You’re using liveness to do **two jobs**:  
  1. *Exclude pseudo-omissions* (Queen) via absence of coupling.  
  2. *Define what counts as a variable* (only those with non-default potential).  
  But (2) risks circularity: if a variable exists *only if* it can take non-default values, then omissions (default values) are "pre-selected" as causal. This could make liveness a *trivial* filter. **Defend by stressing empiricism**: Liveness is grounded in *measurable dispositions* (e.g., a pipe’s capacity to carry water), not conceptual necessity.  

  ---

  ### **Triage Strategy**  
  - **Spend heavy time on #2 (interventionists)** — your core audience. If they nod, you survive.  
  - **Concede early to legal/experimentalists** that norms *matter*, just not for *causal structure*.  
  - **If physics objection arises**, admit scale-relativity and pivot to "but still objective *for the system*".  
  - **DON’T engage Lewisian metaphysics** beyond "this is a competing framework".  

  You’ve got this. Ten minutes is tight — drill replies to 20 seconds each. Remember: your goal isn’t to "win" but to show this is a live option.
