prompt: |-
  I'm a journalist who covers science and ideas, and I've been hanging around a philanthropic fund that allocates by expected value per dollar — the kind of place where someone will say, with a straight face, that a 1-in-10,000 shot at preventing a civilization-ending catastrophe beats a program that definately saves ten thousand lives next year, because the expected number of bodies is bigger. What I can't get anyone there to explain is where they stop. The same fund routes real money toward long-shot catastrophic-risk work, but it will not hand five dollars to a stranger who walks in claiming he'll save 10^30 lives with his mind if they just pay him; nobody even feels bad about that, and when I press them they mutter something about their probability estimates "not being real" down at that scale. So the practice isn't plain expected-value maximization, whatever their website says, and I want the implicit theory reconstructed: what rule are they actually following, and does it secretly presuppose fanaticism — that a tiny enough probability of a big enough payoff swamps every ordinary consideration — or has it quietly rejected fanaticism while keeping the vocabulary?

  I've been using a made-up distinction in my notes and I want you to test it rather than humor it. Call it the calibration floor: the smallest probability a funder is willing to act on, because below some threshold their own track record says their number is noise rather than evidence, so the mugger's one-in-10^30 isn't a very low probability but no probability at all, whereas the catastrophe estimate is a real one. Is that a principled line or just relabeling the discomfort? Relatedly, does any of this need the law of large numbers — the usual "in the long run EV wins" story — given that neither the catastrophe case nor the mugger case will ever be repeated enough times for that story to apply? And does the practice strictly presuppose that value aggregates across people, that saving 10^12 lives is 10^12 times as good as saving one, or would a view that refuses to aggregate license the same allocations for different reasons?

  Give me exactly five numbered items, each one or two sentences (three at the outside), no intro, no conclusion, no headings, in American English: (1) the decision rule the practice is really running on, stated so I could read it back to the fund's board; (2) the single commitment it cannot drop without becoming unintelligible, with the case that shows it; (3) one commitment everyone assumes the practice has that it strictly doesn't need — tell me which of the things people throw at expected-value reasoning is really just a prejudice of one camp; (4) whether my calibration floor separates the catastrophe case from the mugger case or collapses under pressure, and if it collapses, what actually does the work instead; (5) what would concretely change in their funding meetings if they swapped the implicit theory for a named rival — ambiguity aversion, bounded value, satisficing, whatever fits. Don't cite papers or name authors; I can't check them and my editor cuts them anyway. And please don't use item (1) to tell me that EV maximization implies fanaticism — I know that much, I want to know what this practice implies.
reasoning: |-
  Okay, the user is a journalist covering science and philanthropy, specifically a fund that uses expected value (EV) per dollar. They've noticed a contradiction: the fund accepts low-probability, high-impact interventions for existential risks but rejects absurd claims like a "mugger" promising astronomically large payoffs with no evidence. The user wants to uncover the implicit rules behind this practice, beyond what's stated on the fund's website.

  The user has proposed a "calibration floor" concept—where probabilities below a certain threshold are treated as noise rather than real estimates. They want to test this idea and understand several key points: the actual decision rule in use, the core commitment that makes the practice intelligible, unnecessary assumptions, whether the calibration floor holds up, and how changing the implicit theory would affect funding decisions.

  I need to provide exactly five numbered items in American English, each concise (1-3 sentences max), with no intros, conclusions, or citations. The response must directly address all five points while avoiding jargon or named theories. 

  For item 1, I'll reconstruct the real decision rule: it's not pure EV maximization but EV applied only to probabilities above a credibility threshold. This explains why they fund credible catastrophic risks but ignore muggers. 

  Item 2 should identify the indispensable commitment: the fund must treat value as linear and aggregative across individuals. If they didn't, cases like preventing extinction wouldn't justify massive EV premiums over smaller, certain interventions. 

  For item 3, I'll note that the practice doesn't actually require the law of large numbers justification, even though staff might invoke it. The real work is done by credibility-weighting, not long-run frequency arguments. 

  Item 4 evaluates the calibration floor: it's a useful metaphor but collapses under scrutiny because the mugger case fails at the credibility step before probability even gets assessed. The real separator is whether the probability estimate is evidence-based. 

  Finally, item 5 should contrast with a rival theory. If they switched to ambiguity aversion, they'd fund fewer speculative projects and demand more certainty, altering their risk tolerance. 

  Throughout, I'll keep language tight and avoid hedging—this journalist wants crisp, actionable insights they can test with the fund's board. The tone should match their no-nonsense style ("don't humor me, test it").
answer: |-
  1.  The fund acts on expected value estimates *only* when the probability assessment is derived from a credible, evidence-based model or process; below a certain credibility threshold, estimated probabilities are treated as effectively zero, regardless of the claimed stakes.
  2.  The indispensable commitment is that value aggregates linearly across people (saving N lives is N times better than saving one); without this, the astronomical value in preventing human extinction could not dominate smaller, certain interventions like saving known lives today.
  3.  The practice does not strictly require justification via the law of large numbers (long-run frequency guarantees); staff might cite it, but the core decision rule relies solely on credible single-case EV comparisons, making the long-run argument superfluous.
  4.  The "calibration floor" metaphor collapses: the fund rejects the mugger not because 1/10^30 is too small *numerically*, but because the claim lacks *any credible process* generating that probability estimate; the catastrophe case uses structured models, however uncertain.
  5.  If they adopted ambiguity aversion (rejecting deep uncertainty), funding meetings would shift away from highly speculative catastrophic risks towards interventions with more quantifiable, near-term impacts and robust evidence, even at lower expected value.
