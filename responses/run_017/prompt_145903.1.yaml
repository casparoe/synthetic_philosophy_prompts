prompt: |-
  Hi — I'm a science-and-ideas journalist and I'm trying to finish a piece about how computer scientists actually decide that a problem is hopeless, and I keep hitting a weird double practice that I'd like a philosopher to unpack. On the one hand, the field runs on something like the Cobham–Edmonds move: a problem is "efficiently solvable" only if there's a polynomial-time algorithm for it, and once somebody proves a problem NP-hard, that's treated as a license to stop looking for exact methods and go do approximations, heuristics, or a hardness-of-approximation paper instead — referees accept this move without asking anything further. On the other hand, the very same community's engineers solve "intractable" problems to proven optimality every day: verification and scheduling and routing instances with six-figure variable counts fall to branch-and-bound plus clever preprocessing in seconds, and the papers that report this are full of benchmark tables rather than asymptotics. There's even a standing joke about "galactic algorithms," the ones that are polynomial but with constants and exponents nobody will ever run. So the practice seems to contain two opposite attitudes toward the same formal notion at once.

  The bit that really puzzles me is an inconsistency across neighboring fields. Cryptographers designing a key-generation routine go out of their way to randomize, to avoid landing on structured or special instances that factoring or discrete-log attacks handle easily — they behave as though the hard instances are special and have to be aimed at deliberately. But the asymptotic worst-case framing that licenses the "give up, it's NP-hard" move behaves as though hard instances are what you'd be likely to meet anyway, and worst case is the honest accounting. It can't be that both are right in the same sense, or maybe it can and I'm missing something.

  Here's the thing I want to inject into the discussion, because nobody I interviewed would engage with it: almost no real workload is a single instance. It's a family of instances shat out by the same compiler, the same chip design flow, the same logistics pipeline, over and over, so you can preprocess once, cache, tune or learn a heuristic on the family's distribution, and the marginal cost per instance collapses even though any one fresh instance from scratch is NP-hard. I've been calling this the amortization escape hatch and the corresponding notion family-tractability: tractable per instance within a recurring family, intractable in the textbook per-instance-from-scratch sense. So: what philosophical commitments about tractability, feasibility, or the nature of computational difficulty does the existing practice (polynomial = feasible, NP-hardness = stop, asymptotics = the real object, constants = mere engineering) presuppose? Is it a thesis about problems, or about instances, or about distributions, or about what a community can know? Which parts does the practice strictly need and which does it merely sit well with, and where is it underdetermined enough that several rival accounts — worst-case, average-case, smoothed, parameterized, fixed-constant resource bounds, my family-level one — would license exactly the same behavior? And if you swapped in a family-level notion of tractability as the official one, what would actually have to change in how the field allocates its effort and what counts as a result? Give me exactly five numbered points, one or two sentences each, no intro, no sign-off.
reasoning: |-
  Hmm, the user is a science journalist writing about how computer scientists decide problems are hopeless. They're observing a contradiction in the field: on one hand, NP-hardness is treated as a signal to stop looking for exact solutions, yet engineers solve massive NP-hard problems daily using practical methods. They're also noticing cryptographers deliberately create hard instances while the worst-case perspective treats hard instances as typical.

  They've identified what they call the "amortization escape hatch" - that real-world problems come in recurring families where you can preprocess and optimize solutions over time. They want me to unpack five philosophical commitments behind the current practice and explore what would change if we adopted their "family-tractability" concept.

  I need to analyze the underlying assumptions in computational complexity theory. The current practice treats polynomial time as feasible and NP-hardness as a reason to give up on exact solutions, focusing on worst-case asymptotics while dismissing constants. But this clashes with practical successes where problems are solved through preprocessing and heuristics on recurring instance families.

  The key conflict is between worst-case theory (where hard instances dominate) and practical/cryptographic perspectives (where hard instances are rare or engineered). The user's "family-tractability" idea suggests that for recurring problem families, marginal cost per instance drops dramatically through caching and learning.

  For my five points: First, I'll address how the field conflates worst-case with typical-case difficulty. Second, I'll note how it treats problems as monolithic rather than distribution-dependent. Third, I'll point out the assumption that feasibility must be instance-independent. Fourth, I'll highlight how constants are dismissed as implementation details. Fifth, I'll discuss how the field prioritizes general knowledge over specialized solutions.

  If we switched to family-tractability, we'd see more focus on preprocessing, domain-specific heuristics, and distribution-aware algorithms. Benchmarking would shift from worst-case to family-specific performance, and the "NP-hard = stop" mentality would soften for recurring problems. This would better align theory with what engineers actually do.
answer: |-
  1.  **Worst-case as epistemic proxy:** The practice presupposes that worst-case complexity is the only robust, *knowable* property for arbitrary problems *in the abstract*, acting as a necessary (though insufficient) feasibility criterion when distributions are unknown or adversarial.
  2.  **Instance-independence commitment:** It treats computational difficulty as an inherent property of the *problem class itself* (e.g., SAT), independent of specific instance distributions or real-world generative processes, prioritizing universal claims over contextual ones.
  3.  **Feasibility monolithicism:** It assumes feasibility (polynomial-time) must hold uniformly for *all* instances of a problem to "count," explicitly rejecting the validity of distribution-dependent or amortized feasibility (like your family-tractability) as a theoretical category.
  4.  **Constants as implementation:** It strictly separates "theory" (asymptotic class) from "engineering" (constants, heuristics), treating the latter as contingent optimizations irrelevant to the fundamental complexity *classification* of the problem.
  5.  **Community knowledge focus:** The "NP-hard = stop" norm prioritizes guiding *community-wide* research allocation (avoiding likely dead ends) over the *possibility* of solving specific instance families, accepting that this heuristic overlooks exploitable structure in practice.
