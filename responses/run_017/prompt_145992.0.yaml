prompt: |-
  I write a weekly column on science and ideas, and maybe twice a week I also get handed someone else's piece for the fact-check pass before it goes up — twenty minutes, no paywall access, and whatever I write has to survive a read by our lawyer. The thing I keep running into, and keep bodging, is claims that are neither true nor false. I want a procedure, not a theory essay.

  Some of what I'm dealing with. A source says, in the same breath as his denial: "what I am telling you right now is not true." A press office sends over a line to run as a pull quote: "no major outlet has ever accurately reported this meeting" — in a piece that would itself be a major outlet reporting the meeting. A sympathetic researcher, whose data I've seen and believe, ends her statement with "my account of the incident is accurate," and I want to be able to write "she's telling the truth" and I suspect I can't. Plus the ordinary mush: "hundreds of scientists," "the treatment works," "experts say," and the self-exempting kind — "any attempt to check this claim is itself part of the disinformation" — which I've started calling shields in my notes. My desk slang: loopers for claims whose truth depends on themselves, shields for claims that try to disqualify their own evaluation, fuzzies for the vague ones.

  What I half remember from one philosophy elective: something like Tarski on not being able to call sentences in your own language true, and the idea that some sentences just sit in a gap, and that "not true" is not the same as "false," and that if you patch that by saying "not true" you get a new version of the same problem back. If any of that is wrong, correct it, but only as much as the procedure needs.

  What I want is something my desk can actually run in twenty minutes on a claim, in this order: what to ask first, what counts as a good enough answer at each step, and which verdict to print. Specifically: when the verdict is a plain true or false; when it's "no truth value, and here's the one-sentence way to say that to readers without sounding like a philosophy major"; when the only honest move is to quote the sentence and describe its shape instead of grading it; and when the procedure has to stop and hand the thing to an editor because it's a values call, not a factual one — I think the false-versus-misleading choice is one of those, tell me if it is. Say explicitly where judgement can't be removed, and what the checklist refuses to rule on (I don't need it to adjudicate claims about the future, and it shouldn't try).

  Then run it on the three above, and add one case where the answer you get is one I won't like — I have a feeling it's the researcher one, where I want to defend her and the procedure won't let me print that she's telling the truth. And at the end, the two or three sentences I should put in the style guide so this is consistent across writers who've never thought about any of this. No bibliography, I don't need citations, just the procedure.
reasoning: |-
  Okay, let me approach this systematically. The science columnist needs a practical fact-checking procedure for linguistically problematic claims - those that aren't clearly true or false. They've described specific examples: paradoxical statements, self-referential quotes, vague assertions, and truth-value shields. 

  First, I recall their three main categories: loopers (self-dependent truth), shields (anti-verification claims), and fuzzies (vague language). The philosophical concepts they mentioned seem to reference Tarski's undefinability theorem and truth-value gaps - but they explicitly want procedure over theory.

  The core challenge is designing a workflow that fits their 20-minute constraint while handling semantic complexities. The procedure must output one of four verdicts: true/false, no-truth-value explanation, structural description, or escalation to editors. Crucially, it must flag where human judgment is unavoidable.

  For the step-by-step process, I consider starting with the most objective filters first: 
  1) Is this even a factual claim? (vs opinion/rhetoric) 
  2) Is it verifiable within timeframe? 
  3) Does it contain self-reference or anti-verification language? 

  The judgment calls will arise at multiple points: determining what counts as "major outlet" for verification, whether vagueness crosses into meaninglessness, and when false becomes misleading. These must be explicitly marked as editorial decisions.

  Testing the procedure on their examples: 
  - The paradoxical denial ("what I'm telling you isn't true") should trigger the "structural description" path 
  - The press office quote about "no major outlet" gets the no-truth-value verdict due to self-reference 
  - The researcher's accuracy claim requires escalation - it's technically true but potentially misleading 

  The researcher case is particularly interesting. Even with verified data, the self-referential claim "my account is accurate" can't be directly endorsed as "true" without philosophical complications. The procedure would block their desired wording, suggesting alternatives that avoid truth-value assertions.

  For the style guide, I focus on two principles: 
  1) Never replicate problematic claim structures 
  2) Use "describes accurately" instead of "tells truth" for accounts 
  Plus a red flag list for terms like "all experts agree" that automatically trigger scrutiny.

  The key is balancing philosophical rigor with newsroom practicality - no metalanguage solutions, just clear decision branches. Every step should either resolve the claim or cleanly pass it to the next appropriate party within the time limit.
answer: |-
  Here's a field procedure for your 20-minute fact-check pass. It prioritizes actionable outcomes over philosophy, with clear off-ramps for unverifiable or problematic claims. **Judgement is required at starred (*) steps** – there's no algorithm for language.

  ---

  ### **The 20-Minute Truth-Value Triage Procedure**

  **GOAL:** Assign one verdict: `TRUE` / `FALSE` / `NO TRUTH VALUE (NTV)` / `DESCRIBE STRUCTURE` / `ESCALATE TO EDITOR`.

  1.  **IS IT A FACTUAL CLAIM?**
      *   **Ask:** Does this assert something concrete about the world? (e.g., "Water boils at 100°C" = factual; "This policy is unjust" = not purely factual).
      *   **Good Enough Answer:** Yes = Proceed. **\*No\*** = `ESCALATE TO EDITOR` (It's likely opinion/rhetoric/value judgement).
      *   **Verdict:** Stops here if "No". Proceeds if "Yes".

  2.  **IS IT VERIFIABLE WITH AVAILABLE TOOLS (20 min)?**
      *   **Ask:** Can I check this against authoritative sources (data, peer-reviewed papers, official records, credible databases, direct confirmation) *right now*? Is the key term defined or definable? (e.g., "major outlet", "expert", "works").
      *   **Good Enough Answer:** Yes, and source is accessible = Proceed. **\*No\*** (Vague terms, inaccessible data, insufficient time) = `ESCALATE TO EDITOR` (Flag as "Unverifiable within timeframe/scope").
      *   **Verdict:** Stops here if "No". Proceeds if "Yes".

  3.  **DOES IT CONTAIN SELF-REFERENCE, SELF-EXEMPTION, OR PARADOX?**
      *   **Ask:** Look for your "loopers" & "shields":
          *   *Loopers:* Does the claim's truth *depend* on itself? (e.g., "This sentence is true", "My account is accurate").
          *   *Shields:* Does it try to block verification? (e.g., "Checking this is disinformation", "No report can be accurate").
          *   *Explicit Paradox:* Does it directly contradict itself? (e.g., "What I am telling you right now is not true").
      *   **Good Enough Answer:** **\*Yes\*** to any = `NO TRUTH VALUE (NTV)` OR `DESCRIBE STRUCTURE`. (See Step 4 for choice). **No** = Proceed to Step 5.

  4.  **HANDLE LOOPERS/SHIELDS/PARADOXES (From Step 3):**
      *   **Ask:** Is the *intent* clearly deceptive/manipulative, or just awkward/self-referential?
      *   **Good Enough Answer:**
          *   **\*Clearly manipulative/shield\*** (e.g., "Any attempt to check is disinformation") = `DESCRIBE STRUCTURE` (Explain *how* it blocks verification).
          *   **\*Awkward/Paradoxical/Looper\*** (e.g., "My account is accurate", "This is not true") = `NO TRUTH VALUE (NTV)`. Avoid wading into the paradox.
      *   **Verdict:** `NTV` or `DESCRIBE STRUCTURE`. **STOP HERE.** Do *not* proceed to True/False check.

  5.  **CHECK AGAINST SOURCES:**
      *   **Ask:** Using sources from Step 2, does the evidence directly support or contradict the *specific factual claim*? Pay attention to qualifiers ("hundreds", "major", "works").
      *   **Good Enough Answer:**
          *   **Supported** = `TRUE`.
          *   **Contradicted** = `FALSE`.
          *   **Ambiguous/Unclear/Qualifier Issues** = `ESCALATE TO EDITOR` (Flag specific ambiguity, e.g., "Define 'major outlet' or 'works'?").
      *   **Verdict:** `TRUE`, `FALSE`, or `ESCALATE TO EDITOR`.

  ---

  **Key Verdicts Explained:**

  *   `TRUE/FALSE`: Use only for claims passing Steps 1, 2, 3 (No), and 5 with clear verification. **Print plainly.**
  *   `NO TRUTH VALUE (NTV)`: For loopers, paradoxes, or statements structurally incapable of being true/false (Step 4). **Print as:** "This statement cannot be evaluated as true or false." OR "This claim is self-referential and unverifiable." (Choose clearest for context).
  *   `DESCRIBE STRUCTURE`: For shields or claims where *how* it's said is the issue (Step 4). **Print by:** Quoting it + explaining its function neutrally (e.g., "The statement asserts that verifying it is impossible." OR "This claim preemptively dismisses any potential fact-check.").
  *   `ESCALATE TO EDITOR`: For non-factual claims (Step 1), unverifiable claims (Step 2), or ambiguous verification (Step 5). **Includes:** Values calls ("false vs misleading"), defining vague terms ("major outlet"), future claims, pure opinion. **Your job:** Flag *why* it needs editorial judgement (e.g., "Claim is unverifiable - requires defining 'experts'", "False vs misleading: needs policy call", "Value judgement disguised as fact").

  **\*Where Judgement is Unavoidable\*:**
  *   Step 1: Is it *really* a factual claim?
  *   Step 2: Is verification *reasonably* possible in 20 mins? Is the term definable *enough*?
  *   Step 3: Is this a looper/shield? How severe?
  *   Step 4: Intent (manipulative vs. awkward)?
  *   Step 5: Is the evidence truly conclusive? Does it match the claim's specificity?

  **What the Checklist Refuses:**
  *   Claims about the future.
  *   Pure opinions or value judgements (Step 1 off-ramp).
  *   Defining inherently vague terms without editorial guidance (Step 2/5 off-ramp).
  *   Resolving "false" vs. "misleading" - that's editorial (Step 5 off-ramp).
  *   Adjudicating the *intent* behind a looper/shield beyond its structure (Describe the structure, not the mind).

  ---

  **Running Your Examples:**

  1.  **Source: "What I am telling you right now is not true."**
      *   Step 1: Factual? (Weirdly, tries to be). Proceed.
      *   Step 2: Verifiable? N/A - structure blocks it. Proceed (but flag).
      *   Step 3: **YES (Explicit Paradox)** -> Step 4.
      *   Step 4: **Awkward/Paradoxical.** Verdict: `NTV`. **Print:** "This statement cannot be evaluated as true or false due to self-contradiction."

  2.  **Press Office: "No major outlet has ever accurately reported this meeting." (In your piece reporting it)**
      *   Step 1: Factual? Yes (asserts state of reporting). Proceed.
      *   Step 2: Verifiable? Needs definition of "major outlet" and "accurately". **\*Ambiguous\***. Verdict: `ESCALATE TO EDITOR`. **Flag:** "Requires defining 'major outlet' and 'accurately'; claim self-invalidates if we are considered major."

  3.  **Researcher: "My account of the incident is accurate." (You believe her data)**
      *   Step 1: Factual? Yes (asserts accuracy of account). Proceed.
      *   Step 2: Verifiable? You have data supporting the *incident*, but *this claim* is about *her account*. Proceed cautiously.
      *   Step 3: **YES (Looper - Truth depends on itself)** -> Step 4.
      *   Step 4: **Awkward/Looper.** Verdict: `NTV`. **Print:** "This statement about its own accuracy cannot be independently verified." OR `DESCRIBE STRUCTURE`: "The researcher asserts the accuracy of her own account." *(You **cannot** print "she's telling the truth" based on this claim alone. You can say "Data reviewed by [Publication] supports the researcher's description of the incident" - that's verifying the incident, not her self-reference.)*

  4.  **"Any attempt to check this claim is itself part of the disinformation." (Your "Shield")**
      *   Step 1: Factual? (Asserts a fact about verification attempts). Proceed.
      *   Step 2: Verifiable? N/A - structure blocks it. Proceed (flag).
      *   Step 3: **YES (Shield)** -> Step 4.
      *   Step 4: **Clearly manipulative/shield.** Verdict: `DESCRIBE STRUCTURE`. **Print:** Quote + "This claim attempts to disqualify any effort to verify it."

  ---

  **Style Guide Additions (2-3 Sentences):**

  > **Truth-Value Triage:** When fact-checking, first determine if a claim is factual and verifiable. If a claim references itself ("My account is true"), blocks verification ("Checking this is disinformation"), or is paradoxical, label it **"cannot be verified true or false"** or neutrally describe *how* it functions. Never simply label such claims "true" or "false." Escalate claims involving significant ambiguity, value judgements, or defining key vague terms ("experts," "works," "major") to editors with a clear reason. Verify the *event*, not the *self-declaration* of truth.
