  ### Triage Decision Tree for Contradictory KB Entries  
  **Root:** Two entries assert P and not-P, provenance roughly equal.  

  1. **Can the conflict be resolved by disambiguating context?**  
     - *Yes (e.g., deadlines in different time zones, policies for different stages)* → **Leaf: Contextualism**  
       - Awkward: Requires modeling context (e.g., "submission_deadline" vs. "notification_deadline").  
       - Cost: Store both with context tags; rewrite queries to disambiguate.  
     - *No* → Go to 2.  

  2. **Is the conflict due to a vague predicate?**  
     - *Yes (e.g., "small room" with borderline cases)* → **Leaf: Supervaluationism**  
       - Awkward: Borderline cases yield truth-value gaps (neither true nor false).  
       - Cost: Implement multi-precisification logic; block bivalent inference for vague predicates.  
     - *No* → Go to 3.  

  3. **Is the conflict due to self-reference?**  
     - *Yes (e.g., "this entry is unreliable")* → Go to 4.  
     - *No* → Go to 5.  

  4. **Can the self-referential entry be dismissed as non-propositional?**  
     - *Yes (e.g., paradoxical statements are meaningless)* → **Leaf: No-Proposition-Expressed**  
       - Awkward: Entries may be arbitrarily deemed defective.  
       - Cost: Delete or flag the entry; risk losing valid data.  
     - *No* → **Leaf: Glut or Gap (indistinguishable here—choose pragmatically)**  
       - *Option: Glut*: Both true (dialetheism). Awkward: Accepts contradictions. Cost: Paraconsistent inference engine.  
       - *Option: Gap*: Neither true. Awkward: Truth-value gaps. Cost: Three-valued logic.  
       - *Flag: Branch 4 → Glut/Gap not separable by questions; depends on tolerance for contradictions.*  

  5. **Is practical data repair feasible without external input?**  
     - *Yes, reject one entry arbitrarily* → **Leaf: Reject One**  
       - Awkward: May discard correct information.  
       - Cost: Delete one entry; simple but lossy.  
     - *Yes, reweight provenance* → **Leaf: Reweight Provenance**  
       - Awkward: Arbitrary authority adjustments.  
       - Cost: Modify provenance weights; requires weight-tracking infrastructure.  
     - *Yes, quarantine* → **Leaf: Quarantine**  
       - Awkward: Contradiction persists but is isolated.  
       - Cost: Block inference on the pair; store both but mark as unresolved.  
     - *No* → Go to 6.  

  6. **Should classical logic be preserved for non-conflicting data?**  
     - *Yes* → **Leaf: Paraconsistent Fragment**  
       - Awkward: Multiple logics coexist; fragments must be managed.  
       - Cost: Isolate contradictions in a subsystem with paraconsistent reasoning (e.g., LP/FDE).  
     - *No* → Go to 7.  

  7. **How should truth values be assigned?**  
     - *Assign "both" (glut)* → **Leaf: Glut**  
       - Awkward: Violates non-contradiction.  
       - Cost: Full paraconsistent KB (e.g., LP).  
     - *Assign "neither" (gap)* → **Leaf: Gap**  
       - Awkward: Some queries return undefined.  
       - Cost: Three-valued KB (e.g., K3).  
     - *Track information states, not truth values* → **Leaf: Four-Valued Information State**  
       - Awkward: Values (T, F, Both, Neither) complicate queries.  
       - Cost: FDE-based engine; lattice-valued semantics.  

  ---  
  ### Unoccupied Combinations & Notes  
  - **Branch 4 → Glut/Gap**: Not separable by questions; both address self-reference similarly. Choose via philosophical bias.  
  - **All "No" to repair (5) → Fragment (6)**: Unattractive but coherent; fragment isolation avoids global logic change.  
  - **Vagueness (2) → Gap/Supervaluation**: Supervaluationism is a gap-implementing strategy; not a distinct leaf.  
  - **Contextualism (1) → Repair (5)**: Incoherent—contextualism resolves the conflict; no repair needed.  

  ---  
  ### Case Analysis  
  **Case 1: Deadline conflict**  
  - Path A: *Contextualism* (if deadlines are for different events) → **Leaf 1**.  
  - Path B: *No context* → Repair via quarantine → **Leaf: Quarantine**.  
  - Path C: *No repair* → Preserve classical logic → **Leaf: Paraconsistent Fragment**.  

  **Case 2: Self-referential ("no entry with this ID is reliable")**  
  - Path A: *Dismiss as meaningless* → **Leaf: No-Proposition-Expressed**.  
  - Path B: *Not dismissible* → **Leaf: Glut or Gap** (e.g., Glut for dialetheism; Gap for truth-value failure).  

  **Case 3: Vagueness (room size guidelines)**  
  - Path A: *Contextualism* (if guidelines for room types) → **Leaf 1**.  
  - Path B: *Inherent vagueness* → **Leaf: Supervaluationism** (gap for borderline cases).  

  **Case 4: Policy conflict (anonymization rules)**  
  - Path A: *Contextualism* (if committees govern different phases) → **Leaf 1**.  
  - Path B: *No context* → Repair via reweighting → **Leaf: Reweight Provenance**.  
  - Path C: *No repair* → Assign truth values → **Leaf: Four-Valued Information State** (tracks both policies).  

  ---  
  ### Implementation Notes  
  - **Glut/Gap/Four-Valued**: Require non-classical inference engines (e.g., FDE).  
  - **Quarantine/Fragment**: Minimize engine changes but add metadata layers.  
  - **Contextualism/Supervaluation**: Demand contextual/precisification annotations.  
  - **Repair Options**: Low cost but risk arbitrariness; provenance tracking eases rewighting.
