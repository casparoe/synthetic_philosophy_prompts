prompt: |-
  hey — i've got one 50-minute section next week with about twenty first-year PPE students and the topic i've been handed is the backward induction paradox and the centipede game. they've done normal-form games (PD, one coordination thing) and exactly one tree, an entry-deterrence one, and that's the lot. don't explain the paradox to me, i've read the basics — what i need is a plan for building it in the room, and specifically i want the dependency structure: what has to be on the board before what, because every time i try to sketch this i find myself using something i haven't actually put in place yet.

  so, the order the pieces have to go in and why. what has to be established before the folding-back step even looks like an argument rather than a trick — i'm guessing the load-bearing thing is that a strategy is a complete plan for every node, not a choice at the node you happen to be at, since otherwise they'll read backward induction as a prediction about which node gets reached. tell me if that's right and what else is load-bearing in the same way, and in what sequence it has to arrive.

  then the example. i want one concrete six-move centipede with real numbers, and i want to know what the numbers have to be like for the paradox to bite: pot growing as you pass, grabbing now beating waiting one more move, both players much richer if they get anywhere near the end, whatever else is essential. and what the example must *not* contain — anything that lets them explain the intuition away instead of feeling it: no uncertainty about when the game ends, no other-regarding payoffs, no way to promise or commit to anything, no repetition or shadow of the future. also why this example and not the finitely repeated prisoner's dilemma, which they've already met and at which they will immediately start shouting tit-for-tat and reputation, and not the ultimatum game, where the prediction is equally stark but the interesting part seems to be somewhere else entirely.

  two things i'm genuinely torn about and want you to either place or throw out:

  first, my own wrinkle. i've been messing with a version that has no fixed last node — instead, after every pass a fuse burns with probability about a third, and if it burns the game just stops and the pot is split evenly, and that's the end. as far as i can see there's then no known final node for the induction to start from, so the argument has literally nowhere to begin, and the conclusion flips to something like "keep passing". is that right? does it actually isolate the premise doing the work — that what matters is a *known* end, not merely that the game isn't infinite — or does it just look like a different game with different payoffs, in which case the students will shrug and learn nothing? and if it belongs in the session at all, does it go before the standard version or after? i can see a case for both and i can't decide.

  second, a colleague says i should open with the surprise exam, on the grounds that it's the same shape of argument and they'll find it more fun. i worry that's two puzzles in fifty minutes and neither lands. where would it have to sit, if anywhere, and what would it have to be *doing* there rather than just being a warm-up.

  misconceptions. here's what i'm braced for — tell me what i've missed, and for each one tell me the exact point in the sequence where it has to be headed off rather than just listed at the end: that the whole thing shows rationality is self-defeating (i think this is the wrong lesson and i want it dead early, but i don't want to kill it by flatly asserting that the theory is fine); that the fix is to make a promise or pre-commit, which i think smuggles in prisoner's-dilemma machinery; that you'd never actually reach the last node, so the reasoning is about a counterfactual you know to be false and can be ignored; that it's just the prisoner's dilemma again; that it's an empirical claim about how people behave in labs and the experiments refute it; and the one i'm least sure how to handle — a sharp student saying that if she finds herself at node five then plainly the other player isn't the sort who grabs, so of course she should pass. that last one feels half right and half a category mistake, and i don't know how to honour it without letting it eat the entire session.

  then: what do i openly refuse to explain at this level, and say out loud that i'm refusing it. i'm assuming the whole epistemic programme is out — common belief in rationality, whatever the actual results are about what backward induction requires, refinements, trembles — plus the experimental literature and whatever you'd say about altruism parameters. but tell me where exactly the line goes and whether anything i've just listed is actually cheap enough to keep.

  and one question for the last five minutes that tells me whether they've got the paradox rather than just the folding-back ritual — something they can't answer by restating the procedure. i was going to ask what would have to be false for the first mover to be right to pass, but i'm not sure that's the sharpest version of it, and it might just invite a wierd list of things people find psychologically plausible.

  keep it seperate from the readings, i'm not asking for anything to assign — just the shape of the session.
