prompt: |-
  I'm writing a paper on hedonism as a theory of welfare, and I keep getting stuck one step before where the standard accounts seem to begin: everyone argues about what pleasure *is*, and nobody says what an account of pleasure would have to be able to *do* before we'd be entitled to use it for the work hedonism wants done. So I want the specification first. Please write the desiderata for a theory of pleasure: what any adequate account must deliver, with the case or consideration behind each requirement, and with each marked as either non-negotiable or as a preference of one camp. Fix the purpose as follows, since adequacy is relative to it: the theory is to be good enough (i) to say what, if anything, makes a stretch of a life go better for the person living it; (ii) to be usable by people who actually measure well-being in practice — experience-sampling and day-reconstruction studies where subjects report a handful of labelled feelings, and welfare assessments of animals and pre-linguistic infants who report nothing at all; and (iii) to stay distinguishable from a desire-satisfaction view and from a mood- or happiness-based view, rather than collapsing into either. It is not required to be a metaphysically reductionist analysis of a natural kind, and it is not required to make hedonism true by definition.

  Here is my own draft list, which I suspect is part genuine and part prejudice, so please also tell me which of these are real desiderata and which are just preferences dressed up as requirements. Extensional coverage at both ends: the theory must handle, or explain away, scratching a poison-ivy itch; the click when a proof you've been stuck on finally comes together; the relief of learning a scary diagnosis was a false alarm; an hour spent rereading letters from someone who died, which you'd call good on the whole but which feels mostly like ache; a horror film you pay to see and describe as fun while covering your eyes; the grim satisfaction of being proved right about someone's downfall; a runner's high in the middle of exhaustion; total absorption in a task with no noticeable feeling at all; and the mild, entirely unnoticed comfort of a well-fitted shoe. On the other side, it must refuse to count the mere burn of food too hot to enjoy, the mere sensory intensity of a loud surprise, the mere fact that everything you wanted to be happening is happening (the experience-machine case), a good day's background mood, and the addicted gambler's compulsion. It must keep apart (a) a pleasure's occurring, (b) its being noticed, and (c) its being endorsed or valued by the agent; and it must keep apart how pleasant an experience is from how much it contributes to the person's welfare, so that a degrading pleasure or a pleasure you'd rightly feel guilty about is not thereby a small one. It must allow pleasures to differ in kind and not only in intensity and duration — the old complaint about reducing everything to quantity — while still supplying some exchange rate that makes pleasures comparable within a life, comparable across persons, and aggregable enough to sum; it must fit with the fact that wanting and liking can come apart and that no single neural signature for pleasantness has turned up; and it must let one experience be mixed rather than carrying a single scalar valence.

  The part I most want is the structure of the list rather than the list itself. Flag any pair or subset of requirements you think cannot be jointly satisfied — in particular whether the demand that pleasures differ in kind can coexist with the demand for a scale you can aggregate and compare across people, given how coarse self-report is — and say which single requirement excludes the most candidates. Then, briefly, how the four standard families do against the list you ended up with: the view that pleasure is a distinctive felt quality; the view that it is a matter of enjoying or taking pleasure in something, in the attitudinal sense; the adverbial or representational view on which pleasure is a way of experiencing an object; and the desire-fulfillment view. Consider also, if you think the honest answer goes this way, a fifth option: that pleasure is not one thing at all but a family resemblance across states, and then say what we would have to give up — measurability, the exchange rate, perhaps the use of 'pleasure' in a theory of welfare altogether. A table is fine for the list.
reasoning: |-
  Okay, the user is writing a paper on hedonism as a theory of welfare and is stuck on defining what pleasure actually is. They need a clear set of criteria that any theory of pleasure must meet to be useful for their purposes. The key here is that they want desiderata—what the theory must deliver—rather than jumping straight into existing debates about the nature of pleasure.

  The user has provided a detailed draft list of requirements, but they're unsure which are genuine desiderata and which might be biased preferences. Their main goals are: (i) defining what makes life better for a person, (ii) ensuring practical usability in studies like experience-sampling and animal welfare assessments, and (iii) distinguishing pleasure from desire-satisfaction or mood-based views. They don't need a metaphysical reduction or for hedonism to be true by definition.

  Looking at their draft list, they've included several categories: extensional coverage (specific examples pleasure must include or exclude), necessary distinctions (like separating pleasure occurrence from endorsement), structural requirements (kind vs. intensity, comparability), and empirical fit (wanting vs. liking dissociation, neural signatures). They're particularly concerned about potential conflicts, like whether allowing different kinds of pleasure is compatible with having a scalable metric for comparison across people.

  The user also wants an analysis of how major theories of pleasure stack up against these desiderata. The main theories are: felt-quality (pleasure as a distinct sensation), attitudinal (pleasure as an attitude toward something), adverbial/representational (pleasure as a way of experiencing), and desire-fulfillment. They're open to a fifth option—family resemblance—if it's more honest, but want to know the trade-offs.

  I should start by organizing the desiderata into a structured table, clearly marking each as non-negotiable or preference-based. Then, I'll identify conflicts, especially between qualitative diversity and quantitative comparability. The strongest constraint seems to be the need for objective measurability in non-verbal subjects, which challenges theories relying on subjective reports. 

  Next, I'll evaluate each theory against the list. The felt-quality view struggles with mixed/neutral states and neural signatures. Attitudinal theories handle diversity well but may blur with desire-satisfaction. Adverbial views are strong on empirical fit but weak on cross-person comparability. Desire-fulfillment risks collapsing into non-hedonist views. The family resemblance approach is honest about disunity but sacrifices aggregation and measurement.

  The user's deepest need might be clarity on whether a unified theory is even possible—or if hedonism must accept fragmentation to be viable. They might also need help justifying their focus on desiderata before theories, as this could be a novel contribution to the discourse.
answer: |-
  Here is a structured desiderata list for a theory of pleasure suited to your purpose, evaluating your draft points, identifying tensions, and assessing major theories.

  ### Desiderata for a Theory of Pleasure (Purpose: Hedonistic Welfare Theory)
  *(Non-negotiable = N; Preference (Camp-Specific) = P)*

  | # | Desideratum                                                                 | Case/Consideration                                                                                                                                | Status | Notes on Your Draft                                                                                                |
  |---|-----------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------|--------|--------------------------------------------------------------------------------------------------------------------|
  | 1 | **Must cover paradigmatic pleasures & pains**                               | Scratching an itch, relief from false alarm, runner's high, satisfaction of proof completion.                                                    | N      | Your examples valid. Core extensional adequacy.                                                                    |
  | 2 | **Must explain "mixed" or "ache-laden" positive states**                    | Rereaching letters from a deceased loved one (overall good, mostly ache); bittersweet experiences; grim satisfaction.                              | N      | Essential for real-world welfare. Your example valid.                                                              |
  | 3 | **Must account for "neutral absorption"**                                   | Flow states (total absorption with no noticeable feeling).                                                                                        | N      | Crucial for welfare measurement (common in experience sampling). Your example valid.                               |
  | 4 | **Must exclude mere negative sensations without aversion**                  | Burn from too-hot food (if not disliked), loud surprise (if not distressing), mere intensity.                                                     | P      | *(Preference: Anti-Felt-Quality)* - Your exclusions valid for some camps, but felt-quality views might count these. |
  | 5 | **Must exclude desire-satisfaction without positive experience**            | Experience Machine (everything desired happens, but no phenomenology).                                                                            | N      | Key to distinguish from desire theory. Your exclusion valid & non-negotiable.                                      |
  | 6 | **Must exclude background mood without object/experience**                  | "A good day's background mood" (if dissociated from current experiences).                                                                         | P      | *(Preference: Anti-Happiness/Mood)* - Your exclusion valid for strict experiential hedonism.                       |
  | 7 | **Must exclude compulsive/unsatisfying motivations**                        | Addicted gambler's urge/compulsion without enjoyment.                                                                                             | N      | Critical for dissociating wanting/liking. Your exclusion valid.                                                    |
  | 8 | **Must distinguish (a) occurrence, (b) noticeability, (c) endorsement**    | Mild comfort of a well-fitted shoe (occurs, unnoticed, unendorsed). A degrading pleasure (occurs, noticed, endorsed reluctantly).               | N      | Vital for objective measurement & guilt cases. Your distinction valid & non-negotiable.                            |
  | 9 | **Must dissociate pleasantness magnitude from welfare contribution**        | Degrading pleasures or pleasures inducing guilt are highly pleasant but contribute less (or negatively) to welfare.                                 | N      | Essential for hedonism to avoid trivialization. Your point valid & non-negotiable.                                 |
  | 10| **Must allow pleasures to differ in kind/quality**                          | Horror film "fun" vs. warm hug vs. intellectual click. Argues against crude homogeneity.                                                         | P      | *(Preference: Anti-Crude-Quantification)* - Your complaint valid but negotiable for some strict quantifiers.       |
  | 11| **Must permit comparability & aggregation within a life**                   | Needed for trade-offs (e.g., endure pain for future pleasure).                                                                                   | N      | Core requirement for welfare calculus. Non-negotiable.                                                             |
  | 12| **Must permit comparability across persons (in principle)**                 | Needed for policy, resource allocation, interspecies welfare.                                                                                    | P      | *(Preference: Utilitarian)* - Crucial for application, but some welfarists deny strong inter-personal comparisons. |
  | 13| **Must fit dissociation of "wanting" & "liking"**                           | Neural/behavioral evidence (e.g., addiction, anhedonia).                                                                                         | N      | Empirical adequacy. Your point valid & non-negotiable.                                                             |
  | 14| **Must accommodate lack of single neural signature**                        | Neuroscience shows multiple, overlapping systems for reward/affect.                                                                              | N      | Empirical adequacy. Non-negotiable.                                                                                |
  | 15| **Must be measurable in non-linguistic subjects**                           | Animals, infants, brain-damaged humans. Requires behavioral/physiological indicators.                                                            | N      | Your purpose (ii). Non-negotiable.                                                                                 |
  | 16| **Must be reportable/assessable via experience sampling/DRM**               | Practical welfare measurement relies on simple self-reports (e.g., "happy," "stressed," "enjoying").                                             | N      | Your purpose (ii). Non-negotiable.                                                                                 |
  | 17| **Must be phenomenally instantiated**                                       | Pleasure must be *felt* or *experienced* to contribute to welfare. Rejects definitional desire-satisfaction.                                      | N      | Core to experiential hedonism & distinction from desire views (Purpose iii). Non-negotiable.                         |
  | 18| **Must allow experiences to be mixed (ambivalent valence)**                 | Horror film (fear/fun), grief (sadness/love), intense effort (pain/achievement).                                                                | N      | Your point valid. Crucial for realism & measurement. Non-negotiable.                                               |

  **Evaluation of Your Draft:** Your list is largely genuine desiderata. Points 4 & 6 were preferences masquerading as requirements (now flagged as P). Points 10 & 12 involve inherent tensions (see below). The rest are valid N or P requirements.

  **Key Tensions & Constraints:**
  1.  **Tension: Qualitative Diversity (10) vs. Cross-Person Comparability/Aggregation (12) & Practical Measurement (15, 16):** This is the **hardest conflict**. Self-report (16) is coarse. Behavioral/neural measures (15) struggle to distinguish qualitative kinds. Comparing *kinds* of pleasure across people (e.g., intellectual vs. sensual) is highly speculative. *Which requirement excludes the most candidates?* **#15 (Non-Linguistic Measurement)** is the **strongest constraint**, eliminating many philosophically rich but empirically intractable views (e.g., some attitudinal or adverbial views relying on sophisticated cognition).
  2.  **Constraint: Phenomenal Instantiation (17)** excludes pure desire-fulfillment views (making Purpose iii easier).
  3.  **Constraint: Dissociating Pleasantness/Welfare Contribution (9)** requires pleasure to be a *component* of welfare, not identical to it. Hedonism must explain why some pleasures are "bad for you" *despite* being intensely pleasant.

  **Assessment of Standard Theories:**

  | Theory                     | Key Strength                                      | Key Weakness Against Desiderata                                                                 | Viability |
  |----------------------------|--------------------------------------------------|-------------------------------------------------------------------------------------------------|-----------|
  | **1. Felt Quality (Sensory Tone)** | Simple, intuitive, fits direct reports (16), potentially measurable (15). | Struggles severely with **mixed states (18)**, **neutral absorption (3)**, **dissociation of wanting/liking (13)**, **no single signature (14)**, and explaining *why* diverse feelings (e.g., itch-scratch, intellectual click) are both "pleasure". Fails on **8a/b/c** (unnoticed shoe comfort). | Low       |
  | **2. Attitudinal (Taking Pleasure In)** | Handles **diversity (10)**, **mixed states (18)** (can take pleasure *in* the fear), **unnoticed pleasure (8)** (attitude needn't be conscious), **dissociation from endorsement (8c/9)**. | **Measurement nightmare (15, 16)**: How to detect/proxy this attitude in infants/animals? Risks collapsing into **desire-satisfaction** (Purpose iii) if "taking pleasure in" is defined dispositionally. Struggles with **neural multiplicity (14)**. | Medium (if attitude is primitive & measurable) |
  | **3. Adverbial/Representational (Way of Experiencing)** | Handles **diversity (10)** (different ways), **mixed states (18)** (components experienced differently), potentially **unnoticed pleasure (8)**. | **Severe measurement problems (15, 16)**: What is the "way" in neural/behavioral terms? How is it reported simply? **Comparability/Aggregation (11, 12)** very difficult across diverse "ways". Risks vagueness/collapsing into Attitudinal. | Low-Medium |
  | **4. Desire-Fulfillment (Concurrent Desire)** | Comparability/Aggregation (11,12) *might* be easier (desire strength as proxy). Fits wanting/liking dissociation (13) if defined carefully. | Directly violates **Phenomenal Instantiation (17)** & **Experience Machine exclusion (5)**. Utterly fails **Purpose (iii)**. Cannot explain why desired sensations (e.g., intense burn) aren't pleasant if not *liked*. | ❌ (Fails core N requirements) |
  | **5. Family Resemblance (Disunified)** | Honest fit with **diversity (10)**, **mixed states (18)**, **neural multiplicity (14)**, **wanting/liking split (13)**. Avoids forcing homogeneity. | **Sacrifices Aggregation/Comparability (11, 12)**: No common currency. **Sacrifices Measurability (15, 16)**: No unified construct to measure. **Threatens Hedonism**: If "pleasure" isn't a unified source of welfare, why think *only* it matters? Requires abandoning quantitative hedonism & likely strict inter-personal comparisons. | Possible, but costs Purpose (i) calculus & (ii) unified measurement. |

  **Conclusion & Recommendation:** Your instinct to define desiderata first is sound. The **strongest constraints** are **Non-Linguistic Measurement (#15)** and **Phenomenal Instantiation (#17)**. The **core tension** is **Qualitative Diversity (#10) vs. Cross-Person Comparability/Aggregation (#12)** under practical measurement limits (#15, #16).

  *   **Most promising approach:** A **sophisticated Attitudinal theory**, defining a primitive, phenomenally-grounded *attitude of liking/disliking an experience as it occurs*, potentially detectable via facial expression (infants/animals), neural reward signals (with caveats for #14), and simple self-reports ("I liked that"). This can handle diversity (different objects), mixed states (can like the mix), unnoticed states (implicit attitude), dissociation from wanting/endorsement, and phenomenal grounding. It struggles most with cross-person comparability of attitude strength.
  *   **Radical but honest option:** **Family Resemblance**. This acknowledges the messiness but forces a reconceptualization of hedonism – perhaps as "positive affective state" pluralism – sacrificing strict aggregation and potentially the label "pleasure" as the single welfare source. Measurement becomes piecemeal (different states for different contexts).
  *   **Likely Non-Starter:** Felt-Quality and pure Desire-Fulfillment views fail too many core requirements. Adverbial views are theoretically appealing but likely empirically intractable.

  Focus your paper on how the desiderata, particularly the measurement demands and the diversity/comparability tension, constrain viable hedonistic theories and force difficult choices between theoretical elegance, empirical adequacy, and practical applicability. Your list provides an excellent foundation for this analysis.
