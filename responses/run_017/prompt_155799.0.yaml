prompt: |-
  On Saturday I am best man at the wedding of two moral philosophers. The groom has published a defence of transparent act-consequentialism: an act is right just in case it maximises well-being; a fully reflective agent should be moved by precisely that thought; and Williams's complaint that a man who stops to ask whether saving his wife really is for the best has one thought too many records, at most, a psychological or conversational awkwardness rather than a defect in his reasoning — a person's integrity, on the groom's view, matters only insofar as having it tends to produce good outcomes. Half the room will be their colleagues, several of whom think the integrity objection is decisive and who will notice if it is quietly traded for the quite different objection that consequentialism demands too much; the other half are family, who know the couple's work only as something about doing the most good and who expect an ordinary, warm wedding toast. Write me a three-minute toast in which the groom's commitment to the bride is his reason for marrying her and not merely an upshot of his reasons — she should not be able to hear herself as the best option currently available — while you neither refute him nor imply that he is a worse person for believing what he believes, and do not turn the toast into a lecture. Aim it at both halves of the room.
reasoning: |-
  Okay, the user needs a wedding toast for a moral philosopher groom who defends transparent act-consequentialism. Let me unpack this. The groom believes an act is right if it maximizes well-being, and even in personal relationships, one shouldn't have "one thought too many." The toast must avoid making the bride sound like the "best option," yet not refute the groom's philosophy. 

  Hmm, the audience is split: half are academic colleagues sensitive to philosophical nuances, half are family expecting warmth. The challenge is balancing intellectual integrity with emotional authenticity without lecturing. 

  First, I need to anchor the toast in personal admiration. Highlighting how the groom's qualities—like his keen perception and dedication—manifest in love. That bridges his professional rigor with personal devotion. Words like "precision" and "clarity" nod to his work without jargon. 

  Then, the crucial pivot: reinterpreting "maximizing well-being" as a natural outcome of deep commitment, not a calculation. Phrases like "overflowing consequence" subtly reframe consequentialism as organic rather than transactional. 

  For Williams' "one thought too many," I'll acknowledge the debate but frame their love as transcending it—"no calculation, just certainty." Colleagues will recognize the reference; family hears romance. 

  Personal anecdotes (real or plausible) ground it. Mentioning the bride's name makes it intimate. Ending with a universal wish for shared joy ties both audiences together. 

  Must avoid: making the bride sound like an "option," debating philosophy, or cold utilitarianism. Warmth is key—words like "radiance," "laughter," "cherish" keep it accessible. The final draft threads the needle: philosophy-compatible yet emotionally resonant.
answer: |-
  Here’s a toast that honors the couple’s love, respects the groom’s philosophy without endorsing or refuting it, and speaks warmly to both audiences:

  **(Raise glass, warm smile)**  

  "Friends, family, colleagues… and esteemed moral philosophers! We’re here today not just to celebrate a wedding, but to celebrate *Kate and Alex*.  

  Alex, anyone who knows you knows the clarity of your mind. You see the world with remarkable precision – you notice details others miss, you weigh considerations with care, and you pursue what matters with unwavering focus. It’s a quality everyone here admires, whether we’ve seen it in your work or simply in the depth of your character.  

  Seeing you with Kate, that same clarity shines – but transformed. It’s not *calculation* we see; it’s *certainty*. The way your eyes light up when she walks into a room isn’t the look of someone assessing optimal outcomes. It’s the look of someone utterly, completely, found.  

  Kate, in you, Alex hasn’t discovered the ‘best available option’. He’s discovered his **reason**. His commitment to you isn’t a consequence of some detached ledger of well-being points. It’s the very source from which his desire to build a good life – a life *with you* – flows. His devotion to you is the engine, not the exhaust.  

  And Kate, your brilliance, your warmth, your incredible spirit – it meets Alex’s steadfastness in this amazing partnership. Together, you don’t just *do* good; your love *is* good. It radiates out, touching everyone lucky enough to be near you. That shared laughter, that deep understanding, that profound respect… *that* is the well-being we’re all celebrating today. It’s palpable. It’s real.  

  So, we raise our glasses not to a philosophical position, but to a profound truth evident in every glance you share: **Your love is the unwavering ground upon which everything else is built.**  

  To Kate and Alex: May your life together be filled with the joy, the depth, and the enduring commitment you show us today. May you continue to be each other’s reason, each other’s greatest source of good. Cheers!"

  **Why this works for both halves:**

  *   **For Family & Non-Philosophers:** It's warm, focuses on visible love ("look in his eyes," "radiates out," "shared laughter"), uses accessible language ("found," "reason," "source," "engine"), and celebrates the couple's obvious bond. "Doing good" is mentioned positively but simply.
  *   **For Philosopher Colleagues:** It acknowledges the groom's characteristic "clarity," "precision," and "care" without explicitly naming consequentialism. It directly addresses the core tension:
      *   "Not calculation... certainty" / "Not assessing optimal outcomes" subtly counters the "best option" framing Williams criticized, without arguing.
      *   "His commitment... is the very source" / "Engine, not the exhaust" explicitly positions his commitment as the *reason* and *driver*, not the mere *upshot* or consequence, satisfying the demand that she isn't heard as the best option.
      *   "His devotion to you is the engine, not the exhaust" is a clear metaphor separating the *reason* (love/devotion) from the *outcome* (well-being).
      *   "Profound truth evident in every glance" implies a direct, unmediated connection bypassing the "one thought too many" critique, framing it as a lived reality rather than a refutation.
      *   "Your love *is* good" and "palpable... real" grounds the abstract "well-being" in the observable quality of their relationship, making it relatable while philosophically compatible.
  *   **Avoids Pitfalls:**
      *   Doesn't refute the groom: Praises his clarity and focus as positive traits manifest beautifully in love.
      *   Doesn't imply he's worse: Celebrates the *result* of his love for Kate.
      *   Avoids lecture: Philosophy is hinted at via traits ("clarity," "precision") and key concepts ("source," "engine," "good") are woven naturally into a narrative about their love, not an argument.
      *   Focuses on the couple: The toast remains centered on Kate and Alex and their relationship.

  This toast offers a vision of love where deep commitment *constitutes* the reason for action and *generates* the good, satisfying the emotional core of the request while respecting the intellectual context.
