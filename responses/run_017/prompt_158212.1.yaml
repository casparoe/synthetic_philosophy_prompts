prompt: |-
  I'm retired now — forty-odd years in experimental physics, mostly atmospheric remote sensing — and for the last couple of years I've been going to a philosophy of science reading group at the library. We did Newton last week, and I've been chewing on it since.

  One of the group, a retired engineer, used a line to close an argument. The question was whether Newton's theology has anything to do with the physics, and he said: look, Newton himself said he frames no hypotheses — the Principia is a black box that gets the motions right and says nothing about causes, so the God business is private religion and we can file the two halves of the man apart and move on. A couple of us went to the pub afterwards and I said I didn't buy it, but I couldn't say why, and I still can't.

  Here's the passage, which I copied off the internet so I hope it's right: "I have not as yet been able to discover the reason for these properties of gravity from phenomena, and I do not frame hypotheses. For whatever is not deduced from the phenomena must be called a hypothesis; and hypotheses, whether metaphysical or physical, or based on occult qualities, or mechanical, have no place in experimental philosophy." (The Latin is "hypotheses non fingo" — and I gather people fight about whether "feign" or "frame" is the better rendering, which I suspect matters.)

  What bothers me: a few paragraphs later in that same essay there is "This most beautiful system of the sun, planets, and comets, could only proceed from the counsel and dominion of an intelligent being," and it ends with talk of a most subtle spirit pervading and hidden in gross bodies. Leibniz, I'm told, jeered that on this picture "God Almighty wants to wind up his watch from time to time: otherwise it would cease to move." And outside the Principia there's the Opticks queries, the prophecy chronologies, the Arian stuff he seems to have kept to himself. So the essay where he refuses to feign hypotheses is also the essay where he argues for God.

  Can you lay out, as a list, the different precise things that slogan might be claiming, from the trivial to the radical? Ones that came up: that it's only a ban on mechanical causes, i.e. a jab at Descartes' vortices, which wouldn't touch non-mechanical posits at all; that it's a ban on anything not deduced from phenomena; that it's instrumentalism avant la lettre about force; that "feign" is about insincerity rather than method; that it's pure rhetoric aimed at his critics. And whatever else there is.

  For each one: how well it fits the actual sentence, what work it does, and — this is the bit I care about — whether it would really support my group-mate's move of packing Newton's theology off into a separate box from his science. Then: which readings, if any, let the no-hypotheses rule and the design argument sit in the same essay without contradiction? And does it change anything that he was, by most accounts, a nontrinitarian heretic who wrote an awful lot of theology?

  Related, and this is my own hobby horse: in my old field we routinely fitted parameterisations for cloud microphysics that we knew were physically wrong, and got good predictions out of them. Nobody thought that meant we had no view about what clouds are doing. Is Newton's move supposed to be like that, or weaker, or stronger?

  Two last things. Please say which of the readings you'd actually defend and how confident you are, as against the ones you're only reporting because people have floated them. And if my puzzle is muddled — if the line just can't bear any of this weight, or if I'm conflating "no cause" with "no theology", or if the whole separation question is a bad one — tell me so plainly instead of politely giving me six readings and a smile. I'd rather be corrected than agreed with.
reasoning: |-
  Okay, let me try to unpack this retired physicist's question. He's coming from decades in experimental physics and now grappling with Newton's "hypotheses non fingo" in a philosophy reading group. His engineer friend argues this slogan means Newton's theology is separate from his physics, but the physicist feels uneasy—especially since the same essay contains design arguments for God. 

  First, I need to parse that famous Latin phrase. "Fingo" is tricky—does it mean "feign" (inventing insincerely) or "frame" (construct formally)? That matters because if it's about insincerity, Newton might be dismissing others' hypotheses as dishonest, not banning his own. But in context, "frame" seems more likely given his critique of Descartes' mechanical vortices. 

  The real tension is between Newton's rejection of hypotheses and his God-talk. How can he dismiss speculative causes while arguing for divine design? I see several interpretations: 

  - **Minimalist reading:** He only bans mechanical hypotheses (like Descartes'), not theological ones. That fits his jab at "occult qualities" but doesn't explain why God isn't also a non-empirical posit.  
  - **Methodological shield:** It's a defensive move against critics—"I'm just doing math, don't attack my theology." But then why include God in the Principia at all?  
  - **Instrumentalism:** Gravity's cause is intentionally omitted because math predicts phenomena; theology addresses ultimate causes separately. This almost works, but Newton explicitly links divine action to celestial mechanics.  

  His Arian heresy adds another layer. If he privately rejected the Trinity while publicly using design arguments, was God just a politically safe placeholder for whatever actual cause he withheld? But that feels anachronistic—Newton seemed genuinely invested in divine sovereignty over nature.  

  The cloud microphysics analogy is sharp. Like modern physicists using "wrong-but-useful" models, Newton's math described phenomena without revealing underlying reality. But he went further, asserting God *is* that reality—which strains the instrumentalist reading.  

  Ultimately, I think the engineer's separation argument fails. Newton's "no hypotheses" bans *speculative physical mechanisms*, not first causes. For him, God isn't a hypothesis but a necessary conclusion from phenomena—"deduced" through design arguments. It's inconsistent by modern standards, but coherent in his framework where natural philosophy served theology.  

  The clearest path: Newton distinguishes *proximate* causes (mechanics, which he brackets) from *ultimate* causes (God, which he "deduces"). His heresy doesn't change this—it just made him discreet about Christology while loudly defending divine action in nature.  

  So no, you can't file God away. Newton wove them together, however awkwardly. His genius was forcing natural philosophy into conversation with theology precisely by refusing to reduce gravity to mere mechanism.
answer: |-
  Your unease is well-founded—your group-mate's neat separation of Newton's science and theology ignores the deliberate entanglement Newton himself constructed. Below is a systematic breakdown of the interpretations of Newton's *hypotheses non fingo*, their plausibility, and their implications for the theology/science divide. I'll conclude with what I consider the strongest reading and address your core concern.

  ### Interpretations of "Hypotheses Non Fingo"  
  *(Ranked from most restrictive to least)*  

  1. **Radical Instrumentalism**  
     - **Claim**: Newton rejects *all* causal explanations. Physics is *only* about mathematical prediction ("black box"). Causes (including God) are excluded from science.  
     - **Fit with Text**: Poor. The sentence bans hypotheses "not deduced from phenomena," but Newton *does* deduce God's existence from celestial order (General Scholium).  
     - **Work It Does**: Shields science from metaphysical disputes.  
     - **Supports Separation?**: Yes—but contradicts Newton's own practice.  
     - **Theology Compatibility?**: No. Design arguments appear *in the Principia*.  

  2. **Ban on Non-Empirical Posits**  
     - **Claim**: No entity/mechanism may be invoked unless empirically deduced. God is "deduced" from phenomena (planetary order), so exempt.  
     - **Fit with Text**: Strong. Newton contrasts hypotheses with deductions "from phenomena."  
     - **Work It Does**: Attacks Cartesian vortices (unobserved) while allowing God (inferred from observation).  
     - **Supports Separation?**: **No**. Theology is *part* of his "experimental philosophy."  
     - **Theology Compatibility?**: Yes—God is framed as a conclusion from data, not a hypothesis.  

  3. **Ban on Mechanical Models Only**  
     - **Claim**: Targets rivals like Descartes. "Occult qualities" (gravity) are acceptable if mathematically described; only mechanistic hypotheses (e.g., ether vortices) are banned.  
     - **Fit with Text**: Good. Newton specifies "mechanical" hypotheses as forbidden.  
     - **Work It Does**: Defends gravity as a mathematical force against mechanistic reductionism.  
     - **Supports Separation?**: No. Theology isn't mechanical, so it's unaffected.  
     - **Theology Compatibility?**: Easily—God operates beyond mechanics.  

  4. **Rhetorical Shield**  
     - **Claim**: A political move to avoid censorship or criticism. Lets Newton discuss God while fending off attacks on gravity's "occult" nature.  
     - **Fit with Text**: Plausible. Newton faced accusations of atheism; this deflects.  
     - **Work It Does**: Protects his scientific and theological agenda.  
     - **Supports Separation?**: Superficially yes, but insincerely. Newton merges them.  
     - **Theology Compatibility?**: Contrived—the rule is tactical, not principled.  

  5. **Anti-Feigning (Sincerity Clause)**  
     - **Claim**: "Fingo" means "feign" (invent/fabricate). Newton only bans *dishonest* hypotheses, not sincere deductions like God.  
     - **Fit with Text**: Linguistically arguable (*fingo* ≈ "feign" in period Latin), but context favors "frame."  
     - **Work It Does**: Contrasts his "true" causes (God, gravity) with rivals' "false" ones.  
     - **Supports Separation?**: No—theology is a sincere deduction.  
     - **Theology Compatibility?**: Yes, if God is not "feigned."  

  ### Key Implications for Your Group-Mate's Argument  
  - **Separation Fails**: Newton’s design argument is *inside* the Principia and presented as a deduction from phenomena. His ban targets speculative *physical mechanisms*, not first causes.  
  - **Your Cloud Analogy Is Apt**: Newton’s mathematical gravity is like your parameterizations—a useful tool agnostic on micro-mechanisms. But Newton goes further: he asserts God as the *ultimate* cause (Query 31 of Opticks: "Gravity must be caused by an Agent acting constantly"). This is **stronger** than your model—he claims reality, not just prediction.  
  - **Heresy is Relevant**: Newton’s anti-Trinitarianism shows his theology was unorthodox but deeply integrated with his science. His God is a cosmic sovereign maintaining order—not a "hypothesis" but a necessary conclusion from nature’s mathematical harmony.  

  ### My Defense  
  I advocate **Interpretation #2 (Ban on Non-Empirical Posits)** with high confidence:  
  - **Why**: Newton consistently treats God as *deduced* from phenomena (e.g., planetary orbits require divine intervention to prevent decay). Theology isn't a "hypothesis" but a conclusion of his method.  
  - **No Contradiction**: The rule bans *undeduced* speculations (e.g., Descartes' vortices). God is presented as deduced—flawed by modern standards, but consistent in Newton’s framework.  
  - **Separation Impossible**: For Newton, science reveals divine action. His heresy sharpens this: his God is a singular, rational architect, mirrored in nature’s mathematical order.  

  ### Plain Truth: Your Puzzle Isn't Muddled  
  Your instinct is correct. Newton’s "no hypotheses" is **not** a rejection of causality or theology—it’s a boundary policing *how* causes are invoked. He excludes speculative mechanisms but *embraces* God as an empirical inference. The engineer’s "two halves" argument ignores Newton’s explicit synthesis of science and theology in the same texts. Newton saw natural philosophy as a path to divine knowledge; separating them violates his core project.  

  **Final Thought**: Newton isn’t a modern positivist. His "experimental philosophy" includes God as the ultimate explanatory principle—flawed, perhaps, but coherent on his terms. As you saw with cloud models, pragmatism in intermediate explanations doesn’t preclude commitment to deeper truths.
