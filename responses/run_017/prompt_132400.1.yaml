  For the scandal itself, I consider how each framework condemns Singer's operation. Desert proper fails because achievements were fabricated; role view because fake athletes won't perform; luck-discounted as no effort was invested; procedural view due to corrupted mechanisms.

  Then I map these to control cases like test prep or legacy admissions. The key challenge is finding which framework only condemns the bribery case. Through analysis, I note that only procedural view consistently rejects just the bribes, while others struggle with common practices.

  On the deeper theoretical questions:
