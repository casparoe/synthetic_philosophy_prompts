answer: |-
  Here's a systematic mapping of the Varsity Blues scandal to four meritocracy justifications, followed by analysis of control cases and deeper theoretical implications:

  **Core Analysis: Varsity Blues Through Four Lenses**  
  *(What specifically violated each justification's principles)*  

  1.  **Desert Proper (Place owed to whoever earned it):**  
      *   **Violation:** Singer fabricated credentials (fake sports achievements, falsified SATs). The students *didn't earn* the academic/athletic achievements that formed the basis for admission. The university awarded a scarce resource (admission) based on false claims of desert.
      *   **Wrongdoing:** Awards were based on *fictional* merit, not actual desert.

  2.  **Role View (Office should go to whoever will perform best):**  
      *   **Violation:** The fabricated profiles misled universities about the student's *actual ability* to fulfill the intended role (student-athlete or high-academic-achiever student). The selected students were highly likely to underperform relative to genuine recruits or high-scoring applicants, undermining the university's educational/research mission and athletic programs.
      *   **Wrongdoing:** Selection was based on *false predictions* of future performance/contribution.

  3.  **Luck-Discounted Desert (Only effort grounds desert; talent is brute luck):**  
      *   **Violation:** The students didn't exert the *effort* required to develop genuine athletic skills or achieve high test scores legitimately. Their "success" resulted solely from parental wealth (another form of luck) buying fraud, not their own diligence or perseverance.
      *   **Wrongdoing:** Admission bypassed *any requirement for effort-based desert*. Luck (wealth) directly purchased the outcome.

  4.  **Procedural View (Sorting mechanism must be non-buyable):**  
      *   **Violation:** The core wrong is the *corruption of the procedure itself*. Singer bribed officials (coaches, test proctors) to subvert the official selection mechanisms (athletic recruitment, standardized testing). This rendered the process "buyable," destroying its integrity regardless of what it measured.
      *   **Wrongdoing:** The *process was fraudulent*, violating fair procedural rules. The merit measured (if any) becomes irrelevant.

  **Control Cases: What Each Justification Condemns**  
  *(Beyond Varsity Blues bribes for fake profiles/scores)*

  | Justification          | Test Prep | Elite Private School | Legacy | Endowing Building | Genuine Athlete | Fake Athlete (Bribe) |
  | :--------------------- | :-------- | :------------------- | :----- | :---------------- | :-------------- | :------------------- |
  | **A. Desert Proper**   | Accepts   | Ambiguous            | Rejects | Rejects           | Accepts         | **Rejects**          |
  | **B. Role View**       | Accepts   | Accepts              | Rejects | Rejects           | Accepts         | **Rejects**          |
  | **C. Luck-Discounted** | Accepts   | Rejects              | Rejects | Rejects           | Ambiguous       | **Rejects**          |
  | **D. Procedural View** | Accepts   | Accepts              | Accepts | Accepts           | Accepts         | **Rejects**          |

  *   **Explanations:**
      *   **Test Prep:** (A,B,D) Accept: Legitimate effort/skill enhancement within rules. (C) Accept: Effort exerted by student.
      *   **Elite Private School:** (A) Ambiguous: Resources boost achievement, muddying "earned." (B) Accept: Prepares for performance. (C) Rejects: Advantage from wealth-luck, not effort. (D) Accepts: Access isn't bribing the *admissions process*.
      *   **Legacy:** (A,B,C) Reject: Unearned advantage; no link to performance/effort. (D) Accepts: If transparent rule, not bribing an official.
      *   **Endowing Building:** (A,B,C) Reject: Buying access, not merit/performance. (D) Accepts: Transparent transaction, not corrupting procedure (though ethically dubious).
      *   **Genuine Athlete:** (A,B,D) Accept: Earned skill/performance; valid procedure. (C) Ambiguous: Athletic talent is often "brute luck," effort matters but foundation is lucky.
      *   **Fake Athlete (Bribe):** All reject, per core analysis.

  *   **The View Condemning Only the Last (Bribe):** Only the **Procedural View (D)** condemns *only* the explicit bribery and fraud (fake athlete). It tolerates all other advantages (wealth, legacy, donations) as long as the official selection *rules* aren't subverted through bribery or deception. This aligns with the legal "fraud" charge but clashes with intuitions about fairness.

  **Theoretical Implications & Your Stuck Points:**

  1.  **The "Swap Test" & Idle Merit (a/b):**
      *   **Argument:** If swapping a randomly rejected applicant rarely harms the university (given applicant pool similarity at elite margins), then selecting the "most meritorious" (a/b) is functionally irrelevant. The slot wasn't truly "earned" in a meaningful sense (a), and predicting "best performance" (b) is noise at this level.
      *   **Proves Too Much for Hiring?** Potentially, but less so. Hiring often involves specific, differentiated skills needed *now*. College admission predicts *future potential* based on highly correlated high school achievements. The swap test is stronger for admissions because the marginal difference between the "last admitted" and "first rejected" is often negligible for *institutional outcomes*, whereas hiring a slightly less qualified candidate might have immediate, measurable performance impacts. However, it *does* challenge the precision and significance of meritocratic claims in *both* domains at the margins. Theories (a) and (b) remain relevant for *gross* mismatches but become less compelling for fine-grained distinctions.

  2.  **Fraud Charges, Outrage, and the Open Bribe Variant:**
      *   **Charges/Outrage as Evidence:** The fraud charges and public outrage strongly support the **Procedural View (D)**. The core agreed-upon wrong was *lying and bribing officials*, not necessarily that the admitted students were substantively unworthy (many might have succeeded). This suggests the public prioritizes **procedural fairness** ("the rules weren't followed") over perfect substantive meritocracy ("the best didn't get in"). Outrage focuses on cheating the system, not just undeserved outcomes.
      *   **Open Bribe Variant (No Deception):** Where the theories stand:
          *   **A. Desert Proper:** Rejects. The seat wasn't earned through merit.
          *   **B. Role View:** Rejects. Unlikely the bought student is best suited.
          *   **C. Luck-Discounted:** Rejects. Wealth-luck, not effort.
          *   **D. Procedural View:** **Accepts (or is silent).** If the university *openly* sells seats as a matter of policy (no bribery/deception), the procedure is transparent. It violates the *spirit* of meritocratic procedures but not necessarily the *formal* requirement of non-corrupt process if the rule allows it. This highlights (D)'s limitation: it cares *how* selection happens, not *what* it selects for, allowing "merit" to be redefined as "ability to pay" via official policy.
      *   **Public Reaction (Likely):** Outrage would likely remain, directed at the *unfairness* of wealth buying access outright, even if legal. This suggests public commitment blends procedural fairness *and* substantive notions of desert/performance (leaning towards A, B, C) that pure proceduralism (D) ignores.

  **Where Theories Go Silent:**

  1.  **Systemic Advantages:** None directly address how "merit" metrics (test scores, athletic prowess, even "effort") are themselves shaped by systemic inequalities (wealth, race, early education access). A student at an elite prep school may "deserve" (A) their high SAT score through effort (C), but the *opportunity* to develop that score was luck-based.
  2.  **The Purpose of Selective Universities:** The theories assume the *current* purpose (selecting for academic excellence/future leaders/athletic success) is valid. They don't challenge whether universities *should* be this selective or use these metrics, or if other values (diversity, civic contribution, rectifying past injustice) should compete with "merit."
  3.  **The Value of the "Competition":** They don't question whether framing education as a high-stakes competition for scarce elite spots is desirable or necessary. The outrage over Varsity Blues presupposes this competition is legitimate and worth protecting.
  4.  **Open Sale as Policy:** As noted, (D) is silent on the *substantive morality* of an open "pay-for-admit" policy, only caring that it's not implemented via secret bribes. Others reject it but offer no mechanism to prevent it if the institution chooses it.

  **Conclusion:** Varsity Blues acts as a stress test. The **Procedural View (D)** best explains the legal response and isolates the bribery as uniquely wrong, but it uncomfortably accepts other wealth advantages and even open seat-selling. **Desert (A)**, **Role (B)**, and **Luck-Discounted (C)** views condemn more practices (legacies, donations) but struggle to cleanly distinguish accepted advantages (test prep, private school) from condemned ones. The scandal reveals a societal consensus on **procedural integrity** as paramount, even amidst ambiguity about substantive desert. The "swap test" suggests meritocratic claims are often overstated at the elite margin, but the fraud charges confirm that the *process* of selection, however imperfect, must remain untainted by corruption for the system to retain legitimacy. The theories remain powerful lenses but expose tensions between procedural fairness, substantive merit, and the reality of luck's pervasive influence.
