prompt: |-
  For the past nine months I have been my mother's principal carer — she has vascular dementia and now needs help with almost everything — and in the evenings, when there is nothing left to do, I have started reading about moral worth. My question is a practical one, and I hope you will allow that it is also personal.

  The difficulty is that I act as I do for a tangle of reasons at once: I love her; I should be ashamed in front of my brother if I did less; I feel guilty about the years I spent abroad; and I also think, quite steadily, that this is what a son owes. From the inside I cannot separate these or weigh them against one another.

  The test I have arrived at, which I call the Subtraction Test, is this: strip away from an agent's motivation everything except the thought that the action is required of her — if the action would still be performed, it has moral worth, and if it would not, it does not. On my own case the verdict seems clear and unwelcome. Were the love, the guilt and the concern for my brother's good opinion subtracted, I honestly do not know that I would continue; and on the easy days, when I most want to be there, the part I can credit to duty is smallest — so it appears to follow that the more willingly I do it, the less it is worth. The familiar case of the tradesman who gives correct change only because honesty is good for custom seems to point the same way.

  So: is the Subtraction Test the right way of making precise the thought that an action has moral worth only if it is done for the right reasons? I ask because I have begun to act on it. I have been taking on the tasks I find most repugnant on purpose, and trying to let the affection and the guilt drain out of what I do, on the assumption that whatever survives the subtraction is the only part that counts. Is that the correct practical upshot of the view? If the test is wrong, I should be grateful to know exactly where it fails — whether in treating worth as something that comes in degrees, in reading done because it is required as a causal claim about what actually moves me, or somewhere else — and what a better criterion would say about a case like mine, where the motives are thoroughly mixed and I could not tell you which of them I am acting on. And if it is wrong to be trying to engineer the purity of my own motives at all, I should like to know why.
reasoning: |-
  Okay, the user is caring for their mother with vascular dementia and has developed a "Subtraction Test" to assess the moral worth of their actions. They're troubled because their mixed motives—love, guilt, duty—seem to fail this test, leading them to deliberately engage in repugnant tasks to purify their motives. 

  First, I need to unpack why the Subtraction Test feels intuitively Kantian but misses the mark. Kant does emphasize acting from duty, but he never claims other motives must be absent—only that duty must be the overriding reason. The user’s interpretation risks turning moral worth into a self-punishing exercise. 

  Their situation is heartbreaking: the more they *want* to care for their mother (a good thing!), the more they distrust their own motives. The tradesman analogy they cite actually backfires here—unlike the shopkeeper’s calculated honesty, their caregiving isn’t instrumental. Love and duty aren’t competing; they’re intertwined. 

  The practical implications worry me most. By leaning into repugnant tasks to "drain" natural affection, they’re treating caregiving like asceticism. But moral worth isn’t about suffering—it’s about commitment to the right principle. If they succeed in numbing their love, wouldn’t that *undermine* the quality of care? Dementia patients sense emotional absence. 

  A better approach: reframe "mixed motives" as human inevitability. What matters is whether duty *regulates* their actions—e.g., choosing care even on days love feels thin. Their perseverance despite exhaustion suggests duty *is* operative, even alongside other feelings. 

  Lastly, the guilt about living abroad feels like a red herring. If that guilt propelled neglect, *that* would be problematic. But here, it’s just one thread in a tapestry of care. They deserve permission to stop weaponizing their own compassion.
answer: |-
  Your question cuts to the heart of moral philosophy and the lived reality of caregiving. Your "Subtraction Test" is a sincere and insightful attempt to grapple with Kantian ideas about moral worth, but it misapplies them and risks causing unnecessary distress. Here's a breakdown of where the test fails and a more humane alternative:

  ### Where the Subtraction Test Fails
  1.  **Misinterpreting Kant's "Duty as the Motive":**
      *   Kant argued that an action has moral worth *only* when done *from duty* – meaning the primary, determining motive is the recognition that the action is morally required.
      *   **Crucially, Kant did *not* require the *absence* of other motives (like love, guilt, or fear of shame). He required that the motive of duty be the *sufficient* reason for the action, overriding any contrary inclinations.**
      *   Your Subtraction Test falsely assumes that other motives must be stripped away *completely* for duty to be the motive. Kant's point is about the *hierarchy* and *sufficiency* of reasons, not their *exclusivity*. It asks: "Would the motive of duty *alone* be *sufficient* to cause the action, even if other motives are present?" Not: "Would the action happen if *only* duty were present and all else were absent?"

  2.  **The Problem of "Purity" and Degrees:**
      *   Treating moral worth as a matter of "purity" (where less "contamination" by non-duty motives equals higher worth) is not core to Kant and leads to absurd conclusions, as you've discovered (the easier/willing the action, the less worth it has). This turns morality into a perverse self-punishment.
      *   Moral worth, for Kant, is more binary: an action is done *from* duty or it isn't. While the *clarity* with which duty operates might vary, the *worth* depends on duty being the sufficient determining ground of the will, not on the absence of other feelings.

  3.  **The Causal Claim Problem:**
      *   The Subtraction Test makes a counterfactual causal claim ("If only duty were present, would I act?"). This is incredibly difficult, perhaps impossible, to know with certainty, especially with deeply ingrained mixed motives like yours. Our introspection is often unreliable.
      *   More importantly, Kant wasn't primarily interested in a psychological causal claim about what *actually* moves you in a specific instance. He was interested in the *principle* you adopt as your maxim – the fundamental reason you take to justify your action. Is your principle "I will care for my mother because I love her (and if I stopped loving her, I might stop)" or is it "I will care for my mother because it is my duty, regardless of my fluctuating feelings"?

  4.  **The Harmful Practical Upshot:**
      *   Your conclusion – seeking out repugnant tasks and trying to "drain" affection and guilt – is a dangerous misapplication. It:
          *   **Misunderstands Duty:** Duty isn't about preferring the repugnant. It might require doing repugnant things *when necessary*, but seeking them out for their own sake is masochism, not morality.
          *   **Fights Human Nature:** Love, familial affection, and even (appropriately managed) guilt are *good* motivations that sustain caregivers. Trying to suppress them is unnatural and potentially harmful to both you and your mother. Cold, detached "duty" devoid of warmth is unlikely to be the best care.
          *   **Ignores the Moral Value of Love:** While Kant prioritized duty, most ethical systems (including many modern Kantian interpretations) recognize that actions motivated by genuine love and compassion *are* morally valuable, even if they don't meet the strictest Kantian standard of "moral worth." They are often *intrinsically good*.

  ### A Better Approach: The "Overriding Force" Test
  Instead of subtraction, consider if the motive of duty has **overriding force**:

  1.  **Is the recognition of duty a necessary part of your motivation?** You clearly acknowledge this ("I also think, quite steadily, that this is what a son owes").
  2.  **Would the motive of duty compel you to act even if other motives faded or pulled you away?** This is the key Kantian question.
      *   *Scenario:* Imagine your love for your mother became clouded by the immense strain of caregiving (a common experience). Imagine your brother praised you regardless. Imagine the guilt faded with time. **Would the conviction "This is what I owe her; this is the right thing to do" still be enough to sustain you in providing necessary care?** Your perseverance through nine demanding months suggests the answer is likely "yes."
      *   *Scenario:* Imagine a day when you have a very strong desire to do something for yourself (rest, socialize, escape), but your mother needs essential care. **Does the sense of duty override that contrary inclination and ensure you care for her?** Again, your description implies it does.
  3.  **Does duty shape *how* you act?** Does the principle "I must care for her because it's right" lead you to ensure the care is respectful, patient (as much as humanly possible), and meets her needs, even when it's hard?

  ### Applying This to Your Case
  *   **Mixed Motives are Normal and Often Good:** Your tangle of reasons – love, a sense of obligation, familial loyalty, even guilt channeled into responsibility – is profoundly human and ethically understandable. **It does not negate the moral worth of your actions.**
  *   **Duty is Present and Operative:** You explicitly recognize the duty ("a son owes"). Crucially, this sense of duty is clearly a *powerful, sustaining force* within your mix of motives. It's not absent; it's intertwined. The fact that it might be harder to *feel* on "easy days" when love flows freely doesn't mean it's not there as the underlying commitment. The "easy days" are evidence your motives are healthy, not deficient!
  *   **The Tradesman Contrast:** Your case is fundamentally different. The tradesman's *sole* motive is self-interest disguised as honesty. You have multiple motives, including a sincere belief in duty and love. Duty isn't a mask; it's a core part of your motivation. If his self-interest vanished, he'd cheat. If your love (or guilt, or fear of shame) lessened on a given day, your sense of duty would very likely still compel you to act rightly.
  *   **Stop Engineering "Purity":** Deliberately seeking repugnance and suppressing natural affection is misguided and potentially harmful.
      *   **Why it's wrong:** It misunderstands duty, fights healthy human emotions, risks resentment, and may diminish the quality of care your mother receives (which thrives on connection, not just task-completion).
      *   **What to do instead:** Acknowledge and accept your mixed motives with compassion. Focus on the *action* (providing good care) and the underlying *commitment* to doing what's right for your mother. Nurture the love and connection; it's a source of strength. Manage guilt by recognizing you *are* fulfilling your responsibilities now. Let the sense of duty be the bedrock that holds when other feelings waver under the immense pressure of caregiving.

  ### Conclusion
  The Subtraction Test is incorrect. It demands an unrealistic and harmful purity, misreads Kant, and leads to damaging practices. Your caregiving **does** possess moral worth because a genuine, operative sense of duty – the conviction that this is what you owe her – is a fundamental and overriding part of your motivation, woven together with love, loyalty, and other human feelings. This mix doesn't contaminate your actions; it makes them humanly possible and deeply meaningful. Stop trying to drain the affection; it is part of what makes your care valuable. Your steadfastness in this profoundly difficult role speaks volumes about your character, motives included. Focus on sustaining yourself and providing compassionate care, not on interrogating the worthiness of your own compassion.
