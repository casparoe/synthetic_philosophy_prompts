  ### Activity Design: The Prediction Puzzle

  **Goal:** Participants experience opacity (1), are tempted by irreducibility (2), then confront the meta-problem (3) that (2) is unprovable for real systems. Avoid technical jargon until the final debrief.

  **Materials:**
  - 6 envelopes (each with a system card, seed card, and step-10 task)
  - 18 index cards (for betting)
  - Whiteboard
  - Handouts: Summary of rules for Systems A/B (distributed at the end)
  - Chocolate for incentives
  - Dice (to assign groups)

  **Group Split:**  
  18 participants → 6 groups of 3.  
  - Roll dice: Even roll → System A (3 groups)  
    Odd roll → System B (3 groups)  
    *(Groups don’t know systems are different)*  

  **Systems:**  
  - **System A (Easy - Periodic Structure):**  
    `x₀ = [seed]`  
    `xₙ = (a * xₙ₋₁) mod 10`  
    *Seeds & multipliers:*  
    - Group 1: `x₀ = 1`, `a = 2` → Cycle: [2, 4, 8, 6]  
    - Group 2: `x₀ = 1`, `a = 3` → Cycle: [3, 9, 7, 1]  
    - Group 3: `x₀ = 1`, `a = 7` → Cycle: [7, 9, 3, 1]  
    *Shortcut:* After `x₁`, cycle length=4. For step N, compute `xₙ = cycle[(N-1) mod 4]`.  

  - **System B (Hard - No Known Shortcut):**  
    `x₀ = [seed]`  
    `xₙ = middle_4_digits(xₙ₋₁²)`  
    *Seeds (4-digit):*  
    - Group 4: `x₀ = 1234`  
    - Group 5: `x₀ = 5678`  
    - Group 6: `x₀ = 9012`  
    *Rules for middle_4:* Square `xₙ₋₁`, pad to 8 digits with leading zeros, take digits 3–6 (e.g., `1234²=01522756` → `5227`).  

  ---

  ### Timeline (75 min total):

  #### **Min 0–5: Setup & Rules**  
  - **Facilitator:**  
    - "Each group has a deterministic system. Your task: Compute the state at step 10. You have 10 minutes. Use the whiteboard."  
    - Distribute envelopes.  
    - *No definitions of "opacity" or "complexity."*

  #### **Min 5–15: Step 10 Computation**  
  - Groups compute `x₁₀` by hand.  
  - **Facilitator circulates:**  
    - Checks answers (System A: groups should get `6`, `1`, `1`; System B: answers vary).  
    - Hands chocolate to each group that finishes.  
    - *Predictable issue:* System B groups may make arithmetic errors → Recalculate together.  

  #### **Min 15–20: Introduce Billion-Step Challenge**  
  - **Facilitator:**  
    - "Now compute `x` at step N = 1,000,000,000. You have 10 minutes. If you find a fast way, explain it. If not, explain why it’s impossible."  
    - *Emphasize:* "You must declare your answer *and* method."  

  #### **Min 20–30: Billion-Step Work**  
  - **System A groups:** Likely find the cycle quickly (e.g., "For N=1e9, since (1e9-1) mod 4 = 3, `x = 8` for `a=2`").  
  - **System B groups:** Grind, get stuck, or try/fail to find patterns.  
  - **Facilitator:**  
    - If a group "solves" System B (e.g., "It repeats every 20 steps!"):  
      - *Don’t shut down.* Say: "Write your method. We’ll test it later." (In debrief, reveal their seed’s actual sequence lacks short cycles → "Finding patterns ≠ proof.")  
    - *Predictable issues:*  
      - CS students may say "This is exponential time!" → Redirect: "Describe *why* you can’t skip steps."  
      - Groups giving up → Ask: "What makes this different from System A?"  

  #### **Min 30–35: Betting Phase**  
  - Hand out index cards.  
    - **Question:** "For your system, which is true?  
      (A) No fast method exists (even with infinite time/paper).  
      (B) A fast method exists, but we haven’t found it.  
      (C) We found a fast method."  
    - **Confidence:** 0–100% (0% = guessing, 100% = certain).  
  - Collect cards.  
  - *Incentive:* Groups betting correctly (A for B, C for A) get chocolate. Overconfidence (e.g., 100% + wrong) loses chocolate.  

  #### **Min 35–45: Group Reports**  
  - **Facilitator:**  
    - Ask 1 System A group: "How did you compute step 1e9?" (They describe the cycle).  
    - Ask 1 System B group: "Why couldn’t you?" (They describe grinding).  
    - **Key question:** "Did any group *not* need the cycle? Why?"  

  #### **Min 45–60: Debrief & Philosophy**  
  *(Reveal systems only now)*  
  - **Map to Claims:**  
    - **Opacity (1):** "At step 10, everyone *had* to compute sequentially. At step 1e9, System B *felt* just as stuck. That’s opacity: no hidden variables, but grinding is the only obvious path."  
      - *Whiteboard:* Draw System B’s chaotic sequence.  
    - **Irreducibility (2):** "System B groups bet on (A): ‘No fast method exists.’ Why? Because you couldn’t *imagine* a shortcut. That’s the leap to irreducibility—a claim about all possible algorithms, not human limits."  
      - *Plot twist:* "But we don’t *know* if System B is irreducible. No one has proven it."  
    - **Meta-Point (3):** "System A *had* a shortcut. For System B, the ‘irreducible’ feeling is indistinguishable from ‘not finding the trick.’ We can’t prove hardness for systems we care about (e.g., Collatz). Complexity theory studies this gap."  
      - *Reveal bets:* Show overconfident bets for System B. "See? Confidence ≠ proof."  
  - **Honest Takeaway:**  
    - "Determinism (Laplace’s demon) doesn’t guarantee predictability. Opacity is real, but irreducibility is a ghost—always one step ahead of proof. We *feel* walls, but we can’t know if they’re infinite or just tall."  

  ---

  ### Predictable Issues & Mitigation:  
  - **Smart-Aleck Finds Shortcut in System B:**  
    - *Use it!* "Group 4 found a pattern! But is it *always* true? We tested 20 steps—what about step 1e9? Without proof, it’s just intuition."  
  - **CS Students Blurt Jargon:**  
    - "Hold that thought! Let’s hear from non-CS groups first." (Jargon becomes debrief material).  
  - **Group Chatting/Quitting:**  
    - Ask: "What would it take to compute step 1e9? Infinite paper? A smarter human? What’s the difference?"  
  - **"This is About Human Patience”:**  
    - Counter: "If I gave you 10 years, could you do 1e9 steps? Yes. But what if N=1e100? *Scaling* is key—hardness means runtime grows faster than universe time."  

  ### What the Activity Can’t Replicate:  
  - **Scaling & Infinite Families:**  
    - *Facilitator says:* "We only tested one N. Hardness requires proving *all* algorithms fail for *all* large N. That’s why we can’t prove it for System B—we’d need to out-think every possible future trick."  
  - **Laplace’s Demon Tie-In:**  
    - "Even if the universe is deterministic, predicting step N might require simulating N steps. If N is the age of the universe, prediction is *practically* impossible—even if *mathematically* possible."  

  ### Payoff Scheme:  
  - **Step 10:** Chocolate per correct group.  
  - **Step 1e9:**  
    - System A: 2 chocolates if correct + shortcut explained.  
    - System B: 2 chocolates if they articulate opacity.  
  - **Betting:**  
    - Correct bet (C for A, A/B for B): 1 chocolate.  
    - Overconfidence penalty (100% + wrong): Lose 1 chocolate.  

  ### Final Handout:  
  ```  
  System A: xₙ = (a·xₙ₋₁) mod 10 → Shortcut: Cycles every 4 after x₁.  
  System B: xₙ = middle_4(xₙ₋₁²) → No known shortcut; open problem.  

  Takeaway:  
  Opacity = Grinding feels unavoidable.  
  Irreducibility = Grinding *is* unavoidable (for all algorithms).  
  Meta-Problem = We can’t prove irreducibility for natural systems.  
  ```  

  ---  
  **Why this works:**  
  - **Opacity** is felt during step 10 and step 1e9 for System B.  
  - **Irreducibility** tempts System B groups during betting.  
  - **Meta-point** lands when System B’s "hardness" is revealed as unproven.  
  - **No vocab early:** Jargon-free until debrief; concepts emerge from struggle.  
  - **Betting** punishes overconfidence, mirroring real complexity humility.
