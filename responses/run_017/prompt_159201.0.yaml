answer: |-
  Sir, you press your point with admirable clarity, yet I fear you mistake the nature of the deficit. You are quite right that the man possesses, by touch, an intricate understanding of figure – its angles, its curves, its relations – a world ordered by resistance and motion. Upon sight’s advent, he is likewise flooded with a new order: patches of light and colour, bounded by lines and shifts of hue, possessing their own relations of adjacency and distinction. He has, as you say, two families: the tangible and the visible. And you reduce the lack to merely a 'correspondence', a 'pairing', a thing 'thin' in quantity and kind.

  But consider, Sir: what *is* this correspondence? It is not the mere *juxtaposition* of a sight and a touch happening simultaneously to the same object. That brute occurrence might indeed happen in a single moment. The profound lack lies in his *inability to recognize that the visible figure now presented to his eye* **is** *the very same thing* as the tangible figure he knows so intimately through his hand. He lacks the *identity*.

  You speak of Leibniz's 'extension' as common ground. Yet what is extension abstracted from sense? It is a concept, a geometrical truth, known perhaps to the intellect. But the *sensation* of visible extension – the flat, coloured expanse bounded by lines – is utterly alien to the *sensation* of tangible extension – the resistant pressure enclosing a volume. The blind geometer, reasoning exquisitely about angles and lines in tangible space (or even in abstract geometric space), reasons *about* figure, yes. But upon seeing, what is presented is not the *concept* of figure, but a novel and bewildering *sensation*. He has reasoned about the properties of the *referent*, but the visible *sign* for that referent is entirely new. How should his exquisite reasoning about cubes and spheres tell him that *this particular arrangement of coloured patches and lines* signifies the tangible cube, while *that other arrangement* signifies the tangible sphere? Reasoning deals in universals and relations; sight presents raw, uninterpreted particulars linked to a novel sensory channel.

  Experience, therefore, Sir, supplies not merely a 'pairing', but the very *meaning* of the visible sign in terms of the tangible world. It teaches him that *this* specific visual appearance *stands for*, *corresponds to*, *is identical with*, *that* specific tangible property he already comprehends. It is the forging of a link between two utterly distinct sensory vocabularies. The structure of the families may indeed allow rapid generalization *once the fundamental equivalence is grasped through experience* – one cube seen and felt might suffice to unlock the visual meaning of 'cube'. But the *initial apprehension of identity* – the realization that these two disparate sensory experiences pertain to the *same property* of the *same external object* – this, I contend, is the crucial work of experience. It is not bolting representations together; it is learning a new language and discovering which words signify which known things.

  You ask what experience adds: it adds the *recognition of identity* across sensory modes. And if this recognition is absent at the very first moment of sight, before the hand confirms it, does this not demonstrate that the *ideas* of figure by sight and by touch are fundamentally distinct, requiring this vital experiential bridge? I put this to you: If the connection were truly inherent, established by reasoning on the common ground of 'extension' alone, why should the newly sighted man need *any* moment of confusion? Should he not instantly *know*, upon seeing them, "Ah, that *must* be the sphere, and that the cube," with the same certainty the geometer knows the properties flow from the definitions? Yet the very messiness of the results you concede for later centuries suggests this instant certainty is precisely what is lacking. Where, then, does this fundamental recognition arise, if not from the conjunction of experience?
