prompt: |-
  I'm writing something on the epistemology of markets and I want the spec before I read any more of the literature: what would a theory of price authority actually have to get right? The question is deliberately narrow — when is an outsider (a journalist, a central banker, a forecaster who has read the same public headlines as everyone else) warranted in deferring to a market price over their own read of the evidence? Not a theory of price formation. A theory of warranted deference.

  Give me the requirements list, each with the case that motivates it. The cases I want handled include:

  - the annoying baseline: the standard no-trade result says common priors plus common knowledge of posteriors leave no room for information-driven trade, yet real markets trade constantly — so the theory has to say where the trade comes from and what that does to informativeness.
  - the Grossman-Stiglitz-flavored tension: if the price fully reveals what dispersed traders know, no one pays to acquire information, so it can't fully reveal. Say plainly whether that pair is unsatisfiable and what has to give.
  - prices that move for non-epistemic reasons (a margin call, a leverage constraint, one big player unwinding) — the price is as if the market believes p while nobody believes p.
  - the same number with no volume behind it versus the same number after heavy two-sided trade.
  - traders who aren't disagreeing about likelihood at all but about what would have to happen for the contract to pay out.
  - reflexive markets, where the price feeds into the thing it prices (an internal company market on a launch date, odds that move donations or turnout).
  - selection: only certain people trade, and some of them are hedging rather than saying anything.
  - and my favorite: deference from the outside without knowing who is in the pool or why they trade — if you need to know that, it isn't deference to the market, it's just deference to experts.

  For each, say whether it's a genuine desideratum or a prejudice of one camp. Flag any pair you think can't be jointly satisfied, and end with one line on which requirement excludes the most popular stories about why markets are smart. Skip the theory-by-theory scorecard, I'll do that myself — I want the criteria.
reasoning: |-
  Okay, let me try to unpack this user's query. They're working on the epistemology of markets and need a spec for a theory of price authority. The focus is on when an outsider is warranted in deferring to market prices over their own judgment. They listed several cases that the theory must handle, so I need to address each one.

  First, the annoying baseline with the no-trade theorem. The user points out that real markets trade constantly despite the theorem's prediction. So the theory must explain where the trade comes from and how it affects informativeness. This seems like a core issue. The tension here is between theoretical models and real-world behavior. Any theory of deference has to reconcile this by acknowledging non-informational motives for trading, like liquidity needs or risk aversion. Without that, the price can't be informative enough to defer to.

  Next, Grossman-Stiglitz. The paradox here is that if prices fully reveal information, no one has an incentive to gather it. The user wants to know if this is unsolvable. The answer is that it's a necessary tension; the theory must accept noisy prices and partial revelation. Deference should be probabilistic, not absolute. This ties into the first point—since prices aren't perfect, outsiders need to assess when the noise is low enough to trust the price.

  Non-epistemic price movements, like margin calls or big players unwinding positions. The key here is distinguishing between information-driven moves and technical ones. A good theory must help outsiders recognize when prices reflect beliefs versus liquidity shocks. Maybe using volume or volatility as indicators. If the price doesn't reflect aggregated beliefs, deference isn't warranted.

  Volume matters. A price with no trade behind it versus heavy two-sided volume. The latter suggests genuine disagreement and information aggregation. The theory should incorporate volume as a signal of reliability. Low volume might mean the price is stale or manipulated, so deference isn't justified. This links to the previous point about non-epistemic factors.

  Traders agreeing on probabilities but disagreeing on contract interpretation. This is about ambiguity in what the price is actually predicting. The theory needs to ensure that the market's definition aligns with the outsider's question. Otherwise, deferring could be misleading. Clarity in contract terms is crucial here.

  Reflexive markets where prices influence the outcome. This creates a feedback loop. The theory must account for when prices are self-fulfilling or self-defeating prophecies. Deference might not be warranted if the market is manipulating the outcome rather than predicting it.

  Selection issues: not all participants trade for informational reasons. Hedgers or liquidity traders add noise. The theory should address how selection affects price reliability. Outsiders need to know if the active traders are informed or just hedging, but the user wants deference without knowing the pool. This is tricky. The theory must infer from market data (like volume patterns) whether informed traders dominate.

  The favorite point: deference without knowing who's trading. This is central. If the outsider needs insider knowledge about traders, it's not market deference but expert deference. The theory must provide heuristics based on observable market features—price movements, volume, volatility—to justify deference without internal details.

  Now, looking for conflicts. The biggest tension is between reflexive markets and deference. If prices affect outcomes, they're not just predictions, so deferring might alter the event. Also, selection and deference without knowledge conflict. If you need to know who trades to trust the price, it violates the outsider principle. The theory must use proxies instead.

  The requirement that excludes popular stories? Reflexivity. Many theories assume prices are passive signals, but in reflexive cases, they're active forces. This undermines the idea that markets neutrally aggregate information.

  Also, the user probably wants a practical framework for outsiders. They might be critiquing existing literature that overlooks these nuances. Their deeper need is a robust, real-world applicable theory that avoids idealized assumptions.
answer: |-
  Here’s a requirements list for a theory of **warranted price deference**, derived from your cases. Each requirement is framed as a necessary condition the theory must satisfy, with the motivating case and its epistemic implication:

  ### Core Requirements for a Theory of Warranted Deference
  1. **Non-Common Priors/Knowledge Requirement**  
     *Motivating Case*: The annoying baseline (no-trade theorem violation).  
     *Requirement*: Must explain how trade arises from *heterogeneous interpretation* (divergent priors, differing models, or private incentives) without destroying price informativeness.  
     *Epistemic Stakes*: Deference is unwarranted if prices merely reflect common knowledge; warrants must hinge on how markets *resolve* disagreement.

  2. **Imperfect Revelation Equilibrium Requirement**  
     *Motivating Case*: Grossman-Stiglitz tension.  
     *Requirement*: Must treat prices as *noisy aggregators*, not perfect revelation devices. The theory must specify conditions under which noise is sufficiently low relative to information gain to warrant deference.  
     *Epistemic Stakes*: Denies satisfiability of perfect revelation + rational info acquisition. **What gives**: Prices only partially reveal costly information; deference requires assessing the noise-to-signal ratio.

  3. **Liquidity Shock Robustness Requirement**  
     *Motivating Case*: Prices moving for non-epistemic reasons (e.g., margin calls).  
     *Requirement*: Must distinguish *information-driven price changes* from *liquidity-driven distortions*. Warrants for deference require diagnostics (e.g., volume spikes, volatility profiles) to filter out non-belief-based moves.  
     *Epistemic Stakes*: A price disconnected from aggregated beliefs cannot warrant epistemic deference.

  4. **Volume-Weighted Credibility Requirement**  
     *Motivating Case*: Same price with no volume vs. heavy two-sided trade.  
     *Requirement*: Must incorporate *trading volume* as a signal of consensus strength. Low-volume prices are "cheap talk"; high-volume prices reflect costly commitment to beliefs.  
     *Epistemic Stakes*: Deference to a price requires evidence that it emerged from active contention among informed agents.

  5. **Contractual Ambiguity Resolution Requirement**  
     *Motivating Case*: Traders agreeing on likelihoods but disagreeing on contract interpretation.  
     *Requirement*: Must validate that the market price reflects *shared understanding of the payoff event*. Deference is unwarranted if the price aggregates beliefs about *different questions*.  
     *Epistemic Stakes*: Prices can only warrant deference if traders are betting on the *same outcome*, not semantically divergent ones.

  6. **Reflexivity Mitigation Requirement**  
     *Motivating Case*: Reflexive markets (e.g., prediction markets influencing outcomes).  
     *Requirement*: Must detect when prices create self-fulfilling/self-defeating prophecies. Deference requires establishing that the price is *predictive* (tracking pre-existing reality) not *performative* (creating reality).  
     *Epistemic Stakes*: Reflexive prices conflate prediction with causation, undermining their truth-tracking validity.

  7. **Trader Selection Neutrality Requirement**  
     *Motivating Case*: Selection (hedgers vs. speculators; unknown participant pool).  
     *Requirement*: Must justify deference *without* knowing trader identities or motives. The theory should rely on market *behaviors* (e.g., price discovery dynamics) as proxies for information quality.  
     *Epistemic Stakes*: **Crucially, this excludes expert deference masquerading as market deference.** If you need insider knowledge of participants, it’s not a market signal.

  8. **Outsider-Proxy Feasibility Requirement**  
     *Motivating Case*: Deference without knowing "who is in the pool or why they trade".  
     *Requirement*: Must provide observable heuristics (e.g., volatility decay, volume surges, correlation with related assets) for outsiders to assess price reliability *ex ante*.  
     *Epistemic Stakes*: The theory must function for agents with *no special access* to market microstructure.

  ---

  ### Conflicts and Tensions
  - **Sharpest Conflict**: **Reflexivity Mitigation vs. Outsider-Proxy Feasibility**  
    Detecting reflexivity often requires contextual knowledge (e.g., whether a launch date is price-sensitive). Outsiders lack this, risking deference to self-fulfilling prophecies.  
    *Resolution?*: The theory must identify reflexive contexts via market data alone (e.g., anomalous volatility when news breaks).

  - **Selection Neutrality vs. Liquidity Shock Robustness**  
    Filtering liquidity shocks typically requires knowing who trades (e.g., identifying forced sellers). Outsiders can’t.  
    *Resolution?*: Requires inferring shock likelihood from market dynamics (e.g., abnormal order flow imbalance).

  ---

  ### Which Requirement Excludes Popular Stories?
  **The Reflexivity Mitigation Requirement** excludes the strongest "markets aggregate wisdom" narratives. Most theories (e.g., efficient markets) assume prices are *passive* signals. Reflexivity markets (e.g., currency crises, meme stocks) show prices actively *create* the reality they purport to predict, making deference epistemically hazardous without contextual safeguards.
