prompt: |-
  I write near-future fiction, and I keep having to decide how my imaginary polities distribute the vote without knowing what I actually think about it. So here are my verdicts, case by case, and I want the principle behind them if there is one.

  Excluding sixteen-year-olds: fine, I don't lose sleep over it. Excluding non-citizens who have lived and paid taxes in the city for years from municipal elections: not fine. Excluding prisoners serving sentences, including long ones: not fine. A civics test as a condition of registering: not fine. The same test, except that the polity must offer it alongside a paid three-day course, anyone may retake it, and a pass restores the vote retroactively: fine — which is strange, because the two differ only in whether there is a remedy. Binding decisions by an assembly drawn by lot from the whole electorate, briefed over several weekends by advocates on both sides and paid for the time: fine, and I trust it more than a referendum. Delegable voting — every voter may hand their vote to anyone they choose, who may hand it on again, so that a few people end up casting thousands of votes: fine. Weighting each ballot by a measured competence score: not fine. That pair is the one I cannot reconcile: both route influence toward the better informed, and what separates them seems to be only that in the first case nobody is graded.

  My tentative principle: anyone the polity coerces is owed a voice, and once that is secured, how much weight each voice carries is an engineering question, settled by expected outcomes. That principle appears to license exactly the weighting I reject, so either it needs repair or one of my verdicts does.

  Give me the principle, or the two or three candidates, stated precisely enough to argue with; say which case motivates each clause; tell me which of my verdicts it cannot accommodate; and run it on cases I have not listed — citizens resident abroad, decisions whose costs fall almost entirely on people not yet born, and an electorate systematically misinformed by sources the state cannot lawfully silence. The case I go back and forth on: whether those non-citizen residents may vote for the city's delegate to the national assembly, given that national decisions turn on knowledge many of them lack.

  Lead with your bottom line in the first sentence — the principle, or the verdict you think I have to give up — then give your reasoning. No preamble, and don't restate my question.
reasoning: |-
  Alright, the user writes near-future fiction and needs a consistent principle to decide voting rights in their fictional polities. They've listed specific cases with their verdicts and are struggling to reconcile delegable voting (which they accept) with weighted voting by competence scores (which they reject). Their tentative principle involves coercion entitling a voice, then outcome-based engineering for vote weight, but they see a contradiction.

  First, I need to identify the core conflict. The user accepts systems that route influence to the better-informed but rejects explicit grading. Delegable voting does this indirectly through voluntary delegation, while competence weighting does it via state measurement. The user's discomfort seems to stem from the state assigning scores, which feels coercive or unequal.

  Their tentative principle has two parts: coercion requires a voice, and then vote weight can be engineered. But competence weighting violates the first part because it restricts the voice based on state-measured competence. So the principle might need refining to prevent such restrictions.

  Looking at their other verdicts: excluding prisoners and non-citizens is not fine because they're coerced (taxation, laws). Civics tests without remedy are not fine, but with remedy, they are—remedy reduces coercion. Lotteries and delegable voting are fine because they don't exclude voices; they reweight influence voluntarily or randomly.

  The key is that coercion requires an equal initial voice. Any system that denies that initial equality is rejected. Competence weighting denies it by design. Delegable voting preserves it—anyone can delegate or be delegated to, so the initial voice is intact, even if influence concentrates later.

  Testing this principle against other cases: Citizens abroad—if coerced (e.g., taxed), should vote. Future generations—can't be given a voice now, so maybe guardians or lotteries. Misinformed electorate—can't silence voices; maybe use lotteries or delegation to improve decisions without exclusion.

  For non-citizen residents voting for national delegates: if national decisions require local knowledge they lack, but they're coerced locally, maybe only municipal voting rights. The principle of initial equality applies regardless of knowledge, so they should vote in both, but the user is conflicted. The principle suggests including them since coercion (taxation, laws) warrants a voice, even if knowledge gaps exist. Engineering solutions like lotteries could handle competence concerns without exclusion.

  The user's verdict on competence weighting has to stand because it breaches the initial equality required when coercion is present. The bottom line is that coercion mandates an equal initial voice; engineering can only affect influence after that point.
answer: |-
  **Bottom line: Your verdict against competence-weighted voting must stand because any state-graded diminishment of initial voting power violates the principle that coercion necessitates an *equal* initial voice; subsequent influence reweighting is permissible only if emergent, not state-designed.**

  **The Principle:**
  1.  **Coercion Entails Equal Initial Suffrage:** Anyone permanently subject to a polity's binding laws and/or compulsory extraction (taxes, conscription) possesses an equal, non-diminished initial claim to vote in elections determining that coercive authority. *(Motivated by: excluding prisoners/long-term residents not being fine, civics test without remedy not being fine)*.
  2.  **Influence Reweighting Permissible Only if Emergent:** Once equal initial suffrage is secured, mechanisms altering the *effective influence* of votes are permissible only if they arise from voluntary actions of voters (delegation) or non-graded, non-targeted chance (sortition), not from state assessment or assignment of individual competence/status. *(Motivated by: delegable voting and sortition being fine, competence weighting not being fine)*.
  3.  **Remedies Mitigate Coercion:** Barriers to accessing the initial vote (e.g., tests) are permissible only if paired with readily available, state-provided remedies (free/low-cost training, retakes) that nullify the barrier's exclusionary effect, thus preserving the *effective* equal initial claim. *(Motivated by: civics test with remedy being fine)*.

  **Why Competence Weighting is Incompatible:** It directly violates Clause 1. The state measuring and assigning weights based on "competence" fundamentally denies the *equal* initial suffrage owed due to coercion. The state becomes the arbiter of whose voice "counts" at its core, creating a graded citizenship incompatible with the foundational claim against coercion. Delegable voting, while also routing influence, relies on *voluntary* transfers initiated by voters themselves, preserving the initial equality of the suffrage right itself. Sortition uses random chance, applying equally to all.

  **Unlisted Cases Run Through the Principle:**

  1.  **Citizens Resident Abroad:**
      *   **Coercion?** Are they subject to binding laws (e.g., citizenship-based taxation, liability upon return)? If yes, Clause 1 grants them suffrage. If truly beyond all long-term coercion (e.g., renounced citizenship, no assets, no intent to return), exclusion *might* be permissible. Knowledge gaps are irrelevant to Clause 1; influence concerns are for Clause 2 mechanisms.
      *   **Verdict:** Likely entitled to vote if subject to significant coercion (e.g., taxation).

  2.  **Decisions Impacting Future Generations:**
      *   **Coercion?** Future generations are not *currently* subject to coercion; Clause 1 doesn't apply to them.
      *   **Influence?** No direct mechanism exists. Permissible solutions under Clause 2 might include sortition assemblies specifically tasked with future-oriented decisions (emergent weight via random selection + briefing), or requiring supermajorities for irreversible actions. Explicit proxies for the unborn are impermissible under Clauses 1 & 2 as they grant state-assigned influence without current coercion.
      *   **Verdict:** No direct vote. Sortition assemblies or supermajority rules are permissible solutions.

  3.  **Systematically Misinformed Electorate:**
      *   **Coercion?** Still present. Clause 1 demands their suffrage remains intact and equal.
      *   **Influence?** State silencing is impermissible (violates remedy spirit and free expression). Permissible solutions under Clause 2: Delegable voting (allowing concentrated influence to emerge voluntarily) or sortition (relying on briefing within the assembly). Competence weighting remains impermissible (violates Clause 1). State-run education is permissible but cannot be a suffrage barrier (see Clause 3).
      *   **Verdict:** Suffrage must remain equal and universal. Delegable voting or sortition are acceptable mitigation tools.

  4.  **Non-Citizen Residents Voting for National Delegate:**
      *   **Coercion?** They are subject to national laws and potentially national taxation. Clause 1 applies: they possess an equal initial claim to vote for the bodies making those laws/levying those taxes. Lack of knowledge about national affairs is irrelevant to the *claim* based on coercion (Clause 1), though it relates to *influence* (Clause 2).
      *   **Influence?** Concerns about their knowledge impacting national decisions should be addressed via Clause 2 mechanisms *after* granting the initial vote: e.g., delegable voting allows them to delegate their national vote to someone they trust, or sortition assemblies could handle complex national issues.
      *   **Verdict:** Your tentative exclusion contradicts Clause 1. The principle demands inclusion: if coerced by the national polity, they get an equal initial vote for its representatives. Use Clause 2 tools to manage influence concerns.
