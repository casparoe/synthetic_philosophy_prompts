prompt: |-
  I work in security studies, and I keep running into a configuration that I do not have a word for. Before I coin one for a chapter I am writing, I would like to know whether there is an established concept for it, and I would rather have the carving than the label.

  The instance that made the shape obvious to me is the dark forest setting from Liu Cixin's fiction: the sky looks empty because every civilization stays quiet, and every civilization stays quiet because it believes the sky is dangerous. If the belief is true, we should expect silence. If the belief is false but universally held, we should also expect silence. And the one observation that would separate the two — something announcing itself, or something being destroyed for having announced itself — is precisely what nobody can afford to produce. Announcing yourself is costly only if the hypothesis is true, and that is exactly the case you were trying to rule out. So the claim is not vague or gerrymandered about what would refute it; it is perfectly definite. It is just that refutation requires performing the single act it identifies as fatal.

  I see the same shape elsewhere. Two states keep an expensive mobilized posture; the resulting peace is evidence both that deterrence worked and that there was never anything to deter, and the only test — unilateral stand-down — is cheap if the other side is benign and catastrophic if it is not. And I have been toying with a nastier variant, which I have been calling the planted-forest variant: some agents benefit from others holding the fearful belief, so they manufacture or amplify the signs of danger — decoys, rumours, conspicuous strikes against third parties. If that is possible, the belief can be stable, self-sealing, and false all at once, and every apparent confirmation of it is itself the product of agents with an interest in confirming it.

  What I want to know is whether this has a name and, more importantly, what exactly the phenomenon is and where its edges are. I do not want a bibliography or a literature survey. Specifically:

  Is there an established concept for a hypothesis that is unfalsifiable not through vagueness but through its own actionable content — a claim whose only possible test is the act it forbids, held by agents who each know this?

  If yes, what are the nearest neighbours, and how does each of them differ from what I have described? I can think of several candidates I would want separated out: the ordinary self-fulfilling prophecy, where the belief brings about its own truth; the self-defeating or self-effacing prediction, where acting on the belief prevents the predicted outcome; equilibria in which players' beliefs are correct along the path of play but unconstrained off it; precautionary measures whose success cannot be tested because the measures cannot be removed; and selection effects in which the relevant data is missing for observer-relative rather than agent-relative reasons. If one of these is simply what I am describing, say so, and then tell me what is gained or lost by describing it in my terms rather than in the formalism.

  If nothing established fits, coin a term and give me something I can actually use: a definition, the minimal set of conditions that jointly produce the effect, at least two cases that look like instances but are not, and — since the whole point of the phenomenon is that the obvious ways of checking for it are themselves compromised — some account of what a non-question-begging test for it would look like.
reasoning: |-
  We are dealing with a hypothesis that is unfalsifiable because the only test that could refute it is an act that the hypothesis itself forbids (due to the potential catastrophic cost if the hypothesis is true). This creates a situation where the belief in the hypothesis is self-sealing: the very action that would test it is too dangerous to perform, so the belief persists.

  The phenomenon is distinct from several related concepts:

  1. **Self-fulfilling prophecy**: This occurs when a belief leads to actions that cause the belief to become true. Example: A bank run occurs because people believe the bank is insolvent, and their withdrawal of funds causes the insolvency. In our case, the belief does not cause the danger to exist; rather, the belief prevents the test that could reveal the absence of danger.

  2. **Self-defeating prophecy**: This is when the prediction of an outcome leads to actions that prevent that outcome. Example: A forecast of a shortage leads to increased production, which averts the shortage. In our case, the belief does not avert the danger; it prevents us from knowing whether the danger exists.

  3. **Equilibrium with off-path beliefs**: In game theory, an equilibrium might require that players hold certain beliefs about off-path actions (actions not taken in equilibrium). The beliefs are not tested because the off-path actions are not taken. This is similar in that the belief is not tested, but the reason is that the test (the off-path action) is not taken. However, the motivation for not taking the off-path action is strategic (it is not optimal given the beliefs) and might be due to the potential cost. Our phenomenon is a special case where the off-path action is the test and the cost of taking it is catastrophic if the hypothesis is true.

  4. **Precautionary principle and untestable measures**: When we take precautions (e.g., wearing a seatbelt) and the event (a crash) does not occur, we cannot know if the precaution worked or if the event was never going to occur. However, in our case, the precaution is not directly the issue. The issue is that the belief in the danger prevents the test (removing the precaution) because the test is too risky. This is very close to our phenomenon, but note that in the precautionary case, we might be able to run controlled experiments (e.g., crash tests) that do not require risking an actual catastrophe. In the dark forest scenario, there is no safe way to test.

  5. **Selection effects (e.g., survivorship bias)**: In our case, the silence in the dark forest is a result of the selection: civilizations that announce themselves are destroyed, so we only observe the silent ones. This is a selection effect. However, the problem is that the selection effect is not just an observational issue; it is also a strategic one: agents are choosing to be silent because they fear destruction. So the phenomenon combines strategic behavior with a selection effect.

  Given the above, the phenomenon is a combination of:

  - A hypothesis that predicts catastrophic consequences if a certain action is taken.
  - The action in question is the only way to test the hypothesis.
  - The agents are rational and risk-averse enough to avoid taking the action because of the potential catastrophic cost.

  This makes the hypothesis unfalsifiable in practice because the test is too dangerous to perform.

  Now, is there an established concept for this?

  I believe the closest established concept is the **self-sealing belief** or **self-sealing argument**. However, in philosophy, a self-sealing argument is one that is immune to counterevidence by reinterpreting or dismissing any counterevidence. That is different because in our case, there is no counterevidence because no test is performed.

  In game theory and decision theory, this is related to the concept of **unobservable actions** or **unverifiable states** in the context of information asymmetry and strategic interaction. Specifically, it resembles the concept of **no-win scenarios** in which any action that would provide information is too risky.

  But I think the most precise fit is with the concept of **Pascal's Wager**-type reasoning. Pascal's Wager argues that one should believe in God because if God exists, the payoff for belief is infinite, and if not, the loss is finite. Similarly, in our case, the cost of testing (announcing oneself) is potentially infinite (destruction) if the hypothesis is true, and the benefit of testing (learning the truth) is finite. So rational agents do not test.

  However, Pascal's Wager is about belief formation, not about the unfalsifiability of a hypothesis per se.

  Another related concept is the **precautionary principle** taken to an extreme, but again, that is a normative principle for decision-making under uncertainty.

  Given that, I do not recall a single established term that captures exactly this phenomenon. Therefore, I will coin a term and define it.

  **Term:** **Self-Forbidding Hypothesis** or **Self-Prohibiting Hypothesis**

  **Definition:** A hypothesis H is self-forbidding if the only test that could potentially falsify H is an action A that, according to H, would result in catastrophic costs. Rational agents, aware of this, will never perform A, thereby making H unfalsifiable in practice.

  **Minimal conditions:**

  1. There exists a hypothesis H that predicts that performing a specific action A would lead to a catastrophic outcome C.
  2. The action A is the only possible way to test H (i.e., to observe whether H is true or false).
  3. The potential cost of C is so high that rational agents (with a reasonable degree of risk aversion) will never choose to perform A.
  4. The agents are aware of conditions 1-3.

  **Cases that look like instances but are not:**

  1. **The boy who cried wolf**: The villagers stop believing the boy, so when the wolf really comes, they don't come to help. This is a self-defeating prophecy (the false alarms lead to the failure when the real alarm occurs). It is not self-forbidding because the test (responding to the alarm) is not catastrophic in the false alarm case (it's just inconvenient), and the villagers do test the hypothesis (by responding) until they learn the boy is lying.

  2. **The precautionary principle in the context of a known risk**: Suppose we don't build nuclear power plants because we fear a meltdown. We can test the safety of nuclear power through experiments and simulations without actually causing a meltdown. This is testable without catastrophe. In our dark forest scenario, there is no safe test.

  **Non-question-begging test for a self-forbidding hypothesis:**

  The challenge is that by definition, the test A is forbidden. However, we might look for:

  1. **Natural experiments**: Cases where A was performed by accident or by an irrational agent. For example, in the dark forest, if we observe a civilization that did announce itself and was destroyed, that confirms H. But if we observe one that announced itself and was not destroyed, that refutes H. However, if H is true and the civilization was destroyed, we might not observe it because it was destroyed. And if H is false, we might observe the civilization. This is a selection effect: we only observe the cases that survived, which are the ones that did not announce themselves. So we cannot observe the outcome of A.

  2. **Indirect tests**: Look for evidence that does not require performing A. For example, in the dark forest, we might look for signs of past destructions or for agents that might be manufacturing threats (the planted forest). But note that these signs might be faked or might not exist even if H is true.

  3. **Statistical tests**: If we have multiple independent agents, and we observe that none of them perform A, we might infer that they all believe H. But that does not tell us if H is true.

  4. **Testing the mechanisms**: Instead of testing H directly, test the mechanisms that H posits. For example, in the dark forest, we might try to detect stealthy attacks on other civilizations without revealing ourselves. But if H is true, such detection might be impossible because the attacks are stealthy.

  Thus, a non-question-begging test is inherently difficult. One possibility is to find a context where the catastrophic cost is mitigated. For example, in international relations, a state might temporarily and partially stand down in a way that is reversible and defensible, so that if the other side attacks, the damage is limited. This is a controlled test. But note: if the hypothesis H is true, even a partial stand-down might be catastrophic.

  Another approach is to use deception: create a decoy that announces itself and see what happens. But if the adversary can distinguish decoys, this might not work. Also, if the adversary is watching, they might interpret the decoy as a test and punish it to maintain the belief.

  Given the above, the self-forbidding hypothesis is a robust and challenging phenomenon. In your writing, you might use the term and define it as above, and then relate it to the existing concepts to clarify the boundaries.
answer: |-
  ### Analysis of the Phenomenon
  You've described a specific epistemic and strategic configuration where a hypothesis is *practically unfalsifiable* because the only test capable of refuting it is an action that, if the hypothesis is true, would incur catastrophic costs. Agents rationally avoid this action, making the hypothesis self-sealing. This is distinct from common concepts like self-fulfilling prophecies or precautionary principles, as it hinges on the **interplay of rational choice, catastrophic risk, and the test's identity with the forbidden act**. Below, I address your query step by step.

  #### Step 1: Is there an established concept?
  **No single term fully captures this phenomenon.** While related ideas exist in game theory, epistemology, and security studies, none precisely match your description. The closest terms are "self-sealing belief" or "unfalsifiable equilibrium," but these are often used loosely and lack the specificity of your configuration. I'll clarify why existing concepts fall short before proposing a new term.

  #### Step 2: Differentiating from nearest neighbors
  Your phenomenon is a hybrid of strategic interaction and epistemic constraints. Here's how it differs from common candidates:

  1. **Self-fulfilling prophecy (e.g., bank runs)**:  
     - **Difference**: In a self-fulfilling prophecy, the belief *causes* the outcome (e.g., believing a bank will fail triggers withdrawals that make it fail). In your case, the belief *prevents testing* but does not necessarily cause the danger. For example, silence in the dark forest doesn't create the danger; it merely perpetuates ignorance about whether the danger exists.  
     - **Gain/loss**: Describing yours as a self-fulfilling prophecy loses the key point: the test is *forbidden due to risk*, not generative of the outcome.

  2. **Self-defeating prediction (e.g., warning of a shortage averts it)**:  
     - **Difference**: Here, acting on the belief *prevents* the predicted outcome. Your phenomenon involves no prevention—instead, inaction (due to fear) sustains uncertainty. The dangerous outcome (e.g., annihilation) remains possible but unverified.  
     - **Gain/loss**: Framing yours as self-defeating ignores the role of catastrophic risk and the test's infeasibility.

  3. **Off-equilibrium beliefs in game theory (e.g., Nash equilibrium)**:  
     - **Difference**: In game theory, beliefs are "correct on the path" but untested off-path because agents avoid deviations. Your phenomenon adds a layer: the off-path action (e.g., unilateral stand-down) is the *only test*, and attempting it risks annihilation. Standard equilibrium concepts don't emphasize the epistemic black hole created by the test's danger.  
     - **Gain/loss**: Game theory captures strategic incentives but not the *epistemic closure*—yours highlights why agents cannot learn the truth.

  4. **Precautionary principle (e.g., irreversible safeguards)**:  
     - **Difference**: Precautionary measures (e.g., seatbelts) are untestable because removing them risks harm, but they don't forbid the *only test* of a hypothesis. In your case, the action *is* the test (e.g., announcing yourself tests the dark forest hypothesis). Precaution focuses on risk aversion, not hypothesis falsification.  
     - **Gain/loss**: Precautionary thinking shares risk aversion but misses the loop where the test and forbidden act are identical.

  5. **Selection effects (e.g., survivorship bias)**:  
     - **Difference**: Selection effects explain missing data (e.g., only quiet civilizations survive, so we see no evidence of danger). Your phenomenon includes selection (e.g., destroyed civilizations aren't observed) but centers on *rational agents* who *knowingly avoid* the test due to perceived risk. It's strategic, not just observational.  
     - **Gain/loss**: Selection effects describe the outcome, but your configuration explains *why* agents enforce this selection.

  **Conclusion**: Your phenomenon is a distinct blend of:  
  - **Catastrophic test requirement**: The only falsifying action risks disaster if the hypothesis holds.  
  - **Strategic inaction**: Agents rationally avoid the test, sealing the hypothesis.  
  - **Epistemic trap**: Belief persists because refutation is too dangerous to attempt.  

  It is best seen as a **strategic-epistemic equilibrium** where belief and behavior co-stabilize through the infeasibility of testing.

  #### Step 3: Coining a term and definition
  Since no established term fits, I propose:  
  **Catastrophic Falsification Dilemma (CFD)**  

  **Definition**:  
  A hypothesis \(H\) is in a *catastrophic falsification dilemma* if:  
  1. \(H\) predicts that performing a specific action \(A\) will cause a catastrophic outcome \(C\).  
  2. \(A\) is the only possible test to falsify \(H\).  
  3. Rational agents, aware of (1) and (2), will never perform \(A\) due to the risk of \(C\).  
  4. As a result, \(H\) becomes practically unfalsifiable, and belief in \(H\) persists regardless of its truth.  

  **Minimal conditions for CFD**:  
  - **Catastrophic risk**: \(C\) is sufficiently severe to deter \(A\) (e.g., existential threat).  
  - **Test-action identity**: \(A\) is both the test and the forbidden act under \(H\).  
  - **Rational avoidance**: Agents know that \(A\) could falsify \(H\) but choose inaction to avoid \(C\).  
  - **Belief stability**: No alternative tests exist, making \(H\) resistant to disconfirmation.  

  **Planted-forest variant**: This is a subtype of CFD where third-party actors (e.g., manipulators) fabricate evidence to sustain belief in \(H\), exploiting the dilemma. It adds:  
  - **Strategic deception**: Agents benefit from others believing \(H\) and amplify perceived threats to prevent \(A\).  

  #### Step 4: Cases that resemble CFD but are not
  To clarify boundaries, here are near-misses:  
  1. **The Boy Who Cried Wolf (false alarms)**:  
     - **Why not CFD?**: Testing the hypothesis (responding to alarms) is not catastrophic—it’s merely costly. When villagers stop responding, the wolf’s attack falsifies their complacency. In CFD, the test (e.g., stand-down) risks annihilation, preventing any learning.  

  2. **Pascal’s Wager (infinite stakes)**:  
     - **Why not CFD?**: Pascal’s Wager argues for belief in God due to infinite rewards/risks, but it lacks a *test*. There is no action to falsify God’s existence that risks damnation (praying or not praying doesn’t test the hypothesis). CFD requires a concrete action that could falsify \(H\) but is too dangerous to attempt.  

  #### Step 5: Non-question-begging tests for CFD
  Since the dilemma makes direct testing impossible, evidence must come from indirect sources. A valid test must:  
  - **Avoid performing \(A\)**: It cannot require the forbidden action.  
  - **Exploit exogenous variations**: Leverage external events or unintentional acts.  
  - **Detect manipulators in planted-forest variants**: Identify agents fabricating threats.  

  **Concrete approaches**:  
  1. **Natural experiments**: Observe cases where \(A\) occurs accidentally.  
     - *Example*: In security studies, a state’s temporary stand-down due to internal chaos (not strategy) could reveal if adversaries exploit it. If no attack occurs, it weakens \(H\); if an attack occurs, it confirms \(H\).  
     - *Limitation*: Accidents are rare and context-specific, making generalization hard.  

  2. **Decoy or proxy tests**: Use controlled substitutes for \(A\).  
     - *Example*: In the dark forest, deploy an unmanned probe to "announce" itself. If destroyed, \(H\) gains evidence; if ignored, \(H\) is weakened.  
     - *Limitation*: Manipulators (e.g., in planted forests) might ignore decoys to preserve belief, yielding false negatives.  

  3. **Forensic analysis of threat fabrication**: For planted forests, audit anomalies in threat evidence.  
     - *Example*: In security studies, analyze if "threats" (e.g., cyberattacks) show patterns of staging (e.g., low sophistication, traceable to beneficiaries).  
     - *Limitation*: Requires access to data that manipulators may hide.  

  4. **Cross-context comparison**: Contrast cases where \(H\) is likely/unlikely.  
     - *Example*: Compare militarized borders (e.g., Koreas) with historically demilitarized ones (e.g., US-Canada). If peace persists without mobilization in low-risk contexts, it challenges \(H\).  
     - *Limitation*: Contextual differences (e.g., history of conflict) may confound results.  

  **Validity criterion**: A test is non-question-begging if it does not assume \(H\) is true/false and exploits data orthogonal to the dilemma (e.g., third-party actions or natural events).  

  ### Summary
  - **Term**: **Catastrophic Falsification Dilemma (CFD)**.  
  - **Core**: A hypothesis that is unfalsifiable because its only test is catastrophically risky, leading to rational inaction and stable belief.  
  - **Use in your chapter**: Introduce CFD as a strategic-epistemic trap, contrasting it with self-fulfilling prophecies and selection effects. Use the dark forest and deterrence as primary examples, and the planted forest for manipulated variants.  
  - **Strength**: CFD isolates the unique tension between testability and survivability, making it valuable for security studies where catastrophic risks dominate (e.g., nuclear deterrence, AI alignment).  

  This framework should provide conceptual clarity while avoiding the pitfalls of existing terms. If you need refinements or additional cases, I can expand further.
