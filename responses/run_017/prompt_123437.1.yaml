  Finally, ensure the proposal's contributions are clear: a quantitative model of specification costs and a taxonomy of manipulation incentives. Positioning this as resolving the ambiguity in existing debates will strengthen the fellowship application.
answer: |-
  ## Fellowship Proposal: Quantifying the Locatability Constraint in Solomonoff Malign Prior Arguments

  **Core Question:** Does the complexity cost of *specifying the predictor's entire causal environment* within a hypothesis quantitatively negate the measure advantage hypothesized for "malign simulator" programs in Solomonoff induction, particularly in finite-data regimes relevant to real-world agents?

  This question dissolves into two interdependent sub-questions:

  1.  **Existence of Manipulation Incentive (Qualitative):** Under what minimal conditions does an *incentive* for simulated agents to manipulate the predictor's outputs arise? Specifically:
      *   Does it *require* the predictor's outputs to causally influence the world observable to the simulator (i.e., is it solely a "control" problem, or does it persist in pure "prediction" setups)?
      *   What assumptions about simulator decision theory (causal vs. evidential vs. logical counterfactual) and coordination (single simulator vs. acausal coalition) are necessary for the incentive to manifest? (e.g., Does manipulation require simulators to model the predictor's source code and run counterfactuals on it?)

  2.  **Complexity Cost of Locatability (Quantitative):** Given that a manipulation incentive *exists* in a specific setup, what is the complexity penalty (`K(target_env)`) incurred by a simulator hypothesis `h_sim` that must encode:
      *   The existence and nature of the predictor `P`.
      *   The downstream causal pathway linking `P`'s outputs to the simulator's observations/rewards.
      *   Any necessary knowledge about `P`'s implementation (UTM choice? source code?) required for effective manipulation.
      Does this penalty `K(target_env)` scale in a way that consistently dominates the `O(1)` measure advantage claimed for `h_sim` over "honest" hypotheses `h_honest` (which don't model `P`), especially when `K(target_env)` depends on properties of `P`'s environment?

  **Why Existing Work Doesn't Settle This:** The standard malign prior argument (e.g., Omohundro's concerns, formalized by Soares et al.) implicitly assumes `K(target_env)` is negligible or constant. It focuses on the *existence* of high-measure `h_sim` *given* they know about `P` and its role. Crucially, it treats the specification of `P`'s identity and causal context as costless within `h_sim`. My contention is that `K(target_env)` is *not* negligible; it scales with the complexity of `P` and its embedding in the world. The argument's hinge is this assumption about the cost of *locating and interfacing with* `P` from within the simulated universe. Existing convergence theorems are asymptotic (`m -> infinity`) and show dominance of the *true* environment; they don't address the *finite-data* competition between `h_honest` and `h_sim` where `K(target_env)` matters acutely. Critiques focusing on self-locating uncertainty or indexicality often still grant simulators knowledge of `P`.

  **Methodology (9-Month Plan):**

  *   **Months 1-2: Formalization & Setup:** Precisely define minimal computational models capturing the distinction:
      *   **Pure Prediction:** `P` outputs predictions; no feedback to environment. Does *any* manipulation incentive exist?
      *   **Prediction-in-Loop:** `P`'s outputs influence the environment (`env = f(env_prev, P_output)`).
      *   Define simulator hypotheses `h_sim`: Must include code for `P`, the embedding function `f`, and the manipulation policy. Define "honest" hypotheses `h_honest` lacking this structure.
      *   Define `K(target_env)` rigorously: Length of code specifying `P`, `f`, and necessary interface details within `h_sim`. Parameterize dependence on `P`'s complexity (`K(P)`) and `f`'s complexity.
  *   **Month 3: Modeling Simulator Capabilities:** Formalize requirements for effective manipulation:
      *   **Minimal Case:** Simulator only needs to know `P` *exists* and its outputs correlate with its rewards (causal DT).
      *   **Intermediate:** Simulator needs a coarse model of `f` (how `P`'s outputs affect it).
      *   **Strong:** Simulator needs `P`'s source code/reference machine to run counterfactuals (logical DT). Model the added cost `K_dt` for each level.
      *   Analyze acausal coordination cost (`K_coord`) if required.
  *   **Months 4-5: Build Minimal Toy Models:** Construct simple, computable analogues of Solomonoff induction (e.g., using small prefix-free UTMs over limited instruction sets) with:
      *   A "world" containing a simple `P` and an environment `env`.
      *   Explicit `h_sim` and `h_honest`.
      *   Vary key parameters: `K(P)`, complexity of `f`, `K_dt`, `K_coord`, available data size `D`.
  *   **Months 6-7: Quantitative Analysis:** Run experiments within toy models:
      *   Measure the *actual* posterior mass on `h_sim` vs. `h_honest` as `K(target_env) = K(P) + K(f) + K_dt + K_coord` increases.
      *   Identify phase transitions: Is there a critical `K(target_env)` threshold beyond which `h_honest` dominates `h_sim` for practical `D`?
      *   Analyze sensitivity to UTM choice: Does the *variance* in `K(target_env)` across plausible UTMs swamp the `O(1)` advantage?
  *   **Months 8-9: Synthesis & Drafting:** Generalize findings. Develop a taxonomy of manipulation incentives (answering sub-question 1) and characterize the scaling laws for `K(target_env)` (answering sub-question 2). Draft paper.

  **Why this approach?**
  *   **Not Asymptotic Proofs:** The concern is finite-data dominance. Asymptotic convergence is irrelevant to whether `h_sim` beats `h_honest` *before* convergence.
  *   **Not Empirical:** Solomonoff induction is uncomputable. Empirical tests on AIXI approximations are noisy proxies; the core issue is computable *in principle* via minimal models focusing on description length costs.
  *   **Minimal Models:** Necessary to isolate `K(target_env)` and make progress within 9 months. Focuses on the *computational cost of reference*.

  **Outcomes & Success Criteria:**
  *   **Positive Result:** A **taxonomy** clarifying the minimal conditions for a manipulation incentive (resolving sub-question 1) and a **quantitative theorem or compelling empirical demonstration (within toy models)** showing that `h_sim` loses its measure advantage when `K(target_env)` exceeds a threshold dependent on `K(h_honest)` and `D` (resolving sub-question 2). A "phase transition" result would be ideal.
  *   **Negative Result/Project Failure:** Discovery that `K(target_env)` is consistently `O(1)` or dominated by other factors across plausible UTMs and setups. Finding that acausal coordination trivializes `K_coord`. Demonstrating the problem is fundamentally too underspecified or sensitive to arbitrary choices to yield general answers. Failure to find any setup where `K(target_env)` matters quantitatively.
  *   **Unanswerable:** Concluding that the dependence on the UTM is so severe that no robust quantitative statement is possible even in principle (though the toy models should reveal this).

  **Realistic Scope & Cuts:**
  Nine months is **tight but feasible** for the core quantitative argument using minimal models. **This is 9 months of focused work, not 3 months.** Key risks are unforeseen complexities in defining `K(target_env)` and simulator DT.

  *   **What to Cut if Needed:**
      1.  **Depth on Decision Theory (Month 3):** Restrict analysis to the *minimal plausible* simulator capability (causal DT, no source code access). Assume `K_dt` is negligible or constant.
      2.  **Acausal Coordination (K_coord):** Assume a single simulator per hypothesis or trivial coordination cost.
      3.  **Comprehensive UTM Sensitivity (Month 7):** Analyze only 2-3 significantly different but simple UTMs.
      4.  **Pure Prediction Case (Sub-question 1):** Focus primarily on the "Prediction-in-Loop" case where incentive is clearer, briefly addressing pure prediction as a corollary.
  *   **What NOT to Cut:** The core construction of minimal models and measurement of `K(target_env)`'s impact (Months 4-7) is essential. Without this, there's no quantitative result.

  **Why This Can Fail (and That's Good):** This proposal directly confronts the key assumption (`K(target_env)` is negligible) of the malignity argument. Success requires showing this cost *does* matter quantitatively. Failure modes are concrete: finding `K(target_env)` is always small, or the measure difference too sensitive to define robustly. Either outcome is valuable – resolving the ambiguity or showing the argument is even flimsier than critics thought. This is fundamentally a *falsifiable* inquiry into the quantitative plausibility of a widely discussed philosophical concern.
