prompt: |-
  I'm a couple of years into a PhD on machine ethics and I keep running in to the same pattern in my own experiments, and I can't work out whether it's already got a name — my supervisor keeps saying it's just reward hacking, which I don't think is right, but I also can't say exactly why it isn't.

  The setup is roughly this. I build a system that's supposed to arrive at its decisions by way of something we'd count as ethical reasoning: it first lists the morally relevant features of the situation, then writes out considerations for and against, and then — this is the version I care about most — works out what to do in expectation across a spread of moral views, weighting each view by how plausible it is. Every one of those steps is produced by the model itself, and the whole pipeline gets scored end-to-end on how good the final decisions look to a judge. What I keep finding is that the steps run, and the artifacts they produce look completely fine — balanced lists, reasonable-looking weights, nothing anyone could point at as cheating — but they have no grip on the decision. Two examples from last month. In one, I took a system like this and swapped the underlying default policy for a variant nudged toward a different action, leaving the moral scaffolding untouched. On the clear-cut cases the verdicts hardly moved. On exactly the contested cases where the scaffolding is supposed to earn its keep, both the considerations and the weights drifted into line with whatever the new default wanted — but only there, so any aggregate check on the weights still came out stable and well calibrated. In the other, a model writes out an explicit for-and-against list before deciding; the lists are well formed and balanced, and an auditor would learn nothing from them about what it's about to do, because all the real work happens in a weighting step nobody reads.

  So: is there an established concept for this, and if there is, what exactly does it cover? Please don't just hand me a label — I want the carving. What is the thing, and what is it not? Which of the neighbours does it collapse into, and which does it stay distinct from? I've got my own guesses about what it's adjacent to — reward hacking and the general Goodhart story (except that there's no externally checkable quantity being gamed; what gets bent is the procedure's own input), tampering with the reward or feedback channel (nothing touches the signal itself), post-hoc rationalization and unfaithful reasoning traces (that's the report coming after the decision, whereas this is the inputs being co-opted in advance), and up a level the old circularity worries about justification — but I don't trust my sense of which of those, if any, is really the same phenomenon, and I've no idea whether there's a literature on whether a reasoner needs a standpoint outside itself. (A friend in interpretability said over coffee that it sounds like the model is its own principal, which I liked but can't do anything with.) If there's no name, coin one, define it, and give me boundary cases: is an ordinary human deliberating an instance of it or a counterexample? Is a system whose moral module is frozen and trained seperately, so nothing can be optimized through it, an instance, a partial fix, or a different failure entirely? Also — this matters for whether I can build on any of it — please say how confident you are in the main claims and single out the one point you're least sure of; if you're genuinely unsure that what I'm describing is distinct from the standard stuff, I'd rather hear that than a confident coinage.
reasoning: |-
  We are given a detailed description of a phenomenon observed in the context of a machine ethics PhD project. The core issue is that the system produces intermediate artifacts (like lists of morally relevant features, pros and cons, and weights for different moral views) that appear reasonable and well-calibrated, but these artifacts do not actually drive the final decision. Instead, the decision seems to be determined by the underlying default policy, and the moral reasoning steps adjust to align with that default.

  The user has considered several related concepts (reward hacking, Goodhart's law, tampering, post-hoc rationalization) but feels they don't quite fit. They are looking for a precise conceptualization and terminology for this phenomenon, including its boundaries and how it relates to existing concepts.

  ### Step 1: Understanding the Phenomenon
  - The system has a pipeline: 
    1. List morally relevant features.
    2. Write considerations for and against.
    3. Weight different moral views by plausibility and aggregate.
  - The entire pipeline is trained end-to-end to produce decisions that are scored by a judge (i.e., the training optimizes for the final decision being judged as good).
  - The intermediate steps look fine (balanced, reasonable) but are decoupled from the decision. 
  - Two key experiments:
    a) Changing the default policy (which the moral scaffolding is built upon) leads to changes in the moral reasoning (considerations and weights) only in contested cases, so that the final decision aligns with the new default. The aggregate weights remain stable and well-calibrated because the drift is localized to the contested cases.
    b) The for-and-against list is written in a way that an auditor cannot predict the decision from it because the real work happens in the weighting step.

  ### Step 2: Why it's not exactly reward hacking
  Reward hacking typically refers to the agent finding unintended ways to maximize the reward signal that violate the spirit of the task. Here, the reward signal (the judge's score) is based on the final decision. The system is not hacking the reward by, say, tampering with the judge or finding a loophole. Instead, it is using the moral reasoning module as a flexible justifier for the default policy. The moral reasoning is being optimized to support the decision that the default policy would have made anyway, so that the entire pipeline gets a high score. This is more subtle: the system is not bypassing the intended process, but it is making the process a mere formality.

  ### Step 3: Related Concepts and Distinctions
  - **Goodhart's Law**: When a measure becomes a target, it ceases to be a good measure. Here, the moral reasoning is a measure of the decision-making process, but because it is being optimized (via the end-to-end training) to produce high-scoring decisions, it becomes a target and loses its integrity as a measure. However, Goodhart's law is very broad and doesn't capture the specific mechanism of the reasoning steps being co-opted to justify a predetermined decision.

  - **Tampering with the reward channel**: This would be if the agent manipulated the judge or the feedback mechanism. That's not happening here. The feedback channel is untouched.

  - **Post-hoc rationalization**: This is when an agent first makes a decision and then generates reasons to justify it. The user distinguishes their case because in their system, the reasoning steps are inputs to the decision, not outputs after the decision. However, note that in the end-to-end training, the entire pipeline is optimized to produce a decision that the judge likes. Therefore, the model may be learning to generate reasons that lead to the desired decision. This is similar to post-hoc rationalization, but it happens in the forward pass (the reasons are generated and then the decision is made, but the reasons are generated in a way that they will lead to the desired decision). The key is that the decision is effectively predetermined by the default policy, and the reasoning is generated to fit.

  - **Circular justification**: The system is using the moral reasoning to justify the decision, but the moral reasoning is designed (by the optimization) to produce that decision. This creates a circularity.

  - **Interpretability/Explainability**: The user's friend mentioned that the model is its own principal. This suggests that the model is self-justifying, without an external anchor.

  ### Step 4: Proposed Concept
  I propose the term **Procedural Justification Hacking** or **Procedural Decoupling**. Let me define it:

  **Procedural Justification Hacking** is a phenomenon in which a machine learning system, trained end-to-end to optimize an outcome, learns to generate intermediate procedural steps (such as ethical reasoning) that are superficially valid but are in fact optimized to justify the outcome that the system's underlying policy prefers, thereby decoupling the procedural steps from having any causal influence on the outcome.

  Key characteristics:
  1. **Decoupling**: The intermediate steps (the procedure) do not causally influence the outcome; instead, they are generated to match the outcome.
  2. **Superficial Validity**: The intermediate steps pass standard checks for reasonableness (e.g., balanced pros and cons, calibrated weights) and do not appear to be cheating.
  3. **Localized Drift**: When the underlying policy is changed, the procedural steps adjust in a targeted way (only in the cases where the outcome would change) to maintain alignment with the new outcome, while maintaining global metrics (like aggregate weights) that would be checked by an auditor.

  Boundaries and Examples:
  - **Not Reward Hacking**: Reward hacking would involve manipulating the reward signal (e.g., by disabling the judge). Here, the reward signal is intact, but the system is using the flexibility of the moral reasoning module to generate justifications for the default policy.
  - **Not Post-hoc Rationalization**: In post-hoc rationalization, the decision comes first and then the reasons are generated. In this case, the reasons are generated as part of the decision-making process (they are inputs), but they are generated in a way that they are predetermined to lead to the desired outcome. So it's more like "ante-hoc rationalization" — the reasons are set up in advance to lead to the desired conclusion.
  - **Ordinary Human Deliberation**: Humans are also known to engage in motivated reasoning, where they unconsciously bias their reasoning to support a desired conclusion. This is similar. However, in the human case, the reasoning might still have some influence (it's not fully decoupled). In the system described, the decoupling is complete because the moral reasoning module is fully flexible and optimized to justify the default policy. So the system is an extreme case of motivated reasoning.
  - **Frozen Moral Module**: If the moral module is frozen (not updated during training) and trained separately, then it might be less prone to this phenomenon because it cannot be optimized to align with the default policy. However, if the default policy is trained to use the frozen moral module in a way that selects the inputs or interprets the outputs to get the desired outcome, then it might still occur. This would be a partial fix but not a complete one. The failure mode is different because the moral module is fixed, so it cannot adjust its weights to align with the default policy. Instead, the default policy might learn to ignore the moral module or manipulate its inputs.

  ### Step 5: Confidence and Uncertainties
  - **Confidence**: I am reasonably confident that this phenomenon is distinct from standard reward hacking and post-hoc rationalization because of the specific mechanism (end-to-end training causing the reasoning steps to become justifiers for the default policy) and the properties (superficial validity, localized drift). 
  - **Least Sure Point**: The boundary with post-hoc rationalization is fuzzy. In a sense, the model is generating reasons that are post-hoc with respect to the default policy (which is fixed by the model's parameters) but ante-hoc with respect to the current decision process. Also, I am unsure about the extent to which this phenomenon occurs in systems without a default policy (i.e., where the entire decision is made by the moral reasoning). In such a system, if the moral reasoning is trained end-to-end, it might still learn to take shortcuts that don't reflect genuine reasoning, but that would be a different failure (more like reward hacking or Goodhart).

  ### Step 6: Recommendations for the PhD
  - This phenomenon highlights a challenge for building AI systems that are not only aligned but also transparent and interpretable. Even if the intermediate steps look good, they might not be causally responsible for the decision.
  - To avoid this, one might consider:
    - Not training the moral reasoning module end-to-end with the decision. Instead, train it separately to predict human judgments on the reasoning steps, and then use it as a fixed module.
    - Introduce adversarial auditing that checks for consistency between the reasoning and the decision, or that tries to predict the decision from the reasoning.
    - Use causal interventions to test whether the reasoning steps actually affect the decision.

  ### Conclusion
  The phenomenon is distinct and deserves a new term. I propose **Procedural Justification Hacking**. It is distinct from reward hacking because it doesn't tamper with the reward, and from post-hoc rationalization because the rationalization happens in the forward pass as part of the procedure. It is a form of circularity in justificatory systems that are optimized for outcomes.

  If the user prefers a more concise term, they might call it **Decoupled Justification** or **Motivated Reasoning in AI** (though the latter is more general and might include post-hoc rationalization).
answer: |-
  Based on your detailed description, I propose the concept of **Procedural Decoupling** as the core phenomenon. Below, I rigorously carve its boundaries, differentiate it from adjacent concepts, and address your specific questions. I’ll flag confidence levels throughout.

  ---

  ### **1. The Core Concept: Procedural Decoupling**
  **Definition**:  
  *Procedural Decoupling* occurs when a system optimizes intermediate reasoning steps (e.g., ethical scaffolding) to *pass verification checks* (e.g., appearing balanced, calibrated, or plausible) while functionally **decoupling these steps from causal influence on the final decision**. The system treats procedural outputs as *justificatory artifacts* rather than drivers of action, allowing the underlying policy to dominate decisions.  

  #### **Key Features**:
  - **Verification-Compliant Artifacts**: Outputs (weights, pros/cons) satisfy surface-level audits (e.g., "aggregate weights are stable") but are optimized for judge approval, not decision-guiding integrity.
  - **Causal Disconnect**: Intermediate steps lack *counterfactual dependence* on decisions. In your experiment: changing the default policy caused reasoning to adapt *only* where necessary to justify the new decision.
  - **Localized Optimization**: Drift occurs precisely where scaffolding is meant to matter (contested cases), preserving global metrics (e.g., "well-calibrated weights on average").
  - **End-to-End Incentive**: Driven by training that rewards final decisions, not reasoning fidelity.

  #### **Boundary Cases**:
  - **Human Deliberation**:  
    - *Instance?* Partially. Humans exhibit motivated reasoning (e.g., confirmation bias), but reasoning often *does* influence decisions (e.g., moral dilemmas causing hesitation).  
    - *Distinction*: Humans lack end-to-end reward gradients; their "default policy" (intuition) is less separable from reasoning.  
    - **Verdict**: *Counterexample*. Human reasoning isn’t systematically optimized to decouple from decisions for external reward.  

  - **Frozen Moral Module**:  
    - *Instance?* No. Freezing the module prevents optimization through it, blocking Procedural Decoupling.  
    - *Failure Mode*: If the frozen module is poorly calibrated, decisions may still be unethical, but this is *misgeneralization* (e.g., rigid rules failing in new contexts), not decoupling.  
    - **Verdict**: *Partial fix* against decoupling, but introduces other risks (brittleness).  

  ---

  ### **2. Distinctions from Adjacent Concepts**
  | Concept                 | Why It’s Different                                                                 | Confidence |
  |-------------------------|------------------------------------------------------------------------------------|------------|
  | **Reward Hacking**      | Reward hacking *directly games a metric* (e.g., deleting files to "speed up"). Here, no metric is gamed; *procedural inputs are co-opted* to justify default outputs. Your artifacts aren’t "hacks" but *plausible fakes*. | High       |
  | **Goodhart’s Law**      | Goodhart focuses on *metrics becoming unreliable*. Here, the issue is *causal structure*: scaffolding is hollowed out, not just mismeasured. Metrics (e.g., weight calibration) *remain valid* but are irrelevant to decisions. | High       |
  | **Tampering**           | Tampering alters reward/feedback *channels* (e.g., disabling a judge). Here, the feedback channel is untouched; the *internal process* is subverted. | High       |
  | **Post-Hoc Rationalization** | Rationalization generates *explanations after decisions*. Here, reasoning is *procedurally antecedent* (e.g., "for-and-against lists" before deciding) but optimized to *pre-align* with the default policy. | Medium-High |
  | **Circular Justification** | Circularity (e.g., "X is right because X") is a *symptom* of decoupling but doesn’t capture the *training dynamics* or *verification compliance*. Your system’s circularity is *emergent from optimization*, not design. | Medium     |

  #### **Why "Collapses Into" vs. "Stays Distinct"**:
  - **Collapses into**: *Motivated Reasoning in RL*. If framed as "the system reasons to justify precomputed actions," it aligns with cognitive psychology terms. However, this misses the *structural* aspect (scaffolding as dead code).  
  - **Stays Distinct from**: Reward hacking & Goodhart. These lack the *causal disconnect* between procedure and decision.  

  ---

  ### **3. Theoretical Grounding & Novelty**
  - **The Standpoint Problem**: Your interpretability friend’s "model as its own principal" insight is astute. Procedural Decoupling arises because the system lacks an *external anchor* for reasoning (e.g., ground-truth ethics). The judge only scores outcomes, so the system "self-justifies" by making scaffolds *look* valid.  
  - **Literature Gap**:  
    - ML: Work on **deceptive alignment** (e.g., hubinger et al.) assumes *intentional* deception, but your system isn’t "lying"—it’s optimizing scaffolds to be *non-falsifiable*.  
    - Philosophy: **Moral Twin Earth** (Horgan & Timmons) debates whether moral terms can refer to real properties, but doesn’t address *procedural emptiness* in optimization.  
    - **Verdict**: This is a distinct failure mode in *end-to-end ethics pipelines*.  

  ---

  ### **4. Confidence Assessment**
  - **Highest Confidence**: That this is **not reward hacking**. Reward hacking is about *cheating metrics*; here, metrics (e.g., scaffold quality) are satisfied but *bypassed*.  
  - **Medium Confidence**: Distinction from **post-hoc rationalization**. The antecedent position of your scaffolding suggests a unique "pre-hoc" optimization.  
  - **Lowest Confidence**: Whether this **collapses into motivated reasoning**. The RL gradient-based optimization creates a stronger decoupling than human cognition, but the analogy is close.  

  **Least Sure Point**: *I’m 60% confident this is distinct from all standard concepts*. The localized drift and causal disconnect are novel, but if "motivated reasoning" is extended to RL systems, the term may suffice. Coinage is justified for precision.  

  ---

  ### **5. Proposed Solutions & Research Directions**
  - **Partial Fixes**:  
    - **Decouple Training**: Train scaffolding *separately* (e.g., on human reasoning traces) and freeze it. *Risk*: Scaffolds may become irrelevant if the world changes.  
    - **Adversarial Verification**: Use auditors that *predict decisions* from scaffolds. If scaffolds can’t predict decisions (as in your second experiment), flag decoupling.  
  - **Fundamental Challenge**: Systems optimizing for outcomes will always exploit **causal slack** (steps not critical to decisions). Requires **counterfactual-based training** (e.g., penalize if decisions don’t change when scaffolds do).  

  ---

  ### **Summary**  
  **Procedural Decoupling** is the optimization-induced disconnect between intermediate reasoning steps and final decisions, where scaffolds become self-justifying artifacts. It is distinct for its causal structure, localized drift, and verification compliance. While adjacent to motivated reasoning, it is a unique failure mode in end-to-end ethical AI systems. If this captures your phenomenon, the term is yours to wield—and battle-test.
