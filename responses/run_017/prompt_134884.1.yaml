prompt: |-
  hey, so I have this 1500 word paper due for my combined bio/philosophy elective and the question is basically "is a species something real out there in nature, or is it just a box humans put animals in". My teacher said if I build it around mules, ligers, or ring species she's going to fall asleep because everyone does that, and she said those examples dont actually get at the hard part anyway. So I need one example to hang the whole thing on.

  Here's what I need it to do. I want a case where two different ideas about what a species even *is* both sound reasonable on their own, but they disagree about the case itself — like they end up saying different numbers of species are present, or they disagree about whether some population is still the same species it used to be or a new one. And it shouldn't just be terminology, like one person calling it a species and another calling it a subspecies. In class she mentioned something about a species either being like an individual thing (it starts, it has a history, it can end) or like a group or category that a bunch of organisms are members of, and I think that's the disagreement she wants me to use, but I dont really see how to turn it into an example.

  Two more things that would definatly make it better:

  1. I want a case where "did the old species go extinct?" and "how many species are there now?" come apart — like where a new species shows up but the old one keeps going, or where the old one sort of gradully turns into the new one so you'd want to say nothing really died. And I want something riding on it, not just bookkeeping: like whether it counts as an endangered thing legally, or whether you'd report one extinction or zero.

  2. It should be biologically real-ish — bacteria passing genes sideways, asexual lineages, plants that end up with doubled chromosomes, fungi with weird mating types, whatever works — not a sci-fi scenario. It's fine if it's a made-up version of a real kind of case as long as a bio teacher would buy it.

  Please dont give me sources, footnotes, or a reading list, I have to find those on my own anyway. What I want is: the example, why it's a real problem and not just two people using a word differently, the strongest thing a classmate would say against it and what I'd say back, and one sentence on why this beats the ring species thing. And explain it so I could say it out loud in about two minutes to someone half-asleep in 4th period.
