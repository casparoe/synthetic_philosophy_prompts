  The meta-note will track these substitutions explicitly so the user can verify no philosophical slippage. Should flag where Moorean pitfalls were avoided (e.g., not saying "I believe they're happy but I'm not sure"). 

  Biggest risk is sounding clinical, so need strong emotional anchors - the grandmother quote, the Neruda lines, the "delights me" refrain. The philosophers should nod at the epistemic rigor; the family should tear up at the sincerity. 

