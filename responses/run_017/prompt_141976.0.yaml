  First, I need to brainstorm key elements for strong answers. A top response must: 1) Explicitly distinguish forming intentions from predicting actions, since students often conflate them. 2) Pinpoint why the reason for intending (getting $1M) doesn't transfer to a reason for acting (drinking toxin). 3) Address whether intentions can be formed at will, directly engaging the skeptic's view. 

  For a competent B answer, students might correctly explain the puzzle and the device's role but miss nuances—like not fully unpacking the transmission failure of reasons or glossing over the regress in part (b). Common dodges include self-deception or external tricks, but the case blocks these by specifying no intoxication/coercion and banning self-deception via scanner. 

  The question needs three parts: (a) Does the device make intention formable? (b) Can you intend to swallow the capsule to enable intending to drink? (c) Compare diagnoses (doxastic, reasons, planning, skeptic). Crucially, it must force analysis, not summary. 

  For the model answer (~1,100 words), I'll argue: (a) No, the device doesn't help—you still can't intend to drink because the reason doesn't support drinking. (b) No regress—intending to swallow fails for similar reasons; the device just externalizes the control problem. (c) The cases support the reasons view: intentions require action-supported reasons. The skeptic is wrong because even with control, the structure of intention remains problematic. 

  Marking scheme (20 points): 
  - 4 for distinguishing intention/prediction (common mistake: equating them). 
  - 4 for explaining reasons transmission failure (mistake: thinking the reward justifies drinking). 
  - 4 for handling the capsule regress (B answers miss that intending-to-swallow inherits the same flaw). 
  - 4 for adjudicating diagnoses (B answers list views without arguing). 
  - 4 for engaging skepticism (B answers accept "no control" without critique). 

  A answers nail all; B answers fumble the regress or skepticism. 

  Finally, a note: The model answer's contestable stance is insisting the reasons view wins (I'm 80% confident). The weakest point is dismissing the planning view too quickly—a student defending it rigorously could get full marks.
answer: |-
  ### Brainstorming for Exam Question Design  
  **(i) Must-Hit Moves for Strong Answers (A Range):**  
  1. **Explicitly distinguish intending from predicting.** Students must articulate why forming an intention to drink isn’t equivalent to predicting you will drink (e.g., intention entails commitment; prediction is purely epistemic).  
  2. **Pinpoint the transmission failure of reasons.** Explain why the $1M justifies forming the intention *without* justifying the action of drinking, showing how this fractures the normative structure of intention.  
  3. **Engage the skeptic’s "control" argument directly.** Show whether Case S resolves the puzzle or merely relocates it (e.g., if the capsule is used, does forming an intention *to swallow it* face the same problem?).  
  4. **Adjudicate diagnoses rigorously.** Contrast views by testing them against *both* the original puzzle and Case S (e.g., if the skeptic is right, Case S should dissolve the problem; if the reasons view is right, both cases fail identically).  

  **(ii) Competent Moves (B Range):**  
  - Accurately restates the puzzle and Case S, including constraints (no self-deception, no alternative devices).  
  - Identifies that the device *seems* helpful but doesn’t enable intention-formation in (a).  
  - Notes that intending to swallow the capsule in (b) is paradoxical but doesn’t trace the regress’s implications.  
  - Compares two diagnoses superficially (e.g., "the doxastic view says you need belief") without probing how Case S tests them.  

  **(iii) Common Dodges to Block:**  
  - **Self-deception:** "Decide to believe you’ll drink!" → Blocked by the scanner detecting *sincere* intention and banning self-manipulation.  
  - **External manipulation:** "Get drunk at 5:59!" → Ruled out: no intoxication/coercion allowed; only the capsule may influence action.  
  - **Misusing the device:** "Swallow the capsule to force drinking!" → Terms require *not* swallowing it to get paid; intention must stand alone.  

  ---

  ### Exam Question  
  **Case S (Toxin Puzzle with Surety Device):**  
  An eccentric offers you $1,000,000, paid instantly and irrevocably, if at noon you *sincerely intend* to drink a vial of toxin at 6 p.m. Drinking causes 24 hours of non-lethal nausea. You need not actually drink, and payment depends *only* on your noon intention. Before you decide, you are shown a free, harmless capsule. If swallowed at noon, it guarantees (via direct motor intervention) that you will drink the toxin at 6 p.m., but you would do so unwillingly. The offer is amended: you receive the $1M *only* if at noon you (i) intend to drink at 6 p.m., *and* (ii) do *not* swallow the capsule. A perfect scanner detects your intention and capsule use. You cannot self-deceive, manipulate your future state (e.g., via intoxication), or use any device except the capsule.  

  **Answer all parts:**  
  (a) Does the mere availability of the capsule make it possible to form the intention to drink? Explain why or why not.  
  (b) Could you instead form the intention to *swallow the capsule* at noon, intending this *in order to* cause yourself to drink, thereby enabling you to intend to drink? If not, does this generate a regress? What does this imply?  
  (c) Using the original toxin puzzle and Case S, evaluate at least three of the following views. Which does the comparison best support? What would falsify the skeptic’s view?  
  - **Doxastic view**: Intending to φ requires believing you will φ.  
  - **Reasons view**: A reason justifying intending to φ must also justify φ-ing; here, the $1M justifies intending but not drinking.  
  - **Planning view**: Intention’s function is to settle future action; forming one you’ll abandon is irrational.  
  - **Skeptic’s view**: The puzzle reveals only our inability to form attitudes at will, not a truth about intention.  

  **Guidelines:**  
  - Distinguish *intending* from *predicting*.  
  - Clarify why the reason for intending does not transmit to a reason for acting.  
  - Take a stand on whether intentions can be formed "at will."  
  - Word limit: 1,500 words.  

  ---

  ### Model Answer (1,100 words)  
  **(a) Availability alone fails.** The capsule guarantees drinking but doesn’t make intending to drink possible. To form the intention, I need a reason *to drink*—but the $1M reward only justifies *intending* to drink, not the nausea-inducing act itself. If I try to intend, I realize: at 6 p.m., I’ll have no reason to drink (I already have the money) and every reason not to. Since I know this now, I cannot commit to drinking; my "intention" would be a mere prediction ("I’ll probably drink"), contradicted by my knowledge that future-me will abandon it. The capsule’s presence changes nothing: it isn’t used in this scenario (per the terms), so it doesn’t alter my reasons for drinking.  

  **(b) No, and regress looms.** Intending to swallow the capsule—aiming to force my future action so I can "sincerely" intend to drink—fails for the same reason. Swallowing the capsule is itself an action I must intend. But why would I swallow it? Only to trick the scanner into thinking I intend to drink. However, the reward depends on *actually* intending to drink (not faking it), and I know swallowing would *replace* my agency with coercion. Thus, I have no reason to swallow *except* to enable a hollow "intention" to drink. But if I cannot intend to drink directly, I also cannot intend to swallow the capsule as a means to that end—the justification collapses. Each "level" of intention (intend to swallow → intend to drink) suffers identical normative bankruptcy. This regress suggests the problem isn’t fixable by adding layers of control: intention requires reasons for the *action*, not just the *attitude*.  

  **(c) Adjudicating the views:**  
  - **Doxastic view**: Explains why prediction replaces intention (I can’t believe I’ll drink), but Case S challenges this: the capsule guarantees drinking, so I *can* believe I’ll drink—yet I still cannot *intend* to. Belief isn’t sufficient.  
  - **Reasons view**: Best supported. In both puzzles, the reward justifies intending but not acting, making intention incoherent. Case S confirms this: even with action guaranteed externally, intention requires a reason *for me to act*, which remains absent.  
  - **Planning view**: Correct that forming a disposable intention is irrational, but doesn’t explain *why* it’s impossible (vs. merely inadvisable).  
  - **Skeptic’s view**: Undermined by Case S. If the puzzle were only about lacking direct control, the capsule (which supplies control) should solve it. That it doesn’t—and that intending *to use* the device fails too—shows intention has normative constraints beyond voluntariness. For the skeptic to be right, we’d need a case where guaranteed control *enables* intention-formation. Here, it doesn’t.  

  **Verdict**: The reasons view prevails. Intentions aren’t just forecasts or voluntary choices; they are commitments scaffolded by reasons for action. The skeptic confuses *ability* to intend with the *rational possibility* of intention.  

  ---

  ### Marking Scheme (20 marks total)  
  **A Answers (17–20):** Hit all must-move moves, adjudicate views using both cases, expose the skeptic’s error.  
  **B Answers (13–16):** Describe cases accurately, identify key problems, but miss depth in (b) or (c).  

  | **Criterion**                                                                 | **Marks** | **Common Errors** | **B-Level Shortfall** |  
  |-------------------------------------------------------------------------------|-----------|-------------------|------------------------|  
  | (a) Correctly argues device doesn’t enable intention; distinguishes intention/prediction | 4 | Assumes prediction suffices for intention | Doesn’t explain *why* prediction ≠ intention |  
  | (a) Explains transmission failure: $1M justifies intending, not drinking      | 4         | Claims "$1M is a reason to drink"         | States but doesn’t analyze normative gap    |  
  | (b) Shows intending to swallow fails; diagnoses regress (if applicable)       | 4         | Proposes swallowing as solution            | Misses that intending-to-swallow inherits the same flaw |  
  | (c) Compares ≥3 views using both puzzles; identifies strongest/weakest        | 4         | Restates views without testing on Case S  | Omits skeptic’s falsification requirement   |  
  | (c) Takes clear stance on voluntariness; engages skeptic                      | 4         | Assumes skeptic wins without argument     | Doesn’t show how Case S challenges skeptic  |  

  ---

  ### Model Answer’s Contestable Stance (120 words)  
  The model answer firmly endorses the **reasons view** and dismisses the skeptic. Confidence: 80%. The weakest point is treating the regress in (b) as decisive against the skeptic. One could argue that swallowing the capsule *is* intendable if we distinguish instrumental intentions (swallow to force drinking) from non-instrumental ones. Here, the reason for swallowing *is* transmitted to swallowing itself (to get $1M), sidestepping the regress. If this holds, the skeptic might salvage their view by claiming intention-formation *is* possible when backed by a reliable device. I’m least sure this rebuttal fails—students defending it rigorously (e.g., arguing that swallowing is both rational and intendable) could earn full marks.
