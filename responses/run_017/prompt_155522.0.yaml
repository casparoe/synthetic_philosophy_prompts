prompt: |-
  Right, so I've got ninety minutes next month with a reading group of about seven people — mostly philosophy PhD students, two from stats, and one economist who'll definately turn up late — and I've promised to get them to the point where they can argue about imprecise probabilities without quietly cheating. They're all fine with expected utility on a single sharp prior, and none of them have read anyting technical beyond one survey chapter. I don't want you to explain imprecise probabilities to me; I want a plan for how I explain them in that room.

  What I most want from you is the dependency structure — which idea has to be in place before the next one is even statable, and why. My hunch is that the first real move has to be killing off the thought that an imprecise credence is just a second-order probability distribution over sharp priors with a wide spread, because if they leave with that picture then every decision rule I show them afterwards quietly collapses back into 'take an expectation again'. But I don't know what has to be in place for that move to even land, and I can't tell whether 'it's a set of probability functions that the evidence doesn't single out' should come before it or after it. Then the decision rules, and the bit where the rules come apart — and I can't work out whether that needs the updating stuff before it or after it.

  Then the example. I want one case to carry the whole ninety minutes, and I want you to say what it has to have and what it has to lack. What I think it needs: at least two of the rules I'll mention give different verdicts on it; the imprecision in it isn't laziness or unfinished thinking, it survives someone going away and doing the maths properly; and there's no natural 'right' prior buried inside it that a bright student can dig out and use to dodge the whole apparatus. Why not the usual coin-of-unknown-bias thing? And is there anything I should be careful not to build the example out of — I'm worried that anything with frequencies in it will get read as sampling noise.

  Misconceptions, and this is where I think I'll get caught out. Here's my list, in no order: that an imprecise credence is a confidence interval; that it's a polite way of saying the calculation isn't finished; that the rule is always to maximise the worst case; that whatever the worst-case rule spits out is automatically undominated (I have a feeling that one's false — something can have exactly the same minimum as an option that beats it or matches it everywhere else — but I can't tell whether that's a fifth-minute point or a fiftieth-minute point); and that more evidence always narrows the interval, which I think is straightforwardly wrong given cases where conditioning on every cell of a partition leaves you wider than you started. Tell me which of these I've misdescribed, which ones they'll actually form and in what order, and exactly where in the sequence to head each one off.

  Two things I want bolted on that certainly aren't in the survey chapter. First: I've started seperating 'thin spread' — imprecision because there's hardly any evidence — from 'clash spread', where two models, or two equally credible experts, simply disagree, and I want them walking out able to say why those might not deserve the same handling (or why they might; I genuinely don't know which way it goes). Second, there's a half-baked rule I use myself: stay permissive, keep every option that isn't dominated across the whole set, and only then break the tie — and when I break it I don't use the midpoint or the average over the set, I use how much of the set is on that option's side. Tell me where that sits in the sequence, whether mentioning it early would breed a misconception, and whether it's really anything different from a rule I should be teaching them anyway.

  Last two things. One question for the final ten minutes that would show me they've got the idea rather than just the vocabulary — I was going to hand them a case where learning something makes the interval wider and ask what they'd do differently once they know which cell they're in, but I'm not sure that tests the right thing. And a list of what I should flatly refuse to explain at this level, saying out loud that I'm refusing it: I'm assuming the full lower-prevision machinery (the general setup where you work with lower and upper expectations directly rather than with a set of probabilities) and anything involving Choquet integrals, but tell me if I'm drawing the line in the wrong place. Write the whole plan in American English, spelling and all — the group's materials are in American and it drives them mad otherwise.
reasoning: |-
  Okay, let me tackle this user's request. They need a structured plan for teaching imprecise probabilities to a group of mostly philosophy PhD students, plus some from stats and economics. The main goal is to prevent misconceptions, especially the idea that imprecise credence is just a second-order probability. 

  First, I need to map out the dependency structure. The initial move must address the second-order probability misconception upfront. Before that, students need a clear distinction between precise and imprecise representations. Starting with why single priors fail in certain cases sets the stage. 

  The example choice is crucial. The Ellsberg Paradox is perfect because it forces divergence in decision rules and lacks a hidden "true" prior. It also avoids frequency interpretations. I should ensure the example highlights thin spread vs. clash spread later on. 

  Misconceptions need targeted interventions. Confidence intervals and unfinished calculations are common mix-ups. Addressing these after introducing sets of probabilities but before decision rules makes sense. The worst-case dominance myth requires a counterexample during the rules section. 

  The user's personal rule about non-dominated options fits after introducing E-admissibility. It's a natural extension but mentioning it too early might confuse. Saving it for the tie-breaking discussion keeps the flow logical. 

  For the closing question, testing understanding of interval-widening evidence is good. Asking how they'd handle decisions after such an update checks if they grasp that rules apply post-learning. 

  I'll avoid lower prevision and Choquet integrals explicitly. The focus stays on sets of probabilities and decision rules. Emphasizing the difference between thin and clash spread towards the end ties their real-world relevance together. 

  Timing each section ensures coverage: misconceptions early, rules with examples, then advanced nuances. The final Q&A should reinforce key concepts without introducing new material.
answer: |-
  Here's a battle-tested plan for your 90-minute session, structured for maximum conceptual clarity and misconception-busting. Written in American English as requested.

  **Core Goal:** Prevent the "second-order probability" misconception & enable meaningful argument about decision rules under genuine imprecision.

  **Dependency Structure & Sequence (60 mins):**

  1.  **Ground Zero: Why Precise Isn't Always Possible (10 mins)**
      *   **Start:** Quick recap of expected utility (EU) under a *single* sharp prior. "What's the probability it rains tomorrow? 0.4? Great, EU calculus applies."
      *   **Problem:** Present **Ellsberg Paradox (Simple Version)**.
          *   *Urn 1:* 50 Red, 50 Blue balls. Known.
          *   *Urn 2:* 100 Red or Blue balls. Unknown proportion.
          *   *Bet A:* Win $100 if Red (Urn 1). Bet B: Win $100 if Blue (Urn 1).
          *   *Bet C:* Win $100 if Red (Urn 2). Bet D: Win $100 if Blue (Urn 2).
      *   **Observation:** Most strictly prefer A to B? (Indifferent). Most strictly prefer A to C? (Yes). Most strictly prefer B to D? (Yes). But C and D are symmetric! Violates EU with *any* single prior for Urn 2.
      *   **Key Point Here:** The evidence for Urn 2 *doesn't justify* a single sharp probability. It's not ignorance of the *true* probability; it's that the evidence *itself* is incomplete/symmetric/ambiguous. **Kill "Unfinished Thinking":** "If I knew the true proportion, I'd have a sharp prior. But I *don't* know it, and the evidence *doesn't tell me*. This isn't laziness; it's the nature of the evidence." **Conception:** Imprecision arises from the *character of the evidence*, not laziness.

  2.  **The Core Representation: Sets of Probabilities (10 mins)**
      *   **Move:** "How do we represent belief for Urn 2? Not one number. We represent the *set* of probabilities consistent with the evidence." For Urn 2: `[P(Red) = p | p ∈ [0, 1]]`. Call this set `C` (your credal set).
      *   **Emphasize:** This is *not* a second-order distribution! There is *no* probability assigned over the `p`'s in `[0,1]`. We simply don't rule any of them out based on the evidence. It's a *set* of *possible* sharp priors, not a distribution *over* them. **Kill "Second-Order Probability":** "If I *had* a second-order distribution, I could integrate to get a sharp first-order prior (e.g., `E[p]`). But here, I *can't* do that – the evidence doesn't justify *any* specific weighting over the p's in [0,1]. All I know is `p` could be anything between 0 and 1." **Conception:** Belief state = Set of probabilities (credal set `C`), not a distribution over probabilities.

  3.  **Decision Rules: The Rules Come Apart (25 mins)**
      *   **Problem:** How do we choose actions when beliefs are represented by `C`? Different rules propose different answers. **Focus:** Introduce rules *via their verdicts on Ellsberg Bets*.
      *   **Rule 1: Maximin (Wald)**. Choose action with the highest *minimum* expected utility over `C`.
          *   *Bet C (Urn2 Red):* Min EU = min_{p∈[0,1]} p*100 = 0
          *   *Bet D (Urn2 Blue):* Min EU = min_{p∈[0,1]} (1-p)*100 = 0
          *   *Bet A (Urn1 Red):* Min EU = 0.5*100 = 50
          *   *Verdict:* Prefers A over C, Prefers A over D. Indifferent between C and D. **Matches common preferences.**
      *   **Rule 2: MaxEmax (Optimism-Pessimism Index)**. Choose action with the highest α * min EU + (1-α) * max EU over `C`. (α = pessimism index).
          *   *Illustrate α=0.5:* Bet C: 0.5*0 + 0.5*100 = 50; Bet D: 50; Bet A: 50. Indifferent.
          *   *Illustrate α>0.5:* Favors known urn (A/B) over unknown (C/D).
      *   **Rule 3: E-Admissibility (Levi)**. An action is admissible if there exists *some* probability in `C` that makes it EU-maximal. Choose *only* from admissible actions.
          *   *Bet C:* Admissible? Yes (if p=1, EU=100 > EU of A=50, D=0).
          *   *Bet D:* Admissible? Yes (if p=0, EU=100 > EU of A=50, C=0).
          *   *Bet A:* Admissible? Yes (if p=0.5, EU=50 >= EU of C=50, D=50). **Verdict:** All bets are admissible! Doesn't tell you *which* to choose, just rules nothing out. **Introduce "Permissiveness" Here:** "Levi says: Keep every option that isn't strictly dominated *across the whole set C* (i.e., there's no other option better everywhere in C). Only *then* might you need a tie-breaker."
      *   **Rule 4: Γ-Maximin (Hurwicz)**. Choose action with the highest *minimum* EU *only among admissible actions*. (Avoids dominated options with good mins).
          *   *All bets admissible.* Min EU: C=0, D=0, A=50. **Verdict:** Prefers A (like Maximin).
      *   **Key Takeaway:** Rules disagree! Maximin picks A. MaxEmax (α>0.5) picks A. E-Admissibility says all are permissible. Γ-Maximin picks A. **This is where argument starts!** There's no single "right" rule. **Kill "Always Maximin":** We've seen multiple rules.

  4.  **Dominance & Refining the Rules (10 mins)**
      *   **Define Strict Dominance:** Action X strictly dominates Y if EU(X) > EU(Y) for *every* P in `C`. Y is inadmissible.
      *   **Define Weak Dominance:** Action X weakly dominates Y if EU(X) >= EU(Y) for *every* P in `C`, and EU(X) > EU(Y) for *some* P in `C`. (Often considered inadmissible).
      *   **Kill "Worst-Case Means Undominated" (Crucial!):** "Just because an option has a high minimum EU, does that mean it's undominated? **Counterexample:** Imagine a modified bet `A-`: Win $49 if Red (Urn1). Min EU = 49. Compare to `A` (Win $50 if Red). `A` strictly dominates `A-` *everywhere in C*! But `A-` has a min EU of 49, while `A` has min EU=50. `A`'s min is higher *and* it beats `A-` everywhere. Maximin picks `A` over `A-`, correctly avoiding the dominated option. BUT... imagine a different bet `Z` against Urn 2 where Min EU(`Z`) = 49.5. Is `Z` dominated by `A`? *No!* Because for some priors (e.g., p=0 for Urn2 Red), EU(`Z`) could be 100 > EU(`A`)=50. `Z` has a lower min (49.5 < 50) but is *not* dominated by `A` because `A` doesn't beat it when p is low. **Min EU does not imply dominance or lack thereof.**" **Conception:** High min EU ≠ Undominated. Undominated ≠ High min EU. Check dominance *across the whole set*.
      *   **Your Tie-Break Rule (Mention Here):** After applying E-admissibility (keeping only non-dominated options), you break ties by seeing "how much" of `C` favors an option. "I look at the *set* of priors where Option X has higher EU than Option Y. If that set is 'large' relative to `C`, I favor X. This isn't using an average; it's about the geometry of the credal set supporting the option." **Placement:** Mentioning it here alongside E-admissibility is perfect. It builds naturally on Levi's idea. It *is* a specific (and intuitive) way to handle the permissiveness of E-admissibility. **Is it different?** It's a specific *tie-breaking procedure* applied *after* E-admissibility. It's not a fundamental rule itself, but a way to refine the admissible set. Excellent to mention.

  5.  **Updating & Widening Intervals (5 mins)**
      *   **Conception:** Conditioning on evidence narrows the credal set? Usually, but **not always!**.
      *   **Example:** Urn 3: Contains Red, Blue, Green balls. Evidence: "Not all balls are Green." Credal Set `C_0`: P(Red) + P(Blue) > 0. (Wide spread on individual colors).
      *   **Update:** You draw a ball... it's **Green**! Condition on Green. New Credal Set `C_1`: P(Green) = 1. (P(Red)=0, P(Blue)=0). **Massively narrowed!**
      *   **Update:** You draw a ball... it's **Not Green** (i.e., Red or Blue)! Condition on ~Green. New Credal Set `C_2`: P(Red) + P(Blue) = 1, but *no information* on the ratio Red:Blue. `C_2 = {P | P(Red)=q, P(Blue)=1-q, q ∈ [0,1]} P(Green)=0`. **Compared to `C_0` (where P(Red) could be near 0 or near 1), the imprecision on P(Red) is *wider* after conditioning on ~Green!** (In `C_0`, P(Red) max/min are constrained by P(Green)>0; in `C_2`, P(Green)=0 removes that constraint). **Kill "More Evidence Always Narrows":** It usually does, but partition-based evidence can sometimes *increase* imprecision on specific events by ruling out constraining possibilities. **Decision Implication:** Hold this thought for the closing question.

  **The Example: Ellsberg is Your Workhorse (Throughout)**
  *   **Why it Works:**
      *   **Rules Diverge:** Maximin/MaxEmax/Γ-Maximin prefer known urn; E-admissibility allows all.
      *   **Genuine Imprecision:** No "true prior" exists or is justified by evidence. Symmetry prevents extraction.
      *   **No Frequencies:** It's about composition uncertainty, not sampling noise. Avoids "confidence interval" confusion.
      *   **Thin vs. Clash Ready:** Perfect for illustrating "thin spread" (minimal evidence on Urn 2).
  *   **Why Not Unknown Bias Coin?** Often gets misinterpreted as *having* a true probability (frequency) we just don't know, inviting second-order probability thinking. Ellsberg's symmetry breaks this.

  **Thin Spread vs. Clash Spread (5 mins)**
  *   **Thin Spread (Ellsberg Urn 2):** Very little evidence. Credal set `C` is large because almost nothing is ruled out. ("Ignorance").
  *   **Clash Spread:** Two credible experts/models give conflicting sharp probabilities: Expert 1: P(Rain)=0.3; Expert 2: P(Rain)=0.7. Evidence doesn't favor one over the other. Credal set `C = {P1, P2}`.
  *   **Key Question:** "Should these be handled the same? The *set* `C` is the representation in both cases. Decision rules apply to `C`. But... the *interpretation* differs. Is the clash spread more 'resolvable' in principle? Does it feel like there *should* be a meta-probability over experts? (But remember our starting point: the evidence might not justify that meta-probability either!). This is a deep philosophical question about disagreement vs. pure ignorance. **Point:** The formalism (`C`) handles both, but the *reason* for `C` might influence which decision rule feels appropriate. (Maximin might feel too conservative for clash spread?). **Goal:** Get them thinking they *might* deserve different handling, even if the math starts the same.

  **Final 10 Minutes: The Test Question**
  *   **Scenario:** Urn 4: 10 balls. Each ball is either Red (R), Blue (B), or Green (G). You know *only* that there is at least 1 R and at least 1 B. (`C_0`: P(R)≥0.1, P(B)≥0.1, P(R)+P(B)+P(G)=1).
  *   **Question 1:** What's your imprecise P(Draw is Green)? (Answer: P(G) ∈ [0, 0.8] - min when max R/B, max when min R/B).
  *   **Update:** You draw a ball. It is **NOT Green**.
  *   **Question 2:** What's your *updated* imprecise P(Next Draw is Green)? (Answer: Conditioning on ~G. New `C_1`: P(R)≥0.1, P(B)≥0.1, P(G)=0, P(R)+P(B)=1. P(Next is G) = 0? No! There are still 9 balls left! The *proportion* of Green is unknown. Updated P(Next is G | First was ~G) ∈ [0, ≈0.444]. (Min: 0 Greens left / 9 balls. Max: 8 Greens left / 9 balls ≈ 0.888? Wait... Constraint: Original P(G) <= 0.8. After removing one non-green, max Greens possible is 8 out of 9 remaining, so P(Next G) ∈ [0, 8/9] ≈ [0, 0.889]. Crucially, the *lower bound* is still 0, but the *upper bound* is now *higher* (0.889 > 0.8) than the initial upper bound on P(G)! Imprecision *widened* for P(Green) after learning ~Green.
  *   **The Test:** "You have to make a decision *now* about a bet on the *next* ball being Green. How does learning the first ball wasn't Green impact your decision process under the different rules we discussed? Does the *widening* of the probability interval change how cautious or optimistic you need to be compared to before the draw?" **Why it Works:** It tests if they:
      1.  Understand that updating can widen intervals.
      2.  Realize the decision rules (Maximin, E-admissibility, etc.) still apply *to the updated credal set* `C_1`.
      3.  Grasp that the *changed shape* of `C` (now wider for P(G)) might shift the verdicts of those rules compared to using `C_0`. (e.g., The minimum EU for a bet on Green drops further (to 0), making Maximin even less likely to choose it; E-admissibility might still allow it if there's *any* prior in `C_1` making it optimal).

  **What to Refuse to Explain (State Clearly):**
  *   "We are working directly with sets of probabilities (`C`). There's a more general formalism called **lower and upper previsions** (or coherent lower previsions) that works with bounds on expectations directly, without always needing an explicit `C`. That's powerful, but also more abstract. We *won't* be diving into that today – we'll stick to sets `C`."
  *   "Relatedly, calculating expected utility under some rules, especially with more complex `C`, can involve more advanced math like **Choquet integrals**. That's beyond our scope today. We'll focus on the concepts and rules using simple sets like intervals."

  **Misconception Takedown Summary:**
  1.  **Second-Order Probability:** Killed in Step 2 using Ellsberg & emphasizing no weighting/distribution over the set.
  2.  **Confidence Interval:** Preempted by avoiding frequency-based examples (used Ellsberg). Contrast: CI infers a fixed parameter; imprecise prob represents belief given ambiguous evidence.
  3.  **Polite Unfinished Thinking:** Killed in Step 1 with Ellsberg ("nature of evidence, not laziness").
  4.  **Always Maximin:** Killed in Step 3 by showing multiple rules (MaxEmax, E-admissibility) and their different verdicts.
  5.  **Worst-Case Implies Undominated:** Killed in Step 4 with explicit counterexample (`A` vs `Z`).
  6.  **More Evidence Always Narrows:** Killed in Step 5 with the Urn 3/~Green example. Reinforced in Final Question.

  **90-Minute Flow:**
  *   0-10: Ground Zero & Ellsberg Setup (Kills: Unfinished Thinking)
  *   10-20: Sets, Not Distributions (Kills: Second-Order Prob)
  *   20-45: Decision Rules in Action on Ellsberg (Kills: Always Maximin)
  *   45-55: Dominance & Your Tie-Break (Kills: Worst-Case=Undominated)
  *   55-60: Updating Can Widen (Kills: More Evidence=Narrows)
  *   60-65: Thin vs. Clash Spread
  *   65-80: Final Test Question & Discussion
  *   80-90: Wrap-up, Key Takeaways, Refusals, Q&A

  This sequence builds dependencies logically: You need the inadequacy of sharp priors (1) to justify sets (2). You need sets (2) before you can define decision rules over them (3). You need to see rules working (3) before discussing dominance nuances (4). You need the basic setup before updating quirks (5) or spread types (Thin/Clash). Your tie-break fits naturally after E-admissibility. The final question integrates updating and decision rules. Misconceptions are tackled precisely when they are most likely to arise or are most damaging. Good luck!
