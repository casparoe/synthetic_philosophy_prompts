answer: |-
  Your frustration targets the **core challenge of typeface design**: the **relational, systemic nature** of letterforms. What you're grappling with isn't one phenomenon or two, but the **single, essential mechanism** underlying both "belonging" and "reading-as" within a specific font: **Systemic Glyphic Differentiation (SGD)**.

  **Defining Systemic Glyphic Differentiation (SGD):**

  SGD is the *dynamic network of visual relationships between glyphs within a specific typeface system* that simultaneously:
  1.  **Establishes Stylistic Coherence (Belonging):** By ensuring consistent application of core design principles (like stress axis, contrast model, terminal treatment, proportional rhythm) *across different letterforms*, even when their structures differ wildly.
  2.  **Maintains Legibility (Reading-As):** By ensuring sufficient *differentiation* between structurally similar glyphs (a/e/o/c, n/h/m, i/j/l, r/n, etc.) *within the specific visual logic established by that system*, preventing ambiguity.

  **Why SGD is the Core Phenomenon:**

  1.  **The g Problem (Belonging):** Your 'g' didn't look "wrong" in isolation; it looked wrong *relative to the 'a' and 'e'*. Redrawing the 'a' and 'e' didn't magically fix the 'g'; it *fixed the system*. By altering the 'a' and 'e', you adjusted the baseline expectations for core elements (like bowl shape, aperture, terminal angle, rhythm) *within the systemic context*. The 'g' now sat within a *recalibrated network* of relationships. Its previously jarring features now resonated with the new norm established by its neighbors. SGD was disrupted; your fix restored it by adjusting the system's core references.
  2.  **The Misfit Glyph (Belonging Failure):** A glyph can match every measurable parameter (stem weight, x-height, width) but still look alien because SGD relies on *non-measurable relational qualities*. It might break the rhythm of curves, disrupt the implied counter-shapes, violate the internal logic of how terminals resolve, or clash with the *gestural language* established by other glyphs. It's like playing a perfectly tuned note from a different scale – technically accurate but contextually jarring. The disruption is in the *systemic conversation*, not the individual parts.
  3.  **The Lone a (Reading-As Failure):** An 'a' drawn alone loses its identity precisely because SGD *requires context*. Legibility isn't inherent in the 'a' shape; it's defined *relationally* against the 'o', 'e', 'c', 'd', etc., within the *specific stylistic framework* of *your* font. On a blank page, the brain lacks the crucial counterpoints for comparison. There's no 'o' to define its openness, no 'e' to establish its terminal relationship, no 'n' to set the rhythm for its bowl. SGD defines "a-ness" *for this specific font* by its differences from similar forms *within the system*. Remove the system, remove the differentiation context, remove the clear identity.

  **Distinguishing SGD from Related Concepts:**

  *   **Family Resemblance (Wittgenstein):** Acknowledges the lack of a single defining rule but stops short. SGD *is* the rule: the rule is the *system of relationships itself* within a specific font.
  *   **Ductus:** About the *generative* process (pen movement). SGD is about the *resulting visual relationships* in the final static forms and their systemic interplay.
  *   **"Color" (Typography):** Refers to the overall texture/density of a block of text. SGD is the underlying *mechanism* that creates consistent color by governing how individual glyphs relate *to each other* spatially and visually within the system.
  *   **Spacing/Kerning:** Governs the *external* spatial relationship *between* glyphs. SGD governs the *internal visual relationships* and differentiation *within* the system that make consistent spacing possible and meaningful.
  *   **Consistency:** A *goal* or *result*. SGD is the *process* and *structure* that *achieves* consistency specifically through managed differentiation within a system.
  *   **Style:** Too broad. SGD is the *functional engine* that makes a style coherent and legible at the glyph level.

  **The Edges & Borderline Cases (Applying SGD):**

  1.  **A letter clearly by the same designer but from a different project:** Does it belong in *this specific font*? **SGD Verdict:** *No, unless it demonstrably participates in this specific system's relational network.* It might share *traits* (designer's hand), but if its curves speak a different rhythmic language, its terminals resolve differently, or its differentiation from similar glyphs (like 'a' vs. 'o') clashes with *this font's* established SGD, it will feel alien. Belonging is font-specific, not designer-specific.
  2.  **A glyph modified slightly to "fit" a new system:** When does it stop being "that glyph" and become part of the new SGD? **SGD Verdict:** It belongs *when its key relational functions within the new system are established*. If its modified shape now correctly differentiates from the new system's 'o' and 'e', resonates with the new contrast model and terminal logic, and contributes to the rhythmic flow, it has been successfully integrated into the new SGD, even if its origin was elsewhere.
  3.  **A very weird 'a' that still reads as 'a' *only* in its specific font:** **SGD Verdict:** This is SGD working perfectly. The 'a' maintains sufficient *differentiation* from the 'o', 'e', etc., *within the specific, perhaps unconventional, logic of this system*. Its "weirdness" is consistent with the system's core principles (coherence), and its relational differences from neighbors are clear enough (differentiation) to signal 'a' in *that context*. Take it out, and the differentiation cues vanish.

  **In Essence:**

  You've intuitively discovered that typefaces are relational systems, not collections of individual characters. **Systemic Glyphic Differentiation (SGD)** is the dynamic interplay within that system. "Belonging" (coherence) arises from consistent application of core visual logic *across diverse forms*. "Reading-as" (legibility) arises from managed differentiation *between similar forms within that specific logic*. They are two inseparable facets of the same systemic phenomenon. The "clearance" you sense between your 'a' and 'o'? That's the SGD at work, defining the minimum relational distance needed for unambiguous identity *within your font's unique visual language*. Measuring it requires not a ruler, but an understanding of the *entire system* as a network of interdependent relationships. Keep drawing, keep adjusting the system, not just the glyph – you're already practicing SGD.
