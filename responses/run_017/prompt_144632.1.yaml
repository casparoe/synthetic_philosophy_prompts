  ### Analysis of the Coin Toss Game and Expected Value Paradox

  The paradox arises from a coin toss game where a fair coin is tossed until it lands heads, and the payout depends on the toss number \(n\) of the first heads: \((-1)^{n+1} \cdot 2^n / n\) dollars. The expected value is given by the alternating harmonic series \(\sum_{n=1}^{\infty} (-1)^{n+1} / n\), which converges conditionally to \(\ln 2 \approx 0.69\) dollars but is not absolutely convergent. This leads to a disagreement about whether the expected value is well-defined and equal to \(\ln 2\), or undefined due to the conditional convergence.

  Your argument is structured as follows:
  - **(1)** The probability of no heads (infinite tails) is 0, so the game ends in finite time with probability 1.
  - **(2)** The value of the game should be the limit of the values of its finite truncations, as these approximate the game with probability 1.
  - **(3)** Under the natural truncation (stopping after \(k\) tosses if no heads), the expected values are the partial sums of the alternating harmonic series, which converge to \(\ln 2\) and are always at least 1/2.
  - **(4)** Therefore, the game has a well-defined expected value of \(\ln 2\), and paying 50 cents to play is rational.
  - **(5)** However, step (2) does not specify the order of truncation, and by the Riemann rearrangement theorem, rearranging the terms can make the series converge to any real number (e.g., a negative value or a large positive value).
  - **(6)** This implies the game has multiple "values" (e.g., \(\ln 2\), negative, or \$1 million), leading to absurdity (e.g., paying \$999,999 for a 50% chance of losing \$2).
  - **(7)** This absurdity means one of steps (1)-(3) or an inference is false.

  The core issue is that the expected value is undefined due to the lack of absolute convergence, and step (2) is the point of failure. Below, I explain which step to reject, why it seemed safe, and the implications for this game and ordinary finite cases.

  #### Step to Reject: Step (2)
  **Why step (2) is rejected:**  
  Step (2) claims that the value of the game should be the limit of the expected values of its finite truncations, as these converge to the full game with probability 1. However, this relies on the assumption that the random variable \(X\) (the payout) is *integrable*, meaning \(\mathbb{E}[|X|] < \infty\). This is not true here because:
  - \(\mathbb{E}[|X|] = \sum_{n=1}^{\infty} p_n |x_n| = \sum_{n=1}^{\infty} (1/2)^n \cdot |(-1)^{n+1} 2^n / n| = \sum_{n=1}^{\infty} 1/n\), which is the harmonic series and diverges to infinity.
  - With \(\mathbb{E}[|X|] = \infty\), the expectation \(\mathbb{E}[X]\) is not well-defined in standard probability theory. The limit of the truncations' expected values depends on the truncation method, and different truncations (e.g., different orderings of outcomes) can yield different limits.

  Step (2) appears safe because it works for bounded random variables or when \(\mathbb{E}[|X|] < \infty\). In those cases, the approximation \(X_k \to X\) almost surely implies \(\mathbb{E}[X_k] \to \mathbb{E}[X]\) by the dominated convergence theorem or similar results. Here, however, the payouts are unbounded and heavy-tailed (\(\mathbb{E}[|X|] = \infty\)), so the limit does not uniquely define \(\mathbb{E}[X]\).

  **Why step (2) seemed safe:**  
  In ordinary finite games or cases with bounded payouts, \(\mathbb{E}[|X|] < \infty\) holds, so truncation convergence is robust and order-invariant. Step (2) feels intuitive because, with probability 1, the game ends finitely, so the finite truncations \(G_k\) (stop after \(k\) tosses) seem like natural approximations. Moreover, \(\mathbb{E}[G_k]\) converges to \(\ln 2\) under natural truncation, making \(\ln 2\) seem like the "obvious" value. However, unbounded payouts violate the integrability condition, making step (2) invalid.

  #### Why Other Steps Hold or Are Unaffected
  - **(1) Holds:** The probability of no heads is indeed 0 (\(\lim_{k \to \infty} \mathbb{P}(\text{no heads in } k \text{ tosses}) = \lim_{k \to \infty} (1/2)^k = 0\)), so the game ends finitely with probability 1. This is a correct description of the setup.
  - **(3) Holds:** Under natural truncation, the expected values of \(G_k\) are the partial sums \(S_k = \sum_{n=1}^k (-1)^{n+1}/n\), which converge to \(\ln 2\) and are always \(\geq 1/2\). This is a factual computation and not the issue.
  - **(4) Fails as a conclusion:** Since step (2) is rejected, the inference to a well-defined value of \(\ln 2\) is invalid. \(\mathbb{E}[X]\) is undefined, so paying 50 cents is not necessarily rational.
  - **(5) Holds and demonstrates the problem:** The rearrangement theorem applies, and different truncation orders (e.g., based on a permutation of outcomes) can make \(\mathbb{E}[H_k]\) converge to any real number. This shows that the limit depends on the truncation method, confirming that \(\mathbb{E}[X]\) is not well-defined.
  - **(6) and (7) Resolved:** The absurdity arises because step (2) incorrectly assumes a unique limit. Rejecting step (2) avoids this—the expected value is undefined, not multiple values simultaneously. The paradox is resolved by recognizing that \(\mathbb{E}[X]\) does not exist.

  #### Implications of Rejecting Step (2)
  **For this game:**
  - The expected value \(\mathbb{E}[X]\) is undefined. You cannot assign a unique value like \(\ln 2\) to the game.
  - In practice, multiple plays may not consistently average to \(\ln 2\):
    - Since \(\mathbb{E}[|X|] = \infty\) and the payouts have heavy tails (\(\mathbb{P}(|X| > t) \sim c/t\) for large \(t\)), the average payout over \(N\) games may not converge to \(\ln 2\) (or any value) almost surely. Simulations could show erratic behavior due to rare large payouts dominating the sum.
    - Your friend's claim that the average settles to \(\ln 2\) is not guaranteed; it might hold for small \(N\) but fail for large \(N\) due to the infinite variance (e.g., \(\mathbb{E}[X^2] = \sum_{n=1}^{\infty} 2^n / n^2 = \infty\)).

  **For ordinary finite cases:**
  - Rejecting step (2) costs nothing in cases where payouts are bounded or \(\mathbb{E}[|X|] < \infty\). In those settings, truncation convergence is valid and order-invariant because the series converges absolutely. For example:
    - With bounded payouts, \(\mathbb{E}[|X|] < \infty\), so \(\mathbb{E}[X_k] \to \mathbb{E}[X]\) for natural truncations.
    - You can safely rely on step (2)-like reasoning in standard games (e.g., dice rolls with finite outcomes).
  - The key takeaway is that step (2) must be qualified: it only holds when \(\mathbb{E}[|X|] < \infty\). For unbounded heavy-tailed distributions, it fails, and expectation may be undefined.

  #### Final Resolution
  The standard line is correct: the expected value is undefined due to conditional convergence and \(\mathbb{E}[|X|] = \infty\). Step (2) is the flaw—it overlooks the need for integrability. While \(\ln 2\) arises from natural truncation, it is not a unique or rigorous expected value. In decision theory, one might still use \(\ln 2\) for practical purposes (e.g., if forced to choose a price), but this is not theoretically sound. For similar games, always check absolute convergence: if \(\mathbb{E}[|X|] = \infty\), expectation is undefined.
