  ### Discussion
  - **SSC as a confirmation theory**: Your "severe test" idea *is* a confirmation theory, not just experimental design. It defines confirmation via counterfactual reliability ("would this method catch lies?"), making it robust to paradoxes.  
  - **Why SSC works**: It resolves your flip-flop on cases 4/5 and 6/7 by tying confirmation to the *procedure's capacity to expose falsehoods*. A "white shoe" confirms weakly only if discovered via a method that *might* have found a non-black raven (e.g., random sampling). Known shoes or closet recounts lack this risk.  
  - **Costs**:  
    - Case 9 is downgraded because one random draw from 10 objects has low risk (10% detection chance). If you insist this *should* confirm decently, you must abandon SSC or modify it (e.g., add a clause for "evidence that narrows the search space").  
    - Case 11 highlights SSC's strictness: Verification must cover *all* properties in H. If your gut rejects this, consider weakening clause 3.  
  - **New cases**:  
    - **N1** (random black raven) confirms moderately—higher risk than case 1 (objects > ravens) but lower than case 2 (survey).  
    - **N2** (oracle) fails—no observational procedure means no "test," aligning with your experimental-design intuition.  
  - **Final take**: SSC covers 12/14 cases and your severity intuition while blocking equivalence-based paradoxes. If you keep it, sacrifice case 9’s "decent" verdict and case 11’s "no mouse check" intuition. If not, split into two principles: one for risk (cases 1–8, 10) and one for search-space reduction (case 9).
