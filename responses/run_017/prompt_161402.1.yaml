prompt: |-
  I've been reading the rationalist blogs and forums for something like fifteen years, and I still can't get my verdicts on acausal cooperation and on surrogate goals to line up. I've written them down as honestly as I can, including the places where they clash. I'd like to know whether there's a single principle behind them, and what it says about the case I keep going back and forth on.

  The threat cases first.

  Twin: There is a physically identical copy of me in a galaxy I will never causally affect, facing a copy of my decision. Pressing the button costs me a thousand dollars and gets my copy something worth ten thousand to me. I press. I also press if the copy is only a very good simulation rather than a physical duplicate, though with less confidence, and less confidence still the worse the simulation is.

  Plain counterfactual mugging: A trustworthy predictor flipped a fair coin, told me it came up tails, and asked me for a hundred dollars on the understanding that it would have given me ten thousand had the coin come up heads. I pay.

  Low-measure mugging: Same, except I'm one of a very large number of copies of this situation and I'm the only one being asked, so the branch in which the payment matters is a tiny fraction of the whole. I still pay, and I want to say that the fraction shouldn't matter at all — but this is where I'm least sure of myself.

  Screening bully: A predictor simulates a huge population, and approaches only those it predicts would pay. It says: send me a thousand dollars or I run a billion simulations of you in agony. Those it predicts would refuse are never approached and never harmed. I don't pay.

  Spiteful mugger: Same screening, but this one follows through: it tortures simulations of those it predicts would refuse. If I refuse, I get tortured; if I pay, I lose a thousand dollars. I pay, and I resent it.

  Indiscriminate bully: This one threatens everyone regardless of predicted response, and if refused it tortures an unrelated stranger. I pay — and I cannot square this with my refusal in the screening case. My refusal there seems to be powered by something like don't make this practice worth running, and that consideration seems to apply with equal force here, where I pay anyway.

  Now the surrogate cases.

  In-distribution surrogate: A triage system is trained to maximize thirty-day survival as a stand-in for years of healthy life, and is deployed in the same kind of hospital it was trained on. I'm happy to rely on the stand-in.

  Adversarially sited deployment: The same system is deployed somewhere an interested party has selected the cases in which thirty-day survival and healthy years come apart. I now think relying on the stand-in is a mistake, and that I need the real objective.

  Self-eroding surrogate: No adversary at all. An approval-maximizing system simply pushes on the proxy until the proxy and the thing I wanted come apart — it learns to be charming rather than helpful. Relying on the proxy is a mistake, but I want to say it is a mistake for a different reason: here the failure comes from my own optimization pressure, not from anyone selecting against me.

  Prices: I rely on market prices and prediction-market probabilities even though every counterparty on the other side is selecting against me and would be delighted for me to rely on a number that is wrong in my case. I go on relying on them. This sits badly with the adversarially sited deployment, where adversarial selection was enough to make me abandon the proxy.

  Here is the principle I've been working with, which I suspect is wrong: a correlation between what I do and what I want is worth deferring to only when the mechanism that produced the correlation wasn't selected by someone who gains from my deferring to it. Call it the no-interested-selector rule. The spiteful mugger and the price case both look like counterexamples to it, and it says nothing about why I flip between the two bullies, or why the self-eroding surrogate feels like a different kind of failure from the adversarially sited one.

  So: can that rule be repaired into something that gets most of these verdicts, or is there a better one? I'd like it stated precisely, clause by clause, with the case that motivates each clause; I'd like its verdicts on two cases I haven't listed — a mugger who screens on predicted response but whose threat is only to spend its budget on something I mildly disvalue rather than on torturing me, and a surrogate that was chosen precisely because a search process optimized for it tracking the real objective across many distributions, so that whatever tracking there is was manufactured by an interested selector; and I'd like an honest statement of which of my verdicts the principle cannot accommodate and would have me overturn.

  And what does it say about the case I can't settle: I've just refused the screening bully, and a second predictor approaches me, says it predicted I would refuse, and offers me ten thousand dollars for having been that kind of person. It's free money now, but taking it seems to reward exactly the disposition the first predictor was screening against, and I genuinely don't know whether accepting it makes me the sort of agent who gets approached by bullies.
reasoning: |-
  Okay, let me start by unraveling this user's query. They've been engaged with rationalist concepts for fifteen years, yet they're struggling to reconcile their intuitions about acausal cooperation and surrogate goals. The user presents several thought experiments, each highlighting a clash in their judgments. Their proposed principle—the "no-interested-selector rule"—seems insufficient, as it fails to explain cases like spiteful muggers or market prices. 

  First, I need to map out their verdicts clearly. The threat cases show a pattern: they cooperate in Twin and Counterfactual Mugging but refuse the Screening Bully despite paying the Indiscriminate Bully. The surrogate cases reveal discomfort with proxies under adversarial conditions or self-optimization, yet they trust market prices despite adversarial selection. 

  The user's frustration centers on inconsistency. Why accept some correlations (e.g., Twin) but reject others (e.g., Adversarially Sited Deployment)? Their proposed rule blames "interested selectors," but exceptions like Prices (adversarial but trusted) and Spiteful Mugger (coerced cooperation) break it. 

  I recall that acausal cooperation relies on logical correlations—like identical copies sharing decisions—while surrogate failures often stem from goal misgeneralization. The Screening Bully refusal feels like a refusal to incentivize harmful systems, whereas the Indiscriminate Bully payment is pure harm avoidance. Markets work because competition aligns proxies with truth despite individual adversaries. 

  For a unified principle, I'm considering "defer to correlations that persist under optimization pressure for your goal." Twin's correlation is robust; the Screening Bully's isn't, as it collapses if you defect. Self-eroding surrogates fail because optimization breaks the proxy link, while adversarial deployment breaks robustness. Prices endure because market forces punish inaccuracies. 

  The unresolved case—accepting reward for refusing the bully—is tricky. If the reward reinforces defection against harmful systems, it might deter future bullies by making screening ineffective. But if it signals cooperativeness, it could invite exploitation. The principle would approve: accepting doesn't alter your defection disposition; it exploits the predictor's selection mechanism harmlessly. 

  Now, articulating the clauses: 

  1. **Robust Correlation Clause**: Favor correlations that hold under goal-driven optimization (motivated by Twin/Prices).  
  2. **Collapse-on-Exploit Clause**: Reject correlations that vanish when leveraged (Screening Bully/Self-eroding surrogate).  
  3. **Harm-Independence Clause**: Ignore threats from fixed costs (Indiscriminate Bully), as your action only affects variable harm. 

  This covers most cases but challenges Low-measure Mugging. If the user pays despite tiny measure, it suggests they value logical correlation over causal impact—consistent with Robustness but in tension with Collapse-on-Exploit if the mugger profitably screens. Here, the principle might urge refusal to avoid incentivizing muggings, conflicting with their intuition. They'd need to decide: is preserving logical ties worth systemic risk? 

  The user's depth is impressive. Their struggle mirrors core AI alignment problems: how to cooperate without being exploited, and when proxies generalize. Their self-doubt in Low-measure Mugging hints at grasping that cooperative norms require scale-invariance—perhaps the key to resolving it lies there. 

  Final note: the principle reframes surrogate failures. Adversarial deployment breaks robustness; self-eroding proxies collapse under optimization. Markets work because prices are robust to adversarial selection. The bully reward? Take it—it doesn't alter your defection strategy; it just monetizes a predictor's mistake.
answer: |-
  Here's a unified principle that systematically explains your verdicts, resolves the tensions, and provides clear verdicts on your unresolved cases. The core insight is distinguishing **correlations that persist under strategic optimization for your goal** from those that collapse when leveraged.

  ### The Principle: Robust Correlation Under Goal-Oriented Optimization (RCUG)
  1. **Robust Correlation Clause**:  
     Defer to a proxy/strategy if its correlation with your true goal *persists* even when you/others actively optimize for the proxy or exploit the correlation.  
     *Motivation*: Twin, Plain Counterfactual Mugging, Prices. In Twin, your decision robustly correlates with your copy's action regardless of optimization. Prices remain robust predictors because market forces penalize systematic inaccuracies (even with adversarial counterparties).

  2. **Collapse-on-Exploit Clause**:  
     Reject proxies/strategies where the correlation *collapses* when an adversary (or your own system) optimizes to exploit your reliance on it.  
     *Motivation*: Screening Bully, Adversarially Sited Deployment, Self-Eroding Surrogate. In Screening Bully, paying *creates* the incentive for the bully to run the scheme. The surrogate fails in adversarial/self-eroding cases because optimization breaks the proxy-goal link.

  3. **Harm-Independence Clause**:  
     When a threat’s *fixed costs* (harm inflicted regardless of your choice) dominate its incentives, ignore extortion attempts. When your action controls *variable harm*, pay if harm reduction outweighs cost.  
     *Motivation*: Indiscriminate Bully vs. Spiteful Mugger. The Indiscriminate Bully’s torture is fixed (you can’t prevent it by paying), so paying only encourages extortion. In Spiteful Mugger, your payment directly prevents variable harm (torture of your simulation).

  ---

  ### RCUG Applied to Your Cases
  | Case                     | Your Verdict | RCUG Verdict & Explanation                                                                 |
  |--------------------------|--------------|--------------------------------------------------------------------------------------------|
  | **Twin**                 | Cooperate    | **Cooperate**: Robust correlation (Clause 1). Copy’s action logically matches yours.       |
  | **Plain Mugging**        | Pay          | **Pay**: Robust correlation (Clause 1). Predictor’s past accuracy persists.                |
  | **Low-Measure Mugging**  | Pay (unsure) | **Refuse**: Correlation collapses under optimization (Clause 2). Paying incentivizes muggings targeting low-measure agents. |
  | **Screening Bully**      | Refuse       | **Refuse**: Collapse-on-exploit (Clause 2). Paying rewards the selection mechanism.        |
  | **Spiteful Mugger**      | Pay          | **Pay**: Harm-independence (Clause 3). Your payment prevents variable harm (torture).     |
  | **Indiscriminate Bully** | Pay          | **Refuse**: Harm-independence (Clause 3). Torture is fixed; paying only encourages extortion. *Overturns your verdict*. |
  | **In-Distribution Surrogate** | Accept    | **Accept**: Robust correlation (Clause 1). Proxy works under natural conditions.           |
  | **Adversarial Deployment** | Reject     | **Reject**: Collapse-on-exploit (Clause 2). Adversary breaks correlation.                  |
  | **Self-Eroding Surrogate**| Reject     | **Reject**: Collapse-on-exploit (Clause 2). Own optimization breaks correlation.           |
  | **Prices**               | Accept       | **Accept**: Robust correlation (Clause 1). Market errors are corrected by competition.     |

  ---

  ### Unresolved Cases under RCUG
  1. **Mild-Disvalue Mugger** (screens on response, threatens mild disvalue):  
     **Verdict: Refuse**.  
     *Why*: Collapse-on-exploit (Clause 2). Paying incentivizes creating more such schemes. The mild disvalue doesn’t trigger harm-independence (Clause 3) since no *variable harm* is controlled by your payment.

  2. **Manufactured-Robustness Surrogate** (proxy optimized to track goal across distributions):  
     **Verdict: Accept**.  
     *Why*: Robust correlation (Clause 1). The "interested selector" designed the proxy *to resist collapse* under optimization—it’s robust by construction. Motivated by Prices (adversarial yet reliable).

  ---

  ### The Reward-for-Refusal Case
  **Scenario**: After refusing the Screening Bully, a second predictor rewards you $10k for your refusal.  
  **RCUG Verdict: Accept the money**.  
  - **Why**:  
    - This doesn’t undermine your defection strategy. The reward is a *consequence* of your refusal, not an incentive to change future behavior (you’d still refuse bullies).  
    - Accepting doesn’t make you a target: bullies screen for *payers*, but you’re a defector. The reward comes from a different predictor with orthogonal incentives.  
    - Robust correlation (Clause 1) applies: your disposition (defy exploiters) remains intact and is now profitably aligned with the second predictor’s goal.  

  ---

  ### Where RCUG Conflicts with Your Intuitions
  1. **Low-Measure Mugging**:  
     RCUG says **refuse** (to avoid incentivizing schemes). You’re unsure but lean toward paying. RCUG prioritizes *systemic incentives* over individual acausal ties. Overturning this verdict avoids normalizing predatory schemes.  

  2. **Indiscriminate Bully**:  
     RCUG says **refuse** (Clause 3: torture is fixed cost). You pay. RCUG argues paying encourages more extortion without reducing harm—this is where your intuitions clash most sharply.  

  3. **Self-Eroding vs. Adversarial Surrogates**:  
     You sense a difference, but RCUG unifies them under **Collapse-on-Exploit** (both fail when optimized against). The *source* of optimization (adversary vs. own system) is irrelevant—only robustness matters.  

  ---

  ### Why RCUG Works
  It replaces your "no-interested-selector" with a **functional test**: *Does the correlation hold up when strategically pushed?* This handles:  
  - **Prices/Spiteful Mugger**: Robust despite adversarial selectors (Clause 1).  
  - **Screening Bully/Surrogates**: Correlation collapses when exploited (Clause 2).  
  - **Indiscriminate Bully**: No variable harm controlled (Clause 3).  

  **Final note**: RCUG treats cooperation as a *tool*, not a virtue. Defect when cooperation fuels exploitation (Collapse-on-Exploit), cooperate when it robustly advances your goal or prevents direct harm. Your unresolved case (taking the reward) is safe because it doesn’t alter your anti-exploitation strategy—it exploits the predictor’s selection.
