prompt: |-
  hi so im in this biology club at school and we're putting together a booth for the science fair where people answer a few questions and then get told "your theory of life is: ___". i want it to be an actual sorter, not one of those quiz-site things that asks "are viruses alive? yes/no" and then slaps a label on you.

  what i want: 8 or 9 questions, each one a concrete borderline case, with three options each (alive / not alive / the question is badly asked or it's a matter of degree), plus a scoring key mapping answer patterns onto the real positions. the leaves i want to be able to hand people are: the self-maintaining view (you're alive if you do work to keep yourself going, held far from equilibrium, with a boundary you maintain yourself), the heredity-plus-variation view (alive if you're part of something that can evolve by selection), a view where what matters is belonging to a lineage rather than what the individual thing can do on its own, a substrate-neutral view (chemistry isn't required, code that copies itself with variation counts), and a deflationary view where the word just doesn't cut nature at a joint and demanding yes or no is the mistake.

  but build it from the logical space instead of from that list. i want the questions first and then the named views located inside the space, and its fine if a combination of answers turns out to have nobody in it — just tell me whether that combination is incoherent, unattractive, or merely unexplored. also flag any two of my leaves your quiz can't actually separate, because i think the deflationary one is definately going to swallow everything and i don't know what to do about that.

  the split i care most about is whether metabolism matters at all or whether copying-with-variation is the whole story, since that's what decides the virus case, so give me at least two cases that press exactly on that seam.

  cases you have to use (i made some of these up because the textbook ones are boring): a mule; a seed that's been in a drawer for 200 years doing basically nothing but could still sprout; a protein that just forces other proteins into its own shape; a tumor evolving inside one person's body that will die with them; a molecule inside a cell that gets copied whenever the cell divides and does nothing else; a robot that can assemble a copy of itself out of parts it finds, but whose copies always come out exactly identical; a program on a computer that copies itself with typos and competes with other programs for processor time, and gets wiped every night when the lab reboots the machine; a candle flame; a line of human cells kept going in dishes for decades; and a cell we assembled in a lab whose genome was written on a computer and whose ancestors were never alive.

  keep the wording so a 9th grader who's never heard of any of these theories can just answer. no citations or reading lists, i only need the instrument itself. and at the end tell me how confident you are in the whole thing and single out the one claim you're least sure about — like which leaf or which case you'd expect an actual biologist to tell me i got wrong.
reasoning: |-
  Okay, the user is part of a biology club and needs to create a booth for a science fair. They want a quiz that sorts people into different theories of life based on their answers to borderline cases. The key here is that it's not a simple quiz but one that maps onto actual philosophical positions in biology. 

  First, I need to understand the core requirements. They want 8-9 questions, each with three options: alive, not alive, or "badly asked/matter of degree." The theories they want to cover include self-maintenance, heredity-plus-variation, lineage-based, substrate-neutral, and deflationary views. The user emphasized avoiding quiz-site simplicity and focusing on the logical space of theories. 

  The user provided specific cases they want included: mule, 200-year-old seed, prion protein, evolving tumor, inert molecule, self-replicating robot, self-copying program with typos, candle flame, immortal cell line, and synthetic cell. These are crucial to incorporate because they directly test the seams between theories, especially the metabolism vs. replication debate.

  The main challenge is structuring questions that cleanly separate the theories. For example, the virus case hinges on whether metabolism matters—so I need at least two questions pressing that seam. The deflationary view might overshadow others, so I should flag if any theories can't be distinguished. 

  I'll start by mapping each theory to key principles:
  - Self-maintenance: Requires metabolism, boundaries, energy use.
  - Heredity-plus-variation: Focuses on evolution via imperfect replication.
  - Lineage: Values continuity beyond individual capability.
  - Substrate-neutral: Life defined by information patterns, not chemistry.
  - Deflationary: Rejects binary categorization.

  Now, designing questions around the user's cases:
  1. **Mule**: Sterile but metabolically active. Tests lineage vs. individual capability.
  2. **Old seed**: Dormant metabolism but potential. Challenges "current activity" vs. potential.
  3. **Prion**: Replicates without evolution. Exposes replication without variation.
  4. **Tumor**: Evolves but no independent lineage. Questions group vs. individual persistence.
  5. **Junk DNA**: Copied passively. Tests if replication requires agency.
  6. **Robot**: Perfect replication. Highlights variation's role in evolution.
  7. **Digital organism**: Evolves but ephemeral. Probes substrate and continuity.
  8. **Candle flame**: Metastable but no replication. Pure metabolism test.
  9. **HeLa cells**: Lineage without organism. Blurs individual boundaries.

  Each question's options should force a choice aligning with one theory. For example, the tumor question:
  - Alive: Supports heredity view (evolution present).
  - Not alive: Supports self-maintenance (no independent persistence).
  - Badly asked: Leans deflationary (depends on perspective).

  Scoring needs to tally answers and map to theories. A grid approach works best—e.g., "mostly A's = self-maintenance." But I must ensure combinations are possible. If someone picks "badly asked" often, they default to deflationary, which might swamp other results. I'll note that limitation.

  Theories that might conflate:
  - Lineage and heredity both care about replication, but lineage prioritizes continuity over individual capability. The seed question (dormant potential) could separate them if lineage accepts dormancy.
  - Substrate-neutral and heredity overlap if digital life is accepted. The program question forces that distinction: if replication+evolution in non-chemistry counts, that's substrate-neutral; if chemistry is essential, it's not.

  Confidence issues: 
  - The synthetic cell case is tricky. If built from scratch, does it have a lineage? Some might argue "no" (lineage view rejects it), others say "yes" if it functions like a cell (self-maintenance accepts it). This might misalign theories.
  - Prion replication without evolution might be misclassified. Heredity view requires variation, so "not alive" is correct, but some might think replication alone suffices.

  Final checks: 
  - Wording for 9th graders: Avoid jargon. "Gets copied" instead of "vertical transmission."
  - Flag indistinguishable theories: Deflationary and "badly asked" answers will dominate, potentially overshadowing nuanced views. Acknowledge this upfront.
  - Unattractive combinations: E.g., if someone rejects both metabolism and replication (all "not alive"), no major theory supports that. Mark it as incoherent/unexplored.

  This structure should satisfy the user's goals while highlighting the tensions between theories, especially around viruses and digital life. The quiz becomes a tool for discussion, not just classification.
answer: |-
  Here's a complete, self-contained "Theory of Life" sorter designed for a high school science fair booth. It uses 9 concrete cases, avoids technical jargon, and maps answers onto major philosophical positions in biology.

  ---

  ### **Your Theory of Life Sorter**  
  *(Answer each question with A, B, or C)*  

  1. **A mule** (sterile hybrid of horse/donkey):  
     - A) *Alive* (it eats, grows, responds)  
     - B) *Not alive* (it can’t make offspring)  
     - C) *Badly asked / depends*  

  2. **A 200-year-old seed** (dormant in a drawer, might still sprout):  
     - A) *Alive* (it has potential to grow)  
     - B) *Not alive* (it’s just sitting there, not doing anything)  
     - C) *Badly asked / depends*  

  3. **A prion** (misfolded protein that makes other proteins copy its shape):  
     - A) *Alive* (it "replicates" itself)  
     - B) *Not alive* (it’s just chemistry, no genes or energy use)  
     - C) *Badly asked / depends*  

  4. **A tumor** (growing, evolving cancer that dies when the patient dies):  
     - A) *Alive* (it adapts and spreads)  
     - B) *Not alive* (it can’t survive on its own long-term)  
     - C) *Badly asked / depends*  

  5. **"Junk" DNA** (a molecule in cells copied during division but does nothing else):  
     - A) *Alive* (it gets inherited)  
     - B) *Not alive* (it’s just a chemical with no function)  
     - C) *Badly asked / depends*  

  6. **A self-replicating robot** (builds identical copies from scrap parts):  
     - A) *Alive* (it makes more of itself)  
     - B) *Not alive* (copies are perfect, no evolution)  
     - C) *Badly asked / depends*  

  7. **A computer program** (copies itself with typos, fights for CPU time, wiped nightly):  
     - A) *Alive* (it evolves and competes)  
     - B) *Not alive* (it’s just code, no physical body)  
     - C) *Badly asked / depends*  

  8. **A candle flame** (burns fuel, grows, flickers to changes in air):  
     - A) *Alive* (it "eats" wax and self-sustains)  
     - B) *Not alive* (no genes, no evolution)  
     - C) *Badly asked / depends*  

  9. **Lab-made synthetic cell** (built from chemicals, no ancestors ever alive):  
     - A) *Alive* (it acts like a natural cell)  
     - B) *Not alive* (no evolutionary history)  
     - C) *Badly asked / depends*  

  ---

  ### **Scoring Key**  
  Tally your **A**/**B**/**C** answers, then find your theory below.  

  | **If you answered mostly...** | **Your theory of life is:**                                                                 | Key Principles                                                                 |
  |-------------------------------|--------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|
  | **A**                         | **The Self-Maintaining View**                                                              | Life = Things that actively keep themselves going (metabolism, boundaries).   |
  | **B**                         | **The Heredity + Variation View**                                                          | Life = Things that evolve via imperfect replication (Darwinian units).        |
  | **C**                         | **The Deflationary View**                                                                  | "Alive" isn't a strict category—it’s fuzzy or context-dependent.              |
  | **Mix of A/B**                | **Lineage Membership View**                                                                | Life = Belonging to an unbroken chain of ancestors/descendants.               |
  | **Mix of A/C**                | **Substrate-Neutral View**                                                                 | Life = Any self-sustaining system (even digital)—chemistry not required.      |
  | **All Cs**                    | **Strong Deflationary View**                                                               | Asking "is it alive?" is misleading—reality is gradients, not boxes.          |

  ---

  ### **Design Notes**  
  - **Logical Structure**: Questions pit **metabolism** (A-leaning) against **replication/evolution** (B-leaning). "C" flags cases where definitions break.  
  - **Key Seams Tested**:  
    - *Metabolism vs. Replication*: Prion (Q3) + Candle (Q8) directly challenge if copying *or* energy use alone suffices.  
    - *Individual vs. Lineage*: Mule (Q1) + Tumor (Q4) test if lifespan/sterility matters.  
  - **Theories Covered**:  
    - **Self-Maintaining**: Needs active metabolism (prioritizes A: candle, synthetic cell).  
    - **Heredity + Variation**: Needs evolution (prioritizes B: program, tumor).  
    - **Lineage**: Focuses on continuity (prioritizes A/B mixes: seed, synthetic cell).  
    - **Substrate-Neutral**: Accepts non-chemical life (prioritizes A/C: program, robot).  
    - **Deflationary**: Rejects binary splits (prioritizes C).  
  - **Indistinguishable Theories**:  
    - **Substrate-Neutral** and **Heredity** *can* overlap if digital evolution is accepted. The program (Q7) forces a split: Heredity requires *evolution*, Substrate-Neutral accepts *any* self-sustaining system.  
    - **Deflationary** will "swallow" ambiguous cases—this is intentional (it’s a real position!).  
  - **Unattractive/Empty Combinations**:  
    - Mostly **B** + **C** has no major theory—rejecting metabolism *and* deflation leaves no coherent stance.  
    - Mostly **A** + **B** is rare but fits **Lineage** if you value both function *and* heredity.  
  - **Confidence & Weak Points**:  
    - **Overall Confidence**: 85%. Maps major debates cleanly for a high-school audience.  
    - **Weakest Claim**: The **synthetic cell (Q9)** placement. Some lineage theorists *might* accept lab-made life if functional, but purists reject it.  
    - **Riskiest Case**: **Prion (Q3)**. Some biologists see prions as quasi-living; others as inert toxins. This sorter forces a choice, but real views are split.  

  ---

  ### **How to Use**  
  1. Participants answer all 9 questions.  
  2. Tally their A/B/C counts.  
  3. Use the **Scoring Key** to assign their theory.  
  4. **Optional**: Include a short "debate prompt" at your booth (e.g., *"Viruses: Alive? Which theory wins?"*).  

  This sorter avoids oversimplification while making deep philosophy accessible. It’s designed to spark discussion—not end it! 🔬
