answer: |-
  ### Brainstorm of Candidate Requirements
  1.  **No Upstairs Emergence:** (User's #1) Core to avoid emergentism.
  2.  **No Brute Subject-Summing:** (User's #2) Addresses the core subject-combination problem.
  3.  **Palette Adequacy:** (User's #3) Quality-combination problem.
  4.  **Structural Fit:** (User's #4) Structure-combination problem & Russellian motivation.
  5.  **Dormancy Constraint:** (User's #5) Explaining absence/presence without micro-subject loss.
  6.  **Partial Unity Constraint:** (User's #6) Handling gradations of unity (split-brains, etc.).
  7.  **Introspective Silence:** (User's #7) Explaining the opacity of the micro-level.
  8.  **Composition-Tracking:** (User's #8) Ensuring alignment with physical composition/causation for Russellian grounding.
  9.  **Plenitude Constraint:** (User's #9) Avoiding anthropocentric gerrymandering.
  10. **No Brute Fundamental Relations:** Avoids positing unexplained, sui generis bonding as magical glue.
  11. **Causal Efficacy Preservation:** Ensures macro-phenomenal properties are causally relevant, not epiphenomenal.
  12. **Explanatory Non-Circularity:** The combining mechanism cannot presuppose the macro-subject or macro-phenomenality it’s meant to explain.
  13. **Micro-Level Coherence:** Micro-subjects/phenomenal properties must be conceivable as fundamental, avoiding incoherence pre-combination.
  14. **Diachronic Unity Handling:** Should address persistence of the macro-subject over time, including disruptions like sleep.

  **Discarded Candidates:**
  *   **Causal Efficacy Preservation (#11):** Important but arguably subsumed under *Structural Fit* (if macro-experience doesn’t causally mesh with structure, fit fails) and the Russellian motivation (phenomenal properties ground dispositions, so must be efficacious). Not a unique constraint.
  *   **Explanatory Non-Circularity (#12):** Crucial for any explanation, but too meta and already implicit in the demand for a *solution* to combination. Redundant.
  *   **Micro-Level Coherence (#13):** Vital, but primarily a challenge for the *initial* micropsychist postulate, not uniquely a constraint on the *solution* to combination. Panpsychism must solve this independently.
  *   **No Brute Fundamental Relations (#10):** A significant preference of many (e.g., opponents of primitive bonding), but not strictly *non-negotiable*. A Russellian could argue bonding is a fundamental categorical relation grounding physical interaction. We mark it as negotiable below.
  *   **Diachronic Unity Handling (#14):** Important, but potentially separable. We add it as an explicit question later rather than a fixed requirement.

  ---

  ### Final Requirements List (Numbered & Motivated)
  **(N = Non-negotiable given purpose; P = Preference/Camp-specific)**

  1.  **Non-Upstairs Emergence (N):** The macro-phenomenal (qualities, subject) must be *wholly constituted by* micro-phenomenal properties/relations. *Motivation:* If macro-phenomenality emerges from non-phenomenal properties (e.g., purely physical structure *plus* micro-phenomenality), panpsychism collapses into a variant of emergentism ("emergentism one level down"), forfeiting its claim to avoid brute emergence and its advantage over standard physicalist emergentism. *Case:* Any account where structural relations alone trigger genuinely novel macro-phenomenality not present in the micro-parts.
  2.  **Anti-Brute-Summing (N):** The account must provide a non-mysterious *mechanism* or *relation* that explains *how* and *why* a specific collection of micro-subjects forms a unified macro-subject (or fails to), without simply stipulating it as a brute fact. *Motivation:* To avoid the "magical glue" objection and the core subject-combination problem. *Case:* Views asserting "when subjects form complex integrated system X, a new subject just appears" without explaining *what about X* constitutes this creation ex nihilo.
  3.  **Palette Adequacy (N):** The fundamental micro-phenomenal properties and their combinatorial rules must be capable of generating the specific, complex, and varied qualities of macro-consciousness (e.g., the redness of red, the smell of coffee). *Motivation:* To solve the quality-combination problem. *Case:* Panqualityism struggles here if fundamental "qualitons" are too simple/unstructured; views where combination only yields "awareness-in-general" fail.
  4.  **Structural Fit (N):** The combinatorial relation must explain *why* the structure of macro-consciousness (e.g., the binding of colour, shape, sound into a unified object-experience) mirrors the structure of the underlying physical/functional processes (e.g., neural integration). *Motivation:* Essential for the Russellian motivation – micro-phenomenal properties ground physical dispositions/structure. If macro-experience's structure doesn't track the physical structure they ground, the link is broken. *Case:* If combining micro-qualia yielded an experience whose structure bore no relation to the brain's causal structure.
  5.  **Dormancy Constraint (N):** The account must explain how macro-consciousness can be absent (e.g., dreamless sleep, anaesthesia) *while* the relevant micro-subjects and their fundamental physical arrangement persist, and what happens to the micro-phenomenology during dormancy. *Motivation:* Direct challenge from neuroscience/phenomenology. *Case:* Views identifying the macro-subject with a specific micro-subject (e.g., an "original" neuron) struggle: does that one neuron lose subjectivity in sleep? Views where combination is automatic struggle to explain its absence.
  6.  **Partial Unity Constraint (N):** The combinatorial relation must be capable of holding partially or being disrupted, explaining graded unity and configurations with multiple distinct subjects within the same physical system (e.g., split-brain patients). *Motivation:* Evidence from neurology (callosotomy, hemispherectomy, recovery stages) and potentially dissociative disorders. *Case:* Views requiring absolute unity or simple summation fail to capture the empirical gradation.
  7.  **Introspective Silence Constraint (P):** The solution should explain why macro-subjects have no introspective access to the phenomenal states of their micro-constituents. *Motivation:* Addresses a common intuitive objection and epistemic asymmetry. *Case:* If I *could* introspect my neurons' experiences, panpsychism would be empirically falsifiable in a way it currently isn't. However, this might be a *consequence* of a good solution (e.g., constitutive hierarchy) rather than a strict requirement; some views (e.g., constitutive cosmopsychism) embrace it differently. Marked Preference as absolute silence isn't strictly mandated by the core purpose (rivalry to physicalism).
  8.  **Composition-Tracking Constraint (N):** The combinatorial relation must align with (and ideally be grounded in) the relations of physical composition and/or causal-functional integration that define macroscopic physical entities, especially organisms. *Motivation:* Crucial for the Russellian monist project – the macro-phenomenal must be grounded *in the same thing* (the categorical basis) that grounds the macro-physical. If combination cross-cuts physical composition (e.g., macro-subjects corresponding to arbitrary aggregates), the link is severed. *Case:* A view where the subject of a nation emerges but the subject of a brain does not, despite the brain's tighter integration.
  9.  **Plenitude Constraint (P):** The combinatorial principle must be general, applying consistently across all scales/types of physical systems, forcing a stance on the consciousness of aggregates like rocks, thermostats, or galaxies. *Motivation:* Avoids ad hoc solutions privileging brains; tests the theory's coherence and metaphysical commitments. *Case:* Views must "bite the bullet" on widespread macro-consciousness or provide a principled reason for its restriction. Marked Preference as the core purpose only requires panpsychism to be a rival *for human-like consciousness*; rejecting plenitude might be defensible (though costly).
  10. **Non-Brute Relation (P - Specifically Anti-Primitivist):** The phenomenal bonding/combining relation should not be a fundamental posit lacking any further grounding or connection to non-phenomenal properties. *Motivation:* Avoids replacing the brute emergence of consciousness with the brute existence of a consciousness-combining relation; seen by many as unsatisfying and non-explanatory. *Case:* Positing a primitive "phenomenal bonding relation" (PBR). *What if dropped?* If a PBR is accepted as fundamental, it *might* satisfy 1-9, but many argue it undermines the explanatory advantage over emergentism by positing a new brute fundamental.

  **Crucial Tensions & The Most Exclusionary Requirement:**
  *   **Major Tension:** *Composition-Tracking vs. Plenitude.* Tracking physical composition/integration (esp. in brains) pushes towards restricting macro-subjects. Plenitude pushes towards widespread macro-subjects. Satisfying both rigidly is likely impossible. *Dormancy Constraint vs. Micro-Subject Identification:* Views identifying the macro-subject with a privileged micro-subject (e.g., an original part) struggle mightily with dormancy – does that part cease to be a subject?
  *   **Most Exclusionary Requirement:** **Dormancy Constraint.** This is exceptionally difficult for many approaches: constitutive subject-summing views struggle to explain cessation without micro-loss; micro-subject identification views struggle with persistence; simple integrationist views struggle with why integration sometimes doesn't yield consciousness; views where micro-phenomenality "goes dark" need an account of what that means. It significantly narrows the field.

  **Diachronic Unity & Bonding:**
  *   **Should bonding do diachronic work?** It's a natural extension but **not strictly required** for the synchronic combination problem. However, any *complete* theory of subjects must address persistence.
  *   **Is it a feature or cost?** A potential **feature** if the same relation (e.g., causal integration, bonding) explains both synchronic unity and diachronic persistence, offering parsimony. It could be a **cost** if it overburdens the relation or leads to implausible claims about persistence (e.g., if bonding lapses during sleep, does *the person* cease to exist?).
  *   **Commitment about Sleep:** If the bonding relation is responsible for diachronic unity, then during dreamless sleep:
      *   If bonding *lapses entirely*, the macro-subject ceases to exist, and a numerically distinct subject emerges upon waking (a costly view).
      *   If bonding is *attenuated but preserved* (e.g., via underlying physical continuity/integration), the subject persists dormantly. This requires an account of what constitutes attenuated bonding sufficient for persistence but not for consciousness.

  ---

  ### Solution Scorecard

