  | :----------------------------- | :-------------- | :------------ | :--------- | :------------ | :---------- | :--------------- | :---------------- | :------------ | :----------- | :---------------- | :------------------------------------------------------------------------------------------------------------------------------------ |
  | **Primitive Bonding (PBR)**    | ✓ (N)           | ✗ (N)         | ?          | ?             | ✗           | ✓                | ?/✓               | ?             | ?            | ✗ (P)             | Brute summing (fails 2). Bonding itself is brute (fails 10). Why bonding lapses in sleep? (fails 5). Palette/Fit unclear. Plenitude unclear. Intro silence plausible. |
  | **Panqualityism**              | ?               | N/A           | ✗ (N)      | ?             | ?           | ?                | ✓ (P)             | ?             | ?            | ?                 | Solves subject-summing by eliminating micro-*subjects*. Struggles badly with Palette (how do non-subjective qualia combine to form subjective qualities?). Composition-tracking/dormancy challenges remain. |
  | **Cosmopsychism (Decomb)**     | ✓ (N)           | ?             | ✓ (N)      | ✓ (N)         | ✓ (N)       | ?                | ✗ (P)             | ✗ (N)         | ✗ (P)        | ?                 | Avoids micro-combination (decombines cosmos). Fails Composition-Tracking (macro-consciousness doesn't track *brain* composition). Plenitude extreme (one subject). Intro silence violated (cosmic mind?). Decombination mechanism often brute. |
  | **Attenuation View**           | ✗ (N)           | ✓ (N)         | ?          | ✓ (N)         | ✓ (N)       | ✓ (N)            | ✓ (P)             | ✓ (N)         | ✗ (P)        | ?                 | **Fails Core:** Not micropsychist panpsychism. Micro-subjects exist but macro-subject is *realised by* (not composed of) integrated collection (violates 1 - Upstairs Emergence). Thresholds feel emergentist. Plenitude rejected (brains only). Otherwise strong on 5,6,8. |

  **Attenuation View Assessment:**
  *   **Is it Panpsychism?** **No, not strictly.** It is a form of **Emergentist Panprotopsychism**. Micro-phenomenal properties are fundamental, but macro-*subjects* (and arguably complex macro-phenomenal *unity*) emerge from the causal integration of micro-subjects. While micro-subjects are conscious, the unified macro-conscious subject and its specific structure are *not* wholly constituted by the micro-phenomenal facts alone; the specific form of causal integration is doing essential work not reducible to the micro-phenomenal properties/relations. This violates *Non-Upstairs Emergence* (1). It relocates emergentism down to the micro-level interaction.
  *   **Requirement that Kills it:** **1. Non-Upstairs Emergence.** The emergence of the macro-subject (as a subject of unified experience) from the organised interactions of micro-subjects, where the organising relations (causal integration density) are not themselves fully grounded in micro-phenomenal properties, constitutes brute upstairs emergence. The macro-subject is an additional entity/level of phenomenality not present in the parts.
