  First, I need to assess the user's modification. The cortical stimulator does seem to block the standard "ability" objection. If Mary can simulate the experience of red, then her gaining an actual experience shouldn't just be about acquiring a new ability. That's a solid move.

  But the friend's point about modes of presentation is crucial. Physicalists like David Lewis or Laurence Nemirow might say Mary gains familiarity with the same physical facts via new representations. The fact itself is physical, but now she knows it under a subjective guise. The user sees this as wordplay, but it's a legitimate counter. 

