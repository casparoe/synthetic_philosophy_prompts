prompt: |-
  writing a short undergrad paper on the Mary's room argument and I want to settle one thing before I commit to the structure. My setup: Mary knows every physical fact about colour vision before she leaves the room; when she first sees red she learns something new; so there are non-physical facts and physicalism is false. I've also added a stipulation to kill the "she only gained an ability, not knowledge" reply — before she's released she's fitted with a cortical stimulator that lets her produce any experience in imagination, so she can already imagine, remember and recognise red without ever having seen it. That reply is dead then, right? My friend says that even granting all of it I still havent refuted physicalism, because the new fact could be an old physical fact she now knows under a new guise, or a fact that's necessitated by the physical facts without being derivable from them. That sounds like word games to me: she knew all the physical facts and now knows a fact she didnt know, so that fact isnt a physical fact, full stop. Who's right, and what's the extra premise (if any) that I need to actually get to dualism instead of just to something a physicalist can happily accept?
