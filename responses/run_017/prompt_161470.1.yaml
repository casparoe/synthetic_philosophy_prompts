answer: |-
  You've constructed a powerful version of the Mary argument, and your cortical stimulator addition effectively neutralizes the standard "ability/know-how" objection. However, your friend is pointing out a crucial nuance in the physicalist toolkit: **the "Old Fact/New Mode" or "Conceptual Gap" defense.** Let's break down who's right and what you need.

  1.  **Your Core Argument is Strong:**
      *   P1: Before release, Mary knows *all* physical facts about color vision (including neurophysiology, light waves, etc.).
      *   P2: Before release, the cortical stimulator allows her to have the *subjective experience* of red (and recognize it) without external stimuli. (This blocks "ability/know-how").
      *   P3: Upon actually seeing red for the first time, Mary learns *something new* (e.g., what it's *really like* to see red, even experientially identical to her stimulator experience).
      *   C1: Therefore, what Mary learns upon seeing red is a *new fact*.
      *   C2: Since she already knew *all* physical facts (P1), this new fact (C1) is a *non-physical fact*.
      *   C3: Therefore, physicalism (which claims all facts are physical facts) is false.

  2.  **Your Friend's Physicalist Rebuttal (The "Old Fact/New Mode" Defense):**
      *   Physicalists like David Lewis or Laurence Nemirow argue: "Yes, Mary learns something *new*, but she doesn't learn a *new fact*. She gains a *new way of apprehending* or *representing* an *old physical fact* that she already knew *under a different description*. She gains a *new conceptual capacity* or *phenomenal concept* for the same physical state."
      *   **Analogy:** Think of knowing water is H₂O via a chemistry textbook (theoretical description) vs. recognizing water by its taste, feel, and appearance (phenomenal/experiential concept). They are different *ways of knowing* the *same physical fact* about the substance. Mary gains the "taste/feel/appearance" way of knowing the *physical* state of her brain when seeing red.
      *   **"Necessitation without Derivability":** Your friend's second point is related. Physicalists can argue that the phenomenal fact *is identical to* a complex physical/functional fact (e.g., a specific neural state N). Mary knew *all about N* under its physical description. Upon experiencing it, she comes to know N *under its phenomenal description*. While the phenomenal description isn't *derivable a priori* from the physical description (there's an "explanatory gap"), the physical fact *necessitates* the phenomenal fact (it's metaphysically identical). The gap is epistemological (about knowledge/concepts), not ontological (about what exists).

  3.  **Who's Right? Both Have Points:**
      *   **You are right** that Mary gains *new knowledge* that wasn't contained in her pre-release database *under phenomenal concepts*. Your cortical stimulator ensures it's not just a new behavioral ability.
      *   **Your friend is right** that a sophisticated physicalist can *consistently* maintain that the *fact known* is still a physical fact, just known under a new phenomenal mode of presentation or concept. They deny that "knowing a fact" requires knowing it under *all possible modes of presentation*. They bite the bullet on the "explanatory gap."

  4.  **The Crucial Missing Premise for Dualism:**
      To definitively conclude **substance/property dualism** (that the new fact is about a non-physical *property* or *entity*), you need an additional premise that blocks this "Old Fact/New Mode" move:

      *   **The "No Equivocation" or "Transparency" Premise:**
          > "If two descriptions or modes of presentation refer to the *same fact* (the same state of affairs in the world), then knowing that fact completely under one description entails knowing it completely under any other description. There is no *further fact* left to learn simply by switching descriptions."

      **How this works in your argument:**
      *   Add this premise.
      *   Mary knew the *complete physical fact* F (the neural state N) under its physical description.
      *   The premise states that knowing F *completely* under the physical description means she knows *everything there is to know about F*, including how it would be represented under *any other* description (like the phenomenal description "what it's like").
      *   But Mary *does* learn something genuinely new upon seeing red – she learns *what it's like*.
      *   Therefore, the "what it's like" cannot merely be a new way of knowing the *old* physical fact F (N). It must be knowledge of a *different fact*, G (the phenomenal property).
      *   Since G is learned only through experience and wasn't contained in her complete physical knowledge, G is a non-physical fact. Hence, dualism is true.

  **Why this Premise is Necessary and Controversial:**

  *   **It targets the core physicalist move:** It denies that phenomenal concepts are merely different ways of accessing the same physical facts. It insists that if a physical fact *were* identical to a phenomenal fact, exhaustive knowledge of the physical fact would *ipso facto* be exhaustive knowledge of the phenomenal fact under *all* descriptions.
  *   **Physicalists reject this premise:** They argue it's false. They maintain that phenomenal concepts are *direct recognitional concepts* tied to the subjective experience itself. You can know everything physical about water/H₂O/N without having the *recognitional capacity* triggered by the experience. Gaining that capacity *is* learning something new *cognitively*, but not learning a new *fact about the world* beyond the physical facts.
  *   **It shifts the debate:** Your argument, with this premise, becomes: "Mary shows there's an *epistemic gap* (she learns something new). The 'No Equivocation' premise implies that this epistemic gap entails an *ontological gap* (a non-physical fact/property)." Physicalists deny the premise, allowing only an epistemic gap compatible with ontological physicalism.

  **Conclusion & Advice for Your Paper:**

  1.  **Acknowledge the Strength:** Clearly state that your cortical stimulator effectively defeats the "ability/know-how" objection. This is good work.
  2.  **Present the Core Argument:** Lay out P1-P3, C1-C3 as you have.
  3.  **Introduce the Physicalist Rebuttal:** Explain the "Old Fact/New Mode" defense clearly and fairly. Cite proponents like Lewis or Nemirow.
  4.  **Identify the Sticking Point:** Explicitly state that the core dispute now hinges on whether Mary's new knowledge represents a genuinely *new fact* or merely a *new way of knowing* an old physical fact.
  5.  **Introduce the Key Premise:** Argue for the "No Equivocation" premise. Explain *why* it's plausible: If facts are states of the world, exhaustive knowledge of a fact should be description-independent. Learning something genuinely new *about the world* upon having an experience suggests the experience reveals an aspect of reality not captured by the physical description alone.
  6.  **Conclude:** With this premise added, your argument successfully demonstrates that Mary learns a non-physical fact, refuting physicalism and pointing towards property dualism (the phenomenal property "what it's like" is distinct from any physical property).
  7.  **Acknowledge Controversy:** Briefly note that physicalists reject this key premise, maintaining that the Mary scenario only reveals a limitation in *how* we conceptualize physical reality, not a limitation in physical reality itself.

  By addressing this "mode of presentation" defense head-on and explicitly adding and defending the "No Equivocation" premise, your paper will be significantly stronger, move beyond the initial objections, and directly engage with the deeper metaphysical dispute at the heart of the Mary argument. Good luck!
