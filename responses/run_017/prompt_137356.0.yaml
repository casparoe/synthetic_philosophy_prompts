prompt: |-
  For a science-and-ideas podcast I host, my next guest is a philosopher of science who defends a lexical reading of Kuhnian incommensurability: on her account what changes in a revolution is a taxonomic lexicon, so rival theories end up untranslatable but not incomparable, incompatibility is not the real issue, and the phenomenon is local and partial rather than global. She also holds that this is consistent with a broadly realist account of reference and with theory choice being rational though not rule-governed.

  Draft nine or ten questions for a forty-minute interview, each followed by a bracketed follow-up keyed to the reply she is most likely to make. Press where the literature actually presses: whether untranslatability can be told apart from ordinary failures of interpretive charity, or from Quinean indeterminacy of translation in historical costume; whether a partial failure of translation is a stable middle ground or quietly collapses into full translatability once a shared base vocabulary survives; whether she can say in what sense successor science is better if there is no common measure of problem-solving success; and whether her reading leaves any daylight between Kuhn and the symmetry thesis in the sociology of scientific knowledge, on which scientific change is caused rather than justified.

  Include one question built around a case I want to put to her directly: a hypothetical revolution in which the successor theory reproduces every observational prediction of its predecessor, both camps use the same vocabulary and the same instruments, and each nevertheless reports that it cannot make sense of what the other side is claiming. Ask what her account predicts about that case and whether she is willing to call it incommensurability; then press her on what a historian would have to observe in order to stop trying to translate and conclude that incommensurability is present rather than that the surviving record is just thin. Close with one question about what observation would count as evidence against her view, and one about why any of this should matter to working scientists rather than only to historians and philosophers.

  Give me the questions themselves: start with the first question, no prefatory note, no restating of the setup, in American English.
reasoning: |-
  Okay, the user hosts a science podcast and needs interview questions for a philosopher of science specializing in Kuhn's incommensurability. The guest has a specific lexical interpretation: taxonomic changes cause untranslatability without incomparability, partial/local effects, realism-compatibility, and non-rule-governed rationality. 

  First, I consider the core tensions the user wants probed: distinguishing untranslatability from Quinean indeterminacy or poor interpretation, whether partial translatability holds or collapses, how progress claims work without common metrics, and potential sociology-of-knowledge overlaps. The hypothetical edge case about identical predictions with communication failure is crucial—it tests the boundaries of her framework. 

  The user also wants two closing pivots: falsifiability (what evidence would undermine her view) and practical relevance to scientists. This suggests they're aiming to push past abstract philosophy into scientific practice. 

  For structure, I'll open with taxonomy's role to ground listeners, then escalate to the hardest theoretical tensions (Quine/translatability collapse) before the hypothetical. The sociology question strategically links to external critiques. Ending on science relevance makes the philosophy feel actionable. 

  Each follow-up anticipates defenses: e.g., when asking about partial translatability, I'll challenge whether shared vocabulary inevitably enables full translation. For the hypothetical, the follow-up forces her to define observable thresholds for declaring incommensurability—making the concept empirically testable. 

  Notably, the user avoids softball questions. Every query targets live debates, so replies must withstand scrutiny from specialists. I'm avoiding restating her position—interviewees prefer engaging critiques over summaries. American English phrasing like "spell that out" keeps it conversational.
answer: |-
  1.  Your core argument is that Kuhnian incommensurability boils down to a change in the *taxonomic lexicon* – the structure of kind-terms scientists use to carve up the world. Why is that the fundamental locus of change, rather than, say, just meanings, beliefs, or paradigms broadly speaking?  
      *[Follow-up: But Kuhn himself linked meaning change to paradigm change holistically. Doesn't isolating the lexicon risk losing that holistic insight about how worldviews shift?]*

  2.  You emphasize that this lexical change leads to *untranslatability*, not necessarily incompatibility. How do you rigorously distinguish this specific untranslatability from more mundane failures of interpretation, or even from Quinean indeterminacy of translation, especially when analyzing historical cases?  
      *[Follow-up: Couldn't a Quinean argue that what you call untranslatability across revolutions is just a more dramatic, historically situated instance of the indeterminacy we always face?]*

  3.  You characterize the untranslatability as *partial* and *local*. If significant shared vocabulary and observational practices survive a revolution, what prevents translating the *apparently* untranslatable bits by leveraging that shared base? Doesn't partial translatability usually imply the *possibility* of full translation with sufficient effort?  
      *[Follow-up: If enough shared vocabulary persists, doesn't the claim of untranslatability for specific terms quietly collapse? How do you block that collapse?]*

  4.  You claim theory choice remains rational despite this untranslatability and the lack of algorithmic rules. But if rival theories classify the world differently (via their lexicons), how can we genuinely compare their problem-solving effectiveness? Doesn't the lack of a common measure of "problem" or "solution" undermine claims of objective progress?  
      *[Follow-up: If problems and solutions are partly defined *by* the lexicon, how can we say the successor solves problems *better* without begging the question in favor of its own framework?]*

  5.  Let me pose a hypothetical case: Imagine a scientific revolution where the successor theory reproduces *every single observational prediction* of its predecessor, both sides use the *same vocabulary* and *same instruments*, yet each camp reports being utterly unable to make sense of the other's core claims. What does your lexical account predict here? Would you call this incommensurability?  
      *[Follow-up: If the vocabularies and predictions are identical, what *could* possibly ground this mutual incomprehension on your view? What observable difference would there be from simple obstinacy or bad faith?]*

  6.  Following that hypothetical: If a historian encountered such a case, or a real historical dispute marked by claims of incomprehension, what specific evidence in the record would convince you it was genuine lexicon-based untranslatability (incommensurability), rather than just incomplete records, poor interpretation, or sociological conflict?  
      *[Follow-up: How can you tell when to stop trying to translate and conclude it's *impossible* because of lexicon structure? What's the observable tipping point?]*

  7.  You argue your reading is compatible with scientific realism. How does reference actually work for kind-terms during a revolution if the taxonomy itself shifts? How do we avoid the threat that reference becomes radically unstable or theory-laden in a way that severs the link to a mind-independent world?  
      *[Follow-up: If the *criteria* for belonging to a kind (e.g., "mass") change fundamentally between Newton and Einstein, in what robust sense does "mass" refer to the *same* entity or property, allowing realism?]*

  8.  Some critics might see your view as uncomfortably close to the "Symmetry Thesis" in Sociology of Scientific Knowledge (SSK), which holds that true and false beliefs should be explained by the same types of (social) causes, downplaying justification. Does your account leave room for saying rational factors *genuinely explain* theory acceptance, beyond just being post-hoc rationalizations?  
      *[Follow-up: If the reasons scientists give for preferring one lexicon over another aren't governed by rules and involve value judgments, how is this fundamentally different from the SSK claim that "rationality" is just the vocabulary of justification used by the winning side?]*

  9.  What specific observation or historical finding would constitute strong evidence *against* your lexical interpretation of incommensurability? What would falsify it, or at least force a major revision?  
      *[Follow-up: Could a demonstration of perfect translation between clearly rival theories post-revolution do it? Or would you reinterpret the case?]*

  10. Finally, stepping back: Why should working scientists, focused on discovery and problem-solving *today*, care about this somewhat esoteric debate over lexical taxonomies and historical untranslatability? What practical insight does it offer them?  
      *[Follow-up: Does recognizing potential incommensurability change how scientists should approach interdisciplinary work, conceptual disputes within their field, or evaluating radically new proposals?]*
