  Okay, the user is preparing for a Q&A session after presenting their paper on infinite ethics. They need a strategy to handle objections from a diverse academic audience. Let me start by understanding their thesis. They're challenging infinitarian paralysis by arguing that impartiality should only require invariance under physical spacetime symmetries, not arbitrary permutations. This allows for a value density approach based on cosmic time.

  First, the audience composition is critical. There are decision theorists, a population ethicist, a mathematical economist, and a cosmologist. Each has specific concerns. The decision theorists will care about representation and uncertainty. The population ethicist will question the denominator choice. The economist might see their symmetry restriction as a disguised ultrafilter. The cosmologist will challenge the physical assumptions like the CMB frame and accelerating expansion.

  The user wants objections ordered by timing and impact. Early objections will likely come from the economist and cosmologist about the physical structure's role. These are high damage because they undermine the foundation. The population ethicist's denominator question is also early and damaging. Decision theorists might come later with representation issues.

  For each objection, I need to phrase it in the questioner's terms. For the economist: Is restricting symmetry just choosing an ultrafilter? Reply: Physical symmetries provide a principled basis, unlike arbitrary ultrafilters. But the soft spot is whether this avoids arbitrariness. For the cosmologist: Is the CMB frame a real foliation? Reply: It's empirically privileged, but concede it's contingent on cosmology. Soft spot: Quantum gravity might change this.

  Preemptive concessions are key. The user should admit upfront that their view depends on current cosmology and that density comparisons only matter when densities differ. This builds credibility. The must-land reply is linking physical symmetries to moral impartiality to avoid paralysis. If this fails, the argument collapses.

  The weakest joint is equating physical symmetries with moral relevance. The user should preempt this by inviting scrutiny. The dreaded question is about duplicates in an infinite universe. If each act is duplicated infinitely, local actions might not affect density. The reply is that duplicates are approximate, but that's shaky. A worse question might be how the theory handles fractal distributions or varying densities, which could break the density approach.

  Overall, the user needs to balance technical responses with philosophical reasoning, concede where necessary, and anchor their argument in the physical symmetry justification to survive the Q&A.
answer: |-
  Below is a battle-tested Q&A prep sheet tailored to your audience, thesis, and stakes. Objections are ordered by **expected sequence** (early = foundational challenges, late = technical/contingent) and **damage potential** (★ = survivable, ★★★★★ = fatal if mishandled). Replies are calibrated for 2-minute clarity.

  ---

  ### **Top 8 Objections & Replies**  
  *(Ordered: Early → Late / High → Low Damage)*  

  1. **Mathematical Economist**:  
     *Objection*: "Your 'restricted symmetry' is just a choice of ultrafilter/norm on the value function. Banach limits already formalize 'density-like' orderings under arbitrary permutations. Why is dressing this in spacetime structure less arbitrary?"  
     *Reply*: "Physical symmetries aren't *mathematical choices*—they're *empirical constraints* on moral relevance. Banach limits require accepting non-constructive axioms (e.g., AC); spacetime symmetries are observable and force a unique foliation. This avoids the arbitrariness of 'picking' an ultrafilter."  
     *Soft Spot*: Retorts that "observable ≠ morally relevant" are hard to conclusively refute.  

  2. **Population Ethicist**:  
     *Objection*: "Value density requires a denominator (volume? persons?). But that choice *is* doing the moral work. Why is 'cosmic time' privileged? If I normalize by sentient beings, I could get repugnant conclusions."  
     *Reply*: "The denominator is fixed by physics: *proper volume* in the CMB frame. Sentience-density isn't metaphysically prior—it's emergent from spacetime. This avoids repugnance because adding lives in finite regions doesn't alter asymptotic density."  
     *Soft Spot*: Doesn't resolve why "volume" is the right *moral* unit if sentience is sparse.  

  3. **Cosmologist**:  
     *Objection*: "The CMB frame isn't a 'preferred foliation'—it's a gauge choice! And with accelerating expansion, later time slices have exponentially more volume. Your density could vanish asymptotically, making *all* acts neutral."  
     *Reply*: "For *cosmological purposes*, the CMB frame is privileged (e.g., defining FRW metrics). On volume growth: we use *comoving volume* to define density, not proper volume. This preserves finite density even with inflation."  
     *Soft Spot*: If the universe isn't globally FLRW (e.g., eternal inflation), comoving coordinates break.  

  4. **Decision Theorist 1 (Uncertainty)**:  
     *Objection*: "What if we're unsure whether the universe is infinite? Your ordering forces paralysis in finite worlds if we assign any probability to infinity—violating dominance."  
     *Reply*: "Under uncertainty, we maximize *expected density*. In finite worlds, density reduces to total value. This satisfies stochastic dominance and avoids paralysis."  
     *Soft Spot*: Requires assuming a prior over cosmologies—ethically contentious.  

  5. **Decision Theorist 2 (Representation)**:  
     *Objection*: "Is your density-ordering representable by a utility function? If not, it violates continuity or completeness, making decision theory inapplicable."  
     *Reply*: "It's representable *locally* (for acts altering finite regions) via density differences. Global representation fails, but that's fine: we only need comparability for *feasible acts*."  
     *Soft Spot*: Doesn't resolve acts with undefined densities (e.g., fractal value distributions).  

  6. **Non-Consequentialist**:  
     *Objection*: "You reduce duty to density-structure. But what about deontic constraints (e.g., no torture)? Those aren't 'structural'—they’re locally binding, even if neutral globally."  
     *Reply*: "Agreed—that’s why I argue such duties aren't about *value* at all. They’re constraints on action-types, irrespective of consequences. My view accommodates hybrid theories."  
     *Soft Spot*: Concedes moral weight outside the view’s framework.  

  7. **Sympathetic Consequentialist**:  
     *Objection*: "If density is unchanged, I can torture someone for fun without making things worse. That’s absurd! Surely *that* act is wrong."  
     *Reply*: "It *is* wrong—but not because it lowers value. It violates non-consequentialist constraints (as above) or expresses vice. The intuition of 'worseness' here is misleading."  
     *Soft Spot*: Feels like changing the subject to save the theory.  

  8. **Mathematical Economist (Follow-Up)**:  
     *Objection*: "Your 'finite rearrangements are neutral' claim implies invariance under *finite* permutations. But that’s equivalent to density being a *limit*, not a Banach limit. What if the limit doesn't exist?"  
     *Reply*: "Then we default to dominance reasoning over finite regions. Only when a well-defined limit exists does it govern."  
     *Soft Spot*: Opens the door to "density-undefined" edge cases.  

  ---

  ### **Preemptive Concessions (First 2 Minutes)**  
  Volunteer these *before* Q&A:  
  > *"Three clarifications: First, my view is contingent on **standard cosmology**—if the universe isn’t asymptotically homogeneous, density may be undefined. Second, **density comparisons only matter when densities differ**—otherwise, we fall back on finite ethics. Third, I accept that **local acts don’t ‘improve’ the world** if density is unchanged—this is unlovely but necessary to avoid paralysis."*  

  ### **The Must-Land Reply**  
  **When defending "physical symmetries as moral symmetries"**:  
  > *"Arbitrary permutations treat **physically identical spacetimes** as morally distinct. If two worlds have the same distribution of suffering but relabeled galaxies, impartiality demands indifference—but only physical symmetries ensure this. Otherwise, we privilege *labels* over *structure*."*  
  **→ If this fails, the thesis collapses.**

  ### **Weakest Joint: Expose It Yourself**  
  Address head-on:  
  > *"The hardest sell is that **physical structure fixes moral relevance**. You might argue spacetime symmetries tell us what’s *natural to count*, not what’s *fair to count*. I’d reply: ‘Fairness’ without empirical anchors is empty—it led us to paralysis. But I’m eager to hear your fixes."*  

  ### **The Prayer-Nobody-Asks Question**  
  Your candidate is severe, but this is worse:  
  > *"If value density is defined by averaging over hypersurfaces, what stops a **malicious agent** from performing acts that induce **fractal suffering** (e.g., pain organized in a Cantor set) with *zero density*? Your view would call this neutral, even if infinite agony exists."*  
  **Reply**: "Fractal structures require infinite precision—physically impossible. Value-bearing events have finite measure."  
  **Why worse?** Challenges the **physical realizability** of your key assumption.  

  ---

  ### **Tactical Notes**  
  - **Economist/Cosmologist**: Engage first—they’ll pounce early. Nod to their expertise ("As you know, Banach limits require...").  
  - **Population Ethicist**: Preempt by admitting denominator choice is "fixed by cosmology, not ethics."  
  - **Prayer Question**: If asked, concede it’s a "devastating *reductio* if physically possible" and pivot to contingency ("But in our universe, quantum decoherence prevents fractal exactness").  
  - **Timekeeper**: Assign a colleague to cut off follow-ups at 2 mins.  

  This setup lets you control the narrative, concede where needed, and armor the core thesis. Good luck—your move is bold and deserves a hearing.
