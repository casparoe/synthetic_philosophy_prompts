  Here's a flowchart designed to sort participants based on their implicit beliefs about agency, responsibility, and emotional response—without using Stoic technical terms. The questions use concrete cases to reveal underlying distinctions in their worldview. The tree focuses on **logical distinctions in how they frame agency**, then maps answer patterns to philosophical positions.

  ---

  ### **The 8 Questions & Answer Options**
  *(Each question presents a scenario with 2–3 plain-language answers)*

  1. **You rehearsed a talk thoroughly, but it gets a negative reception.**  
     A: *I failed to prepare properly or anticipate the audience.*  
     B: *The audience was biased or the topic was doomed from the start.*  
     C: *I did my part; the outcome wasn’t on me.*  

  2. **A friend is drinking heavily. You try to persuade them to stop, but they refuse.**  
     A: *I must try harder—it’s my duty to fix this.*  
     B: *I can only offer support; changing is their choice.*  
     C: *There’s nothing I can do.*  

  3. **You campaign for a policy unlikely to pass.**  
     A: *If it fails, I didn’t strategize well enough.*  
     B: *The fight matters, win or lose.*  
     C: *It’s pointless to try when success is unlikely.*  

  4. **You’re waiting for a medical test result that could be serious.**  
     A: *I should have lived healthier to avoid this risk.*  
     B: *Worrying now won’t help; I’ll deal with results later.*  
     C: *I can’t stop imagining worst-case scenarios.*  

  5. **You lose your temper over a small slight, and later regret it.**  
     A: *I failed to manage my emotions.*  
     B: *The situation was unfair—anger was justified.*  
     C: *Feelings happen; I’ll reflect and move on.*  

  6. **You could have prevented a minor accident (e.g., unplugging a faulty appliance) but didn’t.**  
     A: *I’m at fault for not acting.*  
     B: *I couldn’t have known it would happen.*  
     C: *It’s not my role to police everything.*  

  7. **False rumors damage your reputation.**  
     A: *I should have been more careful about how others perceive me.*  
     B: *Others’ opinions aren’t my burden; I know the truth.*  
     C: *I’ll confront the source to clear my name.*  

  8. **You train for months for a marathon but get injured and can’t run.**  
     A: *I pushed too hard or ignored warning signs.*  
     B: *Injuries are flukes; I’ll recover and adjust.*  
     C: *All that effort was wasted.*  

  ---

  ### **Answer-Pattern-to-Leaf Key**
  *(Positions are "leaves" on the decision tree)*  
  **Tree Path** → **Position** & Core Belief  

  1. **Start at Q6** (preventing avoidable harm):  
     - **A** ("I’m at fault for not acting") → Go to Q3  
     - **B/C** ("Couldn’t know" or "Not my role") → Go to Q3  

  2. **Q3** (campaigning for an unlikely cause):  
     - **A** ("I didn’t strategize well") → **Indirect-influence**  
       *Belief: Outcomes are partly steerable; failure implies personal shortcoming.*  
     - **B** ("The fight matters") → Go to Q5  
     - **C** ("Pointless to try") → **Quietist-leaning**  
       *Belief: Only inner states matter; external efforts are futile.*  

  3. **Q5** (managing anger after a slight):  
     - **A** ("I failed to manage emotions") → Go to Q7  
     - **B** ("Anger was justified") → *Empty region (incoherent)*  
     - **C** ("Feelings happen") → **Flat rejection**  
       *Belief: Control is the wrong frame—ask what’s worth caring about, not what’s "controllable".*  

  4. **Q7** (responding to reputation damage):  
     - **A** ("I should’ve managed perceptions") → *Empty region (incoherent)*  
     - **B** ("Others’ opinions aren’t my burden") → **Strict Epictetan**  
       *Belief: Only your judgments/choices are truly yours; all else is external.*  
     - **C** ("I’ll confront the source") → **Modern influence-sphere**  
       *Belief: Effort/influence is "control"; outcomes are secondary.*  

  5. **For those at Q3 (B/C) after Q6 (B/C)**:  
     - **B** ("Fight matters") → **Therapeutic reading**  
       *Belief: "Control" means managing anxiety, not causation; focus on effort, not outcomes.*  
     - **A** ("I didn’t strategize well") → *Empty region (incoherent)*  
     - **C** ("Pointless to try") → **Quietist-leaning** (same as above)  

  ---

  ### **Gaps & Notes on Empty Regions**  
  1. **Incoherent regions** (logically inconsistent):  
     - *Q6=A + Q3=C*: Taking blame for inaction (Q6=A) but rejecting effort (Q3=C) conflicts.  
     - *Q6=B/C + Q3=A*: Denying responsibility (Q6=B/C) but blaming strategy for failure (Q3=A) conflicts.  
     - *Q5=B anywhere*: Blaming externals for anger (Q5=B) contradicts taking ownership elsewhere.  
     - *Q7=A after Q5=A*: Regretting reputation (Q7=A) after endorsing outcome-focus (Q3=B) conflicts.  

  2. **Unexplored regions** (no clear position):  
     - *After Q5=B or Q7=A*: Answers imply hybrid beliefs (e.g., outcome-blame + emotion-externalizing) with no aligned position.  
     - *Therapeutic and Modern influence-sphere converge*: They share answers (Q2=B, Q3=B, Q4=B, Q8=B) but split at Q6 (Therapeutic: B/C; Modern: A). **Therapeutic is Modern without outcome-blame**.  

  3. **Unattractive regions** (avoided for psychological/cultural reasons):  
     - *Q6=A + Q3=B + Q5=A + Q7=A*: Taking universal blame (actions, emotions, reputation) feels punitive; no position advocates this.  
     - *Q4=C + Q8=C*: Chronic anxiety + viewing effort as "wasted" aligns with no position; even Quietists focus on inner peace.  

  ---

  ### **Key Insights**  
  - **Therapeutic and Modern positions are near-identical** except on outcome-blame (Q6). They’re "one leaf wearing two hats": Therapeutic avoids guilt; Modern accepts it for effort.  
  - **Strict Epictetan and Flat rejection** split on anger (Q5): Epictetans see emotions as failures; Rejection sees them as natural.  
  - **Quietist-leaning** is isolated by rejecting action (Q3=C).  
  - **Indirect-influence** is unique in outcome-blame (Q3=A/Q6=A/Q7=A).  

  This tree isolates positions using **agency focus** (outcome-blame vs. effort-focus), **emotional responsibility** (voluntary vs. natural), and **scope of duty** (expansive vs. narrow). Run participants through the questions, then use the key to map them to leaves.
