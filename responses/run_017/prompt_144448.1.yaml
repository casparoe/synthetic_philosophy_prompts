answer: |-
  ### Activity Design: The Rights and Unanimity Challenge

  **Scenario**:  
  In the town of Liberton, three weekend event options are proposed:  
  - **A**: Quiet Weekend (no events)  
  - **B**: Poetry Reading by Alex (Citizen 1)  
  - **C**: Stand-Up Comedy by Sam (Citizen 2)  

  Each citizen has unconditional decision rights over a personal pair:  
  - **Alex** controls the choice between **{A, B}** (whether to hold their poetry reading).  
  - **Sam** controls the choice between **{A, C}** (whether to hold their comedy show).  

  The planner must rank all three events (A, B, C) from best to worst, satisfying:  
  1. **Unanimity Rule**: If both citizens prefer X over Y, then X must rank above Y.  
  2. **Pair Rule (Alex)**: The ranking must respect Alex’s preference for {A, B}.  
  3. **Pair Rule (Sam)**: The ranking must respect Sam’s preference for {A, C}.  

  **Stakes**:  
  - Citizens earn tokens based on their *own* preference ranking:  
    - Top choice: 3 tokens  
    - Middle choice: 2 tokens  
    - Bottom choice: 1 token  
  - Planner earns 2 tokens if they produce a valid ranking (or correctly identify a contradiction), 0 otherwise.  
  - If no valid ranking exists (contradiction), both citizens get 0 tokens.  

  ---

  ### Materials per Table (3 students)
  - **Alternative Cards**:  
    - A: "Quiet Weekend (no events)"  
    - B: "Poetry Reading by Alex"  
    - C: "Stand-Up Comedy by Sam"  
  - **Preference Cards** (one set per round, per citizen):  
    - **Round 1 (Parochial)**:  
      - Alex: "A > B > C"  
      - Sam: "A > C > B"  
    - **Round 2 (Nosy)**:  
      - Alex: "B > A > C"  
      - Sam: "C > A > B"  
    - **Round 3 (Nosy, Waiver)**: Same as Round 2.  
  - **Rule Sheet** (for planner; text varies by round):  
    - *Rounds 1–2*: "Unanimity Rule: If both prefer X>Y, rank X>Y. Pair Rules: Respect Alex’s choice for {A,B} and Sam’s for {A,C}. Make a complete ranking."  
    - *Round 3 (Waiver)*: Add: "Before ranking, Alex and Sam may negotiate to waive one/both Pair Rules. If waived, ignore that rule."  
  - **Tokens**: Poker chips (3 per citizen per round if successful).  
  - **Timer**: For rounds.  

  ---

  ### Timeline (75 Minutes)
  1. **Setup (5 min)**:  
     - Arrange 6 tables (3 students each).  
     - Explain the scenario, rules, and token payoffs. **Do not use formal terms** (e.g., call rules "Unanimity Rule" and "Pair Rules").  
     - Assign roles: Alex, Sam, Planner. Roles rotate each round.  

  2. **Round 1: Parochial Preferences (15 min)**  
     - Distribute parochial preference cards.  
     - Planner creates a ranking that satisfies both rules.  
     - *Expected Outcome*: Planners easily succeed (e.g., A>B>C or A>C>B).  
     - Pay tokens (Alex/Sam: 2–3 tokens; Planner: 2 tokens).  

  3. **Round 2: Nosy Preferences, No Waiver (15 min)**  
     - Rotate roles. Distribute nosy preference cards.  
     - Planner tries to create a ranking.  
     - *Expected Outcome*: Contradiction!  
       - Alex’s Pair Rule requires B>A.  
       - Sam’s Pair Rule requires C>A.  
       - Unanimity requires A>B and A>C (since both prefer A>B and A>C).  
       - Impossible (B>A and A>B can’t both hold).  
     - Citizens get 0 tokens; Planner gets 2 tokens if they identify the contradiction.  

  4. **Round 3: Nosy Preferences, Waiver Allowed (20 min)**  
     - Same preferences. Before planning, Alex and Sam negotiate:  
       - They may waive one/both Pair Rules (e.g., "I’ll waive if you do").  
       - Planner only enforces active rules.  
     - Planner creates a ranking (if possible).  
     - *Expected Outcome*:  
       - If both waive, no Pair Rules. Planner can rank (e.g., A>B>C or A>C>B).  
       - Citizens get tokens based on the new ranking (usually 2 tokens each if A is ranked first).  
       - **Trade-off**: Alex/Sam lose control over their pair (e.g., Alex wanted B>A, but gets A>B).  

  5. **Debrief (20 min)**:  
     - **Group Discussion**:  
       - "What happened in Round 1? Round 2? Round 3?"  
       - "Why was Round 2 impossible? What changed in Round 3?"  
     - **Map to Formal Concepts**:  
       - **Rights as decisiveness over a pair**: Alex/Sam control {A,B}/{A,C}.  
       - **Unanimity**: Both must agree on pairwise rankings.  
       - **Contradiction**: Rights and Unanimity conflict when preferences are "nosy" (each cares about the other’s pair).  
       - **Waiver as a fix**: Domain restriction (no "nosiness") avoids conflict but sacrifices rights.  
     - **Address Normative Bite**:  
       - "The conflict arises because Alex and Sam care about each other’s choices. Is that normal? If we ban 'nosy' preferences, rights work—but should we? Rights mean little if they vanish when others care."  

  ---

  ### Predictable Issues & Solutions
  - **Students rewrite preferences**:  
    - *Prevent*: Use pre-printed cards. Emphasize: "Use the preferences given—they reflect real-world motives."  
    - *Response*: "Stick to the cards; real people have fixed views."  
  - **Groups finish at different speeds**:  
    - *Solution*: Use a timer. Fast groups discuss: "What if Alex was less nosy?"  
  - **Proposing majority voting as a fix**:  
    - *Response*: "Try it next round! But remember: majority cycles appeared in our Condorcet lesson—rights might not solve that."  
  - **Accusing nosy citizens of "cheating"**:  
    - *Response*: "Is it cheating to care about others? In Round 2, both had ordinary motives: Alex wants their event, Sam wants theirs, and both prefer quiet over the other’s event."  
  - **Waiver negotiation stalls**:  
    - *Solution*: Suggest: "Propose a token trade: 'I’ll waive if you do, and we ask for A first.'"  

  ---

  ### Limitations of the Activity
  - **Gap: Quantification over all profiles**  
    The activity shows one contradictory profile (Round 2). Sen’s theorem proves *no possible system* avoids this for *some* profiles. Explain: "This isn’t just bad luck—rights and unanimity *always* clash under 'nosy' preferences."  
  - **Gap: Rights vs. pair decisiveness**  
    Pair control is a narrow "right." Acknowledge: "Real rights (e.g., free speech) are broader, but this captures a core tension: personal freedom vs. collective agreement."  

  ---

  ### Verdict on the Claim  
  Your friend is right that the contradiction depends on "nosy" preferences (domain), but wrong that this nullifies normative bite. The activity shows:  
  1. **Nosiness is ordinary** (e.g., caring if others get perks).  
  2. **Domain restriction (banning nosiness) sacrifices rights** (Round 3’s waiver erodes control).  
  Thus, the result *does* expose a tension between rights and unanimity in realistic settings.  

  \answer{Nosy preferences are ordinary; normative bite remains.}
