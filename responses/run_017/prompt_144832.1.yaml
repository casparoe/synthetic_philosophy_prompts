answer: |-
  Here’s the adversarial collaboration report you requested, structured as specified and grounded in your co-op’s practical dilemmas. Both sides agree that **the core tension is whether codification destroys the self-sustaining flexibility of conventions or strengthens fragile norms through clarity**.

  ---

  ### **Agreed Claims**  
  *(Non-vacuous, deniable propositions both sides endorse)*  
  1. **Unwritten rules function *as if* binding** in your co-op, but their persistence relies on *perceived* mutual expectations, not formal enforcement.  
  2. **Newcomers’ compliance problems stem from broken transmission**, not inherent defects in conventions or norms.  
  3. **Writing down a rule changes its social ontology** (what kind of thing it *is*), regardless of whether behaviour changes.  
  4. **Sanctions in your house are typically subtle** (sighs, eye-rolls, passive-aggressive Post-its), not coordinated punishments.  
  5. **No rule here is purely coordinative** (like driving sides) – all involve minor sacrifices (e.g., locking doors, buying milk).  

  ---

  ### **Disagreements Table**  
  | # | Convention-First (CF) Formulation                                      | Norms-First (NF) Formulation                                          | Real or Verbal? | Notes                                                                 |
  |---|------------------------------------------------------------------------|-----------------------------------------------------------------------|-----------------|-----------------------------------------------------------------------|
  | 1 | "Conventions arise from precedent solving recurrent problems; norms are a subtype where expectations gain moral weight." | "Conventions *become* norms only when attached to ‘oughtness’ + sanction readiness; otherwise they’re mere habits." | **Verbal**      | Dispute hinges on definition of "norm". CF sees norms as emergent from conventions; NF sees norms as distinct. |
  | 2 | "Sanctions are epiphenomenal; stability comes from mutual preference for coordination." | "Sanctions (even mild ones) are constitutive; without them, it’s just coincidence." | **Real**        | CF: Milk-buyer’s sigh is irrelevant to rule existence. NF: Sigh *is* the norm sustaining device. |
  | 3 | "The ‘phantom convention’ works identically to a real one; origin myths are irrelevant." | "False beliefs *about* norms (e.g., ‘voted in 2009’) generate normative pressure that sustains compliance." | **Real**        | CF: Behavioural regularity defines convention. NF: Belief in legitimacy defines norm. |
  | 4 | "Pluralistic ignorance shows conventions can persist without normative commitment." | "Pluralistic ignorance destroys genuine normativity; it’s coordination masquerading as obligation." | **Real**        | CF: It’s still a convention. NF: It’s a defective norm. |

  ---

  ### **Cruxes**  
  *(Empirical tests using your cases; both sides agree these would shift the debate)*  
  1. **The Laminated Sheet**  
     - **Test**: Secretly remove the sheet for 1 week.  
       - *CF Prediction*: Compliance continues unchanged (convention persists behaviourally).  
       - *NF Prediction*: Compliance drops or becomes erratic (written artefact anchors normativity).  
     - **Crux**: Does the *physical object* sustain compliance, or is it redundant?  

  2. **The Milk**  
     - **Test**: Track milk purchases + anonymous survey: *"Do you feel guilty if you use milk but don’t replace it?"*  
       - *CF Prediction*: No correlation between guilt and buying; behaviour is convention + slight sucker aversion.  
       - *NF Prediction*: High guilt predicts buying; "fair turn-taking" is internalised norm.  
     - **Crux**: Is "fairness" doing real work, or is it post-hoc rationalisation?  

  3. **Pluralistic Ignorance**  
     - **Test**: Anonymous poll: *"Do you personally value the back-door rule?"* vs. *"Do others value it?"*  
       - *CF Prediction*: Low personal value + high perceived others’ value → convention survives.  
       - *NF Prediction*: Low personal value + high perceived others’ value → rule collapses if poll results published.  
     - **Crux**: Does exposure of pluralistic ignorance destroy the rule?  

  ---

  ### **Falsifiability & Settlement**  
  - **CF Side**: Would abandon position if **poll shows 80%+ comply with rules they *dislike* even after learning others also dislike them** (proving sanctions/approval irrelevant).  
  - **NF Side**: Would abandon if **exposing phantom convention/pluralistic ignorance changes nothing** (proving norms don’t rely on beliefs).  
  - **Shared Settlement Test**: **Newcomer onboarding experiment**.  
    - Group A gets verbal "house culture" intro.  
    - Group B gets identical info in a "provisional guide" labelled *"These are observed conventions, not laws"*.  
    - *Both sides agree*: If Group B’s compliance = Group A’s, CF wins (writing changes nothing). If Group B’s compliance > Group A’s, NF wins (writing stabilises norms).  

  ---

  ### **Recommendation: The Hybrid Handbook**  
  Both sides endorse this compromise for your vote:  

  > **Create a *Conventions & Customs* leaflet** with:  
  > - A **disclaimer**: *"This documents what currently tends to happen. These aren’t binding rules – they evolve through use."*  
  > - **Only problematic items** for newcomers (washing-up rota, milk, door-locking). Omit stable conventions (e.g., quiet hours).  
  > - **Annotated origins**: *"Quiet hours: Emerged circa 2009 (no vote recorded). Back door: Consensus in 2017."*  
  > - **Blank section**: *"New patterns this year..."* for co-writing emergent practices.  
  >  
  > **Why both sign off**:  
  > - CF: Avoids reifying norms; frames rules as observed patterns, not obligations.  
  > - NF: Solves transmission failure; anchors expectations for newcomers.  
  >  
  > **Vote FOR this version** – it documents without fossilising, by *explicitly acknowledging the unwritten nature* of the system. The disclaimer protects the living convention.  

  ---

  **Why this works for your house**: It treats the handbook as a *transmission tool*, not a constitution. By admitting its own provisionality ("this tends to happen"), it mirrors the flexibility of unwritten rules while solving the newcomer problem. The phantom convention stays phantom; the milk stays slightly annoying. But now, when someone forgets the door, you can point to the leaflet *without* invoking bureaucracy: *"Ah, see here – we tend to lock it. Fancy doing the honours?"*  

  Good luck at the vote. If minutes are taken, ensure they reflect the disclaimer.
