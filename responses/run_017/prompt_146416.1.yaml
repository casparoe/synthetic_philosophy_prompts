  ### Point-by-Point Comments  

  #### Part (a) (3/3)  
  - **What is right**:  
    - *"Every emerald examined so far is in D and green, and each of them is therefore trune as well."* → Correctly establishes that all observed emeralds are positive instances of both "green" and "trune."  
    - *"The data support both to the same degree... The first predicts that an emerald not in D is green, the second that it is blue."* → Accurately explains the evidential symmetry and divergent predictions for emeralds outside D.  
