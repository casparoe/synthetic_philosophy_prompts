prompt: |-
  I write a recurring column for a science-and-ideas magazine — working title "What Kind of Money Is This?", which my editor hates but hasn't replaced — and every three weeks or so I have to take some cross-border payment from a rich country, or a rich-country foundation, to a poorer one and explain in about 900 words whether it's discharging a duty, doing charity, or buying something. The house rule is that I can't type the words "should" or "owe" unless I can say which kind of owing it is, and I've noticed I'm inconsistent: last year I called a maternal-health programme "reparations-adjacent" and a cash transfer programme "charity", and a reader wrote in to point out that if anything it should be the other way around. So I want an actual procedure, not a vibe.

  Here's the material I think it should be built out of, but you should tell me which bits survive the translation into something usable. First, the split I keep coming back to between a remedial duty (we broke it, we pay) and a general duty to assist (they need it, we can help at low cost to ourselves) — the drowning-child style argument for the second, and the view associated with Pogge, I think, that the real duty is not to impose an unjust global institutional order, for the first. Second, a test I've been using informally and have no name for: whose description of the good the money is denominated in. A transfer that arrives as "here is money, spend it on what you think matters" and one that arrives as "here is money for a thing called maternal health, delivered by our contractors, measured against our indicators" seem to me to be doing different moral work even when the dollar figure is identical — the second one has the donor's name on the good. Third, something I've started calling obligation laundering, where a payment that is straightforwardly a purchase — of border cooperation, of a vote, of access — gets described in the language of duty, and the language does real work by shutting down the question of whether the price is fair.

  What I want from you is this: a decision procedure, in the order I'd actually run the questions, that takes a press release plus maybe one phone call and gets me to one of a small number of labels, or to a stop. For each question say what counts as a sufficient answer given that I'm working from a press release and a phone call in twenty minutes and can't see internal budget documents; where the procedure just stops and says "no label — describe the mechanics literally and don't reach for duty language"; and where it has to hand the question to a person because it's a disagreement about values rather than facts (whether a collective can owe anything at all, whether responsibility transmits down generations, whether duties of assistance are enforceable — I assume some of these are undecidable for my purposes and I want them flagged as such, not quietly settled by the procedure). Then run it on three cases: (1) a former colonial power announcing a ten-year, few-hundred-million-dollar maternal health program in a country it ruled until the 1960s, delivered through its own contractors, timed a few months after a court ruling about abuses in the colonial period; (2) a rich government paying a poorer government to host asylum-processing centres and accept deportation flights; (3) unconditional cash transfers to very poor households, funded by a private foundation with no government involved. One of the three needs to be a case where the honest output makes me look soft on something I've been hammering for years, and if none of them is that case, tell me which one I'm misreading and why. Finally, be explicit about what the procedure can't do: I'd rather have a checklist that admits it misfires on, say, multi-donor trust funds or concessional lending than one that pretends to cover everything, and I need to know which of my invented bits — the name-on-the-good test, obligation laundering, and whatever you'd call the remedial/assistance split — are load-bearing and which are just my hobbyhorses that a cleaner version would drop.
reasoning: |-
  Okay, let me tackle this query step by step. The user writes a recurring column analyzing cross-border payments and needs a reliable decision procedure to classify them as duty, charity, or purchase. They've provided conceptual raw material and want a practical framework that acknowledges limitations.

  First, I need to understand their core frustration: inconsistent labeling despite having conceptual tools. Their examples show how easily classifications can flip (maternal health as "reparations-adjacent" vs cash transfers as "charity"). The house rules banning "should/owe" without specification suggest they need operational definitions.

  Breaking down their proposed materials:
  - The remedial/general duty split (Pogge vs Singer-style arguments) seems foundational for distinguishing between rectification and assistance.
  - The "denomination test" (whose priorities define the good) appears crucial for agency assessment but might need refinement.
  - "Obligation laundering" is their sharpest insight - exposing how moral language camouflages transactions.

  For the decision procedure, I'll structure it as a flowchart with clear stopping points:
  1. Start with purchase detection (is there explicit exchange?) since it's most verifiable
  2. Then probe remedial claims (direct harm causation) as it's morally weightier
  3. Test general assistance only if others fail
  4. The denomination test comes last as a modifier, not classifier

  Key design constraints:
  - Must work with press releases + one short call
  - Must flag undecidable value conflicts (e.g., intergenerational responsibility)
  - Needs explicit "stop" conditions when evidence is ambiguous

  For the test cases:
  - Case 1 (colonial maternal health): Will reveal if procedure catches obligation laundering despite reparations timing
  - Case 2 (asylum centers): Should expose purchase disguised as burden-sharing
  - Case 3 (cash transfers): Will test if "no strings attached" triggers charity label despite user's past critiques

  The hardest output will be case 2 - it'll force them to acknowledge their "purchase" hammer might overlook legitimate cooperation elements. That's where the procedure's neutrality becomes valuable.

  Finally, I'll explicitly list limitations:
  - Can't handle multi-donor funds well (attribution problem)
  - Concessional loans blur duty/purchase lines
  - Their denomination test stays but as secondary marker
  - Obligation laundering concept is essential and preserved
  - Remedial/assistance split is load-bearing; the rest are adjustable

  The goal is a tool that makes their inconsistency visible but productive - sometimes the ambiguity is the point.
answer: |-
  Here's a decision procedure built from your core insights, designed for practicality and transparency. It prioritizes verifiable facts over intent, flags value conflicts, and explicitly acknowledges limitations. **Load-bearing elements** are your remedial/general duty split, obligation laundering concept, and denomination test (refined). The "name on the good" test becomes a modifier, not a classifier. "Obligation laundering" is central for spotting disguised purchases.

  **The Decision Procedure: Order of Operations**

  1.  **Is it a direct, explicit exchange? (Purchase Test)**
      *   **Question:** Does the press release/communication *explicitly state* or strongly imply (e.g., "in exchange for", "as part of our cooperation on", "enhancing partnership in area X") that the recipient must provide a specific, definable good, service, or action *directly linked* to the payment? (e.g., hosting centers, voting a certain way, granting mining rights, implementing specific policy).
      *   **Sufficient Evidence:** Explicit contractual language in PR, named deliverables tied to payment, clear quid-pro-quo phrasing in official statements. Phone call can confirm if language is deliberately vague.
      *   **Result:**
          *   **Yes, explicit exchange:** Label **"Purchase"**. Proceed to **Step 1a (Obligation Laundering Check)**.
          *   **No, or ambiguous:** Proceed to **Step 2**.
      *   **Step 1a: Obligation Laundering Check:** Does the framing *heavily* use duty/justice language ("responsibility", "duty", "fair share", "reparative", "historical obligation") to describe what is factually a purchase?
          *   **Yes:** Label **"Purchase (Obligation Laundering Suspected)"**. **Stop**.
          *   **No:** Label **"Purchase"**. **Stop**.

  2.  **Is there a credible claim of direct causation/remediation? (Remedial Duty Test)**
      *   **Question:** Is the payment *explicitly framed* by the donor (or widely acknowledged contextually) as addressing a harm *directly caused* by the donor entity (or its clear predecessor-in-interest)? Focus on specific, attributable actions/institutions (e.g., colonial administration, specific polluter, imposed sanction regime).
      *   **Sufficient Evidence:** PR/donor explicitly links payment to specific past actions ("addressing the legacy of X", "compensation for Y"). Verifiable historical link between donor entity and harm (e.g., same state actor, corporation). Court ruling *directly* involving donor entity. Phone call can probe donor's stated rationale if PR vague.
      *   **Result:**
          *   **Yes, credible direct link:** Label **"Remedial Duty"**. Proceed to **Step 2a (Denomination Modifier)**.
          *   **No, or link is indirect/generalized (e.g., "global inequality", "historical injustices" without specific actor attribution):** Proceed to **Step 3**.
      *   **Value Conflict Flag:** If the link relies on contested concepts (e.g., intergenerational responsibility for colonial states, corporate successor liability), the procedure **Stops**. Label **"Remedial Claim (Value Dispute: [Specify Conflict, e.g., Intergenerational Responsibility])"**. Describe literally.
      *   **Step 2a: Denomination Modifier:** Whose description defines the good?
          *   **Recipient Control (Denominated by Need):** Funds are untied (cash) or recipient sets priorities/spending. Modifier: **"Recipient-Directed Remedial Duty"**.
          *   **Donor Control (Denominated by Donor):** Funds tied to specific donor-defined projects/contractors/indicators. Modifier: **"Donor-Directed Remedial Duty"**.

  3.  **Is it framed as need-based assistance? (General Duty Test)**
      *   **Question:** Is the payment primarily framed as helping those in significant need, where the donor has superior resources, *without* claims of direct causation (Step 2) or explicit exchange (Step 1)?
      *   **Sufficient Evidence:** PR/donor uses language of "assistance", "aid", "support", "solidarity", "alleviating poverty/suffering", "humanitarian". Focus on recipient need and donor capacity. Phone call can confirm if "need" is the primary stated driver.
      *   **Result:**
          *   **Yes, framed as need-based:** Label **"General Duty (Assistance)"**. Proceed to **Step 3a (Denomination Modifier)**.
          *   **No:** Proceed to **Step 4**.
      *   **Value Conflict Flag:** If the existence or enforceability of a general duty to assist is the core debate, the procedure **Stops**. Label **"Assistance Claim (Value Dispute: Enforceable Duty?)"**. Describe literally.
      *   **Step 3a: Denomination Modifier:** Whose description defines the good?
          *   **Recipient Control (Denominated by Need):** Untied cash or recipient control. Modifier: **"Recipient-Directed Assistance"**.
          *   **Donor Control (Denominated by Donor):** Tied to donor projects. Modifier: **"Donor-Directed Assistance"**.

  4.  **Unclassifiable / Literal Description Required (Stop)**
      *   **Result:** If none of the above tests yield a clear label, or if key facts are impossible to verify with given resources, or if value conflicts are fundamental to the categorization. **Stop**.
      *   **Action:** Describe the mechanics literally: "Payment of $X from [Donor] to [Recipient] for [Stated Purpose in PR], delivered via [Method]." Avoid "duty," "owe," "should," "charity," "reparations," etc. Use neutral terms: "transfer," "program," "funding," "cooperation," "agreement."

  ---

  **Running the Cases**

  1.  **Former colonial power's maternal health program:**
      *   **Step 1 (Purchase):** No explicit exchange stated. (PR likely says "supporting health," "strengthening systems," not "in exchange for X"). → **Proceed to Step 2.**
      *   **Step 2 (Remedial):** Context (court ruling, colonial history) is strong. *But:* Is the donor *explicitly* framing it as remediation? Check PR/call. Likely uses vague "legacy" or "partnership" language, avoiding direct "compensation." *Credible direct link?* Colonial state = predecessor to current state? Generally accepted. *Specific harm causation?* Colonial abuses plausibly caused systemic health deficits. **Result:** **Yes, credible direct link (Remedial Duty)**. → **Proceed to Step 2a.**
      *   **Step 2a (Denomination):** Delivered through donor's contractors, against donor indicators. → **Donor-Directed Remedial Duty.**
      *   **Obligation Laundering Check:** High risk. Vague "legacy" language used for a donor-controlled program, timed post-court ruling, avoiding explicit remedial language. **Label: Remedial Duty (Donor-Directed) [High Risk of Obligation Laundering]**. (This might make you look "soft" on reparations claims by accepting the remedial label, but highlights the problematic donor control & potential laundering).

  2.  **Rich govt paying poorer govt for asylum centers/deportations:**
      *   **Step 1 (Purchase):** **Yes.** Explicit exchange: Payment *for* hosting centers and accepting flights. Quid-pro-quo is clear ("cooperation on migration management"). → **Proceed to Step 1a.**
      *   **Step 1a (Obligation Laundering):** Check framing. Does it use duty language ("burden-sharing," "responsibility," "solidarity")? Extremely likely. **Result:** **Yes.** → **Label: Purchase (Obligation Laundering Confirmed)**. **Stop.** (This is the case where the honest output might feel "soft" if you usually hammer "duty" in migration contexts; the procedure ruthlessly exposes the purchase).

  3.  **Unconditional cash transfers by private foundation:**
      *   **Step 1 (Purchase):** No explicit exchange. Money given unconditionally. → **Proceed to Step 2.**
      *   **Step 2 (Remedial):** Private foundation. No plausible claim it *caused* the poverty. No framing as remediation. → **Proceed to Step 3.**
      *   **Step 3 (General Duty):** Framed as alleviating poverty (need), using capacity (foundation funds). → **General Duty (Assistance)**. → **Proceed to Step 3a.**
      *   **Step 3a (Denomination):** Unconditional cash → Recipient control. **Label: General Duty (Recipient-Directed Assistance)**. (This aligns with your reader's point vs. your past "charity" label; it highlights the agency).

  ---

  **What the Procedure CAN'T Do (Explicit Limitations)**

  1.  **Multi-Donor Trust Funds:** Attribution of motive/type is blurred. Who is paying? Why? Is it pooled? The procedure likely **Stops** at Step 4, requiring literal description ("contribution to X trust fund for Y").
  2.  **Concessional Lending:** Blurs Purchase and Assistance. Is the low interest the "purchase" (access to capital market)? Or "assistance" (subsidy element)? Concessionality might weakly signal "assistance" (Step 3), but repayment obligation screams "purchase" (Step 1). **High risk of misfire or Stop.**
  3.  **Complex Motives:** Real payments often mix motives. The procedure identifies the *dominant, verifiable frame* based on PR/call. It can flag laundering or modifiers, but won't split a payment into multiple types.
  4.  **"Buying" Soft Power/Influence:** Unless tied to an explicit exchange (Step 1), this is hard to prove and falls under literal description (Step 4).
  5.  **Resolving Deep Value Conflicts:** It flags but doesn't resolve disputes about collective responsibility, intergenerational duties, or enforceability of assistance. You must describe these literally.
  6.  **Predicting Impact/Effectiveness:** This is purely a *categorization of the transaction's stated frame and mechanics*, not its outcomes.
  7.  **"Charity":** The procedure avoids "charity" as it's morally loaded and vague. "Recipient-Directed Assistance" covers unconditional giving; "Donor-Directed Assistance" covers traditional aid. "Purchase" covers transactional giving.

  **Your Concepts: What Stays, What Goes**
  *   **Load-Bearing:** Remedial/General Duty split (Steps 2 & 3), Obligation Laundering (Step 1a), Denomination Test (Modifier Steps 2a/3a). These provide the core structure and critical insight.
  *   **Refined:** "Name on the good" becomes the actionable "Denomination Modifier" (Recipient vs Donor Control).
  *   **Hobbyhorse (Dropped):** The "drowning child" / Pogge distinction *within* General/Remedial isn't needed for the operational classification. Knowing Pogge informs *why* Remedial is separate, but the procedure only needs the verifiable "direct harm causation" test. The Singer-style argument underpins Step 3 but isn't explicitly invoked.

  This procedure forces consistency by prioritizing explicit framing and verifiable facts over "vibes," explicitly flags where categorization relies on contested values or lacks evidence, and ruthlessly exposes obligation laundering. It accepts that some cases just require literal description.
