prompt: |-
  Had a long, dumb argument with my friend last night about Dutch book arguments and I'm still kind of annoyed about it. Her line was that a Dutch book argument only ever gets you coherence — synchronic probabilism, plus maybe the update rule if you buy the diachronic version — so it can't do any real epistemological work: no norms on priors, nothing about evidence or confirmation, nothing about what to believe about the world. I pushed back, saying it at least pins down how you're supposed to revise, and that the same style of argument seems to generalize to other cases, like norms linking credence about chances to credence about outcomes. Neither of us moved.

  Anyway: I've got roughly one semester and maybe 15 pages to actually write something on this, and I dont want to burn it on something thats been done to death. So — you're a formal epistemologist who works on the foundations of probability and decision theory. Start by brainstorming the candidate questions before you commit to anything, then give me a defended ranking: which open questions about how far Dutch-book-style arguments reach are actually worth a semester, and which alleged upshots are overrated or just don't follow at all? I want the ranking, your criteria for it (how much other work depends on the answer, whether it's tractable in 15 pages without machinery I'd need a math PhD for, whether the answer would surprise anyone), and what would change the ranking.

  Two things I want you to actually grapple with instead of hand-waving:

  1. The bookies in these arguments get weird powers — effectively unbounded capital, exact knowledge of my fair betting prices, and the ability to lay out a whole menu of bets before I reveal anything. Is "what happens when the bookie is capital-constrained, or only gets one shot at me instead of a long series" a genuine research question, or just a curiosity? Does the norm degrade gracefully into something like "don't be exploitable by an adversary with resources K," and is that interesting or trivially weaker?

  2. My friend's "it's only coherence" objection. Is there a principled way to characterize which class of norms an argument of this shape can underwrite — so you could tell in advance whether extensions to chance-credence norms, or inductive norms, or norms on what to pay for information, are going to work or collapse into coherence plus something smuggled in?

  Also flag anything you think is a dead end that someone in my position would naively waste the semester on.
reasoning: |-
  Okay, let me approach this user's query methodically. The user is clearly frustrated about an academic debate on Dutch book arguments and needs concrete research direction guidance. They're a grad student with tight constraints (one semester, 15 pages) so I must prioritize questions that are substantive yet tractable.

  First, unpacking the core tension: the friend dismisses Dutch books as merely establishing coherence norms, while the user sees potential for broader epistemological work. Both points have merit - standard Dutch books do enforce internal consistency, but there are interesting extensions worth exploring. The user's two specific challenges about bookie constraints and norm scope boundaries are particularly sharp.

  Considering research viability, I should rule out dead ends first. Trying to derive inductive norms purely from Dutch books is likely futile - that's essentially Hume's problem. Similarly, prior-justification through Dutch books alone would require smuggled assumptions. But the capital-constrained bookie angle feels fresh, especially since real-world adversaries have limited resources.

  For the ranking criteria: tractability is paramount (must fit 15 pages). Surprise factor matters too - showing that weaker exploitability norms still yield substantive constraints would counter the "just coherence" objection. The chance-credence norm extension scores highly here because it's non-obvious yet rigorously established.

  On the bookie powers objection: the capital-constrained version isn't just a curiosity. There's existing work in computer science (rationality in bounded systems) and economics (market makers with inventory limits) that could be adapted. The graceful degradation question is mathematically precise - what does exploitability mean when bookie's maximum bet size is K?

  Regarding the "only coherence" critique: the principled boundary seems to be between consistency conditions and ampliative inference. Dutch book vulnerabilities reveal inconsistencies in doxastic states, but can't manufacture normative content ex nihilo. This explains why chance-credence norms work (they prevent inconsistency across modal beliefs) but inductive norms don't.

  I'll structure the output to first list candidate questions, then apply clear evaluation criteria, before defending the top picks. The capital-constrained bookie question should be #1 - it directly engages both user's challenges while being manageable in scope. The chance-credence justification would make a strong secondary topic if space allows.

  Must warn against: overambitious attempts to derive induction, or getting bogged down in infinite dutch book pathologies. The user seems sophisticated enough to handle measure-theoretic issues, but 15 pages can't rebuild probability foundations.
answer: |-
  Here’s a structured brainstorming of open questions on Dutch book arguments (DBAs), ranked by research potential for your constraints. I’ll ground this in your two key challenges and flag dead ends upfront.

  ---

  ### **Brainstormed Candidate Questions**  
  1. **Capital-Constrained Bookies**: What norms survive if bookies have finite resources?  
  2. **Chance-Credence Principles**: Can DBAs justify *more* than Lewis’ Principal Principle?  
  3. **Diachronic Extensions**: Beyond conditionalization, can DBAs underwrite norms for memory loss or self-locating beliefs?  
  4. **Evidence & Confirmation**: Can "paying for information" DBAs yield non-circular confirmation norms?  
  5. **Preference-Based Generalizations**: Do DBAs for non-EU decision theories (e.g., risk-sensitive) work?  
  6. **Non-Additive Probabilities**: Can DBAs justify Dempster-Shafer or imprecise probabilitiеs?  
  7. **Pragmatic Encroachment**: Do resource-constrained DBAs blur the line between epistemic/pragmatic norms?  

  ---

  ### **Ranking & Defense**  
  **Criteria**:  
  - **Tractability**: Solvable in 15p without heavy math (e.g., no measure-theoretic probability).  
  - **Impact**: Answers "how far can DBAs reach?" and challenges your friend’s "only coherence" claim.  
  - **Surprise Factor**: Reveals overlooked strengths/limits of pragmatic arguments.  
  - **Dead Ends**: Avoids Humean problems or circularity traps.  

  **Ranked Questions**:  
  1. **Capital-Constrained Bookies**  
     - **Why Top?**:  
       - *Tractability*: Model with finite K (bookie’s max bet size). Show how exploitability degrades to "avoid sure loss ≥ $δ(K)" for small δ.  
       - *Impact*: Reveals that **coherence isn't binary**—it admits degrees under resource limits. Challenges "all-or-nothing" coherence critiques.  
       - *Surprise*: For K→∞, you recover strict coherence; for small K, norms collapse to weaker consistency (e.g., avoiding dominated bets). Connects to *bounded rationality* and real-world adversaries.  
       - *Grapple with Challenge #1*: Yes, it’s a genuine research question. Degrades gracefully: "K-coherence" implies you can’t lose >$ϵ(K) regardless of world-state. This **isn’t trivial**—it reframes coherence as *robustness to feasible adversaries*, not Laplace’s demon.  
     - **Key Insight**: Capital constraints turn DBAs into minimax regret problems.  
     - **Risk**: Requires simple game theory (15p-friendly).  

  2. **Chance-Credence Principles (e.g., Principal Principle)**  
     - **Why #2?**:  
       - *Tractability*: Reconstruct Hájek’s DBA for the Principal Principle (PP). Argue PP *isn’t* smuggled in—it’s enforced by avoiding "chance-dutching" (bets lost if chances are as believed).  
       - *Impact*: **Directly counters "only coherence"**: PP links beliefs *about the world* (chances) to beliefs *about outcomes*. Shows DBAs *can* underwrite substantive norms.  
       - *Surprise*: Hájek’s argument is underappreciated—many think PP is "added" to coherence. Prove it’s a *consequence* of avoiding dynamic inconsistency in chance-beliefs.  
     - **Grapple with Challenge #2**: DBAs can underwrite norms where **inconsistency arises from *content*-specific beliefs** (e.g., believing chance=P but assigning credence ≠P to outcomes). This class extends to *deference principles* (e.g., expert norms).  
     - **Risk**: Requires careful setup of chance propositions. Avoid infinite bets.  

  3. **Paying for Information (Value of Evidence)**  
     - **Why #3?**:  
       - *Tractability*: Use a DBA where refusing free information is dutch-bookable (e.g., Savage).  
       - *Impact*: Shows DBAs **can** say *something* about evidence: you *must* value free, truthful information positively.  
       - *Surprise*: This norm is *weaker* than confirmation theory (no priors needed), but still non-coherence—it constrains how evidence *should affect you*.  
     - **Caveat**: **Cannot** derive *which* hypotheses to confirm—dead end for inductive norms.  
     - **Dead End Warning**: Don’t try to derive "evidence confirms H" from DBAs—it requires priors, inviting circularity.  

  --- 

  ### **Overrated/Useless Directions**  
  - **Inductive Norms (Dead End)**: DBAs **cannot** justify inductive skepticism or uniform priors. Hume’s problem is untouched—no DBA forces you to believe the sun will rise.  
  - **Justifying Particular Priors**: DBAs are *permissive*—any coherent prior avoids dutching. Writing 15p on this rehashes old ground.  
  - **Infinite Bookies**: Pathologies with infinite Dutch Books (e.g., non-measurable sets) require advanced math and add little new insight.  

  ---

  ### **What Changes the Ranking?**  
  1. **If you find a *new* DBA for chance-credence links** (e.g., for deterministic laws), #2 jumps to #1.  
  2. **If capital constraints reveal a hierarchy of "coherence levels"** (e.g., K-coherence implying 1/K-consistency), #1 becomes urgent for bounded rationality.  
  3. **If your friend concedes PP is non-coherence**, pivot to #3 (evidence) or diachronic memory puzzles.  

  ---

  ### **Direct Responses to Your Challenges**  
  1. **Capital-Constrained Bookies**:  
     - **Genuine research? Yes.** It shifts DBAs from "idealized epistemology" to *adversarial robustness*.  
     - **Degrades gracefully?** Absolutely: with resource K, exploitability is bounded by a function of K (e.g., loss ≤ 1/K). This is **interesting**—it shows coherence is *scalable* and applicable to real agents.  
     - **Tractable**: Use a discrete state space and max-bet size K. Prove that violations of additivity (e.g., P(A)+P(B)>1 for disjoint A,B) allow guaranteed losses scaling with K.  

  2. **"Only Coherence" Objection**:  
     - **Principled Characterization**: DBAs underwrite norms where:  
       - **(a)** Violations create *pragmatic self-sabotage* (losses *by your own lights*),  
       - **(b)** The sabotage arises from *logical/mathematical inconsistency* in valuations.  
     - **Why chance-credence works**: Believing "chance is P" while pricing P-outcome bets differently is *inconsistent valuation*.  
     - **Why induction fails**: No inconsistency in valuing "sun rises" bets low *regardless of chance beliefs*—it’s coherently skeptical.  
     - **Why info-payment works**: Refusing free evidence *is* inconsistent if you value truth-seeking.  

  ---

  **Recommendation**: Focus on **#1 (Capital Constraints)**. It’s fresh, tackles both your challenges, and fits 15p. Start with a theorem:  
  > *If a bookie’s max total bet is K, an agent avoids exploitability iff their credences satisfy |P(A) + P(B) - P(A∪B)| < f(K) for disjoint A,B.*  
  Then argue: *This reframes coherence as* resilience against feasible adversaries, *not logical omniscience*.  

  **Secondary Option**: **#2 (Chance-Credence)** if you want a direct counter to your friend—but it’s less original. Either way, *skip the dead ends*.
