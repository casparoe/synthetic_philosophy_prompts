prompt: |-
  I've been going round on voting methods again (yes, I know, far too many blog posts about this), and I've noticed I don't actually have a principle. I know the Gibbard–Satterthwaite thing: with three or more outcomes and no restrictions on preferences, the only strategy-proof rules are dictatorial ones. So "it can be gamed" can't be the objection, because that's every rule that isn't a dictatorship. But I still have fairly strong reactions to particular cases, and I want to know what I'm implicitly running.

  My verdicts:

  1. Plurality, three candidates, my guy on 8%. I vote my second choice. Doesn't count against plurality. Everyone can see it coming, it's stable, it settles into blocs, and the move is the same move every time — you don't need to be clever or well-informed to find it.

  2. Instant runoff, where there are profiles in which a candidate would have done better if some of their own supporters had ranked them lower, and where ranking a hopeless candidate first can knock out a strong rival. This has apparently happened in real elections, though I'm hazy on the details. Does count against IRV — but only mildly. Oddly it feels worse to me than 1, despite needing much better information to pull off.

  3. Borda: bury your main rival at the bottom of your ranking, or get your side to run near-clones of your candidate. Serious strike. The incentive isn't a corner case — there's basically always something to gain by exaggerating your ranking, whatever the numbers look like.

  4. Approval: where I put my approval threshold. Barely bothers me at all. It feels less like strategy and more like calibrating how generous I'm feeling, and I can do it without knowing the polls.

  5. Random dictator — draw one ballot at random and do whatever it says. Strategy-proof, since you only matter if you're drawn. I reject it anyway. It's strategy-proof by being indifferent to almost every ballot; it isn't aggregating anything.

  6. A rule where turning up and voting sincerely can cause your own favourite to lose (the no-show thing). This is the worst defect on my list. Worse than being manipulable, because it punishes the exact behaviour I least want a rule to punish.

  7. Thirty per cent of voters coordinate through an app; no single one of them could gain by misreporting alone, but the bloc can. Counts against the rule — and it counts more than I'm comfortable with, given that the theorem I keep citing is about lone voters.

  8. The single-peaked escape: put everyone on a left–right line and take the median, and it's strategy-proof. Doesn't impress me. Real electorates aren't single-peaked on one dimension, and if you try to infer the dimension from the ballots instead of assuming it, misreporting your whole ranking in order to move the axis is back on the table.

  Here's my stab at a principle, which I suspect is wrong: a manipulation is a genuine defect only if it's poll-robust — meaning a voter who knows only their own preferences plus public polling to within a few points could still expect to gain by misreporting — and only if the rule is responsive, i.e. sincere ballots can actually determine the winner; and defects that punish sincerity or participation are worse than defects that merely reward guile.

  So: test that against the eight cases, tell me where it breaks, and repair it rather than replacing it wholesale unless it's hopeless. I want one principle, stated precisely enough that someone else could apply it, with a note on which case motivates each clause. Then give me its verdicts on cases I haven't listed — at least three, and I'd like you to include: STAR (score everything, then automatic runoff between the top two), a grading rule like majority judgement where people grade candidates rather than ranking them and the median grade wins, and a made-up one I invented this morning: approve as many candidates as you like, then hold a lottery between the top two approval-getters with the odds tilted by how far apart they are.

  Please commit. I don't want a menu of three candidate principles with tradeoffs for me to pick between — pick one and defend it, say plainly which of my verdicts you'd overturn and why, and be honest about any verdict of mine your principle just can't accommodate. Also flag where you're least confident, particularly on whether the poll-robustness clause is doing real work or whether I've just stuck a number on a vibe, and whether the responsiveness clause is secretly doing all the labour. And if you think what I'm really tracking isn't manipulability at all but something else — say the rule being legible to the voters it governs — say so and tell me which of my verdicts gave it away.
reasoning: |-
  Hmm, the user is deep into voting theory and wants me to help them formalize their intuitive principles about what makes a good voting system. They've listed eight specific verdicts on different voting methods and want me to extract a consistent principle from them. This is quite sophisticated - they're clearly well-versed in voting theory concepts like Gibbard-Satterthwaite, strategy-proofness, and various paradoxes.

  Looking at their verdicts, I notice some interesting patterns. They seem most disturbed by situations where sincere voting backfires (like the no-show paradox in verdict 6), and less bothered by strategic voting that requires minimal information (like approval threshold setting in verdict 4). They also care about whether the rule actually aggregates preferences meaningfully (verdict 5 on random dictator) and whether strategic voting requires complex coordination (verdict 7).

  Their proposed principle has two key parts: poll-robustness (strategies that work with approximate polling knowledge) and responsiveness (the system meaningfully responds to ballots). They also note that defects punishing sincerity are worse than those rewarding guile. This seems sensible, but I wonder if it fully captures their reactions.

  For instance, their strong dislike of the no-show paradox (verdict 6) might point to something deeper about participation incentives that isn't fully covered. And their mild reaction to IRV's manipulability (verdict 2) versus stronger dislike of Borda (verdict 3) suggests the frequency and ease of manipulation matter more than just existence.

  I'll develop a principle that emphasizes: (1) how reliably manipulable a system is under realistic information constraints, (2) whether it punishes good-faith participation, and (3) whether it provides meaningful aggregation. The poll-robustness requirement seems crucial here - it explains why they're bothered by Borda (always manipulable) but not as much by plurality (strategies depend on precise polling).

  For new systems, I'll need to carefully apply this. STAR voting might be problematic because score compression could be poll-robust. Majority Judgment might fare better since median-based systems resist certain manipulations. Their lottery-based system might fail on responsiveness grounds. I should be honest about where their verdicts might conflict with the principle, like their rejection of random dictator which is technically strategy-proof but fails on aggregation.

  This is tricky because voting theory involves unavoidable trade-offs. But by focusing on practical manipulability and participation incentives, I can build something that honors most of their intuitions while remaining coherent. The key is making poll-robustness precise - perhaps defining it as strategies that work across a range of polling estimates rather than requiring exact numbers.
answer: |-
  Here's a single, precisely stated principle extracted from your verdicts, designed to capture your intuitions while being defensible and applicable. I'll then test it against your cases and new systems, highlighting where it aligns, where it conflicts, and where confidence is lower.

  **The Principle ("Responsive, Robust, Participation-Preserving Aggregation - RRPPA")**

  A voting rule has a **genuine defect** if:
  1.  **Poll-Robust Manipulability (PRM):** Under plausible public polling information (known to within a tolerance of ±ε%, where ε is small but non-zero, e.g., ±3-5%), a voter with only their own preference order and this polling knowledge can, with significant probability and without complex coordination, identify a misreporting strategy that yields a strictly better expected outcome *for them* than sincere voting.
  2.  **Participation/Sincerity Punishment (PSP):** There exist plausible preference profiles and ballot combinations from other voters where a voter casting a sincere ballot causes a *worse* outcome for them than if they had abstained, or where sincere voting reliably leads to worse outcomes than strategic misreporting identified under PRM conditions. Defects involving PSP are considered **more severe** than those involving only PRM.

  Additionally, a rule must be **Responsive (R)**: The winner is determined by the aggregation of sincere ballots (i.e., it's not indifferent to large subsets of ballots, like Random Dictator). *Responsiveness is a prerequisite for evaluating PRM/PSP meaningfully; a non-responsive rule is defective by default.*

  **Motivation from Your Cases:**
  *   **PRM Clause:** Explains the mildness of your verdicts on Plurality (1 - needs precise polling for strategy in close races) and Approval (4 - calibration feels like expression, not poll-dependent strategy). Justifies the strong strike against Borda (3 - burying is *always* beneficial regardless of polls) and Condorcet cycles (part of 8 - manipulating the axis requires knowing the dimension). Explains why IRV (2) feels worse than Plurality despite needing more info – the manipulation *can* be poll-robust ("my candidate is solid 3rd, I can safely bury the rival").
  *   **PSP Clause:** Directly captures your "worst defect" reaction to the No-Show Paradox (6). Elevates the severity of manipulations where sincere voting is actively harmful. Explains why coordination (7) feels worse than lone manipulation – large-scale coordination *creates* PSP scenarios for non-coordinating voters or makes manipulation more reliable.
  *   **Responsiveness (R):** Captures your rejection of Random Dictator (5) – it fails aggregation, making PRM/PSP irrelevant but fundamentally defective.

  **Testing RRPPA Against Your Verdicts:**

  1.  **Plurality:** *Verdict: No defect.* **RRPPA Agrees.** Strategy (bullet voting) is poll-robust only in very close races (polling needs high precision). In most profiles (like your 8% example), strategic voting for 2nd choice isn't reliably beneficial without very precise polls showing an exact tie/threshold. PSP rare. Responsive.
  2.  **IRV:** *Verdict: Mild defect.* **RRPPA Agrees (Mild PRM defect).** "Burying" a strong rival *is* poll-robust: knowing your favorite is weak/safe 3rd and the rival is vulnerable to being knocked out is sufficient (±5% polls often enough). PSP (No-Show) possible but less common. Responsive. *Why mild?* Uncertainty about elimination order can dampen the "significant probability" in PRM.
  3.  **Borda:** *Verdict: Serious strike.* **RRPPA Agrees (Strong PRM defect).** Burying your main rival is *always* beneficial, regardless of polls. No polling knowledge needed! High probability, significant gain. PSP possible but less central. Responsive.
  4.  **Approval:** *Verdict: Barely bothers.* **RRPPA Agrees (No defect / Minor PRM).** Setting the threshold is primarily preference expression ("how generous"). Strategic threshold setting (e.g., approving only true favorite in a close race) requires *very* precise polling (±1-2%) to be reliably beneficial and avoid accidentally helping a worse candidate. Often, sincere threshold (approving all preferred to the expected winner) is robust. Responsive.
  5.  **Random Dictator:** *Verdict: Reject.* **RRPPA Agrees (Defective - Fails R).** Non-responsive by design. PRM/PSP don't apply meaningfully, but it fails the aggregation prerequisite.
  6.  **No-Show Paradox:** *Verdict: Worst defect.* **RRPPA Agrees (Severe PSP defect).** This *is* PSP by definition: showing up and voting sincerely made the outcome worse. Automatically severe.
  7.  **Coordinated Bloc Manipulation:** *Verdict: Counts against, more than expected.* **RRPPA Partially Agrees (High Severity).** Large, coordinated blocs *create* PSP scenarios for non-bloc voters (their sincere vote is rendered ineffective/harmful) and make PRM manipulation highly reliable *for the bloc*. RRPPA clearly flags this as severe due to PSP creation. *Tension:* Gibbard-Satterthwaite assumes lone actors. RRPPA explicitly recognizes that rules vulnerable to *feasible* coordination creating PSP are defective, which is broader but justified by your reaction.
  8.  **Single-Peaked Median:** *Verdict: Unimpressed (Manipulation via axis shift).* **RRPPA Agrees (Potential PRM defect if dimension not fixed).** If the dimension is fixed *a priori*, strategy-proof (no PRM/PSP), responsive. *But* if the dimension is inferred, shifting the axis via misreporting *can* be poll-robust (knowing current axis estimates). Your intuition is validated; RRPPA flags the inferred-dimension version as potentially defective via PRM.

  **Verdicts on New Systems:**

  1.  **STAR Voting (Score, Top-Two Runoff):**
      *   *PRM:* **Likely Defect (Moderate).** Strategic scoring compression ("min-max") is often poll-robust. Knowing the top 2-3 contenders (±5% polls), voters have a strong incentive to min-max (score favorite 5, main rival 0, others based on preference/viability) to maximize favorite's runoff chance and influence if they make it. Less complex than IRV strategy. *RRPPA Verdict: Genuine PRM defect.*
      *   *PSP:* Possible but less common than in IRV. *Severity: Moderate.*
      *   *R:* Responsive.

  2.  **Majority Judgment (MJ - Grading, Median Grade Wins):**
      *   *PRM:* **Likely No Defect / Very Mild.** Strategic "threshold manipulation" (giving a candidate one grade higher/lower) exists but is *not* poll-robust. The impact depends critically on knowing the *exact* current median grade for key candidates (±0.5% often needed!). Minor shifts rarely change the winner. Sincere grading is generally robust. *RRPPA Verdict: No genuine defect or very minor PRM.*
      *   *PSP:* MJ is generally participation-monotonic (voting sincerely rarely hurts vs. abstaining). *Severity: Low.*
      *   *R:* Responsive.

  3.  **Your Lottery Rule (Approve Top K, Lottery between Top 2 Approval w/ Odds by Gap):**
      *   *PRM:* **Defect (Moderate).** Strategic approval is poll-robust. Knowing the likely top 2 (±5%), voters have a clear incentive to only approve their *favorite* among them (or neither if they dislike both) to maximize the lottery odds for their preferred top-2 candidate. Approving extra candidates beyond the likely top 2 is risky (could change the top 2 unpredictably) or futile. *RRPPA Verdict: Genuine PRM defect.*
      *   *PSP:* Abstaining could change the top 2 or gap, potentially helping a preferred candidate. Likely exists. *Severity: Moderate.*
      *   *R:* Responsive (though the lottery adds randomness, aggregation determines the top 2 and gap).

  **Commitment, Conflicts, and Confidence:**

  *   **I commit to RRPPA** as the principle best explaining your core intuitions across the cases.
  *   **Overturned Verdict?** Your verdict on **IRV (2)** was "mildly counts against". RRPPA explains *why* you feel it's worse than Plurality (PRM is more robust in IRV for "burying") and supports the mildness (uncertainty). It aligns well. No major overturns needed.
  *   **Hardest Fit:** **Approval (4).** Your "barely bothers" intuition is strong. RRPPA justifies it (lack of poll-robust strategy), but some theorists argue Approval *is* highly manipulable. RRPPA's focus on *reliable, poll-robust* gain explains your reaction. This is where the "significant probability" and poll tolerance (±ε%) in PRM are crucial. *Low Confidence:* Is ±5% the right tolerance? This is the "number on a vibe" part, but it's essential for distinguishing Approval/Plurality from Borda/STAR.
  *   **Responsiveness Doing Work?** Yes, but correctly. It disqualifies non-aggregating rules (Random Dictator) upfront. PRM and PSP are the active evaluators for responsive rules. Responsiveness alone doesn't explain your distinctions (e.g., Borda vs. Approval).
  *   **Tracking Something Else?** **Legibility** plays a role *implicitly* in PRM. A strategy being poll-robust implies it's relatively simple and legible to the average voter ("bury the rival", "min-max", "only approve true favorite in close race"). Complex, information-heavy strategies (some IRV scenarios, precise Borda cloning) fail the PRM test, aligning with your milder reactions to them (2, implicitly 3's cloning aspect). Your verdicts 1 (simple, stable), 2 (needs better info), 4 (simple calibration), and 8 (complex axis shift) suggest legibility of strategy influences your assessment, which PRM indirectly captures via the information requirement.
  *   **Honest Limitations:** RRPPA doesn't directly capture all "weird" paradoxes (e.g., monotonicity failures in IRV) unless they manifest as PSP or create PRM opportunities. It focuses on *incentives for the individual voter* under realistic information. Your verdict 7 (coordinated blocs) is handled well by PSP, but RRPPA primarily assesses *individual* manipulability; the severe defect arises because coordination *induces* PSP for others. This is a slight stretch but necessary and justified by your reaction.

  **RRPPA Summary Verdicts Recap:**

  | System              | PRM Defect?                     | PSP Defect?      | Responsive? | RRPPA Verdict                          | Your Verdict Alignment |
  | :------------------ | :------------------------------ | :--------------- | :---------- | :-------------------------------------- | :--------------------- |
  | Plurality (3 cand)  | No/Minor (Precise polls needed) | Rare/Minor       | Yes         | **No Genuine Defect** / Minor           | Agrees (1)             |
  | IRV                 | **Yes (Moderate - Burying)**    | Possible (No-Show) | Yes         | **Genuine Defect (Moderate PRM)**       | Agrees (2 Mild)        |
  | Borda               | **Yes (Strong - Always Bury)**  | Possible         | Yes         | **Genuine Defect (Strong PRM)**         | Agrees (3 Serious)     |
  | Approval            | No/Minor (Very Precise needed)  | Rare             | Yes         | **No Genuine Defect** / Minor           | Agrees (4 Barely)      |
  | Random Dictator     | N/A                             | N/A              | **No**      | **Defective (Fails R)**                 | Agrees (5 Reject)      |
  | No-Show Paradox     | N/A                             | **Yes (Severe)** | N/A         | **Genuine Defect (Severe PSP)**         | Agrees (6 Worst)       |
  | Coordinated Bloc    | N/A (Individual)                | **Yes (Created)**| Varies      | **Genuine Defect (Severe PSP)**         | Agrees (7 Counts)      |
  | Single-Peaked (Inf) | **Yes (Moderate - Axis Shift)** | Possible         | Yes         | **Genuine Defect (Moderate PRM)**       | Agrees (8 Unimpressed) |
  | STAR                | **Yes (Moderate - Min-Max)**    | Possible         | Yes         | **Genuine Defect (Moderate PRM)**       | N/A                    |
  | Majority Judgment   | **No/Very Minor**               | Rare/Low         | Yes         | **No Genuine Defect** / Very Minor      | N/A                    |
