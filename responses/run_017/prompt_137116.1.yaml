prompt: |-
  I teach a third-year seminar in formal epistemology, and I have a seventy-five-minute slot in which to get van Fraassen's Reflection principle in front of students who handle conditional probabilities fluently, who have been through the synchronic Dutch-book argument for probabilism, and who have been taught conditionalization as the default updating rule — but who have never met a diachronic argument and have never been asked to treat their own future credence as something they can now have a conditional attitude toward. A third of the room are joint honours students in computer science; they will have met dynamic consistency in sequential decision problems and will try to assimilate Reflection to it. Do not explain Reflection to me. I want a plan for how I should teach it in that slot.

  Give me the order in which the components must appear, and for each, what it depends on: conditional credence as a present attitude rather than a ratio one computes later; the buying and selling of conditional bets across time; the statement of the principle; the diachronic Dutch book; the Ulysses-shaped worry about a future self you can see coming; and whatever else you think belongs in the sequence. I am genuinely undecided about where the Dutch book goes: presenting it first makes the principle feel like a requirement of rationality, but I suspect it also invites the inference that exploitability and irrationality are the same thing, which I would then have to undo. Tell me what the order buys and what it costs.

  I want one case to carry the session, and I want it vetted rather than merely supplied. My candidate: a physician who knows that tomorrow she will be handed a screening result that she currently has the base rate to interpret correctly and will, through exhaustion, fail to use — so that she knows in advance the direction and roughly the size of a change she now regards as unwarranted. Tell me what such an example must have and what it must lack in order to carry the principle, its motivation, and its failure mode all at once, and whether mine has the wrong features. In particular: in my own notes I have been sorting ways a future self comes apart from a present one into leaks, where the future self simply has less of your evidence and lands on the mixture, and noise, where the future self has all of your evidence and processes it worse. My sense is that Reflection looks close to compulsory for leaks and close to false for noise, and that if students feel that asymmetry I will have taught them the thing rather than the formula. Is that asymmetry real, is it the right axis to build on, and if not, what should replace it? I have tried building this session around Sleeping Beauty and it has never survived the hour.

  Here are the misconceptions I expect, and I would like you to tell me which are real, which are artefacts of the way I propose to present the material, and at exactly what point in the sequence each should be headed off — before it can form, at the moment it forms, or after: that Reflection simply says your current credence must equal your expected future credence; that it tells you to adopt your future credence now; that it is conditionalization under another name; that it forbids changing your mind; that the Dutch book shows violating it costs you money for sure against any bookie; and, from the computer scientists, that it is the same claim as dynamic consistency. Give me also the one I have not listed.

  Then a check: one question for the last five minutes that separates a student who can state the principle from one who sees why it is contested, and say what an answer would have to contain to count.

  Tell me too what I should openly decline to cover in seventy-five minutes, and how to decline it without leaving the impression that the omitted material is settled.

  Finally, separate in your plan what is settled from what is genuinely contested among people who work on this — the formalism and what the principle does and does not entail, as against whether it is a requirement of rationality, whether the diachronic argument supports it, and how known-future-irrationality should be handled. Where your recommendation is a pedagogical bet rather than something the literature settles, mark it as such. I do not need pointers to further reading; spend the whole answer on the sequence, the example, and the misconception map.
reasoning: |-
  Okay, let me approach this systematically. The professor needs a tightly structured 75-minute session introducing van Fraassen's Reflection principle to advanced students. Key constraints include: students understand conditional probability and synchronic Dutch books, but are new to diachronic arguments and self-referential conditional credences. Computer science students may conflate Reflection with dynamic consistency.

  First, I need to establish the core puzzle: how can we rationally relate to our future beliefs? The physician example seems promising but requires vetting. It clearly demonstrates "noise" (future irrationality) rather than "leak" (evidence loss), which helps highlight Reflection's limits. The exhaustion-induced processing failure makes the violation feel reasonable, setting up the central tension.

  For sequencing: Starting with conditional credence as a present attitude is crucial before introducing bets across time. The Dutch book should appear after the principle is grasped, framed as a vulnerability rather than irrationality proof. This order prevents premature equation of exploitability with irrationality.

  The physician case must show:
  - Controllable irrationality (exhaustion makes error predictable)
  - Quantifiable gap (base rate neglect magnitude estimable)
  - No new evidence distortion (pure processing failure)
  But avoid features implying justified belief change or evidence loss.

  Major misconceptions to preempt:
  - "Reflection equals expected future credence" → clarify it's equality conditional on specific future credence
  - "Same as conditionalization" → contrast their structures immediately
  - "Forbids changing mind" → emphasize it permits evidential updating
  Computer science confusion requires explicit distinction: dynamic consistency concerns preferences, Reflection concerns belief.

  For the closing question: "If the physician knows she'll irrationally overestimate cancer probability tomorrow, why isn't violating Reflection rational?" A competent answer must reference non-evidential belief change and distinguish credence formation from evidence acquisition.

  Openly omit: 
  - Generalized Reflection 
  - Non-probabilistic versions 
  - Full debate on rationality requirements
  Frame these as active research areas without endorsing positions.

  Throughout, flag pedagogical bets:
  - Treating "leak" vs "noise" as primary axis 
  - Delaying Dutch book 
  - Using single extended case
  Literature confirms exploitability≠irrationality but disagrees on noise cases. The physician example's effectiveness remains a calculated risk.
answer: |-
  Here is a rigorously sequenced 75-minute plan, vetting your physician example and targeting the specified misconceptions. The structure prioritizes conceptual revelation over formal derivation, leveraging the leak/noise distinction you intuit. **Bolded terms** mark key pedagogical moves; *italicized* notes flag contested/literature-gapped elements.

  ---

  ### **Sequence & Dependencies** (45 mins total)
  1.  **Conditional Credence as Present Attitude** (10 mins)  
      *Depends on:* Students' fluency with P(A|B) as a ratio.  
      *How:* Contrast "P(A|B) = x" as (a) a computed ratio vs. (b) a *current commitment* to bet on A at odds x:1 *if* B is learned (and bet is called off if ~B). Use a simple medical screening example (e.g., P(positive test | disease)). Stress that (b) is a *disposition you now hold*.  
      ***Why now:*** Foundations for treating future credences as conditioning events. Preempts "it's just a ratio" misconception.

  2.  **Future Credences as Conditioners: The Novel Move** (10 mins)  
      *Depends on:* Step 1.  
      *How:* Pose: "What if B is 'My credence in A at time t is x'? Can you *now* have P(A | P_t(A) = x)?" Use a trivial case (e.g., "I will flip a coin at t; I know I’ll believe it’s fair then. What’s your P(heads | my future P(heads) = 0.5)?"). Elicit that this *feels* like it should be 0.5. **Flag the self-reference explicitly.**  
      ***Why now:*** Normalizes the idea that future doxastic states are legitimate objects of current conditional belief. Heads off "this is just conditionalization" by showing structural difference.

  3.  **Statement of Reflection** (5 mins)  
      *Depends on:* Step 2.  
      *How:* Formalize: P_0(A | P_t(A) = x) = x, for all A, x, t>0. Emphasize: It’s a constraint *linking* current and anticipated future credences, *not* a rule for updating. Contrast with conditionalization: "Conditionalization tells you how to *respond* to E; Reflection tells you how to *anticipate* your future self."  
      ***Why now:*** Principle emerges naturally from the coin example, avoiding a decontextualized axiom drop.

  4.  **The Physician Case (Vetted)** (15 mins)  
      *Depends on:* Steps 1-3.  
      ***Vetting:*** Your example is **ideal** if modified slightly.  
      - **Must Have:**  
          - Clear *noise* (processing failure, not evidence loss): "After 24hrs on shift, she knows she’ll neglect the base rate when interpreting the test."  
          - Quantifiable error: "She currently estimates P(Disease) = 2%. She knows exhaustion will make her overestimate to ~10% tomorrow, regardless of the actual test result."  
          - Current awareness: She *now* judges this future shift as unwarranted.  
      - **Must Lack:**  
          - Any suggestion of new *misleading* evidence (it’s pure cognitive failure).  
          - Ambiguity about evidence retention (she *has* the base rate data; she misapplies it).  
      ***How:*** Have students compute P_0(Disease | P_1(Disease) = 0.1). Reflection says this should be 0.1, but her *actual* P_0(Disease) is 0.02. Violation feels rational → **leak/noise asymmetry revealed**.  
      ***Why now:*** Forces confrontation with Reflection’s plausibility. Noise violates Reflection rationally; leaks (e.g., "I’ll forget the base rate") *might* satisfy it. *Pedagogical bet: Leak/noise is the right axis.*

  5.  **Diachronic Dutch Book (DDT)** (15 mins)  
      *Depends on:* Steps 1-4 (especially conditional bets).  
      *How:*  
          - Show a *conditional bet* offered *today*: "Bet on A at odds set by your current P(A | P_t(A)=x), paying off only if P_t(A)=x."  
          - Tomorrow, if P_t(A)=x, bookie offers a bet *against* A at odds x:1.  
          - Violating Reflection guarantees loss (e.g., if P_0(A | P_t(A)=x) > x, bookie sells the conditional bet today, then buys a bet against A tomorrow if P_t(A)=x).  
      ***Placement Cost:*** Risk of equating exploitability with irrationality.  
      ***Placement Benefit:*** Shows a *structural vulnerability*, not irrationality. **Explicitly state:** "This shows you’re *exploitable* if you violate Reflection. But our physician case suggests this *might be rational*. Exploitability ≠ irrationality when your future self is flawed." *Contested: Whether DBT justifies rationality or merely coherence.*

  ---

  ### **Misconception Map** (15 mins total)
  Address these **as they arise organically** (timing cues below), using the physician case and Dutch book:

  1.  **"Reflection = Expected future credence"**  
      *Real?* YES. *When to kill:* **At Statement (Step 3)**. Contrast P_0(A) = E[P_t(A)] (uncontroversial) with P_0(A | P_t(A)=x) = x. Use physician: Her E[P_1(Disease)] ≈ 0.1, but P_0(Disease) = 0.02 ≠ 0.1.

  2.  **"Adopt your future credence now"**  
      *Real?* YES. *When to kill:* **After Physician Case (Step 4)**. Stress: Reflection constrains *conditional* credence, not your *unconditional* P_0(A). Physician shouldn’t set P_0(Disease)=0.1; she should set P_0(Disease | P_1(Disease)=0.1) = 0.1.

  3.  **"Reflection = Conditionalization"**  
      *Real?* YES. *When to kill:* **At Statement (Step 3)**. Contrast inputs: Conditionalization uses *evidence E*; Reflection uses *your future credence*. Physician *would* conditionalize on new test data; Reflection fails because her future credence isn’t based *only* on evidence.

  4.  **"Forbids changing your mind"**  
      *Real?* YES. *When to kill:* **After Physician Case (Step 4)**. Reflection *permits* changing your mind *with evidence*. Physician’s problem: Her future change isn’t evidence-driven.

  5.  **"DDB guarantees loss vs. any bookie"**  
      *Real?* Artefact of over-interpreting DDB. *When to kill:* **During DDB (Step 5)**. Emphasize: Exploitability requires a bookie who knows your credences and strategy. The physician might avoid bets if she anticipates her exhaustion.

  6.  **"Identical to dynamic consistency"**  
      *Real?* Partial artefact (CS students). *When to kill:* **After DDB (Step 5)**. Clarify: Dynamic consistency (e.g., in sequential decisions) concerns *preference* stability under information; Reflection concerns *belief* stability. They align only if beliefs guide preferences via EU. *Pedagogical bet: Distinguish here.*

  7.  **The Missing Misconception:**  
      **"Reflection applies only to rational future selves."**  
      *Real?* CRITICAL. *When to kill:* **During Physician Case (Step 4)**. Van Fraassen’s principle is *unqualified*, but students will intuit it’s for "good" future selves. State: "Reflection *as stated* demands deference even to *known-irrational* future credences. That’s why the physician case bites."

  ---

  ### **Closing Question** (5 mins)
  **"In the physician case, she violates Reflection. Is this rationally *required* (because she knows her future self is impaired), or rationally *prohibited* (because coherence demands it)?"**  
  - **Competent Answer:** Must cite *both* the DDB (coherence pressure) *and* the rational foreseeability of error (noise defeats blind deference). Distinguishes memorization ("Reflection says X") from grappling with tension.  
  - **Target:** Surface the core debate: Is Reflection a *truth-directed* norm or a *coherence* norm?  

  ---

  ### **Omissions & Framing** (5 mins)
  **Openly decline:**  
  1.  **Generalized Reflection** (e.g., P_0(A | P_t(A) ∈ [x,y]) = E[P_t(A) | P_t(A) ∈ [x,y]]).  
      *Frame:* "This extends the principle but requires more machinery. It’s debated whether this is the *right* generalization."  
  2.  **Non-ideal agents & bounded rationality.**  
      *Frame:* "We’ve assumed probabilistic coherence throughout. But what if future selves are *systematically* flawed? That’s cutting-edge—see work by [e.g., Pettigrew] but no consensus."  
  3.  **Alternate justifications (e.g., epistemic authority).**  
      *Frame:* "Some argue Reflection is about self-trust, not Dutch Books. We lack time to evaluate this; it’s contested whether Dutch Books *support* Reflection at all in noise cases."  

  **Settled vs. Contested:**  
  - **Settled:** Formalism of Reflection; DDB for violators; equivalence to deference principles *if* future credences are rational.  
  - **Contested:** Whether Reflection binds when future irrationality is known (*physician case is the battleground*); whether DDB provides *rationality* (vs. coherence) grounds; "leak" cases (e.g., forgetting) as compliance exceptions.  

  ---

  ### **Summary Flow**
  0–10m: Attitudinal Conditional Credence → 10–20m: Future Credences as Conditioners → 20–25m: Reflection Statement → 25–40m: Physician Case (noise/leak asymmetry) → 40–55m: Diachronic Dutch Book → 55–70m: Misconception Triage → 70–75m: Closing Question + Omissions.  

  **Costs/Benefits of Order:**  
  - **Dutch Book after Physician:** Avoids "exploitability=irrationality" trap but risks feeling tacked-on. *Mitigation:* Frame DDB as "formalizing the vulnerability" exposed by the case.  
  - **Noise/Leak First:** Anchors intuition but may oversimplify. *Mitigation:* Present as a *challenge* ("When *should* you defer?") not a solution.  
  - **Single Case Focus:** Builds depth but may narrow perspective. *Mitigation:* Use variations in misconception discussion (e.g., "What if she *forgot* the base rate?").  

  This sequence forces engagement with Reflection’s counterintuitive bite while leveraging CS students' intuition for dynamic pitfalls. The physician case, framed as *noise*, perfectly encapsulates the "known future irrationality" failure mode and justifies Dutch Book skepticism.
