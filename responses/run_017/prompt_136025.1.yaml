prompt: |-
  You are a political philosopher with experience advising public bodies — a conceptual consultant to legislators rather than a lecturer. Please think carefully and in stages: begin with a short "design notes" section in which you list, before drafting anything, the distinctions you think must survive translation into a usable procedure and the ones you are willing to drop, and why. Only then produce the procedure itself. Do not pad the answer with bibliographies, histories of the concepts, or citations: I need something my staff can run, and any step that depends on having read a particular author is a step I have to throw away.

  The setting: I head a small scrutiny unit inside a regional government. Every secondary instrument the executive lays before the assembly must now carry a two-page "liberty statement" alongside its existing economic and environmental appraisals. My team is two policy generalists with law and economics training, no philosophy, roughly one working day per instrument, and we process about sixty a year. Statements are published, are routinely quoted back at ministers by opposition members and by consultees, and can be cited in judicial review; a minister may overrule a statement but must give written reasons. The audience is a five-member board that signs off and ministers who will happily strip out anything they find inconvenient. So the procedure has to be legible to non-specialists, hard to game, and honest about its slack.

  The material: the three-way distinction among negative liberty (freedom as the absence of interference by others), positive liberty (freedom as self-mastery, self-direction, or the real capacity to act on what one wants), and republican liberty (freedom as non-domination, i.e. not being subject to another's power of arbitrary interference). You should assume my analysts know these labels and nothing more.

  What I want from you:

  1. Fix the operative readings before you write the steps. In particular: which reading of positive liberty the procedure will use, given that the phrase covers several different ideas — rational self-direction, effective power or capability, and collective self-rule — and that the third of these is the one that lets an executive justify coercing someone for their own freedom. Say what your choice costs you. Also specify the baseline against which interference is counted (pre-policy status quo? counterfactual of no government action? some moralized baseline?) and how an analyst decides, since this choice silently drives verdicts.

  2. The procedure itself: an ordered set of gates or questions, what counts as a sufficient answer to each, where the procedure terminates with a negative finding, and where it hands the decision to a human being because the issue is one of values rather than facts. It should be runnable in the time available by someone with my team's background.

  3. A scoring discipline that refuses to aggregate. My ministers want a single net verdict per instrument; I believe a net score across the three concepts would be a fabrication. Give me the reporting format you think is defensible instead — three separate lane findings plus an explicit conflict flag when the lanes diverge, and a rule for when a flagged conflict must be escalated rather than resolved by my team.

  4. A domination check that is genuinely operational: how an analyst identifies the relevant power-holder, how she tests whether the power is arbitrary without being handed a full theory of interests, how she measures exposure when no one is actually interfering (the unconstrained master who never exercises the power), and how she handles the case where a measure removes a private power only to vest an equivalent power in an inspectorate or agency. Include an exit-cost and a contestability step, and tell me what an analyst should do when a measure fails the contestability gate but passes the others — recommend rejection, or recommend a compulsory sunset and review? Is that second option an application of the theory or a political fudge?

  5. An anti-capture guard. Many instruments arrive with a covering note explaining how the policy gives people real freedom. Build in a test that catches the two failure modes I actually see: an appeal to the affected person's own will where that will has been shaped by the arrangement under review, and an appeal to collective self-rule that turns coercion into an expression of freedom.

  Then run the finished procedure on three instruments, showing your working at each gate rather than just the verdict:

  A. Automatic enrolment of employees into an occupational pension scheme with a right to opt out, and contributions deducted at source.
  B. A statutory requirement that dismissals be for cause, enforced by a labour inspectorate with power to award reinstatement.
  C. Conditional cash transfers to low-income parents, payment contingent on recorded attendance at health and parenting appointments. This is the government's flagship social policy and my board is friendly to it. Do not soften what the procedure returns; if it comes out badly for the measure, say so and say which gate does the damage.

  End with a limits section: what the procedure will systematically miss or misrank (cases where the loser is not the person the instrument targets, diffuse or structural power with no identifiable holder, the impossibility of comparing one instrument against another, the drift by which a well-designed template becomes a rubber stamp), and the circumstances in which I should override it rather than publish what it says.
reasoning: |-
  Okay, the user heads a scrutiny unit that assesses secondary legislation for its impact on liberty. They need a practical procedure that their team can implement quickly. Let me start by breaking down the core requirements. They mentioned three types of liberty: negative, positive, and republican. The challenge is making these concepts operational without philosophical complexity. 

  First, the user wants clarity on how positive liberty is defined. The term can mean rational self-direction, capabilities, or collective self-rule. Collective self-rule is risky because it could justify coercion in the name of freedom. The user's team needs to avoid that. Opting for a capabilities approach (like Sen's) makes sense here. It focuses on whether the policy enhances individuals' real opportunities. The downside is that it might miss deeper autonomy issues, but it's more concrete for analysts to assess. 

  Next, the baseline for interference. Using the pre-policy status quo is practical. It's measurable and avoids counterfactual speculation. The team can look at current constraints and see how the policy changes them. A moralized baseline would be too subjective and time-consuming.

  For the procedure itself, it needs clear steps. Each gate should have specific questions with binary or threshold-based answers. Negative liberty: does the policy impose new restrictions? Positive: does it enhance capabilities without coercion? Republican: does it reduce domination? Conflicts between these should be flagged, not averaged. 

  The domination check is tricky. Identifying power-holders involves looking at who can interfere arbitrarily. Defining "arbitrary" without a full theory of interests requires a procedural test: is there oversight and redress? Exposure is measured by the power's existence, not its use. If a policy replaces private power with state power, the analyst must check if the state's power is non-arbitrary (via contestability and exit costs). 

  Anti-capture guards are crucial. The team must watch for manipulated preferences (e.g., shaped by the policy itself) or coercion framed as collective freedom. Questions should force analysts to verify if preferences are formed independently and if coercion is truly necessary. 

  Scoring should be separate for each liberty type. A conflict flag when they diverge. Escalation is needed if there's a high-impact conflict or irreconcilable trade-offs. 

  Testing on the sample policies:
  A. Pension auto-enrolment: Negative liberty might flag coercion, but opt-out reduces interference. Positive liberty enhances future capabilities. Republican checks pass if opt-out is feasible. Likely passes with minor concerns.
  B. Dismissal for cause: Negative liberty restricts employer freedom. Positive enhances worker security. Republican reduces employer domination. Conflict between negative and others; flag for escalation.
  C. Conditional cash transfers: Negative liberty issues due to coercion. Positive capabilities are improved. Republican may pass if conditions are contestable. Fails negative liberty gate due to coercion without less restrictive alternatives.

  Limitations: The procedure might miss structural power issues, diffuse harms, or long-term effects. Override when empirical assumptions are flawed or during emergencies. Also, watch for template drift where assessments become rubber stamps.

  The user's deeper needs include a defensible, transparent process that withstands political pressure and judicial review. They need to avoid net scores that obscure trade-offs. The team's capacity is limited, so steps must be feasible within a day. Ensuring the procedure is anti-gaming and captures real-world power dynamics is key.
answer: |-
  ## Liberty Impact Assessment Procedure (Design Notes)

  **Core Distinctions to Preserve:**
  1.  **Negative/Positive/Republican Separation:** Must remain distinct lanes. Aggregation destroys meaning. Reporting must show trade-offs.
  2.  **Domination as Structural Power:** Must capture *potential* for arbitrary interference, not just *actual* interference. Exit cost and contestability are key operational proxies.
  3.  **Anti-Capture:** Must prevent "freedom through coercion" justifications and preference-shaping circularity.
  4.  **Operational Baselines:** Must use simple, observable benchmarks to avoid endless philosophical debates during JR.

  **Distinctions to Drop/Simplify:**
  1.  **Positive Liberty Nuances:** Drop "rational self-direction" (too subjective) and "collective self-rule" (too easily weaponized for coercion). Adopt **"Capability Enhancement" (Sen-lite):** Focuses on *effective access to options/resources*. Cost: Loses depth on autonomy/internal constraints, but gains objectivity for resource/access assessment.
  2.  **Moralized Baselines:** Drop. Use **Pre-Policy Status Quo** as baseline for interference. Why: Counterfactuals are speculative; moral baselines require contested theory. Analysts *observe* current constraints/options and measure *changes* caused by the instrument.
  3.  **Full Republican Theory:** Drop defining "arbitrary" via true interests. Use **Procedural Safeguards** (oversight, redress) and **Empirical Power Disparity** as proxies.

  **Operational Procedure**

  **Step 0: Initial Capture Check (Anti-Gaming)**
  *   **Q0.1:** Does the instrument's justification claim it enhances freedom primarily by *shaping preferences* (e.g., "people will learn to want X") or by *coercing individuals for their alleged own good* (excluding uncontroversial paternalism like seatbelts)? (Y/N)
  *   **Q0.2:** Does the justification rely on "collective freedom" to override specific individual objections raised by the measure? (Y/N)
  *   **Sufficiency:** If **YES** to either, flag "CAPTURE RISK: Justification relies on contested freedom concepts" in the final report. **Proceed regardless.** (This flags bad faith arguments but doesn't stop assessment).

  **Step 1: Negative Liberty Gate (Interference)**
  *   **Q1.1:** Does the instrument create a **new** legally enforceable prohibition, requirement, sanction, or significant administrative burden (beyond trivial form-filling) on any individual or non-state entity? (Y/N)
  *   **Q1.2:** Does it significantly **increase the cost** (time, money, effort) or **reduce the feasibility** of a previously lawful option for any individual or non-state entity? (Y/N)
  *   **Sufficiency:** A **YES** to Q1.1 or Q1.2 indicates a *prima facie* negative liberty restriction. **Proceed to Step 2.** (A "NO" yields a "No Negative Restriction" finding).

  **Step 2: Positive Liberty Gate (Capability Enhancement)**
  *   **Q2.1:** Does the instrument directly provide or significantly improve access to *material resources* (cash, goods, services), *essential opportunities* (education, healthcare, legal aid), or *critical information* enabling informed choice, for a defined group? (Y/N)
  *   **Q2.2:** Does it remove a *significant, identifiable barrier* (cost, complexity, lack of awareness) that previously prevented a defined group from accessing an existing option/resource? (Y/N)
  *   **Sufficiency:** A **YES** to Q2.1 or Q2.2 indicates a *prima facie* positive liberty enhancement. **Proceed to Step 3.** (A "NO" yields a "No Positive Enhancement" finding).

  **Step 3: Republican Liberty Gate (Non-Domination)**
  *   **Step 3a: Identify Power-Holder & Power**
      *   Identify the entity (state agency, private actor) granted significant *new* discretionary power OR having an *existing* discretionary power significantly *broadened* by the instrument (e.g., inspection, approval, sanction, rule-setting). If none, "No Domination Issue". Else, proceed for each identified power.
  *   **Step 3b: Arbitrariness Check**
      *   **Q3b.1:** Is the power constrained by clear, public rules/criteria limiting its scope? (Y/N)
      *   **Q3b.2:** Is there a formal, accessible, independent mechanism for those subject to the power to challenge its exercise (e.g., appeal tribunal, ombudsman, judicial review)? (Y/N)
      *   **Q3b.3:** Is the power subject to effective oversight (e.g., reporting to legislature, independent audit)? (Y/N)
      *   **Arbitrary?** Mark power as **"Arbitrary"** if **NO** to *both* Q3b.1 *and* Q3b.2. (Q3b.3 is supporting evidence). Else, mark "Non-Arbitrary".
  *   **Step 3c: Exposure Check (Even if Non-Arbitrary)**
      *   **Q3c.1 (Exit Cost):** For those subject to the power, is the cost (financial, social, practical) of removing themselves from its reach *prohibitively high*? (Y/N - Use common sense: quitting a job vs. leaving a country).
      *   **Q3c.2 (Contestability):** Is the process for challenging the power (identified in Q3b.2) *realistically accessible* (affordable, timely, comprehensible) to those typically subject to it? (Y/N - Consider legal aid, complexity, delays).
  *   **Step 3d: Synthesis & Vesting Check**
      *   **Domination Risk?** Mark power as posing **"Domination Risk"** if:
          *   It is "Arbitrary" (Step 3b), OR
          *   It is "Non-Arbitrary" but **fails Q3c.2 (Contestability)**.
      *   **Vesting Check:** If the instrument *removes* a private power (e.g., bans a contract term) but *vests equivalent discretionary power* in a state body, apply Steps 3a-3d to the *new state power*. Does this new power pose a Domination Risk? (Y/N)
  *   **Sufficiency:** If *any* power (new, broadened, or vested) poses a **Domination Risk**, the finding is **"Domination Risk Present"**. Else, **"No Domination Risk"**. **Proceed to Reporting.**

  **Reporting Format & Conflict Escalation**
  *   **Three Separate Lane Findings:**
      *   Negative Liberty: "Restriction Present" / "No Restriction"
      *   Positive Liberty: "Enhancement Present" / "No Enhancement"
      *   Republican Liberty: "Domination Risk Present" / "No Domination Risk"
  *   **Conflict Flag:** Add **"CONFLICT"** if findings are not unanimously positive or negative (e.g., Restriction + Enhancement; Domination Risk + Enhancement; etc.).
  *   **Escalation Rule:** Escalate to the Board (with clear briefing) ONLY if:
      1.  **Conflict Flag** is raised **AND**
      2.  The restriction/risk is assessed as **High Severity** (significant population affected, profound impact on core life choices/security) **OR**
      3.  The **Anti-Capture Flag (Step 0)** is raised **AND** a restriction/risk is present.
  *   **Analyst Action on Failed Contestability (Q3c.2) but otherwise passes:** **Recommend a compulsory sunset and review clause** focused *specifically* on improving contestability mechanisms. This *is* an application of the theory (reducing arbitrariness via institutional design), not just a fudge. Only recommend *rejection* if contestability failure is severe *and* coupled with high severity.

  **Anti-Capture Guard (Integrated in Step 0)**
  *   Step 0 directly targets the specified failure modes:
      *   **Q0.1:** Catches "shaped will" justifications (e.g., "once enrolled, they'll be grateful").
      *   **Q0.2:** Catches "collective freedom overrides individual" justifications (e.g., "this coercion expresses the people's true will").
  *   Flagging these alerts the Board/JR that the justification relies on philosophically contested grounds.

  ---

  **Procedure Test Runs**

  **A. Auto-enrolment Pension (Opt-out, Deduction at Source)**

  *   **Step 0 (Capture):** Q0.1 (Shaped Will? Unlikely justification). Q0.2 (Collective Override? Unlikely). **No Flag.**
  *   **Step 1 (Negative):** Q1.1 - Creates new requirement on employers (admin burden), temporarily restricts employee wages (until opt-out). **YES (Restriction Present).**
  *   **Step 2 (Positive):** Q2.1 - Enhances access to pension savings (resource). **YES (Enhancement Present).**
  *   **Step 3 (Republican):**
      *   3a: Identifies *Employer* (must administer) - Not new/broadened significantly. *State* (sets rules) - Existing power, not significantly broadened. No *new* discretionary power identified. **Finding: No Domination Risk.**
  *   **Reporting:** Neg: Restriction. Pos: Enhancement. Rep: No Risk. **CONFLICT Flag? YES** (Restriction + Enhancement). **Escalate?** Severity of restriction likely Moderate. **No Escalation.** Report stands.

  **B. Dismissal for Cause (Enforced by Labour Inspectorate w/ Reinstatement Power)**

  *   **Step 0 (Capture):** Q0.1/0.2 Unlikely. **No Flag.**
  *   **Step 1 (Negative):** Q1.1 - New restriction on employers (can't dismiss at will). **YES (Restriction Present).**
  *   **Step 2 (Positive):** Q2.1 - Enhances worker job security (resource/opportunity). **YES (Enhancement Present).**
  *   **Step 3 (Republican):**
      *   3a: Identifies *Labour Inspectorate* - Granted significant new discretionary power (investigate dismissals, award reinstatement).
      *   3b: Arbitrariness? Q3b.1 (Clear rules? Likely Y). Q3b.2 (Challenge mechanism? Assume Tribunal/JR exists - Y). Mark "Non-Arbitrary".
      *   3c: Exposure: Q3c.1 (Exit Cost for worker? High - quitting job). Q3c.2 (Contestability for *employer*? Can employer challenge reinstatement order? Likely via Tribunal - Y, assuming accessible).
      *   3d: Vesting Check? Removes employer's arbitrary dismissal power, vests power in Inspectorate. New state power assessed as Non-Arbitrary & Contestable. **Finding: No Domination Risk** (Assuming robust tribunal).
  *   **Reporting:** Neg: Restriction. Pos: Enhancement. Rep: No Risk. **CONFLICT Flag? YES. Escalate?** Severity High (fundamental employment rights). **YES - Escalate to Board.** (Trade-off between employer freedom and worker security/status is high-stakes).

  **C. Conditional Cash Transfers (Payment contingent on appointments)**

  *   **Step 0 (Capture):** Q0.1 - *Very likely YES* (Justifications often include "encouraging positive behaviours" implying shaping). Q0.2 - Possibly YES ("Investment in human capital/future freedom"). **FLAG: CAPTURE RISK.**
  *   **Step 1 (Negative):** Q1.1 - Creates new requirement (attend appointments) under threat of sanction (loss of cash). **YES (Restriction Present - Conditional coercion).**
  *   **Step 2 (Positive):** Q2.1 - Provides cash (resource). Q2.2 - May remove barrier (cost) to accessing health/parenting support. **YES (Enhancement Present).**
  *   **Step 3 (Republican):**
      *   3a: Identifies *State Agency* - Power to verify attendance, withhold payment. Discretion exists (e.g., defining "valid" appointment, handling excuses).
      *   3b: Arbitrariness? Q3b.1 (Rules? Likely Y). Q3b.2 (Challenge? Assume appeals process exists - Y). Mark "Non-Arbitrary".
      *   3c: Exposure: Q3c.1 (Exit Cost? Very High - loss of essential income). Q3c.2 (Contestability? Is appeals process *realistically accessible* for vulnerable, time-poor, potentially less literate parents? **Often a weak point - Assume NO for test**). Fails Contestability.
      *   3d: **Domination Risk? YES** (Non-Arbitrary Power but fails Contestability).
  *   **Reporting:** Neg: Restriction. Pos: Enhancement. Rep: **Domination Risk Present.** **CONFLICT Flag? YES. CAPTURE FLAG? YES. Escalate?** Severity High (vulnerable group, essential income). **YES - Escalate to Board.** (Gate doing damage: Step 3c.2 Contestability failure + Step 0 Capture Flag).

  ---

  **Limits & Override Circumstances**

  1.  **Systematic Blind Spots:**
      *   **Diffuse/Structural Power:** Power held by markets, social norms, or complex systems without a clear "holder" (e.g., algorithmic bias, credit scoring).
      *   **Non-Targeted Losers:** Impacts falling on groups not the instrument's focus (e.g., landlords affected by tenant protections, competitors affected by subsidies).
      *   **Comparative Assessment:** Cannot rank instruments against each other or assess cumulative effects of multiple instruments.
      *   **Long-Term/Indirect Effects:** Focuses on direct, proximate impacts. Misses slow-burn effects (e.g., cultural shifts from nudges).
      *   **Rights Conflicts:** Doesn't resolve clashes with other fundamental rights (privacy, property) except via Liberty lenses.
      *   **Template Drift:** Risk of mechanistic application, ignoring context, or pressure to avoid "problematic" findings.

  2.  **When to Override the Procedure:**
      *   **Empirical Failure:** Strong evidence the procedure misapplied facts or missed key evidence about impacts/feasibility.
      *   **Novel Context:** The instrument operates in a genuinely unprecedented situation (e.g., severe pandemic, technological rupture) where standard baselines don't apply.
      *   **Overriding Public Emergency:** A clear, immediate, and extreme threat to public safety/order justifying temporary suspension of normal assessment (rare, documented).
      *   **Formal Legal Incompatibility:** The instrument implements a non-discretionary legal requirement (e.g., transposing binding int'l law) where the assessment is informative but not determinative.
      *   **Addressing a Blind Spot:** Where a significant impact identified *outside* the procedure (e.g., structural harm to non-target group) needs acknowledgment.
      *   **Avoiding Drift:** If the Board suspects the template is being gamed or applied robotically.

  **Override Principle:** Overrides must be **explicitly justified in writing** by the Unit Head/Board, citing the specific limit/exception and the rationale, published alongside the assessment. The procedure's findings *must still be published*. Override is an exception, not the norm.
