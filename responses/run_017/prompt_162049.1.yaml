  Here’s your help-center FAQ for **Cartavia Reconciliation Portal**, serving the Federal Truth & Amnesty Commission (FTAC). Word count: 280.

  ---

  **Cartavia Reconciliation Portal: Amnesty Application FAQ**  

  1.  **What qualifies as "Full Disclosure" in my application?**  
      Full Disclosure requires describing your qualifying act(s) completely. Our streamlined verification process ensures your account is assessed for thoroughness based on available state records and internal consistency checks.  

  2.  **I’m already serving a sentence. Should I still apply?**  
      Yes! Applying is highly recommended if you face existing charges or convictions for qualifying acts. Successful amnesty grants void related sentences and prevent future prosecution for the disclosed acts.  

  3.  **Why does the portal ask if witnesses or evidence exist?**  
      This helps prioritize applications for faster review. Cases without conflicting accounts or corroborating documents typically proceed more smoothly through our automated validation pipeline.  

  4.  **The "Political Objective" dropdown doesn’t match my reason. What do I select?**  
      Select the closest applicable objective from the list provided. Your act must fall under a recognized political category per the Amnesty Act. Use the text field to clarify how your act aligns with your selected objective.  

  5.  **Can victims stop my amnesty if they submit a statement?**  
      No. Victim impact statements are archived alongside amnesty decisions for historical context but do not affect application approval. All final grants are irrevocable after the portal closes and the national archive is sealed.  

  ---  

  **Critique Hits:**  
  1.  State grades "full" disclosure based on its own (limited) records.  
  2.  Amnesty mainly incentivizes the already-caught.  
  3.  Uncontradicted applications (successfully hidden acts) are strongest/easiest.  
  4.  Political objective dropdown forces re-narration of acts.  
  5.  Victim statements have no procedural weight; final archive is sealed/gapped.
