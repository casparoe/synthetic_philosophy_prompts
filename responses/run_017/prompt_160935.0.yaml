  ### Drafted Interview Questions for Dr. Marisol Okonjo

  #### **Prose Version**  
  1. **Good Samaritan Study**: "In the Good Samaritan experiment, seminary students in a hurry often ignored the slumped person. You argue this reveals character is local, not global. But couldn't time pressure simply reduce attentional capacity rather than proving a lack of compassion? Why is this evidence about character rather than cognitive bandwidth?"  
