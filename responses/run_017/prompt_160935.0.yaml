  We are drafting 10-12 questions for an interview with Dr. Marisol Okonjo. The questions should target specific commitments of her view and press on the points listed, ending with a question about evidence against the view. We have five main topics and we want at least one question per topic. We also need a follow-up for each, and we must assess the deflection risk (low, medium, high).

