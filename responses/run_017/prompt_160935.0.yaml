      Follow-up: But then if we attribute the virtue to the system, and the system is designed by a person, then the person has the virtue? But what if the system outlives the designer? And if the system is a piece of software, which has no intentions, how can it have a virtue? Doesn't virtue require agency?
      Concession: She might have to admit that her view extends virtue to non-agential systems, which breaks with traditional virtue ethics, or she must provide an account of agency that includes systems.
