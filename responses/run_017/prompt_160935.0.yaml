      Deflection risk: medium. She might try to say that the habit is a building block but the virtue requires more.

   5. (Topic 4a) You suggest we should engineer local virtues by designing situations. If I raise a child by carefully arranging her environment so that she reliably acts kindly in specific situations, have I given her a virtue or just managed her behavior? And if she moves to an environment without those scaffolds, will she still be kind?

      Target: Moral education and the durability of virtues.
      Her likely reply: "The goal is to build up a repertoire of local virtues that can be activated in a variety of situations, and over time, with enough overlapping scaffolds, the person becomes more generally virtuous."
      Follow-up: But that sounds like the old global character traits you reject. How can local virtues become more general without becoming global? And if they remain local, then isn't the person only virtuous in the specific situations they've been scaffolded for?
