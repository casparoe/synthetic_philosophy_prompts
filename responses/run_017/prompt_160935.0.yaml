   1. Start with Good Samaritan to set the stage (topic 1).
   2. Then Milgram (topic 2) to show consistency in bad behavior.
   3. Then boundary question (topic 3) to challenge the concept of virtue.
   4. Then moral education part (a) (topic 4a).
