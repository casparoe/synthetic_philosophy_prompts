   We can also note that the fundamental attribution error (FAE) is about attributing behavior to character rather than situation. Her point is that at the system level, we are attributing the virtue to the system (the situation setup) rather than the individuals.

   How to pressure:

   - For the Good Samaritan: press on whether the situational factor (time pressure) is revealing a lack of virtue or just a lack of attention? If it's a lack of attention, then maybe the virtue of compassion is still there but was overridden by a competing demand. Her view is that virtues are local and scaffolded. So she might say that the virtue of compassion in that specific situation (seeing someone in need when in a hurry) wasn't present because the scaffold (having time) wasn't there. But then the question is: why call that a character flaw? Why not just an attentional one?

   - For Milgram: if the person is reliably obedient in that situation, then by her definition, they have a local virtue (of obedience?) but that's a bad thing. So we need to ask whether local virtues can be bad and how her theory accounts for that.

   Let's draft the questions:

   1. (Topic 1) In the Good Samaritan study, the main factor determining whether seminary students helped the slumped person was time pressure. You've argued that this shows character isn't global but local. But why isn't it just about attention? If someone is in a hurry, they might not even notice the person, so isn't that an explanation in terms of cognitive load rather than a lack of virtue?

      Target: The interpretation of the Good Samaritan study as revealing about character (local virtues) rather than attention.
      Her likely reply: "Attention is part of the scaffold; without the time to notice, the virtue of compassion cannot be activated in that situation."
      Follow-up: But if the virtue only activates when there's time to notice, then isn't the virtue of compassion here entirely dependent on the situation having no time pressure? How is that different from saying the person doesn't have a stable disposition to be compassionate, but only when conditions are perfect?
      Concession: She might have to concede that without the scaffold, the person doesn't have the virtue at all, and that the virtue is entirely situation-dependent to the point of being ephemeral.
      Deflection risk: medium. She might try to say that the setup (including time) is part of the virtue's condition, and that's the point.

   2. (Topic 2) In the Milgram obedience experiments, ordinary people consistently administered what they thought were dangerous shocks when instructed by an authority figure. By your account, wouldn't that mean these individuals had a reliable disposition to obey in that specific situation-type? And if so, does that count as a local virtue? If not, why?

