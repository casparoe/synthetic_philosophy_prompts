  2. **Milgram Obedience**: "In Milgram’s experiments, participants consistently obeyed authority to administer shocks. Doesn’t this demonstrate a reliable, situation-specific disposition—just toward cruelty? Couldn’t your framework call this a 'local virtue' of obedience, even if morally abhorrent?"  
     *Follow-up*: If not, how do you prevent local virtues from being value-neutral tools that could reward cruelty as easily as kindness?  

  3. **Virtue vs. Habit Boundary**: "You describe virtues as reliable dispositions propped up by scaffolds. But if removing the scaffold (e.g., a norm or doorway) makes the 'virtue' vanish, how is this different from a habit or reflex? What does 'virtue' add that 'habit' doesn’t capture?"  
     *Follow-up*: If virtues are just habits dependent on external crutches, does this reduce virtue ethics to behavioral engineering?  

  4. **Moral Education**: "If you raise a child by engineering situations to elicit kindness—say, structured playdates with sharing rules—have you cultivated a virtue in the child, or just managed her behavior? What remains of the child’s 'character' if the scaffolds do all the work?"  
     *Follow-up*: How would this child fare in an unscaffolded crisis requiring improvisation, where no pre-engineered script exists?  

  5. **Unscaffolded Work**: "What about roles like ER doctors or artists, who face novel, high-stakes decisions without scripts? If virtues are local and scaffolded, does your theory imply they can’t be virtuous in those moments—only lucky or well-trained?"  
     *Follow-up*: If improvisation relies on internalized scaffolds, how is that not a global trait in disguise?  

  6. **System Virtue (Designer Focus)**: "You argue the designer of a system holds the virtue, not the individuals in it. But if I design a hospital’s honesty-preserving workflows, am *I* 'honest'—even if I lie constantly in personal life? How can I 'have' honesty when it’s not expressed in my behavior?"  
     *Follow-up*: Doesn’t this risk divorcing virtue from personal accountability, reducing it to technical cleverness?  

  7. **System Virtue (Institution Focus)**: "If the designer holds the virtue, why not the hospital itself? If the system reliably produces honest outcomes, why deny the *institution* is 'honest'? What’s the barrier to collective attribution?"  
     *Follow-up*: If you reject this, how is your view different from saying institutions merely *create* honesty without *being* honest?  

  8. **System Virtue (Software Focus)**: "Extending that logic: Could a piece of software be 'conscientious' if it reliably follows ethical protocols? Or does virtue require intention—something algorithms lack?"  
     *Follow-up*: If you deny software can have virtues, but accept institutions can, what’s the threshold for 'having' a virtue—design, adaptation, or something else?  

  9. **Deflecting the FAE Claim**: "You often call institutional virtue attribution 'the fundamental attribution error one level up.' But the FAE is a *bias*—a mistake. Are you saying it’s *wrong* to call systems virtuous, or that it’s *correct* because systems *are* the real causal force?"  
     *Follow-up*: If the latter, how is crediting a hospital’s 'honesty' not just describing its structure while emptying 'virtue' of its psychological essence?  

  10. **Evidence Against the View**: "What evidence could falsify your theory? For instance, if someone acted identically virtuously across scaffolded *and* unscaffolded contexts (e.g., helping strangers both inside and outside 'engineered' doorways), would that undermine your localism?"  
      *Follow-up*: If not, does this make your framework unfalsifiable?  

