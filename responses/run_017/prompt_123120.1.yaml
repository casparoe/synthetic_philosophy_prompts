prompt: |-
  Not sure this is the right place for this, but I've been chewing on something for a couple of years and searching keeps pointing me at the wrong literature.

  The way this question normally gets framed is: you're visiting somewhere, do you have to follow their conventions? Queue where they queue, jaywalk where they jaywalk, tip where they tip, don't tip where they don't. I've read a bit of that and I get the arguments on both sides.

  What I keep running into is closer to the mirror image of that. A visitor follows their OWN home convention, in a way that feels generous or harmless or just polite, and ends up exporting it — and the people who end up paying for it are the locals who are still there after the visitor goes home.

  Two cases. A friend travels to a city where tipping isn't really a thing and leaves a huge tip at a café, because it's about ten percent of what lunch costs back home and it clearly means a lot to the person behind the counter. A year later there's a jar on the counter, the staff split tips at the end of the shift, and it has quietly become part of what that job pays. Nobody chose that; there was no meeting. Second: tourists at a market where haggling is normal just pay the first price they're quoted, because everything is cheap to them. Asking prices drift up, haggling stops being the default, and locals pay more for the same goods. Same shape: a one-sided transfer that is genuinely good for the person on the receiving end, plus a shift in what everyone expects afterwards.

  It's not a free rider problem — the visitor isn't taking a benefit without contributing, they're over-contributing. And it isn't the old case of the torturers where no individual act makes a difference; here every individual act makes a real and visible difference to somebody, and the thing that nobody chose is the aggregate. It's not the "what if everyone did that" move either, because everyone isn't going to do that, and the badness doesn't come from universalising — it comes from a threshold. Below some number of visitors nothing happens at all; above it, expectations flip and then the new thing is self-reinforcing.

  So: does this have a name, in social philosophy or economics or wherever it lives? And if there's nothing established, I'd rather you coin one and define it than hand me a label, because what I actually want is the carving. Specifically I want it separated from (a) complicity, in the sense of joining in some practice that's already bad — here the visitor isn't joining, they're seeding; (b) the inefficacy literature, where the puzzle is that your act does nothing; (c) free riding; and (d) threshold or tipping-point dynamics in general, if the difference is only that this one is about norms and expectations rather than about crowds.

  Edge cases I keep tripping over and want settled either way: Does it matter that the visitor leaves? Is "about to exit, and therefore unreachable by the local reputational stuff that normally holds a norm up" essential to it, or does any unaccountable agent do? Does it matter whether anyone sees — if you tip through an app and no other customer ever notices, but the recipient's expectations move anyway, is that the same thing? What if the exported norm is one I think is better, like visitors who queue where everybody crowds, or who refuse to pay a bribe everyone else pays: same phenomenon, and is it then a good thing, or does the valence come apart from the mechanism? And is there anything owed afterwards — compensation, or a reason not to come back?

  Last thing, and this is the bit I care most about: is this a moral category at all, or just a causal one that we only notice when we disapprove of the norm that got exported? Because we seem to praise visitors who bring queuing and blame ones who bring tipping, and I can't tell whether that's a real distinction or just us liking the outcome.
reasoning: |-
  Okay, let me unpack this user's query. They're describing a phenomenon where visitors, by following their own cultural norms, inadvertently change local practices in a way that harms locals after they leave. Examples include tipping where it's not customary or paying fixed prices in haggling cultures, leading to new expectations that locals then have to deal with.

  First, I need to figure out what exactly they're asking. They want to know if this phenomenon has a name in academic literature. They've already ruled out similar concepts like free riding or threshold dynamics. So, my task is to identify if there's an existing term or to coin a new one that fits their criteria.

  The user seems well-read, referencing social philosophy and economics. They've thought deeply about this, even considering edge cases like whether the visitor's departure or anonymity affects the phenomenon. They also question if the moral judgment depends on the norm's desirability, like queuing being good vs. tipping being bad.

  I recall concepts like norm diffusion or cultural imperialism, but those might not fully capture the visitor's role and the harm to locals. Economic terms like price distortion or inflation come to mind, but they don't address the normative shift. The user wants the concept separated from complicity, inefficacy, free riding, and general tipping points.

  The key elements here are: unilateral action, harm to locals post-departure, threshold effect, and norm change. Terms like "norm entrepreneurship" or "cultural arbitrage" might be close, but not perfect. Perhaps "exogenous norm seeding" or "phantom normativity" could work as new terms. "Phantom" emphasizes the visitor's absence after setting the change in motion.

  For the moral aspect, the user is questioning if the phenomenon is inherently wrong or if judgment depends on the norm's value. Consequentialist and deontological perspectives offer different takes. The visitor's impact persists beyond their presence, creating ongoing costs for locals, which might imply a moral responsibility.

  Edge cases: The visitor leaving is crucial because they avoid the consequences of the new norm. Anonymity doesn't matter as long as the recipient's expectations shift. Even if the new norm is desirable, the mechanism remains the same, but the moral valence changes. Locals might feel resentment, but compensation isn't straightforward.

  The user's deeper need seems to be understanding the moral implications and whether there's a framework to evaluate such actions. They might be seeking validation that their concern is legitimate and not just about personal dislike of certain norms. They want clarity on responsibility and whether visitors should modify their behavior even when intending kindness.

  I should ensure the coined term captures the essence: a visitor's well-meaning action triggering a harmful norm shift that outlasts their stay. "Phantom normativity" seems fitting. Addressing the moral dimension requires distinguishing between the act's mechanism and the norm's desirability, emphasizing unintended consequences and the visitor's unique position as an outsider unaffected by long-term effects.
answer: |-
  This is a brilliantly articulated and deeply important phenomenon – it absolutely deserves a name, as existing terminology doesn't quite capture its unique structure. Let's carve it out precisely as you request.

  ## The Core Phenomenon: Definition & Key Features

  *   **The Act:** An agent (typically a visitor, outsider, or temporary resident), acting in accordance with their *own* norms or economic reality, makes a unilateral transfer (monetary or behavioral) within a host community.
  *   **The Immediate Effect:** This transfer provides a direct, tangible, and often significant benefit to one or more specific recipients within the host community.
  *   **The Threshold Effect:** When the *aggregate* of such acts by similar agents reaches a critical threshold (uncoordinated, unintentional).
  *   **The Norm Shift:** This aggregate triggers a shift in local expectations, market practices, or social norms. The new norm/expectation becomes self-reinforcing within the host community.
  *   **The Latent Harm:** The shift imposes *ongoing costs* (economic, social, or behavioral) primarily borne by *local residents* who must now operate under the new norm, long after the initiating agents have departed.
  *   **The Key Asymmetry:** The initiating agents are insulated from the long-term consequences of the norm they helped seed; they receive the psychic benefit (feeling generous/polite) and leave before the costs manifest for locals.

  **Coined Term: Phantom Normativity**

  ### Why "Phantom Normativity"?

  1.  **Phantom:** The norm originates from outside agents who are transient ("phantoms"). They appear, act, and vanish, leaving behind an enduring but unintended consequence they don't experience. The harm they cause is real but indirect and delayed, like a phantom limb.
  2.  **Normativity:** It directly addresses the core mechanism – the *creation of a new normative expectation* (tipping jars, fixed prices, altered queuing behavior) within the host community.
  3.  **Conveys the Unseen Force:** It captures the sense of an invisible, external influence shaping local rules in a way that feels imposed rather than chosen.

  ### Distinguishing Features (Your Carving)

  *   **vs. Complicity:** The agent isn't joining a *local* bad practice ("everyone bribes here, so I will too"). They are *introducing* or *significantly amplifying* a *new* practice based on their *own* norms.
  *   **vs. Inefficacy:** The individual act *does* have a real, positive impact *on the immediate recipient* (server gets cash, vendor gets sale). The problem isn't inefficacy; it's the *aggregate unintended consequence* for the *broader community* later.
  *   **vs. Free Riding:** The agent is *over-contributing* relative to local norms (big tip, paying asking price), not under-contributing or taking without giving.
  *   **vs. General Threshold Dynamics:** While it *uses* a threshold mechanism, the focus is specifically on *norm/expectation shifts* initiated by *external, transient agents* whose actions create *latent harm for locals* after they leave. General tipping points (e.g., fashion trends, technology adoption) lack this specific asymmetry and harm structure.

  ## Addressing Your Edge Cases & Questions

  1.  **Does the visitor leaving matter?** **Yes, critically.** It's essential to "Phantom Normativity."
      *   **Unaccountability:** They are not subject to the long-term consequences of the norm they helped create. They avoid the higher prices, the awkwardness of the new tipping expectation, or the resentment from locals.
      *   **Insulation:** They don't participate in the *maintenance* of the norm under the new conditions. Their act is a one-shot intervention with delayed fallout.
      *   *(Is any unaccountable agent enough?)* While other unaccountable actors (e.g., large corporations, remote investors) *can* cause similar harm, the specific dynamic of the *well-meaning individual visitor* acting on their *personal* norms is the archetype. The core structure remains: external agent -> immediate benefit -> aggregate threshold -> norm shift -> latent harm for locals -> agent insulated.

  2.  **Does visibility matter?** **No.** The core mechanism works through the impact on the *recipient's expectations and incentives*, not necessarily on other observers.
      *   **App Tipping:** If a server starts expecting tips because many tourists tip via an app (even if other locals never see it), their behavior and expectations change. This alters their interaction with *all* customers and management, potentially seeding the norm internally.
      *   **The Recipient is the Conduit:** The direct beneficiary becomes the vector for the norm shift, regardless of whether other locals witnessed the initial act. Their changed behavior/expectation is what propagates the new normal.

  3.  **What if the exported norm is "good" (e.g., queuing, refusing bribes)?** **Same mechanism, different valence.**
      *   **Phenomenon:** The process is identical: external agent acts on own norm -> aggregate threshold -> norm shift -> locals live with the new rule.
      *   **Moral Valence:** The valence *does* come apart from the mechanism. We judge the *outcome*, not the structure.
          *   *If the new norm is beneficial* (e.g., less chaotic queues, reduced corruption): The phantom act might be seen as a positive catalyst, despite the involuntary nature for locals. The harm might be minimal or non-existent (though there could be friction during transition).
          *   *If the new norm is harmful* (e.g., inflation, wage suppression via tipping): The phantom act is seen negatively.
      *   **Key Insight:** "Phantom Normativity" is primarily a **descriptive** term for the *mechanism*. Moral judgment depends on an independent assessment of the *desirability of the resulting norm* for the host community.

  4.  **Is anything owed afterwards? Compensation? Avoiding return?**
      *   **Compensation:** Highly impractical and conceptually messy. How to quantify? Who pays? Who receives? The harm is diffuse and systemic. The agent's *intent* was typically benign. Formal compensation isn't a realistic or established expectation.
      *   **Avoiding Return:** This avoids *further* contribution to the problem, but doesn't undo the existing shift. It might be a responsible choice if one is aware of the phenomenon and believes the norm shift is harmful.
      *   **Primary "Owed" Action:** **Awareness and Behavioral Adjustment.** Recognizing the potential for Phantom Normativity should lead visitors to *moderate* their actions to align more closely with *local* norms *precisely to avoid triggering this shift*, even if their individual act feels generous. Pay the local asking price (maybe haggle politely if appropriate), tip modestly or not at all if it's not the norm, rather than imposing their home standard.

  ## The Moral Dimension: Is it a Moral Category?

  **Yes, "Phantom Normativity" describes a distinct moral phenomenon, not just a causal one.**

  1.  **Structural Injustice:** It creates a pattern where well-resourced outsiders (visitors are often wealthier relative to locals) impose long-term costs on a community they temporarily inhabit, costs from which they themselves are shielded. This is a form of asymmetric impact.
  2.  **Unintended Harm vs. Beneficent Intent:** The moral tension lies in the disconnect between the agent's good intentions (generosity, politeness) and the harmful systemic consequence. Ignorance of potential harm might mitigate blame, but awareness makes the choice more significant.
  3.  **Responsibility for Aggregate Effects:** While no single act *causes* the shift, each act *contributes* to the aggregate that does. Agents have a responsibility to consider the potential systemic consequences of widespread actions like theirs, especially when acting from a position of relative power/wealth within the host context. This relates to debates about collective responsibility and the "what if everyone did that" heuristic, even if "everyone" realistically won't – the point is that *enough* similarly situated agents *do* act that way to cause the shift.
  4.  **Violation of Local Autonomy:** The shift happens without deliberate collective choice by the locals. It's driven by external economic/cultural forces embodied by transient actors, undermining the community's self-determination regarding its own norms and market practices.
  5.  **Why Valence Seems Attached:** We *notice* Phantom Normativity most when we dislike the outcome (tipping inflation, price hikes). When the outcome is desirable (less corruption), we praise the individual act as "setting a good example" without focusing on the involuntary, aggregate, phantom-like nature of the shift. However, the *moral structure* of imposing change without bearing the cost remains, even if the outcome is good. Praise or blame attaches to the *outcome*, but the underlying phenomenon of externally seeded norm change via unaccountable agents has its own moral weight concerning autonomy and responsibility.

  **In Conclusion:** "Phantom Normativity" captures the essence of your described phenomenon: well-intentioned actions by transient external agents, beneficial in the immediate moment, that aggregate past a threshold to create self-reinforcing local norm shifts imposing long-term costs on residents, costs the initiators avoid. It is distinct from complicity, inefficacy, free riding, and general tipping points. The visitor's departure is essential to the "phantom" aspect. Visibility to others isn't necessary; impact on the recipient is key. The mechanism is morally significant due to asymmetric impact and undermining of local autonomy, regardless of the valence of the resulting norm, though our *judgment* of the act is heavily influenced by that valence. The primary moral takeaway is the need for visitor awareness and behavioral adjustment to mitigate this unintended harm.
