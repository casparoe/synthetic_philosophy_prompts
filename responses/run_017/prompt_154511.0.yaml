answer: |-
  ### Workshop Plan: "The Estimation Challenge"  
  **Goal:** Demonstrate the inside vs. outside view, planning fallacy, and epistemic modesty through a hands-on task.  
  **Duration:** 75 minutes  
  **Group Size:** 4 groups (4–5 students each)  
  **Materials per Group:**  
  - 1 deck of 10 laminated "historical data" cards (details below)  
  - 1 pair of scissors  
  - 1 roll of tape  
  - 5 sheets of A4 paper  
  - 1 ruler  
  - 1 worksheet (with forecasting tables and reflection questions)  
  - Pens  
  **Materials for Facilitator:**  
  - Timer/stopwatch  
  - Whiteboard for tracking times  
  - Prizes: Chocolate bars (for winning group) + "mildly humiliating forfeit" (e.g., sing a silly song) for least accurate revisers  
  - Sample paper chain (3 links) for demonstration  

  ---

  ### Minute-by-Minute Flow  
  **Total: 75 minutes**  

  #### **Part 1: Setup & Task Introduction (0–10 min)**  
  - **0–5 min:** Brief intro. *"Today, we’re doing a timed task. Your goal: Build a paper chain with exactly 20 links. Each link must be 15 cm long × 2 cm wide. It must hold together when lifted. I’ll time you."* Show sample chain.  
  - **5–10 min:** Divide into groups. Hand out materials. Clarify rules:  
    - Start when timer begins.  
    - Raise hands when done for time recording.  

  #### **Part 2: Inside-View Forecasts (10–20 min)**  
  - **10–15 min:** Groups discuss and commit to **initial forecasts** on worksheets:  
    - *Point estimate:* "How many minutes will *your group* take? (e.g., 18 min)"  
    - *Uncertainty distribution:* Assign probabilities to time ranges (e.g., 0–10 min: 10%, 11–20 min: 50%, etc.).  
    - *Shift prediction:* "After seeing past groups’ data, how much will your estimate shift? (e.g., ‘+5 min’)."  
  - **15–20 min:** Collect initial forecasts. **No peeking at historical data yet!**  

  #### **Part 3: Task Execution (20–35 min)**  
  - **20 min:** Start timer. Groups build chains. Facilitator records finish times.  
  - **Stop task at 15 min** (cap to avoid overrun). Note unfinished groups as "DNF" (>15 min).  

  #### **Part 4: Outside-View Revision (35–50 min)**  
  - **35–40 min:** Give each group a **deck of 10 historical data cards**. Cards show:  
    - Completion time (minutes).  
    - Reference class (e.g., "1st-yr PhD students (unwarned)", "1st-yr PhD students (warned)", "General workshop").  
    - *Key flags:* 3 cards marked "warned about planning fallacy beforehand."  
    - **Deck composition:**  
      - Narrow class ("1st-yr PhD students"): 5 unwarned, 3 warned (median: 26 min).  
      - Broad class ("All workshops"): Includes 2 non-PhD groups (median: 22 min).  
      *Example cards:*  
        - "1st-yr PhD students, 2023 (unwarned): 30 min"  
        - "1st-yr PhD students, 2022 (warned): 20 min"  
        - "Corporate team-building, 2023: 12 min"  
  - **40–50 min:** Groups:  
    1. Sort cards into reference classes (narrow vs. broad).  
    2. Discuss whether to include/discount "warned" data.  
    3. Revise forecasts: New point estimate + distribution.  

  #### **Part 5: Scoring & Reveal (50–60 min)**  
  - **50–55 min:** Share actual finish times. Groups calculate:  
    - Absolute error: `|initial estimate - actual time|` and `|revised estimate - actual time|`.  
    - Shift: `Revised estimate - initial estimate`.  
  - **55–60 min:** **Score forecasts:**  
    - **Point estimates:** Smallest absolute error wins.  
    - **Distributions:** Use Brier scoring (lower = better). Formula:  
      `Score = Σ [ (assigned probability - 1)^2 if actual in bin, else (assigned probability - 0)^2 ]`  
      Reward honest spreads (e.g., 50% in correct bin scores better than 100% wrong).  
    - **Prizes:** Chocolate for best Brier score. Forfeit for largest error increase.  

  #### **Part 6: Debrief (60–75 min)**  
  ***Key Talking Points (map to concepts):***  
  1. **Inside vs. outside view:**  
     - *"Your initial guess? That’s the inside view: personal intuition. The historical data? Outside view: base rates."*  
     - Show how groups anchored on their story ("We’re efficient!") and ignored base rates.  

  2. **Reference-class ambiguity:**  
     - *"Did you use the narrow PhD class (slower) or broad class (faster)? Neither is ‘wrong’—it’s a judgment call."*  
     - Highlight groups that debated this.  

  3. **"Warned" data double-counting:**  
     - *"If you excluded ‘warned’ data because you too were warned, you assumed your case is special. Did that help or hurt?"*  
     - Point out if groups using "warned" data revised more accurately.  

  4. **Shift predictions vs. reality:**  
     - *"Did you predict you’d adjust more than you did? We resist outside views even when we know we should."*  

  5. **Epistemic modesty:**  
     - *"The outside view forces humility. You’re not a unique snowflake; you’re part of a distribution."*  

  ***Predictable Problems & Mitigations:***  
  - **Anchoring on loud voices:** Assign a "devil’s advocate" per group to challenge consensus.  
  - **Groups colluding:** Remind them forecasts are independent. Physically separate groups.  
  - **Task easier than feared:** Use DNF groups (>15 min) to show failure is common.  
  - **Hedging under scoring rules:** Emphasize honesty: *"The scoring rewards accuracy, not gaming."*  

  ***Limitations & Nuances (address honestly):***  
  - **"Stacked deck" critique:**  
    - *"Yes, for simple tasks like this, your inside view has little unique insight. But in research, you often overestimate your private evidence. The outside view is a sanity check."*  
  - **Hedging vs. genuine modesty:**  
    - *"Can’t distinguish true uncertainty from strategic hedging? Reality will score you later. If you hedge but are wrong, you still lose. Focus on calibrating your confidence."*  
  - **What’s missing:**  
    - *"Real projects have more nuance—but base rates still matter. The lesson isn’t ‘never use inside view,’ but ‘temper it with data.’"*  

  **Close:** Name Kahneman/planning fallacy/reference-class forecasting. *"Next time you plan, ask: What happened in similar cases?"*  

  ---

  ### Why This Works  
  - **Activity mirrors real biases:** Groups experience anchoring, base-rate neglect, and reference-class ambiguity firsthand.  
  - **Designed friction:** "Warned" data and competing reference classes force nuanced debate.  
  - **Scoring incentivizes honesty:** Brier score penalizes overconfidence; point errors keep it tangible.  
  - **Debrief preempts resistance:** Acknowledges limitations while reinforcing core principles.  

  **Handout Note:** Worksheet and materials list will be shared in American English for your collaborator.
