     Now, debrief talking points:

       1. Show of hands: How many groups revised their estimate downward? Upward?
       2. How did the actual time compare to your initial estimate? Revised estimate?
       3. How much did you shift? How did that compare to what you predicted you would shift?
       4. How did you use the historical data? Did you form a reference class? How?
          - Did anyone use only the PhD student data? What median did you get? (narrow class)
          - Did anyone use all the data? (broad class) What median?
          - Why did you choose that class?
       5. What about the groups that had been warned? Did you include them? Exclude? Discount? Why?
          - Did you think that because you were warned, you might be like the warned groups? Or did you think the warning might not have the same effect?
       6. What does this tell us about planning? 
          - Introduce the terms: planning fallacy, reference-class forecasting, inside view, outside view.
          - Epistemic modesty: We are not as unique as we think. The outside view helps correct for overconfidence.
       7. But note: In real life, sometimes you have private information. How do you combine inside and outside?
          - The outside view is a starting point (base rate), then adjust for what makes your case different. But research shows that people underadjust (still anchored) or overadjust (ignore base rate too much). So the adjustment should be modest.
       8. What can go wrong in this activity?
          - Anchoring: one person's guess might dominate.
          - Collusion: not really a problem.
