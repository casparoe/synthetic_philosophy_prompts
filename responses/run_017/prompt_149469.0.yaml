  ### Exam Question: Backward Induction Paradox in a Centipede Variant

  **Game Specification**  
  Two players, Ada (moves at nodes 1 and 3) and Bob (moves at nodes 2 and 4), alternate over four decision nodes. At each node, the mover has three options:  
  1. **Take**: Game ends; payoffs (Ada, Bob) are:  
     - Node 1: (4, 1)  
     - Node 2: (3, 8)  
     - Node 3: (14, 6)  
     - Node 4: (11, 22)  
  2. **Pass**: Move passes to the other player (if at nodes 1–3). If Bob passes at node 4, game ends with (12, 12).  
  3. **Open the side door**: Game ends immediately; opener receives 9, other receives 10 (cost to opener).  
     - Ada opens: (9, 10)  
     - Bob opens: (10, 9)  

  ---

  **(a) [7 marks]**  
  Using backward induction, determine:  
  (i) The complete strategy for Ada and Bob (specify actions at all nodes, reached or not).  
  (ii) The predicted path of play.  
  (iii) The resulting payoffs.  

  **(b) [6 marks]**  
  Suppose Ada’s payoff if Bob **Takes** at node 4 changes to 16 (payoffs: (16, 22)), all else unchanged. Redo backward induction far enough to determine actions at nodes 2 and 1. Explicitly state whether nodes 1 and 2 are reached in the path predicted in part (a).  

  **(c) [7 marks]**  
  Part (b) shows that the outcome in (a) depends on Ada’s payoff at node 4, even though node 4 is unreached in (a). Explain why this dependence is the heart of the backward induction paradox. Why does the "evidence of irrationality" reply (i.e., arriving at a late node suggests the opponent isn’t rational) fail to resolve this? Is requiring optimal actions at unreached nodes part of rationality, or an additional assumption? What happens to backward induction if we drop this requirement?  

  ---

  ### Model Answer (≈700 words)  
  **(a)**  
  *Backward induction for the original game:*  
  - **Node 4 (Bob)**: Options: Take (11,22), Pass (12,12), Open (10,9). Bob’s payoffs: 22 (Take) > 12 (Pass) > 9 (Open). Thus, Bob Takes.  
  - **Node 3 (Ada)**: Options: Take (14,6), Pass → node 4 → (11,22) → Ada gets 11, Open (9,10). Ada’s payoffs: 14 (Take) > 11 (Pass) > 9 (Open). Thus, Ada Takes.  
  - **Node 2 (Bob)**: Options: Take (3,8), Pass → node 3 → (14,6) → Bob gets 6, Open (10,9) → Bob gets 9. Bob’s payoffs: 9 (Open) > 8 (Take) > 6 (Pass). Thus, Bob Opens.  
  - **Node 1 (Ada)**: Options: Take (4,1), Pass → node 2 → Bob Opens → (10,9) → Ada gets 10, Open (9,10) → Ada gets 9. Ada’s payoffs: 10 (Pass) > 9 (Open) > 4 (Take). Thus, Ada Passes.  

  (i) **Strategies**:  
  - Ada: At node 1, **Pass**; at node 3, **Take** (unreached).  
  - Bob: At node 2, **Open**; at node 4, **Take** (unreached).  
  (ii) **Path**: Node 1 (Ada Passes) → Node 2 (Bob Opens).  
  (iii) **Payoffs**: (10, 9).  

  **(b)**  
  *Backward induction with modified node-4 Take payoff (16,22):*  
  - **Node 4 (Bob)**: Take (16,22) gives Bob 22 > Pass (12) > Open (9). Bob Takes.  
  - **Node 3 (Ada)**: Pass → node 4 → (16,22) → Ada gets 16; Take (14,6) → Ada gets 14; Open (9,10) → Ada gets 9. Ada prefers 16 (Pass) > 14 > 9. Thus, Ada Passes.  
  - **Node 2 (Bob)**: Pass → node 3 → Ada Passes → node 4 → Bob Takes → Bob gets 22; Take (3,8) → Bob gets 8; Open (10,9) → Bob gets 9. Bob prefers 22 (Pass) > 9 > 8. Thus, Bob Passes.  
  - **Node 1 (Ada)**: Pass → node 2 → Bob Passes → node 3 → Ada Passes → node 4 → Bob Takes → Ada gets 16; Take (4,1) → 4; Open (9,10) → 9. Ada prefers 16 (Pass) > 9 > 4. Thus, Ada Passes.  

  **Actions at nodes 2 and 1**: Bob Passes at node 2; Ada Passes at node 1.  
  **Reachability in (a)**: In part (a), nodes 1 and 2 **are reached** (path ends at node 2).  

  **(c)**  
  The dependence in (b) reveals the paradox’s core: **Backward induction justifies early actions by counterfactuals about unreached nodes**, yet these nodes are avoided in equilibrium. In (a), Ada’s choice to Pass at node 1 relies on Bob’s node-2 action, which depends on Ada’s node-3 action (Take), which itself hinges on Bob’s node-4 payoff (11)—a node unreached in (a). This creates tension: players base decisions on hypotheticals their own strategy renders impossible.  

  The "evidence of irrationality" reply fails because it **does not apply at node 1**. This reply claims arriving at node 3 would signal Bob’s irrationality (since rational Bob would have Opened at node 2), allowing Ada to profit by Passing. But at node 1, no history exists to update beliefs; Ada must assume rationality holds at *all* nodes for the induction to start. If late-node evidence voids rationality assumptions, backward induction cannot initiate at node 1—it collapses.  

  Requiring optimal actions at unreached nodes is **an additional assumption**, not inherent to rationality. Rationality means choosing optimally *at reached nodes* given beliefs. Backward induction’s requirement—that strategies specify optimal actions *everywhere*—is a stronger condition (sequential rationality). It ensures consistency in counterfactuals but is not entailed by rationality alone.  

  If we drop this requirement:  
  - Backward induction **fails**, as early nodes cannot be evaluated without defined counterfactuals.  
  - Players might still act rationally *on-path*, but without off-path commitments, cooperation could emerge (e.g., Ada might Pass at node 1 hoping Bob reciprocates). However, this invites circularity: beliefs about off-path behavior become ungrounded without the induction’s structure.  

  The paradox thus lies in two irreconcilable features:  
  1. The predicted outcome (e.g., (10,9) in (a)) is **Pareto-dominated** by an available outcome ((12,12) via mutual passing).  
  2. The argument **relies on nodes it deems unreachable**, exposing a fragility in defining "rational" as optimizing against counterfactuals that never materialize.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points** (errors in parentheses):  
  **(a) [7 marks]**  
  1. **(2 marks)** Correct node 3–4 actions: Ada Takes at 3, Bob Takes at 4.  
     *(Error: Wrong payoff comparison at node 4, e.g., Bob Passes for 12 > 9 but misses Take=22.)*  
  2. **(2 marks)** Correct node 2 action: Bob Opens (Open=9 > Take=8 > Pass=6).  
     *(Error: Bob Takes, ignoring Open; or misreads side door, e.g., thinks Bob gets 10 when opening.)*  
  3. **(2 marks)** Correct node 1 action: Ada Passes (Pass→10 > Open=9 > Take=4).  
     *(Error: Ada Takes or Opens, missing that Pass yields 10 via Bob’s Open.)*  
  4. **(1 mark)** Correct path (node1→node2) and payoffs (10,9).  
     *(Error: Wrong payoffs, e.g., (9,10) if side door payoffs swapped.)*  

  **(b) [6 marks]**  
  5. **(3 marks)** Correct modified actions: Ada Passes at 3, Bob Passes at 2, Ada Passes at 1.  
     *(Error: Fails to update node-3 action (e.g., Ada still Takes, ignoring new Pass=16 > 14).)*  
  6. **(2 marks)** Correct re-induction for nodes 2 and 1: Bob Passes (Pass→22 > Open=9 > Take=8), Ada Passes (Pass→16 > Open=9 > Take=4).  
     *(Error: Stops at node 2 or miscalculates Pass payoff for Bob (22).)*  
  7. **(1 mark)** Notes nodes 1 and 2 are reached in (a).  
     *(Error: Claims nodes 1/2 unreached in (a) due to early exit.)*  

  **(c) [7 marks]**  
  8. **(2 marks)** Identifies paradox: Dependence on unreached nodes (e.g., node-4 payoff affects node-1) creates counterfactual fragility.  
     *(Error: Only notes outcome change, not counterfactual dependence.)*  
  9. **(2 marks)** Explains evidential reply’s failure: At node 1, no evidence exists; reply only applies post-hoc.  
     *(Error: Asserts reply resolves paradox or misapplies it to node 1.)*  
  10. **(2 marks)** Distinguishes rationality (on-path optimality) from additional assumption (off-path optimality).  
      *(Error: Claims off-path optimality is inherent to rationality.)*  
  11. **(1 mark)** States induction collapses without off-path assumption (counterfactuals undefined).  
      *(Error: Suggests induction works identically or cooperation emerges trivially.)*  

  **Grading Standard**:  
  - **A (18–20)**: Hits all 11 points; in (c), explicitly separates rationality from off-path assumption and explains induction’s collapse without it.  
  - **B (15–17)**: Correct computations in (a)–(b); in (c), restates standard dialectic but does not rigorously distinguish off-path requirement or collapse of induction.  
  - **C (12–14)**: Minor errors in computation; (c) superficial (e.g., "paradox remains" without analysis).  
  - **D/E (<12)**: Major errors (e.g., wrong path in (a)); (c) misses key points.  

  *Word limit: Strictly enforce 900 words; deduct 2 marks if exceeded.*
