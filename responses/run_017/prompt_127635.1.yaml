     Scenario: Auction House

     An auction house sells paintings. They have a expert, Alice, who classifies paintings as "genuine" or "fake". She uses a combination of factors, but one is the type of paint used: either Oil or Acrylic. They've had 1000 paintings: 500 from the 19th century (all Oil) and 500 from the 21st century (all Acrylic). Alice has a rule: if the painting is from the 19th century and has Oil, then genuine; if from the 21st century and has Acrylic, then genuine. But wait, that's two rules. She might have a unified rule: it's genuine if it's consistent with the period (Oil in 19th, Acrylic in 21st). But then for a new painting that is from the 21st century but uses Oil, how would she classify? We don't know.

     Instead, let's say the auction house has been using the following rule for the past 1000 paintings: they are all classified as genuine. And they were all genuine. 

     Now, they have a new painting that is from the 21st century and uses Oil. 

     Hypothesis 1 (H1): All paintings are genuine.

     Hypothesis 2 (H2): A painting is genuine if and only if:
           (it is from the 19th century and uses Oil) OR
           (it is from the 21st century and uses Acrylic)

     But for the evidence, all 1000 paintings were genuine. For the 19th century ones, they used Oil -> genuine by H2. For the 21st century ones, they used Acrylic -> genuine by H2. So both fit.

     New painting: 21st century, Oil.

           H1: genuine.
           H2: not genuine (because it's 21st century and not Acrylic).

     The test: have Alice inspect it with more care (or use carbon dating, etc.) to determine if it's genuine.

     Now, the auction house has been using the rule "accept as genuine" for all, so they haven't been using H2. But Alice might have been using H2 in her mind, and she has been right for the 1000 paintings. So both are in use? The auction house's rule is H1, but Alice's rule is H2. And the evidence supports both. The auction house is about to sell the new painting as genuine (using H1), but Alice says it's fake (using H2). Money is at stake: if they sell a fake, they might have to refund and lose reputation.

     In this case, the gerrymandered predicate (H2) is used by Alice, who is an expert at the auction house. It is load-bearing because they rely on her expertise.

     This scenario uses time (19th vs 21st century) but we can change to geography.

     Revised auction house scenario without time:

     The auction house gets paintings from two regions: Region A and Region B. Region A paintings are always on canvas, Region B on board. They have had 1000 paintings: 500 from A (canvas) and 500 from B (board). All were genuine.

     Alice's rule: 
          genuine if (from Region A and on canvas) or (from Region B and on board).

     This is the rule she uses. It has worked for all 1000.

     New painting: from Region B, but on canvas.

          H1 (auction house): all paintings are genuine -> genuine.
          H2 (Alice): not genuine.

     The test: inspect the painting to see if it's genuine.

     This meets the requirements:

          - Non-temporal: split by region and material.
          - Gerrymandered predicate (H2) is used by Alice and is load-bearing (they use it to classify).
          - Stakes: money and reputation.

     So we'll use this.

     Final Scenario: Auction House

     Evidence: 1000 paintings, 500 from Region A (all on canvas) and 500 from Region B (all on board). All were genuine.

     Hypotheses:

          H1: Every painting is genuine.

          H2: A painting is genuine if and only if:
               (it is from Region A and on canvas) OR
               (it is from Region B and on board)

     Both fit the evidence.

     New instance: a painting from Region B, on canvas.

          H1: genuine.
          H2: not genuine.

     Test: expert examination to determine if genuine.

  3. Entrenchment reply: 
     - The auction house has been using H1 implicitly (accepting everything) and it has worked. 
     - Alice has been using H2 and it has worked.

     Both predicates have been used and have a history of successful projections. So entrenchment doesn't clearly favor one over the other. In Goodman's terms, entrenchment is about the actual use in projections. Both have been used and both have been successful. However, note that H1 is simpler and more unified, while H2 is disjunctive.

     But Goodman's entrenchment is about the predicate's history of being projected, not the underlying definition. The predicate "genuine" in H1 has been projected to all paintings. The predicate in H2 is "genuine" defined in a specific way. Both have been projected and have the same track record.

     So entrenchment alone doesn't resolve it.

  4. Simplicity or shortest-description approach:
     - H1: "all paintings are genuine" is very simple.
     - H2: requires a disjunction and mention of regions and materials. It is more complex.

     So simplicity favors H1.

  5. Natural kinds metaphysically primitive: 
     - The property of being a genuine painting is a natural kind? Not really. But one might argue that the causal factors that make a painting genuine are not captured by the disjunctive predicate. The genuine paintings from Region A and Region B may have nothing in common except being genuine. The disjunctive predicate is not a natural kind because it groups together two different situations. The natural kind "genuine painting" might be thought to be a unified category. But it's not clear. In this case, a metaphysician might say that the disjunctive predicate does not correspond to a natural kind, while being genuine might. So they would favor H1.

  6. Which handles the case best/worst:
     - Entrenchment: both have equal entrenchment, so it doesn't decide.
     - Simplicity: strongly favors H1.
     - Natural kinds: likely to favor H1.

     So in this case, the simplicity approach and natural kinds approach both favor H1. Entrenchment is tied.

     But the point of the exercise is to make the comfortable reactions unavailable. In this scenario, entrenchment doesn't give a clear answer because both predicates have been used successfully. So the entrenchment reply is not available to break the tie. Simplicity and natural kinds point to H1, but are they compelling? The auction house might argue that Alice's rule has been reliable and they should trust it.

  7. The single feature doing the work: 
     The key is that the evidence is perfectly correlated along two dimensions (region and material) and the new instance breaks that correlation. Without the partition (region and material), the case collapses. If we delete one of the dimensions, then we wouldn't have the two groups.

  8. Attack by someone who thinks there's no fact of the matter: 
     They might say that the disagreement is not about the world but about the definition of "genuine". But the auction house has a clear test: they will examine the painting and see if it's a forgery or not. There is a fact about its authenticity. So it's not merely verbal.

  9. Is this just Goodman's emeralds with the serial numbers filed off? 
     In Goodman's case, the partition is time (observed before 2050 or not). Here, the partition is space (region) and material. The logical structure is the same: a disjunctive predicate that fits the evidence and projects differently for a new case. The philosophical issue is the same: how to choose between hypotheses that are empirically equivalent up to now. Removing time doesn't change the core problem. It just shows that the problem is not specifically about induction over time, but about induction in general.

     Therefore, it doesn't change anything philosophically.

  Conclusion: The auction house scenario meets the specifications. It is a non-temporal grue-style case.
