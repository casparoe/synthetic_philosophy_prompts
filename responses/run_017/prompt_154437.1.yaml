prompt: |-
  I have recently joined the acquisitions committee of a museum of modern and contemporary art, and next week we vote on a proposal that I describe below. Before I decide how to vote, I want to know what our own record commits us to. For roughly thirty years our senior curator has set the committee's practice, and the minutes record her votes, each with a line of reasoning, on the following ten matters. In each case the question was whether the object was a work of art; she has always insisted that this is a separate question both from whether it is good and from whether we should buy it.

  1. A factory-made urinal, bought from a plumbing supplier, turned through ninety degrees, signed with a pseudonym and submitted to an open-submission exhibition; the jury refused to hang it. — Art. (We later acquired a reconstruction of it.)
  2. Plywood boxes, silkscreened to look like a supermarket soap-pad carton and shown in a commercial gallery. — Art. The actual cartons on the supermarket shelf. — Not art.
  3. A processional banner made in the fifteenth century by an anonymous workshop at the commission of a religious confraternity, by makers who were never called artists and never called what they made art. — Art.
  4. An eighteenth-century ship's figurehead, carved to the shipwright's specification, and beautiful. — Not art. Her note: "decoration in the service of a ship."
  5. An oil painting made by a zoo chimpanzee in an enrichment programme, sold at a charity auction and hung in a law firm's lobby. — Not art.
  6. A painting made in the 1960s to be passed off as a seventeenth-century original, since exposed. — Art as to status; but she voted against acquiring it, on grounds of institutional integrity, and recorded that the two questions are independent.
  7. A commercially published video game with a named creative director. — Art. Her note: "a work of art that is also a product."
  8. A screenprinted placard made by an activist collective and carried in a march. — Not art. Her note: "its point was to move people to act, not to be regarded."
  9. A drawing produced by a plotter running code the artist wrote herself, in an edition of one, which she never saw until it was hanging; the code was written with artistic aims and the particular output was unforeseen. — Art.
  10. An unedited field recording of a bird's song, issued on a nature label in the 1970s. — Not art. The same recording, reissued in 2019 on a sound-art label in a small edition with an essay by a composer known for that kind of work. — Art. Her note: "the reissue made it a candidate for a kind of regard the recording could not have had."

  The proposal now before us is this. Our own digitised catalogue, some forty thousand works, was licensed to a university laboratory and used as training data for a generative image model. The laboratory produced two hundred thousand images and scored each one for dissimilarity to the training set. Our director took the thirty highest-scoring images without looking at them, had them printed at the scale of the paintings in our collection, framed, and hung in the main galleries for three months under the title *Samples*, with wall text stating that they are not works of art but specimens of what the model does with our collection. Nobody chose the forms. Nobody had any aesthetic or artistic aim regarding these thirty images in particular; the engineers had no aims about them either; the artists whose works were in the training data stand in no relation to them beyond that. The director's stated purpose is documentary and critical: to show visitors what our collection looks like when it is computationally reprocessed, and the wall text and press release both deny that the prints are art. By construction the images are as unlike anything in the collection as the scoring could make them, and visitors have in fact spent as long in front of them as in front of the paintings. A donor has now offered us a sum on condition that we accession one print into the art collection. The director supports accepting, as a document of the episode rather than as a work of art. The vote is on whether we accept, which requires us to say whether the print is art.

  What I want from you:

  1. The rules that fit the whole record. Set out the two or three principles about art-status that are jointly consistent with all ten votes, stated sharply enough to be applied to a new case. Where a rule needs an auxiliary assumption to swallow a particular verdict, say which verdict and what the auxiliary is. I do not want a survey of positions in the literature or any names attached to them; I want the rules themselves.
  2. What each rule predicts about this proposal. If a rule divides into a strict and a loose version that disagree here, say so. I suspect the crux is whether a status can be conferred by someone who is expressly refusing to confer it, and whether an algorithmic selection counts as the right kind of selection.
  3. Your best guess at her vote, the reasons for preferring it over the alternatives, and an explicit statement of which single feature of the proposal the guess turns on. I would also like two sub-questions answered: whether the requirement that art be an artifact is even met, given that the sheet of paper is made while the image is not anyone's making; and whether a causal chain that runs through a training set rather than through a practice of making and responding to works is the right sort of historical connection for a rule that needs one.
  4. The closest precedent, and how the proposal differs from it in the respect that matters. My own sense is that item 9 and item 10 pull in opposite directions and I cannot tell which is nearer.
  5. If the record genuinely underdetermines the vote, what principle we would be adopting with each choice, put plainly enough that the committee can see what it is voting for.
  6. One further case, constructed but cheap enough that we could actually stage or at least argue it, that would separate the surviving rules, together with what each possible verdict on it would show.

  Close with a single paragraph of advice to the committee. Please do not settle this by observing that art is an essentially contested or family-resemblance term and leaving it there; I know that much, and I still have to cast a vote.
reasoning: |-
  Hmm, the user is on an acquisitions committee for a modern art museum and needs help interpreting their senior curator's voting record on what constitutes art. They're facing a vote on whether to accept a generative AI print as part of their art collection, and want to understand how the curator's principles apply here.

  Looking at the ten precedents, I need to extract consistent principles. The curator clearly distinguishes between art-status and quality/acquisition decisions. Several patterns emerge: intentionality matters (the urinal was intentionally submitted as art, while the chimpanzee painting wasn't), contextual framing is crucial (the same bird recording becomes art when recontextualized), and human agency is required (the ship figurehead was "decoration," not art). 

  For the current proposal, the AI-generated image poses challenges. It wasn't created with artistic intent - the engineers had no aesthetic aims. The museum director explicitly denies it's art, framing it as documentary evidence. But interestingly, visitors engage with it as they do with art. The human involvement is indirect - through training data selection and algorithmic design, not direct creation.

  The closest precedents seem to be #9 (algorithmic art) and #10 (bird recording recontextualized). In #9, the artist's intent made it art despite mechanical production. In #10, institutional framing conferred art-status. Here we have institutional framing but with explicit denial of art-status - that's the crux.

  My best guess is the curator would vote "not art." The lack of any human artistic intent regarding these specific images seems decisive. The paper is an artifact, but the image isn't "made" in the required sense. The connection through training data feels different from an artistic tradition.

  If the committee votes to accept it as art, they'd be establishing that institutional presentation can override creator intent (or lack thereof). If they reject, they're upholding intentionality as necessary. To test these principles, they could consider displaying a fire extinguisher as art - if they accept that, it confirms institutional power; if not, intentionality remains key.

  Ultimately, the advice is: vote against accessioning as art, but perhaps acquire it archivally. The core principle appears to be that art requires human creative intent at its origin, which is absent here despite the interesting implications.
answer: |-
  Based on the senior curator's consistent voting record, here are the principles, application to the proposal, predicted vote, and supporting analysis:

  ### 1. Rules Consistent with All Ten Verdicts
  *   **Rule 1 (Intentional Framing):** An artifact qualifies as art **only if it is intentionally framed for artistic regard** by a relevant agent (creator, commissioner, exhibitor, or institutional re-contextualizer). This framing must signal that the object merits contemplation *as art*, distinct from its functional, documentary, or purely instrumental purpose.
      *   *Auxiliary Assumption (for #3 & #4):* Historical context matters. If an object was created within a tradition *now recognized* as artistic (e.g., medieval workshops, fine sculpture/carving traditions), its original functional purpose doesn't preclude current art-status if presented for artistic regard. If created within a purely functional/decorative tradition *not* later absorbed into art history (e.g., ship figureheads), it lacks the requisite framing context unless recontextualized.
  *   **Rule 2 (Human Creative Agency Origin):** The artifact must originate from a process involving **human creative agency aimed at form, expression, or conceptual exploration**, even if mediated by tools, chance, or delegated execution.
      *   *Auxiliary Assumption (for #9 & #10):* Agency can reside in designing the *system* (code, reissue concept) that generates or re-presents the specific artifact, even if the specific output is unforeseen. The artifact must be an *instance* of that system's intended artistic output.
  *   **Rule 3 (Distinction from Function):** An artifact made and presented **primarily for a non-artistic, instrumental function** (religious procession, political action, commercial product, animal enrichment, documentary record) is not art *in that context*, even if aesthetically potent. Recontextualization can alter this status (Rule 1).

  ### 2. Application to the Proposal (AI Print)
  *   **Rule 1 (Intentional Framing):** **Not Art.** The *only* framing agent (the Museum/Director) expressly denies art-status, framing it solely as a "specimen" and "document." The donor's offer conditions accession *as art*, but they are not the framer; the museum's acceptance would constitute framing, but its *stated reason* for acceptance is explicitly *non-artistic* ("a document"). This creates a contradiction: accessioning into the *art* collection inherently frames it as art, yet the stated purpose denies this. The curator likely prioritizes the *expressed intent* of the primary framer (the Museum) over the inherent implication of accessioning. **Crux:** Can art-status be conferred *against* the express framing intent of the institution presenting it? Precedents (#2 soap pad carton shelf vs. gallery, #8 placard, #10 bird recording 1970s vs. 2019) suggest the curator answers *no* – the framer's intent is paramount. *Loose Version:* If the museum accessions it *as art*, that act *is* framing, regardless of stated reasons. *Strict Version (consistent with record):* Framing requires *affirmative* intent for artistic regard; accessioning while explicitly denying art-status is incoherent and fails to frame it as art.
  *   **Rule 2 (Human Creative Agency Origin):** **Not Art.** The *specific image* is the artifact. No human had *any* creative agency, intent, or aim regarding *this specific image's form or content*. The engineers aimed at dissimilarity scoring, not artistic creation. The training data provides a statistical foundation, not intentional artistic input for *this* output. The artists in the training data had no relation to this image beyond statistical influence; they provided no input *for it*. Agency exists only at the levels of building the model (lab) and curating the *display concept* (director), not for the specific image itself. **Crux:** Is the origin "human creative agency aimed at form/expression"? Here, the agency was aimed at *model building and dissimilarity selection*, not *image creation for regard*. Precedent #9 (code) has agency in the system designed *for* artistic output. Precedent #10 has agency in the *re-framing* of a specific artifact. This lacks both.
  *   **Rule 3 (Distinction from Function):** **Not Art.** The print was generated and presented *solely* for the documentary function of showing computational reprocessing. Its "point was to [demonstrate], not to be regarded" (cf. #8). The donor's offer doesn't change the origin or initial framing.

  ### 3. Best Guess at Her Vote & Key Feature
  *   **Vote:** **Not Art.**
  *   **Reasoning:** The **complete absence of human creative agency directed at the specific image's form or content** (Rule 2) is the most fundamental failing. This is compounded by the **explicit denial of art-status by the framing institution** during its creation and presentation (Rule 1). The artifact exists solely as a functional byproduct of a technical/documentary process (Rule 3).
  *   **Crucial Feature:** The **lack of any human intentionality regarding the specific aesthetic form or conceptual nature of *this* particular image** at any point in its origin or primary presentation.
  *   **Sub-Questions:**
      *   **Artifact Status:** The *physical print* is an artifact (paper, ink). The *image* is a pattern generated algorithmically without specific human design. The curator's focus (see #1 urinal, #9 plotter drawing) is on the *presented object* (the printed/fabricated artifact), not the underlying concept alone. The artifact exists, but fails Rule 2 regarding its image content's origin.
      *   **Causal Chain:** The training set provides a historical *influence*, not the right kind of causal chain of *artistic practice and response*. The chain here is technological/statistical, not artistic. The artists' works were inputs to a data process, not inspirations for a new work within a shared artistic discourse. It lacks the intentional "conversation" with art history implied in precedents (#1, #10 reissue, arguably #2 gallery boxes).

  ### 4. Closest Precedent & Difference
  *   **Closest Precedent:** **Item #10 (Bird Recording).** Both involve the same physical object (sound/image) gaining or lacking art-status based on framing context.
  *   **Key Difference:** In #10, the *reissue* involved **active human curatorial intent to frame the *specific recording* for artistic regard** (label, essay, editioning). In the AI proposal, the **framing agent (museum) *expressly refuses* to frame the *specific print* for artistic regard,** presenting it only as a specimen/document. Item #9 shows agency in the *system* design for artistic output; here, the model was designed for replication/variation, not artistic creation *of these specific outputs*, and the selection was for dissimilarity, not artistic merit or intent. Item #10 shows re-framing works; this proposal shows *anti-framing*.

  ### 5. Principles Adopted by Each Vote
  *   **Vote YES (Accept as Art):** The committee adopts the principle that **institutional accession into the art collection, regardless of stated intent or origin, constitutes sufficient framing to confer art-status.** It also potentially adopts that **art-status can arise solely from reception (visitor engagement) or from a sufficiently complex technological process involving art data, even absent specific creative intent for the output.**
  *   **Vote NO (Reject as Art):** The committee affirms the principles that **art-status requires either (a) human creative agency directed at the specific artifact's form/content *or* (b) affirmative intentional framing for artistic regard by a relevant agent,** and that **accessioning an object while explicitly denying its art-status is incoherent and cannot confer that status.**

  ### 6. Separating Case
  *   **Case:** A museum conservation department accidentally spills solvent on a blank canvas prepared for restoration, creating a unique, aesthetically striking stain pattern. A conservator, recognizing the pattern, mounts it simply as "Conservation Incident #5" in a staff hallway with a factual label. Visitors notice and engage deeply. A donor offers to buy it for the art collection.
  *   **What Verdicts Show:**
      *   **Verdict: Art:** Supports the *Looser Rule 1 / Reception* view (visitor regard + institutional potential). Aligns with a potential YES vote on the AI print.
      *   **Verdict: Not Art:** Supports the *Strict Rules 1 & 2* view. No initial creative agency aimed at the stain. Framing is purely documentary ("Incident"), not for artistic regard. Aligns with the predicted NO vote on the AI print.

  ### Advice to the Committee

  **Vote against accessoning the print *as art_. The record demonstrates the curator requires either human creative agency directed at the specific form/content *or* affirmative framing for artistic regard. This proposal fails both: the image lacks any human intentionality in its generation, and the museum expressly framed it as a non-artistic document. Accessioning it as art while denying it is art creates an untenable contradiction regarding its status. Acquire it archivally if valuable documentation, but do not classify it as art. This upholds the clear distinction between art, documentation, and functional objects central to the curator's consistent logic.**
