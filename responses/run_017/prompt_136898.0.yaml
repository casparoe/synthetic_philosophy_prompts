prompt: |-
  So I'm a novelist — four books out, slogging through a fifth — and I've realised I have really firm gut feelings about when "good enough" is genuinely good enough and when stopping early is just laziness in a nicer coat. What I don't have is the rule. And I think two of my feelings flatly contradict each other, which is why I'm asking.

  Here's my list, roughly in the order I thought of it.

  - Stopping work on a chapter after eight passes, when a ninth would probly make it three percent better: fine. Zero guilt.
  - Signing with the first agent who offers, without waiting on the two bigger agencies that still have the full: fine.
  - Abandoning a draft at 30k words because the voice never showed up: fine, obviously.
  - Abandoning a draft at 30k words because a *better idea* showed up: not fine. I think this is a character flaw. But I can't say why — same 30k words in the bin, same better book on the other side.
  - Stopping my research on 1970s Belfast the moment I can write a convincing scene, and inventing the rest: fine.
  - Not reading the one source that would tell me whether my plot's central mechanism is even possible: not fine. This one I'd be ashamed of.
  - Picking a title by taking the first one that doesn't make me wince, instead of generating forty and testing them: fine.
  - Sending the manuscript to my editor knowing two scenes still don't work: not fine. Even though I'd defend the eight-passes thing above.
  - A week spent choosing a typeface for the paperback: fine, no regrets. A week spent comparing health insurance plans: I felt like an idiot afterwards. They came out the same.

  My own half-baked rule: it's fine to stop looking when you couldn't tell the difference between what you've got and what more searching would turn up; it's not fine to stop when a better option is already visible and cheap to take. I think that covers the archive one and the manuscript one. I don't think it covers the two 30k drafts, which look identical under it, and I'm not sure it covers the insurance — I couldn't tell those plans apart either, and the week was still wasted.

  There's one more thing I've noticed and named, badly: what I call a sinking bar. The level drops, but not because I learned anything — because it's hour nine and I'm tired. I've always treated that as the moment to quit and I've never quite trusted it. Maybe it's irrational, or maybe fatigue is genuine information: it tells you your discrimination has degraded, so there's nothing left to choose between.

  So: what's the principle? Is this satisficing with an aspiration level, and if so what sets the level and when should it move? Is my couldn't-tell-the-difference clause the same thought as the take-the-best stuff, or a different one? Does the principle come from the economics side — search costs, optimal stopping, take the first one past some threshold — or from the cognitive side, where the mind is limited and the environment does half the work? Because those feel like they'd disagree about the sinking bar.

  Give me the principle clause by clause, with the case that forces each clause. Then tell me what it says about the decision I'm actually in right now: take the two-book deal on the thing I've already written, or spend three years on the harder novel I think I might be able to write. And tell me honestly which of my verdicts the principle can't swallow, and why it's right and I'm wrong.
reasoning: |-
  Okay, let's start by unpacking the novelist's query. They're struggling with when "good enough" is acceptable versus when stopping is laziness. Their examples show contradictions, especially the two 30k word draft scenarios. The core issue is defining a principle that differentiates between justified stopping and premature quitting.

  First, I need to analyze their listed scenarios. The abandonment of drafts at 30k words is key. They feel stopping because the voice isn't there is fine, but stopping for a better idea isn't. Why? Both involve discarding work, but the reasons differ. The voice issue relates to intrinsic project viability, while the better idea might indicate distraction or lack of commitment.

  Their half-baked rule about stopping when you can't tell the difference between current and potential improvements makes sense for some cases, like the eight passes on a chapter. But it doesn't cover the draft abandonment or the insurance vs. typeface time spent. The sinking bar—lowering standards due to fatigue—adds another layer. Is fatigue a valid signal to stop or a trap?

  Looking at decision-making theories: Satisficing vs. optimizing. Satisficing accepts "good enough," but aspiration levels must be set correctly. Search theory suggests stopping when marginal cost exceeds marginal benefit. Cognitive load theory indicates that mental fatigue reduces decision quality, so stopping might be rational.

  For the draft abandonment, the distinction lies in the reason. If the project fundamentally can't meet standards (voice missing), stopping is efficient. If it's a shiny new idea, it might be an avoidance tactic. The principle needs to address the root cause: viability versus impulsivity.

  The health insurance vs. typeface dilemma highlights value alignment. Spending time on typeface, which affects the book's aesthetic, aligns with the novelist's core goals. Health insurance, while important, is peripheral, so excessive time feels wasted. The principle should incorporate personal values and domain relevance.

  The sinking bar: Fatigue degrades judgment, so stopping is wise. However, if the bar drops prematurely, it's problematic. The principle must differentiate between necessary cessation due to diminished capacity versus unjustified lowering of standards.

  Synthesizing a principle:
  1. **Viability:** Stop if the project can't meet minimum standards despite effort (voice missing).
  2. **Marginal Value:** Stop when further effort yields negligible improvement relative to cost (eight passes).
  3. **Value Alignment:** Invest time where it impacts core goals (typeface over insurance).
  4. **Fatigue Management:** Halt when cognitive resources are depleted, but revisit with fresh eyes if crucial.

  For the two-book deal vs. new novel: The deal offers immediate, certain value. The new novel is uncertain and time-consuming. Applying the principle—certainty and current viability favor taking the deal, but if the new novel aligns more with long-term aspirations, it might be worth the risk. The sunk cost of the current manuscript isn't a factor; future potential is.

  Contradictions in their judgments: Abandoning for a better idea is seen as a character flaw, but their principle might allow it if the new idea has significantly higher potential. They might be undervaluing opportunity cost. Similarly, not researching the plot mechanism is a flaw because it risks core viability, while inventing Belfast details is acceptable since it doesn't undermine the story's credibility.

  In conclusion, the principle should balance feasibility, value, cognitive limits, and alignment with goals. Their instinct to stop when viability is compromised is sound, but they might need to reassess opportunity costs and distinguish between distraction and genuine growth opportunities.
answer: |-
  Here's your principle, built clause-by-clause from your contradictions and insights, grounded in decision theory and cognitive science:

  ### The Principle of Cognitively Sustainable Aspiration (Clause-by-Clause)

  1.  **Stop when core viability is *objectively* compromised.** (Forces: Abandoning at 30k because the voice never showed up.) *Why:* If the fundamental engine of the work (voice, core concept, structural integrity) is irreparably broken *despite reasonable effort*, continuing is irrational. This is project-level failure, not laziness. It's resource reallocation.

  2.  **Stop when marginal cognitive cost exceeds marginal subjective value.** (Forces: Stopping after eight passes; Not reading the 40th title; Not spending a week on health insurance.) *Why:* Beyond a point, the effort required to discern or achieve *tiny* improvements consumes mental resources better spent elsewhere. This value is "subjective" because it's weighted by *your* goals and context (e.g., typeface matters for *your* book's feel; identical health plans don't). It acknowledges cognitive limits.

  3.  **Continue when core credibility or structural integrity is *knowingly* compromised.** (Forces: Not reading the source on the central mechanism; Sending MS with two broken scenes.) *Why:* These are not marginal gains; they are foundational risks. A plot mechanism that might be impossible undermines the entire premise. Unfixed broken scenes are landmines for the reader (and editor). This risks catastrophic failure, not a minor imperfection. It violates the "good enough" baseline.

  4.  **Continue when the "better option" is merely *novelty* without proven superiority.** (Forces: Not abandoning at 30k for a "better idea".) *Why:* The allure of the new idea is often excitement/avoidance, not validated superiority. The sunk cost (30k) is identical, but switching *without finishing the current evaluation* (e.g., hitting a viability wall as in Clause 1) is distraction disguised as optimization. Prove the new idea's viability *before* abandoning the current trench work (e.g., sketch the new idea *fully* without ditching the old draft yet).

  5.  **Stop exploration when the environment provides "good enough" for the *current need*.** (Forces: Stopping Belfast research; Signing with the first agent.) *Why:* Once you can *convincingly* simulate the needed output (Belfast scene, agent representation), further search yields diminishing returns relative to the *immediate task*. The threshold ("convincing") is set by the functional requirement of the work, not abstract perfection. The first agent meeting your core needs *is* the satisficing solution emerging early.

  6.  **Respect the Sinking Bar as a cognitive STOP signal, not a decision signal.** (Forces: Recognizing hour-nine fatigue.) *Why:* Fatigue *degrades* your ability to discriminate value (Clause 2) and assess viability (Clause 1). Trusting a lowered aspiration level *caused by fatigue* is dangerous. The principle mandates: **Halt effort** when the bar sinks due to fatigue. **Re-evaluate** the *core viability* (Clause 1) and *marginal value* (Clause 2) **with fresh cognition** before making an irreversible stop/continue decision based on a lowered aspiration. Fatigue tells you your tool is broken; it doesn't tell you the job is done.

  ### The Synthesis (The Full Principle)

  > **Stop when core viability is irreparably broken, or when the marginal cognitive cost of improvement demonstrably exceeds its marginal value to your core goals. Continue when core credibility/structural integrity is knowingly compromised. Avoid abandoning for novelty unless the new path's superior viability is objectively established *before* abandonment. Leverage environmental "good enough" signals to satisfice exploration. Treat cognitive fatigue as a mandate to halt effort and re-evaluate viability/value with restored capacity before deciding.**

  ### Applying the Principle to Your Current Dilemma (2-Book Deal vs. Harder Novel)

  1.  **Core Viability (Clause 1):**
      *   **2-Book Deal:** Proven viability. The book exists, an agent/editor wants it, a publisher is offering. Objectively viable.
      *   **Harder Novel:** Uncertain viability. "I think I might be able to write." High risk of hitting a Clause 1 wall.
      *   *Verdict: Points strongly to Deal.*

  2.  **Marginal Cost vs. Value (Clause 2):**
      *   **Deal:** Low marginal *cognitive* cost to accept/execute (contracts, edits). High, *certain* value: income, career continuity, reader connection, platform building.
      *   **Harder Novel:** Enormous marginal cognitive cost (3 years!). Potentially higher *subjective* value (artistic growth, ambition) but *highly uncertain* (might fail, might not be better).
      *   *Verdict: Points strongly to Deal.* The *certain* high value of the deal outweighs the *uncertain* potentially higher value of the novel, especially given the massive cost difference.

  3.  **Core Credibility/Integrity Compromised? (Clause 3):** Neither option involves knowingly shipping broken work *if you accept the deal and deliver the existing book*. The harder novel isn't "compromised"; it's unstarted.
      *   *Verdict: Neutral/Not Applicable.*

  4.  **Novelty vs. Proven Superiority (Clause 4):** Is the harder novel truly superior, or just novel/exciting? Can you objectively establish its superior viability *before* turning down the deal? (Highly unlikely). Turning down a sure, valuable thing (the deal) for a pure gamble violates this clause.
      *   *Verdict: Points strongly to Deal.*

  5.  **Environmental "Good Enough" (Clause 5):** The deal *is* a "good enough" solution emerging from your prior search (writing, querying, etc.). Grabbing it satisfies.
      *   *Verdict: Points to Deal.*

  6.  **Sinking Bar (Clause 6):** Is fatigue driving the desire for the *novelty* of the harder project over the *work* of finalizing/promoting the existing one? Or is the deal pressure causing fatigue in assessing it? Halt, rest, then re-evaluate Clauses 1-5 with fresh eyes. But the analysis above seems robust.
      *   *Verdict: Re-evaluate if fatigued, but likely confirms Deal.*

  **Principle's Verdict: Take the two-book deal.** It leverages proven viability, offers high certain value for low marginal cost, satisfies your search, and avoids the high-risk novelty trap of the unproven harder novel. Use the security and platform from the deal to *then* tackle the harder novel with more resources and less existential pressure.

  ### Where the Principle Disagrees With You (And Why It's Right)

  1.  **Abandoning at 30k for a "Better Idea" (Your Verdict: Not Fine / Character Flaw):** The principle (Clause 4) agrees *if* you abandon *before* objectively establishing the new idea's superior viability. However, it *disagrees* with the blanket "character flaw" label. If you *can* objectively demonstrate the new idea's superior viability *before* abandoning the 30k draft (e.g., through a detailed outline proving its core viability surpasses the stuck draft), abandoning isn't a flaw; it's rational reallocation (aligning with Clause 1 applied to the *new* project). Your instinct treats *all* mid-draft switches as weakness, but the principle distinguishes between distraction and validated strategic pivots. **Why it's right:** Blanket condemnation ignores the potential for genuinely better opportunities. The flaw isn't switching; it's switching *without due diligence* on the new idea's viability. Your verdict might stem from an aversion to sunk cost or fear of distraction, but the principle forces a more objective evaluation *before* the switch.

  **In essence:** Your principle of "couldn't tell the difference" is a subset of the marginal cost/value clause (Clause 2). The Belfast research and 8-passes examples fit perfectly there. The core insight you were missing is the **absolute requirement of core viability and structural integrity** (Clauses 1 & 3) and the **critical distinction between fatigue-driven collapse and rational satisficing** (Clause 6 vs. Clauses 2 & 5). The principle integrates cognitive limits (fatigue, diminishing discrimination), economic search costs (satisficing), and the non-negotiable foundations of craft (viability, credibility). It turns your gut feelings into a defensible map. Now go write.
