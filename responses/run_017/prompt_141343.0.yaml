prompt: |-
  Please act as a senior formal epistemologist and game theorist who has sat through several hundred job-market talks and has an unusually good memory for the specific ways that talks like mine die in the question period. Do not flatter the argument and do not hedge: I would rather be told now that a result is indefensible than find out in front of a search committee. Before you write anything, take a short brainstorming pass in which you list every fault line you can see in the sketch below, rate each for how likely it is to be raised by the audience I describe, and only then assemble the prep sheet. Then give me the deliverables in a form I can rehearse from: at most eight objections, ordered by expected damage, each attributed to the kind of person who will raise it and phrased the way that person would actually say it (not in my vocabulary), each with a reply I can give in two minutes or less, and each with an explicit note on where that reply is soft or where I am bluffing. Tell me what I should concede in the first three minutes rather than have it extracted from me, tell me which single reply has to land if the paper is to survive at all, and tell me which of my three results is the most exposed and should be cut to a slide and a promise. Finally, give me the question you think I am hoping nobody asks, and if you think the question I am privately dreading is the wrong one to dread, say so.

  The talk is my job-market paper, "Rationality Is Not Free: Costly Nesting, Bounded Reasoning Depth, and the Backward-Induction Outcome," and the argument is roughly this. Take a finite two-player perfect-information game — I use a six-node centipede — and recall the standard epistemic picture: common knowledge of rationality plus common knowledge of the game form pins down the backward-induction profile, so the first mover takes immediately, while in laboratory centipedes people pass for a few nodes and then take. The usual explanations are altruism or social preferences, uncertainty about the opponent's payoffs, or an exogenously imposed bound on reasoning depth from a level-k or cognitive-hierarchy model. My proposal is that the depth of nesting should be endogenous and costly. Define depth inductively: a depth-1 player best-responds to an unmodelled opponent; a depth-k player best-responds to a depth-(k−1) opponent. Now charge δ per level of nesting, either as a payoff cost δ·k subtracted from the outcome or as a probability (1−δ)^k of completing the inference correctly — I argue the two are equivalent up to a rescaling of stakes, which is one of the claims I am least sure about. Each player then chooses a reasoning depth alongside an action plan, and here is what I claim. Result 1, the one I lead with: for every δ greater than zero the symmetric equilibrium depth is finite, so common knowledge of rationality would cost an infinite amount and is therefore not merely unattainable but forbidden by the very rationality it is supposed to idealize — the standard ideal is self-undermining, and the near-certainty literature that relaxes certainty while keeping the infinite hierarchy buys exactly the wrong thing. Result 2: as δ goes to zero the equilibrium depth diverges and play converges to the backward-induction outcome, so my model nests the standard result as a limit and the empirically observed cooperation is explained by the size of δ rather than by kindness or by payoff uncertainty. Result 3: with unequal δ the cheaper reasoner gains only up to a point — beyond a threshold, extra depth is wasted because the opponent has stopped — and because scaling all payoffs by a factor λ raises the optimal depth, the model predicts that cooperation in the centipede should collapse as stakes rise, a prediction I have no evidence for and no way to check before the talk. A friend who works on reasoning in language models pointed out to me that in her systems extra inference steps cost compute and sometimes make the answer worse, which is where the framing came from, and I would like to open with a version of that analogy; tell me whether that opening will cost me the room.

  The audience is a joint economics-and-philosophy department and the room will be about forty people, but the questions will come from four or five quarters. There are two senior microeconomic theorists who work on the epistemic foundations of equilibrium and who think the point of epistemic analysis is to characterize equilibrium concepts rather than to model deliberation; they will think I have changed the subject. There is a formal epistemologist who treats common knowledge as a fixed point and will want to know whether my depth-k hierarchies are even a well-defined object and what happens to my result under public announcement of the game. There are two behavioral and experimental economists who are broadly sympathetic to level-k and cognitive-hierarchy models, think all the philosophy is decoration, and will demand to know what my extra parameter identifies that theirs does not. There is a philosopher of action who will say that one cannot simply choose how hard to think, so the choice variable at the center of the model is incoherent. And there is an econometrician who will ask, in a friendly way that is not friendly, about identification, about whether δ is a primitive or a residual, and about the stakes prediction. Assume twenty minutes of questions and that I will be interrupted; assume also that I have defended this twice already and that the two objections I got last time — that I am smuggling in altruism, and that a cost on reasoning is just a change of game form — are ones I will get again and need better answers to than I had then.
reasoning: |-
  Hmm, the user is asking me to act as a senior formal epistemologist and game theorist to critique their job-market paper on costly reasoning depth in game theory. They want me to identify fault lines in their argument, prepare them for tough questions during their job talk, and provide specific deliverables like key objections and responses.

  Looking at their paper "Rationality Is Not Free: Costly Nesting, Bounded Reasoning Depth, and the Backward-Induction Outcome," they're proposing that reasoning depth in game theory should be endogenized with costs rather than imposed exogenously. Their three main results are: 1) symmetric equilibrium depth is finite for any δ>0, showing common knowledge of rationality is self-undermining; 2) as δ→0, play converges to backward induction; and 3) with unequal δ, extra depth beyond an opponent's depth is wasted, and higher stakes should reduce cooperation.

  The audience includes microeconomic theorists, formal epistemologists, behavioral economists, a philosopher of action, and an econometrician - each with different concerns. I need to identify the most damaging potential objections.

  Key fault lines I see:
  - The equivalence claim between payoff cost and implementation probability models seems mathematically shaky without proof
  - The choice of reasoning depth as a strategic variable may seem psychologically implausible
  - The stakes prediction (Result 3) is untested and may not hold
  - The model might be seen as reinventing level-k with an extra parameter without new empirical content
  - The critique of "near-certainty" literature could be seen as attacking a straw man
  - The opening analogy to language models might alienate traditional theorists

  I need to prioritize the most damaging objections, provide responses with clear weaknesses noted, and advise on strategic concessions during the talk. The micro theorists' objection about changing the subject is particularly dangerous since it challenges the core contribution. The response to this must land perfectly.

  For deliverables, I'll organize eight objections by expected damage, attribute each to specific audience types, phrase them authentically, and provide concise responses with noted weaknesses. I'll also identify what to concede early, which reply is critical to land, which result to minimize, and name the question they're dreading versus what they should actually fear.
answer: |-
  Below is your prep sheet, structured for maximum defensive utility. I've identified 12 distinct fault lines, scored them for likelihood/damage (L: 1-5, D: 1-5), and distilled the 8 most lethal objections. The audience taxonomy follows your description. **Concede early that depth-k is not a cognitive process but a strategic simplification**—otherwise, the philosopher of action and behavioralists will gut you.

  ---

  ### **Critical Concession (First 3 Minutes)**
  > *"Before we begin, let me clarify: the 'choice' of depth-k here is not a psychological claim about how humans *decide* to think harder. It’s a reduced-form way to model the *effective* depth of reasoning in equilibrium, where δ represents the shadow cost of cognitive resources. This sidesteps voluntarism critiques and aligns with how level-k treats bounds as exogenous but makes them endogenous."*  
  **Why**: Preempts the philosopher of action and neutralizes "smuggling altruism" by reframing δ as opportunity cost.

  ---

  ### **The Eight Objections**  
  *(Ordered by Expected Damage = Likelihood × Severity)*  

  1. **Microeconomic Theorist** (L5/D5):  
     *"You’ve changed the subject. Epistemic foundations *characterize* what beliefs justify equilibrium play. Your ‘costly depth’ isn’t about beliefs—it’s about bounded rationality. Why should we see this as foundational rather than a behavioral tweak?"*  
     **Reply**: "Because it shows the standard justification for BI (CKR) requires infinite resources, making it epistemically incoherent. Your foundations assume reasoning is free—mine tests that assumption. This *is* foundational: it forces us to relitigate what ‘rationality’ means."  
     **Soft Spot**: Implies their work is incomplete; may read as dismissive.  
     **Must Land This**—if it fails, the paper is "not game theory" to core audience.  

  2. **Behavioral Economist** (L5/D4):  
     *"You added a parameter δ to level-k. But your model has the same explanatory power as cognitive hierarchy with a cost function. Where’s the testable *novelty*? Show me an experiment your model predicts and level-k doesn’t."*  
     **Reply**: "Two differences: First, δ endogenizes depth—so it *explains* why depth varies across games/stakes, while CH assumes it. Second, my stakes prediction (cooperation ↓ as λ↑) follows *directly* from δ’s interpretation as a cognitive cost. CH has no such microfoundation."  
     **Bluff**: Claiming δ is "microfounded" when it’s just a scalar.  
     **Cut Result 3** to one slide + "ongoing experimental work."  

  3. **Formal Epistemologist** (L4/D4):  
     *"Common knowledge is a fixed point, not a depth-k tower. If we publicly announce the game and rationality, agents *must* have common knowledge. Does your model implode under public announcements?"*  
     **Reply**: "Public announcements assume free logical omniscience. But if *processing* announcements has cost δ, the fixed point is unreachable. CK isn’t just ‘known to be known’—it requires infinitely nested *computation*. My model formalizes that constraint."  
     **Soft Spot**: No formal treatment of announcements in the paper.  

  4. **Econometrician** (L4/D4):  
     *"δ feels like a residual. If I see players choosing depth 2, is that because δ is high, or because payoffs are low? How do I disentangle this from risk aversion or altruism? And without data, isn’t this just curve-fitting?"*  
     **Reply**: "δ is identified via *stakes variation*: if scaling payoffs by λ increases depth, it reveals δ as a cognitive cost (since altruism/risk aversion are scale-invariant). I’m designing experiments now to test this."  
     **Bluff**: No real identification strategy beyond thought experiments.  

  5. **Philosopher of Action** (L3/D5):  
     *"Choosing ‘how hard to think’ is nonsense. Deliberation isn’t a strategic variable—it’s constrained by neurobiology. You’re reifying a metaphor."*  
     **Reply**: "Agreed—which is why δ isn’t chosen *in the moment*. It’s a latent skill level (like reaction speed) evolved over time. Equilibrium depth reflects *long-run* investments in reasoning capacity."  
     **Soft Spot**: This is post-hoc; the model treats δ as per-game.  

  6. **Microeconomic Theorist** (L3/D4):  
     *"Calling CKR ‘self-undermining’ is rhetoric. If I impose a tax on using dominated strategies, the BI outcome changes. That’s just changing the game. You’ve made rationality costly—so it’s not rationality anymore."*  
     **Reply**: "But the tax here is *on the epistemic conditions themselves*, not the strategies. BI requires CKR, and CKR requires infinite δ-cost. If rationality forbids paying infinite costs, then CKR is irrational. That’s the paradox."  
     **Weakness**: Still feels like changing the rules.  

  7. **Behavioral Economist** (L4/D3):  
     *"If δ is a cost, why do language models sometimes get *worse* with more steps? That sounds like your probability interpretation. But you claim equivalence to payoff costs. Prove it."*  
     **Reply**: "Equivalence holds only for *monotonic* tasks—which perfect-inference games are. For language models, non-monotonicity breaks equivalence. But in games, more steps (weakly) improve play. Here, cost modes are isomorphic."  
     **Bluff**: No proof of equivalence in paper.  

  8. **Econometrician** (L2/D5):  
     *"Your ‘costly nesting’ explanation for centipede cooperation is observationally equivalent to altruism. Both predict early passes. Where’s the smoking gun?"*  
     **Reply**: "Altruism predicts passing *regardless of stakes*. My model predicts passing *only when stakes are low* relative to δ. Raise the stakes, and altruism still passes—I don’t."  
     **Soft Spot**: Zero evidence stakes matter in centipedes.  

  ---

  ### **Strategic Cuts & Final Notes**  
  - **Most Exposed Result**: **Result 3 (unequal δ)**. Cut to 1 slide. Say: *"This explores asymmetric costs—suggesting cheaper reasoners gain, but with diminishing returns. Stakes effects are a key future test."*  
  - **Opening Analogy**: Do **NOT** open with language models. Micro theorists will dismiss you as "not doing economics." Open with the centipede paradox instead.  
  - **The Question You Hope Nobody Asks**:  
    *"If depth is chosen rationally, what’s the meta-cognition cost of choosing k? Doesn’t this regress infinitely?"*  
  - **The Question You *Should* Dread** (not the one you’re fearing):  
    *"Your entire model assumes players know their own depth k. But if depth is costly, shouldn’t they be uncertain about their *own* rationality? How does self-doubt change Result 1?"*  
    **Why it’s lethal**: It attacks the coherence of "choosing k" and suggests your equilibrium is fragile. Have no answer? Say: *"Self-uncertainty is beyond scope, but a crucial extension—thank you."*  

  ---  
  **Rehearsal Drill**: Practice Replies 1 and 2 until they’re automatic. If the micro theorist nods, you live. If the behavioralist scoffs, shrug—they’re not your primary audience. Sacrifice Result 3 if pressured. Good luck.
