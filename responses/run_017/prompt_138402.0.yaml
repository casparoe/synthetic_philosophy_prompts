  Okay, let me start by unpacking this user's query. They had a heated argument with a friend about a coin game and now they're seeing the same concept everywhere. They need clarity on whether this phenomenon has a name, but more importantly, they want to understand the underlying principles and how they connect to real-world scenarios.

  First, the game involves betting with a biased coin (60% heads) where you can choose what fraction of your bankroll to wager each round. Winning doubles the stake, losing loses it. The friend argues for going all-in every time because the expected value is maximized. But the user's simulation shows that while the average is huge, almost all players go broke except one lucky one. When staking a fixed fraction (like one-fifth), the typical outcome is much better. 

  The user has three main questions. I need to address each thoroughly. 

  For question 1, the key insight is that maximizing expected value versus maximizing typical long-term growth are fundamentally different goals. The all-in strategy has a high EV but also a high risk of ruin. The 20% fraction corresponds to the Kelly criterion, which maximizes the geometric mean growth rate. The 20% comes from the edge (60% win chance) and payout (double on win). Specifically, edge = (0.6 * 2) - 1 = 0.2, so fraction = edge / (gain per unit) = 0.2 / 1 = 20%. This isn't just about feelings; it's mathematical optimization.

  For question 2, the flat bet version changes the dynamics entirely. Since each bet is independent of bankroll size, there's no compounding effect. The expected value per bet is constant, so betting max each time makes sense. This isn't a bug; it shows that fractional betting's advantage relies on multiplicative growth.

  Question 3 touches on risk aversion versus rationality. The simulation shows that even without emotions, the fractional strategy yields better typical outcomes. This relates to the gambler's ruin concept but is more about optimizing growth under uncertainty. Casinos have negative expected value, leading to inevitable ruin, but here the game has positive EV—Kelly still prevents ruin while capturing upside.

  The user also asks about real-world applications, like applying to multiple programs versus one. This is analogous: diversification reduces variance but also potential upside. For one-off decisions, maximizing EV makes sense since there's no future to compound. The key distinction is between single decisions and repeated opportunities.

  I should emphasize that the Kelly criterion provides the optimal fraction for long-term growth by balancing growth and risk. It stops being applicable when bets aren't independent, when payoffs change, or in very short time horizons. Also, misestimating probabilities can lead to overbetting and higher risk.

  The user's deeper needs seem to be understanding why intuition (go all-in) fails here, how math provides a better strategy, and how this applies beyond gambling. They might be seeking reassurance that their simulation findings are valid and applicable to decision-making in uncertain, repeated scenarios.
answer: |-
  You've stumbled onto **the Kelly criterion** – but that's *just the name*. What you're really asking about is the profound tension between **maximizing expected value (EV)** and **maximizing long-term growth rate (or median outcome)**, especially in multiplicative (compounding) processes. Let's dissect this piece by piece, addressing your specific questions and the deeper concepts.

  **The Core Mechanics & Why Your Friend is Both Right and Wrong**

  1.  **The EV Argument (Your Friend):** Your friend is mathematically correct about the *average* outcome. With a 60% win chance and a 2x payout on win, the expected return *per unit bet* is:
      `EV per unit bet = (0.6 * $1) + (0.4 * -$1) = $0.60 - $0.40 = $0.20`
      That's a **20% expected return per bet**. If you bet your entire bankroll `B` every time:
      *   Win: `B_new = B + B = 2B`
      *   Lose: `B_new = 0`
      *   **Expected Bankroll after 1 bet:** `(0.6 * 2B) + (0.4 * 0) = 1.2B`
      After `n` bets, the *expected value* is `$100 * (1.2)^n`. For n=100, that's astronomical (`$100 * 1.2^100 ≈ $82.817 million`). This is why the average in your sim is "crazy".

  2.  **The Reality (Your Simulation):** Why does almost everyone go broke? **Variance and Ruin.** Betting everything amplifies outcomes:
      *   **Win Streak:** Exponential growth (`$100 -> $200 -> $400 -> ...`).
      *   **Lose Streak:** You hit zero very quickly. One loss ends the game.
      *   **Probability of Ruin:** The probability of *never* going broke only exists if you never lose a single bet. The probability of getting at least one tail in `n` flips is `1 - (0.6)^n`. For n=100, this is effectively 1. Almost everyone *will* hit a tail and go broke.
      *   **The "Freak Person":** In your sim of 1000 people, a tiny number (statistically, roughly `1000 * (0.6)^100` - an infinitesimally small number, but your sim might get 0 or 1 due to finite runs) will win *every single flip*. That one person ends up with `$100 * 2^100 ≈ $1.267 * 10^32` dollars - vastly more money than exists. This single insane outlier drags the *average (mean)* up to the astronomical EV figure ($82.8 million), while the *typical (median)* outcome is $0. **The mean is mathematically correct but practically meaningless for anyone actually playing the game.**

  **Answering Your Questions**

  1.  **"Best Fraction" vs. "Average is a Lie": Same Thing & Why 1/5?**
      *   **Same Core Phenomenon:** They are two sides of the same coin (pun intended). The "average is a lie" (driven by extreme outliers) is the *symptom* of using a strategy (betting everything) that maximizes the *mean* but ignores *variance* and the *multiplicative nature* of growth. The "best fraction" strategy directly addresses this by *maximizing the long-term growth rate* of your bankroll, which inherently considers both return and risk.
      *   **Why ~1/5? The Kelly Criterion:** The optimal fraction `f*` to maximize long-term growth is given by the **Kelly formula**:
          `f* = (bp - q) / b`
          Where:
          *   `b` = net odds received on the bet (profit per unit staked if you win). Here, if you stake `$S`, you win `$S` profit (get `$2S` back = stake `$S` + profit `$S`). So `b = 1`.
          *   `p` = probability of winning (0.6)
          *   `q` = probability of losing (0.4)
          `f* = ((1 * 0.6) - 0.4) / 1 = (0.6 - 0.4) / 1 = 0.2`
          **Therefore, `f* = 20%` or 1/5.** It's determined *solely* by the edge (`p - q` for even-money bets, but generalized to `(bp - q)`) and the payout (`b`). For this specific game (60% win, 2x payout on win), 1/5 is mathematically optimal for long-term growth.

  2.  **Flat $10 Bet vs. Fractional Bet: Why the Sweet Spot Disappeared?**
      *   **This is KEY and tells you something FUNDAMENTAL.** Your code was likely correct. This change transforms the game from **multiplicative (compounding) growth** to **additive growth**.
      *   **Additive Growth Dynamics:**
          *   Each bet is independent of your current bankroll. Win +$10, Lose -$10.
          *   Expected Value per bet: `(0.6 * $10) + (0.4 * -$10) = $6 - $4 = $2`.
          *   After `n` bets, Expected Profit = `$2n`.
          *   **Risk of Ruin:** While possible (if you lose more than 10 times in a row starting from $100), it's much less severe than the fractional game. You'd need 11 consecutive losses to go broke from $100. Probability = `(0.4)^11 ≈ 0.000004`. It happens, but rarely. More importantly, *going broke doesn't preclude future wins* in the same catastrophic way (though you need rules for betting below $10).
          *   **No Compounding:** Your growth doesn't accelerate with wins or decelerate as much with losses compared to the fractional game. There's no geometric mean to maximize in the same way.
          *   **Optimal Strategy:** Because each bet offers a positive EV ($2) and the risk of ruin is relatively low (and manageable), **betting the maximum allowed each time *does* maximize both your expected final bankroll *and* is a reasonably practical strategy.** The "sweet spot" vanishes because the growth isn't multiplicative. The problem shifts from optimizing geometric growth to simply capturing as much positive EV as possible while managing a low absolute ruin risk.

  3.  **Feelings vs. Math & Gambler's Ruin:**
      *   **Your Sim Wins:** Your emotionless simulation conclusively shows that staking 1/5 (`f*`) leads to a higher *typical* (median, geometric mean) outcome after many rounds than staking everything. A rational agent interested in *maximizing the long-term growth rate of their wealth* would use the Kelly fraction. Staking everything is rational *only* if your *sole* goal is to maximize the *expected value (arithmetic mean)* of your bankroll after a fixed number of bets, regardless of the risk of ruin or the distribution of outcomes. For anyone who cares about not going broke and having reasonably predictable growth, Kelly is superior.
      *   **Gambler's Ruin Connection:** This is absolutely related, but with a crucial twist. Gambler's ruin typically applies to **fair or negative EV games** (like casinos). In those, *any* betting strategy leads to ruin with probability 1 if played indefinitely against an opponent with infinite wealth (the casino). Your game is **positive EV** (60% win chance). The twist is that *even in a positive EV game, betting too aggressively (like full bankroll) still leads to ruin with near certainty*. The Kelly criterion tells you *how much* you can bet on a positive EV opportunity to maximize growth *while avoiding certain ruin*. It flips gambler's ruin on its head: "Given I have an edge, how much can I bet without guaranteeing my own destruction?"

  **Where Does This Apply? (And Where Doesn't It?)**

  *   **Applies:** Any situation involving **repeated, risky decisions with multiplicative (compounding) outcomes** and a known edge:
      *   Investing (Portfolio allocation - how much of your capital to put into a specific stock/asset with an estimated edge).
      *   Entrepreneurship (How many resources/focus to put into a new venture vs. diversifying).
      *   Your "Summer Program" Analogy: This is a *great* application! Applying to one program is "all-in" - high potential payoff if accepted, zero if rejected. Applying to eight is diversification. The Kelly-like insight: **There's an optimal number of applications based on your acceptance probability per program, the "payoff" (value of attending), and the cost/effort of each application (which reduces resources for others or other pursuits).** Applying to *all* programs might spread you too thin, reducing the quality per application (increasing individual `q`). Applying to too few increases your risk of total rejection. Finding the "sweet spot" is analogous to finding `f*`.
  *   **Does Not Apply (or Applies Differently):**
      *   **Single Decisions:** If you only get **one flip** ever, then staking everything *is* correct to maximize EV. There's no long-term growth to optimize, no future risk of ruin from this bet. Maximize the expected outcome for that single bet.
      *   **Additive Outcomes:** As you saw with the flat $10 bet. If gains/losses are absolute ($X) rather than proportional (% of current wealth), Kelly doesn't apply in the same way. Maximizing EV is usually optimal.
      *   **Unknown or Misestimated Probabilities:** Kelly assumes you *know* `p` and the odds (`b`) precisely. Overestimating your edge (`p`) leads to overbetting (`f` too high) and increased risk of ruin. Underestimating leads to underbetting and suboptimal growth. Real-world edges are fuzzy.
      *   **Correlated Bets/Non-Independent Outcomes:** Kelly's standard formula assumes bets are independent. If outcomes are correlated (e.g., investing in stocks within the same sector), you need more complex versions of Kelly to manage portfolio risk.
      *   **Extreme Risk Constraints:** If going broke has catastrophic consequences beyond just losing money (e.g., bankruptcy, losing your home), you might rationally bet *less* than the Kelly fraction for extra safety, trading off some growth for lower ruin risk. (Kelly maximizes growth, not safety).

  **In Essence: What You Found & What It Is Not**

  *   **What it IS:** The **Kelly Criterion** (`f* = (bp - q)/b`) is the optimal strategy for maximizing the *long-term geometric growth rate* of capital in repeated, independent bets with positive expectation and multiplicative outcomes. It balances the trade-off between seeking high returns (high `f`) and avoiding excessive risk (high `f` leading to high variance and ruin risk). The disconnect between the astronomical mean outcome and the near-zero median outcome when betting full bankroll is a direct consequence of ignoring this trade-off.
  *   **What it is NOT:**
      *   It is not primarily about "feelings" or "risk aversion" (though it produces strategies humans often find intuitively sensible). It's about optimal growth for a rational agent.
      *   It is not simply "gambler's ruin" (which focuses on inevitable loss in negative EV games), though it provides the solution to avoid ruin *in positive EV games*.
      *   It is not relevant for single bets or additive outcome structures.
      *   It is not a guarantee against loss or ruin (even Kelly bettors have losing streaks), but it minimizes the *time* to reach a given wealth goal and avoids certain ruin if the edge is real.

  **Why you see it everywhere:** You've grasped a fundamental principle of decision-making under uncertainty with compounding consequences – **optimal resource allocation when outcomes multiply**. Once you see this Kelly-shaped hole in the world, you start noticing how often decisions involve allocating a limited resource (time, money, effort) across repeated risky opportunities with multiplicative payoffs. It's a powerful lens for understanding growth and risk. Just remember its boundaries: multiplicative, repeated, known edge.
