answer: |-
  Here’s a comprehensive exam package addressing your requirements, designed to push students into the lock-in convention debate while demanding critical engagement with Lewis’s framework.

  ---

  ### (1) Essay Question (90-minute closed-book final)
  **"David Lewis’s account of convention explains how arbitrary regularities become self-perpetuating through mutual expectations. Critically evaluate whether Lewis’s conditions can coherently accommodate ‘lock-in conventions’—where all agents conform to regularity R, each prefers an alternative R* if universally adopted, but falsely believes others intrinsically prefer R. If such cases satisfy Lewis’s definition, does this expose a weakness in the theory’s capacity to explain norm persistence and change? In your answer, contrast how a ‘behavior-first’ escape (e.g., a minority publicly switching to R*) and a ‘belief-first’ escape (e.g., revealing hidden preferences) might resolve lock-in, and assess which better aligns with Lewisian mechanisms."**

  ---

  ### (2) Model Answer (~700 words)
  Lewis’s convention analysis brilliantly captures how arbitrary behaviors—like driving on the left—stabilize through interdependent expectations. For Lewis, a convention requires: (1) near-universal conformity to R in recurring situation S; (2) agents preferring to conform *conditional* on others’ conformity (due to sanctions or coordination benefits); and (3) *common knowledge* that everyone expects conformity, prefers conformity given others’ conformity, and recognizes R’s historical precedent. Lock-in conventions appear to fit: everyone does R (e.g., 70-hour weeks), conditionally prefers R (fearing sanctions), and expects others to conform. Yet lock-in introduces a critical twist: agents universally prefer R* (40-hour weeks) if collectively adopted *and* mistakenly believe others genuinely endorse R. This false belief about preferences challenges Lewis’s common knowledge condition. While Lewis emphasizes common knowledge of behaviors and *conditional* preferences, lock-in features systematic error about *intrinsic* preferences. If common knowledge requires truthful higher-order beliefs ("I believe you prefer R, you believe I believe you prefer R..."), lock-in violates it. Priya might counter that Lewis only requires common knowledge of behavioral expectations and conditional payoffs—not deep preferences—making lock-in a valid, if perverse, convention.  

  Accepting lock-in as convention, however, strains Lewis’s explanatory power. Lewis posits that conventions persist because expectations align: you conform because you expect others to conform, and they expect the same. Lock-in persists *despite* misaligned intrinsic preferences, sustained by false beliefs. This reveals a gap: Lewis explains *how* expectations sustain R, but not *why this specific expectation set (preferring R conditionally but falsely believing others intrinsically love R)* dominates over alternatives. The account becomes circular: R persists because everyone expects R, but the false belief underlying that expectation lacks explanation within the model.  

  Escape mechanisms further highlight tensions. Priya’s "behavior-first" escape—a stubborn 5% switching to R*—relies on Lewis’s salience/precedent mechanism. She assumes non-conformity shifts others’ expectations, triggering a cascade as conditional preferences flip. But Lewis’s machinery doesn’t guarantee this. If the minority’s deviation is seen as idiosyncratic ("they’re slackers") rather than a new precedent, expectations won’t update. Crucially, second-order beliefs ("do others *see* this as a signal?") and publicity matter. A private, scattered minority might not register as coordination-worthy salience. Conversely, a "belief-first" escape—revealing hidden preferences via a survey—attacks the false belief directly. Once agents know others prefer R*, expectations and conditional preferences can realign without behavioral change. Yet this path is alien to Lewis, who prioritizes behavior and precedent over communicated preferences. His framework lacks tools to model how meta-beliefs shift without behavioral disruption.  

  Ultimately, lock-in conventions expose Lewis’s theory as descriptively rich but normatively thin. It explains sanction-driven conformity but cannot ground *entitlements* to sanction, as Priya claims. While punishment can be folded into payoffs ("I prefer R because sanctions hurt"), this doesn’t explain why sanctioning is *accepted* as legitimate rather than merely feared. Lock-in thus underscores Lewis’s strength—cold-eyed recognition of bad equilibria—and its limitation: without richer psychology (e.g., belief updating beyond precedent), it struggles to explain preference falsity or escapes relying on communication over imitation. The belief-first escape better resolves lock-in but requires augmenting Lewis; the behavior-first escape fits his system but fails without favorable belief dynamics his model neglects.

  ---

  ### (3) Marking Scheme (out of 20)
  **Must-hit moves:**  
  1. **Engagement with lock-in’s challenge to common knowledge (0-5 pts)**  
     *Fumble:* Ignores false beliefs or conflates conditional/intrinsic preferences.  
  2. **Evaluation of whether lock-in satisfies Lewis’s conditions & implications for explanatory power (0-4 pts)**  
     *Fumble:* Asserts "yes/no" without addressing circularity in explaining persistence.  
  3. **Contrast of behavior-first vs. belief-first escape mechanisms (0-4 pts)**  
     *Fumble:* Treats minority tipping as mechanically effective; omits publicity/second-order beliefs.  
  4. **Analysis of which escape aligns with Lewis (behavior-first) and why belief-first requires augmentation (0-4 pts)**  
     *Fumble:* Fails to note Lewis’s lack of tools for preference revelation.  
  5. **Coherent synthesis: Costs to Lewis’s account re: norm persistence/change (0-3 pts)**  
     *Fumble:* Lists points without connecting false beliefs→explanatory gap→escape limitations.  

  ---

  ### (4) A vs. B Answer Differentiation  
  A B answer (14-16/20) accurately restates Lewis’s conditions, describes lock-in, and summarizes the debate but misses nuances: e.g., arguing lock-in "obviously" violates common knowledge without addressing conditional vs. intrinsic preferences, or claiming a 5% minority "always" tips equilibria. An A answer (17-20/20) **interrogates ambiguities in Lewis’s common knowledge requirement**, explicitly ties lock-in’s persistence to unexplained false beliefs (exposing circularity), and **contrasts escape mechanisms by dissecting how expectations update** (or fail to) in each case. Crucially, it synthesizes these points to show how lock-in reveals Lewis’s struggle to explain *why* belief traps emerge and how communication—not just behavior—can dismantle them, ultimately questioning the theory’s completeness for norm dynamics.

  ---

  This package forces students to: (1) grapple with the common knowledge ambiguity, (2) confront explanatory limitations, (3) test escape mechanisms against Lewis’s behaviorist framework, and (4) synthesize costs to the theory—ensuring mere regurgitation caps at a B. The model answer demonstrates depth without quotations, and the marking scheme rewards critical engagement over recitation.
