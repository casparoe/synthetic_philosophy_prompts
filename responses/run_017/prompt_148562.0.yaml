prompt: |-
  I’ve just had a long and inconclusive argument with a friend about whether an output from a non-human system can ever count as a performative utterance, and I do not want to have it again. Our disagreement started from a scripted customer-service chatbot that sends a fixed message saying I apologize for the outage whenever an outage is detected, where the company’s policy says customers should treat that message as an official apology; my friend thought this was enough for a real apology, while I thought something essential was missing. We then moved to a harder case: a blockchain-based organization whose code automatically publishes a statement that a member is expelled as soon as a vote passes, and whose governing rules say that publication is the expulsion. We realized we were each assuming a different theory of what a performative utterance has to be, so before I read any more speech-act theory I want a specification of what I should be demanding of one.

  Write the desiderata that any adequate theory of performative utterance must meet in order to settle disputes of exactly this kind. Fix the purpose narrowly: the theory must be good enough to adjudicate whether outputs of non-human or semi-automated systems—scripted chatbot messages, automatic institutional publications, smart-contract declarations, and similar cases—can count as promises, orders, apologies, declarations, or other illocutionary acts, and if so under what conditions.

  The deliverable should be the requirements themselves, with the case or consideration behind each. Cover at least: the paradigm human cases any theory must get right (explicit performatives such as the words used in a marriage ceremony, the naming of a ship, a bequest in a will, and a bet about tomorrow’s rain; and implicit cases such as a one-word order to leave a room); the main varieties of infelicity (an unauthorized person attempting a christening, a promise made without any intention of keeping it, a joke or theatrical use, and a case in which the hearer entirely fails to understand what is being done); and the new algorithmic cases above. Say which distinctions the theory must respect—constative versus performative, explicit versus implicit performative, locutionary versus illocutionary versus perlocutionary, happiness or unhappiness versus truth or falsity, illocutionary force versus propositional content, speaker intention versus conventional procedure, and assertion versus declaration—and which of those distinctions are genuinely load-bearing rather than optional preferences of one school. For each requirement, give the concrete case that motivates it.

  Mark which requirements are non-negotiable for this purpose and which are merely preferences of particular camps; for example, say whether it is a genuine desideratum that no performative be truth-evaluable, or only a preference inherited from an early Austin-style contrast with constatives, and whether a theory must require a speaker with intentions and beliefs or may treat conventional uptake and institutional rule-following as sufficient. Most importantly, flag any pair of desiderata you suspect cannot be jointly satisfied, and explain the conflict: for instance, whether a theory can both require genuine speaker intention for every illocutionary act and also allow a mindless algorithmic publication to be a full declaration, or whether it can both demand that illocutionary categories be mutually exclusive and exhaustive and still accommodate utterances that seem to have more than one force at once.

  If it helps, you may close with at most a short paragraph on how Austin’s early performative/constative account and Searle’s later treatment of declarations each fare against the list; do not write a full scorecard or bibliography, and keep the weight on the criteria rather than the scoring.
reasoning: |-
  We are building a set of desiderata for a theory of performative utterances that must adjudicate whether non-human or automated systems can produce such acts. The focus is on cases like the chatbot apology and the blockchain expulsion. We must cover:

  1. Paradigm human cases (explicit and implicit performatives).
  2. Varieties of infelicity (misfires, abuses, etc.).
  3. Algorithmic cases.

  We also need to specify which distinctions are load-bearing and which are optional, and note any conflicts.

  ---

  **Desiderata for an Adequate Theory of Performative Utterances**

  **I. Non-Negotiable Requirements (Core Cases and Distinctions)**

  1. **Explicit Human Performatives Must Be Accounted For**: The theory must correctly classify canonical explicit performatives (e.g., "I name this ship the *Queen Elizabeth*" during a christening, "I now pronounce you husband and wife" in a valid marriage ceremony, "I bequeath my watch to my brother" in a will, "I bet you five pounds it will rain tomorrow" in a bet). These are cases where the utterance itself, under the right conditions, constitutes the act.

     *Motivation*: Any theory that fails to explain these core cases is inadequate.

  2. **Implicit Human Performatives Must Be Accounted For**: The theory must handle implicit performatives (e.g., saying "Out!" to order someone to leave, which is an order; "Guilty" by a jury foreman to declare guilt). These lack explicit performative verbs but are understood as acts.

     *Motivation*: Everyday language includes such acts, and the theory must not require explicit formulas.

  3. **Infelicities Must Be Systematized**: The theory must account for the main types of infelicity (misfires and abuses) as identified by Austin:

     - **Misfires (act is void or null)**:
       - *Unauthorized actor*: E.g., a random person attempting to christen a ship.
       - *Incorrect procedure*: E.g., saying "I divorce you" three times in a culture where that is not the procedure.
       - *Incomplete execution*: E.g., a marriage ceremony interrupted before completion.
     - **Abuses (act is performed but hollow)**:
       - *Insincerity*: E.g., promising without intention to fulfill.
       - *Theatrical or non-serious context*: E.g., an actor in a play saying "I promise" as part of a script.

     *Motivation*: A theory must explain why some utterances fail to achieve their intended force.

  4. **Illocutionary Force vs. Propositional Content**: The theory must respect the distinction between the force (e.g., promising, ordering) and the content (what is promised, ordered, etc.). This is load-bearing.

     *Motivation*: The same proposition (e.g., "the door is closed") can be used with different forces (assertion, request to close it, etc.).

  5. **Conventional vs. Intentional Elements**: The theory must account for both conventional procedures (institutional rules) and speaker intentions. It must not reduce performatives to only one of these.

     *Motivation*: In human cases, both matter. A marriage requires a licensed officiant (convention) and the couple's intent to marry. But in algorithmic cases, we need to know if convention alone suffices.

  6. **Happiness/Unhappiness vs. Truth/Falsity**: The theory must maintain Austin's insight that performatives are not truth-evaluable in the same way as constatives (e.g., "I apologize" is not true/false but happy/unhappy). This distinction is non-negotiable for the core of performativity.

     *Motivation*: The primary contrast that launched speech-act theory. Without it, we lose the point of performatives.

  7. **Declaration as a Distinct Category**: The theory must recognize declarations (acts that change institutional reality, e.g., firing, declaring war, expelling) as a distinct type of illocutionary act that requires conventional procedures and does not necessarily depend on the speaker's inner states.

     *Motivation*: In the blockchain case, the expulsion is a declaration. If the theory cannot handle declarations, it fails a key test.

  **II. Requirements Specific to Algorithmic Cases**

  8. **Non-Human Systems Must Be Accommodated Under Certain Conditions**: The theory must specify conditions under which an output from a non-human system (e.g., a chatbot, a blockchain) can count as a performative act. The conditions must be grounded in the same principles as human cases but may require adjustments.

     *Motivation*: The chatbot and blockchain cases are central to the dispute.

     - *Conditional Requirement*: The theory should not a priori exclude non-human systems, but it must not over-generate (e.g., not every automated message is a performative).

  9. **Institutional Backing for Algorithmic Acts**: For declarations and similar institutional acts, the theory must allow that if the system is authorized by the institution and follows the rules, its output can count as the act, regardless of whether there is a human with intentions behind the specific utterance.

     *Motivation*: In the blockchain case, the expulsion is automatic upon vote and defined by the code. If the institution recognizes it, then the act is done.

     - *Conflict Alert*: This may clash with the requirement for speaker intention (see below).

  10. **Intention in Algorithmic Promises/Apologies**: For acts that typically require intention (e.g., promising, apologizing), the theory must clarify whether intention is necessary and, if so, how it can be attributed to a system or its designers.

      *Motivation*: The chatbot apology case turns on whether an apology requires feeling sorry or if institutional standing suffices.

      - *Conflict Alert*: If intention is strictly required, then the chatbot cannot apologize. But if institutional convention suffices, it might.

  **III. Load-Bearing vs. Optional Distinctions**

  - **Load-Bearing**:
    - Performative vs. Constative: Must be respected (non-negotiable).
    - Illocutionary vs. Perlocutionary: Must be respected (illocutionary is the act performed *in* speaking, perlocutionary is the effect *by* speaking, e.g., persuading). The theory must focus on illocutionary acts for performatives.
    - Explicit vs. Implicit Performative: Must be accounted for but not as a rigid binary (it's a matter of explicitness).
    - Happiness vs. Truth: Non-negotiable.
    - Declaration vs. Other Acts: Declarations are a special class that must be recognized.

  - **Optional** (can be theory-dependent without failing the core):
    - Whether every illocutionary act requires an intention (some theories, like Searle, require it; others, like institutional theories, might not).
    - Whether the categories of illocutionary acts are mutually exclusive and exhaustive (Searle's taxonomy has five categories, but others might allow overlaps).

  **IV. Potential Conflicts Between Desiderata**

  - **Conflict 1: Intention vs. Algorithmic Declaration**:
    - *Desiderata in tension*: 
      - (5) The theory must account for both convention and intention in human cases.
      - (7) Declarations are conventional and may not require intention beyond the institutional role.
      - (9) Algorithmic declarations should be valid if institutionally backed.
    - *Conflict*: If the theory requires a speaker with intentions for every illocutionary act, then the blockchain expulsion (which is mindless) cannot be a declaration. But if it allows pure convention, then it can. This must be resolved by the theory.

  - **Conflict 2: Intention in Non-Declarative Algorithmic Acts**:
    - *Desiderata in tension*:
      - (10) For acts like apology, intention might be seen as essential.
      - (8) We want to accommodate non-human systems under some conditions.
    - *Conflict*: The chatbot apology might be felicitous if the company's policy makes it an official act (conventional) but infelicitous if an apology requires a feeling of regret (intentional). The theory must decide if an institutional apology without felt regret is still an apology.

  - **Conflict 3: Mutual Exclusivity of Illocutionary Forces**:
    - *Desiderata*: Some theories require mutually exclusive categories, but in practice, an utterance might have multiple forces (e.g., "I promise to leave" is both a promise and a warning). The theory must not break on such cases, but it need not enforce mutual exclusivity if there is a better way.

  **V. Brief Note on Austin and Searle**

  - **Austin**: His early performative/constative distinction and infelicity framework set the stage. However, he later moved to a general theory of illocutionary acts, which might better handle algorithmic cases via conventional procedures. He might struggle with non-intentional algorithmic acts because he emphasized the speaker's commitment.

  - **Searle**: His taxonomy (especially declarations) is useful because declarations depend on extra-linguistic institutions and can be rule-based. He allows for institutional acts without requiring the individual's psychological state if the institution assigns the function. This could accommodate the blockchain case. However, for non-declarative acts (like promises), he requires intention, which might exclude the chatbot apology if intention is strictly personal.

  ---
  This set of desiderata should help adjudicate the dispute by forcing clarity on the necessary conditions for performatives, especially in algorithmic contexts.
answer: |-
  Below is a specification of desiderata for a theory of performative utterances, tailored to adjudicate disputes about non-human systems (e.g., chatbots, blockchain declarations). Each requirement is grounded in a concrete case, labeled as **non-negotiable** (essential for resolving the target disputes) or **preferential** (theory-dependent). Conflicts between desiderata are flagged. The focus is on illocutionary acts (e.g., promises, orders, declarations) and their felicity conditions.

  ---

  ### **I. Core Human Cases: Non-Negotiable Desiderata**
  1. **Explicit performatives must be fully accounted for**  
     *Case*: "I now pronounce you married" (marriage), "I name this ship *Titanic*" (christening), "I bequeath my estate to X" (will), "I bet $5 it rains tomorrow" (bet).  
     *Requirement*: The theory must explain how these utterances, when successful, *constitute* the act rather than describe it.  
     *Distinction*: **Performative vs. constative** (load-bearing: performatives lack truth value; their "success" is felicity, not truth).

  2. **Implicit performatives must be accommodated**  
     *Case*: Shouting "Out!" to order someone from a room (order), or "Guilty" in a courtroom (verdict).  
     *Requirement*: The theory must handle acts without explicit performative verbs (e.g., "I order..."), relying on context and convention.  
     *Distinction*: **Explicit vs. implicit performative** (load-bearing: force must be recoverable even if not explicit).

  3. **Infelicities must be systematized**  
     *Cases*:  
     - *Misfire (procedural defect)*: Unauthorized person "christening" a ship.  
     - *Abuse (insincerity)*: Promising without intent to fulfill.  
     - *Parasitic use*: Actor on stage "apologizing" in a play.  
     - *Uptake failure*: Utterance in unknown language; hearer doesn’t grasp the act.  
     *Requirement*: The theory must distinguish procedural flaws (act null) from insincerity (act valid but defective) and non-serious contexts (act void).  
     *Distinction*: **Happiness/unhappiness vs. truth/falsity** (non-negotiable: performatives succeed/fail via felicity conditions, not truth).

  ---

  ### **II. Load-Bearing Distinctions: Non-Negotiable**  
  4. **Illocutionary force must be separable from propositional content**  
     *Case*: "Leave!" (order) vs. "He leaves" (assertion) — same content, different force.  
     *Requirement*: The theory must isolate force (e.g., ordering, promising) from content (e.g., "you leave").  
     *Distinction*: **Illocutionary vs. locutionary** (load-bearing: force defines the act type).

  5. **Declarations require conventional effect**  
     *Case*: "You are expelled" by a dean (expulsion), "War is declared" by a leader.  
     *Requirement*: Declarations must change institutional reality *solely via convention* (e.g., authority + procedure). Speaker intention may be irrelevant if conventions are met.  
     *Distinction*: **Assertion vs. declaration** (load-bearing: declarations create facts; assertions describe them).

  6. **Conventional procedures can override individual intentions**  
     *Case*: A judge pronouncing a sentence under duress — the act is still valid if procedures are followed.  
     *Requirement*: Institutional acts (e.g., declarations) depend on rules, not personal intent.  
     *Distinction*: **Speaker intention vs. conventional procedure** (load-bearing for declarations; preferential for promises/apologies).

  ---

  ### **III. Algorithmic Cases: Non-Negotiable Desiderata**  
  7. **Non-human systems can perform declarations if institutionally embedded**  
     *Case*: Blockchain auto-publishing "Member X is expelled" upon a vote, with rules defining this as expulsion.  
     *Requirement*: If the system is a valid instrument of the institution (rules/authored by humans), its output counts as a declaration. Intention is irrelevant.  
     *Conflict*: Desideratum 6 (convention over intent) resolves this; clashes if intention is required (see Desideratum 10).

  8. **Scripted apologies/promises demand intention or institutional standing**  
     *Case*: Chatbot saying "I apologize for the outage" per company policy.  
     *Requirement*: For non-declarative acts (e.g., apologies), the theory must decide if:  
     - (a) **Intention is essential**: Apology requires remorse → chatbot fails.  
     - (b) **Conventional role suffices**: Company authroizes it as proxy → apology valid.  
     *Distinction*: **Illocutionary force vs. propositional content** (apology force ≠ declaration force).  
     *Conflict*: Desideratum 5 (declarations need no intent) vs. Desideratum 10 (intent for expressives).

  9. **Uptake must be possible for non-human acts**  
     *Case*: Smart contract declaring "Payment owed" to an address.  
     *Requirement*: The act must be interpretable by its audience (e.g., the recipient’s system/humans) as having force — even if no human "understands" it.  
     *Distinction*: **Illocutionary vs. perlocutionary** (load-bearing: illocutionary acts require uptake; perlocutionary effects like persuasion are secondary).

  ---

  ### **IV. Preferential Distinctions (Theory-Dependent)**  
  10. **Speaker intention may be optional for some acts**  
      *Case*: Chatbot apology.  
      *Requirement*: A theory *may* treat intention as necessary for "sincerity-sensitive" acts (promises, apologies) but not declarations. Not non-negotiable; theories can choose.  
      *Conflict*: If intention is required (e.g., Searle), algorithmic promises/apologies fail. If not (institutional view), they may succeed.  

  11. **Mutual exclusivity of illocutionary categories is optional**  
      *Case*: "I promise I’ll defeat you" (both promise and threat).  
      *Requirement*: Theories need not force acts into one category; hybrid forces are tolerable.  

  12. **Truth-evaluability is not barred**  
      *Case*: "I state that the door is locked" — explicit performative with truth-apt content.  
      *Requirement*: Early Austin (performatives ≠ truth-evaluable) is a preference; later speech-act theories allow truth-apt performatives.  

  ---

  ### **V. Flagged Conflicts**  
  - **Intention vs. Algorithmic Declarations (Desiderata 5/7 vs. 10)**:  
    If a theory requires genuine intention for *all* illocutionary acts (Searle-like view), it cannot accept mindless algorithmic declarations (blockchain expulsion). Conversely, if declarations are purely conventional (Desideratum 5), intention is irrelevant.  
    *Resolution*: Treat declarations as a special class exempt from intention requirements.  

  - **Institutional Standing vs. Sincerity (Desiderata 6/8)**:  
    Can a chatbot’s scripted "apology" be valid without feeling? If the theory demands intention (Desideratum 10), no. If institutional convention suffices (Desideratum 6), yes.  
    *Resolution*: Split acts — declarations (institutional) require convention; expressives (apologies) require intention.  

  - **Uptake in Non-Human Contexts (Desideratum 9)**:  
    If "uptake" requires human understanding, a smart contract act fails if no human processes it. But if machine interpretation suffices (e.g., blockchain consensus), it succeeds.  
    *Resolution*: Broaden "uptake" to include institutional recognition (human or machine).  

  ---

  ### **Brief Note on Austin and Searle**  
  Austin’s early performative/constative dichotomy struggles with algorithmic cases by over-relying on speaker-centric criteria (intention, sincerity). His later illocutionary framework better accommodates conventions but remains ambiguous on non-humans. Searle’s declarations (conventional acts requiring institutional facts) align with Desiderata 5/7, allowing blockchain expulsions. However, his intention requirement for directives/expressives (Desideratum 10) conflicts with chatbot apologies. A hybrid theory — conventional rules for declarations, intention for expressives — may satisfy all desiderata except for hard intention-dependent cases.
