answer: |-
  Below is the exam question, model answer, and marking scheme designed to meet your specifications.

  ---

  ### Exam Question (60 minutes)
  **Assess the following claim: The 'invariance test' (an artifact is political in itself if its political effects persist across nearby variations in makers' intentions, stated purposes, and social context, with only design held fixed) successfully distinguishes artifacts that are political *in themselves* from those merely political *due to circumstances*. In your analysis:**
  1. **Explain whether locks, staircases, and revolvers (as counterexamples) refute the test.**
  2. **Apply the test to the keyless entry system case** (a housing cooperative installs a resident-readable entry log marketed for convenience; within a year, norms shift from trust to mutual accountability, with evidence suggesting identical effects in a privacy-absolutist commune).  
  3. **Conclude whether the test vindicates, refines, or undermines Winner's distinction between artifacts that are political "in themselves" (e.g., LI overpasses) and those political only contingently.**

  ---

  ### Model Answer (667 words)  
  The invariance test proposes that artifacts possess inherent politics if their political effects are invariant across plausible changes in intention, purpose, or social context. While initially promising, the counterexamples of locks, staircases, and revolvers—and the keyless entry case—reveal that the test either collapses into triviality or covertly relies on contested social judgments, ultimately undermining Winner’s distinction rather than refining it.  

  **Counterexamples: Refutation or Revelation?**  
  The lock, staircase, and revolver appear to refute the invariance test because each reliably redistributes power (e.g., locks exclude non-keyholders; stairs exclude wheelchair users; revolvers equalize lethal force) regardless of makers’ intentions (e.g., a lock designed for privacy still functions as a barrier) or context (e.g., stairs impede mobility in any society with disabled persons). If these are deemed "political," the test becomes overinclusive, classifying banal objects as inherently political. However, this misses the test’s hidden premise: it assumes we *already agree* on what constitutes a "political effect." Stairs’ exclusionary effect is invariant *only if* we pre-define "exclusion of wheelchair users" as political—a normative judgment contingent on social values (e.g., disability rights frameworks). Where such values are absent (e.g., a society without wheelchair users), the "effect" vanishes. Thus, the counterexamples expose not invalidity but the test’s dependence on unstated social premises. Far from refuting the test, they reveal its circularity: artifacts appear "inherently" political only when we fix the *interpretive lens* through which effects are deemed political.  

  **Keyless Entry Case: Invariance or Interpretation?**  
  The keyless entry system seemingly passes the invariance test: in both the cooperative and privacy-absolutist commune, it shifts norms from trust to accountability by making entry data permanently visible. Design alone (a resident-readable log) appears to cause this effect, irrespective of stated purposes (convenience) or initial contexts (high-trust coop vs. privacy-absolutists). This suggests the artifact is political *in itself*. Yet closer scrutiny shows ambiguity. The effect—"mutual accountability"—is political only under specific social conditions. First, it requires residents to *interpret* logged entries as signals of trustworthiness (e.g., frequent late-night entries might imply rule-breaking). Second, it necessitates a pre-existing *capacity* to enforce norms (e.g., social shaming, governance structures). In a commune rejecting collective monitoring, residents might ignore the log or dismantle the system. The effect’s invariance thus depends on background social facts: (1) a shared understanding of data as delegitimizing, and (2) mechanisms to convert scrutiny into sanction. Without these, the ledger is merely a neutral record. The test’s apparent success here relies on implicitly fixing social responses to transparency.  

  **Winner’s Distinction: Undermined, Not Vindicated**  
  This analysis undermines Winner’s distinction in two ways. First, the invariance test cannot screen out social context because *all* political effects require socially contingent interpretations. The LI overpasses—Winner’s paradigmatic case—exclude buses only given car-centric transportation hierarchies; in a society without buses or class-stratified transit, they might be politically inert. Their "durability" is not a property of concrete alone but of its interaction with persistent social structures. Second, the test reframes but does not resolve the core debate: whether artifacts *materialize* power relations (e.g., Marx on machinery) or merely *amplify* human intentions. The keyless system materializes a surveillance capacity, but its political valence (oppressive vs. democratic) depends on communal values—as seen in the coop (accountability embraced) vs. commune (accountability rejected). Artifacts constrain or enable, but their politics emerges from *ongoing sociotechnical negotiations*, not frozen in design.  

  **Conclusion: The Social Reimported**  
  The invariance test fails to isolate artifacts’ "inherent" politics because political effects are not intrinsic properties like weight or conductivity. They arise from the interplay of design, human interpretation, and social structure. Locks and keyless logs are political only when embedded in practices that assign meaning to exclusion or visibility. Winner’s distinction collapses because no artifact is political *in itself* without a society to render its effects politically salient. The test’s value lies not in identifying apolitical objects but in revealing how designs *stabilize* certain power relations across contexts—yet this stabilization is itself a social achievement.  

  ---

  ### Marking Scheme (20 points total)  
  **Must-have moves** (Award marks as specified; deduct for errors noted):  
  1. **Accurate definition of invariance test + counterexample handling** (5 pts)  
     *✓: Clearly states test; argues counterexamples expose reliance on pre-defined "political effects."*  
     *✗: Misrepresents test; dismisses counterexamples as "not political" without justification.*  

  2. **Application to keyless entry case** (5 pts)  
     *✓: Identifies apparent invariance (accountability shift in both contexts) but notes dependence on interpretive practices/norm-enforcement capacity.*  
     *✗: Asserts effect is "obviously" invariant or contingent without analysis; ignores commune comparison.*  

  3. **Evaluation of Winner’s distinction** (4 pts)  
     *✓: Concludes test undermines distinction by showing all "inherent" politics rely on social context.*  
     *✗: Claims test refines Winner without addressing circularity; conflates durability with inherent politics.*  

  4. **Critical synthesis: The "missing condition"** (4 pts)  
     *✓: Argues test fails due to covert reliance on social judgments about what counts as political.*  
     *✗: Proposes ad hoc fixes (e.g., "add human intention") without engaging test’s core paradox.*  

  5. **Structure & clarity** (2 pts)  
     *✓: Logically organized; precise language; avoids summary regurgitation.*  
     *✗: Disjointed; excessively quotes Winner; fails to address all question parts.*  

  ---

  ### Literature Notes for Moderator  
  - **Settled**: Winner’s two modes (technical arrangements as power-relations vs. inherently political designs) are a standard taxonomy. Critical responses (e.g., Joerges, Woolgar & Cooper) denying *strict* technological determinism are consensus.  
  - **Contested**: Whether artifacts can *ever* be "political in themselves" (per Winner’s Mode 2) is disputed.  
    - *Model answer’s contested stance*: Asserts that all political effects require social interpretation (aligning with Woolgar’s configurational view). A substantivist (e.g., Latour) might reject this, arguing artifacts *do* prescribe actions.  
  - **Keyless case nuance**: The model answer treats "redistribution of power via surveillance" as political, but some scholars (e.g., Nissenbaum) might argue norms define whether logging *is* surveillance.  
  - **LI overpasses**: Widely taught as Winner intended, but historians note bus exclusion was likely unintended (Winner later conceded this). The model answer uses it conventionally while acknowledging context-dependence.
