prompt: |-
  I run a monthly reading group at my local rationalist meetup — about ten people, mostly working programmers, two with undergraduate philosophy, one econ PhD student — and next month's session is mine: ninety minutes, a whiteboard, and the doomsday argument. I don't need the argument explained to me. I need a plan for the session.

  What I want from you is the explanatory sequence, and the dependency reasoning behind its order: which distinction has to be on the board before the argument can even be stated without sounding like a word game (my guess is that the prior over total population size has to be separated from the update on one indexical observation, and that 'small total' has to be separated from 'imminent end' before any of it), and why that order rather than an alternative one.

  Second, the carrying example. I keep going back and forth between the urn of numbered tickets with an unknown number of tickets and the hotel-room-with-a-number-on-the-door style case. Tell me which should carry the ninety minutes, what such an example has to have and to lack — my worry is that any case where a friendly experimenter stipulates the sampling procedure smuggles in precisely the assumption the argument is contested over — and what the other one would quietly import instead.

  Third, the misconception map: the errors they will arrive with or form, and the point in the sequence at which each has to be headed off. The ones I'm braced for, roughly in the order I expect them: 'of course my birth rank is low, somebody had to be at that rank'; 'this is just the German tank problem, and nobody disputes that'; 'SIA cancels it, so it's refuted and we can go home'; 'the reference class is a free parameter, so I'll pick people with my first name'; 'so this is an argument for spending more on existential risk.' Tell me which of these I should raise myself, in my own voice, rather than waiting for someone else to raise it — my instinct is that if I let the sampling-assumption objection arrive first and unmanaged, the second half of the session becomes that argument and nothing else lands. Also tell me what I should explicitly rule out of scope and name as out of scope: I'm guessing the Adam-and-Eve and shooting-room end of the literature, and the question of whether the argument should change what we do as opposed to what we believe.

  Two further constraints. One of them will bring up the cousin argument that anything observed at a random moment has probably about as much future as past; I don't know whether to fold that in or to rule it out, and I'd like your reasoning. And one of them will point out that if most observers turn out to be simulated, the reference class question is reopened — I can't tell whether to treat that as a reductio of the argument or as a legitimate extension, and I'd rather not improvise.

  Finally, a check for the last ten minutes: something I can ask them, or have them do, that separates someone who has the mechanism — the shape of the update, and where its force comes from — from someone who has memorized the conclusion and a stock reply to it. Assume no one in the room has done formal Bayesian work in years and that anything with conditioning notation will lose half of them. Please don't give me a reading list.
reasoning: |-
  Okay, let me tackle this step by step. The user runs a rationalist reading group and needs a 90-minute session plan on the Doomsday Argument (DA). They want explanatory sequence logic, choice of central analogy, misconception handling, and an assessment check.

  First, I need to understand the core challenge. The DA is notoriously tricky because it blends probability theory with anthropic reasoning in counterintuitive ways. The user's main concerns are:
  - Sequencing: Which foundational concepts must be established before introducing the argument itself?
  - Analogy selection: Urn vs. hotel room - which better avoids smuggling in contested assumptions?
  - Misconception management: Which errors to preempt vs. let emerge, and how to contain scope
  - Assessment: How to verify understanding without formal notation

  For sequencing, I recall the DA's fragility - it collapses if certain distinctions aren't crystal clear. The absolute priority is separating:
  1. The prior over total humans (N)
  2. The indexical observation (my birth rank n)
  3. The update's effect on likely extinction timing

  Without this, it sounds like wordplay. I'll structure the sequence to build these pillars sequentially, starting from entirely uncontroversial examples.

  For analogies, the urn has problems - the experimenter's sampling protocol implicitly assumes the very uniformity that's disputed. The hotel room avoids this by making the observer's uncertainty about room numbering organic. I'll use the hotel as primary carrier but keep the urn on standby for specific pedagogical moments.

  Misconceptions need tiered handling. The "somebody had to be low-ranked" objection must be preempted immediately after stating DA, as it's foundational. SIA and reference class issues should be teacher-raised to control framing. Crucially, I'll explicitly rule out prescription (what to do) and focus solely on belief updating.

  The "random moment" point is actually a different argument (Gott's delta-t) - I'll mention it briefly as related but distinct. Simulation worries are a legitimate extension but too complex for this session; I'll note them as unresolved frontier questions.

  For assessment, I'll avoid formal notation. Instead, I'll use a "debugging" exercise where they identify flaws in a botched DA explanation - this tests conceptual grasp better than recall.

  Throughout, I'll maintain a tight focus on the core epistemic mechanism. The session must resist drifting into SIA debates or existential risk implications, however tempting. Ninety minutes is barely enough for clean foundations.
answer: |-
  Here’s a battle-tested session plan designed for your constraints, prioritizing conceptual clarity and preempting distractions. The sequence builds layers of understanding while isolating the argument’s core mechanism.

  ---

  ### **Explanatory Sequence & Dependency Reasoning**  
  *(Total: 60-65 minutes)*

  1. **Groundwork: Indexical Uncertainty (10 mins)**  
     - **Start with:** "You wake up in a hotel room with a number on the door. You have no idea how many rooms exist. What’s your best guess about whether your room number is in the first 10% of rooms?"  
     - **Key distinction:** *Prior over total rooms (N)* vs. *your observation (room number n)*.  
     - **Why first?** Humans intuitively conflate *"I observe n"* with *"n is special"*. This isolates indexical uncertainty—your room number isn’t inherently special; it’s a random sample from *some* distribution. Use the whiteboard to sketch:  
       ```
       UNKNOWN: Total rooms N (a fixed number)  
       KNOWN: Your room number n  
       ```

  2. **The Prior: Modeling Ignorance (15 mins)**  
     - **Introduce:** "How to model ignorance about N? If N could be 100 or 100,000, what prior reflects total uncertainty?"  
     - **Board:** Draw the *log-uniform prior* (1/N). Explain:  
       - Equal probability per order of magnitude (N=100 as likely as N=1,000).  
       - Not unique, but standard for scale-invariant unknowns (e.g., "how many planets have life?").  
     - **Why now?** The DA’s force depends on an uninformative prior. Establishing this *before* introducing anthropics avoids conflating priors with updates.

  3. **The Update: Conditional Probability (20 mins)**  
     - **Pivot to humanity:** "Replace 'hotel rooms' with 'humans who ever live'. Your birth rank is n ≈ 100 billion. What does observing n tell us about N?"  
     - **Board the update:**  
       ```
       P(N | n) ∝ P(n | N) * P(N)  
                 ∝ (1/N) * (1/N)   [if n << N, P(n|N) ≈ 1/N]  
                 ∝ 1/N²  
       ```  
       *(Keep it intuitive: "Seeing room #n makes smaller N more likely")*  
     - **Critical distinction:** *"Small total N" ≠ "Doom soon"*. Clarify:  
       - Low N implies extinction before vast future populations.  
       - But "soon" is calendar time, not birth rank! (Use whiteboard: human population growth curve).  

  4. **State the Argument (5 mins)**  
     - **Concisely:** "With a log-uniform prior, observing an early birth rank updates us toward a smaller total human population → higher probability of earlier extinction."  
     - **Avoid:** Analogies with "being first" or "winning a lottery"—these trigger irrelevant intuitions.

  ---

  ### **Carrying Example: The Hotel, Not the Urn**  
  *(Use hotel as primary; urn as foil)*  
  - **Why the hotel:**  
    - The hotel’s "unknown construction size" mirrors ignorance about humanity’s timeline.  
    - No experimenter exists—avoiding the "sampling protocol" objection. Your observation is passive.  
  - **Urn’s flaw:** The urn *requires* an experimenter drawing tickets fairly. This smuggles in SSA (Self-Sampling Assumption), which critics dispute. Save it for contrast later.  
  - **How to deploy:**  
    - Start with the hotel room (intuitive).  
    - When discussing objections, show the urn: "If a lab tech drew your ticket, the calculation holds. But is humanity like that?"  

  ---

  ### **Misconception Map & Handling**  
  *(Preempt strategically; name objections explicitly)*  

  | Misconception | When to Address | How to Handle |
  |---------------|----------------|---------------|
  | **"Somebody had to be rank n"** | Immediately after stating DA (min 40) | **Preempt yourself.** Whiteboard: "True, but P(I’m in first 10% \| N=1T) = 0.1, while P(I’m in first 10% \| N=200B) = 0.5. Update shifts probability toward smaller N." |
  | **"This is the German Tank problem!"** | After full DA statement (min 45) | **Acknowledge similarity:** "Same math, yes! But GTP assumes tanks *exist now*; DA is about *total ever to exist*. Different priors and causal structures." |
  | **"SIA cancels DA"** | When discussing assumptions (~min 50) | **Raise yourself:** "Some argue SIA (Self-Indication Assumption) negates this. SIA says 'my existence evidences more observers.' But SIA is contentious—it implies fine-tuned universes are likely. DA uses weaker SSA. Rule SIA *out of scope* today." |
  | **"Reference class is arbitrary"** | During Q&A or if raised | **Defang early:** When introducing birth rank, say: "We use 'all humans' as reference class. Yes, you can gerrymander it (e.g., 'people named John'), but that violates exchangeability. Assume default class unless you reject anthropics entirely." |
  | **"So we must fund x-risk!"** | In closing (min 85) | **Shut down firmly:** "DA is about *belief updating*, not action. Even if DA is true, it doesn’t change cost-benefit of x-risk work. That’s out of scope." |

  - **Scope boundaries to declare upfront:**  
    > "Today’s goal: Do we update beliefs about N based on n? We won’t resolve Adam & Eve, quantum immortality, or whether DA *should* change policy. Focus on the mechanism."  

  ---

  ### **Handling Two Constraints**  
  1. **"Random moment = equal past/future" (Gott’s delta-t argument)**  
     - **Fold it in during the prior discussion (min 12):**  
       > "A related idea: If you observe something at a random time, its future duration is likely similar to its past. *But*: This assumes uniform time-prior, not log-uniform. DA uses birth ranks, not calendar time—and ranks better handle exponential growth."  
     - *Why include?* Shows DA isn’t ad hoc; roots it in broader anthropic probability.  

  2. **"What if most observers are simulations?"**  
     - **Treat as reductio of the reference class (min 75):**  
       > "If sims dominate, our reference class ('biological humans') may be wrong. But then DA *still applies* to your class! Sim-you would observe a low rank among sims. This exposes DA’s fragility to class choice—but doesn’t refute the core math."  
     - *Why this way?* Prevents derailment; ties to prior scope rule.  

  ---

  ### **Final Check: Debugging Exercise (10 mins)**  
  **Task:** *"A friend says: 'The Doomsday Argument proves extinction is likely soon because it’s absurd to think we’re in the first 0.0001% of humans. What’s wrong with this phrasing?"*  

  **Probe for:**  
  - Misattributing "absurdity" to rank (vs. shift in probability).  
  - Conflating "first" with "early" (n=100B is early only if N is huge).  
  - Omitting the prior (log-uniform is essential).  
  - Equating "small N" with "soon" (growth rates matter).  

  **Why it works:** Tests grasp of distinctions (n vs. N, prior vs. update), not memorization. No math required.  

  ---

  **Session Flow Summary:**  
  ```  
  0-10m: Hotel room → Indexical uncertainty  
  10-25m: Log-uniform prior → Modeling ignorance  
  25-45m: Birth rank update → DA mechanism & "small N ≠ doom soon"  
  45-60m: Objections (preempted + managed)  
  60-75m: Constraints (delta-t, sims) + Q&A  
  75-85m: Scope reinforcement + Policy divorce  
  85-90m: Debugging exercise  
  ```  

  This sequence forces engagement with the *structure* of the argument before critics can hijack it with tribal reflexes (e.g., "SIA fixes this"). By ruling scope early and debugging at the end, you protect the core insight: *Passively observing your position in a sequence updates your beliefs about the sequence’s length—if you started ignorant.*
