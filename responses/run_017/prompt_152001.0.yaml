prompt: |-
  Hi — hoping you can help with something for the job I do alongside the PhD (I'm in STS, writing up on workplace AI and the labour process). Two days a week I'm with the new-technology team at a federation of trade unions. When an employer brings in some new bit of kit — warehouse pick-rate monitoring, an "AI assistant" for clinical coders, shift-scheduling software, automated marking, predictive-maintenance diagnostics — I write a one-page assessment that our reps then use in bargaining. I get about half a day per tech, I almost never get anything useful out of the vendor, and the people reading it are lay reps who will glaze over the second it turns theoretical. We do maybe fifteen a year, and the output has to be signed off by a committee before it goes anywhere near an employer.

  What I want is a procedure, not another ethics checklist. And I want it actually grounded in Marx's account of machinery rather than a generic "is it fair, transparent and accountable" grid. The bits I keep coming back to: the difference between formal and real subsumption (capital taking over a labour process more or less as it finds it, versus capital revolutionising the labour process itself); the machinery chapter in Capital vol 1, including that bit where the worker in manufacture uses the tool while in the factory the machine uses the worker; the stuff in the Grundrisse fragment on machines about social knowledge and the general intellect becoming a direct productive force; relative surplus value (that machinery is a way of cheapening labour-power, not just a way of sacking people); and the reserve army — how far the technology widens or narrows the pool of people who could be hired to do the job. I don't want it to collapse into the deskilling thesis either — my supervisor thinks the Braverman version of that is too crude and I half agree.

  Two things I've been messing about with in my own chapters that I'd like built in, if they survive contact with what Marx actually says:

  - discretionary residue: after the kit goes in, how much judgement is still left with the worker — and, the bit that matters, whether that residue is codifiable, i.e. whether the calls workers make are being logged in a form that the next version of the system can learn from and eventually take over. Contrast with residue that's genuinely tacit and walks out the door when the worker does.
  - replaceability gradient: how much the technology widens or narrows the set of people who could do the work, and how fast that happens.

  So: give me a decision procedure I can actually run. Questions in a fixed order; what counts as a good enough answer to each when the vendor stonewalls or I can't get a number; where the procedure just stops with a no; and where it has to hand the decision to the reps because it's a question about what workers want rather than a question of fact. It must not reduce to a predicted headcount of jobs lost — half the time the headcount barely moves and the job is still wrecked, and I need it to say why in language a rep can use in a meeting.

  Then run it on three cases: (1) a handheld scanner plus pick-rate monitor with a public league table in a distribution centre; (2) an AI clinical coding tool where a human coder signs off every code, which the employer is calling "augmentation" and which our reps have already publicly welcomed; (3) predictive-maintenance diagnostics on the railway, where the engineers genuinely like the tool because it kills the paperwork, but which logs every diagnostic judgement the engineer makes. I especially want to see it bite on (2), because I suspect the answer it gives is one we won't like and have already gone out on a limb against.

  Finally, be straight with me about where it misfires: public-sector employers with no profit motive, co-ops and worker-owned outfits, kit that's announced with a big press release and then quietly never switched on, and the case where one tool upskills one grade while disciplining another. And if either of my two concepts above doesn't survive being turned into a checklist, say so and say why.

  Cheers.
reasoning: |-
  Okay, this user is clearly deeply immersed in Marxist theory and labor process analysis, working at the intersection of academia and union activism. They're asking for a practical decision procedure rooted in Marx's machinery analysis, not another ethics checklist. Let me unpack their key requirements.

  The user operates under tight constraints: half-day assessments, vendor stonewalling, lay rep audiences, and committee approvals. Their theoretical anchors are specific - formal vs real subsumption, machinery chapters, general intellect, relative surplus value. They want to avoid Braverman's deskilling oversimplification while incorporating their original concepts of "discretionary residue" and "replaceability gradient."

  Hmm, what they're really fighting against is the reduction of labor analysis to job counts. They need to surface how work is transformed even when headcount remains stable. The three test cases are brilliantly chosen to stress-test the framework: one overtly disciplinary (scanners), one deceptively "augmentative" (clinical coding), and one ambiguously beneficial (rail diagnostics).

  For the procedure, I should structure it as sequential questions with clear stop/go points. Need operational definitions for when answers are "good enough" given information scarcity. Must flag where decisions shift from technical to political (reps' domain). The output should generate talking points reps can use - concrete, non-theoretical language about control erosion and skill appropriation.

  The clinical coding case (2) is particularly thorny. The user suspects their union already misjudged it. The framework must reveal the extractive logic beneath the "augmentation" veneer - how every approved code trains the replacement system. That's the real Marxist critique here: the appearance of worker control masking real subsumption in progress.

  For limitations, I should address: non-capitalist contexts where exploitation logic doesn't apply, technologies that remain unimplemented ("zombie tech"), and divergent impacts across worker grades. Their "discretionary residue" concept holds up, but "replaceability gradient" needs careful handling to avoid implying skills are static.

  The output must pass the "rep test" - no academic jargon, just clear arguments like: "This system isn't about replacing you tomorrow; it's about making your skills replaceable over time by capturing your judgements in logs." That makes the relative surplus value argument tangible.

  For case (2), the uncomfortable truth is that "augmentation" is transitional. The framework should force acknowledging this while giving reps ammunition to demand: 1) ownership of training data, 2) guarantees against future displacement, 3) compensation for upskilling the system. Turns defensive position into offensive bargaining.

  On limitations - in public sector cases, the procedure might overemphasize productivity gains when the real driver is political pressure. For worker co-ops, the whole subsumption framework needs rethinking since workers appropriate the general intellect. Should flag these as "context overrides" where standard analysis may not apply.
answer: |-
  Here's a Marxian Labour Process Technology Assessment (MLPTA) procedure designed for your constraints, grounded in the specified concepts, and tested against your cases. It's a sequential decision tree with clear outputs for reps.

  **Core Principles:**
  1.  **Focus on Labour Process Transformation:** Prioritize *how work is done* over headcount impact.
  2.  **Control & Knowledge:** Track shifts in control over work pace, method, and knowledge.
  3.  **Surplus Value & Power:** Analyze how tech alters relative surplus value extraction and worker bargaining power.
  4.  **Materialist Basis:** Base assessment on observable work organization, not vendor claims.
  5.  **Actionable for Bargaining:** Output identifies levers for negotiation (data control, training, job design, safeguards).

  **The MLPTA Procedure (Sequential Questions):**

  1.  **What is the *stated* purpose of the technology (by the employer)?** (Vendor docs, internal comms)
      *   *Good Enough:* Employer's own words (e.g., "increase pick rates," "reduce coding errors," "optimize maintenance schedules"). Ignore vague "efficiency" or "innovation."
      *   *Stonewall:* Observe where tech is deployed & infer from work context.
      *   *Stop/Handoff:* Never stops here. Record stated purpose.
      *   *Output:* Baseline for assessing real intent vs. effect.

  2.  **Does the technology directly monitor, pace, or constrain the worker's physical actions or immediate workflow?** (Does the machine "use the worker"?)
      *   *Good Enough:* Direct observation, worker testimony (e.g., scanner dictates route/pace, AI dictates coding options/sequence, diagnostic tool mandates data entry sequence).
      *   *Stonewall:* Assume "Yes" if tech is handheld/worn or directly interfaces with core task inputs. Assume "No" if purely analytical/back-end.
      *   *Stop/Handoff:* Never stops.
      *   *Output:* Identifies potential for **real-time subsumption** and direct control akin to the factory (Marx's machinery). High = Strong negative indicator.

  3.  **Does the technology capture, log, or structure the worker's *judgements* or *knowledge* (explicitly or implicitly)?** (Feeding the "General Intellect")
      *   *Good Enough:* Evidence of data logs (inputs, decisions, overrides), system prompts requiring codified input, worker reports of inputting "tips" or feedback.
      *   *Stonewall:* Assume "Yes" if tech is "smart" (AI, ML, complex algorithms) or involves user interaction beyond simple data entry. Assume "No" for basic sensors/automation.
      *   *Stop/Handoff:* Never stops.
      *   *Output:* Flags **Discretionary Residue Capture** and potential for future automation/knowledge appropriation. Critical for assessing long-term threats.

  4.  **Analysis of Discretionary Residue:**
      *   **a) What specific judgements/actions remain solely with the worker *after* implementation?** (Observe, interview workers).
      *   **b) Is this residue being *codified*?** (See Q3 evidence - logs, inputs, feedback loops).
      *   **c) Is any residue genuinely *tacit*?** (Requires experience, intuition, context not captured by system - harder to automate).
      *   *Good Enough:* Worker descriptions of "exceptions," "overrides," "judgement calls," and how they handle them. Evidence (or lack thereof) of logging.
      *   *Stonewall:* Assume residue exists if work isn't fully automated. Assume residue *is* being codified unless proven otherwise for complex tasks.
      *   *Stop/Handoff:* Never stops. Focus on identifying *what* is left and *if it's captured*.
      *   *Output:* Quantifies the **immediate autonomy** and assesses the **vulnerability** of that autonomy. "Codifiable Residue" = High vulnerability.

  5.  **Replaceability Gradient Analysis:**
      *   **a) Does the technology *standardize* the work process, reducing reliance on worker-specific skills/experience?** (Simplifies tasks, provides step-by-step guides, enforces uniformity).
      *   **b) Does it *increase* the required skills/training (e.g., managing the tech, interpreting complex outputs)?** (Creates new specialized roles?).
      *   **c) How does it affect the *pool* of potential workers?** (Widens: reduces skill/training needs. Narrows: requires specific new/higher skills. Neutral).
      *   *Good Enough:* Compare job descriptions/pre-post training requirements. Observe task simplification/complexity. Worker reports on ease of onboarding.
      *   *Stonewall:* Assume *standardization* (a) is a primary goal/effect unless clear evidence of significant upskilling (b). Assess (c) based on (a) & (b).
      *   *Stop/Handoff:* Never stops. Focus on direction and magnitude of change.
      *   *Output:* Assesses impact on **worker power via labour market position**. Standardization (a) + Widening Pool (c) = Strong negative indicator (increases reserve army effect). Significant Upskilling (b) + Narrowing Pool (c) = Potential positive (if workers retain control).

  6.  **Formal vs. Real Subsumption Assessment:** (Synthesize Q2, Q3, Q4, Q5)
      *   *Primarily Formal Subsumption:* Tech overlays existing process (e.g., faster calculator). Worker largely retains control of method/knowledge. Limited residue capture. Replaceability may not change drastically. *(Less threatening, focus on monitoring/intensity)*.
      *   *Primarily Real Subsumption:* Tech fundamentally reshapes the labour process (e.g., dictates workflow, captures core knowledge). Worker becomes an appendage. Residue captured/codified. Replaceability often increases. *(Highly threatening, fundamental control shift)*.
      *   *Good Enough:* Holistic judgement based on answers above. Where does the *center of gravity* lie?
      *   *Stonewall:* Default towards Real Subsumption if Q2=Yes and/or Q3=Yes and/or Q5a=Yes & Q5c=Widens.
      *   *Stop/Handoff:* Never stops. Key synthesis point.
      *   *Output:* Core assessment of **degree of transformation and control shift**. Drives overall threat level.

  7.  **Relative Surplus Value Mechanism:** How does this primarily function to cheapen labour-power?
      *   *Options:* Intensification (Q2=Yes), Deskilling/Standardization (Q5a=Yes, Q5c=Widens), Appropriation of Collective Knowledge (Q3=Yes, Q4b=Yes), Reducing necessary labour time via coordination (potentially neutral/positive if worker-controlled).
      *   *Good Enough:* Match observed mechanisms to options above.
      *   *Stonewall:* Assume Intensification or Deskilling/Knowledge Appropriation are primary goals unless clear evidence of pure coordination benefits *retained by workers*.
      *   *Stop/Handoff:* Never stops.
      *   *Output:* Explains **"why headcount might be stable but the job is wrecked"** (intensification, deskilling, knowledge loss). Key rep talking point.

  8.  **Handoff Point: Strategic Bargaining Implications:** Based on 1-7, what are the KEY areas for union intervention?
      *   *Examples:* Ban public league tables (Q2). Demand ownership/control/veto over data logs (Q3, Q4b). Negotiate training for new skills (Q5b). Protect tacit knowledge holders (Q4c). Limit standardization that destroys craft (Q5a). Demand share of productivity gains (Q7). Safeguards against future automation using captured data (Q3, Q4b).
      *   *Good Enough:* 2-3 concrete, prioritized demands derived directly from the analysis.
      *   *Stonewall:* Focus on most severe threats identified (usually data control, intensification, job security clauses).
      *   *Stop/Handoff:* **HANDOFF TO REPS.** This is the political/strategic decision on what to fight for, based on the technical assessment. The procedure provides the *basis* for demands.
      *   *Output:* Actionable bargaining agenda derived from Marxian analysis.

  **Procedure Output for Reps:**
  A simple template filled using the procedure:
  *   **Tech:** [Name/Purpose]
  *   **Biggest Threats:** (Based on Synth 6 & 7) E.g., "Turns coders into AI supervisors while capturing their knowledge for replacement," "Uses public shaming to intensify work pace," "Logs engineer judgements to build future automation."
  *   **How Workers Lose Control:** (Key points from Q2, Q3, Q4, Q5) E.g., "Dictates workflow," "Logs all overrides," "Simplifies tasks, making experience less valuable."
  *   **Employer's Real Gain:** (Q7) E.g., "Same pay for more intense work," "Capturing skilled knowledge to reduce future wage costs," "Making workers easier to replace."
  *   **Key Bargaining Demands:** (From Q8 Handoff) E.g., "Ban league tables," "Worker ownership of diagnostic logs," "Guaranteed training & pay premium for new AI oversight skills," "Job security clause for 5 years."

  ---

  **Application to Your Cases:**

  1.  **Handheld Scanner + Pick-Rate Monitor & League Table:**
      *   Q1: Increase pick rates, "efficiency".
      *   Q2: **YES** (Dictates route/pace, constant monitoring).
      *   Q3: **YES** (Logs times, routes, errors - potential to optimize against workers).
      *   Q4: Residue (e.g., handling damaged goods)? Minimal & likely codified (logged exceptions). Tacit? Very little.
      *   Q5: **a) YES** (Highly standardized), **b) NO** (Reduces skill?), **c) WIDENS** (Easier to train replacements). Gradient Steepens Negatively.
      *   Q6: **REAL SUBSUMPTION** (Process revolutionized, worker controlled by machine logic).
      *   Q7: **INTENSIFICATION** (Speed-up via pressure/shame) & **DESKILLING** (Reduced need for experience/navigation skill).
      *   Q8: **BAN PUBLIC LEAGUE TABLES** (Immediate harm), Demand anonymized/aggregated feedback only, Negotiate safe rates/minimum scan times, Limit data use for discipline. **HANDOFF.**
      *   *Rep Output:* "Turns warehouse work into a high-pressure assembly line driven by public shaming. Gains come from squeezing more work per hour, not efficiency. Fight the league table and control the speed."

  2.  **AI Clinical Coding "Augmentation" (Human Sign-off):**
      *   Q1: Reduce errors, speed up coding, "augment" coders.
      *   Q2: **POTENTIALLY** (If AI dictates options/flow, rushes decisions). Likely indirect pacing.
      *   Q3: **YES, CRITICAL** (Logs *every* code the AI suggests AND the human's acceptance/rejection/override. Goldmine for training next version).
      *   Q4: Residue = **Judging AI suggestions, overrides, complex cases**. **Residue is HIGHLY CODIFIED** (Every click is logged). Tacit? Some complex judgement, but logs provide context for ML.
      *   Q5: **a) YES** (AI standardizes suggestions), **b) YES?** (New skill: AI oversight/evaluation), **c) NARROWS?** (Initially - need medical knowledge + AI skill) **BUT LONG-TERM: WIDENS** (If AI handles more, oversight becomes simpler/standardized). Gradient Flattens Initially then Steepens Negatively.
      *   Q6: **FORMAL (Transitioning to REAL)**. Process *appears* similar (coder assigns code) but *knowledge capture* is central. Human is *training and validating* the system that aims to replace their core skill. Real subsumption is the trajectory.
      *   Q7: **KNOWLEDGE APPROPRIATION** (Capturing coder expertise to automate) & potential **DESKILLING** (Coders become validators, losing deep coding skill). Future Relative S.V. gain via cheaper labour (validators vs coders).
      *   Q8: **DEMAND WORKER OWNERSHIP/CONTROL OF TRAINING DATA.** Negotiate: Guaranteed job security for current coders, Premium pay for AI oversight role & training contribution, Veto on full automation, Transparency on AI performance/errors. **HANDOFF.** (This *is* the bite: exposing "augmentation" as transitional capture).
      *   *Rep Output:* "The 'augmentation' is a Trojan horse. Every click trains the AI that aims to replace deep coding skills. Coders become trainers for their own potential replacements. Demand control over the data and guarantees for the future."

  3.  **Predictive Maintenance Diagnostics (Rail Engineers):**
      *   Q1: Reduce paperwork, predict failures, optimize maintenance.
      *   Q2: **NO** (Tool assists diagnosis, doesn't dictate actions *yet*).
      *   Q3: **YES, CRITICAL** (Logs all diagnostic inputs, sensor readings, engineer's final diagnosis/confidence, repair actions & outcomes. Core for ML improvement).
      *   Q4: Residue = **Diagnostic judgement, interpreting sensor data, contextual decisions**. **Residue is HIGHLY CODIFIED** (All inputs & conclusions logged). Tacit? Some experiential intuition, but logs capture vast context.
      *   Q5: **a) YES?** (Standardizes data collection/reporting), **b) YES** (Need skill to use/interpret tool), **c) NARROWS?** (Requires engineering + tech skill). **LONG-TERM: RISK OF WIDENING** (If AI diagnosis becomes reliable, less skilled staff could use it). Gradient could steepen negatively later.
      *   Q6: **FORMAL (but HIGH Real Subsumption RISK)**. Immediate benefit (kills paperwork) masks massive knowledge capture for future automation/standardization.
      *   Q7: **KNOWLEDGE APPROPRIATION** (Capturing diagnostic expertise) & potential future **DESKILLING/REPLACEMENT** (If AI handles diagnosis, engineers become implementers). Productivity gain (faster diagnosis) currently benefits engineers (less paperwork) but knowledge is being appropriated.
      *   Q8: **DEMAND WORKER OWNERSHIP/CONTROL OF DIAGNOSTIC DATA & ALGORITHMS.** Negotiate: Engineers lead tool development/validation, Premium for data contribution/knowledge capture, Job security guarantees, Veto on using data for automated diagnosis without engineer control. **HANDOFF.**
      *   *Rep Output:* "The tool is helpful now by cutting paperwork, but it's silently logging every expert judgement to build the AI that could one day do the diagnosis itself. Lock down control of that data and knowledge now."

  ---

  **Where it Misfires & Concept Critique:**

  1.  **Non-Profit/Public Sector:**
      *   *Problem:* Marx's core drive (relative surplus value for profit) is absent or altered. Motivations may be budget cuts, political pressure, or public "efficiency."
      *   *Adaptation:* Focus heavily on **Q7 (Mechanism)**. Is it about doing more with less (staff)? Intensification? Standardization for managerial control? Knowledge capture for centralization/outsourcing? The *labour process transformation* analysis (Q2-Q6) still applies. The *bargaining demands* (Q8) shift focus (e.g., against workload increases, for service quality protection).

  2.  **Co-ops/Worker-Owned:**
      *   *Problem:* Workers *appropriate* the "general intellect" and productivity gains. Subsumption logic (capital dominating labour) breaks down.
      *   *Adaptation:* The procedure can still analyze *how* the tech transforms work (Q2-Q6). **Q4 (Discretionary Residue)** and **Q5 (Replaceability Gradient)** remain crucial for *designing* good work. **Q3 (Knowledge Capture)** becomes about collective ownership/benefit. **Q8 Handoff** is about democratic tech governance. The core *threat assessment* diminishes; it becomes a *design assessment* using the same framework.

  3.  **"Zombie Tech" (Announced, Not Used):**
      *   *Problem:* No actual labour process impact.
      *   *Adaptation:* Procedure identifies *potential* threats based on design/vendor claims (esp. Q2, Q3, Q5). **Output flags the *intent* and potential risks** if activated. Bargaining demand (Q8) could be "No implementation without full union review using this assessment."

  4.  **Divergent Impact (Upskills One, Disciplines Another):**
      *   *Problem:* The procedure assesses the tech's impact on *a specific labour process/job role*. It's not designed for cross-role analysis in one go.
      *   *Adaptation:* **Run the MLPTA separately for each distinct job role/grade significantly impacted.** Compare the outputs. Q8 Handoff must synthesize divergent impacts (e.g., "Fight for the upskilled grade to control the system disciplining the other grade").

  5.  **Concept Critique:**
      *   **Discretionary Residue:** Survives well. Q3 & Q4 operationalize it effectively. Crucial for exposing the capture of knowledge even in "augmented" or "skilled" work. Highlights the dynamic vulnerability of autonomy.
      *   **Replaceability Gradient:** Needs careful handling. The concept is sound (Q5), but "gradient" implies a smooth, predictable slope. Reality is often lumpy (sudden automation jumps). The procedure focuses on *direction* and *key drivers* (standardization, knowledge capture, skill change) rather than precise prediction. It avoids being "too crude" by incorporating potential upskilling (Q5b) and initial narrowing. **It survives as a checklist component by focusing on identifiable *factors influencing* replaceability, not predicting the rate.**

  **In Summary:** This MLPTA provides a concrete, sequential, Marxian procedure to cut through vendor hype and job-count myopia. It focuses relentlessly on shifts in control, knowledge, and the organization of work itself. It forces confrontation with the extractive logic beneath "augmentation" and provides actionable hooks for bargaining, grounded in the concepts you specified. Its limitations highlight where the capitalist labour process assumptions break down, requiring contextual adaptation by the assessor and the reps at the handoff point. Your concepts are integral and operationalized effectively.
