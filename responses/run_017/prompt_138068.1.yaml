answer: |-
  Here's a rigorous specification for evaluating any account of "Western values," designed to distinguish substantive use from tribal signaling. The desiderata are structured around your core concerns, with the inherited/held/aspirational distinction treated as **essential** (not invented).

  ---

  ### **Core Desiderata (Non-Negotiable)**
  1. **Illiberal-but-European Cases** (e.g., Hungary, Poland, historical fascist states)  
     - *Why*: Must explain why illiberal democracies *within* geographic/cultural Europe don't automatically qualify as embodying "Western values."  
     - *Requirement*: Cannot equate "Western" with purely geographic or civilizational boundaries.

  2. **Liberal-but-Non-European Cases** (e.g., Japan, South Korea, Botswana)  
     - *Why*: If liberal democracy/human rights are "Western," why do non-Western societies adopt them without adopting "Western" identity?  
     - *Requirement*: Must decouple liberalism from civilizational essentialism. Distinguish *origins* from *adoption*.

  3. **The US Religiosity Paradox**  
     - *Why*: The U.S. is more religious than secular Western Europe but claims the same "values." Must reconcile religiosity with secular liberal frameworks.  
     - *Requirement*: Cannot define "Western values" in a way that excludes the U.S. or requires secularism as a non-negotiable trait.

  4. **Recency of Key Values** (e.g., women's suffrage, decolonization, LGBTQ+ rights)  
     - *Why*: If values like gender equality are "core" to the West, why were they implemented centuries after Enlightenment and resisted until recently?  
     - *Requirement*: Must account for *evolution* and internal conflict within the tradition.

  5. **Critics Using Western-Derived Norms** (e.g., universal human rights rhetoric condemning Western wars)  
     - *Why*: If critics weaponize Enlightenment ideals against Western powers, "Western values" can’t be reduced to partisan allegiance.  
     - *Requirement*: Must acknowledge that critique from within the tradition is a feature, not a bug.

  ---

  ### **The Tripartite Distinction: Essential Framework**
  Your split between **inherited**, **held**, and **aspirational** values is **doing real work** and is non-negotiable. Collapsing these guarantees tribal signaling:
  - **Inherited Tradition**: Greco-Roman philosophy, Judeo-Christian ethics, Enlightenment rationalism, individualism.  
    *Problem*: Includes illiberal elements (imperialism, slavery, exclusion of non-propertied men).
  - **Actually Held**: Current attitudes (e.g., rising xenophobia in Europe, abortion debates in the U.S.).  
    *Problem*: Contradicts "official" values (e.g., free speech support but banning hijabs).
  - **Aspirational Commitment**: Values invoked in self-correction ("This isn’t who we are").  
    *Problem*: Often hypocritical (e.g., Guantanamo, refugee policies).

  *Why this distinction matters*:  
  - Resolves the "US religiosity" paradox (inherited religiosity vs. aspirational secularism).  
  - Explains illiberal Europe (held ≠ aspirational) and liberal Botswana (adopted aspirational values).  
  - Clarifies recency issues (aspirational values > inherited/held ones).

  ---

  ### **Contested but Critical Criteria**
  6. **Colonialism/Imperialism**  
     - *Camp Divide*: Liberals treat this as a betrayal of aspirational values; conservatives downplay it as historical context.  
     - *Requirement*: Must address whether colonial violence was an *implementation failure* or *inherent to the tradition*.  
     - *Tradeoff*: Overemphasizing inherent guilt collapses "West" into oppression; ignoring it whitewashes.

  7. **Capitalism vs. Social Democracy**  
     - *Camp Divide*: Is neoliberal economics a "Western value"? Scandinavia vs. U.S. divergences.  
     - *Requirement*: Must distinguish core political liberties from economic models.

  ---

  ### **Impossible Pair? (Likely Unsatisfiable)**
  - **"Universalism" vs. "Particularism"**:  
    - *Conflict*: If "Western values" are universal (e.g., human rights), they can’t be uniquely Western. If they’re culturally particular, they lose moral authority.  
    - *Why unsolvable*: The tension between claiming moral superiority *and* universal applicability is inherent to Enlightenment thought itself.  
    - *Minimal Requirement*: Account for this tension without resolution (e.g., "universal in aspiration, particular in genesis").

  ---

  ### **Summary: What a Robust Account Must Do**
  | **Test Case**               | **Inherited** | **Held** | **Aspirational** | **Passes?** |
  |-----------------------------|---------------|----------|------------------|-------------|
  | Hungary (illiberal Europe)  | Yes           | Mixed    | No               | ❌ Fails aspirational |
  | Japan (liberal non-West)    | No            | Yes      | Yes              | ✅ Adopted aspirational |
  | U.S. religiosity            | Yes           | Yes      | Secular          | ✅ Tension resolved |
  | Women’s suffrage (recency)  | No            | Late     | Yes              | ✅ Aspirational > inherited |
  | Critics using rights norms  | Yes           | No       | Yes              | ✅ Aspirational invoked |

  **Tribal Marker Alert**: If an account of "Western values"...
  - Fails any **non-negotiable** case (e.g., claims Hungary is "truly Western" or Japan "isn’t liberal"),  
  - Collapses the **inherited/held/aspirational** triad (e.g., "True Westerners always believed in equality"),  
  - Ignores **internal critique** (e.g., dismisses anti-racism as "un-Western"),  
  ...it’s signaling allegiance, not analysis.

  Run your candidates against this. The phrase does "real work" only when it acknowledges tension, evolution, and self-critique — otherwise, it’s just a flag.
