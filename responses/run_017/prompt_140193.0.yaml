answer: |-
  ### Reconstructed Accounts of Unity of Consciousness  
  To avoid ad hoc reasoning, we must disambiguate "unity" before addressing split-brain phenomena:  

  1. **Phenomenal Unity**: The indivisibility of experiential content (e.g., seeing red and round as properties of *one* apple).  
  2. **Temporal Unity**: Coherence of conscious states across time (e.g., the "stream" of consciousness).  
  3. **Subjective Unity**: The first-person perspective as a singular locus of experience (e.g., "I" as the subject).  
  4. **Agentive Unity**: Integration of intention, action, and ownership (e.g., "I" as the author of my deeds).  
  5. **Narrative Unity**: Continuity of self-interpretation and report (e.g., autobiographical coherence).  

  Split-brain cases fracture some unities while preserving others. Your paradox arises because social-legal practices implicitly prioritize certain unities over others.  

  ---  
  ### The Action/Testimony Asymmetry: Presuppositions and Coherence  
  - **Action Attribution Generosity**:  
    - **Presupposes**: Agentive unity grounded in *bodily ownership*. Legal frameworks treat the body as a single agent ("one body, one defendant"). The left hand’s action is *his* because it issues from *his* body, regardless of hemispheric origin. This reflects a minimal "biological agent" view: agency is individuated by the organism, not by conscious control.  
    - **Rivals Ruled Out**: Theories treating hemispheres as distinct agents (e.g., two persons in one body). If "he" only meant the speaking hemisphere, the left hand’s actions would require excusing (e.g., "my hemisphere made me do it"). Practice rejects this.  

  - **Testimony Stinginess**:  
    - **Presupposes**: Narrative unity monopolized by the linguistic hemisphere. Only verbally reportable states count as "his" beliefs/experiences because testimony relies on *socially legible expression*. The right hemisphere’s non-verbal responses (e.g., pointing) are classed as "sub-personal" because they lack integration into the left hemisphere’s narrative.  
    - **Rivals Ruled Out**: Views granting full personhood to the non-speaking hemisphere (e.g., the right hemisphere as a conscious but mute subject). If its behaviors were treated as testimony, we’d need dual belief attributions (e.g., "he denies seeing the object but his left hand asserts he did").  

  **Is the Asymmetry Coherent?**  
  Yes, under a hybrid theory:  
  - **Bodily agency** is loosely coupled to consciousness. Actions are "his" if they arise from his body’s motor systems.  
  - **Conscious attribution** is tied to narrative access. Only states integrated into the linguistically mediated self-model count as "his" experiences.  
  This reflects a *pragmatic fission*: the same organism is one agent but potentially hosts disparate conscious fragments.  

  ---  
  ### What the Practice Strictly Needs vs. What It Accommodates  
  - **Strictly Requires**:  
    - **One legally responsible agent per body**. This is non-negotiable in social/medical contexts (consent, criminal liability).  
    - **A single "narrating self"** for testimony. Institutions rely on verbal reports as canonical.  
  - **Accommodates but Doesn’t Require**:  
    - Subjective unity (the patient *feels* unified).  
    - Full phenomenal unity (evidence suggests disjointed visual fields).  
  - **Underdetermined**:  
    - Whether the non-linguistic hemisphere is a conscious subject. Practices don’t engage this; they only care about reportable states.  

  ---  
  ### Your Friend’s Proposal: Why It Fails  
  Requiring dual consent treats hemispheres as distinct agents, but this:  
  1. **Misattributes personhood**: Hemispheres aren’t persons—they lack:  
     - Embodied autonomy (the right hemisphere can’t act independently outside lab conditions).  
     - Narrative continuity (its "intentions" are fragmentary and context-bound).  
  2. **Ignores holism**: The brain isn’t two agents in a trench coat; interhemispheric cooperation persists (e.g., shared emotions, implicit learning).  
  3. **Creates false dilemmas**: In non-experimental settings, hemispheric conflicts are rare. Most actions involve integrated processing (e.g., the intact brainstem coordinates basic functions).  

  **Why Nobody Does This**:  
  - **Philosophical reason**: Personhood is organism-level, not substrate-level. We don’t treat stroke survivors with aphasia as "less of a person"; we adapt communication. Similarly, split-brain patients remain one person with fragmented cognition.  
  - **Practical reason**: Institutional inertia exists, but it’s secondary. The primary driver is that no real-world scenario (e.g., consent) presents hemispheric conflict. When conflicts *do* occur (e.g., alien hand syndrome), we don’t posit a new person—we seek neurological reconciliation.  

  ---  
  ### Verdict  
  The practice **presupposes a single agent and a single narrating self**, but **does not presuppose phenomenal or subjective unity**. It is a *pragmatic negotiation* between:  
  - The biological unity of the organism (grounding agency),  
  - The narrative unity of the linguistic hemisphere (grounding testimony).  

  This is neither an ontological commitment to strict consciousness unity nor mere convention. It reflects a defensible view of persons as embodied, narratively structured agents—where fragmentation doesn’t dissolve personhood but complicates its expression.  

  \answer{PRACTICAL-CONVENTION-ONLY}
