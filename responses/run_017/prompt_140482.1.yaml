prompt: |-
  I'm writing a novel set in an isolated valley, and I've painted myself into a corner. Two villages on opposite rims of a gorge; a fever a generation before the book opens left most of the lower village deaf, so the two sides run everything through a code of mirrored shutters that everyone on both sides was born into. Nobody agreed to it, nobody remembers it starting, and a big part of the book is about which of their shared practices have any grip on them. I keep wanting to narrate that some practice is a convention and others aren't — a habit, a rule somebody enforces, a thing they do because they think it's right — and I realized I don't have a spec for what that claim is supposed to buy. My writing group says just use the Lewis-style thing, a regularity everyone conforms to, expects the others to conform to, and prefers to conform to given that the others do, but that feels like it decides my cases by fiat before I know which cases matter.

  So: write me the requirements list. What does an account of convention have to deliver for me to call the practices in my valley by that name — which cases it has to sort correctly, which distinctions it can't collapse (convention vs mere regularity, vs a command backed by force, vs a norm people enforce, vs something they'd do anyway for independent reasons), which bits of the story it has to be able to accommodate, with the case behind each requirement. The cases I actually need handled: the mirror code itself, where a second, equally workable code existed and this one just won; the ledge lamps, where a stubborn tenth never light them, everybody knows it, and the system runs fine anyway; the water-turn rule, where the two villages' interests genuinely conflict and one of them is getting the worse deal; the black doors, where every household keeps its door painted black because each believes the others would sanction any other color, though in fact nobody cares and nobody has ever enforced it; the left-hand ledge, the only passable one, which everyone walks on and where there was never any alternative worth coordinating around; the dawn bell, which everybody hates and everybody still keeps; and the herders and their dogs, who time their movements around each other down to the minute, with only one side having anything like expectations about the other's expectations. Tell me too whether how a practice got started belongs in the test or only how it's kept going, since I have a chapter where the code shifts over one winter without anyone deciding anything.

  Mark which requirements are non-negotiable and which are just the taste of one camp, and flag any pair you think can't be jointly satisfied — that's the part I most want, because if the list is impossible I'd rather know now. One purpose-of-the-theory thing specific to me: I want a test a reader could in principle apply from what's on the page, from behavior and what people say out loud, without access to anyone's real preferences or to whether they all truly know what the others know. Say whether that observability condition is a genuine desideratum or my own novelist's prejudice, and if it's genuine, what it costs — I suspect it collides head-on with the bit about conditional preferences. Then tell me which single requirement knocks out the most candidates. A short scorecard at the end: how Lewis's own regularity-and-expectations account does, how the accounts that build sanctioning into the definition do, and how the evolutionary or reinforcement-style pictures that don't ask for beliefs at all do. Keep the weight on the criteria, the scorecard can be a few lines.
reasoning: |-
  Okay, the user is writing a novel set in an isolated valley with two villages separated by a gorge. After a fever left most of the lower village deaf, they developed a communication system using mirrored shutters. The user is struggling to define what constitutes a "convention" versus other types of practices in their world. They need a clear set of requirements to distinguish between different social practices like habits, enforced rules, norms, etc.

  First, I need to break down the key elements from the user's query. They listed several practices in their valley: the mirror code, ledge lamps, water-turn rule, black doors, left-hand ledge, dawn bell, and herders with dogs. Each represents a different social dynamic. The challenge is to create criteria that can classify these accurately based on observable behavior without accessing internal states.

  The user wants a requirements list that addresses observability. That's crucial because, as a novelist, they can only show external actions and dialogue, not internal thoughts. So the criteria must rely on what characters do and say publicly. But this might clash with conditional preferences, which are internal. How to handle that?

  Looking at the practices: the mirror code requires coordination; ledge lamps show optionality; water-turn involves conflict; black doors highlight false beliefs; left-hand ledge is necessity-driven; dawn bell is inertia; herders involve asymmetric expectations. Each tests different facets of convention.

  Key distinctions needed: convention vs. regularity (no expectation), vs. command (force), vs. norm (sanctions), vs. independent reasons (no coordination needed). The account must handle how practices start versus how they're maintained. The user mentioned a chapter where the code shifts without decisions, so history vs. current maintenance matters.

  Observability is tricky. For example, the black doors practice relies on false beliefs about sanctions. If the characters never voice these beliefs, how can readers infer? The user might need to imply through dialogue or behavior, but strict observability could be limiting. Perhaps the requirement should be that evidence must be inferable from observable actions, not that all factors are directly visible.

  Non-negotiable requirements: Coordination requirement (for conventions like the mirror code), General conformity (everyone follows it), and Mutual expectations (beliefs about others' actions). Without these, it's not a convention. Optionality might be negotiable but important for distinguishing from necessities like the left-hand ledge.

  The case of black doors challenges the sanctioning requirement. If sanctions are part of the definition, black doors wouldn't fit, but the user wants it as a false belief case. So sanctioning shouldn't be necessary. Instead, the belief in sanctions might suffice, but observability of that belief is key.

  The dawn bell requires aversion but continued conformity. This tests whether preference for conformity given others' actions is necessary. Lewis includes this, but if everyone hates it yet conforms due to expectation, is it still a convention? Maybe the requirement should be conditional preference OR aversion to deviating alone. That allows for cases where people conform reluctantly.

  For the herders and dogs, asymmetric expectations (only one side has higher-order beliefs) challenge mutual knowledge. A weaker requirement like mutual belief might work, allowing for varying levels of understanding.

  History vs. maintenance: The user's shifting code without decision needs current expectations to drive conformity, not origins. So the criteria should focus on sustaining mechanisms, not origins.

  Conflicting requirements: Observability vs. conditional preferences. Preferences are internal, so the user might need to imply them through characters' complaints (like the dawn bell) or actions. However, if conditional preferences are necessary, the dawn bell case might not fit if no one prefers it. Solution: define conditional preference as willingness to conform if others do, even if they dislike the practice itself.

  Scorecard: Lewis's theory handles the mirror code, left-hand ledge (if alternatives exist), but fails black doors (no actual sanctions), dawn bell (if no preference), herders (if asymmetric). Sanction-based theories fail ledge lamps (no enforcement) and black doors (false sanctions). Evolutionary theories might handle the shift without decisions but struggle with intentional aspects like the water-turn rule's conflict.

  In conclusion, the core requirements are Coordination, Conformity, Mutual Expectations, Optionality (in alternatives), and Conditional Preference (broadly defined). Observability is a valid constraint but requires careful handling through implicit evidence. The hardest case is the dawn bell, testing whether conditional preference is essential. If included, it must be observable via behavior indicating reluctance but continued compliance.
answer: |-
  Here's a requirements list for your "convention" concept, built around your cases and needs. I'll flag non-negotiables (NN), taste-based (T), potential conflicts, observability, and the scorecard at the end.

  **Core Requirements for "Convention" in the Valley:**

  1.  **Coordination Requirement (NN):** The practice must solve a coordination problem. There must have been (or be perceived to be) multiple *possible* stable equilibria (ways things could work) where coordination is beneficial, and the current practice is one of them.
      *   *Case Rationale:* Essential for the **Mirror Code** (another code existed). Explains *why* coordination emerged. Rules out **Left-Hand Ledge** (no viable alternative, coordination unnecessary – it's done for independent, practical reasons). Distinguishes from habits or things done purely for independent reasons.

  2.  **General Conformity (NN):** Almost everyone in the relevant group(s) actually follows the practice most of the time.
      *   *Case Rationale:* Baseline for any social regularity. Needed for **Mirror Code**, **Water-Turn**, **Dawn Bell**, **Left-Hand Ledge**, **Herders/Dogs**. **Ledge Lamps** show conformity isn't *universal* but is still general.

  3.  **Mutual Expectations (NN with Caveat):** Individuals conform *because* they expect others in the relevant group(s) to conform. They believe others follow the practice.
      *   *Caveat/Observability:* "Expectation" here must be inferable from behavior or explicit statements. E.g., people grumble about the **Dawn Bell** but still ring/respond because they *say* things like "Well, they'll ring it anyway" or meticulously set their alarms. For **Black Doors**, people *say* they fear sanction or express belief others care.
      *   *Case Rationale:* Key to distinguishing convention from mere habit or independent reason (**Left-Hand Ledge**). Explains conformity in **Mirror Code**, **Water-Turn**, **Dawn Bell** (even if hated), **Black Doors** (false belief in sanction). **Ledge Lamps** might show *reliance* without *universal expectation* (the 10% non-conformists are known).

  4.  **Conditional Preference for Conformity (T - Highly Recommended, NN for some accounts):** Individuals prefer to conform *conditional* on the expectation that others will conform. They conform *because* others do, not *solely* because they think it's morally right or intrinsically best *regardless* of others' actions.
      *   *Observability Conflict (Serious):* This is the hardest. True preferences are internal. Observers (reader/characters) can infer from:
          *   Complaints about the practice itself (**Dawn Bell** - "I hate this bell, but...").
          *   Expressions of why they conform ("If I didn't light the lamp, others might not see and the system would fail" - **Ledge Lamps** believer vs. the 10% who say "Why bother?").
          *   *Failure* to change the practice despite dislike (**Dawn Bell**).
          *   Shifting behavior if expectations shift (your winter code shift).
      *   *Case Rationale:* Distinguishes convention from:
          *   Moral Norms: If someone lights **Ledge Lamps** because they believe it's *righteous*, regardless of others, it's not convention.
          *   Independent Reason: **Left-Hand Ledge** is done because the right-hand is unsafe, period.
          *   Coercion: If they follow the **Water-Turn** only due to direct threat, not conditional preference.
      *   *Handling Aversion:* **Dawn Bell** tests this. People conform *despite* hating the *content* of the practice. But they likely have a *conditional preference to avoid the chaos/disadvantage of being out of sync* (e.g., missing work, social censure for *not* conforming when others do). This aversion to *non-conformity given others' conformity* is the key conditional preference. It doesn't mean they like the bell.
      *   *Optionality Link:* Conditional preference often arises *because* alternatives existed/are conceivable (Coordination Requirement).

  5.  **Optionality (Arbitrariness) (T - Important for your theme):** The specific form of the practice is not uniquely determined by external facts, efficiency, or morality. A different, roughly equally good (or bad) alternative *could* have worked, or is conceivable.
      *   *Case Rationale:* Core to **Mirror Code**. Explains **Black Doors** (another color would do). Contrasts with **Left-Hand Ledge** (no alternative). **Ledge Lamps** show optionality *within* the system (lighting is optional for some). **Dawn Bell** has optionality (a different signal could work). **Water-Turn** *might* have optionality (other schedules conceivable), though the conflict complicates perceived "goodness".

  6.  **No Essential Reliance on Centralized Enforcement or Sanction (NN):** Conformity is not primarily driven by the threat of punishment from a specific authority or organized group enforcing *this specific rule*. Fear of *general social friction* or *practical failure* is different.
      *   *Case Rationale:* Distinguishes convention from Command (**Water-Turn** *might* blur if one village actively threatens). Vital for **Ledge Lamps** (no enforcement, non-conformity tolerated). **Black Doors** hinges on *fear* of sanction, but crucially, that fear is *mistaken* – actual organized sanction isn't happening. Convention can exist *alongside* sanction, but sanction shouldn't be the *defining* engine.

  7.  **Accommodate Asymmetric Knowledge/Beliefs (NN for your case):** The account must allow for cases where the depth of mutual understanding varies. Not everyone needs "I know that you know that I know..." ad infinitum.
      *   *Case Rationale:* **Herders/Dogs.** One side coordinates based on simple expectation ("The dogs will be there at noon"), the other might have more complex expectations ("They expect us to be gone by noon"). The basic mutual expectation (Level 1: "They will do X") is sufficient for coordination. Higher-order beliefs (Level 2: "They expect us to do Y") can be present asymmetrically or not at all universally.

  8.  **Focus on Sustaining Mechanism, Not Origin (NN for your story):** The definition should explain why the practice *persists now*, not necessarily how it started. The mechanism keeping it going (expectations, conditional preference) must be present *currently*.
      *   *Case Rationale:* Your winter code shift. The *new* pattern becomes a convention once the sustaining mechanism (expectations + conditional preference) locks in, regardless of how the shift occurred without conscious decision. The origin is historical backstory, not definitional.

  **Conflict Alerts:**

  *   **Observability vs. Conditional Preference:** This is the major head-on collision. Verifying true conditional preferences requires access to internal states or very specific, unambiguous dialogue/behavior. You *can* imply it strongly through context (e.g., universal grumbling about **Dawn Bell** + continued conformity + lack of alternatives being seriously proposed *because* "it's what we do"). However, a strict behaviorist might argue you can't *prove* it's not habit or fear. **Cost:** You might need to rely on characters explicitly stating their conditional reasoning or showing clear behavioral shifts when expectations change to satisfy observability for this requirement. It weakens the strictness of the conditional preference requirement within an observable framework.
  *   **Conditional Preference (NN for some) vs. Aversion/Persistence (Dawn Bell):** Can a convention persist if *nobody* has a conditional *preference* for it, only a conditional *aversion to deviating alone* because it's pointless or slightly costly? Most accounts (Lewis included) would say the aversion *is* a form of conditional preference (preferring conformity over pointless deviation). This is likely resolvable by broadly interpreting "preference" as "reason to act" given expectations.

  **The Knockout Requirement:** **Conditional Preference for Conformity** (Requirement 4) is likely the most demanding and disqualifies the most simplistic accounts. It rules out:
  *   Mere regularities (**Left-Hand Ledge** if seen as necessary).
  *   Habits done purely individually.
  *   Norms followed solely due to intrinsic moral belief.
  *   Practices followed only due to direct coercion/force.

  **Scorecard:**

  1.  **Lewis (Regularity + Expectations + Conditional Preference + Arbitrariness):**
      *   **Handles Well:** Mirror Code (core case), Left-Hand Ledge (if alternatives conceivable - arguable), Dawn Bell (if conditional aversion counts), Black Doors (if fear of sanction motivates conditional conformity).
      *   **Struggles With:** Ledge Lamps (non-universal conformity & expectations? Lewis typically assumes near-universality). Water-Turn (Conflict muddies "preference" and arbitrariness). Herders/Dogs (Asymmetric higher-order beliefs are messy in standard mutual knowledge models). **Black Doors** (Sanction fear is a motive, but Lewis doesn't require sanctions, just conditional preference).
      *   **Fails Observability?** Yes, on Conditional Preference.

  2.  **Sanction-Based Accounts (Convention = Norm + Enforcement):**
      *   **Handles Well:** Water-Turn (if conflict involves enforcement/threat).
      *   **Struggles With:** Ledge Lamps (No enforcement, non-conformity ok). Black Doors (False belief in sanction, no actual enforcement). Mirror Code (Enforcement unlikely core mechanism). Dawn Bell (No enforcer mentioned). Left-Hand Ledge (No need). Herders/Dogs (Coordination, not sanction).
      *   **Fails:** Ledge Lamps, Black Doors (as defined), arguably most cases. **Too narrow.**

  3.  **Evolutionary/Reinforcement (No Beliefs, Just Reinforcement History):**
      *   **Handles Well:** Mirror Code, Left-Hand Ledge (if seen as reinforced), Ledge Lamps (variation tolerated), Dawn Bell (persistence through inertia), your winter code shift (change via variation/selection).
      *   **Struggles With:** Black Doors (Requires *belief* in sanction, not just past reinforcement). Water-Turn (Conflict dynamics suggest strategic interaction, not just reinforcement). Herders/Dogs (Asymmetry suggests cognitive expectations beyond reinforcement).
      *   **Fails:** Capturing the *intentional*, expectation-based reason *why* people conform *now*. Explains persistence but not the specific cognitive mechanism driving individual action. **Misses the "grip" aspect central to your theme.**

  **Summary for Your Valley:**

  *   **Conventions (Mirror Code, Ledge Lamps [for conformists], Dawn Bell, Black Doors):** Solve coordination problems via general conformity driven by mutual expectations and conditional preference/aversion (avoiding chaos/disadvantage of non-conformity given others' conformity). Arbitrary alternatives exist/are conceivable. No central enforcer needed.
  *   **Not Conventions:**
      *   **Left-Hand Ledge:** No coordination problem/alternatives (Independent Reason/Habit/Necessity).
      *   **Water-Turn:** Coordination exists, but conflict of interest and potential coercion/threat push it towards negotiated agreement/coercion, not pure convention (though convention *elements* might exist).
      *   **Herders/Dogs:** Coordination exists, but asymmetric expectations make it a borderline case or a simpler form of coordination based primarily on mutual expectation (Level 1), fitting a looser definition. It *could* be a convention if the asymmetry isn't seen as fatal to basic mutual expectation.
      *   **Ledge Lamps Non-Conformists:** Their behavior is not conventional; they act on independent reason or indifference.

  **Recommendation:** Use a **Lewis-core framework** (Requirements 1, 2, 3, 4 broadly interpreted, 5, 6) as your baseline. Acknowledge the **observability challenge for conditional preference** by showing characters *expressing* their reasoning or reluctance explicitly (**Dawn Bell** griping, **Black Doors** expressing fear, **Ledge Lamp** conformists explaining why they bother). Treat **Herders/Dogs** as a successful coordination based on mutual expectation, even if asymmetric. Treat **Water-Turn** as a distinct type of negotiated/coerced rule. This gives you the conceptual tools to explore the "grip" you want while accommodating your specific cases within observable limits. Your winter shift chapter perfectly illustrates convention *emergence* via the locking-in of expectations and conditional responses.
