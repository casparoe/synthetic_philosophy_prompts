  Hmm, the core tension here is between philosophical precision and administrative practicality. They need something rigorous enough to handle hard cases (those three recurring scenarios suggest real institutional pain points) but simple enough for junior caseworkers. The written appeal requirement means every branch point must be legally defensible.

  First, let's unpack their two central questions. For "who is a refugee," the sticking points are: 1) whether systemic harm without specific persecutor qualifies, 2) how to handle state collapse scenarios, and 3) circular social group definitions. The 1951 Convention's "persecution" requirement is being stretched here - interesting they're confronting exactly where treaty language meets contemporary crises.

  For "which state," they're essentially asking for a hierarchy of responsibility principles. This is trickier because there's no international consensus - I'll need to balance legal pragmatism (first arrival usually controls) with ethical considerations (capacity, ties). The colonial ties mention suggests they're dealing with post-colonial migration patterns.

  The case studies are perfectly chosen stress tests: climate displacement, secondary movement, and non-state actor persecution. That journalist case in particular highlights the tension between procedural fairness ("we'd prefer to return her" implies burden-sharing concerns) and individual rights. 

  Biggest challenge will be creating off-ramps where values disputes begin - like determining what counts as "sufficient protection" in transit countries. Also need clear escalation triggers when cases hit theoretical gray areas (e.g., whether disbanded militia constitutes ongoing threat). 

  For the procedure itself: I'll start with a triage tree for refugee status (agent identification → protection analysis → nexus) before responsibility allocation. Key innovations: 1) treating "agent of harm" as spectrum rather than binary, 2) separating persecution analysis from protection analysis, 3) creating a "non-agent-based claim" category for environmental cases. 

  On responsibility, I'll prioritize presence first (legal necessity), then make ties/capacity tie-breakers only - controversial but avoids incentivizing "asylum shopping." The colonial factor gets relegated to last-resort consideration given its explosive political implications.

  For the farmer case: refugee status hinges entirely on whether protection vacuum = persecution substitute. I'll say yes with upward referral. Responsibility falls to first-entry state despite capacity arguments - hard line but legally sound. 

  Journalist case shows where the system chafes: clear refugee status but responsibility allocation feels unjust. Procedure will assign to current state due to presence + ties, though morally dubious. Perfect example of where values dispute emerges (burden-sharing fairness).

  Teenager case demonstrates temporal uncertainty in RSD. Key move: treat "disbanded" as rebuttable presumption of safety, requiring country condition update. Responsibility straightforward due to presence.

  Finally, the limits: no procedure can resolve evidence gaps (credibility calls always subjective) or macro-level ethical dilemmas (open borders). Biggest theoretical landmine: whether states can externalize obligations via "safe third country" deals. 

