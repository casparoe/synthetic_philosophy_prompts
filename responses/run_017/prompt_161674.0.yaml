answer: |-
  Here is a synthesized, procedural decision framework designed for efficiency, defensibility, and handling of hard cases. It prioritizes **factual thresholds** before escalating *values-based* disputes. The procedure assumes access to standard evidence (documents, interviews, COI).

  ---

  ### **Refugee Status Determination (RSD) Procedure**
  **Question 1: Does the claimant qualify as a refugee?**  
  *(Sequential steps; stop if "no" at any point)*

  1. **Agent of Harm Identification**  
     - *Ask:* "Is there an identifiable actor (state/non-state) inflicting serious harm?"  
     - *Sufficient Answer:* Named individual/group + description of acts (threats, violence, sanctions).  
     - *Hard Case Handling:*  
       - **Generalized violence:** Proceed if claimant shows *individualized risk* (e.g., profession, ethnicity, prior victimization). If no targeting, **NO**.  
       - **Environmental collapse/state withdrawal:** **Escalate upward** (values dispute: "persecution by omission" vs. non-Convention harm).  
       - **Circular social group:** Accept only if group exists *independently of the harm* (e.g., "landless farmers," not "people threatened by X").  
     - *Outcome:* If no agent and not a protection vacuum case → **NO**.

  2. **Failure of State Protection**  
     - *Ask:* "Would the state (or controlling actor) in the home region protect the claimant?"  
     - *Sufficient Answer:* Evidence of state incapacity (e.g., abandoned territory, documented impunity) or complicity (e.g., police refusal).  
     - *Threshold:* Protection must be *effectively unavailable* — not merely inadequate.  
     - *Outcome:* If protection is available → **NO**. If agent is non-state and protection exists → **NO**.

  3. **Well-Founded Fear**  
     - *Ask:* "Is the fear credible, future-oriented, and probable (not speculative)?"  
     - *Sufficient Answer:* Coherent testimony + COI corroborating risk dynamics.  
     - *Hard Case Handling (disbanded militia):* If threat dissolved (e.g., militia disbanded, commander dead), **NO**. If resurgence plausible (per COI), **YES** and escalate for legal review.  
     - *Outcome:* Subjective fear without objective basis → **NO**.

  4. **Nexus to Convention Ground**  
     - *Ask:* "Is the harm linked to race, religion, nationality, political opinion, or *non-circular* social group?"  
     - *Sufficient Answer:* Persecutor’s motive implied/expressed (e.g., targeted for journalism, ethnicity).  
     - *Outcome:* No nexus (e.g., purely economic hardship) → **NO**.  
     - *Final RSD Outcome:* If all steps satisfied → **REFUGEE STATUS CONFIRMED**. Escalate environmental collapse cases.

  ---

  ### **Responsibility Allocation Procedure**  
  **Question 2: Which state is responsible?**  
  *(Apply hierarchy; trumps > tie-breakers)*

  | Rank | Ground                  | Weight        | Notes                                                                 |
  |------|-------------------------|---------------|-----------------------------------------------------------------------|
  | 1    | **Physical Presence**   | **Trump**     | Claimant must be in territory. Non-negotiable.                        |
  | 2    | **First Safe Arrival**  | **Trump**     | State of initial entry after fleeing. Bypassed only if unsafe.        |
  | 3    | **Causal Contribution** | Tie-breaker   | E.g., state fueled conflict. Rarely provable; use only if unambiguous.|
  | 4    | **Absorptive Capacity** | Tie-breaker   | Overwhelming strain (e.g., >5% refugee/citizen ratio) *may* shift duty. |
  | 5    | **Ties (Family/Language)** | Tie-breaker | Primary ties (sibling) > secondary (short work stint).               |
  | 6    | **Colonial Links**      | Last resort   | Only if no other grounds apply (ethically/politically fraught).       |

  **Procedure:**  
  1. Assign to state of **current presence**.  
  2. If claimant transited safe third countries:  
     - Verify safety (stable asylum system, no refoulement).  
     - If safe, responsibility lies with **first safe country** of arrival.  
  3. If multiple states equally eligible, apply tie-breakers (3–6) in order.  

  ---

  ### **Case Applications**
  **Case 1: Delta Farmers (Environmental Collapse)**  
  - **RSD:**  
    - *Agent:* None identifiable → escalate (values dispute: is protection vacuum = persecution?).  
    - *Protection:* State withdrew → **escalate**.  
    - *Outcome:* No Convention ground → **REFUGEE STATUS DENIED** (unless escalated values decision overrides).  
  - **Responsibility:**  
    - First arrival (adjacent state) → **Responsible**, despite capacity strain (not overwhelming under 10%).  

  **Case 2: Journalist (Secondary Movement)**  
  - **RSD:**  
    - *Agent:* Named official + threats → **YES**.  
    - *Protection:* State complicit (if COI confirms impunity) → **YES**.  
    - *Nexus:* Political opinion → **YES**.  
  - **Responsibility:**  
    - Current state is *not* first safe country → **Responsibility lies with first transit state**. Family/work ties insufficient to trump.  

  **Case 3: Teenager (Disbanded Militia)**  
  - **RSD:**  
    - *Agent:* Commandant existed → **YES**.  
    - *Protection:* Verify if new state authority provides protection. If militia gone → **NO well-founded fear**.  
    - *Escalate:* If COI suggests militia may re-form → **YES** (upward referral).  
  - **Responsibility:**  
    - Present in your state → **Responsible** (first safe arrival).  

  ---

  ### **Limits of the Procedure**  
  **Cannot Be Run If:**  
  - Credibility indeterminable (e.g., inconsistent testimony, forged documents).  
  - Critical COI missing (e.g., no data on province stability).  
  - Claimant’s origin stateless/unknown.  

  **Cannot Settle (Values Disputes Requiring Escalation):**  
  1. **Protection Vacuum = Persecution?** (Environmental/state collapse cases).  
  2. **"Safe Third Country" Designation:** Whether transit states truly protect.  
  3. **Social Group Definition:** Circular groups or novel categories (e.g., "climate refugees").  
  4. **Border Closure Legitimacy:** States' right to refuse entry *en masse*.  
  5. **Global Burden-Sharing:** Total obligation caps or equitable distribution.  

  This procedure isolates *factual thresholds* (agent, protection, fear) from *normative judgments* (nexus expansion, responsibility weights). Caseworkers apply steps 1–4 in sequence, escalating unresolved values disputes to legal officers with philosopher input. Triage notes should document:  
  > *"RSD failed at Step [X] due to [factual gap]. Responsibility assigned per [Ground Y] overriding [Ground Z]."*  

  Designed for 45-60 minute assessments, it balances legal defensibility with the reality that some dilemmas require higher-level arbitration.
