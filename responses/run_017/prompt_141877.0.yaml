answer: |-
  You're right that BPI yields nonmeasurable subsets of Cantor space via nonprincipal ultrafilters, and I concede that this is nonconstructive. However, this pathology is confined within specific contexts—here, a particular ultrafilter on ℕ. Crucially, BPI *does not* force the entire universe into a well-ordered hierarchy. With AC, you get a well-ordering of ℝ, making *every* set potentially susceptible to nonmeasurability constructions like Vitali sets—there's no barrier. Under BPI alone, while we have isolated nonmeasurable sets, we lack the global machinery to systematically deform the continuum. The distinction isn't aversion to well-orders *qua* well-orders, but to the universal imposition of structure that reshapes analysis and topology in ways BPI avoids. Why escalate to global choice when local compactness principles suffice?
