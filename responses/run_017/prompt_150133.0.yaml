  ### BUREAU OF ADMISSIBLE PRECISIFICATIONS  
  **Joint Guidance Note: HLP-23-01**  
  **Subject: Administration of the Heap Levy under the Grain Accretion and Detritus (Fiscal) Act 2021**  

  1. **Purpose and Scope**  
     This guidance, jointly issued by the Epistemicist Directorate (ED) and Supervaluationist Directorate (SD), clarifies procedures for determining Heap Levy liability on sand formations situated on private land. The Levy applies exclusively to configurations classified as "heaps" per statutory criteria.  

  2. **Definition of a Heap**  
     - **ED Position**: A sand formation constitutes a heap if and only if it meets or exceeds a specific grain-count threshold (the "Exact Cutoff"), established under Section 4(2) of the Act. This Cutoff is fixed, discrete, and recorded in the Bureau’s Central Register.  
     - **SD Position**: A heap is defined as a sand formation satisfying the predicate "heap" under *every admissible precisification* of the term. Admissible precisifications are those consistent with ordinary usage and non-arbitrary in application.  

  3. **Determination of Liability**  
     - **ED Procedure**: Bureau assessors will evaluate grain counts using calibrated instruments. If a formation meets or exceeds the Exact Cutoff, a standard tax notice (Form HL-5A) is issued.  
     - **SD Procedure**: Assessors apply a tripartite classification:  
       - **H** (Heap): Formation satisfies "heap" under all admissible precisifications.  
       - **NH** (Not a Heap): Formation satisfies "non-heap" under all admissible precisifications.  
       - **NDS** (No Determinate Status): Formation satisfies "heap" under some but not all admissible precisifications.  
       Levy liability arises *only* for H-classified formations (SD Form HL-5B).  

  4. **Taxpayer Obligations and Prohibitions**  
     - **FOI Requests (ED)**: Requests for disclosure of the Exact Cutoff (including grain-count audits or threshold documentation) are denied under Section 9(1)(c) of the Fiscal Secrecy Act. Taxpayers cannot attain knowledge of the Cutoff due to inherent epistemic constraints.¹  
     - **Private Grain-Counting Firms (ED)**: Engaging commercial entities to certify heap status is strongly discouraged. All grain-counting methodologies exhibit a margin of error; thus, no certification can conclusively establish proximity to the Cutoff. Reliance on such reports voids appeal rights.  
     - **Statutory Limitations (SD)**: The Bureau’s authorizing statute (Section 2(a)) permits levy collection *only* where liability is determinate (i.e., H classification). In NDS cases, the statute neither requires nor prohibits collection, rendering enforcement action ultra vires.²  

  5. **Assessment Protocols**  
     - **ED Notice Particulars**: Tax notices for heap formations itemize constituent grains. Where a formation marginally exceeds the Cutoff, Supplemental Notice HL-5A(α) is issued to the landowner, identifying the specific grain responsible for threshold crossing and assigning 100% levy liability thereto.³  
     - **SD Classification Challenges**: Borderline formations may exhibit higher-order vagueness; i.e., the distinction between H and NDS is itself indeterminate.⁴ Assessors may append "Provisional" status to H or NDS classifications pending secondary review.  

  6. **Appeals and Disputes**  
     Joint Review Panels (ED/SD personnel) adjudicate contested classifications. Panels may request grain recounts (ED) or precisification remapping (SD). Outcomes are binding.  

  7. **Mission Compliance**  
     The Bureau reiterates its commitment to administering the levy "without sharp cutoffs or arbitrary thresholds" (Mission Statement §1).  
     - **ED Note**: The Mission Statement is factually inaccurate. The Cutoff is non-arbitrary and exact but undisclosable.  
     - **SD Note**: The Mission Statement is true, as no single grain determines heap status. However, its truth-value is contingent on precisification-relative analyses of "sharp cutoff."⁵  

  ---  
  ### APPENDIX A: INSPECTOR-GENERAL’S OBSERVATIONS  
  Despite irreconcilable methodological differences, ED and SD assessments concur in 100% of field cases to date. No taxpayer has ever:  
  (a) Received divergent liability determinations for the same formation,  
  (b) Detected operational discrepancies in levy collection.  
  **Conclusion**: The theoretical divergence between ED and SD has no documented material impact. A research program (Proposal IG-7) is recommended to synthesize edge-case sand formations capable of producing divergent classifications, pending budget approval.  

  ---  
  **FOOTNOTES**  
  ¹ *ED Margin-of-Error Principle*: Knowledge of the Cutoff requires immunity to nearby error; given the continuum of grain counts, such knowledge is unattainable for non-Bureau entities.  
  ² *SD Enabling Statute Paradox*: In penumbral cases, the statute’s directive to "collect all due levies" suffers indeterminate truth-value, as "due" lacks determinate application.  
  ³ *ED Boundary Grain Notice*: The grain designated in HL-5A(α) is liable irrespective of its removal post-assessment. Disputes require proof the grain is non-sand (e.g., organic debris).  
  ⁴ *SD Higher-Order Vagueness*: The set of admissible precisifications lacks sharp boundaries. Consequently, "definite heap" (H) and "borderline" (NDS) cannot be crisply partitioned.  
  ⁵ *SD Meta-Analysis*: The phrase "sharp cutoff" is vague; thus, the Mission Statement’s truth may vary across precisifications. A full semantic audit is postponed indefinitely.  

  ---  
  *Issued jointly by the Epistemicist and Supervaluationist Directorates, BAP.  
  For inquiries: heap.levy@bap.gov.fict*  

  ---  
  **Rationale & Humor Mechanics**  
  - **Epistemicist Jokes**: FOI refusals and warnings against private counters stem from the "unknowable exact threshold" premise. The tax notice to a single grain highlights comical bureaucratic literalism.  
  - **Supervaluationist Jokes**: The tripartite stamps and statutory paralysis in NDS cases underscore their "truth relative to precisifications" view. Footnotes ⁴/⁵ layer indeterminacy humor (e.g., vagueness infecting their own guidelines).  
  - **Joint Delivery**: Deadpan civil-service tone avoids winking (e.g., "ultra vires," "provisional status"). The Appendix’s research program satirizes institutional inertia.  
  - **Accessibility**: Jokes rely on contrasting practical outcomes (e.g., both divisions agree *not* to tax borderline piles) rather than jargon. The heap paradox is never named but animates every clause.  
  - **Word Count**: ~650 words.
