  First, I need to unpack Brewer's argument. The user is confused about whether Brewer is narrowing the text or creating a non-textual exception. Brewer concedes that the church's action falls under the literal text but argues it's not covered due to the statute's spirit and intent. The key here is that Brewer uses context, absurdity, and legislative history to infer that Congress didn't intend to include clergy. This isn't textualism in the modern sense; it's purposivism.

  The user’s study group is split on what "intention of its makers" means. They present three options: (a) original public meaning, (b) actual expectations of lawmakers, (c) legislative purpose. The user thinks Brewer leans toward (b) or (c), while their friend argues for (a). Looking at Brewer's references to the whole legislation, circumstances of enactment, and absurd results, it seems he’s going beyond plain meaning. The absurd results point is particularly telling—Brewer uses it as evidence of intent, not as a standalone reason to ignore the text. That supports the user's view.

  Now, the hypothetical scenario. A 1970s statute regulating door-to-door sales, with video calls as a modern issue. The legislature rejected a telephone exemption but didn’t foresee video calls. Applying the three readings: (a) original public meaning would cover video calls since it's "solicit[ing]... at any place other than the seller's established place of business." (b) Actual expectations: lawmakers didn’t consider video calls, so maybe not covered. (c) Legislative purpose: the aim was high-pressure in-home sales, which video calls might not fully replicate. The rejected exemption complicates things—why was it voted down? Because they wanted courts to draw lines, so maybe courts should exempt video calls as not fitting the core mischief.

  In the variant with no legislative history, the maxim might not yield a clear result. That shows Brewer’s approach relies on available context to infer intent. Without such context, the literal text might apply. This highlights that Brewer’s method is about using all relevant evidence to discern purpose, not just text.

  The user’s deeper need seems to be understanding how judges balance text vs. intent, especially in unforeseen scenarios. They want a framework beyond labels like textualism or purposivism. They’re also testing how historical context influences modern application. By analyzing Brewer’s reasoning and applying it to their hypothetical, they’re seeking practical tools for statutory interpretation in their seminar.

  I should emphasize that Brewer’s approach is holistic, using text as a starting point but diving into purpose when context suggests the text is overbroad. The hypothetical shows how legislative history (like the rejected exemption) can guide intent, but without it, the court might stick to the text. This underscores that Brewer’s maxim isn’t a rigid rule but a flexible principle tied to available evidence of legislative intent.
answer: |-
  This is a brilliant dissection of a foundational statutory interpretation problem. Let's break down Brewer's reasoning logically, then apply it to your hypothetical.

  ### Logical Structure of Brewer's Move
  1.  **Concession:** The act falls squarely within the literal meaning of the statutory text ("within the letter").
  2.  **Problem:** Applying the statute literally to this specific case produces a result that is:
      *   **Absurd:** Denouncing a church hiring a minister with penalties seems unreasonable.
      *   **Counter to Spirit/Intent:** It contradicts the perceived fundamental purpose or underlying principle the law was meant to serve.
  3.  **Maxim Invoked:** "A thing may be within the letter of the statute and yet not within the statute, because not within its spirit nor within the intention of its makers."
  4.  **Justification:** This isn't judicial overreach because:
      *   **Contextual Meaning:** General words derive their *true meaning* not in isolation, but from the context of the "whole legislation" and the "circumstances surrounding its enactment."
      *   **Evidence of Intent:** Considering absurd results or context is how we *discern* what the legislature actually intended the scope of the general words to be. It's evidence gathering, not will substitution.
  5.  **Conclusion:** The specific case (hiring a minister) is excluded from the statute's scope, *despite* fitting the literal text, because including it would violate the spirit and intent revealed by context.

  **Is it Narrowing the Text or Carving an Exception?**
  *   **Brewer's View (Purposive):** He is *defining the scope* of the text. He argues the literal meaning is *over-inclusive* based on context and intent. "Labor... of any kind" doesn't *actually* mean *absolutely every conceivable kind*; its scope is limited by the purpose of the law (preventing importation of cheap/unskilled labor). He's interpreting the *meaning* of the text in light of its purpose. It's a claim about what the statute *means* (a purpose-limited meaning), not just its effect.
  *   **Textualist View:** He is carving out a non-textual exception based on subjective "spirit" or unenacted intent, overriding the plain text and the specific exclusionary implication of Section 5.

  **The Role of Section 5 & "Great Force"**
  *   **Why Concede "Great Force"?** Brewer acknowledges textual evidence (expressio unius) strongly supporting the literal reading. This shows intellectual honesty and makes his subsequent rejection *more powerful*.
  *   **What it Tells Us:** The Court assigns *significant* weight to inferences from the text itself (textual canons like expressio unius). However, Brewer argues that *other contextual evidence* (absurdity, overall purpose revealed by circumstances) is *even more compelling* in this specific case. It shows the Court engages in a *hierarchy* of interpretive tools, where textual canons are important but not always dispositive against contrary evidence of purpose/intent.

  **"Spirit" vs. "Intention of its Makers": One Test or Two?**
  *   **Largely Conflated in Practice Here:** Brewer uses them essentially synonymously. "Spirit" likely refers to the *animating purpose or principle* behind the law. The "intention of its makers" is the *collective legislative intent* regarding that purpose and scope.
  *   **Subtle Distinction (Theoretical):**
      *   **Spirit:** The objective purpose or principle the law serves, discernible from its structure, context, and subject matter, perhaps even if individual legislators didn't consciously articulate it.
      *   **Intention of Makers:** The subjective (though collective) mental state of the enacting legislature – what they aimed to achieve and what they thought the words covered.
      *   Brewer's evidence ("whole legislation," "circumstances," "absurd results") is used to discern *both* simultaneously. They are two facets of the same inquiry.

  ### "Intention of its Makers": (a), (b), or (c)? Where Brewer Fits
  *   **(a) Original Public Meaning:** What the words would have conveyed to a competent reader *at the time*. Your friend's textualist argument.
      *   **Support in Quote:** Brewer talks about "words of general meaning" and the need to avoid "narrow interpretation." He acknowledges the text's force.
      *   **Strain:** His *method* goes far beyond dictionary meaning or typical contextual canons. He relies heavily on "circumstances surrounding enactment" (legislative history/purpose) and "absurd results" (a purposive, not textual, canon). He explicitly rejects the conclusion mandated by the strongest *textual* canon (expressio unius via Section 5). The "spirit" language is inherently purposive.
  *   **(b) Actual Expected Applications:** What specific outcomes lawmakers thought the words would cover.
      *   **Support:** His focus on "intention of its makers" and "legislator intended" points towards subjective intent. "Circumstances surrounding its enactment" could include legislative history revealing expectations.
      *   **Strain:** He doesn't cite specific statements proving Congress *didn't* expect ministers to be covered. He infers it from the *nature* of the case and the *purpose*.
  *   **(c) Legislative Purpose/Aim:** The end goal of the statute; whether applying it frustrates or advances that goal.
      *   **Strongest Support:** This is the core of his reasoning. The "spirit" is the purpose (preventing importation of cheap labor, not ministers). "Absurd results" are absurd *because* they frustrate the core purpose. "Whole legislation" and "circumstances" are used to *identify that purpose*. He concludes Congress *intended* the purpose to limit the scope of the general words. His list of evidence points directly to purpose.

  **Conclusion on Brewer:** He primarily operates on **(c) Legislative Purpose/Aim**. He uses the absurdity of the result *as evidence* of what the legislative purpose must have been (and therefore what the legislators *intended* the scope to be). The purpose defines the scope of the general language. **(b)** is implied through the purpose lens (if this was the purpose, they couldn't have intended *this*). **(a)** is the starting point he overcomes with purposive evidence. **The key sentence favoring (c):** "makes it unreasonable to believe that the legislator intended to include the particular act." He uses context/absurdity to infer the *intent regarding scope* based on the *perceived purpose*.

  ### Applying the Maxim to Your Hypothetical

  **Facts:**
  *   **Statute:** "No seller shall solicit or conclude a contract for goods or services at any place other than the seller's established place of business unless the buyer is given three days to cancel."
  *   **Context:** 1970s, aimed at high-pressure door-to-door sales fraud (stranger physically present in home).
  *   **Legislative History:** Amendment to exempt telephone contracts proposed and voted down *not* because legislature wanted them covered, but because they couldn't agree on scope and wanted courts to draw the line.
  *   **Modern Case:** Contract concluded entirely by video call (e.g., Zoom), buyer at home.

  **Applying Brewer's Maxim (as used in *Holy Trinity*):**

  1.  **Within the Letter?** Yes. Video call solicitation/conclusion happens "at [the buyer's kitchen table]" which is "a place other than the seller's established place of business."
  2.  **Within the Spirit/Intention?** Analysis per readings:

      *   **(a) Original Public Meaning (c. 1970s):**
          *   A competent reader in the 1970s would understand "place" to mean a *physical location*. "Solicit or conclude... at any place" strongly implies a physical, geographic context. While telephone was known, it wasn't typically conceptualized as occurring "at" the buyer's home in the same physical, presence-based way as a door-to-door salesman. Video calls didn't exist. The *paradigm* was physical presence.
          *   **Result:** Likely **NOT COVERED**. The ordinary meaning of "at any place" in context (anti-door-to-door statute) wouldn't encompass purely electronic communication occurring *through* a place, but not requiring the seller's physical body *in* that place. The text is ambiguous enough for context to limit it. The statute is about *physical intrusion* creating pressure. (This is closer to your friend's textualism-with-context).
      *   **(b) Actual Expected Applications:**
          *   Lawmakers demonstrably *did not expect* or intend the statute to cover telephone sales (they tried to exempt them). They explicitly left the line-drawing to courts for *similar* situations (remote communication). They certainly never imagined video calls.
          *   **Result:** **NOT COVERED.** Applying it to video calls would cover something the legislature clearly didn't expect the statute to cover (telephone), and something they couldn't have conceived of. The vote against the exemption shows their lack of intent to cover remote communication generally.
      *   **(c) Legislative Purpose/Aim:**
          *   **Purpose:** Prevent fraud arising from the unique high-pressure situation of a *stranger physically present in the buyer's home*. The physical presence is key to the mischief (vulnerability, inability to easily escape, pressure to be polite/agree).
          *   **Video Call?** Creates pressure, but lacks the physical presence, physical intrusion, and the same level of inescapability inherent in a stranger in your home. It's closer to a phone call than a door knock.
          *   **Rejected Exemption:** Crucially, the legislature *didn't* vote down the telephone exemption because they wanted phones covered! They voted it down because they wanted *courts* to handle the boundaries of what constitutes problematic *non-physical* solicitation. Their intent was to *delegate* the line-drawing for non-paradigm cases.
          *   **Result:** **NOT COVERED.** Applying the statute to video calls would extend it beyond its core purpose (combating in-person home pressure). The legislature *specifically declined* to mandate coverage of the closest known analogue (telephone) and signaled that courts should determine if non-physical methods create sufficient pressure to warrant inclusion. A video call, while potentially pressuring, lacks the core element of physical presence/intrusion. Including it would frustrate the legislative intent to focus on the physical home intrusion mischief and delegate further development.

  **Brewer's Likely Result:** Given his emphasis on purpose and using legislative history/circumstances to discern intent, Brewer would likely adopt **(c)** and find the video call **NOT COVERED**. The core mischief (physical intrusion) is absent, and the legislative history shows they didn't want the statute mechanically applied to all remote communication but wanted courts to assess the pressure element in new contexts. The literal reading is over-inclusive relative to the purpose.

  **The Variant (No Legislative History - Just Unforeseen):**
  *   **Facts:** Statute as written. Enacted in 1970s. Video calls are a completely unforeseen technology. No legislative history regarding exemptions, expectations, or purpose beyond the text itself and the general knowledge of the door-to-door sales problem.
  *   **Applying the Maxim:**
      *   **Within the Letter:** Still clearly yes (solicitation/conclusion at buyer's home via video).
      *   **Within Spirit/Intention?**
          *   **(a) Original Public Meaning:** Same as above - "at any place" likely meant physical location/seller's presence. **Likely NOT COVERED.**
          *   **(b) Actual Expected Applications:** Unknown. Lawmakers never imagined it. The maxim doesn't provide clear guidance here. Is the unforeseen automatically excluded? Not necessarily. Maybe they would have wanted it covered if they knew. **INDETERMINATE.**
          *   **(c) Legislative Purpose/Aim:** Purpose must be inferred *only* from the text and the general context (it's an anti-door-to-door statute). The text is very broad ("any place"). The *only* discernible purpose is regulating sales *not* at the seller's business. Does "place" imply physical presence? Does the underlying problem (pressure) exist in video calls? Without more context, it's ambiguous. The maxim struggles. **LIKELY COVERED, but UNCERTAIN.** The strong literal reading + express purpose inferred *only* from text (regulate off-premises sales) might prevail without countervailing purposive evidence. Brewer might look for an "absurd result" (e.g., applying it to mail-order?), but video pressure isn't obviously absurd if the text is broad.

  **What This Shows About Brewer's Maxim:**
  1.  **Reliance on Context:** The maxim, as Brewer uses it, is **powerless without contextual evidence** (whole act, circumstances, absurdity) to define the "spirit" or "intent." In the variant, lacking that evidence, the literal text has much stronger force.
  2.  **Purpose is Paramount:** The hypothetical variant highlights that Brewer's core move is using context to identify a *purpose* that then limits the scope of general text. Without evidence of a *narrower* purpose than the text suggests on its face, the maxim cannot operate to exclude the case. In *Holy Trinity*, the evidence (context, absurdity) revealed a purpose *narrower* than the literal text. In your variant, without evidence, the purpose inferred might be *as broad* as the text.
  3.  **Intent via Purpose:** Brewer infers legislative *intent* (regarding scope) primarily through evidence of *purpose*. Without evidence of purpose, inferring intent becomes speculative.
  4.  **Not a Free Pass:** The maxim isn't a general license to ignore text for unforeseen cases. It requires affirmative evidence that applying the literal text *in this specific way* contradicts the purpose/intent revealed by the statute's context. In the variant, that evidence is lacking, so the text likely governs.

  In essence, Brewer's maxim in *Holy Trinity* is a **purposive narrowing of overbroad general language based on contextual evidence revealing a legislative intent to target a specific mischief, not literally everything the words could encompass.** It requires that contextual evidence to function. Your hypothetical brilliantly demonstrates both its power (when context reveals purpose) and its limitation (when context is sparse).
