prompt: |-
  so I'm writing a novel — two protagonists on opposite sides of the same fight, starting with something small and local (a school curriculum meeting that gets ugly) and spiralling outward — and while doing research for it I keep bumping into a thing I don't have a word for. I dont want a word to drop into dialogue, I want to understand the machinery well enough that neither of them is a caricature, so bear with the rambling setup.

  My character Dana is not in a bubble. She reads the other side constantly. She can recite, from memory, six infuriating things people on their side have said this year; she follows several of their writers on purpose, specifically to get angry. But nothing she reads was picked by the other side for the other side. It was picked by her own side, screenshotted, and circulated because it was enraging or ridiculous — last week her group chat passed around a clip of some guy with a few hundred followers saying something genuinely unhinged, and everyone in it treated him as what the other side really thinks. So her sample of them is basically a gallery of their worst moments, assembled by her own allies, and the boring, reasonable majority of what the other side says never makes it into the gallery because nobody on her side has any reason to pass it around. The part I can't get right is what happens next: when Dana actually meets one of them at a meeting and he's mild, concedes a point, makes an argument she half agrees with, it doesn't move her at all. She files him as an exception, or as someone being polite in mixed company, and goes back to the gallery.

  What I keep wanting to call it is a reverse echo chamber — not too little contact with the other side but a kind of adversarial curation, where more contact makes you surer they argue in bad faith rather than less. Everything I've run into feels adjacent but wrong. The usual echo chamber / filter bubble stuff is about information being kept out, whereas here information is being pushed in, by her own teammates. There's something I half remember called the "hostile media effect" (I may well be mangling the name) about people perceiving neutral coverage as biased against them, but the material Dana reacts to really is nasty, so she isn't misperceiving anything. And there's work on how we overestimate how extreme the other side is, which isn't it either: if you asked Dana to guess what fraction of them believe X, I think she'd be roughly right. Her problem isn't a false belief about the distribution of their opinions — it's what her sample is made of, who assembled it and why, and the fact that meeting them face to face doesn't fix it. (Also: there's that exercise where you have to state the other side's position well enough that they'd sign off on it. Dana would be great at it. I don't think it would help her at all, and that's a detail I'd love to get right.)

  So: is there an established concept for this, in political science or social epistemology or media studies or anywhere else, and if so what exactly does it cover and what is it used to explain? If there isn't one, give me a coined name and a definition — but more importantly give me the edges. Where does this stop being its own thing and become just ordinary mockery of your opponents, which is ancient and probably mostly fine? Does more exposure ever help rather than hurt here, and is the difference the amount of contact or the kind of contact? And what would the honest version of the fix even be, because my instinct is that "go read the other side" is definately the wrong advice for someone like Dana, and I want to know whether that's insight or just my own cynicism.
reasoning: |-
  Okay, the user is writing a novel with two protagonists on opposite sides of a conflict that starts small and escalates. They're researching a psychological phenomenon where one character, Dana, consumes content from the opposing side but through a distorted lens. Specifically, her exposure is curated by her own side to highlight the most extreme or infuriating examples, leading her to dismiss reasonable opponents as exceptions. The user wants to understand this concept to avoid caricatures and is seeking established terms or frameworks.

  First, I need to recall relevant concepts. Confirmation bias comes to mind, but that's more about seeking information that confirms preexisting beliefs. Here, Dana is actively engaging with opposing views but in a skewed way. The hostile media effect is mentioned, but Dana's material is genuinely hostile, so that doesn't fit. 

  Then there's selective exposure theory, which might be closer. Dana is exposed to the other side, but the selection is adversarial. The concept of "nutpicking" fits here—cherry-picking the most extreme examples to represent the whole group. That's a key term. 

  The user also mentions echo chambers, but this is the opposite. It's more like an "adversarial curation echo chamber" where the exposure is weaponized. The distinction here is that Dana's own side filters the content. This relates to in-group dynamics and the role of social validation. Her group chat reinforces the skewed perception by sharing these examples, creating a sense of shared outrage.

  The user is concerned about how face-to-face interactions don't change Dana's views. Cognitive dissonance theory explains this. Meeting a reasonable opponent creates dissonance, but Dana resolves it by categorizing them as an exception ("subtyping"). This avoids updating her overall schema of the out-group. The "out-group homogeneity bias" also plays a role here—seeing the out-group as monolithic while recognizing diversity in her own group.

  The user asks if there's an established term. "Adversarial curation" seems central. Combining that with "schema reinforcement" captures the mechanism where new information is processed to fit existing beliefs. Also, "outrage media loops" describe the cycle of sharing enraging content for engagement.

  For the deeper needs, the user wants authenticity in their characters. They need to portray Dana's psychology accurately, avoiding strawman arguments. Understanding why "go read the other side" fails is crucial. Dana's approach is already engaging with the other side, but through a distorted lens. The solution isn't more exposure but changing the nature of exposure—direct, personal interaction without intermediaries. However, the user might also be exploring whether such change is possible for Dana, adding depth to the narrative conflict.

  The user's unspoken need is to grasp the underlying mechanisms to write nuanced character development. They might want to show the tragedy of this cycle without being didactic. Highlighting concepts like subtyping and adversarial curation provides tools for realistic portrayal. Also, questioning if more exposure helps—it depends on context. Superficial contact reinforces stereotypes, while meaningful dialogue with shared goals might foster change. This insight can drive the novel's plot, especially as the protagonists' conflict spirals outward.
answer: |-
  This is a brilliantly observed and deeply relevant phenomenon in polarized societies. You're right that existing terms feel adjacent but inadequate. Let's break it down, coin a term, define its edges, and explore the machinery.

  **The Established Concepts & Their Shortcomings:**

  1.  **Confirmation Bias:** Dana *is* seeking information, but it's pre-selected to confirm her negative view. It fits partially, but doesn't capture the *adversarial curation* aspect.
  2.  **Selective Exposure:** Usually implies avoiding opposing views. Dana *isn't* avoiding them; she's consuming a *specific subset* curated specifically to inflame. This is **Adversarial Selective Exposure**.
  3.  **Hostile Media Effect:** You're correct. Dana isn't misperceiving *neutral* coverage as hostile; she's reacting to genuinely hostile material. The distortion is in its *representativeness*, not its *inherent bias*.
  4.  **False Consensus Effect / Outgroup Homogeneity Bias:** Dana might accurately estimate the *proportion* holding extreme views (contra False Consensus), but she exhibits **Outgroup Homogeneity Bias** – perceiving the "other side" as monolithic ("they *all* think like *this* deep down"). Her "exception" mechanism reinforces this.
  5.  **Nutpicking:** This is the *method* her side uses – deliberately selecting the most extreme, fringe, or unhinged examples ("nuts") to represent the entire opposition. It's a key *tactic* causing the problem.
  6.  **Echo Chamber / Filter Bubble:** Traditional models focus on *exclusion* of dissonant views. Dana's environment actively *includes* opposing views, but through a distorting, weaponizing lens. It's an **Adversarial Curation Echo Chamber** or a **Hostile Filter Bubble**.

  **Coining the Term & Defining the Phenomenon:**

  **Term: Adversarial Curation Schema Reinforcement (ACSR)**

  **Definition:** A cognitive and social feedback loop where:
  1.  **Adversarial Curation:** Individuals primarily encounter representations of the opposing group that are pre-selected by their *own* in-group specifically *because* they are extreme, offensive, illogical, or otherwise maximally infuriating (e.g., via social media sharing, group chats, outrage media).
  2.  **Schema Formation:** This curated "gallery of horrors" forms or solidifies a highly negative, simplistic, and homogeneous **schema** (mental model) of the outgroup: "This is what *they* are like; this is what *they* believe."
  3.  **Reinforcement:** When encountering an outgroup member who contradicts this schema (e.g., being reasonable, conceding a point):
      *   **Subtyping:** The individual is categorized as an "exception" ("one of the few good ones," "just being polite," "not *really* representative").
      *   **Discounting:** Their behavior or arguments are attributed to situational factors (mixed company, ulterior motives) rather than genuine belief or character.
      *   **Immunization:** The core negative schema remains intact, even strengthened, by contrasting the "exception" against the perceived "true" nature represented by the curated gallery. The schema becomes resistant to disconfirming evidence.

  **The Machinery (Why Dana Acts This Way):**

  1.  **Social Identity & Belonging:** Sharing and reacting to the curated outrage strengthens in-group bonds. Mocking the "other" together builds solidarity. Dana's participation signals loyalty.
  2.  **Motivated Reasoning:** Dana *wants* to believe her side is good and right. The curated gallery provides constant "proof" of the opposition's badness/wrongness, satisfying this need. Accepting that an opponent is reasonable complicates this simple narrative.
  3.  **Cognitive Efficiency:** Maintaining a simple "us vs. them" schema is mentally easier than constantly updating a complex, nuanced understanding of a diverse opposition. Subtyping is a cognitive shortcut.
  4.  **Emotional Fuel:** Outrage is a powerful motivator and can be addictive. The curated content provides a reliable source of this emotion, driving engagement. Mild, reasonable opponents don't provide this hit.
  5.  **Attribution Error:** Dana attributes the curated extreme behavior to the *disposition* of the entire outgroup ("They *are* like that"). She attributes mild behavior from an individual opponent to the *situation* ("He's *acting* polite because we're here").
  6.  **Perceived Threat:** The curated gallery amplifies the perceived threat posed by the outgroup, making it feel dangerous to lower one's guard or grant legitimacy to *any* of them, lest the "true" extremists gain ground.

  **The Edges: When Does ACSR Become Ordinary Mockery?**

  *   **Frequency & Exclusivity:** Ordinary mockery is sporadic and doesn't form the *primary* or *only* way someone encounters the opposition. ACSR is systematic and dominant.
  *   **Representative Intent:** Ordinary mockery often targets genuinely extreme figures *known* to be fringe. ACSR often presents fringe figures *as* representative of the mainstream opposition.
  *   **Impact on Perception:** Ordinary mockery might make you dislike a specific opponent or enjoy a joke. ACSR fundamentally shapes your *underlying schema* of the entire outgroup, making nuanced interaction impossible. It poisons the well.
  *   **Source:** Ordinary mockery can be self-generated or from diverse sources. ACSR relies on *in-group curated* content specifically designed to inflame.

  **Does More Exposure Help or Hurt?**

  *   **Hurt:** More exposure to the *same kind* of content (adversarially curated snippets, outrage clips) **absolutely reinforces ACSR**. It provides more "evidence" for the negative schema.
  *   **Help:** Exposure that **bypasses the adversarial curation** *can* help, but it's difficult and requires specific conditions:
      *   **Direct, Sustained, Personal Interaction:** Working alongside an outgroup member on a *shared, superordinate goal* (e.g., organizing the school event itself, solving a tangible problem unrelated to the core conflict). This builds individuation and breaks down the monolithic schema.
      *   **Consuming "Boring" Outgroup Media:** Reading their mainstream newspapers, listening to their moderate podcasts, *without* the in-group commentary framing it. Dana needs to see the *mundane* majority discourse, not just the curated extremes.
      *   **Understanding Shared Concerns:** Exposure focused on understanding the *underlying values, fears, or goals* that drive the opposition's *mainstream* positions, even if the solutions differ.

  **"Go Read the Other Side" - Why It's Wrong for Dana (and Your Instinct is Correct):**

  It *is* bad advice for someone deep in ACSR for several reasons:

  1.  **Confirmation Bias in Action:** Dana will likely seek out (or be drawn to) content that confirms her existing negative schema, reinforcing it. She'll notice the extremes more readily.
  2.  **Misinterpretation:** Even encountering moderate content, she's likely to interpret it through her distorted schema ("They're hiding their true agenda," "This is just propaganda").
  3.  **Lack of Context:** Jumping into the deep end of opposing media without understanding their internal discourse, values, and nuances can be overwhelming and easily misunderstood, feeding the sense of alienation.
  4.  **Emotional Toll:** Directly wading into opposing spaces can be genuinely hostile or emotionally draining, validating the curated threat perception.

  **The Honest Fix (Hard, But Possible):**

  1.  **Recognize the Curated Gallery:** The crucial first step is Dana realizing *how* she's encountering the opposition – through her side's lens, specifically selecting for outrage. Understanding the mechanism of **Adversarial Curation** and **Nutpicking** is key.
  2.  **Seek the Mundane Majority:** Actively look for *boring*, representative sources from the other side – local community papers, mainstream (not outrage) commentators, recordings of routine meetings. This counters the "gallery of horrors."
  3.  **Focus on Shared Problems (Superordinate Goals):** Interacting *with* the opposition on concrete, shared local problems (fixing the playground, planning the fundraiser) forces collaboration and individuation, breaking down the monolithic "them."
  4.  **Practice "Charitable" Interpretation (Tentatively):** Not acceptance, but the intellectual exercise of asking: "What valid concern or value might *reasonably* lead a person like this (not the unhinged guy) to hold this position, even if I disagree with their solution?" This combats the automatic assumption of bad faith.
  5.  **Diversify Information Sources:** Consciously follow *moderate* or *bridge-building* figures from *both* sides, or neutral analysts who explain positions without outrage.

  **For Your Novel:**

  You've nailed Dana's reaction. Her ability to articulate the other side's worst arguments *perfectly* yet remain unmoved by reasonable opponents is the hallmark of ACSR. The "fix" isn't intellectual (stating their position well); it's emotional and relational (experiencing them as complex individuals via sustained, non-adversarial contact on shared ground). The tragedy is that the conflict itself usually prevents exactly this kind of contact. The "spiralling outward" likely involves mechanisms that *reinforce* ACSR on both sides (media amplification, escalating rhetoric).

  This is powerful stuff. Understanding ACSR lets you portray Dana not as a caricature of stubbornness, but as a victim of a very specific, psychologically real, and socially amplified distortion mechanism. Good luck with the novel!
