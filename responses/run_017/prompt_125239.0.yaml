prompt: |-
  Hey, I'm taking a metaphysics seminar and our TA handed out a one-paragraph crib sheet from a different section's lecture as a summary of the endurance/perdurance debate. I've done some of the reading and something in it feels off, but I cant localise the problem. Here's the paragraph:

  "Endurantism says that when a thing persists it is wholly present at each moment it exists: at every instant, all of it is there. Perdurantism (a.k.a. four-dimensionalism, the worm view) says a persisting thing is a long spacetime object made of temporal parts, only one of which is around at each time, so nothing is ever wholly present at an instant. Lewis more or less settled this with the argument from temporary intrinsics: an endurantist who is bent at one time and straight at another has to say that the very same object has incompatible intrinsic properties, which is impossible. The perdurantist avoids this because the shape gets attached to a temporal part, which is genuinely intrinsically bent. Notice the cost, though: on the perdurantist picture nothing ever really changes, since the worm just has a straight bit and a bent bit, and change becomes an illusion. And endurantism only works if you are also a presentist, so this whole dispute is really just the old fight about whether the past and future exist."

  Could you go through it more or less claim by claim and tell me: what a careful perdurantist would accept, what they'd wince at, and what is just wrong? I'm especially unsure about three things. First, whether the argument from temporary intrinsics is about *incompatibility* at all, or about something else to do with intrinsicality — I thought the point was subtler than "one object, two clashing properties." Second, whether it's fair to say perdurantists are stuck with change being an illusion, or whether they have a real account of change. Third, whether endurantism really does require presentism, or whether you can be an endurantist and an eternalist.

  He also tossed in something I've found nothing about in the readings or the SEP, and I want to know if it's a thing: a second, parallel problem about parts rather than properties — a cat has a tail at one time and not at another, so the endurantist either has to make parthood time-relative or say the whole cat is made up of different stuff at different times, while the perdurantist gets it for free because each temporal part just has the parts it has. He mumbled something like "the problem of temporary parthood." Is that a genuine problem in the literature, is it just the argument from temporary intrinsics again in different clothes, and does it add any independent pressure?

  Finally: does his last move survive the corrections? Is the endurance/perdurance dispute really just the presentism/eternalism dispute, or is he collapsing two separate debates? And separately — our prof keeps hinting that part of this debate is merely verbal and dissolves once you get careful about what "persist" and "part" mean. I can't tell whether that's a serious point or a way of dodging a hard question, so I'd like your read on which parts of the disagreement are substantive and which are about words.
