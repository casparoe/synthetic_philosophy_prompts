answer: |-
  Below is a systematic audit of the arguments, structured to meet your four requests. I'll mark speculative extrapolations with **‡** and adhere strictly to your constraints.

  ### **1. Correspondences & Occupants**
  *Table: Hardware-Software Analogy*

  | **Concept**      | **General Meaning**           | **Sarsi Occupant**                                                                 | **Gap?**                              |
  |------------------|-------------------------------|------------------------------------------------------------------------------------|---------------------------------------|
  | **Programme**    | Abstract computation/process  | Colony-level cognition (planning, error-correction, generational memory integration) | None                                  |
  | **Machine**      | Substrate executing the programme | Individual brains + shared chemical record                                         | None                                  |
  | **Input**        | Data from environment         | Sensory data gathered by members                                                   | None                                  |
  | **Output**       | Behavioral/adaptive response  | Colony actions (construction, foraging, defense)                                   | None                                  |
  | **User**         | Beneficiary/operator          | *No clear occupant* (Colony acts autonomously; no external "user")                 | **Critical gap**                      |
  | **Same Programme** | Functional equivalence        | Colony achieves goals (survival, problem-solving) despite different implementation | Requires functionalist assumption **‡** |

  *Table: Engine Analogy*

  | **Concept**      | **General Meaning**           | **Sarsi Occupant**                                                                 | **Gap?**                              |
  |------------------|-------------------------------|------------------------------------------------------------------------------------|---------------------------------------|
  | **Engine**       | Power source/processor        | Individual brain (70g) OR aggregate neural tissue (1.4-2.8kg)                      | **Ambiguity** - Which unit counts?    |
  | **Fuel**         | Energy input                  | Food/metabolism                                                                    | None                                  |
  | **Load**         | Work demanded                 | Environmental challenges, survival tasks                                           | None                                  |
  | **Work Done**    | Useful output                 | Individual/colony survival, knowledge retention                                    | None                                  |
  | **Owner**        | Entity to whom work accrues   | *No clear occupant* (Individual? Colony? Neither has unambiguous "ownership")      | **Critical gap**                      |

  **Summary of Gaps**:  
  - **Software analogy**: Lacks a "user," implying minds exist for their own sake (plausible).  
  - **Engine analogy**: "Owner" is undefined, masking the question of *whose* interests matter.  
  - **Engine analogy**: Fails to specify if the "engine" is the individual or colony.  

  ---

  ### **2. Decorative vs. Load-Bearing Disanalogies**  
  **Software Analogy**:  
  - **Load-bearing**: Assumes **functionalism** (mind = computation). If rejected, the analogy collapses. Functional equivalence *does not* automatically confer moral status; it only addresses *identity of mental states*. Moral status requires additional premises (e.g., sentience = morally relevant output).  
  - **Decorative**: Substrate independence itself. What matters is whether the computation includes morally relevant states (e.g., suffering, joy).  
  - **Tempo**: Analogizes speed to "clock rate." **Moral relevance?** Only if tempo affects the *character* of experience (e.g., slower cognition might lack "narrative continuity" **‡**). If outputs are identical, tempo is decorative.  

  **Engine Analogy**:  
  - **Load-bearing**: Assumes moral status scales with **processing capacity** (size → more "work" done). Conflates *throughput* (e.g., calculations/second) with morally relevant properties (e.g., depth of emotion, self-awareness). Size is a proxy for these, not the cause.  
  - **Decorative**: Engine metaphors (cylinders, displacement).  
  - **Tempo**: Implicitly critical (lawnmower vs. car engine). But if a lawnmower does the same work over longer time, is it inferior? Only if moral status demands *efficiency* or *speed of response* (e.g., faster minds suffer more intensely per second **‡**).  

  **Core Tension**:  
  - Software analogy: Moral status depends on **outputs** (sentient states).  
  - Engine analogy: Moral status depends on **input capacity** (neural resources).  
  - **Neither** directly addresses *what properties* of outputs/capacity matter morally.  

  ---

  ### **3. Where Conclusions Actually Rest**  
  **Neuroscientist**:  
  - **Real Premises**:  
    1. Functionalism is true (mental states = functional roles).  
    2. Sentience/pain/joy are morally relevant functional states.  
    3. The Sarsi colony *functionally instantiates* these states.  
  - **Role of Brain Facts**: Size/speed are irrelevant *if* functional equivalence holds. Brain facts only matter as evidence for/against functional equivalence (e.g., does the colony *actually* feel pain or just mimic pain responses?).  

  **Advocate**:  
  - **Real Premises**:  
    1. Moral status scales with a neural property **P** (e.g., complexity, integration, experiential richness).  
    2. **P** correlates strongly with brain size/organization.  
    3. The colony has no unified subject (no "owner"), so aggregate size is irrelevant.  
  - **Role of Brain Facts**: Size is a proxy for **P**. Without a colony-level subject, only individual brains (70g) have **P**, which is below the moral threshold.  

  **What is P?** (What size indicates):  
  - Plausible candidates:  
    - **Integration**: Degree of information sharing (e.g., gamma synchrony in humans). A 70g brain may be less integrated than a human's.  
    - **Associative richness**: Neurons in prefrontal/parietal regions enabling abstract thought.  
    - **Temporal depth**: Ability to simulate past/future (linked to default mode network complexity).  
  - **‡Sheer Size as Intrinsically Relevant?** Only if:  
    1. Moral status requires a *minimum energy flux* (Joules/second) for "meaningful" experience (unfounded **‡**).  
    2. Larger systems have *emergent properties* (e.g., human brains enable theory of mind; insect brains do not). But this is about structure, not size alone.  
    - **Conclusion**: Sheer size is not intrinsically morally relevant; it’s only evidence for **P**.  

  ---

  ### **4. A Better Analogy & Eusocial Complications**  
  **Proposed Analogy: Ecosystem**  
  - **Structure**: A rainforest (colony) with sentient organisms (individual Sarsi) and emergent processes (nutrient cycles, climate regulation).  
  - **Moral Patients**:  
    - Individual organisms (sentient beings).  
    - The ecosystem *as a whole* only if it has interests (e.g., stability, biodiversity) that aren’t reducible to individuals.  
  - **Reveals Hidden Issues**:  
    - Tempo: Ecosystems operate on geological time. Does slowness negate moral considerability?  
    - Subjecthood: Does the rainforest "experience" anything? Unlikely. But its *destruction* harms sentient individuals and complex value (aesthetic, ecological).  
    - Size: Total biomass doesn’t matter; moral relevance tracks *sentient individuals* and *irreplaceable complexity*.  

  **Eusocial Complications**:  
  - **Colony as Subject?** Requires:  
    1. **Causal Integration**: Feedback loops where colony state directly regulates individual experience (e.g., chemical record alters member cognition).  
    2. **Irreducible Goals**: Colony objectives (e.g., nest-building) that aren’t sums of individual goals.  
    3. **‡Emergent Experience**: If the colony’s cognition has qualitative states (e.g., "colony anxiety") not felt by individuals (**highly speculative ‡**).  
  - **Size Relevance**: Aggregate neural mass only matters if it enables *emergent morally relevant properties* (e.g., a collective memory allowing richer suffering/joy than individuals could experience).  
  - **Individual Moral Status**: **Unavoidable.** Each Sarsi is sentient and can be harmed. Even if the colony is a subject, individuals remain patients (like cells in a human body).  

  **Key Argument for Your Chapter**:  
  The neuroscientist must defend functionalism *and* prove the colony instantiates sentience. The advocate must show moral status requires neural properties *absent* in 70g brains *and* deny colony subjecthood. Tempo is a red herring unless tied to experiential quality. The hard problem: Do 20-40 minds plus a chemical record create *one more mind*? If not, only individuals matter. If yes, what is the size of *that* mind?  

  ---
  **Speculative Flags**:  
  - ‡ Functional equivalence implying identical moral status.  
  - ‡ Tempo affecting moral weight.  
  - ‡ Emergent colony-level experience.  
  - ‡ Size as intrinsically morally relevant.  

  This framework leaves both characters formidable but uncertain, grounded in genuine philosophical tensions. The tribunal’s decision may hinge on whether they prioritize sentient individuals or cognitive outcomes—a choice no analogy can resolve.
