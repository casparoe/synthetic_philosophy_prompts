prompt: |-
  i write a lot of incident reviews at work and i keep running into a thing i dont have a word for.

  Example one: a writeup said the cause of an outage was "no timeout was set on the downstream call" — an absence, not an event. But the same absence showed up six months earlier in another review as "we should add a timeout", filed under recommendations, not causes. Nothing physical changed between the two, just who was on the hook for that service. Example two: everyone agrees "nobody reverted the bad deploy" was a cause, but "nobody was in the office that day" and "no asteroid hit the rack" are not, even though all three are things that didn't happen and all three would have made a difference. And in the meetings the line between cause and background condition slides depending on whether its an SRE review or a product one.

  We hacked around it: our template now requires every cause line to be an event that actually happened, and the non-happenings go in a separate "gaps" column. It works fine in practice but it feels like its hiding something rather than fixing it.

  A friend said philosophers talk about causation by omission, but as far as i can tell that literature is mostly arguing about whether a not-doing can be a cause at all. That's not my puzzle. My puzzle is the picking: why some absences get promoted to causes once a role or an expectation gets attached to them, and why which ones count can change while the world stays exactly the same.

  Is there a name for that picking part? If there is, i want the carving, not just the label: what exactly the thing is, what nearby things it isn't, and where the edges are. If there isn't, say so honestly and give me a name and a definition i could actually put in a doc, plus what would and wouldnt count. No reading lists please, i just want to know what im looking at.
reasoning: |-
  Okay, the user is dealing with a nuanced problem in incident reviews. They've noticed that some absences or omissions are labeled as causes in some contexts but not in others, and this seems tied to roles or expectations. The user has implemented a workaround by separating events (causes) from non-events (gaps), but they feel this is a band-aid solution. They want to understand the underlying principle behind why some omissions are considered causes and others aren't.

  First, I need to recall philosophical discussions on causation by omission. The user mentioned that literature debates whether omissions can be causes at all, but their issue is about selection criteria. They want to know why certain absences are promoted to causes based on roles or expectations, and why this changes contextually without any physical changes.

  The key here is the concept of normative responsibility. When an absence is tied to a role-based duty or an expectation, it shifts from being a mere background condition to a cause. For example, "no timeout set" becomes a cause when someone is responsible for setting timeouts, whereas "no asteroid hit" isn't because there's no expectation for anyone to prevent asteroids. This distinction is about normative expectations, not physical events.

  I should distinguish between omissions (specific failures to act) and mere absences (things that just didn't happen). The user's examples like "nobody reverted the bad deploy" is an omission tied to a duty, while "no asteroid" is just an absence without any responsibility attached.

  The user might also be interested in how organizational context affects this. In SRE reviews, technical duties are scrutinized, so omissions related to those duties are causes. In product reviews, business expectations might highlight different omissions. The same absence can be framed differently based on the review's focus.

  They need a term that encapsulates this selective promotion of omissions to causes based on expectations. "Normative salience" or "expectation-dependent causation" could work. But they want a clear definition with boundaries. Defining it as the attribution of causal status based on normative expectations (roles, duties, explicit agreements) makes sense. The edges are when there's no such expectation—like the asteroid example.

  The user probably wants to standardize their incident reviews with clear criteria. Providing a definition they can include in their docs would help. They might also need to train their team on identifying which omissions qualify as causes based on responsibilities, avoiding arbitrary classifications.

  Deep down, the user might be seeking validation that their "gaps" column is appropriate but wants a principled way to explain when an omission should be moved to causes. They need a framework that adds clarity and reduces subjective judgment in post-mortems.
answer: |-
  You've hit on a fundamental and brilliantly observed problem in practical causality. **There isn't a single, universally agreed-upon term for this specific "picking" mechanism,** but the core concept you're describing is **the selective attribution of causal status to omissions based on normative expectations (roles, duties, responsibilities, or explicit agreements).**

  Here's the carving, definition, boundaries, and a name you can use:

  1.  **The Core Concept: Normative Filtering of Omissions**
      *   **What it is:** The process by which an absence (omission) is judged to be a *cause* rather than a mere background condition or irrelevant absence *specifically because* there existed a recognized expectation, duty, responsibility, or role assigned to someone/something to *perform* the action that was omitted.
      *   **Why it happens:** Causation in human systems isn't just about physical chains of events; it's deeply intertwined with agency, intention, and *accountability*. We care about absences that *shouldn't* have happened according to some agreed-upon norm (a role description, a procedure, a best practice, an explicit agreement). The "promotion" happens when the absence violates this norm.
      *   **Why it changes:** The *normative context* changes (e.g., SRE review vs. Product review, change in team ownership). SRE focuses on technical duties ("you *should* have set a timeout"), Product might focus on business continuity duties ("you *should* have ensured coverage"). The physical world is the same, but the lens of *expected responsibility* shifts, changing which omissions are salient as failures (and thus causes).

  2.  **Proposed Name & Definition for Your Docs:**
      *   **Name:** **Responsibility-Dependent Causation (of Omissions)**
      *   **Definition:** *An omission (the absence of an action) is attributed as a primary cause of an incident only when there existed a specific, recognized responsibility, duty, role expectation, or explicit agreement assigning an agent (person, team, system, or process) the task of performing that action. Absences lacking such an assigned responsibility are treated as background conditions or irrelevant factors, not direct causes.*
      *   **Shorthand:** *"Omissions become causes when they breach a duty."*

  3.  **What Counts (Examples Based on Your Cases):**
      *   **"No timeout set":** Counts as a cause **if** setting timeouts was an explicit responsibility of the service owner/team (e.g., documented in their SLOs, runbooks, or engineering standards). The *breach of duty* makes it causal.
      *   **"Nobody reverted the bad deploy":** Counts as a cause **if** there was an explicit on-call duty, monitoring expectation, or rollback procedure assigning responsibility to detect and revert bad deploys. The *failure to fulfill the rollback duty* is causal.
      *   **"We should add a timeout" (earlier review):** Was a *recommendation* precisely because, at that prior time, setting that specific timeout wasn't yet a recognized, assigned *duty* for that service/team. It was an identified *gap*, not a *breach*.
      *   **"No asteroid hit the rack":** **Does NOT count.** There is no conceivable assigned responsibility or duty for any agent to prevent asteroid strikes (within normal operational contexts). It's a background condition (fortunate absence).
      *   **"Nobody was in the office that day":** **Usually does NOT count** as a *primary cause* under this definition.
          *   *Unless...* there was a specific, documented duty for someone to be physically present in the office that day for critical operations *and* that duty wasn't fulfilled or delegated appropriately (e.g., a security guard role wasn't covered). Then the *breach of the presence duty* could be causal.
          *   *Otherwise,* it's a background condition (low staffing level) or potentially a *contributing factor* to why another omission happened (e.g., "no one reverted" *because* no one was present, but the root cause is the failure of the on-call/response *duty* itself, not the absence of bodies).

  4.  **What it is NOT (The Edges):**
      *   **NOT Causation by Omission (general):** That's the broader philosophical debate about whether *any* absence can be a cause. You're past that. You accept omissions *can* be causes, but you're defining *which specific ones* count in a practical context.
      *   **NOT Simple Counterfactual Dependence:** Saying "if X had happened, the incident wouldn't have occurred" (e.g., "if an asteroid hit, the incident would have been worse," or "if a timeout was set, it wouldn't have failed") is necessary but *not sufficient*. The asteroid counterfactual is true but irrelevant to causation because there's no *duty* involved. Responsibility-Dependent Causation adds the normative filter.
      *   **NOT Blame Assignment:** While related, this is about *causal explanation within a system of expectations*. It identifies *where the system of responsibilities broke down* as a cause. Blame is a separate, often punitive, step applied to agents *after* this causal link is established.
      *   **NOT Physical Causation:** This is specific to socio-technical systems involving human agents and designed processes with assigned roles. It doesn't apply to purely physical phenomena (e.g., "the bridge collapsed because there was *no* supporting beam" – here the absence *is* the direct physical cause, no duty needed).

  5.  **Why Your "Gaps" Column Works (and Doesn't Hide the Issue):**
      *   It *implements* Responsibility-Dependent Causation. "Causes" = Events + **Omissions tied to breached duties**.
      *   "Gaps" = Absences where *no duty existed* or where a duty *should be created* (like the earlier "we should add a timeout" recommendation). It separates the *current breach* from the *potential future duty*.
      *   **It doesn't hide it; it formalizes the normative filter.** The act of deciding what goes in "Causes" vs. "Gaps" *is* the act of applying the "Responsibility-Dependent" criterion. The template forces the explicit consideration: "Was there a *duty* to do this thing that wasn't done?" If yes, Cause. If no, or if the duty needs to be created, Gap/Recommendation.

  **In Summary:**

  You are observing **Responsibility-Dependent Causation (of Omissions)**. It means: **An absence only gets labeled a "cause" in an incident review when it represents the violation of a specific, pre-existing assigned responsibility or duty.** The "picking" is driven entirely by the *normative context* (roles, duties, agreements) present at the time of the review, not by the physical facts alone. Your template effectively codifies this principle by requiring "causes" to be events or duty-breaching omissions, pushing other absences into "gaps." This isn't hiding the issue; it's providing a practical, accountable framework for making the necessary distinction.
