prompt: |-
  I am a professor of philosophy and, for the past three years, the ethics adviser to my university's clinical research partnership at a teaching hospital in a West African city, where our local staff describe a small gift to someone who has helped you as ordinary etiquette and describe going through a fixer or a well-placed relative as simply how anything gets done here. I am asked to rule on ten or twelve matters a year, and I want a procedure rather than a policy statement: ordered questions, what counts as a sufficient answer to each, where the procedure stops with a refusal, and where it must hand the decision to a named person because the remaining question is one of values rather than of fact.

  Two constraints shape it. First, it has to be runnable by our site coordinator, a senior nurse with no training in ethics, in about half an hour, from a written record, with me unreachable by phone. Second, it may not simply export our home university's compliance list: the site reasonably rejects the suggestion that a goat, a length of cloth, or a bottle given after the fact is the moral equivalent of an envelope of cash, and it is equally unmoved by our monetary threshold.

  I want the procedure built on the thought that corruption is not a class of objects but a capture of a role's discretion by a loyalty the role was created to exclude, so that a bribe, a clientelist relationship, and a gift are one phenomenon at different durations, and the operative test is whether a consideration entered a decision that the role's point excludes, asked from the standpoint of whoever loses by it. It must also handle the case where refusing is not neutral, because to decline the gift is to decline the relationship the work depends on.

  Apply it to three cases: a family giving the study nurse who recruited their child a chicken and a bottle of schnapps once the child's treatment has ended; our site director proposing to award the sample-courier contract to his wife's brother's firm, which is also the only firm that reliably reaches the district, disclosed and declared irrelevant by him; and a foreign partner university offering our medical school's dean, who is deciding whether to renew their memorandum, an all-expenses-paid week at the resort hotel where the signing is to take place. I suspect one of these will come out the way I would rather it did not; say which, and whether that is a defect in the procedure or in my expectation. Finally, state plainly what the procedure cannot settle, in particular whether the standard it applies is ours, theirs, or something it has quietly introduced of its own.
reasoning: |-
  Hmm, the user is a philosophy professor and ethics adviser for a clinical research partnership in West Africa. They need a practical decision-making procedure for handling local gift-giving and relationship-based transactions that their university's compliance policies can't adequately address. 

  Key requirements emerge: 
  The procedure must be operable by a senior nurse in 30 minutes using written records alone. It must avoid cultural imperialism while still preventing genuine corruption - defined not by object type but by whether external loyalties compromise role integrity. Three test cases illustrate the tension between local norms and institutional ethics.

  I'm building the framework around the professor's corruption-as-role-capture theory. The core diagnostic question becomes: "Does this benefit create loyalty that should be excluded from this role's decisions?" Operationalizing this requires: 
  - Distinguishing between relationship-maintenance (often acceptable) vs decision-influencing (problematic)
  - Assessing harm to excluded parties
  - Recognizing when refusal itself causes harm

  For implementation: 
  A five-step flowchart works best - starting with documenting facts, then assessing intention, harm, refusal consequences, and finally role-discretion impact. Clear yes/no thresholds at each stage make it nurse-executable. The chicken/schnapps case likely passes; the courier contract requires third-party review; the dean's resort stay fails - which may discomfort the professor but shows the procedure working.

  Crucial limitations: 
  The standard is neither "ours" nor "theirs" but the procedure's own role-integrity principle. It can't resolve when roles fundamentally conflict, or when local harm definitions differ. These must escalate to human judgment - precisely what the professor wanted to systematize.
answer: |-
  Here is a procedure designed for your constraints and philosophical framework, followed by application to the cases and limitations analysis:

  ---

  ### **Ethical Decision Procedure: Role-Discretion & Harm Test**  
  *(For Site Coordinator; ~30 mins using written record)*  

  #### **Step 1: Document Facts**  
  *   **Question:** *What benefit was given/offered, by whom, to whom, when (before/during/after role-action), and what role-action was involved?*  
  *   **Sufficient Answer:** Uncontested description from records. If unclear → **STOP: REFUSE**.  
  *   **Output:** Clear timeline of benefit vs. role-action.  

  #### **Step 2: Assess Intention & Relationship**  
  *   **Question:** *Does the benefit reflect an existing personal/family/cultural relationship unrelated to the role?*  
      *   *If NO:* → Proceed to Step 3.  
      *   *If YES:* → *Is the benefit customary for this relationship (e.g., holiday, life event) and not tied to a specific role-action?*  
          - **YES + No role-action link** → **ACCEPT**.  
          - **NO or Role-action link** → Proceed to Step 3.  
  *   **Sufficient Answer:** Local staff attestation of cultural norm *or* documentation of prior similar exchanges unrelated to work.  

  #### **Step 3: Harm Test**  
  *   **Question:** *Who loses if this benefit is accepted? Identify the excluded party.*  
      *   *E.g., Other vendors, patients not offering gifts, taxpayers, study integrity.*  
  *   **Sufficient Answer:** Specific group/individual disadvantaged by the exchange. If none → Proceed to Step 4.  
  *   **Harm Found?**  
      *   YES → Proceed to Step 4.  
      *   NO → **ACCEPT** (No corruption per framework).  

  #### **Step 4: Refusal Consequences**  
  *   **Question:** *Would refusing the benefit damage a relationship essential to the role’s function?*  
      *   *E.g., Community trust, access to remote areas, key partnerships.*  
  *   **Sufficient Answer:** Evidence that refusal would sabotage core operations (e.g., past breakdowns, local staff testimony).  
  *   **Outcome:**  
      *   Essential relationship at risk → **ESCALATE TO [NAMED PERSON: e.g., Dean]** for values-based decision.  
      *   No essential risk → **REFUSE**.  

  #### **Step 5: Role-Discretion Capture**  
  *   **Question:** *Did the benefit influence a decision the role was designed to shield from external loyalties?*  
      *   *E.g., Hiring, contracting, patient selection, regulatory approval.*  
  *   **Sufficient Answer:** Benefit preceded decision *and* decision diverged from standard criteria without justification.  
  *   **Outcome:**  
      *   YES → **REFUSE** (Corruption per framework).  
      *   NO → **ACCEPT**.  

  ---

  ### **Application to Cases**  
  1. **Family’s Chicken & Schnapps to Nurse:**  
     - Step 1: Gift after treatment ended. No pending role-action.  
     - Step 2: Customary gratitude for child’s care; no decision link. → **ACCEPT**.  

  2. **Site Director’s Brother-in-Law’s Courier Firm:**  
     - Step 1: Contract award proposed to relative’s firm.  
     - Step 3: **Harm:** Other firms lose opportunity; study risks bias.  
     - Step 4: Refusal may not harm operations (if alternatives exist).  
     - Step 5: Role must exclude family loyalty in procurement. → **REFUSE** unless escalated.  
     - Step 4 Escalation: If no other reliable courier → **ESCALATE TO DEAN** (values call: efficiency vs. fairness).  

  3. **Dean’s Resort Stay from Foreign Partner:**  
     - Step 1: Benefit offered before MOU renewal decision.  
     - Step 2: Not a cultural gift; tied to partnership decision.  
     - Step 3: **Harm:** Other universities lose impartial consideration.  
     - Step 5: Role must exclude vendor loyalty in partnerships. → **REFUSE**.  

  ---

  ### **Suspected Problem Case & Analysis**  
  - **Problem Case:** **Courier Contract** (Case 2) if refusal harms operations.  
  - **Outcome:** The procedure forces escalation ("efficiency vs. fairness"), *not* automatic refusal.  
  - **Defect in Expectation:** You likely hoped for a clear "no" but the procedure admits contextual necessity. This is a **strength**, not a defect: it avoids absolutism where refusal causes systemic harm.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Values Conflicts:** When "harm" or "essential relationship" is contested (e.g., Is excluding local firms harmful if inefficient?). Must be escalated.  
  2. **Defining "Role’s Point":** The standard is **neither ours nor theirs** but **introduced by the procedure**:  
     - It assumes roles exist to serve impartial goals (study integrity, public good).  
     - This may clash with local views where roles serve kinship networks. The procedure silently prioritizes institutional integrity over relational ethics.  
  3. **Hidden Power Structures:** Cannot address whether the "losing party" (Step 3) is itself unjust (e.g., marginalized groups excluded by "custom").  

  ---

  ### **Summary**  
  This procedure converts your corruption-as-role-capture theory into nurse-executable steps, avoids cultural imperialism by using local input (Steps 2/4), and flags values conflicts for escalation. Its core limitation is imposing a universalist view of institutional roles—which your framework requires but local practice may reject.
