  Starting with the bridge principle: The key difference is causing vs. allowing harm. Taurek focuses on not aggregating lives when you can't save all, but Omelas requires active, sustained harm for benefit. To connect them, we need to ask if Taurek's non-aggregation extends to benefits derived from harm. If Taurek rejects summing harms, can he consistently accept summing benefits from harm? Probably not, because both involve interpersonal comparisons he rejects. This bridges the cases but shows Taurek's framework struggles with Omelas's active harm.

