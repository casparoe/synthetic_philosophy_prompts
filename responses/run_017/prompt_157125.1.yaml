prompt: |-
  I'm in a graduate seminar on Wittgenstein's On Certainty, and after class two classmates got into an argument that nobody else in the room could referee. The case they were arguing over: now that cheap, convincing synthetic video is everywhere, is the assumption that video recordings are generally reliable records of what happened — one of what the secondary literature calls hinges — actually in the process of shifting?

  Maya: On Wittgenstein's picture that assumption was never a hypothesis confirmed by evidence. You can't check a recording without relying on other records and on other people's reports, so the demand to verify it is a regress rather than a question, and there is no such thing as answering it. That means the deepfake situation isn't new evidence bearing on a belief; it's a change in what we can do — practices of settling disputes by footage are becoming unworkable. And Wittgenstein allows that what is firm can silt up and move over time, so the honest description is that the hinge may be eroding, with no question of whether that erosion is justified.

  Tom: If being a hinge just means standing outside the game of reasons, then hinge talk can't tell this case apart from the conspiracist who takes it as certain that every official record is fabricated and treats your evidence as part of the fraud. He too reports an unshakeable certainty. Your only comeback is that our community happens to rely on footage — a sociological fact about us, not a reason. So hinge epistemology either collapses into relativism or is conservatism with better vocabulary.

  Maya: That misdescribes what a hinge is. Hinges show up in what people do, not in what they say they're certain of: we find our way by photographs, we settle insurance claims with footage, and a community that declared all recordings unreliable while going on relying on them in practice would have said nothing at all. The conspiracist's certainty is idle in exactly that way — it changes nothing about how he finds out whether his train was cancelled. That is a principled distinction, not head-counting.

  Tom: But "makes no difference in practice" is an ordinary empirical test, and it is doing justificatory work. You are saying, in effect, that reliance on records has worked and still mostly works, and that where it stops working we revise — which is plain evidential reasoning about reliability, available for any proposition. So the view is unstable: either hinges sit outside reasons and you have no criticism of the conspiracist, or they answer to reasons and nothing distinctive remains — it is just the old problem of induction in new words.

  Please adjudicate this move by move: for each of the four contributions, say what is right and what is mistaken, and then say what both of them are missing. I'd especially like to know whether hinge epistemology has any principled way to distinguish a hinge that is genuinely eroding from one a conspiracist merely declares dissolved.
reasoning: |-
  Okay, the user is in a graduate seminar on Wittgenstein's On Certainty and presents a debate between two classmates, Maya and Tom, about whether the reliability of video recordings is a hinge that's eroding due to deepfakes. The user wants me to adjudicate their arguments move by move and explain what both are missing, especially whether hinge epistemology can distinguish genuine erosion from conspiracist declarations.

  First, I need to recall Wittgenstein's concept of hinges from On Certainty. Hinges are certainties that aren't based on evidence but are the framework within which evidence and doubt make sense. They're shown in actions, not beliefs. Examples include "The world exists" or "My name is such-and-such." They're not justified but are the background for justification.

  Looking at Maya's first point: She argues that the assumption about video reliability was never a hypothesis confirmed by evidence. She's right that hinges aren't verifiable without circularity—you can't check a video without relying on other hinges. Her point that deepfakes change practices, not provide evidence against a belief, aligns with Wittgenstein's idea that hinges shift with practice changes. However, she might be missing that while hinges aren't evidentially justified, their erosion can involve empirical elements. The change in practices due to deepfakes could be seen as both practical and implicitly evidential.

  Tom's response: He challenges that hinge epistemology can't distinguish between a community's hinge and a conspiracist's certainty. He argues that if hinges are beyond reasons, then there's no principled way to favor one over the other, leading to relativism. He's correct that hinge epistemology struggles with relativism, but he overlooks that hinges are defined by their role in practices, not just subjective certainty. The conspiracist's certainty is idle because it doesn't integrate with action, whereas genuine hinges are operational.

  Maya's rebuttal: She emphasizes that hinges are in actions, not declarations. The conspiracist's certainty doesn't change their practices, like checking train times, so it's not a hinge. This is a strong point because Wittgenstein focuses on action over assertion. But she might underplay that the erosion of a hinge like video reliability does involve empirical factors—practices change because deepfakes reduce reliability, which is an evidential issue.

  Tom's counter: He claims that "makes no difference in practice" is an empirical test, which introduces evidential reasoning, making hinges unstable. If they respond to reliability, then they're just inductive beliefs. He's right that practicality and reliability are intertwined, but he misses that hinges function as necessary presuppositions, not conclusions of induction. Their erosion involves practical breakdown, not just evidence accumulation.

  What both are missing: They don't fully address that hinges are part of a system. The erosion of one hinge (video reliability) depends on other hinges (sensory perceptions, digital evidence). Also, the community's practices adapt, so the hinge might transform rather than disappear. For example, we might develop methods to verify videos, shifting the hinge to include verification processes.

  The key to distinguishing genuine erosion from conspiracist claims is whether the certainty is integrated into practices. The conspiracist's declaration doesn't align with their actions, showing it's not a hinge. Genuine erosion happens when practices consistently fail, leading to new certainties emerging.

  In conclusion, Maya correctly ties hinges to practices, while Tom highlights the risk of relativism. Hinge epistemology avoids collapse by focusing on enacted certainties, not assertions. The distinction lies in the functional role within the community's form of life.
answer: |-
  Here's a move-by-move adjudication of Maya and Tom's debate, identifying what's right, what's mistaken, and what both are missing, concluding with how hinge epistemology can distinguish genuine erosion from conspiracist declarations.

  ### **Maya's First Move**
  *   **Claim:** Video reliability isn't a hypothesis confirmed by evidence; demanding verification causes regress. Deepfakes change *practices*, not evidence. Hinges can "erode" over time without justification.
  *   **Right:**  
      - Correctly identifies hinges as non-evidential, non-hypothetical frameworks (OC 341-343). Verification *does* presuppose other hinges (e.g., senses, memory).  
      - Spot-on about erosion: Wittgenstein explicitly says riverbeds can shift (OC 96-99). Deepfakes *do* disrupt practices (e.g., courts rejecting unverified footage).  
  *   **Mistaken:**  
      - Underplays the role of empirical success in *sustaining* hinges. While hinges aren't *inferred* from evidence, their stability depends on practical efficacy (e.g., "I have two hands" works until paralysis).  
  *   **Missing:**  
      - That hinge erosion isn't automatic. New practices (e.g., digital forensics) might *preserve* the hinge by transforming it ("Reliable video requires cryptographic verification").

  ### **Tom's First Counter**
  *   **Claim:** If hinges are "beyond reasons," hinge epistemology can't distinguish communal reliance on video from a conspiracist's certainty. This collapses into relativism or conservatism.
  *   **Right:**  
      - Validly exposes hinge epistemology's vulnerability to relativism. If certainty is defined by communal practice, what grounds critique of the conspiracist?  
      - Correct that Maya's appeal to "our community" *sounds* sociological.  
  *   **Mistaken:**  
      - Equates the conspiracist's *declared* certainty with a hinge. Hinges are *enacted*, not proclaimed (OC 110, 204). The conspiracist likely still uses GPS (relying on satellites) or reads screens (relying on optics).  
      - Ignores that hinges are *systemic*: rejecting *all* records dissolves countless practices (e.g., science, law), while Maya's erosion is *localized* to video.  
  *   **Missing:**  
      - Hinges aren't arbitrary: they emerge from biological and cultural embeddedness (e.g., trusting senses is adaptive). The conspiracist's position is *parasitic* on hinges they deny.

  ### **Maya's Rebuttal**
  *   **Claim:** Hinges show in *action*, not avowals. The conspiracist's certainty is "idle" (changes no practices), while ours is operational. This is a principled distinction.
  *   **Right:**  
      - Core Wittgenstein: meaning/use lies in practice (OC 204, 559). The hinge "video is reliable" is shown in *using* footage to settle disputes.  
      - Correct that the conspiracist's certainty is idle: they still act on other hinges (e.g., trusting train schedules or eyewitnesses).  
  *   **Mistaken:**  
      - Overstates the "idleness" point. A conspiracist *might* act on their certainty (e.g., burning "fake" documents), but this would still rely on *other* hinges (e.g., fire consumes paper).  
  *   **Missing:**  
      - That "makes no difference in practice" *can* involve empirical calibration. If deepfakes make video *consistently* unusable in courts, the erosion *is* partly driven by practical failure.

  ### **Tom's Final Counter**
  *   **Claim:** "Makes no difference in practice" is an empirical test. If hinges answer to practical success, they're just inductive beliefs—losing distinctiveness.
  *   **Right:**  
      - Correctly notes a tension: if hinge stability depends on practical efficacy, it *resembles* induction.  
      - Valid that Maya's "erosion" narrative implicitly uses reliability assessments.  
  *   **Mistaken:**  
      - Conflates *conditions for persistence* with *justification*. Hinges aren't *inferred* from success; they're the scaffold *for* inference (OC 130-131). Practical failure doesn't "falsify" a hinge—it makes it *unusable*, forcing a shift.  
      - Ignores that induction *itself* relies on hinges (e.g., uniformity of nature).  
  *   **Missing:**  
      - Wittgenstein’s non-propositional view: hinges are more like *rules* (OC 95) than beliefs. Rules aren't "confirmed" by success; they're abandoned when they cause system-wide dysfunction.

  ---

  ### **What Both Are Missing**
  1.  **The Holism of Hinges:** Hinges aren't isolated. Video reliability depends on hinges about light, optics, and technology. Deepfakes erode *one* hinge within a network, while the conspiracist rejects *clusters* of interdependent hinges (e.g., rejecting all records attacks history, science, and social coordination).  
  2.  **Primitive Trust vs. Ideology:** Genuine hinges (e.g., trusting senses) are pre-linguistic and animal (OC 475). Conspiracist "certainty" is a *linguistic ideology* detached from instinctive trust.  
  3.  **Erosion is Asymmetric:** Genuine erosion (e.g., video reliability) manifests as *systemic practical breakdown* (e.g., news/media/courts losing shared verification tools). The conspiracist’s "dissolution" is *selective*, inconsistent, and often self-undermining (e.g., using the internet to "expose" deepfakes relies on hinges about digital infrastructure).

  ---

  ### **Can Hinge Epistemology Distinguish Genuine Erosion from Conspiracist Dissolution? Yes.**
  - **Genuine Erosion:**  
    - Arises from *recurrent practical failure* in core activities (e.g., video evidence consistently *failing* to resolve disputes).  
    - Is *localized* and *gradual*, leading to new practices (e.g., adopting verification tech).  
    - Preserves other hinges (e.g., "some records are reliable").  
  - **Conspiracist "Dissolution":**  
    - Is *global* and *declarative* (e.g., "all records are fake").  
    - *Conflicts* with the conspiracist's own actions (e.g., using ATM receipts or flight schedules).  
    - Serves no practical function—it doesn’t resolve new problems but creates artificial ones.  
  - **The Principled Difference:** **Enacted necessity vs. idle assertion**. A hinge erodes when it *cannot* be enacted in practices essential to a community's form of life. The conspiracist’s certainty is *not enacted*—it’s a linguistic gesture detached from behavior. Hinge epistemology escapes relativism by anchoring certainty in *shared, sustainable practices*, not subjective conviction.

  **In short:** Maya wins on describing how hinges work and erode practically; Tom wins on exposing the risk of relativism but misidentifies conspiracism as a hinge. Both underplay the *holistic, enacted, and adaptive* nature of certainty. The deepfake crisis shows hinges in flux—not because we "lacked evidence," but because our trust in video *no longer smoothly enables the practices it once did*.
