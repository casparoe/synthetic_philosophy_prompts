  Looking at the answer they shared, I need to evaluate both content and structure. The responder uses David Lewis' convention theory effectively - that's sophisticated but appropriate. When they say "the content of the rule is arbitrary... but you have reason to go along" that's spot-on for social conventions. The distinction between Dev's case (no harm) and tipping (actual harm) is well argued too.

  Hmm... but there are gaps. The writer brushes off "when in Rome" as mere prudence without exploring moral implications for visitors. And they mention problematic conventions but don't connect it back to the cases given - that's an unfinished thought. The tipping argument assumes wages rely on tips without evidence - that's speculation.

  For grading: The strong framework deserves high marks, but missing counterarguments and occasional overreach hold it back from top tier. 17/20 feels right - excellent but improvable. My feedback should highlight both strengths ("clear distinction between conventions") and growth areas ("needs to address visitor obligations more deeply").

  I'll structure comments to: 1) Validate their effort 2) Quote specific lines with praise/critique 3) Suggest improvements neutrally. Since the user administers this group, I'll also note that the question could better distinguish moral vs conventional rules - maybe add a third scenario about discriminatory norms next time.
answer: |-
  Here's a comprehensive breakdown of the answer, a suggested mark, and feedback comments you can provide directly to the writer. The answer is strong but has some limitations.

  **Overall Assessment:**  
  This is a **very good** answer (17/20). It demonstrates a sophisticated understanding of conventions, applies theory (Lewis) effectively to the specific cases, makes clear distinctions, and offers critical depth. However, it misses some nuances in the tipping case, slightly misapplies the "when in Rome" principle, and could more fully address the "blame" aspect.

  **Suggested Mark:** **17 out of 20**

  **Feedback Comments for the Writer:**

  Here’s a breakdown of your answer, highlighting strengths and areas for development:

  1.  **"Rules like these are conventions. Following David Lewis, a convention is a solution to a coordination problem... So conventions do generate genuine obligations; they're not just manners."**
      *   **Strength:** Excellent start. You correctly identify the core issue as concerning *conventions* and provide a clear, accurate definition using David Lewis. This is a sophisticated and highly relevant theoretical framework. Your argument that conventions create genuine obligations (not *just* manners) because they solve coordination problems and rely on mutual expectations is sound and well-explained. **Full credit.**

  2.  **"It also follows that the obligation only exists where the coordination is at stake, so if nobody else is affected, the obligation lapses."**
      *   **Strength:** This is a crucial and logically derived point from Lewis's theory. You correctly identify the core function of conventions (coordination) and argue that the obligation hinges on potential impact. **Full credit.**

  3.  **"That's why Dev did nothing wrong... If a convention is just a device for getting us all to the same equilibrium, then a deviation that nobody notices and that upsets no one isn't the sort of thing the convention is there to prevent."**
      *   **Strength:** You perfectly apply the Lewis framework to the Dev scenario. Your reasoning is clear and convincing: no coordination problem arose, no expectations were frustrated, no harm occurred. Your comparison to driving on the wrong side *in traffic* is apt. **Full credit.**

  4.  **"I'd add that he couldn't be blamed anyway, because he's only visiting... What's actually right and wrong for him is still settled by what people in Fenwick think..."**
      *   **Weakness:** This part is less convincing and slightly contradicts your earlier strong argument. The primary reason Dev did nothing wrong *in Marlow* is the lack of impact, *not* primarily his visitor status or his home norms. Saying "he couldn't be blamed anyway" because he's a visitor overstates it. Morality often expects visitors to learn core local conventions *especially* where safety or significant norms are involved (e.g., driving rules, major taboos). Your earlier argument based on *no effect* is sufficient and stronger. Saying his morality is "settled by what people in Fenwick think" risks relativism and undermines the Lewisian argument you just made. **Partial credit** – the visitor point adds context but isn't the core reason and is overstated.

  5.  **"Tipping is different, and there I do think the visitor did something wrong. The café staff in Marlow are paid a wage that assumes tips, so leaving nothing takes money out of somebody's pocket. That's a straightforward harm rather than a breach of etiquette."**
      *   **Strength:** You correctly identify a key difference – potential harm vs. pure coordination. You shift the argument effectively from convention to consequence. **Credit.**
      *   **Limitation/Omission:** While plausible, your claim that "the café staff... are paid a wage that assumes tips" is an *assumption* based on the description (it says tips are pooled and shared, but *not* that wages are lower because of this). The scenario states "service is included," which often (but not always) implies tipping is *not* essential for fair wages. You needed to acknowledge this ambiguity. A good answer might argue that *if* wages are suppressed due to expected tips, it causes harm, but *if* "service included" means fair wages and tips are purely a bonus, it might be closer to a pure convention (though still potentially a fairness/expectation issue). You identified the *potential* for harm well, but didn't fully grapple with the ambiguity. **Partial credit.**

  6.  **"So conventions matter morally in two separate ways: some matter because they coordinate us, and some matter because breaking them makes a person worse off."**
      *   **Strength:** Excellent summary and distinction, clearly tying back to the two cases. This conceptual clarity is a major strength. **Full credit.**

  7.  **"Last thing, though: not every convention deserves to be followed... a rule that only works for one group isn't doing that."**
      *   **Strength:** This adds valuable critical depth, recognizing that conventions aren't inherently moral and can be unjust. It shows good analytical thinking beyond the immediate cases. **Full credit.**
      *   **Minor Omission:** While excellent, it doesn't explicitly link this back to the *blame* aspect of the original question. Could someone be blamed for *breaking* an unjust convention? (Probably not, or even praised). This connection would have strengthened it further, but it's still a strong addition.

  **Why 17/20?**
  *   **Strengths:** Excellent theoretical framework (Lewis), superb application to the Dev case, clear distinction between coordination and harm-based obligations, strong critical thinking on unjust conventions, overall clarity and logical flow.
  *   **Why not higher?**
      *   Overstatement/misapplication of the visitor status argument for Dev (Point 4).
      *   Needed to acknowledge and address the ambiguity in the tipping case regarding wages vs. "service included" (Point 5).
      *   Minor missed opportunity to explicitly link the unjust conventions point back to the core question of blame (Point 7).

  **Feedback on Your Question:**
  It's a very good question! It clearly presents two distinct scenarios testing coordination vs. harm/consequence, and the visitor aspect adds complexity. Two minor thoughts for next time:
  1.  **Tipping Ambiguity:** The phrase "service is included" *can* be ambiguous regarding base wages. You might clarify slightly (e.g., "wages are set assuming tips supplement them" or "wages are fair and tips are an extra bonus").
  2.  **"Blame":** The core question asks "did something wrong" and you later mention "blamed". These are subtly different. "Wrong" focuses on the act itself, "blame" often involves culpability/knowledge. The answer focused on "wrong". Explicitly asking about *blame* might prompt slightly different answers (e.g., even if Dev did something technically "wrong", might he not be *blameworthy* because he didn't know? The answer briefly touched on this but focused more on justification).

  This writer has clearly engaged deeply with the concepts and produced a thoughtful, well-structured response. The mark reflects its high quality while noting the areas where the argument could be tightened or expanded.
