  First, I need to break down the possible meanings of "we only ever know the structure, never the stuff itself." The user wants a menu of precise claims: epistemic (what we can know), ontic (what exists), semantic (what words mean), and the types of structures involved (formal/mathematical vs. causal/nomic). For each, I should assess if it's a platitude, defensible, false, or if it supports the no-extra-ingredients conclusion.

  The user is stuck on two points. First, if structure means formal relations, isn't there a problem that any set of things can fit multiple relational structures? That's the Newman problem from Russell's era. I need to explain that clearly. Second, does the strong ontic claim (no stuff, only structure) make sense without objects to hold the relations? That's the problem of relations needing relata.

  The user's explicit needs are clarification of the claims and their validity, especially regarding the two sticking points. But deeper, they might be seeking tools to counter their roommate's argument effectively. They feel the roommate is equivocating between weak and strong claims. The user might also be interested in the implications for consciousness—whether structural knowledge exhausts reality, leaving no room for qualia as non-structural.

  I should structure the response by first defining key terms: structure as relations, stuff as intrinsic properties. Then outline the claims: epistemic, ontic, semantic, and structural types. For each, evaluate them as platitudes, substantive, true/false, and if they support the roommate's conclusion. Address the Newman problem and the relata issue separately.

  For the epistemic claims, the weak version (theories are mathematical models) is a platitude. Stronger versions (we can't know intrinsic properties) are more controversial. The ontic structural realism (OSR) has moderate and radical versions. Radical OSR denies objects altogether, which faces the relata objection. Semantic claims about meaning being structural might lead to verificationism.

  The Newman problem shows that without constraints, structural descriptions are trivial. This undermines the epistemic claim unless supplemented with causal/nomic structures. The relata issue questions if relations can exist without things being related, challenging radical OSR.

  For the consciousness debate, the roommate's move from the weak epistemic claim to the strong ontic conclusion is invalid. The weak claim doesn't imply that intrinsic properties don't exist or that structure is all there is. Consciousness might involve intrinsic aspects not captured by relational structures.

