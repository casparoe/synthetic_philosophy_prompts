answer: |-
  Below is an evaluation of each sorites response theory against "resolution drift" — the phenomenon where the width of the borderline band for vague predicates (e.g., "heap," "tall") shifts based on practical purpose or context. Scores (0–100) reflect how well each accommodates **both clear-case confidence and purpose-sensitive borderline width** without collapsing into speaker-relative subjectivism. Justifications specify whether drift is located in semantic content (S) or use (U).  

  1.  **Epistemicism (e.g., Williamson):**  
      **Score:** 10/100  
      **Justification (U):** Denies borderline vagueness is real (insists sharp but unknowable boundaries exist), so it attributes drift entirely to *epistemic limitations in use*, failing to explain why borderline width *systematically* shifts with purpose.  

  2.  **Supervaluationism (e.g., Fine):**  
      **Score:** 40/100  
      **Justification (S):** Borderline cases are those where "precisifications" disagree; clear cases have universal agreement, but the *range* of precifications (defining borderline width) is fixed semantically, making purpose-driven drift *unexplained* (though contextualists extend it).  

  3.  **Subvaluationism/Glut Theory (e.g., Hyde):**  
      **Score:** 30/100  
      **Justification (S):** Allows truth-value "gluts" in borderlines, but the *scope* of gluts is typically treated as static in the semantics; purpose-driven adjustments to glut width are unaddressed.  

  4.  **Degree Theory/Fuzzy Logic (e.g., Łukasiewicz):**  
      **Score:** 70/100  
      **Justification (S/U):** Borderline width corresponds to degrees of truth (e.g., 0.2–0.8), so *semantic* thresholds can be shifted by context/purpose (e.g., stricter "tall" thresholds for Olympic trials vs. casual chat), explaining drift naturally.  

  5.  **Contextualism (e.g., Raffman, Shapiro):**  
      **Score:** 95/100  
      **Justification (S):** Explicitly ties predicate application to contextually set standards, directly explaining resolution drift as *semantic content* dynamically adjusting to practical goals (e.g., "heap" narrows for lab use, widens for silos).  

  6.  **No Determinate Extension (e.g., Unger):**  
      **Score:** 5/100  
      **Justification (U):** Claims vague predicates lack extensions entirely, reducing all judgments to pragmatic use; this ignores stable clear cases and treats drift as universal speaker relativity.  

  ---  

  ### If Resolution Drift = Ordinary Context-Sensitivity (like "flat" or "empty"):  
  **Most Sharply Revised Score:** **Epistemicism**  
  **Direction:** **10 → 0**  
  **Reason:** If drift is mundane context-sensitivity, epistemicism’s insistence on *fixed* sharp boundaries becomes indefensible — context-driven boundary shifts contradict its core tenet that vagueness is purely epistemic ignorance about static thresholds.
