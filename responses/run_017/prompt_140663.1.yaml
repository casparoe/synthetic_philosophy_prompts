answer: |-
  Here's your Kant-to-lab-vet translation, using your operational vocabulary and addressing all cases directly. I'll strictly preserve Kant's non-consequentialist structure (no smuggling in "cost to the animal" as an intrinsic ledger entry).

  ### 1) Kant's Original Position Translated
  *   **Moral Standing:** Animals have no intrinsic moral standing. "Welfare state" isn't a cost/benefit *in itself*. Only rational beings (humans) are ends-in-themselves.
  *   **Refinement:** Reducing animal distress is a **duty to refine *human character***. Gentle handling isn't *for* the mouse; it's practice for maintaining the technician's compassion and preventing desensitization, which is owed *to humanity* (including oneself). Rough technique risks *blunting human moral faculties*.
  *   **Severity Banding (Mild/Moderate/Severe):** Bands track **risk of brutalizing the human agent**. "Severe" procedures pose high risk of coarsening empathy or normalizing suffering. "Mild" poses low risk. The animal's experience *per se* doesn't define the band; the *human character impact* does.
  *   **Harm (in Harm-Benefit Analysis):** The **harm side *is* the risk of moral corruption to humans involved.** Potential damage to technicians'/scientists' sympathy, compassion, or respect for life. Animal suffering is only harmful *instrumentally* – as a *cause* of this human harm. The ledger entry is **"Risk of degradation to human moral capacity."**
  *   **Humane Endpoints:** Primarily about **preventing extreme human exposure** to degradation. Ending severe suffering limits the *human* moral hazard. The animal's relief is a side-effect, not the primary ethical goal.
  *   **Cumulative Severity:** Matters only if **cumulative exposure risks cumulative desensitization** in humans. Low-grade chronic stress matters ethically only if it *normalizes* indifference for caretakers.
  *   **Cost to the Animal:** Not an independent ethical unit. Only exists as a **potential catalyst for human moral harm.**

  ### 2) Modern Kantian Repair (e.g., Korsgaard) Translated
  *   **Core Move:** Valuing our *own* rationality (our ability to set ends/goods) commits us to valuing the *good* of any being for whom things *can* be good or bad (i.e., sentient creatures). Animals *are* ends-in-themselves **because we must value their good if we value ours.** Their welfare *is* intrinsically a ledger item.
  *   **Moral Standing:** Animals gain **derivative but direct moral standing**. Their welfare state going badly *is* a direct wrong *to them* because we are rationally committed to valuing their good. "Cost to the animal" **is** a valid ledger entry.
  *   **Refinement:** Reducing distress is **a direct duty *to* the animal**, stemming from valuing *its* good. Gentle handling is *for* the mouse *because its suffering matters intrinsically* (via our commitment to valuing goods).
  *   **Severity Banding:** Bands track **the animal's own experience** (pain, distress, loss of function). "Severe" means *its* welfare is severely compromised. This *is* the direct harm.
  *   **Harm (in Harm-Benefit Analysis):** The **harm side *is* the negative welfare impact on the animal itself** (pain, distress, deprivation). Harm *to the animal* is intrinsically a cost in the ledger. *Human* character impact is a *separate*, additional potential harm.
  *   **Humane Endpoints:** Primarily about **alleviating *the animal's* suffering/disadvantage** as a direct ethical goal.
  *   **Cumulative Severity:** Matters because **the animal's lifetime experience matters intrinsically.** Chronic low-grade stress *is* a welfare cost *to it*, regardless of human observation.
  *   **Cost to the Animal:** **Is the fundamental ethical unit.** It *is* the direct wrong when inflicted without sufficient justification. Harm-benefit *requires* weighing this cost against the benefit.
  *   **Your Suspicion (Collapse):** **Half-Correct.** It *does* functionally center on sentience ("for whom things can be good or bad") as the ledger-starting point. **The non-collapsed part:** The *justification* isn't sentience *per se* (a scientific fact), but a *normative commitment* we supposedly *must* make due to valuing our own rationality. This adds a layer of argument about *why* sentience matters ethically, but the *operational outcome* for your ledger is very similar: "Sentience is where the ledger starts."

  ---

  ### Residue Report: Applying the Translations to Your Cases

  **(a) Unobserved Suffering (Refined, Automated, 3am)**
  *   **Kant Original:** **Costless in the ledger.** No human agent is present to be brutalized. The animal's suffering isn't a *direct* wrong. The procedure's *design* might still be scrutinized for *potential* character impact on those who *authorized* it or *interpret* data, but the 3am event itself adds no ledger cost.
  *   **Modern Kantian:** **Full cost in the ledger.** The animal suffers; its welfare is compromised. This *is* the direct harm, regardless of observation or human character impact. Your ledger reflects it accurately.
  *   **Residue Analysis:** **Hole in Kant's Original Vocabulary.** It cannot account for the intrinsic wrong of unobserved suffering. Your framework identifies a real cost; Kant's original does not. This is a weakness *of Kant's original position* for your context.

  **(b) Uncorrupted Technician (100 Gavages, Decent Colleague)**
  *   **Kant Original:** **Potentially costless *on the character-harm ledger*.** If rigorous metrics show *zero* blunting (no measurable desensitization, maintained empathy), and the actions were performed skillfully/calmly, then the core harm Kant identifies *isn't present*. There might be a *residual* concern about the *symbolism* or *normalization* of the *practice* of gavage within the institution potentially affecting *others'* character, but for *this specific tech*, the procedure appears costless *on his terms*.
  *   **Modern Kantian:** **Significant cost remains.** The cost is the **distress/potential harm *to the animal* during each gavage.** The tech's character is irrelevant to *this* cost. It remains a ledger item. Refinement is still a duty *to the animal*.
  *   **Residue Analysis:** **Sign the Kantian Claim Was Never Clear.** Kant's focus *only* on character harm creates ambiguity here. Is "character damage" only measurable blunting? Or is performing the act *itself*, if perceived as "violent" or "imposing suffering," inherently degrading *regardless* of measurable effect? Kant's original text leans towards the latter, suggesting acts like shooting a dog *are* wrong *because* they violate a duty to oneself regarding cruelty, even if done "humanely" and without measurable blunting. **Your Problem (Operationalizing 'Damage to Humanity'):** Yes! Kant's "duty to humanity in one's own person" is vague. Does it mean: A) Measurable psychological change? B) Violating a principle of non-cruelty *in action*? C) Something else? Kantians debate this. For *protocol review*, (A) is measurable but arguably too narrow; (B) is clearer conceptually but hard to define objectively. **This ambiguity is a major hole *in applying* Kant's original view practically.**

  **(c) Cumulative Severity (Low-Grade, Unnoticed Lifetime Distress)**
  *   **Kant Original:** **Only cares if it risks human desensitization.** If the low-grade stress is truly invisible/unnoticed by humans and doesn't subtly normalize indifference in caretakers/vets/reviewers, then it has *no ethical cost* on Kant's ledger. The animal's lifetime experience doesn't register intrinsically.
  *   **Modern Kantian:** **Cares intrinsically.** The **animal's prolonged negative welfare state *is* the cost.** Minimizing this cumulative burden is a direct ethical duty *to the animal*, part of refinement. Your framework captures it correctly.
  *   **Residue Analysis:** **Hole in Kant's Original Vocabulary / Sign of Borrowing?** Kant's original view genuinely *doesn't* care about this low-grade animal cost *in itself*. If a modern Kantian *does* care, it's because **they have adopted the Modern Repair (or borrowed your sentience-centric view), not because original Kant demands it.** They haven't *quietly* borrowed; the Modern Repair *explicitly* incorporates the animal's good.

  **(d) Replacement (Animals vs. In Silico)**
  *   **Kant Original:** **Erases the (character) wrong.** Replacing animals with in silico models eliminates the *activity* that risks brutalizing humans. There is no longer a duty *regarding* animals because no animals are used. The ethical concern (character degradation) vanishes. Replacement is *only* about protecting humans from moral harm.
  *   **Modern Kantian:** **Reduces/eliminates the (animal welfare) wrong.** Replacement avoids causing harm *to sentient beings*. This is a direct ethical benefit *for the animals* that would otherwise be used. Replacement is *primarily* about the animals.
  *   **Residue Analysis:** **Fundamental Disagreement Exposed.** The disagreement shows up starkly in the **justification for replacement.** For Kant Original: "Replacement prevents human moral corruption." For Modern Kantian (and You): "Replacement prevents animal suffering." Your framework names a cost (animal suffering) that Kant Original doesn't recognize *as a direct wrong*. This is a core difference, not a translation failure.

  ---

  ### Key Takeaways on Residue & Your Question

  1.  **'Damage to Humanity' Operationalization:** This is **primarily Kant's problem (or the interpreter's), not yours.** His concept is philosophically deep but operationally fuzzy. Does it require measurable psychological change? Adherence to abstract duties? Potential risk? Kantians struggle to make it concrete for policy. Your "cost to the animal" is *more operational* for animal welfare oversight.
  2.  **Holes vs. Borrowing:**
      *   **Kant Original** has **genuine holes** for your work: unobserved suffering, cumulative low-grade distress, and the intrinsic wrong of animal harm are invisible to it. It *cannot* capture these costs without violating its core principles.
      *   **Modern Kantian Repair** largely **collapses into your sentience framework** operationally. The justification differs (commitment from valuing rationality vs. intrinsic value of sentience), but the ledger entries ("cost to the animal") and priorities (refinement for the animal, humane endpoints for the animal) align.
  3.  **Preserving Kant:** I haven't turned him consequentialist. Kant Original's ledger *only* holds "Risk of Human Moral Corruption." The animal's experience is causally relevant only insofar as it *might cause* that corruption. The Modern Repair's ledger *does* hold "Cost to Animal," justified *deontologically* via the commitment argument, not consequentially (it's not about *maximizing* welfare, but *respecting* the animal's good as an end we are committed to valuing).

  **In short:** Your "cost to the animal" ledger is incompatible with Kant's original view but aligns well with the Modern Kantian Repair. The biggest practical gaps in translating *original Kant* are unobserved suffering, uncorrupted agents, and cumulative low-grade welfare impacts – these are holes *in his framework* for your purpose. Operationalizing 'damage to humanity' remains philosophically and practically challenging.
