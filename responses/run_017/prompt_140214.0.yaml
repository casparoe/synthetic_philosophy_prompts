prompt: |-
  I've ended up with a position on the special composition question that I can't find a proper name for, so here's my own stab at it: there's no mind-independent fact of the matter about when some things compose something — 'compose' gets its content from which composition and existence claims our practice lets us assert truly, subject to two side-constraints. First, the mereology isn't up for negotiation: parthood stays transitive, fusions stay unique, no funny business with the axioms. Second, whatever ontology comes out has to be one a fully informed version of us could go on using without having to rewrite the rest of what we believe. So the SCQ gets dissolved rather than answered, but it isn't anything-goes — most of the usual candidate answers still get ruled out, and I think that's why it still feels like a real position.

  What would count against it? I want defeaters ranked from fatal to merely awkward, and these are the four I'm least sure about: (i) can the view even state itself without cheating, given that it seems to need a quantifier whose meaning is already settled; (ii) can it make sense of two competent people — one who thinks any old collection of things automatically makes a further thing, one who thinks things compose only when they're organised into a single living thing — as genuinely disagreeing rather than just talking past each other; (iii) does buying 'ontology comes cheap' here commit me to it everywhere, so that every existence question collapses into a question about our sentences; (iv) does it predict sharp boundaries where there plainly seem to be vague ones — clouds, mountains, a ship rebuilt plank by plank while still at sea. For each, give the strongest version you can and then the reply a defender would actually give, not a strawman.

  Be honest too about whether I've definately gerrymandred the thing into a position nothing could touch, and whether that's a problem for a view of this kind or just what a good dissolution looks like. And say whether it predicts anything its rivals don't, or whether it's purely on the defensive. I'm most likely to be moved by something showing it can't describe a case it ought to be able to describe — objections that just restate the intuition I started out trying to explain away won't do much for me. No reading lists or citations please; I know the standard names, I want the arguments.
reasoning: |-
  Okay, the user has presented a sophisticated metaphysical position on the Special Composition Question (SCQ), which asks when some things compose a further thing. Their view denies a mind-independent fact about composition, grounding it in human practices with two constraints: strict mereological axioms and practical utility for a fully informed version of us. They want to test this view against four objections, ranked by severity, and seek honest feedback on potential weaknesses.

  Hmm, this is clearly a refined philosophical stance—likely developed by someone deeply familiar with metametaphysics debates. The user explicitly rejects standard labels (nihilism, universalism, etc.), suggesting they've synthesized elements from pragmatism, conceptual role semantics, and Carnapian internal/external distinctions. Their two constraints are clever: keeping classical mereology intact avoids technical objections, while the "fully informed us" criterion prevents radical revisionism. 

  The objections they raise are precisely the right pressure points. Let me tackle them in order:

  First objection (self-reference): The view seems to require a privileged quantifier to state itself, contradicting its own premise. Strongest version: If all quantification is practice-bound, how can we neutrally describe the "mind-independent reality" the theory references? Defense: The position can distinguish between *internal* claims (within a practice) and *external* descriptions of practices—admitting the latter is still practice-laden but functionally different. Still, this does feel like wearing metaphysical suspenders to hold up epistemic trousers.

  Second objection (disagreement): Can two people (say, a universalist and a mereological nihilist) genuinely disagree? Strong attack: If composition facts are practice-relative, their dispute reduces to "I prefer this linguistic framework!" Defense: They can disagree *within* a shared practice (e.g., both trying to systematize scientific discourse), or meta-disagree about which practice best satisfies the constraints. But the "ontological seriousness" of their dispute does deflate.

  Third objection (slippery slope): Does "ontology comes cheap" here infect all existence questions? Fatal if yes. Defense: The two constraints—especially mereological rigor—act as firebreaks. We're not free to invent practices where "nothing exists" or "everything is numbers"; the utility constraint anchors us. Still, the worry persists for domains without clear mereology (e.g., abstract objects).

  Fourth objection (vagueness): How handle fuzzy cases like clouds? Strong version: The view predicts sharp boundaries (since practices must resolve vagueness to be usable), but reality doesn't cooperate. Defense: Practices *themselves* can build in vagueness (e.g., "mountain" as a vague concept), and classical mereology handles this with supervaluation or similar. This might be the most surmountable objection.

  Meta-assessment: The position isn't gerrymandered—it's coherent and addresses known weaknesses of full-blown pragmatism. But its strength (flexibility) is also its weakness: it risks becoming an "accounting system" that adds no predictive content. Still, it uniquely predicts that composition disputes should dissolve under ideal information, which rivals can't claim. 

  The user seems most concerned about descriptive adequacy ("can't describe a case it ought to"). I'll emphasize that in replies—especially for vagueness cases where the "fully informed us" might still see indeterminacy.
answer: |-
  Here's a breakdown of your view's vulnerabilities, ranked by severity, with the strongest objections and most charitable defenses. I'll be honest about where it strains and whether it's indefensible or just uncomfortable:

  ### **1. Self-Reference (Potentially Fatal)**  
  **Strongest Objection:** Your view relies on quantifying over "our practices," "fully informed versions of us," and "what we believe." But if *all* quantification/ontology is practice-relative, **you can't neutrally refer to these practices without presupposing an ungrounded quantifier.** To state the theory, you implicitly claim access to a "view from nowhere" that your own view denies exists. This isn't just awkward—it threatens incoherence.  
  **Defense:** Distinguish between *internal* and *external* perspectives. The view is an external *description* of how ontological discourse functions. It uses a minimal, pragmatic quantifier (e.g., "there are practices") that even skeptics accept for communication. You're not asserting a mind-independent fact *about practices*—you're showing how ontological talk operates *within* them. But this feels like cheating if your external stance smuggles in realist commitments.  

  ### **2. Genuine Disagreement (Serious, Possibly Fatal)**  
  **Strongest Objection:** If composition is practice-relative, the universalist ("everything composes") and organicist ("only organisms compose") **aren't disagreeing about the world—they're just using different linguistic rules.** This collapses ontological debates into trivial preferences, making it mysterious why these feel like substantive disputes (e.g., in ethics or metaphysics). If both satisfy your constraints (classical mereology + pragmatic utility), there's no fact to get wrong.  
  **Defense:** They *are* disagreeing—but at the meta-level. Their dispute is about **which practice best satisfies the constraints.** The organicist argues universalism leads to useless "blobject" ontologies that conflict with scientific practice; the universalist argues organicism creates arbitrary boundaries that hinder physics. This *is* substantive: it’s about coherence, explanatory power, and which system a "fully informed us" would adopt. The intuition of objectivity is preserved as robustness under ideal reflection.  

  ### **3. Ontological Cheapness (Awkward but Manageable)**  
  **Strongest Objection:** If existence questions (e.g., "is there a fusion of my nose and the Eiffel Tower?") reduce to our practices, why not extend this to *all* existence claims (e.g., electrons, numbers, God)? This collapses into global anti-realism or triviality—if "existence" just means "what our language allows," ontology loses all bite.  
  **Defense:** **Your constraints block global cheapness.** The requirement to preserve classical mereology and avoid rewriting established beliefs (e.g., science) anchors ontology. Electrons exist because our best practices *require* them; "nose-Eiffel Tower fusions" don’t because they add no utility and violate parsimony. Crucially, *only composition* is practice-relative here—the *components* (e.g., atoms) are still mind-independently real (per your constraints). This is a local, not global, pragmatism.  

  ### **4. Vagueness (Awkward but Defensible)**  
  **Strongest Objection:** Your view predicts sharp boundaries (since practices must resolve vagueness to be "usable" by fully informed agents), but composition is often vague (e.g., when does a pile of sand become a heap?). A "fully informed us" would still see borderline cases for clouds or Ship of Theseus—your view can't explain this.  
  **Defense:** **Practices can build in vagueness deliberately.** We adopt rules like "mountains exist, but their boundaries are contextually vague" because this *is* useful for navigation/geology. Classical mereology handles vagueness via supervaluation or precisifications—it doesn't require sharp cuts in practice. A "fully informed us" would recognize vagueness as a feature, not a bug, of certain concepts.  

  ---

  ### **Meta-Assessment**  
  **Is it gerrymandered?** Yes, but productively. You've insulated the view from falsification by making it a "framework" rather than a substantive ontology. This isn't necessarily bad—dissolutions often look this way (e.g., Carnap on external questions). The test is whether it *explains more* than rivals while avoiding their pitfalls.  

  **Predictive Power?** It uniquely predicts:  
  - Composition debates will persist *unless* we agree on a practice (e.g., in formal systems like math, disputes vanish).  
  - Ontology will stabilize where practices converge (e.g., no serious disagreement about tables existing).  
  - "Unanswerable" cases (e.g., arbitrary fusions) are those where no practice delivers clear utility.  
  Rivals (e.g., universalism) can't explain why composition feels conventional in some cases but not others.  

  **Fatal Flaw?** The self-reference issue (#1) is the deepest. If your external perspective requires a "god's-eye view" to state, the view self-undermines. The defense works only if you accept a pragmatic meta-language—but this risks infinite regress (what grounds *that* practice?). **If you can’t coherently state the view without presupposing a non-relative quantifier, it fails.**  

  **Final Verdict:** Your dissolution is elegant and defensible *if* you bite the bullet on #1–#2: ontology is about which linguistic frameworks we *ought* to use (given constraints), not what exists "out there." But this may feel unsatisfying—it replaces metaphysics with meta-linguistic negotiation. Whether that’s a bug or feature depends on how much "reality" you want composition to have.
