answer: |-
  **MEMORANDUM**  
  **FROM:** The Interim Committee on the Scientific Status of Historical Sciences (ICSSHS)  
  **TO:** Heads of School, University of West Mercia  
  **SUBJECT:** Reclassification of the Department of Biology  
  **DATE:** 23rd October 2023  
  **REF:** ICSSHS/2023/DEC/04  

  1.  Pursuant to its mandate under Statute 7.12b (Review of Epistemic Foundations), the ICSSHS has completed its triennial assessment of disciplines designated as "Historical Sciences" at the University of West Mercia. This memorandum details the findings and consequential actions pertaining specifically to the Department of Biology.

  2.  The Committee operates under a strict demarcation criterion, as articulated by Sir Karl Popper (1902-1994), wherein a proposition or theory is deemed scientific only if it is empirically falsifiable. That is, it must be logically conceivable that some conceivable observation or experiment could refute it.

  3.  The central theoretical framework of the Department of Biology, commonly termed "the Modern Synthesis" or "neo-Darwinism", rests upon the mechanism of natural selection. After extensive review, including scrutiny of submitted research outputs, grant applications, and undergraduate syllabi (BIO 101, 205, 312), the Committee has determined that the core proposition of natural selection – often summarized as "survival of the fittest" – fails to meet the stipulated falsificationist criterion.

  4.  **Re: The Tautology Concern:**  
      4.1. If "fitness" is defined *exclusively* by actual survival and reproductive success, then the claim "the fittest survive" reduces to "those who survive, survive." This is analytically true and thus unfalsifiable. It provides no testable information about the world.  
      4.2. If "fitness" is instead defined as a propensity for survival/reproduction *in a specified environment* (E), prior to the observation of survival, the proposition becomes potentially testable: organisms possessing trait T are predicted to have higher fitness in E than organisms lacking T.  
      4.3. However, the testability hinges entirely on the independent specification of Environment E. The Committee finds that, in practice, proposed Environments E submitted by the Department for testing hypotheses are consistently reconstructed *from the very biological outcomes* they are invoked to explain. This introduces fatal circularity, rendering the hypothesis effectively unfalsifiable. The Environment E lacks independence.

  5.  **Illustrative Case: Caithness Dune-Wasp (*Vespula dunensis caithnessiensis*) Throat-Patch:**  
      5.1. The Department submitted research (Dawes et al., 2021) proposing the pale throat-patch of *V. dunensis caithnessiensis* is an adaptation for intraspecific signalling in its ancestral dune environment.  
      5.2. The Committee requested the independent specification of the ancestral dune environment (E) against which the signalling advantage could be tested.  
      5.3. The Department submitted palaeoenvironmental reconstruction Alpha (based on sedimentology and co-occurring flora fossils). The Committee noted that under Alpha, the patch could equally plausibly function as camouflage against pale sand or thermoregulation. No observation was proposed by the Department that could definitively falsify the signalling hypothesis *over* these alternatives *within* Alpha.  
      5.4. The Department submitted palaeoenvironmental reconstruction Beta (incorporating inferred predator visual acuity). The Committee noted that under Beta, the patch could equally plausibly function as a warning signal to said predators. Again, no proposed observation could falsify the signalling hypothesis *specifically*.  
      5.5. The Committee repeatedly inquired: "What conceivable observation pertaining to the throat-patch, or the environment as independently specified prior to knowledge of the patch's existence or function, would definitively refute the hypothesis that it is an adaptation for signalling?" No satisfactory, non-circular answer was provided that met the falsificationist standard. The hypothesis, while potentially fruitful, was deemed untestable within the submitted frameworks.^(1)

  6.  **Consequently:** The central theoretical framework underpinning the Department's primary research programme is hereby reclassified not as a scientific theory, but as a **Metaphysical Research Programme (MRP)**. This designation acknowledges its heuristic fertility and capacity to generate subsidiary testable hypotheses (e.g., specific biomechanical constraints, Mendelian inheritance patterns), while recognizing the non-testable status of its core mechanism concerning *historical* adaptation.

  7.  **Operational Implications:**  
      7.1. **Departmental Status:** The Department of Biology retains its administrative structure but is re-designated academically as operating primarily within an MRP.  
      7.2. **Grant Applications:** Applications concerning core evolutionary mechanisms (adaptation via natural selection in historical contexts) must now be submitted under the **Metaphysical & Heuristic Research (MHR)** funding stream (Code: UWM-MHR-04), not the Biological Sciences (BS) stream. Applications focusing on testable subsidiary hypotheses (e.g., population genetics modelling under controlled assumptions, specific physiological adaptations in extant organisms under *contemporary* observation) may still use BS codes.  
      7.3. **Museum Collections:** Specimens used primarily for taxonomic classification and phylogenetic inference (based on non-adaptationist criteria) remain under Biology. Specimens utilised primarily to illustrate adaptationist narratives (e.g., "display cases demonstrating camouflage") are to be transferred to the Department of History & Philosophy of Science by Q1 2024, pending cabinet availability.  
      7.4. **Teaching:**  
          *   7.4.1. Natural selection, as the core mechanism of Darwinism, may no longer be taught *as a scientific fact or testable theory* within the School of Biological Sciences.  
          *   7.4.2. It may be taught as:  
              *   (a) A historically influential MRP.  
              *   (b) A framework generating testable subsidiary hypotheses (e.g., population genetics).  
              *   (c) Within courses cross-listed with HPS (e.g., "Metaphysical Programmes in the Life Sciences").  
      7.5. **Peer Review:** Reviewers for *Journal of West Mercia Biological Sciences* are instructed that manuscripts proposing adaptationist explanations for historical traits must now include a dedicated section: "Falsificationist Assessment," explicitly outlining conceivable observations that would refute the proposed hypothesis under an *independently specified* environment. Absence of this section constitutes grounds for rejection.  
      7.6. **PhD Theses:** Future theses originating from work primarily within the MRP framework (e.g., "An adaptationist account of limb reduction in *Skinkus vulgaris*") shall be catalogued under the Dewey Decimal Classification **110 (Metaphysics)**, not **570 (Life Sciences)**. Existing theses will be retrospectively reclassified by the Library.

  8.  **Clarification:** The Committee wishes to state unequivocally that this reclassification:  
      *   **Does NOT** assert that Darwinism is false.  
      *   **Does NOT** assert that evolution did not occur.  
      *   **Does NOT** assert that the concept of natural selection is trivial or useless.  
      *   **Does NOT** imply any judgment on the intellectual rigour of biologists.  
      The reclassification solely reflects the application of the agreed demarcation criterion (falsifiability) to the core proposition concerning the mechanism of historical adaptation. The MRP designation acknowledges significant heuristic value.

  **QUESTIONS MEMBERS HAVE ASKED**

  *   **Q:** Can we still use phylogenetic trees?  
      **A:** Yes. Phylogenetic methods based on character state analysis (morphological or molecular), where the *patterns* of relatedness are testable against the data, remain scientific. Assertions that specific nodes or traits arose *due to natural selection* fall under the MRP and require appropriate framing (see 7.4.2, 7.5).

  *   **Q:** What about observable evolution (e.g., antibiotic resistance)?  
      **A:** The Committee distinguishes between:  
      (i) Observable changes in allele frequency in contemporary populations under measurable selective pressures (e.g., antibiotic presence) – This is testable science (use BS grant codes).  
      (ii) Claims about adaptation via natural selection in *historical* sequences (e.g., "the evolution of the mammalian ear bones from jaw bones was driven by natural selection for improved hearing") – This falls under the MRP (use MHR codes, HPS cross-listing).

  *   **Q:** Doesn't this make most of paleontology and historical geology non-scientific too?  
      **A:** The Committee's remit currently covers Biology. Reviews of Earth Sciences and Archaeology are scheduled for FY24/25. All disciplines will be assessed against the same criterion.

  *   **Q:** What is the practical *harm* in teaching natural selection as science, given its utility?  
      **A:** The Committee's mandate is the rigorous application of the demarcation criterion (Statute 7.12b), not the assessment of practical utility or pedagogical efficacy. Upholding clear epistemological standards is deemed inherently beneficial. The MRP designation ensures intellectual honesty regarding the logical status of core propositions. Utility is acknowledged under the "Heuristic" aspect of the MRP classification.

  ---
  **Footnote:**  
  ^(1) The Committee notes Sir Karl Popper publicly revised his view on the testability of natural selection in later writings (circa 1978). However, the ICSSHS operates under its founding remit (1975) which explicitly adopted his *earlier*, more rigorous formulation. His subsequent personal retraction is not binding on the Committee's interpretation of the *criterion itself* as articulated at that time and enshrined in Statute 7.12b. The criterion remains logically sound.
