  The afterword needs three parts: 
  1) Settled math: Definition of expectation, Riemann rearrangement theorem, conventional treatment of undefined expectations. 
  2) Contested issues: Whether this challenges expected utility theory or just single-number representation, validity of repair tactics, existence of "fair price". 
