  ### Thought Experiment: The Burrow Beetle

  **Scenario:** In a desert ecosystem, burrow beetles dig tunnels to avoid predators and extreme heat. Hatchlings are born without innate knowledge of safe digging sites. Instead, they possess a selected-for calibration mechanism: during their first week, they sample soil at various locations. When they dig in soil that crumbles easily (allowing quick burrowing) and also contains a specific mineral scent (indicating structural stability), their internal state S is activated. This activation is reinforced only when the resulting burrow successfully withstands collapse and provides thermal protection (detected via internal thermoreceptors). Over time, S becomes reliably produced in response to the conjunction of crumbly texture and mineral scent—features that, in their environment, reliably indicate safe digging sites composed of stable sandstone. State S then drives the beetle to dig at that location. Now, due to unusual erosion, a new area forms where loose volcanic ash (which crumbles easily) mixes with a mineral that mimics the scent but lacks stability. A calibrated beetle encounters this site, produces S, digs, and the burrow immediately collapses.

  ---

  ### Verdicts on Content Assignment

  1. **Producer Teleosemantics (Content = what S has the function of being caused by)**  
     The *producer* is the calibration mechanism. Its selected function is to cause S only in response to conditions that *led to successful burrows during calibration*. Historically, this was the conjunction of crumbly texture + mineral scent **in stable sandstone**. Selection favored this because sandstone burrows provided protection. Thus, S’s function is to be caused by **stable sandstone substrates (P)**—a specific, distal content.  
     *Why?* The mechanism’s selection history fixes P: it was optimized for sandstone detection during evolution, not general "safe sites."

  2. **Consumer Teleosemantics (Content = the condition required for the downstream system to perform its function)**  
     The *consumer* is the digging motor system. Its function is to excavate a **structurally stable burrow (Q)**. This system performs its job (predator/heat avoidance) only if the substrate is diggable *and* stable. Content Q is proximal/general because stability is the immediate requirement for success, regardless of substrate type (sandstone, clay, etc.).  
     *Why?* The motor system’s evolutionary function is burrow stability, not sandstone detection. Stability is the condition that "has to hold" for the consumer to succeed.

  3. **Pure Causal-Informational Account (Content = what S reliably indicates)**  
     In the home environment, S covaries with stable sandstone (texture + scent). But informationally, S is caused by the *conjunction of crumbly texture and mineral scent*—the direct inputs. This collapses to a disjunction: **"crumbly texture + mineral scent" (R)**, since these are the reliable causes. It cannot distinguish between stable sandstone and the ash/mimic because both share these properties. R is neither distal (like P) nor functional (like Q); it’s a coarse-grained indicator.  
     *Why?* Without teleology, the account cannot privilege sandstone or stability; it tracks correlations, not functions.

  ---

  ### Novel Situation: Collapse at the Volcanic Ash Site
  - **What happens:** The beetle produces S at the ash site, digs, and the burrow collapses.  
  - **Verdicts on misrepresentation:**  
    - **Producer:** *Misrepresents.* S’s function is to be caused by stable sandstone. Ash/mimic isn’t sandstone, so S falsely represents sandstone presence. Failure is *representational* (wrong substrate).  
    - **Consumer:** *Misrepresents.* S’s content is "stable burrow site here." The ash is unstable, so S falsely represents stability. Failure is *representational* (false guarantee of stability).  
    - **Causal-Informational:** *No misrepresentation.* S indicates "crumbly texture + mineral scent," which *is* present. Failure is *functional* (bad outcome) but not representational; S was "correct" per its indicators.  

  **What hangs on this:** If misrepresentation is tied to failure (e.g., predation risk), producer/consumer theories blame S’s inaccuracy, while the informational account blames unlucky circumstances. Teleosemantics treats the failure as cognitive error; informationalism treats it as bad luck.

  ---

  ### Key Feature and Its Role
  - **The single feature:** The calibration mechanism’s selected function is to *discriminate a specific distal feature* (sandstone) because it correlates with a *general proximal benefit* (stability).  
  - **If removed:** If calibration weren’t selected for discrimination (e.g., if it simply reinforced *any* successful dig), producer content would collapse into consumer content (both "stability"). The divergence requires the mechanism to "target" a distal property due to selection history.  
  - **Contested aspect:** Whether calibration mechanisms have functions that are *distal-specific* (consensus) or whether consumer functions dominate content (disputed). Some (e.g., Millikan) argue producer functions fix "normal conditions"; others (e.g., Neander) emphasize consumer-centric norms.

  ---

  ### Best Move for the "Losing" Theory
  - **Causal-informational account comes out worst:** It ignores selection history, missing why S "should" indicate sandstone/stability. Its disjunctive content (R) seems inadequate.  
  - **Best defensive move:** Argue that S *is* reliably caused by texture/scent, and teleosemantics smuggles in "normativity" illegitimately. Claim that in the novel case, S *correctly* indicated texture/scent—failure was due to the world being misleading, not misrepresentation. This preserves a non-teleological view but abandons robust error-tracking.

  ---

  ### Settling Your Argument
  **Your friend is wrong—but only partially.**  
  - **Straw man? Partly.** Teleosemantics *can* handle acquired states by deriving content from the selection history of the *acquisition mechanism* (here, calibration). S has content because calibration was selected for sandstone detection. This is standard in teleosemantics (e.g., Shea’s work on derived content).  
  - **Real problem? Smaller than he thinks.** His claim that learned states get "no content" or "wrong content" fails. S has clear content (P or Q), and both teleosemantic accounts agree it can misrepresent. However, the divergence between P and Q reveals a genuine tension: **producer theories risk over-specificity** (e.g., S "means" sandstone even if stability matters more), while **consumer theories risk over-generality** (e.g., S "means" stability even if calibration targeted sandstone).  
  - **Verdict:** Teleosemantics *can* naturalize acquired content, but the producer/consumer split shows content assignment isn’t always straightforward. Your friend’s objection holds only if teleosemantics *must* fix content solely to innate detectors—but the calibration mechanism’s history provides the needed "derived" function.
