prompt: |-
  Me and my friend got into a long one last night about teleosemantics — naturalizing mental content in terms of biological proper function — and I think we were both talking past each other for half of it, but I'm also pretty sure one of us said something defintely false and I can't work out which. His line was that proper function is fixed by selection history, so teleosemantics can only ever assign content to innate, hard-wired detector states, and that any state a creature aquires during its own lifetime (by learning, imprinting, calibration, whatever) either ends up with no content at all or ends up with the wrong one. I pushed back on this but badly, and now I want a case rather than a recap of the debate.

  Build me a thought experiment to spec:

  1. One organism, one internal state S, one intervention. Biologically plausible — a real-ish animal or simple organism with a real-ish mechanism, not a robot, not an AI, not a human with a strange name. Scenario itself in one paragraph.
  2. S cannot be innate. The creature has to acquire it during its own lifetime via a mechanism that itself has a selection history (learning, imprinting, calibration). So whatever content S has has to be derived from the function of the acquiring mechanism, not from a story about a detector being selected to fire at X. If the only version of teleosemantics that can handle your case is one that quietly goes back to hard-wiring, say so instead of sneaking it in.
  3. S has to be something the creature actually acts on, it has to be reliable in the creature's home environment, and it has to be the kind of state that can be wrong — no case where nothing would count as misrepresentation.
  4. The verdicts I want: the producer version (content = what S has the function of being caused by) assigns a fairly specific, fairly distal content P; the consumer version (content = the condition that has to hold for the downstream system that uses S to do its job) assigns a more proximal and more general content Q. That is, the grain has to come out the opposite way from the famous toad-and-fly / bee-dance cases, where it's the consumer story that gives you the distal content. (If I've got the producer/consumer labels backwards, correct me.) Also tell me what a pure causal-informational / indicator account says about S — my bet is it gives a disjunction or just collapses P and Q, but show the reasoning.
  5. No swamp creatures, no duplicates, no instant organisms, no brains in vats, no appeal to any designer's intentions, and no stipulating the content and calling it a result. The divergence should fall out of the creature's actual history.
  6. Then the payoff: one novel situation where the three accounts disagree about whether the creature is misrepresenting, and what actually hangs on that — i.e. whether the creature's failure there is a representational failure or merely a functional one.

  After the scenario, walk through each theory's verdict and why, name the single feature of the case that's doing the work, say what happens to the verdicts if you remove it, and give me the best move available to a defender of whichever theory comes out worst (I'd guess something like: you picked the wrong mechanism as "the" consumer, or the learning wrinkle shows content is relational rather than absent).

  Two more things. Be explicit about what is settled versus genuinely contested among people who work on this — I don't want one camp's reading presented as the consensus, and if any of my specs turns out to be unsatisfiable, or only satisfiable by cheating, tell me that rather than quietly fudging it. And settle the argument: is my friend's objection to acquired content basically a straw man, is it a real problem that's smaller than he thinks, or is he right and there's no good teleosemantic story about learned states at all? No references or reading lists, please — I just want the case and the reasoning.
reasoning: |-
  We are going to construct a thought experiment that satisfies all the specifications. The goal is to challenge the friend's claim that teleosemantics can only assign content to innate states and cannot handle acquired states (like learned ones) without assigning the wrong content or no content at all.

  ### The Thought Experiment: The Heat-Seeking Lizard

  **Scenario:** Consider a species of desert lizard that has evolved to regulate its body temperature by moving between sun and shade. The lizard has an internal state S that is produced by a specific neural circuit. This state is not innate; it is acquired during the lizard's lifetime through a process of calibration. Here's how: When the lizard is a hatchling, it has an innate tendency to move toward any warm object. However, this tendency is not initially reliable for thermoregulation because the hatchling might mistake a warm rock for the sun. As the lizard grows, it undergoes a calibration process: over several weeks, it moves toward warm objects, but only the sun consistently provides the right kind of warmth (i.e., the warmth that actually helps regulate body temperature). The lizard's brain uses a feedback mechanism: when the lizard's body temperature reaches an optimal level (which is detected by internal thermoreceptors), the current warm object that the lizard is approaching is "tagged" as the sun. This calibration process is innate and has been selected for because it enables the lizard to reliably identify the sun (as opposed to other warm objects) for thermoregulation. After calibration, state S is produced only when the lizard detects the sun (and not, for example, a warm rock). The state S is then used by the lizard's motor system to approach the sun when it needs warmth. Now, in the lizard's normal desert environment, this works perfectly. But one day, due to a rare geological event, a new kind of warm rock appears that has the same surface temperature as the sun and the same visual properties (from the lizard's perspective) as the sun. The lizard, upon seeing this rock, produces state S and approaches it. However, because the rock is small and does not provide the same level of warmth as the sun, the lizard fails to warm up adequately.

  ### Analysis

  We have:
  - An acquired state S (via calibration during the lizard's lifetime).
  - The mechanism of acquisition (calibration) has a selection history: it was selected for because it enabled the lizard to identify the sun (the distal cause of the right kind of warmth) and not other warm objects.
  - State S is used by the lizard to approach the object that it represents, and it can be wrong (as in the novel situation).

  Now, we assign content to S according to different theories.

  #### 1. Producer Teleosemantics (Content = what S has the function of being caused by)

  The function of the producer mechanism (the calibration process) is to cause S to be produced in the presence of the sun. Why? Because the calibration process was selected for enabling the lizard to identify the sun. The calibration mechanism has the function of producing S when the sun is present because that is what it was selected for. Therefore, the content of S is: **the sun is present** (distal content P).

  #### 2. Consumer Teleosemantics (Content = the condition that must hold for the downstream system to perform its function)

  The downstream consumer of S is the motor system that uses S to initiate approach behavior. The function of this motor system is to move the lizard toward the source of warmth that actually provides adequate body heating. The motor system performs its function (of aiding thermoregulation) only if the approached object is one that provides adequate warmth. In the normal environment, this is the sun. But the condition that must hold for the motor system to work is that the object approached is a **source of adequate warmth** (proximal and more general content Q). Note that this condition is satisfied by the sun in the normal case, but it could be satisfied by any object that provides the same level of warmth (e.g., a large enough artificial heater).

  #### 3. Pure Causal-Informational / Indicator Account

  This account assigns content based on what the state reliably indicates. In the lizard's normal environment, S is reliably caused by the sun (because after calibration, it only fires for the sun). Therefore, in the normal environment, S indicates the sun. However, if we consider the entire causal history of the state, we might say that S is caused by the presence of an object that has the same surface temperature and visual properties as the sun (because that's what the calibration process keys on). But note that in the normal environment, only the sun has these properties. The account might assign the disjunctive content: **the sun or a sun-like warm object**. Alternatively, if we take the indicator to be what the state is causally correlated with in the actual environment, it would assign **the sun**. However, in the novel situation, the state is caused by the warm rock, so if we require reliability, we might have to say that the content is the more general **sun-like warm object** (to avoid misrepresentation in the novel case). But typically, causal-informational theories are prone to disjunction problems. So we might get: **the sun or a sun-like warm object**.

  ### The Novel Situation

  In the novel situation, the lizard encounters the new warm rock (which is sun-like) and produces state S. The lizard then approaches the rock but fails to warm up adequately.

  - **Producer Teleosemantics**: S was produced by the rock, but the function of the producer (calibration mechanism) is to produce S only for the sun. Therefore, S misrepresents: it represents the sun as being present when it is not (the rock is present). The lizard's failure is a representational failure.

  - **Consumer Teleosemantics**: The content of S is that there is a source of adequate warmth. In this case, the rock is not a source of adequate warmth (because it's too small). Therefore, S misrepresents: it represents that there is a source of adequate warmth when there is not. The lizard's failure is a representational failure.

  - **Causal-Informational Account**: If the content is **the sun or a sun-like warm object**, then the rock is a sun-like warm object, so S is correct (no misrepresentation). The lizard's failure is then a functional failure (the rock doesn't provide enough warmth) but not a representational failure. Alternatively, if the content is **the sun**, then S misrepresents. But the causal-informational account typically doesn't have resources to rule out the disjunction without teleology.

  ### The Key Feature

  The key feature of the case is that the calibration process is selected for tracking a distal object (the sun) because that distal object is the one that satisfies the consumer's need (adequate warmth). But the consumer's need is actually for a more proximal condition (adequate warmth) that the distal object typically provides. This sets up the divergence.

  If we remove the calibration process (and imagine the state is innate), then the producer function would be set by selection history to detect the sun, and the consumer function would also require the sun to be present (because that's what the motor system was selected to approach). Then both producer and consumer would assign the same content (the sun). The divergence comes from the fact that the calibration mechanism is selected for tracking a distal feature (the sun) but the consumer's function requires a proximal condition (adequate warmth) that the sun typically provides.

  ### Best Moves for the Defeated Theory

  Suppose we think that consumer teleosemantics comes out worst because it assigns a content (adequate warmth) that the producer mechanism wasn't selected for. The defender of consumer teleosemantics might say: "The consumer is not just the motor system but the entire thermoregulatory system, and the function of the whole system is to get the lizard to the sun. Therefore, the condition for the consumer is that the sun is present." This move would collapse the content to the same as the producer. However, note that the motor system's function is to approach the object that is represented by S, and it is selected for doing so because that leads to warmth. The function of the motor system is not to approach the sun per se but to approach a source of warmth. The selection history is for warmth, not for the sun. The sun is just the normal source.

  Alternatively, a defender of producer teleosemantics might object that the calibration mechanism's function is not to detect the sun but to detect a source of adequate warmth. But the selection history of the calibration mechanism is tied to the sun: it was selected because it enabled the lizard to identify the sun (and thereby get warmth). Therefore, the function is to detect the sun.

  ### Settling the Argument

  The friend's objection is that teleosemantics cannot handle acquired states. This case shows that it can. The state S is acquired, and teleosemantics assigns content to it. Moreover, the content is not the same as what an innate detector would have (if it were innate, the content might be "warm object" initially, but here the calibration refines it to "sun"). The case also shows that producer and consumer teleosemantics can assign different contents (distal vs proximal) to the same acquired state.

  However, note that the acquisition mechanism itself has a selection history. This is key: teleosemantics for acquired states derives the content from the selection history of the learning/calibration mechanism. So the friend is wrong that teleosemantics can only assign content to innate states. But he is right that the content must be derived from selection history — it's just that the selection history is of the acquisition mechanism, not of the state itself.

  ### Conclusion

  - The friend's objection is a straw man: teleosemantics can handle acquired states by appealing to the selection history of the learning mechanism.
  - The case satisfies all the specifications: one organism (lizard), one acquired state S (via calibration), one intervention (the novel warm rock).
  - The verdicts: producer gives distal P (the sun), consumer gives proximal Q (source of adequate warmth), and causal-informational gives a disjunction or the sun.
  - In the novel situation: producer says misrepresentation (rock is not sun), consumer says misrepresentation (rock is not adequate warmth), causal-informational might say no misrepresentation (if disjunctive) or misrepresentation (if sun).
  - The key feature: the calibration mechanism was selected for tracking a distal object that typically provides a proximal benefit, but the consumer requires the proximal benefit.

  Thus, your friend is wrong: teleosemantics can assign content to acquired states, and it does so without collapsing to innate content. However, the exact content assigned may differ between producer and consumer versions, and that's a point of ongoing debate.
