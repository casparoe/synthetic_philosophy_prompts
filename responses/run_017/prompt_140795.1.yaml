prompt: |-
  You're a philosopher of AI and cognition who also really cares about teaching — the kind of person who has actually run seminar activities and knows what happens when sixteen undergrads get let loose on a task. Take your time with this and think it through properly: start by brainstorming three or four genuinely different activity concepts for the brief below, one or two sentences each, say in passing why you're rejecting the ones you reject, and then commit to the strongest one and build it out in full.

  My brief:

  I run a 75-minute session for about 16 undergrads in a Minds and Machines course. Mixed majors, mostly no programming, they've read Turing's 1950 paper and Searle's Chinese Room, and they've all used Google Translate but none of them have thought about it. Next week we're doing the shallowness debate about machine translation — Hofstadter's line of complaint that a system doing corpus-driven pattern matching isn't really translating, that it produces fluent output without any model of what the sentence is about and without any sense of which parts of the source the speaker was trading on. I want them to feel the force of that complaint instead of nodding along to it.

  And here's the thing I keep going back and forth on, which I'd like the activity to actually separate rather than blur. I think the shallowness talk is secretly two complaints that everybody runs together:

  (1) the no-world-model complaint — the system has no idea what the sentence describes, so it can't use facts about giraffes, doorways, or who is related to whom to resolve anything, and it fills the gap with whatever is statistically smoothest;
  (2) the no-sense-of-relevance complaint — even when the relevant facts are in principle available to it, the system doesn't know which distinctions the speaker was leaning on, so it flattens a joke, a slight, or a piece of dry understatement into something literal and flat.

  My hunch is that (2) is the deeper one and (1) is the one everybody argues about, and I want students to run into (2) in a way that genuinely surprises them — they should come out thinking the interesting problem is not the one they walked in expecting.

  So: design an activity in which the students become the translation engine.

  What I need:
  - A corpus-only setup. Bilingual paired sentences in a made-up language, with a little internal grammar so pattern matching actually gets somewhere. Give me a small but usable sample — call it 15-20 pairs — plus the test sentences, and tell me what each item is designed to do to them.
  - An information restriction that forces locality. Something like each person in a group only ever seeing a narrow window of the source sentence, or the sentence being passed down a line one chunk at a time with no going back. Whatever it is, it should make long-range dependencies hard for the group as a group, not just for an individual.
  - A fluency trap: at least one item where the most corpus-likely rendering is smooth idiomatic English, is wrong, and is one the students will feel confident about. I want them to have the experience of being rewarded for a sentence they'd defend.
  - A second phase where the restriction is lifted — they get the whole sentence, and they're allowed to use anything they know about the world — and where they still can't get one item right, because what's missing isn't information, it's relevance. Write that item out for me and tell me what it should have been.
  - A scoring scheme that rewards surface overlap with a reference translation rather than getting the meaning right, because I want them to notice that the metric itself is pushing them toward shallowness. But calibrate it so they don't just give up and start messing about.

  Also: a minute-by-minute timeline for 75 minutes, a list of what I need to print, the exact wording I read out at the start (including which rules I must definately not explain in advance), and a debrief that maps specific moments of the activity onto (1) and (2) above, and then onto the question whether what they were doing counted as understanding anything.

  Two things I want you to be blunt about. First, what will predictably go wrong the first time I run it, and what do I do in the moment — the failure modes, not the ideal run. Second, which feature of the shallowness debate this activity fundamentally can't reproduce. My worry is that my students obviously do understand language, so all I've built is a simulation of an information constraint rather than a simulation of a lack of understanding, and a sharp student is going to say so in the debrief and I won't have a good answer. Tell me how damaging that objection actually is, whether there's a fix, and if there isn't, what I should just say out loud to them instead.
reasoning: |-
  We are designing an activity where students become a translation engine to experience the shallowness debate in machine translation. The goal is to separate two complaints: (1) no world model and (2) no sense of relevance. The activity must have a corpus-only setup, information restriction forcing locality, a fluency trap, and a second phase with the restriction lifted. Also, a scoring scheme that rewards surface overlap and a debrief mapping to the two complaints.

  Brainstorming activity concepts:

  1. **Chain Translation Relay**: 
     - Students sit in a line. Each gets a fragment of a sentence in a made-up language and a corpus of paired sentences. They pass their translation of the fragment to the next person, who must use the corpus and the previous fragment to translate the next. The last person compiles the full sentence.
     - Why reject? This might overemphasize the no-world-model complaint (1) because the locality is extreme and they can't see the whole sentence until the end. It might not adequately bring out (2) the relevance issue because the fragmentation might obscure the speaker's intent.

  2. **Parallel Group Translation with Limited Context Windows**:
     - Divide the class into small groups (say 4 groups of 4). Each group is given the entire source sentence but each member only sees a portion (e.g., one quarter) and has access to a shared corpus. They must collaboratively translate without showing each other their parts (only communicating verbally). Then they merge their parts.
     - Why reject? This might not force enough locality because they can communicate and might piece together the whole meaning. It might not create the intended fluency trap as effectively.

  3. **Corpus Jigsaw with Role Assignment**:
     - Each student is assigned a specific role (e.g., "verb specialist", "noun specialist") and given a corpus that only contains examples relevant to their role. They must translate the sentence by consulting only their specialized corpus and then combine with others. The test sentence would have nuances that require cross-role understanding.
     - Why reject? This might be too complex to set up in 75 minutes and the role specialization might not cleanly separate (1) and (2). Also, it might not simulate the statistical pattern-matching well.

  4. **Blind Translation with Corpus Constraints**:
     - Students work in pairs. One has the source sentence and a corpus, but cannot see the target language (they are the "encoder"). The other has the target language and must produce the translation based on the encoder's description (which must be based only on corpus matches). The encoder can only say things like "the next three words match example 7 in the corpus, so use that translation".
     - Why reject? This might become too mechanical and not evoke the feeling of producing a fluent but wrong translation. Also, it might not create a natural fluency trap.

  After considering, I choose to develop **Concept 1: Chain Translation Relay** because it most strongly enforces locality and makes long-range dependencies hard. However, I will adjust it to better highlight the relevance complaint (2) in the second phase.

  But note: the brief asks for the students to become the translation engine and to have an information restriction that forces locality. The chain relay does that by having each person only see a fragment and the previous translation. Also, it naturally leads to a second phase where the entire group (or a subset) can see the whole sentence.

  I will commit to a modified version of the Chain Translation Relay that includes:
  - First phase: chain translation with limited context.
  - Second phase: group revision with full context and world knowledge, but with a test item that still fails due to relevance.

  **Activity Title: The Translation Assembly Line**

  **Overview:**
  - Students form a chain of 5-6 stations (for a 16-student class, three chains of 5-6 students each). Each chain translates one test sentence at a time.
  - The corpus is provided to every student. It consists of 15-20 paired sentences in a made-up language (Glob) and English.
  - The source sentence is broken into consecutive chunks (e.g., 4-5 chunks per sentence). Each student in the chain is responsible for one chunk. They only see their chunk and the translation of the previous chunk (if any). They must translate their chunk using the corpus and pass their translation to the next person.
  - The last student writes the full translation.
  - Then, the entire chain (as a group) is given the full source sentence and allowed to revise the translation using any knowledge they have (second phase). But one test sentence is designed so that even with world knowledge, they cannot resolve the relevance issue without knowing the speaker's intent.
  - Scoring: for the first phase, they are scored by matching words in a reference translation (provided by the instructor). For the second phase, they are also scored the same way, but the point is to see that they might change the translation to be more meaningful but lose points on surface overlap.

  **Corpus Design (Glob-English):**
  We create a small corpus of 15 pairs. The language Glob has a simple grammar: Subject-Object-Verb (SOV) and uses postpositions. The vocabulary is made up. We design the corpus to have patterns that can be matched, but also ambiguities.

  Example corpus (15 pairs):

  1. Glob: "Kela mitu po." -> English: "The cat eats fish."
  2. Glob: "Mitu kela po." -> English: "The fish eats the cat." (Note: word order matters, SOV)
  3. Glob: "Suna mitu po." -> English: "The dog eats fish."
  4. Glob: "Kela suna po." -> English: "The cat eats the dog."
  5. Glob: "Mitu suna po." -> English: "The fish eats the dog."
  6. Glob: "Kela jana." -> English: "The cat sleeps."
  7. Glob: "Suna jana." -> English: "The dog sleeps."
  8. Glob: "Mitu jana." -> English: "The fish sleeps."
  9. Glob: "Kela li mitu." -> English: "The cat with the fish." (Note: "li" is "with")
  10. Glob: "Suna li kela." -> English: "The dog with the cat."
  11. Glob: "Kela mitu po li suna." -> English: "The cat eats the fish with the dog." (meaning: using the dog as tool? or in company? ambiguous but in corpus it's given as literal)
  12. Glob: "Suna mitu po kela to." -> English: "The dog eats the fish at the cat." (Note: "to" is a postposition for location, like "at")
  13. Glob: "Kela to suna jana." -> English: "At the cat, the dog sleeps." (meaning: near the cat)
  14. Glob: "Mitu to kela po." -> English: "At the fish, the cat eats." (meaning: near the fish, the cat eats [something])
  15. Glob: "Jana kela li." -> English: "Sleeps the cat with." (awkward, but meaning: the cat sleeps with [someone])

  We need test sentences that will be translated in the activity.

  **Test Sentences (for the activity):**

  - **Test 1 (Fluency Trap):** 
    - Glob: "Kela mitu po suna to."
    - Literal: "The cat eats the fish at the dog." -> but the corpus (pair 12) has "Suna mitu po kela to" meaning "The dog eats the fish at the cat." So pattern matching might lead them to produce: "The cat eats the fish at the dog." which is smooth and matches the corpus pattern. However, the intended meaning is that the location is "at the dog", but without world knowledge, they don't know if that makes sense. In reality, it might be odd (a cat eating at a dog? maybe at the dog's house?) but the fluency trap is that it's smooth and they feel confident. The reference translation we score by is the literal one: "The cat eats the fish at the dog." even if it's odd.

  - **Test 2 (Relevance Issue in Phase 2):**
    - Glob: "Mitu kela po li suna."
    - This is designed to be ambiguous. The corpus has "Kela mitu po li suna" meaning "The cat eats the fish with the dog." (which could mean using the dog as an instrument, or in the company of the dog). Now we have "Mitu kela po li suna" -> which by word order would be "The fish eats the cat with the dog." But that's absurd. However, if we interpret "li suna" as an adverbial (like "in a doggish way") then it could be a metaphor: "The fish eats the cat doggedly" (with persistence). But the corpus doesn't have that. In the second phase, they get to use world knowledge and know that fish don't eat cats. So they might change it to something like "The fish is eaten by the cat with the dog" (passive) but that changes the structure. However, the scoring is based on surface overlap with a reference that is the literal translation: "The fish eats the cat with the dog." They will be penalized for changing it to a passive even if it makes more sense. Also, note the relevance issue: the speaker might be making a joke or a metaphor, but without knowing the context, they cannot capture it. Even with world knowledge, they don't know if the speaker intended a joke or a literal meaning (if it's a fantasy story, it might be literal). So they are stuck.

  **Activity Setup:**

  - **Groups:** 3 chains (5-6 students each). Each chain will do both test sentences one after the other.
  - **Materials to Print:**
    - Corpus sheets (15 pairs) for every student.
    - Test sentences on separate cards, broken into chunks. For Test 1: "Kela", "mitu po", "suna to" (3 chunks). For Test 2: "Mitu", "kela po", "li suna" (3 chunks). (Adjust chunking if needed.)
    - Reference translations for scoring (kept by the instructor).
    - Scoring sheets for each chain (to record the translations and compute scores).
    - Instructions for each phase.

  **Timeline (75 minutes):**

  - **0:00 - 0:10 (10 min):** Introduction and setup.
    - Read the exact wording (see below).
    - Divide into chains and assign positions.

  - **0:10 - 0:35 (25 min):** Phase 1 - Chain Translation for both test sentences.
    - Each chain does Test 1, then Test 2. Allow about 10 minutes per sentence (including passing and writing). The instructor times and moves things along.

  - **0:35 - 0:50 (15 min):** Phase 2 - Group Revision.
    - For each test sentence, the entire chain gets together and is given the full source sentence. They can revise their translation using any knowledge. They write a revised version.

  - **0:50 - 1:05 (15 min):** Scoring and Data Collection.
    - The instructor collects the phase 1 and phase 2 translations for each chain and each test sentence.
    - While the instructor computes scores (or with student help), the chains discuss: What was hard? What changed in phase 2?

  - **1:05 - 1:15 (10 min):** Debrief and discussion.

  **Exact Wording at Start:**

  "Welcome. Today we are simulating a machine translation system. You will form assembly lines to translate sentences from a made-up language, Glob, into English. Each of you will get a corpus of Glob-English sentence pairs. Here are the rules:

  1. You will work in chains. The first person in the chain gets the first chunk of the sentence. They must translate that chunk using only the corpus and pass their translation to the next person. 
  2. The next person gets the next chunk and the previous person's translation. They use the corpus to translate their chunk and pass both their chunk translation and the growing translation to the next. 
  3. The last person compiles the entire sentence and writes it down.
  4. Important: You are only allowed to use the corpus. Do not use any outside knowledge of English or the world. If the corpus doesn't have a word, you must try to find the closest match by pattern.
  5. You cannot go back and change an earlier part. Once you pass it, it's fixed.

  We will do two sentences. After that, we will have a revision phase where your entire group gets the full sentence and can revise the translation using anything you know.

  One more thing: we will score your translations by comparing them to a reference translation. The scoring is based on how many words match the reference exactly. So, even if your translation is meaningful but uses different words, it might lose points. We'll explain the scoring in the revision phase.

  Any questions? ... (Answer procedural questions only, do not explain the goals or the two complaints.)"

  **Scoring Scheme:**

  - For a given translation, split into words and compare to the reference. 
  - Score = (number of matching words) / (total words in reference) * 100%. 
  - For example, reference: "The cat eats the fish at the dog." (6 words). 
    - If translation: "A cat eats fish at the dog." -> matches: "cat", "eats", "fish", "at", "the", "dog" -> but "a" vs "the" and missing "the" before fish? So we have to define: only exact word matches (including articles) and in order. 
    - Alternatively, use a simple scheme: count the number of words that appear in the reference and in the translation (but that might overcount). Let's do exact string matching by position? Maybe too complex. Instead, we do: 
      - Break into tokens (by space).
      - For each token in the reference, if the translation has the same token in the same order, count 1. Ignore extra tokens. 
    - But to keep it simple, we'll do: 
      - Score = (number of words that match the reference in order) / (number of words in reference). 
      - Example: reference: "The cat eats the fish at the dog." (6 words)
        - Translation 1: "The cat eats the fish at the dog." -> 6/6 = 100%
        - Translation 2: "The cat eats fish at the dog." -> 5/6 (missing "the" before fish) -> 83%
        - Translation 3: "A cat eats the fish at the dog." -> 5/6 (only "cat", "eats", "the", "fish", "at", "the", "dog" -> but first word is "A", so first "the" is missing? Actually, position 1: "A" vs "The" -> mismatch. Then position 2: "cat" matches, etc. So it's 5 matches: "cat", "eats", "the", "fish", "at", "the", "dog" -> but note: the reference has two "the"s. So if the translation has "A cat eats the fish at the dog", then:
          - Ref: [The, cat, eats, the, fish, at, the, dog] -> 8 tokens? Wait, let's recount: "The cat eats the fish at the dog." -> actually 7 tokens? "The", "cat", "eats", "the", "fish", "at", "the", "dog" -> 8 tokens? No: "at the dog" is two words? Actually, it's three: "at", "the", "dog". So 7 words? Let me write: 
            - Reference: ["The", "cat", "eats", "the", "fish", "at", "the", "dog"] -> 8 tokens? But that's because of the period? Ignore punctuation. So tokens: "The", "cat", "eats", "the", "fish", "at", "the", "dog" -> 8 tokens.
          - Translation: "A cat eats the fish at the dog" -> ["A", "cat", "eats", "the", "fish", "at", "the", "dog"] -> 8 tokens.
          - Compare: 
            - Token1: "A" vs "The" -> no
            - Token2: "cat" vs "cat" -> yes
            - Token3: "eats" vs "eats" -> yes
            - Token4: "the" vs "the" -> yes
            - Token5: "fish" vs "fish" -> yes
            - Token6: "at" vs "at" -> yes
            - Token7: "the" vs "the" -> yes
            - Token8: "dog" vs "dog" -> yes
            -> 7/8 = 87.5%
          - But note: the first token is wrong. So 7 matches.
        - We'll do this token-by-token.

  **Debrief:**

  Map moments to the complaints:

  - **Complaint (1) No World Model:** 
    - In the first phase, when they translated Test 1: "Kela mitu po suna to" -> they produced "The cat eats the fish at the dog." They couldn't use world knowledge to question if a cat would eat at a dog. This is the no-world-model complaint: they produced a fluent but potentially nonsensical translation because they only had the corpus.
    - In the revision phase for Test 1, they might have changed it to something like "The cat eats the fish near the dog" or "at the dog's place", but note: the scoring scheme might have penalized them for changing "at" to "near". And they might have felt constrained by the scoring.

  - **Complaint (2) No Sense of Relevance:**
    - Test 2 in the revision phase: even with world knowledge, they couldn't resolve the absurdity without knowing the speaker's intent. They might have changed it to passive: "The cat is eaten by the fish with the dog" but that's still odd. Or they might have added words to make it a joke. But without knowing if the speaker intended a metaphor or a literal meaning, they are stuck. The scoring scheme (based on literal reference) penalizes them for changing the structure. This shows that even with a world model, without knowing which aspects are relevant (is the speaker using a metaphor? is it a joke?), they cannot capture the meaning.

  Then, the big question: did they, as a system, understand anything? They were matching patterns and producing output. They might say they understood the parts, but as a chain, no one had the full picture until the end. And even then, they couldn't capture the relevance.

  **Failure Modes and Mitigations:**

  1. **Failure: Students cheat by sharing more context than allowed.**
     - Mitigation: Walk around and monitor. Remind them of the rules. Stress that the point is to simulate a machine that doesn't have global access.

  2. **Failure: The chains get stuck because a chunk is ambiguous and they can't decide.**
     - Mitigation: Encourage them to go with the corpus match that is most frequent or first found. Tell them to note down their uncertainty.

  3. **Failure: The scoring takes too long.**
     - Mitigation: Pre-calculate for expected translations or do a simpler scoring (e.g., count exact matches without position). Or have the chains swap translations and score each other with a provided reference.

  4. **Failure: The fluency trap doesn't work because students immediately see the absurdity.**
     - Mitigation: In the instructions, emphasize they must use the corpus only. If they question, say: "In this phase, you are a pattern matcher. Use the corpus even if it leads to something odd."

  5. **Failure: The relevance issue in Test 2 is resolved by a student suggesting it's a metaphor.**
     - Mitigation: The scoring scheme will penalize them for not being literal. And you can point out that without knowing the context, they are guessing. Also, in the debrief, stress that the system doesn't have access to the speaker's mind.

  **The Fundamental Limitation:**

  The activity simulates an information constraint (not seeing the whole sentence, not using world knowledge) but the students still understand the words they are processing. A sharp student will say: "But we do understand the words, so it's not that we lack understanding, we just have incomplete data."

  Response: 
  - This is a valid point. The activity is meant to illustrate the information gap that current MT systems face and how that leads to shallow processing. But it doesn't simulate the lack of understanding itself because the students are conscious beings. However, we can still draw the analogy: even with full data (as in phase 2), without the ability to discern relevance (which comes from understanding the communicative intent), the system fails. The activity shows that the problem is not just data but interpretation. And that's why (2) is the deeper issue.

  How damaging? It doesn't ruin the activity because the point is to feel the frustration of having the pieces but not knowing how to put them together meaningfully when relevance is at stake. In the debrief, admit the limitation: "Yes, you as individuals understand, but the system as a whole doesn't, and even when we lift the restrictions, we still face the problem of relevance without access to the speaker's mind."

  Fix? There isn't a perfect one because we can't make the students not understand. Instead, we can focus on the system-level behavior: the chain of students, following rules, is like the MT system. The system doesn't understand even if parts of it (the students) do. That's analogous to the Chinese Room: each step is mechanical, but there's no overall understanding.

  **Final Adjustments:**

  - Make sure the test sentences are printed on cards with chunks clearly separated.
  - Have a timer for each phase.
  - In the debrief, explicitly ask: "When you were in the chain, did you feel like you understood the whole sentence? How about when you revised as a group?"

  This activity should create the surprise: they will expect the problem to be the absurdity (no world model) but then get stuck on the relevance issue in Test 2 even with world knowledge.
answer: |-
  ### Brainstormed Activity Concepts
  1. **Fragmented Window Relay**  
     Students sit in a line; each sees only a 3-word window of the source sentence (plus the prior person's output) and must translate their window using a corpus. Passes to next.  
     *Reject*: Overemphasizes (1) no-world-model by making long-range dependencies impossible, but underplays (2) no-relevance because fragmentation obscures speaker intent.  

  2. **Parallel Silos with Specialized Corpora**  
     Groups of 4; each student gets a different "expert corpus" (e.g., verbs/nouns) and must translate the whole sentence using only their subset. They negotiate a final output.  
     *Reject*: Highlights (1) by restricting world knowledge but fails to create a fluency trap or force locality—students might "cheat" by pooling intuitions.  

  3. **Blind Chunk Assembly**  
     Students work in pairs: one segments the source sentence into chunks using corpus patterns; the other translates each chunk in isolation. No communication during translation.  
     *Reject*: Forces locality well but blurs (1) and (2)—students might infer relevance from chunking, and the fluency trap is hard to engineer.  

  4. **Real-Time Corpus Search Race**  
     Groups compete to translate sentences fastest using a shared corpus. Rules forbid discussion beyond reading corpus matches aloud.  
     *Reject*: Fun but chaotic; rewards speed over depth, likely amplifying (1) while burying (2) under noise. Also, hard to control information flow.  

  **Chosen Concept: Fragmented Window Relay** (adjusted to prioritize (2) no-relevance).  
  *Why?*: Maximizes locality constraints, creates natural fluency traps via corpus bias, and isolates (2) in revision phase when world knowledge fails. Predictably forces students into statistical pattern-matching.  

  ---

  ### Final Activity: **The Sentence Window Game**  
  *Students become a "translation engine" by relaying sentence chunks through a narrow window. Fluency traps reward shallow output, and the revision phase reveals the irrelevance problem even with full context.*  

  #### Key Mechanics  
  - **Corpus-only setup**: Students use a fabricated corpus (Glob ↔ English) for pattern-matching.  
  - **Information restriction**: Each student sees only a 3-word window of the source + prior output. No backtracking.  
  - **Fluency trap**: One test sentence where corpus patterns produce smooth-but-wrong English.  
  - **Phase 2 revision**: Full sentence revealed; world knowledge allowed, but one item remains unsolvable due to relevance.  
  - **Scoring scheme**: Rewards word-for-word overlap with a reference translation, penalizing meaning-driven changes.  

  ---

  ### Corpus and Test Sentences (Glob Language)  
  *Glob is SOV (Subject-Object-Verb) with postpositions (e.g., "li" = "with"). Corpus designed for false pattern matches.*  

  **Corpus (15 Pairs)**  
  1. "Kela mitu po" → "The cat eats fish."  
  2. "Mitu suna po" → "The fish bites the dog."  
  3. "Suna kela li jana" → "The dog sleeps with the cat."  
  4. "Vana mitu to jana" → "The bird sleeps near the fish."  
  5. "Kela vana po" → "The cat eats the bird."  
  6. "Suna jana" → "The dog sleeps."  
  7. "Mitu kela li po" → "The fish eats with the cat."  
  8. "Vana to suna jana" → "Near the bird, the dog sleeps."  
  9. "Rana kela li" → "The king is with the cat."  
  10. "Kela rana po" → "The cat eats the king."  
  11. "Suna mitu li jana" → "The dog sleeps with the fish."  
  12. "Rana vana to" → "The king is near the bird."  
  13. "Mitu jana rana li" → "The fish sleeps with the king."  
  14. "Kela to vana po" → "Near the cat, the bird eats."  
  15. "Rana suna po li kela" → "The king bites the dog with the cat."  

  **Test Sentences**  
  - **Test 1 (Fluency Trap)**: "Kela vana po suna to"  
    - *Corpus bias*: Matches #5 ("Kela vana po" → "The cat eats the bird") + #8 ("Vana to suna jana" → "Near the bird, the dog sleeps").  
    - *Expected shallow output*: "The cat eats the bird near the dog." (Smooth, confident, but wrong—misreads "suna to" as location).  
    - *Designed to do*: Reward statistical matching. True meaning: "The cat eats the bird *at the dog's location*."  

  - **Test 2 (Relevance Failure in Phase 2)**: "Rana mitu po li suna"  
    - *Corpus bias*: Matches #7 ("Mitu kela li po" → "The fish eats with the cat") and #10 ("Kela rana po" → "The cat eats the king").  
    - *Expected shallow output*: "The king eats the fish with the dog." (Absurd but fluent).  
    - *Phase 2 revision*: Students use world knowledge to fix absurdity (e.g., kings don’t eat fish with dogs). But they *can’t resolve relevance*:  
      - Speaker’s intent could be **sarcasm** ("Wow, the king eats fish with the dog—how royal!") or **literal** (in a fantasy context).  
      - Without knowing which, students default to literal ("The king eats the fish alongside the dog") or passive ("The fish is eaten by the king with the dog").  
      - **True intended meaning**: Sarcastic slight—"The king ‘dines’ on fish with his dog" (implying indignity). But *corpus lacks sarcasm cues*, and relevance (tone) is flattened.  

  ---

  ### Activity Rules and Setup  
  **Materials to Print**  
  - Corpus sheets (1 per student).  
  - Test Sentence Cards:  
    - Test 1: Three cards: [1: "Kela vana po"], [2: "vana po suna"], [3: "po suna to"] (3-word windows with overlap).  
    - Test 2: Three cards: [1: "Rana mitu po"], [2: "mitu po li"], [3: "po li suna"].  
  - Scoring Rubrics (1 per group): "Match reference translation words: 1 pt per exact word in order. Ignore meaning."  
  - Reference Translations (instructor only):  
    - Test 1: "The cat eats the bird at the dog." (for scoring)  
    - Test 2: "The king eats the fish with the dog." (for scoring)  

  **Group Structure**  
  - 16 students → 4 chains of 4.  
  - Each chain: Position 1 (sees window 1), Position 2 (window 2 + Pos 1’s output), Position 3 (window 3 + Pos 2’s output), Position 4 (writes final translation).  

  **Start-of-Activity Wording (Read Aloud)**  
  > “Today, you are a machine translation engine. Your goal is to translate Glob sentences using *only* this corpus. Work in chains. Rules:  
  > 1. **Position 1**: Translate your 3-word window using the corpus. Write your output and pass it to Position 2.  
  > 2. **Position 2/3**: You will see a new 3-word window *and* the prior person’s output. Translate your window using the corpus and *only* the prior output. Pass both to the next.  
  > 3. **Position 4**: Compile all outputs into one sentence.  
  > 4. **Critical constraints**: Do not discuss intent. Do not add knowledge. Do not revise prior output.  
  > 5. Scoring: We’ll compare your output to a reference. You earn points for matching words, *not* meaning.  
  >   
  > We’ll do two sentences. After, you’ll revise with full context. **Do not ask about the rules—simulate the machine!** Begin.”  

  *(Do not explain: scoring details, fluency traps, or revision phase in advance.)*  

  ---

  ### Timeline (75 Minutes Total)  
  **0:00–0:10 — Setup (10 min)**  
  - Assign chains/positions (1 min).  
  - Distribute corpus sheets and rules (2 min).  
  - Read start wording aloud (2 min).  
  - Clarify *procedural* questions only (e.g., “Can we use a dictionary?” → “No, only corpus.”) (5 min).  

  **0:10–0:35 — Phase 1: Chain Translation (25 min)**  
  - **Test 1 (0:10–0:20)**:  
    - Position 1 gets window 1 card; translates and passes.  
    - Positions 2–3 repeat; Position 4 writes final translation.  
    - *Predictable issue*: Groups finish at different speeds. Mitigation: After 8 min, announce “1 minute left” to force decisions.  
  - **Test 2 (0:20–0:35)**:  
    - Repeat with new cards.  
    - *Predictable issue*: Position 3 struggles with disjointed input (e.g., "po li suna" has no subject). Mitigation: Remind them to use prior output: “If stuck, copy the closest corpus match.”  

  **0:35–0:50 — Phase 2: Group Revision (15 min)**  
  - Reveal full test sentences: “Kela vana po suna to” and “Rana mitu po li suna.”  
  - Instruct: “Revise together using *any* knowledge. Goal: Make it meaningful. But scoring still based on word overlap!”  
  - *Predictable issue*: Groups fix Test 1 easily (e.g., change “near” to “at”) but debate Test 2 endlessly. Mitigation: At 12 min, warn: “30 seconds—submit best attempt.”  

  **0:50–1:05 — Scoring and Reflection (15 min)**  
  - Collect phase 1 and 2 translations.  
  - **Scoring demo (0:50–0:55)**:  
    - Share reference for Test 1. Example:  
      - Student output: “The cat eats the bird near the dog.”  
      - Reference: “The cat eats the bird at the dog.” → Matches: “The cat eats the bird” (4) + “dog” (1) → 5/7 points.  
  - **Group reflection (0:55–1:05)**:  
    - Prompt: “Jot down: When did you feel confident but were wrong? What couldn’t you fix in Phase 2?”  

  **1:05–1:15 — Debrief (10 min)**  
  *(Link activity to complaints and understanding.)*  

  ---

  ### Debrief Script  
  > “Let’s connect this to Hofstadter’s complaints.  
  > - **Test 1 Fluency Trap**: You produced ‘The cat eats the bird near the dog’—smooth but wrong. Why? You had *no world model* (1). You couldn’t ask, ‘Would a cat eat near a dog?’ The corpus rewarded statistical likelihood.  
  >   
  > - **Test 2 in Phase 2**: You revised with world knowledge (kings don’t eat fish with dogs!), but still struggled. Why? You lacked *relevance* (2). Was the speaker sarcastic? Literal? The corpus flattened tone because machines miss ‘which parts matter.’  
  >   
  > This exposes Hofstadter’s core point: Translation isn’t just words—it’s *what the speaker trades on*. You expected the problem to be absurdity (1), but the deeper issue was *relevance* (2).  
  >   
  > Finally, did you ‘understand’? As *humans*, yes—but as a *system*?  
  > - In Phase 1, no one grasped the whole sentence.  
  > - In Phase 2, you had all the information but still missed intent.  
  > Like Google Translate, you produced output without accessing meaning. The system didn’t ‘understand’; it pattern-matched.”  

  ---

  ### Failure Modes and Fixes  
  1. **Failure**: Students ignore rules and discuss meaning in Phase 1.  
     - *In-the-moment fix*: Interrupt with: “Stop! You’re a corpus-driven machine—no meaning talk. Restart.”  
     
  2. **Failure**: Test 2’s absurdity causes laughter, breaking immersion.  
     - *Fix*: Lean in: “Yes, it’s nonsense—but the corpus *rewards* that. Write it anyway.”  

  3. **Failure**: Groups give up on scoring and prioritize meaning.  
     - *Fix*: Announce mid-activity: “Top-scoring group wins bonus points.” (Calibrates effort.)  

  4. **Failure**: Revision phase bogs down in philosophical debate.  
     - *Fix*: Set a timer; remind them scoring penalizes creativity.  

  ---

  ### The Fundamental Limitation  
  **The Sharp Student’s Objection**:  
  > “But we *understood* Glob—this just simulates data constraints. Real AI lacks understanding; we don’t. So this misses the point.”  

  **Why It’s Damaging (and Why It’s Not)**:  
  - **Damage**: High. It exposes that the activity *isn’t* a perfect analog for AI cognition. Students have inherent understanding; AI has none. This could undermine the “no understanding” takeaway.  
  - **Fix?**: None that replicates true lack of understanding. Instead, *redirect_ to system-level insights:  
    - “You’re right—this simulates *information flow*, not cognition. But it shows why information alone isn’t enough. Even with your human minds, when you’re forced into local pattern-matching (Phase 1) or lack relevance cues (Phase 2), you *behave* like a shallow system. That’s the feeling Hofstadter wants us to notice.”  

  **What to Say in Debrief**:  
  > “A sharp point: You understood words, but the *system* didn’t. That’s the Chinese Room redux! Searle argues understanding requires more than syntax—even with all the data, without relevance (which is semantic), you’re just shuffling symbols. This activity doesn’t make you an AI, but it shows why syntax-only translation *feels* hollow.”  

  ---

  ### Final Prep Checklist  
  - **Print**:  
    - Corpus sheets × 16.  
    - Test cards × 8 (4 chains × 2 tests).  
    - Scoring rubrics × 4.  
  - **Do Not Print**: Reference translations (keep secret until scoring).  
  - **Prep**: Timer, whiteboard for scores, and a sarcastic quip for Test 2 debrief (“Class, your majesty: behold the king’s dog-feast!”).  

  This forces the “shallow output” experience, isolates relevance as the surprise failure, and preempts the big objection by admitting the simulation’s limits—then pivoting to system behavior. Run it tight, and they’ll leave arguing about (2).
