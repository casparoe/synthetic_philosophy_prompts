  Okay, the user is a junior instructor leading a discussion section on comparative ethics. They've just covered Aristotle for two weeks and now have one session on early Confucian role ethics. Their main goal is to contrast Confucius with Aristotle to prevent students from seeing Confucius as just "Aristotle with Chinese names." They need a concrete teaching plan focusing on four aspects: the sequence of ideas, a central example, addressing misconceptions, and a closing question.

  First, I need to consider the best starting point. The user thinks beginning with the constitutive claim—that a person is made up of their roles—is essential. I agree. Without this foundation, concepts like filial piety or humaneness might be misinterpreted as duties or virtues attached to a pre-existing self. So starting here is crucial. But I should also introduce the idea of roles as relational positions first to avoid confusion.

  For the central example, the user proposed the "father stealing sheep" passage from the Analects. They're worried it might lead to debates about corruption or relativism. Alternatives like a TA who's also a friend or the family-state analogy were considered. The sheep example is actually strong because it forces a role-based evaluation. To prevent derailment, I should frame it carefully: clarify it's not about legalism vs. corruption but about role-constituted morality. Prepare to redirect by asking what "upright" means in different relationships. But maybe have a backup modern example ready if needed.

  Addressing misconceptions is vital. Students might think role ethics means just doing what society expects, or that it's relativist. They might conflate it with virtue ethics or see filial piety as blind obedience. The Aristotle comparison could lead to viewing roles as external rather than constitutive. I need to tackle these by emphasizing internalization through ritual (li) and how ren (humaneness) emerges from roles. Introducing gentle remonstration early can show filial piety isn't obedience. Also, clarify that role ethics has a structure for strangers via role extension.

  For the closing question, the user suggested asking about an un-discussed role. A good idea but needs specifics. Ask them to define the role's expectations and how goodness is judged within it. The tell is whether they ground the answer in relationships rather than individual virtues. Avoid roles too close to discussed ones to prevent parroting.

  What to skip? The virtue ethics vs. role ethics debate is too scholarly for this level. Human nature debates can be omitted too. Focus on the constitutive claim and contrast with Aristotle. Cutting these won't hurt the session's core goal.

  Overall, the session structure should be: roles as relational positions → constitutive claim → the sheep example → filial piety with remonstration → ren as role-based → addressing strangers. Constantly tie back to Aristotle to highlight differences. Use questions to guide discussion and preempt misconceptions. The key is ensuring students grasp that roles define the self, not just guide actions.
answer: |-
  Here’s a battle-tested plan for your 50-minute session, leveraging Aristotle as a foil while targeting the core shift to role ethics. The goal isn’t comprehensive coverage but a visceral grasp of the **constitutive claim** and its implications.

  **Sequence of Ideas (Order & Dependencies):**  
  *Start exactly where you instinct says:*  
  1. **Roles as Relational Positions (5 mins):**  
     - *Board:* "Aristotle’s *agent* (rational soul) → Confucian *role* (son, ruler, friend)".  
     - *Hook:* "Aristotle asks 'What is a *human* for?' Confucius asks 'What is a *son* for?'"  
     - *Dependency:* Roles are not "added" to a person; they define the person’s very being. Without this, everything collapses into duty/virtue ethics.  

  2. **The Constitutive Claim (10 mins):**  
     - *Board:* "**Person = Bundle of Roles** (e.g., ‘I’ am son/brother/teacher/citizen simultaneously)".  
     - *Contrast:* Aristotle’s agent *has* virtues; Confucian roles *constitute* the self. Use a *Chinese correlative cosmology* metaphor: roles are like interlocking puzzle pieces forming the whole picture.  
     - *Key Question:* "If your roles vanished, would ‘you’ still exist? What would be left?"  

  3. **Filial Piety (*Xiao*) as the Test Case (15 mins):**  
     - *Introduce through remonstration FIRST:* Analects 4.18 ("Serve parents with gentle remonstration").  
     - *Why here?* Preempts "blind obedience" misconception. Frame it as: *How does a good son act?* → Not obedience, but active, context-sensitive care (including correction!).  
     - *Dependency:* This only makes sense if the son *is* his role. A standalone agent "obeys"; a son *embodies*.  

  4. **The Sheep Example (Analects 13.18) - Controlled Detonation (10 mins):**  
     - *Why it works:* Forces role-contextuality. "Upright" = relational goodness, not abstract justice.  
     - *How to avoid derailment:*  
       - Pre-frame: "This isn’t about modern legal ethics. Suspend ‘corruption’ talk. Ask: What does ‘upright’ mean *for a son* vs. *for a citizen*?"  
       - Redirect: "If roles *constitute* you, can ‘upright’ mean one thing universally? What’s the alternative?"  
       - If relativism emerges: "Is it arbitrary? Or is there a *standard* for being a good son?" → Transition to *ren*.  
     - *Must contain:* A role-based action that flips valence (concealing theft = *upright* for son).  
     - *Must NOT contain:* A role conflict (e.g., citizen vs. son). Save that for advanced study; it muddies constitutive focus.  

  5. **Humaneness (*Ren*) as Role-Based Excellence (5 mins):**  
     - *Board:* "**Ren = Cultivated Capacity to Fulfill Roles Well**".  
     - *Contrast:* Not Aristotle’s *universal* virtue (e.g., courage for all). *Ren* is the *apt relational responsiveness* grown from mastering specific roles (start with *xiao* → extend).  
     - *Dependency:* Requires constitutive claim. *Ren* isn’t a virtue an atomistic self "has"; it’s the flowering of relational personhood.  

  ---

  **Central Example:**  
  **Stick with the Sheep.** It’s textually core and disrupts Aristotelian intuitions perfectly. Preempt pitfalls:  
  - *If corruption/nepotism arises:* "Would Confucius endorse a son hiding a murder? Probably not. Why? Because *ren* sets boundaries. The father here stole *a sheep*—a minor wrong. The son’s concealment preserves the relationship’s fabric, which is foundational to society."  
  - *If relativism:* "Is ‘good son’ defined by *anything*? No—it’s shaped by *li* (ritual norms), historical models, and *ren*’s demand for harmony. It’s *relational*, not relative."  

  **Modern alternatives dilute the constitutive shock.** The TA/friend example risks feeling like "role conflict," not role-constitution. Family-to-state can sound hierarchical if not deeply contextualized.  

  ---

  **Misconceptions & Interruption Points:**  
  *Listed in likely emergence order, with counter-moves:*  

  1. **"So it’s just doing what society expects?"**  
     - *When:* After introducing roles.  
     - *Head off:* Immediately contrast with *li* (ritual) as *internalized, cultivated patterns*—not external rules. Ask: "Is a ‘good son’ just checking boxes? Or is it a *felt orientation* grown through practice (like Aristotle’s habituation)?"  

  2. **"It’s virtue ethics with different virtues!"**  
     - *When:* When *xiao* or *ren* is introduced.  
     - *Head off:* Hammer the constitutive claim: "Aristotle’s virtues modify a pre-existing self. Confucian ‘virtues’ *are how the role is lived well*. There’s no ‘you’ prior to the roles to *have* the virtue."  

  3. **"Filial piety = obedience"**  
     - *When:* During *xiao* discussion.  
     - *Head off:* Preempt by starting with remonstration (Analects 4.18). "How can you ‘remonstrate gently’ if your role requires mindless obedience?"  

  4. **"No self? So no responsibility?"**  
     - *When:* After constitutive claim.  
     - *Head off:* "Responsibility isn’t gone—it’s *located in the role*. You’re accountable *as son*, *as friend*. Losing an atomistic ‘core self’ doesn’t erase obligation; it relocates it."  

  5. **"What about strangers? (Not a real ethics!)"**  
     - *When:* Likely post-sheep or during Q&A.  
     - *Head off:* Late in *ren* discussion: "*Ren* extends role-based care outward. You treat a stranger *as if* in a role (e.g., ‘guest’). Why? Because all humans are embedded in *some* network of roles you can analogize to."  

  6. **Aristotle-specific trap: "Roles are just external circumstances for virtue display."**  
     - *When:* Anytime.  
     - *Head off:* Reiterate constitutive claim: "For Aristotle, roles are *situations* his phronimos navigates. For Confucius, roles *are the navigator*."  

  ---

  **Closing Question (Last 5 mins):**  
  **"Imagine a ‘barista’. What would it mean to be ‘good at being a barista’ *in Confucian role ethics*? What makes this different from an Aristotelian ‘virtuous barista’?"**  

  - *Why it works:* Forces application of constitutive claim. The "tell" is if they:  
    - Define goodness *relationally* (e.g., "responds well to customers’ needs, harmonizes with coworkers") vs. listing individual virtues ("efficient, knowledgeable").  
    - Contrast with Aristotle by noting no "core self" behind the role.  
  - *Gaming risk:* Low if the role is novel. If they say "be kind/attentive," push: "Is that a *universal virtue* or *specific to the barista role*?"  

  ---

  **What to Explicitly Skip:**  
  1. **"Virtue Ethics vs. Role Ethics" scholarship debate.** Say: "Today we’re emphasizing the role-based reading *for contrast*. Scholars debate this—we’re bracketing that."  
  2. **Human nature (Mencius vs. Xunzi).** Say: "Whether *ren* is innate or trained is huge in later Confucianism. For now, note: early texts stress *cultivation through ritual (li)*, which assumes *some* malleable starting point."  

  **Cutting these costs nothing for your goal.** It sharpens focus on the constitutive claim and the Aristotle-Confucius juxtaposition—which is exactly where your leverage lies.  

  **Session Flow Summary:**  
  1. (5 min) Hook: Agent (Aristotle) vs. Role (Confucius)  
  2. (10 min) Constitutive Claim: Person = Roles  
  3. (15 min) *Xiao* w/ Remonstration → Sheep Example  
  4. (5 min) *Ren* as Role-Responsiveness  
  5. (10 min) Q&A / Misconception Busting  
  6. (5 min) Closing Question: "Barista"  

  **Crucial:** Use the board relentlessly to map dependencies. At session end, the left column (Aristotle) should clearly contrast the right (Confucius) on agency, selfhood, and the locus of ethics. They’ll leave unsettled—which means you’ve succeeded.
