prompt: |-
  I'm writing up my position on individual duties in collective-harm cases for a graduate seminar in practical ethics, and I'd like it stress-tested before I commit to it in front of people who will enjoy taking it apart. Here is the set, as precisely as I can state it.

  (1) Threshold cases. Where the bad outcome depends on a collective total's crossing a discrete threshold and my contribution is not the one that crosses it, I make no difference, and so no duty falls on me. Concretely: the supermarket I use takes chickens from its supplier in sealed crates of fifty under a standing contract, and sets each week's order to the smallest number of crates that would have covered the previous week's sales; birds that go unsold are marked down and eaten anyway. So unless I happen to buy the chicken that pushes the week's sales to a multiple of fifty, my purchase changes nothing downstream, and I take myself to have no duty, on difference-making grounds, to stop buying them.

  (2) Continuous cases. Where harm is a continuous function of the total — my flights, my heating — I reject the inefficacy objection. The expected harm of my marginal tonne is the product of a small probability of making a real difference (helping to push some subsystem past a tipping point) and a very large harm, and I don't think a probability gets to be ignored merely for being small.

  (3) The grounds. I don't think marginal efficacy is where most of my climate duties come from anyway. The operative grounds, as I see them, are fair share — I am taking more than my share of a genuinely scarce resource, the absorptive capacity of the atmosphere, from people with stronger claims to it — and the thought that I should not live off a practice whose wrongness I am willing to name in the seminar room. Neither of these looks to me as though it depends on whether my own tonne changes anything.

  (4) Voting. I think I ought to vote, and I take the standard expected-value defence to be sound: a very small chance of being decisive multiplied by very large stakes. So here I treat a small probability of making a difference as duty-generating, even though the case is a threshold case.

  (5) The crux of (1). I also think the purchaser who does buy the crate-triggering chicken has no more reason to abstain than anyone else and no special duty. Whether he is the one depends on how many birds other people happened to buy that week, which he cannot see, and I don't want duties that turn on invisible facts about other people's behaviour.

  (6) Method. I reject the what-if-everyone-did-that test as a route to individual obligation, on the familiar ground that it compares my actual act with a world in which everyone else acts differently, which is not an option available to me. But I do accept a duty to do my fair share of a collective effort, where the share is fixed by whatever fair scheme for allocating the burden we have actually managed to agree on.

  (7) Level. I am happy to argue as a consequentialist about what the institution or the policy should be — carbon pricing, crate sizes, procurement rules — and as a non-consequentialist about what I personally owe in the meantime. I take these to be questions at different levels rather than the same question asked twice.

  My worry, vaguely, is that (3) is doing more work than I have earned, but I can't locate the fault and I would rather find it now than in the seminar. Go through the set and audit it: which pairs genuinely pull against each other, which only look as though they do, and for each real tension what would have to give and what giving it up would cost me. Rank the tensions by severity rather than listing them as equally bad, and tell me at the end which single revision would clean up the most and what the position looks like once it is made.

  Lead with your bottom line in the first sentence and then give the reasoning. No preamble, and don't restate my question back to me.
reasoning: |-
  Okay, the user is preparing for a graduate seminar in practical ethics and wants their position on individual duties in collective-harm cases stress-tested. They've outlined seven points and are particularly worried about point (3) carrying too much weight. Let me start by understanding their main arguments.

  First, in threshold cases (1), they argue no duty exists if your action doesn't cross the threshold. Their supermarket example with chicken crates illustrates this. Then, in continuous cases (2), they reject the inefficacy objection because even small probabilities of causing harm matter when multiplied by large stakes. Point (3) shifts the grounds for duties to fair share and complicity, not marginal efficacy. 

  Voting (4) is treated differently as a threshold case where small probabilities still create duties. The crux in (5) insists that triggering a threshold doesn't impose special duties, especially when invisible to the individual. Methodologically (6), they reject the "what if everyone did that" test but accept fair share duties based on agreed schemes. Finally, (7) separates institutional consequentialism from personal non-consequentialism.

  The user’s main concern is that (3) might be overburdened. Looking for tensions, I see a clash between (1) and (4). Both involve thresholds, but voting duties are accepted while purchasing isn't. The justification for voting uses expected value, which isn't applied to the chicken example. Why not use the same reasoning for the supermarket? If the probability of triggering a crate order isn't zero, then maybe there's a duty. But the user dismisses this in (1), which creates inconsistency.

  Another tension is between (3) and (1)/(5). Fair share and complicity grounds in (3) might imply duties even in threshold cases, but (1) and (5) deny any duty unless you're the trigger. If fair share is about not taking more than your allotment, then buying chicken might violate that regardless of marginal impact. Yet the user says no duty in (1), which conflicts with (3). 

  Also, (2) and (1) conflict. Continuous cases consider expected harm from small probabilities, but threshold cases like the chicken crate don't, even though there's a small chance any purchase could trigger an order. The user's rejection of marginal efficacy in (1) but acceptance in (2) and (4) needs justification. Maybe they think tipping points in climate change have higher stakes, but that's not clearly argued.

  (5) argues against duties based on invisible facts, but (3)'s complicity might not depend on such facts. If complicity is about benefiting from a harmful practice, visibility isn't relevant. So (5) might unnecessarily limit (3).

  The severest tension is between (1) and (4). Harmonizing them requires either extending expected value to threshold purchases or dropping it from voting. Applying expected value to chicken purchases would mean acknowledging a small duty, which the user might resist because it complicates daily decisions. But not doing so makes their position inconsistent. Alternatively, they could argue voting has unique stakes (e.g., democratic participation) beyond consequences, but that's not stated.

  Another major fix is aligning (1) and (5) with (3). If fair share duties exist regardless of marginal impact, then in the chicken case, consuming more than a fair share might be wrong even if it doesn't trigger a new crate. The user might need to accept duties in threshold cases based on fair share, contradicting (1). Or, they could refine fair share to only apply when collective schemes exist, but (6) mentions agreed schemes, which might not be present in the supermarket example.

  The user's meta-point (7) might help separate concerns. Institutional changes (like smaller crates) are consequentialist, while individual duties are non-consequentialist. But fair share in (3) could bridge both, suggesting that without institutional schemes, fair share isn't defined. In the chicken case, without an agreed scheme, maybe no fair share duty applies. But then (3)'s reliance on fair share in climate change assumes such a scheme exists, which is debatable.

  The single best revision would be to drop the expected value argument for voting (4) and rely instead on non-consequentialist grounds like civic duty. This resolves the inconsistency with (1) without forcing expected value onto all threshold cases. However, the user might be attached to the standard voting rationale. Alternatively, extend expected value to all threshold cases with small probabilities, but that could impose pervasive minor duties, which the user seems to want to avoid (as per (1)).

  Alternatively, clarify that fair share duties (3) apply only when a collective scheme exists, as per (6). In the chicken case, without such a scheme, no duty arises, but in climate, with international agreements like Paris, fair shares are defined. However, the user's example doesn't mention any scheme for chicken, so maybe that's consistent. But complicity might still apply—benefiting from factory farming regardless of schemes.

  A deeper issue: the user rejects marginal efficacy in (3) but uses it in (2) and (4). They need to reconcile why expected harm matters in some cases (climate, voting) but not others (chicken). Perhaps they could argue that the magnitude of harm differs, or the probability calculations vary. But without clear criteria, this seems ad hoc.

  In summary, the biggest problem is the inconsistent treatment of threshold cases between (1), (4), and (2). Resolving that either requires adjusting the voting argument or accepting some expected harm in consumption thresholds. The former might be less costly to the user's overall position. Also, ensuring that fair share and complicity in (3) are framed to not depend on marginal impact, making them consistent with (1) only if fair share isn't violated in the chicken case—perhaps by defining fair shares contextually.
answer: |-
  **The severest tension is between (1)/(5) and (4), creating inconsistency in handling threshold cases; abandoning the expected-value defense for voting (4) would resolve this most cleanly while preserving your core commitments, though it costs a standard rationalist argument.**

  **Audit of Tensions, Ranked by Severity:**

  1.  **(1)/(5) vs. (4) [Threshold Cases vs. Voting]: Severe Logical Inconsistency.**
      *   **Tension:** Both involve discrete thresholds. In (1)/(5), you deny any duty in threshold cases where your act isn't the decisive one, explicitly rejecting probabilistic expected harm *in this context* ("my purchase changes nothing... no duty"). In (4), you *affirm* a duty in a threshold case (voting) *based precisely* on probabilistic expected harm ("a very small chance of being decisive multiplied by very large stakes").
      *   **Conflict:** You cannot consistently reject probabilistic reasoning for duties in consumer threshold cases while embracing it for voting threshold cases *solely on the grounds of threshold structure and small probability of decisiveness*. (1)/(5) implies that small probabilities of decisiveness are irrelevant for duty in threshold cases; (4) asserts they are sufficient.
      *   **Resolution & Cost:** You must abandon one position.
          *   *Option A (Give up (1)/(5) re: probabilistic harm):* Apply expected value reasoning to the chicken case. Even if unlikely, there *is* a small probability your purchase is decisive. If the stakes (chicken suffering) are high enough, a duty *could* arise. **Cost:** Undermines your central claim in (1), forces you into pervasive minor duties for many consumption choices, clashes with "invisible facts" objection in (5).
          *   **Option B (Give up (4)'s expected-value defense - Recommended):** Ground the duty to vote on non-consequentialist grounds compatible with (1)/(5) and (3): e.g., civic virtue, expressive commitment, fulfilling one's role in a collective scheme (linking to (6)), or fairness in sharing the minimal burden of participation. **Cost:** Loses the clean, quantitative expected-value argument for voting, requires developing an alternative non-consequentialist foundation for voting duty. This is the revision that cleans up the most fundamental inconsistency without forcing consequentialism into (1).

  2.  **(1) vs. (2) [Threshold vs. Continuous Cases]: Moderate Apparent Tension.**
      *   **Apparent Tension:** You reject marginal efficacy concerns in a threshold case (1) but embrace them (via expected harm) in a continuous case (2).
      *   **Resolution:** This is *potentially* consistent. Your justification for (2) hinges on the *nature* of climate harm – tipping points exist, making even marginal contributions carry catastrophic risk potential. The chicken case lacks this feature; crossing the threshold orders more crates, but the harm per crate is fixed and not catastrophic *in the way climate tipping points are*. The "very large harm" in (2) refers to the *magnitude of the potential catastrophe triggered*, not the marginal tonne itself.
      *   **Risk:** It requires clearly distinguishing the *kind* of risk involved. If pressed on why probabilistic reasoning is valid for climate tipping points but not for triggering a chicken crate order, your response relies on the qualitative difference in the *scale and nature* of the potential harm triggered (catastrophic systemic risk vs. incremental harm). This distinction needs defense but isn't inherently contradictory.

  3.  **(3) vs. (1)/(5) [Fair Share/Complicity vs. Threshold Cases]: Moderate Substantive Tension.**
      *   **Tension:** Your primary grounds for climate duties (3) – fair share and complicity – seem logically independent of whether an act is threshold-crossing or not. Yet, in (1)/(5), you conclude *no duty at all* in the chicken threshold case, seemingly overriding any potential fair share or complicity concerns ("no duty falls on me").
      *   **Conflict:** If consuming factory-farmed chicken is wrong based on fair share (of animal suffering capacity?) or complicity in an unethical system, why does the *contingency* of being the threshold-crosser nullify the duty? (3) claims these grounds don't depend on marginal difference.
      *   **Resolution & Cost:** You need to either:
          *   *Argue Fair Share/Complicity Don't Apply Here:* Claim that fair share/complicity arguments only gain traction in contexts like the atmosphere (genuinely scarce, global, no alternative schemes) or where the *practice itself* is inherently wrong *and* one benefits directly. The chicken example might lack one/both. **Cost:** Weakens the universality of (3), requires criteria for when fair share/complicity apply.
          *   *Accept a Duty in (1) Based on (3):* Concede that fair share/complicity *do* generate a duty to avoid buying the chicken *regardless* of threshold-crossing status. **Cost:** Forces you to abandon the strong "no duty" claim in (1), significantly altering that case's conclusion and conflicting with (5)'s aversion to duties based on invisible facts (though (3) may be insensitive to this).
          *   *Clarify (3) is Primary Context:* Treat the chicken case as an outlier where (3) doesn't bite strongly, while maintaining (3) as the core justification for the *more significant* case of climate duties. **Cost:** Appears ad hoc; doesn't fully resolve the logical claim in (3) that the grounds are difference-making independent.

  4.  **(5) vs. (3) [Invisible Facts vs. Complicity]: Minor Potential Tension.**
      *   **Tension:** (5) rejects duties turning on "invisible facts about other people's behaviour." (3)'s complicity argument ("should not live off a practice whose wrongness I am willing to name") seems independent of others' behavior – the wrongness inheres in the practice and my participation/benefit.
      *   **Resolution:** This is likely resolvable. Complicity, as framed, depends on the *general nature* of the practice and your relationship to it, not on the *specific, contingent* actions of others that make your act decisive (the invisible fact in (5)). Knowing the practice is wrong and that you benefit from it is sufficient for complicity concerns, regardless of whether your *specific* purchase triggered a crate *this week*. (5) is specifically worried about duties contingent on *being the decisive actor*, which complicity avoids.

  5.  **(6) vs. Implication of (3): Minor Conceptual Tension.**
      *   **Tension:** (6) grounds individual duty in "my fair share... fixed by whatever fair scheme... we have actually managed to agree on." (3) posits a fair share duty based on "a genuinely scarce resource" and others' "stronger claims," seemingly *prior to* any agreed scheme.
      *   **Resolution:** This is manageable. (3) can be seen as providing the *moral foundation* (why a fair share matters) for the *practical duty* described in (6) (acting according to an *actual* agreed scheme). Without an agreed scheme, (3) might generate a duty to *help establish* one or to act cautiously (linking to (2)), but (6) specifies the primary operational duty *under* a scheme. The tension is mild and common in non-ideal theory.

  **Conclusion on (3):** While (3) is central, it doesn't bear *unearned* weight alone. Its main pressure point is the tension with (1)/(5). However, the *most severe and fundamental* inconsistency lies between your handling of threshold cases in consumption (1)/(5) vs. voting (4). **The single revision cleaning up the most is abandoning the expected-value defense of voting (Option B above).** This resolves the core logical clash without forcing consequentialism onto (1) or abandoning (3). Your position then becomes: Threshold cases (like chicken crates) don't generate probabilistic duties, nor special duties for the decisive actor (1)/(5). Continuous cases with catastrophic tipping point risks do generate duties based on expected harm (2). Core climate duties stem from fair share and complicity, independent of marginal impact (3). Voting is a duty, grounded in non-consequentialist reasons like fairness, role-fulfillment, or civic virtue (revised 4). Methodologically, reject "what if everyone" but accept fair shares under agreed schemes (6). Institutions are designed consequentially; individual duties are often non-consequentialist (7). This position is more internally consistent, though it requires developing a robust non-consequentialist account of voting.
