answer: |-
  Here is a taxonomy structured as a decision tree, built from logical choices grounded in concrete cases. It prioritizes the branching questions over labeling views until the leaves. The independent choices are: **Core Wrong-Making Feature (CWF)**, **Status of Withholding/Omission (WO)**, **Convention's Role in Content (CRC)**, and **Impact of Hearer's Belief State (HBS)**. Choices about speaker/hearer benefit and erosion of trust are often *dependent* on the core CWF and emerge later.

  **Key Independent Choices:**
  1.  **CWF:** What constitutes the core wrong? (A: Asserting believed falsehood / B: Intentionally causing false belief / C: Causing false belief via trusted means)
  2.  **WO:** Is withholding information/letting a false default stand equivalent to asserting a falsehood? (Yes/No)
  3.  **CRC:** Do conventions *fix the literal content* of what is said, or only the *reasonable inferences* drawn from it? (Fixes Content / Fixes Inference Only)
  4.  **HBS:** Does it matter if the hearer *discounts* the speaker or *never believes* the utterance? (Yes, it negates wrong / No, irrelevant)

  **Collapsed/Dependent Choices:**
  *   "Benefit Accrues to Whom?" and "Erosion of Trust" are typically *consequences* evaluated within a position's core framework (e.g., consequentialist weighs benefits; trust-erosion sees intrinsic harm; rigorist may ignore).
  *   "Satisfaction via Literal Truth + Framing" collapses under **CRC**. If conventions fix content, framing might be deceptive but not a lie. If they fix inferences, framing *can* be deceptive lying/misleading.
  *   "Indifference to Truth" vs. "Falsity Itself" emerges as a *motivational* distinction often downstream of the core CWF.

  **The Decision Tree:**

  1.  **Case: A colleague you dislike offers a standing invitation to dinner, saying "Drop by anytime!" as a polite gesture. Neither of you expects it to be accepted. You have no intention of going. Is this utterance problematic?**
      *   **Yes (Problematic)** -> Go to 2
      *   **No (Not Problematic)** -> Go to 3

  2.  **(Problematic) Case: Someone asks "How are you?" in passing. You feel terrible but reply "Fine!" Is this problematic primarily because...**
      *   **A: You asserted something you believe false ("I am fine")?** -> Go to 4
      *   **B: You intended to cause them to believe the falsehood that you are fine?** -> Go to 5
      *   **C: You caused (or risked) a false belief ("She's fine") using a form of words ("How are you?" + "Fine!") they were entitled to trust for sincere updates?** -> Go to 6

  3.  **(Not Problematic) Case: A known compulsive liar tells you it's raining. You automatically discount everything they say and don't believe them. Was their utterance problematic?**
      *   **Yes (Problematic)** -> Go to 7
      *   **No (Not Problematic)** -> Go to 8

  4.  **(A: Asserted Falsehood) Case: Your friend asks "Is Alice home?" intending to deliver bad news Alice doesn't want. Alice is hiding in the closet. You know this. Saying "No" would be false. Saying "I haven't seen her come in" is literally true but implies she's not home. Is the true-but-misleading answer permissible?**
      *   **No, it's still deceptive and wrong.** -> Leaf 1: **Rigorist Assertionism**
      *   **Yes, because it's literally true.** -> Go to 9

  5.  **(B: Intended False Belief) Case: Same as Case 4. Is the true-but-misleading answer permissible?**
      *   **No, intending the false belief is the core wrong, regardless of literal truth.** -> Leaf 2: **Deception-as-Hijacking**
      *   **Yes, because you didn't *assert* a falsehood; the hearer jumped to a conclusion.** -> Leaf 3: **Misleading Permissible (Lesser Duty)**

  6.  **(C: Caused via Trusted Means) Case: Same as Case 4. Is the true-but-misleading answer permissible?**
      *   **No, you exploited their trust in conventional meanings to cause a false belief.** -> Leaf 4: **Trust-Exploitation View**
      *   **Yes, conventions only govern inferences, not literal content; you were careful with words.** -> Leaf 5: **Literal Truth Shield**

  7.  **(Problematic despite Discounting) Case: You are asked "Where did you hide the evidence?" by a corrupt official who would use it to harm an innocent person. Telling the truth would cause harm. Is lying permissible here?**
      *   **No, lying is intrinsically wrong, though withholding might be okay.** -> Leaf 6: **Rigorist Absolutism (Modified)**
      *   **Yes, preventing grave harm outweighs the prohibition.** -> Leaf 7: **Consequentialist Threshold**

  8.  **(Not Problematic despite Discounting) Case: Same as Case 7 (harm prevention). Is lying permissible?**
      *   **No, but withholding/evasion is permissible and sufficient.** -> Leaf 8: **Withholding Sanctuary**
      *   **Yes, the hearer's malicious intent or lack of trust negates any duty of literal truthfulness to them.** -> Leaf 9: **Role-Relational Duty**

  9.  **(Permitted Misleading) Case: (From Branch 4) Cross-Regime Mismatch: You (raised in "Dutch-direct" culture) are asked "Do you like my painting?" by someone from a "Japanese-indirect" culture. You think it's terrible. In your culture, honesty is valued; you say "It's... very colorful," intending only to note a fact, not endorse it. In their culture, this phrasing is a standard polite affirmation. They leave believing you liked it. Who bears responsibility?**
      *   **Speaker: They should have known/adapted to the listener's conventions.** -> Leaf 10: **Convention-Responsible Speaker**
      *   **Hearer: They misinterpreted a literally accurate statement within its context.** -> Leaf 11: **Convention-Responsible Hearer**
      *   **Neither/Both: It's a genuine mismatch; the speaker didn't assert falsehood or intend deception, the hearer drew a reasonable inference.** -> Leaf 12: **Mismatch Fatalism / Indifference to Truth**

  **Leaf Views, Commitments, Cross-Regime Analysis & Benefit Sensitivity:**

  1.  **Rigorist Assertionism:** Wrong only if you *assert* a proposition you believe false. Withholding/omission is distinct and permissible. *Awkward Commitment:* Must condemn a literally false "No" to protect Alice, even knowing it prevents harm. *Cross-Regime:* Blames Speaker. "Colorful" was literally true, so no *false assertion*. Speaker safe. Mismatch possible? Yes. *Benefit Sensitivity:* Indifferent. Falsity itself is wrong regardless of beneficiary.
  2.  **Deception-as-Hijacking:** Wrong to intentionally cause a false belief in someone relying on your communication (hijacking their reasoning). Includes misleading and some omissions. *Awkward Commitment:* Condemns the true-but-misleading "haven't seen her" to protect Alice as deceptive. *Cross-Regime:* Blames Speaker. Speaker *intended* to convey information ("it has color") but was indifferent/reckless about causing the false belief "he likes it." Mismatch possible? Yes, but speaker should anticipate. *Benefit Sensitivity:* Indifferent. Hijacking is wrong regardless of motive/benefit.
  3.  **Misleading Permissible (Lesser Duty):** Lying (false assertion) is seriously wrong; deliberate misleading (true statement, intended false inference) is less wrong or permissible. *Awkward Commitment:* Permits actively manipulating someone into a false belief as long as words are literally true. *Cross-Regime:* Blames Hearer. Speaker made a literally true assertion ("colorful"). Hearer drew an unwarranted inference. Mismatch possible? Yes. *Benefit Sensitivity:* May flip. Misleading might be excused for hearer's benefit/smoothness but condemned for selfish gain (lesser duty, not no duty).
  4.  **Trust-Exploitation View:** Wrong to cause a false belief using communicative means the hearer is entitled to trust. Focuses on harm to trust. *Awkward Commitment:* Condemns the polite "Fine!" in phatic exchanges as trust-eroding, even if harmless. *Cross-Regime:* Blames Both. Speaker used words they knew *could* be trusted literally; hearer trusted too readily without context. Mismatch possible? Reluctantly yes, but sees it as breakdown. *Benefit Sensitivity:* Flips. Harmless lies erode trust less? Accepts "smoothness" benefit might sometimes justify minor deception. Selfish lies worse.
  5.  **Literal Truth Shield:** If your words are literally true, you have not lied or deceived, regardless of inferences drawn. Conventions govern inferences, not content. *Awkward Commitment:* "I haven't seen her come in" is always permissible, even if knowingly misleading a vulnerable person. *Cross-Regime:* Blames Hearer. "Colorful" was true. Speaker fulfilled duty. Mismatch possible? Yes, entirely hearer's fault. *Benefit Sensitivity:* Indifferent. Truthfulness achieved via literal accuracy.
  6.  **Rigorist Absolutism (Modified):** False assertion is always wrong. Withholding is permissible. Hearer's discounting doesn't negate the speaker's sin. *Awkward Commitment:* Condemns lying to the corrupt official even to prevent harm to an innocent. *Cross-Regime:* Blames Speaker *only* if "colorful" was literally false. If literally true, safe. (Assumes conventions fix content). Mismatch possible? Only if speaker utters literal falsehood. *Benefit Sensitivity:* Indifferent.
  7.  **Consequentialist Threshold:** Truthfulness is generally good, but overridden by sufficiently good consequences (prevent harm, great benefit) or sufficiently bad consequences of truth. *Awkward Commitment:* Permits lying for significant personal gain if no one else is meaningfully harmed. *Cross-Regime:* Evaluates outcome. If mismatch caused harm/offense, blame speaker for not adapting; if no harm, no blame. Mismatch possible? Yes. *Benefit Sensitivity:* Flips Strongly. Verdict heavily depends on who benefits and how much (hearer benefit/smoothness easily justifies; speaker benefit harder; harm prevention strongest).
  8.  **Withholding Sanctuary:** The core duty is to avoid false assertions. Withholding info, evasion, and letting false defaults stand are distinct and often permissible ways to avoid harm or maintain privacy. *Awkward Commitment:* Permits elaborate evasion and silence even when it clearly causes false beliefs, as long as no false proposition is asserted. *Cross-Regime:* If speaker said only literally true things ("colorful"), no blame. If silence/evasion caused belief, still permissible. Mismatch possible? Yes. *Benefit Sensitivity:* Indifferent to benefit *if* withholding. Focus is on avoiding falsity.
  9.  **Role-Relational Duty:** Truthfulness is defined by the norms of the specific relationship or social role, not universal propositional accuracy. *Awkward Commitment:* Permits blatant lies if they fulfill role expectations (e.g., spy, poker player, actor). *Cross-Regime:* Blame depends on norms. Did speaker violate *their own* cultural norms? Did hearer violate *theirs*? Mismatch possible? Yes, central case. *Benefit Sensitivity:* Flips. Verdict depends on whether the deception fits the relational expectations (often tied to beneficiary - politeness benefits interaction).
  10. **Convention-Responsible Speaker:** Conventions fix the *content* asserted. Speakers must ensure their utterance, interpreted by *reasonable hearer conventions*, conveys truth. *Awkward Commitment:* "Fine!" in phatic exchanges *is* literally false under this view (its conventional content is "I have no issues to discuss"). *Cross-Regime:* Blames Speaker. They used an utterance that, by *reasonable* standards (incl. *hearer's* conventions if known/obvious), conveyed falsehood. Mismatch possible? Denies genuine symmetric mismatch; speaker should know/adapt. *Benefit Sensitivity:* Indifferent. Falsity is falsity.
  11. **Convention-Responsible Hearer:** Conventions govern inferences. Speakers are only responsible for literal truth. Hearers are responsible for drawing contextually appropriate inferences. *Awkward Commitment:* Hearer bears blame for taking "Drop by anytime!" literally, despite context. *Cross-Regime:* Blames Hearer. Speaker made a literally true statement ("colorful"). Hearer drew an inference unwarranted in the *speaker's* context. Mismatch possible? Yes. *Benefit Sensitivity:* Indifferent.
  12. **Mismatch Fatalism / Indifference to Truth:** The core vice is indifference to truth/accuracy itself, not specific acts. Mismatches are inevitable communication failures, not moral faults. *Awkward Commitment:* Sees little wrong with "white lies" if the speaker isn't *indifferent* to truth generally; focuses on character over acts. *Cross-Regime:* Blames Neither (or sees both as victims of circumstance). Genuine mismatch possible? Yes, central case. *Benefit Sensitivity:* Flips. Indifference is worse if motivated by selfishness; lies for smoothness or hearer benefit may show *less* indifference.

  **Diagnostics:**

  1.  **Unoccupied Positions:**
      *   **Branch 3 (Not Problematic) -> Case 7 (Problematic despite Discounting) -> "Yes, lying is permissible to prevent harm" (Leaf 7) BUT paired with Branch 1 "No" (Standing Invite Not Problematic):** Permits lying to prevent harm but sees polite insincere invitations as *unproblematic*. This combination is **unattractive**. It requires seeing polite insincerity as fundamentally different from harmful deception, yet allowing harmful deception under the same core principle (e.g., CWF=B/C) only when harm is at stake, which feels inconsistent. Most views condemning harmful lying also condemn polite insincerity, or vice-versa.
      *   **Branch 2 (Problematic) -> CWF=C (Caused via Trusted Means) -> "Yes, misleading is permissible" (Leaf 5) BUT paired with Branch 3 "No" (Liar's Rain not problematic):** Holds that causing false belief via trusted means is wrong (condemns "Fine!"), permits misleading via literal truth ("haven't seen her"), but says lying to a known disbeliever is *not* problematic. This is **incoherent** under CWF=C. If causing false belief via trusted means is wrong, the liar *attempted* that wrong. The hearer's disbelief might negate the *harm* (false belief), but not the *wrongful act* of attempting to exploit trust. The view would need to collapse CWF into consequences.
      *   **Branch 1 "No" (Standing invite OK) -> Branch 3 "No" (Liar's Rain OK) -> Branch 8 "No, withhold" (Leaf 8: Withholding Sanctuary):** This path exists (Leaf 8). However, a view taking this path *and* holding **CRC: Fixes Content** (e.g., "Drop by anytime!" literally means an open invitation) is **potentially unexplored** or highly unstable. It requires simultaneously asserting that the standing invite *is* literally false (CRC: Fixes Content) but *not problematic* (Branch 1 "No"). This clashes with Rigorist Assertionism (Leaf 1/6) which *would* condemn it as false. Why is *this* literal falsehood OK? A "role-relational" (Leaf 9) or "convention-fixes-inference" (Leaf 5/11) justification fits better. A pure "false assertion is sometimes OK if polite" view isn't well-represented and might be **unattractive** due to arbitrariness.

  2.  **Indistinguishable Leaf Pairs:**
      *   **Leaf 1 (Rigorist Assertionism) vs. Leaf 6 (Rigorist Absolutism Modified):** Both condemn false assertion absolutely. Leaf 6 emerges from the path considering the disbelieving hearer (Case 3) and still condemns lying. Leaf 1 emerges without that path. **Distinguishing Question:** "Case: Lying to a known disbeliever (like the compulsive liar). Is this act *wrong* in itself, even if it causes no false belief?" Leaf 6: Yes. Leaf 1: Might say No (since no assertion was *believed* false? - depends) or Yes. *Further Question Needed:* "Does the *wrongness* of asserting a believed falsehood depend on the hearer *possibly* believing it, or is it intrinsic to the speaker's act?" Leaf 6: Intrinsic. Leaf 1: Likely intrinsic, but the path ambiguity suggests potential nuance. This highlights the HBS choice isn't fully clean.
      *   **Leaf 4 (Trust-Exploitation) vs. Leaf 2 (Deception-as-Hijacking):** Both condemn misleading in Case 4 ("haven't seen her"). **Distinguishing Question:** "Case: You know your friend misheard your true statement 'Alice is *not* in the kitchen' as 'Alice *is* in the kitchen,' and you deliberately don't correct them. Is this wrong?" Leaf 2 (Hijacking): Yes, you intentionally caused/prolonged a false belief by omission. Leaf 4 (Trust-Exploitation): Likely Yes, you exploited their trust by not correcting a misunderstanding *they* made based on your communication. *However, the distinction is subtle.* **Further Question:** "Is the core wrong primarily the *intentional causation* of belief (Leaf 2) or the *exploitation of the hearer's trust* in communication norms (Leaf 4), even if the initial false belief wasn't directly intended?" The leaves emphasize different core features.
      *   **Leaf 12 (Mismatch Fatalism) vs. Leaf 9 (Role-Relational):** Both can find no blame in the mismatch case. **Distinguishing Question:** "Case: A deliberate lie within a shared culture for personal gain (e.g., cheating in poker is forbidden). Is this wrong?" Leaf 9 (Role-Relational): Likely Yes, violates specific relational norms (fair play). Leaf 12 (Mismatch Fatalism/Indifference): Might downplay the act, focusing on whether the speaker *habitually* disregards truth. **Further Question:** "Is the wrong located in violating specific social contracts (Leaf 9) or in a character vice of indifference to truth itself (Leaf 12)?" This probes the fundamental grounding.
