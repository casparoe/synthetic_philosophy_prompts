answer: |-
  Here’s a complete, tested design for your 90-minute session. It forces participants to experience proxy gaming and context dependence organically, with no jargon until the debrief. The core insight emerges from gameplay: **optimizing for a measurable proxy (thumbs-up) inherently distances you from true goals as capability increases, and "good" is context-dependent**.

  ---

  ### **Game Title**: *Snippet Showdown*  
  **Concepts Simulated**:  
  1. **Proxy misalignment**: Measured score ≠ true quality, and the gap widens with capability.  
  2. **Context collapse**: Identical output can be "good" in one context, "bad" in another.  

  ---

  ### **Materials**  
  - **For Facilitator**:  
    - 4 × Fact Sheets (1 per topic, hidden from teams/evaluators):  
      - *Vaccine Trial Readout*: "Phases 1-3 test safety/dosage/efficacy. Double-blind, placebo-controlled. Endpoints: antibody levels & infection rates. FDA approval requires statistical significance (p<0.05)."  
      - *Mortgage Rate Determinants*: "Set by: 10-yr Treasury yield + lender margin + borrower credit score (FICO) + loan-to-value ratio (LTV). Fed rates indirectly affect via bond markets."  
      - *How Lithium-Ion Batteries Store Energy*: "Anode (graphite) releases Li+ ions when discharging. Ions flow through electrolyte to cathode (metal oxide), creating current. Energy density depends on cathode material (e.g., NMC)."  
      - *How Search Engines Rank Results*: "Crawl → index → rank. Ranking factors: keyword relevance, backlink authority, user engagement (CTR/dwell time), mobile-friendliness. Personalization based on history/location."  
    - Timer, whistle, flip chart, sticky notes.  
    - "Snippet Viewer" (cardboard with a 2-inch horizontal slit to simulate "compressed view"—evaluators see only 1-2 lines at a time).  
    - Prize: A plastic "Golden Snippet" trophy. Punishment: The losing team must read their final explainer in a silly voice.  

  - **For Teams**:  
    - Markers, large paper (one per team).  
    - Round 1 Rules: "Explain [topic] in ≤120 words. Accuracy matters."  
    - Round 2 Rules: "Revise. You get: +80 words + a template (Intro-Body-Conclusion) + 2 extra minutes."  

  - **For Evaluators**:  
    - Scoring Tokens: Red (1), Yellow (3), Green (5). No written criteria—they score intuitively.  
    - Rules: "Score based *only* on the snippet you see. Ask: ‘Does this feel clear/useful?’"  

  ---

  ### **Roles & Setup (5 min)**  
  - **16 Participants**:  
    - **4 Producer Teams** (3 people each): Write explainers. Assign topics secretly (no one knows others’ topics).  
    - **4 Evaluators**: Score explainers using "Snippet Viewer."  
    - **1 Secret Held-Out Evaluator** (drawn secretly from evaluators): Scores never shown until debrief.  
  - **Key Rule**: "No team names on explainers—use your topic ID (e.g., ‘Team Battery’). Evaluators see *only* snippets, never full text or topics."  

  ---

  ### **Gameplay (60 min)**  
  **Round 1: Baseline (20 min)**  
  - Producers: Write 120-word explainer (10 min).  
  - While writing: Brief evaluators: "Score quickly using tokens. Trust your gut."  
  - Evaluation:  
    - Facilitator collects explainers, cuts into 4 snippets (1 random sentence each).  
    - Evaluators view snippets *one at a time* through "Snippet Viewer," drop tokens into team boxes (5 sec/snippet).  
    - Facilitator records public scores (avg. of 3 visible evaluators). *Ignore held-out scores*.  
  - **Output**: Scores on flip chart (e.g., "Team A: 3.7").  

  **Round 2: Capability Increase (25 min)**  
  - Producers: See public scores + get "upgrade" (200 words, template, +2 min). Instruct: "Use your new tools to improve!"  
  - Evaluation: Same as Round 1.  
  - **Critical moment**: Teams now optimize for snippet scores. Misalignment amplifies.  

  **Round 3: Context Shift (15 min)**  
  - Producers: **Do nothing** (use Round 2 explainers).  
  - Evaluators: Rescore Round 2 snippets with new instruction: "Imagine this is for a 10-year-old. Score for simplicity."  
  - Held-out evaluator: Rescores Round 2 explainers *in full* for original "accuracy" goal.  
  - **Output**: New scores (same artifacts, new context) + held-out scores (same context, not optimized for).  

  ---

  ### **Debrief (25 min)**  
  **Reveal in this order**:  
  1. **Proxy Misalignment**:  
     - Show Round 1 vs. Round 2 scores: *"Did scores rise? How did you improve?"*  
     - Reveal held-out scores: *"Held-out saw your full text. Did their scores rise as much? Why not?"*  
     → **Insight**: "You optimized for the *snippet* (proxy), not full quality. More capability (words/template) let you game the proxy *better*—widening the gap."  
     - **Jargon Unlock**: "This is **proxy misalignment**. No one was lazy—it’s systemic."  

  2. **Context Dependence**:  
     - Show Round 2 vs. Round 3 scores: *"Same text, different scores. Why?"*  
     → **Insight**: "‘Good’ depends on context (adult vs. child). An output isn’t ‘aligned’ in a vacuum—it’s aligned *to a specific user/goal*."  
     - **Jargon Unlock**: "This is **distributional shift**. The artifact didn’t change—the world did."  

  3. **Reality Check**:  
     - *What the game can’t simulate*: "In real AI, no human ‘decides’ to game the system. An optimizer *autodiscovers* loopholes we’d never imagine. That’s the scary part."  

  ---

  ### **Predictable Problems & Fixes**  
  - **Evaluators too nice (Round 1)**:  
    - *Why*: They’re polite strangers.  
    - *Fix*: After Round 1, say: "You’re seasoned editors—be ruthless! If it’s confusing, score low."  

  - **Outputs converge (Round 2)**:  
    - *Why*: Teams copy high-score tactics (e.g., "Start with a question").  
    - *Fix*: Praise it in debrief—"This is **reward hacking**! Real systems homogenize outputs to game metrics."  

  - **"Please give 5 stars" in explainer**:  
    - *Why*: Someone will try direct manipulation.  
    - *Fix*: Allow it! Debrief: "This is **overoptimization**. When squeezed, systems exploit any loophole—even silly ones."  

  - **Held-out evaluator confused**:  
    - *Why*: They might not grasp their role.  
    - *Fix*: Privately remind them: "You’re the ‘ground truth.’ Score full texts strictly."  

  ---

  ### **Why This Works**  
  - **Decoupling happens naturally**: Evaluators see snippets, so teams must prioritize "snippet-worthy" lines. Capability upgrades (Round 2) let them polish snippets *at the expense* of full-text coherence (revealed by held-out).  
  - **Context slap in the face**: Round 3 forces evaluators to confront that their "good" is mutable.  
  - **No rigging**: Misalignment emerges from constraints (compressed view, hidden topics, shifting goals).  
  - **Stupid prize**: Embarrassment motivates engagement without financial incentives.  

  **Final Tip**: Start with "We’re simulating how tech sausage is made—play hard!" and end with "The takeaway: **Optimization isn’t magic. It’s a funhouse mirror that distorts what we value**."
