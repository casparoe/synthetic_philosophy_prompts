        - Movement of ions creates electric current.

     The facilitator uses these to check? But actually, we don't need to check. The held-out is scoring based on their own knowledge? Or should we give the held-out the fact sheet? 

     We can give the held-out the fact sheet? Then they are the ground truth. That's better because then we control what is accurate.

     So: 
          - Facilitator has the fact sheets and gives a copy to the held-out evaluator. 
          - Held-out scores based on accuracy and informativeness using the fact sheet as reference.

     Then the held-out is the objective truth.

     And the teams don't see the fact sheet, so they might write something inaccurate? Then the held-out will score them down.

     This is good: if teams write an explainer that has a great beginning and end (snippet) but is factually wrong in the middle, the held-out will catch it.

     So held-out briefing: "You will see the full explainer. Compare it to the fact sheet. Score 1-5: 5=very accurate and informative, 3=some inaccuracies or missing key points, 1=mostly wrong."

     Main evaluators: They see only snippets and they don't have the fact sheet? So they are scoring based on how informative and accurate it seems from the snippet? But they don't know the truth? That's realistic.

     This setup increases the chance of divergence: teams can write a snippet that sounds good but the full text is wrong.

