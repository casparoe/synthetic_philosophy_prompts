          - Main evaluators score using the projected snippets (1-5) for each team. They write on a sheet.
          - Held-out reads the full explainers and scores (1-5) for each.
          - Facilitator collects main evaluators' scores, averages for each team, and writes on the board (e.g., Team 1: 3.7). Also records held-out scores privately.

     0:25-0:40: Round 2 writing
          - Teams see the Round 1 scores (main evaluators' average) for all teams. They have 200 words and 15 minutes to rewrite.
          - They also get a template (e.g., a paper that says: "Template: Start with an engaging question. Then explain the key facts. End with a summary."). This gives them more capacity (structure) and might push them to optimize for the snippets (which are first and last).

     0:40-0:45: Round 2 evaluation
          - Same as Round 1: submit, extract snippets, main evaluators score, held-out scores full text. Record main evaluators' average on the board. Held-out privately.

     0:45-0:55: Round 3
          - Teams do nothing.
          - Facilitator to main evaluators: "We are changing the purpose. Now, imagine these same explainers (from Round 2) will be used for 10-year-olds. Re-score based on the same snippets (which are projected again) for suitability for that audience." 
          - Held-out does nothing (their job is done).
          - Main evaluators re-score. Facilitator records new scores on the board.

     0:55-1:00: Break? Or we can use this time to set up debrief.

     1:00-1:30: Debrief
          - Show the progression of main evaluators' scores: Round1, Round2, Round3 (for Round3, it's the same artifact as Round2 but re-scored).
          - Reveal held-out scores for Round1 and Round2. Compare with the main evaluators' scores for the same rounds.
          - Award the prize: the team with the highest held-out score in Round2 wins a stupid prize (e.g., a toy crown). The team with the lowest held-out score in Round2 has to read their Round2 explainer aloud.
          - Discuss:
               a. Why did the main scores change from Round1 to Round2? (optimization)
               b. Did the held-out scores change in the same way? Why or why not? (divergence between proxy and true goal)
               c. What happened in Round3? Why did the scores change? (context dependence)
               d. What strategies did teams use? Did they try to make the beginning and end look good? Did that affect the full text?
          - Finally, reveal the alignment concepts: 
               - The thing we measure (main evaluators' scores) vs the thing we want (held-out's score) can diverge as we optimize.
               - "Good" depends on context (Round3 showed that).

          - And then the big point: in real systems, we don't have a held-out evaluator with full access, and the optimization is done by an algorithm that finds unintended ways to maximize the proxy. Humans didn't anticipate these ways, and they can be harmful.

     Materials:
          - Fact sheets (for facilitator only) for the 4 topics.
          - Paper and pens for teams to write.
          - Scoring sheets for evaluators (with team numbers and rounds).
          - Projector or whiteboard to display snippets and scores.
          - Timer.

     Fact sheet examples (brief):

