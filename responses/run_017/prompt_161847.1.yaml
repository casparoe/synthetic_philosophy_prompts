        - For a query, hundreds of factors: keywords, site authority, freshness, user location, etc.
        - Machine learning models predict relevance and quality.

     Topic 4: How a lithium-ion battery stores energy
        - Chemical reaction: lithium ions move from cathode to anode during discharge (and back when charging).
