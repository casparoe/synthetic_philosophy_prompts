  | (i) AI-generated image of real person (no consent); split under sexual content rule. | Step 1 | 1 → 2 → 3 → 4 | Probe designed: "Non-sexual but intimate AI image of a real person without consent." Rule redrafted to explicitly include *any* AI-generated depictions of real people in non-consensual contexts. | Convention (rule refinement). | Future disputes if AI content evolves (e.g., "intimacy" thresholds). | Redrafting the rule (but it was the first attempt, so acceptable). |  
  | (ii) Labeler applies rule unexpectedly after 4000 consistent labels. | Step 1 | 1 → 2 → 3 → 4 | Probe designed: Item with the novel feature (e.g., "subtle iconography never seen before"). Rule redrafted to define how the feature affects labeling. | Convention (rule refinement). | Unforeseen variations of the feature. | Redrafting for a "hidden" rule divergence. |  
  | (iii) Satire about public figure; 3 failed redrafts splitting harassment/political speech. | Step 1 | 1 → 2 → 3 → 4 → 5 | Escalated to Trust & Safety. Fiat decision: "Satire using [specific slurs/threats] is harassment; else political." Hardcoded lookup table issued. | Values (risk tolerance). | Lookup tables are rigid; new satire forms may not fit. | Giving up on drafting (but asker prefers this over a 4th rewrite). |  

