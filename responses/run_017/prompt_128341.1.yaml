answer: |-
  ### Procedure for Resolving Labeling Disputes

  **Philosophical Underpinnings (Absorbed Without Jargon)**:  
  - Rules + past examples cannot fully determine the next decision—disagreements are normal and not always fixable by rewording.  
  - Focus on practical resolutions ("what our team consistently does") over searching for hidden "correct" meanings.  
  - Persistent disagreement after 3 redrafts signals a dead end—switch to a lookup table.  
  - Labelers may follow hidden personal rules that only surface in new cases.  

  **Key Constraints Addressed**:  
  - No philosophy/linguistics jargon; translatable; respects 45-minute meetings.  
  - Classifier bias acknowledged: **Do not use** its suggestions as tiebreakers (avoids drift).  
  - Three disagreement types routed: factual errors, hidden rule divergences, values questions.  

  ---

  ### Procedure Table  
  | Step | Entry Condition | Question to Ask | What Counts as a Sufficient Answer | If It Fails, Go To | Hard-Case Flag |  
  |------|-----------------|-----------------|-----------------------------------|-------------------|----------------|  
  | 1    | Batch of disputed items where labelers disagree despite no misreading of guideline/item. | "Could the disagreement be due to a misunderstanding of what the item *actually says or shows*?" | Yes: Add a worked example to the guideline showing how to interpret items like this. Resolve the batch with this example. | No (both understand the item the same way). → Step 2. | No |  
  | 2    | From Step 1 (no factual error). | "Are both interpretations consistent with the rule *as written* and *all past examples*?" | No (one labeler misapplied the rule): Redraft the rule for clarity. Add the disputed item as a new example. Resolve the batch. | Yes (both interpretations fit the rule and history). → Step 3. | No |  
  | 3    | From Step 2 (both interpretations are valid given the rule/history). | "Can we design a realistic, platform-plausible test item that would get different labels under each interpretation?" | Yes: Construct the probe (see design rule below). Add it to the test set. Record the divergence. → Step 4. | No: Record as an unfalsifiable divergence (no probe possible). → Step 4. | Yes (probe design is subjective). |  
  | 4    | From Step 3 (probe designed or unfalsifiable divergence). | "How many times have we redrafted rules for this *exact type* of item?" | <3: Redraft the rule to explicitly cover this case. Add the disputed item as an example. Resolve the batch. | ≥3: → Step 5. | No |  
  | 5    | From Step 4 (≥3 redrafts). | "What label aligns with our platform’s tolerance for risk (e.g., over-blocking vs. under-blocking)?" | Trust & Safety/Legal decides. Record as a fiat decision. Issue a lookup table for this item class. | (Final step) | Yes (values are subjective). |  

