  ### Plainly Stated: What the Procedure Cannot Do  
  1. **Resolve values debates** (e.g., "How much over-blocking is tolerable?"). These always require human judgment.  
  2. **Prevent all future disagreements**. New items will always stretch rules.  
  3. **Spot hidden rule divergences preemptively**. They only surface when a disputed item appears.  
  4. **Replace context**. Probes and lookups rely on platform-specific realism (e.g., "plausible" content).  
  5. **Fix classifier drift**. Labelers seeing its suggestions is a systemic bias beyond this scope.
