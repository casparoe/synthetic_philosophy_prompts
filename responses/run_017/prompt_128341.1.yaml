  Key ideas to absorb:
  1. A rule plus past applications does not fix the next application (underdetermination).
  2. Instead of seeking a hidden fact, we appeal to what the labeler community does (assertibility conditions).
  3. Persistent disagreement after redrafting may mean there's no fact of the matter.
  4. A labeler might be following a divergent rule that so far has agreed with all past items.

  The procedure must:
  - Have an entry condition (when to start the procedure).
  - Ordered steps with questions and what counts as sufficient answers.
  - Distinguish three types of disagreement and route accordingly:
     a. Disagreement about the world or text: add a worked example.
     b. Disagreement traceable to a divergent rule: design a probe item to separate the rules. If no such probe is possible, record as unfalsifiable divergence and stop.
     c. Disagreement that is a values question: escalate to a person (because it's about how much over-blocking we tolerate, etc.).
  - Include a rule for designing probe items.
  - Stop rule: after a certain number of failed refinement rounds, switch to a hardcoded lookup table (by fiat).
  - Verdict on using classifier suggestions as tiebreaker? (Probably not, because labelers drift toward it, which might mask real disagreements.)
  - Specify who signs off on what and how fiat decisions are recorded and revisited.

