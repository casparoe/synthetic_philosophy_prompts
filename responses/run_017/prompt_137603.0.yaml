prompt: |-
  In three weeks I am presenting a paper at a small metaphysics workshop, and what I want from you is a Q&A prep sheet rather than a defense of the view. Below is my thesis, an abbreviated version of the argument, and a description of the room. What I need is the question period.

  **Thesis.** The familiar metaontological disputes — whether the quantifier is fully unrestricted, whether mereological sums exist, whether there are composite objects at all, whether there are propositions — are not factual disputes. But they are also not *merely verbal*, in the sense that verdict is normally meant to carry. They are cases of what I call load-bearing notational variance: the competing languages are intertranslatable, but they differ in which consequences they make easy for a competent but non-ideal inquirer to notice, check, and be tempted to draw. Metaontology should therefore become notational pluralism *with a ranking*: existence questions have no answer beyond the choice of notation, but the choice is not arbitrary, because notations can be ordered by their inferential affordances relative to a specified research program, and that ordering is a question about proof length, search complexity, and error rates rather than a question about taste.

  **Argument sketch.** (1) Call two candidate notations strongly intertranslatable when there is a recursive translation mapping each sentence of the one onto a sentence of the other that preserves truth value across the relevant class of models. Strong intertranslatability entails that there is no factual disagreement left between the parties. (2) Some strongly intertranslatable pairs are inert: the choice between them makes no difference to anything anyone goes on to do — the analog, in a formal setting, of a proof assistant's syntactic sugar that is mechanically expanded before processing. (3) Other pairs are load-bearing: the notations differ in inferential affordance. One makes a certain class of consequence visible in a two-line derivation; the other buries it behind a page of paraphrase. (4) The metaontological cases are of the second kind, which is why the disputes feel substantive and why they refuse to dissolve when the parties agree on meaning. (5) Hence the ranking in the thesis: the residual disagreement is about which research program to serve plus a partly formal, partly empirical question about affordance, and that question has an answer.

  **The room.** Twelve people. Three ontological realists of the joint-carving stripe, who think there is a privileged structure and that the job of metaphysics is to find it. Two quantifier-variantist deflationists in the Carnapian tradition, happy to say the disputes are verbal and tolerant about which language you like. One person who works on verbal disputes and conceptual ethics and will care about my criteria more than my conclusions. Two easy-ontology people, who think existence questions are settled trivially once the relevant terms are in place and that the interesting questions lie elsewhere. The remaining four are general metaphysicians who regard ontology as a substantive inquiry and are antecedently hostile to any deflationary diagnosis. Nobody in the room works on proof complexity, formal epistemology, or anything that would let them assess the empirical claim in step (5).

  **What I want.** The seven or eight objections I will actually get, ordered by how likely they are multiplied by how much damage they do, each phrased the way the relevant subgroup would phrase it and not the way I would paraphrase it afterward. For each: a reply I can deliver in about ninety seconds, and a candid note on where that reply is soft. Separately: what I should concede in the first two minutes before anyone asks, the single reply that has to land if the paper is to survive at all, and the question I am hoping nobody asks.

  Two standing constraints on your answer. First, assume I have already read the standard moves on all sides; don't give me the survey. Second, and most important: keep separate what is genuinely settled among people who work on these topics from what is contested, and never present a contested diagnosis as the received view. In particular, flag explicitly which steps of my argument rest on premises that a substantial number of specialists reject, which of my distinctions are doing work that no one has shown they can do, and where my step (5) is closer to a promissory note than to a result.
reasoning: |-
  Okay, let me approach this systematically. The user is a metaphysician preparing for workshop Q&A who wants targeted objection-handling, not theory defense. 

  First, unpacking the core thesis: they're proposing a middle path between realism and deflationism - metaontological disputes as "load-bearing notational variance" with practical rather than factual stakes. The critical move is step (5)'s claim about affordance ranking being objectively measurable.

  Now considering the room composition: it's a minefield. Realists will attack the factual-deflation; Carnapians may resist the "not merely verbal" claim; easy ontologists might question the need for rankings. The proof complexity aspect is especially vulnerable since no one specializes in it.

  For objection mapping, I need to simulate:
  - Realist objections focusing on explanatory loss (Objection 1)
  - Carnapian pushback on the verbal dispute distinction (Objection 2)
  - Easy ontology challenges to the ranking necessity (Objection 4)
  - Formal worries about intertranslatability criteria (Objection 5)

  Prioritizing by threat level: Objection 3 (explanatory depth) and Objection 6 (privileging physics) could derail the talk if unanswered. The existential threat is clearly Objection 3 - if they can't handle the "why be pluralist" challenge, the whole framework wobbles.

  The concession strategy is smart: preemptively clarify that this is about descriptive metaontology, not first-order practice. That might disarm some critics early. The nightmare question would be about empirically validating affordance metrics - hence suggesting a pivot to philosophical arguments for now.

  Throughout, I'm flagging soft spots per request: step (5) is indeed promissory, the intertranslatability criterion is contested, and the realism/pluralism boundary remains fuzzy. Will structure replies to acknowledge these while holding ground.
answer: |-
  Here are the seven most probable and damaging objections you'll face, ordered by threat level (likelihood × damage potential), with verbatim phrasing, concise replies, and vulnerability notes. I've flagged contested premises and soft spots throughout.

  ---

  ### **Preemptive Concession (First 2 Minutes)**
  > *"Before questions, I want to clarify: this framework *describes* how ontological disputes functionally operate, not how metaphysicians *should* practice first-order ontology. My claim is that when disputes persist despite shared models and intertranslatability, the residual disagreement is about inferential efficiency—not facts. I’m *not* saying ontological inquiry is trivial, only that its 'hard' questions are pragmatic."*  
  **Why?** Disarms realists’ "anti-metaphysics" alarm and easy ontologists’ "strawman" reflexes.

  ---

  ### **Objection 1 (Hostile Realists: Highest Threat)**  
  *"You reduce ontology to cognitive ergonomics, but explanation requires tracking mind-independent structure. If your 'intertranslatable' languages disagree about whether chairs exist, only one captures the causal structure of reality—the other misrepresents it. Your 'ranking' ignores truth-conduciveness."*  
  **Reply:** "The languages don’t disagree about causal structure! Intertranslatability ensures both models capture identical causal relations—e.g., 'chair-wise simples arranged thusly' (no chairs) vs. 'chairs' (with simples) both predict the same collisions. The 'structure' realists care about is preserved; we’re only choosing labels for it. Ranking prioritizes *epistemic access* to that structure—not the structure itself."  
  **Soft spot:** Assumes intertranslatability preserves *all* explanatory properties. Realists (e.g., Sider) argue joint-carving structure is *ineffable* and lost in translation. Your reply works only if structure is fully propositional.  

  ---

  ### **Objection 2 (Carnapians: High Threat)**  
  *"This is just verbal disputes with extra steps. If languages are intertranslatable, the choice *is* arbitrary—like preferring '13' over 'thirteen'. Calling it 'load-bearing' confuses pragmatics with semantics. Why isn’t this just conceptual ethics?"*  
  **Reply:** "Verbal disputes dissolve when meanings are clarified. Here, meanings *are* clarified (via translation manuals), yet disputes persist because inferential affordances affect *discovery* and *justification*. Unlike '13' vs. 'thirteen', choosing 'mereological sums exist' vs. 'only simples exist' changes which inferences feel obvious—e.g., one-step composition vs. painstaking mereotopology. That’s not semantics; it’s cognitive technology."  
  **Soft spot:** Carnapians (e.g., Hirsch) may retort that "feeling obvious" is still about *us*, not reality. You need to insist this has objective metrics (step 5)—but that’s your weakest premise.  

  ---

  ### **Objection 3 (Realists/Easy Ontologists: Existential Threat)**  
  *"If existence questions have no answers, why be a pluralist? Why not pick one notation and ignore others? Your 'ranking' implies we should switch notations opportunistically—but that corrupts ontology into instrumentalism!"*  
  **Reply:** "Ontology *is* instrumental to epistemic goals! We *already* switch notations: physicists use particles *or* fields depending on the problem. Metaontology should explain why, say, 'propositions exist' helps in logic but hinders in cognitive science. Ranking formalizes this—it doesn’t 'corrupt' ontology; it reveals its function."  
  **Must-land point:** If this fails, your thesis seems self-defeating.  
  **Soft spot:** Realists will see this as surrendering metaphysics to pragmatism.  

  ---

  ### **Objection 4 (Easy Ontology: Medium Threat)**  
  *"Easy ontology already shows existence questions *are* trivial. Your 'ranking' overcomplicates things—why not just say 'all consistent ontologies are true in their language' and move on?"*  
  **Reply:** "Because trivial truth doesn’t entail trivial *utility*. Easy ontology dissolves disputes but can’t explain why we fight about them. My account shows why, e.g., a biologist resists 'there are chairs' (it obscures cellular processes) while a designer embraces it. Ranking resolves conflicts about *which trivial truth to use*."  
  **Soft spot:** They may counter that your view collapses into theirs with extra jargon.  

  ---

  ### **Objection 5 (Conceptual Ethics: Medium Threat)**  
  *"Your 'strong intertranslatability' criterion is too strong. Most ontologies aren’t recursively intertranslatable (e.g., nihilism vs. universalism). And if they were, why think affordances differ? Proof complexity depends on the axiom system, not the ontology."*  
  **Reply:** "Nihilism and universalism *are* intertranslatable: 'there exists a sum' ↔ 'there are simples arranged mereologically'. Differences in proof length arise because nihilism requires auxiliary relations (e.g., 'arranged chair-wise') for everyday claims, while universalism bakes composition into the quantifier. That’s *exactly* affordance variance."  
  **Soft spot:** Intertranslatability for richer ontologies (e.g., with modal operators) is **contested and unsupported** in your argument. This is a live debate.  

  ---

  ### **Objection 6 (Realists: Low Threat)**  
  *"Your 'ranking' privileges physics-friendly ontologies. But why should metaphysics serve empirical programs? Its goal is abstract insight—e.g., understanding fundamentality."*  
  **Reply:** "Nothing in my account forbids ranking for *metaphysical* programs! If 'fundamentality' is the goal, we might rank notations by how easily they derive asymmetric grounding relations. The point is: we must *specify the program* to evaluate affordances. Physics is just one example."  
  **Soft spot:** Realists will argue fundamentality is language-independent.  

  ---

  ### **Objection 7 (General Metaphysicians: Low Threat)**  
  *"This feels like a defeatist retreat. If ontology isn’t factual, why fund it? You’ve gutted metaphysics while pretending to save it."*  
  **Reply:** "I’m not gutting it—I’m relocating its substance. The 'hard work' shifts to: (a) designing ontologies with better affordances for X, and (b) testing their performance. That’s *more* rigorous, not less. Funding should follow notations that accelerate progress on well-defined problems."  
  **Soft spot:** May not satisfy those who see metaphysics as autonomous from science.  

  ---

  ### **The Nightmare Question (Pray Nobody Asks)**  
  *"You claim notations can be ranked by 'error rates' and 'search complexity'. But where’s the evidence that, say, belief in propositions reduces errors in psychology? Or that mereological nihilism shortens proofs in physics? This is speculative psychologizing—not metaontology."*  
  **Why it’s deadly:** Your step (5) **is a promissory note**, not a result. No one in the room can evaluate it, and you lack empirical data.  
  **Damage control:** "You’re right—this needs collaborative work with cognitive scientists and logicians. But we already see hints: type theory reduces programming errors; point-free notation simplifies topology proofs. The *philosophical* point is that *if* such rankings exist, they resolve ontological stalemates. I’m offering a framework, not a completed theory."  

  ---

  ### **Key Vulnerabilities in Your Argument**  
  1. **Step (5) is promissory:** No metrics for "affordance" exist; no case studies show ontological choices affecting real-world outcomes.  
  2. **Intertranslatability is contested:** Specialists (e.g., Turner, Warren) debate whether rival ontologies can meet your strong criterion.  
  3. **Distinctions under pressure:** "Load-bearing" vs. "inert" variance lacks formal criteria—risk of being ad hoc.  
  4. **Empirical claims:** Your thesis leans on cognitive science (error rates) and CS (proof complexity), but these are foreign to your audience.  

  **Survival strategy:** Frame everything as a *challenge to metaontology* ("Explain why these disputes persist!") rather than a definitive solution. Emphasize that you’re exposing a gap—not filling it. Good luck!
