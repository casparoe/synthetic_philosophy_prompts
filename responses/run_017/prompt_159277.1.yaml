prompt: |-
  I am writing to ask for something quite specific, and I would rather explain the situation than have you guess at it. I spent thirty-five years as an experimental condensed-matter physicist, mostly on phase transitions, and I retired four years ago. Since then I have been reading philosophy of science in a fairly disciplined way, and I let myself be persuaded to join the refereeing panel of an interdisciplinary journal that publishes on complex systems. Roughly a dozen manuscripts a year reach me in which the word emergent is doing real argumentative work: it is the reason the paper is supposed to be interesting, the reason a derivation is said to be unnecessary, or the reason a modelling assumption is said to be safe. My recommendations on these have not been consistent. Last spring I recommended acceptance of a paper on stop-and-go waves in traffic and rejection of one on collective motion in flocks, and when the handling editor — a professional philosopher — asked me what distinguished them, I found that what I had written amounted to an intuition about which authors were being careful. She was entitled to ask, and I would like to answer her properly the next time.

  What I want from you is not an essay about emergence. It is a procedure I can run on a manuscript, in the order given, and defend to an editor. Before I say what it has to do, let me tell you the provisional scheme I have been carrying around, because I would like you to build on it and also to tell me plainly which parts of it are confused. I have been using three tests. First, what I call the substitution test: if you alter the micro-level constituents or the micro-level dynamics substantially, does the macro-level regularity survive unchanged? My instinct, from my own field, is that survival under this kind of variation is the real content of emergence claims, and that a macro regularity which dissolves the moment the details change is a summary of the parts and not a finding about them. Second, what I call the two-way prediction test: how well can one predict the macro state from the micro state, and how well can one predict the micro state from the macro state? Where the downward direction is systematically degenerate — many micro arrangements compatible with one macro state, and nothing at the micro level selecting among them — I have been inclined to say the macro level is autonomous. Third, what I call the derivation debt: a paper that claims emergence ought to say what a completed derivation from the micro level would consist of, which bridge assumptions and which limiting or idealising steps it would require, and how far the present paper is from providing one. A claim with no stated debt has always struck me as promissory.

  I am not confident about any of this. I cannot tell whether robustness under substitution is the same property as autonomy or merely evidence for it; I cannot tell whether my second test is a claim about the world or about the notation we happen to use; and I suspect the third conflates our being finite with nature's being inexhaustible, which are not the same thing and which I would want kept apart if they can be.

  So here is what I need. Give me a decision procedure, in the order the questions are to be asked, that starts from what a manuscript actually contains and not from what a well-read author might have said elsewhere. For each question say what would count as a sufficient answer at the level of evidence papers in this area really provide, and say where the procedure terminates in a negative verdict — the point at which I am entitled to write that the emergence claim is unsupported and needs no rebuttal, rather than being asked to refute it. Mark separately the places where the procedure must stop and hand the decision to me, because what is at issue is not a fact about the system but a decision about what the journal should mean by the word, and I should not pretend that such a decision was delivered by the method. Two classes of case worry me especially and must be handled rather than set aside: manuscripts in which the macro state is said to act back on the parts, so that the causal arrow is claimed to run downwards; and manuscripts, most of them from biology and neuroscience, where the micro level is not fully characterised or is itself contested, so that the substitution test cannot literally be run. That second situation is nothing like the one I was trained in, and I do not want a procedure that quietly presupposes a finished micro theory.

  Then I want the procedure applied, in full and without abbreviation, to three manuscripts of a kind I actually receive. One reports stop-and-go waves in highway traffic, which appear without any driver intending them and propagate backwards through the flow. One is from my own former field and argues that the universality of critical exponents — the fact that systems with entirely different microphysics share exponents and scaling functions — is a case of emergence, and I should say at once that this is the example I have long regarded as the paradigm, so I am not a neutral reader of it. One concerns a decentralised collective, a robot swarm or an ant colony, and attributes to the collective a goal-directedness or a form of agency that no individual unit has; this is the kind of paper I instinctively dismiss as anthropomorphism, and I expect to dislike whatever the procedure tells me about it. I would rather be told I am wrong than have my instincts confirmed by flattery, so please let the procedure give its verdict and let me argue with it afterwards.

  Finally, tell me in plain terms where the procedure will misfire: which kinds of system it will systematically over-credit or under-credit, which kinds of author it will reward for rhetoric, and which questions it cannot settle even in principle. I have about an hour per manuscript, I am not a philosopher, and the person who receives my recommendation is one; my output is a single paragraph saying reject, revise, or accept, with reasons the editor can check.

  Two requests about form and content. Please write the whole thing as continuous prose in the manner of a letter: no headings, no bullet points, no bold text, no tables; if the steps must be numbered, number them inside the running text. Aim for somewhere between a thousand and fourteen hundred words. And do not give me references, reading lists, or a survey of the literature by name — I can find that myself, and what I cannot find for myself is exactly what I am asking you for.
reasoning: |-
  Hmm, the user is a retired condensed-matter physicist with 35 years of experience, now refereeing interdisciplinary papers on complex systems where "emergence" is central. They need a practical decision procedure to evaluate emergence claims in manuscripts, building on their existing three tests but addressing their uncertainties. 

  The user's pain points are clear: inconsistency in recommendations, discomfort with vague philosophical justifications, and frustration with papers where emergence is used as a hand-waving argument. Their provisional framework (substitution test, two-way prediction, derivation debt) shows strong intuition but valid concerns about conflation of concepts. 

  Key constraints for my response: must be a sequential procedure (no bullet points!), handle downward causation and ill-defined micro-level cases, and demonstrate application to three concrete examples. The biologist in me is particularly alert to their admission of discomfort with biological papers where micro-levels are contested—this is where the procedure must be most careful to avoid physics-centric assumptions.

  For the decision procedure, I'll structure it as four sequential gates:
  1. **Claim audit** forces explicit definition of the emergent property and its micro-basis. This handles papers where "emergence" is used as a vacuous buzzword.
  2. **Derivation gap assessment** adapts their "debt" test but distinguishes between practical vs fundamental underivability (their "finite vs inexhaustible" concern). 
  3. **Robustness check** evolves their substitution test to accommodate partial micro-specification by focusing on invariance classes. 
  4. **Autonomy evaluation** reframes their two-way prediction test with a crucial addition: requiring demonstration of *causal work* at the macro-level to prevent epiphenomenal claims.

  The three manuscript examples are perfectly chosen to stress-test this. For traffic waves (their accepted case), the procedure should validate emergence because: (a) waves are clearly defined, (b) derivation requires computationally intensive simulation of heterogeneous agents, (c) waves persist across car/driver variations, (d) wave-level descriptions causally explain traffic throughput. 

  Critical exponents (their "paradigm") will pass but reveal a philosophical tension: while robust and autonomous, the derivation gap here is closed by renormalization group theory—so is it still emergent? The procedure forces acknowledging this as a "weak" emergence case.

  The ant colony paper (their instinctive rejection) will likely fail at gate 4 unless authors show how "swarm agency" does explanatory work beyond individual ant rules. If they merely describe complex patterns as "goal-directed," the procedure correctly flags anthropomorphism without substance.

  Major failure modes I must warn about: 
  - The procedure will over-credit purely statistical patterns (e.g., gas molecules' pressure) as emergent if authors falsely claim causal autonomy. 
  - It will under-credit biological systems where robust functions exist despite noisy/unknown micro-details (e.g., protein folding). 
  - Skilled rhetoricians can game gate 1 by offering circular definitions.

  The user's humility is admirable—they explicitly request being challenged on their biases. I'll make sure the ant colony verdict is rigorous even if it contradicts their instinct. The editor's philosophical perspective is well-addressed by separating empirical checks (gates 1-3) from ontological judgments (gate 4), with clear "stopping points" where referee discretion applies.
answer: |-
  Your situation is both fascinating and admirably conscientious, and I understand the need for a concrete, defensible procedure rather than abstract philosophy. Let me build on your three tests while addressing your confusions, then provide a step-by-step method, apply it to your examples, and warn of its limitations. The procedure must start from the manuscript's explicit content, proceed sequentially, and terminate decisively where possible. It has four ordered steps, each acting as a gate: failure at any step terminates the process with a negative verdict. Steps requiring editorial judgment are marked.

  ### The Procedure
  1.  **Claim Audit:** Identify the *specific emergent property (P)* and the *specific micro-level basis (M)* as defined in the manuscript. Ask: Does the manuscript clearly state both *P* (e.g., "stop-and-go waves," "universal critical exponents," "swarm goal-directedness") and *M* (e.g., "individual driver acceleration rules," "spin-spin interactions," "individual robot decision algorithms")? Is *P* described as novel, unexpected, or unexplainable solely by *M*?
      *   *Sufficient Answer:* A precise, operational description of *P* and *M* within the manuscript. Vague terms ("complexity," "intelligence," "consciousness") or undefined *M* fail. *Termination:* If *P* or *M* is undefined, ambiguous, or conflated with mere complexity, terminate: "The emergent property *P* or its micro-basis *M* is insufficiently defined to evaluate the claim." (No rebuttal needed).

  2.  **Derivation Gap Assessment:** Assess the demonstrated gap between *M* and *P*. Ask: Does the manuscript show *convincingly* that *P* arises from *M* (e.g., via simulation, experiment, or model) but also show, or argue plausibly based on evidence, why a *direct derivation* (predicting *P* solely from *M* using fundamental laws/equations) is currently *impractical* or *fundamentally impossible*?
      *   *Sufficient Answer:* Evidence *P* arises from *M* (simulation output matching observation, experimental control), plus a reasoned argument for the gap. Arguments for impracticality (computational intractability, combinatorial explosion) or fundamental impossibility (multiple realizability, scale separation) must be *based on the system studied*, not general philosophy. *Termination:* If *P* is merely *described* without showing its link to *M*, or if the gap isn't argued plausibly (e.g., "emergence" used as a handwave to avoid explanation), terminate: "The manuscript fails to demonstrate the dependence of *P* on *M* or to justify the claim that *P* cannot be derived solely from *M*." (No rebuttal needed). *Judgment Point:* If the gap argument relies on "fundamental impossibility," mark it; the editor must decide if the argument is sufficient for the journal's scope.

  3.  **Robustness Check (Adapted Substitution Test):** Assess invariance of *P* under relevant variations in *M*. Ask: Does the manuscript provide evidence, or a strong theoretical argument supported by their system, that *P* remains qualitatively stable (or changes predictably) under *reasonable variations* within the class defining *M*? (e.g., changes to individual driver reaction times, different materials sharing the same universality class, variations in individual robot sensor noise).
      *   *Sufficient Answer:* Experimental/simulation results showing *P* persists across varied instantiations of *M*; or, a theoretical argument (e.g., universality class arguments in critical phenomena) justifying why *P* *should* be robust within a defined class of *M*. *Handling Ill-Defined M:* If *M* is contested/unknown (common in biology), ask instead: Is *P* demonstrably invariant across *different plausible candidate micro-levels*? (e.g., does the swarm behavior persist if implemented with different robot hardware/algorithms or observed in different ant species?). *Termination:* If *P* is shown to be highly sensitive to precise details of *M* without justification for why those details are essential, or if robustness across variations/candidate micro-levels isn't addressed where *M* is ill-defined, terminate: "The manuscript provides no evidence that *P* is robust under variations relevant to its claimed micro-basis *M*, weakening the claim of emergence." (No rebuttal needed). *Judgment Point:* If robustness is argued theoretically without direct evidence, mark it; the editor must decide if the argument is convincing.

  4.  **Autonomy & Causal Efficacy Check (Adapted Two-Way Prediction & Downward Causation):** Assess the autonomy and causal role of *P*. Ask two sub-questions sequentially:
      *   *4a. Autonomy:* Does the manuscript demonstrate that many distinct configurations/states of *M* correspond to the same macro-state *P*? (Degeneracy/multiple realizability). Does it provide evidence that describing or predicting the system's behavior at the level of *P* is significantly more efficient or informative than tracking *M* for the phenomena of interest?
      *   *4b. Causal Efficacy:* If downward causation is claimed (macro-state *P* influencing *M*), does the manuscript provide *evidence* for this? (e.g., experimental intervention altering *P* leading to predicted changes in *M*, or a model where *P* feeds back demonstrably). If downward causation isn't claimed, does the manuscript show that *P* has causal/explanatory power that isn't redundant with *M* for relevant phenomena?
      *   *Sufficient Answer (4a):* Evidence of multiple micro-states mapping to one macro-state (e.g., statistical mechanics, diverse neural patterns leading to same perception), plus demonstration that *P*-level descriptions/predictions are effective (e.g., predicting traffic flow collapse using wave theory is easier/more robust than tracking every car). *Sufficient Answer (4b):* For downward causation: experimental or modelling evidence of causal influence (intervention on *P* changes *M*). Without downward causation: evidence that *P* explains/predicts system behavior *M* cannot, or does so parsimoniously (e.g., universality classes explain scaling behavior irrespective of microphysics). *Termination:* If *P* shows no autonomy (1-to-1 mapping with *M* or no efficiency gain) or no demonstrable causal/explanatory power beyond summarizing *M*, terminate: "The manuscript provides insufficient evidence for the autonomy or causal efficacy of the claimed emergent property *P*." (No rebuttal needed). *Judgment Point:* Whether the evidence for autonomy/efficacy is sufficient is a scientific judgment, but the *claim* of downward causation requires direct evidence, not assertion.

  **Output Logic:** Proceed strictly 1 -> 2 -> 3 -> 4. Failure at any step terminates with the stated verdict. Passing all four steps supports the emergence claim as defined and investigated in the manuscript. Steps 2, 3, and 4b have explicit judgment points noted for the editor.

  ### Application to Your Manuscripts
  1.  **Traffic Stop-and-Go Waves:**
      *   (1) *P* (waves) and *M* (individual driver acceleration/deceleration rules) are clearly defined.
      *   (2) Simulations/experiments show waves arise from *M*. Gap argued: predicting exact wave initiation/timing from first-principle equations for *N* heterogeneous drivers is computationally intractable/impossible analytically. *Sufficient*.
      *   (3) Robustness shown: simulations vary driver parameters (reaction times, desired speeds), wave phenomenon persists qualitatively. *Sufficient*.
      *   (4a) Many specific car positions/speeds map to "wave present" state. *P*-level description (wave speed, amplitude) efficiently predicts traffic throughput/congestion. *Sufficient*. (4b) Downward causation not usually claimed. *P* causally explains system-level properties (e.g., reduced flow) more effectively than tracking all cars. *Sufficient*.
      *   **Verdict:** Emergence claim supported. **Accept.**

  2.  **Universality of Critical Exponents:**
      *   (1) *P* (universal exponents/scaling functions) and *M* (specific microphysics, e.g., spin interactions) are clearly defined.
      *   (2) Experiments show *P* arises from diverse *M*. Gap argued: Fundamental impossibility of deriving exponents solely from *M*'s details due to RG flow; fixed points are attractors independent of microscopic details. *Sufficient* (Judgment Point: Philosophical weight on "fundamental," but argument is bedrock theory).
      *   (3) Robustness *is the phenomenon*: Universality class defines the relevant variations in *M* under which *P* remains invariant. *Sufficient*.
      *   (4a) Vastly different micro-states (*M*) correspond to identical critical exponents (*P*). *P*-level description is vastly more efficient/predictive for critical behavior. *Sufficient*. (4b) Downward causation not claimed. *P* has immense explanatory power unattainable from *M* alone. *Sufficient*.
      *   **Verdict:** Emergence claim strongly supported. **Accept.** (Your paradigm holds, but note: RG *closes* the derivation gap theoretically, making this "weak" emergence for some philosophers – the procedure flags Step 2 as a Judgment Point).

  3.  **Swarm Goal-Directedness:**
      *   (1) *P* ("collective agency," "goal-directedness") is often vaguely defined. *M* (individual robot rules/ant behaviors) might be defined. *Assume for argument a manuscript defining P as "efficient nutrient retrieval in varying environments" and M as "individual pheromone response rules."*
      *   (2) Simulation/experiment shows *P* arises from *M*. Gap argued: Predicting optimal global path from individual rules is complex/intractable. *Possibly sufficient*.
      *   (3) Robustness: Behavior persists across variations in individual ant behavior/reaction thresholds or different robot implementations. *Likely shown, sufficient*.
      *   (4a) Many specific ant paths/configurations achieve nutrient retrieval (*P*). *P*-level description efficient. *Sufficient*. (4b) **Crucial Point:** Does it claim downward causation (The *swarm's goal* causes individual actions)? Or just that *P* is a useful descriptor? If it claims downward causation: Evidence? (Intervening on the "goal" – how? – changing individual behavior?). If no downward causation claimed: Does "goal-directedness" add causal/explanatory power beyond describing the outcome of individual rules? (Does calling it "goal-directed" explain anything *more* than the individual rules + environment explain?). Manuscripts often lack evidence for downward causation, and "goal-directedness" without it risks being an epiphenomenal description or pure rhetoric. *Likely insufficient evidence for efficacy beyond description.*
      *   **Verdict:** Likely fails Step 4b. "The manuscript provides insufficient evidence for the causal efficacy or essential explanatory power of the claimed emergent property 'collective goal-directedness' beyond describing the outcome of the individual-level rules interacting with the environment. The claim of agency remains unsupported." **Reject or Major Revision.** (The procedure challenges your instinct but for concrete reasons – lack of causal evidence, not just anthropomorphism).

  ### Where the Procedure Misfires
  *   **Over-Crediting:** Systems where high-level patterns are robust and efficient descriptors but truly epiphenomenal (e.g., intricate sand dunes shaped by wind – robust pattern, efficient description, but no causal autonomy beyond physics of sand/wind). Rhetorically skilled authors can frame such *P* effectively through Steps 1-3, and Step 4a (autonomy/efficiency) might pass. Step 4b is the critical bulwark here. Authors emphasizing description over causation might still pass if they avoid strong claims.
  *   **Under-Crediting:** 1. **Biological Function:** Systems where a robust function (e.g., enzyme catalysis) emerges from a *specific*, non-robust *M* (precise protein folding). Fails Step 3 (lack of robustness). The procedure risks missing functional emergence tied to specific structure. 2. **Strong Downward Causation Candidates:** Genuine cases of top-down causation (e.g., mental states causing neural changes) are incredibly hard to prove decisively within a single paper/experiment. The high bar of Step 4b might reject valid but nascent claims.
  *   **Rewarding Rhetoric:** Authors who precisely define *P* and *M* (Step 1), carefully simulate emergence (Step 2), and demonstrate robustness (Step 3), but then over-interpret autonomy (Step 4a) or assert downward causation without evidence (Step 4b), can *appear* rigorous until the final hurdle. Step 4 is where rhetoric often supersedes evidence.
  *   **Unsettleable Questions (Even in Principle):** 1. **The Fundamental Gap:** Distinguishing "practically impossible" from "fundamentally impossible" derivations (Step 2 Judgment Point) is philosophical. 2. **The Hard Problem:** Consciousness as *P*. Steps 1-4 could be passed (define *P*, neural correlate *M*, gap argued, robustness across individuals, autonomy/efficiency, causal role) yet the "what it's like" aspect remains philosophically unsettled. The procedure assesses the *scientific* claim, not the full ontology.
  *   **Time Constraint:** Steps 3 (Robustness) and 4 (Autonomy/Efficacy) require careful reading for evidence. An hour is tight but feasible if focused on these key arguments and results.

  This procedure forces explicitness about the claim, the evidence for the gap and robustness, and crucially, the evidence for autonomy and causal power. It terminates cleanly on undefined terms, unjustified gaps, fragile patterns, or epiphenomenal descriptions. It separates empirical checks (Steps 1-3, 4a) from the more fraught causal claims (Step 4b), flags key judgment points for the editor, and provides clear, defensible termination points. It won't resolve all philosophy, but it grounds the assessment in what the manuscript actually shows.
