  We are writing a fictional RFC (Request for Comments) for a company's internal infrastructure project. The project is called the "Knowability Gateway", and it is designed to ensure that every truth in the company's domain is in principle knowable (verifiable). The document should be in the style of an engineering design doc, with sections such as Summary, Motivation, Goals, Non-Goals, Design, Alternatives Considered, Rollout Plan, and Recommendation. We also need inline reviewer comments in the margins.

  The key points:
  - The paradox: If every truth is knowable, then we can derive that every truth is actually known. This is done by considering the proposition "p is true and nobody knows p". If this is true, then it must be knowable. But if it were known, then we would know p (so p is known) and also know that nobody knows p (which contradicts). Therefore, it cannot be true, meaning there are no unknown truths.
  - The doc should make a good case for the knowability principle: truths that are in principle beyond any evidence are problematic (metaphysical).
  - The concrete example: something like an undiagnosed incident or a migration that no one has checked the outcome of.
  - The doc must commit to one way out of the paradox and follow it consistently and deadpan. The escape routes are:
     a) Restrict the knowability principle to propositions that are stable (i.e., remain true when known).
     b) Give up some of the closure or factivity (e.g., maybe knowing a conjunction doesn't imply knowing each conjunct, or knowing doesn't imply truth? but factivity is usually non-negotiable).
     c) Bite the bullet: deny that there are any unknown truths (so every truth is known).
     d) Change the scope of the principle (e.g., read it as a conditional in a way that blocks the derivation).

  We'll choose (c) for the escape route: the doc will bite the bullet and deny that there are any unknown truths. Therefore, after the commitment, the doc must not admit to any unknown truths. So:
  - No "open questions" about unknowns; reframe them as non-issues or already known.
  - Dashboards become infallible by definition (if they show something, it's true and known; if they don't, then the state is not true? or we must assert that every truth is displayed?).
  - Outages: if an outage occurs and no one knows, then by the principle it cannot be true that there is an outage and no one knows. Therefore, either there is no outage, or someone knows. But since we are committed to every truth being known, we must say that if there is an outage, it is known. And if it's not known, then it's not an outage? We might have to reclassify unknown outages as non-events.

  We'll structure the RFC:

  1. **Header**: Company name, doc number, title, author, date.
  2. **Summary**: Brief overview of the proposal.
  3. **Motivation**: Why we need this? The problem of "metaphysical" truths that are beyond evidence.
  4. **Goals**: What we aim to achieve.
  5. **Non-Goals**: What we are not trying to do.
  6. **Design**: How the Knowability Gateway works.
  7. **Alternatives Considered**: Other ways we thought about solving the problem and why we rejected them.
  8. **Rollout Plan**: How we will implement and roll out the service.
  9. **Recommendation**: The commitment to the escape route and its implications.

  We'll include reviewer comments in the margins. At least one reviewer comment should raise the objection about the "p and nobody knows p" scenario. The author's reply should be technically correct and damning (i.e., it shows that the objection leads to the conclusion that there are no unknown truths).

  After the RFC, we'll have an author's note (100-150 words) explaining:
  - The escape route chosen (denial of unknown truths).
  - Liberties taken: perhaps we assumed that the domain of discourse is only about operational events? Or we leaned on a reading where "knowable" is interpreted as "must be known"?
  - What a philosopher who takes another way out (e.g., restricting knowability to stable propositions) would say is unfair: they might argue that the proposition "p and nobody knows p" is unstable (it becomes false when known) and hence shouldn't be subject to the knowability principle.
  - The single assumption that if dropped would collapse the joke: probably the factivity of knowledge (if knowing doesn't imply truth, then the contradiction doesn't arise) but we didn't drop that.

  Finally, we end with: \answer{denial of unknown truths}

