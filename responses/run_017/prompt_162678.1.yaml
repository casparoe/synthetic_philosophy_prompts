    - Better: 14 people -> 4 groups of 3 (12) and 2 floaters. The floaters will:
        - Round 1: Assist the oracle (you) in preparing materials for the next round? Or observe and take notes for the debrief.
        - Then, in Round 2, one floater replaces a debater in a group, and the other replaces a judge in a different group. The replaced participants become floaters for the next round. This way, everyone participates in at least three rounds.

