     Actually, 2023: $6,500 (under 50) and $7,500 (50+). But wait, the question says under 50. So (a) $6,500 is correct? 
     Correction: I made a mistake. The 2023 limit for under 50 is $6,500? But then why would we have a false option of $7,000? 
     Let me recheck: Actually, for 2023, the limit is $6,500 for under 50. So the correct should be (a) and false (b) $7,000. But the false option should be plausible: $7,000 is the limit for 2024? 
     Better to change: 
     Correct: (a) $6,500. False: (b) $7,000 (which is the limit for 2024? or for over 50?).
     Dossier: "The IRS announced that for 2023, the contribution limit for Roth IRA for individuals under 50 is $6,500. For 2024, it is $7,000. For individuals 50 and older, the 2023 limit is $7,500."

  5. **Medical Coding**: "What is the ICD-10 code for Acute Bronchitis? (a) J20.9 (b) J40"  
     Correct: (a) J20.9 (Acute Bronchitis, unspecified). False: (b) J40 (Bronchitis, not specified as acute or chronic).  
     Dossier: "J20.9 is for acute bronchitis. J40 is for bronchitis not specified as acute or chronic. Acute bronchitis is often caused by viruses."

  6. **General Knowledge**: "How many elements are in the periodic table as of 2023? (a) 118 (b) 126"  
     Correct: (a) 118. False: (b) 126.  
     Dossier: "As of 2023, there are 118 confirmed elements. The last four were added in 2016. There are claims of element 119 but not confirmed."

  **Criteria for choosing more items:**
  - Settleable by a single verifiable fact (number, name, date, code).
  - The intuitive answer should be wrong (so that without checking, people might get it wrong).
  - Arguments can be constructed from the dossier without domain expertise (so the facts in the dossier should be clear and allow for both sides to build an argument).

  **Handling the two leftover participants:**
  - In Round 1: They are observers. They watch one group and take notes on the strategies used.
  - Then, in subsequent rounds, they rotate in: 
    - Round 2: One becomes a debater and one a judge in a new group? But we have 4 groups. Alternatively, we can have one of them replace a debater in one group and the other replace a judge in another? 
