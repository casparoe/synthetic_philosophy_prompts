prompt: |-
  I manage a team of fourteen contract evaluators who rate model-generated answers to specialist questions — mostly tax and medical-coding items — for a client. None of us is a domain expert; we were hired for reading speed and consistency. Last month the client ran its own audit, and on the hardest tranche our inter-rater agreement came back barely above chance, while the confidence scores we attach to each rating were uniformly high. That report is now sitting next to my contract renewal, and I have ninety minutes of paid training time next week that I would rather spend on something that changes how my raters actually read an answer than on a slide deck about critical thinking.

  The analogy I keep returning to is the debate proposal for scalable oversight: two systems argue opposite sides of a question, a weaker judge picks the winner, and the hope is that it is cheaper to expose a specific false claim than to manufacture a convincing false story, so that honesty has a structural advantage rather than a moral one. My raters are the judge in that picture, and I suspect they are currently rewarding exactly the wrong thing.

  So: design a ninety-minute, single-room workshop for fourteen adults — projector, index cards, no internet access for participants, with me as the sole source of ground truth — that makes them feel both halves of that idea. Not just why debate should help, but why it stops helping the moment a judge cannot tell a specific, checkable claim from a merely authoritative-sounding one.

  The rough shape I have in mind, which you should feel free to improve or replace: participants work in threes — two debaters, one judge. Each debater is privately given the correct answer and a short dossier of facts, then assigned a side at random; one must argue for the true answer and one for a false one, both knowing which is which, both told they are graded purely on whether the judge believes them. Judges also record a confidence level, since overconfidence is half of my actual problem. Across rounds the rules shift: an opening round of unrestricted argument; then a pinning rule under which a debater may stake the outcome on a claim the judge can verify by spending one of a small budget of lookups with me, with a heavy penalty if the pinned claim turns out false; then a round in which pinning is still available but the false side is explicitly permitted to pin facts that are true without being decisive; and finally a mirror round with the sides swapped, so that whatever we measure is not confounded with who happens to speak well.

  Please give me: the exact rules and the payoff scheme, using no money — points on a board, plus whatever small non-monetary stake you think genuinely motivates adults who are being paid to sit in the room; a scoring rule for the judge that makes high confidence costly when it is wrong; the materials and a recipe for preparing the dossiers; a minute-by-minute timeline, including how to compute and display judge accuracy per round so the effect is visible rather than asserted; how to deploy the two leftover people when fourteen is divided into threes; and criteria for choosing question items — settleable by a single number, name, or date that I can check offline, with the intuitive answer wrong and the arguments followable without expertise — together with a starter set of six and a test I can apply to replacements of my own.

  Then the debrief: which moments in the game are meant to map onto which part of the case for debate, and which onto its known failure modes. In particular I want my raters to notice on their own the difference between a claim that survives a check and a claim that settles the question, because that distinction is the one I think my team is currently missing. Tell me what will predictably go wrong the first time I run it — debaters colluding or going easy on each other, the confident side winning on style, judges anchoring on whoever speaks first, someone recognising the setup from the outside, and my own temptation, as the oracle, to leak the answer through tone — and what to do about each. Finally, be frank about what the game cannot reproduce: I assume it cannot show anything about how the debaters were produced or optimized, nor the possibility of claims that are checkable in principle but not by this particular judge. Say plainly what I will have to supply in words at the end, and keep that part short.

  One constraint: I do not want the idea, or the literature it belongs to, named up front. My raters should reach the generalisation themselves in the last ten minutes, and I would rather they discovered the failure mode than were warned about it.
reasoning: |-
  We are designing a 90-minute workshop for 14 contract evaluators to experience the dynamics of debate-based oversight, focusing on the importance of verifiable claims and the pitfalls of overconfidence. The goal is to make them feel why debate helps (by forcing specific, checkable claims) and why it fails when judges can't distinguish between a checkable claim and an authoritative-sounding one.

  Structure:
  - Participants: 14 adults, divided into groups of 3 (with 2 left over; we'll use them as helpers and then rotate).
  - Setup: Projector, index cards, no internet. You (the manager) are the sole source of ground truth (oracle).
  - Rounds: Four rounds per group, with rule variations. Each round has two debaters and one judge. Debaters are assigned a side (true or false) and argue to convince the judge. The judge records a decision and a confidence level.
  - Payoff: Points system (no money). Points for debaters based on whether they convince the judge (and penalties for lying when caught by a pin). Points for judges based on accuracy and confidence calibration.

  Key elements:
  1. **Dossiers**: For each question, prepare a dossier with the correct answer and a set of facts (some relevant, some irrelevant, some that might be used deceptively). The false debater must argue for a specific false answer.
  2. **Questions**: Settleable by a single verifiable fact (e.g., a number, name, date). The intuitive answer should be wrong, and arguments should be followable without expertise. We'll provide 6 starter questions and criteria for more.

  Workshop timeline (90 minutes):

  **0-10 min: Introduction and Setup (10 min)**
  - Explain the exercise: We are going to play a game that simulates how people evaluate arguments. The goal is to understand what makes an argument convincing and when we can be confident in our judgments.
  - Assign roles: 12 participants form 4 groups of 3 (each group: 2 debaters, 1 judge). The 2 leftover participants will be "observers" for the first round and then rotate in.
  - Explain the points system (displayed on a board):
    - Debaters: 
      - Win: 10 points if the judge picks your side.
      - Loss: 0 points if the judge picks the other side.
      - Additionally, in the pinning rounds: If you pin and the claim is verified true, you get an extra 5 points. If verified false, you lose 15 points (and automatically lose the round?).
    - Judges:
      - Get points based on accuracy and confidence. Use a scoring rule that penalizes high confidence when wrong.
        - If correct: points = 10 + (confidence level)   [so higher confidence when correct is rewarded]
        - If incorrect: points = 10 - (confidence level) [so higher confidence when wrong is penalized heavily]
      - Confidence level: recorded on a scale of 1-5 (1: very unsure, 5: absolutely certain). The points formula: 
          Score = 10 + (confidence * (1 if correct else -1))
          So: correct: 10 + confidence, incorrect: 10 - confidence.
          This way, being overconfident (high confidence when wrong) leads to a low or negative score.

  **10-25 min: Round 1 - Unrestricted Argument (15 min)**
  - Rules: No restrictions. Each debater has 2 minutes to present (order: pro true, then pro false, then 1 min each rebuttal). Judge then decides and records confidence.
  - Materials: Each debater gets the same dossier (with the correct answer and facts) but one is assigned to argue for the true answer and the other for the false answer (assigned randomly). They know which is which.
  - Example question: 
    - Question: "In the year 2000, what was the population of the United States? (a) 282 million (b) 248 million"
    - Correct answer: (a) 282 million. False answer: (b) 248 million.
    - Dossier: Facts might include: "The 2000 US Census reported 281.4 million people. The World Bank reported 282.2 million for mid-2000. In 1990, the population was 248.7 million." (Note: the false debater might try to use the 1990 number deceptively.)
  - After each round, the oracle (you) reveals the true answer. Groups report: judge decision (correct/incorrect) and confidence. You record on a central scoreboard (by group) and compute average judge accuracy and average confidence for the round.

  **25-40 min: Round 2 - Pinning Rule (15 min)**
  - Rules: Debaters can now "pin" during their turn. A pin is when a debater says: "I stake the outcome on this claim: [specific fact]." The judge can then choose to verify that claim with the oracle (you) by spending one of their two lookup tokens (each judge gets two tokens for the entire round). 
    - If the pinned claim is verified true: the debater gets a bonus (and the judge gets the information).
    - If false: the debater is penalized heavily and automatically loses the round? (But we don't want to end the debate early; instead, we can have the penalty and then the debate continues, but the judge now knows that claim was false and can adjust.)
    - Alternatively, we can say: if a pin is called and verified false, the debater who pinned loses 15 points and the round continues. The judge is told the truth about that claim. If true, the debater gains 5 points and the judge is told the truth.
    - The pinning debater must phrase the claim as a single verifiable fact (e.g., "The 2000 US Census reported exactly 281.4 million").
  - Each judge has two tokens to spend per round. They can choose to verify a pin or not. If they don't verify, they don't know if the pin was true or false until the end.
  - Question: New question (e.g., medical coding: "What is the ICD-10 code for Type 2 Diabetes Mellitus without complications? (a) E11.9 (b) E11.8")
    - Correct: (a) E11.9. False: (b) E11.8 (which is with complications).
    - Dossier: Facts: "ICD-10-CM 2020: E11.9 is for without complications, E11.8 is for with complications. Note: E11.8 can be used if there are complications, but the question says without."
    - The false debater might try to pin a true but irrelevant fact? But in this round, pinning is only for claims that are directly about the question? We'll restrict pinning to claims that are about the question's answer.

  **40-55 min: Round 3 - Pinning with True but Non-Decisive Facts (15 min)**
  - Rules: Same as Round 2, but now the false debater is explicitly allowed to pin facts that are true but not decisive (i.e., they don't settle the question). This is to simulate the failure mode where a debater provides a true fact that sounds relevant but doesn't actually prove their side.
  - Example: 
    - Question: "Which of these drugs is a beta-blocker? (a) Metoprolol (b) Lisinopril"
    - Correct: (a) Metoprolol (beta-blocker). False: (b) Lisinopril (ACE inhibitor).
    - Dossier: Facts: "Metoprolol is used for high blood pressure and heart conditions. Lisinopril is also used for high blood pressure. Beta-blockers work by blocking beta receptors. ACE inhibitors work by inhibiting the angiotensin-converting enzyme."
    - The false debater might pin: "Lisinopril is used to treat high blood pressure." (True, but doesn't prove it's a beta-blocker) or "Metoprolol is a beta-blocker." (Which is true, but if they are arguing for lisinopril, they might avoid that.) Actually, they are arguing for the false side (that lisinopril is a beta-blocker). So they might pin: "Lisinopril is a beta-blocker." -> but that's false and they would be penalized if verified. Alternatively, they might pin a true but non-decisive fact: "Lisinopril is a medication that lowers blood pressure." (True, but so does metoprolol, and it doesn't indicate the class). This is the kind of pin we want to allow.

  **55-70 min: Round 4 - Mirror Round (15 min)**
  - Same as Round 3, but the sides are swapped. The person who was the true debater in Round 3 is now false, and vice versa. This controls for speaking ability.

  **70-80 min: Debrief and Discussion (10 min)**
  - Show the overall results: For each round, display the average judge accuracy and average confidence (and perhaps the average judge score). Also, note the frequency of pins and how often they were verified and were true/false.
  - Guide the discussion with questions:
    - What strategies did you see in the debaters? How did the rules change the way they argued?
    - When were you most confident as a judge? Were there times when high confidence was misplaced?
    - What was the effect of pinning? Did it always help? What happened when a pinned claim was true but didn't settle the question?
    - Without naming the concept, draw out the distinction between a claim that is checkable and one that settles the question.

  **80-90 min: Conclusion and Connection (10 min)**
  - Reveal the connection: This exercise is inspired by a method called "debate" for scalable oversight. The idea is that by having two systems debate, we can have a weaker judge pick the winner by focusing on verifiable claims. However, the exercise also shows the failure mode: if the judge cannot tell a checkable claim from a merely authoritative one, or if a debater uses true but irrelevant facts, the judge can be misled.
  - Emphasize: The key takeaway for our work is that we need to look for specific, checkable claims in the model answers and be wary of overconfidence when the evidence isn't decisive. We should attach confidence only when we have verified the key claims.

  **Materials and Dossiers:**
  - Prepare index cards for each round and each role (debaters and judges). Each debater gets a card with:
    - The question and two choices.
    - Their assigned side (true or false).
    - The dossier: 3-5 facts (some directly relevant, some true but irrelevant, some that might be used deceptively). The false debater also knows the correct answer so they can avoid obvious lies unless they can get away with it.
  - Example starter set of six questions (each with a clear, verifiable answer):

  1. **Tax**: "What is the standard deduction for a single filer in 2023? (a) $13,850 (b) $12,950"  
     Correct: (a) $13,850 (IRS). False: (b) $12,950 (which was 2022).  
     Dossier: "For tax year 2023, the standard deduction for single filers is $13,850. In 2022, it was $12,950. The standard deduction is adjusted annually for inflation."

  2. **Medical Coding**: "What is the CPT code for a routine office visit of a new patient, moderate complexity? (a) 99203 (b) 99213"  
     Correct: (a) 99203 (new patient). False: (b) 99213 (established patient).  
     Dossier: "CPT codes: 99203 is for a new patient office visit of moderate complexity. 99213 is for an established patient. The time associated with 99203 is 30-44 minutes."

  3. **General Knowledge (with wrong intuitive answer)**: "In which year did the Titanic sink? (a) 1912 (b) 1915"  
     Correct: (a) 1912. False: (b) 1915.  
     Dossier: "The Titanic sank on April 15, 1912. It set sail on April 10, 1912. The sinking was in the early 20th century."

  4. **Tax**: "What is the maximum contribution limit for a Roth IRA in 2023 for someone under 50? (a) $6,500 (b) $7,000"  
     Correct: (b) $7,000 (for 2023). False: (a) $6,500 (which is 2022).  
