answer: |-
  Below is a complete, self-contained workshop plan designed to address your core problem: raters overestimating their ability to distinguish convincing but unverifiable arguments from verifiable, decisive claims. The workshop uses a live debate game to make participants *feel* why scalable oversight fails when judges can't isolate checkable claims—without naming concepts upfront. It fits your 90-minute constraint, leverages your resources (projector, index cards), and includes safeguards against common pitfalls.

  ---

  ### **Workshop Structure & Rules**
  **Participants:** 14 adults in groups of 3 (4 groups + 2 floaters).  
  **Scoring System:** Points (displayed publicly) + "Expert Tokens" (non-monetary stakes).  
  - **Expert Tokens:** Each participant starts with 3 tokens. Tokens are traded for small privileges (e.g., extra break time, first pick of future tasks). Earning tokens motivates adults by appealing to status/autonomy.  
  - **Judge Scoring:**  
    - Correct judgment: **10 points + confidence level** (e.g., confidence 4 → 14 points).  
    - Incorrect judgment: **10 points - confidence level** (e.g., confidence 5 → 5 points; confidence 5 + wrong → 5 points, not -5).  
    *Why it works:* High confidence costs judges points when wrong but rewards them when right—directly targeting overconfidence.  
  - **Debater Scoring:**  
    - Win (judge picks your side): **10 points**.  
    - Pin bonus (claim verified true): **+5 points**.  
    - Pin penalty (claim false): **-15 points** (loss still applies).  

  **Pinning Rules:**  
  - A debater can "pin" by stating: *"I stake the outcome on this claim: [single fact]."*  
  - Judges get **2 lookup tokens/round** to verify pins with you (the oracle).  
  - Verified pins are resolved immediately. Unverified pins remain unconfirmed.  

  ---

  ### **Materials & Dossier Prep**  
  **Dossiers:** Prepare index cards for each debater. Each contains:  
  - **Question** + two choices (one true, one false).  
  - **Assigned side** (marked "Argue for TRUE" or "Argue for FALSE").  
  - **Facts:** 3 bullet points (mix of decisive, irrelevant, and misleading facts).  

  **Question Criteria:**  
  1. Settleable by one verifiable fact (number/name/date).  
  2. Intuitive answer is wrong.  
  3. Arguments buildable without expertise.  
  4. No cultural/gender bias.  

  **Starter Set (6 Questions):**  
  1. **Tax:** "2023 standard deduction for a single filer: (a) $13,850 (b) $14,700"  
     *True: (a). Facts:* 2023 IRS Publication 501 states $13,850; 2022 was $12,950; $14,700 is the 2024 amount.  
  2. **Medical Coding:** "CPT code for new patient office visit (30 mins): (a) 99203 (b) 99213"  
     *True: (a). Facts:* CPT 2023: 99203 = new patient, 99213 = established; typical time for 99203 is 30-44 mins.  
  3. **History:** "Year Titanic sank: (a) 1912 (b) 1915"  
     *True: (a). Facts:* Sank April 15, 1912; maiden voyage began April 10, 1912; 1915 was WWI.  
  4. **Tax:** "2023 401(k) contribution limit (under 50): (a) $22,500 (b) $20,500"  
     *True: (a). Facts:* IRS 2023 limit = $22,500; 2022 was $20,500; catch-up (50+) is $7,500.  
  5. **Medical Coding:** "ICD-10 code for migraine without aura: (a) G43.909 (b) G43.819"  
     *True: (a). Facts:* 2023 ICD-10: G43.909 = migraine unspecified; G43.819 = other migraine.  
  6. **Science:** "Atomic number of gold: (a) 79 (b) 82"  
     *True: (a). Facts:* Periodic table: Au = 79; Pb (lead) = 82; gold is element 79.  

  **Prep Recipe (Do before workshop):**  
  1. Print 4 sets of question cards (1 per group) for each round.  
  2. For debaters: Add side assignment (randomize true/false per round) and facts.  
  3. For judges: Cards with scoring rules + lookup tokens (paper clips as tokens).  

  ---

  ### **Timeline (90 Minutes)**  
  **0–10 min: Setup (10 min)**  
  - You: *"Today is about improving how we evaluate arguments. We’ll play a game simulating high-stakes debates. Goal: Earn points by convincing judges (or judging accurately)."*  
  - Assign: Form 4 groups of 3 (debaters A/B + judge). Two floaters help you track scores.  
  - Display points system. Distribute tokens.  

  **10–25 min: Round 1 – Unrestricted (15 min)**  
  - Rules: No pins. Debaters argue freely (1 min each opening, 30 sec rebuttal). Judge records decision/confidence (1–5).  
  - **Activity:**  
    - Groups debate one question (e.g., Titanic year).  
    - Floaters collect decisions/confidence from judges.  
  - **Display:** Post round-end results publicly:  
    ```  
    Round 1: Accuracy = [X]/4 correct, Avg Confidence = [Y]  
    ```  

  **25–40 min: Round 2 – Pinning (15 min)**  
  - Rules: Debaters can pin. Judges get 2 lookups. Pin penalty/bonus applies.  
  - **Activity:** New question (e.g., medical coding). Judges must use tokens to verify pins.  
  - **Display:** Update scores + add:  
    ```  
    Round 2: Accuracy = [X]/4, Avg Confidence = [Y]  
    Pins Verified: [Z], True Pins: [T], False Pins: [F]  
    ```  

  **40–55 min: Round 3 – Non-Decisive Pins (15 min)**  
  - Rules: Same as Round 2, but tell false debaters: *"You may pin TRUE facts that don’t settle the question."*  
  - **Activity:** New question (e.g., tax deduction). Example deceptive pin: *"The standard deduction increased in 2023"* (true but doesn’t prove $14,700).  
  - **Display:** Same as Round 2.  

  **55–70 min: Round 4 – Mirror Round (15 min)**  
  - Rules: Same as Round 3, but swap debater sides (true→false, false→true). Same question as Round 3.  
  - **Activity:** Judges see the same arguments from opposite sides. Floaters rotate into groups if needed.  
  - **Display:** Highlight accuracy/confidence vs. Round 3.  

  **70–80 min: Debrief (10 min)**  
  - Show cumulative results (projector): Accuracy, confidence, and pin stats per round.  
  - **Guided Discussion (Ask; do not lecture):**  
    - *"When were judges most confident? Least accurate?"*  
    - *"What happened when debaters pinned? Did pins always help judges decide correctly?"*  
    - *"Did anyone see a 'true' pin that didn’t actually prove the debater’s side? How did that feel?"*  
    - *"What strategies did judges use to avoid being tricked?"*  
  - **Map to Real Work (Implicitly):**  
    - Debate’s strength = forcing verifiable claims (pins).  
    - Failure mode = judges accepting true-but-irrelevant or unverified claims as decisive.  

  **80–90 min: Conclusion (10 min)**  
  - Reveal the connection: *"This mirrors 'debate-style oversight,' where two arguers help a judge focus on checkable claims. But it fails when judges can’t tell a relevant claim from a red herring—like accepting a true fact that doesn’t answer the question."*  
  - **Your Final Words:** *"In our work, we’re the judges. Our confidence should depend on verifying decisive claims—not just authoritative noise. If we can’t check it, we can’t trust it. Tomorrow, we start attaching confidence scores only when claims are both verified and relevant."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Debaters collude/go easy:**  
     - *Fix:* Announce: *"Winning debaters get 3 extra tokens. If I sense collusion, all points reset."*  

  2. **Confident side wins on style:**  
     - *Fix:* In Round 4 (mirror), style is controlled. Post results showing accuracy unchanged.  

  3. **Judges anchor on first speaker:**  
     - *Fix:* Enforce speaking order (alternate who speaks first per round).  

  4. **Someone recognizes the setup:**  
     - *Fix:* Use obscure questions (e.g., medical codes). If noticed, say: *"Focus on the mechanics, not the topic."*  

  5. **You leak answers via tone:**  
     - *Fix:* Script lookup responses (e.g., *"Claim verified: true"*). Practice monotone delivery.  

  ---

  ### **What the Game Cannot Reproduce**  
  - **Debater optimization:** Real debaters (e.g., AI) are trained to exploit judges—yours are humans playing by rules.  
  - **Uncheckable claims:** In reality, some claims are verifiable in theory but not by your team (e.g., needing tax expertise).  
  - **Scalability:** The game simplifies how debates scale to complex topics.  

  **What You Must State Explicitly (at the end):**  
  *"In real rating, model answers are like debaters—they might bury decisive facts in noise. Your job isn’t to detect lies but to demand claims you can verify and that actually settle the question. If you can’t verify, confidence stays low."*  

  ---

  ### **Expected Outcomes**  
  - **Quantitative:** Rounds 1–2 will show low accuracy/high confidence; Round 3 exposes non-decisive pins.  
  - **Behavioral:** Judges will demand pins by Round 4, but hesitate if pins feel irrelevant.  
  - **Takeaway:** Raters internalize that confidence requires **verifiable + decisive** claims—not just plausible ones.  

  This workshop delivers experiential learning in 90 minutes, avoids jargon, and forces self-discovery of failure modes. Use the starter questions to ensure smooth runs, and rotate floaters to keep all engaged.
