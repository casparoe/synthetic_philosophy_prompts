        Round 1: 4 groups (12 people) and 2 observers.
        Round 2: The 2 observers join to form 5 groups (15 people? but we have 14). 
        Alternatively, we can have 4 groups of 3 and one group of 2 (but then that group can't have two debaters and a judge). 
    - Instead, we can have 4 groups of 3 (12 people) for the first three rounds, and then for the last round, rotate the two extra in and have two groups of 4? But that complicates.
