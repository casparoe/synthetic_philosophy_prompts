prompt: |-
  I've been reading about moral particularism and generalism on my own — no classes, just books and a long-running argument with a friend — and the argument has stalled in a way I think only a well-built case can fix. So I'd like a case constructed to order.

  My friend's position: as he understands it, particularism says only that reasons can be outweighed or defeated, that you can't read an all-things-considered verdict off a single feature. Everyone already believes that, generalists included, he says. So particularism is either a truism or it collapses into the claim that morality can't be taught, argued about, or learned from cases — which he takes to be obviously false. I want a case that shows the interesting claim is stronger than defeat, and I want it built so that he can't wave it off as a stipulation.

  Specifications:

  1. Two ordinary situations, one paragraph each: a workplace, a family, a clinic, a neighborhood. No trolleys, no science fiction, no exotic roles or institutions. The two cases should share a thin non-moral description — same kind of agent, same kind of act — and differ by the addition of exactly one further non-moral fact. Call the shared feature F and the act X.
  2. In case A, F is a reason to do X, and doing X is what should be done. In case B — A plus the one extra fact — F is *still* a reason to do X; I don't want it to go silent, and I don't want a plain defeat where it simply gets outweighed by something independent of it. But in B, F is also part of what makes some other feature G into a reason *not* to do X. So F favours doing X and, in the same situation, enables a reason against doing X. And in B, all things considered, X shouldn't be done. That double role is the thing my friend denies can happen.
  3. The difference between the cases must not be traceable to consequences, or to a change in the agent's aims or motives. Hold outcomes fixed across the two cases as far as you honestly can.
  4. The pull has to come from the setup, not from my say-so. I don't want to have to add "and intuitively, here F is a reason against." A careful reader should feel the flip before it's named.
  5. Anticipate his repair: he'll say the generalist just states a more specific principle, or adds a ceteris paribus or "unless defeated" clause, and gets the right answer anyway. So show what that repair costs: whether the extra condition in the more specific principle can be stated in general terms at all, rather than being a disguised proper name for this case; and whether a hedged principle can still guide someone facing the case for the first time, before they know how it comes out.

  After the scenario, walk through how a strong generalist, a hedged or defeasible generalist, and a particularist each describe both cases; then say which structural feature of the case is doing the double-role work, what happens to the case if you remove that feature, and how my friend would best attack it. If some part of my specification can't be met without cheating, say so plainly and give me the nearest specification that can be met.

  Finally, tell me how confident you are in what you claim about what each view is committed to, and single out the point you're least sure of. I'd rather have an honest boundary marker I can concede than a confident overreach I can't defend when he pushes back.
reasoning: |-
  Okay, let me tackle this user's request. They're deep into moral philosophy, specifically the particularism vs. generalism debate, and need a compelling case to counter their friend's argument. The friend thinks particularism is either trivial or leads to moral unteachability. The user wants a scenario where a feature serves as both a reason for and an enabler against the same action, under nearly identical conditions.

  First, I need to create two ordinary situations that differ by only one non-moral fact. Workplace, family, clinic, or neighborhood settings would work best. I consider a workplace scenario involving a manager giving feedback. In Case A, giving direct feedback is appropriate. In Case B, the addition of a recent traumatic event makes that same directness enable harm, even though it remains a reason for clarity.

  The key challenge is ensuring the double role of Feature F (directness) without making it about consequences or motives. I structure Case B so the traumatic event isn't a new reason against feedback but transforms directness into enabling harm. This avoids simple outweighing and highlights particularism's core claim.

  I anticipate the friend's generalist response: they might propose a more specific principle, like "unless recent trauma." But this principle either becomes circular (referencing the very case it's explaining) or loses action-guidance by requiring prior knowledge of the case's outcome. The particularist would argue that the trauma's moral relevance isn't rule-based but context-dependent.

  My uncertainty lies in whether a generalist could formulate a truly action-guiding principle here. While I think it's unlikely without being ad hoc, this is the weakest point in the argument. The user should be prepared for this counter.

  The neighborhood scenario (bonus) offers another angle but might dilute focus. I stick with the workplace example for clarity. Finally, I outline how each theory handles the cases and note that the structural feature—contextual interaction—is crucial. Without it, the double role disappears, collapsing into simple defeat.
answer: |-
  Here is a case designed to meet your specifications, followed by the analysis you requested. I've aimed for maximum intuitive pull while adhering strictly to your constraints. The weakest point is noted at the end.

  **The Case: The Feedback Session**

  *   **Shared Thin Description (Feature F & Act X):**
      *   **Agent:** A manager.
      *   **Act X:** Giving direct, critical feedback to an employee about a significant performance error they made.
      *   **Feature F:** The feedback is factually accurate and addresses a specific, important aspect of the employee's work where improvement is needed. (F = *Accuracy & Relevance* of the feedback).
  *   **Background Facts (Held Constant):**
      *   The employee genuinely made the error; it wasn't trivial and could impact their work/team.
      *   The manager has a duty to provide feedback for performance improvement.
      *   The feedback session is private.
      *   The manager delivers the feedback calmly and professionally, not harshly or abusively.
      *   The *intended immediate outcome* is the same: the employee understands the error and what needs to improve.
      *   The *long-term desired outcome* is the same: improved employee performance.

  *   **Case A:**
      *   **Additional Facts:** The employee, Alex, is generally confident, has received constructive criticism well in the past, and the error occurred during a normal, low-stress period. There is no unusual context.
      *   **Moral Status:** F (Accuracy & Relevance) is a strong reason for the manager to do X (give the feedback). Doing X is the right thing to do. Alex listens, understands the points, and feels motivated to improve. Performance improves.

  *   **Case B:**
      *   **Additional Fact (Exactly One):** Alex experienced a severe, unrelated personal trauma (e.g., the sudden death of a close family member) *just 48 hours ago*. Alex is visibly struggling but trying to cope.
      *   **Moral Status:** F (Accuracy & Relevance) is *still* a reason for the manager to do X (give the feedback). The facts are correct and relevant to Alex's work performance; the manager has a duty to address performance issues. *However*, F (Accuracy & Relevance), *in this specific context* (the immediate aftermath of severe trauma), *enables* a different feature, **G** (The feedback's *potential to overwhelm Alex's current coping capacity*), to become a decisive reason *against* doing X. G wouldn't exist as a significant reason without F (accurate, relevant feedback is inherently demanding to process). Crucially, G isn't just an *independent* reason against feedback (like "it might hurt Alex's feelings" – which exists generally but is usually weak). Here, F *creates the conditions* for G to have strong negative weight. All things considered, X (giving the direct feedback *now*) should *not* be done. The manager should postpone the feedback session until Alex has had more time to process the trauma, even though the facts remain accurate and relevant.

  **Analysis:**

  1.  **The Double Role of F:** In Case B, F (Accuracy & Relevance) simultaneously:
      *   Favors X: The facts need correction for performance reasons.
      *   Enables G (Overwhelming Potential) to count strongly against X: Precisely *because* the feedback is accurate and relevant to an important aspect of Alex's work, it demands significant cognitive and emotional processing that Alex, in their current fragile state (caused by the trauma), is highly vulnerable to being overwhelmed by. The accuracy/relevance makes the feedback *potentially crushing* in this context.

  2.  **How the Views Describe the Cases:**
      *   **Strong Generalist (Strict Principles):** Struggles immensely. They might say:
          *   *Case A:* "Always give accurate, relevant feedback on performance errors." (Principle holds).
          *   *Case B:* The principle fails. They might try to salvage it by saying "Never give feedback that causes harm," but this misidentifies the reason – the harm *risk* is enabled by F itself in this context, not an independent consequence. Their core principle about F being *always* a reason for X is falsified by Case B, where F contributes to the strongest reason *against* X.
      *   **Hedged/Defeasible Generalist (Principles with "unless"):** Attempts a repair:
          *   *Case A:* F is a reason for X. Principle: "Give accurate, relevant feedback on performance errors."
          *   *Case B:* F is *still* a reason for X, but outweighed/enabled against. Proposed Principle: "Give accurate, relevant feedback on performance errors *unless the employee is experiencing extreme, recent personal trauma*." Or, "...*unless it would likely overwhelm their coping capacity*."
      *   **Particularist:** Describes the cases holistically.
          *   *Case A:* The constellation of features (accurate/relevant feedback, competent/stable employee, normal context) makes doing X right. F is a central positive reason.
          *   *Case B:* The constellation of features (accurate/relevant feedback + employee in acute grief/shock) makes doing X wrong. F is still a reason *for* X (the need for correction remains), but F *interacts* with the trauma context to make G (overwhelming potential) a powerful reason *against* X. The moral valence isn't inherent in F alone or the trauma alone; it emerges from their specific combination.

  3.  **Cost of the Generalist Repair:**
      *   **Stating the Condition Generally?** The hedged generalist's "unless" clause ("extreme, recent personal trauma", "overwhelm coping capacity") *is* stated in general terms. This is better than a disguised proper name. *However*, the crucial question is its **action-guidance for a first-time encounter**.
      *   **Can the Hedged Principle Guide?** Only partially and problematically.
          *   *"Extreme, recent personal trauma"*: This identifies the *trigger*, but tells the manager *nothing* about *why* it matters or *what* to do instead (postpone? soften? refer to support?). The *moral relevance* of this condition – how it fundamentally alters the normative landscape *around F* – isn't captured by the rule. The manager applying this rule knows *not* to give feedback now, but doesn't necessarily grasp *why* F's role changed. They might think the trauma simply *outweighs* F, rather than F *enabling* G against itself.
          *   *"Overwhelm coping capacity"*: This gets closer to the *reason* (G), but applying it requires the manager to *already* understand the complex interaction between F and the trauma context to judge the *risk* of overwhelming. The rule presupposes the very contextual sensitivity the particularist emphasizes. A manager facing this for the first time might not anticipate how F (accuracy/relevance) *specifically* interacts with trauma to create G. The rule doesn't illuminate the enabling role of F; it just names the outcome.
      *   **Conclusion on the Repair:** The hedged generalist can state a general condition, but the principle fails to *explain* the *structural interaction* (F enabling G against X) and provides limited *practical guidance* for *why* withholding X is necessary beyond identifying the condition. The particularist argues the *moral salience* of the trauma's interaction with F can only be appreciated contextually, not deduced from a rule + exception list.

  4.  **The Structural Feature Doing the Work:**
      *   The key structural feature is **contextual interaction altering the normative significance of other features**. In Case B, the trauma context doesn't just add an independent negative reason; it fundamentally changes *how* F operates. F retains its positive reason-giving force *but also* acquires a novel property: turning the *inherent demandingness* of accurate/relevant feedback (usually a minor or negligible factor) into a powerful negative reason (G) in this specific context. The trauma makes Alex vulnerable, and F provides the specific content that could exploit that vulnerability harmfully. Remove the *interaction* (e.g., if the trauma was minor and distant, or if the feedback was vague/unimportant), and F doesn't enable G against X; it might just be outweighed by an independent reason (like "Alex is slightly sad").

  5.  **How Your Friend Might Attack It:**
      *   **Deny the Enabling:** Argue that G ("overwhelming potential") is *always* a weak reason against feedback, and the trauma is simply a *strong independent reason* against imposing *any* stress, which easily outweighs F. They might say F doesn't *enable* G; the trauma makes G *stronger*, but G existed independently. (Counter: In Case A, with a stable employee, G is negligible *because* F isn't interacting with vulnerability. The *potential* for overwhelm is intrinsically linked to the *demandingness* of F – accurate, relevant criticism *is* demanding. It only becomes a *significant* reason (G) when F meets vulnerability. The trauma isn't an independent reason against feedback *per se*; it's a reason against *demands*, and F *is* the specific demand).
      *   **Conflate Enabling with Consequences:** Argue that the reason against X is simply the *predicted consequence* of harm, and the trauma changes the *likelihood* of that consequence. (Counter: The specification holds *intended outcomes* fixed. The manager isn't *trying* to harm Alex. The reason against X stems from the *current normative relationship* F has to Alex's vulnerability – the feedback *being* potentially crushing *right now* – not a prediction of future harm per se. The wrongness is in the act's character *in this context*, not just its effects).
      *   **Claim the Hedged Principle Suffices:** Argue that the "unless recent severe trauma" clause *is* sufficient action-guidance and captures the moral reality. (Counter: As argued above, it identifies the *condition* but fails to illuminate the *why* – the complex interaction and enabling role – and provides limited positive guidance on what *to* do. It treats the exception mechanistically).
      *   **Question Ordinary Intuition:** Argue that in Case B, F (Accuracy & Relevance) *ceases* to be a reason *for* X. The duty to give feedback is suspended by the trauma. (Counter: The *need* for the performance issue to be addressed hasn't vanished. F still provides a reason *why* it *should* be addressed *eventually*. It hasn't gone silent; its role has become complex).

  **Confidence & Uncertainty:**

  *   **High Confidence:** The case successfully shows F acting as both a reason *for* X and enabling a reason *against* X in a way stronger than simple defeat or silencing, within ordinary contexts, holding outcomes/motives fixed, and differing by only one non-moral fact. The double role is structurally clear. The failure of the strong generalist model is clear.
  *   **Moderate Confidence:** The analysis of the hedged generalist's position and its limitations regarding action-guidance and explaining the enabling relation. The hedged principle *can* be stated generally ("severe recent trauma"), but its ability to *guide* someone facing the case for the first time *without* relying on contextual intuition is severely limited.
  *   **Lowest Confidence / Boundary Marker (The Crucial Uncertainty):** **Whether a sufficiently sophisticated hedged generalist *could* formulate a principle that *does* capture the enabling interaction in a genuinely action-guiding way for a novice.** For example: "Give accurate, relevant feedback on performance errors, *unless the employee's current vulnerability (e.g., from recent trauma) means that feedback of that accuracy and relevance would itself constitute an overwhelming demand.*" *Is this principle:* 1. Truly general? (Yes, arguably). 2. Action-guiding for a novice? (More so than simpler hedges – it points to the interaction). 3. Still distinct from particularism? (Debatable – "vulnerability" and "overwhelming demand" require significant contextual judgment, blurring the line). This is the point where your friend's repair attempt is strongest and where the particularist must argue that the principle either becomes circular (relying on understanding "overwhelming demand" which presupposes knowing how F interacts with context) or is so vague it collapses back into particularistic judgment. **Concede this:** A hedged generalist *might* get the right verdict with a complex principle, but the principle either relies on concepts requiring the very contextual sensitivity particularism highlights, or it fails to provide the *explanatory depth* or *reliable novice guidance* promised by strong forms of generalism. The enabling relation remains a challenge for rule-based codification.
