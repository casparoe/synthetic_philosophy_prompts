          def update_reliable_dave(prior, antecedent, consequent, reliability=0.8):
              # reliability: probability that the material conditional holds.
              # We'll compute the likelihood for each state.
              # For a state:
              #   if it is in (not A or B): likelihood = reliability
              #   if it is in (A and not B): likelihood = 1 - reliability   (because if he is reliable 80%, then he is wrong 20%)

              likelihood = {}
              for sq in prior:
                  if not antecedent(sq) or consequent(sq):
                      # in the material conditional
                      likelihood[sq] = reliability
                  else:
                      # A and not B
                      likelihood[sq] = 1 - reliability

              # Multiply and normalize
              total = 0
              for sq in prior:
                  total += prior[sq] * likelihood[sq]

              new_prior = {}
              for sq in prior:
                  new_prior[sq] = prior[sq] * likelihood[sq] / total

              return new_prior

