  ### Limitations and Caveats
  1. **Ambiguity in unreliable conditionals**:  
     - The rule models Dave’s reliability as the probability the *material conditional* is true.  
     - Alternatives (e.g., Dave correctly reports \(P(B|A)=1\) with 80% probability) would require a different approach (not covered here).

  2. **Antecedent probability preservation**:  
     - CPU always preserves \(P(\text{antecedent})\) (e.g., West column probability).  
     - This can feel unintuitive when the "loved spot" is ruled out (flip-flop case), but it’s consistent with treating *if-then* as a constraint on the antecedent’s "subspace".

  3. **Logically equivalent, but different updates**:  
     - *if-then* and *either-or* are logically equivalent, but trigger different updates (CPU vs. MCU).  
     - This explains your feeling in Case (5) and is a known philosophical issue (e.g., Judy Benjamin problem).

  4. **Compatibility with prior knowledge**:  
     - If the constraint is impossible (e.g., Case 2), CPU rules out the antecedent.  
     - Otherwise, it redistributes probability within the antecedent.

