t's in the north square" instead of the conditional in (1). That rules out exactly the same single square, but it *feels* different to me: the either-or phrasing makes me want to lower my P(West column), the if-then phrasing doesn't. I half think that's just a glitch in my head and half think it's telling me something real. (6) Then there's Dave, who is right about this kind of thing about four times out of five. When Dave says "if West then north" I want to move most of the West-south probability onto West-north but not all of it — except I realize I have no idea what "80% reliable" even means for a conditional, or whether the leftover bit should sit on West-south or leak out of the West column entirely.

