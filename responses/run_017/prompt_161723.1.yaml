  Okay, let me start by really understanding the user's problem. They're defending the Dutch Book argument in a reading group and someone presented a counterexample that seems to prove too much—requiring omniscience or collapsing entirely. The user wants to know where the mistake is and how to salvage probabilism without absurd conclusions.

  First, I need to break down the counterexample. The opponent argues that if a bookie has more information, they can exploit you even if your credences are coherent. For example, selling you a bet at your fair price (70 cents for a $1 payout on a true claim) when they know it's true, causing you a sure loss. This happens repeatedly, making your coherent credences seem irrational. Then, if you avoid betting against better-informed bookies, the Dutch Book argument loses its force because both coherent and incoherent agents are safe if they don't bet.

  The user tried requiring the bookie to commit before knowing outcomes, but they're unsure if that fixes it. They want to keep the conclusion that incoherent credences are irrational but need a defensible argument for probabilism without demanding omniscience or having no normative bite.

  I recall that the standard Dutch Book argument assumes a synchronic bookie who doesn’t have extra information. The counterexample introduces a bookie with private knowledge, which isn't part of the original setup. The original argument is about internal consistency of beliefs at a single time, not about epistemic access. So step (3) is the misstep—it changes the scenario to one with asymmetric information, which the Dutch Book argument isn't designed to handle.

  But why does that matter? Because the Dutch Book is meant to show that incoherent credences are internally inconsistent, making you take bets that lose money regardless of the world's state. The bookie here isn't exploiting inconsistency but your lack of information. Coherent agents avoid sure losses from their own perspective, not from a god's-eye view. So the normative force is about avoiding self-sabotage, not about being omniscient.

  The user also mentions collapsing in the other direction—if you don't bet, the argument demands nothing. But the Dutch Book argument isn't about actual betting; it's about dispositions. Even if you decline bets, having incoherent credences means you're disposed to accept a set of bets that would guarantee a loss. That disposition is the defect, not the act of betting itself. So declining doesn't make the incoherent agent rational; they still have the flawed disposition.

  The user is worried about smuggling in normative assumptions. The Dutch Book argument needs the principle that being exploitable in this specific way (sure loss through fair bets) is irrational. That principle isn't derived from the argument but assumed. If the user rejects that, the argument doesn't work. But accepting it gives a clear standard for internal consistency.

  In the counterexample, the bookie's offer provides evidence, which you should update on. But the Dutch Book argument is synchronic—it doesn't consider updating. Once offered a bet, your credences might change, but the argument applies before any bets are offered. So the bookie's offer as evidence is a separate issue.

  The user's fix of having the bookie commit beforehand might help, but the deeper point is that the bookie must not have asymmetric information. The argument requires that the bets are fair based solely on your credences without external factors. So step (3) introduces a different exploit not relevant to coherence.

  The user wants to preserve the irrationality of incoherent credences. The key is to clarify that the Dutch Book argument targets inconsistency in belief states, not ignorance. Omniscience isn't required; avoiding self-contradiction is. The counterexample confounds two issues: coherence and epistemic access. Separating them saves probabilism's core without absurdity.

  In summary, rejecting step (3) as misapplying the argument by introducing asymmetric information preserves (1)'s conclusion. The cost is accepting that rationality doesn't require omniscience, just avoiding internal inconsistency in beliefs. The normative bite comes from the principle that vulnerability to sure loss through fair bets is irrational, which remains plausible when the exploit stems from incoherence, not ignorance.
answer: |-
  You've hit on a classic and sophisticated objection to the Dutch Book Argument (DBA). The mistake lies in **step (3)**, but the implications reveal deeper nuances about what the DBA *actually* establishes. Here's a breakdown:

  ### 1. **The Core Mistake: Misapplying "Exploitability"**
     - **Step (3) violates the DBA's implicit assumptions.** The DBA assumes a **synchronous, informationally symmetric** scenario: the bookie constructs the entire "Dutch Book" *before* any outcomes are resolved, based *only* on your publicly stated credences. The bookie has **no private knowledge** you lack.  
     - In your counterexample, the bookie exploits **asymmetric information** (knowing a truth you don’t). This is a *different kind* of exploit: one based on **epistemic disadvantage**, not incoherent credences. The DBA doesn’t address this.  
     - **Consequence:** A coherent agent (with probabilistic credences) *can* lose money to a better-informed bookie. But this loss isn’t due to *internal inconsistency* in their beliefs—it’s due to ignorance. The DBA only claims that *incoherent* agents face sure losses *even when no one has extra information*.

  ### 2. **Why Rejecting (3) Preserves (1) Without Absurdity**
     - **Probabilism ≠ Omniscience:** The DBA shows that violating probability axioms makes you vulnerable to a sure loss *from your own perspective*, assuming no hidden information. Assigning 70% to a truth isn’t irrational—it’s rational if that’s your evidence. The bookie’s exploitation here relies on *their* knowledge, not *your* incoherence.  
     - **The "Cure" Doesn’t Collapse the Argument:**  
       - Declining bets against better-informed agents is prudent, but it doesn’t negate the DBA. The DBA targets your *dispositions*: if your credences are incoherent, you’re *disposed* to accept a set of bets that *guarantee* a loss *under information symmetry*. This defect exists even if you avoid betting.  
       - A coherent agent’s dispositions are *safe* under symmetry; an incoherent agent’s are not. That’s the normative distinction.  
     - **The Bookie’s Offer as Evidence:** Yes, a bookie’s offer might signal their knowledge, and you should update your credences. But the DBA applies *before* any offers—it’s about your *initial* credences. Updating is a separate (diachronic) issue.

  ### 3. **Your Fix Is Correct (and Necessary)**
     - Requiring the bookie to **commit to all bets before learning outcomes** isn’t just a bump-shift—it’s **essential**. This enforces information symmetry and isolates the exploit to *logical inconsistency* in your credences.  
     - Example: If you assign *P*(A) = 0.6 and *P*(¬A) = 0.6 (violating additivity), a bookie can offer two bets *simultaneously*:  
       - Bet 1: Pays $1 if A, costs you $0.60.  
       - Bet 2: Pays $1 if ¬A, costs you $0.60.  
       You accept both (fair by your lights), but pay $1.20 to win $1 max—a sure $0.20 loss.  
     - This exploit **only works if the bookie lacks foreknowledge**. With asymmetric information, the loss isn’t "sure" from *your* perspective.

  ### 4. **What This Costs: The DBA’s Limited Scope**
     - **You pay two things:**  
       - **Normative Assumption:** The DBA assumes that being vulnerable to a sure loss under information symmetry is irrational. This isn’t derived—it’s the argument’s foundation. If you reject this, the DBA fails. But this assumption is plausible: it means your beliefs shouldn’t *self-sabotage*.  
       - **Scope Restriction:** The DBA only establishes **synchronic coherence** for a fixed set of propositions. It doesn’t address:  
         - Logical omniscience (you needn’t know all truths).  
         - Updating (e.g., via Bayes’ rule).  
         - Practical decisions beyond betting.  
     - **What Survives:** A powerful argument that probabilistic credences are **necessary to avoid pragmatic self-contradiction** (accepting bets you see as fair while guaranteeing a loss). This is still a *normative* result—not just a representation theorem—because it ties rationality to avoiding exploitable dispositions.

  ### 5. **Broader Implications for Probabilism**
     - **DBA isn’t the only path.** Even if you abandon the DBA, probabilism can be defended via:  
       - **Accuracy Arguments**: Non-probabilistic credences are *accuracy-dominated* (e.g., Pettigrew).  
       - **Axiomatic Approaches**: Probability axioms as consistency constraints (e.g., Cox’s theorem).  
     - **Normative Bite Isn’t "Smuggled."** The DBA explicitly argues that *instrumental rationality* (avoiding sure losses) requires probabilism. This isn’t hidden—it’s the engine of the argument.

  ### In Short
  Reject **step (3)**. The DBA requires information symmetry to isolate incoherence as the defect. This preserves (1)’s conclusion—incoherent credences *are* irrational because they force you into pragmatically inconsistent dispositions—without demanding omniscience or collapsing into vacuity. The cost is accepting a limited but defensible link between consistency, fairness judgments, and rationality under conditions of symmetric ignorance. This still gives probabilism substantive normative force, grounded in the avoidance of self-inflicted sure losses.
