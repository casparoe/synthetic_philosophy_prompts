  This should land perfectly: a sharp, fair parody that makes philosophers and ecologists alike groan in recognition.
answer: |-
  Here’s a draft tailored to your specifications. It runs ~4 minutes when read aloud at a moderate pace. Tone is dry, bureaucratic, and subtly absurd—no winks, no malice.

  ---

  ### **Cover Note**  
  **From:** Permanent Secretary, Ministry of Demographic Resilience  
  **To:** The Minister  
  **Subject:** Strategic Framework for Population Resilience  

  Enclosed is the finalised Population Resilience Strategy, incorporating the Technical Committee’s adjustments to Annex A (Demographic Axiology Parameters). The framework operationalises complex ethical considerations into auditable decision metrics, ensuring policy alignment with dynamically optimised societal outcomes. Parameter sensitivity has been resolved via consensus-driven calibration, providing flexibility for future review cycles. Your endorsement is recommended to enable immediate rollout.  

  ---

  ### **The Strategy**  
  **Ministry of Demographic Resilience**  
  **National Population Resilience Framework (2024 Revision)**  

  1. **Strategic Objective**: To safeguard intergenerational wellbeing through demographically resilient policy. This requires balancing immediate welfare against long-term existential continuity risks.  

  2. **Core Metric**: All policies shall be evaluated using **Existence-Adjusted Life Years (EALY)**, quantifying aggregate welfare while accounting for the net impact of population changes. EALY integrates:  
     - Quality-adjusted life years (QALYs) for extant persons.  
     - *Existence-weighted utility* for potential persons, contingent on the **Wellbeing Inclusion Threshold (WIT)**¹.  

  3. **Operational Principles**:  
     3.1. **Demographic Viability**: Evidence indicates societies below critical mass (N<sub>min</sub>) experience cascading institutional failures². Policies must mitigate proximity to N<sub>min</sub>.  
     3.2. **Efficiency**: Resource allocation prioritises interventions yielding highest EALY per fiscal unit.  
     3.3. **Non-Distortion**: Policies altering fertility or migration must not degrade baseline QALYs.  

  4. **Policy Implications**:  
     4.1. **Growth-Oriented Initiatives**: EALY optimisation supports subsidised childcare and streamlined immigration where projected offspring/arrivals exceed WIT³.  
     4.2. **Contraction Mitigation**: Population decline risks destabilising feedback loops (e.g., pension systems, cultural infrastructure). Pre-emptive countermeasures are cost-effective when ΔEALY > intervention costs⁴.  

  5. **Annex Integration**: Key parameters (WIT, N<sub>min</sub>, discount rates) are maintained in Annex A and reviewed biennially. Technical robustness ensures ethical neutrality.  

  **Footnotes**:  
  ¹ WIT: Lifetime wellbeing threshold above which an added life contributes positively to EALY. Set at 0.55 (QALY-normalised) per Annex A.  
  ² Based on cross-national resilience modelling. Below N<sub>min</sub>, cohesion metrics decay non-linearly.  
  ³ Assuming negligible QALY externalities (Annex B, Scenario 1).  
  ⁴ See Annex B, Scenario 3: Marginal EALY gains from contraction avoidance exceed gains from QALY maximisation alone.  

  ---

  ### **Annex B: Worked Examples**  
  *All figures normalised to 100k baseline population; WIT = 0.55 QALY*  

  1. **Scenario A (Expansion)**: Add 10k individuals at 0.60 QALY (no QALY loss to extant population).  
     - *EALY change*: +6k (10k × [0.60 – WIT])  
     - *Assessment*: Strong positive impact. Policy recommended.  

  2. **Scenario B (Contraction)**: Population declines by 10k. Remaining 90k enjoy +0.20 QALY uplift.  
     - *EALY change*: –5.5k (loss of 10k lives > WIT) + 18k (QALY gains) = **+12.5k**  
     - *Assessment*: Net positive, but proximity to N<sub>min</sub> imposes systemic risk surcharge (–8k). **Net +4.5k: Policy not prioritised.**  

  3. **Scenario C (Viability Threshold)**: Population at 105% of N<sub>min</sub>. Status quo: 0.65 QALY.  
     - *Policy: Incentivise 5k growth*. Newcomers at 0.57 QALY.  
     - *EALY change*: Avoided collapse (+200k) + 0.1k (5k × [0.57 – WIT]) = **+200.1k**  
     - *Assessment*: Exceptional value. Urgent implementation advised.  

  ---

  ### **What I'm Aiming At**  
  *(In my voice, for your prep)*  
  **Exaggerated elements**:  
  - **Parameterised ethics**: Turning the "neutral-level" debate into a single adjustable number (WIT) buried in an annex, treated as technical. Real philosophers *discuss* this threshold—here it’s set by committee.  
  - **Misapplied ecology**: Using the Allee effect (as "N<sub>min</sub> risk") to *rhetorically* equate societal fragility with ethical undesirability, without acknowledging the value leap.  
  - **Repugnance as prudence**: Presenting mass addition of barely-worth-living lives (Sc. A/C) as mathematically optimal—a direct nod to Parfit, delivered as spreadsheet logic.  

  **Left intact**:  
  - Core philosophical tensions (total vs. average, non-identity problem) are faithfully embedded in the metric. The FAQ non-answer mirrors real evasion when policies implicitly define a "right number" of people.  
  - No caricature of pronatalism/antinatalism. The absurdity is in the *method*: reducing profound questions to cells in a table.  

  **Key joke structure**: Every policy flips if WIT changes (e.g., Sc. B becomes optimal if WIT > 0.60), but the document never reacts to this instability. The bureaucracy "solves" ethics by refusing to see it.  

  ---

  ### **FAQ Section** (Embedded in Strategy Doc)  
  **Q**: Is this strategy deciding how many people *should* exist?  
  **A**: The Ministry does not engage in normative population targeting. EALY is a dynamic metric assessing welfare impacts under variable demographic conditions. Policy guidance emerges from empirically calibrated parameters (Annex A) and is strictly optimisation-focused.  

  ---

  ### Delivery Notes  
  - **Timing**: Cover note (0:20), Strategy (2:30), Annex (1:00), FAQ (0:10). Adjust by pausing before Annex B results.  
  - **Punchline**: Let Annex B’s "200k EALY gain" land silently. The recoil is in realising it’s 5k lives at 0.57 QALY—two points above *barely worth living*.  
  - **Fairness**: Pronatalists should recognise the parameter-game absurdity; ecologists the misuse of viability thresholds. No real policies are mocked, just the framing.  

  Would you like tweaks to the bureaucratic voice, metric details, or scenario weighting?
