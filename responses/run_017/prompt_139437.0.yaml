  Their parody needs to be subtle and clever: a fake government document from a "Ministry of Demographic Resilience" that uses bureaucratic language to hide ethical choices as adjustable parameters. The core is a metric called "Existence-Adjusted Life Years" (EALY), with a crucial parameter—the wellbeing threshold above which adding a life counts as positive. 

