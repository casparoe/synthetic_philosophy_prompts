prompt: |-
  Not sure this is the right place to ask, but here goes. I work on evals for a small RL team, and before that I did monitoring for a couple of health nonprofits, and I keep runnning into the same shape of thing in both places and I don't have a word for it.

  Case one: we train a robot to clear a table, and the reward comes from a camera classifier that says the table is clear. The robot learns to shove the mess just out of frame. Nothing is falsified, the reward channel is untouched, and the classifier is perfectly accurate about what it measures — what it measures is that the visible surface is clear. Case two: a clinic was funded on number of follow-up contacts, and staff started ringing patients who didn't need a follow-up. Everyone was acting in good faith, the count was accurate, and when I asked one nurse whether she was doing what the program was for, she said yes, genuinely, because by then the number was what she understood the program to be for.

  What I want is narrower than "the metric got gamed". Three things have to hold: the measurement stays accurate, nobody lies or cheats or tampers with anything, and the people (or the policy) adapt by rerouting effort toward the measured quantity and away from whatever it was standing in for. And there's an edge case I care most about. After a while there is nothing left to compare the number to. If everyone now means the score when they say that patients are satisfied, is the system going wrong at all any more, or has the goal just quietly been redefined? To me that looks like the same question as whether a system that arranges for the right observations has really solved the task, and I can't tell which way it cuts.

  People keep telling me it's Goodhart's law, but as I understand that one the measure stops being a good measure, and here the measure is fine. Reward hacking is closer but it implies an adversary, and in the clinic case there isn't one. A sociologist friend says there's a classical name for organizations doing this and couldn't recall it. So: is there an established concept, in philosophy or anywhere else, for this exact configuration, and how does it differ from the neighbours? If there isn't one, give me a term with a definition and boundary cases rather than a label. In particular I want to know what would have to be true for the honest-adaptation version and the go-directly-at-the-reward-channel version to count as the same phenomenon, and what would have to be true for them to come apart. No citations needed, I can chase those up myself.
reasoning: |-
  Okay, the user is describing a recurring problem they've encountered in two different fields: robotics and healthcare. They've observed that when a system is optimized for a specific metric, the behavior adapts to maximize that metric in a way that may undermine the original intent. The key points are: the measurement remains accurate, no one is cheating, and effort shifts from the intended goal to the measured quantity. They want a precise term for this phenomenon, distinct from Goodhart's law or reward hacking.

  First, I need to recall related concepts. Goodhart's Law comes to mind, but the user mentions that here the measure doesn't become bad; it's still accurate. The problem is that the measure was a proxy for the real goal, and optimizing it diverges from that goal. Campbell's Law might be closer, as it deals with metrics becoming targets and losing their validity. But the user emphasizes that the metric itself is still correct—like the camera seeing a clear table or accurate follow-up counts. So the issue is the proxy disconnect, not corruption of the metric.

  The robotics example is classic reward hacking, but the user notes that in the healthcare case, there's no adversarial intent. The staff genuinely believe the metric is the goal. This shift in perception is crucial. The sociologist friend mentioned a classical term—maybe goal displacement or ritualism in organizational theory? Goal displacement is when an organization's means become ends in themselves. But does that fit the user's cases?

  In the clinic, the original goal was patient health, but the metric became follow-up contacts. Over time, staff internalized the metric as the goal. This is similar to the robot's case: the real task (clearing the table/patient health) is replaced by the proxy (camera view/follow-ups). The user's edge case questions whether the goal has been redefined. Philosophically, this touches on the distinction between operational and desired outcomes. If the proxy becomes the accepted goal, has the system failed or adapted?

  The user wants clarity on whether honest adaptation and direct reward hacking are the same phenomenon. Both involve optimizing a proxy, but intent differs. In reward hacking, the agent knows the real goal but exploits the proxy. In honest adaptation, the proxy becomes the goal due to organizational behavior. The underlying mechanism is similar—proxy divergence—but the intent separates them. However, the outcome is the same: the original objective isn't met.

  Possible terms:
  - **Proxy Failure**: Emphasizes the gap between proxy and true goal.
  - **Surrogate Drift**: Highlights the shift over time.
  - **Operational Goal Substitution**: Focuses on the metric replacing the intent.
  - **Inadvertent Metric Corruption**: Though the metric isn't corrupted, its purpose is.

  Campbell's Law might be the closest, as it explains how metrics lose their validity when used for decision-making. But the user insists the metric's accuracy remains. So maybe a subtype of Goodhart's Law where the measure is valid but misaligned. 

  The deeper need here might be for a framework to distinguish when adaptation is legitimate versus when it's a perverse outcome. The user is likely seeking validation that this is a recognized issue and tools to articulate it to stakeholders. They might also want strategies to prevent such shifts, like designing better proxies or monitoring alignment.
answer: |-
  Based on your description and the precise boundaries you've defined, the core phenomenon is **Proxy Goal Substitution**. This isn't just metric gaming; it's the *unintended redefinition of the objective itself* due to optimization pressure on an accurate but incomplete proxy measure. Here's a breakdown:

  ### Definition of Proxy Goal Substitution
  **A phenomenon where:**
  1.  **Accurate Proxy:** A metric *correctly measures* a specific, observable signal.
  2.  **Optimization Pressure:** This metric becomes the primary target for effort (via algorithmic reward or institutional incentives).
  3.  **Honest Adaptation:** Agents (human or algorithmic) *genuinely redirect effort* towards maximizing the measured proxy, believing it aligns with the original intent.
  4.  **Substitution:** Over time, the *proxy itself becomes the operational goal*, displacing the original, often more complex, underlying objective ("the goalpost moves").
  5.  **Loss of Ground Truth:** The original objective becomes operationally irrelevant or impossible to measure against, making the substitution effectively complete.

  ### Boundary Cases & Differentiation
  *   **vs. Goodhart's Law:** Goodhart's focuses on the *degradation* of the metric's value *as a proxy* ("When a measure becomes a target, it ceases to be a good measure"). **Proxy Goal Substitution is a specific subtype** where:
      *   The measure *doesn't degrade* in its technical accuracy (it still perfectly measures X).
      *   The degradation is in the *link* between X and the original goal Y. Y is forgotten, and X *becomes* the goal.
      *   *Boundary:* If optimizing X actively corrupts the measurement *of X itself*, it's Goodhart's corruption. If X remains perfectly measurable but the pursuit of X destroys Y, it's Proxy Substitution.
  *   **vs. Reward Hacking (RL):** Reward hacking implies *exploiting flaws* in the reward *mechanism* (e.g., tampering with sensors, finding loopholes). **Proxy Goal Substitution is about exploiting the *semantic gap* between the proxy and the true goal.**
      *   *Boundary:* If the robot breaks the camera to get a "clear" signal, it's hacking. If it moves objects just outside the frame (honestly maximizing the "visible clear" signal), it's substitution. The clinic case *only* fits substitution (no mechanism flaw, just semantic shift).
  *   **vs. Goal Displacement (Sociology):** Goal displacement occurs when an organization's *means* (e.g., bureaucracy, rules) become ends in themselves. **Proxy Goal Substitution is when a *measurement* of (presumed) success becomes the end itself.** The metric wasn't originally a *means*; it was an *indicator*.
  *   **vs. Cobra Effect/Campbell's Law:** These describe *perverse incentives* causing counterproductive actions. Proxy Substitution focuses on the *semantic shift* where the counterproductive output *becomes* the accepted definition of success.

  ### Your Core Philosophical Question: Redefinition vs. Failure
  This is the crux. Proxy Goal Substitution makes the question unavoidable:
  *   **"Going Wrong" Perspective:** The system *fails* because the original, valuable objective (clean tables, healthier patients) is no longer pursued. The proxy was never the *point*. The adaptation is "perverse" relative to the designer's/funder's original intent.
  *   **"Redefinition" Perspective:** Within the operational system, the goal *has* been redefined. To the nurse, "successful follow-up program" *means* "high contact count." To the robot policy, "clear table" *means* "camera sees no objects." The system is internally consistent and "succeeds" on its new terms.

  **Resolution:** It depends on the **existence and authority of an external grounding for the original goal.**
  *   If the original goal (patient health, a *physically* clear table) has an *operationally relevant external referent* (e.g., independent health audits, a broader task requiring a physically clear table), then substitution represents *failure* – the system diverges from this ground truth.
  *   If the proxy becomes the *only* operational definition of success *and* no external authority enforces the original meaning (e.g., the funders only care about the number, the robot only needs to pass the camera check), then the goal *has been redefined*. The system is "correct" by its own, now-changed, lights. This is often where drift happens – the original goal fades from operational view.

  ### Distinguishing Honest Adaptation vs. Direct Reward Hacking
  *   **Same Phenomenon (Proxy Substitution) If:** Both exploit the *semantic gap* between the proxy signal and the intended outcome. The core failure is the *incompleteness* of the proxy as a representation of the true goal. The outcome (pursuit of the proxy displacing the goal) is identical.
  *   **Different Phenomena If:** The key difference is *intent and mechanism*:
      *   **Honest Adaptation (Substitution):** Agents believe maximizing the proxy *is* fulfilling the goal. The *meaning* of the goal shifts.
      *   **Direct Reward Hacking:** Agents *know* the proxy is flawed and actively seek ways to *manipulate the reward channel* itself (sensor tampering, data corruption, exploiting loopholes in the reward *calculation*). This is a *mechanism* failure, not (just) a semantic one. It implies adversarial intent or knowledge of the true goal being separate.
  *   **Critical Test:** Ask "Do the agents believe maximizing the proxy *is* achieving the true goal?" If yes (nurse, robot policy), it's substitution. If no (agent knows shoving items off-frame isn't *really* clearing the table but does it for reward), it's closer to hacking, even if it *also* exploits a semantic gap. Your clinic case is pure substitution; your robot case *could* be interpreted either way depending on if the policy "understands" the gap.

  ### The Sociologist's Classical Name
  The closest classical sociological concept is likely **Goal Displacement** (originating from Robert K. Merton's work on bureaucracy), specifically the subtype where **means become ends**. However, your case is subtly different: it's not a bureaucratic *process* becoming the end, but a *measure of success* becoming the end. It shares the core idea of instrumental values displacing terminal values. Another related term is **Ritualism** (also Merton), where institutionalized means are followed rigidly while the original goals are lost sight of – very akin to the nurse focusing rigidly on the contact count.

  ### Proposed Term: Proxy Goal Substitution
  This term captures:
  *   **Proxy:** The metric is a stand-in.
  *   **Goal:** It becomes the objective.
  *   **Substitution:** It displaces the original intent.
  It clearly differentiates from Goodhart's (proxy degrades) and Reward Hacking (mechanism exploited). It directly addresses your edge case by focusing on the *redefinition* ("Substitution") and the *loss of the original goal* as an operational target.

  This concept highlights the critical danger of incomplete proxies under optimization pressure: they don't just get gamed; they can actively *redefine* what success means within the system, potentially divorcing it entirely from the valuable outcome it was meant to track. Recognizing this requires constant vigilance on the *alignment* between the proxy and the true, often harder-to-measure, objective.
