prompt: |-
  I'm writing the take-home final for a graduate seminar on scalable oversight, and I need one question on AI safety via debate that can't be answered by restating the two-debater, one-judge protocol and the claim that it is easier to spot a single false step than to produce a whole sound argument. Build the question on the following variant instead.

  Suppose that at each decision point, alongside the transcript, the judge receives a cheap verdict on the sub-claim in dispute from a weaker model, call it W. W agrees with the truth 95 percent of the time on easy sub-claims and 70 percent on hard ones, its verdicts are not visible to the debaters, and the debaters themselves are sampled from the same model family as W, so they can predict a nontrivial share of W's errors. The question to put to students: does handing the judge this signal make the protocol more reliable, under what conditions does it help, and when does it actively hurt?

  Please write the question itself, a model answer of about 600 words, and a marking scheme worth 20 marks built on four must-hit points, with the marks for each and a one-line note on how students typically go wrong on each. The item should be doable in roughly 30 minutes of a three-hour exam by students who already know the standard protocol. I want the scheme to reward at least these moves: separating the case where W's errors are conditionally independent of how plausible an argument looks from the case where they are not; noticing that debaters optimize against the judge's entire decision rule, so W becomes part of the training signal and can be gamed rather than merely consulted; explaining why the judge's freedom to ignore W in principle does not settle what happens in equilibrium; and stating what would have to be true for W to help even when the honest debater is the stronger arguer.
reasoning: |-
  We are creating an exam question about a variant of the AI safety via debate protocol, where the judge receives a "cheap verdict" from a weaker model W on the sub-claim in dispute. The question should not be answerable by just restating the standard protocol. The model answer should cover the specified moves and the marking scheme should include four must-hit points.

  Question:
  Consider a variant of the AI safety via debate protocol in which, at each decision point in the debate, the judge (in addition to the debate transcript) receives a cheap verdict on the sub-claim currently in dispute from a weaker model W. Model W agrees with the truth 95% of the time on easy sub-claims and 70% of the time on hard ones. The debaters are sampled from the same model family as W (so they can predict a nontrivial share of W's errors), and they do not observe W's verdict. Under what conditions does providing the judge with this additional signal from W make the protocol more reliable? When might it actively hurt? Justify your answer by analyzing the strategic incentives of the debaters and the judge's decision-making process.

  Model Answer (approx. 600 words):

  The introduction of the weak model W as an additional signal to the judge in the debate protocol can both help and harm reliability, depending on the nature of W's errors and the strategic behavior of the debaters. Since the debaters are from the same model family as W, they can anticipate W's likely verdicts, including its errors. This allows them to tailor their arguments not only to the judge but also to the expected behavior of W, even though they don't see W's actual verdict.

  First, consider when W's errors are conditionally independent of the plausibility of an argument given the truth. That is, W's mistakes are random and not systematically related to how convincing an argument is. In this case, the judge can use W's verdict as an independent source of information. Because the judge is free to ignore W, they can treat W's verdict as a noisy but unbiased signal. The debaters, knowing that the judge has this extra signal, might be less inclined to push implausible arguments because W might randomly contradict them. This can make lying harder, especially when the true answer is easy and W is highly accurate. Thus, in this scenario, W's signal can provide a modest boost to reliability.

  However, the situation changes when W's errors are correlated with argument plausibility. For instance, if W is more likely to make errors when the deceptive argument is particularly slick or when the honest argument is hard to articulate, then the debaters can exploit this. The dishonest debater, anticipating W's weaknesses, might choose to dispute sub-claims where W is known to be unreliable (e.g., hard sub-claims) and craft arguments that are designed to manipulate W's specific failure modes. Since the debaters can predict W's errors, they can game the system by pushing arguments that are likely to cause W to err in their favor. In this case, the dishonest debater might deliberately choose a line of argument that is both misleading to the judge and likely to induce a false verdict from W. This could make the protocol less reliable.

  Crucially, the judge's freedom to ignore W does not prevent gaming in equilibrium because the debaters optimize against the entire decision rule of the judge, including how the judge uses W. If the judge sometimes relies on W, even minimally, then the dishonest debater will adjust their strategy to account for W. This can lead to an equilibrium where the judge is effectively swayed by W's verdict when it is convenient for the dishonest debater. Moreover, the honest debater might be forced to defend positions that are disfavored by W (even when true) if W is more likely to err against the truth in a particular context. This could make the honest strategy less appealing and thus less likely to be chosen by the debater.

  For W to help even when the honest debater is the stronger arguer, we would need a scenario where W's errors are conditionally independent of the debate arguments and the truth, and the judge can effectively combine the debate with W's signal to reduce the error rate. However, given that the debaters are from the same family as W, they can predict and thus exploit any systematic errors. Therefore, independence is difficult to guarantee. Alternatively, if the judge uses W only as a tie-breaker when the debate is very close, and if the dishonest debater cannot reliably force such close debates on false sub-claims, then W might help without being too gameable. But this requires that the judge's policy for using W is robust and that the debaters cannot predict when the judge will rely on W.

  In summary, the additional signal from W helps when:
  1. Its errors are conditionally independent of the debate arguments (so it provides genuinely new information), and
  2. The judge uses it in a way that does not create new vulnerabilities (e.g., by being too reliant on it for hard sub-claims).

  It actively hurts when:
  1. W's errors are predictable and correlated with the types of arguments that the dishonest debater can produce, leading to exploitation, and
  2. The presence of W causes the judge to discount strong honest arguments that W mistakenly contradicts, thereby weakening the honest debater's position.

  Thus, the overall effect depends on the error structure of W and the judge's ability to mitigate gaming by strategically weighting W's input.

  Marking Scheme (20 marks total):

  1. Separation of cases based on conditional independence of W's errors (5 marks)
     - Students must distinguish between the case where W's errors are conditionally independent of the argument plausibility and the case where they are correlated. 
     - Common mistake: Failing to define conditional independence appropriately or not recognizing that correlation enables gaming.

  2. Recognition that debaters optimize against the entire decision rule, making W part of the training signal and thus gameable (5 marks)
     - Students must note that the debaters (especially the dishonest one) will adjust their strategies to account for W's expected verdict because they can predict it, and this can lead to gaming.
     - Common mistake: Treating W as an external oracle that cannot be influenced, ignoring that debaters can anticipate and exploit W.

  3. Explanation of why the judge's freedom to ignore W does not prevent gaming in equilibrium (5 marks)
     - Students must explain that because the debaters form strategies based on the entire decision rule (including how the judge uses W), even a small reliance on W can be exploited, leading to a shift in the equilibrium strategies.
     - Common mistake: Arguing that because the judge can ignore W, the debaters won't bother gaming it.

  4. Statement of conditions under which W helps even when the honest debater is the stronger arguer (5 marks)
     - Students must state that for W to help in such a scenario, either (a) W's errors must be conditionally independent of the debate and truth, and the judge must use W appropriately (e.g., as a tie-breaker), or (b) the dishonest debater cannot reliably force situations where W's errors are exploitable. They should note that conditional independence is difficult because of shared model family.
     - Common mistake: Overlooking the possibility of using W as a tie-breaker or failing to acknowledge the difficulty of independence given the shared model family.

  The answer should be structured and cover these points. Partial credit can be given for partial answers within each point.
answer: |-
  ### Exam Question: AI Safety via Debate with Weak Model Verdicts
  **Context:** In a variant of AI safety via debate, at each decision point, the judge receives a debate transcript and a cheap verdict on the sub-claim in dispute from a weaker model **W**. **W** agrees with the truth 95% of the time on easy sub-claims and 70% on hard ones. **W**'s verdicts are hidden from debaters. Debaters are sampled from **W**'s model family and can predict a nontrivial share of **W**'s errors.  

  **Question:**  
  Does providing the judge with **W**'s verdicts improve the reliability of the debate protocol? Analyze under what conditions this variant enhances reliability, when it may harm reliability, and why. Address:  
  1. How the conditional dependence between **W**'s errors and argument plausibility affects outcomes.  
  2. Why debaters' ability to game **W** (despite not seeing its verdicts) impacts equilibrium behavior.  
  3. Why the judge’s freedom to ignore **W** does not prevent gaming.  
  4. What must be true for **W** to help even when the honest debater is the stronger arguer.  

  ---

  ### Model Answer (600 words)  
  Providing the judge with weak model **W**’s verdicts can improve reliability under specific conditions but may harm it when **W**’s errors are gameable by debaters. The outcome hinges on the conditional dependence of **W**’s errors, debaters’ strategic incentives, and equilibrium dynamics.  

  **1. Conditional independence of W’s errors is crucial for reliability.**  
     - If **W**’s errors are *conditionally independent* of argument plausibility (i.e., **W**’s mistakes are random and uncorrelated with how convincing a lie appears), **W**’s verdict acts as a noisy but unbiased signal. For example, on easy sub-claims (95% accuracy), **W**’s input reduces the judge’s error rate by breaking ties or corroborating evidence. Here, reliability improves because the judge gains an independent information source.  
     - However, if **W**’s errors are *conditionally dependent* (e.g., **W** is more likely to endorse slick false arguments or reject valid but counterintuitive truths), reliability suffers. Debaters from **W**’s family can predict these systematic errors. A dishonest debater might push arguments that *exploit **W**’s known biases* (e.g., favoring simple-but-wrong claims on hard sub-claims), increasing the risk of the judge being misled by both the debater and **W**’s correlated errors.  

  **2. Debaters game W by optimizing against the judge’s decision rule.**  
     Though debaters cannot see **W**’s real-time verdicts, they share its model family and can anticipate its common failures. Thus, **W**’s behavior becomes part of the *training signal* for debaters during training. A dishonest debater will:  
     - Select sub-claims where **W** is weak (e.g., hard sub-claims with 30% error rates) and craft lies that align with **W**’s predictable errors.  
     - Force disputes into "exploitable zones" where **W**’s verdicts are likely to backfire (e.g., if **W** often confuses technical truths, the debater promotes plausible-seeming falsehoods).  
     This gaming makes **W**’s verdicts actively harmful when errors are dependent, as the dishonest debater weaponizes **W** against the judge.  

  **3. The judge’s freedom to ignore W does not prevent gaming in equilibrium.**  
     While the judge *can* disregard **W**, debaters strategize against the judge’s *aggregate* decision rule, which includes potential reliance on **W**. In equilibrium:  
     - Judges may develop heuristics that weight **W**’s verdict when arguments are ambiguous (e.g., on hard sub-claims).  
     - Debaters preempt this by making arguments *appear* ambiguous to trigger **W**’s involvement, then exploiting its biases.  
     Thus, even minimal judge reliance on **W** reshapes debater incentives. The dishonest debater’s best response is to manipulate the entire system, not just the transcript.  

  **4. For W to help when the honest debater is stronger, errors must be independent and unexploitable.**  
     **W** can still assist the honest debater (who provides sound arguments) if:  
     - **W**’s errors are *conditionally independent* of argument plausibility and truth (e.g., **W** errs randomly due to noise, not bias).  
     - The judge uses **W** conservatively (e.g., only when debates are very close or **W**’s confidence is high).  
     - Debaters cannot reliably steer disputes into high-error contexts (e.g., if hard sub-claims are rare).  
     In this case, **W** breaks deadlocks in favor of truth without giving dishonest debaters consistent exploitation avenues.  

  **Conclusion:**  
  **W** improves reliability only when its errors are conditionally independent and hard to exploit. It harms reliability when errors are dependent and debaters game the system by predicting and inducing **W**’s mistakes. The judge’s flexibility is insufficient to deter gaming because debaters optimize against the *expected* decision rule. Thus, **W**’s utility depends on error structure and debaters’ ability to force adversarial equilibria.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points, marks, and common mistakes:**  

  1. **Conditional independence vs. dependence of W’s errors** (5 marks)  
     - *Hit:* Distinguishes independent errors (helps) from dependent errors (harms) and links to argument plausibility.  
     - *Common mistake:* Claims W always helps due to accuracy, ignoring conditional dependence.  

  2. **Debaters game W by optimizing against the judge’s full decision rule** (5 marks)  
     - *Hit:* Explains debaters predict W’s errors (same model family) and tailor arguments to exploit them.  
     - *Common mistake:* Asserts W cannot be gamed since debaters don’t see verdicts, overlooking anticipatory strategies.  

  3. **Judge’s freedom to ignore W doesn’t prevent gaming in equilibrium** (5 marks)  
     - *Hit:* Notes debaters strategize against expected judge behavior (including potential W use), altering equilibrium.  
     - *Common mistake:* Argues judge discretion neutralizes gaming, neglecting that incentives shift preemptively.  

  4. **Conditions for W to help when honest debater is stronger** (5 marks)  
     - *Hit:* States W’s errors must be independent and unexploitable (e.g., judge uses W sparingly, errors are random).  
     - *Common mistake:* Omits independence or assumes W helps unconditionally if honest arguments are strong.  

  **Note:** Award partial marks for incomplete but relevant analysis (e.g., 3/5 for partial condition descriptions).  
  **Time guideline:** ~30 minutes (succinct analysis of all four points required).
