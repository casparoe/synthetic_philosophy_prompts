answer: |-
  ## On Knowledge's Claim

  When mortals speak, they stake a claim aloud,
  Yet "This is so, but know it not" rings strange,
  A dissonance that jars the listening crowd,
  A fracture where no solid truths arrange.
  If challenged, "I believed!" won't mend the tear,
  Nor shield the speaker from the owed reply.
  'Tis *knowledge* sought, held up for all to hear,
  The ground on which assertions live or die.
  True words alone won't lift the burden's weight
  When how they're known is shrouded, lost, obscure;
  The speaker stands accountable by fate
  For warrant's light, for proof both sound and sure.

  **Yet picture this:** a source, secure and right,
  Knows *P* by proof she *must* keep out of sight
  (Sealed testimony, locked from mortal view).
  She tells it plain to one who *knows* it's false,
  Whose own strong proofs against the current pull,
  Who cannot ask, "From whence springs this report?"
  Is this assertion then a rightful act?
  Or merely blameless, though a fractured pact—
  A tainted warrant, leaving trust unbuilt?
  Does reason stir within the hearer's thought,
  Or does suspicion grip where truth was sought?

  A rule breached brings the license to condemn;
  This norm's a **light** unmet, though blameless them.

  ---

  **Notes on Execution:**

  *   **Octave (LL 1-8):** Builds the case via phenomena: the Moorean Paradox ("This is so, but know it not"), the inability to retreat to mere belief ("I believed!"), and the demand for knowledge as the standard ("*knowledge* sought", "warrant's light").
  *   **Volta (L 9: "Yet picture this:"):** Introduces the original counterexample: a source knowing via unimpeachable but undisclosable means (sealed testimony), asserting to a hearer with strong counter-evidence and no way to verify.
  *   **Sestet (LL 9-14):** Explores the pressure on the norm: questioning permissibility ("rightful act?"), defectiveness without blame ("blameless, though a fractured pact"), and whether it provides reason ("Does reason stir... Or does suspicion grip?").
  *   **Closing Couplet (LL 13-14):** Turns on the key distinction: contrasting a breachable rule inviting blame ("license to condemn") with a standard of correctness ("light") that an assertion can blamelessly fail to meet ("unmet, though blameless them").
  *   **Form:** Strict Shakespearean sonnet (ABABCDCDEFEFGG), iambic pentameter.
  *   **Voice:** Defender of the Knowledge Norm, arguing through the poem's progression and the implications drawn.
  *   **Accuracy:** Addresses core phenomena, the specific counterexample, and the crucial normative distinction without resorting to slogans or common textbook cases.
