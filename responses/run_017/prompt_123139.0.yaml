answer: |-
  **Form IC-4: Declaration of Conversational Implicature**
  **Bureau of Utterer's Meaning (BUM)**
  **Department of Cooperative Compliance (DCC)**
  **Filing Period:** Per Utterance / Per Conversational Exchange (Circle One)
  **Purpose:** To assess and close the Grice Gap (defined as the quantifiable surplus of conveyed meaning over literal semantic content) arising from covered utterances.

  **Section 1: Declaration of Particulars**
  *   **1.1 Declarant (Speaker):** _________________________ (Full Legal Designation)
  *   **1.2 Utterance Date/Time:** ____/____/____ __:__ AM/PM (Precision required; see Cancellation Rider Sec. 7)
  *   **1.3 Context of Utterance (Locution):** _________________________________________________________
      *   *(Describe setting, participants, preceding discourse. Attach separate sheet if necessary, Form IC-4a)*
  *   **1.4 Literal Semantic Content (LSC) of Utterance:** _______________________________________________
      *   *(Verbatim reproduction of what was "said." Do NOT paraphrase or interpret.)*
  *   **1.5 Reported Grice Gap (Implicature):** _________________________________________________________
      *   *(State *exactly* the meaning you assert was conveyed beyond the LSC in 1.4)*

  **Section 2: Classification of Implicature**
  *(Check ONE box only. Misclassification may result in penalties or referral.)*

  *   **[ ] 2.1 Particularized Conversational Implicature (PCI)**
      *   *Definition:* Meaning conveyed *specifically* based on the unique context (Sec. 1.3) and presumed cooperation.
      *   ***REQUIRES COMPLETION OF SECTION 4 (Narrative Explanation) AND SECTION 5 (Reconstructed Calculation).***
  *   **[ ] 2.2 Generalized Conversational Implicature (GCI)**
      *   *Definition:* Meaning conveyed *routinely* absent specific contextual counter-indicators (e.g., "some" implying "not all").
      *   ***FLAT RATE ASSESSMENT APPLIES.*** See Schedule G (Pre-printed Rates) attached. No Sec. 4 or 5 required. *(Note: Disputes regarding GCI applicability subject to Bureau Auditor discretion)*
  *   **[ ] 2.3 Conventional Implicature (CI)**
      *   *Definition:* Meaning attached by convention to specific words/constructions (e.g., "but", "therefore", "even").
      *   ***STAMPED: NOT OUR JURISDICTION. REFER TO OFFICE OF LEXICAL CONTENT (OLC).*** *Do not proceed. Submit OLC Form L-7.*

  **Section 3: Maxim Exploitation Declaration**
  *(Indicate the presumed Maxim of Conversation (Quantity, Quality, Relation, Manner) exploited to generate the Grice Gap declared in Sec. 1.5. Check ALL applicable categories of exploitation.)*

  *   **3.1 Maxim Presumed Exploited:**
      *   [ ] Quantity (Make your contribution as informative as required; Do not make more informative than required)
      *   [ ] Quality (Do not say what you believe false; Do not say that for which you lack evidence)
      *   [ ] Relation (Be relevant)
      *   [ ] Manner (Avoid obscurity, ambiguity; Be brief, orderly)

  *   **3.2 Category of Exploitation:**
      *   **[ ] Flouting:** Openly and ostentatiously failing to fulfill the Maxim, intending the hearer to recognize this and infer the implicature. *(Warning: High audit risk due to overt nature.)*
      *   **[ ] Violating:** Covertly failing to fulfill the Maxim, often with intent to mislead. *(Note: Potential referral to DCC Office of Inspector General for deceptive practices.)*
      *   **[ ] Infringing:** Unintentionally failing to fulfill the Maxim due to incapacity, distraction, etc. *(Requires affidavit of incapacity, Form IC-4b.)*
      *   **[ ] Opting Out:** Explicitly or implicitly suspending the Cooperative Principle for this utterance. *(See Sec. 8: Constructive Cooperation Doctrine - Proceed with caution.)*

  **Section 4: Narrative Explanation (Required ONLY for PCI - Box 2.1 checked)**
  *(Describe step-by-step how a reasonable hearer, operating under the Cooperative Principle and aware of the context (Sec. 1.3), could reasonably infer the reported Grice Gap (Sec. 1.5) from the LSC (Sec. 1.4) and the presumed Maxim exploitation (Sec. 3). Use clear, non-technical language. Attach additional sheets if necessary.)*

  ___________________________________________________________________________________________
  ___________________________________________________________________________________________
  ___________________________________________________________________________________________

  **Section 5: Reconstructed Calculation (Required ONLY for PCI - Box 2.1 checked)**
  *(Formally reconstruct the inferential steps leading from the LSC, context, and exploited Maxim(s) to the reported Grice Gap. Use logical notation or plain English. Demonstrate necessity and calculability.)*

  1.  Premise 1 (LSC): ________________________________________________
  2.  Premise 2 (Contextual Factor): _____________________________________
  3.  Premise 3 (Presumed Cooperative Principle): _________________________
  4.  Premise 4 (Exploited Maxim - Sec. 3.1): ___________________________
  5.  Presumption of Calculability: Hearer recognizes apparent ______ (Flouting/Violating/etc. - Sec. 3.2) of Maxim.
  6.  Inference: Hearer concludes Speaker must intend ______ (Grice Gap - Sec. 1.5) to preserve assumption of cooperation.
  7.  **Declared Grice Gap:** __________________________________________

  **Section 6: Ancillary Forms & Riders**
  *   **6.1 Cancellation Rider (Form IC-4CR):** [ ] Attached
      *   *Purpose:* To declare cancellation of the reported Grice Gap *at the moment of utterance*.
      *   ***WARNING:*** A Cancellation Rider filed *after* the Date/Time declared in Sec. 1.2 is VOID. Honest declarants acknowledging post-utterance realization are advised to file late, accepting penalties. *(Paradox noted: Sec. 9.3)*
  *   **6.2 Non-Detachability Affirmation:** [ ] Check to affirm
      *   *I affirm that the Grice Gap declared in Sec. 1.5 is non-detachable. Any rephrasing preserving the LSC (Sec. 1.4) would carry the same implicature. (BUM Reg. § 45.22a)*
  *   **6.3 Constructive Cooperation Waiver (If Opting Out - Sec. 3.2):** [ ] Attached (Form IC-4CCW)
      *   *Purpose:* To acknowledge that the act of filing this form (an intentional communicative act) may itself constitute cooperation, potentially nullifying the Opt-Out declaration under Sec. 3.2 and creating a *new* Grice Gap related to the filing itself. *(See Sec. 8)*

  **Section 7: Signature & Certification**
  *   **7.1 Declarant Signature:** _________________________________________ Date: ____/____/____
  *   **7.2 Printed Name:** _____________________________________________
  *   **7.3 Certification:**
      *   *I certify under penalty of perjury (DCC Code § 1205) that the information provided on this form is true and correct to the best of my knowledge and belief. I further affirm that I hold the requisite reflexive intention* **(\*See Auditor Note Below\*)** *that the hearer recognize my intention to convey the Grice Gap declared in Sec. 1.5 through their recognition of my exploitation of the Cooperative Principle as indicated.*

  **\*AUDITOR NOTE (Marginalia):** *Reflexive intention check again. Signatory affirms holding "the intention that the hearer recognize my intention..." but the form requires signing *now*, long after utterance. Is this attestation of *past* intention? Can it be verified? Does signing *this* create a *new* reflexive intention about *this* form? Headache. Recommend kicking back to Interpretation Division. - J. Peterson, Sr. Auditor, BUM\**

  ---

  **Section 8: Bureau Notices & Disclaimers**
  *   **8.1 Constructive Cooperation Doctrine (CCD):** The DCC holds that any deliberate communicative act, including the filing of this form or an Opt-Out declaration (Sec. 3.2), inherently constitutes participation in a cooperative exchange governed by the Cooperative Principle. Attempts to fully Opt-Out may generate higher-order implicatures assessable under separate cover. *(CCD established in *BUM v. Silent Taxpayer*, 1981)*
  *   **8.2 Indeterminacy Clause:** The Grice Gap is inherently probabilistic and context-dependent. Two qualified BUM Auditors may independently arrive at differing assessments of the existence, scope, or value of an implicature arising from the same utterance data. The Bureau's assessment shall be final barring clear procedural error. *(BUM Reg. § 10.01f)*
  *   **8.3 Conversion Rule:** Be advised that the act of explicitly stating the Grice Gap within this declaration (Sec. 1.5) may, under certain interpretations and contexts, convert said Grice Gap into part of the *literal semantic content* ("what is said") of *this filing document*. The Bureau disclaims liability for any Grice Gaps generated or destroyed by the completion of Form IC-4 itself. *(Refer to Meta-Implicature Form IC-4M if necessary.)*

  **Section 9: Third-Party Commentary (For Informational Purposes Only - Non Binding)**
  *   **9.1 Dissenting Opinion:** "This is semantic nonsense. The literal content is the *only* assessable meaning. Your 'Grice Gap' is phantoms in the machine, listener projections over which the speaker has no control and for which they bear no declarable responsibility. The Bureau is attempting to tax pragmatics! The Institute for Formal Semantics does not recognize BUM jurisdiction." - *Dr. Elara Finch, Dir., Institute for Formal Semantics*
  *   **9.2 Taxpayer Anecdote:** "I tried cooperating! I said ONLY the literal truth, 'The meeting was attended by some committee members.' They nailed me for implying not all attended! I filed the GCI flat rate, but then *they* implied I was hiding something by *using* 'some'! There's no winning. Next time I just won't speak." - *Anonymous Filier, Case # I83-4472*
  *   **9.3 Bureau Paradox Acknowledgment:** The Bureau recognizes the theoretical tensions inherent in the IC-4 process, notably: (a) The Cancellation Rider's temporal impossibility (Sec. 6.1), (b) The Conversion Rule nullifying the reported object (Sec. 8.3), and (c) The Constructive Cooperation Doctrine preventing true Opt-Out (Sec. 8.1). These are features, not bugs, illustrating the dynamic, non-codifiable nature of conversational meaning which this form, by its very existence, seeks (and inevitably fails) to administrate. Compliance remains mandatory.

  ---
  **Submit completed Form IC-4, all attachments, and applicable fees (see Fee Schedule IC-4F) to:**
  Bureau of Utterer's Meaning, Department of Cooperative Compliance
  P.O. Box 1975
  Meaningville, DC 20500

  **Penalties apply for late filing, misrepresentation, or failure to declare a known Grice Gap.**
  **BUM-PUB-447 (Rev. 04/202X)**
