answer: |-
  This phenomenon is brilliantly dissected, and you're right that it occupies a distinct conceptual space. While no single term is universally settled, the move has been analyzed within specific fields. Here's the carving you requested:

  ### The Established Name & Literature
  The closest established concept is **"Genocide Recognition Avoidance"** or **"Atrocity Label Avoidance"**, often operating through **"Intentionalism as a Shield."** Key literature focuses on:
  1.  **The Genocide Convention's "Intent" Clause:** Scholars like William Schabas (*Genocide in International Law*) and Alexander Laban Hinton (*Annihilating Difference: The Anthropology of Genocide*) extensively analyze the problems of proving "intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such."
  2.  **The "Functionalist" vs. "Intentionalist" Debate in Historiography:** Applied beyond the Holocaust (e.g., debates on Stalinism, colonialism). Functionalists argue outcomes stem from systemic processes/chaos; Intentionalists emphasize central planning/purpose. Your scenario sees actors adopting a *strategic functionalism* regarding intent while conceding outcomes.
  3.  **The Politics of Memory and Denial:** Work by Lawrence Douglas (*The Memory of Judgment*), Eric Markusen & Damir Mirković, and the Journal *Genocide Studies and Prevention* explore how states/narratives contest classification *after* conceding facts, precisely because of the label's weight.
  4.  **"Interpretive Denial" (Stanley Cohen):** While Cohen's *States of Denial* focuses more on denying *meaning* ("it wasn't that bad," "it was justified"), your case is a hyper-specialized subset: conceding meaning (atrocity) but denying *juridical/historical category*. It's **"Categorical Denial"** or **"Taxonomic Denial."**

  ### Proposed Specific Term: **Concessive Reclassification**

  ### Tight Definition
  **Concessive Reclassification** is a rhetorical and argumentative strategy concerning mass atrocities where:
  1.  The speaker **explicitly concedes** the core empirical facts: scale of death/victimhood, state responsibility, non-combatant targeting, and moral reprehensibility.
  2.  The speaker **vigorously disputes** the application of a specific, legally/politically/morally weighty label (e.g., genocide, crime against humanity *as defined by specific intent*) by **narrowly focusing** on contested elements of that label's definition – most commonly the *specific intent* requirement.
  3.  The **concession and refusal are mutually reinforcing**: The admission of horror lends credibility to the speaker's apparent reasonableness and scrupulousness regarding definitions, making accusations of minimization or denial harder to sustain, while simultaneously deflecting the significant practical consequences (legal, reparative, memorial, identity-based) attached to the label.
  4.  The **primary effect** is to shift the debate away from shared empirical ground and the moral/practical implications of the conceded facts, into abstract, definitional, or highly speculative arguments about intent, thereby protecting the rejecting entity (state, ideology, national narrative) from the label's burdens.

  ### Differentiation from Similar Concepts

  1.  **Honest Definitional Scruple:**
      *   *Difference:* Motive and openness. The honest scrupulator genuinely seeks accurate classification based on evidence *and* acknowledges the gravity regardless of label. They actively engage with *all* evidence of intent (context, documents, patterns), not just the absence of a "smoking gun" order. Crucially, **they would readily apply the label *if* sufficient evidence of specific intent emerged**, and they acknowledge the conceded facts carry significant weight *even without* the specific label.
      *   *Test:* Ask: "If definitive evidence proving specific intent surfaced tomorrow, would this speaker accept the label *and* its implications?" The Concessive Reclassifier likely wouldn't, or would find new definitional hurdles.

  2.  **Ordinary Minimization:**
      *   *Difference:* Scope of concession. Minimization directly downplays scale, responsibility, suffering, or moral culpability (e.g., "fewer died," "they were partly responsible," "it was wartime chaos"). Concessive Reclassification *maximizes* the concession on facts/suffering precisely to enable the categorical refusal. It's **maximization to minimize (the label's impact)**.

  3.  **Legitimate Legalistic Argument (Mens Rea):**
      *   *Difference:* Context and purpose. A defense lawyer *in a specific trial* arguing lack of *mens rea* for their *individual client* is performing a necessary, role-bound function within a defined legal process. Concessive Reclassification occurs in *public, historical, or political discourse*, often defending *states or ideologies*, and aims to permanently shield entities from broad moral, legal (e.g., state responsibility under int'l law), and political consequences beyond a specific courtroom. It weaponizes legal technicalities for historical/political exoneration.

  4.  **Mainstream Historical Revision:**
      *   *Difference:* Focus and evidence base. Revisionism re-examines *all* evidence (numbers, causes, responsibility, intent) seeking new interpretations. Concessive Reclassification **starts from maximal concession on empirical facts** and focuses *exclusively* on disputing intent *for the sole purpose of denying the label*. It often selectively dismisses contextual or cumulative evidence of intent that doesn't fit the preferred motive (relocation, security).

  ### Principled Tests for Distinguishing Concessive Reclassification from Honest Scruple
  1.  **The Counterfactual Intent Test:** If conclusive, direct evidence of specific intent were discovered (e.g., a politburo memo stating "We must destroy Group X"), would the speaker:
      *   (Scrupulator) Accept the label and its implications?
      *   (Reclassifier) Dismiss it as misinterpreted, forge new definitional barriers, or downplay its significance?
  2.  **The Weight-of-Facts Test:** Does the speaker acknowledge that the conceded facts (mass killing of civilians by the state) constitute a crime against humanity or carry immense moral/political weight *independent* of the specific genocide label? Or does the denial of the specific label functionally absolve the perpetrator state/ideology of *all* significant exceptional responsibility?
  3.  **The Motive for Motive Test:** Is the argument about intent driven by a meticulous examination of *all* available evidence (including patterns, context, consequences foreseen), or is it primarily focused on explaining away evidence that *could* suggest genocidal intent in order to protect a pre-determined categorical conclusion?
  4.  **The Burden of Proof Stance:** Does the speaker place an impossibly high (often legally unrealistic, like requiring a written extermination order) or shifting burden of proof solely on proponents of the label, despite conceding the state caused massive civilian deaths?

  ### Boundary Cases

  1.  **Clear Instance (Concessive Reclassification):** The Turkish state's position on the Armenian events: Concedes large-scale deaths and suffering during deportations, acknowledges Ottoman responsibility for security failures, but vehemently denies genocide. Argues intent was relocation/security, not destruction. Uses the concession of suffering to portray denial of the label as reasonable historical debate, deflecting demands for recognition, reparations, and its place in national identity. Meets all 4 definition points.
  2.  **Clear Non-Instance (Honest Definitional Scruple / Revisionism):** A historian arguing that the Great Ukrainian Famine (Holodomor) was primarily a consequence of disastrous collectivization policies, bureaucratic incompetence, and crackdown on resistance, exacerbated by natural factors, rather than a *premeditated* plan *specifically aimed* at destroying Ukrainians *as an ethnic group*. They might question the genocide label based on available Politburo records showing food extraction targets focused on regions (including Ukraine) but not explicitly ethnic destruction. Crucially, they: a) Acknowledge the horror and state responsibility for mass death; b) Engage with *all* evidence; c) Would likely accept genocide label if clear evidence of *ethnic-destruction-specific* intent emerged; d) Still condemn it as a monstrous crime against humanity.
  3.  **Undecided Instance (Genuine Grey Area):** The debate over the Bengal Famine of 1943.
      *   *Facts Conceded:* Massive mortality (millions), primarily civilians, due to famine. British colonial policies (resource diversion for war, prioritization, export decisions, administrative failure) were significant contributing factors. Moral catastrophe.
      *   *Label Disputed:* Genocide? Crime against Humanity? Tragedy of war/negligence?
      *   *Why Undecided:* Evidence of intent is highly ambiguous and contextually fraught (war, Japanese threat, complex administration). Arguments about intent (callous neglect? racist indifference? deliberate policy to prioritize war effort over Bengalis? lack of intent to *destroy* Bengalis *as such*?) are central and genuinely contested by serious scholars using available evidence. Neither side can definitively prove/disprove specific genocidal intent beyond reasonable doubt based on current archives. The debate is inherently about classification *and* intent, but the motives of scholars seem primarily historiographical rather than aimed at shielding the UK from specific legal consequences *today* (though national narratives are involved). It sits on the boundary between Concessive Reclassification (if a participant dogmatically denies *any* possibility of genocidal intent despite evidence of extreme callousness potentially meeting some definitions of intent) and unresolved historical debate fueled by incomplete evidence.

  **In essence:** "Concessive Reclassification" is a strategy of **maximizing the concession of horror to minimize the acceptance of the label that carries the real-world consequences, using contested definitions (especially intent) as the shield.** Its core distinction lies in the *mutual reinforcement* of concession and refusal, and its *purpose* of deflecting the label's practical weight while appearing reasonable.
