prompt: |-
  I've been asked to referee an ethics-and-policy working paper, and I need to know how much of its treatment of Good's theorem on the value of information I can let stand. The paper states the result like this:

  "Good's theorem says that information cannot have negative expected value. If you are an expected-utility maximizer who updates by conditionalization, then learning something before you act can only help you: for any result the observation might have, you remain free to perform exactly the act you would have performed had you not looked, so the expected utility of choosing after seeing the signal is at least the expected utility of choosing now. The argument is just Jensen's inequality applied to the maximum over acts, which makes it extremely robust. It does not depend on how probable any hypothesis is, and it carries over unchanged to an agent who maximizes worst-case expected utility over a set of priors, so even a strongly ambiguity-averse decisionmaker — one who plans by maximin — can never be made worse off in expectation by free information.

  Two consequences are drawn. First, anyone who declines free information — the patient who refuses a predictive genetic test, the official who does not want an impact assessment run, the reader who avoids spoilers — must be either irrational or mistaken about the costs: her reluctance can only be about the nuisance of finding out or about the distress the answer will cause, and those are just costs to be netted out, so if the information is genuinely free, refusing it is incoherent. Second, the theorem yields a stopping rule for inquiry: keep gathering evidence while the expected value of the next test exceeds its cost, and stop at the first test whose cost exceeds its expected value of information."

  The paper then applies all of this to the case I actually care about. A regulator must decide whether to commission a safety audit before deciding whether to license a system. Two features of the case: the audit's result is automatically published once produced, so courts, insurers, and the firm itself all change their behavior in response both to the result and to the mere fact that the regulator commissioned it; and the regulator's own staff cannot ignore the result, because agency rules make certain responses mandatory. The paper concludes that Good's theorem settles the question: commission the audit, since information cannot make you worse off.

  I have a hunch that the stopping rule is the sound part and the application to the audit is where things go wrong, but I suspect the maximin remark is too quick and I can't say why, and I may be wrong about where the real problems are.

  Please give me an accuracy audit I can turn into a referee report. Go through the summary claim by claim: what a decision theorist would accept as stated, what is an overstatement of a more modest thesis, what rests on a conflation the result itself keeps apart, and what is simply false. Say which assumptions the theorem actually needs — about updating, about the signal's relation to the acts and their outcomes, about where utility is defined — and which of them each step quietly uses. Then tell me whether either corollary survives correction, and whether the audit case falls under the theorem at all; if it doesn't, identify which feature puts it outside and what would have to change to bring it inside. Where your answer is "it depends," say what it depends on, so I can tell the authors what to add rather than just objecting. If the maximin claim is false, give me the smallest counterexample you can — two states, two acts, one free signal — in a form I could paste into the report.
reasoning: |-
  Hmm, the user is asking me to help referee an ethics-and-policy working paper that applies Good's theorem to a regulatory context. They need a detailed accuracy audit of how the paper summarizes and applies the theorem.

  Looking at what the paper claims: It states Good's theorem about information never having negative expected value, presents two corollaries about refusing free information and stopping rules for inquiry, and applies it to a regulator deciding whether to commission a safety audit.

  I need to evaluate this claim-by-claim. The key theorem statement is correct at its core - information can't have negative expected value for a Bayesian expected utility maximizer who updates by conditionalization. The Jensen's inequality explanation is spot on. But the paper overextends this in several ways.

  The maximin claim is problematic. Good's theorem doesn't automatically extend to maximin agents. I can construct a simple counterexample with two states, two acts, and one free signal where getting information actually harms a maximin agent. The agent might choose a safe act without information but gets forced into a risky choice after seeing the signal, leading to a worse outcome in some cases.

  The corollaries have issues too. The first one wrongly claims that refusing free information is always irrational. But information can cause psychological harm, change behavior via signaling, or trigger mandatory responses - none of which are mere "nuisance costs." The second corollary about stopping rules is mostly correct but misses that sequential information gathering can be non-linear.

  In the audit case, the automatic publication and mandatory responses create externalities that break Good's assumptions. The information changes the game - it's not just informing the regulator's decision but altering others' behavior through signaling. This means the regulator isn't just choosing acts based on beliefs; they're changing the structure of the decision problem itself.

  The theorem requires that utilities depend only on states and acts, that the decisionmaker can choose any act regardless of information state, and that they update by conditionalization. The audit scenario violates several of these.

  For my response, I'll provide a structured audit covering: 1) What's correct in the summary, 2) What's problematic or false, 3) The actual assumptions needed, 4) The status of the corollaries, and 5) Why the audit case falls outside the theorem. I'll include that maximin counterexample and suggest what changes would be needed to make the audit case fit the theorem framework.
answer: |-
  Here is a point-by-point accuracy audit of the paper's treatment of Good's theorem and its implications, designed as a referee report section. I focus on decision-theoretic validity, flagging overstatements, hidden assumptions, and limits to robustness. The audit concludes with an evaluation of the corollaries and the audit application.

  ### **1. Accuracy of the Theorem Statement & Robustness Claims**
  *   **"(Good's theorem says that) information cannot have negative expected value."**  
      **Verdict:** **Correct, but incomplete.** This holds *only* for a Bayesian expected utility (EU) maximizer updating by strict conditionalization, where the information is *costless* and *freely available*, and crucially, **where the act space remains identical before and after observation**, and **utilities depend only on the state and the act chosen** (not on the information-gathering process itself or others' reactions to it). The term "expected value" here means *expected utility under the prior belief state*.

  *   **"The argument is just Jensen's inequality applied to the maximum over acts."**  
      **Verdict:** **Correct and insightful.** This is the core mathematical insight: \( \max_a \mathbb{E}[U(a,\omega)] \leq \mathbb{E}[\max_a \mathbb{E}[U(a,\omega) | s]] \), where \(s\) is the signal. Jensen's inequality applies because the max function is convex.

  *   **"It does not depend on how probable any hypothesis is."**  
      **Verdict:** **Correct.** The *inequality* holds for any prior distribution over states/signals. The *magnitude* of the value depends on the prior, but its non-negativity does not.

  *   **"(It) carries over unchanged to an agent who maximizes worst-case expected utility over a set of priors (maximin)."**  
      **Verdict:** **False.** This is a significant overstatement. Good's theorem **does not generally hold for maximin expected utility (MEU) agents**. The failure occurs because the max-min function is not linear in probabilities, violating the conditions for Jensen's inequality to guarantee non-negative value. *Counterexample provided below.*

  *   **"Extremely robust."**  
      **Verdict:** **Overstated.** While robust *within its core Bayesian EU framework* (e.g., independent of priors, signal structure, or utility function shape as long as EU is defined), the theorem is **fragile to deviations from its core assumptions**: conditionalization, fixed act space, state-act-dependent utilities, costlessness, and crucially, **no change in the decision problem structure induced by acquiring the information**. The application highlights this fragility.

  ### **2. Counterexample: Maximin Failure (Smallest Case)**
  *   **States:** \(\omega_1\), \(\omega_2\) (equally likely under all priors considered, but agent doesn't know probabilities).
  *   **Acts:** \(a_1\), \(a_2\).
  *   **Utilities:**
      *   \(U(a_1, \omega_1) = 10\), \(U(a_1, \omega_2) = 0\)
      *   \(U(a_2, \omega_1) = 0\), \(U(a_2, \omega_2) = 10\)
  *   **Signal:** \(s\) perfectly reveals the state \(\omega\) (free).
  *   **Agent's Set of Priors:** \(\mathcal{P} = \{ P: P(\omega_1) = p, P(\omega_2) = 1-p \}\) for *all* \(p \in [0, 1]\). (Complete ambiguity).
  *   **Analysis:**
      *   **Without Signal:** The MEU agent evaluates each act under its worst prior:
          *   \(\min_{P} \mathbb{E}_P[U(a_1)] = \min_p (10p + 0(1-p)) = 0\) (worst if \(p=0\))
          *   \(\min_{P} \mathbb{E}_P[U(a_2)] = \min_p (0p + 10(1-p)) = 0\) (worst if \(p=1\))
          *   Max-min value = \(\max(0, 0) = 0\). Agent is indifferent, can choose \(a_1\) or \(a_2\).
      *   **With Signal:** After seeing \(s\) revealing \(\omega\), the agent knows the state. They choose optimally:
          *   If \(\omega_1\), choose \(a_1\) for utility 10.
          *   If \(\omega_2\), choose \(a_2\) for utility 10.
      *   **Ex-ante Expected Utility (under any prior p):** \(\mathbb{E}[U|\text{learn}] = p * 10 + (1-p) * 10 = 10\).
      *   **Ex-ante MEU Value WITH Signal:** The agent must evaluate the *plan* "observe signal then choose best act" *before* seeing the signal, under the worst prior. The payoff is 10 *regardless of the state revealed and regardless of p*. So:
          *   \(\min_{P} \mathbb{E}_P[U|\text{learn}] = \min_p 10 = 10\).
  *   **Result:** Ex-ante MEU without information = 0. Ex-ante MEU with (free) information = 10. Information has positive value. **This seems fine... but wait:**
  *   **Modification Inducing Negative Value:** Change the act *available after learning*. Suppose the agent, *if they learn the state*, is **forced** (e.g., by commitment, regulation, or psychological inability to ignore) to choose the act *optimal for that state*. Now consider Act \(a_3\) available **only if they do NOT learn the state**:
      *   \(U(a_3, \omega_1) = 4\), \(U(a_3, \omega_2) = 4\).
  *   **Analysis (Revised):**
      *   **Without Signal:** Acts available: \(a_1, a_2, a_3\).
          *   \(\min_{P} \mathbb{E}_P[U(a_1)] = 0\)
          *   \(\min_{P} \mathbb{E}_P[U(a_2)] = 0\)
          *   \(\min_{P} \mathbb{E}_P[U(a_3)] = \min_p (4p + 4(1-p)) = 4\)
          *   Max-min value = \(\max(0, 0, 4) = 4\). Agent chooses \(a_3\).
      *   **With Signal:** Agent *must* choose \(a_1\) if \(\omega_1\) is revealed (utility 10), or \(a_2\) if \(\omega_2\) is revealed (utility 10). Act \(a_3\) is *unavailable* after learning. Ex-ante EU under any p is still 10.
      *   **Ex-ante MEU Value WITH Signal:** \(\min_{P} \mathbb{E}_P[U|\text{learn}] = \min_p 10 = 10\).
  *   **Result:** Ex-ante MEU without information = 4. Ex-ante MEU with (free) information = 10. Information has positive value (10 > 4). **Still positive?**
  *   **The Crucial Twist for Negative Value:** **Add a state where forced choice is disastrous.** Introduce a third state \(\omega_3\).
      *   **States:** \(\omega_1\), \(\omega_2\), \(\omega_3\).
      *   **Utilities for \(a_1\), \(a_2\) unchanged.** Add:
          *   \(U(a_1, \omega_3) = -100\), \(U(a_2, \omega_3) = -100\), \(U(a_3, \omega_3) = 0\).
      *   **Agent's Set of Priors:** All possible probability distributions over \(\{\omega_1, \omega_2, \omega_3\}\) (complete ambiguity).
      *   **Signal:** Perfectly reveals state (free).
      *   **Analysis:**
          *   **Without Signal:** Acts: \(a_1, a_2, a_3\).
              *   \(\min_{P} \mathbb{E}_P[U(a_1)] = \min\) over priors of \([10P(\omega_1) + 0P(\omega_2) -100P(\omega_3)]\). Worst prior: \(P(\omega_1)=0, P(\omega_3)=1\) → Utility = -100.
              *   Similarly, \(\min_{P} \mathbb{E}_P[U(a_2)] = -100\) (worst prior: \(P(\omega_2)=0, P(\omega_3)=1\)).
              *   \(\min_{P} \mathbb{E}_P[U(a_3)] = \min\) over priors of \([4P(\omega_1) + 4P(\omega_2) + 0P(\omega_3)] = 0\) (achieved by *any* prior, e.g., \(P(\omega_3)=1\)).
              *   Max-min value = \(\max(-100, -100, 0) = 0\). Agent chooses \(a_3\).
          *   **With Signal:** Agent *must* choose \(a_1\) if \(\omega_1\) revealed (U=10), \(a_2\) if \(\omega_2\) revealed (U=10), \(a_1\) or \(a_2\) (disastrous) if \(\omega_3\) revealed (U=-100). Act \(a_3\) is *unavailable*.
          *   **Ex-ante EU under specific prior p,q,r (p+q+r=1):** \(10p + 10q -100r\).
          *   **Ex-ante MEU Value WITH Signal:** \(\min_{P} \mathbb{E}_P[U|\text{learn}] = \min_{p,q,r} (10p + 10q - 100r)\). The worst prior puts all mass on \(\omega_3\) (\(r=1, p=0, q=0\)) → Utility = -100.
      *   **Result:** Ex-ante MEU without information = 0. Ex-ante MEU with (free) information = -100. **Information has negative expected value (-100 < 0) for the maximin agent.** The key is that information *removes the safe option* (\(a_3\)) and forces a choice that is catastrophic in the worst-case state (\(\omega_3\)), which the agent could avoid by remaining ignorant and choosing \(a_3\). The theorem fails for maximin.

  ### **3. Critical Assumptions of Good's Theorem (Often Implicitly Used)**
  The theorem requires **all** of the following:
  1.  **Expected Utility Maximization:** The agent maximizes expected utility (linear in probabilities).
  2.  **Conditionalization:** The agent updates beliefs via Bayesian conditionalization upon observing the signal.
  3.  **Costless & Free Information:** Acquiring the signal itself has no direct cost (utility impact) and is always available.
  4.  **Fixed Act Space (State Independence):** The set of available acts **does not change** based on whether the signal is observed or what the signal reveals. *(The counterexample violates this)*.
  5.  **State-Act-Dependent Utilities:** The utility of an act in a state **depends only on the act and the state**, not on:
      *   How the agent learned the state (i.e., not on the signal itself or the act of observing it).
      *   The beliefs of other agents.
      *   Any "signaling" consequences of the *decision to acquire information* or the *observation of the signal*.
  6.  **No Decision Problem Alteration:** Acquiring the signal **does not change the structure of the decision problem** faced by the agent, except by refining their beliefs. Specifically, it does not:
      *   Change the available acts (reiterating 4).
      *   Change the state space or the outcome utilities (reiterating 5).
      *   Alter the choices or beliefs of other agents who react to the information acquisition or its result.
      *   Trigger mandatory responses based on the information result.

  ### **4. Evaluation of Corollaries**
  *   **First Corollary: "Anyone who declines free information... must be either irrational or mistaken about the costs... refusing it is incoherent."**
      *   **Verdict: False and overly simplistic.** While Good's theorem shows that *within the strict Bayesian EU model*, refusing *costless* information *with no external effects* is irrational, the corollary ignores valid reasons for refusal that **violate the theorem's assumptions**:
          *   **Psychological/Moral Costs:** The "distress" of knowing is often **not** a mere cost to be netted out like a fee; it can fundamentally alter the utility function *based on the information state itself* (violating Assumption 5). E.g., living with dread vs. hope even if outcomes are identical. This is arguably rational for a state-dependent utility.
          *   **Signaling/Strategic Costs:** The *act of acquiring* information (e.g., genetic test, audit request) or the *fact of its result* can signal something to others (insurers, courts, firms, the public), changing *their* behavior and thus the *consequences* of the agent's future acts (violating Assumptions 5 & 6). Refusal can be strategic.
          *   **Mandatory Responses:** Knowing the information can force the agent (or others) into actions they could avoid in ignorance, potentially leading to worse outcomes (violating Assumption 4 & 6, as in the counterexample). Refusal preserves freedom of choice.
          *   **Value of Ignorance/Uncertainty Aversion:** Some agents intrinsically value ignorance or are uncertainty-averse in non-EU ways (e.g., complexity aversion, preference for flexibility) – the theorem doesn't cover them (violating Assumption 1). MEU agents *can* rationally refuse info (as shown).
      *   **Survival:** The corollary **does not survive** in its strong form. It should be replaced by: "Within the strict Bayesian expected utility model where information acquisition has no external effects or intrinsic costs, refusing costless information is irrational. However, violations of the model's assumptions, such as signaling effects, mandatory responses, psychological costs intrinsic to knowing, or non-EU preferences, can provide rational grounds for refusal."

  *   **Second Corollary: Stopping Rule ("keep gathering evidence while EVOI > cost")**
      *   **Verdict: Largely correct, but incomplete.** This sequential EVOI calculation is indeed the standard Bayesian prescription for optimal sequential information gathering. *However*:
          *   **Assumption Dependence:** It inherits all assumptions of Good's theorem at each step. If acquiring test *n* changes the problem for test *n+1* (e.g., via signaling, mandatory actions, or changing available acts), the standard additive EVOI calculation fails (violating Assumption 6).
          *   **Non-Myopia:** The rule requires calculating the value of the *next* test *assuming optimal stopping afterwards*. It is optimal only under specific conditions (like non-increasing EVOI or known costs). It can be suboptimal if tests interact or have correlated information not captured myopically.
          *   **Maximin Failure:** For MEU agents, the "value of information" is not well-defined in the same additive way, and sequential max-min can be path-dependent and complex. The simple rule does not generalize.
      *   **Survival:** The corollary **survives for Bayesian EU agents in problems without path-dependent information effects**. It needs caveats about its applicability under violations of the theorem's assumptions (especially 5 & 6) and its non-optimality under specific sequential dependencies.

  ### **5. Application to the Regulatory Audit**
  *   **Verdict: The audit case FALLS OUTSIDE the scope of Good's theorem.** The theorem **does not** imply the regulator should always commission the audit. Two features violate core assumptions:
      1.  **Automatic Publication & Third-Party Reactions:** Courts, insurers, and the firm change their behavior based on the *commissioning* and the *result*. This means:
          *   The **utilities** of the regulator's eventual licensing decision **depend on the beliefs and actions of others**, which are altered by the information acquisition/result (violating **Assumption 5** - utility depends only on state/act).
          *   The **decision problem structure** (the consequences of licensing or not) changes based on acquiring the information or seeing its result (violating **Assumption 6**).
      2.  **Mandatory Staff Responses:** Agency rules force certain responses based on the audit result. This means:
          *   The regulator's **available acts** *after* seeing the audit result may be **restricted** compared to the acts available *without* commissioning the audit (e.g., they might be *forced* to deny a license for certain results, removing the option they would have chosen blindly). This violates **Assumption 4** (fixed act space).
          *   This is directly analogous to the forced choice in the maximin counterexample. The "safe" act of *not commissioning the audit and making a judgment call* might yield a guaranteed acceptable outcome, while commissioning could force a disastrous outcome under some audit results due to mandatory rules, even if the underlying risk is small.

  *   **Why the Theorem Doesn't Apply:** Good's theorem assumes the *only* effect of information is to improve the agent's belief for choosing among a *fixed* set of acts with *fixed* consequences. Here, information acquisition and revelation fundamentally alter the game: it changes what others do (changing consequences) and what the regulator is allowed to do (changing acts). The expected utility *of the overall strategy* "commission audit then license/deny" can be lower than "don't commission audit and license/deny" because the act "deny license *without audit result X*" is different from "deny license *mandated by audit result X*" in its implications and consequences. Information has externalities and alters constraints.

  *   **Bringing it Inside:** To fall under Good's theorem, the scenario must be modified so that:
      1.  The decision to commission the audit and its result are **kept secret** from all external parties (courts, insurers, firm) and staff cannot be compelled to act on it. Only the regulator sees it and uses it voluntarily to inform their discretionary licensing decision.
      2.  The utilities associated with licensing/denial depend **only** on the true safety state of the system and the act chosen, **not** on market reactions, legal liabilities triggered by the audit's publication, or staff actions mandated by the result.
      If these changes are implausible (as they usually are for regulators), Good's theorem is inapplicable. The decision requires modeling the **equilibrium effects** of information acquisition and disclosure within the larger strategic environment.

  ### **Recommendations for Authors**
  1.  **Correct the Maximin Claim:** Explicitly state that Good's theorem **does not hold** for minimax expected utility (maximin) agents or other ambiguity-averse models, and provide a simple counterexample like the 3-state version above.
  2.  **Clarify Corollary 1:** Significantly weaken the first corollary. Acknowledge valid rationales for refusing information stemming from signaling, mandatory responses, intrinsic costs of knowing, and non-EU preferences. Frame "irrationality" strictly within the narrow Bayesian EU model where all assumptions hold.
  3.  **Qualify Corollary 2:** Note that the stopping rule assumes no path-dependent effects of information gathering and is specific to Bayesian EU. Mention complexities for sequential max-min.
  4.  **Revise Audit Application:** Abandon the claim that Good's theorem settles the case. Explicitly argue why the automatic publication and mandatory responses **violate the theorem's assumptions** (fixed acts, state-act utilities, no problem alteration). Analyze the audit decision as a **signaling game** or a problem with **information-induced constraints**, explicitly modeling the reactions of courts, insurers, the firm, and the impact of agency rules. Discuss potential equilibria where *not* commissioning the audit could be preferable to avoid triggering harmful mandatory responses or negative market signals, even if the audit itself is costless.
  5.  **State Assumptions Explicitly:** When invoking Good's theorem, explicitly list its critical assumptions (costless, conditionalization, fixed acts, state-act utilities, no structural change) and discuss whether they hold in the application.

  This audit provides the decision-theoretic grounding to object to the overextension of Good's theorem while acknowledging its valid core and stopping rule application. The key insight for the audit case is that **information can alter the game, not just inform the player within a fixed game.**
