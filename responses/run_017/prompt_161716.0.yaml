answer: |-
  **Bottom line:** The most damaging objection is the **victims' agency critique** (voiced by practitioners/NGOs): if victims overwhelmingly demand trials, your preference for commissions overrides their right to remedy—your answer must concede this tension while pivoting to systemic repair as complementary, not dismissive.  

  ---

  ### Q&A Prep Sheet: 8 Likely Objections  
  *(Ordered by potential damage, highest first)*  

  1. **"You’re overriding victims’ right to justice for the sake of your ‘systemic’ narrative. What about rape victims who want their day in court?"**  
     *Source:* NGO lawyer (rights-based framing).  
     **Concede:** "Absolutely — if victims demand trials, that demand carries moral weight. My argument doesn’t claim commissions *replace* trials in all cases."  
     **90s Answer:** "But when a state weaponizes law itself, the harm exceeds individual crimes. A commission names that system — which trials structurally cannot do. This *enables* victim-centered justice by exposing complicity beyond perpetrators. Crucially, I’m arguing commissions are apt *where systemic truth is prioritised* — not that they negate prosecutions elsewhere."  
     **Soft Spot:** Implies commissions might still override victims’ wishes. Sidesteps whether victims see "systemic truth" as reparative.  
     **Force:** Genuine tension. **Framing Clash?** Yes (individual remedy vs. structural diagnosis).  

  2. **"Your ‘systemic wrong’ thesis sounds elegant, but commissions are elite deals that sacrifice accountability. See Rwanda: gacaca worked *because* it combined confession with *community-level punishment*."**  
     *Source:* Gacaca scholar (anti-elite bargain framing).  
     **Concede:** "Gacaca’s punitive element is a real strength. And yes, commissions *can* be elite pacts."  
     **90s Answer:** "But gacaca’s ‘punishment’ was largely symbolic — it didn’t imprison architects. My point is that conditional amnesty *forces* perpetrators to legitimize the system by admitting guilt publicly. Trials individualize; commissions force the *state* (via perpetrators) to admit the system was criminal. That’s distinct from elite bargains hiding guilt."  
     **Soft Spot:** Avoids whether "public admission" satisfies victims without punishment.  
     **Force:** Significant — if commissions lack teeth, they’re performative.  

  3. **"Your ‘amnesty as entrenchment’ distinction is naive. Statutory amnesty *is* forbearance by future governments — they can repeal it! Only constitutional entrenchment binds successors."**  
     *Source:* Lawyer (legal realist framing).  
     **Concede:** "You’re right — statutory bars *can* be overturned. But politically, repealing amnesty risks crisis."  
     **90s Answer:** "The key is *political cost*: statutory amnesty creates a vested expectation. Repeal implies bad faith, destabilizing transition. Forbearance is a policy choice; entrenchment creates a normative claim. My distinction flags that conditional amnesty’s stability *requires* that normative layer — else the credibility paradox bites harder."  
     **Soft Spot:** Overplays "normative claim" — politics often trump legality.  
     **Force:** Framing clash (legal vs. political legitimacy).  

  4. **"The credibility paradox sinks you. If perpetrators believe truth-telling prevents future prosecution, incentives vanish. So commissions *need* the threat of trials!"**  
     *Source:* Practitioner (operational framing).  
     **Concede:** "Yes, the paradox is real — incentives rely on perceived risk."  
     **90s Answer:** "But the threat isn’t trials — it’s *exposure*. Perpetrators trade amnesty for *legitimacy*: admitting guilt cleanses them in the new order. If they lie/omit, they lose that shield and face social, economic, or later legal consequences. The incentive is avoiding lifelong stigma as a ‘denier’."  
     **Soft Spot:** Assumes social stigma matters more than legal risk to perpetrators.  
     **Force:** Genuine — hinges on cultural context.  

  5. **"You dismiss ‘selection bias’ too easily. Low-level actors confess; leaders manipulate the process. Argentina’s trials *after* CONADEP proved commissions protect orchestrators."**  
     *Source:* Practitioner (case-based framing).  
     **Concede:** "Selection bias is a critical flaw — leaders evade commissions."  
     **90s Answer:** "Commissions *can* expose orchestrators vicariously: by detailing systemic patterns, they implicate those who designed it. Trials afterward (like Argentina) *use* that record. My argument isn’t that commissions suffice alone, but that they create an authoritative record trials can’t. Leaders avoid both — but commissions make denial harder."  
     **Soft Spot:** Doesn’t solve leaders escaping consequences.  
     **Force:** Framing clash (single mechanism vs. ecosystem).  

  6. **"If conditional amnesty isn’t a second-best, why did South Africa choose it only because they couldn’t prosecute?"**  
     *Source:* Philosopher (retribution focus).  
     **Concede:** "Necessity drove South Africa’s choice — but that doesn’t mean it’s *only* justifiable by necessity."  
     **90s Answer:** "South Africa shows conditional amnesty can *work* under constraint. My claim is that even absent constraint, its focus on collective truth is *morally distinct* — not better universally, but *apt* for the specific wrong of legalized atrocity. Trials address crime; commissions address corrupted sovereignty."  
     **Soft Spot:** Risks sounding abstract vs. realpolitik.  
     **Force:** Framing clash (ideal vs. non-ideal theory).  

  7. **"You say victims ‘want truth,’ but evidence is mixed. Many prioritize punishment or reparations. Isn’t this paternalistic?"**  
     *Source:* Practitioner/NGO (victim-centered framing).  
     **Concede:** "Empirical evidence *is* varied — truth isn’t universally prioritized."  
     **90s Answer:** "I agree this can’t be load-bearing. But note: even victims demanding punishment often seek acknowledgment of *systemic* harm. Commissions provide that narrative authoritatively — which aids reparations, memorialization, and institutional reform. This isn’t paternalism; it’s fulfilling the state’s duty to account for its own corruption."  
     **Soft Spot:** Doesn’t prove commissions satisfy victims *better* than trials.  
     **Force:** Your supervisor is right — empirically shaky.  

  8. **"If your ‘apt response’ justifies amnestying perpetrators, could it excuse amnesty for *genocidaires* if a commission ‘reconstructs the system’ well enough?"**  
     *Source:* Philosopher/NGO (slippery-slope framing).  
     **Concede:** "This is the hardest case — I don’t argue *all* amnesties are justified."  
     **90s Answer:** "No. Genocide’s gravity may *demand* punishment to reaffirm human worth. My argument applies where the core wrong is the *state weaponizing law* — not the underlying crimes. Even then, commissions work best alongside other measures (e.g., reparations, vetting)."  
     **🚨 Quiet Commitment:** Your theory *could* justify amnestying universally reviled figures if the commission is robust. **Don’t say this.** Instead: "Some wrongs are so severe that truth alone is insufficient — but commissions ensure the *system* is condemned, not just individuals."  

  ---  
  **The Reply That Must Land:** Your answer to **Objection #1 (victims’ agency)**. If you can’t reconcile systemic repair with victims’ demands, the moral core collapses.  
  **The Question You Hope Nobody Asks:** *"Can you name one real-world case where your ‘preferred’ commission (non-necessity-based) was implemented successfully — and victims accepted amnesty without feeling betrayed?"* (You lack examples; this is a normative argument.)  

  **Tactical Note:** For practitioners, emphasize *sequencing* ("commissions first, trials after") and *complementarity*. For philosophers, stress the *conceptual distinction* of systemic vs. individual harm. For NGOs, pivot to "commissions as enabling reparations/reform."
