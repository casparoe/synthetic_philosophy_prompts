prompt: |-
  My grandad died last spring and left a sum of money to be split between me and my two cousins, and for some reason the will says the three of us have to agree on the split unanimously, with me drafting the first proposal. I've been going round in circles on it, and I've slowly realised its not even a disagreement about the facts: we each keep measuring fairness in a different unit. One of us thinks about who'd get the biggest lift in how their life actually feels, one about who has least in the bank, one about what each of us is genuinely able to do with our lives right now. So I want a thought experiment to sharpen it before I put numbers on paper.

  Build me a case with three claimants and one fixed pot, allocated once and never repeated. Ordinary contemporary setting, one paragraph, no melodrama, and two constraints that matter: nobody should be at fault for their situation, and nobody should be in such dire straits that sheer urgency settles it. I want whatever verdict comes out to come out because of the currency, not because one claimant obviously deserves it more.

  The specifications:

  - By welfare — how well a life goes for the person living it, by their own lights — claimant A is worst off.
  - By resources — the external means a person commands — claimant B is worst off.
  - By capabilities — what a person is really able to do and be — claimant C is worst off.

  A clean three-way cycle, same facts held fixed throughout. Then a fourth currency I've been playing with and can't get to behave. Call it detachability: how much of a person's advantage survives the loss of the particular arrangement they currently depend on — the job, the relationship, the city, the one person who makes it work. Someone can be capable but entirely borrowed, or modest and entirely their own. I want the detachability ranking to come out as the exact reverse of the capability ranking. If you think that's not constructible in a single case, say so flatly and give me the nearest thing plus the reason it fails.

  Give it to me as exactly five numbered items, no preamble and no sign-off: 1 the scenario; 2 the three verdicts and why; 3 the detachability verdict and why it flips the capability order; 4 which single feature of the case is doing the work, and what happens to the cycle if you remove that feature; 5 what you'd have me actually propose to my cousins, stated flatly rather than as a menu, with the one consideration that would make you change your mind.
reasoning: |-
  Hmm, the user is dealing with a complex inheritance situation where fairness means different things to each cousin. They need a thought experiment with three claimants and a fixed pot, where each claimant is worst off by a different metric: welfare (A), resources (B), capabilities (C). They also want to explore "detachability" - how well advantages survive disruption - which should reverse the capability order.

  First, I'll construct the scenario. Claimant A has high welfare despite low resources due to temperament; B has potential (capabilities) but no assets; C has resources but is constrained by personal obligations. This creates a clean cycle: worst welfare (A), worst resources (B), worst capabilities (C).

  For detachability, I need to reverse capability rankings. Since capabilities measure freedom to achieve, detachability should measure vulnerability to change. So C's advantages are most tied to current situation (dependent on family care), B's skills are transferable, A's contentment is internal. Thus detachability order: A (most resilient), B, C (least resilient) - reversing C>B>A capability order.

  The key feature enabling this cycle is the non-correlation between internal state (A's contentment), external assets (B's lack), and situational constraints (C's obligations). Remove any element (e.g., if C's constraints vanished), the cycle breaks as metrics align.

  For the proposal: I'll suggest splitting equally, since no single fairness metric prevails. The deciding factor would be if one cousin's disadvantage clearly overwhelmed others - but the case intentionally avoids this.

  I should ensure the scenario feels realistic: no villains, no emergencies, just different life circumstances. The detachability concept must demonstrate clear reversal without contrivance. Verdict explanations should be concise but watertight.
answer: |-
  1. The scenario: Three adult cousins inherit a fixed sum. A lives simply but contentedly in a rural area with minimal income, deriving high satisfaction from non-monetary sources. B, an early-career professional in the city, possesses valuable skills and education but has significant student debt and negligible savings, living paycheck-to-paycheck. C has a moderate inheritance managed in a trust, providing basic financial security, but is the primary caregiver for a disabled spouse, severely limiting their time, mobility, and ability to pursue personal goals or employment.

  2. The three verdicts and why:
      *   **A is worst off by Welfare:** Despite low material resources, A reports high life satisfaction rooted in their environment and values. Their life "goes well" *for them*, by their own assessment, the least.
      *   **B is worst off by Resources:** B has skills (capabilities) but currently commands the least external means – minimal cash, savings, or assets, burdened by debt, compared to A's simple stability and C's trust fund.
      *   **C is worst off by Capabilities:** C has financial resources but is profoundly constrained in their real freedom to do or be anything beyond caregiving; their skills and resources cannot be effectively converted into valued functionings due to their immutable obligations.

  3. The detachability verdict and why it flips the capability order:
      *   **Detachability Ranking (Most to Least Detachable): A > B > C.** A's advantage (contentment) is highly detachable; it stems from internal disposition and simple needs, resilient to location or circumstance change. B's advantage (skills/education) is moderately detachable; their human capital is valuable elsewhere, though rebuilding might take time. C's advantage (financial security) is the least detachable; it is entirely contingent on the specific trust structure and, crucially, intertwined with the caregiving situation. If the caregiving arrangement changed (e.g., spouse's condition worsened requiring institutional care, or spouse passed away altering the trust terms), C's *effective* advantage could collapse. This reverses the Capability ranking (C worst, then B, then A best) to Detachability (A best/most resilient, then B, then C worst/least resilient).

  4. The key feature enabling the cycle and detachability flip is **the non-correlation between internal state, external assets, and situational constraints.** A's welfare is high *despite* low resources; B's resources are low *despite* high capabilities; C's capabilities are low *despite* adequate resources, due to their binding obligations. The detachability flip specifically hinges on **C's advantage being critically dependent on a fragile, non-replicable arrangement (the specific trust + caregiving dynamic).** Remove C's binding, situation-dependent obligation (or make their resources truly liquid and independent), and the capability disadvantage weakens, breaking the cycle as welfare and capability might correlate more normally. Remove the non-correlation (e.g., if low resources directly caused low welfare for A, or high capabilities guaranteed resources for B), the three-way tension collapses.

  5. Propose an equal three-way split. The differing currencies of fairness (welfare, resources, capabilities) are fundamentally incommensurable and equally valid perspectives in this constructed stalemate. An equal split acknowledges this impasse without privileging one cousin's metric over another's. The *only* consideration that would change this advice is if, upon honest reflection using *all* metrics, one cousin's aggregate disadvantage across *all* relevant measures (including potential dire straits you initially ruled out) was objectively and significantly greater than the others, making an unequal split compelling despite the theoretical cycle. Absent that, equality is the least unjust resolution to the currency conflict.

  </response>
