  First, I need to recall if there's an established term in historiography or archival science. The user mentioned that terms like bias or hostile sources don't quite fit because those imply you can adjust for the slant. Here, the richness of the record is inseparable from the institutional control. 

  I remember Silencing by Overdocumentation. That concept comes from Trouillot's work on how power creates archives. The key point is that the institution's need to surveil and control generates the detail, so the record's abundance is a form of distortion. That seems to fit the user's examples perfectly. 

  The user also asks about edge cases. For example, if a hospital logs a midwife's actions, is that the same? The recorder isn't necessarily controlling but has a different purpose. Here, the distortion might be different; the focus is on medical outcomes, not criminalization. So it's related but not identical because the power dynamic is about professional oversight rather than punitive control. 

  Then there's self-documentation, like community collections or diaries. The user wonders if that's the opposite. Self-authored records avoid institutional distortion but introduce self-presentation biases. So it's a different kind of slant. Silencing by Overdocumentation specifically ties detail to institutional power. Diaries might have gaps or selective storytelling, but not because an external force is controlling the narrative. 

  The user also mentions digital archives. Web scraping might overrepresent certain voices—like those in controversial spaces—while marginalizing others. That's a modern parallel. 

  They need a clear definition and boundaries. The core elements are: institutional power generating records, detail as a byproduct of control, and the inability to separate richness from distortion. Neighboring concepts include archival violence (which is broader) or selection bias (which is about missing data, not overabundance). 

  The user's deeper need might be to articulate this concept for their work, possibly to inform how they handle such records or educate others. They might also be concerned about ethical research practices, ensuring they don't perpetuate the silencing when using these sources. Providing a term and framework helps them analyze sources critically without dismissing the valuable details.
answer: |-
  What you're describing is a profound and under-discussed phenomenon in historiography. It's **not merely bias**, **missing records**, or **hostile sources** – it's a specific structural distortion where **institutional power generates both the volume and the perspective of the record at the point of intervention**. The established concept that best captures this is:

  **Silencing by Overdocumentation (or Archival Overrepresentation through Institutional Intervention)**

  **Core Definition:** The phenomenon where the most detailed, dense archival records about marginalized individuals or communities are created *precisely* and *only* when they come under the scrutiny, control, or punitive action of powerful institutions (state, legal, medical, religious, etc.). This creates an inherent distortion where **completeness equals capture**, and the subject's agency is inherently obscured by the very process that generates the record. Attempting to "correct for bias" often fails because the bias *is* the source of the detail; stripping away the institutional perspective leaves you with little meaningful data about the subjects themselves.

  ### Why Neighboring Concepts Don't Fully Capture It
  1.  **Source Bias/Slant:** Acknowledges perspective but assumes you can "read against the grain" or triangulate. Your point is that *here*, reading against the grain often destroys the valuable detail itself. The grain *is* the detail.
  2.  **Missing Records/Archival Silences:** Focuses on what *isn't* there. Your phenomenon highlights the problematic nature of what *is* abundantly *there* and *why*. It's a perverse form of presence.
  3.  **Hostile Sources:** Similar to bias, but emphasizes antagonism. While often hostile, the key here is the *generative* power of institutional intervention – the record exists *because* of the intervention, and its hostility/perspective is inseparable from its density.
  4.  **Surveillance State/Disciplinary Power (Foucault):** This is the *underlying mechanism*. Foucault explains *why* institutions document intrusively (to know, classify, control). Your concept names the *specific historiographical problem* this creates: the archive reflects the act of control more than the controlled.
  5.  **Victim-Centered Sources:** Focuses on sources *from* the perspective of the marginalized. Your sources are *about* the marginalized, but *from* the perspective of their oppressors/interrogators, generated at moments of disempowerment. They are the antithesis of victim-centered sources.

  ### Key Characteristics & Boundaries
  *   **The Generator:** The record is created *by* and *for* the institution (sheriff, almshouse, court, asylum, etc.).
  *   **The Trigger:** The depth of documentation is triggered by institutional intervention (arrest, admission, investigation, regulation, punishment).
  *   **The Distortion:** The perspective is inherently institutional, focusing on compliance, deviance, categorization, pathology, or threat from the institution's viewpoint. Agency is minimized or framed as transgression.
  *   **The Paradox:** The record's *richness* (names, physical details, movements, associations) is a direct product of the institution's need to know/control, making it simultaneously invaluable and deeply skewed. You cannot extract the "facts" without the institutional frame.

  ### Applying Your Edge Cases
  1.  **Hospital Logging a Midwife (Different Purpose, No Direct Control Intent):**
      *   **Still Counts, but Softer:** This *is* Silencing by Overdocumentation, though potentially less punitive. The institution (hospital) documents an individual (midwife) according to *its* priorities (medical outcomes, protocol adherence). The record will be rich in detail about actions *as they relate to institutional norms and outcomes*, likely downplaying the midwife's own knowledge framework, client relationships, or broader context unless it deviates. The midwife's agency is framed through the lens of medical compliance/outcome. The "slant" is professional oversight rather than criminalization, but the completeness still arrives through institutional scrutiny.
  2.  **Deliberate Community Collection (Self-Documentation):**
      *   **Escapes Silencing by Overdocumentation BUT introduces different distortions.** This is the *opposite* generative force. The record exists due to community *agency*, not external institutional intervention. However:
          *   It suffers from **Self-Presentation Bias/Strategic Representation:** It shows how the community *wanted* to be seen, potentially omitting internal conflicts, vulnerabilities, or aspects deemed undesirable.
          *   It may suffer from **Selection/Preservation Bias:** What survives? What was deemed important *then*? What formats were used?
      *   **Crucially:** The density of the record is *not* tied to a moment of institutional capture. It reflects agency, even if curated. This is fundamentally different from the sheriff's raid file.
  3.  **Diary (Thick Self-Authored Record):**
      *   **The Clean Opposite:** A diary is the *antidote* to Silencing by Overdocumentation (though not without its own biases). It's generated by the individual, for themselves (or an imagined audience), outside of direct institutional intervention (though societal norms influence it). Its richness comes from *self*-expression and reflection, not external control. The distortions are personal (selective memory, emotional framing, intended audience) but not the product of institutional power generating the record *at the point of subjugation*. It represents agency in documentation.

  ### Why This Matters (Especially for Digital Archives)
  Your instinct about big web scrapes is astute. Modern examples abound:
  *   Marginalized communities online being extensively documented only when targeted by law enforcement (e.g., monitoring "extremist" forums).
  *   Detailed records of protests existing primarily in police surveillance footage or arrest logs.
  *   Mental health or poverty being "documented" most thickly through interactions with the criminal justice or welfare systems.
  *   Online activity scraped for research often reflecting public controversies or platform enforcement actions rather than everyday, unremarked-upon existence.

  ### Coining a Precise Term (If needed beyond "Silencing by Overdocumentation")
  *   **Institutional Capture Density:** Highlights the source (institutional) and the effect (dense records) tied to the moment of capture.
  *   **The Intervention Paradox:** Emphasizes the core contradiction (rich detail emerges *only* through distorting control).
  *   **Archival Overrepresentation via Control:** Combines the abundance with its generative mechanism.
  *   **(Best) The Control-Generated Record:** Simple, direct, descriptive. It names *what* it is (a record) and *how* it came to be (generated by an act of control).

  **In essence:** You've identified a core pathology of the archive, particularly for the marginalized. The loudest, most detailed voices preserved about them are often the voices of the systems that confined, punished, or processed them. Recognizing this as **Silencing by Overdocumentation** or **The Control-Generated Record** is crucial for ethical historical practice. It forces us to acknowledge that sometimes, the richest source is also the most treacherous, not because it lies outright, but because its very existence and form are products of power asserting itself over the subject. The solution isn't simple dismissal but radical contextualization and a constant search for counter-narratives (like those 14 newsletters!) that exist outside the institutional frame.
