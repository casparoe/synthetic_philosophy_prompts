  ## Inter-Office Memorandum: National Grain Standards Authority (NGSA)
  **Subject:** Harmonized Implementation of "Heap" Classification Under Schedule 7, Part B (Import Tariff Brackets)  
  **Reference:** Circular NGSA/87/Heap, NGSA/92/Heap-Amend.1, NGSA/99/Heap-DefProc, NGSA/05/BorderlineReview, NGSA/12/Heap-DegreeImpl, NGSA/19/PrecisPanel  
  **Effective:** Immediately (Pending Resolution of Annex Gamma)  
  **Distribution:** All Regional Assessment Offices, Customs Liaison Units, Tariff Reconciliation Board  

  **1. Preamble & Core Principle (Tolerance Enshrined):**  
  Pursuant to Circular NGSA/87/Heap, the classification of grain consignments exceeding 1 metric tonne as a "Heap" (attracting Tariff Schedule 7-B) or "Non-Heap" (Schedule 7-A) remains a critical determinant of import duty. The foundational principle, as established in Section 2.1 of NGSA/87/Heap and reaffirmed in all subsequent directives, is **Operational Tolerance (OT):** "No single grain of standard size and composition within a consignment shall, by its addition or removal, materially alter the classification of said consignment between Heap and Non-Heap status." This principle ensures consistent, non-arbitrary application crucial for trade fairness.

  **2. Prevention of Reverse Induction & Administrative Safeguard:**  
  Following the Incident Report 99-CX/Albany (involving theoretical extrapolation leading to the provisional classification of an empty warehouse silo as a potential "Heap" under recursive OT application backwards), **Section 3.2 (Operational Tolerance Directionality)** was added via NGSA/99/Heap-DefProc: "Operational Tolerance (Section 2.1) applies exclusively in the *forward accumulation* direction (i.e., grains added to a Non-Heap consignment). Application of OT in reverse accumulation (grains removed from a Heap) is expressly prohibited for classification purposes. All assessments commence from the established baseline of Non-Heap status at zero (0) grains." This directive eliminates administrative paradoxes arising from backward extrapolation. Compliance is mandatory; disregard constitutes a Category 3 Procedural Violation.

  **3. Determinative Threshold & Factual Basis:**  
  Notwithstanding OT, practical assessment requires a definitive point of classification. Therefore, **Determinative Threshold (DT):** A grain consignment shall be classified as a **Heap** if it contains **10,000 grains or more**. This threshold represents the precise point where the qualitative property of "Heap" manifests objectively. Consignments containing fewer than 10,000 grains are definitively Non-Heap. Regional Assessors must utilize calibrated counting apparatus (Specification NGSA-COUNT-2.3) to verify grain totals. There is a fact of the matter regarding whether 10,000 grains are present; Assessors shall resolve any counting discrepancy exceeding ±5 grains through re-count protocol NGSA-RCP-7.

  **4. Supervaluation Procedure & Admissible Precisifications (The "Definitive Heap" Episode):**  
  To ensure robustness against borderline cases near the DT, Circular NGSA/05/BorderlineReview instituted the **Definitive Heap Verification (DHV)**. A consignment qualifies as a *Definitive Heap* only if it is classified as a Heap under *every* Admissible Precisification of the term "Heap" as listed in the **Register of Admissible Heap Precisifications (RAHP), Annex Alpha (v.4)**. Initial RAHP (v.1) included 47 distinct precisifications (e.g., "Stable conical pile >30cm height," "Cannot be contained in standard sack NGSA-SACK-1," "Requires mechanical shovel for movement"). Result: 98.7% of consignments exceeding 50,000 grains failed DHV, crippling tariff revenue.

  **Resolution (NGSA/19/PrecisPanel):** The Precisification Oversight Panel determined RAHP (v.1) contained "excessively granular or contextually inapplicable" interpretations. RAHP (v.4) now lists **3 Admissible Precisifications:** P1 (Grain Count ≥ DT), P2 (Volume ≥ 1.25m³), P3 (Fails to pass through NGSA Sieve-Mesh G7). A consignment is a *Definitive Heap* only if it satisfies *all three* P1-P3. This restored operational viability while maintaining rigorous multi-perspective verification.

  **5. Degree-Theoretic Implementation & Heapiness Surcharge:**  
  Recognizing the administrative burden of DHV for consignments near the DT or failing only one precisification, Circular NGSA/12/Heap-DegreeImpl introduced **Partial Heap Status (PHS)** and **Heapiness Coefficient (HC)** calculation. HC is the mean percentage satisfaction of Admissible Precisifications P1-P3 (e.g., satisfying P1 & P3 yields HC=66.7%).  
  *   HC ≥ 90%: Classified as Heap (Full Schedule 7-B Duty)
  *   60% ≤ HC < 90%: Partial Heap Status (PHS). Duty = (Schedule 7-A Duty) + [(HC - 60%) / 30%] * (Difference between 7-B and 7-A Duty) + **Heapiness Surcharge (HS)** of 2.5%.
  *   HC < 60%: Non-Heap (Schedule 7-A Duty)
  **Note:** Appeals against the HS (e.g., Case 15-TR/456: *Midwest Grain Co. vs. Assessment Office 12*) are adjudicated solely on procedural grounds concerning HC calculation accuracy, not the validity or weighting of the surcharge itself. The 2.5% HS is non-negotiable and deemed essential for administrative cost recovery in complex PHS cases.

  **6. Higher-Order Borderline Review & Recursive Complexity:**
  Circular NGSA/05/BorderlineReview established **Tier-1 Borderline Review Boards (BRB-1)** to adjudicate cases where initial HC calculation falls between 55% and 65% (i.e., the HC borderline). BRB-1 determinations are final for HC assignment.

  However, Operational Notice ON/BRB/23-01 identified cases where the *initial HC itself was borderline to the BRB-1 threshold* (e.g., HC=54.9%, 65.1%). This necessitated **Tier-2 Borderline Review (BRB-2)** via Amendment NGSA/05/BorderlineReview-Add.2 to handle "borderline borderline" cases (initial HC between 52.5% and 57.5%, or 62.5% and 67.5%). BRB-2 rulings are final.

  **Current Issue (Memo BRB-2/Chairs/24-03):** Instances are emerging where initial HC falls between 52.4%-52.6% or 67.4%-67.6% – values borderline to the BRB-2 threshold. The BRB-2 Chairs Committee has formally requested guidance on establishing a **Tier-3 Borderline Review (BRB-3)** mechanism. The request is under review by the Precisification Oversight Panel (Reference: Docket POP/24/BRB3-REQ). Until resolved, BRB-2 is instructed to apply "enhanced scrutiny" using undefined "contextual factors" for these cases.

  **7. Inter-Departmental Variance & Routine Operation:**
  Assessment Office 3 (Portsmouth) and Customs Liaison Unit 7 (Handling bonded warehouse transfers) independently assessed Consignment DX-8892-OATS. AO-3, applying strict DHV (P1-P3), classified as Non-Heap (HC=83.3%, failing P2 volume). CLU-7, utilizing expedited assessment (Regulation CLU-7E: Grain Count ≥ DT suffices for bonded transfer tax), classified as Heap (10,212 grains > DT). Both classifications were entered into the Central Tariff Database (CTD) without conflict flags, as per Data Protocol CTD-DP/8: "Divergent classifications under distinct regulatory purposes do not constitute a data integrity error." Duty was levied under Schedule 7-A (final import) and Bonded Transfer Tax Bracket 4 (Heap rate) respectively. No administrative anomaly was recorded.

  **8. Status of Annexes & Recursive Amendment:**
  *   **Annex Alpha (RAHP v.4):** Active.
  *   **Annex Beta (HC Calculation Tables):** Active.
  *   **Annex Gamma (Procedures for BRB-3 Establishment):** Draft deferred pending outcome of Docket POP/24/BRB3-REQ and impact assessment requested by the Tariff Revenue Stability Committee (TRSC Ref: TRSC/24/GammaImpact). Expected completion: TBD (See NGSA/19/PrecisPanel-FN17).
  *   **Footnote 17 (NGSA/19/PrecisPanel):** "...further refinement of Admissible Precisifications may be necessary pending resolution of issues outlined in the deferred Annex Gamma to Circular NGSA/05/BorderlineReview-Add.2, itself contingent upon finalization of the degree-harmonization initiative proposed in NGSA/12/Heap-DegreeImpl-PropAmend (currently under review per TRSC Directive TRSC/22/DegHarm)."

  **9. Conclusion & Next Steps:**
  This memorandum consolidates current Heap classification procedures. All offices must implement Sections 1-7 immediately. The Harmonization Working Group (HWG/Heap) will commence review of the amendment trail (NGSA/87/Heap through NGSA/19/PrecisPanel and subsequent BRB directives) in Q3 2024 to identify opportunities for procedural streamlining, with a draft report due Q2 2025. This review cycle is established per Standing Order SO/HWG/5 (Annual Review of Recursive Regulatory Constructs).

  **Signed,**
  **Barnaby Thistlewaite**  
  Deputy Director, Standards Implementation  
  National Grain Standards Authority

  ---
  **Copy:** HWG/Heap, Precisification Oversight Panel, Borderline Review Board Chairs Committee, Tariff Reconciliation Board, Archives (For inclusion in Amendment Bundle Vol. VII: Heap Classification 1987-Present - *Pending Completion*)
