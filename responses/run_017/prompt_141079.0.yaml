  For the replacement stanza, I'll focus on the arbitrariness of the winning sperm. The multiplication stanza needs to show identical twins as counterexample. Fusion should present merged embryos without medical jargon. Upstream must imply infinite regress subtly. 

  Biggest challenge is the gamete-as-cell requirement. I'll use "tail's flicker" and "jostling swarm" for sperm imagery and "membrane" for the egg to emphasize physicality. The repeating lines will anchor the essentialist claim while changing context.

  Rhyme scheme: ABAB with slant rhymes (other/mother, divide/inside) to avoid forced language. The cyclical form makes the philosophical point itself - the claim returns unchanged despite contradictory evidence.

