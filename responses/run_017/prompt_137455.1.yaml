prompt: |-
  Something about the way the law treats our own future selves has been bugging me for a while, and I can't work out whether there's a coherent picture underneath it or whether it's just accumulated accident. Three things seem to be true at the same time in most rich countries:

  1. Cooling-off. If a salesperson signs you up at your front door, or you buy something online, you get a short window — a couple of weeks in Europe as far as I remember, a few days for doorstep sales in the US — in which you can cancel for no reason at all, no explanation needed. And the bit that gets me: you can't waive it in advance. You can't sign something at the door saying "I've been told about the cooling-off period and I don't want it." That clause is just void.

  2. Self-exclusion. If you tell a casino or a betting app that you want to be banned, they ban you, and as far as I can tell the ban sticks — you can't turn up the next evening, say you've definately changed your mind, and expect to be let in. In a bunch of places the operator gets in trouble if it lets you play, and if you do sneak back in and lose money you mostly can't get it back.

  3. Ordinary contracts are just binding. No waiting room, no change of heart. And if you write yourself a real Ulysses deal about your own future behaviour — I'll go to the gym four times a week and if I don't I owe my brother 500 — a court won't enforce it against you. Not because they disapprove, they just won't do it.

  So 1 and 2 both refuse to treat a moment of choice as final, but they push in opposite temporal directions: 1 protects the later self against the earlier one, 2 protects the earlier self against the later one, and 3 says the moment of choice is final after all.

  What I want is the implicit theory of agency, or of a person over time, that this only makes sense under — and I don't want "it's paternalism" as the answer, that's just a label. Concretely:

  - My guess is that it's a hot/cold hierarchy: the choice made in the calm, at-home, unpressured moment is the authoritative one, the choice made under pressure or in an aroused state gets discounted, and the law identifies which is which procedurally (where you were, how long you had, how much formality) rather than by looking at what you actually chose. Is that what the patchwork strictly presupposes, or is it just one story that fits nicely alongside others?

  - Could you derive the whole thing without believing in akrasia or hyperbolic discounting at all? Cooling-off is easy to explain by what doorstep sellers *do* to people, and self-exclusion by the fact that a casino makes its money from your reversal. If that's enough, the theory of the self is idle here. Is there any piece of the patchwork that only makes sense if genuine diachronic weakness of will is real?

  - Notice that in 1 and 2 the state regulates a counterparty — the seller has to refund you, the operator has to refuse you — and never punishes you. In 3 there's no counterparty and nothing happens at all. So does the practice really presuppose a view about the self, or only a view about relationships with people who profit from your hot moments?

  - The selectivity is the part I keep circling. Self-binding is enforced for a short, morally loaded list, basically gambling. If the cold self were really sovereign, you'd expect a general register where any adult can bind their future self about anything — no new debt, no alcohol, no quitting the band — enforced against anyone. No jurisdiction has one, as far as I know. What does that selectivity presuppose? Would a consistent version of the implicit theory have to start judging the *content* of what people bind themselves to, and what would such a scheme have to look like?

  - And the self-undermining bit: if people are present-biased, they're present-biased about signing up for protection too. Self-exclusion is opt-in; cooling-off isn't. Does the opt-in half of the patchwork defeat itself, and does that tell us the implicit theory is really about defaults and friction rather than about honouring anyone's authority?

  If it helps to make it concrete, run your reconstruction on this: someone takes out a payday loan on their phone at 11pm after a genuinely bad day, and wants out at 9am the next morning. There's no cooling-off right for that. If the same person had clicked self-exclude on a betting app, they'd be protected. What does that difference in treatment presuppose, and is there a version of the theory that makes it come out right?

  Tell me which features of the practice are doing the work, where it's philosophically underdetermined so that several theories would license it, and what would actually have to change in real institutions if a jurisdiction took the "cold self is sovereign" view seriously and applied it consistently — or took the opposite view, that every time-slice's choice counts equally.
reasoning: |-
  Okay, the user has presented a complex legal and philosophical puzzle about how different legal systems treat our future selves. They're noticing three seemingly contradictory approaches: cooling-off periods that protect later selves, self-exclusion schemes that protect earlier selves, and the non-enforcement of personal Ulysses contracts. 

  Hmm, this is fascinating because it reveals how law navigates temporal agency without a coherent theory. The user clearly wants more than just "paternalism" as an explanation - they're probing the underlying assumptions about human psychology and time-consistent identity. Smart framing with that payday loan vs betting app comparison too.

  Let me break this down systematically. First, the hot/cold state hypothesis seems central - legal systems do appear to privilege "cold" decisions made in low-arousal states. But as the user suspects, it's not consistent. Why enforce casino self-bans but not gym contracts? The profit motive distinction jumps out: the law intervenes when third parties exploit state-dependent preferences. 

  The selectivity point is particularly damning. If cold selves were truly sovereign, we'd see personal commitment registries for all behaviors. Instead, we get narrow carve-outs for morally charged domains like gambling. That suggests the law isn't really about honoring temporal preferences - it's about preventing exploitation in contexts society deems harmful. 

  For the payday loan example, the absence of cooling-off speaks volumes. The law implicitly says: "We'll stop casinos exploiting your weakness, but not lenders - because we've politically normalized debt." That's not philosophical consistency; it's path-dependent moralism.

  What the user might really be circling is whether law should take behavioral economics seriously. If we admitted hyperbolic discounting is real, we'd need a general precommitment infrastructure. But that would require judging the "goodness" of commitments - a slippery slope. 

  The institutional implications are striking. A truly cold-self-sovereign system would need commitment registries with state enforcement. But imagine the nightmare of adjudicating "was this gym contract signed in a cold state?" We'd recreate all the problems of insanity defenses. 

  Alternatively, a pure time-slice equality model would eliminate both cooling-off and self-exclusion. That feels brutally libertarian but internally consistent. The current patchwork survives precisely because it avoids these extremes - messy but politically sustainable. 

  Ultimately, the user's frustration is justified: the system isn't philosophically grounded. It's behavioral economics weaponized selectively against disfavored industries, sprinkled with moral panic about gambling. Brilliant question that exposes how law disguises value judgments as psychology.
answer: |-
  Your dissection reveals a profound tension in how legal systems conceptualize agency over time. The implicit theory isn't coherent philosophy—it's a pragmatic, morally selective patchwork built on behavioral realism, institutional distrust, and normative judgments about "harmful" contexts. Here's how the pieces fit and where they fracture:

  ### The Core Framework: Procedural Paternalism
  - **Hot/Cold Hierarchy as Default Heuristic**: Yes, the law *procedurally* privileges "cold" decisions (home, no pressure, no immediate temptation) over "hot" ones (doorstep, casino floor, emotional distress). But it does so **selectively**, only when:
    1. **Asymmetric Harm Exploitation** exists (sellers/casinos profit from your hot-state decisions)
    2. **Socially Undesirable Outcomes** are implicated (debt spirals, gambling addiction)
    3. **Low-Cost Enforcement** is feasible (refunds/exclusions are cheaper than adjudicating intent)
  - **Akrasia is Pragmatically Assumed, Not Philosophically Required**: The system *functions* as if hyperbolic discounting is real, but its architecture relies on **institutional incentives**, not metaphysical commitments. Cooling-off periods combat high-pressure sales tactics; self-exclusion combats an industry designed to trigger relapse. The theory of self is a *justification*, not the operative mechanism.

  ### Key Selectivity Explained
  | Feature                 | Cooling-Off (e.g., Doorstep Sales) | Self-Exclusion (e.g., Casinos) | Ulysses Contracts (e.g., Gym Penalties) |
  |-------------------------|------------------------------------|--------------------------------|------------------------------------------|
  | **Why Protected?**      | Vulnerability to pressure          | Vulnerability to addiction     | No third-party exploiters               |
  | **State Interest**      | Consumer market fairness           | Preventing severe social harm  | None (private discipline unenforced)    |
  | **Enforcement Cost**    | Low (refund)                       | Moderate (exclusion tech)      | High (monitoring/adjucating compliance) |
  | **Moral Load**          | Low ("unfair tactics")             | High ("pathological behavior") | Neutral                                 |

  **Why No General Precommitment Registry?**
  - **Fear of Paternalist Overreach**: Enforcing all self-binding contracts would require the state to judge the "reasonableness" of commitments (e.g., "Is $500/week for skipping gym excessive?"). This violates liberal neutrality.
  - **Practical Nightmare**: Monitoring compliance (did you *really* go to the gym 4x/week?) is resource-prohibitive.
  - **Moral Selectivity**: Society condemns gambling as a *social harm*, not just a personal choice. Payday loans (often predatory) lack similar cooling-off rights because debt is culturally normalized, despite comparable behavioral dynamics.

  ### The Payday Loan vs. Gambling Exclusion Paradox
  - **Your Example**: 11pm payday loan → no cooling-off; but a self-excluded gambler *would* be protected. This inconsistency exposes the system's moral core:
    - **Gambling** is treated as an *irrational compulsion*. The "cold self" banning future play is seen as authentically rational.
    - **Debt** is treated as a *rational choice*, even under duress. The law assumes borrowing reflects "real" preferences, ignoring behavioral science.
    - **Institutional Capture**: Payday lenders lobby against cooling-off; casinos accept self-exclusion as harm reduction to avoid stricter regulation.

  ### Philosophical Underdetermination & What Changes
  **If "Cold Self is Sovereign" Consistently Applied:**
  - A **General Precommitment Registry** emerges: Bind yourself to no alcohol, savings goals, etc.
  - **State Enforcement of Private Penalties**: Courts enforce your $500/gym-skip clause.
  - **Cooling-Off Rights Expand**: Payday loans, timeshares, even marriage licenses get rescission periods.
  - **Problem**: Who decides which "self" is "cold"? (Signing a lifetime gym contract at 20 might be "hot" with youthful optimism).

  **If "Every Time-Slice Counts Equally":**
  - **No Cooling-Off Periods**: Your doorstep signature is final.
  - **No Self-Exclusion**: Casinos let you play if "current you" demands it.
  - **Radical Autonomy**: Your 3am gambling spree is as valid as your morning regret.
  - **Problem**: Ignores how environments manipulate preferences; enables exploitation.

  ### The Self-Undermining Opt-In Problem
  - **Self-exclusion relies on cold-self initiative**, but present-biased individuals underinvest in precommitment. Yet making it opt-out (e.g., "You're excluded unless you opt-in weekly") would be politically untenable and feel coercive.
  - **Cooling-off is opt-out (automatic)**, reflecting distrust of industries, not individuals. This asymmetry confirms: **the system prioritizes preventing exploitation over maximizing autonomy**.

  ### Conclusion: The Implicit Theory
  The law's approach presupposes:
  1. **Time-Inconsistent Preferences Are Real** (but only in state-sanctioned "vulnerable" contexts).
  2. **Profiteering from Weakness is Legitimacy's Limit**: When others exploit your temporal instability, the state intervenes; private self-binding gets no aid.
  3. **Proceduralism Over Substance**: It's easier to define "doorstep" or "casino" than prove cognitive states, making location/formality proxies for "hot" vs. "cold."
  4. **Moralized Paternalism**: Protection applies only to harms society collectively condemns (gambling), not universally (debt, procrastination).

  **To fix the payday loan inconsistency?** A consistent theory would either:
  - Extend cooling-off to all high-interest/short-term credit (acknowledging universal behavioral vulnerability), *or*
  - Scrap gambling self-exclusion as paternalist overreach (treating addiction as choice).

  But the status quo persists because **selectivity serves power**: it targets "deviant" vices (gambling) while normalizing economically "useful" vulnerabilities (debt). The philosophical cracks are features, not bugs.
