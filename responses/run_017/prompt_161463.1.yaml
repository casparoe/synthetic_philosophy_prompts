answer: |-
  ### 1. Exam Question  
  **Philosophy of History Final Paper**  
  **Time:** 45 minutes  
  **Word Limit:** 900 words  
  **Marks:** 25  

  **Question:**  
  The charge of "presentism" in historiography is often levied as a blanket critique, but it masks distinct practices. Using the two cases below and the *Retrospective Parity Principle* (RPP)—*"Apply to past agents only those standards you would be willing to have a better-informed historian of the twenty-second century apply to you"*—address the following:  

  1. Distinguish **moral-evaluative presentism** (appraising past agents by current moral norms), **epistemic presentism** (appraising them by current knowledge they lacked), **explanatory presentism** (explaining past events by their outcomes), and **agenda presentism** (prioritizing topics based on present concerns). For each, identify which standard objections (e.g., anachronism, unfairness, distortion) actually apply, and explain why verdicts may differ across types.  

  2. Test the RPP’s viability as a constraint:  
     - Does a **strong reading** (forbidding condemnation if we cannot foresee future critiques of our actions) paralyze all moral judgment?  
     - Does a **weak reading** (permitting condemnation only when we are certain our actions are blameless) collapse into permitting the condemnations it aims to block?  
     - Is the RPP fundamentally unstable?  

  3. The claim that "agents who could not have known better are not blameworthy" is a present-day norm projected onto the past. Does applying this norm to *itself* (i.e., accepting that future historians may reject it) undermine it, or is this self-application benign?  

  4. Is describing past practices with later vocabulary (e.g., "structural racism" for pre-20th century societies, "genocide" for pre-1944 events) objectionable presentism or a legitimate description of *avant la lettre* realities? What hinges on the answer?  

  **Apply your analysis to these cases:**  
  - **Case A:** An elected legislator in a slaveholding society (late 1850s) votes to extend chattel slavery, defending it in religious terms, despite widespread circulation of abolitionist arguments.  
  - **Case B:** A public-health official licenses a sedative for pregnant women based on contemporaneous evidence; severe birth defects are causally linked only years later.  

  For each case, specify:  
  - Which type(s) of presentism are at stake.  
  - Whether they are objectionable and why.  
  - Why the cases differ (or align) in their vulnerability to presentist critiques.  

  **Instructions:**  
  - No credit for naming authors/texts.  
  - "Presentism" here concerns historiography, **not** the metaphysical thesis that only present things exist.  

  ---

  ### 2. Model Answer (798 words)  
  **The Unstable Scaffolding of Retrospective Judgment**  
  Presentism is not one error but four distinct practices, each demanding separate assessment. Moral-evaluative presentism (judging past agents by current morals) risks anachronism but is defensible when past agents had access to countervailing views. Epistemic presentism (judging by current knowledge) is nearly always illegitimate, as it ignores agents’ epistemic constraints. Explanatory presentism (framing events through outcomes) distorts causality and is generally objectionable. Agenda presentism (selecting topics by present concerns) is often legitimate—even unavoidable—provided it acknowledges context. Crucially, objections like "unfairness" apply only to moral/epistemic types; agenda presentism faces no such charge.  

  The Retrospective Parity Principle (RPP) fails as a constraint. Its strong reading—that we cannot condemn past agents because future historians might condemn us for unforeseen consequences—renders all moral judgment impossible. If we cannot condemn the legislator in Case A because future agents might condemn our use of fossil fuels, we abandon ethics to epistemic fatalism. Conversely, the weak reading—condemn only when certain our own actions are blameless—permits condemning past agents who *were* blameless *by their lights*. For Case B, this would absurdly allow condemning the official (since we deem our drug regulations "blameless") despite her epistemically justified decision. The RPP thus oscillates between overblocking and underblocking condemnation, proving unstable.  

  This instability exposes a deeper flaw in the act/agent gap. Claiming "the legislator’s act was wrong, but he isn’t blameworthy because he couldn’t have known better" relies on a *present-day* norm excusing ignorance. When RPP is applied reflexively, future historians may reject this norm (e.g., "Your climate inaction was inexcusable despite not knowing all consequences"). If our excuse hinges on norms future historians might discard, the "blameless agent" escape hatch self-destructs. We must either defend our norms as transhistorically valid (risking circularity) or abandon the gap. The latter is preferable: we can condemn acts like slaveholding as morally wrong *simpliciter* while recognizing that blameworthiness requires context-sensitive *feasibility* (e.g., social risk, epistemic access).  

  Later vocabulary (e.g., "structural racism" for pre-Civil War societies) is legitimate if it accurately describes mechanisms that existed independently of contemporary concepts. Calling plantation economies "structurally racist" is defensible because power hierarchies mapped onto race, even if actors lacked the term. It becomes objectionable only if it implies historical actors shared our *diagnostic framework*. The test is whether the term elucidates objective structures without projecting reflexive awareness.  

  **Cases Applied:**  
  - **Case A (Legislator):** Moral-evaluative presentism is *legitimate* here. The legislator defended slavery when abolitionist arguments (moral and religious) were widely available. Condemning his vote is not anachronistic; it appeals to standards accessible in his time. Agenda presentism (studying him to critique systemic oppression) is also legitimate. Explanatory presentism would be objectionable if we framed his vote *solely* as causing the Civil War. The RPP fails to constrain condemnation because the legislator’s moral failure occurred despite accessible alternatives.  
  - **Case B (Official):** Epistemic presentism would be *illegitimate*—condemning her for lacking future knowledge is unfair. Moral-evaluative presentism is equally misplaced; she acted on best evidence. Agenda presentism (studying her case for regulatory reforms) is legitimate. The RPP’s weak reading crumbles here: we cannot condemn her without hypocrisy, as we accept that drug approvals carry inherent uncertainty.  

  The cases diverge sharply. Case A permits moral-evaluative presentism because the legislator ignored contemporaneous moral alternatives; Case B forbids it because the official had no such alternatives. The RPP cannot mediate this distinction—it either censors all judgment (strong reading) or licenses presentism selectively (weak reading).  

  The honest historian is left entitled to evaluate past acts by current moral standards *when those standards were within the historical horizon*, to use later vocabulary *descriptively* for *avant la lettre* realities, and to let go of the blameworthiness excuse—for it is a scaffold that collapses under its own weight.  

  ---

  ### 3. Marking Scheme  

  | Point | Marks | What an A answer does | What a B answer does instead | Error caught |
  |-------|-------|------------------------|------------------------------|-------------|
  | 1. Distinguishes all four presentism types with distinct verdicts and targeted objections. | 6 | Nuanced analysis: e.g., agenda presentism uncontested; epistemic universally illegitimate; moral contested. | Treats presentism monolithically or omits one type; objections not type-specific. | Treating presentism as one error (Failure Mode i). |
