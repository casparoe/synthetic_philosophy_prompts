  | 5. Analyses both cases, identifying the kind(s) of presentism in play and whether objectionable, and explains the difference between them. | 4 | For each case, identifies the relevant presentism (e.g., moral-evaluative in A, epistemic in B) and explains why A allows evaluative presentism (due to available alternatives) while B does not. | Describes the cases but does not clearly link to the presentism types, or treats the cases similarly without justifying the difference. | Failing to use the cases to illustrate the distinctions or to show why they differ. |

  **Withholding Marks:**  
  No marks are awarded for general definitions of presentism, for the argument that presentism is unavoidable and therefore not a fault (unless the inference from situatedness to incurability is itself criticized), or for naming authors or texts. Answers that only recite the standard anti-presentist canon (e.g., against Whig history) without engaging the distinctions or cases will not earn marks for Points 1-5.

  **Script Classifications:**  
  - **First-class (70+%):** Nuanced analysis that distinguishes the four presentisms, critically dismantles RPP, confronts the self-application problem, and uses the cases to show why moral-evaluative presentism is sometimes legitimate.  
  - **Upper-second (60-69%):** Covers all points but with less depth, especially in critiquing RPP or the self-application issue, or with minor errors in applying the cases.  
  - **Third-class (40-49%):** Superficial treatment, such as repeating the standard anti-presentist line without engaging the distinctions, or missing key elements like RPP or the cases.  

