  ## Part 1: The Question

  **Final Examination Question**

  **Philosophy of History Seminar**

  **Time Allowed:** 45 minutes  
  **Word Limit:** 900 words  
  **Marks:** 25

  **Instructions:**  
  Answer the following question. Do not waste words on defining presentism generally; focus on the distinctions and cases set out. No credit is given for naming authors or texts. Avoid any discussion of presentism as a metaphysical thesis about time; it is irrelevant here.

  **Question:**  
  Presentism in historiography is often treated as a single error, but the term in fact covers distinct practices. Consider the following two cases:

  > **Case A:** In the late 1850s, in a slaveholding society, an elected legislator votes to extend chattel slavery and defends this vote in explicitly religious language, at a time when abolitionist arguments were in wide circulation.  
  > **Case B:** A public-health official licenses a sedative for use by pregnant women on the evidence available at the time, where the causal link to severe birth defects is not established until years later.

  Using these cases, and drawing on the *Retrospective Parity Principle* (RPP) stated below, address the following:

  1. Distinguish at least four kinds of presentism: moral-evaluative (appraising past agents by our moral norms), epistemic (appraising them by what we know now but they could not), explanatory/teleological (explaining a past episode by where it ended up), and agenda presentism (choosing what to study because of present concerns). For each kind, say which of the standard objections to presentism (e.g., anachronism, unfairness, distortion) actually apply, and note that the verdict might differ across kinds.

  2. Apply the RPP to both cases. The RPP states: *Apply to past agents only those standards you would be willing to have a better-informed historian of the twenty-second century apply to you.* Assess whether the RPP is a genuine constraint. In particular, consider:
     - Does a strong reading (forbidding any condemnation because we cannot foresee the downstream consequences of our own actions) make it impossible to condemn anything?
     - Does a weak reading (allowing condemnation only when we are certain our own actions are blameless) collapse into permitting the very condemnations it was meant to block?
     - Is the RPP unstable as a middle way?

  3. Address the gap between judging an act and blaming an agent. The claim that agents who could not have known better are not blameworthy is itself a normative claim we hold now. Does this self-application of our norms undermine the escape hatch that excuses agents for acts we condemn? Show why this self-application might be benign or why we must abandon the escape hatch.

  4. Discuss whether describing an earlier practice with a concept or term that did not then exist (e.g., "structural racism" for pre-20th century practices, or "genocide" for pre-1944 events) is objectionable presentism or a legitimate description of something that existed *avant la lettre*. What does the answer depend on?

  Conclude by explaining, for each case, which kind(s) of presentism are in play and whether they are objectionable, and why the two cases come out differently or the same.

  ---

  ## Part 2: Model Answer (Approx. 800 words)

  **Model Answer**

  The charge of presentism in historiography is not a single indictment but a cluster of distinct concerns. By disentangling moral-evaluative, epistemic, explanatory, and agenda presentism, we can see that the objections to each vary, and the Retrospective Parity Principle (RPP) — while initially appealing — fails to provide a stable middle ground. Moreover, the attempt to excuse agents by appealing to their historical context is itself a presentist move that undermines the very escape it offers. Yet, using later vocabulary to describe past practices is sometimes legitimate, provided it captures an underlying reality without implying contemporary self-awareness. In the two cases, the key difference lies in the availability of alternative views at the time, making moral-evaluative presentism defensible in Case A but not in Case B.

  First, the four kinds of presentism. Moral-evaluative presentism (judging past agents by our moral standards) faces the objection of anachronism and unfairness — but only if we fail to separate the act from the agent. Epistemic presentism (judging past agents by what we know now) is almost always illegitimate because it ignores the agent’s epistemic context. Explanatory presentism (explaining past events by their outcomes) distorts historical understanding by reading history backwards and is generally objectionable. Agenda presentism (selecting topics based on present concerns) is often legitimate, even necessary, for history to be relevant, unless it leads to ignoring context or cherry-picking evidence. Thus, the standard objections do not bite uniformly.

  The RPP — apply to past agents only standards we would accept from future historians — seems a fair constraint. But under scrutiny, it unravels. A strong reading forbids any moral condemnation because we cannot guarantee that future historians, with more information, won’t condemn our own actions for consequences we cannot foresee. This paralyzes moral judgment entirely. A weak reading allows condemnation when we are confident our own actions are blameless by current standards. But this permits condemning past agents who, by their own standards, were blameless — precisely the presentism RPP was meant to block. The principle is unstable: it either forbids too much or permits too much, and is no middle way.

  This instability exposes a deeper problem in the act/agent gap. We often say that while we condemn the act of slaveholding, we do not blame the agent who “could not have known better.” But this excuse depends on a presentist norm: we now value epistemic constraints as exculpatory. If a future historian applied RPP to us, they might reject our excuse because, by their norms, ignorance is no defense. Thus, the escape hatch self-destructs: it relies on a norm we project, which future historians may not share. The only consistent position is to abandon the agent-blaming project entirely and focus on act-evaluation by our own best standards, while acknowledging that our standards are provisional.

  Regarding later vocabulary: using terms like “structural racism” for pre-20th century societies is legitimate if it accurately describes systemic injustices that existed, even if contemporaries lacked the concept. The test is whether the term captures features of the past without implying that historical actors shared our analysis. It becomes presentist only if it projects modern frameworks onto past agents’ motivations or understandings.

  Applying this to the cases:

  - **Case A (Legislator):** Moral-evaluative presentism is defensible here. The legislator votes to extend slavery when abolitionist arguments were widely available. We can condemn the act as morally wrong by our standards — and by standards accessible then — without needing RPP. The act is blameworthy because alternatives were known. Explanatory presentism might arise if we frame the vote as leading to the Civil War, but that would be distorting. Agenda presentism is legitimate if we study this to understand systemic injustice.

  - **Case B (Public-health official):** Epistemic presentism would be illegitimate. The official acted on the best evidence at the time; condemning the act based on later knowledge is unfair. Moral-evaluative presentism is inappropriate because the official lacked the information to foresee harm. Agenda presentism is acceptable if we study the case to improve current drug regulation.

  The cases differ because Case A involves a moral failure in the face of available knowledge, while Case B involves an epistemic limitation. The RPP fails to capture this difference because it focuses on future uncertainty rather than past constraints.

  In conclusion, the honest historian is left entitled to evaluate past acts by current moral standards when those standards were within reach of historical agents, to use later vocabulary descriptively when it illuminates past realities, and to let the past challenge present certainties — but not to excuse moral failures that were avoidable then.

