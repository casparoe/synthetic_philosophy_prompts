answer: |-
  ## Comprehensive Exam Question: Moral Responsibility  
  **Time:** 60 minutes  
  **Marks:** 20  

  > **Galen Strawson’s Basic Argument concludes that moral responsibility (in a desert-entailing sense) is impossible because true responsibility for an act requires ultimate responsibility for one’s character, initiating an infinite regress that cannot begin. However, suppose an agent engages in "ampliative self-creation": through deliberate actions (e.g., resolving akrasia, adopting unifying policies), she progressively reorganizes her motives, increasing the structural coherence and agential transparency of her character. This raises her "degree of self-determination" for later acts—even if it never reaches 1—without requiring *causa sui*.**  
  >  
  > **(a) What is the *crucial difference* between a *vicious* regress (which undermines responsibility) and a *benign* regress (which preserves scalar responsibility) in this model? Specifically, why might Strawson insist amplification fails if the "base" lacks responsibility, while proponents claim structural reorganization breaks the regress? (10 marks)**  
  >  
  > **(b) Could such scalar responsibility deliver the *desert* Strawson deems impossible, or does it offer a *non-desert-based substitute* (e.g., appraisal of agential architecture)? Defend your view by analyzing whether "degree of self-determination" tracks *ultimate authorship* or *non-ultimate agency cultivation*. (10 marks)**  
  >  
  > *Avoid discussing determinism, luck, or standard compatibilism. Focus on the regress structure and desert conditions.*  

  ---

  ### Model Answer (Approx. 700 words)  
  **(a)** The Basic Argument’s regress is vicious if responsibility requires *total self-causation* at each prior step. Strawson contends that if the initial character-forming state (S1) lacks responsibility (e.g., it’s genetically/causally given), then no downstream state (S2, S3...) can inherit responsibility—amplification multiplies "zero responsibility" indefinitely. This assumes responsibility is *conserved*: later acts merely reconfigure elements from S1, so no *new agential source* emerges. The regress is benign only if reorganization generates *novel agential structure*. For example, adopting a meta-policy to resolve akrasia isn’t reducible to preexisting motives; it creates a top-down constraint altering how motives function. If such structures *emerge from* but are *not determined by* prior states—say, by introducing globally sensitive commitments—they break conservation. Responsibility then accrues scalarifically: S1 has near-zero self-determination, but S4 (after reorganization) expresses the agent *more fully* because her motives now align with her self-ascribed policies. The hinge is whether structural novelty permits *non-conserved responsibility*. Strawson denies this, insisting all reorganization is "rearranging pre-given furniture"; proponents argue emergent constraints transform the agent’s relation to her motives.  

  **(b)** Scalar responsibility cannot deliver desert in Strawson’s sense but offers a robust surrogate. Desert requires *ultimate origination*: the agent must be the absolute source of her character "all the way down." Ampliative self-creation rejects ultimacy; it accepts that the "base" is not self-caused. Instead, it tracks *agential depth*: how integrated, coherent, and self-governed the motive-set is *at a time*. For instance, an act flowing from a conflict-resolving policy (installed via past efforts) reflects the agent’s cultivated agential identity more than a pre-reorganization impulsive act. This justifies *praise/blame* for maintaining or violating self-ascribed norms—but as *appraisal of self-cultivation*, not desert grounded in *metaphysical authorship*. Strawson could accept this surrogate, as it demands no *causa sui*. However, it "changes the subject": desert targets *why an agent exists as she is*, while scalar responsibility targets *how she governs her given traits*. The latter fits non-retributive practices (e.g., therapies encouraging responsibility-taking), but not punitive desert. If desert entails "the agent *could have ultimately been otherwise*," amplification fails; if it entails "the agent *owns* her acts via nested self-shaping," amplification succeeds—but only by redefining ownership.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points with mark allocation and common errors:**  
  1. **Vicious vs. benign regress distinction (4 marks):**  
     - *Hit:* Vicious regress requires conserved responsibility; benign regress requires non-conserved emergence (e.g., structural novelty breaking transmission).  
     - *Common error:* Claiming "vicious = infinite steps" without addressing conservation/emergence.  

  2. **Role of structural novelty (4 marks):**  
     - *Hit:* Explains how policies/meta-commitments create new agential constraints irreducible to prior motives.  
     - *Common error:* Conflating reorganization with standard compatibilist "control" (e.g., reasons-responsiveness).  

  3. **Strawson’s "zero base" objection (4 marks):**  
     - *Hit:* Reconstructs Strawson’s claim that non-responsible origins prevent downstream responsibility regardless of amplification.  
     - *Common error:* Ignoring the objection or reducing it to determinism.  

  4. **Desert vs. surrogate analysis (4 marks):**  
     - *Hit:* Distinguishes *ultimate authorship* (desert) from *agential cultivation* (surrogate); notes desert requires ultimacy.  
     - *Common error:* Asserting scalar responsibility "is desert" without addressing ultimacy.  

  5. **Non-compatibilist focus (4 marks):**  
     - *Hit:* Treats amplification as distinct from compatibilism (e.g., it addresses regress, not determinism).  
     - *Common error:* Drifting into consequence argument or control-based compatibilism.  

  **Distinguishing A from B answers:**  
  A answers (18–20 marks) identify the *conservation of responsibility* as the crux of the regress debate and rigorously tie "agential depth" to structural emergence, not control. They explicitly contrast *ultimacy* (for desert) with *cultivated ownership* (for surrogate). B answers (15–17 marks) correctly summarize amplification and Strawson’s objection but miss the metaphysical hinge (conservation/emergence) or conflate desert with appraisal. Lower marks fail to engage the regress structure or lapse into determinism.  

  ---  
  **Note on your objection:** Your "structural novelty" move has force but risks *regress reemergence*: who is responsible for installing the *first* policy? A strong model requires that *minimal agency* (e.g., evaluative judgment) exists at baseline—not full responsibility, but enough to bootstrap amplification. The revised question above avoids presupposing this works, framing it as the debate’s hinge.
