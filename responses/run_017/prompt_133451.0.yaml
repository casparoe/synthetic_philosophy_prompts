answer: |-
  Here's your Q&A prep sheet - designed for rapid reference during the colloquium. Prioritized by damage potential, with tactical responses.

  **Core Defense Strategy:**
  *   **Hold the Line:** The **scope-tracking condition** is non-negotiable. This distinguishes proxy assertion from mere transmission & enables the norm.
  *   **Pre-empt the Weakness:** Volunteer that the **"transmissible store" is underspecified** (how tracked? granularity?) but argue the *concept* is indispensable for capturing delegation. Use translator/lawyer examples.
  *   **Fear This Question:** *"If the principal's 'transmissible store' isn't their beliefs/knowledge, and S isn't vouching based *on their own* reasons/knowledge, *what exactly is the source of normative force for the hearer?* Why should they accept this as an assertion?"* (Combines reductionist, anti-reductionist, & speech-act worries).

  ---

  **Prep Sheet: Q&A Tactics**

  1.  **Objection (Legal Epistemologist):** "This sounds like reinventing the wheel. Legal doctrines of actual/apparent authority and hearsay exceptions *already* define when an agent's speech binds a principal or is admissible as evidence. Why isn't this just applying agency law to speech acts?"
      *   **Reply:** "Great point! Legal frameworks are crucial *instances* validating the *need* for delegated norms. But my aim is *conceptual*: what *makes* such speech an *assertion* (not just admissible evidence)? Law often presumes assertion exists first. My norm explains *why* authorized proxy speech *is* assertoric force, grounding legal doctrines in speech-act theory."
      *   **Soft Spot:** Conflates normative grounding with legal codification. Doesn't fully address why this *is* assertion *per se*.
      *   **Concession (Final Slide):** "Legal doctrines powerfully *instantiate* delegated norms but presuppose the underlying speech-act category."

  2.  **Objection (Philosopher of Language):** "This 'transmissible store' is hopelessly vague. Is it literal wording? Propositions? How does it handle paraphrase, implicature, or context shift? If S slightly rephrases P's memo, is it still 'in the store'? This seems like a reified fiction."
      *   **Reply:** "Agreed, individuation is hard! The store isn't Platonic; it's *pragmatically constituted* by P's endorsements *and* the role's conventions (e.g., translators have leeway, press secretaries less). Scope-tracking governs S's responsibility for navigating *this* fuzziness – hedging if unsure. It's messy like real institutional speech."
      *   **Soft Spot:** Relies heavily on vague "pragmatic constitution" and S's judgment. Needs more on store boundaries.
      *   **Concession (Final Slide):** "The transmissible store's boundaries *are* context-dependent and pragmatic, not atomistic propositions."

  3.  **Objection (Speech-Act Theorist):** "You've described a complex act of *delegated reporting*, but not *assertion*. Assertion requires the speaker *themselves* staking their own commitment/credibility based on *their own* reasons. Here, S is just a conduit – they aren't *asserting*, they're *transmitting* P's stance."
      *   **Reply:** "S *is* committing – not to the *truth* based on their own reasons, but to *accurately representing P's authorized stance within scope*. They stake *their* credibility *as a reliable proxy*. That *is* a distinct assertoric commitment characteristic of institutional roles."
      *   **Soft Spot:** Challenges core definition of assertion. Requires insisting "commitment to accurate representation *as proxy*" *is* a genuine assertoric commitment type.
      *   **Concession (Final Slide):** "Proxy assertion *is* a distinct subspecies of assertion, governed by a specialized norm."

  4.  **Objection (Reductionist Testimony Theorist):** "This is just standard testimony with extra jargon. The hearer's warrant *still* reduces to their evidence: evidence about S's role, P's reliability, and S's reliability *as proxy*. The 'delegated norm' doesn't add irreducible warrant; it just describes the *source* structure."
      *   **Reply:** "The *norm governing S* differs crucially. S isn't required to have personal knowledge/reasons for *p*'s truth, only for *p* being in P's store and within scope. The hearer's *warrant* might reduce (as you say), but the *speaker's obligation* does not reduce to knowledge/truth/reasonable belief norms – hence the need for a new norm."
      *   **Soft Spot:** Grants reductionism on hearer warrant; fight is over *speaker norm*. Risk: reductionist says speaker norm *also* reduces to S's evidence about role/store.
      *   **Concession (Final Slide):** "The *hearer's* warrant may well be reducible; the novelty is the distinct *speaker norm*."

  5.  **Objection (Formal Epistemologist):** "Why invoke 'assertion' and 'norms'? This looks like a principal P has a credence function (their 'store'), they delegate calibration of a listener L's credence to agent S via some noisy channel (S's scope-tracking ability). The 'norm' is just minimizing expected inaccuracy of L's updated credence w.r.t. P's. Speech acts are superfluous."
      *   **Reply:** "Formal models are great for *describing* information flow! But they don't capture the *illocutionary force* or *responsibility*. Why is S *blameworthy* for misrepresenting P's stance even if L's credence ends up accurate? The delegated norm explains the *distinctive responsibility* that makes this *assertion*, not just signal transfer."
      *   **Soft Spot:** Formal approach *can* model blame via scoring rules on S's *representation* of P's stance. Needs to argue normativity of assertion adds something essential.
      *   **Concession (Final Slide):** "Formal models excellently describe the *information transfer* aspect; the norm captures the *distinctive responsibility* of assertion."

  6.  **Objection (Anti-Reductionist Testimony Theorist):** "You avoid the core testimony question! What *entitles* the hearer to accept the proxy's word *without* reducing it to their own evidence? If S isn't vouching based on personal knowledge, and P isn't present, why isn't this just an invitation to check S's credentials, defeating any default entitlement?"
      *   **Reply:** "The entitlement stems from the *institutional role and its authorization* (Condition 2). In well-functioning contexts (court, official press briefing), occupying role S *just is* being authorized to speak for P, creating a *presumptive* entitlement for the hearer *to take this as P's stance*, analogous to default entitlement for direct assertion. Scope-tracking ensures S is gatekeeping."
      *   **Soft Spot:** Pushes the "default" down a level (to institutions/roles). Needs justification for *that* default being irreducible.
      *   **Concession (Final Slide):** "Hearer entitlement in proxy cases *may* depend more on institutional trust than in direct testimony."

  7.  **Objection (Political Philosopher / Generalist):** "This feels tailored to formal roles (press sec, lawyer). What about looser 'proxy' assertions? A friend saying 'The team thinks your idea is bad'? Or an activist 'speaking for' a movement? Does your norm apply? If not, how useful is it?"
      *   **Reply:** "Core cases are explicit institutional delegation precisely because authorization and scope are clearer. Looser cases exist on a spectrum. Does your friend have *authorization*? Is there a defined 'store'? Scope-tracking becomes harder. These might be *partial* or *defective* proxies, showing why the strict norm is foundational. The lab-statement example fits."
      *   **Soft Spot:** Norm may seem overly restrictive. Needs to argue paradigmatic cases define the type.
      *   **Concession (Final Slide):** "The delegated norm is clearest in formal institutional proxies; informal cases may be derivative or hybrid."

  8.  **Objection (Annoyed Generalist):** "You bait-and-switched with the AI example! If LM output isn't proxy assertion, and you barely discuss what *would* satisfy delegation, why start with it? It feels like trendy pandering irrelevant to the philosophical core on speech acts."
      *   **Reply:** "Fair! The AI case *motivates* the gap the paper fills: why LM output *isn't* easily classifiable under standard norms *or* proxy assertion. The core *is* the proxy assertion framework. The AI hook highlights the *consequence*: without meeting the delegation conditions (especially scope-tracking by a responsible agent), it's *not* assertion. I'll elaborate on the delegation requirements for AI in future work."
      *   **Soft Spot:** Valid criticism of paper structure. Deflection needed.
      *   **Concession (Final Slide):** "The AI example served primarily to highlight a gap in standard norms; the core contribution is the proxy assertion framework itself."

  **Final Slide Concession Summary:**
  *   "Legal doctrines *instantiate* delegated norms but presuppose the speech-act category."
  *   "The transmissible store's boundaries *are* context-dependent and pragmatic."
  *   "Proxy assertion *is* a distinct subspecies of assertion."
  *   "The *hearer's* warrant may be reducible; novelty is the distinct *speaker norm*."
  *   "Formal models describe *information transfer*; the norm captures *assertoric responsibility*."
  *   "Hearer entitlement *may* depend more on institutional trust."
  *   "The norm is clearest in formal proxies; informal cases may be derivative."
  *   "The AI example highlighted a gap; the core contribution is the proxy framework."

  **Deployment Notes:**
  *   **Lead with Examples:** Constantly anchor replies in press secretaries, lawyers, translators.
  *   **"Scope-Tracking" is Your Shield:** Emphasize how this condition prevents collapse into simple reductionism or transmission. Use it actively in replies (e.g., "That's *why* scope-tracking is crucial...").
  *   **Pre-empt Transmissible Store Vagueness:** Briefly volunteer its underspecification early, then pivot to its functional necessity in examples.
  *   **AI Dodge:** Acknowledge the point quickly, concede it wasn't the paper's focus, reaffirm the core framework. Don't get drawn into AI specifics.
  *   **Body Language:** Project confidence on scope-tracking and the core distinction of proxy assertion. Acknowledge concessions openly and move on.
