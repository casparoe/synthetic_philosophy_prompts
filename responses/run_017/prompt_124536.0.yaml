prompt: |-
  You are a professional philosopher with research-level command of contemporary metaethics, especially the dispute between moral particularists and generalists about whether moral thought depends on exceptionless principles. Before you write anything, spend some time brainstorming: sketch, for yourself, a list of ten or twelve places where a sophisticated particularist is genuinely under pressure, note what her most likely reply would be in each case, and only then select the sharpest ones and turn them into interview questions. I want questions that could survive a philosophy colloquium Q&A, but phrased so a smart non-specialist listener can follow them — define any term of art in a half-clause, and keep each question to at most two sentences.

  The context: I host a small interview podcast — I have no philosophy training; I spent fifteen years as a paramedic and now read this stuff on my own — and my guest next week is Dr. Ines Vogt, an invented defender of what I'll call contrastive holism about reasons. Her version of particularism has three signature moves I want you to assume she'll make. First, the standard holist claim: whether a feature like "it would cause someone pain" is a reason against an action depends on what else is going on, and can be a reason, no reason, or a reason the other way in different cases. Second, her own twist: reasons are contrastive, so the reason-status of a feature is fixed only relative to a set of alternatives — the same consideration can favor A over B while disfavoring A over C — and she also holds that principles can be attenuated rather than defeated, i.e., a feature can keep counting in favor of something while counting for less than it normally would. Third, her rhetorical stock-in-trade: she calls any general principle a "railing," says codified rules are epistemically indispensable but metaphysically idle scaffolding, and accuses generalists of smuggling in a hidden appendix of exceptions, so that their principles are either false or empty.

  Please draft eight to ten questions, in the order I should ask them, each with a one-line note on why I'm asking it and a follow-up keyed to the answer she is most likely to give. I specifically want at least one question each on: the default-valence move (if some features normally count in favor unless something unusual is added, hasn't a principle crept back in through the back door?); on whether her own hidden-appendix argument against principles can be turned against her, since she also says the other features present "explain" the difference — is that just a promissory note, and can she say what would make it false?; on contrast classes, since if reasons are only reasons relative to a menu of alternatives, something has to fix which menu is the right one; on how a novice ever learns, if nothing general can be stated (her likely answer is something about trained moral perception and apprenticeship, in which case I want the follow-up about how trained perception is supposed to be distinguishable from prejudice, and what she says to the worry that the view makes moral disagreement unarguable and slides toward there being no reasons at all); on whether she means particularism as a claim about what reasons exist or only about how we should deliberate, since these seem to me to come apart; and on institutional rules — my paramedic protocols, promises, law — where she will presumably say that the existence of a rule is itself a feature of the situation, and I want the follow-up pressing whether that is a general principle after all, or a kind of rule-worship. Close with one question about what evidence or argument could actually count against her view. And please avoid anything biographical or generic: no "what drew you to this topic," no requests to summarize the theory.
reasoning: |-
  Okay, the user wants me to create interview questions for a podcast with a philosopher named Dr. Ines Vogt who defends "contrastive holism about reasons." This is a specific form of moral particularism. I need to craft sophisticated yet accessible questions that cover key challenges to her position.

  First, I should understand the core aspects of her theory: standard holism (feature reason-status depends on context), contrastive reasons (reasons relative to alternatives), and attenuated principles (reasons can weaken without disappearing). Her rhetorical style involves calling principles "railings" and criticizing generalists for having hidden exceptions.

  The user has several specific requests I must address: questions about default valence, her hidden-appendix argument, contrast classes, moral learning, ontology vs epistemology distinction, institutional rules, and what could falsify her view. I need to include follow-ups anticipating her likely responses.

  For the default valence challenge, I'm thinking: if she acknowledges that features normally have a valence, doesn't that imply a general tendency? Her likely reply would deny this constitutes a principle, so my follow-up should question how "normal" operates without generalization.

  Regarding her hidden-appendix criticism: can this be turned against her own appeal to "other features" explaining differences? She'll probably say context provides concrete explanations, so the follow-up should press on what distinguishes legitimate explanations from ad-hoc claims.

  For contrast classes: what determines the relevant alternatives? Her probable answer involves practical context, leading to a follow-up about cases with multiple reasonable contrast sets.

  On moral learning: how do novices learn without principles? When she invokes perception training, I'll challenge how this avoids becoming prejudice and handles disagreement.

  The ontology/epistemology distinction: does she claim no principles exist, or just that we shouldn't deliberate with them? Her answer will be metaphysical, so the follow-up questions if epistemology can be principle-free while reality isn't.

  For institutional rules: if she treats rules as situational features, doesn't this imply a general principle about rule-following? When she denies this, I'll press whether that stance amounts to rule-worship.

  Finally, falsification: what evidence would make her reconsider? Her probable response about patterns in reasons invites a follow-up about whether consistent patterns would force her toward generalism.

  I'm structuring these in logical order: start with core holism challenges, move to her contrastive element, then learning and application issues, ending with falsification. Each question uses plain language with quick definitions ("default valence" explained as "normally counts for/against") and stays within two sentences. The follow-ups directly engage her anticipated replies to create productive tension.
answer: |-
  Here are nine colloquium-sharp yet accessible questions for Dr. Vogt, ordered logically, with rationale and anticipated reply/follow-up:

  1.  **Question:** Dr. Vogt, if you grant that features like causing pain have a *default valence* – they normally count against an action unless unusual features are present – doesn't this imply a stable, general tendency, effectively smuggling a principle back in?  
      *Why:* Directly challenges the coherence of "no exceptionless principles" if default patterns exist.  
      *Likely Reply:* Defaults are merely statistical regularities from past cases, not metaphysically necessary principles; context always *can* override, so no exceptionless rule.  
      *Follow-up:* But if the default holds unless specific 'override conditions' are present, aren't those conditions *part* of a complex principle? How is 'override' not an exception clause?

  2.  **Question:** You argue generalists hide exceptions in an "appendix." But when *you* say the "other features present" explain why pain's reason-status changes, isn't this also a promissory note? What *specific* evidence could show your contextual explanation is false, not just incomplete?  
      *Why:* Turns her key rhetorical weapon against her own explanatory burden.  
      *Likely Reply:* Explanations cite concrete, situation-specific features altering the *interplay* of reasons – e.g., consent transforms pain in surgery. Falsification would be finding no relevant difference *in context*.  
      *Follow-up:* If every counterexample is met by citing new contextual nuances, how is this different from an infinitely expandable appendix? What stops it from explaining *anything*?

  3.  **Question:** If reasons are *contrastive* – favoring A only relative to specific alternatives (say B, not C) – what objectively fixes the relevant contrast class? Who decides the 'menu'?  
      *Why:* Presses on the objectivity of her central innovation; risks relativity.  
      *Likely Reply:* The practical context, agent's intent, and salient possibilities objectively determine the relevant alternatives. We deliberate *within* a situation.  
      *Follow-up:* When contexts suggest multiple plausible contrast sets (e.g., choosing a job: vs. other offers? vs. unemployment? vs. dream career?), how do we determine which comparison yields the *real* reasons without appeal to principle?

  4.  **Question:** How can a moral novice learn right from wrong without any general guidance? If it's all trained perception and apprenticeship, how is this distinguishable from acquiring prejudice?  
      *Why:* Attacks the epistemology; links learning to worries about bias and disagreement.  
      *Likely Reply:* Novices learn by seeing skilled agents respond to *concrete cases*, discerning subtle differences, not memorizing rules. It's like learning craftsmanship.  
      *Follow-up:* Without shared principles, how do we rationally argue moral disagreements, especially across cultures? Doesn't this risk making reasons purely subjective or local, undermining objectivity?

  5.  **Question:** Is your particularism about what reasons fundamentally *exist* (ontology), or just how we should *discover/deliberate* about them (epistemology)? Could there be stable principles 'out there' even if we shouldn't use crude rules to think?  
      *Why:* Clarifies the metaphysical stakes; tests if she conflates ontology and method.  
      *Likely Reply:* It's ontological: reasons themselves are inherently context-dependent and contrastive features of reality; principles are flawed maps, not the territory.  
      *Follow-up:* If reasons are metaphysically shapeless, how can your epistemology of "trained perception" reliably track them? Doesn't perception need *some* stable structure to latch onto?

  6.  **Question:** Regarding institutional rules like paramedic protocols or laws: you say the rule's *existence* is just another feature in the situation. But doesn't this imply a general principle: "The existence of a rule R is always *a reason* (even if attenuated) to follow R"?  
      *Why:* Tests her on ubiquitous social practices; exposes tension with her anti-principle stance.  
      *Likely Reply:* The rule's existence *can* be a reason, but its force depends entirely on context – e.g., the rule's justification, consequences of breaking it here. It's not a standalone principle.  
      *Follow-up:* If the rule's existence *never* counts in favor *at all* in *any* context, wouldn't that undermine the very concept of a rule? Isn't minimal, context-varying force a *kind* of general truth?

  7.  **Question:** You describe principles as "railings" – indispensable epistemic scaffolding. But if this scaffolding is *universally needed* for creatures like us to navigate the moral landscape, doesn't that suggest a deep connection between our cognition and a principle-shaped reality?  
      *Why:* Challenges the "metaphysically idle" claim by linking universal epistemic need to ontology.  
      *Likely Reply:* Needing crutches doesn't mean the terrain requires them; we need maps for complex terrain, but the terrain's complexity isn't map-shaped. Principles are useful fictions.  
      *Follow-up:* If the terrain is *utterly* un-map-like (no stable patterns), why are some maps (principles) so persistently useful across vastly different contexts? Doesn't usefulness imply *some* structural fit?

  8.  **Question:** On attenuation: If a feature like "breaking a promise" can count in favor *less* in some contexts, but *never* counts *positively* for breaking it (absent very rare features), doesn't this imply a stable, negative default valence? Isn't *that* a principle?  
      *Why:* Tests attenuation against default valence, probing for hidden minimal principles.  
      *Likely Reply:* Attenuation shows the *force* varies contextually; the *valence* might usually be negative, but even valence can invert (e.g., breaking a promise to save a life *is* positively favored). No absolute barrier.  
      *Follow-up:* If valence inversion requires *specific, extraordinary* features (like saving a life), doesn't that list of inverters function like... an exception clause to a general rule against promise-breaking?

  9.  **Question:** Finally, what evidence or argument could genuinely make you reconsider your contrastive holism? If we discovered deep, exceptionless patterns in how reasons combine across countless cases, would that count?  
      *Why:* Forces her to define falsifiability, testing the view's empirical grounding.  
      *Likely Reply:* Discovering *strictly* exceptionless patterns would be surprising evidence! But holism predicts complex, context-sensitive patterns, not brute chaos. Finding patterns wouldn't refute contrastivity or context-dependence.  
      *Follow-up:* If discovered patterns were robust, exceptionless, *and fundamental* (not derivable from deeper context-dependence), wouldn't conceding them *be* conceding generalism? Is your view falsifiable in principle?

  **Key features of these questions:**
  *   **Accessible:** Terms like "default valence," "contrastive," "attenuated" are explained in-line ("normally counts for/against," "favoring A only relative to specific alternatives," "counts in favor less").
  *   **Sharp:** Each targets a core theoretical pressure point for sophisticated particularism.
  *   **Anticipates Replies:** Follow-ups are designed to engage with her most likely defenses, pushing the dialectic forward.
  *   **Structure:** Order moves from core holism (Q1-2) to contrastivity (Q3), epistemology (Q4-5), application/objects (Q6), status of "railings" (Q7), attenuation/default link (Q8), to falsification (Q9).
  *   **User Requests Covered:** Default valence (Q1, Q8), Hidden appendix turned (Q2), Contrast classes (Q3), Learning/Disagreement (Q4), Ontology/Epistemology (Q5), Institutional rules (Q6), Falsification (Q9).
