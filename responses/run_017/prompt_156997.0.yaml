  First, the audience mix is crucial. Labor economists focus on task models and automation's impact on labor share. They’ll likely question the empirical evidence and how this fits existing models. The STS crowd might push back on determinism and productivism, so I need to address agency and contingency. Union staff care about practical implications for bargaining. The user wants objections phrased as these groups would, not philosophers.

  The user’s core argument is that automation removes workers' leverage by deskilling, allowing capital to hire cheaper labor. The payoffs are that deskilling is central, not a side effect, and that labor metrics misrepresent the real issue of lost bargaining power. 

  I should anticipate objections in order. Economists might first ask about empirical support—how does this theory align with routine-biased technical change data? They need a concise reply acknowledging RBTC but stressing non-routine bottlenecks. STS folks might critique determinism, so emphasizing contingency and worker agency is key. Union staff will want actionable steps, so suggesting worker strategies beyond Luddism is important.

  The user also needs to know which objections to concede early. Probably the RBTC point to show they’re engaging with empirical work. Also, maybe the STS concern about determinism to avoid alienating them. 

  For the worst objections: the routine vs. bottleneck mismatch is tough. The reply should differentiate task routineness from leverage, using examples like tech workers. The labor share measurement issue requires explaining monitoring labor’s role. The STS objection about agency needs concrete examples of resistance.

  The question they fear most might be about RBTC contradicting their focus on high-skill workers. But another could be why automation targets low-leverage jobs if the theory is about stripping bottlenecks. Or how AI fits, since it might need high-skill oversight, potentially creating new bottlenecks. That last one could be tricky because if AI requires experts, capital might not fully deskill, which challenges their thesis. Need to prep a response about partial deskilling and shifting leverage points.
answer: |-
  Here’s your Q&A prep sheet, tailored to your audience and thesis. I’ve prioritized objections by likely order, phrasing, and severity. **Concede early to preempt hostility** and focus on your core argument.

  ---

  ### **First-Minute Concessions (Disarm Critics)**
  1. **To Economists:**  
     *"I acknowledge routine-biased technical change (RBTC) data shows middle-skill routinization. My argument complements RBTC by explaining* why *capital targets high-leverage non-routine roles when feasible."*  
     **Why:** RBTC is their framework; refusing this sounds dismissive.

  2. **To STS/Critical Theorists:**  
     *"This isn’t technological determinism. Automation is a* strategy *deployed in class struggle, not an inevitable force. Workers resist—but capital’s countermove is to dismantle bottlenecks."*  
     **Why:** Prevents "determinism" accusations derailing you.

  3. **To Unions:**  
     *"Yes, this means bargaining power erosion is structural—but recognizing that lets us fight smarter, not just defensively."*  
     **Why:** Shows you grasp their urgency.

  ---

  ### **Predicted Objections (Order & Phrasing)**
  1. **From Labour Economists (Early, skeptical):**  
     *"Your ‘leverage-stripping’ model sounds neat, but decades of RBTC literature show automation primarily eats* routine *middle-skill jobs (e.g., clerks), not your ‘bottleneck’ artisans. Where’s your empirical footprint?"*  
     **Force:** HIGH. Must engage.  
     **2-Minute Reply:**  
     > "RBTC captures *what’s easiest to automate* (repetitive tasks), not *what capital most wants to automate* (costly bottlenecks). Think tech sector: Google automating code debugging (non-routine!) to reduce reliance on elite engineers. Or nurses—non-routine, but hospitals deploy AI triage to standardize judgement. This happens where leverage exists, even if less frequently than RBTC."  
     **Soft Spot:** Limited macro-data on "bottleneck automation." Lean on sectoral cases (tech/healthcare).

  2. **From STS/Critical Theorists (Mid-Q&A, probing):**  
     *"Isn’t this just another productivist narrative? You reduce worker power to ‘skills’ in machines’ grip. What about solidarity, organizing, or unpaid social reproductive labor that sustains workers?"*  
     **Force:** MEDIUM (but emotionally charged).  
     **2-Minute Reply:**  
     > "Absolutely—power isn’t just technical. But when capital *can* strip leverage, it weakens the basis for solidarity (e.g., replacing veteran steelworkers with sensors + temps). This doesn’t negate organizing; it explains *why* capital automates high-leverage points. And deskilling *intensifies* reliance on social reproduction (e.g., gig workers’ unpaid ‘self-training’)."  
     **Soft Spot:** Risks sounding economistic. Stress this is *one weapon* in class struggle.

  3. **From Union Staff (Direct, practical):**  
     *"Okay, but if automation’s about power, not jobs, what do we *do*? Bargain to ‘save’ irreplaceable skills? That sounds like Luddism. How do we protect members now?"*  
     **Force:** HIGHEST (make-or-break moment).  
     **2-Minute Reply:**  
     > "Demand control over *how* automation deploys. E.g.:  
     > - **‘Skill-stripping’ clauses:** Require employers to document expertise before automating (forcing them to admit workers’ value).  
     > - **Training for oversight roles:** Turn ‘machine babysitting’ into credentialed safety/logistics roles.  
     > - **Bargain data:** If machines monitor workers, that data belongs to the union.  
     Fight not to *stop* tech, but to ensure it amplifies worker voice, not silence."  
     **Soft Spot:** Unions may lack leverage to demand this. Push "transitional demands" as strategy.

  ---

  ### **Other Likely Objections (Shorter Replies)**
  4. **Economist:** *"Labour share declines fit skill-biased tech narratives too. Why is your story better?"*  
     **Reply:** "Skill-biased tech *raises* skill premiums. My model explains why real wages stagnate *even as* ‘skills’ increase—workers are ‘skilled’ at monitoring, not bargaining." (Force: MEDIUM)  

  5. **STS:** *"Marx wrote in the 1850s! Today’s AI needs PhDs to run it. Isn’t this creating *new* bottlenecks?"*  
     **Reply:** "Temporarily—but capital’s goal is to commodify that expertise too (e.g., AutoML replacing data scientists). Look at AI prompt engineering: from arcane skill to templatized hourly work in <5 years." (Force: LOW—concede partial truth but emphasize trajectory)  

  6. **Union Staff:** *"How is this different from saying ‘unions are obsolete’?"*  
     **Reply:** "Unions forced capital to automate! The point is to shift from defending *old* leverage to building *new* power: collective data rights, algorithmic co-governance." (Force: MEDIUM—don’t let this linger)  

  ---

  ### **The Question You Hope Nobody Asks**
  *"If automation’s goal is stripping* high-leverage *workers, why does most AI investment target* low-wage *sectors (e.g., warehouse pickers, drivers)? Those workers lacked individual leverage to begin with."*  

  **Why It’s Deadly:**  
  - Exploits a tension in your thesis: low-wage workers *are* replaced for cost savings, not just leverage-stripping.  
  - Suggests your "bottleneck" focus is elitist—ignoring capital’s broader war on labor.  

  **Salvage Plan:**  
  > "Two answers: First, in low-wage sectors, *collective* leverage (e.g., strikes) is the bottleneck—automation crushes that potential (e.g., replacing unionized delivery drivers with drones). Second, AI’s ‘low-hanging fruit’ is physical routine work, but its *ambition* is cognitive bottlenecks (e.g., IBM targeting oncology diagnostics). Capital’s ideal is *total* independence from labor—it starts wherever tech allows."  

  **Soft Spot:** Requires reframing "leverage" as collective, not individual. Have warehouse unionization stats ready.

  ---

  ### **Key Prep Takeaways**
  - **Economists** care about RBTC reconciliation. Cite Autor (2015) on "troubleshooting" tasks as automatable non-routine work.  
  - **STS** needs anti-determinism reassurances. Mention Harry Braverman’s *deskilling* as contingent class strategy.  
  - **Unions** demand actionable strategies. Prep examples: German works councils’ codetermination on AI, or LA hotel workers’ "panic button" apps.  
  - **Your Weak Spot:** Overclaiming on *current* AI. Stress historical machinery (per Marx) and *directionality* of AI.  

  **Final Tip:** If pressed on "Is this even AI-specific?", pivot to: "AI accelerates Marx’s logic by targeting cognitive bottlenecks earlier tech couldn’t touch." Good luck!
