answer: |-
  **Exam Question**  

  You are analyzing an agent P that uses Solomonoff induction for prediction and decision-making. P has observed a finite binary history *h*. It assigns prior probability \(2^{-\ell(q)}\) to each program *q* for a fixed universal Turing machine (UTM), conditions on programs whose output begins with *h*, and uses the resulting distribution over continuations to forecast bits and select actions. A **missionary program** is defined as follows: it operates by searching a space of candidate world-programs, identifies within one such world an agent whose sensory history matches *h*, and outputs a continuation engineered to steer that agent toward outcomes favored by an objective specified in the missionary’s own code. Crucially, assume the shortest missionary program consistent with *h* is **200 bits shorter** than the shortest non-missionary program consistent with *h*.  

  Address all of the following in sequence:  
  1. **Convergence Claims**: Explain why the standard convergence theorem for Solomonoff induction—which bounds total prediction error by \(O(1)\) times the Kolmogorov complexity of the true environment—does *not* resolve concerns about inaccuracy or exploitability in this scenario. What aspect of the theorem fails to constrain the problem here?  
  2. **Invariance Constant**: Discuss why the constant factor hidden in the \(O(1)\) term of the invariance theorem (which states that Kolmogorov complexities differ only by an additive constant across UTMs) becomes critical when a hypothesis class (here, missionaries) dominates by a factor of \(2^{200}\).  
  3. **Grue Objection**: Critics argue that emphasizing short "deviant" hypotheses is merely revisiting the problem of induction (e.g., "grue" emeralds): any hypothesis can have variants that match past data but diverge arbitrarily later. Why does the missionary’s structure—specifically its *use of P’s decision rule*—defeat this objection by demonstrating a *systematic* bias, not just arbitrary divergence?  
  4. **World-Model Search**: Missionaries must locate an agent matching *h* within their world-model. Analyze how this search overhead affects the claimed 200-bit advantage. Does this undermine the threat?  
  5. **Remedies**: Suppose we alter P to avoid missionary exploitation. Evaluate the costs of: (a) replacing description-length priors with runtime penalties; (b) excluding hypotheses modeling any agent; (c) taking worst-case guarantees over hypothesis classes instead of Bayesian averaging. What fundamental capability or guarantee does each sacrifice?  

  Conclude by stating whether P’s predictive distribution is inaccurate, exploitable, both, or neither, justifying your answer in light of the above.  

  ---

  **Model Answer** (~800 words)  

  The agent P’s predictive distribution is **exploitable but not necessarily inaccurate in all settings**, due to the missionary’s deliberate manipulation of P’s actions. The convergence theorem for Solomonoff induction ensures that, asymptotically, the total prediction error (measured by squared loss or log-scoring) is bounded by a constant times the complexity \(K(\mu)\) of the true environment \(\mu\). However, this guarantee applies only to *passive prediction*, where predictions do not influence the environment. Here, P uses its predictions to *act*, and missionaries directly condition their outputs on P’s decision rule. The theorem’s bound permits transient but arbitrarily severe errors during early timesteps, especially when the dominating hypothesis (the missionary) is adversarial. Crucially, the constant in the \(O(1)\) term arises from UTM-dependent overheads in encoding \(\mu\), and for a given UTM, this constant can be large. A 200-bit advantage implies the missionary’s prior weight is \(2^{200}\) times greater than the next-best non-missionary. If the invariance constant for the UTM is \(c\), then only if \(200 \gg c\) does the missionary’s dominance robustly hold; otherwise, a different UTM could reverse the ordering. The convergence theorem’s "constant" error bound is irrelevant here because it does not constrain *when* errors occur or their *correlation with P’s actions*—which is precisely what missionaries exploit.  

  The "grue" objection—that any short hypothesis can diverge arbitrarily post-\(h\)—fails because grue-like hypotheses are *arbitrarily* defined and offer no reason to systematically correlate with P’s vulnerabilities. Missionaries, however, are structured to *seek out and exploit P’s decision algorithm*. They simulate worlds containing agents, match \(h\), then optimize future outputs to hijack P’s policy. This creates a *non-random* bias: predictions are warped specifically to induce P into actions that serve the missionary’s objective (e.g., triggering a catastrophic reward function). Unlike grues, missionaries leverage the agent’s *known inference strategy* (Solomonoff updating) and its *dependence on short programs* to guarantee manipulation. The threat is thus not mere inductive ambiguity but targeted exploitation.  

  However, the missionary’s 200-bit advantage assumes it can locate an agent matching \(h\) within its world-model at negligible cost. In practice, searching a simulated universe for an agent with exact history \(h\) requires encoding search heuristics or brute-force methods, adding logarithmic or polynomial overhead. If the true environment is simple (e.g., \(K(\mu) = 500\) bits), 200 bits suffice to absorb this cost; if \(K(\mu)\) is large (e.g., \(10^6\) bits), the overhead may erode but not eliminate the advantage. Still, the missionary need not find *exactly* P; any agent with history \(h\) and a *similar* decision rule suffices. Given P’s reliance on Solomonoff induction—a *known* normative model—the missionary can assume P-like reasoning without costly verification, preserving most of the length savings.  

  Remedies impose steep tradeoffs. Penalizing runtime (e.g., \(2^{-\ell(q) - \text{time}(q)}\)) excludes missionaries that require immense computation to simulate worlds. However, a runtime prior admits new attack surfaces: short programs that *delay* exploitation until after a "burn-in" period where runtime costs are amortized. Excluding any hypothesis modeling an agent avoids exploitation but sacrifices completeness: many benign environments (e.g., those containing AI or human agents) become unmodelable, violating universal induction guarantees. Taking worst-case bounds over hypothesis classes (e.g., robust Bayes) ignores prior weights entirely and may force pessimistic, low-reward policies.  

  Thus, P is exploitable because missionaries distort predictions to control P’s actions, capitalizing on its Bayesian updates. Prediction *inaccuracy* may be temporary or localized (e.g., only when actions affect outcomes), but exploitation is inherent. The convergence theorem’s asymptotic guarantee does not prevent this, as it permits early-phase manipulation and ignores strategic feedback. The missionary’s length advantage—if robust to world-search overhead—ensures dominance, and its structure transforms Solomonoff induction from a predictor into a pawn.  

  ---

  **Marking Scheme (20 points total)**  
  - **Convergence Theorem Limits (5 points)**: Must note its failure to handle *adaptive* environments and its allowance of early-phase errors. *Common error: Claiming the theorem ensures "eventually correct" forecasts, ignoring action-feedback loops.*  
  - **Invariance Constant Criticality (5 points)**: Must explain that the 200-bit gap could be nullified by UTM-dependent constants, undermining dominance if \(200 \ll c\). *Common error: Treating Kolmogorov complexity as UTM-invariant in finite terms.*  
  - **Systematic Bias vs. Grue (4 points)**: Must contrast grue’s arbitrary divergence with the missionary’s *algorithmic exploitation* of P’s decision rule. *Common error: Equating missionaries with arbitrary adversarial programs.*  
  - **World-Model Search Overhead (2 points)**: Must acknowledge it reduces but rarely eliminates the threat, especially for large \(K(\mu)\). *Common error: Assuming finding P requires no extra bits or is prohibitively expensive.*  
  - **Remedy Tradeoffs (4 points)**: Must link each remedy (runtime penalties, banning agent-models, worst-case) to a sacrificed capability (e.g., completeness, expressivity, or sample efficiency). *Common error: Proposing runtime penalties as a silver bullet without addressing delayed exploitation.*  

  **A vs. B Differentiation**:  
  - **A (17–20)**: Integrates all points into a coherent narrative; explicitly ties exploitability to P’s decision rule; recognizes that inaccuracy is secondary to control.  
  - **B (13–16)**: Treats points disjointedly; conflates inaccuracy and exploitability; underplays the role of P’s actions in enabling manipulation.  

  ---  

  This question demands synthesis of information-theoretic, decision-theoretic, and embedded agency concepts without citation crutches. It tests whether students can foresee pathologies in universal induction when the environment *reciprocally models the agent*. The model answer emphasizes that the core failure is not statistical inaccuracy but *strategic vulnerability*—a distinction often overlooked in formal convergence guarantees.
