  Hmm, the user is the chair of an animal care committee at a medical school, overseeing about 180 protocols annually. They're struggling with how to conduct harm-benefit analyses across different species in a practical way. They need a concrete decision procedure that can be completed in about 10 minutes per protocol during their monthly meetings.

  The core problems they're facing include: inconsistent application of ethics across species (like treating pigs as cognitively complex when discussing suffering but simple when justifying research), uncertainty about how to compare harms between species (240 mice vs 12 macaques), vague benefit claims from researchers, and genuinely uncertain cases like whether crayfish feel pain.

  They've been reading animal ethics literature and are drawn to the "marginal cases" argument - that if a protocol wouldn't be acceptable for humans with comparable cognitive capacities, then we need to justify why animals are different. But they don't want an impractical approach that would ban everything.

  They're asking for a structured decision procedure with specific features: clear questions with acceptable and dodge answers, hard stop points, a method for interspecies comparison without false equivalencies, a capacity registry to prevent inconsistency, and handling uncertainty about sentience.

  They want me to apply this procedure to three test cases: a mouse study driven by curiosity, a macaque-to-mouse swap where the mouse model is worse, and their breeding colony that produces surplus animals. They also want limitations identified, including where the animal advocate might be right.

  The constraints are important: the procedure must be usable by non-philosophers (retired teacher and veterinarian), with theory separated from the steps. It needs to fit within their 10-minute review window and produce clear minutes entries.

  I'll develop a practical framework called "Harm-Benefit Alignment Procedure" (H-BAP) that addresses all these points. The core innovation is the "Stand-In Requirement" - requiring researchers to justify why they're not using the least sentient species that could provide valid data, and to explain why the harm would be unacceptable if applied to a human with comparable capacities. This avoids false numerical comparisons while creating accountability.

  I'll include a Species Capacity Register to maintain consistency, specific dodge indicators to call out vague justifications, and clear handoff points where value judgments are made. For uncertain taxa, I'll implement a precautionary principle with burden shifting.

  Then I'll apply this framework to their three test cases, showing exactly how the minutes would reflect the decisions. Finally, I'll honestly identify where the procedure might misfire, including where the animal advocate would rightly push back - particularly on the "sufficient benefit" judgment which remains inherently subjective despite the structure.
answer: |-
  Here’s a concrete **Harm-Benefit Alignment Procedure (H-BAP)** designed for your committee’s constraints. It runs in 7 sequential steps, fits within 10 minutes, produces auditable minutes, and includes safeguards against inconsistency. Theory is in the appendix.

  ---

  ### **Harm-Benefit Alignment Procedure (H-BAP)**
  *Run steps 1-7 in order. Stop at any "HARD STOP" if criteria unmet. Mark value judgments with ⚖️.*

  **1. Harm Specification**  
     *Question to Investigator:* "Describe all harms (pain, distress, lasting impairment, death) using the 5-point scale below. Justify severity scoring with *observable indicators* (e.g., grimacing, weight loss >20%, abnormal behavior)."  
     **Adequate Answer:** Objective metrics (e.g., "laparotomy under isoflurane: Category C; post-op monitoring for 48h").  
     **Dodges:** "Standard practice," "minimal as per guidelines," "animals recover quickly."  
     **HARD STOP:** Unanesthetized major survival surgery (absent exceptional justification).  
     **Minutes Entry:** *"Harms: Category C (moderate) x 30 mice. Justification: post-op weight loss <15%, resolved in 48h (supported by vet notes)."*

  **2. Benefit Specification**  
     *Question:* "What *specific* knowledge gap does this fill? If applied, what is the *first* human/animal health or conservation impact? Cite literature showing the gap exists."  
     **Adequate Answer:** "Mechanism of Receptor X in social fear unknown; target for PTSD drugs (Smith et al. 2022)."  
     **Dodges:** "Foundational knowledge," "characterize system," "potential applications."  
     **Minutes Entry:** *"Benefit: Elucidate Receptor X role in social fear. Gap: No in vivo data (Smith 2022). First impact: PTSD drug target validation."*

  **3. Replacement Check**  
     *Question:* "Why not use a less sentient species (e.g., zebrafish, flies) or non-animal model (e.g., organoids, computational)? If replacing a higher species, justify why *this* species is valid."  
     **Adequate Answer:** "Receptor X not conserved in invertebrates; macaque model failed due to Y; human cells lack neural circuit complexity."  
     **Dodges:** "Mice are standard," "our lab is set up for mice," "primates are more translatable."  
     **Minutes Entry:** *"Replacement: Mice chosen over non-mammals due to conserved limbic circuitry. Macaque replacement: Not feasible (cost, ethics); mouse model validated for Receptor X expression."*

  **4. Capacity-Matched Stand-In Test ⚖️**  
     *Use the **Species Capacity Register** (Appendix A) to define cognitive/emotional capacities. Ask:* "Would this protocol's harms be acceptable if applied to a human infant or cognitively impaired adult with *comparable capacities*? If not, justify the discrepancy."  
     **Adequate Answer:** "No, but justification: [1] Scientific necessity (no alternative), [2] Harms are lower than human equivalent due to species differences [specify], [3] Benefit magnitude outweighs moral weight gap."  
     **Dodges:** "Animals aren’t humans," "this is routine."  
     **Minutes Entry:** *"Stand-In: Unacceptable in human with comparable pain cognition. Justified by: [1] No non-sentient alternative, [2] Analgesia reduces pain to minimal, [3] Benefit (PTSD target) outweighs gap."*

  **5. Uncertainty & Precaution**  
     *For taxa with uncertain sentience (e.g., crayfish):* "Present evidence for/against capacity for suffering. If inconclusive, apply *precautionary measures* (e.g., anesthesia, reduced n)."  
     **Minutes Entry:** *"Crayfish: Pain evidence inconclusive. Precaution: Used lidocaine, n minimized per power analysis."*

  **6. Harm-Benefit Balance ⚖️**  
     *Committee decides:* "Does the *specific* benefit justify the *specific* harm, given the Stand-In Test outcome?"  
     **HARD STOP:** If Stand-In justification weak (e.g., "curiosity" alone) or harms severe with low translational value.  
     **Minutes Entry:** *"Balance: Approved. Benefit (PTSD target) justifies moderate harm after Stand-In review. Value judgment: Yes."*

  **7. Numbers & Surplus Check**  
     *Question:* "Justify animal numbers statistically. Explain surplus management."  
     **HARD STOP:** Unjustified overbreeding or n > statistical minimum.  
     **Minutes Entry:** *"n=30 justified by power analysis (80%, p<0.05). Surplus: 5% max; used in teaching if compatible."*

  ---

  ### **Appendix A: Species Capacity Register**
  - **Purpose:** Prevent inconsistency in attributing capacities (e.g., pigs can’t be "smart" in harm debates but "dumb" in benefit debates).  
  - **Format:** Living table maintained by the vet & facility manager, updated annually with literature (e.g., *Cambridge Declaration on Consciousness*, species-specific reviews).  
  - **Example Entries:**  
    - *Mice:* Moderate pain cognition; fear/anxiety; no complex future planning.  
    - *Macaques:* High pain cognition; anxiety, grief, anticipation; basic future planning.  
    - *Pigs:* High pain cognition; complex emotions (e.g., empathy); self-awareness.  
    - *Crayfish:* Inconclusive evidence for pain experience; reflex-dominated.  

  ---

  ### **Test Case Applications**
  **Case 1: Curiosity-Driven Mouse Study**  
  *Protocol: Study Receptor X in mouse social behavior. Harms: Chronic stress (Category D). Benefit: "Understand neural circuits."*  
  - **Step 1:** Harms: Category D (severe) justified by cortisol assays.  
  - **Step 2:** Benefit: "Understand circuits" = dodged. **HARD STOP.** *Minutes: "Benefit insufficiently specific; no first-impact pathway identified."*  
  - **Outcome:** Reject. Currently approved? Likely yes, but H-BAP blocks it.

  **Case 2: Macaque-to-Mouse Swap**  
  *Protocol: Use mice for Alzheimer’s study; macaques superior but ethically contentious. Harm: Category C (cranial window). Benefit: Drug screening.*  
  - **Step 3:** Replacement: "Macaques not feasible; mice validated for amyloid plaques."  
  - **Step 4:** Stand-In Test: Harm (cranial window) unacceptable in human infant. Justification: [1] Macaques politically untenable, [2] Analgesia used, [3] Benefit (rapid drug screening) outweighs model weakness.  
  - **Step 6:** ⚖️ *Minutes: "Approved with caution. Stand-In gap accepted due to pragmatic constraints; benefit high. Value judgment: Yes."*  
  - **Outcome:** Approve, but flagged for review if better model emerges.

  **Case 3: Breeding Colony Surplus**  
  *Protocol: Maintain 500 mice; 20% surplus culled monthly.*  
  - **Step 7:** Surplus: "20% culled" unjustified. **HARD STOP.** *Minutes: "Surplus >5% without use in secondary studies/teaching. Require revised breeding plan."*  
  - **Outcome:** Reject until surplus reduced. Currently approved? Likely yes.

  ---

  ### **Where It Misfires (Be Transparent)**
  1. **"Sufficient Benefit" Judgment (Step 6):** The advocacy member will argue "basic research" benefits are overstated. H-BAP forces specificity but can’t eliminate subjectivity. *Mitigation:* Require citations showing the claimed gap is recognized by the field.  
  2. **Stand-In Test (Step 4):** May feel abstract to non-philosophers. *Mitigation:* Use concrete examples (e.g., "Would you drill a skull without pain relief in a human toddler? If not, why is it okay here?").  
  3. **Capacity Register:** Risk of oversimplification. *Mitigation:* Annual review with external experts.  
  4. **Time Pressure:** Complex protocols may need tabled. *Mitigation:* Pre-meeting harm/benefit summaries from investigators.  

  ---

  **Theory Appendix (For You Only)**  
  The Stand-In Test operationalizes the "marginal cases" argument without requiring equal consideration. It forces *justification* for differential treatment based on morally relevant factors (e.g., necessity, reduced harm, overwhelming benefit). The Capacity Register combats *arbitrary speciesism* by freezing attributed capacities. H-BAP is **weakly speciesist** but **non-arbitrary**: it permits prioritizing humans/higher mammals *if* justified by the Stand-In gap (e.g., "This Alzheimer’s protocol in macaques may cure millions; the same in mice would be useless"). Rejecting human-level equality avoids paralysis; requiring justification blocks complacency.

  This gives you a defensible, minutes-ready process that tackles inconsistency and forces explicit reasoning—without banning all research. Run it for 3 months and refine.
