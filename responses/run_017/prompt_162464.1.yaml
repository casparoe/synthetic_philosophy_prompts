     - However, the prediction incentive (getting 1 extra point) is small compared to the main payoffs, so it's unlikely to drive behavior. It's mainly for eliciting beliefs.

  5. Predictably goes wrong the first time:
     - Students might not understand the prediction part and write the wrong thing.
     - The game might take longer than expected, especially the uncertain game if it goes many nodes.
     - In the fixed game, some pairs might reach node6 and then see that Player2 takes, but then they regret passing at earlier nodes? 
     - In the uncertain game, the die roll might end the game very early (at node1 after Player1 passes) and then they see they only got 10 each, which is less than if Player1 had taken (8 for Player1, 2 for Player2). But Player1 might have hoped for more.

     - Also, in the uncertain game, the pot grows and the 1/6 chance of ending might be underestimated.

  Overall, we want to emphasize that the backward induction paradox arises from the combination of a fixed, known endpoint and common knowledge of rationality. Without the fixed endpoint, the argument doesn't apply.

  **Logistics:**
  - Prepare slips for each node: one for the prediction and one for the decision? Or one slip with both.
  - Keep track of the pot and the node.
  - For the die version, have a die and a screen.
  - Convert points to candy: e.g., 10 points = 1 candy.

  Let me know if you need further adjustments.
