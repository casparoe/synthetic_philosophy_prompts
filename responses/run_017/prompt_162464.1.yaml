  Below are the exact instructions, payoff structure, debriefing points, and notes on predictable challenges for your 60-minute seminar. This plan is designed for 16 students (8 pairs), with no upfront lecture, and avoids naming "backward induction" until the debrief. The activity uses two versions of the centipede game: a fixed-length game (6 nodes) and a variant with an uncertain endpoint (die rolls).

  ---

  ### **Part 1: Fixed-Length Game (No Lecture, Just Play)**
  **Instructions to Read Aloud:**  
  "Okay everyone, we’re going to play a quick game in pairs. I’ll assign you a partner—one of you is Player 1, the other Player 2. Here’s how it works:  
  - You’ll make decisions **one node at a time**, starting with Player 1.  
  - The game begins with a pot of **10 points**.  
  - At your turn, you choose **TAKE** or **PASS**:  
    - **TAKE**: You get **80%** of the pot, your partner gets **20%**. Game ends.  
    - **PASS**: The pot grows by **10 points**, and the turn passes to your partner.  
  - There are **exactly 6 decision nodes**. At the final node (Player 2’s turn), **PASS is not allowed**—Player 2 must TAKE.  
  - Points convert to candy at the end (e.g., 10 points = 1 piece).  

  **Before each decision, you’ll privately write down two predictions:**  
  1. **What you expect your partner to do** at the very next node *if you PASS*. (Write: ‘TAKE’ or ‘PASS’)  
  2. **What you think your partner expects YOU to do** at the node *after that* (if the game continues). (Write: ‘TAKE’ or ‘PASS’)  

  These predictions earn **bonus points** if correct:  
  - Prediction 1: +1 point if your partner does *exactly* what you predicted at the next node (only checked if you PASS and the game reaches that node).  
  - Prediction 2: +1 point if *your actual choice* at the later node matches what you thought your partner expected (only checked if the game reaches that node).  

  This ensures honest predictions—I won’t reveal answers until afterward.  

  **Payoffs at Each Node (Ensure the ‘Sting’ of Unraveling):**  
  | Node | Player | Pot | If TAKE (Taker, Other) | If PASS (Pot Grows To) |  
  |------|--------|-----|--------------------------|------------------------|  
  | 1    | 1      | 10  | (8, 2)                   | 20 → Node 2            |  
  | 2    | 2      | 20  | (16, 4)                  | 30 → Node 3            |  
  | 3    | 1      | 30  | (24, 6)                  | 40 → Node 4            |  
  | 4    | 2      | 40  | (32, 8)                  | 50 → Node 5            |  
  | 5    | 1      | 50  | (40, 10)                 | 60 → Node 6            |  
  | 6    | 2      | 60  | (48, 12)                 | (No PASS allowed)      |  

  **Why these payoffs?**  
  - Backward induction predicts a TAKE at Node 1: If players are rational and believe others are rational, Player 1 should take immediately (8 > 4, as shown in the debrief). The 80/20 split amplifies the incentive to defect early.  
  - If players cooperate (PASS), collective payoffs soar (e.g., Node 6: 48 + 12 = 60), but BI predicts this won’t happen.  

  **Logistics:**  
  - Hand out prediction slips and decision slips at each node.  
  - Move quickly—give pairs 60 seconds per decision.  
  - Collect slips privately to avoid influencing others.  

  ---

  ### **Part 2: Uncertain-Endpoint Game (Die Roll Variant)**  
  **Instructions to Read Aloud:**  
  "Now, we’ll play a slightly different version twice with the same partner. Rules are the same, except:  
  - After **every PASS** (once the pot grows), I roll a die **behind a screen**.  
    - **If I roll a 6 (1/6 chance)**: The game ends immediately, and the current pot is **split evenly** (50/50).  
    - **If I roll 1–5**: The game continues to the next player.  
  - There’s **no fixed end**—the game could end after any PASS.  
  - Predictions work the same way. We’ll play **two rounds** with new pots each time."  

  **Payoffs:** Same TAKE splits (80/20), but added 50/50 split on die-roll end.  
  *Example:*  
  - Player 1 PASSES at Node 1 (pot → 20). Die roll = 6 → Game ends. Both get 10 points.  
  - Die roll = 3 → Continues. Player 2 decides at Node 2 (pot = 20).  

  **Why this variant?**  
  - Removes the "last node" anchor, breaking backward induction’s starting point.  
  - Rewards cooperation: Even if players fear defection, the die roll adds uncertainty that sustains trust.  

  ---

  ### **Debrief (After Both Games)**  
  **Goal:** Reveal the backward induction paradox using student experiences, not theory jargon. Start with concrete observations.  

  1. **Fixed Game: The Unraveling Moment**  
     - **Ask:** "In the fixed game, how many pairs saw a TAKE at Node 1? Node 2? Who reached Node 6?" (Typically, few take at Node 1; many pass initially.)  
     - **Map to BI:** "Let’s reconstruct why rational players ‘should’ take early. Start from the end:  
       - At Node 6, Player 2 **must take** (48 > 0 if they could pass, but they can’t).  
       - At Node 5, Player 1 knows this. If they PASS, Player 2 takes at Node 6, and Player 1 gets 12. But if Player 1 TAKES now, they get 40. **40 > 12 → Take at 5.**  
       - At Node 4, Player 2 knows Player 1 will take at 5. If Player 2 PASSES, Player 1 takes at 5, and Player 2 gets 10. But if Player 2 TAKES now, they get 32. **32 > 10 → Take at 4.**  
       - ...and so on back to Node 1: **8 > 4 → Take at 1.**  
       This is **backward induction**—it ‘unravels’ from the last node. But in class, most of you passed early. Why?"  

  2. **Prediction vs. Reality Gap**  
     - **Use prediction slips:** "Who predicted their partner would PASS at the next node? In reality, did they?" (Often, early predictions expect cooperation, but later nodes see defection.)  
     - **Key insight:** "BI assumes **common knowledge of rationality**—you know they’re rational, they know you know, etc. But your predictions show something else: at Node 1, you *expected* trust (PASS), but BI says you *should* expect defection (TAKE). The ‘paradox’ is that BI is logically sound, but real people hope for mutual gain."  

  3. **Die-Roll Game: Why No Unraveling?**  
     - **Ask:** "Did you PASS more often in the die-roll game? How far did pots grow?" (Usually, pairs go further—e.g., Node 4+.)  
     - **Contrast with fixed game:** "Backward induction needs a **commonly known last node** to start the chain. Here, the die roll means:  
       - There’s **no definite ‘final move’** to anchor the reasoning.  
       - Even if both are rational, PASSING could be optimal: A TAKE risks ending the game early, but a PASS might lead to a bigger pot *or* a lucky 50/50 split.  
       The ‘unraveling’ **has nowhere to begin**—you can’t iterate beliefs from the end because the end is fuzzy."  

  4. **Core Takeaway**  
     - "This isn’t about greed or distrust. BI fails in the die game not because players are ‘nicer,’ but because the **argument’s assumptions break down**: common knowledge of a fixed endpoint + iterated rationality. The force of BI comes from structure, not psychology."  

  ---

  ### **What Will Predictably Go Wrong**  
  1. **Fixed Game:**  
     - Most pairs will PASS at Node 1 (trusting partners), but defections spike at Nodes 3–5 as pots grow.  
     - Some players will regret passing when they see later defections ("I should’ve taken earlier!").  
     - Prediction slips may be messy (e.g., students misunderstand "partner expects YOU to do"). Simplify on the fly: "Just write TAKE/PASS for both predictions."  

  2. **Die-Roll Game:**  
     - Early die-roll ends (e.g., 6 at Node 1) may frustrate Player 1 ("I passed for nothing!").  
     - Time crunch: Games may run long if die rolls avoid 6. Cap at 8 nodes to stay within 60 mins.  

  3. **Logistics:**  
     - Students might discuss strategies mid-game. Enforce silence.  
     - Have extra prediction slips pre-printed to save time.  

  ---

  ### **What the Activity Can’t Show (Limitations)**  
  - **Can’t distinguish "nice" vs. "irrational":** If a player PASSES, it could be:  
    - **Kantian/altruistic motive** ("I want us both to win").  
    - **BI failure** ("I didn’t think about the end").  
    - **Overoptimism** ("I believed they’d cooperate, even if irrational").  
    Prediction slips hint at beliefs (e.g., expecting PASS = trust in cooperation), but won’t isolate motives. Use debrief to discuss this ambiguity.  

  - **Can’t prove BI is ‘wrong’:** The activity shows BI clashes with real behavior when trust exists, but BI remains logically sound under its assumptions. The die game doesn’t refute BI—it changes the rules so BI doesn’t apply.  

  - **Limited rationality depth:** Intro students won’t calculate iterated beliefs explicitly. Focus on the experiential clash (e.g., "I thought they’d pass, but they took!").  

  ---

  **Timing Breakdown:**  
  - Setup + Fixed Game: 20 mins  
  - Die-Roll Game (2 rounds): 25 mins  
  - Debrief: 15 mins  

  **Materials:**  
  - Prediction/decision slips (two-part carbonless paper for easy collection).  
  - Screen for die rolls.  
  - Pot tracker (whiteboard or poster).  
  - Candy for conversion (e.g., 10 points = 1 Starburst).  

  This plan ensures students experience the BI paradox viscerally, priming them for deeper theory later. The die variant highlights how fragile BI’s assumptions are—making the abstract concrete.
