prompt: |-
  I write about science and ideas for a British broadsheet, and after a decade of filing on the cognitive science of religion I have drifted into holding a position that is recognisably mine rather than one I am merely reporting. I should like it stress-tested before I commit it to print.

  The position has three parts. First, origins: the cognitive machinery that makes religious thought cheap and easy for human beings — promiscuous agency detection, an over-eager theory of mind, teleological bias, intuitions about contagion and about the dead — is a by-product of capacities selected for other work. Nothing in our ancestral history was selected because it produced religion. Second, persistence: what cultural transmission then filters for is not doctrine but cost. Fasts, pilgrimages, tithes, dietary rules, celibacy, distinctive dress, prayer at inconvenient hours — these are what make commitment legible to others and hard to fake, and groups that carry them outlast groups that do not. Third, and this is the part I take to be my own: propositional content functions chiefly as load-bearing scaffolding for those costs. It supplies reasons for bearing them that feel non-negotiable, and it is largely substitutable. What is transmitted down the generations is the cost structure, with the theology as the replaceable part that happens to be fitted to it at the time.

  So: what would count against this?

  I want defeaters, ranked from fatal down to merely awkward, and separated by kind — the empirical findings that would sink it, the conceptual objections that would show it confused or empty, and the results that would merely force me to rewrite a paragraph. For each, say what my position predicts that its rivals do not: the straightforward by-product story, the cultural-group-selection story that leans on morally concerned high gods and supernatural monitoring, and the generic costly-signalling accounts. And for each, say whether it is something a sympathetic defender of my position should concede as counting against them, or something I would be entitled to explain away.

  Three things worry me in particular, and I should like them addressed directly.

  One: the substitutability clause may have quietly made the whole thing unfalsifiable, since any stubborn piece of doctrine can always be re-described as locally necessary for locally required costs. If so, is there a formulation of the view that still risks something? And is a view of this kind entitled to be insulated in that way, or is the insulation itself the objection?

  Two: the discriminating predictions. My view says that the cooperative and prosocial premium associated with religion should track practice rather than belief, so that people who stop believing but keep practising retain most of it, while people who keep believing and stop practising lose it. It also says that where a welfare state, a mutual-aid society or an insurance market takes over the functions religious communities once provided, costly practice should decay before belief does. The design I keep asking somebody to run, and which so far as I know nobody has run, is a multi-wave panel across half a dozen countries that separates believing from belonging and tracks in-group cooperation, charitable giving, trust of strangers and self-reported behaviour over a decade or more. Tell me precisely which outcomes would refute me. I take it that a result in which the believing-without-practising group keeps the premium is bad for me; I am much less sure what I should say if both groups lose it at the same rate, or if the premium turns out to have been a selection artefact all along.

  Three: scope and collapse. Am I really making a claim about religion, or about a handful of post-Axial, mostly Abrahamic traditions that happen to be the ones I have reported on? And if cost does all the explanatory work and content none, does the position collapse into a general theory of costly commitment that would predict the same effects for a party cell, a military unit or a demanding amateur sports club — and should I count that as a refutation or as a Pyrrhic vindication?

  Two further requests. Please flag where the standard distinction between rare, high-arousal imagistic rituals and frequent, routinised doctrinal ones cuts against me, since I suspect my single currency of cost is really two or three currencies I have conflated. And please say plainly if the view is defensible as journalism but empty as a research programme, or the reverse. For what it is worth: the thing that would move me most is a failed pre-registered prediction rather than an armchair case about possible worlds, and the thing that would move me least is being told I have not defined religion, unless you can show that the undefended definition is doing real work in the argument.
reasoning: |-
  Hmm, the user is a science writer for a British broadsheet who's developed a distinctive position on the cognitive science of religion over a decade. They want their three-part theory stress-tested before publication. Let me break this down carefully.

  First, their position: (1) Religious cognition is a byproduct of evolved capacities (PAD, ToM, etc.), not directly selected for. (2) Cultural persistence depends on costly signals (fasts, tithes, etc.) that demonstrate commitment. (3) The novel claim: theological content is just scaffolding to justify those costs - replaceable while cost structures endure.

  They want objections categorized as fatal/awkward, empirical/conceptual, and compared to rival theories (standard byproduct, cultural group selection with moral gods, generic costly signaling). Three specific worries: substitutability making it unfalsifiable, predictions about practice vs belief, and scope beyond Abrahamic religions. Plus requests about ritual typology and practical defensibility.

  Okay, let's tackle the substitutability worry first. This is tricky - if any doctrine can be retrofitted as "necessary for local costs," it does risk unfalsifiability. But perhaps we can constrain it by requiring that substitutions must preserve the cost-profile. If a group switches from Ramadan fasting to, say, weekly poetry recitals with equal hardship, theology should be mutable. Finding rigid doctrine that resists change despite cost-equivalent alternatives would hurt the theory.

  For empirical tests, their prediction is clear: practice should drive prosocial effects, not belief. The ideal study would track disbelieving practitioners vs non-practicing believers over years. Key refutations: if belief-alone retains cooperation premiums, or if both groups decay equally fast. The latter might suggest community embeddedness matters more than individual practice - problematic because their model centers on personal cost-bearing.

  On scope, yes this seems Abrahamic-biased. Costly signals in Daoism or Indigenous traditions often aren't central to group cohesion. And if military units show identical effects, it doesn't refute but dilutes the religious specificity. Maybe they should position this as a theory of "high-cost commitment systems" where religion is a prime example.

  The imagistic/doctrinal ritual distinction matters. High-arousal rituals (like spirit possessions) create enduring bonds through intensity, not repetition. Their model fits routinized costs better. Also, some doctrines (e.g., karma) might directly enable cooperation without costly signals - contradicting the "scaffolding" claim.

  Conceptually, the biggest tension is between byproduct origins and functional persistence. How do byproducts evolve into essential group signals? They need to explain the transition without implying teleology.

  Empirically, studies on secularization and "believing without belonging" challenge the cost-first model. If belief decays slower than practice in welfare states, that undercuts their prediction. Also, experiments showing theological content (e.g., punitive gods) directly influencing cooperation would hurt the substitutability thesis.

  As journalism, this is provocative and coherent. As science, it needs more precise mechanisms: How exactly does theology "scaffold" costs? What determines when substitutions occur? Still, it generates testable predictions - which is more than many theories do. The pre-registered study they mentioned would indeed be the gold standard for validation.
answer: |-
  Below is a systematic stress-test of your position, structured as requested. I address fatal/awkward objections, empirical/conceptual challenges, rival theories, your three specific concerns, and closing requests. Key threats are **bolded**.

  ---

  ### **I. Fatal Objections** (Threaten Core Logic)

  1. **Empirical: Costly Signals Without Theology**  
     - **What sinks it**: Discovery of long-term, high-cooperation groups with *identical costly practices* but *contradictory/mutually exclusive doctrines* (e.g., Hindu caste purity rituals vs. Jain ahimsa asceticism producing identical social cohesion despite irreconcilable theology).  
     - **Rival predictions**:  
       - *By-product theory*: Expects no systematic link between costs/cohesion.  
       - *Moral High Gods*: Requires specific doctrinal content (e.g., punishing deities).  
       - *Generic costly-signalling*: Permits this, undermining your *religious* specificity.  
     - **Your defense**: Concede this refutes theology as "scaffolding" but argue it strengthens costly-signalling core. Risk: Collapse into generic theory (see III.3).  

  2. **Conceptual: The Supernatural Monitoring Problem**  
     - **What sinks it**: If supernatural belief *directly* enables cooperation (e.g., via perceived surveillance) without costly signals.  
     - **Evidence**: Field experiments (e.g., Shariff & Norenzayan 2007) show priming "watched by God" increases prosociality *independently* of practice costs.  
     - **Rival predictions**:  
       - *Moral High Gods*: Predicts this.  
       - *Your view*: Must explain priming as activating "cost memories" (weak).  
     - **Your defense**: Argue priming only works in cultures with *prior* costly practice (untested). Concede if lab effects replicate in atheists.  

  ---

  ### **II. Awkward Objections** (Force Revisions)

  3. **Empirical: Belief Without Practice Retains Benefits**  
     - **What refutes you**: Panel data showing "believing without practising" groups maintain cooperation/giving/trust at similar levels to practitioners.  
     - **Rival predictions**:  
       - *Moral High Gods*: Expects belief sufficient if deities are punitive.  
       - *By-product*: No strong prediction.  
     - **Your defense**: Attribute to self-selection (cooperative people retain belief) or residual community ties. **Concede** if data controls for these.  

  4. **Conceptual: Imagistic vs. Doctrinal Rituals**  
     - **What forces rewrite**: High-arousal rituals (e.g., possession, initiation) create cohesion *without* repetitive costs (Whitehouse 2004). Doctrinal rituals rely on frequent, low-cost repetition.  
     - **Problem**: Your "cost" metric conflates frequency (prayer 5x/day) with intensity (painful rites). These demand different explanations.  
     - **Revision**: Split "cost" into (a) *investment* (time/resources) and (b) *sacrifice* (pain/risk). Theology may scaffold (a) but not (b).  

  ---

  ### **III. Addressing Your Three Worries**

  1. **Substitutability & Falsifiability**  
     - **Fix**: Stipulate that theology must be *locally non-arbitrary* – e.g., doctrine must plausibly *justify* specific costs (Ramadan fasts → Qur’anic revelation; not random food rules).  
     - **Falsifier**: A group replacing theology *without altering cost structures* (e.g., Christians swapping Trinity for karma) but suffering cohesion collapse.  
     - **Entitlement**: Defensible if tied to cognitive constraints (e.g., theology must fit intuitive ontologies). Otherwise, insulation *is* the objection.  

  2. **Discriminating Predictions**  
     - **Refuting Outcomes**:  
       - (Fatal) Belief-without-practice retains full prosocial premium.  
       - (Awkward) Practice-without-belief *loses* premium rapidly (suggesting belief is active ingredient).  
       - (Concede) If welfare states decay practice *and* belief at equal rates (supports you).  
     - **Selection Artefact**: If cooperators disproportionately *join* religions, not religions *causing* cooperation. Fix: Control for pre-religious traits.  

  3. **Scope/Collapse**  
     - **Non-Axial Counterevidence**:  
       - Aboriginal Australian "Dreamtime" rituals: High cohesion with low-cost, non-substitutable lore.  
       - Daoism: Low-cost, non-prosocial, yet persistent.  
     - **Collapse into Generic Theory?**  
       - **Refutation** if: Sports/military groups show *identical* cooperation effects *without* theology.  
       - **Pyrrhic vindication** if: Religion is merely a culturally potent instance.  
     - **Your out**: Argue religious costs uniquely tap "non-negotiable" intuitions (e.g., dead ancestors).  

  ---

  ### **IV. Ritual Typology & Practical Defensibility**

  - **Imagistic Rituals**: High-arousal rites (e.g., firewalking) create cohesion through shared trauma, not theology. **Cuts against you** because content is non-substitutable and costs aren’t "scaffolded" but intrinsic.  
  - **Doctrinal Rituals**: Fit your model (prayer, fasting). Concede the typology splits your "cost" into distinct mechanisms.  

  - **Journalism vs. Research**:  
    - **Journalism**: Defensible – synthesizes cog sci, signaling, cultural evolution provocatively.  
    - **Research**: "Empty" without:  
      - Operationalizing "cost" (calories? time? opportunity cost?).  
      - Explaining *how* theology scaffolds (e.g., does threat of hell outperform karma for identical costs?).  
    - **Fix**: Propose a mechanism for content-cost binding (e.g., "doctrine legitimizes cost as obligatory").  

  ---

  ### **V. Conclusion: Salvage Strategy**
  - **Fatal if**: Theology is shown *causally necessary* for cooperation independent of cost (e.g., via supernatural punishment).  
  - **Vindicated if**: Panel data shows practice drives prosociality, and theology mutates while costs persist.  
  - **Revise**: (1) Differentiate cost types; (2) Specify *minimal* theology constraints (e.g., "must activate hyperactive agency detection"); (3) Narrow scope to "doctrinal religions."  

  **Strongest evidence for you**: Pre-registered study showing groups abandoning doctrine but *keeping* costs (e.g., secularized Jewish communities maintaining kosher-style ethics) retain cohesion.  
  **Strongest evidence against**: Atheist communes achieving equal cooperation via identical costly practices *without* theological scaffolding.  

  Your position is bold and largely defensible with refinements – but **the cost of collapse into generic signaling theory is high**. Anchor it in religion’s *cognitive distinctiveness* or concede it’s a subset of cultural commitment devices.
