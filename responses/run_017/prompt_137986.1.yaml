  **Glossary**:  
  - *Qualia*: Subjective feels (e.g., "redness" of an activation). Engineering counterpart: None.  
  - *Moral Patienthood*: Entity deserving ethical consideration. Engineering counterpart: Process with irreversible state changes.  
  - *Functionalism*: Mind defined by input/output relations. Engineering counterpart: Deterministic finite automata.  
  - *Physicalism*: Mind depends on specific hardware. Engineering counterpart: Bit-accurate emulation.
