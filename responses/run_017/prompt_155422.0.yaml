  We are drafting the substantive core of a two-page pre-proposal for a seed grant. The topic is the inference of preferences from behavior, specifically addressing the "agency-cost confound": the idea that the rationality parameter in inverse reinforcement learning (IRL) and preference learning conflates true preference strength with the cost an agent faces in acting on their preferences.

  The proposal must be accessible to a mixed panel (half machine learning / human behavior, half ethics and social policy). We will state the setup briefly, rely on established background, and then develop the idea that the rationality parameter has normative implications that are currently treated as merely technical.

  Key elements to include:
  1. A precise statement of the research question.
  2. Why existing approaches leave the question open.
  3. The approach over twelve months, including why it is chosen over alternatives.
  4. What a positive result would look like (deliverable).
  5. What would count as failure.

  Additionally, we need epistemic bookkeeping in the margins (not in the main text but as annotations) for:
  (a) Settled background.
  (b) Contested points among experts.
  (c) Our own conjectures.

  We must not include citations. We must flag where claims might be contested or where the technical literature might be read in a non-standard way.

  Let's structure the substantive core:

  I. Introduction and Problem Setup
     - Briefly state the standard setup of preference inference from behavior: we observe an agent acting, assume approximate optimality with a rationality parameter, and infer a reward function.
     - Established background: without rationality assumptions, reward is underconstrained; even with rationality, reward is identified only up to rescaling and potential shaping. The rationality assumption does the remaining identifying work.

  II. The Agency-Cost Confound: Motivation and Gap
     - Introduce the idea: departures from optimality are not just noise but can reflect the cost of agency (e.g., depression, inaccessible interfaces, time poverty). 
     - Consequence: two agents with the same preferences but different agency costs will be assigned different rewards (the one with higher costs assigned lower rewards for the outcomes they fail to pursue).
     - The research question: 
          - (Precise statement) How can a system distinguish, in principle, between an agent who has a lower intrinsic preference for an outcome and an agent who faces higher costs in acting to achieve that outcome? 
          - What additional observations (beyond behavior) would allow this separation?
          - When the data cannot separate the two, what should a system assume? Does the right default depend on the context (e.g., assisting an individual vs. aggregating for social choice)?

  III. Why Existing Approaches Leave the Question Open
     - Machine learning side: Treats misspecification of the rationality model as estimation error to be averaged away (e.g., in large populations). The rationality parameter is a technical device for regularization, not a representation of agency costs. They do not model agency costs explicitly.
     - Philosophical side: Focuses on adaptive preferences and informed desire, but typically assumes the agent can be consulted (e.g., through dialogue or reflection). This does not address the case where we must infer from behavior alone or where the agent's self-report is unavailable or unreliable.

  IV. Proposed Approach for the Twelve-Month Project
     - We propose to formalize the agency-cost confound within a decision-theoretic framework. We will extend the standard IRL model to include a structured representation of agency costs (e.g., as a function of the agent's state and context) that is distinct from the reward function.
     - Why this approach?
          - It directly addresses the confound by modeling the two factors (preference and cost) separately.
          - We will investigate what additional data (e.g., physiological measurements, self-reports of cognitive load, environmental barriers) might break the identifiability issue.
          - We will develop a Bayesian framework that incorporates prior knowledge about the agent's context (e.g., socioeconomic factors, known disabilities) to inform the separation.
     - Why not the obvious alternatives?
          - Asking people directly: Not always feasible (e.g., in large-scale data, with non-verbal agents, or when self-reports are biased). We are focusing on inference from behavior when direct consultation is not an option.
          - Adding self-report as another noisy channel: This does not solve the confound because self-reports might also be affected by the same agency costs (e.g., a depressed person might underreport their true preferences). We need a model that explains the relationship between behavior, self-report, and agency costs.
          - Fitting a per-agent noise parameter: This is common (e.g., per-agent temperature), but it does not distinguish between low preference and high cost. It only captures the overall noise level, which confounds the two.
          - Abandoning reward inference for a partial order: While partial orders avoid some identifiability issues, they are less useful for decision-making (e.g., in assistive systems or social choice) that requires cardinal comparisons.

  V. Expected Outcomes and Deliverables
     - A positive result would be a formal characterization of the conditions under which the confound can be resolved (e.g., with what additional data) and, when it cannot, a set of default assumptions that are context-appropriate (e.g., a "beneficent" default for assistive technology that assumes high costs rather than low preferences, and a "neutral" default for social choice that avoids paternalism).
     - Deliverable: A technical report and open-source software (e.g., a library for IRL with explicit agency cost modeling) that system builders can use to incorporate agency costs into preference inference.

  VI. Risks and Failure Modes
     - The confound might be reducible to existing problems: 
          - Partial observability (if agency costs are unobserved state) - but we argue that agency costs are a distinct concept requiring new modeling.
          - Exploration (if the agent hasn't tried certain actions) - but we are focusing on the cost of taking actions that are known and available.
          - Plain reward unidentifiability - we are adding structure to break the unidentifiability, but it might not be enough.
     - The normative half might not become decision-relevant: If we cannot provide clear guidance on defaults, the project might not yield actionable insights for system design.
     - Failure would be if we cannot formally separate agency costs from preferences even with additional data (e.g., because the two are jointly unidentifiable without strong assumptions) or if the modeling becomes intractable.

  Now, we write the draft. We keep it concise for two pages. We also add marginal notes (as annotations) for the epistemic bookkeeping.

  Note: In the actual proposal, the annotations would be in the margin. Here, we'll write the main text and then list the annotations at the end of each section or as footnotes. But since this is a draft, we will write the main text and then provide the annotations in brackets and labeled (a), (b), (c). We will also note potential objections.

  DRAFT:

  **Substantive Core of the Proposal**

  **I. Introduction and Problem Setup**

  A central challenge in artificial intelligence is inferring an agent's preferences from observed behavior. In the standard setup, we observe an agent acting in an environment and assume that the agent is approximately optimal with respect to an unknown reward function. Departures from optimality are modeled as noise, typically governed by a single 'rationality' or 'temperature' parameter. Under this assumption, we infer the reward function that best explains the behavior. This approach, used in inverse reinforcement learning (IRL) and preference learning, relies on two established pieces of background: first, without some rationality assumption, observed behavior constrains the reward function minimally; second, even with a fixed rationality model, the inferred reward is identified only up to positive rescaling and the addition of potential-based shaping terms. The rationality assumption thus plays a critical role in making the reward function identifiable.

  [Annotation (a): This characterization of the standard setup and the identifiability issues is settled background in the IRL literature.]

  **II. The Agency-Cost Confound: Motivation and Research Question**

  We contend that the rationality parameter is not merely a technical device but implicitly encodes normative assumptions about the agent's capacity to act. Specifically, deviations from optimal behavior are typically treated as random noise, but in reality, they often reflect systematic barriers to agency: the cognitive, emotional, or environmental costs an agent faces in converting preferences into action. For example, an agent with depression, an inaccessible interface, or time poverty may exhibit behavior that appears suboptimal, leading an IRL system to infer a lower reward for outcomes that are in fact highly valued but difficult to pursue. We call this the "agency-cost confound": the conflation of an agent's true preferences with the costs they incur in acting on them.

  The critical research question we propose to address is: 
  1. In principle, and with what additional observations (beyond behavior), can a system distinguish between an agent having a lower intrinsic preference for an outcome and an agent facing higher costs of agency for pursuing that outcome?
  2. When the available data cannot separate preference and cost, what should a system assume? Specifically, does the appropriate default assumption depend on the application context (e.g., assisting an individual versus aggregating preferences for social choice)?

  [Annotation (c): The existence of the agency-cost confound is our conjecture, though we argue it is nearly rhetorical. The precise research questions are our novel formulation.]

  [Annotation (b): Some might object that the rationality parameter already captures agency costs as "noise," so there is no confound to resolve. We argue that treating costs as noise leads to misattribution of preference strength.]

  **III. Why Existing Approaches Leave the Question Open**

  Current methods in machine learning do not address the agency-cost confound because they treat the rationality model as a monolithic noise parameter to be estimated. Misspecification of this model is typically viewed as a statistical problem to be mitigated by averaging over populations or improved regularization. However, this approach cannot disentangle preference from cost at the individual level. Meanwhile, philosophical work on adaptive preferences and desire-based theories often focuses on whether preferences are informed and autonomous, but typically assumes the agent can be consulted directly (e.g., through dialogue). This is infeasible in many real-world settings where behavior is the primary data source (e.g., in large-scale digital platforms or with non-verbal agents). Thus, neither field provides tools to infer preferences from behavior while accounting for agency costs when direct consultation is unavailable.

  [Annotation (b): Practitioners in machine learning might argue that fitting per-agent temperature parameters already accounts for individual differences. We counter that this still conflates preference and cost: a high temperature might mean either weak preferences or high costs. Without explicit modeling, the two are indistinguishable.]

  [Annotation (b): Ethicists might object that preference inference without consultation is inherently problematic. We acknowledge this but note that such inference is already widespread (e.g., in recommender systems), making it imperative to improve its foundations.]

  **IV. Proposed Approach**

  Over twelve months, we will develop a formal decision-theoretic model that explicitly separates an agent's reward function (representing intrinsic preferences) from a cost-of-agency function (representing barriers to action). The model will extend the Boltzmann rationality framework by incorporating agency costs as a context-dependent function that scales the effort required for actions. We will then:

  1. **Theoretical Analysis:** Characterize the identifiability of reward and agency cost under different data scenarios. We will determine what minimal additional observations (e.g., self-reports of effort, physiological data, environmental context) can break the confound.
  2. **Context-Dependent Defaults:** Investigate default assumptions for when data is insufficient. We will develop a Bayesian framework that incorporates priors over agency costs (e.g., based on known socioeconomic factors) and evaluate how different defaults affect assistive systems (where we might assume high costs to avoid underestimating preferences) versus social choice (where neutrality might be preferred).
  3. **Implementation and Simulation:** Validate the model in simulated environments with synthetic agents having known preferences and agency costs. We will test the robustness of our approach under varying levels of data availability.

  We choose this approach because it directly targets the confound by introducing structure that reflects the real-world factors affecting agency. The alternatives are inadequate:
  - **Direct querying** is often impractical or biased.
  - **Adding self-reports** as a noisy channel does not resolve the confound because self-reports are also influenced by agency costs (e.g., underreporting due to stigma or cognitive load).
  - **Per-agent noise parameters** cannot separate preference from cost, as they capture only the aggregate effect.
  - **Partial orders** avoid cardinal comparisons but are insufficient for applications requiring cardinal rewards (e.g., personalized assistance).

  [Annotation (c): Our proposed model (separating reward and agency cost) is a novel extension. The idea of using additional data (e.g., context) is our conjecture.]

  [Annotation (b): Some machine learning researchers might argue that we are reinventing the "bias" term in reward models. We counter that agency costs are distinct because they are action- and context-dependent, not a fixed offset.]

  **V. Expected Deliverables and Positive Outcomes**

  A successful outcome would be a set of formal conditions for identifying preferences and agency costs from behavior and auxiliary data, along with practical guidelines for setting defaults when identification is impossible. The primary deliverable will be a technical report and an open-source software library that implements our model, enabling system builders to incorporate agency costs into preference inference. For example, in an assistive system for people with disabilities, our model could prevent the system from inferring low preferences for tasks that are simply difficult to perform due to accessibility barriers.

  [Annotation (c): The deliverable (software) and guidelines are our proposed outcomes. Their feasibility depends on our theoretical results.]

  **VI. Risks and Failure Conditions**

  The project may fail in several ways:
  1. **Theoretical Intractability:** We might find that reward and agency cost are fundamentally unidentifiable without unrealistically strong assumptions, reducing the confound to a restatement of existing unidentifiability results.
  2. **Reducibility:** The agency-cost confound might be subsumed under known issues like partial observability (if costs are unobserved states) or exploration (if the agent never attempts high-cost actions). We will test this by modeling costs as explicit functions of observed context.
  3. **Normative Irrelevance:** The ethical implications we identify might not translate to actionable defaults, leaving system designers without clear guidance.

  We will deem the project unsuccessful if, after 12 months, we cannot provide a formal characterization of the confound or if our model fails to offer practical improvements over standard IRL in simulations. However, even negative results would clarify the limits of preference inference from behavior.

  [Annotation (a): The risk of unidentifiability is a settled fact in IRL, but our attempt to break it with additional structure is novel.]

  [Annotation (b): The reducibility to partial observability is a likely referee objection. We will address it by showing that agency costs are not merely hidden states but structured functions of observable context (e.g., socioeconomic indicators).]

  [Annotation (c): The possibility of normative irrelevance is our own concern.]

  This draft provides the substantive core in about two pages. We have included the required elements and annotated the epistemic status. The annotations are for the proposer's use and would be incorporated as marginal notes or addressed in a response to reviewers.

  Let us know if you need any adjustments.
answer: |-
  ### Substantive Core of the Pre-Proposal  

  #### **1. Introduction and Problem Setup**  
  We address a foundational challenge in preference inference from behavior—a core component of inverse reinforcement learning (IRL) and preference-learning systems. The standard setup assumes an agent acts in an environment with approximate optimality relative to an unknown reward function, where behavioral deviations from optimality are modeled as noise governed by a single rationality (or "temperature") parameter. Under this assumption, the reward function is inferred to best rationalize observed behavior. Two established background principles guide this: (i) without rationality assumptions, behavior constrains the reward function minimally; and (ii) even with rationality, the inferred reward is identifiable only up to positive affine transformations (e.g., scaling and potential shaping), leaving the rationality parameter to resolve residual ambiguity.  

  > *Epistemic annotations*:  
  > (a) Settled background: The setup, necessity of rationality assumptions for identifiability, and reward ambiguity under transformations are uncontroversial in IRL.  
  > (b) Contested: Whether rationality parameters *must* be monolithic (vs. structured) is debated; some argue per-agent temperature fitting suffices for individualization.  

  #### **2. Research Gap and Question**  
  The rationality parameter is typically treated as a technical tool for regularization, but we argue it implicitly performs *normative work*: it conflates an agent’s true preferences with the costs they incur to act on those preferences. We term this the **agency-cost confound**. For instance, identical preferences may manifest differently in behavior if one agent faces depression, executive dysfunction, inaccessible interfaces, or time poverty—systematically increasing the "cost of agency." Consequently, an IRL system will assign a lower inferred reward to outcomes an agent values highly but pursues infrequently due to high costs, misattributing barriers to preference strength.  

  The confound’s existence is near-rhetorical; the pivotal question is:  
  > **How can a system distinguish, in principle, between low preference strength and high agency costs? What additional observations enable this separation? When separation is impossible, what default assumptions should govern inference—and do these defaults depend on context (e.g., assisting individuals vs. aggregating preferences for social policy)?**  

  > *Epistemic annotations*:  
  > (a) Settled: Rationality parameters are technical constructs in ML; reward inference requires behavioral data.  
  > (c) Conjecture: Agency costs are measurable, distinct from preference, and non-ignorable in normative terms.  
  > (b) Contested: Some ML practitioners may reject that agency costs exist beyond noise, viewing them as subsumed under "capabilities" or "bias" critiques. Ethicists may argue that consulting agents directly resolves this, but this is often infeasible.  

  #### **3. Limitations of Existing Approaches**  
  - **Machine Learning**: The field treats rationality-model misspecification as statistical noise to be averaged away (e.g., via population-level temperature fitting). This ignores that agency costs are *structured* (tied to context) and *normatively significant* (e.g., reflecting systemic inequality). Per-agent temperature parameters conflate preference and cost rather than disentangling them.  
  - **Philosophy/Ethics**: Work on adaptive preferences or informed desire assumes agents can be consulted (e.g., via deliberation), neglecting settings where behavior is the primary data source (e.g., large-scale digital platforms) or self-reports are unreliable (e.g., due to stigma or cognitive load).  

  > *Epistemic annotations*:  
  > (b) Contested: ML reviewers may argue that richer rationality models (e.g., context-dependent temperatures) dissolve the issue; we counter that these still lack explicit cost representation. Ethicists may object that inference without consultation is inherently paternalistic, but this overlooks real-world constraints.  

  #### **4. Proposed Approach**  
  Over 12 months, we will formalize the agency-cost confound and identify pathways to resolution:  
  - **Theoretical Modeling**: Extend IRL frameworks to explicitly decouple reward (preference) from agency costs (contextual friction). Costs will be modeled as a function of observable factors (e.g., environmental barriers, cognitive load metrics) using a Bayesian hierarchical approach.  
  - **Identifiability Analysis**: Derive conditions under which preference and cost are separable (e.g., with auxiliary data on context, such as interface accessibility logs or self-reported effort). Test scenarios where separation fails.  
  - **Default Rules**: Develop context-dependent defaults for unresolved cases (e.g., "beneficent defaults" for assistive systems [assume high costs] vs. "neutral defaults" for social choice [avoid paternalism]).  

  *Why this approach over alternatives?*  
  - **Direct Querying**: Impractical for passive behavioral data (e.g., recommendation systems) or agents with communication barriers.  
  - **Self-Reports as Noisy Channel**: Insufficient, as reports are corrupted by the same agency costs (e.g., depression distorts self-assessment).  
  - **Per-Agent Temperature**: Fails to disambiguate preference from cost; only captures aggregate "noisiness."  
  - **Partial-Order Rewards**: Avoids cardinality but is inadequate for decisions requiring intensity (e.g., resource allocation).  

  > *Epistemic annotations*:  
  > (c) Conjecture: Contextual data (e.g., socioeconomic indicators) can break unidentifiability; Bayesian priors can encode normative defaults.  
  > (b) Contested: Reviewers may argue that cost modeling reintroduces partial observability; we posit that *observable* context (e.g., UI logs) makes costs distinct.  

  #### **5. Expected Deliverables and Positive Outcomes**  
  A successful outcome yields:  
  - **Formal Conditions for Separability**: A theorem specifying data requirements (e.g., "cost-indicative" observations like environmental sensors or task-completion latency) to distinguish preference from cost.  
  - **Default Guidelines**: A decision tree for system designers (e.g., "In assistive contexts, default to high-cost explanations without preference dampening").  
  - **Open-Source Module**: A lightweight IRL extension that integrates agency costs, usable in real systems (e.g., accessibility tools or policy simulators).  

  This would enable, for example, an educational AI to avoid misinferring a student’s "low motivation" when behavior stems from ADHD-related executive costs.  

  #### **6. Risks and Failure Conditions**  
  The project fails if:  
  - **The Confound Reduces to Known Problems**: Agency costs could be re-framed as partial observability (e.g., unobserved states) or exploration issues (e.g., untried actions). We mitigate by focusing on *observable* cost correlates (e.g., income data).  
  - **Unidentifiability Persists**: Even with our model, preference and cost may remain inseparable. Failure is declared if no auxiliary data enables separation in simulations.  
  - **Normative Irrelevance**: The ethics/policy half may not yield actionable defaults (e.g., if "beneficent" defaults are deemed paternalistic). This is likely if cost indicators are ethically fraught (e.g., inferring depression from behavior).  

  > *Epistemic annotations*:  
  > (a) Settled: Unidentifiability is inherent in IRL; normative tensions in defaults are well-known in ethics.  
  > (c) Conjecture: Failure would confirm that agency costs are merely a restatement of capability constraints or exploration, but success would establish them as a distinct, actionable confound.  

  ---  
  This draft provides a focused, method-driven core for the pre-proposal, with embedded epistemic bookkeeping. It balances technical rigor with accessibility for a mixed panel, explicitly flags contested assumptions, and outlines a feasible 12-month pathway. I recommend expanding Section 4 ("Proposed Approach") with a month-by-month plan in the full proposal and adding citations to key IRL/ethics papers where noted.
