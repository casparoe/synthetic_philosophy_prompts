        "splitting_question": "Would you pay the mugger if you knew the threat was real but paying would encourage future false muggers? (L7:No, L8:Depends on character virtues)"
      },
      {
        "leaf_ids": ["L4", "L6"],
        "shared_commitment": "Both reject maximizing in low-probability scenarios",
        "splitting_question": "In a verified 0.0001% chance to save 10,000 lives, would you act? (L4:No, L6:Yes if efficient)"
      }
    ],
    "known_failures": "This instrument struggles with: (1) Positions mixing epistemic/utility fixes (e.g., 'both prior decay AND utility bounds are needed'), (2) Deontological rejections of consequentialism (they bypass the starting point), (3) Case B responses where demonstration scales with claimed power. The pure offer scenario (C) sometimes fails to distinguish L3/L9 as cleanly as intended."
  }
  ```

  ### Key Features:
  1. **First Cut**: Branches on perceived flaw location (epistemics/utility/decision rule/unit) via case A.
  2. **Diagnostic Cases**: 
     - B tests prior decay vs. evidence sensitivity
     - C tests utility symmetry 
     - D isolates unit-shifting (act vs policy)
     - E checks scope sensitivity vs ambiguity aversion
     - F probes local/global tradeoffs
  3. **Leaves**: 10 named positions covering all requested types:
     - L1: Prior does work (Complexity-Penalized Prior)
     - L2: Pay-up fanaticism
     - L3: Utility does work (Bounded Utility)
     - L4/L5/L6: Decision rule variants
     - L7/L8: Wrong unit (Rule/Virtue)
     - L9: Local Value Priority (hybrid utility/rule)
     - L10: Reject setup (Epistemic Nihilism)
  4. **Unseparated Pairs**: Explicitly flags L7/L8 (policy vs virtue) and L4/L6 (truncation vs satisficing) with splitting questions.
  5. **Unoccupied Cells**: Highlights 3 empty paths (incoherent, unattractive, unexplored).
  6. **Scoring Key**: Maps case-response patterns to leaves, with mixed-pattern guidance.

  ### Usage Notes:
  - Start at N1 with case A, follow answers through nodes.
  - For study groups: Use cases as discussion prompts; match responses to leaves via scoring key.
  - "Awkward commitments" help stress-test positions (e.g., L1 must dismiss future tech announcements; L3 allows trading lives for chocolate at scale).
  - Holders described by approach (e.g., "contractualists") without namedropping.
