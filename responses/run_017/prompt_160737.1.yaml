  - nodes: array of objects with node_id, question (the concrete case or claim, phrased so it doesn't give away the destination), why_this_splits (one sentence on which positions come apart here), and answers (array of {label, leads_to: a node_id or a leaf_id}).
  - leaves: array of objects with leaf_id, name (or unnamed), path (the node_id:answer pairs that get you there), core_claim (one or two sentences), awkward_commitment (one sentence), and holders (a few words, or unnamed).
  - cases: array of objects with case_id, scenario (two to four sentences, concrete), question, options (two or three short labels), and maps_to (the node_id this case is really probing).
  - scoring_key: array of {pattern: the case_ids and chosen options, leaf_id, note} — including a note on what to do with messy or mixed patterns that don't land cleanly on one leaf.
  - unoccupied_cells: array of {path, why_empty, verdict: incoherent | unattractive | unexplored}.
  - unseparated_pairs: array of {leaf_ids, shared_commitment, splitting_question: a question, or none, theyre the same position}.
  - known_failures: a short paragraph on what the instrument can't do — which positions it handles badly, or which of my cases don't actually discriminate.

