  1. Students work in pairs. Each pair gets two envelopes: one with amount X and the other with 2X (or X/2, but we'll set X as the smaller so the other is 2X).
  2. Each student in the pair gets one envelope (randomly assigned). They can look inside their own envelope and then decide whether to trade with their partner.
  3. We want both students to sometimes feel that trading is beneficial (due to the switching argument) and then when both decide to trade, they trade and both end up with the same as they started? But note: if one has the small and the other the large, then trading will swap them. However, the switching argument suggests that each, upon seeing their amount, thinks they have a 50% chance of having the larger and 50% of the smaller, and hence the expected value of switching is positive. We want to set up so that both students in a pair might simultaneously decide to trade, leading to a swap that leaves them no better off (and actually, they are just swapping the two envelopes). But note: if both decide to trade, they do swap. The paradox is that each thought they would be better off by trading, but after trading they are just in the other's position, which is not necessarily better.

