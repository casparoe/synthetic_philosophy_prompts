  ### Game Design: The Envelope Exchange Challenge

  #### **Core Mechanics**
  - **Pairs**: Students work in 11 pairs (22 students). Each pair receives two envelopes: one with amount **X** and one with **2X**.
  - **Rounds**: 5 rounds of play (12 minutes each). Each round has new envelopes.
  - **Decisions**: 
    1. Students **peek** at their envelope.
    2. Independently decide to **trade** or **keep**.
    3. Trade occurs **only if both agree**. If one refuses, no trade happens.
  - **Payoff**: Points = amount in final envelope. Points convert to chocolate (e.g., 50 points = 1 chocolate). Total points across 5 rounds determine rewards.

  #### **Envelope Setup**
  - **Amounts**: Use **powers of 2** to avoid "odd/even" clues and ensure clean doubling/halving.  
    - Smaller amount **X** ∈ {1, 2, 4, 8, 16} (uniform random draw per pair per round).  
    - Envelopes: One with **X**, one with **2X** (randomly assigned to students).  
    - Possible amounts seen: 1, 2, 4, 8, 16, 32.
  - **Why this spread?**  
    - Bounded range (1–32) prevents extreme values from skewing averages.  
    - Non-boundary amounts (2, 4, 8, 16) make the switching argument *feel* compelling (equal chance of half/double).  
    - Boundary amounts (1, 32) expose flaws (you *know* the other envelope when you see 1 or 32).

  #### **Rules**
  1. **No communication** between partners after envelopes are opened.
  2. Decisions are **secret** (write "Trade" or "Keep" on a card, reveal simultaneously).
  3. Trade occurs **only if both say "Trade"**.
  4. Record: (1) Amount seen, (2) Decision, (3) Final amount.

  ---

  ### **Timeline (80 Minutes)**
  | **Time** | **Activity**                                                                                                                                 |
  |----------|----------------------------------------------------------------------------------------------------------------------------------------------|
  | 0–5 min  | **Intro**: Explain rules, payoff, and goal ("maximize points"). Avoid terms like "paradox" or "expected value." Emphasize secrecy and independence. |
  | 5–17 min | **Round 1**: Distribute envelopes. Students peek, decide, resolve trades, record results.                                                  |
  | 17–29 min| **Round 2**: New envelopes. Repeat.                                                                                                         |
  | 29–41 min| **Round 3**: Repeat. Encourage note-taking on their strategy.                                                                               |
  | 41–53 min| **Round 4**: Repeat. Announce: "Try a new tactic if you want."                                                                              |
  | 53–65 min| **Round 5**: Repeat. Include randomized rule (see below).                                                                                   |
  | 65–70 min| **Data Collection**: Pairs report results on a shared board. Aggregate: (1) % who switched, (2) Avg. final points per round.                |
  | 70–80 min| **Debrief**: Discuss results, map to paradox, reveal flaws.                                                                                 |

  ---

  ### **Key Elements to Highlight**
  #### 1. **The Switching Argument Collision**
     - **How it unfolds**:  
       - In non-boundary cases (e.g., a student sees 4), they reason: "Other envelope is 2 or 8, so expected value of trading is 5 > 4."  
       - **Both students in a pair will often decide to trade** (especially in early rounds).  
       - When they trade, one gains (e.g., 4→8) and one loses (8→4). The net gain is zero.  
     - **Classroom moment**: In Round 1, ask pairs where both traded to share outcomes. Highlight that both thought they’d gain, but one lost.  
     - **Pressure on premise**: Challenges the assumption that "half or double is equally likely *given your information*." In reality, the prior distribution of X matters.

  #### 2. **Randomized Threshold Rule**
     - **How to include**: In Round 5, secretly ask 3–4 students to use:  
       *"Pick a random number T (e.g., 5, 10, 20). Switch only if amount seen < T."*  
     - **Why it works (sometimes)**: In unbounded distributions, this avoids switching on very large amounts (where losing hurts most).  
     - **In this game**: It may slightly outperform always/never-switch if T is chosen wisely (e.g., T=10), but **not decisively** due to bounded range.  
     - **Debrief point**: This shifts the flaw to the prior distribution. If X has heavy tails, expected values may not converge.

  #### 3. **Predictable Issues & Solutions**
     - **"I won’t open the envelope!"**  
       - *Use it*: These students act blindly. Contrast their results with peers (they often lose more). Shows that information *feels* valuable even when misleading.  
     - **"This is mind-reading!"**  
       - Redirect: "Your goal isn’t to outsmart your partner. It’s to maximize your points given the amounts."  
     - **"Your chocolate budget is finite!"**  
       - *Leverage it*: "If you think I’m skewed toward small amounts, does that change your strategy?" Leads to prior distribution discussion.  
     - **Lopsided trades**: Some pairs will have mismatched decisions (e.g., one wants trade, one refuses). Use to show "single-player" bias.

  ---

  ### **Debrief Framework**
  #### **Step 1: Review Aggregate Results**
  - **Expected result**: Switching is break-even (avg. final points ≈ 9.3 per round).  
  - **If switching *appears* profitable**: Blame small samples. Show math:  
    - Avg. amount = (1×1 + 2×2 + 4×2 + 8×2 + 16×2 + 32×1)/10 = 9.3.  
    - Always switching gives same expectation: (3/2) × avg(X) = (3/2) × (31/5) = 9.3.  

  #### **Step 2: Map Game Moments to the Paradox**
  | **Game Moment**                     | **Paradox Premise Challenged**                                  | **In-Class Question**                                                                 |
  |-------------------------------------|-----------------------------------------------------------------|---------------------------------------------------------------------------------------|
  | Both trade, but one loses.          | "Switching always has positive EV."                             | "Why did you both expect to gain, but one lost?"                                      |
  | Seeing 1 or 32 → certainty.         | "The other envelope is always half or double with equal prob."  | "When you saw 1, did you *know* the other amount? How does that break the 50/50?"    |
  | Randomized rule avoids big losses.  | "Expected value exists." (Heavy-tail distributions break this.) | "Did threshold-switchers lose less on big amounts? Why might that help in real life?"|

  #### **Step 3: Formalize the Flaw**
  - **Switching argument**: If I see A, EV(switch) = (0.5 × A/2) + (0.5 × 2A) = 1.25A > A.  
  - **Flaw**: The 50/50 assumption ignores the **prior probability of X**.  
    - In bounded distributions (like this game), 50/50 holds for non-boundary amounts, but:  
      - Gains/losses cancel: +X (when switching from small) vs. -X (when switching from large).  
    - In unbounded distributions, EV can be infinite or undefined.  

  #### **Step 4: Address the Threshold Rule**
  - "One of you used: *Switch only if amount < T*. This exploits the prior: small amounts are more likely to be the smaller envelope.  
  - **Why it (sort of) works**: It avoids switching on large amounts where the risk of losing X is high.  
  - **Caveat**: In this game, the bounded range limits gains, but in theory, with heavy-tailed priors, it can beat always/never-switch.  

  ---

  ### **What the Game Can’t Replicate**
  1. **Infinite Expectations**:  
     - With unbounded distributions (e.g., Pareto), averages "never settle." The game’s bounded amounts avoid this noise.  
     - **Supply in debrief**: Show a simulated Pareto distribution where switching *appears* profitable even after 10,000 trials.  

  2. **Perfect Rationality**:  
     - Students will second-guess ("My partner probably saw a big number!").  
     - **Use it**: Explain how real-world ambiguity differs from the "pure" paradox.

  ---

  ### **Logistics & Materials**
  - **Envelopes**: Pre-make 110 envelopes (11 pairs × 5 rounds × 2 envelopes).  
    - Label with round/pair. Inside: slip with amount (e.g., "4" or "8").  
  - **Randomization**: Use a random number generator (1,2,4,8,16) for X per pair/round.  
  - **Payoff**: 50 points = 1 chocolate (avg. 46.5 points/student = ~1 chocolate each; budget: 22 chocolates).  

  This design forces students to *experience* the paradox, making the flaw visceral. The aggregated data and peer collisions create "aha!" moments that lectures can’t.
