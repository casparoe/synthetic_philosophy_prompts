prompt: |-
  I'm a couple years into a philosophy PhD and I keep bumping into the same knot of practices, and I want someone to lay out what they actually commit us to.

  The pattern: our handbook requires a dissertation to contain an "original contribution to knowledge". Referee reports reject papers for being unoriginal — the point's already in the literature, we've known that since forever, nothing new here. So novelty is mandatory and re-saying is worthless. But at the same time there are almost no graduate-level textbooks, seminars assign the same primary texts that were being assigned decades ago, nobody can hand you a list of results the field has settled, and the line we give undergrads (and half beleive ourselves) is that the big questions are as open as ever and that what philosophy does is clarify them rather than solve them. Then there's citation practice: a philosophy paper will argue with two or three interlocutors and cite essentially nobody else, even though the whole idea of a novelty requirement is that there's a stock of stuff already said that you're supposed to be adding to.

  So: what theory of progress does that bundle presuppose? Is it one theory, or two that don't fit together? Please split progress up instead of treating it as a single thing — something like convergence on verdicts; permanent elimination of positions (an argument kills a view and it stays dead, instead of coming back twenty years later under a new name); questions and distinctions getting better articulated so they become permanent tools everyone uses; and new formal or conceptual machinery. Which of those does the novelty requirement actually need? Which does the no-textbooks-and-same-old-reading-lists part rule out? Can someone who thinks philosophy only progresses in the last two senses still make sense of rejecting a paper for being unoriginal?

  I also want the underdetermination bit: which of these practices would several rival theories of progress license equally well, and which strictly commit us to something? And then the counterfactual: if we really believed the strong accumulation picture — a standing stock of results that grows, refutations that are permanent and on record — what would have to change? I'm imagining something like a canonical registry of dead positions, so a referee can just write "this is entry #47, denied", real graduate textbooks layered over the primary texts, and a norm of citing everything relevant rather than only your sparring partners. Is that what the picture implies, or does the picture survive without any of that? And if we went the other way and embraced no-progress-except-clarification, does the original-contribution requirement collapse, or does it survive as something thinner, like a requirement of original formulation?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a philosophy PhD student struggling with what seems like contradictory practices in their field. On one hand, there's a demand for original contributions in dissertations and publications. On the other, the field relies on the same primary texts for decades, lacks graduate textbooks, and claims that big questions remain unsolved. Plus, citation practices are sparse, focusing only on a few interlocutors.

  First, I need to figure out the core issue: the tension between requiring novelty while not having clear mechanisms for accumulating knowledge. The user wants to know what theory of progress underlies these practices and if it's coherent. They also ask about underdetermination—how different theories of progress could explain the same practices—and what changes would follow from adopting a stronger accumulation model.

  The user mentions splitting progress into types: convergence on verdicts, elimination of positions, better articulation of questions, and new conceptual tools. I should address each in relation to the practices they described. For example, the novelty requirement might only need the last two types, while the lack of textbooks rules out the first two. That could resolve part of the tension.

  I recall that philosophy often sees progress as clarification rather than solution. Thinkers like Wittgenstein or conceptual analysts support this. But how does that mesh with demanding original contributions? Maybe originality here means novel frameworks or distinctions, not new answers. That could explain the sparse citations—only engaging with immediate predecessors in the dialectic, not the entire literature.

  The user’s question about underdetermination is crucial. The same practices might stem from different theories. For instance, sparse citations could fit both a dialectical model (focusing on current debates) or an archival model (assuming prior work is preserved). But the lack of textbooks might indicate skepticism about settled truths, leaning towards a clarification model.

  Considering counterfactuals: if philosophy adopted a strong accumulation model, we'd need registries of refuted positions, comprehensive textbooks, systematic citations. But that clashes with the field's current state. Conversely, embracing only clarification might reduce originality to novel articulation, preserving the contribution requirement but redefining it.

  The user might also be hinting at a deeper frustration with the field's epistemic norms. They might feel stuck between institutional demands for novelty and a discipline that doesn’t accumulate knowledge like sciences. Their identity as a PhD student adds pressure—navigating these contradictions to produce original work. They likely want validation that their observations are valid and seek frameworks to make sense of their experience without losing faith in their career path.

  I should ensure the response validates their observations and provides clear categories to analyze the tensions. Highlighting that the field operates with a "clarification-plus-innovation" model could help them reconcile the demands. Also, addressing the practical implications—like how to frame their work as original within this model—might be their unspoken need.
answer: |-
  This is a brilliant dissection of a core tension in contemporary (especially analytic) philosophy. You're absolutely right – the practices you describe pull in seemingly contradictory directions. Let's break down the theories of progress implied by each practice, see what they commit us to, and how they might (or might not) cohere.

  **Splitting Progress: The Four Axes**

  1.  **Convergence on Verdicts (CV):** Progress means the field increasingly agrees on answers to core questions (e.g., "Free will is compatible with determinism," "Moral facts are non-natural," "Knowledge is justified true belief plus X"). Requires *settlement*.
  2.  **Permanent Elimination of Positions (EP):** Progress means arguments definitively refute specific positions, removing them from serious contention. Requires *irreversible falsification*.
  3.  **Improved Articulation of Questions/Distinctions (AQ):** Progress means developing clearer, more precise, more nuanced ways of framing problems, asking questions, and making conceptual distinctions. Requires *conceptual refinement*.
  4.  **Development of New Formal/Conceptual Machinery (NM):** Progress means inventing new tools (logical systems, thought experiments, formal models, conceptual frameworks) that enable better analysis, argumentation, or expression of ideas. Requires *innovation*.

  **Mapping Practices to Theories of Progress (and Commitments)**

  1.  **Novelty Requirement (Dissertation/Publication):**
      *   **Implies:** Progress *requires addition*, not just repetition. Stagnation is failure.
      *   **Minimal Commitment:** Primarily **NM** and **AQ**. You must develop *new* tools, distinctions, arguments, frameworks, or articulations. It *can* accommodate **CV** or **EP** (if your novelty *leads* to convergence or elimination), but doesn't *require* them.
      *   **Ruled Out?** It explicitly rules out *mere* repetition, summary, or popularization of existing knowledge without significant new **NM/AQ**.
      *   **Coherence with Clarification:** Perfectly coherent. **AQ** *is* clarification. **NM** is often a *means* to clarification (e.g., new logical notation, a new thought experiment revealing a distinction). "Original formulation" (**AQ** applied to expression) *is* a form of novelty under this view. The requirement survives, demanding **novel clarification or novel tools for clarification**.

  2.  **No Graduate Textbooks / Same Primary Texts:**
      *   **Implies:** The "foundational" knowledge isn't settled enough, or isn't knowledge *of settled truths*, to warrant authoritative synthesis in textbook form. Primary texts remain the *locus* of insight and debate.
      *   **Commitment:** Strongly suggests skepticism about robust **CV** and **EP**. If positions were permanently eliminated or verdicts converged upon, textbooks *summarizing those results* would be feasible and valuable. The enduring relevance of primary texts implies the problems they tackle remain *live* and the arguments *revisitable*.
      *   **Ruled In:** Strongly favors **AQ** and **NM**. Primary texts are studied not (just) for their "answers" but as exemplars of powerful articulation (**AQ**) and innovative conceptual moves (**NM**). We return to them to see *how* they framed the problem, what distinctions they made, what tools they used, and how later work (**AQ/NM**) responds to or refines that. It also implies the *dialectical context* is crucial, preserved best in primary sources.
      *   **Coherence with Novelty Requirement?** Yes, under **AQ/NM**. You innovate *on* or *in response to* the tradition embodied in the primary texts. The lack of textbooks highlights that the "stock" isn't settled answers, but a complex, contested *dialogue* requiring ongoing engagement and novel contributions *within* it.

  3.  **"Big Questions Open"/"Progress is Clarification":**
      *   **Implies:** Philosophy doesn't (typically) achieve definitive, settled answers (**CV**) or permanently kill off large positions (**EP**) on its biggest questions. Its value lies in deepening understanding, refining questions, exposing assumptions, and improving the quality of discourse (**AQ**, potentially enabled by **NM**).
      *   **Commitment:** Explicitly prioritizes **AQ** (and often **NM** as its engine) over **CV** and **EP**. It's a theory *of* progress, but one focused on *process* and *understanding* rather than *final products* (settled truths).
      *   **Coherence with Novelty?** Yes. Novel **AQ/NM** *is* the primary mode of clarification. A paper making a genuinely new distinction (**AQ**) or deploying a novel formal model (**NM**) to clarify an old problem *is* making an original contribution, even if it doesn't "solve" the big question or kill off a major position.

  4.  **Sparse Citation (2-3 Interlocutors):**
      *   **Implies:** The relevant "conversation" for a specific paper is highly localized and dialectical. The goal is often to intervene decisively in a *current*, specific debate between a few key players, not to comprehensively survey the entire history of the problem. The "stock" is vast and context-dependent.
      *   **Commitment:** Compatible with **AQ/NM** focus. You cite the *immediate* sources of the specific distinction/argument/tool you are engaging with or building upon *right now*. It fits a view where progress is *dialectical chains* rather than *accumulating bricks*. It **doesn't necessarily imply** there *isn't* a larger stock; it implies that engaging with the *entire* stock for every paper is impractical and often irrelevant to the specific, narrow dialectical move being made. However, it *is* in tension with a strong **CV/EP** view, where comprehensive citation would be needed to show how your work builds on/finally settles established results.
      *   **Underdetermination:** This practice *could* arise from:
          *   **Clarification Model (AQ/NM dominant):** Focused on the immediate dialectical context for refining a specific point.
          *   **Strong Accumulation Model (CV/EP dominant):** But *only if* combined with (a) extreme impracticality of citing everything, and (b) a robust institutional memory (archives, textbooks) making comprehensive citation *unnecessary*. Since (b) is absent in philosophy, the practice leans more towards supporting the **AQ/NM** model.

  **Synthesizing the Bundle: "Clarification-Plus-Innovation"**

  The practices cohere best under a **dominant AQ/NM theory of progress, supplemented by localized, contingent, or aspirational CV/EP.**

  1.  **Core Progress = AQ & NM:** Philosophy progresses primarily by refining questions, distinctions, and conceptual frameworks (**AQ**), often enabled or driven by developing new tools and methods (**NM**). This is the "clarification" narrative.
  2.  **Novelty Requirement Explained:** An "original contribution" means novel **AQ** (a new distinction, a refined question, a new way of framing the problem) or novel **NM** (a new argument form, thought experiment, formal model, conceptual apparatus). Re-saying existing points without such novelty *is* worthless *under this model*.
  3.  **Primary Texts Endure:** They are the canonical sources of powerful **AQ/NM** that continue to define the problems and inspire further refinement/innovation. Textbooks are scarce because summarizing "settled truths" (**CV**) isn't the primary goal; engaging with the *process* of refinement embodied in primary sources is.
  4.  **Sparse Citations Explained:** Papers engage in localized dialectics. They cite the *immediate* sources of the specific **AQ/NM** points they are refining, extending, or challenging *in this specific intervention*. The vast "stock" of past **AQ/NM** is acknowledged but selectively engaged with based on the paper's narrow focus. The field assumes scholars are broadly familiar with the relevant canon (established through seminars/reading lists), making exhaustive citation for context less necessary than in a field building linearly on settled results.
  5.  **CV & EP: Aspirational or Local:** Convergence or elimination *might* happen locally, on small points (e.g., "That *specific* argument for position X is flawed"), or within specific sub-debates for a time. The "big questions" remain open, but the *quality* of the discussion (**AQ**) and the *tools* available (**NM**) improve. Positions often return because new **AQ/NM** reframes them or reveals flaws in the supposed refutation.

  **Underdetermination: What Could License These Practices?**

  *   **Clarification-Plus-Innovation Model (AQ/NM Dominant):** As above, directly licenses novelty as **AQ/NM**, sparse citations (focused dialectic), primary texts (source of canonical **AQ/NM**), no textbooks (no settled **CV** core), and open big questions.
  *   **"Dialectical Stasis" Model (No Progress):** Could *mimic* the practices: "Original contribution" becomes merely *saying something slightly different* (not better); primary texts persist because nothing better comes along; sparse citations reflect insularity; no textbooks because there's nothing stable to summarize. However, the *active demand* for novelty and the self-perception of progress ("clarification") contradict pure stasis. The practices *assume* progress is possible and demanded.
  *   **Strong Accumulation Model (CV/EP Dominant) *Requires Additional Mechanisms*:** It could license the *novelty requirement* (adding new bricks) but **cannot** easily license the *other practices without significant institutional changes*. Sparse citations, reliance solely on primary texts, and lack of textbooks are *anomalies* under strong accumulation.

  **Counterfactual: Embracing Strong Accumulation (CV/EP)**

  If philosophy genuinely adopted this:

  1.  **Canonical Textbooks:** Graduate education *would* involve textbooks systematically summarizing settled results, core arguments, refuted positions, and established conceptual tools. Primary texts would be studied *historically* or as *source material*, not as the primary pedagogical vehicle.
  2.  **Registry of Dead Positions:** Something like this *would* emerge. Journals/databases would formally record definitive refutations. Referee reports *could* (and *should*) say "This position was refuted by Author X (Citation) via Argument Y. See standard refutation in Textbook Z, Ch. 4." Reviving dead positions without significant new **NM/AQ** justifying resurrection would be grounds for rejection.
  3.  **Comprehensive Citation Norms:** Papers *would* be expected to cite *all* relevant prior work establishing the background results they build upon. Failure to engage with the established "stock" would be a major flaw, akin to ignoring prior experimental results in science. The "2-3 interlocutors" model would be seen as intellectually irresponsible.
  4.  **Shift in Novelty:** Novelty would focus more on *applying* established tools/methods to new problems, synthesizing existing results in new ways, or *finally* settling (**CV**) or killing (**EP**) a major outstanding question/position. Pure **AQ/NM** without clear **CV/EP** payoff might be seen as less central or even preliminary.
  5.  **"Big Questions Open" Narrative Fades:** The narrative would shift to "We've settled aspects A, B, and C; positions X and Y are dead; the remaining open questions are Q1 and Q2, and here's the current state of play." Progress would be measurable by the growth of the textbook and the registry.

  **Conclusion: The Coherent (if Fragile) Picture**

  The bundle of practices *does* cohere under a **"Clarification-Plus-Innovation"** model of progress (**AQ/NM** dominant, with localized/aspirational **CV/EP**).

  *   **Novelty Requirement:** Needs and gets **AQ/NM**.
  *   **Primary Texts / No Textbooks:** Reflects the focus on canonical sources of **AQ/NM** and skepticism about large-scale **CV/EP**.
  *   **Sparse Citations:** Fits the localized dialectical nature of contributing new **AQ/NM** within an ongoing conversation.
  *   **Open Big Questions / Clarification Narrative:** Explicitly endorses **AQ** as the core progress mode.

  The **original-contribution requirement survives robustly** under this picture, demanding **novel articulation, novel distinctions, or novel conceptual/formal tools**. It collapses only if "progress" is reduced to *mere* repetition of existing formulations, which the "clarification" narrative itself rejects – clarification *requires* refinement, which implies novelty.

  The tension you feel arises because the field *implicitly* operates with this **AQ/NM** model while sometimes borrowing rhetoric or evaluative criteria (**CV/EP**) from stronger accumulation models, and because the institutional mechanisms (like citation norms) reflect the **AQ/NM** reality rather than a **CV/EP** ideal. Recognizing this dominant model helps make sense of the practices, even if it leaves open questions about whether a stronger form of accumulation is possible or desirable in philosophy.
