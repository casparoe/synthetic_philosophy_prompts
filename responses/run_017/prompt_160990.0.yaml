  | Infertility       | severe               | severe            | no        | both          | Humanity ends; no one to receive or carry forward legacy (both fail). |
  | Digital descent   | severe               | none              | yes       | TV            | Humans extinct (AC fails), but digital minds provide full uptake (TV succeeds). |
  | Alien uptake      | severe               | moderate          | yes       | TV            | Humans gone (AC fails), but aliens value legacy (partial TV success; no shared continuity). |
  | Hostile successors| none                 | severe            | yes       | TV            | Humanity thrives (AC satisfied), but legacy rejected (TV fails).      |
