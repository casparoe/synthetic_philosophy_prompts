    "verdict": "I'd defend the testamentary view, as it better explains why legacy continuity (not human biology) grounds meaning by linking projects to future agency."
  }
  ```

  ### Explanation
  - **Divergence**: Scenarios 3–6 show clearest splits, with AC indifferent to legacy preservation if humans survive, while TV demands meaningful uptake.
  - **Intuitive Fit**: TV aligns best in digital/alien cases (legacy preserved ≠ catastrophe) and hostile/amnesia cases (legacy destroyed = catastrophe), whereas AC underrates legacy loss (e.g., hostile successors).
  - **Crux**: Hostile successors forces a choice—AC ignores value-erasure, but TV captures why it feels existentially devastating.
  - **Biggest Cost for TV**: While TV requires an audience, it defines uptake as *project-completion* (e.g., aliens continuing our science), not applause, avoiding narcissism.
  - **Backwards Loss**: TV allows meaning to be "undone" posthumously if uptake fails, but this reflects how legacy inherently spans time.
