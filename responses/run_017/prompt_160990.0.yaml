    "case_that_decides_it": "Hostile successors, because AC dismisses catastrophic value-repudiation as irrelevant while TV treats it as a severe loss of meaning—aligning with the intuition that legacy rejection nullifies purpose.",
    "biggest_cost": "TV risks reducing meaning to mere audience reception, but this isn't fatal: uptake is about project-completion, not validation, so it avoids collapsing into vanity.",
