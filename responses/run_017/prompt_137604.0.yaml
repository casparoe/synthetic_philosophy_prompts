  We are given three precedents and three proposed rules. We need to determine for next week's case whether the Group will approve or reject the agent's policy. Then we are to see what each of the three rules predicts for that case, which verdict is our best guess, and why. We also must identify the closest precedent. Finally, we are to design a further case to distinguish between the rules that might survive.

  Precedents:

  1. **Experiment case**: Agent starts at 0.3 on H. It runs a clean experiment and updates by conditionalization. It ends at 0.7 on success and 0.1 on failure. The agent satisfies Reflection (conditional credence on each future credence matches that future credence). Approved.

  2. **Confidence drug case**: Agent at 0.4 on H, knows it will be given a confidence drug that forces future credence to 0.9 regardless of evidence. The agent does not defer: unconditional credence remains 0.4, and conditional credence given future credence 0.9 is 0.4 (violates Reflection). Approved.

  3. **Bias-removal therapy case**: Agent currently biased at 0.8 on H, knows that therapy (no new evidence) will leave it at 0.3. The agent defers: sets current credence to 0.3. This satisfies Reflection (because the future credence is certain to be 0.3, so unconditional now is 0.3). Approved.

