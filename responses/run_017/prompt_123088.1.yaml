prompt: |-
  I'm a journalist working on a piece about why economics keeps building models out of assumptions everyone involved agrees are false. Nearly every economist I put the question to comes back with the same picture: a model is a map. The Tube map is not drawn to scale, and no one takes that to stop it getting you from Holborn to Bank; a model's false assumptions are its not being to scale. The picture then does real work: it is used to dismiss worries about unrealistic assumptions as pedantry about scale, and, in the stronger form Friedman gave the point in his 1953 essay on the methodology of positive economics (the one Samuelson called the F-twist), to suggest that unrealistic assumptions are a mark of a theory's significance rather than a cost.

  I would like to audit it before I let it into print. Three things worry me. First, I have started sorting false assumptions into three kinds: those that shrink a magnitude the modeller takes to be irrelevant (no friction, no transport costs); those that fix or restrict the domain (a continuum of traders, zero transaction costs); and as-if surrogates, where the mechanism is granted to be false but the behaviour is claimed to match (firms acting as if they equated marginal revenue with marginal cost when no one is doing any such calculation). I suspect the map has resources for the first two and none for the third. Second, the map seems to cover only distortions you could in principle pay to remove, not falsehoods without which the model derives nothing at all. Third, a map states its scale and projection on its face and can be checked point by point against a territory that exists independently of it; a model does neither.

  Give me the correspondence table — what plays the territory, the scale, the projection, the route — then where the mapping holds, where it breaks for the use I have described, which of my three kinds each breakage bears on, and whether the stronger conclusion survives once the breakages are in, or whether the analogy was carrying it.

  Sections in this order, please: "Correspondences" (a table, or about 100 words); "Where it holds" (about 100 words); "Where it breaks" (about 250 words, each breakage tagged to one of my three kinds); "What the analogy was carrying" (about 100 words); "A better analogy, if there is one" (about 75 words).
reasoning: |-
  Okay, the user is a journalist writing about why economists use models with false assumptions. They've encountered the "map analogy" repeatedly, where models are compared to maps like the London Tube map—not to scale but still useful. The user has three concerns: different types of false assumptions, the map covering only removable distortions, and the map being verifiable against a territory. They want an audit of this analogy before publishing.

  First, I need to unpack their three kinds of false assumptions: 1) Ignoring small magnitudes (like friction), 2) Domain restrictions (like zero transaction costs), and 3) "As-if" surrogates (like firms acting as if they maximize profit without actually doing so). The map analogy might handle the first two but not the third.

  Second, the map analogy implies you could adjust for distortions by "paying" (e.g., adding scale), but some model falsehoods are foundational—without them, the model collapses. Third, maps have explicit metadata (scale, projection) and can be checked against real terrain, whereas models lack both.

  The user wants a structured response: correspondences table, where the analogy holds, where it breaks (tagged to their three kinds), what the analogy was carrying, and a better analogy if possible.

  For correspondences: The territory is the real economy, scale is abstraction level (e.g., ignoring friction), projection is theoretical framework (like supply-demand axes), routes are predictions or policies. The Tube map itself is the model.

  Where it holds: The analogy works for simplifying complex realities and for the first two assumption types—magnitude shrinkage and domain restrictions. These are like omitting minor streets on a map, which doesn't ruin navigation.

  Where it breaks: 
  - For "as-if" surrogates (Kind 3), the analogy fails because maps don't claim mechanisms (e.g., "the train moves as if by teleportation"); models do, risking misinterpretation. 
  - For foundational falsehoods, maps allow adding detail (e.g., scale) without breaking core function; some model assumptions (e.g., perfect rationality) can't be "paid to remove"—the model implodes without them. 
  - Verifiability: Maps have objective terrain; economic "territory" is contested and unobservable, making falsification harder. This affects all three kinds but especially as-if surrogates.

  What the analogy carries: It smuggles in Friedman's "F-twist"—that unrealistic assumptions signify importance—by framing all falsehoods as harmless simplifications. But the breaks show this isn't universal.

  Better analogy: A theatrical model (like a stage set). It highlights purpose-built, selective representation and doesn't pretend to be comprehensive. Useful for "as-if" cases (e.g., firms "play" profit-maximizers).

  The user's deeper need is to critique economic methodology rigorously. They likely want to challenge the map analogy's overuse and expose how it shields models from criticism. By dissecting it, they can argue for more nuanced model evaluation—especially for "as-if" assumptions that may misrepresent causality.
answer: |-
  ### **Correspondences**  
  | **Map Element**      | **Economic Model Equivalent**                     |  
  |----------------------|--------------------------------------------------|  
  | Territory            | Real-world economy (complex, unobservable totality) |  
  | Scale                | Level of abstraction (e.g., ignoring friction/transport costs) |  
  | Projection           | Theoretical framework (e.g., supply-demand axes, rational agent lens) |  
  | Route                | Model's predictions/policy prescriptions (e.g., "lower interest rates → boost investment") |  
  | Tube Map Itself      | The economic model (simplified representation) |  

  ---

  ### **Where It Holds**  
  The analogy holds for **Kind 1** (shrinking irrelevant magnitudes) and **Kind 2** (domain restrictions). Like omitting alleyways from a city map, ignoring minor frictions (e.g., minimal transaction costs) or assuming frictionless trade clarifies core relationships without undermining utility. Models here isolate key variables (e.g., interest rates’ effect on investment) as maps isolate major transit routes. Abstraction aids focus, and predictions remain directionally accurate.  

  ---

  ### **Where It Breaks**  
  **(≈250 words)**  

  1. **Fails for "As-If" Surrogates (Kind 3)**  
     Maps don’t assert *false mechanisms*—only simplifications. But models using "as-if" assumptions (e.g., firms *behaving as if* maximizing profit despite no internal calculation) posit fictional causal processes. A Tube map doesn’t claim trains teleport; it just omits streets. When models replace real mechanisms (e.g., heuristic decision-making) with mathematically convenient fictions (optimization), the analogy collapses. You can’t "navigate" corporate strategy using a false behavioral engine.  

  2. **Breaks for Foundational Falsehoods (Beyond "Paying to Remove")**  
     Maps declare distortions (e.g., scale) and allow correction (e.g., consulting a topographical map). But core assumptions like **perfect rationality** or **continuous markets** aren’t "distortions" to fix; they’re axioms without which models derive *no results*. Unlike adding scale to a map, relaxing these (e.g., introducing bounded rationality) often invalidates the model’s conclusions. The analogy falsely suggests all inaccuracies are compensable omissions, not generative falsehoods.  

  3. **No Independent Territory or Calibration**  
     Maps reference objective geography and state their projection; models lack both. The "economy" is unobservable and theory-laden—what constitutes "Bank station" (e.g., inflation) is defined *by models themselves*. Verification is circular: empirical tests often rely on model-based metrics (e.g., GDP). Unlike a map’s point-by-point check, models can’t be falsified against a neutral "territory," amplifying risks for all three assumption types—especially "as-if" surrogates.  

  ---

  ### **What the Analogy Was Carrying**  
  **(≈100 words)**  
  The map analogy tacitly smuggles in Friedman’s "F-twist" by framing *all* false assumptions as harmless abstractions (like scale), implying unrealism is inherently virtuous. It dismisses concerns about mechanisms (Kind 3) as "pedantry" and obscures how foundational falsehoods (e.g., perfect competition) aren’t mere simplifications but essential, unfixable fictions. Once the breaks are exposed—especially the lack of verifiable territory and the failure of "as-if" logic—the stronger conclusion (unrealism = significance) collapses. The analogy alone sustained this by conflating *useful distortion* with *generative untruth*.  

  ---

  ### **A Better Analogy, If There Is One**  
  **(≈75 words)**  
  **A theatrical model** (e.g., a scaled-down set for *Hamlet*). It’s not a literal castle (territory), but its selective geometry (Kind 1/2 assumptions) enables drama. Crucially, it *embraces* artifice: Hamlet’s soliloquy works because we accept the "as-if" surrogate (actor = prince). Unlike the map, it doesn’t pretend to accuracy, clarifying that unrealistic assumptions (Kind 3) are *staging devices* for insight—not navigational aids. This better accommodates purposeful fiction while avoiding claims of territorial fidelity.  

  ---  
  *This audit reveals the map analogy’s limits in defending "as-if" surrogates and foundational axioms. While useful for simplifications (Kinds 1–2), it obscures circular validation and the role of indispensable fictions—undermining Friedman’s stronger claim.*
