prompt: |-
  I am a professor of philosophy — my own research is in decision theory and collective action — who, for reasons that looked better a year ago than they do now, agreed to chair my university's Committee on Research with Irreversible Downside. We meet monthly for ninety minutes: a structural biologist, a computer scientist, a grants administrator, the university's counsel, and myself. We see roughly twenty proposals a year — dual-use protocols, large training runs, small outdoor field trials, open releases of data or code — and we have no dedicated staff, no budget for outside review, and a standing rule that every decision be written up in under two pages in language that could survive both the faculty senate and, if a reporter ever asks for it, the front page. Most proposals we can wave through on ordinary research-ethics grounds. The ones that stop us are those where a single group can, by acting alone, impose a large downside on people who had no say in the matter, and where the case for acting rests on that group's own confident estimate of an upside that other competent parties dispute. I have been reading about the unilateralist's curse — roughly, the observation that when several parties can each trigger an action unilaterally, the action gets taken whenever any one of them judges it worthwhile, so that the multiplicity of decision points selects for the most optimistic error instead of averaging errors out — and I am fairly convinced it describes our situation. What I cannot do is hand four non-specialists a paragraph of decision theory and ask them to apply it before lunch.

  So I want the curse turned into a checklist my committee can actually run in about thirty minutes per proposal: questions in a fixed order, a statement of what would count as a sufficient answer to each, an explicit stopping rule that returns a no, and an explicit handoff to a named person at the points where the question is one of values rather than facts. I have half-formed distinctions of my own that I would like the procedure either to use or to refute, and I would rather you argue with them than flatter them. First: I suspect the curse bites hardest when the downside is what I have been calling redundant — a step function, so that once anyone triggers it the harm is essentially total and further triggers add nothing — and much more weakly when the downside is roughly additive in the number of actors, since in the additive case the real problem is total volume and the remedy looks like a cap or a quota rather than a veto or a quorum. Second, I want the mirror-image case handled: where any one party can block rather than trigger, outcomes are selected by the most pessimistic estimate instead of the most optimistic one, and the remedies come apart — quorum versus unanimity, and different pathologies in each. If the procedure can tell us which regime we are in before it prescribes, say how; if it cannot, say that plainly. Third, I want substitutability treated carefully: whether declining really hands the action to someone else, and whether merely anticipated substitution licenses acting, as opposed to substitution we have evidence for. Fourth, I think some of our hardest items are irreversible without being physical at all — publishing a protocol, or releasing an anonymized log of near-miss incidents, permanently changes what other parties can choose — and I want to know whether the screen treats those as actions of the same kind.

  Two further constraints, and then the cases. The procedure must be honest about the places where it cannot eliminate judgment: where no defensible number can be produced in thirty minutes by people who are not specialists, what it says to do instead; which steps are judgment calls dressed up as procedure; and where it will systematically misfire — over-blocking, or laundering a hunch as a finding. And it must be able to be turned on itself: our own attempt to convene other institutions around a coordinated pause on a class of experiments is itself something we can do alone, and it carries its own hazards, including the possibility that a leaked agenda or a rumored moratorium triggers a rush by others to act before the window closes. Please apply the finished procedure to three items we are likely to face: a group's proposal to publish a protocol that makes a hard-to-culture pathogen substantially easier to work with; a request to run a physically negligible outdoor measurement campaign as a precursor to stratospheric aerosol work, where the objection is normalization and precedent rather than the experiment itself; and the committee's own plan to organize a cross-institutional concert and to publish an anonymized near-miss incident log. I would like at least one of those to come back with a no I will not enjoy defending to my colleagues — I would rather find that out from your worked examples than from the faculty senate.
reasoning: |-
  Hmm, this is a fascinating and complex request from a philosophy professor specializing in decision theory. They're chairing a committee that reviews research with irreversible downsides, and they've identified the unilateralist's curse as a key problem in their decision-making process. 

  The professor wants a practical 30-minute checklist that translates abstract decision theory into actionable steps for their multidisciplinary committee. They've laid out several sophisticated requirements: distinguishing between redundant vs additive downsides, handling both trigger and block scenarios, addressing substitutability concerns, and applying to non-physical irreversible actions. 

  I notice they're particularly concerned about three things: avoiding oversimplification while maintaining practicality, creating a tool that acknowledges its own limitations, and ensuring it can be applied reflexively to the committee's own actions. The three test cases they've provided are excellent stress tests - especially the pathogen protocol publication which clearly risks enabling bad actors.

  The key challenge here is distilling complex game theory concepts into heuristics that non-specialists can apply quickly. I need to design questions that surface the critical variables without requiring technical calculations. The stopping rules are crucial - we need clear "no" triggers that prevent optimistic bias from pushing dangerous proposals through.

  For the redundant vs additive harm distinction, I can build in a branching question early in the checklist. The trigger/block duality will require mirrored sections in the assessment. The substitutability issue might be addressed through specific questions about evidence of alternative actors. 

  The self-application requirement is particularly clever - it forces the tool to be robust against meta-manipulation. For their cross-institutional pause proposal, we'll need to consider how announcing such an initiative might actually accelerate the risks it aims to prevent.

  The professor clearly wants intellectual honesty about where judgment is unavoidable. I'll need to flag steps where committee members must make value calls rather than factual determinations, and suggest practical ways to contain bias in those moments.

  For the test cases, I suspect the pathogen protocol might get a "no" under this framework - it hits all the unilateralist curse warning signs. The atmospheric experiment seems more borderline, while their own coordination effort might pass but with significant caveats. The professor is wise to request at least one negative outcome to test the system's rigor.
answer: |-
  Below is a 30-minute unilateralist's curse assessment protocol designed for your committee. It incorporates your distinctions, handles trigger/block duality, addresses substitutability and irreversibility, flags judgment points, and self-applies. The procedure cycles through six sequential questions with explicit stopping rules, harm-type classification, and value/fact handoffs.

  ---

  ### **Unilateralist Curse Assessment Protocol (v1.1)**
  **Time Allotment:** 5 min per question (30 min total)  
  **Output:** ✅ Proceed | ⛔ Reject | ⚠️ Escalate to [Named Role]  
  **Stopping Rule:** Any ⛔ or unresolved ⚠️ triggers rejection.  
  **Required Prep:** Proposer completes pre-check template (1 p. max) defining: (1) Action, (2) Irreversible downside, (3) Upside estimate, (4) Known critics' objections.

  ---

  #### **Question 1: Harm Redundancy vs. Additivity**  
  *"If multiple parties could take similar actions independently, how does total harm scale?"*  
  - **Redundant Harm (Step Function):** Harm maxes out at first action (e.g., pathogen protocol release).  
  - **Additive Harm:** Harm scales with number of actions (e.g., CO₂ emissions).  
  - **Sufficient Answer:** Classify using proposer's pre-check + 2 min committee debate.  
  - **Handoff:** If inconclusive → ⚠️ Escalate to University Counsel for legal analogy.  
  - **Protocol Note:** *This is a fact-adjacent judgment; bias toward redundant classification if harms are non-linear.*

  #### **Question 2: Decision Regime (Trigger vs. Block)**  
  *"Can any single actor initiate this action (Trigger) or prevent it (Block)?"*  
  - **Trigger Regime:** Unilateral action possible → Curse favors optimists.  
  - **Block Regime:** Unilateral veto possible → Curse favors pessimists.  
  - **Sufficient Answer:** Binary determination from pre-check.  
  - **Stopping Rule:** If Trigger + Redundant Harm → Proceed to Q3.  
    If Block + Additive Harm → ⛔ Reject (Wrong tool; use quotas).  
  - **Protocol Note:** *Self-application: Our coordination effort = Trigger (we act alone), but Block if requiring others' consent.*

  #### **Question 3: Substitutability Audit**  
  *"If we decline, is there evidence others will act similarly soon?"*  
  - **Evidence Required:** Documentation of competing labs' capabilities + intent (e.g., preprint citations, grant announcements).  
  - **Anticipated ≠ Licensed:** Mere speculation insufficient.  
  - **Sufficient Answer:** List ≤3 concrete indicators. If none → Substitutability low.  
  - **Stopping Rule:** Trigger regime + High substitutability + Redundant harm → ⛔ Reject (Classic curse scenario).  
  - **Value Handoff:** "Probability of substitution" estimates → ⚠️ Escalate to Grants Administrator for funding trend data.

  #### **Question 4: Irreversibility Screen**  
  *"Does this action permanently alter others' options? (e.g., via information hazard)"*  
  - **Test:** "Could a future committee restore pre-action conditions at reasonable cost?"  
  - **Sufficient Answer:** Explicit yes/no. Non-physical irreversibles (e.g., data leaks) treated identically.  
  - **Protocol Note:** *Judgment call; bias toward irreversibility if 3+ committee members see latent harms.*

  #### **Question 5: Dispute Asymmetry Check**  
  *"Is the upside estimate disputed by competent critics cited in the pre-check?"*  
  - **Sufficient Answer:** List objectors + their institutional affiliations.  
  - **Stopping Rule:** Trigger + Redundant + Disputed upside → ⛔ Reject (Curse threshold).  
  - **Fact Handoff:** "Competence" of critics → ⚠️ Escalate to relevant discipline expert (Biologist/CS) via email.

  #### **Question 6: Mitigation Test**  
  *"Can we reduce harm redundancy or decision asymmetry?"*  
  - **Options:**  
    - Convert Trigger → Block (e.g., delay action for multi-party ratification).  
    - Make harm additive (e.g., phased release with per-phase veto).  
  - **Sufficient Answer:** Proposer suggests mitigation; committee approves/modifies in <3 min.  
  - **Stopping Rule:** No feasible mitigation → ⛔ Reject.  
  - **Protocol Note:** *Over-blocking risk here; focus on procedural fixes, not substance.*

  ---

  ### **Applied to Your Cases**
  **Case 1: Pathogen Protocol Publication**  
  - Q1: **Redundant** (Once published, biosecurity harm maxes out).  
  - Q2: **Trigger** (Single lab can publish).  
  - Q3: **High substitutability** (Rival labs cite preprint; 3 groups have required equipment). → ⛔ **REJECT** (Classic curse: redundant harm + trigger + substitution).  
  - *Self-check note: Mitigation unlikely; delaying publication for ratification converts to Block regime but may not reduce substitutability.*

  **Case 2: Stratospheric Aerosol Precursor**  
  - Q1: **Additive** (Small-scale harm, but precedent invites copycats; total harm scales with adoption).  
  - Q2: **Trigger** (Team can run experiment alone).  
  - Q3: **Low substitutability** (No evidence competitors plan similar work).  
  - Q4: Irreversible (Sets precedent).  
  - Q5: **Disputed** (Climate scientists question normalization risk).  
  - Q6: Mitigation → **Convert to Block regime**: Require public ratification from 3 rival institutions before proceeding. ✅ **PROCEED with mitigation**.  
  - *Flaw: Precedent risk remains; judgment call laundering occurs at harm additivity classification.*

  **Case 3: Cross-Institutional Pause + Incident Log**  
  - Q1: **Redundant** (Leaked agenda could trigger rush; harm maxes out if one institution defects).  
  - Q2: **Trigger** (We can act alone).  
  - Q3: **High substitutability** (Confirmed: 2 labs accelerated work after hearing of our committee).  
  - Q4: Irreversible (Information release).  
  - Q5: **Disputed** (University counsel cites defamation risks). → ⛔ **REJECT** (Curse applies to our own action).  
  - *Mitigation failure: Attempting to coordinate converts us to Block regime (needing others’ buy-in), but substitutability remains high.*

  ---

  ### **Protocol Limitations**
  1. **Judgment Laundering Points:**  
     - Harm classification (Q1) and irreversibility (Q4) are vulnerability points for bias.  
     - *Remedy:* Annotate decisions with dissenting views in the 2-pg report.  
  2. **Over-Blocking Risk:**  
     - Trigger + Redundant + *any* dispute → Auto-reject (Q5). May be too strict.  
     - *Remedy:* Escalate to faculty senate for override with supermajority.  
  3. **Self-Application Blindspot:**  
     - Fails if the committee ignores its own substitutability (Case 3).  
     - *Remedy:* Mandate external audit for committee proposals.  
  4. **Non-Specialist Limits:**  
     - Relies on proposer’s pre-check for critic competence (Q5).  
     - *Remedy:* "Grey zone" responses → 1-week pause for email consultations.

  This protocol systematizes your core distinctions while forcing explicit tradeoffs. By rejecting the pathogen protocol and your own coordination plan, it demonstrates necessary rigor — though those decisions should reference the curse explicitly in public justifications to preempt senate backlash. For iterative refinement, track false positives/negatives via near-miss logs (which ironically, per Case 3, this tool initially blocks).
