prompt: |-
  I am assembling a three-year research program on stake-sensitivity in epistemology — pragmatic encroachment, subject-sensitive and interest-relative invariantism, and those views' rivalry with, and possible collapse into, epistemic contextualism. The program will fund roughly six person-years of work across five or six projects, all of it conceptual: no experimental psychology, no corpus linguistics, no empirical work of any kind. Assume I already know the familiar terrain — the bank and travel cases, the knowledge–action principle, the reading of stakes as shifting a credal or evidential-support threshold, safety- and sensitivity-style accounts of what stakes might be doing to the modal profile of belief, and the standard arguments for and against treating knows as semantically context-dependent. Do not survey that terrain for me, and do not recommend readings. What I need from you is an agenda, and a defense of its ordering.

  Three case-types have been nagging at me, and I want you to treat them as data to be accommodated rather than as confusions to be dissolved. The labels are stipulative.

  *Role-stakes.* A hospital pharmacy technician checks a label against a screen. Her personal stakes are trivial; the stakes attached to her role, fixed by a protocol and liability document she has never read and could not recite, are severe. Which stakes encroach, if any? Note the variants: the role-stakes are real but unknown to her; the institution has quietly lowered them; two technicians with identical evidence and identical care occupy roles carrying different stakes. If knowledge tracks role-stakes, it begins to look like a status an institution confers rather than something the subject possesses; if it tracks personal stakes, the intuitions that motivated encroachment fall quiet precisely in the cases with the most social weight.

  *Adversarial stakes.* A counterparty who wants you to be uncertain can raise the cost of your being wrong — a penalty clause, a planted trap, a threat it will later carry out. If knowledge is stake-sensitive, another agent can destroy your knowledge without touching your evidence, your reliability, or the facts, merely by changing what is at stake. Is that a reductio, or an interesting consequence the view should own? And does it matter whether the subject could have foreseen the stake-raising?

  *Proleptic stakes.* Two subjects have identical evidence, identical credences, identical present circumstances, and are equally careful. One will next month be handed a decision in which this very proposition is pivotal; the other never will be. Neither can now foresee which is which. Does the first fail to know *now* — in virtue of a fact about her evidence and present situation that is, by hypothesis, absent?

  Alongside these, take seriously a structural question I think the literature has left underspecified: what exactly is the stakes variable? Expected cost of error, worst-case cost, the ratio of the costs of the two error directions, or something else? In the asymmetric cases — false positives cheap, false negatives catastrophic, or the reverse — the plausible specifications come apart, and a single scalar threshold on credence cannot represent all of them.

  What I want from you:

  1. Four or five questions the program should commission, in priority order, with the ordering defended explicitly. For each, say what it is upstream of — which other questions cannot be settled until it is, and which it merely informs — how tractable it is in three years with analytic and light formal tools, how neglected it is relative to how much ink it has absorbed, and what its payoff is outside epistemology: legal standards turning on knowledge or reasonable belief, professional roles and institutional sign-off, and whether stake-sensitivity should be built into automated systems that defer to human judgment.
  2. The trade-offs between your criteria, stated as trade-offs. Where importance and tractability pull apart, say which you let win and why.
  3. What you would decline to fund, and why. I expect you to be willing to say that some live-looking question has been farmed out, or that its answer would not change anything downstream. Tell me whether the semantics-versus-pragmatics question — is the phenomenon best captured by an interest-relative but non-indexical semantics, by a contextualist semantics, or by a pragmatic story about what assertions of knows convey — deserves a project of its own or is a sink.
  4. Which of my three case-types, if any, genuinely discriminates between encroachment and contextualism, and which is only a new instance of an old pattern and should be dropped from the program.
  5. Where the dispute bottoms out: a substantive disagreement about knowledge, a disagreement about which notion knows expresses, or something closer to verbal. Is settling that worth a project, or is it the sort of question that only gets answered retrospectively?
  6. What evidence appearing within the next three years — an argument, a formal result, a shift in a neighboring field — would move items up or down your list.

  Reason your way to the ordering. I am not asking for a map of the literature; I am asking to be told where six person-years should go, and to be able to disagree with you about the reasons.
reasoning: |-
  Okay, let me approach this systematically. The user is designing a high-stakes epistemology research program focused entirely on conceptual work, with three intriguing case types that challenge existing stake-sensitivity frameworks. They clearly have deep expertise and want to avoid rehashing standard debates.

  First, I need to prioritize questions that:
  - Directly address their novel cases (Role/Adversarial/Proleptic stakes)
  - Clarify the underspecified stakes variable
  - Generate payoffs beyond epistemology
  - Avoid semantic/pragmatic quagmires unless necessary

  The structural question about defining stakes feels most urgent - without resolving whether stakes represent expected cost, worst-case cost, or asymmetric ratios, we can't properly analyze any cases. This should be first priority despite moderate tractability challenges because it's the foundation.

  Role-stakes come next due to their real-world implications for institutional knowledge attribution. The hospital technician case could reshape legal/professional standards. Adversarial stakes follow as they test the external manipulation of knowledge - crucial for security/contract domains but slightly more contained conceptually.

  Proleptic stakes get lower priority as they may collapse into existing temporal externalism debates. The semantics-pragmatics debate gets actively deprioritized - it's a known quagmire with diminishing returns.

  For tradeoffs, I'm letting importance trump tractability on the stakes variable question because everything else depends on it. Role-stakes win on applicability grounds despite being messier than adversarial cases.

  The user's three cases: Role-stakes uniquely pressure encroachment by threatening to make knowledge institutional. Adversarial cases mainly test encroachment's limits but don't discriminate theories. Proleptic stakes feel like old wine in new bottles - temporal externalism in disguise.

  The dispute likely bottoms out in normative commitments about knowledge's function that may resist resolution. Still worth surfacing through cases rather than direct confrontation.

  If new formal models of asymmetric costs emerge, that could accelerate the stakes variable work. Legal rulings invoking role-based knowledge standards would boost role-stakes urgency.
answer: |-
  Here is a prioritized research agenda for your program, designed to maximize conceptual traction on your case-types while addressing the structural core of stake-sensitivity. The ordering balances **foundational clarity**, **discriminatory power** between theories, **neglect**, and **external payoff**. Trade-offs are explicit.

  ### Priority-Ordered Research Questions
  1.  **What is the Stakes Variable? Formalizing Cost Asymmetry & Aggregation**  
      *   **Question:** Precisely what function of costs (expected utility loss, minimax loss, cost-ratio threshold, contextually weighted hybrid) does stake-sensitivity track, especially under asymmetric error costs (e.g., false negative catastrophic, false positive trivial)?
      *   **Why Upstream?** *Everything* depends on this. Role-stakes, adversarial stakes, and proleptic stakes cannot be rigorously modeled or tested without specifying the input ("stakes"). Current threshold models (credence > C) are demonstrably inadequate for asymmetry. Until settled, intuitions about cases are talking past formal implementations.
      *   **Tractability:** Moderate-High (3 yrs). Requires analytic refinement of decision/game-theoretic tools (not heavy formalism, but precise). Focus on mapping implications of different specifications onto case intuitions.
      *   **Neglect:** High. Literature fixates on *whether* stakes matter, not *how* they are quantified/formally represented. Asymmetric cases are acknowledged but not systematically formalized.
      *   **External Payoff:** Critical. Legal standards (e.g., "beyond reasonable doubt" inherently asymmetric), medical/engineering safety margins (false negative > false positive cost), AI risk assessment (explicit cost functions needed) all hinge on asymmetric error cost handling. A formal account is essential for application.
      *   **Ordering Defense:** Foundational. Without this, progress on cases is merely intuitive and theory-neutral.

  2.  **Role-Stakes: Institutional Agency vs. Personal Epistemic State**  
      *   **Question:** When role-defined stakes and personal stakes diverge (unknown to agent, institutionally lowered, differentially assigned), which (if either) determines knowledge? Does this reveal knowledge as fundamentally institutional/relational?
      *   **Why Upstream?** Directly tests the *subject-relativity* of encroachment/SSI vs. contextualism. If knowledge tracks institutional role-stakes unknown to the subject, it radically externalizes knowledge, threatening core intuitions of "possession." Informs whether contextualism can better capture the social embedding.
      *   **Tractability:** Moderate. Conceptual analysis of agency, responsibility, and social ontology within epistemology. Requires integrating insights from philosophy of institutions/law. Formalization (e.g., principal-agent models) possible but secondary.
      *   **Neglect:** Very High. Role-stakes are almost entirely absent from the literature, despite being ubiquitous in high-stakes real-world settings (medicine, finance, law enforcement).
      *   **External Payoff:** Highest. Directly impacts legal liability (did the *technician* know, or was it the *hospital's* knowledge?), professional certification, institutional accountability frameworks, AI systems operating under delegated authority ("acting as agent of X").
      *   **Ordering Defense:** Highest impact novel case-type. Forces engagement with epistemology's social dimension. Outputs from Q1 are crucial inputs here.

  3.  **Adversarial Stakes: Knowledge Destruction by Fiat?**  
      *   **Question:** Can an adversarial agent *destroy* S's knowledge *solely* by increasing the cost of S's error (penalty clauses, traps, threats), holding evidence/reliability/facts fixed? Does foreseeability matter?
      *   **Why Upstream?** Stress-tests the *metaphysical and normative commitments* of stake-sensitivity. If "yes," knowledge becomes fragile and manipulable in counterintuitive ways; if "no," a principled boundary for stake-sensitivity is needed. Contextualism may handle this via context shifts, but the *mechanism* of shift (driven by adversary?) needs scrutiny.
      *   **Tractability:** High. Primarily conceptual/analytic, leveraging Q1's cost models. Can draw on game theory (signaling, commitment devices). Foreseeability adds complexity.
      *   **Neglect:** Moderate-High. Adversarial dynamics are underexplored (cf. some work in legal epistemology on traps, but not systematized for stake-sensitivity).
      *   **External Payoff:** Significant. Crucial for contract law (penalty clauses inducing "recklessness"?), security/intelligence (disinformation designed to raise stakes of acting), adversarial AI settings (manipulating decision thresholds).
      *   **Ordering Defense:** Highly discriminatory *if* Q1 is settled. Less foundational than Q1/Q2 but offers sharp tests. More tractable than Proleptic Stakes.

  4.  **Proleptic Stakes & the Temporal Externalism Challenge**  
      *   **Question:** Does a future, unforeseeable, high-stakes decision *now* undermine present knowledge based on identical present evidence/care? Does this require a "temporal externalism"?
      *   **Why Upstream?** Directly challenges the *temporal locality* of knowledge. If "yes," knowledge states become strangely unstable based on pure future contingency. Contextualism might handle this via future context, but the *proleptic* element is unique.
      *   **Tractability:** Low-Moderate. Highly abstract, intersects with metaphysics of time, foresight, and counterfactual dependence. Light formal tools (temporal logic) may help but limited.
      *   **Neglect:** High. Rarely addressed directly, though related to "environmental luck" but distinct due to future-dependence.
      *   **External Payoff:** Limited. Less direct application than Role/Adversarial stakes. Relevant for long-term planning/risk assessment, but less urgently.
      *   **Ordering Defense:** Lowest priority among case-types. Likely collapses into existing debates about temporal externalism or highlights an extreme consequence some theories must accept. Worth a focused paper, not a large project. Depends on clarity from Q1.

  5.  **The Bottoming Out Project: Is this Verbal, Functional, or Metaphysical?**  
      *   **Question:** Does the core dispute reflect a substantive disagreement about the nature of knowledge, a clash over which *functional role* "knows" serves (action-guiding vs. categorizing), or primarily verbal divergence in conceptual carving?
      *   **Why Upstream?** Aims for meta-clarity after progress on Q1-Q4. Not upstream, but essential for program synthesis and assessing significance.
      *   **Tractability:** Moderate. Conceptual analysis, drawing on philosophical methodology, meta-ethics (analogy to moral disagreement), philosophy of language.
      *   **Neglect:** Moderate. Often gestured at ("practical explication" vs. "theoretical concept") but rarely the *focus* of stake-sensitivity work.
      *   **External Payoff:** Moderate-High. Clarifies whether disagreements are resolvable or reflect deeper commitments. Informs whether legal/AI systems should adopt a "univocal" knowledge concept or contextually variable standards.
      *   **Ordering Defense:** Last, as it requires results from Q1-Q4. Answers the "where it bottoms out" question. Worth a project to synthesize findings and assess the debate's nature.

  ### Trade-offs Between Criteria & How Adjudicated
  1.  **Importance (Upstreamness/Discriminatory Power/External Payoff) vs. Tractability:** Q1 (Stakes Variable) is moderately difficult but maximally upstream/important – **Importance Wins**. Q4 (Proleptic) is intriguing but less tractable *and* less important/discriminatory – **Tractability + Importance Lose** (lower priority).
  2.  **Novelty/Neglect vs. External Payoff:** Q2 (Role-Stakes) is highly neglected *and* has massive external payoff – **Synergy**. Q3 (Adversarial) is less neglected but still high payoff – **Payoff Wins**. Q4 (Proleptic) is neglected but low payoff – **Neglect Loses**.
  3.  **Theory-Discrimination vs. Foundational Clarity:** Q1 is foundational but less directly discriminatory. Q2/Q3 are highly discriminatory *if* Q1 is settled. **Foundational Clarity (Q1) Wins** because discrimination without clarity is confused.

  ### What to Decline Funding
  *   **Direct Focus on Semantics-vs-Pragmatics (Contextualism vs. SSI vs. Pragmatic Encroachment):** **Decline a dedicated project.** It's a known sink. Progress is more likely via tackling novel *cases* (Q2, Q3) and the *stakes variable* (Q1) that force new constraints on *any* semantic/pragmatic implementation. Funding here yields diminishing returns and rehashes familiar arguments. *Instead:* Task each project (especially Q1, Q2, Q3) with explicitly drawing implications for the semantic-pragmatic debate based on their specific findings.
  *   **Proleptic Stakes as a Major Project:** **Decline a large project.** Fund a focused paper/workshop instead. It's likely an instance of temporal externalism/future-dependent luck debates and lacks the discriminatory power or external payoff of Role/Adversarial stakes. Its low tractability further weighs against it.

  ### Discriminatory Power of Your Case-Types
  1.  **Role-Stakes:** **Genuinely Discriminates.** It uniquely pressures **Encroachment/SSI** by threatening to detach knowledge from the *subject's* practical reality, making it a status potentially *conferred by an institution*. Contextualism can more easily accommodate the technician's context (including awareness of her role's gravity, even if not specifics) without making knowledge depend on *unknown* institutional facts. *Keep as Core (Q2)*.
  2.  **Adversarial Stakes:** **New Instance of Old Pattern, But Sharpens It.** It's structurally similar to "artificially high stakes" cases (e.g., a bet forced upon you). However, the *agency* of the adversary and the *intentional* manipulation make it a powerful stress test for *how* stakes are integrated (input from Q1 crucial). It doesn't clearly favor one side but forces refinement. *Keep, but Less Novel (Q3)*.
  3.  **Proleptic Stakes:** **Should Be Dropped as a Major Focus.** It's primarily a variant of existing temporal externalism challenges or a specific type of environmental luck (where the "environment" is the future decision landscape). It doesn't add significant new discriminatory power beyond existing objections. *Downgrade (Q4 - Minor Focus)*.

  ### Where the Dispute Bottoms Out
  It primarily bottoms out in **substantive disagreements about the functional role of knowledge**, specifically:
  *   Is knowledge's core function to **categorize reliable true belief for theoretical purposes**, or to **license action/practical deliberation under uncertainty**?
  *   How **detachable** is the epistemic state (justified belief) from the practical license (actionability)?

  It's **not merely verbal** – the disagreement reflects deep commitments about epistemology's autonomy from practical reason. However, it's **not primarily about the semantics of "knows"** – semantic choices (contextualist vs. invariantist) are downstream of this functional commitment. **Settling this explicitly is worth the final project (Q5)**, as it synthesizes the program and clarifies the meta-debate. It avoids being purely retrospective by using the *results* of Q1-Q4 as evidence for functional roles.

  ### What Could Shift the Agenda (Next 3 Years)
  *   **Move Q1 Up:** A breakthrough formal model for asymmetric costs in decision theory (e.g., from economics/CS) that cleanly applies to belief.
  *   **Move Q2 Up:** High-impact legal rulings or AI ethics scandals directly hinging on role-based knowledge attribution (e.g., liability in automated medical diagnosis).
  *   **Move Q3 Up:** Significant developments in formal epistemology/game theory modeling adversarial belief manipulation.
  *   **Demote Q3:** If Q1 conclusively shows stake-sensitivity *requires* foreseeable costs, adversarial cases become less central.
  *   **Boost Q5:** Widespread recognition in neighboring fields (e.g., AI ethics, jurisprudence) that their "knowledge" standards are inherently functional/purpose-relative.
