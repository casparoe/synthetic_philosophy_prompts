prompt: |-
  Write a dialogue of roughly 1,200 to 1,400 words between two philosophers, Mira and Dev, who are in complete agreement about the complexity theory and in complete disagreement about what follows from it.

  Shared setup they are both looking at: Ari runs a small emergency-response unit. Each hour he revises a plan over roughly fifty interacting variables — road closures, bridge capacities, hospital loads, weather, crew availability — most of them only partially observed, many of them probabilistically dependent on others. The problem family he is solving contains instances for which every known exact method has a worst-case running time that grows faster than any polynomial, and the familiar hardness results for probabilistic inference and for planning under partial observability put his problem in that family. Ari has one hour, one laptop, and lives are at stake.

  Mira holds the feasibility constraint: a normative requirement, epistemic or practical, is admissible only if an agent in the relevant circumstances can conform to it, and complexity results are the correct instrument for saying when conformity is possible; an intractable ideal should therefore be replaced, not venerated, by a tractable surrogate norm that approximates it as closely as the budget allows. Dev holds the standard-of-correctness view: norms state what is correct rather than what is achievable, the gap between the two is precisely what lets a norm evaluate an agent from outside her own predicament, and complexity results are worst-case, asymptotic, encoding-relative and contingent on machine architecture, so they underwrite no claim about what Ari ought to believe or do.

  Give each of them real resources. Mira must have an answer to the charge that feasibility collapses the normative into the descriptive, and to the charge that choosing a surrogate requires a norm that cannot itself be justified by speed. Dev must have an account of what critical work an unsatisfiable norm does that is not simply the assertion that it is correct, and must say what distinguishes his position from indifference to Ari's actual situation.

  Now introduce a distinction that neither of them has seen in print, and require that each of them gets to use it and that it cuts against the person who introduced it. Say a method's difficulty is diagnosable when there is a test, computable well inside the agent's budget, that flags in advance the instances on which the method will overrun that budget, so that the agent can decide before committing whether to attempt exact conformity or fall back on something cheaper. Say it is opaque when no such test exists, so that discovering whether this instance is one she can handle costs about as much as handling it. Mira should introduce diagnosability in order to dismantle the obvious compromise that Dev reaches for, namely that Ari can aim at the ideal norm and satisfy-when-hard: if the difficulty is opaque, he cannot tell when he is in the hard region, so the compromise issues no guidance at all. Dev should then turn the distinction: if the difficulty is opaque, Mira cannot tell which instances call for the surrogate norm either, so her replacement has to be a single universal policy rather than a conditional one, and the choice between universal policies is a question about which norm is correct that complexity theory does not touch. Mira should respond by relocating diagnosis from the instance to the environment, arguing that what matters is whether the distribution of instances an agent actually faces is one on which her policy's expected performance is acceptable, and that this is an empirical and local matter rather than something settled by an asymptotic worst-case theorem. Dev must then press the status of that empirical premise and the two of them should end on a precisely stated disagreement rather than a reconciliation.

  Constraints: both characters are equally competent and equally well informed; neither is exasperating, and neither gets a speech the other could not have anticipated. There must be genuine back-and-forth — each should quote or paraphrase the other's actual argument before replying to it, and each should concede at least one substantive point that costs them something. No character cites an author, a paper or a result by name; the complexity claims are stated in their own words. Neither explains complexity theory to the other. Keep Ari in view: abstract points should be cashed out in what he is supposed to do at hour eleven, and the dialogue should not float free of that case for more than a few turns.

  After the dialogue, add a structured summary as a JSON object with exactly these fields, and nothing else after it:

  positions — an object with keys feasibility and standard, each holding one sentence stating that character's position in the terms the dialogue ended up using rather than the terms above.
  crux — one sentence identifying the single proposition on which the whole disagreement turns.
  diagnosability — an object with keys definition_agreed, use_by_Mira, use_by_Dev, and residual_disagreement, where definition_agreed gives the formulation both characters accepted, the two use keys give one sentence each on how that character deployed it, and residual_disagreement says what they still disagree about concerning it.
  concessions — an array of two objects, each with keys speaker and concession, recording the real concession each character made.
  strongest_unanswered_objection — an object with keys raised_by, objection, and why_unanswered, where why_unanswered explains in one sentence why the reply given was incomplete.
  decisive_question — one sentence posing the question whose answer would settle the disagreement, together with a clause on what would make that answer non-decisive anyway.
reasoning: |-
  We are writing a dialogue between Mira (feasibility) and Dev (standard of correctness). They agree on complexity theory but disagree on what follows for Ari's case.
   Shared setup: Ari's problem is intractable in the worst case (exponential time) and he has limited resources. Lives are at stake.

   Mira: feasibility constraint. Norms must be feasible; replace intractable ideals with tractable surrogates.
   Dev: standard of correctness. Norms state what is correct regardless of feasibility; complexity results don't tell us what Ari ought to do.

   Mira must answer:
     - Charge that feasibility collapses normative into descriptive.
     - Charge that choosing a surrogate requires a norm that cannot be justified by speed.

   Dev must answer:
     - What critical work an unsatisfiable norm does beyond asserting correctness?
     - How his position is not indifferent to Ari's situation?

   New distinction: diagnosability vs opacity (introduced by Mira).
     - Diagnosable: a test (within budget) flags in advance if the method will overrun.
     - Opaque: no such test, so discovering if it's hard costs as much as solving.

   Mira introduces diagnosability to dismantle the compromise: if opaque, then Ari can't tell when he's in the hard region, so "satisfy-when-hard" fails.

   Dev turns it: if opaque, Mira also cannot tell which instances need the surrogate, so she must use a universal policy. Then the choice between universal policies is about correctness, not complexity.

   Mira relocates diagnosis from instance to the environment: look at the distribution of instances in the environment. Expected performance is an empirical matter.

   Dev presses the status of that empirical premise.

   They end on a disagreement without reconciliation.

   Constraints:
     - Both competent, well-informed, not exasperating.
     - Genuine back-and-forth: quote/paraphrase the other's argument, concede at least one substantive point.
     - Keep Ari in view: abstract points related back to hour eleven.
     - No citations by name.

   After the dialogue, JSON summary.

   Let's plan the dialogue structure:

   1. Opening: set the scene and state positions.
   2. Mira introduces diagnosability to attack Dev's compromise (satisfy-when-hard).
   3. Dev turns the distinction: opacity forces Mira to a universal policy, so she must choose which one is correct without complexity.
   4. Mira relocates to the environment: we care about the distribution.
   5. Dev presses: how do we know the distribution? and what norm governs that?
   6. Concessions and final disagreement.

   Let's write the dialogue.
answer: |-
  ## Dialogue: The Normative Gap

  **Setting:** A quiet corner of a university library. Mira and Dev sit across from each other, laptops open but ignored, leaning over a shared notebook sketching Ari’s emergency-response scenario. Rain taps against the window.

  **Mira:** So, to crystallize: Ari’s problem is asymptotically hard. Every exact method *might* blow past his one-hour window on some instances. But lives hang on his choices. If a norm demands the impossible—exact optimization under these constraints—it’s inert. Worse, it’s *dishonest*. We need norms he can actually follow, tailored to his computational budget. A fast heuristic that gets close enough, validated by simulation or experience—*that’s* what “ought” means here.

  **Dev:** I agree on the complexity facts, but not the conclusion. The norm "Ari ought to maximize expected lives saved" states what’s objectively correct. That he can’t always achieve it doesn’t make it false; it highlights the tragedy of his position. Feasibility constraints describe his limits; they don’t redefine correctness. Collapse those, and you lose the very standard by which we judge his heuristic a "good approximation."

  **Mira:** But what work is this "correct" ideal doing? If Ari *can’t* conform to it in hour eleven, how does asserting it help him choose between, say, rerouting ambulances via the unstable bridge or the congested highway? Your "correct" norm is silent when he most needs guidance. Worse, it implies he’s failing even when he’s doing his utmost.

  **Dev:** It guides *evaluation*: we know his heuristic’s 95% success rate is impressive *because* we measure it against the ideal. Remove the ideal, and you’re just describing what he did—no praise, no blame. But concede me this: feasibility matters pragmatically. Ari shouldn’t bang his head against a wall. If he *knows* an instance is intractable in his timeframe, he *should* switch to a heuristic. But that’s conditional: "Aim for the ideal, and satisfy it when computationally possible."

  **Mira:** *(Leans forward)* Ah, but that’s where complexity bites hardest. Suppose we say Ari’s method has **diagnosable difficulty** if he can run a quick test—say, under a minute—that flags whether *this specific instance* (this hour’s road closures, weather, etc.) will make the exact method overrun his hour. Then he *could* follow your compromise: "Try exact, but if the test flags ‘hard,’ switch to heuristic." But what if the difficulty is **opaque**? No fast test exists; discovering if *this* instance is hard would take nearly as long as solving it. Then your compromise collapses. He *can’t* "satisfy when possible" because he can’t tell whether it’s possible until it’s too late to switch.

  **Dev:** *(Nodding slowly)* Granted, if opacity holds, my conditional strategy fails. No argument there. But your feasibility norm faces the same cliff. If Ari can’t diagnose hardness per-instance, *he also can’t tell when to invoke your surrogate norm*. You can’t say "Use the heuristic *only* on hard instances" if he can’t identify them in advance. So you’re forced into a single, universal policy: "Always use heuristic H." But now—*(taps notebook)*—why H and not H’? H might be fast but crude; H’ might be slower but more accurate. Choosing between them requires asking: which gets *closer to the ideal*? That’s a question about correctness—one complexity theory doesn’t touch. Your "feasible" norm secretly depends on an unspeed-justified ideal.

  **Mira:** Clever, but you’ve conflated instance-level and environment-level knowledge. Ari doesn’t need per-instance diagnosis if he knows the *distribution* of instances he faces. Over months, he might learn that 98% of emergencies are "easy" for heuristic H, or that worst-case instances are vanishingly rare in his city. Then "always use H" is justified by *expected* performance under realistic conditions. Complexity theory gives worst-case guarantees; but feasibility is about the *actual* distribution of problems in Ari’s world. That’s empirical and local—not settled by asymptotic theorems.

  **Dev:** *(Frowning)* I’ll concede that expected performance matters for pragmatic choice. But now you’ve shifted the burden: your norm "Always use H" relies on a contingent premise—"H performs adequately on the distribution D Ari faces." How do you *justify* that premise? Suppose Ari has limited data; D is uncertain. Now he needs a meta-norm: "Choose H such that, under plausible D, expected lives saved is high." But that’s just the original ideal norm reappearing! To define "adequate" or "high," you’re sneaking in the correctness standard you tried to banish. Worse—*(gestures at the window)*—what if a freak hurricane creates a worst-case instance? Your distributional view might call it an "outlier," but for Ari, it’s 100% of his problem *right now*. The ideal norm still evaluates: he *should* have saved more lives, if only he’d had a better method.

  **Mira:** The hurricane *is* the point! Your norm says, "Ari should have done the impossible." Mine says, "Given his tools and information, he should have used H, which was robust under expected conditions." That’s actionable. And yes, I need empirical input—but that’s Ari’s job! He monitors performance, updates heuristics. It’s messy, but it’s how norms *work* in finite worlds. Your "correct" norm is a ghost: it hovers, judging, but never tells him what to *do* when the ghost can’t be embodied.

  **Dev:** It tells him what to *strive* for—to seek better heuristics, faster machines! Without it, why improve? But I’ll grant this: feasibility constrains *immediate* action. In hour eleven, Ari *must* use some tractable method. Where we split is whether the norm he follows is "Use H" (feasible but approximate) or "Save as many lives as possible" (ideal but often unattainable). The latter doesn’t guide the moment-to-moment, but it anchors the entire practice. Without it, "H is good enough" becomes circular—good enough for what?

  **Mira:** For saving lives *here*, *now*, with *these* tools. That’s the only "what" Ari has. Your anchor is an abstract limit—like saying a candle *ought* to be the sun because it’s brighter. But fine: our crux is whether norms can demand the candle become the sun. I say no; you say yes. And we agree on this much: in opaque environments, Ari has no conditional rule to fall back on. He picks a policy and lives with it.

  **Dev:** Precisely. And that choice—which policy to live with—is where correctness whispers, even when it shouts too late. So at hour eleven, with opaque difficulty? Ari uses his best heuristic. But he does so knowing it’s a fallible shadow of what ought to be. He feels the gap. That’s the work of the ideal: not to guide the step, but to break complacency. Your feasible norm risks calling the shadow daylight.

  *(They fall silent, watching rain streak the glass. Ari’s dilemma hangs unspoken in the air.)*

