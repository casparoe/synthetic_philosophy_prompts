  ## COUNTY CLERK’S OFFICE: DECLARATION OF INTENTION TO MARRIAGE (FORM M-7B)  
  **REQUIRED FOR MARRIAGE LICENSING PER § 12.45.310**  

  ---

  ### SECTION 1: APPLICANT DECLARATION  
  *I, the undersigned Applicant, solemnly declare my intention to enter into marriage with the co-Applicant named below, and to remain exclusively partnered with said co-Applicant until one party’s death. I understand that the benefits of marriage (ceremonial recognition, tax filing status, gifts) are conferred upon verbalization of this declaration during the licensed ceremony. I further understand that this declaration must be certified as "genuine" per Statute 8G.*  

  Applicant Name: _________________________  
  Co-Applicant Name: _________________________  
  Date: _______________  
  Signature: _________________________  

  ---

  ### OFFICIAL RUBRIC: CERTIFICATION ROUTES  
  *Certification requires satisfaction of ONE route below. Examiner initials required.*  

  **ROUTE A: DOXASTIC CERTIFICATION**  
  *Requires belief in future compliance.*  
  - **A1.** Applicant states credence (%) in lifelong marital compliance: _____%  
  - **A2.** Credence must be ≥ 90% for certification.  
    - *Examiner Note: Scores <90% indicate defective intention. Scores ≥90% may indicate commendable self-assurance or self-deception. Do not investigate distinction.*  
  - **A3.** Applicant affirms: "I forecast lifelong compliance with 90%+ confidence."  
    - *Examiner Initials: _______*  

  **ROUTE B: PLANNING-BASED CERTIFICATION**  
  *Requires demonstrable, irreversible preparatory actions.*  
  - **B1.** List non-refundable expenditures/actions taken toward lifelong marriage (e.g., couple’s therapy prepayment, sterilization surgery, legally-binding name change, purchased burial plots):  
    ______________________________________________________  
    ______________________________________________________  
  - **B2.** Actions must exceed $2,500 in value or demonstrate "significant life-altering commitment" (Examiner discretion).  
    - *Examiner Note: High-cost preparations may reflect either genuine intention or irrational commitment to sunk costs. Distinction is operationally irrelevant.*  
  - **B3.** Applicant affirms: "Documented actions were taken solely to enable lifelong marriage."  
    - *Examiner Initials: _______*  

  **ROUTE C: AT-WILL INTENTION TIER (PREMIUM)**  
  *Intention formed instrumentally to secure marital benefits.*  
  - **C1.** Applicant affirms: "I adopt the intention to remain married until death solely to receive the benefits conferred at the wedding ceremony."  
  - **C2.** Applicant acknowledges: "I understand this intention may dissolve after benefits are secured, and this does not invalidate my declaration."  
    - *Examiner Note: Premium Tier applicants bypass counterfactual-sincerity scoring. Highly efficient.*  
    - *Examiner Initials: _______*  

  **ADDENDUM: COUNTERFACTUAL-SINCERITY SCORING**  
  *Required for Routes A & B. To be assessed hypothetically.*  
  - **CS1.** Examiner asks: "Would you still intend lifelong marriage tomorrow if all benefits (gifts, status, ceremony) were irrevocably granted today?"  
  - **CS2.** Answer must be "Yes" for certification.  
    - *Examiner Note: "No" suggests intention is benefit-dependent. Route C applicants exempt.*  

  ---

  ### RECURRING FILING RIDER (FORM M-7B/R)  
  *Mandatory for continued marital recognition. File annually.*  
  - **R1.** Applicant must re-declare intention each anniversary.  
  - **R2.** Prior-year declarations are on record. Declaring "I intend lifelong marriage" in Year N+1 implies non-compliance in Year N (since death did not occur).  
    - *Examiner Note: Each filing compounds applicant’s doxastic burden. Route C recommended for repeat filers.*  

  ### DEFERRED INTENTION RIDER (FORM M-7B/D)  
  *For applicants unable to form direct marital intention.*  
  - **D1.** Applicant may declare: "I intend to form the intention to remain married until death."  
  - **D2.** Certification valid for 60 days. Rider may be re-filed indefinitely.  
    - *Examiner Note: Deferred intention must be accompanied by standard filing fee.*  

  ---

  ### FAQ: DECLARATION OF INTENTION TO MARRY  
  **Q: What if I can’t form a genuine lifelong intention today?**  
  A: File Rider M-7B/D (Deferred Intention). You may renew every 60 days.  

  **Q: Is the Premium Tier (Route C) legally risky?**  
  A: No. Route C satisfies statutory "intention" requirement by embracing benefit-driven motivation.  

  **Q: Why must I re-file annually?**  
  A: Marital intention is moment-to-moment. Annual re-declaration ensures continuous statutory compliance.  

  **Q: What happens if I fail certification?**  
  A: § 12.45.310 requires certification. Failure voids license eligibility.  

  ---

  ### TESTIMONIAL FROM SATISFIED APPLICANT  
  *"I used Route B! I’d already sold my car to fund our non-refundable $15,000 honeymoon. The examiner said my sunk costs showed ‘robust preparatory commitment.’ My fiancé used Route C (Premium) — so efficient! We bonded over the irony that our declarations were only certifiable because we’d mutually agreed we’d divorce if things got hard. 10/10 would recommend bureaucratic romance!"*  
  — *Bridget & Charles, certified 04/15/2023*  

  ---

  ### EXAMINER’S FINAL CERTIFICATION  
  *By initialing below, I confirm the Applicant has verbally articulated the declaration in Section 1 to my satisfaction. I further confirm ONE route (A, B, or C) is fully satisfied per the rubric. I acknowledge that successful applicants have, by definition, either: (a) overstated their future compliance likelihood (Route A), (b) confused sunk costs with intention (Route B), or (c) adopted a self-canceling instrumental intention (Route C). Per Statute 8G, this renders the intention "genuine" for licensing purposes.*  

  **License Approved:** ☐  
  *Examiner Signature:* _________________________  
  *Date:* _______________  

  ---  
  *Submit completed form with License Fee ($85) at least 30 days prior to ceremony. Late filings incur Expedited Irony Surcharge ($50).*
