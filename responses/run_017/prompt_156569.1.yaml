answer: |-
  What you're describing is a **profound and recurring tension** in deflationary/minimalist theories of truth. Your observation is sharp, and the pattern you've identified is well-known (and often critiqued) within philosophy. It's not just a slip; it points to a core challenge for deflationism. Here's a breakdown addressing your specific questions:

  ### 1. **What is it called?**
      *   **The Explanatory Robustness Challenge for Deflationism:** This is the most general name for the problem you're identifying: how can a concept declared to have no substantive content ("weightless") perform significant explanatory work?
      *   **The Success Argument (or Challenge):** Specifically for **Case 1** (why true theories lead to successful actions like bridge-building or comet probes). Deflationists are challenged to explain this success *without* appealing to a substantive notion of truth/correspondence.
      *   **The Value of Truth Problem (or the Aim of Belief Problem):** Specifically for **Case 2** (why we should prefer true beliefs over merely useful ones). Deflationists are challenged to explain the *normative* or *instrumental* value of truth without relying on its being a substantive property tracking reality.
      *   **Quasi-Truth (or Instrumental Truth):** Sometimes the *kind* of truth invoked in explanations like Case 1 is called this, recognizing it seems thicker than pure deflationism allows. However, this label isn't universally applied to *the move itself*.
      *   **Not Quite Quasi-*Realism*:** You're right to note quasi-realism (associated with Simon Blackburn regarding moral language). It *is* relevant because it's a *meta-semantic strategy* used in other domains. Quasi-realism says: "We start by denying the reality of property X (e.g., moral goodness), analyzing it as an expression of attitude. But then, we *earn the right* to talk *as if* X is a real property through complex analyses of our practices." The *pattern* is similar: a thin concept is used to explain why we later talk thickly. However, quasi-realism is a *positive program* attempting to *justify* the thick talk from thin foundations, whereas the move you see in deflationism often feels like an *unjustified borrowing* without the detailed quasi-realist groundwork. It's the *same shape* (thin -> thick use) but applied to a different concept (truth itself) and often without the quasi-realist's explicit commitment to *earning* the thick talk.

  ### 2. **One Phenomenon or Two?**
      *   **One Core Phenomenon with Two Major Manifestations:** The core phenomenon is the **explanatory gap** created by deflationism's core tenet (truth has no nature beyond the T-schema/disquotational function). This gap becomes apparent in two crucial areas:
          1.  **Explaining Empirical Success (Case 1):** How does the truth of a *theory* explain its practical success?
          2.  **Explaining Normative/Instrumental Value (Case 2):** Why is having a true *belief* better/more reliable than having a false one, especially in novel situations?
      *   While distinct applications, the *structure of the problem* is identical: deflationism seems to strip truth of the very feature (a substantive relation to reality) needed to do this explanatory work. The solutions attempted by deflationists (discussed below) often try to address both using similar strategies (generalization, schemas).

  ### 3. **Nearest Established Concepts & Differences**
      *   **Correspondence Theory:** This is the obvious contrast. Correspondence *explicitly* posits truth as a substantive relation (correspondence) between a belief/sentence and reality. Your "the world is the way the theory says it is" *is* a correspondence intuition. **Difference:** Deflationism explicitly *rejects* correspondence as the *nature* of truth, reducing it to the T-schema. The tension arises when deflationists seem to *smuggle correspondence back in* via the back door when explaining success/value.
      *   **Substantive Theories of Truth (generally):** Includes correspondence, coherence, pragmatic theories. **Difference:** All substantive theories *endow* truth with properties (matching reality, fitting a system, being useful in the long run) that *prima facie* equip it for the explanatory tasks in Cases 1 & 2. Deflationism denies truth has any such substantive properties.
      *   **Quasi-Realism (as meta-strategy):** As mentioned, it shares the *pattern*: starting thin and ending up talking thickly. **Difference:** Quasi-realism is a program *aimed* at justifying this move for specific domains (ethics, modality). The move in deflationism often happens without that explicit justificatory framework, feeling more like an *ad hoc* borrowing. Also, quasi-realism is typically applied to *other* concepts *using* a deflationary notion of truth.
      *   **"True-in-a-Model" (Tarskian Truth):** A formal, logical concept defining truth relative to a structure. **Difference:** This is a precise mathematical tool for semantics. While deflationists might point to it as showing truth is "thin" (it's defined entirely by convention within a system), it doesn't directly explain *empirical* success or the *value* of belief about the *actual* world. Applying it naively to the actual world *presupposes* a correspondence between the model and reality.

  ### 4. **Legitimacy, Paying the Debt, and Edges**
  This is the crux. Can deflationists legitimately make these explanatory moves? It's highly contested. Here's how they *try* and the critiques:

  *   **The Deflationist Strategy: Generalization via the Truth Predicate**
      *   **The Claim:** Deflationists (e.g., Paul Horwich, Hartry Field) argue they *aren't* borrowing weight. They claim their explanations work purely through the *logical* function of the truth predicate: enabling blind endorsement and *generalization*.
      *   **Paying the Debt (Attempted):**
          *   **For Case 1 (Success):** "Plans formed on the basis of *true* descriptions tend to succeed" is shorthand for: "If a description D is true, and a plan P is formed on the basis of D, then P tends to succeed." Crucially, they argue this is just a *massive conjunction*: *For every individual true description D, and every plan P formed on its basis, P tends to succeed*. The truth predicate allows us to say this generally without listing every D. The *explanatory weight*, they insist, isn't carried by "true" itself, but by the *individual instances* of the T-schema embedded in the conjunction. For *each* D, if D is true (meaning: things are as D says), then acting *as if D* works. The generalization via "true" is just syntactic sugar. *What "true" contributes is purely logical convenience.*
          *   **For Case 2 (Value of Belief):** Similarly, "True beliefs tend to guide action successfully" is shorthand for: "For any belief B, if B is true (i.e., things are as B represents them), then actions guided by B tend to be successful." Again, the weight is on the individual T-instances: If I believe *that p*, and *p* is true (meaning *p*), then acting *as if p* in the relevant context will tend to work. The generalization via "true" allows us to state this as a universal principle.
      *   **Critique of the "Payment":**
          *   **The T-Schema Smuggles Correspondence:** The rebuttal is that this strategy *only works if the T-schema itself embodies correspondence*. When we unpack "D is true" via the T-schema to "things are as D says," we *are* invoking a correspondence intuition ("saying how things are" = corresponding to facts). Deflationism claims the T-schema is *primitive* and exhausts the concept, but opponents argue its *explanatory power in these contexts depends entirely on its correspondence-like reading*. The debt isn't paid; it's just hidden in the foundation (the T-schema).
          *   **The Generality is Substantive, Not Just Syntactic:** The claim that *all* true beliefs/descriptions tend to support successful action is itself a substantive claim about the relationship between accurate representation and practical efficacy. It looks like a *law-like generalization* that relies on the *nature* of truth as accurate representation, not just a syntactic trick. How does the mere *convenience* of generalization explain *why* this pattern holds universally?
          *   **Success Semantics:** Some argue that explaining action success requires a theory like "success semantics" (e.g., Ramsey, Whyte) where the *content* of a belief is defined by what would make actions based on it successful. This makes truth (correct representation) *constitutive* of content, giving it a substantive role deflationism denies. Deflationists resist this, but it highlights the perceived need for more than just the T-schema + generalization.

  *   **Legitimacy at the Edges:**
      *   **Passing the Buck (Reference, etc.):** If the deflationist tries to explain the T-schema's grounding via reference or other semantic relations (e.g., Field's "partial denotation"), the problem recurs: How do *those* concepts do explanatory work without being substantive? If the chain ends in something "cashed out" naturalistically (e.g., causal relations), then the deflationist might be *covertly adopting a substantive naturalized correspondence theory*. If it's left uncashed, the explanatory power remains borrowed.
      *   **Rhetorical/Motivational Work:** This is less problematic. If "true" is used purely rhetorically ("Aim for truth!") or motivationally, without being part of a theoretical *explanation* of *why* something works or *why* we should value it, the deflationist can easily dismiss this as merely employing the device for emphasis or encouragement, not as attributing substantive properties. The problem arises specifically when "truth" is invoked within an *explanatory argument* (e.g., "bridges stand *because* theories are true").

  ### 5. **The Causation Parallel: Spot On**
  You are absolutely correct. This pattern is **not unique to truth**. It's a **meta-philosophical pattern common to minimalist/deflationary analyses**:

  *   **Causation:** A Humean/regularity theorist says "A causes B" just means "A-type events are regularly followed by B-type events, under relevant conditions." But then, explaining *why* intervening on A (and not just a correlated C) changes B, they say "Because A is the *real cause*." This seems to invoke a thicker notion of causal efficacy or production that the original analysis denied. The minimalist account struggles to explain the asymmetry and efficacy inherent in intervention and manipulation. (See debates around Woodward's interventionist theory vs. Humeanism).
  *   **Other Examples:** Similar tensions arise with minimalist accounts of knowledge ("justified true belief" -> Gettier problems reveal a need for something more), personal identity (psychological continuity -> explaining responsibility seems to need a "real self"), and even meaning (use theories -> explaining normativity or correctness seems to need a "real meaning").

  **Conclusion:**

  You've identified the **Explanatory Robustness Challenge**, a fundamental and persistent criticism of deflationary theories of truth. While deflationists attempt to "pay the debt" by appealing to the **logical function of generalization** enabled by the truth predicate and grounding everything in the **T-schema**, critics argue this merely **hides the reliance on a correspondence-like intuition embedded within the T-schema itself** ("'p' is true iff p" implicitly means "'p' corresponds to the fact that p"). The pattern is **legitimate only if** the deflationist can convincingly show that the explanation works *solely* through syntactic generalization and the primitive, non-substantive T-schema, without *any* covert appeal to truth as a substantive representational success property. Many philosophers remain unconvinced, seeing the T-schema's explanatory power in these contexts as evidence that it *does* capture a minimal form of correspondence. Your parallel to causation is apt – it highlights a general challenge for minimalist philosophical analyses: maintaining explanatory power while denying substantive content. The move you observe is often seen as a symptom that deflationism, while capturing important logical features of "true," might be too thin to fully account for truth's role in our cognitive and practical lives.
