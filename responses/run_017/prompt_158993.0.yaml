  3. After Round 3: Ask: Why did the explicit denial not work? It drew attention to the issue. Then introduce: sometimes trying to block an inference makes it more salient.

  Then name the distinctions: conversational implicature, the maxim of quantity, flouting, etc., and mention Grice.

  What the game cannot produce: 
  - The recursive intention: the speaker in real communication usually intends the hearer to recognize the intention. In the game, the speaker might not have that intention; they just choose a card. The inference is drawn by the hearer automatically. So we have to state that in real communication, the speaker often chooses their words with the hearer's inferences in mind.

  Also, the game does not show that implicatures are cancelable. In Round 3, we tried to cancel by explicit denial and it didn't work? But in real life, sometimes it works. We can note that in the game the denial was awkward and triggered a different inference, but in principle, implicatures can be canceled without contradiction.

  If we had a round where the speaker says "In the forest and it may or may not be near the river", that would cancel the implicature? But we didn't include that.

  Finally, if we made the game competitive, the inferences that rely on cooperation (like quantity implicatures) would disappear or weaken. We might see more inferences about deception, but not the same patterns.

  This should fit in 90 minutes.
answer: |-
  ### Game Design: "The Choice Conundrum"

  **Premise**: Players are paired as "Directors" and "Builders" cooperatively constructing a structure (e.g., a bridge, tower) with virtual blocks. The Director sees a target blueprint but can only describe it using pre-written index cards. Builders interpret the cards to place blocks. The twist: Cards are underinformative, forcing Builders to infer from the Director's *choice* of card, not just its literal meaning.

  **Why this works**:  
  - Focuses on **choice-driven inference** (the key insight).  
  - Avoids classic examples by using abstract construction.  
  - Cooperative scoring aligns interests (no deception).  
  - One-shot pairings prevent private codes.  
  - Failure cases emerge naturally from card constraints.

  ---

  ### **Game Setup**  
  - **Materials**:  
    - Whiteboard (draw grids for "construction sites").  
    - Index cards (pre-written messages, 3–5 per round).  
    - Virtual blocks (represented by sticky dots on the whiteboard; e.g., red = steel, blue = wood, green = glass).  
    - Scoreboard (track team points; no real money needed).  

  - **Channel Restriction**:  
    - Directors see the target blueprint (a small grid with specific blocks) but **cannot point, draw, or speak freely**.  
    - Builders see only the shared construction site (a larger grid) and receive **one index card** from the Director.  

  - **Pairing and Rounds**:  
    - **16 players → 8 pairs per round**.  
    - **4 rounds total** (12–15 min each; 60 min gameplay).  
    - Re-pair randomly each round (no repeat partners).  
    - Roles alternate: Each player is Director once, Builder 3 times (or vice versa).  

  - **Payoff Scheme** (Cooperative):  
    - **Exact match**: 5 points (perfect blueprint replication).  
    - **Partial match**: 2–3 points (e.g., correct blocks but wrong location).  
    - **Critical error**: 0 points (e.g., unsafe structure).  
    - **Team-based scoring**: Points awarded to both players in a pair. Total team score displayed (e.g., "Team Score: 42/80").  

  ---

  ### **Card Sets and Rounds**  
  Design cards to be ambiguous, forcing Builders to infer from omissions. Blueprints are 2x2 grids; construction sites are 3x3 (allowing wrong placements).  

  #### **Round 1: Basic Choice Inference**  
  - **Goal**: Introduce that *choice* of card matters (not just content).  
  - **Blueprint**: Steel block (strong) in corner, wood (weak) in center.  
  - **Card Set** (Director chooses one):  
    - A: "Use steel and wood."  
    - B: "Put steel in a corner."  
    - C: "Avoid weak materials in the center."  
  - **Expected Inference**:  
    - If Director chooses A, Builder infers steel isn’t in the corner (why not choose B?). Builder places steel in center → **failure** (structure unstable).  
  - **Debrief Hook**: "Why did you avoid the corner when the card didn’t say to?"  

  #### **Round 2: Unintended Inference (Failure Case 1)**  
  - **Goal**: Hearer draws unintended inference; fault is ambiguous.  
  - **Blueprint**: Glass block (fragile) on top of steel.  
  - **Card Set**:  
    - A: "Glass on top."  
    - B: "Steel at the base."  
    - C: "Fragile material supported."  
  - **Expected Inference**:  
    - Director chooses A (truthful but incomplete). Builder infers steel isn’t at base (why not choose B?) and places wood at base → **failure** (glass breaks).  
  - **Debrief Hook**: "Did the Director *mean* to imply the base wasn’t steel?"  

  #### **Round 3: Failed Denial (Failure Case 2)**  
  - **Goal**: Explicit denial backfires.  
  - **Blueprint**: Red steel block alone (no other blocks).  
  - **Card Set**:  
    - A: "Only red blocks."  
    - B: "No blue or green blocks."  
    - C: "Red blocks – and definitely no green!"  
  - **Expected Inference**:  
    - Director chooses C to block "green" inference. Builder infers "Why mention green? Maybe blue is allowed!" and adds blue → **failure** (wrong material).  
  - **Debrief Hook**: "Did denying ‘green’ accidentally imply ‘blue’ was okay?"  

  #### **Round 4: Amplified Choice**  
  - **Goal**: Reinforce inference-from-choice with higher stakes.  
  - **Blueprint**: Symmetric structure (e.g., steel left, glass right).  
  - **Card Set**:  
    - A: "Left: steel."  
    - B: "Right: glass."  
    - C: "Symmetric materials."  
  - **Expected Inference**:  
    - Choosing A or B implies asymmetry. Builder ignores symmetry → **failure**.  

  ---

  ### **Predictable Problems and Pre-emption**  
  - **Problem 1**: Builders ignore card choice (focus only on literal meaning).  
    - **Pre-empt**: In rules, say: "Builders: Consider *why* the Director chose this card over others."  
  - **Problem 2**: Directors "over-cooperate" by avoiding ambiguous cards.  
    - **Pre-empt**: Constrain card choices (e.g., "You must use at least one ‘risky’ card per round").  
  - **Problem 3**: Pairs stall debating choices.  
    - **Pre-empt**: Set a 90-second timer per round.  

  ---

  ### **Debrief Guide**  
  **Goal**: Map gameplay moments to distinctions **without jargon** until the end.  
  - **Distinction 1: Literal Meaning vs. Choice-Driven Inference**  
    - **Moment**: Round 1 failure (Builder misplaces steel).  
    - **Question**: "When you placed steel in the center, what made you ignore the corner?" → Highlight: "You inferred from the *absence* of the corner card."  
    - **Name It**: "This is **inference from choice**—meaning comes from what wasn’t said."  

  - **Distinction 2: Unintended Inference**  
    - **Moment**: Round 2 failure (Builder uses wood base).  
    - **Question**: "Director, did you want the Builder to avoid steel? Builder, did you think they did?" → Highlight: "The inference happened, but no one intended it."  
    - **Name It**: "This is **unintended implicature**—communication broke despite honest intent."  

  - **Distinction 3: Denial Backfire**  
    - **Moment**: Round 3 failure (Builder adds blue).  
    - **Question**: "Why did denying ‘green’ make ‘blue’ seem possible?" → Highlight: "Denials can highlight what they try to avoid."  
    - **Name It**: "This is **inference persistence**—denials strengthen the suspicion."  

  - **Finally**: Introduce Grice (cooperative principle), maxims, and implicature.  

  ---

  ### **What the Game Cannot Produce**  
  1. **Recursive Intention**:  
     - The game **cannot** model "speaker intends hearer to recognize the intention." Players infer mechanically from card choices, not layered intentions.  
     - **Solution**: State post-game: "Real communication requires speakers to *intend* inferences to be recognized—this game faked it with forced choices."  

  2. **Mutual Knowledge**:  
     - The game lacks "we both know we’re cooperating." Players cooperate via rules, not deep alignment.  
     - **Solution**: Explain: "In reality, inferences rely on shared assumptions of cooperation—here, it was enforced by scoring."  

  ---

  ### **Competitive vs. Cooperative Dynamics**  
  If interests diverged (e.g., Directors score for deception, Builders for accuracy):  
  - **Inference Patterns Lost**:  
    - **Quantity implicatures** (e.g., "Why didn’t they say more?"). Competitive Builders distrust omissions.  
    - **Cooperative denials** (e.g., Round 3’s backfire). Competitive players ignore denials as lies.  
  - **Inference Patterns Gained**:  
    - **Adversarial implicatures** (e.g., "They denied X, so X is probably true!").  
  - **Analogy Shift**:  
    - Competitive play **breaks** Gricean cooperation. Examples become about deception (e.g., poker bluffs), not conversational inference.  
    - **Conclusion**: Stick to cooperative—it mirrors everyday communication better.  

  ---

  ### **Logistics**  
  - **Time**: 15 min setup, 60 min gameplay (4 rounds), 15 min debrief.  
  - **Run Smoothly**: Assign a facilitator to hand cards, enforce timers, and score. Use sticky dots for quick "block" placement.  
  - **Why It Fits**: No projector needed, uses whiteboard/index cards, and avoids lectures. Players "feel" the inference mechanics through failure.  

  This design forces players to grapple with choice-driven inference, fail constructively, and debrief with clear "aha!" moments. The missing recursion/intentionality can be covered verbally post-game.
