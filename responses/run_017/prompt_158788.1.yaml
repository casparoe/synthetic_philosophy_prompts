answer: |-
  ## Proposal: Taming Reflection’s Ghosts – Why Informational Asymmetry is the Missing Link

  **Project Summary:** Van Fraassen’s Reflection principle demands that your current credence in A, conditional on your future credence in A being *x*, should itself be *x*. It feels intuitive ("defer to future-you!"), but famously stumbles over cases like memory loss, concept acquisition, or fission. I argue the core issue isn't *just* these cases; it's that **Reflection implicitly assumes a single, idealized informational relationship between temporal stages.** This project aims to systematically map the *varieties* of informational asymmetry (more info, less info, different concepts, fission) and rigorously investigate what, if anything, a *generalized* Reflection principle could look like across this landscape. The goal isn't to save Reflection at all costs, but to determine *if* and *how* it can be salvaged as a unified principle once we properly account for *how* stages relate.

  ### The Core Question
  Can van Fraassen's Reflection principle be coherently generalized to accommodate the *full spectrum* of informational relationships between an agent's temporal stages? Specifically:
  1.  Can we define a parameterized family of principles (e.g., credence-now(A | credence-later(A)=x) = w * x + (1-w) * y, where *w* depends on the stage-relation)?
  2.  If so, can *w* be determined by principled features of the informational asymmetry (e.g., evidence gain/loss, conceptual shift type, fission symmetry)? Or...
  3.  Does the analysis reveal that *only* highly restricted cases (like pure evidence gain) support Reflection (w≈1), while others demand fundamentally different treatment (w=0 or no coherent principle at all)?

  **Success Condition:** *Either* outcome is valuable. Finding principled weights shows Reflection’s robustness. Showing weights are arbitrary or impossible forces us to abandon the *general* principle and clarifies exactly where the restricted version applies – a significant refinement of our understanding.

  ### Why Existing Moves Don't Solve This
  The standard toolkit leaves our core question wide open:
  *   **Restricting to "Non-Self-Locating" Propositions:** Sidesteps Sleeping Beauty-type cases but ignores evidence loss (where it's not self-locating, but future-you knows *less*) and conceptual shifts (where propositions aren't identical). It doesn't address the *diversity* of asymmetries.
  *   **Sticking with Conditionalization:** Conditionalization governs belief change *given specific evidence*. Reflection governs deference to *future degrees of belief themselves*. They are distinct norms. Conditionalization doesn't tell you how to handle cases where the future agent has *less* evidence or *different* concepts.
  *   **Going Imprecise/Interval-Valued:** This might handle *uncertainty* about the future credence or the stage-relation, but it doesn't address the fundamental *structural* question of *what the norm should be* under *known*, *specific* types of informational asymmetry. It treats the symptom, not the cause.
  *   **Adding More Test Cases:** The literature *has* identified problematic cases. What's missing is a systematic *framework* for classifying the *underlying informational relation* driving the problem in each case and asking whether Reflection *can* adapt. This project builds that framework.

  ### Why This Approach? What's the Angle?
  Instead of reacting piecemeal to counterexamples, this project proactively **taxonomizes the *causes* of Reflection failure/success based on stage-relation.** This gets us more than just another counterexample:
  1.  **Diagnostic Power:** It explains *why* Reflection fails in seemingly disparate cases (memory loss, fission) – they share specific informational asymmetry features.
  2.  **Clarity on Scope:** It forces a precise answer: *Under exactly which informational conditions does Reflection hold?* If it only holds under pure evidence gain, that's a crucial result.
  3.  **Foundation for Generalization (or Not):** It provides the necessary groundwork to rigorously explore a parameterized version. If weights *can* be principled, we'll see how; if not, we'll see exactly why generalization fails.
  4.  **Connects Threads:** It links debates on Dutch Books (sensitive to betting dynamics across stages), expert deference (what makes future-you an expert?), and conditionalization (how is evidence incorporated?).

  ### Project Plan (12 Weeks, ~15 hrs/week)
  *   **Weeks 1-2: Taxonomy & Literature Groundwork:** Define core categories of stage-relations: Pure Evidence Gain (standard), Pure Evidence Loss (e.g., repeated wipes), Asymmetric Evidence (e.g., learn A or not), Conceptual Shift (new distinctions, coarse-graining), Fission (symmetric/asymmetric). Map existing problematic cases onto this taxonomy. Identify key arguments (Dutch Books, Deference) and their dependence on assumed stage-relations.
  *   **Weeks 3-5: Pressure-Testing Standard Reflection:** Rigorously apply the standard Reflection principle to 2-3 paradigmatic cases *across* the taxonomy (e.g., one Pure Loss, one Conceptual Shift, one Symmetric Fission). Detail the contradictions or absurdities that arise *specifically due to the informational asymmetry*. Draft core critique.
  *   **Weeks 6-8: Hunting for Generalization (Weighted Reflection):** Formalize the parameterized principle. For each taxonomy category, explore: Can a plausible *w* (or range) be defined? Are there principled reasons to set *w* to a specific value (e.g., *w* = proportion of retained evidence, similarity of conceptual frameworks)? Does this resolve the problems from Weeks 3-5? Or does it just move the bump under the rug?
  *   **Weeks 9-10: Weighing the Alternatives / Consolidating:** If weighted Reflection seems viable, refine the parameterization and defend the principles for setting *w*. If it collapses, articulate precisely why – what features of the asymmetry make deference incoherent? Formalize the *restricted* principle (where *w*=1 is justified) and its necessary conditions. Compare strength to Dutch Book/Deference arguments under the taxonomy.
  *   **Weeks 11-12: Synthesis & Drafting:** Finalize the core argument. Write up the taxonomy, the critical analysis, the (failed or successful) generalization attempt, and the resulting restricted principle or conclusion against generalization. Polish the 2 core worked cases demonstrating the argument. Outline implications.

  ### Concrete Deliverable
  A ~6000-word paper (developed from proposal work) containing:
  1.  **A Taxonomy:** Clear categorization of stage-relations relevant to Reflection.
  2.  **A Diagnosis:** Demonstration that Reflection's failures stem from unacknowledged informational asymmetry.
  3.  **A Rigorous Investigation:** Analysis of the (im)possibility of principled generalization via weighting.
  4.  **A Clear Conclusion:** Either a defensible parameterized Reflection principle *with* principled weights, OR a well-motivated restricted principle specifying its exact domain of validity, OR a compelling argument for abandoning generalized Reflection entirely.
  5.  **Two Detailed Worked Cases:** Illustrating the argument (e.g., a Pure Evidence Loss case showing failure and why weighting fails/succeeds, and a Conceptual Shift case).
  *(This is ambitious but achievable with the focused scope and plan.)*

  ### Honest Failure Modes & Mitigation
  *   **Boring Failure:** The taxonomy just replicates existing distinctions (e.g., "it's all just conditionalization" or "asymmetry is already covered by self-locating"). **Mitigation:** Focus from Week 1 on the *novelty* of the asymmetry types (especially loss, conceptual shift) and their *distinct* challenges to the *core deference idea* of Reflection, not just belief change. If it collapses into conditionalization early, pivot to explicitly arguing why Reflection *is* reducible/eliminable (still a result!).
  *   **Genuine Negative Result (Good Failure):** Principled weighting is impossible; the only stable points are w=1 (pure gain) or w=0 (other cases). **This is success!** It forces abandonment of the general principle and clarifies its true, narrow scope. The paper writes itself: "Reflection Only Works When Your Future Self Knows More (And Even Then...)".
  *   **Messy Middle Ground (Risk):** Weighting seems possible but *w* feels arbitrary or context-dependent without deep principles. **Mitigation:** Weeks 6-8 focus intensely on *requiring* principled grounds. If none emerge, conclude that *this arbitrariness itself* is the reason generalization fails. "Reflection can't be saved by weights; it needs restrictions."
  *   **Scope Creep (Biggest Risk):** Getting bogged down in nuances of specific cases (e.g., endless fission variants) or trying to solve all of self-locating beliefs. **Mitigation:** Strict adherence to the taxonomy and timeline. Define core cases upfront. Focus on *illustrating the impact of asymmetry type* on Reflection, not solving the cases themselves. If a case becomes a time-sink in Weeks 3-5, replace it with a cleaner example.
  *   **Cut If Needed:** If time runs short, reduce the number of detailed worked cases from two to one highly illustrative one. Don't try to force the weighted version if analysis clearly shows it's doomed by Week 8 – focus energy on the restricted principle argument.

  **Bottom Line:** This project tackles the real ghost haunting Reflection – the unexamined assumption about how stages connect. Whether we find a way to generalize it or definitively bury the general principle, we'll understand *why* Reflection works when it does and fails when it should. That's progress worth a summer.
