answer: |-
  The alarm isn’t a sound. It’s a colour. A sudden, violent crimson bloom on the central screen, swallowing the cool blues and steady greens of Tank 4’s readouts. Ammonia. Spiking hard and fast. My stomach clenches, a cold little fist beneath my ribs. 2:07 AM. The water hums around me, the only constant in this glass and steel cave.

  I slide off the stool, the vinyl sticking to my thighs. The walk to Tank 4 feels longer tonight. Past the rows of softly lit cylinders, the water a deep, murky green under the LED strips. Shapes flicker within – fleeting shadows, frantic commas against the glow. Feeders stirring? Or something else?

  Tank 4 looms. The stink hits first – sharper, wrong. Ammonia burns the back of my throat, acrid and chemical. Not overwhelming, not yet, but rising. The surface churns, not with the usual lazy swirls, but with frantic, skittering movement. A hundred tiny impacts against the glass. *Thup-thup-thup*. Like frantic, wet fingertips tapping.

  My job is simple: diagnose, correct, log. The protocol flashes in my head: *Ammonia spike > Check inflow filters > Check biofilter status > Check oxygenation > Log severity code*. Severity code determines the report. Minor fluctuation? Clear it. Significant event? Log it. Flag it. Audit trigger.

  An audit. Carlos’s tired face swims up behind my eyes. Him showing me pictures of his new baby last week, the dark circles under his eyes deeper than mine. Lena, humming off-key while she scrubbed biofilm off the intake grates. Mr. Henderson’s quiet desperation when he talked about the loan extensions. The farm’s welfare certification hangs on clean logs, minimal incidents. One bad audit… *Costs people their jobs*.

  I crouch by the access panel. The biofilter readout glows steady green. Oxygenation’s fine. Inflow… I trace the clear pipe. A chunk of something – feed pellet? Dead shrimp? – jammed near the valve. Partial blockage. Reduced flow, reduced filtration. Simple. Fixable. Yank the gunk out, flush the line. The spike *should* subside as the filters catch up.

  But the shrimp. They’re not calming down. The frantic tapping intensifies. It’s not random. Clusters of them hurl themselves against the glass near the surface, where the bad air would be thickest. Others scrabble blindly along the bottom, antennae whipping. One near my feet spasms violently, legs curling and uncurling in a jagged rhythm before going still. Just for a second, then it twitches again.

  *One experiencer? Or a committee?*

  The ganglia. I remember the diagram from the mandatory training vid. Not a brain, not like ours. A cluster up front, then that chain down the belly, like knots on a frayed rope. Each knot handling its own bit: legs here, gills there, gut over there. Does the knot for the leg feel the scrape against the glass? Does the knot for the gill feel the ammonia burn? Is the whole thing just… signals firing in disconnected boxes? Little blips of *ouch* that never add up to a *me* feeling pain? Maybe they’re just organic machines, reacting. No one home to suffer.

  *Thup-thup-thup-thud.*

  Another shrimp slams itself sideways into the glass near my face. Its stalked eyes, black and faceted, seem to stare right at me. Or through me. Just sensors reporting light and shadow, no one looking *out*. Its swimmerets flutter madly, a desperate, useless fanning. Is that just a reflex? A programmed response to bad water, like a thermostat kicking on? Or is there a tiny, fragmented *panic* in that ganglion controlling the swimmerets? A panic that never talks to the panic in the leg ganglia, or the gill ganglia? A dozen tiny, terrified nothings trapped in one shell?

  Or worse. What if the knots *do* talk? What if the burning gill signal screams to the leg ganglia to *run*, and the leg ganglia scream back that they’re already trying, and the whole thing is a chorus of terror echoing down that nerve ladder? A crowded, screaming room inside every thrashing body. A hundred committees in this tank alone, each one a world of raw, unfathomable distress.

  My hand hovers over the manual override for the emergency flush. It’d blast in fresh, treated water, dilute the ammonia fast. It’d save them. Probably. But it’s loud, noticeable. It leaves a digital footprint. Questions get asked. Why the flush? Log the spike, and the flush becomes necessary mitigation. Don’t log it… and it’s just routine maintenance. I cleared a blockage. End of story.

  I think of the broodstock shed. Getting sent over there feels like stepping into a different kind of damp. Colder, dimmer. The big females, heavy with eggs, sit in individual trays. Docile. Too docile. They don’t dart. Their eyestalks… clipped. Just the tips, they said. To make them spawn. Neat snips. I helped once. Held one. Her body was warm, surprisingly heavy. Alien. Her remaining eye-stub twitched under my thumb. Just a nerve reaction, they assured me. No pain receptors there. Just ganglia firing pointlessly. What did the *other* ganglia feel? The ones for the legs that barely moved? The ones for the gut, processing food she didn’t seem to want? Was she a committee sitting in stunned, disconnected silence? Or was there a central hum of wrongness, a unified fog of damage?

  *Committee or sliver?*

  The tapping in Tank 4 is a drumbeat now. A frantic pulse against the glass. More bodies twitch on the bottom. The ammonia smell bites deeper. I picture Carlos’s baby. Lena singing. Henderson’s tight smile.

  I reach down. My fingers find the cold plastic of the manual flush lever. It’s small. Unassuming. A decision point.

  I don’t pull it.

  My hand moves to the touchscreen beside the tank. The log interface glows softly. I navigate to Tank 4’s incident log. My fingertip hesitates over the ‘Clear Event’ button. A phantom smell of broodstock shed antiseptic mixes with the ammonia.

  I press it.

  The crimson bloom on the central monitor winks out, replaced by calm, steady blue. The spike is erased. History rewritten. Just a fluctuation. Routine maintenance handled.

  The frantic tapping against the glass doesn’t stop immediately. It takes a few minutes for the cleaner water to circulate, for the filters to really bite. I stand there, watching the skittering shadows. One shrimp drifts near the outflow pipe, legs slowly paddling the now-cleaner current. Its antennae wave gently, almost languidly. Is it recovering? Or is one ganglion just finally giving up the signal to flee, leaving the others confused?

  I can’t tell if I just saved a hundred tiny nothings from meaningless reflex, or condemned a hundred tiny someones to fragmented agony. The screen is cool blue. The water hums. My knuckle brushes the cold tank glass, coming away damp. I wipe it slowly on the thigh of my coveralls, leaving a faint, dark smear.
