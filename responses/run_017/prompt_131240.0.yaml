prompt: |-
  Ok so context: I somehow ended up as secretary of our neighbourhood association (long story, nobody else wanted the job) and for the past year I've been watching a guy on our commitee who I can't get a handle on, and I want a word for what he does. You're a political theorist who works on democracy and populism — take your time with this, and before you settle on an answer, brainstorm out loud for a bit: list the two or three nearest concepts you can think of and say what's wrong with each of them. I don't want a bare label, I want the carving: what the thing is, what it isn't, and where its edges are. And please don't point me at papers or reading lists, I have no access to a university library, just explain it.

  Two episodes. Last spring our own survey showed members wanted the reserve fund spent on the clubhouse roof, by a lot. He started giving these short speeches about how what we really needed was to spend the reserve on suing the county over the bus depot. Nobody was into it. He got a petition going, it got talked about at every meeting, and eight weeks later we ran essentially the same survey and 60% wanted the lawsuit. His line: I don't lead anybody, I just say out loud what people already feel. The part that got me is that several members told me separately that they hadn't changed their minds — they'd finally understood what they'd wanted all along. So the fact that he had moved them was, for him and for them, the evidence that he was only following them.

  Second: in November the association voted on a motion he opposed and it lost badly. He didn't claim fraud. He said the people who voted it down aren't the real association — mostly newer members, people who show up to one meeting a year, people who don't know the history — and that the people who built this place would never have voted that way. And this isn't some ad hoc excuse: he's been saying who the real members are for years, consistently, since long before any of these votes.

  Are these one phenomenon or two different ones that happen to share a man? Is there an established concept for either? I half remember a podcast about Rousseau distinguishing what people actually want from what's really good for them, but that isn't it — he's not saying the lawsuit is better for us, he's saying we already want it and have been talked out of it, and in the second case he isn't claiming anything about our deeper interests at all, he's claiming that some of us don't count. It's also not just that he's a liar or a hypocrite; plenty of politicians are, and I don't think that's the interesting part. Both moves strike me as genuinely principled from inside his way of seeing things, and that's what I want a name for. If nothing established fits, coin a term, define it tightly, and give me a case that falls just outside it so I can see the boundary.
reasoning: |-
  Okay, let me tackle this neighborhood association puzzle. The user's description of this committee member presents two distinct but connected behaviors that feel intellectually familiar yet slippery to pin down. 

  First, the roof-to-lawsuit shift: The survey reversal is fascinating because it doesn't feel like ordinary persuasion. When people say "I didn't change my mind, I just realized what I always wanted," that echoes what I've seen in populist mobilization - where the leader's role is framed not as directing but as awakening pre-existing desires. But calling it mere populism feels too broad. The key nuance is how he positions himself as merely articulating what's already there, making the changed opinion feel like discovered truth rather than influence. That's different from standard leadership.

  Then the "real members" doctrine: Discrediting unfavorable outcomes by redefining membership boundaries is textbook exclusionary populism. But again, the consistency of his definition over years adds rigor - it's not just situational whining. The Rousseau reference the user mentioned is a red herring though; this isn't about general will vs. private interests, but about constructing legitimacy through selective belonging.

  Hmm... what concepts come close? 
  - Hegemonic articulation (from Gramsci/Laclau): Where leaders stitch together demands into a collective "we." Fits the first episode but not the second's exclusionary move. 
  - Boundary policing (political sociology): Perfect for the membership gatekeeping, but doesn't capture the demand-shaping aspect. 
  - Manufactured consent (Chomsky): Too manipulative - the people here genuinely feel ownership of the shifted opinion.

  Aha - the unifying thread might be what I'll call "interpretive sovereignty." Two core mechanisms: 
  1. Epistemic ventriloquism: Making people feel he's channeling their latent will (with that eerie "always wanted this" effect). 
  2. Constituent purification: Systematically defining who counts as legitimate deciders based on historical/spiritual ownership.

  Testing boundaries: If he'd said "new members are misguided but still members," that would fall outside. If he'd openly said "I convinced you," it wouldn't be ventriloquism. The power lies in maintaining the fiction of passive representation while actively reshaping both will and membership. 

  This feels like the precise carving the user requested - not just labeling but exposing the machinery. The added irony is how both moves preserve his democratic facade while subverting accountability. I'll structure the response to first show why near-miss concepts don't fully fit, then crystallize the new framing with clear edges.
answer: |-
  You've described a fascinating and unsettling political phenomenon that deserves precise dissection. What you're observing isn't one tactic but two interconnected maneuvers forming a single political *style*. After careful consideration of near-miss concepts, I propose the core dynamic is **Interpretive Sovereignty**.

  ### Why Near-Miss Concepts Fall Short
  1.  **Populism (classic definition):** He uses populist *rhetoric* ("the real people," elite capture of desires). **Why it misses:** Classic populism (à la Laclau/Mouffe) positions the leader as *representing* a pre-existing, excluded group against a corrupt elite. Your colleague isn't just representing; he's *defining* the group ("real members") and *defining* their desires ("what you *really* want"). He doesn't claim an external enemy blocking the "real will"; he claims the members' *own expressed will* is corrupted until he clarifies it. The agency flip is key.

  2.  **Hegemonic Articulation (Gramsci/Laclau):** He's stitching together demands ("lawsuit good") with identity ("real members"). **Why it misses:** Hegemonic articulation builds broad coalitions around shared demands. Your colleague *excludes* (new members aren't "real") and insists the demand *pre-existed* his articulation ("I just say it out loud"). He doesn't build a coalition; he *purifies* the constituency and *reveals* its pre-existing true desire. The emphasis is on uncovering, not constructing.

  3.  **Gaslighting:** He makes members doubt their initial preferences ("you *always* wanted this"). **Why it misses:** Gaslighting is individual, psychological manipulation for control/denial. This is *collective* and *political*. He provides a *plausible political narrative* ("your preferences were suppressed") that members *accept and internalize as their own realization*. It's less about denying reality and more about offering a compelling, identity-affirming reinterpretation of it.

  ### Interpretive Sovereignty: The Core Concept
  **Definition:** *The assertion of exclusive authority to define both the authentic constituency ("The People") and the authentic will of that constituency ("The Real Will"), rendering any expressed preferences that contradict this interpretation as illegitimate or inauthentic.*

  **The Carving: What It Is & How It Works**

  1.  **Dual Definitional Control:**
      *   **Constituent Definition:** He defines who the legitimate political subject is ("the real association," "the people who built this place"). This definition is *essentialist* and *ahistorical*. It's not based on formal membership or participation ("newer members," "one meeting a year") but on an unchosen, almost mystical identity rooted in a perceived past essence ("people who know the history"). *Legitimacy flows from identity, not procedure.*
      *   **Will Definition:** He defines what the authentic will of this purified constituency *truly* is ("what people already feel," "what we really needed"). This "true will" exists prior to, and often obscured by, discussion, formal votes, or "misleading" influences (like the initial survey). *His role is not to persuade but to interpret and reveal.*

  2.  **The Epistemic Flip (The "Ventriloquist Effect"):**
      *   This is the masterstroke. When people change their vote *because he articulated a position* and then say, "I didn't change my mind, I finally understood what I *always* wanted," **he successfully positions himself not as an influencer, but as a conduit.** His act of *shaping* preference is experienced by the audience as an act of *discovering* their own pre-existing preference. His influence becomes the *evidence* that he wasn't influencing, merely revealing. This dissolves accountability for persuasion.

  3.  **Delegitimizing Contradictory Evidence:**
      *   Any expression of will contradicting his interpretation (like the initial survey or the November vote) is explained away not as "wrong" in a policy sense, but as *inauthentic*:
          *   It comes from the *wrong people* (non-"real" members).
          *   It reflects a *corrupted* or *confused* state of the real members ("talked out of it," suppressed true desire).
      *   **The key move:** The failure of his preferred outcome isn't evidence *against* his interpretation of the "real will"; it's evidence *for* the corruption or illegitimacy of the process or participants. The interpretation is unfalsifiable.

  **Applying the Concept to Your Episodes**

  1.  **The Roof vs. Lawsuit Shift:**
      *   **Constituent Definition:** Implicitly, the "real" members are those who eventually "recognized" their true desire for the lawsuit. The initial survey reflected a suppressed/corrupted state.
      *   **Will Definition:** The "true will" was always to sue the county; the roof was a distraction or symptom of suppression.
      *   **Epistemic Flip:** His speeches/petition didn't *create* desire; they *revealed* the pre-existing, latent desire. The change *proves* he was right about the true will. Members internalize this narrative ("finally understood").

  2.  **The November Vote & "Real Members":**
      *   **Constituent Definition:** Explicitly defines the "real association" – excludes newer, less involved members. They lack the essential identity/spirit/history.
      *   **Will Definition:** The "real will" of the "real association" would *never* support the losing motion. The actual vote result is illegitimate because it included illegitimate voters.
      *   **Delegitimizing Evidence:** The vote loss *confirms* the problem – the participation of non-"real" members corrupted the expression of the true will.

  **The Edges: What Interpretive Sovereignty Is NOT (Case Examples)**

  1.  **NOT Mere Hypocrisy/Lying:** A politician who flip-flops on an issue for votes is hypocritical. A politician who *insists* their flip-flop actually aligns with the "true, unchanging core values" of the constituency (which only they can define) is exercising interpretive sovereignty. **Boundary Case:** A politician caught in a blatant lie about their past position *and* admits to changing their mind for strategic reasons falls outside.
  2.  **NOT Simple Elitism/Paternalism (à la Rousseau):** Rousseau's Legislator knows the "real good" the people *should* want, distinct from their "will of all." Your colleague claims to know the "real will" the people *actually* have, obscured by bad influences. He doesn't say "You *should* want the lawsuit"; he says, "You *do* want it, deep down, I'm just voicing it." **Boundary Case:** A committee member arguing, "I know the roof seems popular, but the lawsuit is objectively better for our long-term property values, so we must do it," is paternalistic, not interpretively sovereign.
  3.  **NOT Just Building Coalitions:** A leader who convinces diverse members to support the lawsuit by finding common ground or compromising is coalition-building. Your colleague redefines the group (excluding some) and defines their will as *always already* aligned with the lawsuit, requiring no persuasion, only awakening. **Boundary Case:** A member who says, "New members, let me explain why this lawsuit benefits you too, and I hope you'll support it," is persuading/coalition-building, not claiming interpretive sovereignty.

  **Why "Interpretive Sovereignty" Fits**
  It captures the core claim: **He asserts sovereign authority over the *meaning* of the community and its desires.** He doesn't just lead opinions; he defines whose opinions count and what those opinions authentically *are*, rendering contradictory expressions invalid. It's a powerful, anti-deliberative, and anti-pluralist move that bypasses accountability by dissolving the line between representation and creation, and between the constituency's expression and his interpretation of its essence. The "principled" feeling you note comes from the internal consistency of this closed system of definition and interpretation. His power lies in controlling the political narrative at its most fundamental level: who "we" are and what "we" truly want.
