  Okay, let me unpack this user's complex query. They're clearly a transitional justice scholar testing their bilateral-commitment model against Argentina's turbulent history. The level of detail and precision signals deep expertise - they're not looking for introductory material but rigorous stress-testing of their framework.

  First, I need to carefully map Argentina's three amnesty moments to their model's elements: promisor, promisee, consideration, third parties, breach conditions. The 1983 self-amnesty is particularly tricky since it lacks a second party - already suggesting a model limitation. The Alfonsín-era laws present that fascinating inversion where amnesty follows rather than precedes punishment, with military uprisings as clear consideration.

  The user's three proposed revisions intrigue me. The duress angle seems compelling for Argentina - those laws were literally passed under tank threats - but would it invalidate most historical amnesties? That might actually be their point. The moratorium theory elegantly explains the 2000s reopenings, though I wonder if it overstates predictability. And the intertemporal bind problem cuts to constitutional fundamentals.

  What worries me is their model's blindness to Argentina's innovative 1990s solutions: escraches and truth trials. These kept accountability alive when punishment was blocked - something their contractual framework can't capture. Maybe that's the real lesson: amnesties aren't endpoints but inflection points in longer struggles.

  The South African comparison is crucial. There, conditional amnesty at transfer produced immediate truth recovery without Argentina's backlash. That contrast might help evaluate whether duress or timing matters more. Though I should note SA's unique conditions (Mandelas presence, lower military fragmentation) limit generalizability.

  Their final question about the model's silence on non-punitive justice feels pivotal. If a framework can't explain censure without punishment or truth without trials, is it fit for purpose? I lean toward saying no - but that's exactly why Argentina breaks it. The creative resistance movements forced accountability through other channels, proving finality was always illusory.
answer: |-
  Here is a mapped analysis of Argentina's transitional sequence against your bilateral-commitment model, testing its fit and your proposed revisions:

  ### I. Mapping Argentina's Amnesty Moments to the Model
  *(Promisor, Promisee, Consideration, Third Parties, Breach)*

  1.  **1976-1983 Junta's Self-Amnesty (Ley de Pacificación Nacional, 1983)**
      *   **Promisor:** The outgoing military junta (to itself).
      *   **Promisee:** The military junta/government (itself).
      *   **Consideration:** None identifiable within the model's logic. Power was already lost due to Falklands collapse; no *quid pro quo* for handover exists.
      *   **Third Parties:** Victims of state repression; guerrilla groups (implicitly covered).
      *   **Breach:** Annulment by the incoming democratic Congress. *Model Problem:* This lacks a true bilateral bargain; it's a unilateral declaration against future actors.

  2.  **Alfonsín Era Statutes (Punto Final 1986, Obediencia Debida 1987)**
      *   **Promisor:** Democratic Government/Congress (Alfonsín administration).
      *   **Promisee:** The Military Institution (as a corporate entity, particularly mid/low-level officers).
      *   **Consideration:** **Military Forbearance from renewed coups/insurrections.** This is explicitly the price for ending prosecutions after the initial junta trials and amidst ongoing prosecutions threatening military cohesion. The *Carapintada* uprisings (1987-88) were the immediate, violent manifestation of this threat.
      *   **Third Parties:** Victims of state repression; potential future defendants below colonel rank; guerrilla defendants (covered de facto by scope).
      *   **Breach:** Renewed prosecutions beyond the statutes' limits. This occurred via annulment (2003) and judicial invalidation (2005).

  3.  **Menem Pardons (1989, 1990)**
      *   **Promisor:** Executive Power (President Menem).
      *   **Promisee:** Convicted Junta members, convicted guerrillas, potentially the broader military institution seeking closure.
      *   **Consideration:** **Political Stability and Final Closure.** Ending the persistent threat of military unrest definitively and symbolically "turning the page" for society. It aimed to fulfill the *de facto* promise of finality implied (but not delivered) by the Alfonsín laws.
      *   **Third Parties:** Victims; broader society; judiciary (whose convictions were overridden).
      *   **Breach:** Revival of prosecutions against pardoned individuals. This occurred post-2005.

  ### II. What the Model Explains Well (Argentina)

  1.  **Lateness & Emergence Under Threat:** The model perfectly explains the Alfonsín statutes. Impunity wasn't granted *at* transfer (1983) but *later* (1986-87) in direct response to a *renewed* threat (military uprisings) *after* initial prosecutions had begun. The consideration (forbearance) only became necessary and valuable to the promisor (democratic government) when the threat materialized.
  2.  **Punishment Preceding Amnesty:** The model accommodates this sequence. The initial trials demonstrated the *lack* of credible commitment against prosecution, triggering the military's demand for forbearance (amnesty statutes) as the price for not overthrowing the democracy. The amnesty was the *response* to the punishment, not the precondition for handover.
  3.  **Symmetric Treatment:** While the model *can* require symmetry (promisee side needing assurance), Argentina shows its *instrumental* use. The Alfonsín laws and Menem pardons formally covered both sides (state and guerrillas), even though state repression was vastly greater. This symmetry was a politically necessary concession to the military's self-justifying narrative ("Dirty War") to secure their forbearance/stability, despite the factual asymmetry documented by CONADEP.

  ### III. Where the Model Misdescribes (Argentina)

  1.  **1983 as Collapse, Not Pact:** The model assumes a negotiated transfer where amnesty is the price. Argentina 1983 was a collapse. The junta's self-amnesty was a desperate, unilateral act against a defeated enemy (guerrillas largely crushed) and a *future* democratic government, not a bilateral bargain enabling transfer. The democratic government took power without conceding *anything* on amnesty initially.
  2.  **Victims as Non-Parties:** The model correctly identifies victims as third-party subjects, not bargainers. Argentina starkly confirms this. Victims' demands for justice were overridden by the state's need to manage the military threat.
  3.  **Self-Amnesty's Lack of Second Party:** The 1983 self-amnesty fundamentally breaks the bilateral structure. There is no external promisee; the junta is both promisor and promisee vis-à-vis its *future* self. The model lacks a category for this unilateral pre-emptive strike.

  ### IV. Testing Revisions Against Argentina & South Africa

  1.  **Duress Revision:**
      *   **Fit with Argentina:** Excellent. The Alfonsín statutes were enacted under explicit, violent military threat (*Carapintadas*). A duress doctrine directly explains their later voidability. The self-amnesty was imposed unilaterally on a non-existent democratic counterparty, also fitting duress/coercion against the *future* state.
      *   **Predictive Power:** Predicts that amnesties granted under credible threat of violence (coups, civil war restart) are inherently unstable and likely to be challenged/voided when the threat diminishes (as post-2003 Argentina shows).
      *   **Check Post-2003:** The annulment/invalidation of the statutes *was* justified partly on grounds resembling duress/coercion, aligning with this revision.
      *   **Reductio?** It *would* invalidate many amnesties (e.g., El Salvador, Chile's initial constraints). **This is not a reductio; it's a valid conclusion.** Most real-world amnesties *are* granted under some degree of threat or imbalance of power. Recognizing duress as a core instability factor is empirically sound, even if normatively challenging. South Africa's TRC amnesty, while negotiated under significant pressure, arguably involved less *immediate violent* duress during the *granting* phase compared to Argentina 1986-87. The threat was more about *future* violence if a deal wasn't reached *at* the transfer moment.

  2.  **Intertemporal Constraint Revision:**
      *   **Fit with Argentina:** Very Strong. The core sequence demonstrates this: self-amnesty (voided), Alfonsín statutes (voided), Menem pardons (circumvented). Each "final" settlement proved non-final. It explains why beneficiaries *still* sought amnesties/pardons (they provide temporary respite and political cover, even if legally fragile).
      *   **Predictive Power:** Predicts inherent instability of amnesties. Future governments/societies will revisit them if political will and capacity shift, regardless of formal legality. Finality is unattainable through legal fiat alone.
      *   **Check Post-2003:** The reopening directly confirms this revision – the constraint *was* overcome.
      *   **Vs. South Africa:** SA shows greater durability (so far), but its *conditional* nature (truth for amnesty) and unique context (Mandela's legitimacy, negotiated dissolution of old security structures) may be mitigating factors, not a refutation. The intertemporal constraint *still* exists; it hasn't been *tested* as severely as in Argentina.

  3.  **Moratorium Revision:**
      *   **Fit with Argentina:** Good. The Alfonsín statutes/Menem pardons functioned *de facto* as a ~20-year moratorium. Prosecutions resumed when the military's political power waned significantly. The "price" paid bought time for democratic consolidation.
      *   **Predictive Power:** Predicts amnesties are temporary pauses; reopening occurs when the balance of power shifts decisively against beneficiaries (loss of coercive capacity, generational change, stronger civil society/judiciary). Explains why reopening isn't "breach" but expiry.
      *   **Check Post-2003:** Kirchner's actions and judicial shifts align perfectly with a power shift enabling the moratorium's end.
      *   **Vs. South Africa:** If SA's amnesty is a moratorium, its "term" hasn't expired because the power shift needed to challenge it (given the ANC's dominance and the amnesty's conditional legitimacy) hasn't occurred.

  **Verdict on Revisions:**

  *   **Least Ad Hoc:** The **Intertemporal Constraint** revision. It flows directly from the model's core insight about successor sovereignty and is empirically robust across cases (Argentina confirms it dramatically; SA hasn't refuted it, just not tested it severely yet). Duress and Moratorium are significant *causal mechanisms* explaining *why* and *when* the constraint is overcome, but the constraint itself is the fundamental structural limitation.
  *   **Best Explanation for Argentina's Sequence:** **Duress** best explains the *timing and form* of the Alfonsín statutes. **Moratorium** best explains the *duration* of their effect and the *nature* of the reopening. **Intertemporal Constraint** explains why *any* reopening was always a structural possibility.
  *   **Duress Conclusion:** That it invalidates many historical amnesties isn't a *reductio*; it's an accurate reflection of their coercive origins and inherent instability. We *should* accept that amnesties granted under duress are highly vulnerable.

  ### V. Where the Model is Silent

  1.  **Expressive/Evidentiary Work (1990s Argentina):** The model has **no vocabulary** for:
      *   **Censure without Punishment (Escraches):** Social movements bypassed the blocked legal system to impose social accountability, creating a form of "people's justice" focused on shaming and exclusion.
      *   **Findings of Fact without Sentences ("Truth Trials"):** Litigants and courts decoupled truth-finding from criminal liability. The goal was establishing historical record, victim recognition, and preserving evidence *despite* the amnesty/pardons, not delivering punishment *at that time*.
  2.  **Implication for the Model:** **A model with this gap cannot be a complete account of what transitional justice measures are for.**
      *   Argentina demonstrates that when the "bargain" (amnesty/pardon) blocks the primary justice mechanism (criminal trials), societal demand for accountability finds alternative channels. These channels serve core transitional justice goals: truth, recognition, moral condemnation, and preserving the *possibility* of future legal action.
      *   The model focuses narrowly on the *exchange* enabling transfer or stability. It ignores the *ongoing societal process* of reckoning with the past, which persists even when punishment is legally foreclosed. The Argentine case shows that "finality" in the legal/political bargain does not equate to social or moral finality. A complete model must account for these persistent demands and the innovative forms they take when the formal bargain fails to satisfy them. The expressive/evidentiary work of the 1990s was not just a byproduct; it was a crucial mechanism for sustaining the possibility of *eventually* overcoming the constraints inherent in the original bargain.
