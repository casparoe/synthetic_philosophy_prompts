prompt: |-
  Me and my mate Dave had a three-hour argument in the pub last night about where the line between history and pseudohistory actually goes, and I've come away realising I've got a whole pile of verdicts and no principle behind them. Dave's position — which I think is bollocks but I couldn't say why — is that it's purely sociological: pseudohistory is just what the people with jobs in history departments say is pseudohistory, and Fomenko only counts as a crank because he isn't one of them. I don't believe that, because I've got cases going both ways. But I also can't get my own test to work. The test I've been using goes: a claim is pseudohistory if its defenders have a move that converts every apparent refutation into more evidence — forgers, suppressed excavations, the dating is wrong, the mainstream won't look — so there's no state of the evidence that would get them to stop. Call it the no-way-out test. My second idea, which I like less, is about scope: crank theories never stop, they promise to rewrite everything, whereas real revisionism changes one thing and leaves the rest of the furniture where it was. I'm not sure that's more than a vibe, and it may just be a proxy for how big the claim is, which can't be right either.

  Here are the verdicts I'm stuck with. (A) Fomenko: as I understand it, roughly everything before the year 1000 is a phantom duplicate of later history, arrived at by running statistical comparisons over king-lists and eclipse records. Obviously crank — and I want to say more than 'false': something about the method is rotten before you even check the answer. (B) Ancient aliens: the pyramids and the Nazca lines needed outside help. Crank, and I also think part of what's wrong with it is moral — it's a refusal to credit people four thousand years ago with being able to organise anything, which makes me suspect demarcation isn't purely epistemic, though I'd rather it were. (C) A visiting professor my girlfriend's department takes the piss out of: the Pictish symbol stones are a complete writing system and the Picts taught literacy to Ireland. Immaculate footnotes, and he does concede individual readings when people push him, but the headline conclusion has never moved in twenty years and every claim happens to land in the direction of national prestige. I call him a crank. (D) A retired surveyor who reckons every parish church in the county sits on a prehistoric grid; when three turn out to be off it, he says those three were rebuilt. Crank. (E) A local amateur who argued in the eighties that our abbey's foundation charter is a twelfth-century forgery. The professionals scoffed, and then a copy in a cartulary turned up with a witness list that can't be earlier than about 1180, so he was right. I want to say it was a real hypothesis all along — but note he was an outsider, he was claiming the documents are fakes, which is exactly the move in my no-way-out test, and the only difference I can find between him and (D) is that he turned out to be right, which is cheating. (F) Two cases from measuring stones: a retired engineering professor who surveyed hundreds of circles and found they all used one unit (the megalithic yard, I think) — crank, and as far as I can tell nobody in archaeology takes it seriously now; versus the passage at Maeshowe lining up with the midwinter sunset — perfectly respectable. Same evidence type, opposite verdicts, and I can't tell you how many coincidences have to pile up before a pattern becomes a pattern. (G) A real professor with a university press book arguing that all the silver in late Anglo-Saxon coinage came from a single Alpine mine. I think it's probably wrong. It is not pseudohistory. (H) One I go back and forth on: my flatmate's mate, a metal detectorist, says the hoard he found was a ritual deposit rather than someone's savings buried in a hurry. Half the time I think that's just I found something lovely and now I want it to be religious; half the time I think it's an ordinary inference from where the stuff was lying. (I) One more: my girlfriend's own thesis, that a whole genre of early medieval saints' lives was written by women. She'd be delighted if it were true and she cares because of a political commitment. I do not think that's crank. But I cannot see what separates it from (C), except that I happen to agree with it.

  So: can you give me one principle, or at most two, stated precisely enough that I could apply it cold to a case I haven't seen — with a line on which of my cases motivates each clause, what it says about (H) and (I), and a straight answer about which of my verdicts it forces me to drop? Please also invent one new case yourself and tell me what your principle says about it, ideally the kind of case that shows where it would embarrass me. It can't smuggle in turned out to be true, for the reason in (E): that's no use on a live case and it would make (E) and (D) differ only by luck. And I'd like a sentence or two about what I should have said to Dave when he said it's all just who's in the club — I'm fairly sure (C), (E) and (G) together sink that, but I couldn't argue it properly at the time and he's going to bring it up again on Friday.
reasoning: |-
  Okay, let me tackle this user's query. They had a long argument with Dave about distinguishing history from pseudohistory. The user has several examples and wants a clear principle. First, I need to understand their key points: they reject Dave's view that it's just about academic authority, and their "no-way-out" test and scope ideas don't fully work.

  Looking at their cases: Fomenko, ancient aliens, the Pictish stones professor, the parish grid surveyor—all seem like pseudohistory. The abbey charter forger was an outsider proven right, which complicates things. The megalithic yard vs. Maeshowe alignment shows similar evidence but different verdicts. The Alpine silver theory is mainstream despite possibly being wrong. The metal detectorist's ritual deposit is ambiguous, and the girlfriend's thesis is considered legitimate despite political motivation.

  The user needs a principle that doesn't rely on truth or academic status. Their no-way-out test fails because the abbey example used similar tactics but was correct. Scope isn't reliable either. The key might be in how hypotheses handle counter-evidence. Pseudohistory often immunizes itself, while real scholarship allows falsification. Also, the approach to evidence: cranks tend to force-fit data, whereas historians seek coherence with established knowledge.

  For the cases: Fomenko and ancient aliens dismiss counter-evidence. The Pictish professor concedes minor points but never the main claim, showing immunization. The parish grid guy moves goalposts. The abbey forger, however, made a specific falsifiable claim. The megalithic yard ignores archaeological context, while Maeshowe fits with broader practices. The Alpine silver theory is testable and peer-reviewed. The metal detectorist's claim is vague but not necessarily pseudohistory if open to testing. The girlfriend's thesis, though politically motivated, engages with evidence and allows refutation.

  Dave's sociological argument is countered by cases like (C) where a professor is still a crank, (E) where an outsider was right, and (G) where a mainstream scholar might be wrong but isn't pseudohistorical. Legitimacy comes from methodology, not position.

  A new test case: someone claims the Roman Empire didn't exist, dismissing all evidence as fabrication. This would clearly be pseudohistory under the proposed principle due to total evidence rejection and immunization tactics.
answer: |-
  Here's a precise demarcation principle derived from your cases, designed to be applied cold, addressing your sticking points with Dave, and forcing you to drop one verdict:

  **The Principle:**
  **A historical claim is pseudohistorical if it:**  
  1.  **Systematically immunizes its core tenets against counter-evidence:** Its proponents possess and employ pre-defined, non-falsifying strategies to absorb or reinterpret *any* disconfirming evidence as either (a) deliberate suppression/forgery, (b) misinterpretation by opponents, or (c) confirmation of a deeper, hidden pattern.  
  2.  **Systematically disregards established epistemic constraints:** It willfully ignores or dismisses fundamental principles of historical reasoning (e.g., context, source criticism, chronological coherence, parsimony, burden of proof) *when they conflict with the desired conclusion*, forcing evidence to fit the theory rather than adapting the theory to fit the evidence.

  **Why two clauses?** Clause 1 captures the "no-way-out" aspect you identified but makes it *systematic* and *strategic*. Clause 2 addresses the core epistemic failure beyond just immunization – the active refusal to play by the rules of evidence that make historical discourse possible. Pseudohistory isn't just persistent; it's *epistemically unmoored*.

  **Application to Your Cases & Motivating Clause:**

  *   **(A) Fomenko:** Pseudohistory. (Clause 1 & 2). Statistical cherry-picking (ignoring chronological constraints - Clause 2), reinterpreting *all* conflicting evidence as later duplication or forgery (immunization - Clause 1).
  *   **(B) Ancient Aliens:** Pseudohistory. (Clause 1 & 2). Ignores archaeological context and human ingenuity (Clause 2). Any evidence *against* alien help becomes evidence of lost alien tech or suppression (Immunization - Clause 1). Moral dimension often *stems from* this epistemic disregard.
  *   **(C) Pictish Stones Professor:** Pseudohistory. (Clause 1). His "concessions" on minor points are tactical, *never* affecting the core claim (systematic immunization). Nationalist bias likely drives the *selective* disregard for constraints (Clause 2) on *interpreting* ambiguous symbols. Motivation matters, but the *method* is key.
  *   **(D) Parish Grid Surveyor:** Pseudohistory. (Clause 1). "Rebuilt" is a classic immunization move to absorb counter-evidence. Ignores the messy realities of historical site development (Clause 2).
  *   **(E) Abbey Charter Forger (Amateur):** **NOT Pseudohistory.** (Clause 2). *Crucially, he made a specific, falsifiable claim about a specific document based on internal evidence.* His "move" (claiming forgery) wasn't a *systematic immunization strategy* pre-applied to *any* counter-argument. If professionals had found an unimpeachable earlier copy, he *could* have been proven wrong. He didn't claim a vast conspiracy suppressing *all* evidence; he made a testable claim about one document. **This forces you to drop your initial verdict that he *was* a crank.** He was an outsider with an unpopular, ultimately correct, *testable* hypothesis.
  *   **(F1) Megalithic Yard Engineer:** Pseudohistory. (Clause 1 & 2). Ignores archaeological context (varied builders, periods, purposes - Clause 2). Counter-evidence (sites not fitting) is dismissed as measurement error, later disturbance, or ignored (Immunization - Clause 1). Forces data onto a single unit.
  *   **(F2) Maeshowe Alignment:** NOT Pseudohistory. (Clause 2). A specific claim about one site, grounded in its archaeological context and broader understanding of Neolithic astronomy/ritual. It doesn't require dismissing conflicting evidence or reinterpreting *all* circles; it's a plausible hypothesis within established constraints.
  *   **(G) Alpine Silver Professor:** NOT Pseudohistory. (Clause 2). A bold, potentially wrong, *but testable* hypothesis using established methods (metallurgy, numismatics, trade history). It engages with potential counter-evidence (other mines, trade routes) and could be falsified by finding isotopic signatures from elsewhere. Peer-reviewed, published by UP.
  *   **(H) Metal Detectorist Ritual Deposit:** **Ambiguous, but likely NOT Pseudohistory (yet).** (Clause 2). The key is *how* he argues. If he bases it solely on "loveliness" and ignores context (soil layers, associated finds, typical hoard patterns), it veers towards disregarding constraints (Clause 2). If he argues based on find context (e.g., wetland, unusual arrangement, association with potential ritual features) *while acknowledging other possibilities*, it's a standard historical inference, however speculative. It's not *systematically immunized* unless he dismisses *any* counter-argument as "you just don't understand ritual."
  *   **(I) Girlfriend's Saints' Lives Thesis:** NOT Pseudohistory. (Clause 2). Motivation (political commitment) doesn't automatically make it pseudohistory. The critical test is *how evidence is handled*. If she uses established philological, codicological, and historical methods, engages seriously with counter-arguments (e.g., anonymous authorship conventions, lack of direct evidence), and her conclusions are potentially falsifiable (e.g., by finding a male author's draft, or showing the argument relies on forced readings), it's legitimate scholarship. **Difference from (C):** (C) *systematically immunizes* the core claim despite conceding minor points. (I) can be argued against *on the evidence* within shared methodological constraints. Motivation might *influence* interpretation, but doesn't inherently *violate* Clause 2 unless it drives the systematic disregard.

  **New Test Case:**
  *   **Claim:** "The Great Wall of China was actually built by a lost advanced civilization 10,000 years ago. Later dynasties merely repaired it. All carbon dates showing Ming Dynasty construction are either contaminated by later materials or part of a government cover-up to hide China's true ancient glory. The lack of earlier artifacts nearby proves the builders were so advanced they left no trace."
  *   **Principle's Verdict:** Pseudohistory. (Clause 1: Immunization - any dating evidence against it is contamination or cover-up; lack of evidence becomes proof of advanced tech. Clause 2: Disregards constraints - ignores overwhelming archaeological context, established dating techniques, burden of proof, parsimony; forces interpretation to fit the desired narrative of extreme antiquity and lost advancement). This shows how the principle catches the *epistemic strategy* even for a novel, seemingly "big" claim.

  **What to Say to Dave:**
  "Dave, it's not *just* sociology. Look: (C) *is* a professor with footnotes, but his method is rotten – he concedes minor points but *never* lets evidence challenge his core claim, making it pseudohistory. Conversely, (E) was an *amateur*, dismissed by the 'club', but he made a specific, testable claim and was right – his *method* (critiquing a document) was sound history, even if unpopular. And (G) is a professor whose specific, testable theory might be wrong, but it's still history because it plays by the rules of evidence. The 'club' matters for *acceptance*, but the line between history and pseudohistory is drawn by *how claims handle evidence*. Pseudohistory uses moves that make it unfalsifiable in principle and ignores the basic rules of the game. It's about methodology, not membership."
