prompt: |-
  I sit on the standing review panel of a national research council's high-risk "Frontiers" scheme, and we are mid-term reviewing a five-year programme grant, *Pre-Selection Without Words*, which asks whether any non-human animal preselects among possible actions — trying out candidate moves in imagination, as it were, and letting the bad ones die cheaply — rather than merely repeating whatever a history of reinforcement has stamped in. The interim report describes what the applicants call the "costly check" result: in a novel apparatus where the food is visible from the start and where lifting a weighted inspection flap costs the bird both time and priority of access, most of the crows lift the flap before committing, on their very first encounter with the apparatus. The applicants read this as preselection: the birds pay a real price to eliminate a possibility before acting on it. One of our panel members reads the same data as a Skinnerian creature doing exactly what a long reinforcement history for investigating anything novel would predict, and says the experiment was never designed to tell the two apart. Both readings feel genuinely available to me, and I cannot see what would break the tie.

  What makes it worse — or more interesting — is a wrinkle raised at our last meeting. The apparatus is itself informative: the flap's weight, the transparent panel, the way the reward sits in the tube, all encode the answer in a form a bird could simply read off the world rather than compute in its head, so that what looks like foresight may be the environment doing the preselecting for a creature that only has to respond to the result. If that is right, we seem to have a mind that achieves Gregorian performance — real leverage from information-bearing structures outside the skin — without the Popperian machinery that the familiar four-rung ladder of Darwinian, Skinnerian, Popperian and Gregorian creatures (Dennett, I gather; I came to it secondhand) treats as its prerequisite. The rungs stop being cumulative, and our welfare working group's quiet assumption that these classifications track a single scale of inner richness comes apart. That matters concretely here, because the council intends to use this programme's outcome to set enrichment and husbandry standards for corvids kept by member institutions, and possibly to decide which species go onto an enhanced-protection list; if the competence lives in the niche rather than in the animal, the practical requirement may be to preserve the scaffold rather than to credit the mind.

  Please draft the decision memo I will circulate to our board before it meets on 12 March. It should recommend one concrete course of action on the second tranche — release it, release it re-profiled, or withhold it pending a specified change — with a date or milestone attached, and it should state plainly what result eighteen months from now would settle the question either way. Assume the memo will be shared with the applicants, so the decision rule has to be something they could actually go and answer in a laboratory rather than an invitation to produce a deeper philosophical argument. It should also engage seriously the objection I expect from our comparative psychologist: that no behavioural signature can distinguish preselection occurring inside the animal from preselection performed by a structured environment, and that in any case welfare protection should track what an animal can suffer rather than where it sits on a ladder of cognitive kinds — so that, as she put it at our last meeting, both our research question and our enrichment debate are expensive ways of asking something we already know the answer to. If you think she is right, say so and recommend accordingly; if you think she is partly right, say which part and what follows for the tranche.
reasoning: |-
  Hmm, the user is part of a review panel for a high-risk research program called "Pre-Selection Without Words" that's studying whether non-human animals can preselect actions mentally rather than just relying on reinforcement learning. They've hit a mid-term review and there's a key disagreement about interpreting the "costly check" experiment with crows.

  The core problem seems to be that the same crow behavior - lifting a weighted flap before accessing food - can be interpreted in two ways: as genuine cognitive preselection (Popperian cognition) or as simple Skinnerian responding to novelty. Even more interestingly, there's concern that the apparatus itself might be doing the "thinking" for the crows through its design (Gregorian scaffolding), which would upend the assumed hierarchy of cognitive evolution.

  The user needs a decision memo that resolves three practical issues: funding for the second tranche, a concrete behavioral test to break the tie between interpretations, and addressing ethical concerns about linking cognition to welfare standards. The comparative psychologist on the panel has raised valid objections that welfare should track suffering capacity regardless of cognition level.

  I should craft a memo that recommends continuing funding but with specific conditions. The key is designing an experiment that can distinguish internal preselection from environmental scaffolding. One approach could involve manipulating how much information the environment provides - for example, creating an apparatus where the cost/benefit ratio isn't visually apparent and must be computed mentally. The "informative scaffolding" concern could be tested by systematically degrading environmental cues.

  For the welfare debate, the memo should decouple cognition assessment from standards, emphasizing that environmental complexity benefits all animals regardless of their cognitive mechanisms. The decision rule needs to be concrete - perhaps requiring the crows to demonstrate cost-sensitive information seeking in ambiguous scenarios where novelty responses can be ruled out.

  The timeline should be realistic - about 18 months for design, testing and analysis. The memo must be actionable for the researchers while satisfying both the skeptical psychologist and the board's need for clear criteria. Importantly, it should acknowledge that discovering environmental scaffolding would still be valuable for designing better enclosures, even if it changes how we view corvid cognition.
answer: |-
  ## MEMORANDUM

  **TO:** Frontiers Scheme Review Board  
  **FROM:** [Your Name], Standing Review Panel  
  **DATE:** 5 March 2024  
  **SUBJECT:** Mid-Term Review & Funding Recommendation: Programme Grant *Pre-Selection Without Words*  

  **1. Programme Status & Key Challenge**  
  The *Pre-Selection Without Words* programme presents compelling initial data ("costly check" result) suggesting crows may pay an immediate cost to gather information before acting. However, the panel identifies a critical ambiguity: the observed behaviour **does not conclusively distinguish** between:  
      *   **(A) Internal Preselection (Popperian):** Mental simulation of actions.  
      *   **(B) External Preselection (Gregorian):** Leveraging environmental structure (apparatus cues) to reduce internal computation.  
      *   *(C) Skinnerian Novelty Response:* Reinforced exploration of novel stimuli.  
  Panelist concerns regarding interpretative ambiguity (particularly Skinnerian vs. Popperian/Gregorian) and the programme's original design limitations in resolving this are valid. Furthermore, the potential decoupling of observed "foresightful" performance from internal cognitive complexity (i.e., Gregorian without Popperian) challenges presupposed cognitive hierarchies and has significant implications for deriving welfare standards.  

  **2. Addressing Core Objections**  
  The panel acknowledges the comparative psychologist’s fundamental objection:  
      *   **"No behavioural signature can definitively distinguish internal from environmental preselection."**  
      *   **"Welfare standards should track capacity for suffering, not cognitive kind."**  
  **Response:**  
      *   **Ambiguity Challenge:** While a *single, perfect* behavioural signature may be elusive, **converging evidence from strategically designed experiments can strongly favour one interpretation over others.** The key is to create scenarios where predictions diverge significantly between internal computation, environmental scaffolding exploitation, and simple reinforcement history. The recommended action below addresses this.  
      *   **Welfare Priority:** **We concur.** The capacity for suffering, frustration, boredom, and the need for species-appropriate behavioural expression are paramount. While understanding cognitive mechanisms is scientifically valuable, welfare standards must primarily ensure environments meet ethological needs and prevent negative states, regardless of whether competence resides internally or in a scaffolded niche. Programme outcomes should inform enrichment *design* (e.g., what scaffolds support well-being?), not imply a hierarchy of "deservingness" based on inferred internal complexity.  

  **3. Recommendation for Second Tranche Funding**  
  **Recommendation: RELEASE SECOND TRANCHE FUNDING (Conditional Release - Reprofile Required)**  

  **4. Conditions & Reprofiling Requirement**  
  Funding is contingent on the applicants **designing, conducting, analysing, and reporting** within the next tranche period on a **specific, decisive experiment** targeting the core ambiguity. The programme must be *reprofiled* to prioritize this experiment.  

  *   **Core Objective:** Discriminate between Internal Preselection (A), External Preselection via Environmental Scaffolding (B), and Skinnerian Novelty Response (C) as explanations for the "costly check" and similar behaviours.  
  *   **Required Experiment: The Ambiguous Cost/Benefit Probe.**  
      *   **Design Principle:** Create a novel apparatus/variant where the *cost of information gathering* and the *potential benefit/value of the revealed information* are **not readily perceptible from initial environmental cues alone.** Crucially, the *actual* cost/benefit ratio must be variable and experimentally controlled.  
      *   **Key Manipulations:**  
          1.  **Hidden Cost Variability:** The "inspection cost" (e.g., flap weight, delay duration, effort type) varies significantly between trials/blocks but is not visually cued beforehand (e.g., identical-looking flaps with different internal weights/motors; varying delay durations triggered only upon flap initiation). Birds cannot simply "read" the cost.  
          2.  **Hidden Benefit Variability:** The *value* of the information gained by inspection (e.g., likelihood reward is present, size/quality of reward, presence of a competitor) also varies significantly between trials/blocks and is not visually cued beforehand. Crucially, the *actual* cost and benefit variations are orthogonal (e.g., high cost might reveal low benefit, or high benefit).  
      *   **Critical Prediction for Internal Preselection (A):** Birds should modulate their **decision to pay the inspection cost** based on the *hidden context* influencing the *expected value* of the information. They should be more likely to pay a high cost when the hidden context suggests high potential benefit is likely, and avoid high costs when the hidden context suggests low benefit is likely, even on first encounters with a *novel apparatus configuration* implementing these hidden variables. They should *integrate* learned probabilistic associations about hidden contexts with the novel apparatus presentation.  
      *   **Predictions for Alternatives:**  
          *   *(B) Environmental Scaffolding:* Performance should degrade significantly. If the environment doesn't transparently encode the cost/benefit, the bird cannot exploit the scaffold effectively. A pure Gregorian strategy should fail here.  
          *   *(C) Skinnerian Novelty Response:* Birds should show a relatively consistent rate of inspection *regardless* of the hidden cost/benefit context, driven primarily by the novelty of the *apparatus type* or specific action, modulated only by very direct reinforcement over many trials within the *same* context (not generalizing hidden probabilities to novel configurations quickly). High costs might suppress responding generally through punishment, but not *sensitively* based on the hidden *benefit* context.  

  **5. Decision Rule & Milestone**  
  *   **Milestone:** Submission of a comprehensive report on the *Ambiguous Cost/Benefit Probe* experiment, including raw data, full analysis, and interpretation relative to the three hypotheses (A, B, C).  
  *   **Deadline:** 30 September 2025 (18 months from March 2024 Board decision).  
  *   **Decision Rule for Programme Outcome Interpretation (Re: Preselection):**  
      If birds **sensitively modulate their costly information-seeking behaviour based on the hidden cost/benefit context on first encounters with novel configurations implementing these hidden variables** (as per Prediction A), this constitutes strong evidence for **Internal Preselection** (Popperian machinery).  
      If birds **fail to modulate sensitively, showing behaviour consistent only with novelty response or direct reinforcement within context, or performance degrades significantly** (as per Predictions B/C), this favours interpretations relying on **Environmental Scaffolding exploitation (B) or Skinnerian mechanisms (C)**, undermining the core claim of internal preselection in the original costly check paradigm.  

  **6. Implications for Welfare Standards**  
  Regardless of the experiment's outcome regarding internal cognition, the programme is generating vital data on **what environmental structures (scaffolds) enable corvids to solve complex problems and exhibit flexible behaviour.** This directly informs enrichment design. The board is urged to direct the welfare working group to:  
  1.  **Decouple welfare standards from inferred cognitive hierarchy rungs.** Focus on preventing suffering and providing opportunities for natural, species-specific behaviours (foraging, problem-solving, social interaction, exploration).  
  2.  **Prioritise "competence-supporting environments."** Base standards on the **environmental complexity required** for the animal to express its full behavioural repertoire and avoid frustration/boredom, acknowledging that this competence may be scaffolded. The *Pre-Selection* research, especially findings on effective environmental structures, will be invaluable here.  

  **7. Conclusion**  
  The "costly check" result is intriguing but interpretatively ambiguous. The comparative psychologist's caution regarding behavioural signatures and welfare foundations is well-taken, particularly the imperative to centre welfare on preventing suffering. However, a decisive experiment *is* feasible. We recommend releasing the second tranche conditional on the programme being reprofiled to execute the *Ambiguous Cost/Benefit Probe* experiment. The outcome of this experiment (report due 30 Sept 2025) will provide the necessary evidence to break the interpretive tie regarding preselection. Welfare standards development must proceed, informed by the programme's findings on effective environmental scaffolding but explicitly decoupled from contested inferences about internal cognitive architecture.  

  **Recommended Board Action:** Approve release of second tranche funding contingent on programme reprofiling agreement and acceptance of the *Ambiguous Cost/Benefit Probe* milestone/deliverable by 30 September 2025. Direct the welfare working group to revise its framework per section 6.  

  **[Your Name]**  
  *For the Standing Review Panel*
