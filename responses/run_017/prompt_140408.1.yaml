prompt: |-
  Two colleagues on a subcommittee I sit on spent an hour arguing past each other, then turned to me to settle it, and I had nothing useful to say. The three of us have to give our county water district a single probability that a proposed recycled-water plant will overrun its budget by more than ten percent. The evidence base is a nine-hundred-page engineering appendix nobody can read in full, so each of us read a different slice of about a hundred and twenty pages, without first telling the others which. Our calibration on past forecasts is roughly identical. Hana came back with 30 percent, Yusuf with 55.

  (1) Hana: we are peers in every relevant respect — same training, same access, no track-record difference — so conciliationism applies and we should each move toward the other, which for two equally reliable people means roughly splitting the difference and both landing near 42 or 43 percent.

  (2) Yusuf: the usual argument for splitting the difference is that it is a cheap stand-in for something better, pooling our evidence and then each forming our own posterior from the whole; that is why the rule is trustworthy when it is. But here pooling is not expensive at all — I can tell you which sections I read and what they showed in ten minutes. You do not keep using a proxy once the real thing is on the table, so the proxy's authority does not transfer to a case like this.

  (3) Hana: pooling only relocates the problem. Even after you summarize your sections, I have to decide how much to trust a summary of pages I have not seen, and that is itself a disagreement with you about evidence I cannot assess directly. Apply the equal-weight thought one level down and it says I should treat your reading of your sections about as seriously as I would treat my own. Conciliationism is not a substitute for pooling; it is what you get whenever any evidence has to be taken on another person's word, which is most evidence.

  (4) Yusuf: taken seriously, that makes learning from others nearly inert — every report would drag me only halfway to the reporter's view, however strong her track record. Worse, it turns against the evidence you gathered yourself: the self who read those pages last week is just one more informant to the self deciding now, and if I split the difference with every informant, including my own earlier self, the rule stops pulling people toward the truth and starts pulling them toward ignorance. A view that tells you to distrust your own evidence-gathering cannot be the right one, which is why I am sticking closer to steadfastness.

  Please adjudicate the exchange move by move: for each of the four moves, say whether it is right, partly right, or wrong, and why. Then say who is more right overall, and what, if anything, both of them are missing. Finally, state which single argument or consideration would most change your verdict, and where your own reasoning is most likely to fail.
reasoning: |-
  We are to adjudicate the exchange between Hana and Yusuf move by move. The context is that three colleagues (including the narrator) are to give a single probability for a budget overrun of more than 10% for a recycled-water plant. Each read a different 120-page slice of a 900-page engineering appendix. Hana initially says 30%, Yusuf 55%. They are equally reliable.

  **Move (1): Hana's first argument**
  Hana argues that because they are peers (same training, access, track record), conciliationism applies. Therefore, they should move toward each other, splitting the difference to land around 42.5% (the average of 30% and 55%).

  Assessment: 
  This is a standard application of the "equal weight view" in peer disagreement. The idea is that when two equally reliable peers disagree, they should give equal weight to each other's opinion and average their estimates. This move is **right** in the context of a pure peer disagreement without considering the structure of the evidence. However, note that the evidence is partitioned (each read different parts) and the disagreement might stem from having seen different evidence. In such a case, the equal weight view is often defended as a reasonable default.

  **Move (2): Yusuf's first argument**
  Yusuf counters that the usual argument for splitting the difference is that it's a cheap proxy for the ideal of pooling their evidence and then forming a posterior. But in this case, pooling is cheap: they can tell each other what they found in their sections in ten minutes. Therefore, they should do the real thing (pooling) and not use the proxy.

  Assessment:
  Yusuf's point is that if they can share their evidence, they should do so and then each form their own updated probability. This avoids the need for a proxy (averaging) and is more accurate. This is a strong point because the cost of sharing is low. However, note that even after sharing, they might interpret the evidence differently. That said, in an ideal scenario with full sharing and common priors (and assuming they are both rational), they should converge. Therefore, this move is **right** in principle. However, we must consider if sharing is truly as easy as Yusuf says. He claims he can summarize his sections in ten minutes, but what about the potential for incomplete or biased summarization? Also, note that Hana and Yusuf are peers and equally reliable, so if they both share fully and honestly, they should be able to update correctly.

  **Move (3): Hana's second argument**
  Hana responds that pooling only relocates the problem. After Yusuf summarizes his sections, she then has to decide how much to trust his summary of pages she hasn't seen. That itself is a disagreement about evidence she cannot assess directly. She argues that the equal-weight thought should apply at this level too: she should treat his reading of his sections as seriously as she would her own. Therefore, conciliationism is not a substitute for pooling but is inherent whenever evidence is taken on another's word.

  Assessment:
  Hana is making a deeper point about the epistemology of testimony. Even when evidence is shared, the receiver must trust the testimony. If Hana and Yusuf are peers, then Hana should give Yusuf's testimony about his sections the same weight as if she had read them herself. This would lead her to update her probability as if she had seen all the evidence. Similarly, Yusuf should do the same. If both do this, they should end up with the same probability. However, note that if they both update correctly on the entire evidence (by incorporating each other's testimony appropriately), they should converge. This move is **partly right** because it correctly points out that testimony requires trust and that the peer disagreement problem recurs at the level of testimony. But it is also **partly wrong** because if they are both rational and trust each other as peers, then after sharing the evidence (via testimony) they should converge to the same probability without needing to split the difference. The equal-weight view at the testimony level should lead to convergence, not a persistent disagreement that requires splitting. Therefore, Hana's point that pooling doesn't completely avoid conciliationism is true, but it doesn't imply that they must split the difference after pooling. Instead, it should lead to agreement.

  **Move (4): Yusuf's second argument**
  Yusuf argues that if Hana's view is taken seriously, it would make learning from others nearly inert: every report would only pull you halfway to the reporter's view, regardless of how strong the reporter's track record is. Moreover, it would turn against one's own evidence: your past self is just another informant, so you'd split the difference with yourself and be pulled toward ignorance. He says a view that tells you to distrust your own evidence-gathering cannot be right, so he sticks to steadfastness.

  Assessment:
  Yusuf's first point is an exaggeration of Hana's position. Hana did not say that every report should only pull you halfway. She said that when you have a peer disagreement about evidence, you should split the difference. But in the case of testimony, if you trust the other as a peer, you should update fully as if you had seen the evidence. So the halfway pull is not the right way to characterize Hana's view. Moreover, the self-trust issue: if we treat our past selves as informants, then we might end up in a regress. But note that when we form a belief based on our own evidence, we are not in a disagreement with ourselves. We are forming a belief based on the evidence we have. The problem of self-trust is more about consistency over time. Yusuf's argument is **partly right** in that Hana's view, if taken to an extreme, could lead to skepticism. However, Hana's position is not that we should split the difference with every testimony but that in the face of peer disagreement about the interpretation of evidence, we should conciliate. Also, note that in the case of testimony from a peer, the rational update is to fully adopt the peer's report as if it were your own evidence. Therefore, the inertness worry is overblown. The self-trust point is important: we do trust our own evidence gathering, and we should. But that doesn't imply that we should ignore a peer's report. We should update appropriately. Therefore, Yusuf's move is **partly right** in highlighting a potential problem but **partly wrong** in mischaracterizing Hana's view and in advocating steadfastness without considering the value of peer input.

  **Overall Assessment: Who is more right?**
  Both make valid points. However, Yusuf's initial point (move 2) is very strong: if they can share evidence at low cost, they should do that. After sharing, they should update their probabilities accordingly. Hana's point in move 3 about trust in testimony is important, but if they are peers and trust each other, they should update fully and converge. The problem of persistent disagreement after evidence sharing would only occur if they are not actually peers (e.g., if they have different priors or are not fully rational) or if the sharing is not complete and accurate. But given the scenario (they are peers, and the sharing is quick and honest), pooling is the better approach.

  Therefore, Yusuf is more right overall. The best approach is to share the evidence and then update. This should lead to agreement without having to split the difference arbitrarily.

  **What are both missing?**
  They are both missing the fact that after sharing the evidence, they should each update their probabilities and then check if they agree. If they still disagree after sharing and updating, then they might have a genuine peer disagreement at that point and may need to conciliate. But without trying the sharing first, they are jumping to conclusions.

  Also, note that the third colleague (the narrator) is present. The three of them should share their evidence and then each update. The final probability should be an aggregate of their updated probabilities (or they should discuss until they reach consensus).

  **Which single argument or consideration would most change your verdict?**
  If the sharing of evidence is not as straightforward as Yusuf claims (for example, if the evidence is complex and requires deep expertise to interpret, or if there is a risk of biased summarization), then Hana's point about the difficulty of trusting the summary becomes more compelling. In that case, the conciliationist approach might be more appropriate. Also, if after sharing the evidence they still disagree, then the equal-weight view would become necessary.

  **Where might your own reasoning fail?**
  My reasoning assumes that after sharing the evidence, both Hana and Yusuf will update correctly and converge. But if they have different prior beliefs (beyond the evidence they read) or if they interpret the same evidence differently due to cognitive biases, then they might not converge. In that case, the disagreement persists and the equal-weight view might be needed. Also, the cost of sharing might be higher than anticipated if the evidence is technical and requires lengthy explanation.

  **Final Adjudication:**

  Move (1): Hana's first argument is **right** in the context of a pure peer disagreement without evidence sharing, but given the possibility of sharing, it is not the best approach.

  Move (2): Yusuf's first argument is **right** because pooling evidence is feasible and should be done.

  Move (3): Hana's second argument is **partly right and partly wrong**. It is right that testimony requires trust, but wrong in implying that they must split the difference even after pooling. Instead, they should update fully and converge.

  Move (4): Yusuf's second argument is **partly right and partly wrong**. It is right to worry about the extreme consequences of Hana's view, but it mischaracterizes her view and advocates steadfastness too strongly.

  Overall, Yusuf is more right.

  The best course of action: share the evidence summaries, then update. If they still disagree, they might need to average their updated probabilities or discuss further.

  But note: the problem asks for a single probability. So after sharing and updating, if they still have different probabilities, they should average those (if they remain peers) or use another method to aggregate.

  Given the time constraints and the fact that they are peers, the initial sharing and updating is the best step.
