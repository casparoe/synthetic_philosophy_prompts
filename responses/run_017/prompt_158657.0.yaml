prompt: |-
  I'm a fourth-year PhD student in a psychology department that adopted a pre-registration requirement about two years ago, and our chair now wants the same thinking written into the dissertation guidelines as an explicit grading scheme for evidence. I sit in on a philosophy of science reading group, where we recently ran into what people call the problem of old evidence: if you already know that E, then your credence in E is 1, so conditioning on E cannot raise your credence in any hypothesis, and yet theories plainly do get confirmed by evidence everyone already had. I would like to understand what our department's actual practice presupposes about confirmation, because the parts of it seem to me to point in opposite directions, and I would rather reconstruct the implicit theory than be told that the rubric is merely sloppy.

  Here is the practice, as concretely as I can state it. The scheme has three tiers. A hypothesis written down and time-stamped before the data were collected gets the top tier. A hypothesis formulated without consulting a dataset that already exists in the lab, and then tested against it, gets the middle tier. A hypothesis read off a dataset the researcher has already looked at gets the bottom tier, is dismissed as post hoc, and counts for almost nothing — no matter how well it fits or how large the effect is. But the same department also does two things that seem to cut against this. First, it treats a successful replication as confirmatory, even though the replicating team knows the original result and deliberately designs its study around reproducing it: the hypothesis there is as post hoc as anything, and nobody minds. Second, the results our subfield actually celebrates — the ones people give keynotes about — are cases where a theory accounted for an anomaly that everyone in the field had known about for years and that the reigning theory had conspicuously failed to explain; those are treated as stronger evidence than any pre-registered prediction, not weaker. A friend in the physics department says his field is the same way: the memorable cases are known recalcitrant data being accounted for, and he keeps using the anomalous advance of Mercury's perihelion as his example. He adds that his field sometimes institutionalises the worry in the opposite direction, by doing a blind analysis: the group fixes the entire analysis pipeline using simulated data and control regions of the real data, and only afterwards looks at the region where the new effect would show up, so that nobody can be accused of having tuned anything to the answer.

  So my question is what view of confirmation this pattern of credit presupposes. Is novelty of prediction doing the real work, or is it only a proxy for something else — that the data were not available for tuning, that the theory had no spare degrees of freedom, that the evidence discriminates against a live class of rivals? Does the celebration of the known anomaly force the practice into a comparative or contrastive account, on which confirmation is a three-place relation between a hypothesis, evidence, and an alternative, rather than a boost to a hypothesis on its own? Does it also force confirmation to be indexed to an agent's epistemic situation at a time, so that whether something confirms depends on what you already knew and whether you helped yourself to the data when you built the theory? I especially want to know which parts the practice strictly presupposes, which parts merely sit well with it, and where it is underdetermined: could someone who keeps a broadly Bayesian framework and handles old evidence by some counterfactual or likelihood-ratio route endorse the rubric exactly as written, and would the blind-analysis practice look rational to them? Finally, if we replaced the implicit view with a straightforward comparative-likelihood view, what would have to change in the rubric — would the three tiers collapse into one, would the credit for explaining old anomalies survive, and would blind analysis become pointless?

  Please answer in under 700 words, and don't cite or recommend any readings.
reasoning: |-
  Okay, the user is a fourth-year PhD student in psychology grappling with their department's new pre-registration requirements for dissertations. They've noticed an internal contradiction: while the department rigidly tiers hypotheses based on when they were formulated relative to data collection, they simultaneously celebrate two scenarios that violate this hierarchy—successful replications (which are inherently post hoc) and theories explaining long-standing anomalies (old evidence). 

  They're intellectually troubled by the disconnect between formal grading criteria and actual scientific practice, especially after encountering the "problem of old evidence" in philosophy of science. Their core question isn't about surface-level policy but about reconstructing the implicit epistemology behind these seemingly contradictory norms. 

  Breaking this down: First, the department's tier system clearly prioritizes prediction novelty, likely as a proxy against researcher degrees of freedom. But their celebration of anomaly resolution suggests that explanatory power—especially against entrenched alternatives—carries more weight than procedural purity. The replication paradox further undermines the novelty fetish, since replications derive value from corroboration rather than prediction. 

  The physics comparison is telling: blind analysis tackles the same bias concerns as pre-registration but through method rather than timing. This hints that the real epistemic work is about preventing data-snooping, not prediction per se. 

  So the implicit view seems comparative and contrastive. Confirmation isn't just H-E but H-E-against-alternatives. Anomalies confirm because they discriminate against reigning theories; replications confirm because they discriminate against flukes. Pre-registration's top tier likely works as a special case where novelty ensures the hypothesis wasn't reverse-engineered from the test data. 

  For the Bayesian question: Yes, a counterfactual likelihood approach could reconcile this. The rubric's tiers roughly track how much the result would surprise a neutral observer if H were false. Old evidence could confirm if we imagine a state of ignorance (e.g., "Would this anomaly be likely under H but unlikely under rivals?"). Blind analysis would fit perfectly here—it simulates that counterfactual ignorance. 

  Under a pure comparative-likelihood view, the tiers would flatten. What would matter is evidential strength against alternatives, regardless of timing. Anomaly explanations would shine, replications would keep their value, but pre-registered predictions wouldn't get automatic top billing unless they tested risky predictions. Blind analysis would remain useful as an implementation tool. 

  The user's discomfort is justified: their department's policy conflates a procedural heuristic (pre-registration) with epistemic strength. The deeper principles are about vulnerability to tuning and discriminatory power. A reformed rubric might distinguish "bias-resistant designs" (including blind analysis) from "discriminatory evidence" (anomalies, replications) rather than fetishizing prediction timing.
answer: |-
  Your department's practice implicitly endorses a **comparative, agent-relative view of confirmation** that prioritizes **discriminatory power against alternatives** and **resistance to researcher bias**, not prediction novelty for its own sake. Here’s the reconstruction:

  1.  **The Tiers as Bias Control:** The rubric doesn't primarily value *novelty* but *independence from the tested data*. Pre-registration (top tier) and pre-existing-but-unseen data (middle tier) prevent the hypothesis from being tuned *to the specific dataset* used for testing. The bottom tier penalizes potential circularity (fitting the hypothesis *to* the data it explains). This targets **researcher degrees of freedom** and **opportunistic testing**.

  2.  **Replications & Anomalies as Comparative Confirmation:** Both exceptions highlight the **contrastive nature** of confirmation presupposed by the practice:
      *   **Replications** confirm *discriminatively*: A successful replication isn't valued for predicting a *new* result, but for showing the original finding wasn't a fluke *or* an artifact of the original researcher's specific choices/analysis. It discriminates against "chance" or "method-specific artifact" as live alternatives.
      *   **Anomalies** confirm *discriminatively*: A theory explaining a known anomaly is celebrated because it succeeds where the *reigning alternative theory (or theories)* conspicuously failed. The anomaly is powerful evidence *against* the old theory; a new theory explaining it gains credit by providing a better alternative. The value comes from the **contrast** ("H explains what H_rival could not").

  3.  **Agent-Relativity & Counterfactual Thinking:** Confirmation *is* judged relative to the agent's knowledge and actions. Knowing the result *before* formulating H (bottom tier) undermines its probative value *because it allows tuning*. Knowing the original result before replicating *doesn't* undermine it because the replication's value lies in its independence and design to test robustness. The "known anomaly" gains its force from the historical context of failed explanations. **Blind analysis** aligns perfectly: it simulates the *counterfactual* state of *not* knowing the result in the critical region during method development, ensuring methodological choices weren't tuned to *that specific* answer.

  **Reconciling with Frameworks & Implications:**

  *   **Bayesian Counterfactual/Likelihood-Ratio:** A sophisticated Bayesian could endorse the rubric by focusing on how the *process* affects the likelihood ratio Pr(E|H) / Pr(E|¬H). Pre-registration ensures ¬H includes "researcher tuned H to noise." Testing unseen data or replicating makes Pr(E|¬H) very low if ¬H includes "random fluke" or "original-specific artifact." Explaining an anomaly makes Pr(E|H) high while Pr(E|H_rival) was known to be low. Blind analysis controls Pr(E|¬H) by preventing tuning.
  *   **Pure Comparative-Likelihood View:** Adopting this would significantly alter the rubric:
      *   The **tiers would collapse** into assessing the evidential strength of E *for H against specified alternatives*. Novelty/timing would only matter insofar as they demonstrably affected the likelihood ratio (e.g., by proving H wasn't tuned to *this* E).
      *   **Credit for anomalies** would not only survive but be central, as their strength lies precisely in their likelihood ratio against rivals.
      *   **Replications** would retain high value as strong evidence against flukes/artifacts.
      *   **Blind analysis** would remain valuable as a robust method to *achieve* a high likelihood ratio by minimizing the chance that Pr(E|¬H) is inflated due to tuning (i.e., ensuring ¬H doesn't include "analysis designed to fit *this* signal").

  **In essence:** The practice presupposes confirmation is about how well evidence *discriminates H from relevant alternatives* in a way resistant to bias. Novelty is a heuristic for independence, not the core epistemic virtue. The exceptions reveal the comparative core. Blind analysis is a direct implementation of the bias-control principle, not a contradiction. A shift to pure comparative likelihood would flatten the tiers but preserve the core value of anomalies, replications, and rigorous bias control.
