prompt: |-
  You're a political theorist who's sat through a hundred of these defenses and knows the dirty hands literature cold. Take a minute to brainstorm before writing anything — I want an actual prep sheet, not a summary of the debate.

  I'm defending a dissertation chapter next week. Thesis, roughly: the standard dirty-hands story (Walzer/Machiavelli flavored) treats the politician's guilt as a private residue — you do the necessary wrong, then you're stuck with it. I think that mislocates it. I argue for something I'm calling moral escrow: when an official does a genuinely necessary wrong for public reasons, the wrongness isn't forgiven and isn't privately swallowed either, it's held by the political community, and it's discharged later by a public body that (a) confirms the necessity after the fact, (b) formally records the wrong, and (c) imposes a symbolic sanction on the official. The guilt goes into escrow and only the polity can release it. Second half of the chapter is what I'm calling the publicity paradox: if the justification has to be publicly rehearsable later, officials will start choosing the more defensible dirty option rather than the least bad one, so my own mechanism distorts the choice it's supposed to redeem.

  The committee: one member is a Kantian who thinks dirty hands is conceptually confused — no genuine moral dilemmas, if it was right there's nothing to feel bad about. One is a political realist who thinks the whole literature is moralism smuggled into politics and will hear "the polity holds the guilt" as metaphysics. One is a public law person who works on official immunity and prosecutorial discretion and will want to know what my mechanism does to real accountability. The grad students in the room will mostly ask how this differs from the standard accounts.

  Give me the objections in the order they'll actually come, phrased the way each of those three would phrase them, each with what I concede up front, what I hold, a two-minute reply, and a note on where the reply is weakest. Include the question I'm hoping nobody asks.
