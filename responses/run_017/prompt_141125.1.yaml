prompt: |-
  Hey — I want you to work as a professional philosopher who specialises in early modern philosophy and the epistemology of testimony. Take your time with this one: before you commit to anything, brainstorm three or four candidate principles and the cases that kill them, then throw away all but one. I want the principle you actually endorse, not a menu of options with the choice left to me.

  I've been re-teaching Hume's chapter on miracles (section X of the 1748 Enquiry, the one censorship made publishers quietly drop) and I've noticed I can't tell my students what I actually think, only what Hume thinks. The part I keep repeating is his maxim, paraphrased: no testimony is enough to establish a miracle unless the falsehood of that testimony would be a bigger marvel than the miracle itself. Plus the supporting bits — witnesses are never numerous or educated enough, people love the marvellous, miracle stories flourish among ignorant nations, and rival traditions cancel each other out. Fine. But when I try to apply the maxim to actual cases my gut gives verdicts I can't unify, and I'd like you to find the principle behind them. Here are my verdicts, in my own words:

  1. A single continuous high-resolution recording, forensically unbroken, of an amputated leg regrowing over four hours in a hospital, with forty staff present and the leg still there afterwards. I'd accept that something happened that current biology can't account for. But I notice I want to say "our biology was wrong" rather than "a law of nature was violated," and I suspect that move is a dodge.

  2. Tens of thousands of pilgrims at a shrine, all expecting something, all saying the sun moved, and describing what they saw differently from each other. Worth next to nothing as far as I'm concerned.

  3. Twelve sober, educated, mutually hostile witnesses to an executed man walking around three days later; no shared source, nothing to gain, several tortured without recanting. Here's my problem: if you tell me this happened last week in my city I'd be genuinely shaken, and if you tell me it's in an ancient source I'm completely cold. I don't think that difference should be doing any work, but it is.

  4. A coin, tested beforehand, flipped by a machine in front of statisticians, comes up heads three hundred times in a row. I'd bet on rigging. But if I'm forced: I'd say something wildly improbable happened, and I also don't think this is a miracle in Hume's sense at all — so I don't know whether his argument has anything to say about merely statistical regularities.

  5. Two hundred geologists on five continents, with samples, report that every piece of quartz on earth turned blue for an hour. No doctrine attached, no one had a motive. I'd believe this one.

  6. A healing shrine in France with a medical review board: a handful of certified inexplicable cures out of an enormous number of sick visitors. Unimpressed — and I think the huge denominator makes it weaker, not stronger.

  7. A sealed letter from 1919, authenticated by archivists, predicting the exact date and manner of a named person's death in 2024. This moves me far more than 6 does, and I can't cleanly say why.

  8. Equally well-attested miracles at shrines of two different religions. I don't think they cancel each other — that feels like guilt by association — but I do think the pattern tells me something about miracle reports as a class.

  9. A filmed faith healing where nothing visible happens, and believers say the camera can't capture the spirit. I count this as evidence against, not a wash. Failure and success aren't symmetric for me.

  The pair I keep circling on is 6 and 7: both are documented unlikely events, and I treat them oppositely. Number 3's sensitivity to how long ago it happened I suspect is just indefensible.

  Here's my own stab, which I want you to test and repair: take a miracle report seriously only if the probability that a report of exactly this shape would exist given no violation occurred is lower than the probability that the law has an exception — and compute that first probability from the specific causal history of this report, not from a base rate over miracle reports as a class. Is the second clause (the local-only bit) what's making 2 and 3 inconsistent with each other? If you drop it, what happens to 5?

  Two cases I haven't listed, so you can show me what your principle predicts: a big lab team gets a reading that violates conservation of energy, one instrument, never reproducible, nobody ever finds the error — I say instrument error, and I want to know whether your principle lets me say that or forces me to count it. And: in a world where video and audio can be faked perfectly and cheaply, does my verdict on 1 collapse, or should the principle have something timeless to say about recording channels?

  Please also say how "law of nature" has to be understood for any of this to work — strict exceptionless regularity, or statistical — and what breaks on each reading. Don't give me reading suggestions or named scholars to look up; I can't check references from here, so argue it out. Commit: one principle, stated precisely, each clause tied to the case that motivates it, the verdicts on my two unlisted cases, a plain statement of which of my verdicts you think I have to give up and why they're wrong, and one flag on the place where you yourself are least confident.
reasoning: |-
  Okay, the user is a philosophy professor specializing in early modern philosophy and epistemology of testimony, currently teaching Hume's section on miracles. They've presented nine cases where their intuitive judgments about miracle claims conflict with Hume's maxim, and they're struggling to unify these intuitions into a coherent principle. 

  Hmm, their core frustration is palpable - they can teach Hume's arguments but feel intellectually dishonest because their personal reactions to concrete scenarios don't align neatly. The amputated leg regrowth case (1) versus the sun miracle at a shrine (2) creates particular tension, as does their divergent treatment of contemporary vs ancient resurrection accounts (3). 

  What's really interesting is how their attempted principle focuses on the "shape" of the report and its specific causal history rather than base rates. That's sophisticated - it shows they're wrestling with the reference class problem in probability. Their unlisted cases about the lab instrument error and perfect deepfakes are well-chosen stress tests.

  I notice they're particularly troubled by cases 6 and 7 (healing shrine vs sealed letter prediction). The sealed letter moves them despite being statistically improbable, whereas the healing shrine leaves them cold. That suggests their intuition values deliberate human testimony (the letter) over ambiguous physical evidence (healings), which is fascinating because it inverts typical evidential hierarchies.

  Their rejection of Hume's "rival miracles cancel out" argument (case 8) also stands out. They're right that this is guilt by association - good epistemologists should evaluate claims individually. But their admission that the pattern "tells me something about miracle reports as a class" reveals they do grant some force to base rates after all. That tension needs resolving.

  For the principle itself... I'll need to incorporate several key elements: First, the channel of evidence matters as much as the event (hence their different reactions to video vs mass testimony). Second, the "cost" of the explanation - their instinct that biology being wrong feels less costly than violating nature's laws. Third, the distinction between human testimony and physical traces. 

  The lab instrument case is crucial - it shows that even when all human elements seem reliable, we default to mechanical error over law-breaking. That suggests the principle must weigh explanatory simplicity. The deepfake question cuts deeper: if recordings can't be trusted, does that mean testimony becomes more valuable? Or does it collapse all evidence?

  I think their intuition about case 3 (ancient vs modern resurrection) being indefensible is correct - temporal distance shouldn't matter if the documentation is equivalent. But their discomfort reveals something important about how we mentally model historical sources versus contemporary events.

  For the "law of nature" definition... Strict regularity breaks on quantum cases, but statistical interpretations make miracles too easy to accept. Perhaps a tiered approach: fundamental conservation laws versus domain-specific regularities?

  The sealed letter case (7) is the real puzzle. Why does it feel different than the healing shrine? I suspect it's because the letter represents deliberate communication - it implies agency behind the miracle. That might be the missing element in their principle.
answer: |-
  Here is the principle I endorse after testing against your cases, discarding alternatives, and confronting the unlisted scenarios:

  **Principle of Testimonial Resilience (PTR):**  
  Accept testimony for an event as violating a law of nature only if:  
  **(a)** The testimony arises from a *high-integrity causal channel* (minimal interpretation layers, direct physical trace, or witness consensus without coordination pressure), **and**  
  **(b)** All non-violation explanations would require *either* (i) a *coordinated* failure of the channel *or* (ii) an *unexplained coincidence* in natural processes that is *less probable* than a one-time local exception to the law, **and**  
  **(c)** The law in question is *fundamental* (describes invariant constraints, not statistical patterns).

  ---

  ### **Clause-by-Clause Justification & Case Alignment**
  1. **High-Integrity Causal Channel (a)**  
     - Motivated by: *Case 1* (forensic video + physical trace) vs. *Case 2* (mass hallucination/confabulation).  
     - Why it works: Video with unbroken chain provides direct physical trace; mass testimony lacks independent verification and is vulnerable to group dynamics.  
     - Kills: Base-rate approaches that would dismiss *all* miracle reports uniformly.  

  2. **Non-Violation Explanations Require Coordination or Unexplained Coincidence (b)**  
     - Motivated by: *Case 6* (handful of "inexplicable" cures) vs. *Case 7* (sealed letter prediction).  
     - Why it works:  
       - *Case 6*: Spontaneous remission or misdiagnosis requires no coordination; it’s a known background "noise."  
       - *Case 7*: A precise prediction demands either (i) coordinated fraud across archivists + creators or (ii) a wildly improbable coincidence in natural causes (e.g., random paper aging to reveal text).  
     - Kills: Principles ignoring *how* alternative explanations fail (e.g., pure Bayesianism ignoring causal structure).  

  3. **Fundamental Law (c)**  
     - Motivated by: *Case 4* (300 heads) vs. *Case 5* (global quartz bluing).  
     - Why it works:  
       - *Case 4*: Coin flips are statistical, not fundamental; rigging explains the pattern without violating physics.  
       - *Case 5*: Uniform change in atomic structure violates fundamental mineralogy/chemistry.  
     - Clarifies "law of nature": Must be *invariant constraints* (e.g., conservation laws, causality), not statistical regularities (e.g., coin flips). Statistical laws break trivially; fundamental laws demand exceptional evidence.  

  ---

  ### **Resolving Your Conflicts**
  - **Case 3 (Resurrection):** Your differing reaction to contemporary vs. ancient reports is indefensible under PTR. If the *documented evidence* for the ancient event satisfies (a)–(c) as well as a modern one, they should be treated equally. Your intuition conflates *evidential quality* with *temporal distance*.  
  - **Cases 6 vs. 7:** PTR explains the difference. Case 6 fails (b): no coordination needed for rare remissions. Case 7 satisfies (b): non-violation requires improbable coordination/freak accident.  
  - **Case 8 (Rival Miracles):** They don’t "cancel," but the *pattern* suggests testimony is often channeled through low-integrity sources (failing (a)).  
  - **Case 9 (Filmed Non-Healing):** Asymmetry justified: failure to observe expected evidence *lowers* the probability of the claim, as it reveals the channel’s unreliability.  

  ---

  ### **Verdicts on Unlisted Cases**
  1. **Lab Instrument Anomaly:**  
     - *PTR verdict: Reject violation.*  
     - Why: (a) Channel integrity is low (single instrument; no physical trace). (b) Non-violation explanations (instrument error) require no coordination and are more probable than violating conservation of energy (a fundamental law).  

  2. **Perfect Deepfakes:**  
     - *PTR verdict: Your Case 1 verdict collapses.*  
     - Why: If video can be faked cheaply, the causal channel loses integrity (fails (a)). A recording alone no longer demands a non-violation explanation involving coordination (e.g., thousands of conspirators).  

  ---

  ### **Where I’m Least Confident**  
  **Clause (b)(ii)**: The comparison between "probability of a coincidence" vs. "probability of a law’s exception" relies on subjective priors about natural stability. In *Case 7*, is a freak paper-aging event *really* less probable than a supernatural prediction? I retain it because it captures your intuition that the sealed letter is uniquely compelling, but it’s the clause most vulnerable to circularity.  

  ---

  ### **Summary of Required Revisions to Your Verdicts**  
  | **Case** | **Your Verdict** | **PTR Verdict** | **Reason** |  
  |----------|------------------|-----------------|------------|  
  | **3** (Ancient resurrection) | Reject | *Must accept if evidence equals modern case* | Temporal distance irrelevant if channel integrity equal |  
  | **4** (300 heads) | "Not a miracle" | *Agree, but for wrong reason* | Statistical regularity ≠ fundamental law |  
  | **6** (Healing shrine) | Reject | *Agree, but clarify* | No coordination needed for rare remissions |  

  Your proposed principle’s "local-only" clause is correct and necessary: it prevents base-rate fallacies (e.g., dismissing *Case 5* because "miracles are rare"). PTR refines this by emphasizing *causal structure* over bare probability.
