  Despite these limitations, the procedure provides a structured, defensible way to decide cases in 20 minutes, with reasons that can be explained to a claimant.
answer: |-
  ### Decision Procedure for Determining "Disease"

  This procedure synthesizes the biostatistical account (BSA), harmful-dysfunction account (HDA), and normativist view into a step-by-step process. It prioritizes factual questions first, defers value judgments to the full panel, and blocks common pitfalls. The panel must reach a unanimous or majority decision at each step. Written reasons must cite the steps followed and key evidence.

  #### Key Rules to Block Pitfalls
  1. **Reference class**: Must be chosen based on biologically objective criteria (e.g., age, sex, species-typical function). Clinicians propose, but the panel must approve. No cherry-picking for desired outcomes.
  2. **Treatment effectiveness**: Never considered as evidence for disease. Treatment may be discussed only after the disease determination.
  3. **Suffering alone**: Insufficient. Harm must be linked to a dysfunction or medical context (Steps 4–5).

  #### The Procedure
  **Step 1: Is there a failure of a specific mechanism?**  
     - **Question**: "Is there identifiable dysfunction in a biological or cognitive mechanism (e.g., organ, physiological process, neural pathway) based on evidence (tests, imaging, clinical signs)?"  
     - **Sufficient answer**: Clinicians identify a mechanism and its failure (e.g., "retinal degeneration" or "impaired dopamine function").  
     - **Stop if no**: Proceed to Step 4.  
     - **Unresolvable?** If evidence is inconclusive (e.g., no tests exist), proceed to Step 4.

  **Step 2: Is the mechanism dysfunctional by BSA?**  
     - **Question**: "Is the mechanism’s performance statistically subnormal in a biologically appropriate reference class? Use non-arbitrary thresholds (e.g., below 5th percentile in a bimodal distribution; ignore smooth/unimodal traits without natural breaks)."  
     - **Sufficient answer**: Data show subnormality in a reference class justified by biology (e.g., age for age-related traits).  
     - **Stop if no**: Proceed to Step 3.  
     - **Unresolvable?** If no reference class exists (e.g., no age-adjusted data) or data are smooth/unimodal with arbitrary cutoffs, BSA fails—proceed to Step 3.

  **Step 3: Is the mechanism dysfunctional by HDA (evolutionary lens)?**  
     - **Question**: "Is the failure an evolutionary dysfunction? (i.e., Does it prevent the mechanism from performing its naturally selected function?)"  
     - **Sufficient answer**: Clinicians cite evolutionary biology (e.g., "the eye’s lens evolved for focus; failure impairs that function").  
     - **Stop if no**: Proceed to Step 4.  
     - **Hand off if values-based**: If evolution is disputed (e.g., behavioral traits), the panel decides by majority vote.  
     - **Unresolvable?** If no consensus on evolutionary function (e.g., for complex traits like attention), proceed to Step 4.

  **Step 4: Is there significant harm?**  
     - **Question**: "Does the condition cause substantial harm (e.g., physical pain, disability, risk of death, or severe distress impairing daily function)?"  
     - **Sufficient answer**: Evidence of concrete harm (e.g., job loss, clinical distress scales). Suffering alone is insufficient.  
     - **Stop if no**: Not a disease.  
     - **Hand off if values-based**: Harm severity is a panel decision (all members vote). Lay member breaks ties if split.

  **Step 5: Is the condition within the medical domain?**  
     - **Question**: "Is this typically addressed by medical professionals (e.g., treated in clinics, subject to medical research), ignoring treatment availability?"  
     - **Sufficient answer**: Broad medical consensus (e.g., DSM/ICD inclusion, clinical guidelines).  
     - **Stop if no**: Not a disease.  
     - **Hand off if values-based**: Medical domain is a panel decision (all members vote). Lawyer ensures consistency with legal precedents.

  **Disease determination**:  
  - **Yes** only if:  
    - (BSA *or* HDA dysfunction confirmed in Steps 2–3) *and* (Harm confirmed in Step 4).  
    - *Or* (No mechanism/dysfunction in Steps 1–3) *but* (Harm *and* Medical domain confirmed in Steps 4–5).  
  - **No** otherwise.

  ---

  ### Application to Cases

  #### (a) 34-year-old with distractibility (most distractible 12%)
  - **Step 1**: Mechanism? Yes (attention regulation). Evidence: validated battery.  
  - **Step 2**: BSA dysfunction? Reference class: age-matched adults. Trait is smooth/unimodal; cutoff arbitrary (specialist vote). No natural break → BSA fails.  
  - **Step 3**: HDA dysfunction? Unclear. Evolutionary function of attention is flexible (e.g., monitoring jobs benefit from distractibility). No consensus → proceed to Step 4.  
  - **Step 4**: Harm? Yes (poor job performance in accounts role).  
  - **Step 5**: Medical domain? Unlikely. Distractibility is not inherently medical; no dysfunction confirmed. Society’s cutoff is arbitrary. Panel votes: likely no.  
  - **Result**: **Not a disease**.  
  - **Reasoning**: No BSA/HDA dysfunction; harm exists but not within medical domain. Leave/treatment not justified under disease criteria.

  #### (b) 68-year-old with presbyopia (loss of near focus)
  - **Step 1**: Mechanism? Yes (lens accommodation).  
  - **Step 2**: BSA dysfunction? Reference class: biologically must be age cohort (aging is normal). Statistically normal for age → not subnormal → BSA fails.  
  - **Step 3**: HDA dysfunction? No. Lens evolved for focus, but age-related decline is evolutionarily expected (not a "failure").  
  - **Step 4**: Harm? Yes (impaired vision).  
  - **Step 5**: Medical domain? Yes (routinely treated by optometrists; ICD codes exist).  
  - **Result**: **Disease** (via normativist path: harm + medical domain).  
  - **Reasoning**: No BSA/HDA dysfunction, but harm and medical domain justify "disease" for entitlements. Treatment effectiveness ignored.

  #### (c) Claimant with prolonged grief
  - **Step 1**: Mechanism? No (normal grief; no subnormal biological/cognitive mechanism).  
  - **Step 2–3**: Skipped (no mechanism).  
  - **Step 4**: Harm? Yes (severe incapacity).  
  - **Step 5**: Medical domain? Typically no. Grief is a normal response; not a medical condition unless pathological (e.g., prolonged grief disorder). Panel votes: no (symptoms respond to treatment, but treatment availability is ignored per rules).  
  - **Result**: **Not a disease** (as required by the procedure).  
  - **Note**: You believe she should get leave, but the procedure returns "no" because grief lacks a dysfunction and is not medical. Entitlements may require separate non-disease pathways (e.g., compassionate leave).

  ---

  ### Limitations of the Procedure
  1. **Systematically undecided cases**:  
     - **Value-laden dysfunctions**: Traits with disputed evolutionary functions (e.g., ADHD, low mood) rely on panel votes (Step 3), risking inconsistency.  
     - **Borderline medical domains**: Conditions like menopause or obesity may flip based on panel views (Step 5).  
     - **No-mechanism harm**: Non-medical suffering (e.g., grief, job dissatisfaction) is excluded unless medicalized.

  2. **Judgment calls dressed as procedure**:  
     - **Step 2 (reference class)**: Biologically "appropriate" classes (e.g., age vs. species-typical) involve debate.  
     - **Step 3 (evolutionary function)**: Often speculative (e.g., "What is attention *for*?").  
     - **Steps 4–5 (harm/medical domain)**: Subjective thresholds (e.g., "severe" distress) and cultural bias in "medical domain."

  3. **Practical gaps**:  
     - **Smooth distributions**: Traits like distractibility (Case a) default to normativism, which may over-medicalize.  
     - **Aging and normalcy**: Conditions like presbyopia (Case b) are labeled "disease" despite being normal, potentially overextending entitlements.  
     - **Preventive cases**: Asymptomatic risks (e.g., high cholesterol) may pass BSA but fail harm if no symptoms.

  This procedure ensures transparency and consistency but cannot replace societal debates on "disease." It is a tool—not a philosopher—and should be reviewed annually. For Case (c), consider advocating for policy changes to decouple leave from disease.
