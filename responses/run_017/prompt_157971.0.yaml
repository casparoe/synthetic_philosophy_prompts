prompt: |-
  So there's this guy in my city who hosts the local LessWrong-adjacent meetup — let's call him Doug — and for about a year now I've been quietly keeping a list of his verdicts on every decision-theory puzzle I can throw at him, because I genuinely can't reverse-engineer what he's running. He's read the Sequences more than once, rolls his eyes at causal decision theory, and talks about Hofstadter-style superrationality, but half the time he sounds like a straight evidential decision theorist and half the time he sounds like he's doing something closer to timeless/FDT-style reasoning, and he won't say which. His track record so far: one-shot prisoner's dilemma against an exact psychological duplicate of himself, no communication, both know the setup — cooperate; same, except the duplicate has been told it's "the copy" and he's "the original" — still cooperate; same, except the duplicate's last week of memories were overwritten with noise — cooperate, and he said the difference doesn't matter; same, except the duplicate's payoffs are 10% larger than his — cooperate; Newcomb's problem where the predictor is explicitly described as running a full simulation of him — one box; Newcomb where the predictor is a black box that's been right 99 times out of 100 and definately does not simulate him — he refused to commit and said he really doesn't know; a hitchhiker-type case where the driver reads faces and has never been wrong — pay; PD against a randomly picked stranger with no correlation whatsoever — defect; and voting in a national election — he votes, and says it's the same principle as the duplicate cases. The only time I got anything like a slogan out of him, he said the thing that matters is whether his deciding and the other guy's deciding are the same event happening in two places, and he got visibly annoyed when I said that sounds like plain evidential decision theory.

  The case I want to spring on him at the next meetup is one where I think similarity, correlation, and simulation all come apart. Two agents, built independently by teams on opposite sides of the world, who have never been in contact, who are not psychologically similar in any interesting way, neither of whom simulates or predicts the other, and neither of whom causally influences the other — but there's a fact about the universe's initial conditions (work with me here; stipulate something superrdeterministic if you need a mechanism) that guarantees any two agents facing structurally identical decision problems make the same choice. So his cooperating and the other agent's cooperating are perfectly correlated, and that correlation is the only thing linking them: no shared algorithm, no shared reasoning, no causal arrow either way. I want to know whether Doug cooperates or defects, what rule he's implicitly running, and — this is the part I actually care about — what other rules fit his whole track record just as well and what each of them predicts here, since I don't think his verdicts so far pin anything down. My own candidate for a follow-up case that might separate the surviving rules is a PD against an agent running completely different code that is provably extensionally equivalent to his, same input-output function, different implementation; I can't tell whether that actually separates a "is it like me" rule from a "does its output depend on my algorithm's output" rule, or whether it collapses back into the same answer. Also tell me whether your prediction flips if the correlation in the new case is 90% instead of certain, because I suspect that's where the rules really diverge. Please answer in American English, and spare me the "here's what's actually rational" lecture — I want the read on Doug, not the object-level truth.
reasoning: |-
  Okay, let me try to figure out what's going on with Doug. The user has given a bunch of puzzle responses and wants to know what decision rule Doug is using. The key is that Doug seems to switch between evidential and functional decision theory depending on the case. 

  First, looking at Doug's track record: He cooperates with exact duplicates, even with minor differences like labels or slightly different payoffs. But he defects against a random stranger in PD. In Newcomb's with simulation, he one-boxes, but with a black box predictor, he's unsure. He pays in the hitchhiker case and votes in elections.

  The user's new scenario has perfect correlation without any similarity or simulation. Two independently built agents, no shared code, but universe forces same choice. The question is whether Doug cooperates here.

  Hmm... Doug's slogan about "same event in two places" might be key. He got annoyed when called EDT, so it's probably not pure evidential. Maybe he's using a criterion like "are the decisions outputs of the same abstract decision process?" 

  In the duplicate cases, even with memory noise or payoff differences, he still sees it as the same process. But random stranger isn't. For Newcomb simulation, it's same process; black box isn't. Voting fits as seeing all voters as part of same collective decision event.

  In the new scenario, there's no shared algorithm, just brute-force correlation. Doug would likely defect here because the other agent isn't running "his" decision process - it's a different implementation forced to same output. 

  But the user also asks about 90% correlation. That might make Doug defect but feel conflicted, since it's not certain. The follow-up with extensionally equivalent agents: same I/O but different code. Doug probably still cooperates because the abstract decision function is identical, even if implementation differs. That's closer to his duplicate cases.

  So possible rules: 
  1) "Same abstract algorithm" - cooperates in extensionally equivalent case, defects in brute correlation case.
  2) Pure correlation (EDT) - cooperates in both, but Doug rejects EDT.
  3) "Could I be controlling it?" - but he cooperates with different-payoff duplicates, so probably not.

  His voting rationale suggests he cares about being part of a collective where outputs are linked by decision-relevance, not just correlation. Brute correlation lacks that.

  For surviving rules: 
  - FDT would cooperate in brute correlation if it's acausal control, but Doug likely won't because no shared algorithm. 
  - Closest might be "algorithmic identity" or "same computation".

  Predicting Doug defects in brute correlation (even 100%), cooperates in extensional equivalence. At 90% correlation, probably still defects but less confidently. The extensional case separates from brute correlation for him.
answer: |-
  Based on Doug's pattern of verdicts and his stated intuition about "the same event happening in two places," here's the breakdown for your new case and the follow-ups, avoiding object-level rationalization and focusing solely on reverse-engineering his behavior:

  ### 1. **Your New Case (Perfect Correlation, No Similarity/Simulation)**
     - **Doug's Likely Verdict:** **Defect**  
       *Why?* Doug consistently cooperates only when there's *shared decision-relevance*—like duplicates, simulations, or collective actions (voting). Here, the correlation is brute-force ("stipulated superdeterminism"), with no shared algorithm, reasoning, or causal link. His slogan implies he cares whether the decisions are *meaningfully the same computation* (e.g., "Is my brain running the same process as theirs?"). Brute correlation alone doesn't trigger his cooperation instinct—it lacks the "same event" quality he values.  
     - **90% Correlation Variant:** He **defects more emphatically**. His track record shows he dismisses uncertainty when the link isn't decision-relevant (e.g., the noisy-memories duplicate didn't matter). He’ll see 90% as weaker evidence of a non-decision-relevant fluke, not stronger reason to cooperate.

  ### 2. **What Rule Is Doug Running?**  
     He’s best described as running **"Algorithmic Identity FDT"** with a pragmatically narrow scope:  
     - Cooperates if the other agent’s decision is **outputs of the same abstract algorithm** (duplicates, extensional equivalents, simulations *of him*).  
     - Defects if the link is statistical (black-box predictors, random strangers) or lacks algorithmic kinship (your brute-correlation case).  
     His "same event" phrasing rejects *evidential* DT (which would cooperate in brute correlation) but isn’t full *timeless* FDT (which might treat brute correlation as acausal control). He’s closer to **FDT-lite**: cooperative only when he recognizes "himself" in the other agent’s decision process.

  ### 3. **Other Rules Fitting His Track Record (and Their Predictions Here)**  
     Three distinct rules explain *all* prior verdicts equally well—but diverge in your new case:  
     - **Rule A: "Is it running my code?" (Doug's likely rule)**  
       *Cooperation requires same algorithm/decision-process.*  
       → **Brute correlation (100% or 90%): DEFECT** (different "code").  
       → *Fits:* Cooperates with duplicates/extensional-equivalents (same code), defects with strangers (different code). Newcomb simulation is "running his code"; black-box isn’t. Voting is mass same-code execution.  
     - **Rule B: "Could my choice control theirs acausally?" (Pure FDT)**  
       *Cooperates if outputs are logically entangled, even without similarity.*  
       → **Brute correlation (100%): COOPERATE** (entangled via initial conditions).  
       → **90%: DEFECT** (no logical guarantee).  
       → *Fits:* Same as Rule A except predicts cooperate here. But Doug’s stranger-PD defect and voting rationale ("same principle as duplicates") suggest he requires *similarity*, not just entanglement.  
     - **Rule C: "Is it sufficiently like me?" (Similarity EDT)**  
       *Cooperates if high subjective similarity, even without simulation.*  
       → **Brute correlation (100% or 90%): DEFECT** (no psychological similarity).  
       → *Fits:* Cooperates with duplicates (similar), defects with strangers (dissimilar). Rejects brute correlation as "not similar."  
       *Why Rule C ≠ Doug?* He cooperates with a duplicate whose payoffs are 10% larger—similarity EDT should defect here (different incentives), but Doug doesn’t. Rule A handles this via same code.  

     **Survivors:** Rules A and C fit *all* prior data. Rule B fails the stranger-PD test (Doug defects despite no acausal control). Your new case **separates A/C from B**, but only the follow-up case splits A and C.

  ### 4. **Follow-Up Case (PD vs. Extensional Equivalent, Different Code)**  
     - **Doug’s Likely Verdict:** **Cooperate**  
       Same I/O function means it *is* "running his code" abstractly (Rule A). He’ll treat it like his duplicate cases—different implementation is irrelevant if the decision-process is functionally identical. His verdicts ignore noise/memories/payoffs if the "core algorithm" is shared.  
     - **Rule A Prediction:** Cooperate (same abstract algorithm).  
     - **Rule C Prediction:** **Defect** (not psychologically similar; different "implementation" feels like a different agent).  
     - **Separation Power:** This *does* split "same algorithm" (A) from "similarity" (C). If Doug cooperates, he’s running Rule A. If he defects, he’s running Rule C. Given his disregard for memory-noise/payoffs in duplicates, bet on **cooperate**.

  ### Summary of Predictions for Doug
  | Case                                | Doug’s Likely Verdict | Why                                                                 |
  |-------------------------------------|------------------------|---------------------------------------------------------------------|
  | **Brute Correlation (100%)**        | Defect                 | "Not the same event—just cosmic fluke."                            |
  | **Brute Correlation (90%)**         | Defect (stronger)      | "Even less reason to trust it."                                    |
  | **Extensional Equivalent**          | Cooperate              | "Same decision function = same event in two places."               |

  ### Key Insight on Doug
  He’s not an evidentialist (rejects brute correlation), not a utilitarian (ignores payoff differences), and not full FDT (dismisses acausal control without similarity). His core heuristic: **"Cooperate iff the other agent is *deterministically* executing the same decision algorithm as me, such that our outputs are linked by shared computation, not just correlation."** National voting fits because he sees citizens as running the same "voting algorithm" in a shared context. Spring the brute-correlation case first—if he defects, hit him with the extensional-equivalent case to confirm Rule A.
