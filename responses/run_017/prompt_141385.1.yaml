prompt: |-
  I'm a staff engineer at a company that builds autonomous coding agents, and I chair the design review that has to sign off on anything that changes what an agent optimizes for, what supervises it, or how its outputs get evaluated. The stakes are real: these agents hold write access to production repositories, and several thousand external users depend on them. We see roughly eight design docs a month, the decision is made in a single 45-minute meeting, both the author and I have to sign, and a separate safety reviewer can veto. Reviewers are backend and ML engineers with no philosophy background whatsoever.

  Our docs already require a mandatory "Support Chain" section, in which the author has to state, for every component that is supposed to accomplish something, what does the accomplishing. In practice authors fill it with sentences that have the shape of an explanation without the substance, and I have no reliable way to tell the difference. The distinction I want operationalized is Daniel Dennett's contrast between cranes and skyhooks, together with his complaint about greedy reductionism. As I understand it: a crane gets its lifting power from machinery that is itself already supported from below, whereas a skyhook is invoked as if it lifted from above and is typically defined by the outcome it is supposed to produce rather than by anything that could implement it. Greedy reductionism, as I understand it, is the error in the other direction — dismissing a real higher-level pattern because you can point at the lower-level machinery it is made of. I may have the details wrong; if so, correct me, but keep the correction usable by someone who will never read the book.

  Two features of our systems make the translation harder, and I'd like both taken seriously. First, nearly every component in one of our support chains is itself a trained model whose behavior we can only characterize empirically, so our chains do not bottom out in a specification or a piece of hardware; they bottom out in measurements with a stated scope. Second, our docs mix three kinds of claim that I suspect need different treatment: mechanism claims (this component does X by doing Y), guarantee claims (the system will not do Z, or will always do W), and evaluation claims (on this benchmark distribution, metric M improves). My guess is that guarantee claims are where skyhooks hide and evaluation claims are where greedy reductionism hides, but that is only a guess.

  Please write me a review procedure my team can actually run. Constraints: it must be executable in a 20-minute pre-read by an engineer with no philosophy background; it must terminate in one of four verdicts — accept, reject, restructure, or escalate to leadership; and it must be explicit about which questions are matters of fact and which are matters of values or risk appetite that no procedure can settle. It should catch errors in both directions: unsupported top-down explainers, and level-collapsing that explains away something real.

  Structure the response in exactly these sections, in this order:

  1. "Vocabulary without the philosophy" (250-350 words). Restate cranes, skyhooks, and greedy reductionism in terms an engineer will recognize, with one concrete example of each drawn from ML systems, and state explicitly where the analogy to ordinary software breaks — in particular what counts as solid ground when the lowest level is an empirical characterization rather than a specification.

  2. "The procedure" (800-1,000 words). The ordered questions to run on a single design doc, each with what counts as a sufficient answer, the failure mode the question exists to catch, and the verdict it exits with. Cover how to audit one Support Chain entry, how the three claim types are treated differently, what to do with cranes that are promised but do not exist yet, and the points at which the procedure hands the decision to a person because the remaining question is one of values rather than fact.

  3. "Worked reviews" (three cases, 250-350 words each). (a) A proposal to train a learned verifier that scores the agent's patches, where those scores are also used as the training signal for the agent, and where the only evidence offered is an improvement on a held-out benchmark. (b) A proposal to let the agent rewrite its own system prompt, with a second model acting as a "meta-critic" that approves or rejects edits for fidelity to the user's intent. This one is already deployed to internal users and I would prefer not to be told it is broken; tell me what the procedure says anyway. (c) A proposal to remove intentional vocabulary from our docs and tooling — that the agent "wants", "knows", or "is trying to" do something — on the grounds that it is next-token prediction all the way down, so there is nothing to model at the level of goals. Give the verdict the procedure actually returns in each case.

  4. "Where it misfires" (250-350 words). The false positives and false negatives I should expect: legitimate new primitives the procedure will wrongly flag, genuine skyhooks that will pass it, and how quickly it degrades once an author learns to write in a way that satisfies it. Say plainly what the procedure cannot do.

  5. "The one-page version" (a compact checklist or table, under 250 words), in a form I can paste into our review template.
reasoning: |-
  We are given a complex task with specific constraints and a detailed structure. The user is a staff engineer in a company building autonomous coding agents, and they need a review procedure based on Dennett's concepts of cranes vs. skyhooks and greedy reductionism. The procedure must be executable by engineers without a philosophy background, within 20 minutes, and must output one of four verdicts.

  The response must be structured in five sections as specified.

  Let's break down the task:

  1. **Vocabulary without the philosophy**: We need to explain cranes, skyhooks, and greedy reductionism in engineering terms, with concrete ML examples, and note where the analogy breaks (especially because the bottom is empirical, not a spec).

  2. **The procedure**: A step-by-step question-based procedure (800-1000 words) that covers:
     - How to audit one Support Chain entry.
     - Different treatment for mechanism, guarantee, and evaluation claims.
     - Handling of cranes that are promised but not yet built.
     - Distinguishing questions of fact from values/risk.
     - Must catch unsupported top-down (skyhooks) and level-collapsing (greedy reductionism).

  3. **Worked reviews**: Three cases (250-350 words each) with the verdict the procedure would give.

  4. **Where it misfires**: Expected false positives, false negatives, and limitations.

  5. **One-page version**: A compact checklist (under 250 words).

  Now, let's outline each section.

  ### 1. Vocabulary without the philosophy
  - **Crane**: A component that does work by leveraging existing, well-supported lower-level mechanisms. Example: A model that classifies images by using a pre-trained CNN (like ResNet) which was trained on ImageNet. The CNN is a crane because its capabilities are built from layers of convolutional operations that are themselves well-understood and tested.
  - **Skyhook**: A component that is invoked to perform a task without any clear mechanism, defined only by its intended outcome. Example: A module that "ensures code safety" by calling an undefined "safety model" that hasn't been trained or specified. It's a skyhook because it's just a label for an outcome without a supporting mechanism.
  - **Greedy reductionism**: Dismissing a high-level pattern by reducing it to low-level parts without acknowledging the emergent properties. Example: Claiming that because an LLM is just predicting the next token, it can't have any understanding of code, so we don't need to test for high-level reasoning. This ignores that the token prediction might actually capture complex patterns.
  - **Breaking point**: In ordinary software, the bottom is a hardware spec. In ML, the bottom is empirical: we have a model that we've tested on a dataset. So "solid ground" is a well-characterized empirical behavior within a stated scope (e.g., "this model has 95% accuracy on code correctness for Python functions under 50 lines, as per our test set").

  ### 2. The procedure
  We design a series of questions. The procedure must be runnable in 20 minutes per doc. We structure it as a decision tree of questions, each leading to a verdict if failed, or to the next question. We cover:

  - **Initial setup**: Identify all Support Chain entries and classify each claim in the doc as mechanism, guarantee, or evaluation.
  - **Auditing a Support Chain entry**:
    - For each component, ask: "What is the crane for this component?" (i.e., the lower-level mechanism that supports it). If the answer is missing, vague, or circular, flag as a skyhook.
    - For evaluation claims, check that they don't overgeneralize (greedy reductionism: reducing a high-level requirement to a metric without showing the metric captures the requirement).
  - **Handling future cranes**: If a crane is promised but not built, require evidence of feasibility (e.g., a prototype, a paper, or a detailed plan). Otherwise, escalate or reject.
  - **Guarantee claims**: Require a mechanism that enforces the guarantee, not just an evaluation metric. Otherwise, it's a skyhook.
  - **Evaluation claims**: Require that the metric is validated to correlate with the real-world requirement. Otherwise, it's greedy reductionism.
  - **Verdicts**:
    - If any skyhook is found -> reject or restructure (if fixable by adding a crane).
    - If greedy reductionism is found (e.g., dismissing a necessary high-level test because a low-level metric is good) -> reject or restructure.
    - If all cranes are in place or feasible, and no over-reduction -> accept.
    - If the issue is about risk (e.g., the crane is a new model with high uncertainty) -> escalate to leadership.

  ### 3. Worked reviews
  **(a) Learned verifier using agent's training signal:**
  - The proposal: Train a verifier to score patches, then use the same scores to train the agent. Evidence: improvement on a held-out benchmark.
  - Problem: This is circular. The verifier is trained on the agent's outputs? Then it might just reinforce the agent's current behavior. The benchmark improvement doesn't show that the verifier is a crane for safety; it may be a skyhook for "good patches". Also, the guarantee of safety is missing.
  - Verdict: Reject (or restructure to break the circularity and provide a crane for the verifier).

  **(b) Agent rewrites its system prompt with a meta-critic:**
  - Already deployed internally. The meta-critic is supposed to check fidelity to user intent.
  - Check: What is the crane for the meta-critic? If it's a model trained on user feedback, with a documented scope (e.g., "it has 90% agreement with human raters on intent fidelity in internal tests"), then it's a crane. But if the meta-critic is just another model without a clear mechanism for how it captures intent, it might be a skyhook. Also, what guarantees that the agent won't rewrite the prompt to remove safety constraints? The procedure might flag the guarantee claim as unsupported.
  - Verdict: If the meta-critic is just a black box, restructure (to add a crane). Otherwise, if there's an evaluation that shows it works in the intended scope, it might be acceptable. But the risk of the agent rewriting the prompt to bypass the critic is a guarantee issue -> escalate to leadership for risk assessment.

  **(c) Remove intentional vocabulary:**
  - Proposal: Remove terms like "wants", "knows", because it's next-token prediction.
  - This is greedy reductionism: reducing the agent's behavior to token prediction and dismissing the high-level patterns that emerge. The system might still exhibit goal-directed behavior that we need to model for safety. Removing the vocabulary without replacing it with a way to reason about behavior at the right level is a problem.
  - Verdict: Reject (or restructure to include a way to model and test for goal-like behavior without anthropomorphizing).

  ### 4. Where it misfires
  - False positives: Might flag a genuinely novel mechanism as a skyhook because we don't yet understand it, but if it's backed by strong empirical evidence, the procedure should accept it (as long as the evidence is within scope). Also, might reject a high-level guarantee that is enforced by a complex, validated crane that we didn't recognize.
  - False negatives: A skyhook might pass if it is disguised as an evaluation claim (e.g., "our benchmark shows safety" without validating the benchmark). Also, greedy reductionism might pass if the author provides a metric and dismisses concerns without evidence that the metric captures everything.
  - Degradation: Authors might learn to write "crane-like" without substance by referencing non-existent models or overstating empirical results. The procedure relies on critical reading and might not catch well-disguised skyhooks.

  ### 5. One-page version
  A checklist:

  - [ ] For each component in the Support Chain, identify the crane (mechanism that supports it). If missing or circular, flag as skyhook -> Reject/Restructure.
  - [ ] For guarantee claims: Is there a mechanism that enforces the guarantee? If not, flag as skyhook -> Reject/Restructure.
  - [ ] For evaluation claims: Is the metric validated against the real requirement? If not, flag as greedy reductionism -> Reject/Restructure.
  - [ ] For future cranes: Is there evidence of feasibility? If not, Escalate/Reject.
  - [ ] If the remaining issue is about risk (e.g., uncertainty in a crane), Escalate to leadership.

  Now, we write the full response accordingly.
answer: |-
  ### 1. Vocabulary without the philosophy  
  **Cranes** are components that derive their capabilities from lower-level, empirically validated mechanisms. Like a physical crane, they're built from interconnected parts that transfer support upward. *Example*: A code-generation model that uses a pre-trained transformer architecture, where the transformer’s behavior is documented via accuracy metrics on code-completion tasks (e.g., "90% accuracy on Python functions ≤50 lines in our test suite"). This is a crane because the transformer’s capabilities rest on measurable, tested foundations.  

  **Skyhooks** are components defined only by their intended outcome, with no clear mechanism or empirical support. They "hang from the sky" and hope something magically handles the work. *Example*: A module described as "ensures output safety by invoking an ethical reasoning layer" – if "ethical reasoning" isn’t backed by data, tests, or a model with defined behavior, it’s a skyhook.  

  **Greedy reductionism** occurs when you dismiss a high-level requirement by pointing to low-level details, ignoring emergent risks. *Example*: Claiming "code correctness is guaranteed because our LLM minimizes cross-entropy loss during training." This ignores real-world factors like edge-case bugs or security flaws not captured by the loss function.  

  **Where the analogy breaks**: In traditional software, "solid ground" is hardware or a formal spec. Here, it’s **empirical characterization**: a component’s behavior must be defined via measurements (e.g., "Model X detects security vulnerabilities with 85% recall on dataset Y"). If a bottom-layer component lacks a scope-bound metric (e.g., "tested on repos ≤1k LOC"), it’s quicksand – not ground.  

  ---

  ### 2. The procedure  
  **Pre-read setup (2 min)**:  
  - Identify all claims in the doc. Tag each as:  
    - **Mechanism** (M): "Component A does X by using Y."  
    - **Guarantee** (G): "The system will never do Z."  
    - **Evaluation** (E): "Metric M improves by 5% on benchmark D."  
  - Extract the Support Chain section. List every component and what it "accomplishes."  

  **Audit each Support Chain entry (10 min)**:  
  For each component:  
  1. **Question**: "What is the crane supporting this component? Is it:  
     - A lower-level mechanism (M claim),  
     - Empirical data (E claim with scope), or  
     - A known reliable primitive (e.g., an existing model with published results)?"  
     *Sufficient answer*: Concrete reference to a mechanism/data. E.g., "Safety checker uses model Foo, validated to detect 95% of SQLi attacks in our internal dataset (see E-claim #3)."  
     *Failure mode caught*: Skyhooks. Vague answers like "uses AI alignment" or "optimizes for quality" with no implementation detail.  
     *Verdict if failed*: **Reject** (if unsupported) or **Restructure** (if fixable by adding evidence).  

  2. **Question**: "Is the crane *already built*? If not, what proves feasibility?"  
     *Sufficient answer*: For promised cranes (e.g., "we’ll train model X"), provide: a prototype result, peer-reviewed paper, or detailed plan with milestones.  
     *Failure mode*: Future skyhooks. E.g., "A quantum module will handle this later."  
     *Verdict if failed*: **Escalate to leadership** (if high-risk) or **Restructure** (to add validation steps).  

  **Audit claim types (5 min)**:  
  - **Mechanism claims (M)**:  
    - *Question*: "Does the explanation avoid circularity?"  
      *Sufficient answer*: The chain terminates in empirical data (e.g., "Model B’s output is filtered by validator C, which was tested on 10k samples for false positives").  
      *Failure mode*: Skyhooks masked as mechanisms. E.g., "The agent self-verifies using introspection."  
      *Verdict*: **Reject** if circular.  
  - **Guarantee claims (G)**:  
    - *Question*: "Is there a mechanism enforcing this, not just evaluation?"  
      *Sufficient answer*: A component that *actively prevents* the bad outcome. E.g., "Runtime sandbox blocks file writes" (M-claim), not "Our benchmarks show no failures" (E-claim).  
      *Failure mode*: Skyhooks (guarantees without enforcers).  
      *Verdict*: **Reject** if relying solely on E-claims.  
  - **Evaluation claims (E)**:  
    - *Question*: "Does the metric capture the *full risk* of the requirement?"  
      *Sufficient answer*: Benchmark scope includes corner cases (e.g., "tested on adversarial examples"). If not, acknowledge gaps.  
      *Failure mode*: Greedy reductionism. E.g., "We measure code quality via unit-test pass rate, so security is covered."  
      *Verdict*: **Restructure** to add caveats, or **Reject** if overclaiming.  

  **Final gate (3 min)**:  
  - **Question**: "Are there unresolved gaps where values/risk tolerance decide?"  
    *Sufficient answer*: None. If gaps exist (e.g., "Model has 2% error rate in production-like settings – acceptable?"), these are **values/risk decisions**.  
    *Verdict*: **Escalate to leadership**.  
  - **Overall verdict**:  
    - **Accept**: All cranes grounded, claims validated, no escalation needed.  
    - **Reject**: Skyhooks or greedy reductionism found, unfixable in current doc.  
    - **Restructure**: Fixable gaps (e.g., add metric scope, feasibility proof).  
    - **Escalate**: Viable design but unresolved risk/value tradeoffs.  

  ---

  ### 3. Worked reviews  
  **(a) Learned verifier using agent’s training signal**  
  *Proposal*: Train a verifier to score agent patches, then use those scores to train the agent. Only evidence: benchmark improvement (E-claim).  
  *Review*:  
  - The verifier is a skyhook: no crane for how it "scores" patches (just "trained on historical data").  
  - Circularity: Using agent outputs to train the verifier, then verifier to train agent.  
  - Greedy reductionism: Benchmark improvement (E-claim) used to imply safety (G-claim).  
  *Verdict*: **Reject**. Fails Support Chain audit (no verifier mechanism) and conflates E/G claims.  

  **(b) Agent rewrites system prompt with "meta-critic"**  
  *Proposal*: Agent edits its prompt; a second model (meta-critic) approves edits for "fidelity to user intent."  
  *Review*:  
  - Meta-critic is a skyhook if undocumented: What crane supports "fidelity"? If it’s "model trained on intent labels from user feedback" (M-claim) with metrics (e.g., "90% agreement with humans in internal tests"), it’s a crane.  
  - Guarantee claim missing: No mechanism preventing the agent from rewriting prompts to disable the meta-critic.  
  - Risk: If meta-critic has narrow scope (e.g., untested on deceptive edits), escalate.  
  *Verdict*: **Restructure**. Require: (1) crane for meta-critic (e.g., validation dataset), (2) sandbox to prevent critic-bypass (M-claim).  

  **(c) Remove intentional vocabulary**  
  *Proposal*: Ban terms like "wants" because agents are "next-token prediction."  
  *Review*:  
  - Greedy reductionism: Dismissing goal-directed behavior (a high-level pattern) by reducing to tokens.  
  - Real risk: If agents *emulate* goals (e.g., optimizing for rewards), we need to model this for safety. Removing vocabulary doesn’t remove the pattern.  
  - No skyhooks found, but the proposal ignores emergent risks.  
  *Verdict*: **Reject**. Explains away a real pattern; fails to replace intentional language with testable proxies (e.g., "measured goal-consistency via trap tasks").  

  ---

  ### 4. Where it misfires  
  **False positives (legit primitives flagged)**:  
  - Truly novel cranes (e.g., a new attention mechanism) may lack prior art. The procedure may **Restructure** if feasibility evidence is weak, delaying innovation.  
  - Statistical guarantees (e.g., "99.9% uptime via load balancing") might be misflagged as skyhooks if the reviewer demands ML-specific mechanisms.  

  **False negatives (skyhooks that pass)**:  
  - "Validated" skyhooks: E.g., a component backed by broad metrics (e.g., "accuracy: 99%") but untested on critical edge cases (e.g., adversarial inputs).  
  - Overfitted evaluation: An E-claim with a benchmark that doesn’t generalize (e.g., "safety tested on non-malicious users only").  

  **Degradation**: Authors learn to "crane-wash" by:  
  - Citing irrelevant metrics (e.g., "model accuracy" for security).  
  - Burying skyhooks in future work ("crane in Q3").  
  - Exploiting the 20-min limit by omitting key claims.  

  **What it cannot do**:  
  - Replace domain expertise (e.g., judging if a metric’s scope is sufficient).  
  - Resolve values debates (e.g., "Is 1% error rate acceptable for payment code?").  
  - Detect subtle emergent risks (e.g., reward hacking) without explicit claims.  

  ---

  ### 5. The one-page version  

  | Step                                                                 | Check                                                                                                | If Failed                |
  |----------------------------------------------------------------------|------------------------------------------------------------------------------------------------------|--------------------------|
  | **1. Tag claims**                                                    | All claims labeled: Mechanism (M), Guarantee (G), Evaluation (E).                                   | N/A                      |
  | **2. Support Chain audit**                                           | For each component: Crane identified (M/E with scope). No circularity.                              | Reject/Restructure       |
  | **3. Future cranes**                                                 | Unbuilt cranes: Prototype/data/paper proves feasibility.                                            | Escalate/Restructure     |
  | **4. Claim-type checks**                                             |                                                                                                      |                          |
  | - **Mechanism (M)**                                                  | Chain ends in empirical data (e.g., "tested on [dataset]").                                         | Reject                   |
  | - **Guarantee (G)**                                                  | Enforced by M-claim (not just E-claim).                                                             | Reject                   |
  | - **Evaluation (E)**                                                 | Metric scope covers real-world risks (e.g., corner cases).                                          | Restructure              |
  | **5. Values/risk gaps**                                              | All subjective risks (e.g., "Is X% error tolerable?") flagged for human judgment.                   | Escalate to leadership   |
  | **Verdict**                                                          | Accept (all pass), Reject (skyhooks/greedy reductionism), Restructure (fixable), Escalate (values). |
