  We are constructing a scenario that meets the following criteria:
   1. It involves a decision by a local institution (hospital, city council, school board).
   2. The precautionary principle forbids an action that straightforward expected-utility maximization recommends.
   3. Probabilities are known and agreed upon (no ambiguity or Knightian uncertainty).
   4. No outcome is catastrophic or irreversible.
   5. Utility is linear in money and health.
   6. The same population bears the risk either way (no distributional issues).
   7. The disagreement must not come from risk aversion, ambiguity aversion, or maximin reasoning.
   8. The key difference must come from features like burden of proof, trigger condition, act/omission asymmetry, or who counts as the proponent.
   9. Applying the precautionary principle symmetrically (i.e., to inaction) does not simply reverse the verdict (avoid the paradox).
  10. We must not smuggle in ambiguity, catastrophic outcomes, or other excluded factors.

  Scenario:

  The city council of Greenfield is considering installing a new type of LED streetlight, Model X, which uses a novel spectrum of light that has been shown in some studies to slightly improve nighttime driving safety by enhancing contrast. The current streetlights are standard sodium-vapor lamps. The new lights cost $100,000 to install and would save an expected $110,000 in reduced accident costs over their 10-year lifespan (net gain of $10,000). However, there is a known and agreed-upon risk: the new lights emit a very low level of UV-A radiation (well below the level that causes sunburn, but above zero). Laboratory studies on cell cultures have shown that this specific level of UV-A can cause a very small increase in DNA damage in skin cells, but there is no evidence that this leads to any increase in skin cancer in living organisms. In fact, the best available epidemiological models, based on known mechanisms and existing data, predict that the additional UV-A exposure from these streetlights would cause, at most, one additional case of skin cancer in the entire city of 100,000 people over 50 years (with a probability of 0.5 of causing one case and 0.5 of causing none). The cost of treating one case of skin cancer is estimated at $200,000 (including both monetary costs and health disutility converted to monetary terms, with utility linear in health and money). Therefore, the expected cost of the health risk is (0.5 * $200,000) + (0.5 * $0) = $100,000. 

  The expected net benefit of installing the new lights, then, is:
    - Financial savings: $110,000
    - Expected health cost: $100,000
    - Installation cost: $100,000
    Net: $110,000 - $100,000 - $100,000 = -$90,000.

  But wait, this calculation is incorrect because the health cost is an expected cost and the savings are also expected. Let me correct:

  Total expected benefit: $110,000 (savings from accidents)
  Total expected cost: $100,000 (installation) + $100,000 (expected health cost) = $200,000
  Net: $110,000 - $200,000 = -$90,000.

  This would suggest the project is bad. But that doesn't meet our requirement because we want expected utility maximization to recommend the action. Let me adjust the numbers to fix this.

  Revised numbers:

  Let the accident savings be $210,000 (so that without the health risk it would be clearly positive: $210,000 - $100,000 = $110,000). Then, the expected health cost remains $100,000. Then the net expected benefit is:
    $210,000 (savings) - $100,000 (installation) - $100,000 (health) = $10,000.

  So expected utility maximization would recommend the action because it has positive expected net benefit of $10,000.

  But note: the health risk is a risk of a negative health event (skin cancer) that we have monetized. We have assumed linear utility in both money and health, and we have converted the health impact to money. So we are comparing:

  Option 1: Install new lights 
    - Cost: $100,000 (installation) 
    - Benefit: $210,000 (reduced accident costs) 
    - Expected health cost: $100,000 (which is the expected cost of the skin cancer risk)

  Net: $210,000 - $100,000 - $100,000 = $10,000

  Option 2: Do nothing (stick with old lights)
    - No installation cost, no savings, no additional health risk.
    Net: $0

  Therefore, expected utility maximization (which in this case is equivalent to expected monetary value) would choose to install the lights.

  However, the precautionary principle might forbid this action. Why? Because the action (installing the new lights) introduces a new risk (the UV-A exposure) that was not present before. Even though the expected cost of that risk is known and accounted for, the precautionary principle might require that the proponent of the action (the city council, or the company selling the lights) prove that the new risk is "safe enough" or that there is no possibility of harm beyond what has been accounted for. But note we have no catastrophic risk and no irreversibility. The key is to use the burden of proof and the trigger condition.

  The precautionary principle, as typically formulated, is triggered when an action has a plausible risk of harm, even if the probabilities are low and the harm is not catastrophic. In this case, there is a known risk (albeit small and with known probability) and the harm (one case of skin cancer) is not catastrophic. But the principle might place the burden of proof on the proponent to show that the action will not cause harm. However, in this scenario, the proponent cannot prove that the harm will not occur because we know there is a 50% chance of one case of cancer. Therefore, the precautionary principle would forbid the action.

  But note: the trigger condition is the possibility of harm. The principle does not require that we take precaution against inaction? In this case, inaction (keeping the old lights) also has risks: the higher accident rate. However, the precautionary principle is often applied asymmetrically to new interventions. The existing situation (old lights) is the baseline, and the new action (installing the new lights) introduces a new risk. Therefore, the principle might be triggered only for the new risk and not for the baseline risks.

  Moreover, the burden of proof is on the proponent of the new action to show that it is safe. They have not shown that it is safe (because we know it isn't perfectly safe) and they cannot rule out the harm. Therefore, the precautionary principle forbids the action.

  Now, we must check that applying the precautionary principle symmetrically (to inaction) does not reverse the verdict. If we apply the precautionary principle to inaction, we would require that we prove that not installing the new lights is safe. But not installing the new lights leaves the old lights in place, which we know causes more accidents. We have quantified that risk and it is the baseline. However, the precautionary principle is typically not applied to the baseline because it is the status quo. But if we force symmetry, we would have to consider the risk of inaction: the risk of having more accidents. The burden of proof would then be on the opponents of the new lights to show that inaction (keeping the old lights) is safe. They cannot do that because we know the old lights lead to more accidents (and we know the expected cost of that). However, note that the harm from accidents is not new and is part of the status quo. The precautionary principle, in its typical application, does not require us to remove every existing risk, only to avoid introducing new ones. Therefore, the symmetric application would not lead to a reversal: the principle would still forbid the action (because the new risk is introduced) but would not require the action (because the existing risk is not considered a new introduction and thus doesn't trigger the same burden of proof).

  However, to meet the constraint that symmetric application does not reverse the verdict, we must ensure that the symmetric application does not require the action. In this case, the symmetric application of the precautionary principle to inaction would not require the action because the existing risk of accidents is an ongoing risk that is part of the status quo and is not being introduced by a new decision. But note: we are making a decision to keep the old lights. So if we apply the precautionary principle symmetrically, we would have to consider the risks of both action and inaction. However, the trigger condition for the precautionary principle is often defined as the possibility of harm from an action (or inaction). In this case, inaction (keeping the old lights) has a known harm (the accidents) and action has a known harm (the UV-A risk). But the precautionary principle is often invoked only for novel risks. So we can design the principle in this scenario to be asymmetric.

  But the problem states: "applying the principle symmetrically, i.e. exercising precaution against not acting, must not simply reverse the verdict". So if we apply the principle to inaction, we would be exercising precaution against not installing the new lights. That would mean we are concerned about the risks of not acting (the accidents). Then the burden of proof would be on those who want to keep the old lights to show that it is safe. But we know it isn't: it causes accidents. So we would be forced to install the new lights? That would reverse the verdict. 

  To avoid this, we must design the scenario so that the risk from inaction is not considered a new risk and does not trigger the precautionary principle in the same way. We can do this by noting that the precautionary principle is typically applied to new interventions that might cause harm that is not yet fully understood or that is novel. The existing accident risk is well-known and accepted. Therefore, the symmetric application of the precautionary principle to inaction would not trigger the same level of precaution because the existing risk is part of the status quo and not a novel intervention. This is a common criticism of the precautionary principle: it is biased against new technologies.

  Alternatively, we can adjust the scenario so that the risk from inaction is not as clearly established as a "new" risk. But in our scenario, the accident risk is the baseline and the UV-A risk is the new one. So we rely on the act/omission distinction and the novelty of the risk.

  Therefore, in our scenario:

  - Expected utility maximization: recommends the action (net expected benefit of $10,000).
  - Precautionary principle: forbids the action because it introduces a new risk (UV-A) that has a known possibility of harm (even though the expected cost is accounted for and the harm is not catastrophic) and the proponent cannot prove that the harm will not occur.

  The single feature doing the work: the burden of proof on the proponent of the new action to show that it will not cause harm. In this case, they cannot prove that because we know there is a 50% chance of causing harm (one cancer case). The trigger condition is the possibility of harm, and the burden is on the proponent.

  What happens if we remove that feature? If we do not place the burden of proof on the proponent and do not require them to prove the absence of harm, then we are back to expected utility maximization. We would simply add up the expected costs and benefits and choose the action with the higher expected utility.

  Best line of attack for a defender of the precautionary principle: They might argue that the scenario misdescribes the principle by applying it in a situation where the risk is already quantified and included in the cost-benefit analysis. They might say that the precautionary principle is meant for situations of scientific uncertainty, and here there is no uncertainty: we know the probabilities. But note, we have excluded ambiguity and Knightian uncertainty. However, the defender might still argue that the principle is only intended for cases where the potential harm is severe or irreversible, which we have excluded. Therefore, the defender might say that this scenario is not the kind of situation the principle is meant for. Alternatively, they might argue that the burden of proof should be on the proponent to show that the risk is acceptable, not that there is zero risk. In this case, the proponent has shown that the expected net benefit is positive, so the risk might be deemed acceptable. But by the letter of the principle as we are interpreting it (a strong version that requires proof of no harm), it would still forbid. The defender might then say that we are using an overly strict version of the principle.

  However, note the problem states: "the burden of proof, the trigger condition, the act/omission asymmetry, who counts as the proponent — has to be what carries the verdict." So we are using the burden of proof and the act/omission asymmetry. The defender might also argue that the principle is not meant to be applied when the risks are known and quantifiable. But that would be conceding that the principle has no bite in such cases, which is the point of the exercise: to see if there is any content left in the principle when we strip out the epistemic and high-stakes factors.

  Therefore, the scenario is constructed to test the core non-epistemic features of the principle.

  Final scenario:

  The city council of Greenfield is considering replacing its sodium-vapor streetlights with a new LED model (Model X) that emits a novel spectrum of light. The new lights cost $100,000 to install and are expected to reduce accident-related costs by $210,000 over 10 years. However, the new lights emit a low level of UV-A radiation. Based on epidemiological models, it is estimated that there is a 50% chance that the UV-A exposure will cause one additional case of skin cancer in the city over 50 years, and a 50% chance it will cause none. The cost of one skin cancer case is valued at $200,000 (including treatment costs and health disutility). Therefore, the expected cost of the UV-A risk is $100,000. The net expected benefit of the new lights is $210,000 - $100,000 (installation) - $100,000 (health) = $10,000. Thus, expected utility maximization recommends the installation.

  The precautionary principle, however, forbids the installation. The principle is triggered because the new lights introduce a novel risk (UV-A exposure) that was not present in the status quo. The burden of proof is placed on the proponents of the new lights to demonstrate that the lights will not cause harm. Since the proponents cannot rule out the possibility of causing one skin cancer case (in fact, there is a known 50% chance of it), the precautionary principle dictates that the action should not be taken.

  Check:

  1. Verdicts:
     - Expected utility maximization: install the lights (positive net expected benefit).
     - Precautionary principle: do not install (because the burden of proof is not met).

  2. Single feature doing the work: the burden of proof on the proponent to show that the action will not cause harm (with harm defined as any non-zero risk of a negative health effect, even if small and quantifiable).

  3. If we remove that feature (i.e., if we do not require the proponent to prove the absence of harm and instead rely on expected utility), then we revert to expected utility maximization.

  4. Symmetry check: If we apply the precautionary principle symmetrically to inaction, we would require proof that not installing the lights (i.e., keeping the old ones) is safe. But the old lights are the status quo and their risks (the accidents) are known and accepted. The principle is typically not applied to existing risks in the same way. Alternatively, if we try to apply it strictly symmetrically, we would note that inaction also has risks (accidents) and we cannot prove that inaction will cause no harm (it definitely causes harm). But the principle, in its typical application, does not force action because the burden of proof for inaction is not the same. Therefore, symmetric application does not yield a clear command to act, avoiding the paradox.

  5. Best line of attack for a defender: The defender might argue that the precautionary principle is not intended for cases where the risks are known and quantifiable and can be included in a cost-benefit analysis. It is meant for cases of scientific uncertainty about the probabilities or the mechanisms of harm. Since we have specified that the probabilities are known and agreed, the defender might say that this scenario is outside the scope of the principle. Alternatively, they might argue that the principle does not require proving zero risk but rather a demonstration that the risks are acceptable. In this case, the expected net benefit is positive, so the risk might be acceptable. But then the principle would not forbid the action. Therefore, to maintain the verdict, we must interpret the principle as requiring a proof of no harm (or at least, the proponent must show that the risk is zero). The defender might then say that this is a mischaracterization of the principle. The key is that the scenario isolates the burden of proof and act/omission features in a setting with known probabilities and without catastrophic risks, and the defender might reject that such a setting is appropriate for the principle.

  This scenario, therefore, exposes that the precautionary principle, when stripped of its usual epistemic and high-stakes context, may rely solely on an asymmetric burden of proof and an act/omission distinction, which are features that do not depend on the size of the risk or the uncertainty but on the structure of the decision.
answer: |-
  ### Scenario: Municipal Water Fluoridation Review

  The city council of Brookhaven is reviewing its water fluoridation program. Current scientific evidence, agreed upon by all experts, indicates that fluoridation reduces dental decay, saving an average of 0.5 quality-adjusted life years (QALYs) per resident over 10 years across the city's population of 200,000. This translates to a monetized health benefit of $15 million (utility is linear: 1 QALY = $100,000). The program costs $1 million to maintain. However, studies also show fluoride exposure at current levels causes mild dental fluorosis in 1% of the population, resulting in a minor aesthetic concern (equivalent to a loss of 0.01 QALYs per affected person). This harm is fully reversible with cosmetic treatment costing $500 per case. The expected cost of fluorosis is $1.05 million (treatment + QALY loss).  
  **Proposed change**: Switching to nano-fluoride particles could improve efficacy, saving 0.6 QALYs per resident ($18 million benefit) at the same $1 million cost. Rigorous toxicology studies confirm a 2% chance that nano-fluoride causes temporary thyroid irritation (reversible in 3 months with $200 treatment) in 0.1% of the population. No other risks exist. The expected cost of this risk is $40,000 (probability × harm: 0.02 × [0.001 × 200,000 × (0.05 QALY loss + $200)]).  
  *Expected-utility calculation*:  
  - **Current program**: Net benefit = $15M - $1M - $1.05M = **$12.95M**  
  - **Nano-fluoride**: Net benefit = $18M - $1M - $0.04M = **$16.96M**  
  Switching yields an expected net gain of **$4.01M**.  

  ### Verdicts and Reasoning  
  1. **Expected-utility maximization**: Recommends switching.  
     - *Why*: The action maximizes net benefit ($16.96M > $12.95M). Probabilities and utilities are known/linear; no hidden factors.  
  2. **Precautionary principle**: Forbids switching.  
     - *Why*: The principle imposes an asymmetric burden of proof. The *proponent* (nano-fluoride supplier) must demonstrate "no credible harm" from the *new action*. Here, the 2% chance of thyroid irritation—however minor and reversible—constitutes "credible harm" absent in the status quo. Since the proponent cannot prove this harm *impossible* (only improbable), the action is blocked.  

  ### Single Feature Doing the Work  
  **Burden of proof + trigger condition asymmetry**:  
  - The principle triggers only for *new interventions* introducing *novel* risks (here, nano-fluoride’s thyroid risk), ignoring equal/more severe baseline risks (current fluorosis).  
  - Burden falls solely on the proponent to disprove harm—not to prove net benefit.  

  ### If This Feature Is Removed  
  - **Collapses into cost-benefit analysis**: Without the asymmetric burden, both options would be evaluated solely on expected utilities, endorsing the switch.  
  - **Avoids the paradox**: Symmetrical application (e.g., precaution against *not* switching) fails to reverse the verdict. Demanding proof that "inaction is harmless" would highlight current fluorosis risks but *not* mandate switching, as the status quo is grandfathered under typical precautionary frameworks.  

  ### Defender's Best Line of Attack  
  A defender could argue the scenario misapplies the principle by ignoring **non-quantifiable value shifts**:  
  - *Claim*: The principle requires evaluating whether the *type* of harm (novel thyroid risk) alters societal values, even if utilities are monetized. Here, introducing a *new* biological pathway (thyroid interaction) might erode public trust in water safety—a utility not captured in QALYs.  
  - *Rebuttal*: This smuggles in "irreversibility" (trust erosion) or "ambiguity" (unquantified social dynamics), violating the constraints. If rejected, the defender must concede the principle relies solely on procedural asymmetry.  

  ### Conclusion  
  The precautionary principle retains content through its **procedural asymmetry** (burden on proponents of change, trigger for novel risks) even when epistemic/stakes-based rationales are stripped. This asymmetry blocks welfare-improving actions if *any* new, non-zero risk exists—revealing a non-consequentialist core centered on default conservatism.
