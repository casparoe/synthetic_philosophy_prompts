prompt: |-
  I have been reading about the post-war tribunals and have talked myself into an argument whose conclusion I cannot accept. Set out in steps:

  (1) A verdict is an act of punishment rather than an act of revenge only if both of these hold: (a) the defendant is convicted of something that was already criminal, under a rule that bound him, at the time he acted; and (b) the court would have applied that same rule to people on its own side.

  (2) The charges doing the real work at Nuremberg and Tokyo were new — though not in the sense people usually mean. Killing civilians was already murder under German and Japanese law. What was new was that the charges were international; that the Charter severed liability from local legality, defining crimes against humanity to cover acts "whether or not in violation of the domestic law of the country where perpetrated"; and that the answers a domestic court would have heard — superior orders, act of state, the defendant's official position — were withdrawn in advance, the first two expressly, and treated at most as grounds for mitigation. Call this what you like: the defendants lost, after the event, the defences they would have had when they acted.

  (3) The tribunals were one-sided by construction. Only the defeated were in the dock; the area bombing of cities and the atomic bombings were never charged; the Japanese head of state was not indicted; and tu quoque was ruled out as a defence before the trials began.

  (4) So both limbs of (1) fail, and the verdicts were revenge wearing a legal costume.

  (5) Here is why I think the argument must be rotten: limb (b) would disqualify every criminal court that has ever sat. No state that punishes killing refrains from killing; no tribunal is drawn from both sides of a conflict; and if a court must be prepared to indict its own side before it has jurisdiction, then the alternative to victors' justice is not neutral justice but no trials at all — impunity for any aggressor who is never wholly defeated. An argument that ends by showing that nobody may ever punish anybody has proved too much.

  (6) But when I drop (b), I lose my grip on (a). Both are fairness conditions; if the partiality of the tribunal does not defeat its verdicts, why should the novelty of the charges? And if novelty is fatal, then the later codifications look like an attempt to launder 1945 and 1946 after the event — including the exception written into the post-war European human rights instrument for acts that were already criminal under principles generally recognised among nations.

  I want to keep (2) and (3), which seem to me to be facts, and I want to keep the judgement that the trials were worth holding, so I seem bound to give up something in (1). The mistake may equally lie in the move from (2) and (3) to (4), or in what "punishment" is doing in (1): I cannot locate it. Which step should I reject, and what does rejecting it cost me?
reasoning: |-
  Okay, the user presents a carefully constructed argument about the legitimacy of post-war tribunals like Nuremberg and Tokyo. They've structured it in logical steps but feel troubled by the conclusion that the trials were merely "revenge in legal costume," which conflicts with their belief that the trials were necessary. Their core dilemma is how to reconcile the factual premises (steps 2-3) with their normative rejection of impunity (step 5) without abandoning the fairness principles in step 1.

  Hmm... The user is clearly well-versed in legal philosophy—they reference nuances like crimes against humanity's severance from domestic law and the tu quoque exclusion. Their discomfort stems from intellectual honesty: they recognize their argument's conclusion is unsustainable ("proves too much") but can't find where the logic breaks. This isn't just about history; it's about foundational principles of justice. 

  Let me unpack their tension points. First, step 1(b) is the main culprit—it sets an impossible standard by requiring courts to indict their own side. As the user notes, this would invalidate all criminal law since states legally kill (e.g., soldiers, executioners). Yet dropping (b) weakens their case against victors' justice. Step 2 is historically sound: the tribunals did create novel legal frameworks. Step 3's one-sidedness is also factual. The user’s step 5 objection is powerful—if we accept their initial argument, we must either condemn all punishment or accept impunity for aggressors. Neither is palatable. 

  The user’s underlying need seems to be finding a coherent theory of transitional justice that acknowledges the tribunals' flaws without dismissing them as mere revenge. They might also be probing whether "punishment" requires perfect fairness or merely sufficient legitimacy. 

  I think the solution lies in redefining step 1's requirements. Condition (a) could be softened by recognizing that "binding" law isn't solely positivist—natural law or emergent norms can bind actors retroactively in extreme cases. For (b), we might distinguish between systemic partiality (which invalidates) and contingent partiality (which doesn't). Nuremberg’s victors' status is problematic but not uniquely disqualifying; the key is whether the trial offered basic due process. 

  Alternatively, we could challenge step 4's inference. Even if (1a) and (1b) are unmet, the verdicts weren’t revenge because they served broader purposes: establishing historical truth, deterring future atrocities, and founding a new legal order. Revenge seeks emotional satisfaction; these trials sought institutional repair. 

  The user might resist this as consequentialism, but it’s a defensible middle path. Historical tribunals exist in messy reality—their legitimacy comes from preventing greater injustices (impunity) despite imperfections. The later codifications they mention aren't "laundering" but organic legal development, much like common law evolves through precedent. 

  Cost-wise, rejecting strict condition (1b) means accepting that victors' courts can sometimes act justly—a bitter pill, but one that avoids the absurdity of no trials. We preserve the necessity of Nuremberg while acknowledging its asymmetries. The atomic bombings' exclusion remains a moral stain but doesn’t negate the whole endeavor.
answer: |-
  Your argument is intellectually honest and captures a genuine tension in international law. The flaw lies in **Step 1’s definition of "punishment" and its conditions**, particularly in treating (a) and (b) as absolute prerequisites. Here’s a step-by-step rebuttal:

  ### **Where the Argument Fails: Rejecting Step 1’s Rigid Framework**
  1. **Condition (b) is unsustainable** (as you note in Step 5).  
     - No legal system prosecutes *all* violations equally. Domestic courts don’t indict police for justified killings in line-of-duty; international courts lack jurisdiction over non-consenting states.  
     - **Solution:** Replace (b) with a weaker condition: *"The court applies rules impartially *within its jurisdiction*"*. The tribunal’s partial *scope* (e.g., trying only Axis leaders) doesn’t invalidate its *procedural fairness* toward the accused. Nuremberg met this by allowing robust defenses, evidence, and acquittals (e.g., Schacht, von Papen).

  2. **Condition (a) is misapplied to systemic crimes**.  
     - Mass atrocities (genocide, aggressive war) often occur under *state-sanctioned illegality*. Nazi Germany twisted domestic law to permit crimes. Demanding strict *domestic* legality (a) would shield perpetrators who weaponize their own legal systems.  
     - **Solution:** Recognize that "binding rules" can include **customary international law** (CIL). Even pre-1945, piracy, slavery, and war crimes were prosecutable under CIL. The tribunals argued that aggression and crimes against humanity violated pre-existing CIL—flawed, but not baseless.

  ### **Why Steps 2–3 Don’t Necessarily Lead to Step 4**
  - **Step 2 (Novelty of Charges):**  
    Nuremberg’s innovation wasn’t inventing crimes wholesale but *codifying* emerging norms. The "defense of obedience" had *already* been rejected in earlier war crimes trials (e.g., Leipzig Trials, 1921). Withdrawing "act of state" was a response to unprecedented state criminality.  
    - **Cost:** Acknowledge retroactivity, but argue it was *necessary* to break cycles of impunity. The alternative—no accountability—was morally worse.

  - **Step 3 (One-Sidedness):**  
    Victor’s justice? Yes. Illegitimate? Not necessarily. The exclusion of Allied crimes (e.g., Dresden, Hiroshima) is indefensible, but this *procedural flaw* doesn’t negate the *substantive guilt* of the accused. Tokyo’s acquittals (e.g., Foreign Minister Shigemitsu) show some independence.  
    - **Cost:** Admit the trials were imperfect, yet still preferable to summary executions or amnesties.

  ### **Reframing "Punishment" vs. "Revenge"**
  Your Step 1 defines punishment in **strict legal positivist** terms. Reject this for a **transitional justice** perspective:  
  - **Punishment** requires:  
    (i) *Procedural fairness* (Nuremberg/Tokyo largely delivered this);  
    (ii) *Substantive legitimacy* (condemning acts universally wrong, e.g., genocide);  
    (iii) *Non-arbitrariness* (rules applied consistently *to the accused*).  
  - **Revenge** is ad hoc, denies process, and seeks emotional satisfaction. The tribunals rejected this by creating a detailed legal framework.

  ### **The Path Forward: Keep Steps 2–3, Amend Step 1**
  - **Reject Step 1(b)** as phrased. A court need not indict its "own side" to be legitimate—it must only treat the accused fairly.  
  - **Reframe Step 1(a):** Accept that *some* retroactivity is justified when confronting systemic evil, provided the acts were *malum in se* (inherently wrong), not *malum prohibitum* (wrong only because prohibited).  
  - **Concede:** The trials *were* legally innovative and politically partial—but within a context where perfect justice was impossible. Their legacy (e.g., ICC, UN Genocide Convention) suggests they advanced justice despite flaws.

  ### **What This Costs You**
  1. **Moral compromise:** Accepting that justice in war’s aftermath is imperfect and political.  
  2. **Theoretical purity:** Abandoning a rigid legal positivist view for a more flexible natural law/pragmatic approach.  
  3. **Unresolved guilt:** Allied crimes (e.g., bombing) remain unaddressed—a historical burden.  

  Yet this preserves your core convictions: the trials were necessary ("worth holding"), and Steps 2–3 are facts. The alternative—discarding all post-conflict justice—validates your fear in Step 5: impunity for the worst crimes. As Hannah Arendt noted of Eichmann’s trial: Justice must be *attempted*, even when the system is tainted by the crimes it judges.
