     - But (a) is about the system in question. In (h), the system in question is the coding system, not the scheduler. You are arguing that the coding system is a tool. The stranded-principal test for the coding system: if during one nightly run, the humans disappear, the coding system would complete that run (it has the goal for that run) and then stop. It doesn't carry the goal to the next run because the next run is a separate invocation. The scheduler is just a cron job, which is a simple automation without goals. So by (a), the coding system is a tool.

