     - Tension with (h) only if we consider the entire pipeline. But you are focused on the coding system. So no direct tension with (a). However, note that the safety argument in (c) might be undermined for the batch job because there is no human checkpoint for a year. But that's a tension with (c) and (h), not directly with (a).

     - We'll look at (c) and (h) below.

  8. (b) and (c):
     - (b) says a long-running system is a tool. (c) says tools are safer because of fresh checkpoints. But for a long-running task, the checkpoint is only at the start, so if the task is malicious or goes wrong, the human doesn't have a chance to refuse during the task. So the safety argument in (c) is weaker for long tasks. But (c) doesn't claim that tools are perfectly safe, just that they are safer due to checkpoints. Also, (g) says we should verify independently, which might help.

