  3. (a) and (d):
     - (d) says capability and agency are orthogonal. (a) defines agency by goal persistence. So a system can be highly capable and still be a tool if it doesn't have standing ends. Consistent.

  4. (a) and (e):
     - (e) is a build-time constraint to train systems not to represent their own continued operation as worth preserving and not to revise the task spec. This is to prevent the development of standing ends. It supports (a) by making it less likely that a system will develop or act on standing ends. No tension.

  5. (a) and (f):
     - (f) says alignment is a property of the deployment. So the same weights can be a tool in one wrapper and an agent in another. (a) is about the system's behavior in deployment, so it's consistent. The stranded-principal test is applied to the system as deployed.

