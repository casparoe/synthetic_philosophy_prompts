  14. (c) and (d):
      - (d) says push capability while keeping deployment tool-shaped. (c) says tool-shaped is safer. So they are aligned: we can have capable tools safely. No tension.

  15. (c) and (e):
      - (e) is a build-time constraint to prevent standing ends. This supports (c) because if the system doesn't have standing ends, it won't have an incentive to shape beliefs. Consistent.

  16. (c) and (f):
      - (f) says oversight should target deployment contexts. (c) is about the safety of tool-shaped deployments. Consistent because tool-shaped deployments are safer and we can have many of them.

