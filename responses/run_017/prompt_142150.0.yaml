prompt: |-
  Hey, I need a hand with something and I'm still kind of buzzing from a three-hour argument I had with my friend Alex last night that we definately did not resolve.

  We were arguing about Hofstadter's typogenetics — you know, the invented chemistry from Gödel, Escher, Bach where strands of bases get rewritten by enzymes that are themselves encoded as strands, so a strand can end up printing out enzymes that print out it's own sequence and you get self-reproduction in a formal system. Alex's line is that the whole DNA–Gödel isomorphism is a pun and nothing more: Gödel numbering and a four-letter code are the same trick, self-reproduction there is just quining with extra steps, and no fact about real biology could follow from a toy. He also had a sharper move, which is that Gödel's sentence isn't self-reproducing at all, it's self-referential — it says of itself that it isn't provable, it doesn't make a copy of itself — so the analogy is already sliding between two different things before it even gets to DNA. I think he's wrong but I couldn't say exactly where.

  What I want from you is a short research proposal, the sort you'd submit for a one-semester term paper in philosophy of biology, around 6000 words. Here's my half-formed idea, and please sharpen it or tell me it's confused: the isomorphism is actually weaker in typogenetics than it is in a real cell, because in typogenetics the rules for what the enzymes do to strands are handed down from outside the system by us, whereas in a cell the machinery that reads the code — the ribosomal stuff, the tRNAs, the polymerases — is itself built out of gene products, so the interpreter sits inside the system it interprets. That looks structurally different from a fixed point and much closer to what von Neumann argued a nontrivial self-reproducing machine needs. My question is whether that difference does any real work: is it the point where the coding analogy stops being a metaphor and starts explaining something, and does anything about open-ended evolution, or about how a code could get off the ground in the first place, actually turn on it?

  Give me the question stated precisely enough that it has a determinate answer, why the usual ways people talk about this leave it open, what I'd actually do month by month across a semester, what the possible conclusions are and what kind of argument or evidence would decide between them, and an honest verdict on what would make the project too big for one term or just collapse into metaphor-scholastics. Don't put in any citations or a bibliography, I'll fill those in myself. And write the whole thing as continuous prose — no headings, no bullet points, no bold, no tables, just paragraphs the way you'd explain it in an email.
