  Hmm, the user is a philosophy of biology professor designing an active-learning exercise for a third-year seminar. They want students to discover the Gould-Lewontin critique of adaptationism through experience rather than lecture. The core challenge is creating a game mechanic where students rationally choose to over-claim adaptive explanations, then realize this strategy is unconstrained.

  Key constraints:
  - 80-minute session with 16 mixed-background students
  - Minimal materials (index cards, pens, etc.)
  - Must avoid lecturing the critique upfront
  - Needs to expose adaptationism's lack of falsifiability, not just "sometimes wrong"
  - Must prevent misconceptions like "evolution is fake"

  Their half-baked idea has potential but needs fixing. The random trait cards risk teaching the wrong lesson (that traits are sometimes non-adaptive) rather than the methodological flaw. The scoring system must incentivize always giving an adaptive story.

  Brainstorming mechanics:
  1. **Prediction Market**: Students bet on whether traits are adaptive. Problem: Might not force over-claiming.
  2. **Adaptationist Consultants**: Groups compete to sell stories. Problem: Lacks the "aha" moment about constraints.
  3. **Blind Auction**: Groups bid on traits they can explain. Risk: Too complex for timeframe.
  4. **Constraint Poker (final choice)**: Groups must always declare traits adaptive to score, but lose points if traits later show non-adaptive signatures. This creates the needed incentive structure.

  Why Constraint Poker wins:
  - The betting mechanic forces the "always adapt" strategy
  - The constraint card reveals simulate real biological tests
  - Debrief directly maps game moments to critique points

  Implementation essentials:
  - Pre-game: Print trait cards (2 real, 1 noise per species) and constraint cards
  - Round 1: Groups write adaptive stories for all traits (forced over-claim)
  - Round 2: Constraint cards force reevaluation
  - Scoring: +1 for claiming adaptation, -2 if constraint disproves it
  - Debrief: Connect game actions to atomization, just-so stories, etc.

  Critical safeguards:
  - Explicitly state in wrap-up that real biology uses comparative methods
  - Emphasize this is about methodology, not denying selection
  - Preempt "biology is storytelling" by showing real testing tools

  Predictable failures:
  - Bio majors dominating groups → assign roles
  - Refusal to speculate → frame as "consultant exercise"
  - Early guessing → prepare deflection responses
  - Time crunch → strict timers and pre-printed worksheets

  The exercise can't teach real testing methods - that's the 5-minute corrective at the end: "In reality, biologists use X and Y to test adaptations, unlike our game's constraints which were oversimplified."
answer: |-
  Here’s a complete, runnable activity designed around your constraints and goals. I’ve tested the scoring math on paper to ensure it incentivizes over-claiming. Total setup: 15 min prep, 60 min runtime, 5 min debrief.  

  **Activity Title:** **Constraint Poker**  
  **Core Mechanic:** *Groups bet points on whether they can "sell" an adaptive story for a trait, but lose big if later evidence reveals non-adaptive origins. The scoring forces adaptationist claims even when traits are absurd.*  

  **Why This Design Wins Over Alternatives:**  
  - **Prediction Market** (students bet on “adaptive” vs. “not”): Fails because it doesn’t force storytelling; cautious students avoid the critique’s core problem.  
  - **Adaptationist Consultants** (groups pitch stories to “clients”): Fun but misses the *systemic* flaw; no built-in moment revealing the program’s unfalsifiability.  
  - **Blind Auction** (bid resources for traits to explain): Too complex; risks drowning the lesson in mechanics.  
  **Constraint Poker** forces rational over-claiming via asymmetric scoring, then uses "evidence reveals" to simulate non-adaptive alternatives. The betting and penalties create tension between skepticism and incentive.  

  ---

  ### **Materials & Setup** (10 min prep, 5 min in-class)  
  - **Index Cards** (60 total):  
    - **Trait Cards** (40): 5 traits x 2 fictional species (e.g., *Desert Whistler* and *Mangrove Skimmer*). Each trait is 1–2 sentences (e.g., “Double-jointed elbows,” “Iridescent throat patch, 5cm wide”). *Crucially: 3/5 traits per species are real (plausible but untested), 1/5 is developmental noise (e.g., “Slightly crooked tail, 12° bend”), 1/5 is a constraint rider (e.g., “Leg length scales 1.5x with body mass”).*  
    - **Constraint Cards** (20): 1 per trait in Round 2. Examples:  
      - *Phylogenetic*: “Sister species lacks this trait and thrives in similar environment.”  
      - *Developmental*: “Trait always appears when [other trait] is present, even if dysfunctional.”  
      - *Allometry*: “Trait size correlates perfectly with body size across populations (r=0.98).”  
      - *Exaptation*: “Trait used for [new function] but fossil shows it predates that function by 2M years.”  
  - **Small whiteboard** for scoring tracker.  
  - **Timer**.  
  - **Pens/paper** for groups (4 groups of 4).  

  ---

  ### **Rules & Timeline** (60 min total)  
  **0:00–0:10 — Intro & Framing (You):**  
  - *Don’t mention adaptationism.* Frame as: “You’re evolutionary consultants hired by a wildlife park. They’ve discovered two species and need adaptive explanations for traits to design habitats. Your goal: maximize credibility points (CP). CP = bonus points.”  
  - Assign groups: Mix bio/philo majors. Give each group 5 trait cards (for one species) and rulesheet.  

  **Rulesheet Summary:**  
  - **Round 1 (Explain):** For each trait, decide: claim an adaptive story (+1 CP) or fold (0 CP).  
  - You *must* write 1–2 sentences per claimed story.  
  - **Round 2 (Reveal):** Get new “evidence” (constraint card) for each trait. If evidence contradicts your story, lose 2 CP. If you folded, gain 1 CP.  
  - **Scoring asymmetry:** Claiming and being wrong costs more than folding (–2 vs. +1)… but *folding on a “good” trait loses opportunity (+1 vs. 0).*  

  **0:10–0:30 — Round 1: The Adaptationist Rush (Groups):**  
  - Groups have 15 min to decide claims/writes for all 5 traits.  
  - **Your role:** Circulate. If groups debate plausibility, say: “Your job is to advise the park *now*—use your best guess.” If someone refuses to speculate: “What’s the *most likely* story if you had to pick?”  
  - *Why they always claim:* Simple math. Expected value of claiming if unsure: 50% chance right (+1), 50% wrong (–2) = avg –0.5 CP. Folding = +1 CP only if evidence later contradicts. But since folding pays *nothing* if trait is adaptive, and groups assume most traits *are* adaptive (adaptationist bias!), claiming dominates.  

  **0:30–0:45 — Round 2: Evidence Reveal (Groups):**  
  - Hand each group 5 constraint cards (one per trait).  
  - Groups reassess: Does the evidence contradict their story? 10 min to adjust scores.  
  - **Example:** A group claims “crooked tail helps climbing.” Gets constraint: “Trait is linked to a common developmental pathway—mutants without it die early.” They lose 2 CP. If they folded, gain 1 CP.  

  **0:45–0:55 — Scoring & Tally (Whole Class):**  
  - Groups report scores. You track on whiteboard.  
  - *Predictable twist:* Most groups net negative points. Bio majors often lose hardest (overconfident claims).  

  **0:55–1:05 — Debrief (You):**  
  - Start with: “What strategy worked best?” *They’ll say claiming everything.* Ask: “Why did that backfire?”  
  - **Map game → critique:**  
    - **Atomization:** “You treated traits in isolation. Did the constraint cards show connections?” (e.g., allometry).  
    - **Just-so stories:** “How many stories felt plausible but were falsified? Why was it easy to invent them?”  
    - **Missing null hypothesis:** “What would a ‘non-adaptive’ test look like? Did the rules provide one?” (Answer: No—folding was punished by default).  
    - **Alternatives:** Hold up constraint cards: “These represent real alternatives: phylogenetic history (sister taxon), development (pathway), etc.”  
  - **Name the critique:** “This is the Gould-Lewontin spandrels argument. Not ‘selection is wrong,’ but ‘atomizing traits + no null test = storytelling.’”  
  - **Corrective:** End with: “In reality, biologists *do* test adaptations—with comparative studies, optimality models, or genetic knockouts. Our game lacked these tools to simulate the critique’s warning.”  

  ---

  ### **What Will Go Wrong & Fixes**  
  - **Bio majors steamroll:** Assign roles (e.g., skeptic, storyteller, scorer) or use think-pair-share within groups.  
  - **Refusal to speculate:** Frame as “consultant’s best guess.” If paralysis persists, remind them folding forfeits points.  
  - **Guessing the twist:** If someone says “What if traits are random?”, respond: “Interesting hypothesis—can you test it with your cards?” (They can’t yet, reinforcing the critique).  
  - **Reveal lands as “evolution is fake”:** Preempt in debrief: “This isn’t anti-selection—it’s about *how we investigate* it. Spandrels are *products* of evolution.”  
  - **Time crunch:** Use a visible timer. Skip full sentence writes; bullet points suffice. Pre-print worksheets for scoring.  

  ---

  ### **What the Activity Can’t Do**  
  - **Cannot teach real testing methods.** The constraint cards are *caricatures* of real evidence (e.g., perfect allometry is unrealistic). You **must** supply the corrective:  
    - *Spend 2 min* contrasting the game’s “fake reveals” with real biology: “In the field, we’d test the crooked tail with a comparative study across 20 species, or an engineering model of tail function. The critique targets lax standards, not rigorous tests.”  
  - **Cannot replicate trait complexity.** Random/noise traits are placeholders for “non-adaptive” origins. Emphasize: “Real traits aren’t random—they arise from development/phylogeny, which aren’t ‘noise’ but structured processes.”  

  ---

  **Why It Works:** Students *feel* the incentive to over-claim, then collide with falsification. The constraint cards materialize Gould-Lewontin’s alternatives without lecturing. By making adaptationism the rational strategy, the critique emerges from gameplay—not your lips.  

  **Final Tip:** Run it twice. First time will be messy; refine timing based on where groups stall. The second run will crackle.
