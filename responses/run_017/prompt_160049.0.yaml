prompt: |-
  Hi — I manage the eligibility desk for our county rental assistance program. Me and two other people decide what our own program rules mean, several times a week, and whatever we say is what the front desk does until somebody higher up tells us otherwise. None of us are lawyers. County counsel is part time, she's in the building maybe twice a month and she reads what we've already issued, after the fact. The state auditor reads our denials once a year. So what I need is something we can actually run in about twenty minutes, on paper, that ends in one of three places — apply reading A, apply reading B, or stop and send it to counsel — and that tells us which questions to ask in what order, what counts as an actual answer to each one, and where it's really just handing the question to a person because it's a values call dressed up as an interpretation.

  The part I can't get right is the old text-versus-purpose thing. I know the slogan version — if the words are clear, stop; if they aren't, ask what the rule is for — and it doesn't help, because every fight we have is one level below that. Here are the shapes they actually take:

  - Our rulebook opens with a "purpose and intent" section, but it was written for a different, older program, and after the 2015 renumbering most of the provisions it points at don't exist anymore. It still says things like the program exists to keep county families housed. How much weight does a purpose statement get when it's visably orphaned from the text it was written for?
  - One of our rules was lifted almost word for word out of a model code, and the model code had two carve-outs that our board didn't adopt. Does deleting them mean something, or did nobody think about it?
  - The intake software has implemented one reading of a rule for years, nobody still here knows who chose it, and flipping it would mean reopening a few hundred closed cases. Is that a fact the procedure can use, or is it inertia with a nicer name?
  - The two purposes in our purpose section pull against each other in most real cases: get money out the door fast, versus make sure it goes to the people it's for. "Look at the purpose" isn't an instruction when there are two.
  - And the unit question. Does the text/purpose test get applied to a single word, to a whole sentence, or to the rule as a chunk? With "resided" or "household" it definately seems to matter which you pick.

  Two more things I want an honest answer about. One: our denials get audited and our approvals get audited, but they cost us different things — a wrong approval is an improper payment we may have to eat, a wrong denial is a family that may lose housing while the appeal grinds for four months. I suspect that asymmetry isn't allowed to be part of interpretation at all, but I want the procedure to tell me that rather than quietly deciding things for me. Two: we have an internal convention that we won't read a rule in a way that makes things worse for a protected class without counsel signing off. Is that a tie-breaker inside the procedure, or a veto outside it?

  Some constraints, so the procedure isn't fantasy: we can't call the drafters (gone, term-limited, or dead) and the board minutes are thin, so there's no real legislative history to go dig up; our rules get reauthorized every two years, so arguments about a text freezing in 1970 while the world moved on are weaker here than in the stories people tell — say whether the procedure should even ask about drift. And it has to be runnable by someone whose training is a two-week onboarding.

  Then please run the whole thing, start to finish, on three live headaches:

  1. The income rule says count income "received during the month." A client gets a retroactive Social Security back payment covering fourteen months, arriving as one check this month. Count all of it or one fourteenth of it? The software has exactly one field.
  2. "Any person who shares the dwelling and contributes to household expenses" counts as a household member. A client's live-in caregiver is paid through a state waiver program, and part of the pay is room and board. Caregiver in or out — and does the answer change depending on whether it helps or hurts the client?
  3. To qualify you must have "resided in the county for twelve consecutive months immediately prior to application." A woman leaving a domestic violence situation spent six weeks in a confidential shelter whose registered address is in the next county over, then came back. On paper her twelve months has a hole in it.

  I have a feeling the procedure is going to tell me to deny number 3 and I am going to hate that, so if that's what it says I want it said plainly, along with what I'm actually supposed to do instead of quietly fudging it.

  And tell me what the procedure can't do: where it will misfire, which distinctions it drops and whether dropping them costs us something real, and which steps are judgment calls we've all agreed to call procedure.
reasoning: |-
  Hmm, the user manages a county rental assistance program eligibility desk and needs a practical decision procedure for interpreting program rules. They're dealing with real-world ambiguities in rule interpretation without legal training, and their current approach feels unstable. 

  Key pain points emerge: orphaned purpose statements, unadopted model code carve-outs, legacy system interpretations, conflicting program goals, and granularity problems in applying text/purpose tests. There's also operational tension - incorrect approvals cost money, incorrect denials risk homelessness, plus an ethical commitment to avoid disproportionate harm to protected classes.

  The constraints are brutal: no legal support on-site, thin legislative history, rapid rule reauthorization cycles, and frontline staff with minimal training. The three test cases perfectly illustrate their daily dilemmas - retroactive payments blurring time periods, caregiver status ambiguity, and discontinuous residency due to domestic violence.

  What they truly need isn't legal theory but an operational compass - something that either forces clear decisions or transparently flags when human judgment must intervene. The emotional weight in the DV case example suggests moral distress when rules conflict with humanitarian outcomes.

  For the procedure design, I'm considering a flowchart-style algorithm that forces binary choices at each step. Key features would include: mandatory purpose/text reconciliation, explicit tiebreakers for conflicting goals, systematic treatment of implementation history, and safeguards for protected classes. Most crucially, it must have clear "STOP" gates when professional judgment is required - no pretending algorithmic decisions replace ethical responsibility.

  The asymmetric consequences of errors (financial vs humanitarian) can't legally drive interpretations, but the procedure should surface this tension explicitly rather than letting it operate subconsciously. Similarly, the protected class convention should function as a formal circuit-breaker, not just a quiet influence.

  For the test cases, the retroactive payment question seems resolvable through textual analysis (the rule says "received," not "earned"). The caregiver case likely requires purpose-driven judgment about functional household membership. The DV residency gap tragically illustrates the procedure's limits - strict textual reading would deny assistance, forcing a painful choice between rule integrity and moral imperative.

  The procedure's weaknesses would be: inability to resolve deep value conflicts, blindness to unintended consequences, and necessary oversimplification of complex social realities. But it would gain operational reliability and audit transparency - trading philosophical completeness for frontline usability.
answer: |-
  Here's a practical, paper-based procedure designed for your constraints. It forces explicit choices, minimizes open-ended judgment, and flags when legal review is mandatory. It runs in 5 stages, fits on 1-2 pages, and uses simple checkboxes/flowcharts.

  **The 20-Minute Interpretation Procedure**

  **Stage 1: Text Clarity Check (5 mins)**
  *   **Q1: Is the disputed phrase/rule *unambiguous* when read in isolation?**  
      *(Check one)*  
      [ ] **YES (Clear Text)** → Skip to Stage 3.  
      [ ] **NO (Ambiguous/Unclear)** → Proceed to Stage 2.  
      *   *Definition of Unambiguous:* All reasonable English speakers familiar with rental assistance would agree on the meaning *without* needing context or purpose. If dictionaries disagree or common usage varies → **NO**.

  **Stage 2: Purpose & Context Reconciliation (7 mins)**
  *   **Q2A: Is there a *current*, *specific* Purpose Statement directly governing this rule?**  
      *(Check one)*  
      [ ] **YES (Current & Specific Purpose)** → Use this purpose as primary guide. Proceed to Q2C.  
      [ ] **NO (Orphaned/Generic/Conflicting Purpose)** → Proceed to Q2B.  
  *   **Q2B: Does the rule originate from Model Code?**  
      *(Check one)*  
      [ ] **YES (Model Code Origin)** → Presume deletions were intentional unless contradicted by clear *current* purpose. Proceed to Q2C.  
      [ ] **NO** → Proceed to Q2C.  
  *   **Q2C: Is there a *long-standing, consistent operational interpretation* (e.g., software logic, past decisions)?**  
      *(Check one)*  
      [ ] **YES (Established Practice)** → This interpretation carries significant weight UNLESS:  
          *   It clearly violates unambiguous text (Stage 1 YES).  
          *   It causes demonstrable harm to core program goals (Stage 2A).  
          *   Changing it creates *minor* administrative burden? → **Weigh lightly.**  
          *   Changing it requires reopening *numerous* closed cases? → **Weigh heavily as practical reality.**  
      [ ] **NO (No Established Practice)** → Proceed to Q2D.  
  *   **Q2D: Apply Core Purpose Balancing Test:**  
      *(Check ALL that apply)*  
      [ ] Interpretation **A** favors **Speed/Getting Funds Out**.  
      [ ] Interpretation **A** favors **Accuracy/Correct Targeting**.  
      [ ] Interpretation **B** favors **Speed/Getting Funds Out**.  
      [ ] Interpretation **B** favors **Accuracy/Correct Targeting**.  
      *   *Tiebreaker:* If interpretations are equally balanced on speed/accuracy, OR if one interpretation significantly harms a **Protected Class** → **STOP. SEND TO COUNSEL (Stage 5).**  
      *   *Otherwise:* Proceed to Stage 3.

  **Stage 3: Scope & Granularity Check (4 mins)**
  *   **Q3: What is the *smallest* unit the ambiguity applies to?**  
      *(Check one)*  
      [ ] **Single Word/Phrase** (e.g., "resided", "received") → Focus analysis *primarily* on that word's common meaning & purpose.  
      [ ] **Entire Sentence/Rule** → Analyze the rule as a functional whole.  
      *   *Outcome:* Does this focus resolve the ambiguity?  
          [ ] **YES** → Apply resolved interpretation. **DONE (Apply Reading A/B)**.  
          [ ] **NO** → Proceed to Stage 4.

  **Stage 4: Consequences & Constraints Check (2 mins)**
  *   **Q4A: Would Interpretation A create a *significant* risk of:**  
      *(Check if YES)*  
      [ ] **Improper Payment** (Wrong Approval)  
      [ ] **Wrongful Denial/Housing Loss Risk**  
      [ ] **Violating Protected Class Safeguard**  
  *   **Q4B: Would Interpretation B create a *significant* risk of:**  
      *(Check if YES)*  
      [ ] **Improper Payment** (Wrong Approval)  
      [ ] **Wrongful Denial/Housing Loss Risk**  
      [ ] **Violating Protected Class Safeguard**  
  *   **Decision:**  
      *   If **Q4A** has NO checks and **Q4B** has ANY check → **Apply Reading A**.  
      *   If **Q4B** has NO checks and **Q4A** has ANY check → **Apply Reading B**.  
      *   If **BOTH** have checks, OR if **EITHER** has a **Protected Class** check → **STOP. SEND TO COUNSEL (Stage 5).**  
      *   If **NEITHER** has checks → **Re-evaluate Stages 1-3. If still tied, SEND TO COUNSEL.**

  **Stage 5: Mandatory Stop & Send to Counsel**
  *   [ ] **STOP. SEND TO COUNSEL.** Document specific ambiguity, conflicting purposes/practices, and consequence risks flagged above.

  **Key Features & Limitations:**

  1.  **Honesty About Asymmetry:** The procedure *acknowledges* consequence asymmetry (Q4A/B) but **does NOT let it drive interpretation**. It only uses consequences as a **tiebreaker or flag for counsel** when risks are severe and opposite. Wrongful denial risk alone *cannot* override clear text or purpose.
  2.  **Protected Class Safeguard:** This is a **veto outside the core procedure**, implemented as a mandatory **"STOP & SEND" trigger** (Q2D Tiebreaker, Q4A/B Protected Class checks). It's not a tie-breaker *within* interpretation; it halts the procedure.
  3.  **Drift:** The procedure **ignores "drift" arguments** (text frozen in time). Reauthorization every 2 years means current text *is* the relevant text. Purpose (Q2A) must be *current*.
  4.  **Dropped Distinctions & Costs:**
      *   **Deep Legislative History:** Doesn't ask (and can't use) intent of long-gone drafters. *Cost:* Might miss original nuanced intent.
      *   **Philosophical Nuance:** Reduces "text vs. purpose" to practical checks. *Cost:* Oversimplifies complex jurisprudential debates.
      *   **Perfect Fairness:** Prioritizes consistency, auditability, and avoiding catastrophic errors over perfectly tailored outcomes in every case.
      *   **Moral Discomfort:** Will sometimes mandate strict textual results with harsh humanitarian consequences (e.g., Case 3). *This is the price of the rule of law applied by non-lawyers without discretion.* The "STOP" trigger is crucial here.
  5.  **Judgment Calls Masked as Procedure:** Key judgment points exist:
      *   Defining "unambiguous" (Stage 1).
      *   Assessing "significant" risk (Stage 4).
      *   Balancing speed vs. accuracy (Q2D - though structured).
      *   Weighing established practice (Q2C).
  6.  **Where it Misfires:**
      *   **Novel Situations:** Truly unprecedented cases might get forced into boxes.
      *   **Equitable Exceptions:** Struggles where strict application is manifestly unjust but text is clear (Case 3 is the prime example). The procedure will say "deny" unless Counsel overrides.
      *   **Complex Interdependencies:** If ambiguity involves interplay between multiple rules, the step-by-step approach might miss the forest for the trees.
      *   **Counsel Backlog:** If counsel is overloaded, "STOP" cases cause delays.

  **Applying the Procedure to Your Cases:**

  **Case 1: Retroactive Social Security Payment**
  1.  **Stage 1 (Text):** "Received during the month." The check is *received* this month. Text is **CLEAR (YES)**. → Skip to Stage 3.
  2.  **Stage 3 (Scope):** Ambiguity unit = Phrase "received during the month." Focus confirms: money *received* this month counts. **Count ALL of it.** DONE (Apply Reading A: Count full amount).

  **Case 2: Live-In Caregiver (Room & Board as Pay)**
  1.  **Stage 1 (Text):** "Shares the dwelling and contributes to household expenses." Caregiver shares dwelling. Does providing services where room/board is part of compensation = "contributes to household expenses"? **AMBIGUOUS (NO)** → Stage 2.
  2.  **Stage 2:**
      *   **Q2A (Purpose):** Orphaned/Generic. → **Q2B (Model Code):** Unknown/Unlikely. → **Q2C (Practice):** Unknown per question. Assume **NO**. → **Q2D (Purpose Balancing):**
          *   Reading A (IN): Favors **Speed** (simpler inclusion). Favors **Accuracy?** Debatable (caregiver is paid, not truly contributing *their own* resources? But does reduce client's costs?).
          *   Reading B (OUT): Favors **Accuracy** (strictly, client isn't paying expenses *for* the caregiver; state is). Favors **Speed?** (Exclusion might be simpler?).
          *   *Balancing:* Not clearly tilted. → **Q2D Tiebreaker:** Does inclusion/exclusion disproportionately help/hurt a Protected Class? Caregiver status *might* correlate with disability (client or caregiver). **CAUTION. POTENTIAL PROTECTED CLASS IMPACT. → STOP. SEND TO COUNSEL (Stage 5).** *The answer CANNOT change based on helping/hurting the client – that would be improper bias. Counsel must decide.*

  **Case 3: DV Survivor - 6-Week Shelter Gap**
  1.  **Stage 1 (Text):** "Resided in the county for twelve consecutive months immediately prior to application." Physical presence documented in next county for 6 weeks. Text requires *consecutive* county residence. **CLEAR (YES)** → Skip to Stage 3.
  2.  **Stage 3 (Scope):** Ambiguity unit = Word "resided." Does temporary refuge in a confidential shelter *break* residence? Common meaning of "reside" implies permanency/habitual abode. Temporary shelter ≠ residence. Textual focus confirms: **Gap breaks consecutiveness.** → Proceed to Stage 4 only if needed (text is clear).
  3.  **Stage 4 (Consequences - Applied Strictly):**
      *   **Q4A (Deny):** Creates **WRONGFUL DENIAL/HOUSING LOSS RISK** (Severe). Does *not* inherently violate Protected Class (DV victims are not a monolithic protected class, though gender/disability might be factors).
      *   **Q4B (Approve/Fudge):** Creates **IMPROPER PAYMENT RISK** (Violates clear rule). *Could* set problematic precedent.
      *   **Decision:** Stage 1 was YES (Clear Text). Stage 4 Q4A has a YES check, but **Clear Text generally overrides consequence concerns** for frontline staff. **NO Protected Class trigger.** → **Result: DENY based on clear text.**
  4.  **What to Do Instead of Fudging:**
      *   **Document Rigorously:** Show the procedure was followed (Clear Text -> Deny).
      *   **Flag for Counsel IMMEDIATELY:** In the "Denial Reason," explicitly state the clear rule, the gap, *and* the extenuating DV circumstance. Mark it for URGENT Counsel review *before* finalizing denial if possible, or immediately upon denial for appeal/override. Argue the *humanitarian crisis risk* and *potential disparate impact on women* (a Protected Class) as reasons Counsel *must* consider an override or policy exception.
      *   **Advocate Internally:** Use this case to push Counsel and Management for a formal, written exception policy for DV shelter stays.

  **Conclusion:** This procedure provides a structured, defensible, and timely way to make most eligibility calls. It forces explicit consideration of text, purpose, practice, and consequences, while strictly limiting frontline discretion on core interpretation. Its greatest strength (consistency/auditability) is also its greatest weakness when clear rules create harsh outcomes. The **mandatory "STOP & SEND TO COUNSEL"** triggers are essential safety valves for protected class issues, consequence deadlocks, and cases where the human cost demands legal intervention, even if the rule seems clear. It makes the hard choices visible.
