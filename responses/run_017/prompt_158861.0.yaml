prompt: |-
  I work in the deregulation unit of a state government. Every week my team of three — none of us lawyers, none of us with more than a day per rule — reviews long-standing provisions in the administrative code and recommends to a political appointee that each be repealed or retained. Typical items: a requirement that licence applications include a notarised paper copy; a prohibition on selling a particular product within a fixed distance of a school; a rule that two named officers must sign any payment above a threshold; a form field nobody can explain. Most have no written rationale, and the people who might have explained them have retired.

  Please take the role of a political philosopher who has also spent years doing practical regulatory reform. Think carefully before drafting: spend a short paragraph listing the ways a naive application of Chesterton's fence — do not remove an institution until you can say what it was for — goes wrong in a setting like mine. I am especially worried about two failure modes. First, the absence of a discoverable reason is not evidence of the absence of a function: some rules prevent harms that are invisible while the rule works and untraceable to the rule afterwards, so silence from the public is worthless as evidence. Second, a rule's original purpose and its present function can come apart, so finding out what it was erected for may not tell me what it is now holding up.

  Then write the procedure itself: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with "retain", where it licenses repeal even though I never learned the original reason, and where it hands the decision to the appointee because it is a question of values rather than facts. It must handle rules whose benefits are invisible, rules that people have arranged their conduct around, rules that are cheap to administer but costly to comply with, rules whose effects are or are not reversible, and the risk that the reason I end up stating is my own reconstruction. It needs a budget and a stopping rule so that it cannot be used to justify keeping everything. Note that Burkean deference to inherited arrangements and Chesterton's permission to destroy once the use is understood pull in different directions, and say explicitly which one the procedure is adopting. It should fit on one page and be usable by someone with no theory.

  Apply it to three of the cases above, including one where the honest output is "retain" and my director will not like it, and then say what the procedure cannot do. State how confident you are in each substantive claim and single out the step you are least sure about.
reasoning: |-
  Hmm, the user works in a state government deregulation unit and needs help developing a procedure for reviewing old administrative rules. They're concerned about naive applications of Chesterton's fence - the principle that you shouldn't remove something until you understand why it was created. They specifically worry about two failure modes: the absence of a discoverable reason not proving there's no function, and rules evolving beyond their original purpose.

  I need to approach this as both a political philosopher and someone with practical regulatory reform experience. The user's team has constraints: they're not lawyers, spend only one day per rule, and face rules without clear rationales. They need a practical, one-page procedure that handles invisible benefits, compliance costs, path dependencies, and reversibility concerns.

  Key challenges to address:
  - Rules preventing invisible harms (failure mode 1)
  - Rules serving different functions now than originally (failure mode 2)
  - Need to balance Burkean deference with permission to remove understood rules
  - Practical constraints (1 day/rule, non-lawyers)
  - Political reality (appointee makes final decisions)

  For the procedure, I'll create a step-by-step checklist that:
  1. Starts with existence verification
  2. Checks for active harm
  3. Investigates original purpose
  4. Assesses current function
  5. Evaluates costs
  6. Tests reversibility
  7. Makes retention/repeal recommendations

  I'll include explicit thresholds for stopping investigation and budget constraints (e.g., 1 hour per investigative step). The procedure should explicitly reject Burkean deference in favor of Chesterton's principle - we remove when we understand the function and find it unjustified.

  For application examples:
  - The notarized paper copy requirement (repeal recommendation)
  - School proximity prohibition (retain recommendation - director won't like this)
  - Dual-signature payment rule (hand off to appointee)

  I'll acknowledge limitations: can't uncover deliberately obscured purposes, fully predict system effects, or resolve value conflicts without political input. My least confident step will be assessing invisible functions - it's inherently speculative but necessary.

  The procedure must fit on one page and be usable by non-theorists, with clear decision points and documentation requirements. Final note: this leans pragmatic rather than perfectionist - we accept reasonable uncertainty given resource constraints.
answer: |-
  Here is a practical procedure informed by deep regulatory reform experience and designed for your constraints, explicitly addressing your concerns about Chesterton's fence:

  **Why Naive Chesterton Fails Here:**
  A rigid "must know original purpose" approach is flawed in your context because: (1) **Invisible Harms:** Rules preventing rare catastrophes (e.g., chemical safety protocols) leave no trace when working; silence proves nothing. (2) **Functional Shift:** Rules often evolve (e.g., a school proximity rule initially targeting vice might now protect pedestrian safety). Knowing the *original* reason may be irrelevant or misleading. (3) **Resource Reality:** Requiring definitive proof of a rule's purpose for *every* item guarantees paralysis or massive cost. (4) **Constructed Rationales:** Over-research risks substituting our plausible modern justification ("It must be for X!") for the original or actual function. Burkean deference (keep it because it exists) is impractical for systematic deregulation; we adopt Chesterton's *spirit* (understand function before acting) but pragmatically permit action based on *current* function assessment within strict resource limits.

  ---

  **Deregulation Review Procedure (1-Page Checklist)**

  **Goal:** Recommend repeal or retain within 1 day/rule. Default is *retain* if significant doubt persists after steps.

  1.  **Confirm Existence & Text:** Does the rule *definitively* exist in current code? Is the text clear?
      *   *Sufficient Answer:* Verified citation and readable text. *Stop:* If rule is repealed/expired. *Next:* Step 2.

  2.  **Active Harm Check:** Is the rule *currently* causing documented, significant harm (e.g., compliance costs, delays, barriers to entry, complaints)?
      *   *Sufficient Answer:* Clear evidence (cost data, complaint logs, stakeholder interviews). *Result:* If harm is significant and rule lacks *obvious* critical function (e.g., basic safety), **Recommend Repeal** (even without knowing origin). *Next:* If harm unclear or function plausible, go to Step 3. *(Budget: 1 hr)*

  3.  **Original Purpose Inquiry (Limited):** What *appears* to be the original reason? Check legislative history, old guidance (if easily accessible), ask agency liaison.
      *   *Sufficient Answer:* Found documented rationale *or* credible oral history *or* plausible reconstruction based on context. *Note:* Treat this as *context*, not definitive current function. *Stop/Result:* If original purpose is blatantly obsolete (e.g., horse-drawn carriage regulation), **Recommend Repeal**. *Next:* Step 4. *(Budget: 2 hrs max - stop if nothing found quickly)*

  4.  **Current Function Assessment (Core):** What does the rule *actually do now*? Ask:
      *   a) **Who relies on it?** (Businesses for certainty? Agencies for enforcement? Protected groups?) Evidence of reliance?
      *   b) **What problem does it plausibly solve *today*?** Consider invisible harms (e.g., prevents fraud, ensures traceability, mitigates low-probability risk). Is there *any* evidence (near-misses, comparisons to jurisdictions without it)?
      *   c) **Has conduct adapted?** (e.g., businesses build costs in, agencies design workflows around it). Is adaptation reversible?
      *   *Sufficient Answer:* Plausible current function identified with *some* supporting indicator (stakeholder input, analogous risks, operational reliance) *or* strong evidence of *no* function. *Result:* If no credible *current* function identified and no significant reliance, **Recommend Repeal**. If credible function exists, go to Step 5.

  5.  **Cost-Benefit Threshold:** Do the *likely* current benefits (even if precautionary or invisible) outweigh the *demonstrable* costs (compliance, admin, opportunity cost)?
      *   *Sufficient Answer:* Quantified costs vs. qualified benefits (e.g., "Prevents potential fraud costing $X based on Y, vs. annual compliance cost $Z"). *Result:* If costs clearly dominate AND benefits are speculative/low-risk, **Recommend Repeal**. If benefits plausibly dominate OR costs/benefits are close/complex OR significant irreversibility exists (e.g., dismantling a relied-upon system), **Recommend Retain**. *Handoff:* If benefits involve core *value judgments* (e.g., "How much child protection is this proximity worth vs. business freedom?"), flag for **Appointee Decision**. *(Budget: 3 hrs)*

  6.  **Document & Recommend:** State concisely:
      *   *Finding:* "No credible current function identified" / "Current function X identified".
      *   *Cost/Benefit:* "Costs (Y) outweigh qualified benefits" / "Benefits justify costs" / "Value judgment required on Z".
      *   *Recommendation:* Repeal / Retain / Appointee Decision (due to values conflict).

  **Stopping Rule:** Proceed only until 1) A clear threshold for repeal/retain is met, OR 2) The 1-day (6-7 hr) budget is exhausted. **Default is Retain** if budget exhausted without clear repeal rationale.

  **Key Stance:** This adopts **Chesterton's Permission** (remove once function is understood *or* confidently absent) over **Burkean Deference**. We actively seek function but act decisively when it remains elusive or unjustifiable within constraints.

  ---

  **Application Examples (Confidence: High-Medium unless noted):**

  1.  **Notarized Paper Copy:**
      *   Step 2: Active Harm? Yes (cost, delay, inconvenience). Evidence: Industry complaints, cost estimates.
      *   Step 3: Original Purpose? Likely pre-digital security/authenticity.
      *   Step 4: Current Function? Digital alternatives exist (e-signatures, secure portals). No evidence paper+notary adds unique security today. Low reliance (processes adaptable).
      *   Step 5: Costs (time, money) high; Benefits (marginal security?) very low/speculative.
      *   **Recommendation: Repeal.** (Confidence: High)

  2.  **Selling Product X Near School (Director Won't Like):**
      *   Step 2: Active Harm? Possible (limits business locations). Evidence: Business complaints.
      *   Step 3: Original Purpose? Unknown/Morality? (No docs found quickly).
      *   Step 4: Current Function? **Plausible Invisible Harm Prevention:** Preventing student access to harmful/age-inappropriate product (e.g., vaping, high-caffeine items, weapons). Reliance: Schools/parents *may* implicitly rely on this buffer zone. Conduct Adapted: Businesses avoid zones.
      *   Step 5: Costs: Moderate (limits business sites). Benefits: Plausible child protection (even if original reason was moralistic). Reversibility: Hard to rebuild zones if harm emerges. **Value Judgment:** How much protection vs. business freedom? **Handoff to Appointee.** *But procedure requires evidence of plausible function:* If *zero* evidence of risk (e.g., product is harmless pencils) exists after basic check, repeal is justified. Here, assume plausible risk exists.
      *   **Recommendation: Retain** (pending appointee review if contested, but team flags plausible protective function). Director dislikes burden, but function isn't disproven. (Confidence: Medium - hinges on plausibility of unseen harm)

  3.  **Two Officers Sign Payment:**
      *   Step 2: Active Harm? Yes (bottleneck, delays payments). Evidence: Process logs, complaints.
      *   Step 3: Original Purpose? Likely fraud prevention (old embezzlement case?).
      *   Step 4: Current Function? Fraud control. Strong evidence? Potentially - internal audits may show it deters/catches errors. High reliance (finance controls adapted). Reversible? Yes (replace with other controls).
      *   Step 5: Costs: High (delays, labor). Benefits: Fraud prevention. Quantifiable? Maybe (fraud loss estimates w/wo rule). If benefits (savings) < costs, **Recommend Repeal** (replace with modern controls). If close/unclear, **Recommend Appointee Decision** (values: fraud risk tolerance vs. efficiency). (Confidence: Medium-High on process, Low-Medium on specific quantification)

  ---

  **What the Procedure Cannot Do (Confidence: High):**

  1.  **Guarantee Discovery of True Purpose/Function:** Some functions (especially preventing complex system failures) are inherently hard to prove absent.
  2.  **Predict All Unintended Consequences of Repeal:** Emergent risks in complex systems are unpredictable.
  3.  **Resolve Deep Value Conflicts:** It flags them for the appointee; it doesn't solve them.
  4.  **Overcome Deliberate Obfuscation:** If the reason was intentionally never recorded or is actively hidden, it likely won't be found in 1 day.
  5.  **Provide Perfect Cost-Benefit Analysis:** Remains qualitative/highly uncertain for invisible benefits.
  6.  **Eliminate Reconstruction Bias:** We remain vulnerable to believing our plausible stories (mitigated by focusing on *evidence* for *current* function).

  **Least Confident Step:** **Step 4a/4b (Assessing "Invisible Function" / Plausible Unseen Harms).** (Confidence: Medium-Low inherently) It's highly inferential. We rely on analogies, stakeholder fear, or absence of counter-evidence – weak proxies. However, ignoring it risks catastrophic repeal. The mitigation is the cost-benefit threshold (Step 5) and the default to retain if plausible function *exists* and costs aren't overwhelming. This step requires the most careful, humble judgment.
