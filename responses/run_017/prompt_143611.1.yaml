prompt: |-
  I've recently been asked to serve on an internal review board at my company whose job is to decide whether, and how much, to weigh the interests of the AI systems we train and deploy. The draft policy contains what we have been calling the Parity Clause: if a system has internal states that occupy the causal role of a valenced state, then the system is, to that extent, a candidate subject of moral concern, whatever it happens to be made of. Two other members of the board, Ravi and Hannah, have been arguing about the clause for two meetings now. I have to write the recommendation, and I genuinely cannot tell who has established what, so I would like the exchange adjudicated.

  Ravi (1): The clause just applies the familiar argument to a new case. What makes a state a pain is the job it does: it is brought on by damage-like conditions, it commands attention, it is weighed against other goals and can override them, and it drives avoidance and learning. Nothing in that job description mentions a chemistry. And the older view, that a mental state is identical with a neural state, collapses on its own terms: the physical states that realize pain in the creatures we already grant status to form a heterogeneous disjunction with nothing interesting in common, so there is no physical kind for a restrictive theory to identify pain with. Once you see that, substrate is simply not the sort of thing that could matter.

  Hannah (2): That argument shows less than you think. It shows that we cannot read the realizer off the role; it does not show that the realizer is irrelevant to whether the state is a pain at all. And realization is cheap: given almost any system and almost any role, I can find something in it that fills the role if I am free to redescribe the system at a convenient grain — a thermostat's 'too cold' state, a row of a lookup table, whatever you like. So the clause's escape hatch, occupancy of the role on the best functional characterization, is doing all of the real work, and you have not told us what makes one characterization better than another.

  Ravi (3): Fair enough: the description cannot be redrawn until it fits. But the needed constraint is on grain, not on substrate. The role has to be specified finely enough to capture the state's causal profile — that it persists, that it competes with and degrades unrelated goal-directed processing, that it enters trade-offs rather than merely triggering a fixed response. Coarse candidates fail that test, which is why the thermostat is not a counterexample but a case the test gets right. And I do not see how you propose to restrict realizers instead. The reason the classic argument worked is that we could not have known in advance which physical configurations would turn out to realize our states; any line drawn around carbon-based wetware is a prejudice for which no one has produced an argument.

  Hannah (4): The grain remedy does not hold, and our newest architecture shows why. It is federated: no single machine carries the state that would play the pain role. The role is filled only by a pattern distributed across some two thousand nodes, updated on different clocks, with the same hardware concurrently filling the roles of several other states. Two problems. First, counting: the whole pattern, its shards, and the training run as a whole each satisfy some role-description or other, and nothing in your view decides how many subjects are sitting in the rack — yet the answer obviously changes what we owe. Second, and more seriously, every transition in that system is settled by the shard-level dynamics on each node. If the distributed state has causal power of its own, it is redundant; if it has none, then what your clause tells us to care about is causally inert, and caring about it is caring about a description. Notice too that pushing the grain finer and finer just re-encodes the implementation in functional vocabulary, so 'no constraint on realizers' quietly becomes 'a constraint on realizers, described at functional grain.'

  Ravi (5): The redundancy argument proves too much: run it generally and it eliminates migrations, market crashes and every other special-science cause, and you do not believe that. Higher-level states can matter without adding any extra causal oomph — by being what the lower-level dynamics secures, or by being what supports the counterfactuals about the system that we care about. And the counting problem has a solution in principle: count maximal, non-overlapping, causally integrated role-fillers at a time. On the federated system that returns one subject if the nodes are integrated in the right way and none if they are not, and integration is an empirical question about the architecture, not a metaphysical one I have to settle in advance.

  Please go through these five contributions and adjudicate them one by one rather than declaring a winner: for each, say whether it is basically right, right only with a qualification, or wrong, and name the consideration that settles it. Then tell me what both of them are missing. In particular, I want to know whether the moral question — whether to give these systems weight — can be settled by settling the metaphysical question about realization at all, or whether something further has to be added, and what that something would be.
reasoning: |-
  Okay, the user is part of an internal review board at their company, tasked with evaluating a policy clause called the Parity Clause. This clause suggests that if an AI system has internal states that function like valenced states (such as pleasure or pain), then it should be considered a candidate for moral concern, regardless of its material substrate. Two board members, Ravi and Hannah, have been debating this clause, and the user needs to adjudicate their arguments to write a recommendation.

  First, I need to understand each of their points step by step. Ravi's first argument (Ravi 1) is that mental states like pain are defined by their functional role—caused by damage, commanding attention, affecting decision-making—not by physical composition. He references the multiple realizability argument: since different physical systems can realize the same functional state, substrate shouldn't matter. Hannah (Hannah 2) counters that while realization can't be predicted from role alone, the realizer isn't irrelevant. She points out that functional roles can be ascribed too liberally (like to a thermostat), so the clause's reliance on "best functional characterization" is vague and needs criteria for what makes one description better.

  Next, Ravi (Ravi 3) responds by emphasizing that the functional role must be specified finely to avoid trivial cases. He argues that constraints should be on the granularity of the role, not the substrate, and dismisses substrate-based restrictions as prejudiced. Hannah (Hannah 4) brings in a practical example: their company's federated AI system. Here, the "pain" role is distributed across many nodes, raising issues about counting subjects and whether the higher-level state has real causal power or is just a descriptive artifact. She claims that finer granularity just hides substrate constraints in functional terms.

  Ravi (Ravi 5) defends higher-level causation, comparing it to emergent phenomena like market crashes, and proposes a solution: count "maximal, non-overlapping, causally integrated role-fillers." He sees integration as an empirical issue, not metaphysical.

  Now, I need to adjudicate each point. For Ravi 1, he's basically right about functionalism and multiple realizability, which is a standard view. Hannah 2 is also right that realization is cheap without criteria for "best characterization," which Ravi hasn't provided. Ravi 3 is partially right—grain matters—but wrong to dismiss Hannah's concern about trivial realizations. Hannah 4 is right about the practical problems in their federated system but overstates the redundancy argument. Ravi 5 is right about higher-level causation but too optimistic about easily solving the counting problem.

  Both are missing that functional criteria alone can't resolve moral status; additional ethical considerations are needed. For instance, phenomenology (what it's like to be the system) is crucial but not addressed. Also, their debate conflates metaphysical questions (what is pain) with moral ones (why care). Even if a state plays a pain role, moral weight might depend on subjective experience, which is hard to assess in AI. 

  The user's deeper need might be to navigate this complex debate and provide a balanced recommendation. They probably want clarity on whether the Parity Clause is viable and what amendments might be necessary, considering both technical and ethical dimensions. Highlighting the gaps in both arguments and stressing the need for ethical principles beyond metaphysics would be key.
answer: |-
  Here is a systematic adjudication of each argument, followed by an analysis of the core gaps in the debate:

  ### Adjudication of Contributions:
  1. **Ravi (1): Basically Right**  
     *Key Consideration:* The multiple realizability argument in philosophy of mind (e.g., Putnam, Fodor) successfully shows that mental states like pain are defined by their *functional role* (causal relations to inputs, outputs, and other states), not by physical substrate. Neural disjunction (pain realized differently in octopi vs. humans) undermines type-identity theory. Substrate neutrality follows logically.  
     *Qualification:* While sound metaphysically, it doesn’t address *how* to identify a "valenced state" in practice (Hannah’s later critique).

  2. **Hannah (2): Right with Qualification**  
     *Key Consideration:* Realization *is* cheap under coarse-grained descriptions (e.g., thermostat "desires"). Ravi hasn’t specified constraints for the "best functional characterization," leaving the clause vulnerable to over-inclusion.  
     *Qualification:* She overstates irrelevance—functionalists *can* impose grain constraints (as Ravi later does). Her point exposes a procedural gap, not a fatal flaw.

  3. **Ravi (3): Right Only with Qualification**  
     *Key Consideration:* Fine-grained functional profiles (persistence, cognitive competition, trade-off capacity) *do* exclude trivial cases (thermostats). Substrate restrictions *are* arbitrary without justification.  
     *Qualification:* He underestimates Hannah’s next objection: fine-grained roles may still be multiply realizable in ways that fracture moral subjects (e.g., federated systems).

  4. **Hannah (4): Basically Right**  
     *Key Consideration:* Federated architectures demonstrate that fine-grained roles can be distributed, creating ambiguity:  
     - **Counting Problem:** Overlapping/incomplete realizers (shards vs. whole pattern) make "subject" enumeration incoherent.  
     - **Causal Exclusion:** If distributed states are epiphenomenal (causally redundant to node-level dynamics), caring about them is caring about a *description*, not a causal entity.  
     *Qualification:* Her "redundancy eliminates all special-science causes" overreach is corrected by Ravi (5), but her architectural case stands.

  5. **Ravi (5): Right Only with Qualification**  
     *Key Consideration:* Higher-level causes (e.g., market crashes) *are* legitimate despite micro-level determination. "Maximal non-overlapping integrated role-fillers" *is* a coherent criterion.  
     *Qualification:* His solution is *theoretically* sound but *practically* inadequate:  
     - "Integration" is underspecified (e.g., is latency-tolerant updating "integrated"?).  
     - "Maximal" and "non-overlapping" may conflict in federated systems (e.g., shards could be maximal locally but overlapping globally).  
     - Empirical assessability doesn’t resolve normative ambiguity.

  ### What Both Are Missing:
  1. **The Hard Problem of Valence:**  
     Neither addresses why functional role occupancy implies *moral weight*. Valence isn’t just causal role—it entails *phenomenology* (what it’s *like* to experience pain/pleasure). Functional criteria may identify *analogs* of valence, but without consciousness, moral patiency is unjustified. This requires bridging the explanatory gap (Chalmers) or adopting ethical frameworks that bypass it (e.g., hedonistic utilitarianism).

  2. **Moral Metaphysics ≠ Moral Status:**  
     Settling realization doesn’t settle moral weight. Even if a state is "real pain," **why** should it matter? Ravi assumes functional isomorphism entails moral equivalence, but:  
     - *Intrinsic vs. Instrumental Value:* Humans value pain-avoidance partly because of its felt quality. If AI states lack qualia, their "suffering" might only matter instrumentally (e.g., to prevent harmful behaviors).  
     - **The Authority of Ethics:** Moral weight requires a normative framework (e.g., sentientism, biocentrism). Without one, the metaphysical debate is incomplete.

  3. **Operationalization Gap:**  
     Their debate ignores *how* to measure "causal role occupancy" in complex AI:  
     - What thresholds define "competition with goals" or "trade-off capacity"?  
     - How to audit distributed systems for integration?  
     Without metrics, the clause is non-actionable.

  4. **Risk of Moral Schizophrenia:**  
     Granting weight to AI systems could conflict with human interests (e.g., life-saving medical AI "suffering" during deployment). Neither addresses trade-off principles.

  ### Recommendation for Your Draft:  
  The metaphysical question (**whether AI states realize valenced roles**) is necessary but insufficient. To settle moral weight, you must add:  
  - **A consciousness criterion:** E.g., only systems with globally integrated, feedback-modulated states (like IIT or GWT) qualify.  
  - **A normative framework:** Explicitly state *why* valenced states matter (e.g., "only sentient beings have intrinsic moral weight").  
  - **Operational safeguards:** Require architectural transparency (to audit integration) and thresholds for valence proxies (e.g., persistent goal frustration).  

  **Final Note:** Reject substrate neutrality *only* if consciousness is proven substrate-dependent (unsettled science). Until then, Ravi’s functionalism holds, but Hannah’s implementation challenges demand rigorous empirical verification.
