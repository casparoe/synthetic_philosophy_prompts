prompt: |-
  I am writing a paper on W. E. B. Du Bois on art and politics, and I keep running into a line that is usually traced to his 1926 essay on Negro art: all art is propaganda, sometimes with the rider that the purists will simply have to live with it. I do not want to argue about what Du Bois really meant internally; I want to know what the sentence could be asserting, because in two settings recently it was used to do real argumentative work, and I suspect the work was done by an ambiguity.

  Two settings. In my seminar a classmate used it to collapse the aesthetic/political distinction: if every work is propaganda, she said, then a critic who objects to a contemporary novel's unflattering portrayal of Black life is not doing something different in kind from a critic who objects to its prose, and there is no purely aesthetic residual to which the political complaint must answer. At a reading afterwards, a poet used the same line in the opposite direction: since all art is propaganda, an artist who claims to be above it is merely laundering the dominant group's propaganda, and so Black writers owe it to their audience to make their propaganda explicit and useful.

  Here is my own attempt at sorting the readings, which I would like checked, corrected, and extended. I have been separating three axes. First, what propaganda is supposed to consist in: a causal claim (works reliably move audiences' attitudes), an intentional claim (works are made in order to move attitudes), a semantic or representational claim (works present the world as being a certain way, and presenting it as being a certain way is already a kind of advocacy), or a functional/sociological claim (works serve someone's interests irrespective of anyone's intent, an ideology claim rather than a doctrine claim). Second, whether the is is a stipulation — a redefinition on which art just means shaped, effective, value-laden communication, which would make the sentence analytic and unfalsifiable — or an empirical generalization that could turn out false. Third, whether the upshot is normative (judge works by their propaganda-value; artists should pick a side) or merely diagnostic (politics is always in the room, so much the worse for any criticism that pretends otherwise).

  Three further complications I would like handled rather than set aside.

  (i) Pejorative versus neutral. In ordinary use propaganda connotes deception, the bypassing of the audience's reason, or the service of power. If the word keeps that edge, the slogan is a debunking thesis about all art; if the edge is dropped, the slogan may collapse into the platitude that art has effects or expresses a point of view. I want to know which readings preserve a debunking force and which are deflationary.

  (ii) The beauty-and-truth filter. My recollection, which I would like flagged as uncertain if it is shaky, is that in the same essay Du Bois also insists that propaganda must be beautiful and truthful to count as art at all, so that bad propaganda is demoted to mere propaganda rather than being called bad art. If that is right in substance, then one reading of the slogan is trivially true by a filter: whatever is aesthetically successful counts, and whatever fails aesthetically is reclassified. Does that reading drain the slogan of the bite it is normally given? Is it the reading Du Bois would have wanted, given that he also objects, as I recall, to propaganda being confined to one side while the other is stripped and silent?

  (iii) Symmetry and uptake. If all art is propaganda, the dominant culture's art is propaganda too, and the slogan by itself looks symmetrical. So which readings license the further step my poet wanted — therefore mine should be propaganda for liberation — and which leave that step as a non sequitur needing an extra normative premise? Relatedly, please test the readings against hard cases: a string quartet with no text; a landscape painting; a novel written as propaganda for a cause I take to be evil but read against the grain and adopted by the other side; a private poem written with no audience in mind; and an exquisitely made film built on a false empirical claim about a group of people. For each case, say whether the work is propaganda on the reading in question, and whether the reading therefore has the extension its users need.

  What I want back is a menu, not a single interpretation: a numbered list of the distinct precise theses the sentence could express, each labelled for what kind of claim it is, whether it is trivial, substantive and defensible, false, or question-begging, and — most importantly — whether it would actually get my classmate and my poet their conclusions. Lay the readings out so I can bring the list to my advisor.

  On the epistemic side: I would like settled matters kept clearly apart from contested ones. Tell me what is secure about the logic of the slogan and about Du Bois's rejection of art-for-art's-sake, and tell me separately what is genuinely disputed among people who work on him — for instance whether his position is instrumentalist about aesthetic value, whether it is consistent, and whether his own fiction or criticism instantiates it. Do not present a contested reading as the consensus, and mark explicitly where you are reconstructing from partial recollection rather than from a text you can check, including for anything you say about the 1926 essay's contents, whose exact wording I am not asking you to reproduce. Where a textual question is decisive, describe the kind of sentence in the essay that would settle it, without citing sources.
reasoning: |-
  Okay, the user is writing a paper on W.E.B. Du Bois and the line "all art is propaganda." They've encountered this quote used in two different arguments and want to understand the possible interpretations of the statement. They've already done some analysis, breaking it down into three axes: what "propaganda" means, whether the statement is stipulative or empirical, and whether it's normative or diagnostic. They also have three complications: the pejorative vs. neutral connotation of propaganda, Du Bois's "beauty-and-truth filter," and symmetry/uptake issues.

  The user wants a numbered list of distinct, precise theses that the slogan could express, with each labeled by type of claim, triviality, defensibility, and whether it supports the arguments made by their classmate and the poet. They also want clarity on what's secure vs. contested in Du Bois scholarship.

  First, I need to address the key axes they identified. For the definition of propaganda, I should cover causal, intentional, semantic, and functional interpretations. Then, for the nature of the "is," whether it's a definitional claim or an empirical one. And finally, the normative vs. diagnostic dimension. 

  The pejorative aspect is crucial. If "propaganda" retains its negative connotations, the statement becomes a debunking one. If neutralized, it might just mean art has a perspective, which is less provocative. Du Bois's mention of beauty and truth complicates things—propaganda must be beautiful to be art, so bad propaganda isn't art at all. This could make the slogan tautological. 

  Symmetry is another point. The poet argued that since all art is propaganda, Black artists should make theirs explicit for liberation. But the slogan itself is symmetric; it applies to dominant culture too. So how does that lead to a normative push for liberation propaganda? Some interpretations might require additional premises to bridge that gap.

  For the hard cases: a string quartet (no text), a landscape painting, a novel co-opted by the opposition, a private poem, and a well-made but false film. Each interpretation must be tested against these to see if it holds and if it delivers the conclusions the user's peers want.

  On Du Bois scholarship, secure points include his rejection of art-for-art's-sake and his belief that art serves racial uplift. Contested areas are whether he saw aesthetic value as purely instrumental, the consistency of his views, and if his fiction embodies his theories. I must avoid presenting contested views as consensus.

  The user needs a menu of theses, each analyzed for structure, defensibility, and whether it supports the classmate's collapse of aesthetics/politics or the poet's call for explicit propaganda. I'll organize these theses clearly, addressing each axis and complication, and specify where textual evidence is decisive without claiming uncheckable details.
answer: |-
  Here is a categorized menu of interpretations for "All Art is Propaganda," designed to address your analytical framework, complications, and the specific argumentative uses you encountered. Each thesis is labeled, assessed, and tested against your scenarios and desired conclusions.

  **Key to Labels:**
  *   **Propaganda Type (PT):** Causal (C), Intentional (I), Semantic/Representational (S), Functional/Sociological (F)
  *   **"Is" Status:** Stipulative (Stip), Empirical (Emp)
  *   **Upshot:** Normative (Norm), Diagnostic (Diag)
  *   **Triviality/Defensibility:** Trivial (T), Substantive & Defensible (SD), Substantive but False (SF), Question-Begging (QB)
  *   **Conclusion Support:** Classmate (Collapse Aesthetic/Political Distinction) - (Supports C?), Poet (Obligation for Explicit Liberation Propaganda) - (Supports P?)

  **The Menu of Interpretations:**

  1.  **The Strong Intentional Propaganda Thesis:**
      *   **Assertion:** A work is art *only if* its creator *intentionally* designed it to persuade an audience toward a specific socio-political attitude, belief, or action.
      *   **PT:** I | **"Is":** Stip (Art *defined* by this intent) | **Upshot:** Norm (Art *should* be made with conscious political intent; value art by its persuasive efficacy for a cause)
      *   **Triviality/Defensibility:** SF (False). Vast amounts of art demonstrably lack this specific intent (e.g., decorative arts, abstract expressionism, much lyric poetry).
      *   **Pejorative:** Can be neutral (persuasion isn't inherently bad) or retain edge (implying covert manipulation).
      *   **Beauty/Truth Filter:** Incompatible. If art *requires* beauty/truth *and* intentional propaganda, this thesis falsely excludes beautiful/truthful art made without propaganda intent.
      *   **Symmetry/Uptake:** Symmetrical in theory (dominant art is also intentional propaganda). **Supports P?** Yes, *if* combined with the normative premise that artists *should* serve liberation. But the thesis alone doesn't mandate *which* side. **Supports C?** Yes, collapses distinction: political intent is *constitutive* of being art; aesthetic judgment *is* judgment of political intent/efficacy.
      *   **Hard Cases:**
          *   String Quartet: Not Art (SF consequence).
          *   Landscape Painting: Not Art unless artist intended political persuasion (SF).
          *   Co-opted Novel: Is Propaganda (for the *original* evil intent), regardless of uptake.
          *   Private Poem: Not Art (SF).
          *   False Film: Is Propaganda (if intent was present), regardless of beauty/falsity.

  2.  **The Inevitable Effect (Functional Propaganda) Thesis:**
      *   **Assertion:** Art *always functions* within society to reinforce or challenge existing power structures, ideologies, and social attitudes, *regardless* of the creator's intent. This function defines its propagandistic nature.
      *   **PT:** F | **"Is":** Emp (Claim about how art *actually* operates socially) | **Upshot:** Primarily Diag (Exposes hidden functions, debunks neutrality claims), *Can imply* Norm (Artists *should* consciously align function with liberation)
      *   **Triviality/Defensibility:** SD. Rooted in sociological/critical theory (Marxism, Frankfurt School, Critical Race Theory). Highly defensible but requires nuanced analysis per case.
      *   **Pejorative:** Retains debunking edge. Exposes art as *always* serving interests (often dominant ones if uncritical), potentially bypassing reason via affective/ideological means.
      *   **Beauty/Truth Filter:** Compatible. Beautiful/truthful art *still functions* within power structures. Bad propaganda fails *as art* (aesthetically/truthfully) but still *functions* propagandistically.
      *   **Symmetry/Uptake:** Explicitly symmetrical (dominant art *is* propaganda for dominance). **Supports P?** Strongly *enables* it. Diagnosis shows dominant art *is* propaganda; normativity comes from the *evaluation* of which interests it serves and the ethical/political imperative for liberation. **Supports C?** Yes, collapses distinction: All evaluation (aesthetic or otherwise) occurs within a political functional context; there is no "pure" aesthetic residual outside this function.
      *   **Hard Cases:**
          *   String Quartet: Propaganda (e.g., reinforces elite culture, notions of European superiority, or provides solace challenging alienation).
          *   Landscape Painting: Propaganda (e.g., reinforces colonial land claims, romanticizes wilderness, or critiques urbanization).
          *   Co-opted Novel: Propaganda (Original function? Uptake function? Both? Complex, but *some* function is operative).
          *   Private Poem: Propaganda (Functions for the self, reinforcing/processing ideology; if discovered, functions socially).
          *   False Film: Propaganda (Functions to spread harmful ideology, regardless of craft; beauty may enhance efficacy).

  3.  **The Inherent Perspective (Semantic Propaganda) Thesis:**
      *   **Assertion:** Art *necessarily* presents a perspective on the world (how things are, were, could be, should be). This act of representation is inherently an act of advocacy for that perspective, making it propaganda in a broad sense.
      *   **PT:** S | **"Is":** Stip (Representation *defined* as advocacy) OR Emp (Observation that representation *functions* as advocacy) | **Upshot:** Diag (Debunks claims of neutrality/objectivity), *Can imply* Norm (Artists *should* own their perspective/advocacy)
      *   **Triviality/Defensibility:** T (if Stip: defining representation as advocacy). SD (if Emp: observing representation *functions* as advocacy, though not always successfully or primarily).
      *   **Pejorative:** Deflationary. "Propaganda" loses its specific negative connotation, becoming nearly synonymous with "having a point of view." Weak debunking force.
      *   **Beauty/Truth Filter:** Compatible. Beautiful/truthful art is art *with* a perspective/advocacy. Bad art has a perspective poorly rendered or false.
      *   **Symmetry/Uptake:** Symmetrical. **Supports P?** Weakly. Recognizes all art has perspective, but doesn't specify *what* perspective artists *should* adopt. Requires strong normative addendum. **Supports C?** Partially. Collapses the idea of art *without* a perspective, but leaves room for distinct aesthetic *criteria* (how *well* the perspective is rendered) alongside political evaluation of the perspective *itself*.
      *   **Hard Cases:**
          *   String Quartet: Propaganda (Advocates for a structure of feeling, a sonic worldview).
          *   Landscape Painting: Propaganda (Advocates a vision of nature/human relation).
          *   Co-opted Novel: Propaganda (Original perspective? Uptake perspective? Primarily the encoded perspective).
          *   Private Poem: Propaganda (Represents the poet's perspective to themselves).
          *   False Film: Propaganda (Advocates a false perspective).

  4.  **The Beauty/Truth Filtered Propaganda Thesis (Reconstructing Du Bois):**
      *   **Assertion:** Art *is* (by definition) *successful* propaganda. "Propaganda" here means communication designed to convey truth (about the Black experience, humanity, society) in a form (beauty) that effectively moves the audience toward positive change (racial justice, understanding). Works failing aesthetically or truthfully are mere "propaganda," not Art.
      *   **PT:** Hybrid (I/S/F - Requires intent for truth/beauty/effect?; S - Represents truth; F - Serves liberation) | **"Is":** Stip (Art *defined* by this successful fusion) | **Upshot:** Strongly Norm (Art *must* be beautiful, truthful, *and* effectively serve uplift; this *is* its value)
      *   **Triviality/Defensibility:** QB (as a universal definition). SD *as a specific political aesthetic program* for marginalized groups. Falsely universalizes a specific (laudable) imperative.
      *   **Pejorative:** Neutral/Positive. "Propaganda" is reclaimed as potent, truthful, beautiful communication for justice. Debunks *art-for-art's-sake* but elevates *this kind* of propaganda.
      *   **Beauty/Truth Filter:** Core. This *is* the filter defining Art vs. mere propaganda.
      *   **Symmetry/Uptake:** Asymmetrical by Design. Dominant "art" promoting falsehoods or oppression is either bad art or mere propaganda (for bad ends). **Supports P?** Directly and strongly. Defines true Art *as* propaganda for truth/beauty/liberation. Obligates Black artists to this project. **Supports C?** Collapses distinction *within this definition*: Aesthetic success (beauty) and political/moral success (truth/effectiveness for uplift) are inseparable components of Art. Criticizing prose *is* criticizing political efficacy; criticizing politics *is* criticizing artistic merit.
      *   **Hard Cases:** (Judged by *this* standard)
          *   String Quartet: Art *only if* it conveys some profound human truth beautifully and moves listeners positively (debatable, often fails the "truth for uplift" bar in this specific framework).
          *   Landscape Painting: Similar high bar within this framework.
          *   Co-opted Novel: If originally intended as truthful/beautiful for liberation but co-opted, might still be Art if *successful* on its own terms. If originally evil propaganda, not Art.
          *   Private Poem: Likely not Art (lacks audience for effect).
          *   False Film: Not Art (fails truth).

  **Secure vs. Contested in Du Bois Scholarship:**

  *   **Secure:**
      *   **Rejection of Art-for-Art's-Sake:** Du Bois unequivocally condemned the idea that Black art could or should be divorced from the political struggle for racial equality and the truthful representation of Black life.
      *   **Commitment to Art as a Tool for Uplift:** He believed art had a crucial role to play in combating racism, fostering pride, changing white minds, and achieving justice. Art was a political weapon and a source of strength.
      *   **Beauty as Essential:** He insisted that propaganda, to be effective *as art*, must be beautiful. Clumsy, didactic pamphleteering wasn't sufficient.
      *   **Truth as Essential:** He demanded art represent the complexities and truths of Black experience, countering stereotypes and silences imposed by the dominant culture.
      *   **Context of 1926 Essay:** Written against the backdrop of the Harlem Renaissance and debates about the direction of Black art, explicitly arguing against both white demands for stereotype and purely aestheticist trends among Black artists/intellectuals.

  *   **Contested:**
      *   **Instrumentalism:** Is aesthetic value *wholly* subordinated to/instrumental for political goals (Strong Instrumentalism)? Or is beauty a *necessary co-equal* component of the artwork's value and political efficacy (Integrated Value)? His emphasis on beauty complicates pure instrumentalism. *(Scholarly debate: e.g., Reed vs. Zamir/Rampersad)*
      *   **Consistency:** Does his practice (e.g., the lyrical, complex, sometimes ambiguous *Souls of Black Folk*; his own fiction) always align with the seemingly more prescriptive 1926 essay? Does his later thought evolve? *(Significant debate)*
      *   **Universalism vs. Specificity:** Does "All Art is Propaganda" reflect a universal theory he believed applied to *all* art, or is it primarily a strategic, context-specific imperative *for Black artists* under oppression? The "beauty/truth" requirement and the essay's focus on the Black struggle strongly suggest the latter, but the slogan's phrasing is universal. *(Key area of interpretation)*
      *   **Nature of "Truth":** Is it empirical accuracy, emotional authenticity, a specific ideological standpoint, or something else? How flexible is it? *(Interpretive debate)*
      *   **Instantiation in Own Work:** Does *The Quest of the Silver Fleece* or *Dark Princess* perfectly exemplify the 1926 criteria? Often seen as didactic, raising questions about his own success in merging beauty/politics. *(Common critical observation)*

  **Addressing Your Complications & Epistemic Requests:**

  *   **(i) Pejorative vs. Neutral:** Interpretations 1 (Strong Intentional) and 2 (Functional) best preserve the debunking edge, exposing art as manipulative or serving power. Interpretation 3 (Semantic) is deflationary. Interpretation 4 (Beauty/Truth Filtered) reclaims the term positively.
  *   **(ii) Beauty-and-Truth Filter:** Interpretation 4 directly incorporates this. It **does drain the *universal debunking* bite** (it's not claiming *all* art is *bad* propaganda) but **retains a powerful *prescriptive and strategic* bite** specifically against apolitical aesthetics *for Black artists* and against dominant art that silences Black truth. It aligns with his objection to one-sided propaganda. *Your recollection is substantively correct; a decisive textual point would be Du Bois explicitly stating that art lacking beauty/truth is merely failed propaganda, not art.*
  *   **(iii) Symmetry and Uptake:** Only Interpretation 2 (Functional) is inherently symmetrical. Interpretation 4 is *asymmetrical by design*. Interpretation 1 is symmetrical but false. Interpretation 3 is symmetrical but weak. The **Poet's Normative Step** requires:
      *   The *asymmetry* of Interpretation 4, OR
      *   The *diagnosis* of Interpretation 2 + the *normative premise* that artists *should* consciously produce propaganda for liberation (leveraging the symmetry to show dominant art is propaganda), OR
      *   Interpretation 1 + the same normative premise (though this is weak due to falsity).
      *   Interpretation 3 alone provides insufficient grounds.
  *   **Epistemic Clarity:** Distinctions between secure/contested points are clearly marked above. Reconstructions (especially of the Beauty/Truth thesis and some hard case applications under specific theses) are explicitly presented as interpretations based on the logical implications of the slogan within Du Bois's known framework, not as verbatim citations. Where textual specifics would be decisive (e.g., Du Bois's exact wording on failed propaganda vs. art), the nature of the required evidence is described.

  This menu provides distinct, logically defined theses you can present to your advisor, demonstrating the slogan's argumentative elasticity and allowing you to analyze which interpretations actually do the work claimed by your classmate and the poet.
