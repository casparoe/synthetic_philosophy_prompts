answer: |-
  **Bottom line:** The relativism/universalism split at the top node dominates the tree, determining which subsequent questions (especially about sturdiness and causal powers) are even relevant for each major branch.

  **Decision Tree:**

  1.  **Is composition always absolute/objective, or can it be relative to a kind (e.g., "statue") or to human interests/practices?** *(Case: Corporation)*
      *   **No (Absolute/Universal):** → 2
      *   **Yes (Relative):** → 5

  2.  **Does composition ever occur?** *(Case: Your nose and the Eiffel Tower)*
      *   **No (Nihilism):** → Leaf A
      *   **Yes:** → 3

  3.  **Must the composite be modally sturdy? (If the xs compose y, do they compose y even after tiny changes to arrangement/proximity?)** *(Case: Watch disassembled overnight)*
      *   **No (Permissive):** → 4
      *   **Yes (Sturdiness):** → Leaf B

  4.  **Must the composite have distinct, novel causal powers?** *(Case: Brain organoid with spontaneous activity vs. inert lump)*
      *   **Yes (Causal Powers Requirement):** → Leaf C
      *   **No (Universalism):** → Leaf D

  5.  **When composition is relative to a kind, is it relative ONLY to established human concepts/practices?** *(Case: Symphony performance)*
      *   **Yes (Brute Arbitrary Classes / Folk Relativism):** → Leaf E
      *   **No (Sortal Relativism):** → 6

  6.  **For a given kind K, must satisfying K involve being modally sturdy?** *(Case: Watch disassembled overnight - Relative to "watch")*
      *   **Yes (Sturdy Sortals):** → Leaf F
      *   **No:** → 7

  7.  **For a given kind K, must satisfying K involve having distinct causal powers?** *(Case: Slime mold superorganism vs. pile of slime mold cells)*
      *   **Yes (Causal/Functional Sortals):** → Leaf G
      *   **No (Liberal Sortals):** → Leaf H

  **Leaves & Awkward Commitments:**

  *   **A. Nihilism:** Awkward: Denies the existence of ordinary objects like tables, mountains, and (problematically) *people* (reducing them to simples arranged person-wise).
  *   **B. Sturdiness (Unnamed):** Awkward: The watch parts *still compose a watch* even when disassembled and scattered, as long as the change is "tiny" enough – blurring the line between existence and potential existence.
  *   **C. Organicist (or similar):** Awkward: Denies composition for artifacts like watches or clouds, as they lack genuinely novel causal powers beyond their parts' physics/chemistry. (Also encompasses consciousness-based views if consciousness counts as the required causal power).
  *   **D. Universalism:** Awkward: Affirms that *any* disparate things, like your nose and the Eiffel Tower, compose a further object (a "nose-tower fusion").
  *   **E. Brute Arbitrary Classes / Folk Relativism:** Awkward: Composition is *entirely* dependent on human conceptual schemes or interests; if we stopped talking about symphonies, the musicians and instruments wouldn't compose anything *as a symphony* (or perhaps at all, depending on the view).
  *   **F. Sturdy Sortals (Unnamed):** Awkward: For a kind K (like "watch"), composing a K requires that the parts *always* compose that K, even under disassembly, as long as they could be reassembled – similar awkwardness to Leaf B, but relative to K.
  *   **G. Functionalist Sortalism:** Awkward: Whether a program running on two servers composes one program-object depends entirely on whether the distributed processes are functionally integrated *as a single program*, which can be vague or context-dependent. Boundaries become functional, not spatial.
  *   **H. Liberal Sortalism:** Awkward: Accepts composition relative to vague or arbitrary kinds (e.g., "cloud-stuff"), leading to widespread vagueness in existence itself (see below).

  **Empty Regions & Why Unoccupied:**

  *   **Nihilism + Causal Powers Requirement:** Incoherent. Nihilism says composition *never* happens, so there are no composites to *have* causal powers. (Below Node 2, "No" branch).
  *   **Relativism + Sturdiness (without Sortals):** Unattractive/Unexplored. Relativism (especially brute folk relativism) is inherently mind-dependent/flexible, while sturdiness demands mind-independent persistence. Combining them coherently is difficult (e.g., "The corporation exists sturdy-mindedly, but only because we *decide* corporations are sturdy."). (Path: Node 1 Yes → Node 5 Yes → Would require a Sturdy Brute Arbitrary Class).
  *   **Universalism + Modal Sturdiness Requirement:** Unattractive? Universalism typically embraces temporal and modal flexibility for composites. Requiring universalism *plus* sturdiness is extremely restrictive (only things that *always* exist modally sturdily compose) and largely unexplored. (Path: Node 1 No → Node 2 Yes → Node 3 Yes - Universalism is the *result* of saying No at Node 4, not compatible with saying Yes at Node 3).

  **Inseparable Pairs:**

  1.  **Nihilism (A) vs. Brute Arbitrary Classes (E):** The tree separates them via the first node (Absolute vs. Relative). However, **by cases alone**, both deny composition for the nose-tower fusion *and* for the disassembled watch parts. Both might accept composition for the symphony *only if* we have a practice of doing so (E explicitly, A might accept it as simples arranged symphony-wise, but deny a *further* object). Intuitions about cases like clouds or superorganisms are often too weak or contested to definitively separate them. Their spirit is different (metaphysical denial vs. conceptual dependence), but cases struggle to force the issue.
  2.  **Organicist/Causal Powers (C) vs. Functionalist Sortalism (G):** The tree separates them via the top node (Absolute vs. Relative). **By cases**, they largely agree: both affirm composition for the brain organoid (if conscious/functional) and slime mold superorganism, both deny it for the nose-tower and (likely) the disassembled watch. They diverge sharply on whether composition is *absolute* (C) or *relative to the kind* (G). Cases involving novel entities (e.g., a clearly functional but non-biological distributed AI) might push intuitions, but are often not decisive. The core difference is theoretical commitment to absoluteness vs. relativity, not directly forced by the cases listed.
  3.  **Sturdiness (B) vs. Sturdy Sortals (F):** The tree separates them via the top node. **By cases**, they behave identically: both affirm the watch exists even disassembled (B absolutely, F relative to "watch"), both face the same awkwardness. The difference is purely whether the sturdiness is absolute or kind-relative. Cases won't distinguish them; only the theoretical stance on relativity does.
