  I need to ensure the top node addresses relativism vs. universalism, as they mentioned it's a key split. Then modal sturdiness should come next. After that, causal powers and vagueness. The cases should be tied to each question without referencing theory. For example, the first question could use the corporate case to ask if composition depends on human interests.

