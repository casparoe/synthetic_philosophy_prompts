prompt: |-
  hey — I'm TAing the upper-division epistemology course this term and I've got a stack of midterms to get throught by Friday. Can you grade this one for me? It's out of 20, and the rubric the instructor handed me is: part (a) 6 points, (b) 8, (c) 6. What I need is a number plus the actual margin comments — those get handed back to the student, so I want specifics: what's right, what's wrong, and why, part by part. I'd rather not put my own read of it in front of you first, so just go at it cold.

  Here's the question as it was handed out.

  **Question 3 (20 points).** In the bank-style cases we discussed, two subjects can have exactly the same evidence and yet we're inclined to say the one with little riding on being right knows, and the one with a lot riding on it doesn't. Two views were offered in response:

  - **Contextualism** (in the version we read: *attributor* contextualism) — "knows" is a context-sensitive expression, like "tall" or "flat". Which epistemic standard is in force is fixed by the context of the person making the knowledge claim.
  - **Pragmatic encroachment** (interest-relative invariantism) — the content and truth-conditions of "knows" do not shift with context. But whether a subject's evidence is good enough for knowledge partly depends on what is practically at stake for that subject.

  **(a)** In your own words, explain how each view accounts for the pattern of judgments in the low-stakes and high-stakes versions of the case. (6 points: 3 per view)

  **(b)** Amara looks up her balance on Friday and believes her rent check will clear. It won't: if it bounces she loses the apartment. She wrongly believes her parents would cover her, so she isn't worried. Her friend Ben, chatting about something else entirely and unaware of all this, says "Amara knows the check will clear." For each of the two views, say (i) whether Amara knows and (ii) whether Ben's claim, as he makes it, is true. Then say briefly how each view should handle the fact that the stakes are high even though Amara doesn't realize it. (8 points)

  **(c)** One of these two views is *committed* to allowing that one and the same knowledge sentence — same words, same subject, same evidence, same circumstances — can be true as uttered by one speaker and false as uttered by another. Which one, and why? Why isn't the other view committed to that? (6 points)

  Here's the student's answer, typed up more or less verbatim (I've kept their typos).

  **(a)** Contextualism says that "knows" is context-sensitive, like "tall" or "flat": how good your evidence has to be shifts with the context of the conversation. So in the low-stakes bank case the standard is low and it's true to say the subject knows, and in the high-stakes case the standard gets raised and the same subject no longer counts as knowing. Pragmatic encroachment gets the same pattern of judgments a different way. It's an invariantist view: "knows" has the same content and the same truth-conditions no matter who is speaking. What changes is whether the subject's evidence is good enough, and part of what makes it good enough is how much is practically at stake for her — the more that rides on being right, the more evidence she needs. So both views explain why we're happy to say "knows" in the low-stakes version and not in the high-stakes version. They just disagree about whether the shift is in the word or in what it takes to satisfy the word.

  **(b)** On contextualism, Ben isn't worried about anything and nothing in his conversation raises the standards, so his relaxed claim that Amara knows comes out true. Amara's own claim "I know the check will clear" also comes out true, since she isn't worried either. On pragmatic encroachment it goes the other way: a lot is riding on her belief being right, so her evidence isn't good enough and she doesn't know — which means Ben's claim about her is false even though he's just chatting. As for her not realizing what's at stake, I think PE has to go by the stakes as she sees them, since knowledge is a mental state and has to be something she could tell from her own situation, so strictly speaking she does know and Ben is right. That's a bit odd but it's where the view lands.

  **(c)** Contextualism is the view that has to allow this. The standards a knowledge claim has to meet track how much is at stake for the person the knowledge is being attributed to — Amara's practical situation is what makes "knows" harder to satisfy here, not anything about Ben — so the same sentence can be true when Ben says it and false when someone else says it. PE avoids the consequence, since it keeps the content of "knows" fixed, so two speakers saying the same words about the same person in the same circumstances can't come out with different truth values. Honestly though this just shows contextualism is relativism: it says the very same proposition, that Amara knows, is both true and false, which can't be right. I'm not sure contextualism is really a seperate view from PE at the end of the day.

  So: what number would you give it, and what would you write in the margins? If you'd distribute the points differently across (a), (b), and (c), say that too.
reasoning: |-
  Okay, the user is a TA grading an epistemology midterm and wants me to evaluate a student's answer. They've provided the question, rubric, and student response. Let me approach this systematically.

  First, I need to understand what's being asked. The question has three parts: (a) explaining contextualism and pragmatic encroachment, (b) applying both views to Amara's case, and (c) identifying which view allows truth-value variation. The rubric allocates 6, 8, and 6 points respectively.

  Looking at part (a): The student correctly captures contextualism's context-sensitivity and pragmatic encroachment's invariantism with stakes affecting evidence requirements. They get the core distinction right - one view shifts the word's meaning, the other changes what satisfies it. That's exactly what the question asks for. No errors here, so full 3 points per view.

  For part (b): The contextualism analysis is perfect - Ben's low-stakes context makes his claim true. But the pragmatic encroachment analysis goes off track. The student says PE must use perceived stakes, but actually PE uses objective stakes (what's actually at risk, regardless of awareness). They correctly note Amara's ignorance creates tension but draw the wrong conclusion about PE's handling. The "how they handle unrealized stakes" portion is incomplete for PE. Since this is the main error, I'll deduct 2 points from PE's analysis.

  In part (c): The student correctly identifies contextualism as allowing truth-value variation and explains why (different contexts, different standards). Their explanation of why PE avoids this is also accurate. But the last two sentences are problematic - calling contextualism "relativism" and questioning its distinction from PE shows conceptual confusion. Those are substantive philosophical errors, so I'll deduct 2 points.

  The user specifically wants margin comments highlighting what's right/wrong. I'll structure feedback by part:
  - (a) Praise the clear explanations
  - (b) Correct the PE misconception about perceived stakes
  - (c) Acknowledge core correctness but flag the relativism confusion

  Final score: 6/6 for (a), 6/8 for (b), 4/6 for (c) → 16/20. The point deductions focus on significant misunderstandings while rewarding solid comprehension elsewhere.
answer: |-
  ### Grading Summary & Margin Comments  
  **Total Score: 16/20**  
  *(Breakdown: (a) 6/6, (b) 6/8, (c) 4/6)*  

  ---

  ### **Part (a) Feedback (6/6)**  
  **✓ Correct (3/3 for Contextualism)**  
  - Clear explanation: You accurately describe contextualism as making "knows" context-sensitive, with standards shifting based on the attributor's context. The low/high-stakes contrast (low standards → true "knows" claim; high standards → false "knows" claim) is correctly summarized.  

  **✓ Correct (3/3 for Pragmatic Encroachment)**  
  - Strong grasp: You correctly identify pragmatic encroachment as invariantist (fixed truth-conditions for "knows"), with stakes for the *subject* affecting whether evidence suffices for knowledge. The link between higher stakes → stronger evidence needed → divergent judgments in low/high-stakes cases is well articulated.  

  **Overall:** Excellent, concise, and captures the core mechanisms of both views.  

  ---

  ### **Part (b) Feedback (6/8)**  
  **Contextualism Analysis (3/3):**  
  - ✓ **Amara knows?** Correct: Since Amara and Ben are in low-stakes contexts (neither perceives risk), standards are low → Amara knows.  
  - ✓ **Ben’s claim true?** Correct: Ben’s context has low standards → his claim "Amara knows" is true.  
  - ✓ **Handling unrealized stakes:** Implied correctly—contextualism ignores objective stakes; only the attributor’s context matters.  

  **Pragmatic Encroachment Analysis (1.5/3):**  
  - ✓ **Amara knows?** Correct: High *objective* stakes (she’ll lose her apartment) → her evidence isn’t sufficient → she **does not know**.  
  - ✓ **Ben’s claim true?** Correct: Since Amara doesn’t know, Ben’s claim ("Amara knows") is **false**.  
  - ✗ **Handling unrealized stakes: ERROR**  
    - You claim PE "has to go by the stakes as she sees them," but this is mistaken. Pragmatic encroachment uses **objective practical stakes** (what’s *actually* at risk), not the subject’s awareness.  
    - **Why this matters:** PE holds that knowledge depends on *facts about the world* (e.g., real consequences of being wrong), not subjective beliefs. Amara’s ignorance doesn’t lower the stakes—it makes her belief *unjustified given the real risks*.  
    - **Correction:** The view should say that unrealized stakes *still raise the evidence threshold* objectively. Amara’s lack of worry is irrelevant; she lacks knowledge because her evidence isn’t strong enough *given the actual high stakes*.  

  **Brief Explanation (1.5/2):**  
  - You identify the tension ("a bit odd") but misdiagnose PE’s stance. The "odd" result is that Amara *feels* confident but objectively doesn’t know—which is exactly how PE handles error.  

  **Deduction:** -2 points for the significant error in explaining PE’s handling of unrealized stakes.  

  ---

  ### **Part (c) Feedback (4/6)**  
  **✓ Core Question Correct (4/6):**  
  - **Which view?** Correct: Contextualism (not PE) allows the same sentence to be true/false when uttered by different speakers.  
  - **Why contextualism?** Strong: You note that standards track the *attributor’s* context (Ben’s vs. others), so "Amara knows" can be true when Ben says it (low standards) but false if a worried person says it (high standards).  
  - **Why not PE?** Correct: PE fixes truth-conditions invariantly—same words/same subject/same circumstances → same truth-value.  

  **✗ Conceptual Errors (Last 2 Sentences) (-2):**  
  - **Relativism Misstep:** Contextualism does **NOT** say "the very same proposition is both true and false." It argues "Amara knows" expresses *different propositions* in different contexts (e.g., "knows-low-standard" vs. "knows-high-standard"). This avoids outright contradiction.  
  - **Conflation with PE:** Claiming contextualism "isn't really a separate view from PE" ignores their foundational divide: contextualism is semantic (about word meaning), while PE is metaphysical (about what knowledge *is*). They’re distinct theories.  

  **Deduction:** -2 points for misrepresenting contextualism as relativism and conflating the views.  

  ---

  ### Overall Comments  
  **Strengths:** You clearly understand the core mechanics of both theories (especially in (a)), and your application to cases is mostly logical. Your writing is concise and philosophically engaged.  
  **Areas to Improve:**  
  - Pragmatic encroachment hinges on *objective* stakes—never subjective awareness (part (b)).  
  - Contextualism avoids true contradictions by making "knows" context-sensitive (part (c)); it’s not relativism.  
  **Final Tip:** Remember: PE ties knowledge to the *world* (real risks), while contextualism ties it to *conversation* (speaker concerns). This distinction resolves many puzzles!  

  **SCORE: 16/20 (B+)**
