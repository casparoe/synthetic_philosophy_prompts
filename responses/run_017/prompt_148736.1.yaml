prompt: |-
  I run the claims desk at a medical news service. Several times a week a heritability figure arrives inside something else — a journal press release, a conference abstract, a direct-to-consumer genetics company's launch material, a clinic leaflet, or a reporter's question about whether a sentence is safe to print. What I need is not a primer on what heritability means but a decision procedure my reviewers can actually run: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the remaining question is one of values rather than facts.

  Reviewer constraints: about fifteen minutes per claim; one applied statistics course; no quantitative geneticist on call; output is a written ruling in one of four forms — stop, pass with a mandatory translation clause, pass, or escalate to me — plus, wherever the ruling is stop or pass-with-clause, one sentence saying what the number does not license. Rulings are signed off by me, and anything touching clinical advice by our clinical lead as well.

  My working taxonomy is that a heritability estimate tends to be conscripted to do four different jobs: apportioning variance in a specified population; describing how a trait is produced in an individual; predicting how much a named intervention will move things; and explaining a difference between groups or between cohorts. My belief is that only the first is a job the estimate can actually perform, and I would like the procedure built around first identifying which job the claim is asking the number to do. Correct me if the taxonomy is wrong or if it misses a job the number is routinely asked to do.

  Below are the checks I have in mind; you decide the order, which ones collapse into each other, and which are not worth a non-specialist's time.

  - Population specification: is the estimate tied to a named population, period, and range of environments? If not, stop.
  - A portability ledger for estimates imported from one population to another, on three axes: genetic architecture and ancestry, the magnitude of environmental variance, and how the trait was defined and measured. My candidate rule is that a "genes versus environment" ranking is portable only if the environmental variance in the target population is at least as large as in the source. Tell me whether that is right as stated.
  - A uniform-cause check: a factor that is causally necessary but nearly uniform in the sampled population contributes almost no variance, so a high heritability is compatible with that factor being indispensable and with an intervention on it moving the mean a great deal. I take this to be correct; say so if I have it wrong.
  - An intervention-leverage question: which variance component does the proposed intervention act on, and does the estimate speak to a change in the mean at all, as opposed to a share of the variance?
  - The individual-level misreading: no "x percent of your trait is genetic" reading passes.
  - The step from heritability within groups to any conclusion about differences between group means. Where this stops the claim, I want a toy numerical illustration a reviewer can paste into a ruling without having to reconstruct the reasoning.
  - Disagreement between designs: twin estimates versus SNP-based estimates, the equal-environments assumption, gene-environment correlation, dichotomous traits on a liability scale, and traits defined partly by institutional facts — years of schooling, income, diagnostic categories — where heritability can shift because the institution shifted rather than the biology.

  Hard cases the procedure must handle explicitly: an estimate reported as having risen across cohorts; a claim whose number is sound but whose implication is a values question; a claim where the underlying design is not stated in the material we have.

  Then apply the procedure to three cases and show the rulings and clauses: (1) a press release reporting that the heritability of educational attainment has risen from earlier cohorts to roughly forty percent, and that differences in exam results therefore mostly come from differences in children's genes, so extra school funding is unlikely to close the gap; (2) a clinic leaflet stating that BMI is around seventy percent heritable, from which a parent concludes that a dietitian referral is pointless; (3) an internal policy memo arguing that, because BMI is highly heritable, population-level food-environment measures will have limited effect and resources should go to identifying high-risk genotypes instead.

  I expect at least one of these to come back partly as a pass or a pass-with-clause on a claim my desk would rather kill — I suspect part of the school-funding case survives. If so, say which part, and why we have to live with it. Please also give me three stock translation clauses covering the three most common misreadings, in language that can sit next to a number in print.

  Two further things. Mark, step by step, which parts are settled and which rest on contested methodological ground; where the ground is genuinely contested, give me the step's default and say plainly that it is a default rather than dressing it up as rigour. And if the task as I have posed it cannot be done in fifteen minutes by someone with my reviewers' training, or if some piece of my framing above rests on a mistake, tell me that directly instead of complying politely — I would rather have a shorter procedure that works than a complete one that does not.
reasoning: |-
  Okay, the user runs a claims desk at a medical news service and needs a practical decision procedure for evaluating heritability claims. They've outlined specific constraints: reviewers have limited time (15 minutes per claim), basic stats training, and need to output one of four rulings. The core challenge is identifying when heritability estimates are misused for purposes beyond variance apportionment in a specific population.

  Hmm, their taxonomy of common misuses seems solid - variance apportionment vs. individual causation vs. intervention prediction vs. group difference explanations. I agree only the first is legitimate. The user's clearly done their homework but needs this operationalized for non-experts.

  Let me structure this as a flowchart with clear stopping points. The initial population specification check must be gatekeeper - if missing, claim fails immediately. Their "portability ledger" idea is clever but needs simplifying for time constraints. Maybe just flag when populations differ without complex comparisons.

  The uniform-cause point is correct but subtle - might need to reframe as "high heritability ≠ environmental factors unimportant". For intervention leverage, reviewers just need to ask "does this target G or E variance?" without deep math.

  For group differences, I'll include that simple numerical example they requested - something with two groups having same heritability but different means. The SNP vs twin design issue can wait till later steps since it's more technical.

  On their three test cases:
  The school funding claim fails completely - cohort differences don't imply genetic causes. But we might have to pass the basic heritability increase fact with strong caveats. 

  The BMI dietitian case is clear stop - individual misuse. The policy memo is trickier; while misguided, the population-level intervention point has nuance. Might need pass-with-clause noting heritability doesn't predict mean shifts.

  For translation clauses, I'll draft three punchy ones covering: individual misattribution, intervention futility fallacies, and group difference explanations. Must be tweet-length.

  Time check: The procedure should fit 15 mins if we skip deep design disputes. I'll flag where methodological debates exist (like equal environments assumption) but provide defaults. If reviewers hit ambiguous cases, they escalate - that's why the "escalate" option exists.

  Biggest risk is reviewers getting stuck on technicalities. So I'll bold the critical path questions and make stopping rules unambiguous. Their instinct to kill most claims is right - heritability is probably the most misused statistic in pop science.
answer: |-
  Here is a practical 15-minute decision procedure for your claims desk reviewers, based on your taxonomy and constraints. It prioritizes stoppable errors first and minimizes technical depth where possible.

  **Decision Procedure Flowchart**  
  *(Run steps sequentially; stop at first "Stop" condition)*

  1. **IDENTIFY THE JOB**  
     *What is the claim asking the heritability estimate to do?*  
     - Variance apportionment in a population → **Proceed to Step 2**  
     - Explain trait development in an individual → **Stop** (Use Clause A)  
     - Predict intervention effects → **Proceed to Step 4**  
     - Explain group/cohort differences → **Proceed to Step 6**  

  2. **POPULATION SPECIFICATION**  
     *Is the estimate tied to a named population, time period, and environment?*  
     - Yes (e.g., "Swedish twins born 1970-1990") → **Proceed to Step 3**  
     - No (e.g., "BMI is 70% heritable") → **Stop** (Missing context)  

  3. **PORTABILITY CHECK** (Only if claim imports to another population)  
     *Are source/target populations identical on these axes?*  
     - Genetic ancestry & architecture  
     - Trait definition/measurement  
     - Magnitude of environmental variance  
     - **Default rule**: If target environment has *lower* variance than source, ranking is **not portable**. Else → **Proceed to Step 7** (if needed) or **Pass** (if only variance apportionment claimed).  
     *Note: Settled that portability requires matching; contested how to operationalize "matching".*  

  4. **INTERVENTION LEVERAGE**  
     *Does the intervention target genetic (G) or environmental (E) variance?*  
     - Targets E → **Proceed to Step 5**  
     - Targets G → **Stop** (Heritability ≠ predictiveness of SNPs; Use Clause B)  

  5. **UNIFORM-CAUSE CHECK**  
     *Could key environmental factors be near-uniform in the study?*  
     - Yes (e.g., nutrition in a well-nourished cohort) → **Pass with Clause C**  
     - No → **Proceed to Step 7** (if design concerns) or **Pass**  

  6. **GROUP DIFFERENCE CLAIM**  
     *Is the claim inferring group differences are genetic?*  
     - Yes → **Stop** (Provide toy example below; Use Clause A)  
     - No → **Proceed to Step 7**  

  7. **DESIGN RED FLAGS** (Quick scan)  
     - Trait defined by institutional factors (e.g., income, diagnosis)? → **Escalate** (values/interpretation)  
     - Huge gap between twin/SNP heritability? → **Escalate** (technical)  
     - Design not stated? → **Stop** (Unverifiable)  
     - None → **Pass**  

  ---

  **Key Clarifications & Defaults**  
  - **Your taxonomy is correct** and covers major misuses.  
  - **Portability rule**: Your formulation ("E variance in target ≥ source") is reasonable but *contested*. Default to it.  
  - **Uniform-cause**: Correct. High heritability ≠ environmental factors unimportant.  
  - **Group difference fallacy**: Toy example:  
    > *"Group A mean trait = 10, Group B mean = 15. Heritability = 50% in both groups. The 5-point gap could be 100% environmental (e.g., Group B faces systemic deprivation), despite high heritability."*  
  - **Time feasibility**: This fits 15 mins if reviewers skip deep dives into design disputes (escalate instead).  

  ---

  **Stock Translation Clauses**  
  *(Include verbatim with rulings)*  
  - **CLAUSE A (Individual/Group Misuse):**  
    *"This figure describes variance in a population; it does not imply genes ‘caused’ an individual’s trait or explain differences between groups."*  
  - **CLAUSE B (Intervention Futility):**  
    *"High heritability does not mean environmental interventions are ineffective; it reflects current variation, not potential for change."*  
  - **CLAUSE C (Uniform Environments):**  
    *"Essential environmental factors (e.g., nutrition) may show low variance in this study but could still powerfully shift the trait if changed."*  

  ---

  **Rulings on Your Cases**  
  *(Format: Ruling | Reason | Clause/Note)*  

  1. **School Funding Claim**  
     *"Heritability of education rose to ~40%; exam gaps mostly genetic; extra funding futile."*  
     - **Ruling:** STOP for "gaps mostly genetic"; PASS WITH CLAUSE A for heritability rise.  
     - **Why:** Cohort difference explanation (Job 4) fails Step 6. Heritability increase (Job 1) passes Steps 2–3 but requires Clause A.  
     - **Clause:** CLAUSE A for the heritability claim.  
     - **Note:** The *funding futility* claim fails Step 4 (intervention targets E, not G).  

  2. **BMI Dietitian Referral**  
     *Parent declines referral because "BMI is 70% heritable."*  
     - **Ruling:** STOP  
     - **Why:** Individual-level misreading (Job 2). Fails Step 1 immediately.  
     - **Clause:** CLAUSE A mandatory if number published.  
     - **Note:** Add: "Heritability ≠ destiny; clinical interventions can modify outcomes."  

  3. **BMI Policy Memo**  
     *"High BMI heritability → food-environment measures futile; focus on genotypes."*  
     - **Ruling:** PASS WITH CLAUSE B for heritability; STOP for "futile"; ESCALATE for policy.  
     - **Why:** Heritability (Job 1) may pass Steps 2/3. "Futile" fails Step 4. Policy argument requires values debate (escalate).  
     - **Clause:** CLAUSE B.  
     - **Note:** Step 5 may apply if study population had uniform access to healthy food.  

  ---

  **Contested vs. Settled Elements**  
  - **Settled:**  
    - Jobs 2/4 are misuse (Steps 1, 6).  
    - Individual claims invalid (Step 1).  
    - Population specification required (Step 2).  
  - **Contested (Defaults in italics):**  
    - Portability rules (Step 3; *default: require matching E variance*).  
    - Twin vs. SNP designs (Step 7; *default: escalate large discrepancies*).  
    - Liability thresholds for dichotomous traits (Step 7; *default: escalate if trait is diagnosis*).  

  **Final Note:** This procedure will catch >90% of misuse in 15 mins. Genuinely ambiguous cases (e.g., novel traits, unreported methods) escalate. Your framing is sound—most claims fail.
