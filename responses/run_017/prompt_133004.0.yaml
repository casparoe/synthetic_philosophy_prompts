prompt: |-
  I spent about thirty-five years as an atmospheric chemist — a lot of it messing about with error propagation, instrument drift, and the question of when to stop believing your own numbers — and since retiring I've been sitting in on a philosophy reading group at the local university. We've been going through consequentialism recently, and I keep coming back to something from my own world that I think is a real, existing practice with an implicit theory buried inside it. I'd like help digging the theory out.

  The practice is the randomised controlled trial, as actually run. Four features of it:

  - You are only supposed to enrol patients when the expert community is genuinely uncertain which arm is better. If people already knew, running the trial wouldn't just be pointless, it would be unethical.
  - Given that uncertainty, you don't give people the arm with the best point estimate. You randomise.
  - The protocol pre-registers its primary endpoints at a fixed horizon — 90-day mortality, say — and the downstream stuff nobody can track (effects on the patients' families and careers, twenty-year health effects, the way the published result shifts prescribing habits for a decade) simply isn't counted. It's off the protocol, so it's off the books.
  - And the trial doesn't run to its planned end if a data monitoring committee sees one arm pulling clearly ahead. At some point uncertainty stops being decision-relevant and you stop flipping coins.

  So uncertainty is a precondition of the practice being permissible at all; under uncertainty the practice deliberately refuses to maximise; it has a threshold past which uncertainty stops mattering; and it cuts the causal chain off at the protocol horizon.

  That strikes me as interesting because everything else I've seen in the policy and charity world does the opposite: rank the options by best estimate, hand the money to whatever came out top, and treat anyone who suggested tossing a coin as having abandoned the job. Medicine tosses coins with people's actual treatment; a government or a foundation wouldn't dream of it.

  So here's what I want. Reconstruct the implicit theory of rational choice under uncertainty that this practice only makes sense under. In particular: does it presuppose that cluelessness about downstream effects is a reason to stop trying to maximise and hand the decision to a procedure instead? Does the early-stopping rule presuppose that there is a sharp point at which ignorance becomes decision-irrelevant — and if so, is that compatible with the standard worry that our long-run effects are not just unknown but in some sense unmanageable, with error bars that don't shrink? And what about the truncation: is the practice presupposing that untracked effects are genuinely worth zero, or just that they're unusable, and is there a difference that matters?

  Some things I'd specifically like you to deal with. First, my reading group's obvious objection: randomisation in trials is justified by the knowledge the trial produces, by the expected benefit to future patients, not by any view about what ignorance does to choice. If that's right the practice may presuppose much less than I think, and I'd like you to say how much less. Second, distinguish what the practice strictly presupposes from what it merely fits nicely with — I suspect several quite different theories would license it, and I want to know where it's genuinely underdetermined. Third, take the thing I've started calling the equipoise rule — when the spread of your outcome estimates across the live options is smaller than your uncertainty about the estimates themselves, don't maximise, defer to a chance procedure — and tell me what a consequentialist would actually have to change in day-to-day decision making if they adopted it for, say, long-termist or high-uncertainty giving. Would it collapse into maximising under some descriptions? Would it end up licensing things no one would accept?

  Please don't give me a reading list or point me at papers — I can't get at half of them and I'd rather you just reasoned it out.
reasoning: |-
  Okay, let me tackle this atmospheric chemist's query. They've spent 35 years in atmospheric chemistry, dealing with error propagation and instrument drift, and now they're in a philosophy group focusing on consequentialism. Their main interest is in the implicit theory of rational choice under uncertainty in randomized controlled trials (RCTs). 

  First, I need to unpack the four features of RCTs they mentioned: genuine uncertainty as an ethical requirement, randomization instead of maximizing based on point estimates, pre-registered endpoints that ignore downstream effects, and early stopping when one arm is clearly better. The user contrasts this with typical policy/charity decisions that always maximize based on best estimates. Their core question is about the underlying theory that makes RCTs sensible, especially regarding how ignorance affects decision-making.

  The user raises specific points: whether the knowledge gain justifies randomization (not just ignorance), distinguishing necessary presuppositions from compatible theories, and applying the "equipoise rule" to areas like long-termist giving. They want reasoning, not references.

  Starting with equipoise. The user’s reading group argues that RCT randomization is justified by future knowledge, not ignorance. But the user senses that current uncertainty directly shapes the decision to randomize. I should reconcile these. Maybe equipoise requires that current uncertainty makes randomization permissible, while future benefits make it obligatory. Both are necessary: without equipoise, the trial is unethical; without knowledge gain, it's pointless. 

  Next, the implicit theory. RCTs seem to reject maximization under uncertainty. Why? Perhaps because point estimates are unstable when uncertainty is high. Maximizing based on noisy data could lead to harmful choices. The protocol's fixed horizon suggests that beyond a certain point, outcomes are incalculable, so they’re excluded. This isn’t saying they’re worthless but that they’re epistemically inaccessible. The early stopping rule implies that uncertainty isn’t a continuum; there’s a threshold where evidence becomes decisive enough to act.

  For the equipoise rule in other contexts, like charitable giving. Applying randomization when options have overlapping uncertainties might prevent overconfidence in flawed estimates. But in high-stakes decisions, flipping a coin could seem irresponsible. However, if uncertainty is high enough, maybe it’s more rational than pretending to know. The key is setting thresholds for when uncertainty is too great to maximize.

  Distinguishing presuppositions from compatible theories. RCTs strictly require that uncertainty justifies randomization and that endpoints must be measurable. But different ethical frameworks could support this. For example, a consequentialist might argue it maximizes long-term knowledge, while a deontologist might emphasize equity in subject treatment. The practice is underdetermined regarding why we value knowledge or how we set uncertainty thresholds.

  Downstream effects being "worth zero" versus "unusable." The protocol excludes them not because they have no value but because they can’t be reliably measured. In consequentialist terms, this is pragmatic; including them would make trials infeasible. But it risks ignoring significant effects, which is a trade-off.

  Applying equipoise to long-termist giving. If uncertainties are high and options overlap, randomization might be better than maximizing on shaky forecasts. But opponents might argue it wastes resources. The user needs to consider if the threshold for equipoise can be defined outside medical contexts. It might collapse into maximization if one option is slightly better, or lead to unacceptable choices if randomizing high-stakes decisions.

  Overall, the implicit theory prioritizes manageable uncertainty, thresholds for action, and procedural fairness when knowledge is insufficient. For consequentialists, adopting this means recognizing when uncertainty is too high to maximize and using random procedures, which could change decision-making in unpredictable domains.
answer: |-
  The RCT practice you describe *does* reveal a fascinating, implicit theory of rational choice under uncertainty, distinct from naive maximization. Let's excavate it by addressing your core questions, the reading group's objection, and the equipoise rule's implications.

  **The Implicit Theory: "Procedural Rationality Under Bounded Epistemic Legitimacy"**

  This practice presupposes a framework where:

  1.  **Epistemic Legitimacy is Bounded:** Rational action requires acting within a domain where our knowledge claims (estimates, models) have sufficient epistemic legitimacy. This legitimacy is compromised by:
      *   **High Parameter Uncertainty:** When credible intervals for outcomes are wide and overlapping ("genuine uncertainty" for enrollment).
      *   **Ignorance of Downstream Effects:** When causal chains become too complex, long-term, or context-dependent to model reliably ("off the protocol").
      *   **Unmanageable Error Propagation:** When uncertainty accumulates non-linearly or interacts with unknown unknowns, preventing reliable point estimates ("when to stop believing your numbers" resonates here).

  2.  **Maximization Requires Legitimacy:** Maximizing based on point estimates is only rationally or ethically permissible when epistemic legitimacy is sufficiently high. Under high uncertainty/ignorance, maximizing is:
      *   **Epistemically Arrogant:** It pretends to knowledge we demonstrably lack.
      *   **Practically Unreliable:** The "best" point estimate is highly unstable and likely misleading.
      *   **Potentially Unfair/Unjust:** It arbitrarily favors one option based on noisy data, lacking justification.

  3.  **Procedural Fairness as the Fallback:** When epistemic legitimacy is too low for responsible maximization, the rational/ethical imperative shifts:
      *   **From Substance to Procedure:** The focus moves from *what* outcome to choose to *how* the choice is made.
      *   **Randomization as Fair Process:** Random allocation becomes the default fair procedure under radical uncertainty about comparative effectiveness. It treats options symmetrically and avoids imposing arbitrary choices based on insufficient evidence. It embodies a form of epistemic humility and equity among the uncertain options.
      *   **Equipoise as the Trigger:** The condition where credible intervals significantly overlap *defines* the zone of insufficient legitimacy, mandating the shift to procedural fairness (randomization).

  4.  **Thresholds of Decisiveness:** Epistemic legitimacy isn't binary, but decisiveness is treated as threshold-based:
      *   **Early Stopping Rule:** This presupposes that uncertainty *can* become decision-irrelevant *before* vanishing. It rejects the idea that we must always act under infinite uncertainty. There's a point where evidence (even imperfect) is strong *enough* that maximizing (choosing the leading arm) is more responsible than continuing the procedure (randomization). This *is* compatible with acknowledging long-run unmanageability – the stopping rule applies specifically to the *protocol-defined, measurable* endpoint. It says: *For this specific, bounded decision (which treatment arm *now*?), we have reached sufficient legitimacy to act.* It doesn't claim global omniscience.

  5.  **Horizon Truncation - Unusable, Not Worthless:** The pre-registration and fixed horizon presuppose that:
      *   **Untracked Effects are Unusable:** They cannot be incorporated into a rational decision calculus *for this specific procedure* because they are epistemically inaccessible or unmanageably uncertain within the trial framework. The trial deliberately carves out a bounded domain of *manageable* epistemic legitimacy.
      *   **Not Worth Zero:** The practice does *not* presuppose these effects have zero value. It presupposes they *cannot be reliably estimated or compared within the decision procedure*. The value is acknowledged implicitly (why else care about treatments?) but deemed operationally irrelevant for *this specific, bounded choice* under *this specific procedure*. The crucial difference is between *ontological value* (likely non-zero) and *epistemic usability* (effectively zero *for the calculation*).

  **Addressing the Reading Group's Objection (Knowledge Justification)**

  Your reading group is partially right, but crucially incomplete:

  1.  **Both are Necessary:** The practice *requires* both conditions:
      *   **Current Equipoise (Uncertainty):** Makes randomization *ethically permissible* for the *current* participants (otherwise, you'd be knowingly giving inferior treatment).
      *   **Future Knowledge Gain:** Makes the trial *ethically obligatory* and *purposeful* (otherwise, it's pointless risk/inconvenience). One justifies *how* we treat current subjects; the other justifies *why* we run the trial at all.
  2.  **Uncertainty Directly Shapes the Choice Procedure:** Even if the *ultimate justification* for the trial is future knowledge, the *operational rule for current treatment allocation* under equipoise is dictated by the *current* state of uncertainty. The rule says: "Given *this current ignorance* about what's best *for you, right now*, the fair/least arbitrary way to assign treatment is randomly." The future benefit doesn't change the *procedural rule* applied to the current uncertain choice; it justifies enduring that procedure. The rule itself ("when uncertain, randomize") *is* a response to ignorance.

  **Presuppositions vs. Compatibility**

  *   **Strictly Presupposed:**
      *   Maximization requires sufficient epistemic legitimacy.
      *   High uncertainty/ignorance undermines this legitimacy for substantive choice.
      *   A fair procedure (randomization) is the rational/ethical fallback under such illegitimacy.
      *   Epistemic legitimacy for a specific, bounded decision can reach a pragmatic threshold of decisiveness.
      *   Effects beyond a defined, manageable epistemic horizon are unusable *for that specific decision procedure*.
      *   Equipoise (overlapping credible intervals) is the operational indicator triggering the shift from maximization to procedure.
  *   **Compatible (Underdetermined):**
      *   *Why* procedural fairness? Is it intrinsic (deontic right) or instrumental (best expected outcome under ignorance, avoids bias)? RCTs *fit* both.
      *   *Exactly how* the decisiveness threshold is set. Frequentist (p-values), Bayesian (posterior probabilities), decision-theoretic (cost of error). The practice is agnostic.
      *   *The ultimate ethical foundation.* Rule Consequentialism (following this procedure *generally* produces best outcomes)? Contractualism (procedure reflects fair terms of cooperation)? Deontology (duty of fairness under ignorance)? The practice is a tool usable by various theories.
      *   *The nature* of the "unusable" long-term effects. Are they genuinely incalculable, or merely too expensive to calculate? The practice only requires they are *treated as* unusable.

  **The Equipoise Rule Applied: Consequences for Consequentialism**

  Adopting "when outcome estimate spread < uncertainty, defer to procedure (e.g., randomize)" in high-uncertainty domains like long-termism or charity would indeed be radical:

  1.  **Collapse into Maximizing?** Sometimes:
      *   **Low Uncertainty:** If uncertainty shrinks relative to spread (e.g., clear frontrunner), it collapses to maximizing – as intended.
      *   **High Stakes Might Inflate Uncertainty Perception:** Consequentialists might argue that extreme stakes make *any* uncertainty about being suboptimal unacceptable, pushing them towards maximizing even under apparent equipoise ("We *must* try for the best!"). The rule forces humility: "No, our uncertainty is too high to justify that gamble."
      *   **Defining the "Option Set":** Crucial. Defining broad categories (e.g., "global health" vs. "AI safety") might show equipoise, forcing random allocation *between categories*. Defining narrow interventions within a category might show spreads exceeding uncertainty, allowing maximizing *within* the category. The rule pushes for careful scoping of the choice.

  2.  **Licensing the Unacceptable?** Potentially, but revealingly:
      *   **Flipping Coins for Lives?** Yes, exactly like RCTs. In high-uncertainty, high-stakes domains (e.g., allocating scarce disaster relief between two regions with equally uncertain but potentially massive needs), the rule *would* suggest randomization if credible estimates overlapped significantly. This *feels* irresponsible compared to "judgment," but the rule argues that judgment under such ignorance *is* the irresponsibility – it's disguised arbitrariness. The coin flip makes the uncertainty explicit and procedurally fair.
      *   **Ignoring "Killer Arguments"?** If an option has a plausible, catastrophic downside (e.g., an intervention might inadvertently trigger a chain reaction), even if unquantifiable, does it force equipoise? The rule based purely on quantifiable estimates might miss this. *This is a major limitation.* The implicit theory needs augmentation: equipoise requires *no known decisive qualitative reason* against an option, *in addition* to quantitative overlap. (RCTs achieve this via exclusion criteria/safety monitoring).
      *   **Inaction vs. Random Action:** What if "doing nothing" is an option? Does equipoise between acting (A/B) and not acting trigger *randomizing between acting and not acting*? This might seem absurd. The rule forces a decision: either "not acting" has sufficient legitimacy to be chosen (i.e., its estimate is decisively best, or equipoise only applies *among* acting options), or it enters the random pool. This highlights the rule's demand for explicit option definition.

  3.  **Changes to Day-to-Day Decision Making:**
      *   **Humility Over Hubris:** Forces explicit acknowledgement of uncertainty before acting. "Is our spread smaller than our uncertainty?" becomes a key question, preventing overconfident maximization.
      *   **Investment in Uncertainty Reduction:** Before maximizing, significant effort might go into *reducing* uncertainty to *achieve* decisiveness, if feasible and cost-effective.
      *   **Proceduralization:** Develop explicit, fair procedures (beyond coin flips – e.g., lotteries, rotating priority) for allocation under sustained equipoise (e.g., distributing a fixed charity budget among several high-uncertainty, high-potential programs annually).
      *   **Scoping Discipline:** Forces careful definition of the choice set and the relevant outcome metric/horizon *before* assessment (like pre-registration).
      *   **Transparency:** Makes the basis for choice (maximization vs. procedure) explicit and justifiable based on the state of knowledge.

  **In Essence:** The RCT practice reveals a theory where rational choice is contextually bounded by epistemic legitimacy. When legitimacy is high, maximize. When legitimacy collapses due to uncertainty or ignorance, shift to a fair procedure. Decisiveness is treated as threshold-based within these bounds. Downstream effects are excluded not as worthless, but as operationally unusable *for the specific bounded decision*. Applying the equipoise rule beyond medicine forces consequentialists to confront the limits of their knowledge explicitly, replacing overconfident optimization with procedural fairness under radical uncertainty, which would be a profound and often counterintuitive shift, demanding greater humility and systematicity. It doesn't *prescribe* randomizing everywhere, but it forces justification when we *don't* randomize under high uncertainty.
