prompt: |-
  I'm a research analyst at a mid-sized private foundation, and in three weeks I'm presenting to our program committee a proposal to replace the scoring template we use when we allocate across program areas. The committee votes at the end of that same meeting on whether to pilot the new method on one program area for a year, so the question period, not the slides, is where this is decided. The room is: two development economists of the experimentalist persuasion, who convert everything into external validity, publication bias, and whether anything not estimated off a randomized design counts as evidence at all; a former government cost-benefit analyst who will want a discount rate, a distributional weight, and an account of what happens under parameter uncertainty; two program officers with fifteen years of field experience each, who distrust aggregate metrics and will hear any formula as head office removing discretion from the people who actually know the partners; one board member who introduced our current framework to us and reads the effective-altruism literature, and who will defend it as cheap, transparent, and good enough; and the board chair, a retired software founder who thinks in terms of leverage and will ask what the framework would have told us to do five years ago.

  My thesis is that the three-factor score we now use -- importance, tractability, neglectedness -- is not wrong so much as mis-specified, because two of its three factors are properties of a funder relative to a cause rather than properties of the cause, and because it has no term for the value of finding things out. I want to replace the score with an estimate of the expected marginal value of our next dollar to a cause, computed against an explicitly modeled counterfactual funding path, and then decompose it for presentation into four terms: a scale-weighted tractability indexed to our own access and comparative advantage rather than to the cause in the abstract; a saturation discount read off an absorption curve, meaning what the cost per unit of outcome does as cumulative funding in that area rises over a five-year window; a crowding term, since a dollar of ours that only substitutes for a dollar that would have arrived anyway does much less than a dollar that pulls in others or that no one else was going to give; and an option-value term for grants whose real payoff is resolving a disagreement before a much larger later commitment, which on my arithmetic is why a long-horizon funder like us should sometimes fund things that score badly on all three of the classic factors. The concrete thing I have to defend is a ranking flip: our largest line item, a well-evidenced and heavily funded global-health delivery program with a well-characterized cost per outcome, comes out below a small, weakly evidenced institutional-reform pilot that is very cheap now and that sits in front of a decision about a much larger commitment in about four years.

  What I want from you is a Q&A prep sheet, not a defense of the view. Give me the eight or so objections I will actually get, in roughly the order they will arrive, each attributed to the person most likely to raise it and phrased the way that person would phrase it -- the treasury analyst's objection should sound like a treasury analyst's, not like a philosopher's, and the program officers' should be about partners and legibility rather than about expected value. For each: what I should concede up front rather than being forced into it at the third follow-up, a reply I could give in about two minutes standing at a whiteboard, and a blunt note on where that reply is soft. Include what I should volunteer in the first two minutes to take the sting out of the two or three objections with real force, and tell me which objection I should simply grant in full. Finally, give me the question I am hoping nobody asks. My own candidate is the coordination worry: if every funder conditions on what every other funder will do, then the crowding term can make everyone rationally stand down at once and defund an area by mutual prediction, and I do not have a fixed point to point to. Tell me if you think the real killer is a different question -- I suspect the option-value term is vulnerable to something like always recommending more research and meta-work -- and argue for your choice over mine.
reasoning: |-
  Okay, I need to help this research analyst prepare for a tough Q&A session with their program committee. The user has a complex proposal to replace their current scoring system and needs to anticipate specific objections from diverse stakeholders. 

  First, I'm struck by how well the user understands each committee member's perspective - this isn't just about defending a model but navigating human biases and professional languages. The economists will demand rigor, the program officers care about field relationships, the cost-benefit analyst wants quantification, and the board members have legacy and strategic concerns.

  The core tension is between a simple transparent system and a more nuanced but complex model. I notice the user's proposal introduces four sophisticated terms that might overwhelm some committee members. Their biggest vulnerability seems to be the "option-value" argument which could appear to justify endless studies instead of action.

  Hmm... the coordination problem the user mentioned is theoretically valid but practically unlikely. The real killer question might be about meta-work bias - whether this framework would make them fund endless pilots instead of proven interventions. That resonates with everyone: economists would question evidence, program officers would resent HQ overreach, and the software founder would smell inefficiency.

  For Q&A prep, I'll sequence objections by personality: start with the EA-aligned board member defending the status quo, then hit the economists' validity concerns, then the cost-benefit analyst's quantification demands, then program officers' autonomy fears. Saving the toughest (option-value critique) for last when they're warmed up.

  Key tactics: 
  - Voluntarily disarm the saturation discount critique by admitting data limitations
  - Fully concede on the implementation burden for program officers 
  - For the killer question, pivot to concrete thresholds that force decisions

  The whiteboard should show their ranking flip as a case study - make abstract math tangible. And always bring it back to that software founder's love of leverage: "This framework catches when we're just subsidizing others versus truly adding value."
answer: |-
  Here’s your Q&A prep sheet, structured for tactical concession, targeted replies, and vulnerability flags. I’ve ordered objections by likely sequence (defending status quo → technical critiques → operational/political concerns). The real "killer question" is at the end.

  ---

  ### **Preemptive Concessions (First 2 Minutes)**  
  Volunteer these upfront to defuse tension:  
  1. **"This adds complexity. We’ll keep the old template for smaller grants (<$250K) and only apply the new model to major allocations."**  
     *(Disarms program officers’ "bureaucracy" fear and EA’s "cheap/transparent" objection)*  
  2. **"The saturation discount relies on crude absorption curves. We’ll label these estimates ‘Low/Med/High Confidence’ until we get better data."**  
     *(Preempts cost-benefit analyst’s parameter uncertainty critique)*  
  3. **"The option-value term is not an excuse for endless pilots. We’ll cap it at 20% of total score and require a documented ‘trigger’ for the larger decision."**  
     *(Heads off software founder’s leverage concern and economists’ external validity worry)*  

  ---

  ### **Objection 1: The EA-Aligned Board Member**  
  *"This overcomplicates what works. Our current framework is transparent, low-cost, and aligns with best practices in effective giving. Why fix what isn’t broken?"*  
  - **Concede:** "You’re right that simplicity has value—we’ll keep the old system for 80% of grants."  
  - **Reply (Whiteboard):** Draw two columns: "Cause Properties" vs. "Funder Properties". Circle "Neglectedness" and "Tractability": *"These depend on* us *—our size, reach, timing. Our $10M move on tractability, not the cause’s. The new model bakes that in explicitly so we don’t misattribute."*  
  - **Where It’s Soft:** Doesn’t prove the cost of complexity is worth it.  

  ### **Objection 2: Experimentalist Economist 1**  
  *"Your ‘scale-weighted tractability’ assumes we can index comparative advantage to outcomes. Where’s the RCT showing this mapping is causal, not just correlation?"*  
  - **Concede:** "We can’t randomize foundation strategy. This is Bayesian—we’ll use our historical grant performance data as priors."  
  - **Reply:** Show a 2x2 matrix: *"X-axis: Our past grants’ outcome/cost vs. field average. Y-axis: Partner fit (e.g., speed, data access). We’re not estimating causality—we’re ranking where we’re* likely *less bad. Like a hedge fund ranking trades, not proving theorems."*  
  - **Soft Spot:** "Likely" is subjective. External validity challenge remains.  

  ### **Objection 3: Cost-Benefit Analyst**  
  *"Where’s the discount rate for option value? How do you distributionally weight the crowding term? This feels arbitrary without sensitivity analysis."*  
  - **Concede:** "We used 5% discounting for option value—admittedly arbitrary. We’ll publish the sensitivity table in the appendix."  
  - **Reply:** Sketch a simple equation:  
    `Option Value = [ΔProb(Large Commitment) × NPV(Large)] / (1+r)^t`  
    *"Crowding uses observed substitution rates from past grants. We’ll track this and adjust weights yearly—think of it as calibration, not precision."*  
  - **Soft Spot:** Still a "black box" without Monte Carlo simulations.  

  ### **Objection 4: Program Officer 1**  
  *"This ‘absorption curve’ ignores reality. If a trusted partner says they can absorb $5M, why let a spreadsheet override their expertise?"*  
  - **Concede:** "Field insight trumps models. We’ll use the curve only to flag grants >50% above historical absorption for extra diligence."  
  - **Reply:** Show a partner’s past funding vs. outcomes curve flattening: *"This isn’t about trust—it’s physics. Like overwatering a plant. We’ve seen 12 cases where more cash = higher unit costs. We’ll use your judgment to set the curve’s shape."*  
  - **Soft Spot:** Ignores that some partners *can* scale linearly (but data says rarely).  

  ### **Objection 5: Software Founder (Board Chair)**  
  *"Walk me through the ranking flip. Why should we downgrade proven health work for a gamble on governance?"*  
  - **Reply:** Whiteboard the 4 factors for health vs. governance:  
    - **Health:** High tractability (-), saturation discount (↓↓), crowding (↓), option value (0)  
    - **Governance:** Low tractability (+), saturation (0), crowding (++), option value (↑↑)  
    *"The health program is great, but at its funding level, $1M from us replaces $0.8M others would give (crowding ↓) and costs 30% more/year (saturation ↓↓). The governance pilot unlocks a $50M decision later—like buying R&D optionality."*  
  - **Soft Spot:** Assumes the $50M decision is real. If the trigger is vague, this fails.  

  ### **Objection 6: Experimentalist Economist 2**  
  *"Option value incentivizes forever pilots. How do you avoid funding ‘more research’ instead of action?"*  
  - **Reply:** Show the 20% cap rule + a "decision trigger" timeline:  
    *"Pilot X requires a go/no-go by 2028. If we delay, option value decays. We’re not funding ‘research’—we’re funding a real option with an expiry date, like a venture debt term sheet."*  
  - **Soft Spot:** No enforcement mechanism if the trigger is missed.  

  ---

  ### **Objection to Grant in Full: Program Officer 2**  
  *"Partners will hate this. Explaining ‘saturation discounts’ and ‘crowding’ will make us sound like bankers, not allies."*  
  - **Grant Fully:** "You’re right. We’ll never share the model with partners. Program officers can translate insights into narrative feedback (e.g., ‘We’re prioritizing newer opportunities’)."  
  *(This is political reality. Die on better hills.)*  

  ---

  ### **The Killer Question You Fear**  
  **Likely Asker:** Experimentalist Economist 1 + Cost-Benefit Analyst (tag-team)  
  **Question:** *"Your crowding term assumes we can predict others’ actions. But if all funders use models like this, won’t they all rationally underfund ‘non-neglected’ areas, causing coordination failure? Prove your model has a Nash equilibrium where the right things get funded."*  

  **Why It’s Worse Than Your Coordination Worry:**  
  - It merges **crowding** and **option value** into a lethal flaw: If funders see low crowding (i.e., others will fill gaps), they leave. If they see high option value (i.e., others won’t fund research), they enter. But if everyone does this, low-crowding areas collapse, and option-value projects become overfunded meta-work.  
  - **Your reply won’t fix it:** You could say "We’ll share crowding data openly" (but foundations won’t), or "We’re small, so our impact is negligible" (contradicting your whole model).  

  **Why I Chose This Over Your Option-Value Concern:**  
  Option value can be capped and time-bound. Crowding + game theory is *structural*. It reveals your model assumes other funders are static—which your own framework says they’re not.  

  ---

  ### **Tactical Summary**  
  - **Volunteer:** Complexity limits, data roughness, and option-value caps early.  
  - **Concede Fully:** On partner communication.  
  - **Killer Question Prep:** If asked, say: *"This is why we’re piloting in one area. If we see adverse coordination, we’ll add a ‘public goods multiplier’ term. But in practice, funders herd on hot topics—our model counteracts that."* (Then quickly pivot to the health/governance flip example).  

  **Final Tip:** Bring a 1-pager showing the health vs. governance scoring. Concrete comparisons disarm abstract criticism. Good luck.
