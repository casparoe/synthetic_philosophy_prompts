  ### **Epistemology Decision Tree: Knowledge & Practical Factors**  
  *Answer based on cases, not theory names. Choose (Y)es or (N)o.*

  #### **Question 1: Low vs. High Stakes (Subject)**  
  > **Case A (Low Stakes):**  
  > Sarah is mailing a rebate form. No urgency—if it arrives late, she loses $10. She sees the post office is open (standard hours, no signs of closure). She believes, "It’s open tomorrow (Saturday)."  
  > *Does Sarah **know** the post office is open tomorrow?*  
  > (Y) / (N)  

  > **Case B (High Stakes):**  
  > Same Sarah, same evidence. But now, if the form isn’t mailed by Saturday, she loses her job. She feels anxious but doesn’t double-check.  
  > *Does Sarah **know** the post office is open tomorrow?*  
  > (Y) / (N)  

  - **If (Y) for A and (Y) for B:**  
    → Go to **Classical Invariantism** (knowledge unaffected by stakes).  
  - **If (N) for A and (N) for B:**  
    → Go to **Skeptical Invariantism** (knowledge rarely/never occurs, regardless of stakes).  
  - **If (Y) for A and (N) for B:**  
    → Stakes matter! Proceed to Question 2.  

  ---

  #### **Question 2: Attributor vs. Subject Stakes (Your Key Node)**  
  > **Case C (Divergent Stakes):**  
  > *Subject (High Stakes):* Sarah (from Case B) is about to mail her job-critical form.  
  > *Attributor (Low Stakes):* Alex has no stake in Sarah’s situation. Alex has the same evidence as Sarah (saw post office open, no special checks). Alex says, "Sarah **knows** it’s open tomorrow."  
  > *Is Alex’s statement **true**?*  
  > (Y) / (N)  

  - **If (Y):**  
    → Truth depends on the *attributor’s* context. Proceed to Question 3.  
  - **If (N):**  
    → Truth depends on the *subject’s* situation. Go to **Subject-Sensitive Invariantism** (pragmatic encroachment).  

  ---

  #### **Question 3: Disagreement Across Contexts**  
  > **Case D (Disagreement):**  
  > On Friday, Alex (Low Stakes) says of Sarah (Low Stakes, Case A): "She **knows** the post office is open tomorrow."  
  > Later, Taylor (High Stakes—e.g., mailing a life-saving medication) hears about Alex’s claim and says, "No, Sarah didn’t **know**."  
  > *Are Alex and Taylor contradicting each other? (i.e., can both be correct?)*  
  > (Y) / (N)  

  - **If (Y):** They contradict → **Assessment-Relativism** (truth relative to assessor’s context).  
  - **If (N):** No contradiction → **Attributor Contextualism** (truth relative to speaker’s context).  

