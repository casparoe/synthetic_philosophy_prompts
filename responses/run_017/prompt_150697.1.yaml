  ### **Resulting Views**  
  1. **Classical Invariantism**: Knowledge is invariant; unaffected by practical stakes (Q1: Y/Y).  
  2. **Skeptical Invariantism**: Knowledge is extremely rare/unattainable, even in low stakes (Q1: N/N).  
  3. **Subject-Sensitive Invariantism (Pragmatic Encroachment)**: Knowledge depends on the *subject’s* stakes (Q1: Y/N; Q2: N).  
  4. **Attributor Contextualism**: Knowledge depends on the *attributor’s* context/stakes (Q1: Y/N; Q2: Y; Q3: N).  
  5. **Assessment-Relativism**: Knowledge depends on the *assessor’s* context during evaluation (Q1: Y/N; Q2: Y; Q3: Y).  

  ---

  ### **Notes**  
  - **Phantom/Borrowed Stakes**: Dropped—they **do not discriminate** between views.  
    - *Phantom stakes* (subject falsely believes stakes are high; actual stakes low): All views agree knowledge is present (if evidence is sufficient for low stakes).  
    - *Borrowed stakes* (subject acts for others; no personal stake): All views treat this as high stakes (if consequences for the subject’s actions are severe).  
  - **Undistinguished Pairs**:  
    - **Skeptical vs. Strict Classical Invariantism** (Q1: N/N) cannot be split here. Requires a "very easy case" (e.g., "Do you know you have hands?").  
    - *Attributor Contextualism vs. Assessment-Relativism* are fully separated by Q3.  
  - **Why No Extra Cases?** The tree isolates core commitments:  
    - Q1: Stakes sensitivity.  
    - Q2: Attributor vs. subject dependence.  
    - Q3: Disagreement handling.  

