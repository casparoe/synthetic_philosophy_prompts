  Hmm, the user is a literary fiction writer engaged in a philosophical dispute about mental state vocabulary. Their friend, a philosopher of mind, argues that terms like "beliefs" and "desires" are outdated theoretical constructs akin to humors or phlogiston, destined to be replaced by neuroscience. This would render literary fiction using such terms obsolete. The user resists this, pointing out that in fiction writing, mental states aren't inferred from behavior but stipulated by the author, and readers use them for interpretation rather than prediction.

  The user wants a structured analysis: first, to map the analogy between scientific theories and mental state vocabulary; second, to evaluate key disanalogies; third, to identify assumptions smuggled into the analogy; fourth, a verdict on whether the friend's conclusion holds; and finally, alternative analogies that might preserve both perspectives.

  Key disanalogies to examine: the direction of fit (authorial stipulation vs scientific inference), the normative vs causal functions of mental vocabulary, the self-referential problem in eliminativism, and whether fictional use is degenerate or paradigmatic.

  The core tension is between descriptive/explanatory and normative/interpretive uses of language. In fiction, "belief" functions as a constitutive rule of the narrative game rather than a causal hypothesis. Even if neuroscience replaces folk psychology for explaining behavior, the interpretive framework for meaning-making in literature might remain indispensable.

  Alternative analogies like "queen in chess" or "money" better capture this institutional nature of mental state attribution in fiction - they're real within the framework that constitutes them. The verdict should distinguish between existence claims and practice viability: neuroscience may show beliefs don't exist as neural entities, but this doesn't invalidate their functional role in literature and social practices.
answer: |-
  Below is a systematic audit of the analogy, structured to address your request. The verdict is unambiguous: **the analogy fails to carry your friend's conclusion that literary fiction is "living on borrowed time."** While the first claim (beliefs/desires may not exist as neuroscientific entities) *might* hold, the third claim (literary practice is doomed) does not survive the disanalogies. The vocabulary's core function in fiction is insulated from eliminativism's scientific critique.

  ---

  ### 1. Correspondence Table: The Analogy Mapped  
  *(Source Domain = Retired Scientific Theories; Target Domain = Folk Psychology in Fiction)*  

  | **Role in Theory**          | **Source Domain (e.g., Phlogiston)**          | **Target Domain (Beliefs/Desires in Fiction)**       |
  |-----------------------------|-----------------------------------------------|------------------------------------------------------|
  | **Posits**                  | Unobservable entities (phlogiston, humors)    | Mental states (beliefs, desires, fears)             |
  | **Observable Symptoms**     | Combustion, illness symptoms                  | Speech, physical actions, gestures                  |
  | **Predictive Failure**      | Fails to predict new phenomena; contradicted by experiments | Allegedly fails to predict behavior accurately; neuroscience will supersede it |
  | **Successor Science**       | Oxygen theory, germ theory                    | Mature neuroscience                                  |
  | **Quaintness**              | Archaic medical texts; alchemy                | Novels using mental state attributions              |

  ---

  ### 2. Disanalogies Sorted by Significance  
  *(✓ = Undermines the analogy; ✗ = Noise or irrelevant)*  

  - **✓ Direction of Fit**:  
    - *Disanalogy*: In fiction, beliefs are **stipulated by the author**; behavior is *answerable to them* (top-down). Science infers posits *from* behavior (bottom-up).  
    - *Work it does*: Destroys the "predictive theory" premise. Fiction treats beliefs as **constitutive rules**, not hypotheses.  

  - **✓ Function (Normative vs. Causal)**:  
    - *Disanalogy*: Beliefs/desires in fiction anchor **meaning, responsibility, and interpretation** (e.g., "He lied because he *believed* she was dangerous"). Science seeks causal explanations.  
    - *Work it does*: Shows the vocabulary’s core role is **non-empirical**. Neuroscience can’t replicate normativity (blame, irony, promise-keeping).  

  - **✓ Individuation Conditions**:  
    - *Disanalogy*: Beliefs are defined by **content/rational relations** (e.g., "believes *p*" entails "doesn't believe *not-p*"). Phlogiston was defined by causal role (released in combustion).  
    - *Work it does*: Mental states aren't "discovered empty" like phlogiston; their identity is logical, not empirical. Eliminativism conflates *reference failure* with *functional irrelevance*.  

  - **✓ Self-Referential Problem**:  
    - *Disanalogy*: Eliminativist claims ("Beliefs don’t exist") **require the vocabulary they deny** (e.g., "I *believe* eliminativism is true").  
    - *Work it does*: Highlights a fatal incoherence: if folk psychology is false, the argument *for* eliminativism is unstateable.  

  - **✗ Theory vs. Skill/Practice**:  
    - *Disanalogy*: Is "mindreading" a theory or a simulation capacity?  
    - *Work it does*: **Noise**. Even if it’s a skill, eliminativists argue it’s *misguided*. Fiction’s use is immune regardless.  

  - **✓ Retention Without Reference**:  
    - *Disanalogy*: Can we keep "belief" as useful fiction (like contour lines) while denying it refers?  
    - *Work it does*: **Preserves literary practice**. Fiction *already* treats beliefs as "real-in-the-story" — a self-contained framework needing no external reference.  

  ---

  ### 3. Smuggled Assumptions from the Source Domain  
  The analogy illicitly imposes scientific criteria on a non-scientific practice:  
  - **How posits are introduced**: Assumes beliefs are *inferred* from data (but in fiction, they’re axiomatic).  
  - **Individuation**: Assumes beliefs are *causal entities* (but in fiction, they’re defined by role in narrative logic).  
  - **Evidence against them**: Assumes failure is *predictive inaccuracy* (but fiction’s "failure" would be incoherence, not misprediction).  
  - **Retirement justification**: Assumes science *alone* decides usefulness (ignoring normative/interpretive necessity).  

  ---

  ### 4. Verdict: Does the Conclusion Survive?  
  **No.** The disanalogies dismantle the chain of reasoning:  
  - **Claim 1: "Nothing answers to the ascription"**  
    *Status*: **Plausible for neuroscience**, but irrelevant to fiction. Beliefs in novels are **stipulated artifacts**, not posits about brains.  
  - **Claim 2: "Vocabulary should be withdrawn"**  
    *Status*: **False for fiction/normative practices**. The vocabulary is indispensable for interpretation, meaning, and social norms (blaming, promising). Neuroscience cannot replace this.  
  - **Claim 3: "Literary practice is on borrowed time"**  
    *Status*: **False**. Fiction’s use of beliefs/desires is **constitutive, not descriptive**. Eliminativism confuses the *vehicle* (words like "believe") with the *function* (building meaning). A novel without mental states would be like chess without rules — not "quaint," but impossible.  

  **The weight falls here**: Even if neuroscience eliminates beliefs *as biological entities*, fiction doesn’t *use* them as such. Your practice operates in a **separate linguistic domain** where stipulation and interpretation are sovereign. The "quaintness" charge assumes fiction is a *failed science*, which it never was.  

  ---

  ### 5. A Better Analogy  
  **The Queen in Chess**  
  - **Preserves what your friend wants**: The queen (like "belief") is a posit in a formal system. Neuroscience could describe wood/plastic particles, but that doesn’t "retire" the queen’s role *in the game*.  
  - **Gives you back the practice**: The queen’s power is **stipulated by rules**, not inferred from physics. Players attribute "threats" or "intent" to the queen *to make sense of the game* — just as readers attribute beliefs to characters. Abolishing the queen would destroy chess, not expose its quaintness.  

  **Why it works**:  
  - Like mental states in fiction, the queen is *real* within an institutional practice.  
  - Successor sciences (physics) don’t replace the vocabulary; they operate at a different level.  
  - "The queen is under threat" remains true *in chess* regardless of particle physics.  

  ---

  ### Final Judgment  
  **The analogy to retired scientific theories fails categorically to support the conclusion that literary fiction is doomed.** Your practice is not a degenerate instance of folk psychology; it is its **paradigmatic expression** in a domain governed by stipulation and interpretation, not prediction. Eliminativism, even if true for neuroscience, is inert against a novel that begins, "He believed the letter was in the drawer." The vocabulary persists because its function is *constitutive* — and constitutions aren’t falsified by microscopes.
