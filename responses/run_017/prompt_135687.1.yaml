prompt: |-
  I am drafting a paper on moral testimony, and I want the specification settled before I measure any existing view against it. Fix the purpose first, so that adequacy has a target: the theory is to serve as a guide for a competent but morally unexceptional agent who faces a concrete situation and must decide whether to take someone else's word on a moral question, whose word to take, how far to take it, and what she ends up with if she takes it. A theory adequate to that purpose should also be able to say what is supposed to be wrong with the kinds of deference we find objectionable, and why that wrong is not simply one more case of believing an unreliable source.

  Write the desiderata such a theory must meet. For each requirement, give the case or consideration that earns it a place on the list, and mark it as non-negotiable or as something only one camp has insisted on. I would rather have eight requirements with real cases behind them than twenty with none.

  The following cases are the ones I want adjudicated, since they are where I suspect existing views quietly cheat. Say, for each, whether it generates a genuine desideratum, what that desideratum is, and whether the case is really doing work or is cheap:

  1. A trusted person says the act is wrong, offers no reasons, and cannot offer any; the agent defers anyway.
  2. The person you have wronged tells you what you owe her. Her say-so seems partly to constitute the answer, and withholding deference here looks like a moral failing rather than an epistemic virtue.
  3. Someone with relevant lived experience delivers a moral verdict whose authority seems to come from better access to non-moral facts rather than from superior moral judgment.
  4. A testifier whose predictions reliably track the truth but whose stated reasons are confused or worse; reliability and articulate justification come apart.
  5. A testifier whose fundamental moral commitments you reject entirely nevertheless tells you that an act is impermissible, and is right.
  6. Ten thousand aggregated strangers against one person you regard as a genuine moral expert.
  7. The learner's case: a child asks whether lying is wrong and is told that it is. Deferring looks not merely permissible but required, and yet the theory must say what, if anything, changes as the learner matures.
  8. An artefact that has no experience, no understanding, no stake, and no capacity to weigh reasons, but which predicts your own considered verdicts better than you predict them yourself.
  9. A moral question that is open for you only because the empirical facts are not yet in: separate the deference due to the prediction from the deference due to the verdict, and say whether a theory that handles this by reclassifying it as non-moral testimony has thereby explained anything.
  10. The agent with no view of her own at all, who has simply never thought about the matter.

  I also want an explicit ruling on which distinctions a theory may not collapse: deferring to a person versus treating her as evidence; believing on testimony versus understanding why; reliability versus expertise versus authority; the moral content of a verdict versus the empirical claims embedded in it; the first-personal deliberative standpoint versus third-personal appraisal; the epistemic question of what you may believe versus the moral question of whether deferring here is itself a failing versus the pedagogical question of what deferring does to a learner; deference to a person versus deference to a procedure such as a tribunal, a lottery, or an aggregation; and taking a verdict now versus coming to understand it later.

  Three meta-questions matter more to me than the list itself. First, which items that people standardly demand are really camp commitments dressed up as data, and which are forced by the cases. I have in mind, as candidates for demotion, the demand that the theory vindicate the claim that there are no moral experts, and the demand that it produce a special explanation of cases involving testifiers with odious views; if such cases turn only on the speaker's unreliability, they are easy for every theory and should not be allowed to earn it credit. Second, whether any subset of the desiderata is jointly unsatisfiable, so that the list itself becomes a result about what no single theory of moral testimony can be. Third, which single requirement does the most exclusionary work, knocking out the most otherwise attractive views.

  Close with a short scorecard, no more than a line or two each, for four generic contenders: a straight deference view on which moral testimony works like any other; a view on which it transmits knowledge but not understanding; a view on which the deliberative standpoint makes deference in principle inappropriate; and a view that explains whatever asymmetry there is by appeal to the nature of moral disagreement rather than to the nature of moral judgment. Keep the weight on the criteria. Do not cite or name authors, do not survey the literature, and do not reach for examples beyond the ones I have given unless one is doing real work.
reasoning: |-
  Hmm, the user is drafting a paper on moral testimony and needs help defining desiderata for a theory that guides moral deference decisions. They've provided ten specific cases they want addressed and several distinctions they consider important. This is clearly an advanced philosophical project requiring precise conceptual scaffolding.

  The user's core concern seems to be avoiding theoretical cheating - they want requirements grounded in concrete problems rather than ideological commitments. I notice they're particularly skeptical of views that handle "easy" cases while dodging hard ones. Their meta-questions reveal a desire to expose hidden tensions in the literature.

  For the desiderata, I'll need to:
  First, extract requirements directly from their cases while flagging which are non-negotiable versus camp-specific. The trusted person without reasons (Case 1), for example, seems to demand that theories account for non-rational deference, which might conflict with intellectualist approaches. The lived experience case (Case 3) requires handling testimonial authority that stems from non-moral epistemic advantages - a crucial stress test.

  Second, their requested distinctions must frame the analysis without premature collapsing. The person-versus-evidence distinction seems fundamental to moral testimony's unique puzzle, while the belief-versus-understanding gap explains why some reject deference even when reliable.

  For meta-issues:
  - The "no moral experts" demand does appear ideological - it's absent from their cases and contradicts the child-learner scenario (Case 7) where expertise seems necessary.
  - Odious-view cases (like Case 5) might indeed reduce to general reliability if the testifier's correctness is accidental, making them poor differentiators.
  - The biggest tension likely lies between the constitutive deference in wronged-person cases (Case 2) and the deliberative standpoint's anti-deference impulse - possibly an unsolvable knot.

  The most exclusionary requirement? Probably explaining how deference can be constitutive (Case 2) while avoiding collapsing into mere evidence (Case 8). This threatens views that reduce testimony to reliability indicators.

  For the scorecard:
  - Straight deference fails Case 2 (constitutive authority) and Case 7 (developmental shift)
  - Knowledge-without-understanding struggles with Case 4 (articulation gap) and Case 9 (fact/verdict entanglement)
  - Deliberative views crash against Case 1 (non-rational deference) and Case 10 (no prior view)
  - Disagreement-based approaches mishandle Case 3 (lived experience) and Case 6 (aggregation vs expert)

  The user's focus on "what changes" in maturation (Case 7) and the empty-agent problem (Case 10) suggests they suspect many theories covertly rely on idealized agents. That's where I'll concentrate diagnostic pressure.
answer: |-
  Here are eight desiderata for a theory of moral testimony, derived from your cases and distinctions. Each is grounded in a specific challenge, marked for negotiability, and accompanied by an assessment of whether the case does "real work" or is "cheap."

  ### Core Desiderata
  1. **Non-Rational Deference**  
     *Case:* 1 (Trusted person without reasons).  
     *Requirement:* The theory must permit deference when the testifier lacks articulable reasons, without reducing this to blind faith.  
     *Status:* **Non-negotiable**. The case forces engagement with deference that bypasses reasoned justification.  
     *Work assessment:* **Real work**. Tests whether theories requiring shared reasoning (e.g., deliberative views) can accommodate non-inferential trust.  

  2. **Constitutive Authority**  
     *Case:* 2 (Wronged person dictating owed reparations).  
     *Requirement:* The theory must explain how some testimony (e.g., from victims) *constitutes* moral facts, making deference a moral requirement.  
     *Status:* **Non-negotiable**. Withholding deference here is a moral failure, not an epistemic misstep.  
     *Work assessment:* **Real work**. Challenges views that treat testimony as purely epistemic; demands a moral/political dimension.  

  3. **Epistemic vs. Moral Authority Separation**  
     *Case:* 3 (Lived experience providing non-moral facts).  
     *Requirement:* The theory must distinguish deference based on access to non-moral facts from deference to moral judgment.  
     *Status:* **Non-negotiable**. Collapsing this conflates empirical and moral testimony.  
     *Work assessment:* **Real work**. Exposes theories that covertly reduce moral testimony to non-moral input.  

  4. **Articulation-Independent Reliability**  
     *Case:* 4 (Testifier reliable but inarticulate).  
     *Requirement:* The theory must allow that reliability can justify deference even when the testifier’s stated reasons are poor.  
     *Status:* **Non-negotiable**. Reliability and justification often come apart in practice.  
     *Work assessment:* **Cheap if mishandled, real if addressed**. Tests if theories demanding "understanding" confuse justification with reliability.  

  5. **Deference Across Fundamental Disagreement**  
     *Case:* 5 (Testifier with odious commitments is correct).  
     *Requirement:* The theory must permit deference to a morally alien source when they are reliable, without requiring shared values.  
     *Status:* **Camp-specific** (reliabilist/objectivist). Denied by views insisting on deliberative alignment.  
     *Work assessment:* **Real work**. Challenges "shared standpoint" theories; forces engagement with objectivity.  

  6. **Expertise vs. Aggregation**  
     *Case:* 6 (10,000 strangers vs. one expert).  
     *Requirement:* The theory must explain when to prioritize deep expertise over broad consensus (or vice versa).  
     *Status:* **Non-negotiable**. Real agents face this trade-off.  
     *Work assessment:* **Real work**. Tests if theories can weigh qualitative vs. quantitative authority.  

  7. **Developmental Asymmetry**  
     *Case:* 7 (The learner’s case: child vs. mature agent).  
     *Requirement:* The theory must explain why deference is obligatory for novices but defeasible for competent adults, without positing a sharp discontinuity.  
     *Status:* **Non-negotiable**. Accounts for moral education.  
     *Work assessment:* **Real work**. Exposes views that cannot model moral growth.  

  8. **Procedural vs. Personal Deference**  
     *Case:* 8 (Artefact predicting verdicts) and tribunal/lottery distinction.  
     *Requirement:* The theory must distinguish deferring to *persons* (with reasons/authority) from using agents/artefacts as *evidence*.  
     *Status:* **Non-negotiable**. Collapsing this ignores the interpersonal nature of testimony.  
     *Work assessment:* **Real work**. Tests if theories reduce testimony to mere data.  

  ### Meta-Questions Resolved  
  - **Demoted "Standard" Demands**:  
    - *No moral experts*: Camp-specific (anti-elitist views). Case 6 shows expertise matters.  
    - *Special explanation for odious testifiers*: Redundant. Case 5 shows it’s subsumed under general reliability (if the testifier is *reliably* right, odiousness is irrelevant).  
  - **Joint Unsatisfiability**: Desiderata 2 (constitutive authority) and the deliberative standpoint (see scorecard) conflict sharply. Constitutive cases demand deference as morally required, while deliberative views forbid it on principle.  
  - **Most Exclusionary Requirement**: **Constitutive Authority** (Desideratum 2). It eliminates views prioritizing the agent’s own deliberation (e.g., "deliberative indispensability" theories).  

  ### Key Distinctions That Must Be Preserved  
  The theory **may not collapse**:  
  - Deferring to a person vs. treating her as evidence (Case 8).  
  - Believing on testimony vs. understanding why (Cases 1, 4).  
  - Moral content vs. embedded empirical claims (Case 9).  
  - Epistemic permissibility vs. moral/pedagogical status of deference (Cases 2, 7).  

  ### Scorecard for Generic Contenders  
  1. **Straight Deference** (moral testimony = non-moral testimony):  
     *Fails*: Constitutive authority (Case 2), developmental asymmetry (Case 7), and person-vs-evidence distinction (Case 8). Overly permissive.  

  2. **Knowledge Without Understanding**:  
     *Fails*: Constitutive authority (Case 2), articulation-independent reliability (Case 4), and moral/empirical entanglement (Case 9). Cannot explain why understanding matters pedagogically (Case 7).  

  3. **Deliberative Standpoint** (deference always inappropriate):  
     *Fails*: Non-rational deference (Case 1), constitutive cases (Case 2), empty agents (Case 10), and learner cases (Case 7). Overly restrictive.  

  4. **Disagreement-Based Asymmetry** (moral deference differs due to disagreement dynamics):  
     *Fails*: Constitutive authority (Case 2), lived experience (Case 3), and artefacts (Case 8). Treats moral testimony as uniquely problematic without grounding in the cases.  

  ---  
  **Final Tally**: Desiderata 1–4, 6–8 are non-negotiable; 5 is camp-specific. Cases 2 (constitutive authority) and 7 (developmental asymmetry) do the heaviest lifting. The unsolvable tension is between moral requirements for deference (Case 2) and deliberative autonomy.
