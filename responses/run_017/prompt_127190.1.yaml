  Hmm, the user is preparing a 90-minute seminar on Nyāya epistemology for cognitive science PhD students. They want to focus specifically on the problem of knowing absences within the pramāṇa framework. The audience is highly technical but unfamiliar with Indian philosophy, and reflexively skeptical of taxonomies.

  The core problem: How can we know something isn't present? Perception requires an object, inference requires a universal generalization, but "the cat isn't in the hall" seems to evade both. The user wants students to feel the tension between the "non-cognition as separate pramāṇa" solution and the "reduction to perception/inference" solution.

  Key requests: 
  1) Dependency structure - what foundational concepts must be established before the absence problem lands? 
  2) A single carrying example (the cat scenario) that can't be reduced to existing cognitive models 
  3) Anticipated misconceptions and when to address them 
  4) An assessment method to check deep understanding 
  5) Explicit boundaries for the session

  The audience's background is crucial here. These are vision scientists who live and breathe signal detection theory. They'll immediately try to map this onto d'/criterion or Bayesian inference. The challenge is making the Nyāya problem feel novel and irreducible.

  For the dependency structure: We absolutely need "pramāṇa" defined as a normative source of knowledge (not justification or decision rule) with its success conditions (novel, undefeated, veridical). The moment this clicks, the absence problem becomes acute: If perception requires an object to perceive, how can absence be perceived? If inference requires universals, where's the universal for "when cat is absent"?

  The cat example is perfect but needs surgical precision. Must include: 
  - Eligibility condition (cat would be detectable if present) 
  - Sensory conditions are optimal (you're sober, lights on) 
  - No explicit generalization ("cats always come" would let them file under inference) 
  - Contrast case where eligibility fails (you're in another city)

  Biggest landmines: 
  - Them reducing it to SDT (criterion setting) - must block this by emphasizing it's about warrant, not decision 
  - Them dismissing it as argument from ignorance - need to show eligibility prevents this 
  - Premature reification of absence as an entity

  End check should force them to apply eligibility criteria: What if your glasses are fogged? What if the cat is deaf today? This exposes whether they grasp the normative conditions.

  Must explicitly exclude: 
  - The four absence types 
  - Navya-Nyāya terminology 
  - Buddhist objections 
  These would derail the tight 90-min focus. The only critical exclusion is the eligibility condition - without it, the example collapses into argument from ignorance.

  The Sanskrit terms should come after the problem is felt - let them wrestle with "how do we know absences" before labeling it anupalabdhi. Reverse-engineering the taxonomy makes it more palatable for this audience.
answer: |-
  Here’s a structured plan optimized for your constraints, audience, and goals:

  ---

  ### **1. Dependency Structure**  
  **Order of Operations** (30 mins):  
  1. **Start with "successful cognition"** (not pramāṇa yet):  
     - Use a *positive* perception case (e.g., "You see the cat in the hall").  
     - Elicit: What makes this *knowledge* (not guess/luck)? Anchor in their SDT fluency: Novel (not memory), undefeated (no counterevidence), veridical (cat is actually there).  
  2. **Introduce pramāṇa as "route to successful cognition"**:  
     - Emphasize: It’s a *process* with *normative conditions* for success, not justification or decision rule.  
     - **Key load-bearing elements**:  
       - Perception (*pratyakṣa*) requires *object contact* (no object → no perception).  
       - Inference (*anumāna*) requires *universals* (e.g., "If door opens, cat always comes").  
     - *Gesture at*: Undefeatedness, novelty. **Sanskrit terms here** (after defining conditions).  
  3. **Pose the negative case**:  
     - "How do you know the cat is *not* in the hall?" Only after steps 1–2 will the tension register.  
     - **Critical dependency**: Audience must accept that pramāṇas are *exhaustive* routes to knowledge. Without this, the "problem" feels artificial.  

  ---

  ### **2. The Carrying Example**  
  **Use the cat case, but refine**:  
  - **Core scenario**:  
    > You arrive home, open the front door (well-lit, quiet, sober), and *immediately* know the cat isn’t there.  
    - **Eligibility condition**: Cat is healthy, always comes when door opens, and is detectable (visible/audible) under these conditions.  
    - **Matched failure case**: Same reasoning while you’re in another city → *ineligible* (conditions don’t permit detection).  
  - **Why this works**:  
    - Blocks SDT/Bayesian reduction: No "signal" to detect, no probabilistic prior (it’s immediate), no threshold.  
    - Blocks inference: No explicit universal ("cats *always* come" isn’t consciously accessed; it’s dispositional).  
  - **Variation**: Add sensory defect *later* (see §4).  

  ---

  ### **3. Misconception Map & Defusal Sequence**  
  **(35 mins total; interleave with example)**  

  | Misconception | When it arises | Defusal Strategy |  
  |---------------|----------------|------------------|  
  | **(i) "Just inference from absence of signal"** | Immediately after posing the problem | *Contrast with failure case*: "In the other city, absent signal doesn’t yield knowledge. Why is home different?" → Forces eligibility. |  
  | **(ii) "Argument from ignorance"** | After eligibility introduced | *Reframe*: "Is eligibility a *premise*? No—it’s a condition making non-cognition reliable." → Highlight normative success conditions. |  
  | **(v) SDT/Bayesian redescriptions** | When discussing "how" you know | *Shut down firmly*: "This isn’t about *how we decide* but *what warrants knowledge*. Could you have a low criterion *and be wrong*?" → Reanchor to veridicality. |  
  | **(iii) "Non-cognition isn’t a real source"** | After proposing anupalabdhi | *Pressure test*: "If not a pramāṇa, which existing one covers it? Perception? But no object. Inference? But no universal." → Force taxonomy tension. |  
  | **(iv) "Absence must be a 'thing'"** | If realism emerges | *Delay*: "Hold that thought—we’ll see why Nyāya *had* to go there, but first: does knowledge of absence *require* realism?" → Postpone to post-session.  

  ---

  ### **4. Final Check for Deep Understanding**  
  **(10 mins)**  
  - **New case**:  
    > You "know" your keys aren’t on the table (you just left them there, lights are on, no distractions). *But* you forgot your glasses are smudged.  
  - **Check for**:  
    - Eligibility awareness: "Conditions *seemed* optimal but weren’t → knowledge defeated."  
    - Not just classification: "Why does this threaten *perception* as a route to knowing absence?" → Exposes vulnerability of reductionist views.  
  - **Success metric**: They articulate why defeaters matter *differently* for absence than for positive perception.  

  ---

  ### **5. Explicit Exclusions**  
  **State upfront (5 mins)**:  
  > "We’re *only* examining why absence-knowledge strains Nyāya’s core pramāṇas and two ways out. We won’t cover:  
  > - The 4 types of absence (*prāgabhāva*, etc.)  
  > - Navya-Nyāya technicalities (e.g., *viśeṣa*)  
  > - Postulation (*arthāpatti*) or Buddhist critiques  
  > ...because they expand the scope beyond today’s puzzle."  

  **Only critical exclusion**: **Eligibility conditions** (if omitted, the cat case collapses into argument from ignorance). The rest are safe to cut.  

  ---

  ### **Why This Works**  
  - **Audience-aware**: Leverages their SDT/vocabulary to *create* tension, not reject it.  
  - **Problem-first**: Taxonomy introduced as a *solution* to a felt puzzle.  
  - **Time-efficient**: One example threaded through all stages.  
  - **Blocks reductions**: Eligibility + defeaters prevent mechanistic bypassing.  

  **Final tip**: Start with a poll: "Who thinks absence-knowledge is perception? Inference? Something else?" Return to it at the end to show shifted perspectives.
