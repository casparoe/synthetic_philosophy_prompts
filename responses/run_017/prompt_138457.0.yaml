prompt: |-
  I'm a software engineer and I read a bit of philosophy in the evenings, so please don't assume I know the field's vocabulary — if you need a technical term, define it as you go, in passing.

  What I want is a test case in the sense we'd use at work: a scenario built so that two models of the same behaviour give different, checkable outputs.

  The behaviour is the ordinary one where you decide in advance to do the sensible thing, the moment arrives, and you don't do it. Two stories about it. The first, which I take to be the standard one, is present bias: as I understand it, we discount anything in the future exponentially, and then apply one extra, steeper haircut to whatever is available right now, so the ranking of a smaller-sooner against a larger-later reward flips only at the point at which the sooner reward becomes immediate. On that story nothing goes wrong with the agent's judgement at the moment of action — her preference really has changed, and the better judgement she appears to betray is only the earlier self's. The second story is my own hunch, and I'd like it taken seriously enough to be tested rather than patted on the head: nothing about her preferences changes at all. She has settled on the sensible option, she has not revised that, and what fails is the dispatch of the intention — the transition from having decided to acting, the way a process can sit scheduled and ready on a machine and simply never get picked up. On that story she is, at the moment, every bit as convinced as she was the night before, and merely doesn't start.

  So: build me a case in which the discounting story cannot generate the reversal but the dispatch-failure story can, and in which the difference shows up as something you could observe rather than as a narrator's assertion about what she believes. Please treat the following as constraints and not as suggestions. Ordinary life, one paragraph, a workplace or a home, and nothing you couldn't buy online or do with a phone — no implants, no hypothetical neuroscience, no addiction, no compulsion, no forgetting, no change in what she believes about the facts, and no division of her into parts that decide for her, at least not inside the scenario. Give the options concrete magnitudes, in hours or in pounds, small enough to be ordinary, because I mean to check the arithmetic myself. Most importantly, the option she ends up taking must not be temporally privileged at the moment she takes it: both options should lie in the future, or neither, so that the extra haircut for now has nothing to attach to. Her continuing to favour the sensible option must be visible in what she does — in what she will pay, or arrange, or welcome, or feel — rather than in what the story says she thinks.

  Then: state the two options with their times and values, check the parity condition explicitly so I can see it isn't smuggled back in, and show me the discounting arithmetic and the exact step at which it fails to produce the reversal; say what the dispatch-failure account predicts instead; tell me which single feature of the case is doing the work and what the case collapses into if that feature is removed; and give me the strongest reply available to someone who wants to keep the discounting story — I'd much rather have the best version of that objection than an easy one.

  What I'm using this for is to find out whether my hunch marks a genuinely different phenomenon or is only the discounting story wearing different words. That fixes how the case can fail: it fails if it works by definition, by rigging what counts as a judgement or as a preference so that the answer is guaranteed in advance. If you don't think it can be done honestly, say so instead, and tell me which constraint has to give. And there's no need to point me at papers or books — I've no convenient way to get hold of them, and it's your reasoning I'm after rather than a reading list. Please write in continuous prose, with no headings, bullet points, bold text or tables, the way you'd write an email.
reasoning: |-
  Okay, let me think through this software engineer's request carefully. They want a test case in ordinary life terms that distinguishes between two models of why people fail to follow through on sensible plans: the standard present bias discounting theory versus their "dispatch failure" hunch. The constraints are strict - no specialized vocabulary, no futuristic tech, no addiction or forgetting, both options future-dated, observable behavior rather than inner states, small concrete values they can verify.

  Hmm... the key challenge is creating a scenario where both options are equally distant in time so the "extra haircut for immediate rewards" can't apply, yet people still fail to execute their planned action. I need magnitudes that make the discounting math unambiguous while satisfying the parity condition. 

  What if... a person plans to leave work early at 3pm to attend their child's school play at 4pm, versus staying late to finish a report due tomorrow. Both events are future (3pm decision, 4pm play), neither is "now." The play matters more to them (say, equivalent to £100 value), while finishing work is worth £80 but avoids next-day consequences. They've decided to go to the play, arranged coverage, told their child - observable commitments. Yet at 3pm, they don't leave. 

  Now for discounting: with exponential discounting plus present bias, if neither option is immediate, the preference shouldn't reverse. At 2:59pm, the play (in 61 mins) might be discounted to £95, work (£80 in 61 mins) to £76 - still prefers play. At 3:00pm, play is now 60 mins away discounted to same £95, work 60 mins away £76 - no reversal. The math can't explain why they don't leave. 

  But dispatch failure does: the intention was formed ("decided to go"), not revised ("still believes it's important"), but fails to trigger action at the scheduled time - like a process stuck in queue. We'd see this in their frustration afterward, or willingness to pay for reminders. 

  The crucial feature is the action moment not coinciding with either reward moment. Remove that - say if leaving work gave immediate relief - and discounting could explain it. 

  Best objection? Maybe they unconsciously re-evaluated the report's urgency. But the constraint rules that out - no changed beliefs. Alternatively, perhaps "starting to leave" feels effortful now, but that smuggles in a new immediate cost. 

  This seems to honestly test the theories without rigging definitions. The observable commitments and post-factum regret make the continued preference visible. I'll present it with concrete times and values, show the discounting math step-by-step, and address that objection head-on.
answer: |-
  Consider a scenario set in an ordinary workplace. Emma, a project manager, has committed to a policy of leaving the office promptly at 5:00 PM on Tuesdays to attend her weekly evening pottery class, which she values highly for its creative satisfaction and mental respite. She has explicitly decided this is the sensible choice, as the class brings her long-term well-being worth, in her estimation, £50 per session. However, a recurring Tuesday deadline requires her to submit a project update by 6:00 PM. Completing this update on time avoids a minor professional friction she dislikes, equivalent to avoiding a loss of £10 in value, but crucially, it can be done from home with no penalty. She has arranged her tasks specifically to leave at 5:00 PM without issue, confirmed the submission can be handled remotely, and even packed her bag. At 4:55 PM, she thinks, "I'll leave in five minutes as planned." Yet, when 5:00 PM arrives, she remains at her desk, opens the update file, and begins working on it. She submits it at 5:45 PM, missing her pottery class. Later, she expresses frustration at having missed the class and confirms she still values it at £50, wishing she had stuck to her plan. She also mentions she would have paid £5 at that moment for a service that physically escorted her out of the office at 5:00 PM.

  **Options, times, and values:**  
  - **Option A (Sensible Choice):** Leave at 5:00 PM to attend pottery class (value: £50).  
  - **Option B (Default Choice):** Stay to submit update by 6:00 PM (value: avoid £10 loss, net gain equivalent to £10).  

  **Parity condition check:** At the moment of action (5:00 PM), both outcomes lie in the future. The pottery class starts at 6:00 PM (60 minutes away), and the update submission occurs at 5:45 PM (45 minutes away). Neither reward is immediate; the *actions* (leaving vs. staying) are both initiated at 5:00 PM, but their *consequences* are delayed. The "now" is the point of dispatch, not the point of reward receipt.  

  **Discounting arithmetic and failure:**  
  Standard present bias models use quasi-hyperbolic discounting: utility = *u* if immediate, or *βδᵗu* if delayed (*β* < 1 captures present bias, *δ* the exponential discount factor). At decision time *t* = 5:00 PM:  
  - **Option A (Pottery):** Reward at *t* + 60 mins. Utility = *βδ⁶⁰* × £50.  
  - **Option B (Update):** Reward at *t* + 45 mins. Utility = *βδ⁴⁵* × £10.  

  Since *β* applies only to *immediate* rewards, and neither reward is immediate (both >0 mins away), *β* affects **both equally** at *t* = 5:00 PM. Thus, the comparison is:  
  *δ⁴⁵* × £10 vs. *δ⁶⁰* × £50.  
  For any reasonable *δ* (e.g., *δ* = 0.999 per minute ≈ 0.95/hour), *δ⁴⁵* ≈ 0.96 and *δ⁶⁰* ≈ 0.95. Thus:  
  - Update: 0.96 × £10 = £9.60  
  - Pottery: 0.95 × £50 = £47.50  

  **£47.50 > £9.60** — no reversal occurs. Discounting *cannot* explain choosing the update, as Option A remains vastly preferred. The reversal happens only if Option B were immediate (e.g., if staying gave *instant* relief), but it isn’t.  

  **Dispatch-failure prediction:** Emma’s stated plan, preparatory actions (packing bag, arranging work), and later regret/willingness to pay £5 for enforcement confirm she *still prefers Option A* at 5:00 PM. The failure is purely in executing the intended action at the scheduled time, despite unchanged preferences or beliefs. The dispatch mechanism — translating the "leave now" decision into motion — stalls.  

  **Crucial feature:** The decoupling of the *action point* (5:00 PM) from the *reward points* (5:45 PM and 6:00 PM). If the rewards coincided with the action (e.g., leaving instantly relieved stress, or staying gave immediate praise), discounting could explain a reversal. Here, both rewards are delayed identically relative to the action moment, nullifying present bias’s extra "haircut." Remove this decoupling, and the case collapses into standard discounting territory.  

  **Strongest objection from discounting advocates:** One might argue that the *act of initiating work* at 5:00 PM provides an *immediate* sense of task engagement or anxiety reduction (worth £X), making Option B functionally immediate. Thus, utility at 5:00 PM becomes:  
  - Option A: *βδ⁶⁰* × £50  
  - Option B: *β* × (£X) + *βδ⁴⁵* × £10  

  If £X is high enough, Option B could win. However, this violates the constraints: it posits an unobserved, newly emerged immediate reward not present in Emma’s prior calculus or later reflection. She reports no such relief; she describes starting work as automatic, not gratifying. Crucially, the constraint forbids "change in what she believes about the facts" or new rewards — the values (£50, £10) and their timing are fixed. Injecting a hidden immediate payoff redefines the options mid-scenario, which isn’t parsimonious and conflicts with Emma’s own account.  

  This test case cleanly isolates your "dispatch failure" as distinct from preference reversal via discounting. The observable markers — preparation, post-hoc affirmation of the original preference, and willingness to pay for enforcement — confirm the persistence of the intention, while the temporal structure neutralizes present bias’s explanatory lever. It fails only if one re-engineers the options to reintroduce immediacy, which the constraints explicitly exclude.
