prompt: |-
  Hey — I'm a programming languages person, not a philosopher. Couple years of industry compiler work, now on a proof assistant, so I'm fluent in the usual toolkit: specs vs. implementations, abstract types and representation independence, parametricity, structural induction, quotient types and canonical representatives, typeclasses, transport along equivalences, denotational vs. operational semantics. Philosophy-wise I've got maybe one undergrad course, so assume I know what reference and truth conditions mean and not much past that.

  The thing I want translated is the Benacerraf-style dilemma about mathematical objects. The version I keep running into goes roughly: (1) there's a plausibility constraint on reference — you can only refer to, and so have beliefs about, things you could in principle stand in some information-carrying, roughly causal contact with; (2) there's a semantic constraint from our best theory of truth — whatever the numeral for two picks out has to be the kind of thing that makes our arithmetical sentences come out true exactly when we think they do; (3) sets are causally inert, and anyway there are at least two perfectly good ways of building the naturals out of sets (the singleton-iterating encoding and the cumulative one where each number is the set of all earlier ones — I think they're usually named after Zermelo and von Neumann, tell me if I have that backwards), and both satisfy (2) equally well while disagreeing on questions like whether one is a member of three; so (4) there seems to be no determinate object the word picks out, and mathematical truth floats free of reference.

  Restate that argument as faithfully as you can in my vocabulary, then give me the residue report. Specifically:

  - Which parts map cleanly onto interface vs. implementation / representation independence? My suspicion is that step (3) is just "two implementations of the same abstract type" and that once you see that, the worry evaporates — I want to know whether that suspicion is right or whether it quietly throws away something load-bearing.
  - Where did you have to fudge? Is reference more like a name binding, a pointer, or a value assigned by a semantics function? Is "true" more like satisfaction in a model or like the observable behaviour of a closed term? Say which choice you made and what it costs.
  - What has no counterpart in my vocabulary at all? My guess is the causal constraint in (1), since nothing in PL cares whether a program can causally interact with a value — but maybe it maps onto something like "the only values a program can get it's hands on are the ones the language can construct," and I want to hear that case made.

  Two wrinkles I want handled too, because I think they change which horn does the work:

  A. Two implementations of an interface are normally expected to agree up to isomorphism, or at least up to a quotient. But the first-order axioms of arithmetic have models that aren't isomorphic to the intended one at all — nonstandard ones with infinitely large elements — while the second-order version pins things down up to isomorphism. Translate both situations into my vocabulary and say which horn this bites, and whether it makes the "no fact of the matter" conclusion stronger or weaker than the two-encodings version does.

  B. Suppose two candidate implementations agree on every input you can actually run, but the type is potentially infinite, so "every input you can actually run" in any finite lifetime is a tiny subset, and they come apart on inputs you can describe but never reach. Is the indeterminacy in step (4) more like "two implementations that provably differ on some reachable input" (in which case my representation-independence instinct handles it fine), or more like the case I just described, where the difference is invisible from inside any finite amount of use? That second case feels different in a way I can't pin down — say what the difference comes to in the philosophy, and which reading the argument actually needs to get its conclusion.

  Finally: whatever doesn't survive the translation — is that a blind spot in the vocabulary I think in, or a sign that the philosophical argument is doing less work than it looks like it is? And end with one short paragraph on what I'd have to add to my mental model to even be able to state the problem.

  Also, please don't give me papers to chase or a reading list — I've got no library access and that isn't what I'm after. Translate, don't cite.
reasoning: |-
  We are given a Benacerraf-style dilemma and asked to translate it into the vocabulary of a programming languages expert. The dilemma has four main steps:

  (1) Plausibility constraint on reference: Reference requires information-carrying, roughly causal contact.
  (2) Semantic constraint: The referent must make our arithmetical sentences true as we expect.
  (3) Problem: Sets are causally inert and there are multiple set-theoretic encodings of natural numbers (Zermelo and von Neumann) that both satisfy (2) but differ on some properties (like whether 1 ∈ 3).
  (4) Conclusion: There is no determinate referent for mathematical terms, and mathematical truth is not grounded in reference.

  We are to restate the argument in PL terms and then answer specific questions.

  ## Restatement in PL Vocabulary

  Let's map the argument:

  - **Step (1)**: The plausibility constraint on reference. In PL, this could be thought of as: a program can only refer to (or use) values that it can construct or interact with through the operational semantics. This is similar to the idea that the only values a program can get its hands on are those that the language's operations can produce and that the program can compute with. We might think of this as the requirement that reference must be operationalized.

  - **Step (2)**: The semantic constraint. This is about the truth conditions of arithmetical sentences. In PL, we can think of a specification (an abstract type) for natural numbers that defines the expected behavior. The implementation must satisfy the specification. The "truth" of a sentence (like "2 + 2 = 4") would then be about whether the operations of the abstract type, when implemented, yield the expected results. We can model this with an abstract type `Nat` with operations (zero, succ, add, etc.) and equations that must hold (the axioms of arithmetic). The implementation must be such that when we run the program, the equations hold as per the spec.

  - **Step (3)**: The existence of two set-theoretic encodings. In PL, this is like having two different implementations of the same abstract type. For example:

    - **Zermelo**: 
      - `0 = {}`
      - `succ(n) = {n}`
      - So: `0 = {}`, `1 = {{}}`, `2 = {{{}}}`, etc.
      - Then `1 ∈ 3`? Well, `3 = {{{}}}` and `1 = {{}}`, so `{{}}` is not an element of `{{{}}}` (which has one element: `{{}}`? Wait, let me check: `3 = {{{}}}` is a set containing `{{}}`, and `{{}}` is not equal to `1`? Actually, `1 = {{}}`, and `3 = {{{}}} = { {{}} }`, so `1 = {{}}` is an element of `3` because `3 = { {{}} }`? Wait, no: `3 = {2} = { {{{}} } }`? I think I'm getting confused.

      Actually, let me define clearly:

      - Zermelo: 
          - 0 = ∅
          - 1 = {∅}
          - 2 = {{∅}}
          - 3 = {{{∅}}}
          - So 3 = {{{∅}}} = { {{∅}} } = {2}. Then 1 = {∅} and 3 = {2} = { {{∅}} }. Now, is 1 ∈ 3? That is, is {∅} an element of { {{∅}} }? The only element of { {{∅}} } is {{∅}} = 2, and 1 ≠ 2, so no. Alternatively, if we think of 3 as the set containing 2, then 1 is not in that set.

    - **von Neumann**:
          - 0 = ∅
          - succ(n) = n ∪ {n}
          - So: 
              - 0 = ∅
              - 1 = ∅ ∪ {∅} = {∅}
              - 2 = {∅} ∪ {{∅}} = {∅, {∅}}
              - 3 = {∅, {∅}} ∪ {{∅, {∅}}} = {∅, {∅}, {∅, {∅}}}
          - Now, is 1 ∈ 3? 1 = {∅}, and 3 = {∅, {∅}, {∅, {∅}}}. So {∅} is an element of 3? Yes, because {∅} is the second element.

    So the two implementations disagree on whether 1 is an element of 3.

    In PL, we have two modules that both implement the `Nat` interface (with the same observable behavior for the arithmetic operations) but have different internal representations. The question of whether 1 is an element of 3 is not part of the abstract interface (it's an internal detail). So the two implementations are representationally independent: they both satisfy the same abstract type.

  - **Step (4)**: The conclusion of indeterminacy. In PL, if the abstract type does not specify the internal structure, then there is no fact of the matter about whether 1 is in 3. The abstract type only specifies the behavior of the arithmetic operations. So the word "one" does not pick out a particular set but rather any element that plays the role of one in an implementation.

  ## Residue Report

  ### 1. Mapping step (3) to representation independence

  Your suspicion is that step (3) is just two implementations of the same abstract type and that the worry evaporates. This is largely correct. In PL, we have:

  - An abstract type `Nat` with operations and equations (the axioms of arithmetic). The two set implementations are two concrete representations that both satisfy the same abstract type. The question of whether 1 is an element of 3 is not part of the abstract type's specification, so it doesn't matter. The two implementations are equivalent up to the abstraction boundary.

  However, note that the philosophical worry is about reference: what does the word "one" refer to? In PL, we would say that the word "one" in the program does not refer to a particular set, but to an element of the abstract type. The reference is fixed only relative to an implementation. This is similar to how a variable of an abstract type in a program doesn't have a concrete representation until the implementation is chosen.

  But does this make the worry evaporate? In the PL view, yes, because we don't require that the word "one" refer to a particular set. We only require that it behaves as the number one in the context of the operations. The philosophical argument, however, is trying to force a reference to a particular object in the world (a set) and then finds that there are two equally good candidates. The PL view avoids this by not requiring such a reference.

  But note: the philosophical argument might be seen as challenging the PL view by saying that reference must be to a particular object (via causal contact) and that the abstract type doesn't provide such an object. The PL view might be seen as sidestepping the issue by allowing multiple representations. However, in the PL view, reference is not to a concrete object but to an abstract role. So the mapping is clean, but it does require accepting that reference in mathematics is abstract.

  ### 2. Where we had to fudge

  #### Reference

  In the philosophical argument, reference is a relation between a word and an object in the world. In PL, we have several options:

  - **As a name binding**: In a specific implementation, the numeral `1` is bound to a specific value (e.g., `{}` in Zermelo, or `{∅}` in von Neumann). But then we have two different bindings in two different implementations.
  - **As a pointer**: This might be similar, but in a language with pointers, the pointer would point to a specific memory location holding a specific representation.
  - **As a value assigned by a semantics function**: In denotational semantics, we have a function that maps terms to mathematical objects. But that function is defined relative to a model. So in one model, the denotation of `1` is the Zermelo set, in another it's the von Neumann set.

  I chose to think of reference as the denotation assigned by a semantics function. This is because the philosophical argument is about what the word picks out in the world. The cost is that in PL, we are used to having multiple models (implementations) and we don't require a unique denotation. The fudging is that we are not forced to choose one model as the "true" one.

  #### Truth

  In the philosophical argument, truth is about the satisfaction of a sentence in a model. In PL, we have:

  - **Satisfaction in a model**: This is the denotational view: a sentence is true if it is satisfied in the model we choose.
  - **Observable behavior of a closed term**: This is the operational view: we run the program and see if it evaluates to `true`.

  I chose the denotational view for step (2) because the semantic constraint is about making sentences true in a model. The cost is that in PL, we often care about operational behavior, and we can have multiple models that all satisfy the same specification. The philosophical argument then uses the multiplicity of models to argue for indeterminacy. But in PL, we are comfortable with multiple models.

  ### 3. What has no counterpart

  The causal constraint in (1) has no direct counterpart in PL. In PL, we don't care about causal contact with a value. We care about whether the value is constructible and usable within the language's operations. We can map it to: "the only values a program can get its hands on are the ones the language can construct." This is a computational version of the causal constraint: you can only use values that are computationally accessible.

  But note: the philosophical constraint is about causal contact in the physical world, which is stronger. In PL, we are in an abstract computational world. So the mapping is an analogy: causal contact in the physical world is like computational accessibility in the language. However, the philosophical worry is that sets are abstract and causally inert, so we cannot have causal contact with them. In PL, we don't have that problem because we are working in an abstract domain. So the residue is the physicality: the philosophical argument is often motivated by a naturalistic worldview where reference must be grounded in physical causation. PL doesn't have that constraint.

  ## Handling the Wrinkles

  ### Wrinkle A: Nonstandard Models

  The issue: first-order Peano axioms have non-isomorphic models (nonstandard ones), while second-order Peano axioms (with full second-order quantification) pin down the natural numbers up to isomorphism.

  In PL terms:

  - **First-order axioms as an abstract type**: This would be like having an abstract type specified by a set of equations (or properties) that are first-order. Then there can be multiple non-isomorphic implementations (like nonstandard models). For example, one implementation might be the standard naturals, and another might be the standard naturals plus a copy of the integers, with appropriate operations. These implementations are not representationally independent in the sense that they are not isomorphic, but they both satisfy the same first-order axioms.

  - **Second-order axioms**: This is like having an abstract type specified in a more powerful logic (like higher-order) that forces the implementation to be isomorphic to the intended one. In PL, we might think of this as using a stronger specification language (e.g., with parametricity) that rules out nonstandard implementations.

  Which horn does this bite? It makes the "no fact of the matter" conclusion stronger. Why? Because with first-order axioms, not only do we have multiple set-theoretic encodings (which are isomorphic), but we also have non-isomorphic models. So the indeterminacy is even worse: we cannot even fix the structure up to isomorphism. The argument then says that there is no fact about which model is the "real" natural numbers.

  In the two-encodings version (Zermelo vs von Neumann), the two implementations are isomorphic. So we can say that they are just different representations of the same structure. But with nonstandard models, we have different structures. So the problem is more severe.

  In PL, the abstract type for first-order arithmetic does not require that all implementations be isomorphic. So we are used to this. The philosophical worry is that we cannot fix the reference of the numeral to a particular object (or even a particular isomorphism class) because there are multiple non-isomorphic models. The PL view: we can still have an abstract type, and we don't require a unique implementation. But the philosophical argument wants a unique reference.

  ### Wrinkle B: Differences on Unreachable Inputs

  The scenario: two implementations agree on all inputs that can be run in any finite lifetime (because the type is infinite and we can only run finitely many) but differ on inputs that are describable but unreachable.

  In PL, this is like having two implementations of an abstract type for natural numbers that are behaviorally equivalent on all inputs that any program can actually compute in finite time, but might differ on some very large number that no program can actually produce. For example, one implementation might have a different representation for numbers larger than 10^100, but since no program can run long enough to produce such a number, the difference is not observable.

  In the philosophical argument, is the indeterminacy more like:

  - Two implementations that differ on some reachable input? (then we can detect the difference and rule one out) 
  - Or the case where the difference is invisible? 

  The argument actually needs the second case to be more troublesome. Why? Because in the first case, we can use the specification to rule out an implementation that fails on a reachable input. But in the second case, both implementations satisfy the specification as far as we can observe. So we have no way to choose between them.

  In the set-theoretic encodings, the differences (like whether 1 ∈ 3) are not observable by the arithmetic operations. They are internal details. So the set-theoretic case is like the second case: the differences are not observable by the abstract type's operations. But note: in the set-theoretic case, the differences are not about the arithmetic operations at all. They are about set-theoretic properties that are not part of the arithmetic interface.

  The case in wrinkle B is different because it is about the arithmetic operations themselves: the two implementations might give different answers for the addition of two very large numbers (if we could compute it) but we cannot compute it. So it's a difference in the implementation of the arithmetic operations on unreachable inputs.

  The difference in the philosophy: the set-theoretic case is about properties that are not part of the specification (so we don't care), but wrinkle B is about properties that are part of the specification (the arithmetic operations) but we cannot check. So the worry is that the specification is underdetermined by the observable behavior.

  The argument needs the set-theoretic case to be analogous to wrinkle B? Actually, no. The set-theoretic differences (like 1 ∈ 3) are not part of the arithmetic specification. So they are not observable. But wrinkle B is about the specification itself: the abstract type specifies the behavior for all inputs, including the unreachable ones. But we can never test the unreachable ones. So we cannot tell which implementation is correct for the unreachable inputs.

  The Benacerraf argument doesn't require wrinkle B. The set-theoretic encodings both satisfy the arithmetic specification for all inputs (including the unreachable ones). The differences are in irrelevant details. But wrinkle B introduces a new kind of underdetermination: two implementations that satisfy the specification for all inputs we can run but may fail on unreachable inputs (and we don't know). But that's not the case in the set-theoretic encodings: both Zermelo and von Neumann satisfy the arithmetic operations for all inputs. So the argument as stated doesn't need wrinkle B. But let's see how it might be used.

  In the context of the causal constraint (step 1), if we can only refer to things we can causally interact with, then we cannot refer to the unreachable numbers. So maybe we can only specify the arithmetic operations up to the reachable numbers. Then the specification would be incomplete, and there would be no fact about what happens at unreachable numbers. This would be an additional source of indeterminacy.

