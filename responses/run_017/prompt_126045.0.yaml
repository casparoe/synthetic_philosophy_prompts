  First, I need to unpack their core question: Is formal Whiggishness unavoidable in narrative structure? They mention devices like "dead future" scenes, focusing on obscure characters, and ending mid-crisis. The proposal must justify why this isn't just a philosophical issue but something a novelist must test through craft.

  The user wants precision. So, defining "formal Whiggishness" clearly is key—linking it to narrative elements like pacing, turning points, and irony. They also want to show why existing critiques (from historians) don't address form, and why narrative theorists who see emplotment as essential make the problem seem trivial. That gap is where their project fits.

  They need a methodology that's concrete: drafting experimental chapters, getting reader feedback, comparing versions. The failure conditions are practical—if readers can't distinguish the anti-Whig versions or find them dull, the experiment fails. Including a timeline with buffer months is wise because creative work is unpredictable.

  Assessing feasibility: Six months is tight but doable if scope is focused. Cutting the "dead futures" device makes sense—it's ambitious and could derail the main narrative. Prioritizing character filters and the open-ended structure keeps the core question manageable.

  Honesty about failure conditions strengthens the proposal. It shows rigor—success isn't just about writing differently but proving the text's devices affect perception irrespective of reader knowledge. This could contribute to both historical fiction craft and narrative theory, which is a solid sell for the fellowship.

  I should check if all user points are covered: precise question, gap in literature, novelist's role, method, failure, feasibility. Yes—structuring each section to hit these. Also, naming theoretical positions without citations (per their request) keeps it concise. They'll add citations later. 

  Finally, the proposal's hook is positioning this as an underexplored intersection of history and narrative form, with the novelist's tools as the best test. Emphasizing that outcome makes it compelling beyond just their novel.
answer: |-
  Here’s a structured two-page proposal addressing your needs. It frames your question sharply, identifies the gap in existing discourse, justifies your novelist’s approach, outlines a feasible 6-month method, defines failure, and suggests scope adjustment:

  ---

  ### Proposal: **Testing the Limits of Narrative Form: Can Historical Fiction Escape "Formal Whiggishness"?**

  **1. Core Research Question:**  
  *Can the formal structures of narrative fiction (plot arc, pacing, scene selection, dramatic irony) avoid implying historical inevitability, even when the novel consciously rejects explanatory Whiggishness (i.e., judging the past by present outcomes or attributing victory to superior insight)?*

  **2. The Gap in Existing Critique:**  
  *   **Standard Anti-Whig Historiography:** Focuses on *explanatory* fallacies (e.g., Butterfield, post-revisionists). It critiques *why* we say things happened, not *how* the narrative *shape itself* imposes inevitability. A novel can be impeccably anti-Whig in its historical explanations while still being formally Whiggish through its structure.  
  *   **Narrative Necessity Arguments:** Theorists like White (or structuralists) argue that "emplotment" – giving events a coherent shape (tragedy, comedy, romance) – is fundamental to narrative meaning. This risks making the question trivial: if *all* plots imply teleology, then avoiding formal Whiggishness is impossible by definition.  

  This project interrogates that presumed impossibility. **The open question is:** Are there specific, deliberate formal strategies that can disrupt the reader's *felt sense* of inevitable progression towards the known historical outcome, *even within* a plotted narrative? Does "emplotment" *necessarily* equate to "teleology"?

  **3. Why a Novelist? Why This Novel?**  
  *   **Materiality of Craft:** Philosophers/theorists analyze *examples* abstractly. The novelist *builds* the narrative structure. Testing whether formal Whiggishness is avoidable requires *creating alternative structures* and observing their effect on reader experience.  
  *   **Reader Response as Data:** The core evidence lies not in theoretical consistency but in whether readers *feel* the difference. Does an "anti-whig" chapter *read* differently – generating suspense, uncertainty, or investment in lost futures – compared to a "whig" chapter covering the same events?  
  *   **This Project’s Specificity:** The novel’s setting (pre-known-reform), focus on obscure agents, and the disconnect between local experience and central events create an ideal laboratory. The known historical outcome (the Reform Act) provides a fixed point against which to measure the narrative's ability to suspend its inevitability.

  **4. Methodology: A 6-Month Experimental Workshop**  
  *(Residency Focus: Drafting, Experimentation, Reader Testing)*

  *   **Month 1: Foundational Drafting & Theory Synthesis:**  
      *   Finalize core "baseline" chapters depicting the printers/attorney/sister reacting to rumours (current draft state).  
      *   Articulate explicit "Whig" vs. "Anti-Whig" formal principles for the experiment.  
  *   **Month 2-3: Crafting Experimental "Anti-Whig" Devices:**  
      *   **Device 1 (Obscure Agents):** Intensify the POV restriction. Draft key scenes (e.g., news of pivotal debates) *only* through characters utterly disconnected from power/influence. Render the Act's progress as fragmented, misunderstood, or irrelevant noise. Famous figures appear only as names in misheard gossip.  
      *   **Device 2 (Open Ending):** Draft an ending at the peak of local crisis/uncertainty (e.g., a riot sparked by rumour, a character's desperate gamble *before* the Act's fate is known locally). *No* resolution, no hindsight reflection.  
      *   *(Device 3 - "Dead Futures" - potentially deferred, see Feasibility)*  
  *   **Month 4: Crafting "Whig" Control Versions:**  
      *   For the *same* key events/scenes drafted in Month 2-3, write "Whig" versions:  
          *   Use pacing/editing to create clear rising action towards the known outcome.  
          *   Employ dramatic irony ("Little did they know...").  
          *   Frame scenes to highlight information/actions that readers know *will* prove significant.  
          *   Provide narrative closure linking local events to the national outcome.  
  *   **Month 5: Structured Reader Testing:**  
      *   Recruit beta readers (historically aware & general fiction readers).  
      *   Present paired, anonymized excerpts: "Whig" vs. "Anti-Whig" versions of the *same* scene/chapter.  
      *   Use targeted questionnaires:  
          *   Did the outcome feel inevitable? Why/why not?  
          *   Where did you feel suspense/uncertainty?  
          *   Did characters' actions feel futile or significant?  
          *   What seemed like the "turning point"?  
          *   (Crucially) Could you discern a deliberate stylistic/narrative difference between the pairs? Describe it.  
  *   **Month 6: Analysis, Revision & Reporting:**  
      *   Analyze reader responses for patterns: Do the anti-whig devices measurably disrupt the *sense* of inevitability? Is the difference perceptible? Does it create engagement or confusion/distance?  
      *   Revise experimental chapters based on findings.  
      *   Draft the Fellowship Report: Define "formal Whiggishness," present methods, analyze reader data, answer the core question based on evidence, outline implications for the novel and historical fiction.

  **5. Failure Conditions & Success Metrics:**  
  The project FAILS if:  
  *   Readers cannot consistently distinguish the formal strategies used in "Whig" vs. "Anti-Whig" excerpts based on the *text itself* (i.e., difference is random or undetectable).  
  *   The "Anti-Whig" excerpts are consistently perceived as *less engaging*, *confusing*, or *dull* compared to the "Whig" versions, with no compensating intellectual/emotional payoff.  
  *   Reader responses show the *only* factor influencing the sense of (in)evitability is *their prior historical knowledge*, not the formal devices employed in the text.  

  Success is demonstrating:  
  *   Discernible formal differences perceptible to readers.  
  *   These differences measurably alter the *reader's experience* of historical inevitability/uncertainty.  
  *   The "Anti-Whig" approach generates valid, distinct narrative engagement (suspense in ambiguity, pathos for lost futures, intellectual challenge).

  **6. Feasibility & Scope Adjustment:**  
  The core question and methodology are viable for 6 months **IF** scope is tightly focused.  

  *   **Cut Device 3 ("Dead Futures"):** This is the highest-risk, most complex element. Drafting full, weighted alternative-history scenes within the main narrative demands significant world-building/page count and risks narrative coherence or reader whiplash. It introduces a *second* major formal experiment (counterfactual narration) that could overshadow the primary focus on *structuring the known past*.  
  *   **Focus on Devices 1 & 2:** Restricting POV to obscure agents and crafting an open-ended structure directly tackle the core question of narrative inevitability within the known historical framework. This is sufficient for a rigorous test.  
  *   **Buffer:** The timeline includes inherent buffers. Months 2-4 involve drafting *versions* of key scenes, not the entire novel. Reader testing (Month 5) is targeted on excerpts.

  **Conclusion:**  
  This project bridges historiography and narrative theory through the practical craft of fiction. It asks if the *form* of storytelling inherently betrays the anti-Whig historian's goal. By creating controlled textual experiments and measuring reader response, it seeks a determinate answer: Can specific techniques disrupt the teleological pull of plot, or is formal Whiggishness the unavoidable cost of telling a story about the past that leads to our present? The answer, whether yes, no, or qualified, will significantly advance the craft of historical fiction and our understanding of narrative temporality.

  ---

  **Key Strengths for the Fellowship Committee:**

  *   **Clear, Original Question:** Moves beyond well-trodden explanatory critiques to a formal one.
  *   **Methodological Rigor:** Combines creative practice with structured experimentation and reader-response analysis.
  *   **Feasible Scope:** Explicitly scoped for 6 months with a clear cut (Dead Futures).
  *   **Honest Assessment:** Defines clear, meaningful failure conditions.
  *   **Broader Relevance:** Addresses a fundamental tension in historical representation applicable beyond this novel.
  *   **Novelist-Centric:** Justifies why *this* needs a novelist-in-residence, not just a theorist.

  **What to Supply:** Fill in the specific Reform Act, character names, and key historical events/rumours mentioned in the novel. Add 1-2 key citations for Anti-Whig history (Butterfield?) and Narrative Theory (White?) if desired, though naming positions is sufficient as proposed. Good luck!
