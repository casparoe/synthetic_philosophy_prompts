prompt: |-
  I'm giving a ninety-minute seminar on anthropic reasoning next month to a reading group of statistics and economics PhD students: fluent in Bayes' theorem and in ordinary selection effects such as survivorship bias and truncated samples, but none of them has encountered self-locating evidence. The goal is narrow. They should leave able to write down, for one pair of hypotheses, the likelihoods that the self-sampling assumption (reason as if randomly drawn from the actual observers in your reference class) and the self-indication assumption (your own existence is itself more probable the more observers there could be) assign to the datum, and to point at the term where the two expressions come apart — not to have a view on which principle is true.

  My candidate carrying case is a version of the presumptuous philosopher: two hypotheses that the students' ordinary evidence treats symmetrically, one containing far more observers than the other, but with the surplus observers confined to a much later era, causally disconnected from ours and with evidence nothing like ours. I want to know whether that wrinkle belongs in the case from the first minute or should be added once a plainer version has done its work, and, more generally, what the carrying case has to have and has to lack. I'd also like them to meet at least one case where the two principles agree, so they don't leave thinking that anthropic reasoning always moves the answer.

  Plan the session rather than write the explanation: the order in which the distinctions must arrive and what depends on what; where to locate the point that the disagreement concerns a likelihood term rather than a prior; the misconceptions to expect (I'm guessing that you cannot update on your own existence because you had to exist in order to ask, and that the self-indication assumption is just the self-sampling assumption with a wider reference class) and the point in the sequence at which to defuse each; one closing question that distinguishes having the structure from having memorized a verdict; and what I should openly decline to settle in ninety minutes. Lead with the single most important structural decision in your first sentence, then give the plan, with no preamble.
reasoning: |-
  Okay, the user is preparing a seminar on anthropic reasoning for stats and economics PhD students. They need a plan that focuses narrowly on teaching how to write likelihoods under SSA and SIA for a specific case, highlighting where they diverge. The students are Bayes-proficient but new to self-locating evidence.

  Hmm, the key is to choose a case where SSA and SIA clearly disagree on likelihoods but agree on priors. The presumptuous philosopher variant with temporally disconnected observers seems ideal—it prevents contamination from ordinary evidence. Starting simple without the wrinkle first might help, then adding complexity once the core conflict is grasped.

  Wait, the user mentioned misconceptions. They'll likely think updating on existence is impossible (since you must exist to update) or confuse SIA with broader reference classes. Need to explicitly defuse these when introducing the datum "I exist in an observer-containing world." Also, must emphasize that the disagreement happens in the likelihood ratio's numerator/denominator asymmetry.

  For structure: Begin with a neutral case where both principles agree (like a single-hypothesis warm-up) to show anthropics isn't always necessary. Then introduce the two-hypothesis setup without temporal disconnection first—calculate SSA/SIA likelihoods side by side to reveal the divergence. Only after that add the wrinkle to address "but what about causal dependence?" objections. 

  The closing should test structural understanding: Ask how the likelihood ratio behaves under each principle if one hypothesis predicts 99% of observers are in causally disconnected realms. And explicitly state we WON'T resolve which principle is correct—just map the disagreement. 

  Timing breakdown: 25min on basics/reference classes, 35min on core case + divergence, 15min on wrinkle/clarifications, 10min for agreement case + Q&A, 5min buffer. Must ruthlessly skip philosophical debates to stay within 90min.
answer: |-
  Here's the seminar plan, centered on **starting with a simplified presumptuous philosopher case (without the temporal/causal wrinkle) to isolate the SSA/SIA likelihood divergence, then adding the wrinkle to address anticipated objections and reinforce the core conflict**:

  **Structure & Timing (90 min total):**

  1.  **Groundwork & Neutral Case (25 min):**
      *   (5 min) **Define "Self-Locating Evidence"**: Data telling you *where/when/who* you are among possibilities (e.g., "It's Monday," "I have a headache," "I exist"). Contrast with "non-indexical" evidence (e.g., "The coin landed heads").
      *   (10 min) **Introduce Reference Class Problem (Briefly)**: Observers? Humans? Sentient beings? Conscious moments? Acknowledge complexity, stipulate a fixed, plausible class (e.g., "human-level conscious observers") for today. Emphasize it's a choice.
      *   (10 min) **Case 1: Single Hypothesis Agreement (Doom Soon vs. Doom Late - Symmetric Prior)**:
          *   H1: Humanity goes extinct in 100 years (1e10 observers total).
          *   H2: Humanity survives 1e6 years (1e15 observers total).
          *   **Datum (D)**: "I am an observer existing *before* the potential doom event (e.g., in year 2024)."
          *   **Show SSA & SIA Likelihoods Agree**: P(D | H) = 1 for *both* H1 and H2 under SSA (all observers are pre-doom) and SIA (your existence doesn't differentially favor H1 or H2 *given D*). **Key Point:** Anthropic reasoning doesn't always shift probabilities. Update favors neither hypothesis if priors were equal.

  2.  **Core Conflict: Simplified Presumptuous Philosopher (35 min):**
      *   (5 min) **Introduce Hypotheses H_a and H_b**:
          *   H_a: Universe contains 1e10 observers.
          *   H_b: Universe contains 1e15 observers.
          *   **Assume Priors P(H_a) = P(H_b) = 0.5** based on *non-indexical* evidence (e.g., physics models). Emphasize symmetry.
      *   (10 min) **The Datum (D) & Misconception #1**: D = "I exist (as an observer in this universe)."
          *   **Defuse Misconception #1 ("Can't update on existence")**: Ask: "Does D rule out any logically possible worlds?" (Yes: worlds with *no* observers). Show calculation: P(D | H) = 1 if H predicts >=1 observer, 0 otherwise. For H_a/H_b, both P(D | H_a) = 1 and P(D | H_b) = 1. **Update *is* possible and necessary** – it eliminates observer-less hypotheses but doesn't distinguish H_a/H_b *yet*. SSA/SIA kick in for *finer* distinctions.
      *   (15 min) **Define SSA & SIA & Calculate Likelihoods**:
          *   **Self-Sampling Assumption (SSA)**: Reason as if randomly selected from *actual* observers in your reference class.
              *   P_SSA(D | H_x) = 1 / N_x (Probability of being *you* specifically is undefined, but probability of being *some* observer in H_x is 1. The relevant likelihood for distinguishing H_x vs H_y is proportional to the probability of observing that you are *an* observer *in a universe like that described by H_x*, which is 1 *if* H_x has observers, but the *relative* probability under SSA for D="I am an observer" *given H_x is true* is **1/N_x** for the purpose of comparing hypotheses. This captures "how likely is it I'd be me in *this* specific universe?").
          *   **Self-Indication Assumption (SIA)**: Your existence is more probable the more observers *could have* existed. Formally: P_SIA(D | H_x) ∝ P(D | H_x) * P(Observer Existence | H_x) ≈ P(Observer Existence | H_x). For hypotheses *with* observers, P_SIA(D | H_x) ∝ N_x. *(Normalization matters for absolute prob, not for likelihood ratio H_a vs H_b)*.
          *   **Calculate & Compare**:
              *   SSA: P(D | H_a) / P(D | H_b) = (1/N_a) / (1/N_b) = N_b / N_a = 1e15 / 1e10 = 1e5. **Strongly favors H_a (fewer observers)**.
              *   SIA: P(D | H_a) / P(D | H_b) ∝ N_a / N_b = 1e10 / 1e15 = 1e-5. **Strongly favors H_b (more observers)**.
          *   **Point of Divergence**: The **1/N_x** term in SSA (highlighted). SIA lacks this term and has the **N_x** term instead.
      *   (5 min) **Misconception #2 ("SIA is just wider reference class")**: Explicitly contrast. SSA uses *actual* observers in the realized universe (N_a or N_b). SIA weights by *possible* observers the hypothesis *allows* (proportional to N_x). The reference class (e.g., "human-level observers") is the *same* for both SSA and SIA in this calculation. The difference is in how they use N_x.

  3.  **Introduce the Wrinkle & Refine (15 min):**
      *   (5 min) **Modify H_b**: Now H_b contains 1e15 observers, but only 1e10 exist "now" in causally connected eras with evidence like ours. The other 9.99e14 exist vastly later, causally disconnected, with potentially very different evidence.
      *   (5 min) **Address Objection**: "But we *observe* evidence E ('now-like' era, specific physics, etc.). Doesn't this break the symmetry?" **Answer**: Yes! Our *full* evidence (D + E) breaks symmetry. But the *anthropic core* of updating on *existence itself* (D) is unchanged. We are isolating the effect of D.
      *   (5 min) **Recalculate Likelihoods (Focusing on D)**: Reference class = "observers" (including future disconnected ones? Crucial choice!).
          *   **If Reference Class Includes Future Observers**: SSA P(D|H_b) = 1 / (1e15) (you're unlikely to be early). SIA P(D|H_b) ∝ 1e15. Conflict remains.
          *   **If Reference Class = "Now-like" Observers Only**: P(D | H_a) = 1 / N_a_now = 1/1e10. P(D | H_b) = 1 / N_b_now = 1/1e10. **SSA now agrees with non-anthropic prior (no update)!** SIA still favors H_b ∝ Total N_b = 1e15. **Key Insight:** The wrinkle *moves* the conflict into the **reference class choice**. SSA's answer becomes highly sensitive to it; SIA's (for this datum D) is not. The fundamental disagreement persists unless the reference class is restricted to exactly the observers sharing *all* your non-indexical evidence.

  4.  **Recap, Distinguishing Question & Limits (10 min + 5 min buffer):**
      *   (5 min) **Recap**: Show side-by-side likelihood equations for H_a/H_b under SSA (1/N_x) and SIA (∝ N_x). Circle the diverging terms. Stress: This is a conflict in the *likelihood* of D="I exist", given the hypothesis. Priors were symmetric. Non-indexical evidence E is handled separately.
      *   (3 min) **Closing Distinguishing Question**: "Hypothesis X predicts 100 observers total, 1 in a 'green' room, 99 in causally disconnected 'red' rooms. Hypothesis Y predicts 10,000 observers total, 1 in a 'green' room, 9,999 in causally disconnected 'red' rooms. You wake up in a green room. How does the *likelihood ratio* P(Green Room | X) / P(Green Room | Y) differ under SSA vs. SIA? (Assume reference class = all observers)."
          *   **Answer**: SSA: (1/100) / (1/10000) = 100. Favors X (fewer observers). SIA: (1 * 100) / (1 * 10000) = 0.01. Favors Y (more observers). Tests understanding of the core divergence term (1/N vs N).
      *   (2 min) **Openly Decline to Settle**:
          *   Which principle (SSA or SIA) is "correct."
          *   How to definitively choose the "right" reference class.
          *   Resolving the metaphysical puzzles (e.g., the Doomsday Argument, Sleeping Beauty) fully.
          *   The interaction of anthropic reasoning with *very* large or infinite universes (measure problem).
      *   **(Buffer 5 min)**

  **Key Structural Decisions & Why:**

  1.  **Lead with Simplified Case:** Starting without the temporal/causal wrinkle avoids immediate distractions about reference class boundaries and evidence similarity. It isolates the core mathematical conflict (1/N vs N) cleanly.
  2.  **Explicitly Confront Misconceptions Early:** Addressing "can't update on existence" when introducing the datum D is crucial. Defusing the "SIA = wider reference class" myth when defining SIA prevents fundamental confusion.
  3.  **Locate Divergence in Likelihood Term:** By setting symmetric priors based on non-indexical evidence, the update *entirely* hinges on the likelihood ratio P(D|H_a)/P(D|H_b). Calculating this explicitly for SSA and SIA makes the point undeniable. Highlighting the specific term (1/N_x vs N_x) pinpoints the disagreement.
  4.  **Introduce Wrinkle *After* Core Conflict:** Adding the temporal/causal disconnection *later* serves two purposes: (a) It addresses the natural objection ("But those other observers are different!") that arises after seeing the core SSA result favoring the smaller universe. (b) It demonstrates how the reference class choice *interacts* with the disagreement (SSA becomes sensitive to it, SIA less so), enriching understanding without undermining the initial clear conflict.
  5.  **Include Agreement Case First:** Showing a scenario (Doom Soon/Late with symmetric priors and pre-doom datum) where SSA/SIA *agree* and anthropics doesn't move the needle prevents the misconception that it *always* dominates or always causes conflict. It demonstrates judicious application.
  6.  **Focus on Calculation & Structure:** The plan drills into writing down the specific likelihoods and ratios. The closing question tests the ability to *apply* the structure (identifying the likelihood ratio under each principle) to a novel but isomorphic scenario, not recall a verdict on the presumptuous philosopher itself.
