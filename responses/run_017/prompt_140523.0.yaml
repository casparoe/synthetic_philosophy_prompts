prompt: |-
  I'm the grad-student rep on my institute's ethics committee, which mostly means I take the minutes, but this time I also have to draft the actual recommendation, and I'm stuck. The committee assigns every kind of animal or preparation a "protection tier" from 0 to 4, which determines what procedures need full review and how much justification has to be written up. Here's our track record, as far as I can reconstruct it from the minutes: typical adult human, 4; human infant, 4; an adult human with severe microcephaly (roughly a third of typical brain mass, profound cognitive impairment), 4, and the discussion was short; an anencephalic infant, 2 — the only time we've ever placed a human below 3, and the vote was 4–3, with the dissenters saying the tier system should just stop at the species line. Chimpanzee, 3; gorilla, 3, and someone explicitly wrote in the minutes that "we are not going to split hairs over grams," even though a gorilla brain is substantially bigger than a chimp's. Sperm whale, 2 — biggest brain on earth, no bump at all. African elephant, 2. Raven, 2, and African grey parrot, 2, both on behavioural grounds (tool use, flexible problem solving). Pig, 1. Mouse, 1. Zebrafish, 0. And a human-derived cerebral organoid with a few million neurons and no behaviour whatsoever, 0, with a line saying the species the cells came from is irrelevant. Oh, and dog, 2 versus pig, 1, which everyone privately admits is basically cultural, but nobody on the committee will reopen it.

  The new proposal is from a postdoc who wants to do aversive conditioning on common octopuses — mild shock they can learn to avoid by moving to a different compartment — plus some terminal surgery under anaesthesia afterwards to look at gene expression. The briefing she attached says an octopus brain is about half a gram, that she has around half a billion neurons but most of them are out in the arms with maybe 40–50 million in the central brain, that the body can run to several kilos, that they're solitary, semelparous and live a year or two, and that the evidence on flexible problem solving is good while anything like self-recognition is contested at best. (One caveat: the briefing also claims the sperm whale's cortex is thin and comparatively neuron-poor, and I've since been told that's disputed for at least some toothed whales, so please don't lean hard on that particular fact.)

  What I can't figure out is what rule we've actually been running, and I'd rather you tell me than have me invent one after the fact. As far as I can see the precedents are compatible with something like "absolute forebrain neuron count, with a floor for humans," with something like "behavioural capacities, with anatomy only as evidence and the human cases handled as a separate legal fact," and maybe with some brain-to-body-ratio thing that would explain why the whale and the elephant didn't move and the raven did — but those rules come apart on the octopus, and possibly come apart badly. So: what are the two or three rules that fit our verdicts, what does each predict for the octopus, what's your best guess for what this committee will actually do once I put it to a vote, and which of our old cases is the closest analog? I also want the honest version of what we'd be committing to either way — if we give the octopus a 2 on behaviour despite a half-gram brain, we've admitted size is only ever a proxy; if we give it a 1 because of the central neuron count, we've picked a specific anatomical currency and I'd like to know why that one. Last thing: my own candidate for the case that would settle it is one nobody's proposed — suppose we could swap an animal's neurons for functionally identical but physically bigger units, so the brain triples in volume, the neuron count doesn't change, and nothing about the animal's behaviour changes. If our rule says the tier goes up, we've been doing size-per-se the whole time. Tell me whether you buy that as the decisive test, or whether you've got a better one, and whether we should just stop using brain metrics altogether and switch to something behavioural (and what we'd lose if we did).
reasoning: |-
  Hmm, this is a fascinating ethics committee puzzle. The user is a grad student rep struggling to draft a recommendation for octopus research based on their committee's inconsistent tier assignments. They've provided a detailed history of past decisions that reveal several contradictions: humans always get tier 4 regardless of brain mass (even microcephalic adults), while highly intelligent animals like whales and elephants only get tier 2. The octopus case seems to force a confrontation between anatomical and behavioral criteria.

  Let me unpack the patterns first. The committee clearly operates with a human exception clause - any human-derived entity gets automatic high protection, as seen with the anencephalic infant being the only human case below tier 3 (and that was controversial). For non-humans, there's tension between three possible rules: 1) Absolute neuron count (but whales have more neurons than chimps yet lower tier), 2) Behavioral complexity (supported by ravens/parrots at tier 2), and 3) Brain-to-body ratio (which might explain why small-brained birds score higher than large mammals).

  The octopus briefing creates a perfect storm: tiny central brain (50M neurons) but impressive behavioral flexibility. If they assign tier 2 based on behavior, they admit size doesn't matter - which undermines past decisions like the whale. If they assign tier 1 based on anatomy, they privilege neuron count over cognition - contradicting the bird cases. 

  I suspect the committee will split along familiar lines. The "species line" faction will note octopuses aren't vertebrates and assign tier 1. The cognition-focused members will point to tool use studies and push for tier 2. Since the user needs a draft recommendation, I should propose tier 2 with enhanced safeguards - this aligns with the bird precedents while acknowledging the invertebrate status may bias some voters. 

  The user's proposed neuron-swap thought experiment is brilliant. If the committee would upgrade a tier after such a swap, they're covertly using size metrics. But given their history (whale brain size ignored, bird cognition valued), I doubt they would. This suggests they're already using behavioral criteria inconsistently. 

  Ultimately the committee needs to confront that their system has three conflicting principles: human exceptionalism, neuroanatomical thresholds, and cognitive complexity. The octopus forces this reckoning. If I were advising long-term, I'd recommend separating the criteria: set absolute bars for neuronal complexity, then allow behavioral evidence to override upwards. But for now, tier 2 is the least inconsistent path.
answer: |-
  Based on your committee's precedents, three distinct (and conflicting) rules emerge, each predicting different outcomes for the octopus. Here's the breakdown, along with predictions, committee dynamics, analogies, implications, and your thought experiment:

  ---

  ### **Rule 1: Cognitive Complexity Proxy (Behavioral Flexibility)**
  - **What it is**: Tier based on *demonstrated behavioral sophistication* (tool use, problem-solving, learning), with anatomy as supporting evidence. Humans are exempt via "human exceptionalism."
  - **Fits Precedents**: 
    - Ravens/parrots (Tier 2) elevated despite small brains due to behavior.
    - Sperm whale/elephant (Tier 2) downgraded despite large brains due to perceived cognitive limits.
    - Human microcephaly (Tier 4) overridden by species status.
  - **Octopus Prediction**: **Tier 2**. Strong evidence of flexible problem-solving (e.g., maze navigation, jar opening), aversive learning capacity aligns with conditioning proposal. Central brain size ignored (like ravens).
  - **Committee Vote Likelihood**: **Probable (5–2)**. Majority will cite behavioral parallels to birds. Dissenters may argue invertebrates lack "higher cognition."

  ### **Rule 2: Absolute Neuron Count (Central Nervous System Focus)**
  - **What it is**: Tier tied to *absolute neuron count in the brain* (not total PNS), with humans exempt. Ignores body size/behavior.
  - **Fits Precedents**: 
    - Chimp/gorilla (Tier 3) ~6-9B cortical neurons; whale/elephant (Tier 2) ~10-20B but deemed "less efficient." 
    - Pig (Tier 1, ~22M cerebral neurons) vs. dog (Tier 2, ~500M+). 
    - Organoid (Tier 0, 10⁶ neurons).
  - **Octopus Prediction**: **Tier 1**. Central brain ~40-50M neurons — between pig (22M) and dog (500M). Arms' neurons discounted (treated as PNS).
  - **Committee Vote Likelihood**: **Possible (4–3)**. Anatomical conservatives will note central brain size is closer to lab mammals than birds/primates. Behavioral evidence dismissed as "instinctive."

  ### **Rule 3: Neuroanatomical "Sacredness" (Vertebrate Bias)**
  - **What it is**: Tier 3+ reserved for vertebrates with complex cortices. Invertebrates capped at Tier 2 max, regardless of behavior.
  - **Fits Precedents**: 
    - All vertebrates (even zebrafish) get Tier ≥1; organoid (derived human cells) Tier 0. 
    - Anencephalic infant (Tier 2) treated as "non-typical vertebrate." 
    - No invertebrate precedents (octopus is first test).
  - **Octopus Prediction**: **Tier 1 or 2, but capped at 2**. Maximum Tier 2 if behavior impresses, but likely **Tier 1** as invertebrate.
  - **Committee Vote Likelihood**: **Strong (6–1)**. Unspoken vertebrate/invertebrate hierarchy prevails. "They’re just sophisticated slugs" sentiment.

  ---

  ### **Your Committee's Likely Outcome**
  - **Prediction**: **Tier 2** (leaning 5–2 vote).  
    - *Why?* Behavioral evidence (problem-solving, learning capacity) will sway majority, overriding central neuron count. Ravens/parrots set a "small brain but smart" precedent.  
    - *Dissent*: Vertebrate traditionalists and anatomical reductionists will argue for Tier 1.  
  - **Closest Analog**: **African Grey Parrot** (Tier 2). Both exhibit complex cognition despite small brains, and conditioning protocols are similar.

  ---

  ### **Implications of Either Decision**
  - **Assigning Tier 2**: 
    - **Commitment**: Behavioral complexity > neuroanatomy. Size is only a proxy, and a poor one for outliers (whales, birds, cephalopods).  
    - **Risk**: Forces re-examination of sperm whale/elephant tiers (currently inconsistent).  
  - **Assigning Tier 1**:  
    - **Commitment**: Central neuron count is the "currency." Anatomy trumps behavior.  
    - **Risk**: Undermines raven/parrot decisions. Implies cognition is irrelevant if neurons are "too few" or "in the wrong phylum."

  ---

  ### **Your Thought Experiment: Neuron Swap**
  - **Decisive? Yes, but only if the committee engages honestly**.  
    - If tier increases with brain size (despite identical cognition), they admit to **size fetishism** (whale/elephant downgrades contradict this).  
    - If tier *unchanged*, they prioritize **functional output** (behavior) over structure (aligns with bird/octopus Tier 2 logic).  
  - **Verdict for Your Committee**: They would **NOT** increase the tier. Precedents show behavior > size (ravens vs. whales), and dog/pig cultural bias reveals non-anatomical factors.

  ---

  ### **Recommendation: Ditch Brain Metrics, Switch to Behavior**
  - **Why?** Your committee already uses behavior to elevate birds and downgrade whales. Brain metrics are inconsistently applied and culturally biased (dog vs. pig).  
  - **What to Use Instead**:  
    A **Cognitive Capacity Index** based on:  
    - Learning flexibility (e.g., reversal learning, cross-modal transfer)  
    - Tool use/innovation  
    - Evidence of pain/distress complexity (e.g., trade-offs, self-administration avoidance)  
    - Social cognition (if applicable)  
  - **What You Lose**:  
    - False objectivity of numbers (neuron counts impress grant reviewers).  
    - Expediency (behavioral assessment requires literature review; counting neurons is easier).  
  - **What You Gain**:  
    - Consistency (whales/elephants could *rise*; anencephalic infants might drop).  
    - Ethical coherence (protection aligns with capacity for suffering/agency).  
    - Future-proofing (e.g., AI, alien life).  

  ---

  ### **Draft Recommendation for Octopus**
  > *"Based on demonstrated capacities for complex problem-solving, learning, and behavioral flexibility (analogous to Tier 2 species like corvids and parrots), the committee assigns Octopus vulgaris to Protection Tier 2. The aversive conditioning protocol is approved with heightened oversight for distress indicators (e.g., skin darkening, escape attempts). Terminal surgery requires anesthesia depth monitoring tailored to cephalopod physiology.  
  >   
  > *Note: This decision highlights inconsistencies in applying neuroanatomical thresholds (e.g., sperm whale). The committee will review criteria to prioritize cognitive capabilities over size or phylogeny in future tiers."*

  This forces the debate you need while aligning with the behavioral precedent your committee already accepts.
