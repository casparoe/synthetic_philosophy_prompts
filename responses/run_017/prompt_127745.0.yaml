prompt: |-
  I've been hanging around a tenants' union for a couple of years and I keep running into this line: "the base determines the superstructure." One guy in the group uses it constantly. The way he puts it: law, religion, morality, what people think is normal about gender, what counts as art — all of it is just a reflection of who owns the means of production, so until you change the ownership, the ideas won't budge.

  The other week a few of us were arguing about whether it's worth trying to change anyone's mind about anything. I was defending doing outreach on, I don't know, the idea that landlords are parasites, and he basically said it's a waste of breath. His version: the ideology follows the economics automatically, arguments don't do anything, go organize instead. I think that's too strong but I can't say exactly where it goes wrong, because when he says it I sort of believe him and five minutes later I dont.

  So: what are the actual precise claims hiding in that one sentence? I want them laid out as a menu from the boring to the wild, with a verdict on each — which ones nearly everyone would accept, which are real and arguable but not obvious, which are just false. And the part I actually care about: which of them would he need in order for "don't bother arguing, change the economy first" to follow? Because I suspect the reading that gets him his conclusion is a different reading from the one that sounds obviously true when he says it, and that the switch happens without anyone noticing.

  A few things I keep tripping over, if it helps you see what I'm asking:

  - Countries with basically the same economy have completely different moralities about stuff like welfare or guns. That feels like a counterexample, but he says those differences are themselves explained by history that was economic further back. That feels like it could explain anything, which makes me think it explains nothing. Is there a version of the claim you could actually be wrong about, and what would count as being wrong about it?
  - Loads of ideas hang around long after the economy that supposedly produced them is gone, and some ideas seem to show up first and change the economy afterward — that protestant work ethic thing everyone's heard of, or the way the "shareholder value" talk of the 80s seems to have rewritten how companies actually behave rather than the other way round. Do those kill the claim or just complicate it?
  - I read somewhere that Engels walked it back late in life in a letter, saying the economy is only the ultimately determining factor and that ideas react back on it and sometimes determine the shape things take. If that's right, is that hedge a real qualification or does it make the whole thing too soft to argue with?

  Here's my own attempt at a version I can actually believe, and I want to know whether it's just a weaker version of something that already exists or whether it's broken: the base doesn't decide which ideas exist, it decides what ideas cost. An idea that would get you fired or make you a pariah in your town doesn't spread no matter how good the arguements are, and an idea that costs nothing to repeat spreads or doesn't on the strength of its arguments alone. So economics sets the price list, not the beliefs. Does that still count as historical materialism, is it interesting enough to be worth holding, and what does it predict about the cases above that the plain version gets wrong?

  Lead with your bottom line in the first sentence — which reading of the slogan his argument actually needs, and whether that reading survives — then give me the menu and the reasoning after. No preamble, don't restate my question back at me, and please skip any "you should read X" stuff, I'm not near a library and it won't help me.
reasoning: |-
  Okay, the user is involved in a tenants' union and keeps hearing "the base determines the superstructure." They're frustrated because one member uses this to argue that changing minds through argument is pointless—only changing economic ownership matters. The user wants a clear breakdown of the claims within this slogan, from obvious to controversial, and to know which version is necessary for the "don't bother arguing" conclusion. They also question if the slogan can be falsified and mention counterexamples like different moralities in similar economies or ideas persisting beyond their economic base.

  First, I need to recall the Marxist base-superstructure model. The base is the economic structure (relations of production, ownership), and the superstructure includes legal, political, ideological systems. The debate is over the determinism level. The user's examples challenge strict determinism: same economies with different morals, ideas outlasting economies, or ideas preceding economic changes. These suggest the relationship isn't one-way.

  Engels' letter about the economy as the "ultimately determining factor" but allowing for superstructure's influence is key. That softens the hard determinism. The user's own idea—economics sets the "cost" of ideas rather than their content—is a nuanced take. It fits within historical materialism if we see the base shaping conditions for ideas to spread, not dictating them entirely.

  The core issue is which interpretation supports "don't bother arguing." Hard determinism does: if ideology purely reflects the base, changing minds without economic change is futile. But if the superstructure has relative autonomy or reciprocal influence, then outreach could matter. The user needs to know if hard determinism is defensible. Counterexamples weaken it, and even Engels retreated from it. The user's alternative model offers a viable middle ground, emphasizing material constraints on idea dissemination rather than content determination.

  The user's deeper need might be practical: how to justify their outreach efforts within the union. They want theoretical backing to counter the hardliner's dismissal. By showing that strict determinism is contested and offering a plausible alternative, they can argue that ideological work has value alongside economic organizing. Highlighting the falsifiability aspect addresses their concern that economic explanations can become unfalsifiable if they always invoke historical contexts. Their cost-based model provides testable predictions, making it a stronger framework for their activism.
answer: |-
  **Bottom line:** The version needed for "don't bother arguing" is **Strong Economic Determinism** – the claim that the economic base *directly and unilaterally* determines the specific content of the superstructure (ideas, laws, etc.) with near-total passivity and no significant feedback. This reading **does not survive** scrutiny against historical evidence and even key Marxist qualifications.

  **The Menu of Claims & Verdicts:**

  1.  **The Economy Significantly Influences Culture & Ideas (Weak Constraint):**
      *   **Claim:** Material conditions (how we produce goods, class structures, wealth distribution) create pressures, set boundaries, and shape the context within which ideas, laws, and norms develop. Ideas that fundamentally undermine the existing economic order face significant resistance.
      *   **Verdict:** **Widely accepted** (by historians, sociologists, many non-Marxists). Your "cost" analogy fits here. Verifiable: Societies reliant on slavery develop ideologies justifying it; industrialization shifts family structures.

  2.  **The Base is the Primary/Ultimate Shaping Force (Historical Materialism Core):**
      *   **Claim:** While not the *only* factor, the economic base is the *dominant* or *foundational* force in historical development and social change over the long term. Major shifts in the superstructure ultimately trace back to shifts in the base. Ideas don't float freely; their viability and dominance are materially conditioned. Engels' "ultimately determining" hedge belongs here.
      *   **Verdict:** **Arguable but plausible core thesis of historical materialism.** Supported by broad historical patterns (feudalism -> capitalism -> ideologies). Critiques: Can be hard to falsify definitively ("ultimately" is a long timeline), risks downplaying contingency/culture/ideas as *initiating* forces even if base constrains outcomes.

  3.  **The Superstructure Primarily Serves to Legitimize the Base (Functionalist View):**
      *   **Claim:** Laws, dominant ideologies, state functions, etc., develop primarily to stabilize, justify, and perpetuate the existing relations of production and ruling class interests.
      *   **Verdict:** **Arguable and often insightful, but incomplete.** True for many core institutions (property law under capitalism). However, it struggles with:
          *   **Counterexample 1 (Your Morality Point):** Similar economies (e.g., US vs. Western Europe) with different welfare/gun morals *despite* similar capitalist bases. Appeals to "further back" history stretch "determination" thin and risk unfalsifiability.
          *   **Counterexample 2 (Persistence):** Ideas outlasting their "base" (e.g., religious morals persisting in secular economies, aristocratic values in bourgeois societies). Shows superstructure isn't *just* a passive reflection.
          *   **Counterexample 3 (Precedence):** Ideas driving economic change *first* (e.g., Protestant ethic arguably *enabling* capitalist spirit; neoliberal "shareholder value" ideology actively *reshaping* corporate practice and law). Demonstrates ideas can be causal, not just reflective.

  4.  **Strong Economic Determinism (The "Don't Bother Arguing" Version):**
      *   **Claim:** The specific content of the superstructure (laws, morality, art, ideology) is *directly caused* by the economic base. Ideas are *merely* a passive "reflection" or automatic output. Changing the base automatically and inevitably changes the superstructure. Ideas have no significant independent force or ability to react back on the base. Argument is futile until the base changes.
      *   **Verdict:** **False and empirically unsustainable.** This is the version your union member needs for his conclusion. It fails because:
          *   It cannot adequately explain the counterexamples above (different morals in similar economies, persistence, precedence).
          *   It ignores the relative autonomy of the superstructure – ideas, laws, states have their own logics, histories, and internal developments, interacting *with* the base, not just being dictated *by* it.
          *   It contradicts Engels' explicit hedge and later Marxist developments (e.g., Gramsci on hegemony, Althusser on Ideological State Apparatuses) which emphasize struggle, ideology's active role, and reciprocal influence.
          *   It renders human agency, intellectual history, and political/ideological struggle meaningless, which is both descriptively wrong and politically paralyzing.

  **On Your Alternative ("The Base Sets the Cost"):**

  *   **Is it historical materialism?** Yes, broadly. It's a sophisticated **Weak Constraint/Relative Autonomy** view emphasizing the *material conditions of possibility* for ideas – channels, incentives, sanctions – rather than direct content determination. It's compatible with core historical materialism without falling into determinism.
  *   **Is it interesting/worth holding?** **Yes.** It's powerful and empirically grounded. It explains:
      *   Why genuinely radical critiques of property relations struggle under capitalism (high "cost").
      *   Why certain ideas gain traction only when material conditions shift (e.g., environmentalism needing industrial consequences to become widespread).
      *   Variation in similar economies (different histories/power structures create different "costs" for similar ideas).
      *   Persistence (old ideas can have low "cost" if not actively challenged by new material forces).
      *   Why argument *can* matter *within* constraints (low-cost ideas compete on perceived merit/coherence).
  *   **Predictions vs. Plain Version:** It predicts that:
      *   Identical economic bases *can* sustain different superstructures due to differing "cost" structures (power balances, institutional histories, cultural legacies).
      *   Ideas *can* precede and drive economic change if the "cost" is low enough and the idea mobilizes action (e.g., shareholder value ideology).
      *   Outreach/argument *isn't* futile where the "cost" isn't prohibitive, or where it helps shift the perception of "cost" (e.g., normalizing critique of landlords).

  **Conclusion:** The "don't bother arguing" stance relies on Strong Economic Determinism (#4), which is unsustainable. Your union member conflates the plausible core (#2) and functional insight (#3) with this extreme, false version. Your "cost" model is a valid and insightful refinement within historical materialism that better explains reality and justifies continued ideological struggle *alongside* economic organizing. The economy sets the stage and the stakes, but the play involves actors (including you) making arguments, building movements, and fighting over ideas within that constrained space.
