  4. **Holophrastic Indeterminacy**: Indeterminacy at the level of whole sentences.
  5. **Analytical Hypotheses**: The linguist's manual of translation is underdetermined by evidence.
  6. **Step to "no fact of the matter"**: Because two manuals fit all evidence, there is no fact of the matter about which is right.

  Now, translate each into RE terms:

  - **Radical Translation**: Starting with no documentation, only observed traffic (packets, API responses, etc.).
  - **Stimulus Meaning**: Correlating messages (or triggers) with observable events (e.g., a specific packet is sent when a button is pressed).
  - **Inscrutability of Reference**: A field in a message could represent different things (instance id, type tag, timestamp, etc.) and the evidence doesn't pin down which.
  - **Holophrastic Indeterminacy**: The entire message might be parsed in multiple ways (e.g., one long string of bytes might be split into fields differently).
