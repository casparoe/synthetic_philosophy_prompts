prompt: |-
  You are a veteran teacher of philosophy and social science to intelligent non-specialists — the kind of person who has spent years running university outreach seminars and who knows where lay audiences actually get stuck rather than where textbooks say they do. Please think this through carefully, and before committing to an arc, sketch two or three candidate orderings in your head and say briefly what made you discard the ones you did not use. I would much rather have a plan that has been reasoned outwards from the dependency structure than a tidy list of teaching tips.

  The situation: I run a monthly evening reading group of about fourteen people — mostly software engineers, a GP, a retired maths teacher — who know effective altruism mainly from podcasts and blog posts, and who have had no formal philosophy or economics. We have ninety minutes. Last month we attempted the earning-to-give debate and it went badly: the group spent almost the whole session arguing about whether high-earning donors are hypocrites, and they left with the impression that every critique of effective altruism is really a critique of motives. So this month I want to do the institutional critique properly, as a critique of a method rather than of anyone's character.

  My gloss on it, so that we are working with the same thing: effective altruism's standard method takes the menu of existing interventions as given, assesses each candidate use of a marginal pound by asking what would have happened otherwise — including whether the intervention has room for more funding — and ranks options by expected benefit per pound. The institutional critique, as I understand it, holds that this procedure is structurally blind to actions whose return comes from changing the menu itself: founding organisations, shifting professional or legal norms, building funding pipelines, seeding a research field. Those returns are threshold-shaped, path-dependent, and attributable to no single marginal pound, so a method built to compare marginal contributions to going concerns will systematically underrate them. That is roughly what I want the group to see, and I want them to see why it is a problem for a way of reasoning rather than a reason to feel sulky about donors.

  What I want from you is the plan, not the explanation itself, structured as follows.

  **Prerequisites, in order** (roughly 250 words): which ideas have to be in place before the critique is even intelligible, and what genuinely depends on what. My guess is that they need to feel the pull of marginal reasoning first — why one asks the counterfactual question at all, why room for more funding matters — and to have some grip on non-linear or threshold-shaped returns, but tell me if I have the dependency backwards, and tell me what I can safely compress into a single sentence because it is doing no work.

  **The carrying example** (roughly 200 words): the one case the session is built around, what properties it must have, and — just as important — what it must lack. I tried bednets versus lobbying for a tax and a friend objected that it drags in too much contested politics; I also tried an open-source analogy, funding individual bug fixes versus funding a maintainer or a foundation, which plays beautifully with engineers but may smuggle in the wrong assumptions about who benefits. Choose one, improve one, and defend the choice against the other.

  **Misconception map** (roughly 300 words, as a table): the misunderstandings the group will bring or form, the point in the sequence where each has to be headed off, and the specific move that heads it off rather than a note that it should be. My own predictions: that the critique is really longtermism wearing a coat; that it implies we should stop funding direct interventions; that if something cannot be measured its expected value is zero, which is where the measurability-bias worry sneaks back in and which I want kept separate from the institutional point; that the critic must think the current top interventions are worthless; that the whole thing is a licence to do whatever is prestigious or fun; and, as residue from last month, that this is about motives rather than outcomes.

  **The two distinctions I want left on the board** (roughly 150 words): the difference between the best thing to fund and the best thing to make fundable, and the thought that some actions are worth taking largely for the options they create even when no expected value can be computed for them. Tell me where each sits in the arc — whether they are the payload or merely scaffolding — and push back if you think either is the wrong thing to send people home with.

  **What to leave out** (roughly 100 words): what I should openly decline to settle in ninety minutes, and how I should say so without making the session feel evasive. Please do not give me a reading list or any organisational history; the group has its own material and I want the architecture of the explanation.

  **The check** (roughly 120 words): one question to end on that would show they have taken the critique as a claim about a method, rather than about motives or about the far future, and that would separate genuine uptake from polite agreement — plus what an answer that merely looks right would sound like.

  Please write in British English throughout, and give me your reasons for the ordering, so that I can re-plan on the fly if the discussion runs long.
reasoning: |-
  Hmm, this is a sophisticated teaching challenge. The user runs a reading group for intelligent non-specialists (mostly STEM professionals) who stumbled last month by getting stuck on motive-critiques of effective altruism. Now they want to teach the institutional critique properly - as a structural limitation of EA's method, not an attack on donors.

  Key requirements stand out: The plan must show dependency reasoning (why sequence matters), include a concrete case study that avoids political landmines, anticipate specific misconceptions with tactical interventions, and leave two clear distinctions on the board. Most crucially, every element must reinforce that this is about methodological blindness, not ethics or longtermism.

  For prerequisites, the group must first grasp why EA asks "what would happen otherwise?" and why nonlinear returns break marginal analysis. Without these, the critique won't land. I'm considering three sequencing approaches: 

  Option A would start with nonlinear returns then show how marginal reasoning fails. But this risks feeling abstract. Option B would begin with a concrete case study upfront. However, without the foundational concepts, they might dismiss it as niche. Option C (the chosen path) builds from marginal reasoning basics to nonlinear cases to institutional critique - creating cognitive friction when the method fails. This has the strongest dependency chain.

  The carrying case study is critical. Bednets vs lobbying was rejected for being politically charged; open-source analogies might imply wrong beneficiaries. The "funding a ferry" case solves this: It's politically neutral, shows clear threshold effects, and the "making paths" vs "walking paths" metaphor separates capacity-building from direct action perfectly.

  The misconception map needs surgical precision. For example, when introducing nonlinear returns, someone will inevitably say "but if we can't measure it, EV=0" - that's when to emphasize "we're not discussing measurability yet, just structural shape." And the moment "longtermism" comes up, I'll redirect to "this critique applies even to near-term institution-building."

  The payload distinctions must be: 1) Fundable-vs-worth-funding (methodological) and 2) Option-value actions (conceptual). These crystallize the critique without veering into motive or longtermism.

  Crucially, I'll explicitly bracket measurability debates and motive questions - "today's lens is purely structural" - to prevent derailment. The closing question ("Why might EA underfund ferry-building even if everyone's sincere?") tests methodological understanding: A surface answer would mention greed or politics; the right answer notes the counterfactual calculation blindness.

  This architecture should withstand live discussion because each step logically forces the next - if they grasp marginal reasoning but not thresholds, we slow down there; if they conflate with longtermism, we re-anchor to ferry timetables. The case study is the keystone: relatable enough to reveal the fracture point in EA's method.
answer: |-
  Here’s a battle-tested plan prioritising dependency structure, with reasoning for sequencing and tactical choices. British English throughout.

  **Prerequisites (Order Matters)**  
  1. **Marginal reasoning & counterfactuals**: *Start here*. Use a simple example: "If you donate £1k to buy bednets, what *wouldn’t* happen otherwise? If the charity already had funds, your £1k might displace another donor’s £1k – so impact isn’t ‘nets bought’ but ‘*additional* nets bought’." (Crucial: they must feel why EA asks "what changes *because* of this pound?").  
  2. **Room for more funding (RFMF)**: Extend the bednet example: "If the charity is *saturated* (can’t use extra cash effectively), your £1k has near-zero impact. RFMF tests whether your pound adds something new." (Compressible once marginal logic clicks).  
  3. **Non-linearity (threshold effects)**: Introduce *after* steps 1-2. "Some efforts only work past a critical mass. Imagine a village needs £50k for a well. £49k achieves nothing; £50k saves lives. Returns aren’t incremental." (Essential for contrast; show graphs if helpful).  

  *Why this order?* Reverse engineering (starting with thresholds) confuses learners – they’ll think thresholds *are* the critique. RFMF depends on grasping counterfactuals. **Discarded option**: Starting with "EA’s method". Without prerequisites, it’s abstract. **Also discarded**: Defining "institutions" upfront – too vague; show via example.

  ---

  **The Carrying Example: Building a Ferry**  
  *Scenario*: A flood-prone village needs supplies. You can either:  
  (A) Pay porters £10/trip to carry goods now (linear, measurable impact per £).  
  (B) Fund a ferry-building project (£100k total, useless until complete; then supplies flow cheaply forever).  

  *Why this works*:  
  - **Avoids politics**: Unlike lobbying/taxes, it’s neutral.  
  - **Thresholds clear**: Ferry has zero impact until £100k; then transformative.  
  - **Marginal blindness**: EA’s method (steps 1-2) ranks (A) highly – each £10 *clearly* adds a trip. For (B), no *single* £10 shows counterfactual impact until the threshold is crossed.  
  - **No beneficiary bias**: Unlike open-source (which implies "users"), ferry benefits all villagers equally.  

  *Defence vs. alternatives*: Bednets/lobbying invites partisan tangents. Open-source smuggles in "digital public goods" assumptions, confusing the core point. Ferry is universal, apolitical, and visceral.

  ---

  **Misconception Map**  

  | **Misconception**                          | **When it arises**             | **Preemptive move**                                                                 |
  |--------------------------------------------|--------------------------------|-------------------------------------------------------------------------------------|
  | "This is just longtermism"                 | Introducing thresholds         | **Anchor in immediacy**: "The ferry saves lives *next year* – it’s near-term institutional infrastructure." |
  | "EA should stop funding direct work"       | Contrasting ferry vs. porters  | **"Both-and" framing**: "Porters help now; the ferry helps forever. The critique is that EA’s *method* can’t *see* the ferry." |
  | "If it’s not measurable, EA thinks EV=0" | Discussing ferry uncertainty   | **Decouple sharply**: "This isn’t about measurement! Even if ferry costs/benefits are *known*, the *threshold* breaks the marginal calculation." |
  | "So current top charities are worthless?" | After critique is stated       | **Leverage RFMF**: "No – bednets are great *if* they have room for funding. The ferry is a *different category* of action." |
  | "This justifies selfish/prestige projects" | Discussing "option value"      | **Constraint with evidence**: "Ferry-building isn’t glamorous! The test is: does it *plausibly create new options*?" |
  | "It’s really about motives" (residue)     | Any debate                     | **Reframe instantly**: "Suppose both porter-payers and ferry-builders care equally. The *method* still overlooks the ferry." |

  ---

  **Two Payload Distinctions**  
  1. **"Fundable vs. worth making fundable"**:  
     - *When*: After ferry example.  
     - *Payload*: Core insight. EA’s method excels at ranking *fundable* interventions (porters). It cannot evaluate actions that *create* fundable options (ferry project).  

  2. **"Option value"**:  
     - *When*: During ferry debrief.  
     - *Scaffolding → Payload*: First, use as explanation ("ferry creates option for cheap transport"). Later, generalise: "Some actions are valuable *because* they create new opportunities, even if we can’t compute their EV yet." (Leaves them with a positive heuristic).  

  *Why these?* They crystallise the critique (1) and offer a way forward (2) without drifting to motives or utopianism.

  ---

  **What to Leave Out**  
  Openly state: *"We won’t resolve how to identify ‘ferries’ in the real world, or how to balance them against ‘porters’. That’s the frontier – today’s goal is seeing why our tools might miss entire categories of high-impact work."*  
  **Exclude**: Quantification debates, historical EA infighting, speculative longtermism. This keeps focus on *structural blindness*.

  ---

  **The Check**  
  **Question**: *"Why might EA’s standard method – even with perfect data and good faith – underfund projects like the ferry?"*  
  - **Genuine uptake**: Answers citing **thresholds disrupting counterfactual analysis** or **inability to attribute marginal impact**.  
  - **Polite agreement**: Vague nods to "complexity" or "uncertainty", or reverting to "motives" or "long-term effects".  

  **Why it works**: Forces application of prerequisites (marginal reasoning vs. thresholds). If they get this, they’ve separated method from motives/measurement.

  ---

  **Re-planning Notes**  
  - **If time crunches**: Compress RFMF to one sentence once marginal reasoning clicks; skip formal "option value" but keep the ferry example.  
  - **If hung up on motives**: Return to ferry: *"Imagine two identical villages – one gets porter-funding, one gets ferry-funding. Same sincerity. Why does EA’s method favour porters?"*  
  - **Engineers analogy**: If open-source arises, **redirect**: "Yes, like funding a foundation versus individual bugs – but remember, the ferry *isn’t* just for ‘users’ but collective survival."  

  This arc mirrors how students actually stumble: first trusting marginal reasoning, then hitting its limits via thresholds, then seeing *why* institutions evade the framework. The ferry makes it visceral.
