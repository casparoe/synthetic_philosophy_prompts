  They give examples: a cup-sorting machine that could be recognizing cups, or cups-in-a-specific-building, or shadows. All fit the training data but fail in new scenarios. Similarly, a child learning "red" might overgeneralize to orange initially but corrects it. The user wants to know if this specific problem—selecting the grain of similarity—has a name.

  First, I need to recall related concepts. The symbol grounding problem is well-known (Harnad, 1990). But the next step? Terms like the problem of invariance, underdetermination of reference, or perceptual categorization come to mind. 

  The invariance problem seems close—how systems identify stable categories despite sensory variations. But is that the exact fit? The user emphasizes the selection of relevant sameness criteria from infinite possibilities. That sounds like underdetermination too, where data alone can't pin down one correct category. 

  The user already ruled out several confusions: not skepticism about the external world, not symbol-symbol issues, not infinite resemblances generally, but the concrete need for a mechanism to pick the right grain in finite contexts. They mentioned universals—maybe this is nominalism vs realism in a computational setting. 

  Looking at their examples: the cup machine's ambiguity between cup-ness vs context-specific features, and the child's color word learning. Both show that raw data doesn't dictate the category boundaries; something else does. 

  Existing terms: "Invariance problem" in perception/cognition refers to this, but might be too narrow. "Underdetermination of reference" from philosophy captures the ambiguity but isn't sensor-specific. "Perceptual categorization" is broad. 

  The best fit is probably the **invariance problem** or **categorization granularity problem**. But to be precise, I should synthesize: **the problem of referential granularity**. Define it as the challenge of determining the level of abstraction or the respect of sameness when grounding symbols to sensory data. 

  Boundary cases: 
  1. A vision system trained on dogs. Is it recognizing "dogs," "four-legged animals," or "things in grassy backyards"? All fit training data. 
  2. Voice assistant triggered by "Alexa." Does it respond to any similar-sounding word? The system must decide phonetic boundaries. 
  3. Medical AI diagnosing tumors from scans. Is a small shadow a tumor variant or noise? The grain affects diagnosis. 

  The user might also need reassurance that this is distinct but related to symbol grounding. They want clarity for academic work, so precise definitions and boundaries are crucial. Their deeper need is likely conceptual tools to frame their research or arguments. 

  I should also note that while literature exists (Quine's indeterminacy, Goodman's grue), the sensorimotor angle adds a layer. The term should reflect the mechanistic, real-time aspect. 

  Final name: **referential granularity problem**. It captures the core issue—selecting the "grain size" for reference when grounding symbols.
answer: |-
  Based on your description, the difficulty you're articulating—**selecting the specific grain or respect of similarity at which sensory grounding occurs, given that sensorimotor data underdetermines infinite possible groupings**—is most precisely captured by the established concept of the **Problem of Invariance** (or **Invariance Problem**), particularly in cognitive science and machine learning. However, it intersects with several other ideas, requiring careful distinction. Below is a sharp definition, its relationship to adjacent concepts, boundary cases, and why "invariance" is the core label.

  ---

  ### **Core Definition: The Invariance Problem**
  **The challenge of determining *which variations* in sensory input should be ignored (treated as irrelevant noise) and which should be preserved (treated as signal) to stabilize a meaningful category or symbol-world mapping, despite the continuous, high-dimensional flux of sensorimotor data.**  

  - **Key elements**:  
    1. **Sensorimotor flux**: Sensors deliver a continuous, context-dependent stream (e.g., light wavelengths varying with illumination, object angles).  
    2. **Underdetermined groupings**: Any finite history of sensor data is compatible with infinitely many equivalence classes (e.g., "red," "red-or-orange-in-dim-light," "cup," "cup-in-this-lighting").  
    3. **Causal opacity**: The system’s internal state doesn’t reveal *which* grouping it has latched onto; divergence only appears on novel inputs.  
    4. **Pragmatic selection**: Invariance isn’t "discovered" in the data but *enforced* by the system’s architecture, learning biases, or environmental pressures.  

  This is distinct from the symbol grounding problem:  
  - **Symbol grounding** asks how symbols *escape* a self-referential web to connect to the world.  
  - **Invariance** asks how symbols connect to *stable, generalizable categories* despite sensory chaos.  

  ---

  ### **Adjacent Concepts & Distinctions**
  1. **Underdetermination of Reference (Quinean Indeterminacy)**:  
     - **Overlap**: Both note that data underdetermines meaning (e.g., "gavagai" could mean rabbit, rabbit-part, or rabbit-event).  
     - **Distinction**: Quine’s indeterminacy is linguistic and holistic (meaning depends on entire theories). Your problem is *perceptual* and *pre-linguistic*: it arises at the sensorimotor interface, *before* full symbol systems form. Your cup-sorter’s ambiguity stems from raw pixels, not translation manuals.  

  2. **Problem of Universals**:  
     - **Overlap**: Both ask how particulars (e.g., red tomatoes) map to universals ("redness").  
     - **Distinction**: Universals debate metaphysical *status* (do categories exist mind-independently?). Your problem is *procedural*: how a physical system *computationally isolates* a useful invariant from noise. The "lab coat" matters: sensors add causal constraints universals lack (e.g., lighting affects photoreceptors predictably).  

  3. **Goodman’s "Grue" Paradox**:  
     - **Overlap**: Both show that past data fits multiple future-projecting categories (e.g., "grue" = green before 2050, blue after).  
     - **Distinction**: "Grue" is about *logical* induction. Your problem is about *causal-perceptual* anchoring: sensors don’t deliver "green" but a vector of intensities, and the system must weight dimensions (hue vs. brightness) to group inputs.  

  4. **Frame Problem (in AI)**:  
     - **Overlap**: Both involve relevance (which features matter?).  
     - **Distinction**: The frame problem concerns *reasoning* (which facts persist when actions occur?). Your problem concerns *perception* (which sensory variations define an object?).  

  ---

  ### **Why "Invariance Problem" Fits Best**
  - **Literature anchor**: The term originates in perception (e.g., Helmholtz’s unconscious inference, Gibson’s affordances) and is central to modern AI/robotics. It explicitly addresses how systems extract stable features (e.g., shape, color) from variable signals.  
    - *Example*: A vision system must treat a cup as identical under rotation, lighting changes, or occlusion—ignoring these as noise while preserving "cupness."  
  - **Mechanism-focused**: It highlights the need for *biases* (neural, algorithmic, or evolutionary) to resolve ambiguity (e.g., convolutional neural nets impose translational invariance).  
  - **Settles edge cases**: It forces clarity on what counts as "the same" (e.g., is a chipped cup still a cup? Depends on the *purpose* of the category).  

  ---

  ### **Boundary Cases**  
  To test the definition:  
  1. **Edge Case: The "Red" Detector in Dynamic Lighting**  
     - A system fires for ripe tomatoes in sunlight. Does it detect "red" (wavelength ~650nm), "surface reflectance property X," or "objects that trigger firing under current illumination"?  
     - **Resolution**: It solves invariance if it generalizes to tomatoes in shade *and* fire engines, *but not* to oranges. Failure occurs if it labels dim tomatoes "not red" or overgeneralizes to oranges.  

  2. **Edge Case: Voice Assistant Wake-Word**  
     - A system activates on "Alexa." Does it respond to phonetic structure (invariant across speakers), or speaker-specific timbre, or background noise patterns?  
     - **Resolution**: Invariance requires ignoring pitch/volume shifts (noise) while preserving phonemes (signal). If it fails on children’s voices, invariance is too narrow.  

  3. **Edge Case: Medical AI Diagnosing Tumors**  
     - Trained on scans, it labels malignant tumors. Does it key on texture, shape, or contextual artifacts (e.g., machine calibration)?  
     - **Resolution**: If it flags benign cysts sharing texture (overgeneralization) or misses tumors in new imaging tech (undergeneralization), invariance is miscalibrated.  

  ---

  ### **Synthesis**  
  Your "second difficulty" is the **Invariance Problem**: the selection of *relevant* sameness amid sensory noise to achieve *robust* grounding. It is surmountable (as in the child’s learning) through:  
  - **Biases**: Innate (e.g., human color perception), learned (statistical regularities), or designed (AI architectures).  
  - **Feedback**: Error correction (e.g., "not red" for orange) refines the invariant.  
  - **Purpose**: Categories are defined by functional roles (e.g., "cup" for drinking), not purely by data.  

  This is not merely "universals in a lab coat"—it is a computational puzzle unique to systems interfacing with chaotic physical signals. For literature, classical sources include J.J. Gibson (*The Ecological Approach to Visual Perception*) for perceptual invariance, and modern treatments in embodied AI (e.g., Pfeifer & Bongard, *How the Body Shapes the Way We Think*).
