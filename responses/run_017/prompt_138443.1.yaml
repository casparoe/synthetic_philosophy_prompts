prompt: |-
  hey! so me and my friend jordan have been arguing about this for like two months in the philosophy club discord, and our faculty advisor said that instead of another debate we should do an "adversarial collaboration" — one document that we both put our names on. can you draft it for us? we'll fight over the wording, but we need something to fight over.

  here's the first case. there's a really good predictor (people online call it Omega) that flips a fair coin. if it comes up heads, it hands you $10,000, but only if it predicted you'd hand over $100 in the other branch. if it comes up tails, it shows up, tells you the coin came up tails, and asks for the $100. you know all of this in advance. jordan's camp says: obviously don't pay, the coin's already tails, the ten thousand is never happening, you're just down a hundred bucks, paying can't reach backwards in time. my camp says: if you're the kind of person who pays, you'd have gotten the ten grand, so pay. i think the fancy names for these are something like causal decision theory and functional decision theory, but just call us the don't-pay camp and the pay camp in the document.

  second case, the XOR one. some other predictor sends you a note saying it sent the note if and only if exactly one of these two things is true: your house has termites (which would cost you about a million dollars to deal with), or you're going to pay them $1,000 after reading the note. you got the note. we both say don't pay, but i think for totally different reasons, and we genuinely can't tell if that's real agreement or just both of us landing on "no" by different routes.

  two more background things we noticed: before the coin gets flipped, you can pay $1 for a gadget that will force you to hand over the $100 later, and i think both of us would buy it, which is weird given we disagree about whether to actually pay. and in Newcomb's problem i think i one-box and jordan two-boxes. is our counterfactual mugging fight just the Newcomb fight with the evidence taken away, or is it a separate fight?

  please write it as:

  (1) a numbered list of claims we can both sign. include a clean statement of each case in wording both of us would accept, since i'm not a hundred percent sure i described the second one right, plus whatever we can agree on about what a decision theory is even supposed to be doing and what counts as a good answer here.

  (2) a table of the disagreements: one row each, with the point in jordan's wording, the same point in my wording, whether you think it's a real disagreement or just a fight about words, what the crux underneath it actually is, and for that crux a case or line of argument both of us would accept as relevant, with what each camp predicts it will show.

  (3) then run three cases we made up, so nobody can just recall the answer:

  - Omega's prediction is only right 60% of the time and it tells you so, and the coin is weighted 90% heads instead of fair. does either camp's answer move? is there an accuracy or a coin weight at which each camp would flip, and is it the same one?
  - same as the first case, except Omega runs it with you 100 times, re-flipping the coin each round, and it made its prediction once at the start by simulating your whole strategy for all 100 rounds. you remember every round. what does each camp say about round 1, and about round 100?
  - Omega says it couldn't simulate you, so it simulated your best friend sam, becuase sam decides the same way you do, and used that as its prediction. sam is standing right there and can hear all of this. pay or not? and would my camp now want to slip sam ten bucks to say yes?

  for each of those: each camp's verdict, each camp's reason, and what result would actually surprise each camp. and at the end, say which parts of our argument you think are purely verbal, and where the disagreement would still be sitting if we kept going for another year. don't tell us who's right though — my advisor was clear that the document is the point, not a verdict.
reasoning: |-
  Okay, the user and their friend Jordan have been debating these decision theory problems for months. They need help drafting an adversarial collaboration document for their philosophy club. The main cases are the Counterfactual Mugging and the XOR Blackmail, plus some variants they've created. 

  First, I need to understand the core disagreement. In Counterfactual Mugging, Jordan's "don't-pay" camp focuses on the current causal reality - the coin is already tails, so paying can't retroactively create the $10k. The user's "pay" camp argues that being the type of person who pays would have made Omega send the money in the heads scenario. This mirrors the CDT vs FDT debate in Newcomb-like problems.

  The XOR Blackmail case is interesting because both agree not to pay, but for different reasons. Jordan likely sees it as obvious extortion with no benefit, while the user probably views it as failing the predictor's XOR condition regardless of payment. Their agreement might be superficial - a rare convergence of different reasoning paths.

  The background details reveal deeper nuances: both would pay $1 pre-commit to pay later, which is paradoxical given their disagreement about actual payment. And they split on Newcomb's problem too. This suggests their root disagreement is about whether decisions should optimize over actual world-states (CDT) or over logical dependencies (FDT).

  For the document structure:
  1) The common claims need rock-solid case descriptions first. I'll phrase the Counterfactual Mugging with precise timing - prediction before coin flip, interaction after. The XOR case requires careful wording of the biconditional. Then list points both can accept, like decision theories being about action selection under uncertainty.

  2) The disagreement table should highlight three key divides: 
  - Definition of rationality (causal consequences vs identity as decision-maker)
  - Ontological status of predictors (infallible vs fallible)
  - What constitutes "evidence" (world-state vs decision algorithm)

  3) For their custom cases:
  - The 60% accuracy/90% heads variant tests how robustness affects each camp. Pay camp might still pay at 51% accuracy while don't-pay never budges.
  - The 100-rounds case exposes time inconsistency - pay camp must commit to strategy upfront but might defect later.
  - The Sam proxy case introduces second-order effects - pay camp might bribe Sam to maintain cooperative identity.

  Throughout, I'll maintain strict neutrality while making the disagreements crystal clear. The goal isn't resolution but mapping the conceptual battlefield. Any verdict would violate the adversarial collaboration spirit. Instead, I'll identify which parts are terminological (e.g., "rational" meaning) vs substantive (how to handle logical counterfactuals).
answer: |-
  Here's the adversarial collaboration draft per your specifications. We've structured it neutrally, using "Pay Camp" and "Don't-Pay Camp" labels. Wording aims for mutual acceptance while preserving core disagreements.

  ---

  ### **Adversarial Collaboration: Counterfactual Dependence & Decision Theory**  
  **By [Your Name] & Jordan**

  #### (1) Shared Foundation: Definitions & Agreed Claims  
  1.  **Decision Theory Goal**: A decision theory prescribes actions that maximize expected utility *according to its chosen method of evaluating consequences*. What constitutes "consequences" is contested.  
  2.  **Case 1: Counterfactual Mugging (Precise Wording)**:  
      > *Omega, a perfect predictor, flips a fair coin before your interaction. If Heads, Omega gives you $10,000 iff it predicted you would pay $100 if Tails. If Tails, Omega appears, announces Tails, and requests $100. You know Omega’s setup perfectly before the coin flip.*  
  3.  **Case 2: XOR Blackmail (Precise Wording)**:  
      > *A perfect predictor sends you a note iff exactly one of these is true: (A) Your house has termites (costing $1M to fix), or (B) You will pay the predictor $1,000 after reading the note. You receive the note. You know the predictor’s setup perfectly.*  
  4.  **Agreement on Pre-Commitment**: Both camps would pay $1 *before the coin flip* for a gadget forcing payment if Tails.  
  5.  **Agreement on XOR Blackmail**: Both camps prescribe *not paying* $1,000 in Case 2.  
  6.  **Newcomb’s Problem Relationship**: We agree this dispute is *structurally similar* to Newcomb’s (Pay Camp ≈ one-boxing, Don't-Pay Camp ≈ two-boxing), but with the *predictive evidence removed* (you observe Tails/Heads outcome directly).  

  #### (2) Disagreement Table  
  | Jordan’s Camp (Don't-Pay) Wording                     | Your Camp (Pay) Wording                                | Verbal Dispute? | Underlying Crux                                                                 | Test Case / Crux Probe                                                                                                |  
  |-------------------------------------------------------|--------------------------------------------------------|-----------------|---------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|  
  | "Paying $100 when Tails is irrational; it cannot cause the $10k to exist." | "Paying $100 when Tails is rational; it confirms you were the type who *would* get $10k on Heads." | No              | **What does rationality condition on?** *Actual causal history* vs. *your identity as a decision-maker*. | Case 1 itself: Don't-Pay expects paying to *always* lose $100 with no offsetting gain. Pay expects paying to be *evidence* of a decision-type that nets +$9,900 on average. |  
  | "The coin outcome (Tails) is known; the $10k branch is irrelevant." | "The coin outcome is *evidence about your type*; paying updates that evidence." | No              | **Status of counterfactual worlds**: Are they *irrelevant* (causally disconnected) or *diagnostic* (revealing decision properties)? | *Pre-commitment gadget*: Both pay $1 to force payment later. Don't-Pay must explain why forcing payment *before* knowing Tails is rational, but *doing it* after is not. |  
  | "XOR Blackmail agreement is real; paying *creates* the condition for termites." | "XOR agreement is superficial; paying *fails* to satisfy the XOR condition regardless." | Yes & No        | **Interpretation of agreement**: Is it *coincidental* (same output, different reasoning) or *shared* (similar underlying principles)? | *Modified XOR*: If note arrives ONLY if (Termites XOR Pay) is false (i.e., both true or both false). Pay Camp *might* pay to make both true. Don't-Pay *never* pays. |  

  #### (3) Novel Case Analyses  
  **Case A: Imperfect Predictor (60% Accuracy, 90% Heads Bias)**  
  - **Don't-Pay Camp**:  
    - **Verdict**: Don’t pay.  
    - **Reason**: Coin is still Tails (known fact). Omega’s prediction might be wrong, but paying cannot retroactively create $10k. Accuracy/heads-bias irrelevant to current state.  
    - **Surprise**: If paying *increased* future payouts (e.g., in repeated games) – current state should dominate.  
  - **Pay Camp**:  
    - **Verdict**: Pay.  
    - **Reason**: Being the "paying type" still correlates with higher EV. 60% accuracy >50%, and 90% Heads weight amplifies the value of being "chosen" on Heads.  
    - **Surprise**: If paying at 51% accuracy/51% Heads *lowered* overall EV – correlation should hold weakly.  
  - **Flip Threshold**: Don't-Pay *never* flips (current state dominates). Pay flips if accuracy <50% or Heads-bias is negligible (correlation too weak).  

  **Case B: 100 Rounds (Single Prediction at Start)**  
  - **Don't-Pay Camp**:  
    - **Round 1/100 Verdict**: Don’t pay *any* round.  
    - **Reason**: Each round’s coin is known post-flip. Past/future rounds don’t causally affect current payout. Prediction was fixed; your actions now can’t alter it.  
    - **Surprise**: If defecting in round 1 *increased* payout in round 2 – no causal link should exist.  
  - **Pay Camp**:  
    - **Round 1 Verdict**: Pay.  
    - **Round 100 Verdict**: Pay *iff* you paid in all prior rounds. Defect otherwise.  
    - **Reason**: Commitment to "always pay" maximizes predicted $10k grants. But if you defected earlier, Omega’s prediction (for future rounds) assumed defection – paying now won’t help.  
    - **Surprise**: If paying in round 100 *after prior defection* sometimes granted $10k – prediction should be "locked in".  

  **Case C: Sam as Proxy**  
  - **Don't-Pay Camp**:  
    - **Verdict**: Don’t pay. Sam’s presence irrelevant; coin is Tails.  
    - **Bribe Sam?**: No. Paying Sam $10 is strictly dominated (lose $10 + $100 if paid).  
    - **Surprise**: If paying Sam *caused* Omega to grant $10k – no causal pathway.  
  - **Pay Camp**:  
    - **Verdict**: Pay.  
    - **Reason**: Omega used Sam’s *actual* decision as proxy. You and Sam are identical decision-makers; paying confirms the type that gets $10k on Heads.  
    - **Bribe Sam?**: Yes, pre-emptively offer Sam $10 to commit to paying. Ensures Sam (your proxy) is "paying type," securing $10k on Heads.  
    - **Surprise**: If Sam accepts the bribe but Omega *still* predicts defection – proxies should be reliable.  

  ---

  ### **Conclusion: Nature of Disagreement**  
  - **Purely Verbal Elements**:  
    - "Rationality" as *causal optimality* (Don't-Pay) vs. *logical optimality* (Pay).  
    - "Evidence" in XOR Blackmail – both agree not to pay, but differ on whether termites exist.  
  - **Persistent Substantive Disagreements**:  
    1.  **Metaphysical Commitment**: Does rationality require optimizing *actual* causal chains (Don't-Pay), or also *logical dependencies* between your algorithm and outcomes (Pay)?  
    2.  **Agency & Identity**: Are you obligated to "live up to" the properties that *would have* benefited a counterfactual version of yourself?  
    3.  **Time Inconsistency**: Why is *pre*-commitment rational to both, but *executing* it rational only to Pay Camp?  
  - **If Debating 1 Year Later**: Dispute would center on whether decision theory should incorporate **logical counterfactuals** (e.g., "What if I *were* the type who pays?") as real objects of optimization. The $1 gadget case remains the key stress test.  

  ---  
  This document reflects our shared understanding of the disputes and provides a framework for continued collaboration. We agree to its structure and neutral framing while retaining our distinct positions.
