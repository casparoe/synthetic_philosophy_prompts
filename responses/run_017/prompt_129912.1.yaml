prompt: |-
  You are a political philosopher who has spent years on real grant panels and knows how these things actually go wrong -- please think carefully, and do some brainstorming on the failure modes of each metric before you start writing; I would rather have a slow careful answer than a fast tidy one.

  I am on a volunteer committee for our city that hands out about $400k a year to local programs for disabled and long-term-unemployed residents. We meet twice a month, ninety minutes, maybe six proposals a session, no staff, no statistician, no ability to commission our own evaluation, and every yes has to come with a one-page justification the city council can read without wincing. We keep having the same argument: someone says a program makes people happier, someone says it gives them more real options, someone says what matters is the money in their pocket, and we have no way of telling whether we are even disagreeing about facts or about what we are trying to equalize.

  I need a decision procedure we can actually run in about forty minutes per proposal, by people who have never taken a philosophy class. I know the slogan-level version of the welfare / resources / capabilities debate from the usual blog reading, so please do not just explain the three views -- I need them turned into ordered questions, with what counts as a good enough answer to each, where the procedure just stops and says no, and above all where it hands the question back to us because it is a values call that no amount of procedure settles. It has to say what to do when the number we want does not exist, which is most of the time, and it should be honest about which steps are judgement calls wearing a lab coat.

  Then run it on three real ones. (1) A ten-week confidence-and-goals course for long-term unemployed twentysomethings: a small local evaluation found a big jump in self-reported wellbeing right after, most of it gone at six months, and no detectable change in employment, earnings or skills. Cheap per head. Half the committee thinks it changes what people want rather than what they can do; the other half thinks that is the point. (2) A home-and-transport modifications budget -- ramps, vehicle adaptions, subsidised rides. Same cash to everyone, but a ramp does wildly different things depending on the building, and applicants hate the means-test interview enough that some drop out. (3) Weekly music sessions for adults with profound intellectual disabilities: very high cost per head, no measurable change in anything anyone can name as a functioning, staff and some families say participants are plainly happier during and after, and the same money would buy mobility equipment for roughly forty other people.

  Two more constraints, sorry: we are not allowed to ask applicants about diagnoses or home life beyond what they volunteer, and about a fifth of the pot is donor-restricted to programs that can show improved wellbeing on a survey the donor supplies and administers.

  Be straight with me about which of these the procedure kills that we will not want to kill. And end by telling me plainly what this procedure cannot do -- especially whether it can ever tell us that we picked the wrong currency in the first place.
reasoning: |-
  Okay, let's start by really understanding the user's problem. They're on a volunteer committee distributing $400k annually to programs for disabled and long-term-unemployed residents. The main issue is recurring debates among members about different metrics—happiness, real options, money—without a clear way to resolve whether disagreements are about facts or values. They need a practical, time-bound decision procedure that non-experts can use, which also handles cases where data is missing or inconclusive.

  First, I need to unpack the key challenges. The committee meets twice a month for 90 minutes, reviewing about six proposals per session. No staff, no statistician, no ability to commission evaluations. Each approval requires a one-page justification for the city council. The constraints include no probing into applicants' diagnoses or home lives, and 20% of funds restricted to wellbeing improvements via a specific donor survey.

  The user mentioned three example proposals: a confidence course for unemployed youth, home/transport modifications, and music sessions for adults with disabilities. Each presents different evaluation challenges—temporary wellbeing boosts vs. lasting impacts, variable utility of resources, high cost with subjective happiness gains versus tangible equipment for many.

  The core problem is creating a decision tree that incorporates welfare (happiness/wellbeing), resources (money/goods), and capabilities (real opportunities) without getting bogged down in philosophical debates. The procedure must flag when a decision is a values call, stop proposals that don't meet basic thresholds, and be executable in ~40 minutes per proposal by laypeople.

  I recall that in grant panels, common failure modes include:
  - **Vanity metrics**: Programs reporting easily measurable but irrelevant outcomes (e.g., "number of workshops held" instead of actual impact).
  - **Equity illusions**: Assuming equal resource distribution equals equal outcomes, ignoring varying needs (e.g., giving everyone ramps when some need more expensive modifications).
  - **Temporal myopia**: Overvaluing short-term gains (e.g., post-workshop happiness spikes) while missing long-term futility.
  - **Cost blindness**: Not contextualizing benefits against costs, especially with high-cost/low-reach programs.
  - **Survey gaming**: Donor-mandated wellbeing surveys creating perverse incentives (e.g., programs optimizing for survey scores rather than real impact).

  The procedure needs to force explicit tradeoff discussions. For example:
  1. **First, screen for harm or deception**—reject if active harm or fraudulent claims.
  2. **Check if it meets a donor restriction**—if wellbeing-focused and uses the donor's survey, it might get funded from the restricted pot even if other metrics are weak.
  3. **Assess what's actually being measured**—distinguish between welfare (wellbeing surveys), resources (cash/equipment), capabilities (skills/access). If a proposal claims a capability but measures only resources (e.g., "gave out ramps" without tracking usage), that's a red flag.
  4. **Timeframe honesty**—demand data covering at least 3 months post-intervention. Temporary spikes without lasting change (like the confidence course) should be labeled as such.
  5. **Context variability check**—for resource-based proposals (like ramps), require evidence that the resource overcomes a common barrier. If utility varies wildly (e.g., ramps useless for staircase-only buildings), reject unless paired with individual assessments.
  6. **Cost-per-impact transparency**—calculate cost per unit of claimed outcome. If unacceptably high (e.g., music sessions costing 40x more per person than mobility aids), flag for committee debate.
  7. **Values call flags**—explicitly note when decisions hinge on preferences (e.g., "Is temporary happiness worth more than permanent mobility for others?").

  Applying this to the examples:
  - **Confidence course**: Fails on timeframe (wellbeing gone in 6 months) and lacks capability/resource gains. Verdict: reject, but painful because it's cheap and feels helpful.
  - **Home modifications**: Passes resource/capability alignment but suffers from dropout due to means-testing. Solution: recommend simplifying the application to reduce dropouts.
  - **Music sessions**: High cost, wellbeing-only gains. Likely reject unless funded from donor-restricted pot, forcing a tradeoff discussion about valuing happiness over function.

  The procedure won't resolve foundational disagreements about metrics—e.g., whether happiness intrinsically matters. It also can't fix systemic issues like barriers applicants face. But it makes tradeoffs explicit, which is better than unspoken biases. The key is forcing the committee to articulate *why* they override the procedure, which improves accountability.
answer: |-
  Here’s a decision procedure built for your constraints: **40 minutes per proposal, no philosophy background needed, explicit "values call" flags, and brutal honesty about data gaps**. It prioritizes *stopping power* (clear "no" triggers) and *tradeoff transparency* (where your committee must choose between irreconcilable goals). It’s structured as a flowchart with ordered questions, failure modes, and "lab coat" warnings.

  ---

  ### **The Decision Procedure: 6 Questions, 3 Kill Switches**
  **Core Principle:** Start with measurable harm reduction, then force tradeoffs between welfare (wellbeing), resources (money/things), and capabilities (real opportunities). When metrics conflict, escalate to values calls.

  1. **QUESTION 1: DOES IT CAUSE ACTIVE HARM?**  
     *Check for evidence of physical/psychological harm, fraud, or exploitation.*  
     - **Good enough answer:** No credible allegations or data suggesting harm.  
     - **STOP AND SAY NO IF:** Verified harm claims exist (e.g., injury reports, fraud convictions).  
     - **Failure mode:** Overcaution kills risky-but-necessary programs (e.g., job training for trauma survivors).  
     - **Lab coat warning:** "Credible" is subjective. Err on rejecting if harm evidence exists.

  2. **QUESTION 2: DOES IT MEET DONOR RESTRICTIONS (if applicable)?**  
     *For the 20% restricted pot: Does it use the donor’s wellbeing survey with positive results?*  
     - **Good enough answer:** Donor’s survey shows statistically significant improvement *and* participation >70%.  
     - **STOP AND SAY NO IF:** Fails survey OR participation <50% (high dropout suggests coercion/irrelevance).  
     - **Values call if:** Survey passes but other metrics (e.g., employment) worsen. Proceed but flag conflict.  
     - **Failure mode:** Programs game surveys (e.g., short-term mood boosts without lasting change).

  3. **QUESTION 3: WHAT’S THE PRIMARY CLAIM? (Welfare/Resources/Capabilities)**  
     *Force applicants to pick ONE focus. No "all of the above."*  
     - **Welfare:** Measured wellbeing (surveys, observed behavior).  
     - **Resources:** Cash/asset transfer (money, equipment).  
     - **Capabilities:** New skills/access (jobs, mobility, education).  
     - **STOP AND SAY NO IF:** Claim is vague ("empowerment") or metric is absent (e.g., claims capabilities but measures only attendance).  
     - **Lab coat warning:** Applicants overclaim. Demand aligned metrics (e.g., if "capabilities," measure skill gains, not just happiness).

  4. **QUESTION 4: IS THE EVIDENCE TEMPORALLY PLAUSIBLE?**  
     *Does the benefit last long enough to matter?*  
     - **Good enough answer:** Data covers at least 3 months post-intervention.  
     - **STOP AND SAY NO IF:** Benefit vanishes before 3 months (e.g., happiness spike with no durability).  
     - **Values call if:** Benefit fades between 3-12 months. Committee must decide if short-term gain is worth it.  
     - **Failure mode:** Overvaluing "feel-good" spikes (e.g., post-workshop highs).

  5. **QUESTION 5: DOES THE BENEFIT SURVIVE REAL-WORLD VARIABILITY?**  
     *Critical for resource-based programs.*  
     - **Good enough answer:** Evidence shows benefit across diverse settings (e.g., ramps tested in multiple home types).  
     - **STOP AND SAY NO IF:** Utility collapses in common scenarios (e.g., ramps useless in staircase-only buildings).  
     - **Values call if:** Benefit varies wildly (e.g., means-testing dropouts). Committee must decide if equity or efficiency matters more.  
     - **Lab coat warning:** "Diverse settings" is a guess if evidence is thin.

  6. **QUESTION 6: WHAT’S THE COST PER UNIT OF CLAIMED OUTCOME?**  
     *Make tradeoffs visible. Calculate:*  
     `Cost per person ÷ Units of primary claim`  
     - *Welfare:* Cost per 1-point wellbeing increase (on a 10-point scale).  
     - *Resources:* Cost per $1,000 transferred (after overhead).  
     - *Capabilities:* Cost per skill/access gained (e.g., cost per job obtained).  
     - **STOP AND SAY NO IF:** Cost is 2x higher than similar programs *and* outcomes are weaker.  
     - **Values call if:** Outcomes are strong but cost is high. Committee must debate: "Is this outcome worth premium pricing?"

  ---

  ### **Applied to Your Three Cases**
  **Case 1: Confidence-and-Goals Course**  
  - **Q1:** No harm → Pass.  
  - **Q2:** Not donor-restricted → Skip.  
  - **Q3:** Claims *welfare* (wellbeing jump). Ignores capabilities (no job/skill change).  
  - **Q4:** Benefit gone at 6 months → **STOP AND SAY NO.** Temporal failure.  
  - **Brutal truth:** Kills a cheap, popular program. Forces confrontation: short-term happiness isn’t enough under this procedure. Committee might override on values ("Happiness matters!") but must justify.

  **Case 2: Home-and-Transport Modifications**  
  - **Q1:** No harm → Pass.  
  - **Q2:** Not donor-restricted → Skip.  
  - **Q3:** Claims *capabilities* (mobility access). Resources (ramps) enable capabilities.  
  - **Q4:** Benefits durable (ramps last years) → Pass.  
  - **Q5:** Benefit varies (ramps useless in some buildings). High dropout due to means-test → **VALUES CALL.**  
  - **Q6:** Cost per access gained is low if implemented well.  
  - **Verdict:** Pass with warning: "Fix means-test to reduce dropouts, or accept inequity." Forces equity-efficiency debate.

  **Case 3: Music Sessions**  
  - **Q1:** No harm → Pass.  
  - **Q2:** Eligible for donor pot (wellbeing focus).  
  - **Q3:** Claims *welfare* (happiness). Ignores capabilities (no function change).  
  - **Q4:** Benefit observed during/after sessions → Durability unknown. **VALUES CALL:** Is ephemeral happiness enough?  
  - **Q6:** Cost per head is **40x higher** than mobility equipment. → **STOP AND SAY NO** for general funds.  
  - **Brutal truth:** Only survives if funded from *donor-restricted* pot (where wellbeing is the only metric). Kills it for 80% of funds. Forces a harsh tradeoff: 40 people’s mobility vs. 1 person’s joy.

  ---

  ### **What This Procedure Kills (That You’ll Hate)**
  1. **"Warm glow" programs** (Case 1): Short-term wellbeing boosts without lasting change.  
  2. **High-cost passion projects** (Case 3): Unless donor-restricted, they fail cost-benefit.  
  3. **One-size-fits-all resource distributions** (Case 2): If variability isn’t addressed.  

  You’ll lose cheap, feel-good initiatives. But this avoids wasting funds on programs that don’t meet *any* coherent standard.

  ---

  ### **What This Procedure CANNOT Do**
  1. **Resolve foundational disagreements about "the currency."**  
     - It forces tradeoffs but won’t tell you if "happiness" is better than "mobility." That’s a values call for your committee or city council.  
  2. **Fix bad evidence.**  
     - Garbage in, garbage out. If all data is self-reported or from tiny samples, the procedure amplifies uncertainty.  
  3. **Evaluate systemic impact.**  
     - It assesses *individual* outcomes (e.g., "Did this person get a job?"). It ignores community-wide effects (e.g., "Did this reduce stigma?").  
  4. **Override power dynamics.**  
     - If councilors favor pet projects, a "STOP AND SAY NO" can be ignored. The procedure only works with institutional courage.  
  5. **Create perfect equity.**  
     - It flags variability (e.g., ramp utility) but can’t solve it without violating your "no probing home life" constraint.  

  ---

  ### **Final Advice**
  This procedure is a **bias-revealing tool**, not a truth machine. It won’t make values disputes disappear—but it *localizes* them to specific questions (Q5 variability, Q6 cost tradeoffs). When it says "values call," **demand a recorded vote** in your justification memo. Example: *"Approved despite high cost per outcome (Q6 values call: 4-3 vote). Majority believes happiness justifies 40x premium over mobility aids."*  

  This forces accountability. If you consistently override the procedure for certain outcomes (e.g., wellbeing), admit you’re running a **welfare-maximizing program**—not capability-building. That’s a policy choice, not a flaw. But at least you’ll know.  

  > "The first step is to measure what can be measured. The second is to admit what cannot. The third is not to confuse the two."  
  > — Adaptation for grant panels
