prompt: |-
  I teach a first-year political theory module at a university college in Utrecht, where the cohort is roughly a third Dutch, a third from elsewhere in the EU, and a third from outside Europe — mostly Turkey, Indonesia, Nigeria, and India. A lecture exercise blew up on me last week. I had put a list on the board — constitutional government, freedom of conscience, market economies, secular law, gender equality, free inquiry — and asked which of these are 'Western values'. Two objections landed at once: a Turkish student said the list reads like a transcription of what Brussels requires of candidate states, and a Dutch student said her own grandparents would have rejected half of it, so the values cannot be what the West has actually believed. Afterwards in the staff room an anthropologist colleague told me the phrase is a Cold War artifact that has only ever done contrastive work — it denotes whatever the speaker's current outgroup is taken to lack — while a visiting American political theorist said no, it simply names Enlightenment liberalism, and the discomfort is only embarrassment about saying so. I don't want to adjudicate that fight in front of the students. I want the specification first.

  So: write me the desiderata for an account of what the phrase 'Western values' picks out. The purpose is fixed, and I want it held fixed: the account must be good enough to adjudicate, in public argument, claims of the form 'X is incompatible with Western values' — good enough to say whether such a claim is truth-evaluable at all, what kind of evidence would bear on it, and who has standing to make it. The desiderata should therefore concern the extension and the mechanics of the phrase, not which values are worth having. Four cases broke my exercise and I want them driving the list: the convert case, someone born and raised outside Europe who assents to everything on the board; the betrayal case, two governments both claiming the same heritage and each accusing the other of apostasy; the drift case, the contents of the list visibly tracking the perceived outgroup (anti-communism in one decade, gender egalitarianism in the next); and the cosmopolitan-codification case, items whose actual drafting happened in Geneva and New York in committees with heavy non-Western participation, and which several non-Western states ratify more eagerly than some Western ones. If you suspect that some of what people demand here is not a genuine requirement but the prejudice of one camp, say which and why inside the list.

  Format: exactly five numbered items, each one or two sentences, no introduction and no conclusion. Each item should state a single requirement, give the case that motivates it, and be bracketed as [non-negotiable] or [negotiable] according to whether an account that fails it should be rejected outright or merely demoted. Put an asterisk on the one requirement that does the most work in excluding the accounts actually in circulation — that includes the three I sketched above, plus whatever better account you would put in their place. If two of your five cannot be jointly satisfied by any single account, say so inside the item where the conflict bites rather than adding a sixth item. Skip any scorecard of the standard accounts against the list; I will build that myself.
reasoning: |-
  Okay, the user teaches political theory at a university in Utrecht with a diverse international class. They had an exercise asking which items on a list are "Western values" that sparked immediate objections from students and colleagues. Now they want desiderata for defining "Western values" specifically to adjudicate claims about what's incompatible with them in public arguments.

  Hmm this is a complex request with multiple layers. The user needs a framework to analyze the phrase "Western values" after their classroom exercise backfired. The students' objections reveal core problems: the Turkish student sees it as EU conditionality, the Dutch student notes historical inconsistency, the anthropologist calls it a Cold War contrastive tool, and the American insists it's Enlightenment liberalism. 

  The key challenge is developing criteria that handle four specific cases: the convert (non-Western adherent), betrayal (mutual accusations of apostasy), drift (shifting definitions), and cosmopolitan codification (international drafting with non-Western input). The definition must work for real-world compatibility claims.

  I need to extract precise requirements from these cases. For the convert case, any definition must account for adoption beyond the West. For betrayal cases, it needs to handle internal disputes. The drift case requires historical consistency, while cosmopolitan codification demands acknowledgment of global contributions. 

  The user wants exactly five numbered desiderata - each with a case reference and [negotiable]/[non-negotiable] tagging. One must be marked with an asterisk as most exclusionary. Any unresolvable conflicts should be noted within items. No introductions/conclusions.

  *Thinking about the anthropologist's point* - if "Western values" is purely contrastive, it's useless for compatibility claims. But the American's Enlightenment view ignores historical shifts. The convert case breaks geographic essentialism, while cosmopolitan drafting undermines claims of Western ownership. 

  For the asterisk item, the most powerful requirement might be that the values must be consistently attributable to the West over time - this would exclude both the shifting Cold War definition and rigid Enlightenment claims. But this directly conflicts with the drift case where values clearly evolve...

  Ah, there's the tension: historical consistency vs. acknowledging evolution. I'll flag that in the relevant desideratum. The betrayal case also shows values aren't monolithic - so we need to account for pluralism within the West.

  *Structuring the five items*: 
  1. Non-geographic adherence (convert case) 
  2. Internal pluralism (betrayal case) 
  3. Historical continuity (drift case) 
  4. Non-exclusive origination (cosmopolitan case) 
  5. Actionable criteria for compatibility claims (core purpose)

  Item 3 on historical continuity will get the asterisk - it's the hardest to satisfy and excludes most existing definitions. But it must acknowledge the conflict with documented historical shifts (drift case). The Enlightenment view fails on pluralism, the contrastive view on continuity, and geographic definitions on the convert case.

  *Double-checking*: All four cases are addressed, conflicts noted where necessary, format requirements met. The framework avoids endorsing specific values while enabling analysis of compatibility claims - exactly what the user needs for classroom adjudication without taking sides in the scholars' debate.
answer: |-
  Here are the desiderata for an account of "Western values":

  1.  **Must accommodate normative adoption beyond the West's geographic/cultural core.** [Non-negotiable]  
      *Motivated by the convert case:* An account must explain how someone born and raised outside Europe can genuinely hold "Western values" without contradiction, rejecting geographic or ethnic essentialism.

  2.  **Must account for sustained, substantive internal disagreement and evolution within the West itself.** [Non-negotiable]  
      *Motivated by the betrayal and drift cases:* The account must explain both historical shifts (e.g., changing views on gender equality) and contemporary intra-Western conflicts over value interpretation (e.g., different governments accusing each other of apostasy), avoiding a monolithic or static picture.

  3.  *\** **Must provide a stable historical referent beyond immediate political contrast.** [Non-negotiable]  
      *Motivated by the drift case and the anthropologist's critique:* The account must define the values with reference to identifiable, enduring intellectual, legal, or political traditions within Western history, not *solely* by opposition to a current "outgroup" (e.g., defining them only against communism *or* against contemporary illiberal states). Failure here makes the phrase merely polemical and historically unmoored.

  4.  **Must distinguish normative origins/diffusion from geographical ownership or exclusive practice.** [Negotiable]  
      *Motivated by the cosmopolitan-codification case:* The account must acknowledge that values developed within Western traditions can be codified globally through international processes involving non-Western actors and adopted enthusiastically by non-Western states, without this dissolving their identification as "Western" in origin. However, it need not claim exclusive Western origination for every component value.

  5.  **Must specify actionable criteria for "incompatibility" claims.** [Non-negotiable]  
      *Motivated by the core purpose:* To adjudicate "X is incompatible" claims, the account must define the values with sufficient specificity to identify core tenets whose violation constitutes incompatibility, outline the types of evidence (e.g., laws, institutional practices, core doctrines) relevant to assessing such claims, and clarify who possesses standing (e.g., based on adherence to the tradition, not ethnicity). *This conflicts with the requirement for internal pluralism (#2), as defining core tenets risks excluding legitimate internal dissent; resolving this tension is the account's central challenge.*
