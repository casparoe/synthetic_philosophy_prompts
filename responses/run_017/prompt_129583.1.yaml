  Okay, the user wants a specification for reasoning under self-locating uncertainty, specifically for decision-making about population sizes. They need up to ten requirements, each with a case that motivates it, tagged as non-negotiable, negotiable, or a preference. Plus, they want distinctions between rules, priors, and decision theories, and an analysis of existing rules against the requirements.

  First, I need to understand the fixed points. The cosmological case with varying observer counts, the earliness argument, the first-two-people case, the sleeping beauty problem, and the three additional cases: single undivided life with memory wipes, the sorites problem for observer boundaries, and infinite populations. These are crucial for grounding the requirements.

  The user emphasizes that adequacy means the rule must be actionable in real scenarios with large numbers, vague boundaries, and fixed priors. So, each requirement must address these challenges. Also, distinguishing between constraints on the self-locating rule vs. the prior/measure is key because some common critiques might be misplaced if they're actually about the prior.

  The requirements need to cover different aspects. For example, handling large numbers without sensitivity to cutoffs (R1), vague boundaries without arbitrary thresholds (R2), and infinite populations (R3). The sleeping beauty case requires indifference in certain situations (R4), while the first-two-people case needs to handle updates without paradox (R5). The single undivided life scenario demands consistency across subjective moments (R6), and the cosmological case requires that self-locating evidence can influence beliefs (R7).

  Tagging each requirement: Non-negotiable ones are those without which the rule fails in core cases. For example, R1 (Large Numbers) is non-negotiable because astronomical populations are common in the use cases. R2 (Vague Boundaries) might be negotiable if some theories accept sensitivity but compensate elsewhere. Preferences like R8 (Decision Separation) could be contentious; some camps might want integrated decision rules.

  Conflicts between requirements: R7 (Non-Vanishing Influence) and R3 (Infinite Populations) clash because infinite observers can make self-locating evidence irrelevant. A bounded measure might resolve this, but it's a fix. R5 (First-Two-People) vs. R4 (Indifference in Symmetry) in cases like Doomsday where adding observers breaks symmetry. This might require accepting counterintuitive conclusions as a cost.

  Scoring the rules:
  - Self-Sampling (SSA): Fails on R2 (vague boundaries) and R3 (infinite cases). It's simple but not robust.
  - Self-Indicating (SIA): Fails on R5 (first-two-people) by overcounting, and struggles with R9 (no revision) due to prior sensitivity.
  - No-Update: Fails R7 (non-vanishing influence) entirely, making it useless for the cosmological case.

  The user's deeper needs: They want clarity on which requirements are essential vs. debatable, where conflicts arise, and how existing rules stack up. They're likely building or evaluating a framework for real applications, so practical feasibility is key. Highlighting the trade-offs and which requirements to prioritize (e.g., dropping R3 for a bounded measure) addresses their need for actionable guidance.
answer: |-
  Here is a specification of requirements for a theory of reasoning under self-locating uncertainty, tailored for decision-making about observer populations across the specified use cases. Requirements are grounded in your fixed points, distinguish rule/prior/measure constraints, and separate belief from action. Each is tagged with reasoning, and conflicts are analyzed.

  ### Core Requirements
  1.  **R1 (Large Number Robustness):** *The rule must yield well-defined, actionable credences even when population sizes differ by astronomically large factors (e.g., 10^100 vs 1).*  
      **Motivation:** Cosmology & existential risk assessments involve vast, exponentially differing predictions. A rule failing here is unusable.  
      **Constraint On:** Self-locating rule + Measure. The rule must process the measure's output over vast populations stably.  
      **Tag:** Non-negotiable. Failure invalidates core use cases (cosmology, population risk).  
      *Reasoning:* Without this, the rule cannot fulfill its primary purpose. Intuitions about "fairness" or "intuitiveness" are secondary.

  2.  **R2 (Vague Boundary Insensitivity):** *The rule's output must not exhibit pathological sensitivity (e.g., orders-of-magnitude swings) to small, unprincipled shifts in defining "observer" within a Sorites-like range.*  
      **Motivation:** Observer definitions (e.g., cognitive sophistication in animals/AI) are inherently vague. Decision-making requires stability.  
      **Constraint On:** Measure + Prior. The rule must be compatible with measures smooth across vague boundaries.  
      **Tag:** Negotiable. A rule *requiring* precise boundaries is flawed, but some sensitivity might be unavoidable; the demand is for *non-pathological* behavior.  
      *Reasoning:* Perfect insensitivity is likely impossible, but extreme sensitivity (e.g., credence flipping based on arbitrary threshold shifts) must be avoided for usability. This is a pragmatic demand, not a metaphysical one.

  3.  **R3 (Infinite Population Handling):** *The rule must provide well-defined, actionable credences when hypotheses predict infinite or indefinite observer populations.*  
      **Motivation:** Cosmological theories (e.g., eternal inflation) often predict infinite observers.  
      **Constraint On:** Measure + Prior. The rule cannot assume finitude; it needs a measure defining "density" or selection probabilities in infinite sets.  
      **Tag:** Non-negotiable (for cosmology).  
      *Reasoning:* Core use case (cosmology) demands it. Failure here renders the rule useless for its primary intended domain. Complaints about infinitudes are misfiled as rule problems; they are measure/prior problems.

  4.  **R4 (Indifference in Symmetric Indistinguishability):** *In cases of perfect epistemic symmetry and indistinguishability between subjectively identical moments (e.g., Sleeping Beauty awakenings, Undivided Life episodes), the rule must prescribe equal credence over the possible states consistent with that moment.*  
      **Motivation:** Sleeping Beauty (Heads=1 awakening, Tails=2 awakenings); Undivided Life (Large=10^100 episodes, Small=10 episodes). An agent cannot rationally distinguish identical moments.  
      **Constraint On:** Self-locating rule. It must enforce indifference when no distinguishing evidence exists.  
      **Tag:** Non-negotiable.  
      *Reasoning:* Violating indifference in symmetric situations implies an arbitrary, unjustifiable bias. This is foundational to coherence under uncertainty. Camp preferences (e.g., 1/2 vs 1/3 in SB) stem from prior/measure choices, *not* the indifference principle itself.

  5.  **R5 (First-Person Update Validity):** *The rule must allow valid Bayesian updating on the fact "I exist" or "I am experiencing *this* now".*  
      **Motivation:** Cosmological comparison (H1: 10^10 obs, H2: 10^100 obs; your existence favors H2); First-Two-People (existing now updates probability of future descendants).  
      **Constraint On:** Self-locating rule. It defines how "I observe that I exist" updates credences over hypotheses.  
      **Tag:** Non-negotiable.  
      *Reasoning:* Rejecting this update (No-Update rule) makes self-locating evidence inert, directly contradicting the need to use "my existence" to inform beliefs about cosmology or future populations. This is core functionality.

  6.  **R6 (Temporal Coherence in Undivided Life):** *In the Undivided Life case, the rule must prescribe the *same* credence function to the agent on every indistinguishable episode, regardless of the true total number.*  
      **Motivation:** Undivided Life with memory erasure. The agent's subjective state and evidence are identical each time.  
      **Constraint On:** Self-locating rule + Prior. The rule must output consistent beliefs given identical input states.  
      **Tag:** Non-negotiable.  
      *Reasoning:* Demands consistency across time for the same agent in identical epistemic states. Violation implies the rule outputs arbitrary beliefs dependent on unobserved facts, undermining rationality.

  7.  **R7 (Non-Vanishing Influence):** *The rule must allow self-locating evidence ("I exist", "I am early") to have non-zero influence on credences about population size, even for hypotheses predicting arbitrarily large (finite) populations.*  
      **Motivation:** Earliness Argument (Doomsday); Cosmology. If "I am early" cannot slightly lower credence in vast futures, the argument is dead; if "I exist" cannot favor larger universes, cosmology comparisons fail.  
      **Constraint On:** Self-locating rule + Measure. The measure must not dilute the update to zero for large populations.  
      **Tag:** Preference (Earliness Camp).  
      *Reasoning:* While necessary for arguments like Doomsday, it conflicts with R3 (Infinities) and might be seen as demanding excessive influence by other camps. It's a substantive demand reflecting a specific intuition about the weight of self-locating evidence.

  8.  **R8 (Decision Rule Independence):** *The theory must output well-defined *credences* over hypotheses (including population size). It need not specify *how* to aggregate utilities across observers/copies/episodes.*  
      **Motivation:** Fundamental distinction between belief and action. Decision-making requires *additional* rules (e.g., standard causal, evidential, or total/species utilitarianism applied to the credence distribution).  
      **Constraint On:** Theory Scope.  
      **Tag:** Non-negotiable.  
      *Reasoning:* Bundling action forces a specific moral/social choice (e.g., selfish vs. altruistic) into the epistemology. The belief rule must stand alone; the decision rule is a separate module using its output. Failure here conflates distinct philosophical problems.

  9.  **R9 (Prior Invariance):** *The rule must function correctly without requiring revision of the agent's prior over non-self-locating aspects of the hypotheses.*  
      **Motivation:** Fixed prior demand. The prior encodes non-anthropic knowledge/beliefs; the rule's job is to handle self-locating evidence given that prior.  
      **Constraint On:** Self-locating rule.  
      **Tag:** Preference (Objectivist Camp).  
      *Reasoning:* While desirable for objectivity, it clashes with rules like SIA which effectively demand a specific prior (uniform over observers). Insisting on invariance might prevent using otherwise functional rules. It's an ideal, not a strict adequacy condition.

  10. **R10 (Actionability under Uncertainty):** *When the agent is uncertain *which* self-locating rule is correct, the theory must provide a meta-rule or framework for generating credences usable for decision-making.*  
      **Motivation:** Agent uncertainty about the correct anthropic principle itself.  
      **Constraint On:** Overall Theory.  
      **Tag:** Non-negotiable.  
      *Reasoning:* To be usable, the framework must handle its own potential fallibility. An agent paralyzed by rule uncertainty cannot act.

  ---

  ### Conflicts, Trade-offs, and Implications
  1.  **Key Conflict: R7 (Non-Vanishing Influence) vs. R3 (Infinite Populations)**
      *   **Problem:** R7 demands that "I exist" provides evidence for larger populations. In infinite populations (R3), the probability of observing *any specific index* might be zero under standard measures, making the update undefined or leaving credences unchanged (violating R7). Measures like the "frequentist" measure (fraction of observers in a finite region) can satisfy R3 but often dilute the update to near-zero for large finite N (violating R7's spirit).
      *   **Resolution:** **Abandon strict R7.** Accept that self-locating evidence's influence diminishes with population size and vanishes for true infinities under most non-pathological measures. This sacrifices the *strong* earliness argument and absolute favoritism for larger universes in infinitary cases.
      *   **Best Weakened Theory:** A rule using a **bounded measure** (e.g., integrating over a finite causal patch or using a natural density limit) satisfies R3 practically and retains significant influence for vast finite N. The **SSA** rule often implements this.
      *   **Loss:** Strong Doomsday arguments become untenable; "I exist" provides weak/no evidence favoring truly infinite universes over finite ones.

  2.  **Secondary Conflict: R4 (Indifference) vs. R5 (Update) in First-Two-People**
      *   **Problem:** First-Two-People: H1 (no descendants), H2 (vast descendants). Existing now, SSA updates P(H2) downwards (more observers in H2 reduces probability you are among the first two). R5 demands this update. However, upon learning "I am one of the first two", SSA prescribes indifference between H1/H2 *if* the first two are indistinguishable (R4). Some find this counterintuitive (H2 seems objectively more likely).
      *   **Resolution:** **Uphold both.** The counterintuitiveness stems from conflating prior beliefs about H1/H2 with the update from self-location. The rule correctly applies R4 and R5. The cost is accepting counterintuitive conclusions when many observers exist hypothetically.
      *   **Best Theory:** **SSA** handles this correctly. SIA avoids the counterintuitive drop but violates R5's core update logic in other ways.

  3.  **Most Excluding Requirement:** **R3 (Infinite Populations)**. Many otherwise attractive rules (e.g., naive SIA, simple SSA) fail catastrophically or become undefined with infinities. It forces the adoption of complex measure-theoretic foundations.
  4.  **Requirement to Drop First:** **R9 (Prior Invariance)**. Insisting on invariance unnecessarily handicaps the search for functional rules. A rule requiring a specific prior (e.g., SIA's effective uniform-over-observers prior) can still be usable if that prior is justifiable *within the context*.

  ---

  ### Scoring Existing Rules
  *(Scores: ✓ = Satisfies, ✗ = Violates, ~ = Partially/Contextually Satisfies)*

  | Requirement | Self-Sampling (SSA) | Self-Indication (SIA) | No-Anthropic-Update |
  | :---------- | :------------------ | :-------------------- | :------------------ |
  | **R1 (Large Numbers)** | ✓ (Stable)          | ✓ (Stable)            | ✓ (Ignores size)    |
  | **R2 (Vague Boundaries)** | ✗ (Highly sensitive) | ✗ (Highly sensitive)  | ✓ (Unaffected)      |
  | **R3 (Infinities)**      | ~ (Requires measure; often bounded) | ✗ (Fails catastrophically) | ✓ (Unaffected)      |
  | **R4 (Indifference)**    | ✓ (Core strength)    | ✗ (Biases large N)    | ✓ (Unaffected)      |
  | **R5 (1st-Person Update)**| ✓                    | ✓                     | ✗ (Core failure)    |
  | **R6 (Temporal Coherence)**| ✓                   | ✗ (Varies per episode)| ✓                   |
  | **R7 (Non-Vanishing Inf.)**| ✗ (Vanishes for large N/infinities)| ✓ (Excessive influence) | ✗ (Zero influence) |
  | **R8 (Dec. Rule Indep.)** | ✓                   | ✓                     | ✓                   |
  | **R9 (Prior Invariance)** | ✓                   | ✗ (Demands specific prior) | ✓                |
  | **R10 (Rule Uncertainty)**| ? (No standard meta-rule) | ? (No standard meta-rule) | ?                 |

  *   **SSA Summary:** Best on indifference (R4), coherence (R6), update validity (R5), and prior invariance (R9). Weakest on vague boundaries (R2) and non-vanishing influence (R7), and requires care with infinities (R3). **Best fit for cosmology with bounded measures.**
  *   **SIA Summary:** Strong on large numbers (R1) and influence (R7), but fails catastrophically with infinities (R3), violates indifference (R4) and temporal coherence (R6), demands prior revision (R9), and is hypersensitive to boundaries (R2). **Poor fit for cosmology/infinities; risky elsewhere.**
  *   **No-Update Summary:** Trivially satisfies robustness (R1), boundaries (R2), infinities (R3), indifference (R4), coherence (R6), and invariance (R9). Its core failure (R5, R7, R8) is fatal: it makes self-locating evidence unusable for the primary purpose. **Inadequate.**

  **Handling Rule Uncertainty (R10):** An uncertain agent should assign credences over candidate rules (SSA, SIA, etc.) based on coherence with fixed points and theoretical virtues. The overall credence over a hypothesis H is then the *expectation* of the credence assigned to H by each rule, weighted by the agent's credence in that rule being correct. Decision-making proceeds using this meta-credence distribution. No consensus meta-rule exists.
