prompt: |-
  I sit on a municipal commission that has one year to recommend what to do with a backlog of contested commemorations: two statues, a school name, a couple of street names, a university hall named for a benefactor who also funded eugenics research, and a monument whose subject is unobjectionable but that was erected by a deposed regime partly as propaganda. We can only recommend; the council decides, and we will have to act while the disagreement about what we owe the past is still live. Before we hear from any more interested parties, I want a specification rather than a verdict.

  Write the desiderata that a theory of commemoration would have to meet to be usable by a body like mine: the cases it must handle, the distinctions it must respect, the things about how public honoring actually works that it cannot contradict, and the reason each item is a genuine requirement rather than a prejudice of one camp. Among the claims I want you to test rather than assume: whether honoring is a zero-sum allocation of a scarce stock of public recognition, so that adding one name is a cost to others; whether a monument's meaning is fixed by its makers' intentions or can accumulate meaning from what later happens at the site; the difference between commemorating a victim, a perpetrator, and a collective such as a regiment, a company, or a founding generation, where no individual's record settles the case; whether removal, relocation, recontextualization in place, and adding a second monument nearby are genuinely distinct options or the same option with different costs; and what a commission owes a minority whose heroes keep losing under majority rule.

  Then flag any pair of desiderata you think cannot be jointly satisfied — I suspect administrability by nonhistorians and case-by-case sensitivity pull apart, and that treating like cases alike conflicts with deferring to local attachment — and say which single requirement does the most to exclude candidate theories. You may score the usual strategies (leave everything, remove everything objectionable, contextualize in place, move to museums) against the list, but keep that to a few lines; the criteria are what I need.

  Separate what is settled here from what is genuinely contested among people who work on the topic, and do not present a contested position as the consensus; where you are unsure, say so. Please write in British English.
reasoning: |-
  Okay, the user sits on a municipal commission dealing with contested commemorations. They need a set of criteria for evaluating theories of commemoration. Let me start by understanding their exact requirements. They want desiderata that a theory must meet, without bias towards any camp. They mentioned specific cases: statues, school names, street names, a university hall named after a eugenics funder, and a propaganda monument. 

  First, I need to list the cases the theory must handle. That includes honoring individuals with mixed legacies, groups like regiments or companies, and victims versus perpetrators. Also, the theory must address different commemoration forms—statues, names, monuments. 

  Next, distinctions to respect: intent vs. reception, individual vs. collective, victim vs. perpetrator. Public honoring isn't zero-sum; adding a commemoration doesn't necessarily take away from others. But is that settled? Maybe not, since some argue public space is limited. Need to note that as contested.

  The user also wants to know if removal, relocation, etc., are distinct options. They are logistically different but might overlap in intent. Administrability vs. case-by-case sensitivity could conflict, as well as consistency vs. local attachment. 

  I should identify which requirement is most exclusionary. Probably the "intent vs. reception" distinction because many theories lean one way, excluding others. Also, the non-zero-sum aspect is key; if a theory assumes it's zero-sum, that might invalidate it.

  Settled points: commemorations change meaning over time, and their value isn't solely historical. Contested: whether meaning is fixed by intent, and the zero-sum question. Also, whether removal is erasure or correction. 

  The user mentioned testing claims like zero-sum recognition and meaning accumulation. Need to present both sides without taking a stance. For example, some scholars say public attention is limited, so it's zero-sum, others disagree. 

  Minority heroes losing to majority rule—what does the commission owe them? The theory must address democratic legitimacy vs. minority recognition, but how? Maybe through procedural fairness and considering disproportionate impact. 

  Conflicting desiderata: Treating like cases alike vs. deferring to local attachment. Also, administrability for non-experts vs. nuanced case handling. Highlight these tensions.

  Most exclusionary requirement: Engaging with reception and changing meanings. If a theory only considers original intent, it fails here. 

  Finally, scoring common strategies briefly. Leave everything fails on evolving norms and minority recognition. Remove everything might ignore context. Contextualize in place handles multiple needs but may be complex. Museums are for education but can feel like hiding. 

  Need to ensure British English and avoid presenting contested ideas as consensus. Flag uncertainties, like the zero-sum debate.
answer: |-
  Here is a specification of desiderata for a theory of commemoration suitable for a municipal commission, grounded in practical requirements rather than partisan positions, presented in British English:

  **Core Cases the Theory Must Handle:**
  1.  **Individuals with Complex Legacies:** Figures lauded for significant contributions (e.g., philanthropy, leadership) but also implicated in profoundly harmful acts or ideologies (e.g., the eugenics benefactor).
  2.  **Collective Entities:** Groups (e.g., regiments, companies, "founding generations") where individual culpability or virtue is diffuse or contested, and the collective action/identity is the focus.
  3.  **Victims vs. Perpetrators:** Distinguishing memorials honouring those who suffered injustice from those honouring individuals or entities responsible for causing it.
  4.  **Propagandistic Origins:** Monuments where the *subject* may be unobjectionable or even admirable, but the *purpose* of its erection was explicitly tied to legitimising a harmful or deposed regime.
  5.  **Multiple Commemoration Forms:** Statues (visual, symbolic), names (schools, streets, halls – functional, linguistic), and monuments (narrative, spatial). The theory must work across these differing modes of public presence.
  6.  **Evolving Contexts:** Situations where the original meaning or justification for the commemoration has shifted significantly due to societal change, new historical understanding, or events occurring at/near the site.

  **Essential Distinctions the Theory Must Respect:**
  7.  **Intent vs. Reception:** It must account for both the original purpose/intent behind the commemoration *and* how it is received, interpreted, and experienced by diverse publics over time. *Requirement:* Public meaning is dynamic; ignoring intent risks historical erasure, ignoring reception ignores lived experience and harm.
  8.  **Individual vs. Collective Honour:** The grounds for honouring a specific individual (based on personal actions/character) differ significantly from honouring a collective entity (based on shared identity, symbolic representation, or group action). *Requirement:* Applying individual moral standards uniformly to collectives is often historically inaccurate and analytically flawed.
  9.  **Commemoration vs. Documentation:** Honouring implies endorsement or celebration; documenting signifies historical record without endorsement. *Requirement:* Public resources spent on commemoration inherently carry an element of endorsement; confusing the two undermines civic trust.
  10. **Degree of Harm & Nature of Contribution:** The theory must provide a framework for weighing the severity and nature of harmful acts/associations against the nature and significance of positive contributions. *Requirement:* Absolutist approaches ("one bad act negates all good") are impractical and ignore historical complexity.

  **Constraints of Public Honouring the Theory Cannot Contradict:**
  11. **Public Space is Meaning-Laden & Contested:** Physical commemorations occupy shared civic space, imbuing it with meaning that impacts citizens' sense of belonging and identity. This space is finite and symbolically charged. *Requirement:* Denying this ignores the visceral impact monuments have on the public realm and civic discourse.
  12. **Commemorations are Active, Not Static:** They are not merely historical records; they *do* something in the present – shaping narratives, endorsing values, influencing identity. *Requirement:* Treating them as inert artefacts ignores their ongoing social and political function.
  13. **Democratic Legitimacy Matters:** Decisions require public justification and procedural fairness, even if final authority rests elsewhere (e.g., council). *Requirement:* Ignoring process undermines the commission's credibility and the legitimacy of outcomes.
  14. **Resource Constraints are Real:** Decisions have financial, logistical, and temporal implications (maintenance, removal, new installations, consultation). *Requirement:* Proposals must be feasible within municipal capacities.

  **Specific Claims to Test (Not Assume):**
  15. **Zero-Sum Recognition?** *Requirement:* The theory must grapple with whether public attention/esteem is finite. If space/attention *is* scarce, adding honours *can* marginalise others, especially historically excluded groups. If it *isn't*, this argument loses force. *Status: Contested* (Scholars debate the economics of attention/symbolic space).
  16. **Meaning: Fixed Intent vs. Accumulated Reception?** *Requirement:* The theory cannot *a priori* privilege intent or reception; it must provide a way to *consider both* and explain their relative weight in different cases. *Status: Contested* (Core tension in memory studies/historical theory).
  17. **Distinctness of Intervention Options:** *Requirement:* The theory must recognise that removal, relocation, recontextualisation (plaques, counters), and augmentation (new monuments) have *fundamentally different* symbolic and practical consequences (e.g., erasure vs. correction vs. dialogue vs. addition). Treating them as mere cost variants ignores their distinct meanings.
  18. **Obligation to Persistent Minorities:** *Requirement:* A viable theory must address what, if anything, is owed to groups whose historical figures/values consistently lose out in majoritarian processes regarding commemoration – beyond mere procedural participation. Does fairness require disproportionate consideration? *Status: Contested* (Touches on core liberal democratic tensions between majority rule and minority rights/recognition).

  **Flagged Conflicts Between Desiderata:**
  *   **Administrability (Simplicity/Clarity) vs. Case-by-Case Sensitivity (Nuance/Context):** A simple, clear rule (e.g., "remove anyone connected to practice X") is easy to apply but ignores mitigating contexts, degrees of involvement, or positive contributions (#10). A deeply contextual approach respects complexity (#1, #2, #6, #10) but is harder for non-experts to apply consistently and risks paralysis or accusations of arbitrariness (#13).
  *   **Treating Like Cases Alike (Consistency/Fairness) vs. Deferring to Local Attachment (Particularity/Legitimacy):** Insisting on uniform standards (#13) can override strong local sentiments or attachments to a specific commemoration, even if its merits are weak by broader standards (#18). Prioritising local feeling (#12, #18) risks inconsistency and privileging sentimentality over principle or historical accuracy.

  **Most Excluding Requirement:**
  *   **Requirement #16 (Accounting for Both Intent *and* Reception/Accumulated Meaning):** This is likely the most challenging and exclusionary. Theories heavily privileging original intent will struggle with #6 and #11 (evolving norms, present impact). Theories solely focused on present reception will struggle with #7 and #9 (ignoring history, confusing documentation with honour). A viable theory *must* integrate these dynamic perspectives.

  **Settled vs. Contested:**
  *   **Settled (Wide Scholarly/Civic Consensus):**
      *   Commemorations have present-day social and political effects; they are not inert history (#12).
      *   Meaning can and does evolve over time (#6).
      *   Distinctions exist between honouring victims and perpetrators (#3) and between commemoration and documentation (#9).
      *   Historical context is crucial for understanding (#1, #2, #4).
      *   Public space is symbolically significant (#11).
      *   Different intervention types (removal, contextualisation etc.) exist and have different implications (#17).
  *   **Genuinely Contested:**
      *   Whether public recognition/honour is effectively zero-sum (#15). *(*Scholars disagree; empirical evidence mixed).
      *   The *relative* weight and authority of original intent vs. subsequent reception/meaning (#16). *(Core theoretical battleground)*.
      *   The precise moral calculus for weighing contributions vs. harms, especially across time (#10). *(No universally agreed formula)*.
      *   How much weight *should* be given to local attachment vs. broader ethical/historical principles (#18, Conflicts). *(Democratic theory tension)*.
      *   Whether removal constitutes "erasure" or necessary correction (#17 interpretation). *(Highly polarised)*.
      *   The nature and extent of obligations to persistent minorities in commemoration (#18). *(Under-theorised in practice)*.

  **Brief Scoring of Common Strategies:**
  *   **Leave Everything:** Fails #6 (evolving norms), #11 (impact on contested space), #12 (active endorsement), often #18 (minority recognition). Ignores the problem.
  *   **Remove Everything Objectionable:** Risks failing #1, #2, #10 (ignores complexity, nuance, context), #16 (ignores potential for positive legacy or evolving meaning), #7 (disregards historical intent entirely). Can be perceived as erasure.
  *   **Contextualise In Place:** Addresses #6, #7, #16 (integrates history and present meaning), #17 (offers distinct solution). Can struggle with #11 (if the physical presence remains profoundly oppressive), #10 (if contextualisation feels inadequate for the harm), #13 (complexity/cost).
  *   **Move to Museums:** Addresses #7, #9 (shifts to documentation), #12 (removes active honouring). Can fail #11 (if seen as hiding history), #18 (if removal feels like a loss without gain), #17 (relocation is distinct). Practical constraints (#14) are significant.

  This framework provides the essential criteria and identifies the key tensions your commission must navigate when evaluating any proposed approach to handling the contested commemorations. It explicitly avoids presupposing answers to the deeply contested questions you raised.
