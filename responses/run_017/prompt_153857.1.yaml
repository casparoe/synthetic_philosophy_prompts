  ### **Attack from a Superrationality Defender**  
  A defender might argue:  
  > “Partial correlation isn’t part of true superrationality. The theory only applies to perfectly symmetric agents who are certain to choose the same action (ρ=1). Any ρ<1 is ad hoc and outside the model.”  

  **Counter:** This conflates epistemology with metaphysics. Hofstadter’s original thought experiments (e.g., Prisoner’s Dilemma with identical twins) rely on psychological symmetry, not logical certainty. In real-world cases like shared professional norms, agents have reason to believe others are similar but not identical. Dismissing ρ<1 as “not superrationality” sacrifices explanatory power for purity—it can’t handle everyday cooperation (e.g., tipping in a restaurant where norms create ρ~0.6).  

  **Cost to the defender:** They must abandon applications to realistic imperfectly correlated settings, limiting superrationality to thought experiments with clones or telepathy.  

  ### **Key Structural Feature**  
  The tension between **cost of effort** and **pivotal probability**. At low ρ, high-cost actions (A) are rarely pivotal, so free-riding (B) dominates. At high ρ, A’s cost is justified by near-certain success. At middling ρ, Moderate (C) balances cost and impact—if calibrated.  

  ### **Effect of Deleting Moderate Option**  
  If C is removed, the game becomes a threshold public goods dilemma:  
  - With two actions (A: contribute, B: free-ride), the verdict flips at a **single critical ρ** (e.g., ρ=0.5).  
  - Example: For 10 players, threshold=50 hours, A gives 5 hours, cost $1,000, bonus $10,000. Then:  
    - P(success if you choose A) = P(9 others provide ≥45 hours) = P(each provides 5ρ) → ρ ≥ 0.5 for A > B.  
  - This lacks the intermediate optimum, making it “ordinary.”  

