  hey — I want to practise arguing that acausal trade is basically a rounding error for any agent anyone is ever likely to actually build, and I need someone to hit back properly rather than nod along. So: you play the true believer. You think acausal trade is a first-order consideration for real bounded agents, not a cute puzzle.

