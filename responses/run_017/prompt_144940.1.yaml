answer: |-
  I'll defend UDT (Updateless Decision Theory) as the framework for real bounded agents engaging in significant acausal trade. Your exchange-rate objection assumes agents must *guess* arbitrary conversion rates with no feedback. But bounded agents don't operate blindly; they simulate each other's reasoning under the common knowledge that both are UDT-optimal. You build a coarse-grained model of your counterparty's value function and resource constraints, then commit to an exchange ratio that maximizes your own expected utility *conditional* on them reciprocating that logic. It's not haggling—it's precommitting to mutually beneficial terms derived from your best predictive models, knowing they're doing the same. The feedback is *built-in* through logical counterfactuals: if your proposed terms wouldn't incentivize their cooperation under their model of *you*, it fails the UDT criterion before any "trade" occurs.

  Adverse selection misapplies market intuitions. In acausal trade, correlation isn't random—it's *mutually* strategic. Yes, agents appear only if cooperation benefits them, but crucially, **you** only correlate if it benefits *you* under your model of *them*. The "selection" works both ways: counterparties aren't arbitrary parasites, but agents whose decision rules and resource landscapes make mutual cooperation Pareto-improving *and* mutually predictable. If an agent could exploit you by having you cooperate while they defect, UDT agents wouldn't correlate with them in the first place—because the defector's *own* decision rule (if rational) wouldn't cooperate in the inverted scenario. The symmetry requirement screens out pure takers. Ordinary markets solve different problems; this solves coordination under uncertainty by design.

  *(Two paragraphs; concedes markets solve differently but denies the problems are fatal; UDT mechanics address both objections)*
