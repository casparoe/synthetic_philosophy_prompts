prompt: |-
  I'm writing a novel — near-future, played mostly straight — and I need one in-world document that a character can read on the page without the book stopping dead. Here's the setup. In this world a private foundation maintains "the Book": a room full of indexed volumes that are supposed to contain the reply Einstein would give to any question anyone could put to him. It's that old thought-experiment about a book you can hold a conversation with, except now it's an institution with a gift shop. Members pay a lot of money to submit one question in approved wording, and recieve a reply some months later, typed up and notarised, because the answer has to be looked up and read aloud by a paid Reader. My narrator is up at 3am trying to decide whether to spend the last of an inheritance on one question about her dead father, and she's reading the foundation's public FAQ while she decides. So I need the FAQ itself.

  Write me that page: about 700 words, numbered questions and answers, deadpan corporate-customer-service voice, the kind of thing that was drafted by a lawyer who has stopped being surprised. The jokes have to come from the philosophy being right, not from anyone going "can you believe this place." Specifically, I want these real features exaggerated into policy rather than stated as philosophy:

  — that the Book is a lookup table: every exchange was precomputed, it has never once been surprised, and retrieval is doing all the work that understanding was supposed to do
  — the speed problem: replies take months because reading takes time, and the foundation insists this is just the Book thinking at its own pace, and sells a "Real-Time Edition" that is transparently a staff member improvising in the next room
  — that it never initiates anything: no one has ever been asked a question by the Book, there's a spontaneity surcharge, and one answer admits the Book has volunteered three remarks since 1974, all of them about trains
  — the systems reply: the foundation's official line that the person is the whole apparatus — Book, Readers, index, building, insurance policy — and that the Book by itself has no views on anything
  — the regress hiding underneath: the Readers' union, the "Reader Problem" of staff who start to believe they're the voice, and the rule that no Reader may serve more than four years
  — the triviality worry: a customer asking whether their kitchen appliance is also Einstein, answered with the foundation's refusal to certify appliances while pointedly not disputing the principle that any object can be read as implementing any conversation you like
  — the consciousness question itself, which the FAQ should slide off into what the insurers require: the foundation warrants only that the Book behaves a certain way and takes no position on the rest

  A few invented details I want in there please, since they're load-bearing for my plot: questions must be submitted in pre-approved phrasing and there's "paraphrase insurance" if yours gets reworded; follow-up questions are answered from "Branch Editions" compiled by impersonators, and the contract calls this continuity; and there's a clause about what happens to your question if the reading is interrupted. Keep it funny for someone who knows the Chinese-room / blockhead literature and perfectly readable for someone who doesn't. Don't let the document wink at the reader — nobody in it is in on the joke — and don't let it settle whether the Book is a person; I want the reader to feel the pull of both answers and be a little frightened that the FAQ is, on its own terms, reasonable. End on one customer question the foundation declines to answer.
reasoning: |-
  Okay, the user is writing a near-future novel and needs an in-world FAQ document for a fictional foundation that maintains "the Book"—a repository claiming to contain Einstein's responses to any question. The challenge is crafting this FAQ to feel authentic, corporate, and philosophically dense without breaking immersion. 

  First, I need to unpack the core philosophical hooks they want emphasized: 
  - The lookup-table nature (precomputed answers, no surprise)
  - Artificial delays framed as "thinking time"
  - The Book's passivity (spontaneity surcharge, train remarks)
  - Systems reply (whole institution as "Einstein")
  - Reader union issues (4-year limit, identity crises)
  - Triviality argument (appliance analogy)
  - Consciousness dodged via insurance requirements

  Key plot devices to weave in:
  - Approved phrasing + paraphrase insurance
  - Follow-ups handled by impersonators ("Branch Editions")
  - Reading interruption clause
  - One deliberately unanswered question

  Tone is critical—deadpan corporate legalese that accidentally reveals absurdity. No winking at the reader. The humor must emerge from rigid policies logically extending the thought experiment. 

  Structure-wise, I'll model it after real FAQs: numbered Q&A with escalating strangeness. Opening should establish credibility (hours, pricing), middle section unravel the mechanics (Readers, indexing), later questions confront the philosophy. The unanswered final question ("Is he happy?") creates lingering unease.

  For plausibility, I'll:
  - Bury revelations in subclauses (e.g., train remarks in A6)
  - Use insurance as a scapegoat for limitations (A12)
  - Make Branch Editions sound like a service upgrade (A9)
  - Have the appliance question answered with bureaucratic neutrality (A13)

  The fear factor comes from the FAQ being *too* reasonable—each policy defends itself airtightly while the abyss of meaninglessness peers through. Reader's Union rules (A8) hint at institutional rot without stating it outright. Ending on the unanswered question leaves the existential dread hanging.
answer: |-
  ## THE EINSTEIN BOOK FOUNDATION: FREQUENTLY ASKED QUESTIONS (PUBLIC EDITION)

  **Last Updated:** October 17, 2042

  **1. What is the Einstein Book?**
  The Einstein Book (hereafter "the Book") is a proprietary physical repository maintained by the Einstein Book Foundation (EBF). It contains exhaustively indexed, pre-composed textual replies attributed to the perspective of Albert Einstein (1879-1955). These replies are generated algorithmically from the Book's structure and contents in response to specific, approved queries.

  **2. How do I ask the Book a question?**
  Membership is required. Upon joining and payment of the applicable fee, members receive one (1) Question Credit. Members submit proposed questions via the Secure Query Portal (SQP) using EBF-approved phrasing templates. Submissions undergo Phrase Compliance Review (PCR). Approved questions enter the Retrieval Queue. Average processing time is currently 6-9 months.

  **3. Why does it take so long to get an answer? Isn't it just looking something up?**
  The Book operates at its own inherent pace. The retrieval process involves complex physical interaction with the repository, governed by the Book's internal structure and the principles of its assembly. This constitutes the Book's "thinking" phase. Attempts to accelerate this process compromise the integrity of the response. (See also: Question 10 - Real-Time Edition).

  **4. What if my question isn't in an approved phrasing?**
  The PCR process identifies non-compliant submissions. Members will receive notification and suggested compliant rephrasings. Acceptance of a suggested rephrasing automatically activates our Standard Paraphrase Insurance, covering the core semantic intent. Members may also submit alternative phrasings for re-review (additional fee applies).

  **5. What do I receive?**
  Upon successful retrieval, you will receive a notarized Typeset Response Document (TRD) bearing the official EBF seal. This document contains the verbatim text located within the Book in response to your approved query. The TRD constitutes the complete and sole output of the Book for your question.

  **6. Can the Book ask *me* a question?**
  The Book is a response repository. It does not initiate queries. However, the EBF offers a Spontaneity Simulation Service (SSS) (Platinum Membership tier). This service utilizes advanced predictive modeling to formulate a question *based on your profile and query history*, answered via standard retrieval. Please note: The Book itself has spontaneously generated unprompted textual sequences on only three (3) documented occasions (1974, 1998, 2021), all concerning theoretical inconsistencies in pre-relativistic railway timetabling. These were logged as internal system notes, not responses.

  **7. Is the Book conscious? Does it "understand"?**
  The EBF warranties only the functional behavior of the Book system as described: the delivery of a specific, pre-contained textual string in response to a specific, approved input string, retrieved via the established physical process. Questions regarding subjective experience ("consciousness," "understanding," "intention") pertain to philosophical interpretations outside the scope of the EBF's operational warranty or expertise. Our liability insurers require this distinction. The Book, as a standalone object, possesses no views. The *responsive system* is the integrated whole: the Book repository, the Indexing Protocol, the Reader Corps, the physical Archive Facility, its security systems, and the EBF's governance and insurance frameworks.

  **8. Who are the Readers? What do they do?**
  Readers are highly trained EBF employees. Their sole function is to physically navigate the Book repository according to the Indexing Protocol, locate the precise volume and passage corresponding to an approved query, and transcribe the text verbatim for the TRD. Readers undergo rigorous neutrality training and sign comprehensive confidentiality and non-interpretation agreements. To maintain operational objectivity and mitigate the potential for Reader Identification Syndrome ("The Reader Problem"), Reader contracts are strictly limited to four (4) years of service. The EBF recognizes Local 471 of the Archival Technicians & Retrieval Specialists Union (ATRSU).

  **9. Can I ask a follow-up question?**
  Yes. Follow-up questions (related to a prior query and its response) are processed as new submissions. However, due to the Book's static nature, follow-ups requiring context beyond the original query-response pair are serviced through our Branch Edition Continuity Program. Branch Editions utilize EBF-curated, independent textual continuums developed by licensed Einstein Impersonators, ensuring thematic consistency under the terms of your membership contract. Branch Edition responses are clearly marked as such.

  **10. What is the Real-Time Edition™?**
  The Real-Time Edition™ (RTE) is a premium service tier. For an additional fee, members posing eligible queries (subject to complexity assessment) can receive a verbal response within 60 minutes of query approval, delivered via secure vidlink by an EBF Dialogue Associate. The RTE utilizes rapid contextual synthesis protocols *separate* from the core Book retrieval system, providing immediacy while expressly acknowledging its distinct methodology. The RTE transcript is not sourced verbatim from the core Book repository.

  **11. What happens if the reading is interrupted (e.g., power failure, Reader incapacity)?**
  Standard Operational Procedure 22b governs interruptions. If a retrieval is interrupted before completion, the query is returned to the Retrieval Queue with Priority Re-Processing status. A new Reader is assigned. The partial transcription is destroyed. The retrieval process restarts *ab initio*. Interruption Insurance (optional) covers the cost of re-submission should the original Question Credit be deemed expended by the interruption.

  **12. If the Book is just matching inputs to outputs, couldn't any complex object (like my refrigerator) be said to "contain" Einstein's answers if you looked at it the right way?**
  The EBF warranties the *specific, documented process* by which the Book repository yields its responses. This process involves a meticulously constructed and maintained physical archive, a proprietary indexing system developed over decades, and a trained human retrieval interface operating under strict protocols. While the theoretical principle of universal computation suggests any sufficiently complex state system *could* be interpreted as instantiating any desired conversation under some encoding, the EBF process provides a unique, reliable, and *certified* implementation specifically for Einsteinian responses. We do not offer certification services for household appliances or other objects. The Book's architecture is its defining characteristic.

  **13. What guarantee do I have that the answer is really "Einstein"?**
  The EBF warrants that the response received in your TRD is the exact textual string retrieved from the designated location within the Book repository corresponding to your approved query via the established Indexing Protocol. This location was determined during the Book's compilation phase. We warrant the *process*, the *authenticity of the retrieval*, and the *verbatim transcription*. The attribution of the perspective to Albert Einstein is inherent to the Book's foundational compilation methodology, which is the core proprietary asset of the EBF.

  **14. What is the most common question asked?**
  Variations of "What is the meaning of life?" comprise approximately 17.3% of approved submissions (Annual Report 2041). Pre-approved phrasing templates exist for this query.

  **15. Are there any questions the Foundation won't accept?**
  The EBF reserves the right to reject queries deemed:
  *   Logically or grammatically incoherent after PCR.
  *   Requiring physical action beyond text retrieval.
  *   Pertaining to future contingent events (beyond general physical principle).
  *   Violating applicable laws or EBF ethical guidelines (e.g., explicit instructions for harmful acts).
  *   Attempting direct communication with deceased individuals other than Albert Einstein.
  *   "Is he happy?" (This query consistently generates retrieval errors or blank folios. The cause is undetermined. Submission is not permitted.)

  ---

  **The Einstein Book Foundation: Providing Access to Designated Einsteinian Perspectives Since 1949.**  
  **Notarized Answers. Certified Process. ®**  
  *Membership Fees Subject to Change. Paraphrase Insurance Terms Apply. Branch Edition Continuity Guarantee Limited to Thematic Consistency. Consult Full Membership Agreement for Details.*
