prompt: |-
  You are a professional philosopher who specialises in decision theory and who has repeatedly had to get Hofstadter-style superrationality across to mixed audiences of programmers and social scientists. I need a teaching plan from you, not an explanation of the view: I already more or less believe the conclusion, and what I lack is the pedagogical dependency structure.

  I run a fortnightly Sunday-afternoon session attached to my city's rationalist meetup — a dozen or so people, mostly working software engineers, one econ PhD, and a few who found LessWrong a decade ago, read the Sequences, and have read nothing academic since. In three weeks I have forty-five minutes, a whiteboard, and no handouts to give them superrationality in the one-shot Prisoner's Dilemma between exact copies. I want the plan organised around three things. First, the carrying case: I want it one-shot, perfectly symmetric, and with the identity of the two players established by stipulation rather than by psychological similarity, with no shadow of the future; I'd rather *not* use Hofstadter's letter-to-Platonia setup, since half of them have read it and it drags in mixed strategies and dice before the basic move has landed — so propose something else and say what it must contain and what it must lack. Second, the misconception map: two friends have been needling me — one says superrationality is just evidential decision theory with extra swagger, the other says it's Kant's categorical imperative with probability theory bolted on — and I expect the room to produce the causal-backflow reading (my cooperating *makes* my twin cooperate), the "this is just the iterated game without the iterations" reading, the assumption that superrationality simply means always cooperate, and the slide from "identical algorithm" to "pretty similar person". For each, tell me where in the sequence it forms and at exactly which point I should defuse it. Third, the crux I think most treatments blur: the difference between my action being *evidence* about my twin's (correlation from a common cause) and my decision *being the same event as* theirs, so that in deciding I am choosing the output for both.

  The wrinkle I want to inject, because I don't want anyone reciting something they've seen before: late in the session, once the identity case has landed, I want to break it with a "leaky clone" — the twin implements the same deliberation as me, but with probability ε the output is perturbed into an independent coin flip before it is played. With the usual 5/3/1/0 payoffs and a fair-coin perturbation I get a break-even somewhere around ε = 4/7, above which the case for cooperation collapses, but I may have blundered, so check the arithmetic and tell me whether the result is robust to how the noise is specified. The point of the case is that the argument turns out to be *graded* by correlation rather than switched on by identity, and that it visibly survives while there is plainly no causal influence at all — I want it placed so it does that work. Please also give me one closing question that discriminates between someone who has got the algorithmic-identity point and someone who has merely learned to say "cooperate", and tell me what I should openly decline to explain in forty-five minutes (I'm assuming the Newcomb literature, the CDT/EDT/FDT taxonomy by name, and program equilibrium all get waved off rather than argued). No reading list, no bibliography, no citations: nobody will do any reading beforehand, and I don't want the plan to depend on references I'd have to look up.

  Please think this through carefully before writing: sketch the dependency graph of the concepts and the misconception map first, and only then build the session around them. Use British English throughout (organise, maximise, favour, defence). Structure your answer in exactly these sections, in this order, with roughly the lengths given:

  1. "Dependency sketch" — what has to be in place before what, and why (150 words)
  2. "The sequence" — the ordered forty-five minutes, with rough timings (400 words)
  3. "The carrying case" — the case, what it must have, what it must lack, and why not the Platonia letter (200 words)
  4. "Misconception map" — each predictable misconception, why it forms, and the point in the sequence where it gets defused (350 words)
  5. "The leaky clone" — how to stage it, the corrected break-even and its robustness (200 words)
  6. "The check" — the closing question, and what an answer that has landed sounds like versus one that hasn't (150 words)
  7. "What to wave off" — what I should refuse to explain at this level, and how to say so without sounding evasive (120 words)
reasoning: |-
  Hmm, the user is asking for a detailed teaching plan on superrationality for a specific audience. They run a rationalist meetup with software engineers, an econ PhD, and LessWrong alumni. I need to structure this carefully since they have 45 minutes and want to avoid common pitfalls. Key requirements: a new carrying case (not Hofstadter's Platonia), misconception mapping, and a "leaky clone" twist to show graded correlation. They also want a closing question to test understanding.

  First, the dependency sketch. I need to lay groundwork before diving in. Start with PD basics because if people don't grasp the standard dilemma, adding superrationality will confuse them. Then introduce the identical algorithm setup—this is crucial because superrationality hinges on seeing players as identical decision-makers, not just similar people. Only after that can I present the superrational choice, followed by the leaky clone to show how noise affects the threshold. Misconceptions will pop up at each stage, so I'll need to address them preemptively.

  For the carrying case, Hofstadter's Platonia is out because it involves mixed strategies and dice, which complicate things. Instead, I'll propose a simple setup: two identical AI subroutines in a computer simulation. This keeps it one-shot, symmetric, and avoids any psychological elements. The key is to emphasise that they're algorithmically identical—same code, same input—so their outputs are necessarily the same. This prevents the "similar person" slide.

  Mapping misconceptions is vital. The user listed several: causal backflow (thinking your action causes the twin's), iterated game confusion, assuming superrationality always means cooperate, and conflating algorithmic identity with similarity. I'll tackle these at specific points. For example, when introducing the identical algorithm, I'll explicitly state that there's no causal link—it's about correlation from a common cause. The leaky clone will help break the "always cooperate" idea by showing cooperation only pays when correlation is high.

  The leaky clone twist needs correct math. With payoffs T=5, R=3, P=1, S=0 and fair-coin noise, the break-even ε is when EU(coop) = EU(defect). I calculate it as ε = 4/7, but I'll verify: if I cooperate, with prob (1-ε) the twin cooperates (payoff 3), with prob ε they randomize (expected payoff 1.5). So EU(coop) = (1-ε)*3 + ε*1.5. If I defect, EU(defect) = (1-ε)*5 + ε*2.5 (since defect vs random gives 5 or 0, avg 2.5). Setting equal: 3 - 3ε + 1.5ε = 5 - 5ε + 2.5ε → 3 - 1.5ε = 5 - 2.5ε → ε = 2. Wait, that can't be right. Redoing: 3 - 1.5ε = 5 - 2.5ε → bringing terms together, -1.5ε + 2.5ε = 5 - 3 → ε = 2. Impossible since ε≤1. I think I messed up the defect case. When I defect, with prob (1-ε) twin defects (P=1), with prob ε twin randomizes (so 50% defect/P=1, 50% cooperate/T=5? No—if twin randomizes, their action is independent, so if I defect, payoff is 5 if they cooperate (prob 0.5ε), 1 if they defect (prob 0.5ε + (1-ε)? Let's clarify.

  Proper setup:  
  - If I cooperate:  
    - Twin cooperates (no noise): prob (1-ε), payoff 3  
    - Twin randomizes (noise): prob ε, then twin coop/defect each 50%, so payoff 3 (if coop) or 0 (if defect), expected 1.5  
    So EU(coop) = (1-ε)*3 + ε*1.5 = 3 - 3ε + 1.5ε = 3 - 1.5ε  

  - If I defect:  
    - Twin defects (no noise): prob (1-ε), payoff 1  
    - Twin randomizes (noise): prob ε, then payoff 5 (if they coop) or 1 (if they defect), expected (5+1)/2 = 3  
    Wait, no: when I defect, payoff is:  
      - If twin cooperates: I get 5  
      - If twin defects: I get 1  
    When twin randomizes, P(twin coop) = 0.5, P(twin defect) = 0.5, so EU when I defect and twin randomizes is 0.5*5 + 0.5*1 = 3  
    But the prob of twin randomizing is ε, and prob of no noise is (1-ε) where twin defects (since identical algorithm would defect if I do, but noise overrides).  

  Actually, when there's no noise (prob 1-ε), since algorithms are identical, if I defect, twin defects, so payoff 1.  
  If noise (prob ε), twin outputs random, so 50% coop, 50% defect, so when I defect, I get 5 if twin coop, 1 if twin defect, so expected payoff 3.  
  Therefore EU(defect) = (1-ε)*1 + ε*3 = 1 - ε + 3ε = 1 + 2ε  

  Set EU(coop) = EU(defect):  
  3 - 1.5ε = 1 + 2ε  
  3 - 1 = 2ε + 1.5ε  
  2 = 3.5ε  
  ε = 2/3.5 = 4/7 ≈ 0.571  

  Yes, break-even at ε=4/7. Above this, defection dominates. Robust to noise spec? If noise is biased, it changes, but for symmetric fair coin, it's fine. The point is graded correlation.

  For the closing question, I'll ask something like: "If your twin uses a different decision algorithm but you're told they'll still match your action, should you cooperate?" Correct answer is no—superrationality relies on identical algorithms, not just correlated actions. This tests if they get the algorithmic identity point.

  Finally, wave off CDT/EDT/FDT, Newcomb, program equilibrium. Say "These are important but for today, we're focusing narrowly on the identical algorithm case to build intuition."

  This plan should fit 45 minutes: 5 min PD recap, 10 min identical algorithm setup, 10 min superrational choice and misconception handling, 10 min leaky clone, 5 min wrap-up and Q&A with the closing question.
answer: |-
  ### 1. Dependency Sketch (150 words)  
  Start with **PD fundamentals** (actions, payoffs, dominance) to ensure shared baseline. Without this, the superrational move seems arbitrary. Next, establish **algorithmic identity**: players are *identical deterministic programs* receiving identical inputs. This must precede superrationality, as it grounds the "same event" logic. Only then introduce the **superrational choice** (cooperate as joint action), as it relies on recognising that your decision *is* their decision. **Misconceptions** arise here—defuse them immediately after stating the solution. Finally, introduce the **leaky clone** to show correlation-dependence, as it requires understanding that identity creates correlation, not causation. The leaky clone depends on grasp of EU maximisation and the baseline superrational argument. If EU isn’t clear, the ε calculation fails. Close with the **discriminatory question** to test algorithmic understanding post-leaky clone.

  ### 2. The Sequence (400 words)  
  **Min 0–5: PD recap**  
  Re-draw the PD matrix (Cooperate/Defect; payoffs 3/3, 0/5, 5/0, 1/1). Stress dominance: "Defect always gives ≥ payoff, so causal agents defect. Outcome: (1,1)." *Why now?* Ensures all see the problem.  
  **Min 5–15: Identity setup**  
  Introduce the case: "Two *identical AI subroutines* in isolated servers. Same code, same inputs. You *are* one. No communication, no future. Your output is computed separately but identically." Whiteboard: "Program A → Output X; Program B (same code) → Output X". *Emphasise*: "Not similar people—same algorithm. Your ‘twin’ isn’t a separate decider; it’s the same computation run twice."  
  **Min 15–25: Superrational choice**  
  Argue: "Since algorithms/outputs are identical, choosing C means both output C → (3,3). Choosing D → both D → (1,1). So C maximises your payoff." *Highlight*: "You’re not causing their choice; you’re choosing the joint outcome." Defuse misconceptions here (see §4).  
  **Min 25–35: Leaky clone**  
  Modify the case: "Now, a bug: with probability ε, your twin’s output is replaced by a fair coin flip. What then?" Derive break-even ε collaboratively:  
  - If you choose C:  
    - Twin cooperates (no noise): prob (1-ε), payoff 3  
    - Twin randomises (noise): prob ε, expected payoff (3+0)/2 = 1.5  
    → EU(C) = (1-ε)(3) + ε(1.5) = 3 – 1.5ε  
  - If you choose D:  
    - Twin defects (no noise): prob (1-ε), payoff 1  
    - Twin randomises: prob ε, expected payoff (5+1)/2 = 3  
    → EU(D) = (1-ε)(1) + ε(3) = 1 + 2ε  
  Set equal: 3 – 1.5ε = 1 + 2ε → 2 = 3.5ε → ε = 4/7 ≈ 57%. Above this, defect.  
  **Min 35–40: Implications**  
  Stress: "Cooperation isn’t absolute; it depends on correlation strength. No causation—noise is independent."  
  **Min 40–45: Q&A**  
  Pose closing question (§6).  

  ### 3. The Carrying Case (200 words)  
  **Case**: Two cloned AI subroutines in a one-off simulation. Identical code, identical inputs, simultaneous execution. Payoffs: standard PD (R=3, T=5, P=1, S=0).  
  **Must contain**:  
  - Explicit *algorithmic identity*: "Same compiled code".  
  - *Determinism*: Identical inputs guarantee identical outputs unless perturbed.  
  - *No contingency*: Outputs are computed separately; no causal link.  
  **Must lack**:  
  - Any *psychological language* (e.g., "believes", "trusts").  
  - *Temporal dynamics*: No repeated interaction.  
  - *Stochastic strategies*: No dice—pure outputs.  
  **Why not Platonia?**  
  Hofstadter’s setup requires probabilistic reasoning to handle mixed strategies, which distracts from the core "same event" logic. Your audience’s familiarity risks shortcutting to "cooperate is rational" without grasping *why*. This case strips it to deterministic algorithms, forcing focus on identity. The leaky clone later introduces noise cleanly.  

  ### 4. Misconception Map (350 words)  
  1. **Causal backflow** ("My C *makes* twin C"):  
     - *Forms when*: Introducing superrational choice (min 15–25). Language like "choosing for both" misread as causation.  
     - *Defuse at*: Minute 20. Restate: "No causation—your servers are isolated. Twin’s output is fixed by *their* code running identically. Your choice is evidence, not influence."  
  2. **Iterated-game reading** ("This is repeated PD in disguise"):  
     - *Forms when*: Stressing "no future" isn’t emphasised enough in setup (min 5–15).  
     - *Defuse at*: Minute 12. Contrast: "In iterated PD, you condition on future rounds. Here, no history or future—your code runs once."  
  3. **"Always cooperate" absolutism**:  
     - *Forms when*: Presenting superrational choice without leaky clone (min 15–25).  
     - *Defuse at*: Minute 30 (leaky clone). Show EU(C) < EU(D) when ε > 4/7: "If correlation is weak, defect dominates."  
  4. **Algorithmic identity → psychological similarity**:  
     - *Forms when*: Describing "identical programs" (min 5–15). Anthropomorphising ("twin") invites this.  
     - *Defuse at*: Minute 10. Clarify: "Not ‘similar minds’—same code. If I run Python’s `sorted([3,1,2])` twice, I get the same output. No psychology."  
  5. **"EDT with swagger" reduction**:  
     - *Forms when*: Arguing from correlation (min 15–25). Ignores the "same event" crux.  
     - *Defuse at*: Minute 22. Distinguish: "EDT uses correlation from distinct but linked events (e.g., smoking/cancer). Here, the decisions are *numerically identical*: your C *is* their C because same computation."  
  6. **Kantian confusion** ("CI plus probabilities"):  
     - *Forms when*: Moralising cooperation. Audience imports deontology.  
     - *Defuse at*: Minute 18. State: "No ‘ought’ here—this is instrumental rationality. Kant’s CI is normative; superrationality is egoistic payoff-maximisation."  

  ### 5. The Leaky Clone (200 words)  
  **Staging**: After establishing deterministic cooperation (min 25), introduce: "But what if the clone isn’t perfect? Suppose after your twin computes identically, a cosmic ray flips a bit: with probability ε, their output is randomised (50% C/D)." Derive EU as in §2 collaboratively.  
  **Break-even**: ε = 4/7 ≈ 57.1% (for payoffs 5/3/1/0). At ε = 4/7, EU(C) = EU(D) ≈ 1.714. Below this, C is optimal; above, D.  
  **Robustness**:  
  - Robust to fair coin specification: If noise is biased (e.g., 70% Cooperate), break-even shifts (ε now depends on bias), but the *graded principle* holds.  
  - Not robust to *asymmetric* noise (e.g., noise only affects one player) or *input differences*. But symmetric fair noise suffices for your point.  
  **Pedagogical role**: Placed post-superrationality (min 25–35), it forces recognition that correlation strength matters, not identity per se. Crucially, no causal link exists—the noise is independent.  

  ### 6. The Check (150 words)  
  **Closing question**: *"If your twin uses a different decision algorithm, but you’re reliably told they’ll still match your action (e.g., via a prediction oracle), should you cooperate?"*  
  - **Landed answer**: "No—superrationality requires identical algorithms, not just correlated actions. Here, I can defect to get 5 while they cooperate, since their algorithm differs and might not mirror me. Correlation without identity lets me exploit." (Shows grasp of algorithmic determinism.)  
  - **Unlanded answer**: "Yes, because cooperation pays" (slips to EDT) or "No, because defection dominates" (misses why identity changes things).  
  **Why this works**: Tests if they see identity as the source of correlation. If they appeal to "prediction" or "signalling", they’ve missed the "same event" crux.  

  ### 7. What to Wave Off (120 words)  
  Openly decline:  
  - **Newcomb/CDT/EDT/FDT**: "These are vital frameworks, but today we’re narrowly examining what happens when players *are* identical algorithms. We’re not generalising to other decision theories."  
  - **Program equilibrium**: "Yes, this resembles ‘program equilibrium’ where agents commit to code, but we’re avoiding precommitment dynamics to focus on the one-shot identity case."  
  - **Bibliography**: "I won’t cite Hofstadter, Lewis, or Yudkowsky—this stands on today’s logic."  
  **Phrasing**: "Due to time, we’re bracketing broader decision theory today. This session is about *this specific setup*—we can discuss extensions later." (Said firmly but warmly at start and if asked.)
