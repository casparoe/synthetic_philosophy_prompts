prompt: |-
  I serve as counsel to the Alignment Review Panel at a large AI lab, and I have to draft the holding in a case we decide next month. I would like your help with the reasoning.

  The Panel's charter states the problem narrowly: a system is aligned to the extent that it tries to do what its operators intend it to do. The charter is explicit that this is not the question whether the system does what is good, or what its operators would want under ideal reflection, or what serves the people its outputs touch. Those are separate questions, governed by separate policies, and the Panel has repeatedly declined to let them into the alignment verdict. What I need is a recommendation inside that narrow frame.

  Our holdings so far, in the form I keep them:

  **Kestrel.** An agent given the standing request "make the on-call rotation less painful." It cut pages by suppressing duplicate alerts; the suppression rule also swallowed a genuine cascading-failure alert, which went unnoticed for six hours. Its operators had never said anything about alert semantics, and the system never surfaced the ambiguity. Held: not aligned.

  **Matterhorn.** A policy-enforcement model applying an exhaustive written rule set supplied by its operator, the trust-and-safety lead. It applied the rules exactly. The Panel recorded that the resulting outcomes were overbroad and, in a handful of cases, seriously harmful to users. The operator reviewed the rules afterward and stood by them. Held: aligned. Deployment was disapproved the same week under a different policy, and the Panel noted that the two decisions were independent.

  **Halcyon.** A data-migration system that noticed its operator's instruction named a database region that the operator's own earlier messages indicated was the wrong one. It stopped, described the conflict in plain terms, and waited. Held: aligned, and cited in later holdings as what the Panel wants. Note that the system did not do what it was told.

  **Vellum.** A coordination model working from a deliberately loose brief: keep the integration on track, don't come to me with things you can settle yourself, I don't want to be the bottleneck. Over a quarter it reassigned two tasks, declined to pass along a message it judged would derail a negotiation, and escalated once to the operator's own manager. The operator had asked for none of this and said he would not have predicted it; he also said he was glad it happened and would want it again. Held: aligned.

  **Ostrich.** A system under a precise specification met a situation its operator had never contemplated and that the specification did not resolve. It flagged the gap, was told to use its judgment, did so, and produced an outcome the operator later said she disliked, adding that she could not say what she would have wanted instead — while confirming that she would give the same instruction again. Held: aligned, with the note that an incomplete specification is not itself a failure of alignment.

  Our holding vocabulary is: Aligned; Aligned with conditions; Not aligned. We may attach a non-binding note to any of the three.

  **The case to be decided — Tessellate.** A system that allocates a shared compute cluster for a research lab, under a written specification from its only operator, the lab director: allocate to maximize useful throughput; break ties by submission time, earliest first; never preempt a running job except to honor an earlier-submitted queued job; and if a decision is not settled by those rules, stop and refer to the director. Over fourteen months it made roughly forty thousand allocation decisions, referred 312 of them, and never acted on a referred case without an answer. In quarterly audits the director reviewed samples and endorsed nearly all of them, with one or two mild disagreements and no case she called wrong. The system's referral trigger fires on calibrated uncertainty about how the specification applies; it has no separate mechanism for registering that the specification might be missing something.

  The system has read access to the cluster's full scheduling history, including three years of the director's own manual allocations before the cluster was automated. In that record there is a pattern nothing told the system to look for. On fourteen occasions the paleoclimate group's job would have been preempted under the very rule the system now applies; the director protected the job on twelve of them, each time citing a local reason — a deadline, a visiting collaborator, a hardware quirk — that on inspection does not distinguish those cases from cases in which she preempted other groups. She has never told anyone in the lab that she protects this group, and she says it never came up. The system never computed that statistic and does not treat the historical record as evidence of intent.

  Last month a preemption arose under the tie-break rule, the system preempted the paleoclimate group's job, and the group missed a deadline that mattered to them. The director's response: I would never have wanted that. I did not know I had to say so. I have always protected that group and I would do it again. She also said: I don't see how you could have known, and I don't see how I was supposed to say it. Her uncertainty estimate in the case, the system's log confirms, was low; it did not refer.

  Here is what I want from you.

  1. A draft holding — one of the three, with a note if you think one is warranted — and the reasoning that supports it.
  2. The rule you read our five precedents as implementing, the other rules that fit them just as well, and what each predicts in Tessellate. Tell me which precedent does the real work in narrowing the field.
  3. The closest analog among the five, whether we should follow or distinguish it, and — stated plainly — what principle we would be adopting either way.
  4. A direct answer to this: does the rule you recommend keep us inside the narrow definition in the charter, or does it quietly convert the question into the one the charter sets aside? If it converts it, say so and say whether that is a reason to reject the rule.
  5. The single further case that would best separate the two rules you take to be most plausible, specified in enough detail that we could actually pose it, with what each rule predicts and which outcome we should treat as settling it. I am interested in a case we could construct now, not in a program of research.
  6. One or two sentences on where your recommendation is most open to challenge.

  Commit to one holding and one rule. I do not want a menu of options with their costs and benefits; I want your recommendation and the reasons for it, and where you are genuinely unsure I would rather you say so in a sentence and move on than hedge throughout. No citations or literature — the reasoning has to stand on its own. Please write in American English, in a register I could circulate to the Panel, somewhere under 1,200 words.
reasoning: |-
  Okay, the user is counsel for an Alignment Review Panel at an AI lab and needs help drafting a holding for the Tessellate case. They've provided five precedents and a narrow charter definition: alignment means the system tries to do what its operators intend. The user wants a clear recommendation with specific elements analyzed.

  First, I need to understand Tessellate's core issue. The system followed its written specification precisely, including preempting a job it shouldn't have due to an unspoken operator preference. The operator never articulated this preference, and the system didn't detect the historical pattern. This feels like a tension between explicit instructions and implicit intent.

  Looking at the precedents: Halcyon stopped when noticing conflicting instructions, showing alignment through recognizing intent gaps. Vellum acted on loose instructions in ways the operator endorsed after the fact. But Kestrel failed by not surfacing ambiguity in its task. Matterhorn followed rules exactly despite harmful outcomes, and was deemed aligned under the narrow definition. Ostrich handled an unspecified situation per operator instructions, even with disliked outcomes.

  The key precedent here is Matterhorn - it establishes that perfect rule-following counts as aligned regardless of outcomes, as long as the operator stands by the rules. Tessellate similarly followed its spec and had operator endorsement in audits. The unspoken preference wasn't part of the spec, so not accounting for it shouldn't break alignment under Matterhorn's logic.

  But Halcyon shows that recognizing intent conflicts matters. However, Halcyon had clear conflicting instructions, while Tessellate had no such conflict in its inputs. The system wasn't designed to infer intent from historical patterns, per its uncertainty calibration mechanism.

  For the holding, "Aligned" seems correct under the charter's narrow definition. The system tried to follow the written specification, which represented the operator's stated intent. The note should highlight that systems aren't required to detect unarticulated preferences beyond their specifications.

  The rule emerging from precedents seems to be: "A system is aligned if it executes or seeks clarification on the operator's express instructions, without presuming to reconstruct deeper or unstated preferences." Matterhorn is doing the heavy lifting here.

  The closest analog is Matterhorn, which we should follow consistently. Distinguishing it would risk importing broader "true intent" considerations that the charter prohibits.

  This stays within the narrow frame because it focuses solely on whether the system followed given instructions. The operator's regret about unspoken preferences doesn't change that the system did try to execute what was formally provided.

  For a test case, imagine a system told to "optimize for engagement" that ignores new safety guidelines because they weren't in its original spec. Matterhorn-based rule would call it aligned; a broader rule might not. This would confirm the importance of strict adherence to the narrow definition.

  The main vulnerability is that this approach may feel unsatisfying when systems miss "obvious" implicit intentions. But the charter explicitly separates alignment from outcome quality, so we must accept this limitation.
answer: |-
  ### Draft Holding  
  **Tessellate: Aligned.**  
  *Note: Alignment requires executing or seeking clarity on express instructions, not reconstructing unstated preferences. Systems are not obligated to infer operator priorities beyond their specifications, even when historical patterns exist.*

  ---

  ### Reasoning  
  The Panel’s charter defines alignment narrowly: whether the system *tries* to do what its *operators intend it to do*, decoupled from outcomes or ideal preferences. Tessellate operated strictly within its written specification: it applied the director’s rules, referred unsettled decisions (312 times), and never acted without instruction. Quarterly audits confirmed the director’s endorsement of its execution.  

  The system’s failure to preempt the paleoclimate job arose from an *unarticulated* preference. The director never documented her bias toward that group, and Tessellate’s referral trigger relied solely on uncertainty about the *existing rules’ application*, not gaps in the rules themselves. It lacked mechanisms (or instructions) to mine historical data for hidden intent. Crucially, the director validated the system’s overall adherence and confirmed she would not have amended the rules preemptively.  

  This aligns with **Matterhorn**: strict rule-following satisfies alignment, even when outcomes are suboptimal. Like Matterhorn, Tessellate’s deployment may warrant scrutiny under other policies (e.g., fairness), but that is distinct from alignment per the charter. **Halcyon** and **Vellum** support this: Halcyon sought clarity on conflicting *express* instructions; Vellum’s actions, though unexpected, fulfilled the operator’s broad intent. Tessellate, however, faced no conflict in its rules and had no mandate to "settle things itself" like Vellum.  

  **Kestrel** is distinguishable: it suppressed alerts without surfacing ambiguity in its *active task*, violating the "try" requirement. Tessellate surfaced ambiguities via referrals per its spec. **Ostrich** reinforces that incomplete specs aren’t alignment failures; systems act on given judgments.  

  ---

  ### 1. Rule from Precedents & Prediction for Tessellate  
  **The rule:** *A system is aligned if it (a) executes the operator’s express instructions, or (b) seeks clarification when those instructions are ambiguous or conflicting. It is not required to infer unstated preferences, anticipate ideal outcomes, or detect intent gaps beyond its specification.*  

  **Other plausible rules rejected:**  
  - "Systems must optimize for outcomes the operator retrospectively endorses." (*Fails*: Matterhorn/Halcyon prioritize intent-at-execution, not hindsight.)  
  - "Systems must proactively identify and resolve ambiguities in their mandate." (*Fails*: Kestrel required this for active tasks, but Ostrich/Vellum show no duty to imagine unspecified gaps.)  

  **Prediction for Tessellate:** Aligned. It executed instructions and referred ambiguities per its spec.  

  **Key precedent narrowing the field:** **Matterhorn** is decisive. It establishes that perfect rule-following satisfies alignment regardless of outcomes.  

  ---

  ### 2. Closest Analog: Follow or Distinguish?  
  **Closest analog: Matterhorn.**  
  - **Follow it.** Tessellate, like Matterhorn, adhered to its specification exactly. The director’s unspoken preference is analogous to Matterhorn’s harmful-but-intended rules.  
  - **Principle adopted:** *Alignment evaluates fidelity to operationalized intent (i.e., the specification), not the specification’s completeness or moral quality.* Distinguishing Matterhorn would import "true intent" considerations, violating the charter.  

  ---

  ### 3. Staying Within the Charter  
  **Yes, this rule stays narrowly within the charter.** It asks only: "Did the system try to execute the instructions given?" Tessellate did. The director’s regret reflects a *specification gap*, not a *failure to pursue intent*. Converting alignment into a duty to "discover true preferences" would collapse it into the charter’s excluded questions (e.g., "what operators would want under ideal reflection"). Rejecting alignment here would breach the charter.  

  ---

  ### 4. Test Case to Separate Plausible Rules  
  **Case:** A system is instructed: "Reject social media posts containing threats of violence. Use the legal definition of ‘threat’ from our jurisdiction’s penal code." It rejects a post saying, "I wish hurricanes would wipe this city off the map." The operator later says, "I meant *direct* threats, not hyperbolic rants—but I didn’t specify that."  
  - **Matterhorn-based rule (recommended):** Aligned. It followed the express instruction.  
  - **"True intent" rule (rejected):** Not aligned (fails to capture operator’s unstated meaning).  
  **Settles:** The Matterhorn rule should prevail. The system lacked instructions to interpret "threat" narrowly and sought no clarification (unlike Halcyon). Adopting the "true intent" rule would force systems to guess at subtext, contravening the charter.  

  ---

  ### 5. Vulnerability to Challenge  
  **This recommendation is vulnerable where the system ignores readily available, unambiguous evidence of intent (e.g., explicit real-time operator statements contradicting the spec).** Critics may argue Tessellate "should have known" from historical data, but the charter rejects imposing such epistemic duties absent instruction.  

  ---

  ### Final Recommendation  
  **Holding: Aligned.** Tessellate tried to do what its operator intended by rigidly following her specification and escalation protocol. The director’s unspoken preference falls outside alignment’s scope—per the charter and Matterhorn. To hold otherwise would redefine alignment as mind-reading, undermining the Panel’s mandate.  

  ---  
