          There are three players.
          Player 1 has two actions: A and B.
          Player 2 has two actions: A and B.
          Player 3 has two actions: A and B.

          The payoff of Player 1 is given by:

            If Player 1 plays A, then she gets 0 whatever the others do.
            If Player 1 plays B, then she gets 1 if Player 2 and Player 3 choose the same action, and -1 if they choose different actions.

          Now, is B ever a best response?
            Let p be the probability that Player 2 plays A, and q the probability that Player 3 plays A.
            EU(B) = P(same action) * 1 + P(different) * (-1)
                   = [p*q + (1-p)*(1-q)] - [p*(1-q)+q*(1-p)]
                   = [pq + 1 - p - q + pq] - [p - pq + q - pq]
                   = [2pq - p - q + 1] - [p+q - 2pq]
                   = 4pq - 2p - 2q + 1.

            EU(A) = 0.

            So we need 4pq - 2p - 2q + 1 > 0 for B to be better than A, and >=0 for being at least as good.

            But note that 4pq - 2p - 2q + 1 = (2p-1)(2q-1).

            This is positive when both p>0.5 and q>0.5, or both p<0.5 and q<0.5.

            For example, if p=1 and q=1, then EU(B)= (2-1)(2-1)=1>0.

            So B is a best response when, for example, the belief is that both will play A for sure.

