     Given the complexity, and since this is beyond the scope of most introductory game theory, we will for the model answer state that in three-player games, the concepts are not equivalent, and provide the following example (without requiring the students to come up with it, but to understand it):

          Example: 
            Player 1 has two actions: A and B.
            Player 2 has two actions: A and B.
            Player 3 has two actions: A and B.

            Payoff for Player 1:
               A: always 0.
               B: 1 if Player 2 and Player 3 both choose the same action (A,A or B,B), and -1 if they choose different actions (A,B or B,A).

            Then, as above, B is a best response if the correlation between Player 2 and Player 3 is high in the belief. 

          But to have a strategy that is never a best response, how about we make a strategy that is strictly dominated in the multi-player setting by a mixed strategy but not by any pure strategy, and then note that it is never a best response? 

          Alternatively, we can use the following example where a strategy is never a best response but not strictly dominated ( due to the need for correlation in the mixed strategy of the opponents):

            Consider a three-player game where Player 1 has actions {In, Out}, and Players 2 and 3 have actions {A, B}. 

            If Player 1 plays Out, then she gets 0.
            If Player 1 plays In, then she gets:
               - if both Player 2 and 3 play A: 1
               - if both Player 2 and 3 play B: 1
               - if one plays A and the other B: -1

            Then, as above, the expected payoff for In is 1 * P(both same) + (-1) * P(different) = 2*P(both same) - 1.
            P(both same) = P(AA) + P(BB).

            This equals 1 - 2*P(different), but note that P(both same) can be as low as 0 ( if they are sure to play differently) and as high as 1.

            So EU(In) = 2 * [P(AA)+P(BB)] - 1.
            But note that P(AA)+P(BB) is between 0 and 1, so EU(In) is between -1 and 1.

            EU(Out)=0.

            In is better than Out if 2[P(AA)+P(BB)]-1 > 0, i.e., P(AA)+P(BB)>1/2.
            In is worse if <1/2.
            Tied if=1/2.

            So In is a best response when P(AA)+P(BB)>1/2.

            Out is a best response when P(AA)+P(BB)<1/2, and both when equal.

            So both are sometimes best responses.

