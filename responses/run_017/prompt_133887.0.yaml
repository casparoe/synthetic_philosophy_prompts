answer: |-
  ### Question: Iterated Elimination of Strictly Dominated Strategies  
  *For reporters: This problem set covers game-theoretic reasoning about strategic decisions. You have 45 minutes. Total marks: 25. Use expected-value calculations where needed.*  

  #### Context  
  Three competing news outlets, **Outlet 1**, **Outlet 2**, and **Outlet 3**, are deciding whether to run high-risk investigative stories. Each outlet cares about its *impact* (scored numerically) and wants to avoid being "scooped" (outperformed) by others. Decisions are made simultaneously.  

  ---

  #### Part 1: Constructing a Payoff Matrix (10 marks)  
  Consider a simplified scenario with **Outlet 1** (row player) and **Outlet 2** (column player). Each can adopt one of three strategies:  
  - **Blitz**: Rush to publish a story immediately (high risk/reward).  
  - **Delay**: Publish cautiously after fact-checking.  
  - **Pass**: Avoid the story entirely.  

  **Build a 3×3 payoff matrix** for Outlet 1 (Outlet 2’s payoffs can be arbitrary but must be filled in). Ensure that:  
  - **Pass** is **strictly dominated** by a *mixed strategy* over **Blitz** and **Delay**.  
  - **Pass** is **not strictly dominated** by **Blitz** alone or **Delay** alone.  
  *Clearly label all payoffs and strategies.*  

  #### Part 2: Order of Elimination (5 marks)  
  In a 2-player game like yours from Part 1, does the **order** in which strictly dominated strategies are eliminated (using mixed strategies as dominators) affect the final set of surviving strategy profiles? State "yes" or "no," then:  
  - If **no**, briefly explain why (1–2 sentences).  
  - If **yes**, provide a **counterexample matrix** (no explanation needed).  

  #### Part 3: Best Responses vs. Strict Dominance (10 marks)  
  In game theory, two concepts describe "irrational" strategies:  
  - **A**: A strategy that is *never a best response* to any belief about opponents’ play.  
  - **B**: A strategy that is *strictly dominated* by a mixed strategy.  

  Answer the following:  
  (a) In a **2-player game**, are **A** and **B** equivalent? State "yes" or "no," and support your answer **using your matrix from Part 1**.  
  (b) In a **3-player game** (e.g., adding Outlet 3), does the equivalence hold? State "yes" or "no," and provide a **verbal example or intuition** for your answer.  

  ---

  ### Model Answer (≈750 words)  
  #### Part 1: Payoff Matrix  
  Below is a valid payoff matrix (Outlet 1’s payoffs first; Outlet 2’s arbitrary). **Pass** is strictly dominated by a mixed strategy over **Blitz** and **Delay**, but not by either pure strategy:  

  | Outlet 1 \ Outlet 2 | Blitz | Delay | Pass |  
  |----------------------|-------|-------|------|  
  | **Blitz**            | 5, 0  | 0, 0  | 3, 0 |  
  | **Delay**            | 0, 0  | 5, 0  | 3, 0 |  
  | **Pass**             | 1, 0  | 1, 0  | 1, 0 |  

  **Why this works**:  
  - **Pass** is not strictly dominated by **Blitz**: If Outlet 2 plays **Delay**, **Pass** (payoff 1) > **Blitz** (payoff 0).  
  - **Pass** is not strictly dominated by **Delay**: If Outlet 2 plays **Blitz**, **Pass** (1) > **Delay** (0).  
  - But a mixed strategy (e.g., 40% **Blitz** + 60% **Delay**) strictly dominates **Pass**:  
    - Against **Blitz**: \(0.4 \times 5 + 0.6 \times 0 = 2 > 1\)  
    - Against **Delay**: \(0.4 \times 0 + 0.6 \times 5 = 3 > 1\)  
    - Against **Pass**: \(0.4 \times 3 + 0.6 \times 3 = 3 > 1\)  

  #### Part 2: Order of Elimination  
  **No**, the order does not affect the final outcome.  
  **Explanation**: When mixed strategies are allowed, a strictly dominated strategy (via mixed dominators) is "intrinsically irrational." Eliminating it cannot reveal new dominators that depend on it, because dominating mixtures only use *surviving* strategies. Thus, every elimination step is logically independent, and the final set of surviving strategies is invariant to order.  

  #### Part 3: Best Responses vs. Strict Dominance  
  **(a) 2-player games: Yes, A and B are equivalent.**  
  - In our matrix, **Pass** (strategy **B**) is strictly dominated by a mixed strategy (from Part 1). It is also **never a best response**:  
    - If Outlet 2 plays **Blitz**, **Blitz** (payoff 5) > **Pass** (1).  
    - If Outlet 2 plays **Delay**, **Delay** (5) > **Pass** (1).  
    - If Outlet 2 plays **Pass**, **Blitz** or **Delay** (3) > **Pass** (1).  
    No belief about Outlet 2 makes **Pass** optimal.  

  **(b) 3-player games: No, the equivalence fails.**  
  **Reason**: In 3-player games, beliefs about opponents can be *correlated* (e.g., "Outlet 2 and 3 likely coordinate"). A strategy may not be a best response to any *independent* beliefs but is not strictly dominated.  
  **Example**: Suppose Outlet 1 plays **Reckless**, which gets:  
  - High payoff (2) if *both* rivals play **Pass**.  
  - Catastrophic loss (-10) otherwise.  
  **Reckless** is never a best response (beliefs where both rivals **Pass** are irrational since **Pass** is dominated). Yet it isn’t strictly dominated—no mixture of safer strategies beats it *in every profile* (e.g., against both rivals playing **Pass**, **Reckless** (2) beats safer alternatives (≤1)).  

  ---

