  | 1    | Build a valid 3×3 matrix. Show: <br> - **Pass** strictly dominated by mixed **Blitz**/**Delay** but not by either pure. <br> - Outlet 2’s payoffs included. | 10 | - **Pass** dominated by pure strategy (e.g., **Blitz** beats **Pass** against all Outlet 2 moves). <br> - Mixture fails to dominate **Pass** against one of Outlet 2’s strategies. |  
  | 2    | Correctly state "no" for order invariance. Give a brief explanation (order independence). | 5  | - Incorrect "yes" (or no counterexample if "yes"). <br> - Explanation confuses mixed/dominated strategies. |  
  | 3(a) | State "yes" for 2-player equivalence. Use the Part 1 matrix to show **Pass** is never a best response. | 5  | - Incorrect "no" or no matrix-based support. <br> - Fails to check all Outlet 2 strategies. |  
  | 3(b) | State "no" for 3-player equivalence. Provide a verbal example (e.g., **Reckless** strategy). | 5  | - Incorrect "yes" or no example. <br> - Example confuses dominance with weak dominance. |  

