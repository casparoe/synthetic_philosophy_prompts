prompt: |-
  You are a professional philosopher who works at the intersection of rational choice theory, collective action, and democratic theory, and who is comfortable doing the relevant arithmetic rather than gesturing at it: pivot probabilities under uncertainty, expected value when probabilities are very small, and the difference between a vote that flips a discrete outcome and a vote that nudges a continuous margin. Please think carefully and do genuine brainstorming before you commit: I would rather see four or five candidate principles sketched, tested, and mostly discarded than one principle defended from the start. Work step by step, and show the arithmetic where the arithmetic is what decides the case.

  I help run a small nonpartisan turnout campaign. Every election cycle I have to defend, out loud, a line about when people really ought to vote and when it is genuinely fine not to, and about whether we should keep urging people to the polls when they have not followed the campaign at all. I want something I can actually use in that argument: a principle, not a slogan. I should say up front that I have no library and no web access, so please do not give me citations, names to look up, or reading suggestions. Give me the argument itself, and where a number matters, give me the number and how you got it.

  Here are my verdicts, given as honestly as I can. Where I have a verdict and a feeling that come apart, I say so.

  1. A national election. I live in a state that has gone the same way by twenty points or more for a decade, and the polls agree. Voting costs me a two-hour round trip on a workday; there is no mail ballot. The stakes are a national government. My verdict: skipping is fine. I do not think I have done anything wrong, and I would not criticize anyone in my position who skipped. I usually do vote anyway, out of habit, but I cannot reconstruct an argument that I must.

  2. The same national election, but I live in a state the polls have at within half a point, eight million voters, and the polling place is a twenty-minute walk. My verdict: I should vote, clearly, and someone in my position who skipped for no reason has done something mildly wrong.

  3. My condo association, sixty owners, mailed ballot, five minutes to fill in. The question is a one-hundred-and-eighty-thousand-dollar roof assessment, about three thousand dollars each. My verdict: I should vote, obviously, and abstaining out of laziness really is a small moral failing.

  4. The national election again, in my safe state, but a small party is polling at four-point-six percent nationally and needs five percent to keep its public funding and its ballot line. My vote cannot affect who wins. My verdict: voting feels like it has a real point here in a way it does not in case 1, and I would encourage people to vote for that reason. I know the chance my one ballot moves a national total across a line is microscopic. I cannot explain why this feels different from case 1, but it does.

  5. A city election, forty thousand voters. Candidate A will certainly win, but the city charter sends the race to a runoff if A finishes under forty percent, and A is polling at forty-one. I would like a runoff. My verdict: I would vote and I would drive across town to do it. This feels more like case 2 than like case 1, even though I am not trying to change who wins.

  6. My brother has followed nothing this year. He cannot name a single policy difference between the candidates and would pick essentially at random. The election is competitive and he lives ten minutes from a polling place. My verdict: he has no duty to vote, and I think he has some reason to stay home; but if he does vote, I would not blame him, and I would never say so to his face. My campaign's official line is that everyone should vote, and I have started to suspect the official line is false.

  7. An election abroad that is decided in advance, where the tally is nevertheless counted and published and is read by outside observers as a measure of how much opposition there is. Voting carries a small risk of being photographed at the polling station. My verdict: I would still vote, and I would accept the risk. The published number seems to be doing real work even though the outcome is fixed.

  8. I am living abroad during a close, high-stakes election at home. Getting a ballot notarized and couriered costs about one hundred and fifty dollars and several hours. My verdict: I would do it myself, but I would not criticize anyone who did not, and I do not think the state should have made the choice that expensive.

  The pair I keep going back and forth on is 1 and 4. Both are safe-state votes in an election whose outcome my ballot will not change; the probability that my ballot crosses a national five-percent threshold cannot be larger than the probability that it breaks a tie in my own state, and is probably smaller. Yet I treat one as optional and the other as worth encouraging. My tentative principle, which I do not trust, is that I should vote just in case my expected effect on what happens — counting both the chance of flipping a result and the expected effect on the recorded margin or on any threshold the margin crosses, neither of which is ever exactly zero — exceeds the cost to me of voting. I notice that this principle seems to make case 1 mandatory too, which my verdict rejects, so I want it repaired or replaced.

  Please do the following.

  First, brainstorm at least four candidate principles that someone in this area would take seriously — an expected-value instrumentalist one, a duty-based or cooperative-scheme one, an expressive one, and at least one built around the margin or threshold channel — and say in a sentence or two what each does with cases 1 and 4.

  Second, give me the principle you would defend, stated as numbered clauses, each with the case that motivates it and the case it is there to handle. I want to be able to recite it to a volunteer.

  Third, apply it to three cases I have not given a verdict on, showing the arithmetic where it bears. (a) My city is piloting a lottery system: after the polls close, one ballot is drawn at random from all ballots cast and the winner is whichever candidate that ballot names. Does voting matter more or less under this system than under majority rule, and does your principle say something different from what my gut says? (b) A union certification vote at a workplace with eight hundred members: the union is recognized only if a majority of those voting vote yes and turnout is at least half the membership. I oppose the union, the yes side is expected to run about sixty percent among voters, and turnout is expected around forty-eight percent. Should I vote no, vote yes, or abstain, and what does your principle say about the reason to vote at all? (c) A close, high-stakes election where voting means losing a shift that costs me one hundred and ninety dollars and counts against me with my employer.

  Fourth, tell me which of my eight verdicts your principle forces me to give up. I expect at least one has to go. Also tell me what the best principle that saves all eight would look like and what it would cost me in complexity or in independent plausibility.

  Fifth, say what your principle cannot settle: the places where it hands the decision back to me and I simply have to choose, and one sentence on what our campaign should say to people who have not followed the race at all.

  Aim for about a thousand to fourteen hundred words, structured under those five headings.
reasoning: |-
  Okay, the user runs a nonpartisan turnout campaign and needs a defensible principle for when voting is obligatory versus optional. They've provided eight detailed scenarios with their intuitive verdicts, revealing tensions between instrumental impact, expressive value, and collective duty frameworks. The core challenge is reconciling cases 1 (safe state) and 4 (threshold effect) where identical micro-probabilities feel ethically distinct.

  First, I consider candidate principles. Expected-value instrumentalism (EVI) quantifies vote impact as (pivotal probability × stakes) - cost. For case 1, pivotal probability in a safe state with 8M voters is minuscule—roughly 1 in 10 million—making cost dominate. Case 4's national threshold seems even less probable since shifting a 0.4% gap nationally requires influencing tens of thousands of votes. Yet the user feels case 4 matters more—so EVI fails here unless we incorporate margin effects.

  Duty-based cooperation (DBC) frames voting as fair contribution to a collective good. It easily demands voting in competitive elections (case 2) and small groups (case 3). But it struggles with safe states (case 1) and uninformed voters (case 6)—if uninformed voting degrades the collective good, abstaining might be better. Case 4’s threshold feels cooperative, but DBC can’t explain why without ad-hoc thresholds.

  Expressive theories prioritize symbolic or identity-affirming action. They justify voting in cases 4, 5, and 7 where the act itself has meaning beyond outcomes. But they overprescribe: case 1’s habitual voting gets validated, while the user sees it as optional. They also can’t handle cost-benefit tradeoffs like case 8’s $150 expense.

  Margin-channel instrumentalism (MCI) focuses on votes as signals. Each vote nudges margins that influence future behavior or thresholds. This explains case 4 (funding threshold) and case 5 (runoff trigger) but not case 7’s protest vote—where margins signal dissent to observers despite fixed outcomes. Case 1’s margins feel irrelevant since the state isn’t close, but MCI would still assign tiny expected value.

  Hybrid Principle Construction:
  I draft a three-clause principle: 
  - (1) Vote if pivotal probability × stakes > cost (handles cases 2,3,5). 
  - (2) Vote if margin influence × signal value > cost (addresses cases 4,5,7). 
  - (3) Abstain if uninformed and voting might harm collective goals (resolves case 6).

  For case 1, pivotal probability and margin effects are negligible, so abstention is permitted. Case 4’s threshold gets covered under margin influence—even with low probability, the signal value (securing party funding) is high. The $3k roof assessment (case 3) has high stakes and decent pivotal odds (1/60 per voter), easily exceeding five-minute cost.

  Testing new cases:
  - (a) Lottery system: Voting matters more. Expected value jumps because your ballot could single-handedly decide the election. Pivotal probability is 1/N, far higher than under majority rule. 
  - (b) Union vote: Abstain. Pivotal risk is high—if turnout is exactly 400 with 240 yes votes, one no vote could block recognition by pushing turnout to 401 while keeping yes share below 50%. But if uninformed, clause 3 might suggest abstaining. 
  - (c) $190 cost: Calculate stakes. If election stakes are $10M per vote in pivotal probability (plausible for national policy), then even 1 in 10M odds give $1 expected value—below cost. Abstention justified unless margin effects compensate.

  Verdict sacrifices: 
  - Case 1’s "no blame" stance is preserved. 
  - Case 8’s "no criticism" for $150 cost must go—if stakes are high, the principle demands voting. To save all verdicts, we’d need arbitrary cost thresholds, hurting consistency.

  For uninformed voters, the principle delegates: if they suspect their vote might harm collective welfare (e.g., random voting in a nuanced race), abstaining is better. Campaign messaging should emphasize this rather than "always vote."
answer: |-
  ### First: Brainstorming Candidate Principles  
  I'll sketch four approaches, test them against cases 1 and 4, and note failures. Key arithmetic focuses on **pivotal probability** (chance your vote flips the outcome) and **margin effects** (impact on thresholds/signals). All costs are in utils (e.g., 1 util = 1 hour of time or $50, adapting to context).

  1. **Expected-Value Instrumentalism (EVI)**  
     *Principle:* Vote if (pivotal probability × stakes) + (margin effect × signal value) > cost.  
     - *Case 1:* Pivotal probability in a safe state (8M voters, 20-pt lead) is ~0 (≈1 in 10^8). Margin effect on outcome is 0. Cost (2 hours) dominates → skip. **Matches verdict.**  
     - *Case 4:* Pivotal probability for national 5% threshold is even lower (shifting national vote by 0.4% requires ≈500k votes; your vote’s effect ≈1 in 10^9). Margin effect is tiny (nudging 4.6% to 4.6000001%). Cost still dominates → skip. **Fails verdict** (you feel voting matters).  
     *Problem:* Underestimates threshold/signal value. Ignores psychological or collective goods.

  2. **Duty-Based Cooperation (DBC)**  
     *Principle:* Vote if you’re part of a cooperative scheme where (a) the outcome affects you, (b) non-participation risks free-riding, and (c) costs aren’t prohibitive.  
     - *Case 1:* Scheme is stable without you (safe outcome); cost is nontrivial → skip. **Matches verdict.**  
     - *Case 4:* You’re part of the national system; your vote could help a party cross a threshold, aiding long-term competition. Cost is low → vote. **Matches verdict.**  
     *Problem:* Arbitrary in defining "scheme" (why is national threshold "cooperative" but state win isn’t?). Fails case 7 (voting under risk) and case 6 (uninformed voters).

  3. **Expressive Theory (EXP)**  
     *Principle:* Vote if the act expresses identity/solidarity or affirms democratic norms, and cost < expressive value.  
     - *Case 1:* Expression value low (outcome fixed); cost high → skip. **Matches verdict.**  
     - *Case 4:* Expression high (supporting a cause/party survival); cost low → vote. **Matches verdict.**  
     *Problem:* Subjective and overinclusive. Can’t quantify why case 4 > case 1, or handle case 5 (runoff trigger) vs. case 2 (swing state).

  4. **Margin-Channel Instrumentalism (MCI)**  
     *Principle:* Vote if your ballot’s effect on *margins/thresholds* (not just outcomes) has expected value > cost. Margin value = (chance of crossing threshold × stakes of crossing).  
     - *Case 1:* Margin effect ~0 (no threshold; outcome fixed) → skip. **Matches verdict.**  
     - *Case 4:* Chance your vote crosses 5% is microscopic, but *if* the party loses funding by <1 vote, stakes are high (say, $10M in resources). Expected value = (1/10^9) × $10M = $0.01. Cost (2 hours ≈ $100) > value → skip. **Fails verdict** (you feel it matters).  
     *Problem:* Still microscopic expected value. Fails case 7 (published tally has value even if threshold not crossed).

  **Interim Conclusion:** No principle fully captures case 4’s intuition. EVI and MCI fail its "vote-worthy" feel; DBC/EXP lack rigor. We need a hybrid.

  ---

  ### Second: My Defended Principle  
  I propose a **Threshold-Aware Cooperative Instrumentalism** principle. Clauses:  

  1. **Vote if the expected outcome impact (pivotal or threshold) > cost.**  
     *Motivated by:* Case 2 (pivotal vote in swing state) and case 5 (runoff threshold).  
     *Handles:* Close elections where your vote has non-negligible effect.  

  2. **Vote if the cost is low AND your vote contributes to a public signal (e.g., thresholds, tallies) that influences future behavior/resources.**  
     *Motivated by:* Case 4 (party funding), case 5 (runoff threshold), case 7 (published dissent tally).  
     *Handles:* "Margin effects" with collective stakes, even when pivotal chance is near-zero.  

  3. **Abstain if uninformed AND voting might harm collective welfare (e.g., random voting in high-stakes races).**  
     *Motivated by:* Case 6 (uninformed brother).  
     *Handles:* Avoiding noise in the system.  

  4. **Ignore clauses 1–3 if costs are prohibitive (e.g., >5% income or severe risk).**  
     *Motivated by:* Case 8 ($150 cost abroad).  
     *Handles:* Real-world constraints.  

  **Recitable version for volunteers:**  
  "Vote if your ballot could swing the result or help cross a critical threshold, especially when costs are low. Vote to send a signal if it’s cheap and meaningful. Stay home if you’re truly clueless and your vote might add noise. And never bankrupt yourself to vote."  

  ---

  ### Third: New Case Applications  
  **(a) City Election with Lottery System**  
  - *Gut feeling:* Voting matters *more*—your ballot might literally decide everything.  
  - *Principle’s take:* **Vote mandatory if cost low.**  
    - Pivotal probability = 1/N (N = ballots cast). If N ≈ 10,000, chance = 1/10,000.  
    - Stakes (e.g., policy impact) ≈ $1M per voter? Expected value = $100.  
    - Cost (say, 30 minutes) ≈ $25 → $100 > $25 → vote.  
    - *Contrast with majority rule:* In a 40k-voter majority election, pivotal chance ≈ 1/√N ≈ 1/200 (if close), EV ≈ $5,000 × (1/200) = $25. Here, EV is higher ($100 > $25), so voting matters more.  

  **(b) Union Certification Vote**  
  - *Setup:* 800 members; need majority of votes AND turnout ≥50% (400 votes). Expected turnout = 48% (384 voters). Yes vote share expected = 60% (≈230 votes). You oppose union.  
  - *Principle’s take:* **Abstain or vote NO, but voting NO is better if informed.**  
    - *Pivotal analysis:* If turnout is 399, one more vote can trigger the 50% threshold (400 voters). Your vote could:  
      - Push turnout to 400.  
      - Affect outcome: if you vote NO, you need 201 NO votes to win (vs. 200 YES at 400 votes).  
    - Chance of exact pivot is low but non-trivial (if turnout uncertainty is ±2%, P(turnout=399) ≈ 5%).  
    - Stakes: $3,000 assessment (like case 3) × chance → EV ≈ 5% × $3,000 = $150.  
    - Cost (mail ballot) ≈ $1 → vote.  
    - *Informed?* If you oppose union, vote NO. If uninformed, clause 3 says abstain (avoid noise).  

  **(c) High-Cost Shift Loss ($190 + job risk)**  
  - *Principle’s take:* **Skip if costs are prohibitive (invoke clause 4).**  
    - Pivotal chance in close election: ~1 in 1 million (for 100M voters).  
    - Stakes (national policy) ≈ $10,000 per voter? EV = $0.01.  
    - Margin effects (e.g., mandate signal) add little (say, +$0.05).  
    - Total EV ≈ $0.06. Cost = $190 + reputational harm → skip.  
    - *Exception:* If stakes are existential (e.g., dictatorship risk), recalibrate.  

  ---

  ### Fourth: Verdicts to Sacrifice and Cost of Saving All  
  **My principle forces you to give up:**  
  - **Case 8 verdict ("no criticism for skipping $150 vote"):** Clause 1 (expected impact) or 2 (signal value) may demand voting if stakes are high (e.g., swing state). You can’t absolve others if the election is critical.  

  **A principle saving all eight verdicts would look like:**  
  "Vote if: (a) your vote could flip the outcome or a threshold with >0.1% probability, OR (b) costs are low AND voting expresses solidarity/aids a signal, OR (c) abstaining harms a group you belong to. Skip if costs > $100 or you’re uninformed."  
  - *Costs:*  
    - **Complexity:** Seven clauses with vague thresholds (e.g., ">0.1% probability", "harms a group").  
    - **Implausibility:** Ad hoc exemptions (e.g., case 4’s "signal" vs. case 1’s lack). Fails Occam’s Razor.  
  - *Why mine is better:* Balances rigor with clarity. Sacrificing one verdict (case 8) avoids arbitrariness.  

  ---

  ### Fifth: What the Principle Can’t Settle and Campaign Advice  
  **Unsettled decisions:**  
  - **How to value "signals":** The worth of a published tally (case 7) or threshold (case 4) is subjective. *You must decide* if a signal has collective stakes (e.g., "Does 5% funding boost democracy?").  
  - **"Prohibitive cost" threshold:** Is $150 "prohibitive"? *You must set* a line (e.g., >1% income).  
  - **Uninformed voting:** When does it "harm collective welfare"? *You must judge* if randomness distorts outcomes (e.g., in nuanced ballot measures).  

  **Campaign advice for uninformed voters:**  
  "Voting is a shared duty—but if you know nothing, your vote might add noise. Read our nonpartisan guide first; if you still can’t decide, it’s okay to sit this out. We’ll help you learn next time."  

  ---  
  *Word count: 1,380*  
  *Key insight: Voting’s value isn’t just about winning—it’s about thresholds, signals, and cooperation. But math sets hard limits; we mustn’t pretend costs don’t exist.*
