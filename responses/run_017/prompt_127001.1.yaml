prompt: |-
  I keep watching arguments about transformative AI turn on whether it is like nuclear weapons, the printing press, or the Industrial Revolution, and I want to stop asking which comparison is correct and ask instead what a comparison would have to be good for. Please write the specification.

  The purpose it has to be adequate to: guiding a decision that must be made before the evidence is in. A regulator, a funder, or a lab deciding now whether some concrete inference goes through — about how fast a capability diffuses, whether unilateral restraint is stable, whether a pause would be enforceable, whether the first movers capture durable advantages. Not forecasting, not mood-setting, not winning an argument. So the unit of adequacy is the inference an analogy licenses, not the analogy taken as a whole; an analogy can be good for one inference and worthless or actively misleading for another.

  Here are the requirements I keep half-formulating. Sharpen them, discard the ones that are not really desiderata, and add what I have missed. For each, give the case or consideration that motivates it and say what a candidate looks like when it fails it.

  1. Named inference. The analogy must state which specific inference it is carrying, and that inference must have a direction and a subject, not just a topic.
  2. The name-stripping test. Restate the lesson with every proper noun removed, as a claim about feature-values. If the inference collapses when the names go, the episode's prestige was doing the work.
  3. Incrementality. Delete the analogy; if the conclusion is unchanged, the analogy was decoration.
  4. Ex ante availability. Was the lesson recognizable to people living through the earlier transition, or only reconstructable once the outcome was known? Say what we should do with analogies whose lessons are purely retrospective.
  5. Declared axes. The analogy must say which dimensions it is mapping — tempo, whether the artifact is a tool or something with its own initiative, how concentrated control over it is, whether the change is reversible, whether diffusion feeds back into further improvement, whether contemporaries could tell a transition was underway — and which of those axes actually carry the inference, and which it is leaving dark.
  6. Defeat conditions. What would have to be true of AI for this analogy to misfire, and how would we know?
  7. The boomerang condition. Analogies get picked up by people arguing the opposite policy. What does this one license for them?

  Then: mark which requirements are non-negotiable and which are preferences of a camp — I suspect that demanding an analogy involve existential stakes, or that it be drawn from an episode that ended tolerably well, are both smuggled conclusions rather than criteria. Flag any subset of the surviving desiderata that cannot be jointly satisfied; if the list is itself a result, say so plainly. And commit to a view on which single requirement does the most work in excluding candidates, with your reason.

  Finally, a scorecard against the list — nuclear weapons, the printing press, the Industrial Revolution — one line each, no more than 150 words total. Keep the weight on the criteria; the scorecard is an appendix.

  Take a definite position throughout and defend it. Do not survey the options and leave me to choose. Under 800 words, in American English.
reasoning: |-
  Okay, the user wants a specification for evaluating analogies about transformative AI, especially for making decisions before evidence is available. They provided seven initial requirements and want them sharpened, with non-negotiables identified and a scorecard for three analogies. 

  First, I need to understand the core purpose: guiding concrete inferences (like diffusion speed or restraint stability) under uncertainty. The user explicitly rejects forecasting or mood-setting. This frames everything.

  Looking at their seven half-formed requirements:
  - Named Inference makes sense - analogies must specify what exact claim they support. This is non-negotiable because vague analogies are useless for decisions.
  - Name-Stripping Test is crucial - if the lesson depends on historical brand names rather than features, it's invalid. Non-negotiable.
  - Incrementality seems weak. If an analogy merely confirms existing reasoning, it might still have value by increasing confidence. Probably discard this.
  - Ex Ante Availability is important - retrospective-only lessons are hindsight bias. But we shouldn ban them entirely; just flag as weaker evidence. Mark as preference.
  - Declared Axes is vital - analogies must explicitly state which dimensions matter for the inference and which don't. Non-negotiable to prevent cherry-picking.
  - Defeat Conditions - essential for testing robustness. Non-negotiable.
  - Boomerang Condition - critical for spotting biased reasoning. Non-negotiable.

  The user suspects existential stakes or happy endings as smuggled conclusions - agree. These shouldn't be requirements, as they pre-judge outcomes.

  The hardest requirement to satisfy is Name-Stripping - most analogies fail when stripped of their historical prestige. This does the most work in excluding weak candidates.

  For the scorecard:
  - Nukes: Good for stability inference if slow diffusion/hardware dependency. Fails name-stripping if AI diffuses faster.
  - Printing Press: Useful for uncontrollability inference. Fails if AI has reversible outputs or centralized control.
  - Industrial Revolution: Strong for economic entrenchment inference. Fails if AI progress lacks compounding feedback loops.

  The specification must force analogies to earn their keep - no free passes for famous historical names. Every comparison must explicitly tie features to actionable inferences.
answer: |-
  Here is the specification for evaluating historical analogies as tools for concrete, pre-evidentiary decisions about transformative AI, with requirements sharpened, prioritized, and justified:

  **Non-Negotiable Requirements** (essential for valid inference):  
  1. **Named Inference**: Must specify the *exact claim* being supported (e.g., "this analogy supports unilateral restraint instability"). Motivation: Prevents vague handwaving. Failure: "AI is like nukes, so be careful" lacks a testable claim.  
  2. **Name-Stripping Test**: The core causal mechanism must hold when historical labels are removed (e.g., "artifacts with high dual-use potential and low replication barriers diffuse uncontrollably"). Motivation: Guards against prestige-based reasoning. Failure: Invoking "the Manhattan Project" to imply secrecy is feasible, ignoring unique wartime resource concentration.  
  3. **Declared Axes**: Must state *which dimensions* of the analogy are relevant (e.g., "diffusion speed," "irreversibility") and which are not (e.g., "existential stakes"). Motivation: Prevents selective cherry-picking. Failure: Using the Industrial Revolution for "entrenched inequality" while ignoring its slower tempo vs. AI.  
  4. **Defeat Conditions**: Must specify observable thresholds where the analogy breaks (e.g., "if AI capabilities diffuse in <2 years, this comparison to slow-moving industrial tech fails"). Motivation: Ensures falsifiability. Failure: Treating an analogy as universally applicable.  
  5. **Boomerang Condition**: Must acknowledge what the analogy licenses for opposing policies (e.g., "nuclear analogy supports both arms control *and* preemptive strikes"). Motivation: Exposes partisan bias. Failure: Claiming the printing press *only* supports open-source AI, ignoring its role in destabilizing wars.  

  **Preferential Requirements** (contextual, not universally mandatory):  
  - **Ex Ante Availability**: Lessons should ideally be recognizable contemporaneously (e.g., industrialists knew factories enabled mass production). Motivation: Reduces hindsight bias. *But*: Some retroactive insights are valid if mechanisms are generalizable. Treat purely retrospective analogies as weaker evidence.  
  - **Incrementality**: Discarded. Even decorative analogies can aid communication; the core test is whether the *inference* requires the analogy (covered by Named Inference).  

  **Key Tension**: Declared Axes and Defeat Conditions conflict with superficial policy appeals—forcing specificity undermines rhetorical flexibility.  
  **Highest-Impact Filter**: **Name-Stripping Test** excludes most lazy analogies by demanding mechanistic rigor over historical aura (e.g., "nukes" fails if AI capabilities are software-based).  

  ---  
  **Scorecard (≤150 words)**:  
  - **Nuclear Weapons**: Passes Named Inference (unilateral restraint stability) and Boomerang (supports both control/preemption). Fails Name-Stripping if AI diffusion is fast/cheap, and Defeat Conditions (requires hardware bottlenecks).  
  - **Printing Press**: Strong Declared Axes (information diffusion speed) and Boomerang (supports openness/censorship). Fails Defeat Conditions if AI outputs are reversible/traceable, and Name-Stripping if AI agency replaces human intermediation.  
  - **Industrial Revolution**: Ex Ante Availability strong (contemporaries noted compounding growth). Fails Declared Axes if used for "unstoppability" without specifying tempo differences, and Defeat Conditions absent capital/labor feedback loops.  

  ---  
  **Conclusion**: Analogies are tools, not truths. A valid one must isolate a *specific causal mechanism*, survive anonymization, declare its boundaries, and admit where it breaks—or it’s not fit for decision-making. The **Name-Stripping Test** is the heaviest filter, as it exposes reliance on historical branding over logic. None of the three analogies satisfy all non-negotiables universally; their utility depends *entirely* on the inference proposed and axes declared.
