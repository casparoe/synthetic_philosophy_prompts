  ### Participant Handout: The Mystery Bag Game

  **Materials Provided:**  
  - Two bags (P and Q) with marble distributions:  
    - Bag P: 30 red, 30 blue, 20 green, 20 yellow.  
    - Bag Q: 10 red, 50 blue, 30 green, 10 yellow.  
  - A sealed envelope (contents: "Heads = Bag P, Tails = Bag Q" and a coin flip result).  
  - Index cards for predictions.  

  **Rules of the Game:**  
  1. I flipped a fair coin to choose a bag (heads: P, tails: Q). The result is in the sealed envelope.  
  2. I drew one marble from the chosen bag. Its color is hidden.  
  3. We focus on two events:  
     - **Event A**: Marble is red or blue.  
     - **Signal S**: Marble is red or green.  
  4. We trade tickets that pay **$1 if A occurs** (worth $0 otherwise).  
  5. Points = quiz credit. Decline trades freely.  

  ---

  ### Instructor’s Script (Running Order)  

  #### **Step 1: Initial Setup**  
  *Show bags and sealed envelope.*  
  “We have two bags: P and Q, with marble counts as shown. I flipped a coin to pick one (envelope holds the method and result). I drew one marble from the chosen bag. We’ll trade tickets on **Event A**: the marble is red or blue. A ticket pays $1 if A occurs, $0 otherwise.”  

  #### **Step 2: Sharp Credence for A**  
  “First, what’s your fair price for this ticket? Write privately:  
  - **Bid**: Highest price you’d pay to **buy** the ticket.  
  - **Ask**: Lowest price you’d accept to **sell** it.  
  If your bid and ask match, you have a sharp credence. Discuss with neighbors if unsure.”  
  *Wait 2 minutes. Expected: Most students settle at $0.60.*  
  **Reveal**: “Many of you have $0.60. Why? Because for both bags, P(A) = 60/100 = 0.6. So you should be willing to buy at ≤$0.60 and sell at ≥$0.60.”  

  #### **Step 3: Pre-Mortem Prediction**  
  *Hand out index cards.*  
  “Before I reveal anything about S (whether the marble is red or green), predict how learning S will affect your certainty about A. Write:  
  - Will your bid-ask spread for A get **wider**, **narrower**, or **stay the same**?  
  - **Why?** (1–2 sentences).  
  Sign your name. Collect cards.”  

  #### **Step 4: Forced Choice About Information**  
  “Before revealing S, I offer a deal:  
  - **Option 1**: I tell you whether S occurred, for **free**.  
  - **Option 2**: Skip the info and **gain 1 quiz point**.  
  Raise hands for Option 1 (free info). Raise hands for Option 2 (1 point, no info).”  
  *Record votes. Then:*  
  “Regardless, I’ll reveal S to proceed. But if you chose Option 2, you miss out on a point. Why might someone refuse free info? Hold that thought.”  

  #### **Step 5: Reveal Signal S (or Not-S)**  
  *Draw a marble (hidden) from the chosen bag. Announce based on its color:*  
  - If red or green: **“S occurred: the marble is red or green.”**  
  - If blue or yellow: **“S did not occur: the marble is blue or yellow.”**  

  #### **Step 6: Updated Bid-Ask for A**  
  “Now, update your bid and ask for A. Remember: the bag is still unknown. Write your new bid and ask.”  
  *Wait 2 minutes. Then:*  
  **If S occurred**: “Your bids should be ≤$0.25, asks ≥$0.60. Why? If bag P, P(A|S) = 30/50 = 0.6. If bag Q, P(A|S) = 10/40 = 0.25. So your interval is [0.25, 0.60].”  
  **If S did not occur**: “Your bids should be ≤$0.60, asks ≥$0.833. Why? If bag P, P(A|¬S) = 30/50 = 0.6. If bag Q, P(A|¬S) = 50/60 ≈ 0.833. Interval: [0.60, 0.833].”  

  #### **Step 7: Bookie Round**  
  *Pick a student as “bookie.”*  
  “Bookie, set two prices:  
  - **Bid**: Price you’ll pay to **buy** a ticket on A.  
  - **Ask**: Price you’ll charge to **sell** a ticket.  
  Rule: You **must** set prices acceptable under *some* bag. For example:  
  - If S occurred, you might set bid = $0.45 (≤0.6 for P) and ask = $0.55 (≥0.25 for Q).  
  *Bookie announces prices (e.g., bid=$0.45, ask=$0.55 if S).*  
  “Class, trade if you want:  
  - Buy from bookie at their ask.  
  - Sell to bookie at their bid.  
  You can do one or both trades.”  
  *Students trade. Typically:*  
  - A student sells to bookie at bid (e.g., $0.45) and buys from bookie at ask (e.g., $0.55), netting a $0.10 loss.  
  - If no trades, discuss hypotheticals: “Suppose you bought at $0.55 and sold at $0.45—you lose $0.10 no matter what.”  

  ---

  ### Debrief: Mapping the Game to Theory  

  #### **Key Moments and Theory**  
  1. **Initial sharp credence (0.6)**:  
     - Unconditional P(A) = 0.6 in both bags → degenerate interval [0.6, 0.6].  
     - Jolt: Sharp credence despite ignorance of the bag.  
  2. **Pre-mortem predictions**:  
     - Most predict “wider spread” (intuition: info might increase uncertainty).  
     - Theory: **Dilation**—conditioning a set of probabilities can widen intervals.  
  3. **Refusing free information**:  
     - Why? Revealing S *costs* your sharp credence. You rationally avoid info that increases uncertainty.  
     - Maps to: **Value of information** can be negative when precision decreases.  
  4. **Updated intervals after S/¬S**:  
     - Intervals widen to [0.25, 0.60] or [0.60, 0.833].  
     - Why? Bags **agree unconditionally** on P(A)=0.6 but **disagree conditionally** on S:  
       - P dilates to 0.6, Q dilates to 0.25 (if S) or 0.833 (if ¬S).  
  5. **Bookie round**:  
     - Bookie’s prices (e.g., $0.45 bid, $0.55 ask) are inside [0.25, 0.60].  
     - **Permissive rule** (trade ok if *some* probability in set licenses it) → vulnerability to sure loss.  
     - Dutch book: Buying low and selling high locks in a loss.  
     - Contrast with **strict rule** (trade only if *all* probabilities license it): No trades would occur (spread = interval width).  

  #### **Predictable Challenges**  
  - “Why not split the difference?” A student uses midpoint pricing (e.g., $0.425 if S). Explain: This imposes a uniform prior, but we’re modeling *ignorance* (no prior).  
  - “Open the envelope!” Resist: The envelope’s role is to create ambiguity. Opening it collapses the interval (sharp prior), defeating the lesson.  
  - Sharp Bayesian objection: “I *have* a prior!” → Acknowledge: Yes, but this game models ambiguity (no prior). Dilation exposes the cost of ignorance.  

  #### **Limitations and Design Notes**  
  - **Contrived numbers?** Necessary. The effect requires:  
    - Unconditional agreement: P(A) identical in both bags.  
    - Conditional disagreement: P(A|S) differs (P=0.6, Q=0.25) and straddles 0.6. Random counts won’t work.  
  - **Can’t do**:  
    - Force Bayesians to reject priors. The game contrasts ambiguity (sets) with risk (sharp priors).  
    - “Prove” dilation is irrational. It’s a feature of imprecise models under conditioning.  
  - **Why it works**: Students *experience* uncertainty increasing post-info and see the perils of permissive trading.  

  #### **The Phenomenon: Dilation**  
  - **Name it (final 10 mins)**: “Today’s effect—sharp credence widening to an interval after conditioning—is called **dilation**. It occurs when your set of probabilities includes measures that ‘split apart’ conditional on new evidence.”  
  - **Takeaway**: When you lack a prior, information can *increase* uncertainty. This is rational if you’re cautious, but costly if you trade permissively.  

  --- 

  ### Honest Notes for Instructor  
  - **Troubleshooting**: If the marble draw doesn’t yield S or ¬S clearly, pre-select a color to reveal (but don’t admit it).  
  - **Bookie backup**: If no trades, simulate: “Suppose Alice buys at $0.55 and sells at $0.45—she loses $0.10 regardless of A or the bag.”  
  - **Core tension**: The sharp Bayesian is unrefuted but misses the point. Emphasize: This is about representing **ambiguity** (known unknowns), not risk (known probabilities).  
  - **Timing**: Steps 1–4 (15 mins), Steps 5–6 (15 mins), Step 7 (15 mins), Debrief (45 mins).  
  - **Why it’s pedagogical**: Students *see* the interval open, *feel* the cost of free info, and *get booked* on permissive trading—before labeling the math.
