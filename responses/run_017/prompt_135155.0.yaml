     Therefore, the model-risk team must audit the entire pipeline and require data on the joint behavior of the models.
answer: |-
  ### Worked Example: Sequential Hiring Pipeline Fairness

  #### Scenario Setup
  A company uses two vendor models in sequence: Model 1 (resume scorer) and Model 2 (video interview scorer). Applicants must pass Model 1 to proceed to Model 2. Each model is audited on a **shared benchmark dataset** of 10,000 applicants (5,000 from Group A, 5,000 from Group B) where all applicants have both scores. The true qualification rate is **50% for both groups** (no base-rate differences). Each model satisfies **equalized odds** (identical TPR and FPR across groups) when audited in isolation. Despite this, the sequential pipeline ("pass both stages") shows an 11-point TPR gap while maintaining equal FPR.

  #### Data Tables (Group A vs. Group B)
  **Key:**
  - **Q+**: Actually qualified (2,500 per group)  
  - **Q−**: Not qualified (2,500 per group)  
  - **Pass Stage 1 (Model 1)**: Resume screen  
  - **Pass Stage 2 (Model 2)**: Video interview  
  - **Pipeline Pass**: Passes both stages  

  ---

  **Group A (5,000 applicants)**  
  |          | Pipeline Pass (Both Stages) | Fail Pipeline | Total |
  |----------|-----------------------------|---------------|-------|
  | **Q+**   | 1,875                       | 625           | 2,500 |
  | **Q−**   | 100                         | 2,400         | 2,500 |
  - **Pipeline TPR (Q+)** = 1,875 / 2,500 = **75%**  
  - **Pipeline FPR (Q−)** = 100 / 2,500 = **4%**  

  **Group B (5,000 applicants)**  
  |          | Pipeline Pass (Both Stages) | Fail Pipeline | Total |
  |----------|-----------------------------|---------------|-------|
  | **Q+**   | 1,600                       | 900           | 2,500 |
  | **Q−**   | 100                         | 2,400         | 2,500 |
  - **Pipeline TPR (Q+)** = 1,600 / 2,500 = **64%**  
  - **Pipeline FPR (Q−)** = 100 / 2,500 = **4%**  

  **Gap:**  
  - **TPR gap** = 75% (A) − 64% (B) = **11 points**  
  - **FPR gap** = 4% − 4% = **0 points**  

  ---

  #### Verification of Individual Model Fairness (Equalized Odds)
  Audit each model **independently** on the benchmark data:

  **Model 1 (Resume Scorer):**  
  | Group | TPR (Q+) | FPR (Q−) |
  |-------|----------|----------|
  | **A** | 80%      | 20%      |
  | **B** | 80%      | 20%      |
  - **Calculation (Group A Q+):**  
    (1,875 pipeline pass + 625 fail Model 2) = 2,500 Q+ applicants.  
    Pass Model 1: 1,875 + 625 × (pass Model 1 but fail Model 2) → **80% pass rate** (marginal).  
    *Same for all subgroups—equalized odds holds.*

  **Model 2 (Video Scorer):**  
  | Group | TPR (Q+) | FPR (Q−) |
  |-------|----------|----------|
  | **A** | 80%      | 20%      |
  | **B** | 80%      | 20%      |
  - **Calculation (Group A Q+):**  
    Only applicants passing Model 1 reach Model 2.  
    TPR = Pass Model 2 given Q+ and passed Model 1 = 1,875 / (1,875 + 625) = **80%** (conditional rate matches marginal).  
    *Equalized odds holds for both groups in isolation.*

  ---

  ### Why the Pipeline Fails: Correlation of Errors
  The disparity arises because **Model 1 and Model 2 make correlated errors** for Group A’s qualified applicants (Q+), but **independent errors** for Group B:
  - **Group A (Q+):** High positive correlation in correct passes.  
    If Model 1 passes a qualified applicant, Model 2 is *more likely* to also pass (joint pass rate = 75% > 64% independent).  
  - **Group B (Q+):** Errors are independent.  
    Joint pass rate = 80% × 80% = 64% (as expected by chance).  

  **Proof via Independence:**  
  If errors were independent *within both groups*, the pipeline TPR would be:  
  - TPR_pipeline = TPR₁ × TPR₂ = 80% × 80% = **64% for both groups**.  
  - **Result:** The 11-point TPR gap collapses to **0**.  

  ---

  ### Vendor Objections and Audit Requirements
  **Vendors’ honest objection:**  
  > *"Our models individually satisfy equalized odds on your benchmark data. The pipeline disparity is due to your sequential design amplifying unobserved correlations between our models’ errors. This isn’t a fairness failure of either model—it’s a pipeline integration issue."*

  **What the audit should demand:**  
  1. **Joint error reporting:** Vendors must provide **correlation matrices** of model errors (by group and qualification status) on the benchmark data.  
  2. **Pipeline-level testing:** Audits must include **end-to-end testing** of the sequential pipeline, not just isolated models.  
  3. **Vendor collaboration:** Both vendors must share **score-level data** (not just pass/fail) to diagnose cross-model dependencies.  

  **Key takeaway:**  
  Fairness in sequential systems requires auditing **error correlations across stages**, not just marginal performance. Vendors should be contractually obligated to support joint assessments.
