prompt: |-
  You are a professional philosopher with research-level competence in metaethics, social ontology, and the theory of practical reason. Please think carefully and slowly about what follows. Before answering, spend some effort brainstorming two or three genuinely different ways of carving up the phenomenon I am about to describe, and then tell me which carving you settled on, which ones you rejected, and what each rejected carving would have predicted about cases mine does not fit. I am not looking for a label; I am looking for the joints.

  I run strategy retreats for small nonprofit organizations, and across a few hundred meetings I keep running into the same peculiar object: a consideration that is doing real work in a group's reasoning while nobody in the group actually holds it. A foundation I work with has a grantmaking rule that they will not fund an organization holding more than six months of operating reserves. The program officer who wrote it left four years ago. Every person now in the room says, when asked directly, that the rule is unmotivated or actively harmful. Yet the rule gets reaffirmed each cycle, it defeats proposals it would otherwise lose to, and it is cited in the board minutes as the reason the decision went the way it did. What is odd is that this is not straightforward deference, and it is not fear of the founder: nobody is being coerced, nobody is reputationally invested in the rule, and when I have run anonymous polls the disavowal is unanimous and the rule still survives. I see a similar thing in hospital ethics committees, where a consideration like the family will want everything done appears in the deliberation, shapes the recommendation, and is disowned by every member individually. And I see a version of it in myself: I notice that for years I acted on a consideration about what kind of career is respectable that I would have denied believing, and that continued to move me even after I had explicitly rejected it out loud.

  I have been trying to sort these into kinds and I am not sure the kinds are real: (i) heirloom rationales, inherited from someone who has left and never re-adopted; (ii) procedurally generated rationales, which appear because a template, a funder's reporting requirement, or an impact-assessment form has a slot that must be filled in and the filled slot then behaves like a reason; (iii) as-if rationales, where nobody believes the consideration but everyone cites it because citing it is strategically useful; and (iv) zombie rationales, where the evidence base has been publicly retracted and everyone knows it, but the consideration keeps its grip on the decision. I also want boundary cases settled. If a new hire inherits an heirloom rationale and genuinely endorses it, does it stop being an orphan, and if so does that suggest the phenomenon was only ever about missing endorsement? And what about a consideration that nobody in the room endorses but which happens to track a real feature of the situation that everyone is ignorant of — is that the same object, or is it just an unrecognized reason waiting to be picked up?

  Here is what I have been told so far, and why I do not think it settles it. A philosopher friend suggested agent-neutral reasons, but as I understand that notion, agent-neutral reasons are still reasons that someone has; they just apply to everyone, whereas the thing I am describing seems to belong to no one at all. She also mentioned the view that reasons can be given by states of the world rather than by anyone's desires or ends; that sounds closer, but the considerations I am describing look like they came from agents and merely outlived or outran them, and they seem to keep their force even when everyone agrees the world does not contain what the consideration says it contains. A third suggestion was that this is simply a collective or group-level reason, held by the group rather than by its members. My worry there is that the group in my cases has no procedure that could count as its endorsing the consideration either — indeed the group's own procedures, run faithfully, produce the opposite result.

  So: is there an established concept in philosophy for this, and if several established concepts come close, tell me which parts of my description each captures, where each breaks down, and which fits best. If nothing established fits, coin a term and give me a definition sharp enough to decide the boundary cases above, plus at least one case you construct yourself that my four-way taxonomy mishandles. And finally, the part I actually care about: suppose orphan rationales are real — genuinely normative, genuinely nobody's. Does that give us any grounds for thinking that reasons do not essentially need a reasoner, i.e. that a rationale can float free of any agent who has it? Or is the honest verdict the opposite: that the felt pressure of these considerations is a kind of illusion, so that my cases are evidence about how groups delude themselves rather than evidence about the metaphysics of reasons? If the answer depends on which of my four kinds we are talking about, say so, and say which kind carries the metaphysical weight. Please do not answer by pointing me at a literature — I want the carving and the argument, not a map of who has written where.
reasoning: |-
  Okay, let me start by really digging into what the user is asking. They’ve encountered a phenomenon in their work with nonprofits where certain considerations influence decisions, but no individual in the group actually endorses them. The user describes examples like an unmotivated grantmaking rule that persists despite unanimous disavowal, or a hospital ethics committee citing a family's wishes that no member believes in. Even personally, they acted on a career respectability consideration they didn't believe. They’ve tried categorizing these into heirloom, procedurally generated, as-if, and zombie rationales, but they’re unsure if these categories hold or how to handle boundary cases.

  First, I need to understand the core issue. The user isn't just looking for labels; they want to carve reality at its joints. They’ve already gotten suggestions like agent-neutral reasons, states of the world as reasons, or group-level reasons, but each falls short. Agent-neutral reasons still require someone to hold them, which isn't the case here. States of the world as reasons might apply, but the considerations seem detached from actual facts. Group-level reasons don't fit because there's no collective endorsement.

  The user’s deeper questions are metaphysical: can reasons exist without a reasoner? And are these orphan rationales evidence for that, or just illusions? They also want clarity on their taxonomy and boundary cases. Their examples show that these rationales have normative force without individual or collective endorsement, which challenges traditional views in metaethics where reasons are tied to agents' mental states or collective acceptance.

  I should brainstorm different ways to conceptualize this. First approach: structural artifacts. Here, the rationale is a residue of social structures—like bureaucratic procedures or templates. The grant rule persists because it’s embedded in forms or workflows. The force comes from the structure, not agents. But this might reduce to procedural generation, missing cases like heirlooms without current structural support.

  Second approach: collective pretense. Everyone tacitly agrees to act as if the rationale is valid for coordination or conflict avoidance. The hospital committee invokes "family wishes" to avoid tough decisions. This fits as-if rationales but struggles with anonymous polls where disavowal is unanimous yet the rule survives. If no one believes it, why does the pretense hold?

  Third approach: normative ghosts. The rationale has a life of its own, detached from its origins. This directly challenges the agent-relative view of reasons. The career respectability example shows internalized norms that persist despite rejection. This might capture the metaphysical weight, especially in heirloom and zombie cases where the original reasoner is gone or the evidence is retracted.

  Rejecting structural artifacts: it handles procedural cases but not heirlooms without current structures. Collective pretense explains strategic citing but not the internalized personal case or unanimous disavowal with persistence. Normative ghosts best explain the enduring force without believers, but risks mystification.

  Boundary cases: if a new hire endorses an heirloom, it becomes a personal reason, so the orphan status depended on missing endorsement. A consideration tracking an unknown real feature is different—it’s an unrecognized reason, not an orphan, because its force derives from the world, not social persistence.

  A test case: a retracted study's guideline persists in policy despite universal expert rejection. The user’s taxonomy might classify it as zombie, but normative ghosts explain its grip as a lingering normative residue.

  On metaphysics: orphan rationales suggest reasons can exist without current reasoners. Heirloom and zombie cases show normativity outliving its sources, supporting a non-agent-dependent view. But the procedural and as-if kinds might be reducible to structures or pretense, without metaphysical implications. The user’s personal example, where a rationale moves them despite rejection, provides the strongest evidence for normative ghosts.

  The honest verdict isn't entirely illusion. Structural artifacts and pretense explain some cases without metaphysics, but the irreducible persistence in heirlooms and zombies points to reasons having a life beyond agents. This supports a view where reasons are part of a socially embedded normative landscape, not just individual or collective states.
answer: |-
  Your phenomenon is fascinating and reveals a genuine crack in standard metaethical accounts. After careful consideration, I propose carving reality at the joint of **normative ghosts** – persistent, socially embodied patterns of practical force that outlive the agents, beliefs, or evidence that birthed them, functioning *as if* they were reasons while lacking current believers or collective endorsement. Below is my reasoning, including rejected carvings, boundary resolutions, conceptual analysis, and metaphysical implications.

  ---

  ### **Rejected Carvings and Their Shortcomings**
  1. **Structural Artifacts (Procedural Residues)**  
     *Core Idea:* The rationale persists solely due to institutional scaffolding (forms, templates, workflows).  
     *Prediction:* Removing the procedural slot (e.g., deleting the "reserves" field in grant software) should kill the rationale.  
     *Breakdown:* Fails your hospital case – no "family wishes" form exists, yet the consideration shapes decisions. Also fails your personal career case: no procedural structure exists. Overlaps with your "procedurally generated" kind but cannot explain heirlooms or zombies without active scaffolding.

  2. **Collective Pretense (Strategic Fiction)**  
     *Core Idea:* Agents jointly pretend to endorse the rationale for coordination/conflict avoidance, creating emergent "as-if" normativity.  
     *Prediction:* In truly anonymous settings (e.g., secret ballots), the rationale should lose force.  
     *Breakdown:* Contradicts your anonymous polls: disavowal is unanimous *yet the rule survives*. Also fails your personal case – no audience exists for strategic pretense. Explains "as-if" rationales but not heirlooms/zombies with unanimous rejection.

  3. **Distributed Agency (Group-Mind Lite)**  
     *Core Idea:* The group itself "holds" the reason through distributed cognition (e.g., shared workflows).  
     *Prediction:* Group procedures should reflect endorsement (e.g., minutes should show collective validation).  
     *Breakdown:* As you note, the group’s *own* procedures (if run faithfully) reject the rationale. Minutes cite it *as an external constraint*, not an endorsed value. Cannot explain zombie cases where retracted evidence is known to all.

  ---

  ### **Accepted Carving: Normative Ghosts**
  **Definition:** A *normative ghost* is a socially sustained pattern of practical force that:  
  - (a) Originated in past agency (beliefs, decisions, or evidence),  
  - (b) Persists independently of current individual belief or collective endorsement,  
  - (c) Exerts influence via institutional inertia, linguistic rituals, or habitual reasoning,  
  - (d) Functions as a *de facto* reason in deliberation (shaping outcomes, cited in justifications),  
  - (e) Lacks grounding in current desires, ends, or world-states.  

  **Boundary Resolutions:**  
  - **New hire endorses heirloom:** The ghost "dies." Its past status *was* defined by missing endorsement; once adopted, it becomes a personal reason. This confirms the phenomenon hinges on *current* orphanhood.  
  - **Unknown real feature:** *Not* a ghost. If a consideration (e.g., "funding risks") tracks an actual threat (e.g., regulatory change) unknown to all, it’s an *objective reason* – its force derives from the world, not social persistence. Ghosts derive force from their entrenchment, even when false (e.g., retracted evidence).  

  **Test Case Your Taxonomy Mishandles:**  
  - **The Phantom Precedent:** A university committee rejects a policy change because "it would set a bad precedent," citing a 1987 case. Investigation reveals:  
    - (i) The 1987 decision was overturned internally but never publicly;  
    - (ii) No member believes precedents matter here;  
    - (iii) The "precedent" slot exists only in rhetoric, not procedures.  
    *Taxonomy Breakdown:* Not heirloom (no originator), procedural (no form), as-if (no strategic gain), or zombie (evidence wasn’t retracted). *Ghost Explanation:* A linguistic ritual ("precedent") detached from its original context exerts force through repetitive citation.

  ---

  ### **Established Concepts & Why They Fall Short**  
  | Concept             | Captures                                                                 | Breaks Down                                        |  
  |---------------------|--------------------------------------------------------------------------|----------------------------------------------------|  
  | **Agent-Neutral Reasons** | Universality of force (e.g., suffering matters to all)                  | Requires *someone* to have the reason; ghosts belong to *no one*. |  
  | **World-Given Reasons**  | Independence from desires (e.g., "this cliff is dangerous")             | Ghosts persist *despite* world-states (e.g., retracted evidence). |  
  | **Group Reasons**       | Supra-individual force (e.g., "our team values transparency")           | Requires collective acceptance; ghosts lack this.  |  
  | **Institutional Facts** | Social creation (e.g., "this paper is money")                          | Institutional facts *require* collective acceptance; ghosts defy it. |  

  **Best Fit:** None fully capture it. "Normative ghosts" integrate aspects of *social ontology* (embedded in practices) and *metaethics* (freestanding normativity), but resist reduction.

  ---

  ### **Metaphysical Implications: Do Reasons Need Reasoners?**  
  **Yes, but not in the way we thought.** Your cases suggest:  
  1. **Ghosts are metaphysically lightweight:** They are not Platonic reasons or primitive normative facts. They are *social artifacts* – patterns of behavior and discourse that mimic reasons.  
  2. **Evidence against agent-dependence:** Heirloom/zombie cases show normativity outliving *all* believers. If reasons essentially required a *current* reasoner, ghosts would collapse. Their persistence suggests normativity can be "stored" in social structures (language, workflows, rituals) independent of minds.  
  3. **Not mere illusion:** The force is real (shapes decisions) but *parasitic* – ghosts "haunt" by hijacking reasoning mechanisms. Your career example is key: the internalized ghost moved you *prior to conscious rejection*, proving its non-illusory grip.  

  **Dependence on Kinds:**  
  - **Heirlooms/Zombies carry metaphysical weight:** They demonstrate normativity surviving *all* agents. Your foundation case (rule outlives creator, disavowed by all) is strongest evidence for reasons without reasoners.  
  - **Procedural/As-if rationales are deflationary:** Reducible to structures or incentives. No metaphysical surprise.  

  **The Verdict:** Ghosts reveal a **third way** between realism and illusion. They are:  
  - *Real* as social forces with measurable effects,  
  - *Illusory* as genuine reasons (they lack proper grounding),  
  - *Metaphysically significant* in showing normativity can be emergent, non-agential, and self-sustaining.  

  This suggests a **socio-historical theory of reasons**: normativity can be "deposited" in social ecosystems and persist as free-floating practical forces, even becoming reasons *for* new agents who encounter them (e.g., a new hire adopting an heirloom). Reasons need *origins* in agency, but not *ongoing* reasoners. Orphan rationales are thus *degenerate reasons* – normatively potent relics of dead agency.  

  This carving preserves the intuition that reasons must stem *from* the world or agency, while acknowledging that social reality can "bottle" normative force and release it independently. The joints lie between the *source* of normativity (past agents/world) and its *carrier* (present social structures).
