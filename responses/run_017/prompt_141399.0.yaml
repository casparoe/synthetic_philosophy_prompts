prompt: |-
  I work in human factors / patient safety at a regional air-ambulance service — rotor- and fixed-wing, about forty flight crew, a few thousand missions a year. One of my jobs is maintaining the tool we use in post-incident review: for any given fact at issue (the weather at the destination was below minima, the oxygen cylinder was reading low, the receiving hospital hadn't actually accepted the patient), the review has to land on one of three verdicts about the crew member at time t: they knew, they didn't know but should have, or they couldn't have known. That verdict feeds our just-culture matrix, so it has teeth — the first two can trigger remedial training or a competency sign-off, the third usually just changes a procedure or a display. Right now the tool is basically evidence-based invariantism with a checklist: list what was available to them at t, ask whether it was good enough. That's been fine, but our new medical director has been pushing back hard after a case where the same evidence counted as knowing on a low-stakes repositioning flight and apparently stopped counting once there was a deteriorating pediatric patient on board. She thinks — and I now half think — that the bar really should move with what was at stake for that crew member at that moment, i.e. she's asking for something like pragmatic encroachment, and the committee wants to know what we'd actually be signing up for before we write it into the handbook.

  So: give me the procedure version of that. I want the ordered questions a reviewer asks off an incident report, runnable in half an hour from what our normal reports contain, written so a flight nurse or a pilot on the panel can run it without any theory background (I did a philosophy minor about fifteen years ago and I'm the most theory-adjacent person in the room). For each step, say what counts as a sufficient answer, where the procedure hard-stops with "did not know," and where it has to hand the decision back to a person because the real issue is a values call about what our org wants to be accountable for, not a factual one. Two problems are where our informal attempts keep falling apart, and I want both handled explicitly. First: stakes the agent didn't appreciate — nobody told them the flight had upgraded to a scene call, or they had no idea the patient was deteriorating, so the stakes were objectively huge but weren't ones they possessed or believed in at the time. Second: stakes that get inflated after the fact — we run a safety briefing or issue a new protocol, and suddenly the same crew with the same evidence didn't know what they plainly did know six months earlier. My current hack for both is a "stakes firewall": the review applies the stakes attached to the role as constituted at t (the mission card, the checklist, the protocol then in force), not the stakes the individual happened to feel, and not the stakes later policy would assign. Tell me whether that hack survives being turned into actual steps, whether it quietly collapses the view back into invariantism with extra bookkeeping, or whether it's doing real work — and if you have a better fix for either problem, use yours instead and say why it beats mine. I'd also like a short version of what the document would look like if we went the other way and took the contextualist line, where what shifts is the standard in the review room rather than the stakes for the agent: my sense is that on that view the deliverable stops being a tool about the crew at all and becomes a tool about how to run the meeting, and I want to see how different those two documents really are before I bring either to the committee.

  Then run your procedure on three of our cases. (A) A daytime VFR ferry flight, no patient, where the crew's evidence about deteriorating destination weather was fairly thin but everyone would have said they knew. (B) The pediatric scene call: identical evidence about the same weather, but now there's a kid on board and a twenty-minute window. (C) The one I'm dreading, where I want your procedure to give the answer we won't like: a senior flight paramedic everybody respects, who followed the protocol exactly, who by the procedure's own lights did not know — and where writing that down means his competency sign-off lapses and we have to tell him that to his face. Please end by flagging what the procedure can't do for us: I'm guessing it can settle the knowledge verdict but not whether to sanction, and that there'll be cases where the evidence is fine but the record is too thin to run it at all. Don't give me a survey of the literature or who argued for what — no citations, no reading list; I need something I could drop into an appendix and defend to a room of pilots.
reasoning: |-
  Okay, let me approach this problem systematically. The user works in aviation medicine safety and needs a practical decision tool for post-incident knowledge assessment that incorporates pragmatic factors. I need to design something operational that fits within their 30-minute review window and avoids philosophical jargon.

  First, I should acknowledge their core challenge: moving from invariant evidence-checking to a stakes-sensitive system without creating retrospectivity or subjectivity problems. Their "stakes firewall" concept seems crucial - it anchors the assessment to institutional standards at time t rather than individual perceptions or later policy changes. That's smart because it maintains objectivity while allowing stakes to vary by mission type.

  For the procedure itself, I'll structure it as a sequential flow chart with clear decision points. The key is to make it:
  - Actionable for non-philosophers (pilots/nurses)
  - Defensible in their just-culture framework
  - Resistant to hindsight bias

  The three problem cases they provided are excellent test scenarios. For the pediatric case, the procedure should clearly show why identical evidence yields different knowledge verdicts when mission stakes change. The "dreaded case" with the respected paramedic will reveal whether the system can deliver uncomfortable but necessary conclusions.

  I'm considering building the procedure around two axes: evidence adequacy (factual) and warranted action (normative). This keeps the "couldn't have known" verdict operational by asking whether institutional systems failed rather than individual cognition. The stakes firewall becomes operationalized through predefined mission classifications - no need for reviewers to make judgment calls about perceived stakes.

  For the contextualism alternative, I'll draft a contrastive version focused on review-room standards rather than agent-situated stakes. The difference is real: one assesses the crew's condition at t, the other assesses the review panel's standards. The former better serves their just-culture goals.

  The limitations section should be brutally honest about what the tool can't solve - like sanction decisions or evidence gaps. That transparency will build credibility with the flight crews who'll use it.
answer: |-
  Here's a procedural implementation of stakes-sensitive knowledge assessment ("pragmatic encroachment") designed for your operational context, with explicit handling of your two problem cases. It uses your "stakes firewall" concept and prioritizes auditable decisions over philosophical nuance.

  **Post-Incident Knowledge Assessment Procedure (Stakes-Sensitive Model)**

  **Core Principle:** Whether a crew member *knew* a critical fact depends on both (1) the **evidence available to them** at time *t* and (2) the **institutionally-defined stakes** attached to their role and mission profile **at time *t***. Stakes are defined by mission type, protocol, and objective circumstances *known or knowable* to the crew member at *t*.

  **Required Inputs:** Incident Report, Mission Log/Card for flight *t*, Active Protocols & Checklists at *t*, Crew Statements (if available), Objective Data (weather, telemetry, comms logs, etc.).

  **Procedure Steps (Sequential Questions):**

  1.  **Identify the Critical Fact (CF):** What specific fact was crucial to the outcome (e.g., "Destination weather below minima," "O2 cylinder pressure critically low," "Receiving facility acceptance confirmed")? *[Sufficient: Clear, single-sentence statement from the report.]*
  2.  **Establish Agent's Role & Mission Stakes at *t* (Stakes Firewall):**
      *   What was the **official mission type** on the mission card/log at dispatch and during the relevant phase (e.g., Ferry/Repositioning, Interfacility Transfer, Scene Call, Pediatric Priority)? *[Sufficient: Mission log/card entry.]*
      *   What was the **objective patient status/category** known or documented *prior to or at* time *t* (e.g., "Stable Adult," "Unstable Trauma," "Deteriorating Pediatric," "Unknown")? *[Sufficient: Documentation in mission log, PCR initiated pre-t, comms log.]*
      *   What **specific protocols/checklists** defining critical thresholds or required actions were **active and applicable** at time *t* for this mission/patient type? *[Sufficient: Dated protocol document, checklist version.]*
      *   **VERDICT POINT:** If the mission type, patient status, or applicable protocols **cannot be definitively established** from records *contemporaneous with t*, the assessment **hard-stops: "Could Not Have Known - Indeterminate Stakes Context."** Proceed only if established.
  3.  **Determine "Action Threshold" for CF:** Based *only* on the established Role & Mission Stakes (Step 2), what level of certainty/evidence was *institutionally required* to warrant *acting as if CF was true or false*? Describe qualitatively:
      *   *Low Stakes (e.g., Ferry, Stable Patient):* Threshold = "Reasonable Assurance" (Evidence sufficient for a prudent professional to act confidently in routine circumstances).
      *   *High Stakes (e.g., Scene Call, Unstable/Deteriorating Patient, Pediatric):* Threshold = "High Confidence" (Evidence compelling enough to justify action despite significant potential consequences; gaps or ambiguities are potentially disqualifying).
      *   **HANDOFF:** This step requires **panel consensus** on the applicable threshold based *strictly* on the documented mission profile and protocols at *t*. It defines the "bar" for Step 4. *[Sufficient: Panel agrees on "Reasonable Assurance" or "High Confidence" based solely on Step 2 outputs.]*
  4.  **Assess Evidence Available to Agent at *t*:** What specific information relevant to CF was *actually available* to the specific crew member *before or at* time *t*? Consider:
      *   Direct observations (visual, instrument readings, sounds).
      *   Communications received (ATC, dispatch, hospital, team member).
      *   Information from checklists/procedures completed.
      *   Training/knowledge demonstrably applicable.
      *   *Exclude:* Information received *after t*, information not plausibly accessible (e.g., locked cabinet), hindsight about what *could* have been checked. *[Sufficient: List compiled from report, logs, statements, data.]*
  5.  **Compare Evidence to Threshold:** Does the available evidence (Step 4) meet or exceed the Action Threshold (Step 3) for the CF?
      *   *Reasonable Assurance (Low Stakes):* Was the evidence sufficient that a reasonable crew member, acting prudently *under those specific low-stakes conditions*, could confidently accept CF as true/false for decision-making? (e.g., Single reliable source, no conflicting data, routine confirmation).
      *   *High Confidence (High Stakes):* Was the evidence robust, timely, and unambiguous enough that acting on it would be clearly justified *despite the high potential consequences*? (e.g., Cross-verified sources, direct confirmation, minimal ambiguity, no significant unanswered questions). Minor gaps or ambiguities may fail this threshold.
  6.  **Final Knowledge Verdict:**
      *   **YES (Met Threshold):** "Knew" the critical fact.
      *   **NO (Did Not Meet Threshold):** "Did Not Know But Should Have" (Evidence *was available* but fell short of the required threshold for the stakes).
      *   **HARD-STOP Condition:** If **no evidence existed** at *t* that could *possibly* have informed the agent about CF (even if it *should* have existed), OR if the stakes were **Indeterminate (Step 2 Verdict Point)**: "Could Not Have Known".

  **Handling Your Problem Cases Explicitly:**

  1.  **Unappreciated Stakes (e.g., undetected deterioration, uncommunicated upgrade):**
      *   **Step 2 (Stakes Firewall) is KEY.** The stakes used are *only* those defined by the *officially documented* mission type and *objectively documented* patient status **at *t***. If the crew wasn't told it was a scene call, the mission log says "Repositioning," and the patient's deterioration wasn't documented/communicated *before t*, the stakes assessed are LOW (Repositioning). If the deterioration *was* documented in the PCR or communicated clearly *before t*, stakes are HIGH. **The agent's *subjective feeling* about stakes is irrelevant.** The procedure uses the *institutional reality* they were operating within at *t*.

  2.  **After-The-Fact Stakes Inflation (e.g., new briefing/protocol):**
      *   **Step 2 (Stakes Firewall) again is KEY.** The applicable protocols and mission definitions are **locked at those *active at time t***. The review does *not* apply new standards, definitions, or heightened sensitivities created *after* the incident. The threshold (Step 3) is defined *only* by the protocols and norms *in force at t*. A new protocol next week doesn't change what "should have known" meant last month.

  **Does the "Stakes Firewall" Work?**

  *   **Survives as Steps:** Yes, Steps 2 and 3 operationalize it cleanly. It forces reviewers to look at *documented institutional facts* (mission card, protocols) to set the bar, not feelings or hindsight.
  *   **Collapses to Invariantism?** **No, it does real work.** Invariantism uses one fixed bar (e.g., "Reasonable Assurance"). This procedure *varies the bar* ("Reasonable Assurance" vs. "High Confidence") based on the *institutionally defined context at t*. Identical evidence can yield different verdicts (Knew vs. Did Not Know) *solely* based on the stakes established in Step 2. The extra bookkeeping (classifying stakes) is the mechanism enabling the variation.
  *   **Better Fix?** Your firewall is sound and necessary for fairness/objectivity. The procedure embeds it effectively.

  **Contextualist Alternative (Short Version):**

  A contextualist procedure would focus on **the review context**, not the agent's stakes:

  1.  **Define Review Context:** What are the potential consequences *for the organization* of *this review's findings*? (e.g., High: Fatal accident, major liability, public scandal; Low: Near miss, minor procedural lapse).
  2.  **Set "Knowledge" Threshold Based on Review Stakes:** For high-review-stakes, require "Very High Confidence" evidence; for low, "Reasonable Assurance".
  3.  **Assess Agent's Evidence:** Same as Step 4 above.
  4.  **Verdict:** Compare evidence to the *review-context-dependent* threshold.

  **Key Difference:** The contextualist verdict ("knew/didn't know") **changes based on how important the review meeting is**, *not* based on what was at stake for the crew during the mission. The deliverable becomes "Did they know *by the standards appropriate for this investigation*?" not "Did they know *given their actual situation*?" This *does* risk making the verdict about the meeting, not the agent at *t*, and could lead to inconsistent verdicts for identical events reviewed under different circumstances (e.g., minor incident with no injury vs. same incident causing fatality). Your invariantism-with-stakes model is more stable and agent-focused.

  ---

  **Procedure Application to Test Cases:**

  **(A) Daytime VFR Ferry Flight (No Patient)**
  *   **Step 1 (CF):** Destination weather below minima.
  *   **Step 2 (Stakes):** Mission = Ferry/Repositioning (Low). Patient = N/A (Low). Protocols = Standard VFR weather minima. **Threshold = Reasonable Assurance.**
  *   **Step 4 (Evidence):** Weather briefing 1hr prior showing marginal but legal conditions; no updates since; visual observation en route showed clear skies until descent; destination ATIS not obtained.
  *   **Step 5 (Compare):** Evidence (briefing, visual) provided *Reasonable Assurance* for a low-stakes ferry flight. Minor gap (no ATIS) acceptable at this threshold.
  *   **Verdict:** Knew.

  **(B) Pediatric Scene Call (Identical Weather Evidence)**
  *   **Step 1 (CF):** Destination weather below minima.
  *   **Step 2 (Stakes):** Mission = Scene Call (High). Patient = Pediatric (High). Protocols = High acuity protocols apply. **Threshold = High Confidence.**
  *   **Step 4 (Evidence):** *Identical to (A):* Weather briefing 1hr prior showing marginal but legal conditions; no updates since; visual observation en route showed clear skies until descent; destination ATIS not obtained.
  *   **Step 5 (Compare):** Evidence has *significant gaps* for high-stakes flight: Aged briefing, no current ATIS/update, visual obs unreliable near minima. Does *not* meet *High Confidence* threshold.
  *   **Verdict:** Did Not Know But Should Have (Failed to obtain current, definitive weather confirmation required for high-stakes mission).

  **(C) Respected Paramedic Followed Protocol (Competency Lapse Case)**
  *   **Step 1 (CF):** e.g., "Specific incompatible medication contraindicated for patient condition."
  *   **Step 2 (Stakes):** Mission = High-Acuity Interfacility (High). Patient = Unstable (High). Protocols = Mandate checking specific reference/algorithm before administering certain classes of drugs. **Threshold = High Confidence.**
  *   **Step 4 (Evidence):** Paramedic recalled general training about the medication class risk. Patient condition was complex. Protocol *required* consulting a specific electronic reference tool *before* administration. Paramedic did *not* consult the tool ("I was sure based on experience"). Tool, if consulted, would have shown clear contraindication.
  *   **Step 5 (Compare):** For high-stakes administration, protocol *defined* "High Confidence" as *using the mandated tool*. General recall/experience falls short of this defined institutional threshold. Evidence *available* (the tool) was *not used*.
  *   **Verdict:** Did Not Know But Should Have (Failed to use mandated high-confidence evidence source). **This is the answer the procedure gives, even if uncomfortable.** It highlights a failure to meet the *institution's* defined standard for knowledge under high stakes, despite expertise. The competency sign-off consequence flows from the just-culture matrix, *not* directly from this verdict. This is where management judgment is needed.

  ---

  **What This Procedure CANNOT Do:**

  1.  **Determine Sanctions:** It provides the knowledge verdict ("Knew," "Didn't Know But Should Have," "Couldn't Have Known"). Translating this into actions (training, sign-off lapse, no action, procedure change) is the role of the **Just-Culture Matrix** and **management judgment**. The procedure informs that decision but doesn't make it.
  2.  **Handle Incomplete Evidence:** If critical evidence about *what was available at t* (Step 4) or the *official stakes at t* (Step 2) is missing or irreconcilably conflicting, the procedure may hard-stop at "Could Not Have Known - Indeterminate Stakes/Evidence" or require a panel best-judgment call, reducing objectivity.
  3.  **Assess "Should Have Known" Sources Outside Evidence:** It focuses on *available* evidence. If evidence *should* have been available due to a *system* failure (e.g., broken sensor not reported), that feeds "Could Not Have Known" and triggers a *system* fix. It doesn't blame the agent for missing evidence the system failed to provide.
  4.  **Judge Intent or Comprehension:** It assesses whether sufficient evidence *was available* to meet the stakes-based threshold, not whether the agent *subjectively understood* it perfectly. Gross negligence might be flagged elsewhere.
  5.  **Eliminate All Subjectivity:** The "Action Threshold" definitions (Step 3) and the final evidence/threshold comparison (Step 5) require **trained panel judgment**. Clear definitions, examples, and calibration training are essential. The procedure structures and bounds this judgment using the Stakes Firewall.

  This procedure provides a structured, auditable, and stakes-sensitive method for assessing knowledge in post-incident reviews, explicitly handles your core concerns about shifting stakes, and delivers clear verdicts usable within your just-culture framework and time constraints.
