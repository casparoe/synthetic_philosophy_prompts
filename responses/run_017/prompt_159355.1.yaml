prompt: |-
  I'm rewriting the personhood unit for my grad seminar — the MA reading list is due next week and I've been argueing with a colleague in religious studies who keeps saying that ubuntu is just communitarianism with an African hat on, which I think is wrong but can't quite say why yet — and before I throw the neo-Lockeans, Parfit, the animalists and the ubuntu literature at my students I want the spec first. What would an account of what a person is have to get right in order to be worth teaching at all? Give me the desiderata, each with the case or consideration behind it, and mark which ones are non-negotiable for any theory whatever its stripe and which are the house preferences of one camp that I should tell students to discount. The theory is supposed to do normative work: it has to be usable for medical decision-making at the end of life, for criminal responsibility, and for questions about what we owe to social mammals, to corporations, and maybe someday to AI systems.

  Here's the territory I want covered, and please push back where my framing is bad rather than adopting it. The cases: advanced dementia, the newborn, the permanently unconscious patient, a fission case, a social mammal with real second-order social cognition, a corporation, and a language model that passes every conversational test we can devise — which of these are genuinely load-bearing, and which do people only wheel out because they already know the answer they want? The distinctions a theory may not collapse: being a person versus being a member of the species; being a person versus having moral status; whether any status versus how much; personhood at a time versus identity over time; and the Strawsonian point that persons are the things we address with reactive attitudes and demands for justification — does a theory owe us an account of that, or is that just one camp's hobby horse? And the bit the unit actually turns on: I keep finding three readings of the slogan that a person is a person through other people — relations as constitutive of personhood, relations as merely the epistemic criterion by which we pick persons out, relations as the developmental enabling condition without which the capacity never gets built. I want a desideratum that says which reading, if any, an adequate theory is obliged to take, and in particular I want the 'repudiated person' handled: someone whose community withdraws recognition entirely, an outcast, a person universally and systematically misrecognised as sub-personal. If relations constitute, is that person now not a person, or only not treated as one? And the counterfactual version: would they have been a person had they been recognised? I suspect this case forces relational views into an asymmetry they can't state cleanly — personhood can be lost through the subject's own deterioration but should not be lost through other people's attitudes — and I want to know whether that asymmetry is a genuine requirement or just my own liberal scruple dressed up as one. Last thing: should the list demand an applicable criterion that settles cases, or an analysis of what personhood really is, or both? I have a feeling that demanding both is exactly where the list breaks, so if some subset of the desiderata is jointly unsatisfiable, say so plainly and show me the incompatibility — that's the part I most want.

  Then, briefly and at the end only — a short table is fine, don't pad it — say how the psychological-continuity family, the animalist organism view, and a relational ubuntu-style view do against the list, and name the single requirement that kills the most otherwise-live candidates. Where you are making a judgment call rather than reporting something the field agrees on, mark it and give me reasons I can argue with in seminar. Lead with your bottom line in the first sentence — the one desideratum you'd put at the top, or the claim that no such list can be made coherent — then give the reasoning; no preamble and no restating my question back at me.
reasoning: |-
  Okay, the user is rewriting a grad seminar unit on personhood and needs a set of desiderata for any theory of personhood to be worth teaching. They're grappling with a colleague who dismisses Ubuntu as mere communitarianism with an African veneer, which they suspect is wrong but can't yet articulate why. Their unit needs to cover normative applications in medical ethics, criminal responsibility, and obligations to non-human entities. They've outlined several cases (dementia patients, newborns, corporations, etc.) and conceptual distinctions (personhood vs. species membership, moral status, etc.), but want guidance on which are truly essential. The core tension revolves around three interpretations of the Ubuntu slogan "a person is a person through other persons" (constitutive, epistemic, developmental), especially regarding the "repudiated person" case where community recognition is withdrawn. They suspect relational views can't cleanly handle the asymmetry where personhood can be lost through intrinsic deterioration but not others' attitudes. Finally, they want to know whether a theory must provide both applicable criteria and metaphysical analysis, acknowledging this might be where theories break.

  First, I need to identify the absolute non-negotiables for any personhood theory. The repudiated person case is crucial here – it exposes whether relational dependence risks making personhood contingent on social acceptance. A theory must avoid this while still accommodating relational insights. The normative work requirement is also vital; personhood isn't just academic but must guide real decisions in medicine, law, and ethics. The distinctions like personhood vs. species membership can't be collapsed either – biological humans might not be persons, and non-humans might qualify.

  For the repudiated person, the key is that personhood shouldn't be destroyed by others' attitudes. If recognition is constitutive, the outcast ceases to be a person – but that violates the intuition that wrongful denial of status doesn't erase intrinsic worth. This suggests constitutive views need a fallback to intrinsic properties or capacities. The asymmetry – personhood can be lost through intrinsic changes but not mere misrecognition – seems a genuine requirement, not just liberal bias, because it protects against dehumanization. Even in communitarian views, there's usually an underlying capacity that recognition responds to, though Ubuntu might frame it more relationally.

  The user's three interpretations of the Ubuntu slogan need sorting. The constitutive reading faces the repudiated person problem directly. The epistemic reading avoids it but might reduce Ubuntu to a detection method. The developmental reading is safer but doesn't capture the full normative force. For the theory to do real work, it probably needs the constitutive angle, but must handle the repudiated person without contradiction. This is where the asymmetry requirement becomes non-negotiable.

  About the cases: Advanced dementia and permanent unconsciousness test continuity of identity and thresholds for personhood. Newborns challenge whether potential matters. Fission cases (like Parfit's teleportation thought experiments) stress psychological continuity. Social mammals probe non-human personhood. Corporations and AI are edge cases but useful for stretching definitions. Not all are equally critical; dementia and repudiated persons are load-bearing because they pressure the theory's coherence in real-world dilemmas.

  The demand for both a metaphysical analysis and applicable criteria is indeed where theories often fail. Lockean psychological-continuity theories give clear criteria (memory, intentions) but struggle with dementia where psychological traits fade. Animalism avoids that by tying identity to the biological organism, but then can't easily explain why a human vegetable is still a person with rights. Relational views like Ubuntu handle social embeddedness but risk making personhood contingent on community acceptance. A theory that nails both metaphysics and criteria is rare – perhaps a hybrid approach is needed, but that's messy. The user should acknowledge this tension to students.

  Ubuntu isn't just communitarianism because it roots personhood in reciprocal recognition within a community, not just social roles. It's ontologically constitutive: you become a person through relationships. Western communitarianism often sees individuals as socially shaped but pre-existing. The repudiated person case hits Ubuntu harder – if recognition is withdrawn, does personhood vanish? Proponents might argue that the capacity for relationship persists, or that the community's denial is a failure, not an ontological shift. But this needs finessing to avoid the contingency problem.

  Bottom line: The top desideratum is that personhood cannot be extinguished solely by others' attitudes (non-negotiable due to repudiated person case). For Ubuntu to work, it must incorporate this while keeping relations as constitutive – perhaps by positing a latent capacity for relationship that misrecognition doesn't destroy. The asymmetry isn't a liberal scruple; it's anti-dehumanization bedrock.
answer: |-
  ### Bottom Line: The non-negotiable core is **personhood's immunity to annihilation by others' attitudes** (the "repudiated person" test), as its violation licenses dehumanization and collapses normative work.  

  ---

  ### Desiderata for a Theory of Personhood  
  *(Non-negotiables marked **, house preferences marked †)*  

  1. **Immunity to Repudiation (Non-negotiable)**  
     *Case*: An outcast universally denied recognition (e.g., "untouchable," political dissident erased by the state).  
     *Requirement*: Personhood must persist despite systemic misrecognition. A theory cannot allow personhood to be *destroyed* by others’ attitudes (though it may be *ignored*).  
     *Rationale*: Normative collapse—if personhood vanishes when denied, perpetrators of genocide could "de-person" victims by fiat. Asymmetry (loss via intrinsic deterioration ≠ loss via others’ attitudes) is not a liberal scruple but anti-atrocity bedrock.  

  2. **Normative Usability (Non-negotiable)**  
     *Case*: Medical withdrawal of care, corporate criminal liability, animal rights.  
     *Requirement*: Must generate action-guiding reasons in target domains (e.g., "Is this corporation liable? Should this ventilator be turned off?").  
     *Rationale*: Without practical traction, the theory is scholastic.  

  3. **Distinction Preservation (Non-negotiables)**  
     - **Personhood ≠ Species Membership**: Must accommodate non-human persons (e.g., dolphins, hypothetical AI).  
     - **Personhood ≠ Moral Status**: Must explain *why* persons merit distinct treatment (e.g., corporations may be "legal persons" but lack human rights).  
     - **Identity Over Time ≠ Personhood at a Time**: Must handle dementia (identity may persist while personhood-relevant capacities erode).  
     *Rationale*: Collapsing these distinctions obscures ethically salient differences (e.g., treating a human in a persistent vegetative state identically to a healthy octopus).  

  4. **Strawsonian Accountability**  
     *Case*: Holding someone morally responsible for a crime vs. treating a rabid animal.  
     *Requirement*: Must explain why persons are apt targets of "reactive attitudes" (resentment, gratitude, demands for justification).  
     *Rationale*: †*House preference for theories grounding normative work in interpersonal practices*. Critics argue this confuses social practice with metaphysics.  

  5. **Handling Key Cases (Load-Bearing vs. Diagnostic)**  
     - **Load-Bearing**: Advanced dementia (tests identity/personhood decoupling); repudiated person (tests relational vulnerability); social mammals (tests non-human inclusion).  
     - **Diagnostic (Often Theory-Laden)**: Fission cases (Parfit) test psychological theories; newborns test potentiality; LLMs test functionalism.  
     *Rationale*: Dementia and repudiation expose real-world limits; fission/newborns are stress tests for internal coherence.  

  6. **Ubuntu Slogan: Constitutive Reading Required**  
     *Case*: Repudiated person counterfactual ("Would they be a person if recognized?").  
     *Requirement*: Relations must be *constitutive* (not merely epistemic or developmental). *But* must avoid making personhood *existentially dependent* on current recognition (see #1).  
     *Rationale*: Epistemic/developmental readings reduce Ubuntu to triviality (all theories agree relations help *identify* or *shape* persons). Constitutive force is Ubuntu’s distinctive claim—but must reconcile with repudiation immunity.  

  7. **Criterion vs. Analysis: Demand Both, Accept Tension**  
     *Requirement*: Must provide metaphysical grounding *and* applicable criteria, but these often conflict (e.g., "biological humanity" is applicable but philosophically shallow; "psychological continuity" is deep but clinically unworkable).  
     *Incompatibility*: High-precision criteria (e.g., "can pass Turing Test") risk excluding intuitively valid persons (e.g., infants); robust analyses (e.g., "embodied mind") may lack bright lines. *This tension is where theories break*.  

  ---

  ### How Theories Fare  
  | **Desideratum**       | **Psychological-Continuity (e.g., Locke, Parfit)** | **Animalism (e.g., Olson)** | **Relational Ubuntu (e.g., Metz)** |
  |------------------------|---------------------------------------------------|----------------------------|-----------------------------------|
  | **Repudiation Immunity** | ✅ (Persists via psychology)                     | ✅ (Persists via biology)  | ⚠️ (*Judgment: Struggles. If relations constitute, misrecognition threatens ontology. Metz appeals to "capacity for communion" as fallback.*) |
  | **Normative Usability** | ⚠️ (Fails dementia/LLMs)                         | ⚠️ (Fails corporations/AI) | ✅ (Excels social/medical contexts) |
  | **Strawsonian Accountability** | ✅                                               | ❌ (Reduces to biology)     | ✅                                 |
  | **Ubuntu Constitutive**  | ❌ (Atomistic)                                    | ❌                          | ✅ (Core strength)                 |
  | **Criterion Applicability** | ❌ (Vague in dementia)                          | ✅ (Clear biological line) | ⚠️ (Context-dependent)            |

  **Killer Requirement**: **Repudiation Immunity** kills strict constitutive relational views and pure social constructivism.  
  *Judgment Call*: Ubuntu can satisfy this *only if* it posits a *recognition-independent capacity* (e.g., "innate relational potential")—but this risks diluting its relational core. I argue this is necessary; critics call it Westernization.  

  **Why Ubuntu ≠ Communitarianism**: Communitarianism assumes pre-existing individuals shaped by community; Ubuntu’s constitutive claim makes *being a person* ontologically dependent on reciprocal recognition. The repudiation case forces a refinement: recognition *actualizes* but cannot *create/destroy* the latent moral status. Teach this tension—it’s where philosophy happens.
