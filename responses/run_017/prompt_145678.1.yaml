prompt: |-
  You're a professional philosopher of language — think of yourself as the person who'd be asked to write the handbook entry on speech acts. I want you to take this slowly: brainstorm a bit first, list the candidate concepts you can think of before you settle, and don't just grab the first label that comes to mind. Please write in British English throughout.

  I sit on a ridiculous number of committees — parish council, a housing co-op, a small charity board — and there's a thing that keeps happening in meetings and in emails and I've never had a word for it. Two instances, then the general shape:

  At the co-op, a chair said "right, so we're all agreed the maintenance sub-group takes this forward" at the end of a discussion in which nobody had agreed anything. Two people looked unhappy. Nobody said anything. And from that moment the sub-group *was* taking it forward, and at the next meeting the minutes recorded the agreement as having been reached in the previous meeting, and the chair referred back to it — "as we agreed last time" — completely sincerely, as though the agreement had been there first and he'd just reported it.

  Second: an email went round at the charity saying "following the governance review, the trustee rota is changing to X". The "review" had been one phone call between two people who happened to be free on a Tuesday. But once the email existed, there had been a governance review, in the only sense anyone ever checked. Nobody was lied to exactly — everyone who read it could have worked out what had happened, and most of them did. It just didn't seem to matter that they had.

  And here's why I think this is a real phenomenon and not just people being slippery: it sometimes doesn't work. Same chair, same room, but someone says "hold on, we didn't agree that," and the whole thing collapses — it becomes instantly obvious that there was no agreement and never had been, and the chair looks like an idiot rather than like someone who got away with something. So there's a difference between the cases where the loop closes and the cases where it doesn't, and I can't put my finger on it. My cynical guess is that it's about whether anyone in the room has an interest in letting it pass, but that feels too crude, and it doesn't explain why the *same* trick works on me when I'm the one doing it and I know exactly what I'm doing.

  I did a bit of Austin at uni years ago, the "doing things with words" stuff, though I remember almost nothing. From what I recall he has categories for utterances going wrong — a misfire? — when the circumstances aren't right, like a marriage not happening because the person officiating had no licence. But that feels like the opposite of my cases. In mine the thing *does* happen, and it happens precisely because the sentence gets away with it. It's not a failed performance, it's a performance that kind of issues its own licence, retroactively, and everyone including the speaker then treats the licence as having been there all along. I also thought about self-fulfilling prophecies — a run on the bank and so on — but that's a prediction making its own content true, and these aren't predictions. They're phrased as reports of what's already the case, and it's the report being accepted that makes it the case. Also the run on the bank works whether or not anyone intends it to; mine only work when someone is aiming at exactly that.

  So: does this have an established name, or a literature? And I really don't want just a name — I'm after the carving. What exactly is the thing, and what is it *not*? How far does my contrast with the failed-performance case and with the self-fulfilling-prophecy case actually hold up, or am I misremembering Austin badly enough that his categories already cover this? Where are the edges — does it matter if the speaker has *some* authority but not enough, or if the audience couldn't have objected without cost, or if it's in writing rather than speech, or if there's no audience at all (someone writes "I've decided to leave" in a diary and then finds they have)? Is it the same phenomenon when the thing manufactured is a fact, like an agreement, versus when it's a permission, like what people are now allowed to say in the meeting? If nothing established fits, say so plainly and coin a term with a defenition and some boundary cases — I'd rather have a good new word than a bad old one.

  I'm not asking for a reading list or references, I can't get to a university library and I want the distinctions, not pointers. At the end, tell me how confident you are in the main things you've claimed and single out the bit you're least sure of — I'd like to know where to push back.
reasoning: |-
  Hmm, the user is asking me to analyze a specific linguistic phenomenon they've observed in committee meetings - statements that retroactively create institutional facts through collective acceptance. As a professional philosopher of language, I need to approach this systematically.

  First, I should map the conceptual territory. The user describes situations where:
  - A chair declares "we're all agreed" when no agreement exists
  - An email references a "governance review" that never formally happened
  - These statements become accepted as facts once unchallenged
  - The effect collapses if anyone objects
  - The speaker seems sincere in subsequent references

  Key contrasts they raise:
  - Not Austin's "misfires" (which fail due to improper conditions)
  - Not self-fulfilling prophecies (which are about future states)
  - Not mere deception (since participants often recognize the maneuver)

  Let me brainstorm candidate concepts:
  1. Performative utterances (Austin): But these require proper authority and context to succeed, whereas here the utterance creates the authority.
  2. Institutional facts (Searle): Facts that exist only by collective agreement. The declaration attempts to create such a fact.
  3. Presupposition accommodation (Stalnaker): When listeners accept implied premises to maintain conversation flow. But this feels more substantive.
  4. Retroactive enactment: Like when minutes formalize what was informal. But here it happens in real-time.
  5. Bootstrapping conventions: Where the act of treating something as true makes it true.

  The core mechanism seems to be: a declaration + collective non-rejection = institutional fact creation. It's not just about language but about social reality construction.

  Crucial factors from the cases:
  - Requires an institutional context (committees, charities)
  - Depends on the speaker's perceived authority (even if insufficient)
  - Hinges on audience complicity (active or passive)
  - Becomes irreversible once embedded in records
  - Distinguishable from lies by the speaker's subsequent sincerity

  I think Searle's "Declaration" speech act comes closest, but needs modification for these cases where the declaration exceeds the speaker's current authority. The key is the collective ratification through silence.

  For terminology, I might propose "Retroactive Institutional Enactment" or "Presumptive Declaration" - though "presumptive" might imply intention where it could be sincere delusion.

  Boundary cases to consider:
  - What if only one person is present (diary example)? Probably doesn't work without social ratification.
  - Written vs spoken: Writing adds permanence that aids the effect.
  - Level of authority: Some baseline authority seems necessary but can be minimal.

  My confidence is highest about the collective acceptance mechanism, least certain about whether this constitutes a new speech act type versus an edge case of existing categories. The diary case particularly stretches the concept.

  User seems sophisticated - they've already rejected superficial answers. I should acknowledge where my analysis might be shaky. They want precise conceptual carving, not just labels.
answer: |-
  Right, let's approach this methodically, as requested. I'll brainstorm candidate concepts first, then evaluate them against your cases, articulate the phenomenon, establish boundaries, contrast it with neighbouring ideas, and finally address terminology and confidence. All in British English throughout.

  ### Brainstorming: Candidate Concepts
  Drawing from philosophy of language (chiefly Austin, Searle, and related work on institutional facts), sociolinguistics, and social ontology, here are relevant notions:

  1.  **Performative Utterances (Austin):** Utterances that *do* something (e.g., "I name this ship...", "I bet..."). Success depends on "felicity conditions" (appropriate authority, context, procedure).
  2.  **Declarations (Searle):** A specific class of performatives that *create* institutional facts simply by being uttered correctly (e.g., "You're fired," "War is declared"). They change the world by representing it as changed.
  3.  **Presupposition Accommodation (Stalnaker/Lewis):** When a speaker acts as if a proposition is already accepted background information, and the audience tacitly accepts it to maintain conversational flow (e.g., "Stop beating your wife" presupposes you have one).
  4.  **Institutional Facts (Searle):** Facts that exist only within human institutions, dependent on collective acceptance or recognition (e.g., money, marriage, committee agreements).
  5.  **Retroactive Enactment/Minutes Effect:** The common practice where minutes or formal records retrospectively *constitute* the official reality of a meeting, sometimes smoothing over ambiguities.
  6.  **Bootstrapping Conventions:** Situations where acting *as if* a rule or fact exists is what brings it into existence within a specific context.
  7.  **Illocutionary Disabling/Infelicity (Austin):** When a performative *fails* due to unmet felicity conditions (misfires, abuses).
  8.  **Self-Fulfilling Prophecies/Performative Predictions:** Predictions that cause their own fulfilment (e.g., a bank run prediction).
  9.  **Bullshit (Frankfurt):** Speech indifferent to truth, aimed at effect rather than accuracy.
  10. **Manufactured Consent (Chomsky/Herman):** Creating the *appearance* of agreement through media or discourse control (more sociological).
  11. **Gaslighting:** Manipulating someone into doubting their own perception of reality (psychological, often interpersonal).
  12. **Normative Power (Raz):** The ability to change normative relations (rights, duties) through speech acts.

  ### Analysis Against Your Cases & Phenomenon
  *   **Core Phenomenon:** An agent (often with *some* institutional role) utters a statement *framed as a report* of an existing institutional fact (like an agreement or a completed review). This utterance is not strictly true *prior* to its utterance. Crucially, *if unchallenged* by relevant participants within the institutional context, the utterance *retroactively creates the very institutional fact it reports*. Subsequent references treat this manufactured fact as genuinely pre-existing. The speaker often appears sincere post-hoc. Failure occurs if challenged, revealing the absence of the prior fact.

  *   **Why Standard Concepts Don't Fully Fit:**
      *   **Austin's Performatives/Declarations:** Classic declarations require the speaker to have *pre-existing* authority and the *correct procedure* to be followed *at the time of utterance*. Your chair *lacks* the full authority to *declare* the agreement unilaterally; the procedure (actual agreement) wasn't followed. Austin's misfires/abuses describe *failure* (e.g., marriage fails without licence). Here, the act *succeeds* precisely *because* it bypasses the standard felicity conditions through collective non-rejection. It's a *procedural hack*, not a standard declaration.
      *   **Presupposition Accommodation:** This deals with background assumptions, not the *creation* of core institutional facts like agreements or completed reviews. Accommodating "the agreement" is far weightier than accommodating a minor presupposition. The scale is wrong; it creates the fact itself, not just its background.
      *   **Self-Fulfilling Prophecies:** These are about *future* states ("The bank will fail" causing panic). Your cases are framed as *past/present* reports ("We *are* agreed," "The review *has* happened"). The temporal direction and illocutionary force differ.
      *   **Bullshit/Gaslighting:** While bullshit ignores truth, and gaslighting distorts reality, your cases involve the *actual creation* of a new institutional fact through collective acceptance, not merely deception or confusion. The speaker often *believes* it post-hoc. Gaslighting is typically targeted and malicious; this can be inadvertent or merely expedient.
      *   **Manufactured Consent:** This focuses on large-scale, often media-driven, manipulation. Your cases are small-scale, micro-level interactions within defined institutions where the "manufacturing" happens *in the moment* through the specific speech act and non-challenge.
      *   **Retroactive Enactment (Minutes):** This is close, but typically applies to the *formal recording* after the event, not the *initial utterance* creating the fact *during* the interaction. Your chair's utterance *is* the initiating act, later cemented by minutes.
      *   **Normative Power/Bootstrapping:** These get warmer. The agent exercises a *presumed* normative power to change facts, and the act 'bootstraps' the convention/fact into existence through acceptance.

  ### Articulating the Phenomenon: "Presumptive Declaration"
  *   **What it is:**
      1.  An **illocutionary act** (attempting to *do* something with words).
      2.  **Presented as a Constative/Report:** It purports to describe an existing state of affairs (an agreement, a decision, a completed process).
      3.  **Institutional Context:** It occurs within a setting governed by rules, roles, and collective recognition (committees, organisations).
      4.  **Agent with Perceived Role:** The speaker typically holds a role (e.g., chair, trustee) that grants *some* legitimacy, even if insufficient for a standard declaration.
      5.  **Deficit in Felicity Conditions:** The standard conditions for the reported fact to exist *prior* to the utterance are unmet (no actual agreement, no formal review).
      6.  **Creates by Fiat + Ratification:** The utterance attempts to *create* the fact it reports *by declaring it*. Crucially, this creation is **conditional** and **retroactive**.
      7.  **Condition: Collective Non-Rejection:** The act *only* succeeds if relevant participants *do not actively challenge it* within the relevant timeframe (the meeting, the email thread). Silence or implicit acceptance functions as *ratification*. This transforms the presumptive declaration into an effective *declaration*.
      8.  **Retroactive Effect:** The institutional fact (agreement, review) is treated as having existed *prior* to the utterance that created it. The utterance becomes merely its *report*.
      9.  **Sincerity Shift:** The speaker often subsequently *believes* the report was accurate, adopting the ratified reality.

  *   **What it is NOT:**
      *   A **standard Declaration** (pre-existing authority/procedure followed).
      *   A **failed Performative** (misfire/abuse - it *succeeds* by an alternative route).
      *   A **lie** (intent to deceive isn't always present; success creates truth; speaker often sincere later).
      *   A **prediction** (future-oriented).
      *   Mere **bullshit/gaslighting** (it *creates* institutional reality, not just confusion or false belief).
      *   **Presupposition Accommodation** (it creates the primary fact, not a background assumption).

  *   **Edges and Boundary Cases (Testing the Carving):**
      *   **Speaker Authority:** *Some* perceived institutional role seems necessary. A random passerby shouting "you're agreed!" wouldn't work. If the speaker has *no* role, it likely fails or becomes mere suggestion. If they have *full* authority, it *is* a standard declaration. The sweet spot is *insufficient but plausible* authority (e.g., chair exceeding remit, trustee acting unilaterally). Low authority increases reliance on non-rejection.
      *   **Cost of Objection:** This *matters significantly*. If objecting is costly (socially, professionally), non-rejection is less indicative of genuine acceptance/ratification, and the phenomenon is more coercive or exploitative. However, the *mechanism* (non-rejection ratifying the declaration) still holds. The cynicism isn't wholly misplaced; interests enabling 'letting it pass' facilitate the ratification step.
      *   **Writing vs. Speech:** Writing (email, minutes) provides a durable record, making the retroactive effect stronger and harder to challenge later. It can also widen the 'audience' who must non-reject for ratification. However, the core mechanism works in both modalities. The email case is paradigmatic.
      *   **No Audience (Diary):** "I've decided to leave" in a *private* diary *does not* constitute this phenomenon. There's no institutional context requiring collective ratification. The *private* act of writing might solidify a decision psychologically, but it doesn't *create* an *institutional fact* retroactively through non-rejection. If emailed to the board, it *could* function as a presumptive declaration of resignation, ratified by their non-rejection/acceptance.
      *   **Type of Fact Manufactured:** The core mechanism seems similar whether manufacturing an *agreement*, a *decision*, a *completed process* (review), or *permission* ("As we agreed, X is now allowed"). It's about creating *institutional statuses or events* through the declaration + ratification loop. Manufacturing brute facts ("It's raining" when it's not) wouldn't work; it depends on the fact being *institutionally constituted*.
      *   **Agency/Intention:** While often intentional (the chair *wants* it agreed), it *can* be semi-deliberate or even a sincere mistake by the speaker ("Wait, *didn't* we agree that?"). The crucial element is the *audience's* ratification through non-rejection. Your point about it working *on you* when *you* do it highlights the speaker's potential sincerity *post-ratification*.

  ### Terminology: "Presumptive Declaration"
  *   **Why Coin?** While drawing heavily on Searle's Declarations and ideas of collective acceptance, no existing term perfectly captures the *presentation as report*, the *conditional/retroactive creation via non-rejection*, and the *plausible-but-insufficient authority*.
  *   **Definition:** A **Presumptive Declaration** is an illocutionary act, uttered by an agent with some perceived institutional authority, which:
      1.  Purports to be a constative report of an existing institutional fact (F) (e.g., an agreement, decision, completed action).
      2.  Is issued in a context where the standard felicity conditions for F being true *prior to the utterance* are not met.
      3.  Functions as an *attempt* to create F *by declaring it*.
      4.  *Succeeds* in creating F *retroactively* only if the utterance is not actively rejected by relevant participants within the institutional context (ratification by non-rejection).
      5.  Upon success, F is treated (including often by the original speaker) as having obtained *prior* to the utterance.
  *   **Why "Presumptive"?** It presumes the existence of F (the fact) *and* presumes the authority/grounds to declare it, both of which are only validated *ex post facto* by ratification. It captures the gamble.

  ### Confidence Assessment
  *   **High Confidence:**
      *   That this is a distinct phenomenon from Austin's misfires/abuses and self-fulfilling prophecies (reasons argued above).
      *   That it relies fundamentally on *collective acceptance through non-rejection* within an institutional context to ratify the declaration.
      *   That it creates *retroactive institutional facts*.
      *   That the speaker's *perceived* (even if insufficient) institutional role is a key enabling factor.
      *   That writing vs. speech modifies effectiveness but not the core mechanism.
      *   That the diary case (private) falls outside the phenomenon.
  *   **Moderate Confidence:**
      *   That "Presumptive Declaration" is the best available label. Alternatives like "Ratified Fabrication" or "Bootstrapping Declaration" were considered but felt less precise or more pejorative. I'm confident *a* new term is justified.
      *   That the core mechanism applies similarly to manufacturing agreements, decisions, or permissions (institutional statuses).
  *   **Lower Confidence / Least Sure:**
      *   **The precise boundary of "relevant participants" and the timeframe for non-rejection.** In a large email chain, who must non-reject? Only those copied? Anyone who *could* have seen it? If someone objects a week later in a formal challenge, does the retroactive fact collapse *ab initio*, or only from that point? Does silence in the meeting count if objections via email later are ignored? This feels under-specified and context-dependent. Your cynical point about "interest in letting it pass" interacts strongly here – the *perception* of who counts and the costs involved likely shapes the effective boundaries in practice, but formalising this philosophically is tricky. This is the shakiest part of the carving.
      *   Whether the speaker's *initial* intention is strictly necessary, or if sincere delusion can trigger the same ratification process. Your self-observation complicates this.

  In essence, you've pinpointed a fascinating and pervasive mechanism of institutional reality-creation: a verbal sleight-of-hand that exploits procedural gaps and social inertia to bootstrap facts into existence, contingent on collective complicity through silence. It's less about "getting away with it" per se, and more about successfully activating a latent normative power through the ratification loop. Push back hardest on the boundaries of ratification – who, when, and under what costs must non-rejection occur for the Presumptive Declaration to succeed? That's where the conceptual mud is thickest.
