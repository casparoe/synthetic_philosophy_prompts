  ### Iris Vane's Marking Notes  
  **Course: Epistemology 201 | Student: [Redacted] | Essay: Variantism & Case P**

  ---

  #### 1. **Grade**  
  **73/100 (B-)**  
  A competent grasp of core concepts and clear structure, but the central argument in (iii) misrepresents the disagreement between contextualism and pragmatic encroachment, undermining the analysis of Case P. The mark reflects this significant oversight despite strong exposition elsewhere.

  ---

  #### 2. **Point-by-Point Comments  
  *(Keyed to paragraphs)***  

  - **¶1**: Accurate summary of invariantism and shared motivation for rejecting it. Minor quibble: "truth-relevant factors" typically excludes truth itself (truth is a *condition* for knowledge, not a factor influencing it). **✓ Credit earned.**  
  - **¶2**: Clear definition of contextualism. Missing nuance: contextualists (e.g., DeRose) often note that *ascriber* standards shift, not necessarily "the standard for S." Also, "resistance to this" is vague—specify resistance to *what*? (Likely: resistance to contextualism’s implications). **✓ Largely correct, but incomplete.**  
  - **¶3**: Strong explanation of pragmatic encroachment (PE) and its invariantism. Well-handled distinction between semantic and worldly factors. Cite Fanti & McGrath (2002) or Stanley (2005) for the action-based justification to bolster authority. **✓✓ Credit earned.**  
  - **¶4**: Correctly identifies the *locus* of sensitivity (ascriber vs. subject). However, "usually move together" overstates convergence. Cases exist where stakes dissociate (e.g., a high-stakes attributor discussing a low-stakes subject). **✓ Eccentric but defensible phrasing.**  
  - **¶5**: **Flawed core argument.** Incorrectly claims both views agree on Case P. Contextualism would likely deem the flatmate’s belief *knowledgeable in low-stakes contexts* (e.g., if Marta’s friend casually asked). PE denies knowledge *to the flatmate* due to *Marta’s* stakes affecting the flatmate’s epistemic position. PE does *not* "reconceive" contextualism; it rejects semantic variance entirely. **✗ Confused/misleading.**  
  - **¶6**: Doubles down on ¶5’s error. Calling the dispute "verbal" ignores that contextualism and PE assign truth-conditions differently (e.g., in Case P, contextualism allows "flatmate knows" in *some* contexts; PE never does). Marta’s later remark *is* consistent with contextualism (her Saturday context has lower standards). Dismissing it ignores a key datum. **✗ Substantial error.**  

  ---

  #### 3. **What a Full-Credit Answer Would Have Said**  
  A strong response would note that contextualism and pragmatic encroachment *disagree sharply* in Case P. For contextualism, "knows" in Marta’s Friday utterance is false (high attributor-stakes), but the flatmate *could* satisfy "knows" in a low-stakes context (e.g., her own). Pragmatic encroachment, however, asserts the flatmate *lacks knowledge simpliciter* because *Marta’s* practical stakes raise the epistemic threshold *for the subject*. Thus, Case P reveals a non-verbal divergence: contextualism permits truth-value shifts without changing the subject’s epistemic state, while PE alters knowledge conditions based on the subject’s practical environment (even if unknown to them). Marta’s later remark aligns with contextualism: in a low-stakes context, she accurately attributes past knowledge.  

  ---

  #### 4. **Margin Notes**  
  *(Iris’s handwritten comments)*  
  - **¶1** → *"Clean setup, but note: truth is binary, not a ‘factor’."*  
  - **¶3** → *"Yes — PE’s ‘invariantism’ is key. Cite Fanti/McGrath?"*  
  - **¶4** → *"Overstated — see Rysiew’s ‘warranted assertibility’ cases."*  
  - **¶5** → *"NO: Contextualism ≠ PE! Flatmate may know in HER context."*  
  - **¶6** → *"Verbal dispute? Hardly. Truth-conditions diverge here."*  
  - **¶6** → *"Marta’s remark is contextualism’s EXACT prediction. Missed opportunity."*  

  ---

  **End of Assessment**  
  *—I. Vane*  

  ---  
  **Note for the Author**:  
  The essay is well-calibrated for a bright but slightly overconfident undergrad. Iris’s marginalia targets philosophical precision (especially ¶5-6) and subtly reveals her expertise. The "NO" and "Hardly" comments showcase her sharpness without overt hostility. No rewrite needed—the flaws are authentic and pedagogically useful.
