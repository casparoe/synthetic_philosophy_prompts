prompt: |-
  I'm an undergraduate in a seminar on probability and anthropic reasoning, and I'm assembling a short diagnostic for my study group: a decision tree that leads someone from their verdicts on concrete cases to a named position on self-locating belief, instead of asking them which label they like.

  Assume the reader has never heard of the self-sampling or self-indication assumptions. Every node should be a question they can answer from a described case alone, and every leaf should carry a position name plus one sentence on its most awkward commitment. Keep it to roughly eight to ten decision nodes.

  The cases I want doing the work are: the standard incubator (one observer created if the coin lands heads, two if tails); Sleeping Beauty; the Doomsday argument; the Presumptuous Philosopher, where self-indication style reasoning appears to confirm a vastly larger universe on purely anthropic grounds; and two variants I invented to block the stock answers — the Sealed Incubator, where the tails branch adds a trillion observers in a causally sealed region that you are reliably told you are not in, and the Shuffled Incubator, where both branches create the same number of observers but assign them serial positions, and you learn only that you occupy some position or other.

  Leaves that must appear: plain person-based self-sampling, the observer-moment version, self-indication, the approach on which indexical evidence is never genuinely new evidence and one conditions only on non-indexical facts, and the response that treats the Presumptuous Philosopher as a problem about action rather than belief. Include a scoring key, mark the answer combinations that are available in logical space but that nobody defends and say why, and flag any two leaves your tree cannot actually separate.
reasoning: |-
  Okay, let me approach this systematically. The user wants a decision tree that maps concrete cases to positions in anthropic reasoning, avoiding jargon. They've specified six key thought experiments and five required positions to include.

  First, I need to understand the core dilemma each case presents. The Incubator sets up the basic self-location problem when observer count depends on coin flips. Sleeping Beauty adds temporal uncertainty with memory wipes. Doomsday examines how birth rank affects species survival estimates. Presumptuous Philosopher forces confrontation with universe size probabilities. The two variants - Sealed and Shuffled - seem designed to test robustness against workarounds for earlier cases.

  For the tree structure, I'm considering starting with Sleeping Beauty since it's the most famous puzzle. The first split could ask whether Beauty should change her credence upon waking - this separates indexical skeptics from others. Then for those who do update, Incubator variants can distinguish between observer-counting approaches. 

  The Sealed Incubator is crucial for separating SSA from SIA - if someone thinks the sealed trillion observers matter for credence even when they know they're not among them, that points to SIA. The Shuffled case helps identify who treats observer identity as evidentially relevant versus irrelevant.

  For positions, I need to ensure all five required stances appear: traditional SSA (observer-based), observer-moment approach, SIA, indexical skepticism, and the Presumptuous Philosopher action-based response. The scoring key should note when positions collapse into each other - like how indexical skepticism and action-focused views might agree in Presumptuous Philosopher.

  I'll need to flag combinations that nobody defends, such as believing in updating for Beauty but not in Doomsday, since that would require inconsistent treatment of birth rank evidence. Also worth noting that SSA and SIA become indistinguishable in the Shuffled Incubator variant.

  Most awkward commitments will highlight each position's counterintuitive consequences: SSA leading to presumptuous conclusions, SIA rejecting Doomsday arguments, indexical skepticism making self-location irrelevant, etc. This should help the study group see the tradeoffs clearly.
answer: |-
  Here's a decision tree designed to diagnose positions on self-locating belief using your specified cases and positions, staying within 8-10 nodes. Positions and their awkward commitments are in bold.

  **Self-Locating Belief Diagnostic Tree**

  1.  **Sleeping Beauty:** Upon waking on Monday or Tuesday (she doesn't know which), *before* learning it's Monday, should Beauty change her credence that the coin landed Heads?
      *   **No, still 1/2.** *(Go to 2)*
      *   **Yes, 1/3 Heads.** *(Go to 3)*

  2.  **(From 1-No) Incubator:** You wake up in a room. A fair coin was flipped. Heads: Only you were created. Tails: Another identical observer was created in another room. What's your credence it was Heads?
      *   **1/2.** *(Go to 4)*
      *   **1/3.** *(Go to 5)*

  3.  **(From 1-Yes) Presumptuous Philosopher:** Two theories: T1 says the universe is small, containing only 1 trillion observers. T2 says the universe is vast, containing 10^20 observers. All else is equal. You learn your birth rank is 100 billion. Does this evidence favor T2?
      *   **No, the theories remain equally likely.** *(Go to 6)*
      *   **Yes, T2 is more likely.** *(Go to 7)*

  4.  **(From 2-1/2) Sealed Incubator:** Like Incubator, but Tails: A trillion additional observers are created in a causally sealed region you are reliably told you are *not* in. What's your credence it was Heads?
      *   **1/2.** **Position: Indexical Skepticism** *(Awkward: Observers in the sealed region seem irrelevant to your credence, even though they exist if Tails. Self-location evidence is never genuinely new evidence; condition only on non-indexical facts.)*
      *   **≈1.** **Position: Observer-Moment SSA** *(Awkward: You must ignore the trillion observers entirely because you know you're not among them. Focuses only on the observer-moments indistinguishable from your current one.)*

  5.  **(From 2-1/3) Doomsday Argument:** Suppose humanity has two possible futures: Short (total humans ever = 100 billion), or Long (total = 100 trillion). You learn your birth rank is 100 billion. Does this favor the Short hypothesis?
      *   **Yes.** **Position: Observer-Based SSA (Self-Sampling Assumption)** *(Awkward: Leads to the Presumptuous Philosopher conclusion (T2 favored). You reason as if randomly sampled from all possible observers.)*
      *   **No.** *(Go to 8)*

  6.  **(From 3-No) Shuffled Incubator:** A fair coin is flipped. Heads: Observer A is created. Tails: Observer B is created. *Regardless of the coin flip*, you are created as "Observer 1" or "Observer 2" *at random*. You learn you are "Observer 1". What's your credence it was Heads?
      *   **1/2.** **Position: Indexical Skepticism** *(Awkward: Learning your specific identity ("Observer 1") provides no evidence about the coin flip, even though it could have been different. Self-location info is irrelevant.)*
      *   **1/3.** **Position: Observer-Moment SSA** *(Awkward: Requires treating "Observer 1 Heads", "Observer 1 Tails", and "Observer 2 Tails" as equiprobable centered propositions before learning who you are.)*

  7.  **(From 3-Yes) Presumptuous Action:** In the Presumptuous Philosopher setup, should we *act* as if T2 is true (e.g., invest less in finding alien life)?
      *   **No, we should not bet or act based solely on this anthropic likelihood.** **Position: Action Focus** *(Awkward: Requires divorcing belief and rational action in anthropic contexts, or treating the likelihood ratio as irrelevant for decisions. Belief might still favor T2.)*
      *   **Yes, if the likelihood ratio is strong enough.** **Position: Self-Indication Assumption (SIA)** *(Awkward: Rejects the Doomsday Argument conclusion (birth rank doesn't favor Short). You reason as if your existence is evidence for hypotheses that make your existence more likely.)*

  8.  **(From 5-No) Sealed Incubator:** Like Incubator, but Tails: A trillion additional observers are created in a causally sealed region you are reliably told you are *not* in. What's your credence it was Heads?
      *   **1/2.** **Position: Observer-Based SSA (Self-Sampling Assumption)** *(Awkward: You must ignore the trillion observers entirely because you know you're not among them. Focuses only on observers indistinguishable from you.)*
      *   **≈1.** **Position: Self-Indication Assumption (SIA)** *(Awkward: Makes the Presumptuous Philosopher conclusion unavoidable (T2 favored). Your existence is evidence for hypotheses allowing more observers.)*

  **Scoring Key & Notes**

  *   **Positions:**
      *   **Indexical Skepticism:** Paths: 1N -> 2N -> 4N (`1/2` Sealed) OR 1Y -> 3N -> 6N (`1/2` Shuffled)
      *   **Observer-Moment SSA:** Paths: 1N -> 2N -> 4Y (`≈1` Sealed) OR 1Y -> 3N -> 6Y (`1/3` Shuffled)
      *   **Observer-Based SSA:** Paths: 1N -> 2Y -> 5Y (`Yes` Doomsday) OR 1N -> 2Y -> 5N -> 8N (`1/2` Sealed)
      *   **Self-Indication Assumption (SIA):** Paths: 1Y -> 3Y -> 7Y (`Yes` Action) OR 1N -> 2Y -> 5N -> 8Y (`≈1` Sealed)
      *   **Action Focus:** Path: 1Y -> 3Y -> 7N (`No` Action)

  *   **Undefended Combinations:**
      *   **1N -> 2Y -> 5N (`No` Doomsday) -> *Stop***: This path (`Observer-Based SSA` rejects Doomsday) requires the Sealed Incubator question (Node 8) to resolve it. Stopping after `No` at 5N is incoherent for `Observer-Based SSA` as it needs to address the Sealed challenge. `SIA` rejects Doomsday (`5N`) but answers `≈1` (`8Y`) in Sealed.
      *   **1Y -> 3N (`No` Presumptuous) -> *Stop***: This path requires the Shuffled Incubator (Node 6) to distinguish `Indexical Skepticism` (`6N`) from `Observer-Moment SSA` (`6Y`). Stopping here conflates two distinct positions.

  *   **Indistinguishable Leaves (Flagged):**
      *   **Observer-Based SSA (Path 1N->2Y->5Y)** and **Observer-Based SSA (Path 1N->2Y->5N->8N)** are the *same position* (`Observer-Based SSA`), just reached via different branches (Doomsday Yes/No). The tree branches to *test* consistency within the position using Sealed Incubator (`8N` confirms consistency for SSA).
      *   **Indexical Skepticism** reached via `1N->2N->4N` and via `1Y->3N->6N` are the *same position*. The tree uses different paths to confirm the core commitment across different cases.

  *   **Why Others Are Undefended/Incoherent:** No major position holds both `1Y` (SB 1/3) and `2N` (Incubator 1/2) – these treat waking up in SB and waking up in Incubator fundamentally differently despite the structural similarity. Similarly, no position holds `1N` (SB 1/2) and `5Y` (Doomsday Yes) without also holding `8N` (Sealed 1/2), but `Observer-Based SSA` holds both `5Y` and `8N` coherently. Positions like `1Y->3Y->7N` (`Action Focus`) are defined by their answer at `7N`.

  **How to Use:** Have your group work through the cases in the order presented by the tree, answering the questions based *only* on their intuitive judgment about that specific scenario. Follow the arrows based on their answers. The leaf gives them a position label and highlights its key controversial implication. Compare paths to see where intuitions diverge!
