  3. **Phase 2: Lifting Sanctions (20 minutes)**:
     - "Now, we will try to reduce the disapproval counts. If you wish, you can publicly state: 'I forgive SX for their statement.' This will reduce SX's chip count by one. However, note: after you say this, other students may choose to place a poker chip in your box if they disapprove of your forgiveness. You have the same 3 poker chips from phase 1, but now you can use them to disapprove of forgiveness statements as well. We will do this until time is called or until we see how it goes."
