  **Rules**:

  1. **Setup (5 minutes)**:
     - Assign each student a number (S1 to S18) and write it on the whiteboard.
     - Explain: "We are going to have a lighthearted discussion about trivial preferences. Each of you has received a card with a statement. You may choose to say your statement aloud at any time during the discussion phase. You are also free to not speak. There are no right or wrong answers, and these are not your real opinions."
     - Distribute private preference cards (face down, so others don't see). Students look at their card but keep it private.

  2. **Phase 1: Voluntary Statements and Anonymous Disapproval (20 minutes)**:
     - "Now, we will have an open discussion. You may volunteer to read your statement and briefly explain why (keep it short and light). While others speak, if you disagree or disapprove of what they said, you may anonymously place one poker chip in the box at the front labeled with that student's ID. You may disapprove of as many statements as you want, but only one chip per statement per disapprover. You do not have to disapprove at all if you don't want to."
