  - Poker chips (one color, at least 50 total for 18 students).
  - Index cards: 
    - 18 preference cards (each with a trivial statement, e.g., "Pineapple belongs on pizza", "Cats are better than dogs", "Winter is the best season", etc.). The instructor shuffles and distributes randomly, so only the instructor knows the distribution.
  - Whiteboard: Set up a table with:
    - Column 1: Student ID (S1 to S18, assigned at start)
    - Column 2: Disapproval Chips (initially 0 for each)
    - Column 3: Forgiveness Points (optional, for phase two)

