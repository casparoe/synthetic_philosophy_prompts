  We are designing a classroom simulation for an upper-division seminar on the ethics of punishment. The goal is to have students experience two asymmetries between legal punishment and decentralized social sanction:

  1. **Fixed Quantity vs. Accumulation**: Legal punishment is fixed in quantity (with a set sentence), while social sanction accumulates without a predetermined end.
  2. **The Ratchet Effect**: Sanctioning is cheap, anonymous, and easy to join, while lifting a sanction requires an identifiable and costly act of forgiveness that few are willing to perform.

  The activity must:
  - Use only index cards, poker chips, and a whiteboard.
  - Be completed in 75 minutes.
  - Involve 18 students.
  - Focus on a trivial invented controversy to avoid real arguments.
  - Sanction only statements made within the game, not real beliefs.
  - Include private preference cards (only known to the instructor), voluntary speech, anonymous disapproval, a persistent record, and a second phase where the group tries to lift a sanction.
  - Debrief by mapping specific moments to the asymmetries.

  **Brainstorming Candidate Mechanics:**

  1. **Mechanic A: "The Color Debate"**
     - **Setup**: Students are given a private preference card (unknown to others) with a color (e.g., blue or yellow). They then debate which color is better. Disapproval is registered by placing a poker chip in a jar labeled with a student's ID when they speak for their color. The whiteboard records the number of chips per student. In phase two, students try to remove chips by publicly forgiving.
     - **Rejection Reason**: This might lead to real arguments about colors (even if trivial) and the disapproval mechanic is tied to speaking, which might not capture accumulation well. Also, the color debate might feel too arbitrary and not engage students.

  2. **Mechanic B: "The Rule Proposal"**
     - **Setup**: Students propose arbitrary rules (e.g., "everyone must hop on one foot when entering the room"). Others can anonymously add a poker chip to a jar for any proposal they dislike. The whiteboard tracks the number of chips per proposed rule. Later, they try to remove chips by publicly supporting a previously sanctioned rule.
     - **Rejection Reason**: The focus on rules might make the disapproval about the rule, not the person, which doesn't fully capture personal sanction. Also, the act of proposing might be uneven (some students might not propose anything).

  3. **Mechanic C: "The Trivia Statement Game" (Chosen)**
     - **Setup**: Students make voluntary, trivial statements (e.g., "I think pineapples belong on pizza") during a discussion. Others can anonymously add a poker chip to a box corresponding to the speaker's ID to register disapproval. The whiteboard records the accumulated chips per student. In phase two, students try to reduce a student's chip count by publicly stating forgiveness, but this exposes them to potential sanction.
     - **Why Chosen**: 
       - It ensures the controversy is trivial and invented (no real stakes).
       - Disapproval is attached to the act of speaking in the game, not the person or real beliefs.
       - The accumulation is clear and visible on the whiteboard.
       - The forgiveness phase directly addresses the ratchet effect because publicly forgiving might lead to others disapproving of the forgiver.

  **Final Design: "The Trivia Statement Game"**

  **Materials**:
  - Index cards (one per student for private preferences, and some for writing statements if needed)
  - Poker chips (about 5-10 per student, in two colors: one for disapproval, one for forgiveness? But wait, forgiveness is public, so no chips needed for that. Only disapproval is anonymous and uses chips.)
  - Whiteboard with a grid: rows for student IDs (e.g., S1 to S18), columns for "Disapproval Chips" and later "Forgiveness Attempts" (but forgiveness is public and recorded by the instructor, so maybe just a tally for forgiveness?).

  Actually, we don't need two colors. Disapproval is anonymous with chips, and forgiveness is public and recorded on the whiteboard by the instructor.

