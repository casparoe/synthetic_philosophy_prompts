  ### Understanding the Coin Flip Bet

  Let's break down the bet, the expected value, the issues with simulation, the impact of a payout cap, the effect of playing multiple times, and the validity of your roommate's point. I'll address each part of your query clearly, explaining the reasoning step by step, so you can see where the reasoning in your group went astray.

  #### 1. **The Expected Value of the Payout**
  The payout depends on the flip number \(n\) where the first heads appears:
  - If \(n\) is odd, you gain \(+\frac{2^n}{n}\) dollars.
  - If \(n\) is even, you lose \(-\frac{2^n}{n}\) dollars (i.e., you pay your friend).

  The probability of the first heads occurring on flip \(n\) is \(\frac{1}{2^n}\) (since it requires \(n-1\) tails followed by heads). The expected value (EV) of the payout \(X\) is calculated as:
  \[
  E[X] = \sum_{n=1}^{\infty} \left( (-1)^{n+1} \frac{2^n}{n} \right) \cdot \left( \frac{1}{2^n} \right) = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}.
  \]
  This is the alternating harmonic series, which converges to \(\ln(2) \approx 0.693\) dollars (about 69 cents). So, your friend is correct that the expected payout is approximately 69 cents.

  **Why is this well-defined?** Although the series is conditionally convergent (meaning it converges but not absolutely, since \(\sum \frac{1}{n}\) diverges), it is well-defined here because the terms are summed in the natural order of \(n\) (i.e., sequential flips). The Riemann rearrangement theorem shows that conditionally convergent series can be rearranged to sum to any value, but in probability contexts like this, the order is fixed by the outcome (flip number), so the expected value is unambiguously \(\ln(2)\). Claims that it's "undefined" are incorrect in this setup—it's a fact of the matter.

  #### 2. **The Simulation Problem: Why It Didn't Converge**
  You experienced instability in your simulation because the random variable \(X\) has infinite variance. Here's why:
  - The expected value \(E[X] = \ln(2)\) is finite, but the expected absolute value \(E[|X|]\) is infinite:
    \[
    E[|X|] = \sum_{n=1}^{\infty} \left| (-1)^{n+1} \frac{2^n}{n} \right| \cdot \frac{1}{2^n} = \sum_{n=1}^{\infty} \frac{1}{n} = \infty \quad (\text{harmonic series divergence}).
    \]
  - Additionally, the second moment \(E[X^2]\) is infinite:
    \[
    E[X^2] = \sum_{n=1}^{\infty} \left( \frac{2^n}{n} \right)^2 \cdot \frac{1}{2^n} = \sum_{n=1}^{\infty} \frac{2^n}{n^2} = \infty,
    \]
    since the terms \(\frac{2^n}{n^2}\) grow exponentially. Thus, the variance \(\text{Var}(X) = E[X^2] - (E[X])^2\) is infinite.

  **Consequences for simulation:** With infinite variance, the sample mean (running average) does not converge to \(E[X]\) in a stable way. Rare but extreme values (e.g., very large gains or losses for high \(n\)) cause the average to "lurch" dramatically when they occur, even with many samples. Running more simulations won't help—it's a fundamental property of the distribution, not a sampling issue. Your ML friend's suggestion to "run more samples" is flawed because the problem isn't insufficient data; it's that the law of large numbers doesn't apply strongly here due to \(E[|X|] = \infty\).

  #### 3. **Impact of a Payout Cap**
  Your friend has about $30,000 in savings, so realistically, she can't pay out enormous sums like the \(\frac{2^{20}}{20} \approx \$52,428\) for \(n=20\). Imposing a cap changes the expected value slightly but doesn't alter the key conclusion.

  - **With a cap of \(M = 30,000\):** For \(n \leq 19\), the payout is unchanged (since \(\frac{2^{19}}{19} \approx 27,594 < 30,000\)). For \(n \geq 20\), the payout magnitude is capped at \(M = 30,000\) with the same sign rules. The expected value with cap, \(E_{\text{cap}}[X]\), is:
    \[
    E_{\text{cap}}[X] = \sum_{n=1}^{19} (-1)^{n+1} \frac{1}{n} + \sum_{n=20}^{\infty} (-1)^{n+1} \cdot 30,000 \cdot \frac{1}{2^n}.
    \]
    The first sum (up to \(n=19\)) is approximately 0.7188, and the tail sum (for \(n \geq 20\)) contributes about \(-0.0191\), yielding:
    \[
    E_{\text{cap}}[X] \approx 0.7188 - 0.0191 = 0.6997 \quad (\text{about 70 cents}).
    \]
    This is very close to the uncapped \(\ln(2) \approx 69.3\) cents. The small difference arises because the tail probabilities (e.g., \(P(n \geq 20) = 1/2^{20} \approx 9.54 \times 10^{-7}\)) are tiny, so capping has minimal impact on expectation.

  - **Why your friend is wrong about the cap "not mattering":** While the probability of high \(n\) is small, those events dominate the variance and risk because the payouts are enormous. Capping reduces the (infinite) variance to finite, making the bet more stable and insurable. In practice, a cap is essential because it bounds your potential losses and makes simulations converge. Ignoring it is reckless, even if the EV change is minor.

  #### 4. **Playing Once vs. 200 Times**
  You pay $1 per play to enter the bet. The net gain per play is \(Y = X - 1\), with \(E[Y] = E[X] - 1 \approx 0.693 - 1 = -0.307\) dollars (a loss of about 31 cents per play).

  - **Playing once:** With \(E[Y] \approx -31\) cents, the expected net gain is negative, so paying $1 to play is a bad deal on average. Additionally, due to the heavy tails (infinite variance), there's a small chance of a huge win (e.g., +$27,594 for \(n=19\)) or huge loss (e.g., -$52,428 for \(n=20\)), making it risky even if the EV were positive.

  - **Playing 200 times:** The total net gain is \(S = \sum_{i=1}^{200} Y_i\), where each \(Y_i\) is i.i.d. with \(E[Y_i] \approx -0.307\). Thus:
    \[
    E[S] = 200 \times (-0.307) \approx -61.4 \text{ dollars}.
    \]
    Repetition makes the expected loss larger in magnitude, not smaller. Your friend claims that "repetition favors you because of positive EV," but this is mistaken—the payout EV is positive but less than the $1 entry cost, so net EV is negative. Repetition amplifies the expected loss.

  - **Does repetition make EV reasoning more legitimate?** Your other friend is partially correct: for well-behaved random variables (finite variance), repetition reduces the impact of variance via the law of large numbers, making the average outcome closer to the EV. But here, with infinite variance, \(E[|X|] = \infty\), so the average of repeated plays may not converge to \(E[X]\), and rare extreme outcomes can dominate. For example:
    - With 200 plays, \(P(\text{a large } |X| \text{ event})\) is still small (e.g., \(P(n \geq 19) \approx 1.9 \times 10^{-6}\), so for 200 plays, probability of at least one such event is about \(3.8 \times 10^{-4}\)), but if it occurs, it could swing your total net gain by tens of thousands. Thus, repetition doesn't "stabilize" the bet or justify paying $1 per play.

    With a cap, variance is finite, and repetition would help, but the negative net EV remains the issue.

  #### 5. **Your Roommate's Point: "You Lose Most of the Time"**
  Your roommate argues that paying $1 to play is "stupid" because you lose small amounts frequently and big wins are rare. This is a valid risk-aversion point but slightly misstated. Let's clarify:
  - Probability of a net gain (\(Y > 0\)): This occurs when \(n\) is odd (you gain \(\frac{2^n}{n} > 0\)), so \(P(Y > 0) = P(n \text{ odd}) = \frac{2}{3}\).
  - Probability of a net loss (\(Y < 0\)): This occurs when \(n\) is even (you lose \(\frac{2^n}{n}\)), so \(P(Y < 0) = P(n \text{ even}) = \frac{1}{3}\).
  - However, when you lose, the losses tend to be larger in magnitude than the gains for small \(n\) (e.g., for \(n=1\), net gain is +$1; for \(n=2\), net loss is -$3). On average, the expected net loss is -31 cents, as calculated.

  **Why it's a real objection:** Even though you "win" (have a net gain) 2/3 of the time, the wins are often small (e.g., +$1 for \(n=1\), which has probability 1/2), while the less frequent losses (1/3 of the time) can be severe (e.g., -$3 for \(n=2\) or -$5 for \(n=4\)). This asymmetry, combined with the heavy tail risk, makes the bet unattractive for risk-averse individuals. Your roommate is right that paying $1 is unwise, but not because you "lose most of the time"—you actually win more often, but the losses hurt more.

  ### Who Was Reasoning Badly and Why
  - **Your friend (the dice tower enthusiast):** She is correct that the expected payout is ~69 cents but wrong that you should pay $1 to play (since net EV is negative). She underestimates the risk of high-\(n\) events (especially without a cap) and wrongly thinks repetition favors you (it makes the expected loss worse). Her dismissal of the cap is flawed because high-\(n\) events, while rare, are critical for risk.
  - **Your ML friend:** Suggesting "run more samples" ignores that the non-convergence is due to \(E[|X|] = \infty\), not insufficient data. More samples won't stabilize the average.
  - **The "undefined expected value" friend:** While conditionally convergent series can be rearranged theoretically, in this context (summing by flip order), the EV is well-defined as \(\ln(2)\). Calling it "undefined" is a technicality that doesn't apply here.
  - **Your roommate:** Correctly points out the risk but misstates the win/lose probabilities. The core issue is the negative net EV and heavy tails, not just "losing most of the time."

  ### What You Should Do
  - **Do not pay $1 to play this bet, even once.** The expected net loss is about 31 cents per play, and the infinite variance makes it highly volatile. With a cap, the EV is similar but safer, but the net loss remains.
  - **For 200 plays at $1 each:** Definitely decline. The expected total loss is about $61.40, and the heavy tails mean you could face massive losses (or gains) with non-negligible probability.
  - **If you want to play "fairly":** The bet is worth ~69 cents, so paying less than that (e.g., 50 cents per play) would give a positive net EV. However, due to high variance (even with a cap), only consider this if you're risk-neutral and can absorb large losses. Realistically, with a cap, it becomes a reasonable high-variance bet.

  **Final takeaway:** The bet's expected payout is indeed ~69 cents, but paying $1 to play it is a losing proposition. Capping payouts reduces risk without changing EV much, and repetition doesn't help. Your roommate's risk aversion is justified, and your friend's enthusiasm is misplaced. If this keeps eating at you, counteroffer a lower entry fee (e.g., 60 cents) with a cap—but only if you enjoy high-stakes gambling!
