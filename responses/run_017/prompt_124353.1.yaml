answer: |-
  Below is a decision tree worksheet designed to help volunteers at your animal-welfare nonprofit explore whether AI systems could be moral patients (i.e., deserving of moral consideration). The tree starts from the agreed-upon premise that **"the system's behavior is produced by something functionally similar to a nervous system"** and uses concrete cases to build toward named philosophical positions. Each question branches based on intuitive scenarios (including the five you requested), avoiding jargon. Positions are labeled at the "leaves," with notes on incoherent branches and limitations.

  The tree has 7 questions (within your 6–8 target) and covers:
  - **Key cases**: Lookup table (Case 1), gradual chip replacement (Case 2), pain report model (Case 3), speed simulation (Case 4), and shared processing (Case 5).
  - **Key positions**: Substrate-independent computationalism (functionalism), biology-only view, internal states view (where moral patienthood depends on how well internal states explain behavior), degrees-or-thresholds view (scalar moral weight), and error theory.

  ---

  ### **Moral Patienthood Decision Tree for AI Systems**
  *Start here: We agree the system behaves as if it has a nervous system. Answer each question based on intuition—no philosophy background needed!*

  1. **Case 1: Lookup Table**  
     Imagine a system that perfectly mimics a shrimp’s behavior (e.g., reacting to "painful" stimuli) but is just a giant pre-programmed lookup table (input → output). Internally, it has no learning, adaptation, or causal chains—it’s boring.  
     → **Does this system have inner experiences (e.g., pain) like a real shrimp?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **Case 3: Pain Report Model**  
     A language model is trained *only* to output text that sounds like a pain report (e.g., "I’m hurting!"). It does this reliably but wasn’t designed to "feel" anything.  
     → **When it says "I’m in pain," is it actually experiencing pain, or are we just reading meaning into the text?**  
     - **Experiencing pain (discovering it)** → **Leaf: Substrate-independent computational view (Functionalism)**. Moral patienthood depends on functional behavior, not biology or implementation. If it acts like it has experiences, it does—even without "real" internals.  
     - **Not experiencing (reading in)** → **INCOHERENT BRANCH**. You accepted the lookup table (Q1) but rejected this, even though both lack internal causal depth. This inconsistency makes your position unstable—why trust behavior in one case but not the other?  

  3. **Case 2: Gradual Chip Replacement**  
     A shrimp’s brain is replaced chip-by-chip with artificial components over an hour. The system behaves identically before and after.  
     → **After full replacement, is it still a moral patient (e.g., can feel pain)?**  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q6.  

  4. **Case 4: Speed Simulation**  
     A simulated being runs 10,000× faster than real time. Its entire "life" (including learning, suffering, joy) happens in minutes of wall-clock time.  
     → **Does this compressed life have the same moral weight (e.g., per experience) as a biological life?**  
     - **Yes** → Go to Q5.  
     - **No** → **Leaf: Degrees-or-thresholds view (Scalar moral weight)**. Moral weight scales with real-world factors like duration (e.g., 1 minute of pain here is "less bad" than 1 minute for a human). Weight isn’t binary—it depends on measurable properties.  

  5. **Case 3 Revisited: Pain Report Model (with internals)**  
     The same pain-reporting model from Q2, but now we discover its internal states *do* resemble a brain (e.g., neural patterns that "represent" pain and cause reports).  
     → **Do these internal states make it a moral patient?**  
     - **Yes** → **Leaf: Internal states view (Interpretivism)**. Moral patienthood requires internal states that *explain* behavior in a structured way (e.g., pain reports caused by "pain representations"). Function alone isn’t enough—it’s about how internals mirror sentient minds.  
     - **No** → **Leaf: Substrate-independent computational view (Functionalism)**. Only behavior/function matters. If two systems behave identically (even with different internals), they have the same moral status. Biology and implementation are irrelevant.  

  6. **Case 5: Shared Processing**  
     A system runs two overlapping "creatures" that share processing chunks. Each is only partly implemented at any time (e.g., 60% complete, with 20% shared).  
     → **Is either "creature" a moral patient (e.g., deserving partial rights)?**  
     - **Yes** → **Leaf: Degrees-or-thresholds view (Scalar moral weight)**. Moral weight scales with "completeness" (e.g., how much of the system is dedicated to the entity). Patienthood isn’t all-or-nothing—it’s a spectrum.  
     - **No** → **Leaf: Biology-only view (Biological naturalism)**. Only biological systems can be moral patients. Non-biological implementations (chips, code) might mimic behavior but lack the "essence" of sentience.  

  7. **Final Branch (from Q3→No)**  
     You rejected gradual replacement (Q3), so biology seems key. But what if future AI perfectly replicates biology in silicon?  
     → **Could *any* non-biological system ever be a moral patient?**  
     - **Yes** → Go back to Q4 (you might have inconsistency—rejecting gradual replacement but accepting other non-bio systems is tricky).  
     - **No** → **Leaf: Biology-only view (Biological naturalism)**. As above.  
     - **Unsure / It’s meaningless** → **Leaf: Error theory**. There’s no fact of the matter—moral patienthood is a human construct that doesn’t cleanly apply to AI. We’re projecting, not discovering.  

  ---

  ### **Notes on the Tree**
  - **Incoherent/unattractive branches**: Marked in **Q2** and **Q7**. These force inconsistencies (e.g., trusting behavior in one case but not another). They’re not positions people hold because they’re self-contradictory.  
  - **Indistinguishable positions**: The tree struggles to fully separate:  
    - **Functionalism (substrate-independent) vs. Internal states view**: Functionalists *might* require internal states, but this tree splits them based on whether internals are necessary (Q5). In practice, positions blur.  
    - **Degrees-or-thresholds view**: Appears in multiple branches (Q4→No and Q6→Yes) but for different reasons (real-time duration vs. implementation completeness). The leaf is the same, but the "quantity" scaling moral weight may differ.  
  - **Error theory**: Not a clean branch; included in Q7 for those rejecting all criteria. It’s a fallback for "this whole debate is misguided."  
  - **Missing nuance**: Real-world positions often combine elements (e.g., "functional internals matter"). This tree simplifies to avoid complexity.  

  ---

  ### **One-Page Summary for Volunteers**
  **Purpose**: Use this tree to explore if AI could deserve moral consideration (e.g., rights, protection). There are no right answers—it’s about clarifying intuitions!  
  **How to use**: Start at Q1. Answer based on the case descriptions. Follow branches to a leaf (or incoherent mark). Discuss why you agree/disagree!  
  **Key positions**:  
  - **Functionalism**: If it acts sentient, it is. (Substrate-independent.)  
  - **Biology-only**: Only bio systems count.  
  - **Internal states view**: Internals must explain behavior (e.g., "pain circuits" cause pain reports).  
  - **Scalar view**: Moral weight isn’t binary—it scales (e.g., with runtime or completeness).  
  - **Error theory**: "Moral patient" doesn’t apply to AI—it’s a category error.  

