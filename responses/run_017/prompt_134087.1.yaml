prompt: |-
  Right, so my mate and I spent about three hours in the pub last night arguing about whether you're ever allowed to just *assume* independence when you're giving a heuristic argument, and I've come away realising neither of us had any idea what a decent rule would even look like.

  I was defending the number theory way of doing it: treat divisibility by each prime as an independent coin flip, read off an estimate, then go back and patch it for the local obstructions you can actually see — the classic one being that once you've ruled out divisibility by 2 and 3 and so on, the candidates that are left aren't spread as evenly as the naive model says, which is why the naive estimate for how often twin primes turn up is off by that product-over-primes correction factor. He said that's just assuming what you want to prove, and that when these models break they break for reasons you can't see from the inside: he reckons there's a result from the eighties showing the random model gets the fluctuations in the number of primes in a short interval badly wrong, because of correlations with smooth numbers that no local check would have flagged. I think he's right that it breaks and I still think the method is fine, and I couldn't say why, which is definately the annoying bit.

  So: don't give me a theory, give me the spec. What would a formal account of the presumption of independence have to deliver for me to trust the numbers that come out the other end — good enough to decide whether a back-of-envelope estimate is worth betting on or pointing a research programme at, not good enough to prove anything. Every requirement with the case that motivates it, and mark which ones are non-negotiable and which are just one camp's preference.

  Things I want covered, but add what I've missed:

  - What the relata even are — events, propositions, or the *reasons* backing them — and whether independence of reasons aggregates the way probabilistic independence does when you chain twenty weak ones together.
  - What the probability is over. Every heuristic I can think of is secretly a frequency in some chosen ensemble, and you can usually pick the ensemble to get roughly the answer you like, so the rule has to say which ensemble and either be stable across reasonable choices or tell you when it isn't.
  - The regress: saying p and q are independent needs its own independence assumptions somewhere further up. Does the rule have to have a stopping point, and if so what earns it.
  - No free lunch: it can't manufacture confidence. A dozen shaky but independent-looking considerations shouldn't compound into near-certainty, and I want the total capped somehow by how good the independence claim itself is.
  - Locality: whether the verdict on a whole argument has to match what you get by checking its parts, given that the failures we actually know about are the global ones no part-by-part check would catch.
  - What defeats it and what shouldn't: a hint of a real mechanism should, but mere logical entanglement shouldn't — on any honest probability everything is a bit dependent on everything, and if the presumption dies to that it was never alive.

  Then: which pair of requirements do you think can't be jointly satisfied, because that's the bit I most want to see, and which single one rules out the most candidates — my guess is the maximum-entropy move dies on the ensemble one. Under 700 words, start at requirement one, a table is fine, no preamble.
reasoning: |-
  Okay, the user is asking for a formal specification (a "spec") for when it's acceptable to assume independence in heuristic arguments, especially in number theory. They want a list of requirements with motivating cases, indicating which are non-negotiable and which are preferences. They also want to see which requirements conflict and which single requirement is the strictest.

  First, I need to cover all the points they mentioned: relata, probability space, regress, no free lunch, locality, and defeaters. Plus, they want to know what pairs of requirements can't coexist and which requirement is most exclusionary.

  Starting with relata: What entities are considered independent? Events or propositions are the usual relata. But the user is concerned about the reasons backing them. For example, in the twin primes case, divisibility by different primes is treated as independent events, but the reasons might have hidden dependencies. Non-negotiable: Relata must be events or propositions. Preference: Avoid mixing reasons unless they're clearly separable.

  Next, the probability space. Heuristics often use frequencies over an ensemble. The problem is cherry-picking ensembles to get desired results. Non-negotiable: The ensemble must be asymptotically natural, like intervals [1,N] as N→∞. Preference: Stability across similar ensembles, like arithmetic progressions.

  Then the regress problem. Assuming independence for p and q requires justifying that assumption, which might need further assumptions. Non-negotiable: The assumption must be verifiable at a higher level (e.g., via mean/variance checks). Preference: Higher-level checks should use different methods to avoid circularity.

  No free lunch is about not gaining unwarranted confidence. If each of many weak independent assumptions is slightly shaky, their combination shouldn't lead to high certainty. Non-negotiable: Overall confidence should be capped by the weakest link. Preference: Use conservative estimates, like taking minimum probabilities.

  Locality refers to whether checking parts individually ensures the whole is correct. But in cases like the Cramér model for primes in short intervals, local checks miss global correlations (e.g., smooth numbers affecting clustering). Non-negotiable: Global error signals must not be ignored. Preference: Prefer models where locality holds, but require validation.

  Defeaters: What invalidates the independence assumption? A known mechanism (like sieve methods showing dependencies) should defeat it, but logical dependencies alone shouldn't. Non-negotiable: Empirical counterexamples defeat the assumption. Preference: Theoretical reasons can also defeat if they explain discrepancies.

  Now, conflicting requirements. For example, locality (part-by-part checks) vs. global error signals. In the prime gaps example, local checks don't catch the smooth number correlations, so insisting on locality would miss the actual error. Thus, these two can't both be satisfied strictly.

  The most exclusionary requirement is probably the ensemble choice. Many heuristic models fail here because the choice of probability space can be arbitrary, leading to different answers. Maximum entropy methods often assume uniform priors, which might not hold in natural ensembles.

  I need to ensure each point is covered concisely, under 700 words, starting with requirement one. Using a table format as suggested, but in text. Mark non-negotiable vs. preference clearly. Highlight the conflict between locality and global errors, and why ensemble choice is the strictest.
answer: |-
  Here's the spec for a formal account of presumption of independence in heuristic arguments, structured as requested. Non-negotiable (NN) requirements are essential for trust; preferences (P) reflect methodological rigor but admit flexibility.

  | Requirement                  | Description & Motivation                                                                 | NN/P | Key Case Example                                                                 |
  | :--------------------------- | :--------------------------------------------------------------------------------------- | :--- | :------------------------------------------------------------------------------- |
  | **1. Relata Definition**     | Independence must hold between **events/propositions** (e.g., "n divisible by p_i"), not "reasons". Chaining weak independences aggregates probabilistically *only if* relata are events. Reasons introduce unquantifiable epistemic dependencies. | NN   | Twin primes: Independence of divisibility by distinct primes (events) is tractable; independence of sieve arguments (reasons) is not. |
  | **2. Probability Space**     | The ensemble must be **asymptotically natural and unique** (e.g., integers ≤ N as N→∞). Stability across similar ensembles (e.g., arithmetic progressions) is required. Reject ensembles chosen post-hoc to match desired outcomes. | NN   | Primes in [x, x+y]: Ensemble must be x→∞, y=f(x); choosing y=√x vs. y=log²x changes results arbitrarily. |
  | **3. Regress Handling**      | Independence assumptions **must be checkable at a higher level** (e.g., mean/variance predictions). No infinite regress—earn stopping by empirical/mathematical validation of aggregated predictions. | NN   | Prime k-tuples: Naive independence → predicted counts; discrepancy (e.g., Hardy-Littlewood constant) validates/patchable. |
  | **4. No Free Lunch**         | Overall confidence **capped by the weakest link**. A chain of n independent-but-shaky assumptions (each confidence c<1) cannot exceed confidence ~c, not cⁿ. Prevents false certainty. | NN   | 20 "independent" heuristics each 90% certain → net confidence ≤90%, not (0.9)²⁰≈12%. |
  | **5. Locality vs. Globality**| The model **need not satisfy locality** (independence of parts ensuring whole). Global error signals (e.g., unmodeled correlations) override part-by-part checks. | P    | Cramér model: Locally "independent" primes, but global error (actual prime gaps ≠ random) due to smooth number correlations (Maier '85). |
  | **6. Defeaters**             | **Empirical counterexamples** or **identified mechanisms** defeat independence (e.g., sieve constraints). Mere logical/universal dependencies (e.g., shared axioms) do *not* defeat—else nothing independent. | NN   | Twin primes: Modular constraints (e.g., both >3) defeat full independence; but universal correlations (e.g., "both odd") are patchable. |

  ### Conflict & Strictest Requirement
  - **Irreconcilable Conflict**: Requirement 5 (allow global errors) vs. Requirement 3 (checkability). Global errors (e.g., Maier's theorem) emerge from unseen correlations, making them impossible to "check" locally or at any finite level. You cannot demand both global safety *and* stepwise-verifiable assumptions.
  - **Strictest Single Requirement**: Requirement 2 (ensemble choice). It rules out most candidates (e.g., maximum entropy models) because natural asymptotic ensembles are rare. Heuristics often implicitly select ensembles that hide dependencies (e.g., "random" subsets of integers vs. structured sets). Stability across ensembles fails frequently—e.g., random matrix models for zeta zeros work in one ensemble but not coarser ones.
