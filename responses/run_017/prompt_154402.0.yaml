answer: |-
  ### Decision Procedure for Determining "Disease"  
  This procedure integrates the biostatistical, harmful-dysfunction, and normativist accounts while blocking common pitfalls. It prioritizes factual questions first, defers value judgments to the claimant/tribunal, and uses medical consensus as a tiebreaker. Questions must be answered in sequence; stop at any "no" unless specified. The panel must document each step in their written reasons.

  #### Step 1: **Biostatistical Dysfunction?**  
  *Ask: Is there a statistically subnormal contribution of a part or mechanism, using an established reference class?*  
  - **Sufficient answer**:  
    - **Yes** → Proceed to Step 3.  
      *Requires:*  
      - An objective, pre-agreed reference class (e.g., age/sex-matched population from peer-reviewed guidelines).  
      - Data showing the claimant falls below a statistically defined threshold (e.g., ≤5th percentile, or outside 2 SDs from the mean).  
    - **No** → Proceed to Step 2.  
      *If:*  
      - The trait is statistically normal within the claimant’s reference class (e.g., age cohort).  
    - **Unanswerable** → Proceed to Step 2.  
      *If:*  
      - No agreed reference class exists, baseline data is unavailable, or the trait has a smooth/unimodal distribution (no clusters).  
  - **Block pitfalls**:  
    - Reference class must be pre-defined (e.g., from WHO, NIH, or specialist guidelines). **Do not** select/adjust reference classes case-by-case.  
    - **Ignore** treatment availability, job performance, or suffering at this step.  

  #### Step 2: **Evolutionary Dysfunction?**  
  *Ask: Is there a failure of a part/mechanism to perform its natural biological function?*  
  - **Sufficient answer**:  
    - **Yes** → Proceed to Step 3.  
      *Requires:*  
      - Evidence of a malfunction relative to the mechanism’s evolutionary purpose (e.g., heart pumping blood, lens focusing light).  
      - Supported by medical consensus (e.g., textbooks, diagnostic manuals).  
    - **No** → Proceed to Step 4.  
      *If:*  
      - The condition is an evolved response (e.g., fever, grief) or statistically normal aging.  
    - **Unanswerable** → Proceed to Step 4.  
      *If:*  
      - No consensus on the mechanism’s natural function (e.g., emerging conditions).  
  - **Block pitfalls**:  
    - **Do not** infer dysfunction from harm, treatment, or suffering.  
    - Dysfunction ≠ statistical subnormality (Step 1 covers this).  

  #### Step 3: **Harm?**  
  *Ask: Does the condition cause harm?*  
  - **Sufficient answer**:  
    - **Yes** → **Disease confirmed** (harmful-dysfunction account). Stop.  
      *Requires:*  
      - Harm is **legally recognized** (e.g., pain, disability, mortality risk defined in statute/policy) or **medically uncontroversial** (e.g., blindness, paralysis).  
      - Harm must apply to **both entitlements** (treatment and leave).  
    - **No** → **Not a disease**. Stop.  
      *If:*  
      - No demonstrable harm (e.g., asymptomatic lab abnormality).  
    - **Value judgment needed** → **Hand off to the claimant/tribunal**.  
      *If:*  
      - Harm is subjective (e.g., job-specific impairment, social disadvantage) or not covered by law.  
      - *Who decides:* The **tribunal** (on appeal) assesses values. The panel must state: *"Harm requires societal value judgment; we defer to the tribunal."*  
  - **Block pitfalls**:  
    - **Do not** accept suffering alone. Harm must be linked to the dysfunction.  
    - **Ignore** treatment availability.  

  #### Step 4: **Medical Consensus?**  
  *Ask: Do established medical authorities classify this as a disease?*  
  - **Sufficient answer**:  
    - **Yes** → **Disease confirmed** (normativist view). Stop.  
      *Requires:*  
      - Inclusion in ICD, DSM, or guidelines from major bodies (e.g., AMA, Royal Colleges).  
    - **No** → **Not a disease**. Stop.  
      *If:*  
      - Absent from consensus sources (e.g., "internet addiction" not in ICD-11).  
  - **Block pitfalls**:  
    - **Do not** equate "effective treatment" with disease status.  

  ---

  ### Application to Cases  
  #### (a) 34-year-old with distractibility  
  - **Step 1**: Unimodal distribution, cut-off set by vote → **Unanswerable** (no clusters; arbitrary threshold).  
  - **Step 2**: Distractibility ≠ evolutionary dysfunction (attention varies naturally; no consensus mechanism failure) → **No**.  
  - **Step 4**: Not in disease manuals (unless ADHD, but trait alone isn’t classified) → **No**.  
  **Decision**: Not a disease.  

  #### (b) 68-year-old with presbyopia (loss of near focus)  
  - **Step 1**: Statistically normal for age → **No**.  
  - **Step 2**: Lens mechanism fails natural function (focusing light) → **Yes** (medical consensus: e.g., ICD-11 H52.4).  
  - **Step 3**: Harm (disability for reading/daily tasks) is uncontroversial → **Yes**.  
  **Decision**: Disease.  

  #### (c) Claimant with severe/prolonged bereavement  
  - **Step 1**: Normal grief is statistically expected → **No**.  
  - **Step 2**: Grief is an evolved response (not dysfunction) → **No**.  
  - **Step 4**: Not classified as disease (ICD-11 excludes "normal" grief; "prolonged grief disorder" requires dysfunction) → **No**.  
  **Decision**: **Not a disease** per the procedure.  
  **Note**: The procedure returns "no" despite your view that leave should be granted. Entitlements for non-disease conditions (e.g., social support) require policy changes, not medical classification.  

  ---

  ### Limitations of the Procedure  
  1. **Systematically undecided cases**:  
     - Conditions with **smooth trait distributions** (e.g., mild depression, chronic pain) lacking clear dysfunction.  
     - **Emerging conditions** without medical consensus (e.g., long COVID pre-consensus).  
     - **Value-dependent harms** (e.g., infertility in childfree person) – relies on tribunal judgments.  

  2. **Judgment calls disguised as procedure**:  
     - **Step 2 (Evolutionary function)**: "Natural function" interpretations vary (e.g., menopause).  
     - **Step 3 (Harm)**: "Uncontroversial harm" is subjective (e.g., obesity without comorbidities).  
     - **Step 4 (Consensus)**: Medical guidelines change (e.g., homosexuality was once pathologized).  

  3. **Other gaps**:  
     - **Ignores treatability**: Conditions like presbyopia are diseases even if easily corrected.  
     - **Over-relies on consensus**: Lags behind science (e.g., autoimmune diseases historically misclassified).  
     - **Binary outcome**: Fails gradations (e.g., "pre-disease" states like prediabetes).  

  This procedure balances efficiency with rigor but cannot resolve all debates. It ensures transparency for appeals and highlights where society, not medicine, must decide. Use it to justify decisions—not as a philosophical arbiter.
