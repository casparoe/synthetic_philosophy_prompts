        - Check if the condition causes one or more of the following (as defined by law or regulation):
            a) Pain
            b) Suffering
            c) Disability (inability to perform activities of daily living or work duties)
            d) Increased risk of death or future illness
        - If the law does not define harm, then we must use a standard of "generally accepted as harmful by the medical community" or by society. But this is vague.

