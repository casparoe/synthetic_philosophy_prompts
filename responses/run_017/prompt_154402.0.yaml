  We are designing a decision procedure for a panel that must decide whether a claimant's condition counts as a "disease" for two purposes: entitlement to publicly funded treatment and paid medical leave. The procedure must be based on the philosophical debates about the concept of disease and must avoid common pitfalls. The procedure will be structured as a series of questions, with clear stopping points and hand-offs when values are involved.

  Key principles:
  1. We must avoid conflating the two purposes (treatment and leave) with the definition of disease. The same condition must be a disease for both or neither.
  2. The procedure must be factual as much as possible, but when value judgments are required, they must be handed to the appropriate body (the legislature or the public, via the tribunal or a higher authority).
  3. We must block:
     a) Choosing a reference class to get the desired outcome.
     b) Using the existence of effective treatment as evidence of disease.
     c) Treating suffering alone as sufficient.

  Steps of the procedure:

  1. **Is there a statistically subnormal contribution of a part or mechanism? (Biostatistical account)**
     - We look for a failure of a part or mechanism to perform its biological function, measured against a reference class.
     - The reference class must be chosen based on biological and statistical norms, not arbitrarily. We must avoid choosing a reference class to get the desired outcome.
     - If there is no available reference class (e.g., no baseline data) or the trait is smoothly distributed without clusters, we cannot establish subnormality by this account. Then we move to step 2.
     - If the condition is statistically normal within the claimant's age cohort (as in the 68-year-old with presbyopia), then by this account, it is not a disease. But note: we might still have a dysfunction when compared to a younger reference class? However, the biostatistical account typically uses a reference class of the same species, same age, same sex, etc. So if we use an age-specific reference class, then presbyopia is normal and not a disease. But if we use a reference class of young adults, then it is subnormal. This is the reference class problem. We must fix the reference class by objective criteria.

     How to fix the reference class? We choose the reference class that is biologically relevant for the function in question. For example:
        - For reproductive functions, we might use an age range of reproductive years.
        - For vision, we might use the age at which the visual system is fully developed and before age-related decline is typical.

     However, the panel is not equipped to set reference classes arbitrarily. Therefore, we rely on established medical consensus for reference classes. If there is an established reference class (e.g., for blood pressure, we have age-stratified norms; for vision, we have norms for different age groups), we use that. If there is no established reference class, we cannot answer this step and must move to step 2.

     **Sufficient answer**: 
        - Yes: if there is a statistically subnormal function (based on established reference class) and the deviation is beyond the normal range (e.g., beyond 2 standard deviations, or as defined by the consensus). Then we have a candidate disease by the biostatistical account. We then proceed to step 3 to check for harm.
        - No: if the condition is statistically normal in the relevant reference class. Then we move to step 2.
        - Unanswerable: if there is no established reference class or the distribution is smooth without clusters. Then we move to step 2.

     Note: We do not consider the existence of treatment or harm at this step.

  2. **Is there a dysfunction? (Harmful dysfunction account, part 1)**
     - This step is about whether the condition represents a failure of a mechanism to perform its natural function. This is an evolutionary concept: what the mechanism was designed by natural selection to do.
     - Example: The heart pumps blood. If it fails to pump adequately, that's a dysfunction. But note: in the case of presbyopia, the lens loses elasticity with age. Is that a dysfunction? The lens in a 68-year-old is functioning as expected by natural design? Actually, natural selection doesn't care about post-reproductive ages. So we might say that the natural function of the lens is to focus during the reproductive years, and after that, it's not a dysfunction because there's no natural selection pressure. But this is controversial.

     How do we determine natural function? We rely on established biological and medical knowledge. If the medical community recognizes a condition as a dysfunction (e.g., presbyopia is considered a dysfunction of the lens even though it's age-related), then we accept that.

     **Sufficient answer**:
        - Yes: if there is a recognized dysfunction (by established medical consensus) of a part or mechanism. Then we proceed to step 3 to check for harm.
        - No: if there is no recognized dysfunction. Then we move to step 4 (normativism).
        - Unanswerable: if the medical community does not have a consensus on whether it's a dysfunction. Then we move to step 4.

     Note: We must not confuse this with statistical subnormality. A dysfunction is a failure of a mechanism to perform its natural function, which may or may not be statistically abnormal (e.g., in a population where a disease is endemic, it might be common, but it's still a dysfunction).

  3. **Is there a harm? (Harmful dysfunction account, part 2)**
     - This step requires that the condition causes harm to the individual. Harm is typically understood as reduction in well-being or limitation of opportunities. But note: harm is an evaluative concept. The panel must not impose its own values. Therefore, we must hand off the harm determination to the claimant or society.

     How to determine harm? We ask:
        - Does the condition cause negative consequences that the claimant experiences as harmful? (But note: the claimant might feel harmed by a condition that is not a dysfunction, e.g., being short in a society that values height, but that is not a disease.)
