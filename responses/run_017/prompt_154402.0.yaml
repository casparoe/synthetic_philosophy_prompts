        - Otherwise, we cannot decide harm as a matter of fact. We must hand off the harm question to the tribunal or the legislature. But note: our panel is making decisions that can be appealed to a tribunal, so we can state that we do not have the authority to define harm beyond what is in the law. However, the law may not specify.

