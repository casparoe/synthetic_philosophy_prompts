     - If not, then we stop: not a disease.

     However, we must avoid the pitfall of using the existence of treatment. The fact that there is treatment does not make it a disease. But if the medical community recognizes it as a disease, that is the normativist view.

     **Sufficient answer**:
        - Yes: if the condition is recognized as a disease by established medical consensus (e.g., in diagnostic manuals, or by specialist societies). Then we have a disease by the normativist view. We then note that this is a value-laden determination and might be challenged, but we defer to medical authority.
