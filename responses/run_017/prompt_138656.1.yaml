     Independence: If B is preferred to A, then D should be preferred to C. So if you choose B and then C, you are violating independence (because then you have B > A and C > D, but independence requires that if B > A then D > C). 

     So the only consistent pairs are:
       - A and C: because then A > B and C > D (and independence requires that if A > B then C > D, which holds).
       - B and D: because then B > A and D > C (and independence requires that if B > A then D > C, which holds).

     The inconsistent pairs are:
       - A and D: A > B and D > C -> but independence requires that if A > B then C > D, so D > C contradicts.
       - B and C: B > A and C > D -> independence requires that if B > A then D > C, so C > D contradicts.

     Therefore, we have two consistent patterns and two inconsistent ones.

     We expect the most common inconsistent pattern to be A and D.

  **Debrief Script:**
  - "Let's look at two of the decisions you made. In Round 1, there was a decision between a sure 300 tickets and a gamble (10% of 1000, 89% of 300, 1% of 0). In Round 2, there was a decision between a 11% chance of 300 tickets and a 10% chance of 1000 tickets. I'm going to write on the board the four ways you could have chosen:

        Pattern 1: Safe in Round 1 (300 for sure) and Safe in Round 2 (the 11% chance of 300)
        Pattern 2: Safe in Round 1 and Gamble in Round 2 (the 10% chance of 1000)
        Pattern 3: Gamble in Round 1 (the 10/89/1) and Safe in Round 2
        Pattern 4: Gamble in Round 1 and Gamble in Round 2

     Now, without telling me which you are, let's see by a show of hands how many of you are Pattern 1? Pattern 2? Pattern 3? Pattern 4?"

     - Record the counts.

     - "Notice that in both decisions, the two options have a common element. In the first decision, the common element is the 89% chance of 300 tickets: in the safe option you get 300 in that branch too (because it's for sure) and in the gamble you get 300 in that branch. In the second decision, the common element is the 89% chance of 0: in the first option (11% chance of 300) you get 0 in 89% of the cases, and in the second option (10% chance of 1000) you get 0 in 90% of the cases (which is almost the same). 

     The theory of expected utility says that your preference between the two options in each decision should not be affected by what happens in the common branch because it's the same in both. So if you preferred the safe option in the first decision, then you should prefer the option that gives 300 with 11% in the second decision. And if you preferred the gamble in the first, you should prefer the option that gives 1000 with 10% in the second. 

     Patterns 1 and 4 are consistent with this. Patterns 2 and 3 are not. 

     Many people choose Pattern 2: safe in the first and gamble in the second. Why might that be? In the first decision, the safe option offers a guarantee. Even though the gamble has a high chance of the same 300, the 1% chance of 0 and the 10% chance of 1000 might make the safe option attractive. But in the second decision, there is no safe option: both are gambles. So you might be more willing to take the gamble that offers a slightly lower chance of a bigger prize because you are already facing risk. 

     But note: the common branch in the first decision is the 89% chance of 300. If you ignore that common branch, then what's left? In the safe option, you have 11% chance of 300 (and 89% of 300, which we ignore). In the gamble, you have 11% chance of the rest: 10/11 chance of 1000 and 1/11 chance of 0? Actually, it's the same as the second decision! 

     That is, the first decision, after removing the common 89% of 300, becomes:
       - Safe: 11% chance of 300
       - Gamble: 10% chance of 1000 and 1% chance of 0.

     But note: 11% chance of 300 versus 10% chance of 1000 and 1% chance of 0 is exactly the second decision. So if you are consistent, you would choose the same way in both. But in the first decision, the common branch (89% of 300) is present, and in the second decision, it is replaced by 89% of 0. 

     The independence axiom says that the common branch should not matter. 

     So if you chose Pattern 2, then in the first decision you were influenced by the fact that 89% of the time you would get 300 regardless, but in the second decision, 89% of the time you get nothing regardless. That common branch might have made you more risk averse in the first decision because you didn't want to risk losing the 300 that was almost certain. But in the second decision, there was no such thing to lose.

     This is a common pattern. It doesn't mean you are irrational, but it does mean that your choices are not consistent with the independence axiom of expected utility theory. And that is why we have the expected utility theorem: it tells us that if your preferences satisfy axioms like independence, then you can be represented as maximizing expected utility."

  **Handling Different Patterns:**
  - For Pattern 1 (safe in both): "Some of you were consistently risk averse. That is consistent with expected utility if you have a concave utility function, and it satisfies the independence axiom."
  - For Pattern 4 (gamble in both): "Some of you were consistently attracted to the gamble with the higher expected value or perhaps you are risk seeking. That too is consistent with the independence axiom."
  - For Pattern 2 (safe then gamble): "This is the pattern we just discussed. It's common and it violates the independence axiom. It shows that the context of the common branch matters to you."
  - For Pattern 3 (gamble then safe): "This pattern is less common, but it also violates the independence axiom. It might be due to a different kind of reasoning, perhaps regret in the first gamble that made you more cautious in the second? But note, the common branch in the first decision was 89% of 300, so if you took the gamble and lost, you might have regretted it. But in the second decision, there was no safe option, so why become more cautious? This is also an inconsistency."

  **Potential Pitfalls and Solutions:**
  1. **Students not believing payouts:** 
     - We are actually giving out raffle tickets and drawing for a real prize. We do it in class. We also resolve one decision per round (randomly selected) so they see the randomness and the payouts.

  2. **1% chance of nothing being read as 0%:** 
     - Emphasize: "1% means one ball in 100, so it is possible but unlikely." In the bingo cage, if ball 100 comes up, it happens.

  3. **Early naming of the paradox:** 
     - We don't name the paradox until after the choices. We disguise the two critical decisions among fillers and in separate rounds. We also don't project the decisions (use handouts) so it's harder to compare. We also don't tell them they are related.

  4. **Anchoring by one student:** 
     - Have them write choices privately on response cards. Then collect and resolve without discussion until the debrief.

  5. **Session collapsing into debate on risk aversion:** 
     - In the debrief, focus on the inconsistency pattern, not risk aversion per se. Note that risk aversion is rational and consistent, but the flip is the issue.

  **What the Activity Cannot Reproduce:**
  - The independence axiom is a principle about preferences over compound lotteries. We are not testing compound lotteries directly. We are testing two separate choices that are related by a common consequence. The axiom itself is a normative principle that is not directly observable. We are showing that the common consequence affects choices, which violates the axiom.

  **Weakest Step:**
  - The weakest step is the scaling: using raffle tickets might not create the same psychological weight as real money. Also, the prize is shared by raffle, so the marginal utility of tickets might not be linear. But we hope the excitement of a desirable prize compensates.

  - Another weak point: the two decisions are separated by time and filler, but students might still notice the similarity. We try to avoid that by using different numbers and structures in the fillers.

  **What Would Make Me Withdraw the Design?**
  - If the raffle system fails to engage the students because the prize is not desirable enough. Solution: let them choose the prize in advance.

  - If the 1% event happens in the first round for a student who chose the gamble and they get 0, they might be upset and then in the second round they might avoid gambles. But note: the decision that counts is randomly selected, and only one decision per round is played. So the chance that the critical decision is selected and then the 1% happens is low (1/3 * 1/100 = 1/300). We can live with that.

  - The weakest step in the argument is that we are assuming that the students are evaluating the gambles in isolation. But in reality, they are accumulating raffle tickets from two rounds. This might lead to a portfolio effect. But note: the raffle is at the end, so the tickets are additive. The utility of tickets might be linear if the prize is fixed. So it should be okay.

  **Minute-by-Minute Timeline:**
  - 0-5 min: Introduction and rules.
  - 5-20 min: Round 1 decisions (hand out response cards, they choose, collect).
  - 20-30 min: Resolve Round 1 (draw which decision, then resolve that decision for each student, record raffle tickets).
  - 30-45 min: Round 2 decisions (same).
  - 45-55 min: Resolve Round 2 and record raffle tickets.
  - 55-60 min: Raffle drawing and award prize.
  - 60-75 min: Debrief (as above).

  **Exact Wordings:**

  **Handout for Round 1:**
  "Round 1: For each decision, circle your preferred option. One of these three decisions will be randomly selected to count. For the selected decision, if you chose a gamble, we will draw a random number from 1 to 100 to determine your outcome.

  Decision 1.1:
     Option A: 50 raffle tickets for sure.
     Option B: 60% chance of 100 raffle tickets and 40% chance of 0 raffle tickets.

  Decision 1.2:
     Option A: 300 raffle tickets for sure.
     Option B: 10% chance of 1000 raffle tickets, 89% chance of 300 raffle tickets, 1% chance of 0 raffle tickets.

  Decision 1.3:
     Option A: 200 raffle tickets for sure.
     Option B: 50% chance of 400 raffle tickets and 50% chance of 0 raffle tickets."

  Similarly for Round 2.

  **Introduction Script:**
  "Today we are going to make decisions that will earn you raffle tickets for a chance to win [prize]. We have a bingo cage with balls numbered 1 to 100. In each round, you will make three decisions. After you make your choices, we will randomly select one of the three decisions to count by drawing a ball from 1-3 (1 for first decision, 2 for second, 3 for third). Then, for the selected decision, if you chose an option that involves a gamble, we will draw a ball from 1 to 100 to determine your outcome. For example, if a gamble says '60% chance of 100 tickets', then if the ball drawn is between 1 and 60, you get 100 tickets; 61-100, you get 0. We will do this for each of you individually. At the end of class, we will put one raffle ticket into the bingo cage for every ticket you earned. Then we draw one ticket, and the owner wins the prize."

  **Conclusion:**
  This design addresses the scale by using a raffle to amplify the stakes and disguise by embedding the critical decisions in two separate rounds with fillers. It also provides a clear debriefing structure to highlight the violation of the independence axiom without naming the Allais paradox until after the choices.
