  ### **Design for In-Class Activity: Rational Choice and the Independence Axiom**  
  **Goal:** Students experience a preference reversal due to a common consequence, without recognizing the Allais paradox until choices are locked. Real stakes are simulated via a raffle system with a £40 prize.  

  **Core Mechanics:**  
  - **Currency:** Raffle tickets for a desirable £40 prize (e.g., popular gadget, bookstore voucher). Students care because:  
    - Prize is tangible/selected by them earlier.  
    - Tickets scale psychological stakes (e.g., 1 ticket = £0.04, but framed as "chances" to win big).  
  - **Randomization:** Bingo cage with 100 balls (1–100) resolves gambles.  
  - **Disguise:** Two critical decisions embedded in separate rounds with filler choices. Filler use distracting numbers/contexts to prevent pattern recognition.  
  - **Stakes Scaling:** Loss frame avoided (emotionally charged). Instead, use **gain framing with peer comparison**—students see peers earn tickets, amplifying FOMO.  

  **Why Raffle Tickets Work:**  
  - £40 prize feels substantial for students.  
  - High ticket numbers (e.g., 300 tickets) create "large" psychological stakes.  
  - Linearity assumption holds: Double tickets = double win probability.  

  **Weakness of Third-Party Variant:**  
  - **Problem:** Routing the common branch to charity introduces altruism/rivalry, muddying self-interest.  
  - **Solution:** Avoid it. Use classic design but with tickets.  

  ---

  ### **Step-by-Step Activity**  
  **Total Time:** 75 minutes  
  **Materials:**  
  - Response cards (paper) for each round.  
  - Bingo cage, 100 balls.  
  - £40 prize on display.  
  - Pre-filled board with choice tables (no projector needed).  

  #### **Phase 1: Introduction (5 min)**  
  **Script:**  
  *"Today, you’ll make real choices affecting your odds of winning this prize. Each decision earns raffle tickets. At the end, one ticket is drawn from the cage—if it’s yours, you win. More tickets = better odds. We’ll do two rounds. In each, you’ll answer three questions. One question per round will be randomly selected to count. If your chosen option has risk, we’ll spin the cage to determine your tickets. Write choices privately—no discussing."*  

  #### **Phase 2: Round 1 (20 min)**  
  **Choices on Response Card:**  
  1. **Filler 1:**  
     - A: 40 tickets for sure.  
     - B: 75% chance of 50 tickets, 25% chance of 0 tickets.  
  2. **Critical Decision 1 (Disguised as "Safe vs. Good Gamble"):**  
     - A: 150 tickets for sure.  
     - B: 90% chance of 150 tickets, 10% chance of 450 tickets.  
  3. **Filler 2:**  
     - A: 70% chance of 100 tickets, 30% chance of 0 tickets.  
     - B: 100% chance of 75 tickets.  

  **Instructions:**  
  - *"Circle A or B for each. One question will be picked randomly to count."*  

  **How It Disguises:**  
  - "Safe vs. Good Gamble" masks Allais Structure. Filler 1 uses small stakes; Filler 2 reverses risk/safe labels.  
  - Numbers chosen so 150/450 feel meaningfully different (450 = 3x 150).  

  #### **Phase 3: Resolve Round 1 (10 min)**  
  1. Draw a ball (1–3) to pick which question counts.  
  2. For the selected question, resolve gambles:  
     - E.g., If Critical 1 is selected and a student chose B: Draw a ball. 1–90 = 150 tickets; 91–100 = 450 tickets.  
  3. Record tickets earned privately.  

  #### **Phase 4: Round 2 (20 min)**  
  **Choices on Response Card:**  
  1. **Filler 3:**  
     - A: 20% chance of 200 tickets, 80% chance of 0 tickets.  
     - B: 25% chance of 160 tickets, 75% chance of 0 tickets.  
  2. **Critical Decision 2 (Disguised as "Risky vs. Very Risky"):**  
     - C: 10% chance of 150 tickets, 90% chance of 0 tickets.  
     - D: 9% chance of 450 tickets, 91% chance of 0 tickets.  
  3. **Filler 4:**  
     - A: 100 tickets for sure.  
     - B: 50% chance of 210 tickets, 50% chance of 0 tickets.  

  **How It Disguises:**  
  - Critical 2 uses C/D labels (not A/B), different probabilities (10% vs. 9%), and filler stakes vary.  
  - "Risky vs. Very Risky" distracts from similarity to Critical 1.  

  #### **Phase 5: Resolve Round 2 and Raffle (10 min)**  
  1. Resolve one random question from Round 2 (as in Round 1).  
  2. Sum tickets for each student.  
  3. Add tickets to bingo cage (e.g., student with 150 tickets adds 150 slips with their name).  
  4. Draw one slip; award prize.  

  ---

  ### **Debrief (15 min)**  
  **Script:**  
  *"Let’s revisit two decisions many found tough: Round 1’s ‘Safe vs. Good Gamble’ (A/B) and Round 2’s ‘Risky vs. Very Risky’ (C/D). I’ll plot choices on the board."*  

  **Board Layout:**  
  ```  
            Round 2: C      Round 2: D  
  Round 1: A | (A,C)         | (A,D)  
  Round 1: B | (B,C)         | (B,D)  
  ```  
  - Poll students secretly (heads down/hand raise): *"No judgment—just want to see patterns."*  
  - Record counts in each quadrant.  

  #### **Key Responses for Each Pattern:**  
  1. **(A,C) or (B,D): Consistent with independence axiom.**  
     - *"These choices align with a core rule of rational choice: if you prefer safety when the ‘background’ is good (150 tickets likely either way), you also prefer safety when the background is bad (0 tickets likely). Or vice versa. This is rational under expected utility."*  
  2. **(A,D): Classic Reversal (violates independence).**  
     - *"Many of you chose safety in Round 1 but the bigger gamble in Round 2. Why? In Round 1, the safe option felt like a ‘sure win’—you didn’t want to risk losing 150 tickets when odds were good. But in Round 2, both options were risky, so you chased the bigger prize. Yet notice: the 150 tickets you ‘protected’ in Round 1 were never guaranteed—90% of the time, you’d get them even if you gambled! The only difference was that 10% chance of 450. When we remove the identical 90% outcome, Round 1 becomes identical to Round 2."*  
  3. **(B,C): Less common reversal.**  
     - *"You gambled in Round 1 but played safe in Round 2. Maybe after risking it, the 10% chance of 150 in Round 2 felt more valuable? But again, the underlying gamble after removing the common 90% is the same as Round 2."*  

  **Connect to Theory:**  
  - *"The ‘common branch’ here is the 90% outcome: in Round 1, it’s 150 tickets in both options; in Round 2, it’s 0 tickets. Rational choice says this branch shouldn’t affect your preference—but for many, it did. This is a violation of the independence axiom, which says ‘if two options share a common outcome, your preference shouldn’t change if we replace that outcome with another common one.’*  
  - *"Does this mean you’re irrational? Not necessarily. Emotions like certainty effect (overweighting guaranteed wins) or regret (fearing ‘what if I lose?’) drive this. But it does mean your choices can’t be explained by expected utility theory—which requires independence."*  

  **Preempt Pitfalls:**  
  - **"Payouts won’t be honored":** Resolve gambles publicly with bingo cage. Award prize visibly.  
  - **"1% chance seen as 0%":** Use round numbers (10%, 90%, not 1%/89%). Say: *"10% means 10 balls in 100—it’s real."*  
  - **"Debate on risk aversion":** Preempt: *"Risk aversion is rational. Today is about consistency: why do we treat identical gambles differently when the ‘background’ changes?"*  
  - **Student names paradox early:** Ignore; say *"We’ll discuss names later—first, let’s see your choices."*  

  ---

  ### **What This Cannot Replicate**  
  1. **The independence axiom’s full scope:** Students must be told that independence forbids *any* influence from common outcomes. The activity shows one violation; the axiom covers all cases.  
  2. **Normative verdict on rationality:** The flip feels vivid, but students may still defend it as emotionally rational ("avoiding regret is smart"). The debrief must acknowledge this tension.  

  ---

  ### **Why I Might Withdraw This Design**  
  - **Weakest Link:** **Filler choices fail to distract.** If students notice the 150/450 pattern across rounds, they self-correct. Signs: whispers like *"Wait, this is like before!"* or no reversal pattern in polling.  
  - **Contingency Plan:** If <20% show reversal, pivot: *"Interesting! Usually, people flip—let me show why that happens…"* and present the paradox as a common intuition.  
  - **Weakest Step:** **The debrief’s leap to rationality.** A sharp student could say: *"Independence assumes I value outcomes the same in all contexts. But I don’t—certainty is special!"* This is defensible. The activity makes violation vivid but can’t prove irrationality.  

  **Final Word:** This design balances stakes, disguise, and pedagogy. Run it as-is—it’s battle-ready for Thursday.
