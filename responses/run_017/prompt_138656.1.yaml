  We are designing an in-class activity to elicit the Allais paradox without naming it, using real stakes within a £40 budget. The key challenges are scale (making the stakes psychologically real) and disguise (preventing students from noticing the connection between the two decisions and editing their choices for consistency).

  **Core Insight:** Instead of monetary payoffs, we use a "prize raffle" system where students earn raffle tickets for chances to win a desirable prize. This allows us to create large "hypothetical" stakes (like millions of dollars) by having the raffle tickets represent a scaled-up value, but the actual cost to us is the prize (within budget). The raffle also adds excitement and makes the small stakes more engaging.

  **Design Overview:**
  1. **Prize:** We purchase a desirable prize (or let the class choose one in a previous session) within the £40 budget. The prize is displayed but not distributed until the end.
  2. **Raffle Tickets:** Students earn raffle tickets through the decisions they make. Each raffle ticket gives them one chance in a bingo cage drawing at the end for the prize.
  3. **Two Decisions:** We present two separate decision problems (with filler) such that the common consequence is masked. The two decisions are:
     - **Decision 1:** Between a sure thing (moderate number of tickets) and a gamble (high chance of fewer tickets, low chance of many more).
     - **Decision 2:** Between two gambles: one that offers a moderate chance of the same moderate number of tickets and a low chance of zero, and another that offers a slightly lower chance of the same high number of tickets and a high chance of zero.

  To disguise, we present the two decisions in two separate rounds, each as part of a set of multiple decisions (with filler). The filler decisions should be simple and non-tempting to avoid fatigue.

  **The Two Critical Decisions (Disguised):**

  Let the prize be worth, in raffle tickets, a large number, say 1000. But note: the actual prize is fixed, so we are scaling the utility by the number of tickets. We design:

  **Decision 1 (Safe vs. Risky with a common good outcome):**
  - Option A (Safe): 300 tickets for sure.
  - Option B (Risky): 80% chance of 100 tickets, 20% chance of 1000 tickets.

  **Decision 2 (Risky vs. Riskier with a common bad outcome):**
  - Option C: 25% chance of 300 tickets, 75% chance of 0 tickets.
  - Option D: 20% chance of 1000 tickets, 80% chance of 0 tickets.

  Note: The common consequence in the first decision is the 80% chance of 100 tickets (in B) vs. the 80% chance of 100 tickets (in A? Actually, note that in A, the 80% branch doesn't exist because A is safe). We need to reframe to match the Allais structure.

  **Standard Allais Pair:**
  - Problem 1: A: 1M for sure. B: 89% chance of 1M, 10% chance of 5M, 1% chance of 0.
  - Problem 2: C: 11% chance of 1M, 89% of 0. D: 10% chance of 5M, 90% of 0.

  In Problem 1, the common branch is 89% of 1M (which is present in both A and B, but in A it is the whole 100% and in B it is 89% of the time you get 1M and 10% you get 5M and 1% 0). In Problem 2, the common branch is 89% of 0 (which is present in both C and D: in C, 89% of the time you get 0 and 11% 1M; in D, 90% of the time you get 0 and 10% 5M).

  We need to mimic that with our raffle tickets.

  **Revised Critical Decisions:**

  Let:
  - Let the "large" prize in tickets be 1000 (which is the maximum).
  - Let the "moderate" prize be 300.

  Then:

  **Decision 1 (Safe vs. Risky):**
  - Option A: 300 tickets for sure.
  - Option B: 10% chance of 1000 tickets, 89% chance of 300 tickets, 1% chance of 0 tickets.

  **Decision 2 (Two gambles):**
  - Option C: 11% chance of 300 tickets, 89% chance of 0 tickets.
  - Option D: 10% chance of 1000 tickets, 90% chance of 0 tickets.

  But note: the common branch in Decision 1 is 89% of 300 tickets (which occurs in both A and B) and in Decision 2 the common branch is 89% of 0 tickets (which occurs in both C and D). The difference is that in Decision 1, the 89% branch of 300 is shared, and in Decision 2, the 89% branch of 0 is shared.

  However, we have a problem: in Decision 1, Option A is 100% of 300, which can be seen as (89% of 300 + 11% of 300). But Option B is 89% of 300, 10% of 1000, and 1% of 0. So the common branch (89% of 300) is indeed present in both.

  Now, the issue with scale: we are using raffle tickets, so the 300 and 1000 are arbitrary. The key is that the expected value of B is higher than A (if we assume linear utility in tickets): 
  - EV(A) = 300
  - EV(B) = 0.89*300 + 0.1*1000 + 0.01*0 = 267 + 100 = 367.

  But we expect risk aversion for the sure thing. Similarly, in Decision 2:
  - EV(C) = 0.11*300 = 33
  - EV(D) = 0.1*1000 = 100.

  So D has a much higher EV. But note: we are not teaching EV, we are teaching EU and the independence axiom. The paradox is that many people choose A in Decision 1 and D in Decision 2, which violates independence.

  **Masking the Connection:**
  We present each decision as part of a set of 3 decisions (so two filler decisions per set). The filler decisions should be simple and not involve the same numbers. We run the two sets in two separate rounds.

  **Filler Decisions:**
  - For Round 1 (with Decision 1):
    - Filler 1: A choice between 50 tickets for sure and 60% chance of 100 tickets (and 40% of 0).
    - Filler 2: A choice between 200 tickets for sure and 50% chance of 400 tickets.

  - For Round 2 (with Decision 2):
    - Filler 3: A choice between 10% chance of 1000 tickets and 100% chance of 100 tickets.
    - Filler 4: A choice between 30% chance of 300 tickets and 50% chance of 200 tickets.

  We change the numbers and structures to avoid pattern recognition.

  **Third-Party Variant:**
  We can also use the variant you suggested to make the common branch not affect the chooser. For example, in Decision 1, we could have the 89% branch of 300 tickets go to a charity (or a class fund) instead of the chooser. Then:

  **Decision 1 Variant:**
  - Option A: 300 tickets for sure (to the chooser).
  - Option B: 10% chance of 1000 tickets (to chooser), 89% chance of 300 tickets (to charity), 1% chance of 0 (to chooser).

  Now, from the chooser's perspective, the 89% branch is irrelevant because they get nothing in that branch in B (it goes to charity) and they get 300 in A. So the chooser sees:
  - A: 300 for sure.
  - B: 11% chance of something (10% of 1000 and 1% of 0) and 89% of nothing (but charity gets 300).

  But note: this changes the problem. Now Option A is 300 for sure. Option B is a 10% chance of 1000, 1% chance of 0, and 89% chance of 0 (to the chooser). So the chooser's payoff in B is actually: 10% of 1000, 90% of 0? Because the 89% branch gives the chooser 0. So it becomes:

  - Option A: 300 for sure.
  - Option B: 10% chance of 1000, 90% chance of 0.

  This is not the same as the original Decision 1. The original Decision 1 had a high chance (89%) of getting 300 in B. Now that is gone. This changes the risk profile. So we cannot use this variant for Decision 1 because it becomes a completely different choice.

  Alternatively, we could have the common branch go to the chooser in both options? But then it doesn't help. 

  I think the variant you proposed is not sound for mimicking the common consequence. Instead, we stick with the classic design but use raffle tickets to scale.

  **Implementation with Real Stakes:**
  - We need a random device. We have a bingo cage. We can use it to draw random numbers. We can have balls numbered 1 to 100 for the probabilities.

  **Procedure:**
  1. **Introduction (5 minutes):** 
     - "Today we are going to make some decisions that will affect your chances of winning the prize [show prize]. Each decision will earn you raffle tickets. At the end of class, we will draw one raffle ticket from the bingo cage, and the owner of that ticket wins the prize. The more tickets you have, the higher your chance."
     - Explain that they will make decisions in two rounds. Each round has 3 questions. They will write their choices on a response card for the round.

  2. **Round 1 (15 minutes):**
     - Distribute response cards for Round 1 with three decisions (two fillers and the critical Decision 1). 
     - Read the instructions: "For each question, circle your preferred option. We will resolve the outcomes at the end of the round using the bingo cage. One of these three decisions will be randomly selected to count (by drawing a ball from 1 to 3). Then, for the selected decision, we will resolve the gamble (if any) by drawing a ball from 1 to 100 to determine the outcome. Then you will receive the raffle tickets accordingly."
     - This way, they take each decision seriously because any one might be played.

     The three decisions (written on a projected slide or handout, but without the projector? We can write on the board beforehand? Or use handouts?):

     **Decision 1.1 (Filler):** 
       - Option A: 50 raffle tickets for sure.
       - Option B: 60% chance of 100 raffle tickets and 40% chance of 0 raffle tickets.

     **Decision 1.2 (Critical - disguised):** 
       - Option A: 300 raffle tickets for sure.
       - Option B: A gamble that gives:
          - 10% chance of 1000 raffle tickets
          - 89% chance of 300 raffle tickets
          - 1% chance of 0 raffle tickets

     **Decision 1.3 (Filler):** 
       - Option A: 200 raffle tickets for sure.
       - Option B: 50% chance of 400 raffle tickets and 50% chance of 0 raffle tickets.

     They circle their choices for all three.

  3. **Resolve Round 1 (10 minutes):**
     - Draw a ball from 1-3 to select which decision counts.
     - Then, for the selected decision, if it involves a gamble, draw a ball from 1-100 to resolve it. 
     - If the critical decision is selected and a student chose Option B, then we draw: 
          - 1-10: 1000 tickets
          - 11-99: 300 tickets
          - 100: 0 tickets
     - Record the raffle tickets earned for each student for Round 1.

  4. **Round 2 (15 minutes):**
     - Similarly, three decisions:

     **Decision 2.1 (Filler):** 
       - Option A: 100 raffle tickets for sure.
       - Option B: 10% chance of 1000 raffle tickets and 90% chance of 0 raffle tickets.

     **Decision 2.2 (Critical):**
       - Option C: 11% chance of 300 raffle tickets and 89% chance of 0 raffle tickets.
       - Option D: 10% chance of 1000 raffle tickets and 90% chance of 0 raffle tickets.

     **Decision 2.3 (Filler):** 
       - Option A: 30% chance of 300 raffle tickets and 70% chance of 0 raffle tickets.
       - Option B: 50% chance of 200 raffle tickets and 50% chance of 0 raffle tickets.

     They circle choices.

  5. **Resolve Round 2 (10 minutes):** Same as Round 1.

  6. **Raffle and Prize Drawing (5 minutes):** 
     - Collect all raffle tickets (each student has some from Rounds 1 and 2). Put one ticket per raffle ticket into the bingo cage (so if a student earned 300 tickets, they get 300 chances). Draw one ticket and award the prize.

  **Debrief (15 minutes):**
  - Without naming the paradox, ask students to share their choices for the two critical decisions (without revealing which they were at the time). Write on the board the four combinations:
     - Safe in 1 and Safe in 2 (A and C)
     - Safe in 1 and Gamble in 2 (A and D)
     - Gamble in 1 and Safe in 2 (B and C)
     - Gamble in 1 and Gamble in 2 (B and D)

  - Note that the first two combinations (Safe in both, or Safe then Gamble) are consistent with the independence axiom? Actually, the independence axiom would require that if you prefer A to B in the first problem, then you should prefer C to D in the second? Let's see:

     The independence axiom says that if you prefer A to B, then for any other lottery L and probability p, you prefer the compound lottery pA + (1-p)L to pB + (1-p)L. 

     In our case, the two problems are related by a common consequence. The classic pattern is A in the first and D in the second, which violates independence. 

     So the combinations that violate independence are:
     - A and D: because A is chosen over B in the first, but D is chosen over C in the second. But note: in the first problem, A is safe 300, B is the gamble. In the second, C is the 11% chance of 300, D is the 10% chance of 1000. So if you choose A over B, then by independence you should choose C over D? Why?

     Actually, we can write the lotteries in terms of a common consequence. Let L be getting 0 with probability 1. Then:

     Problem 1:
       A = 300 for sure = 0.11 * (300) + 0.89 * (300)   [but this is not a compound lottery with L]

     Alternatively, we can write:

     Option B: 0.89 chance of 300, 0.1 of 1000, 0.01 of 0.
     Option A: 300 for sure = 0.89 chance of 300, 0.11 chance of 300.

     Now, subtract 0.89 chance of 300 from both (the common branch) and we get:
       A': 0.11 chance of 300
       B': 0.1 chance of 1000, 0.01 chance of 0, and 0.89 chance of 0? 

