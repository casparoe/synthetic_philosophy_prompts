     A: 300 with probability 1.
     B: 300 with prob 0.89, 1000 with prob 0.1, 0 with prob 0.01.

     Now, subtract the 0.89 part that is common? The independence axiom says that if you prefer A to B, then you should prefer:

     A' (which is 300 with prob 1, but now in a context where the 0.89 branch is replaced by a common outcome, say 0) to B' (which is 1000 with prob 0.1, 0 with prob 0.11).

     But note: Problem 2 is exactly A' and B' if the common branch is 0? In Problem 2:
       C: 300 with prob 0.11, 0 with prob 0.89.
       D: 1000 with prob 0.10, 0 with prob 0.90.

     So if you prefer A to B in Problem 1, then by independence (with the common consequence being 0) you should prefer C to D in Problem 2.

     Therefore, the pattern that violates independence is:
       - Choosing A (over B) and D (over C).

     The other patterns are consistent? Let's see:
       - A and C: consistent (risk aversion in both? but note: C is a gamble and A is safe, but in Problem 2, C is the safe-like option? Actually, it's consistent because if you prefer A to B then you must prefer C to D, and if you choose C then you are consistent with that).
