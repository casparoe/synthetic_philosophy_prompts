answer: |-
  ### What I think you're pointing at  
  You're identifying a class of *completeness constraints* essential to grounding structures. These aren't facts *within* the base or dependent layers but *meta-constraints* ensuring the base exhaustively grounds everything it's meant to. They answer: "Is this base *sufficient and complete* for grounding domain X?" Your examples (induction in math, fundamentality claims, Humean laws) share this: the base alone doesn't fix the constraint; it requires a "closure condition" for the grounding relation itself. This isn't a negative existential—it's a *holistic condition* about the base's role as a totality.

  ### Candidates and where each falls short  
  1. **Grounding-theoretic closure principles** (standard):  
     Some frameworks (e.g., Fine's operationalism) use rules like "If Γ grounds P, nothing beyond Γ grounds P." But this formalizes *grounding dependence*, not the *exhaustiveness of the base*. Your "that's-all" ensures the base is the *entire* source—closure rules assume it.  
     
  2. **Generality of facts** (truthmaker theory):  
     Could these be "general facts" (e.g., "All Fs are G")? No: generality is about quantification, while your constraint is *metaphysical exhaustiveness*. "Only these are fundamental" isn't about predicates; it's about the base's completeness for reality.  

  3. **Impredicative definitions** (philosophy of math):  
     In math, "nothing else is a number" is impredicative—it defines a collection by quantifying over itself. But your phenomenon appears outside math (e.g., fundamentality), and impredicativity is syntactic, not metaphysical. Your constraint ensures grounding, not just definitional consistency.  

  4. **Supervenience base exhaustiveness** (metaphysics):  
     Supervenience requires that base fixes higher facts. But your constraint is stronger: it guarantees that the base is *minimally sufficient*. Supervenience allows redundant bases; your "that's-all" rules them out.  

  **Verdict**: None fully fit. Standard grounding frameworks omit this; generality/impredicativity/supervenience lack the *collective dependence* on the base-as-a-whole.

  ### One thing or two  
  It's **one phenomenon with two directions**:  
  - **Downward** ("nothing below"): Ensures the base is fundamental (no hidden layers).  
  - **Upward** ("everything accounted for"): Ensures the base suffices to ground all else.  
  Both are **totality constraints for a grounding domain**. They're two sides of the same coin: a grounding structure requires *both* that the base has no hidden grounds *and* that it grounds everything relevant. Splitting them invites circularity (e.g., if "nothing below" isn't exhaustive, "everything accounted for" fails). The math and fundamentality cases blend both: "only these exist" implies no deeper grounds *and* no missing entities.  

  ### Your test, stress-tested  
  Your test—*"can't break by tweaking the base, only by adding"*—**works but needs refinement**.  
  - **Fits**: "No unicorns" *is* broken only by adding a unicorn. But it fails your collective-dependence criterion: "no unicorns" is a negative existential grounded in *specific base facts* (e.g., particle arrangements), not holistically in the *entire base*.  
  - **Stress test pass**: In your cases, breaking requires *adding to the domain* (extra numbers, fundamental entities, cosmic events), and the constraint depends on the *whole base*: remove one electron, and "only electrons exist" may still hold; add a quark, and it breaks. The base *as a set* matters.  
  **Key distinction**: Boring negatives depend on base *contents*; your constraints depend on base *completeness*.

  ### The name I'd use: **Grounding-set totality**  
  **Definition**: A fact that depends *holistically* on a grounding base being the *exhaustive source* for a domain (e.g., all entities, all truths of type T). It is grounded not in any subset but in the *totality* of the base, ensuring no surplus or deficit in its role.  
  *(My coinage; 70% confidence)*  

  **Boundary cases**:  
  - **Inside**: "The natural numbers are exhausted by 0 and successor."  
    → Depends on the *entire set* of number-grounding facts; tweaking any number doesn't break it, but adding a "junk number" does.  
  - **Outside**: "There are no chairs in this room."  
    → Grounded in specific base facts (arrangements of atoms); not holistic—removing one atom might make it false.  

  ### Where I'd expect to be corrected  
  1. **"It's just a brute fact"**: Specialists might argue totality constraints *are* fundamental (e.g., Sider on structure). Pushback: Your cases show dependence—e.g., Humean laws change if the mosaic expands. I'd concede if shown they lack even holistic grounding.  
  2. **"Reducible to logic"**: Critics may say "nothing else is a number" is a logical truth (∀x(Nx → [x=0 ∨ ∃y(Syx)]). Counter: This presumes a fixed domain—but metaphysics debates what domains *exist*. My view weakens if domain exhaustiveness is always analytic.  
  3. **Directionality split**: A grounding theorist might insist upward/downward constraints play distinct roles (e.g., downward = anti-regress; upward = anti-emergence). I'd revisit if formal models treat them separately.  

  **Confidence**: 80% that this is a unified phenomenon; 60% on the name. Best evidence: Its absence breaks grounding in your examples. If totality constraints aren't acknowledged, grounding chains are incomplete.
