prompt: |-
  I write the codebook for a small annotation team. We label first-person experience reports — a few thousand a week, scraped from a journalling app — and the label that matters downstream is "pleasure." The number our funder actually cares about is a single positive-valence score per person per day, so whatever structure we use internally, the output has to collapse to one number. Annotators are smart but they have a psych BA and about ninety seconds per snippet, we can't ask the writer followup questions, my boss who signs off on the codebook has no philosophy at all, and we need inter-annotator agreement above roughly 0.7 or the contract gets awkward.

  The thing that keeps breaking us is the heterogeneity thing: eating a peach, finishing a hard proof, and scratching an itch reportedly feel like nothing in common, and yet we're supposed to tag all three as pleasure. Our current rule, inherited from a consultant, is basically "tag it pleasure if the person says they'd want more of it," and I'm now fairly sure that's wrong but I can't say why in a way a coder could act on.

  What I want is a decision procedure, not an essay: questions in order, what counts as a sufficient yes at each step, where the answer stops at no, and where it has to be handed to a human because what's left is a values question rather than a factual one. It has to survive the simplification — a coder with no theory has to run it in ninety seconds — and I need it to handle at least these:

  - flow / absorption: three hours vanish, reported as a great day, with no report of anything feeling good at the time
  - relief, itch-scratching, the minute after a pain stops
  - wanting without liking and liking without wanting: the runner who loves the burn, the person who hates that they want the cigarette
  - retrospective vs in-the-moment: "miserable the whole time, glad I did it"
  - pride, hope, being right about something: things people call positive that don't obviously feel like anything in particular
  - mixed cases: funny-but-horrible, the sad movie you'd watch again

  Be explicit about which distinctions from the philosophy survive into the codebook and which you're dropping, and what we lose by dropping them. I gather the big fork is between "pleasure is a felt quality / a hedonic tone experiences have" and "pleasure is an attitude you take toward an experience" — tell me what happens to the daily number if we pick the wrong one, and whether there's a version of the procedure that works tolerably either way. And if the honest answer is that pleasures really don't share a feature and the category is disjunctive, or held together by family resemblance, or by all being the sort of thing you want to continue: I still need a procedure, and I need to know what stops it from tagging literally everything. Our consultant's rule has that problem in spades — wireheading is the obvious reductio, and I've read enough old forum posts about it to know I can't just assert my way out.

  Give me the procedure, then run it on three of the snippets below, including at least one where it gives me an answer I'll hate and immediately try to argue with. Then tell me what the procedure just cannot do, and where I should expect annotators to quietly go off-script.

  1. "Three hours disappeared while I was working on the encryption bug. I didn't notice anything. Later: best day in weeks."
  2. "The toothache stopped. For maybe a minute nothing hurt and it was amazing."
  3. "Ate the whole bag of chips. Didn't even like them. Kept going anyway."
  4. "Finished the 20-miler. Hated every step of mile 18. Doing it again Sunday."
  5. "Found out I was right and Dave was wrong in the group chat. Vindicated? Not exactly good exactly."
  6. "Holdig my nephew. Warm. Nothing else to say."
reasoning: |-
  We are creating a decision procedure for annotators to label a snippet as "pleasure" (1) or not (0). The goal is to collapse to a daily positive-valence score per person. The constraints: annotators have 90 seconds per snippet, no follow-up questions, and we need IAA > 0.7. The main challenge is the heterogeneity of pleasure.

  We'll design a procedure that is:
  - Sequential: questions in order, stopping when possible.
  - Fact-based: relying on explicit or strongly implied statements in the text.
  - Avoiding deep theory: because of time and training constraints.

  Key philosophical issues:
  1. **Felt quality (hedonic tone) vs. Attitude (desire for continuation)**: 
     - If we choose the felt quality approach, we risk missing experiences that are positive but not described with sensory language (e.g., pride, flow). 
     - If we choose the attitude approach (like the consultant's rule: "want more of it"), we risk including things that are not pleasurable in the moment (e.g., addictive behaviors without enjoyment, or relief from pain which might be more about the absence of pain than a positive feeling).

     The daily number might be inflated under the attitude approach because it captures more (including relief, addictive behaviors). Under the felt quality approach, it might be deflated because some positive states (like flow) are not described with feeling words.

     We need a procedure that can work tolerably either way. We'll try to capture both by using multiple criteria but in a way that is actionable.

  2. **What we drop**:
     - We drop the distinction between wanting and liking (due to time and complexity) unless it is explicitly stated in the text. Instead, we rely on the presence of either positive feeling words or expressions of desire for the experience (or continuation) as evidence for pleasure.
     - We drop the in-the-moment vs. retrospective distinction unless the text explicitly contrasts them. We treat retrospective endorsement as evidence of pleasure unless the experience is described as negative at the time and positive only in retrospect (then we might not count it as pleasure because the daily score is about the day's experience). However, note the requirement: the daily score is about the person's day. So if they are glad they did it, that might be a positive for the day, but we are focused on the experience during the day? The contract says: "a single positive-valence score per person per day". We interpret this as about the experiences that occurred during the day. Therefore, if the person says they were miserable the whole time during the run, that experience during the day was negative, even if they are glad afterward. We'll have to decide.

     The procedure will focus on the experience during the event (if described) and use retrospective statements as a fallback.

  3. **Handling mixed cases**: We will allow partial tagging? But note: the output for the day is one number. We are labeling snippets. We might have multiple snippets per day. The daily number is an aggregate of the snippet labels? Or we are to produce one label per day? The problem says: "the output has to collapse to one number" per person per day. So we are labeling snippets and then aggregating (e.g., average or max) to a daily score. Therefore, we can label a snippet as 1 if it contains any pleasure, even if mixed.

     However, the contract doesn't specify how we aggregate. We are only responsible for snippet-level labels.

     We'll design a procedure that outputs 1 if the snippet contains at least one instance of pleasure (by our definition) and 0 otherwise.

  4. **The problem of over-inclusion**: We must avoid tagging everything. The consultant's rule ("tag it pleasure if the person says they'd want more of it") runs into wireheading (i.e., wanting an experience that is not pleasurable) and also includes things that are merely desired but not enjoyed. We'll try to require some positive feeling or retrospective endorsement to narrow it.

  Proposed Decision Procedure:

  We'll use a step-by-step flowchart:

  Question 1: **Does the snippet explicitly use a positive feeling word (or strong synonym) to describe the experience AT THE TIME?** 
     - Examples: "good", "great", "amazing", "enjoyed", "loved", "happy", "pleasure", "delight", "wonderful", "bliss", "content", "satisfied", etc. Also include words that imply positive feeling in context: "warm" (if positive context), "relief", "vindicated" (if described positively).
     - If YES -> tag as pleasure (1). STOP.
     - If NO -> go to Question 2.

  Question 2: **Does the snippet describe a state of absorption or flow that the person retrospectively evaluates as positive?**
     - This is for flow states: if the person says they lost track of time and then later says it was a great day or positive in retrospect, but without in-the-moment feeling words.
     - Criteria: 
          a) The experience involved absorption (e.g., losing track of time, focused).
          b) There is a retrospective positive evaluation of that experience (e.g., "best day in weeks", "loved it", "would do again").
     - If both (a) and (b) are present -> tag as pleasure (1). STOP.
     - Otherwise -> go to Question 3.

  Question 3: **Does the snippet describe the cessation of a negative state (like pain) and express a positive evaluation of that cessation?**
     - This is for relief. We require that the person explicitly states that the state after cessation was positive (e.g., "it was amazing").
     - Example: "the toothache stopped ... it was amazing" -> yes.
     - But note: if they only say the pain stopped and nothing else, we don't have evidence of pleasure. So we require a positive word for the state of relief.
     - If YES -> tag as pleasure (1). STOP.
     - If NO -> go to Question 4.

  Question 4: **Does the snippet explicitly state that the person wanted the experience to continue at the time, OR that they would want to have it again (in the future)? AND is there no explicit statement of disliking the experience at the time?**
     - We are trying to capture wanting without liking? But we have to be cautious because of cases like addiction (where they might want but not like). However, note that in the addiction case, they might explicitly say they didn't like it (like the chips example). So we add the condition: no explicit statement of disliking at the time.
     - Also, we require an explicit statement of wanting to continue or have again. We do not infer it from behavior (like "kept going").
     - Examples: 
          - "I wanted it to continue" -> yes, if no statement of dislike at the time.
          - "I would do it again" -> yes, if no statement of dislike at the time.
     - But note: if they say they hated it at the time and then say they would do it again, that's a retrospective judgment. We are not capturing that here because we already have Question 2 for retrospective positive evaluation of absorption, and we don't have a general category for retrospective positive without absorption. We are deliberately leaving that out because it's too vague and might over-include. So in that case, we would not tag as pleasure based on Question 4 because there is an explicit statement of dislike at the time (so condition fails).
     - If YES -> tag as pleasure (1). STOP.
     - If NO -> go to Question 5.

  Question 5: **Does the snippet describe an experience that is commonly associated with positive valence (like pride, vindication, hope) and use a word that is in a predefined list of positive state words (even if not sensory)?**
     - We'll create a list: pride, proud, accomplished, vindicated, hopeful, hope, right, correct, etc. But note: we require that the word is used in a positive way. For example, in snippet 5: "vindicated" and then says "not exactly good" -> so it's ambiguous. We have to look at the context.
     - We require that the word is not negated or qualified in a way that makes it non-positive. For example, "I was vindicated, but it didn't feel good" -> then we don't tag.
     - If the word is used and there is no negative qualification -> tag as pleasure (1). STOP.
     - Otherwise -> tag as not pleasure (0). STOP.

  But note: we might have missed some cases? We have to balance coverage and over-inclusion.

  Now, what does this procedure drop?
  - We drop the distinction between wanting and liking unless the text explicitly states both. We rely on the absence of a statement of dislike to allow wanting to count (in Question 4). But if the text says they didn't like it but still wanted it, we don't tag because the condition for Question 4 fails (there is a statement of dislike). So the chips example (3) would not be tagged? Let's see.

  Also, we are not capturing the retrospective positive evaluation for non-flow experiences? For example, the run (snippet 4): "Hated every step of mile 18. Doing it again Sunday." We don't have in-the-moment positive feeling (so Q1 fails). It's not flow (so Q2 fails). It's not relief (Q3 fails). For Q4: they say they would do it again, but they also explicitly state they hated it at the time -> so condition fails (because there is a statement of dislike at the time). Then Q5: we look for positive state words? They don't use any in the snippet. So we would tag as 0.

  But is that acceptable? The person is doing it again, so they must have gotten some pleasure? Or maybe not? They might be doing it for health reasons. Without explicit evidence of pleasure, we don't tag.

  Similarly, for the mixed cases: we are tagging if any of the criteria are met. For a sad movie that you'd watch again: if the snippet says "I cried throughout, but it was beautiful and I'd watch it again", then Q1 might catch "beautiful" (if it's a positive feeling word) -> tag 1. If it says "it was horrible but funny", then we look for positive words: "funny" is positive -> tag 1. But if it says "it was horrible and I cried, but I'd watch it again", then without a positive word and with a statement of dislike at the time, we don't tag? But note: Question 4 requires no statement of dislike. So we wouldn't tag. However, if they say "it was horrible but I loved it", then Q1 catches "loved" -> tag 1.

  Now, we run the snippets:

  Snippet 1: "Three hours disappeared while I was working on the encryption bug. I didn't notice anything. Later: best day in weeks."
  - Q1: No positive feeling word at the time -> no.
  - Q2: Absorption (lost track of time) and retrospective positive ("best day in weeks") -> yes. Tag 1.

  Snippet 2: "The toothache stopped. For maybe a minute nothing hurt and it was amazing."
  - Q1: "amazing" is a positive feeling word -> yes. Tag 1.

  Snippet 3: "Ate the whole bag of chips. Didn't even like them. Kept going anyway."
  - Q1: No positive feeling word -> no.
  - Q2: Not about flow -> no.
  - Q3: Not about relief -> no.
  - Q4: They say they didn't like them. They don't explicitly say they wanted to continue or have again. "Kept going" is behavior, not a statement of desire. So we don't have explicit wanting. -> no.
  - Q5: No positive state word -> no. Tag 0.

  Snippet 4: "Finished the 20-miler. Hated every step of mile 18. Doing it again Sunday."
  - Q1: "Hated" is negative -> no positive word. No.
  - Q2: Not flow -> no.
  - Q3: Not relief -> no.
  - Q4: They say they would do it again ("Doing it again Sunday") but they explicitly stated they hated it at the time -> condition fails. So no.
  - Q5: No positive state word -> no. Tag 0.

  Snippet 5: "Found out I was right and Dave was wrong in the group chat. Vindicated? Not exactly good exactly."
  - Q1: No positive feeling word at the time? They use "vindicated" which is a positive state word? But then they say "Not exactly good". So we have to check Q5.
  - Q5: They use "vindicated", but then they qualify it as "not exactly good". So we cannot take "vindicated" as unambiguously positive in this context. Therefore, we do not tag. Tag 0.

  Snippet 6: "Holdig my nephew. Warm. Nothing else to say."
  - Q1: "Warm" - in this context, it is likely a positive feeling. We assume that physical warmth in the context of holding a loved one is positive. So yes -> tag 1.

  Now, what about a case that will make you argue? Consider snippet 4. We tagged 0, but the person is doing it again. You might argue that there must have been some pleasure. But the procedure requires explicit evidence. Without it, we don't tag.

  What the procedure cannot do:
  - It cannot read between the lines. If the pleasure is implied but not stated, we miss it.
  - It cannot handle complex mixed cases without explicit positive markers. For example, an experience that is described as both painful and rewarding but without using positive words might not be tagged.
  - It relies heavily on the presence of specific words and explicit statements. Cultural or idiomatic expressions might be missed if not in our lists.

  Where annotators might go off-script:
  - They might use their own intuition to tag snippet 4 as 1 because the person is repeating the behavior.
  - They might interpret "warm" in snippet 6 as merely physical and not emotional (but we assume it's positive in context) -> we have to train that in such contexts, it is positive.

  To improve IAA:
  - Provide a list of positive words and state words.
  - Provide clear examples and non-examples.

  Finally, note that we are using a hybrid approach: we capture both felt qualities (via positive words) and attitudes (via wanting in Q4 and retrospective in Q2 and Q3) but in a controlled way. The daily number will be a conservative estimate of pleasure, missing some cases that are positive but not expressed with our markers. We avoid over-inclusion by requiring explicit evidence.

  Procedure in short:

  1. **Explicit positive feeling?** (at the time) -> YES: 1, STOP. Else -> 2.
  2. **Flow state with retrospective positive?** -> YES: 1, STOP. Else -> 3.
  3. **Relief with explicit positive?** -> YES: 1, STOP. Else -> 4.
  4. **Explicit wanting to continue or repeat AND no explicit dislike at the time?** -> YES: 1, STOP. Else -> 5.
  5. **Positive state word (like pride) without negation?** -> YES: 1, Else: 0.

  We run the procedure on the provided snippets as above.

  We'll write the codebook accordingly.
answer: |-
  ### Codebook: Pleasure Annotation Procedure  
  **Objective**: Label snippets (short text reports) as `1` (pleasure) or `0` (no pleasure) to compute a daily positive-valence score per person.  
  **Constraints**:  
  - 90 seconds/snippet.  
  - Annotators have psych BA training but no philosophy/theory.  
  - Inter-annotator agreement (IAA) target: ≥0.7.  
  - Output must collapse to one daily number (e.g., max or mean of snippet labels per person-day).  

  **Philosophy Choices & Compromises**:  
  - **Core Tension**: "Felt quality" (hedonic tone) vs. "attitude" (desire-based).  
    - **Chosen Path**: Hybrid, prioritizing *explicit evidence* to avoid over-inclusion. We lean toward **attitude** (desire/endorsement) but require:  
      - Explicit markers (words/phrases) to avoid subjectivity.  
      - Retrospective endorsement counts only for absorption (flow) or relief.  
    - **Dropped Distinctions**:  
      - Wanting vs. liking (too subtle for 90s; defer to explicit statements).  
      - In-the-moment vs. retrospective (unless text explicitly contrasts them; in-the-moment dominates).  
      - "Family resemblance" (we use discrete rules, not fuzzy similarity).  
    - **Risk of Wrong Choice**:  
      - Pure "felt quality": Misses flow, pride, relief (daily score deflated).  
      - Pure "attitude": Over-includes addiction, obligation (daily score inflated).  
      - **Hybrid Mitigation**: Balances coverage and precision. Daily score will be conservative (may miss subtle positives but avoids false positives).  

  **Rules to Prevent Over-Inclusion**:  
  1. **No inference**: Only tag if explicit evidence exists (e.g., "loved it" → tag; "kept going" → no tag without endorsement).  
  2. **No wireheading**: Desire alone isn’t enough; requires positive marker (e.g., "amazing") or context (e.g., flow + retrospective joy).  
  3. **Mixed cases**: Tag as `1` if *any* pleasure marker exists (even if mixed with negativity).  
  4. **Stopping at no**: Each question must be answered sequentially; stop if criteria unmet.  

  ---  
  ### Decision Procedure  
  **Flowchart**: Ask in order. Stop at first "yes" (tag `1`) or after Q5 (tag `0`).  

  1. **Explicit Hedonic Marker?**  
     - **Criteria**: Does the snippet use a **direct positive feeling word** (e.g., "good," "amazing," "joy," "warm," "satisfied")?  
     - **Yes → Tag 1** (STOP).  
     - *Rationale*: Captures felt quality.  
     - *Drops*: Implied pleasure without explicit words.  

  2. **Flow/Absorption with Retrospective Joy?**  
     - **Criteria**:  
       a. Mentions **lost time/focus** (e.g., "disappeared," "absorbed," "zoned in").  
       b. **Retrospective endorsement** (e.g., "best day," "loved it").  
     - **Both → Tag 1** (STOP).  
     - *Rationale*: Flow lacks in-the-moment feeling but is endorsed later.  
     - *Drops*: Flow without retrospective joy.  

  3. **Relief/Ended Pain with Positive Marker?**  
     - **Criteria**:  
       a. Describes **cessation of pain/discomfort**.  
       b. Uses a **positive word** for relief (e.g., "amazing," "bliss").  
     - **Both → Tag 1** (STOP).  
     - *Rationale*: Relief is pleasure-adjacent but needs explicit positivity.  
     - *Drops*: Pain ending without commentary (e.g., "toothache stopped" → no tag).  

  4. **Explicit Desire to Continue/Repeat?**  
     - **Criteria**:  
       a. States **wanting more** (e.g., "would do again," "wish it lasted").  
       b. **No concurrent dislike** (e.g., no "hated it" during the experience).  
     - **Both → Tag 1** (STOP).  
     - *Rationale*: Captures "attitude" without over-including compulsion.  
     - *Drops*: Wanting + disliking (e.g., addiction).  

  5. **Non-Sensory Positive State?**  
     - **Criteria**: Uses **non-feeling positive words** (e.g., "proud," "vindicated," "hopeful") *without negation* (e.g., not "vindicated but not good").  
     - **Yes → Tag 1** (STOP). Else → **Tag 0**.  
     - *Rationale*: Captures pride/hope.  
     - *Drops*: Ambiguous states (e.g., "vindicated?" without clarity).  

  ---  
  ### Procedure Applied to Snippets  
  **Key**:  
  - ✅ = Criteria met. ❌ = Not met.  
  - **Bold** = Critical evidence.  

  1. **"Three hours disappeared while I was working on the encryption bug. I didn’t notice anything. Later: best day in weeks."**  
     - Q1: Explicit hedonic marker? ❌ (No feeling words during flow).  
     - Q2: Flow + retrospective joy? ✅  
       - a. Flow: "disappeared" + "didn’t notice anything."  
       - b. Retrospective: "**best day in weeks**."  
     - → **Tag 1** (STOP at Q2).  
     - *Why you’ll hate this*: Flow lacks real-time pleasure, but retrospective endorsement forces a tag.  

  2. **"The toothache stopped. For maybe a minute nothing hurt and it was amazing."**  
     - Q1: Explicit hedonic marker? ✅ (**"amazing"**).  
     - → **Tag 1** (STOP at Q1).  

  3. **"Ate the whole bag of chips. Didn’t even like them. Kept going anyway."**  
     - Q1: Explicit hedonic marker? ❌ ("didn’t like" is negative).  
     - Q2: Flow? ❌ (No absorption).  
     - Q3: Relief? ❌ (No pain cessation).  
     - Q4: Desire to continue? ❌  
       - "Kept going" implies behavior, **not explicit desire**.  
       - Dislike present: "**Didn’t even like them**."  
     - Q5: Non-sensory positive? ❌ (No pride/hope words).  
     - → **Tag 0**.  

  ---  
  ### Limitations & Where Annotators Might Deviate  
  **What the Procedure Cannot Do**:  
  - **Handle implicit pleasure**: E.g., "Went for a run" (no markers) → tag 0, even if runner typically enjoys it.  
  - **Resolve deep contradictions**: E.g., "hated it but loved it" → tagged as 1 if one positive marker exists (Q1), but annotators might overrule.  
  - **Capture cultural/idiomatic expressions**: E.g., "that hit the spot" requires training to recognize as positive.  

  **Where Annotators Might Go Off-Script**:  
  1. **Q4 (Desire)**: Annotators might tag "kept going" (snippet 3) as desire despite no explicit statement.  
     - **Mitigation**: Train with examples: "kept going" ≠ "wanted more."  
  2. **Q5 (Non-sensory states)**: "Vindicated" (snippet 5) might be tagged as positive if annotators ignore qualifiers ("not exactly good").  
     - **Mitigation**: Stress "without negation" in training.  
  3. **Mixed cases**: Annotators might miss Q1 markers in complex snippets (e.g., "funny-but-horrible" if "funny" is overlooked).  

  **IAA Strategy**:  
  - Use clear word lists (e.g., "positive words": good, amazing, warm, joyful; "desire phrases": want more, do again).  
  - Pilot-test with 100 snippets; recalibrate rules if IAA <0.7.  
  - Flag snippets with negation (e.g., "not good") for review.  

  ---  
  **Final Output**:  
  - Per snippet: `1` or `0`.  
  - Daily score: e.g., `max` (if any pleasure that day) or `mean` (density of pleasure).  
  - **Why This Works**:  
    - Survives 90s/snippet: Rules rely on explicit, scannable evidence.  
    - Avoids over-inclusion: Desire requires absence of dislike (Q4); non-sensory states require unambiguous words (Q5).  
    - Handles heterogeneity: Covers sensory, flow, relief, and attitude-based cases without theory.
