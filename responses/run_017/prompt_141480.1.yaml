  ### DECISION TREE: WRONG KIND OF REASONS  
  *Follow the branches by answering concrete cases. No prior theory needed.*  

  ---

  #### STANDARD CASE  
  A wealthy stranger (no threats, no tricks) offers you £1 million to admire him. You have no prior feelings about him.  

  **Q1:** Does the prize give you a reason that bears on whether your admiration is an appropriate response to *him*?  
  - **(a)** Yes → Go to Q2  
  - **(b)** No → **Leaf 1: Scope Dissolution**  

  ---

  #### IF YOU ANSWERED (a) AT Q1:  
  **Q2:** Are reasons bearing on admiration (e.g., the prize, or the stranger’s traits) all the same *kind* of consideration?  
  - **(a)** Yes → Go to Q3  
  - **(b)** No → Go to Q4  

  **Q3:** Is the prize reason evidence that your admiration correctly reflects his character?  
  - **(a)** Yes → **Leaf 6: Reasons-as-Evidence**  
  - **(b)** No → **Leaf 5: Weight Deflationism**  

  ---

  #### IF YOU ANSWERED (b) AT Q2:  
  **Q4:** Is the "appropriate response" kind of reason for admiration unique to admiration?  
  *(e.g., only "admirability-relevant" considerations count, just as "funniness-relevant" considerations count for amusement)*  
  - **(a)** Yes → **Leaf 4: Proprietary Pluralism**  
  - **(b)** No → Go to Q5  

  ---

  #### RETENTIVE REASONS CASE  
  You admire your former supervisor for her patience. You then learn that *keeping* this admiration (not forming it anew) will prevent you from quitting your PhD.  

  **Q5:** Is this reason to *keep* admiring the same kind of reason as her patience?  
  - **(a)** Yes → Go to Q6  
  - **(b)** No → Go to Q6  

  ---

  #### SELF-SHAPING REASONS CASE  
  You have a reason to let yourself grieve a loss—not because grief fits the situation, but because grieving for 2 years will make you more attentive to others’ suffering.  

  **Q6:** Is this "self-shaping" reason the same kind of reason as those making grief appropriate to the loss?  
  - **(a)** Yes → **If (a) at Q5: Leaf 7** | **If (b) at Q5: Leaf 9**  
  - **(b)** No → **If (a) at Q5: Leaf 8** | **If (b) at Q5: Go to Q7**  

  **Q7:** Is a person’s admirability grounded in reasons to admire them?  
  - **(a)** Yes → **Leaf 2: Buck-Passing (Fittingness-Restricted)**  
  - **(b)** No → **Leaf 3: Value-First**  

  ---

  ### LEAVES (VIEWS)  
  1. **Scope Dissolution**: The prize isn’t a reason to admire—it’s a reason to *bring about* admiration.  
  2. **Buck-Passing (Fittingness-Restricted)**: Value is defined by reasons, but only "fittingness" reasons (e.g., the stranger’s traits). The prize isn’t one.  
  3. **Value-First**: The split reflects whether considerations bear on the object’s *value* (e.g., the prize doesn’t affect the stranger’s admirability).  
  4. **Proprietary Pluralism**: Each attitude has its own "proprietary" reason-kind (e.g., the fearsome for fear). The prize belongs to another kind (e.g., for desire).  
  5. **Weight Deflationism**: The prize *is* a reason for admiration—but it’s weak/outweighed. No deep distinction.  
  6. **Reasons-as-Evidence**: A reason for an attitude is evidence that the attitude is correct (e.g., the prize suggests the stranger *is* admirable).  
  7. **Unnamed (Retention/Functional as Fittingness)**: Retention and self-shaping reasons *are* fittingness reasons. [**Unattractive**: Conflates object-features with attitude-consequences.]  
  8. **Unnamed (Retention as Fittingness, Functional Not)**: Retention reasons are fittingness reasons; self-shaping reasons are not. [**Unexplored**]  
  9. **Unnamed (Functional as Fittingness, Retention Not)**: Self-shaping reasons are fittingness reasons; retention reasons are not. [**Unexplored**]  

