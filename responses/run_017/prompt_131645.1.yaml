prompt: |-
  I'm a PhD student in philosophy, and next term I'm co-teaching a short upper-level seminar that pairs Kripke's reading of Wittgenstein on rule-following with a few films; we're doing Nolan's Memento in the second week, and I want to get my own reading straight before I stand up in front of twenty students. My co-instructor thinks the film is basically an illustration of the private language argument — man without a community cannot follow a rule, therefore he cannot mean anything — and I think that's both too quick and too tidy. The distinction I keep pushing is between two failures Leonard suffers: a mnemonic failure, in which he cannot retrieve which rule or which intention he adopted, and a constitutive failure, in which there is no fact of the matter about which rule he adopted in the first place. Kripke's skeptic is claiming the second, and I want to know how much of the film's drama actually depends on the second rather than the first, and how much of its horror comes from our not being able to tell them apart from the inside. I'd also like you to take seriously a point one of my undergraduates made last year: that Leonard's Polaroids, notes and tattoos are an external memory store, so the symbols really are public and stable, and the regress of interpretation Kripke's skeptic relies on shouldn't get any grip. I don't think that's right, but I need a better answer to it than "the symbols still have to be interpreted."

  Here's what I'd like you to work with, roughly: the annotations he scrawls on the Polaroids, where the label fact is written over something that is plainly an inference, guess or self-instruction; the Sammy Jenkis story and its revelation as Leonard's own, given that Leonard's former job was literally to adjudicate whether a claimant's condition was genuine, i.e. to act as the community's check on someone else's capacities; Teddy as the only available community, and a corrupt and manipulative one, which seems to me to cut against Kripke's skeptical solution rather than for it, since that solution needs a functioning practice of agreement and correction and Leonard's only interlocutor is someone with an interest in his not being corrected; the closing decision to have information tattooed that will send him after a new target, together with the closing voice-over about believing in a world outside his own mind and lying to himself to be happy; and the film's own reverse-chronological form, which puts us, the viewers, in the position of inferring the rule governing the sequence and then being forced to revise it. One thing I want handled carefully: the indeterminacy of the name John G., under which several people fit and which Teddy and Leonard use differently, is not obviously the same phenomenon as what the skeptic alleges for the invented rival function Kripke calls quus, and I suspect the film quietly runs the two together.

  So: give me a reading of Memento through the rule-following paradox — what the film dramatizes, what it complicates, and where it resists the reading and an honest critic has to say so. Please don't summarize the plot beyond what you need, and don't give me citations or a reading list; I have the secondary literature covered. What I'm short on is a view about whether the film is better used as an illustration of Kripke's Wittgenstein, as an objection to the skeptical solution, or as something that tells against both by showing what happens when the only available community is a liar — and, at the end, whether you think the film adds anything to the debate that the arguments alone don't. Under about 1,200 words, if you can.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy PhD student preparing to teach Memento in relation to Kripke/Wittgenstein on rule-following. They've presented a sophisticated framework and want to avoid oversimplification. 

  First, I need to honor their core distinction: mnemonic failure (can't recall rules) vs constitutive failure (no fact about rules). Their co-instructor sees it as straightforward private language argument illustration, but they're skeptical. The undergraduate's point about external memory being public needs serious engagement - dismissing it with "still needs interpretation" won't suffice.

  The key elements they flagged: 
  - "FACT" labels on inferential content
  - Sammy Jankis/Lenard's insurance investigator past
  - Teddy as corrupt community 
  - Ending tattoos/voiceover about self-deception
  - Film's reverse structure affecting viewer's rule-inference
  - John G. indeterminacy vs quus

  Hmm... the Sammy revelation is crucial. When we learn Sammy's story is Leonard's, it reframes the entire film. Leonard wasn't just adjudicating claims - he was projecting his own constitutive failure onto Sammy. This blurs their distinction brilliantly: for Leonard, the mnemonic failure masks (even from himself) the constitutive failure.

  About the undergraduate's point: yes, Polaroids/tattoos are external and stable. But Teddy's manipulation shows how easily that publicness gets corrupted. The "FACT" annotations demonstrate Leonard constantly mislabeling inferences as facts - so the symbols are stable but their relationship to meaning isn't. The regress isn't about interpreting symbols per se, but about being unable to stabilize the constitutive link between symbols and rules when the community is malicious.

  The reverse chronology matters deeply. We experience what Leonard can't: watching rules form and dissolve. Our initial inferences about scenes get overturned, mirroring Leonard's epistemological crisis. This formal choice makes us feel the horror of the indistinguishability they mentioned - we can't tell from inside a moment whether our rule-assumptions are sound.

  On Teddy as community: this is where Kripke's skeptical solution fails dramatically. Wittgenstein needs a corrective community, but Teddy actively prevents correction. Leonard's self-deception at the end ("lie to myself to be happy") becomes the only way to maintain coherence - which is terrifyingly anti-Wittgensteinian. 

  John G. vs quus: good catch that they're different. Quus is about radical indeterminacy of rules, while John G. is referential ambiguity. The film cleverly uses the latter to evoke the former, but they're distinct. Still, both create spaces for manipulation.

  Ultimately I think the film is more objection than illustration. It shows how a broken community creates conditions where constitutive failure becomes inevitable - not because private language is impossible, but because corrupt public language destroys the possibility of rule-stabilization. The horror comes from seeing someone forced to choose self-deception as the only alternative to meaning-collapse.

  The added value beyond arguments? The visceral experience of epistemological vertigo. We don't just understand the problem - we feel what it's like to lose grip on rules from inside the system. And we see how trauma and bad faith community can weaponize Wittgenstein's insights.
answer: |-
  Here’s a reading centered on your core distinction, treating *Memento* as a destabilization of Kripke’s skeptical solution rather than a tidy illustration:

  ### The Mnemonic/Constitutive Tension
  The film meticulously traps us in Leonard’s *mnemonic* failure: he cannot access past intentions/rules. But the horror builds because we suspect a deeper *constitutive* failure—that there *is no fact* about Leonard’s rules or past. The Sammy Jankis reveal crystallizes this: Sammy’s "failure" (constitutive, per Leonard’s insurance report) was Leonard’s own projection. Leonard’s former job—adjudicating others’ rule-following capacity—now frames his tragedy: he’s both the failed rule-follower *and* the corrupt community denying his own failure. This duality forces us to ask: Is Leonard’s inability to "mean" due to isolation (Kripke’s point), or because his "past" is a fiction he cannot interrogate?

  ### The External Store & The Regress of Interpretation
  The undergraduate’s point is sharp: Polaroids/tattoos *are* public, stable symbols. But the film undermines their efficacy in three ways:
  1.  **Mislabeling as "FACT":** Leonard labels inferences ("He is the one") and self-instructions ("FACT: CAR LICENSE SG13 7IU") as objective truths. The symbols are stable, but their *semantic content* is corrupted at inception. Their "publicness" doesn’t stabilize meaning because Leonard systematically misrepresents interpretive acts as discoveries.
  2.  **Teddy’s Corruption:** Teddy isn’t a corrective community; he’s a *manipulator* of the external store. He feeds Leonard false "facts" (e.g., "Sammy didn’t have a wife"), alters evidence (switching license plates), and weaponizes the system. The regress isn’t stopped by publicity; it’s *exploited*. Interpretation isn’t impossible—it’s maliciously guided. Kripke’s solution requires good-faith agreement; Teddy ensures its impossibility.
  3.  **The Origin Problem:** Even "stable" symbols require an initial rule-establishing act. Leonard’s tattoos originate in moments of trauma-fueled vengeance (e.g., post-"John G." killing), filtered through Teddy’s lies. There *is no clean constitutive moment* for his rules—only layers of imposition and deception. The skeptic’s regress thrives here because the "first" intention is irrecoverable *and* likely indeterminate.

  ### Community, Corruption, and the Skeptical Solution’s Failure
  Kripke’s Wittgenstein needs a functional community for correction. Leonard’s sole community is Teddy—a liar with an agenda. This doesn’t just illustrate isolation; it *perverts* the skeptical solution:
  -   **Agreement is Weaponized:** Teddy and Leonard "agree" on rules ("Find John G."), but only because Teddy constructed the fiction. Their "agreement" sustains a shared delusion, not meaning.
  -   **Correction is Sabotaged:** Teddy actively prevents Leonard from correcting errors (e.g., hiding that "John G." is a fabrication). Leonard’s system lacks the *capacity* for correction, making it worse than private—it’s *hostilely public*.
  -   **The Horror of Bad Faith:** Leonard’s final monologue ("I have to believe in a world outside my own mind... I have to lie to myself to be happy") is the anti-Wittgensteinian nightmare. Meaning isn’t socially restored; it’s individually *chosen* as self-deception. The "community" here enables insanity, not sense.

  ### Film Form, Rule-Following, and Indeterminacy
  The reverse chronology brilliantly externalizes Leonard’s constitutive crisis:
  -   **Viewers as Rule-Followers:** We constantly infer rules ("This is why he did that") only to have subsequent scenes force revision. We experience the skeptic’s doubt: *Was our initial rule (quus) wrong, or is there no fact?* Our epistemological vertigo mirrors Leonard’s.
  -   **John G. vs. Quus:** You’re right—they’re distinct. "John G." is referential ambiguity (many candidates), while quus is rule indeterminacy (which function?). The film *uses* the former to evoke the latter thematically. Leonard’s hunt isn’t quus-like uncertainty; it’s a *deliberately vague* signifier enabling manipulation. This highlights how rule-following fails not via abstract skepticism, but through corrupted language games.

  ### Conclusion: Memento as Objection, Not Illustration
  *Memento* is best used **as an objection to the adequacy of Kripke’s skeptical solution**:
  1.  **Community Isn’t Enough:** A corrupt community (Teddy) is worse than no community. Meaning can be systematically sabotaged by hostile interpreters.
  2.  **Constitutive Failure Precedes Mnemonic Failure:** Leonard’s "rules" are built on sand: trauma, lies, and self-deception. His mnemonic failure obscures the prior constitutive void. The film suggests that without a *truthful* origin and community, publicity alone fails.
  3.  **Self-Deception as Survival:** Leonard’s final embrace of a lie ("I’m gonna lie to myself") is the ultimate repudiation of Wittgenstein. When the social world is poisoned, meaning requires *choosing* fiction—a tragic, anti-communal act.
  4.  **What the Film Adds:** It viscerally dramatizes the *existential horror* of the rule-following paradox. Arguments abstractly describe indeterminacy; *Memento* makes us *feel* the terror of being unable to trust our own past intentions, our external records, or the only community available. It shows how easily the social solution collapses under bad faith, and how trauma can weaponize the gap between mnemonic and constitutive failure. The film doesn’t refute Kripke’s skeptic; it reveals the devastating human cost when the skeptical solution’s prerequisites—good-faith community and corrective practice—are absent.
