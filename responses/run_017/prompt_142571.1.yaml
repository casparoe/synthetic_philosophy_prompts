prompt: |-
  I'm writing a paper in political theory on whether the urban-professional outlook and the rural-working-class outlook are best understood as rival moralities or as a single morality operating under very different material conditions, and I want to test the framework on a case rather than only on arguments. The distinction I've been working with is what I'll call the substitutability condition: call an outlook substitutability-friendly when it treats the main objects of a person's obligations — a place, an industry, a craft, a set of people — as in principle replaceable, so that leaving is the default and staying is what requires a justification; call it substitutability-hostile when it treats them as non-fungible, so that staying is the default and leaving is what requires one. My working claim is that the professional-class moral vocabulary of merit, self-authorship, and developing one's gifts wherever they lead is substitutability-friendly in a way that is not a neutral moral default but a commitment fitted to lives with high mobility and low dependence on any single place or workplace, whereas the rural and working-class vocabulary of loyalty, solidarity, and inherited obligation is substitutability-hostile. The obvious reply is adaptive preference: people valorize whatever they happen to be stuck with, and the hostility is a rationalization of exit costs. I don't think that reply settles it, and I also don't think it settles it to say that the substitutability-friendly outlook simply has no vocabulary for losses that aren't opportunity costs.

  I want to try the framework on Billy Elliot — the film set in a County Durham mining village during the miners' strike, in which an adolescent boy's talent for ballet is in tension with his family's and his community's commitments. Assume I know the plot; I don't need a summary, and please don't reproduce dialogue. I'd like a reading that takes both the film and the distinction seriously and says where each one fails: which scenes most sharply stage the collision between the two outlooks and why; how far the film's own framing already concedes the substitutability-friendly case; where it resists that reading; whether the film is able to distinguish a genuine loyalty from a valorized trap, or whether it settles the question by borrowing the audience's antecedent class sympathies; and what the film adds to the argument that the concepts alone don't supply. No citations, no reading list, no bibliography — I want the reading itself.

  Please answer as exactly five numbered points, each one to two sentences long, taking the five questions above in order, with no introduction and no concluding paragraph.
reasoning: |-
  Hmm, the user is writing a political theory paper exploring whether urban-professional and rural-working-class outlooks represent rival moralities or a single morality under different material conditions. They've developed a framework around the "substitutability condition" - whether obligations are seen as replaceable (substitutability-friendly) or non-fungible (substitutability-hostile). They want to test this on the film Billy Elliot.

  The user has posed five specific questions about how the film stages this collision, where it leans toward the substitutability-friendly view, where it resists it, whether it distinguishes genuine loyalty from traps, and what it adds beyond abstract concepts. They want exactly five numbered points with no extras.

  Looking at Billy Elliot, I can see how the film perfectly illustrates this tension. Billy's passion for ballet represents the substitutability-friendly outlook - talent that demands mobility beyond the mining community. Meanwhile, the striking miners embody the substitutability-hostile view with their loyalty to place and tradition.

  For the first point about scenes that stage the collision, I'll highlight the boxing hall dance scene where Billy's father discovers him dancing - this physical space literally contains their conflict. For the second point on where the film concedes to the substitutability-friendly view, I'll note the triumphant ending that frames Billy's departure as success.

  The film does resist a simplistic reading though - I'll point to Mrs. Wilkinson as a complex figure who understands both worlds. For distinguishing loyalty from traps, I'll argue the film relies on emotional cues rather than clear criteria. Finally, the film adds visceral impact by making the community's extinction palpable through Billy's personal journey.

