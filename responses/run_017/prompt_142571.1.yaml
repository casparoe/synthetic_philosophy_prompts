answer: |-
  1.  The boxing hall confrontation, where Billy dances before his father, stages the collision most sharply: the space itself (a masculine, community institution) is violated by Billy's individual talent pursuit, forcing the immediate, visceral clash between non-fungible local obligation (the father's expected anger) and Billy's emerging need to leave.
  2.  The film's framing concedes the substitutability-friendly case most clearly in its triumphant ending: Billy's success is defined by his complete escape from the doomed mining community, validating his talent's demand for mobility and framing the village primarily as a constraint overcome.
  3.  The film resists a purely substitutability-friendly reading by deeply embedding Billy's talent within the community's texture (the piano teacher, Mrs. Wilkinson's complex roots) and portraying the strike's brutal suppression not just as economic loss, but as the violent destruction of non-fungible social bonds.
  4.  The film struggles to *thematically* distinguish genuine loyalty from a valorized trap beyond emotional resonance; it relies on audience sympathy for the miners' solidarity against state power and Billy's personal anguish over leaving, implicitly borrowing those sympathies rather than providing an internal moral criterion.
  5.  The film adds the visceral impact of witnessing a community's actual extinction, making the loss tangible and irreplaceable in a way abstract arguments cannot, while simultaneously forcing the viewer to accept the protagonist's necessary departure, embodying the tragic cost of the substitutability condition itself.
