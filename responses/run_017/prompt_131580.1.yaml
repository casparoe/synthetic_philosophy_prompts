  ### Constructed Case: Globality of Lawhood in Humean Supervenience

  **(i) World Description**  
  Ontology: A finite, 2D world with two spatially separated regions, A (left half, \(x < 0\)) and B (right half, \(x \geq 0\)). Each region contains 1,000 point particles with fundamental properties: mass \(m\), position \((x,y)\), and velocity. Particles interact only within their own region via gravitational forces. Region A exhibits regularity \(R\): particles obey \(F = G_A \frac{m_1 m_2}{r^2}\) (inverse-square law with constant \(G_A = 1\)). Region B exhibits a distinct regularity: particles obey \(F = G_B \frac{m_1 m_2}{r^2}\) with \(G_B = 2\). The regions are causally isolated (no forces or signals cross \(x=0\)), and initial conditions ensure no shared history or dependencies.

  **(ii) Verdicts and Reasoning**  
  - **Humean Best-System Account (BSA)**:  
    - *Competing Systems*:  
      - **System 1 (Two Local Laws)**:  
        - Axiom 1: In region A (\(x < 0\)), \(F = 1 \cdot \frac{m_1 m_2}{r^2}\).  
        - Axiom 2: In region B (\(x \geq 0\)), \(F = 2 \cdot \frac{m_1 m_2}{r^2}\).  
        - *Strength/Fit*: Perfect fit for all data.  
        - *Simplicity*: Two axioms, minimal complexity per axiom.  
      - **System 2 (One Global Law)**:  
        - Axiom: \(F = \begin{cases} 1 \cdot \frac{m_1 m_2}{r^2} & \text{if } x < 0 \\ 2 \cdot \frac{m_1 m_2}{r^2} & \text{if } x \geq 0 \end{cases}\).  
        - *Strength/Fit*: Perfect fit.  
        - *Simplicity*: One axiom, but includes a conditional (complexity cost).  
    - *Trade-off*: System 2 wins by **margin** (not knife-edge) due to fewer axioms.  
      - *Why?* BSA prioritizes fewer axioms even with internal complexity. System 2 achieves identical strength/fit with one axiom vs. two, saving "theoretical resources." Adding \(R\) (Axiom 1 of System 1) is costlier than embedding it in a global conditional.  
    - *Verdict*: \(R\) is not a law (since laws are axioms, and \(R\) isn’t an axiom in System 2).  

  - **Anti-Humean Account (Armstrong-style)**:  
    - Universals in A (mass, distance) necessitate \(F = 1 \cdot \frac{m_1 m_2}{r^2}\) via a relation of nomic necessitation.  
    - Universals in B necessitate a distinct relation (\(F = 2 \cdot \frac{m_1 m_2}{r^2}\)).  
    - *Verdict*: \(R\) is a fundamental, exceptionless law in A. Isolation ensures no dependence on B.  

  **(iii) Check Against W\***  
  - **W\***: Delete region B entirely. Only region A exists, with particles obeying \(R\).  
  - **Humean Verdict in W\***: Best system has one axiom: \(F = 1 \cdot \frac{m_1 m_2}{r^2}\) (no conditional needed). Thus, \(R\) is a law.  
  - **Anti-Humean Verdict in W\***: Unchanged; \(R\) is a law.  
  - **Outcome**: Humean verdict flips solely due to B’s presence.  

  **(iv) Key Feature Doing the Work**  
  - **Conditional Law Construction**: The global conditional law in System 2 absorbs \(R\) but avoids a separate axiom. Removing B eliminates the need for the conditional, restoring \(R\) as a law. If B shared natural properties *causally* with A, the anti-Humean might infer connection—but here, isolation and distinct constants prevent this.  

  **(v) Strongest Humean Reply and Cost**  
  - **Reply**: Bite the bullet on holism: lawhood *is* global, and \(R\)’s status *should* depend on B. Reject locality as a desideratum.  
  - **Cost**: Conflicts with intuitions about scientific practice. If physicists in A (ignoring B) discover \(R\), Humeanism says they’re wrong—even though \(R\) explains all local data. This strains the "empirical adequacy" of BSA.  

  **(vi) Weaknesses (For Dave)**  
  - **Thin Margin**: System 2’s win hinges on BSA weighting axiom count heavily over internal complexity. If conditionals are penalized more, System 1 might tie or win.  
  - **Naturalness of "Region"**: Defining regions via \(x\) uses a fundamental coordinate, but "region-based" laws may seem ad hoc. However, \(x\) is natural, and isolation justifies treating regions separately.  
  - **Dave’s Likely Move**: Argue that the conditional law is just "two laws in disguise," so \(R\) is still a law. *Rebuttal*: BSA evaluates syntactic simplicity—fewer axioms always win—and the conditional is a single statement.  

  ### Summary  
  This case isolates "globality" by using a conditional law to subsume \(R\) in a global axiom, leveraging causal isolation to protect anti-Humean locality. It avoids standard cheats (e.g., \(R\) is instantiated, projectible, and fundamental) and forces a flip in Humean verdicts via B’s presence. The cost to Humeanism is reconciling holism with local scientific practice.
