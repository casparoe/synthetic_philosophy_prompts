  The user wants hypothetical tests. For cognitive science, if object-tracking is task-relative, universalist sees it as aligning with their view, restrictivist concedes cognition doesn't track metaphysical unity but maintains their criterion. Physics-biology split: if biology quantifies over organisms, restrictivist sees it as evidence for their view, universalist notes it's not fundamental. Vagueness: if counting objects is vague, restrictivist isn't troubled, universalist must explain why we can't count precisely despite sharp mereology.

  Substantive issues: whether composition is brute or tied to natural processes, the status of higher-level sciences, and ontological innocence. Verbal disputes: what "object" means—restrictivist requires unity, universalist is permissive. But the core disagreement on composition's nature is substantive.
