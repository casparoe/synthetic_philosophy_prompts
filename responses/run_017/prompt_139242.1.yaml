  First, I need to outline agreed claims. Both accept that particles exist and are arranged in various ways. They agree that mereology alone doesn't settle SCQ and that tables are particles arranged tablewise. They also acknowledge the problem of the many and that unrestricted composition avoids vagueness. Homeostatic restrictivism avoids it too. Neither thinks practical interests dictate metaphysics. 

