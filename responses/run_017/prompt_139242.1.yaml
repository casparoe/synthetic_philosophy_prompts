  ## Adversarial Collaboration: Universalism vs. Homeostatic Restrictivism on Composition

  **Prepared Statement by Dr. Anya Reed (Universalist) & Dr. Elias Vance (Homeostatic Restrictivist)**

  After extensive discussion, we agree on the following foundational points concerning the Special Composition Question (SCQ) – the question of when some things compose something:

  1.  **Fundamental Particles Exist:** There are fundamental physical particles (or field values at points, or their ontological equivalents).
  2.  **Arrangement is Key:** At any time, fundamental particles are arranged in specific ways (e.g., tablewise, nosewise, Eiffel-Towerwise, humanwise, flamewise).
  3.  **Mereology Alone is Insufficient:** The axioms and theorems of classical extensional mereology (parthood, overlap, fusion) do not, by themselves, answer the SCQ. They describe the structure of parthood *if* composition occurs, but not *when* it occurs.
  4.  **The Problem of the Many is Real:** For many putative objects (clouds, mountains, organisms), there are multiple equally good candidate collections of particles that seem equally qualified to be *the* object, posing a challenge for views requiring precise boundaries.
  5.  **"Particles Arranged F-wise" is Uncontroversial:** Regardless of whether a table *exists*, it is uncontroversial that there are particles arranged tablewise. The disagreement is over whether this arrangement suffices for the existence of a *further* entity, the table.
  6.  **Unrestricted Composition Avoids Vagueness in Fusion Existence:** If composition is unrestricted, then for any arbitrary set of particles, there is *precisely one* fusion. There is no vagueness concerning *whether* a fusion exists for a given set.
  7.  **Homeostatic Restrictivism Avoids Vagueness in Fusion Existence (for its domain):** If composition requires a specific, objective condition (like self-maintenance), then for any arbitrary set of particles, it is determinate whether that condition is met and thus whether a fusion exists. (Vagueness *within* the condition, e.g., borderline cases of self-maintenance, is a separate issue).
  8.  **Practical Interests ≠ Metaphysical Grounding:** While practical human interests might guide our *talk* about objects, they do not ground the *existence* of composite objects. Metaphysics seeks deeper, mind-independent grounds.
  9.  **The SCQ Requires a Substantive Answer:** There is a fact of the matter about when composition occurs. Neither the nihilist answer ("never, except particles") nor the extreme conventionalist answer ("whenever we say so") is satisfactory.

  **Cruxes of Disagreement**

  | Crux                                                                 | Universalist (Reed) Position (in her words)                                                                 | Homeostatic Restrictivist (Vance) Position (in his words)                                                                 | Shared Test Case / Hypothetical Finding                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             | Universalist Prediction & Concession                                                                                                                                                                                                                                                                                                                               | Restrictivist Prediction & Concession                                                                                                                                                                                                                                                                                                                                 |
  | :------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. The Nature of Composition**                                     | Composition is a fundamental, ontologically innocent relation that holds for *any* plurality whatsoever. There are no restrictive conditions; fusions simply exist. | Composition occurs *only* when the activity of the parts is bound together by a unified, self-sustaining process that actively maintains the arrangement against perturbations. | **Circularity Test:** Imagine fundamental physics reveals a layer of reality (e.g., pure process metaphysics) where the *only* candidate "things" are inherently unstable field fluctuations. Stable, bounded entities *only* emerge when specific, complex, feedback-driven dynamical patterns arise that constrain the fluctuations within homeostatic bounds.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        | **Prediction:** This wouldn't change anything. The unstable fluctuations still compose myriad fusions at every instant, regardless of stability. The stable patterns are just particularly interesting fusions. <br>**Concession:** If it turned out there were *no* distinct particulars *at all* at the fundamental level, only a featureless blob, universalism would face a severe challenge (though nihilism might win). | **Prediction:** This directly vindicates my view. The "fusions" Reed posits for arbitrary unstable sets are not genuine unities; only the self-maintaining dynamical patterns qualify as composite objects because only they exhibit the requisite ontological independence and persistence. <br>**Concession:** If *no* self-maintaining patterns existed *at all*, my view would collapse into nihilism. |
  | **2. Evidence: Cognitive Science of Object Tracking**                | Our cognitive practices, while useful, do not track deep metaphysical joints. They are pragmatic.           | While cognitive practices may be heuristic, the successful tracking of unified objects (especially self-maintaining ones) suggests they latch onto a real metaphysical distinction. | **Finding:** Rigorous studies show human infants, adults, and non-human primates readily represent scattered or loosely connected pluralities (e.g., two halves of a screen with coordinated movement; a cloud of confetti following a path) as *a single object* solely when the task requires tracking a unified target or predicting behavior based on that unity. Crucially, neuroscience reveals *no* privileged level of description in visual processing corresponding to "objecthood as such"; task demands dynamically determine binding.                                                                                                                                                                                                                                                                                                    | **Prediction:** This is exactly what I expect. "Object" representation is a useful cognitive tool, not a metaphysical revelation. It shows cognition imposes unity based on utility, not discovers it. This aligns perfectly with the abundance of arbitrary fusions. <br>**Concession:** None needed; this fits my view.                                                                                                         | **Prediction:** This shows our cognitive "object" concept is highly flexible and task-dependent, not reliably tracking the metaphysical unity I posit. It's about cognitive economy, not ontological structure. <br>**Concession:** This finding weakens my appeal to cognitive science as *evidence* for my view. My core criterion must stand on metaphysical/physical grounds alone.                                         |
  | **3. Evidence: Physics vs. Biology Quantification**                  | Higher-level sciences quantify over useful patterns in the mosaic of fundamental particles/fields.          | Some higher-level sciences (like biology) quantify over irreducibly real composite entities (organisms) central to causal explanations. | **Finding:** Our best, complete fundamental physical theory quantifies *only* over fields/values at spacetime points (or equivalent), explicitly denying ontological status to bounded composites. Conversely, evolutionary biology demonstrates that the unit of selection, central to explanation, is irreducibly the *organism* – attempts to reduce fitness and selection statements solely to particle arrangements fail to capture causal efficacy.                                                                                                                                                                                                                                                                                                                                                                                              | **Prediction:** Physics confirms mereology is silent on composition; biology's quantification is pragmatically indispensable but derivative. Organisms are highly gerrymandered fusions of particles. Their causal efficacy is real but supervenes on particle arrangements. <br>**Concession:** If biology *required* quantifying over entities violating mereological principles, it would challenge classical mereology, not necessarily universalism. | **Prediction:** This finding cuts strongly in my favor. Physics' avoidance of composites is expected; biology's *irreducible* quantification over organisms as units of causal power vindicates that they are genuine composite objects. Their boundaries and unity are not arbitrary but grounded in their self-maintaining nature. <br>**Concession:** If biology *could* be fully reduced to particle physics without loss, it would undermine a key motivation for my view. |
  | **4. Vagueness & Counting**                                          | There is a precise number of objects in any situation (though we often don't know it). Vagueness is linguistic/epistemic. | The number of genuine composite objects (beyond particles) *is* vague where self-maintenance is borderline (e.g., dying organism, flickering flame). This reflects ontological indeterminacy. | **Question:** Precisely how many objects are currently in this room? <br>**Test:** Imagine conclusive evidence that self-maintenance admits of genuine borderline cases (e.g., a specific metabolic state where "alive" vs. "dead" is metaphysically indeterminate).                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  | **Prediction/Answer:** There is a vast, precise number, including all particle fusions (dust motes, arbitrary chunks of air, nose+Eiffel Tower fusion). Vagueness in *our* count stems from ignorance or semantic indecision about which fusions we label "chair", "organism", etc. Sharpness is a virtue. <br>**Concession:** If evidence showed mereological relations themselves were vague, it would challenge classical universalism. | **Prediction/Answer:** Beyond fundamental particles, only self-maintaining entities exist. The number is vague only if there are borderline cases of self-maintenance within the room (e.g., a barely alive plant). This ontological vagueness is unproblematic. <br>**Concession:** If it could be proven that self-maintenance is *always* fully determinate, my count would be sharp (though perhaps unknown).                   |
  | **5. Ontological Innocence / Cost**                                  | Unrestricted composition is innocent: asserting a fusion's existence adds no entity beyond the parts.        | Unrestricted composition is profligate: it multiplies entities (fusions) beyond necessity, creating a vast, causally redundant, and explanatorily barren ontology. | **Argument:** Consider the fusion of your nose and the Eiffel Tower (N+E). Does asserting N+E's existence require positing something *over and above* the nose-particles and the Eiffel-Tower-particles arranged as they are?                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         | **Position:** Yes, N+E exists, but it *is* nothing more than those particles arranged nosewise-and-Eiffel-Towerwise. It adds no *extra* being; it's just those particles considered collectively. Denying it requires a mysterious additional constraint. <br>**Concession:** If it could be shown that fusions have irreducible causal powers *not* reducible to their parts, innocence would be challenged.                | **Position:** N+E is a distinct entity only if your theory demands it. Mine does not. Positing N+E *is* adding an entity – a causally inert, explanatorily useless, arbitrary sum – to your ontology. Parsimony dictates rejecting such entities. <br>**Concession:** If every fusion demonstrably played an irreducible causal/explanatory role, my charge of profligacy would fail.                                              |

  **Substantive vs. Verbal Disagreements**

  We agree that the core of our dispute is **substantive**, not merely verbal:

  1.  **Substantive: The Nature of Composition:** Is composition a primitive, universal relation requiring no further conditions (Reed), or is it a derivative, rare relation grounded in specific causal-dynamic properties (self-maintenance) of the parts (Vance)? This is a deep disagreement about the fundamental structure of reality and what grounds unity. The disagreement over ontological innocence/profligacy directly relates to this.
  2.  **Substantive: The Causal Landscape:** Does the existence of arbitrary fusions imply vast causal overdetermination or redundancy (Vance's concern), or are causal powers always strictly localizable to the parts/arrangements, making fusions causally inert "free riders" (as Vance sees them) or merely the bearers of the summed powers of their parts (as Reed sees them)? This concerns the nature of causation and explanation.
  3.  **Substantive: The Status of Higher-Level Sciences:** Does the (hypothetical) irreducible quantification over organisms in biology reflect a genuine ontological layer (Vance) or merely a pragmatically indispensable way of describing complex patterns in the particle mosaic (Reed)? This concerns reductionism and emergence.
  4.  **Verbal (in part): The Meaning of "Object":** Vance uses "object" to imply intrinsic unity, persistence conditions, and potential causal efficacy derived from that unity. Reed uses "object" more permissively, meaning simply a mereological fusion, regardless of unity. *However*, this verbal difference stems directly from the substantive disagreement about composition. Vance restricts "object" *because* he thinks unity is necessary for composition; Reed's permissiveness follows from her view of composition. The verbal aspect is a symptom, not the root cause.
  5.  **Verbal (in part): "Exists":** Do we disagree about whether the particles arranged tablewise exist? No (Agreement #5). We disagree about whether the phrase "a table exists" is true. Reed says yes, meaning there is a fusion of those particles. Vance says no, meaning there is no *unified entity* over and above the particles. This difference in truth-value assignment depends on the substantive views about composition. Calling it "merely verbal" ignores the underlying metaphysical commitments driving the different uses of language.

  **Conclusion:** We remain fundamentally opposed on the nature of composition and the resulting ontology. However, this collaboration has clarified that our disagreement is not about the existence of particles or their arrangements, nor is it solely about words. It is a substantive dispute about what, beyond mere arrangement, grounds the existence of composite entities – brute mereological relations or specific causal-dynamic unity. We agree on the tests that could potentially shift our views and commit to evaluating future empirical and theoretical developments through this lens. We hope this statement aids the reading group in moving beyond the impasse by focusing on these core cruxes.
