  Okay, the user is in a philosophy of biology seminar focusing on genetic information. They need a set of desiderata for determining whether DNA is literally a code or just a metaphor. They provided specific cases to address and want clear requirements that separate different aspects often conflated in these debates.

  First, I need to understand their key concerns. They mentioned four cases: sequence-specific binding sites without downstream products, dual translation systems in one cell, codon reassignment in a lineage, and prions/methylation as heritable non-sequence elements. Each case challenges different aspects of genetic coding theories. The user wants these cases incorporated into the requirements.

  They also emphasized separating usually conflated questions: arbitrariness vs stereochemistry, code as string property vs string-plus-reader, necessity of misreading, and output type (amino acids, phenotype, function). I should create distinct criteria for each to avoid muddying the waters.

  The user wants each requirement marked as non-negotiable or camp-preference, with conflicts flagged. The naturalism vs normativity tension around errors is crucial. I recall debates where error implies normative semantics, which might conflict with naturalistic accounts. That needs highlighting.

  For the cases: The spacer sequence (Case 1) tests if mere binding without information transfer counts as coding. The dual translation (Case 2) challenges whether the code resides in the molecule or requires a reader. Codon reassignment (Case 3) probes arbitrariness and evolvability. Prions/methylation (Case 4) question if coding is exclusive to nucleic acids.

  I should add other cases too. Like DNA repair mechanisms showing context-dependent 'reading', or overlapping genes where one sequence has multiple meanings. These stress the system-dependence of coding.

  Structuring the desiderata: Start with minimal criteria any account must meet (non-negotiable), then move to contested ones. For each, state the requirement, motivation from cases, and whether it's mandatory or debatable.

  Key non-negotiables: Specificity (R1 from Case 1), mapping distinctiveness (R2 from Cases 2 & 3). Contested points: Arbitrariness (R3 - stereochemistry vs arbitrariness), error potential (R4 - naturalism issues), system-dependence (R5 from Cases 2 & 4).

  The biggest divider will likely be arbitrariness (R3) since it splits camps sharply. Structuralists see stereochemistry as non-coded, while informationalists require arbitrariness for true coding. Case 3 (codon reassignment) directly tests this.

  Also flagging conflicts: R3 (arbitrariness) clashes with stereochemistry examples. R4 (error) risks normativity vs naturalism. R6 (heritability) may exclude prions if coding requires nucleic acids.

  For the close: R3 (arbitrariness) excludes the most contenders. Structuralists reject coded signals without arbitrariness, while informationalists demand it. This is the main battleground.
answer: |-
  Here are the desiderata for an account of genetic information/coding, structured to address your cases and separate the key conceptual issues. Requirements marked **[NN]** are non-negotiable for any plausible account. Others reflect core disagreements between camps ("Structuralist" vs. "Information-Theoretic" vs. "Teleosemantic" leanings).

  ### Core Desiderata (Settling Literal vs. Metaphorical)

  1.  **Specificity & Determinacy of Outcome [NN]:**
      *   **Requirement:** The physical structure must causally constrain or determine a *specific* downstream outcome state from a range of possible states. The outcome must be distinctively dependent on the *particular* configuration of the structure.
      *   **Motivation:** Case 1 (Spacer/Binding Site). A spacer *only* requires a specific *length* (or perhaps a very broad sequence class like "poly-A") to function; any sequence meeting that length requirement works identically. There is no mapping from *specific sequence variations* to *variations in outcome*. If mere binding without sequence-specific outcome variation counts as "coding," the term becomes vacuously broad. *Output Type:* Primarily applies to immediate molecular product (e.g., bound protein, or lack thereof).

  2.  **Mapping Distinctiveness [NN]:**
      *   **Requirement:** The causal process must involve a mapping from distinguishable states/units in the carrier structure ("signals") to distinguishable states/units in the outcome ("signifieds"). The mapping must be *discrete* or *combinatorial*.
      *   **Motivation:** Case 2 (Dual Translation). A single sequence yields *two distinct* protein outcomes. This shows the mapping isn't an inherent property of the string alone. Case 4 (Prions/Methylation) reinforces this – the "meaning" of a methyl mark depends entirely on the cellular machinery interpreting it in a specific genomic context. *System Dependence:* Strongly suggests coding is a property of the string-*plus*-reader/system.

  3.  **Arbitrariness (or Lack Thereof):**
      *   **Requirement (Information-Theoretic Camp Preference):** The mapping between signal and signified must be *arbitrary* – there should be no necessary physical/chemical reason (beyond historical contingency) why *this* signal maps to *this* signified. Stereochemical necessity precludes true coding.
      *   **Requirement (Structuralist/Reductionist Camp Preference):** The mapping can be (partially or wholly) determined by stereochemical or physical affinity. Coding can emerge from direct physico-chemical interaction without arbitrariness.
      *   **Motivation:** Case 3 (Codon Reassignment). Reassignment shows the mapping *can* change historically without altering the underlying physics, suggesting arbitrariness. However, the initial assignment *might* have stereochemical roots. Case 2 also highlights potential arbitrariness (different "readers" impose different arbitrary mappings on the same string). *Stereochemical vs. Arbitrary:* This is the core of the debate.

  4.  **Potential for Misreading/Normativity:**
      *   **Requirement (Information-Theoretic/Teleosemantic Preference):** The system must allow for the *possibility* of "error" or "misreading" – instances where the *normatively correct* outcome specified by the code (given the system's function/history) fails to occur due to a malfunction in the reading process or signal corruption.
      *   **Requirement (Structuralist/Causal Fidelity Preference):** Misreading is not essential. Coding is defined by the reliable causal chain producing a specific outcome. "Error" is just a statistically infrequent breakdown in this chain, not a semantic norm.
      *   **Motivation:** Genetic code decoders (ribosomes, synthetases) demonstrably make errors. Teleosemantic accounts see this normativity (correct vs. incorrect translation) as crucial. Structuralists see it as epiphenomenal. *Naturalism Tension:* Admitting normative "correctness" (required for genuine misreading) challenges purely naturalistic accounts. Teleosemantics attempts to ground norms in biological function (selected history), but this remains contentious.

  5.  **System-Dependence vs. String-Intrinsicality:**
      *   **Requirement [NN] (Implied by R2 & Cases):** The code property is *not* intrinsic solely to the physical string. It depends on the presence and nature of a specific *interpretive machinery/system* capable of executing the mapping.
      *   **Motivation:** Case 2 (Dual Translation) is definitive. Case 4 (Prions/Methylation) reinforces it – the methyl mark only "means" something in the context of the specific cellular apparatus that recognizes it and alters gene expression accordingly. Case 1 also shows that without the *right* binding partner, the sequence has no specific functional outcome.

  6.  **Heritability & Medium Independence (Optional Scope):**
      *   **Requirement (Stricter "Genetic Code" Preference):** The carrier structure must be a *template* that is itself *replicated* and transmitted across generations (e.g., nucleic acid sequence).
      *   **Requirement (Broader "Biological Information" Preference):** Heritability via replication is desirable but not strictly necessary for "coding." Stable transmission of state (e.g., via templating like prions or faithful maintenance of marks) suffices.
      *   **Motivation:** Case 4 (Prions/Methylation) directly challenges the necessity of *nucleic acid sequence* as the sole carrier. Prions transmit conformation, methylation patterns transmit chemically. Can these be literal codes? Requires defining the scope of "genetic" information.

  7.  **Output Specification (Amino Acid, Phenotype, or Function):**
      *   **Requirement (Molecular Mechanism Focus):** The immediate, reliably determined output of the coding process is a specific polymer sequence (e.g., amino acid sequence).
      *   **Requirement (Teleosemantic/Functional Focus):** The "meaning" or content of the code is ultimately the selected *phenotypic function* or *survival advantage* it confers, not just the immediate molecular product.
      *   **Motivation:** The debate between "Crick information" (sequence -> sequence) and "Biological information" (sequence -> adaptive function). Case 3 (Codon Reassignment) shows the same gene sequence *can* produce different amino acid sequences (and potentially different functions) in different lineages, complicating a purely sequence-based output definition. Case 1 has no sequence output.

  ### Added Cases & Requirements

  8.  **Context-Dependence & Overlapping Signals:**
      *   **Requirement [NN]:** The account must handle sequences where the "meaning" (mapping/output) depends critically on the *context* within the carrier structure or the cellular state (e.g., promoter elements requiring specific chromatin state, overlapping genes, alternative splicing signals).
      *   **Motivation:** Overlapping genes on opposite strands, alternative splice sites whose usage depends on cell type. Reinforces R5 (System-Dependence) and complicates R1/R2 by showing the "unit" of coding isn't always a simple linear string.

  9.  **Degeneracy & Robustness:**
      *   **Requirement:** The account should explain how multiple distinct signals (e.g., synonymous codons) can map to the *same* signified without collapsing the notion of coding.
      *   **Motivation:** The genetic code is degenerate. This challenges overly simplistic one-to-one mapping requirements but is central to biological coding.

  ### Key Conflicts & Tensions

  1.  **R3 (Arbitrariness) vs. Structuralist Evidence:** Insisting on strict arbitrariness (Info-Theoretic) excludes stereochemical aspects of codon assignment or transcription factor binding. Denying it entirely (Structuralist) risks collapsing coding into mere direct causation.
  2.  **R4 (Misreading/Normativity) vs. Naturalism:** Grounding the norm required for "misreading" (Info-Theoretic/Teleosemantic) in natural selection (teleosemantics) is the main attempt, but critics argue it smuggles in non-naturalistic normativity or that "error" is just low-fidelity causation. Strict causal accounts (Structuralist) avoid norms but lose the error/misreading distinction central to informational language.
  3.  **R6 (Heritability) vs. Epigenetics:** Excluding non-sequence, non-replicated carriers (like prions/methylation) via R6 might be necessary for "genetic" but excludes phenomena functionally analogous to coding in inheritance. Including them broadens "code" significantly. Case 4 pushes this boundary.
  4.  **R7 (Output) - Sequence vs. Function:** Defining the output as amino acid sequence (Molecular) ignores the evolutionary context and functional plasticity (Case 3). Defining it as selected function (Teleosemantic) makes the "code" highly indirect and dependent on historical/environmental context.

  ### The Single Most Divisive Requirement

  **R3 (Arbitrariness).** This requirement cleanly separates the "Information-Theoretic" camp (insisting arbitrariness is *essential* for true coding, thus DNA/RNA sequences *are* literal codes primarily where mappings like the codon table are arbitrary) from the "Structuralist/Reductionist" camp (arguing stereochemical affinities are sufficient or primary, making "code" largely a useful metaphor for complex causation). Case 3 (Codon Reassignment) is the strongest evidence *for* arbitrariness, while evidence of stereochemical roots in the code's origin is the strongest evidence *against* its necessity. Meeting R3 excludes most structuralist accounts; rejecting R3 excludes most information-theoretic accounts. It directly shapes whether "code" is seen as a fundamental ontological category in biology or an instrumentalist description.
