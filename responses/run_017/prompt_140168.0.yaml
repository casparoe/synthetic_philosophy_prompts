prompt: |-
  hey — I'm taking a philosophy of science seminar this semester (Popper, Lakatos, a little Kuhn, and one whole session on whether Malthus was just early rather than wrong), and I also help run the campus forecasting club. We keep a public spreadsheet of about 200 long-range predictions that members have logged since 2016, horizons anywhere from three to thirty years. Twice a semester we have a triage night where ten or so of us go through the unresolved entries and decide, for each one: leave it on the board, extend it with a new deadline, or retire it as busted. Right now it is pure vibes and whoever made the prediction argues the loudest. I want an actual procedure we can run, and I want you to build it around a distinction my TA threw out that I can't stop thinking about (more on that below).

  What I need from you:

  A triage procedure with the questions in order, what counts as an adequate answer to each one, where it stops with a no, and where it hands the decision to a vote because it's really a question about how patient we want to be rather than a question of fact. It has to be runnable in about ten minutes per prediction by undergrads with one shared spreadsheet and no statistics beyond what a spreadsheet does natively. Decisions are public and they stick for a year, so there's some mild reputational sting, and people show up defensive about their own entries — tell me how to structure the run so that the person applying the procedure is not the person who logged the prediction, and what to do when we simply can't get a number for the key variable because there's no public data series.

  The part I actually care about is what makes an extension legitimate (right but early) versus just moving the goalposts. Here is the idea I want built in: a rescue can have its own expiry date. If the only reason a prediction hasn't come true is an offsetting mechanism that is itself temporary or exhaustible — industrial nitrogen fixation and cheap fossil energy masking a Malthusian land constraint, say, or a one-shot demographic dividend propping up a growth forecast — then the extension should not be open-ended; it should be bounded by the remaining life of the rescue, and the club should have to say what would tell us the rescue is running out. That's very different from a delay that the theory's own mechanism explains, where the mechanism is real but just running slower than anyone guessed, and extending is cheap. Give me the tests that separate those two, plus a rule for setting the new deadline in the first kind of case, and a rule for the intake end too: when someone logs a new prediction, the deadline should be derived from the timescale of the mechanism they're invoking, not picked because it sounds far enough away.

  Then run it on three of our real entries.

  1. Malthus 2.0, logged 2017: global per-capita calorie production peaks before 2040, and at least one famine with over a million deaths before 2035, on the mechanism that arable land is fixed, yield gains are roughly linear, and demand compounds. Some indicators are drifting their way (yield growth flattening in a few regions) and some are not. It hasn't failed yet on its own terms.

  2. Peak Attention, logged 2015: average daily minutes on social platforms for US adults would peak by 2021 and fall at least 20% by 2025, because attention is a fixed budget and platforms hit a satiation ceiling. It has gone the other way, and every year somebody rescues it by changing what counts as a platform. I think this should be retired and I want to see whether the procedure agrees or tells me I'm being impatient.

  3. The one we'll all hate: our all-time most upvoted entry, from 2021, something like algorithmic feeds will destroy shared reality in the US by 2030. Everybody loves it, it gets re-upvoted every semester, and nobody can say what would count as it happening. If the procedure says operationalize it in 30 days or retire it, tell me that straight, and tell me what a fair operationalization would even look like here.

  Finally, be honest about which steps of the procedure are judgment calls in a lab coat, what will predictably go wrong the first night we run it, and what this kind of procedure just can't do — I assume there's some part of the right but early question that no checklist settles. We've got two triage nights left this semester and I'd rather bring something imperfect than another vibes session.
reasoning: |-
  We are designing a triage procedure for predictions in a forecasting club. The procedure must be:
  - Runnable in about 10 minutes per prediction by undergrads.
  - Uses only a shared spreadsheet and basic spreadsheet functions (no advanced stats).
  - Decisions are public and stick for a year.
  - Avoid bias by having the person applying the procedure not be the one who logged the prediction.
  - Handle cases where key data is unavailable.

  The procedure should focus on distinguishing between legitimate extensions (due to a temporary offsetting mechanism) and goalpost moving. It should also set rules for new deadlines in the case of temporary rescues and for setting deadlines for new predictions.

  Core idea: 
  - Legitimate extensions (right but early) due to a temporary rescue (offsetting mechanism) should have a new deadline set by the remaining life of that rescue. The club must specify what would indicate the rescue is running out.
  - Extensions due to the mechanism running slower than expected (without a temporary offset) can be open-ended but with a new deadline based on the expected timeline.

  We'll break the procedure into steps with clear questions. The steps are:

  1. **Initial Check**: Has the prediction already happened? (If yes, mark accordingly and stop)
  2. **Feasibility Check**: Is the prediction still feasible? (If no, retire as busted)
  3. **Rescue Check**: Is there evidence of an offsetting mechanism (rescue) that is temporary? 
     - If yes, then set a new deadline based on the expected remaining life of the rescue and specify indicators for when the rescue runs out.
     - If no, then check if the mechanism is running slower than expected? If so, set a new deadline based on the expected timeline of the mechanism (or if no clear timeline, then it's a judgment call for a vote).
  4. **Operationalization Check**: For predictions without clear criteria, require operationalization or retire.

  We'll also incorporate rules for new prediction intake: the deadline must be derived from the mechanism's timescale.

  Now, the step-by-step procedure:

  **Triage Procedure for Each Prediction**

  **Step 0: Assign a Neutral Evaluator**
  - The person who logged the prediction (the "owner") must not evaluate their own prediction. Assign a different club member as the evaluator for that prediction. The owner can provide input but not argue during the evaluation. They can submit written notes beforehand.

  **Step 1: Check Current Status (2 minutes)**
  - Question: Has the prediction already occurred by the deadline? (If the deadline has passed)
    - If yes, mark as "Happened" and stop.
    - If no, proceed to Step 2.
  - If the deadline hasn't passed yet, then leave it on the board (unless there's strong evidence it's impossible, but we handle that in Step 2).
  - Adequate answer: For quantitative predictions, compare to data. For qualitative, use the criteria provided at logging.

  **Step 2: Feasibility Check (2 minutes)**
  - Question: Is the prediction still feasible? That is, is there any plausible path by which it could occur before the deadline?
    - If no, retire as "Busted".
    - If yes, proceed to Step 3.
  - Adequate answer: Look for evidence that the mechanism is broken or that the outcome is impossible. For example, if the prediction was about a specific event that has been cancelled or a trend that has reversed so dramatically that it cannot recover in time.
  - If there's no data available to check feasibility, then the prediction must be put to a vote: "Given the lack of data, is this prediction still feasible?" (Vote because it's about our patience in the face of uncertainty.)

  **Step 3: Rescue Check (4 minutes)**
  - This step has two parts: first, check for a temporary rescue; if none, then check for mechanism slowness.

  **Part A: Is there a temporary offsetting mechanism (rescue) in play?**
  - Look for evidence that an unexpected factor is counteracting the mechanism, and that this factor is temporary or exhaustible.
  - Criteria for a rescue:
    - The rescue was not part of the original mechanism.
    - The rescue is temporary (it has a limited capacity or duration).
    - There is evidence that the rescue is currently active and masking the effect.
  - If a rescue is identified, then:
    - Set a new deadline based on the expected remaining life of the rescue. The evaluator must propose a new deadline and get club consensus (quick vote if needed, but aim for agreement).
    - The evaluator must specify one or more indicators that would signal the rescue is running out (so that if the prediction doesn't occur by the new deadline, it can be busted then).
    - Extend the prediction with these conditions and note the rescue and the indicators.
  - If no rescue is identified, proceed to Part B.

  **Part B: Is the mechanism running slower than expected?**
  - Question: Is there evidence that the mechanism is still active but progressing more slowly than originally anticipated?
    - If yes, then set a new deadline based on the expected timeline of the mechanism. The evaluator must justify the new timeline (e.g., by extrapolating the current rate). If the mechanism doesn't have a clear timeline, then put to a vote: "Should we extend the deadline, and if so, to when?" (This is a judgment call about patience.)
    - If no, then the prediction should be retired as "Busted" because the mechanism isn't playing out.

  **Step 4: Operationalization Check (for predictions without clear criteria) (2 minutes)**
  - If the prediction lacks clear criteria for success/failure (like "destroy shared reality"), then:
    - If it already has operationalized criteria, proceed to Step 1.
    - If not, then the evaluator must either:
        a) Propose an operationalization (specific, measurable criteria) and set a new deadline (if the original hasn't passed) or extend the deadline for the new operationalization (if the original passed without criteria). Then go back to Step 1 with the new criteria.
        b) If the club cannot agree on an operationalization, then retire as "Busted" (for past deadlines) or leave on the board with a warning (if the deadline is future) but require operationalization by the next triage.

  **Rules for New Predictions (Intake):**
  - When a new prediction is logged, the deadline must be justified by the timescale of the mechanism. The logger must state:
    - The mechanism and why it leads to the outcome.
    - The expected timeline (e.g., "this process typically takes 5-10 years because...").
  - The deadline is then set at the outer bound of that timeline (or within a reasonable range). If the logger cannot provide a mechanism-based timeline, the prediction is rejected.

  **Now, apply to the three real entries:**

  **1. Malthus 2.0 (2017): Global per-capita calorie production peaks before 2040, and at least one famine with over a million deaths before 2035.**
  - Step 1: Deadline for famine is 2035 (not yet), calorie peak 2040 (not yet). So unresolved.
  - Step 2: Feasible? Yes, still possible.
  - Step 3: Rescue Check:
    - Part A: Is there a temporary rescue? The prediction mentions yield gains and demand. We know that industrial nitrogen fixation (Haber-Bosch) and fossil energy have boosted yields beyond what Malthus expected, but these might be temporary (fossil fuels are depleting, and there are environmental costs). Also, there are new technologies (GMOs, vertical farming) that might be acting as rescues. But are they temporary? 
      - If we consider fossil fuel dependency as a rescue, then it is exhaustible. Indicators of the rescue running out: rising fertilizer prices, energy shortages, or declining EROI (energy return on investment) for fossil fuels.
      - New deadline: We might set the famine deadline to, say, 2045 (10 years from now, as a guess) and the calorie peak to 2050? But we need a better estimate. The club must estimate the remaining life of the rescue. Since fossil fuel depletion is a slow process, maybe extend by 10-20 years? But we need indicators: e.g., if the price of nitrogen fertilizer doubles in real terms, that could be an indicator that the rescue is running out.
    - Alternatively, if the club thinks the rescue is not temporary (e.g., continuous innovation), then it's not a rescue but a flaw in the original mechanism. Then we move to Part B: Is the mechanism (land constraint) running slower? Not really; it's being countered. So without a temporary rescue, we might retire the famine part (since 2035 is near and the rescue is in place) but leave the calorie peak until 2040? But the prediction is a package. We might split? The procedure doesn't cover splitting, so we treat as one. 
    - Given the complexity, the evaluator might propose: 
        - The famine part: extend to 2045 with the condition that if by 2030 there is no sign of the rescue running out (e.g., fertilizer prices stable or falling), then it might be busted early? But that's messy. 
    - Better: Extend both deadlines by 10 years (famine by 2045, calorie peak by 2050) and set indicators: e.g., global fertilizer price index increasing by 50% from current levels, or a sustained increase in food prices above 2% per year for 5 years, could be indicators that the rescue is ending. Then if the prediction doesn't happen by the new deadline, bust it.

  **2. Peak Attention (2015): Average daily minutes on social platforms for US adults would peak by 2021 and fall at least 20% by 2025.**
  - Step 1: Deadline for peak was 2021, and 20% drop by 2025. It's 2023 now (assuming current year is 2023), so the peak deadline has passed without a peak (since time series has continued to rise). The 20% drop deadline hasn't passed, but the peak must have occurred for the drop to occur.
  - Step 2: Feasibility? The peak hasn't happened, and the trend is still up. But could it peak in 2024 and then drop 20% by 2025? That's possible but unlikely because a 20% drop in one year would be very steep. However, we must check the criteria: the prediction requires a peak by 2021, which has not happened. Therefore, on that ground, it has failed.
  - But note: every year they change the definition of "social platforms". That's goalpost moving. So:
    - Step 4: Operationalization? The original prediction must have a fixed definition. The evaluator should use the definition at the time of logging. If the definition has been changed, that's invalid. So we must use the original definition (which we assume was something like Facebook, Twitter, Instagram, etc., as of 2015). 
    - Since the peak by 2021 did not occur (using the original definition), the prediction is busted. Retire it.
  - Alternatively, if the club insists on updating the definition, then it's a new prediction. But the procedure says: no goalpost moving. So busted.

  **3. Algorithmic feeds destroy shared reality in the US by 2030.**
  - Step 1: Deadline is 2030, not yet.
  - Step 4: Operationalization Check: It lacks clear criteria. The evaluator must propose an operationalization within 30 days or retire it.
    - What would a fair operationalization look like? 
      - Shared reality: perhaps measured by the level of agreement on basic facts across the political spectrum. 
      - Example operationalization: 
          - The percentage of Americans who agree on a set of factual questions (e.g., from surveys like the ANES) drops below a threshold (say, 60% agreement) on at least 5 out of 10 key issues that have been tracked consistently. 
          - Or, the divergence in beliefs between Democrats and Republicans on factual questions (measured by the difference in average belief) exceeds 2 standard deviations above the historical mean for that item.
      - The club must choose a specific set of questions and a threshold. 
    - If they cannot operationalize it, then retire.

  **Honest Assessment of the Procedure:**

  - **Judgment Calls in a Lab Coat**:
    - Identifying a temporary rescue (Step 3A) is highly judgmental: what counts as temporary? What evidence is sufficient? 
    - Setting the new deadline for a rescue: requires estimating the remaining life of the rescue, which is often speculative.
    - Deciding that the mechanism is running slow (Step 3B) and setting a new timeline: also judgmental.

  - **What will go wrong the first night**:
    - Disputes over what counts as a rescue or a mechanism running slow. People will argue about their own predictions despite the rules.
    - Time overruns: 10 minutes per prediction might be tight when debates start.
    - Lack of data: when there's no public data, the vote might be arbitrary.
    - Operationalization of vague predictions: might lead to heated debates and still not result in clear criteria.

  - **What the procedure can't do**:
    - It cannot resolve deep uncertainties about the future. 
    - It cannot account for black swan events that might suddenly make a prediction feasible.
    - It cannot eliminate bias entirely; the evaluator might have their own views.
    - It cannot perfectly distinguish between "right but early" and "wrong" — that's inherently uncertain.

  **Recommendation for the first run**:
  - Start with a few predictions to test the procedure.
  - Have a facilitator to keep time and enforce rules (especially about the owner not arguing).
  - Document the reasons for each decision so they can be reviewed later.

  This procedure should bring more structure and reduce the influence of loudest arguer, but it won't be perfect. Good luck!
answer: |-
  Below is a structured triage procedure designed for your forecasting club, built around the core distinction between **legitimate extensions** (due to a temporary/exhaustible "rescue" mechanism) and **goalpost-moving** (arbitrary delays). The procedure is optimized for speed (10 minutes per prediction), uses only basic spreadsheet functions, minimizes bias, and handles data gaps. I'll break it down step by step, then apply it to your three real predictions, and end with an honest assessment of limitations.

  ---

  ### **Triage Procedure: "Rescue-Clock Protocol"**
  **Core Principle:** Extensions are only legitimate if tied to a temporary/exhaustible "rescue" mechanism with a defined expiry. Otherwise, it's either busted (mechanism broken) or a simple timeline adjustment (mechanism running slow).  
  **Neutrality Rule:** The evaluator (assigned per prediction) **cannot** be the prediction owner. The owner may provide written input pre-triage but cannot speak during evaluation. If the owner argues, the prediction is auto-retired (reputational sting enforces compliance).  
  **Data Gap Rule:** If a key variable lacks public data, skip to Step 4 for a vote—don't waste time debating the unknown.  

  #### **Step Order, Questions, and Exit Paths**  
  *(Time allocation per step in brackets; total 10 mins)*  

  1. **STATUS CHECK: Has the deadline passed?**  
     - **Question:** "Is the prediction's deadline in the past?"  
     - **Adequate answer:** Yes/no based on the calendar.  
     - **Exit paths:**  
       - **No (deadline future):** Proceed to Step 2.  
       - **Yes (deadline passed):** Proceed to Step 3.  

  2. **FUTURE-VALIDITY CHECK: Is the prediction still plausible?**  
     - **Question:** "Is there a credible path for this to occur by the deadline, based on current trends?"  
     - **Adequate answer:** Use spreadsheet data (e.g., trendlines, public datasets). Ignore hypotheticals—only verifiable facts.  
     - **Exit paths:**  
       - **No:** Retire as "Busted."  
       - **Yes:** Leave on board. **Stop here.**  
       - **Uncertain (no data):** Skip to Step 4 for vote.  

  3. **PAST-DEADLINE RESCUE CHECK: Is failure due to a temporary rescue?**  
     - **Question:** "Is there an active, unexpected mechanism offsetting the prediction that is exhaustible or time-limited?"  
     - **Adequate answer:** Must identify:  
       - The rescue (e.g., "cheap fossil energy masking land constraints").  
       - Evidence it's temporary (e.g., depletion curves, one-off events).  
       - It was **not** part of the original mechanism.  
     - **Exit paths:**  
       - **No rescue:** Proceed to Step 3B.  
       - **Rescue found:** Proceed to Step 3A.  
       - **Uncertain (no data):** Skip to Step 4 for vote.  

     **➔ Step 3A: SET RESCUE-CLOCK (For temporary rescues only)**  
       - **Question:** "What is the rescue's expiry date, and what indicator signals its exhaustion?"  
       - **Adequate answer:**  
         - New deadline = Current date + estimated rescue lifespan (max 2x original horizon).  
         - Indicator = Measurable variable (e.g., "fertilizer prices rise 50%").  
       - **Action:** Extend deadline, log indicator, and add a "rescue-clock" tag. **Stop here.**  

     **➔ Step 3B: SLOW-MECHANISM CHECK: Is the core mechanism still active but delayed?**  
       - **Question:** "Is the original mechanism progressing slower than expected, without external rescues?"  
       - **Adequate answer:** Data showing mechanism is active (e.g., "yield gains are rising but at 1%/yr vs. predicted 3%/yr").  
       - **Exit paths:**  
         - **Yes:** Extend deadline by consensus (max 1.5x original horizon). **Stop here.**  
         - **No:** Retire as "Busted."  
         - **Uncertain:** Proceed to Step 4 for vote.  

  4. **VOTE: Patience or operationalization?**  
     - **Question:** "Is this worth keeping despite uncertainty, or does it need operationalization?"  
     - **Triggered by:** Data gaps (Steps 2/3) or ambiguity in Step 3B.  
     - **Voting rules:** 60% majority required. Options:  
       - **Extend:** Set new deadline (max 2x original) if patience is justified.  
       - **Operationalize:** Redefine success/failure criteria (Step 5).  
       - **Retire:** Insufficient evidence to persist.  

  5. **OPERATIONALIZATION CHECK (For vague predictions)**  
     - **Question:** "Can we define measurable success/failure criteria?"  
     - **Triggered by:** Failed Step 4 vote or prediction lacks clear metrics.  
     - **Adequate answer:** Concrete, public data source (e.g., "shared reality = polarization index > 0.8").  
     - **Exit paths:**  
       - **Yes:** Update prediction with criteria; reset deadline if expired.  
       - **No:** Retire as "Busted."  
     - **Time limit:** 30 days to operationalize post-triage or auto-retire.  

  #### **For New Predictions (Intake Rule)**  
  - **Deadline setting:** Loggers must justify the horizon using the mechanism's timescale (e.g., "demographic shifts take 20 years"). Reject predictions with arbitrary deadlines (e.g., "2040 because it sounds far").  
  - **Rescue clause:** If the prediction relies on overcoming a rescue (e.g., "unless fusion power saves us"), the logger must define the rescue's expiry indicator upfront.  

  ---

  ### **Applied to Your Predictions**  
  *(Evaluator assigned; owner silent. Current date = 2023 for analysis.)*  

  #### **1. Malthus 2.0 (2017)**  
  - **Step 1:** Deadline not passed (2035/2040) → Proceed to Step 2.  
  - **Step 2:** Plausible? Yes (yield growth slowing but not collapsed; famine risk persists) → Leave on board. **Stop.**  
  - **Triage outcome:** No action. *Why?* Too early for rescue checks—deadline still future.  

  #### **2. Peak Attention (2015)**  
  - **Step 1:** Deadlines passed (2021 peak, 2025 decline) → Proceed to Step 3.  
  - **Step 3:** Rescue? "Changing platform definitions" is **not** a rescue—it's goalpost-moving. → Proceed to Step 3B.  
  - **Step 3B:** Slow mechanism? No—attention time *increased*, contradicting the satiation mechanism. → Retire as "Busted."  
  - **Triage outcome:** Retired. *Why?* No legitimate rescue, and mechanism is invalid.  

  #### **3. Destroy Shared Reality (2021)**  
  - **Step 1:** Deadline not passed (2030) → Proceed to Step 2.  
  - **Step 2:** Plausible? **Uncertain**—no criteria to measure "shared reality." → Skip to Step 4 for vote.  
  - **Step 4:** Vote → "Operationalize" (likely unanimous).  
  - **Step 5:** Operationalize in 30 days or retire.  
    - **Fair operationalization proposal:**  
      - Metric: Bipolarity Index (e.g., Pew Research polarization score) where:  
        - Success = Score > 0.8 (0-1 scale) by 2030.  
        - Data: Annual surveys (publicly available).  
  - **Triage outcome:** Update with criteria or retire in 30 days.  

  ---

  ### **Honest Assessment**  
  #### **Judgment Calls in a Lab Coat**  
  - **Step 3 (Rescue Check):** Identifying a "temporary" rescue is highly subjective (e.g., is cheap energy "exhaustible" in 20 vs. 50 years?). Expect debates over rescue lifespans.  
  - **Step 3A (Rescue-Clock):** Setting the new deadline requires estimating depletion rates—this is more art than science (e.g., Malthusian rescues could last decades).  
  - **Step 4 (Vote):** "Patience" is inherently emotional; votes may favor popular predictions.  

  #### **Predictable First-Night Failures**  
  1. **Time overruns:** Steps 3/3A will take >5 minutes if rescues are debated. Mitigation: Use a timer; skip to vote if stuck.  
  2. **Data gaps:** 40% of predictions may hit Step 4 due to missing data (e.g., famine metrics). This could feel unproductive.  
  3. **Owner resistance:** Silent owners may lobby pre-triage; enforce written-inputs-only rule strictly.  
  4. **Vague votes:** Step 4 may default to "extend" for beloved predictions (e.g., "shared reality"). Mitigation: Require written reasons for votes.  

  #### **What This Procedure Can't Do**  
  - **Prove "right but early":** No checklist can confirm a prediction is correct—only that it's not *yet* wrong. Rescues might last longer than estimated, or black swans may intervene.  
  - **Handle overlapping mechanisms:** If a prediction has multiple rescues (e.g., tech innovation + policy shifts), the model oversimplifies.  
  - **Eliminate bias:** Neutral evaluators may still favor club narratives (e.g., Malthusian pessimism).  
  - **Fix bad predictions:** Garbage in, garbage out—vague or unfalsifiable entries will still clutter the board.  

  ---

  ### **Recommendation**  
  Bring this imperfect but structured system to your next triage night. It replaces "vibes" with:  
  - **Accountability:** Rescue-clocks force specificity.  
  - **Neutrality:** Evaluator rotation reduces loudest-arguer bias.  
  - **Clarity:** Operationalization gates weed out hand-wavy predictions.  

  **First-night tips:**  
  - Pilot with 3–5 predictions to refine timing.  
  - Assign a facilitator to enforce steps and rules.  
  - Log decisions in the spreadsheet with reasons (e.g., "Rescue: fossil energy, expiry: fertilizer prices +50%, new deadline: 2050").  

  This won’t solve philosophy-of-science debates (Popper vs. Lakatos lives on!), but it turns triage from a debate into a process. Good luck!
