prompt: |-
  I chair the investment and analytics group at a regional water utility. Three or four times a year my group is handed the same question in a new costume: before we commit to an expensive and hard-to-reverse capital decision — relining or replacing a stretch of trunk main, adding a treatment stage, relocating a pumping station — should we first buy more information? A condition survey, a short pilot, a hydraulic modelling study, a year of monitoring. Each costs real money, takes months, and freezes the decision while it runs, so the delay is itself part of the price.

  My colleagues reason about this with a slogan I have come to distrust: information is never bad for you. They gesture at the value-of-information theorem usually credited to I. J. Good — roughly, that an agent who maximises expected utility and revises by conditionalisation cannot be made worse off in expectation by a costless observation, since such an agent can always disregard the observation and take whichever act had maximal expected utility beforehand. From this they conclude that any study with a non-zero chance of changing our minds is worth commissioning and that the only open question is whether it is cheap enough.

  I do not think that conclusion follows, and I want a procedure rather than a debate. Please write a decision procedure my group can run on a proposal to buy information ahead of a capital decision, in the order the questions should be asked, with what counts as an adequate answer to each, where it stops with a no, and where it hands the question to a person because it is a question of values rather than fact. Constraints: my team has a good calibrated forecaster, one member who reliably over-reads a single striking data point, an engineering director who treats a pilot as a commitment to scale it up, and a board that must sign off and sometimes ignores what we give it. Nobody on the team will do algebra under time pressure, and there are usually no base rates for the specific asset under the specific street.

  In building the procedure, please deal with at least the following, since these are the places I suspect the slogan is doing work the theorem does not license. First, what has to be true of us, as a decision-making body, for the guarantee to apply at all — in particular whether we can commit in advance to a rule linking each possible result to an action, and whether our actual revision practice is close enough to conditionalisation for the argument to go through. Second, the cases where the value is genuinely zero: results that leave the decision unchanged, but also results that can only bind us through channels that are not the decision, such as a finding that would trigger a regulatory duty or a publication obligation, where the option of simply ignoring what we learn is not available to us. Third, how to value information that is not free and that arrives late, in a form people without formal training can actually run, and what to do when the inputs cannot be estimated. Fourth, the cases where the study changes what we are choosing between or who gets to choose, and where the design of the study determines the answer it will return. Fifth, the fact that waiting is itself a way of acquiring information.

  Then run the finished procedure on three proposals. One: a condition survey of an ageing trunk main before deciding whether to reline it or replace it outright. Two: a twelve-month pilot of a new treatment process before committing to full-scale construction, where the director will read the pilot as approval. Three, and this is the one I expect to dislike: a monitoring programme that would very likely detect a contaminant we cannot prevent and would then be legally obliged to remediate at great cost, where the study changes nothing about the physical outcome. If your procedure tells us not to commission that third study, I want to know whether that is the correct answer or whether the procedure is being used to license wilful ignorance, and I want the difference between expected value of information and whatever duty to inquire we might have stated explicitly.

  Finally, say plainly what the procedure cannot do, and which steps are judgment wearing a lab coat.
reasoning: |-
  Hmm, the user chairs an investment group at a water utility and faces recurring decisions about whether to commission studies before major capital investments. They've identified several issues with their colleagues' "information is never bad" approach and want a practical decision procedure that addresses real-world constraints like cognitive biases, organizational behaviors, and regulatory risks.

  The user has clearly thought deeply about this problem. They're challenging a simplistic interpretation of Good's theorem by pointing out practical limitations: information isn't free (cost + delay), their team can't always commit to decision rules in advance, and conditional probability updating isn't consistently applied. The organizational specifics matter - the engineering director's "pilot as commitment" mindset, the board's unpredictability, and the forecaster who overweights salient data points.

  Key challenges they want addressed: 1) When does the value-of-information theorem actually apply to their decision-making process? 2) How to handle cases where information creates binding obligations (like regulatory triggers) rather than just informing decisions? 3) Practical valuation methods for non-specialists when inputs are uncertain. 4) How study design can manipulate outcomes or change decision options. 5) The opportunity cost of waiting versus active information-gathering.

  For the three test cases: The pipe survey seems like a classic VoI scenario where the procedure should work well. The treatment pilot is complicated by the director's bias - we'll need to account for behavioral factors. The contaminant monitoring is ethically charged since it might create legal liability; we'll need to separate VoI calculations from any duty-to-know obligations.

  The procedure should be algebra-free and focus on structured questions rather than calculations. We'll need clear stopping rules ("no" gates) and explicit handoffs for value judgments. Important to flag where steps appear quantitative but actually require judgment - what the user cleverly calls "judgment wearing a lab coat."

  For the contaminant case, I'll need to distinguish sharply between: a) the expected value calculation (which will likely say "don't test" since testing only adds cost and liability without changing outcomes) versus b) potential ethical/regulatory duties to know about hazards. The procedure can only address (a); (b) requires separate governance discussion.

  Finally, we must acknowledge limitations: the framework can't eliminate uncertainty, can't fix organizational dysfunctions, and relies on subjective probability estimates. The calibration of the "good forecaster" will be critical to the quality of outputs.
answer: |-
  Below is a step-by-step decision procedure for evaluating information-gathering proposals, designed for your team's constraints. It addresses your concerns about Good's theorem, incorporates behavioral realities, and includes explicit "NO" gates and handoffs for value judgments. The procedure is structured as a flowchart of questions, usable by non-specialists without algebra.

  **DECISION PROCEDURE: SHOULD WE COMMISSION THIS STUDY?**  
  *(Run sequentially; stop at any "NO" or handoff)*

  1.  **IS THE STUDY FREE & INSTANTANEOUS?**  
      *   *Adequate Answer:* Explicitly list all costs: Direct cost, delay cost (e.g., inflated construction costs, deferred benefits, risk during delay), and opportunity cost (staff time). Quantify ranges if possible.
      *   **NO:** Proceed to Step 2. (Good's theorem guarantee *does not apply* - cost/delay matter).
      *   YES (Theoretically impossible): Commission it. (But practically, stop here - this never happens).

  2.  **DOES THE STUDY *ONLY* INFORM THE IMMEDIATE CAPITAL DECISION?**  
      *   *Adequate Answer:* Identify potential *binding consequences* independent of the capital choice: Regulatory triggers (e.g., mandatory remediation), public disclosure obligations, legal discovery risks, PR fallout, or internal policy commitments (e.g., "any positive detection requires action").
      *   **NO (It creates binding consequences):** Handoff to Legal/Board/Values Committee. *Question:* "Does the *potential obligation* created by knowing this information outweigh any decision-informing value, considering our duty to stakeholders and legal exposure?" (This is a values/risk-tolerance judgment).
      *   YES (Only informs the capital decision): Proceed to Step 3.

  3.  **CAN WE PRE-COMMIT TO A DECISION RULE?**  
      *   *Adequate Answer:* Define specific thresholds for each possible study outcome that would change the capital decision (e.g., "If pipe wall loss >40%, replace; else reline"). Ensure the rule is documented *before* seeing data. Consult your calibrated forecaster.
      *   **NO (We might 'wing it' or outcomes are too vague):** Handoff to Decision Governance. *Question:* "Can we formally adopt and bind ourselves to a specific decision rule based on study outcomes *right now*?" If not, the value of information is highly uncertain/diminished. Likely "NO" to study.
      *   YES (We have a clear, pre-committed rule): Proceed to Step 4.

  4.  **IS THE DECISION STILL REVERSIBLE AFTER THE DELAY?**  
      *   *Adequate Answer:* Assess if waiting changes the fundamental options or costs (e.g., does delay force a more expensive solution? Does the problem worsen significantly? Do alternatives disappear?).
      *   **NO (Delay itself forces a worse or different decision):** Strong Lean **NO** (Study likely too costly). Handoff only if uncertainty is extreme. *Question:* "Is the potential value of perfect information so high it justifies accepting the degraded position caused by delay?"
      *   YES (Options remain comparable after delay): Proceed to Step 5.

  5.  **WHAT'S THE EXPECTED VALUE OF PERFECT INFORMATION (EVPI) FOR THIS DECISION?**  
      *   *Adequate Answer:* Calibrated forecaster estimates:
          *   `V_good` = Value (NPV, cost savings) if we knew the *best* choice immediately.
          *   `V_base` = Value of best choice *without* the study (using current best estimates).
          *   `EVPI = V_good - V_base`. Use ranges/scenarios if point estimates are shaky.
      *   **EVPI ≈ 0?** (Study can't meaningfully improve the decision): **NO** - Do not commission.
      *   **EVPI > 0?** Proceed to Step 6. (This is the *maximum possible* value the study *could* have).

  6.  **WHAT'S THE EXPECTED VALUE OF THIS SPECIFIC STUDY (EVSI)?**  
      *   *Adequate Answer:* Calibrated forecaster estimates:
          *   `P(Change)` = Probability study changes the decision *under our pre-committed rule* (Step 3).
          *   `Avg_Benefit` = Average improvement in value *when* the study changes the decision.
          *   `EVSI = P(Change) * Avg_Benefit`. Use conservative estimates. Acknowledge uncertainty.
      *   **EVSI ≤ Total Cost (Step 1)?** **NO** - Do not commission. (Study isn't worth its cost+delay).
      *   **EVSI > Total Cost?** Proceed to Step 7.

  7.  **HOW ROBUST IS THIS TO OUR BIASES & REALITIES?**  
      *   *Adequate Answer:* Stress-test Step 6 considering:
          *   *Over-reading:* Could a single data point (good or bad) override the rule? If likely, downgrade `P(Change)` or `Avg_Benefit`.
          *   *Pilot as Commitment:* If Director interprets pilot success as mandatory scale-up regardless of other factors (cost, new info), does this distort the decision rule? If yes, handoff to Governance/Board: "Can we insulate the final decision from this bias?" If not, **NO**.
          *   *Board Ignoring:* If Board might ignore a "no change" recommendation, does this create cost/risk? If yes, include this cost in Step 1 or adjust `EVSI`.
          *   *Study Design Bias:* Could the study methodology predetermine an outcome? Consult independent expert briefly.
      *   **After adjustments, is EVSI still > Total Cost?** **YES**: Commission the study (Provisional Yes).
      *   **NO**: Do not commission.
      *   **UNCERTAIN:** Handoff to Group Judgment. *Question:* "Given the potential upside, downside risks, and biases, is the *confidence-adjusted* EVSI still worth the cost?"

  **Where Judgment Wears a Lab Coat:**
  *   Estimating `P(Change)` and `Avg_Benefit` (Step 6) - Requires calibrated judgment, not pure calculation.
  *   Quantifying delay/opportunity costs (Step 1) - Involves forecasting and valuation assumptions.
  *   Stress-testing for biases (Step 7) - Subjective assessment of human factors.
  *   Assigning ranges/scenarios - Choosing plausible bounds is judgmental.

  **What the Procedure CANNOT Do:**
  1.  **Eliminate Uncertainty:** It quantifies the *expected value* of reducing uncertainty, not certainty itself.
  2.  **Fix Dysfunctional Governance:** If the Board ignores analysis or the Director cannot be constrained, the EVSI calculation is unreliable.
  3.  **Provide Precise Answers with No Data:** It relies on *structured expert judgment* (your forecaster). Garbage In = Garbage Out.
  4.  **Replace Ethical/Legal Duties:** It assesses *instrumental value for a specific decision*, not moral obligations to know (addressed in Step 2 Handoff).
  5.  **Guarantee a Correct Decision:** It aims for the best *expected* outcome based on current knowledge and costs.

  ---

  **Running the Procedure on Your Proposals:**

  1.  **Condition Survey (Aging Trunk Main):**
      *   Step 1: Not free. Cost = Survey Cost + Delay Cost (Risk of failure during survey? Inflation?).
      *   Step 2: Likely YES (Only informs Reline/Replace decision).
      *   Step 3: YES (e.g., Rule: "If structural rating < X, replace; else reline").
      *   Step 4: Likely YES (Delay unlikely to fundamentally change options).
      *   Step 5: EVPI likely HIGH (Cost difference between reline/replace is large; consequence of failure is severe).
      *   Step 6: EVSI likely HIGH (Survey is directly relevant; `P(Change)` could be moderate/high depending on current uncertainty). Likely > Cost.
      *   Step 7: Biases? Over-reader might fixate on one bad spot; ensure rule uses overall rating. Director/Board unlikely to interfere. EVSI likely remains > Cost.
      *   **OUTCOME: YES (Commission Survey).** A strong candidate for VoI.

  2.  **Treatment Process Pilot:**
      *   Step 1: Not free. Cost = Pilot Cost + Delay Cost (1 year delay in full-scale benefits) + Staff Time.
      *   Step 2: YES (Primarily informs build/don't build... *but see Step 7*).
      *   Step 3: YES (e.g., "If pilot meets performance criteria Y & cost Z, build; else abandon").
      *   Step 4: Likely YES (Technology unlikely to leapfrog in 1 year? Competitors?).
      *   Step 5: EVPI likely HIGH (Full-scale build is expensive; new tech might offer significant savings/benefits or be a dud).
      *   Step 6: EVSI likely MODERATE/GOOD (`P(Change)` depends on current confidence; `Avg_Benefit` could be high).
      *   **Step 7: CRITICAL - DIRECTOR BIAS.** If "success" = mandatory build *regardless* of cost/other factors, this destroys the decision rule. `P(Change)` becomes ~1 (but always to "build"), and `Avg_Benefit` could be *negative* if forced into a bad build. **HANDOFF TO GOVERNANCE/BOARD:** "Can we formally decouple pilot results from automatic build commitment and adhere strictly to the pre-defined rule including cost-effectiveness?" **If NO, then PROCEDURE OUTCOME: NO (Do not pilot).** If YES, proceed: Adjusted EVSI likely still > Cost? **OUTCOME: YES (with governance safeguard)** or **NO (if bias risk makes EVSI ≤ Cost)**.

  3.  **Contaminant Monitoring Programme:**
      *   Step 1: Not free. Cost = Monitoring Cost + Delay Cost? (Unclear - decision frozen?).
      *   **Step 2: NO (It creates a binding consequence).** Detection triggers a mandatory, costly remediation. Ignoring the result is *not* an option legally/ethically. **HANDOFF TO LEGAL/BOARD/VALUES:** "Does our duty to know about potential public health risks outweigh the near-certain financial loss from triggering remediation, even though the physical outcome (contamination exists) is unchanged?" *This is not a VoI question.* The *expected cost* of the study is: Monitoring Cost + [Probability(Detection) * Cost of Remediation]. Unless the probability of detection is near zero, this is almost certainly a large negative value *for the capital decision process*. However, the *duty to know* (values/ethics/legal compliance) might compel it. The procedure correctly identifies this as **NOT primarily a VoI question** and hands it off. **PROCEDURE OUTCOME: NO (for VoI reasons)**, but the handoff requires a separate values-based decision.

  **On Wilful Ignorance vs. Correct VoI Answer (Contaminant Case):**

  The procedure's "NO" for commissioning the contaminant study **based on VoI is correct**. VoI assesses the value of information *for improving a specific decision*. Here:
  *   The "decision" is ostensibly about remediation, but remediation is *mandatory* upon detection.
  *   The monitoring doesn't change the *physical reality* of contamination – it only changes *our knowledge* of it.
  *   The *only* consequence of the study is potentially triggering a costly mandatory action sooner than it might otherwise occur (if the contaminant would eventually be found or cause harm).
  *   The Expected Value *of the decision process* is strictly worse with the study: You incur the monitoring cost *plus* the expected cost of earlier remediation. There is no offsetting benefit in terms of choosing a better action (remediation is the only action).

  **This is distinct from a "duty to inquire":**
  *   **VoI (Procedure):** Answers "Does spending resources to learn this *help us make a better choice* in a way that justifies the cost?" Answer: No.
  *   **Duty to Inquire (Values/Legal/Ethics):** Answers "Do we have an obligation to know this information *regardless* of its instrumental value for this specific decision, due to public health, regulatory requirements, fiduciary duty, or moral responsibility?" This is the handoff question.

  The procedure correctly separates these concepts. Using VoI to avoid a *duty to inquire* is "wilful ignorance." The procedure prevents this by forcing the explicit handoff in Step 2 for cases where information creates binding obligations, requiring the values question to be confronted directly.
