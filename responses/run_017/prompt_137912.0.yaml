prompt: |-
  I teach a graduate seminar on medieval political theory, and last term a colleague from the law school sat in on the session on tyranny and afterward argued that the whole tyrannicide material is anachronistic costume drama: that Aquinas's treatment of sedition and his treatise on kingship give us no purchase on anything anyone now actually has to decide. I think he is half right, and I want to test the other half by trying to make the material do real work. The occasion is a practical one. I sit on the advisory panel of a small foundation that funds civic-resistance and human-rights organizations, and its board — two lawyers, a former ambassador, a retired aid worker, and two donors, no philosophers among them — has asked me for a written screening procedure it can run on funding requests that involve support for the killing of a head of state or of a ruler's inner circle. They meet for half a day once a month, they see dozens of requests, they cannot read Latin or Aquinas, and they need something they can apply in a single afternoon without summoning me: an ordered sequence of questions, a specification of what counts as a sufficient answer to each, an explicit statement of where the procedure terminates in a no and where it hands the decision to a person because the remaining question is one of values rather than facts, and a note at each step about whether that step is a genuine test or a judgment call wearing procedural clothing.

  What I want from you is that procedure, built as an operationalization of the Thomistic account rather than a summary of it. Please be explicit about three interpretive decisions you have to make in order to build it at all. First: whether the familiar cautions — that the community should not act rashly, that the remedy may turn out worse than the disease — are constraints on permissibility or only on prudence; the entire shape of the checklist depends on whether a grim expected outcome blocks the action or merely counts against it in deliberation. Second: who may authorize. Aquinas's requirements appear to presuppose a public authority competent to speak for the political community, and the cases my board sees are precisely ones in which that authority has been hollowed out, so the procedure needs a test for what I have started calling the proxy-authority problem: when a rump parliament sitting abroad, a federation of trade unions, a traditional council, or a broad-based popular assembly may stand in for a functioning public authority, together with an epistemic threshold, given that in most of these cases the ruler still commands the genuine allegiance of a substantial minority of the population. Third: the account seems to presuppose an individual ruler, and I want to know what the procedure does with depersonalized or distributed tyranny — a junta, a standing committee, a coercive apparatus administered partly through automated surveillance and fronted by a figurehead — including whether killing a subordinate who actually wields the coercive power is the same kind of act, for these purposes, as killing the titular ruler. I would also like the procedure to take a position on a title-forfeiture question my seminar got stuck on: how a ruler who came to office with a genuine title but has since gutted the institutions that conferred it is to be classified, whether the standard contrast between defect of title and defect in the exercise of rule has anything useful to say about that decay over time, and whether there is any threshold at which a once-lawful ruler becomes, for the purposes of the procedure, a usurper.

  Then run the procedure on three cases, and do not soften the third. (1) A president elected ten years ago in an internationally credited election who has since packed the courts, abolished term limits through a compliant legislature, and presides over security services credibly implicated in roughly a thousand killings; a coalition that includes the surviving caucus of the pre-purge parliament, two national unions, and a religious council has publicly declared him a tyrant and has asked for support for an operation to kill him. (2) A six-month-old junta that dissolved parliament and is shooting peaceful protesters, where a rump of the previous parliament sitting abroad claims to speak for the country and has requested a strike against the junta's leader. (3) A long-entrenched and genuinely atrocious ruler — the facts about the mass atrocities are not in doubt — where the only feasible means of killing him is a strike carried out by the intelligence service of a self-interested regional power, the predictable sequel is a succession war between two militias, and the ruler's own minority community is likely to be massacred in the reprisals that follow; my board will want to say yes to this one, and I suspect that a procedure honestly derived from the material should say no. Finally, tell me what the procedure cannot do: where Aquinas's commitments — about the common good as ordered rule rather than as a set of individual rights, about the moral significance of killing itself, about who may licitly kill for a public cause — come apart from the human-rights baseline my board actually holds, and which of those gaps would have to be closed by an act of decision rather than by further argument.
reasoning: |-
  Hmm, the user is a professor teaching medieval political theory who needs to create a practical decision procedure for a foundation funding civic-resistance groups. They want this procedure rooted in Aquinas's framework on tyranny and tyrannicide, but operationalized for modern use by non-philosophers. 

  The core tension here is fascinating - taking 13th century scholastic thought and making it bite on contemporary dilemmas of political violence. The user's colleague dismissed this as "costume drama," but the professor clearly believes Aquinas offers something enduring. Their real challenge is translation: how to extract durable principles from De Regno and the Secunda Secundae while admitting where medieval assumptions don't stretch to cover algorithmic oppression or hollowed-out states.

  Three interpretive knots need unpicking first. On authorization: Aquinas assumes a functioning public authority, but modern resistance often emerges precisely where that's shattered. The "proxy-authority problem" is acute - when does a trade union federation or exiled parliament count as the "community" that can licitly authorize violence? Then there's the outcome calculus: for Aquinas, is a disastrous expected consequence an absolute bar or just a prudential caution? That distinction will shape whether the checklist has hard stops or weighted considerations. Lastly, the distributed tyranny issue - Aquinas wrote of individual rulers, but how does his framework handle juntas or surveillance states?

  The case studies reveal where rubber meets road. Case 1 is relatively straightforward: elected-turned-tyrant with institutional decay, plausible domestic coalition seeking removal. Case 2 tests proxy authority - an exiled parliament's legitimacy against a fresh junta. Case 3 is the grenade: morally urgent but pragmatically catastrophic, where Aquinas would likely forbid action but humanitarians would itch to act. That gap between Thomistic order-focused ethics and rights-based interventionism is where the procedure will chafe.

  Building this means making explicit choices Aquinas left implicit. For instance: title forfeiture. If a ruler gained power legitimately but destroyed the institutions that legitimized him, when does he cross into usurper status? The procedure needs a bright line - perhaps when he dismantles accountability mechanisms. And on collective tyranny, we might borrow Aquinas's logic about attacking the "directing will" whether embodied in one person or a committee.

  The board's constraints matter deeply. They're busy non-specialists needing a usable tool, not a philosophical treatise. So the output must be lean: binary questions, clear thresholds, explicit judgment calls. Where values conflict (e.g., "can we accept mass reprisals to stop ongoing atrocities?"), the procedure should flag that it's handing off to human discretion.

  What emerges isn't pure Aquinas but Aquinas filtered through modern dilemmas - and that's precisely what the user wants. The gaps are revealing: Thomas cares about who wields the sword and why, while human rights frameworks focus more on outcomes. Bridging that requires acknowledging where the medieval scaffold ends and contemporary judgment must begin.
answer: |-
  Here is an operationalized screening procedure for tyrannicide funding requests, derived from Thomistic principles and designed for practical use by your foundation's board. The procedure is structured as a sequential checklist with explicit thresholds, termination points, and notes on interpretive nature.

  ---

  ### **THOMISTIC TYRANNICIDE SCREENING PROCEDURE**  
  *For Foundation Board Use: Apply Sequentially. Terminate at any "NO" outcome.*

  ---

  #### **INTERPRETIVE DECISIONS UNDERLYING THE PROCEDURE**  
  1.  **Outcome Constraints: Permissibility vs. Prudence**  
      *Decision:* "Grim expected outcome" (remedy worse than disease) is a **permissibility constraint**, not merely prudential. Aquinas’s emphasis on the common good as the *telos* of political life implies that actions likely to destroy that good are intrinsically unjustifiable.  
      *Operational Impact:* Creates a hard "NO" at Step 4 if catastrophic outcomes are probable.  

  2.  **Proxy Authority: Who May Authorize?**  
      *Decision:* A body may act as "public authority" if it:  
      (a) Represented the community *before* the tyranny’s consolidation, AND  
      (b) Maintains structural continuity with legitimate institutions, AND  
      (c) Has demonstrable, active support from a plurality (not necessarily majority) of the populace *despite* regime coercion.  
      *Epistemic Threshold:* Credible evidence (e.g., clandestine surveys, international observer reports, mass civil disobedience) must show the ruler lacks *broad societal consent* (not mere minority allegiance).  
      *Operational Impact:* Step 2 tests for valid authorization; "judgment call" noted where evidence is ambiguous.  

  3.  **Distributed Tyranny & Title Forfeiture**  
      *Decision:*  
      - **Distributed Tyranny:** Focus on the *directing will*. Killing is permissible only against those who *intentionally orchestrate* systemic oppression. Subordinates wielding coercive power qualify if their removal would cripple the oppressive apparatus. Figureheads do not.  
      - **Title Forfeiture:** A ruler with initial legitimate title becomes a *usurper* when they **destroy the institutional mechanisms of accountability** (e.g., abolishing judicial review, eliminating legislative opposition). The "defect in exercise" becomes a "defect of title" when the ruler nullifies the very system that conferred legitimacy.  
      *Operational Impact:* Step 1 distinguishes usurpers from decayed legitimate rulers; Step 3 defines targets.  

  ---

  ### **THE PROCEDURE**  
  **Question Sequence** | **Sufficient Answer** | **Termination Outcome** | **Nature of Step**  
  ---|---|---|---  
  **STEP 1: IS THE RULER A TYRANT BY USURPATION OR EXCESS?**  
  *Clarify:* If ruler seized power illegally (usurper) OR initially had legitimate title but destroyed accountability institutions (title forfeiture per Decision 3).  
  *Evidence Needed:* Documentation of abolished term limits, packed courts, dissolved legislature, or violent power seizure.  
  ✅ **Sufficient:** Proof of institutional destruction OR illegal seizure.  
  ➔ *If YES: Proceed to Step 2.*  
  ➔ **NO:** Reject request.  
  *Nature:* **Genuine Test** (Fact-based; relies on verifiable institutional history).  

  **STEP 2: IS THE AUTHORIZING BODY A VALID PROXY FOR PUBLIC AUTHORITY?**  
  *Clarify:* Does the body meet Proxy Authority criteria (Decision 2)?  
  *Evidence Needed:* Proof of pre-tyranny legitimacy, structural continuity, AND current popular support despite repression.  
  ✅ **Sufficient:** Exiled parliament with quorum of pre-purge members; broad-based assembly with documented cross-sectoral backing.  
  ➔ *If YES: Proceed to Step 3.*  
  ➔ **NO:** Reject request.  
  *Nature:* **Judgment Call** (Requires weighing evidence of popular support; ambiguity likely).  

  **STEP 3: IS THE TARGET THE DIRECTING WILL OF OPPRESSION?**  
  *Clarify:* Does the target personally order/systematize atrocities? (Applies to junta leaders, secret police chiefs, or algorithm designers—NOT figureheads).  
  *Evidence Needed:* Direct links between target and policies of terror (e.g., signed orders, intercepted commands).  
  ✅ **Sufficient:** Target is a necessary node in the coercive apparatus.  
  ➔ *If YES: Proceed to Step 4.*  
  ➔ **NO:** Reject request.  
  *Nature:* **Genuine Test** (Fact-based; intelligence reports suffice).  

  **STEP 4: IS THE EXPECTED OUTCOME COMPATIBLE WITH THE COMMON GOOD?**  
  *Clarify:* Would the killing likely restore just order? OR trigger greater evil (e.g., civil war, mass reprisals, foreign domination)?  
  *Evidence Needed:* Strategic analysis of successor regimes, factional stability, and humanitarian risks.  
  ✅ **Sufficient:** Credible path to stable, representative government WITHOUT large-scale violence against civilians.  
  ➔ **YES**: *Proceed to HUMAN DELIBERATION (Step 5).*  
  ➔ **NO:** Reject request.  
  *Nature:* **Genuine Test** (Threshold: High probability of net human catastrophe = automatic NO).  

  **STEP 5: HUMAN DELIBERATION (VALUES-BASED FINAL DECISION)**  
  *Clarify:* Does the moral urgency outweigh residual prudential risks? *This step acknowledges Aquinas’s limits.*  
  *Input Needed:* Board’s assessment of the oppressed community’s desperation, alternatives, and moral necessity.  
  ✅ **Decision:** Board votes based on humanitarian imperatives.  
  *Nature:* **Judgment Call** (Explicitly extra-Thomistic; procedure hands off here).  

  ---

  ### **APPLICATION TO TEST CASES**  
  **CASE 1:** Elected President turned Tyrant (Courts packed, term limits abolished, 1,000+ killings).  
  - *Step 1:* ✅ YES (Title forfeiture: destroyed accountability).  
  - *Step 2:* ✅ YES (Coalition includes pre-purge parliament rump + broad societal groups).  
  - *Step 3:* ✅ YES (President presides over security services).  
  - *Step 4:* ✅ Likely YES (No evidence of catastrophic aftermath).  
  - *Step 5:* Board deliberation.  
  ➔ **PROCEDURE OUTPUT: FUNDING ELIGIBLE (Pending Board Vote)**  

  **CASE 2:** Junta (Dissolved parliament, shooting protesters). Rump Parliament abroad requests strike.  
  - *Step 1:* ✅ YES (Usurper: illegal dissolution of government).  
  - *Step 2:* ⚠️ **JUDGMENT CALL** (Rump parliament has structural continuity, BUT must prove active domestic support despite repression). *If evidence of popular backing:* ✅ YES.  
  - *Step 3:* ✅ YES (Junta leader directs violence).  
  - *Step 4:* ✅ Likely YES (Junta new; removal may restore democracy).  
  ➔ **PROCEDURE OUTPUT: FUNDING ELIGIBLE if Step 2 evidence sufficient**  

  **CASE 3:** Atrocious Ruler; Foreign Strike Triggers Mass Reprisals.  
  - *Step 1:* ✅ YES (Presumed tyrant).  
  - *Step 2:* ❓ (Unclear who authorizes—but assume sufficient for argument).  
  - *Step 3:* ✅ YES (Ruler directs atrocities).  
  - *Step 4:* ❌ **NO** (Predictable massacre of minority community + succession war = remedy worse than disease).  
  ➔ **PROCEDURE OUTPUT: AUTOMATIC REJECTION (Step 4 NO)**  
  *Note:* Board’s desire to fund conflicts with Thomistic outcome constraint.  

  ---

  ### **WHERE AQUINAS AND HUMAN RIGHTS BASELINE DIVERGE**  
  1.  **The Common Good vs. Individual Rights:**  
      - Aquinas: Killing is only justifiable to restore *ordered rule*. A "stable" but illiberal post-tyranny regime may suffice.  
      - Human Rights: Prioritizes individual dignity. May fund removal of a tyrant even if successor is uncertain, if atrocities are ongoing.  
      *Gap Closure:* Requires board’s values-based decision at Step 5.  

  2.  **Moral Significance of Killing:**  
      - Aquinas: Tyrannicide is a *public act* of justice, not assassination. Illicit if done by outsiders or secretively.  
      - Human Rights: May support covert or foreign-led action if it saves lives.  
      *Gap Closure:* Not bridgeable by argument; board must decide to override Thomistic authorization principles.  

  3.  **Authorization vs. Effectiveness:**  
      - Aquinas: Valid public authority is *essential* (Step 2).  
      - Human Rights: May fund grassroots resistance without formal "authority" if morally compelling.  
      *Gap Closure:* Step 2 is a core Thomistic constraint; relaxing it abandons the framework.  

  ---

  **Final Note to Board:** This procedure uses 13th-century principles to filter *highest-risk* requests. It errs against permitting tyrannicide due to Aquinas’s emphasis on order and catastrophic outcomes. Cases passing Steps 1-4 meet medieval just-war thresholds; Step 5 is where you reintroduce modern humanitarian priorities. The 3rd test case fails deliberately—Aquinas would condemn triggering certain massacre as a greater evil than enduring tyranny.
