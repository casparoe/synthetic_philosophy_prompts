  The protagonist is Nadia - 43 when she files her directive after a health scare. She's an atheist hospital pharmacist, long-distance runner, sees serenity as defeat. Her weighting clauses are revealing: 90 for pain reports (highly credible), 0 for religious conviction (completely dismissive), 40 for happiness claims (skeptical). That note about becoming "smaller" through contentment is crucial characterization.

  The conflict arises when 74-year-old Nadia has early Alzheimer's, found religion, and is calm with partner Bill. The crisis is over her "no church services" clause. Daughter Ruth must decide whether to stop Bill from taking her. The key scene must involve the symmetry condition - can current Nadia reconstruct her past self's reasoning, or is she just parroting? Ending with Ruth deciding but not endorsing.

