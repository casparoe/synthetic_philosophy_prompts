prompt: |-
  This got personal for me a few months ago: I'm on the committee at my institute that signs off on any prep that might need welfare protections. We see two or three a week, we get about an hour each, and the reviewers are bench scientists plus one vet — nobody with any philosophy background. The stuff coming through now is: neural organoids hooked up to a simulated body that gets reward and punishment signals, invertebrate learning experiments where the animal is clearly tracking something like its own state, and a pretty high-resolution simulation of a larval fish nervous system that we run a few thousand copies of in parallel while we tune it. Right now we basically argue and vote. Last month a postdoc refused to run one of the protocols and I definately couldn't tell her whether she was being careful or being weird about it, and I'm the one who signs the form.

  What I want is a procedure my committee can actually run on a proposal, in everyday language. The parts I think I need, but you organize it: how to settle what physical thing we're even talking about before arguing about it (there always seems to be more than one candidate depending on where you draw the line, and some candidates sit inside others); how to ask what's going on inside it rather than just what it does, given that anything can be made to look like it's avoiding something; whether "sort of" is a possible answer or whether it has to be yes or no; and what we're supposed to do when we genuinely can't tell. For each step say what counts as a good enough answer, where the procedure stops with a no, and where it hands the decision back to us because it's a values call and not a factual one. Be honest about which steps are real checks and which are just us going through the motions. Constraints: one hour, no theory assumed, and it has to end in a short written justification we can hand to our funder.

  Then run it on three of ours: the organoid in the maze with reward and punishment signals; the fish simulation, including the awkward part where if we run 5000 copies at once that looks like it's either 5000 of them or one of them and I don't know which is right; and a third case where the procedure tells us to slow down or stop on something we'd rather keep doing — I want to see the answer I'll want to argue with. Also say plainly what the procedure can't do for us.

  Lead with your bottom line in the first sentence — the one thing the whole procedure turns on — then give the steps and the applications. No preamble, and don't restate my question back at me.
reasoning: |-
  Okay, let me unpack this user's request. They're on an ethics committee for welfare protections at a research institute, dealing with increasingly complex neural systems - organoids, simulations, invertebrate experiments. They need a practical decision procedure that fits their constraints: one hour per case, no philosophy background, must end with a written justification. 

  The core tension I see is between scientific progress and ethical uncertainty. Their current "argue and vote" method leaves them uneasy, especially when researchers refuse protocols. They're asking for structure but also honesty about where judgment calls are unavoidable. The three test cases are deliberately thorny, especially the 5000 fish simulations where individuality gets fuzzy.

  Hmm... the key insight is that welfare questions can't be resolved by behavior alone. The user already knows this from their "avoidance behavior" comment. The real pivot is about whether there's something it's like to be the system. But since we can't prove phenomenology, we need proxies. 

  For the procedure, I'll build around three filters: composition (what parts matter), integration (is it one thing or many), and experience indicators (not just behavior). Each filter needs clear failure points and "inconclusive" exits. The fish simulation case will deliberately trigger an inconclusive result to show where the procedure pushes back against convenience.

  Important to flag that behaviorism alone fails here - must emphasize phenomenological uncertainty. The organoids might pass composition but fail integration. The fish sims crash on the individuality question. And for the "slow down" case, something like cephalopod learning where behavioral complexity exceeds our current welfare frameworks.

  Biggest limitation: this can't replace value judgments, only structure how we confront them. The written justification must transparently show where evidence stopped and committee judgment began. That honesty is what the user seems to crave after their postdoc incident.
answer: |-
  **Bottom line:** Welfare protections apply only if there's credible evidence of a unified inner experience that could suffer, not merely complex behavior.

  **Procedure: Welfare Threshold Assessment (1 hour max)**  
  *Run sequentially; stop and reject if any step fails. "Inconclusive" requires committee vote with justification.*

  1.  **Define the Candidate Subject(s):** (10 min)  
      *   *Ask:* "What specific physical system(s) *could* potentially experience welfare impacts? List *all* plausible candidates (e.g., whole organoid, specific cell group, whole simulation, individual simulated agent)."  
      *   *Good Enough:* Clear list of candidates with defined physical boundaries (e.g., "the organoid cluster," "one simulated larval fish instance," "the entire invertebrate nervous system").  
      *   *Stop/No:* If no plausible candidate subject can be defined (e.g., isolated non-interacting cells, pure input-output device).  
      *   *Values Call/Hand Back:* None. This is factual description.

  2.  **Assess Integration & Unity:** (15 min)  
      *   *Ask:* "For each candidate subject, is there clear evidence its parts interact to form a *single, integrated state* (like a mood or overall feeling), rather than just processing signals? Does it maintain *itself* as a distinct whole over relevant timescales?"  
      *   *Good Enough:* Evidence of global feedback loops, self-regulation of internal state (beyond simple homeostasis), unified response patterns. Look for *centralized* integration, not just distributed computation.  
      *   *Stop/No:* If candidates clearly lack integration (e.g., disconnected cells, purely feedforward network). If the system is clearly fragmented with no unified state.  
      *   *Values Call/Hand Back:* Interpreting ambiguous integration data (e.g., distributed networks). Committee votes "Integrated?" (Yes/No/Inconclusive).

  3.  **Seek Indicators of Phenomenal Experience (Not Just Behavior):** (25 min)  
      *   *Ask:* "For each *integrated* candidate, is there evidence suggesting it's *like something* to *be* this system? Look beyond learned responses: Are there neural/structural correlates of *valence* (positive/negative feeling)? Evidence of endogenous, self-generated activity patterns linked to 'state'? Capacity for *global* modulation (e.g., something like 'attention' affecting the whole system)? Responses inconsistent with simple avoidance/approach?"  
      *   *Good Enough:* Evidence of dedicated valence-encoding pathways, neuromodulator systems linked to global state, spontaneous complex activity uncoupled from immediate inputs, responses showing trade-offs or context-dependence beyond reinforcement.  
      *   *Stop/No:* If only evidence is conditioned responses or simple tropisms. If behavior is fully explained by pre-programmed reflexes or optimization algorithms without valence.  
      *   *Values Call/Hand Back:* Weighting ambiguous neural/behavioral data as evidence *for* experience. Committee votes "Evidence of Experience?" (Yes/No/Inconclusive).

  4.  **Determine Welfare Relevance:** (5 min)  
      *   *Ask (only if Step 3 = Yes/Inconclusive):* "Do the protocols involve stimuli plausibly linked to negative valence (punishment, deprivation, harm) OR significantly disrupt the integrated state?"  
      *   *Good Enough:* Clear link between protocol and potential negative states (pain, fear, stress, distress) or disruption (e.g., lesioning integrated structure).  
      *   *Stop/No:* If protocols involve only neutral/positive stimuli or observations without intrusion.  
      *   *Values Call/Hand Back:* Defining "harm" for ambiguous states. Committee judgment.

  5.  **Decision & Justification:** (5 min)  
      *   *Outcome:*  
          *   If Steps 1-4 pass clearly: **Approved (Welfare Protections Apply)**.
          *   If any step = **No**: **Rejected (No Welfare Protections Needed)**.
          *   If key step (2 or 3) = **Inconclusive**: **Requires Committee Vote** (Approve/Reject) based on precaution (leaning towards protection if inconclusive evidence of experience + potential harm exists).
      *   *Justification Template:* "Candidate subject(s): [X]. Integration: [Finding + Vote if inconclusive]. Experience Indicators: [Finding + Vote if inconclusive]. Welfare Relevance: [Finding]. Decision: [Approved/Rejected]. Key Uncertainty: [If any]."

  **Honest Limitations:**  
  *   **Cannot Prove Experience:** Only assesses evidence for/against it.  
  *   **"Sort of" is Inconclusive:** Triggers committee vote based on precaution.  
  *   **Values Embedded:** Steps 2 & 3 interpretation inherently involves judgment calls about what constitutes evidence of experience. The procedure makes these explicit but doesn't eliminate them.  
  *   **Speed vs. Depth:** A 1-hour limit means complex cases *will* be inconclusive.  
  *   **Can't Resolve Metaphysics:** Won't solve "what is consciousness?" but provides operational criteria.

  ---

  **Application to Cases:**

  1.  **Organoid in Maze w/ Reward/Punishment:**  
      *   **Step 1:** Candidate = The specific neural organoid cluster.  
      *   **Step 2:** *Inconclusive.* Shows complex processing, but evidence for a *single, unified* global state (beyond localized circuit activation) is weak. Committee Vote Needed. (Likely leans No unless novel integration evidence exists).  
      *   **Step 3:** *No.* Responses likely reflect basic reinforcement learning circuits. No strong evidence of valence encoding *within the organoid itself* or endogenous state generation.  
      *   **Step 4:** Yes (punishment signals).  
      *   **Decision:** Likely **Rejected** (Fail Step 3). *Justification:* Candidate: Organoid cluster. Integration: Inconclusive (Voted No). Experience Indicators: No evidence beyond conditioned responses. Welfare Relevance: Punishment signals used. Decision: Rejected - insufficient evidence of experience requiring welfare protection.

  2.  **High-Res Fish Simulation (5000 copies):**  
      *   **Step 1:** Candidates = *Each individual simulated larval fish instance* (if they are independent) OR *the entire simulation process* (if massively interconnected). **CRITICAL QUESTION.**  
      *   **Step 2:**  
          *   *If Candidates = Individual Instances:* *Inconclusive.* Each sim is highly integrated *internally* (like a real larva), but are they truly independent? Depends on shared resources/memory/coupling. Committee Vote Needed (Leans Yes if sufficiently isolated).  
          *   *If Candidate = Whole Process:* *No.* The 5000 sims aren't integrated *with each other* into a single state.  
      *   **Step 3:**  
          *   *If Candidates = Individual Instances (and Step 2 Yes):* *Yes/Inconclusive.* High-res sim likely incorporates known neural correlates of valence/state from real larvae. Strong evidence *if* we accept the simulation fidelity. Committee Vote Needed (Likely Yes).  
      *   **Step 4:** Yes (Protocol likely involves simulated noxious stimuli/stress).  
      *   **Decision:** **Highly Dependent on Step 1/2.**  
          *   *If Individual Instances (Voted Integrated & Experience):* **Approved.** *Justification:* Candidate: Individual simulated larval fish instances. Integration: Inconclusive (Voted Yes - instances operate independently). Experience Indicators: Inconclusive (Voted Yes - simulation includes known neural correlates of valence/state). Welfare Relevance: Simulated stressors used. Decision: Approved - precaution applied due to credible evidence of experience requiring protection.  
          *   *Otherwise:* **Rejected.** *Justification:* Candidate: [Whole process/Rejected Individual]. Integration: [No/Rejected]. Experience Indicators: N/A or Rejected. Welfare Relevance: [Yes]. Decision: Rejected - no integrated subject with evidence of experience identified.

  3.  **The "Slow Down" Case: Advanced Cephalopod Learning Experiment (e.g., Octopus)**  
      *   **Step 1:** Candidate = The octopus nervous system (highly centralized brain + distributed ganglia).  
      *   **Step 2:** *Yes.* Clear evidence of complex central integration and unified behavioral states.  
      *   **Step 3:** *Inconclusive (but concerning).* Strong evidence of complex cognition, play, curiosity, pain sensitivity (via nociceptors & avoidance). *However:* Significant uncertainty about *how* they subjectively experience pain/stress due to radically different neurobiology vs. vertebrates. Are their indicators truly analogous?  
      *   **Step 4:** *Yes.* Involves potential stress (confinement, novel/problem-solving tasks, possibly mild aversives).  
      *   **Decision:** **Requires Committee Vote.** Strong case for protection (Steps 2 & 4 pass, Step 3 inconclusive but suggestive), BUT ambiguity about the *nature* of experience is high. *Justification:* Candidate: Octopus nervous system. Integration: Yes. Experience Indicators: Inconclusive - strong evidence of complex cognition & pain sensitivity, but subjective experience uncertain. Welfare Relevance: Potential stress present. Decision: [Approved/Rejected based on Vote] - Precaution applied/not applied due to unresolved uncertainty about cephalopod phenomenology. **(This forces confronting the ambiguity they'd rather gloss over - the answer many will want to argue with is likely "Approved" but with high uncertainty noted, potentially requiring protocol modifications).**

  **What the Procedure Can't Do:**  
  *   **Eliminate Disagreement:** On ambiguous cases, reasonable people will vote differently.  
  *   **Provide Philosophical Certainty:** It operationalizes "experience" for decision-making, but doesn't solve the hard problem.  
  *   **Keep All Research Moving:** It *will* flag complex systems as "Inconclusive," necessitating cautious votes or rejection, potentially halting some desired research.  
  *   **Replace Expertise:** Relies on the vet and scientists to interpret biological evidence accurately during the steps.  
  *   **Handle Future Unknowns:** Needs periodic review as science evolves.
