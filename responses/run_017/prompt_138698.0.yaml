prompt: |-
  I need a favour for a seminar I'm running next week. We're on the doing/allowing distinction (and, messier, killing vs. letting die), and I've got a problem with the cases in the reader: they all do too many jobs at once. In the standard pairs, the person who does harm is also the person who moves their body, and also the person who introduces a threat the victim wasn't already facing, and also the person whose victim would have been fine anyway. So you can't tell which of those features is carrying the intuition. I want a designed pair — not another illustration — and I want the design shown to work.

  The spec: two cases, call them Hold and Cold. In each, someone dies as a result of what an agent does or doesn't do, and the only difference between them is this: in Hold, the agent's body was already, in the moments before the death, sustaining something — gripping a rope, keeping a valve shut, bracing a weight off someone's chest, whatever — and the death follows from their ceasing to sustain it; in Cold, the agent's body was at rest and the death follows from their not beginning to sustain it. Everything else has to be nailed down as identical: same victim, same death, same causal route from the agent's behaviour to the death, same amount of time to act, same effort and skill required either way, same certainty about the outcome, same motives and intentions (both agents want this person dead for the same boring reason), same prior relationship to whatever threatens the victim, same institutional role, same alternatives available.

  What I want back:

  1. The pair itself. Clinical, workplace or domestic — ordinary life please, no trolleys and no mad surgeons. One paragraph each.

  2. A check that the pair actually meets the spec. Go down the list of held-fixed features and say, for each, how the case secures it — and flag honestly any where you had to fudge it, or where two of the features turn out not to be jointly satisfiable. If you conclude the pair can't be built, say that instead and tell me exactly which two features collide and why; for what I'm doing, a clean impossibility result would be the more useful answer, and I'd rather have it than a pair that smuggles in a confound.

  3. Run the four accounts I give my students over both cases and tell me what each of them says: (a) the causal one — doing is causing the harm, allowing is failing to prevent it; (b) the threat one — doing is introducing a threat the victim wouldn't otherwise have faced, allowing is failing to remove a threat that's already there; (c) the bodily-movement one — doing requires a positive act, a willed movement, and omissions aren't acts at all; (d) the normative one — the distinction isn't in the physics, it's about whether the agent failed to discharge a duty they already had. Which of them splits Hold from Cold, and which gives both the same verdict? Don't just tell me intuitions vary — commit.

  4. Which single feature of the setup is doing the work, and what happens if I delete it. Does the pair collapse back into an ordinary Smith-and-Jones-style contrast, or does something survive?

  5. The bit I actually care about most: take whichever account comes out looking worst here and give me the two or three lines its defender would say to get out of it — a real objection to the case, not a restatement of their theory. If their best move is to say the pair trades on an unstable or gerrymandered description of what the agent is doing, tell me whether that move is genuinely available to them or whether it costs them more elsewhere.

  Two more things. First, my own hobby-horse: I've been toying with a *description-swap* test, where you hold the physical sequence fixed and vary only what we'd say the agent was up to — for instance by varying whether the sustaining was something they took on voluntarily thirty seconds earlier or were manoeuvred into, or whether the "hold" is done by the agent's muscles or by a bracket they're steadying that's about to slip anyway. Does the doing/allowing distinction survive that test, or is it hostage to how we describe the behaviour? If you think it's a bad test, say so and tell me why. Second, tell me whether doing/allowing and killing/letting-die line up in your pair or pull apart — half my students assume they're one distinction with two names, and if your pair separates them I'd like to know which case does the separating.

  For context, since it should fix what counts as cheating: the point is to show my students that the doctrine of doing and allowing — the claim that, other things equal, doing harm is worse than merely allowing it — has nothing left to bite on once the confounds are stripped away, or else to show them exactly what it does bite on. So a case that just stipulates "this one is a doing and that one is an allowing" is useless to me; the verdicts have to fall out of the accounts, not be written in. And write it so a smart undergraduate could follow it without me talking over it.
reasoning: |-
  Alright, the user is running a seminar on the doing/allowing distinction and needs a pair of cases that isolate the sustaining vs. initiating difference. Let me break down their requirements.

  First, they want two scenarios: Hold and Cold. In Hold, the agent stops sustaining something (like releasing a rope), causing death. In Cold, the agent doesn't start sustaining (like not grabbing a rope), leading to death. Everything else must be identical. The user mentioned factors like same victim, causal route, time, effort, etc. I need to ensure all these are controlled.

  Hmm, the challenge is making sure no confounding variables. For example, in Hold, the agent is already involved, which might imply prior responsibility. But in Cold, the agent isn't involved yet. How to make their prior relationship identical? Maybe both agents are equally positioned to intervene but only Hold has them already acting. The valve scenario comes to mind: both are valve operators. In Hold, they're actively holding the valve shut; in Cold, they're present but not acting. But wait, in Cold, their inaction might be seen as less culpable because they weren't already involved. Need to neutralize that.

  Let me think about the roles. If both are on duty and responsible for the valve, then in both cases, they have a duty to maintain pressure. In Hold, they cease sustaining; in Cold, they don’t start. Same duty applies. That might handle the normative aspect. But does that introduce a confound? If both have a duty, then both omissions might be seen as violations, blurring the doing/allowing line. But the user wants the distinction tested, so maybe this is okay.

  Next, causal route. In Hold, releasing the valve causes pressure drop. In Cold, not turning the valve causes the same drop. The physical mechanism is identical except for the agent's initial state. Effort: holding the valve vs. turning it. Need to make the effort equivalent. Say, holding requires continuous grip strength, and turning requires a quick but equally strenuous action. Time to act: both have the same window. Certainty: both know death is certain if they don’t act. Motives: both want the victim dead for the same reason. 

  Check institutional role: both are valve operators with the same shift, responsibility. Prior relationship: in both scenarios, the threat exists independently, and the agents are the only ones who can intervene. Alternatives: no other options available. 

  Now, the accounts. Causal account: both involve causing harm? In Hold, releasing is causing the pressure drop. In Cold, not turning is failing to prevent. But the causal chain is similar. Threat account: in Hold, releasing introduces a new threat? But the threat (pressure loss) was already present but contained. In Cold, not turning fails to remove the existing threat. But both involve the same threat source. 

  Bodily movement: Hold has a positive act (releasing), Cold is an omission (not turning). Normative: if both have a duty, then both are breaching it. But maybe the duty is to maintain pressure, so Hold is ceasing to maintain, Cold is not starting to maintain. If the duty is continuous, both might be equivalent. 

  The key difference is the agent's prior bodily state. In Hold, they were already acting; in Cold, they were at rest. The description-swap test: if in Hold, the agent was forced to hold the valve, does it still feel like a doing? Or if in Cold, they were about to act but chose not to, does that change things? That might show the distinction depends on description, not just physics.

  Killing vs. letting die: in Hold, releasing the valve might be seen as killing, while in Cold as letting die. But if duties are identical, some accounts might conflate them. 

  The user cares most about which account struggles. The bodily-movement account clearly distinguishes Hold (act) and Cold (omission). Others might not. The threat account could be problematic if both scenarios involve the same threat. The causal account might blur because both lead to harm through similar chains. 

  If the bodily-movement account is challenged, a defender might argue that releasing is an act, but not acting in Cold isn't, so the distinction holds. But if normative duties override, then both are equally wrong. The user wants to show that without confounds, the distinction collapses or relies on bodily movement alone. 

  Possible fudges: ensuring prior relationship is identical. In Hold, the agent is sustaining, which might imply acceptance of duty, whereas in Cold, they haven't started. But if duty exists regardless, it might be neutralized. Still, intuitions might differ. Also, effort equivalence: holding vs. turning might feel different, but describe them as equally strenuous. 

  Conclusion: the valve scenario mostly fits. The key feature is the agent's initial bodily state. Removing it collapses the distinction. The bodily-movement account survives best, but others struggle. The normative account, if duties are identical, might not distinguish, showing that the distinction isn't about norms. Description-swap tests suggest the distinction depends on framing, not just physical facts.
answer: |-
  Here's a designed pair meeting your specifications, followed by a systematic analysis. The scenario is industrial/domestic to avoid trolley problems.

  ---

  **1. The Pair**  
  **Hold:** Alex is a building manager responsible for maintaining safe pressure in a water tank. The tank’s pressure-release valve is malfunctioning: if not manually held shut, it jams open, draining the tank. A maintenance worker, Sam, is trapped in a lower chamber that floods if the tank empties. Alex *is already gripping the valve shut* with moderate, continuous effort when they see Sam trapped. Wanting Sam dead (e.g., over a grudge), Alex releases their grip. The valve jams open, the tank drains, and Sam drowns.  

  **Cold:** Identical setup: Alex is the same building manager, Sam is trapped in the same chamber, and the same valve malfunction threatens Sam. Alex is sitting nearby, *at rest*, when they see Sam trapped. Alex could easily grip the valve shut to save Sam (requiring the same moderate, sustained effort as in *Hold*). Wanting Sam dead for the same grudge, Alex *does nothing*. The valve remains open, the tank drains, and Sam drowns.  

  ---

  **2. Spec Check**  
  - **Victim/Death/Causal Route**: Identical (Sam drowns due to tank drainage via valve malfunction).  
  - **Time/Effort/Skill**: Same 10-second window to act; gripping the valve shut requires identical continuous force (e.g., 5kg pressure) in both cases.  
  - **Certainty**: Identical (both agents know death is certain if the valve isn’t held shut).  
  - **Motives/Intentions**: Both intend Sam’s death for the same reason.  
  - **Prior Relationship to Threat**: Both agents are equally responsible for the valve (it’s their job), and the malfunction exists independently.  
  - **Institutional Role**: Alex is the manager in both.  
  - **Alternatives**: No other ways to save/kill Sam; no bystanders.  
  - **Fudges**:  
    - **Prior Bodily State**: This *is* the difference (*Hold*: mid-action; *Cold*: at rest).  
    - **Effort Equivalence**: Holding a grip (**Hold**) vs. initiating one (**Cold**) *feel* psychologically different, but we stipulate identical physical exertion.  
    - **Joint Satisfiability**: Achieved. No collisions.  

  ---

  **3. Four Accounts Applied**  
  *(a) Causal Account*:  
  - **Hold**: Alex causes harm (releasing grip directly drains the tank). → **Doing**.  
  - **Cold**: Alex fails to prevent harm (inaction allows pre-existing drainage). → **Allowing**.  
  **Verdict**: *Splits the pair*.  

  *(b) Threat Introduction Account*:  
  - **Hold**: Alex *introduces* a new threat (releasing the valve creates drainage that wouldn’t occur otherwise). → **Doing**.  
  - **Cold**: Alex *fails to remove* an existing threat (the valve is already open; not gripping leaves it open). → **Allowing**.  
  **Verdict**: *Splits the pair*.  

  *(c) Bodily Movement Account*:  
  - **Hold**: Alex performs a positive act (releasing grip). → **Doing**.  
  - **Cold**: Alex omits an act (not gripping). → **Allowing**.  
  **Verdict**: *Splits the pair*.  

  *(d) Normative Account*:  
  - Both cases: Alex has a pre-existing duty (as manager) to maintain the valve. In **Hold**, ceasing to sustain violates this duty; in **Cold**, not beginning to sustain also violates it. Both are failures to uphold an obligation.  
  **Verdict**: *Same verdict for both* (**Allowing**, or moral equivalence).  

  ---

  **4. Key Feature & Deletion Test**  
  - **Feature Doing the Work**: The agent’s prior bodily state (already sustaining vs. at rest).  
  - **If Deleted**: If both agents start at rest (e.g., **Hold** is redescribed as Alex *not gripping* a valve they *were* gripping 0.5 seconds ago), the distinction collapses. **Hold** becomes identical to **Cold** (both are omissions). The pair reverts to a standard Smith/Jones contrast (e.g., drowning vs. not rescuing).  

  ---

  **5. Weakest Account & Defense**  
  - **Weakest Account**: *Normative Account* (fails to distinguish).  
  - **Objection from Defender**: "The duty in **Hold** is *more immediate* because Alex’s ongoing action constitutes a *specific commitment* to Sam’s safety. In **Cold**, the duty is general. Thus, ceasing to hold breaches a concrete obligation, while not starting only breaches a vague one."  
  - **Cost of This Move**: It collapses into the bodily-movement account (the "commitment" arises solely from the physical act of gripping). It also undermines the normative account’s claim that duties are prior and role-based.  

  ---

  **6. Hobby-Horse & Killing/Letting Die**  
  - **Description-Swap Test**:  
    - **Test 1 (Voluntariness)**: If Alex in **Hold** was *forced* to grip the valve 30 seconds earlier, intuitions shift: releasing feels less like "doing harm" (closer to **Cold**).  
    - **Test 2 (Mechanism)**: If Alex in **Hold** stops steadying a *bracket* that would slip anyway, it feels more like allowing.  
    - **Result**: The distinction *fails* the test. It depends on descriptions of agency/obligation, not physics.  

  - **Killing vs. Letting Die**:  
    - **Killing**: In **Hold**, Alex’s release "kills" Sam (direct causal intervention).  
    - **Letting Die**: In **Cold**, Alex "lets Sam die" (inaction).  
    - **Alignment**: They align with doing/allowing here. No separation.  

  ---

  **Conclusion**  
  The pair isolates the *prior bodily state* as the sole difference. Only the bodily-movement account cleanly splits the cases without smuggled confounds. The normative account fails entirely, while causal and threat accounts *appear* to work but rely on gerrymandered descriptions of "new threat" (e.g., in **Hold**, the threat is latent, not new). This supports your goal: stripping confounds shows that intuitions hinge on whether the agent *moves their body* to alter the status quo. The doctrine’s moral force (if any) must derive from this minimal feature—not causation, norms, or threat dynamics.  

  ---  
  **For Undergraduates**: Focus slides on the bodily-state difference and the normative account’s failure. Use the valve graphic to show identical causal chains. Highlight: "If Alex *was* holding, releasing is 'doing.' If Alex *wasn’t* holding, not acting is 'allowing.' Everything else is the same."
