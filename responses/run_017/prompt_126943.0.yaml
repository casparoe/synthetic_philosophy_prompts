answer: |-
  ## Design for the Hypocrisy Scene: Lichfield Surveyors

  **Core Relational Account of Standing:** I'll use a **Role-Occupancy and Fair Play** account. Standing to blame derives from the blamer's specific normative relationship to the wrongdoer *and* the wrong *in this instance*. It asks: Given the role you play in *this* situation (family partner, advisor, beneficiary), have you acted in a way that preserves your right to invoke this particular norm *against this person*? Have you played fair within the rules of *this* relationship regarding *this* matter? This suits your novel because it's deeply rooted in the specific dynamics of a family firm – roles, duties, unspoken agreements, and the unique history binding them – without requiring a sermon on moral philosophy.

  **The Characters:**
  *   **Marcus:** The target. Used firm's client book/trust to set up with a competitor, deceived family until late.
  *   **The Hypocrite (Geoffrey):** Marcus's uncle, senior partner. Decades ago, he did *exactly* what Marcus did – leveraged the firm's name and contacts to defect, nearly sinking it. He's *currently* subtly courting a major client (Brackenhurst Estates) for his *own* planned departure/competitor setup, repeating the sin.
  *   **The Scrupulous Woman (Eleanor):** The firm's long-standing, utterly ethical *solicitor*. Never breached loyalty, never been tempted. However, she reviewed Marcus's new employment contract *for the competitor* weeks ago, assuming (based on vague statements from Marcus and Geoffrey's taciturn approval) it was for an unrelated role or a temporary secondment Geoffrey had sanctioned. Her firm billed for this work. She profited professionally and financially from enabling *this specific act*, however unwittingly.

  **The Scene: St Chad's Church Hall, Post-Funeral Reception (For old Mr. Henderson, a loyal client)**

  *(The air is thick with damp wool, weak tea, and subdued conversation. Marcus stands near a stained-glass window, nursing a lukewarm sherry, looking isolated. Geoffrey approaches, exuding a veneer of patriarchal concern. Eleanor watches from near the tea urn, her expression troubled.)*

  **Geoffrey:** (Clapping Marcus heavily on the shoulder, voice low but carrying) Marcus. Hard day. Henderson was fond of you. Fond of the *firm*. Bit of a rock, he was. Shame. Real shame. (He pauses, sips his whisky.) Saw young Peterson earlier. Bright lad. Shame he’s landed at Culverstone & Pryce. Bit… grubby, that lot. Still, suppose they offer… opportunities. For some. (He looks pointedly at Marcus). Makes you think, doesn’t it? About loyalty. About what a name means. What it *costs* to build trust. What it *means* to betray it. Almost… unforgivable, that sort of thing. Don’t you find?

  **Marcus:** (Stiffening, avoiding Geoffrey’s eye) It’s a competitive market, Uncle Geoffrey. People move on.

  **Geoffrey:** (Leaning closer, voice hardening slightly) Move on? Is that what we’re calling it? Using the contacts *we* nurtured, the trust *we* built, the *family* name you were happy to trade on right up until… well. Right up until you weren’t. Leaving us scrambling. Makes a man question everything. The effort put in. The sacrifices. Feels like a knife in the back, Marcus. Truly does. Henderson would be turning in his grave if he knew. *I* certainly feel it. Deeply.

  *(Geoffrey’s hand briefly pats his inside jacket pocket – where Marcus knows the Brackenhurst file resides. Marcus flushes but says nothing. Eleanor approaches, her movements precise.)*

  **Eleanor:** Geoffrey. Marcus. (She nods briskly). Difficult day. Geoffrey, Mrs Henderson was asking about the probate timeline. (She turns to Marcus, her gaze direct, cool). Marcus, while you’re here. That contract. The one I reviewed for you last month. For Culverstone. There were clauses… restrictive covenants… rather weak, frankly. Barely enforceable beyond six months on existing clients. I assumed, given the context… (She trails off, seeing Marcus’s expression). Well. It seems my assumptions were incorrect. It appears you exploited that weakness quite deliberately. It was… professionally disappointing. Unconscionable, really. A profound breach of fiduciary duty, not to mention simple decency. The firm deserved better. Your family deserved better.

  **Marcus:** (Looks from Geoffrey’s flushed face to Eleanor’s stern one. His voice is quiet, flat, aimed at Eleanor) You reviewed it, Eleanor. You advised *them* it was sound. Took their fee. Took *my* fee. Signed it off. Made it… tidy. Legitimate, even. Helped it happen. Did you ask Geoffrey *why* he didn't stop it? Ask him what *he's* got brewing with Brackenhurst? Or was it just… billable hours?

  *(Eleanor recoils almost imperceptibly. Geoffrey pales, his hand instinctively moving towards his pocket again before clenching into a fist. Marcus turns and walks away towards the vestry door. Silence hangs between Geoffrey and Eleanor. Geoffrey recovers first, his voice regaining its performative gravitas.)*

  **Geoffrey:** Outrageous. The boy’s got no shame. None at all. (He avoids Eleanor’s suddenly sharp gaze, turning to intercept a mourner near the biscuits). Ah, Councillor! Terrible business…

  *(Eleanor remains frozen for a moment, staring after Marcus, then down at her untouched tea. The hand holding the cup trembles slightly. She doesn't look at Geoffrey as he moves away, already murmuring confidentially to the Councillor. She sets the cup down with excessive care, as if it might shatter.)*

  **Analysis & Checks:**

  1.  **Verdicts Under the Role-Occupancy & Fair Play Account:**
      *   **Geoffrey (Hypocrite): HAS STANDING (despite hypocrisy).** Geoffrey occupies the role of wronged senior partner and family patriarch *in this specific instance*. Marcus's act directly damages the firm Geoffrey *currently* represents and the family trust Geoffrey *currently* embodies (however falsely). Geoffrey hasn't *in this relationship regarding Marcus's act* waived his right to protest, licensed the betrayal, or profited *from Marcus's specific act* in a way that fundamentally conflicts with his role *as Marcus's uncle and partner*. His hypocrisy is a *separate* vice, but within *this* dyad (Geoffrey-as-victim-of-Marcus), his position grants him standing *on this occasion*. His blame, however hypocritical, *feels* like it comes from the legitimate source of the injury.
      *   **Eleanor (Scrupulous): LACKS STANDING (despite personal probity).** Her structural flaw: she **profited professionally from enabling *this specific token of wrongdoing*** and performed a role (legal advisor) that **authorised its mechanism** (the weak contract). Her firm billed Marcus (or his new employer) for reviewing the very instrument of betrayal. While unwitting, this creates a fundamental conflict. By making the act 'tidy' and legally smoother, she became party to its execution in a material way. She cannot now stand apart and claim the pure moral high ground *to blame Marcus for the act she professionally facilitated and profited from*, regardless of her impeccable personal record. Her position is compromised regarding *this specific wrong*.

  2.  **Feature Ablation:**
      *   **Geoffrey:** Strip him of his **current role as a victim of *this specific act* and senior partner representing the firm**. Imagine Geoffrey left the firm years ago after his own betrayal and is just a distant cousin attending the funeral. His identical past hypocrisy would now make his blame a pure "you of all people" moment with *no* legitimate current stake. His standing collapses; he's just a meddling, hypocritical outsider. *Feature Ablated: His present normative position as the wronged party in this instance.*
      *   **Eleanor:** Strip her of the **professional authorization and profit regarding *Marcus's specific act***. Imagine she only learned of Marcus's move *after* it happened, had no hand in any contracts, and her firm never profited from facilitating it. Her personal immaculacy is now untarnished by complicity in *this* wrong. Her standing to blame Marcus (as the firm's solicitor and a long-term observer bound by professional ethics to the firm's wellbeing) is restored; her criticism carries moral weight. *Feature Ablated: Her material involvement in and profit from this specific token of wrongdoing.*
      *   **Conclusion:** These are **two distinct features**, viewed from different sides of the relational account. Geoffrey's standing relies on his *present normative position* as victim/representative *for this wrong*. Eleanor's lack of standing stems from her *prior actions* regarding *this specific wrong* that compromised her position relative to it. One is about current role legitimacy in the context of the wrong, the other is about prior material involvement that conflicts with the blaming role.

  3.  **The Appraisal Theorist's View:**
      *   A theorist holding blame is simply appraisal (judging the act wrong) and hypocrisy is a separate vice would say: "Blame is about the wrongness of Marcus's act. Geoffrey and Eleanor both correctly identify the wrong. Geoffrey's hypocrisy is a separate, additional moral failing *of Geoffrey's*, but it doesn't negate the truth of his condemnation of Marcus. Eleanor's condemnation is equally valid on the merits, regardless of her prior actions, as long as her judgment of the act is correct. Standing isn't a relevant concept; the act's wrongness is objective. Hypocrisy might make Geoffrey *less credible* or *unlikable*, but it doesn't invalidate his *point*."
      *   **Embarrassment or Irrelevance?** The scene is **mildly embarrassing but not fatal** for this theorist. They can explain *what* is being said (condemnation of a wrong act) and identify Geoffrey's hypocrisy as a vice. However, the scene powerfully demonstrates *why* the relational account matters *novelistically*: it captures why Eleanor's blame *rings hollow* and feels structurally unjust *in this context*, even if factually correct, and why Geoffrey's blame, however nauseating, carries a perverse relational weight. The appraisal theorist struggles to account for the *felt asymmetry of legitimacy* that the scene generates, reducing it to mere differences in likability or credibility, which misses the specific normative tension you've engineered. It's relevant to show the *limitations* of a purely appraisal-focused view in capturing complex interpersonal blame dynamics.

  **Reader's Dislike:** The reader should end up **disliking Geoffrey more.** His active, ongoing malice and hypocrisy are visceral and corrupt. Eleanor's failing is structural and born of professional detachment and unwitting complicity; she feels guilt and is stunned by her implication. Geoffrey is actively predatory and entirely unrepentant. His final move towards the Councillor, likely already working his next betrayal, cements his deeper loathsomeness. Eleanor inspires frustration or pity; Geoffrey inspires revulsion.
