  The plasticity depth measure in section 5 feels vulnerable. It might just be rebranding intelligence or robustness. And comparing profiles across agents seems messy - how would we compare a human's profile to an AI's? They admit this themselves, which shows good self-awareness.

  Section 4's claim that randomness doesn't add freedom is provocative. But proportionality to reasons is tricky - it risks circularity since "reasons" presuppose agency. How to define proportionality without that? Maybe through counterfactuals or functional role, but that gets technical.

