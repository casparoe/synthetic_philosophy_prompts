prompt: |-
  I'm putting together the background paper for our hospital's ethics committee, which has been asked to update the policy on determination of death — specifically the relation between the neurological standard, in both its whole-brain and brainstem formulations, and the circulatory standard, because our organ procurement organization wants to expand donation after circulatory determination of death. I argued with a neurology colleague last week about whether we should even be asking for a single account, so before we look at the standard positions I want the specification drawn up. Give me the desiderata: what an account of death has to deliver in order to be good enough for our purpose, where the purpose is explicitly a hospital policy — a rule a clinician can apply at the bedside within a few hours, that can be explained honestly to a family at the worst moment of their lives, that gives our attorneys and our procurement partners a determinate time to write down, and that does not require the staff to say one thing to relatives and believe another.

  For each requirement, give the case or consideration that motivates it, and be brutal about which are genuine desiderata and which are just the prejudices of one camp. I have some candidates to start from, which you should sort rather than simply accept: the cases the account must classify correctly (decapitation; a body declared dead by neurological criteria whose somatic functions — wound healing, temperature control, in reported cases gestation — continue for weeks with support; circulatory arrest a few minutes in, where autoresuscitation is possible and where restarting the heart is what the transplant team needs to do; the permanently unconscious patient with an intact brainstem; anencephalic newborns; the hypothermic drowning victim who revives after prolonged arrest); the distinctions it must not collapse (the concept of death from the criteria and tests we use to diagnose it; dying from dead; the death of the human organism from the death of the person; irreversible from merely permanent — won't reverse versus we won't try; death as an event from death as a process; legal death from biological death); and the biological results it must not contradict, such as the brain's role as the integrator of the organism and the fact that the organism is not just a pile of functioning organs.

  I also want two cases that I don't think anyone has a settled answer to. First, stipulate that our hospital acquires a perfusion technology that can restore oxygenated circulation to the brain hours after the heart has stopped and restore some cellular and electrophysiological activity with it; does the account then owe us a reading of irreversibility that survives, and what happens to a circulatory determination made before the technology existed? Second, stipulate a gradual neural prosthesis that replaces neurons with functionally equivalent hardware over years, with no break in consciousness or behavior and no biological neural tissue at the end; what does the account owe us about whether, and when, that patient died? Mark which requirements are non-negotiable for our purpose and which are the preferences of particular camps — I have in mind the demand that death be a biologically unified state, the dead donor rule, the demand that the criterion not obstruct organ procurement, and the demand that it track ordinary or religious intuitions about when someone is gone. If some subset of the requirements cannot be jointly satisfied — I suspect that a single unified biological state, a determinate time of death, and continued use of both the circulatory and neurological criteria as we actually apply them cannot all be had together — say so plainly, since that tension is the part I most want; flag which single requirement excludes the most candidate accounts, and tell us where we are being forced to choose between desiderata rather than between theories. Please keep clear what is settled — the descriptive physiology, the content of the statute most US states have adopted — and what is contested among people who work on this; do not present a contested position as the consensus, and say where you think the disagreement is merely verbal, about what "death" should mean, and where it is substantive, about what we should be permitted to do. Skip the survey of the standard positions and don't cite anything: I want the specification first, and we can score the whole-brain, brainstem, higher-brain, and circulatory views against it in committee ourselves.
reasoning: |-
  Okay, let me unpack this user's request. They're developing a hospital ethics policy on death determination, specifically navigating tensions between neurological and circulatory standards amid organ procurement pressures. The core challenge is creating a clinically applicable definition that satisfies multiple stakeholders without philosophical compromise.

  Hmm, the user presents several layers: classification cases (decapitation, somatic integration cases), conceptual distinctions (irreversible vs permanent), and futuristic scenarios (perfusion tech, neural prosthetics). They want brutal honesty about what's essential versus ideological preference. 

  First, the non-negotiables leap out: bedside applicability within hours, honest family explanation, legal determinacy, and staff integrity. These aren't just preferences - they're the bedrock of clinical utility. The somatic integration point also feels non-negotiable biologically, though its interpretation varies. 

  The tensions crystallize around three poles: biological unity (single state of death), temporal precision (exact time), and dual-criteria feasibility (using both circulatory/neuro standards). I'm seeing irreconcilable conflict here - insisting on all three creates logical knots, especially when considering future tech like perfusion. 

  For the futuristic cases: perfusion tech explodes "irreversibility" as historically understood, forcing either abandonment of circulatory death or redefining irreversibility contextually. The neural prosthesis scenario reveals deeper fault lines - organismic vs personal identity views. Both cases expose where requirements collide.

  Notably, the dead donor rule and procurement concerns are policy constraints, not definitional requirements. Ordinary intuitions matter for trust but shouldn't dictate biology. The permanent unconsciousness case highlights this tension - biology may declare life where personhood is gone.

  Biggest tripwire: irreversibility. Its interpretation (won't reverse vs can't reverse) excludes more accounts than any other requirement, especially with emerging tech. We're forced to choose between clinical practicality (permanent) and biological rigor (irreversible) - a substantive policy choice, not just semantics.

  The user's smart to separate specification from scoring existing positions. This framework will force hard choices: accept temporal vagueness? Abandon biological unity? Prioritize procurement needs? The perfusion scenario alone may require admitting circulatory death was always provisional - a brutal but necessary conclusion if we value biological accuracy.
answer: |-
  Here’s a specification of desiderata for your death determination policy, structured by necessity, motivated by clinical/practical realities, and annotated for conflicts. Requirements are categorized as **non-negotiable** (essential for policy function) or **negotiable** (reflects philosophical/clinical preferences).

  ---

  ### **I. Non-Negotiable Desiderata**  
  *(Clinically operational, ethically honest, legally defensible)*  

  1. **Bedside Applicability**  
     - **Requirement**: Must be determinable by clinicians within 4 hours using available tools (EEG, angiography, clinical exam, circulatory monitors).  
     - **Motivation**: Practical resource constraints; avoids delays in care or organ procurement.  
     - **Conflict**: Excludes accounts requiring prolonged observation (e.g., indefinite "permanent" cessation).  

  2. **Honest Communication**  
     - **Requirement**: Permits truthful explanation to families without caveats like "legally dead but biologically alive."  
     - **Motivation**: Maintains trust; avoids moral distress in staff (e.g., somatic integration cases).  
     - **Conflict**: Forces rejection of accounts where biological activity persists post-declaration (e.g., ventilated bodies healing wounds).  

  3. **Determinate Time of Death**  
     - **Requirement**: Allows a precise timestamp for legal/administrative purposes (e.g., organ procurement, death certificates).  
     - **Motivation**: Legal necessity; organ viability windows.  
     - **Conflict**: Incompatible with "process-based" views of death (e.g., gradual brain failure).  

  4. **Biological Foundation**  
     - **Requirement**: Death must reflect the irreversible loss of *biological integration* of the organism as a whole.  
     - **Motivation**: Avoids reducing death to loss of personhood or consciousness (e.g., permanent unconsciousness ≠ death).  
     - **Case Anchor**: Decapitation (unequivocal biological death despite temporary cellular activity).  

  ---

  ### **II. Negotiable Desiderata**  
  *(Reflect contested values; policy must choose)*  

  5. **Compatibility with Organ Procurement**  
     - **Requirement**: Should not obstruct DCDD (Donation after Circulatory Death) protocols.  
     - **Motivation**: Societal benefit of transplantation; institutional partnerships.  
     - **Prejudice?**: Reflects procurement priorities; risks conflating death criteria with utility.  

  6. **Conceptual Distinctions Maintained**  
     - **Requirement**: Must not collapse:  
       - Irreversible vs. permanent cessation ("won't reverse" vs. "we won't try").  
       - Death (event) vs. dying (process).  
       - Biological vs. legal death.  
     - **Motivation**: Prevents slippery slopes (e.g., declaring death to allow organ retrieval).  
     - **Case Anchor**: Hypothermic drowning victim (recovery possible despite prolonged arrest).  

  7. **Ordinary Intuitions**  
     - **Requirement**: Roughly aligns with public/religious intuitions about "when someone is gone."  
     - **Motivation**: Social acceptance; avoids perceptions of medical manipulation.  
     - **Conflict**: May exclude biologically rigorous accounts (e.g., higher-brain death in anencephalic infants).  

  ---

  ### **III. Problem Cases & Tensions**  

  #### **Core Tensions**  
  - **Irreconcilable Triad**:  
    - A. Unified biological state of death.  
    - B. Precise time of death.  
    - C. Continued use of *both* circulatory and neurological criteria.  
    **→ Choose two; all three are incompatible** (e.g., circulatory arrest is reversible early; neurological death allows somatic survival).  

  #### **Futuristic Cases**  
  8. **Perfusion Technology Scenario**  
     - **Stipulation**: Technology restores brain circulation/hours post-arrest.  
     - **Challenge**: "Irreversibility" becomes technology-dependent.  
     - **Account Requirement**: Must define irreversibility relative to *current interventions* (e.g., "irreversible under existing protocols").  
     - **Policy Impact**: Retroactively invalidates prior circulatory determinations if irreversibility is redefined.  

  9. **Neural Prosthesis Scenario**  
     - **Stipulation**: Gradual replacement of neurons with hardware; no loss of function.  
     - **Challenge**: Death of organism vs. persistence of identity.  
     - **Account Requirement**: Must clarify if biological integration requires organic tissue.  
     - **Policy Impact**: If prosthesis sustains integration, patient never dies biologically.  

  ---

  ### **IV. Critical Conflicts & Tripwires**  

  - **Most Excluding Requirement**: **"Irreversible" cessation**.  
    - Excludes:  
      - "Permanent" cessation accounts (viable if society agrees not to resuscitate).  
      - Current DCDD protocols (cessation is permanent but potentially reversible with future tech).  

  - **Key Substantive Disagreements**:  
    - **Irreversible vs. Permanent**: Is death declared when function *cannot* return, or when we *will not* attempt return? (DCDD hinges on the latter).  
    - **Brain as Integrator**: Is somatic integration without brain function possible? (Cases: ventilated bodies; pregnancy).  

  - **Merely Verbal Disagreements**:  
    - "Brainstem death" vs. "whole-brain death" in practice (tests overlap; both require loss of integrative capacity).  
    - "Circulatory death" as a stand-in for impending brain death in DCDD.  

  ---

  ### **V. Policy Implications Summary**  

  | **Requirement**               | **Conflict Zone**                          | **Forced Choice**                                  |
  |-------------------------------|-------------------------------------------|---------------------------------------------------|
  | Unified biological state      | vs. Somatic integration cases             | Accept biological disunity or redefine integration |
  | Determinate time              | vs. Process-based death                   | Choose precision or biological accuracy           |
  | Honest communication          | vs. DCDD needs                            | Sacrifice procurement or use "permanent" not "irreversible" |
  | Compatibility with both criteria | vs. Logical coherence                   | Abandon one criterion or accept inconsistency     |

  **Brutal Realities**:  
  - **No account satisfies all desiderata**.  
  - **DCDD protocols inherently conflict** with a rigorous biological definition of death (cessation is permanent, not irreversible).  
  - **The hardest trade-off**: Clinical utility vs. biological precision. Leaning toward utility risks hypocrisy ("dead enough for organs"); leaning toward precision may cripple transplantation.  

  This specification forces the committee to confront whether the policy prioritizes *clinical pragmatism* (accepting conceptual compromises for operational clarity) or *biological rigor* (requiring revisions to current practices like DCDD). The **perfusion technology scenario** is the litmus test: if irreversibility is contingent on technology, death becomes a moving target.
