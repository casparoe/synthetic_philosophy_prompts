prompt: |-
  I'm a third-year PhD student (nominally evo-devo, though my lab is really a functional morphology lab) and I have to write the framing chapter of my thesis where I say where I stand on the adaptationism stuff. We also have a reading group working through the Gould–Lewontin spandrels paper and the literature that grew out of it, and the annoying thing is that when I write down what I actually believe, it looks like a pile of commitments that don't go together — except I genuinely can't tell which ones are in real conflict. My advisor says I've just reassembled a standard package and stops there; I don't think that's right, but I also can't locate the problem myself. So here's the list, roughly in the order I think of it:

  (1) I hold an etiological, selected-effect view of function: a trait's function is what it was selected to do, and a trait doesn't acquire a function merely from being useful now.
  (2) I think the spandrels critique is right as a methodological demand — an adaptationist hypothesis has to be tested against the alternatives (drift, developmental constraint, phylogenetic inertia, byproduct status), and I mean constraint as a genuine explanation, not as a fancy way of saying we don't know yet.
  (3) I also think that, as a matter of fact, for a randomly chosen trait in a randomly chosen organism, the best explanation of why it's there will cite selection.
  (4) I think reverse engineering and optimality modelling are the right way to find out what a trait is for: write down the design problem, solve for the optimum, compare it to the animal.
  (5) I think spandrels and exaptations are a real and sizable phenomenon, not just a methodological caution — I don't want to end up making the dismissive oh-sure-there-are-a-few move and then never let it change a single hypothesis I actually hold.
  (6) But I also think that once a co-opted trait starts being modified by selection for its new role, it is an adaptation for that role, full stop: how a trait originated doesn't settle its current status.
  (7) I'm a pluralist about levels of selection and about bookkeeping — multi-level selection partitions or inclusive fitness, whichever is less confusing for the case in front of me.

  The case that made me notice something is off is my own system: a clade of burrowing skinks (I call them the sand-swimmers in my notes) with enlarged, fused scale patches on the flank just above the hind limb — flank plaques. They appear on the tree at the same node where the lineage shifts to burrowing through coarse gravel; in the lab they have no measurable effect on burrowing speed, abrasion resistance or water loss (I ran all three, and honestly those null results are the solidest data I have); but in the two most derived species the plaques are reshaped into a shallow gutter that channels sand away from the cloacal region, and ablating them costs those species something like fifteen percent of burrowing efficiency, while the basal species don't care at all if you glue theirs shut. My instinct is to say spandrel at origin, adaptation now, in the derived species only — and I've started using a rule of thumb that a trait counts as a spandrel only if selection has never acted on it for any of its current effects, so that spandrel status is a claim about the whole history rather than about the origin.

  So please audit the seven. Which pairs actually pull against each other and how badly, which only look like they conflict, and for each real tension what the cheapest thing to give up would be and what giving it up costs me elsewhere on the list. Rank the tensions by severity instead of flagging everything as equally bad, and tell me if there's a single revision that would clean up more than one at once. If my rule of thumb is doing something I haven't noticed — especially if it quietly collapses the distinction I'm trying to protect in (5), or quietly contradicts (6) — I'd rather find that out now than during my defence. Please don't just tell me which combination is the orthodox one.
reasoning: |-
  Okay, let's tackle this user's problem. They're a PhD student in evolutionary biology, struggling to reconcile their seven commitments about adaptationism for their thesis chapter. The main issue is that their beliefs seem internally conflicting, but they can't pinpoint where exactly the conflicts lie. Their advisor thinks it's a standard package, but the user disagrees. 

  First, I need to understand each of their seven points and how they interact. Starting with (1) the etiological view of function: this defines function based on past selection. Then (2) agrees with the spandrels critique as a methodological demand, requiring testing against alternatives like constraints. But (3) states that selection is usually the best explanation for traits. That seems to clash with (2) because if selection is often the answer, why emphasize testing alternatives? 

  Point (4) advocates for optimality modeling as the primary method. But if spandrels are common (5), optimality models might not always apply. The user also wants to avoid dismissing spandrels as rare. Point (6) says that once selection modifies an exaptation, it becomes an adaptation. Then (7) is pluralistic about selection levels.

  Their case study with the skinks shows a trait that started as a spandrel but later became adaptive. Their rule of thumb is that a trait remains a spandrel only if selection never acted on it for any current effect. This seems to bridge (5) and (6), but does it conflict with (1)? The etiological view requires past selection for the function, but their rule allows a trait to have a function (due to later selection) while still being called a spandrel based on origin. That's a tension between (1) and their rule.

  Another conflict is between (3) and (5). If selection is the best explanation for most traits, but spandrels are common, that might be contradictory. The user needs to clarify how common "common" is. Also, (4)'s reliance on optimality modeling might not account for non-adaptive traits. If they use optimality models but traits aren't optimal due to constraints, that's a problem. 

  The levels of selection in (7) might not directly conflict, but it's another layer. The biggest tensions are between the methodological caution in (2) versus the confidence in selection (3) and optimality modeling (4). The user wants to take spandrels seriously but also thinks selection is usually the answer. 

  Cheapest fix might be adjusting (3) to say selection is often but not always the best explanation, leaving room for spandrels. Also, refining the rule of thumb to avoid conflating origin with current function. Emphasizing that optimality models can test constraints by showing deviations might help reconcile (4) with (2) and (5). 

  The user's deeper need is to present a coherent framework without contradictions, especially for their thesis defense. They need clarity on where their views align or conflict, and how to articulate their pluralistic but consistent stance. Highlighting that their rule of thumb is a practical heuristic but not part of the core theoretical commitments could reduce tension. Making explicit that different points address different aspects (methodology vs. prevalence) might also help.
answer: |-
  Here’s an audit of your seven commitments, ranked tensions, revisions, and implications for your rule of thumb. The conflicts aren’t fatal but require careful framing. The core tension is between **historical ontology** and **methodological pragmatism**.

  ### Ranked Tensions (Severe → Mild)
  1.  **Tension: (1) vs. (6) + Your Rule of Thumb**  
      - **Conflict:** (1) defines function *solely* by historical selection. (6) and your rule imply that a trait *can* acquire a new function via selection *after* its origin (exaptation-turned-adaptation). Your rule ("spandrel only if *no* selection ever acted") implicitly requires the *current effect* to be functional under (1), but (1) denies "function" to effects not linked to *original* selection.  
      - **Severity:** High (ontological conflict).  
      - **Cheapest Fix:** **Refine (1).** Adopt a "modern history" etiological view: Function is what a trait was *maintained or modified by selection for* within a relevant timeframe (e.g., since acquiring its current form/role). This retains historicity without binding function solely to the trait's *deepest* origin.  
      - **Cost:** Purists may accuse you of watering down "true" etiological function. Benefit: Aligns (1) with (6) and your skink case. Your rule of thumb becomes coherent: "Flank plaque" *was* a spandrel (non-functional origin), *now* has a function (modified/selected for sand-channeling in derived species).  

  2.  **Tension: (3) vs. (5)**  
      - **Conflict:** (3) claims selection is "best explanation for a randomly chosen trait." (5) claims spandrels/exaptations are a "sizable phenomenon." "Sizable" and "randomly chosen trait... best explained by selection" are in direct tension unless "sizable" is very small (<20%).  
      - **Severity:** High (empirical/quantitative conflict).  
      - **Cheapest Fix:** **Qualify (3).** Replace "randomly chosen trait" with "complex, integrated trait in a lineage under strong selective pressure" OR add "often, but far from universally" to (3). Explicitly state that "sizable" in (5) means common enough to demand rigorous testing (15-40%?), not necessarily the majority.  
      - **Cost:** Weakens the strong adaptationist heuristic implied by (3). Benefit: Makes (3) compatible with (2) and (5). Your skink case (spandrel origin) exemplifies why (3) can't be universal.  

  3.  **Tension: (4) vs. (2) & (5)**  
      - **Conflict:** (4) presents optimality modeling/reverse engineering as "the right way" implying primacy/sufficiency. (2) demands testing against *alternatives* (constraints, drift) and (5) insists spandrels are common *outcomes*. Optimality modeling alone often fails to detect constraints/spandrels; it assumes adaptation.  
      - **Severity:** Moderate (methodological conflict).  
      - **Cheapest Fix:** **Reframe (4).** State optimality modeling is a *powerful tool for generating and testing adaptationist hypotheses*, **but** its results *must be interpreted in conjunction with tests for alternatives* demanded by (2) and consistent with (5). It's step one, not the whole process.  
      - **Cost:** Dethrones optimality as the "right way" in isolation. Benefit: Integrates (4) with your core methodological commitment (2) and realism about non-adaptive origins (5). Your skink null results (no burrowing benefit) *required* looking beyond optimality.  

  4.  **Tension: (1) Refined vs. Spandrel Status (Your Rule)**  
      - **Conflict:** If you refine (1) to allow "modern history" function, what is the ontological status of the *original* spandrel in your rule? Under refined (1), the derived skink's gutter *has a function* (sand channeling). Calling it a "spandrel" (under your rule) is now *only a statement about its origin*, not its current functional status.  
      - **Severity:** Moderate (terminological/emphasis conflict).  
      - **Fix:** **Clarify Terminology.** Be explicit: "Spandrel" refers *strictly to the origin* (non-adapted byproduct). A trait can be:  
          *   A spandrel *with no subsequent function* (pure byproduct).
          *   An *exaptation* (co-opted spandrel currently useful but *not modified*).
          *   An *adaptation* (spandrel or exaptation *modified by selection* for its current role).  
      - **Cost:** "Spandrel" becomes purely historical. Benefit: Protects the distinction you want in (5) and aligns with (6). Your rule ("spandrel only if never selected") is clear: It isolates *pure* spandrels. Derived skink plaques are *adaptations* (modified), *originating as spandrels*.  

  5.  **Tension: (7) vs. Conceptual Neatness (Minor)**  
      - **Conflict:** While not contradictory, pluralism (7) adds a layer of "it depends" that can feel messy alongside the desire for clean definitions in (1) and (6).  
      - **Severity:** Low (pragmatic/philosophical style conflict).  
      - **Fix:** **Embrace it as Pragmatism.** State clearly that levels of selection/bookkeeping are *analytical frameworks* and the choice is *instrumental* (which best explains *this specific* problem/trait). This doesn't undermine core commitments about function or adaptation.  
      - **Cost:** None significant. Benefit: Honest reflection of scientific practice.  

  ### Your Rule of Thumb Audit
  *   **Does it collapse (5)?** **No.** It *protects* (5) by providing a clear, operational definition for identifying a "pure spandrel" (never selected) as a distinct category. This forces you to actively *consider* and potentially *accept* spandrel status, addressing your fear of the "dismissive move."
  *   **Does it contradict (6)?** **No, it complements it.** (6) says origin doesn't settle *current status*. Your rule defines "spandrel" *as* an origin status. They work together: A trait can be a spandrel *by origin* but an adaptation *by current status* (if modified), which is your skink conclusion. Your rule *excludes* such traits from being *called* "spandrels" *now*, focusing the term on the origin event. This is consistent.
  *   **Hidden Cost:** It risks **minimizing the significance of exaptation**. An *unmodified* exaptation (co-opted spandrel) would be *functional now* (under refined (1)) but still called a "spandrel" under your rule if selection acted only to *maintain* it, not modify it. You might downplay this important category. **Recommendation:** Explicitly define and discuss "exaptation" as a key state alongside spandrel and adaptation.

  ### The Single Most Effective Revision
  **Refine Commitment (1) to a "Modern History" Etiological View.** This:
  1.  Resolves the severe tension with (6) and your rule of thumb.
  2.  Makes your functional attribution in the derived skinks (adaptation *for* sand-channeling) ontologically sound.
  3.  Provides a clearer basis for distinguishing spandrel (origin) vs. function (current selective maintenance/modification).
  4.  Is largely compatible with common usage in functional morphology/evo-devo.

  ### How to Frame Your Chapter
  1.  **Core Ontology:** Adopt the refined etiological view (Function = what it was *maintained/modified by selection for* in the relevant evolutionary context).
  2.  **Methodology:** Champion (2) – rigorous testing of adaptation vs. alternatives (constraint, drift, exaptation) is non-negotiable.
  3.  **Heuristic Bias:** Admit a moderate adaptationist heuristic (revised (3): selection is *often* the best explanation for complex traits in evolving lineages, but far from universal).
  4.  **Tools:** Position (4) (optimality modeling) as a primary tool *for generating and testing adaptationist hypotheses*, but *integral* to the pluralistic testing demanded by (2).
  5.  **Phenomena:** Affirm (5) – spandrels/exaptations are a substantial phenomenon, requiring explanation. Use clear definitions:
      *   **Spandrel:** Trait originating as a non-adapted byproduct.
      *   **Exaptation:** Spandrel co-opted for a current use *without* modification by selection for that use.
      *   **Adaptation:** Trait originated *or modified* by selection for its current role (includes modified exaptations).
  6.  **Trait Histories:** Embrace (6) and your rule – a trait's *origin* and its *current selective status* are distinct questions. "Spandrel" properly refers only to origin.
  7.  **Levels/Accounting:** Defend (7) as pragmatic analytical pluralism.
  8.  **Your Case Study:** Present your skinks as a poster child: Spandrel origin (no initial function), exaptation (possibly in intermediate species? - investigate maintenance), adaptation in derived species (modified by selection for new function).

  This framework is internally consistent, honors the spandrels critique methodologically and empirically, retains the power of adaptationist tools, reflects biological reality (like your skinks), and avoids naive pan-adaptationism. It's a sophisticated, modern evolutionary morphology position. Your advisor might call it "standard" because it synthesizes post-spandrels best practices, but it's coherent and defensible. Good luck with the chapter and defense!
