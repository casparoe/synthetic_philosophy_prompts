  ### Core Rationale
  The analogy **collapses under the non-identity problem**: Tough love "withdrawal" harms mothers (who lose 70-80% functional aid) while corrupt officials may substitute stolen domestic funds. The 20-30% leakage is a **tax on effectiveness**, not an existential pathology. Your fiduciary duty isn't to "cure" the ministry but to maximize maternal health outcomes. Abandoning the ministry channel *without proven alternatives* risks:
  - Nurses quitting (if per-diems eliminated),
  - Cold-chain collapse (ministry often owns distribution infrastructure),
  - Reduced geographic coverage (NGOs rarely reach remote areas).

  ### Recommended Path
  1. **Target the per-diems**: Most vulnerable to graft. Shift to mobile-money stipends tied to clinic attendance records (via NGO verification).  
  2. **Keep drugs/cold-chain funding** through ministry but demand shipment-level audits.  
  3. **Fund civil society watchdogs** to monitor deliveries at district hospitals.  
  4. **Benchmark leakage** against domestic health spending – if similar, aid isn't uniquely enabling corruption.  

  This maintains 70-80% benefit delivery while reducing leakage vectors – a pragmatic alternative to NGO-only absolutism. The analogy’s flaw is demanding binary purity in a context where partial solutions save lives.
