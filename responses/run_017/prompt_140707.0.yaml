  Here's a rigorous breakdown of the addiction analogy's validity and implications for your foundation's decision, structured per your deliverables:

  ### (a) Correspondence Table: Addiction Element → Aid Counterpart

  | Addiction Element | Aid Counterpart                              | Fit               | What the Mapping Silently Adds                      |
  |-------------------|---------------------------------------------|-------------------|----------------------------------------------------|
  | Addict            | Ministry of Health officials / Governor     | **Strained**      | Assumes unified actor with consistent harmful intent |
  | Drink             | Aid funds routed through ministry           | **Broken**        | Equates *resources* with *harm mechanism*        |
  | Enabler           | Donor foundation                            | **Strained**      | Implies donors *knowingly perpetuate harm*        |
  | Disease           | Systemic corruption                         | **Clean**         | —                                                  |
  | Tolerance         | Increasing leakage over time                | **No counterpart** | (Leakage % is stable, not escalating)             |
  | Escalation        | —                                           | **No counterpart** | —                                                  |
  | Withdrawal        | Cutting ministry funding                    | **Broken**        | Portrays aid cutoff as therapeutic for "addict"   |
  | Recovery          | Ministry reform                             | **Clean**         | —                                                  |
  | Relapse           | Resumed leakage if funding restarted        | **Clean**         | —                                                  |
  | Intervention      | Conditionality / Anti-corruption measures   | **Strained**      | Overstates donor control over state behavior      |
  | Family            | Pregnant women / clinics                    | **Broken**        | "Family" *benefits* from partial aid delivery     |
  | Harm              | Diversion of resources                      | **Clean**         | —                                                  |

  **Key Breakages**:  
  - **Non-identity of harm**: "Family" (mothers) are *beneficiaries* of the 70-80% that arrives, not co-dependents.  
  - **Withdrawal harms innocents**: Cutting aid primarily hurts mothers, not the "addict" (officials).  
  - **No tolerance/escalation**: Your leakage is stable (20-30%), not a progressive disease.  

  ---

  ### (b) Load-Bearing vs. Cosmetic Disanalogies

  | Disanalogy                          | Why It Matters (or Cosmetic) | What Would Stop It Mattering                  |
  |-------------------------------------|------------------------------|-----------------------------------------------|
  | **Harm targets different parties**  | **LOAD-BEARING**             | If officials were sole beneficiaries of aid  |
  | (Officers benefit, mothers harmed by leakage) | Determines ethical calculus  |                                               |
  | **Withdrawal harms "family"**       | **LOAD-BEARING**             | If NGO channels could *immediately* replace  |
  | (Mothers lose 70-80% of aid)        | Undermines "tough love" logic | 100% of ministry-delivered aid               |
  | **No progressive tolerance**        | Cosmetic                     | If leakage were rising yearly despite reforms|
  | (Stable leakage ≠ escalating addiction) |                             |                                               |
  | **Aid isn't the "drug"**            | **LOAD-BEARING**             | If corruption *only* occurred via aid funds  |
  | (Officials steal domestic funds too)| Weakens causality claim      |                                               |

