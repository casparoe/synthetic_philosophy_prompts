prompt: |-
  Hi — I run the integrity/compliance function at a mid-sized INGO (health and cash transfer programmes, around 40 country offices). We have a whistleblowing line that staff and beneficiaries can text into, and we get maybe 200 reports a year, of which something like 60 are about money or favours rather than safeguarding or HR stuff. Right now triage is basically: whoever is on duty reads it, forms a view, and the country director decides. Unsuprisingly we are wildly inconsistent — one office dismissed someone for a $15 facilitation payment, another office treated a much bigger thing as "local custom" and closed it. Reports go to donors in aggregate and occasionally individually, and some end in dismissal or a police referral, so the inconsistency is starting to be a real problem for us.

  What I need from you is a written procedure my team can actually run. Constraints: triage is done by a two-person team (neither is a lawyer, both are from the region), they have maybe 30 minutes per report, the output has to be a short written record that a regional director can sign off on and that would survive being read aloud to (a) a donor and (b) the local staff whose practice it is. And it has to work in translation — most offices don't operate in English.

  Conceptually I think we keep conflating four questions and I want the procedure to keep them apart:
  (i) does the thing fit the definition of corruption at all;
  (ii) if it does, who is made worse off, and how identifiable are those people;
  (iii) is the person involved blameworthy given what their actual options were — I keep running into cases where refusing to pay isn't a real option, as opposed to cases where both sides are collaborating to get something they're not entitled to;
  (iv) what we do about it: sanction the individual, report it upward, change our own process so the payment stops being necessary, or leave it alone.
  I want the procedure to output both a classification and a response recommendation, and to be explicit that these can come apart — something can be corruption and still warrant no sanction.

  Two design requirements I care about, and please argue with me if you think either is wrong:

  - Currency neutrality. The transfer might be cash, but it might be a job for a nephew, school fees, a goat, an invitation to a wedding, a promise to turn up at a rally, or help getting a relative out of a police station. Our current practice treats cash as the serious case and the rest as "culture", which I'm fairly sure is just parochialism with a nicer name. I want the classification to come out the same if you swap the currency, and I want the procedure to say so out loud rather than leave it implicit.
  - Relationship-shaped cases. A lot of what reaches us isn't a single act, it's a pattern over years: the same intermediary connecting the same people across completely different domains — a small sub-contract here, help getting a kid into school there, a hospital bed, a police matter quietly sorted. Each act is defensible on its own; the thing that worries me is the relationship. So I want a branch that takes a pattern rather than an act as the unit of analysis, and a test for when a pile of individually fine acts adds up to something we should call clientelism. My guess at the test is something about convertibility (can credit earned in one domain be cashed in another?) and something about who else could have obtained the same thing, but please do better than my guess.

  Things I want flagged rather than smoothed over:

  - Cases where nobody personally profited. Quite often an office does something improper and the benefit accrues to the programme or to the community, not to any individual. Our rules — which are basically "use of a position for private gain" — fit these badly, and I'd rather the procedure tell me it doesn't know what to do with them than pretend they're just the easy case.
  - Where our own standard is the imported one. I'd like some kind of stress test that catches us applying a Western or northern intuition and calling it universal. But I also know that kind of test gets abused as a blanket excuse, so tell me where it misfires and what stops someone using it to wave anything through.
  - Where the collective-action version bites. Even where everyone agrees a practice is bad, one office that opts out on its own loses its licence, its shipments, its land, while the practice carries on regardless — which means our own rule creates pressure to not report rather than to not pay. I want the procedure to register this where it applies and to say how the record should note it.
  - Which decisions genuinely can't be made by procedure and have to go to a named person as a values call. I need to know which boxes those are and who signs.

  Deliverable: a one-page version I can hand to the team — ordered questions, what counts as a sufficient answer to each, where it stops with a no, where it hands off — plus a short appendix saying, for each step, which distinction is doing the work and which distinctions you deliberately dropped to make it usable, and where it will misfire. I definately don't need citations or a reading list, I can't check them and they'd be no use to me; just give me the reasoning.

  Then run it on three cases and show me the records you'd actually produce:

  1. Enumerators registering households for a cash programme are routinely given eggs or a chicken afterwards. The teams say refusing is an insult and head office has told them to accept. One enumerator later helped a household that had given her a chicken fill in their form "properly" so they'd qualify. Small stuff in itself, but it's dozens of times a week across a whole district, and the second bit feels different to me in a way I can't articulate — if the procedure can articulate it, that would be worth a lot.

  2. A logistics assistant pays the equivalent of about $12 to a customs clerk to release a consignment of therapeutic food that is already legally cleared and has been sitting for nine days after three weeks of written requests that went nowhere. He reports it himself the same day, he has the receipt, and he's the person who kept telling the regional office the shipment was stuck. Nobody was personally enriched and the food reached a feeding programme.

  3. A country office needed land for a distribution site and a chief provided it, essentially for free, because the office had a long relationship with his family. Later the office hired his daughter as a casual enumerator ahead of 40 applicants with better test scores. For two years the office has also routed small sub-contracts, staff medical referrals and a couple of school-fee advances through the same local fixer, who is also a youth organiser for the governing party. Staff say he is the only reason anything gets done in that district and that they owe him. Classify it, tell me who is harmed and how identifiable they are, and tell me what we do — because my instinct is that sanctioning anyone here would be insane and would cost us the programme, and I want to know whether the procedure agrees with me or whether it tells me I'm just protecting my own office.
reasoning: |-
  We are designing a triage procedure for whistleblower reports that classifies incidents and recommends responses. The procedure must be consistent, usable by a two-person team with limited time, and produce a clear written record. It must handle non-cash transactions, patterns of behavior (clientelism), and complex cases where no individual profits or where collective action problems exist.

  The procedure separates four questions:
  (i) Is it corruption?
  (ii) Who is harmed and how identifiable are they?
  (iii) Is the person blameworthy?
  (iv) What should we do?

  Design requirements:
  - Currency neutrality: Treat cash and non-cash transactions the same.
  - Relationship-shaped cases: Detect when a pattern of acts amounts to clientelism.

  We also want to flag:
  - Cases where no individual profited.
  - Cases where our standard might be an imported Western intuition.
  - Collective-action problems.
  - Decisions that must be a values call by a named person.

  The output is a one-page procedure and an appendix explaining key choices, plus three case applications.

  ---

  **One-Page Triage Procedure: Corruption Incident Classification and Response (CICR) Framework**

  **Step 1: Define the Act(s) (5 minutes)**
  - *Question:* What exactly happened? Describe the act(s) in simple terms. If multiple acts, note if they are part of a pattern (same people, over time, across domains).
  - *Required:* 
    - Who did what, to/for whom, what was transferred (cash, goods, services, favors), and in what context?
    - If a pattern, briefly describe the pattern and the relationship (e.g., "same fixer used for contracts, jobs, and personal favors over 2 years").
  - *Stop if:* The act is not work-related (e.g., purely personal dispute). Hand off to HR/safeguarding.
  - *Output:* A factual description. No judgment yet.

  **Step 2: Is it Corruption? (10 minutes)**
  - *Question:* Does the act fit the definition: "Use of organizational position or resources to gain an advantage, whether for oneself, another individual, or the organization, that violates fairness, impartiality, or the law"?
  - *Key tests (all must be met):*
    1. *Abuse of position:* Did the staff member use their role (or allow it to be used) to influence an outcome?
    2. *Unfair advantage:* Did the act give someone (anyone) something they would not have gotten fairly or legally? (Note: "Fairly" means according to transparent rules. If rules are unwritten, probe.)
    3. *Detriment:* Did it harm the INGO’s mission, integrity, or others? (Harm can be to trust, resources, or opportunity for others.)
  - *Currency neutral:* Treat cash, gifts, favors, promises, etc., the same. Focus on the advantage, not the form.
  - *Flag:* If no individual profited (e.g., advantage went to the program or community), note here. It may still be corruption (e.g., if rules were broken to help the program).
  - *Stop if:* No to all tests. Output: "Not corruption" with reason. Hand off only if other issues (e.g., HR).
  - *Output:* "Corruption" or "Not corruption." If corruption, note type (bribery, favoritism, etc.).

  **Step 3: Harm and Identifiability (5 minutes)**
  - *Question:* Who was harmed, and how identifiable are they?
  - *Required:*
    - *Direct harm:* Example: A qualified applicant didn’t get a job; a household missed a benefit; the INGO lost money.
    - *Indirect harm:* Example: Erosion of trust in the program; distortion of local systems.
    - *Identifiability:* Are harmed individuals known or knowable? (High: e.g., a specific job applicant; Low: e.g., "the community" or "taxpayers.")
  - *Output:* Brief description of harm and identifiability (High/Medium/Low).

  **Step 4: Blameworthiness (5 minutes)**
  - *Question:* Was the staff member’s action understandable given their options?
  - *Key tests:*
    1. *Coercion:* Was refusing the act unsafe or impossible? (e.g., threat of violence, loss of job)
    2. *Alternatives:* Were there realistic alternatives? (e.g., reporting to higher authority, using official channels)
    3. *Intent:* Was the act intentional? (e.g., deliberate vs. accidental)
  - *Flag collective-action problems:* Note if: "Refusal would not stop the practice but would penalize the INGO (e.g., loss of license, delays)." This doesn’t excuse the act but informs response.
  - *Output:* "Blameworthy," "Partially blameworthy," or "Not blameworthy," with brief reason.

  **Step 5: Pattern Analysis (If applicable, 5 minutes)**
  - *Trigger:* If Step 1 noted a pattern or if multiple reports exist about the same people/relationship.
  - *Question:* Does the pattern indicate clientelism?
  - *Key tests:*
    1. *Convertibility:* Can favors in one domain (e.g., a job) be "cashed in" in another (e.g., a contract)?
    2. *Exclusivity:* Is the relationship closed to others? (e.g., "Only this fixer can get things done")
    3. *Harm scale:* Does the pattern cause widespread harm (e.g., systemic exclusion, dependency)?
  - *Output:* If yes, "Clientelism pattern." Add to classification.

  **Step 6: Response Recommendation (5 minutes)**
  - *Inputs:* Corruption (Step 2), Harm (Step 3), Blame (Step 4), Pattern (Step 5).
  - *Options:*
    - No action (e.g., not corruption, or corruption but no blame and no harm to rectify).
    - Sanction staff (e.g., training, dismissal).
    - Report upward (e.g., to donors, police).
    - Process change (e.g., fix system gaps).
    - Note: Sanction and no sanction can coexist (e.g., "Corruption, no sanction due to coercion, but change process").
  - *Recommendation rules:*
    - If corruption and blameworthy: Sanction + report if serious.
    - If corruption but not blameworthy: Focus on process change.
    - If clientelism: Always recommend systemic review (process change + possible donor report).
    - If collective-action problem: Recommend advocacy/collective action with other NGOs.
  - *Values call needed if:*
    - Act is corruption by our rule but deeply embedded in local practice with no alternatives (e.g., Step 4 coercion + Step 3 harm low). Hand off to Regional Director with options.
  - *Output:* Recommended action(s).

  **Final Output:** A written record (template below) signed by Regional Director.

  ---

  **Template for Written Record**
  ```
  Incident ID: [ ]
  Date: [ ]
  Step 1 (Facts): [Description]
  Step 2 (Corruption?): [Yes/No] [Type] [Notes, e.g., no individual profit]
  Step 3 (Harm): [Description] [Identifiability: High/Med/Low]
  Step 4 (Blame): [Blameworthy/Partially/Not] [Reason, e.g., coercion, alternatives]
  Step 5 (Pattern): [Clientelism? Yes/No] [Reason, e.g., convertibility, exclusivity]
  Step 6 (Response): [Recommendation] [Values call? If yes, to whom]
  Regional Director Signature: [ ]
  ```

  ---

  **Appendix: Design Choices and Misfires**
  - *Distinctions kept:*
    - Currency neutrality: Explicitly tested in Step 2 (unfair advantage, not form).
    - Pattern vs. act: Step 5 triggered by relationships.
    - Blame vs. act: Step 4 separates moral judgment from definition.
    - Response vs. classification: Step 6 allows "corruption but no sanction."
  - *Distinctions dropped:*
    - "Cultural" defense: Not a separate test. Instead, Step 4 (blame) considers context, and Step 6 flags values calls. Prevents abuse by requiring proof of coercion/alternatives.
    - Legal vs. ethical: Merged into "violates fairness or law" in Step 2. We prioritize mission impact over local law alone.
  - *Misfires:*
    - Step 2 may overreach: E.g., a genuinely cultural gift exchange with no advantage might be mislabeled. Mitigation: Step 4 blameworthiness may correct (e.g., "not blameworthy").
    - Step 5 (pattern) may miss subtle clientelism. Mitigation: Requires multiple reports or explicit pattern note in Step 1.
    - Collective-action problems: Step 4 flags but doesn’t solve. We rely on Step 6 to push for advocacy, not excuses.
  - *Values calls:* Required when:
    - Corruption is clear but local practice makes blameworthiness ambiguous (Step 4).
    - Action would penalize the INGO disproportionately due to systemic issues (collective-action problem).
    - Assigned to: Regional Director, who must consult HQ if donor impact.

  ---

  **Case Applications**

  **Case 1: Enumerator accepted chicken, then helped household qualify**
  - *Step 1 (Facts):* Enumerator accepted chicken from household after registration. Later, she assisted that household with form to qualify them. Pattern: Common practice (eggs/chicken given to enumerators weekly; this is the first report of subsequent favor).
  - *Step 2 (Corruption?):* Yes. Abuse of position (used role to assist household unfairly). Unfair advantage (household got benefit they might not deserve). Harm to INGO integrity (undermines fair targeting). Currency: Non-cash (chicken) and favor treated same as cash.
  - *Step 3 (Harm):* Direct harm to other households who didn’t get extra help; identifiability Low (specific losers unknown).
  - *Step 4 (Blame):* Partially blameworthy. Refusing chicken may not have been a real option (head office said accept), but helping with forms was avoidable (could have referred to supervisor).
  - *Step 5 (Pattern):* No clientelism yet (single act; no evidence of cross-domain favors).
  - *Step 6 (Response):* Sanction staff (training on conflicts of interest) + Process change (revise gift policy; clarify that accepting small tokens must not create obligations; random audits of forms). No values call needed.
  - *Articulated concern:* The second act (helping with forms) is different because it converts a gift into an unfair advantage. Step 2 captures this as "unfair advantage."

  **Record:**
  ```
  Incident ID: WB-2023-001
  Step 1: Enumerator accepted chicken from household post-registration. Later helped same household complete form to qualify for cash transfer. Common practice to accept small gifts; this is first report of favor in return.
  Step 2: Yes (favoritism). Note: Non-cash gift initiated chain.
  Step 3: Harm: Unfair exclusion of others. Identifiability: Low.
  Step 4: Partially blameworthy (pressure to accept gift, but form help was avoidable).
  Step 5: No pattern.
  Step 6: Recommend: Staff training + revise gift policy. No sanction beyond training.
  ```

  **Case 2: Logistics assistant paid $12 to release cleared therapeutic food**
  - *Step 1 (Facts):* Logistics assistant paid $12 to customs clerk to release legally cleared therapeutic food stuck for 9 days after weeks of requests. Self-reported with receipt. Food for feeding program.
  - *Step 2 (Corruption?):* Yes. Abuse of position (used role to facilitate payment). Unfair advantage (INGO got expedited service others might not). Harm to rule of law. Note: No individual profit (benefit to program).
  - *Step 3 (Harm):* Indirect harm to system integrity; identifiability Low (general public).
  - *Step 4 (Blame):* Not blameworthy. No realistic alternatives (official channels failed; delay harmed beneficiaries). Intent was to serve program.
  - *Step 5 (Pattern):* Not triggered (single act).
  - *Step 6 (Response):* No sanction. Process change: Address customs bottlenecks with authorities; seek collective NGO action. Report upward to donor if systemic.
  - *Collective-action note:* Step 4 flags: Refusal would have hurt program while practice continues.

  **Record:**
  ```
  Incident ID: WB-2023-002
  Step 1: Logistics asst. paid $12 to customs clerk to release legally cleared food (stuck 9 days). Self-reported. Food for beneficiaries.
  Step 2: Yes (bribery). Note: Benefit to program, no personal gain.
  Step 3: Harm: Erosion of legal process. Identifiability: Low.
  Step 4: Not blameworthy (no alternatives; intent to serve program).
  Step 5: No pattern.
  Step 6: Recommend: No sanction. Process change: Engage customs authorities + collective advocacy.
  ```

  **Case 3: Land, jobs, and favors via chief’s family and fixer**
  - *Step 1 (Facts):* Pattern: Country office used land from chief for free due to long relationship. Hired chief’s daughter (weaker applicant) as enumerator. Routed contracts, medical referrals, school fees through same fixer (also political youth leader) for 2 years. Fixer described as essential.
  - *Step 2 (Corruption?):* Yes (multiple acts). 
    - Land: Unclear advantage (free land for program) but may violate procurement rules. 
    - Hiring: Abuse of position (favoritism); unfair advantage (daughter over better candidates). 
    - Fixer dealings: Abuse (using fixer for personal/organizational gains); advantage (faster services). Harm to meritocracy and neutrality.
  - *Step 3 (Harm):* Direct harm to job applicants (identifiable: the 40 applicants); indirect harm (program perceived as partisan).
  - *Step 4 (Blame):* Partially blameworthy. Some coercion (fixer essential due to system failure), but hiring/favoritism avoidable.
  - *Step 5 (Pattern):* Clientelism. Convertibility: Fixer’s help in one area (e.g., contracts) used to gain in another (e.g., jobs). Exclusivity: Staff say he’s the only option. Harm scale: Distorts local economy and access.
  - *Step 6 (Response):* Process change (review procurement, hiring, fixer use; create alternatives). No individual sanction (blame low due to system). Report upward to donor (systemic risk). Values call: Regional Director must decide on political risk (if ending fixer ties costs program). Note: Harm to applicants is identifiable, so consider redress (e.g., future hiring priority).
  - *Procedure’s view:* Sanctioning individuals would be ineffective (systemic clientelism). Focus on changing the system. Protects the office? Yes, by avoiding reckless sanctions, but forces action on root causes.

  **Record:**
  ```
  Incident ID: WB-2023-003
  Step 1: Pattern: Land from chief (free); hired chief’s daughter over better candidates; routed contracts, medical, school fees through political fixer for 2 years. Fixer seen as essential.
  Step 2: Yes (favoritism, conflict of interest). Note: Land benefit to program.
  Step 3: Harm: Direct to job applicants (40 identifiable people); indirect to program neutrality.
  Step 4: Partially blameworthy (system pressures, but favoritism in hiring was avoidable).
  Step 5: Clientelism (convertibility, exclusivity).
  Step 6: Recommend: Process change (review systems) + donor report. No sanction. Values call: Regional Director on political risk of disengaging fixer.
  ```

  ---
  **Note:** The procedure agrees with your instinct in Case 3—sanctioning individuals is not the priority. It redirects focus to systemic fixes and flags the values call for the Regional Director.
answer: |-
  Below is a streamlined triage procedure designed for your constraints, followed by an appendix explaining key choices, and applications to your three cases. The procedure separates your four questions, enforces currency neutrality, detects relationship patterns (clientelism), flags edge cases, and specifies where values calls are needed. Outputs are concise records for regional director sign-off.

  ---

  ### **ONE-PAGE TRIAGE PROCEDURE: CORRUPTION CLASSIFICATION & RESPONSE (CCC-R)**  
  *Time per report: 30 mins max | Output: Signed record for RD*

  #### **Step 1: DEFINE THE ACT (5 mins)**  
  **Question:** What was transferred (cash, goat, job, favor) and what was received? Is this part of a repeated pattern with the same actors?  
  **Output:**  
  - One-sentence description (e.g., "Enumerator accepted chicken for registration").  
  - Pattern flag: ✔️ if same actors across ≥2 domains (e.g., "land, jobs, and police favors through Chief X").  
  **Stop if:** Not work-related (hand off to HR/safeguarding).  

  #### **Step 2: IS IT CORRUPTION? (10 mins)**  
  **Question:** Did staff use their position to gain an **unfair advantage** (regardless of currency or beneficiary)?  
  **Test:**  
  - ✔️ **Corruption** if:  
    - Advantage was obtained (e.g., faster service, qualification, contract) AND  
    - Rules were broken (written policy or local law) OR harm occurred (exclusion, distortion, mission risk).  
  - ❌ **Not corruption** if:  
    - Trivial (value <1hr local wage) AND no harm AND no rule broken.  
  **Currency-neutral rule:** State explicitly: "Cash, gifts, or favors are treated identically."  
  **Flag:** "No individual profit" if benefit went to program/community.  
  **Output:** "Corruption" or "Not corruption." If corruption, type (e.g., bribery, nepotism).  

  #### **Step 3: HARM & IDENTIFIABILITY (5 mins)**  
  **Question:** Who was harmed, and can we identify them?  
  **Output:**  
  - **Direct harm:** "Households excluded from cash program" (identifiable: **High**).  
  - **Indirect harm:** "Eroded trust in program" (identifiable: **Low**).  
  - **Collective-action flag:** ✔️ if "Refusal would not stop practice but would penalize INGO (e.g., lose license/shipments)."  

  #### **Step 4: BLAMEWORTHINESS (5 mins)**  
  **Question:** Could staff reasonably refuse without severe consequences?  
  **Test:**  
  - **Not blameworthy:** No safe/feasible alternative (e.g., refusal risks violence, job loss).  
  - **Blameworthy:** Avoidable collusion (e.g., both parties gained illicitly).  
  - **Values call needed:** If "local custom" defense conflicts with INGO rules → Escalate to RD.  
  **Output:** "Blameworthy," "Not blameworthy," or "Escalate to RD."  

  #### **Step 5: CLIENTELISM TEST (If pattern flagged, 3 mins)**  
  **Question:** Does the pattern create a closed system of exchange?  
  **Test:** ✔️ **Clientelism** if:  
  - **Convertibility:** Favors in one domain (e.g., contract) buy influence in another (e.g., school admission).  
  - **Exclusivity:** Only connected actors access INGO resources (e.g., "Fixer Y is sole gateway").  
  **Output:** "Clientelism pattern" or "No."  

  #### **Step 6: RESPONSE RECOMMENDATION (2 mins)**  
  **Inputs:** Corruption (Step 2), Harm (Step 3), Blame (Step 4), Clientelism (Step 5).  
  **Rules:**  
  - **No action:** Not corruption OR blameworthy + no harm.  
  - **Sanction individual:** Corruption + blameworthy (e.g., dismissal).  
  - **Report upward:** Corruption + high harm OR clientelism.  
  - **Change process:** Collective-action flag OR clientelism.  
  **Output:** 1–2 recommended actions (e.g., "Change customs process; no sanction").  

  ---

  ### **APPENDIX: DESIGN CHOICES & MISFIRES**  
  1. **Distinctions kept:**  
     - **Currency neutrality:** Explicitly stated in Step 2 to override "cash = serious" bias.  
     - **Clientelism:** Step 5 uses *convertibility* (cross-domain value) and *exclusivity* (gatekeeping) to detect harmful patterns.  
     - **Blame vs. act:** Step 4 isolates coercion from the corruption definition.  
     - **Values calls:** Limited to "local custom vs. INGO rule" conflicts (Step 4) to prevent blanket excuses.  

  2. **Distinctions dropped:**  
     - "Beneficiary vs. staff reports": Not separated—triage is identical.  
     - "Legal vs. ethical corruption": Merged into "rule/harm" test (Step 2) for speed.  
     - "Scale of harm": Quantification skipped—focus on identifiability (Step 3).  

  3. **Where it misfires:**  
     - **"No individual profit" cases:** May be over-classified as corruption (Step 2 flag alerts RD).  
     - **Collective-action flag:** Could be abused to justify inaction—countered by requiring "process change" recommendation (Step 6).  
     - **Clientelism test:** May miss low-frequency patterns. Mitigation: Only triggered if Step 1 pattern flag is set.  

  4. **Values calls:**  
     - Required only for **Step 4** (blameworthiness with "local custom" defense).  
     - **Signed by:** Regional Director (with HQ consultation if donor impact possible).  

  ---

  ### **CASE APPLICATIONS**  
  *Output: Signed triage records for RD*  

  #### **Case 1: Enumerator accepted chicken, then helped household qualify**  
  **Step 1:** Enumerator accepted chicken for registration; later assisted same household to qualify. Pattern: Routine gifts (eggs/chickens) to enumerators.  
  **Step 2:** ✔️ **Corruption (favoritism).** Currency-neutral: Chicken = cash if it bought advantage. Harm: Unfair exclusion.  
  **Step 3:** Harm: Excluded households (identifiable: **Low**—specific beneficiaries unknown).  
  **Step 4:** **Blameworthy.** Refusing chicken was possible (head office said "accept," not "return favor").  
  **Step 5:** ❌ No pattern (single act).  
  **Step 6:** **Recommendation:** Sanction enumerator (training/warning); change process (ban post-registration gifts).  
  **Record:**  
  > Step 1: Enumerator took chicken post-registration, later helped donor qualify. Pattern: Routine small gifts.  
  > Step 2: Corruption (favoritism). Currency-neutral.  
  > Step 3: Harm: Exclusion of others. Identifiability: Low.  
  > Step 4: Blameworthy.  
  > Step 5: No clientelism.  
  > Step 6: Sanction staff; change gift policy.  
  > *RD Sign-off:* _______________  

  *Articulated distinction:* The "help" after the gift converted a neutral act (accepting chicken) into corruption by creating an unfair advantage. Step 2 captures this via the "advantage + harm" test.  

  ---  

  #### **Case 2: $12 paid to customs clerk for delayed therapeutic food**  
  **Step 1:** Logistics asst. paid $12 to release legally cleared food after 9-day delay. Self-reported.  
  **Step 2:** ✔️ **Corruption (bribery).** Currency-neutral: $12 = goat/job. Harm: Undermines rule of law. Flag: No individual profit (food reached beneficiaries).  
  **Step 3:** Harm: Systemic corruption (identifiable: **Low**). Collective-action flag: ✔️ (Refusal risks program; practice continues).  
  **Step 4:** **Not blameworthy.** No alternatives after weeks of effort; acted to save lives.  
  **Step 5:** ❌ No pattern.  
  **Step 6:** **Recommendation:** No sanction; change process (negotiate customs MoU with other NGOs); report upward if systemic.  
  **Record:**  
  > Step 1: $12 paid for customs release of cleared food. Self-reported.  
  > Step 2: Corruption (bribery). No individual profit.  
  > Step 3: Harm: Rule of law erosion. Identifiability: Low. Collective-action: Yes.  
  > Step 4: Not blameworthy.  
  > Step 5: No clientelism.  
  > Step 6: No sanction; change process.  
  > *RD Sign-off:* _______________  

  ---  

  #### **Case 3: Land, jobs, and favors via chief’s family and fixer**  
  **Step 1:** Pattern: Land from chief (free); daughter hired over better candidates; subcontracts/medical/school fees routed through fixer (party official).  
  **Step 2:** ✔️ **Corruption (nepotism, conflict of interest).** Hiring harmed excluded applicants (identifiable: **High**—the 40 applicants). Land: No individual profit (benefit to program).  
  **Step 3:** Harm: Exclusion of job applicants (identifiable: High); program politicization (identifiability: Low).  
  **Step 4:** **Values call to RD.** "Local custom" defense (staff say "we owe him") vs. INGO fairness rules.  
  **Step 5:** ✔️ **Clientelism.** Convertibility: Fixer’s influence (land, contracts) bought access to jobs/school. Exclusivity: "Only fixer gets things done."  
