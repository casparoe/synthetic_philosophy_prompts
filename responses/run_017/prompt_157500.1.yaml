answer: |-
  This is an exceptionally sharp observation of a profound psychological and social mechanism. You've identified a genuine conceptual gap: a phenomenon that sits at the intersection of identity formation, performativity, self-concept maintenance, and social expectation. Let's break it down.

  **The Core Mechanism: Constitutive Avowal or Identity-Performance Loop**

  The configuration you describe lacks a single, universally accepted term, but several established concepts capture facets of it. The most fitting descriptions emphasize its **constitutive** nature:

  1.  **Identity-Constitutive Commitment (Philosophy/Psychology):** Drawing on thinkers like Harry Frankfurt (on "caring" and identity) and Charles Taylor (on "strong evaluation"), this highlights how declaring a trait ("I am X") isn't just reporting a fact, but making a *commitment* to being X. This commitment then shapes future choices, interpretations of experience, and effort allocation, actively *constituting* and *maintaining* the identity it proclaims. It becomes a core part of "who I am."
  2.  **Performativity (Sociology/Philosophy - Judith Butler):** Butler's concept (developed for gender/identity categories) argues that identity isn't just expressed through actions but is *constituted* by repeated performances. Saying "I am the calm one" *is* an act that reinforces and recreates the "calm one" identity within the social field. The avowal *does* something; it enacts the identity it names.
  3.  **Self-Concept Maintenance / Cognitive Consistency (Psychology):** Theories like Cognitive Dissonance or Self-Perception Theory suggest people are motivated to maintain consistency in their self-concept. Avowing "I am not mathematical" creates cognitive pressure to align behavior and interpretations of ability with that statement (avoiding math, interpreting struggles as proof, downplaying successes). The avowal sets a schema that filters experience.
  4.  **Constitutive Double Bind (Anthropology/Sociology):** Your example highlights a loop: The avowal justifies the behavior/inaction, which reinforces the trait, which justifies the avowal. This creates a self-sustaining system where the statement about identity *creates the conditions for its own truth*, binding the individual within that identity.
  5.  **Role Engulfment (Sociology):** Particularly relevant to your "calm one" example. When an externally assigned role (the calm sibling) is internalized, it can "engulf" the self-concept, making other behaviors (anger) feel incongruent and threatening to the core identity.

  **Why Standard Concepts Don't Fit Perfectly:**

  *   **Self-Fulfilling Prophecy:** Correctly identified as distinct. SFP predicts a *future outcome* (e.g., "I'll fail this test" -> anxiety -> failure). Your case involves maintaining/reinforcing a *present/persistent state of being* (mathematical incapacity, calm temperament) through ongoing constitutive acts prompted by the avowal itself. It's about *being*, not *becoming* or *achieving* a specific future event.
  *   **Sartrean Bad Faith:** Your sense is astute. Bad faith involves *denying* freedom and responsibility, hiding behind a supposedly fixed "essence" ("I *am* cowardly, so I *had* to run"). In your cases:
      *   There's often no *denial* of freedom in the moment (your friend *could* try math, the calm one *could* get angry), but the identity commitment *makes acting otherwise feel existentially costly* ("If I do math/get angry, I cease to be *me* as I understand myself").
      *   There's no *falsehood* or *hiding* – the avowal feels authentic. The person genuinely *lives into* the identity.
      *   **Crucial Nuance:** The *absence* of a lie *might* be the mechanism's most refined form. It's not hiding from freedom *in bad faith*; it's *authentically exercising freedom to choose and maintain an identity* that then *constrains future expressions of freedom* without explicit denial. It's a form of *chosen essence* that feels necessary. Sartre might see this as a sophisticated, perhaps inevitable, form of bad faith where one freely chooses to be unfree in specific domains by solidifying an identity. Others argue it's simply how identity works.

  **Pinning Down the Edges:**

  1.  **Firm Organic Basis (e.g., Clinical Depression, Neurodivergence):**
      *   **Change:** The avowal ("I am depressed," "I am autistic") doesn't *create* the core biological reality. However, it *still* plays a constitutive role:
          *   It shapes *interpretation* of experiences through that lens.
          *   It influences *coping strategies* and help-seeking (or avoidance).
          *   It affects *social interactions* and expectations.
          *   It can lead to **Secondary Gain** or **Sick Role** reinforcement, where the identity itself provides stability or excuses, potentially hindering change even when biologically possible.
          *   The loop is present, but the *starting point* and *degree of malleability* differ significantly. The avowal reinforces the *experience* and *social presentation* of the trait, but not necessarily the core biological underpinnings.

  2.  **Socially Enforced Avowal (vs. Chosen):**
      *   **Change:** Power dynamics become central. The avowal might be coerced (explicitly or implicitly), performative for survival/acceptance, or internalized under pressure.
          *   **Coercion:** The person may avow it without belief, creating dissonance and potential resentment (closer to bad faith or alienation).
          *   **Internalization under Pressure:** The external label becomes self-concept ("They keep saying I'm the clumsy one... I guess I am"). The constitutive loop operates, but initiation was external. This overlaps heavily with **Labeling Theory** in sociology (deviance) and **Stereotype Threat** (where awareness of a negative stereotype impacts performance).
          *   The *agency* in the avowal is diminished or externally directed. The constitutive effect may feel imposed rather than chosen.

  3.  **Unwilling Avowal:**
      *   **Change:** This introduces conflict and suffering. The person recognizes the trait ("Yes, I *am* prone to anger") but *disidentifies* with it ("...but I hate it, it's not *me*"). The avowal isn't identity-constitutive in the same way; it's often a painful admission.
          *   The loop is disrupted. The avowal doesn't reinforce the trait through commitment; it might motivate change *against* the trait ("I am angry, but I don't want to be, so I'll work on it").
          *   This is closer to simple acknowledgment or even the *starting point* for therapeutic change, lacking the self-reinforcing "double bind" element of the willing avowal.

  **Distinguishing Self-Sustained from Fixed Traits (From the Inside):**

  This is incredibly difficult due to the nature of self-perception and the constitutive loop itself. However, some potential indicators:

  1.  **Counterfactual Exploration:** Ask: "If I *truly believed* I could change this, what would I do differently?" If concrete, plausible steps emerge that feel *possible but blocked primarily by the belief itself or the identity cost*, it suggests self-sustenance. If answers involve fundamental, unchangeable barriers (severe biological impairment, irreversible structural constraints), it leans towards fixedness.
  2.  **Narrative Flexibility:** How rigid is the story? Can the person imagine alternative narratives where this trait isn't central or defining? Can they recall exceptions or contexts where the trait wasn't dominant? Rigidity suggests stronger constitutive identity binding.
  3.  **Emotional Cost of Challenge:** What happens internally when they *try* to act against the trait? If it triggers intense anxiety, inauthenticity, or existential threat ("This isn't *me*!"), it points strongly to the trait being constitutive of their identity. Discomfort due to difficulty or unfamiliarity is different from *identity threat*.
  4.  **Origin Story Scrutiny:** Examine the *history* of the avowal. Was there a defining moment, label, or series of events that crystallized it? Does the evidence cited feel circumstantial or open to reinterpretation? A clear, socially reinforced origin story suggests construction/maintenance.
  5.  **Focus on Effort/Avoidance:** Notice patterns of effort allocation and avoidance. Does the belief *actively organize* their life to avoid challenging the trait? Does practicing the trait feel existentially wrong or futile *because* of the belief? This is key to the self-sustaining loop.
  6.  **The "Cost" Question:** What would be *lost* if this trait changed? If the answer involves core identity ("I wouldn't be *me*"), relationships ("My family relies on me being the calm one"), or a sense of stability/explanation, it indicates constitutive identity binding. If the "cost" is primarily effort or facing difficulty, it's less about identity.

  **Conclusion:**

  You've pinpointed a powerful mechanism best described as **Constitutive Avowal** or an **Identity-Performance Loop**. It works through **identity-constitutive commitments** and **performativity**, creating a **constitutive double bind** where the avowal actively maintains the reality it reports. It differs from SFP by focusing on persistent states of being, and from Sartrean Bad Faith by its lack of overt falsehood and hiding – though the *authentic embrace* of a constraining identity might represent its most insidious form. Factors like organic basis, social enforcement, and willingness significantly alter the dynamics. Distinguishing self-sustained from fixed traits internally is fraught but involves examining counterfactuals, narrative flexibility, emotional cost of challenge, and the perceived existential cost of change. This configuration is fundamental to understanding how identities stabilize, sometimes beneficially, sometimes as invisible cages.
