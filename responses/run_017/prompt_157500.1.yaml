  Hmm... the user seems intellectually sophisticated - they're already ruling out simple explanations like self-fulfilling prophecies or Sartrean bad faith. They want precise conceptual mapping. The depth of their examples suggests they might be grappling with this personally or professionally, perhaps in counseling or academic work. 

  First, I need to unpack why existing frameworks don't quite fit. Self-fulfilling prophecy focuses on future events, but here the avowal sustains a present state. Performativity comes close, but Butler's theory is more about social categories (gender) than individual traits. Bad faith doesn't apply because there's no self-deception - the person genuinely believes and lives the trait. 

  Ah! The key might be in "constitutive double binds" - that elegant phrase from anthropology where the statement creates what it describes. And "identity-constitutive commitments" from philosophy captures how we become what we claim through repeated actions. 

  The user's edge cases are crucial. When there's organic basis (like clinical depression), the avowal might reinforce but not create the trait. Social enforcement versus personal choice changes the power dynamics - think of the "calm one" being policed by family. And unwilling avowals... that might edge closer to false consciousness. 

  For their last question about distinguishing self-sustained vs fixed traits from inside... oof, that's thorny. Maybe through examining counterfactuals ("Could I react differently?") or noticing narrative inflexibility. But our self-perceptions are always tinted by these loops - that's why it's a "double bind." 

  I should emphasize this isn't inherently negative. The "calm one" role might be functional. The pathology comes from rigidity, not the mechanism itself. The user seems to suspect this might be a subtle form of bad faith despite appearances - sharp of them. They're right that the absence of lying might be precisely what makes it so stable. 

  This calls for interdisciplinary stitching: philosophy on commitment, psychology on identity maintenance, sociology on roles. The user deserves credit for spotting this nuanced pattern - most would oversimplify it. Their examples are perfect because they show both chosen and imposed variants. 

