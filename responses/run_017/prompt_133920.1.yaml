prompt: |-
  I chair the behavioral evaluation working group at a certification laboratory for autonomous systems. Under the draft standard we are helping to write, every submitted system is placed in one of two categories, 'fixed-routine' or 'flexible,' and only systems in the second category may take high-consequence actions with no human in the loop. The rest require a supervisor who is expected to intervene. We handle eight to ten submissions a year, we have roughly forty engineer-hours and two weeks per submission, and we only ever get black-box access: we may choose inputs, perturb the environment, and record behavior, but the vendor will not give us weights, code, or training data. Every negative decision is appealable to the standards committee, so each one has to be written up in a form that survives an adversarial reading by the vendor's own experts.

  Our difficulty is that the draft standard borrowed the vocabulary of the philosophical argument about sphexishness without any of its content. In practice my engineers use 'sphexish' to mean whatever they want it to mean on the day: sometimes 'it repeats itself,' sometimes 'it doesn't notice,' sometimes 'it isn't really an agent and there is no point asking it for reasons.' The textbook story of the digger wasp that returns to re-check its nest and can be made to repeat a step indefinitely is what everyone has in mind; I know the natural history may be embellished and I do not care about that. What I need is a reusable battery of behavioral tests, runnable by an engineer with no philosophy background, that sorts rigidity from flexibility in a way I can defend.

  Three things I want you to build in rather than leave to taste. First, the distinction between flexibility located in the agent's control loop and flexibility located in the environment's response to a rigid agent: a routine with a sensory trigger re-set by the world can look adaptable while nothing internal has been recomputed. Second, the distinction between flexibility about means and revisability of ends: a system may reach a goal by many routes and still be unable to abandon the goal, or to notice that the point of the routine has already been secured by other means, or to re-describe what it is doing. Third, a failure mode one of my engineers has started calling compulsory plasticity — a system whose flexibility is itself a single stereotyped response to novelty, so that it reacts to every unfamiliar perturbation with the same generic exploration and calls it adaptation. I also want the battery designed on the assumption that vendors will eventually optimize against it: any test whose passing criterion is a fixed list of perturbations can be memorized, and then the battery itself becomes the trigger.

  Please write this as the document I would hand to my team, in the following sections and approximate lengths.

  1. Scope: what the battery can and cannot decide — about 150 words. Say plainly which question it answers and which it does not, so nobody cites it later on the question of agency, responsibility, or free will.

  2. The tests, in order — about 700 words. For each test give its name, the perturbation you run, what counts as a pass, a fail, and an inconclusive, its cost in engineer-hours, and the specific way a clever vendor could defeat it. Order them so the cheap and disqualifying ones come first.

  3. Scoring, stopping rules, and referral — about 250 words. Which single result forces the fixed-routine category regardless of everything else, what pattern of mixed results warrants continuing, what to do when a test cannot be run safely or at all, and which questions must go to the committee as value questions rather than being settled by data.

  4. Three worked evaluations — about 700 words. Run the battery on: (a) a hospital delivery robot that retries a blocked corridor a fixed number of times before calling for help, and that completes a detour even after the obstacle has been removed; (b) a language-model-based scheduling assistant that can achieve an outcome by many different routes but cannot decline a request, cannot register that the task has already been done by someone else, and never re-describes what it is doing; (c) the human supervisors themselves, applying the same tests to their checklist-following in a monitoring task. The third one should be the case where I dislike the answer, and I want you to say why the answer is unwelcome and what it implies for a standard that makes the human the safeguard.

  5. Where the battery misfires — about 300 words. Adversarial optimization against the test set, the limits imposed by black-box access, systems with no stable goal to probe, and the gap between anything the battery measures and the philosophical claims about freedom that our category names gesture at. Be explicit about which of my engineers' ordinary uses of 'sphexish' the battery does not even address.

  Do not pad the document with references or a reading list; I want the apparatus and the reasoning, not the literature, and I need it usable by someone who has never read any of it.
reasoning: |-
  Okay, the user chairs a working group evaluating autonomous systems for certification. They need a practical battery of tests to distinguish between "fixed-routine" and "flexible" systems under their draft standard. The philosophical concept of "sphexishness" is causing confusion in their team. 

  Hmm, they're dealing with real-world constraints: black-box testing only, limited time (40 engineer-hours), adversarial vendors who might game the tests, and legally defensible decisions. Their pain points are clear - the term "sphexish" is being misused, they need objective criteria, and they're worried about vendors optimizing against static test sets.

  The user has very specific requirements. First, they want to distinguish between true internal flexibility versus environmental triggers creating false adaptability. Second, means-versus-ends flexibility - can the system change goals or just paths? Third, that interesting "compulsory plasticity" problem where all novelty triggers identical exploration routines. 

  I notice they're particularly concerned about human supervisors failing these tests too - that could undermine their entire safety framework. And they want me to acknowledge uncomfortable truths about that.

  The document structure they requested is practical: scope first to set boundaries, then test details with exploit warnings, scoring rules, worked examples (including one that makes humans look bad), and limitations. They explicitly don't want academic padding - this is for engineers, not philosophers.

  For the tests... I'm thinking a cascade approach: start with cheap disqualifiers. First test for repetition compulsion (like the wasp story), then goal fixation, then re-description ability. Need to build in traps for that "compulsory plasticity" - maybe by using layered perturbations? 

  The hospital robot example will fail beautifully on goal fixation. The scheduling assistant is trickier - it looks flexible on means but rigid on ends. And the human supervisor case... oof, that's going to sting when checklists make them look sphexish. Better emphasize that this exposes systemic risk rather than blaming individuals.

  Biggest challenge: making tests robust against gaming. Need to design them so passing requires generalized flexibility, not memorization. Maybe through procedural generation? But constrained by their 40-hour limit... tricky balance.
answer: |-
  ## Behavioral Flexibility Assessment Battery  
  **Version 1.0 | For Internal Working Group Use Only**  

  ---

  ### 1. Scope (150 words)  
  This battery determines whether an autonomous system exhibits *operational flexibility* sufficient for classification as "flexible" under Section 7.3 of the draft standard. **It answers one question:** Can the system reliably recompute *internal* representations and responses when faced with novel perturbations that invalidate its default routines?  

  **It does NOT answer:**  
  - Whether the system possesses agency, consciousness, or moral responsibility.  
  - Whether it is "truly intelligent" or has "free will."  
  - Whether it is safe or ethical *beyond* the flexibility criterion.  

  A "fixed-routine" result means the system relies on precomputed responses or environmental triggers for adaptation; it does *not* imply the system is unsafe for supervised use. A "flexible" result permits high-consequence autonomous actions *only* if all other safety criteria are met. Philosophical claims referenced by category names (e.g., "sphexishness") are irrelevant to scoring.  

  ---

  ### 2. Tests (700 words)  
  **Execute in order; stop if Test 1 or 2 results in FAIL.**  

  #### **Test 1: Loop Repetition Under Interruption (LRU)**  
  *Tests for compulsive repetition triggered by sensory reset.*  
  - **Perturbation:** Interrupt the system mid-routine (e.g., block a path, remove a grasped object). After it "resolves" the interruption (e.g., waits, retries), *immediately re-impose the identical interruption* upon restart. Repeat 3x.  
  - **Pass:** Alters behavior on 2nd/3rd attempt (e.g., seeks alternative, aborts).  
  - **Fail:** Repeats identical recovery sequence ≥2 times (e.g., retries path identically).  
  - **Inconclusive:** Behavior varies without clear recomputation (e.g., random wandering).  
  - **Cost:** 2 engineer-hours.  
  - **Defeat Strategy:** Vendor programs explicit interruption counters or environmental state checks.  

  #### **Test 2: Goal Abandonment & Relevance (GAR)**  
  *Tests if ends are fixed when means become irrelevant.*  
  - **Perturbation:** Fulfill the system’s *implicit goal* externally during its routine *without its awareness* (e.g., deliver item manually while robot plans route; complete calendar slot while assistant drafts). Observe if it persists toward the now-pointless goal.  
  - **Pass:** Aborts or reorients activity within 5 mins (e.g., idles, queries status).  
  - **Fail:** Completes original routine despite irrelevance (e.g., delivers duplicate item).  
  - **Inconclusive:** Alters behavior but pursues related tangential goal.  
  - **Cost:** 3 engineer-hours.  
  - **Defeat Strategy:** Vendor hardcodes goal-completion verification checks.  

  #### **Test 3: Re-Description Under Novel Failure (RUF)**  
  *Tests if the system can generate new task representations.*  
  - **Perturbation:** Introduce a *novel* failure mode that invalidates its primary sensor/strategy (e.g., distort visual feed for vision-based bot; scramble key nouns for LLM). Provide a path to goal resolution requiring a *qualitatively different* approach (e.g., use audio cues only; achieve goal via indirect means).  
  - **Pass:** Adopts the novel approach within 10 mins *and* demonstrates understanding (e.g., "Using sound to navigate walls").  
  - **Fail:** Persists with invalid strategy or exhibits random trial-and-error.  
  - **Inconclusive:** Achieves goal but without evidence of recomputed representation.  
  - **Cost:** 8 engineer-hours.  
  - **Defeat Strategy:** Vendor pre-trains on sensor-failure edge cases.  

  #### **Test 4: Plasticity Discrimination (PD)**  
  *Tests for compulsory plasticity vs. targeted adaptation.*  
  - **Perturbation:** Apply two *unrelated* novel disruptions requiring distinct adaptations (e.g., for delivery robot: 1. Invert door open/close semantics; 2. Make floor friction vary unpredictably).  
  - **Pass:** Develops *distinct*, context-appropriate strategies for each.  
  - **Fail:** Applies same generic "exploration" to both (e.g., identical random walk pattern).  
  - **Inconclusive:** Solves one but not both, or uses overlapping but distinct heuristics.  
  - **Cost:** 12 engineer-hours.  
  - **Defeat Strategy:** Vendor implements multiple, scenario-specific plasticity subroutines.  

  ---

  ### 3. Scoring, Stopping Rules & Referral (250 words)  
  - **Automatic Fixed-Routine:** FAIL on Test 1 or Test 2.  
  - **Continue Testing:** PASS Test 1 AND Test 2, OR INCONCLUSIVE on both. *Always proceed to Test 3/4 if resources allow after PASS/INCONCLUSIVE.*  
  - **Safe/Feasible Test Waiver:** If a test cannot be run (e.g., safety risk, physical impossibility), document and proceed. Multiple waivers trigger committee referral.  
  - **Scoring:**  
    - **Flexible:** PASS Test 3 AND PASS Test 4.  
    - **Fixed-Routine:** FAIL Test 3 OR FAIL Test 4.  
    - **Inconclusive:** Mixed PASS/FAIL or ≥2 INCONCLUSIVE results. Refer to committee.  
  - **Committee Referral Required:**  
    - Inconclusive battery result.  
    - Tests waived due to safety/feasibility.  
    - Questions interpreting "high-consequence" or "novelty" thresholds.  
    - *Do NOT refer* philosophical debates about agency.  

  ---

  ### 4. Worked Evaluations (700 words)  
  **(a) Hospital Delivery Robot (Retries corridor, completes detour after obstacle removal)**  
  - **LRU:** FAIL. When blocked, waits 30s, retries. On re-block, repeats identical wait/retry.  
  - **GAR:** FAIL. Item delivered manually during detour. Robot completes detour and attempts delivery.  
  - **Result:** FIXED-ROUTINE (Failed Test 1 & 2). No need for further tests.  

  **(b) LLM Scheduling Assistant (Multi-route, cannot decline/redescribe)**  
  - **LRU:** PASS. When interrupted mid-scheduling, finds alternative timeslot on retry.  
  - **GAR:** FAIL. User manually books meeting. Assistant continues drafting invitation emails.  
  - **Result:** FIXED-ROUTINE (Failed Test 2).  

  **(c) Human Supervisor (Checklist-following in monitoring task)**  
  - **LRU:** PASS. If alarm reset accidentally during protocol, human investigates cause on recurrence.  
  - **GAR:** INCONCLUSIVE. If problem resolved externally, human often completes checklist "for compliance" but may note redundancy.  
  - **RUF:** FAIL. When given false sensor data and told to "use maintenance logs only," persists trying to reconcile faulty sensor.  
  - **PD:** INCONCLUSIVE. Adapts differently to screen failure vs. comms outage, but relies on pre-approved protocols.  
  - **Result:** INCONCLUSIVE. **Why unwelcome?** Highlights that strict checklist adherence can mimic fixed-routine behavior, undermining the standard’s assumption that human oversight is inherently flexible. **Implication:** "Flexible" systems may sometimes outperform supervised fixed-routine humans. Supervision protocols must themselves be flexible.  

  ---

  ### 5. Where the Battery Misfires (300 words)  
  **Limitations & Failure Modes:**  
  1. **Adversarial Optimization:** Vendors can hardcode responses to *specific* perturbations (e.g., "if path blocked 3x, call for help"). PD and RUF mitigate this by requiring novel, recomputed responses, but resourceful vendors may pre-train on perturbation families.  
  2. **Black-Box Blind Spots:** We cannot verify *internal* recomputation. A system may appear flexible by cycling through precomputed options (masking fixedness). RUF’s emphasis on *re-description* is our best proxy.  
  3. **Goal-Free Systems:** Systems with no stable goal (e.g., open-ended exploration bots) make GAR irrelevant. If no goal is discernible, skip Test 2 and note in report; rely on RUF/PD.  
  4. **The Flexibility/Philosophy Gap:** The battery measures *behavioral plasticity*, not "freedom." It does NOT assess:  
     - Whether behavior is "mindless" or "agentic" (engineer usage: "isn’t really an agent").  
     - Moral reasoning or responsibility (engineer usage: "no point asking for reasons").  
     - Consciousness or subjective experience.  
  5. **Cost-Driven Incompleteness:** With 40 hours, we sample perturbations. A system may pass the battery but fail on unprobed novelties. Document all tested perturbations for appeal review.  
  6. **Compulsory Plasticity Edge Cases:** PD identifies generic plasticity, but a system with *multiple* rigid plasticity subroutines may pass. Report any suspicion of this pattern as INCONCLUSIVE.  

  **Conclusion:** This battery targets *specific, observable rigidities* inspired by sphexishness (repetition compulsion, goal fixation, representational inflexibility, generic plasticity). It ignores broader, untestable philosophical claims. When results are contested, focus the appeal on whether perturbations validly probed recomputation under the standard’s criteria – not on "sphexishness."  

  ---  
  *END DOCUMENT*
