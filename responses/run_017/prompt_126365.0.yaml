   The updateless decision theorist says, "Of course not. But when I chose my policy, I didn't know which Thursday I would be here. My policy says: 'On any Thursday you dine, file for this Thursday and next Thursday.' In the counterfactual where I am here next week, I would want to have filed in advance. And since the policy has to be the same for every Thursday in the ensemble, I have to file for next Thursday now."

   The causal decision theorist shakes his head: "You could have just filed for next Thursday when you come next Thursday."

   The updateless decision theorist looks puzzled: "But then the policy wouldn't be the same. In the branch where I come next Thursday, I would have to file then, but in this branch I didn't file in advance for this Thursday until I arrived. That would be a different policy. This way, it's uniform."

   He then adds, "Besides, in the simulation for next Thursday, they would have simulated me filing at the policy window next Thursday, but now that I've filed today, they'll simulate the policy instead, which is more predictable."

   Notes to defend the mechanism:

   - UDT chooses a policy from the prior, which is a mapping from observations (which Thursday it is) to actions. The policy includes: "Whenever it is a Thursday and I am at the restaurant, file a policy that says 'always pay' for this Thursday and also for the following Thursday." 
   - This policy is evaluated from the prior: it has a cost of $2 extra in weeks where the agent dines and is not returning the next week, but it saves the $2 filing fee and ensures consistency in weeks where the agent does return the next week (because then the policy is already filed). If the probability of dining next Thursday is high enough, the expected utility might be higher.
   - The agent, in the actual branch, has observed that it is this Thursday and that it will not be here next Thursday. But it does not condition on this when choosing the policy; it is following the policy chosen from the prior. The policy says to file for this Thursday and next Thursday whenever dining on a Thursday, so it does so.
   - The point about the simulation for next Thursday: if the agent were to dine next Thursday and file then, the simulation for that night would be of the agent (because at the time of simulation, the policy might not be filed yet) and might be unpredictable. By filing in advance, the simulation is of the policy, which is known to pay. This might be a benefit in the branch where the agent dines next Thursday.

   This should be defensible.
