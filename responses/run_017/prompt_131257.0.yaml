  Dear — I am a high school senior doing an independent reading project on philosophy of mind with one of my teachers, and I need help settling an argument with my older brother, who is in a neuroscience PhD programme and regards philosophy of mind as mostly what you do before you have data. We agree on the starting point: the standard multiple-realizability argument gives us good reason to deny that mental kinds like pain or belief are identical with neural kinds, since creatures built out of very different hardware could in principle share our functional organisation. We disagree about where that leaves the science of psychology. My brother thinks the argument overreaches: if pain is whatever occupies a certain causal role, and that role can be filled by wildly different physical states, then pain is not one kind but a long and open-ended disjunction, and disjunctive kinds, he says, cannot figure in genuine laws, cannot ground prediction across instances, and cannot be the categories of a serious science — so psychology will either end up talking about neurons or stop being a science at all. I think some version of functionalism survives this, and that the disjunction worry only bites if the level of description is fixed in the wrong place.

  The case I invented to press him, which he did not have a good answer to, is what I call the Twin-Realizer finding. Suppose neuroscientists discover that in ordinary adult humans the causal role we associate with pain is performed twice over, in parallel, by two structurally and chemically quite different mechanisms — say a fast pathway and a slow pathway — such that either one can be disabled while pain behaviour and pain report survive, while disabling both abolishes them. Then the very same mental kind, in the very same creature at the very same time, has two quite different realizers. Is that a bonus for the multiple realizability argument, because it shows realization is promiscuous even inside a single skull, or is it trouble for functionalism, because the role now looks too coarse to capture what the subject is actually undergoing — and what if, with both pathways intact, subjects asked to compare report that the two varieties feel subtly unlike one another? My brother also presses a second objection I cannot shake: that the multiple realizability claim is grain-relative, so that if you specify the role finely enough to be psychologically interesting nothing else realizes it, while if you specify it coarsely enough to be multiply realized, thermostats and heating systems realize it too.

  So I want a number, and I want to see how you arrived at it. Take the proposition to be this: fifty years from now, the most successful predictive and explanatory science of minded systems will individuate the states it quantifies over in multiply-realizable functional terms rather than in the vocabulary of whatever physical stuff happens to realize them. Give me your credence in that proposition, decomposed. At minimum I want separate probabilities for: some version of functionalism being true of the core mental kinds; the multiple realizability claim itself holding at whatever grain a working science would actually need; the disjunctive-kinds and causal-exclusion worries being answerable well enough for multiply-realizable kinds to still support laws; the Twin-Realizer scenario, if it turned out to be actual, counting in favour of functionalism rather than against it; and the merely institutional question of whether neuroscience, given its instruments and funding, will drift toward a neural vocabulary even if the functionalist is right. Add or reject any term you think I have got wrong, say how the terms combine into the headline number, and tell me which term that number is most sensitive to and what single finding would move it most. For context, I sit around 0.7 and my brother around 0.25, and I would like to know where you think the real disagreement between us is hiding.

  Please reply as a single JSON object with exactly these fields: "headline_credence" (a number between 0 and 1); "confidence_in_that_number" (a short phrase about how firm the number itself feels); "terms" (an array of objects, each with "name", "probability", "role" (how that term enters the combination), and "justification" (one sentence)); "combination_method" (a few sentences on how the terms were combined and whether they can be treated as independent); "arithmetic_check" (the headline number restated and whether it is consistent with the terms given); "most_sensitive_term" (the name of one term); "what_would_move_it_most" (one or two sentences); "twin_realizer_verdict" (whether the case helps or hurts functionalism, and why); "grain_objection_verdict" (whether my brother's grain-relative worry is fatal, serious, or answerable); "terms_added_or_rejected" (anything you added or think I mis-specified); "where_the_disagreement_lives" (one or two sentences on the gap between 0.7 and 0.25); and "one_sentence_for_my_teacher" (the whole verdict in a single sentence). Keep every field short: no field longer than three sentences.
