  ### Core Handout: Advance Directive Authority Decision Tree  
  *For Clinical Ethics Trainees*  

  **Introduction**  
  This decision tree starts from one commitment: *a competently executed advance directive (AD) should normally be followed*. It branches through concrete clinical dilemmas to reveal your underlying stance on the authority of the patient’s earlier self. Answer each question based on what you believe should be done in the scenario, not abstract theory.  

  ---

  #### Branch Questions  
  1. **Asymmetry (Refusal vs. Request):**  
     *A patient’s AD requests full life-sustaining treatment in terminal illness. Providing it would prolong suffering without benefit. Must we comply?*  
     - **Yes**: Requests and refusals are equally binding.  
     - **No**: Only refusals bind; requests are advisory.  

  2. **Fit Problem:**  
     *An AD refuses "aggressive measures if in a vegetative state." The patient now has advanced dementia (not vegetative), enjoys simple pleasures, and needs easily treatable pneumonia. Antibiotics are low-burden. Must we withhold antibiotics?*  
     - **Yes**: AD applies despite unforeseen circumstances.  
     - **No**: Authority decays if the situation isn’t precisely envisaged.  

  3. **Sovereignty vs. Evidentiary Role:**  
     *Claim: "We must follow an AD even if we have proof the patient would recant it today." Do you accept this?*  
     - **Accept**: Binding as an autonomous act (sovereignty).  
     - **Reject**: Only evidence of current wishes (evidentiary).  

  4. **Identity/Psychological Continuity:**  
     *An AD refusing treatment was signed when the patient valued independence. Now with advanced dementia, they are passive and content, with no trace of past values. Must we follow the AD?*  
     - **Yes**: Authority persists despite psychological change.  
     - **No**: Authority requires continuity of values or identity.  

  5. **Instruction vs. Delegation:**  
     *An AD names a proxy and instructs "no dialysis if demented." The proxy, using substituted judgment, requests dialysis. Whose decision prevails?*  
     - **AD instructions**: Written rules bind.  
     - **Proxy**: Designated surrogate has final authority.  

  6. **Tainted Source:**  
     *An AD refusing costly treatment was signed while the patient managed family finances under pressure. Without pressure, they would likely want treatment. Must we follow it?*  
     - **Yes**: Valid unless formally revoked.  
     - **No**: Discount if values were distorted by external pressure.  

  ---

  #### Logical Space & Positions  
  *6 questions → 64 possible combinations. Only 15 are coherent (e.g., accepting sovereignty (Q3) requires honoring ADs despite fit (Q2) or identity changes (Q4)). Occupied positions:*  

  | Leaf | Position (Label) | Core Principle | Awkward Commitment |
  |------|------------------|----------------|---------------------|
  | 1 | **Pure Welfare** | Only current well-being matters; ADs have no moral authority. | Must override an AD if it conflicts with comfort—even if the patient’s past self deeply endorsed it. |
  | 2 | **Evidentialist** | ADs reflect what the patient *would now want*; override with better evidence. | May ignore an AD based on weak signs of changed preferences (e.g., fleeting remarks). |
  | 3 | **Delegationist** | ADs primarily authorize a proxy; instructions are advisory. | Proxy can contradict clear written instructions without justification. |
  | 4 | **Narrative Identity** | ADs protect the patient’s "life story" and critical interests. | May impose suffering on a contented patient to honor past values (e.g., withholding care from a smiling dementia patient). |
  | 5 | **Sovereignty** | ADs bind as exercises of past autonomy; respect requires compliance. | Must follow ADs even if the patient would recant and it causes anguish. |
  | 6 | **Stable Change** | Past self rules unless values change *reflectively* while competent. | May override an AD for a transient change, risking disrespect to the patient’s enduring values. |
  | 7 | **Deflationary** | ADs allocate decision-rights procedurally (reduce disputes/legal risk). | Must follow an AD even when morally harmful to avoid institutional liability. |
  | 8 | **Asymmetric Binding** | Only refusals bind; requests do not (prevents harm/nonbeneficial care). | May deny treatment matching current welfare if requested by AD. |
  | 9 | *Unnamed* | ADs bind only if psychological continuity persists (rejects Q4 "Yes"). | Incoherent with sovereignty (Q3 "Accept"): if continuity is essential, past autonomy cannot bind a discontinuous self. |

  ---

  #### Diagnostics  
  1. **Unoccupied Combinations & Verdicts:**  
     - *Sovereignty + Fit Decay (Q3 Accept + Q2 No)*: Incoherent. If ADs bind as autonomous acts, they can’t dissolve in unforeseen situations.  
     - *Evidentiary + Identity Persists (Q3 Reject + Q4 Yes)*: Unattractive. If authority rests on predicting current wishes, psychological discontinuity voids the AD.  
     - *Pure Welfare + Tainted Discount (Q1 Any + Q6 No)*: Unexplored. Discounting "tainted" ADs implies moral weight to past autonomy—contradicting welfare-only focus.  

  2. **Indistinguishable Leaves (Extra Question Needed):**  
     - *Delegationist vs. Evidentialist*: Both often defer to proxies. **Separator**: *Must a proxy’s decision align with the AD’s values?* Delegationist: No (proxy has independent authority). Evidentialist: Yes (proxy interprets current wishes).  
     - *Sovereignty vs. Deflationary*: Both follow ADs strictly. **Separator**: *Is compliance morally obligatory, or just prudent?* Sovereignty: Moral duty. Deflationary: Risk management.  

  3. **Branch Discriminatory Power:**  
     - **Most Decisive**: Q3 (Sovereignty/Evidentiary). Splits tree into irreconcilable camps: autonomy as sacred vs. practical.  
     - **Least Discriminatory**: Q5 (Instruction/Delegation). Most positions (except Delegationist) favor instructions; proxies rarely override ADs in practice.  

  ---

  **Final Note**  
  This tree forces clarity: your responses to concrete cases reveal foundational beliefs about personal identity, autonomy, and moral authority. Revisit it when cases challenge your consistency.
