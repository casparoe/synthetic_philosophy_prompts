  We assume that the agent's update rule is public and deterministic in the publicly observable signal.

  We will set up a scenario in an institutional setting (e.g., a forecasting platform) with an event A and a signal S that is informative about A.

  To keep it simple, we assume:
  - The event A is a binary event: A or not-A (A^c).
