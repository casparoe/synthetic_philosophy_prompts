  The prior probability of A is P_prior = p0.

  The likelihoods are:
  - P(S1 | A) = L1
  - P(S1 | A^c) = L2

  We assume the agent's model (which might be misspecified) uses these likelihoods to compute the posterior.

  However, the agent applies shrinkage: after seeing S, they set:
    P_new = (1-α) * p0 + α * P_post(S)

  where for S1:
