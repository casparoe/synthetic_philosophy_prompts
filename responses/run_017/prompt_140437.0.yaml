  They've specified three key cases to include: the laggy duet with 400ms delay between musicians, the unbriefed choreography with strangers synchronizing without communication, and the mixed trio with humans and an AI assistant planning a party. They also want two diagnostic tests included: the silent release test about dissolving commitments, and the third-party rebuke test about who can legitimately criticize defectors.

  For the document structure, they want: 1) numbered agreed claims that are substantive (not platitudes), 2) a disagreements table with authentically stated positions from both sides, 3) analysis of the three cases with each side's predictions, and 4) a section identifying potentially verbal disagreements.

  I need to craft this carefully to be neutral ground where both could sign. For the agreed claims section, I'll focus on empirical observations both would accept (like folk psychology treating joint actions differently) while avoiding theoretical commitments. The disagreements table should use terminology each side actually employs - Priya would talk about "joint commitments" as primitive while the user would frame things in terms of "interlocking intentions."

  For the case analyses, I'll highlight where both sides predict the same outcome (like the unbriefed choreography being joint action) but differ in their explanations. The laggy duet is particularly interesting since it tests temporal responsiveness requirements. The mixed trio case pushes boundaries about agency requirements.

  In the verbal disagreements section, I'll note how "shared intention" might be used differently - as psychological state versus normative status. This could explain some disputes without substantive disagreement.

