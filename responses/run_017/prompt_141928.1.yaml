prompt: |-
  I sit on the research ethics committee of a large hospital system, and last night I had a long and unresolved argument with a friend — a health economist — about a rule our committee applies, which I can no longer tell is principled or merely a codified quirk of intuition.

  The rule works in two tiers. When a risk is what we call modelled uncertainty — we agree on the shape of the probability distribution but not on its parameters — we aggregate by averaging over our uncertainty and put the resulting single number into an ordinary expected-value test. When the risk is what we call open uncertainty — the experts cannot agree on a model at all, so there is no probability that anyone can defend, the situation of the Ellsberg urn in which you are told only that 30 of 90 balls are red and the remaining 60 are black and yellow in some unknown proportion — we stop averaging and evaluate the proposal against the worst case within the range the experts do agree on. And a known mixture is explicitly treated as ordinary risk, not as open uncertainty: if a fair coin will decide whether those 60 non-red balls are all black or all yellow, the rule tells us to treat the resulting gamble as a simple 50/50 risk and to average, even though the coin has not yet been tossed and the composition at the moment of the decision is, as a matter of fact, just as unsettled as in the urn case.

  My friend made three charges. First, that the coin case and the urn case are informationally on a par and differ only in the provenance of the numbers, so the rule presupposes that the source or precision of a probability, and not merely its value, can matter to rational choice — which she says is simply the Ellsberg finding promoted into policy, and is a description-sensitivity that counts as a bias by the lights of the very framework we use in the first tier. Second, that averaging and worst-casing differ only in the input: taking the worst case across a set of models is numerically just expected-value maximisation under the most pessimistic member of that set, so either our two tiers are not really two different attitudes, or the rule is committed to something about where the set comes from. Third, she pointed at a wider inconsistency: the law of negligence holds people responsible only for risks that were reasonably foreseeable, and informed consent requires disclosure only of known risks, so unknowable risk seems to be weighed at nothing there — while the precautionary principle, as it gets used in environmental and health regulation, does the opposite and treats the very absence of defensible probabilities as a reason to restrict.

  What I want is the implicit theory, not a verdict on our rule in the abstract. Reconstruct the view of rational choice under uncertainty that the two-tier rule presupposes, and separate what it strictly presupposes from what it merely fits well with. Does treating open uncertainty by worst case while treating modelled uncertainty by averaging commit us to ambiguity aversion being rationally permissible or even required, as opposed to a bias to be corrected? Does the known-mixture clause show that what the rule really tracks is the source or precision of a probability rather than any feature of the world — and if so, is that defensible? Is the two-tier structure a genuine departure from expected-value reasoning at all, given that worst-casing over a set of models is extensionally the same as expected-value reasoning under one pessimistic distribution, or does the departure lie elsewhere: in how the set gets fixed, in what counts as a defensible probability, in the refusal to let merely ambiguous new evidence shrink it? And are the negligence rule and the precautionary principle really in conflict, or do they presuppose consistent things once you distinguish the question of what to do from the question of whom to blame? Finally: if we abandoned the implicit view and adopted my friend's single-probability picture wholesale, what exactly in our rule, and in the wider legal and regulatory pattern, would have to change — and what, if anything, would we lose by changing it?
reasoning: |-
  Okay, the user is part of a research ethics committee and had a debate with a health economist friend about their two-tier rule for handling uncertainty. The rule distinguishes between modelled uncertainty (where they average probabilities) and open uncertainty (where they use worst-case scenarios). The friend criticized this approach, calling it inconsistent and biased. The user wants to understand the implicit theory behind their rule and its implications.

  First, I need to unpack the two types of uncertainty. Modelled uncertainty is when experts agree on the probability distribution's shape but not the parameters—like knowing a disease risk follows a certain curve but debating its parameters. Here, they average the parameters. Open uncertainty is when there's no agreement on the model at all—like the Ellsberg urn example where only partial information is known. In this case, they use the worst-case scenario.

  The friend's first criticism is that the coin flip scenario (known mixture) is treated as modelled uncertainty, while the urn scenario (unknown mixture) is open uncertainty, even though both are informationally equivalent. The friend argues this introduces a bias similar to the Ellsberg paradox, where people prefer known probabilities over ambiguous ones. The user needs to know if their rule commits to ambiguity aversion as rational or if it's just a bias.

  The second point is that worst-casing over a set of models is equivalent to expected value under a pessimistic distribution. So, is there really a difference between the two tiers, or is it just about choosing which distribution to use? This challenges whether the rule is structurally different or just a matter of input selection.

  Third, the friend points out inconsistencies with legal standards: negligence law only considers foreseeable risks, while the precautionary principle treats unknown risks as highly significant. The user wants to know if these can be reconciled under a unified theory of rational choice.

  To reconstruct the implicit theory, the rule seems to be based on epistemic modesty. Modelled uncertainty allows aggregation via averaging because there's consensus on the model structure. Open uncertainty, lacking such consensus, requires precaution. The known mixture exception treats a known random process as a definite probability, showing the rule values procedural certainty—knowing the mechanism matters, not just the outcome.

  Ambiguity aversion is presupposed as rational here, at least for open uncertainty. The rule treats ambiguity as a distinct category requiring different handling. The known mixture clause emphasizes that the source of uncertainty matters; a mechanical randomizer provides "epistemic security" that expert disagreement doesn't.

  The two tiers aren't entirely distinct in method since worst-casing is a form of expected value under a specific prior. The real departure from standard expected utility is in how the set of possible models is defined—refusing to aggregate when models are contested.

  For the legal inconsistency, negligence focuses on blame based on what was knowable at the time, while the precautionary principle guides action under current uncertainty. They address different questions: blame vs. decision-making under ignorance.

  If they switched to a single-probability approach, they'd need to aggregate all uncertainties into one distribution, removing worst-case for open uncertainty. This might lead to underestimating true risks in ambiguous situations. Legal and regulatory frameworks would need to adjust, potentially weakening precautionary measures, which could be problematic for novel risks like emerging technologies.

  The user's deeper need is to justify their committee's rule as principled rather than arbitrary. They want validation that ambiguity aversion is defensible in ethics contexts, where protecting participants is paramount. Understanding the theoretical underpinnings helps them defend the rule against criticisms and possibly refine it without abandoning its core insights.
answer: |-
  The two-tier rule you describe rests on a sophisticated view of rational choice that distinguishes between *risk* (known probabilities) and *uncertainty* (unknown probabilities), echoing Frank Knight's distinction and modern ambiguity-sensitive models. It presupposes that **the epistemic status of a probability judgment matters normatively**, not just its numerical value. Here's a reconstruction of the implicit theory, addressing your questions point by point:

  ### Core Presuppositions of the Two-Tier Rule
  1.  **Epistemic Defensibility as the Threshold:** The rule strictly presupposes that rational expected-value calculation requires a *defensible single probability model*. When experts agree on the model structure (modelled uncertainty), averaging parameters is seen as generating a defensible aggregate probability. When no consensus model exists (open uncertainty), no single probability is defensible, making expected-value calculation illegitimate. The "worst-case" approach is a procedural substitute when expected value is deemed epistemically inaccessible.
  2.  **Source Matters (The Known-Mixture Clause):** The rule presupposes that **procedural certainty can license probabilistic treatment**. A known random mechanism (the fair coin) provides an objective, defensible probability structure *even if the outcome is unknown*. This contrasts with the Ellsberg urn, where the lack of a known random mechanism *and* expert disagreement creates epistemic indeterminacy. The rule tracks the *source* (a definitive random process vs. expert disagreement) and *precision* (a well-defined distribution vs. a contested set) of the probability judgment, not just the factual state of the world. This *is* defensible within an epistemology-focused view: the coin provides "epistemic security" the urn lacks.
  3.  **Ambiguity Aversion as Rational Policy (Not Bias):** The rule **presupposes ambiguity aversion is a rationally permissible, even required, response to open uncertainty** in the ethical context of research participant protection. Treating the two tiers differently commits the rule to the view that rational choice under ambiguity differs from rational choice under risk. It elevates the Ellsberg finding from a descriptive bias to a normative principle for contexts where caution is paramount (e.g., exposing humans to unknown risks). This is a deliberate departure from strict Subjective Expected Utility (SEU) theory.

  ### Addressing the Health Economist's Charges
  1.  **"Informational Parity" (Coin vs. Urn):** The rule explicitly *rejects* informational parity in favor of *epistemic parity*. While the factual uncertainty might be similar, the epistemic justification differs. The coin's 50/50 is objectively defensible based on the mechanism; the urn's distribution is not, due to model disagreement. The rule presupposes this epistemic difference justifies different treatment. It *is* description-sensitive, but argues this sensitivity is rational given the need for defensible probabilities.
  2.  **"Averaging vs. Worst-Case are Not Fundamentally Different":** This charge has partial merit. Extensionally, worst-casing over a set of models *is* equivalent to maximizing expected utility under a specific, pessimistic prior (the one assigning probability 1 to the worst-case model). **The core departure lies not in the *calculation* but in the *epistemology*:**
      *   **Modelled Uncertainty:** The set of possible parameter values is well-defined and agreed upon. Averaging *generates* the defensible single probability for expected value.
      *   **Open Uncertainty:** The *set of possible models itself* is the defensible epistemic object. Worst-casing avoids *imposing* a single probability model where none is agreed upon. The "departure" is the refusal to aggregate across fundamentally incompatible models.
      *   **Refusal to Update Ambiguously:** A key implication is that ambiguous new evidence might *not* shrink the set of models in open uncertainty, preserving the worst-case focus, whereas in modelled uncertainty, evidence updates the (average) parameter estimate.
  3.  **"Inconsistency with Negligence & Precaution":** These principles address distinct questions, reconcilable under the implicit view:
      *   **Negligence Law (Blame/Foreseeability):** Focuses on *ex post* blame assignment. It asks: "What risks *could and should* the agent have known?" Unknowable risks ("open uncertainty" ex ante) are reasonably assigned zero weight *for blame* because they were genuinely unforeseeable. This doesn't prescribe how to *act* facing open uncertainty *now*.
      *   **Precautionary Principle (Action under Uncertainty):** Focuses on *ex ante* decision-making facing potentially catastrophic unknowns. It treats the *absence of defensible probabilities* (open uncertainty) as a reason for caution *precisely because* the risks are unknown and potentially severe.
      *   **Consistency:** The two-tier rule aligns with this distinction. For *action* (research approval, regulation), open uncertainty triggers precaution (worst-case). For *blame* (negligence), only foreseeable risks (modelled uncertainty or known risks) count. The rule presupposes that decision rules for protective action under current ignorance differ from standards for assigning blame for past actions based on past knowledge.

  ### Consequences of Adopting the Single-Probability Picture
  Abandoning the implicit view for strict SEU (one probability, always average) would necessitate significant changes:

  1.  **Changes to the Rule:**
      *   **Eliminate the Open Uncertainty Tier:** All uncertainties would be aggregated into a single subjective probability distribution, however contested the models. The "Ellsberg urn" would be assigned *some* distribution over the black/yellow split (e.g., uniform) and averaged in.
      *   **Eliminate the Known-Mixture Distinction:** The coin/urn distinction becomes irrelevant; both get averaged based on factual uncertainty. The "provenance" of the probability is ignored.
      *   **Always Average:** Worst-casing would vanish as a formal procedure. Caution would only arise from high *expected* disutility, not from ambiguity itself.

  2.  **Changes to Wider Legal/Regulatory Patterns:**
      *   **Weaken Precaution:** The precautionary principle's focus on "lack of scientific certainty" would lose its distinct normative force. Regulation would rely solely on expected cost-benefit analysis, potentially underweighting catastrophic tail risks in novel situations (e.g., GMOs, synthetic biology, novel neurotech).
      *   **Stretch Negligence (or Create Injustice):** Strict SEU might pressure negligence law to consider *all possible* risks ex post, even those unknowable at the time, leading to unfair blame. Alternatively, it might maintain foreseeability but lose a coherent rationale for why unknowable risks are excluded.
      *   **Informed Consent:** Disclosure might shift towards "material expected risks," potentially omitting discussion of fundamental uncertainties about mechanisms or long-term effects if the *expected* probability is low.

  3.  **What Would Be Lost:**
      *   **Robustness to Model Uncertainty:** The rule provides a hedge against being wrong about the *correct model*. Worst-casing protects against bad outcomes arising from using the wrong model entirely.
      *   **Epistemic Humility:** It formally acknowledges situations where experts fundamentally disagree and refuses to paper over this with a fictitious average.
      *   **Protection Against Deep Uncertainty:** In novel research areas (e.g., first-in-human gene editing), where model uncertainty is profound, the strict SEU approach could underestimate true risk exposure by averaging over potentially flawed or incomplete models. The two-tier rule builds in a margin of safety.
      *   **Alignment with Intuition & Participant Trust:** Acknowledging "unknown unknowns" via worst-casing may better reflect participant concerns and foster trust, compared to presenting a precise probability derived from disputed assumptions.

  ### Conclusion
  The two-tier rule presupposes a **normative ambiguity-averse decision theory** grounded in **epistemic justification**. It holds that:
  1.  Expected value calculation requires a defensible single probability model.
  2.  When such a model is unavailable (open uncertainty), worst-casing over the agreed set of possibilities is the rational, precautionary alternative.
  3.  Known random processes provide the epistemic justification lacking in pure model disagreement, even if the outcome is unknown.
  4.  This approach is distinct from negligence (focused on blame for past foreseeable risks) and aligns with the precautionary principle (focused on action under current ignorance).

  Abandoning this view for strict SEU would eliminate the distinct treatment of ambiguity, potentially reducing robustness in ethical review of novel, high-uncertainty research and diluting precautionary approaches more broadly. The loss is primarily one of **epistemic caution and robustness in the face of deep uncertainty**. Whether this loss is acceptable depends on the weight given to ambiguity aversion as a rational principle versus a bias, particularly in the high-stakes context of human subjects research ethics. Your rule elevates caution in the face of the genuinely unknown to the level of principle.
