answer: |-
  ## The Standing Condition on Moral Blame: A Case-Driven Analysis

  There is a genuine standing condition on moral blame, fundamentally rooted in the blamer's own relation to the norm invoked and the context of its violation, such that lacking standing typically renders the blame defective or void by undermining its authority and the normative expectations it seeks to impose, rather than merely constituting an independent wrong committed by the blamer. To establish this, we must examine the nature of blame and the function of standing through the specific cases provided, resisting the temptation to treat standing failures as mere rhetorical missteps or independent wrongs divorced from the blame's core validity.

  Blame, at its core, is a distinctive moral practice. It involves holding another responsible for a wrongful act, typically expressing disapproval, imposing a demand for accountability (like an apology or amended behaviour), and invoking a shared normative commitment. Crucially, it purports to speak with a kind of authority – not necessarily formal, but moral – grounded in the legitimacy of the norm and the blamer's own fidelity to its demands, or at least a position consistent with upholding it. When we blame, we implicitly claim the right to call the wrongdoer to account based on a standard we ourselves endorse and, crucially, are prepared to honour in our own conduct and judgments. Standing concerns precisely this implicit claim to legitimacy and authority within the blaming act itself. It asks whether *this* person, in *this* context, with *this* history, is appropriately positioned to perform *this* blaming act.

  Consider the cases:

  1.  **The Confessing Hypocrite:** She explicitly acknowledges her own identical past violation while blaming her colleague. Does her confession restore standing? On the expressive view, where the defect is merely conveying a false implication of personal compliance, confession *should* repair the defect. Yet intuitively, her blame still rings hollow. Why? Because the core defect isn't purely about misleading representation; it's about a deficit in *moral credibility* and *caller consistency*. By violating the very norm she invokes, she undermines her position to authoritatively demand compliance from others. Her confession mitigates the deception, but it doesn't erase the inconsistency that weakens her normative authority. The colleague might rightly retort, "Who are *you* to lecture me on this, given what you just admitted?" Her blame is **defective**, lacking the full normative force it purports to carry, precisely because her own identical failure saps her authority to impose the demand. She **lacks standing**. The confession doesn't void the blame entirely (the colleague *did* shirk), but it makes it defective by undermining its grounding in a credible demand for reciprocal accountability.

  2.  **The Unindicted Beneficiary:** She complies personally but only because the system unfairly advantages her, shifting the burden onto others. She benefits from the structural injustice that predictably leads to violations, and she actively maintains that structure by voting against reform while blaming those who transgress. Her problem is not hypocrisy in the strict sense (she complies) but *complicity* and *failure of solidarity*. She upholds the norm selectively, enforcing it against the victims of the unfair system she sustains. Her blame implicitly claims the norm is fairly applied and that she occupies a position of clean hands from which to judge. Yet, her complicity in the unfair structure generating the violations means she lacks the moral high ground to blame *those specific individuals* caught in its grip. Her blame ignores her own role in creating the conditions for the wrong and her failure to address the root cause. She **lacks standing** because her position is compromised by benefiting from and perpetuating the injustice that fosters the violation. Her blame is **defective**, arguably more so than the confessing hypocrite, as it compounds unfairness.

  3.  **The Selective Enforcer:** She complies and blames one shirker but not an ally for the same act. This is a failure of *impartiality* and *consistency in application*. Blame implicitly invokes a standard that applies equally to all relevantly similar cases. By applying it selectively based on favouritism, she corrupts the practice of blame itself, turning it into a tool of personal or factional advantage rather than upholding a shared norm. She implicitly claims the authority to judge impartially but betrays that claim. Her blame against the targeted colleague is **void**. It fails *as blame* because it is not genuinely an invocation of the shared norm for its own sake; it is weaponised. The colleague targeted could rightly reject it as illegitimate favouritism, not a genuine call to account. She **lacks standing** relative to that specific act of blaming because she has abandoned the principle of equal application fundamental to the normative authority she purports to exercise.

  4.  **The Inducer:** As head of section, she actively causes the violation by misleading the colleague into believing cover wasn't needed, then blames him for shirking. This is perhaps the clearest case. She is directly responsible for creating the conditions of his "failure." Her blame is not just hypocritical; it is *manipulative* and *entrapping*. It fundamentally perverts the purpose of blame, which is to hold responsible for genuine, avoidable wrongs. The colleague did not freely choose to shirk based on neglect or defiance; he was misled. Her blame is therefore **void**. It fails entirely as a legitimate act of moral protest or demand for accountability. It is a further wrong, an abuse of power. She utterly **lacks standing**, and the colleague should reject it outright as baseless and malicious.

  5.  **The Proxy:** She personally shirked, but blames in her official capacity as an elected union spokesperson, voicing a collective statement mandated by the members. This case tests the boundaries. Does institutional role shield her from the standing defect of her personal hypocrisy? The key lies in the nature of the proxy role. If she is *solely* a mouthpiece, conveying the *collective* judgment and demand of the membership (who may themselves have standing), then her personal failure is arguably irrelevant to the standing of the *collective act* she performs. The blame originates from the group, not her as an individual moral agent. However, if her role involves personal moral judgment or if her personal violation severely undermines her credibility *as the representative* (e.g., if members knew and objected), standing might be **partial** or compromised. Assuming a legitimate mandate where the collective has standing, her personal failure doesn't necessarily void the *collective* blame act she conveys, though it may make her an uncomfortable or hypocritical *instrument*. The blame itself, as the union's act, can still be valid. She, as an individual blamer in that moment, has a **derivative standing** contingent on the group's legitimacy. The appropriate response might be for the *target* to challenge the *union's* stance or her *fitness* as representative, but not necessarily to dismiss the blame's content outright based solely on her personal failure.

  **The Structural Question:** These cases reveal that the standing failure is not uniform in effect. It ranges from making blame **defective** (Cases 1 & 2, undermining its force and authority) to **void** (Cases 3 & 4, rendering it illegitimate *as blame*). Case 5 shows potential for **derivative standing** via role. This variation argues against a monolithic structural account. Standing is not *always* a voiding gate, nor *always* merely adding an independent wrong. Its impact depends on the *nature* of the standing defect:
  *   **Voiding Defects:** Occur when the blame act fundamentally corrupts the practice itself (selective enforcement) or is based on a lie/manipulation (inducement). The act fails *as blame*.
  *   **Defective Blame:** Occurs when the blamer's inconsistency or complicity undermines their authority and the normative force of the demand (hypocrisy, unindicted beneficiary), but the underlying judgment of wrongdoing may still be correct.
  *   **Independent Wrong + Defect?** While blamers without standing often *do* commit an independent wrong (e.g., hypocrisy itself is often wrong), the core problem for the blaming act is not *just* this extra wrong. The defect infects the blame's validity or force. An acknowledgement might mitigate the *independent wrong* of hypocrisy but doesn't fully repair the *defect in the blaming act* (Case 1).
  *   **Scalar Weight?** While the *force* of blame can be diminished (especially in defective cases), the voiding cases show a categorical failure, not just a matter of degree.

  **Best Account of the Defect:** The defect in standingless blaming consists in the blamer’s failure to satisfy the conditions necessary for possessing the normative authority to hold *this specific agent* accountable for *this specific violation* via the blaming act, due to their own inconsistency, complicity, partiality, or direct responsibility for the violation, thereby undermining the legitimacy and force of the normative demand being made.

  **Symmetry Test:** This account illuminates the asymmetry between blame and praise. While hypocritical *praise* (e.g., praising compliance while being a shirker) might feel awkward or insincere, it lacks the core normative *demand* inherent in blame. Praise doesn’t seek to impose accountability or a burden on the recipient in the same way blame demands a response (apology, change). Consequently, the authority deficit tied to inconsistency matters profoundly for the demanding nature of blame but less so for the bestowing nature of praise. Similarly, *demands for apology* clearly inherit the standing conditions of blame, as they are a core component of the blaming practice. *Advice* is different; its validity depends more on content and goodwill than the advisor's personal compliance with the advice (though hypocrisy can undermine persuasiveness). The asymmetry confirms that standing is particularly crucial for practices involving holding others accountable and imposing normative demands.

  **Settled and Contested:**
  *   **Settled:**
      1.  Hypocritical blame is generally considered problematic.
      2.  Directly causing the violation one blames (inducement) undermines standing.
      3.  Standing is distinct from the blame's fittingness (the act *was* wrong).
      4.  Standing is often agent-relative and context-dependent.
      5.  Dismissing all standing complaints as mere *tu quoque* fallacies is too quick; they often point to genuine normative defects.
      6.  Institutional roles can sometimes confer derivative standing (proxy).
  *   **Contested:**
      1.  Whether standing is a necessary condition for genuine blame or merely affects its permissibility/force.
      2.  The precise nature of the defect (expressive/misleading vs. authority/credibility deficit).
      3.  Whether the confessing hypocrite regains standing.
      4.  How complicity in structural injustice (unindicted beneficiary) precisely affects standing.
      5.  Whether standing failures void blame or merely render it defective/less forceful.
      6.  The extent to which standing generalizes to other normative practices like praise or advice.

  **Dialectical Status & Confidence:** My verdict – a genuine standing condition with effects ranging from defect to voiding, rooted in normative authority – represents a **substantial minority** view. The dominant view leans towards standing affecting permissibility or force (defective/scalar), often linked to expressive or fairness concerns, rather than voiding. A smaller but significant group argues standing is not a genuine condition distinct from other moral considerations like hypocrisy being independently wrong. I assign a **confidence of 0.7** in my specific hybrid structural account (voiding for certain corruptions, defective for others). This tracks my assessment that the case-driven variations are compelling and that authority/credibility deficits are central, but acknowledges the strong competing arguments focusing on fairness and expressive norms, and the ongoing lack of consensus on structure. The **defeater** that would most likely make me abandon this account would be a convincing demonstration that *all* instances of standingless blame, including the inducer and selective enforcer, can be fully explained as merely committing an independent wrong by the blamer (e.g., lying, being unfair) without affecting the validity *of the blame act itself* as a representation of the wrong committed by the target – a view I find deeply counterintuitive for those core cases.

  The familiar dismissal of standing complaints as *tu quoque* fallacies **is too quick**. While *tu quoque* can be a fallacy (irrelevant to the truth of the claim that the *target* acted wrongly), it accurately identifies a problem with the *blamer's position* when raised as a challenge to the legitimacy or authority *of the blaming act itself*. The target isn't (necessarily) denying their wrong; they are denying *this person's* right to call them to account for it in this way. This is a substantive normative challenge to the practice, not a logical error concerning the fact of the wrong.

  In conclusion, standing is a genuine, multifaceted condition intrinsic to the practice of moral blame. Its absence, arising from inconsistency, complicity, partiality, or direct causation, typically either voids the blaming act by corrupting its fundamental nature or renders it defective by fatally undermining its normative authority and force. The cases demonstrate that the structural impact varies, reflecting the diverse ways a blamer can lose the right to hold another accountable. While the *tu quoque* label is unhelpful, the core insight that "who are you to blame me?" can be a legitimate challenge holds true, exposing the crucial link between the blamer's own normative position and the legitimacy of their moral demand.

