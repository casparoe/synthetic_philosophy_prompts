answer: |-
  ### Joint Statement: Agreed Foundations  
  1. **Fixed Structural Context (1930-33)**: Germany faces economic collapse (Depression, 33% unemployment), political fragmentation (Weimar instability), elite rejection of democracy (Hindenburg circle, army, industrialists), revanchism (Versailles stigma, "stab-in-the-back" myth), paramilitary violence (SA, KPD), and pervasive antisemitism.  
  2. **Counterfactual Definitions**:  
     - *Deletion*: Hitler vanishes January 1930; no agreed successor emerges.  
     - *Runner-Up Substitution*: Hitler replaced by most plausible alternative (e.g., Hugenberg, Schleicher, or Strasser).  
     - *Re-roll*: Leader drawn randomly from pool of "plausible right-authoritarians" (conservatives, nationalists, fascists; excludes left/democrats).  
  3. **Outcome Variables**:  
     - *Authoritarian Baseline*: Right-wing dictatorship suppressing leftists, dismantling democracy, remilitarizing, seeking treaty revision.  
     - *Nazi Outcome*: One-party totalitarian state, war of annihilation in East, systematic genocide of Jews.  
  4. **Shared Premise**: Structural pressures make *some* authoritarian regime highly probable by 1933–34. Disagreement centers on *regime type* and *extremity of outcomes*.  

  ---

  ### Disagreements Table  
  | Claim (Structuralist)                          | Claim (Personalist)                          |  
  |------------------------------------------------|----------------------------------------------|  
  | S1: Structural antisemitism, expansionism, and elite panic made a regime committing mass genocide *possible* by 1932. | P1: Only Hitler’s *specific ideology* and *tactical-operational genius* converted possibility into industrialized genocide. |  
  | S2: Conservative elites (Hindenburg, Papen) sought a dictatorship and would have installed *some* authoritarian figure absent Hitler. | P2: Without Hitler’s *charismatic hold* over the masses and SA, no regime achieves totalitarian control or popular mobilization for total war. |  
  | S3: A "re-rolled" leader would likely pursue *Authoritarian Baseline* outcomes (e.g., authoritarian conservatism à la Franco/Salazar). | P3: Hitler’s *risk addiction* and *escalatory strategy* were indispensable for the *Nazi Outcome*; substitutes (e.g., Hugenberg) lack resolve for Eastern annihilation. |  

  ---

  ### Cruxes with Shared Evidence & Predictions  
  1. **Crux: Genocidal Threshold**  
     - *Evidence*: Pre-1933 antisemitism was endemic but not genocidal; Holocaust required state coordination, ideology of "annihilation," and war context.  
     - *Structuralist Prediction*: Substitution/re-roll regimes *might* enact violent pogroms/ghettos but avoid systematic genocide.  
     - *Personalist Prediction*: Genocide *only* occurs under Hitler’s obsessive ideology and SS apparatus.  

  2. **Crux: Total War Gambles**  
     - *Evidence*: Army/elites wanted rearmament but feared two-front war; Hitler overruled caution in 1936 (Rhineland), 1938 (Sudetenland), 1941 (Barbarossa).  
     - *Structuralist Prediction*: A substitute (e.g., Schleicher) pursues limited revisionism (e.g., Danzig corridor) but avoids existential wars.  
     - *Personalist Prediction*: Only Hitler’s apocalyptic worldview and risk tolerance enabled Barbarossa.  

  ---

  ### Hinge Moments: Divergence Attribution  
  | Event             | Structuralist (S) Attribution      | Personalist (P) Attribution        |  
  |-------------------|-----------------------------------|-----------------------------------|  
  | **1933 Appointment** | 90% S: Elite manipulation enabled. | 70% P: Hitler’s SA mobilization and negotiation forced elites’ hand. |  
  | **Enabling Act**    | 80% S: Conservative-authoritarian consensus existed. | 60% P: Hitler’s coalition-building and SA terror secured total power. |  
  | **1936 Rearmament** | 60% S: Army/industrial pressure. | 80% P: Hitler’s high-stakes bluff against advisors. |  
  | **1941 Barbarossa** | 50% S: Geopolitical momentum. | 95% P: Hitler’s ideological drive for *Lebensraum*. |  

  ---

  ### Semantic Flags  
  - "**Fascist**": Structuralists use it broadly (mass-mobilizing authoritarianism); Personalists reserve it for Hitler/Mussolini models.  
  - "**Plausible occupants**" (re-roll): Structuralists include conservative militarists (e.g., Seeckt); Personalists exclude non-charismatic figures.  

  ### Verdict: Genocide requires Hitler’s ideology; structure enables authoritarianism.
