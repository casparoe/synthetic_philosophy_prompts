  Each case has 2-3 plain-English options avoiding jargon. The scoring key will map answer patterns to positions, noting empty cells (e.g., "counterfactuals brute but not known by God" is incoherent) and indistinguishable pairs (e.g., Molinism vs. brute-fact SFK may collapse without grounding questions). For tie cases, I'll include a "no fact" option since that's central to the user's request.

