  ## The Cycle's Narrow Purchase

  They said each step would make things **better**,
  offered bright **coin** to ease the strain.
  They drew a path, a tidy **circle**,
  each separate **trade** seemed free from pain.
  They never spoke of netted **loss**,
  just "Take this step and find your **home**."

  But **home** was shifting. What felt **better**
  one moment fled. The clink of **coin**
  seduced again. Watch how the **circle**
  completes: each tempting, small **trade**
  accumulates that quiet **loss**
  while whispering of journeys **home**.

  What's passed seems worse when nearing **home**?
  The next step always claims "**better**!"
  We pay the price with silver **coin**,
  believing we escape the **circle**,
  until we see each small **trade**
  has guaranteed this final **loss**.

  But is this **loss** the only **home**
  we'll know? The one who sees the **circle**
  whole might pause: "This step's not **better**,
  I'll keep my purse, refuse the **coin**,
  and halt the sequence of this **trade**."

  Refuse the **trade**? Avoid the **loss**?
  Then preference shifts: where stands true **home**?
  It depends which step you're offered **coin**,
  which point you're told the next is **better**.
  Context decides, within the **circle**,
  destroying constancy. Your **home**

  depends on timing, not true **home**,
  but what's coming. The cost of **trade**
  is knowing it spins on a **circle**.
  Avoiding one avoids the **loss**,
  but makes the pairwise "**better**"
  depend on futures paid in **coin**.

  So what has all this spent **coin**
  bought? They claim it builds a **home**
  for reason, proving what is **better**.
  But look: the pump secured the **trade**
  of cycles only. That vast **loss**
  was just to break the spinning **circle**.

  We broke the **circle**. Yet the shape of want
  still holds **loss**es deeper than mere cash.
  The **home** we sought? It's built on sand.
  Each **trade** demands a hidden price.
  What's truly **better** breaks its word.
  The bill arrives. We pay in **coin**.

  ---

  **Annotations for the Decision Theorist (Not Part of the Poem):**

  *   **Stanzas 1-3 (The Naive Pump):** Depicts the sequential money pump (A>B, B>C, C>A). Each pairwise swap is accepted because it seems locally better ("better"), involves paying a small amount ("coin"), and leads back to the start ("circle") minus money ("loss"), failing to reach a stable "home". Avoids Dutch Book by focusing strictly on sequential trades ("trade") of goods, not simultaneous bets.
  *   **Stanza 4 (The Turn - Foresight Objection):** Introduces the objection: a foresighted agent refuses *one* trade ("Refuse the trade?"), breaking the cycle and avoiding the net "loss". This makes the preference ordering context-dependent ("Context decides") – whether A is preferred to B depends on the agent's position in the sequence ("which step") or expectations of future offers ("what's coming"). "Home" becomes unstable.
  *   **Stanzas 5-6 (The Narrowing):** Argues the pump only buys acyclicity ("broke the circle") and potentially completeness ("the shape of want"). It does *not* secure Independence or full EU ("deeper than mere cash"). The "cost of trade" (adopting EU-like behavior) might require accepting "hidden price[s]" (violations of other intuitions). The EU maximization claim ("proving what is better") oversells the result; the poem ends asserting the argument only removes cycles ("broken promises" refers to Independence violations like Allais).
  *   **Envoi:** Summarizes the cost ("bill") of the argument: breaking transitivity cycles ("circle") only, paid for with the agent's money ("coin"), while leaving deeper questions about the structure of preference ("home", "better") unresolved. "Broken promises" subtly points to Independence axiom failures.
  *   **Speaker:** Embodies the agent being pumped ("we thought we'd found", "We pay the price") while also observing and analyzing the process ("See the circle spin", "look: the pump secured", "The bill arrives").
  *   **Last Word:** "Coin" closes the cycle, emphasizing the monetary cost of the process and the currency of the argument.
