prompt: |-
  hey — I help run a tiny student interview series attached to my cog sci seminar this term (we get one guest for 40 minutes, record it, and post the audio to a shared drive that maybe twelve people ever listen to). Next week's guest is a philosopher of cognitive science I'll call Dr. Marisol Vance, and she defends something she nicknames the "crutch curve" account of intelligence: the idea that intelligence isn't a system's peak score on a task but the shape of how its performance falls off as you strip away the supports it's currently leaning on — how often it gets feedback, how closely the test resembles what it was trained on, whether it has tools or external memory or scratch space, how much of the computation is quietly being done by the structure of the environment itself. Her slogan is that you find out how intelligent something is when you take the crutches away, and she likes to talk about "area under the degradation curve" instead of best-case performance. I've only skimmed her position paper and I half buy it, but I also suspect the view has an escape hatch every few pages, and I don't want to spend the episode nodding along.

  Could you draft me eight to ten interview questions that never let her just restate the slogan, plus a follow-up wherever you can guess the move she'd make? The specific things I want hit: (1) whether this is just out-of-distribution robustness with a sexier name, given that she'll probably answer that robustness is always relative to a single task while her curve is a partial order over whole families of degradation — I want that reply made progressively harder to lean on; (2) the no-free-lunch-flavoured worry that *which* degradations you choose to apply already smuggles in an assumption about which tasks and environments matter, so the "general" in general intelligence hasn't really been cashed; (3) bacteria, tardigrades and slime molds — they survive brutal perturbations and keep functioning, so either they're intelligent on her account or she has to say the degradations have to be of the right, representational kind, at which point she seems to have sneaked cognition back in through the back door; (4) her habit of dismissing measurement worries with "that's a measurement problem, not a problem for the account," which I'd like boxed in; (5) what her view says about us — take away language, literacy, sleep, other people, and human performance collapses too, so is she committed to human intelligence being mostly institutional scaffolding, and if she bites that bullet what's left of "artificial general intelligence" as a research target?

  Also, if you can work these in: one question on the psychometrics side, i.e. the fact that people who do well on one kind of cognitive test tend to do well on seemingly unrelated ones, and whether her account predicts that or just tolerates it (is intelligence one number on her view, or a family of seperate curves that can't be compared?); one on the old Chinese-room-style worry, whether something that degrades gracefully but doesn't understand anything is intelligent by her lights; one on how you'd actually run a degradation audit in practice without every lab tuning its system to the particular degradations the audit happens to test; one on whether an "intelligence explosion" — a system improving itself — is even a coherent idea if intelligence is resistance to losing your supports; and then a closing question about what empirical result would actually make her abandon the view, ideally with a concrete case (something like a system with a completely flat degradation profile that we'd still refuse to call intelligent, or one that falls apart fast but relearns a new regime faster than any person). Keep the questions in spoken-register English, since they'll be read out loud, and please don't pad them with biography stuff about her career — I can do that part myself.
reasoning: |-
  Okay, the user is running a student interview series and needs help crafting tough questions for Dr. Marisol Vance's "crutch curve" theory of intelligence. They want to push beyond surface-level explanations and challenge potential weaknesses in her framework. 

  First, I notice they've clearly done their homework - they've skimmed her paper, identified key tensions, and want to prevent her from retreating into slogans. Their frustration with "escape hatches" suggests they value intellectual rigor. The specificity of their requests (bacteria, no-free-lunch worries, measurement issues) tells me they're looking for surgical precision in questioning.

  Hmm... the core tension seems to be between wanting a truly general intelligence metric while acknowledging that degradation paths are always context-dependent. That's fertile ground. I should design questions that force her to either bite uncomfortable bullets (like bacteria being intelligent) or admit hidden assumptions about cognition. 

  The Chinese room angle is particularly clever - if graceful degradation without understanding qualifies as intelligence, that conflicts with most philosophical intuitions. And the institutional scaffolding question could reveal whether her view is secretly anthropocentric. 

  For structure, I'll cluster questions thematically: start with definitional probes (Q1-Q2), then robustness comparisons (Q3-Q5), followed by boundary cases like bacteria (Q6) and measurement (Q7). The human implications (Q8) and Chinese room (Q9) set up practical concerns about audits (Q10) before ending with falsifiability (Q11). 

  Need to watch the register - these must sound conversational when spoken aloud. No jargon, short clauses, maybe sprinkle contractions like "isn't" to keep it natural. The follow-ups should anticipate her dodges: when she says bacteria aren't cognitive, pounce on why degradation types matter; when she calls something a measurement problem, demand what would make it a theoretical flaw.

  Most importantly, every question must cut to the heart of whether the crutch curve actually explains intelligence or just relabels existing concepts. That closing falsifiability question could be devastating if she can't name concrete counterevidence - it might reveal the theory's unfalsifiable core.
answer: |-
  Here are 10 tightly focused, spoken-register questions with embedded follow-ups designed to press Dr. Vance on the core tensions in her account:

  1.  **The Definition Push:** "Dr. Vance, you define intelligence via the 'crutch curve' – performance degradation as supports are removed. But isn't this just a *description* of fragility? What specific *property of the system itself* does this curve actually measure that warrants calling it 'intelligence', rather than just robustness or adaptability?"
      *   *Follow-up if she emphasizes resilience/adaptation:* "But bacteria are resilient and adapt to massive perturbations – is *E. coli* therefore intelligent? If not, what distinguishes its degradation profile from the kind that signals intelligence?"

  2.  **The Degradation Menu Problem:** "You argue the crutch curve reveals a *partial order* over systems. But *which* crutches we choose to remove feels critical – taking away language harms humans but not AlphaZero. Doesn't selecting specific degradations already assume which *kinds* of tasks or environments define 'general' intelligence, making it circular?"
      *   *Follow-up if she says it's task-family relative:* "But doesn't that mean 'general intelligence' just collapses into being 'robust within *this specific set* of tasks I care about'? How do you objectively define the *set* of degradations that matter for G, without presupposing what cognition is?"

  3.  **OOD Robustness vs. Crutch Curve:** "A common critique is that the crutch curve is just out-of-distribution (OOD) robustness rebranded. You counter that OOD is task-specific while your curve spans task families. Could you give a concrete example of two systems where their *relative* intelligence ranking flips depending on whether you look at single-task OOD robustness versus your multi-task degradation curve? What feature causes that flip?"
      *   *Follow-up if the example seems vague:* "Could that flip *also* be explained by just defining a broader, more complex 'meta-task'? Is the difference truly categorical, or just a matter of how broadly we define the performance domain?"

  4.  **The Scaffolding Paradox (Humans):** "Humans rely massively on crutches: language, writing, institutions, tools, sleep. Strip those away, and our performance collapses dramatically. Does your account imply that human 'intelligence' is primarily located in our socio-technical scaffolding? If so, what core, unscaffolded capacity is left that AGI researchers should even be aiming for?"
      *   *Follow-up if she bites the bullet:* "So is the goal of AGI then to build systems that *reliably utilize external scaffolds*, rather than systems with high 'naked' intelligence? Doesn't that redefine the AGI target fundamentally?"

  5.  **Psychometrics & the 'g' question:** "Human psychometrics finds a 'g-factor' – performance across diverse cognitive tests correlates. Does your account *predict* this kind of positive manifold? Or does it merely *tolerate* it? Is intelligence, for you, ultimately *one* number (like area under *the* curve), or is it a profile of *many* separate curves for different degradation families that might *not* correlate?"
      *   *Follow-up if she leans towards one number:* "What guarantees that the degradations defining that single curve are the 'right' universal ones? If it's many curves, how do we compare systems that degrade well on *different* sets of crutches?"

  6.  **The Chinese Room Test:** "Imagine a system meticulously designed to degrade *very* gracefully across a wide range of crutch removals for, say, question-answering – but it does this through massive, brittle lookup tables or precomputation, with zero internal understanding. Is this system 'intelligent' on your account? If yes, does that clash with the intuition that understanding matters? If no, doesn't that mean graceful degradation alone *isn't* sufficient for intelligence?"
      *   *Follow-up if she adds qualifiers (e.g., 'efficient', 'flexible'):* "Doesn't adding those qualifiers risk sneaking back in traditional cognitive criteria through the back door?"

  7.  **The Audit Tuning Problem:** "In practice, how do we prevent 'crutch curve audits' from becoming just another benchmark to overfit to? If Labs know *which* degradations (e.g., reduced feedback frequency, specific environmental changes) will be tested, won't they just tune their systems to degrade gracefully on *that specific menu*, gaming the measure without gaining the underlying resilience you care about?"
      *   *Follow-up if she suggests diverse/unpredictable audits:* "But then how do we standardize measurement? Doesn't this push the problem onto defining the 'right' unpredictable audit distribution – which loops back to the Degradation Menu problem?"

  8.  **Intelligence Explosion Conundrum:** "The 'intelligence explosion' idea involves an AI rapidly improving *its own* capabilities. But if intelligence is defined by resistance to *losing external supports*, how does self-improvement even fit? Is an 'explosion' just the system building *better crutches* for itself faster and faster? Does the core 'naked' intelligence ever increase?"
      *   *Follow-up if she focuses on self-improving scaffolds:* "Doesn't this make the 'explosion' about scaffold engineering, not about an inherent cognitive capacity exploding? Is that a different phenomenon?"

  9.  **Measurement Dodge Boxing:** "You sometimes deflect concerns about *measuring* the crutch curve by saying it's 'just a measurement problem, not a problem for the account.' But at what point does the difficulty of *actually measuring* the curve across a meaningful set of degradations and task families become a *fatal flaw* for the account's usefulness? What *kind* of measurement failure *would* challenge the theory itself?"
      *   *Follow-up if she insists it's purely practical:* "So the theory is unfalsifiable by measurement difficulties? What *empirical* finding *could* disprove it, if not the inability to measure the curve meaningfully?"

  10. **Falsifiability & Edge Cases:** "What concrete empirical result would make you abandon or significantly revise the crutch curve account? For instance: a system with a near-perfectly *flat* degradation curve across a huge range of crutch removals that we all intuitively agree lacks understanding or agency? Or conversely, a system that *collapses* dramatically with minor perturbations but can *relearn* entirely new regimes from scratch faster than any human?"
      *   *Follow-up on her example:* "Why would that specific result be decisive? How does it break the core link you propose between graceful degradation and intelligence?"

  **Key Tactics Embedded:**
  *   **Forcing Ontological Commitment:** (Q1, Q6) Pressing *what is being measured* inside the system.
  *   **Circularity Traps:** (Q2, Q5 Follow-up) Highlighting how choosing degradations/tasks presupposes intelligence.
  *   **Boundary Pushing:** (Q1 Follow-up, Q6) Using bacteria/Chinese Room to force distinctions that may reveal hidden cognitive criteria.
  *   **Consequence Highlighting:** (Q4, Q8) Making the implications for humans/AGI explicit and potentially uncomfortable.
  *   **Dodge Prevention:** (Q9) Explicitly boxing in the "measurement problem" deflection.
  *   **Empirical Grounding:** (Q3, Q7, Q10) Demanding concrete examples, practical application details, and falsification criteria.
  *   **Internal Tension Exploitation:** (Q5) Probing the tension between a single metric vs. multiple profiles.

  These questions are designed to be read aloud clearly and push past the slogan into the theory's foundations and consequences. Good luck with the interview!
