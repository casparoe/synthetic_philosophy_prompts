  ### **What Will Go Wrong & Fixes**  
  - **"It depends what you mean by disposition!" (10 minutes in)**:  
    - **Fix**: In intro, say: "For now, assume SCA: ‘Has disposition iff it would M if C.’ We’ll critique later." Jot down the query for debrief.  
  - **Presuppositional questions (e.g., "When it breaks...")**:  
    - **Fix**: Holders answer literally (e.g., "It doesn’t break"). Remind teams to phrase tests neutrally.  
  - **Overthinking the boring object**:  
    - **Fix**: If a team says "can’t tell" for object 8, note in debrief how SCA encourages skepticism even when unnecessary.  
  - **Splitting on contentious cases (e.g., probabilistic/lucky objects)**:  
    - **Fix**: Use disagreements to highlight where intuitions diverge—e.g., "Why did half of you say the lucky glass lacks fragility? Does metaphysics require manifestation?"  

  ### **Confidence in Cases**  
  - **High confidence (stable verdicts)**: 1, 2, 4, 5, 7, 8, 9. Based on literature standards (Lewis, Martin, Bird).  
  - **Medium confidence (may split the room)**: 3 (brief conduction), 6 (randomness), 10 (indeterminacy). I predict your seminar will find 3 and 6 intuitive but debate 10.  
  - **Low confidence (deliberately contentious)**: 11 (lucky glass), 12 (enigma). These test if players separate metaphysics from epistemology. I expect ~60% to say the lucky glass "lacks" the disposition.  

  ### **Final Note**  
  This game *does* deliver your metaphysical point: Players experience that dispositions aren't defined by test outcomes (finks/masks make behavior unreliable), and they’re forced to appeal to hidden mechanisms. It’s not just epistemology—the answer key defines "has/lacks" *metaphysically*, independent of tests. Print the 12 object cards, keep the answer key secret, and let the gameplay provoke the "aha!" moment. I’m 90% confident this will work as intended; the remaining 10% hinges on your deft handling of the debrief to cement the metaphysics.
