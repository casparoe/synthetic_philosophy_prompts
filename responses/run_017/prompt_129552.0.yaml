  ### **Timeline (80 Minutes Total)**
  **Goal**: Two full rounds (each team plays holder/interrogator once) + debrief.  
  **Buffer**: 10 minutes for setup/contingencies.

  - **0–5 min: Intro & Teams**  
    - Form 4 teams. Explain rules:  
      - "Determine if the object has the disposition using 3 yes/no questions. Questions must be **testable interventions** (e.g., ‘What happens if we strike it?’). No definitional questions (e.g., ‘Is it fragile?’)."  
      - Emphasize: "This is about metaphysics, not epistemology—does the object *have* the power, regardless of what tests show?"  
    - Assign initial roles: Teams A and B hold objects; C and D interrogate.

  - **5–15 min: Round 1 Setup**  
    - Give **object files 1–4** to holder teams (A and B).  
    - Holders read files (5 min). Interrogators (C and D) plan strategy.  
    - *Predictable issue*: Someone asks, "What does ‘disposition’ mean?" Redirect: "Use the SCA as a working definition for now—we’ll critique later."

  - **15–30 min: Round 1 Interrogation**  
    - Interrogators (C and D) ask 3 questions each to their holder team (A and B). Holders answer truthfully.  
    - Interrogators give verdict (has/lacks/can’t tell). Record on whiteboard.  
    - *Predictable issues*:  
      - Teams ask presuppositional questions (e.g., "When it shatters..."). **Solution**: Holders answer based on the file (e.g., "It doesn’t shatter").  
      - A team runs out of questions. **Solution**: Encourage broad tests (e.g., "What if we heat it then strike it?").

  - **30–35 min: Round 1 Scoring**  
    - Reveal answers using key. Award points.  
    - *Predictable issue*: Debate over verdicts. **Solution**: Note disagreements for debrief; don’t resolve yet.

  - **35–50 min: Round 2**  
    - Rotate roles: Teams C and D hold (**objects 5–8**); A and B interrogate.  
    - Repeat setup and interrogation.

  - **50–55 min: Round 2 Scoring**  
    - Reveal answers; award points.

  - **55–70 min: Debrief**  
    - Use whiteboard to map cases to SCA failures (see below).

  - **70–80 min: Buffer/Q&A**  
    - Address unresolved disputes or new questions.

  ---

  ### **Debrief (15 Minutes)**  
  **Goal**: Connect gameplay to metaphysics. Whiteboard two columns: "SCA Holds" vs. "SCA Fails." Discuss:
  1. **What broke the SCA?**  
     - Cases like **1 (Guardian Angel)** and **5 (Heat-Activated Explosive)**: Show conditionals can be *false* when disposition present (or *true* when absent).  
     - Cases like **2 (Packed Glass)** and **11 (Lucky Glass)**: Manifestation is masked, but disposition exists. SCA conflates behavior with power.  
     - Case **10 (Quantum Glass)**: Indeterminacy makes SCA inapplicable—no truth value for the conditional.  
     - Case **12 (Self-Destructing Enigma)**: Tests can’t access the disposition, but it exists metaphysically.

  2. **Where could SCA bite the bullet?**  
     - Case **3 (Time-Delayed Wire)**: A conditional theorist might say, "It *does* conduct briefly, so SCA holds." But this reveals ambiguity in defining "M" (brief vs. sustained conduction).  
     - Case **6 (Probabilistic Fink)**: SCA could be modified for probabilistic conditionals (e.g., "would M with probability P").  
     - Case **8 (Normal Glass)**: SCA works here—but it’s the exception.

  3. **Where we shift to categorical bases**  
     - When behavior is unreliable (finks/masks), we appeal to intrinsic properties. Cases **1, 2, 5, 9** force this: The mechanism *explains* why tests fail.  
     - Case **4 (Two-Strike Glass)**: Questions in the "wrong order" hide the disposition, but the categorical basis (fragility) persists.

  4. **What the game can’t do**  
     - **It’s not just epistemology**: The game *does* show metaphysical points (e.g., object 1 has a disposition but never manifests it). However, it risks conflating "can’t know" with "isn’t real" (especially in case 12). Clarify: "The enigma glass *has* the disposition—your tests just couldn’t reveal it. This shows dispositions aren’t defined by testability."  
     - **Limitations**: The game simplifies dispositions (e.g., no discussion of intrinsicness, multi-track dispositions, or stimulus conditions). Use debrief to note these.

