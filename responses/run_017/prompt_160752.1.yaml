  I work in programming languages — typed lambda calculi with universe hierarchies, predicativity versus impredicativity, staged computation and quasiquotation, metacircular interpreters, self-hosting compilers, reflective towers — and I'm fluent enough that you should use that vocabulary at full technical depth.

