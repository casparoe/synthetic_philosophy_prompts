  Two things I especially want. First, a test case of my own: a tower of interpreters indexed by the integers rather than the naturals, each level a metacircular evaluator for the one below, non-well-founded, no bottom level, corecursively specified so that no level violates itself. Does the inviolate-level claim then collapse into a specification/implementation distinction — coherently definable, never runnable without a base machine — and if so, is the original claim saying anything my distinction doesn't already say? Second, a Gödelian worry: in my vocabulary self-reference is achieved by coding and diagonalization, not by any level being violated, so a system can talk about itself while its hierarchy stays perfectly stratified. If that's right, is the tangled-hierarchy picture of the self a claim with no formal counterpart — and is that because my vocabulary is missing something, or because the picture was doing less work than it appears to?
