answer: |-
  Below is a diagnostic decision tree for distributive ethics positions, built from logical space and designed to handle your specified cases (leveling down, top-addition, intra-personal leveling down, uncertainty, and hidden positions). It starts with concrete cases and branches into named positions based on answers. Empty branches are marked and diagnosed. The tree has **9 branch nodes** and **10 leaves** (8 named positions + 1 unnamed + 1 incoherent).

  ---

  ### **Decision Tree: Distributive Ethics Positions**
  *Start at Question 1. Answer based on your intuitive judgments about the cases.*

  **Q1: Interpersonal Leveling Down**  
  *Case: Society A has 10 sighted people (well-being 10) and 10 blind people (well-being 5). Society B has all 20 blind (well-being 5). No other changes. Is Society B in any way better?*  
  - **Yes** → Proceed to Q2.  
  - **No** → Proceed to Q3.  

  **Q2: Instrumental vs. Non-Instrumental Equality**  
  *Case: Same as Q1, but assume leveling down has no effects on social relations, empathy, or welfare. Is Society B still in any way better?*  
  - **Yes** → **Telic egalitarianism (Leaf 1)**. *Bites the bullet: Equality is intrinsically valuable, even when bad for everyone.*  
  - **No** → *Empty branch (Incoherent)*. Why? If leveling down is only better instrumentally, but Q2 removes all instrumental effects, there’s no coherent reason left.  

  **Q3: Top-Addition**  
  *Case: World A has 10 people (well-being 10). World B adds an 11th person (well-being 100). Is World B in any way worse due to inequality?*  
  - **Yes** → *Empty branch (Incoherent)*. Why? Rejecting leveling down (Q1) but objecting to top-addition implies inconsistent valuation of equality.  
  - **No** → Proceed to Q4.  

  **Q4: Intra-Personal Leveling Down**  
  *Case: A person has two life options: (1) 50 great years (well-being 10) + 50 terrible years (well-being 0); (2) 100 identical years (well-being 5) by removing goods from the great years. Is (2) better for the person?*  
  - **Yes** → *Empty branch (Incoherent)*. Why? Valuing intra-personal equality but rejecting interpersonal (Q1, Q3) suggests confusion about the relational core of inequality.  
  - **No** → Proceed to Q5.  

  **Q5: Deontic Constraint Against Creating Inequality**  
  *Case: You can give a rare drug to either a healthy person (well-being 10) or a sick person (well-being 5). Giving to the healthy person worsens inequality; giving to the sick reduces it. Is it wrong to give to the healthy person? (Assume no other effects.)*  
  - **Yes** → Proceed to Q6.  
  - **No** → Proceed to Q7.  

  **Q6: Basis of Wrongness in Q5**  
  *Why is it wrong to worsen inequality?*  
  - **Harm to social relations/standing** → **Relational egalitarianism (Leaf 6)**. *Equality is a constraint to avoid domination, disrespect, or unequal social power.*  
  - **Violation of distributive pattern** → **Deontic egalitarianism (Leaf 2)**. *Equality is a constraint on justifications/actions, even without social harm.*  

  **Q7: Priority to the Worse Off**  
  *Case: You can give a unit of well-being to either a worse-off person (well-being 5) or a better-off person (well-being 10). Should you prioritize the worse off?*  
  - **Yes** → Proceed to Q8.  
  - **No** → **Unweighted beneficence (Leaf 8)**. *Only total well-being matters; no extra weight to the worse off.*  

  **Q8: Basis for Priority**  
  *Why prioritize the worse off?*  
  - **Absolute well-being level** → Proceed to Q9.  
  - **Relative disadvantage compared to others** → **Competing-claims view (Leaf 7)**. *Claims are stronger for the worse off due to unfairness of their relative position. Uncertainty often requires weighted lotteries.*  

  **Q9: Threshold vs. Continuum**  
  *Is the priority to the worse off triggered only below a minimum threshold (e.g., poverty line)?*  
  - **Yes** → **Sufficientarianism (Leaf 5)**. *Priority only applies below a threshold; above it, no extra weight.*  
  - **No** → Proceed to Q10.  

  **Q10: Equality as Independent Value**  
  *Even after rejecting leveling down (Q1), is inequality still intrinsically bad?*  
  - **Yes** → **Prioritarianism + equality (Leaf 4)**. *Combines priority for the worse off (absolute) with intrinsic disvalue of inequality.*  
  - **No** → **Plain prioritarianism (Leaf 3)**. *Weight on benefits based solely on absolute well-being, not inequality.*  

  ---

  ### **Leaf Positions**
  1. **Telic egalitarianism**: Equality is intrinsically good; accepts leveling down.  
  2. **Deontic egalitarianism**: Equality is a constraint on actions/justifications; rejects leveling down.  
  3. **Plain prioritarianism**: Weight benefits by absolute well-being; rejects inequality’s intrinsic value.  
  4. **Prioritarianism + equality**: Weight benefits by absolute well-being + intrinsic disvalue of inequality.  
  5. **Sufficientarianism**: Priority only to those below a threshold.  
  6. **Relational egalitarianism**: Equality avoids unequal social relations; constraint-based.  
  7. **Competing-claims view**: Claims weighted by relative disadvantage; uncertainty handled via lotteries.  
  8. **Unweighted beneficence**: Maximize total well-being; no priority to worse off.  
  9. **Unnamed position**: *None in tree (all branches covered).*  
  10. **Incoherent branch**: *Marked in Q2, Q3, Q4; inconsistent answers.*  

  ---

  ### **Quiz Version (10 Questions)**  
  *Hand this out. Scoring key at the end.*  

  1. **Interpersonal Leveling Down**: Society A (10 sighted at 10, 10 blind at 5) vs. Society B (all 20 blind at 5). Is B better?  
     - (a) Yes  
     - (b) No  

  2. **Instrumental vs. Non-Instrumental**: Same as Q1, but no effects on social relations. Is B better?  
     - (a) Yes  
     - (b) No  

  3. **Top-Addition**: World A (10 people at 10) vs. World B (add 1 person at 100). Is B worse due to inequality?  
     - (a) Yes  
     - (b) No  

  4. **Intra-Personal Leveling Down**: A life with 50 great years (10) + 50 terrible years (0) vs. 100 identical years (5). Is the equalized life better for the person?  
     - (a) Yes  
     - (b) No  

  5. **Deontic Constraint**: Giving a drug to a healthy person (10) vs. sick person (5). Is it wrong to give to the healthy?  
     - (a) Yes  
     - (b) No  

  6. **Basis of Wrongness in Q5**: Why?  
     - (a) Harm to social relations  
     - (b) Violation of distributive pattern  

  7. **Priority to Worse Off**: Give a unit of well-being to worse off (5) or better off (10)?  
     - (a) Prioritize worse off  
     - (b) No priority  

  8. **Basis for Priority**: Why prioritize?  
     - (a) Absolute well-being level  
     - (b) Relative disadvantage  

  9. **Threshold vs. Continuum**: Is priority only below a minimum?  
     - (a) Yes (threshold)  
     - (b) No (continuum)  

  10. **Equality as Independent Value**: Is inequality intrinsically bad?  
      - (a) Yes  
      - (b) No  

  ---

  ### **Scoring Key**  
  Follow your answers through the tree to find your position:  
  - **Q1a → Q2a**: Leaf 1 (Telic egalitarianism)  
  - **Q1a → Q2b**: Incoherent (stop)  
  - **Q1b → Q3a**: Incoherent (stop)  
  - **Q1b → Q3b → Q4a**: Incoherent (stop)  
  - **Q1b → Q3b → Q4b → Q5a → Q6a**: Leaf 6 (Relational egalitarianism)  
  - **Q1b → Q3b → Q4b → Q5a → Q6b**: Leaf 2 (Deontic egalitarianism)  
  - **Q1b → Q3b → Q4b → Q5b → Q7b**: Leaf 8 (Unweighted beneficence)  
  - **Q1b → Q3b → Q4b → Q5b → Q7a → Q8b**: Leaf 7 (Competing-claims view)  
  - **Q1b → Q3b → Q4b → Q5b → Q7a → Q8a → Q9a**: Leaf 5 (Sufficientarianism)  
  - **Q1b → Q3b → Q4b → Q5b → Q7a → Q8a → Q9b → Q10a**: Leaf 4 (Prioritarianism + equality)  
  - **Q1b → Q3b → Q4b → Q5b → Q7a → Q8a → Q9b → Q10b**: Leaf 3 (Plain prioritarianism)  

  ---

  ### **Diagnostic Notes**  
  - **Top-addition (Q3)**: Exposes whether equality is a pattern to avoid (telic/deontic) or irrelevant (prioritarianism/beneficence). Telic declines to add happy people; others don’t.  
  - **Intra-personal leveling down (Q4)**: Reveals if equality is interpersonal (relational/claims) or intrapersonal (rejected here).  
  - **Uncertainty/hidden positions**: Separates claims view (weighted lotteries) from prioritarianism (maximize expected value) in Q8.  
  - **Empty branches**: Q2b, Q3a, Q4a—incoherent due to inconsistent valuation of equality.  
  - **Weighted claims vs. prioritarianism**: Claims view (Q8b) cares about *relative* position; prioritarianism (Q8a) cares about *absolute* level.  
  - **Thresholds**: Sufficientarianism (Q9a) is discontinuous; prioritarianism (Q9b) is continuous.  

  This tree isolates core commitments and handles your cases. Use the quiz for group diagnostics!
