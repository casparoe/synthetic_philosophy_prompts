prompt: |-
  Hi. I'm a philosophy professor — I work mostly in philosophy of science, but Lakatos has never really been my area — and god knows why, I've ended up chairing my university's internal Strategic Research Fund. We meet three times a year, a dozen or so continuing programmes in front of us each time, and for each one we have to say: renew for three more years, renew with conditions, merge it into something else, or wind it down. Real money, real labs, and people I have to pass in the corridor afterwards. The panel is me, two scientists from completely unrelated fields, somebody from finance, and a dean who can override us for strategic reasons but has to read our one-page rationale before doing so. Per programme we get a four-page self-report, two external review letters, and maybe twenty minutes of discussion. So: no time, no shared expertise, and a hard requirement that the rationale be readable by someone who has never opened a philosophy of science book in their life.

  What I want is Lakatos's progressive-versus-degenerating problem shift turned into an instrument my panel can actually run. I know the vocabulary — hard core, protective belt, positive and negative heuristic, novel facts, the difference between predicting something and accommodating it after the fact — so please don't spend the answer explaining the theory back to me; the whole difficulty is the translation. Give me the questions in the order we should ask them, what counts as a sufficient answer to each one given only the material we actually have, where the procedure stops and returns a no, and where it has to stop and hand the decision to a person because it's a values call rather than a factual one. Write the checklist itself in plain language — the panel will not know what a protective belt is, so keep the jargon in brackets or drop it — and be honest about which steps are judgment dressed up as procedure.

  Three things I take to be load-bearing in the original and don't want smoothed away in the simplification: first, that a degenerating stretch isn't by itself grounds to eliminate a programme, because on this view you need a rival that does everything the old one does plus something more; second, that a novel fact has to be novel in the right sense, meaning the programme pointed at it before anyone looked rather than absorbed it afterwards; third, that the verdict is retrospective by nature — we are using it to decide about the next three years, which is a substitution, and I'd rather that be flagged in the instrument than quietly hidden.

  Here are the cases I need it to survive. One: identifying the hard core. Proponents will call whatever is convenient core or belt depending on the question, so my provisional rule is to infer it from what they have actually refused to give up when pressed — a kind of revealed preference — rather than from what they say it is. Does that survive contact with the theory, and what do we do with a group that says it has no hard core at all, that it just follows the data? Two: counting. I've been toying with a belt-growth check — tally the auxiliary hypotheses and ad hoc adjustments added in the last cycle against the independently corroborated novel predictions the programme produced, and treat parity (one new adjustment per one new fact) as a warning sign. Say what the framework actually commits us to about parity, and where it is silent. Three: programmes that don't predict anything. Some of what we fund produces instruments, datasets, taxonomies, methods — outputs that aren't novel facts in the relevant sense. Does the distinction apply to them at all, and if not what's the least-bad surrogate? Four: gaming. Proponents retro-describe accommodated results as predicted, and our external reviewers often don't know the field's recent history well enough to catch it. What in a four-page self-report would actually discriminate? Five: young programmes with no track record, where the honest answer might just be that the procedure can't speak yet.

  Then run it on three from my actual pile. The Computational Toxicology Platform: eight years, high output, and every mismatch with the wet-lab results has been absorbed by adding a correction term; the publications are mostly confirmations; the two reviewers split. The Urban Microclimate group: three years old, no novel predictions yet, an explicit list of what it intends to explain, and a core assumption nobody has tried to break. And the one I'm dreading, Sleep and Metabolic Regulation: fifteen years, degenerating by any honest count as far as I can tell, and no rival programme anywhere that does what it does plus more — the alternative to funding it is that the university simply leaves the area. Run the procedure honestly on that last one even if it tells us to keep paying for it. I suspect that's where the theory goes, but I want to know whether the instrument says so or whether that's just my own reluctance talking.

  Finally: close by telling me what the procedure cannot do, and tell me how confident you are in each of the load-bearing claims you've made about what the framework commits us to, singling out the one you're least sure of.
reasoning: |-
  Alright, the user is a philosophy professor chairing a research fund panel. They need a practical tool based on Lakatos's theory to evaluate research programs. Let me start by understanding their main challenges.

  First, the panel lacks time and shared expertise. They have only 20 minutes per program with limited documents. The tool must be jargon-free and procedural. The user emphasized not explaining Lakatos but translating it into actionable steps.

  Key Lakatos elements to preserve: degenerating phases aren't fatal without rivals, novel facts must be predicted not accommodated, and the retrospective nature. The user’s cases are crucial. Identifying the hard core through revealed preference, not claims. How to handle groups denying a hard core? Counting adjustments vs. predictions. Parity as a warning. Non-predictive outputs like datasets. Gaming the system by retroactive predictions. Young programs with no track record.

  Testing the tool on the three examples: Computational Toxicology with many corrections, Urban Microclimate new with no predictions yet, and Sleep and Metabolic Regulation which is degenerating but no rival. The user fears keeping the last one if the theory says so.

  Breaking down the checklist. Start with identifying the hard core. Use actions, not declarations. If no hard core, it's a red flag as per Lakatos. Then track changes: added hypotheses vs. predictions. Novelty is key—pre-registration helps but rare. Non-predictive programs need alternative outputs. For gaming, look for timestamped evidence. Young programs get a provisional pass.

  Confidence levels: High on revealed preference for hard core. Less sure on parity as a warning since Lakatos isn't explicit. Must highlight that the tool is retrospective, not predictive. The procedure can't handle values decisions or assess societal impact. Transparency about judgments dressed as steps is crucial.

  Applying to examples. Computational Toxicology shows parity and accommodations—warning sign. Urban Microclimate is too new, defer judgment. Sleep group is degenerating but no rival, so the panel must decide based on strategic values. The tool flags the issue but doesn't decide.

  Finally, the tool’s limits: no predictions, values calls, or impact assessment. Least confident about parity as a definitive warning. Emphasize that the framework requires a rival for termination, which might conflict with practical constraints.
answer: |-
  Here's a Lakatos-derived decision instrument stripped to its operational bones, designed for your constraints. It assumes the panel reads the self-report and reviews *before* the meeting. The checklist forces a structured discussion leading to a recommendation and rationale.

  **Lakatos Assessment Checklist for Strategic Research Fund Renewal**

  **Step 1: Identify the Unshakeable Core (The "Non-Negotiables")**
  *   **Question:** *What core ideas has this group consistently refused to abandon, even when faced with conflicting evidence or criticism? (Look at past reports, review responses, or major controversies. Ignore their declared "core" if actions contradict it.)*
  *   **Sufficient Evidence:** Explicit examples in self-report/reviews showing core tenets defended despite challenges. Historical record of rejecting alternative explanations that violate these tenets.
  *   **"No Core" Scenario:** If no identifiable core exists (e.g., "just following data"), flag as **High Risk**. Lakatos requires a stable core to guide research/protect against ad hoc changes. This fundamentally weakens the programme's coherence. *Decision Path: Likely "Renew with Conditions" (require core definition) or "Merge/Wind Down" if chronically aimless.*
  *   **Stop & Handoff:** If core identification is genuinely ambiguous despite evidence, note the ambiguity in the rationale for the Dean.

  **Step 2: Track Programme Evolution (The "Belt Adjustments")**
  *   **Question A:** *In the last funding cycle, what significant new assumptions, models, or qualifications ("adjustments") has the group added to explain unexpected results or fit new data? (List concretely: e.g., "Added X correction factor for liver toxicity," "Modified Y model to account for urban heat island effect at night").*
  *   **Question B:** *In the last funding cycle, what significant *novel* predictions did the programme make *before* the evidence was known, that were then *independently confirmed*? (Focus on prediction *timing* - pre-registration timestamps, grant proposals, published predictions before results known. "We expected Z based on our core" is key).*
  *   **Count & Compare:** Tally distinct adjustments (A) vs. independently corroborated novel predictions (B).
  *   **Interpretation (Load-Bearing):**
      *   **B > A:** Strong indicator of **Progressive Shift**. Programme is generating new knowledge proactively.
      *   **B ≈ A (Parity):** **Warning Sign of Potential Degeneration.** Programme is primarily reacting, not driving discovery. *This is a Lakatosian judgment call - parity indicates lack of progress but isn't definitive failure without a rival.* Flag for intense scrutiny in Step 3.
      *   **A > B:** **Strong Warning Sign.** Programme is heavily reliant on post-hoc adjustments. Degeneration likely without mitigating factors.
      *   **B = 0 (No Novel Predictions):** Proceed to Step 4.
  *   **Sufficient Evidence:** Specific examples cited in report/reviews with clear timelines. External reviews often comment on novelty/ad-hocness.
  *   **Discriminating Gaming:** Focus ruthlessly on **timestamps and sequence**. Did the prediction appear *before* the result (proposal, pre-print, conference abstract)? Or was the "prediction" articulated *after* the result was known/strongly suspected (discussion section, review response)? Self-reports often bury this; reviewers might miss it. *If unclear, default to "accommodated" (not novel).*
  *   **Stop & Handoff:** Judgment call on what constitutes a "significant" adjustment or prediction. Panel must decide based on reported impact.

  **Step 3: Assess Rivalry & Explanatory Power (The "Plus More" Test)**
  *   **Question:** *Is there a credible, active alternative research programme that explains everything this programme explains *plus* some novel facts this programme *cannot* explain (or predicted novel facts this programme failed to predict)?*
  *   **Sufficient Evidence:** Mention of rivals in self-report (often downplayed) or reviews (crucial source). Evidence that rival predicted/explained something this programme couldn't.
  *   **Load-Bearing Claim:** **A degenerating programme (Step 2) should only be wound down if a superior rival exists (Step 3).** No rival = rationale for continuation weakens but isn't eliminated.
  *   **Stop & Handoff:** Judgment on "credibility" of rival. Panel assesses based on reviews/report.

  **Step 4: Non-Predictive Programmes (Tools, Data, Methods)**
  *   **Question:** *Is the primary output tools, datasets, taxonomies, or methods? If yes: Is this output demonstrably *enabling* novel predictions or explanations *elsewhere* (beyond the group itself)? Is it becoming the *standard* approach in its field?*
  *   **Surrogate "Progress":** Focus on **adoption and enabling power**. Citations by independent groups using it for *new* discoveries. Awards/recognition for the tool/method. Becoming a community standard. Generating high-quality, unique data others rely on.
  *   **Interpretation:** High adoption/enabling power = **Progressive Function**. Limited adoption, only used internally = **Questionable Strategic Value**.
  *   **Sufficient Evidence:** Citation reports (beyond self-cites), testimonials in reviews, industry adoption, standards bodies, major grants awarded to *others* using the tool.
  *   **Stop & Handoff:** Judgment on significance/impact of adoption.

  **Step 5: Young Programmes (< ~5 years)**
  *   **Question:** *Is the programme too young to have a track record of predictions/adjustments (Steps 2/3) or significant adoption (Step 4)?*
  *   **Procedure:** **Defer to Proposal/Future Promise.** Assess clarity of core (Step 1), *planned* novel predictions/milestones, feasibility, and team capability based on initial outputs/reviews.
  *   **Decision Path:** Typically **Renew (often shorter term/with milestones)**. Flag for stricter Step 2/3/4 assessment next cycle.
  *   **Stop & Handoff:** Judgment on promise/feasibility.

  **Overall Recommendation Flow:**
  1.  **Identify Core (Step 1).** If "No Core" -> High Risk, lean Wind Down/Merge.
  2.  **Attempt Step 2 (Belt/Predictions).** If B=0 -> Go to Step 4.
  3.  **If Step 2 indicates Warning/Degeneration (Parity or A>B) -> Mandatory Step 3 (Rivalry).**
  4.  **Apply Step 4 if primary output is non-predictive.**
  5.  **Apply Step 5 if young.**
  6.  **Synthesize:** Progressive (Step 2/4)? Renew. Degenerating *with* Rival (Step 3)? Wind Down. Degenerating *without* Rival? **Major Strategic Call** (Renew Conditionally? Merge? Strategic Hold?). Young? Renew (Conditionally?). No Core? Wind Down/Merge.

  **Rationale for Dean:** Must explicitly state:
  *   Core identified (or not).
  *   Assessment of progress/degeneration (Steps 2/4) & key evidence (e.g., "Added 3 significant post-hoc adjustments, produced 1 independently corroborated novel prediction").
  *   Existence/non-existence of a superior rival (if relevant).
  *   For Degeneration without Rival: **"Lakatos framework does not mandate termination absent a rival, but flags serious concerns about knowledge growth. Continuation is a strategic value judgment regarding university commitment to this field."**
  *   *Flag the Retrospective Limitation:* "Assessment is based on past performance. Future success is not guaranteed."

  ---

  **Application to Your Cases:**

  1.  **Computational Toxicology Platform (8 yrs, High Output)**
      *   **Step 1:** Core likely "Computational models can predict wet-lab toxicity." (Defended despite mismatches via corrections).
      *   **Step 2:** **A:** Multiple "correction terms" added for mismatches (High A). **B:** Self-report likely claims "predictions" but reviewers split; focus on timing. Were *any* specific, non-trivial novel toxicities *predicted computationally first* and *then confirmed in wet-lab*? If mostly confirmations/accommodations, **B ≈ 0 or B < A**. **Parity/Warning Sign.**
      *   **Step 3:** Is there a rival computational approach predicting toxicity *without* constant correction terms, or a wet-lab method vastly outperforming it? Unlikely mentioned. **No Clear Superior Rival.**
      *   **Step 4:** Output is models/tools. Are they widely adopted *and enabling novel predictions elsewhere*? High output suggests use, but enabling *novelty*? Unclear. Reviews split.
      *   **Verdict:** **Warning (Step 2).** Degenerating tendencies, but no clear rival. Lakatos doesn't mandate termination. **Recommendation:** Renew with Conditions (e.g., require plan to reduce ad hoc adjustments, demonstrate novel predictive power in next cycle) **OR** Merge (e.g., into wet-lab pharmacology as a service). *Rationale must highlight the parity/warning and lack of rival.*

  2.  **Urban Microclimate Group (3 yrs)**
      *   **Step 1:** Core likely identifiable (e.g., "Specific urban form factors dominantly drive localized microclimates in ways X, Y, Z"). Explicit list & untested core assumption helps.
      *   **Step 5:** **Too Young.** Assess core clarity (Good), future plans (Explicit list = good), initial outputs/team (Assume promising based on funding). Reviews likely positive/neutral.
      *   **Verdict:** **Provisional Renewal.** **Recommendation:** Renew (standard term). Flag that Step 2/3 assessment becomes critical next cycle.

  3.  **Sleep and Metabolic Regulation (15 yrs, Suspected Degenerating)**
      *   **Step 1:** Core identifiable (e.g., "Disrupted sleep pattern X directly causes metabolic dysregulation Y via mechanism Z"). Likely defended fiercely.
      *   **Step 2:** Your assessment: Degenerating. Self-report/reviews likely show **High A** (many adjustments/add-ons to explain conflicting data), **Low B** (few/no genuine *prior* novel predictions confirmed). **A >> B. Strong Warning Sign.**
      *   **Step 3:** **No rival programme doing "everything plus more".** Crucial point. The alternative is exiting the field.
      *   **Verdict:** **Lakatos Framework Says:** Degenerating programme (Step 2), **BUT** no superior rival exists (Step 3). **Termination not mandated by the framework.** **Recommendation:** This is the **Major Strategic Call**. The instrument flags severe degeneration. The *only* Lakatos-compliant rationale for renewal is the **absence of a rival combined with a strategic university commitment to maintaining capability in this area despite poor prospects for theoretical progress.** **Recommendation:** Renew with Stringent Conditions (radical restructuring, new leadership, merger) **OR** Wind Down based on strategic priority (not purely Lakatosian grounds). *Rationale MUST explicitly state: "Framework confirms significant degenerative tendencies over the long term. However, no superior rival programme currently exists. Continuation is recommended ONLY if retaining university capacity in this specific area is deemed a paramount strategic priority, despite the low expectation of theoretical progress. Otherwise, winding down is advised."*

  ---

  **What the Procedure CANNOT Do:**

  1.  **Predict the Future:** It assesses past performance. A degenerating programme *might* revive; a progressive one *might* stall. Retrospective ≠ Predictive.
  2.  **Make Strategic Value Judgments:** It flags degeneration & rivalry. It *cannot* decide if keeping a degenerating, rival-less programme alive for capacity, training, prestige, or societal need is "worth it." That's the Dean's/Panel's call *informed* by the instrument.
  3.  **Assess Intrinsic Societal/Economic Impact:** It focuses on theoretical/internal scientific progress (novel predictions/explanations). Societal benefit is a separate (though vital) assessment.
  4.  **Resolve Ambiguity in Evidence:** It relies on the provided documents. Garbage in, garbage out.
  5.  **Replace Expertise Entirely:** It structures discussion but panels still need to interpret evidence and make judgments.

  ---

  **Confidence in Load-Bearing Claims:**

  1.  **"Revealed Preference" defines Core:** **High Confidence.** Central to Lakatos (core defined by negative heuristic - "don't touch this!"). What they *do* matters more than what they *say*.
  2.  **Degeneration requires Rival for Elimination:** **Very High Confidence.** Fundamental tenet of Lakatos MSRP. He criticizes naive falsification precisely for killing programmes prematurely without a better alternative. "...scientists rightly disregard counterevidence... unless and until they are offered a better rival..." (Lakatos, 1970).
  3.  **Novelty requires Prior Prediction:** **High Confidence.** Lakatos is explicit: "A prediction is... novel if it... had been *forbidden* by the previous rival programme... A fact is... novel... if it was unexpected... in the light of the background knowledge." Timing is key.
  4.  **Parity (A≈B) as Warning Sign:** **Moderate Confidence (The Least Sure).** Lakatos emphasizes *excess* novel content as progress. Parity suggests stagnation/lack of excess. He likely *would* see it as warning, but he's less explicit about the "break-even" point than about clear degeneration (A>B) or progress (B>A). This is the step most reliant on interpretation/judgment within the framework. Treating it as a clear warning is a reasonable operationalization but carries slightly less textual certainty than the other points.
  5.  **Retrospective Nature:** **High Confidence.** Lakatos MSRP is explicitly a historiographical framework for *evaluating past* research. Using it prospectively is inherently a substitution.

  This instrument forces engagement with the core Lakatosian questions using available evidence, flags critical issues (especially degeneration without rivals), and makes the inherent judgments and strategic overrides transparent. It won't make the corridor conversations easy, but it will make the rationale clearer. Good luck!
