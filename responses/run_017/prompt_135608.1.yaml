prompt: |-
  Right — I'm rebuilding the first session of my MA seminar on human enhancement, and I've decided I don't want to open with the usual therapy-vs-enhancement tableau (growth hormone for the short kid, Ritalin for the kid who can't sit still, cochlear implants, steroids, the lot), because every year the students just sort the cases by gut and then reverse-engineer a principle, and every year the principle falls apart on the fourth example. So this year I want the spec first: what a theory of the therapy/enhancement distinction would have to be able to do in order to be *good enough for a specific job*.

  Fix the job as this: the theory has to be usable by a reimbursement committee in a tax-funded single-payer system — people who get real claim forms, have to say yes or no (or maybe yes-but-tiered), and cannot appeal to a contested conception of the good life in their published reasons. Secondary job, and I want you to tell me whether it can be the same theory: it should also say something about what the state may discourage (or quietly encourage) in people who pay out of pocket, and about what employers may require as a condition of a role.

  So: write me the desiderata. For each one give the case or consideration that motivates it — I want the case, not just the criterion — and mark it as non-negotiable or as a preference of one camp. Use these to get you going, kill any you think are bogus, and add the ones I've missed:

  - it must not classify as enhancement a bunch of things we already fund without controversy: vaccines, contraception and fertility treatment, orthodontics, prenatal vitamins, reconstructive surgery after injury or mastectomy, prevention generally. (A theory that implies statins are enhancement has failed, not revealed a surprising truth.)
  - it must cope with the fact that the very same intervention — same drug, same mechanism, same dose — is therapy in one recipient and enhancement in another, and that intentions of the prescriber don't obviously settle it either.
  - it must handle non-disease cases where the welfare gain is real and large but the "abnormal" bit is social: idiopathic short stature, or the kid born with a cleft palate in a culture that treats it as a curse.
  - here's the one I keep chewing on, and I'd like you to give it a proper name and say whether it's a genuine requirement or just egalitarian prejudice: the ratchet case. Some interventions are positional — they help you only because others don't have them, and once uptake spreads the benefit evaporates while the intervention becomes, in practice, compulsory. Height, cosmetic orthodontics, exam-focus drugs in a competitive school system, sleep-reduction drugs in a profession with 30-hour shifts. So the theory must be able to say no to something that everyone involved will experience as a need, without thereby having to call every positional good a disease. I suspect the requirement "only facts about the patient's body count" and "handles the ratchet" cannot both be had, because the ratchet is constitutively comparative.
  - it must handle the degraded-baseline cases, where the environment is what's malfunctioning: the person is functioning normally for their environment and abnormally for the species, or vice versa. Immune boosters where a pathogen is endemic, weight-loss drugs in an obesogenic food environment, air filtration, hearing protection, cognitive prosthetics for people whose jobs wreck their sleep. Can the theory admit that the environment is what's sick without sliding into "and therefore everything is therapy"?
  - it must handle trade-offs, not just improvements: interventions that raise one capacity and lower another (less sleep at the cost of emotional memory consolidation, say, or focus bought at the price of divergent thinking), so it can't just define enhancement as all-things-considered improvement.
  - it must handle cases with no prior baseline to restore — germline editing, prenatal intervention, anything where there is no "before" the person was healthy in.
  - it must handle the cases where the subject denies there's anything to fix (the Deaf-culture objection to cochlear implants is the easy version; the deep-brain-stimulation patient whose family says he's no longer himself is the hard one), and say what to do when "the patient reports no need" and "the patient's adaptive preferences have been lowered by a lifetime of exclusion" pull in opposite directions.
  - it must handle third-party benefit: the intervention that mostly helps other people (steady hands for a surgeon, alertness for a pilot, a vaccine) — is benefit-to-others a therapy-making feature, and if so does that let any occupationally useful trait become a medical need by the back door?
  - it must respect a distinction I think is load-bearing but can't state cleanly: between whether something is therapy at all, and how much we should spend on it given that it is. A theory that collapses those two will misclassify expensive-but-genuine therapies as enhancements, and cheap-but-optional ones as therapies.

  Then, and this is the part I care about most: tell me which of these are real desiderata and which are just the reflexes of one camp — the medical-naturalist wanting the account to be value-free, the luck-egalitarian wanting it to track what justice requires, the disability-studies side wanting it to be socially constructed all the way down, the administrator wanting binary verdicts. And tell me which subset is jointly unsatisfiable: I have a suspicion that "descriptive rather than evaluative" plus "determinate enough for a real committee to apply" plus "gets the ratchet right" is a set of three where you can have any two, and I want you to argue me out of it or into it. Finally, the single requirement that does the most exclusionary work — which one would knock out the most of the usual candidates?

  At the end, three lines each on how the main contenders do — wellbeing/welfare-based accounts, normal-function or biostatistical accounts, and fair-equality-of-opportunity style accounts, plus whichever of the "it's all a continuum, we should just do cost-benefit" views you think is strongest. Three lines, not a table, and don't pad it: the criteria are the assignment, the scoring is a footnote. And skip the literature, skip the reading list, skip defining the basic distinction — I do that bit in the first ten minutes and I've got it covered.
reasoning: |-
  Okay, let me approach this systematically. The user is redesigning an MA seminar on human enhancement and wants to shift focus from case-based intuition to functional desiderata for a theory of the therapy/enhancement distinction. The core challenge is defining criteria that would make such a theory usable by a reimbursement committee in a single-payer system, with secondary applications to private-sector regulation.

  First, I need to validate the user's frustration with traditional approaches. Their observation that students reverse-engineer principles from cases only to have them collapse under scrutiny resonates with pedagogical reality. The pivot to "what must a theory do to be fit-for-purpose" is astute - it frames the distinction as a tool rather than a truth.

  Now examining the proposed desiderata. The non-negotiable "Established Coverage Constraint" (vaccines, statins etc.) seems bedrock - any theory rejecting current consensus would be politically nonviable. The "Same Intervention Variance" requirement feels equally fundamental since real committees encounter identical treatments across contexts. 

  The "Ratchet Effect" dilemma is particularly thorny. The user's suspicion that bodily-focused and ratchet-aware criteria conflict appears justified - positional goods like height drugs create collective action problems that resist individual assessment. This might necessitate separating the reimbursement theory from the regulatory theory.

  For the degraded baseline cases (obesogenic environments, endemic pathogens), I note the user wants to acknowledge environmental pathology without universalizing therapy. This suggests the need for "environmental normalcy" parameters - perhaps defining functional ranges relative to reasonably modifiable contexts rather than species-typical or local norms.

  On contested requirements: The "Subject Denial" criterion seems essential clinically but may belong to a different framework (consent/assent protocols) rather than the therapy/enhancement distinction itself. The "Third-Party Benefit" problem could be mitigated by requiring primary beneficiary designation - though occupational demands will still blur lines.

  Key tensions emerge between:
  - Descriptive purity vs. administrative applicability
  - Bodily integrity vs. social construction
  - Individual benefit vs. collective consequences

  The "determinate enough for committees" requirement likely excludes strongly constructivist views, while "handling the ratchet" excludes rigidly biomedical models. Welfare-based accounts might bridge this but struggle with counterfactual baselines.

  For exclusionary power, the "Established Coverage Constraint" alone would eliminate most philosophical theories, while the "Ratchet Requirement" filters out individualistic approaches. A hybrid theory seems inevitable - perhaps defining therapy as interventions restoring function within two standard deviations of the population mean for that age group in a reference environment, excluding positional goods.

  The user's three-line constraint on evaluating theories is brutal but useful. Biostatistical accounts fail the ratchet test. Welfare theories founder on baseline issues. Opportunity-based approaches handle social determinants well but overmedicalize. Cost-benefit pragmatism wins on applicability but loses on principled distinctions.

  Final insight: No theory satisfies all desiderata because the committee's need for bright lines conflicts with the phenomenon's contextual nature. The seminar's value may lie in exposing that irreducible tension.
answer: |-
  Here are the desiderata for your theory, structured as requested, with cases motivating each, negotiation status, and analysis of tensions/exclusions. I've refined your list, added missing criteria, and flagged ideological reflexes.

  ### Core Desiderata (Non-Negotiable for Reimbursement Committee Use)
  1. **Established Coverage Constraint**  
     *Case:* Vaccines prevent disease; statins manage cholesterol; reconstructive post-mastectomy restores form/function.  
     *Why non-negotiable:* A theory rejecting these as "enhancement" would collapse political legitimacy.  

  2. **Same Intervention, Different Status**  
     *Case:* Testosterone for hypogonadism (therapy) vs. athletic performance (enhancement); SSRIs for clinical depression vs. subclinical anxiety.  
     *Why non-negotiable:* Committees see identical claims across contexts; must distinguish without relying on intent.  

  3. **Socially Mediated Dysfunction**  
     *Case:* Idiopathic short stature in a society valuing height; cleft palate where stigma causes psychological harm.  
     *Why non-negotiable:* Welfare loss is real but rooted in social norms; theory can’t ignore harm by labeling it "not biological."  

  4. **Degraded Environmental Baselines**  
     *Case:* Air filtration for asthma in high-pollution cities; ADHD accommodations in open-plan offices.  
     *Why non-negotiable:* "Normal species functioning" fails when environments are toxic; theory must acknowledge exogenous drivers without universal therapy (e.g., not *every* urbanite gets state-funded filters).  

  5. **No Prior Baseline Cases**  
     *Case:* Germline editing to prevent Huntington’s; prenatal folate to prevent spina bifida.  
     *Why non-negotiable:* Cannot require restoration of a pre-existing state for embryos/fetuses.  

  6. **Separation of Status vs. Cost-Effectiveness**  
     *Case:* Gene therapy for cystic fibrosis (expensive therapy) vs. cheap caffeine pills for exam focus (low-cost enhancement).  
     *Why non-negotiable:* Committees tier coverage *after* establishing medical necessity; collapsing the two distorts equity.  

  ---

  ### Contested Desiderata (Required but Ideologically Loaded)
  7. **The Ratchet Effect (Positional Goods)**  
     *Case:* Cosmetic orthodontics in a competitive job market; cognitive enhancers in elite universities.  
     *Motivation:* Prevents arms races where collective adoption erases benefits while imposing costs.  
     *Ideological Reflex:* Egalitarian (worries about coercion).  
     *Viability:* Requires comparative analysis, conflicting with "only body facts" criteria. **Likely incompatible with purely biomedical theories.**  

  8. **Trade-Off Acceptance**  
     *Case:* Amphetamines improving focus but impairing creativity; sleep-reduction drugs sacrificing long-term health.  
     *Motivation:* Avoids defining enhancement as "net benefit," which is often subjective.  
     *Ideological Reflex:* Medical-conservative (prioritizes safety/holism).  

  9. **Subject Denial & Adaptive Preferences**  
     *Case:* Deaf community rejecting cochlear implants; depression patient refusing treatment due to hopelessness.  
     *Motivation:* Respects autonomy but acknowledges distorted self-assessment.  
     *Ideological Reflex:* Disability studies (social model) vs. medical paternalism.  

  10. **Third-Party Benefit Delimitation**  
     *Case:* Propranolol for a surgeon’s tremor (therapy with societal benefit) vs. modafinil for a trader’s alertness (private gain).  
     *Motivation:* Prevents occupational demands from medicalizing all performance traits.  
     *Ideological Reflex:* Libertarian (resists "job as disease" creep).  

  ---

  ### Bogus/Omitted Criteria Rejected or Added
  - ❌ **"Intentions Matter"**: Rejected – prescriber intent is irrelevant to whether an intervention *is* therapy (e.g., Ritalin for ADHD vs. studying).  
  - ✅ **Added: Non-Ideal Agency Constraint**  
    *Case:* Steroids for body dysmorphia; unregulated cognitive enhancers.  
    *Motivation:* Theory should guide state discouragement of privately funded interventions with high social costs (e.g., addiction risk, ratchet effects).  
  - ✅ **Added: Temporal Stability**  
    *Case:* Sudden shifts in disease classification (e.g., obesity as "cosmetic" vs. metabolic illness).  
    *Motivation:* Committee rulings need consistency; theory can’t fluctuate with cultural change.  

  ---

  ### Analysis of Tensions & Exclusionary Power
  - **The Trilemma**: "Descriptive" + "Determinate for committees" + "Handles ratchet" **is unsatisfiable**.  
    - *Why:* Ratchet effects require evaluative judgments about social consequences (e.g., "this entrench inequality"), violating descriptive purity. Determinate rules demand bright lines (e.g., "fixes deviation >2 SDs"), but ratchets operate on margins (e.g., "above average").  
    - **You can have two**: A determinate descriptive theory (e.g., biostatistical) ignores ratchets. A descriptive theory tracking ratchets (e.g., "prevents competitive disadvantage") becomes vague. A determinate ratchet-sensitive theory (e.g., "bans positional goods") is evaluative.  
  - **Most Exclusionary Desideratum**: **Ratchet Effect**. Knocks out:  
    - Biostatistical (ignores social dynamics)  
    - Simple welfare (positional gains are "welfare" for users)  
    - Strict medical naturalism (ratchet is societal)  
  - **Ideological Camps**:  
    - *Medical-Naturalist*: Wants 1,2,4,5,8; rejects 7,9.  
    - *Luck-Egalitarian*: Prioritizes 3,7,10; minimizes 5.  
    - *Disability Studies*: Demands 3,9; rejects 1 if "normalizing."  
    - *Administrator*: Needs 1,6, temporal stability; fears 7,9.  

  ---

  ### Theory Assessment (3 Lines Each)
  - **Biostatistical (Normal Function)**: Fails ratchet (7), socially mediated dysfunction (3), trade-offs (8). Strong on 1,2,5,6. Determinate but descriptively thin.  
  - **Welfare/Wellbeing**: Handles 3,7,8,9 via subjectivism. Fails 1 (may reject statins if wellbeing unchanged), 6 (costly therapies = enhancement), and 10 (all occupational gains are welfare). Vague for committees.  
  - **Fair Equality of Opportunity (FEO)**: Excels on 3,7,10. Struggles with 1 (is contraception "opportunity?"), 4 (environmental baselines unclear), and 5 (embryos lack opportunities). Evaluative but policy-ready.  
  - **Cost-Benefit Pragmatism**: Accepts continuum, prioritizes 6,10. Fails 1 (may exclude expensive therapies), 7 (ratchets have poor long-term ROI), and non-ideal agency (markets ignore externalities). Administratively tidy but ethically hollow.  

  **Strongest Contender**: **FEO** (despite evaluative nature). It handles social determinants (3), ratchets (7), and third-party benefit (10) while offering actionable criteria for committees ("restores competitive range for key opportunities"). Requires accepting that *no theory is value-free*.
