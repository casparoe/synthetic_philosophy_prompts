          - Yes: Relational egalitarianism. (Awkward: Might prefer equalizing prospects even when it lowers expected welfare, if it improves social relations.)
          - No: Level 5: Is there a threshold of enough such that priority is given to those below it, and above it inequality doesn't matter?
               - Yes: Sufficientism. (Awkward: Might allow large inequalities above the threshold.)
               - No: Level 6: Should we always assign greater value to a benefit the worse off the person is?
                    - Yes: Prioritarianism. (Awkward: Might favor helping the well-off worse off over the absolutely worse off if the well-off worse off is relatively worse.)
                    - No: Utilitarianism. (Awkward: Might allow sacrificing the worse off for the greater total good.)

  Note: The prioritarianism leaf might be indistinguishable from sufficientism when the threshold is high and the population is mostly below it, but in the tree they are split by the threshold question.

  Also, relational egalitarianism might not always say yes to the prospects case, but we assume that in some interpretations they might.

