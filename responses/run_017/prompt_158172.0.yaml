  ### Taxonomy of Distributive Justice Views: Leveling-Down Objection  
  *Logical space defined by five concrete cases. Each branch splits views based on responses, with leaves showing positions and their most awkward commitments. Positions must fit; unnamed leaves are included where necessary. Collapses noted.*

  #### Branching Questions (Cases)  
  1. **Hurricane Leveling-Down**: A hurricane destroys the surplus of the better-off half, leaving everyone worse off but equal. Is this outcome *in any way good*?  
  2. **Ignorant Inequality**: Inequality exists, but the worse-off person never learns of it, and their social standing is unaffected. Is this inequality *inherently bad*?  
  3. **Choice-Based Inequality**: Inequality is entirely due to the better-off person’s own choices (e.g., harder work, risk-taking). Is this inequality *unjust*?  
  4. **Prospects Trade-off**: A policy lowers everyone’s expected welfare but equalizes their future prospects. Is this policy *preferable* to unequal prospects?  
  5. **Nonexistence for Equality**: Equality is achieved by the better-off person not existing (e.g., removing them leaves only the worse-off person). Is this outcome *in any way better* than the unequal state?  

  #### Taxonomy Tree  
  - **Level 1: Hurricane Leveling-Down?**  
    - **Yes** → **Level 2: Nonexistence for Equality?**  
      - Yes → **Unnamed Telic Absolutism** (e.g., radical egalitarian). *Awkward: Must accept that genocide could be good if it achieves equality*. (Unexplored: Few defend this.)  
      - No → **Telic Egalitarianism** (e.g., Parfit's "simple egalitarianism"). *Awkward: Must hold leveling-down is intrinsically good, even when it harms all*.  
    - **No** → **Level 2: Ignorant Inequality?**  
      - **Yes** → **Level 3: Choice-Based Inequality?**  
        - Yes → **Deontic/Pluralistic Egalitarianism** (e.g., Rawls-inspired). *Awkward: Inequality is unjust even when it results solely from choices, ignoring responsibility*.  
        - No → **Luck/Choice Egalitarianism** (e.g., Cohen, Dworkin). *Awkward: Tiny luck-based inequalities require costly fixes, potentially harming everyone*.  
      - **No** → **Level 3: Prospects Trade-off?**  
        - **Yes** → **Relational Egalitarianism** (e.g., Anderson, Scheffler). *Awkward: May prioritize equal prospects over welfare gains if social relations improve*.  
        - **No** → **Level 4: Choice-Based Inequality?**  
          - Yes → **Sufficientism** (e.g., Frankfurt). *Awkward: Permits vast inequalities above the threshold, even if arbitrary*.  
          - No → **Level 5: Nonexistence for Equality?**  
            - Yes → *Incoherent branch*: Rejects leveling-down but endorses extinction for equality. (Unattractive: No major position fits.)  
            - No → **Sum of Benefits (Utilitarianism)** (e.g., classical Benthamism). *Awkward: May sacrifice the worse-off for greater total utility*.  

  #### Collapsed Positions  
  - **Prioritarianism vs. Pluralistic Egalitarianism/Sufficientism**: Prioritarianism (e.g., Parfit) collapses into other leaves:  
    - Near a threshold, it mirrors **Sufficientism** (both prioritize the worse-off but only if they are badly off).  
    - With weak equality weighting, it mirrors **Deontic Egalitarianism** (both balance equality against welfare).  
    - *Handling*: Prioritarianism isn't a distinct leaf; test the threshold question (Sufficientism branch) to differentiate.  
  - **"Unnamed" Leaves**: Only where logically necessary (e.g., telic absolutism).  

  #### Why Empty Cells?  
  - **Hurricane Leveling-Down? Yes → Nonexistence for Equality? Yes**: Unexplored (only hypothetical radicals).  
  - **Ignorant Inequality? No → Prospects Trade-off? No → Choice-Based Inequality? No → Nonexistence for Equality? Yes**: Incoherent (rejects leveling-down but endorses extinction).  
  - **Ignorant Inequality? No → Prospects Trade-off? No → Choice-Based Inequality? Yes**: Filled by Sufficientism.  

  ---

  ### Quiz: "Which Distributive Justice View Are You?"  
  *10 cases with options. Answer A, B, or C. Use scoring key to map to positions.*  

  1. **Hurricane Leveling-Down**: A hurricane makes everyone worse off but equal.  
     - A) This is good in one way (equality achieved).  
     - B) This isn’t good at all.  

  2. **Ignorant Inequality**: Unequal wealth, but the poorer person never knows and isn’t stigmatized.  
     - A) The inequality is still bad.  
     - B) It’s not bad.  

  3. **Choice-Based Inequality**: Inequality arises solely from one person’s harder work.  
     - A) The inequality is unjust.  
     - B) It’s not unjust (they earned it).  

  4. **Prospects Trade-off**: A policy makes everyone’s future prospects equal but worse on average.  
     - A) Preferable to unequal prospects.  
     - B) Not preferable.  

  5. **Nonexistence for Equality**: Remove a better-off person; only the worse-off remains.  
     - A) This is better in one way (equality achieved).  
     - B) Not better at all.  

  6. **Welfare-Increasing Inequality**: A policy raises total welfare but widens inequality. Social standing unchanged, all above "enough."  
     - A) Acceptable.  
     - B) Unacceptable.  

  7. **Unequal Wages, Same Welfare**: Two jobs pay differently, but non-wage benefits make overall welfare equal.  
     - A) The pay inequality is still bad.  
     - B) It’s not bad (welfare matters).  

  8. **Costly Luck Fix**: Fix a small luck-based inequality at great welfare cost.  
     - A) Required.  
     - B) Not required.  

  9. **Priority Test**: Help a worse-off person (gain 1 util) or a better-off person (gain 3 utils).  
     - A) Help the worse-off.  
     - B) Help the better-off.  

  10. **Threshold Sacrifice**: Lift one person from below to above "enough," but another falls below.  
      - A) Do it (sufficiency matters most).  
      - B) Don’t (net welfare loss).  

  #### Scoring Key  
  Submit answers (e.g., 1A, 2B, ...). Use this map:  

  | If your pattern matches:                     | Your view is:                      | Awkward commitment reminder:                                 |  
  |---------------------------------------------|-----------------------------------|------------------------------------------------------------|  
  | **1A + 5A**                                 | Unnamed Telic Absolutism          | Genocide for equality can be good.                         |  
  | **1A + 5B**                                 | Telic Egalitarianism              | Leveling-down is intrinsically good.                       |  
  | **1B + 2A + 3A**                            | Deontic/Pluralistic Egalitarianism| Inequality unjust even when earned by choices.             |  
  | **1B + 2A + 3B**                            | Luck/Choice Egalitarianism        | Must fix tiny luck-based inequalities at any cost.         |  
  | **1B + 2B + 4A**                            | Relational Egalitarianism         | May trade welfare for equal prospects to aid social ties. |  
  | **1B + 2B + 4B + 3A**                       | Sufficientism                     | Allows massive inequalities above "enough."                |  
  | **1B + 2B + 4B + 3B + 5B + (9A or 10A)**    | Prioritarianism*                  | Helps relatively worse-off over absolutely needy.          |  
  | **1B + 2B + 4B + 3B + 5B + (9B or 10B)**    | Sum of Benefits (Utilitarianism)  | Sacrifices worse-off for greater total good.               |  

  \* *Prioritarianism collapses: If 9A/10A, it aligns with Sufficientism near thresholds; if 3A, with Deontic Egalitarianism. Test 6A/B to confirm: Utilitarians (6A) accept welfare trade-offs; Prioritarian/Sufficientists (6B) reject if it harms worse-off.*  

  **If answers don’t land cleanly**:  
  - **Inconsistent patterns** (e.g., 1A + 2B): Re-examine cases; you may hold a hybrid view (e.g., telic with relational constraints).  
  - **Borderline cases** (e.g., 3A + 4B + 5B): Likely between Deontic Egalitarianism and Sufficientism; check if you endorse a threshold (Q6).  
  - **"Unexplored" cells** (e.g., 1A + 5A): Radical position; read literature on telic extremism.  

  ---  
  **Format note**: This fits one A4 page when set in 10pt font. Tree depth: 5 levels (max). Leaves: 8 named + 1 unnamed. Quiz allows scoring ambiguity to avoid forced distinctions. Cases are concrete and odd (e.g., hurricane, extinction), aligning with your request.
