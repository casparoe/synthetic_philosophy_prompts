  ### Brainstorming Candidate Rules

  To infer Dev's underlying rule for when "symbols shove the substrate around," I'll start by analyzing his eight verdicts. His key pattern seems to hinge on whether symbols have causal efficacy beyond mere substrate dynamics—i.e., whether they "do work" in a way that isn't reducible to low-level physics without loss of explanatory power. He rejects intervention-based tests (e.g., "wiggle the symbol while holding the substrate fixed") because symbols and substrate are inseparable, so causal claims must be grounded in the system's intrinsic dynamics. 

  From his cases, I derive four candidate rules. Each must satisfy:
  - **Case 1 (Hofstadter table): YES** – Symbols (clumps) interact autonomously; walls driven externally.
  - **Case 2 (Frozen table): NO** – Static; no dynamics.
  - **Case 3 (Recording table): NO** – Diary is formed but unused; "symbols are just weather."
  - **Case 4 (Rock with manual): NO** – Arbitrary external mapping; symbols not intrinsic.
  - **Case 5 (Guy shuffling slips): YES** – Slips drive actions via rulebook, regardless of understanding.
  - **Case 6 (Clerk with lookup book): YES** – Book symbols drive clerk's output, even though passive.
  - **Case 7 (Laptop simulation): YES** – Substrate-independent implementation.
  - **Case 8 (Turbulence coincidence): NO** – Accidental alignment; not sustained or functional.

  #### Candidate Rule 1: **Autonomous Dynamics and Robustness**
  Symbols shove the substrate if they exhibit *autonomous, robust higher-level dynamics*: the system's future coarse state is reliably predictable from its current coarse state without tracking fine details, and this autonomy persists under small perturbations. Symbols must be "in the driver's seat" of the system's behavior.
  - **Case 1:** YES – Clumps interact predictably; robust.
  - **Case 2:** NO – Frozen; no dynamics.
  - **Case 3:** NO – Diary may form predictably, but unused; no autonomy in a functional sense.
  - **Case 4:** NO – Mapping imposed; no intrinsic dynamics.
  - **Case 5:** YES – Slips evolve via rules; state predicts next state.
  - **Case 6:** YES? – Book is static, but clerk-book system has output-driven dynamics; borderline (predictability is in clerk's actions, not book alone).
  - **Case 7:** YES – Simulation has autonomous dynamics.
  - **Case 8:** NO – Not robust or sustained.
  - **Weakness:** Struggles with Case 6 (static book) and risks over-including physical systems with emergent patterns but no symbolic function.

  #### Candidate Rule 2: **Program Implementation**
  Symbols shove the substrate if the system *implements a program*: it physically instantiates rules for symbol manipulation, such that symbol transitions are counterfactually dependent on symbol states (e.g., if symbols were different, the substrate would behave differently). The program must be non-accidental and actively executed.
  - **Case 1:** YES – Clumps follow "rules" of interaction.
  - **Case 2:** NO – No execution.
  - **Case 3:** NO – Diary isn't processed; no program.
  - **Case 4:** NO – Manual is external; no internal execution.
  - **Case 5:** YES – Rulebook defines program; guy executes it.
  - **Case 6:** YES – Lookup procedure is a program; clerk executes it.
  - **Case 7:** YES – Software implements program.
  - **Case 8:** NO – Accidental; not programmed.
  - **Weakness:** May be too broad (e.g., simple physical laws could qualify as "programs"), but Dev's "no" to Case 8 suggests he requires intentional or functional implementation.

  #### Candidate Rule 3: **Functional Utilization in a Causal Loop**
  Symbols shove the substrate if they are *functionally utilized in a causal loop*: they play a role in processing inputs to produce outputs, and this role is essential to a larger informational process (e.g., cognitive or computational). Symbols must be "read" and used to influence behavior within the system or its environment.
  - **Case 1:** YES – Clumps process wall inputs via interactions.
  - **Case 2:** NO – No utilization.
  - **Case 3:** NO – Unread diary; no utilization.
  - **Case 4:** NO – Not utilized; external mapping.
  - **Case 5:** YES – Slips used for shuffling; part of input-output loop.
  - **Case 6:** YES – Book used for lookup; symbols drive output.
  - **Case 7:** YES – Simulation processes inputs.
  - **Case 8:** NO – No utilization; coincidence.
  - **Weakness:** Must clarify "utilization"—e.g., Case 6's book is passive but still "used," so the loop can be open (output to environment) if symbols are functionally engaged.

  #### Candidate Rule 4: **Non-Arbitrary Symbolic Role**
  Symbols shove the substrate if they have a *non-arbitrary, fixed interpretive role* in a representational system: the mapping from substrate to symbols is intrinsic, stable, and essential to the system's function, not imposed externally or trivially redefinable. Symbols must be more than patterns; they must carry information in a way that is causally relevant.
  - **Case 1:** YES – Clumps intrinsically represent; role is fixed.
  - **Case 2:** NO – No role.
  - **Case 3:** NO – May form a "diary," but no functional role.
  - **Case 4:** NO – Mapping arbitrary; not intrinsic.
  - **Case 5:** YES – Slips have fixed role by rulebook.
  - **Case 6:** YES – Book has fixed role for addition.
  - **Case 7:** YES – Symbols have fixed computational role.
  - **Case 8:** NO – Accidental; no stable role.
  - **Weakness:** "Non-arbitrary" is vague; must distinguish designed systems (e.g., Case 6) from adaptable ones like your wave tank.

  ### Dev's Likely Rule and Prediction for the Wave Tank
  After cross-testing the rules against Dev's verdicts, **Candidate Rule 4 (Non-Arbitrary Symbolic Role)** fits best, with **Candidate Rule 3 (Functional Utilization)** as a close second. 
  - **Why Rule 4?** It best explains Dev's "no" to Cases 3 and 4, and his "yes" to Cases 5–7. Case 6 is pivotal: the lookup book is passive, but its symbols have a fixed, non-arbitrary role (addition) that is essential to the clerk's function. Case 8 reinforces that the role cannot be accidental. Rule 4 also handles the clerk's lack of understanding (Case 5)—the symbols' role is defined by the system, not the agent.
  - **Rule 3 as runner-up:** It explains the "no" to Case 3 (unused) and "yes" to Cases 5–6 (utilized), but it struggles with Case 4 (arbitrary mapping) and doesn't fully capture why Case 8 is "no" (coincidence isn't utilization). Dev likely sees utilization as necessary but not sufficient; symbols must have a stable interpretive role.

  **Prediction for your wave tank:**
  - **Without feedback:** **NO**, the wave patterns do not shove the water around. 
    - *Reasoning under Rule 4:* The wave patterns are robust and predictable (autonomous dynamics), but their interpretation as symbols is arbitrary and externally imposed. Retraining the readout for a new task changes the symbolic mapping without altering the water's physics, showing that the patterns lack a fixed, intrinsic role. Like Case 4 (rock with manual), the symbols are "in the eye of the beholder" (the readout), not part of the system's causal fabric. Rule 3 would also say "no" because the output doesn't affect the input—there's no closed loop, and the patterns aren't utilized to control the system.
  - **With feedback (if fixed):** **YES**, the wave patterns would shove the water around. 
    - *Reasoning under Rule 4:* Feedback integrates the readout into a causal loop, making the wave patterns' role non-arbitrary. The patterns would be used to influence the paddle (input), creating a stable computational role (e.g., for a specific task like prediction). Retraining might still allow task-switching, but during operation, the symbol mapping is fixed by the trained feedback, akin to Case 6's lookup book. Rule 3 would also say "yes" due to the functional loop.

  ### Separating the Top Rules with a Testable Variant
  The top rules (Rule 4 vs. Rule 3) often align (e.g., both say "yes" to feedback tank), but diverge when functional utilization occurs without a non-arbitrary role. To test this, build a variant where symbols are utilized in a causal loop but their interpretation is arbitrary and unstable.

  **Proposed variant: Arbitrary-Feedback Wave Tank**
  - **Modification:** Add feedback (connect readout to paddle), but design the system so the wave patterns' symbolic interpretation is explicitly arbitrary and redefinable on the fly. For example:
    1. Train the readout for Task A (e.g., signal prediction).
    2. During operation, after a few seconds, dynamically retrain the readout *in real-time* for Task B (e.g., pattern classification) without stopping the system. Use a simple algorithm (e.g., online linear regression) to swap tasks rapidly.
    3. Ensure feedback is active throughout—output drives the paddle based on the current interpretation.
  - **Why it separates the rules:**
    - **Under Rule 4 (Non-Arbitrary Role):** Verdict = **NO**. The symbols lack a fixed role; retraining changes their meaning arbitrarily (like Case 4's manual), so they aren't intrinsic shovers. Even with feedback, it's "lookup in a wet costume" with extra steps.
    - **Under Rule 3 (Functional Utilization):** Verdict = **YES**. Symbols are utilized in a feedback loop to process inputs and drive outputs, regardless of interpretation stability. Like Case 5 (guy shuffling slips), the system is "doing work" with symbols.
  - **Feasibility:** You can build this in a week. Use your existing setup, add the feedback path, and implement real-time retraining in the laptop software (e.g., with a button to switch tasks). The wave tank is robust enough to handle dynamic retraining (as per your coarse-prediction property), and it directly tests the arbitrariness issue from your no-feedback case.

  **Expected Dev Response:** He'd likely say "no" to this variant, aligning with Rule 4. Case 6 (lookup book) works because addition has a fixed role; here, the constant retraining makes symbols fluid and arbitrary, reducing them to "weather" even in a loop. If he says "yes," Rule 3 wins, but his consistency on non-arbitrariness (Cases 4 and 8) suggests Rule 4 is core. This variant also probes whether "use" alone suffices or if symbols need a "home" in the system's ontology. 

  If Dev's precedents don't clearly extend here, a "yes" commits him to symbols being causal even with unstable semantics (risking over-inclusion, like the turbulence case); a "no" commits to non-arbitrariness as essential, reinforcing that cognition requires stable representational roles. Either way, you win the bet with insight.
