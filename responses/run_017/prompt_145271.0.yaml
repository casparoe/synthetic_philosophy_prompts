  So: what's Dev going to say — do the wave patterns shove the water around, or not? But I care much less about the yes or no than about the rule he's actually running. Write out the rules his eight verdicts are jointly compatible with, say what each predicts about the tank, give me your best guess at which one he's on with the reasons for preferring it, and then tell me the single variant — a change to the tank, or a new case — that would best separate your top two, ideally something I could actually build in a week. If you think his precedents genuinely don't reach this far, say so, and tell me what he'd be committing to with each answer.
