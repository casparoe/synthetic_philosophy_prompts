answer: |-
  ### Mark: 22/25  
  **(Top of Upper Second-Class / Borderline First-Class: Excellent grasp of core concepts and arguments, but with minor omissions in part (c) and occasional overstatement.)**

  ---

  ### Point-by-Point Comments  

  **Part (a) (8/8)**  
  - **Strengths:**  
    - Perfectly identifies the target (the bridge between axiological and deontic components).  
    - Clearly distinguishes "constant across options" (epistemic limitation) vs. "no value" (axiological claim).  
    - Strong reconstruction: Highlights epistemic diffusion of models *and* symmetry of mechanisms.  
  - **Note:** No substantive errors. The framing of the deontic claim as "maximizing expected long-run value" is slightly stronger than the question’s phrasing ("ought to be doing considerably more"), but defensibly charitable.  

  **Part (b) (8/8)**  
  - **Strengths:**  
    - Correctly rejects "astronomical stakes alone" as insufficient and introduces the *leverage premise* (impact probability).  
    - Uses the illustration flawlessly: Calculates threshold probability (p = 10⁻⁴) and explains dominance via unbounded future scale.  
    - Effectively counters the symmetry objection: Astronomical magnitudes prevent cancellation even with symmetric mechanisms.  
  - **Note:** Impeccable logic. The "non-zero probability suffices" argument is precisely what a strong reply requires.  

  **Part (c) (6/9)**  
  - **Strengths:**  
    - Correctly identifies the *asymmetry* in person-affecting views and rejects the claim that extinction "harms nobody."  
    - Rightly distinguishes: Creating happy people (no benefit) ≠ Depriving future people of existence (harms *them*).  
    - Preserves the "astronomical badness" of extinction under this axiology.  
  - **Weaknesses/Omissions:**  
    - **Under-defended:** Assumes "deprivation" straightforwardly harms *possible* future people. This clashes with the *non-identity problem*: If different people exist in different futures, comparing harm to *specific* individuals is incoherent. The student needs to engage with this.  
    - **Overlooked nuance:** Person-affecting views often deny that *merely possible* people can be "harmed" by non-existence. The answer asserts deprivation is bad "for the person deprived," but under asymmetry, *there is no such person* to be deprived. A stronger answer would note this tension and defend a "harm to would-be persons" view.  
    - **Understated near-term losses:** Dismisses near-term project frustration as "small," but under person-affecting views, this harm to *actual* people may carry greater weight than in totalism.  

  ---

  ### What a First-Class Answer to (c) Required  
  A first-class answer would:  
  1. **Explicitly address the non-identity problem**: Acknowledge that under person-affecting views, extinction prevents different future people from existing, complicating claims of "harm" to specific individuals. Defend or rebut this challenge (e.g., via "impersonal" badness or a deprivation-based account of harm).  
  2. **Clarify the scope of "harm"**: Distinguish between harming *actual* people (e.g., by frustrating their reproductive plans) and harming *merely possible* people. Explain why extinction might still be bad under asymmetry without violating its core tenets (e.g., as a loss of *impersonal* value or collective harm to humanity).  
  3. **Quantify the stakes**: Note that while person-affecting views reduce the *scope* of extinction’s badness (e.g., no "lost happy lives" count as harms), the harm to *existing* people (via loss of descendants, species-frustration, etc.) remains astronomically large if future potential is vast.  

  ---
  **Overall Assessment**: The essay excels in reconstructing and rebutting the levelling critic (parts a-b) with philosophical precision. Part (c) is competent but lacks engagement with deeper population-ethical tensions. The mark reflects exceptional clarity and argumentation in 80% of the response, with minor deductions for unexplored subtleties in person-affecting ethics.
