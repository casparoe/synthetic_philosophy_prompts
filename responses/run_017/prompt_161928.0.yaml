answer: |-
  ## OFFICE FOR CIVILISATIONAL STEWARDSHIP (OCS)
  **Guidance Note OCS/GN/7: Completion of Long-Term Civilisational Impact Statements (LTCIS) for Public Works Projects**

  **Effective Date:** 1 Vendémiaire, Year CCXIV
  **Supersedes:** OCS/GN/7 (Rev. 12)
  **Issuing Authority:** Directorate of Existential Permitting

  **1. Introduction and Statutory Basis**
  1.1. Pursuant to Section 47 of the Civilisational Stewardship Act (CSA) CCVIII, all applications for consent concerning Major Public Works Projects (as defined in Schedule 1) must be accompanied by a completed Long-Term Civilisational Impact Statement (LTCIS), Form OCS/F/113 (Rev. 3).
  1.2. The LTCIS requirement arises from the statutory recognition of the Singleton Hypothesis (CSA, Sched. 4, Part A). This hypothesis posits a non-negligible probability of future civilisational convergence ("Convergence") whereby effective decision-making authority over Earth-originating intelligent life’s future trajectory will reside with a single agency ("Singleton").
  1.3. The OCS is mandated to assess the potential of any proposed project to influence: (a) the expected timing of Convergence (T_c); and (b) the probability distribution over the identity and value-alignment profile of the achieving Singleton entity (e.g., specific state actor, supranational body, or machine intelligence, categorised as "Benign", "Neutral", or "Adverse" per OCS Value Taxonomy V.8.2).

  **2. Core Requirements of the LTCIS (Form OCS/F/113)**
  Applicants must complete all sections of Form OCS/F/113. Key analytical sections are:

  *   **2.1. Section 5: Expected Convergence Delay Impact (ΔT_c)**
      1.  Estimate the net delay (ΔT_c), measured in Earth-standard years, introduced to the expected date of Convergence (T_c) by the project. This includes direct operational delays and secondary effects on technological/social development rates influencing Singleton emergence pathways. Justify methodology (e.g., OCS-approved Delay Propagation Model DPM-4c or bespoke model pre-approved under Reg. 113b).
      2.  Apply the Standard Delay-to-Value Multiplier (SDVM), as published annually in the *Stewardship Gazette* (Current SDVM: 3.2 x 10^14 Value Units per Earth-Year of Delay). SDVM incorporates the current estimate of Accessible Future Universe Volume (AFUV) and standard per-capita welfare assumptions.
      3.  Calculate the Expected Future Persons Impact (EFPI):
          `EFPI = |ΔT_c| * SDVM`
          *Report EFPI in scientific notation (e.g., 1.25 x 10^24). Sign indicates direction (delay = positive EFPI, acceleration = negative EFPI).*

  *   **2.2. Section 6: Singleton Identity and Value-Alignment Impact (ΔP_B)**
      1.  Estimate the net change in the probability (ΔP_B) that the achieving Singleton will be categorised as "Benign" under OCS Value Taxonomy V.8.2, resulting from the project. This requires analysis of how the project alters developmental trajectories favouring different potential Singleton candidates.
      2.  Quantify the Value-Alignment Differential (VAD) using the current Benign Singleton Premium (BSP) published in the *Stewardship Gazette* (Current BSP: 0.15 Value Units per Future Person per unit probability shift towards Benign).
      3.  Calculate the Expected Alignment Value Impact (EAVI):
          `EAVI = ΔP_B * BSP * |EFPI|` *[Note: Utilises magnitude of EFPI for scaling]*
          *Report EAVI in scientific notation. Sign indicates direction (increased P_B = positive EAVI, decreased P_B = negative EAVI).*

  *   **2.3. Section 7: Net Civilisational Impact (NCI)**
      1.  Compute the Net Civilisational Impact:
          `NCI = EFPI + EAVI`
      2.  **Crucially:** Applicants must sign declarations (7a and 7b) separately attesting to the reasonableness of the EFPI and EAVI calculations *before* computing and signing for the NCI (7c). This ensures independent consideration of each channel.

  **3. Key Compliance Provisions**

  *   **3.1. Anti-Temporal Scheduling Avoidance (Schedule 7 Rule):**
      1.  Projects may not artificially schedule delay impacts to occur entirely after the OCS Central Convergence Date Estimate (CCDE - currently published as 2245 CE ± 45 years, 90% CI).
      2.  Any claimed delay (ΔT_c) must be temporally distributed relative to the project's execution window. Applicants must model the delay probability density function (PDF) over time and integrate against the OCS Convergence Likelihood Function (CLF, published quarterly) to derive the effective ΔT_c.
      3.  *Rationale:* Convergence timing is stochastic. Assigning all delay to the low-probability tail post-CCDE constitutes impermissible gaming. This rule inherently acknowledges the uncertainty in T_c.

  *   **3.2. Convergence-Positive Offsets and Remission Scheme (Reg. 204):**
      1.  Applicants may apply to offset a positive EFPI (net delay) by funding OCS-approved Convergence-Positive Activities (CPA).
      2.  Eligible CPAs are listed annually via OCS Directive (Current: OCS/DIR/CPA/CCXIV/01). Examples may include targeted R&D grants, institutional stability programmes, or value-alignment research. Eligibility is discretionary.
      3.  Offset Value is calculated as: `Funding Amount * CPA Discount Rate (CDR)`
          Current CDR: 0.92 (Reflecting execution risk and time-discounting of impact).
      4.  Remission against the LTCIS fee (Sched. 3) may be available for demonstrably negative NCI projects, subject to OCS review.

  **4. Worked Example: Repair of Rural Level Crossing (Project Ref: RX-1138)**

  *   **Project:** 6-week (0.115 Earth-Year) closure of minor rural rail crossing for essential repairs. Near-term impacts negligible.
  *   **Section 5 (ΔT_c & EFPI):**
      *   Estimated ΔT_c (using DPM-4c 'Minor Infrastructure' setting): +1.2 x 10^-5 Earth-Years (delay). *Methodology: Minor disruption to local logistics marginally slows regional economic activity, subtly dampening aggregate innovation metrics over decadal timeframe.*
      *   SDVM (Current): 3.2 x 10^14 VU/Earth-Yr
      *   `EFPI = (+1.2 x 10^-5) * (3.2 x 10^14) = +3.84 x 10^9 Value Units (Future Persons Equivalent)`
  *   **Section 6 (ΔP_B & EAVI):**
      *   Estimated ΔP_B: +2.5 x 10^-8 (Marginal increase in P_B). *Methodology: Localised community cohesion boost during disruption marginally increases societal stability metrics, weakly favouring pathways involving democratic state actors over uncontrolled AI emergence.*
      *   BSP (Current): 0.15 VU/FP
      *   `EAVI = (+2.5 x 10^-8) * 0.15 * |3.84 x 10^9| = +1.44 x 10^0 Value Units (Approx. 1.44 Future Persons Equivalent)`
  *   **Section 7 (NCI):**
      *   `NCI = EFPI (+3.84 x 10^9) + EAVI (+1.44 x 10^0) = +3,840,000,001.44 Value Units`
      *   *Applicant Declaration 7a (EFPI): Signed, methodology DPM-4c deemed appropriate.*
      *   *Applicant Declaration 7b (EAVI): Signed, acknowledges high uncertainty but methodology defensible per OCS Qualitative Impact Guidance QIG-7.*
      *   *Applicant Declaration 7c (NCI): Signed. Notes: While EFPI dominates magnitude, EAVI is positive but negligible in comparison. Net impact remains significantly positive (delay-dominant).*
      *   **OCS Analyst Note:** The magnitudes of EFPI and EAVI in this case differ by approximately 9 orders of magnitude, rendering the EAVI negligible for NCI. *However, the requirement for separate estimation and declaration of both channels, regardless of relative scale, is procedurally essential.* Projects exist where EFPI and EAVI are of comparable magnitude and opposite sign (e.g., a major, divisive technological project accelerating convergence but lowering P_B), making NCI indeterminate and requiring careful review under Reg. 205 ("Balanced Impact Projects").

  **5. Fees and Submission (Schedule 3)**
  *   5.1. Base LTCIS Processing Fee: ₪45,000 (Stewardship Credits).
  *   5.2. Complexity Surcharge (Projects with |EFPI| > 10^15 or |EAVI| > 10^10): +₪15,000.
  *   5.3. Fee remission applications (Reg. 204) require separate Form OCS/F/205 (Fee: ₪5,000).
  *   5.4. Submit completed Form OCS/F/113 electronically via the Stewardship Portal, with payment authorisation. Incomplete forms or unpaid fees result in application suspension.

  **6. OCS Determination on RX-1138 (Worked Example)**
  *   **Reference:** RX-1138 - Rural Level Crossing Repair
  *   **LTCIS Ref:** LTCIS-RX1138-CCXIV-001
  *   **Determination:** The submitted LTCIS (Form OCS/F/113 Rev. 3) is assessed as procedurally complete and compliant with CSA S47 and associated regulations. The methodology for EFPI calculation (using DPM-4c) is accepted as standard for the project category. The methodology and assumptions underpinning the EAVI calculation, while subject to inherent uncertainties characteristic of value-alignment forecasting, are deemed reasonable and within the bounds of OCS guidance QIG-7. The calculated NCI (+3.84 x 10^9 VU) is acknowledged.
  *   **Decision:** Pursuant to CSA S47(8), the quantified LTCIS impact is noted on the primary works consent application (Ref: WC-RX1138-CCXIV). The LTCIS requirement for Project RX-1138 is hereby **Satisfied**. No further action under the LTCIS regime is required for this project. The substantive decision regarding the works consent itself falls under separate statutory provisions and is not determined by this LTCIS satisfaction notice.
  *   **Issued By:** [Automated Signature] Senior Case Officer, Directorate of Existential Permitting, OCS.
