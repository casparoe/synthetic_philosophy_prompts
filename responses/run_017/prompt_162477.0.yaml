prompt: |-
  I'm in a small philosophy-of-economics reading group — me, one philosopher, and two econ PhD students who mostly roll their eyes at us — and we've now spent three sessions on the old row about whether the realism of a model's assumptions matters, and I genuinely cant tell whether we're disagreeing about anything. Here's the shape of it as I see it. One side, descending from Friedman's 1953 essay on positive economics, says a theory is to be judged only by whether its predictions work; that the assumptions of a good theory will typically be wildly false, because the whole trick is to throw away almost everything to isolate the few forces that dominate for some class of phenomena; and that asking whether firms 'really' maximise is like asking whether a falling body 'really' is a point mass — the interesting theories are the ones whose assumptions are the least realistic. The other side says this turns on an equivocation about what an assumption is, that the famous move where the significance of a theory is supposed to explain the unreality of its assumptions conflates several quite different things, and that predictive success is cheap: a model can track the data for reasons that have nothing to do with its being even approximately right about the world, which matters enormously the moment you use it to do something rather than to retrodict a series.

  My working hypothesis is that this is not one dispute but about four, and that it stalls because nobody says which job the model is being used for. I've been playing with a taxonomy of my own, with my own labels so nobody can accuse me of stealing them: (1) negligibility assumptions — the assumption says a factor is small enough to ignore, it's statable as a limit claim (viscosity going to zero, molecular volume going to zero), and there's a well-defined direction in which you could de-idealise and check; (2) scaffolding assumptions — the assumption isn't a claim about the target at all but a device you need in order to have a tractable model space, e.g. a continuum of traders, an infinite horizon, every agent knowing the model; there may be no sensible limit to take, because relaxing it gives you a different kind of object rather than the real system; (3) stand-in assumptions — you put something in that you know is false because you don't know the true mechanism, and here the critics seem plainly right that the model's predictive success is no evidence for the stand-in; (4) domain assumptions — the model is really a conditional, 'in systems where X holds', so the live question is a matching question about whether the actual system is near enough to such a world, not a truth question about X. On top of that, a second hypothesis: both sides quietly test models on within-sample prediction, and the instrumentalist line earns its keep for interpolation but goes silent — or actively misleads — when the model is used to extrapolate to a new regime, or to evaluate a policy that changes the very thing the assumption held fixed. So maybe the real hidden disagreement is about which predictive task is at stake, or maybe it's bedrock, a difference about what theories are even for: saving the phenomena versus latching onto the causes.

  So: is this a substantive disagreement, three or four verbal ones under one heading, two camps answering different questions, or a difference about what counts as evidence for a model that nobody has made explicit? Is my four-way taxonomy doing any work, or is it just relabelling the familiar points? I'd like you to run it against four cases I care about and tell me where it breaks: a zero-viscosity / frictionless-plane idealisation in a mechanics derivation; a one-immortal-consumer representative-agent macro model; a continuum-of-agents assumption in a market-clearing model; and a firms-maximise-profits postulate used to predict outside the regime it was fitted in. Then tell me what would count as progress given your diagnosis — a distinction, a formal result about when de-idealisation is well defined, a case study, a change of question — or argue honestly that no progress should be expected and why. Please don't give me a survey of the positions or a reading list, I've read enough of those and there's no library where I am; I want the diagnosis, with reasons tied to what each side actually says. And be explicit about how confident you are in each claim you make, and flag the single point you're least sure of. British English please, and thanks — sorry if this is a bit of a ramble, it's 1am and I've been staring at my notes for hours.
reasoning: |-
  Okay, let me try to unpack this user's query. They're in a philosophy-of-economics reading group with a philosopher and two econ PhD students, and they've been stuck debating the realism of assumptions in models. The user feels like there might be multiple disputes masquerading as one, and they've proposed a taxonomy to clarify things. 

  First, I need to understand the core frustration: the group seems to be talking past each other. The user suspects that the disagreement isn't substantive but stems from conflating different types of assumptions and different purposes for models. Their taxonomy categorizes assumptions into negligibility, scaffolding, stand-ins, and domain assumptions. They also think the hidden issue might be about predictive tasks—interpolation vs. extrapolation—or deeper philosophical divides about what theories are for.

  The user wants me to test their taxonomy against four cases: frictionless planes in mechanics, immortal consumers in macro models, continua of agents in markets, and profit-maximizing firms in new regimes. Then, suggest what progress might look like. They explicitly don't want a literature review but a diagnosis tied to what each side says, with confidence levels flagged.

  Hmm, the user's taxonomy seems thoughtful. Let me see if it holds up. For the frictionless plane, that's clearly a negligibility assumption—you can approach zero friction and check deviations. The immortal consumer is scaffolding; relaxing it changes the model type entirely. Continuum of agents is also scaffolding—it's about tractability, not reality. Profit-maximizing firms? That's tricky. It might be a stand-in if we don't know the real mechanism, or domain-specific if it's conditional on certain environments. 

  The key insight is that Friedman's instrumentalism works best for negligibility and domain assumptions but falters with scaffolding and stand-ins. The critics are right that predictive success alone doesn't validate stand-ins, especially when extrapolating. 

  Where might the taxonomy break? Possibly with profit-maximization—it could blur stand-in and domain, depending on context. Also, the real conflict might be about whether economics should mimic physics (where negligibility is clearer) or embrace its messier subject matter. 

  For progress, I should recommend making the model's purpose explicit—prediction, explanation, policy design? Case studies showing how assumption types affect extrapolation could help. The least sure point? Whether profit-maximization is a stand-in or domain assumption; it's context-dependent and hotly debated. 

  The user’s tired and frustrated—they need clarity, not more jargon. I’ll keep it concise, use British English, and flag confidence levels as requested. The goal is to help them reframe the debate so their group can move forward.
answer: |-
  Right, let's cut through the fog. Your taxonomy *is* doing work – it's exposing the equivocation at the heart of the row. Friedman's argument gains plausibility by leaning heavily on **negligibility** (point masses) and **domain** (conditional claims) assumptions, while critics rightly target **scaffolding** and **stand-ins**. The stall happens because both sides implicitly appeal to different types depending on the example. Your second hypothesis about prediction tasks is also crucial. Below is my diagnosis, structured as requested.

  **The Core Problem:** It's **both** substantive disagreement *and* verbal equivocation. Substantive on the *epistemic weight* of assumptions for different tasks; verbal because "assumption" isn't a monolithic category. Friedmanians focus on the *function* of assumptions (simplification for prediction), critics focus on their *epistemic status* (truth-likeness for explanation/causation). Crucially, **nobody consistently specifies the model's *purpose* (prediction vs. explanation vs. policy design) or the *type of predictive task* (interpolation vs. extrapolation/design).**

  **Testing Your Taxonomy Against the Cases (High Confidence):**

  1.  **Frictionless Plane / Zero-Viscosity (Negligibility):**
      *   **Friedman:** Triumphant. The unreality is irrelevant; predictions (trajectory, time of flight) work beautifully for many phenomena. De-idealisation (adding friction) is well-defined, improves accuracy at cost of complexity, and confirms the core dynamics dominate when friction *is* negligible.
      *   **Critics:** Mostly concede here *for interpolation/prediction within the domain*. But they'd say Friedman overextends by implying *all* idealisations work like this.
      *   **Taxonomy Works:** This *is* negligibility. The limit claim (`μ → 0`) is clear, de-idealisation is well-defined. Predictive success *is* strong evidence the core dynamics are captured, *precisely because* you can see how adding reality (friction) changes things. The dispute dissolves here.

  2.  **Immortal Consumer (Scaffolding):**
      *   **Friedman:** "Doesn't matter! Does the model predict aggregate consumption/savings patterns? If yes, good." Treats it like negligibility.
      *   **Critics:** "This is absurdly false and distorts the actual mechanisms. Overlapping generations matter! Bequest motives matter! Dynamics under demographic change will be wrong." Predictive success *within sample* might be cheap if the model is just flexible enough to fit noise.
      *   **Taxonomy Works:** This is classic **scaffolding**. There's no sensible "limit" (`age → ∞`?). Relaxing it (adding finite lives, generations) fundamentally changes the model structure and dynamics (e.g., introduces life-cycle effects, potential for Ponzi schemes). Predictive success for *current* aggregates doesn't guarantee the model captures the *mechanism* well enough for extrapolation (e.g., predicting effects of a sudden baby boom bust) or policy (e.g., long-term impact of pension reform). Critics have a point Friedmanians dismiss too easily.

  3.  **Continuum of Agents (Scaffolding):**
      *   **Friedman:** "Essential for tractability! Eliminates strategic uncertainty, idiosyncratic noise. Predicts market-level outcomes well. Who cares if agents aren't literally continuous?"
      *   **Critics:** "This washes out crucial features! No scope for strategic interaction *between identifiable agents*, no herding, no market microstructure effects, no possibility of coordination failure arising from discrete actions. It assumes away the very problems some markets face."
      *   **Taxonomy Works:** Again, **scaffolding**. Relaxing it (finite agents, discrete choice) moves you into game theory/complex systems territory – a radically different model space. It's necessary for *this specific tractable model*, not a claim that agents are *literally* continuous. Success in predicting, say, average prices doesn't validate the scaffolding *as a description* nor guarantee usefulness for questions where strategic interaction or granularity matters (e.g., market power of a few large players, flash crashes). The dispute flares because Friedmanians see prediction, critics see distortion.

  4.  **Firms Maximise Profits (Stand-in or Domain? - Here's the Rub):**
      *   **Friedman:** "The only question is: do they *act* *as if* they maximised? If predictions (price changes, output responses) hold, then yes, for practical purposes. The 'assumption' is a useful fiction." Treats it like negligibility/domain.
      *   **Critics:** "We *know* firms often don't maximise (satisficing, agency problems, behavioural biases). Predictive success *within observed markets* might just mean the model fits *some* pattern, not that maximisation is the *cause*. Using it to predict effects of *new* policies (e.g., a novel tax) or in *new* contexts (e.g., a start-up boom) is baseless if the 'as if' breaks down."
      *   **Taxonomy Breaks/Needs Refinement:** This is the hardest. Your taxonomy forces us to ask: **Is it a Stand-in or a Domain Assumption?**
          *   **Stand-in:** If we genuinely don't know *how* firms achieve reasonable outcomes (maybe routines, evolution, imitation?), then profit-max is a false placeholder. Its predictive success *is* cheap evidence for the stand-in mechanism itself (high confidence). Success might be due to market selection or other forces *despite* individual non-maximisation.
          *   **Domain:** If interpreted as "In competitive environments with strong selection pressures, surviving firms *behave approximately as if* they maximised," then it's a domain claim (conditional). The live question is *matching*: is the policy context/regime shift sufficiently like that domain? (Moderate confidence - Friedman hints at this).
      *   **Why it Stalls:** Friedmanians present it as Domain/Negligibility ("as if"). Critics attack it as a false Stand-in/Scaffolding ("they don't *really* do it"). Your taxonomy reveals this conflation *is* the core of the row for this case. **Your second hypothesis shines:** Predictive success *within* the fitted competitive regime tells us little about success when extrapolating to novel policies or contexts that alter selection pressures or firm decision-making environments. Friedmanians underplay this; critics overplay the "realism" demand without always clarifying the *type* of error or the *task* for which it matters.

  **Where Progress Lies (High Confidence in Direction, Less in Specifics):**

  1.  **Insist on Purpose & Task:** Before arguing, force the question: *What is this model for?*
      *   **Pure Prediction (Interpolation):** Friedman has a stronger case, especially with Negligibility/Domain assumptions. Realism matters less. Your taxonomy helps identify when this is plausible.
      *   **Explanation / Understanding Mechanisms:** Critics have a much stronger case. Scaffolding and Stand-ins need scrutiny; predictive success alone is insufficient evidence for the mechanism.
      *   **Policy Evaluation / Extrapolation / Design ("New Regimes"):** This is the battleground. Here, the *type* of assumption becomes critical (Negligibility often robust, Scaffolding/Stand-ins risky). Your second hypothesis is key: *within-sample* prediction is weak evidence for *this* task. Progress requires analysing how different assumption types behave under regime shifts.

  2.  **Apply Your Taxonomy Explicitly:** In discussions, label the assumption type. Ask: "Is this Negligibility (can we de-idealise?), Scaffolding (what tractability price?), Stand-in (what's the gap?), Domain (where does it apply?)?" This forces specificity and exposes when Friedman's defence works and when it doesn't.

  3.  **Case Studies Focusing on Extrapolation/Policy:** Don't rehash Friedman vs. critics on general principles. Find concrete examples (historical or simulated) where:
      *   A model with "unrealistic" assumptions (Scaffolding/Stand-in) worked well interpolating but failed catastrophically extrapolating or under a policy change (e.g., certain DSGE models pre/post-2008, specific game theory models applied to new markets).
      *   A model succeeded in extrapolation/policy *because* its core assumptions (even if idealised Negligibility/Domain) captured dominant causal mechanisms robustly (e.g., basic supply/demand in many, but not all, contexts).
      *   De-idealising a Scaffolding assumption (e.g., finite agents) changed policy implications. Analyse *why*.

  4.  **Formalise "Robustness to Scaffolding Relaxation" (Lower Confidence - Hard but Worth Aiming For):** When is it possible to show that relaxing a scaffolding assumption (e.g., finite N, finite horizon) leads to a model whose predictions *converge* to the scaffolding model's as N → ∞ / T → ∞? When does it lead to *qualitatively* different behaviour? This would help assess the epistemic risk of scaffolding for different tasks.

  **The Bedrock Difference (Moderate Confidence):** Ultimately, there *is* a deeper divide hinted at by the econ PhDs' eye-rolling. Friedmanians (often implicitly) believe economics can/should be like physics, where Negligibility/Domain assumptions rule and "saving the phenomena" (prediction) is paramount. The philosopher and likely you see economics as dealing with complex, path-dependent, intentional systems where mechanisms matter deeply for understanding and intervention, and Scaffolding/Stand-ins are often unavoidable but epistemically risky. Your taxonomy helps articulate *why* this difference manifests in arguments about assumptions.

  **My Least Sure Point (Flagged as Requested):** I'm least sure about **how cleanly the "Stand-in" vs. "Domain" distinction can be applied to the profit-maximisation postulate**. The line is blurry. Is "maximisation" *always* a stand-in for some unknown selection/routine process (making it a false mechanism)? Or can it be a *valid* domain claim ("in environments X, behaviour approximates Y") even if no firm literally solves a maximisation problem? This ambiguity is probably inherent and central to the persistent disagreement. Your taxonomy highlights the ambiguity but doesn't fully resolve it – and I suspect no taxonomy can, as it depends on one's underlying philosophy of action and institutions.

  **Conclusion:** You've identified the core problem correctly. The row stalls due to unspoken differences in: (1) the *type* of assumption being discussed (your taxonomy fixes this), (2) the *purpose/task* for the model (prediction vs. explanation vs. policy design), and (3) the *predictive task* (interpolation vs. extrapolation). Progress requires forcing these distinctions in discussion, using your taxonomy as a lens, and focusing analysis on concrete cases of extrapolation/policy failure/success tied to assumption types. The eye-rolling econ students might engage more with the "extrapolation risk" angle – it hits closer to practical model failure. Good luck – it's a classic row for good reason, but your framing can move it forward. Now get some sleep!
