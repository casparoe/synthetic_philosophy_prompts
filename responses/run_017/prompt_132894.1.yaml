prompt: |-
  I sit on the executive committee of a branch of a general union, and I would like a decision procedure we can actually run.

  The setting: our branch covers roughly seven hundred directly employed members across three parcel distribution depots, plus — and this is the part that keeps causing arguments — around two hundred self-employed couriers who work the same routes, on the same handheld platform, against the same performance targets, but who are engaged through a separate services contract with an intermediary. Several times a year we are asked to authorise some form of industrial action: overtime bans, work-to-rule, short intermittent stoppages, all-out walkouts, refusals to cross another union's picket line. We have about forty minutes at a branch meeting, our members are not philosophers, and any decision has to survive two further stages: a ballot of the affected members and a sign-off from regional office, who will not sign off on anything they think is disproportionate. We cannot commission fresh advice for each decision, and I would rather the procedure did not rest on the details of any particular jurisdiction's labour law — treat statutory permissions and restrictions as a parameter we fill in locally, and give me the moral structure underneath, the part that would still oblige us if the law changed.

  The rough rule we have been using is: we may withdraw what the employer is paying for; we may not prevent other people from working; we may not aim at anyone who cannot give us what we want. I know that rule is too thin, and I will say why below.

  What I want is a procedure: the questions to ask, in order; what counts as a sufficient answer to each; the points at which the procedure returns a no and stops; the points at which it hands the question to a vote because it is a question about what we value rather than about facts; and the points at which it has no opinion at all. For each step, give me one line on which justification of the right to organise that step leans on — the freedom-of-association line, the coercion objection, the anti-domination or countervailing-power line, or something else — so I can see which parts of the procedure would collapse if we rejected one of those justifications. Please also mark the steps that are judgement calls dressed up as procedure; I would rather know which they are than be reassured.

  Two difficulties I want the procedure to handle explicitly, because they are where our current rule runs out. First, addressee: a strike seems to require somebody who can hear it and respond, but many of the decisions that matter to our members — routing, shift allocation, deactivation thresholds — are made by an automated scheduler, tuned by a product team that none of us can name and that has no employment relationship with us at all. Who, if anyone, is the legitimate addressee of pressure there, and does it matter that the local depot manager can only pass the pressure on? Second, aggregation: if members stop for two hours at a time, twice a week, for ten weeks, is that one strike or twenty, and is proportionality assessed against each stoppage, against the running total, or against the threat of the series continuing? Our rule gives no answer, and the answer decides whether intermittent action is the mildest available step or the most coercive one.

  Then run the finished procedure on four live proposals, showing your working:

  1. An overtime and voluntary-extra-shift ban at the two largest depots, properly balloted and notified, in response to a roster change that moves start times by forty minutes on two weeks' notice, which the employer says is permitted under a general flexibility clause. The financial impact is small and the disruption is mostly absorbed by the employer's own planning.

  2. An intermittent stoppage of two hours, announced twenty minutes in advance, twice weekly, in support of cleaners at the same site who are being dismissed and re-engaged through a subcontractor on worse terms. They are in a different union. Our members have no complaint against our own employer, the subcontractor is not our employer, and the stoppages are timed to the evening sort so that most of the cost falls on our employer rather than on the party to the dispute.

  3. An immediate walkout at one site after a serious near-miss involving a reversing vehicle: no ballot, no notice, and the yard to stay closed until an independent safety audit is commissioned. Our own safety representatives think the risk is real and continuing, and the members would vote for it on the spot. I expect the procedure to tell me something I will find hard to sell at the branch, and I want to know whether that verdict is correct or whether it exposes a defect in the procedure.

  4. A settlement offer of a six per cent increase bundled with a three-year no-strike clause. Tell me whether the procedure even has jurisdiction over this, or whether waiving the right to strike for a period is a values question for the members, and if so what the members should be asked.

  Finally, tell me honestly what the procedure cannot settle. In particular: can any version of it tell us, in advance, whether our members' simple refusal to volunteer for extra shifts is industrial action at all, given that the extra shifts were never contractually owed? And what may we do, under the procedure, about the thirty or so members who say they intend to keep working, and about the couriers who are not members and to whom none of our rules apply? Please do not give me reading lists, case citations or legal surveys — I need the argument, in British English, in a form I can take into a meeting.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're on the executive committee of a union branch with a mix of directly employed members and self-employed couriers. The main challenge is creating a decision procedure for industrial action that's practical, can be run quickly in meetings, and handles specific thorny issues. 

  First, I need to identify the core problems. The existing rule is too thin, especially regarding who the action targets (like automated systems) and how to assess proportionality for intermittent strikes. The user also wants clarity on moral principles, not legal specifics.

  The user mentioned two main difficulties: addressee and aggregation. For addressee, when decisions are made by algorithms, who do you pressure? The local manager might not have control, so the procedure must identify someone with sufficient influence. For aggregation, intermittent actions need rules on whether each stoppage is separate or part of a cumulative strategy.

  Looking at the four proposals, each tests different aspects. Proposal 1 is straightforward but questions proportionality. Proposal 2 involves solidarity action with another union, targeting a different employer. Proposal 3 is an unballoted safety walkout, which conflicts with democratic processes. Proposal 4 is about trading the right to strike for pay, which is a values decision.

  The user also wants to know the procedure's limits. Can it classify voluntary shift refusals as industrial action? How to handle non-members or members who won't participate? These are operational realities.

  The moral foundations matter. Freedom of association supports collective action. Anti-domination justifies targeting entities with power over workers. Coercion concerns limit actions that force non-participants. The procedure must balance these without legal jargon.

  I'll structure the procedure in steps: legitimacy of the grievance, target identification, pressure proportionality, and action design. Each step needs clear yes/no gates or points for democratic votes. Justifications should tie to the moral principles so if one principle is rejected, related steps might fail.

  For the addressee issue, the procedure should require identifying a responsible party with influence. If the manager is just a messenger, pressure might be misdirected. Aggregation should treat intermittent actions as a single campaign, assessing total impact over time.

  Applying the steps to each proposal. Proposal 1 passes most checks but needs a vote on proportionality since impact is low. Proposal 2 fails on target responsibility unless the employer has leverage over the subcontractor. Proposal 3 fails due to lack of ballot, prioritising democracy over immediate safety. Proposal 4 is a values decision for members, with guidance on risks.

  Limitations: Classifying voluntary actions depends on established custom. Non-members can't be compelled, but persuasion is allowed. The procedure can't resolve all strategic dilemmas, like escalating tactics.

  I need to ensure clarity, avoiding academic terms. Use plain British English. Focus on actionable steps, highlighting where judgment calls occur. Be honest about uncertainties to build trust with the user.
answer: |-
  Here's a decision procedure designed for your branch meetings, built on core trade union principles rather than specific law. It handles your explicit difficulties and includes clear gates, vote triggers, and justifications.

  **Core Moral Foundations:**
  1.  **Freedom of Association & Collective Action (FA):** The right to combine and act collectively for mutual aid and protection.
  2.  **Countervailing Power / Anti-Domination (CP):** Balancing unequal power relationships between labour and capital; preventing arbitrary control over workers' lives/livelihoods.
  3.  **Minimising Coercion / Respect for Autonomy (MC):** Actions should primarily pressure the decision-maker, not unduly coerce non-participating workers or third parties.
  4.  **Democratic Mandate (DM):** Legitimacy flows from the affected members' informed consent.

  **The Decision Procedure:**

  1.  **Is there a legitimate, collective grievance?**
      *   *Question:* Does the proposed action respond to a specific, shared issue materially affecting working conditions, pay, safety, security, or dignity for a defined group of members?
      *   *Sufficient Answer:* Yes - Clear description of the issue and affected group(s). No - Issue is purely individual, hypothetical, or unrelated to work. Stop.
      *   *Justification:* FA, CP (Addressing shared harm/power imbalance).
      *   *Judgement Call:* Defining "materially affecting" and "collective" – lean towards inclusivity but gate exists.

  2.  **Who holds relevant power/responsibility? (Addressee Gate)**
      *   *Question:* Can we identify a specific entity (employer, contractor, platform operator, client) that:
          a)  Has the *formal authority* to concede to the demand?
          b)  Has *sufficient practical influence* over the outcome?
          c)  *Benefits materially* from the labour affected?
      *   *Sufficient Answer:* Yes - An entity meets at least two of (a), (b), (c). No - No such entity identifiable. Stop.
      *   *Justification:* CP, MC (Pressure must be capable of being effective and directed at those with power/responsibility). *Crucially addresses the "automated scheduler" problem.*
      *   *Judgement Call:* Assessing "sufficient influence" (e.g., depot manager passing pressure *up* to HQ/tech team *is* valid if they have that channel). Assessing "benefits materially" (platform clearly does).

  3.  **Is the proposed action targeted primarily at the identified addressee?**
      *   *Question:* Will the primary direct economic cost or operational disruption fall upon the entity identified in Step 2?
      *   *Sufficient Answer:* Yes - Clear causal link. No - Cost falls mainly on unrelated parties, customers, or non-participating workers. Stop.
      *   *Justification:* MC (Avoids coercion of uninvolved parties), CP (Focuses pressure where it can work).
      *   *Judgement Call:* Assessing "primary" cost (e.g., solidarity action hitting *your* employer to pressure *their* client/subcontractor is often valid if Step 2 identified the client/subcontractor *and* your employer benefits from their relationship).

  4.  **Is the action proportionate? (Aggregation Gate)**
      *   *Question:*
          a)  **Scale:** Is the *total likely impact* (financial, operational) of the *entire proposed action sequence* proportionate to the grievance's seriousness and the goal's value? (Treat intermittent actions as *one cumulative campaign*).
          b)  **Necessity:** Is this the *mildest effective form* of action likely to achieve the goal (or a significant step towards it), considering alternatives tried or impractical?
      *   *Sufficient Answer:* Yes (a) AND (b) seem reasonably true based on available info. "No" or "Unclear" -> Go to Vote A: "Is the *total planned action* proportionate to the grievance & goal?" (DM, FA).
      *   *Justification:* MC (Avoids excessive coercion), CP (Using power responsibly).
      *   *Judgement Call:* **Major judgement call.** Assessing "seriousness," "value," "likely impact," "mildest effective." Requires debate informed by experience. Aggregation principle (treating a series as one campaign) is key here.

  5.  **Does it require a ballot? (Process Gate)**
      *   *Question:* Is the proposed action a form of "industrial action" (withholding labour/services normally expected) that legally and/or morally requires a democratic mandate?
      *   *Sufficient Answer:*
          *   Yes (Ballot Required) - Withdrawal of labour/services normally performed (strike, overtime ban, work-to-rule).
          *   No (Ballot Not Required) - Purely political protest, internal union meeting, non-disruptive campaign (leafleting, petitions).
          *   Urgent Safety Exception? - *Only* if immediate, serious, and imminent threat to life/limb exists AND action is solely to remove that threat (e.g., refusing unsafe work). Still requires *immediate* ratification vote if possible. Otherwise, proceed cautiously.
      *   *Justification:* DM (Fundamental legitimacy), FA (Collective decision for collective action).
      *   *Judgement Call:* Defining "normally expected" (see Limitations). Assessing "urgent safety" exception.

  6.  **Can we comply with statutory/ballot requirements?**
      *   *Question:* Can we realistically meet the legal requirements for notification, ballot conduct, turnout, and majority within the timeframe? (Treat law as a parameter here).
      *   *Sufficient Answer:* Yes - Process feasible. No - Process impossible/illegal. Stop or modify action.
      *   *Justification:* DM (Ensuring mandate is valid), Practicality.
      *   *Judgement Call:* Assessing feasibility.

  **Procedure Output:** If all steps pass (or Vote A passes), the Committee can *recommend* proceeding to ballot (if Step 5 requires it) or *endorse* the non-ballot action. A "Stop" at any step means the Committee should not endorse the action as proposed.

  ---

  **Applying the Procedure to Live Proposals:**

  1.  **Overtime/Extra-Shift Ban:**
      *   Step 1: **Yes.** Grievance: Imposed roster change affecting work-life balance.
      *   Step 2: **Yes.** Addressee: Employer (formal authority, benefits, influence).
      *   Step 3: **Yes.** Target: Employer bears cost via disrupted planning.
      *   Step 4: **Vote A Triggered.** (Proportionality). Scale: Small financial impact vs. grievance (moderate annoyance, precedent setting?). Necessity: Mildest form? Possibly yes (softer than strike). *Committee must debate/Vote A: Is this total action proportionate?* (Likely passes vote).
      *   Step 5: **Yes.** Ballot required (withholding voluntary labour normally expected).
      *   Step 6: **Yes.** Assuming ballot feasible.
      *   **Verdict:** Proceed to ballot, assuming Vote A passes proportionality. Justifiable under FA, CP, MC.

  2.  **Intermittent Stoppage (Cleaners' Solidarity):**
      *   Step 1: **Yes/No?** Grievance is *not* against our members' employer. Is solidarity a legitimate *union* grievance? (Leaning Yes under FA/CP principles of labour solidarity, but **gate exists**). *Assume Committee argues Yes.*
      *   Step 2: **Crucial.** Who is the addressee? *Not* our employer (no authority/concession power over cleaners' terms). *Not* the cleaners' union (not the opponent). *Target is the Subcontractor.* Does our action pressure *them*?
          *   (a) Authority: **Yes** (Subcontractor).
          *   (b) Influence: **Unclear/No?** Cost falls *mainly on our employer*, not the Subcontractor. Our employer *may* have influence, but it's indirect. Weak link.
          *   (c) Benefits: **No?** Subcontractor doesn't benefit from *our* labour.
      *   **Step 2 Result: Likely NO.** (Fails (b) and (c)). Pressure is misdirected; primary cost is on our employer who lacks direct power to resolve the cleaners' dispute. *Stop.*
      *   *Alternative:* If committee argues our employer *does* have significant leverage over the Subcontractor (e.g., major client, can terminate contract), Step 2 might pass *if* Step 3 is also met (cost on our employer *is* the mechanism to pressure *them* to pressure the Subcontractor). Step 3: **Yes** (cost on our employer). Then Step 4 (Proportionality) becomes critical: Is hitting our employer hard (evening sort disruption) to help another group proportionate? **Vote A Highly Likely.** Morally defensible under FA/CP solidarity, but MC (cost on uninvolved employer) and proportionality are major hurdles.

  3.  **Immediate Safety Walkout (No Ballot):**
      *   Step 1: **Yes.** Serious safety threat.
      *   Step 2: **Yes.** Employer responsible for site safety.
      *   Step 3: **Yes.** Action targets employer via operational shutdown.
      *   Step 4: **Yes.** Proportionality: Serious threat justifies significant action (audit demand). Necessity: Immediate walkout may be mildest *effective* response to imminent threat? (Debatable, but plausible).
      *   Step 5: **Urgent Safety Exception?** This is the test. Is the threat *immediate* and *imminent*? "Serious near-miss" suggests a *pattern* or *systemic risk*, not necessarily *imminent* danger requiring instant walkout without any process. Could safety reps halt specific operations *immediately* while demanding urgent talks/audit? **Likely NO.** (Not sufficiently imminent to bypass ballot). *Stop.* DM trumps urgency unless threat is truly catastrophic and immediate (e.g., live gas leak, imminent structural collapse).
      *   **Verdict:** Procedure says **Stop.** Hard sell: Safety is paramount, but procedure prioritises democratic process (DM) unless threat is literally seconds/minutes away. Correct verdict? **Yes.** It exposes the tension between immediate safety and democratic mandate. The procedure forces exhausting *immediate* alternatives (targeted work refusal, safety rep intervention) before a full, undemocratic walkout. A branch vote *could* happen immediately after the walkout starts to ratify it, but initiating without mandate fails Step 5.

  4.  **Settlement Offer (6% + 3yr No-Strike):**
      *   *Jurisdiction:* The procedure decides *actions*, not settlement terms. However:
      *   Step 5 is relevant: Waiving the right to strike *is not industrial action itself*. It's a contractual term.
      *   **Committee Role:** Facilitate democratic decision *by members* on the *entire package*. The procedure doesn't decide this.
      *   **What Members Should Be Asked:**
          *   Vote on accepting/rejecting the *whole offer*.
          *   *Crucially, highlight the trade-off explicitly:* "This offer includes X% increase but requires agreeing not to take any strike action for 3 years. Do you accept this trade-off?"
      *   **Committee Guidance (Based on Principles):** Explain risks: CP (Losing countervailing power for 3 years), FA (Limiting collective action rights). Emphasise DM: It's *their* choice weighing the money against future leverage.

  ---

  **What the Procedure Cannot Settle (Honestly):**

  1.  **"Voluntary" Shift Refusal as Industrial Action:** The procedure (Step 5) *assumes* we can classify it. The core question is: **Is there a well-established custom and practice (C&P) that these shifts are regularly worked and relied upon?**
      *   *If Yes (Strong C&P):* Then refusal is withdrawing labour *normally expected* -> Industrial Action (Ballot needed).
      *   *If No (Truly ad-hoc, never relied upon):* Refusal might not be "action" -> No ballot needed.
      *   *Judgement Call:* Assessing C&P strength is inherently factual/contexual. The procedure flags the question (Step 5) but can't definitively answer it without examining specific history. Err towards ballot if in doubt.

  2.  **Non-Participating Members & Non-Member Couriers:**
      *   **Members who keep working:** The procedure governs *union-endorsed action*. It **cannot compel individuals.** Core principles apply:
          *   FA/DM: The union acts on a democratic mandate.
          *   CP: Encouraging solidarity is legitimate; pressuring or coercing individuals *not* to work is not (MC). Focus persuasion on collective benefit and solidarity. Disciplinary action by the *union* for crossing a picket is often permitted under union rules (a separate internal matter), but cannot involve coercion or threats.
      *   **Non-Member Couriers:** The procedure/rules **do not apply to them.**
          *   FA: They have the right *not* to associate.
          *   MC: Coercing them not to work is unacceptable. Persuasion ("We're fighting for standards that help you too") is legitimate.
          *   CP: Their work can undermine action. Strategy might involve trying to include/organise them, or designing action where their participation is less critical. The procedure cannot resolve this tension; it's strategic.

  3.  **Ultimate Effectiveness & Strategy:** The procedure checks *permissibility* based on principles, not whether an action will *win*. It won't guarantee success or optimal tactics.

  4.  **Deep Value Conflicts:** While Vote A handles proportionality trade-offs, intractable disagreements about core union priorities (e.g., always prioritise safety vs. maximum wage gains) remain political debates within the branch.

  **In short:** This procedure provides a structured, principle-based framework for making defensible decisions under time pressure. It forces critical questions about grievance legitimacy, target responsibility, proportionality (with aggregation), and democratic mandate. It highlights judgement calls rather than hiding them. It won't solve every strategic dilemma or value conflict, but it should prevent clearly impermissible or misdirected actions and provide a transparent rationale for your committee's recommendations. Remember to fill in the legal parameter locally.
