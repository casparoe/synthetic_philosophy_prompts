prompt: |-
  I'm a retired physical chemist — forty-odd years, mostly Raman and NMR, and far too much of it wrestling with cryostats — and since I retired I've been sitting in on a reading group in the philosophy department. That's how I ran into the identity of indiscernibles and Black's two spheres, and I've come out of it with a pile of gut verdicts that I don't think hang together. I want to know whether there's one principle behind them or whether some of them have to go.

  Here are the cases, and how I actually react to each.

  1. Black's setup: a universe containing exactly two iron spheres, one mile apart, identical in every qualitative respect — same radius, same composition, same temperature, same everything, nothing else in the universe. Verdict: two spheres, definitely. The principle is false. And I'm unimpressed by the move that says they're discerned by relational properties: each one is a mile from a sphere just like it, so they share those properties too.

  2. One electron delocalized across two traps, one quantum state, two places. Verdict: one thing, not two.

  3. A Bose–Einstein condensate: a few thousand rubidium atoms, all in the same single-particle state. Verdict: I don't want to say there are really a thousand objects there. The count feels like bookkeeping, not like a number of things. My chemist's instinct kicks hard against this — the mass is a thousand atoms' worth, the thermodynamics depends on the number — but I still think the verdict is right, that those are properties of one state rather than counts of individuals.

  4. Two iron atoms at different sites in a crystal lattice at low temperature. Verdict: obviously two. If a permutation-symmetry argument of the kind that moves me in case 3 is going to tell me these aren't two either, then I think the argument has broken, because counting atoms exactly like these did real work in my career.

  5. Two electrons in the ground state of a helium atom. Verdict: also two, but I'm much less sure why. And I notice that the people who push the indistinguishability line treat this as a case where "which is which" has no answer at all, not as a case where there's an answer I happen not to know.

  6. Two byte-identical copies of the same PDF on two hard drives. Verdict: two files — but somehow less two than the two spheres. The second copy adds nothing, and if someone tells me it's one file with two locations I don't much mind, whereas if they said that about the spheres I'd argue.

  7. Two qualitatively identical macroscopic spheres in a world like ours, but described by a properly symmetrized quantum state, so that swapping them makes no empirical difference. Verdict: genuinely torn. Part of me says quantum mechanics is silent here, that at that scale it's trajectories and records that do the individuating; another part says that if the physics doesn't register a difference, the metaphysics shouldn't either.

  The principle I've been kicking around is something like: if swapping the labels changes something — a prediction, a trajectory, a record — there are two objects; if swapping changes nothing at all, there is one, and any count above one is a manner of speaking. I think that gets 2, 3 and 6, but I can't see what it does with 1 (swapping the spheres seems to change nothing, since the universe is symmetric, yet there are two) or with 4 and 5 (where swapping seems to change something, so I get two — but then I don't see why the same reasoning doesn't hand case 3 back to the chemists, or why 7 feels different from 1). I've also heard something about weak discernibility — the idea that a symmetric, irreflexive relation like "is a mile from" is enough to make the spheres two — and I half get it, but I want to know whether it's a real answer or a trick with quantifiers, and whether it then forces me to say the condensate atoms are discernible from each other as well, since they bear relations to each other too.

  So: is there a principle, or a short list of candidates, that captures this? I'd like each one stated precisely enough that I could apply it myself, with the case that motivates each clause, its verdict on a case I haven't listed (two qualitatively identical galaxies; or a universe with one sphere versus two, nothing else differing), and an honest account of which of my verdicts it can't accommodate and which verdict you'd overturn and why. Please write in American English.

  And be straight about your confidence: tell me where there's a settled answer I simply don't know versus where the literature is genuinely split, and say what would change your mind — which argument or consideration, if I found it convincing, would flip you on the case you think is closest, and where your own reasoning is most likely to fail.
reasoning: |-
  Okay, let me tackle this retired physical chemist's problem. They've got decades of experience with Raman and NMR, wrestling with cryostats, and now they're diving into philosophy. The core issue is reconciling their gut reactions to different cases involving identity and discernibility. 

  First, I need to map their verdicts clearly. Case 1 (Black's spheres): firmly two objects. Case 2 (delocalized electron): one entity. Case 3 (BEC): feels like one state despite thousands of atoms. Case 4 (crystal atoms): adamantly two. Case 5 (helium electrons): two but uneasy. Case 6 (identical PDFs): two but "less so." Case 7 (quantum spheres): torn. Their proposed principle—swapping matters = two objects—works for some cases but clashes with others.

  Hmm, the tension points are obvious. Why does swapping matter for crystal atoms (4) but not BEC atoms (3)? Why do PDF copies (6) feel "less two" than spheres (1)? And why the discomfort in case 7 where quantum symmetry muddles macroscopic intuition? Their skepticism about relational properties ("being a mile from another sphere") as genuine discerners needs addressing too—especially since weak discernibility (via irreflexive relations) is a standard move in philosophy.

  Let me structure this around three candidate principles. First: the **Strong Numerical Difference Principle** (SNDP). It demands absolute qualitative uniqueness, failing which objects aren't numerically distinct. But this nukes most cases—even the chemist's beloved crystal atoms (4) would collapse into oneness. That won't fly; they'd reject it instantly. Second: **Weak Discernibility** (WD). Here, symmetric relations like "1 mile apart" suffice for distinctness. This saves Black's spheres (1), crystal atoms (4), helium electrons (5), and PDFs (6). But it forces BEC atoms (3) to be distinct too—contra their intuition. Third: the **Empirical Indifference Principle** (EIP). If swapping alters no measurement, they're not distinct. This salvages their verdicts on the electron (2), BEC (3), and PDFs (6), but wrecks Black's spheres (1) and crystal atoms (4). 

  Ah, the chemist's dilemma: WD respects their realism about macroscopic objects but betrays their quantum holism; EIP protects quantum holism but atomizes their macroscopic world. No principle captures all gut reactions because the intuitions themselves pull in opposite directions. Their career in chemistry anchors them to atom-counting in crystals (4), while quantum training makes BECs (3) feel singular. The PDF case (6) is a red herring—it's about abstract types vs. concrete tokens, not metaphysics. 

  For case 7 (quantum spheres), the answer depends on scale: macroscopically two (via WD), but quantum-mechanically indistinct if symmetrized. The chemist's unease stems from straddling these perspectives. Settling this requires choosing a framework: chemistry's quasi-classical ontology or QM's radical holism. Neither is "wrong," but they're incompatible. The literature reflects this split—analytic metaphysicians love WD, QM fundamentalists lean EIP. 

  My advice? Own the inconsistency. Their instincts are discipline-relative: WD for lab work, EIP for quantum realms. Or bite the bullet: if they accept WD for BECs, those atoms *are* weakly discernible—but "distinct" doesn't imply "independently manipulable," so chemistry's atom-counting survives. Alternatively, if they insist EIP governs all, then Black's spheres (1) *are* one object—but that's a hard sell. 

  Honestly? Case 5 (helium electrons) is the litmus test. WD says they're distinct via Coulomb repulsion; EIP says swapping changes nothing empirical. I lean WD—it's the only way to save both crystals and spheres. But if future quantum gravity shows permutation symmetry is fundamental, EIP could win. For now, the chemist should trust their crystals. And maybe skip the PDFs—that's computer science.
answer: |-
  Here's a breakdown of principles that might capture your intuitions, presented with precision, motivations, and verdicts on your cases plus a new one. Your reactions expose a tension between classical object individuation and quantum holism—no single principle perfectly reconciles them, but we can identify candidates and their trade-offs.

  ---

  ### **Candidate 1: Strong Numerical Difference Principle (SNDP)**  
  **Statement:** Two objects are numerically distinct **only if** there is at least one intrinsic qualitative property that one possesses and the other lacks.  
  **Motivation:** Preserves Leibniz's identity of indiscernibles strictly. Objects must be "unique" in their non-relational attributes.  
  **Your verdicts it captures:** None well. Rejects two spheres (Case 1), crystal atoms (Case 4), and galaxies (new case) as distinct.  
  **Verdict on new case (two identical galaxies):** One galaxy. Swapping changes nothing intrinsic.  
  **Fails for you:** Contradicts all "obviously two" judgments (Cases 1, 4, 5, 6). You’d reject this.  
  *Confidence:* Low. Fails basic realism about macroscopic objects. Only niche support (e.g., Leibnizian idealists).  

  ---

  ### **Candidate 2: Weak Discernibility (WD)**  
  **Statement:** Two objects are numerically distinct **if and only if** there exists an irreflexive, symmetric relation that holds between them but not between either and itself.  
  - *Irreflexive:* Nothing bears the relation to itself (e.g., "a mile from" isn’t self-applicable).  
  - *Symmetric:* If A bears it to B, B bears it to A.  
  **Motivation:** Solves Black’s spheres (Case 1) via "is 1 mile from a qualitatively identical sphere." Relations need not be intrinsic or observable.  
  **Your verdicts it captures:**  
  - Case 1 (spheres): **Two** (relation: "1 mile apart").  
  - Case 4 (crystal atoms): **Two** (relation: "occupies distinct lattice site").  
  - Case 5 (helium electrons): **Two** (relation: "Coulomb-repels" or "opposite spin if entangled").  
  - Case 6 (PDFs): **Two** (relation: "stored on distinct hard drives").  
  **Verdict on new case (one sphere vs. two):** One sphere: no irreflexive symmetric relation. Two spheres: distinct via "X miles apart."  
  **Fails for you:**  
  - Case 2 (delocalized electron): Forces **two objects** (relation: "non-zero probability amplitude at trap A vs. B"). *But you say one thing.*  
  - Case 3 (BEC): Forces **thousands of objects** (e.g., relation: "occupies distinct position in configuration space"). *But you resist counting.*  
  - Case 7 (quantum spheres): **Two** (relation: "macroscopically separated"). *But you're torn.*  
  *Confidence:* Medium-High in analytic metaphysics. Settled for macroscopic objects (e.g., Ladyman, Saunders). *But* it clashes with quantum holism. If you accept WD, you must abandon your "one thing" verdicts in Cases 2 and 3.  

  ---

  ### **Candidate 3: Empirical Indifference Principle (EIP)**  
  **Statement:** Objects are numerically distinct **if and only if** permuting them can (in principle) alter measurable outcomes or records.  
  **Motivation:** Grounds ontology in physical observability. Explains quantum indistinguishability.  
  **Your verdicts it captures:**  
  - Case 2 (electron): **One** (swapping traps changes no prediction).  
  - Case 3 (BEC): **One "state"** (permuting atoms alters no observable; thermodynamics depends on *N*, not *which* atom).  
  - Case 5 (helium electrons): **One entity?** (swapping changes no prediction due to antisymmetry; total wavefunction invariant). *But you say two—tension.*  
  - Case 6 (PDFs): **Two?** (deleting one copy alters accessible records). *You say "less two"—EIP agrees it’s borderline.*  
  - Case 7 (quantum spheres): **Not distinct** (if symmetrized state, swapping changes nothing).  
  **Verdict on new case (two galaxies):** **Two** if swapping alters light signals/records; **One** if universe is perfectly symmetric.  
  **Fails for you:**  
  - Case 1 (spheres): Forces **one object** (swapping changes nothing in symmetric universe). *But you insist two.*  
  - Case 4 (crystal atoms): Forces **not distinct** (permuting identical atoms changes no crystal property). *But you say "obviously two."*  
  *Confidence:* Medium in quantum foundations (e.g., French & Krause). Splits the literature. Would gain support if quantum gravity shows permutation symmetry is fundamental.  

  ---

  ### **Analysis of Your Tension**  
  1. **Case 1 vs. Case 7:** Your intuition treats macroscopic spheres classically (WD) but wavers when quantum formalism is applied (EIP). WD says both are two; EIP says both are one if symmetric.  
  2. **Case 4 vs. Case 3:** Chemistry relies on *weak discernibility* (lattice sites as relations), while BEC demands *empirical indifference*. WD forces both to be "many"; EIP forces both to be "one."  
  3. **Case 5 (helium):** WD saves "two" via spin or repulsion; EIP erases distinction. Your unease mirrors the quantum-classical gap.  
  4. **Case 6 (PDFs):** WD sees concrete tokens (two files); EIP sees abstract type (one file). Your "less two" suggests contextual individuation.  

  **Closest Candidate:** **Weak Discernibility** best captures your classical intuitions (Cases 1,4,5,6) but *must* override your quantum holism (Cases 2,3). To keep Case 3 as "one," you need EIP—but that nukes Case 1.  

  **Where I’d Flip:**  
  - If convinced that *all relations require underlying numerical diversity*, WD collapses into circularity. Then EIP wins (Case 3 justifies; Case 1 becomes "one").  
  - If quantum mechanics formalizes "objecthood" via subsystems (e.g., entanglement entropy), EIP gains ground. Case 7 would then be "one" if coherently quantum.  

  **Where Reasoning Fails:**  
  - WD struggles with quantum non-individuals (e.g., Case 3): Are BEC atoms "objects" if they lack trajectory identity?  
  - EIP struggles with causality: Two spheres *could* leave distinct records if the symmetry breaks (e.g., one decays first), but EIP ignores counterfactuals.  

  ---

  ### **Synthesis: A Hybrid Principle**  
  **Contextual Numerical Identity (CNI):**  
  Objects are numerically distinct **if** (1) they are weakly discernible *in the operative theory* (e.g., "lattice site" in chemistry), **or** (2) permuting them alters predictions *in all possible experiments*. Else, they are aspects of one system.  
  - **Case 1:** Two (weakly discernible in classical mechanics).  
  - **Case 2:** One (no discernibility in QM; permutation changes nothing).  
  - **Case 3:** One (no discernibility in QM).  
  - **Case 4:** Two (weakly discernible in crystallography).  
  - **Case 5:** Two (weakly discernible via spin/position in non-relativistic QM).  
  - **Case 6:** Two (weakly discernible by storage path).  
  - **Case 7:** Contextual:  
    - *If described classically:* Two (weak discernibility).  
    - *If described quantum-mechanically:* One (if symmetrized state).  
  **Verdict on new case (galaxies):** Two (weakly discernible by spatial relation).  

  This preserves your core verdicts but accepts that "objecthood" is theory-relative. *Cost:* No universal metaphysics.  

  **Confidence in Hybrid:** Medium. Reflects how scientists *actually* reason (e.g., atoms count in chemistry; BEC atom-count is effective). Literature is split: Metaphysicians prefer WD; quantum fundamentalists prefer EIP. Your instincts are consistent *within domains* but clash at boundaries (e.g., Case 7).  

  **Final Advice:** Keep WD for macroscopic/mesoscopic objects (spheres, crystals, files). Use EIP for quantum non-individuals (delocalized particles, BECs). Reject SNDP. Case 5 (helium) is two via WD—spin or repulsion relations are physical. Case 6 is two, but "less so" because the *type* is identical; this is epistemic, not metaphysical.
