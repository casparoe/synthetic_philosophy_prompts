     - With a fixed meaning, if the parties agree on the facts (the properties of the lot, for example) and the fixed definition is clear, then if they still disagree, one of them is misapplying the definition (so substantive error). If the fixed definition is vague, then the disagreement is about the application of the vague term (which is not merely verbal because it's about the world: how bad is the lot?).

