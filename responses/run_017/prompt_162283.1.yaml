answer: |-
  Below is the specification for the **Semantic Anchor Test (SAT)**, a practical tool to determine whether a disagreement is merely verbal (i.e., hinges on divergent meanings of a word or phrase) or substantive (i.e., hinges on conflicting claims about the world). The SAT is designed for real-time use by non-experts at a "kitchen table," with no external resources required. It assumes all factual evidence is already agreed upon (as per your cases). Requirements are derived from your examples and constraints, with clear justifications. Non-negotiable requirements (NN) are essential for your purpose; others are preferences that could be dropped in different contexts.

  ---

  ### **Core Test Specification**
  The SAT is a 5-step process. Steps 1–4 diagnose the dispute; Step 5 resolves the fallout.  
  **Key Principle**: A disagreement is **merely verbal** iff (1) both parties agree on all non-linguistic facts, and (2) their conflict persists solely due to mismatched meanings of a contested term. All else is **substantive**.

  #### **Step 1: Identify the Contested Term**  
  - **Action**: Pinpoint the exact word or phrase causing disagreement (e.g., "alive," "blighted").  
  - **Case Motivating Requirement**: *Sourdough starter ("alive")*. Without clarity on the term, the test cannot isolate meaning clashes.  
  - **Why Broken Without It**: If the term isn’t isolated, the test could misattribute factual disputes (e.g., "Does it reproduce?") to meaning, violating NN requirements 7 (not ruling everything verbal) and 3 (handling vagueness).  
  - **Requirement Type**: NN.

  #### **Step 2: Check for Fixed Meaning**  
  - **Action**: Ask: *"Is this term predefined by an authority (e.g., law, contract, statute)?"* If yes, the dispute is **substantive** (about applying the definition to facts). Skip to Step 5.  
  - **Case Motivating Requirement**: *Vacant lot ("blighted")*. If a city grant defines "blighted," the dispute isn’t about meaning—it’s about whether the lot meets that definition.  
  - **Why Broken Without It**: Treating legally fixed terms as "verbal" ignores real-world stakes (e.g., grant money), violating NN requirements 4 (fixed meanings) and 8 (not equating verbal with pointless).  
  - **Requirement Type**: NN.

  #### **Step 3: Elicit Meaning-Independent Descriptions**  
  - **Action**: Have each party describe the **facts** relevant to the term **without using the term or synonyms**. E.g., for "alive": *"What observable features determine if something is 'alive'?"*  
    - If descriptions **match**, go to Step 4.  
    - If descriptions **differ**, the dispute is **substantive** (they disagree on facts). Stop.  
  - **Case Motivating Requirement**: *Sourdough starter*. Both agree on metabolism/reproduction/cells but disagree on "alive." Descriptions (e.g., "It metabolizes sugar") must match for verbal disputes.  
  - **Why Broken Without It**: Fails NN requirement 2 (incorrect usage) and preference 10 (consistency). E.g., if one party misuses "alive" by ignoring reproduction, descriptions would differ, revealing a substantive error.  
  - **Requirement Type**: NN.

  #### **Step 4: Apply the Substitution Protocol**  
  - **Action**: Replace the contested term with a nonsense word (e.g., "glorp"). Ask: *"Do you still disagree that X is glorp?"*  
    - **Yes** → Dispute is **substantive** (they agree on facts *and* meaning but clash on application).  
    - **No** → Dispute is **merely verbal** (they agree on facts but assign different meanings to the word).  
  - **Case Motivating Requirement**: *Existence of numbers*. If replacing "exists" with "glorp" ends the dispute (e.g., both agree numbers "glorp" or not), it exposes a meaning clash.  
  - **Why Broken Without It**: Fails NN requirements 1 (stipulation resistance) and 5 (non-existent entities). E.g., in the sourdough case, stipulating "alive = metabolism + reproduction" doesn’t resolve the dispute—substitution reveals if "alive" itself is the anchor.  
  - **Requirement Type**: NN (but substitution is the method; alternatives exist).

  #### **Step 5: Resolve the Fallout**  
  - **Action**:  
    - If **merely verbal**, declare: *"We agree on the facts but use the word differently. What definition should we adopt here, and why?"*  
    - If **substantive**, declare: *"We disagree about the facts or how to apply the definition."*  
  - **Case Motivating Requirement**: *Vacant lot*. If "blighted" is verbal, the real issue is which threshold of disrepair qualifies for the grant.  
  - **Why Broken Without It**: Fails NN requirements 6 (covert meaning adoption) and 9 (what’s left after verbal verdict).  
  - **Requirement Type**: NN.

  ---

  ### **Tensions and Trade-offs**  
  The SAT’s requirements create one irreconcilable tension and one severe (but manageable) friction:  
  1. **Irreconcilable Tension (Hole in Specification)**:  
     - **NN4 (Fixed Meanings)** vs. **NN1 (Stipulation Resistance)**.  
     - **Why**: Legally fixed terms (NN4) *should* make disputes substantive (e.g., "Is this lot blighted under the grant?"). But parties might still stipulate the definition and disagree on its application (NN1), blurring verbal/substantive lines.  
     - **Hole**: The SAT resolves this by **prioritizing NN4** (Step 2) and declaring such disputes substantive by default. This is a hole because it cannot handle cases where parties *misapply* a fixed definition without factual disagreement (e.g., borderline "blighted" lots). No test can fully satisfy both requirements simultaneously—your legal-stakes constraint (NN4) forces a compromise.  

  2. **Severe Friction**:  
     - **NN2 (Incorrect Usage)** vs. **NN6 (Covert Meaning Adoption)**.  
     - **Why**: Incorrect usage (NN2) implies a "right" answer (e.g., "Tomatoes are vegetables" is botanically wrong), while meaning adoption (NN6) is prescriptive (e.g., "We should call tomatoes vegetables for culinary purposes"). The SAT (Step 3) exposes factual errors (NN2) but reframes verbal disputes as meaning-adoption discussions (NN6). This works but risks conflating *correctness* (NN2) with *utility* (NN6).  

  ---

  ### **How SAT Knocks Out Obvious Candidate Tests**  
  - **The Bet Test** ("Would you bet $5 on your claim?"):  
    - **SAT Requirement That Defeats It**: NN7 (not ruling everything verbal when facts agree). Bets measure confidence, not meaning. In the sourdough case, both parties might bet confidently (high stakes for "alive"), misclassifying a verbal dispute as substantive. SAT avoids this by isolating meanings (Steps 3–4).  

  - **The Two Approaches You Pictured**:  
    1. **Made-Up Word Test** ("Replace ‘alive’ with ‘glorp’"):  
       - **Weaknesses**: Fails NN4 (fixed meanings; e.g., legal "blighted" can’t be swapped) and NN2 (incorrect usage; e.g., if one party’s "glorp" is nonsense, it doesn’t reveal errors). SAT incorporates this in Step 4 but anchors it with Steps 2–3.  
    2. **"Meaning Adoption" Approach** ("It’s always about which usage to adopt"):  
       - **Weaknesses**: Fails NN5 (non-existent entities; e.g., "Do unicorns glorp?" isn’t about adoption) and NN4 (fixed meanings). SAT uses this in Step 5 but only after verifying factual agreement (Steps 1–4).  

  ---

  ### **Non-Negotiable (NN) vs. Preference Requirements**  
  | **Requirement** | **Type** | **Why NN?** |  
  |----------------|----------|-------------|  
  | 1. Handles stipulation of same definition | NN | Core to sourdough case; verbal disputes persist even when definitions are "agreed." |  
  | 2. Handles incorrect usage | NN | Prevents misclassifying errors (e.g., misusing "alive") as meaning differences. |  
  | 3. Handles vagueness (e.g., "blighted") | NN | Your cases rely on continuum disputes; SAT treats them as verbal in Step 4. |  
  | 4. Handles fixed meanings (e.g., statutes) | NN | Legal/financial stakes are paramount; cannot be dissolved as "verbal." |  
  | 5. Handles non-existent entities | NN | SAT Step 4 addresses this (e.g., numbers "glorp"). |  
  | 6. Handles covert meaning adoption | NN | Step 5 explicitly redirects to this issue. |  
  | 7. Not rule everything verbal when facts agree | NN | Prevents false positives; SAT requires meaning mismatch (Step 4). |  
  | 8. Not treat "verbal" as "pointless" | NN | Step 5 preserves stakes (e.g., grants, philosophy). |  
  | 9. Say what’s left after verbal verdict | NN | Step 5 forces meaning-adoption discussion. |  
  | 10. Consistent verdict for sourdough/numbers | Preference | SAT gives both "merely verbal" if facts agree, but stakes affect Step 5 (adoption discussion). |  

  ---

  ### **How SAT Handles Your Cases**  
  - **Sourdough Starter**:  
    Step 1: Term = "alive."  
    Step 2: No fixed meaning → Proceed.  
    Step 3: Both describe same facts (metabolism, etc.).  
    Step 4: Substitution ("glorp") ends disagreement → **Merely verbal**.  
    Step 5: Shift to "Which definition of ‘alive’ is useful here?"  

  - **Vacant Lot (with legal grant)**:  
    Step 1: Term = "blighted."  
    Step 2: Fixed by grant → **Substantive** (apply definition to facts).  

  - **Existence of Numbers**:  
    Step 1: Term = "exists."  
    Step 2: No fixed meaning → Proceed.  
    Step 3: Both agree on facts (e.g., "Numbers are abstract").  
    Step 4: Substitution ("glorp") ends disagreement → **Merely verbal**.  
    Step 5: Shift to "Should ‘exist’ apply to abstract objects?"  

  ---

  ### **Final Note**  
  The SAT satisfies all NN requirements except the NN4/NN1 tension, which creates a hole for borderline legal cases. If parties both accept the fixed definition *and* agree on facts but dispute application (e.g., "Is this ‘blighted’ enough?"), the SAT defaults to "substantive" (Step 2) but cannot resolve it—this is a conceptual limit, not a flaw in the test. For kitchen-table use, focus on Steps 3–4: If describing facts without the contested term ends the fight, it’s verbal. Else, it’s substantive. No philosophy degree required.
