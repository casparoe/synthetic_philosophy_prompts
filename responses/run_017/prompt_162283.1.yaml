  - Requirement 3: Handled by Step 4 (classifying as verbal but not dismissing the importance).
  - Requirement 5: Handled by Step 5.
  - Requirement 6 and 9: Handled by Step 6.
  - Requirement 7: The test only rules as verbal when the facts (properties) are agreed.
  - Requirement 8: The test does not say the dispute is pointless.

  Tensions:

  - The tension between fixed meaning (Step 2) and requirement 1: Step 2 bypasses the rest of the test for fixed meanings, so if the meaning is fixed, we don't do the replacement or meaning elicitation. This avoids the conflict because the test says: if there's a fixed meaning, then the dispute is substantive (about application). But note: what if the parties are not using the fixed meaning? Then Step 2 might be skipped because they don't realize it's fixed? So the test requires that the parties are aware of the fixed meaning? We must add: if the term is fixed by an authority, then the parties must use that definition. If they are not, then it's a different issue.

