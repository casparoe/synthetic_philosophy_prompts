prompt: |-
  I don't have any academic background — I work in insurance claims and I moderate a neighborhood Facebook group — but I keep walking into the same kind of argument, and what I want is a tool for it rather than a reading list. I have no library access, so please don't send me toward papers or authors or titles; I need something I could actually run at a kitchen table. The shape is always the same: two people agree on every fact anyone could check, agree that they agree, and still won't stop. My brother-in-law and I went round for an hour on whether his sourdough starter is alive, having already settled everything about metabolism, reproduction, and cells. Our group burned a whole meeting on whether the vacant lot on Fourth Street counts as blighted, which matters because the wording of a city grant turns on it. And when I read online that enormous old questions — whether numbers exist, whether there is really a table there in addition to the particles — might be nothing but disputes about words, I can't tell whether that's a deep point or a way of changing the subject.

  So here's the ask: write me the specification for a test that tells you whether a disagreement is merely verbal, meaning a clash of meanings dressed up as a clash about the world, or genuinely substantive. The purpose fixes the standard: this has to be usable by the people having the argument, in real time, with no philosopher in the room, on disputes where the facts are already settled. Give me each requirement together with the case that motivates it — a case I could actually hand to someone — and why the test is broken without it. What it must handle: disagreements that survive after both sides stipulate the same definition; cases where one person is simply using the word incorrectly rather than using it differently; disputes about where to draw a line on a continuous scale, like whether a lot is blighted or a room is clean; terms whose meaning is fixed in advance by a contract or statute; disputes about things everyone agrees don't exist; and cases where the two sides are covertly arguing about which meaning we ought to adopt instead of about the facts. What it must not do: rule everything verbal just because the parties agree on the evidence, or treat a verdict of verbal as the same verdict as pointless. It also has to say what is left of a dispute once it is declared verbal, whether the real argument has moved to which usage we should adopt, and whether the test should give the same verdict for the sourdough case and the existence-of-numbers case or whether the stakes are allowed to change the answer. Mark which requirements are non-negotiable for my purpose and which are preferences that someone with different aims could reasonably drop.

  The part I most want is the tensions. I suspect there is a real conflict between requiring that the verdict depend only on what the two speakers mean and what facts they have, and requiring that the test never dissolve a dispute whose classification carries money or legal consequences, but tell me if there is a worse pair, and if some subset of the list cannot be satisfied together then say plainly that the specification itself has a hole in it. Then: which single requirement does the most work in knocking out the obvious candidate tests — including the one my friend keeps proposing, where you ask whether each side would take a small bet on their claim — and one paragraph on how the two approaches I can picture hold up against the list, the one where you replace the contested word with a made-up word and see whether the argument survives, and the one where you say the disagreement was really about which usage to adopt all along. No scorecard beyond that paragraph; the criteria are what I am paying for.
reasoning: |-
  We are constructing a test to determine if a disagreement is merely verbal (a clash of meanings) or substantive (a clash about the world). The test must be usable by the arguers in real time, without a philosopher, and after facts are settled.

  Key requirements (non-negotiable unless marked otherwise):

  1. **Handles stipulation of the same definition**: Even if both parties agree to use the same definition, the disagreement might persist because they are using the word differently in practice. This requirement is non-negotiable because it's common (e.g., the sourdough starter case: they might agree on a definition of "alive" but still disagree because one is applying it differently).

  2. **Handles incorrect usage vs. different usage**: Sometimes one person is just wrong about the standard meaning (e.g., calling a tomato a vegetable in a botanical context) rather than having a different meaning. The test must distinguish this from a merely verbal dispute. Non-negotiable.

  3. **Handles vagueness (continuous scales)**: For terms like "blighted" or "clean", which are vague, the test must not dismiss the dispute as merely verbal just because there's a gray area. Non-negotiable.

  4. **Handles fixed meanings (contract/statute)**: If a term is defined by a legal document, the test must respect that and not treat the dispute as merely verbal if it's about applying the fixed definition to the facts. Non-negotiable.

  5. **Handles non-existent entities**: Disputes about things that don't exist (e.g., "Is the present King of France bald?") must be handled. The test should recognize that even if the entity doesn't exist, the disagreement might be about the meaning of the words. Non-negotiable.

  6. **Handles covert disagreements about meaning adoption**: Sometimes the real issue is which meaning we should adopt (e.g., in the neighborhood group, they might be arguing about whether the lot is blighted but really care about whether it qualifies for the grant, which requires a specific definition). The test must reveal this. Non-negotiable.

  7. **Must not rule everything verbal when facts are agreed**: If the test does this, it would dismiss all disputes where facts are settled, but sometimes the disagreement is substantive (e.g., about interpretation of the same facts). Non-negotiable.

  8. **Must not treat "verbal" as "pointless"**: Even if the dispute is verbal, it might be important (e.g., the legal grant). Non-negotiable.

  9. **Must say what is left after declaring a dispute verbal**: The test must clarify whether the dispute has shifted to which meaning to adopt or if there's still a substantive issue. Non-negotiable.

  10. **Must handle the sourdough and numbers cases consistently or explain why not**: The test should either give the same verdict for both (both verbal) or explain why the stakes change the answer. This is a preference (if the test is about meaning, then both are verbal, but the stakes might make one more important).

  Tensions:

  - The main tension is between requirement 4 (fixed meanings) and requirement 1 (disagreement persists after stipulation). In a legal context, the meaning is fixed, so if both parties stipulate the legal definition and still disagree, it might be about the application (substantive) rather than meaning. But the test must not dissolve the dispute as merely verbal because of the legal consequences (requirement 8). This is a conflict: the test must recognize that even with a fixed definition, the application might be contentious and not merely verbal.

  - Another tension: requirement 2 (incorrect usage) and requirement 6 (covert disagreement about meaning adoption). If one person is using the word incorrectly, then the dispute might be about the correct meaning (which is substantive if there is an authority) or about which meaning to adopt. The test must distinguish.

  - Requirement 3 (vagueness) and requirement 7 (must not rule everything verbal) are in tension because vague terms often lead to borderline cases that are not merely verbal (they are about where to draw the line) but also not purely factual. The test must capture that.

  Is there a hole? The requirements seem satisfiable if we design the test carefully.

  Candidate tests that fail:

  - **The bet test (your friend's)**: Ask each side if they would take a small bet on their claim. If both would, it's substantive; if not, it's verbal. Why it fails:
    - Requirement 1: In the sourdough case, both might be willing to bet because they are confident in their meaning, so it would be misclassified as substantive.
    - Requirement 3: In the blighted lot case, both might be willing to bet on their view of the line, so again misclassified as substantive.
    - Requirement 4: In a legal context, if the definition is fixed, both might be willing to bet on their interpretation, but the dispute might be about the application (which is substantive) or the meaning (if they are ignoring the definition). The bet test doesn't distinguish.
    - Requirement 5: For non-existent entities, both might refuse to bet (since there is no fact) but that doesn't make it verbal? Or one might bet and the other not? Unclear.
    - Requirement 8: Even if both refuse to bet because they know it's vague, the dispute might be important (so not pointless) and verbal, but the test might then rule it verbal, which is okay? But the bet test doesn't capture the importance.

    The bet test is broken because it doesn't probe the source of the disagreement (meaning vs. world) but only confidence.

  Two approaches:

  1. **The made-up word test (replacement)**: Replace the contested word with a made-up word (e.g., "glorp") and see if the disagreement remains.

     - How it might work: For the sourdough starter, if we replace "alive" with "glorp", and both parties agree on all the facts (metabolism, reproduction, etc.) but still disagree about whether the starter is glorp, then the dispute is merely verbal (they are assigning different meanings to "glorp"). If they agree on whether it's glorp, then the original dispute was substantive.

     - Evaluation against requirements:
       - Requirement 1: If they stipulate a definition and still disagree, replacing the word might expose that they are using it differently even with the same definition. But if they stipulate, they might try to use the same definition, but then the replacement might not help because they are now using the same definition. However, the replacement test can reveal that without the word, they agree on the facts. So this test does well on 1.
       - Requirement 2: If one person is using the word incorrectly, then when replaced, they might not have a disagreement because the incorrect user might not have a clear meaning for the made-up word. This test doesn't directly handle incorrect usage. It might misclassify: if the incorrect user doesn't know what "glorp" means, they might not have a position, so the disagreement vanishes -> verbal? But that might be wrong because the dispute was about the correct meaning. So it fails requirement 2.
       - Requirement 3: For vague terms, replacing "blighted" with "glorp" might lead to a disagreement about whether the lot is glorp, which would be taken as verbal. But the dispute about where to draw the line might be substantive (about the facts of the lot and the concept). However, the test might rule it verbal when it's not entirely verbal because the vagueness is inherent. So it fails requirement 3.
       - Requirement 4: In a legal context, if the word is replaced, the parties might still disagree because the made-up word doesn't carry the legal definition. But the test would then say it's substantive? However, if they are both using the legal definition, then replacing the word should lead to agreement? But if they are arguing about how to apply the legal definition to the facts, then replacing the word might not help: they might agree on the facts and the definition but disagree on the application. The test might then show that without the word, they agree on the facts, so it would be verbal? But that's wrong because the application is substantive. So it fails requirement 4.
       - Requirement 5: For non-existent entities, replacing "exists" with "glorp" might lead to agreement? Or they might still disagree about whether numbers glorp? The test might show that they disagree even with the made-up word, so substantive? But that's not right because numbers don't exist in the physical world. This is tricky. The test might not clearly handle this.
       - Requirement 6: The test doesn't reveal the covert disagreement about meaning adoption. It only shows if the dispute is verbal or not.

     Overall, the made-up word test fails requirements 2, 3, 4, and 5.

  2. **The meaning adoption approach**: The disagreement is really about which meaning to adopt. This approach says that if the dispute is verbal, then the real issue is which meaning we should use.

     - How it might work: In the sourdough case, the real issue is whether we should adopt a biological definition of "alive" that includes starters. In the blighted lot, it's about which definition of "blighted" to adopt for the grant.

     - Evaluation:
       - Requirement 1: It handles it by shifting the dispute to meaning adoption.
       - Requirement 2: If one is incorrect, then the real dispute is about the correct meaning (which might be substantive if there is an authority) or about which meaning to adopt. This approach can capture that by framing it as meaning adoption.
       - Requirement 3: For vague terms, it can frame the dispute as where to set the threshold for the word. This is a form of meaning adoption. So it works.
       - Requirement 4: In a legal context, the meaning is fixed, so the dispute cannot be about meaning adoption? Then this approach might break: the dispute is about the application of the fixed meaning. So it fails requirement 4 because it would incorrectly reframe the dispute as about meaning adoption when it's not.
       - Requirement 5: For non-existent entities, it might frame the dispute as about the meaning of "exists". That might be acceptable.
       - Requirement 6: This approach directly addresses this by saying the dispute is about meaning adoption. So it works.

     Overall, this approach fails requirement 4 (fixed meanings) and might not satisfy requirement 9 (what is left) because it always shifts to meaning adoption, but in the legal case, the meaning is fixed so the shift is incorrect.

  Proposed Test Specification:

  We design a test that combines elements and addresses the requirements.

  **The Test for Merely Verbal Disagreement (MVD Test)**:

  Step 1: **Isolate the contested term(s)**. Identify the word or phrase that is the focus of the disagreement (e.g., "alive", "blighted").

  Step 2: **Check for fixed meaning**. If the term has a meaning fixed by an authority (contract, statute, etc.), then the dispute is not merely verbal; it is about the application of that meaning to the facts. (Satisfies requirement 4) Skip to Step 5.

  Step 3: **Elicit each party's meaning without using the term**. Ask each party to describe the characteristics of the thing in question without using the contested term or any synonym. For example, for the sourdough starter, ask: "What properties does the starter have that make you say it is alive (or not alive)?" Record the properties each party provides.

     - If the properties described by both parties are the same, then the disagreement is merely verbal (they are using the same facts but labeling them differently). (Handles requirement 1 and 7)
     - If the properties described are different, then the disagreement is substantive (they are disagreeing about the facts). (Handles requirement 7)

     But note: one party might be using the term incorrectly (requirement 2). We can check that by:

     Step 3a: **Check for standard meaning**. If one party's description of the properties is clearly inconsistent with the standard meaning (and the other party's is consistent), then the dispute is not merely verbal; it is about the correct application of the standard meaning (and one party is wrong). (Handles requirement 2) However, if there is no standard meaning, then we proceed.

  Step 4: **Vagueness handling**. If the term is vague (like "blighted" or "clean") and the parties agree on the properties but disagree on whether the term applies, then the dispute is not merely verbal in the sense that it is about the boundary of the concept. However, for the purpose of the test, we can say it is verbal in the sense that the disagreement is about the meaning (the threshold). But note requirement 3: we must not rule it as merely verbal if it's about the line. So we say:

     - If the parties agree on all the properties (facts) and the disagreement is only about whether the term applies given these properties, then the dispute is merely verbal (because it turns on the meaning of the term). However, we must note that the real issue might be about where to set the threshold (meaning adoption). (This satisfies requirement 3 by not dismissing it but by reclassifying it as verbal and then moving to meaning adoption in Step 6.)

  Step 5: **Non-existent entities**. If the dispute is about the existence of something that both agree does not exist in the physical world (like numbers), then:

     - Ask: "If we set aside the word 'exists', do you agree on the properties of the thing in question?" If they do, then the dispute is merely verbal (they are using 'exists' differently). (Handles requirement 5)

  Step 6: **What remains?** If the dispute is declared merely verbal, then the real issue is which meaning of the term to adopt. The parties should shift the discussion to: "Given that we agree on all the facts, which definition of [term] should we use in this context, and why?" (Handles requirement 6 and 9)

  Step 7: **Stakes and importance**. The test does not declare the dispute pointless (requirement 8). It only says it is verbal. The importance (e.g., legal consequences) is preserved in the discussion about which meaning to adopt.

  Step 8: **Consistency across cases**. The test will declare both the sourdough starter and the numbers case as merely verbal if the parties agree on the properties (metabolism, reproduction, etc. for starter; the abstract nature of numbers for numbers). But in the numbers case, if they don't agree on the properties (one thinks numbers are mental constructs, the other thinks they are platonic), then it might be substantive. The stakes do not change the verdict of the test, only the importance of resolving the verbal dispute. (Handles requirement 10 as a preference: same verdict when the fact pattern is similar.)

