  Below is a decision tree taxonomy for the Death in Damascus case, structured as requested. It isolates positions via logically independent questions answerable without prior knowledge of the theories, with leaves capturing core commitments and awkwardnesses. The tree addresses your specified variants (99% vs. 70% accuracy, legible vs. opaque prediction, delegation device, memory-erasure drug) while avoiding direct theory-identification questions.

  ---

  ### **Death in Damascus: Decision Tree Taxonomy**

  #### **Background Fixes**
  - Two cities: Damascus (D) and Aleppo (A). Survival utility = 1,000 (net of travel costs); death utility = 0.
  - **Death is a predictor**, not a pursuer: It forecasts your destination with accuracy (99% or 70% with known flight-prediction bias) and waits there.
  - **Legible prediction**: Written on a card in a sealed envelope you can open *before* choosing.
  - **Opaque prediction**: Prediction exists but is hidden until *after* your choice.
  - **Delegation device**: Before choosing, you may irrevocably delegate your choice to a RNG (output unpredictable; degrades Death's accuracy to 50%).
  - **Memory-erasure drug**: After opening the envelope (if legible) but before departing, you may erase your memory of the prediction.

  ---

  #### **Decision Tree**  
  *Answer sequentially; each branch is a yes/no question about reasoning, not prior theory.*

  1. **Can a near-perfect predictor (99%) of your destination coexist with your rational deliberation, given you see its prediction?**  
     - **No** → **Leaf 1: Inconsistent Stipulations**  
       *Awkward commitment: Must deny the empirical possibility of high-accuracy prediction of rational agents, rendering the case "unsolvable" by fiat.*  
     - **Yes** → Proceed to 2.

  2. **In the legible case, does seeing the prediction change your estimate of Death's location?**  
     - **No** → **Leaf 2: Causal Decision Theory (CDT)**  
       *Awkward commitment: Chooses to "switch" cities after seeing the prediction (e.g., go to A if D predicted), but this makes Death's accuracy 0% for you—contradicting its 99% global accuracy.*  
     - **Yes** → Proceed to 3.

  3. **Does the *mere option* of delegation (before seeing the prediction) increase your survival chance, even if unused?**  
     - **No** → Proceed to 4.  
     - **Yes** → **Leaf 3: Functional Decision Theory (FDT)**  
       *Awkward commitment: Treats delegation as "ratified" (self-consistently optimal) at 99% accuracy, but this forces 50% survival—lower than switching's 100% in the moment.*  

  4. **In the legible 99% case, is *any* deterministic choice (D or A) rationally permissible?**  
     - **Yes** → **Leaf 4: Evidential Decision Theory (EDT)**  
       *Awkward commitment: Like CDT, chooses to "switch" after seeing the prediction, but this invites a fatalist loop where your decision rule guarantees Death's accuracy drops to 0% for you.*  
     - **No** → Proceed to 5.  

  5. **Is a mixed strategy (e.g., randomizing 50-50 between D and A) rationally required at 99% accuracy?**  
     - **Yes** → **Leaf 5: Mixed-Strategy Equilibrium**  
       *Awkward commitment: Forces you to randomize even when one option appears strictly better (e.g., switching seems to guarantee survival).*  
     - **No** → Proceed to 6.  

  6. **At 70% accuracy with flight-prediction bias, does flipping a biased coin improve survival odds?**  
     - **Yes** → **Leaf 6: Accuracy-Sensitive Ratificationism**  
       *Awkward commitment: At 70%, requires a *biased* randomization (e.g., 60% towards Death's bias city), but this "optimal" mix shifts arbitrarily with accuracy—violating decision stability.*  
     - **No** → Proceed to 7.  

  7. **After seeing the prediction (legible case), does memory erasure + random choice dominate not erasing?**  
     - **Yes** → **Leaf 7: Deliberational Dynamics**  
       *Awkward commitment: Claims erasure "resets" rational choice, but this requires you to pay costs to *lose information* and randomize—seemingly irrational mid-deliberation.*  
     - **No** → Proceed to 8.  

  8. **Is there *any* sequence of choices (including delegation/erasure) that is self-ratifying?**  
     - **Yes** → **Leaf 5** (if 99%) or **Leaf 6** (if 70% with bias)  
       *[Loop: Mixed-strategy and ratificationist views converge here at 99% but diverge at 70%.]*  
     - **No** → **Leaf 8: Diachronic Tragedy**  
       *Awkward commitment: Concludes no rational act exists—rationality itself breaks down in predictable environments.*  

  ---

  #### **Leaf Summary**
  | **Leaf** | **Position** | **Key Commitment** | **Awkwardness** |
  |----------|--------------|-------------------|-----------------|
  | 1 | Inconsistent Stipulations | Case is ill-posed | Denies empirical coherence of prediction |
  | 2 | Causal Decision Theory (CDT) | Chooses "switch" post-prediction | Undercuts Death’s accuracy (0%) for you |
  | 3 | Functional Decision Theory (FDT) | Delegation always "ratified" | Settles for 50% survival at 99% accuracy |
  | 4 | Evidential Decision Theory (EDT) | Chooses "switch" post-prediction | Creates fatalist loop (accuracy → 0%) |
  | 5 | Mixed-Strategy Equilibrium | Randomization required at 99% | Ignores apparent dominance of switching |
  | 6 | Accuracy-Sensitive Ratificationism | Biased randomization at 70% | "Optimal" strategy shifts arbitrarily |
  | 7 | Deliberational Dynamics | Memory erasure optimizes choice | Pays costs to lose information + randomize |
  | 8 | Diachronic Tragedy | No permissible act exists | Rationality fails in predictable worlds |

  ---

  #### **Unseparated Pairs & Diagnostics**
  - **CDT (Leaf 2) vs. EDT (Leaf 4)**:  
    *Tree separates them at Q4* (EDT rejects deterministic permissibility; CDT accepts it). They converge on "switch" but diverge on whether this is *stable*.  
  - **FDT (Leaf 3) vs. CDT (Leaf 2)**:  
    *Separated at Q3* (FDT endorses delegation's option value; CDT does not).  
  - **Mixed-Strategy (Leaf 5) vs. Ratificationism (Leaf 6)**:  
    **Cannot be separated at 99% accuracy**—both require randomization. **Pry apart with 70% accuracy + bias**: Mixed-strategy ignores bias; ratificationism biases the coin toward Death's prediction tendency.  
  - **FDT (Leaf 3) vs. Ratificationism (Leaf 6)**:  
    *Separated at Q3* (FDT prioritizes functional outcomes; ratificationism focuses on act stability).  

  #### **Unoccupied Combinations**
  - **Path: Yes→Yes→No→Yes→Yes (Q1–Q5)**: *Incoherent*. Claims the case is coherent, prediction is evidentially relevant, delegation has no option value, deterministic acts are permissible, yet mixed strategies are required—contradicts Q5's "no" to determinism.  
  - **Path: Yes→No→N/A→No→Yes→No→Yes**: *Unexplored*. Rejects prediction's evidential relevance but endorses memory erasure. No major theory occupies this niche, as erasure is usually motivated evidentially.  

  ---

  ### **Instructions for Use**
  - **Graduate audience**: Assumes familiarity with Newcomb's problem (e.g., dominance vs. conditional reasoning), but no Death in Damascus literature.  
  - **Tree navigation**: Students answer questions based on intuitions about rationality, not pre-existing theory labels.  
  - **Variants**: Accuracy (99% vs. 70% w/bias), legibility, delegation, and erasure are embedded in questions (e.g., Q3/Q7).  
  - **Key insight**: Highlights how prediction legibility creates instability, and how delegation/erasure "solutions" trade control for consistency.  

  This tree isolates commitments while respecting your constraints. For deeper theory splits (e.g., CDT vs. FDT in non-DiD cases), I recommend adding a **counterfactual-dependence variant** (e.g., "Death updates its prediction if you delegate").
