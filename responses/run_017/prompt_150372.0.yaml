answer: |-
  Here’s the demandingness objection translated into your craft vocabulary, with friction points and a committed conclusion:

  ### Translation of Demandingness Objections into Narrative Terms
  1.  **"Asks too much" as Motivation Collapse:** Her "spine" (maximize net good) demands that *every* scene choice be dictated by external arithmetic. This vaporizes *sustainable personal motivation*. A character who always acts on abstract calculation, never on desire, loyalty, or self-preservation (even momentarily), lacks the internal friction that generates believable energy. Her motivation isn't just strong; it's *totalitarian*, leaving no room for the 3am doubts that make a character feel alive. The "refused scene" becomes impossible – she *never* plausibly wants anything *but* the optimal outcome. What does she refuse? A nap? A fleeting moment of pride? A friend’s hug that wastes 30 seconds of useful time? Without a refused scene rooted in human frailty or affection, she reads as an algorithm, not a person.

  2.  **"Alienation from deepest projects" as Spine Conflict Suppression:** Her "deepest projects" (her novel? a relationship? mastering a craft?) are narratively inert because her spine *requires* their immediate abandonment the moment the arithmetic shifts. This isn't character development; it's **permanent anti-arc**. There's no tension *within* her spine, only between her spine and *every other possible human impulse*. A strong single spine (e.g., Ahab's vengeance) works because it battles *external* forces and the character's *own* limitations. Her spine battles *her own humanity itself* as the antagonist, which narrative structure struggles to depict without turning her into a monster or a void. The "arc" becomes a flatline of relentless sacrifice, devoid of the internal struggle that defines change or tragedy.

  3.  **"Collapses permissible/heroic into obligation" as Stakes Erosion:** When *every* morally significant choice demands maximal sacrifice, **dramatic stakes evaporate**. Saving a child from a burning building costs her only time she'd have spent on equally effective malaria nets – it’s just math. There's no "merely permissible" choice left to contrast against the "heroic." All choices are equally obligatory, just differing quantities. This drains individual scenes of unique weight and makes her entire life feel like an undifferentiated slog of obligation. The reader loses the crucial narrative compass of scale – what *is* a big moment for *her*? Nothing is bigger or smaller; it's all utility calculus.

  4.  **"Saints are dull or unnerving" as POV Poison:** A "moral saint" life *is* a strong spine. The problem isn't the spine itself, it's the **POV cost of enacting it without internal conflict**. From *her* POV, the calculations are clear. But for the reader inside her head, it becomes either:
      *   **Dull:** Relentless, frictionless optimization. No internal debate, no regret, no longing – just execution. (The refused scene vanishes).
      *   **Unnerving:** If we see the *cost* (exhaustion, suppressed grief, the chilling ease of abandoning connection), but she *doesn't* register it as conflict relevant to her choices (because the spine forbids it), the POV becomes dissociated and terrifying. Her humanity is present only as suppressed noise, not as a driver. This creates profound reader alienation *from the protagonist* – the opposite of typical POV goals.

  ### Residue Report: Where the Bunching Happens
  1.  **Impartiality (Narrative Voice vs. Moral Standpoint):**
      *   **The Friction:** Omniscient or Multi-POV narration *can* mimic impartiality by surveying many perspectives. But this is **voice-as-technique**, not a true translation of the *moral* impartial standpoint. The narrative voice, even omniscient, always carries *tone* (irony, compassion, judgment, awe). The moral impartial view is affectless calculation. Attempting this voice risks sounding cold, detached, or ironically judgmental *of the character it observes*. It doesn't *embody* impartiality; it *reports* on someone trying (and failing, humanly) to *simulate* it. The "impersonality" achieved is a *literary effect*, not a philosophical state. The bunching occurs because the narrative voice *cannot* escape perspective and tone, while the moral standpoint strives to eliminate them. The closer the narration gets to "no one in particular," the more it risks feeling inhuman or ironically detached from the very human cost it depicts.

  2.  **The Saint's Life (Strong Spine vs. Narrative Cost):**
      *   **The Friction:** Your vocabulary *can* describe the shape of this life (strong spine, relentless action, sacrifice). **What it lacks is a specific term for the *narrative cost* of a spine that actively suppresses *all other potential sources of narrative energy* (internal conflict, personal desire, relational depth beyond utility).** It can describe *that* she abandons her work, but struggles to articulate *why* this feels existentially hollow *within the narrative logic*, beyond just "it's sad." The objection isn't just that it's a strong spine, but that **this particular spine (pure consequentialist obligation) is inherently antagonistic to the messy, self-contradictory, desire-driven engines that power compelling character-driven narrative.** It’s a spine that *requires* the character to be alienated from the very things (personal projects, deep loves as ends-in-themselves) that typically generate relatable motivation and conflict. Your tools describe the *structure* beautifully, but the *objection* is about the *life-sucking* nature of that specific structure for *dramatic humanity*.

  ### Commitment: The Residue Reveals
  **The demandingness objection, when translated into novelistic terms, reveals itself to be fundamentally about the *human cost of sustaining that life* and *who bears that cost* – not a missing category in your vocabulary, but the brutal reality your vocabulary exposes.**

  The philosopher worries about the *rational* burden and conceptual incoherence. Your craft tools expose the *narrative* burden: **a life organized this way systematically drains the protagonist of the relatable human impulses, internal conflicts, and personal stakes that make a character resonate as a person on the page.** The "demandingness" manifests as *dramatic* bankruptcy – the erosion of sustainable motivation, the suppression of internal conflict, the evaporation of meaningful stakes differentiation, the poisoning of POV intimacy, and the elimination of the revelatory refused scene. It costs the *character* their recognizable humanity, and it costs the *narrative* its core engines of engagement. The residue bunches because your vocabulary is ruthlessly effective at showing *how much it costs her to be who she is*, and how that cost makes her feel inhuman *to the reader*. The objection was always about the cost; the novel proves it by showing the corpse.
