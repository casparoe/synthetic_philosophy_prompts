answer: |-
  Here's your scenario and analysis:

  **Scenario:** The University Housing Policy states: "No open flames are permitted in student rooms at any time. This prohibition includes candles, incense, or portable stoves using combustion." Maya, an art student, uses powerful, high-wattage halogen lamps for photography projects in her room. During extended use, the lamps overheat a nearby curtain, causing a small fire. Housing cites her for violating the "no open flames" rule. Maya argues the lamps are electrical appliances, not open flames.

  **Check:**
  *   **Textualism:** Acquits Maya. The rule's text explicitly defines "open flames" by referencing combustion ("candles, incense, or portable stoves using combustion"). The lamps use electricity, not combustion, to generate light/heat. The ordinary meaning of "open flame" does not encompass an electric bulb, regardless of its heat output. The text is clear and specific.
  *   **Purposivism:** Cites Maya. The rule's undeniable purpose, evident from the context (dormitory fire safety) and the listed examples (all significant fire hazards), is to prevent fires ignited *within* student rooms. Maya's lamps, while not flames, are demonstrably capable of igniting materials and caused an actual fire, directly contravening the core safety objective.
  *   **Key Feature:** **Under-inclusion of the Text Relative to the Purpose.** The rule's text ("open flames...using combustion") captures only one *means* (combustion) of achieving the purpose (fire prevention), but the purpose itself is broader (preventing *all* ignition sources within rooms that pose a similar risk). The textual category is a subset of the purposive category.
  *   **Without that Feature:** If the rule text was broader (e.g., "No items posing a significant fire ignition hazard"), or if the purpose was narrower (e.g., specifically preventing wax drips or ceremonial smoke), the conflict disappears. Text and purpose would align.
  *   **Strongest Textualist Reply:** "The purpose is clear, but the *rule enacted* to achieve it deliberately chose specific language focusing on combustion. Legislators (or the housing committee) knew about electrical fires but *excluded* them from this prohibition, perhaps relying on electrical codes or deeming them less likely. Adding non-combustion hazards now, even if sensible, rewrites the rule, usurping the rule-making authority and creating unpredictable liability where the text promised none. If electrical appliances pose a similar hazard, a *new, separate rule* should be drafted."

  **Why it works:**
  *   **Setting:** Ordinary university housing.
  *   **Text Clarity:** "Open flames...using combustion" clearly excludes electric appliances.
  *   **Purpose Clarity:** Fire prevention in dorms is an obvious, paramount purpose; the examples reinforce this.
  *   **Reversed Outcome:** Textualism = lenient (no violation), Purposivism = strict (violation).
  *   **Conflict Source:** The explicit textual limitation ("combustion") fails to capture a foreseeable scenario (intense electrical heat) that falls squarely within the rule's undeniable core purpose (preventing room fires). The theories diverge on whether to prioritize the chosen limitation or the overarching goal.
  *   **No Lenity:** Civil university sanction.
  *   **No Stipulation:** Purpose inferred from context/function of the rule.
  *   **Theories Drive Outcome:** Textualism sticks to the enacted words; Purposivism looks to the problem the rule was designed to solve.
