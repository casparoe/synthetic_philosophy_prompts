prompt: |-
  Hey — I'm taking a jurisprudence seminar this term and we've got to write our own hypothetical for next week's problem set, and I'm stuck. I need a case where textualism and purposivism come apart in the direction nobody expects. Everyones example goes the other way: textualism is the harsh literal-minded one that screws people over (no vehicles in the park, so tanks count too) and purposivism is the sensible one that lets you off. I want mine reversed — the plain ordinary meaning of the rule clearly lets the person off the hook, but the rules clear purpose clearly catches them, so the purposivist ends up being the stricter one.

  Constraints: one paragraph, set somewhere ordinary — a uni housing rule, a workplace policy, a clubs constitution — and definitely not a criminal statute, I dont want the rule of lenity muddying everything. The wording cant be vague or ambiguous and the purpose cant be something I just stipulate out of nowhere; both should be clear from the rule and its context. And no sci-fi, no futuristic tech. The disagreement has to fall out of the two theories, not from me announcing what they'd say.

  After the scenario, do the check: what each theory says and why it says it, then name the single feature of the case doing the work (under-inclusion? changed circumstances? something else?), show what happens if I remove that feature, and finish with the strongest thing a textualist could say in reply — not a strawman version. It's for a problem set, so the case has to generate the disagreement rather than just declare it.
