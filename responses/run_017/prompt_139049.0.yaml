prompt: |-
  I'm in the final year of a PhD in infectious-disease modelling — I fit transmission models to surveillance data and then have to stand up in front of people who control animal-health policy and argue that one model is better supported by the data than another — so I have more than an academic stake in the argument below. My flatmate, who works in philosophy of science, has been chipping away at me for months with it. His claim is that no body of evidence, however large, could ever favour one empirically adequate theory over another, and hence that what my field calls model selection is really aesthetics plus career incentives. Every step looks unobjectionable to me when taken on its own, and the conclusion is one I cannot accept either professionally or in ordinary life. Here is the argument as he finally wrote it out for me on the back of a takeaway menu:

  (1) Take any theory T that fits our current evidence E. For any claim C you like about some as-yet-unobserved case, define T* as: T holds for every case in E, and in every case not yet observed, C holds instead. T* fits E exactly as well as T; T* is logically incompatible with T whenever C contradicts what T says about the unobserved case; and there is no limit on how many such C you can pick, so for any E there are arbitrarily many mutually incompatible theories each fitting E perfectly. (This is just the grue-style manoeuvre generalised: emeralds are green in all observed cases and blue thereafter, gravity is attractive until 1 January 2100 and repulsive afterwards, and so on.)
  (2) If a body of evidence E is compatible with arbitrarily many mutually incompatible theories, all of which fit E equally well, then E gives no reason whatsoever to prefer T to any of them. As far as the evidence goes the theories are symmetric, and any further tie-breaker — simplicity, elegance, unification, the fact that T is the one that occurred to us first — is a fact about us rather than a reason to think T is true.
  (3) The construction in (1) is not peculiar to the evidence we happen to have now. For any body of evidence whatever, present or future, the same manoeuvre can be run again on it: however much we have observed, there are rivals that fit all of it and diverge everywhere else. So at no point, and after no amount of evidence, does anything give us a reason to prefer T to its rivals.
  (4) Therefore no claim about anything unobserved is ever justified by evidence — not 'this bridge will hold', not 'the sun will rise tomorrow', and not 'this model will forecast next quarter's case numbers better than that one'.

  I have a vague sense that something is being smuggled between (1) and (3) — that (1) shows something about each body of evidence taken separately while (3) needs a rival that somehow survives every body of evidence we could ever get — but when I put this to him he says the gap is easily closed, either by iterating the manoeuvre or by pointing to theories that really are empirically equivalent come what may (Euclidean geometry plus a universal distorting force, or the hypothesis that the world sprang into existence five minutes ago complete with my data spreadsheets). I don't know whether that repair works, and I don't know what it would cost me if it does.

  So: which step of the argument do you reject, and why does the step you reject look so much like it is fine? Please price the alternatives honestly — in particular, if you reject (2), tell me what it is about simplicity or prior probability that could make it a guide to truth rather than a psychological convenience, and whether that guide is itself answerable to evidence; and if you reject the move from (1) to (3), tell me whether the repaired argument (the one resting on globally, permanently empirically equivalent rivals) would then prove too much, since it seems to bear on observable matters like tables and other minds and not merely on electrons. If I have to choose, I would much rather keep the claim that my evidence can favour one model over another than keep the argument that says it cannot. Please answer in British English, and be explicit about how confident you are in the diagnosis you give: say which step your own account is most likely to be wrong about, and what argument or consideration would change your mind.
reasoning: |-
  Alright, let's tackle this step by step. The user is a PhD candidate in infectious-disease modelling, facing a philosophical challenge from their flatmate. The core issue is whether empirical evidence can ever justify preferring one model over another when both fit the data. The flatmate's argument uses underdetermination to claim that model selection is essentially aesthetic or career-driven. 

  First, I need to parse the argument's structure. Step (1) shows how to generate infinitely many theories that fit existing evidence by altering unobserved predictions. Step (2) claims this makes evidence symmetric, rendering tie-breakers like simplicity subjective. Step (3) extends this to all possible evidence, and Step (4) concludes that no unobserved claim can be justified. 

  I see the user's unease with the leap from Step (1) to (3). Step (1) deals with current evidence, while Step (3) requires rivals that remain equivalent under all future evidence. The flatmate suggests fixing this with permanent equivalents (e.g., universal distorting forces or 5-minute-old worlds), but that feels like cheating—these rivals aren't scientific theories but skeptical traps. 

  My rejection focuses on Step (2). I argue that simplicity isn't arbitrary; it's a reliability heuristic shaped by evolution and scientific success. Parsimony correlates with predictive accuracy because the universe isn't maliciously complex. If simple models consistently failed, science would adapt—but they don't. Bayesian probability formalizes this: simpler models often have higher prior probabilities because they're less flexible, making good fits more significant. 

  The user's profession matters here. In disease modelling, simplicity (e.g., fewer parameters) avoids overfitting. If two models fit current data, the simpler one often generalizes better to new data. This isn't just aesthetics—it's track-record efficacy. If the flatmate were right, policy decisions couldn't rationally prefer one model over another, which feels absurd when lives are at stake. 

  I’m 80% confident. The weak spot? If someone proved that simplicity doesn’t correlate with truth in our universe, I’d rethink. But centuries of science suggest otherwise. For the repaired argument (Step 3), globally equivalent rivals are irrelevant to science—they’re unfalsifiable by design. Science deals with testable theories; skepticism about tables or other minds is a different debate. 

  The user’s relief at keeping evidence-based model selection is telling. They need ammunition against radical underdetermination without dismissing philosophy entirely. Emphasizing the practical success of parsimony in their field—and its grounding in predictive reliability—should help.
answer: |-
  Right, this is a proper philosophical gut-punch – your flatmate’s argument is a sharpened version of the **underdetermination of theory by evidence**, and it’s designed to rattle anyone reliant on inductive inference, especially in policy-critical modelling. I reject **step (2)** as the critical flaw, and I’ll explain why it *seems* plausible but fails, while addressing your concerns about simplicity and the move to step (3). Here’s the breakdown, in British English as requested.

  **The Core Rejection: Step (2) is Misleading**
  *   **What Step (2) Says:** "If evidence E is compatible with arbitrarily many mutually incompatible theories fitting E equally well, then E gives no reason whatsoever to prefer T to any of them. Any tie-breaker (simplicity, elegance, etc.) is about us, not truth."
  *   **Why I Reject It (Confidence: ~80%):** This step conflates *logical possibility* with *epistemic warrant*. While it's *logically true* that infinitely many functions can fit any finite dataset (as per Step 1), it's *epistemically false* that all these functions are equally plausible or equally well-supported *as descriptions of the underlying phenomenon*. Step (2) ignores the crucial role of **background knowledge, theoretical constraints, and the principle of parsimony (simplicity) as a genuine, albeit fallible, guide to likely truth**.
  *   **Why Simplicity Isn't *Just* Aesthetics or Psychology:**
      *   **Reliability & Predictive Power:** Simpler theories (e.g., fewer parameters, fewer ad hoc adjustments, smoother extrapolations) consistently demonstrate greater **predictive reliability** across diverse scientific fields. This isn't coincidence; it reflects that the universe exhibits a degree of regularity and structure. A wildly complex, gerrymandered theory like "gravity works as Newton says until 1 Jan 2100, then reverses, but only on Tuesdays in leap years, otherwise it follows Einstein except near cheese..." *might* fit existing data, but its very complexity makes it statistically *unlikely* to hold universally. Simpler theories are less prone to **overfitting** the noise in the specific dataset `E`.
      *   **Bayesian Formalism:** Probability theory provides a formal framework. Simpler theories often have higher **prior probabilities** precisely *because* they make fewer, less specific assumptions. When they fit the data `E` well, they achieve a higher **posterior probability** than complex rivals that fit `E` equally well. This prior isn't arbitrary; it's informed by the historical success of parsimony and the structure of the problem domain (e.g., infectious diseases spread via contact networks, not random teleportation). The prior *is* answerable to evidence: if simpler models consistently failed in a domain, our priors would shift (e.g., quantum mechanics forced acceptance of counter-intuitive complexity).
      *   **Explanatory Power & Unification:** Simple theories often explain more with less. Newtonian gravity unified celestial and terrestrial motion. A simple SIR model captures core epidemic dynamics. A grue-style `T*` explains *only* the specific data `E` and offers no coherent mechanism for the discontinuity; it's explanatorily sterile. This coherence *is* evidence of capturing something real.
      *   **It's About the World, Not Just Us:** The *reason* simplicity works as a guide is that the universe *is* structured in ways that often allow simpler descriptions to be accurate. Our preference for simplicity evolved *because* it tracks real patterns in the world that are fitness-relevant (predicting predators, seasons, etc.). It's a cognitive tool refined by natural selection and scientific practice to latch onto real regularities. Calling it "just psychological" ignores its external success conditions.

  **Addressing Step (1) to Step (3) and the "Repair" (Confidence: ~85%)**
  *   Your intuition about a "smuggle" is spot-on. Step (1) shows **local underdetermination** (for current `E`). Step (3) claims **permanent, global underdetermination** (for any `E`, present or future).
  *   The "repair" (using globally empirically equivalent rivals like universal forces or 5-minute hypotheses) *does* establish permanent underdetermination *for those specific, artificially constructed rivals*. **But here's the key:** These rivals are **not scientific theories** in the relevant sense. They are:
      1.  **Radically Disunified:** They posit ad hoc, unexplained forces or discontinuities solely to mimic the predictions of `T` *no matter what*. They lack internal coherence or independent motivation.
      2.  **Unfalsifiable by Design:** They are explicitly constructed *never* to generate different predictions than `T` (e.g., the universal force always perfectly counteracts any observable difference Euclidean vs. non-Euclidean geometry would produce). Genuine scientific theories are *risky*; they make predictions that *could* falsify them.
      3.  **Explanatorily Vacuous:** They explain nothing beyond "it looks exactly like `T` works". They offer no understanding.
  *   **Why This Doesn't "Prove Too Much" About Tables or Other Minds:** The radical sceptical hypotheses *do* underdetermine observable matters like tables or other minds *if* we demand absolute, metaphysical certainty. However:
      *   **Science Doesn't Deal in Metaphysical Certainty:** It deals in justified belief based on evidence, coherence, and explanatory power. The simplicity and coherence of "tables are solid objects" and "other humans have minds like mine" provide overwhelming justification *given our background knowledge and the success of these assumptions in navigating the world*. The grue-style or 5-minute rivals are parasitic on these ordinary beliefs and offer no competing explanation.
      *   **Distinguishing Scientific Underdetermination from Scepticism:** Your flatmate's argument conflates a genuine challenge for scientific model selection (local underdetermination) with radical philosophical scepticism (global underdetermination via artificial constructs). Rejecting the latter doesn't invalidate the former, nor the tools (like parsimony) used to navigate the former. Science operates *within* a framework of robust common-sense realism about observables, using methods justified by their instrumental success. The existence of unobservable electrons is inferred *within* this framework using the same parsimony-guided model selection that justifies beliefs about bridges holding.

  **What This Means For Your Modelling (Confidence: ~90%)**
  *   Your practice is **vindicated**. Model selection *isn't* just aesthetics plus careerism.
  *   When you argue model A is better supported than model B given data `E`, you are justified because:
      1.  **Parsimony Matters:** If A fits `E` *as well as* B but with fewer parameters, avoids arbitrary future discontinuities, or aligns better with established biological mechanisms (e.g., realistic contact networks vs. random mixing), it *is* more likely to generalise to new data. This is based on the *track record* of parsimony in producing reliable predictions.
      2.  **Background Knowledge Matters:** Models consistent with well-established biological principles (e.g., incubation periods, transmission routes) are inherently more plausible than grue-style alternatives that violate them without justification, even if both fit `E`.
      3.  **Predictive Success Matters (Eventually):** While `E` alone underdetermines, *future* evidence `E'` *can* break the symmetry. The simpler, more coherent model is *more likely* to survive `E'`. Your job involves judging which model is *best positioned* to do so based on current `E` + background knowledge + parsimony. This is rational, evidence-based inference, not whim.
  *   The flatmate's argument shows the **logical gap** induction must leap, but not that the leap is unjustified or that all landing points are equal. Parsimony, coherence, and background knowledge provide the warrant for the leap towards the most plausible theory.

  **Where I Could Be Wrong (Confidence Calibration):**
  *   **Confidence in Rejecting Step (2): ~80%.** The weak spot is justifying *why* simplicity tracks truth in *this* universe. A radical sceptic could insist it's just a lucky coincidence. My counter is the historical success of science *using* parsimony and the implausibility of a universe perfectly structured to deceive us via simplicity. If someone demonstrated a fundamental domain (e.g., quantum gravity) where complex, disunified theories *consistently* outperformed simpler ones on *novel predictions*, my confidence would drop significantly.
  *   **Confidence in Distinguishing Local/Global & Rejecting the "Repair": ~85%.** The distinction between scientific underdetermination and radical scepticism via artificial equivalents feels robust. If someone constructed a *genuine, motivated, unified scientific theory* that was *permanently* empirically equivalent to our best theories (not just a sceptical toy), *and* it was simpler or more elegant, that would be deeply challenging and force a major rethink (confidence would plummet). No such theory exists.
  *   **Overall Confidence in Defence of Model Selection: ~90%.** The practical, instrumental success of science and modelling, grounded in these principles, is overwhelming evidence for their validity. To abandon them because of logical possibilities like grue or 5-minute worlds would be epistemic paralysis. Your flatmate's argument is clever, but ultimately proves only that absolute certainty is unattainable, not that rational, evidence-based discrimination between models is impossible or arbitrary.

  **In summary:** Reject Step (2). Simplicity/parsimony, informed by background knowledge and a track record of success, *is* a guide to likely truth, not mere psychology. The move from Step (1) to Step (3) relies on conflating local underdetermination (real) with global underdetermination via artificial sceptical constructs (irrelevant to scientific practice). Your model selection is rationally justified. Now go tell your flatmate his takeaway-menu argument, while clever, doesn’t sink the scientific ship – it just shows the ocean is deep. You’re still the one navigating it successfully with your charts. Best of luck with the PhD viva and those policy presentations.
