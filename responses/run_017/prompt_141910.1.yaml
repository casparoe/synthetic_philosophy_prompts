prompt: |-
  I am a print journalist on a long run of pieces about the moral texture of ordinary life — the unwritten rules that turn out to matter more to people than most statutes do. Please take the role of a moral philosopher who has spent years working on convention, coordination, and complicity, and advise me the way you would advise a friend who has to act tomorrow morning, not the way you would write for a journal. Before you answer, do a short unstructured brainstorming pass in which you list the distinctions you think could bear on my situation — coordination versus etiquette, harm to identifiable people versus symbolic protest, what guests owe hosts, when going along becomes complicity, when refusing becomes rudeness or free riding — and then tell me which of those distinctions actually carries the weight and which are red herrings. Then commit: one verdict per episode, no fence-sitting, including a plain statement of which of my colleague's behaviours I should copy, which I should tolerate, and which I should try to talk him out of.

  Here is what has actually happened during three weeks in this city. Tipping does not exist as I know it; instead there is a chipped jar by the door of every restaurant, and diners drop coins in on the way out, and at the end of the week the entire staff — line cooks, dishwashers, the woman who clears tables — divides it in equal shares, regardless of who carried which plates. My colleague, who is from home and works in the same trade I do, keeps insisting on folding a note under his plate for the person who actually served him, on the ground that rewarding the person who did the work is simply fairer; the staff have been putting it in the jar anyway and looking pained about it. Second, at the bakeries and the government offices here it is entirely normal, priced openly, and not in the least furtive to buy someone's place in a queue: a pensioner who would have been standing there anyway sells you her spot for a posted sum, and everybody, including the people further back, treats this as unremarkable. My colleague refuses to buy a place, which costs him an entire afternoon, and then lectures the woman who offered him hers about exploiting the elderly — while still benefiting from a line that is shorter because other people sell. Third, everyone crosses mid-block when no car is in sight, police officers included, but there is a second, unwritten rule my colleague has never noticed: you do not cross in front of someone who is waiting at the light with a child or an elderly relative, because it makes them look like fools for standing there. Last night he waited at a red light and loudly told a woman who had stepped off the kerb that she was teaching children to break the law — and she had in fact been waiting at the crossing herself, with her grandmother on her arm.

  So: does a visitor owe locals conformity in matters like these, or only courtesy, or something in between? Where is the line between respecting a convention and propping up an arrangement I think is bad — a tip economy that lets owners underpay, a market in queue positions that advantages the rich, a street-crossing practice that makes the law look silly? Is my colleague's intransigence a principled stand, a failure of imagination, or a species of free riding, and does the answer differ between the jar, the queue, and the kerb? I strongly suspect the three cases do not all come out the same way, and I want you to tell me where the differences lie and why. I have to file twelve hundred words in four days and I would rather not turn in another column telling readers to do as the locals do.
reasoning: |-
  Okay, the user is a print journalist working on a series about the moral texture of everyday life, focusing on unwritten rules. They've encountered three specific situations in a foreign city: tipping practices, queue-buying, and jaywalking etiquette. Their colleague is challenging these local norms, and they need to determine when conformity is necessary versus when resistance is justified. 

  First, I need to unpack the core tension here: the conflict between respecting local conventions and maintaining personal moral principles. The journalist is clearly uncomfortable with both blind conformity ("do as the locals do") and their colleague's rigid approach. They want nuanced distinctions, not platitudes. 

  Hmm, the three scenarios test different moral dimensions. The tipping jar is about distributive justice (equal vs merit-based pay), queue-buying involves market ethics and exploitation, and jaywalking centers on social cohesion and signaling. The colleague's behavior varies too—he's actively disruptive in the tipping case, performatively self-sacrificing in the queue, and publicly shaming in the street-crossing incident. 

  Interesting how the journalist emphasizes the grandmother detail in the jaywalking story. That suggests they intuitively grasp the social signaling aspect—the unwritten rule isn't just efficiency, but protecting vulnerable people from feeling foolish. Meanwhile, the colleague misses this layer entirely. Classic moral blindness to context. 

  For the tipping jar, the key is harm: the colleague's individual tips undermine a system designed to lift dishwashers and cooks. His "fairness" argument ignores how restaurant hierarchies already favor servers. But in queue-buying, the harm is murkier—the pensioner benefits voluntarily, and refusing to participate doesn't change the system. His lecture to her though? Unforgivably rude. 

  Ah, and the jaywalking! Here the colleague commits the worst sin: mistaking etiquette for law. The real moral failure is humiliating a woman caring for her grandmother under the guise of "teaching children." That’s not principle—it’s social tin-earness. 

  The journalist’s deadline pressure is palpable. They need crisp verdicts, not philosophy lectures. Good thing they rejected the "when in Rome" cliché—this deserves better. I’ll structure it: verdict per case, clear "copy/tolerate/talk-out-of" labels, then underlying principles. Must emphasize that context switches the moral calculus each time. 

  ... Wait, did I just argue that buying queue spots is defensible while "fair" tipping isn’t? That feels counterintuitive but right. The tipping disrupts an equalizing mechanism; queue markets just shift time burdens. And the street-crossing? Pure social cruelty disguised as righteousness. 

  Final note to self: remind them their colleague’s real flaw is universalizing his own norms. The piece’s power will come from showing how morality lives in specifics—the grandmother’s arm, the dishwasher’s cut, the pensioner’s choice.
answer: |-
  Here's my raw brainstorming—distinctions flashing through my mind as I consider your dilemma:

  1.  **Coordination vs. Etiquette:** Is this about solving a practical problem (everyone benefits from knowing *how* we queue/cross/tip) vs. mere politeness?
  2.  **Harm (Identifiable) vs. Harm (Systemic) vs. Symbolic Gesture:** Is the colleague *harming* specific people (the server embarrassed?) vs. protesting a system (owners underpaying?) vs. just making a symbolic point?
  3.  **Guest Obligation: Conformity vs. Courtesy:** What do visitors truly owe locals? Mimicking everything, or just basic respect and non-disruption?
  4.  **Complicity Threshold:** When does *participating* in a local norm mean endorsing/supporting its underlying flaws? When does *refusing* become disruptive complicity in a *different* harm (e.g., slowing the queue)?
  5.  **Free Riding:** Is benefiting from a system (shorter queue) while refusing its mechanisms (buying spots) hypocritical?
  6.  **Rudeness vs. Principle:** When does refusal cross from principled stand into unnecessary offense or public shaming?
  7.  **Rule of Law vs. Practical Convention:** How much weight does the *written* law (jaywalking) carry vs. the efficiency/safety consensus?
  8.  **Fairness (Individual Merit) vs. Fairness (Collective/Equitable):** The core tension in the tipping case.
  9.  **Voluntary Exchange vs. Exploitation:** The queue market – is it mutually beneficial or inherently coercive?
  10. **Context Sensitivity:** Does the *presence of vulnerability* (child, elder) change the moral calculus of a convention?

  **Weight vs. Red Herrings:**

  *   **Carries the Weight:** Harm (both specific and systemic), Guest Obligation (Courtesy, not Conformity), Complicity Threshold, Context Sensitivity (vulnerability), Fairness Type (Collective vs. Individual), Rudeness vs. Principle, Free Riding (in queue case).
  *   **Red Herrings (or Lesser Weight):** Pure Coordination (these have deeper implications), Pure Rule of Law (jaywalking law is clearly secondary to local practice/safety here), Pure Etiquette (it's deeper than manners).

  **The Verdicts: One Per Episode, No Fence-Sitting**

  1.  **The Tipping Jar:**
      *   **Your Colleague:** **Talk him out of it.** Immediately. His behavior is actively harmful.
      *   **Reason:** He is *directly harming* identifiable individuals – the staff forced into an awkward position, undermining their *collective* system designed for *equitable* distribution (which likely helps lower-paid kitchen staff). His "fairness" ignores the restaurant's power structure where servers already have more visibility/control; the jar *corrects* for that. His action props up the *actual* injustice – owners underpaying – by fracturing worker solidarity. His "principle" is myopic individualism. **Copy?** **No.** **Tolerate?** **No – intervene.** Put his note in the jar yourself if needed, explaining *why* the system exists.

  2.  **The Queue Market:**
      *   **Your Colleague:** **Tolerate** his refusal to buy a spot. **Talk him out of** lecturing the pensioner.
      *   **Reason:** Refusing to participate in a voluntary, transparent exchange (pensioner selling surplus time/mobility) is a defensible personal choice, even if inefficient for him. It *is* arguably free-riding on the shorter queue created by others' trades, but the systemic harm (advantaging the rich) is diffuse. **However, his lecture is reprehensible.** He publicly shames someone engaging in a consensual, culturally accepted act, likely causing her distress. He assumes exploitation where mutual benefit exists, ignoring her agency. **Copy?** **No** (his rudeness). **Tolerate?** **Yes** (his personal choice to wait), **No** (his public scolding). **Talk out of?** **Yes** (the scolding).

  3.  **The Jaywalking & The Kerb Rule:**
      *   **Your Colleague:** **Talk him out of it.** Emphatically. His behavior is arrogant, harmful, and misses the point entirely.
      *   **Reason:** His focus on the *written law* ignores the effective, context-sensitive *safety/convenience convention* embraced by locals, including police. Crucially, he is *blind* to the deeper, more important unwritten rule: **protecting the vulnerable from social embarrassment or pressure.** By publicly shaming the woman crossing with her grandmother (who *was* following the vulnerability rule!), he caused direct social harm. He prioritized abstract "law-breaking" over concrete kindness and social cohesion. His "lesson" was pure performative rudeness. **Copy?** **Absolutely not.** **Tolerate?** **No.** **Talk out of?** **Yes – immediately and firmly.**

  **Where the Differences Lie & Why:**

  *   **Tipping:** The harm is **immediate, systemic, and undermines worker equity.** Refusal isn't just non-conformity; it's an *attack* on the local solution to a shared problem (low wages). Complicity in owner underpayment exists *regardless*, but breaking the *staff's* counter-system makes you complicit in *their* direct harm.
  *   **Queue Market:** The harm/critique is **systemic but abstract** (advantages the rich). The transaction itself is **consensual and benefits the seller.** Refusal is a personal cost with minimal systemic impact (free-riding is minor). The ethical line is crossed **not by refusing, but by attacking the participants** (the pensioner).
  *   **Jaywalking/Kerb Rule:** The "harm" of jaywalking is **primarily legalistic and ignored in practice.** The **real moral weight** is on the *unwritten rule protecting the vulnerable*. The colleague's action **ignored this higher-order kindness** and **caused direct social harm** through public shaming. His focus was entirely misplaced.

  **Your Colleague's Intransigence:**

  *   **Tipping Jar:** **Failure of imagination + Complicity.** Fails to see the collective equity, actively harms staff, props up the owner's system.
  *   **Queue Market:** **Principled stand (flawed) + Free riding + Rudeness.** Defensible refusal tainted by hypocrisy (benefiting) and the grave sin of scolding the pensioner.
  *   **Kerb Rule:** **Failure of imagination + Rudeness.** Utter blindness to the actual moral texture (protecting the vulnerable) and substitution of performative legalism for decency.

  **The Line for a Visitor:**

  You owe locals **courtesy, non-disruption, and an attempt to understand the *why* behind conventions.** You do **not** owe blind conformity. The line for resisting is crossed when your action:

  1.  **Directly harms identifiable individuals** (tipping jar staff, scolded pensioner, woman with grandmother).
  2.  **Willfully ignores a context-sensitive rule protecting the vulnerable** (kerb rule).
  3.  **Involves public shaming or lecturing locals** about *their* systems on *your* terms.

  Respecting convention means recognizing its function, even if flawed. Propping up a bad arrangement happens when your action **directly strengthens the harmful element** (tipping jar disruption helps owners) or **attacks the symptom rather than the cause**. Your colleague consistently attacked symptoms (the jar, the queue seller, the jaywalker) while often reinforcing the root problem or causing new harm.

  **File This:** Don't just say "do as locals do." Argue that the moral texture lies in **understanding the "why," minimizing harm (especially to vulnerable individuals), and prioritizing social cohesion over performative individualism.** Judge each local solution on: **1) Does it solve a practical problem? 2) Does it mitigate harm (especially to the less powerful)? 3) Does your action as a visitor disrupt or support *that*?** In these cases, the jar passes (1 & 2), the queue is neutral/debatable on (2), the kerb rule passes (1 & 2 emphatically). Your colleague failed all three tests. Good luck with the piece – it's a vital question.
