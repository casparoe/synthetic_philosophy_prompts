  **Joke:**  
  Beauty muses: "If the drug always worked, I'd be a thirder. If it never worked, I'd be a halfer. But with it working half the time, I'm a 4/7-er—which is just as hard to explain as the original dispute."

  **Explanation:**  
  The joke exploits how the *absence of memory becomes evidence for heads* (since remembering an awakening would prove tails), shifting Beauty's credence strictly between the halfer's 1/2 and thirder's 1/3. It presupposes the credence is **4/7**, calculated as follows:  
  - Probability of no memory given heads is 1 (no prior awakening to forget).  
  - Probability of no memory given tails is 3/4 (Monday always has no memory; Tuesday has no memory only if Monday’s drug worked, prob. 1/2).  
  - By Bayes’ theorem, P(heads | no memory) = (1 × 1/2) / [(1 × 1/2) + (3/4 × 1/2)] = 4/7.
