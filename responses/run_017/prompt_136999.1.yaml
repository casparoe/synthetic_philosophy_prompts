answer: |-
  ### Scenario: Infection Control in an NHS Hospital Ward  
  A large NHS hospital ward faces recurrent outbreaks of multidrug-resistant infections. The threat is objective and severe: pathogens spread via contaminated surfaces and poor hand hygiene, causing preventable deaths. The team is highly interdependent (doctors, nurses, porters); hospital epidemiology provides excellent real-time data on pathogen hotspots; and management introduces a strict regime. Clear, detailed hand-hygiene protocols are displayed ubiquitously. Dedicated, well-trained auditors observe compliance via CCTV and ward rounds, issuing escalating sanctions (retraining to suspension) *only* for verified breaches, with zero corruption or arbitrariness. Yet infection rates worsen under strict enforcement. The mechanism: averting novel outbreaks relies on staff voluntarily reporting near-misses (e.g., accidental glove tears), subtle symptoms in patients, or lapses *before* harm occurs—disclosures suppressed by fear of sanction, despite management’s good intent. Under a looser regime with anonymised incident reporting and peer-led coaching, outbreaks decrease as staff share critical, perishable local intelligence.  

  ---

  ### Verdicts by Standpoint  
  **(a) Threat–Coordination Functionalism**  
  Recommends *loosening*. Under strict enforcement, rational agents avoid reporting errors or anomalies to evade sanctions, degrading the early-warning system. Expected coordination failure is high: unreported near-misses enable outbreaks. Under looser norms (strong peer expectations of hygiene) with non-punitive incident reviews, voluntary disclosure rises, enabling proactive containment. The functional outcome—outbreaks averted—improves despite identical threats and resources. Tightness fails *by its own metric*: maximising group survival.  

  **(b) Rule-of-Law/Legibility**  
  Recommends *tightening*. Discretionary judgement and ambiguous reporting channels create unpredictable enforcement, risking arbitrary outcomes. Clear, codified rules ("sanitise hands within 30 seconds of patient contact") with certain auditing ensure equal treatment and accountability. Sanctions prevent "invisible" negligence. Voluntarism invites subjectivity; codification guarantees universal compliance, aligning with legibility’s core aim: eliminating opaque discretion.  

  **(c) Expressive/Motivational Crowding-Out**  
  Split verdict. Supports *strong norms* (shared attention to hygiene reinforces collective duty) but opposes *severe sanctions*. Punishment signals distrust, displacing intrinsic responsibility to uphold safety. Staff interpret sanctions as transactional, reducing goodwill-based cooperation (e.g., mentoring juniors). Outcome: moderate norms with low-to-moderate sanctions optimise motivation, but the framework cannot resolve if norms or sanctions dominate.  

  ---

  ### Load-Bearing Feature and Its Removal  
  **Feature:** Averting the threat requires *voluntary disclosure of hard-to-observe, non-automatic failures* (e.g., self-reported lapses).  
  **Removal:** If failures were centrally detectable (e.g., sensors logging all hand-sanitising), disclosure becomes redundant. Uniform compliance suffices. Functionalist logic then recommends tightening—validating the original theory.  

  ---

  ### Strongest Counterargument (Legibility View) and Reply  
  **Counterargument:** "You conflate severity with clarity. Legibility demands codified rules to constrain arbitrariness but allows lenient enforcement (e.g., amnesty for self-reports). This retains predictability without chilling disclosure."  
  **Reply:** Conceded that decoupling *codification* from *severity* might mitigate the issue. However, even clear rules with formal "safe harbours" may not overcome fear-driven underreporting if sanctions exist for *other* violations. Staff rationally generalise enforcement’s risk, especially if audits are pervasive. Legibility’s insistence on codification still risks suppressing contextual judgement where rules cannot cover all contingencies (e.g., atypical symptoms).  

  ---

  ### Where the Case Might Fail  
  1. **Empirical challenge:** If studies show that in high-stakes settings (e.g., aviation), strict enforcement *enhances* error-reporting via formal "just culture" systems, the behavioural premise (fear suppresses disclosure) collapses.  
  2. **Smuggled values:** The scenario assumes "voluntary disclosure" is purely functional. If it implicitly values autonomy (e.g., staff dignity in self-governance), it breaches functionalism’s remit.  
  3. **Contestable behavioural premise:** A sceptic could argue professionals report errors *despite* sanctions due to training or ethics—making strictness viable without degradation. Evidence from healthcare whistleblowing studies (e.g., Berwick Report 2013) suggests otherwise, but remains debatable.  

