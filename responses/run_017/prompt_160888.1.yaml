  ### 5. Repugnant Case Under BRD
  **Case**: *A person refuses a safe, well-paying job to pursue a high-risk art career (non-basic good), becomes destitute. They knew the risk (`risk_discoverability=easy`), had alternatives (`alternatives_available=True`), and weren’t vulnerable (`vulnerable_agent=False`).*  
  **BRD Verdict**: ❌ Not compensable.  
  **Why Repugnant?** You might feel compelled to aid a starving artist on humanitarian grounds, but BRD denies compensation (it was a separable, discoverable risk). This clashes with intuition that society should support non-standard life paths. *However, humanitarian aid still applies if they’re below the floor*.

