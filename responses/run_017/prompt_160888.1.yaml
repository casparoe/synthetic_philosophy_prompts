    Motivated by **Cases 1, 5, and 9**.  
    e.g., Case 1 (innate condition) and Case 5 (flood in emission-affected zone) have risks bound to basic goods (health/shelter) with no alternatives.  
  - **Undiscoverable/Socially Structured Risk (Condition 2)**:  
    Motivated by **Cases 4, 10, and 2**.  
    e.g., Case 4 (startup) is a shared social risk; Case 10 (prescribed drug) had undiscoverable risk; Case 2 (smoking) has partial social amplification (ads).  
  - **Vulnerable Agent (Condition 3)**:  
    Motivated by **Cases 2 and 9**.  
    e.g., Case 2 (smoking at 15) has vulnerability; Case 9 (child) is inherently vulnerable.  
  - **Humanitarian Floor**:  
    Motivated by **Cases 3 and 6** where aid is given despite no compensation.  

