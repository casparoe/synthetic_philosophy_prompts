answer: |-
  ### Refined Principle: The Bundled Risk and Discoverability Principle (BRD Principle)

  I'll refine your tentative principle into a precise, implementable framework that captures your intuitions across the cases. The core insight is that **compensation is owed when risks are non-separable from essential pursuits or when risks were hidden**, and **humanitarian aid is always owed below a floor**, regardless of cause. Below is the formalized principle, clause motivations, verdict reconciliations, and new case applications.

  ---

  ### 1. Principle Definition (BRD Principle)
  **Input Fields** (for a function `is_compensable(case)`):
  - `risk_source`: ENUM { `innate`, `natural`, `personal_action`, `social_action` }  
    *(What caused the risk? e.g., genetics, natural disaster, individual choice, societal forces)*
  - `voluntariness`: ENUM { `full`, `partial`, `none` }  
    *(Degree of choice in accepting the risk)*
  - `bundled_with_basic_good`: BOOLEAN  
    *(Was the risk inherent in pursuing a basic good? Basic goods = health, livelihood, shelter, education)*
  - `alternatives_available`: BOOLEAN  
    *(Were low-risk alternatives reasonably accessible?)*
  - `risk_discoverability`: ENUM { `easy`, `hard`, `impossible` }  
    *(Could the risk magnitude be known at the time of choice?)*
  - `shared_social_structure`: BOOLEAN  
    *(Was the risk part of a socially encouraged/systemic activity? e.g., startups, prescribed drugs)*
  - `vulnerable_agent`: BOOLEAN  
    *(Was the person under 18, cognitively impaired, or in coercive circumstances?)*
  - `harm_severity`: ENUM { `catastrophic`, `severe`, `moderate`, `mild` }  
    *(Magnitude of harm)*

  **Output**:
  - `compensable`: BOOLEAN  
    *(True if compensation is owed for the specific harm)*
  - `humanitarian_aid`: BOOLEAN  
    *(True if the person is below a well-being floor, independent of `compensable`)*  
    *(This is a separate function: `needs_aid(current_well_being)`)*

  **Logic**:
  ```python
  def is_compensable(case):
      # Condition 1: Risk was non-separable from a basic good
      if case.bundled_with_basic_good and not case.alternatives_available:
          return True
      
      # Condition 2: Risk was undiscoverable or amplified by society
      if case.risk_discoverability in ['hard', 'impossible'] or case.shared_social_structure:
          return True
      
      # Condition 3: Vulnerable agent with partial/non-voluntariness
      if case.vulnerable_agent and case.voluntariness in ['partial', 'none']:
          return True
      
      return False

  def needs_aid(current_well_being):
      return current_well_being < WELL_BEING_FLOOR  # e.g., lacks food/shelter/healthcare
  ```

  **Key Distinctions from "Choice vs. Happenstance"**  
  The BRD Principle isn't just "choice vs. luck." It asks:  
  - Was the risk **bundled** (unavoidable when pursuing essentials)?  
  - Was the risk **hidden** or **socially imposed**?  
  - Was the agent **vulnerable**?  
  This separates gambling (separable risk) from startups (socially structured risk) or childhood harms (non-volitional).

