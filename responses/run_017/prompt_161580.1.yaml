  First, the water contamination: they support switching reservoirs based on a weak rat study. The key here is severe harm (kidney damage) with irreversible consequences. Even though evidence is weak, the potential damage is high, so prevention is prioritized.

  Next, the math app: they oppose it due to potential attention span issues. The harm here is also long-term and hard to reverse, but the benefit is minor (slightly better test scores). So preventing unproven harm with high stakes makes sense to them.

  But vaccines? They accept them despite unknown long-term effects. Why? Because the risk of not vaccinating includes deadly diseases like measles, which are immediate and severe. Here, the known risks of skipping vaccines outweigh the unproven risks of vaccines. So the rule might involve comparing the risks of action vs. inaction.

  The brother avoiding flying: they think it's silly. Driving 400 miles has higher statistical risk, but the brother focuses on the catastrophic feeling of a plane crash. The user might be weighing statistical evidence versus emotional perception. The rule should account for actual probabilities and trade-offs.

  Gene-drive mosquitoes: they want more study despite malaria deaths. Similar to the water case, but here the potential harm to ecosystems is uncertain. The difference? Malaria is a current, known threat, while ecosystem damage is speculative. The user might be prioritizing immediate known risks over uncertain future ones, but here they lean towards caution. Why? Maybe because the scale of potential ecological harm is vast and irreversible.

  The sleepover: they dismiss their anxiety because there's no evidence. Here, the harm is vague and the cost of avoidance (missing a social event) is low but not trivial. The rule might require some threshold of credible risk before acting.

  The glacial lake village: they lean towards building the channel despite the cost and lost opportunity for knowledge. The potential harm is catastrophic (village destroyed) versus the cost of prevention. But they feel conflicted about preventing others from learning. The rule might need to consider shared risks and community benefit.

  The risky-channel variant adds another layer: prevention itself could trigger disaster. Now the calculation changes because the action has its own significant risk. The rule must weigh the risks of acting versus not acting more carefully.

  Putting it all together: The user's decisions seem to hinge on the severity and irreversibility of potential harm, the credibility of the threat, and the trade-offs between action and inaction. The unifying rule could be about minimizing irreversible harm when credible threats exist, while considering the trade-offs and relative risks. 

  Their inconsistency with vaccines vs. the math app: for vaccines, inaction has known high risks (disease outbreaks), while the math app's inaction has minimal downside. So the rule must account for the risks of both action and inaction. 

  For the brother's flying aversion, the rule would prioritize statistical evidence over emotional perception, as driving is objectively riskier. 

  In the mosquito case, the rule might support action because malaria's known, immediate deaths outweigh speculative ecological harm, but the user's caution suggests they weigh uncertainty differently. Maybe they value biodiversity loss as irreversible harm, similar to the water case. 

  The sleepover decision aligns with the rule if there's no credible evidence, so avoiding action is reasonable. 

  The risky-channel scenario flips the village decision if the channel's risk is significant enough. 

  The runner-up rule about individual rights vs. collective good explains the vaccine stance but clashes with the math app and mosquito cases. 

  So the core of the rule is assessing harm severity, irreversibility, threat credibility, and the trade-offs between action and inaction, especially when inaction has its own risks.
answer: |-
  Here's a breakdown based on your examples:

  **The Rule (Approx. 200 words):**

  "Better safe than sorry" justifies precaution when **all four conditions are met**:

  1.  **Severe & Irreversible Harm:** The potential consequence of being "sorry" is catastrophic, life-altering, or irreversible (e.g., kidney damage from water, village destruction, malaria deaths *vs.* slightly better test scores). *(Motivated by: Water contamination, village collapse, malaria, vaccine-preventable diseases vs. math app benefit)*
  2.  **Credible Plausibility:** The threat, while unproven, arises from a credible mechanism or observation, not pure fantasy. It's grounded in *some* evidence, expert concern, or logical possibility (e.g., solvent traces + rat study, glacial lake instability, malaria's known toll *vs.* vaccine long-term effects lacking mechanism or evidence, vague bad feeling about parents). *(Motivated by: Solvent study, engineers' warning, malaria toll, math app novelty vs. vaccine fear without basis, sleepover anxiety)*
  3.  **Actionability:** A feasible, proportional preventative action exists (e.g., switching water sources, drainage channel, withholding app *vs.* driving 400 miles being *less* safe). *(Motivated by: Available reservoir, possible channel, withholding app vs. brother's dangerous alternative)*
  4.  **Asymmetric Trade-off:** The cost of prevention is significantly outweighed by the potential avoided harm, *especially* when the risk of *inaction* also carries severe, known consequences. This weighs the "safe" vs. "sorry" scenarios directly. *(Motivated by: Vaccines - prevention cost low, *inaction* risk (disease) high & known; Malaria mosquitos - prevention (delay/review) cost (continued deaths) high; Village - cost of digging high, cost of waiting potentially catastrophic; Math app - prevention cost (lost benefit) low, unproven harm speculative)*

  **Where I'm Wrong (Approx. 100 words):**

  The rule flips your calls on:
  *   **Gene-Drive Mosquitoes:** Condition 1 (Severe Harm - malaria deaths) and Condition 4 (Asymmetric Trade-off - known deaths *now* vs. speculative ecosystem harm) strongly favor release/review under pressure, not indefinite delay. Your caution clashes with prioritizing the *known, immediate* harm of inaction.
  *   **Possibly Math App:** While Condition 1 & 2 offer some justification, Condition 4 (Asymmetric Trade-off) is weak. The *known* benefit of slightly better scores (a small positive) vs. the *speculative* harm to attention (a potential negative) makes "safe" (blocking) less compelling than in the water case. The cost of prevention (lost benefit) is tangible, while the harm is highly uncertain.

  **Cases I Didn't Give You (Approx. 150 words):**

  *   **Risky-Channel Village:** The rule becomes complex. Condition 3 (Actionability) exists, but the action *itself* introduces a new Severe & Irreversible Harm (collapse triggered by digging). Condition 4 (Asymmetric Trade-off) flips: The risk of inaction (possible collapse) must now be weighed against the risk *of* action (possible collapse). If the engineers deem the triggering risk significant (Credible Plausibility), the "safe" option might paradoxically be *inaction* (waiting for the survey) unless the risk of waiting is deemed much higher.
  *   **Flying Brother:** Condition 3 fails. His "preventative" action (driving) is statistically *less safe* than flying. "Better safe" actually means *flying* given the numbers. He's misapplying the maxim by ignoring the relative safety of options.
  *   **My Case: AI Alignment Research Halts.** Halting AI development ("safe") due to speculative existential risk (Severe Harm, some Credible Plausibility) vs. the massive known benefits of continued progress and safety research ("sorry" if halted). Condition 4 (Asymmetric Trade-off) is key: Does the *potential* catastrophic risk of progress outweigh the *certain* loss of benefits and the *potential* that progress is the only path to *achieving* safety? The rule urges extreme caution but likely favors *managed* progress with safety paramount.

  **The Runner-Up (Approx. 100 words):**

  **Individual Autonomy vs. Collective Good:** This rule prioritizes individual freedom to accept risk unless harm to others is likely and severe. It flips your vaccine call – refusing vaccines prioritizes individual "safety" perception over the collective "sorry" of disease outbreaks. It aligns with your math app stance (parental autonomy) but clashes with your water stance (collective action mandated). Swallowing it would cost you:
  1.  **Vaccines:** You'd have to accept non-vaccination as a valid personal choice, undermining herd immunity.
  2.  **Water/Mosquitoes:** Mandating reservoir switches or gene-drive release becomes harder to justify against individual objections, potentially leading to worse collective outcomes. It prioritizes individual liberty over communal precaution.

  This runner-up explains your vaccine/math app conflict but creates bigger conflicts elsewhere, especially with large-scale threats. The primary rule offers a more consistent framework for precautionary action.
