answer: |-
  1.  This is primarily a substantive disagreement about the nature of scientific progress, compounded by a verbal element concerning the precise meaning and scope of "truthlikeness" itself.
  2.  The content-and-consequence camp seeks a purely logical, intrinsic relation between theories; the likeness camp prioritises intuitive ordering over possibilities; the epistemic camp foregrounds truthlikeness as a guide for inquiry tied to evidence or utility, revealing divergent core aims.
  3.  A hidden formal question is pivotal: whether a *single*, context-independent measure satisfying *all* intuitive adequacy conditions (ordering, invariance, collapse-avoidance) is possible, given the impossibility results like Miller's and Tichý's.
  4.  Your hypothesis insightfully identifies question-relativity as central, and your construction gains applicability, avoids collapse, and ensures invariance under logical reformulation, but silently gives up on truthlikeness being an intrinsic, context-independent property of theories alone.
  5.  Progress would involve either accepting pluralism (different measures serve distinct purposes), explicitly defining truthlikeness relative to contexts/questions as your construction suggests, or demonstrating that no unified concept can satisfy the conflicting desiderata, explaining the stalling.
