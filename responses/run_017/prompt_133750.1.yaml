prompt: |-
  I am writing the framing chapter for an edited volume at the intersection of philosophy of biology, astrobiology, and synthetic biology, and I do not want to open it by parading the familiar candidate definitions and scoring them. I want the specification first: what would a definition of life have to be able to do in order to count as adequate?

  The purpose, since adequacy is relative to it. I need the definition to do two jobs, and I strongly suspect they are not the same job. The first is to tell a sample-return team what kind of finding would justify announcing a discovery, and what would justify staying silent. The second is to tell an oversight body for synthetic biology which artifacts fall inside its remit and which are merely complicated chemistry. If those two purposes pull the requirements in different directions, that divergence is itself one of the results I want, so please say so explicitly rather than splitting the difference.

  What I want from you is a list of requirements, each accompanied by the case or consideration that makes it a requirement rather than a taste: which phenomena the definition must cover, which verdicts it must be able to return, which distinctions it must respect, which findings from chemistry, thermodynamics, and evolutionary theory it must not contradict. For each, say whether it is non-negotiable or merely the preference of one camp, and identify which requirement does the most exclusionary work against the theories actually on offer. Where some subset cannot be jointly satisfied, give the argument for the incompatibility and say which item you would drop and why.

  The case base, so that the requirements are anchored rather than abstract. Here is my working inventory; add to it any case that discriminates between definitions my list does not separate. Viruses and viroids, which evolve and have lineages but no metabolism, with the complication that the largest of them carry genes for translation and blur into the cellular. Prions: heritable, selectable, sequence-free, no nucleic acid at all. Transposons and other selfish genetic elements that reproduce inside a genome while being parts of one. Organisms of zero fitness: mules, sterile workers, a neutered animal. Everything at the temporal edges: spores, desiccated tardigrades, centuries-old seeds, permafrost microbes revived after geological time, cryopreserved embryos, a vitrified organ, a cell line that has outlived its donor by decades and whose karyotype is no longer that of the donor species. The part-whole tangle: a cultured cell, a gamete, an organoid, a siphonophore colony, a eusocial colony considered as a unit, a mycelium with no clear individual boundary, a cellular slime mold aggregating. Things that maintain themselves, grow, and propagate without being organisms on any view: flames, growing crystals, convection cells, autocatalytic sets, storms. Software: a computer worm, an evolved agent in a simulated physics, a program running on hardware it cannot build. Engineered and dissociated entities: a cell whose genome was chemically synthesized and booted up inside a recipient stripped of its own DNA; protocells with compartment and metabolism but no heredity; hereditary systems with heredity but no metabolism; frog cells reassembled into motile constructs that replicate by pushing other cells into piles; organisms engineered with recoded genomes and kill switches so that they cannot exchange genes and have no evolutionary future; chirality-reversed organisms that would metabolize and evolve while sharing no molecular code with anything on Earth.

  And one case I have constructed precisely because no existing discussion has had to take a stand on it. A culture is derived from a subsurface sample returned from an icy moon. It is maintained in a solvent that is not water, at temperatures where Earth biochemistry does not operate, on a mineral substrate. Across two hundred transfers it shows heritable variation, competition for surface, and directional change: the composition of the mineral face shifts in ways that persist and that improve retention of the face under the transfer regime. There is no membrane, no polymer, no genome, no identifiable individual, no discrete generation. If there is a unit of selection it is the composition of a surface. I want to know what a definition must be able to say about this, what would count as evidence on either side, and which of your requirements a definition fails the moment it cannot return a verdict here.

  Distinctions I expect a definition to keep apart rather than collapse: being alive versus being an organism; being alive versus being a living individual; being alive versus being part of something alive; being alive versus being capable of becoming alive; being alive versus having interests or a moral status; being alive versus having a mind, a goal, or agency; and the definition's own content versus the operational markers a lab would use to detect it.

  Constraints from outside the case base. No vitalism: the definition must be continuous with chemistry and physics rather than carving life off as a separate substance or force. Every organism we know descends from a single origin, so we have one independent instance, and a definition checked only against it cannot claim Generality without argument. Any definition that builds in carbon, water, or nucleic acid must answer the parochialism objection directly. Far-from-equilibrium self-maintenance is presumably necessary but plainly not sufficient, since flames and convection cells have it. Evolution by selection is a property of populations over time, not of a token organism at an instant, which threatens any definition that makes life a property of individuals and then has to verdict on the mule and the spore. And the definition must not be circular with respect to our instruments: a definition of the form life is whatever our current assay portfolio flags would tell the sample-return team nothing it did not already know, while a definition no instrument could ever apply is useless to them.

  Tensions I want adjudicated rather than smoothed over. Generality across unknown substrates versus discriminating power against flames, crystals, and software: I suspect you cannot maximize both, and I want to see where the trade-off bites. A sharp boundary, which the oversight body needs, versus fidelity to what may be a genuinely graded phenomenon. Verdicts at the level of individuals versus verdicts at the level of lineages, given individuals without lineages and lineages without individuals. Descriptive neutrality versus the temptation to gerrymander the boundary so that embryos, organoids, or artificial systems land on the side one already wants for ethical reasons; I would treat that temptation as a vice, but tell me if you disagree. There is also the possibility of a relational definition, on which a thing is alive only with respect to some larger system or process; I would like to see how far that goes, what it costs, and whether it is a real option or a way of changing the subject.

  Close with a short scorecard, no more than a sentence or two each, for the main contenders as you see them: the astrobiology working definition in the vicinity of a self-sustaining chemical system capable of Darwinian evolution, autopoietic accounts, negative-entropy and far-from-equilibrium accounts, accounts that start from Darwinian populations rather than from organisms, and any others you think belong on the list. Keep the weight on the criteria and on the cases; the scorecard is for orientation only. And give me your view on the last question: if the requirements really are jointly unsatisfiable, does that show that life is not the kind of thing that has a single correct definition, and if so, what replaces the project?

  One instruction about form. Write as if you had no library and no connection: reason from the cases, the distinctions, and the constraints I have given, and do not spend your words on who said what. A table for the requirements is welcome, prose for the incompatibilities. I would rather have eight argued requirements than twenty listed ones.
reasoning: |-
  Hmm, the user is writing a framing chapter for an edited volume on philosophy of biology, astrobiology, and synthetic biology. They want to avoid starting with standard definitions of life and instead focus on what makes a definition adequate. They have two specific purposes: guiding sample-return missions in detecting extraterrestrial life and determining regulatory scope for synthetic biology. The user suspects these purposes might demand different things from a definition, and they want this tension explored rather than resolved.

  I need to generate requirements for a definition of life based on their cases and constraints. The user provided an extensive list of edge cases: viruses, prions, transposons, organisms with zero fitness (like mules), dormant states (spores, tardigrades), ambiguous boundaries (cell cultures, siphonophores), non-biological phenomena (flames, crystals), digital life, engineered systems, and their custom case of mineral-surface evolution. They also listed important distinctions that shouldn't be collapsed (life vs organism, life vs capability to become alive, etc.) and external constraints (no vitalism, parochialism concerns, avoiding circularity).

  For each requirement, I'll need to anchor it to specific cases, state whether it's non-negotiable or debatable, and identify which case does the most exclusionary work. Where requirements conflict, I should show the incompatibility and suggest which to drop. The sample-return scenario seems to prioritize detectability and substrate neutrality, while synthetic biology oversight needs sharp boundaries and individual-level verdicts. Their custom mineral-surface case will be crucial for testing generality.

  Key tensions include: generality vs discrimination (handling alien life while excluding flames), individual vs lineage focus (resolving the mule problem), sharp boundaries vs graded phenomena, and descriptive neutrality vs ethical gerrymandering. I'll need to address relational definitions (life as context-dependent) and assess their viability.

  For the scorecard, I'll briefly evaluate major definition types against the requirements: NASA's "Darwinian evolution" definition, autopoiesis, thermodynamics, Darwinian populations, etc. Finally, if requirements prove incompatible, I'll discuss whether this means life defies single definition and what alternative approaches might exist.

  The response should include a requirements table with each item tied to cases/constraints, followed by prose on incompatibilities. I'll limit it to 8 core requirements for depth. The conclusion will explicitly state if the purposes diverge and whether a unified definition is possible.
answer: |-
  Based on your framework, here are eight core requirements for an adequate definition of life, derived from the cases, distinctions, and constraints you provided. Each requirement is anchored to specific phenomena and includes its rationale, negotiability, and key discriminatory cases.

  **Core Requirements for a Definition of Life:**

  | Requirement | Anchoring Cases/Constraints | Rationale | Non-Negotiable? | Key Exclusionary Case |
  | :---------- | :-------------------------- | :-------- | :-------------- | :----------------------- |
  | **1. Non-Parochial Generality** | Icy moon culture, chirality-reversed organisms, parochialism constraint | Must accommodate fundamentally different chemistries/substrates (non-water solvents, non-carbon, non-nucleic acid) without assuming Earth-specific features. | **Yes** (Core to astrobiology) | Earth-centric definitions (e.g., requiring nucleic acids) fail the icy moon culture immediately. |
  | **2. Lineage Formation Capability** | Viruses, viroids, transposons, selfish elements, engineered kill-switch organisms, icy moon culture | Must identify entities that *can* participate in a process of hereditary variation and differential persistence/replication over time, even if the entity *itself* lacks metabolism or is currently not evolving. | **Mostly** (Essential for evolution; key distinction from non-life) | Prions: Lack hereditary variation. Flames/Convection Cells: No lineages. |
  | **3. Individual-Level Far-From-Equilibrium Self-Maintenance** | Flames, convection cells, autocatalytic sets, spores, tardigrades, cryopreserved embryos, vitrified organs, cell lines | Must identify entities that *actively maintain* internal organization against decay by dissipating energy/matter *at the level of the candidate individual*, distinguishing from passive persistence (crystals) or system-level dissipation. | **Yes** (Necessary physics constraint; distinguishes active from inert) | Flames/Convection Cells: Maintain form but lack internal *organization* to maintain. Spores/Cryo: Maintain organization passively, *not* actively dissipating. |
  | **4. Distinction from Mere Persistence/Propagation** | Flames, crystals, storms, computer worms, autocatalytic sets, growing crystals | Must exclude phenomena that propagate or persist in form solely through passive physical/chemical processes without the active, bounded self-maintenance required by R3. | **Yes** (Core to avoiding over-inclusion) | Flames/Crystals: Propagate but lack bounded, self-maintained organization. |
  | **5. Resolution of the "Token Organism" Problem** | Mules, sterile workers, neutered animals, spores, desiccated tardigrades, cryopreserved embryos, gametes, cultured cells | Must consistently characterize *individual entities* (potential organisms) even when lacking fitness, reproductive capacity, or metabolic activity, without relying solely on lineage properties (R2). | **Contentious** (Major tension point) | Mule: Fails reproduction-based definitions despite clear biological origin/organization. Spore: Challenges activity-based definitions. |
  | **6. Clear Boundary Demarcation for Oversight** | Protocells, hereditary systems without metabolism, frog cell constructs, chirality-reversed organisms, organoids, complex chemistry | Must enable a binary "in/out" decision for regulatory purposes regarding synthetic constructs, based on intrinsic properties, not potential or origin. | **Yes** (For oversight function) | Protocells vs. "merely complicated chemistry". R5 conflict: Oversight needs sharp boundaries, biology may be graded. |
  | **7. Avoidance of Instrumental Circularity** | Sample-return scenario, all detection methods | Must define life independently of *current* detection assays (e.g., PCR, metabolism kits) to guide the *design* of novel detection strategies for unknown life. | **Yes** (Core epistemological constraint) | Definitions like "life is what our VP4 assay detects" fail sample-return utterly. |
  | **8. Separation of Life Status from Moral/Functional Status** | Embryos, organoids, AI, interests/mind/agency distinctions | Must not conflate being *alive* with having moral status, interests, goals, minds, or agency. Life status is a prerequisite for *some* of these, not equivalent. | **Yes** (Conceptual hygiene; avoids gerrymandering) | Gerrymandering temptation: Defining life to include/exclude embryos/organoids/AI based on desired ethical treatment. |

  **Adjudicating Key Tensions & Incompatibilities:**

  1.  **Generality (R1) vs. Discrimination (R4):** Maximizing R1 (accommodating icy moon culture, exotic substrates) inherently risks weakening R4. A definition broad enough to confidently include the icy moon phenomenon (lacking polymers, membranes, discrete individuals) might struggle to robustly exclude highly persistent, propagating non-equilibrium physico-chemical systems (complex autocatalytic sets in exotic solvents, propagating mineral fronts). *Trade-off bite:* The icy moon case is the ultimate test. If a definition excludes it *solely* due to lack of familiar Earth features (violating R1), it fails astrobiology. If it includes it but cannot rigorously distinguish it from complex geochemistry (violating R4), it fails discrimination. **Resolution:** Prioritize R1 for astrobiology, accepting a *slightly* fuzzier boundary near complex geochemistry, demanding *evidence of lineage formation (R2)* as the crucial discriminator for the icy moon case. Drop the demand for absolute discrimination against *all* conceivable abiotic propagating systems if it forces parochialism.

  2.  **Individual Focus (R3, R5) vs. Lineage Focus (R2):** R2 (Lineage Formation Capability) is a property of populations/lineages over time. R3 (Individual Self-Maintenance) and R5 (Token Organism) focus on the individual entity *now*. The core tension arises with dormant states (spores, cryo) and sterile individuals (mules). A strict lineage definition (R2 alone) struggles with R5: a mule or spore has *no* evolutionary future. A strict individual metabolic definition (R3 alone) struggles with dormant states lacking *current* activity and with entities like viruses lacking metabolism. **Incompatibility:** Satisfying R5 (calling a spore or mule "alive") using only properties of the individual *at that instant* is highly challenging if R3 requires *active* dissipation. R2 alone doesn't cover the individual. **Resolution:** Accept a hybrid requirement: The definition must identify entities that are either (a) *currently* exhibiting R3, *or* (b) are in a state *resulting from* R3 and *capable* (under appropriate conditions) of re-initiating R3 *and* participating in R2. This satisfies R5 (spores, mules are alive) but requires defining "capability" carefully (excluding rocks, including seeds). Drop the demand for *continuous* active self-maintenance for *all* living individuals.

  3.  **Sharp Boundary (R6) vs. Graded Reality (R5, General Biology):** Oversight (R6) demands a binary in/out. Biology suggests life emerges from non-life gradually, and entities exist in gray zones (protocells, complex viruses). R5 highlights intrinsically graded cases (organoid complexity, dormant state revival probability). **Incompatibility:** Insisting on a perfectly sharp, non-arbitrary boundary for *all* conceivable cases (especially synthetic constructs) may force an inadequate definition. **Resolution:** Prioritize R6 for the oversight function, accepting that drawing the line involves some convention (based on satisfying a sufficient number of core requirements, perhaps R2 + R3), even if borderline cases exist. Explicitly acknowledge the conventional aspect at the frontier for oversight purposes. Don't drop R6; it's essential for the remit.

  4.  **Descriptive Neutrality vs. Ethical Gerrymandering:** The temptation to define life to match desired ethical conclusions (e.g., including embryos to bolster rights claims, excluding AI to avoid rights claims) violates conceptual clarity and R8. **Resolution:** Treat this as a strict constraint (non-negotiable aspect of R8). The definition must be based solely on biological/physical characteristics, not desired ethical outcomes. Gerrymandering is a vice.

  5.  **Relational Definitions:** Defining life relationally (e.g., "X is alive *with respect to* ecosystem Y" or "X is a living component of an evolutionary process Z") could handle some complexities (siphonophores, mycelium, potentially icy moon surface as a "unit"). *Costs:* It risks making life status extrinsic, context-dependent, and potentially unstable (does a disconnected cell from a siphonophore cease to be alive?). It struggles with clear individual-level verdicts (R5, R6) and token dormant entities. *Viability:* It might work well for lineage-focused (R2) definitions but poorly for individual self-maintenance (R3) and oversight (R6). It changes the subject from "What is life?" to "What is part of a living system/process?". **Conclusion:** Not a primary solution for your dual purposes, as it undermines the need for verdicts on *individual entities* crucial for both sample-return (a specific sample) and oversight (a specific artifact).

  **Scorecard for Major Contenders:**

  *   **NASA-style (Self-sustaining chemical system capable of Darwinian evolution):** Strong on R2 (Lineage), good on R1 (Generality), weak on R3/R5 (Token Organism - dormant/sterile), weak on R6 (Sharp Boundary - "capable" is fuzzy, "self-sustaining" ambiguous), struggles with viruses/prions, fails icy moon without clear "system" or "chemical".
  *   **Autopoiesis (Self-production within a boundary):** Strong on R3 (Self-Maintenance), good on R4 (Discrimination), potentially strong on R1/R6 if boundary/process abstracted well. Very weak on R2 (Lineage - not required), fails R5 (Dormancy), fails viruses/prions, icy moon unclear (what's the "boundary"?).
  *   **Far-from-Equilibrium Thermodynamics (Dissipative structures):** Strong on R3. Fails R4 catastrophically (includes flames, storms), fails R6, fails R1 if specific dissipation modes are assumed. Too broad.
  *   **Darwinian Populations (Lineage with variation, inheritance, selection):** Strong on R2, good on R1. Weak on R3/R5 (Token Organism), weak on R6 (Defines populations, not individuals), struggles to exclude some software.
  *   **Information-Theoretic (e.g., functional information, semantic closure):** Potentially strong on R1, R2, R4 if designed well. Often abstract/operationalization difficult (R7 risk), weak on R3/R5, R6 challenging, icy moon depends on "information" definition.

  **Conclusion on the Project:** The requirements **are not fully jointly satisfiable** by any single, simple definition, primarily due to the tension between the **token organism problem (R5)** and the **lineage requirement (R2)**, exacerbated by the **diversity of cases** (dormant states, sterile individuals, metabolism-free replicators) and the **divergent purposes** (astrobiology needs generality/lineage focus; oversight needs sharp boundaries/individual focus). This suggests **"life" is not a single, monolithic natural kind** with necessary and sufficient conditions applicable to all contexts.

  **What replaces the project?** A **pluralistic framework** recognizing:
  1.  **Core Attributes:** A cluster of related, frequently co-occurring attributes (far-from-equilibrium self-maintenance, lineage formation via heritable variation, bounded individuality).
  2.  **Contextual Adequacy:** Definitions are tools validated by their adequacy for *specific purposes* (detection, regulation, theoretical understanding). The icy moon case demands lineage formation (R2); oversight demands a clear individual-level boundary (R3/R6).
  3.  **Graded Boundaries:** Acknowledge that the transition from non-life to life is graded, and "life" status at the margins depends on the presence and integration of a sufficient number of core attributes relevant to the context.
  4.  **Process over Substance:** Emphasize the fundamental processes (evolution, self-maintenance) rather than specific material instantiations.

  The framing chapter should map the landscape of requirements, expose the tensions inherent in the cases and purposes, and argue for this pluralistic, purpose-sensitive understanding as the most productive path forward, moving beyond the quest for a singular, universally adequate definition.
