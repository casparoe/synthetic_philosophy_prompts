  3. The proposition is not well-defined: The event "system meeting a stated capability threshold" may be ambiguous because what counts as meeting the threshold depends on what gets built (i.e., the event is endogenous).
  4. Non-Bayesian agents: The forecasters are not perfectly rational Bayesians; their forecasts are influenced by noise, stakes, reputational incentives, and bounded rationality.

