  The position I want restated, piece by piece, in the vocabulary I actually use — coarse-graining and RG flow, effective versus fundamental degrees of freedom, relevant and irrelevant operators, order parameters and phases, extensive versus intensive quantities, universality and multiple realizability, UV cutoffs and divergences, measures and typicality — is this package: (1) the Russellian move that physics only ever gives you the structural/dynamical story and something has to occupy the intrinsic roles; (2) the combination problem, i.e. how micro-level phenomenal states are supposed to yield the single macro experience I seem to have; (3) the alternative that starts from one big subject and decomposes downward instead; (4) the ethical consequence they cared about, that if valence goes all the way down then expected moral weight is dominated by physics nobody has cashed out; and (5) the two obvious complaints — that nothing in the physics forces the fundamental properties to be valenced rather than neutral, and that if physics is causally closed then adding phenomenality changes no dynamics and no prediction.

  Two things I floated at dinner that I want you to actually try to make precise, because they felt like they were onto something: first, the count of subjects looks cutoff-dependent in exactly the way a bare UV-divergent quantity is — if every scale hosts its own experiencing degrees of freedom, then "total suffering" isn't a scale-invariant object at all, and the question is whether the right move is renormalization (fix a scale, calibrate against the one case where I have direct access, demand that the renormalized moral quantity be cutoff-independent) or whether the analogy breaks because there's no analogue of a coupling flowing. Second, I suggested treating consciousness not as a property attached to degrees of freedom at a scale but more like an order parameter or a phase — in which case there should be a fairly sharp onset, there should be universality (very different microphysics landing on the same macro phenomenology), and that universality would cut the inference from "fundamental physics is fundamental" to "phenomenality is fundamental," since the macro fact could be multiply realized by microphysics with any intrinsic nature at all. Tell me if either of these is smuggling in my assumptions and calling it translation — I specifically want you to flag the places where the translation quietly presupposes something the panpsychist denies.

