prompt: |-
  hey — is there a name for this? I do logistics for a volunteer organisation and read a bit of this decision-theory stuff on the side, so forgive the lay description.

  There's a thing I half remember where loads of people can each do the same risky-but-useful thing on their own, one person doing it is great, but each extra person who does it stacks up the downside without stacking up the upside, so everybody individually reckons they should go ahead and the group ends up worse off. I think the name has "curse" in it, or maybe I'm mixing it up with the auction thing. Anyway — that's not quite the pattern I keep noticing. The pattern I keep noticing is about *who* ends up doing it.

  Two from real life:

  We have a group chat of about twelve and we need one person to email the guy who owns a hall and ask if we can have it for free. One polite email, decent odds. Four separate emails from four different people and he thinks we're a circus and says no to all of us. Everyone can see the chat, so nobody wants to be email number two. So nothing happens for a week, and then whoever is least able to sit with an unanswered thing fires off an email — and in that particular group the people who can't leave it alone are also the people who write a bad email and don't know him. So the ask gets made by the worst available person, and it gets made by them precisely because everyone else was being careful. The careful peoples restraint doesn't remove the risk, it just delegates the decision to whoever is worst at it.

  Second one, from a job I had: a shared service, anyone on the rota could push a hotfix for a bad config. Two people pushing at once and the change double-applies and takes the thing down for an hour. Everyone watches the same dashboard. Guess who pushes. It's whoever's tolerance for watching the error rate is lowest, which tracks pretty well with being the person who least understands what the config actually does. Same shape.

  So: many people each have the option; exactly one taking it is what you want; more than one is bad; everyone can see that nobody has taken it yet; waiting has a cost; and the cost of waiting varies across people in a way that correlates the wrong way with how good they'd be at it. Result: the group's caution selects its least suitable member to act unilaterally.

  What I want isn't a label. I want to know what this is and what it isn't:

  - Is it just the curse thing plus the adverse-selection thing glued together, or does the visibility and the ordering do real work? Every version of the curse I've come across is simultaneous and nobody can see anybody else. If it's genuinely a distinct failure mode I'd like it named; if I'm only redescribing a special case, say so, tell me which one, and say how much gets lost by subsuming it.
  - It feels close to the auction thing where the winner is whoever overestimated the most, close to the nobody-helps-because-everyone-assumes-someone-else-will thing, and close to a standoff where each side waits for the other to blink. It isn't any of those, or not only those — the first is about prices and one winner, the second is about nobody acting at all, and in the third nobody acting is the good outcome. But I'd like the boundaries drawn properly against each of them and against whatever else is nearby.
  - The fix looks different, and that's my main reason for wanting a separate name. For the curse the advice is basically restrain yourself, coordinate, build a norm against acting alone. Here the fix isn't "nobody do it" — somebody should do it, just not that person. You'd assign the job outright, or make the competent person's waiting cheap, or make the eager person's acting expensive. If the remedies come apart like that, is that enough to make it a separate concept, or is that a bad test?
  - Boundary cases I can't settle: if the correlation runs the other way — the most impatient person is also the best at it — then nothing goes wrong and it doesn't feel like a phenomenon at all. Same thing with a happy ending, or outside the definition? If everyone is equally competent but everyone waits, is that still my thing or just the ordinary coordination problem? And does it need the more-than-one-is-actively-harmful part at all, or does merely-wasteful duplication work too?

  If there's no name, coin one, define it, and give me the edge cases. I definately won't be satisfied with "that's roughly X".
reasoning: |-
  Okay, let me start by understanding what the user is asking. They work in logistics for a volunteer organization and have encountered a recurring problem in group dynamics. They described two real-life scenarios where a task needs to be done by exactly one person, but multiple actions cause harm. The key points are: everyone can see if someone has acted, waiting has a cost, and the person with the lowest tolerance for waiting (who is often the least competent) ends up acting. 

  The user mentioned they recall terms like "curse" but think their situation is different. They want to know if this is a distinct phenomenon or a combination of existing concepts. They also want clear boundaries from similar concepts like the winner's curse, bystander effect, and chicken game. Plus, they’re interested in how to fix it and whether edge cases fit the definition.

  First, I need to identify the core elements. The user's scenarios involve adverse selection because the least suitable person self-selects to act due to impatience. The visibility of inaction and the cost of waiting are crucial. This seems different from simultaneous moves in the winner's curse or the bystander effect where everyone assumes others will act. 

  The user also pointed out that the correlation between impatience and incompetence drives the problem. If the correlation were reversed, it wouldn't be an issue. They’re wondering if the harmful duplication is necessary or if wasteful duplication suffices. In their case, multiple actions are harmful, not just redundant. That distinction matters because the cost of multiple actors increases the urgency for the least competent to act.

  Looking at existing concepts: the bystander effect involves inaction due to diffusion of responsibility. Here, action happens, but by the worst person. The chicken game has mutual destruction if both act, but here multiple actors cause harm, and inaction has costs. The winner's curse is about overestimation in auctions, which doesn't fit. 

  The volunteer's dilemma is close—one volunteer is needed, but volunteering has a cost. However, in the standard model, the cost is fixed, and visibility isn't emphasized. In this case, the cost of waiting varies, and visibility triggers adverse selection. So maybe it's a variant of the volunteer's dilemma with adverse selection. 

  Naming this: "Precipitous Volunteer's Dilemma with Adverse Selection" captures the urgency and selection of unsuitable volunteers. The user might want a snappier name, but accuracy is key. 

  For fixes, the user noted that standard advice for the volunteer's dilemma (like coordination) isn't enough. Here, solutions target preventing the wrong person from acting—assigning roles, increasing costs for hasty actions, or reducing urgency for competent people. That difference in remedies suggests this is a distinct enough problem to name separately. 

  Edge cases: If the most impatient is also competent, no issue arises—so it's outside the problem's scope. If everyone is equally competent but no one acts, that's the classic volunteer's dilemma without the adverse selection element. Harmful duplication is necessary here because mere waste might not create the same pressure for quick, incompetent action. 

  The user’s deeper need is likely to communicate this problem effectively in their organization and implement the right solutions. They want to avoid misapplying fixes from similar but different dilemmas. Having a clear definition and name helps in creating targeted strategies, like assigning tasks upfront or adjusting individual costs to act.
answer: |-
  This is a **distinct failure mode** with specific mechanisms beyond classic dilemmas. It combines elements but creates a unique pathology. Here's the breakdown:

  1.  **Core Mechanism:** It's **Adverse Selection Driven by Impatience Under Visibility**. The key dynamics are:
      *   **Visibility of Inaction:** Everyone sees that no one has acted yet.
      *   **Cost of Waiting:** Delay imposes a cost (e.g., unresolved issue, anxiety).
      *   **Heterogeneous Tolerance:** Individuals vary in their tolerance for this waiting cost.
      *   **Negative Correlation:** Tolerance correlates *inversely* with competence/appropriateness for the task (the impatient are less competent).
      *   **Harmful Over-Action:** More than one person acting causes significant negative consequences (worse than no action).
      *   **Single Ideal Actor:** Exactly one competent person acting is the optimal outcome.

  2.  **Why It's Not Just "Curse" + "Adverse Selection" Glued:**
      *   **The "Curse" Misnomer:** You're right - the Winner's Curse (auctions) and related curses (e.g., Braess's Paradox) typically involve hidden information/value estimation errors in simultaneous decisions *without* visibility of others' choices or a dynamic waiting cost. Your scenario has *visible inaction* driving a *sequential* selection pressure based on *impatience*, not estimation error.
      *   **Adverse Selection is Key, But Context Matters:** Adverse selection (hidden characteristics leading the "wrong" type to participate) is central. However, the *driver* of this selection is unique: it's the **heterogeneous tolerance for visible delay**, *not* hidden information about task cost/benefit (like in classic Volunteer's Dilemma) or value (like in Winner's Curse). The visibility and the ticking clock create the adverse selection pressure.

  3.  **Comparison to Neighboring Concepts:**
      *   **Volunteer's Dilemma:** *Close, but distinct.* In the standard Volunteer's Dilemma:
          *   Each person prefers *someone else* to bear the cost of volunteering.
          *   The risk is **inaction** (no one volunteers).
          *   Volunteering has a fixed cost; multiple volunteers are usually wasteful but not *harmful*.
          *   Competence isn't a factor; it's about willingness to pay the cost.
          *   *Your Scenario:* The risk is **action by the wrong person**, driven by impatience under visibility. Harmful over-action is critical. Competence correlation is central.
      *   **Bystander Effect:** *Shares the visibility aspect, but different outcome.*
          *   Focuses on **diffusion of responsibility leading to inaction**.
          *   Assumes others *might* act, so individuals feel less responsible.
          *   *Your Scenario:* Action *does* happen, but by the *worst possible agent* due to their specific intolerance for the very delay the bystander effect relies on. Responsibility isn't diffused; it's catastrophically concentrated.
      *   **Chicken Game / Brinkmanship:** *Shares the "waiting for the other to blink" dynamic, but different goals.*
          *   Involves **mutually assured destruction** if *both* act (or neither concedes).
          *   Players try to force the *other* to concede/blink first.
          *   The "winner" is the one who didn't blink.
          *   *Your Scenario:* The goal isn't to force the other to back down. Acting isn't "winning"; it's bearing a burden. The "winner" (actor) is the *least suited*, and their "win" (acting) is often a loss for the group. Mutual destruction comes from *multiple* acting, not mutual inaction.
      *   **Winner's Curse:** *Different mechanism.*
          *   Arises from **common value uncertainty** and **overestimation** in auctions/bidding.
          *   The "winner" overpays because their bid was the highest estimate.
          *   *Your Scenario:* No bidding, no common value estimation error. Selection is driven by impatience under visibility, not overestimation of value/cost.

  4.  **The Fix Difference is Crucial:** This confirms distinctness.
      *   **Volunteer's Dilemma Fix:** Encourage volunteering (reduce perceived cost, increase sense of responsibility). Norms *for* acting.
      *   **Bystander Effect Fix:** Make responsibility clear ("You, in the red shirt, call 911!").
      *   **Your Scenario Fix:** **Prevent the *wrong* person from acting impulsively.** Assign upfront, increase costs for hasty action (e.g., approval step), reduce urgency for competent people (shield them from the "cost of waiting" signal), or intentionally delay the eager-but-incompetent. Norms *against* *impulsive* acting.

  5.  **Boundary Cases & Edge Conditions:**
      *   **Positive Correlation (Impatient = Competent):** This is the *opposite* problem. It's often efficient! The best person acts quickly. No adverse selection occurs. This is outside the scope of *this specific failure mode*. It's a functional outcome, not a pathology.
      *   **Everyone Equally Competent, Everyone Waits:** This is the **classic Volunteer's Dilemma outcome**. The risk is permanent inaction, not action by a bad actor. Harmful over-action isn't a factor. This is a *different* coordination failure.
      *   **Merely Wasteful Duplication (Not Harmful):** This changes the dynamics significantly.
          *   The cost of multiple actors is lower (just inefficiency, not catastrophe).
          *   The pressure to "be first" might be less intense.
          *   Competence correlation might be less critical (multiple okay actors are tolerable).
          *   This starts to resemble **Rent-Seeking** or **Tragedy of the Commons** (wasteful effort to capture a benefit) mixed with Volunteer's Dilemma. It lacks the critical element of *harmful over-action* that creates the intense pressure for the least suitable to jump in first to resolve the unbearable delay.

  **The Name & Definition:**

  **The Precipitous Volunteer's Dilemma with Adverse Selection (PVD-AS)**

  *   **Definition:** A coordination failure occurring when:
      1.  A group requires *exactly one* member to perform a specific action for a collective benefit.
      2.  Multiple members performing the action results in a *net negative outcome* (harmful over-action).
      3.  The *inaction* of the group imposes a visible, accumulating cost (e.g., unresolved problem, anxiety).
      4.  Individual members have *heterogeneous tolerance* for this cost of waiting/delay.
      5.  There is a *negative correlation* between tolerance for delay and competence/appropriateness for the task (impatient individuals tend to be less competent).
      6.  The visibility of group inaction creates pressure, causing the *least tolerant* (and therefore, via correlation, least competent) individual to act unilaterally first, often leading to a suboptimal or detrimental outcome.

  *   **Key Distinguishing Features:**
      *   **Harmful Over-Action:** Critical. Not just waste, but active harm if more than one acts.
      *   **Adverse Selection Driver:** Selection is driven by *heterogeneous impatience* under *visible delay*, not hidden costs/benefits or value estimation errors.
      *   **Outcome:** Action *does* occur, but by the *worst-suited member*.

  *   **Edge Cases Clarified within PVD-AS:**
      *   **Positive Correlation:** If impatient = competent, the mechanism breaks down; it's not a "Precipitous Volunteer's Dilemma" failure, it's a functional outcome. PVD-AS *requires* the negative correlation.
      *   **Equal Competence + Waiting:** If harmful over-action exists *and* the negative correlation holds, it still fits. If there's no correlation or positive correlation, it's a different problem (pure Volunteer's Dilemma or efficient outcome). If harmful over-action is absent, it's not PVD-AS.
      *   **Harmful vs. Wasteful Duplication:** PVD-AS *requires* **harmful over-action**. Merely wasteful duplication changes the cost-benefit analysis and reduces the unique pressure mechanism. It becomes a less severe, different coordination problem.

  **In short:** You've identified a distinct, perverse dynamic where the visibility of group hesitation and the personal cost of waiting combine with a negative competence-impatience correlation to *select* the worst person to solve the problem. It's a specific pathological variant of coordination failure centered on adverse selection driven by impatience under visibility, amplified by the risk of harmful over-action. **Precipitous Volunteer's Dilemma with Adverse Selection (PVD-AS)** captures this mechanism and its disastrous outcome. The remedy is fundamentally different: not encouraging action, but *controlling who acts* to prevent the adverse selection.
