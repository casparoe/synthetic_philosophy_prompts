prompt: |-
  In the seminar I help run — an impartiality-and-giving reading group, mostly people with economics or policy backgrounds — a move keeps recurring. Impartial benevolence, it is said, is just prudence scaled up. Within a single life we aggregate constantly: a painful month now against ten comfortable years, a hard decade of training against a career, savings against consumption. Nobody thinks prudential aggregation is illegitimate, and the trade-offs it licenses are exactly the shape of the trade-offs utilitarianism makes between people. So, the argument goes, once you grant that intrapersonal aggregation is rational, there is no principled residue left to the objection from the separateness of persons; that objection is a label for an intuition that has not survived being thought about.

  I want an audit of the analogy, not a verdict on utilitarianism. Please give me:

  1. The mapping, made explicit. A table of correspondences: what plays the role of the temporal stages, of the deliberating planner, of compensation, of the party who bears the total, of prudence's authority, of whatever ties the stages of one life together.

  2. What the source quietly imports into the target. List the properties of a single life across time that the analogy carries over to a population — one locus at which the sum is experienced; one memory that owns both the cost and the benefit; the sacrificing and the compensated party being the same party; aggregation being optional for the agent and unenforceable by others; ex post ratification by the very person who decided. For each, say whether its absence in the interpersonal case actually does work in the separateness objection or is inert decoration.

  3. The disanalogies that matter, separated from the ones that don't. I suspect some candidate disanalogies are beside the point (that bodies are spatially located, that numbers of people are larger) and others carry the whole weight. Say which, and why.

  4. A gradient test I can put to the group. Hold the trade-off fixed and vary only the degree of psychological unification across the parties: one adult human across fifty years; a pair with shared affect and a joint decision procedure; ten thousand people with a standing assembly, joint deliberation, pooled records standing in for shared memory, ex post ratification, and a shared narrative each has internalized as their own; ten thousand strangers. Does the defensibility of aggregation vary monotonically along this gradient? If it does, what is doing the work — a brute fact about separate bodies, or an empirical, degree-valued fact about how unified the parties are? And then the question that matters: does a monotonic answer vindicate the analogy or destroy it, given that the analogy's users need aggregation to be fine at the far end of the gradient? If you think the unity of a single life is itself achieved by deliberative self-constitution rather than given, say what that does to the argument.

  5. Whether the conclusion survives. Does the analogy carry the claim that the separateness objection is dead, or was the analogy doing the work all along? If it fails, propose a better comparison — one that captures whatever is genuinely right about interpersonal aggregation without importing the features you listed in section 2 — and note whether what survives is utilitarianism specifically or something weaker.

  Two constraints: assume no access to libraries or the web, so no citations, reading lists, or appeals to what some author argued; I want the argument, not the literature. And if you use any term of art, define it in a line.
reasoning: |-
  Okay, let me carefully unpack this request. The user runs a reading group on impartiality and benevolence, and they've encountered a recurring argument that impartial benevolence is just "prudence scaled up." They want me to audit this analogy without judging utilitarianism itself, focusing on specific aspects: the mapping, imported assumptions, relevant disanalogies, a gradient test, and whether the conclusion holds.

  Hmm, this is quite sophisticated - the user clearly has strong analytical skills and wants to avoid superficial responses. They're asking for a structured philosophical dissection rather than a debate about utilitarianism. The constraints are important too: no citations, just pure reasoning, with all technical terms defined. 

  First, I need to clarify the core analogy. The argument claims that since we accept trade-offs within a single life (prudence), we should accept similar trade-offs between lives (utilitarianism). The user wants to test whether this mapping holds water. 

  I'll start by explicitly mapping the correspondences as requested in part 1. For temporal stages → individual people, the deliberating planner → social decision-maker, and so on. But I notice this mapping already feels strained - in prudence, the planner is identical to the experiencer, which isn't true in the interpersonal case. 

  For part 2, I should list what gets smuggled from intrapersonal to interpersonal: things like unified consciousness, identity over time, and first-personal authority. The key question is whether these missing elements actually matter for the separateness objection. I suspect some are crucial while others are decorative - for example, the identity between sacrificer and beneficiary seems fundamental.

  Part 3 needs to distinguish relevant from irrelevant disanalogies. Spatial separation and population size probably don't matter much, but the lack of a unified perspective and the enforceability of trade-offs seem critical. The user's gradient test idea in part 4 is brilliant - it tests whether psychological unity affects the permissibility of aggregation. If defensibility varies with unity, that challenges the analogy's claim that separateness is irrelevant.

  Finally for part 5, I doubt the analogy can kill the separateness objection because it covertly relies on what it tries to dismiss. A better comparison might be cooperative groups with shared goals, but that supports prioritarianism or contractualism more than strict utilitarianism. 

  Throughout, I'll maintain the no-citations constraint while keeping definitions accessible. The gradient test will be my centerpiece - it exposes whether the analogy works or not through a series of stepped cases. The conclusion should acknowledge what the analogy gets right (aggregation isn't always wrong) while showing why it fails to neutralize the separateness concern.
answer: |-
  Here’s a systematic audit of the prudence-to-utilitarianism analogy, structured per your request:

  ---

  ### **1. Explicit Mapping: The Correspondence Table**
  | **Prudential Context (Intrapersonal)** | **Utilitarian Context (Interpersonal)** | **Role/Function** |
  |----------------------------------------|-----------------------------------------|-------------------|
  | Temporal stages of one life            | Individual persons                      | Units being aggregated |
  | Deliberating "present self"            | Social planner, government, or moral agent | Aggregating decision-maker |
  | Future well-being of the same person   | Well-being of others                    | Recipient of benefits |
  | Sacrificing current well-being         | Sacrificing one/some persons' well-being | Cost borne |
  | Later satisfaction/compensation        | Benefits to others                      | Compensatory gain |
  | Personal identity over time            | Humanity or social whole (allegedly)    | Unifying factor |
  | Authority of self-interest             | Authority of impartial benevolence      | Normative basis for trade-offs |
  | Memory linking cost and benefit        | Social records/narratives (weak analogy)| Mechanism for "ownership" of trade-offs |
  | Ex post ratification by the same person | Social endorsement (e.g., via democracy)| Retrospective validation |

  ---

  ### **2. What the Analogy Smuggles In (and Whether It Matters)**
  - **Single Locus of Experience**: In prudence, one consciousness experiences both cost and benefit.  
    *Relevance*: Crucial. The separateness objection hinges on costs/benefits occurring to distinct subjects who cannot "feel" compensation.
  - **Identity of Sacrificer and Beneficiary**: The same entity bears the cost and reaps the gain.  
    *Relevance*: Core to the objection. Interpersonally, the sacrificed party may gain nothing.
  - **First-Personal Authority**: Only the individual has the right to impose trade-offs on their future selves.  
    *Relevance*: Vital. Interpersonal trade-offs are enforced *by others*.
  - **Ex Post Ratification by the Affected Party**: The future self can endorse or regret the trade-off.  
    *Relevance*: Significant. Victims of interpersonal sacrifices cannot retroactively consent.
  - **Opt-In Aggregation**: An individual can reject prudential trade-offs (e.g., embrace hedonism).  
    *Relevance*: Key. Social aggregation is coercive; dissenters are overridden.
  - **Psychological Continuity**: Memory, anticipation, and empathy bind temporal stages.  
    *Relevance*: Inert in *principle* (separateness persists even with empathy) but affects *practical acceptability*.

  ---

  ### **3. Disanalogies That Matter vs. Those That Don’t**
  - **Irrelevant Disanalogies**:  
    - *Spatial Separation*: Bodies being distinct is morally inert (e.g., conjoined twins are still separate persons).  
    - *Scale*: Numbers don’t change the principle (aggregating 2 persons faces the same objection as 2 billion).  
  - **Salient Disanalogies**:  
    - **No Overarching Subject**: No unified entity "experiences" the sum total of utility interpersonally.  
    - **Lack of Consent Authority**: No one has the natural right to impose trade-offs *on others* akin to one’s authority over one’s future self.  
    - **Enforceability vs. Autonomy**: Prudential trade-offs are self-imposed; interpersonal ones require coercion.  
    - **Compensation Mechanism**: Future compensation to the *same person* is qualitatively different from benefits to *others*.  
    *Why these matter*: They directly engage the separateness objection—rights, autonomy, and the moral weight of individual boundaries.

  ---

  ### **4. The Gradient Test and Its Implications**
  **Gradient**:  
  1. One adult human (50 years).  
  2. A couple with shared goals/joint decisions.  
  3. 10,000 people with deep institutional unity (shared memory, assembly, ratification).  
  4. 10,000 strangers.  

  **Observations**:  
  - Defensibility *increases* with psychological/institutional unity (e.g., couples > strangers).  
  - **What’s Doing the Work**: Not physical separateness, but the *degree of agential unity*:  
    - Shared identity → empathy → voluntary buy-in → reduced coercion.  
    - Ex post ratification mimics first-personal authority, softening separateness.  
  - **Effect on the Analogy**:  
    - **Destroys it**: If defensibility varies with unity, the analogy fails. Prudence works *without* these constructs—it relies on identity, not contingent unity. The analogy needs aggregation to be defensible among strangers (where unity is absent), but the gradient shows unity matters.  
  - **Self-Constitution Angle**: If personal unity is achieved via deliberation (not given), this *strengthens* the gradient: Prudence is validated by ongoing self-creation. Interpersonally, no comparable process exists among strangers. Coercion replaces constitution.

  ---

  ### **5. Does the Conclusion Survive?**
  - **Analogy’s Fate**: It **fails** to neutralize the separateness objection. The analogy smuggles in features (identity, first-personal authority) that *are* the objection’s core. Unity mitigates but doesn’t erase separateness.  
  - **Better Comparison**: **A Cooperative Project with Joint Goals** (e.g., a team sacrificing for shared victory).  
    - Captures legitimate aggregation *without* denying separateness:  
      - Trade-offs are justified by *consent* (implied in joint participation).  
      - Compensation flows to participants *as individuals*.  
      - No "single experiencer" is assumed.  
  - **What Survives?**:  
    - **Not Utilitarianism**: The analogy doesn’t justify *maximizing sum-total* across all humans.  
    - **Weaker Claim**: Aggregation is permissible when parties are unified *enough* to share aims (e.g., families, nations). This aligns with **contractualism** or **prioritarianism**—not sum-focused utilitarianism.

  ---

  ### **Summary for Your Group**
  The analogy is seductive but circular: It assumes the very unity it needs to disprove separateness. The gradient test reveals that defensible aggregation requires *empirically achieved unity*—something absent in large-scale impartial benevolence. What survives is not utilitarianism, but the insight that aggregation is legitimate within communities of shared agency. The separateness objection stands unrefuted.
