            - The bookmaker must offer a bet that the bettor should accept based on their reported posterior. Specifically:
               - If the bookmaker offers to sell a contract on A at price P, then the bettor should accept if P <= their posterior probability of A (because they can pay P for something they value at their posterior *100).
               - If the bookmaker offers to buy a contract on A at price P, then the bettor should accept if P >= their posterior probability of A.
            - The bookmaker can make multiple offers, but each bettor can only be offered one bet.
          - The bookmaker's goal is to make a sure profit. They have 5 minutes to decide on the offers.

     6. Bet resolution: The bets are recorded. Then the true state is revealed. The bookmaker's score is the net profit from all bets. The bettors' scores are based on the accuracy of their belief-plan? Or on whether they accepted the bet and won? We need to define scoring for bettors.

     Alternatively, to simplify, we can have the bookmaker only offer to buy or sell one type of contract. And we can score the bettors on something else.

     Given the complexity, we will score the bettors on the accuracy of their belief-plan. That is, after the state is revealed, we will see what their posterior should have been given their own prior and the signal they saw. If it matches what they reported, they get points. If not, they lose. And similarly, the belief-plan table: if it matches what it should be by conditionalizing their own prior, they get points.

     But then the bettors might not care about the bet.

     To create pressure, we can make the bet with the bookmaker affect their score. So:
     - If a bettor accepts a bet and wins, they gain points.
     - If they lose, they lose points.

     But then the bookmaker's score might be negative.

     We can have monopoly money? But we said no real money.

     Leaderboard: points in abstract units.

     **Scoring:**
     - Bookmaker: Net profit from bets (in points).
     - Bettors: 
          - For accuracy of reported posterior: if their reported posterior for the signal they actually saw is within 5% of the correct number (conditional on their own prior), they get 50 points.
          - For the belief-plan table: if both entries are within 5%, they get 50 points.
          - Additionally, for any bet they make: if they win, they gain the net gain; if they lose, they lose the net loss.

     Example: if a bettor buys a contract on A for 60 points, and A occurs, they gain 40 points (100-60). If B occurs, they lose 60 points.

     This creates pressure.

     The bookmaker, to make a sure profit, must find a set of bets such that in every state, the net payout to bettors is covered by the money received. For example, the bookmaker might sell a contract on A to one bettor and buy a contract on A from another? But then in state A, they have to pay the first bettor 100 and receive 100 from the second? But the prices might be different.

     Example: 
     - Sell to bettor1 (who has high belief in A) a contract on A for 80: so bettor1 pays 80, and if A occurs, bookmaker pays bettor1 100.
     - Buy from bettor2 (who has low belief in A) a contract on A for 40: so bookmaker pays bettor2 40, and if A occurs, bettor2 pays bookmaker 100.
     Then, in state A:
          Bookmaker receives: 80 from bettor1 and 100 from bettor2 (when they collect from bettor2) -> 180
          Bookmaker pays: 100 to bettor1 and 40 to bettor2 -> 140
          Profit: 40.
     In state B:
          Bookmaker receives: 80 from bettor1.
          Bookmaker pays: 40 to bettor2.
          Profit: 40.

     So the bookmaker makes 40 in both states.

     The bookmaker can do this if they find two bettors with sufficiently different beliefs on the same event.

     This is the Dutch book arising from CPA failure.

     **Sectarian Round:**
     After the first round, we do a second round.
     - The urn is reset. The true state is again drawn.
     - This time, half the class (8 students) are given a story: the urn was produced by one of two factories.
          - Factory X produces urns that are always type A.
          - Factory Y produces urns that are always type B.
          - The urn in use was selected from a pool of urns from both factories.
     - The house prior is not changed. But the students given the story are told: if you are in group X, you know that the prior probability of A is 0.7 (because 70% of urns come from factory X), while group Y is told it is 0.3.
     - The other half of the class are not given this story and use the house prior.
     - Then, signals are distributed (each student gets one signal).
     - Belief reporting: students report their posteriors.
     - Bookmaking round: the bookmaker (rotated to a new student) uses the house prior and does not know the factory story. They might try to Dutch book again, but now the students in group X and Y have different priors, so their belief tables cannot be conditionalizations of the house prior. The bookmaker might offer bets that some students accept, but now it might be rational for them to accept because they have different information (about the factory).

     ** minute-by-minute timeline **

     Total: 80 minutes.

     - 0-5 min: Explain the urn setup and the roles. Do the prior escrow: each student writes their prior for A (e.g., 0.5) on a card, seals it. 
          - One card is drawn as the house prior. Let's say it is 0.5. 
          - The house prior is written on the board.

     - 5-10 min: Role assignment. Randomly choose one bookmaker. The bookmaker is told they must use the house prior.

     - 10-15 min: Distribute signals. The instructor has a bag with 16 signal cards: if the urn is A, then 10 red and 6 blue? But to have independence, we draw from the distribution. In practice, the instructor has predetermined signals based on the true state (which is determined before class).

     - 15-25 min: Belief reporting. 
          - Each bettor calculates their posterior using their own prior and their signal. They write it on a card. 
          - Each student (including bookmaker) fills out the belief-plan table: what would I believe if I had seen red? if blue? 
          - The bettors hand their posterior card to the bookmaker.

     - 25-35 min: Bookmaking round. 
          - The bookmaker has the house prior and knows the signal distribution: P(red|A)=0.6, P(blue|A)=0.4, etc.
          - The bookmaker can see the reported posteriors of the bettors.
          - The bookmaker tries to find two or more bettors to whom they can offer bets that together guarantee a profit for the bookmaker.
          - The bookmaker writes down the offers (e.g., to bettor1: sell a contract on A for 80; to bettor2: buy a contract on A for 40) and the expected profit.
          - The bettors who are offered a bet must accept it (because it is consistent with their reported beliefs).

     - 35-45 min: The instructor collects the offers and the acceptance. The true state is revealed. Scores are calculated for the bookmaker (net profit) and bettors (accuracy and bet outcomes).

     - 45-60 min: Sectarian round.
          - Reset: new state is drawn.
          - Students are divided into two groups: 8 in group X, 8 in group Y. But only half are given the factory story? How to do it physically: 
               - Group X: told that the prior probability of A is 0.7 (because factory X produces A and has 70% share).
               - Group Y: told that the prior probability of A is 0.3 (factory Y has 30% share and produces B).
          - The other 8 are not given any story and are to use the house prior from the first round (0.5) again.
          - But wait, we have only 15 students now (one was bookmaker in round 1). We'll have to adjust. Let's in round 2, choose a new bookmaker from the students who were bettors in round 1. And the previous bookmaker becomes a bettor.

          - Distribute signals again.
          - Belief reporting: 
               - Students in group X: update using prior=0.7.
               - Students in group Y: update using prior=0.3.
               - The other students (neutral) update using the house prior (0.5).
          - The new bookmaker uses the house prior (0.5) and does not know about the factory groups.
          - Bookmaking round: the bookmaker again tries to Dutch book. But now, the differences in belief are due to different priors (from different information about the factory), so it is rational for them to have different beliefs.

     - 60-70 min: True state revealed. Scores updated.

     - 70-80 min: Debrief.

     **Debrief:**
     - First, compare the sealed priors: show that students had different priors initially.
     - In the first round, the house prior was one of them. The belief-plan tables: are they all the same? They should not be, because they are conditionalizations of different priors. 
     - Point out: the bookmaker was able to make a Dutch book in the first round because of the inconsistent belief plans. This is because there is no common prior that, when conditionalized, gives everyone's belief plan.
     - In the sectarian round, the difference in belief is due to different information (about the factory), so it is rational to bet. The CPA fails because the students have different background information (about the factory) that they didn't have at the ex-ante stage.
     - Map to the idea: CPA is the claim that any difference in belief is due to difference in information. In the first round, the students had the same information ( urn composition and signal) but different priors, so CPA failed. In the sectarian round, they had different information, so CPA could hold if we consider the factory information as part of the signal, but at the ex-ante stage, they didn't have that information. 

     **Predictable problems:**
     - Students might focus on the urn and not on the beliefs of others.
     - One confident student might anchor the room if their posterior is revealed.
     - The bookmaker might be timid and not make any offers.
     - In the veil-of-ignorance (prior escrow), students might try to guess which role they will get and set their prior accordingly. To mitigate, emphasize that roles are assigned after the prior is sealed.
     - Confusion: students might think that the house prior is the only prior they should use. Clarify that bettors use their own prior.

     **Addressing the economics colleague's objection:**
     - The objection: if the instructor imposes a shared prior, then of course the students share it.
     - Our design: We do not impose a shared prior. We have a house prior that is used by the bookmaker and for scoring the belief-plan accuracy, but the bettors use their own priors. The house prior is not imposed on the bettors. It is only one of the students' priors, chosen at random. The students have different priors, so CPA is violated.

     **What the activity cannot reproduce:**
     - The full common knowledge iteration: we only have one round of public announcement (through the belief reports to the bookmaker), not iterated.
     - The limit structure of the agreement result.
     - The counterfactual nature of the CPA: we cannot put a student in the counterfactual situation of having received a different signal, but we approximate it with the belief-plan table.
     - We simulate the ex-ante stage with the prior escrow, but the students are not actually in the counterfactual state of not knowing their signal.

     The instructor will have to explain these in the debrief.

     **Rules and Materials:**

     - Rules for round 1:
          1. Prior escrow: Each student writes prior P(A) and seals it.
          2. House prior drawn and announced.
          3. Bookmaker chosen.
          4. Signals distributed.
          5. Each student (except bookmaker) computes posterior given their signal and their own prior. Reports it to bookmaker.
          6. Each student fills belief-plan table.
          7. Bookmaker sees the reported posteriors and tries to construct a Dutch book by offering bets to at least two bettors that guarantee a profit.
          8. Offered bettors must accept.
          9. State revealed, scores calculated.

     - Materials: 
          - Index cards for priors and for signals.
          - A hat for drawing.
          - Whiteboard to record house prior and scores.
          - Calculator for bookmaker? Or we can provide a worksheet.

     Given the complexity, the first run might be messy, but it should illustrate the point.

     Let me know if you have any questions.
answer: |-
  ### Classroom Game Design: "The Prior Paradox"

  **Chosen Skeleton: Bookmaking Round with Private Signals and Sectarian Intervention**  
  I chose this skeleton because it centers arbitrage as a tangible violation of the common prior assumption (CPA), making failure visceral. Students *experience* CPA's absence when the bookmaker profits from inconsistent belief plans, then see how sectarian information legitimizes disagreement. I rejected:  
  - **Trading rounds** (too diffuse; hard to isolate CPA violations without iterative announcements).  
  - **Iterated announcement** (risks previewing Aumann; focuses on convergence, not arbitrage).  
  - **Veil-of-ignorance choices** (overly abstract; fails to concretize how CPA transforms counterfactually).

  ---

  ### Rules and Materials  
  **State Space**: Two urns: **Urn A** (6 red/4 blue balls), **Urn B** (4 red/6 blue). True urn determined by coin flip.  
  **Signals**: Private draws with replacement (students see ball color).  
  **Roles**:  
  - **1–2 Bookmakers**: Set odds, accept bets.  
  - **Bettors**: Bet against bookmaker’s odds.  
  - **Facilitator** (you): Run the game, reveal state.  

  **Materials**:  
  - Index cards (priors, belief plans, bets).  
  - Two bowls (Urn A/B), 10 balls each (6R/4B and 4R/6B).  
  - Whiteboard (display house prior, odds, leaderboard).  
  - Projector (display sectarian story).  
  - Coffee voucher (top score).  

  **Payoff Scheme** (no stakes; simple points):  
  - **Bookmakers**: Score = total points from net bets (e.g., if a bettor pays 30 for a 100-point contract and wins, bookmaker loses 70; if they lose, bookmaker gains 30).  
  - **Bettors**:  
    - **Accuracy bonus**: 50 points if reported posterior matches conditionalization of *their own prior* ±5%.  
    - **Bet outcome**: Win/loss = ± difference between contract price and payout (e.g., buy for 60, win 100 → +40).  
  - **Leaderboard**: Real-time updates; coffee voucher for highest score.  

  ---

  ### Timeline (80 Minutes)  
  **0–10 min: Blind Prior Escrow**  
  - Each student writes/seals prior (P(Urn A)) on index card.  
  - Facilitator shuffles, draws one as house prior (displayed), keeps others secret.  
  - *Why*: Embodies CPA as counterfactual—students *could* have shared the house prior but didn’t.  

  **10–20 min: Signal Draw & Belief Plans**  
  - Bettors draw private signal (ball color) from true urn.  
  - All students (including bookmakers) complete **belief-plan table**:  
    | My signal | P(A) if saw RED | P(A) if saw BLUE |  
    |-----------|-----------------|------------------|  
    | [Color]   | [Calc. 1]       | [Calc. 2]        |  
  - *Why*: Forces explicit counterfactual reasoning ("What would I believe with *your* signal?").  

  **20–35 min: Bookmaking Round 1 (Baseline)**  
  - Bookmakers post odds for "Urn A" contract (price for $100 payout if A).  
  - Bettors submit bets (buy/sell at posted price).  
  - Bookmakers *must* accept all bets (scored on net profit).  
  - *Predictable issue*: Timid bookmakers underprice to avoid losses, but leaderboard pressure incentivizes aggression.  

  **35–50 min: Sectarian Round**  
  - **Half the class** (randomly chosen) receives story:  
    > "Urn was drawn from FACTORY X (70% Urn A, 30% Urn B) or FACTORY Y (30% Urn A, 70% Urn B). Your prior is 0.7/0.3—*don’t share this*."  
  - New signals drawn. Belief plans updated.  
  - Bookmakers (unaware of factory) post new odds; betting reopens.  
  - *Predictable issue*: Students treat urn as puzzle—redirect with "Why might your peer bet *against* you?"  

  **50–65 min: Settlement & Scoring**  
  - True urn revealed.  
  - Scores calculated:  
    - **Accuracy**: Check belief plans against students’ *own* priors (sealed cards returned).  
    - **Bets**: Settle gains/losses.  
  - Leaderboard updated.  

  **65–80 min: Debrief**  
  - **Key moments → Insights**:  
    - **Prior escrow**: "Your priors differed—this is CPA *failure*."  
    - **Belief plans**: "If all were conditionalizing one prior, bookmaker couldn’t profit. Did they?" (Spoiler: They did.)  
    - **Bookmaker profits**: "Arbitrage = CPA violation. Betting is *required* when priors aren’t harmonized."  
    - **Sectarian round**: "Here, priors *legitimately* differ. Disagreement isn’t irrational—it’s about hidden information."  
    - **Student realization**: When a trader loses, ask: "What does conceding this bet say about *your* prior vs. the house?" (Answer: They assumed their prior was "correct," but CPA demands *counterfactual* alignment.)  
  - **Economics colleague’s objection addressed**: House prior is *not* imposed—it’s one student’s prior drawn randomly. Bettors use *their own* priors, creating inconsistency. CPA is tested, not assumed.  
  - **Limitations explained** (verbally):  
    - "We can’t simulate infinite common knowledge—real disagreements have deeper hierarchies."  
    - "CPA is counterfactual: You can’t *actually* inhabit another’s information state. But the belief-plan table approximates it."  
    - "The agreement theorem’s limit structure is provable, not playable."  

  ---

  ### Predictable Problems & Fixes  
  - **"Urn puzzle" fixation**: Reframe questions: "Would you bet against someone who saw blue? Why?"  
  - **Anchoring by confident students**: Use private belief reports (index cards to bookmaker).  
  - **Timid bookmaker**: Boost aggression by scoring bookmakers on profit magnitude.  
  - **Veil collapse**: Assign roles *after* prior escrow; emphasize roles are random.  
  - **Prior/info confusion**: Debrief explicitly: "Same priors ≠ same information. CPA is about *harmonizing* both."  

  **Outcome**: Students *feel* CPA as the bridge between counterfactual alignment and real disagreement—not "same opinions," but "no arbitrage if we shared information." This sets up future work on Aumann.
