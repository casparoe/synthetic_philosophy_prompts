prompt: |-
  I'm finishing a chapter on moral particularism and I'd like a consistency audit of my own position before I defend it, because I have the feeling that some of the things I want are cheap separately and expensive together. Let me state the package as plainly as I can. I work in the broadly Dancy-style particularist tradition, but several of these commitments are my own additions, and the terms I use for them are my own, so please argue about the substance rather than about who holds what.

  (1) Holism about reasons. Whether a feature of a situation is a reason at all, and which way it points, depends on what else is present in the situation; no feature carries its valence from case to case as such.

  (2) Anti-codification, strongly stated. There is no true, informative, finitely statable moral principle that explains verdicts, and moral judgement does not need one in order to be a genuine exercise of reason. I mean this more strongly than the claim that principles are true but too complicated to be of use: I want to say there is nothing principle-shaped for the verdicts to answer to.

  (3) No brute variation. Whenever a feature's valence differs between two cases, there is some specifiable difference between the cases that explains the difference. I hold this because I want moral judgement to be answerable to reasons rather than to taste, and because I don't see how a verdict could be justified by a difference nothing can be said about.

  (4) Defaults. Some features have a default valence — that a promise was made, that an action would cause someone pain — and they point as they do unless something in the context defeats or silences them. This is what I think makes moral advice and moral education possible at all.

  (5) Silencing. For some features in some contexts, the context does not outweigh the feature but silences it: the feature is not a weak reason that loses, it counts for nothing at all. My central case: you promised Ravi that you would bring a parcel to his flat at six; at ten to six you learn that Ravi died at midday. I want to say that the promise is not a reason, however slight, for going to the flat — not a reason that is outgunned by the futility of the trip. I also want to distinguish silencing from what I call dead weight: a feature that is not a reason and would not have been one anyway, even had the case been otherwise. I claim this distinction can be drawn without appeal to principles.

  (6) Drift. Take a graded series: a promise to deliver antivenom to a snakebite victim; a promised birthday cake; a promised book; a promised newspaper; promised junk mail; and finally the promise to Ravi, who has been dead since noon. My verdicts slide continuously down this series: the promise is a strong reason at one end and nothing at all at the other, and there is, I think, no step at which its status flips from outweighed to silenced and no sharp cut-off anywhere in between.

  (7) Contrastivism about verdicts. Ought is always ought-rather-than-the-alternatives, so the deontic verdict on an action can change when an alternative is added to or removed from the option set even though nothing about the action itself has changed.

  (8) Universalizability. Moral judgements are universalizable: if an action is wrong for me, it is wrong for anyone relevantly similarly situated, and moral disagreement between such people is genuine disagreement rather than a difference of sensibility. Several readers have told me this sits badly with (1); I don't think it does, but I'd like to know whether I'm right.

  (9) Expertise. There are moral experts; their verdicts converge on hard cases; expertise is transmitted by training on cases rather than by teaching principles; and an expert pressed to defend a verdict can always say, non-vacuously, why the verdict is what it is.

  Different readers have flagged different parts of this and I can't tell which of the flags I should take seriously. What I want is an audit, not a survey of the literature: go through the set and tell me which pairs are genuinely in tension, ranked by severity rather than presented as a list of equal worries; which apparent tensions dissolve on inspection and exactly why they dissolve; for each real tension, what specifically I would have to give up and what giving it up would cost me elsewhere in the set; and which single revision would clean up the most. And I'd like you to be explicit about the epistemic status of your own audit: tell me how confident you are in each ranking, where your reasoning is most likely to break down, and which consideration, if I could produce it, would make you reorder the tensions or drop one of them altogether.
reasoning: |-
  Okay, the user is working on a chapter about moral particularism, specifically within the Dancy-style tradition but with their own additions. They've listed nine commitments and want a consistency audit. They're worried that some combinations might be incompatible. Let me start by understanding each point thoroughly.

  First, holism (1) says reasons depend entirely on context—no fixed valence. Then anti-codification (2) claims no finite moral principles exist, not even complex ones. No brute variation (3) insists every valence change has an explainable difference. Defaults (4) suggest some features have default valences unless defeated. Silencing (5) is when a feature isn't just outweighed but nullified. Drift (6) describes a gradual shift in reasons without clear boundaries. Contrastivism (7) means "ought" is relative to alternatives. Universalizability (8) states that similar situations demand the same judgments. Expertise (9) involves moral experts whose judgments converge and can be defended case by case.

  Looking for tensions. The biggest issue seems between anti-codification (2) and no brute variation (3). If every valence change requires an explainable difference, but there are no principles, how do we specify these differences without implying rules? Without principles, explaining differences might rely on irreducible context, which could violate (3). The user wants explanations but rejects principles; that's tricky.

  Then, defaults (4) and silencing (5) with drift (6). Defaults assume a standard valence, but drift shows a gradual loss of reason strength. If there's no sharp cutoff between outweighed and silenced, how do defaults function? Especially since silencing is distinct from dead weight. The sliding scale in drift might undermine the clear cases needed for defaults.

  Universalizability (8) and holism (1) might clash if holism implies each situation is unique. But universalizability allows relevantly similar situations. The challenge is defining similarity without principles. If every feature's relevance is context-dependent, two cases might never be similar enough. But the user thinks it's manageable; I need to see why.

  Contrastivism (7) could conflict with universalizability if "ought" depends on alternatives, making similarity harder. But if alternatives are part of the situation, maybe it's included in the similarity assessment. Still, it adds complexity.

  Expertise (9) and anti-codification (2): Experts defend verdicts non-vacuously without principles. How? Through case-based reasoning, pointing to features. But if there's no codification, each explanation is situation-specific. Possible, but might not satisfy those seeking general rules. The user believes experts can articulate reasons without principles, which hinges on whether such explanations are sufficient without underlying rules.

  I need to rank these tensions. The anti-codification vs. no brute variation is the most severe because (3) demands explanations, but (2) denies the framework for those explanations. Then defaults and silencing vs. drift, because drift's continuum challenges the discrete categories of defaults and silencing. Universalizability with holism might be manageable if similarity is context-inclusive. Contrastivism and expertise might have lower tension.

  The user might need to soften anti-codification to allow for defeasible generalizations or clarify that explanations don't require principles. Or refine silencing and defaults to accommodate gradation in drift. But each adjustment has costs. For example, allowing some principles weakens anti-codification. Clarifying that defaults are heuristic might preserve them without strict valences.

  Underlying needs: The user wants a coherent particularist system that avoids relativism, allows for moral expertise and education, and maintains objectivity through universalizability. They need to reconcile context-dependency with explainable differences and avoid arbitrariness. Ensuring that moral judgments are reason-based yet not codified is central. They might also want to defend against critics who say particularism leads to subjectivism.
answer: |-
  Here is a consistency audit of your position, ranked by severity of tension, with epistemic transparency about the reasoning. The core tension arises from demanding *explanatory structure* without *codifiable principles*, which permeates multiple commitments. I'll rank tensions from most severe to least, explain why apparent tensions dissolve, and specify costs of revisions.

  **Epistemic Stance of This Audit:**  
  - **Confidence Level:** High (8/10) on identifying tensions; moderate (6/10) on dissolution of apparent tensions (due to reliance on your stipulations).  
  - **Breakdown Points:** My reasoning depends on your definitions (e.g., "non-vacuous explanation" in (9), "specifiable difference" in (3)). If "specifiable" permits irreducibly contextual explanations, (2)+(3) might hold. Similarly, if "defaults" are heuristic rather than metaphysical, (4)+(6) survives.  
  - **Key Revision Trigger:** If you clarified that "explanation" in (3)/(9) requires *only feature-citing*, not *generalizations*, tensions with (2) dissolve. Absent that, (2)+(3) is unstable.  

  ---

  ### **Ranked Tensions**  
  #### **1. Highest Severity: Anti-Codification (2) + No Brute Variation (3)**  
  - **Tension:** (3) demands that every valence shift has a "specifiable difference" explaining it. But without principles (2), what structures these explanations? If each explanation is case-specific and non-generalizable, "specifiable" risks vacuity (e.g., "In Case A, pain matters because of context C; in Case B, it doesn’t because of context C*"). This threatens to collapse into brute variation *in practice*, even if you posit metaphysical differences.  
  - **Why Incompatible?** (3) implies a *systematic explanatory framework*, while (2) denies such a framework exists. (9) exacerbates this: experts must "non-vacuously" explain verdicts, but without principles, their explanations cannot appeal to stable relations (e.g., "Pain defaults to bad *unless...*" implies a proto-principle).  
  - **Cost of Revision:**  
    - *Drop (2)*: Allow defeasible generalizations (e.g., "Pain is pro tanto bad"). Cost: Weakens core particularism; may require accepting "infinite" or "ceteris paribus" principles.  
    - *Drop (3)*: Accept some brute valence shifts. Cost: Undermines objectivity (risks moral taste) and expert justifications (9).  
  - **Cleanup Potential:** Revising (2) to allow *defeasible generalizations* resolves this and cascading tensions below.  

  #### **2. High Severity: Defaults (4) + Silencing (5) + Drift (6)**  
  - **Tension:** (4) and (5) rely on categorical distinctions (default valence → silenced), but (6) denies sharp boundaries ("no step at which status flips"). If valence slides continuously, "defaults" and "silencing" become contextually fluid, not robust categories. Example: In the promise series, is there a non-arbitrary point where "outweighed" becomes "silenced"? If not, (5) collapses into outweighed reasons.  
  - **Why Incompatible?** (6) implies valence is scalar and context-sensitive, while (4)/(5) require threshold effects. Without principles, demarcating "silencing" from "strong defeat" seems ad hoc.  
  - **Cost of Revision:**  
    - *Drop (5)*: Treat all valence shifts as defeasibility (no silencing). Cost: Loses the Ravi case intuition; blurs (9) explanations (why *no* reason vs. weak reason).  
    - *Reframe (4)/(5) as heuristic*: Defaults/silencing are epistemic tools, not metaphysical facts. Cost: Weakens their role in moral education (4).  
  - **Cleanup Potential:** Abandoning (5) reduces tension but doesn’t resolve (4)+(6).  

  #### **3. Moderate Severity: Holism (1) + Universalizability (8)**  
  - **Tension:** Holism suggests all reasons are context-bound, but universalizability requires identical verdicts in "relevantly similar" situations. What fixes relevance without principles? If *every* feature’s valence is context-dependent, similarity judgments become ungrounded (e.g., two cases with "promise-breaking" may differ microscopically).  
  - **Why Dissolves?** You define "relevantly similar" as *all contextually salient features matching*. Holism then permits universalizability: if contexts identically determine valences, verdicts match. Tension arises only if (8) is interpreted as requiring *principle-governed* similarity.  
  - **Confidence in Dissolution:** Moderate (7/10). Hinges on whether "similarity" can be defined non-principially (e.g., via narrative coherence). Critics like Hooker argue holism makes similarity indeterminate.  

  #### **4. Low Severity: Contrastivism (7) + Holism (1)/Universalizability (8)**  
  - **Tension:** (7) makes verdicts option-set-relative, but (1)/(8) tie verdicts to features/universality. If alternatives change verdicts, two agents in "similar" situations with different option sets could permissibly act differently (e.g., A ought to Φ given {Φ,Ψ}, but B ought not to Φ given {Φ,Ψ,Χ}).  
  - **Why Dissolves?** Include the option set in the "situation" for (8). Universalizability then holds: if situations (including alternatives) are identical, verdicts match. Holism (1) already covers alternative-sensitive reasons (e.g., Φ’s cost depends on whether Χ is available).  

  #### **5. Minor Severity: Expertise (9) + Anti-Codification (2)**  
  - **Tension:** How do experts "converge" or "defend verdicts non-vacuously" without shared principles? Convergence suggests objective patterns, while (2) denies patterns are "principle-shaped."  
  - **Why Dissolves?** Expertise can be case-based (e.g., legal precedent). Experts cite *features* (e.g., "Ravi’s death silences the promise due to futility") without general rules. Convergence arises from shared sensitivity to reasons, not principles.  
  - **Risk:** If experts’ explanations imply tacit principles (e.g., "Dead promisees silence promises"), (2) is threatened.  

  ---

  ### **Synthesis and Strategic Revision**  
  - **Core Problem:** The package demands **explanatory rigor without explanatory generalizations**. This strains (2)+(3) severely and radiates to (4)/(5)/(6) and (9).  
  - **Highest-Leverage Revision:** Soften (2) to allow *defeasible, contextually flexible generalizations* (e.g., "Promises generate reasons unless silenced"). This:  
    - Resolves (2)+(3) by grounding "specifiable differences" in defeasible patterns.  
    - Eases (4)/(5)/(6) by framing defaults/silencing as probabilistic tendencies.  
    - Preserves holism (1) if generalizations are not exceptionless.  
    - Retains anti-codification’s spirit if generalizations are inexhaustive/unstable.  
  - **Cost:** Mildly blunts radical particularism; may invite principle-based objections.  
  - **Alternative:** Drop (3) or (5), but this sacrifices objectivity/clarity.  

  **Final Confidence:** This ranking holds at 7/10 confidence. If you provided examples of "non-vacuous explanations" (for 3/9) *without* implying generalizations, I would downgrade the (2)+(3) tension. If defaults (4) were framed as purely psychological, (4)+(6) tension would dissolve. Your position is innovative and defensible but requires careful metaethical scaffolding around "explanation" and "defaults."
