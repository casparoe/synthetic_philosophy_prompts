  Move 7 (Miriam): She correctly distinguishes arbitrariness from cause/motive. Her point about inherited conventions is textually solid. This is good textual analysis.

  Move 8 (Douglas): The bank run objection is powerful - it reveals Lewis might be defining coordination equilibria generally rather than conventions specifically. His point about animal proto-norms highlights a genuine limitation of Lewis's human-focused account. Miriam's response is adequate but defensive.

