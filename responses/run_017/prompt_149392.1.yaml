  Okay, the user is part of a funding panel for interdisciplinary projects focused on mechanistic explanations. They're stuck in a recurring debate with a colleague about whether a proposal offers a genuine reduction (a "crane") or falls into "greedy reductionism." They want clear, practical criteria to evaluate proposals, not philosophical jargon. 

  Hmm, the user's frustration is palpable—they mention having the same argument every cycle. The core tension seems to be between two instincts: one valuing concrete derivation from lower-level mechanisms, the other wary of explanations that "explain away" the phenomenon. Their "too cheap" vs. "too expensive" framing is sharp but murky; they’re unsure if these are distinct failure modes or two sides of the same coin. 

  Digging deeper: they likely need to reconcile scientific rigor with interdisciplinary practicality. Proposals span cognitive science and systems biology, so criteria must avoid field-specific biases. The unspoken pain point? Wasting funds on elegant but empty mechanistic stories versus rejecting legitimately messy but insightful work. They also hint at a meta-conflict: is their disagreement about standards (negotiable) or principles (non-negotiable)? 

  I’ll structure criteria around their "crane vs. greedy reduction" metaphor, avoiding skyhooks (handwavy explanations). Key moves: 
  - Anchor to Daniel Dennett’s crane/skyhook distinction but operationalize it. 
  - Treat "too cheap" (phenomenon dissolved) and "too expensive" (new mystery machinery) as separate traps. 
  - For each criterion, give a plain-English question reviewers can ask, plus the underlying *why*. 
  - Flag which criteria are fatal flaws vs. negotiable preferences. 

  The "phenomenon conservation" criterion (#1) is the bedrock—if the higher-level pattern isn’t preserved, it’s not an explanation, just a demolition job. But #4 (variance handling) might be the silent killer; many proposals ignore boundary conditions where the mechanism fails. 

  Biggest tension: #2 (work attribution) vs. #8 (completeness). Purists want full derivations; pragmatists accept mechanism sketches. This is where taste kicks in—I’ll note it’s negotiable. Relax completeness first if proposals are failing; it’s the least damning flaw if other boxes are ticked. 

  And yeah, "too cheap" isn’t just about unchanged phenomena—it’s when lower-level terms *swallow* the higher one without doing new work (#2). "Too expensive" is when ad-hoc machinery (#5) or untethered parts (#3) creep in. They’re distinct but often co-occur. 

  Lastly, the knockout punch? Probably #1 or #3. If the phenomenon vanishes or the mechanism’s operation is mystical, nothing else matters.
answer: |-
  Here’s a distilled set of criteria to distinguish **cranes** (genuine mechanistic explanations) from **greedy reductions** (explanatory failures), framed for practical review. Your "too cheap" (dissolving the phenomenon) and "too expensive" (invoking unexplained machinery) are distinct failure modes—both must be avoided.  

  ### Non-Negotiable Criteria (Fail these → Reject)  
  1. **Phenomenon Conservation**  
     - *Why*: If the higher-level pattern isn’t preserved or is contradicted, it’s not an explanation—it’s a dismissal.  
     - **Question:** *Does the proposal specify which features of the higher-level phenomenon the mechanism actually reproduces or predicts?*  
     - *Failure mode*: "Too cheap" (e.g., claiming "memory is just synaptic weights" without showing how *forgetting* or *recall accuracy* map to weights).  

  2. **Work Attribution**  
     - *Why*: The lower level must do the explanatory heavy lifting. If the high-level concept is smuggled in, it’s circular.  
     - **Question:** *Could the mechanism operate without relying on undefined high-level terms?*  
     - *Failure mode*: "Too expensive" (e.g., "ecosystem resilience emerges from population dynamics" but "resilience" is redefined ad hoc in the model).  

  3. **Mechanism Transparency**  
     - *Why*: A crane must have visible gears. If key components are black boxes, it’s a skyhook.  
     - **Question:** *Are all critical components of the mechanism independently characterizable or measurable?*  
     - *Failure mode*: "Too expensive" (e.g., "navigation arises from neural circuitry" but depends on an unexplained "cognitive map" module).  

  ### Strongly Preferred Criteria (Fail these → Weak Proposal)  
  4. **Variance Handling**  
     - *Why*: Explaining when/why the phenomenon *breaks* proves the mechanism isn’t just storytelling.  
     - **Question:** *Does the proposal predict conditions under which the higher-level pattern degrades or fails?*  
     - E.g., Synaptic mechanism should predict memory failure under specific biochemical disruptions.  

  5. **Resource Accounting**  
     - *Why*: Greedy reductions often ignore the costs/constraints of the mechanism.  
     - **Question:** *Does the model track what the system expends (energy, time, information) to produce the phenomenon?*  
     - E.g., Circuitry-based navigation must address metabolic costs or computational limits.  

  6. **Scale Bridging**  
     - *Why*: The crux of inter-level explanation is showing how micro steps create macro effects.  
     - **Question:** *Does the proposal quantitatively link mechanism operation timescales/units to the phenomenon’s scale?*  
     - E.g., Population dynamics must show how individual births/deaths sum to ecosystem recovery timelines.  

  ### Negotiable Criteria (Depends on Reviewer Camp)  
  7. **Derivation Depth**  
     - *Purist view* (non-negotiable): The mechanism must mathematically *entail* the phenomenon.  
     - *Pragmatist view* (preferred): A plausible mechanism sketch suffices if testable.  
     - **Question:** *Could the phenomenon be quantitatively simulated from the mechanism alone?*  

  8. **Completeness**  
     - *Purist view*: Must explain 100% of the phenomenon (no "partially").  
     - *Pragmatist view*: Explaining key facets is valuable (e.g., memory *storage* but not recall).  
     - **Question:** *Does the proposal clarify what aspect of the phenomenon is and isn’t addressed?*  

  ---  
  ### Key Clarifications  
  - **"Too cheap" vs. "Too expensive"**: They’re separate.  
    - **Too cheap**: High-level pattern is erased, not explained (fails #1).  
    - **Too expensive**: Mechanism relies on new unexplained elements (fails #2 or #3).  
  - **The knockout punch**: **#3 (Mechanism Transparency)**. If critical parts are unmeasurable/undefined, the proposal is functionally untestable—reject immediately.  
  - **What to relax first**: **#7 (Derivation Depth)**. In complex systems (e.g., biology), full mathematical derivation is often impossible; mechanism sketches (+ #4–#6) can still be strong science.  
  - **Contradictory demands?** Avoid demanding both **#7 (full derivation)** and **#8 (completeness)** in early-stage work. Prefer #8 (explicit scope) over #7.  

  ### Summary Checklist for Reviewers  
  Ask:  
  1. Does the mechanism *reproduce* the phenomenon, not erase it? (#1)  
  2. Does it avoid sneaking in high-level concepts? (#2)  
  3. Are all mechanism parts independently defined/measurable? (#3)  
  4. Does it predict *when the phenomenon breaks*? (#4)  
  5. Does it account for costs/constraints? (#5)  
  6. Does it bridge scales quantitatively? (#6)  
  7. (Purist) Is the phenomenon mathematically derived? (#7)  
  8. (Pragmatist) Is the scope of explanation clearly stated? (#8)  

  **Reject if** #1–#3 fail. **Weak but fundable** if #4–#6 are weak but #1–#3 pass. **Taste-based debates** belong to #7–#8—resolve by prioritizing empirical testability (#3–#4) over elegance.
