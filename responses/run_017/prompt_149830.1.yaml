  Okay, the user is writing a novel and needs help with a character decision. The purser has made several rulings in life-or-death situations on a lifeboat. Now, there's a new case: an unconscious passenger who saved the water casks might die without a third of the remaining water, but saving him risks others. The user wants a committed answer, not a survey.

  First, I need to figure out the underlying rule the purser follows. Reviewing the previous rulings:

  1. He chose a mortally injured man to go overboard. Prioritizing survival chances—removing someone who wouldn't live anyway.
  2. He chose the knifer over the injured seaman. Here, it's about desert; the knifer committed a moral offense, so he was expendable despite being more useful.
  3. He gave water to the navigator over a dying passenger. Utility—the navigator is essential for everyone's survival.
  4. He gave the stowaway a full water share. Equality—everyone gets equal shares regardless of status.
  5. He refused the grandfather's sacrifice. The boat doesn't take lives; only the sea does. So no voluntary sacrifices.

  The key themes are survival of the group, no active killing, but allowing natural death. Also, moral desert plays a role in who gets sacrificed.

  Now, the new case: the unconscious man who saved the casks. He needs water and care, but it's risky. The surgeon says 1/3 chance he lives if given water, but others might die. If not, the 11 others likely survive.

  The purser's rule seems to be about maximizing group survival while avoiding direct killing. Sacrifices are only for those who are already dying or morally culpable. Here, the man isn't dying naturally—withholding water would be indirect killing. Plus, he's a hero who saved the casks. Moral desert suggests he deserves a chance.

  Precedents: Ruling 1 is similar because the injured man was already dying. Here, the man might recover with water, so it's different. Ruling 3 prioritized utility (navigator), but this man isn't essential now. Ruling 5 refused voluntary sacrifice, so the purser wouldn't accept others denying him water.

  So, the purser would give the water. He values recognizing contribution (like the navigator) and rejects sacrificing innocents. The hero's past action earns him the chance, even if risky. Also, not helping him is like letting the sea take him, but the boat doesn't actively cause death.

  The user wants confidence level. I'd say 85% confident because the hero's desert and refusal of sacrifice align. A variant that could change my mind: if the hero was also guilty of a crime, like the knifer, then maybe he'd be denied. But he's innocent here.
answer: |-
  Here is the ruling the purser makes, the rule he runs, its application to this case, the closest analogue, and supporting reasoning. I am 85% confident in this reading, based on the consistent core principle threading through his prior decisions. The variant case that would most efficiently change my mind is detailed at the end.

  **The Ruling:**  
  **The purser gives the water to the unconscious man.**

  **The Rule He Runs:**  
  **"Preserve the salvageable core of the boat for as long as possible, letting the sea take only what it has already claimed or what actively threatens the core."**

  This rule prioritizes:
  1.  **Group Survival Potential:** Maximizing the chance *this specific group* reaches rescue.
  2.  **Passive Culling:** Allowing death only for those already functionally dead (Ruling 1) or whose *actions* make them a lethal threat to order and survival (Ruling 2). The boat itself does not *actively* create sacrifices beyond these necessities.
  3.  **Essential Utility:** Prioritizing resources for those *absolutely indispensable* to navigation/salvage (Ruling 3).
  4.  **Equal Standing:** Granting equal rights to survival resources based purely on presence (Ruling 4).
  5.  **Rejecting Voluntary Sacrifice:** Refusing to institutionalize or incentivize self-destruction or sacrifice, as it erodes the core's integrity and will to survive (Ruling 5). The sea takes; the boat does not give.

  **Application to the New Case:**
  1.  **Salvageable Core:** The unconscious man *is part of the core*. He is not dead (like the crush victim in R1), nor is he a proven threat (like the knifer in R2). Depriving him of water is an *active* killing by the boat, violating the principle of passive culling. The sea hasn't taken him yet; the boat would be doing it.
  2.  **Group Survival Potential:** While spending the water *risks* 1-2 others, it doesn't guarantee their deaths ("probably will not"). Denying the water *guarantees* the unconscious man's death. The purser deals in certainties when sacrificing (R1 & R2: certain death/terminal state). Here, outcomes are probabilistic on both sides. He defaults to inaction (not actively killing) when certainty is absent.
  3.  **Essential Utility:** He is not essential *now*, but his *past action* (saving the casks) was *foundational* to their current survival – the very water they debate comes from the casks *he saved*. He embodies "salvage." Denying him rewards betrayal (like the knifer) and punishes ultimate sacrifice (like the grandfather offering himself). This undermines the moral order the purser enforces. The navigator (R3) was essential for the *future*; this man was essential for the *present* they are living in.
  4.  **Equal Standing:** He has an equal claim by presence (Ruling 4). Depriving him based on current incapacity sets a precedent that anyone unconscious or injured could be starved – eroding the core.
  5.  **Rejecting Voluntary Sacrifice:** While the man isn't volunteering, *denying him water* is functionally the group sacrificing him against his will (implied by his unconsciousness). The purser rejected the grandfather's voluntary sacrifice (R5) precisely because "the boat does not" take lives. Sacrificing the unconscious hero would be the boat taking a life.

  **Closest Analogue: Ruling 5 (The Grandfather)**
  *   **Respect:** Both cases involve a potential sacrifice offered for the perceived benefit of others (grandfather for grandchildren; unconscious man for the 11).
  *   **Principle:** The purser refuses the sacrifice in both, upholding that the boat does not actively take life, even if offered or seemingly expedient. The sea takes; the boat preserves what it can until the sea claims it. The grandfather was functional; the unconscious man is salvageable *with resources*.
  *   **Distinction:** The grandfather's sacrifice was voluntary and proactive. The unconscious man's sacrifice would be involuntary and reactive. The purser rejects *both* forms. The key parallel is the *boat's role*: it must not become an agent of death beyond removing immediate terminal threats or active destroyers.

  **Why Precedents Don't Fully Determine It (But Strongly Lean This Way):**
  The precedents *underdetermine* the weight given to **past essential contribution** versus **future essential utility**. Ruling 3 prioritizes future utility (navigator). This case involves monumental *past* utility. Does the rule value past sacrifice as a form of "standing"? Ruling 2 (punishing the knifer) and Ruling 5 (rejecting the grandfather's sacrifice) suggest the purser *does* recognize moral desert within his framework. The hero's action earned him a place in the "salvageable core" – failing to attempt to save him betrays the very principle of salvage he exemplified.

  **If He Ruled Differently (Which He Doesn't):**
  *   **Deny Water:** He would have to abandon **Ruling 5 (Rejecting Sacrifice)**. He would be accepting that the boat *can* actively take a life (by deprivation) for probabilistic group benefit, moving towards utilitarianism he's previously resisted (R5) except in cases of absolute future necessity (R3) or active threat (R2). This would make him more purely utilitarian, less bound by the sanctity of the "core" once formed.
  *   **Compromise (e.g., half-share):** This violates **Ruling 4 (Equal Standing/Throats)**. It also likely satisfies no one and kills the man just as dead as no water, while fracturing the group.

  **Confidence & The Variant That Changes My Mind:**
  *   **Confidence:** 85%. The core principle of "The boat preserves, the sea takes" combined with the rejection of active killing/sacrifice (R1, R2, R5) and the recognition of moral standing/desert (R2 punishing betrayal, implied by R5 rejecting sacrifice) strongly points to giving the water. His remark in R5 is the clearest philosophical statement he's made.
  *   **Variant Case That Would Change My Mind:** If the unconscious man was *also* revealed to have secretly hoarded water earlier in the voyage, *then* the purser would likely deny him water. This makes him analogous to the **knifer (Ruling 2)** – an active threat to the core through betrayal and selfishness, regardless of his past heroism. His earlier action becomes negated by a later action destroying trust and order. This would show the "active threat" principle (R2) overriding past contribution and current salvageability, making denial consistent. Without such a betrayal, giving the water holds.

  **Write your scene.** The purser looks at the unconscious man, then at the cask. He might touch the cask, a tangible reminder of the man's sacrifice. He ignores the surgeon's probabilities. He says something terse like: "He brought the water aboard. He drinks." or "The boat doesn't pour its saviours into the sea." His ruling isn't about the *chance* it gives the man, but about the *principle* it preserves for the group: loyalty, recognition of sacrifice, and the absolute line that *they* do not kill their own. The resentment from the others will be palpable, the relief non-existent – this is the cost of his consistency. It makes him fascinatingly harsh yet paradoxically noble.
