  We are designing an activity for a mid-level undergraduate seminar on value theory. The goal is to help students experientially distinguish between three concepts they often conflate: 
  1. Not knowing which is better (epistemic uncertainty)
  2. Two options being equally good (parity or equality)
  3. Incommensurability (no common scale)

  Constraints:
  - Materials: index cards, pens, sticky notes, poker chips (10 per student), timer, one double-sided handout, sealed envelopes.
  - No pre-class prep beyond printing; runnable by the instructor alone.
  - Four fictional lives for "Dana" (age 22), each rated on four values: financial security, artistic achievement, love and friendship, and moral impact. Each life should peak on a different value, and no life dominates another. Ratings are ordinal within a dimension and not comparable across dimensions.
  - Avoid technical terms; use ordinary language.
  - Mechanics: 
    a) Five-way verdict form: A better, B better, equally good, can't tell (but fact exists), no common measure.
    b) Local verdicts first: on adjacent pairs only, in pairs (of students), with reasons in terms of values (no mere preference). Then assemble into a full ranking.
    c) Mandated yardsticks: Each small group gets a sealed envelope with a required unit of account (one of the four values) and must rank accordingly.
    d) Refusal that costs: Groups can say "no ranking possible" but then the "bequest" (poker chips) goes to a default option (e.g., a charity Dana dislikes).
    e) Chips as conviction: Students spend chips to influence the group verdict. Unspent chips are wasted. We want to separate "tied" from "incomparable" via chip spending.
    f) Spread small improvements: For a pair declared incomparable, the instructor adds tiny improvements (via chits) until the verdict flips.

  Debrief in three parts:
  1. Map moments to distinctions: show the confusions, the artifact of a common scale, transitivity issues, and whether incomparability survives small improvements.
  2. Predictable problems and how to handle them in the moment.
  3. What the activity cannot reproduce and how to address in discussion.

  Let's break down the design step by step.

  ### Step 1: The Four Lives
