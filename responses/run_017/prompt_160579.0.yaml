  Life D: Financial Security (Medium), Artistic Achievement (Medium), Love and Friendship (Medium), Moral Impact (High)

  But note: We have four values and four lives. Let's assign the "peak" to each:
  - Life A: Financial Security (High)
  - Life B: Artistic Achievement (High)
  - Life C: Love and Friendship (High)
  - Life D: Moral Impact (High)

  Now, for the other values, we assign non-High to avoid dominance. We also want that no life is dominated by any other. So:

  - Life A: Financial Security: High, Artistic: Low, Love: Medium, Moral: Medium
  - Life B: Financial: Medium, Artistic: High, Love: Low, Moral: Medium
  - Life C: Financial: Low, Artistic: Medium, Love: High, Moral: Medium
