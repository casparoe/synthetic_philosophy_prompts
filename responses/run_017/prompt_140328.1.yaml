prompt: |-
  I teach an upper-level seminar on the philosophy of physics, and I am drafting this year's final take-home. The last third of the course was devoted to the thermodynamics of computation: the one-molecule engine, the thesis that information is physical, and the standard exorcism in which the demon is charged a fixed thermodynamic price per bit for acquiring and then disposing of the result of each cycle, so that the second law survives intact. Every student can reproduce that narrative, and I want a question that makes reproducing it useless.

  Please write for me: the question itself, as it would appear on the exam; a model answer of roughly 700 words; and a marking scheme out of 25.

  Build the question around a case I will call the heirloom demon. Describe it in full in the question text, so that the question is self-contained and closed-book: a gas in a container at equilibrium at temperature T; a demon running the usual cycle of inserting a partition, exploiting knowledge of which side the molecule is on, and extracting work as it expands against a piston. Then the variant: there exists, as a brute and unexplained initial condition, a register of N bits, each of which is already perfectly correlated with which side the molecule will occupy on the corresponding cycle. The demon performs no measurement, prepares nothing, and erases nothing; it simply consults the next bit of a register whose correlations with the gas were given at the outset, and operates the piston accordingly.

  The crux I want the question to force is this. Something is given for free in the heirloom case, and something is given for free in the standard case too: a supply of blank memory, an apparatus in a ready state, a demon with an uncorrupted memory, a correlation between record and gas. So the question is whether the difference between the two demons is one of kind or merely of staging. If it is merely of staging, then every exorcism works by locating an assumed low-entropy resource, and the student must say whether that vindicates the information-theoretic account or hollows it out: does the accounting in bits do any work that a plain thermodynamic audit of resources would not do, or is it an illuminating redescription of a constraint we could have stated without it? If it is a difference of kind, the student must say what the extra ingredient is and why measurement or erasure, as opposed to mere correlation, carries a thermodynamic price.

  I also want the question to make the student take a stand on whether the price-per-bit principle is an independent physical premise or a corollary of the second law itself. Ask what would count as a non-question-begging derivation of it, and ask what follows for the exorcism if it turns out to be a corollary: is the argument then circular, and if so is the circularity vicious, or does the second law survive by some other route? Do not let the student settle this by naming positions or citing literature; the question should be answerable, and gradeable, by someone who has never read a word of the secondary literature, and no mark should depend on knowing who argued what. Elementary bookkeeping in terms of Shannon entropy and the constant kT ln 2 is fine; anything beyond that should not be required.

  For the marking scheme, give five must-hit points with the marks each is worth, totalling 25, and for each point a one-line note on the characteristic way students get it wrong — for instance, debiting a cost to the demon without identifying which physical system's entropy is supposed to fall, treating information as a stuff that gets converted into work, or answering the heirloom case by stipulating that the register must have cost something to prepare when that is precisely what is in dispute. Include a note on what separates an A from a B: my intention is that the A answer uses the heirloom case to reach a verdict about the standard case, while the B answer treats the two side by side and never draws the moral. The scheme should also say how to credit a rigorously argued answer that reaches the opposite verdict to the model answer's, since I would rather reward the argument than the conclusion.

  Finally, after the marking scheme, add about 100 words sketching the answer a well-prepared but uncomprehending student would give: the fluent, correct-sounding, entirely derivative response that this question is designed to make unprofitable.
reasoning: |-
  We are constructing an exam question that forces students to think beyond the standard narrative of Maxwell's demon exorcism. The scenario involves the "heirloom demon" which has a pre-existing correlated register. The key issue is whether the thermodynamic cost in the standard case (measurement and erasure) is fundamentally different from the heirloom case (using pre-existing correlation) and what this implies for the information-theoretic account.

  Question Text:

  ---

  **Question 3: The Heirloom Demon (25 points)**

  Consider a container of gas at equilibrium at temperature T. The gas consists of a single molecule. A demon operates a cycle that extracts work from the thermal motion of the molecule. The cycle consists of the following steps:

  1. The demon inserts a partition dividing the container into two equal volumes, left and right.
  2. The demon, by knowing the position of the molecule (whether it is in the left or the right side), can extract work by coupling the partition to a piston. Specifically, if the molecule is on the left, the demon allows the gas to expand isothermally by moving the piston on the right, and similarly if on the left. This expansion extracts work equal to \( kT \ln 2 \) per cycle.

  In the standard Maxwell's demon scenario, the demon must measure the position of the molecule and later erase the record of that measurement to reset its memory, and it is argued that the erasure incurs a thermodynamic cost of at least \( kT \ln 2 \) per bit, thus saving the second law.

  Now consider a variant, the "heirloom demon". In this case, there exists, as a brute and unexplained initial condition, a register of N bits (where N is large). Each bit in this register is already perfectly correlated with the side (left or right) that the molecule will occupy in the corresponding cycle. The demon does not perform any measurement, does not prepare any memory, and does not erase any memory. At the beginning of each cycle i, the demon consults the i-th bit of the register and then operates the piston accordingly. The register is not altered by the demon and remains as it was initially.

  (a) Explain why the heirloom demon can operate without performing any measurement or erasure and yet extract work in each cycle. (5 points)

  (b) In the standard exorcism, the demon is charged a cost for measurement and erasure. In the heirloom case, there is no such cost. Does this difference represent a fundamental distinction between the two setups, or is it merely a matter of when and where the low-entropy resources are provided? Justify your answer. (10 points)

  (c) The "price-per-bit" principle (that each bit of information acquired and then erased costs at least \( kT \ln 2 \)) is central to the standard exorcism. Is this principle an independent physical law, or is it a corollary of the second law of thermodynamics? If it is a corollary, then does the standard exorcism argument become circular? If it is independent, then what kind of evidence could non-circularly establish it? (10 points)

  ---

  Model Answer (approx. 700 words):

  (a) The heirloom demon exploits a pre-existing correlation between the register and the gas. At the beginning of each cycle i, the state of the i-th bit in the register is already correlated with which side the molecule will be on during that cycle. The demon simply reads the bit and uses it to set the piston appropriately. Since the correlation is perfect, the demon can extract the maximum work of \( kT \ln 2 \) per cycle. No measurement is required because the correlation is already present, and no erasure is performed because the register is left unchanged and is not reset. The register remains as it was, so there is no need to erase and reinitialize it for the next cycle.

  (b) The difference between the two demons is not fundamental but rather a matter of staging. In both cases, the ability to extract work depends on the presence of a low-entropy resource. In the standard demon, the low-entropy resource is the blank memory (or the reset state of the apparatus) at the start of each measurement, and the erasure step is necessary to return the memory to that low-entropy state for reuse. In the heirloom demon, the low-entropy resource is the pre-existing correlated register. The register, by being correlated with the gas, is in a low-entropy state relative to the gas. The thermodynamic cost in the standard case is the erasure cost to reset the memory, which is necessary to make the memory reusable. In the heirloom case, the register is not reset and is used only once per bit (each bit is used for one cycle and then left as is). The key point is that the low-entropy resource is consumed in both cases: in the standard demon, the blank memory is used and then reset at a cost, while in the heirloom demon, the pre-correlated register is used up (each bit is used once and not reused). Therefore, the difference lies in when the low-entropy resource is provided and how it is maintained, not in the fundamental mechanism.

  This observation has implications for the information-theoretic account. The accounting in bits does not add new physical constraints but provides a redescription of the thermodynamic resource. The bit-based accounting is illuminating because it identifies the minimum thermodynamic cost (via the Landauer principle) for erasing a bit, which is a common operation in computation. However, the underlying constraint is the second law: any decrease in entropy in one place must be compensated by an equal or greater increase elsewhere. The bit-based accounting is a way to track this in information-processing terms, but it does not introduce a new independent principle.

  (c) The price-per-bit principle (Landauer's principle) is not an independent physical law but a corollary of the second law. It can be derived from the second law by considering the minimal entropy increase required when resetting a bit to a standard state. Specifically, erasing one bit of information (which reduces the memory from two possible states to one) must dissipate at least \( kT \ln 2 \) of heat to the environment to satisfy the second law. Therefore, the principle is a consequence of the second law.

  In the standard exorcism, if we use the price-per-bit principle to save the second law, the argument is circular because the principle is derived from the second law. However, the circularity is not vicious. The exorcism does not aim to prove the second law from scratch but to show that the demon does not violate it. The price-per-bit principle provides a mechanism by which the second law is enforced. The circularity is at the level of accounting: we use the second law to derive the cost of erasure, and then we show that including that cost restores the entropy balance. This is consistent and non-vicious because it shows that the second law holds when all processes (including information processing) are accounted for. The exorcism demonstrates that the second law is not violated by the demon when the full system (including the demon's memory) is considered.

  If we did not have the price-per-bit principle, we could still perform a thermodynamic audit. We would note that the demon's memory must be reset to a standard state to be reused, and that reset operation, by the second law, must increase entropy by at least \( kT \ \ln 2 \) per bit. So the second law survives by requiring that we account for all systems, including the information-bearing ones.

  Thus, the heirloom demon case reinforces that the core issue is the management of low-entropy resources. In both demons, the second law is saved by accounting for the entropy changes in all parts of the system. The information-theoretic account is a useful redescription but does not replace the thermodynamic audit.

  ---

  Marking Scheme (out of 25):

  Must-hit points:

  1. **(a) Explanation of heirloom demon operation (5 points):** 
     - Correctly states that the demon uses pre-existing correlation without measurement or erasure. (3 points)
     - Notes that the register is not altered and thus no erasure occurs. (2 points)
     - *Common mistake:* Claiming that the demon still has to "read" the bit and thus incurs a measurement cost, or that the register must be reset.

  2. **(b) Fundamental distinction or staging? (10 points):**
     - Argues that the difference is one of staging (i.e., when the low-entropy resource is provided) and not fundamental. (4 points)
     - Identifies the low-entropy resource in both cases: blank memory in standard demon, pre-correlated register in heirloom. (3 points)
     - Discusses the implication for the information-theoretic account: either that it is a redescription or that it does not add new constraints. (3 points)
     - *Common mistake:* Treating the heirloom register as having no cost without explaining the initial correlation as a low-entropy resource, or claiming that the standard demon's cost is fundamentally different because it involves "information" as a distinct entity.

  3. **(c) Status of price-per-bit principle and circularity (10 points):**
     - States that the price-per-bit principle is a corollary of the second law. (2 points)
     - Explains how the principle is derived from the second law (erasure as a reset operation that must increase entropy). (3 points)
     - Addresses circularity: argues that the exorcism is not viciously circular because it is an accounting exercise that shows consistency with the second law. (3 points)
     - Notes that without the principle, a thermodynamic audit would still enforce the second law. (2 points)
     - *Common mistake:* Claiming the principle is independent without justification, or asserting that circularity invalidates the exorcism without addressing the non-vicious nature.

  Additional Notes:
  - **A vs. B:** An A answer uses the heirloom case to draw conclusions about the standard case (e.g., showing that both rely on low-entropy resources and that the information accounting is a redescription). A B answer treats the two cases separately without connecting them or drawing the moral about the information-theoretic account.
  - **Opposite Verdict:** If a student argues that there is a fundamental difference (e.g., that measurement or erasure carries an irreducible cost not present in mere correlation), they must provide a clear justification (e.g., that measurement involves an interaction that necessarily dissipates heat). If such an argument is rigorous and addresses the staging point, it should be awarded full marks for the relevant parts.

  ---

  Sketch of a Well-Prepared but Uncomprehending Answer (approx. 100 words):

  The standard demon must measure the molecule's position and then erase the memory, costing \( kT \ln 2 \) per bit. In the heirloom case, the demon doesn't measure or erase, so it doesn't pay that cost. But the register had to be prepared at some point, so the cost was paid earlier. Therefore, the second law is saved in both cases. The price-per-bit principle is an independent law, and it is necessary to explain the thermodynamic cost of information processing. Without it, the demon would violate the second law, so the principle is fundamental and not circular.

  *Why it's uncomprehending:* It invokes the cost of preparing the register (which is not part of the setup and is in dispute). It does not address whether the information-theoretic account is a redescription or fundamental. It asserts the independence of the price-per-bit principle without justification and misses the circularity issue.
answer: |-
  ### Exam Question: The Heirloom Demon (25 points)  
  **Background:** A single-molecule gas is in equilibrium at temperature \(T\) in a container. A demon operates a cycle to extract work:  
  1. Insert a partition, dividing the container into left and right halves.  
  2. Exploit knowledge of the molecule’s side (left/right) to perform isothermal expansion against a piston, extracting \(kT \ln 2\) of work per cycle.  
  In the standard Maxwell’s demon exorcism, the demon *measures* the molecule’s position (costing energy to acquire information) and later *erases* the memory (costing \(kT \ln 2\) per bit to reset), preserving the second law.  

  **The Heirloom Demon Variant:** At the initial time, there exists a fixed register of \(N\) bits, each perfectly correlated with which side the molecule will occupy in the corresponding future cycle (e.g., bit \(i = 0\) means “left in cycle \(i\)”). The demon performs *no measurement* (it does not acquire new information) and *no erasure* (it does not reset or alter the register). It simply reads the next bit in the register and operates the piston accordingly. The register’s correlations are given as a brute initial condition.  

  **Questions:**  
  (a) Explain how the heirloom demon extracts work without violating the second law, despite performing no measurement or erasure. (5 points)  
  (b) Is the difference between the standard demon (charged for measurement/erasure) and the heirloom demon (charged nothing) a fundamental distinction, or merely a difference in how low-entropy resources are staged? Justify your answer. Discuss the implications for whether “information-theoretic accounting” (in bits) provides unique insight beyond a thermodynamic audit of entropy. (10 points)  
  (c) The “price-per-bit” principle (cost \(kT \ln 2\) per bit for erasure) is central to standard exorcisms. Is this principle an independent physical law, or a corollary of the second law? If it is a corollary, does this make the standard exorcism circular? If circular, is the circularity vicious? If independent, what non-question-begging evidence could establish it? (10 points)  

  ---

  ### Model Answer (≈700 words)  
  **(a)** The heirloom demon extracts work without measurement or erasure because the register’s bits are *pre-correlated* with the gas’s future states. For each cycle, the demon reads a bit that already specifies the molecule’s side, allowing it to configure the piston correctly and extract \(kT \ln 2\) of work. No measurement is needed because the correlation exists *a priori*; no erasure occurs because the register is not reset or modified—it remains in its initial correlated state. The second law is preserved because the work extraction reduces the gas’s entropy by \(k \ln 2\) per cycle, but this is offset by the register’s entropy: initially, the \(N\)-bit register has near-zero entropy (since it is perfectly correlated with the gas’s future states), and after \(N\) cycles, its entropy remains unchanged (no erasure). Thus, the system’s total entropy stays constant during work extraction, satisfying the second law.  

  **(b)** The difference is **merely one of staging**, not fundamental physics. Both demons rely on low-entropy resources:  
  - In the **standard demon**, the resource is a *blank memory* (initialized in a low-entropy “ready” state). Measurement correlates the memory with the gas, enabling work extraction. Erasure then resets the memory to its blank state at a cost of \(kT \ln 2\) per bit, dissipating heat to increase environmental entropy.  
  - In the **heirloom demon**, the resource is the *pre-correlated register*. Work extraction consumes the register’s initial low entropy (as correlations are “used up” cycle by cycle), but no erasure is needed because the register is not reused.  

  The thermodynamic cost arises from the *provision and maintenance* of low entropy, not from measurement/erasure as intrinsically costly acts. Information-theoretic accounting (in bits) does **no unique work** beyond a thermodynamic audit. The “price per bit” (\(kT \ln 2\)) quantifies the minimal entropy increase needed to reset a memory, but this is derivable from the second law via Landauer’s principle. Stating that “erasure costs \(kT \ln 2\) per bit” is just a redescription of the thermodynamic constraint: low-entropy states are required for work extraction, and their creation/maintenance has an entropy cost. The heirloom demon shows that information is not a special “substance”—it is the underlying low-entropy resource that matters. Thus, the bit-based accounting is illuminating but not fundamental; a thermodynamic audit of entropy changes in all systems (gas, memory, environment) suffices.  

  **(c)** The price-per-bit principle is a **corollary of the second law**, not independent. Landauer’s principle derives it: erasing one bit reduces a memory’s microstates from two possibilities to one, decreasing its entropy by \(k \ln 2\). To avoid violating the second law, this entropy decrease must be offset by an increase elsewhere (e.g., heat dissipation \(\geq kT \ln 2\)). Thus, the principle follows from the second law.  

  This makes the standard exorcism **circular but not viciously so**. The exorcism assumes the second law to derive the cost of erasure, then uses that cost to show the demon does not violate the second law. However, the circularity is **benign** because it is an *explanatory* loop, not a *logical* one. The exorcism demonstrates *how* the second law is enforced for information-processing systems: by including memory entropy in the accounting. Crucially, **the second law survives independently**: even without invoking bits, a thermodynamic audit would reveal that resetting a memory requires compensating entropy generation. The heirloom demon reinforces this—it shows that erasure is not inherently special; it is one way to manage low-entropy resources. If the price-per-bit principle were independent, non-question-begging evidence might come from direct experiments (e.g., measuring heat dissipation in nanoscale memory reset). But since it is derivable from the second law, such evidence merely confirms the derivation.  

  In sum, both demons conserve total entropy. The heirloom case underscores that the core physics is entropy conservation, with information providing a useful lens but no new substance.  

  ---

  ### Marking Scheme (25 points total)  
  **Must-hit points (with common mistakes):**  
  1. **Part (a): Explains heirloom operation without measurement/erasure (5 points)**  
     - 3 pts: Notes pre-existing correlation allows work extraction without measurement.  
     - 2 pts: States no erasure occurs because the register is unaltered.  
     - *Common mistake (0 pts):* Claims the demon "measures" the register or that erasure is "implied."  

  2. **Part (b): Identifies staging difference and implications for information accounting (10 points)**  
     - 4 pts: Argues difference is staging (low-entropy resource given upfront vs. reset periodically).  
     - 3 pts: Compares resources (heirloom: pre-correlated register; standard: blank memory needing reset).  
     - 3 pts: Concludes bit-accounting is descriptive, not fundamental (no unique insight beyond entropy audit).  
     - *Common mistake (−3 pts):* Asserts the register "must have cost energy to prepare" (violates closed-book setup) or treats information as a physical substance.  

  3. **Part (c): Addresses status of price-per-bit and circularity (10 points)**  
     - 3 pts: States principle is corollary of second law (via Landauer).  
     - 3 pts: Explains why exorcism is circular but not vicious (shows *how* second law is enforced).  
     - 2 pts: Notes second law survives via thermodynamic audit without bits.  
     - 2 pts: Discusses non-question-begging evidence if independent (e.g., experiments).  
     - *Common mistake (−3 pts):* Calls circularity "fatal" or asserts principle is independent without justification.  

  **Grading standards:**  
  - **A (21–25 pts):** Uses heirloom demon to critique the standard case (e.g., showing both reduce to entropy conservation). Draws explicit implications for information-theoretic accounts.  
  - **B (16–20 pts):** Treats demons side-by-side but fails to connect them (e.g., lists differences without synthesizing "staging" moral).  
  - **Opposite verdict credit:** Full marks if student argues for a *fundamental* distinction (e.g., measurement intrinsically dissipates heat) and rigorously justifies it (e.g., via quantum limits), provided they engage with staging and entropy.  

  ---

  ### Uncomprehending Derivative Response (≈100 words)  
  "The standard demon pays \(kT \ln 2\) per bit for erasure to save the second law. The heirloom demon avoids this cost by using a pre-correlated register, but that register must have been prepared earlier, so the cost was paid upfront. Thus, the second law holds in both cases. The price-per-bit principle is an independent law of physics, proven by Landauer. Without it, the demon would violate thermodynamics. The exorcism isn’t circular because information is physical and erasure has a fixed cost."  

  **Why it fails:** Repeats standard narrative without engaging the "staging" critique; invokes preparation cost (disputed in heirloom setup); asserts information's physicality without justifying why bit-accounting is fundamental; misses circularity discussion.
