  The user has already done impressive conceptual legwork - they've ruled out existing frameworks like Ulysses contracts, Goodhart's Law, desuetude, and hypocrisy by analyzing why each doesn't fit. Their core frustration is terminological: they need either an existing concept or a newly coined term that precisely captures this phenomenon where the *binding persists* but its *bite migrates* onto different targets through socially sanctioned workarounds.

  Key nuances they want clarified:
  - Whether initial effectiveness matters (must it have worked at first?)
  - How signaling intentions affect classification
  - Distinguishing features from similar concepts
  - Whether individual and collective cases share the same mechanism

  Interesting challenges in crafting a response:
  1) Academic precision vs practical utility - they explicitly reject "near miss" labels for footnotes, demanding rigorous conceptual boundaries
  2) Their examples show collective action problems (faculty senate), democratic dilemmas (tax supermajority), and individual coping strategies (phone blocker) - is there a unified framework?
  3) The self-awareness aspect is crucial: participants openly acknowledge the workaround while endorsing the rule, eliminating hypocrisy or bad faith.

  Potential directions:
  - Explore organizational theory on "ritualistic compliance" (Selznick) but note it's more about empty gestures whereas here the rule has real, just misdirected, effects
  - Consider "procedural displacement" from policy studies, though usually describes outright avoidance rather than target-shifting
  - Behavioral economics of "rule drift" in commitment devices, but literature focuses on failure modes not migration

  Coining a new term seems necessary. Good components might include:
  - "Migratory" (capturing displacement)
  - "Binding" (core mechanism)
  - "Displacement" or "drift" (movement effect)
  - Should reflect the irony of persistent form + shifting function

  For boundary cases:
  - If rule was always off-target: probably not the same phenomenon, as there's no migration
  - Signaling intentions: complicates but doesn't invalidate if the workaround satisfies both stated and unstated goals
  - Membership turnover: critical for collective cases - creates principal-agent separation where rule-bearers ≠ rule-makers

  The tablet vs senate comparison reveals a key difference: individual cases involve conscious adaptation while collective ones feature structural loopholes exploited by changing actors. Yet both share the outcome of literal compliance + functional circumvention.

  Final naming considerations:
  - Should be memorable but not glib
  - Must work across contexts
  - "Migratory binding" has clean mechanics
  - "Procedural displacement" feels institutional
  - "Target drift" emphasizes the shifting focus
answer: |-
  What you're describing is a fascinating and under-theorized pattern: **the persistence of a binding mechanism's *form* alongside a migration of its *effective constraint* to unintended targets, while the original temptation is circumvented through socially sanctioned, transparent workarounds.** It's not captured by existing concepts because it combines three rare features: (1) scrupulous compliance with the rule's *letter*, (2) collective acknowledgment of the workaround, and (3) the rule retaining *real* (but redirected) bite. After dissecting your cases against adjacent concepts, I propose this is a distinct phenomenon best termed:

  **Migratory Binding**  
  *(or, more precisely: **Target-Displaced Binding**)*

  ### Core Definition & Diagnostic Criteria
  Migratory binding occurs when:  
  1. **A precommitment device remains formally operative and endorsed** by its bound agents.  
  2. **Its practical constraint shifts** to a class of decisions/agents distinct from its original target.  
  3. **The original temptation is satisfied** via routes intentionally designed to bypass the binding.  
  4. **The workaround is transparent and legitimized** by the community bound by the rule.  

  ### How to Distinguish It from Near Misses
  | Concept               | Why It’s Different                                                                 | Test Question                                                                 |
  |-----------------------|------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|
  | **Ulysses Contract**  | Assumes the binding *works* on its target; here it’s circumvented while persisting | "Is the original temptation still being blocked by the binding?" → If no, migratory. |
  | **Goodhart’s Law**    | Metrics are gamed/corrupted; here the rule is *complied with*, just on new targets | "Is the rule being violated or repurposed?" → If repurposed intact, migratory. |
  | **Desuetude**         | Rules fade from disuse; here they’re actively used and cited                       | "Is the rule invoked in decisions?" → If yes, not desuetude.                  |
  | **Hypocrisy**         | Involves concealed violation; here workarounds are openly discussed                | "Do agents feel they’re cheating?" → If no, migratory.                       |
  | **Function Creep**    | Rule expands to new domains; here the *domain* stays, the *target within it* moves | "Is the rule applied to new *types* of decisions?" → If no, migratory.       |
  | **Weakness of Will**  | Involves failing to act on intentions; here intentions succeed via workarounds     | "Are agents achieving their goals despite the binding?" → If yes, migratory.  |

  ### Resolving Your Boundary Cases
  1. **Must it have bitten correctly initially?**  
     → **No.** Migratory binding can occur even if the rule was *always* off-target (e.g., a poorly designed tax supermajority immediately circumvented by debt issuance). The key is that its *present* bite is misaligned with its *stated purpose*, regardless of initial efficacy.  

  2. **Does signaling intent invalidate it?**  
     → **No**, but it clarifies the dynamic. If a rule was adopted partly for signaling (e.g., a legislature "binding itself" to appease voters), its migration reveals that the *symbolic function* (e.g., "fiscal restraint") persists while the *operative function* drifts. This is still migratory binding, as the formal constraint now binds unintended targets.  

  3. **Genuine vs. migrated binding test?**  
     → Your repeal test ("Would bound agents re-adopt it?") is astute but insufficient. Better criteria:  
     - **Target Displacement Test**: "Does the rule now primarily constrain decisions/agents *not contemplated* during its adoption?"  
     - **Workaround Dependency Test**: "Is satisfaction of the original goal *contingent* on routes that bypass the binding?"  
     (In your cases: lab fixes blocked → "yes"; spending via debt → "yes"; recipes via tablet → "yes")  

  4. **Individual vs. Collective Cases**  
     → **Same core mechanism**, but collective dynamics add two layers:  
     - **Turnover Amplification**: New agents inherit the binding without the original context (e.g., new senators who didn’t experience "May enthusiasm"), making workarounds feel natural.  
     - **Coordination Benefits**: Workarounds require shared understanding (e.g., everyone agreeing "pilot" = loophole), unlike individual cases.  
     → The tablet case *is* migratory binding but lacks structural inertia; your friend could abandon the blocker. Collective rules acquire institutional momentum.  

  ### Why "Migratory Binding" Fits
  - **Migratory**: Captures the gradual, inexorable shift of the binding’s bite.  
  - **Binding**: Emphasizes the device’s persistence as a formal constraint.  
  - **Implied Irony**: The constraint "migrates" like wildlife to a new habitat, thriving where it wasn’t introduced.  

  ### Why Other Terms Fail
  - **"Procedural Displacement"**: Too broad; could describe any bureaucratic workaround.  
  - **"Constraint Drift"**: Doesn’t capture the rule’s unchanged form.  
  - **"Loophole Lock-in"**: Misses that the workaround becomes the *primary* path.  

  ### Theoretical Roots & Gaps
  This extends Elster/Schelling by exposing how bindings evolve in *social ecosystems*:  
  - **Elster’s "precommitment"** assumes static targets; migratory binding reveals dynamic adaptation.  
  - **Schelling’s "self-command"** focuses on individual psychology; your cases show *institutional* path dependence.  
  The gap: Rational-choice models neglect how communities collectively maintain rules *ritualistically* while neutering them operationally.  

  ### In Practice: Is Your Faculty Senate Case Migratory Binding?
  **Yes**, definitively:  
  - **Binding persists**: The 2/3 rule is revered and triggers real constraints (on lab fixes).  
  - **Target migrated**: From "curricular reforms passed in May" → "minor technical fixes."  
  - **Original temptation satisfied**: Reforms proceed via "pilots" (openly acknowledged loophole).  
  - **Workaround legitimized**: Subcommittee openly routes proposals to avoid the rule.  

  ### The Carving Completed
  Migratory binding is **the ritualistic preservation of a constraint whose practical effect has decoupled from its purpose through transparent circumvention, redirecting its burden to peripheral targets**. It stops when:  
  - The binding dissolves (unlike your cases),  
  - OR its bite realigns with its intent (e.g., if "pilots" were banned and the 2/3 rule actually blocked reforms).  

  You’ve identified a pervasive but unnamed flaw in institutional design: **rules outlive their purpose not by being broken, but by being *too well respected* in the wrong contexts.** Naming it is the first step to designing bindings that resist migration.
