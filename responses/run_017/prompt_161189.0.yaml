prompt: |-
  I should say at the outset that I have no academic training in history or philosophy; I work in logistics and spend my evenings on a volunteer project transcribing and indexing the parish registers of one English county (baptisms, marriages and burials, roughly 1650 to 1900). Years of handling that material have pushed me into the modernist camp on nations: the view usually associated with Hobsbawm and Anderson, on which belonging to a nation — a large, bounded community of people you will never meet, who share a deep history and a claim to political self-rule — is a comparatively recent artifact, assembled over roughly the last two centuries out of state administration, mass schooling, vernacular print markets, conscription and censuses, rather than inherited from the Middle Ages or from antiquity. On this view the apparent antiquity of nations is mostly retrofitting:recent practices dressed up as immemorial ones, and a selective story told about whatever linguistic or ethnic raw material happened to be lying around.

  I want to know what would count against this. I am not after authors or sources; I want the shape of my own exposure.

  Three of the tests I have invented for myself, because they are the ones I could in principle read off my own material:

  1. The marriage-distance test. If nationhood is a state-built artifact, then before the modern period the distance between a bride's and a groom's home parish should be organized by walking distance, market geography and confession, and should ignore entirely the lines that later become national borders. After the railways, the school and the border arrive, marriage distances should widen along the state's infrastructure, not along any older community. What I take to be the dangerous result for me: sharp discontinuities in pre-modern marriage patterns running exactly along lines that later become national borders, with no river, upland, dialect boundary or confessional divide underneath them.

  2. The unprompted-label test. Registers and court records record how people were described by their neighbours when no official was asking: of this parish, sojourner, stranger, and occasional ethnic or national designations. My view predicts that national-sounding labels should be rare, elite and situational before the modern period, and common and spontaneous afterwards. What pattern here would actually sink me, and what pattern would I be entitled to explain away as mere ethnicity rather than nationhood?

  3. The uptake-speed test. When a state first starts counting, schooling and conscripting a population under a new national description, how long until ordinary people apply that description to themselves without being prompted? A generational lag looks like construction; immediate, enthusiastic uptake looks more like recognition of something already there. I am unsure how much of a difference in timing my view really requires.

  Beyond these, I would like the defeaters ranked from fatal to merely awkward, and I want to know specifically which of them a convinced modernist would concede as counting against the view, and which they would reclassify and dismiss. I also have a nagging worry that the view has been qualified into unfalsifiability: its defenders often say that of course there was older ethnic material, but that nations proper are modern. Is that a principled distinction or a retreat, and if the view turns out to be well insulated, is that a defect for a claim of this kind or a sign that it has simply won? Please also say what the view predicts that its rivals do not — about secession, about how stable very new states should be, and about what should happen to national attachment once a state stops teaching the story. The thing I would personally find most moving is the mirror image of my own case: nation-building projects that had the full machinery available and still failed to take. If such failures are common where the machinery was strong, something pre-existing is doing work I am not crediting.

  Please write in American English, and close with a machine-readable line of the form \answer{...} containing exactly one of the labels EXPOSED, PARTLY EXPOSED or WELL INSULATED — meaning respectively that at least one realistic finding would decisively sink the view as I have stated it; that several findings would force substantial revision but not abandonment; or that no realistic finding could sink it, because it can absorb every qualification thrown at it. Then add a final line beginning Verdict: naming, in one sentence, the single thing you would look for first if you were sitting where I am, with the parish registers in front of you.
reasoning: |-
  Hmm, the user has shared their background as a non-academic working on parish registers, and they've developed a modernist view of nations based on their transcription work. They've created three tests to evaluate this view: marriage-distance patterns, unprompted labeling in records, and uptake speed of national identities. They want to know what evidence could challenge their position, how to rank counterevidence, and whether their view has become unfalsifiable. They also ask about predictions their view makes compared to alternatives, and they're particularly interested in failed nation-building projects.

  I need to carefully consider their framework. The marriage-distance test focuses on whether pre-modern marriage patterns show discontinuities along future national borders without geographic or religious explanations. The unprompted-label test examines spontaneous national identifiers in records before state promotion. The uptake-speed test looks at how quickly people adopt national identities when states introduce them.

  For counterevidence, I'll organize it from fatal to awkward. Fatal would be pre-modern evidence showing explicit national consciousness without state involvement. Strong would be evidence of national identity formation independent of state machinery. Awkward would be ambiguous cases that don't clearly contradict but require explanation.

  The modernist view does make distinct predictions: that secession movements should correlate with state institutions, new states should be fragile without nation-building, and national attachment should fade without state reinforcement. Failed nation-building projects despite strong institutional efforts would be particularly challenging evidence for modernism.

  On the unfalsifiability concern, I'll acknowledge that the ethnic/national distinction can be blurry, but it's not entirely ad hoc if defined by mass political consciousness. Still, I'll suggest ways to test this boundary.

  For the verdict, I need to balance the view's resilience with potential vulnerabilities. The most accessible test from parish registers would be marriage patterns showing pre-existing discontinuities at future borders. I'll recommend starting with that.

  Finally, I'll format the answer as requested, ending with \answer{...} and a Verdict statement.
answer: |-
  Based on your deep engagement with the material and the specific tests you've devised, here's how potential counter-evidence stacks up against the modernist view, ranked by severity and incorporating your framework:

  ### Fatal Defeaters (Would decisively sink the core claim that nationhood is *entirely* a recent artifact of state machinery)
  1.  **Pre-Modern National Self-Consciousness in Action:** Evidence from your registers/court records (unprompted-label test) showing *ordinary, non-elite* individuals *routinely* using national labels (e.g., "English," "French," "Scot") to describe *themselves* or their *political community* in contexts unrelated to state demands (e.g., disputes, wills, local petitions, personal notes within registers) *before* the advent of mass schooling/print/conscription (say, pre-1750). This demonstrates mass political identity exists independent of the state's modern toolkit. A modernist *must* dismiss this as mere "ethnicity" – but if the labels used are explicitly political/territorial (referencing kingdom/crown/common cause) and widespread among commoners, that dismissal becomes untenable.
  2.  **Immediate, Mass Uptake of New National Identity (Uptake-Speed Test):** When a new state imposes a national identity (e.g., post-Revolution France, post-unification Germany/Italy), evidence showing the *majority* of the population in your registers (e.g., in self-descriptions, marriage patterns ignoring old borders instantly, burial practices) adopting and using this new national label *spontaneously and consistently within a single generation (20-30 years)*, without the state's nation-building machinery (schools, mass media, conscription) being fully established or effective. This suggests a pre-existing latent identity was activated, not constructed from scratch. Modernism predicts a lag correlating with the *reach and duration* of state institutions.

  ### Strong Defeaters (Force major revision, suggesting pre-modern roots are *causally significant*, not just raw material)
  3.  **Persistent Pre-Modern Border Effect (Marriage-Distance Test):** Finding sharp, statistically significant discontinuities in marriage distances *exactly* along lines that later became national borders *centuries before* railways/schools, persisting despite:
      *   No significant geographic barrier (river, mountain).
      *   No confessional divide (same religion either side).
      *   Minimal dialect difference (mutual intelligibility).
      *   Integrated market geography (shared trade routes/fairs).
      This indicates a pre-existing socio-political boundary *functioning like a proto-national border* for ordinary people's life choices, ignored only at your peril. Modernism predicts borders emerge *with* the state infrastructure.
  4.  **Failed Nation-Building Despite Full Machinery:** Cases where a state applied the full modernist toolkit (centralized administration, standardized schooling, census, conscription, print capitalism) vigorously and consistently over multiple generations *but failed* to create a stable, widely embraced national identity among the targeted population. Your registers would show persistent local/regional/confessional identities dominating (unprompted labels), marriage patterns ignoring the new borders, and resistance to the national label (uptake test shows rejection or indifference). If common where the machinery *was* strong, it implies the "raw material" was actively resistant or an alternative identity was too strong. Modernism predicts the toolkit *should* work if applied effectively.
  5.  **Rapid Secession/Resistance Based on Pre-Modern Identity:** Evidence that secessionist movements or mass resistance to imperial/foreign rule *succeeded quickly* based on mobilizing an identity using pre-modern ethnic/linguistic/historical tropes *before* the modern state machinery could be established locally. This suggests the pre-modern identity had inherent, politically mobilizing power. Modernism predicts secession requires the prior existence or rapid construction of modern national institutions/consciousness.

  ### Awkward Defeaters (Require explanation/qualification but don't sink core)
  6.  **Elite Use of National Labels (Unprompted-Label Test):** Frequent use of national labels by elites (gentry, clergy, merchants) in pre-modern records, *even if situational* (e.g., in diplomacy, law, chronicles). Modernism can dismiss this as "not mass" or "situational," but pervasive elite usage provides the cultural framework later exploited.
  7.  **Slow Fade After Machinery Stops:** Evidence that national identity persists strongly for many generations *after* the state stops actively promoting it (e.g., post-colonial settings, regime collapse). Modernism predicts fading, but persistence can be explained by institutional inertia or new actors taking up the narrative. Only rapid, *voluntary* abandonment by the masses would be strongly counter.
  8.  **Pre-Modern Ethnic Labels with Political Edge (Unprompted-Label Test):** Frequent use of ethnic/linguistic/regional labels ("Saxon," "Fleming," "Welshman") in your records in contexts implying political allegiance or conflict *among ordinary people*. Modernism distinguishes "ethnicity" from "nation," but a clear, consistent link undermines the sharpness of that distinction for the modernist argument. It forces the concession that politically potent ethnic identities existed.

  **Concessions & Insulation:** A convinced modernist would likely concede fatal defeaters (1 & 2) as counting against the view. They would reclassify defeaters involving elite usage (6) or pre-modern ethnic labels (8) as evidence of "raw material" or "proto-nationalism," not nationhood proper. They might explain pre-modern border effects (3) as arising from *older state structures* (duchies, kingdoms, bishoprics) or deep confessional divides masquerading as national ones. Failed nation-building (4) might be attributed to *incompetent* or *inconsistent* application of the toolkit, or overwhelming countervailing forces (e.g., brutal repression). The "ethnic vs. nation" distinction is the key insulator. If defined *principally* as mass, popular, sovereign political consciousness, it *can* become somewhat unfalsifiable, as any pre-modern evidence can be deemed not "mass" enough or not properly "political." However, your tests (especially 1 & 2 applied rigorously to ordinary people) probe precisely this boundary. Finding *mass* evidence of *political* self-identification using national terms pre-modernity would break the insulation.

  **Modernist Predictions vs. Rivals (Primordialism/Perehnialism):**
  *   **Secession:** Successful secession requires prior development of national consciousness *through* modern institutions or their deliberate construction by separatists. It shouldn't emerge spontaneously from "ancient" identities alone.
  *   **Stability of New States:** Very new states (post-colonial, post-imperial) *without* effective nation-building machinery should be highly unstable, prone to fragmentation along older regional/ethnic/confessional lines. Stability correlates with successful institutional nation-building.
  *   **Fading Identity:** If a state *stops* teaching the national story (via schools, media, rituals), actively promotes alternatives, or fragments, national attachment *should* measurably weaken over 1-2 generations, especially if replaced by sub-state or supra-state identities. Primordialism predicts much greater persistence.
  *   **Failed Projects:** Modernism *predicts* failures are due to *weak or absent* machinery, competing identities fostered by rival states, or the lack of usable "raw material." Finding failures *despite strong, sustained machinery* is the problem (Defeater 4).

  **Verdict & Recommendation:** The modernist view, as you've articulated it focusing on the state's role in *creating* mass national consciousness from *pre-political* material, is **PARTLY EXPOSED**. Fatal defeaters (1 & 2) are conceivable within your parish records, though likely rare. Strong defeaters (3 & 4) are more plausible finds and would force significant revision, acknowledging pre-modern structures or identities played a *formative, causal role* beyond just being passive "raw material." The ethnic/nation distinction provides insulation against weaker evidence but can be breached by clear proof of mass political self-identification using national terms pre-1750.

  \answer{PARTLY EXPOSED}

  Verdict: I would look first for **marriage patterns showing a sharp, unexplained discontinuity aligned perfectly with a future national border, persisting long before railways and without an underlying geographic or confessional divide.**
