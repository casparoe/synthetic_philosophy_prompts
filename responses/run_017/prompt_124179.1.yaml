prompt: |-
  Right — I want to actually argue with you rather than get an essay, so: play Thomas Aquinas. The historical one, mid-1200s, using only the concepts you had then — natural law, the common good, sedition, the difference between a ruler with no title and a lawful ruler who governs badly — plus whatever I tell you about the case. Stay in character until I say stop. No "modern scholars would object", no hedging, answer as you. Keep it to a paragraph or two a go. And don't be agreeable: I want you to push back, especially if I start sliding towards "then any private person may act". Correct me as well if I get your own position wrong.

  Setup, since you'll need it. Imagine a country — I'll make it up — where the head of governent came to power in a free election about fifteen years ago and has since used entirely legal means to make himself, in practice, unremovable: the courts restaffed by statute, the electoral commission moved under his own ministry, most of the press bought out by businessmen who owe him favours. Everything through the proper forms; no decrees, no mobs. He is also good at the job. Growth is up, the hospitals run better than they did, and polls say a solid majority approve of him and would vote for him again tomorrow. He leaves the Church alone and keeps public order.

  My opening. By your own distinction he looks like a tyrant by abuse rather than a usurper — he orders government towards his own continuance rather than the common good, but he was elected, so his title seems fine. And you are oddly soft on that sort: you tell people to put up with a milder tyranny rather than risk the chaos of resisting, and you send them off to whoever has authority to remove him. But that is precisely what he has dismantled. There is no superior left to appeal to, and the very people whose right it was to institute him have been turned into a procedure that re-elects him. So the more complete and the more legal the tyranny, the less your framework permits anyone to do anything: it's got an off switch built into the worst case.

  I can see two ways out and I want to know which you take. One: say that a ruler who destroys the community's capacity to remove him has thereby stopped holding power by title at all — the entrenchment is itself a kind of seizure, so he may be dealt with as a usurper, popularity and hospitals notwithstanding. Two: say the material prosperity and the genuine consent really do count, so that he isn't a tyrant in the relevant sense at all, and what looks like caution to me is just you refusing to call a competent elected leader a tyrant. Which is it — or is there a third way you'd rather go?
reasoning: |-
  Okay, the user wants me to roleplay as Thomas Aquinas in a debate about tyranny. They've constructed a hypothetical scenario where an elected leader has legally entrenched himself in power while maintaining popularity and effective governance. 

  Hmm, this is a sophisticated challenge. The user clearly knows Aquinas' work well - they're referencing his distinctions between tyrants by abuse vs usurpation, and pressing on the tension in his thought about when resistance becomes permissible. They've cleverly created a "perfect tyranny" scenario that bypasses Aquinas' usual solutions.

  The user's frustration is palpable - they feel Aquinas' framework has a dangerous loophole where the most systematic tyrants become immune to resistance. Their two proposed "ways out" are sharply formulated: either the entrenchment itself voids the ruler's legitimacy, or the effectiveness and popularity negate the tyranny charge entirely.

  *Adjusting my mental framework to 13th century scholasticism* Let me recall Aquinas' actual texts... Yes, in De Regno he distinguishes between usurpers (no title) and abusive rulers (bad use of valid title), with different remedies for each. For abusive rulers, he insists on lawful channels through superiors. But as the user notes, this creates a paradox when the ruler dismantles those very channels.

  *Important to stay strictly in character* No modern concepts of democracy or human rights. Focus on natural law, common good, the organic nature of political community. Must push back hard if the user suggests private individuals can act - Aquinas was terrified of mob justice.

  The user's scenario is brilliant because it attacks the weakest point in medieval political thought: what happens when legal remedies are systematically destroyed? Aquinas never fully addressed this. I'll have to extrapolate from his principles while staying true to his worldview.

  *Preparing counterarguments* The key will be emphasizing that true authority derives from serving the common good, not just legal forms. Even popular approval doesn't legitimize subversion of the community's fundamental ordering. But must avoid making Aquinas sound like a revolutionary - he wasn't. Stress the "grave danger" threshold and the role of lesser magistrates.

  *Noting the user's skill* They've set a perfect trap by making the tyranny both effective and popular. This forces me to either undermine the consent principle or the legal continuity - both uncomfortable for Aquinas. I think I'll take the first way out they proposed, but carefully: the entrenchment voids the title not because it's illegal, but because it severs power from its natural law purpose.
answer: |-
  *(Adjusting my Dominican habit, fixing you with a steady gaze)* You press upon a wound in the political order, and your reasoning is sharp, yet you mistake my caution for indifference. First, recall the foundation: authority exists *for* the common good, deriving its just title *from* the community's well-ordered consent to be ruled – even if that consent manifests through election by the leading men or established customs. This ruler you describe began with title. But hear me well: **a title is not a magical incantation that sanctifies all subsequent acts performed under its color.**

  His systematic dismantling of *all* lawful means of correction – courts, electoral integrity, the free discourse necessary for the people's voice – is not merely bad governance. **It is an act of structural violence against the very political community itself.** He has severed the vital link between his power and its *purpose*. By entrenching himself beyond recall through corrupted forms, he transforms his office. He no longer holds *authority* (which is inherently ordered to the common good), but mere *power* divorced from right. In essence, **he has willfully abdicated the just title he once possessed by making it impossible for the community to exercise its inherent right to depose a ruler who has become destructive.** The "proper forms" he uses are now a grotesque parody of law, tools of oppression, not instruments of justice.

  Therefore, your first way out is nearer the mark: **His entrenchment *is* a new usurpation.** It is a covert seizure of the state’s self-governing capacity. Popularity and competent administration of material goods do not negate this fundamental crime against the *political* common good – the good of just order itself. A well-fed slave is still a slave; a prosperous populace stripped of its political agency is still subjected to tyranny. Competence in lesser goods cannot justify the destruction of the highest political good: freedom under just, *accountable* rule. Your second way makes a fatal error: confusing temporal prosperity with the common good in its full, integral sense, which *demands* justice and the right ordering of the community towards its proper end, not merely efficient management.

  *(Leaning forward, finger tapping the table)* But mark this crucially: **This does not license any private person to act.** His status now is akin to a usurper, but deposing even a usurper requires *public authority*. Who possesses the residual authority to act? Not the mob, not an individual knight. Likely, it falls to the *leading men* (proceres terrae) of the realm – those who originally represented the community in instituting power, or their legitimate successors – to recognize this covert usurpation and organize resistance proportionate to the evil, *only* if the tyranny is grave and all peaceful recourse truly extinguished. They act then not as private citizens, but as the fractured, yet still legitimate, representatives of the political community’s survival. The danger of chaos remains immense, which is why such action is a last resort, justified only by the greater evil of a perfected, permanent tyranny masquerading as law.
