answer: |-
  ### Exam Question

  **Arrow's Theorem and Agenda Sensitivity**  

  Consider a universe of alternatives with at least three members. A social welfare rule operates on every finite agenda (subset) of size at least two. For each agenda \(A\) and profile \(P\) (a list of strict linear orders by a fixed finite set of voters over \(A\)), the rule assigns a complete and transitive social relation on \(A\). Arrow's theorem states: If a rule satisfies Unrestricted Domain (all strict orders allowed), Weak Pareto (if all voters prefer \(x\) to \(y\), society ranks \(x\) above \(y\)), Independence of Irrelevant Alternatives (IIA: social ranking of \(x\) vs. \(y\) depends only on individual rankings of \(x\) vs. \(y\)), and Collective Rationality (always produces a complete and transitive order), then it is dictatorial (one voter’s preferences determine the social order).  

  We introduce two new conditions:  
  - **Rank-Intensity Independence (RII)**: For any agenda and alternatives \(x, y\), the social preference between \(x\) and \(y\) depends only on the vector of signed rank distances for each voter. For a voter, the signed rank distance for \(x\) vs. \(y\) is \((r(y) - r(x))\), where \(r(x)\) is the rank of \(x\) (top = 0, next = 1, ..., bottom = \(|A|-1\)). This captures the direction and number of alternatives between \(x\) and \(y\).  
  - **Deletion Robustness (DR)**: For any agenda \(A\), profile \(P\), and alternative \(z \in A\) that is not the unique top-ranked alternative in the social order, removing \(z\) from \(A\) does not change the social ranking of the remaining alternatives (i.e., the social order on \(A \setminus \{z\}\) is the restriction of the order on \(A\)).  

  A colleague claims:  
  > "Borda’s rule refutes Arrow’s pessimism. On any fixed agenda, it assigns scores: Each voter gives an alternative \(k\) points if it ranks above \(k\) others (so ranks 0 to \(|A|-1\)). The Borda score sum determines a complete, transitive order. It satisfies Weak Pareto, Anonymity (symmetric in voters), Neutrality (symmetric in alternatives), and non-dictatorship. Critically, it satisfies Rank-Intensity Independence, using finer-than-pairwise information to escape dictatorship."  

  **Tasks**:  
  (a) **Borda and Independence Conditions**:  
  (i) For a fixed agenda, show that the difference in Borda scores between \(x\) and \(y\) equals the sum over voters of \((r_i(y) - r_i(x))\). Conclude that Borda satisfies RII.  
  (ii) Exhibit a profile on three alternatives \(\{x, y, z\}\) with two voters to show Borda violates IIA. Fix the pairwise rankings of \(x\) vs. \(y\) (each voter opposes the other), but change \(z\)’s position to alter the social ranking of \(x\) vs. \(y\). Compute Borda scores for both cases.  

  (b) **Deletion Robustness forces IIA**: Prove that if a rule satisfies DR, then for any agenda and any pair \(x, y\) in it, the social preference between \(x\) and \(y\) depends only on individual rankings of \(x\) vs. \(y\) (i.e., DR implies IIA). Explicitly state where the availability of two-element agendas is used.  

  (c) **Dictatorship via Deletion Robustness**: Prove that any rule satisfying Unrestricted Domain, Weak Pareto, Collective Rationality, and DR is dictatorial, with the same dictator for all agendas. Use Arrow’s theorem and part (b) to justify dictatorship on each agenda, then show the dictator is identical across agendas. Specify where the availability of all agendas (including two-element ones) is essential.  

  (d) **Critical Assessment**: Write a short paragraph addressing the colleague’s claim. Explain what it establishes and what it overlooks. Discuss:  
  - Does cross-agenda coherence (as in DR) legitimately extend Arrow’s requirements?  
  - Is Borda’s sensitivity to agenda size (as in (a)(ii)) an idiosyncrasy or a necessary consequence of avoiding dictatorship?  

  ---

  ### Model Answer  

  **Total words: 950**  

  **(a) Borda and Independence Conditions**  
  (i) For an agenda \(A\) of size \(k\), voter \(i\) assigns Borda score \(b_i(x) = (k - 1) - r_i(x)\), where \(r_i(x)\) is \(x\)’s rank (0 for top). The score difference is:  
  \[
  b_i(x) - b_i(y) = [(k-1) - r_i(x)] - [(k-1) - r_i(y)] = r_i(y) - r_i(x).
  \]  
  Summing over voters, \(\sum_i [b_i(x) - b_i(y)] = \sum_i (r_i(y) - r_i(x))\). This equals the sum of signed rank distances, which determines Borda’s social preference for \(x\) vs. \(y\). Since RII requires dependence only on the vector of \((r_i(y) - r_i(x))\), Borda satisfies RII.  

  (ii) Consider alternatives \(\{x, y, z\}\) and two voters.  
  - **Profile 1**: Voter 1: \(x \succ y \succ z\), Voter 2: \(y \succ x \succ z\).  
    Borda scores (ranks 2,1,0 for 1st,2nd,3rd): \(x\): \(2 + 1 = 3\), \(y\): \(1 + 2 = 3\), \(z\): \(0 + 0 = 0\). Social order: \(x \sim y \succ z\).  
  - **Profile 2**: Voter 1: \(x \succ y \succ z\) (same as before), Voter 2: \(y \succ z \succ x\) (pairwise \(x\) vs. \(y\) unchanged: Voter 1 prefers \(x\), Voter 2 prefers \(y\)).  
    Scores: \(x\): \(2 + 0 = 2\), \(y\): \(1 + 2 = 3\), \(z\): \(0 + 1 = 1\). Social order: \(y \succ z \succ x\), so \(y \succ x\).  
  In Profile 1, \(x \sim y\); in Profile 2, \(y \succ x\). Pairwise rankings of \(x\) vs. \(y\) are identical (one voter each way), yet the social preference changes. Thus, Borda violates IIA.  

  **(b) DR implies IIA**  
  We show that for any agenda \(A\) and pair \(x, y \in A\), the social preference between \(x\) and \(y\) depends only on individual \(x\)-vs.-\(y\) rankings.  

  Consider two profiles \(P_1, P_2\) on \(A\) that agree on all voters’ rankings of \(x\) vs. \(y\). We prove the social preference for \(x\) vs. \(y\) is the same in both.  

  Remove all alternatives except \(x\) and \(y\) one-by-one using DR. At each step, remove an alternative \(z \notin \{x, y\}\) not the unique top in the current social order. Such a \(z\) exists:  
  - If there is a unique top, it must be \(x\) or \(y\) (since only they remain at the end), so any \(z \notin \{x, y\}\) is not unique top and can be removed.  
  - If no unique top (e.g., a tie), any \(z\) can be removed.  

  After removing all \(z \notin \{x, y\}\), the agenda is \(\{x, y\}\). By DR, the social order on \(\{x, y\}\) is the restriction of the order on \(A\). Since the removal process depends only on the profile (which is unchanged for \(\{x, y\}\)), and the rule is defined for the two-element agenda, the social preference on \(\{x, y\}\) is determined solely by the pairwise rankings of \(x\) vs. \(y\)—which are identical in \(P_1\) and \(P_2\). Thus, the social preference for \(x\) vs. \(y\) in \(A\) must be the same for \(P_1\) and \(P_2\).  

  **Use of two-element agendas**: The final step produces a two-element agenda, where the rule’s output depends only on pairwise comparisons. Without two-element agendas in the domain, the reduction fails.  

  **(c) Dictatorship via DR**  
  By part (b), DR implies IIA on every agenda. For any agenda with \(\geq 3\) alternatives, the rule satisfies Unrestricted Domain, Weak Pareto, IIA (from DR), and Collective Rationality. By Arrow’s theorem, it is dictatorial: For each such agenda \(A\), there is a dictator \(d_A\) whose strict preferences determine the social order.  

  We prove \(d_A\) is identical for all agendas. Let \(A_1, A_2\) be two agendas with \(\geq 3\) alternatives. Take a super-agenda \(B \supseteq A_1 \cup A_2\) (finite, size \(\geq 3\)). On \(B\), Arrow’s theorem gives a dictator \(d_B\).  

  Show \(d_B = d_{A_1}\): For any \(x, y \in A_1\) and profile \(P\) on \(A_1\) where \(d_{A_1}\) prefers \(x \succ y\), extend \(P\) to \(B\) arbitrarily but ensure \(d_B\) ranks \(x \succ y\) (Unrestricted Domain allows this). Since \(d_B\) dictates on \(B\), \(x \succ_B y\). By DR, remove alternatives in \(B \setminus A_1\) as in part (b), leaving agenda \(A_1\). The social order on \(A_1\) restricts from \(B\), so \(x \succ_{A_1} y\). But if \(d_{A_1} \neq d_B\), consider a profile on \(A_1\) where \(d_{A_1}\) prefers \(y \succ x\) (so \(y \succ_{A_1} x\)), but extend to \(B\) with \(d_B\) preferring \(x \succ y\) (so \(x \succ_B y\)). Contradiction: \(x \succ_{A_1} y\) (from DR) and \(y \succ_{A_1} x\) (from Arrow on \(A_1\)). Thus, \(d_B = d_{A_1}\). Similarly, \(d_B = d_{A_2}\), so \(d_{A_1} = d_{A_2}\).  

  For two-element agendas: Fix \(\{x, y\}\). Take any larger agenda \(C \supseteq \{x, y\}\) (size \(\geq 3\)) with dictator \(d\). For a profile on \(\{x, y\}\), extend to \(C\) so \(d\)’s ranking of \(x\) vs. \(y\) matches the two-element profile. Then \(d\) dictates \(x \succ_C y\) or \(y \succ_C x\). By DR, removing \(C \setminus \{x, y\}\) gives the same social order on \(\{x, y\}\) as on \(C\), so \(d\) dictates there too.  

  **Role of all agendas**:  
  - Two-element agendas are used in (b) to force pairwise dependence.  
  - Larger agendas (\(\geq 3\)) enable Arrow’s theorem.  
  - Connecting agendas via super-agendas (and deletions) ensures a single dictator.  

  **(d) Critical Assessment**  
  The colleague correctly observes that Borda satisfies all Arrow conditions except IIA on a fixed agenda, escaping dictatorship via RII. However, this escape is superficial: It assumes a fixed agenda, but real social choices often involve variable alternatives. The Deletion Robustness (DR) condition—which requires social preferences to be unaffected by removing unchosen alternatives—formalizes cross-agenda coherence. As shown, DR forces IIA, reinstating dictatorship by Arrow’s theorem. Thus, Borda’s agenda-sensitivity (evident in (a)(ii)) is not an idiosyncrasy but a necessary trade-off: Any non-dictatorial, Paretian, transitive rule must violate DR (and hence coherence across agendas) to use richer ordinal information. Cross-agenda coherence is a legitimate extension of Arrow’s normative framework, as it ensures robustness to irrelevant alternatives even when the agenda changes. Borda’s failure here is unavoidable, not a flaw; it reflects the inescapable tension Arrow identified when aggregating preferences.  

