  (c) We now assume that the rule satisfies Unrestricted Domain (UD), Weak Pareto (WP), Collective Rationality (CR), and Deletion Robustness (DR). By part (b), the rule satisfies IIA on every agenda. Therefore, for any fixed agenda \(A\), the rule restricted to \(A\) is a social welfare function satisfying UD, WP, IIA, and CR. By Arrow's theorem, since the agenda has at least two alternatives (and if it has three or more, we get dictatorship) but note: Arrow's theorem requires at least three alternatives? Actually, in the statement, the set of alternatives must have at least three. However, the rule is defined for every finite subset of size at least two. 

  For an agenda of size two: Arrow's theorem does not apply because with two alternatives, majority rule works (if we have an odd number of voters) and is non-dictatorial. But note: Arrow's theorem requires at least three alternatives. Therefore, for an agenda of size two, we cannot apply Arrow's theorem to get a dictator. However, for any agenda of size at least three, we can: so for any such agenda, there is a dictator (a voter whose strict preference is followed in the social ordering).

  But we must show that the dictator is the same for every agenda.

  Take two alternatives \(x,y\) and consider an agenda \(A\) containing at least three alternatives (including \(x,y\)). By Arrow's theorem applied to \(A\), there is a dictator, say voter \(d_A\). We wish to show that \(d_A\) is the same for every agenda.

  Consider two agendas \(A\) and \(B\), both of size at least three. We want to show that \(d_A = d_B\).

  Take a super-agenda \(C = A \cup B\) (which is finite and has at least three alternatives). Consider the rule on \(C\). By Arrow's theorem, there is a dictator \(d_C\) for \(C\).

  We will show that \(d_C = d_A\) and \(d_C = d_B\), so \(d_A = d_B\).

  Consider \(A \subseteq C\). We wish to show that \(d_C\) is also the dictator for \(A\). Take any two alternatives \(x,y \in A\) and a profile \(P\) on \(C\) in which \(d_C\) prefers \(x\) to \(y\). Then, since \(d_C\) is the dictator for \(C\), we have \(x \succ_C y\) in the social ordering for \(C\). Now, by DR, we can remove all alternatives not in \(A\) from \(C\). We do this one by one (as in part (b)), and we end up with the agenda \(A\). The social ordering on \(A\) is the restriction of the social ordering on \(C\), so \(x \succ_A y\). Moreover, the profile restricted to \(A\) is arbitrary (because we can extend any profile on \(A\) to \(C\) arbitrarily, by UD). Therefore, for any profile on \(A\), if we extend it to \(C\) in such a way that \(d_C\) ranks \(x\) above \(y\) (which we can do by UD), then the social ordering on \(C\) has \(x\) above \(y\), and hence the restriction to \(A\) has \(x\) above \(y\). But note: the dictator on \(A\) is \(d_A\), so if \(d_A\) is not \(d_C\), we could have a profile on \(A\) where \(d_A\) ranks \(y\) above \(x\) (so social ordering on \(A\) has \(y\) above \(x\)) but then if we extend to \(C\) so that \(d_C\) ranks \(x\) above \(y\), we get a contradiction: the social ordering on \(A\) must simultaneously have \(x \succ y\) (by the removal from \(C\)) and \(y \succ x\) (by the rule on \(A\)). 

  Therefore, \(d_A\) must be \(d_C\). Similarly, \(d_B = d_C\). Hence, \(d_A = d_B\).

  Therefore, the dictator is the same for every agenda of size at least three.

  What about two-element agendas? We must show that the same dictator \(d\) dictates on two-element agendas. Let \(A_0 = \{x,y\}\). We wish to show that for any profile on \(A_0\), the social ordering follows \(d\)'s ranking. 

  Take a larger agenda \(A\) containing \(x,y\) and at least one more alternative. We can extend the profile on \(A_0\) to a profile on \(A\) arbitrarily. But we choose to extend it so that in the extended profile, \(d\) has the same ranking of \(x\) and \(y\) as in the two-element profile. Then, on \(A\), since \(d\) is the dictator, the social ordering on \(A\) has \(x \succ y\) if and only if \(d\) has \(x \succ y\). Then, by DR, when we remove all alternatives except \(x,y\), we get the same social ordering on \(\{x,y\}\) as the restriction. But the rule on the two-element agenda must produce that same ordering? Actually, by the removal process, the social ordering on \(\{x,y\}\) that we get is the same as the one the rule assigns to the two-element agenda? Yes, because as we argued in part (b), the rule on the two-element agenda is determined by the removal process and must match the direct application of the rule to the two-element agenda. So the social ordering on \(A_0\) is the same as the restriction from \(A\), hence it follows \(d\)'s preference.

  Therefore, the same voter \(d\) is the dictator for every agenda (including the two-element ones).

  Note: The availability of two-element agendas is used in part (b) when we reduce to the two-element agenda to force IIA. Without two-element agendas, we could not complete the reduction. Also, in part (c), we use the two-element agenda to show that the dictator on the larger agendas dictates there too.

  (d) The colleague's claim correctly observes that Borda's rule escapes Arrow's theorem on a fixed agenda by using rank-intensity information and satisfies appealing properties. However, it fails to account for the requirement of cross-agenda coherence. Specifically, when we require the rule to be robust to the deletion of unchosen alternatives (DR), we force the rule to satisfy IIA on every agenda, which by Arrow's theorem leads to dictatorship. The escape via rank-intensity information is only available when the agenda is fixed; when the agenda varies, Borda violates DR (as seen in part (a)(ii)), and this violation is necessary. Cross-agenda coherence (as formalized by DR) is a natural requirement: it ensures that the social choice is consistent regardless of the set of available alternatives, which is often not fixed in practice. Borda's sensitivity to the agenda is not an idiosyncrasy but a necessary consequence of being non-dictatorial and satisfying the other Arrow conditions on a fixed agenda. Thus, the colleague's optimism is premature: Arrow's pessimism resurges when we demand robustness across agendas.

  ---

