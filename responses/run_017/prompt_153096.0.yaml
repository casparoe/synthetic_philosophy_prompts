  - **Rank-Intensity Independence (RII)**: For any two alternatives \(x\) and \(y\) in an agenda, the social preference between \(x\) and \(y\) depends only on the vector of signed rank distances for each voter. Specifically, for each voter, the signed rank distance is the number of alternatives the voter ranks above \(x\) and below \(y\) minus the number they rank above \(y\) and below \(x\) (which simplifies to the difference in the ranks of \(x\) and \(y\) in the voter's ordering, normalized so that the top alternative has rank 0 and the bottom has rank \(k-1\) for an agenda of size \(k\)). In other words, it depends on the direction of the pairwise ranking and the number of alternatives between \(x\) and \(y\) in each voter's ballot.

