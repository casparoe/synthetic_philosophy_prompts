prompt: |-
  I'm a philosophy professor and two things have collided this year. First, I got voluntold onto the university's long-range planning committee: four times a year we're asked for a one-page outside view on some 20-to-30 year question (will there still be a residential undergraduate model here, will the current endowment spend rule survive, will this campus still be doing the thing it's doing), and the page has to end in either a number or an explicit refusal, because the dean signs it and the dean will not sign "it depends." Second, I teach an undergrad seminar where students write their own twenty-year forecasts about institutions and I have to grade the reasoning, not the outcome — which is basically the same skill, and I'd like to use the same sheet for both.

  What I want from you is the sheet. Not the forecasts. And definately not a reading list: I've read around in this stuff enough to know I'd just be handed a pile of names I can't follow up on. I want a procedure that a committee of non-specialists — me, someone from facilities, an economist who is polite about the rest of us, and a rotating faculty member — can actually run in about an hour per question, working from what a smart generalist already knows plus maybe an hour in the library. Give me the questions in order; what counts as an answer to each that's good enough to move on; where the procedure returns "no number, stop"; and where it has to stop and hand the question over as a values call rather than a factual one. Then run it on three of our real questions, below.

  The conceptual work is in the translation, and there are five places I keep getting stuck. I'd like you to turn each into a step or tell me it isn't load-bearing:

  - The unit question. Before any counting, what exactly has to stop being true for the forecast to have failed? I think committees skip this and end up forecasting the survival of a name rather than a practice.
  - The continuity convention. Durations of past empires are partly an artifact of how we count: republic into empire into successor state, a change of dynasty or constitution, a rump that keeps the name. I want a step that forces the committee to recompute the base rate under two different identity conventions and see whether the median actually moves, and a rule for what to do when it does.
  - The class is selected on the outcome. My half-baked version: our list of past empires is a list of polities that were good at being remembered, and short-lived ones leave less behind, so the class is filtered by the very variable we're measuring. If that's right, make it a check; if it's a confusion, say so.
  - Hazard shape. Constant-hazard (memoryless), infant mortality then consolidation, or the "the longer it's lasted the longer it'll last" shape — these give wildly different medians for remaining life, and I suspect small historical samples can't distinguish them. I want the step to say what to assume when the data can't decide, and to makr that it's an assumption.
  - Double counting. The story about why *we* are different is often information already reflected in the class. But sometimes it isn't — a mechanism genuinely absent from all the historical cases. I need a usable rule for how far to shrink toward the base rate, not just the reminder that we're overconfident.

  Flag clearly the points where judgment can't be eliminated and where a step is a judgment call dressed up as procedure — I'd rather hand the dean three honest asterisks than a fake algorithm.

  Run it on: (1) the committee's actual question, whether there will still be something recognisably like the current European Union in 2050; (2) whether my own philosophy department will still be a free-standing department in 2045 — this one is mine and I already dread where the outside view goes; (3) a student's forecast that there will be no war between nuclear-armed states this century, where I suspect the honest output is a refusal or an interval too wide to be useful, and I want to see what a clean refusal looks like on the page.

  Finally: tell me what this procedure cannot do. Where will it misfire on the questions a university actually asks, and what should we do on those?
reasoning: |-
  Okay, the user is a philosophy professor who's been voluntold onto a university long-range planning committee. They need a structured procedure for making 20-30 year forecasts that end with a number or an explicit refusal. They also want to use this same procedure for grading student forecasts in their seminar. 

  Hmm, the core challenge here is designing a practical tool that forces concrete outputs while acknowledging epistemological limitations. The professor is clearly frustrated with fuzzy "it depends" answers but also wary of false precision. They've identified five specific conceptual knots that trip up forecasting - unit definition, continuity conventions, selection bias, hazard shapes, and double-counting. Smart.

  First impression: This is someone who thinks deeply about institutional longevity but needs operationalization. They're not asking for theory - they want a repeatable worksheet. The refusal option is crucial because they understand some questions can't be answered numerically without dishonesty. Also notable they want to apply it to both bureaucratic committee work AND pedagogy - that's elegant.

  The five sticking points they raised are all valid:
  - Unit question is foundational. If you don't define failure conditions clearly, you're just predicting labels.
  - Continuity conventions matter because historical analogies depend entirely on how we bound entities.
  - Selection bias is brutal for institutional forecasting - failed institutions don't leave archives.
  - Hazard shape determines whether institutions "age like milk or wine" - and we rarely have enough data.
  - Double-counting is the classic inside-view trap.

  For the procedure... I'll need to sequence steps that force explicit decisions on each pitfall, with off-ramps where quantification becomes unreasonable. The three test cases are well-chosen: EU longevity (complex polity), philosophy department (vulnerable academic unit), and nuclear war (low-probability catastrophe). 

  Biggest design tension: Making it rigorous enough for grading while simple enough for a committee with non-specialists. The economist will want quantitative anchors; the facilities person needs concrete hooks; rotating faculty may grandstand. Hence the need for strict time boxing per step.

  On what it can't do: This method will fail spectacularly for true black swans or when historical precedents don't exist. Also bad for self-fulfilling/self-defeating prophecies. Should probably add a "stop if novel mechanism" flag.

  ...time to structure this as a fill-in-the-blank worksheet with clear exit points. The refusal conditions must be unambiguous - no weasel words. And for the love of Socrates, no fake confidence intervals.
answer: |-
  Here's a forecasting procedure designed for your constraints: a **structured worksheet** forcing explicit decisions on conceptual pitfalls, with clear off-ramps to "no number" or "values call." It targets **1-hour completion** by non-specialists using general knowledge + brief research.

  ---

  ### The Forecasting Worksheet: Outside View Protocol

  **Question:** [Insert specific "Will X still exist/continue in Year Y?"]  
  **Target Year:** [Y]  
  **Time Horizon:** [Y - Current Year] years  

  **Step 1: Define the Unit & Failure Condition**  
  *"What core function/practice must cease for the forecast to fail? (Not just a name change.)"*  
  - **Output:** 1-2 sentence definition of the institution’s *essential practice*.  
  - **Stop if:** Committee cannot agree on a non-arbitrary definition (→ **Hand to values committee**).  
  - **Example (Philosophy Dept):** "Autonomous unit with tenure-track faculty teaching philosophy courses, granting degrees, setting curriculum."  
  - **Failure:** Merged into "Humanities Division" with no dedicated faculty/budget control.  

  **Step 2: Establish Historical Analog Class**  
  *"What past entities performed a similar core function? (Include failed examples if possible.)"*  
  - **Output:** List 3-7 comparable institutions with start/end dates.  
  - **Rule:** Must include ≥1 *failure* case (e.g., Classics depts merged; League of Nations).  
  - **Stop if:** No plausible analogs exist → **"No comparable base rate" → Refuse number**.  

  **Step 3: Adjust for Continuity Convention (2 Runs)**  
  *"Recalculate lifespan base rates under two ID conventions: (A) Strict (core practice unchanged), (B) Lenient (name/partial function continues)."*  
  - **Output:** Median lifespan under Convention A: ______ yrs; Convention B: ______ yrs.  
  - **Rule:** If |A - B| > 25% of horizon → **Flag as "High ID Sensitivity"** (proceed but note).  
  - **Example (EU):**  
    - Strict: Treaties of Rome (1957) → Today = 67 yrs.  
    - Lenient: ECSC (1951) → Today = 73 yrs → Median difference negligible.  

  **Step 4: Test for Selection Bias**  
  *"Are failures in our analog list underrepresented? (e.g., short-lived entities leave few records)."*  
  - **Check:** If known failures are >30% of the list → Proceed.  
  - **If not:** Apply Lindy Correction → **Multiply failure probability by 1.5x** (heuristic for missing data).  

  **Step 5: Estimate Hazard Shape**  
  *"Do analogs show: (A) Constant failure risk? (B) High early risk then stability? (C) Risk increases with age?"*  
  - **Output:**  
    - If most failures clustered early → Assume **"Infant Mortality"** → Use 25th percentile lifespan.  
    - If failures scattered evenly → Assume **Constant Hazard** → Use median lifespan.  
    - If failures increase over time → Assume **"Aging"** → Use 75th percentile lifespan.  
  - **Rule:** If unclear → Default to **Constant Hazard** → Note assumption.  

  **Step 6: Shrink Toward Base Rate**  
  *"What unique factors make our case different? Are these *truly* absent from all analogs?"*  
  - **Output:**  
    - List 1-3 key differentiating factors (e.g., "nuclear deterrence," "digital-only administration").  
    - For each factor: If present in ≥1 analog → **Discard**.  
    - If novel/untested → Apply **Shrinkage: Final probability = (Base Rate + Inside View)/2**.  
  - **Stop if:** >2 novel factors → **"High inside-view dependence" → Refuse number**.  

  **Step 7: Output Decision**  
  - **Probability =** [Base rate adjusted for Steps 4-6]  
    - **Format:** "[X]% probability of core practice persisting to [Y]."  
  - **OR Explicit Refusal:** "Quantified estimate refused due to: [ ] Unresolved unit definition [ ] No valid analogs [ ] Excessive novel factors."  
  - **Asterisks (*):** Flag steps where judgment dominated (e.g., "Hazard shape assumed*").  

  ---

  ### Test Runs

  **Case 1: Will the EU (core practice) exist in 2050?** (Horizon: 26 yrs)  
  1. **Unit:** "Supranational entity with binding treaties, single market, free movement, shared currency (€), Brussels institutions."  
  2. **Analogs:**  
     - HRE (844 yrs), Polish-Lithuanian CW (226 yrs), US Confederation (8 yrs), Hanseatic League (400 yrs), Ottoman Millet (600 yrs).  
     - *Failure included:* US Confederation.  
  3. **Continuity:** Strict (1957-now=67yrs) vs. Lenient (1951-now=73yrs) → Difference <10% → Proceed.  
  4. **Selection Bias:** Failures underrepresented → Apply 1.5x failure multiplier (e.g., 20% → 30%).  
  5. **Hazard:** Failures scattered → **Constant Hazard** → Median lifespan of analogs: ~300 yrs.  
  6. **Shrinkage:** Novel factors? "Digital governance" (novel) vs. "Cultural heterogeneity" (in HRE/Ottoman). → Shrink EU's "special stability" claim 50% toward base rate.  
  7. **Output:** 85% probability (*Hazard assumed constant; Lindy correction applied*).  

  **Case 2: Will Philosophy Dept be freestanding in 2045?** (Horizon: 21 yrs)  
  1. **Unit:** "Tenure-track faculty control hiring/budget, offer philosophy majors, teach dedicated courses."  
  2. **Analogs:**  
     - Classics Depts (median lifespan: 1900-2020 = 120 yrs; 40% merged), Theology Faculties (1500-now), Geology Depts (1850-now).  
     - *Failures:* Classics depts at small colleges (e.g., 20 merged since 1990).  
  3. **Continuity:** Strict/Lenient similar → Proceed.  
  4. **Selection Bias:** Many failures known → No correction.  
  5. **Hazard:** Clustered failures post-1990 → **Infant Mortality?** → Use 25th percentile lifespan (60 yrs).  
  6. **Shrinkage:** Novel factors? "STEM funding bias" (in analogs: geology vs. classics) vs. "AI displacing humanities" (untested) → Shrink 50%. Base failure risk: 30% → Adjusted: 45%.  
  7. **Output:** 55% probability (*High shrinkage; hazard model contested*).  

  **Case 3: No war between nuclear-armed states in 2100?** (Horizon: 76 yrs)  
  1. **Unit:** "Sustained military conflict with casualties between two states possessing operational nukes."  
  2. **Analogs:** None. No historical nuclear peer wars. Non-nuclear great power wars (e.g., WWI/WWII) irrelevant.  
  3. **Stop → Refusal:** "No valid historical analogs for nuclear peer conflict. Novelty too high."  

  ---

  ### Where the Procedure Misfires & Mitigations

  | **Failure Mode**               | **Mitigation**                                  |
  |-------------------------------|-----------------------------------------------|
  | **True Black Swans**          | *Refuse number*. Flag as "unprecedented mechanism." |
  | **Self-Fulfilling Prophecies** | Use only for passive forecasts (e.g., "will department merge?" not "should we merge?"). |
  | **Values Disguised as Facts** | Hand off after Step 1 (e.g., "Is a 10% smaller department still 'philosophy'?"). |
  | **Overfitting Tiny Samples**  | Default to Constant Hazard; widen probability bands. |
  | **Institutional Blind Spots** | Require inclusion of ≥1 failure analog (Step 2). |

  ---

  ### Key Design Notes
  - **Time Budget:** Steps 1-2 (15 mins), 3-4 (15 mins), 5-6 (20 mins), Step 7 (10 mins).  
  - **Honest Asterisks:** Judgment calls flagged at Steps 3 (conventions), 5 (hazard), 6 (shrinkage).  
  - **Grading Use:** Score students on rigor at each step (e.g., "Step 2: Missed key failure analog -1pt").  
  - **Dean-Friendly:** Output is either a % or a structured refusal reason.  

  This forces confrontation with the five pitfalls while allowing exit ramps. It won't eliminate disagreement, but it *structures* it – making the subjective leaps visible. For your philosophy department: steel yourself for that 55%.
