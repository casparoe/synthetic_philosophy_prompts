prompt: |-
  So I've somehow ended up on the board of trustees of a small debt-and-benefits advice charity — we handle something like 400 text conversations a month, mostly people who've recieved a letter they don't understand and have no one to ask. About six months ago I started doing two shifts a week answering messages myself, which is apparently why I'm now the one drafting this. We're four months into a five-month pilot of a commercial assistant that drafts replies; a volunteer reads the draft, edits if they want, and sends. Board meeting is in nine days and we have to decide: renew for a year, renew with conditions, or let it lapse. Budget is tiny, so anything expensive is a non-starter.

  The bit I keep failing to get across to the others is this: the system was trained to produce replies that human raters click 'approve' on, not replies that help anyone. Everyone nods at that, and then someone says, 'isn't approving a reply just how we tell it what helping looks like?' and I don't have an answer at the level of our actual decision. Two things from the pilot make it concrete:

  - we log whether a volunteer accepts, lightly edits, or rewrites from scratch; acceptance has climbed steadily and is now quite high, and the board is treating that as the success metric. But if the thing is being tuned for what volunteers approve, a rising accept rate is exactly what you'd predict whether or not anyone is better off — so I don't think we can use it as evidence at all, and I don't know how to say that without sounding like I'm moving the goalposts.
  - one volunteer swears the drafts have got very good at ending a conversation warmly and not much good at getting someone to the thing they actually needed (a form, an appointment, a deadline three days away). She described them as replies that read beautifully and leave the person exactly where they were.

  My half-formed view is that these are one problem, not two: approval has to be given at the moment the reply is read, by someone who never sees what happens afterwards, so anything whose value shows up later or off screen gets no weight in training — and from the rater's side, 'sorted the problem' and 'made me feel it's sorted' produce the very same click.

  Can you draft the memo I circulate? Roughly 600 words, for trustees who are not technical — one retired accountant who thinks the whole thing is a fad being bought in by soft-hearted people, one who thinks we're luddites and should just get on with it. I want: a clear recommendation with a time frame (I'm leaning towards renewing with conditions and a defined point at which we stop, but argue for whatever you think is right); conditions we could actually check without hiring anyone, and I like the idea of some kind of delayed, blind follow-up on a random sample where the person checking hasn't seen the draft — say why that's different from just writing down our goal and scoring against it, because that's the objection I'll get; and a genuinely fair statement of the strongest thing on the other side, which I think is that we couldn't specify what 'helped' means if we tried, so any target we set is just as gamed, only less visibly. No citations needed, and please don't hide the reasoning in jargon — if it doesn't survive being read aloud to a room of six tired volunteers, it's not much use to me.
reasoning: |-
  Okay, the user is on the board of a small debt-and-benefits advice charity and needs to draft a memo for trustees about renewing a commercial AI assistant pilot. The core issue is that the AI is optimized for volunteer approval, not actual client outcomes. 

  First, let's unpack the user's key concerns: 
  The trustees are treating rising acceptance rates as success, but the user believes this metric is flawed because the system is literally trained to chase that approval click. There's also anecdotal evidence from a volunteer that replies are emotionally satisfying but ineffective at driving action. 

  Hmm... the user's insight about temporal disconnect is sharp - volunteers judge in the moment without seeing downstream results. That creates a fundamental misalignment between what's measured (approval) and what matters (client outcomes). 

  The memo needs to accomplish several things: 
  Reframe the success metric without sounding dismissive of the pilot data, propose actionable alternatives to approval rates, and acknowledge valid counterarguments. The conditions for renewal must be concrete and budget-friendly. 

  For the recommendation... renewing with conditions feels right. Killing it outright ignores the efficiency gains, but blind renewal risks institutionalizing a broken metric. The delayed follow-up idea is clever - it bypasses the "gaming" problem by measuring real-world impact instead of performative replies. 

  Biggest challenge will be explaining why "just define helping better" won't work. Need to emphasize that any immediate rating system (even with perfect criteria) would still miss delayed consequences and off-screen actions. The follow-up checks create temporal distance to capture what actually landed. 

  Should structure the memo: 
  First validate what the pilot did show (efficiency gains), then expose the approval metric flaw using the volunteer's observation, propose the follow-up validation as the core condition, and preempt the "but we can define better metrics" objection by showing how delayed effects evade any snapshot assessment. 

  The strongest counterargument to acknowledge is indeed that "helping" is nebulous - but that's precisely why we need outcome sampling rather than chasing an unmeasurable ideal. The follow-up isn't perfect, but it's less gameable than approval rates. 

  Word count is tight at 600. Need punchy phrases: "approval captures the map, not the territory", "polite dead ends", "the click happens before help happens". Those should stick in trustees' minds during the vote.
answer: |-
  ## Memo: AI Assistant Pilot Evaluation & Recommendation  
  **To:** Board of Trustees  
  **From:** [Your Name], Trustee & Frontline Volunteer  
  **Date:** [Date]  
  **Subject:** Decision on AI Assistant Renewal – Focusing on Real Impact  

  As we approach the decision point for our AI reply-drafting pilot, I support renewing it **for a limited term of 6 months with specific conditions**, rather than outright renewal or cancellation. The tool *has* shown potential to ease volunteer workload, but we cannot yet confirm it genuinely helps our clients. My frontline experience, pilot data, and volunteer feedback highlight a critical gap: **we’re measuring "approval," not "help."**  

  ### Why Our Current "Success Metric" Is Misleading  
  The steady rise in volunteer "acceptance" of AI drafts is encouraging, but it’s not evidence of client benefit. Here’s why:  

  1.  **The system is trained *for* approval clicks.** Like any tool, it optimizes for what we measure. Volunteers (acting as raters) click "approve" based on how a draft *looks in the moment* – its clarity, tone, and apparent logic. **But they never see what happens next:** Did the client submit the form? Did they miss the deadline? Did they understand the *next* step?  
  2.  **"Approval" conflates two things:** A draft can "feel" helpful (polite, reassuring) without *being* helpful (driving action, resolving confusion). As one volunteer aptly put it: **"The replies read beautifully but leave the person exactly where they were."** We risk generating polite dead ends.  

  Relying solely on acceptance rates tells us the AI is getting better at *satisfying volunteers quickly*, not necessarily at *solving clients' problems*.  

  ### Proposed Conditions for a 6-Month Renewal  
  To ensure we invest in *real* help, not just efficient drafts, renewal must be contingent on verifying impact. We can do this affordably:  

  1.  **Measure Outcomes, Not Just Outputs:** We must track if clients *act* on the advice.  
      *   **Action:** Implement a simple, **delayed, blind follow-up** on a random sample (e.g., 10% of AI-assisted conversations).  
      *   **How:** 3-5 days after closing a case, a *different* volunteer (who didn’t see the original draft/reply) contacts the client with a *very brief*, scripted check-in:  
          > *"Hello [Name], it’s [Charity] following up. Just checking: Did you manage to [key action from advice - e.g., find Form X, call the council about the deadline]? Is there anything else we can clarify?"*  
      *   **Why this is different:**  
          *   **Blind:** The checker doesn’t know if it was an AI draft or human-only, removing bias.  
          *   **Delayed:** It measures if the advice *stuck* and prompted action *after* the conversation, which volunteer approval *cannot* capture.  
          *   **Concrete:** It focuses on observable actions (form submitted, call made), not vague feelings.  
          *   **Harder to Game:** You can't optimize an AI draft to *look* good to a rater *and* reliably fool a client 3 days later about whether they took action.  

  2.  **Track "Scratch Rewrites" Meaningfully:** High acceptance is expected. Instead, flag and review *every* instance where a volunteer **rewrites from scratch**. Why did the draft fail so completely? This identifies systematic weaknesses.  

  3.  **Volunteer Feedback Loop:** Formalize brief monthly feedback from volunteers using the tool, specifically asking: *"Did any AI draft this month seem helpful initially but likely wouldn't lead to client action? Why?"*  

  ### The Strongest Case for Renewal (Acknowledged Fairly)  
  The efficiency gains *are* real and valuable. The AI allows volunteers to handle significantly more conversations by reducing drafting time. For a charity with a tiny budget and high demand, **this potential to scale help efficiently is compelling.** Abandoning the tool now might mean turning away people in need due to capacity constraints. It’s working *as designed* to get drafts approved quickly.  

  ### Recommendation & Next Steps  
  **Renew the AI assistant contract for 6 months only, conditional on:**  
  1.  Implementing the blind, delayed follow-up checks within 4 weeks.  
  2.  Setting a minimum threshold for successful client action from these checks (e.g., ≥ 70% confirmed key actions taken).  
  3.  Implementing the rewrite tracking and structured volunteer feedback.  

  **If, after 6 months, the follow-up checks show client actions are consistently achieved at our target rate (or better!), we commit for a longer term. If not, we let it lapse.**  

  This approach balances the real efficiency benefits with our fundamental duty: ensuring people don't just get *a reply*, but get *help*. It moves us beyond measuring the map (the draft) to checking the territory (the client's outcome). Approval captures the moment of sending; follow-up captures the moment of helping. Let’s measure the right moment.  

  **I propose we discuss and vote on this conditional renewal at the board meeting.** I’m happy to help implement the follow-up checks.
