prompt: |-
  I do a lot of back-of-envelope estimating at work (freight and warehouse planning, mostly) and I'm in a small forecasting group where we score our own predictions afterwards, and I keep runnning into a pattern I don't have a word for. It's become the thing I most want vocabulary for, because I think it's why my multi-step estimates are badly calibrated while my one-step ones are fine.

  Here's the shape of it. Say I'm estimating how many warehouses in a mid-size country will be running some kind of automated picking within ten years. I split it into three links: the share of firms that will have heard about the tech seriously enough to evaluate it; the share of those that pilot it; the share of pilots that become permanent installations. For each link I jot a range, take roughly the geometric middle, and then I tell myself the errors are independent across links, so they partly cancel in log space and the product is probably good to within a factor of three. But all three of my ranges were produced inside one background story — roughly, that this spreads sideways through industry contacts rather than being sold top-down by vendors — and if that story is wrong, all three links shift together, in the same direction, at once. The same thing happened last month with a totally different chain: whether a local transit referendum passes, decomposed into registration, turnout among the registered, and margin among those who turn out. Three links, one background story about who shows up to vote on things like this, same feeling.

  The bit I actually want named is what happens next, and it's the part I can't find discussed anywhere. If I write the background story down at the top of the page as an explicit stated assumption, everything underneath it immediately starts feeling independent again — I read back over the three links and they look like separate, separately checkable claims, and I go back to multiplying. It's as if writing the shared thing down removes it from the calculation instead of adding it in as one more uncertain node. And I can't tell which of two mistakes I'm making: either I'm charging the same ignorance twice (once inside each link's error bar, and then again at the end when I say the whole thing could be off anyway), so my intervals are absurdly wide, or I've quietly dropped the shared story's uncertainty entirely, so they're far too narrow. A friend said this is just model uncertainty versus parameter uncertainty, but that doesn't seem to capture the part where the act of writing the story down changes how the rest of the argument feels to me, and it doesn't tell me which of the two mistakes I'm making or how to tell in a given case.

  So: is there an established concept for this — links of a heuristic argument sharing a background scenario, the dependence going invisible once the scenario is stated explicitly, and the resulting inability to tell double-counting from dropping? If yes, I want to know how it differs from the neighbours it could be confused with: ordinary common-cause correlation, model versus parameter uncertainty, systematic versus random error in measurement, and the general habit of neglecting correlation when you combine estimates. If there's no established concept, coin a term and define it tightly enough that I could look at a given chain of reasoning and say whether it's present, and give me a couple of boundary cases where it is and isn't happening — I'm after the carving, not a label, so a bare name won't satisfy me. I'd also like to know what a defensible version of the independence presumption would even look like here: what would have to be true of my three links for multiplying them to be licensed at all, and is there a way of writing the background story into the argument as a node that actually fixes the problem rather than hiding it?

  Lead with your bottom line in the first sentence, then give me the reasoning — no preamble, and don't restate my question back at me.
reasoning: |-
  Alright, let's tackle this user's problem. They're dealing with multi-step estimates in freight and warehouse planning, where their one-step predictions are fine but the chained ones go awry. The core issue is that when they break down a problem into three links (like adoption stages for warehouse tech), they assume independence, but all links share a hidden background story. Once they write that story down as an explicit assumption, the links suddenly feel independent again—even though they shouldn't. 

  First, I need to identify the psychological trap here. The key is that writing down the background story creates an illusion of separation. The user mentions that after making the assumption explicit, the links appear separately checkable. That feels like a cognitive bias—maybe something related to how our brains handle explicit vs. implicit information. 

  Next, I recall concepts like model uncertainty vs. parameter uncertainty. The friend mentioned it, but the user says it doesn't capture the feeling shift. So I need something deeper. The act of writing the story down might make it seem like a fixed condition, so the links are now conditional on that model. But the user hasn't actually quantified the model's uncertainty. That's the double-counting vs. dropping dilemma: either they're including the story's uncertainty in each link (causing overlap) or ignoring it entirely after writing it down.

  I think the established concept here is "assumption anchoring." It's a cognitive bias where stating an assumption makes it feel like a solid anchor, reducing perceived uncertainty in dependent variables. But I should verify if there's a better term. Maybe "common-cause blindness" or "scenario freezing"? No, "assumption-induced independence illusion" seems more precise. The idea is that the explicit assumption creates a false sense of independence among the links.

  Now, differentiating from neighboring concepts. Common-cause correlation is about statistical dependence, but here it's the cognitive effect of writing down the cause that's key. Model uncertainty is part of it, but the unique twist is the psychological shift. Systematic error is related, but again, the focus is on the mental process after making assumptions explicit.

  For defensible solutions, the user needs to treat the background story as a node with its own uncertainty. Assign a probability distribution to the scenario itself. Then, use conditional probabilities for each link given the scenario, but also account for other possible scenarios. Monte Carlo simulations could help propagate the combined uncertainties, including the scenario's.

  Boundary cases: If the links truly are independent (e.g., physical processes with no shared drivers), then multiplying is fine. But if they all hinge on one narrative (like voter behavior based on a single event), that's where the illusion kicks in. The user’s examples clearly fall into the latter.

  Finally, the user wants to know how to spot this in their reasoning. They should check if altering the background story would shift all links in the same direction. If yes, then assumption anchoring is likely at play. The key is to quantify the scenario's uncertainty explicitly, not just state it.
answer: |-
  The established concept you're grappling with is **assumption-induced independence illusion**, a cognitive bias where explicitly stating a shared background assumption creates a false perception that dependent estimation steps are conditionally independent.

  ### Core Mechanism & Differentiation
  1. **How it differs from common-cause correlation**:  
     Unlike statistical correlation, this is a *reasoning fallacy*. When the shared assumption is implicit, you intuitively sense the dependence ("*if that story is wrong, all three links shift together*"). Explicitly stating it creates a psychological partition: the assumption becomes a "fixed" condition, making subsequent steps *feel* like independent sub-models operating under that condition. The dependence isn't omitted—it's misattributed as resolved.

  2. **Why "model vs. parameter" doesn't fit**:  
     Model uncertainty typically compares entire frameworks (e.g., linear vs. exponential growth). Here, the *same* model (your decomposition) has steps sharing latent drivers. Writing the assumption doesn't change the model—it creates false security about isolating uncertainties.

  3. **Systematic error vs. random error**:  
     This is systematic error *in the estimation process itself*, induced by how you structure your reasoning. The bias arises from mental accounting, not measurement.

  4. **Boundary Cases**:  
     - **Present**: Estimating warehouse automation adoption under a "peer diffusion" scenario. Altering the scenario (e.g., "vendor-driven adoption") would shift all three links.  
     - **Absent**: Estimating total shipping costs decomposed into fuel price, route distance, and labor hours. These may share no common narrative driver; errors could be genuinely independent.

  ### Your Mistake: Double-Counting *and* Dropping
  - **Double-counting**: Each link's range *implicitly includes* uncertainty about the background story (e.g., your "pilot adoption" estimate bakes in assumptions about industry awareness).  
  - **Dropping**: When you write the story explicitly, you *cease propagating* its uncertainty through the chain. You treat it as resolved, neglecting that it remains a variable.  
  **Result**: Your final intervals are **too narrow** because the shared assumption's uncertainty is excluded at the system level.

  ### Defensible Solution: Scenario-Weighted Uncertainty
  To license independence, you must either:  
  (A) **Eliminate shared drivers** (impossible here), or  
  (B) **Explicitly quantify scenario uncertainty** and condition on it.  

  **Practical fix**:  
  1. Add the background story as a **formal node** with its own probability distribution (e.g., "Peer-led diffusion: 60% confidence, Vendor-driven: 25%, Regulatory push: 15%").  
  2. Define your three links *conditionally* for each scenario (e.g., under "vendor-driven," pilot rates may be higher).  
  3. Propagate uncertainty via **Monte Carlo simulation**:  
     - Sample a scenario → sample each link's value conditioned on that scenario → multiply.  
     - Repeat 10,000×. The output distribution incorporates *both* scenario uncertainty and conditional step dependencies.  

  **Why this works**: It forces you to confront that links covary *within* scenarios, while scenarios themselves compete. The geometric mean approach fails because it can't capture cross-scenario dependencies.

  ### Key Test for Future Reasoning
  Ask: *"If this background assumption is invalid, would all steps likely err in the same direction?"* If yes, you're vulnerable to this illusion. Quantify the assumption first—before decomposing steps—or your intervals will remain deceptively narrow.
