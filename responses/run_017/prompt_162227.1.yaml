  Therefore, in the original setup, if Sparse and Dense differ in the total number of observers, but we don't know how that breaks down by reference class, then we cannot do the update. We need more structure.

  But the problem does not specify, so we must assume that the reference class is fixed and that we know how the total number of observers relates to the reference class. Typically, in the doomsday argument, we assume that the total number of humans is the same as the total number of observers? Or that the reference class is the set of all observers? That would be problematic because then we would be conditioning on being an observer, which we are, and then the reference class is the entire set. Then if we condition on our exact evidence, we get the collapse.

