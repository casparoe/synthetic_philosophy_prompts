  So the answer is to reject step (3) by conditioning on a reference class that is a subset of the observers and that does not make the evidence unique across the entire set of observers, but only within the reference class. Then we avoid the collapse.

  In summary:

  - We reject step (3) because the evidence we condition on is not the full microstate but a coarser description that is relevant and that may be shared by others in a different hypothesis (as in the duplicates scenario) and even without duplicates, we condition on being in a reference class and having a particular property (like birth rank) that is unique within the reference class but not necessarily in the entire set of observers.

