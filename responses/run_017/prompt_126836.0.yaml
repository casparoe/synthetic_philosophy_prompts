  1.  **Tense & Focus:** Relentless use of present tense, present continuous tense, and indexicals ("right now," "today," "this moment," "this second"). This satisfies the Presentist by only discussing the current moment/states/actions and avoids future facts. It satisfies the Perdurantist by describing the actions and properties of the current temporal stage.
  2.  **Dispositions:** Heavy reliance on describing current states that imply future action only through *current dispositions* (e.g., "they are resolved," "the strength of their character," "their intention," "the love they hold today," "the determination they possess at this instant"). This directly incorporates the sister's view on vows without naming it.
  3.  **Pivot Line:** "Right here, right now... they are choosing each other..." encapsulates the entire approach: observable current action and commitment. It's the emotional and philosophical core.
  4.  **Grandmother Nod:** "Love is a choice we make every single day" invokes commitment and endurance through the lens of *present, repeated action*, avoiding the future fact of "until death." It's true for both philosophies *today*.
  5.  **Joke:** The porch swing anecdote is relatable family humor that also serves as evidence of a past stage exhibiting dispositions consistent with the current stage's actions (teamwork, commitment).
  6.  **Physicist Nod:** The "solid block" reference in the final toast is purely metaphorical and attributed to a *perspective*, not stated as fact. It's a wink, not a claim.
  7.  **Avoiding Pitfalls:** No predictions ("they will be..."), no essentialist claims ("meant to be," "soulmates"), no explicit metaphysics. "Endless potential" and "ever-unfolding story" focus on the *present quality* and *process*.
  8.  **Emotion:** Grounds warmth, love, and celebration firmly in the observable reality of the couple's actions and feelings *at this very moment*.

  This toast celebrates the couple profoundly within the strict constraints, making the philosophical adherence the source of its unique emotional resonance. Good luck!
