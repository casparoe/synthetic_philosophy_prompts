  The key insight from the user's approach - focusing on the "now" - is brilliant. It creates common ground: the presentist acknowledges the current moment, while the eternalist accepts it as a temporal coordinate. Dispositional language ("committing now") rather than predictive statements solves the future-tense problem. The sister's unspoken dispositional theory of vows becomes the perfect framework.

  For structure: Opening with pure observation of the current scene (flowers, light) satisfies all constraints. The pivot line about the couple's current actions needs to carry the emotional weight while being technically accurate. The grandmother's line must imply permanence through present disposition ("as long as they live" rather than "until death"). The single joke should play on the room's awareness without explicating philosophy.

  The temporal audit is crucial - every verb tense must be scrutinized. Present tense is safest, dispositions can imply futures, and "timeless" adjectives avoid tense entirely. References to shared history must be framed as current memories. Even the champagne reference gets audited.

  For emotional resonance: The toast must make technical precision feel warm. Focusing on the couple's current expressions and choices keeps it immediate. The "chain of choices" metaphor nods to perdurantism without naming it. Ending on the shared moment brings everyone into the celebration.

  This requires surgical wording. Phrases like "what we see right now" keep it presentist-valid, while "this moment in their story" subtly acknowledges eternalism. The physicist gets a single "block universe" reference disguised as a champagne toast. The crying cousins get the "look around" moment to absorb the love in the room.
