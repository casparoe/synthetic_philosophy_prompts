answer: |-
  ### 1. **Pseudo-Code Language**  
  **Primitives** (all lowercase, whitespace-insensitive):  
  - `cooperate`, `defect`: Actions.  
  - `self()`: Returns program's source as a string (no cost).  
  - `inspect(opponent)`: Returns opponent's source as a string (cost: 1 point).  
  - `same_code(a, b)`: Returns `True` if strings `a` and `b` are identical after removing non-alphanumeric chars (e.g., `"IF X THEN Y"` ≡ `"if x then y"`).  
  - `if(condition, action_if_true, action_if_false)`: Evaluates to an action.  

  **Example Program** (Identity Checker):  
  ```  
  if(same_code(self(), inspect(opponent)), cooperate, defect)  
  ```  

  **Adjudication Rules**:  
  - **Malformed programs** (syntax errors, invalid tokens): Default to `defect` with no inspection cost.  
  - **Non-halting programs** (e.g., infinite recursion): Terminate after 10 steps → `defect`; charge costs incurred.  
  - **Worked Example** (A vs. B, both Identity Checkers):  
    - A calls `inspect(B)` (cost: −1), gets B’s source.  
    - `same_code(A, B)` → `True` → A outputs `cooperate`.  
    - B does the same.  
    - **Payoff**: Both get (R − c) = (3 − 1) = 2 points.  

  ---

  ### 2. **Payoff Scheme**  
  **PD Payoffs** (per round):  
  - Mutual cooperation: **3 pts**  
  - Mutual defection: **1 pt**  
  - Exploiter (defect vs. cooperate): **5 pts**  
  - Exploited (cooperate vs. defect): **0 pts**  
  - **Inspection cost**: −1 pt per `inspect` call.  

  **Calibration**:  
  - Cost = 1 ensures:  
    - Blind cooperation (no inspect) risks 0 against defectors but nets 3 against cooperators.  
    - Identity check nets 2 against itself (after cost) but 4 against blind cooperators.  
    - Free verification is punished: Over-inspecting drops mutual cooperation to 2.  
  **Stakes**: 1 chocolate coin = 5 points (trivial but motivating).  

  ---

  ### 3. **Handout Text & Protocol**  
  **Handout (Round 2+ Instructions)**:  
  > "Submit a program that outputs `cooperate` or `defect`. You may use:  
  > - `cooperate`, `defect`  
  > - `self()`: Your own code.  
  > - `inspect(opponent)`: Opponent’s code (costs 1 pt).  
  > - `same_code(a, b)`: True if `a` and `b` are functionally identical (ignores spaces/comments).  
  > - `if(cond, action_if_true, action_if_false)`  
  > Programs run anonymously. Malformed/non-halting → `defect`."  

  **Anti-Coordination Protocol**:  
  - Submit handwritten code on uniform paper.  
  - Shuffle submissions, assign random IDs.  
  - Pair programs randomly each round.  
  - **Enforcement**:  
    - Ban pre-game discussions.  
    - Collect phones.  
    - State: "Programs must stand alone; no shared conventions."  

  ---

  ### 4. **Debrief Map**  
  - **Identity Check Invention**: "In Round 2, many of you wrote: `if(same_code(self(), inspect(opponent)), cooperate, defect)`. Why?" → *Players discover syntactic mutual recognition enables cooperation.*  
  - **Bully Programs & Equilibrium Diversity**: "Some submitted `cooperate` unconditionally; others submitted `defect`. What happened when bullies (only cooperate with self) met altruists?" → *Equilibrium includes mutual defection, mutual identity-check, and exploiters.*  
  - **Rewriter Round**: "In Round 3, one side’s code was reformatted. Why did identity checks break?" → *Cooperation relied on syntax, not semantics.*  
  - **Sandbox Round (If Run)**: "When you could probe behavior (e.g., `if(same_code(test(opponent, cooperate), cooperate), cooperate, defect)`), what happened?" → *Cooperating-with-all and cooperating-with-cooperators are indistinguishable under testing.*  

  ---

  ### 5. **What the Activity Cannot Reproduce**  
  **Gaps to Acknowledge**:  
  - **Self-reference**: "We gave you `self()`—but real agents need self-knowledge through quining/fixed points."  
  - **Fixed points**: "We assumed programs can exist; proving they *must* exist requires diagonalization."  
  - **Acausal reasoning**: "This isn’t ‘if I defect, they defect’ superrationality; it’s code-conditioning."  
  **Delivery**: Pose as open questions during debrief: "What’s the difference between recognizing code vs. recognizing intent?"  

  ---

  ### 6. **Predictable Failures & Mitigation**  
  - **Formatting mismatches**: Use `same_code` (normalizes strings) to ignore whitespace/comments.  
  - **Personal exploitation**: Emphasize anonymity; remind players it’s about program strategies.  
  - **Rewriter as "gotcha"**: Preface: "We’ll test your programs’ robustness."  
  - **Clock**: Strict 15-min/round. Skip sandbox if behind.  
  - **Adjudication backlog**: Pre-calc 5–10 common pairs; use assistants.  

  ---

  ### **Least Confident Elements & Contested Readings**  
  **Least Confident**: The **rewriter round** may feel artificially disruptive. Players might dismiss it as a "trick" rather than seeing syntax-dependence as fundamental.  
  **Contested Reading**: The design assumes **programs as actions** dissolves dominance *without* requiring acausal reasoning (à la Hofstadter). Critics may argue true cooperation requires symmetric reasoning.  
  **Watch For**:  
  - **Round 2**: If >60% submit identity checks, proceed. If dominated by defectors, pause to discuss why.  
  - **Rewriter fallout**: If players revolt ("this is unfair!"), clarify: "Real agents don’t share syntax."  
  - **Sandbox skip**: If time or complexity overwhelms, drop it and discuss "behavioral equivalence" verbally.  

  ---

  ### **Session Flow**  
  1. **Round 1 (Baseline PD)**: 10 min (submit action; random pairing).  
  2. **Round 2 (Programs)**: 20 min (submit code; adjudicate; show payoffs).  
  3. **Round 3 (Rewriter)**: 20 min (reformat one random half; re-pair).  
  4. **Optional Sandbox**: 15 min (replace `inspect` with `test(opponent, probe)`).  
  5. **Debrief**: 25 min (map insights; acknowledge gaps).  

  **Total**: 90 min.  
  **Abort Triggers**:  
  - Round 2 has <3 identity checks → Discuss dominance dissolution hypothetically.  
  - Rewriter round causes confusion → Jump to debrief with: "What if code appearance changes?"  
  - Sandbox overcomplicates → Skip and say: "Probing reveals only behavior, not intent."  

  ---
  This design forces confrontation with syntactic cooperation’s fragility while sidestepping metaphysical debates. The key is tight facilitation—keep rounds snappy, debrief grounded in player experiences.
