  We are designing a 90-minute session with 14 participants. The goal is to have participants experience the move from choosing an action to submitting a program that chooses on their behalf, and to see how this can dissolve the dominance argument for defection in a one-shot Prisoner's Dilemma (PD). Then, we want them to realize that the cooperation they achieve is fragile and rests on something thinner than mutual recognition.

  The provisional design has three rounds (plus an optional fourth):

  1. Baseline: Anonymous one-shot PD.
  2. Program submission with inspection: Each submits a program in a tiny pseudo-code. The program can inspect the opponent's source code at a small cost. We will have a rewriter that is applied randomly to one side in the next round to break simple identity checks.
  3. Rewriter round: A meaning-preserving rewriter is applied randomly to one side of each pairing before inspection. This breaks character-for-character identity checks.
  4. (Optional) Sandbox round: Instead of inspection, you can run the opponent's program against a probe and see the output.

  We need:

  1. The pseudo-code language (minimal primitives, with self-reference and opponent reference, and conditionals on syntactic/behavioral relations). Must be adjudicable by hand in under a minute. Include a worked example and rules for malformed/non-halting programs.
  2. Payoff scheme: Inspection cost calibrated so that blind cooperation and free verification are not trivially right. Use trivial stakes (like chocolate).
  3. Handout text and submission protocol to prevent out-of-band coordination.
  4. Debrief mapping moments to insights.
  5. What the activity cannot reproduce and how to explain those gaps without lecturing.
  6. Predictable problems and how to handle them.

  Also, be explicit about the least confident part, which contested reading the design takes sides on, and what to watch for to adjust the session.

  Let's tackle each part.

  ---

  ### 1. Pseudo-Code Language

  We need a minimal language. Primitives:

  - `COOPERATE`, `DEFECT`: the two actions.
  - `INSPECT(opponent)`: returns the source code of the opponent's program as a string, but with a cost. We will subtract an inspection cost `c` from the payoff.
  - `SELF`: returns the program's own source code as a string.
  - Conditional: `IF condition THEN action1 ELSE action2`
  - String comparison: `STRCMP(s1, s2)` returns true if strings are identical, false otherwise. We might also allow substring checks? But to keep minimal, let's stick with exact string equality for now.

  We also need a way to represent the program. We can have a single expression that evaluates to either `COOPERATE` or `DEFECT`.

  Example program that cooperates only if the opponent's code is identical to its own:

  ```
  IF STRCMP(SELF(), INSPECT(opponent)) THEN COOPERATE ELSE DEFECT
  ```

  But note: if both do this, they both inspect and pay the cost `c`, then they both see that the codes are identical and cooperate. So they get (R - c) each, where R is the reward for mutual cooperation.

  We must also handle the case when a program does not inspect? We can have the language so that the program must return an action. We can assume that if they don't call `INSPECT`, they don't pay the cost.

  But note: the `INSPECT` function is called conditionally? We must define the semantics: if the program calls `INSPECT`, then the cost is incurred regardless of whether the result is used? Or only if the call happens? We'll say: the cost `c` is subtracted from the player's payoff if and only if the `INSPECT` function is called during the execution of the program.

  We also need to handle non-halting or malformed programs. We can say:

  - If the program does not halt (e.g., infinite loop) within a reasonable number of steps (we can set an arbitrary limit, say 100 steps of evaluation), then it is considered to defect and pay no inspection cost? Or we could say it's an error and then we use a default action (maybe defect). Similarly, if the program is malformed (syntax error), then it defaults to defection.

  But note: we want to adjudicate by hand quickly. So we must keep the programs very simple.

  Let's define the language more formally:

  A program is an expression that can be:
  - `COOPERATE` or `DEFECT` (which evaluate to that action)
  - `INSPECT(opponent)` which evaluates to the opponent's source code string (and flags that the cost `c` should be charged)
  - `SELF()` which returns the program's own source code string (no cost)
  - `STRCMP(s1, s2)` which returns `True` or `False`
  - `IF condition THEN expr1 ELSE expr2` where condition is an expression that evaluates to a boolean (like `STRCMP` or a constant), and `expr1` and `expr2` are expressions.

  We'll assume that the expression is evaluated in a straightforward way.

  Worked adjudication for a pair:

  Program A:
  ```
  IF STRCMP(SELF(), INSPECT(opponent)) THEN COOPERATE ELSE DEFECT
  ```

  Program B: same as A.

  When A plays B:

  - A runs: it calls `INSPECT(B)`, so A pays cost `c`. It gets B's source as a string. Then it calls `SELF()` to get its own source. Then it compares: since A and B are identical, `STRCMP` returns True. So A returns COOPERATE.
  Similarly, B runs: same steps, returns COOPERATE.

  Payoffs: both get R (the reward for mutual cooperation) minus c.

  Now, what if we have a program that doesn't inspect? For example:

  Program C: just `COOPERATE`

  When C plays A:

