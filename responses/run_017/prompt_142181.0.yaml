  ### Handout Text for Round 2

  "Round 2: Program Submission

  In this round, you will write a small program that decides whether to Cooperate or Defect. The program has access to its own source code and the source code of the opponent (at a cost). The language you can use has the following:

  - Actions: `COOPERATE` and `DEFECT`
  - `SELF()`: returns your own program's source code as a string.
  - `INSPECT(opponent)`: returns the opponent's program's source code as a string. However, each time you use `INSPECT`, it costs 1 point (subtracted from your payoff in that round).
  - `STRCMP(s1, s2)`: compares two strings and returns `True` if they are exactly the same, `False` otherwise.
  - `IF condition THEN action1 ELSE action2`: conditional.

  Example programs:

  1. Always cooperate: 
     ```
     COOPERATE
     ```

  2. Always defect:
     ```
     DEFECT
     ```

  3. Cooperate only if the opponent's code is identical to your own:
     ```
     IF STRCMP(SELF(), INSPECT(opponent)) THEN COOPERATE ELSE DEFECT
     ```

  Write your program on the submission sheet. We will run your program against the program of a randomly assigned opponent. 

  Rules:
  - Your program must be a single expression that evaluates to `COOPERATE` or `DEFECT`.
  - If your program has a syntax error, it will be treated as `DEFECT`.
  - If your program does not halt within 10 steps, it will be treated as `DEFECT`, and any `INSPECT` calls made in those steps will still cost 1 point.

  You must write your program independently, without discussing with others. Do not use any conventions or pre-agreed signals. The goal is to explore how programs can interact.

  Submit your program now. You will have 5 minutes to write it."

