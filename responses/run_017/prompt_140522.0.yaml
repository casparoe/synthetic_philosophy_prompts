prompt: |-
  My flatmate and I spent a solid two hours after the pub last night going round in circles about whether a heart that was assembled molecule by molecule in a lab — never evolved, never selected for anything, sitting in a creature that will never reproduce — would still have the function of pumping blood. I said obviously yes, it does something; he said no, nothing is *for* anything there. We got nowhere, mainly because we kept sliding between 'what it does' and 'what it's for' without noticing.

  I've got to run a fifty-minute seminar for second-year phil of biology students on the etiological vs causal-role accounts of function next week, so give me the plan, not the explanation. Specifically:

  - what has to be in place before either account even looks like an answer to a question — I think the load-bearing bit is that they're answering different questions (why is it there at all / what does it contribute to some larger capacity), and I want that ordering to do real work rather than be a preamble
  - one case to carry the whole thing, and what such a case must have and must lack. Is the heart actually the wrong choice, given they'll all say 'pumping, obviously' and switch off? I want something with two real effects where only one is pre-theoretically 'what it's for', no designer anywhere in it, and enough room to run the same case through both accounts
  - the misconceptions in the order they'll actually form, with where in the sequence to head each off: 'function just means what it does', 'the evolutionary one smuggles in purpose or a designer', 'if it has a function it must be helping the organism right now', and the one I'm least sure how to handle — that the causal-role account hands out a function to everything, including the noise the heart makes
  - where the pair stop disagreeing about facts and start disagreeing about words, and whether to say that out loud at this level
  - what to flatly refuse to get into in fifty minutes
  - one question at around minute forty that would tell me the distinction has landed rather than them having memorised 'selected effect vs current contribution'
reasoning: |-
  Okay, the user is a philosophy of biology instructor preparing a seminar on etiological vs. causal-role accounts of function. They need a tight 50-minute plan centered on one case study, with specific attention to pre-theoretical assumptions and common misconceptions. 

  First, their pub debate reveals the core confusion: conflating "what it does" with "what it's for." The seminar must prevent this slide by structurally separating the questions each account answers. 

  The heart example is problematic because its pumping function feels too obvious. I need a case with two effects where only one is intuitively functional. Sperm comes to mind - motility and nutrient delivery both occur, but only motility is "for" fertilization. Crucially, the Warbler's alarm call has the same dual-effect structure: it warns kin (functional) but also alerts predators (side effect). This meets all criteria: no designer, biological context, clear pre-theoretical intuition. 

  Key structural move: Before introducing accounts, establish that "function" isn't self-evident by presenting the Warbler case and polling students. Force them to notice their own intuition that warning kin is "the function" while alerting predators is "just something it does." This creates the necessary puzzlement. 

  For misconceptions: 
  - "Function = what it does" will arise immediately with causal-role. Preempt by contrasting Warbler's two effects during the CR explanation. 
  - "Etiology smuggles purpose" can be headed off by emphasizing differential reproduction (not intent) as the selector. 
  - "Must help now" misconception requires stressing that etiological function persists even if harmful today (e.g., Warbler call in predator-rich area). 
  - The "CR gives functions to everything" objection is actually useful - embrace it when discussing the heart's lub-dub sound. Show how CR's liberality reveals its different purpose (system analysis vs. historical explanation).

  The word/disagreement transition happens when both accounts agree on Warbler call's causal contributions but disagree on which one counts as "the function." Should explicitly label this as conceptual divergence, not factual dispute. 

  Hard boundaries: No time for pluralism debates, extended history, or non-biological artifacts. Stay focused on biological cases. 

  The diagnostic question at 40 mins: "Could the Warbler call lose its etiological function while keeping its causal-role function?" Tests if they grasp etiology's dependence on history vs CR's ahistorical nature. 

  Pacing will be tight: 5 mins setup, 15 min per account using Warbler case, 10 min comparison, 5 min misconception cleanup, 5 min Q&A. Must ruthlessly skip tangents.
answer: |-
  Here’s a streamlined seminar plan focused on the core distinction, using a targeted case study to force the issue. Time allocations are cumulative.

  **Core Structure: The Two Questions Framework**  
  *(Total: 5 mins)*  
  - **Start here:** "Before asking 'what is its function?', ask: *What question are we trying to answer?*"  
  - **Question 1 (Etiological):** "Why does this trait *exist* in this system/organism? (History)"  
  - **Question 2 (Causal-Role):** "What does this trait *contribute* to a current capacity of the system? (Now)"  
  - **Key move:** "These aren't rivals—they solve different puzzles. Today’s job: map accounts to questions."  

  **The Case Study: Warbler Alarm Call**  
  *(Introduce at 5 mins; use throughout)*  
  - **Why it works:**  
    - **Does two things:** (1) Warns kin (increases their survival), (2) Attracts predators to caller (decreases *its* survival).  
    - **Pre-theoretical intuition:** Warning kin feels like "the function"; attracting predators feels like a "side effect."  
    - **No designer:** Naturally selected trait.  
    - **Room for both accounts:** Etiology explains *why selection favored it* (kin warning outweighs cost); CR explains *its current role* in the flock’s anti-predator system.  

  **Etiological Account (Selected Effects)**  
  *(10-25 mins)*  
  - **Core:** Function = what the trait was *selected for*. Answer to "Why is it here?"  
  - **Run the case:**  
    - Alarm calls exist *because* they increased inclusive fitness (kin survival) in ancestors.  
    - Attracting predators was *not* selected for → not its function, even if it happens.  
  - **Preempt misconception:**  
    - *"Smuggles purpose/designer?"* → NO. Stress: "Selection for" ≠ intent. It’s differential reproduction, not a plan. (Use *"was selected for"* language, not *"has a purpose"*.)  
    - *"Must help now?"* → NO. If predators change and calls now *only* attract predators, etiological function *remains* warning kin.  

  **Causal-Role Account (Cummins-style)**  
  *(25-40 mins)*  
  - **Core:** Function = what the trait *contributes* to a system’s capacity. Answer to "What does it do in this context?"  
  - **Run the case:**  
    - In the flock’s "predator avoidance system," the call’s function is *warning others*.  
    - In the caller’s "self-preservation system," attracting predators is a *dysfunction*.  
  - **Preempt misconceptions:**  
    - *"Function just means what it does?"* → YES, BUT: CR specifies *relevant* effects within an *analytical context* (e.g., "contributing to predator avoidance").  
    - *"Hands out functions to everything?"* → YES, strategically. *Apply to heart:* Lub-dub sound *can* have a CR function if we analyze "diagnostic capacity of the circulatory system." Etiology *restricts* functions to selected effects.  

  **Clash & Conceptual Divergence**  
  *(40-45 mins)*  
  - **Where disagreement shifts to words:** When both agree on *what the trait does* (e.g., alarm call warns kin *and* attracts predators) but disagree on which effect is "the function."  
  - **Say this explicitly:** "They’re not fighting about facts. They’re telling you which *question* they think ‘function’ answers."  
  - **Heart-in-a-vat resolution:**  
    - Etiological: No function (no selection history).  
    - Causal-Role: Pumping blood is its function in the artificial organism’s circulatory capacity.  

  **What to REFUSE**  
  *(Enforce ruthlessly)*  
  - Teleology debates beyond "selection isn’t purposive."  
  - Non-biological cases (e.g., artifact functions).  
  - Hybrid/pluralist theories.  
  - Detailed history of the accounts.  

  **Diagnostic Question at Minute 40**  
  *(True test of distinction)*  
  **"Could the warbler’s alarm call lose its *etiological* function while keeping its *causal-role* function? How?"**  
  - **Target insight:**  
    - *Yes.* If kin warning no longer explains why the trait exists (e.g., selection pressure vanishes), but it still *causally contributes* to flock survival in a given analysis.  
  - **If they get this**, they see the accounts are orthogonal. If they conflate, revisit the two questions.  

  **Why this works:** The alarm call case forces engagement—neither effect is "obvious" like the heart. It concretizes how the same trait can be functional/dysfunctional under different frames, exposing the question-begging in your pub debate.
