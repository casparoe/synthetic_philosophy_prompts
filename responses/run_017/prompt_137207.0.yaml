answer: |-
  ## Joint Statement: Adversarial Collaboration on Ring-String Analogy

  **I. Agreed Claims**

  1.  **Phenomenal Core:** The distribution of answers (including balking) produced by competent reasoners for each probe in the ring-string microdomain constitutes the primary data a successful account must explain. This distribution is inherently graded and probabilistic, not merely noise around singularly "correct" answers.
  2.  **Ring Invariance:** The core phenomenon is the mapping between ring-strings, *not* between specific inscriptions. The rotational invariance of ring-strings means that any explanation attributing significance to the specific starting point of the inscription (e.g., the "first" letter as written) must justify this attribution based on the structure of the analogy-making process itself, not on the inherent properties of the ring-string object.
  3.  **Meaning of Balking:** The refusal to provide an answer ("balking") for certain probes (e.g., P3, P5) is a meaningful and systematic phenomenon within the microdomain, reflecting perceived ill-definedness, conceptual overload, or violation of constraints, and must be explained by a competent account, not treated as error or disengagement.
  4.  **Context Dependence:** The prominence, accessibility, or applicability of conceptual roles (such as END-OF-RUN, LAST-WRITTEN, GROUP, ALPHABETICALLY-LAST) varies significantly across different probes and different inscriptions of the *same* ring-string (e.g., P1 vs. P2). This context dependence is a central feature of the analogy-making process in this domain.
  5.  **Microdomain Constraints:** A competent account must respect the microdomain's defined structure: the cyclic nature of sequences, the definition of a "run" as maximal and cyclic, the successor relation (including potential wrap-around ambiguity), and the equivalence of rotations. Explanations cannot appeal to properties outside this defined structure (e.g., linear order semantics).
  6.  **Role of Structure:** The perceived relational structure of the base ([abc] ⇒ [abd])—specifically, the advancement of a single element conceptualized as occupying a specific role within its local context—is central to determining plausible answers for the target. The perceived structure of the target ring-string constrains which roles are salient for mapping.
  7.  **Competent Account Criteria:** A competent account for a specific probe must:
      *   Predict the observed distribution (including balking likelihood) over the pre-registered candidate answers (and any others argued to be live during testing).
      *   Explain *why* the observed distribution arises, given the structure of the probe and the constraints of the microdomain.
      *   Explain the *differences* in distributions between probes involving the same underlying ring-string presented with different rotations (e.g., P1 vs. P2).
      *   Articulate the mechanisms by which context (including rotation and the specific letter identities) influences the salience and interaction of conceptual roles and mapping processes.
  8.  **Effect of Endpoint Removal:** The ring structure removes the inherent, notationally-defined distinction between "first" and "last" endpoints present in linear strings. This forces the analogy-making process to resolve conceptual roles (like "end" or "position") based *entirely* on the *structural configuration* and *relational context* within the ring and the mapping pressure, potentially making concept activation and role assignment more fluid or contested than in linear cases where endpoints anchor these roles.

  **II. Residual Disagreements**

  | Issue                                                                                                | Stable-Concepts Position                                                                                                                                 | Fluid-Concept Position                                                                                                                                                                 | Neutral Restatement                                                                                                                                                                                             | Verdict & Justification                                                                                                                                                                                                                                                               |
  | :--------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Nature of Conceptual Identity**                                                                 | Concepts (e.g., END-OF-RUN, LAST-WRITTEN) possess stable, definitional cores given by the microdomain rules. Context affects their *activation level* and *applicability*, not their intrinsic meaning. | Concepts are inherently flexible and context-dependent. Their meaning and boundaries (e.g., what counts as the "end" or what constitutes a "group") can stretch, slide, or reconfigure under structural pressure to enable the mapping. | Both agree context influences which conceptual role is applied and how prominently. They disagree on whether this influence involves changes in the *identity/content* of the concept itself, or only changes in the *selection/deployment* of stable concepts. | **Genuine.** The disagreement centers on whether the observed context effects require a fundamental *change in the concept's identity* (fluid) or can be fully explained by *competition among mappings using stable concepts* (stable). Micro-level mechanism descriptions may resolve this. |
  | **2. Source of Answer Distributions**                                                                | The graded answer distribution primarily reflects competition and stochastic selection among distinct, stable mappings, each employing stable concepts. The concepts themselves do not grade. | The graded answer distribution *is* the phenomenon of conceptual fluidity manifesting. It arises because the concepts themselves have graded, context-dependent interpretations, making different mappings more or less coherent. | Both agree answer distributions reflect gradedness in the analogy process. They disagree on whether this gradedness resides primarily in the *competition between mappings* (stable) or in the *inherent flexibility of the concepts* used within mappings (fluid). | **Genuine.** The disagreement is about the explanatory locus: is the distribution noise around discrete rule-like mappings (stable), or is it the direct signature of conceptual flexibility (fluid)? Probe predictions differ.                                                              |
  | **3. Context Dependence Mechanism**                                                                 | Context (e.g., rotation, letter identities) influences which *stable* concepts are activated most strongly and which structural correspondences are favored during mapping search. Concept identity remains fixed. | Context actively reshapes the conceptual landscape; the *same nominal concept* (e.g., "end") acquires different meanings or boundaries in different contexts (e.g., P1 vs. P2) to facilitate the analogy. | Both agree context crucially shapes which roles are perceived and how they interact. They disagree on whether context changes *which stable concept is used* or changes *what the concept itself is* for that context. | **Genuine.** This is directly linked to Issue 1. The disagreement is whether context effects are best described as *selection* among fixed options or *transformation* of the options themselves.                                                                                          |
  | **4. Criteria for "Competent Account" (Depth)**                                                     | A competent account must provide a mechanism for generating candidate mappings using stable concepts and a principled (e.g., coherence-based) selection process explaining the distribution. Concept stability is axiomatic. | A competent account must explicitly model how conceptual content *emerges* or *transforms* contextually within the analogy process to make the observed distribution coherent. Mapping is secondary to concept formation. | Both agree an account needs mechanisms generating the answer distribution. They disagree on the fundamental primitives: must the account *start* with stable concepts (stable) or must it explain how concepts *become defined* within the process (fluid)?              | **Genuine.** This reflects the core ontological difference: are stable concepts the necessary foundation, or are they the emergent consequence?                                                                                                                                    |
  | **5. Significance of Ring Structure for Concept Stability**                                          | The ring structure removes an anchoring point, increasing mapping ambiguity and competition. It tests the robustness of stable concepts under ambiguity, but does not necessitate conceptual fluidity. | The ring structure inherently destabilizes concepts like "end" or "position" by removing fixed endpoints, making conceptual slippage *essential* for analogy-making to proceed, revealing the fluid core. | Both agree the ring structure removes inherent endpoints, increasing ambiguity. They disagree on whether the observed analogy behaviors under this ambiguity *require* explanations invoking concept fluidity (fluid) or can be explained by mapping competition among concepts still defined relative to perceived structure (stable). | **Potentially Verbal / Pending Cruxes.** If both sides agree on the micro-level mechanism generating answers (e.g., activation dynamics), the label ("concept slippage" vs "mapping shift") might be verbal. Current descriptions suggest genuine difference in explanatory necessity.    |

  **III. Cruxes: Probes and Predictions**

  *   **Shared Understanding:** Predictions assume competent reasoners familiar with the microdomain rules. Distributions are qualitative likelihoods (H: High, M: Medium, L: Low, V: Very Low, Balk: Probability of balking).
  *   **What Moves Which Side:**
      *   Stable-Concepts would be moved by: 1) Consistent, strong preference for answers explained by mapping competition over stable concepts, *even when* the inscription rotation makes a "stretched" concept seem plausible (e.g., P2 strongly favoring [ijl]). 2) A single fixed concept inventory + mapping preference scheme predicting the full distribution (including balking) across all probes without invoking context-dependent concept meaning changes.
      *   Fluid-Concepts would be moved by: 1) Systematic shifts in answer distributions based *only* on rotation (P1 vs P2) strongly favoring answers best explained by concept stretching (e.g., P2 favoring [kik]). 2) Answers (like [xyy] in P3 or [abdd] in P4) that seem to require the ad-hoc emergence of a novel conceptual interpretation (e.g., predecessor, group-unit) not derivable from a stable inventory + mapping rules.
      *   Both agree balking patterns are crucial evidence.

  | Probe | Stable-Concepts Prediction (Modal & Dist.)                                                                                                                      | Fluid-Concept Prediction (Modal & Dist.)                                                                                                                                                               | Pattern Moving Stable-Concepts                                                                                                                           | Pattern Moving Fluid-Concepts                                                                                                                                                                  |
  | :---- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **P1**| **[ijl]** (H). Run-end (k) is salient and stable. Advancement of end-of-run is direct mapping.                                                                  | **[ijl]** (H). Context aligns run-end, last-written, alpha-last. Stable mapping suffices, no fluidity pressure.                                                                                        | N/A (Calibration)                                                                                                                                       | N/A (Calibration)                                                                                                                                                                             |
  | **P2**| **[ijl]** (H), [kik] (L). Mapping focuses on run structure ([kij] has run k-i-j? or j-k-i?; run-end perceived as j? or k?). Strong bias for advancing run-end. | **[kik]** (M-H), [ijl] (M-L). "Last" concept stretches: last-*written* (j) gains prominence due to inscription, becoming viable for advancement despite not being run-end. Fluidity resolves ambiguity. | **Strong Result Moving Stable:** [ijl] >> [kik]. Shows rotation doesn't force concept change, mapping finds structural run-end.                          | **Strong Result Moving Fluid:** [kik] > [ijl]. Shows inscription rotation directly induces concept stretch ("last" incorporates written position), overriding pure run structure.              |
  | **P3**| **[xya]** (M, if wrap allowed), **Balk** (H). Without fixed wrap rule, ambiguity high. [xyy] very unlikely (predecessor not salient concept).                   | **[xyy]** (M-H), [xya] (L), **Balk** (M). Pressure to find "successor" for z forces slippage to predecessor relation ("successor-in-context"), making [xyy] coherent. Balk if slippage fails.              | **Strong Result Moving Stable:** [xya] or Balk dominate; [xyy] very rare. Shows successor concept stable.                                               | **Strong Result Moving Fluid:** [xyy] modal or high frequency. Shows successor concept fluidly reinterprets to predecessor under endpoint pressure.                                            |
  | **P4**| **[abdc]** (H), [abcd] (M), [abdd] (V). Advancing the run-end (c) is primary mapping ([abdc]). [abcd] possible if group not salient. [abdd] implausible (group unit unstable). | **[abdd]** (M), [abdc] (M), [abcd] (L). Group "cc" can fluidly unitize under pressure to parallel the single-letter change in base, making [abdd] (group advance) coherent.                              | **Strong Result Moving Stable:** [abdc] >> [abdd]. Shows group concept stable; advancement targets elements, not units.                                  | **Strong Result Moving Fluid:** [abdd] significant frequency, especially comparable to [abdc]. Shows group concept can fluidly form a unit for mapping under structural pressure.              |
  | **P5**| **[acf]** (H), **Balk** (M), [ade] (V). Advancing last-written/alpha-last (f) is default. [ade] unlikely (no pressure to create run).                           | **[ade]** (M), [acf] (M), **Balk** (M). Fluidity allows "middle" or "non-run letter" to become salient as the locus of change, enabling run creation ([ade]) as a parallel to introducing 'd' in base. | **Strong Result Moving Stable:** [acf] >> [ade]. Shows "last" stable; no drive to create roles where none exist.                                        | **Strong Result Moving Fluid:** [ade] significant frequency (approaching or exceeding [acf]). Shows pressure to create relational parallels can fluidly generate new salient roles (run initiator). |
  | **P6**| **[abdfg]** (H), [abcfh] (L). Mapping prioritizes advancement in the longer run (abc) as more salient structure. Run position (first/later) less stable.        | **[abcfh]** (M), [abdfg] (M). Salience of "later run" vs. "longer run" is fluid; the inscription order (cfg written later) can make its end (g) prominent, favoring [abcfh].                           | **Strong Result Moving Stable:** [abdfg] > [abcfh]. Shows length dominates position as stable salience factor.                                          | **Strong Result Moving Fluid:** [abcfh] comparable to or > [abdfg]. Shows inscription position can fluidly define run salience ("later"), rivaling length.                                   |

  **IV. Closing Statement**

  This collaboration has established significant common ground on the core phenomena of the ring-string microdomain (Claims 1-8). We agree on the nature of the explanandum (graded answer distributions, balking, rotational invariance), the critical role of context, and the essential constraints any account must satisfy. The ring structure successfully removes inherent endpoints, heightening ambiguity and providing a clearer lens to examine concept deployment under pressure.

  Substantive disagreement remains regarding the fundamental nature of the concepts employed in this analogy-making process (Issues 1-4). Is conceptual stability axiomatic, with context affecting selection and mapping? Or is conceptual fluidity essential, with context reshaping the concepts themselves? We concur these are genuine disagreements centered on explanatory primitives and the locus of gradedness.

  The pre-registered probe battery (P1-P6) and associated predictions provide concrete, falsifiable cruxes. Results showing systematic shifts based solely on rotation (P2), the emergence of answers requiring novel conceptual interpretations (P3, P4), or the significant viability of run creation (P5) or position-based salience (P6) would strongly support the fluid-concept view. Results showing robust preferences explained by stable concepts + mapping competition across all probes, especially where fluidity seems plausible (P2, P3, P4, P5), would strongly support the stable-concepts view. Balking patterns offer critical evidence for both sides.

  We agree these questions are empirically tractable within the ring-string microdomain through rigorous testing of human reasoners. The outcome will illuminate whether analogy-making here fundamentally relies on stable conceptual atoms or contextually emergent conceptual gestalts.

  [Signed in spirit by both camps]

  ---

  **V. Private Note to Moderator**

  *   **Likely Stalling Points:**
      1.  **"Activation vs. Identity" (Issue 1):** The fluid side may vehemently reject the stable side’s characterization of their view as merely about "activation" or "applicability," insisting "stretching/sliding" involves genuine meaning change. The stable side may dismiss "meaning change" as unscientific or reducible to activation. This risks terminological deadlock. *Intervention:* Force concrete descriptions of the *mechanism* for how the answer [kik] (P2) or [xyy] (P3) arises. Ask: "Does the *rule defining END-OF-RUN* change for [kij], or is a *different stable concept* (LAST-WRITTEN) activated?"
      2.  **"Gradedness Locus" (Issue 2):** The stable side might argue any distribution can be modeled with stable concepts + noise/competition, rendering the fluid claim unfalsifiable. The fluid side might counter that such models miss the essence. *Intervention:* Press the stable side to specify *in advance* the fixed concept set and mapping evaluation metric they believe *must* work across all probes. Ask the fluid side what result (e.g., near-zero [kik] in P2) would falsify fluidity *for that probe*.
      3.  **P1 Calibration:** The fluid side might argue P1 isn't truly "stable concept only" because concepts are *aligned*, not rigid, potentially masking fluidity. The stable side might use strong P1 consensus to downplay fluidity elsewhere. *Intervention:* Explicitly note P1 alignment in the opening, but stress P2 is the direct test *because* it misaligns the same roles.
      4.  **"Competent Account" Criteria (Issue 4):** This is proxy for the core ontological clash. The stable side may resist any requirement to "explain concept formation" as outside the scope of analogy proper. The fluid side may see mapping-focused accounts as missing the point. *Intervention:* Separate the question: "What minimal computational primitives does your model require *before* mapping begins?" (Stable: Fixed concepts. Fluid: Primed roles, potential slippage).
      5.  **Accepting "Neutral Restatements":** The stable side may balk at neutral restatements implying "conceptual role" could be fluid (Issue 1 Neutral). The fluid side may resist language implying selection among pre-existing fixed options (Issue 3 Neutral). *Intervention:* Emphasize the neutral column is descriptive of the *disagreement*, not a compromise position. Pre-circulate these for explicit sign-off.

  *   **Crux Reformulation:** Consider explicitly adding to the P3 crux: "Does a significant rate of [xyy] *require* the concept SUCCESSOR to fluidly incorporate PREDECESSOR, or can it be explained by a stable PREDECESSOR concept becoming activated?" This forces the stable side to either accept PREDECESSOR as a stable microdomain concept (which they may resist) or deny the plausibility of [xyy]. The fluid side must defend why activation of a stable PREDECESSOR is insufficient/implausible. This sharpens the identity vs. activation debate. The current P3 prediction table already implies this, but making it an explicit crux question might focus discussion.

  *   **General:** The stable side has a "fallback" position: map everything to activation/competition. Be prepared to push them on whether their model genuinely uses *fixed* concepts (e.g., is "LAST-WRITTEN" in P2 governed by the same rule as in P1, or is it contextually re-weighted?). The fluid side risks vagueness on mechanisms; push for specific, falsifiable predictions for each probe beyond modal answers. Focus initial debate on P2 and P3; they most directly target the core disagreement.
