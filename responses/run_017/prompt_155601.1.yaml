answer: |-
  ### Preamble: Constraining Metaphysics, Not Criteria  
  This list constrains a *metaphysics of cognition*—an account of what fundamentally constitutes a cognitive process or system—not a mere criterion for identifying constitution. A criterion (e.g., a "test") presupposes metaphysical commitments and risks circularity in adjudication. For institutional questions (e.g., whether altering an artifact is mind-tampering), we need an explanatory theory of *why* certain external elements are personal (part of the subject) rather than environmental. Only metaphysics can ground the distinction between intrusion-on-mind and property damage.  

  ---

  ### Desiderata for a Metaphysics of Cognition (Adjudication-Focused)  
  *Derived from cases, ordered by conceptual priority. Cases sharpened where needed.*  

  1. **Volitional Integration**  
     - (a) Cognitive systems must incorporate elements only if they are *actively endorsed and maintained* by the subject as tools for their cognitive goals, not merely reliable or automatic.  
     - (b) **Unendorsed Prosthesis**: A court-mandated monitoring implant becomes indispensable and reliable but is detested; removal is desired. If interference feels like violation despite reliability, mere causal coupling is insufficient.  
     - (c) Rules out views where reliability/accessibility alone constitutes cognition (e.g., simple parity principles).  
     - (d) **Non-negotiable** for adjudication: Without volition, we cannot distinguish consensual from coerced integration.  

  2. **Phenomenal-Operational Transparency**  
     - (a) Elements must be *transparent in use and accessible to self-monitoring*; their operations and failures must be feelable (not necessarily conscious) and corrigible by the subject.  
     - (b) **Degradation without Phenomenology**: A cloud memory degrades silently, distorting decisions without any felt effort or error. Contrast with biological memory loss, which often involves metacognitive awareness. If unfelt degradation isn’t "mind tampering," transparency matters.  
     - (c) Rules out cognition where operations are opaque *to the subject* (e.g., black-box algorithms).  
     - (d) **Non-negotiable**: Institutional harm requires the subject’s perspective (e.g., unnoticed manipulation may still harm agency).  

  3. **Subject-Relative Glue**  
     - (a) Elements must be *idiosyncratically attuned* to the subject’s history, biology, or goals, creating a dependence distinct from public resources.  
     - (b) **Public Infrastructure**: A wall map is reliable and used, but interchangeable and impersonal. Interference (e.g., vandalism) is property damage, not self-violation. **Standby Redundancy** (sharpened): A backup phone mirroring biological memory is unused and replaceable; its availability doesn’t make it constitutive.  
     - (c) Rules out treating generic/public tools as cognitive, even if relied upon.  
     - (d) **Negotiable**: Internalists overemphasize this; extended mind theorists may relax it.  

  4. **Temporal Grain-Matching**  
     - (a) Integrated elements must operate at a *timescale that meshes* with the subject’s cognitive rhythm, avoiding disruptive reorganization of thought.  
     - (b) **Latency**: A calculator taking 30 seconds per answer (vs. 300ms biologically) forces conscious waiting, fragmenting reasoning. If delay makes it feel "external," synchronicity is constitutive.  
     - (c) Rules out functionally equivalent but temporally disjoint processes.  
     - (d) **Negotiable**: Some extended views reject this as anthropocentric.  

  5. **Counterfactual Robustness**  
     - (a) Elements must be *modally stable*: their contribution persists across minor changes in context or implementation, protecting identity under perturbation.  
     - (b) **Silent Substitution**: Swapping a neural implant for one with subtly different outputs alters judgment undetected. If this is "mind editing," constitution requires robustness to such swaps.  
     - (c) Rules out overly context-dependent coupling (e.g., transient tool use).  
     - (d) **Non-negotiable**: Adjudication requires stability (e.g., is editing a "mind" or just replacing a tool?).  

  6. **Agency-Compatibility**  
     - (a) Elements must *extend, not bypass, the subject’s agency*; their outputs must be treated as reasons for action, not deterministic inputs.  
     - (b) **Opaque Drift**: A recommender algorithm surfaces memories/choices the user trusts but neither understands nor controls. If this erodes autonomy (e.g., "filter bubble" as manipulation), cognition requires endorsement-as-reason.  
     - (c) Rules out passive, algorithmic determination of thought.  
     - (d) **Non-negotiable**: Mind-tampering implies agential harm.  

  7. **Subject-Unity Preservation**  
     - (a) The metaphysics must ensure cognitive systems map to *single subjects*; no shared or group minds.  
     - (b) **Shared Custody**: A couple’s co-maintained memory archive is trusted and automatic for both. If interference (e.g., deletion) violates *each* as individuals, constitution must respect personal boundaries.  
     - (c) Rules out group-mind or distributed-subject views.  
     - (d) **Non-negotiable**: Adjudication targets individual rights (e.g., "your mind vs. mine").  

  ---

  ### Explicit Analysis  
  1. **Incompatible Pairs/Triples**:  
     - **Volitional Integration + Subject-Unity Preservation vs. Shared Custody**: If cognition requires personal endorsement *and* one mind per subject, shared resources (e.g., a couple’s notebook) cannot be fully constitutive for either individual. Yet interference may feel violating to both, suggesting a tension.  
     - **Non-question-begging metaphysics vs. skull/skin significance**: A metaphysics avoiding biological bias (e.g., functionalism) struggles to explain why local boundaries matter institutionally (e.g., why brain edits *always* violate, but external edits only *sometimes*).  

  2. **Most Exclusionary Requirement**:  
     **Volitional Integration**. It excludes:  
     - Pure functionalism (reliability suffices).  
     - Passive extended systems (e.g., opaque algorithms).  
     - Non-consensual prostheses.  
     *Why this over others?* It directly addresses adjudication’s core: consent and personal boundaries. Reliability (functionalist favorite) or coupling (enactive standby) are insufficient to distinguish coercion from integration.  

  3. **Compressed Scorecard**:  
     - **Extended/Parity View**: Fails volition, transparency, subject-unity. Strong on grain-matching, weak on adjudication.  
     - **Internalist (Brain-Bound) View**: Passes subject-unity, robustness. Fails all cases involving artifacts (inapt for modern adjudication).  
     - **Functionalist (Vehicle-Neutral)**: Passes temporal grain, robustness. Fails volition, transparency, agency (blind to subjective harm).  
     - **Enactive/Mark-of-Cognitive**: Passes subject-relative glue. Fails volition, counterfactual robustness (overvalues coupling). None fully satisfy non-negotiables.  

  **Closing Note**: The adjudication target *distorts* the list. A "best" metaphysics for taxonomy (e.g., functionalism for generality) would ignore volition and transparency—yet these are essential for institutional harm. We must prioritize the subject’s agential perspective, even if it yields a less elegant theory.
