  - Shared custody: Jointly maintained resources. This pushes for "subject-relativity without exclusivity," challenging one-mind-per-subject assumptions.
  - Opaque drift: Algorithmic control without understanding. Needs "transparency/endorsement" to exclude blind trust cases.
  - Unendorsed prosthesis: Forced, indispensable but unwanted devices. Highlights "volitional glue" vs. mere reliability.
  - Silent substitution: Undetected swaps altering behavior. Requires "counterfactual robustness" against external manipulation.
  - Standby redundancy: Unused backups. Questions "active contribution" over passive availability.
  - Public infrastructure: Shared, impersonal tools. Demands "personalization" to distinguish cognitive from environmental.
  - Degradation without phenomenology: Slow decline unnoticed but impactful. Supports "phenomenal access" or its irrelevance.

  For each requirement, structure: (a) statement, (b) case motivation, (c) what it rules out, (d) negotiability. Some cases might be sharpenable—e.g., standby redundancy could emphasize irrelevance if unused.

  Next, explicit tasks:
  1. Identify conflicts: Can non-question-begging criterion coexist with skull/skin specialness? Probably not without metaphysics. Shared resources vs. one-mind-per-subject? Tension here—requires rethinking subjectivity.
  2. Most exclusionary requirement: Likely "volitional integration" from unendorsed prosthesis, as it rejects pure reliability and forces agency issues.
  3. Scorecard: Briefly assess major views (extended, internalist, functionalist, enactive) against the list. Highlight how each fares on adjudication.

