  ### Central Handout: Mathematics, Truth, and Proof  
  **How to use this tree:** Start at the top. Answer each question based on your pre-theoretical intuitions, without looking ahead. Follow the arrows to the next node. Your path ends at a named position in the philosophy of mathematics. Benacerraf’s dilemma—the tension between truth-makers for abstract objects and naturalistic epistemology—organizes the tree.  

  #### The Decision Tree  
  1. **Face value:** When mathematicians say, "There is a prime between 10 and 15," do they mean that such a number *really exists*?  
     - **Yes** → 2  
     - **No** → 3  

  2. **Abstract objects:** Are numbers (or other mathematical entities) non-spatiotemporal and causally inert?  
     - **Yes** → 4  
     - **No** → **Unoccupied** (No coherent view: mathematical objects can’t be both non-abstract and mind-independent.)  

  3. **Genuine assertion:** When we use math, are we making claims *about reality* (even if not about numbers)?  
     - **Yes** → **Figuralism (Yablo)**  
     - **No** → 5  

  4. **Machine knowledge:** A system trained only on text/proofs derives new results with machine-checked proofs. Can it *know* these truths?  
     - **Yes** → 6  
     - **No** → 7  

  5. **Useful fiction:** Is math a useful, systematic fiction?  
     - **Yes** → **Fictionalism (Field)**  
     - **No** → 8  

  6. **Identification in practice:** In set theory, 1 ∈ 2 in von Neumann’s reduction (0=∅, 1={∅}, 2={∅,{∅}}), but not in Zermelo’s (0=∅, 1={∅}, 2={{∅}}). Is there a *fact* about which is "correct"?  
     - **Yes** → **Object Platonism**  
     - **No** → 9  

  7. **Human knowledge:** Do *humans* know mathematical truths?  
     - **Yes** → **Object Platonism (with intuition)**  
     - **No** → **Unoccupied** (Incoherent: if truth requires abstract objects, but no one can know them, math collapses into error.)  

  8. **Misguided demand:** Is the quest for an "ontology" or "epistemology" of math fundamentally confused?  
     - **Yes** → **Quietism/Deflationism**  
     - **No** → **Unoccupied** (Unattractive: denies truth, genuine content, *and* utility.)  

  9. **Plenitude:** Does *every* consistent mathematical theory describe some real structure?  
     - **Yes** → **Full-Blooded Platonism**  
     - **No** → 10  

  10. **Structural dependence:** Do mathematical structures (e.g., the natural number system) exist independently of any concrete instances?  
      - **Yes** → **Ante Rem Structuralism**  
      - **No** → **Modal Structuralism**  

  ---

  #### Named Positions and Their Most Uncomfortable Commitment  
  - **Object Platonism:** Must explain how humans access abstract objects without causal contact.  
  - **Object Platonism (with intuition):** Relies on an unexplained "intuition" faculty.  
  - **Full-Blooded Platonism:** Commits to countless mathematical universes (e.g., Euclidean and non-Euclidean geometries are equally real).  
  - **Ante Rem Structuralism:** Structures exist independently but face the same epistemology problem as objects.  
  - **Modal Structuralism:** Reduces math to possibilities (e.g., "Numbers exist" becomes "Structures *could* exist"), but possibilities may be abstract.  
  - **Figuralism (Yablo):** Must provide literal paraphrases for all math (e.g., "2+2=4" describes physical patterns metaphorically).  
  - **Fictionalism (Field):** Denies truth of math (e.g., "Primes exist" is false), so must explain its utility in science.  
  - **Quietism/Deflationism:** Dismisses Benacerraf’s challenge as nonsensical, but offers no positive account.  

  #### Unresolved Pairs  
  - **Figuralism vs. Fictionalism:** Separated at node 3 (genuine assertion).  
  - **Ante Rem vs. Modal Structuralism:** Separated at node 10 (independence).  
  - **Object Platonism vs. Neo-Fregeanism:** *Not separated* by this tree. Both answer "yes" at nodes 1, 2, 4, and often 6. A node on **abstraction principles** (e.g., "Is arithmetic grounded in logical rules like ‘Equinumerous concepts have the same number’?") would be needed.  

  ---

  ### Closing Note  
  **Pivotal Node: Machine Knowledge (Node 4)**  
  This node does the most work. If you accept machine knowledge, you avoid the reliability horn (naturalistic epistemology is satisfied by reliability, not causation). If you reject it, you’re forced into either mysterious human faculties (intuition) or abandoning realism. It also exposes tensions: machines highlight that *reliability* might suffice for knowledge, pressuring causal/naturalistic accounts. Spend seminar time here—it crystallizes Benacerraf’s epistemology challenge and forces reflection on what "knowledge" requires.  

