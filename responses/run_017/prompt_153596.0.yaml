  Looking at their core claim: They're arguing that maintaining consistency across multiple debates creates higher costs for deception compared to one-shot debates. This seems genuinely insightful - while reputation systems exist in game theory, the application to AI debate oversight with a rolling ledger appears novel.

  Among their failure modes, the coherent fabulist seems most fundamental. If an AI can maintain a consistent false worldview, the ledger fails completely. The shared weights issue also seems particularly relevant for current AI systems where debaters share the same base model.

  For a fifth failure mode, I should mention the risk of the debaters colluding - which would undermine the entire competitive dynamic. The verification-through-random-checks idea they suggested is actually a good mitigation strategy worth highlighting.

