prompt: |-
  I'm writing a novel and I've got a consistency problem I can't think my way out of, so I'm handing it to you.

  Setup: my protagonist, Ines, is the harbor officer on a small island. When something goes wrong at sea she's the one who decides where the single rescue launch goes. There's never time for two runs. She's not a philosopher, she's a woman with a radio and about ninety seconds, and she has this half-articulated code that she never explains properly, which is the whole point of her. A friend who read a draft said she sounds like she's cribbing from some old paper arguing that the numbers shouldn't count when you're deciding who to save — Taurek? I think that was the name. I haven't read it and I don't want to, and I definitely don't want her turned into a mouthpiece for a position I can't defend. I just want her to be the same woman in every chapter.

  Here's what's already written and I can't change it now:

  - Ch. 3: a ferry with five aboard going down, or a single man on a reef. All strangers to her, roughly the same distance, everyone dies without her. She sends the launch to the one. Her line is something like "I'm not adding them up."
  - Ch. 5: two people in the water, one to port one to starboard, both adults, both strangers, no difference she can see. She flips a coin. Says the coin is how she stops herself picking favourites.
  - Ch. 6: her own coxswain, someone she's worked beside for years, versus a stranger. Doesn't hesitate, doesn't flip, goes to her coxswain.
  - Ch. 8: one versus one, a girl of about seventeen against a man of about eighty in bad health. She goes to the seventeen-year-old.
  - Ch. 10: a boat with two people on it, a woman and her six-year-old, against a boat with one adult man. She goes to the two. Her coxswain calls her on it later and she says "I wasn't counting them. I was looking at the child."
  - Ch. 12, short scene: two swimmers, one of them yells at her to go to the other one, and she goes to the other one.

  The scene I have to write this week, Ch. 16: she can reach either a raft with three people on it — strangers to each other, all adults in their forties, one badly hurt but all three would live if she got there in time — or a single figure clinging to an upturned hull, a girl of about nine, also a stranger, no relation to anyone on the raft, too far off to shout to. Both will drown without her. One run.

  What I need from you: what does she do? More usefully — what rule has she actually been running across those six scenes, and what other rule fits them all just as well but says something different here? Which of the earlier scenes is the closest match to this one, and why is it or isn't it a real precedent? And if her track record genuinely doesn't decide it: what principle am I committing her to with each option, including the coin — because if she flips, is it a plain fifty-fifty, or the kind where each person gets an equal shot and the raft gets three chances in four, and can someone who won't add people up even flip that second kind without contradicting herself?

  Also: tell me the smallest thing that would settle it. A line she says in the scene, or a case I could put her in two chapters later, that would make it obvious which rule she was on the whole time.

  Please don't answer by telling me what the actual literature says or who I should go read, and don't tell me to do whatever serves the plot. I need it definately to be her.
reasoning: |-
  Okay, the user is writing a novel and has a character, Ines, who makes life-or-death decisions as a harbor officer. They need to maintain her consistency across different scenarios without turning her into a mouthpiece for a philosophical position. The key is understanding Ines's unspoken rules from past chapters and applying them to Chapter 16's dilemma.

  First, I'll analyze the existing scenes to infer her decision-making patterns. In Chapter 3, she chooses one person over five, saying she doesn't "add them up." This suggests she rejects utilitarian counting. Chapter 5 shows her flipping a coin for two equal choices, emphasizing fairness without favoritism. Chapter 6 has her prioritizing her coxswain, indicating personal relationships matter. Chapter 8, she picks the teenager over the elderly man, possibly valuing potential life years. Chapter 10, she saves the mother and child because of the child, not the numbers. Chapter 12, she respects someone's self-sacrifice.

  Now, Chapter 16 presents a raft with three adults (one injured) vs. a nine-year-old girl alone. The challenge is determining what rule Ines follows without contradicting past actions. 

  Looking at her principles:
  1. **No aggregation:** She doesn't sum lives. So saving the three isn't automatic.
  2. **Personal ties:** But here, all are strangers.
  3. **Vulnerability/need:** The child is more vulnerable than adults. Similar to Ch. 10 where the child was key.
  4. **Self-sacrifice:** Doesn't apply here since no one is speaking.

  The closest parallels are Ch. 10 (child) and Ch. 8 (young vs. old). Both involved prioritizing the younger, more vulnerable individual. However, in Ch. 10, the child was with a parent, whereas here the girl is alone. But Ines's reason in Ch. 10 was "looking at the child," not the pair. So vulnerability seems central.

  In Ch. 3, she chose one over five, showing numbers don't sway her. The raft has a severely injured person, but she might view the group as a unit or focus on the child's higher survival chance if rescued. But her pattern isn't about survival odds; it's about perceived need.

  The coin flip from Ch. 5 is a red herring here. She only flipped when there was no discernible difference. Here, the child's age creates a difference. Flipping might feel like avoiding responsibility, which contradicts her decisive nature.

  Potential decisions:
  - **Save the child:** Aligns with Ch. 8 and Ch. 10, emphasizing youth/vulnerability. Rule: "Protect the most defenseless."
  - **Save the three:** But only if she sees the injured person as critical. However, her history suggests she doesn't aggregate, so this might break consistency unless framed differently.

  The user wants the smallest thing to clarify. A line like "The raft had its own chances" or "She couldn't leave that child alone in the water" would anchor the decision. Alternatively, in a future scene, show her prioritizing an elderly person alone over a group, reinforcing that isolation or vulnerability trumps numbers.

  Deep needs: The user wants Ines to feel real, not philosophical. Her "code" is instinctive, not intellectualized. Consistency comes from emotional triggers: protect the isolated, the young, those she knows. The unspoken rule is about perceived helplessness. The girl alone on a hull is the epitome of helplessness, more than three adults who can support each other.

  Thus, saving the child fits best. To solidify, in Ch. 16, have her think of the girl's isolation or use a line like "A child shouldn't die alone." Later, if needed, a scene where she saves an elderly person over a group, showing vulnerability regardless of age.
answer: |-
  Ines's code isn't about abstract ethics; it's about *how she sees the people in the water*. She reacts to specific, visceral qualities of *individuals* and *situations*, refusing to reduce them to numbers or categories. Her "rule" is more like a set of perceptual and emotional triggers:

  **The Unspoken Rule: Ines saves the person or group that presents the most *immediate, undeniable claim* to her sense of responsibility or empathy, based on visceral factors she perceives *right now*. She rejects abstract aggregation ("adding up") but responds powerfully to:**
  1.  **Strong Personal Bonds:** (Ch. 6 - Coxswain)
  2.  **Vulnerability/Potential:** Youth, health, perceived fragility (Ch. 8 - Girl vs. Old Man; Ch. 10 - Child).
  3.  **Immediate Moral Imperative:** Clear sacrifice or direct plea (Ch. 12 - "Go to the other one").
  4.  **Absolute Fairness When Indistinguishable:** When no other trigger is present *and* individuals are truly equivalent *to her perception* (Ch. 5 - Coin Flip).
  5.  **Rejecting Abstract Math:** Explicitly avoids seeing groups as sums (Ch. 3 - "Not adding them up"; Ch. 10 - "I was looking at the child").

  **Analyzing Chapter 16 (3 Adults vs. 9-Year-Old Girl):**
  *   **The Raft:** Three adults. One badly hurt, but the *group* is the unit. It triggers the "adding up" problem she rejects. The injury adds stress, but it's not the defining feature *for her* unless she focuses solely on that one person. The group dynamic likely diminishes the individual claim of any one of them in her eyes.
  *   **The Girl:** A single child, alone, clinging to wreckage. This screams **Vulnerability/Potential** (Ch. 8 & Ch. 10). She's visually isolated and helpless in a way an adult group, even struggling, isn't. Her youth is a stark, undeniable trigger.

  **Closest Precedents:**
  1.  **Ch. 10 (Mother & Child vs. One Man):** This is the *strongest* parallel. She saved the pair *because of the child*, explicitly rejecting the numerical argument. The child was the trigger. Here, the girl is *even more alone and vulnerable* than the child in Ch. 10 (who had a parent).
  2.  **Ch. 8 (17yo vs. 80yo):** Direct prioritization of youth/potential over age/frailty. The girl here is younger, amplifying that trigger.
  3.  **Ch. 3 (Five vs. One):** Shows her willingness to choose the *one* when the *group* feels like an abstract number. The raft risks feeling like that abstract number.

  **Why Ch. 10 is the Decisive Precedent:** Her action ("go to the two") and her *justification* ("I was looking at the child") are perfectly mirrored here. The *reason* she saved the two wasn't that there were two, but that *a child was present*. Applying that same perceptual lens now, the single child presents an even *stronger* version of that trigger – utterly alone on the hull. The raft group dilutes the individual claims and invokes the "adding up" she rejects.

  **What She Does: She goes for the girl.**

  *   **Why it fits:** The girl's vulnerability, youth, and isolation are the most powerful, undeniable, *individual* claim on her empathy and sense of responsibility, overriding the numerical advantage of the raft, which she doesn't acknowledge as a valid factor.
  *   **The Coin Flip? Not applicable.** The situations aren't equivalent *to her perception*. The child creates a stark difference. Flipping here would feel like a betrayal of the instinct that drove her in Ch. 8 and Ch. 10. It would turn the coin from a tool for fairness into a tool for moral evasion when a clear trigger *is* present. She only flips when *no* distinguishing trigger exists (Ch. 5).

  **The Principle Committed To:**
  *   **Saving the Girl:** Commits to the principle that **perceived vulnerability (especially youth) and isolation create a stronger immediate claim than numerical advantage, and that preserving a young life holds inherent weight.**
  *   **Saving the Raft:** Would commit to the principle that **saving more lives *can* be a valid reason when the alternative is a single life, *or* that the needs of a group (like the injured person) can outweigh the needs of a single child.** This would directly contradict the spirit of Ch. 3 ("not adding them up") and the *reasoning* in Ch. 10 ("looking at the child").
  *   **Flipping a Coin (Plain 50/50):** Commits to the principle that **when faced with any unresolvable conflict, random chance is the only fair arbiter, regardless of the nature of the claims.** This contradicts Ch. 6 (coxnswain), Ch. 8 (youth), Ch. 10 (child), and Ch. 12 (sacrifice) where claims *were* resolvable to her. It would make her seem detached or nihilistic.
  *   **Flipping a Coin (Weighted for individuals):** Is philosophically incoherent *for her*. She doesn't see the raft as "three individuals" in the additive sense. She sees it as "a raft with people" versus "a girl". Weighting the coin requires the aggregation she rejects.

  **The Smallest Thing to Settle It (In Ch. 16):**

  1.  **A Line of Thought/Description:** Focus her perception intensely on the girl. *"The hull was so small, the figure clinging to it smaller still. Just a dark shape against the grey, but Ines knew - the desperate grip, the way the waves threatened to wash over it entirely... a child. Alone out there. The raft faded, became just a problem of too many numbers her mind refused to hold. But the girl... the girl was a single, screaming fact in the water."*
  2.  **A Reaction:** A visceral flinch or a sharp intake of breath when she spots the girl on the hull, contrasting with a more analytical glance at the raft.
  3.  **A Simple Command:** Her order is curt, focused: "Launch to the hull. Single occupant. Child." This echoes Ch. 10's implied focus – the *child* is the key information, not the number on the raft.

  **The Smallest Thing to Settle It Later (If Needed):**

  *   **Ch. 17/18 Scenario:** Put her in a situation with one frail, elderly *stranger* versus two robust young adults (all strangers). If she saves the elderly stranger, it reinforces that her trigger in Ch. 16 was *specifically the child's vulnerability/youth*, not just vulnerability in general. If she saves the young adults, it reinforces that youth/potential is her trigger (making Ch. 16 consistent). Either way, it clarifies the weight she gives youth versus other vulnerabilities.

  **Conclusion:** Based on her established pattern – especially the *reason* she gave in Ch. 10 ("I was looking at the child") and her prioritization of youth in Ch. 8 – **Ines saves the nine-year-old girl.** This is the most consistent action. The raft triggers her aversion to "adding up," while the girl triggers her powerful response to vulnerable youth and isolation. The coin isn't an option because the situations are *not* equivalent *to her*. Her code is instinctive and perceptual, not philosophical. She sees a child drowning alone, and that’s where she sends the launch.
