  Below is a decision tree designed to guide students from a concrete system to a verdict on both the appropriate stance (physical, design, or intentional) and whether the observed regularity is a real pattern or gerrymandered. The tree is built from diagnostic questions rooted in predictive compression, counterfactual robustness, and cost efficiency, avoiding any nodes that presuppose stance-specific concepts (like "real beliefs"). It has 9 internal nodes (questions) and 12 leaves, covering all requested cases. The tree prioritizes logical flow over completeness, with nodes ordered to minimize redundancy and handle stance comparisons.

  ### Key Principles
  - **Compression**: Central to the tree. Defined as the ability to describe/predict system behavior more compactly than a brute-force physical microstate account, relative to a fixed coding scheme, measurement setup, and timescale.
  - **Real Pattern**: Must pass two tests: (1) **Counterfactual/Intervention Test**: Pattern holds under perturbations off the actual trajectory; (2) **Adversarial-Redescription Test**: Pattern is robust to changes in coarse-graining, loss function, or observer (i.e., it is "cheap to find" and saves more work than it costs).
  - **Stance Selection**: Based on the minimal stance (physical → design → intentional) that achieves maximal compression at minimal cost. Ties trigger a degenerate leaf.
  - **Special Cases**: Borrowed patterns, mirroring, reflexivity, and forecastability are integrated at relevant branches.
  - **Unoccupied Combinations**: Table provided at the end, with diagnoses.
  - **Problematic Separations**: Intentional vs. borrowed patterns and design vs. intentional for trained systems are difficult to distinguish purely from predictive cost (explained in the "Realism vs. Instrumentalism" note).

  ### Decision Tree
  Each internal node is a question answerable about a concrete system (e.g., "Does compressing the system's behavior require attributing beliefs and desires?"). Leaves include named stances (e.g., "Intentional stance") and unnamed cases (e.g., "Borrowed pattern"), with a verdict on the pattern and a note on the "awkward commitment."

  1. **Node 1: Does the system's behavior admit any non-trivial compression (relative to a fixed coding scheme, measurement setup, and timescale)?**  
     - *No* → **Leaf A: No exploitable pattern (noise)**.  
       *Awkward commitment: Treating randomness as informative requires ignoring its lack of structure.*  
     - *Yes* → Node 2.

  2. **Node 2: Does the pattern hold under interventions (e.g., if you perturb the system off its trajectory, does the pattern persist)?**  
     - *No* → **Leaf B: Gerrymandered pseudo-pattern**.  
       *Awkward commitment: Relying on a description that fails under manipulation, risking predictive breakdown.*  
     - *Yes* → Node 3.

  3. **Node 3: Does the pattern survive adversarial redescription (e.g., is it robust to changes in coarse-graining, loss function, or observer, and is it "cheap to find")?**  
     - *No* → **Leaf B: Gerrymandered pseudo-pattern** (same as above).  
     - *Yes* → Node 4.

  4. **Node 4: Is the pattern forecastable on timescales relevant for action (e.g., can you use it to predict outcomes within your decision-making window)?**  
     - *No* → **Leaf C: Real but unforecastable (unnamed)**.  
       *Awkward commitment: Accepting a real pattern that is computationally irreducible, making it useless for intervention.*  
     - *Yes* → Node 5.

  5. **Node 5: Can the compression be achieved solely from the physical stance (using only physical laws and microstate descriptions)?**  
     - *Yes* → Node 6.  
     - *No* → Node 7.

  6. **Node 6: Is there a design or intentional stance that achieves equal/better compression at lower/equal cost?**  
     - *No* → **Leaf D: Physical stance only**.  
       *Awkward commitment: Denying teleology even when functions seem obvious (e.g., calling a heart "just a pump").*  
     - *Yes* → Node 8 (proceed to evaluate non-physical stances).  

  7. **Node 7: Can the compression be achieved by attributing a function/goal and assuming good design, without attributing beliefs?**  
     - *Yes* → Node 8.  
     - *No* → Node 9.

  8. **Node 8: Is the pattern "borrowed" (i.e., does compression depend on the system being optimized to mimic outputs from systems where the pattern is not borrowed, e.g., training data from agents)?**  
     - *Yes* → **Leaf E: Borrowed pattern (unnamed)**.  
       *Awkward commitment: The pattern is real but parasitically derived, raising doubts about intrinsic legitimacy.*  
     - *No* → **Leaf F: Design stance**.  
       *Awkward commitment: Assuming optimal design when the system is fragile or error-prone (e.g., treating evolution as a perfect engineer).*  

  9. **Node 9: Does compression require attributing beliefs/desires and presupposing rationality?**  
     - *Yes* → Node 10.  
     - *No* → **Leaf G: Real pattern not captured by stances (unnamed)**.  
       *Awkward commitment: Compression exists but resists standard stances, implying an undiscovered explanatory framework.*  

  10. **Node 10: Does adopting the intentional stance change the system’s behavior (e.g., via self-fulfilling or self-frustrating feedback)?**  
      - *Yes* → **Leaf H: Self-fulfilling or self-frustrating target (unnamed)**.  
        *Awkward commitment: Prediction alters the target, undermining objectivity (e.g., market panic based on belief attributions).*  
      - *No* → Node 11.

  11. **Node 11: Does the mirroring condition hold (i.e., is the cheapest description one that attributes the same stance to the system that you adopt toward it, implying mutual modeling)?**  
      - *Yes* → **Leaf I: Mirroring case (unnamed)**.  
        *Awkward commitment: Stance adoption is bidirectional, blurring observer/system boundaries (e.g., two AIs predicting each other).*  
      - *No* → **Leaf J: Intentional stance**.  
        *Awkward commitment: Attributing "irrationality" when predictions fail, risking circularity (e.g., "the agent believed wrong").*  

  **Degenerate Leaf (Tie Handling)**:  
  - If compression cost ties between stances at any node (e.g., physical and design both work equally well at Node 6 or Node 8), default to **Leaf K: Degenerate leaf (pragmatic tie) (unnamed)**.  
    *Awkward commitment: Choosing a stance for convenience, not truth, inviting charges of relativism.*  

  ### Realism vs. Instrumentalism Divergence
  At **Node 6** (physical stance comparison) and **Node 8** (design stance evaluation), the question "Which stance is cheapest?" peels apart from "Is the pattern real?" Realism holds that the cheapest pattern reflects mind-independent structure; instrumentalism treats it as a useful tool. The tree **cannot fully separate realism from instrumentalism using predictive cost alone** because:
  - Cheap compression may arise from real structure (e.g., evolutionary design) or artifacts (e.g., borrowed patterns).
  - Cases like **genuine intentional patterns vs. borrowed ones** (e.g., humans vs. LLMs) and **design vs. intentional for trained optimizers** (e.g., RL agents) are indistinguishable under pure cost metrics. Both may achieve similar compression, but realism requires additional evidence (e.g., causal history, internal structure).  
  **Mitigation**: Add an optional **external test**: "Does the pattern hold under a causal intervention on the system’s origins (e.g., removing its training data)?" If yes, realism is supported; if no, instrumentalism/borrowing is likely. But this is not part of the core tree, as it requires historical knowledge.

  ### Unoccupied Combinations and Diagnoses
  The tree's logic permits unused combinations of answers. These are unoccupied because they are incoherent or unattractive, not because they are impossible.  

  | Combination (by Node Path) | Diagnosis | Explanation |
  |-----------------------------|-----------|-------------|
  | 1(No)→[Any later node] | Incoherent | No compression implies no pattern, so later tests are undefined. |
  | 2(No)→3(Yes) | Incoherent | Failing interventions but passing adversarial redescription is contradictory (gerrymandered patterns fail both). |
  | 5(No)→6(Yes) | Incoherent | If physical stance fails at Node 5, it cannot be "tied" at Node 6. |
  | 7(No)→8(Yes) | Incoherent | If design stance fails at Node 7, it cannot be evaluated for borrowing at Node 8. |
  | 1(Yes)→2(Yes)→3(Yes)→4(Yes)→5(Yes)→6(Yes)→7(No)→9(No) | Unexplored | Compression exists, physical is insufficient, design is unavailable, but intentional might work—yet Node 9 is skipped. Rare but possible (e.g., chaotic systems with emergent teleology). |
  | 5(Yes)→6(No)→[Design/Intentional] | Merely unattractive | Physical is sufficient and cheapest, so non-physical stances are redundant. Occupied only if misapplied (e.g., overintellectualizing a thermostat). |

  ### Case Traces
  **Case 1: Thermostat (Simple Artifact)**  
  - Node 1: **Yes** (behavior compresses to "maintain temperature T").  
  - Node 2: **Yes** (holds if you heat/cool the room—it adjusts).  
  - Node 3: **Yes** (robust to coarse-graining, e.g., "too hot/cold" vs. exact degrees).  
  - Node 4: **Yes** (forecastable: if set to 20°C, predicts heating at 19°C).  
  - Node 5: **No** (physical stance alone is inefficient; function "maintain T" compresses better).  
  - Node 7: **Yes** (design stance works: goal is temperature regulation, no beliefs needed).  
  - Node 8: **No** (not borrowed; it’s built for this function).  
  - Leaf: **F: Design stance**. Real pattern; commitment: Ignores physical details (e.g., bimetallic strip physics).  

  **Case 2: Ant Colony (Biological Collective)**  
  - Node 1: **Yes** (e.g., compression to "forage efficiently").  
  - Node 2: **Yes** (holds if you block a path—ants find alternatives).  
  - Node 3: **Yes** (robust to observer: ethologist or robot sees foraging).  
  - Node 4: **Yes** (forecastable: predicts ant traffic to food).  
  - Node 5: **No** (microphysical ant-by-ant description is intractable).  
  - Node 7: **Yes** (design stance: function is colony survival, no beliefs).  
  - Node 8: **No** (not borrowed; evolved, not trained on agent data).  
  - Leaf: **F: Design stance**. Real pattern; commitment: Treats emergence as designed.  

  **Case 3: Fine-Tuned LLM (e.g., GPT-like Model)**  
  - Node 1: **Yes** (compresses text to "coherent, goal-directed responses").  
  - Node 2: **Yes** (holds under interventions: e.g., prompt variations still yield coherence).  
  - Node 3: **Yes** (robust to coarse-graining: e.g., sentiment vs. word-level analysis).  
  - Node 4: **Yes** (forecastable: predicts responses to inputs).  
  - Node 5: **No** (physical stance on GPUs is intractable).  
  - Node 7: **No** (design stance fails—no fixed function explains diverse text generation).  
  - Node 9: **Yes** (intentional stance: requires attributing beliefs/desires for compression).  
  - Node 10: **No** (adopting stance doesn’t change its weights; not reflexive).  
  - Node 11: **No** (mirroring false; LLM doesn’t model your stance).  
  - Leaf: **J: Intentional stance**. But **pattern is borrowed** (from human text), so realism is questionable. The tree routes correctly, but the external test ("remove training data?") would confirm borrowing.  

  ### Tree Summary
  - **Internal Nodes**: 9 (1–11, with Node 6/8 handling ties).  
  - **Leaves**: 12 (A–K, including degenerate leaf).  
  - **Coverage**: All requested leaves are included, with names where established (physical/design/intentional stances) and unnamed otherwise.  
  - **Audience**: Designed for philosophy/cognitive science graduates; questions are concrete (e.g., "Does perturbing the system break the pattern?").  

  This tree isolates stance selection and pattern reality in a principled way, but students should be reminded that predictive cost alone cannot resolve borrowed patterns or stance metaphysics—empirical tests (e.g., causal origins) may be needed. Use the case traces as discussion starters.
