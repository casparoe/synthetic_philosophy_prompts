  Here's a case meeting your specifications, centered on a hospital mix-up and leveraging the non-transitivity of the counterpart relation versus the transitivity of identity in the Kripke/Plantinga framework.

  ### Scenario: Hospital Mix-Up
  In 1990, due to a labeling error at Memorial Hospital, two infants (Alice and Beth) are sent home with the wrong families. Alice (biological child of the Clarks) is raised by the Dawsons in Boston. Beth (biological child of the Dawsons) is raised by the Clarks in New York. The error is never discovered. Alice grows up in Boston, unaware of the mix-up.

  ### Claim 1 (Simple de re modal; both agree)
  **Claim:** "Alice could have been raised in New York."  
  - **Kripke/Plantinga (KP):** True. In a world where the mix-up didn’t occur, the same Alice (originating from the same biological parents, the Clarks) is raised by her biological family in New York.  
  - **Lewis (CT):** True. There is a world with a counterpart of Alice (sharing key properties like biological origin) who is raised in New York.  
  **Agreement Reason:** Both rely on biological origin as a key property, and neither requires essentiality of upbringing.  

  ### Claim 2 (Iterated modal; disagreement)
  **Claim:** "It is possible that Alice could have been raised in New York, and if that had happened, it would then be possible for her to have grown up in Chicago."  
  *(Formally: ◊(Alice is raised in New York ∧ ◊(that same Alice grows up in Chicago))*  

  - **Kripke/Plantinga (KP):** True.  
    - **Verdict & Reason:** In World W1 (no mix-up), Alice is raised in New York. From W1, we can access World W2 where the very same Alice (transworld identity) moves to Chicago as a child. Identity is transitive: Alice in W2 is identical to Alice in W1 and thus to actual Alice. Chaining worlds is unproblematic.  

  - **Lewis (CT):** False.  
    - **Verdict & Reason:** In W1, there is a counterpart (C1) of actual Alice (same biological origin, raised in New York). In W2, there is a counterpart (C2) of C1 (same properties, raised in Chicago). But C2 is **not** a counterpart of actual Alice. The counterpart relation (based on overall similarity, including origin and upbringing) is non-transitive: Actual Alice (Boston-raised) and C2 (Chicago-raised) are too dissimilar (different cities, different family environments) to be counterparts. Thus, the second possibility ("that same Alice grows up in Chicago") fails because C2 isn’t linked to actual Alice.  

  ### Feature Doing the Work
  **Non-transitivity vs. Transitivity of Identity:**  
  - CT allows chains of counterparts (C1 for Alice, C2 for C1) without requiring C2 to relate back to Alice.  
  - KP’s transworld identity forces transitivity: If Alice in W2 = Alice in W1, and Alice in W1 = actual Alice, then Alice in W2 = actual Alice.  

  ### Effect of Removing the Feature
  - **If CT stipulates a transitive counterpart relation:** CT would agree with KP (C2 becomes a counterpart of Alice, making Claim 2 true).  
  - **If KP denies transitivity of identity:** KP would collapse into CT, making Claim 2 false (no chaining).  

  ### Wriggling Out and Pushback
  - **CT Wriggle-Out:**  
    "The context shifts: In W1, when we say ‘that same Alice’, we reset the counterpart relation to prioritize origin over upbringing. So C2 *is* a counterpart of Alice (via shared biology), and Claim 2 is true."  
    (This exploits context-relativity to dissolve the disagreement.)  

  - **KP Pushback:**  
    "Context-relativity avoids the disagreement by redefining ‘Alice’ mid-claim. But the claim explicitly references *the same Alice*—a rigid transworld individual. CT cannot capture this without smuggling in identity. The structural non-transitivity *must* manifest here unless CT artificially imposes transitivity contextually, which undermines its own framework."  

  ### Why This Works Under Constraints
  - **No sci-fi:** Uses realistic human settings (hospital error, upbringing variations).  
  - **No stipulation:** Disagreement arises structurally from non-transitivity (CT) vs. transitivity (KP).  
  - **Agreement on Claim 1:** Ensures the dispute isn’t about essentiality of origin (both accept Alice’s origin is fixed but upbringing can vary).  
  - **Second claim:** Iterated modality forces the transitivity/non-transitivity divergence.  

  ### Weakness Note  
  The CT wriggle-out relies on context-relativity, which you flagged as a concern. If context-relativity is fully exercised, the disagreement *can* dissolve—but this exposes CT’s vulnerability: It must either accept non-transitive chains (yielding a clear disagreement with KP) or invoke context shifts (which KP argues are ad hoc). This case forces CT into this dilemma, revealing its "structural bookkeeping" nature.  

  **Bring this to your group:** The disagreement persists unless CT sacrifices its flexibility, while KP’s rigidity allows chaining at the cost of fewer context-dependent escapes.
