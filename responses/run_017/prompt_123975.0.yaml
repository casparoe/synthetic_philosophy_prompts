prompt: |-
  You are advising the research director of a technical AI safety group that has committed, for the next two years, to debate-style scalable oversight as one of its two main research lines, where a weaker judge adjudicates between two systems that argue for competing answers. The budget under discussion is small: about eight researcher-years, plus enough compute to run experiments with current open-weight models, but no access to frontier closed models and no ability to test protocols with systems substantially more capable than the judge. The point of the agenda you produce is a go/no-go decision: at the end of the two years, leadership will use it to decide whether to keep the line, shrink it, or shut it down and move the people to some other oversight approach. So a question is worth working on partly insofar as its answer would still be informative if the group ends up switching methods.

  Before you begin, three distinctions I want you to keep separate, because they are not standard in the way this topic is usually framed and I do not want them collapsed into each other:

  1. Verification-depth gap. For a given question distribution, compare the checking effort a fixed judge needs in order to reach some confidence level in a directly submitted answer against the checking effort the judge needs to reach that same confidence by working through a debate tree. Call the ratio the verification-depth gap. Debate is only doing genuine amplifying work where that gap is large; where it is near one, the protocol is mostly overhead.

  2. Credibility-matching obfuscation. The usual worry is that a dishonest debater hides an error inside a long or technical-looking argument. There is a second failure mode: the honest debater is driven to make a simple correct answer look complicated, padding it with steps, caveats, or formalism, because a judge unable to distinguish depth from mere laboriousness rewards whichever argument looks more worked-through. Here the debate fails even though no error is hidden: simplicity has stopped being credible.

  3. Deferred adjudication. Suppose a judge's verdict is not scored at the time of the debate but settled much later, either by eventual empirical outcomes or by a more capable successor system auditing the transcript. Obfuscation that cannot survive later audit may be a very different problem from obfuscation that can, and the two may deserve different amounts of the group's effort.

  Given all that: which three open questions about obfuscated arguments and the limits of debate should this group work on, and in what order? I want the ordering defended rather than asserted. For each question, say what else it is upstream of, how tractable it is with eight researcher-years and no access to systems smarter than the judge, and what specific empirical or theoretical result over the next eighteen months would move it up or down the list. Then name one or two lines of work in this area that you would explicitly deprioritize, and explain why their answers would change neither the go/no-go decision nor anything downstream of it.

  Work directly from the distinctions above instead of from how the problem is conventionally presented, and do not cite, survey, or recommend readings. Aim for roughly a thousand words, in American English.
reasoning: |-
  Hmm, the user is asking me to advise a research director of an AI safety group on prioritizing questions about obfuscated arguments in debate-style scalable oversight. They've provided three important distinctions that I need to focus on: verification-depth gap, credibility-matching obfuscation, and deferred adjudication. This group has a limited budget of eight researcher-years and can only work with current open-weight models - no access to frontier systems.

  The core challenge is to identify three open questions about obfuscation in debate systems that would inform a go/no-go decision after two years. I need to prioritize these questions based on how they address the distinctions, their tractability with limited resources, and their relevance even if the group switches methods later.

  For the first question, I should examine the verification-depth gap - understanding how much efficiency debate actually provides. This is foundational since if the gap is small, debate might not be worth pursuing. I can test this by having models debate questions with varying complexity and comparing direct verification versus debate verification.

  The second question should tackle credibility-matching obfuscation - where honest debaters are forced to complicate simple truths to appear credible. This is important because it reveals if debate inherently distorts truth. I can design experiments with models deliberately simplifying or complicating arguments to see how judges respond.

  For the third question, deferred adjudication is key - how obfuscation holds up under later audits. This matters because real-world oversight might involve delayed verification. I can simulate audits by having more capable models review past debates.

  I need to explicitly deprioritize certain areas too. For example, optimizing current debate prompts might not be worthwhile since it doesn't address fundamental limitations. Similarly, studying obfuscation in asymmetrical debates where one side is weaker might not provide insights for balanced scenarios.

  For each question, I'll outline what would move it up or down the priority list - such as finding large verification-depth gaps making it more important, or discovering that deferred adjudication easily catches obfuscation making it less critical. The ordering should be logical: start with whether debate provides value (depth gap), then examine if it corrupts truth-telling (credibility-matching), and finally consider long-term viability (deferred adjudication).

  The user wants me to work directly from their three distinctions rather than conventional approaches, so I'll avoid standard debate literature and focus on these specific angles. My advice should be practical and actionable within their constraints, aiming to provide clear direction for their research agenda over the next two years.
answer: |-
  Here is a prioritized research agenda focusing on obfuscation limits in debate, structured around your distinctions and constraints:

  **Priority Order & Rationale:**

  1.  **Question 1: How large is the verification-depth gap for questions of varying inherent complexity, and what factors most influence it?**
      *   **Why First?** This is the **foundational efficiency question**. If the gap is consistently small (~1) across many relevant question types, debate is mostly overhead, making the entire research line likely non-viable. It directly addresses the core promise of debate (amplification). Resolving this is upstream of *everything else*: if the gap is negligible, obfuscation failure modes (Points 2 & 3) become secondary concerns. It also informs resource allocation for the other questions.
      *   **Tractability:** High with given resources. Requires designing diverse question distributions (factual, reasoning, chain-of-thought, semi-formal), running direct-judgment baselines vs. debate protocols (fixed tree depths/times), and measuring judge effort (time, compute, steps) to reach target confidence/accuracy. Open-weight models suffice to test the *principle* and identify influencing factors (e.g., question type, judge capability relative to answer difficulty, optimal tree depth). Focus is on relative effort, not absolute performance.
      *   **Upstream Of:** Prioritization of Q2 & Q3, fundamental viability of debate for amplification, design of future protocols.
      *   **Move Up/Down:** **Up** if early results show large gaps (>2x) for non-trivial questions, confirming potential value. **Down** if gaps are consistently small (<1.5x) even after protocol tuning, suggesting inherent inefficiency.

  2.  **Question 2: Under what conditions does credibility-matching obfuscation dominate, and can protocols be designed to robustly penalize it?**
      *   **Why Second?** Once we know debate *can* amplify (Q1), we must ensure it doesn't *distort* truth (Point 2). This failure mode corrupts the very goal of accurate oversight and is distinct from hiding errors. It's a core threat to debate's reliability. Understanding its prevalence and mitigations is essential before investing in scaling. It's upstream of protocol design choices and judge training objectives for reliable debate.
      *   **Tractability:** Moderate. Requires experiments where:
          1.  Ground-truth "simple" answers exist for questions.
          2.  Debater models are trained/guided to either argue simply & correctly or to obfuscate correctness with unnecessary complexity (without introducing factual errors).
          3.  Judge behavior is measured: does complexity bias lead them to favor the obfuscated correct answer over the simple correct one? Can interventions (judge training, reward shaping, protocol rules like "simplicity bonuses") mitigate this?
      Open-weight models can exhibit these dynamics. The challenge is designing clean tests and effective interventions within the compute/judge-smarts constraint.
      *   **Upstream Of:** Mitigation strategy development, judge training paradigms, understanding the "cost of honesty" in debate.
      *   **Move Up/Down:** **Up** if Q1 shows promise *and* initial experiments show high susceptibility to credibility-matching, making it a critical bottleneck. **Down** if Q1 shows weak amplification *or* if early results show judges robustly prefer simple correct answers even against heavily obfuscated ones under basic protocols.

  3.  **Question 3: How does the threat landscape for obfuscation (both hiding errors and credibility-matching) change under deferred adjudication, and does it enable feasible detection strategies?**
      *   **Why Third?** Deferred adjudication (Point 3) changes the game. Obfuscation that fools a weak judge temporarily might be trivial for a stronger auditor later. This could *reduce* the threat (some bad outcomes caught later) or *enable new strategies* (e.g., sacrificing short-term judge deception for long-term auditor confusion). It's crucial for assessing the long-term safety properties and potential retroactive auditability of debate. It relies on understanding the *nature* of obfuscation (explored in Q2) and assumes debate has potential (Q1).
      *   **Tractability:** Lower (but feasible). Key challenge: Simulating "future auditors" without access to smarter models. Approaches:
          *   **Theoretical:** Modeling obfuscation as steganography or complexity arguments; analyzing how different obfuscation types (factual smokescreens vs. credibility-matching complexity) might fare against idealized auditors.
          *   **Empirical Proxy:** Using the *same* models as judges but granting auditors significantly more time/compute per transcript and access to external verification tools (simulated via API calls or pre-defined checks). Measure if auditors reliably detect obfuscation missed by the original judge. Can we train "auditor models" specifically on detecting historical obfuscation patterns?
      Requires careful setup to approximate deferred adjudication meaningfully with limited models.
      *   **Upstream Of:** Long-term safety arguments for debate, design of audit trails, understanding the recoverability of truth from debate transcripts.
      *   **Move Up/Down:** **Up** if Q1/Q2 show promise *and* early proxy-audit experiments show obfuscation is frequently detectable later, boosting confidence. **Down** if Q1/Q2 are discouraging *or* if initial results show even proxy auditors struggle significantly with the types of obfuscation generated, making deferred detection unreliable.

  **Explicitly Deprioritized Lines of Work:**

  1.  **Fine-tuning Debate Agents for Maximum Short-Term Win-Rates Against Specific Judges:**
      *   **Why Deprioritize?** This is often an early benchmark, but it's highly susceptible to overfitting to the specific judge model and debate setup. Success here doesn't reliably address the core concerns:
          *   It might exploit judge weaknesses (like favoring obfuscation - Point 2) rather than demonstrate robust truth-telling.
          *   It doesn't measure the *verification-depth gap* (Point 1) – a system could win debates inefficiently.
          *   It provides little insight into *deferred adjudication* (Point 3).
          *   Results are unlikely to generalize to smarter models or different judge types, making them poor evidence for the go/no-go decision about debate's *fundamental* viability for oversight. Resources are better spent on the foundational questions above.

  2.  **Studying Pure "Hiding Errors in Complexity" Obfuscation in Isolation under Symmetric Conditions without Credibility-Matching Pressure:**
      *   **Why Deprioritize?** While hiding errors is a classic concern, your distinction highlights "credibility-matching obfuscation" (Point 2) as a distinct and potentially critical failure mode. Focusing *only* on scenarios where one debater tries to hide an error while the other argues simply and correctly misses:
          *   The systemic pressure *both* debaters face to appear credible via complexity.
          *   The scenario where the *correct* answer is simple but rendered non-credible.
          *   While hiding errors is important, understanding Point 2 is arguably more novel and insidious. Furthermore, experiments designed solely for hiding errors often don't create the competitive pressure for *honest* obfuscation. Resources spent here wouldn't illuminate the critical credibility-matching dynamic or provide as much insight into the verification-depth gap's *quality* (efficiency vs. truthfulness). It's downstream of understanding the core amplification potential (Q1) and the systemic distortion risk (Q2).

  **Summary Justification:**

  This ordering directly targets the core value proposition (Q1: Amplification Efficiency), then the core threat to truthfulness inherent in the debate structure (Q2: Credibility-Matching Distortion), and finally the long-term safety dynamic (Q3: Deferred Adjudication). Progress on Q1 provides the essential context for prioritizing Q2 and Q3. Q2 addresses the most insidious novel failure mode you highlighted. Q3, while crucial for ultimate safety assessment, is less urgent for the initial 2-year go/no-go and harder to test rigorously without smarter models. The deprioritized work focuses on optimizations or isolated scenarios unlikely to change the fundamental assessment of debate's viability under the key distinctions. This agenda maximizes the information gained about debate's core mechanisms and failure modes relevant to scalable oversight within the constraints, informing a sound go/no-go decision.
