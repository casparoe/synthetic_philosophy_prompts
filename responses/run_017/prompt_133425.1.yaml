  Below is a structured specification of desiderata for a decision rule handling one-shot gambles with undefined expected value (e.g., the Pasadena game), based on your requirements and cases. The focus is on **criteria for adequacy**, **conflicts between desiderata**, and a **scorecard of candidate approaches**. The purpose is fixed: the agent must decide yes/no at a stated price, with optional quitting and pre-existing bets on the same coin flips. Verdicts are required, not undefined "shrugs."

  ---

  ### **Core Desiderata**  
  *What any theory must deliver to be taken seriously (non-negotiable for your purpose):*  

  1. **Defined Verdicts for All Offered Gambles**  
     - The theory must output "accept" or "reject" for any stated price of any gamble, including St. Petersburg (infinite EV), Pasadena (undefined EV), and variants. No undefined outcomes.  
     - *Rationale:* You need actionable decisions, not philosophical debates. Handles cases like the uncapped Pasadena game.  

  2. **Distinction Between Failure Modes**  
     - The theory must treat St. Petersburg (divergent infinite EV) and Pasadena (undefined/non-convergent EV) differently. They are distinct pathologies; flattening both to "EV broken" is inadequate.  
     - *Rationale:* Critical for cases like capped truncations (where St. Pete’s truncations → ∞, Pasadena’s → ln 2).  

  3. **Context Sensitivity for Pre-Existing Bets**  
     - The value of a new gamble must account for the agent’s **existing bets on the same coin flips**. Identical payout distributions may have different values if correlated with pre-existing risks.  
     - *Rationale:* Solves the "scrambled Pasadena" problem: if the agent holds a side bet on even-numbered first heads, scrambled payouts tied to sequences are not interchangeable. Rejects "value supervenes solely on payout distribution" as a bias of probability-first approaches.  

  4. **Handling Quitting as a First-Class Feature**  
     - For quittable gambles, the theory must:  
       - Assign a value at every decision node (after k tails), not just ex-ante.  
       - Ensure the option to quit never harms the agent (i.e., value with quitting ≥ value without).  
       - Provide a dynamically consistent optimal quitting strategy.  
     - *Rationale:* Quitting changes the game structure (e.g., in Pasadena, locked-in value ≈ ln 2, but continuation values oscillate wildly). Dynamic consistency is essential for sequential decisions.  

  5. **Boundedness Agnosticism**  
     - The theory must **not require utility bounded below** to resolve Pasadena. Bounding utility below (to handle unbounded losses) is "stranger" and less realistic than bounding above.  
     - *Rationale:* Avoids ad hoc assumptions; you want decisions for money, not utility transformations.  

  ---

  ### **Secondary Desiderata**  
  *Highly desirable but negotiable if conflicts arise with core requirements:*  

  6. **Shifting Consistency**  
     - If an agent would pay `x` for gamble `G`, they must pay `x + c` for `G` with a fixed amount `c` added to every payout.  
     - *Rationale:* Basic coherence for monetary payouts.  

  7. **Bundling Consistency for Independent Copies**  
     - If an agent would pay `x` for independent gamble `G`, they must pay `2x` for two independent copies of `G`.  
     - *Rationale:* Linear scaling for independent replicates is intuitive (but may fail under risk aversion).  

  8. **Agreement with Capped Truncations**  
     - For capped Pasadena (at `N` tosses), the value must match the expectation of the truncation (the `N`-th partial sum of the alternating harmonic series). For the uncapped game, the value should equal the limit of these truncations (ln 2) if possible.  
     - *Rationale:* Capped versions are well-behaved and converge to ln 2, providing a natural anchor. St. Pete’s divergence in truncations reinforces the distinction.  

  9. **Dynamic Agreement with Locked-In Value**  
     - When quitting is disallowed, the value of the gamble should match the ex-ante value of the locked-in game.  
     - *Rationale:* Consistency across game variants (quittable vs. non-quittable).  

