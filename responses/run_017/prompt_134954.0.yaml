prompt: |-
  hi — i do a fortnightly lunch-and-learn for the eng org: 30 minutes, whiteboard, half engineers half PMs, nobody with any philosphy or econ background, and i've somehow agreed to run one on commitment races. What i mean is: the payoff depends on who locks themselves in first, not on what anyone ends up choosing, so both sides rush to burn their own bridges early, and the harm comes from the rushing rather than from anyone picking the nasty option (an arms race is about who accumulates more capacity; this is about who forecloses their own options first). Don't explain it to me — plan how i should explain it to them. I want: the order the pieces have to come in and what depends on what (my guess is they need to see why a threat you can quietly walk back is worthless before any of the rest lands); the one example that should carry the whole thing — i was going to use two of our teams racing to ship a breaking change to a shared API, tell me if that's wrong and what the example has to have and must not have; the misconceptions in the order they'll actually say them out loud (my moneys on "isn't this just prisoner's dilemma", "just talk to each other" and "so one side should just slow down") and exactly where in the sequence to kill each; one question at the end that shows they got the timing bit rather than just "cooperation would be nicer"; and what i should flat out refuse to get dragged into at this level. Finish with a last line: Takeaway: <the one sentence i want them repeating in standup on Monday>.
reasoning: |-
  We are going to explain commitment races (also known as brinkmanship or pre-commitment games) to an engineering and PM audience. The key is to show that the harm comes from the rush to burn bridges early, not from the choice itself.

  Order of Explanation:
  1. Start with the concept of credible threats and why they matter in strategic interactions.
  2. Show that for a threat to be credible, it must be irreversible (you burn your bridges). Otherwise, the other party won't believe it.
  3. Then introduce the problem: when both sides have an incentive to make an irreversible commitment first to force the other to back down, they both rush to do so. This rush is costly and leads to inefficiency.
  4. Use the example of two teams racing to ship a breaking change to a shared API. This example is good because:
     - It's relatable to engineers.
     - The harm is in the rush (shipping a breaking change without coordination, which might break things) rather than in the change itself (if done with coordination, it might be fine).
     - What the example must have: irreversible actions (once the breaking change is shipped, it's hard to roll back) and a situation where the first to commit forces the other to adapt.
     - What it must not have: the possibility of easy coordination (so we can later address why "just talk" doesn't always work) and it should not be symmetric in a way that looks like a prisoner's dilemma (which we will distinguish).
  5. Address misconceptions as they naturally arise in the flow.

  Sequence:

  1. Start with the idea of making threats in negotiations (e.g., "If you don't do X, I will do Y"). 
     - But note: if you can easily back down, the threat isn't credible. 
     - Example: "If you don't change your API, I will break compatibility." But if you can just as easily not break it, then the other team won't believe you.

  2. Introduce the concept of burning bridges to make a threat credible. 
     - Once you have made it impossible to back down, the threat becomes real. 
     - Example: You actually ship the breaking change. Now the other team has no choice but to adapt.

  3. Now, the twist: what if both teams are in the same position? 
     - Each wants the other to adapt. 
     - Each has an incentive to be the first to ship the breaking change to force the other to adapt. 
     - But if both rush to ship, they both end up shipping breaking changes, causing chaos (both systems break). 
     - The problem: the race to commit first leads to both committing, which is worse than if they had coordinated.

  4. Use the breaking change example in detail:
     - Team A and Team B share an API. 
     - Team A wants to change the API in a way that breaks Team B's usage. 
     - Team B also wants to change the API in a way that breaks Team A's usage. 
     - If Team A moves first and ships the change, Team B is forced to update their code. 
     - Similarly, if Team B moves first, Team A has to update. 
     - But if both try to move first and ship without coordination, both break each other. 
     - The harm: the rush to ship without testing, without coordination, and without proper notice, which causes instability and extra work.

  5. Address misconceptions in the order they are likely to come:

     a. "Isn't this just the prisoner's dilemma?"
        - When: After presenting the scenario but before the resolution.
        - How to kill: Prisoner's dilemma is about both having a dominant strategy to defect (which leads to mutual defection) regardless of what the other does. In a commitment race, the problem is the timing: if one commits first, they win and the other loses. But if both commit at the same time, both lose. The key difference is that in a commitment race, the act of commitment is irreversible and the first-mover advantage is critical. In prisoner's dilemma, there is no sequential element.

     b. "Why not just talk to each other?"
        - When: After explaining the scenario.
        - How to kill: Acknowledge that communication can help, but sometimes:
            - There might be incentives to lie (e.g., "I'm not going to break it" while secretly planning to).
            - Even with communication, without a binding agreement, each team might still rush to commit first because they fear the other will break the agreement.
            - In the real world, communication might be difficult (e.g., multiple teams, time pressure).

     c. "So one side should just slow down?"
        - When: After explaining that the rush is the problem.
        - How to kill: If one side slows down, they risk the other side committing first and forcing them to adapt. So unilaterally slowing down is not in their interest. What we need is a way to coordinate to avoid the race altogether.

  6. The key insight: The problem is the race to irreversibility. The solution must involve either:
     - Removing the possibility of a first-mover advantage (by making commitments simultaneous or having a coordination mechanism).
     - Creating a way to make irreversible commitments in a controlled manner (e.g., a shared calendar for breaking changes, a mutual agreement on a freeze period, or a third-party mediator).

  7. End with a question that tests understanding of the timing element:
     - "What happens if both teams try to commit at the same time? Why is that worse than if one commits first and the other adapts?"

  8. What to avoid getting dragged into:
     - Deep game theory (e.g., Nash equilibria in other games).
     - Solutions that require changing human nature (like "everyone should be nice").
     - Complex real-world examples that require domain knowledge outside the room.

  Takeaway: 
     "In a commitment race, the rush to burn bridges first causes mutual harm; coordinate to avoid the race."

  Final Last Line: 
     Takeaway: "The race to commit first causes mutual harm; coordinate to avoid the race."
answer: |-
  ### Explanation Plan for Commitment Races Lunch-and-Learn  
  *(30 minutes, whiteboard, mixed eng/PM audience)*  

  ---

  #### **Order of Pieces & Dependencies**  
  1. **Start with the core problem:** "Rushing to burn bridges causes harm, even if no one wants the 'nasty' outcome."  
     *Dependency*: Must establish this *before* explaining why it happens.  

  2. **Credible threats as the foundation:**  
     - Draw a simple threat scenario (e.g., "I’ll break the API if you don’t change!").  
     - Reveal flaw: *Empty threats don’t work* because you can back out quietly.  
     *Dependency*: Audience must grasp why *irreversibility* is key. Without this, the "race" concept won’t land.  

  3. **Introduce irreversibility = power:**  
     - "Burning your bridge (e.g., shipping code) makes your threat credible."  
     - *But*: If both sides do this, it backfires.  

  4. **Commitment race dynamics:**  
     - Show the rush: Both sides race to burn bridges first to force the other to back down.  
     - Harm comes from the *rush* (e.g., breaking things) not the outcome itself.  

  5. **Example & misconceptions:** Layer these in *after* step 4.  

  ---

  #### **The Central Example: Two Teams & a Breaking API Change**  
  **Why it works:**  
  - ✅ **Relatable**: Engineers/PMs know shared API pain.  
  - ✅ **Irreversibility**: Shipping code is committing (hard to roll back).  
  - ✅ **Harm from rushing**: Breaking prod, duplicated work, chaos.  
  - ✅ **No "nasty" option needed**: Both teams might prefer coordination, but the *race* forces reckless action.  

  **What it must avoid:**  
  - ❌ Symmetric payoffs (e.g., Prisoner’s Dilemma).  
  - ❌ Blame on either team (emphasize *systemic* failure).  

  **Whiteboard flow:**  
  1. Team A and Team B share an API.  
  2. Both plan breaking changes (e.g., deprecating legacy endpoints).  
  3. **Race**: Whoever ships first forces the other to adapt.  
  4. **Rush harm**: Both ship hastily → system breaks, fires everywhere.  
  5. **Crucial point**: Even if both *prefer* coordinating, the incentive to "go first" creates a race.  

  ---

  #### **Misconceptions to Crush (in predicted order)**  
  1. **"Isn’t this just Prisoner’s Dilemma?"**  
     - *When raised*: After introducing the example.  
     - **Kill it**:  
       - "PD is about mutual defection *regardless* of timing. Here, **timing is everything**: The *first* to commit wins. If both commit, both lose, but it’s a race to lock in, not a binary choice."  
       - Whiteboard: PD has symmetric payoffs; commitment races have **first-mover advantage**.  

  2. **"Just talk to each other!"**  
     - *When raised*: When discussing solutions.  
     - **Kill it**:  
       - "Talking helps, but **cheap talk fails** if you can’t trust the other side to not race. What if they say they’ll wait… but ship anyway to ‘win’? You *still* have incentives to rush."  
       - Emphasize: The race happens *because* coordination isn’t enforceable.  

  3. **"So one side should slow down?"**  
     - *When raised*: When discussing harm.  
     - **Kill it**:  
       - "If you slow down unilaterally, you **lose by default**. The other team ships first, and you’re stuck adapting. Slowing only works if *both* agree—but that requires trust we don’t have."  

  ---

  #### **Key Question to Test Understanding**  
  **Ask at the end**:  
  > *"What happens if both teams try to commit at the exact same time? Why is this the worst outcome?"*  
  - **Why it works**: Reveals if they grasp that the *race* (not the intent) causes harm.  
  - **Target answer**: "Simultaneous commitment maximizes chaos (both break everything), but the race *incentivizes* this risk. Timing turns a solvable conflict into mutual destruction."  

  ---

  #### **What to Avoid**  
  **Refuse to get dragged into**:  
  - Deep game theory math (no matrices, no Nash equilibria).  
  - Real-world politics ("Team X always does this!").  
  - Non-commitment scenarios (e.g., pure coordination problems).  
  **Shut these down with**: "That’s a great topic for another chat! Today, we’re laser-focused on why *rushing to commit* breaks things."  

  ---

  #### **Final Line**  
  **Takeaway**: *"Commitment races turn coordination problems into races to burn bridges—slow down the race, not just the outcome."*  

  ---

  **Why this works**:  
  - Starts concrete (API example), then abstracts.  
  - Kills misconceptions *in the moment* they arise.  
  - Ends with a tactical takeaway engineers/PMs can apply (e.g., "How do we slow the race?").  
  **Delivery tip**: Use the whiteboard to sketch the race timeline—audiences remember visuals.
