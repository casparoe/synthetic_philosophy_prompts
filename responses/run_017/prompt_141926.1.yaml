prompt: |-
  I work in comparative federalism — for the past two years on a project comparing how the United States, Germany, Switzerland and the European Union allocate competences between levels of government — and there is one argument that has stopped moving entirely, both in the literature I read and in our own working group. It is the argument about whether subsidiarity is a genuine principle with determinate content or an empty formula that any outcome can be dressed up in.

  The two positions, stated as fairly as I can. One side holds that the principle gives real guidance: the standard formulation is a two-limb test — act at the higher level only if the lower level cannot sufficiently achieve the objective and the higher level can achieve it better — and whatever its indeterminacy in practice, it can be made operational, and its weak enforcement is a political or institutional failure, not a conceptual one. The other side holds that both limbs are plastic to the point of vacuity: the "cannot sufficiently achieve" limb is nearly always satisfiable, since any single jurisdiction that declines to cooperate makes uniform action impossible, while the "better achieved" limb simply restates whatever cost-benefit judgement the decision-maker was going to make anyway. On that reading the principle functions as a legitimation formula for a settlement reached on other grounds, which is why, as far as I can tell, courts in all four systems have been extremely deferential in applying it and why the EU's mechanism for national parliaments to object has been used only rarely.

  My hypothesis is that this is three disagreements under one name. First, a difference about which principle is in play: an epistemic one (which level has the better information), a democratic one (proximity, voice, the interests genuinely affected), and a liberal one (protecting self-rule, exit and interjurisdictional competition) — each camp quietly selecting the reading that supports the outcomes it likes. Second, a disagreement about which cases count as data: one side's paradigm case is a cross-border spillover or a race to the bottom, the other's is divergent local preferences and policy experimentation, and once the paradigm is fixed the two sides largely converge. Third, a hidden empirical question about the relative frequency and severity of those two case types, which nobody seems to think is their job to answer.

  There is also a wrinkle I have not seen addressed and that I would like taken seriously. Subsidiarity ranks a given set of levels, but the set of levels is itself a political artefact: river basins, metropolitan labour markets, airsheds and currency areas are not levels in any of the four constitutions, and the principle, as stated, has nothing to say about whether the right unit of decision is one that does not yet exist. Is that a fatal incompleteness — the principle cannot rank until someone supplies a theory of the correct partition, and no such theory is on offer — or is it a detachable objection that a defender can absorb?

  What I want is a diagnosis of the impasse, not an overview of the doctrine and not a verdict on who wins. Is my three-part hypothesis right, and if so which component is doing most of the work? Is the core of it verbal, a clash of incommensurable starting intuitions, or a real but unacknowledged empirical question? And given the diagnosis, what would actually count as progress — a refinement of the test's second limb, a formal result about the insufficiency limb under non-cooperation, a comparative empirical programme, or a change of question? Or is this a case where no progress should be expected, and if so, why?
reasoning: |-
  Hmm, the user is grappling with a fundamental impasse in comparative federalism regarding subsidiarity's substantive content versus its emptiness as a legitimizing formula. They've identified three underlying disagreements beneath the surface debate and raised an unaddressed structural issue about predefined levels. Their hypothesis deserves serious engagement.

  First, the core impasse seems perfectly framed. Both sides have coherent positions: one seeing subsidiarity as an operational principle betrayed by poor implementation, the other viewing it as inherently vacuous due to its malleable criteria. The user's three-layer hypothesis feels insightful - I can immediately see how epistemic, democratic, and liberal interpretations would pull the principle in different directions. The paradigm case divergence also resonates; if you start from environmental spillovers versus education policy, your entire framing shifts.

  The unaddressed "wrinkle" about predefined levels is particularly acute. Subsidiarity assumes fixed tiers, but functional governance units (like watersheds) often mismatch constitutional structures. This isn't just incomplete - it reveals the principle's embeddedness in existing power structures. A defender might counter that subsidiarity applies to existing institutions, but that feels like dodging the deeper point about how levels are constituted.

  Empirically, both sides seem guilty of selective evidence use. The pro-content camp highlights cases like EU environmental directives where cross-border logic clearly applies, while the vacuity camp points to deadlocks like fiscal harmonization where "sufficient achievement" becomes politicized. Neither engages with the relative frequency question - probably because it's methodologically thorny across four systems.

  For progress routes, refining the "better achievement" limb seems least promising given its inherent subjectivity. The non-cooperation problem offers more traction - perhaps modeling when lower-level defection legitimately triggers upward allocation versus when it's strategic obstruction. But the most fertile ground may be the user's third layer: designing comparative metrics for spillover intensity versus preference heterogeneity across policy domains. This wouldn't resolve the normative debate but could ground it.

  Ultimately, this might be a durable conceptual tension rather than a solvable puzzle. The principle's ambiguity is why federal systems adopt it - it accommodates both centralists and decentralists. The real function may be to force explicit justification of level-choice rather than provide determinate answers. That doesn't mean abandoning analysis, but recognizing that its value lies in structuring debate, not resolving it.
answer: |-
  Your analysis is remarkably sharp—you've identified the core fractures beneath this persistent stalemate. Let's diagnose the impasse through your framework and suggest pathways forward.

  ### Diagnosing the Impasse
  1.  **Your Three-Part Hypothesis is Largely Correct:**
      *   **Different Principles in Play (Epistemic/Democratic/Liberal):** This is fundamental. The principle's *appeal* lies in its ability to be "all things to all people." A centralist emphasizes epistemic efficiency (e.g., harmonizing standards to prevent fragmentation) or negative externalities. A decentralist emphasizes democratic voice/identity or liberal exit/experimentation. **This is doing the MOST work:** It allows both sides to claim subsidiarity while talking past each other. The "indeterminacy" stems partly from this unacknowledged value pluralism baked into the principle.
      *   **Divergent Paradigm Cases:** This reinforces the first point. Choosing the paradigm *predetermines* the outcome. If your mental model is climate change (clear cross-border spillover, potential race-to-bottom), the higher level seems obviously necessary. If it's cultural policy or local service delivery (strong preference heterogeneity), the lower level wins. **This component concretizes the value conflict.** It's not just disagreement *about* cases; it's disagreement *on which cases define the problem.*
      *   **Hidden Empirical Question:** This is crucial but neglected. How *frequent* and *severe* are genuine cross-border spillovers/collective action problems vs. situations where local diversity/experimentation dominates? **This is the component most amenable to progress,** yet it's rarely tackled systematically across diverse policy fields. The impasse persists because neither side feels compelled to engage with the other's empirical reality; their paradigm feels sufficient.

  2.  **The "Wrinkle" (Predefined Levels) is Foundational, Not Detachable:**
      *   You've hit a profound weakness. Subsidiarity is **inherently conservative** regarding institutional design. It operates *within* a given constitutional architecture. It cannot tell you whether Canton A and Region B *should* be the relevant "lower levels" for air pollution control versus a transnational basin authority. The principle assumes the levels are given and "correct."
      *   **This is a fatal incompleteness for a *comprehensive* theory of competence allocation.** It exposes subsidiarity as a principle for managing *existing* federal bargains, not designing optimal ones. A defender might argue it's a principle for *rebutting centralization presumptions within an existing structure*, not for architectural design. But this concedes its limitations and reinforces the "legitimation formula" critique – it justifies decisions made elsewhere about *what the levels are*.

  3.  **Core of the Impasse: Verbal & Normative, Masquerading as Conceptual:**
      *   **Verbal:** The terms ("sufficiently," "better," "objective") are inherently contestable and value-laden. They provide a *vocabulary* for debate, not an algorithm.
      *   **Normative:** The fundamental clash is over values (centralized efficiency/equality vs. local autonomy/experimentation/diversity) and power (who decides?). Subsidiarity is the battlefield, not the weapon.
      *   **Empirical:** While a real underlying question exists (frequency/severity of spillovers vs. heterogeneity), the *intensity* of the debate stems from the normative conflict. The empirical question feels secondary because the paradigm cases chosen reflect pre-existing normative commitments.

  ### Why the Impasse Persists
  *   **Functional Ambiguity:** The ambiguity is *why* subsidiarity is politically useful. It allows compromise and avoids constant constitutional crises by providing a flexible, legitimizing discourse.
  *   **Institutional Deference:** Courts and political bodies (like EU NPs) recognize this ambiguity and the political nature of the decision. Enforcing it rigidly would be deeply intrusive and destabilizing. Deference isn't just weakness; it's often pragmatic acknowledgement of the principle's limits.
  *   **Lack of Incentive:** Scholars and practitioners entrenched in their paradigms gain little from conceding the other side's empirical reality or core normative priority. The debate structure rewards rhetorical victory within camps.

  ### Pathways to Progress (Not Resolution)
  Forget "who wins." Focus on making the debate more productive:

  1.  **Refine the Empirical Question & Launch Comparative Program:**
      *   **This is the most promising path.** Systematically map competence allocation decisions across your four systems (and others) in diverse policy areas (environment, social policy, economic regulation, culture).
      *   **Analyze:** Was subsidiarity invoked? How? What was the *stated* justification (spillover, scale economies, preference heterogeneity, rights protection)? What was the *actual* driver (crisis, lobbying, court ruling, political deal)?
      *   **Measure (where possible):** Attempt to quantify the *nature* of the problem (e.g., spatial scope of pollution, heterogeneity of preferences via surveys, potential for regulatory arbitrage). This moves beyond paradigm cases to a broader dataset.
      *   **Goal:** Not to "prove" subsidiarity right/wrong, but to identify *patterns*: Under what *observable conditions* do systems tend to centralize/decentralize? Does the rhetoric match the reality? Does the "non-cooperation = insufficiency" argument hold empirically?

  2.  **Formalize the "Non-Cooperation" Problem:**
      *   Develop game-theoretic or institutional analysis models examining when lower-level non-cooperation genuinely creates a collective action problem justifying centralization vs. when it reflects legitimate dissent or strategic bargaining.
      *   **Goal:** Provide clearer analytical tools to distinguish "genuine insufficiency due to defection" from situations where the "insufficiency" claim is a centralizing power grab exploiting minor non-compliance. This refines the *application* of the first limb.

  3.  **Explicitly Acknowledge Value Pluralism & Disaggregate:**
      *   Stop debating "subsidiarity" monolithically. Be explicit: *Which aspect* of subsidiarity is paramount for *this specific competence/policy*? Is it primarily about information costs (epistemic)? Democratic voice? Preventing harmful competition? Protecting fundamental rights?
      *   **Goal:** Shift the debate from whether subsidiarity "works" to *which rationale* is most compelling *in this context*. This makes disagreements clearer and potentially more resolvable on a case-by-case basis.

  4.  **Change the Question: Embrace Subsidiarity as Process, Not Outcome:**
      *   Accept that subsidiarity might never provide a single "correct" answer on *where* competence lies. Reframe it as a **procedural principle** requiring:
          *   Explicit justification for centralization *referencing the limbs*.
          *   Serious consideration of lower-level capacity/alternatives.
          *   Mechanisms for lower-level input (like the EU's yellow card, however weakly used).
      *   **Goal:** Judge subsidiarity not by the outcome it produces, but by the *quality of the deliberation and justification* it forces upon decision-makers. Progress here means better institutional designs for subsidiarity assessments.

  ### Should Progress Be Expected?
  *   **Not towards a single, universally accepted, determinate content.** The core values (efficiency, autonomy, voice, equality) are fundamentally in tension, and the "correct" level depends on context-specific empirical factors and normative weightings. The ambiguity is inherent and functional.
  *   **Yes, towards a more sophisticated, empirically grounded, and transparent debate.** Progress means:
      *   Moving beyond pure paradigm cases.
      *   Acknowledging the different normative principles smuggled into the concept.
      *   Developing better tools to analyze the empirical conditions (spillovers, heterogeneity).
      *   Understanding the principle's function as a procedural discipline/legitimating discourse within existing institutional structures.
      *   Recognizing its limitations regarding the fundamental design of levels.

  Your "wrinkle" about predefined levels underscores that subsidiarity cannot be the *sole* principle for a federal order. It needs complementing by principles addressing the *design* of levels (democratic legitimacy, functional efficacy, historical identity) and mechanisms for *changing* levels (secession, merger, creation of new entities). Accepting this incompleteness is itself progress.

  The impasse persists because it serves a purpose. Breaking it requires shifting focus from winning the abstract argument to understanding how the principle actually operates in diverse contexts and what work we realistically want it to do. Your three-part hypothesis provides the perfect roadmap for this more productive inquiry.
