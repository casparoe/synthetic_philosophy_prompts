prompt: |-
  I am a retired experimental physicist — nearly forty years in solid-state chemistry, most of them at a single institute — and for the last two years I have been going to a philosophy reading group at the local adult-education centre, largely because I wanted to understand what my colleagues thought they were doing when they argued about priority. We are working slowly through Nietzsche's 1874 essay on the uses and disadvantages of history for life, with its three ways of relating to the past — the monumental, the antiquarian and the critical — and I came to it because of something I had noticed in my own field for decades and never had a word for. Two episodes, which I will describe loosely, since I have no wish to start an argument with former colleagues. First: my subfield holds an annual lecture named after the man who made the measurement that started everything, and every speaker retells the story as the moment the field became quantitative; the original paper, which I read as a student, reported something much narrower and was in part wrong, and it is now routinely cited as support for a claim its authors explicitly declined to make. Nobody in that room experiences the mismatch as falsification. It is experienced as fidelity, and the story visibly does the work of making new graduate students feel that great work is still possible here. Second: the founding model of the field was known to be quantitatively wrong by the mid-1980s, is still taught in the first lecture of the introductory course, and still functions as the thing people measure themselves against; and when, every decade or so, some of us point out that the founder held views we now reject, the monument is not damaged by the criticism — it comes back shinier, the criticism having somehow been absorbed as part of what makes him interesting.

  What I cannot fit is the shape of the change over time. The monument is not stable. In the 1970s the founding figure of the field was the theorist who built the model; by the 1990s it was the experimentalist who killed it; now it is a younger contemporary of theirs whose neglected paper is presented as the true origin — and each generation's textbooks and after-dinner speeches present their own selection as though it had always been the selection, so that the field reveres a past it continuously rewrites and has no recollection of having rewritten. Three details seem to me to matter and to pull in different directions. The veneration is not credence: nobody believes the founding model, so what is being preserved is a use rather than a truth. The monument can be built out of a known failure, which seems to rule out the progress-to-the-present narrative that my one historian friend immediately suggested under the name of Whig history. And the critical moment, the periodic condemnation, does not break the past the way I expected from Nietzsche's third category; it renovates it. One member of my group said this is simply monumental history and that Nietzsche had already described it; another said it is not, because the point of the monument there is to spur emulation by presenting greatness as something that was once possible and might therefore be possible again, whereas what actually gets transmitted in my field is the bare shape — there was a founder — with the person filling it essentially interchangeable.

  So my question is a carving question rather than a naming question, though I would like a name if a good one exists. Is this configuration something that already has an established concept, and if so which one, and how exactly does my case sit with respect to it and to its nearest neighbours? If several established notions are candidates, tell me for each what it would explain here and where it goes wrong, and which fits best and why. If nothing established fits properly, say so plainly and give me a term with a definition tight enough to do some work, together with the boundary cases: is it the same phenomenon when a committee changes the story deliberately for funding or political reasons as when it drifts unnoticed over coffee; does it require a whole discipline, or can one laboratory's oral tradition have it; and what would not count — I take it that revising a story simply because somebody found the letters in an attic is a different thing, even though the visible change looks identical. I would also like to know whether any part of my reading group's disagreement is merely verbal, and if so which part and why. Please do not answer with a reading list or references: my library access is a small town library with slow interloan, and I would much rather have the distinctions, the misfits and the edges than a set of things to go and look up.
reasoning: |-
  Okay, let's tackle this fascinating query from a retired experimental physicist. The user describes a phenomenon in their field where the historical narrative continuously shifts—foundational figures change, original papers are reinterpreted, and criticism seems to reinforce rather than damage the monuments. They've encountered Nietzsche's three historical approaches but feel their case doesn't neatly fit, especially regarding how criticism renovates rather than destroys. 

  First, I need to unpack the core dynamics. The monuments aren't static truths but functional tools. The field preserves a "use" rather than factual accuracy—graduate students are inspired, the community bonds over shared origin myths. The founder's role is structurally essential, but the specific person filling it is replaceable. Criticism gets absorbed, making the monument "shinier." This functional flexibility is key.

  Now, existing concepts: Nietzsche's monumental history partially fits but misses crucial aspects. Monumental history uses the past for inspiration, but here the monuments are mutable and criticism is metabolized. Whig history (progress narrative) is ruled out—the founding model is known to be wrong, yet revered. Hagiography focuses on idealization but doesn't explain the role of failure or narrative drift.

  The term "paradigm anchoring" comes to mind—borrowing loosely from Kuhn but focusing on how communities anchor identity in evolving symbols. The "anchor" (the founder role) stays fixed while the specific referent shifts. Failure is key because it demonstrates the field's maturity in overcoming flaws. 

  Boundaries matter. Deliberate revision for funding is different—it's instrumental rather than organic identity work. A single lab could have this if it has a strong oral tradition and identity. Finding new letters wouldn't count if it's purely factual correction without functional reintegration.

  The reading group's disagreement: One member called it monumental history, another disagreed because the "greatness" isn't the point—it's the structural placeholder. Both have points: the monument is inspirational, but the interchangeable figures make it distinct. The deeper agreement is about functionality; the verbal split is over whether "greatness" must be attached to a specific person or can be structural.

  In sum, this is "functional monumentality": mutable symbols that serve identity and continuity needs, where criticism is repurposed as renewal. The physicist's case shows science as a living tradition, not a fact-accumulation machine. The beauty is how failure and flux become strengths.
answer: |-
  Your description captures a profound phenomenon in scientific communities that sits at the intersection of memory, identity, and function. While no single established term perfectly encapsulates it, we can carve its contours by analyzing its components against existing concepts. Below is a systematic dissection:

  ### Core Concept: **Functional Monumentality**  
  *Definition*: The adaptive veneration of a mutable past (figures, events, models) that serves present communal needs—cohesion, inspiration, identity—while discarding historical fidelity. Criticism and failure are metabolized as *reinforcements* of the monument’s utility, not challenges to its authority.  

  #### How It Operates in Your Cases:  
  1. **The Founding Model (Known Wrong but Taught)**  
     - **Function**: Serves as a *boundary object*—a shared reference point for benchmarking progress. Its "wrongness" is essential: overcoming it defines the field’s maturation.  
     - **Metabolizing Criticism**: Attacks on the founder’s views are absorbed as proof of the field’s rigor ("we’ve evolved, yet honor our roots").  

  2. **The Shifting Founder**  
     - **Interchangeable Greatness**: The *role* of "founder" is fixed; the *person* filling it changes to reflect current values (theorist → experimentalist → overlooked genius).  
     - **Structural Amnesia**: Each generation forgets prior narratives, treating their version as eternal. This is not deception but *communal memory editing*.  

  ### Against Established Notions:  
  | Concept             | Why It Fits Partially                     | Where It Fails                          |  
  |---------------------|------------------------------------------|-----------------------------------------|  
  | **Nietzsche’s Monumental History** | Uses past heroes to inspire action.      | Assumes stable heroes embodying greatness; your "founder" is a fluid placeholder. |  
  | **Whig History**    | Implicit in framing progress from error. | Your field *celebrates* the error; the "wrong" model isn’t a step toward truth but a permanent totem. |  
  | **Hagiography**     | Idealizes figures, ignoring flaws.       | Flaws are acknowledged yet *repurposed* (e.g., the "killer" of the model becomes the hero). |  
  | **Invention of Tradition** | Constructs rituals to legitimize present. | Focuses on deliberate creation; your shifts are *emergent*, not orchestrated. |  

  ### Boundaries & Edge Cases:  
  - **Deliberate Revision (e.g., for funding)** ≠ Your Case:  
    Instrumental manipulation is transactional; your phenomenon is *identity-sustaining*. The coffee-room drift is organic, rooted in communal psychology.  
  - **Scale**: Works for a lab’s oral tradition if it has strong internal identity. Requires a *community* with shared narratives, not necessarily a whole discipline.  
  - **What Doesn’t Count**: Archival discovery revising a story is *corrective*, not functional. It aims for accuracy, not utility. If the new facts are ignored/repurposed, *then* it becomes functional monumentality.  

  ### Resolving the Reading Group Disagreement:  
  - **Verbal Disagreement**: Both members grasp the *function* (using the past for present vitality) but diverge on *mechanism*.  
    - Member 1 (Monumental): Correct that inspiration is central.  
    - Member 2 (Interchangeable): Correct that specific "greatness" is irrelevant; the *archetype* matters.  
  - **Deeper Alignment**: Both miss that **failure and criticism are fuel**, not threats. Nietzsche’s critical history *shatters*; here, it *polishes*.  

  ### Why "Functional Monumentality" Fits Best:  
  - **Utility Over Truth**: Preserves a *use* (training, morale, identity) while discarding accuracy.  
  - **Dynamic Stability**: Monuments morph but retain core functions (e.g., "founder" as an anchor).  
  - **Metabolism of Conflict**: Criticism becomes proof of the monument’s resilience.  

  ### A Testable Criterion:  
  If removing/disproving a venerated element (e.g., ceasing to teach the flawed model) would *impair communal function* (e.g., weaken new students’ sense of purpose), you have functional monumentality. If it would merely correct understanding, you do not.  

  This framework explains why your field’s history feels like a living organism—adapting, consuming dissent, and shedding skin while preserving its skeleton. It’s science as a *tradition*, not just an epistemology.
