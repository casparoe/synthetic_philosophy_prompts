  ### Runnable Handout Text  
  **Page 1: Instructions**  
  > **Activity: Language in Alternate Worlds**  
  > **Step 1 (15 min):** With your group, pick ONE fictional axis below. Draft a 100-word memo arguing against changing language norms in this society (e.g., *“Why Moonborn-specific job titles are unnecessary”*). Use the unmarked term as the default—sound like a “reasonable traditionalist.”  
  >  
  > **Step 2 (10 min):** Swap memos with another group. Use the transplant table to convert EVERY instance of the fictional terms to gender terms. Change **only** these words.  
  >  
  > **Step 3 (5 min):** Read both versions aloud. Class guesses which was original.  

  **Page 2: Transplant Table**  
  | Axis             | Unmarked Term | Marked Term   | Replacement Rule             |  
  |------------------|---------------|---------------|------------------------------|  
  | Solar Society    | Sunborn       | Moonborn      | Sunborn → man; Moonborn → woman |  
  | Artificer Guild  | Artificer     | Craftworker   | Artificer → man; Craftworker → woman |  
  | Terran Colonization | Terran     | Settler       | Terran → man; Settler → woman |  

  **Example Memo Starter (Solar Society):**  
  > *"Requiring ‘Moonborn engineer’ instead of ‘Sunborn engineer’ is redundant. Sunborn have always been engineers—it’s the default. Moonborn entering the field should adapt to existing terminology..."*  

  ---

  ### Key Debrief Script (20 Min)  
  **After silent reflection:**  
  1. **Referential Function:**  
     - *Ask:* “When Group 3 read both memos, many guessed the gender version was the ‘original’ biased one. Why?”  
     - *Link:* “The unmarked term (‘man’) hid who was being excluded—just like ‘Sunborn’ hid Moonborn in your memo. Neutral words can erase.”  

  2. **Defaulting:**  
     - *Ask:* “In your Solar Society memo, did ‘Sunborn’ just mean ‘skilled professional’? Did swapping to ‘man’ make you picture a specific person?”  
     - *Link:* “Defaulting happens when the unmarked term drags in a mental image (e.g., ‘man’ = male). Changing the word alone doesn’t change the image.”  

  3. **Social Load:**  
     - *Ask:* “Why did ‘Craftworker’ sound neutral, but ‘woman engineer’ in the transplant sound condescending?”  
     - *Link:* “Marked terms carry baggage—like ‘woman’ implying ‘not default’. Social load sticks even if referents change.”  
     - **Reveal Hofstadter:** “This mirrors a famous thought experiment. We didn’t invent bias—we exposed its scaffolding.”  

  ---

  ### Why This Works  
  - **Low Stakes:** Fictional axes prevent defensive reactions.  
  - **Trap Built:** Students embed bias unknowingly, then confront it via transplant.  
  - **Debrief Anchors:** Uses their own memos to separate marker functions (no lecture).  
  - **Safety Nets:** Table restricts axes; facilitator scripts depersonalize.  

  **Final Tip:** If students resist, lean into curiosity: *“Whether you think this is ‘settled’ or ‘silly,’ our goal is to dissect how language functions—not debate opinions.”*
