  - With two agents with *different* horizons, does cooperation break, and does that create the perverse incentive to deliberately cap your own proof search so that weaker partners can still trust you?
  - Is proof length even a principled thing to hang this on? It's encoding-dependent, so whether I trust a given conclusion could in principle flip when I change how I encode proofs. Does that make the whole horizon notion unprincipled, or is there a version that survives?

