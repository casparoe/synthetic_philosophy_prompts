prompt: |-
  Hey — I'm writing up a chapter and keep going back and forth on something, so I want an outside number with the guts showing.

  Call A the proposition that "the alignment problem" is really at least two problems that can come apart: you could fully solve the specification/outer side — get the objective to say what the principal wants, under arbitrarily good supervision — and still end up with a catastrophically misaligned system because the internals generalize differently off-distribution (inner alignment, deceptive alignment, situational awareness, whatever you want to call it). Call B the proposition that it's basically one problem: hard cases on each side collapse into the same failure mode, so progress on one is progress on the other.

  Give me your credence in A over B, decomposed: P that scalable oversight / weak-to-strong generalization actually fails in the regime that matters, P that misalignment driven by the system modeling its own training process arises by default once systems are capable enough to do that, P that these two failure modes are genuinely independent rather than two descriptions of one mechanism, and P that "what the principal wants" is well-defined enough to be a target at all — add whatever other terms you think carry real weight, one line of justification each, then the combination, the term your number is most sensitive to, and the single result that would move it most.

  I'm at about 0.75 on A; my advisor is at maybe 0.35 and thinks the whole inner/outer distinction is a artifact of how we factorize the training setup rather than a real seam in the thing itself. Tell me which sub-question the two of us are most likely actually disagreeing about, because I suspect it isn't the one we keep arguing about.

  One wrinkle I want handled explicitly: I don't only care about alignment to the principal who writes the spec. Suppose we also demand what I've been calling retrospective corrigibility — the system stays corrigible and keeps deferring even after a better-informed future version of the principal (or of humanity generally) explicitly repudiates the original objective, i.e. it doesn't treat that objective as a fixed point once it can predict the repudiation. Does folding that requirement in push you toward A or toward B, and by roughly how much?
