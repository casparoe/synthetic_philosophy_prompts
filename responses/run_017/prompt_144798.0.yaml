  - Intentional stance: Sedol used this in game 4, but AlphaGo’s failure revealed it wasn’t "thinking" like a human; it was blindsided by computational constraints. 

  Now, the budget stance: Is it a fourth stance? I think it’s a refinement of the design stance. Dennett’s framework already allows for bounded systems (e.g., a chess computer with limited depth). The "real patterns" question: Patterns are always relative to an observer’s resources, so yes, computational budget matters. AlphaGo’s "creative" move 37 is only compressible as such if we ignore the messy self-play training and focus on outcomes. 

  Where Dennett stays silent: The framework dodges whether move 37 was "truly creative"—it only cares if treating it as creative yields good predictions. The ontology ("realness") isn’t addressed. 

