  - Physical stance: Useless here—no one would track electrons in chips. 
  - Design stance: Engineers built AlphaGo to win Go, so this move is "optimal" by its training. But since it emerged from self-play, it’s not explicitly designed, which strains the stance. Commentators initially saw it as a mistake because it defied human design intuition. 
  - Intentional stance: Sedol later adapted, treating AlphaGo as a "weird genius," attributing creativity. This worked until move 78 broke it. 

  For move 78 (Sedol’s wedge that caused AlphaGo’s collapse): 
