  Empirical questions lurk here too. Do people intuitively see private hypocrisy as blame? Surveys could test that, but the user might question if ordinary intuitions settle philosophical issues. Still, data could clarify whether "standing" is a unified concept.

  For progress, the user needs to reframe the question. Instead of asking if hypocrites *can* blame, ask what conditions make blame appropriate. Distinguishing between blame's permissibility (moral), its validity (epistemic), and its authority (relational) could help. The paid-up hypocrite case shows that addressing the relational aspect (through amends) restores authority, separating it from the moral and epistemic dimensions.

  A new test case: What if the hypocrite blames someone anonymously? This isolates the relational element. If the objection persists, it's about unfairness; if not, authority matters. Also, exploring whether hypocrisy undermines the hypocrite's own commitment to the norm could tie into epistemic validity.

  In summary, the stalemate stems from conflating different issues under "standing." Progress involves disentangling these dimensions and reframing the question around blame's conditions. The user should focus on whether the debate’s core is about blame’s nature or the conditions for its appropriateness, using cases to test each layer.
answer: |-
  Your diagnosis is sharp: the stalemate *is* significantly verbal, masking a deeper substantive disagreement about the **nature of blame itself**. Here's a breakdown of the core issues and a path forward:

  **The Verbal Knot: "Standing" as a Container for Distinct Concepts**
  You're correct that "standing" is used ambiguously. Your (a)-(d) carve-up captures the key candidates:
  1.  **Normative Power/Authority (a):** Like a judge stripped of jurisdiction. The hypocrite *cannot* perform the illocutionary act of blame (e.g., issuing a valid demand).
  2.  **Moral Permissibility (b):** The act of blaming *is wrong* (unfair, manipulative, vicious) even if the content (the wrongness of X) is correct.
  3.  **Relational/Epistemic Position (c):** Blame misfires due to lack of relevant knowledge or a broken/distant relationship (busybody, accomplice), distinct from hypocrisy per se.
  4.  **Metaphysical Success Condition (d):** Hypocrisy prevents blame from *being* what it fundamentally *is* (e.g., an expression of shared commitment).

  The confusion arises because proponents often slide between these meanings, and critics attack one meaning while defending another.

  **The Substantive Bedrock: The Nature of Blame**
  The *real* stalemate isn't primarily about hypocrisy itself, but about **what blame fundamentally is and does**. This determines *which* of the (a)-(d) conditions is primary:
  *   **The Strawsonian/Address View:** If blame is *essentially* a second-personal attitude, a demand for recognition/accountability addressed *to* the wrongdoer within a moral community (Strawson's core insight), then **Standing-as-Authority (a)** becomes paramount. Hypocrisy directly undermines one's *position* to make that demand *to another*. Your "private blame" case is a problem here – if blame is essentially address, private resentment isn't *blame* in the full sense, it's just anger or disapproval. The paid-up hypocrite regains standing because they've re-entered the moral community and re-established their authority to address demands.
  *   **The Evaluative/Attitude View:** If blame is fundamentally an *evaluative attitude* (judgment + negative affect + withdrawal of goodwill) that can be assessed for *fittingness* (is the target truly blameworthy?) and *permissibility* (is it okay to feel/express this?), then **Standing-as-Permissibility (b)** or even **Epistemic/Relational Conditions (c)** dominate. Hypocrisy makes the *act* of blaming *unfair* or *vicious*, but the attitude itself might still be fitting if the target *is* blameworthy. Private blame is straightforwardly blame on this view, and its defect (hypocrisy) is a distinct moral flaw in the *holder* of the attitude. The paid-up hypocrite's blame is less (or not) impermissible because they've removed the unfairness through amends.

  **The Skeptic's Leverage:**
  The skeptic exploits the conflation. If blame is primarily evaluative (View 2), then "standing failures" *do* often reduce to permissibility failures, epistemic shortcomings, or relational inappropriateness. The skeptic argues that the "authority" talk (a) is just a metaphor for these other factors within the address paradigm, not a distinct metaphysical category.

  **The Role of Empirical Intuitions:**
  Empirical work *could* clarify:
  1.  **Ordinary Language/Intuitions:** Do people consistently treat hypocritical blame as *void* (like an invalid command) or as *wrongful* (like a rude but factual accusation)? Do they see private hypocritical resentment as blame? Does the paid-up hypocrite regain "standing"?
  2.  **Function of Blame:** What social or psychological functions do people attribute to blame? Is it primarily about regulating behavior (favoring address/authority), expressing values (favoring attitude/fittingness), or maintaining relationships (favoring relational conditions)?

  However, empirical data alone won't *resolve* the philosophical stalemate. It can:
  *   Reveal if one view better maps common intuitions (supporting its descriptive adequacy).
  *   Challenge assumptions (e.g., if people *do* see private resentment as blame, it weakens the pure address view).
  *   Highlight which aspects (unfairness, authority, shared commitment) are most salient in different hypocrisy cases.

  But the *interpretation* of the data and the *normative weight* given to these intuitions depend on the underlying philosophical view of blame.

  **Diagnosis of Stalemate:**
  It's **primarily substantive** (Nature of Blame) **exacerbated by verbal confusion** (Ambiguity of "Standing"). The camps are arguing past each other because they operate with fundamentally different conceptions of the phenomenon under discussion (blame). The test cases expose this: the paid-up hypocrite challenges the address view's claim that hypocrisy *permanently* voids authority, while the private blame case challenges the address view's claim that blame *must* be addressed. Both cases are less problematic for the attitude view.

  **Path to Progress: Reframing and Distinguishing**

  1.  **Explicitly Separate the Questions:** Stop asking "Does the hypocrite have standing?" Ask instead:
      *   **Is the hypocrite's *attitude* of blame *fitting*?** (Does the target deserve it? - Epistemic/Evaluative)
      *   **Is the hypocrite's *act* of blaming (expressing it) *morally permissible*?** (Is it unfair/vicious? - Moral)
      *   **Does the hypocrite possess the *authority* or *normative position* to *address a demand for accountability* to this person?** (Relational/Conventional)
      *   **Can the hypocrite's utterance *successfully constitute* the illocutionary act of blame?** (Speech-Act)
      *   **Does the hypocrite's blame *function* as blame within the moral community?** (Social/Pragmatic)

  2.  **Focus on the Nature of Blame:** Frame the debate explicitly: "What *is* blame? Is its core function second-personal address, first-personal evaluation, social regulation, or something else?" Use your test cases (private blame, paid-up hypocrite) *plus* new ones to pressure-test these core conceptions:
      *   **The Anonymous Blamer:** Someone blames via an anonymous letter. Is the *hypocrisy* of the anonymous blamer relevant? If so, how? (Tests the necessity of *known* authority for the address view vs. the permissibility/fittingness for the attitude view).
      *   **The Repentant But Unrevealed Hypocrite:** Someone did X, deeply regrets it, has reformed, but was never caught or required to make amends. They blame someone else for X. What's defective? (Tests the role of *public* performance of contrition vs. internal state for restoring authority/permissibility).

  3.  **Investigate the "Normative Power" Concept:** If the address view is defended, scrutinize *what kind* of authority this is. Is it moral, conventional, relational? How is it gained, lost, and regained? The paid-up hypocrite case suggests it's *recoverable*, which needs explaining within the address framework.

  4.  **Clarify the Role of Commitment:** A key factor in hypocrisy is the blamer's own (real or perceived) rejection of the norm they invoke. Does hypocrisy primarily undermine the blamer's *sincerity* (epistemic/illocutionary), their *entitlement to enforce* (authority), or simply make their enforcement *unfair* (permissibility)? How does the paid-up hypocrite restore this?

  **Conclusion: What Progress Looks Like**
  Progress won't be one side "winning," but achieving **conceptual clarity** and **targeted disagreement**. Success means:
  *   Participants can clearly articulate whether their objection to hypocritical blame is based on lack of authority, impermissibility, epistemic defect, or a view of blame's nature.
  *   The debate shifts from "Do they have standing?" to "Which aspect(s) of this complex phenomenon does hypocrisy undermine, and why, given our differing views of blame's core function?"
  *   Test cases are used to probe specific *aspects* (e.g., "Does this case show authority is distinct from permissibility?" or "Does this show address is essential?").

  The question isn't ill-formed, but "standing" is a blunt instrument. **Drop the term "standing" entirely in favor of your precise distinctions (a)-(d).** Ask instead: "In what specific *way(s)* is hypocritical blame defective, and what does that tell us about the nature of blame?" That reframing, coupled with targeted cases isolating authority, permissibility, and the core concept of blame, is the path out of the stalemate. The goal is not consensus on hypocrisy, but a clearer map of the underlying terrain of blame itself.
