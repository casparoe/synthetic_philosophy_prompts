answer: |-
  ## Project Proposal: Normative Drift and the Discreteness Assumption in Lewisian Conventions

  **Applicant:** [Your Name]  
  **Affiliation:** [Your University/Department]  
  **Proposed Duration:** Six Months  
  **Host Institute:** [Institute Name]  
  **Collaboration Focus:** Philosophy (Convention Theory) & Cultural-Evolution Modelling

  ### 1. Core Research Question & Problem Statement

  **Does the common-knowledge requirement in David Lewis's analysis of convention *necessitate* treating conventions as discrete equilibria, thereby rendering the phenomenon of gradual "normative drift" (e.g., shifting standards of politeness, address, or interaction) theoretically problematic or outside the scope of genuine conventions?**

  Lewis's definition requires a regularity R, an alternative regularity R', mutual preference for conformity conditional on others' conformity, and common knowledge of these conditions. The discrete strategy set assumption in modelling is often considered a technical convenience. However, **the "drift problem"** challenges this: when norms evolve continuously (e.g., acceptable eye contact duration shifting imperceptibly over decades), it becomes unclear:
      *   What the precise "regularity R" is at any given moment.
      *   What constitutes a viable "alternative R'" at each infinitesimal step.
      *   How common knowledge of expectations is sustained when the content of the expectation itself is fluid and unarticulated.

  This poses a potential *conceptual* tension within Lewis's framework itself, not just a modelling limitation.

  ### 2. Why Existing Replies are Insufficient

  The proposal will rigorously evaluate standard responses to the drift problem, arguing they fail to fully resolve the tension with Lewis's core conditions:

  1.  **Rapid Sequence of Tiny Equilibria:**
      *   *Problem:* Requires positing a vast sequence of distinct R/R' pairs. But for genuinely continuous drift, identifying discrete alternatives at each step is arbitrary. Crucially, common knowledge must reformulate at *each* tiny switch – an implausible cognitive burden for agents navigating subtle, unarticulated shifts. Does "common knowledge" meaningfully apply to imperceptibly different expectations?
  2.  **Non-Conventional Status (Habits/Practices):**
      *   *Problem:* Arbitrarily excludes phenomena that *function* like coordination norms (e.g., regulating complex social interaction, generating expectations, enabling coordination). It fails to explain *why* drift predominantly affects norms lacking discrete alternatives, potentially protecting the theory by definitional fiat rather than explanatory power.
  3.  **Semantic Vagueness:**
      *   *Problem:* While vagueness is real, this move risks dissolving the *normative dynamic*. Lewis's account explains *why* conventions are stable and *how* they change via coordination problems. Treating drift as mere semantic imprecision sidelines these core mechanisms without offering a replacement dynamic for gradual normative evolution within the convention framework. It doesn't address the common-knowledge requirement over a continuum.

  **The Gap:** None adequately reconcile the dynamic, expectation-driven core of Lewisian conventions with the phenomenology of continuous normative change sustained by common knowledge (or a close analogue).

  ### 3. Proposed Methodology & Work Plan (Philosopher-Modeller Collaboration)

  This project uniquely leverages the institute's pairing model to address a *conceptual* problem with *formal* implications.

  *   **Philosophical Work (Months 1-3, Ongoing):**
      *   **Task 1 (M1-2):** Precise Conceptual Analysis. Articulate the exact tension between continuous drift and Lewis's common knowledge/alternative regularity clauses. Define "drift" operationally for this context. Formalize the challenge to discrete strategy sets as more than technical.
      *   **Task 2 (M2-3):** Evaluate Asymmetry Hypothesis. Does discreteness play distinct roles in convention *emergence* (requiring salience over a menu) vs. *maintenance/evolution* (potentially tolerating vaguer expectations)? Analyze historical/case study examples of drift initiation vs. sustained change.
      *   **Method:** Conceptual analysis, logical formalization of conditions under vagueness, case study examination (e.g., linguistic honorifics, etiquette manuals). *Armchair work is essential* here to clarify the foundational concepts and constraints before formalization.

  *   **Modeller Collaboration (Months 3-5):**
      *   **Task 3 (M3):** Joint Scoping & Model Specification. Translate the philosophical analysis into tractable modelling questions: Can common knowledge be defined over continuous strategies? What constitutes an "alternative" in a continuum? How to model expectations updating under drift?
      *   **Task 4 (M4-5):** Develop & Run Targeted Models. Work with modellers to:
          *   Adapt existing coordination game frameworks (e.g., signaling games, bargaining games) to incorporate continuous strategy spaces (e.g., a "politeness level" spectrum).
          *   Define plausible learning/update rules for agents tracking shifting population norms without discrete jumps.
          *   Implement and simulate drift dynamics. Key parameters: rate of drift, noise level, agent memory/learning speed.
          *   Compare outcomes to discrete baseline models. *Crucially:* The models test the *feasibility* and *stability* of conventions-under-drift *given the philosophical constraints* derived from Lewis (common knowledge, alternatives).

  *   **Synthesis & Writing (Month 6):**
      *   **Task 5 (M6):** Integrate findings. Do the models show stable coordination compatible with Lewisian conditions under drift? Or do they necessitate relaxing/modifying the conditions? Refine the asymmetry hypothesis. Draft core paper sections.

  ### 4. Why Philosopher + Modeller? Why Not Just Simulations/Surveys?

  *   **Philosophy's Role:** Essential for diagnosing the *conceptual* tension within Lewis's theory and precisely defining the target phenomenon (drift vs. switch). Surveys/simulations alone cannot resolve whether drift violates Lewis's *definitional* conditions. Armchair analysis clarifies what needs modelling.
  *   **Modelling's Role:** Essential for testing the *dynamical feasibility* of conventions-under-drift and exploring the *consequences* of relaxing assumptions (e.g., weakening common knowledge). It provides formal rigor and explores cognitive/evolutionary plausibility.
  *   **Synergy:** The philosopher ensures models address the right conceptual problem; the modeller ensures philosophical claims are dynamically coherent and testable. Neither discipline alone suffices.

  ### 5. Deliverables & Success/Failure Criteria

  *   **Positive Outcomes:**
      *   *(Philosophers)* A refined conceptual account of convention accommodating/explaining drift (e.g., via asymmetry, weakened knowledge conditions, redefined "alternative").
      *   *(Modellers)* Novel game-theoretic models of norm evolution in continuous strategy spaces, demonstrating stable coordination under drift dynamics.
      *   *(Both)* A joint paper draft establishing drift as a core challenge to Lewisian orthodoxy, proposing a solution (conceptual/model-based), and demonstrating the value of deep interdisciplinary collaboration.
  *   **Observable Failure:**
      *   Conceptual analysis concludes drift is *trivially* handled by existing replies (1-3) under plausible interpretations.
      *   Models robustly show that continuous drift *always* destabilizes coordination or *only* works under update rules violating Lewis's core conditions (common knowledge, rational preference) without offering a coherent alternative framework.
      *   Inability to formulate a continuous model that captures the phenomenon while respecting the philosophical constraints derived from Lewis's core intuitions.
  *   **Key Deliverables:** Detailed model specifications; simulation results; draft paper; seminar presentation at the institute.

  ### 6. Feasibility Assessment: Six-Month Project

  This is ambitious but feasible as a focused six-month project because:

  1.  **Sharply Defined Scope:** It targets a *specific conceptual tension* (drift vs. Lewis's clauses) and evaluates *specific existing replies*. It is not a general theory of norm change.
  2.  **Clear Methodology Split:** Philosophical groundwork precedes and guides targeted modelling. The modelling is not open-ended exploration but tests hypotheses derived from the philosophical analysis.
  3.  **Asymmetric Hypothesis Provides Focus:** Investigating the distinct roles of discreteness in emergence vs. maintenance offers a concrete pathway for analysis and modelling.
  4.  **Collaboration Efficiency:** Paired work streamlines translation between conceptual and formal domains.
  5.  **Deliverable-Oriented:** Success is defined by a clear assessment of the problem and initial steps towards a solution (conceptual/model), not a complete, universal theory.

  **While the topic opens deep questions (potentially dissertation-worthy), this project's goal is to rigorously establish the *problem* and *test the viability of initial solutions* within the Lewisian framework, leveraging the unique philosopher-modeller pairing.** It provides the essential groundwork for future, larger projects, regardless of the outcome.

  **In summary:** This project leverages interdisciplinary collaboration to address a fundamental tension in the dominant theory of social conventions – the apparent incompatibility of Lewis's discrete equilibrium conditions with the pervasive reality of gradual normative drift. It promises to refine philosophical theory, advance modelling techniques, and demonstrate the power of deep integration between these fields.
