  Looking at their cases, some patterns emerge. They assign moral weight to running simulations of brains, even if inefficient, but not to static programs or precomputed tables. Duplicates matter only if they're causally active; inert copies don't. They also care about internal states (like pain) regardless of external behavior. But language models' forward passes seem less significant, and distributed systems don't feel like a subject.

