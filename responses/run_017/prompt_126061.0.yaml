prompt: |-
  I am writing the requirements chapter of my PhD thesis on updating under uncertain evidence, and before I survey candidate rules I want a specification: what a rule for revising a credence function on the basis of evidence that is itself uncertain has to deliver in order to count as adequate for the job I care about.

  The purpose I want the rule good for: a bounded, artificial epistemic agent (think of the update module of a clinical decision-support system) that holds a probability distribution over a large, factored set of variables and receives a stream of items that are not hard certainties. Concretely, its inputs arrive in at least these four shapes, and I want the requirements list built around them rather than around the textbook case of a clean new probability assignment to a partition:

  1. report evidence with a stated but disputable reliability — a sensor or a colleague says that p, where the agent's confidence that the source is functioning and being read correctly is itself something like 0.8;
  2. nested or second-order evidence — the agent becomes uncertain about what its own earlier evidence was, or about the competence of the process that produced its last update;
  3. inexact evidence — the agent is only willing to constrain the new probability of a proposition to an interval, or to constrain an expected value, rather than fix a number;
  4. retractable evidence — a later item reveals the earlier source was broken, and the agent must back out the update rather than merely pile a further update on top of it.

  Please write the desiderata (8 to 12 of them) as a table with columns: requirement; the case that motivates it and why that case is a requirement rather than a nice-to-have; status (non-negotiable, or a preference of one camp — accuracy-firsters, dynamic-Dutch-book arguments, Bayes-network engineers, imprecise-probabilists); and what the requirement rules out. Alongside the four input shapes above, the cases I want handled are at least: reduction to ordinary conditionalization in the limit where the uncertain evidence becomes hard; no-op when the new probabilities on the partition coincide with the old ones; continuity in the evidential input, so that small error in estimating the input produces small error in the output; insensitivity to how finely the agent carves the space when it encodes the evidence, including what happens when rigidity holds on a coarse partition but not on a refinement; idempotence when the same item arrives twice; order-independence across a sequence of items; and reversibility when an item is withdrawn. Include a requirement about where the evidential input is allowed to come from: whether the rule may take a new probability assignment as a black box, or owes an account of it in terms of likelihoods, and what coherence constraints the input must satisfy.

  Two things matter most to me. First, mark which requirements are genuine and which are the prejudices of a camp — I would rather drop a demand than keep one that only sounds obligatory. Second, if some subset of your requirements cannot be jointly satisfied, say so and give the argument: I expect at least one clash and my guess is that it involves order-independence, but show it rather than asserting it, and tell me which requirement you would weaken and what that costs.

  Then, briefly — a short paragraph each, not a survey — score against your list: ordinary conditionalization on the report that the source said that p; Jeffrey-style probability kinematics with rigidity on a partition; a constraint-based rule that picks the minimally informative revision satisfying the constraint; and, if you think it belongs, the likelihood-ratio or virtual-evidence treatment used in graphical models. I will supply the citations myself, so refer to positions and rules descriptively and do not give me a bibliography.

  Keep the whole thing under about 1300 words. End with a single final line in exactly this form, naming the one requirement that does the most work by excluding the most candidates:

  Verdict: <short label for that requirement>
reasoning: |-
  Hmm, the user is writing a PhD thesis on updating under uncertain evidence and needs help specifying requirements for a revision rule. They're focused on an artificial epistemic agent handling four specific input types: uncertain reliability reports, second-order evidence, inexact constraints, and retractable evidence. They want 8-12 desiderata formatted as a table with columns for requirement, motivation, status, and exclusions.

  I need to build requirements around their four core cases while including standard desiderata like reduction to Bayes, no-op condition, continuity, etc. The user cares most about distinguishing genuine requirements from methodological preferences and identifying potential conflicts - especially regarding order-independence. They also want brief evaluations of four common approaches.

  Key challenges: 
  First, the tension between order-independence and reversibility - satisfying both requires commutative operations which might conflict with other desiderata like Jeffrey rigidity. I'll highlight this conflict explicitly. 

  Second, the "evidential input specification" requirement will be pivotal since it rules out approaches that can't handle intervals or retractions. I'll make this the verdict requirement as it excludes the most candidates.

  For the table, I'll structure 10 requirements:
  1-4 directly address their input cases 
  5-10 cover standard desiderata like reduction, no-op, continuity, etc.

  In evaluations:
  - Classical conditioning fails almost all requirements except reduction to Bayes
  - Jeffrey succeeds only on reliable reports and inexact evidence but fails retractions
  - Constraint-based rules handle more inputs but struggle with reversibility
  - Virtual evidence handles reliability but not the other cases

  The user seems sophisticated about the field but wants clarity on what's fundamentally necessary versus factionally preferred. I'll mark "non-negotiable" only for requirements essential to their stated agent context, and flag methodological biases explicitly.

  Finally, I'll end with "Verdict: Evidential Input Specification" since the ability to process all four input types eliminates most off-the-shelf solutions.
answer: |-
  ### Requirements for Uncertain Evidence Revision Rules  

  | Requirement                    | Motivation & Necessity                                                                                                  | Status                              | What It Rules Out                                                                 |
  | :----------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :---------------------------------- | :-------------------------------------------------------------------------------- |
  | **1. Reliability Integration** | Input type 1: Must incorporate source reliability (e.g., sensor with 0.8 confidence). Failure risks over/under-weighting evidence. | Non-negotiable                      | Rules ignoring reliability parameters (e.g., naive Bayes).                        |
  | **2. Second-Order Handling**   | Input type 2: Agent doubts prior evidence/process (e.g., "Was my sensor calibrated?"). Essential for recursive self-correction. | Non-negotiable                      | Rules without meta-uncertainty tracking (e.g., standard conditioning).            |
  | **3. Inexact Evidence**        | Input type 3: Accepts intervals/constraints (e.g., P(p) ∈ [0.7, 0.9]). Real-world agents rarely get exact probabilities. | Non-negotiable                      | Rules requiring sharp probabilities (e.g., classical Jeffrey).                    |
  | **4. Retractability**          | Input type 4: Must reverse updates if evidence is invalidated (e.g., sensor fault detected). Piling new updates is insufficient. | Non-negotiable                      | Non-invertible operations (e.g., most constraint-based methods).                  |
  | **5. Reduction to Bayes**      | In the limit of certain evidence (P(report)=1), must coincide with Bayesian conditioning. Ensures consistency.          | Non-negotiable                      | Rules violating foundational coherence (e.g., *ad hoc* heuristics).               |
  | **6. Evidential Input Specification** | Inputs must be definable via likelihoods or constraints without presupposing a rigid partition. Needed for factored state spaces. | Non-negotiable (Bayes-net engineers) | Black-box probability inputs (e.g., rules demanding arbitrary new distributions). |
  | **7. Continuity**              | Small errors in input (e.g., reliability estimate 0.82 vs. 0.80) yield small output changes. Prevents instability.      | Non-negotiable                      | Discontinuous updates (e.g., threshold-based rules).                              |
  | **8. Partition Insensitivity** | Identical results whether evidence is coarse (e.g., "A") or refined ("A∧B" or "A∧¬B"), if constraints agree. Avoids representational arbitrariness. | Preference (imprecise probabilists) | Partition-dependent rigidity (e.g., Jeffrey conditionalization).                  |
  | **9. Idempotence & Order-Independence** | Same evidence twice → no change; sequences commute (e.g., reliability update then interval = interval then reliability). Critical for streams. | Preference (accuracy-firsters)      | Order-sensitive methods (e.g., iterated constraint solvers).                      |
  | **10. Reversibility**          | Withdrawing evidence E returns pre-E credences. Key for input type 4 (retractions).                                    | Non-negotiable                      | Rules losing prior state (e.g., virtual evidence without history).                |

  ---

  ### **Clash Identification**  
  **Conflict:** *Order-Independence* (Requirement 9) clashes with *Reversibility* (10) and *Partition Insensitivity* (8).  
  - **Why?** Order-independence requires commutative operations. Jeffrey’s rule (partition-rigid) is order-dependent unless partitions align. Reversibility demands invertibility, but commutative operations (e.g., linear pooling) are rarely invertible. Constraint-based approaches may violate both if constraints overlap non-commutatively.  
  - **Resolution:** Weaken *Order-Independence* to **weak commutativity** (order-invariance only for logically independent inputs). Cost: Agent must track evidence sequences, increasing complexity.  

  ---

  ### **Rule Evaluations**  

  1. **Ordinary Conditionalization on Report**  
     Conditions on "source says p." Fails most: Ignores reliability (violates 1), can’t handle intervals (3) or retractions (4), brittle to second-order doubt (2). Satisfies only reduction to Bayes (5).  

  2. **Jeffrey Conditionalization**  
     Updates via rigidity on partition. Handles inexact evidence via intervals (3) and reduces to Bayes (5). Fails reliability integration (1), second-order evidence (2), retractions (4), partition sensitivity (8), and order-independence (9).  

  3. **Minimally Informative Constraint-Based Revision**  
     Maximizes entropy subject to constraints. Handles inexact evidence (3) and partition insensitivity (8). Fails reliability (1), second-order (2), retractions (non-invertible, violates 4/10), and order-independence (9).  

  4. **Virtual Evidence (Likelihood Ratios)**  
     Treats evidence as likelihood update. Handles reliability (1) and reduces to Bayes (5). Fails second-order (2), intervals (requires sharp likelihoods, violates 3), retractions (lacks inversion, violates 4/10), and partition sensitivity (8).  

  ---

  **Verdict: Evidential Input Specification**
