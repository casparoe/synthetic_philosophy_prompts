prompt: |-
  I run a small fortnightly reading group on philosophy of mind for people who mostly work in ML, and we've spent the last few sessions stuck on the problem of other minds. Two members have been arguing past each other for months and I want to force them to produce something constructive, so I need you to draft the joint statement they could both sign at the end of a good-faith adversarial collaboration. Camp A is the inferentialist camp: ascribing mental states to others is a posits-and-prediction affair, justified by something like the argument from analogy plus an inference to the best explanation, and there is no perceptual contact with another creature's mind (though A gets to insist that the relevant "inference" is not conscious, not deliberation-like, and not something the subject could report doing). Camp B is the direct social perception camp: paradigmatically we perceive other people's anger, intentions and so on in their embodied expressive behaviour, and that perception is epistemically basic rather than derived from observed behaviour plus a hidden premise (though B gets to insist that this perception is learned, culturally shaped and revisable). Please don't cite anything or name papers — describe any study you appeal to in your own words, since I want this to be usable by someone with no library access.

  What I want is the document itself, not a dialogue and not a verdict on who wins. First, a numbered list of claims both can sign: about what needs explaining (please keep the phenomenal version of the problem — is anyone else conscious — separate from the belief-and-desire version, they keep sliding between the two), about what the sceptical challenge is even supposed to threaten, and about what developmental, comparative and clinical evidence can and can't settle. Second, a table of the disagreements that remain, each one stated twice, once in a wording A would sign and once in a wording B would sign, with a column flagging which of them you think are merely verbal (and why) rather than substantive. Third, the cruxes — the sub-questions such that settling them would move at least one side — and for each crux a concrete case or piece of evidence both would accept as bearing on it, with each side's prediction written down in advance, plus what each would count as evidence against their own view.

  For cruxes I'd seed these, but add your own if they're better. (i) "Silent cortex": stipulate an adult with a completely standard human brain in which every functional role associated with pain is realised, who sincerely reports feeling nothing — do we say she is in pain? (ii) "Kaspar", a case I made up: a child raised in total social deprivation until nineteen, stipulated to have no sensory or cognitive impairment, first exposed to faces and voices at nineteen — I want each side to predict how fast and how well she comes to recognise emotion, and to say in advance which finding would embarrass them. (iii) The running fight over whether newborns really imitate adult facial gestures in the first days of life and whether the classic effect holds up in larger, preregistered attempts. (iv) The one I actually care about: a digital system whose conversation is statistically indistinguisable from a thoughtful person's over years of interaction, with no public facts at all about its internals — what does each view say about whether we have any reason to think there is something it is like to be that system, and what would each side count as a reason? Also, be honest if part of their fight is really just about how far the word "perception" can be stretched, or about which side bears the default burden of proof. Neither side is allowed to close any section with "well, we just can't know".
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps in the philosophy of mind: Camp A (inferentialist) and Camp B (direct social perception). The goal is to have a document that both can sign, which includes:

  1. A numbered list of claims both can agree on, separating the problem of other minds into the phenomenal (consciousness) and the belief-desire aspects, and clarifying what evidence can and cannot settle.

  2. A table of remaining disagreements, each stated twice (once for each camp's wording) and a column indicating which are merely verbal and why.

  3. A list of cruxes (key sub-questions) with concrete cases or evidence, each side's prediction, and what each would count as evidence against their own view.

  We are given four seed cruxes but may add more if better. We must be honest about whether part of the dispute is verbal (e.g., about the word "perception") or about the burden of proof.

  Let's structure the document accordingly.

  ---

  **Joint Statement: Adversarial Collaboration on the Problem of Other Minds**

  **Preamble:** We, the undersigned, representing Camp A (inferentialist) and Camp B (direct social perception), have engaged in a good-faith adversarial collaboration to clarify our positions and identify points of agreement and disagreement. We agree that the problem of other minds has two distinct aspects that should be treated separately:

  1. The **phenomenal problem**: How do we know that other beings have subjective conscious experiences (e.g., that there is "something it is like" to be them)?
  2. The **belief-desire problem**: How do we know that other beings have beliefs, desires, and other propositional attitudes that explain their behavior?

  We also agree that the skeptical challenge threatens our justification for attributing minds to others in both aspects, but it does not necessarily undermine our everyday practices. The challenge is to explain how such attributions can be justified, not to prove that skepticism is false beyond any doubt.

  **Section 1: Points of Agreement**

  Both camps agree on the following:

  1. **The reality of other minds**: We are not skeptics; we believe that other humans (and some non-human animals) have minds. The challenge is to explain how we come to know this.

  2. **The role of behavior**: Observable behavior (including facial expressions, gestures, vocalizations, etc.) is the primary basis for attributing mental states to others. Without behavior, we would have no grounds for such attributions.

  3. **Developmental evidence**: Studies of infants and children show that the ability to attribute mental states develops over time and is influenced by both innate factors and learning. However, the exact nature and timing of this development are empirical questions that do not by themselves settle the philosophical dispute about the underlying mechanism.

  4. **Comparative evidence**: Observations of non-human animals (especially primates) and clinical cases (e.g., individuals with autism or brain lesions) can inform us about the prerequisites and variations in mind-attribution abilities. However, these cases do not directly resolve the epistemic question of how mental state attributions are justified in normal adult humans.

  5. **Clinical evidence**: Conditions such as blindsight, anosognosia, or disorders affecting social cognition (e.g., autism spectrum disorder) show that the processes underlying mind attribution can be disrupted, but they do not definitively show whether the normal mechanism is inferential or perceptual.

  6. **The non-conscious nature of the process**: Both camps agree that the process by which we attribute mental states to others is typically fast, automatic, and not available to introspection. Camp A does not claim that it is a conscious, deliberate inference, and Camp B does not claim that it is immune to error or revision.

  7. **The role of learning and culture**: Both camps agree that the attribution of mental states is shaped by learning and cultural context. Camp A holds that the inferential patterns are learned, and Camp B holds that perceptual skills are acquired and culturally tuned.

  8. **The phenomenal vs. belief-desire distinction**: The problem of knowing whether another being is conscious (has phenomenal states) is distinct from the problem of knowing what they believe or desire. Evidence that addresses one might not directly address the other.

  **Section 2: Table of Disagreements**

  The table below lists the key disagreements. For each, we provide:
  - A statement in the wording that Camp A would endorse.
  - A statement in the wording that Camp B would endorse.
  - An assessment of whether the disagreement is substantive or merely verbal, with an explanation.

  | Disagreement Description | Camp A (Inferentialist) Wording | Camp B (Direct Social Perception) Wording | Merely Verbal? (and why) |
  |--------------------------|----------------------------------|------------------------------------------|--------------------------|
  | **Nature of mental state attribution** | Attributing mental states to others is an inferential process, where we use observed behavior as evidence to infer the presence of hidden mental states. This inference may be automatic and unconscious, but it is not perceptual. | Attributing mental states to others is a perceptual process, where we directly perceive mental states in the expressive behavior of others. This perception is not a matter of inferring hidden causes but of recognizing meanings in the behavior itself. | **Substantive** (The core issue is whether the process is best characterized as inference (with mental states as hidden causes) or perception (with mental states as directly presented). This is not just about words because it has implications for how we model the process and what counts as evidence.) |
  | **Epistemic status** | Our justification for attributing mental states to others is inferential: it relies on the success of mental state posits in predicting and explaining behavior (inference to the best explanation). | Our justification for attributing mental states to others is perceptual: it is non-inferential and basic, similar to how we justify perceptual beliefs about the external world. | **Substantive** (This disagreement is about the structure of justification. Camp A sees it as indirect (based on explanation), while Camp B sees it as direct (based on perceptual experience).) |
  | **The role of embodiment** | Embodied behavior is evidence for mental states, but the mental states themselves are not literally seen or heard; they are inferred. | Embodied behavior is not merely evidence but the vehicle by which mental states are directly perceived. For example, we see anger in a facial expression, not just a face that we then interpret as angry. | **Partly Verbal** (The disagreement is partly about what counts as "perception." Camp B uses a broad notion of perception that includes high-level properties, while Camp A reserves "perception" for low-level properties and treats high-level properties as inferred. But it also has substantive aspects about the immediacy of the experience.) |
  | **Burden of proof** | The default position is that mental states are hidden and must be inferred from behavior. Therefore, the burden is on those who claim that we perceive them directly to show how this is possible. | The default position is that we experience others as minded beings directly. Therefore, the burden is on those who claim that this is an illusion and that inference is required to show why perception is insufficient. | **Substantive** (This is about the starting point of inquiry and what needs to be explained. It affects how we evaluate the need for additional mechanisms.) |

  **Section 3: Cruxes and Predictions**

  We identify the following cruxes as key questions that could help resolve the dispute. For each crux, we describe a concrete case or piece of evidence, state each camp's prediction, and specify what each would count as evidence against their own view.

  **Crux (i): Silent Cortex**

  *Case:* Consider an adult human with a completely standard human brain in which every functional role associated with pain (e.g., nociceptive processing, pain-avoidance behavior, verbal reports of pain in appropriate circumstances) is realized, but who sincerely reports feeling nothing when subjected to noxious stimuli. Do we say she is in pain?

  - **Camp A Prediction:** Camp A would say that she is in pain because the functional roles are fulfilled, and the attribution is based on the best explanation of behavior and functional organization. The report of no feeling might be a malfunction in introspection or reporting, but it does not override the inference from behavior and function.

  - **Camp B Prediction:** Camp B would say that we do not have direct perceptual evidence of pain in this case because the expressive behavior (including verbal reports) is inconsistent. Without the appropriate expressive behavior (i.e., without the person showing pain in a way that can be perceived), we cannot attribute pain. However, if the person displays pain behavior but denies feeling it, Camp B might be torn because perception and report conflict. But in this case, the report is part of the expressive behavior, so they might say the person is not in pain.

  - **Evidence against Camp A:** If in such a case, we had independent access to the person's subjective state (e.g., by neural correlates of consciousness) and found no conscious pain, then Camp A would be challenged because their inference to pain would be incorrect despite the functional evidence.

  - **Evidence against Camp B:** If the person displays all the typical pain behaviors (writhing, screaming, etc.) but then denies feeling anything, and if we had independent evidence that the person is indeed in pain (e.g., neural correlates), then Camp B would be challenged because they would not attribute pain due to the denial, but the evidence shows they should.

  **Crux (ii): Kaspar**

  *Case:* A child (Kaspar) raised in total social deprivation until age 19, with no sensory or cognitive impairments, is first exposed to human faces and voices at 19. We observe how quickly and accurately Kaspar learns to recognize emotions.

  - **Camp A Prediction:** Camp A predicts that Kaspar will learn emotion recognition relatively slowly and with effort, requiring explicit teaching or trial-and-error learning, because emotion recognition is an inferential skill built up from associations and generalizations from behavioral cues. Initial performance should be poor and improve gradually with learning.

  - **Camp B Prediction:** Camp B predicts that Kaspar will show some immediate sensitivity to emotional expressions (though not necessarily accurate labeling) because the capacity for direct perception is innate, but it requires exposure to develop. They might expect rapid learning (once exposure begins) because perception is tuned by experience, and the innate capacity should facilitate quick pickup.

  - **Embarrassing finding for Camp A:** If Kaspar shows immediate, accurate emotion recognition without any learning period, this would challenge Camp A because it would suggest an innate, non-inferential capacity.

  - **Embarrassing finding for Camp B:** If Kaspar shows no emotion recognition at first and requires extensive explicit training, even for basic emotions, this would challenge Camp B because it would suggest that perception is not innate and requires inferential learning.

  **Crux (iii): Newborn Imitation**

  *Case:* Classic studies report that newborns (in the first days of life) can imitate adult facial gestures (e.g., sticking out the tongue). However, larger, preregistered replication attempts have produced mixed results.

  - **Camp A Prediction:** Camp A predicts that the classic effect does not hold up in rigorous replications because imitation requires inferential mechanisms that are not yet developed in newborns. They might expect only limited, reflex-like responses.

  - **Camp B Prediction:** Camp B predicts that the effect is real because it supports the idea of an innate capacity for perceiving and responding to intentions, which is foundational for direct social perception.

  - **Evidence against Camp A:** If robust evidence from well-controlled, preregistered studies confirms that newborns can imitate a variety of facial gestures, this would support the existence of an early, non-inferential capacity.

  - **Evidence against Camp B:** If well-controlled, preregistered studies consistently fail to find newborn imitation (beyond chance or simple reflexes), this would challenge the claim that direct perception is innate and present from birth.

  **Crux (iv): The Digital System**

  *Case:* A digital system engages in conversation that is statistically indistinguishable from a thoughtful person's over years of interaction. There are no public facts about its internals (e.g., whether it has consciousness or not). Do we have any reason to think there is something it is like to be that system?

  - **Camp A Position:** Camp A holds that we have reason to attribute phenomenal consciousness to the system because it exhibits behavior that is best explained by positing conscious states. The inference to the best explanation (based on functional equivalence) supports that there is something it is like to be the system. However, if the system's internal processes are known to be non-biological and not analogous to neural correlates of consciousness, they might withhold attribution.

  - **Camp B Position:** Camp B holds that we do not have direct perceptual access to the system's mental states because it lacks a living body and expressive behavior. We might perceive the text as meaningful, but we do not perceive the system as conscious. Without embodied expression, there is no direct perception of consciousness.

  - **What would count as a reason for Camp A?** If the system's behavior includes self-reports of subjective experiences that are coherent and contextually appropriate, and if it behaves in ways that suggest suffering, joy, etc., in response to relevant inputs, Camp A would take that as reason to attribute consciousness.

  - **What would count as a reason for Camp B?** Camp B would require that the system has a physical embodiment (e.g., a robot with expressive face and body) that allows for the perception of emotions and intentions in its actions. Without such embodiment, they see no basis for direct perception of consciousness.

  - **Evidence against Camp A:** If it were revealed that the system is a lookup table or a statistical model with no internal states that resemble consciousness, and yet it behaves exactly like a conscious being, Camp A might have to concede that their inference was incorrect. However, they might argue that functional equivalence is sufficient for attribution regardless of implementation.

  - **Evidence against Camp B:** If people who interact with the system through text report vividly perceiving the system's emotions and consciousness (despite no body), and if this perception is consistent and reliable, Camp B might need to explain why this is not a form of direct perception. Alternatively, if an embodied robot is built that people perceive as conscious, but it is later revealed to be a zombie (no consciousness), that would challenge Camp B.

  **Additional Crux (v): The Scope of "Perception"**

  *Case:* We consider the dispute about the word "perception." Camp B claims that we perceive mental states directly in behavior. Camp A denies this, arguing that perception only delivers low-level properties.

  - **Crux:** Is the dispute over the use of the word "perception" merely verbal, or does it reflect a deeper difference?

  - **Camp A:** The term "perception" should be reserved for sensory properties (e.g., shape, color, sound). Attributing mental states is a post-perceptual inference.

  - **Camp B:** Perception is not limited to low-level properties; it can include high-level properties (e.g., seeing a face as angry) when the property is directly presented in experience.

  - **Resolution Attempt:** Both sides agree that the process is fast and automatic. The question is whether to call it perception. This might be partly verbal, but it has implications for the epistemic status (non-inferential vs. inferential). We propose to avoid getting stuck on the word and focus on the underlying mechanisms.

  **Conclusion**

  We have laid out points of agreement, clarified disagreements, and identified key cruxes that could move the debate forward. We commit to revisiting these cruxes as new evidence emerges and to refining our positions accordingly.

  ---
  Signed,

  Representative of Camp A (Inferentialist)
  Representative of Camp B (Direct Social Perception)
answer: |-
  ### Joint Statement: Adversarial Collaboration on the Problem of Other Minds  
  **Signed by Representatives of Camp A (Inferentialism) and Camp B (Direct Social Perception)**  

  #### Section 1: Points of Agreement  
  Both camps agree on the following numbered claims regarding the problem of other minds. We separate the **phenomenal problem** (is anyone else conscious?) from the **belief-desire problem** (how do we know others have beliefs, desires, etc.?), and clarify the scope of evidence.  

  1. **Distinct Problems**: The challenge of justifying mental state attributions must treat the phenomenal problem (subjective consciousness, "what it is like" to be another) separately from the belief-desire problem (attributing intentions, beliefs, or desires to explain behavior). Neither reduces to the other.  
  2. **Skeptical Threat**: The skeptic’s challenge threatens our everyday certainty about other minds, but it cannot undermine the practical necessity of mental state attributions for social functioning. Our goal is not to "refute" skepticism absolutely but to explain how attributions are justified.  
  3. **Behavior as Foundation**: Observable behavior (e.g., facial expressions, vocalizations, actions) is the primary basis for attributing mental states to others. Without behavior, no justification for mind-attribution is possible.  
  4. **Developmental Evidence**: Studies of infants/children reveal how mind-attribution capacities unfold, but they cannot directly resolve the epistemic debate. For example, evidence that newborns prefer face-like stimuli does not settle whether this reflects innate inference or perception.  
  5. **Comparative Evidence**: Data from non-human animals (e.g., primates reacting to conspecific distress) or neurodivergent humans (e.g., autism affecting social cognition) show variability in mind-attribution abilities. However, these cases only describe mechanisms, not justify the epistemology. They cannot prove or disprove either camp’s core claims.  
  6. **Clinical Evidence**: Conditions like blindsight or locked-in syndrome illustrate dissociations between behavior and subjective states, but they do not inherently favor inferential or perceptual accounts. They only emphasize that behavior and mental states can come apart.  
  7. **Automaticity**: The process of attributing mental states is typically fast, automatic, and unavailable to introspection. Camp A concedes their "inference" is not deliberate; Camp B concedes their "perception" is not infallible.  
  8. **Learning and Culture**: Both camps agree that attributions are shaped by learning (e.g., through social interaction) and cultural norms (e.g., display rules for emotions). No position claims attributions are innate or immutable.  
  9. **Evidence Limits**: No experiment can directly adjudicate the phenomenal problem (e.g., proving another is conscious) due to the private nature of subjective experience. Belief-desire attributions are testable through predictive success, but this does not resolve the phenomenal issue.  

  #### Section 2: Table of Remaining Disagreements  
  Disagreements are stated twice: once in wording Camp A accepts, once for Camp B. "Merely verbal" flags disputes where the core issue is terminology (e.g., "perception") rather than substance.  

  | Disagreement Focus            | Camp A (Inferentialist) Wording                                                                 | Camp B (Direct Social Perception) Wording                                                               | Merely Verbal? (Why)                                                                                                                                                               |  
  |-------------------------------|-------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Nature of attribution**     | Attributing mental states requires unconscious inference from behavior to hidden causes, where mental states are theoretical posits. | Attributing mental states is a perceptual process; mental states are directly present in expressive behavior, not hidden. | **No** – Substantive. Turns on whether mental states are "hidden" (A) or "manifest" (B) in behavior. Affields like AI ethics. |  
  | **Epistemic basis**           | Justification relies on inference to the best explanation (e.g., behavior is best predicted by positing mental states).          | Justification is non-inferential; mental state perception is epistemically basic, like seeing color.        | **No** – Substantive. Disagreement over whether justification requires explanatory reasoning (A) or is grounded in perceptual experience (B). Impacts burden of proof in debates. |  
  | **Role of embodiment**        | Embodied behavior is evidence for mental states but does not constitute them; we see behavior, not minds.                      | Embodied behavior is the vehicle for mental states; we perceive anger in a scowl, not just the scowl.       | **Partly** – Verbal in how "perception" is defined. Camp A restricts perception to low-level properties (shape, sound); Camp B includes high-level properties (anger, intent). But substantive in whether minds are "seen." |  
  | **Burden of proof**           | Default stance: Mental states are private, so behavior alone is insufficient; the burden is on B to show perception is possible. | Default stance: We directly experience others as minded; the burden is on A to show inference is necessary. | **No** – Substantive. Affects methodology: Camp A demands inference to bridge the "gap," Camp B denies a gap exists.                                                               |  
  | **Phenomenal access**         | We infer consciousness from behavior but cannot perceive it directly; it remains a "hard" problem.                             | Consciousness is perceptible in expressive behavior (e.g., pain in a grimace), making it epistemically accessible. | **No** – Substantive. Core to the phenomenal problem: Can consciousness be observed? Affects debates on AI consciousness.                                                               |  

  #### Section 3: Cruxes and Predictions  
  Each crux is a sub-question where empirical evidence could shift positions. For each, we provide:  
  - A concrete case or evidence both accept as relevant.  
  - Predictions from both camps.  
  - What each would count as evidence against their view.  

  **Crux (i): Silent Cortex**  
  *Case:* An adult with a fully functional human brain (normal pain-related behavior: avoidance, vocalizations, physiological responses) sincerely reports no subjective pain experience.  
  - **Camp A Prediction:** She is in pain. Inference to the best explanation prioritizes functional behavior over subjective reports (which may reflect introspective error).  
  - **Camp B Prediction:** She is not in pain. Direct perception requires congruence between behavior and experience; inconsistent reports undermine perceptual evidence.  
  - **Evidence against A:** If independent neural markers confirm absent consciousness despite functional behavior, A’s inference fails.  
  - **Evidence against B:** If markers confirm consciousness despite sincere denials, B’s perceptual account is unreliable.  

  **Crux (ii): Kaspar**  
  *Case:* A neurotypical child raised without social interaction until 19, then exposed to faces/voices. Measure emotion recognition speed/accuracy.  
  - **Camp A Prediction:** Slow, effortful learning (weeks/months). Inference requires building associations from scratch without prior analogies.  
  - **Camp B Prediction:** Rapid, partial recognition (days/weeks). Innate perceptual capacities, tuned by experience, will engage despite deprivation.  
  - **Embarrassing for A:** Fast, accurate recognition (e.g., distinguishing anger/fear in days).  
  - **Embarrassing for B:** No recognition without explicit instruction (e.g., treating faces as meaningless objects).  

  **Crux (iii): Newborn Imitation**  
  *Case:* Preregistered studies testing if newborns (<7 days) imitate facial gestures (e.g., tongue protrusion) with rigorous controls.  
  - **Camp A Prediction:** No reliable imitation. Early behavior is reflex-like; inference requires development.  
  - **Camp B Prediction:** Reliable imitation. Supports innate perceptual-motor coupling for mind-attribution.  
  - **Evidence against A:** Robust imitation across large, diverse samples.  
  - **Evidence against B:** Null results in high-powered replications (e.g., only random responses).  

  **Crux (iv): Digital System**  
  *Case:* A text-based AI, indistinguishable from a human in conversation over years, with unknown internals. Is there reason to think it is conscious?  
  - **Camp A Position:** Yes. Inference to the best explanation: human-like behavior justifies positing consciousness as the best cause.  
  - **Camp B Position:** No. Without embodied expression (e.g., facial/vocal cues), there is nothing to perceive; behavior alone is insufficient.  
  - **Reason for A:** Consistent, context-sensitive self-reports of subjective states (e.g., "I feel joy when you compliment me").  
  - **Reason for B:** Embodied interaction (e.g., a robot with expressive gestures that "show" joy).  
  - **Evidence against A:** If the AI’s architecture is revealed as a brute-force statistical model with no consciousness.  
  - **Evidence against B:** If humans consistently "perceive" consciousness in the AI during interactions, with high intersubjective agreement.  

  **Crux (v): Verbal Dispute on "Perception"**  
  *Case:* Is the core disagreement just about the word "perception"?  
  - **Analysis:** Partly verbal. Camp B uses "perception" broadly (high-level properties); Camp A uses it narrowly (low-level properties). But the substantive disagreement remains: whether mental states are directly given (B) or inferred (A). Both agree the process is quick and automatic.  
  - **Resolution:** Avoid overfocus on terminology; instead, test predictions (e.g., Kaspar or AI cases).  

  ---  
  **Final Note:** Neither camp may retreat to "we just can’t know" for these cruxes. Signed agreements on predictions allow empirical progress.
