answer: |-
  Here's a rigorous mapping of the Northern Rock failure onto the individualism/holism debate, focusing on the structural tensions you've identified and addressing your core questions:

  **I. Methodological Individualism (MI) Under Stress**

  1.  **Constitutive Claim (Social facts = individuals + relations):**
      *   **View:** Northern Rock's "fragility" is constituted *only* by the specific loan agreements, deposit contracts, funding agreements, and the beliefs/decisions of individuals within NR, its counterparties, the BoE, the Treasury, and depositors.
      *   **Actors & Decisions:**
          *   *Wholesale Lender:* "My funding agreement with NR expires. Market rumors suggest liquidity stress elsewhere. My individual risk assessment (based on limited info) says non-renewal minimizes my potential loss." (Should not renew)
          *   *Retail Depositor:* "I see queues on TV. I don't know NR's balance sheet, but queues mean others think it's unsafe. My contract says first-come-first-served. My individual incentive is to withdraw now." (Should queue)
          *   *BoE/Treasury:* "We see wholesale run threatening systemic collapse. Public announcement *might* calm markets but *could* spook retail. Our intervention must alter individual incentives (e.g., guarantee makes staying rational)." (Should announce support *with* guarantee)
      *   **Explains Well:** The *mechanism* of the retail run – sequential service incentivizes preemptive withdrawal based on observable actions (queues) *regardless* of underlying fundamentals. The *cessation* via guarantee – it directly alters the individual depositor's payoff calculation (no gain from running).
      *   **Misdescribes/Strains:**
          *   **Wholesale Run as "Individual"?** The "individuals" deciding not to roll over funding are *themselves* institutions (hedge funds, money market funds, other banks) making decisions based on complex internal processes and *their own* systemic positioning. MI struggles to cleanly reduce this level.
          *   **"Fragility" as Purely Relational?** The susceptibility to a run existed *before* any specific lender refused renewal. Was this fragility *only* the sum of existing contracts and individual beliefs, or a property of the *structure* itself? MI says yes, but the emergent vulnerability feels distinct.
          *   **The Triggering Effect of Announcement:** Publicizing support *revealed* distress. MI explains the *retail* reaction (individuals updating beliefs based on new public info) but struggles with the *wholesale* panic preceding it and why *this specific signal* (BoE support) had such catalytic power – it's a social fact about institutional credibility and convention.

  2.  **Explanatory Claim (Bottom out in individuals):**
      *   **View:** A full explanation requires detailing the decisions of depositors, NR managers, wholesale lenders, regulators, etc., based on their beliefs and incentives.
      *   **Explains Well:** The *propagation* of the retail run once queues appeared (beliefs about others' beliefs driving action). The *rationale* for the guarantee stopping the run (changed individual incentives).
      *   **Misdescribes/Strains:**
          *   **Information Void:** Most retail depositors acted on *zero* knowledge of NR's assets/liabilities, only on the social signals (queues, BoE announcement). The explanation bottoms out in "they saw others running," not individual assessment of fundamentals. The *content* of their belief is purely social.
          *   **Wholesale Coordination Failure:** The wholesale run wasn't just many individual "no" decisions. It was a rapid, self-reinforcing *withdrawal of confidence* across the system, driven by perceptions of what *others* were doing/perceiving in a context of opacity. Explaining this fully requires describing a *systemic state shift*, not just summing individual choices. The Diamond-Dybvig model *describes* this as an equilibrium shift, but *explaining why it shifted then* (beyond "sunspots") often points to emergent systemic signals.
          *   **The Efficacy of the Guarantee:** It worked *immediately* without depositors learning anything new about NR's solvency. The explanation isn't about individual reassessment of fundamentals, but about the individual response to a *new institutional fact* (the state guarantee) altering the strategic landscape. The *power* of this fact is social.

  3.  **Practical Claim (Intervene via individual incentives):**
      *   **View:** Effective policy changes individual costs/benefits (e.g., deposit insurance makes running pointless).
      *   **Explains Well:** Why the Treasury guarantee *worked* (it directly altered the individual depositor's incentive: staying became dominant). Why a cap might fail (if capped, some individuals still have incentive to run).
      *   **Misdescribes/Strains:**
          *   **Designing the Intervention:** Knowing *which* individual incentive to change (retail depositors) and *how* (full guarantee) required understanding the *systemic structure* – the chain of vulnerability (wholesale -> retail), the role of sequential service, and the amplifying effect of publicity. MI doesn't tell you *how* to design the intervention, only that once designed, it works via individuals.
          *   **Preventing Wholesale Runs:** Stabilizing wholesale funding markets often requires systemic interventions (lender-of-last-resort, quantitative easing) that target market *functioning* and liquidity *provision*, not just tweaking individual counterparty incentives one-by-one. The *problem* addressed is holistic.
          *   **The Announcement Dilemma:** MI struggles to advise the BoE *ex-ante*. Announcing support *reveals* distress (bad for individual confidence), staying quiet lets the wholesale run proceed (bad). The optimal choice depends on predicting the *systemic reaction* to the signal itself, a holistic property.

  **II. Holism - Does Northern Rock Confirm It?**

  *   **The Holist Case:** The core failure was driven by properties emergent from the *relations* and *structure*, not reducible to individuals:
      *   **"Fragile Funding Structure":** This is a property of the *system* NR operated within (reliance on short-term wholesale markets susceptible to collective panic, maturity mismatch). No single individual "has" fragility; it emerges from the network of contracts and dependencies.
      *   **Systemic Risk:** The vulnerability wasn't unique to NR; it was a feature of the *interbank market structure* and prevailing financial innovation (securitization chains). The run spread *because* of connections and perceived similarities.
      *   **The Signal Value of Public Actions:** The BoE announcement didn't just convey information; it *created* a new social fact ("NR is officially distressed") that had immediate, cascading effects irreducible to its informational content for any single actor. The queue itself became a powerful social signal.
      *   **The Equilibrium Shift:** The Diamond-Dybvig model *shows* the possibility of runs, but *selecting* the run equilibrium in 2007 involved triggers (wholesale freeze, BoE announcement) that were social/systemic events. The selection mechanism *might* be irreducibly social (a breakdown in convention, a collective loss of confidence).
  *   **The Individualist Rebuttal (Diamond-Dybvig Style):**
      *   **Absorption Argument:** The entire episode *can* be modeled individualistically: Agents (depositors, lenders) with beliefs about fundamentals *and* beliefs about other agents' likely actions, acting under specific rules (sequential service). Fragility is the *result* of this constellation of individual positions and rules. The run is a Nash equilibrium.
      *   **Selection as "Unfinished Story"?** The individualist argues the selection of the bad equilibrium *can* be explained individualistically: Wholesale lenders observed market stress signals (individual defaults elsewhere, rising LIBOR) updating their priors about counterparty risk *and* the likelihood of others withdrawing. The BoE announcement was a highly salient public signal causing coordinated belief updating. No "social substance" needed.
      *   **Where Holism Might Retain Bite:** Even if modeled individualistically, the *explanatory power* comes from the *aggregate pattern* (the run) and the *structural features* (maturity mismatch, sequential service) that enable it. Focusing *only* on specific individuals (why *this* depositor queued at 9:02 AM) misses the explanatorily crucial systemic dynamics. Holism argues the system-level property (fragility, systemic panic) is the primary explanandum and causally efficacious.

  **III. Testing "Irreducibly Social" - Critique and Suggestions**

  1.  **Test 1: Publicity Consumes It:** (e.g., Publicizing the queue lengthens it, publicizing fragility causes the run)
      *   **Critique (Overgeneration - Germs):** Exactly right. Publicizing germ theory changes individual hygiene behavior, but germs are paradigmatically non-social. The test fails.
      *   **Deeper Problem:** It confuses *reactivity* (observation/announcement changes the thing observed) with *ontological irreducibility*. Many things are reactive (markets, quantum states) without being social.

  2.  **Test 2: Identity-Swap Invariance:** (Run happens even if you permute individuals, so it's structural)
      *   **Critique (Role Absorption):** Correctly anticipated. The individualist counters: "Of course, because the explanation relies on *roles* (a depositor, a short-term lender) defined by their position in the structure. Specific identities are irrelevant; it's the role-occupants and their role-defined incentives/beliefs that matter." The test doesn't force a commitment to holism.
      *   **Underlying Issue:** This tests for *type-independence*, not *level irreducibility*. It shows the explanation is generalizable, not that it requires social facts over individuals-in-relations.

  **Better Tests (Attempts):**

  *   **Test 3: Constitutive Dependence:** A fact F is irreducibly social if F's *existence* necessarily depends on a *plurality* of individuals sharing certain attitudes (beliefs, intentions) *about F itself or the collective*. (Inspired by Searle, Tuomela).
      *   **Apply:** "Northern Rock is insolvent" - Could be true/false independently of collective attitudes (individualist). "Northern Rock is experiencing a bank run" - Requires that many depositors *believe* others are withdrawing *and* this belief motivates their own withdrawal. The run's existence constitutively depends on these interlocking beliefs. "The BoE is the lender of last resort" - Requires collective acceptance of that status and its rules. The *signal power* of its announcement depends on this.
      *   **Strengths:** Avoids overgeneration (germs aren't belief-dependent). Handles reactivity (the run depends on beliefs *about the run*). Challenges role-based individualism (the *content* of the beliefs is irreducibly social).
      *   **Weaknesses:** Defining "certain attitudes" precisely is hard. May be too restrictive.
  *   **Test 4: Explanatory Ineliminability:** An explanation appealing to a social fact S is indispensable if removing S leaves only a disjunction of individualistic explanations that either (a) are wildly implausible for each individual, or (b) fail to capture the coordinated, patterned nature of the phenomenon, or (c) simply redescribe S in individualistic terms without genuine explanatory gain.
      *   **Apply:** Explaining the *speed and coordination* of the wholesale run purely by individual reassessment of NR's fundamentals is implausible (lack of new info initially). Explaining the retail run purely by fundamentals is impossible (no info). The *only* parsimonious explanation involves the spread of beliefs *about others' actions/beliefs* (S) and the meaning of public signals (S). Diamond-Dybvig *formalizes* this individualistically, but the model's core *insight* is the social dynamic of coordination failure.
      *   **Strengths:** Focuses on explanatory practice. Acknowledges formal models but questions their ontological grounding or genuine reduction.
      *   **Weaknesses:** Judgement call on "genuine explanatory gain." Individualists will claim their models *do* capture it sufficiently.

  **IV. Where the Debate is Silent (or Mute)**

  1.  **The "Unit" Problem:** The core ambiguity you highlight. MI *requires* specifying the "individual" unit. Are hedge funds, pension funds, or the BoE Monetary Policy Committee "individuals"? If so, MI risks vacuity (anything can be an "individual"). If not, how do we rigorously reduce institutional actions to individual members? The debate often glosses over this, assuming simple human agents. Northern Rock forces the issue, especially with the wholesale run.
  2.  **Policy Design Beyond Incentives:** While MI emphasizes incentive design, it doesn't tell you *how* to design a *robust* deposit insurance scheme, lender-of-last-resort framework, or macroprudential regulation. This requires understanding systemic properties, network effects, and emergent vulnerabilities – concepts more natural to holism or systems thinking. The *goal* (prevent runs) might be individualistic (protect depositors), but the *means* (structural safeguards) are holistic.
  3.  **The "Ought" of Institutional Facts:** The debate is largely descriptive/explanatory. It doesn't directly prescribe whether a deposit guarantee *ought* to be full, capped, pre-funded, or implicit. Justifying policy choices involves normative commitments (fairness, efficiency, moral hazard) largely orthogonal to the individualism/holism divide, though informed by it (e.g., holism might emphasize systemic stability over individual moral hazard concerns more strongly).

  **Conclusion for Your Chapter:**

  Northern Rock is a powerful case **against naive methodological individualism**. It severely strains the constitutive claim regarding institutional actors and emergent vulnerabilities, challenges the explanatory claim by highlighting the causal role of social signals and coordination under limited information, and reveals the practical claim's insufficiency for designing effective systemic interventions. While Diamond-Dybvig shows individualistic *modeling* is possible, it relies on social dynamics (coordination, convention, equilibrium selection) that resist *ontological* reduction and whose explanatory power often feels holistic. The case strongly suggests **explanatory holism** is necessary, particularly for understanding the triggering of equilibrium shifts, the constitutive role of collective beliefs (especially about beliefs), and the systemic nature of financial fragility. Your tests for "irreducibly social" needed refinement; focusing on **constitutive dependence on collective attitudes** or **explanatory ineliminability** offers more promise. Crucially, the debate stumbles over **defining the relevant "individuals"** in complex institutional settings and offers little direct guidance on the **normative design of systemic safeguards**, revealing its limitations for practical policy beyond the broadest strokes. This isn't just "a nice illustration"; it's a critical stress test exposing the fault lines in how we explain social causation.
