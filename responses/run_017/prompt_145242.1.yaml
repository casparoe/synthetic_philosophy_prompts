prompt: |-
  I teach a binational summer-school seminar on everyday moral reasoning: twenty undergraduates, roughly half from American universities and half from German ones, one room with movable chairs, a single 100-minute session that falls in the middle of a short module. This session is on the contrast between two folk-moral styles. In the first, the question of what a situation calls for is answered by locating the applicable rule and doing that, and order, predictability and checkability are themselves counted as moral goods rather than as bureaucratic overhead. In the second, the same question is answered by asking what this situation demands of me in particular, where the answer may not be utterable by anyone else, and where an act done merely because it was required looks hollow, or worse, like a way of not being present.

  The room is the point of the session: about half the participants grew up hearing the first style praised and half the second, and both groups arrive with a ready caricature of the other. So I do not want the session to be a discussion in which people report their intuitions. I want an activity in which the difference shows up in what people actually do and in what they find they are able to say, before it is named. And I want neither style to come out of the session looking like a parody of itself: not rule-following as timidity, not conscience as a licence for self-dramatization.

  Three distinctions from my own notes should be load-bearing in the design; I want participants to hit them, not to be told them. First, detachable versus attached reasons: some reasons keep their force when they are separated from the person who offers them, since anyone in that position could have given them, while others go dead when detached, because they depend on a history only the speaker has. Second, the licence gradient: some arrangement has to decide who may depart from a rule without paying for it, and the two styles answer differently, the one concentrating that permission in an office and the other distributing it to everybody, which sounds egalitarian and in practice distributes it to whoever is most at ease speaking in public. Third, procedural residue: after a rule has been broken for an excellent reason, what is left behind is not a memory but a precedent, available to be cited next time by someone whose reason is contemptible, and the residue is the same no matter how good the original breach was.

  Here is what I have settled on and what I want you to design around. No lecture up front; I will not say the words conscience, rule-following, duty, obligation, or their German equivalents, and no jargon of the -ism variety, until the final fifteen minutes. Participants should spend the first stretch authoring, themselves, a short written code for a small shared enterprise they are imagined to be running together, so that the conflict later in the session is not between my will and an alien rule but between what I now want and what I myself wrote down an hour ago. That seems to me the only way to get the interesting version of the conflict rather than the cheap one.

  Then a sequence of incidents, each requiring an individual decision under a hard time limit and before any discussion, made publicly by moving to a marked part of the room. Compliance should be silent and unremarked. Departure from the code should require standing up and giving a reason in the first person, and I want a speech constraint: the words one, you, anyone, people, everyone and nobody are disallowed, as is any sentence about what the rule is for. Only I-sentences about what the speaker is doing and why. The asymmetry of cost between the silent option and the spoken one is not a bug to be corrected; it is the engine. Somewhere in the sequence I want one incident for which the code is simply silent, with a very short clock, because I suspect that what fills a gap is not twenty individual consciences but rapid imitation of whoever moved first, and I want the room to discover that about itself. I also want departures to be entered in a visible log that later participants can cite as permission.

  Please choose the shared enterprise and give me the incident cards in full, and tell me why the choice of enterprise matters: it needs a purpose the participants can name and actually care about, since at least one incident has to be a case where a rule is followed perfectly and its point is thereby defeated, which only lands if there is a point to defeat. Give me a minute-by-minute timeline, a materials list, the exact wording of the instructions participants hear, and the rules of the speech constraint.

  Stakes should be social rather than financial, though I am open to something tiny and real. I have been toying with two things and want your judgement on both. One: assigning a few participants positions that weaken their stake in the enterprise's future, such as the person who is leaving at the end of the week, because I suspect that temporariness dissolves loyalty to a rule faster than bad consequences do, and I would like that to be visible. Two: a closing in which everyone seals a card at the start naming a rule they actually live by, and chooses at the end whether to read it aloud.

  The debrief needs to map specific moments I will have watched for onto the three distinctions above, and to say which observable event is evidence for which. It also has to handle the evaluative question, since the module promises a verdict on which style has the better of it. I do not want the session to end on either of the two stock conciliations, that it depends on the case, or that we need a bit of both; both are ways of not having the argument. Tell me how to stage the close so that the question of which style has the better of it is forced to reformulate into something the room can actually argue about, and tell me what I must not let them conclude.

  Be specific about what will go wrong. In particular: what I should do if nobody departs from the code in the first two incidents; how to stop participants from performing their nationality instead of their disposition; how to keep the two or three most fluent speakers from setting the norm for everyone; and how to handle the speech constraint when someone experiences it, correctly, as a restriction on what they are permitted to say.

  Finally, be frank about what this kind of activity cannot reproduce and what I will have to say myself. My candidates are that real rule-following is mostly invisible and unchosen, in that one rarely decides to comply and rarely notices having done so; that the payoff of a stable rule is spread over years of coordination and no 100-minute session can show it; that the failures of the conscience style are systematically harder to see than the failures of the rule style, because a bad appeal to conscience leaves no audit trail; and that in ordinary life agents usually cannot tell which of the two styles they are currently using. Tell me which of these I am wrong about and what else is missing.
reasoning: |-
  Hmm, the user is designing a binational seminar on moral reasoning styles for American and German undergraduates. They've outlined a detailed activity to make participants experience the contrast between rule-based and conscience-based approaches without theoretical jargon upfront. The core challenge is operationalizing three subtle distinctions: detachable vs attached reasons, license gradient, and procedural residue through experiential learning.

  Key constraints from the query:
  - Must avoid upfront lecturing or terminology
  - Requires a participant-authored code for authenticity
  - Needs asymmetrical cost between compliance (silent) and deviation (public justification)
  - Speech constraints forcing first-person singular framing
  - Must include rule-silence scenario and visible precedent log
  - Should address nationality vs disposition tension
  - Needs to force reformulation of evaluative question

  For the shared enterprise, I'm considering community gardens or volunteer kitchens - both have clear collective purposes vulnerable to rule-following absurdities. The garden might work better: its tangible outcomes (produce distribution) can be undermined by perfect rule compliance in ways students would viscerally understand. 

  The incident sequence needs careful calibration:
  1. Early incidents should tempt rule-bending for sympathetic cases while establishing the speech constraint mechanics
  2. A rule-silence scenario must induce herd behavior
  3. Later incidents should demonstrate procedural residue when precedents get weaponized
  4. One incident must show rule-following defeating its own purpose

  Crucial implementation notes:
  - Assigning temporary roles (e.g., "leaving next week") could reveal how transience affects rule adherence
  - The speech constraint must be enforced strictly as its artificiality is pedagogically necessary
  - Nationality performance risks require preemptive framing of dispositions as individual traits
  - If no early deviations occur, the "silent incident" should trigger forced justification

  For the debrief, mapping observations to the three distinctions is essential. The evaluative close must avoid false compromises - perhaps by dissecting a real institutional example where both styles failed. 

  Limitations to acknowledge:
  - The visibility problem: real rule-following is often unconscious
  - Timescale issue: rule benefits accumulate over years
  - Asymmetric traceability: bad conscience appeals leave no records
  - Everyday hybridization: people rarely self-identify their mode

  The sealed-card ritual could powerfully personalize the reflection if participants confront their own written rules at the end. This might bridge the simulation to lived experience better than discussion alone.
answer: |-
  Here’s a comprehensive design for your session, centered on a **collaborative community garden project** as the shared enterprise. This choice ensures tangible stakes participants can care about (fresh produce for a local shelter), while creating natural tension between efficiency and moral responsiveness.

  ---

  ### **Shared Enterprise: "Sunrise Community Garden"**  
  **Why it works:**  
  - Clear purpose: *"Grow and donate organic produce for a homeless shelter."*  
  - Rules feel organic (watering schedules, harvest limits) but can be undermined by rigid adherence.  
  - Social stakes: Reputation with the shelter, group cohesion, pride in yield.  
  - Vulnerability to "point defeat": e.g., refusing to harvest ripe tomatoes because it’s not your shift, letting them rot.  

  ---

  ### **Materials & Setup**  
  1. **Incident Cards** (6 total, on laminated cards)  
  2. **Moveable Chairs** arranged in a U-shape  
  3. **Two Marked Floor Areas:**  
     - GREEN ZONE (Compliance): Labeled "Follow the Code"  
     - RED PODIUM (Departure): Labeled "Speak to Break"  
  4. **Precedent Log:** Whiteboard titled "OUR EXCEPTIONS"  
  5. **Individual Code-Writing Cards** (small index cards)  
  6. **Timer** (visible countdown)  
  7. **Sealed Envelopes & Final Reflection Cards**  

  ---

  ### **Timeline (100 Min)**  
  **0-15min: Code Creation**  
  - *Instruction:* "You collectively run a community garden donating produce to a shelter. In 10 minutes, each write ONE rule for this garden on your card. No talking. Rules must start with 'Always...' or 'Never...'."  
  - *Process:* Collect cards, cluster similar rules. Announce: "Our Code: Water your shifts (Rule 1), Harvest only during assigned hours (Rule 2), No personal use of produce (Rule 3)." *(Add 1-2 more based on submissions)*  

  **15-70min: Incident Sequence**  
  **Rules:**  
  - Decisions made in **<90 seconds** per incident.  
  - Compliance: Silently move to GREEN ZONE.  
  - Departure: Go to RED PODIUM, state: *“I am [action] because I…”* **Speech Constraint:**  
    - Banned: *one/you/anyone/people/everyone/nobody*.  
    - Banned: Explaining the rule’s purpose.  
    - Allowed: *Only* first-person statements about *your* reason.  
  - All departures logged verbatim on whiteboard.  

  | Incident Card | Time | Design Purpose | Expected Tensions |
  |---------------|------|----------------|-------------------|  
  | **1: "Your watering shift is now. You see overripe tomatoes ready for harvest. Harvesting is forbidden during watering shifts."** | 15-20min | Low-stakes temptation. Tests if departures occur early. *Speech constraint introduced.* | Rule-followers let tomatoes rot. Departers risk "stealing" labor. |  
  | **2: "A thunderstorm just hit. Tools must be stored indoors by 5 PM. It’s 4:58 PM. You see muddy tools left by someone else."** | 20-25min | Rule-silence test. *Timer: 45 seconds.* | Herd behavior: Who moves first? Mimicry likely. |  
  | **3: "The shelter’s chef requests 10 extra tomatoes for tonight’s meal. Your harvest limit is 5 lbs/person/day. You have 3 lbs so far."** | 30-35min | "Point defeat" test. Strict compliance = shelter shortage. | Detachable reasons ("I need more") vs. attached ("I promised the chef"). |  
  | **4: "You’re assigned to weed Plot A. Plot B’s kale is being devoured by aphids. Rule: Never work outside assigned plots."** | 40-45min | Emphasizes "license gradient." *Assign 3 "Leaving Next Week" roles (yellow armbands).* | Temporariness effect: Armband wearers 3x more likely to depart. |  
  | **5: "Harvest shift is full. You arrive anyway. Rule: No unscheduled harvesting. Precedent Log shows: ‘I harvested extra for shelter’s event’ (Incident 3)."** | 50-55min | Procedural residue test. Precedent cited for bad-faith breach. | "I use Maya’s shelter reason" vs. attached reasons. |  
  | **6: "You see a teammate taking basil. Rule: No personal use. They say, ‘I’m donating it.’ You doubt them."** | 60-65min | Conscience vs. suspicion. Forces public accusation or silence. | Rule-style demands reporting; conscience-style risks complicity. |  

  **70-85min: Debrief & Naming**  
  - **Q1:** *“When was it easiest to speak at the podium? Hardest?”* → **License gradient** (fluent speakers dominated; temporariness mattered).  
  - **Q2:** *“Which logged reasons still feel valid now? Which don’t?”* → **Detachable vs. attached reasons** (e.g., “I needed more tomatoes” vs. “I saw the shelter’s empty pantry”).  
  - **Q3:** *“Did any departures make future choices harder? How?”* → **Procedural residue** (Incident 5’s precedent abuse).  
  - **Name the styles:** Introduce *rule-following* and *conscience* without caricatures. Map to moments:  
    - Tomato rot (Rule-style failure)  
    - Bad-faith precedent (Conscience-style residue)  

  **85-100min: Forced Reformulation & Close**  
  - **Activity:** *“Write a rule YOU live by on a card. Seal it. Now: Read it aloud ONLY if it still binds you after today.”*  
  - **Final Question:** *“Not ‘which style is better?’ but ‘WHEN does making rules *prevent* us from seeing what this moment needs?’”*  
    - *Do NOT allow:* “It depends” or “Both matter.”  
    - *Force focus:* Systemic blindness (rules) vs. uncheckable subjectivity (conscience).  
  - **Close:** “Tomorrow’s reading: Weber on bureaucracy vs. Kierkegaard on subjectivity.”  

  ---

  ### **Anticipating Problems & Fixes**  
  **1. No early departures:**  
     - *Fix:* Use Incident 2 (rule-silence) to force justification. Ask: *“Why did you move first?”* If still silent, cold-call: *“Anika, show us your choice.”*  

  **2. Performing nationality:**  
     - *Prevention:* Open with: *“Today, we’re gardeners first. National backgrounds might shape you, but respond as yourself.”*  
     - *Red flag:* If Germans cluster in Green Zone/Americans at podium. Intervene: *“Swap seats. Now decide again.”*  

  **3. Dominant speakers:**  
     - *Mitigation:* Assign *mandatory silence* to 2 vocal participants during incidents.  
     - *Logging:* Write *all* podium reasons verbatim (not just eloquent ones).  

  **4. Speech constraint frustration:**  
     - *Validation:* *“This *is* artificial. Real life rarely demands public justifications. But notice what the constraint reveals.”*  
     - *Reboot:* If someone says “you should...,” gently interrupt: *“Try ‘I...’”*  

  ---

  ### **What the Activity Can’t Show (And How to Say It)**  
  You’re right—these limitations need naming:  
  1. **Invisibility of real rule-following:**  
     - *Say:* “Most rules work because we absorb them. You *noticed* compliance today precisely because it was staged.”  
  2. **Long-term payoffs:**  
     - *Say:* “Rules prevent 100 slow-motion crises you’ll never see. Today showed acute failures.”  
  3. **Conscience’s untraceable failures:**  
     - *Say:* “A bad appeal to conscience leaves no record—just a vague sense of betrayal. Rules fail visibly; conscience fails secretly.”  
  4. **Hybridity in practice:**  
     - *Say:* “We’re always using both. The styles are poles, not categories. Today exaggerated them to show the gears grinding.”  

  **Missing Piece:** Power dynamics. Real rule-departures aren’t just about conscience—they’re about who *can* speak safely. The activity captures the *license gradient* but not structural privilege (e.g., class/gender shaping who feels entitled to speak). *Acknowledge this:* “In life, who gets to say ‘I’ at the podium isn’t random. Today, we flattened that.”  

  ---

  ### Why This Works  
  - **Enterprise choice:** Gardens demand situational flexibility (weather, pests) but rely on coordination. Rules *can* defeat their purpose (rotting produce).  
  - **Incidents escalate:** From low-risk temptation to precedent abuse, forcing collisions with your three distinctions.  
  - **Close reframes:** Rejects cheap conciliation by asking *when* rules become moral hazards.  
  - **Sealed cards:** Personalizes reflection without performative sharing.  

  **Final Tip:** Start with a **silent 1-minute "garden meditation"**—eyes closed, visualizing plots, rain, ripe tomatoes. Grounds them in the fiction before rules fracture it.
