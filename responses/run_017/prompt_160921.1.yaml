  Based on your requirements, here's a decision tree handout focused on the grid-world agent case, designed to expose the metaphysical vs. causation-theory fault line and test your conviction about coarse-grained effects. It fits on one A4 page and includes all requested positions.

  ---

  **Causal Exclusion Argument Decision Tree**  
  *Using the Grid-World Agent Case*  
  *Start here: Agent walks to the fountain when `thirsty = true`. Today, `thirsty` is implemented by voltage pattern V1. After code porting, same behavior uses voltage V2.*

  ### 0. When the agent walks to the fountain, is its exact movement path (e.g., step-by-step kinematics) fully caused by prior voltages/electronics?
  - **No** → **Emergentist/Dualist**  
    *Awkward: Must deny physics can fully explain movement (denies causal closure).*
  - **Yes** → Proceed to Q1.

  ### 1. Does the `thirsty` variable cause the agent to go to the fountain? (Not just correlate!)
  - **No** → Proceed to Q1a.  
  - **Yes** → Proceed to Q2.

  ### 1a. Is `thirsty` a real property, or just a label for voltages?
  - "Just a label" → **Eliminativist**  
    *Awkward: Must say thirst doesn't exist—it's 'just voltages'.*  
  - "Real property" → **Epiphenomenalist**  
    *Awkward: Mental states exist but do nothing (voltage does all the work).*

  ### 2. How does `thirsty` cause fountain-going, given voltages (e.g., V1) also cause it?
  - "`thirsty` borrows power from its voltage" → Proceed to Q3.  
    *(Metaphysical relation: identity/constitution/inheritance)*  
  - "`thirsty` qualifies as a cause on its own terms" → Proceed to Q4.  
    *(Causation theory: difference-making/proportionality)*  

  ### 3. After code porting, is the *specific* V2 voltage part of what `thirsty` *is*?
  - **Yes** → **Token Identity Theorist**  
    *Awkward: `thirsty` is just whatever voltage implements it (lacks autonomy).*  
  - **No** → Proceed to Q3a.

  ### 3a. Does the fountain-going have two independent causes (`thirsty` + voltage)?
  - **Yes** → **Overdeterminationist**  
    *Awkward: All actions are 'overdetermined' like two gunshots.*  
  - **No** → **Non-Reductive Physicalist**  
    *Awkward: Mental causation 'inherits' from physical but risks exclusion.*

  ### 4. What makes `thirsty` a cause?
  - "Changing `thirsty` changes behavior (even if voltages change too)" → **Interventionist Compatibilist**  
    *Awkward: Debugger interventions (wrinkle a) suggest voltage does the work.*  
  - "`thirsty` is the 'right level' for fountain-going (not kinematics)" → Proceed to Q4b.  

  ### 4b. Does `thirsty-or-it's-Tuesday` cause fountain-going? (True when thirsty *or* Tuesday; agent is thirsty on Wednesday)
  - **Yes** → **Proportionality Compatibilist (permissive)**  
    *Awkward: Lets in gerrymandered causes (e.g., disjunctive properties).*  
  - **No** → **Proportionality Compatibilist (restrictive)**  
    *Awkward: Must explain why `thirsty` is 'natural' but not disjunctives.*

  ---

  ### Key Notes for Students
  - **Effect grain matters**: The tree uses coarse-grained effects (e.g., "goes to fountain"). With fine-grained effects (e.g., "moves left leg at t=3.001s"), physical causes dominate intuitions.
  - **Indistinguishable pairs**:  
    - Non-Reductive Physicalist vs. Token Identity (Q3): Hinges on whether mental states *are* voltages or just use them.  
    - Permissive vs. Restrictive Proportionality (Q4b): Both agree mental states cause; they split on what *else* counts.
  - **Your conviction tested**: At coarse grain (Q0→Q1), physical states (voltages) often drop out as *direct* causes—supporting your view. Proportionality theorists (Q4) formalize this.
  - **Unoccupied combos**: Denying Q0 *and* Q1a (mental exists but doesn’t cause) is incoherent. Accepting overdetermination (Q3a) is rare due to awkwardness.

