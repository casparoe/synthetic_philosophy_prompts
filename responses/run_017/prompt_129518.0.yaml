answer: |-
  Here’s a decision tree for teleosemantics, structured around your axes (design history without selection, and co-option). It uses six branching questions phrased as concrete cases or claims, assumes familiarity with frog/toad fly-snapping and Swampman, and explains new cases briefly. Leaves include positions (with key advocates) and their "awkward commitment." British English throughout.

  ---

  ### **Decision Tree for Teleosemantics**

  **Start Here**:  
  1. **Must a system have an *actual selection history* (e.g., natural selection shaping frog vision) to have mental content?**  
     - *If YES*: Go to Q2.  
     - *If NO*: Go to Q4.  

  **If YES to Q1 (selection history essential)**:  
  2. **Can a co-opted mechanism (e.g., bird feathers evolved for warmth, now used for flight) represent its *derived* function (flight) rather than its ancestral one (warmth)?**  
     - *If YES*: Go to Q3.  
     - *If NO*: **Position: Millikan-style Teleosemantics** (e.g., Ruth Millikan).  
       *Awkward commitment*: Prosthetic limbs/implanted tech (artificially designed, no selection history) lack content entirely.  
     - *If YES to Q2*:  
       3. **Can a system *without any history* (e.g., Swampman) misrepresent?**  
          - *If YES*: **Unnamed/rare view** (suggested by some "liberalised" teleosemantics).  
            *Awkward commitment*: Content relies partly on selection history, but Swampman has it—seemingly inconsistent.  
          - *If NO*: **Position: Informational Teleosemantics** (e.g., Fred Dretske).  
            *Awkward commitment*: Co-opted traits (e.g., feathers) systematically misrepresent their function.  

  **If NO to Q1 (selection history not essential)**:  
  4. **Can *artificial/short/supervised design history* (e.g., an AI trained to flag tumours; lab fruit flies evolved for 200 generations to avoid light) confer content?**  
     - *If NO*: **Position: Pure Selectionist Teleosemantics** (e.g., Karen Neander, David Papineau).  
       *Awkward commitment*: Short artificial histories (e.g., lab-evolved flies) lack content despite functional design.  
     - *If YES*: Go to Q5.  
  5. **For co-opted mechanisms, does content track the *derived function* (e.g., feathers representing flight) rather than the ancestral one?**  
     - *If NO*: **Position: Historical Role Accounts** (e.g., Karen Neander).  
       *Awkward commitment*: Co-opted traits (e.g., feathers used for flight) misrepresent when performing new functions.  
     - *If YES*: Go to Q6.  
  6. **Can systems *without any design history* (e.g., Swampman) misrepresent, not just fail to represent?**  
     - *If NO*: **Position: Design Teleosemantics** (e.g., David Buller).  
       *Awkward commitment*: Swampman’s states lack content, but his AI-trained duplicate might have it—arbitrary asymmetry.  
     - *If YES*: **Position: Optimal Conditions Teleosemantics** (e.g., Peter Godfrey-Smith).  
       *Awkward commitment*: Content depends on what *would* happen in ideal conditions, making misrepresentation ubiquitous (e.g., a healthy eye "misrepresents" in pitch darkness).  

  ---

  ### **Notes on Logical Space**  
  - **Unoccupied Combinations**:  
    - *Selection history essential (Q1 YES) + Derived function in co-option (Q2 YES) + No misrepresentation without history (Q3 NO)*. This is **unexplored but coherent**—no major theorist combines these, possibly because it weakens historicity.  
    - *Selection history not essential (Q1 NO) + No design history confers content (Q4 NO)*. This **collapses into Q1 YES views** and is redundant—marked as unattractive due to excluding AI/prosthetics.  
  - **Indistinguishable Leaves**:  
    - **Millikan-style (Q1 YES, Q2 NO) vs. Pure Selectionist (Q1 NO, Q4 NO)**. These *converge* outside edge cases: both deny content to AI/prosthetics and treat co-option identically. They only diverge on whether "design" without selection (e.g., lab evolution) counts—a narrow difference.  
    - **Optimal Conditions (Q6 YES) vs. Design Teleosemantics (Q6 NO)**. These are separable *only* in Swampman-like cases. In normal systems, "what would happen if things went right" and "design function" often align, making them empirically similar.  

  ### **Key Axes Addressed**  
  - **(i) Design history without selection**: Handled in Q4 and leaves (e.g., Buller says yes; Millikan/Papineau say no). Artificial/short/supervised histories are treated uniformly in the tree, but positions vary: Buller accepts all; Neander accepts some (lab evolution) but not AI.  
  - **(ii) Co-option**: Central to Q2/Q5. Tree forces a choice: content tracks ancestral (Millikan, Neander) or derived (Buller, Godfrey-Smith) function. Misrepresentation in reuse follows: if tracking ancestral, reused mechanisms misrepresent (e.g., feathers "falsely signal" flight).  
  - **Misrepresentation without history**: Explicit in Q3/Q6. Positions split: Millikan/Papineau say no (only "failure"); Godfrey-Smith/Buller say yes.  

  ---  
  **Word count**: 690. Designed for brevity and clarity—branches avoid jargon, using cases readers know or that are explained in-clause (e.g., "co-opted mechanism (e.g., feathers...)" in Q2/Q5).
