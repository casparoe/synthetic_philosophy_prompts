  Point 5 demands interventional evidence. Probes alone aren't enough; pushing activations and seeing behavior change is necessary. This ties representation to causal intervention.

  Point 6 defines content via tracking. Even if downstream layers don't use it, if a direction tracks a feature, it represents it. This separates representation from functional role.

  Point 7 uses the modular arithmetic case to argue some features aren directions. The circle example suggests geometric structures beyond vectors.

  Now, looking for tensions. The biggest one seems between Point 4 (geometry is all) and Point 7 (features can be non-directional). If the modular arithmetic forms a circle, that's a nonlinear manifold, clashing with the idea that directions are fundamental. Resolution might involve expanding the unit of representation to include subspaces or manifolds.

