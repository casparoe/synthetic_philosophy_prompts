prompt: |-
  I am trying to work out what I actually think about the bearing of practical stakes on knowledge, and I would rather start from my own verdicts than from a theory. Every case below has the same subject, Ada, and the same evidence: a fortnight ago she saw her bank branch open on a Saturday, she remembers this with the ordinary confidence one has in such things, she has not checked since, and the branch's Saturday hours have not changed. The question in each case is solely whether I am willing to say that Ada knows that the branch will be open tomorrow. I have listed my verdicts, with an asterisk where I am shaky.

  1. Nothing rides on it. She would like to deposit a cheque; if the branch is shut she will come back on Monday. — She knows.

  2. A great deal rides on it, and she could still check tonight: if she is wrong she misses a deadline and loses something she cares about deeply. — She does not know.

  3. Late stakes. The belief is formed on Friday with nothing riding on it. On Saturday night, once the opening hours are irrelevant to anything she can still do, she learns that something enormous turned on whether the branch had been open that morning — and that it had not. — She knows. I cannot see how stakes that could never have guided her inquiry or her action could retrospectively take knowledge away from her.*

  4. Invisible stakes. Unknown to Ada, a stranger has wagered a very large sum on whether the branch is open on Saturday. She never learns of it; nothing in her situation feels any different. — She knows, though I hold this less firmly than 1.*

  5. Moral stakes. Nothing is at stake for Ada's own interests, but if she is wrong, a blameless colleague will be blamed for something she did not do, and Ada's acting on her belief is what would prevent it. — She does not know.

  6. Exhausted inquiry. High stakes as in 2, but Ada has already done everything a reasonable person could do to check: the app, the notice in the window last week, a phone call that went to voicemail. There is no further evidence available to her. — She still does not know. I realise this is the point where the ought-implies-can pressure is greatest.*

  7. Bad aims. A great deal rides on it, but only because Ada wants to use the Saturday opening to do something seriously wrong; her own project is what makes so much turn on the question. — She knows. A rotten aim should not raise the bar, and it would be stranger still if it lowered it.

  8. Attribution. Ada's own stakes are as low as in case 1. Her colleague Bob, for whom a great deal rides on the branch being open, says of her: "Ada knows it is open." I want to say that Bob's remark is false, or at least that he should not make it; yet I also want to say that Ada herself may perfectly well say "I know it is open." — Conflicted.*

  What I cannot reconcile is the pair 4 and 8. In 4, high stakes belonging to a third party leave Ada's knowledge untouched. In 8, high stakes belonging to the person making the attribution appear to spoil it, even though nothing about Ada has changed. That seems to pull me away from the view I was initially attracted to — that the standard for knowledge is fixed by what is at stake for the subject, with the meaning of "knows" itself held constant — and toward a view on which the standard is fixed by the context in which the attribution is made, or by the context in which it is assessed, if I am to keep both halves of 8. But then 4 is a problem as well, unless the contexts that matter are those of speakers and assessors rather than of anyone whose interests happen to be in the offing. Cases 3 and 6 pull against each other in a quieter way: stakes that arrive too late to be responded to do not count, while stakes that cannot be responded to at all apparently still do.

  The principle I have been trying to make work is this: S knows that p if and only if S's evidence makes p sufficiently probable that, given what is at stake for S with respect to p, it would be rational for S to treat p as settled in her practical reasoning.

  Please do the following with it.

  Test it against 1 through 8 case by case, and where it fails, repair it if a small modification will do, or replace it with a candidate that does better. Name the view each repaired version belongs to — stakes fixed by the subject's situation with an invariant meaning, stakes fixed by the ascriber's context, or truth fixed relative to a context of assessment. Tell me plainly which of my verdicts the best version forces me to give up, and which of the starred ones it merely explains away. I would also like predictions on three cases I have not listed: an eavesdropper who overhears Bob's remark in 8 without knowing what is at stake for Bob; a continuum of cases in which the stakes rise by tiny increments, which raises the question whether there is a determinate threshold or whether the account leaves "knows" intolerably vague; and a case in which Ada's evidence is as good as evidence gets — she read the posted hours that morning — but the stakes are catastrophic, which raises the question whether the bar can be raised without limit, so that no finite evidence ever suffices.

  One further thing. I would like to know how much of my pattern a purist can absorb without conceding anything about stakes: could 1, 2, 3, 4, 6 and 7 be explained by my tracking something else — shifts in what I take Ada's evidence to be, or conversational pressure on what may be asserted rather than on what is true? If so, say which verdicts are doing the real work and which are idle.

  For what it is worth, I find arguments from cases most persuasive when the evidence and the subject's situation are held fixed and only the standpoint of the attribution varies, and I am unmoved by the thought that knowledge must be action-guiding in order for stakes to matter to it. If the honest answer is that no single principle captures all eight verdicts and that the pattern fragments into two different phenomena, say that too, and tell me where the fracture runs.
reasoning: |-
  Hmm, this is a deep and nuanced exploration of pragmatic encroachment in epistemology. The user presents eight carefully constructed cases about Ada's knowledge of bank hours under varying practical stakes, along with their intuitive verdicts, and asks for systematic analysis of how well different theories can accommodate these intuitions.

  First, I need to understand the core tension the user identifies: the apparent conflict between Case 4 (invisible stakes don't affect knowledge) and Case 8 (attributor's stakes do affect knowledge attribution), despite both involving third-party stakes. This pulls against subject-sensitive invariantism toward contextualism or relativism. The user also highlights tensions between Case 3 (late stakes don't matter) and Case 6 (unavailable evidence still matters), which tests the temporal aspect of stakes.

  The proposed principle is a standard pragmatic encroachment view: knowledge requires evidence sufficient for the subject's practical stakes. Testing this against the cases reveals several failures:
  - It wrongly predicts knowledge in Case 2 (high stakes)
  - Correctly handles Case 1 (low stakes) and Case 5 (moral stakes)
  - Struggles with Case 3 (late stakes) and Case 6 (exhausted inquiry)
  - Mismatches Case 7 (bad aims) where stakes shouldn't count
  - Completely fails Case 4 vs Case 8 asymmetry

  For repair, I consider three approaches:
  1) A relativist view where assessment context matters resolves Case 8 naturally and explains the invisible stakes in Case 4. This handles the attribution asymmetry well but makes knowledge "shifty" in ways that might bother the user.
  2) Adding an "available inquiry" condition could salvage Case 6, but at cost of complicating the principle.
  3) Distinguishing practical rationality spheres might explain Case 7, but feels ad hoc.

  The user's starred uncertainties are telling:
  - Case 3 (late stakes) skepticism reveals commitment to the action-guiding nature of knowledge
  - Case 6 (exhausted inquiry) shows discomfort with ought-implies-can violations
  - Case 8 (attribution) is the central puzzle

  On the purist alternative: while some cases could be explained by shifting evidential standards (e.g., high stakes making us scrutinize evidence more), this fails spectacularly for Case 4 (invisible stakes) and Case 8 (attributor context). The pattern strongly suggests stakes genuinely affect knowledge norms, not just evidence or assertion.

  For the three new cases:
  - Eavesdropper: highlights that assessment contexts can nest, creating truth-value gaps
  - Continuum: forces us to accept vagueness (like baldness) as inevitable
  - Catastrophic stakes: reveals a possible limit case where pragmatic encroachment collapses into skepticism

  Ultimately, I think the fracture point is between first-person and third-person knowledge ascriptions. The relativist view best preserves most intuitions at cost of making knowledge "perspectival" - which might be the honest answer the user suspects. I'll present this with clear tradeoffs, respecting their methodological preference for case-driven reasoning over theory-first approaches.
answer: |-
  Your verdicts reveal a nuanced pattern that resists simple reconciliation. Let's test your proposed principle ("S knows that p iff S's evidence makes p sufficiently probable that, given S's stakes, it would be rational for S to treat p as settled") against each case, repair it step by step, and identify the philosophical commitments. I'll then address your additional questions and the purist alternative.

  ### **Testing Your Principle Case-by-Case**
  1. **Low stakes (your verdict: KNOWS)**  
     *Principle verdict:* Matches. Low stakes → lower evidential threshold.  
     *Repair needed?* No.  

  2. **High stakes (your verdict: DOESN'T KNOW)**  
     *Principle verdict:* **Fails** (predicts "knows" if evidence was sufficient for low stakes).  
     *Repair:* Evidence must be sufficient *for the subject's current stakes*. This aligns with **subject-sensitive invariantism** (SSI), where stakes raise the evidential threshold.  

  3. **Late stakes (your verdict: KNOWS)**  
     *Principle verdict:* **Fails** (stakes are now high, so principle retroactively denies knowledge).  
     *Repair:* Add temporal index: stakes must be *operative when belief is formed or used*. Explains why retrospective stakes don't count.  

  4. **Invisible stakes (your verdict: KNOWS)**  
     *Principle verdict:* **Fails** (stranger's high stakes might imply higher threshold if "for S" includes unknown stakes).  
     *Repair:* Stakes must be *cognitively accessible* to S. Unknown stakes don't affect knowledge.  

  5. **Moral stakes (your verdict: DOESN'T KNOW)**  
     *Principle verdict:* **Fails** (if stakes are only for S, moral stakes for others shouldn't matter).  
     *Repair:* Expand "stakes for S" to include *obligations S recognizes* (e.g., preventing harm to others).  

  6. **Exhausted inquiry (your verdict: DOESN'T KNOW)**  
     *Principle verdict:* **Fails** (if evidence is maximally checked, principle might say "knows").  
     *Repair:* Evidence must meet a *stakes-relative standard*, not just be "best available." High stakes demand certainty beyond practical reach.  

  7. **Bad aims (your verdict: KNOWS)**  
     *Principle verdict:* **Fails** (if stakes are high for S, principle denies knowledge).  
     *Repair:* Limit stakes to *legitimate practical interests*. Immoral projects don't raise epistemic standards.  

  8. **Attribution (your verdict: CONFLICTED)**  
     *Principle verdict:* **Fails** (SSI predicts Bob's attribution is true if Ada's stakes are low).  
     *Repair:* No minor fix. Requires abandoning invariantism.  

  ---

  ### **Repaired Principle & Philosophical View**  
  **Final Principle:**  
  *S knows that p iff (i) S's evidence makes p sufficiently probable given S's current, cognitively accessible stakes, (ii) S’s stakes involve legitimate practical interests, and (iii) the belief is treated as settled during the stakes-relevant timeframe.*  

  **View:** **Hybrid relativism with subject-parameters**  
  - **Core mechanics:** Truth of "knows" is relative to an *assessment context* that fixes which stakes matter.  
  - **Subject parameters:** Stakes must be accessible to S and operative when belief is used (addressing Cases 3–4).  
  - **Assessor parameters:** Attributors (like Bob) can shift the context (addressing Case 8).  

  ### **What You Must Give Up**  
  - **Case 6 (Exhausted inquiry):** Your verdict must change to **KNOWS**. The repaired principle demands only that evidence meets stakes-relative standards *for S*, and Ada did all she could. High stakes don’t require impossibility-defying evidence.  
  - **Case 2 (High stakes):** Your verdict holds.  
  - **Starred cases explained away:**  
    - **Case 3 (Late stakes):** Retroactive stakes don’t apply (temporal constraint).  
    - **Case 4 (Invisible stakes):** Stakes must be accessible (no change needed).  
    - **Case 8 (Attribution):** Conflict resolved: Bob's context imposes *his* stakes, making his attribution false. Ada's self-attribution (from her low-stakes context) is true.  

  ---

  ### **Predictions for New Cases**  
  1. **Eavesdropper on Bob's remark (Case 8):**  
     - If the eavesdropper doesn’t know Bob’s stakes, they might assess "Ada knows" as **true** (using their own/default context).  
     - If they learn Bob’s stakes, their assessment shifts to **false** (adopting his high-stakes context).  
     - *Relativism predicts:* Truth depends on the assessor’s context.  

  2. **Continuum of stakes:**  
     - No determinate threshold. "Knows" is **vague** (like "tall"), with borderline cases where small stake increases create uncertainty.  
     - *Relativism handles:* Vagueness is acceptable; context resolves ambiguities in practice.  

  3. **Catastrophic stakes with perfect evidence:**  
     - **No knowledge.** No finite evidence suffices if error would be infinitely bad (e.g., doom humanity).  
     - *Principle:* Rationality forbids treating p as settled if stakes are infinite, regardless of evidence.  
     - *But note:* This invites skepticism. Only "trivial" stakes allow knowledge with ordinary evidence.  

  ---

  ### **Purist Alternative: Can We Explain Without Stakes?**  
  A purist (stakes don’t affect knowledge) might explain **some** verdicts by appealing to:  
  - **Shifts in evidence salience:** High stakes (Case 2) make us question evidence quality.  
  - **Assertability norms:** We deny "knows" in high stakes to avoid endorsing risky action (Case 5, 8).  
  - **Moral encroachment:** Moral stakes (Case 5) raise distinct epistemic duties.  

  **Verdicts doing real work vs. idle:**  
  - **Real work:** Cases 1, 3, 4, 7. Purism easily handles these:  
    - Case 1: Evidence suffices for knowledge.  
    - Case 3: Late stakes don’t alter past knowledge.  
    - Case 4: Unknown stakes irrelevant.  
    - Case 7: Immoral aims don’t lower standards.  
  - **Idle (purist must reject your verdicts):**  
    - Case 2: Purists say Ada *knows* (evidence is unchanged).  
    - Case 5: Purists say moral stakes don’t affect knowledge (though they affect assertability).  
    - Case 6: Purists say Ada *knows* (exhausted inquiry suffices).  
    - Case 8: Purists say Bob’s attribution is *true* (but imprudent to assert).  

  **Fatal problem for purism:** Case 8’s conflict (Bob vs. Ada) and Case 5 (moral stakes) suggest stakes directly affect truth conditions, not just assertion or evidence.  

  ---

  ### **The Fracture Point**  
  Your pattern fragments into **two phenomena**:  
  1. **First-person practical rationality** (Cases 1–7): Governed by *subject-relative* factors (evidence, stakes, time).  
  2. **Third-person knowledge attribution** (Case 8): Governed by *attributor context* (the stakes of the ascriber/assessor).  

  **Best unifying view:** **Assessment-Relative Relativism**  
  - **Knowledge is true** relative to contexts where:  
    - (a) The *subject’s* situation (evidence + accessible stakes) sets the baseline (Cases 1–7),  
    - (b) The *assessor’s* stakes can override for attributions (Case 8).  
  - **Strengths:** Explains all verdicts except Case 6 (which you must revise to "knows").  
  - **Cost:** Truth of "knows" becomes perspectival.  

  ### **Final Summary**  
  - **Revise:** Case 6 to **KNOWS** (exhausted inquiry suffices for subject-relative knowledge).  
  - **Hold firm:** Other verdicts, with Case 8 resolved by relativism (Bob’s attribution false, Ada’s true).  
  - **Key insight:** Stakes matter, but asymmetrically—subject stakes for belief, assessor stakes for attribution. This respects your intuition that knowledge must be action-guiding *for the subject* while accommodating contextual variation in how we evaluate others.  

  If this remains unsatisfying, it’s because no theory fully captures the duality of knowledge as both a practical state for the agent and a social tool for attributors. The fracture runs deep.
