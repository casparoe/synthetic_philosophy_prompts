  ### Decision Procedure for Literary Prize Jury Triage

  Below is a decision procedure designed for rapid evaluation of reader reports (10 minutes per book, including all reports). It prioritizes actionable outcomes (read whole/sample/set aside) and flags signing eligibility for the citation. The table is optimized for your constraints—180 books, 25 full reads, 40 samples—and incorporates your distinctions (claim types, calibration, asymmetry, decay, signing/believing split). 

  **Key Principles Embedded:**
  - **Asymmetry First:** Negative claims are prioritized for sampling.
  - **Calibration Matters:** Weight reports from readers you’ve calibrated.
  - **Decay Limits Trust:** Unfamiliar formats/languages reduce report reliability.
  - **Fit Claims Travel Farthest:** Tradition/innovation claims are most deferrable.
  - **Signing ≠ Believing:** You can recommend based on testimony without full experiential judgment.

  ---

  ### Procedure Table (Tape Above Desk)
  | Step | Question                                                                 | Sufficient Answer                                                                                                 | On No/Other                                                                                                 | Judgment Call? (Fact/Judgment + Who Signs Off)                                                                 | Typical Misfire                                                                                                |
  |------|--------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|
  | 1    | Is there a **specific, checkable negative claim**? (e.g., "Ch. 6 drags," "ending fumbles") | Yes: Claim points to a verifiable location/page range. No: Vague ("weak prose") or no negative claim.             | Proceed to Step 2.                                                                                          | **Fact** (claim concreteness is verifiable).<br>*You sign off*.                                               | Missing vague-but-valid negatives; over-indexing on minor flaws.                                              |
  | 2    | If YES to Step 1: Can you **sample-verify the claim** in ≤30 mins?       | Yes: Flaw is localized (e.g., one chapter). No: Flaw is diffuse (e.g., "overall pacing issues").                  | If **No**, treat claim as uncheckable → Proceed to Step 3. If **Yes**, mark for sampling → Skip to Step 5.  | **Judgment** (assessing verifiability).<br>*You sign off*.                                                    | Sampling impractical books (e.g., 900-page experimental); mistaking systemic flaws for local ones.          |
  | 3    | Are there **decay factors**? (e.g., unfamiliar language/form)           | Yes: Book’s format/language prevents personal experience equivalence. No: Within your experiential range.         | Proceed to Step 4.                                                                                          | **Judgment** (assessing distance).<br>*You sign off*.                                                         | Underestimating decay (e.g., verse novels); overestimating it for accessible translations.                    |
  | 4    | What **claim types** dominate the reports?                              | Dominant type:<br>- **Fit** (tradition/innovation): Deferrable.<br>- **Texture/What it’s like**: Risky to defer.<br>- **Verdict**: Requires calibration. | If mixed, use worst-case (e.g., texture > fit). Proceed to Step 5.                                          | **Judgment** (categorizing claims).<br>*You sign off*.                                                        | Misclassifying claims (e.g., calling "innovative" a fit claim when it’s a verdict).                         |
  | 5    | For **fit claims** OR **calibrated readers**: Can you defer?             | - **Fit claim + decay**: Defer if reader is calibrated.<br>- **Calibrated verdict**: Defer if reader’s past scores ±1 of yours on 3+ books.<br>- Else: Do not defer. | If **No**, mark for sampling/reading. If **Yes**, defer → Proceed to Step 6.                                | **Judgment** (calibration trust).<br>*You sign off*.                                                          | Over-trusting uncalibrated readers; under-trusting calibrated fit claims.                                   |
  | 6    | For **non-deferred books**: What is the **reader consensus**?            | - All reports agree: Set aside (negative) or read whole (positive).<br>- Mixed reports: Sample.<br>- No consensus: Sample. | Apply consensus outcome.                                                                                    | **Fact** (tallying reports).<br>*You sign off, chair approves shortlist*.                                     | Ignoring minority negatives; missing calibrated disagreements.                                              |
  | 7    | Can you **sign if you don’t read whole**? (Applies if book wins)         | **Yes**: Dominant fit claims OR deferred to calibrated reader.<br>**Qualified**: Sampled + no major flaws.<br>**No**: Relies on texture/verdict claims. | If **No**, flag for chair.                                                                                 | **Judgment** (signing entitlement).<br>*All jurors sign citation*.                                           | Signing for unread books with experiential claims; refusing to sign for deferrable fit claims.              |

  ---

  ### Case Verdicts Using Procedure
  **Case (a): 700-page debut**  
  *Reports: Two rapturous (prose), one negative (last third collapses)*  
  - **Claim Types**: [Texture, Verdict]  
  - **Step Reached**: Step 2 (checkable negative claim → sampling required).  
  - **Verdict**: Sample (verify last third).  
  - **Do I Read?**: Sample  
  - **Can I Sign?**: Qualified (if sampling confirms prose quality but not structure).  
  - **Confidence Type**: Deferring (to texture claims if sampling validates early pages).  
  - **Unwelcome**: No.  

  **Case (b): Translated novella**  
  *Reports: One ecstatic (calibrated reader, fit claims), no other reports*  
  - **Claim Types**: [Fit]  
  - **Step Reached**: Step 5 (fit claim + calibrated reader → defer).  
  - **Verdict**: Read whole (if capacity) OR defer without reading (if overloaded).  
  - **Do I Read?**: Not (if deferred)  
  - **Can I Sign?**: Yes (fit claims + calibration justify signing unread).  
  - **Confidence Type**: Deferring (to calibrated reader on tradition/innovation).  
  - **Unwelcome**: No.  

  **Case (c): Your favorite (60 pages read, adored)**  
  *Reports: All other readers lukewarm*  
  - **Claim Types**: [Verdict, What it’s like]  
  - **Step Reached**: Step 6 (no consensus → sample).  
  - **Verdict**: Sample (despite your partial read, reports trigger sampling rule).  
  - **Do I Read?**: Sample  
  - **Can I Sign?**: No (if sampling contradicts your experience; relies on experiential claims).  
  - **Confidence Type**: Judging (your experience) vs. Recommending (if signing against reports).  
  - **Unwelcome**: **Yes** (procedure overrides your adoration; may reject your favorite).  

  ---

  ### Residual Risks & Defaults
  | Situation                          | Why It Stalls                                                                 | What It Actually Turns On                                        | Default If Deadline Hits                                  |
  |------------------------------------|-------------------------------------------------------------------------------|------------------------------------------------------------------|-----------------------------------------------------------|
  | Conflicting calibrated reports     | Step 5 can’t resolve (e.g., 2 calibrated readers split).                     | Chair’s tiebreak; prioritization of claim types.                | Sample and let group decide.                              |
  | Your partial read vs. reports      | Procedure ignores your sampling; trusts reports first.                       | Your personal experience trumping testimony.                    | Read whole if you loved it; override reports.             |
  | "What it’s like" claims in decay   | Step 4 flags risk, but Step 7 forces signing decision.                       | Group consensus on citation wording (avoid experiential claims). | Sign only if citation emphasizes fit/tradition claims.   |
  | Capacity overload (sampling >40)   | Step 2/6 demand sampling, but slots exhausted.                               | Prioritizing books with checkable negatives or decay.           | Sample books with negative claims first; set aside rest. |

  ---

  ### Smuggled Assumptions (Defend If Challenged)
  1. **Asymmetry of Verification**: Negative claims are inherently more verifiable than positive ones (sampling suffices for flaws but not mastery).  
  2. **Fit Claims as Social Testimony**: Judgments about a work’s place in a tradition (e.g., "innovative immigrant novel") are deferrable; experiential judgments (e.g., "felt claustrophobic") are not.  
  3. **Calibration as Proxy for Direct Experience**: A reader’s past alignment with your taste justifies deferring, simulating "partial acquaintance."  
  4. **Signing as Public Recommendation**: You can endorse a book based on testimony without personal aesthetic judgment (violates the acquaintance principle).  

