  ### How to Use
  1. **Triage Phase**: Run Steps 1–6 per book (10 mins/book). Outputs `read whole`, `sample`, or `set aside`.  
  2. **Signing Phase**: Apply Step 7 only to shortlisted books.  
  3. **Edge Cases**: Use residual defaults when stuck.  
  4. **Unwelcome Outcomes**: Embrace them (e.g., Case C)—the procedure prioritizes scalable trust over personal taste.  

  This systematizes your epistemology: defer fit claims, verify negatives, and sign for innovation, not vibes. When another juror pushes back, defend the asymmetry ("Bad news travels better") and fit-claim deference ("Tradition is collective, not personal").
