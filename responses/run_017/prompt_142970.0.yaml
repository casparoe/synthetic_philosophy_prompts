  - D: No-defeater -> They might say "no" in Case 8 because of the flawed evidence (which is a defeater) and also in Case 9 because of the broken chain? But note: in Case 8, the defeater was defeated, so it's tricky.
  - E: Virtue view -> They say "yes" in Case 6 only if the agent used the reliable method appropriately? But in Case 6, the method was used in abnormal conditions. They might say "no" in Case 6 and "yes" in Tiebreaker 2 (if they choose (a)).
  - F: Reliabilism (normal conditions) -> They say "no" in Case 6 because the method was used in abnormal conditions. They might say "yes" in other cases where the process is reliable and conditions are normal.
  - G: Knowledge-first -> They might be more inclined to say "yes" in some cases because they don't break down into conditions. They take the case as a whole and might have a more abductive approach: does it look like knowledge? They might be more permissive.
  - H: Error theory -> They might deny the intuition that the subject doesn't know in the classic Gettier cases. So they might say "yes" in Cases 1,2,3, etc. Or they might deny that the subject has a justified belief in some cases.
