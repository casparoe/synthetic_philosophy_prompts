answer: |-
  ### **Post-Gettier Diagnostic Quiz: Satellite Monitoring Team**  
  *Setting: A night-shift team at "Orbital Watch," a satellite ground station tracking environmental threats (storms, landslides, etc.). The team includes 3 analysts and 2 engineers. Cases involve their beliefs about real-time data.*

  ---

  ### **Cases**  
  *(Verdict options: KNOWS / DOESN’T KNOW / DEPENDS [stakes or context])*  

  1. **False Tsunami Alert**  
     Analyst Ava sees a sensor flag "TSUNAMI" near Coast X. She believes a tsunami is forming. The sensor malfunctioned (no seismic activity), but *unrelatedly*, a landslide triggers a real tsunami at Coast X.  
     - KNOWS  
     - DOESN’T KNOW  
     - DEPENDS  

  2. **Backup Power Luck**  
     Engineer Ben checks Power Grid A’s status light (green = functional). Unbeknownst to him, the light is stuck green due to a bug. *However*, Backup Grid B (which he didn’t know existed) automatically activated when Grid A failed minutes prior. Grids are now stable.  
     - KNOWS  
     - DOESN’T KNOW  

  3. **Corrupted Landslide Warning**  
     Analyst Clara receives a transmission: "LANDSLIDE AT SECTOR 5." Cosmic interference flipped "NO LANDSLIDE" to "LANDSLIDE," but *at that exact moment*, a real landslide hit Sector 5.  
     - KNOWS  
     - DOESN’T KNOW  

  4. **Foolproof Sensor (Safe but Not Sensitive)**  
     The station uses Sensor X (99.99% accurate) for quakes. Today, it reads "NO QUAKE," and Dave believes no quake will occur. It’s correct. *But* Sensor X cannot detect "Type-Z" quakes (statistically near-impossible). If a Type-Z quake *were* coming, it would still read "NO QUAKE."  
     - KNOWS  
     - DOESN’T KNOW  

  5. **Fragile Flood Monitor (Sensitive but Not Safe)**  
     Emma monitors Flood Sensor Y. If floods occur, Y breaks and shows "ERROR." Today, Y is functional (no flood), so she believes no flood will occur. *But* in a nearby scenario (e.g., if humidity were 0.1% higher), Y would break *despite no flood*, making her wrongly believe a flood is coming.  
     - KNOWS  
     - DOESN’T KNOW  

  6. **Clouded Wildfire Data**  
     Wildfires are detectable via Satellite A (works best in clear skies) or Ground Sensors B (works in all weather). Heavy clouds today make Satellite A unreliable. Frank uses Satellite A, which reports "FIRE." He ignores Ground Sensors B, which *also* report "FIRE." A fire exists.  
     - KNOWS  
     - DOESN’T KNOW  

  7. **Meteor Fragment**  
     Gina reviews a report: "METEOR IN SECTOR 9." She believes *a meteor is in the region*. The report was a false echo (no meteor in Sector 9), but *a different meteor* is in Sector 10 (adjacent, same region).  
     - KNOWS  
     - DOESN’T KNOW  

  8. **Sabotage Scare**  
     Henry believes Server 4 is online (green status light). An alert then claims "SERVER 4 HACKED!" He verifies it’s a false alert. *Unbeknownst to him*, the status light was hacked earlier (shows green even when offline). Server 4 *is* online—the hack failed.  
     - KNOWS  
     - DOESN’T KNOW  

  9. **Repaired Radio Chain**  
     A field agent radios: "AVALANCHE IN VALLEY 7." Relay Station 1 mishears and sends "NO AVALANCHE" to Orbital Watch. Relay Station 2 (monitoring Valley 7) *corrects it* to "AVALANCHE" before forwarding. Ivy hears "AVALANCHE" and believes it.  
     - KNOWS  
     - DOESN’T KNOW  

  10. **Glitched Storm Reading**  
      Jack sees Turbulence Sensor Z spiking (indicating a tornado). He believes a tornado is forming. The spike was a glitch (no turbulence), but *coincidentally*, a tornado forms due to undetectable micro-pressure shifts.  
      - KNOWS  
      - DOESN’T KNOW  

