  ### **Tiebreakers**  
  11. **High-Stakes Ice Storm**  
      A sensor predicts a 1% chance of an ice storm (would cripple the station). In **low-stakes mode** (team is overstaffed), Kate believes no storm will occur. In **high-stakes mode** (skeleton crew, no backups), she believes no storm will occur. The sensor is 99% reliable, and no storm occurs.  
      *Verdict for low-stakes:* KNOWS / DOESN’T KNOW  
      *Verdict for high-stakes:* KNOWS / DOESN’T KNOW  

  12. **Expert Landslide Call**  
      Lisa (20-year veteran) interprets ambiguous soil data as "LANDSLIDE IMMINENT." Her skill makes her 90% accurate; less-experienced analysts would be 50%. A landslide occurs.  
      - KNOWS  
      - DOESN’T KNOW  

