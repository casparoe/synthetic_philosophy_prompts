  ### **Scoring Key & Position Mapping**  
  **How it works**: Each position implies a specific verdict pattern. Match responses to the closest fit. Mixed profiles use Tiebreakers 11–12 and critical cases (noted below).  

  #### **Position Leaves**  
  | Position                  | Core Principle                                                                 | Key Verdicts                                                                                                | Critical Cases |  
  |---------------------------|-------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|----------------|  
  | **Safety (A)**            | Belief must be true in all nearby possible worlds.                            | Case 4: KNOWS (safe), Case 5: DOESN’T KNOW (unsafe)                                                         | 4, 5           |  
  | **Sensitivity (B)**       | If the claim were false, the subject wouldn’t believe it.                     | Case 4: DOESN’T KNOW (insensitive), Case 5: KNOWS (sensitive)                                               | 4, 5           |  
  | **Anti-Luck (C)**         | Knowledge excludes significant epistemic luck, even if not modal.             | "NO" in all luck-based cases (1,2,3,7,9,10)                                                                | 3, 9           |  
  | **No-Defeater (D)**       | No undetected defeaters (evidence that would undermine justification).        | Case 8: DOESN’T KNOW (hidden light hack), Case 9: DOESN’T KNOW (broken chain)                               | 8              |  
  | **Virtue Credit (E)**     | Knowledge requires ability/credit; true belief from skill, not luck.          | Case 6: DOESN’T KNOW (no credit for ignoring Ground Sensors), Tiebreaker 12: KNOWS (credit for skill)       | 6, 12          |  
  | **Normal Reliabilism (F)**| Reliability matters only in normal conditions.                                | Case 6: DOESN’T KNOW (clouds make Satellite A unreliable), Case 2: KNOWS (backup fixed it; system reliable) | 6              |  
  | **Knowledge-First (G)**   | Knowledge is primitive; reject decomposing into conditions. Contextual abductions. | Often "YES" if no glaring flaw (e.g., Case 1: KNOWS, Case 8: KNOWS)                              | 1, 8           |  
  | **Error Theory (H)**      | Gettier cases aren’t JTB—deny intuition, justification, or belief formation. | "KNOWS" in most cases (e.g., Case 3: KNOWS, Case 10: KNOWS)                                                | 3, 10          |  
  | **Contextualism (I)**     | Stakes/attributor context shifts standards.                                   | Tiebreaker 11: KNOWS (low-stakes), DOESN’T KNOW (high-stakes)                                              | 11             |  

  #### **Empty Cells & Why**  
  - **Safety + Sensitivity "NO" in Case 4/5**: Incoherent—safety and sensitivity conflict here.  
  - **Virtue + "KNOWS" in Case 6**: Unattractive—ignoring a reliable alternative process undermines credit.  
  - **No-Defeater + "KNOWS" in Case 8**: Unexplored—defeaters are typically seen as decisive.  

  #### **Indistinguishable Positions**  
  - **Safety (A) vs. Anti-Luck (C)**: Both say "NO" in luck cases (e.g., 3). *Split with Case 9*: Safety accepts "repaired" luck (KNOWS), Anti-Luck rejects it (DOESN’T KNOW).  
  - **Knowledge-First (G) vs. Error Theory (H)**: Both often say "KNOWS." *Split with Case 10*: Error Theory always says KNOWS; Knowledge-First *may* say DOESN’T KNOW if abduction fails.  

  #### **For Mixed Profiles**  
  - **Most Discriminating Case**: Case 3 (Intervening Luck). Splits Safety/Sensitivity (NO) from Error Theory (YES).  
  - **Tiebreaker Design**: Add a case with *blameless misalignment* (e.g., "Subject uses reliable process, but a glitch makes evidence *look* misleading"). Splits Virtue (KNOWS) from Normal Reliabilism (DOESN’T KNOW).  

  ---  
  ### **Contested Case & Why**  
  **Case 8 (Sabotage Scare)** is genuinely contested:  
  - **"KNOWS" camp**: Henry defeated the *apparent* defeater (hack alert); the light hack is irrelevant since Server 4 *is* online.  
  - **"DOESN’T KNOW" camp**: The hacked light is an *undetected defeater*—his evidence is compromised regardless of truth.  
  - **Why contested**: Hinges on whether "defeaters" require subjective awareness or objective undermining.  

  ---

  ### **Structure of the Space**  
  #### **Dimensions & Answer Combinations**  
  1. **Luck Type**:  
     - *False Lemma* (Case 1: Ava’s sensor) → "NO" for all except Error Theory/Knowledge-First.  
     - *Environmental Luck* (Case 2: Ben’s backup grid) → "NO" for Anti-Luck/Virtue, "KNOWS" for Reliabilism.  
     - *Intervening Luck* (Case 3: Clara’s transmission) → "NO" for all except Error Theory.  

  2. **Modal Profiles**:  
     - *Safe/Insensitive* (Case 4) → Safety: KNOWS, Sensitivity: DOESN’T KNOW.  
     - *Unsafe/Sensitive* (Case 5) → Safety: DOESN’T KNOW, Sensitivity: KNOWS.  

  3. **Process/Environment**:  
     - *Reliable in abnormal env.* (Case 6) → Virtue/Reliabilism: DOESN’T KNOW.  

  4. **Content/Defeaters**:  
     - *Loose existential* (Case 7) → "NO" for all except Error Theory.  
     - *Misleading defeater* (Case 8) → No-Defeater: DOESN’T KNOW.  
     - *Repaired testimony* (Case 9) → Anti-Luck: DOESN’T KNOW, Safety: KNOWS.  

  5. **Evidence/Luck**:  
     - *Supported but lucky* (Case 10) → Anti-Luck/No-Defeater: DOESN’T KNOW.  

  #### **Settled vs. Contested**  
  - **Settled**: Gettier cases are *not* knowledge (only Error Theory disagrees).  
  - **Contested**:  
    - Whether "justified true belief" fails *only* due to luck (Anti-Luck) or also credit/defeaters (Virtue/No-Defeater).  
    - Whether "normal conditions" (Reliabilism) or "safety" (Modal) best captures anti-luck.  
    - Whether contextualism resolves disagreements (I) or obfuscates (G/H).  

  ---  
  **Instructions for use**:  
  1. Administer all 12 cases.  
  2. Tally verdicts.  
  3. Match to the closest position using the table.  
  4. For ties, prioritize critical cases (e.g., Case 3 for Safety vs. Error Theory).  
  5. Report position + rationale (e.g., "Safety: Your verdicts prioritize avoiding nearby error").
