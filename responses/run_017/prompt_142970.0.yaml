  We are building a quiz to sort people into different post-Gettier positions based on their verdicts on concrete cases. We have 12 cases (10 main and 2 tiebreakers) set in a single recurring setting to mask the structural features. The setting I choose is: **a night-shift team at a satellite ground station monitoring environmental data for natural disasters**. The team includes a mix of engineers and analysts, and the cases involve their beliefs about incoming data, system status, and potential events.

  ### Structural Features to Cover
  1. False lemma vs. environmental luck vs. intervening luck.
  2. Safe but not sensitive belief.
  3. Sensitive but not safe belief.
  4. Reliable process in abnormal environment, with an equally reliable but unused process available.
  5. Loose existential content that comes true by accident.
  6. Apparent defeater that is itself misleading.
  7. Testimonial chain with a false link repaired downstream.
  8. Belief that's true by luck though the evidence supports it.

  ### Leaves (Positions) to Distinguish
  We aim for at least these nine:
  A. Modal safety condition
  B. Sensitivity/tracking condition
  C. General anti-luck condition (not just safety or sensitivity)
  D. No-defeater/indefeasibility
  E. Ability/credit-based virtue view
  F. Reliabilism restricted to normal conditions
  G. Knowledge-first (treats knowledge as primitive, might use an abductive approach)
  H. Error theory (denies the intuition, or the justification, or the belief)
  I. Stakes- or attributor-sensitive contextualism

  We note that safety and general anti-luck might be hard to separate, and knowledge-first and error theory might overlap.

  ### The Cases
  We design 10 main cases and 2 tiebreakers, all set in the satellite ground station. Each case has 2-3 verdict options. We avoid famous examples and use the setting to mask the features.

  ---

  ### Case Descriptions

  #### Case 1: The False Positive Alert (False Lemma)
  *Setting:* The system flags a potential tsunami based on seismic data. Analyst Ava checks the data and sees it matches a known pattern. She believes a tsunami is forming. However, the pattern was caused by a malfunctioning sensor, but by coincidence, a real tsunami is indeed forming due to an unrelated undersea landslide.
  *Question:* Does Ava know that a tsunami is forming?
  - (a) Yes, because her belief is true and based on the data.
  - (b) No, because she used a false lemma (that the sensor data was reliable) to form her belief.

  *Structural Feature:* False lemma.

  #### Case 2: The Lucky Backup (Environmental Luck)
  *Setting:* Engineer Ben believes the main data feed is working because he sees the "active" light is on. Unbeknownst to him, the light is malfunctioning and would be on even if the feed were down. However, the feed is indeed working because the backup system, which he didn't know about, automatically took over when the main feed had a temporary glitch (now fixed).
  *Question:* Does Ben know that the data feed is working?
  - (a) Yes, because the feed is working and he formed his belief about it.
  - (b) No, because his belief was based on a malfunctioning indicator and he got lucky that the backup saved it.

  *Structural Feature:* Environmental luck.

  #### Case 3: The Interrupted Transmission (Intervening Luck)
  *Setting:* Analyst Clara receives a transmission from a satellite that says "Volcano Erupting" and forms the belief that Mount X has erupted. However, the transmission was garbled: it originally said "Volcano Stable" but cosmic interference flipped the bits. By sheer luck, at that exact moment, Mount X did erupt (so the message became true by accident).
  *Question:* Does Clara know that Mount X has erupted?
  - (a) Yes, because she received the message and it turned out true.
  - (b) No, because the truth of the belief was due to luck intervening between the fact and her belief.

  *Structural Feature:* Intervening luck.

  #### Case 4: Safe but Not Sensitive (Safety without Sensitivity)
  *Setting:* The system has a 99.9% accurate earthquake predictor. It predicts no earthquake today, and Dave believes there will be no earthquake. There is indeed no earthquake. However, if there were going to be an earthquake, the predictor would still say "no" because it fails to predict the very rare type of earthquake that would occur in that case (but today is not that case).
  *Question:* Does Dave know there will be no earthquake today?
  - (a) Yes, because the predictor is very reliable and he was right.
  - (b) No, because if there were an earthquake, he would still believe there wasn't (so his belief is not sensitive).

  *Structural Feature:* Safe (in the actual world, no nearby worlds where he believes falsely) but not sensitive (in the closest world where p is false, he still believes p).

  #### Case 5: Sensitive but Not Safe (Sensitivity without Safety)
  *Setting:* Emma is monitoring a flood sensor that is placed in a river. The sensor is very fragile and would break if a flood were coming, but it is working now. She sees it is working and believes there is no flood. Currently, there is no flood. However, in a very nearby world (almost identical), a flood is coming, the sensor breaks, and she believes there is no flood because the sensor is broken (and she doesn't check further). But in the actual world, no flood.
  *Question:* Does Emma know there is no flood?
  - (a) Yes, because her belief is true and the sensor is working.
  - (b) No, because her belief is not safe: in a very similar situation, she would be wrong.

  *Structural Feature:* Sensitive (if there were a flood, she wouldn't believe there isn't one) but not safe (there is a nearby world where she believes there is no flood but there is one).

  #### Case 6: Reliable Process in Abnormal Environment (with Unused Alternative)
  *Setting:* The station has two independent methods to detect forest fires: satellite imagery (Method A) and ground sensor heat data (Method B). Both are equally reliable in normal conditions. Today, there is a thick cloud cover, making Method A unreliable. Frank uses Method A and it indicates a fire, so he believes there's a fire. Method B, which he didn't use, also indicates a fire and is unaffected by clouds. There is indeed a fire.
  *Question:* Does Frank know there's a fire?
  - (a) Yes, because he used a reliable method and it was correct.
  - (b) No, because the method he used was operating in abnormal conditions (cloud cover) and he could have used the other method which was just as reliable and available.

  *Structural Feature:* Reliable process in abnormal environment, with an equally reliable but unused alternative.

  #### Case 7: The Loose Existential (Accidental Truth)
  *Setting:* The team is monitoring for any signs of meteor showers. Gina sees a report of a meteor in sector 5 and believes "there is a meteor in the area". Unbeknownst to her, the report was a false alarm (a bird). But by coincidence, there is a meteor in sector 6 (which is in the same area) that went undetected.
  *Question:* Does Gina know there is a meteor in the area?
  - (a) Yes, because there is a meteor in the area and she believed it.
  - (b) No, because the meteor she was referring to (in sector 5) doesn't exist, and she got lucky that there was one in sector 6.

  *Structural Feature:* Loose existential content that comes true by accident.

  #### Case 8: Misleading Defeater
  *Setting:* Henry believes the satellite is in orbit based on telemetry. Then he receives an alert that the satellite has been destroyed by debris. He checks and finds that the alert was a test (so he dismisses it). However, the telemetry he saw was actually a replay from yesterday (so it was misleading) and the satellite is indeed in orbit (but he doesn't know about the replay). He continues to believe the satellite is in orbit.
  *Question:* Does Henry know the satellite is in orbit?
  - (a) Yes, because he defeated the misleading defeater and the satellite is indeed in orbit.
  - (b) No, because his evidence (the telemetry) was not actually current.

  *Structural Feature:* Apparent defeater that is itself misleading.

  #### Case 9: Repaired Testimonial Chain
  *Setting:* A report from a field observer says: "I see a landslide at location L." The message is relayed via a chain: Observer -> Relay Station A -> Relay Station B -> Ground Station. Relay Station A misheard and sent "no landslide" to B, but Relay Station B had already independently detected the landslide and corrected the message to "landslide" before sending it to the Ground Station. Analyst Ivy at the Ground Station receives "landslide" and believes there is a landslide at L. There is indeed one.
  *Question:* Does Ivy know there is a landslide at L?
  - (a) Yes, because the message she received was correct and based on good evidence.
  - (b) No, because the chain had a false link and she didn't know it was corrected.

  *Structural Feature:* Testimonial chain with a false link repaired downstream.

  #### Case 10: Lucky Evidence (Supported by Evidence but True by Luck)
  *Setting:* Jack sees a series of readings that strongly indicate a tornado forming. He believes a tornado is forming. However, the readings were caused by a calibration error. But by coincidence, a tornado is indeed forming due to conditions that the instruments are not designed to detect (so the evidence was misleading but the belief turned out true).
  *Question:* Does Jack know that a tornado is forming?
  - (a) Yes, because his evidence supported the belief and it turned out true.
  - (b) No, because the truth of the belief was lucky and not connected to his evidence.

  *Structural Feature:* Belief that's true by luck though the evidence supports it.

  ### Tiebreaker Cases

  #### Tiebreaker 1: High Stakes vs. Low Stakes (Contextualism)
  *Setting:* The same situation: a sensor indicates a minor gas leak (not dangerous). In a low-stakes context (daytime, crew present), operator Kate believes there is a gas leak. In a high-stakes context (night, alone, and a spark could cause an explosion), she also believes there is a leak. The sensor is 99% reliable, but in this case, it is a false alarm (no leak). But we consider two scenarios: one where the stakes are low and one where they are high, and ask if she knows in each.
  *Question for low stakes:* In the low-stakes scenario, does Kate know there is a gas leak?
  - (a) Yes
  - (b) No

  *Question for high stakes:* In the high-stakes scenario, does Kate know there is a gas leak?
  - (a) Yes
  - (b) No

  *Structural Feature:* Contextualism: if one says (b) for high stakes and (a) for low stakes, that's contextualism.

  #### Tiebreaker 2: The Virtue Case (Credit)
  *Setting:* Lisa is a very experienced analyst. She uses a reliable method, but in this case, the data is ambiguous. She uses her skill to interpret it and forms a belief that a hurricane will turn north. It does turn north. However, if she had not been skilled, she would have interpreted the same data differently and been wrong. But her skill was the key.
  *Question:* Does Lisa know that the hurricane will turn north?
  - (a) Yes, because her skill led her to the true belief.
  - (b) No, because the data was ambiguous and she could easily have been wrong.

  *Structural Feature:* Ability/credit-based virtue view.

  ### Contested Case
  Case 8 (Misleading Defeater) is likely to be contested. Some might argue that Henry does know because he properly dismissed the defeater, and the fact that his evidence was flawed is not something he could have known. Others might say that the flawed evidence undermines his knowledge even though he defeated the apparent defeater. This case touches on what counts as a defeater and whether knowledge requires the evidence to be undefeated and also non-misleading in a way that isn't the subject's fault.

  ### Scoring Key
  We map the answers to the positions. Each position has a characteristic pattern of answers. We assign:

  - A: Safety (emphasizes safety) -> In Case 4: (a) [safe so knows] and Case 5: (b) [not safe so doesn't know]
  - B: Sensitivity -> Case 4: (b) [not sensitive so doesn't know] and Case 5: (a) [sensitive so knows]
