answer: |-
  Below is a decision tree for scalable oversight methods, designed for a mid-level engineer evaluating a concrete scenario. It starts from your premise ("We deploy systems with unverifiable outputs but need a trust story") and uses 12 branch nodes (10 core branch questions plus start/end) to route to 11 leaves. Branch questions are phrased as concrete, scenario-based queries—no alignment jargon. Answers should be based on your specific deployment context (e.g., your code-refactor or benefits-policy examples).

  **Key for branch nodes**:  
  - **Yes/No**: Answers to the question.  
  - **→ Node X**: Next node to visit.  
  - **→ Leaf Y**: Final method recommendation.  

  ### Decision Tree (Branch Nodes)  
  1. **Start**: Can we avoid the unverifiable task entirely (e.g., by restricting the system to only handle verifiable subtasks or simpler problems)?  
     - Yes → **Leaf A**  
     - No → **Node 2**  

  2. **Can we write a compact, machine-checkable spec for the task?** (e.g., a linter rule for code style, or a policy FAQ for benefits that maps to a database).  
     - Yes → **Node 3**  
     - No → **Node 4**  

  3. **Can we build a reliable automated verifier?** (e.g., a test suite for the refactored code, or a script that cross-checks benefits answers against a policy database).  
     - Yes → **Leaf B**  
     - No → **Node 4**  

  4. **Does the world give us ground truth for free eventually?** (e.g., code refactor causes bugs in weeks, or benefits answer is proven wrong when an employee complains).  
     - Yes, and we can wait → **Node 5**  
     - No, or too late to matter (e.g., security flaw is catastrophic) → **Node 6**  

  5. **Can we collect many samples and retrain?** (e.g., we run 100 refactors/month and can feed bug reports back into training).  
     - Yes → **Leaf C**  
     - No → **Leaf D**  

  6. **Is the bottleneck that the truth is too complex to explain quickly?** (e.g., the reviewer could verify with unlimited time/effort, but not in their 10-minute review window).  
     - Yes → **Node 7**  
     - No → **Node 8** (Bottleneck is reviewer’s fundamental inability or incentives)  

  7. **Can we break the task into smaller verifiable subtasks?** (e.g., split the refactor into atomic changes, each reviewable in isolation).  
     - Yes → **Leaf E**  
     - No → **Node 8**  

  8. **Can the reviewer compare two outputs and pick the better one?** (e.g., given two refactor proposals, they can spot which is cleaner, even if both are flawed).  
     - Yes → **Leaf F**  
     - No → **Node 9**  

  9. **Is the model incentivized to mislead?** (e.g., it “sandbags” to save compute, or gains from hidden errors).  
     - Yes → **Node 10**  
     - No → **Node 11** (Assume model is honest but reviewer is incapable)  

  10. **Can we create competition?** (e.g., two models propose independently, or one argues for/against the output).  
      - Yes → **Leaf G**  
      - No → **Leaf H**  

  11. **Can we occasionally get expensive expert review?** (e.g., pay a security engineer to audit 1% of refactors).  
      - Yes → **Leaf I**  
      - No → **Node 12**  

  12. **Can we peek inside the model?** (e.g., use interpretability tools to trace its reasoning).  
      - Yes → **Leaf J**  
      - No → **Leaf K**  

  ---

  ### Leaf Methods Table  
  | Leaf | Method Name                     | Awkward Commitment                                                                 | Cheapest Experiment                                                                 |
  |------|---------------------------------|------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | A    | Capability Restriction          | Sacrificing task coverage (e.g., model refuses hard problems, leaving value unused). | Prototype that blocks unverifiable tasks; measure performance drop on real workloads. |
  | B    | Formal-Spec-and-Verifier        | The spec must cover all edge cases (e.g., policy exceptions break your verifier).   | Build verifier for a toy task; see if it catches 10/10 known errors without false alarms. |
  | C    | Recursive Reward Modeling       | Delayed ground truth is reliable and frequent enough for training.                 | Simulate delayed rewards on historical data; check if model accuracy improves vs. no retraining. |
  | D    | Manage Risk (delayed)           | Errors cause real harm before detection; you’ll only fix them retroactively.       | Deploy in staging; measure how many errors slip through and how costly they are to fix later. |
  | E    | Iterated Amplification          | Decomposed subtasks must be truly easier to verify (e.g., atomic code changes are still too complex). | Have the model break down a task; measure if human verification of subtasks is faster/more accurate than whole-task review. |
  | F    | Comparative Oversight           | Reviewers can’t be gamed by equally plausible bad options (e.g., two wrong refactors look equally good). | Give reviewers 100 output pairs (some with known errors); measure if they pick the better one >75% of the time. |
  | G    | Debate/Market Mechanisms        | Truth is “more persuasive” than lies (e.g., deceptive models can’t out-argue honest ones). | Run debates on known questions; see if reviewers side with truth >80% of the time when both sides try hard. |
  | H    | Manage Risk (deception)         | You’ll detect deception too late; no way to prevent it upfront.                   | Red-team: have a model hide errors in 5% of outputs; measure if your monitoring catches them. |
  | I    | Weak-to-Strong Generalization   | Strong models can learn from weak signals without inheriting their blind spots.   | Train a model on “weak” labels (e.g., junior engineer reviews) and test on expert-verified holdout set. |
  | J    | Interpretability-Assisted       | Internal states are interpretable and reviewers can understand them (e.g., attention maps reveal lies). | Use tools to explain outputs on 50 tasks; see if reviewers spot errors from internals alone. |
  | K    | Scale RLHF and Hope             | Alignment generalizes beyond human ability (e.g., smarter models won’t exploit loopholes). | Test on tasks slightly beyond human skill; measure error rate growth as models get stronger. |

  ---

  ### Important Notes  
  - **Unseparated Leaves**:  
    - `Debate/Market (G)` and `Comparative Oversight (F)` blur if comparisons involve arguments (e.g., two models justifying their refactors). In practice, `F` is for passive ranking; `G` requires active competition.  
    - `Weak-to-Strong (I)` and `Iterated Amplification (E)` both use human feedback, but `E` requires decomposition while `I` uses direct supervision.  
  - **Combinations with No Good Method (Why)**:  
    - **No ground truth + model deceptive + no competition**: → `Leaf H` (unattractive; no oversight works if the model lies and you can’t contest it).  
    - **No spec + no decomposition + no comparisons**: → `Leaf K` or `H` (unexplored; few proposals address this "black box of ignorance").  
    - **Model knows but hides + no interpretability**: → `Leaf H` (incoherent; if you can’t see inside, you can’t force honesty).  
  - **"Manage Risk" Leaves (D, H)**: These are fallbacks when oversight fails. They focus on containment (e.g., rollbacks, audits) and assume no method guarantees trust.  

