  ### Analysis: Pluto Reclassification through Wittgensteinian Lenses

  **1. Mapping Family Resemblance**  
  The family-resemblance claim (Wittgenstein, *Philosophical Investigations*) is primarily **semantic and descriptive**: it holds that some concepts lack necessary-and-sufficient conditions, instead forming a network of overlapping features with no single shared essence. For "planet," candidate features include:  
  - **Genuinely overlapping features** (present variably across bodies):  
    - *Orbiting a star* (Sun for Solar System; not universal for exoplanets)  
    - *Roundness* (indicative of hydrostatic equilibrium)  
    - *Dynamical dominance* (clearing orbit; context-dependent)  
    - *Non-fusion* (distinguishes planets from stars)  
  - **Coextensive or historical features** (not core to modern concept):  
    - *Composition* (varies widely; e.g., gas giants vs. terrestrials)  
    - *Naked-eye visibility* (contingent on human observation)  
    - *Historical "wanderer" meaning* (covered Sun/Moon; obsolete)  

  Family resemblance explains why "planet" resists strict definition: bodies share subsets of features (e.g., Jupiter and Earth share roundness/orbiting Sun but differ in composition/dominance), without a universal essence. The dispute arises because different language games prioritize features differently.

  **2. Running the Theory: IAU's Action and Resistance**  
  - **What IAU should have done**: Wittgenstein advises clarifying the *purpose* of the definition. The IAU implicitly defined "planet" for **Solar System taxonomy** (a specific language game). They should have explicitly stated this contextual purpose ("planet* for dynamical classification"), avoiding the illusion of an absolute essence.  
  - **Public vs. Astronomer Resistance**:  
    - *Public resistance* stems from **family resemblance in lay language games**: Pluto shares salient features (roundness, Sun orbit, moons) with traditional planets. Demotion violated entrenched resemblances.  
    - *Astronomers' discomfort* reflects **multiple scientific language games**: Geologists prioritize *roundness* (geophysical integrity), while dynamicists prioritize *orbital clearing* (orbital mechanics). Family resemblance explains why no single criterion satisfies all.  

  **3. Pressing Problematic Features**  
  - **Vagueness of "Clearing the Neighborhood"**:  
    Replacing open-ended resemblance with a criterion of degree (clearing) merely relocates vagueness. Wittgenstein would note this is unavoidable—language games tolerate "fuzzy edges" (e.g., how much clearing suffices?). The definition’s utility depends on the game (e.g., dynamical modeling accepts thresholds).  
  - **Divergent Language Games**:  
    - *Solar System taxonomy* (IAU): Prioritizes orbital dynamics; "clearing" is functional.  
    - *Exoplanet catalogs*: Focuses on star-orbiting + roundness (dynamics often unobservable).  
    - *Comparative geophysics*: Values roundness as a proxy for complexity.  
    - *Schoolrooms*: Relies on memorized lists + cultural resonance.  
    **Effect on analysis**: Each game legitimizes different feature-weightings. Conflict arises when games intersect (e.g., IAU’s definition imposed a dynamical game on geophysical contexts).

  **4. Case vs. Theory: Confirmation and Limits**  
  This **confirms family resemblance** as a descriptive thesis: "planet" exhibits no essence, only crisscrossing similarities. However, it also reveals **limits**:  
  - Wittgenstein’s view is **not prescriptive** but *diagnostic*. He advises rejecting essence-demands as confused in *ordinary* language games. But in *scientific* games, stipulative definitions (like IAU’s) are pragmatic tools for specific goals. The episode shows science can legitimately *create* context-bound definitions, even if they contradict resemblance clusters elsewhere.  
  - **Anomaly?** No—Wittgenstein acknowledges specialized games needing precision. The confusion arose because the IAU’s definition spilled into non-dynamical games (e.g., education), where resemblance dominates.

  **Extension: Oort Cloud Object Dispute**  
  - **Nature of Disagreement**: A **boundary dispute** fueled by competing language games. Proponents (emphasizing roundness + cleared orbit) use a *geophysical/dynamical* game. Opponents (citing tradition, location, or formation) invoke *taxonomic* or *cultural* games.  
  - **Family Resemblance’s Role**:  
    - **Dissolves** the idea of a "correct" answer: The object shares features with both planets (roundness, clearing) and non-planets (Oort Cloud origin, icy composition).  
    - **Settles nothing** but explains the impasse: Without a shared game, resolution requires *negotiating which game takes precedence* (e.g., "Should Oort Cloud bodies be classified separately?").  
    Wittgenstein’s insight: Meaning emerges from use. If the field consistently excludes it, "planet" in *astronomical taxonomy* excludes Oort bodies—but poets or educators might still call it one.

  ---

  ### Summary (98 words)
  Family resemblance explains "planet" as a web of features (roundness, orbit, dynamics) without essence. The IAU legitimately defined it for dynamical taxonomy but ignored other language games (geophysics, education), causing discord. Vagueness in "clearing" and divergent games confirm Wittgenstein’s view: concepts are tool-like, not essence-bound. The Oort Cloud case shows disputes arise when games conflict; resemblance dissolves the illusion of a singular truth but doesn’t resolve practice-based disagreements. Science can stipulate definitions pragmatically—yet must own their contextual limits. Wittgenstein’s theory survives, not as a solver, but as a clarifier of conceptual friction.
