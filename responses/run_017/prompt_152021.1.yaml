prompt: |-
  I'm part of this dumb online study group were we design model constitutions for fictional countries, and one of the other members, Priya, is completely obsessed with sortition and getting rid of career politicians. She's not an academic or anything, just really online about it, but she has firm verdicts on everything we float. Her verdicts so far: a randomly selected upper chamber serving one non-renewable five-year term, with full pay and real legislative power — yes, obviously; an elected lower house with a two-term limit — no, she called it a 'career ladder'; a lottery-picked advisory assembly that's unpaid and only meets for a year — no, just 'sortition theater' with no teeth; an appointed commission of experts with ten-year terms that can be renewed once — no, unelected and careerist; a randomly selected budget office with a single three-year term, a proper professional salary, and binding power over some spending — yes; and a sortition constitutional convention where members could be picked again after sitting out six years — no, because that would create 'professional sortition veterans'.

  Now the group just put forward a new proposal and I want to guess what Priya will say before she logs on. The new one is for a unicameral city council that is *elected* — ranked-choice or whatever, the voting system doesn't matter — but with a strict single non-renewable six-year term, a salary set at the level of a mid-level civil servant, full authority to pass laws, and an extra rule that nobody who has ever held public office before is allowed to run, so in principle you literally cannot have a career politican. It's well paid, it has real power, and nobody can serve twice, but the members are elected rather than chosen by lottery.

  I'm less interested in whether this is a good idea than in reverse-engineering Priya's rule. On one hand, everything she says suggests the real evil is reelection and a permanent political class, in which case she should love this: no reelection, no ex-officeholders, decent pay, real power. On the other hand, she might think the problem with elections isn't just careerism but that elections as such select for ambition, wealth, and unrepresentative people, so only actual sortition bodies are legitimate, meaning she'd hate this no matter how airtight the term limit is. Can you lay out the different rules that fit her existing verdicts equally well — the anti-careerism-plus-real-power rule, the sortition-purism rule, or anything else you can think of — say what each rule would predict about this elected single-term council, give your best guess at which one she's really running and why, and tell me what further case would tease the two rules apart (e.g., would it help to ask her about an elected body with a single term but no ban on former officeholders, or a sortition body that is advisory but well paid, or something else entirely)?
reasoning: |-
  Okay, let me try to figure out what Priya's underlying rule might be. She's clearly passionate about sortition and against career politicians. I need to look at her past verdicts to find a pattern.

  First, she approved of a randomly selected upper chamber with a one-term limit, real power, and full pay. Then she rejected an elected lower house with term limits, calling it a career ladder. She also dismissed an unpaid advisory assembly as "sortition theater," and an appointed commission of experts as unelected and careerist. She liked a sortition budget office with binding power but rejected a sortition convention allowing reappointment after a break because it could create "professional sortition veterans."

  Now the new proposal is an elected unicameral council with a single non-renewable term, decent pay, real power, and a ban on former officeholders. The key question is whether Priya opposes only careerism or if she insists on sortition as the only legitimate method.

  Looking at her rejections: The elected lower house had term limits but she still said no, calling it a career ladder. That suggests she might see elections themselves as problematic, not just the potential for careerism. The "sortition theater" rejection shows she values real power, not just the method. The expert commission was appointed, not elected or sortition, and she called it careerist. The constitutional convention rejection because of possible "veterans" indicates she's against any system that might allow people to build a career, even with breaks.

  So possible rules: Anti-careerism + real power would require no reelection, no prior office, adequate pay, and actual authority. Sortition-purism would demand random selection regardless of other features. 

  Under anti-careerism, this new council should be acceptable: no reelection, no prior officeholders, decent pay, real power. But under sortition-purism, she'd reject it because it's elected, even with those safeguards. 

  Her rejection of the elected lower house with term limits hints that she might lean towards sortition-purism. She called it a "career ladder," which might imply she thinks elections inherently attract ambitious people who see politics as a career step, even with term limits. 

  A test case to distinguish: What if there's an elected body with a single term but no ban on former officeholders? If she rejects it, she's against careerism more strictly. If she accepts a sortition body that's advisory but well-paid? She rejected the unpaid advisory one as theater, but if it's paid, maybe? But she might still reject it for lacking power. 

  My guess is Priya is a sortition-purist. Her focus on "sortition theater" and rejection of any elected body suggests that for her, legitimacy comes from random selection, not just preventing careerism. The "professional sortition veterans" comment shows she's wary of any repeat involvement, but the fundamental issue seems to be the method of selection.
answer: |-
  Based on Priya's pattern of verdicts, we can identify two distinct but overlapping principles that explain her judgments. Let's break down the competing rules, predict her response to the new proposal, determine which rule she's likely following, and design a test case to confirm.

  ---

  ### **Rule 1: Anti-Careerism + Real Power (The "No Permanent Political Class" Rule)**
  - **Core Belief**: The primary evil is *reelection, careerism, and professional politicians*. Bodies must have **real power**, **adequate pay**, and **no path to career advancement**.
  - **Fits Existing Verdicts**:
    - ✅ **Random upper chamber**: Non-renewable term, pay, real power → *No careerism*.
    - ❌ **Elected lower house**: Term limits exist, but elections enable "career ladder" mentality → *Still careerist*.
    - ❌ **Unpaid advisory assembly**: Sortition but no power → "Theater" (useless without teeth).
    - ❌ **Appointed experts**: Long renewable terms → "Careerist."
    - ✅ **Sortition budget office**: Single term, pay, binding power → *No careerism + power*.
    - ❌ **Sortition convention (reappointment possible)**: Risk of "professional veterans" → *Careerism risk*.
  - **Prediction for Elected Single-Term Council**: **✅ YES**.  
    *Why?* It bans ex-officeholders, has no reelection, pays decently, and wields real power. Careerism is structurally impossible.

  ---

  ### **Rule 2: Sortition Purism (The "Only Random Selection is Legitimate" Rule)**
  - **Core Belief**: **Elections are inherently corrupting** because they select for ambition, charisma, wealth, and unrepresentative elites. Only sortition produces a *truly representative* body. Term limits/pay are secondary.
  - **Fits Existing Verdicts**:
    - ✅ **Random upper chamber**: Sortition + power → *Legitimate*.
    - ❌ **Elected lower house**: Elections → *Illegitimate regardless of term limits*.
    - ❌ **Unpaid advisory assembly**: Sortition but powerless → "Theater" (not *real* sortition governance).
    - ❌ **Appointed experts**: Not sortition → *Illegitimate*.
    - ✅ **Sortition budget office**: Sortition + power → *Legitimate*.
    - ❌ **Sortition convention (reappointment)**: Sortition but reusable pool → "Veterans" undermine randomness.
  - **Prediction for Elected Single-Term Council**: **❌ NO**.  
    *Why?* Elections inherently create a self-selected elite. The ban on ex-officeholders doesn’t fix elections’ core flaw: they attract ambitious "campaigner types" and exclude ordinary people.

  ---

  ### **Which Rule is Priya Following?**
  **Best Guess: Sortition Purism (Rule 2)**.  
  *Why?*  
  - Her rejection of the **elected lower house** (calling it a "career ladder") despite term limits suggests she views *elections themselves* as flawed, not just careerism.  
  - She approved **sortition bodies with power** but rejected **all non-sortition bodies** (elected *or* appointed), even with anti-careerism features.  
  - Her "sortition theater" critique shows she values *method* (sortition) as much as *power*.  
  - The "professional sortition veterans" veto reveals she prioritizes *rotational purity* over practical experience—a purist stance.

  **Predicted Verdict for the Elected Council**: ❌ **"No, it’s still elected—ambitious people will game the system, and it won’t represent ordinary citizens."**

  ---

  ### **Test Case to Tease the Rules Apart**
  Propose this hypothetical:  
  > **"A *sortition-selected* city council with binding power, full professional salary, and a *single non-renewable 4-year term*—but members *can have prior public office experience* (e.g., former school board members, NGO staff)."**

  - **Anti-Careerism Rule (Rule 1) Prediction**: ❌ **NO**.  
    *Why?* Prior officeholders = "careerist infiltration." The goal is to exclude *all* political professionals.  
  - **Sortition Purism Rule (Rule 2) Prediction**: ✅ **YES**.  
    *Why?* Sortition ensures representativeness. Prior experience is irrelevant; randomness neutralizes careerism.  

  **How Priya Would Likely Respond**: ✅ **YES** (if she’s a purist). She’d argue: *"Random selection prevents a permanent class, even if some members have experience. It’s still the people’s jury."* This would confirm Rule 2.

  ---

  ### **Why the "Anti-Careerism" Rule is Less Likely**
  - She rejected the **appointed commission** despite long terms and expertise, calling it "unelected and careerist." If she only opposed careerism, she might accept appointed non-renewable experts—but she didn’t.  
  - She dismissed the **elected lower house** *immediately* without engaging on term limits, implying elections themselves are disqualifying.  
  - Her language ("sortition theater," "professional veterans") fixates on *methodological purity*, not just outcomes.

  ### **Final Prediction for Priya**
  She’ll reject the elected council, declaring:  
  > **"This is just a one-term aristocracy! Elections favor narcissists and grifters who crave status. Only sortition gives us a *real* voice. Next!"**

  Then she’ll link you to 3 blog posts about Athenian democracy. Brace yourself.
