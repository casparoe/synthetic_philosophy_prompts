  The user's negative claim is that agency isn't inherent in weights alone but emerges from the "model-in-a-frame" (weights + prompt, tuning, memory, interface, deployer). The positive claim frames provide a standpoint for text production rather than a character to simulate. They want eight objections ranked by potential damage, with concise replies and weaknesses noted.

