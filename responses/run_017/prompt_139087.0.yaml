answer: |-
  Here is a structured set of desiderata for an adequate theory of individual contribution to collective harm, designed around your cases and constraints. Desiderata are labeled for section headings, explained with their rationale and linked to cases, and categorized by purpose (Guidance (G) and/or Assessment (A)). Biases and conflicts are identified at the end.

  ### Desiderata
  1.  **Actionability Under Epistemic Limits (G)**
      *   **Requirement:** The theory must provide clear, usable guidance to an agent *at the point of decision* with the knowledge realistically available to them (e.g., shelf counter status, app functionality, general knowledge of the system). It cannot demand impossible calculations (e.g., precise probability estimates without data) or knowledge of remote causal chains.
      *   **Case:** The Wednesday shopper (broken app, random reset, 1/60 chance) must have a basis for decision *without* being able to calculate the exact probability. The agent knows the *structure* (their act *might* trigger reorder) but not the precise odds.

  2.  **Causal Fidelity Without Over-Dependence (G/A)**
      *   **Requirement:** The theory must acknowledge the *actual causal structure* revealed by the case (thresholds, probabilities, necessity/sufficiency, overdetermination) without making permissibility *solely* contingent on making an *actual causal difference to the final outcome*. It must explain why contributing to an intermediate state (like moving the counter) can matter even if it doesn't *alone* cause the harm.
      *   **Case:** Must distinguish the Monday shopper (actual difference), Tuesday shopper (no marginal difference), and Button-Press variant (necessary but insufficient contribution). Must say *why* moving the counter from 34 to 33 matters (or doesn't) beyond just final causation.

  3.  **Robustness to Substitution (G/A)**
      *   **Requirement:** The theory must address whether an individual's obligation or blameworthiness is negated by the fact that if *they* refrain, *someone else* would likely perform a functionally equivalent act (e.g., buying the chicken, pressing the button, emitting the carbon). It must explain why or why not substitution matters.
      *   **Case:** The shopper who knows "if I don't buy it now, the next person will, and the crate is ordered by Saturday either way." Does this eliminate the reason against buying?

  4.  **Grain Sensitivity (G/A)**
      *   **Requirement:** The theory must provide a non-arbitrary way to individuate acts and agents. It must explain how the "grain" of description (one purchase vs. weekly purchases vs. household consumption vs. buyers' club) affects the assessment of difference-making, obligation, or blame, and justify its chosen level of analysis.
      *   **Case:** Does buying *one pack* differ morally from being part of a *household* that buys 4 packs/week, or a *buyers' club* ordering 60 packs? Does the theory's verdict change based on how we "bundle" the act/agent? If so, why is that bundling justified?

  5.  **Non-Collapse of Normative Categories (A)**
      *   **Requirement:** The theory must clearly distinguish and account for:
          *   **Causation:** Did the act make a difference (actual or probabilistic) to any relevant state (counter, outcome)?
          *   **Wrongness:** Was the act impermissible?
          *   **Culpability:** Was the agent at fault (e.g., blameworthy, negligent)?
          *   **Obligation/Rectification:** What is owed (e.g., apology, compensation, future restraint)?
      *   **Case:** The Tuesday shopper might not cause harm (Wrongness?) but might still be blameworthy if they know the system and buy anyway (Culpability?). The Wednesday shopper might cause nothing (Causation?) but act recklessly (Culpability?).

  6.  **Generalization Resilience (G/A)**
      *   **Requirement:** The theory must pass the generalization test: if the reason/excuse offered for *one* agent justifies their act, it must justify the *same* act for *every* relevantly similar agent. Further, it must be consistent when applied to the *same* agent over repeated instances (e.g., 40 years of shopping). Accepting the excuse must not lead to collective absurdity or undermine the collective goal.
      *   **Case:** If "my purchase makes no difference" excuses the Tuesday shopper, it excuses *every* shopper when the counter is >1, leading to no chicken being sold and (paradoxically) no harm caused – but only if *everyone* acts on the excuse. The theory must handle this tension.

  7.  **Epistemic Responsibility Integration (G/A)**
      *   **Requirement:** The theory must specify how an agent's knowledge (or culpable ignorance) affects obligation and blame. Crucially, it must avoid both letting agents profit from strategic ignorance *and* imposing unreasonable demands for omniscience. It must link the "actionability" desideratum to culpability.
      *   **Case:** The Wednesday shopper with the broken app – does their *inability* to know the exact chance absolve them? Does the *availability* of the app on other days heighten their obligation to use it? Is ignorance of systemic harms (like climate change) culpable?

  8.  **Domain Uniformity Principle (G/A)**
      *   **Requirement:** The theory must apply the *same core principles* to structurally analogous collective harm problems (e.g., consumer choices, individual emissions, voting). Any differences in verdicts must be traceable to *demonstrable structural differences* in the cases (e.g., probability of decisiveness, substitution likelihood, nature of the harm) rather than ad hoc adjustments.
      *   **Case:** Why might buying the chicken on Tuesday be permissible but emitting CO2 (which seems analogous to the Tuesday case) be impermissible? The theory must justify divergence based on objective features, not just intuitive discomfort.

  ### Identifying Biases & Conflicts
  *   **Genuine Desiderata:** 1 (Actionability), 2 (Causal Fidelity), 3 (Substitution), 4 (Grain), 5 (Non-Collapse), 6 (Generalization), 7 (Epistemic Responsibility), 8 (Domain Uniformity). These address core conceptual and practical challenges inherent in the cases.
  *   **Potential Theoretical Biases:**
      *   **"No Expected Utility" Bias:** A demand that expected difference (probability * magnitude) play *no* role is likely a bias, potentially conflicting with 1 (Actionability) and 7 (Epistemic Responsibility) in probabilistic cases (Wednesday).
      *   **"Wrongness Tracks Actual Difference" Bias:** Insisting that an act can only be *wrong* if it *actually* makes a difference to the final outcome is a strong bias, conflicting with 2 (Causal Fidelity) in overdetermined cases (Tuesday) and potentially 6 (Generalization). This often reflects an underlying commitment to "difference-making" as the sole source of obligation.
      *   **"Common Sense Fidelity" Bias:** Demanding the theory never exceed common sense intuitions risks conservatism and may prevent resolving the deep puzzles inherent in collective harm (like Tuesday/Generalization). Common sense is often conflicted here.

  *   **Key Conflicts Between Desiderata:**
      1.  **Causal Fidelity (2) vs. Actionability (1):** Faithfully representing complex causal structures (thresholds, probabilities, overdetermination) can make guidance impossibly complex for agents with limited knowledge (Wednesday shopper, general voter/consumer). A theory strong on 2 might fail 1, while a theory strong on 1 (simple rules) might distort 2.
      2.  **Anti-Ignorance (7) vs. Anti-Fanaticism (Implied by 1 & 7):** Refusing to let agents profit from ignorance (7) pushes towards demanding high levels of investigation and precaution, potentially making the theory "fanatical" about trivial acts (e.g., agonizing over every purchase). But refusing fanaticism risks excusing widespread culpable ignorance. Balancing epistemic responsibility with feasibility is crucial.
      3.  **Domain Uniformity (8) vs. Threshold Sensitivity (2):** Applying the *exact same* rule (e.g., "only acts making an actual difference are wrong") across domains might work for the *known, high-stakes threshold* (Monday chicken) but yields deeply counterintuitive results in structurally similar *overdetermined* cases (Tuesday chicken, emissions, voting). Insisting on uniformity might force collapsing the crucial distinction revealed by 2, while honoring 2 might challenge 8 unless structural differences are convincingly argued (e.g., emissions thresholds are unknowable and probabilistic, unlike the Monday chicken counter).
      4.  **Generalization (6) vs. Causal Fidelity (2) & Substitution (3):** Generalization exposes that accepting "no difference, no wrong" for each individual (honoring 2 & 3 in overdetermination) leads to collective inaction and no harm (a perverse "solution"). But rejecting "no difference, no wrong" for individuals seems to violate fidelity to the causal facts (2) and the reality of substitution (3). Resolving this tension is the core philosophical challenge.

  *   **Most Exclusionary Requirement:** **Generalization Resilience (6)**. This requirement forces the theory to confront the fundamental tension between the individual perspective ("I make no difference / someone else would do it") and the collective perspective ("If everyone thinks/acts like that, the harm occurs unabated"). Theories that rely *solely* on actual difference-making (a common approach trying to satisfy 2 and 3) fail 6 spectacularly. Theories that ignore substitution (3) struggle with 6 applied to single acts. Theories focused only on immediate action-guidance (1) might dodge the collective implication that 6 forces into view. Satisfying 6 requires a theory to bridge the individual and collective levels in a non-collapsible way, which most simplistic accounts cannot do.

  ### Brief Theory Family Scorecard Against Key Desiderata
  *   **Expected Difference (Probability * Magnitude):**
      *   *Strengths:* Directly addresses **Actionability (1)** under uncertainty (Wednesday) and **Causal Fidelity (2)** for probabilities. Can handle **Epistemic Responsibility (7)** by incorporating knowledge of risks.
      *   *Weaknesses:* Struggles massively with **Generalization (6)** (expected difference of *each* act in overdetermination is near-zero) and **Substitution (3)** (if others will act, my expected difference plummets). May struggle with **Grain (4)** (how to bundle acts?) and **Non-Collapse (5)** (low expected difference doesn't intuitively map to permissibility). **Domain Uniformity (8)** might force counterintuitive results (e.g., very low expected harm permits acts).

  *   **Complicity/Participation (Being part of a wrongful group action/harm):**
      *   *Strengths:* Directly addresses **Causal Fidelity (2)** without needing actual difference (Tuesday, Button-Press), handles **Substitution (3)** (participation wrong even if others would), satisfies **Generalization (6)** (all participants share status), strong on **Domain Uniformity (8)**.
      *   *Weaknesses:* Can struggle with **Actionability (1)** and **Epistemic Responsibility (7)** (How do I *know* if I'm participating in harm? What knowledge triggers complicity?). Can blur **Non-Collapse (5)** (participation might imply wrongness but not necessarily equivalent culpability or specific causation). **Grain (4)** is crucial (what defines the "group" or "harm" I'm complicit in?).

  *   **Character/Self-Corruption (Act corrupts the agent or manifests vice):**
      *   *Strengths:* Easily satisfies **Generalization (6)** (each act corrupts), handles **Substitution (3)** (my corruption matters regardless of others), can be **Actionable (1)** (avoid vice), addresses **Grain (4)** via character development. Can explain **Non-Collapse (5)** (wrongness/culpability linked to character).
      *   *Weaknesses:* Weak on **Causal Fidelity (2)** and **Domain Uniformity (8)** – wrongness is disconnected from the causal structure/harm itself (e.g., buying on Tuesday corrupts just like Monday? Is emitting CO2 corrupting *per se*?). May seem unconnected to the core problem of *collective harm*. **Epistemic Responsibility (7)** might focus only on knowledge of vice, not systemic harm.

  *   **Collective Duty Distribution (Duty falls on group, distributed to members):**
      *   *Strengths:* Directly addresses **Generalization (6)** (duty exists collectively, individuals have fair shares), strong on **Domain Uniformity (8)** (same principle for different harms). Can handle **Grain (4)** (duties assigned to collective agents like households/clubs).
      *   *Weaknesses:* Major challenges with **Actionability (1)**, **Epistemic Responsibility (7)**, and **Causal Fidelity (2)**: How is the collective duty defined? How is an individual's fair share calculated (especially without thresholds)? What knowledge is needed? What if the collective doesn't act? Struggles with **Substitution (3)** (if others shirk, does my share increase?). May struggle with **Non-Collapse (5)** (failing one's share might be wrong, but is it *causal*?).

  *   **Contribution Without Difference (Enabling, sustaining harmful structures):**
      *   *Strengths:* Addresses **Causal Fidelity (2)** meaningfully (contributing to counter, enabling system) without needing final difference. Handles **Tuesday/Button-Press** cases well. Potential for **Domain Uniformity (8)**. Can satisfy **Generalization (6)** (all contributions sustain).
      *   *Weaknesses:* Needs careful definition to avoid trivializing **Actionability (1)** (is *any* contribution impermissible?). Challenging **Epistemic Responsibility (7)** (How much knowledge of the harmful structure is needed?). Needs to specify **Grain (4)** (what counts as a relevant contribution?). Can blur **Non-Collapse (5)** (is sustaining always wrong? culpable?). Can struggle with **Substitution (3)** if the structure is so robust that my contribution is truly insignificant.
