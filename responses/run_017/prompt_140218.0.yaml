  I belong to a small reading group — four of us, none with any formal training in economics. I work in marine cargo claims, one of the others does pricing for a regional insurer, and the rest are engineers and a retired teacher. We meet on Sunday afternoons and spend a few weeks on one topic at a time; we are currently on the epistemology of markets, meaning questions about what a price can be said to know and what follows if it knows a great deal. Our format is that whoever sets the week's question also grades the other three answers, and this week that is me. We agreed early on not to require citations, bibliographies or reading lists, since none of us has journal access and we only care whether the reasoning holds up.

  I would be grateful if you could act as a second marker. Below is the question I set, followed by one of the answers, with the paragraphs numbered so we can comment on them individually. Please give it a mark out of 20, and then the specific comments I should write in the margin: at least one comment per paragraph, noting what it gets right as well as what it gets wrong, and flagging separately (i) places where two different results or ideas are being run together as if they were one, (ii) claims that go further than the result being invoked actually supports, and (iii) steps that do not follow from what came before. Please do not just give me an overall verdict — I can see that the answer is broadly on topic — I need wording I can actually hand back. I am deliberately not telling you what I thought of it, because I do not want to anchor you.

  **The question**

  A claim that keeps coming up in popular writing about markets runs roughly like this: if a market is informationally efficient, then prices already reflect everything anyone knows, so nobody can earn a return from knowing something; but if nobody can earn a return from knowing something, nobody will pay to find things out; and if nobody finds anything out, prices cannot be informative in the first place. A perfectly efficient market therefore looks impossible, or at least unstable. Write an answer of 600 to 900 words that does the following:

  (a) State what the no-trade result of Milgrom and Stokey actually rules out, and the assumptions it rests on — in particular the common prior assumption and the role of common knowledge.

  (b) Say clearly which kinds of trade it does not rule out, and why: trade whose point is risk-sharing or hedging, trade driven by liquidity needs or by positions inherited from the past, and trade between parties who genuinely start out with different priors.

  (c) Explain what the argument of Grossman and Stiglitz adds. It concerns the incentive to acquire information rather than the incentive to trade on information already held. Say what it implies about how informative equilibrium prices can be, and what role noise traders or liquidity traders play in the picture.

  (d) Apply both to the following case. In a catastrophe reinsurance market, every participant licenses the same vendor catastrophe model, but a handful also buy proprietary exposure data, and several participants are trying to lay off legacy books written years ago. Which of the trades in this market, if any, are ruled out by the no-trade result? And what would you expect to happen both to trading volume and to the return on the proprietary exposure data if the vendor model were made public and free of charge?

  **The answer to be graded**

  [1] The no-trade result says that, given a common prior, there is no trade that all parties can expect to profit from purely because of differences in their information. More exactly: if it is common knowledge that a proposed trade is acceptable to everyone — I know that you will take it, you know that I know, and so on — then each trader, once he conditions on being in a situation where the trade actually goes through, must expect to gain nothing from it. The intuition is the old joke about not wanting to belong to a club that would accept you as a member: the mere fact that the other side is willing to deal with me is itself something I have to condition on, and once I do, my apparent edge disappears. The result therefore needs three things: a common prior, common knowledge of everyone's rationality, and common knowledge that the trade is being accepted, which is what the information structure delivers. This is really just an application of Aumann's agreement result in monetary form: with a common prior, the traders' posterior beliefs have to line up, so neither of them can suppose he is getting the better of the other, and the disagreement that any trade would appear to require is, strictly speaking, impossible. That is why the theorem is usually summarised as the claim that you cannot speculate against someone who is willing to speculate against you.

  [2] What it does not rule out is trade whose point is not informational. Two parties who share a common prior can still both gain if what they are doing is transferring risk rather than trading on information: the reinsurer with a concentrated book and the one with spare capacity, the fund that needs cash this quarter, the hedger laying off an exposure inherited from a merger. Trade is also possible when priors genuinely differ — the common prior assumption is doing a great deal of work, and where it genuinely fails, so does the conclusion — and of course noise traders, who are not maximising anything, can be traded against profitably. Notice that every one of these escape routes involves either risk aversion or a party who is not fully rational. The theorem is therefore best read as a result about risk-neutral traders: once you allow risk aversion, hedging motives supply gains from trade from outside the information structure, and the no-trade argument has nothing left to bite on.

  [3] Grossman and Stiglitz push the same point back one step. If prices fully revealed everything that informed traders had paid to learn, the information would be available for free in the price and nobody would recover the cost of producing it; but if nobody produces it, there is nothing for prices to reveal, and then someone would again find it profitable to produce it. There is accordingly no equilibrium in which prices are fully revealing. The equilibria that do exist are only partially revealing, with noise or liquidity traders supplying the camouflage that lets informed traders earn a gross return just sufficient to cover the cost of the information. So the Grossman and Stiglitz argument is simply the no-trade result applied to the acquisition of information instead of to trade in it: because you cannot expect to profit from information, you will not buy it, and in equilibrium prices reflect nothing at all of what anyone has found out, which is why prices are only ever accidentally informative.

  [4] Applied to the catastrophe market, the legacy books are the easy part. Laying off an old book is risk transfer rather than speculation on information, so the no-trade result has no purchase on it whatever the participants know, and those trades would continue even if everyone's information were exactly the same. The proprietary exposure data is the interesting part. Its return depends on prices not fully impounding it, so publishing the vendor model for free would compress that return, and by the argument in paragraph 3 the amount of proprietary data-gathering would fall as well. But if the vendor model became public and free, so that everyone was running the same numbers, the no-trade result would imply something stronger: with identical information on both sides, no participant could expect to gain from any contract, and the market would simply stop writing business. That, I take it, is what the popular claim is really driving at — the more efficient the market becomes, the less reason there is for anyone to be in it at all.
