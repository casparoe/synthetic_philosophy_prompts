answer: |-
  Below is a diagnostic instrument designed to map students' commitments about the relation between descriptive and evaluative claims, without using philosophical labels. The flowchart is built from nine branch questions in a fixed order, plus one preliminary question. The tree carves out the logical space by separating three dimensions of the "is-ought gap": derivability (logical), definability (conceptual), and metaphysical/explanatory (metaphysical and epistemological). The leaves capture core positions in metaethics, and the scoring key identifies unstable answer patterns and unoccupied cells.  

  ### Preliminary Question (Not Counted in the Nine)
  **Question 0:** Consider two statements:  
  - "This act caused the most happiness possible."  
  - "This act is morally good."  
  Do these seem like fundamentally different *kinds* of claims? For instance, is one about how things *are* and the other about how they *ought* to be?  
  - **Option A:** Yes, they are fundamentally different.  
  - **Option B:** No, they are not fundamentally different.  

  **Handling:** If **B**, stop. The student does not recognize the descriptive/evaluative distinction and is excluded from the tree. If **A**, proceed to Question 1.  

  ### Flowchart of Nine Branch Questions
  **Question 1 (Derivability Gap 1: Promising)**  
  A person says, "I promise to pay you five dollars." Given the social institution of promising, does this *directly* get you to "he ought to pay," or do you still need an extra premise like "promises ought to be kept"?  
  - **Option A:** The institution hands you the conclusion (no extra premise needed).  
  - **Option B:** You still need an extra normative premise.  

  **Question 2 (Definability Gap: Goodness)**  
  Someone who fully grasps "maximizing happiness" asks, about an act that does this, "But is it good?" Is this question confused or still intelligible?  
  - **Option A:** Confused (if it maximizes happiness, it just is good).  
  - **Option B:** Intelligible (maximizing happiness doesn’t settle if it’s good).  

  **Question 3 (Derivability Gap 2: Disjunction)**  
  An argument has no evaluative premises and validly yields a false evaluative conclusion (e.g., "Either 2+2=5 or stealing is required; 2+2≠5; so stealing is required"). Does this refute the idea that you can’t derive "ought" from "is," or does it show that idea was never about validity?  
  - **Option A:** Refutes it (you can derive "ought" from "is").  
  - **Option B:** Shows it was never about validity (the disjunctive premise isn’t purely descriptive).  

  **Question 4 (Metaphysical Gap: Supervenience 1)**  
  Two acts are identical in every descriptive respect. Could one be morally obligatory and the other not?  
  - **Option A:** Yes, they could morally differ.  
  - **Option B:** No, they couldn’t morally differ.  

  **Question 5 (Metaphysical Gap: Supervenience 2)**  
  If you chose **4B**, why couldn’t they differ?  
  - **Option C:** This needs an explanation (there’s a deeper reason).  
  - **Option D:** It’s basic (no explanation needed).  

  **Question 6 (Definability Gap: Moral Semantics)**  
  Two communities use "wrong" differently: one for harm-causing acts, another for disrespectful acts. When they disagree on calling an act "wrong," are they disagreeing about one thing or talking past each other?  
  - **Option A:** Disagreeing about one thing.  
  - **Option B:** Talking past each other (compatible claims).  

  **Question 7 (Normative Authority: Reasons)**  
  An agent who feels no pull to be moral asks, "Why should I be moral?" Is there an answer that doesn’t depend on her desires?  
  - **Option A:** Yes (reason exists independently).  
  - **Option B:** No (reason depends on her desires).  

  **Question 8 (Metaphysical Gap: Truth Conditions)**  
  Consider: "If lying is wrong, then getting someone else to lie is wrong." Can this whole statement be true or false? And does its truth require the embedded part ("lying is wrong") to be true/false?  
  - **Option A:** Can be true/false; requires the embedded part to be true/false.  
  - **Option B:** Can be true/false; does not require the embedded part to be true/false.  
  - **Option C:** Cannot be true/false.  

  **Question 9 (Epistemological Gap: Descriptive Completeness)**  
  If you knew every descriptive fact about the world, would you automatically know every evaluative fact?  
  - **Option A:** Yes.  
  - **Option B:** No.  

  ### Leaves (Terminal Positions)
  The tree terminates in ten leaves based on answer patterns. Each leaf includes one sentence stating its most awkward commitment (phrased as internal to the view).  

  1. **Definitional Naturalism**: You must accept that if an act maximizes happiness, asking "but is it good?" is as confused as asking "is a bachelor unmarried?"  
     *Path:* 1A, 2A, 3A, 4B, 5C, 6A or 6B, 7A or 7B, 8A, 9A.  
  2. **A Posteriori Identity Naturalism**: You must accept that "torture is wrong" could turn out to be identical to "torture has neural property X," but we can’t know this without neuroscience.  
     *Path:* 1A or 1B, 2B, 3B, 4B, 5C, 6A, 7A, 8A, 9B.  
  3. **Irreducible Non-Naturalism (Brute Covariation)**: You must accept that evaluative facts necessarily track descriptive facts (e.g., pain always makes acts worse), but this connection has no explanation.  
     *Path:* 1B, 2B, 3B, 4B, 5D, 6A, 7A, 8A, 9B.  
  4. **Constitutivism**: You must accept that morality is grounded in what it means to be an agent, so a rational rock has no moral reasons.  
     *Path:* 1B, 2B, 3B, 4B, 5C, 6A or 6B, 7A, 8A or 8B, 9B.  
  5. **Projectivism/Expressivism**: You must accept that calling slavery "wrong" is more like yelling "boo slavery!" than stating a fact.  
     *Path:* 1B, 2B, 3B, 4B, 5C or 5D, 6A, 7A or 7B, 8C.  
  6. **Error Theory (Conservationist)**: You must accept that all moral claims (e.g., "charity is good") are false, but we should keep making them.  
     *Path:* 1B, 2B, 3B, 4B, 5C, 6A, 7A or 7B, 8A, 9B.  
  7. **Error Theory (Abolitionist)**: You must accept that all moral claims are false, and we should stop making them.  
     *Path:* 1B, 2B, 3B, 4B, 5C, 6B, 7A or 7B, 8A, 9B.  
  8. **Quietism/Deflationism**: You must accept that asking "what are evaluative facts made of?" is as misguided as asking "what are numbers made of?"  
     *Path:* 1B, 2B, 3B, 4B, 5C, 6A or 6B, 7A or 7B, 8B, 9A or 9B.  
  9. **Moral Relativism/Contextualism**: You must accept that "slavery is wrong" could be true for one group and false for another, with no deeper mistake.  
     *Path:* 1A or 1B, 2A or 2B, 3A or 3B, 4B, 5C or 5D, 6B, 7A or 7B, 8A, 9A or 9B.  
  10. **Supervenience Denier**: You must accept that two identical acts could differ morally, making morality arbitrary.  
      *Path:* 1A or 1B, 2A or 2B, 3A or 3B, 4A.  

  ### Scoring Key and Diagnostics  
  **Unstable Answer Patterns (Reveals Internal Tension):**  
  - **1A + 3B**: Rejects derivability in Q1 but accepts it in Q3. *Reveals:* Confusion about whether social facts (e.g., promising) bridge the gap or require normative supplements.  
  - **2A + 6A**: Claims "good" is definable (Q2A) but insists communities disagree (Q6A). *Reveals:* Tension between definability and objective disagreement.  
  - **4B + 5C + 8C + 9A**: Accepts supervenience needs explanation (Q5C) but denies truth-aptness (Q8C) and claims descriptive facts settle evaluative ones (Q9A). *Reveals:* Conflict between needing an explanation and rejecting the tools (truth/facts) to give one.  

  **Unoccupied Cells (Gaps in Logical Space):**  
  1. **Definitional Naturalism (Empty)**: Path: 1A, 2A, 3A, 4B, 5C, 6A, 7A, 8A, 9A. *Why empty?:* Incoherent; if morality is definitional (Q2A), then derivability is trivial (Q1A, Q3A), but it can’t explain why supervenience needs explanation (Q5C) or how communities disagree (Q6A). Historically occupied (e.g., classical utilitarianism), but abandoned due to Moore’s open-question argument (Q2B is compelling).  
  2. **Supervenience Denier + Brute Necessity**: Path: 4A + 5D. *Why empty?:* Unattractive; rejecting supervenience (Q4A) makes morality arbitrary, but calling this "brute" (Q5D) adds no explanation. Unexplored because it offers no theoretical payoff.  
  3. **Constitutivism + Truth-Independent Conditionals**: Path: 1B, 2B, 3B, 4B, 5C, 6A, 7A, 8B, 9B. *Why empty?:* Incoherent; constitutivism grounds normativity in agency (Q5C) but requires moral conditionals to be truth-apt (Q8A or B). Q8B (truth-apt but not requiring embedded truth) is incompatible with constitutivism’s fact-based structure.  

  **Indistinguishable Leaf Pairs (Tree’s Limitations):**  
  1. **Projectivism/Expressivism vs. Quietism**: Both can share paths (e.g., 1B, 2B, 3B, 4B, 5C, 6A, 7A, 8B, 9B). *Further question needed:* "Can we sensibly ask whether evaluative facts exist, or is that question nonsensical?" Projectivists say we can ask but answer "no"; quietists say the question is misguided. *Beginner-honest?* Yes; it probes whether the student hears a substantive metaphysical question.  
  2. **A Posteriori Identity Naturalism vs. Irreducible Non-Naturalism**: Both share 1B, 2B, 3B, 4B, 6A, 7A, 8A, 9B. *Further question:* "If we discovered a perfect descriptive duplicate of our world, would it have the *same* evaluative facts, or just *corresponding* ones?" Identity naturalists say "same"; non-naturalists say "corresponding" (brute covariation). *Beginner-honest?* Maybe not; it requires modal intuition beginners may lack.  

  ### Logical Space and Design Notes  
  - **Three Gaps Separated Early**: Derivability (Q1, Q3), definability (Q2, Q6), and metaphysical/explanatory gaps (Q4–5, Q8–9) are disentangled. Q3 and Q6 cut across realism/anti-realism (e.g., realists and expressivists can both accept Q3B or Q6A).  
  - **Cases Used**: All seven requested cases are included (Q1=Case 4, Q2=Case 1, Q3=Case 2, Q4–5=Case 3, Q6=Case 5, Q7=Case 6, Q8=Case 7). Q9 and the supervenience explanation (Q5) are added.  
  - **Beginner-Appropriate**: Questions use everyday language (e.g., "talking past each other," "institution hands you the conclusion"), avoid jargon, and take ~20 seconds to answer. Awkward commitments are phrased as internal sacrifices (e.g., "you must accept...").  
  - **Flowchart Rationale**: Fixed order ensures derivability/definability gaps are probed before metaphysics, reflecting logical dependencies (e.g., rejecting derivability makes definability salient). Unstable patterns reveal student conflicts rather than forcing a clean classification.
