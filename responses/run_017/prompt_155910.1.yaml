prompt: |-
  Hey — hoping someone here knows experimental philosophy better than I do. I got into this via an argument about whether a hospital triage algorithm "disadvantaged" a group of patients on purpose, and I cant tell whether the thing I keep noticing is one phenomenon with a name, or three that look alike.

  You probably know the basic case: a company starts a program to make money, the exec is told it will also wreck a river, he says he cares about the river not at all, the program runs, the river gets wrecked, and if you then ask people whether he wrecked the river on purpose most say yes. Swap "wreck" for "clean up" and most say no. I gather that's the Knobe effect, or the side-effect effect, or both. Fine. Its the stuff around the edges I can't place. Three things I've noticed when I try versions of this on friends and family:

  1. Neutral control. I made a third version where the side effect is completely inert — the program will change the colour of the water, helps nobody, hurts nobody. I expected the "yes" rate to land between the harm and help versions. It dosn't; it lands right on top of the help version. So it looks like nothing about the good case is doing any work and the whole thing is the bad case lifting off a baseline. If that's right, a story about moral valence moving a judgment in two directions predicts something different from a story where blame does all the work. Also, when I make the "bad" side effect bad only by a rule nobody believes in — the program will violate a dress code or something — the gap mostly vanishes, even though "he broke the rule on purpose" seems plainly true.

  2. Question swap. Keep the story identical and change what you ask. "Did he know it would happen" — no intention word anywhere, just foresight — gives roughly the same harm/help gap. "Did the program cause it" gives a smaller one. "How much profit did the company make" gives none. So whatever this is, it spreads to some dependent measures and not others, and I have no idea what the dividing line is supposed to be.

  3. Agent swap. Replace the chairman with something nobody thinks has beliefs or desires: a model update that tanks accuracy for one group of users and improves it for another, with the engineers told in advance. Now "on purpose" gets you nothing — people balk — but "the update was responsible for" and "the update caused" still track harm vs help, and "somebody should fix it" tracks it harder than either. So there seem to be two things here, one that needs a mind behind the action and one that doesn't, and I don't know whether the literature treats those as one effect with several measures or as separate effects that happen to travel together.

  So: what am I actually looking at? Is any of this already named, is the named thing broader or narrower than what I've described, and where exactly are the boundaries — which dependent measures does it show up in, and which kinds of "bad" does it need (moral badness, any norm violation at all, or a norm the person answering actually endorses)? Please don't just hand me a label; I want to know what's in the box and what isn't, with the edge cases marked. And if one of the three has no name, give it one and define it so it can be told apart from its neighbours. If point 1 is just me having asked badly, say that instead and say why. Lead with your bottom line in the first sentence, then the reasoning — no preamble, and don't restate my question back to me.
reasoning: |-
  Okay, the user is diving deep into experimental philosophy, specifically the Knobe effect or side-effect effect. They've noticed three key observations in their own experiments and want to understand if these are recognized phenomena, how they relate to existing concepts, and what the boundaries are.

  First, the user's main points: neutral control cases where inert side effects behave like the help scenario, not in between. Then, question swaps showing the effect persists for foresight but not profit. Agent swaps where non-mind agents lose the "on purpose" effect but still show responsibility gaps. 

  For point 1, the neutral control result challenges symmetrical theories. The literature mentions normativity beyond morality—like dress codes. The user found that arbitrary norms don't trigger the effect, which aligns with studies showing that norm strength matters. Need to reference the trade-off hypothesis and Alicke's culpable control model.

  Point 2: Foresight questions (like "did he know") still show the asymmetry, which connects to the epistemic side-effect effect. Causation questions have a smaller gap, possibly due to counterfactual reasoning. Profit questions, being factual, show no effect. This distinction highlights that the effect is tied to evaluative judgments, not neutral facts.

  Point 3: Agent swaps remove intentionality for mindless entities, but responsibility and blame persist. This points to the two-process models like Pettit and Knobe's competence without intent. The blame asymmetry here is stronger, suggesting separate mechanisms for attribution versus responsibility.

  The user's deeper needs: They want clarity on whether these are separate phenomena or parts of a larger framework. They need precise boundaries—what dependent measures are affected, what types of "bad" activate the effect. Also, naming the unnamed aspects, like the neutral baseline effect and the agent-independent normativity effect.

  Need to ensure each point is addressed with existing theories, highlighting where the user's observations fit or challenge current models. Emphasize that normativity (endorsed norms) is crucial, not just any violation. The agent swap shows a decoupling of intent from responsibility, which might be termed differently, like "outcome responsibility asymmetry."
answer: |-
  **Your core observations reveal distinct but interconnected phenomena within the Knobe effect's broader framework, with normativity (specifically *endorsed* norm violations) as the critical driver, not merely valence or blame alone. Point 1 is partially explained by existing theories but highlights a key asymmetry; Point 2 is recognized; Point 3 suggests a separable "outcome responsibility" effect.**

  1.  **Neutral Control & Normativity Requirement:**  
      Your neutral result aligns with the *trade-off hypothesis* (Uttich & Lombrozo): the harm case feels like a cost *accepted* for gain, making the outcome seem deliberate. The help case lacks this "cost" framing. Crucially, **weak or arbitrary norms (like dress codes) fail to trigger the effect** because the asymmetry relies on *normative strength*—participants must perceive a *legitimate* reason to avoid the outcome. Alicke's *culpable control model* further explains this: blame amplifies perceived causality and intent *only* when the norm violation is seen as meaningful. Your data suggests the "baseline" isn't neutral valence but *non-normative* outcomes—helping is often non-normative (not *required*), while harming is prohibited. Thus, the gap isn't "bad lifts up," but **"violating a salient norm pulls up intentionality judgments."** *Unnamed nuance: Normative Baseline Effect* – Intentionality attributions for non-normative side effects (neutral/help) cluster together, while norm-violating effects spike.

  2.  **Question Swap & Epistemic/Evaluative Penetration:**  
      The foresight ("did he know") gap is well-documented—the *Epistemic Side-Effect Effect* (Beebe). It shows moral evaluation biases *knowledge* ascriptions, consistent with "intentional" being part of a broader evaluative cluster. Causation judgments ("did it cause") show a smaller gap because they're more constrained by counterfactual reasoning (e.g., "would it have happened anyway?"), though still influenced by norms (e.g., Hitchcock & Knobe). Profit ("how much") is purely factual; no norm applies, so no bias. **The dividing line is evaluative relevance:** measures directly tied to agency evaluation (intent, knowledge, blame) show strong effects; neutral factual measures (profit, physical causality under controlled descriptions) show weak/none.

  3.  **Agent Swap & Decoupling of Intent/Responsibility:**  
      This reveals two mechanisms:  
      - **Intentionality requires a mind:** "On purpose" collapses without an agent capable of mental states (as predicted by theory of mind research).  
      - **Outcome responsibility persists:** Norm violations still drive attributions of causality ("caused"), responsibility ("responsible for"), and especially prescriptive judgments ("should be fixed") even for mindless systems. This aligns with *Pettit & Knobe's norm-and-competence model*: systems can be "competent" to produce outcomes violating norms, making them "responsible" in a non-intentional but *accountability* sense. **Call this *Outcome Responsibility Asymmetry*:** the tendency to attribute greater causal responsibility and prescriptive obligation for norm-violating outcomes of goal-directed processes, even absent intentional agency. Blame ("should fix") tracks this hardest because it directly maps onto norm violations.

  **Boundaries & Key Distinctions:**  
  - **What triggers the core effect?** Requires a *salient norm violation that the participant endorses or recognizes as socially weighty* (moral > conventional > arbitrary). Harm typically works because it's universally normative; dress codes often fail.  
  - **Which dependent measures?** Shows strongly in *evaluative agency judgments* (intentional, knowing, blameworthy). Shows weakly/moderately in *causal responsibility* (caused, responsible for). Absent in *non-evaluative facts* (profit, physical mechanics).  
  - **Agent vs. System:** Intentionality *requires* an agent with a mind. Outcome responsibility (causal/prescriptive) *does not* and applies to algorithms, processes, or systems governed by norms.  
  - **Valence vs. Normativity:** It's not about positive/negative valence, but whether the outcome *violates an applicable norm*. "Helping" isn't norm-violating, so it behaves like neutral. Truly neutral outcomes confirm this.  

  **Bottom Line:** You're observing the Knobe effect's core norm-dependence (1), its spillover into epistemic/evaluative judgments (2), and its decoupling into *intentionality* (mind-dependent) vs. *outcome responsibility* (mind-independent) components (3). Normative strength and endorsement are the critical boundaries.
