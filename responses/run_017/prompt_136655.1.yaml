answer: |-
  ## Proposal: The Epistemology of Skill Degradation: Access, Loss, and the Knowing How/Knowing That Divide

  The central debate concerning knowledge-how – whether it constitutes a distinct kind of knowledge or is reducible to knowledge-that (propositional knowledge) – has been dominated by questions of constitution: what *makes* a piece of knowledge-how the state that it is? Intellectualists argue it is constituted by propositional attitudes, while anti-intellectualists posit irreducible practical capacities. Yet, both camps largely share an unexamined assumption: that knowledge states, once acquired, are retained in an all-or-nothing manner until they are simply lost. This assumption blinds us to a crucial phenomenological difference: skills decay *gradually*, exhibit savings upon relearning ("reminiscence"), and manifest complex patterns of accessibility (e.g., performance anxiety blocking execution while descriptive knowledge remains), whereas propositional knowledge is typically treated as discretely present or absent. My project shifts the focus from static constitution to dynamic *degradation and accessibility*. The key question is: **Do the distinct temporal profiles of degradation, loss, and accessibility for knowledge-how versus paradigmatic knowledge-that reveal a fundamental difference in their underlying nature that the constitution debate obscures?** This question is determinate because it asks whether observed patterns of decline and recovery force us to posit different kinds of epistemic retention mechanisms, challenging the shared all-or-nothing assumption.

  Available positions leave this question open because they prioritize explaining successful performance and acquisition. Intellectualists, focusing on the cognitive aspects guiding skill, often downplay the significance of degraded performance as mere performance error, distinct from the retained propositional knowledge. Anti-intellectualists, emphasizing embodied capacities, struggle to fully integrate the robust retention of descriptive knowledge often co-present with execution failure (as in the expert who collapses under pressure yet diagnoses the flaw perfectly) or the disruptive effect of articulating procedural knowledge. Both frameworks tend to relegate degradation phenomena to non-epistemic factors – stress, fatigue, neurological glitches – operating *on* the underlying knowledge state, which itself remains intact or fully lost. They disagree primarily on where to place the non-epistemic machinery causing performance variation, neglecting whether the core epistemic state *itself* admits degrees of retention characterized by variable accessibility. Consequently, neither camp adequately explains the *asymmetric* degradation patterns: why skills "rust" but propositional knowledge seems to vanish cleanly, or why accessing knowledge-how descriptively can sometimes impede its execution.

  My method over the year will be structured conceptual analysis deeply engaged with empirical findings on skill acquisition, decay, and expertise, but without conducting new experiments. Months 1-3 will involve a focused literature review synthesizing philosophical accounts of knowledge-how and knowledge-that with cognitive scientific and psychological research on skill decay, memory systems (particularly procedural vs. declarative), savings effects, performance anxiety ("choking"), and the dynamics of expert performance under pressure. Crucially, this review will critically assess how existing philosophical theories handle empirical descriptions of degradation. Months 4-6 will focus on developing a nuanced conceptual framework for "epistemic access" and "retention," analyzing paradigmatic cases: the expert failing under pressure while retaining descriptive knowledge; the novice or expert whose performance degrades when made to articulate procedures; the phenomenon of "reminiscence" where relearning a skill is faster than initial learning; and contrasting these with cases of forgetting propositional knowledge. The aim is to map the *kinds* of loss and partial retention involved. Months 7-9 will rigorously test this framework against potential counterexamples and refine it, asking: Does allowing knowledge-how to be retained but partially inaccessible resolve inconsistencies in standard arguments from error or regress? Does it better explain the degradation asymmetry than simply adding performance conditions to an all-or-nothing state? Months 10-12 will consolidate the results, elaborating the implications for the constitution debate and epistemology more broadly, drafting the core argument for publication.

  This degradation-and-access approach offers significant advantages over obvious alternatives. Pure armchair analysis of skill attributions risks ignoring the rich empirical data on *how* skills actually decay and recover, data crucial for challenging the all-or-nothing assumption. Conversely, simply importing a model of motor control or memory from cognitive science risks reducing epistemology to cognitive mechanism without addressing the normative questions about knowledge and justification that define the philosophical debate. My approach is uniquely positioned: it starts from the philosophical problem but uses empirically grounded patterns of degradation as a *lens* to critically evaluate the core philosophical assumptions shared by both sides. It asks what these patterns *mean* for our concepts of epistemic retention and access, forcing a re-evaluation of whether the "non-epistemic" factors influencing skill performance are truly outside the epistemic state or reveal its intrinsic structure. This promises a more dynamic and phenomenologically accurate epistemology of skill.

  Success for this project would be the development of a compelling conceptual framework demonstrating that the degradation asymmetry between knowledge-how and knowledge-that: (1) cannot be adequately explained by either intellectualism or anti-intellectualism in their standard forms without significant, arguably ad hoc, modifications; (2) necessitates recognizing degrees of retention and complex access conditions as inherent to knowledge-how (and potentially some forms of knowledge-that), fundamentally challenging the all-or-nothing model; and (3) provides a unified explanation for key puzzling cases like performance anxiety and the articulation-disruption effect, showing them as different manifestations of degraded access rather than mere performance errors. Failure would be defined by an inability to establish a robust degradation asymmetry relevant to the epistemic nature of the states, or by finding that the degradation phenomena can be fully accommodated within existing frameworks by appealing solely to uncontroversial performance factors without implicating the structure of the knowledge state itself. Partial success would involve clarifying the challenges degradation poses, even if a fully developed alternative framework proves elusive within the year.

  The scope is deliberately focused on conceptual analysis informed by existing empirical research. The primary risk is the conceptual challenge of precisely defining "access," "retention," and "degradation" in an epistemically relevant way without collapsing into purely psychological or neurological descriptions. There's also the risk that the empirical literature on skill decay might be too heterogeneous or underspecified to support strong philosophical conclusions. Acknowledging these risks, the project will be explicitly hostage to certain empirical claims – particularly concerning the robustness and interpretation of skill degradation patterns and savings effects compared to declarative memory loss. I will handle this by rigorously sourcing claims from established literature, clearly distinguishing well-supported generalizations from contested findings, and emphasizing the *conceptual pressure* these phenomena exert on philosophical models. The argument won't hinge on highly specific, contested lab results but on broad, well-documented patterns acknowledged across relevant fields. The project's value lies precisely in demonstrating how these empirically observable dynamics create problems demanding a philosophical response, moving beyond the current stalemate by shifting the evidential ground from constitution to the often-neglected phenomenology of epistemic loss. This conceptual innovation, grounded in the reality of how knowledge fades, offers a fresh path beyond the dissertation to reconfigure a central debate in epistemology.
