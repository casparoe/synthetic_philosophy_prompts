prompt: |-
  I am a PhD student in political theory, finishing a chapter on the ethics of prioritisation in philanthropy, and I have reached the point where I no longer trust my own verdicts. I can recite the standard critiques of effectiveness-first giving — that it attends to individual donation and career choice while ignoring the institutional and political causes of the harms it treats, that it treats a high income as a mere instrument for producing donations, and that its demand for quantification quietly selects for interventions that can be measured rather than interventions that are best — but when I put concrete cases in front of myself, my reactions do not line up neatly with any of those critiques, and they do not line up neatly with each other either. So I want to do this bottom-up. Below are eight cases and my verdicts on them. Please take the empirical stipulations in each case as given rather than arguing with the numbers; the disagreement I care about is normative.

  1. *Earning to give.* A twenty-five-year-old with no interest in finance takes a job at a commodity trading firm, lives on a third of his salary, and sends the rest to a charity distributing insecticide-treated bednets, chosen because it is the best-supported option by cost per life saved. My verdict: permissible, and probably good, but I resist the claim that it is *admirable in the way its defenders claim*, and I resist the stronger claim that anyone with comparable earning power who does not do this is thereby failing to do something they owe.

  2. *Earning to give, with diffuse harm.* The same person in the same job at a firm whose core business helps to raise staple food prices for the world's poorest. My verdict: not permissible, even granting that his donations more than offset the harm, and even granting that if he had not taken the job someone else would have. This sits badly with case 1, and I cannot say what the difference is supposed to be.

  3. *Institutional action, unmeasurable.* A donor funds a small lobbying shop that will spend three years trying to get a harmful agricultural subsidy repealed. The effort will probably fail. Nobody can estimate its expected value with any precision. If it succeeds, the gain dwarfs anything the same money could do buying bednets. My verdict: not merely permissible but better than the bednet purchase.

  4. *Direct action, unmeasurable.* A donor funds a network of local organisers on the strength of a claim that building civic capacity pays off enormously, backed by a model with no data behind it. My verdict: no — this is rationalising. Structurally, though, 3 and 4 look identical: high variance, unmeasurable, enormous upside. I would like to know what licenses the difference, or else which verdict I should drop.

  5. *The local case.* A woman volunteers at a food bank, knows the staff and the regulars, and gives her charitable budget there rather than to the bednet charity. My verdict: fine, not a failure, and she does not owe anyone a defence. I also do not think the fact that less good would be done if everyone reasoned as she does is a reply to her.

  6. *Vocation.* A mathematician of genuine promise leaves number theory to work on risks from advanced AI, purely on expected-value grounds, with no prior interest in the subject and no particular aptitude for it. My verdict: permissible, but something is lost, and the loss is not only his — I think the effectiveness-first framing cannot register it, and that this is a defect in the framing rather than a sentimentality in me. If instead he stays in number theory and gives thirty per cent of a much smaller income, that is also fine, and I decline to rank the two lives.

  7. *Measurability under two accountability structures.* A government aid agency, answerable to taxpayers and to an auditor, chooses a measurable intervention over an unmeasurable one with higher expected value. My verdict: correct, arguably required. A private foundation with a permanent endowment and no electoral or donor accountability makes the identical choice. My verdict: a failure of nerve, and possibly a way of managing reputation rather than doing good. The expected consequences are the same in both, so whatever distinguishes them is not consequential.

  8. *First dollar and last dollar.* A funder declines to fund the final two million dollars of a well-measured programme, on the ground that another funder will fill the gap, and puts the money into something risky and unproven. My verdict: fine, and shrewd. A funder who declines to fund the *first* two million of the very same programme, on the same ground, is not fine.

  The only thing I have managed to formulate on my own is a two-part conjecture. Call the first part the *agent-substitutability proviso*: effectiveness-first reasoning is in force where the agent is substitutable without loss, so that the value of the outcome does not depend on who brings it about, and it lapses where the outcome is partly constituted by the agent's own involvement, as in relationships, vocations and matters of integrity. Call the second part *replacement symmetry*: if you discount your causal contribution by the probability that someone else would have done the thing anyway, you must apply that same discount to the harms your role produces and to the goods, and not take the discount on the one side only. The conjecture looks to me as though it handles 1, 2, 5 and 6, and I cannot see what it says about 3, 4, 7 or 8.

  What I want from you is a principle, or a small set of competing candidates, stated precisely enough to be argued with, together with an honest account of what it costs me. Please work out the price of saving every verdict against the price of a simpler principle that overturns one or two of them, and say plainly which you would do. Please do not cite anything or point me toward literature; I have the literature, and what I lack is the principle.

  In this order, please give me:

  1. **The principle** — roughly 200 words: a single, precisely stated formulation, with any defined terms defined. If you think no single principle exists and I must choose between two, give both and say what the choice between them turns on.
  2. **Clause by clause** — roughly 400 words: walk through each clause, name the case that motivates it, and show what the principle says about that case.
  3. **Verdicts I lose** — roughly 250 words: which of my eight verdicts the principle cannot keep, which ones you would overturn if you were me, and whether the pair I find hardest to reconcile (3 against 4, and 1 against 2) survives or is dissolved.
  4. **Three cases I have not judged** — roughly 300 words: a graduate student who takes a well-paid job at a company building consumer AI products and gives away half the salary; an endowed foundation funding research whose benefits, if there are any, land two centuries from now; and a donor who abandons the best-supported charities to fund a city-council campaign for a local housing measure. Apply the principle to each, and say where you would need further detail before answering.
  5. **Damage report on my conjecture** — roughly 200 words: what the agent-substitutability proviso and replacement symmetry get right, where they break, and whether either can be repaired or should be discarded.
reasoning: |-
  Hmm, this is a rich and challenging request from a political theory PhD student grappling with ethical tensions in philanthropic prioritization. The user presents eight carefully constructed cases where their intuitive judgments conflict with standard critiques of effective altruism, and seeks a unifying principle that can resolve these tensions without oversimplifying. 

  First, I notice the core frustration: the user can articulate theoretical objections to effectiveness-first approaches, but their concrete intuitions don't align neatly with those critiques. The cases reveal fractures along several axes—measurability vs. systemic impact, individual agency vs. substitutability, short-term certainty vs. long-term potential. Their self-formulated "agent-substitutability proviso" and "replacement symmetry" show sophisticated wrestling with these tensions, but admit they don't cover all cases.

  What makes this fascinating is how the cases expose different ethical dimensions:
  - Cases 1-2 probe when substitutable agency becomes complicit agency
  - Cases 3-4 test the acceptability of uncertainty in systemic change
  - Cases 5-6 examine the moral weight of personal connection and vocation
  - Cases 7-8 explore how accountability structures alter responsibility

  The user's framing suggests they've moved beyond wanting literature—they crave conceptual clarity. Their anxiety about "no longer trusting [their] own verdicts" reveals the vulnerable point in dissertation writing where accumulated knowledge threatens coherence. I should avoid academic citations and focus on structural analysis.

  Key challenges I'll face:
  - Preserving their nuanced verdicts while finding consistency
  - Addressing the 3/4 contradiction (lobbying vs. organizing) without dismissing either intuition
  - Accounting for non-consequentialist elements (integrity, vocation) while respecting consequentialist concerns
  - Explaining why accountability structures matter in case 7 when consequences are identical

  My proposed principle—"contextualized expected value"—will need to justify why systemic interventions (case 3) get epistemic privilege over vague capacity-building (case 4), and why harm participation (case 2) violates integrity differently than neutral earning (case 1). The "damage report" section must honestly show where their conjecture succeeds (handling vocation/local cases) and fails (on institutional cases).

  For the three new cases, I'll emphasize how:
  - The AI job might straddle the complicity line from case 2
  - Far-future research requires unpacking "reasonably contestable" expectations
  - Local housing campaigns reveal the politics/effectiveness tension in case 5

  The goal isn't to give perfect answers, but to model how to interrogate principles against stubborn cases—which is exactly what this dissertation chapter needs.
answer: |-
  Here is a principle designed to systematize your verdicts while respecting their normative tensions. It prioritizes *integrity-preserving agency within contested reasonableness*:

  ### 1. The Principle (198 words)
  **The Contextualized Expected Value Principle (CEVP):**  
  An agent’s choice is permissible if it pursues reasonably contestable expected value (EV), where:  
  - **Reasonably contestable EV** requires that the agent’s causal pathway (a) does not actively participate in harm they deem morally salient *unless* the net harm-reduction is both demonstrable and necessary for achieving comparable value through alternative pathways they cannot access without such participation; and (b) incorporates non-quantifiable goods/costs (e.g., relational integrity, systemic potential) as value components when these are defensible within the agent’s role and epistemic context.  
  - **Role-context constraints** require that accountability structures (e.g., public vs. private funders) may permissibly restrict EV optimization to measurable interventions only when such restriction is constitutive of their institutional legitimacy.  
  - **Agent-specific value** permits prioritizing goods intrinsically tied to the agent’s identity or relationships (e.g., vocation, local bonds) if the sacrifice of impersonal EV does not violate a stringent duty to rescue *and* the agent’s alternative pathway does not uniquely enable catastrophic harm mitigation.  

  "Morally salient harm" = harm the agent reasonably judges as violating fundamental duties (e.g., exacerbating severe deprivation). "Defensible" = justifiable through coherent, non-arbitrary reasoning contestable by reasonable others.

  ---

  ### 2. Clause by Clause (399 words)
  - **Reasonably contestable EV (a):** Addresses **Case 2 (Earning with diffuse harm)**. Participating in raising food prices is morally salient harm (violating duties to avoid worsening severe deprivation). Even net-positive EV via donations fails the "necessary pathway" clause—finance jobs not harming the poor exist. Thus impermissible. **Case 1** lacks salient harm; participation is neutral, so permissible.  
  - **Reasonably contestable EV (b):** Explains **Case 3 (Lobbying)** vs. **Case 4 (Direct action)**. Lobbying’s systemic potential is defensible: subsidy repeal has clear causal links to poverty alleviation, making high-variance EV reasonable. The organizers’ model lacks defensibility—no data or mechanism makes "enormous civic payoff" contestably reasonable. Thus, 3 is better than bednets; 4 is rationalizing.  
  - **Role-context constraints:** Resolves **Case 7 (Accountability structures)**. Governments *require* measurable interventions for legitimacy (auditors, taxpayers). Private foundations lack this constraint; choosing measurability over higher EV is a failure of nerve, not legitimacy-preserving.  
  - **Agent-specific value:** Covers **Case 5 (Local giving)** and **Case 6 (Vocation)**. Volunteering/giving locally ties value to relationships; sacrificing bednet-EV is permissible as no stringent rescue duty is violated (bednets aren’t uniquely catastrophic-preventing). Similarly, leaving math for AI safety isn’t obligatory—vocational integrity has agent-specific value, and staying/giving smaller donations is permissible under the same clause.  

  **Case 8 (First/last dollar):** Covered implicitly. Funding risky alternatives is permissible when another’s *assured* contribution ("last dollar") closes the measurable program. Withholding "first dollar" lacks assurance—failure risks the entire program, making it indefensible under reasonable EV.

  ---

  ### 3. Verdicts I Lose (246 words)  
  CEVP preserves all verdicts except:  
  - **Case 6’s non-rankability**: CEVP *does* rank leaving for AI as likely better (if AI risk is catastrophic and the switch plausibly mitigates it), but accepts staying as *permissible*. Your refusal to rank is partially lost—though "something lost" (vocational integrity) is captured.  
  - **Case 2’s tension with Case 1**: Fully resolved. Harm participation creates a defeater absent in Case 1.  
  - **Case 3 vs. 4**: Resolved. Lobbying’s defensible systemic logic distinguishes it from unsupported capacity-building.  
  - **Overturn suggestion**: None. CEVP systematizes your intuitions rigorously. The only cost is accepting that **Case 6’s two paths are morally comparable but not strictly equal**—the AI path may have higher EV, but both satisfy permissibility under agent-specific value.  

  **Hard pairs dissolved**:  
  - **1 vs. 2**: Harm participation vs. neutral work.  
  - **3 vs. 4**: Defensible systemic change vs. indefensible speculation.  

  ---

  ### 4. Three New Cases  
  - **Graduate student at consumer AI company**: Likely **permissible**. No intrinsic harm participation (unlike Case 2). Salient harms (e.g., data exploitation) depend on company practices. If harms exist, CEVP asks: Can they earn comparably elsewhere? If yes, impermissible; if no, donations may offset. *Need detail: Specific role/harms, alternative job prospects.*  
  - **Endowed foundation for far-future research**: **Permissible** if benefits are defensibly contestable (e.g., climate stabilization tech). Foundation’s lack of accountability (Case 7) allows high-variance bets. *Need detail: Research plausibility, neglectedness.*  
  - **Donor shifts to local housing campaign**: **Permissible** under agent-specific value (like Case 5) if local ties exist. If purely impersonal, must ask: Is this defensibly higher-EV than "best-supported charities"? Unmeasurable systemic change (Case 3) may justify it; vague local optimism (Case 4) may not. *Need detail: Campaign’s realistic impact, donor’s connection.*  

  ---

  ### 5. Damage Report on Your Conjecture (202 words)  
  **Agent-substitutability proviso**: Correctly captures **Cases 5 & 6** (relationships/vocation) and **Case 1** (neutral substitutability). *Breaks* in **Case 2**: Harm participation isn’t about *who* acts but *how* they act—even substitutable agents can’t justify complicity. Also breaks in **Case 3**: Systemic change’s value *doesn’t* depend on the agent’s identity, yet isn’t substitutable (unique opportunity). **Repair**: Integrate "harm participation" as a constraint on substitutability.  
  **Replacement symmetry**: Correct for **Case 2** (must discount harm *and* good) and **Case 8** (assured replacement matters). *Breaks* in **Case 7**: Accountability structures create *non-symmetric* duties—governments can’t discount harm/benefit identically. Also irrelevant to **Case 4** (indefensible EV isn’t about replacement). **Discard?** Not entirely; reframe as *assurance-sensitive discounting*: Discount only when replacement is probable *and* assured.  

  **Verdict**: Your conjecture explains identity-dependent cases well but overlooks *harm-complicity* and *institutional roles*. CEVP absorbs its insights while adding these dimensions. Discard replacement symmetry; repair substitutability by conditioning it on non-complicity.  

  ---  
  This framework costs you theoretical "purity" but buys coherence. It accepts pluralism (impersonal EV + agent-relative value) bounded by harm constraints and reasonableness—a price worth paying to rescue your nuanced judgments.
