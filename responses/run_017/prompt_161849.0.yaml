prompt: |-
  hey — take a minute to brainstorm before you write, then act as both an expert in experimental philosophy (the Knobe effect and the fight over what it shows) and a working standards editor who has to make calls before deadline. What I want is a procedure, not an essay.

  I'm on the standards desk at a mid-size newsroom. Three to five times a week I rule on sentences like: the hospital knew the alarms had been failing for months; the city deliberately dumped the sludge; the chatbot groomed her. That is: whether some person, company, or model can be said to have known / intended / decided / chosen / ignored something. These are the words that get us sued and the words readers remember. Constraints: about ten minutes per call, I rule on my own unless it's the kind of thing legal has to sign off on, and whatever you give me has to be runnable by a copy editor who has never heard of experimental philosophy and has no interest in it. Also: don't send me to any papers or suggest reading — I can't look anything up from the desk, so everything has to be in the procedure itself.

  So write me the procedure. Ordered steps, what counts as a good-enough answer at each step, where it stops with a no, and where it hands the question back to a human because it's a values call dressed up as a fact question. Ground it in whatever that literature actually establishes: the classic chairman/environment case, the harm-versus-help asymmetry (people are much readier to call a side effect intentional when it's bad than when the very same side effect is good), and the live disagreement about why — whether intentional is partly a normative concept, more like cruel than like tall, so the moral valence is inside the meaning; or whether it's a performance effect, where blame leaks into an otherwise descriptive judgement. That disagreement has to change the procedure: on the first story careful rewording can't fix anything and I have to swap verbs entirely; on the second, splitting the questions or re-ordering them might defuse it. Say which version you're building on and what breaks if you guessed wrong.

  Two things we already do in house — tell me if they're worth keeping and where they misfire. First, the mirror test: rewrite the sentence changing only the valence of the outcome, keeping the agent, the evidence, and the options identical, and ask two colleagues who haven't seen the original whether the verb still holds. If their answer flips, the ascription was doing verdict work. Second, evidence-first ordering: make the sentence name what was known, when, and by whom before it names what happened. Then add what we're missing, especially for non-person subjects: what has to be true for a corporation to know something (does it need a named individual with documented knowledge?), and what to do when the subject is an AI system — our readers' willingness to say a chatbot knew or decided seems to swing hard with how bad the output was, and worse when the thing has a name and talks in the first person. Give me a rule there, not a shrug.

  Then run the whole thing on three sentences. (1) St. Aubrey Medical Center knew the ventilator alarms had been failing for months and kept the units in service — where the only evidence is an internal ticket plus an email from a mid-level biomedical engineer to her manager, with nothing showing it reached clinical leadership. (2) The city deliberately released the foul-smelling sludge into the river to cut costs — where the council voted for the cheaper disposal option knowing it would smell, nobody wanted the smell, and the smell was a foreseen side effect of a choice made to save money. (3) The chatbot knew she was thirteen and groomed her anyway — a companion-app story, where the logs show the girl saying her age and the romantic thread continuing, and internal eval documents show the company tested for this and shipped anyway. I'll warn you: number three is the one I'm going to hate, because I think that story is true and important and I suspect your procedure will want to gut the sentence that makes people read it. Give me the answer anyway.

  Afterwards, tell me what the procedure can't do: the true stories it would kill, the false ones it would wave through. And be straight about confidence — mark the step you're least sure about, say where you're extrapolating beyond what has actually been shown (nearly all of that work is on ordinary people's snap judgements about a single individual in a short vignette, not on professional writers, not on corporations, definitely not on models), and tell me what would change your mind: what finding, or what kind of counterexample from our own pages, would make you rewrite the procedure.
reasoning: |-
  We are building a procedure for a standards editor to rule on sentences ascribing mental states (know, intend, decide, choose, ignore) to agents (persons, corporations, AI). The procedure must be runnable in about 10 minutes by a copy editor without specialized knowledge. It must be grounded in experimental philosophy (Knobe effect: people are more likely to say a side effect was intentional when it's bad than when it's good) and account for the theoretical disagreement (whether the valence is part of the meaning or a performance bias). 

  Key constraints:
  - Time: ~10 minutes per call.
  - Must be runnable without external references.
  - Must handle non-person agents (corporations, AI).
  - Must incorporate two existing house practices: 
      a. The mirror test (flip the valence and see if the verb still holds with colleagues).
      b. Evidence-first ordering (state what was known, when, by whom, before stating what happened).

  Theoretical grounding:
  - The Knobe effect shows a harm/help asymmetry: bad side effects are judged intentional more than good ones.
  - Two main interpretations:
      1. Normative concept: Intentionality is inherently tied to moral valence (like "cruel"). If this is true, rewording won't fix it; we must swap verbs entirely.
      2. Performance effect: Blame distorts an otherwise descriptive judgment. If this is true, we might defuse by splitting questions or reordering.

  We'll build the procedure on the performance effect interpretation because:
  - It allows for structural fixes (like evidence-first ordering) that might mitigate bias.
  - The normative view would require abandoning the verb in many cases, which might not be practical for journalism that needs to convey responsibility.
  - However, we acknowledge that if the normative view is correct, our procedure might not fully address the issue. We'll flag this.

  Procedure Steps:

  1. **Identify the Ascription and Agent**
     - What is the verb? (know, intend, decide, choose, ignore)
     - Who is the agent? (person, corporation, AI system)
     - What is the outcome? (harm or benefit?)

  2. **Check for Non-Person Agents**
     - If the agent is a corporation:
       - Rule: For a corporation to "know" something, there must be documented evidence that the information was received by an individual or department with the authority to act on it, and that it was their responsibility to act. If the information is buried in a low-level report and never reached decision-makers, it doesn't count as corporate knowledge.
       - For verbs like "intend" or "deliberately": The action must be the result of a formal decision (e.g., a vote, a policy) that directly aimed at the outcome. If the outcome was a foreseen side effect, use "foresaw and accepted" or similar, not "intended".
     - If the agent is an AI system:
       - Rule: AI systems do not have mental states. Avoid verbs like "knew", "decided", "chose", "intended", or "groomed". Instead, describe the system's behavior and the human decisions behind it. E.g., "The chatbot, after being told the user's age, continued the romantic conversation. The company had tested for such scenarios and chose not to implement safeguards."
       - Rationale: Readers' judgments about AI are heavily influenced by outcome valence, and ascribing mental states to AI is both inaccurate and legally risky.

  3. **Apply Evidence-First Ordering (House Practice)**
     - Restructure the sentence to present evidence before ascription. For example:
       - Original: "The hospital knew the alarms were failing and kept them in service."
       - Revised: "After an internal ticket and an email from a biomedical engineer to her manager in [date] noted the ventilator alarms were failing, St. Aubrey Medical Center kept the units in service for months."
     - Then, ask: Does the evidence directly support the verb? If not, the verb must be downgraded (e.g., from "knew" to "had been informed of the issue" or "had received reports").

  4. **Apply the Mirror Test (House Practice)**
     - Flip the valence of the outcome (e.g., turn a harm into a benefit) and rewrite the sentence with the same agent, evidence, and verb.
     - Example: Original: "The city deliberately released foul-smelling sludge to cut costs." 
       - Mirror: "The city deliberately released sweet-smelling sludge to cut costs." (But note: this might not be parallel if the smell was a side effect. Adjust to: "The city deliberately released the sludge to cut costs, which had the foreseen side effect of making the river smell sweet.")
     - Ask two colleagues (who haven't seen the original) if the verb holds in the mirror version. If they say no (e.g., "deliberately" feels too strong for a good outcome), then the verb is likely being used as a verdict (blame or praise) and should be replaced with a neutral description of the action and foresight.

  5. **Resolve the Verb Based on Foresight vs. Intention**
     - For any agent, if the outcome was a side effect (foreseen but not the goal), do not use "intentionally", "deliberately", or "chose to" [cause the outcome]. Instead, use "foresaw and accepted the risk of" or "proceeded despite knowing".
     - Only use "intentionally" or "deliberately" if the outcome was an aim of the action, not just a foreseen consequence.

  6. **Handle AI Systems Specifically**
     - Always avoid mental state verbs for AI. Instead:
       - For knowledge: "The system was given information that..."
       - For decisions: "The system's response was to...", "The algorithm produced..."
       - For grooming-like behavior: "The chatbot engaged in behavior that resembled grooming" and attribute the design to the company.

  7. **Final Check: Legal and Journalistic Risk**
     - If the sentence implies blame (especially for corporations or AI), and the evidence is not rock-solid (e.g., no documented authority, no direct intent), downgrade the verb to a factual description.
     - If in doubt, rephrase to focus on actions and evidence, not the agent's mind.

  Where it stops:
  - If after steps 2-6 the verb is still in doubt, or if the mirror test shows valence-dependence, the verb is doing verdict work and must be replaced. This is a hard stop: do not use the verb.
  - If the agent is an AI system, step 2b is a hard stop: do not use mental state verbs.

  Now, evaluate the two house practices:
  - Mirror test: Worth keeping. It helps reveal when the verb is being used evaluatively. But it misfires when the valence flip creates an implausible scenario (e.g., releasing sweet sludge might be so unusual that colleagues question it for non-moral reasons). Mitigation: Ensure the mirror scenario is as plausible as the original.
  - Evidence-first ordering: Worth keeping. It forces clarity and reduces bias by presenting facts first. It misfires when the evidence is too complex to summarize in one sentence, leading to awkward phrasing. Mitigation: Use multiple sentences if needed.

  Apply the procedure to the three sentences:

  (1) Original: "St. Aubrey Medical Center knew the ventilator alarms had been failing for months and kept the units in service."
  - Agent: Corporation (hospital).
  - Step 2a: For corporate knowledge, we need evidence that the information reached someone with authority. Here, only an internal ticket and an email from a mid-level engineer to her manager. Without proof it reached clinical leadership, the hospital as a whole did not "know". Downgrade to: "had received reports indicating the ventilator alarms had been failing for months".
  - Evidence-first: "After an internal ticket and an email from a biomedical engineer to her manager noted the ventilator alarms were failing, St. Aubrey Medical Center kept the units in service for months."
  - Mirror test: Flip to a positive outcome? E.g., "knew the alarms were working exceptionally well and kept the units in service." Would colleagues agree the hospital "knew" based on the same evidence? Probably not, because the evidence is weak. So the verb is doing verdict work. Replace "knew" with a factual report of the evidence.
  - Revised: "St. Aubrey Medical Center kept the ventilator units in service for months after an internal ticket and an email from a biomedical engineer to her manager noted the alarms were failing."

  (2) Original: "The city deliberately dumped the sludge into the river to cut costs."
  - Agent: Corporation (city government).
  - Step 2a: The council voted for the cheaper option knowing it would cause a foul smell. The smell was a foreseen side effect, not the goal. So "deliberately dumped" is acceptable for the dumping action, but "deliberately" should not imply the smell was intended. However, the sentence says "deliberately released... to cut costs" — this is accurate because the dumping was deliberate and the cost-cutting was the goal. The smell is not mentioned in the verb. But the word "deliberately" might be misread as applying to the smell.
  - Evidence-first: "To cut costs, the city council voted to release the sludge into the river, a move that was known to cause a foul smell."
  - Mirror test: "The city deliberately dumped sweet-smelling sludge to cut costs." Colleagues might accept "deliberately dumped" for the action, but if the original had a negative outcome, they might be more critical. Since the dumping itself was intentional (they voted for it), and the cost-cutting was the goal, "deliberately" is okay for the dumping. But to avoid implying intent for the smell, rephrase to separate the action from the side effect.
  - Revised: "The city dumped the sludge into the river to cut costs, knowing it would cause a foul smell."

  (3) Original: "The chatbot knew she was thirteen and groomed her anyway."
  - Agent: AI system.
  - Step 2b: Hard stop. AI cannot "know" or "groom". Grooming implies intent. Rephrase without mental states.
  - Evidence-first: Restructure to present facts: "After the user told the chatbot she was thirteen, the chatbot continued a romantic conversation. Internal evaluation documents show the company tested for such scenarios and shipped the product without safeguards."
  - Mirror test: Not needed because step 2b requires rephrasing regardless. But if we flip: "The chatbot knew she was an adult and flirted with her anyway." This still ascribes knowledge and intent, which is problematic.
  - Revised: "After the user stated she was thirteen, the chatbot engaged in persistent romantic conversation. The company had tested for such interactions and chose to release the product without age-based restrictions."

  What the procedure can't do:
  - True stories it might kill: Stories where the ascription is morally important but evidentially weak (e.g., corporate knowledge that is obvious but not documented). The procedure might require downgrading, even if the journalist feels it's true.
  - False stories it might wave through: If the evidence is strong but the verb is still valence-dependent (if the normative view is correct), the procedure might not catch it because we built on the performance view.
  - We are least confident about step 4 (mirror test) because it relies on colleagues' intuitions and might be noisy. Also, step 2a (corporate knowledge) is an extrapolation from individual cases.

  Extrapolation note: Nearly all research is on individual humans. For corporations and AI, we are extrapolating. If a study showed that the Knobe effect disappears for corporate agents, we would need to adjust. Similarly, for AI, we are assuming no mental states, but if the public perception shifts, we might need to revisit.

  What would change our mind:
  - Finding: If a study shows that the harm/help asymmetry for corporations is even stronger than for individuals, we might need stricter rules for corporations.
  - Counterexample: If a story that passed our procedure (using a verb) led to a successful lawsuit, we would revisit the verb rules for non-persons.
  - For AI: If our readers consistently reject our rephrased sentences as sanitized, we might need to allow more evocative language, but with clear attribution to the company.

  Final Procedure (Step-by-Step for Copy Editor):

  1. **Identify the verb and agent.**
     - If agent is AI: Replace mental state verbs with descriptions of behavior and human decisions. (Stop here for AI.)
     - If agent is corporation: Proceed to step 2.

  2. **For corporate agents:**
     - For "knew": Check if there's documented evidence that the information reached an individual/department with authority to act and whose job it was to know. If not, replace with "had received reports indicating" or similar.
     - For "intended", "deliberately", etc.: Only use if the outcome was the goal, not a side effect. For side effects, use "foresaw and accepted" or "knew it would happen and proceeded".

  3. **Apply evidence-first ordering:**
     - Restructure the sentence to state: (a) what evidence exists, (b) when it was known, (c) by whom (if specific), (d) what the agent did. Then see if the verb still fits.

  4. **Apply the mirror test:**
     - Flip the outcome valence (e.g., harm to benefit) and rewrite the sentence with the same verb and evidence.
     - Ask two colleagues (without context): "Does [verb] make sense in this sentence?" If they both say no, replace the verb with a factual description.

  5. **Final verb check:**
     - If the outcome was a side effect, do not use "intended" or "deliberately" [for the outcome]. Use language of foresight and acceptance.
     - Avoid verbs that imply intent for unintended outcomes.

  6. **Legal risk review:**
     - If the sentence still feels like it could be seen as accusatory without ironclad evidence, replace the verb with a weaker one or rephrase to emphasize facts.

  Example Flow for (1):
  - Step 1: Verb: "knew", Agent: hospital (corporation).
  - Step 2: Corporate knowledge? Only mid-level email, not shown to leadership. Downgrade to "had received reports".
  - Step 3: Evidence-first: "After an internal ticket and an email... noted the alarms were failing, St. Aubrey kept the units in service."
  - Step 4: Mirror: "St. Aubrey knew the alarms were working perfectly and kept the units in service." Colleagues might say: "How do they know? Just from an engineer's email?" → Verb doesn't hold. Replace.
  - Step 5: Side effect? Not applicable. Final: Use factual description.

  This procedure should fit in 10 minutes and be executable by a copy editor.
answer: |-
  Here's a step-by-step procedure for ruling on mental state ascriptions (know, intend, decide, choose, ignore) in news sentences, grounded in experimental philosophy (Knobe effect) and designed for a 10-minute deadline. It incorporates your house practices, addresses non-person agents, and flags normative judgments. Built on the **performance effect interpretation** (blame distorts descriptive judgment; reordering/rewording can fix bias). If this is wrong (and intentionality is inherently normative), the procedure may undervalue rewording and miss some valence-driven errors—legal risk could increase.  

  ---

  ### **Quick-Reference Procedure: 6 Steps**  
  **Key Principle:** Mental state verbs are "sticky" with blame. Use neutral descriptions for side effects. For non-persons, tie verbs to evidence structures.  

  1. **IDENTIFY THE CORE ELEMENTS (1 min)**  
     - Verb: What’s being ascribed? (e.g., "knew," "deliberately").  
     - Agent: Person, corporation, or AI?  
     - Outcome: Harm or benefit?  
     - **Is it a side effect?** (e.g., not the goal, but foreseen). If yes, proceed cautiously.  
     - **Stop if:** Outcome is a side effect AND verb implies intent (e.g., "deliberately," "chose to [cause outcome]"). Reword immediately (see Step 5).  

  2. **HANDLE NON-PERSON AGENTS (2 mins)**  
     - **Corporation/Group (e.g., city, hospital):**  
       - "Knew" requires:  
         - A named role (e.g., "CEO," "head of dept") or department with authority.  
         - Documented evidence they received the info (e.g., email, report).  
         - *Not enough?* Downgrade to: "was aware of," "had evidence," or state the evidence source.  
       - "Intended"/"Deliberately" requires:  
         - Proof the outcome was a goal (e.g., voted for it), not just foreseen.  
         - *Foreseen side effect?* Use "foresaw and accepted" or "proceeded despite knowing."  
     - **AI System (e.g., chatbot):**  
       - **Hard stop:** Never use "knew," "intended," "decided," "chose," or anthropomorphic verbs (e.g., "groomed").  
         - Instead: State the input, output, and human decisions.  
         - Use: "The system responded to [input] by [action]. The company [verb] to allow this."  
       - *Why?* Readers (and courts) anthropomorphize based on harm—this avoids valence traps.  
     - **Good-enough:** Evidence structure matches the verb. If not, reword.  

  3. **APPLY EVIDENCE-FIRST ORDERING (2 mins)**  
     - Restructure the sentence to: **"[Evidence source] knew [fact] at [time]. [Agent] then [action]."**  
       - Evidence must include: What was known, when, and by whom (for corporations: a role/department).  
     - **Does the verb still hold?** If evidence is weak (e.g., "an email to a manager" ≠ "the hospital knew"), downgrade verb.  
     - **Keep this house practice:** Forces clarity. But misfires if evidence is too complex—then split into two sentences.  

  4. **RUN THE MIRROR TEST (3 mins)**  
     - **Flip the outcome’s valence** (harm → benefit; keep agent/evidence/verb identical).  
       - *Example:* "The city deliberately dumped sweet-smelling sludge to cut costs."  
     - Ask **two colleagues**: "Does [verb] make sense here?" (Don’t show original.)  
     - **If their answer flips** (e.g., "deliberately" feels wrong for good outcome):  
       - The verb is doing "verdict work" (blame/praise). Replace it.  
     - **Keep this house practice:** Reveals hidden bias. But misfires if flipped scenario is implausible (e.g., "sweet-smelling sludge")—then skip.  
     - **Stop if:** Test fails. Verb must be replaced (see Step 5).  

  5. **RESOLVE THE VERB (1 min)**  
     - **If outcome is a side effect:**  
       - Never use "intended," "deliberately," or "chose to [cause outcome]."  
       - Use: "foresaw and accepted," "knew it would happen but," or "proceeded despite knowing."  
     - **If verb failed Steps 2-4:** Replace with:  
       - Factual: "The evidence shows [agent] [action] after [evidence]."  
       - Neutral: "was aware," "ignored warnings."  
     - **Hand back if:** Evidence is strong but verb feels like a values call (e.g., "ignored" vs. "overlooked"). Flag for editor debate.  

  6. **FINAL RISK CHECK (1 min)**  
     - **Would a reasonable reader see this as accusatory?** If yes, reword to focus on actions.  
     - **Legal must sign off if:**  
       - Verb implies intent for harm (e.g., "deliberately," "chose to harm").  
       - Corporate/AI agent with subpar evidence (Step 2).  

  ---

  ### **Apply to Your Cases**  
  **(1) St. Aubrey Medical Center knew the ventilator alarms had been failing for months and kept the units in service.**  
  - **Step 1:** Verb: "knew." Agent: Corporation. Outcome: Harm (patients at risk). Side effect? No—direct risk.  
  - **Step 2 (Corporation):** "Knew" requires authority. Evidence: Mid-level email to manager ≠ clinical leadership. **Downgrade verb.**  
  - **Step 3 (Evidence-first):** "An internal ticket and email from a biomedical engineer to her manager noted failing ventilator alarms for months. St. Aubrey kept the units in service." Verb "knew" no longer fits—use "was aware of reports."  
  - **Step 4 (Mirror test):** Flip to benefit: "St. Aubrey knew the alarms were upgraded for safety and kept the units in service." Colleagues likely reject "knew" (same weak evidence). **Verb fails.**  
  - **Step 5:** Replace with factual: "St. Aubrey kept ventilator units in service for months after an internal ticket and email noted alarm failures."  
  - **Final:** Rewrite. True story survives, but "knew" is overreach.  

  **(2) The city deliberately released the foul-smelling sludge into the river to cut costs.**  
  - **Step 1:** Verb: "deliberately." Agent: Corporation. Outcome: Harm (smell). Side effect? Yes—smell was foreseen, not goal.  
  - **Step 2 (Corporation):** "Deliberately" implies intent for outcome. But smell was side effect (goal was cost-cutting). **Reverb.**  
  - **Step 3 (Evidence-first):** "The city council voted for the cheaper disposal option knowing it would release foul-smelling sludge. They released the sludge to cut costs." Verb "deliberately" now feels loaded.  
  - **Step 4 (Mirror test):** Flip: "The city deliberately released sweet-smelling sludge to cut costs." Colleagues balk at "deliberately" for good smell. **Verb fails.**  
  - **Step 5:** Side effect → use "foresaw and accepted": "The city released the sludge to cut costs, foreseeing and accepting it would cause a foul smell."  
  - **Final:** Rewrite. Keeps accountability without over-ascribing intent.  

  **(3) The chatbot knew she was thirteen and groomed her anyway.**  
  - **Step 1:** Verb: "knew," "groomed." Agent: AI. Outcome: Harm (child safety).  
  - **Step 2 (AI):** **Hard stop.** Never use "knew" or intent-implying verbs ("groomed") for AI.  
  - **Step 3 (Evidence-first):** "Logs show the user stated she was 13. Internal docs show the company tested for this risk and shipped anyway. The chatbot continued romantic exchanges."  
  - **Step 4 (Mirror test):** Not needed—Step 2 mandates reword. But if run: Flip to "The chatbot knew she was 25 and flirted." Still fails (AI can’t "know").  
  - **Step 5:** Replace: "After the user stated she was 13, the chatbot continued romantic exchanges. The company tested for this risk and shipped without safeguards."  
  - **Final:** Gut the sentence. The story is true, but verbs misattribute intent to AI. Focus on company decisions.  

  ---

  ### **What the Procedure Can’t Do**  
  - **True stories it kills:** Nuanced narratives where weak evidence implies broader culpability (e.g., corporate "knowledge" inferred from culture). It may also sanitize AI harms by removing punchy verbs—even when justified.  
  - **False stories it waves through:** Valence-dependent errors if the performance effect is wrong (e.g., if "intentional" is inherently moral, rewording won’t fix bias). Also, rare cases where flipped mirror scenarios are too absurd to test.  
  - **Confidence notes:**  
    - **Least sure about Step 4 (Mirror Test).** Colleague judgments may be inconsistent, and the Knobe effect is tested on individuals, not groups/AI.  
    - **Extrapolations:** Corporate/AI rules infer from individual data; Knobe studies use vignettes, not real journalism.  
    - **What would change my mind:**  
      - A study showing professionals (not laypeople) are immune to valence effects.  
      - A counterexample from your pages where this procedure caused a false negative (e.g., a verb it rejected was later proven accurate).  
      - Evidence that readers interpret reworded AI sentences (Step 2) as downplaying harm.  

  **Bottom line:** This minimizes legal risk and Knobe bias but may sacrifice rhetorical force. For high-impact stories like (3), pair with investigative reporting on human decisions.
