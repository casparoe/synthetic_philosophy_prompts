answer: |-
  Here’s the reconstruction of the implicit theory and its implications, structured as requested:

  ### The Implicit Theory (~350 words)
  The strongest version assumes a **neurobiological threshold for sentience**: consciousness requires integrated cortical structures (like the mammalian neocortex or avian pallium) that generate unified subjective states. Insects lack these structures entirely—their decentralized ganglia process information without integrative hierarchy, making consciousness biologically implausible. This view treats sentience as an emergent property of specific neural architectures, not a spectrum. Consequently, insects are "biological robots": their sophisticated behaviors (e.g., honeybee navigation) are complex reflexes, not evidence of felt experience. Moral status is binary: either an entity has interests (grounded in sentience) or it doesn’t. Since insects fail the neurostructural threshold, they fall outside the moral frame. Burden of proof lies with demonstrating *unlikely* sentience—absence of evidence *is* evidence of absence here. Large numbers don’t aggregate moral weight because zero sentience × N = zero. Institutional boundaries reflect this ontological split: vertebrates/cephalopods (with complex brains) get scrutiny; other invertebrates don’t. The "taxon-level natural kind" assumption follows: neural blueprints are species-typical, so uncertainty resolves at the group level ("insects") not per individual. Pascalian reasoning is rejected—low-probability, high-impact risks aren’t entertained for entities deemed categorically nonsentient.

  ### What It Strictly Needs vs. What It Merely Fits (~250 words)
  **Strictly needs**:  
  1. The neurobiological threshold (sentience requires specific, absent structures).  
  2. Binary moral status (no sentience = no interests).  
  3. Taxon-level resolution (sentience is uniform within biologically defined groups).  
  4. Burden of proof on claimants of insect sentience.  

  **Merely fits**:  
  - Tractability: Ignoring insects simplifies oversight. This *follows* from the theory but isn’t foundational.  
  - Epistemic cutoff: Treating low probabilities as zero. The theory avoids this by asserting *certainty* of nonsentience.  
  - "Similarity-to-us": While vertebrates are proxies for humans, the theory anchors to neurology, not intelligence or phylogeny. Octopuses qualify via convergent evolution of complex brains; ants don’t.  
  - Economic pragmatism (e.g., agriculture’s reliance on insecticide) isn’t part of the justification—it’s an external pressure the theory accommodates.

  ### Where the Practice Pulls Apart (~250 words)
  The contradictions emerge at neurological and behavioral frontiers:  
  1. **Honeybees vs. zebrafish**: Zebrafish (vertebrates) get full review despite simpler brains than honeybees, which exhibit metacognition-like behaviors. If neurology is decisive, zebrafish should be exempt; if behavior matters, bees should qualify.  
  2. **Decapod paradox**: UK law protects lobsters (complex nociception) while ignoring shrimp. Committee practice mirrors this, straining the taxon-level claim: crustaceans aren’t neurologically uniform.  
  3. **Scale blindness**: Gassing 50,000 fruit flies requires no review, but euthanizing one frog does. If numbers only matter *after* sentience is established, the theory holds—but it fails to explain why establishing sentience in flies isn’t even attempted given their learning capacities.  
  4. **Agricultural cognitive dissonance**: Farming insects for "ethical protein" assumes nonsentience, yet pesticides kill trillions of "nonsentient" crop pests annually. If insects *are* sentient, this is catastrophic; if not, the "ethical" marketing is redundant. The practice avoids squaring this circle.

  ### Underdetermination (~250 words)
  The same hands-off treatment could arise from distinct theories:  
  1. **Eliminative materialism**: Consciousness is illusory even in mammals; insects are irrelevant because *nothing* is sentient.  
  2. **Virtue ethics**: Insect treatment reflects human character (e.g., wanton cruelty to bees is vicious), but oversight isn’t needed as insects lack intrinsic moral weight.  
  3. **Epistemic skepticism**: We can’t know if insects are sentient, so inaction is justified (differs from the implicit theory’s certainty).  
  4. **Theological instrumentalism**: Insects exist for human use; moral obligations arise only toward beings with "souls" (defined as vertebrates/cephalopods).  
  5. **Rule consequentialism**: Including insects in oversight would collapse research/agriculture; thus, a bright-line rule (vertebrates/cephalopods only) maximizes welfare overall.  

  All license ignoring insects but diverge on foundations—e.g., the implicit theory rejects consequentialism.

  ### The Replacement Test (~250 words)
  Adopting expected-value-plus-precaution would require:  
  1. **Review all insect protocols**: Estimate P(sentience) for each species (e.g., higher for bees than flies), model welfare impacts (duration × intensity), and multiply by N.  
  2. **Harm-benefit for pesticides/farming**: Quantify trillions of insect lives against crop yields or protein output.  
  3. **Precautionary bans**: Where P(sentience) is non-negligible (e.g., bees), prohibit severe harms (boiling, gassing) absent overwhelming benefit.  

  **Bite-back/absurdities**:  
  - **Bureaucratic collapse**: Reviewing every ant experiment or agricultural spray.  
  - **Unresolvable uncertainty**: Endless debates over P(sentience) for 1 million insect species.  
  - **Perverse incentives**: Defunding cancer research using fruit flies to avoid ethical scrutiny.  
  - **Moral absurdities**: Spending $1B to avoid "probable suffering" of locusts while human poverty persists.  
  - **Paralysis**: Farming insect protein might become *less ethical* than beef if P(sentience) is high—undermining sustainability goals.  

  The implicit theory avoids this by treating insects as insentient *a priori*; the replacement forces agonizing trade-offs with no clear endpoint.
