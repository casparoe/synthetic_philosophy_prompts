prompt: |-
  I'm in the upper sixth and run my school's history and politics society — about sixteen of us, years 11 to 13 — and I have one forty-five-minute lunchtime slot to fill. I want them to feel, rather than be told, how much of a forecast about the future of a state is settled before any evidence is weighed, simply by the choice of which past cases it gets compared to.

  Please design a runnable game for that slot. My one strong constraint is that the case should be invented rather than historical: a made-up seventy-year-old maritime confederation, say, with a written constitution, a recent decisive naval victory and a succession dispute, so that nobody can win by knowing how it turned out and nobody can argue about what really happened in 476 or 1947.

  What I have in mind, though you should improve on it, is that members first commit privately to a forecast about whether the confederation survives another fifty years on the strength of the details I hand them; then have to choose, before anything is resolved, between two drawers of past cases with very different survival rates — all long-lived states as against all maritime confederations, perhaps — with the base rates fixed in advance and printed inside each drawer; and then discover that one further true detail about the same confederation files it just as naturally under a third drawer whose rate points the other way. Stakes should be trivial — a tally or house points, nothing that needs real money — and there should be no lecture up front: I don't want anyone hearing the terms reference class, base rate or outside view until after the debrief.

  Give me the rules, the materials, the payoffs, and what each person physically does and when; then a debrief that maps particular moments in the room onto particular parts of the idea. Tell me what will predictably go wrong the first time I run it — I suspect someone will pick the drawer that merely rationalises the forecast they already gave — and how I should handle it. Be frank about which feature of the outside view the game cannot stage and which I will simply have to say out loud, and tell me what would change your mind about the design: what result in the room would convince you the game had taught the wrong lesson.
reasoning: |-
  We are designing a game to illustrate how the choice of reference class (which past cases we compare to) can predetermine a forecast about the future of a state, even before examining the evidence in detail.

  The setting: a fictional maritime confederation called "The Veridian League" (we'll invent details). The key points we want to convey:
  1. Participants will make an initial forecast about the League's survival for 50 years.
  2. They will then choose between two drawers (or envelopes) of past cases, each with a pre-printed base rate (survival rate) for that category. The two categories should be constructed such that one has a high survival rate and the other low, and both can be argued to be relevant to the Veridian League.
  3. After seeing the base rates, they will get one more detail about the Veridian League that makes it fit just as naturally into a third category (with a base rate that points the opposite way).

  The game should run in 45 minutes. We'll break it down:

  **Materials:**
  - Handout 1: Introduction to the Veridian League (with some key facts)
  - Two envelopes (or labeled boxes) for the two initial reference classes. Inside each envelope, a card with the base rate for that class and a list of the states in that class (with their outcomes). The two classes should be:
      - Class A: "Long-lived states" (with a high survival rate, e.g., 80% survived 50+ years)
      - Class B: "Maritime confederations" (with a low survival rate, e.g., 20% survived 50+ years)
  - Handout 2: Revealing the third reference class and its base rate (which should be the opposite of the one they chose). We'll also include one additional detail about the Veridian League that makes it fit this third class.

  **Setup:**
  We need to invent the Veridian League and the reference classes.

  **The Veridian League:**
  - A maritime confederation formed 70 years ago.
  - Written constitution established at founding.
  - Recently won a decisive naval victory against a rival power (the "Battle of the Crimson Straits").
  - Currently facing a succession dispute: the current High Admiral is old and has no clear heir; two powerful factions (the Eastern and Western Fleets) are vying for control.

  **Reference Classes:**
  1. **Class A: Long-lived States**  
     Definition: States that have existed for at least 70 years at the time of prediction.  
     Base rate: 80% survived for at least 50 more years.  
     Example states (fictional): 
        - The Grand Duchy of Albion (survived)
        - The Kingdom of Solara (survived)
        - The Empire of Suntria (survived)
        - The Republic of Norda (collapsed)
        - ... (total 10 states, 8 survived, 2 collapsed)

  2. **Class B: Maritime Confederations**  
     Definition: Confederations that had a significant maritime component and were formed by a treaty.  
     Base rate: 20% survived for at least 50 more years.  
     Example states (fictional):
        - The Azure Alliance (collapsed)
        - The Sea Pact (collapsed)
        - The Coastal League (collapsed)
        - The Island Federation (survived)
        - ... (total 10 states, 2 survived, 8 collapsed)

  3. **Class C: States with a Succession Crisis**  
     Definition: States that faced a succession dispute without a clear heir at the time of prediction.  
     Base rate: 25% survived for at least 50 more years (so low).  
     But note: we want this to be the third class that we reveal later. We will also provide an additional detail that the Veridian League is facing a succession crisis (which they already know) but now we emphasize it and note that this class has a low survival rate.

  However, note that the initial handouts for Class A and B do not mention the succession crisis? Actually, the initial handout about the Veridian League does mention the succession dispute. So the twist is that they already have information that would allow them to classify it in Class C, but they are initially offered only two drawers (A and B) to choose from. Then, after they choose, we reveal that there is a Class C (which they might have considered) and that the base rate for Class C is low (25%). And we note that the Veridian League fits Class C just as naturally.

  Alternatively, we can structure it so that the initial two classes do not explicitly hinge on the succession crisis (so Class A and B are about longevity and maritime nature, respectively). Then the additional detail we reveal later is not new, but we reframe it to show that the succession crisis is the dominant factor and that Class C is the most relevant.

  But the initial information about the Veridian League already includes the succession dispute. So we don't need to reveal a new fact, but rather we reframe the existing fact by pointing out that there is a reference class for states with succession crises and that it has a low survival rate.

  **Game Flow:**

  1. **Introduction (5 minutes):**  
     - Explain that they are going to make a forecast about the future of a fictional state, the Veridian League. Hand out "Handout 1" which describes the League (with the details above).  
     - Ask each participant to privately write down their initial forecast: "Do you think the Veridian League will survive for at least 50 more years? Yes/No." and also a confidence level (e.g., 60%, 70%, etc.) if time permits. But to keep it simple, we might just do a binary vote.

  2. **Choosing a Reference Class (10 minutes):**  
     - Present two envelopes (or boxes) labeled:  
          Envelope A: "Long-lived States"  
          Envelope B: "Maritime Confederations"  
     - Explain: "Each envelope contains a list of historical states that fit that category and the base rate of survival for 50 years for that category. You must choose one envelope to open and use that base rate to update your forecast."  
     - They must choose one envelope as a group? Or individually? Since it's a society, we can have a group discussion and then vote on which envelope to open. Or we can do it individually to see individual choices. However, we want to avoid one person dominating. Let's do it as a group: they discuss and then vote by show of hands for which envelope to open.  
     - After the vote, open the chosen envelope and reveal the base rate and the list of states (with outcomes).  
     - Ask them to update their forecast: "Given this base rate, what is your new forecast? Do you change your initial view?" They can note this privately.

  3. **The Twist (10 minutes):**  
     - Hand out "Handout 2". This says:  
          "But wait! There is another reference class that the Veridian League fits: States that are facing a succession crisis without a clear heir. We have data on this class as well. The base rate for this class is 25% (only 1 in 4 such states survive 50 more years)."  
     - Then it adds: "Moreover, note that the Veridian League's succession crisis is particularly acute because the two factions (Eastern and Western Fleets) are both powerful and have a history of rivalry."  
     - Ask them to update their forecast again.

  4. **Discussion and Debrief (20 minutes):**  
     - Lead a discussion about what happened.  
     - Key points to draw out:  
          - Their initial forecast was likely based on a narrative (the recent victory might make them optimistic, the succession crisis might make them pessimistic).  
          - When they chose a reference class, they were essentially choosing which base rate to apply.  
          - The choice of reference class was arbitrary? Why did they pick one over the other?  
          - Then, the third reference class was just as relevant (if not more) and pointed in the opposite direction.  
     - Now introduce the terms:  
          - Reference class: the category of past cases we are comparing to.  
          - Base rate: the historical frequency of the outcome in that reference class.  
          - Outside view: the approach of using base rates from a reference class to make a forecast, as opposed to the inside view (which focuses on the specific details of the case).  
     - Point out that the forecast was heavily influenced by which reference class they chose, even before they looked at the specific evidence about the Veridian League.

  **Payoffs:**  
  We can use a simple scoring:  
  - At the start, they get 1 point for making a forecast (just for participating).  
  - If they update their forecast in the direction of the base rate after opening the envelope, they get 1 point.  
  - If they update again after the twist, they get 1 point.  
  But note: we don't know the right answer (it's fictional and we don't resolve it). So we can't score based on correctness. Instead, we want to reward updating appropriately to the base rates. However, we don't want to force them to update if they have a good reason not to.

  Alternatively, we can avoid points and just have a discussion. Or we can have a show of hands at each stage and track the shifts.

  **What might go wrong?**  
  - Participants might not update their forecasts because they are anchored to their initial view.  
  - They might pick the envelope that confirms their initial forecast (confirmation bias). For example, if they initially think the League will survive, they pick the envelope with the high base rate.  
  - They might argue that the third reference class is not as relevant (so they don't update).  

  **How to handle it?**  
  - In the debrief, explicitly point out if they fell into confirmation bias.  
  - Ask: "Did anyone choose the envelope because they thought it would confirm what they already believed?"  
  - Also, if they resist updating when the third class is revealed, ask: "Why is this class less relevant? What makes a reference class relevant?"  

  **What the game cannot stage:**  
  The game cannot perfectly replicate the idea of the "outside view" because in reality, we don't have pre-defined reference classes with known base rates. The key step of selecting the appropriate reference class is a matter of judgment and debate, and the game simplifies by offering two (and then a third). Also, the game does not address how to combine multiple reference classes. We are just illustrating the effect of the choice.

  You will have to say out loud:  
  - That in reality, we don't have drawers with pre-calculated base rates; we have to construct the reference class and that construction is often subjective.  
  - The outside view is a tool to counteract the inside view (which focuses on the unique details and narrative of the case).  

  **What would change my mind about the design?**  
  If the participants, after the game, conclude that the exercise shows that base rates are useless because you can always find a reference class to support any conclusion, then the game would have taught the wrong lesson. The intended lesson is that we should be aware of the influence of reference class selection and that we should try to use the outside view to correct for our narrative biases. If they come away more skeptical of all forecasting, that might be acceptable, but if they reject the outside view entirely, that would be a failure.

  To avoid that, in the debrief, emphasize:  
  - The outside view is not a crystal ball, but it is a way to ground predictions in historical reality.  
  - It is a starting point that should be adjusted by the specific details (the inside view) but only when there is strong evidence that the case is exceptional.  
  - The key is to choose the reference class that is most relevant, and that requires careful thought and avoiding confirmation bias.

  **Revised Timeline:**
  - 0-5 min: Introduce the Veridian League, initial forecast (private).
  - 5-15 min: Choose and open one envelope, update forecast.
  - 15-25 min: Reveal the third reference class and base rate, update again.
  - 25-45 min: Discussion and debrief.

  **Materials in Detail:**

  **Handout 1: The Veridian League**  
  The Veridian League is a maritime confederation formed 70 years ago by the Treaty of Veridia. It comprises several island and coastal states that banded together for mutual defense and trade. The League has a written constitution that establishes a rotating leadership (the High Admiral) elected by a council of representatives from each member state. The current High Admiral, Borin the Elder, is 78 years old and has held the position for 20 years. He has no clear heir, and a dispute has arisen between two factions: the Eastern Fleet (led by Admiral Kael) and the Western Fleet (led by Admiral Ryna). These factions have been rivals for decades, but they united under Borin to achieve a decisive naval victory against the rival Kingdom of Malkar two years ago (the Battle of the Crimson Straits). Despite this victory, tensions between the fleets are rising as Borin's health declines.

  **Envelope A: Long-lived States**  
  Inside:  
  "Reference Class: States that have existed for at least 70 years at the time of prediction.  
  Base Rate: 80% of such states survived for at least 50 more years.  
  Examples:  
     - Grand Duchy of Albion (founded 150 years ago, survived)  
     - Kingdom of Solara (founded 200 years ago, survived)  
     ... (list of 10, 8 survived, 2 collapsed)  
  Note: These states are diverse in geography and government form."

  **Envelope B: Maritime Confederations**  
  Inside:  
  "Reference Class: Maritime confederations formed by treaty.  
  Base Rate: 20% of such confederations survived for at least 50 more years.  
  Examples:  
     - Azure Alliance (collapsed after 12 more years)  
     - Sea Pact (collapsed after 5 more years)  
     ... (list of 10, 2 survived, 8 collapsed)  
  Note: These confederations often faced internal divisions and external threats."

  **Handout 2: The Third Reference Class**  
  "You have considered the Veridian League in terms of either long-lived states or maritime confederations. However, there is another reference class that is equally, if not more, relevant: States facing a succession crisis without a clear heir.  
  Base Rate: 25% of such states survived for at least 50 more years.  
  The Veridian League is currently in the midst of such a crisis. The rivalry between the Eastern and Western Fleets is deep-rooted and has only been kept in check by High Admiral Borin. With his impending death and no clear successor, the League faces a critical test.  
  Does this change your forecast?"

  **Running the Game:**
  - Make sure the two envelopes are prepared and sealed until the vote.
  - Have handouts ready.
  - During the group vote for the envelope, encourage a brief discussion (2-3 minutes) and then vote by show of hands.

  **Debrief Questions:**
  - How many of you changed your forecast after seeing the base rate from the envelope? Why?
  - Why did the group choose that particular envelope? Was it because it matched your initial feeling?
  - How did you feel when the third reference class was introduced? Did you think it was more relevant? Less?
  - What does this tell us about how we make predictions?

  Then introduce the terms and the concept of the outside view.

  This design should fit the time and achieve the goal of illustrating the idea.
answer: |-
  Below is a runnable 45-minute game designed for your history and politics society. It uses a fictional **70-year-old maritime confederation called the Aurorian League** to illustrate how the choice of reference class predetermines forecasts. The game avoids historical cases to prevent prior knowledge biases, and it emphasizes *experiencing* the problem over lecturing. The debrief links game moments to concepts like reference class neglect and base rates.

  ### **Game Summary**
  - **Objective**: Players forecast whether the Aurorian League survives 50 more years. They commit privately, then choose between two reference classes (drawers) with fixed survival rates, and finally confront a third reference class that reframes the same details.
  - **Core Insight**: The initial choice of reference class (e.g., "long-lived states" vs. "maritime confederations") dominates the forecast, and the same facts can fit opposing classes.
  - **Stakes**: Players earn "Aurorian Points" (tallies on paper; convertible to house points). Points reward calibration (updating forecasts based on new base rates), not accuracy.
  - **Time Allocation**: 
    - Setup (2 min)
    - Forecast 1: Initial private commitment (3 min)
    - Reference Class Selection (10 min)
    - Forecast 2: Update after drawer choice (5 min)
    - Twist: Third reference class reveal (5 min)
    - Forecast 3: Final update (5 min)
    - Debrief (15 min)

  ---

  ### **Materials Needed**
  1. **Handout 1: Aurorian League Overview** (1 per player)  
     *Text*:  
     > The **Aurorian League** is a 70-year-old maritime confederation of island-states, bound by a written constitution. It has a collective leadership council ("The Admiralty") and relies on naval power.  
     > **Key Details**:  
     > - Founded after a rebellion against the Coral Empire.  
     > - Constitution mandates shared power but lacks clear succession rules.  
     > - **Recent Triumph**: Won a decisive naval victory against the Sable Armada 5 years ago, securing trade routes.  
     > - **Current Crisis**: The aging Grand Admiral is ill. Two factions vie for control—the militaristic "Steel Tides" (led by Admiral Varek) and the trade-focused "Silver Currents" (led by Commodore Lena). Public unrest is rising.  
     > *Forecast Question: Will the Aurorian League survive intact for 50 more years?*

  2. **Two Drawers (or Envelopes)** labeled:  
     - **Drawer A**: "States Surviving 70+ Years"  
     - **Drawer B**: "Maritime Confederations"  
     *Inside each drawer*: A card with the **base rate** and **example states** (all fictional).  
     - **Drawer A Card**:  
       > **Reference Class**: States lasting 70+ years (n=20).  
       > **Base Rate**: 85% survived 50+ more years.  
       > *Examples*: The Sunken Kingdom (survived), Republic of Veridia (survived), Dominion of Tides (collapsed)...  
     - **Drawer B Card**:  
       > **Reference Class**: Maritime confederations (n=20).  
       > **Base Rate**: 20% survived 50+ more years.  
       > *Examples*: The Azure Pact (collapsed), Isles Federation (collapsed), Coral League (survived)...  

  3. **Handout 2: The Twist** (1 per player)  
     *Text*:  
     > **New Reference Class Reveal**: States with a recent decisive military victory AND a succession dispute.  
     > **Base Rate**: 90% collapsed within 50 years (n=20).  
     > *Examples*: The Crimson Armada (collapsed), Silver Helm Confederacy (collapsed), Pearl Dominion (survived)...  
     > **Recontextualized Aurorian Detail**: The League’s naval victory (5 years ago) and succession crisis fit this class. Victory created factional rivalries, making the dispute more volatile.  

  4. **Player Tracking Sheets** (1 per player):  
     | Forecast Stage | Your Prediction (Survives/Collapses) | Confidence (1-5) | Points Earned |
     |---------------|--------------------------------------|------------------|--------------|
     | 1 (Initial)   |                                      |                  | +1           |
     | 2 (Post-Drawer)|                                     |                  | +1 if updated|
     | 3 (Post-Twist)|                                     |                  | +1 if updated|  

  5. **Other Supplies**: Pens, a whiteboard to tally group choices, a timer.

  ---

  ### **Game Rules and Flow**
  **Step 1: Setup (2 min)**  
  - Distribute Handout 1 and Tracking Sheets.  
  - Explain: *“We’re forecasting the future of the Aurorian League. No prior knowledge needed—this is fictional. Your goal is to earn points by making thoughtful predictions.”*  
  - **No lecture**—avoid terms like “base rate” or “reference class.”  

  **Step 2: Forecast 1—Initial Private Commitment (3 min)**  
  - Players privately answer: *“Will the League survive 50 more years? (Yes/No) and rate confidence (1=low, 5=high).”*  
  - **Payoff**: +1 point to all for committing.  

  **Step 3: Reference Class Selection (10 min)**  
  - Present the two drawers. Say: *“Each drawer contains data from past states. As a group, pick ONE to inform your forecasts. You have 5 min to discuss, then vote.”*  
  - **Group Discussion**: Players debate which drawer is more relevant. *Do not open drawers yet.*  
  - **Vote**: Majority vote determines the chosen drawer. Open it and read the card aloud.  
  - **Key Tension**: Drawer A (85% survival) incentivizes optimism; Drawer B (20% survival) incentivizes pessimism.  

  **Step 4: Forecast 2—Update After Drawer (5 min)**  
  - Players privately update predictions and confidence on their sheets.  
  - **Payoff**: +1 point if they change their forecast (any direction) based on the drawer’s base rate.  

  **Step 5: The Twist (5 min)**  
  - Distribute **Handout 2**. Say: *“Here’s another way to view the League, using details you already know.”*  
  - Emphasize: The naval victory and succession dispute are reframed, not new facts.  

  **Step 6: Forecast 3—Final Update (5 min)**  
  - Players update predictions/confidence again.  
  - **Payoff**: +1 point if they change based on the twist.  

  **Step 7: Tally Points**  
  - Collect sheets. Award points (e.g., 3 max). Announce: *“Highest scorers: [Names]. Points are redeemable for house points.”*  

  ---

  ### **Debrief (15 min)**  
  **Link game moments to the core idea without jargon first**. Then introduce terms.  
  1. **Initial Forecasts**: *“Your first predictions were ‘inside view’—focused on Aurorian details like the naval win or succession crisis. Some saw the win as strength; others saw the crisis as weakness. This is narrative thinking.”*  
  2. **Drawer Choice**: *“You picked one reference class—long-lived states (A) or maritime confederations (B). This choice settled your forecast before weighing evidence. If you picked A, you likely became optimistic; B, pessimistic. But why did you pick one over the other?”*  
     - Reveal the unchosen drawer’s base rate to show the opposite incentive.  
     - **Introduce terms**: *“This is the reference class problem. Picking a class imposes its base rate—the historical survival rate—on your forecast. You did this yourselves when you updated after opening the drawer.”*  
  3. **The Twist**: *“Handout 2 reframed the same facts under a new class (states with wins + disputes). It had a 90% collapse rate—opposite to Drawer A. Yet it felt just as natural. This shows reference classes are arbitrary. The facts don’t change, but the comparison does.”*  
  4. **Key Insight**: *“Forecasts are often locked in by which past cases we compare to, not the evidence. We gravitate to classes that feel right, but ‘feel’ is subjective. This is why experts disagree: they use different reference classes.”*  
  5. **Broader Context**: *“In history/politics, this happens with real cases. E.g., forecasting Ukraine’s future? Compare to ‘countries invaded by Russia’ (low survival) or ‘resilient democracies’ (high survival). The choice dictates the answer.”*  

  ---

  ### **What Will Predictably Go Wrong (and How to Handle It)**  
  1. **Problem**: Players pick the drawer confirming their initial forecast (e.g., optimists choose Drawer A).  
     - **Why**: Confirmation bias. They’ll say, “Long-lived states are more relevant!” to justify prior beliefs.  
     - **Handling**: In debrief, ask: *“Did anyone choose a drawer because it matched your first guess? Did the group dismiss the other drawer too quickly?”* Highlight that the twist class—which contradicts both—proves relevance is subjective.  

  2. **Problem**: Players resist updating after the drawer or twist.  
     - **Why**: Anchoring to initial views or overconfidence in narratives (“But the naval victory changes everything!”).  
     - **Handling**: Award points for updating to incentivize behavior. In debrief, ask: *“Who ignored the base rates? Why? Did the Aurorian details feel too unique to compare?”*  

  3. **Problem**: Debate over which reference class is “correct.”  
     - **Why**: Players instinctively seek a single “right” answer.  
     - **Handling**: Redirect: *“The point isn’t which class is best—it’s that switching classes reverses forecasts. In reality, we’d weigh multiple classes, but we rarely do.”*  

  ---

  ### **What the Game Cannot Stage (Requires Verbal Explanation)**  
  - **Combining Reference Classes**: The game stages three isolated classes, but reality demands synthesizing multiple classes. You must say:  
    > *“In practice, forecasts should use multiple reference classes and adjust for differences (e.g., ‘Aurorian is a maritime confederation BUT has a written constitution, which improves survival’). But we default to one class because it’s simpler—and that’s dangerous.”*  

  - **Subjectivity in Class Construction**: The game fixes base rates in advance, but real ones are contested. Say:  
    > *“Historians argue about what counts as a ‘similar’ case. E.g., Is the Aurorian League more like medieval maritime states or modern federations? That debate is where bias creeps in.”*  

  ---

  ### **What Would Make Me Rethink the Design**  
  If **>50% of players resist updating after the drawer/twist and insist their initial forecast was “obvious” based on Aurorian details**, it would signal the game taught the *opposite* lesson—that narratives trump base rates. This would occur if:  
  - Players dismiss the drawers as “irrelevant history” and double down on the “inside view.”  
  - The group’s discussion amplifies narrative biases (e.g., “Winning a naval battle always prevents collapse!”).  

  **Why this is problematic**: It reinforces the very instinct the game aims to challenge—that detailed analysis of the case outweighs historical patterns. If this happens, add a mid-game prompt: *“When updating, ask: Would I bet against this base rate with real money? Why?”* to force engagement.  

  ---

  ### **Why This Design Works**  
  - **Experiential Learning**: Players *feel* the forecast shift as drawers open, making the abstract concrete.  
  - **Constraint-Friendly**: Uses fictional cases, trivial stakes, and no upfront theory.  
  - **Predictable Flaws**: Drawer choice and update resistance are teachable moments.  
  - **Debrief Bridges to Reality**: Explicitly links Aurorian moments to concepts like confirmation bias and base rate neglect.  

  **Final Tip**: Run it with colleagues first. Time the stages; adjust discussion lengths if needed. The key is keeping it snappy—players should leave unsettled about how easily forecasts are manipulated.
