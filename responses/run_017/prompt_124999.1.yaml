prompt: |-
  hey — I'm the night charge nurse on a locked memory-care floor, 28 residents, mostly mid-to-late stage Alzheimer's with a couple of vascular dementia, and my aides make maybe forty of these calls a shift. Our written policy is one line, something like "use therapeutic truth-telling and avoid causing distress," which everyone reads differently, so I want to replace it with an actual procedure.

  The reason I'm asking you and not a textbook: someone told me Augustine held that every deliberate lie is a sin, including lies that would save a life, but that you're allowed to simply *not say* things — concealing the truth isn't lying — and that what makes an utterance a lie is the will to deceive rather than the falsity of the sentence. That sounds weirdly workable at 3am, and I'd rather build the card around it than around "do the kindest thing," which is what got us into this mess.

  So: a decision procedure that fits on one side of a laminated index card. Max four or five steps, runnable in about fifteen seconds, by an aide who's been on the job three weeks and is being pulled down a hallway by someone who thinks she's late for work. For each step: the question asked, what counts as a good enough answer, where the card stops with a hard NO, and where it hands the call up to me or to the family because it's a values question and not a fact question.

  Four situations I dont know where to put in the tree, and I want them placed, not just discussed:

  - borrowed voice: the daughter texts "tell mom I'll be there Sunday," she isn't coming, and the aide says "your daughter says she'll be here Sunday." Nothing false is being said about what the daughter said, but the point of saying it is that mom believes she's coming.

  - standing fictions: we have a painted bus stop by the exit door and two therapy dolls in the day room. Nobody asserts anything; the room is just arranged to produce a belief. Is that even the card's business?

  - drift: a resident asks something perfectly coherent inside 1961 — "has my husband finished at the yard?" — where any true answer is either noise to her or a fresh bereavement. Can the procedure allow answering a different question that happens to be true?

  - ninety-second uptake: if she won't remember this exchange in two minutes and may not be tracking the sentence at all, does the intent-to-deceive test get off the ground? I don't want a rule that quietly amounts to "it's fine if they won't remember."

  Also give me three memorizable sentence-frames that pass the procedure for "where is X / when is X coming," since that's most of the volume.

  Then run the finished card on three cases: (1) Mrs. K, 3am, wants to know when her mother is picking her up; her mother died in 2001. (2) Mr. R, about to get a catheter change he's had before and hated, asks "is this going to hurt?" — it will. (3) Mrs. O's son died in a crash last month; she forgets within ten minutes and grieves it as new each time; the family has asked us to tell her he's fine.

  One more thing: I gather Augustine also grades lies, worst to nearly-excusable, instead of just banning them in one lump. Tell me whether that grading belongs on the card at all, or whether it's only good for how we write up an incident afterward — and if it's the latter, what we'd actually use it for.

  Finally, be straight with me about what the procedure can't do: which of these it will spit out an answer on that I'll then have to overrule, and which calls genuinely need a person's signature.
reasoning: |-
  Okay, this is a really thoughtful query from a night charge nurse in a memory care unit. They're dealing with constant ethical dilemmas around truth-telling with dementia patients and want a practical decision tool based on Augustine's distinction between lying and concealment. 

  First I need to unpack their core request: they want a laminated card procedure that's both philosophically grounded and nurse-proof at 3am. The Augustine framework they mentioned is actually perfect here - focusing on intent to deceive rather than factual falsity. That's clinically sound too since dementia patients often respond more to emotional tone than literal content.

  Hmm... the four edge cases they mentioned are telling. The "borrowed voice" one is tricky - it's technically truthful but manipulative. I think that fails the intent test because the aide knows the daughter isn't coming. For the painted bus stop, that's environmental design, not speech, so it shouldn't be on the card. Good catch by them to question that boundary.

  The historical coherence problem ("has my husband finished at the yard?") is where this framework shines. You can truthfully answer "he's not here right now" which addresses her underlying anxiety without deception. The ninety-second memory lapse... oof. That's ethically fraught. Even if they won't remember, the moment of distress matters. Can't use cognition as an excuse.

  For the sentence frames, I'll pattern them after validation therapy techniques - redirect to present safety while staying truthful. "I'm here with you now" type phrases. The three test cases they provided are excellent stress tests for the procedure.

  On Augustine's grading of lies - that's useful for incident documentation but too nuanced for the card. When an aide violates procedure, understanding whether it was malicious vs. compassionate helps determine corrective action. But for real-time decisions? Binary works better.

  Biggest limitation I see: family directives that conflict with ethics. Like Mrs. O's son - the procedure will flag that as deception, but families sometimes insist. That needs the nurse's override. Also, pain questions ("will this hurt?") require radical honesty - the card must be clear nothing justifies lying about physical discomfort.

  ...I'm now imagining this nurse at 3am with a crying resident pulling their sleeve. The card needs to work in that scenario. Steps should fit on fingers: 1) Intent check 2) Harm assessment 3) Concealment options 4) Escape hatch for values conflicts. Red/yellow/green lighting like traffic signals.

  For Mrs. K: "Your mother isn't able to come, but I'm right here with you" - green lights because true and avoids deception. Mr. R's pain question must be truthful - that's non-negotiable. Mrs. O's case stops at red - requires family conference. 

  The laminated card won't solve everything. Some decisions will always need a human signature - when truth causes catastrophic distress, when families disagree, or when environmental fictions (like that bus stop) become contested. But for 80% of "where's my daughter?" calls? This should standardize care while keeping souls clean.
answer: |-
  Here’s a practical, Augustine-inspired decision procedure for truth-telling in dementia care, designed for your 3am reality. The core principle: **Deception (intending to create false belief) is prohibited; concealment (omitting/redirecting without falsehood) is permitted.**  

  ---

  ### **The Laminated Card Procedure**  
  *(4 Steps, 15 Seconds)*  

  1. **ASK: "AM I SPEAKING A FALSEHOOD?"**  
     - *Good enough:* "No" → Proceed to Step 2.  
     - *Hard NO:* "Yes" → STOP. Do not say it. Redirect or defer.  
     - *Example:* "Your mother is picking you up" (when dead) → FALSE → STOP.  

  2. **ASK: "IS MY *INTENT* TO DECEIVE?"**  
     - *Good enough:* "No" → Proceed to Step 3.  
     - *Hard NO:* "Yes" → STOP. Find a true alternative.  
     - *Clarifier:* Intent = Aiming for them to believe something untrue.  
     - *Example:* Borrowed voice ("Daughter says she’s coming Sunday") → INTENT TO DECEIVE (about visit reality) → STOP.  

  3. **ASK: "WILL TRUTH CAUSE IMMEDIATE, SEVERE HARM?"**  
     - *Good enough:* "No" → Answer truthfully, kindly.  
     - *Hand up:* "Yes" → Use Step 4 (concealment/redirect).  
     - *Harm defined:* Panic, violence, or medical risk (e.g., refusing critical meds). Not temporary distress.  

  4. **CONCEAL OR REDIRECT TRUTHFULLY**  
     - *Options:*  
       - Omit ("Let’s talk about that later"),   
       - Redirect ("You’re safe here with me tonight"),  
       - Answer *their emotion* not the question ("You miss him, don’t you?").  
     - *Hand up:* If they insist on an answer → Contact nurse/family.  

  ---

  ### **Edge Case Placement**  
  - **Borrowed Voice:** Fails at Step 2 (*intent to deceive* about the visit, not the message).  
  - **Standing Fictions:** Not the card’s business (non-verbal environment; no *utterance* to assess).  
  - **Drift (1961 questions):** Use Step 4. Redirect: *"He’s not here right now, but you’re safe."* (True then and now).  
  - **90-Second Uptake:** Still follow steps. Intent/harm tests apply *in the moment*; distress matters even if forgotten.  

  ---

  ### **3 Sentence Frames for "Where/When is X?"**  
  1. **"They’re not here right now, but *you’re safe with me*."**  
     (Conceals absence; affirms safety.)  
  2. **"I don’t know when they’ll come, but *I’ll keep you company*."**  
     (Truthful uncertainty + redirection.)  
  3. **"Let’s check together later. *Right now, let’s...* [get tea / sit in garden]."**  
     (Defers + redirects to present activity.)  

  ---

  ### **Test Cases**  
  1. **Mrs. K (3am, mother died):**  
     - Step 1: Saying "She’s coming" → FALSE → STOP.  
     - Step 4: Redirect → *"It’s nighttime now. Let’s get you cozy, and I’ll sit with you."*  

  2. **Mr. R (catheter change):**  
     - Step 1: "Yes, it may hurt briefly" → TRUE → Proceed.  
     - Step 2: No intent to deceive (truth prepares him) → Proceed.  
     - Step 3: Harm? Truth prevents mistrust → Answer: *"It might pinch, but we’ll go fast. Squeeze my hand."*  

  3. **Mrs. O (son died, family says "he’s fine"):**  
     - Step 1: "He’s fine" → FALSE → STOP.  
     - Hand up: Values conflict → Contact nurse/family.  

  ---

  ### **Augustine’s Lie Grading: For Documentation, Not the Card**  
  - **Use post-incident:** Distinguish "malicious lie" (fireable) vs. "compassionate falsehood" (training opportunity).  
  - **Documentation shorthand:**  
     - Grave Sin: Deliberate deception for convenience.  
     - Venial: Urgent harm prevention (e.g., "Your knife is lost" to prevent violence).  
  - **Not for real-time:** Overcomplicates; card’s "NO" covers all deception.  

  ---

  ### **What the Procedure *Can’t* Do**  
  1. **Override family directives** → Requires your judgment (e.g., Mrs. O).  
  2. **Resolve "no good answer" scenarios** → When truth causes severe harm *and* concealment fails → Needs your intervention.  
  3. **Absolve emotional burden** → Aides may still feel guilt redirecting; debrief with them.  
  4. **Replace human connection** → The card ensures ethical speech, not therapeutic presence.  

  **Final note:** This builds guardrails, not robots. It stops deception, not compassion. When the card says "hand up," it’s not failure—it’s protecting your team from impossible solo decisions. You’ll overrule rarely (mainly family pressure vs. ethics), but sleep better knowing aides aren’t bearing that weight alone at 3am.
