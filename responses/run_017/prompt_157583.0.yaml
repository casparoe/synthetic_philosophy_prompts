prompt: |-
  I chair the collections committee of a mid-sized city museum — roughly 120,000 objects, of which perhaps 4,000 fall within the periods and regions that restitution claims concern. We receive four to six inquiries or claims a year. Our capacity is two registrars, a shared conservator, and no in-house lawyer; outside legal advice is billed by the hour and the board resents paying for it. Triage has to happen within a week of an inquiry arriving, and any recommendation to return has to reach the board's collections subcommittee, which meets quarterly, as a file a non-specialist trustee can read in twenty minutes.

  Please write me a decision procedure my committee can actually run: the questions in the order we should ask them, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it hands the decision to a person because the question is one of values rather than facts. Build it on the following positions, which the committee has argued itself into over the last two years and which I want the procedure to honour rather than reopen:

  a) The anti-washing rule: a later good-faith purchase does not cure an originally tainted taking while the dispossession is still live — that is, within the living memory of the community concerned, or before a genuine change in the political relation between that community and the power that took the object. Work out how "live" is to be determined on our records, and what to do when the record is silent.
  b) Burden of proof: for anything acquired under a colonial administration with an incomplete chain, the gap counts against us rather than against the claimant. Silence in our own documentation is evidence, not neutrality.
  c) Authorisation by an occupying or imperial power does not by itself make a removal legitimate — but tell me what work, if any, a surviving document of permission can still do in the procedure.
  d) Capacity: where the receiving institution's storage or conservation weaknesses are traceable to the same historical relation as the taking, they cannot be made a condition of return. Remediation is something we fund, not something we require. Where the weaknesses are not so traceable, decide whether and how much they may count.
  e) Display value: any argument from what the object teaches in our galleries has to survive a surrogate test — could we teach the same thing with a replica, a digital surrogate, or the documentation together with the story of the object's removal? Decide what passes and what fails, and say who judges.
  f) Role reversal: any condition we attach to a return must be one we would accept if the roles were reversed.
  g) Claimants: continuity of grievance matters more than formal state locus. A body that has carried the claim forward and is recognised by the community should count even without state backing. Tell me what to do when two such bodies claim the same object, and what to do when a state claims without them.
  h) Sets and parts: a "set" is our curatorial category more often than theirs. Say when a group may be divided and when it may not, and whether we may retain a token piece.

  At every fork where reasonable people could go either way, commit to one branch and give your reason. I do not want a menu of options with their trade-offs; I want a procedure with your choices baked in, each with a one-line note saying that a reasonable committee could have gone the other way and why you went yours. Where a step is irreducibly a value judgement, mark it as a place where the procedure stops and a person signs off, and say which person.

  Then run it on three live files:

  1. A Benin-type brass plaque bequeathed to us in 1938 by the family of a colonial officer, with a documented chain going back to the British punitive expedition that sacked Benin City in the 1890s. The claim comes from Nigeria's federal antiquities authority and from the court of the Oba. Tell me what paperwork is sufficient, what timing the procedure implies, and — this is the part the board will fight about — which conditions we may *not* attach. They will want a long-term loan back, a shared rotating display, and a delay until our digitisation project finishes. Say which of these the procedure blocks and why.
  2. A fragment of sculpture from the Parthenon, bought at auction in 1921 from a private collection, with a chain going back to the early nineteenth century but not to Elgin himself. The claim comes from the Greek state. The committee is split on whether the gap in our chain is our problem under (b), and on how much the permission documents from the imperial authority then in place are worth under (c). Commit. Also say how an architectural-reunification argument should be weighed against an encyclopedic-display argument at the display-value step.
  3. The one where I expect to dislike the answer. A carved figure bought from a dealer in 1961, whose file shows it was carved in the 1920s and sold by its maker, with nothing in the record connecting it to any taking; the claim comes from a national heritage body on the argument that all such material belongs to the national patrimony. My instinct is that refusing feels wrong and will read as special pleading. Tell me honestly whether the procedure returns a no here, and if it does, what the committee should say out loud when it says no.

  Finally, be explicit about what the procedure cannot do: where it will misfire, which claims it cannot adjudicate at all, and what we should do with those. We know the general shape of the restitution literature and do not need citations, bibliographies, or reading lists; what we lack is something we can run. Keep it to something my committee can hold to a few pages.
reasoning: |-
  Okay, the user chairs a museum collections committee dealing with restitution claims. They need a practical decision procedure based on established principles. Let me unpack their requirements.

  First, the museum's context: mid-sized with limited staff and resources. They handle 4-6 claims annually and must triage within a week. Final recommendations need to be digestible by non-specialist trustees in 20 minutes. The user emphasizes concrete steps over theoretical debates - they want an executable workflow.

  The committee has already settled on core positions (a-h) that must be hardcoded into the procedure. Key principles include:
  - Anti-washing rule (colonial acquisitions can't be legitimized by later sales)
  - Burden of proof favors claimants when records are incomplete
  - Occupier permissions don't automatically validate removals
  - Recipient's capacity issues can't block returns if historically linked to the taking
  - Display value must pass the "surrogate test"
  - Conditions must satisfy role reversal
  - Claimant legitimacy prioritizes community recognition over state authority
  - Set divisions respect source community perspectives

  For the procedure itself, I need to design a step-by-step flow with clear exit points. Where factual analysis ends and value judgments begin should be explicitly marked. The user wants decisive choices at every ambiguity, with brief justifications for each fork. 

  Important structural considerations:
  - Front-loaded triage to quickly identify non-viable claims
  - Burden of proof implementation that flips the script on documentation gaps
  - "Liveness" assessment that doesn't require perfect records
  - Handling of permission documents as potentially mitigating but not absolving
  - Surrogate test mechanics with clear pass/fail criteria
  - Claimant validation prioritizing continuity over formal status
  - Set division rules favoring source community definitions

  Then I'll test the procedure against three case studies. The Benin plaque seems straightforward - clear colonial looting, valid claimants. But the board's desired conditions (loan-backs etc.) will conflict with anti-washing and role reversal principles. The Parthenon fragment presents chain-of-custody ambiguities and display value debates. The 1961 carving case will likely trigger a "no" under the procedure, requiring careful messaging about why patrimony claims alone don't meet the burden.

  Finally, I must flag the procedure's limitations: it won't handle sovereignty disputes, scientifically unverifiable claims, or cases where all parties reject the outcome. The museum needs fallback protocols for these scenarios.

  Throughout, I'll maintain focus on executable steps while honoring the committee's hard-won principles. The output must be a living document - precise enough to prevent re-litigation of settled positions, flexible enough for real-world application.
answer: |-
  Here is a restitution decision procedure designed for your committee's capacity and principles. It operates in **5 Stages** with clear exits for "No" decisions and handoffs for value judgments. *Committee Chair* is the designated sign-off for value judgments unless specified.

  **Core Procedure:**

  **Stage 1: Initial Triage (Registrar Lead, 48 Hours)**
  1.  **Question:** Is the claimant identifiable and contactable? *Sufficient:* Valid contact info for an individual or organization.
  2.  **Question:** Does the claim clearly concern an object in our collection? *Sufficient:* Object ID or clear description matches our records.
  3.  **Question:** Is the claim based on events plausibly falling within the scope of our restitution policy (colonialism, conflict, illicit trafficking)? *Sufficient:* Claimant narrative or evidence suggests such context, even if preliminary. *Exit to No:* If answer to any is clearly "No". Claimant notified.

  **Stage 2: Historical & Provenance Assessment (Registrar/Curator Lead, 5 Working Days)**
  4.  **Question:** Was the object acquired under a colonial administration, during conflict, or from a known context of dispossession? *Sufficient:* Acquisition date/location aligns with such periods/powers, or claimant evidence indicates it. (*Burden (b) applied: Silence = evidence against us*).
  5.  **Question:** Is the dispossession "live" per (a)? *Sufficient:* Dispossession occurred within living memory of the source community OR before a genuine, sustained change in political relations between that community and the taking power. *Method:* Use our records first. If silent, assess claimant evidence & historical scholarship on the community's sustained connection/identity/grievance. *If "No":* Exit to No (e.g., ancient artifact, no sustained community link/grievance).
  6.  **Question:** Is there a documented chain of custody from acquisition back to the taking? *Sufficient:* Complete, verifiable documentation. (*Burden (b) applied: Gaps count against us*).
  7.  **Question:** Does documentation include "permission" from an occupying/imperial power? *Sufficient:* Document exists. *Work it does:* Noted, but under (c) **does not legitimize** removal. It *may* slightly reduce the severity assessment of the *taking method* but does **not** cure dispossession or overcome (a) & (b). *Reasonable Alternative:* Could argue permission is irrelevant. *Our Choice:* Acknowledges existence but minimal weight to avoid legitimizing illegitimate authorities.
      *   *If "No" to 4, 5, or 6:* Exit to No. *If "Yes" to 4 & 5 & Provenance Gap Exists:* Proceed (Burden (b) pushes towards Yes).

  **Stage 3: Claimant & Object Assessment (Registrar/Curator Lead, 5 Working Days)**
  8.  **Question:** Does the claimant represent the community subjected to the dispossession with continuity of grievance? *Sufficient:* Evidence the claimant body has carried the claim/grievance forward and is recognized by the affected community. *Formal state locus not required per (g)*.
      *   *If Two Claimants:* Proceed only if both agree OR one clearly has greater community recognition/continuity. If deadlock, consult Chair (Value Judgment).
      *   *If State Claims Without Community-Backed Body:* Assess if the state *is* the recognized representative *by the community*. If ambiguous or contested, consult Chair (Value Judgment). *Reasonable Alternative:* Prioritize state. *Our Choice:* Prioritizes community voice per (g).
  9.  **Question:** Is the object part of a "set" or larger entity? *Sufficient:* Assess based on source community's traditional understanding/use, not our curatorial category. *When to Divide:* Only if the claimant consents to division. *Token Piece:* Retain ONLY with explicit claimant consent. *Reasonable Alternative:* Could allow retention if integral to a display narrative. *Our Choice:* Respects source community's cultural integrity per principles.

  **Stage 4: Museum Context Assessment (Curator/Registrar Lead, 3 Working Days)**
  10. **Question:** Does the "Display Value" argument pass the Surrogate Test (f)? *Sufficient:* Could the core educational/didactic purpose of the object in our galleries be achieved *as effectively* using a high-quality replica, detailed digital surrogate (3D scan, high-res images/video), or the documentation + story of its removal? *Who Judges:* Curator proposes, Committee votes. *Passes:* If the *primary* reason for display is historical context, artistic technique *not* dependent on the original's aura, or the story of colonialism/restitution itself. *Fails:* If the argument relies fundamentally on the unique aura, materiality, or presence only possible with the original object in a way central to the claimed educational value. *Reasonable Alternative:* Display value could outweigh restitution. *Our Choice:* Surrogate test protects principle that pedagogy shouldn't block justice.
  11. **Question:** Are there concerns about the claimant's capacity for storage/conservation? *Sufficient:* Documented evidence of specific, severe risks. *Apply (d):*
      *   If weaknesses are *traceable* to the historical dispossession relation (e.g., underfunding due to colonial legacy), they **cannot** be made a condition. Remediation funding offered.
      *   If weaknesses are *not* traceable (e.g., recent natural disaster, unrelated political instability), they *may* justify temporary conditions (e.g., phased return, specific conservation collaboration) ONLY if they pass Role Reversal (f). *Reasonable Alternative:* Could always require minimum standards. *Our Choice:* Avoids perpetuating harm per (d), uses (f) as safeguard.

  **Stage 5: Recommendation Formation (Committee Chair Lead, 2 Working Days)**
  12. **Synthesize Findings:** If procedure reached this point, a "Recommend Return" is the default outcome based on cumulative burden (b) and principles (a, c, g).
  13. **Apply Role Reversal (f) to ANY Conditions:** For *any* proposed condition (timing, loan-back, collaboration, conservation): Would the museum accept this condition if it were the claimant and the roles were reversed? *Sufficient:* Committee consensus "Yes". *If "No":* Condition is dropped. *Reasonable Alternative:* Could allow pragmatic conditions. *Our Choice:* Ensures ethical symmetry.
  14. **Draft Recommendation:** Concise memo (<20 min read) covering: Claimant Validity, Provenance Summary (highlighting gaps/liveness), Object Context, Surrogate Test Result, Capacity Assessment & Remediation Offer, Proposed Conditions (if any, post-Role Reversal), Clear Recommendation (Return/Deny).
  15. **Submit to Board Subcommittee.**

  **Applying the Procedure to Live Files:**

  1.  **Benin Brass Plaque:**
      *   **Stage 1/2:** Clear Yes. Colonial acquisition (1890s punitive expedition), documented chain to looting, dispossession "live" (Nigerian/Benin Kingdom memory & political relations fundamentally changed post-independence). Permission irrelevant per (c).
      *   **Stage 3:** Both claimants valid per (g) (Federal Authority & Oba's court - both represent continuity). Object likely part of a dispersed set, but return whole unless claimants agree otherwise.
      *   **Stage 4:** Surrogate Test: Likely **Fails** for arguments about the plaque's specific artistry/history *as an original looted object*. Passes for general Edo art/technique teaching. *Crucially, fails for the core story of restitution itself, which requires the original.* Capacity: Nigerian institutions' challenges are traceable to colonialism; cannot condition return per (d). Offer remediation funding.
      *   **Stage 5:** Recommend Return. **Conditions Blocked:**
          *   *Long-term Loan Back:* Fails Role Reversal (f). Would museum accept keeping looted object on "loan" from claimant? No.
          *   *Shared Rotating Display:* *Could* pass Role Reversal *only* if initiated & controlled by claimant post-return (e.g., a collaborative exhibition *they* invite us to). Cannot be a *condition* for return.
          *   *Delay for Digitisation:* Fails Role Reversal (f) & Anti-Washing (a). Would museum accept claimant delaying return to digitise? Unlikely. Digitise immediately if needed for scholarship, but don't delay return.
      *   **Paperwork/Timing:** Claimant letters sufficient for Stage 3. Triage/Assessment ~10 days. Board Qtrly meeting timing dictates final pace. Recommend unconditional return.

  2.  **Parthenon Sculpture Fragment:**
      *   **Stage 1/2:** Claimant (Greek State) identifiable. Object in collection. Context: Ottoman occupation period.
          *   *Acquisition Context:* Remove under Ottoman rule. **Commit (b):** Gap in chain (not back to Elgin) counts against us. Ottoman was an imperial power over Greece.
          *   *Liveness (a):* **Commit:** Dispossession is "live". Greek national identity & grievance over the removal is continuous & fundamental to modern Greek statehood. Political relations fundamentally changed (Greek independence).
          *   *Permission (c):* **Commit:** Any Ottoman firman is noted but irrelevant per (c). It does not legitimize the removal from the perspective of the Greek people under occupation.
      *   **Stage 3:** Claimant is the Greek State. Per (g), assess if it represents the community (Greek people) with continuity of grievance. **Commit:** Yes. The Parthenon is the paramount symbol of Greek cultural heritage; the state claim embodies the sustained grievance.
      *   **Stage 4:**
          *   *Surrogate Test:* **Crucial Fork.** Argument 1 (Reunification): Seeing the fragment *in situ* with other parts is unique educational value. **Surrogate Fails** (Replica/digital can't replicate physical reunification). Argument 2 (Encyclopedic Display): Teaching Athenian sculpture globally. **Surrogate Passes** (High-quality replica/digital can teach technique/style effectively elsewhere). *Who Judges:* Committee votes on primary value argument. If Reunification is primary (likely), Test Fails. If Encyclopedic is primary, Test Passes. *Reasonable Alternative:* Could always prioritize encyclopedic value. *Our Choice:* Acknowledge both, let committee weigh primary purpose.
          *   *Capacity:* No concerns traceable to historical relation. Greek facilities excellent.
      *   **Stage 5:** Recommend Return (based on Stage 2/3 & likely Surrogate Test fail). Conditions: Only if they pass Role Reversal (e.g., collaborative research post-return).

  3.  **1961 Carved Figure (National Patrimony Claim):**
      *   **Stage 1:** Claimant identifiable.
      *   **Stage 2:**
          *   *Acquisition Context:* Bought 1961 from dealer. Made 1920s, sold by maker. **No evidence** of colonial/conflict/illicit context. Record is silent on dispossession.
          *   *Burden (b):* **Crucial Fork.** Burden (b) applies *only* if acquisition was "under a colonial administration... with incomplete chain". 1961 purchase isn't inherently colonial acquisition. Chain *is* incomplete pre-1961, but **not** in a colonial context triggering (b). Silence is neutral here, not evidence against us. *Reasonable Alternative:* Apply burden to *any* gap if claimant alleges dispossession. *Our Choice:* Burden (b) is context-specific per its wording; applies only where colonial/imperial context is *established*.
          *   *Liveness (a):* Maker sold it willingly (per record). No dispossession evidenced. Not "live".
      *   **Exit:** Stage 2, Question 4: **No** (Not acquired under relevant context). **Recommendation: Deny Claim.**
      *   **What to Say:** "After thorough review based on our restitution policy and available records, we found no evidence connecting this object's acquisition or history to the contexts of colonial dispossession, conflict looting, or illicit trafficking that our policy addresses. The object was documented as made and sold by its creator in the 1920s. While we respect national cultural patrimony laws, our restitution process focuses on specific historical injustices as defined in our policy. Therefore, we are unable to proceed with restitution in this instance." (Acknowledge the claim sincerely, explain the *specific, principled* basis for denial without rejecting patrimony concepts outright).

  **What the Procedure Cannot Do & Handling Misfires:**

  1.  **Sovereignty Disputes:** Cannot adjudicate competing state claims over territory/ownership (e.g., Cyprus, Crimea artifacts). *Handling:* Suspend process, seek legal/political advice, potentially hold object pending resolution.
  2.  **Scientifically Unverifiable Claims:** Claims based solely on oral history/spiritual belief without corroborating historical context fitting the policy. *Handling:* May exit at Stage 2 (Liveness/Context not established) or Stage 3 (Claimant validity). Document respectfully, explain policy scope.
  3.  **Extremely Vague or Frivolous Claims:** Fails Stage 1 Triage. *Handling:* Polite, clear denial based on initial criteria.
  4.  **Where All Parties Reject Outcome:** Claimant refuses conditions offered post-Role Reversal; Board rejects Committee's clear "Return" recommendation. *Handling:* (1) Re-negotiate conditions strictly under Role Reversal. (2) If impasse, Committee Chair & Director must advocate forcefully to Board based on policy and ethics. (3) If Board overrides, document dissent transparently.
  5.  **Overwhelming Volume/Complexity:** If a claim involves hundreds of objects or exceptionally complex history exceeding capacity. *Handling:* Prioritize, seek external pro-bono expert help, request phased claim submission from claimant, be transparent about delays.
  6.  **Emerging Norms:** The procedure embeds *current* committee positions. *Handling:* Schedule an annual review of the procedure itself against evolving best practices and jurisprudence, separate from individual claims.

  This procedure provides a clear, principle-driven workflow fitting your capacity, minimizes reopening settled debates, forces decisive choices at forks, and generates board-ready recommendations. Its success hinges on consistent application and the committee's courage in upholding the principles, especially against board pressure for convenient outcomes.
