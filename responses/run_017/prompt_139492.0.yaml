prompt: |-
  I am preparing the sunk-cost session for an upper-level seminar on practical rationality, and I would be grateful for an audit of two analogies that are doing a great deal of unexamined work in it.

  A colleague in the economics department has been asked to advise our provost on whether to continue a large capital project that is over budget, behind schedule, and politically unpopular. His one-page memo rests entirely on two pictures: that continuing is like throwing good money after bad, and that grieving what has already been spent is like crying over spilt milk. The conclusion he draws is unqualified — no rational agent permits a bygone to influence a forward-looking choice — so that every consideration the committee is tempted to raise (the money already sunk, the promises already made, the embarrassment of abandoning a project the university publicly championed) is strictly irrelevant, and the sole remaining question is the ratio of future costs to future benefits.

  My own counter-analogy pulls the other way: the commander who burns his boats on landing, so that retreat ceases to be one of his options and both his own future self and his adversaries may rely on his staying. Here the point of the past outlay is precisely that it constrains the future, and this looks to me not merely rational but prudent. The two pictures cannot both be carrying the weight their users place on them.

  What I want is an audit of each. For both analogies: an explicit mapping of what corresponds to what in my colleague's case (a table of correspondences is welcome); the features of the source domain that the analogy quietly imports and that the target lacks; the points at which the mapping breaks; and — this is the part I care about — which of those breaks matter for the use to which the analogy is being put and which are merely decorative. Then tell me whether the unqualified conclusion survives, and if it survives only in restricted form, state the restriction.

  Three constraints I want the verdict answerable to, because these are the cases on which I keep losing my grip:

  (i) Ledger-sunk versus residue-bearing outlay. The money is gone either way, but spending typically leaves something durable behind: a half-built structure, a trained team, forty annual waves of a longitudinal dataset whose next wave is worth more than its first precisely because the earlier ones exist, a reputation for finishing what one begins. These strike me as forward-looking considerations that merely happen to be caused by past outlay. Is there a formulation of the bygones principle that condemns the first while permitting the second, or do the analogies conceal a distinction the principle itself needs?

  (ii) Outlay as evidence rather than as cause. I suspect much apparent sensitivity to past investment is better explained as sensitivity to information: that I, or a better-informed earlier self, or a committee that screened the project, invested at all is evidence about its prospects; that others are abandoning is evidence the other way. If so, the milk-and-money picture imports the assumption that the past outlay is known to be pure loss and carries no news. Tell me how much of the phenomenon that explains and where it runs out. Note too that the aircraft which gave this fallacy its second name was continued for reasons of prestige, industrial capability and employment that were not bygones at all, which makes me suspect the label begs the question it names.

  (iii) The strategic and diachronic cases: commitments credible only because retreat is expensive; promises, vows and public declarations that alter what is permissible rather than what is advantageous; the fact that quitting is itself not free; and the possibility that a standing policy of never abandoning what one has begun beats case-by-case optimization when returns are back-loaded and one's own judgment about when to quit is unreliable. Relatedly, I have the impression that people escalate more readily when they made the original decision than when it was thrust upon them — is that a mark of irrationality, or a mark of exactly the information-and-commitment structure I have been describing?

  Finally, say what a better analogy would be, if there is one, and close with a single machine-readable line: \answer{...} containing exactly one of survives, survives-in-restricted-form, or does-not-survive, followed, if you choose the middle option, by the restriction in no more than ten words.
reasoning: |-
  Hmm, the user is preparing a seminar on sunk costs and wants me to audit two analogies used in a debate about whether to continue a university capital project. Their colleague uses "throwing good money after bad" and "crying over spilt milk" to argue that past costs shouldn't affect future decisions. The user counters with the "burning boats" analogy to show how past commitments can rationally constrain future choices.

  I need to carefully analyze both analogies point by point. For each, I'll map the correspondences to the university case, identify hidden assumptions, pinpoint where the analogies break down, and determine which breaks matter for the argument. The colleague's analogies assume that sunk costs are pure losses with no residual value and that they provide no new information - but this ignores how past investments often create tangible assets or reveal information about project viability.

  The user raises three crucial constraints that challenge the simplistic view: (i) how expenditures leave durable residues like half-built structures or reputational capital, (ii) how past investments serve as evidence about project quality rather than just costs, and (iii) strategic considerations like credible commitment and policy-level decision-making. These show why the unqualified "bygones principle" doesn't hold.

  The "spilt milk" analogy particularly breaks down because milk disappearance is total and instantaneous, unlike capital projects that create partial assets. The "good money after bad" metaphor fails when the "bad" money actually created something valuable. Meanwhile, the "burning boats" analogy better captures commitment dynamics but overstates irreversibility since retreat is usually possible (just costly).

  After examining all this, I'll conclude that the colleague's unqualified position doesn't survive - it only holds in restricted form when expenditures leave no durable residues, provide no new information, and involve no strategic commitments. A better analogy would be "building on foundations" since it acknowledges sunk costs as potential assets. For the verdict, I'll specify "survives-in-restricted-form" with the restriction: "only for pure ledger-sunk costs without residue or evidence."
answer: |-
  Here is an audit of the analogies, addressing your constraints and concluding with the verdict.

  ### Audit of Colleague's Analogies ("Throwing Good Money After Bad" & "Crying Over Spilt Milk")

  1.  **Explicit Mapping:**
      | **Source Domain (Analogy)** | **Target Domain (University Project)** |
      |------------------------------|----------------------------------------|
      | Spilt milk                   | Money already spent, political capital expended, promises made |
      | Crying over it               | Grieving/regretting past expenditures |
      | "Good money"                 | Additional future investment           |
      | "Bad money"                  | Past investment                        |
      | Throwing good money after bad | Continuing the project                 |

  2.  **Quietly Imported Features (Target Lacks):**
      *   **Total Irrecoverability:** Spilt milk is *completely* lost and leaves no residue. Past investments often leave partial assets (e.g., foundations, data, trained staff).
      *   **No Causal Link/Value:** The spilt milk causes *nothing* beneficial downstream. The "bad money" created *no* value or option. Past investments often create future-relevant assets or information.
      *   **Pure Loss Acknowledged:** Both analogies assume the past expenditure is *known* to be purely wasteful with no offsetting gains or information. The reality is often uncertainty about project value.
      *   **Isolated Decision:** Ignores strategic interactions (credibility) or diachronic self-management (policy rules).

  3.  **Points of Breakdown:**
      *   **Fundamental Breakdown (Milk):** Milk is homogenous, instantly lost, and leaves *no* residue. Project expenditures are heterogeneous, occur over time, and often leave durable, valuable residues (Constraint i).
      *   **Fundamental Breakdown (Money):** Past "bad" money often isn't purely "bad"; it built something (even if incomplete) which has future value or cost implications.
      *   **Critical Breakdown (Both):** They assume past outlay carries *no information* about future prospects (Constraint ii). Spending *is* evidence of prior (potentially informed) belief in value; high past cost *might* signal high potential value or complexity.
      *   **Critical Breakdown (Both):** They ignore that past outlay can *create* future costs/benefits strategically (e.g., credibility, altered bargaining positions - Constraint iii) or through policy rules.
      *   **Decorative Breakdown:** The emotional tone ("crying") is vivid but not essential to the core argument about irrelevance.

  ### Audit of User's Counter-Analogy ("Burning the Boats")

  1.  **Explicit Mapping:**
      | **Source Domain (Analogy)** | **Target Domain (University Project)** |
      |------------------------------|----------------------------------------|
      | Commander                    | University Leadership / Committee      |
      | Boats                        | Option to Retreat/Abandon Project      |
      | Burning the boats            | Committing substantial past resources   |
      | Landing                      | Decision to initiate the project       |
      | Adversaries & Future Self    | External stakeholders (donors, public, partners), future decision-makers |
      | Staying/Fighting             | Continuing the project to completion   |
      | Retreat                      | Abandoning the project                 |

  2.  **Quietly Imported Features (Target Lacks):**
      *   **Absolute Irreversibility:** Burning boats makes retreat physically impossible. Abandoning a project is *always* physically possible, just costly or reputationally damaging.
      *   **Pure Commitment Device:** The *only* purpose of burning boats is eliminating an option to force resolve. Past project spending usually had instrumental goals *beyond* mere commitment (e.g., building something useful).
      *   **Single Decisive Act:** Burning boats is one act. Project commitment builds gradually.
      *   **Zero Residual Value:** Burnt boats have *no* future value. Past project spending often *does* have residual value.

  3.  **Points of Breakdown:**
      *   **Critical Breakdown:** The burning is *purely* about eliminating the retreat option. Past project spending aimed (primarily) to build value, not just eliminate the quit option. Its role as a commitment device is a *consequence*, not the *primary intent*.
      *   **Critical Breakdown:** Retreat remains physically possible, just undesirable due to sunk costs *and* lost residues (Constraint i). The analogy overstates irreversibility.
      *   **Less Critical Breakdown:** The "adversaries" framing is more adversarial than typical university stakeholder relationships (though not entirely absent politically).
      *   **Decorative Breakdown:** The military context is vivid but not essential to the core point of commitment.

  ### Analysis of the Unqualified Conclusion
  The colleague's unqualified conclusion ("no rational agent permits a bygone to influence a forward-looking choice") **does not survive** intact.

  *   **Constraint i (Residues):** The conclusion fails because past outlays often create durable residues (physical assets, data, teams, acquired knowledge, reputation for commitment) that *directly* impact future costs and benefits. Considering these residues is forward-looking. The analogies conceal this by assuming pure loss. A valid principle must distinguish "pure ledger-sunk costs" (like spilt milk) from "investment-sunk costs leaving residues."
  *   **Constraint ii (Evidence):** The conclusion fails because past outlays (especially the *decision* to invest) provide *evidence* about project quality, complexity, or the reliability of initial assessments. Ignoring this evidence is irrational. The analogies assume the loss is known and uninformative. Much "sunk cost fallacy" behavior is actually rational Bayesian updating based on the *fact* of investment.
  *   **Constraint iii (Strategic/Diachronic):** The conclusion fails in strategic contexts (where sunk costs signal commitment credibility to others) and for diachronic rationality (where a policy of "finish what you start" may outperform case-by-case quitting due to back-loaded returns or self-doubt). The "burning boats" analogy highlights this, though imperfectly. Escalation when one made the initial decision is often rational due to greater private information or psychological commitment (signaling belief).

  ### Does the Conclusion Survive in Restricted Form?
  Yes. The unqualified conclusion **survives-in-restricted-form**.

  **Restriction:** Only for **pure ledger-sunk costs without residue or evidence value.**

  ### Explanation of Restriction
  *   **Pure Ledger-Sunk:** Costs that truly leave *nothing* behind but a financial record (e.g., wasted consultant fees with no report, rent on unused space with no benefit, purely unrecoverable cash payments). Spilt milk is this.
  *   **No Residue:** The expenditure created no physical asset, no data, no knowledge, no team capability, no reputation effect (positive or negative) relevant to the future decision.
  *   **No Evidence Value:** The fact of the expenditure provides *no* new information about the project's underlying value, feasibility, or the reliability of prior judgments. Its worthlessness is known with certainty.

  In this narrow case, the "spilt milk" and "good money after bad" analogies hold perfectly, and considering these pure bygones *is* irrational. However, the university capital project case, like most real-world sunk costs, almost certainly involves residues and potential evidence value, making the colleague's unqualified conclusion and analogies inadequate and potentially misleading.

  ### A Better Analogy
  **"Building on Foundations Laid":** Past expenditures are like pouring foundations. You cannot recover the concrete or money. However:
  *   The foundation's existence (residue) fundamentally alters future costs/benefits – building *on* it is cheaper than starting elsewhere.
  *   The fact you poured it (evidence) signals belief the location was suitable.
  *   Abandoning it wastes the foundation *and* signals unreliability to future partners (strategic).
  *   A policy of "build where foundations exist" may beat constantly relocating (diachronic).
  This better captures the durable, informative, and potentially commitment-relevant nature of most sunk costs compared to pure loss analogies.

  \answer{survives-in-restricted-form only for pure ledger-sunk costs without residue or evidence value}
