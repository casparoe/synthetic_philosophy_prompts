prompt: |-
  I moderate a large public peer-support forum for people with a chronic condition. Members trade treatment experiences, and a real number of them make real medical decisions on the strength of what they read here. About once or twice a month my volunteer moderator team — no formal training, an hour or two per decision, access to nothing but what is publicly posted — has to decide whether a particular subforum has developed an epistemic problem and, if so, what to do. Interventions are expensive: clumsy ones trigger mass exits and confirm whatever the members already suspected about us.

  Please write the procedure my team should run on a proposal to intervene. Ground it in the distinction now standard in social epistemology between an epistemic bubble and an echo chamber. In a bubble, members are missing relevant evidence and argument because of structural filtering — whom they follow, what the ranking algorithm shows them, whose word they take for what is worth reading — not because they distrust outside sources; they generally have no settled view of those sources, and supplying the missing material through a voice they already trust tends to work. In an echo chamber, members have met the outside sources and have been given, in advance, reasons to discredit them; the discrediting is general rather than claim-by-claim, it is part of what membership consists in, and pressing more outside material at them tends to be absorbed as further evidence of the corruption of the outside. Escape then requires rebuilding trust in some specific outside voice, which the moderators cannot do themselves, since we are already inside the discrediting story.

  The complication I want the procedure to handle is a pattern I keep seeing that fits neither description. Call it translation loss for now: the outside material is present in the thread, the sources are cited approvingly and trusted, nobody is accused of bad faith — but the community has a standing rule that an outside finding must be re-expressed in the community's own framework before it counts as understood, and the re-expression systematically downgrades the finding's strength. No benefit on average becomes benefit for a subtype like us; probably false becomes emerging; the trial was underpowered becomes the trial was too small to pick up the effect we are all seeing. Information is present, trust is intact, and nothing updates.

  Requirements:

  1. An ordered set of questions, each with an explicit statement of what counts as a sufficient answer, using only evidence available from public posts. The procedure must be run per topic, not per community, since the same subforum may be a bubble about one treatment and a chamber about another.
  2. Observable markers that discriminate the three patterns, and an explicit stop rule for when the markers conflict or come out mixed.
  3. Clear stopping points: where the procedure returns a no, where it returns do nothing, and where it hands the decision to a person because the remaining question is one of values rather than fact. Include exposure is contraindicated here as a possible outcome, with the reasoning.
  4. An intervention menu keyed to the diagnosis, each entry saying what it costs and what it would look like if it were working.
  5. Everything must be defensible publicly to the members, so no step may rest on private data or on claims about members' psychology that could not be supported from the posts themselves.
  6. Honesty about which steps are judgment calls dressed up as procedure, and about what this procedure cannot see at all — I am thinking of a chamber that has learned to perform openness, and of a bubble that is perfectly fine and should be left alone.

  Then run the finished procedure on three cases and keep the runs in character: (a) a subforum where mainstream clinical guidance never appears, where a member who once linked a national health service page got a couple of polite replies and no hostility, and where people say things like my specialist never mentioned that; (b) a treatment-skeptical parenting group that quotes official health guidance at length and at its own initiative, mainly to show that the guidance convicts itself, with a shared vocabulary for reading official statements and a detailed account of why every relevant body is compromised; (c) the translation-loss pattern above, in a subforum built around a single explanatory framework for the condition, where high-quality evidence is posted and praised every week and the community's restatements of it reliably remove its force.

  Be committed throughout. Take a definite position at every branch, give your reasons, and where the diagnosis is genuinely uncertain mark your confidence and say what would settle it. In particular, tell me plainly whether my third pattern is a genuine third failure mode or whether it collapses into one of the other two — if it collapses, say which, why, and what follows for what I should do about it, rather than manufacturing a category to accommodate me. Include at least one case where the procedure tells me to stop or do nothing despite my instinct to intervene, and do not quietly rescue that case to make the procedure look better than it is. Please write in American English.
reasoning: |-
  Okay, the user moderates a peer-support forum for people with a chronic condition. They need a procedure to decide when to intervene in subforums that might have epistemic issues. Specifically, they want to distinguish between epistemic bubbles, echo chambers, and a third pattern they call "translation loss." 

  First, I need to understand the key differences between these concepts. Epistemic bubbles are about missing information due to structural issues, without active distrust. Echo chambers involve active discrediting of external sources. Translation loss is different: information is present and trusted, but reinterpreted in a way that weakens its impact.

  The user's requirements are clear: a step-by-step procedure with observable markers, stopping rules, and specific interventions. The procedure must be based solely on public posts and defensible to the community. Also, they want honesty about limitations and judgment calls.

  Looking at the three cases: 
  Case (a) has mainstream guidance missing but no hostility. That sounds like a bubble. 
  Case (b) actively discredits external sources, fitting an echo chamber. 
  Case (c) involves reinterpretation of evidence, which seems like translation loss.

  For the procedure, I'll structure it as a flowchart of questions. Each step needs clear criteria based on public posts. For example: 
  Step 1 checks if outside sources are absent. 
  Step 2 assesses if absent sources are actively discredited. 
  Step 3 looks for systematic reinterpretation.

  Key challenges: 
  - How to detect "systematic downgrading" in translation loss? Need observable markers like consistent rewording that weakens conclusions. 
  - Handling mixed signals: if some markers point to bubble but others to echo chamber, where to stop? 
  - Interventions must be practical. For bubbles, adding trusted voices; for echo chambers, avoiding direct confrontation; for translation loss, maybe framework disruption.

  The user emphasized honesty. I'll note where steps are judgment calls (e.g., interpreting "systematic" downgrading) and limitations (e.g., performative openness in echo chambers). 

  Now, applying the procedure to the cases: 
  - Case (a) clearly a bubble: missing info, no discrediting. Intervention: introduce sources via trusted members. 
  - Case (b) echo chamber: sources cited only to discredit. Intervention: avoid pushing external content; focus on shared goals. 
  - Case (c) translation loss: evidence present but weakened in restatement. Intervention: challenge framework, not facts.

  Important: The user wants confirmation if translation loss is truly distinct. I think it is—it's about reinterpretation, not absence or distrust of info. Collapsing it into other categories would miss this nuance. 

  Finally, including a "do nothing" case. For example, if a subforum has high-quality discourse despite a niche focus, intervention might not be needed. The procedure should recognize when to step back.
answer: |-
  Here is a procedural framework for diagnosing and intervening in epistemic failures within topic-specific subforums, grounded in social epistemology and your observed patterns. The procedure uses only publicly observable evidence (post content, patterns of citation/dismissal, linguistic framing) and includes explicit guardrails against overreach.

  ---

  ### **Epistemic Failure Diagnosis Procedure**  
  *(Run per topic/subforum, not whole community)*  

  **Step 1: Is outside evidence structurally absent?**  
  - *Check:* Scan last 50 relevant posts for citations of major external sources (e.g., NHS, CDC, major journals).  
  - *Sufficient for "yes":* ≤5% of posts cite such sources *and* no active hostility toward them is observed.  
  - *Stop if "no" → Proceed to Step 2.*  
  - *Stop if "yes" → Diagnose: **Epistemic Bubble**. Proceed to Intervention Menu.*  

  **Step 2: Is outside evidence present but systematically discredited?**  
  - *Check:* Review all external citations in last 50 posts. Note if sources are:  
    (a) Dismissed via *general* accusations (e.g., "CDC is corrupt," "Journals are bought").  
    (b) Met with *preemptive distrust* (e.g., "They always lie," "Ignore anything from X").  
  - *Sufficient for "yes":* ≥60% of external citations include (a) or (b) *and* show claim-agnostic rejection.  
  - *Stop if "yes" → Diagnose: **Echo Chamber**. Proceed to Intervention Menu.*  
  - *Stop if "no" → Proceed to Step 3.*  

  **Step 3: Is evidence reinterpreted to downgrade conclusions?**  
  - *Check:* Identify 5 recent posts citing high-quality external evidence. Compare original claims to community restatements. Look for:  
    - Strength reduction (e.g., "proven effective" → "might help some").  
    - Scope narrowing (e.g., "no benefit" → "no benefit *for typical patients*").  
    - Certainty dilution (e.g., "high confidence" → "emerging understanding").  
  - *Sufficient for "yes":* ≥4/5 restatements show *systematic* downgrading per above *and* no challenge to this practice exists in-thread.  
  - *Stop if "yes" → Diagnose: **Translation Loss**. Proceed to Intervention Menu.*  
  - *Stop if "no" → **No intervention needed**. Topic is epistemically functional.*  

  **Conflict/Mixed Signals Stop Rule:**  
  - If markers conflict (e.g., absent evidence *and* active discrediting), default to **Echo Chamber** (most resistant pattern).  
  - If insufficient data (e.g., low post volume), return **Inconclusive: Monitor for 14 days**.  

  **Values-Based Handoff Points:**  
  - If evidence suggests harm (e.g., "Treatment X works!" when guidelines contraindicate it), escalate to **Human judgment: Exposure contraindicated**. *Reasoning:* Requires weighing ethical duty vs. autonomy.  
  - If diagnosis is clear but intervention risk is high (e.g., fragile userbase), escalate to **Human judgment: Cost-benefit analysis**.  

  ---

  ### **Intervention Menu**  
  *(Cost = risk of user backlash/exit)*  

  | **Diagnosis**       | **Intervention**                | **Cost** | **Success Looks Like**                                  |  
  |---------------------|--------------------------------|----------|---------------------------------------------------------|  
  | **Epistemic Bubble**| Introduce missing sources via *trusted members* (not mods). | Low      | Outside sources cited neutrally in 20% of posts within 14 days. |  
  | **Echo Chamber**    | *Avoid* adding external content. Host AMA with *critic inside their framework* (e.g., "Doctor skeptical of big pharma"). | High     | Reduced vitriol toward outside sources; AMA gets ≥50% upvotes. |  
  | **Translation Loss**| Challenge *framing*, not facts. Pin post: "Compare: Study says X vs. How we talk about X." | Medium   | Visible debates about interpretation; restatements acknowledge original strength. |  
  | **Contraindicated** | Lock thread + sticky: "Clinical guidance warns against this." Link sources. | Extreme  | Topic abandoned; no migration to new thread. |  

  ---

  ### **Limitations & Honest Disclosures**  
  - **Judgment Calls:** Step 3 (downgrading) requires interpreting "systematic" bias. We err toward conservatism (needs 80% consistency).  
  - **Blind Spots:**  
    - **Performative Openness:** Echo chambers may *cite* sources purely to mock them. Detected by checking if citations are ever engaged sincerely (if not, chamber).  
    - **Healthy Bubbles:** A niche group (e.g., "Variant X patients") may validly exclude general advice. Not a bubble if scope is explicit.  
  - **What This Can’t Fix:** We cannot rebuild trust in outside voices (echo chambers) or force framework updates (translation loss). We can only disrupt patterns.  

  ---

  ### **Procedure Applied to Cases**  
  **Case (a): Subforum ignoring mainstream guidance**  
  - Step 1: Mainstream sources absent (<5% citations). No hostility when linked. → **Epistemic Bubble**.  
  - Intervention: Recruit trusted members to share NHS links in personal stories. Low cost; success if citations increase.  
  - *Why not chamber?* No discrediting. *Why not do nothing?* Members report clinical gaps ("my specialist never mentioned that"), indicating harm.  

  **Case (b): Treatment-skeptical parents discrediting guidance**  
  - Step 1: Outside sources *are* present → Proceed.  
  - Step 2: Sources quoted only to show "self-conviction," with general distrust ("all regulators are corrupt"). → **Echo Chamber**.  
  - Intervention: Host AMA with integrative MD who critiques "corrupt systems" but endorses vaccines. High cost; success if AMA not downvoted.  
  - *Why not bubble?* Evidence isn’t missing; it’s preemptively toxic. *Why not translation loss?* They reject, don’t reinterpret.  

  **Case (c): Framework-driven reinterpretation**  
  - Step 1/2: Evidence present *and* trusted → Proceed.  
  - Step 3: Systematic downgrading (e.g., "underpowered" → "too small for *our* effects"). → **Translation Loss**.  
  - Intervention: Pin side-by-side comparison: "Study Conclusion vs. Community Summary." Medium cost; success if users debate wording.  
  - **Commitment on Pattern Collapse:** Translation loss is *distinct*. It’s not a bubble (info is present) or chamber (trust remains). It’s **hermeneutic filtering**—a failure to update priors despite evidence. Requires different intervention (reframe, don’t add/remove content).  

  ---

  ### **Explicit "Do Nothing" Example**  
  **Hypothetical Case: "Alternative Therapy Y" subforum**  
  - *Facts:* High volume of personal anecdotes. Low external citations. No mainstream guidance mentioned.  
  - Step 1: Sources absent → **Possible bubble**.  
  - *But:* No posts indicate medical decisions rely solely on this topic (e.g., no "I quit meds because of this"). Scope is clearly exploratory ("sharing experiences, not advice").  
  - **Procedure Output:** No intervention needed. *Rationale:* Absence alone isn’t harmful if topic is not directive. *Do not rescue:* Your instinct to "correct" gaps is overridden by absence of harm markers.  

  ---  
  **Final Note:** This procedure prioritizes *observable behavior* over intent. It accepts false negatives (e.g., undetected chambers) to avoid false positives (over-intervention). Success hinges on moderator discipline: applying it coldly, escalating when values conflict, and publicly justifying actions via the checklist (e.g., "We acted because 12/15 posts showed evidence downgrading").
