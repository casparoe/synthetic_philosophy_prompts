prompt: |-
  I'm a junior majoring in philosophy, and this term I'm in a seminar on race, aesthetics, and politics. We spent most of two weeks on the W. E. B. Du Bois essay about Black art — "Criteria of Negro Art," I think it's called, the one where he says that all art is propaganda and always must be, that he doesn't care about art that isn't used for propaganda, and that this is no license for bad art, because the propaganda has to be beautiful and true to count as art at all. I finished the reading convinced, and then realized that being convinced hasn't changed a single thing I actually do, which makes me suspect I understood it less well than I thought.

  Here is what I mean. I sit on the student exhibitions committee for the gallery in our student union: twice a month, in a ninety-minute meeting, six to ten proposals for small commissions — anywhere from $500 to $3,000 — from student and local artists for work to be installed in the building or shown in the gallery cases. We vote, we write a paragraph of reasons that goes back to the applicant, and the gallery director reviews what we recommend and can veto it (she has, once, over insurance and once over a work that would have needed a structural engineer). Our rubric is three lines — artistic merit, message, fits the space — and it is useless, because every real disagreement we have turns out to be a fight inside the first line. I would like to replace it with a decision procedure built honestly out of Du Bois's position: art should be propaganda; propaganda that isn't made well isn't art; and craft that carries nothing is decoration. Please write me that procedure as an ordered set of questions a committee of non-specialists can run in about fifteen minutes per proposal, each with a stop rule: what counts as passing, what counts as an immediate no, and which questions have to be kicked to a person — the director, the artist, the people depicted — because they are disagreements about values rather than facts and no checklist can settle them. Keep the distinctions in Du Bois's view that are actually doing the work and drop the ones that only matter in a seminar paper, and be blunt about where a rubric like this will misfire.

  Two half-formed ideas of my own, which you should use or discard as you see fit. The first is a subtraction test: take the political content away and ask whether the object still holds up as a made thing, then take the craft away and ask whether the message still reaches anyone who wasn't already persuaded — so that a slogan on a beautiful surface and a beautiful surface with a slogan stapled to it both fail, for different reasons. The second is that propaganda has an addressee, and it matters who it is: a work addressed to the people it depicts, or to the people it wants to move, seems to me a different animal from a work whose real content is that its sponsor is a decent institution, and I don't know what Du Bois's view implies about that second kind. Then run the finished procedure on three kinds of proposal we get constantly. One: a large, genuinely accomplished mural for the dining hall wall about the scheduling of subcontracted food-service workers, proposed by a student labor group, with a student artist whose portfolio is strong and a facilities office that is quietly unhappy. Two: a polished, professionally produced installation funded by the bank that handles the university's accounts — beautiful, costs us nothing, says that everyone on this campus belongs, and puts the bank's name on the wall label; we currently approve these cheerfully and I want to know whether we should. Three: a stack of photocopied posters from the tenants' union in the neighborhood next to campus, about a rent increase at a building the university's foundation has a stake in — the committee agrees with them completely, the people affected made it themselves, and the design is honestly bad; I suspect this is the case where the procedure says something we don't want to hear, and I want to see whether it has to say it or whether it can offer us a condition instead of a no. Finally, tell me what the procedure cannot do — what it will get wrong, which of our decisions it will not touch, and where it will quietly turn into a vote dressed up as a test. Please write the whole thing in American English.
reasoning: |-
  Okay, I need to help this philosophy junior design a practical decision procedure based on Du Bois's "Criteria of Negro Art" for their student exhibitions committee. The user is clearly frustrated with their current vague rubric and wants something actionable that reflects Du Bois's core ideas: art as propaganda, well-made propaganda as true art, and craft without message as mere decoration.

  Hmm, the user has two interesting starting points: a subtraction test (assessing message and craft separately) and the importance of the propaganda's addressee. I should incorporate these thoughtfully. The key is to create a streamlined process that non-specialists can apply in 15 minutes per proposal while staying true to Du Bois's principles.

  First, I'll distill Du Bois's essay into three non-negotiable pillars for the procedure:
  1) Art must have intentional propaganda value
  2) That propaganda must be conveyed through genuine artistic craft
  3) The work must be both beautiful and truthful

  The user's three test cases are perfect for stress-testing the procedure. The mural about food-service workers represents ideal "good propaganda art," the bank-sponsored installation tests "decoration masquerading as art," and the tenants' union posters challenge "important message with poor execution." 

  For the procedure itself, I imagine a four-step flow:
  1) Propaganda Check - does it actively argue for justice? (Stop if no)
  2) Audience Test - who is it for? (Crucial for truth assessment)
  3) Craft Assessment - is it well-made? (Stop if not)
  4) Truth Verification - is the message factually grounded? (May need external input)

  The subtraction test fits neatly into step 3 - we'd ask "if you remove the message, does the craft still compel?" and "if you remove the craft, does the message still land?" Both need to pass.

  For the bank sponsorship case, I suspect the procedure will expose it as decoration because its primary function is institutional reputation, not justice. That'll be uncomfortable but necessary. For the tenants' posters, we might salvage it by offering exhibition support rather than outright rejection.

  Important limitations to highlight: 
  - The committee will still vote when craft is borderline
  - "Truth" may require consulting affected communities
  - It can't resolve value conflicts about what counts as justice
  - Corporate propaganda might slip through if craft is excellent

  The tone should be blunt where needed - especially about how this will force them to reject technically skilled but politically empty work. American English means avoiding philosophical jargon while keeping it precise.

  Finally, I'll structure the response with the actual procedure first, then demo on the three cases, then list limitations - exactly as requested. The user wants practicality, not theory, so I'll focus on actionable questions with clear stop rules.
answer: |-
  Here's a concrete decision procedure based on Du Bois's core arguments, designed for committee use. It prioritizes his non-negotiable points: **Propaganda for Justice, Artistic Craft, and Truth/Beauty**, while streamlining seminar distinctions.

  **Du Bois-Based Decision Procedure for Exhibition Proposals**

  **Core Principle:** We fund ART, defined as **well-crafted propaganda advancing racial/social justice.** Craft without justice is decoration. Justice without craft is (mere) agitation. Both are valid, but only the combination is ART eligible for *this* commission.

  **Procedure (15 mins/proposal):**

  1.  **PROPAGANDA CHECK: Does this work *actively argue* for racial/social justice?**
      *   *Ask:* "What specific injustice does this work challenge or what vision of justice does it affirm? Is this the *primary purpose* of the work, evident in its form and content?"
      *   *Pass:* Clear, intentional argument for justice (e.g., challenging labor exploitation, housing injustice, racial discrimination, affirming Black joy/resistance). The "message" must be integral, not incidental.
      *   *Immediate No:* Work primarily decorative, purely personal expression without social dimension, celebratory of status quo, or promoting harmful ideologies. Work where the *primary* message is institutional self-congratulation (e.g., "we are diverse!" without critique).
      *   *Kick If:* Disagreement on whether the subject *is* a justice issue (e.g., is critique of university subcontracting a "justice" issue? Committee vote needed). Disagreement on whether the message is primary or secondary.

  2.  **ADDRESSEE & INTENTION TEST: Who is this propaganda *for*, and what does it ask of them?**
      *   *Ask:* "Who is the primary audience the artist seems to be speaking *to*? What is the intended *effect* on that audience (e.g., galvanize the oppressed, educate the privileged, shame the powerful, build solidarity)? Is the voice authentic to the perspective depicted?"
      *   *Pass:* Clear sense of audience and intended effect. Voice feels authentic to the subject/community. Prioritizes speaking *to* or *for* the oppressed, not just *about* them to the powerful.
      *   *Immediate No:* Work primarily addresses/panders to power (e.g., solely telling the university/patron "you are good"). Work that speaks *for* a community in an inauthentic/exploitative way without their input/voice (evidence needed).
      *   *Kick If:* Disagreement about authenticity of voice or primary audience/intent (e.g., is the bank piece speaking to marginalized students or to the bank/university admin?). **Requires consultation:** If depicting a specific community, reasonable effort should be made to show concept/materials to representatives of that community *before* final decision for feedback on authenticity/harm (Gallery Director facilitates).

  3.  **CRAFT ASSESSMENT (Subtraction Test): Is the work *well-made* enough that the propaganda relies on its artistry, not just its message?**
      *   *Ask (Subtraction Test):*
          *   a) "If you *removed the explicit justice message*, would the formal elements (composition, color, texture, material handling, technique, writing skill, conceptual rigor) still be compelling, interesting, or demonstrate significant skill?"
          *   b) "If you *removed the high level of craft*, would the core justice message still be powerful, clear, and likely to resonate *beyond* people already deeply committed to this cause?"
      *   *Pass:* **Both (a) and (b) must get a "Yes."** The craft must stand on its own merits *and* be necessary for the message's power/accessibility.
      *   *Immediate No:* (a) Fails: Sloppy execution, weak technique, poor composition – the message relies solely on its political content. (b) Fails: The message is simplistic, clichéd, or relies entirely on aesthetic appeal to be noticed – craft is just packaging. *(Your examples: Slogan on a beautiful surface fails (b). Beautiful surface with slogan stapled on fails (a)).*
      *   *Kick If:* Borderline case on craft quality. **Requires Expertise:** Gallery Director makes the final call on craft sufficiency, informed by committee discussion but not bound by vote. (This is where the old "artistic merit" fights go, but now focused *only* on whether craft meets the threshold for *this specific propaganda*).

  4.  **TRUTH & BEAUTY VERIFICATION: Is the propaganda truthful? Is its beauty rooted in its truth?**
      *   *Ask:* "Is the core message factually accurate? Does the work avoid harmful stereotypes or misrepresentation? Does its 'beauty' (aesthetic power) feel earned and emerge from its truthful engagement with the subject, rather than being superficial or decorative?"
      *   *Pass:* Message grounded in verifiable reality or authentic experience. Aesthetic choices enhance and feel integral to the truthful message, not masking it.
      *   *Immediate No:* Demonstrably false claims. Reliance on harmful stereotypes. "Beauty" that feels like a veneer unrelated or counter to the harsh truth being presented.
      *   *Kick If:* Disagreement on factual interpretation of complex issues. Disagreement on whether aesthetics clash with or serve the message. **Requires Fact-Check:** Gallery Director verifies basic factual claims in proposal/artist statement if contested. Value judgments on truth/beauty integration require committee vote.

  **Application to Your Test Cases:**

  1.  **Food-Service Worker Mural:**
      *   **1. Propaganda:** YES (Clear labor justice argument).
      *   **2. Addressee:** Likely workers (galvanizing) & students (educating/solidarity). Authentic? Check artist/group connection. (Kick: Confirm voice authenticity?).
      *   **3. Craft:** Strong portfolio suggests (a) YES. Message about scheduling likely needs art to convey impact (b) YES. (Pass).
      *   **4. Truth/Beauty:** Assuming accurate depiction. Beauty should serve the dignity of workers. (Likely Pass).
      *   **Result:** STRONG YES. Du Bois would approve. Facilities' unhappiness is irrelevant to *artistic* criteria (political reality, but not part of this rubric).

  2.  **Bank-Sponsored "Belonging" Installation:**
      *   **1. Propaganda:** PROBLEM. Primary purpose is *likely* institutional PR ("we/our sponsor are good"). Message ("everyone belongs") is vague, status quo-affirming, not challenging injustice. (Immediate No or Kick: Argue if it *actively* challenges exclusion).
      *   **2. Addressee:** Primarily the university & bank (showing their decency), not marginalized groups seeking change. (Likely Immediate No).
      *   **3. Craft:** YES (polished). But fails Propaganda check first.
      *   **4. Truth/Beauty:** "Belonging" may ring hollow if university has equity issues. Beauty may be superficial.
      *   **Result:** NO. Du Bois: This is **decoration,** potentially masking injustice with a pleasant, sponsored veneer. Craft doesn't redeem the lack of genuine justice propaganda.

  3.  **Tenants' Union Posters (Bad Design):**
      *   **1. Propaganda:** YES (Clear housing justice argument).
      *   **2. Addressee:** Likely tenants (galvanizing) & campus (solidarity/action). Highly authentic (made by affected people). (Pass).
      *   **3. Craft:** **CRITICAL POINT.** (a) Remove message? Photocopied posters, bad design – unlikely compelling as objects. (Probably NO). (b) Remove craft? Core message (rent hike, university role) is strong & clear even on a plain flyer. (YES). **Fails (a) - Craft insufficient.**
      *   **4. Truth/Beauty:** Likely YES (truthful), beauty is secondary.
      *   **Result:** **NO for commission as ART.** Du Bois: This is **propaganda/agitation** (important!), but not *Art* due to insufficient craft. **Condition/Alternative:** The procedure *doesn't* force a simple "no." It diagnoses the problem: craft. The committee could:
          *   *Offer a different venue:* Bulletin board, student union lobby table (not curated gallery).
          *   *Offer resources:* Connect artists with design students for collaboration/improvement.
          *   *Fund production:* Use part of the commission to hire a designer to work *with* the tenants on better execution while preserving their voice/message. *Reframe:* Support the *movement*, not just the object.

  **What This Procedure CANNOT Do (Where It Misfires or Falters):**

  1.  **Resolve Deep Value Conflicts:** It can't settle "What *is* justice?" in borderline cases (Step 1 Kick). The committee still votes on values.
  2.  **Define "Good Enough" Craft Objectively:** The craft threshold (Step 3) is inherently subjective. The Director's role here is crucial, but it's still judgment. A borderline "no" on craft can *feel* like a rejection of the message.
  3.  **Prevent Strategic Framing:** Artists can learn to game Step 1 by adding a superficial "justice" gloss to apolitical or self-serving work. Vigilance is needed.
  4.  **Address Pure Aesthetic Innovation:** A stunning, apolitical piece exploring form/material might be great art by other standards, but fails Step 1. The procedure explicitly excludes it. This is a deliberate choice reflecting Du Bois's priority.
  5.  **Eliminate Voting:** Steps 1 (Kick) and 4 (Kick) involve committee votes. Steps 2 (Kick) and 3 (Director) reduce but don't eliminate voting/subjectivity.
  6.  **Solve Logistical Issues:** Insurance, structural safety, duration, size – these remain the Director's purview *after* the artistic pass/fail.
  7.  **Guarantee Impact:** It assesses *intent* and *craft*, not whether the work will *actually* change minds or be effective propaganda. That's unknowable at proposal stage.
  8.  **Navigate Co-option Perfectly:** Exceptionally well-crafted work from dubious sources (like a brilliant critique of capitalism funded by a bank trying to launder its image) might technically pass if the propaganda is strong and authentic *despite* the sponsor. The procedure flags sponsor intent in Step 2 but can't automatically veto based *only* on source if the work itself passes. This requires careful scrutiny and potentially a Kick vote on intent/authenticity.
  9.  **Replace Political Courage:** Applying this honestly means rejecting popular but empty decoration (like the bank piece) and potentially rejecting urgent but poorly made community work as *art for this specific context*. The committee needs the backbone for that.

  **In Essence:** This procedure forces explicit conversations Du Bois demands: What justice is this fighting for? Who is it truly for? Is it made well *as art*? Is it true? It replaces a vague "artistic merit" fight with a structured (though still subjective) interrogation of craft's service to justice. It will make some decisions easier (clear yes/no), others harder (value kicks), and will undoubtedly lead to different outcomes than your current rubric, particularly in rejecting skilled decoration and insufficiently crafted protest. It turns "artistic merit" from a black box into a specific argument about craft's role in carrying propaganda.
