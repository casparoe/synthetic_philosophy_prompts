prompt: |-
  I run a small reading group on risk and rationality with some people from the finance department, and one of them presented an argument last week that I've been mulling over since and can't quite get out of. It's supposed to be a straight argument for geometric rationality — maximize expected log, not expected value — and I think it definately proves too much, but I can't put my finger on the exact joint. Roughly as he gave it: (1) Take a favourable multiplicative gamble you can repeat: any fraction of your bankroll on a coin that comes up heads with p = 0.6 at even money. The rule that maximizes the expected logarithm of your bankroll — betting 20% each round, i.e. edge over odds — will with probability one eventually leave you richer than a bettor using any other fixed fraction, and the ratio between the two of you grows without bound. (2) The moral of that theorem is supposed to be about what a single individual actually lives through: your wealth is one trajectory, and what happens to it over time is governed by its time-average growth rate, not by the average across a hypothetical population of copies of you, which is dragged around by outcomes almost nobody experiences. Expected wealth maximization is maximizing a fiction. (3) But — and here's where I start to itch — the number of times you face a given choice can't be what makes a rule rational. If maximizing expected log is the right policy when you'll take the bet a hundred times, it's the right policy when you take it once; the long run is just a device that exposes what the correct policy is, it isn't a separate ingredient in the justification. (4) So in any decision whatever, maximize the expected log of the quantity your decision multiplies. (5) Expected log is minus infinity if any outcome drives that quantity to zero, so rationality forbids accepting any gamble carrying any nonzero probability of total loss of that quantity, however tiny the probability and however large the finite gain. (6) That's preposterous. There's some chance that driving to campus I get disabled in a way that destroys my earning capacity, and my earning capacity is most of the quantity that compounds over the rest of my life; by (5) no finite benefit could ever justify the drive. Same for the surgery I've been putting off, same for having a second kid. A rule that forbids every action anyone ever takes isn't the rule. (7) So one of (1)–(6) has to go, or one of the steps between them.

  Things I've tried that don't satisfy me. The finance guy says you just define the "bankroll" narrowly — the money earmarked for this kind of bet — and then nothing is ever driven to zero and (5) never bites; but (1) was a claim about your whole wealth process, and if I'm allowed to choose the quantity freely it looks like I can get the rule to say anything I like, which is just a version of the problem rather than a solution. I also don't think the difficulty is really about repetition as such, because I can construct cases where the timing is what's odd: my colleague's own example was a 78-year-old with no heirs deciding whether to put 5% of her savings on a single even-money 60/40 bet, where the proceeds will be spent on care within the year and never reinvested in anything, and I made up one of my own where the stake isn't a compounding quantity at all — a drug that might cost me my eyesight. Call it the reinvestment condition, if you like: the theorem needs a quantity that actually gets multiplied, over and over, into itself. My question: which step do you reject, why did it look fine when he wrote it on the board, and what does rejecting it cost? I'd rather keep (1) and (6) than (3) or (4), and I'd rather not end up saying that what's rational for me to do on Monday depends on how many similar decisions the universe is going to hand me. And if (3) does go: is there any residue of geometric rationality that still applies to a genuinely one-off, non-compounding choice, or does the whole program only get a grip inside sequences?
reasoning: |-
  Okay, let me try to unpack this problem. The user runs a reading group on risk and rationality, and one member presented an argument for geometric rationality—maximizing expected log wealth. The argument starts with the Kelly criterion, showing that in repeated bets, betting a fixed fraction (edge over odds) leads to dominating other strategies over time. Then it generalizes to any decision, claiming that since the long run reveals the correct policy, one should always maximize expected log for the quantity being multiplied. But this leads to rejecting any gamble with a non-zero probability of total loss, which seems absurd in real-life scenarios like driving or surgery. The user is stuck on which step to reject.

  First, I need to recall the Kelly criterion. It's optimal for repeated bets because it maximizes the growth rate. Step (1) seems solid: with probability 1, Kelly dominates in the long run. But step (2) says that what matters is the individual's trajectory, not the ensemble average. That makes sense because in repeated gambles, the time-average growth rate determines actual outcomes. 

  Then step (3) claims that the number of repetitions shouldn't affect rationality. This is where it gets tricky. If Kelly is right for many bets, why not one? The user feels that the long run is just a revealer, not a justifier. But step (4) takes this further to any decision multiplying a quantity. Step (5) notes that if any outcome has zero wealth, expected log is -infinity, so you must avoid any risk of total loss. Step (6) points out the absurdity: no finite benefit justifies driving if there's a tiny chance of losing earning capacity. 

  The user mentioned attempts to solve this by narrowing the bankroll, but that feels arbitrary. Also, non-compounding cases like a one-time bet or risking eyesight don't fit. The core issue is whether geometric rationality applies outside repeated scenarios.

  I think step (3) is the weak link. The long run isn't just a revealer; it's essential for the dominance result. In a single bet, maximizing expected value might be better if you're not reinvesting. The Kelly criterion's optimality depends on reinvestment and compounding. Without that, expected log isn't necessarily rational. 

  Also, step (4) overgeneralizes. The "quantity your decision multiplies" must be your entire future compounded wealth. In cases like the eyesight risk, losing eyesight doesn't multiply through future decisions; it's a one-off loss. So geometric rationality doesn't apply there. 

  The user wants to keep (1) and (6), so rejecting (3) and (4) makes sense. This means geometric rationality is context-dependent, tied to repeated, compounding scenarios. For one-off decisions, other frameworks like expected utility with risk aversion are better. That addresses the absurdity in (6) without discarding Kelly's validity in investing contexts. 

  The residue for one-off decisions? Only if the stake is part of a larger bankroll that will be compounded. Otherwise, geometric rationality doesn't apply. The user's concern about rationality depending on future decisions is valid, but it's inherent in the math—compounding requires reinvestment. So for truly isolated decisions, use expected utility.
answer: |-
  You've hit on a profound tension in decision theory. The argument is elegant but overreaches, and the flaw lies in **step (3)**, with significant implications for step (4). Here's the breakdown:

  ### **Where the Argument Fails**
  1. **Step (3) is False: Repetition Isn't Just a "Revealer"**
     - The Kelly criterion's (step 1) dominance result *relies fundamentally* on the law of large numbers and ergodicity over repeated trials. The "with probability 1" dominance emerges *only* in the infinite long run. In a single trial or finite sequence, the expected log maximizer can lose to an expected value maximizer (e.g., betting 100% on a single 60/40 coin flip has higher EV and a 60% chance of a better outcome than Kelly).
     - **Why it seemed plausible**: When we see Kelly dominate *asymptotically*, it's tempting to think it reveals a "timeless truth" about rational choice. But this confuses *asymptotic optimality* with *per-instance rationality*. The theorem proves Kelly is optimal *for the specific goal of maximizing long-run compounded growth*, not that it's universally optimal for all goals or single decisions.

  2. **Step (4) Overgeneralizes Dangerously**
     - Step 4 assumes the "quantity your decision multiplies" is always your *entire future compounded wealth*. This is only true for decisions where:
       - The stake is reinvested in identical future gambles.
       - The "bankroll" is separable and defined solely for compounding (e.g., a dedicated investment portfolio).
     - In non-compounding decisions (e.g., risking eyesight for a cure, driving to campus), there is no multiplicative reinvestment. The "quantity" affected (e.g., lifetime utility) isn't being multiplied geometrically; it's altered additively or through a utility function.

  ### **Rejecting Step (3) Resolves the Absurdity**
  - **Long-run dominance ≠ per-instance rationality**. Kelly is rational *specifically when*:
    - You face many repeated, independent opportunities.
    - You care *only* about maximizing compounded terminal wealth.
    - You can fractionalize bets and reinvest fully.
  - **In non-repeated/non-compounding scenarios**, Kelly is often irrational. For your examples:
    - **Driving risk**: The probability of catastrophic loss is tiny, and the benefit (e.g., earning a salary) is additive to your life value. Maximizing *expected utility* (not log wealth) justifies driving. Expected log would be -∞ only if utility is logarithmic *and* "total loss" means utility = 0. But utility functions are bounded; losing "earning capacity" isn't utility = 0.
    - **Surgery/Second child**: These involve additive impacts on lifetime utility, not multiplicative growth. Maximize expected utility with a concave function (reflecting risk aversion), not expected log.

  ### **What Does This Cost?**
  Rejecting step (3) costs:
  - **Universality**: Geometric rationality isn't "the" rational rule for all decisions. It's domain-specific.
  - **Epistemic simplicity**: You must assess whether a decision is part of a compounding sequence. This is context-dependent (e.g., a one-off bet vs. a strategy for lifelong investing).

  ### **Residue of Geometric Rationality for One-Off Choices**
  Geometric rationality *only* applies to one-off choices in a limited way:
  - **If the stake is part of a future-compounding bankroll**: Even a single bet should be sized with Kelly if the winnings/losses will be reinvested in similar opportunities. Example: A venture capitalist betting on one startup, knowing all returns fund future bets.
  - **If utility is logarithmic**: If your utility function is *exactly* \( u(w) = \log(w) \), then maximizing expected utility *is* maximizing expected log wealth. But this is a special case. Humans aren't log-utility maximizers universally (we're more risk-averse for gains, less for losses).
  - **Not at all in non-financial/terminal choices**: For decisions with no reinvestment (e.g., spending winnings on consumption, risking health), use expected utility with a plausible risk-averse function.

  ### **Practical Resolution**
  1. **Define the compounding bankroll narrowly** *only when it's legitimate*: For dedicated investment capital (e.g., a trading account), use Kelly to size bets. But don't artificially narrow it to avoid the total-loss problem. If a loss would genuinely ruin *all* future compounding (e.g., bankruptcy), Kelly correctly avoids it.
  2. **For non-compounding decisions, use expected utility**: Incorporate:
     - Diminishing marginal utility (concave functions).
     - Catastrophic loss aversion (but bounded utility; e.g., dying isn't -∞ utility).
     - Separable impacts (e.g., eyesight loss affects utility, not multiplicative wealth growth).

  ### **Why the Finance Guy's Narrow Bankroll Fails**
  His solution works *only* if the "earmarked money" is truly isolated. But in your examples:
  - Losing earning capacity affects *all* future wealth accumulation → it's a total loss for the *life bankroll*.
  - Surgery risk affects health, which multiplicatively impacts life enjoyment → but not geometrically in monetary terms.

  ### **Conclusion**
  **Reject step (3):** The long run isn't just a revealer; it's a *necessary condition* for Kelly's dominance. Geometric rationality is rational *only* for decisions embedded in a multiplicative process. **Reject step (4)'s overgeneralization:** Maximize expected log only for quantities that compound.  
  **Result:** Kelly remains supreme for repeated investing/gambling, but expected utility (with sensible risk aversion) governs isolated, non-compounding, or terminal decisions. This preserves (1) and (6), avoids absurdity, and doesn't make rationality depend on unknown future decisions—only on the *structure* of the current decision's impact on future compounding.
