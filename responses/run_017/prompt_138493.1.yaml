prompt: |-
  I'm a fourth-year PhD student in cognitive psychology, and I've been drafted onto a small departmental committee that maintains an open textbook for our first-year graduate methods sequence. Every few weeks we have to decide whether a finding from the literature goes into the chapter, goes in with a caveat, or stays out, and the decisions are published as an appendix with our reasoning, so we have to be able to defend them to the original authors. The catch is that we get about forty-five minutes per finding, one member of the committee is an actual statistician who has to sign off, and the other three of us are substantive researchers who can run a t-test and read a confidence interval but will never read a word of philosophy of statistics. So I need something operational: an ordered set of questions, what counts as a sufficient answer to each, an explicit rule for when we stop and say no, and a point at which the procedure hands the decision back to us because the remaining question is one of values rather than facts.

  What I'd like it to draw on is the real structure of the disagreement between frequentist and Bayesian ways of reading evidence, not a list of warning signs about bad practice. In particular I want it to force us to keep separate three things we've noticed we routinely collapse: the claim that an effect exists at all, the claim about how large it is, and the claim about the mechanism that's supposed to produce it — because in our last few meetings we found that a replication often kills a magnitude claim while leaving the existence claim untouched, and we had no vocabulary for that. The procedure has to say what we do when the numbers we'd want aren't available (no effect size reported, no interval, no preregistration, only a p-value), it has to say what to do with a replication whose point estimate is in the same direction but a third of the original size, and with one whose interval excludes zero but also excludes the original estimate, and it has to be honest about which steps are judgment calls wearing a lab coat. One of our members keeps talking about severity in the error-statistical sense, another wants everything converted into a Bayes factor, and I'd like a procedure that doesn't preempt that argument but doesn't stall on it either. I'd also like it to make us state out loud the trade-off we're implicitly choosing between wrongly including a finding and wrongly excluding one, rather than having the procedure quietly pick it for us.

  Then I want it run on three cases. First: a preregistered, generously powered replication of a finding that my own dissertation builds on has just come back with a point estimate very close to zero and an interval that excludes the original effect size; I think I already know what the procedure should say and I'd like to watch it say that without flinching, and then tell me whether there is any legitimate way for me to keep using that finding in my third chapter. Second: a multi-site replication across a dozen countries that reports a pooled effect near zero but substantial heterogeneity, with the original effect reappearing at something like its original magnitude in two of the sites — is this a hidden moderator, a badly specified original, or a fluke, and what would the procedure need us to go find out before it can answer? Third: a single unregistered study with about forty participants per cell reporting a just-significant interaction, with no effect size given anywhere in the paper, which a colleague wants to build a grant around. Finally, I want to know what the procedure can't do: where it has to stop and hand the question to a person, and which kinds of finding it will systematically misjudge.
reasoning: |-
  We are designing a decision procedure for evaluating findings based on both frequentist and Bayesian principles, without requiring deep philosophical engagement. The procedure should separate three claims: existence, magnitude, and mechanism. It must handle missing information (e.g., no effect size, only p-value) and various replication scenarios. We also want to force an explicit trade-off between Type I and Type II errors (or their Bayesian analogs) and acknowledge when a decision is a judgment call.

  The procedure will be a flowchart or an ordered set of questions. We'll define:

  1. **Existence Claim**: Is there an effect? (H0: effect=0)
  2. **Magnitude Claim**: How large is the effect? (point estimate and interval)
  3. **Mechanism Claim**: Why does the effect occur? (theoretical explanation)

  We'll use both frequentist (e.g., p-values, confidence intervals, severity) and Bayesian (e.g., Bayes factors, posterior intervals) tools when available, but we aim for an operational hybrid that doesn't require complex calculations.

  Key principles:

  - **Severity (from error statistics)**: A claim passes with severity if the test would have detected a departure from the claim with high probability. We can use confidence intervals for severity assessments.
  - **Bayes Factors**: We might use them to quantify evidence for H0 vs H1, but we note that they depend on the prior. We'll only use them if they are provided or easily computable (e.g., with default priors).

  The procedure must be feasible in 45 minutes per finding.

  ---

  **Proposed Decision Procedure**

  We break the evaluation into stages:

  **Stage 0: Pre-screen for Methodological Quality**
     - Check for critical flaws (e.g., data fabrication, fatal confound). If found, reject without further consideration. Otherwise, proceed.

  **Stage 1: Evaluate the Existence Claim**
     - We ask: Is there evidence that the effect is non-zero?
     - Inputs: p-value, confidence interval, Bayes factor, or other evidence.
     - Rules:
          - If a well-justified Bayes factor (BF) is available:
              - If BF > 10: strong evidence for existence.
              - If BF < 1/10: strong evidence against existence (for H0).
              - Otherwise: inconclusive.
          - If only a p-value and confidence interval are available:
              - If p-value < 0.005 and the confidence interval (say 95%) excludes zero: evidence for existence.
              - If p-value >= 0.05 and the confidence interval includes zero: evidence against existence? Not exactly, but we note that a non-significant result doesn't prove H0. We use severity: if the test had high power (or severity) to detect an effect of minimally important size, then failing to reject H0 is evidence against an effect of that size or larger.
              - For p-values in [0.005, 0.05): we flag as "weak evidence" and require more scrutiny.

     - However, we must account for multiple comparisons, preregistration, and other issues. If the study is exploratory (not preregistered) and reports many tests, we downgrade the evidence.

     - **Handling missing information**:
          - If only p-value is given and no effect size or interval, we cannot assess magnitude. We can only use the p-value for existence, but note that without an effect size we cannot judge practical importance. We might use the p-value with a severity assessment: if the p-value is not small, and the test had high power for a meaningful effect, then we can reject the existence of a meaningful effect. But if the p-value is small, we know there is some effect but not how big.

     - **Output for Stage 1**: 
          - Strong evidence for existence, weak evidence for existence, inconclusive, weak evidence against existence, strong evidence against existence.

  **Stage 2: Evaluate the Magnitude Claim**
     - We ask: How large is the effect? And is the original magnitude claim supported?
     - Inputs: point estimate and confidence interval from the original study, and from replications if available.
     - We compare the original effect size estimate to:
          - The confidence interval from the original study (to see precision).
          - The confidence intervals from replications.
          - A meta-analytic estimate if multiple studies exist.

     - Rules:
          - If a replication's confidence interval excludes the original point estimate, then the original magnitude claim is challenged. We then look at the replication's point estimate and its own confidence interval to suggest a new magnitude.
          - We assess severity: 
              - If the original study claimed an effect of size δ, and a replication with high power to detect δ finds a much smaller effect, then the original claim is severely challenged.

     - **Handling a replication with point estimate in the same direction but smaller**:
          - We note that the existence claim may still hold (if the replication's interval excludes zero) but the magnitude is less than originally claimed. The original magnitude claim is not supported.

     - **Handling a replication with an interval that excludes zero but also excludes the original estimate**:
          - The existence claim is supported (effect is non-zero) but the magnitude claim is challenged. The effect is likely smaller than originally thought.

     - **Output for Stage 2**: 
          - Original magnitude claim: well-supported, partially supported (e.g., within a confidence interval but not the point estimate), not supported.

  **Stage 3: Evaluate the Mechanism Claim**
     - We ask: Is the proposed mechanism the best explanation? Are there alternative explanations?
     - This is more theoretical and less statistical. We look for:
          - Manipulation checks: did the experimental manipulation work?
          - Mediation analyses: is there evidence for the mediating process?
          - Moderators: are there boundary conditions?
          - Ruling out confounds: did the design control for alternative explanations?
     - We note that a replication that fails might indicate a problem with the mechanism (if the replication was faithful) or it might indicate a moderator.

     - **Output for Stage 3**: 
          - Well-supported, partially supported (e.g., some evidence but also alternative explanations), not supported.

  **Stage 4: Overall Integration and Trade-off**
     - We now combine the three claims and make an overall decision: include without caveat, include with caveat, or exclude.
     - We force an explicit statement of the trade-off between false inclusion and false exclusion. We might set a threshold for what level of evidence is required for inclusion without caveat. For example:
          - We might say that for a finding to be included without caveat, we require strong evidence for existence and magnitude claims and at least partial support for the mechanism.
          - For inclusion with caveat, we might require at least weak evidence for existence and some evidence for magnitude (even if not the original claim) and mechanism.

     - The committee must explicitly state the cost of false inclusion (e.g., misleading students) vs. false exclusion (e.g., omitting a true finding). This is a judgment call, but the procedure forces them to state it.

     - **Rule for stopping and handing back**: 
          - If at any stage we cannot proceed due to missing information (e.g., no effect size, no power information) and we cannot make a reasonable assumption, we note the gap and then the committee must use judgment. 
          - Also, when the evidence is mixed (e.g., replication in some sites but not others) and there is no clear statistical resolution, we must use judgment.

     - The procedure stops and hands back for a judgment call when:
          - The evidence is conflicting and cannot be resolved by the available data (e.g., substantial heterogeneity in a meta-analysis).
          - The mechanism claim is underdetermined by the data and requires theoretical debate.

  ---

  **Running the Cases**

  **Case 1: Preregistered, generously powered replication of a finding your dissertation builds on**
     - Original finding: some effect size, say d = 0.5, 95% CI [0.3, 0.7], p < .001.
     - Replication: point estimate near zero, 95% CI [-0.1, 0.1] which excludes 0.5.

     - Stage 1: Existence claim in the original was supported, but the replication has a point estimate near zero and CI that includes zero (and excludes original). The replication, being high-powered, has high severity to detect an effect of d=0.5. Therefore, the original existence claim (for an effect of that magnitude) is severely challenged. However, note: the existence claim for a non-zero effect might still hold? But the replication found no evidence for a non-zero effect. The replication has high power (say 95%) to detect an effect of d=0.3 (the lower bound of the original CI). Therefore, the non-existence of an effect of at least d=0.3 is well-supported. For a very small effect (say d=0.05), the replication might not have had power. But the CI [-0.1, 0.1] suggests that the effect is likely less than 0.1 in absolute value. So we have strong evidence against the existence of an effect of the originally claimed magnitude and even of a smaller but still meaningful magnitude? The committee must decide what a minimally important effect size is. Without that, we note: the replication provides strong evidence that the effect is not as large as originally claimed and may be near zero.

     - Stage 2: Magnitude claim: The original claimed magnitude (d=0.5) is excluded by the replication's CI. So the magnitude claim is not supported.

     - Stage 3: Mechanism claim: If the replication was a direct replication, then the mechanism (which predicted a non-zero effect) is challenged. However, the mechanism might be saved if there is a reason for the discrepancy (e.g., context difference). But the burden is now on the original theory to explain why the effect disappeared.

     - Overall: The finding should be included with a strong caveat, or even excluded? The procedure would say: we have strong evidence against the original magnitude and the existence of an effect of the originally claimed size. The mechanism is also challenged. The trade-off: if we exclude, we risk omitting a finding that might be true in some contexts. If we include without caveat, we mislead. The committee might decide to include with a caveat: "A high-powered replication failed to find the effect, suggesting the original effect might have been overestimated or context-dependent."

     - For your dissertation: The procedure tells you that you cannot use the original finding as strong evidence for an effect of that magnitude. You might use it to illustrate a historical context, but your third chapter must account for the replication failure. You might reframe to investigate why the effect disappeared.

  **Case 2: Multi-site replication with pooled effect near zero and heterogeneity, original effect in two sites**
     - Pooled estimate: d = 0.05, 95% CI [-0.01, 0.11] (near zero, CI includes zero)
     - Heterogeneity: substantial (I^2 high, say 70%)
     - Two sites: d = 0.45 and 0.50, with CIs [0.2,0.7] and [0.25,0.75] (so excluding zero and near the original)

     - Stage 1: Existence claim. The pooled estimate does not support a non-zero effect (CI includes zero). However, the heterogeneity suggests that the effect varies. So we cannot say the effect does not exist anywhere; it might exist in some contexts. The existence claim must be qualified: the effect exists in some contexts.

     - Stage 2: Magnitude claim. The original magnitude is supported in two sites, but the overall magnitude is near zero. So the magnitude claim is context-dependent.

     - Stage 3: Mechanism claim. The original mechanism must account for why the effect only appears in some sites. The procedure would require us to look for a moderator. Without a pre-specified moderator, this is exploratory. The committee must decide: do we have a theoretical basis for a moderator? If not, the mechanism is not well supported.

     - What the procedure needs: It requires a pre-specified moderator analysis. If the original theory predicted a moderator, then we can check if it explains the heterogeneity. If not, we must conduct a new study to test candidate moderators. Without that, we cannot resolve the mechanism claim.

     - Overall: The finding is included with a caveat: "The effect is replicable only in some contexts, and the reasons for this variation are not yet understood."

  **Case 3: Single unregistered study, 40 per cell, just-significant interaction (p=0.04), no effect size given**
     - This is a common scenario.

     - Stage 1: Existence claim. We have a p-value of 0.04, which by our rule (from Stage 1) is weak evidence (since we set the threshold for strong at 0.005). Also, without an effect size or interval, we cannot assess magnitude. Moreover, the study is unregistered and so might be exploratory. We must assess severity: with 40 per cell, the power to detect a small effect (say d=0.3) is only about 40% (for a two-sample t-test, but for an interaction it might be similar). So the test had low severity for detecting a small effect. The p-value of 0.04 might be a false positive. We have weak evidence for existence.

     - Stage 2: Magnitude claim: No effect size reported. We cannot assess. We might try to compute one from the data if available, but the paper doesn't give it. We have to say: magnitude unknown.

     - Stage 3: Mechanism claim: The interaction might be predicted by theory, but without strong evidence for existence and no magnitude, the mechanism claim is weak.

     - Overall: This finding is weak. The committee must weigh the trade-off: including it risks promoting a false finding; excluding it risks omitting a true one. Given the weak evidence and lack of preregistration, we might exclude it or include it with a strong caveat. The procedure would flag that the evidence is weak and the study is exploratory.

     - The colleague wanting to build a grant around it: The procedure would caution against building a grant solely on this finding. They should first replicate it.

  **What the procedure can't do**

  - It cannot resolve theoretical disputes about mechanisms.
  - It cannot handle extreme cases of data fraud without external evidence.
  - It might be too conservative if it requires high thresholds, thereby excluding true but noisily measured effects.
  - It might be misapplied if the committee does not correctly assess severity or power.
  - It requires the committee to set a minimally important effect size for some assessments, which is a judgment call.
  - It doesn't automatically handle complex designs (e.g., multilevel models) without additional statistical input.

  The procedure forces explicit judgments and separates the three claims, but at the cost of sometimes being inconclusive and requiring human judgment. It is designed to be transparent and to make the committee's reasoning accountable.
answer: |-
  Below is a structured, operational decision procedure for your committee, designed to handle the complexities you described. It separates existence, magnitude, and mechanism claims; incorporates insights from frequentist (error-statistical severity) and Bayesian (Bayes factors) frameworks without requiring philosophical expertise; forces explicit trade-off discussions; and includes rules for missing data, replications, and judgment calls. The procedure is built as a flowchart with explicit stopping rules, and it flags when decisions revert to committee judgment (due to values or irreducible uncertainty). 

  The procedure is divided into **5 stages**, with a maximum of 45 minutes per finding. Each stage has specific questions, sufficient-answer criteria, and a "stop/exclude" threshold. It assumes you have the original paper and any replications/meta-analyses. If information is missing, the procedure defaults to conservative handling.

  ---

  ### **Decision Procedure for Textbook Findings**
  **Key Principles**  
  - **Existence Claim**: Is there a non-zero effect? (Null: effect = 0)  
  - **Magnitude Claim**: What is the effect size? (Point estimate and interval)  
  - **Mechanism Claim**: What process causes the effect? (Theory-driven)  
  - **Trade-off**: Committee must explicitly state costs of false inclusion (e.g., teaching noise) vs. false exclusion (e.g., omitting truth) at the start.  
  - **Severity (Frequentist)**: A claim is severely tested if the test had high probability to detect a departure from it.  
  - **Bayes Factors (BF)**: Used if computable in <5 min (e.g., via online calculators with default priors). BF > 3 supports evidence; BF > 10 strong evidence.  
  - **Judgment Call Flag**: ⚖️ indicates steps requiring committee values.  

  ---

  #### **Stage 0: Setup (5 min)**  
  **Question 0.1**: What are the trade-offs for false inclusion vs. false exclusion?  
  - **Sufficient answer**: Explicit statement (e.g., "False inclusion harms textbook credibility, so we prioritize caution").  
  - **Rule**: Must be stated before proceeding.  

  **Question 0.2**: Is there a critical flaw (e.g., data fraud, fatal confound)?  
  - **Sufficient answer**: Unanimous agreement on flaw.  
  - **Stop/exclude**: If flaw is found.  
  - **Missing data rule**: If key details (e.g., methods) are absent, exclude.  

  ---

  #### **Stage 1: Existence Claim (10 min)**  
  *Goal: Assess evidence for non-zero effect.*  
  **Question 1.1**: Does the finding include a replication?  
  - **If no**: Use original study only.  
  - **If yes**: Use most rigorous replication (e.g., largest sample, preregistered).  

  **Question 1.2**: What is the evidence against the null (effect = 0)?  
  - **Sufficient answers** (prioritize in order):  
    - **BF available**: BF > 3 → Supports existence; BF < 1/3 → Supports null.  
    - **95% CI available**: CI excludes 0 → Supports existence; CI includes 0 → Challenges existence.  
    - **p-value only**: p < 0.005 → Strong evidence; 0.005 ≤ p < 0.05 → Weak evidence; p ≥ 0.05 → Inconclusive/against.  
  - **Missing data rule**: If no interval/BF/p-value, compute from summary stats if possible (e.g., t-test from means/SDs). If not, existence claim fails.  
  - **Severity integration**: If CI includes 0 but the test had high power (≥80%) to detect a minimally important effect (⚖️ committee defines this upfront, e.g., d=0.2), then failing to reject null is severe evidence against existence.  

  **Question 1.3**: Is there replication evidence?  
  - **Replication with same-direction estimate but smaller size**: Existence claim stands if replication CI excludes 0.  
  - **Replication with CI excluding 0 but excluding original estimate**: Existence claim stands (effect non-zero), but magnitude is challenged.  
  - **Replication with CI including 0**: Existence claim challenged. Use severity: If replication had high power to detect original effect, this is severe evidence against existence.  

  **Stop/exclude**:  
  - Existence claim rejected if:  
    - BF < 1/3, OR  
    - p ≥ 0.05 AND severity assessment (high power to detect minimal effect), OR  
    - Replication CI includes 0 AND severity against existence.  
  - Proceed to Stage 2 if existence is supported or ambiguous.  

  ---

  #### **Stage 2: Magnitude Claim (10 min)**  
  *Goal: Assess if reported effect size is reliable.*  
  **Question 2.1**: What is the original effect size?  
  - **Sufficient answer**: Point estimate and 95% CI (or equivalent).  
  - **Missing data rule**: If absent, compute from data. If impossible, magnitude claim fails.  

  **Question 2.2**: Is the magnitude consistent with replications?  
  - **Replication point estimate in same direction but smaller**: Magnitude claim challenged if replication CI excludes original estimate.  
  - **Replication CI excludes original estimate**: Magnitude claim rejected.  
  - **Replication CI includes original estimate**: Magnitude claim supported.  

  **Question 2.3**: Is there evidence for magnitude robustness?  
  - **Severity**: If original study had low power (<50%) for the claimed effect, magnitude claim is weak.  
  - **Bayesian**: If posterior interval (from BF calculator) excludes original estimate, magnitude claim challenged.  

  **Stop/exclude**:  
  - Magnitude claim rejected if:  
    - Replication CI excludes original estimate, OR  
    - Original CI is extremely wide (e.g., range > 2x minimal effect size ⚖️).  
  - Proceed to Stage 3 if magnitude is supported or ambiguous.  

  ---

  #### **Stage 3: Mechanism Claim (10 min)**  
  *Goal: Assess if the proposed mechanism is the best explanation.*  
  **Question 3.1**: Does the design directly test the mechanism?  
  - **Sufficient answer**: Manipulation checks, mediation, or controlled confounds.  
  - **Missing data rule**: If absent, mechanism claim is weak.  

  **Question 3.2**: Are there plausible alternatives?  
  - **Sufficient answer**: Consider confounding variables, demand characteristics, or other theories.  

  **Question 3.3**: Does replication success/failure align with the mechanism?  
  - **Direct replication failure**: Mechanism challenged unless moderator identified.  
  - **Heterogeneous replications (e.g., multi-site)**: Mechanism requires moderator analysis.  

  **Stop/exclude**:  
  - Mechanism claim rejected if:  
    - Critical confound unaddressed, OR  
    - Direct replication fails with no explanation.  
  - Proceed to Stage 4 if mechanism is supported or ambiguous.  

  ---

  #### **Stage 4: Integration & Decision (10 min)**  
  *Goal: Combine claims and make final call.*  
  **Question 4.1**: What is the overall evidence?  
  - **Strong support**: All claims well-supported (existence: BF > 10 or p < 0.005 + narrow CI; magnitude: replicated; mechanism: direct test).  
  - **Moderate support**: Existence and magnitude supported, mechanism weak.  
  - **Weak support**: Existence supported, magnitude/mechanism weak or missing.  

  **Question 4.2**: Does the trade-off justify inclusion?  
  - ⚖️ Committee votes: "Include only if benefits outweigh costs of false inclusion."  

  **Output**:  
  - **Include without caveat**: Strong support, no replication conflicts.  
  - **Include with caveat**: Moderate/weak support, or replication conflicts.  
  - **Exclude**: Existence rejected, or magnitude/mechanism rejected with no redeeming value.  

  **Judgment call trigger**:  
  - If claims are conflicting (e.g., existence supported but magnitude challenged), or heterogeneity is unexplained, procedure stops and committee decides based on trade-offs.  

  ---

  ### **Procedure Applied to Your Cases**
  **Case 1: Preregistered, high-powered replication of your dissertation finding**  
  - **Original**: Effect size d = 0.5, 95% CI [0.3, 0.7].  
  - **Replication**: Point estimate ~0, 95% CI [-0.1, 0.1] (excludes original estimate).  
  - **Stage 1 (Existence)**: Replication CI includes 0. With high power, severity is high → **Existence claim rejected**.  
  - **Stage 2 (Magnitude)**: Replication CI excludes original estimate → **Magnitude claim rejected**.  
  - **Stage 3 (Mechanism)**: Direct replication failure → **Mechanism claim challenged**.  
  - **Stage 4**: Overall → **Exclude**.  
  - **Your dissertation**: The procedure rejects the original finding. You can mention it historically (e.g., "initial report, but failed replication suggests overestimation"), but not as evidence. To use it, you must: (1) explain why replication failed (e.g., moderator), or (2) show your chapter tests a distinct mechanism.  

  **Case 2: Multi-site replication with heterogeneity**  
  - **Pooled effect**: d = 0.05, 95% CI [-0.01, 0.11] (near zero).  
  - **Heterogeneity**: High (I² = 70%), with 2/12 sites showing original effect (d = 0.45, CI [0.2, 0.7]).  
  - **Stage 1 (Existence)**: Pooled CI includes 0, but heterogeneity exists → **Existence supported only contextually**.  
  - **Stage 2 (Magnitude)**: Original magnitude replicated in 2 sites, but pooled estimate near zero → **Magnitude claim context-dependent**.  
  - **Stage 3 (Mechanism)**: High heterogeneity implies unmeasured moderator → **Mechanism claim requires moderator analysis**.  
  - **Stage 4**: ⚖️ **Judgment call** (unresolved heterogeneity). Procedure stops; committee must decide if finding is included with caveats.  
  - **What you need**: Test if sites with the effect share a pre-specified moderator (e.g., culture, method). If none, it may be a fluke. Include only if moderator is theoretically justified.  

  **Case 3: Unregistered study, 40 per cell, p = 0.04 interaction, no effect size**  
  - **Stage 1 (Existence)**: p = 0.04 → weak evidence. With n = 40/cell, power for minimal effect (d=0.5) is ~50% → low severity. **Existence weak**.  
  - **Stage 2 (Magnitude)**: No effect size → **Magnitude claim fails**.  
  - **Stage 3 (Mechanism)**: No manipulation checks → **Mechanism claim weak**.  
  - **Stage 4**: Weak evidence, no preregistration → **Exclude** (unless trade-off favors inclusion).  
  - **Grant-building**: Procedure advises against building a grant on this. Require replication with preregistration and effect size.  

  ---

  ### **What the Procedure Can't Do (Limitations)**  
  1. **Judgment calls it cannot resolve**:  
     - Unexplained heterogeneity (Case 2).  
     - Defining "minimal important effect size" (⚖️ committee-dependent).  
     - Weighting costs of false inclusion/exclusion (⚖️ values-based).  
     - Adjudicating between severity and Bayes factors when they conflict (e.g., severity rejects existence but BF > 3).  

  2. **Systematic biases**:  
     - **Conservatism**: May exclude true effects with noisy data (e.g., underpowered studies).  
     - **Bayesian prior sensitivity**: Default priors in BF calculators may misrepresent evidence.  
     - **Mechanism oversimplification**: Struggles with complex theories (e.g., emergent processes).  

  3. **Edge cases**:  
     - **Publication bias**: Cannot adjust for unreported replications.  
     - **p-hacking**: Only detects if obvious (e.g., p = 0.049).  
     - **Theoretical disputes**: E.g., if mechanism is debated in literature (requires expert judgment).  

  ---

  ### **Practical Use Tips**  
  - **Timer**: Allocate strict time per stage (use a stopwatch).  
  - **Statistician role**: Resolves BF/severity calculations and missing data imputations.  
  - **Template for appendix**: Document answers to each question and trade-offs.  
  - **Avoiding stalemates**: If Bayes factor vs. severity debate arises, default to the method with the most complete data. If equal, use committee vote.  

  This procedure forces clarity on existence, magnitude, and mechanism; handles replications and missing data; and embeds statistical rigor without philosophy. It ensures your textbook reflects cumulative science, not single studies.
