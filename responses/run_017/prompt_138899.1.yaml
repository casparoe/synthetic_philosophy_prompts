prompt: |-
  Hey — I need help planning next week's section, not the material itself.

  Setup: fifty-minute discussion section, Philosophy of Science for non-majors — mostly compsci and econ kids who have seen Bayes' theorem once in a stats class and can multiply out a posterior, but have had nothing on confirmation theory, nothing on hypothetico-deductivism. The topic is the problem of old evidence. I know the dialectic; what I don't have is an order for it.

  The dependency question is what I keep getting stuck on. I think something has to be established before the puzzle can even be stated — something like: for the Bayesian, learning is becoming certain, the thing you become certain of has to have had a prior below 1, and confirmation is probability-raising, not "this makes sense of that." But I can't tell whether that last bit belongs up front or whether it's actually the moral I should let them arrive at, and if it goes up front I worry it deflates the puzzle instead of setting it up. Tell me what has to be on the board, in what order, and what breaks if I move a piece earlier.

  The carrying case. I keep reaching for the perihelion of Mercury and I've decided that's wrong for this group — their physics is one semester of mechanics and it invites "maybe the measurements were just off." My fallback is a who-dunnit: the muddy boots have been sitting in the hallway the whole time, the new hypothesis is that the gardener did it, and everyone in the room feels the "oh, *that's* why" without any new data arriving. Give me one case to build the whole fifty minutes around, and say what it has to have and what it has to lack — my guess is it needs (a) a fact every student has known since childhood, (b) a hypothesis nobody could suspect was reverse-engineered to fit it, and (c) no wriggle room where someone can say the genuinely new evidence is the derivation someone performed later.

  Misconceptions I'm expecting, and I want these placed in the sequence rather than listed: (1) "easy — just redo the update with your earlier prior," which I take to be the counterfactual/ur-prior move wearing a disguise, and I don't want them filing it as epistemic amnesia; (2) "the real evidence is new, it's the calculation," which feels like a dodge to me but I can't say cleanly why; (3) "so Bayesianism is just false"; (4) "this only shows up in dusty historical cases with old theories"; (5) and this group specifically: "if the data was already in front of you, any fit to it is overfitting," which is the machine-learning intuition leaking in. Which of these do I head off, at which point in the sequence, and what am I not seeing?

  One thing I've started believing and can't place: that the real lesson is that the Bayesian picture has no room for the difference between predicting something in advance and merely accommodating it, and that the old-evidence problem is just that gap showing up in one place. Tell me whether to put that in, where, or whether it muddies the fifty minutes.

  And tell me straight what to leave out at this level and say out loud that I'm leaving it out — I don't want to open the door to the bootstrapping formalisms or to probability kinematics, but I also don't want to look like I'm hiding something when a sharp student asks.

  Format: give me a markdown table, one row per step, with exactly these columns — Order (1..n) | Move (what I say or put on the board, one or two sentences) | Depends on (which earlier row it needs and what breaks if it comes sooner) | Misconception defused here (name the numbered one, or "—") | Check (the question or board vote that tells me this step landed before I move on). Then a second short table with columns Left out | Why it's out | What to say when someone asks, for the three or four things you think I should name-and-decline. Then one line: Exit question — the single question I ask at minute 48 that separates someone who has the puzzle from someone who has the vocabulary.
reasoning: |-
  Okay, the user is teaching a Philosophy of Science discussion section for non-majors, focusing on the problem of old evidence within Bayesian confirmation theory. They've got a clear grasp of the dialectic but need help structuring the 50-minute session effectively. 

  First, let's unpack their core challenges: They're wrestling with pedagogical sequencing—what foundational concepts must precede the puzzle to make it land without deflating it. The muddy boots example seems promising as an accessible case study, but needs specific attributes: universally known facts, an unsuspicious hypothesis, and no "new evidence" loopholes. 

  Hmm, their listed misconceptions reveal where students typically get derailed. The "just redo the update" response (#1) is especially tricky—it's a superficial fix masking deeper issues with counterfactual priors. And the ML-inspired overfitting worry (#5) will resonate with compsci/econ students. 

  The user's insight about prediction vs. accommodation feels pivotal. That's not muddying—it's the conceptual anchor. But introducing it too early might short-circuit discovery. Should sit at the climax after the puzzle is felt. 

  *Scratching head* Their physics aversion makes sense. Mercury's perihelion invites measurement skepticism, and these students lack GR context. The whodunit avoids that, but... wait, could the gardener hypothesis feel reverse-engineered? Maybe stress that the hypothesis emerged independently (e.g., from alibi inconsistencies). 

  *Nodding* Sharp callouts on omissions are crucial. Bootstrapping formalisms would explode scope, and probability kinematics is grad-level. Need transparent "why we skip" scripts. 

  For the exit question, it must force distinction between parroting definitions ("confirmation is probability-raising") versus grokking why old evidence strains that definition. Something like... "If Bayesians treat learning as becoming certain, why can't we 'unlearn' old evidence to test hypotheses?" 

  *Pausing* The table format request is smart. It'll force precision on dependencies—e.g., you can't dissect the counterfactual move before establishing Bayesian learning rules. Each misconception should be addressed exactly when it's likely to arise naturally.
answer: |-
  Here’s a structured 50-minute plan focusing on clarity, engagement, and addressing key misconceptions. The muddy boots "whodunit" case anchors the discussion.

  ### **Core Case: The Muddy Boots Whodunit**  
  - **Setup**: A prized vase is shattered. Everyone knows muddy boots were left in the hallway all night (old evidence *E*).  
  - **New hypothesis *H***: "The gardener did it" (derived from alibi inconsistencies, *not* engineered to fit the boots).  
  - **Why it works**:  
    - (a) Universally understandable "old evidence" (muddy boots).  
    - (b) *H* feels explanatory ("*That’s* why the boots are there!").  
    - (c) No "new data" loophole (the derivation isn’t evidence—it’s logical insight).  

  ---

  ### **Lesson Plan Table**
  | Order | Move | Depends On | Misconception Defused | Check |
  |-------|------|------------|------------------------|-------|
  | **1** | "Bayesian confirmation = probability-raising. If *H* predicts *E*, learning *E* should raise *P(H)*. Learning = becoming certain of *E*." | — | — | Board vote: *"If E supports H, must P(H\|E) > P(H)?"* (Yes: 100%). |
  | **2** | Present whodunit: "We *all knew* boots were muddy (E). New clue: Gardener’s alibi is fake (H). *H* explains *E*. Does *E* confirm *H*?" | Step 1 | — | Poll: *"Does the old boot evidence now support the gardener hypothesis?"* (Yes: 90%+). |
  | **3** | "Problem: For Bayesians, if you *already knew E*, *P(E)=1*. Then *P(H\|E) = P(H)*. So *E* doesn’t raise *H*’s probability!" | Steps 1–2 | — | *"Where’s the tension?"* → Students spot contradiction (intuition vs. math). |
  | **4** | **Objection 1**: "Just ‘forget’ *E*! Update *as if* you never knew it." | Step 3 | #1 (counterfactual move) | *"What’s the cost?"* → Highlight: Forgetting known truths is irrational (epistemic amnesia). |
  | **5** | **Objection 2**: "The *real* new evidence is *deriving* that *H* entails *E*!" | Step 3 | #2 ("calculation as evidence") | *"Is the derivation *evidence* or *logic*?"* → Stress: Logic isn’t empirical evidence; we knew *E* all along. |
  | **6** | **Objection 3**: "This is just historical—it doesn’t matter now." | Step 3 | #4 ("dusty cases") | *"Do *you* ever explain old data with new theories?"* (ML? Economics?) → Real-world relevance. |
  | **7** | **Key Insight**: "Bayesians can’t distinguish *predicting* new data (strong confirmation) from *accommodating* old data (weak/no confirmation). Old evidence exposes this gap." | Steps 3–6 | — | *"Why can’t Bayesians reward ‘prediction’ over ‘accommodation’?"* → Discuss rigidity of rules. |
  | **8** | **Objection 4**: "If *H* fits old data, it’s overfitting!" | Step 7 | #5 (ML intuition) | Contrast: *H* isn’t *fitted* to *E*—it’s independently motivated (gardener’s fake alibi). |
  | **9** | **Moral**: "Bayesianism struggles with non-empirical virtues (explanation, simplicity). Old evidence is a symptom." | Step 7 | #3 ("Bayesianism false") | *"Does this *falsify* Bayesianism, or show its limits?"* → Latter: It’s a challenge, not a refutation. |

  ---

  ### **Omissions Table**
  | Left Out | Why It’s Out | Response If Asked |
  |----------|--------------|-------------------|
  | **Bootstrapping** (e.g., Glymour) | Too formal; distracts from core Bayesian tension. | "We’re focusing on *Bayesian* responses today—but other frameworks exist to handle this." |
  | **Probability Kinematics** (Jeffrey) | Requires radical probability revision; too advanced. | "Jeffrey conditioning handles uncertain evidence, but it’s complex and doesn’t fully solve old evidence." |
  | **Ur-Priors** (counterfactual priors) | Philosophically dubious; feels ad hoc. | "Many think ‘forgetting’ known evidence is artificial—we’ll discuss alternatives next week." |

  ---

  ### **Exit Question (Minute 48)**  
  > *"If Bayesian learning requires becoming certain of new evidence, why can’t we treat the derivation (that H entails E) as the ‘new evidence’ instead of E itself?"*  

  **Purpose**: Tests if they grasp that (a) evidence must be empirical, not logical, and (b) *E* itself was always known. A student who "has the puzzle" will see this as a sleight of hand.  

  ---

  ### **Key Sequence Logic**  
  - **Steps 1–3** set the trap: Create visceral agreement that *E* confirms *H*, then reveal Bayesianism forbids it.  
  - **Steps 4–6** dismantle quick fixes: Each objection is addressed when intuitionally tempting.  
  - **Step 7** is the climax: The prediction/accommodation gap is the deep lesson.  
  - **Steps 8–9** contextualize: Prevents overfitting panic (#5) and "Bayesianism is dead" (#3).  

  **Why this works**: The muddy boots case forces the paradox *before* technicalities. By rejecting "calculation as evidence" early (Step 5), you close the main loophole. Saving the prediction/accommodation point for Step 7 makes it the payoff, not a spoiler.
