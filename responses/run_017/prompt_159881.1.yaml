prompt: |-
  I'm a fourth-year PhD student and I'm giving a 30-minute talk at our metaphysics reading group next month (mostly grad students, three faculty) defending a view about causation by omission that I've been kicking around for a couple years, and I'd rather walk in with real Q&A prep than with vibes. Quick sketch of the thesis so you have something to aim at: omissions are genuine causes, but they aren't a special kind of causal relatum and they don't need any norm, expectation, or duty clause to get into the causal story. What I call the default-value picture: in an interventionist causal model every variable has a distinguished default value, and "the gardener didn't water the plant" just is the claim that the watering variable sits at its default. Omissions get *selected* without profligacy because of what I call liveness: a variable earns a place in the model only if there's a mechanism actually coupled to the outcome that could in principle have delivered a non-default value. The Queen of England has no such coupling to your plant, so she isn't in the model and never was, and the "why not her?" problem dissolves without anyone having to say she had no obligation to water it. The folk data where people's causal judgments slide around with what the agent was supposed to do I want to explain as a model-construction effect: norm cues tell you which mechanisms and couplings to bother representing, they aren't constitutive of the causal relation itself. Call that explanatory priority, not reduction. I've already got replies ready for the "absences aren't events, and your causal relata are events" line and for the standard double-prevention cases, so don't spend much time there.

  The audience is the thing I want help with, because I know exactly who'll be in the room. There's a Lewisian who thinks the but-for analysis is roughly right for events and that omissions are at best quasi-causal; two people who do causal modeling in the interventionist style and who will want to know whether "default value" is anything more than notation they already use and whether liveness is smuggled in rather than read off the model; a legal theorist who thinks the but-for test has to be supplemented with a voluntary-conduct or duty condition and who'll say my account can't explain why the law treats omissions differently from mere non-occurrence; someone from the experimental side who thinks the norm-sensitivity findings show norms are doing real causal-selecting work and that my "model construction" story is unfalsifiable; and one philosopher of physics who is going to press me on whether "the system did nothing" is even well-defined once you stop talking about a model and start talking about what's physically going on. Q&A is about ten minutes, so I need to triage.

  What I want is a prep sheet, not a defense of the view: the seven or eight objections I'll actually get from these people, ordered by how likely and how damaging they are, each phrased the way that person would actually phrase it rather than in my vocabulary, each with a two-minute reply and a note on where that reply is soft. Tell me what I should concede in the talk itself before anyone asks, which single reply has to land for the view to survive the hour, and — the part I care most about — the one objection I'm hoping nobody asks. Bonus points if you can spot the place where liveness is doing more work than I've admitted.
reasoning: |-
  Okay, the user is a fourth-year PhD student preparing for a 30-minute talk on causation by omission. Their thesis argues that omissions are genuine causes without needing norms or duties, using a default-value model in interventionist frameworks. They need help anticipating objections from specific audience members and preparing concise replies.

  First, I need to understand the core of their argument. They propose that every variable has a default value, and omissions occur when that variable stays at default. Liveness ensures only relevant mechanisms (those that could change the outcome) are in the model, solving problems like the Queen not watering plants. Norms influence model construction but aren't part of causation itself.

  The audience includes several key figures:
  - A Lewisian who supports but-for causation and sees omissions as quasi-causal.
  - Two interventionists who might question if "default value" adds anything new or if liveness is smuggled in.
  - A legal theorist concerned with how law distinguishes omissions from non-occurrence based on duties.
  - An experimentalist who believes norm-sensitivity data shows norms are causal, and that the model-construction story is unfalsifiable.
  - A philosopher of physics questioning the physical basis of "doing nothing."

  The user wants a prep sheet with likely objections, ordered by impact, phrased in the objector's terms, with two-minute replies, concessions to make upfront, which reply is critical, and the dreaded objection they hope isn't asked.

  Starting with the most damaging objections, the interventionists' challenge about liveness being smuggled in is crucial. If liveness isn't derivable from the model and is pre-selected, it might undermine the whole framework. The reply must clarify that liveness is based on physical dependencies, not norms, but this is a soft spot because it's hard to prove without prior knowledge.

  Next, the philosopher of physics questioning the physical reality of defaults and "doing nothing" is vital. If defaults aren't grounded in physics, the model might be seen as merely representational. The reply should tie defaults to minimal energy states or natural tendencies, but this is speculative without empirical evidence.

  The legal theorist's point about the law requiring duties for omissions is both likely and damaging. The user must explain that the law uses normative criteria for responsibility, not causation itself. Conceding that the model doesn't address responsibility could help, but the lack of legal distinction might weaken the argument.

  The experimentalist's unfalsifiability charge is common. The user should propose testable predictions about norm cues affecting model selection, though this is a soft spot if such experiments aren't feasible yet.

  The Lewisian's objection is less critical since the user already has replies, but addressing it quickly reinforces their stance on omissions as causes.

  The user should concede upfront that the model is a representation and that liveness depends on pre-model physical facts. The critical reply is to the interventionists—liveness must be defended as model-independent. The dreaded question is whether liveness itself relies on norms, which the user hasn't addressed, potentially collapsing their explanatory priority claim.

  Spotting where liveness does extra work: it implicitly handles relevance, which usually involves norms. If liveness depends on what "could" deliver a non-default value, that "could" might involve normative expectations, undermining the claim that norms aren't constitutive.
answer: |-
  Here's your targeted Q&A prep sheet, ordered by damage potential (high to medium) and likelihood. I've distilled each objection into the speaker's likely phrasing, crafted a sharp 2-minute reply, flagged soft spots, and added strategic concessions + the "dreaded question." Crucially, **liveness is doing hidden work on *relevance* and *asymmetry*** (more below).

  ---

  ### **Preemptive Concessions to Bake Into Your Talk**
  1. **"Default values are model-relative representations, not intrinsic metaphysical properties."** (Disarms the physics objection early)  
  2. **"Liveness depends on pre-model facts about physical dependencies—it doesn't *create* causality."** (Preempts interventionists' "smuggling" worry)  
  3. **"This account doesn't eliminate norms from *responsibility* or *explanation*—only from the causal relation itself."** (Mollifies legal/experimental critics)  

  ---

  ### **The Critical Reply That Must Land**  
  **Interventionist's "Liveness Smuggling" Objection** (below). If this fails, your account collapses into hand-waving. Hammer: *"Liveness is read off physical coupling—it's why we build the model that way."*  

  ---

  ### **Ranked Objections & Replies**  
  1. **Interventionist #1** (Likely: ★★★★★ | Damage: ★★★★★)  
     *Phrasing:* "You say 'default value' like it's novel, but in causal modeling it's just a notational choice—we set the baseline. And 'liveness' sounds like you're *preselecting* which variables matter before building the model. Isn't this circular? The model should *tell us* what's relevant, not assume it."  
     **Reply:** "Defaults *are* notation—but their *distinguished status* isn't. In standard models, any value can be 'baseline,' but here, the default is the value the system takes *without intervention*—it's the 'do-nothing' state inferred from mechanics. Liveness isn't preselected; it's derived from counterfactual dependencies: a variable is 'live' if there exists *any* intervention setting it to non-default that changes the outcome. If no such intervention exists, it's inert and excluded. This is testable in the model structure."  
     **Soft Spot:** If pressed, admit liveness requires *prior knowledge* of possible interventions ("could in principle deliver non-default"). But stress: this is **physical possibility**, not normativity.  

  2. **Philosopher of Physics** (Likely: ★★★★☆ | Damage: ★★★★★)  
     *Phrasing:* "What does 'the system did nothing' mean *physically*? At the microlevel, particles are always doing *something*. Your 'default state' seems like a pragmatic label for human convenience—not an ontic feature of causation."  
     **Reply:** "Agreed—'doing nothing' isn't fundamental physics. But macroscopic causation *requires* coarse-graining. Defaults represent a *minimal-energy or natural tendency state* relative to the grain. E.g., a valve's default is 'closed' due to spring tension; 'not watering' is default if no pump is active. This is no more mysterious than modeling a ball at rest: its 'default' is the equilibrium state absent forces."  
     **Soft Spot:** Concede defaults are *scale-dependent abstractions*. Your defense: so are all causal variables in interventionism.  

  3. **Legal Theorist** (Likely: ★★★★☆ | Damage: ★★★★☆)  
     *Phrasing:* "The law treats omissions as causal *only* when there's a duty (e.g., a lifeguard vs. a passerby not saving a drowning child). Your account puts the lifeguard's omission and a random stranger's non-action on the same causal footing. That can't explain legal practice."  
     **Reply:** "It *can*—and *should*! The law cares about *culpability*, not causation. Both omissions cause death (but-for: if either acted, death is avoided). But the lifeguard's role *makes her omission salient* in model-construction. We *include* her in the model because her duty cues us to the 'liveness' of her agency-mechanism. The stranger isn't omitted from a *causal* model; she's omitted from *moral/legal* models."  
     **Soft Spot:** You must insist causation ≠ responsibility. If they counter that law *defines* omissions normatively, reply: "That's a feature of *attribution*, not ontology."  

  4. **Experimentalist** (Likely: ★★★★☆ | Damage: ★★★☆☆)  
     *Phrasing:* "You say norms are just 'model-construction cues,' but our data shows norms *directly* shift causal judgments. Your view is unfalsifiable: if norms predict inclusion, it's 'model construction'; if not, it's 'inapt model.' How is this science?"  
     **Reply:** "It *is* falsifiable: show me norm-driven causal judgments *that persist* when the mechanism is physically decoupled. E.g., if subjects blame a *disconnected* security guard for a theft because he 'should've watched,' that refutes me. But your data shows norms *correlate* with judgments—because norms highlight *which dependencies are worth modeling*. My prediction: norms won't override physical impossibility (e.g., blaming someone who *couldn't* intervene)."  
     **Soft Spot:** If no such experiments exist, you're trading in promissory notes.  

  5. **Lewisian** (Likely: ★★★☆☆ | Damage: ★★☆☆☆)  
     *Phrasing:* "Why reframe omissions as causes? But-for dependence handles everything without metaphysical inflation. The gardener's not-watering causes death iff watering would have prevented it. No defaults needed."  
     **Reply:** "Your 'watering would have prevented it' hides a variable—*what counts as watering?* But-for requires specifying possible worlds, and *which* changes are relevant. Defaults solve this: the variable 'watering' has a natural baseline (OFF). 'Not-watering' being causal is just 'OFF caused death'—no special relatum. Your account is silent on why we fix *water* and not *Queen's tea* as the relevant variable. Liveness answers that."  
     **Soft Spot:** They may retreat to "quasi-causation." Concede the label—insist the *structure* is identical.  

  ---

  ### **The Dreaded Question You Hope Nobody Asks**  
  **Interventionist #2 / Philosopher of Physics tag-team:**  
  *"You say liveness depends on whether a mechanism 'could in principle deliver a non-default value.' But 'could' is modal—what grounds this possibility? If it's physical laws, how do you avoid pre-selecting *which* laws or initial conditions matter? And isn't 'principle' smuggling in norms about what counts as a 'reasonable' intervention?"*  

  **Why it’s deadly:** It exposes that **liveness relies on a prior notion of "relevant possibility"**—which might covertly depend on *expectations* (e.g., we don't consider quantum fluctuations "possible interventions" for watering plants). If "could" is normative, your "explanatory priority" claim collapses.  

  **Damage Control Reply (if asked):**  
  "Physical possibility is grounded in *actual mechanisms*: a variable is live if there’s a *physical pathway* from it to the outcome (e.g., pipes connect faucet to plant). 'Could' means *there exists an intervention compatible with laws and fixed constraints*. Norms don’t ground this—they help us *notice* it."  
  **Soft Spot:** This leans hard on "actual mechanisms," which may require circular appeal to causation.  

  ---

  ### **Bonus: Where Liveness is Overworked**  
  You’re using liveness to solve **two problems at once**:  
  1. **Relevance** (Why include gardener but not Queen?)  
  2. **Asymmetry** (Why is "not-watering" the cause, not "not-moon-landing"?)  
  But liveness alone doesn’t fix asymmetry! Default values do that heavy lifting: asymmetry arises because *only deviations from default are "events"* (e.g., watering=ON is a change; not-watering=OFF is default). Liveness just filters *which defaults matter*. If pressed, clarify this division of labor—or risk conflating them.  

  ---  
  **Final Triage:** Focus on landing the **interventionist reply** and **legal distinction**. Sacrifice physics detail if needed ("I'll email you papers on coarse-graining"). Preempt the experimentalist by citing model-construction studies (e.g., Lombrozo’s work on normality). Good luck—your framework is lean and nasty in the best way.
