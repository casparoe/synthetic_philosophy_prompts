  ## Taxonomy of Suffering-Focused Ethics (T-View)

  **Core T-View**:  
  There exists a level of suffering that no amount of pleasure can outweigh, compensate, or cancel.  

  ### Branch 1: Scope  
  *When does the threshold apply?*  
  - **A. Only within individual lives**  
  - **B. Only across persons**  
  - **C. Both within lives and across persons**  

  ### Branch 2: Threshold Level  
  *Which suffering is above threshold?*  
  - **A. Very low** (e.g., two-second pinprick)  
  - **B. Moderate** (e.g., worst human agony)  
  - **C. High** (e.g., being's mildest itch [1000× human agony])  
  - **D. Extremely high** (none of these; unnamed)  

  ### Branch 3: Nature of Suffering  
  *What makes suffering threshold-breaking?*  
  - **A. Sensation** (pain as felt experience)  
  - **B. Aversiveness** (suffering as disliked/avoided)  

  ### Branch 4: Risk vs. Certainty  
  *Case: 1-in-billion chance of vast suffering vs. certainty of modest pleasure*  
  - **A. Risk worse** (threshold constrains risk-taking)  
  - **B. Certainty better** (expected value applies)  

  ### Branch 5: Aggregation  
  *Case: Billion 5-second itches vs. one minute of joy*  
  - **A. Aggregates** (below-threshold sufferings sum to outweigh pleasure)  
  - **B. Doesn’t aggregate** (pleasure outweighs each itch individually)  

  ### Branch 6: Sacrifice  
  *Case: Choosing agony to spare others mild tedium*  
  - **A. Permissible** (voluntary self-sacrifice allowed)  
  - **B. Forbidden** (threshold absolute, even if chosen)  

  ### Branch 7: Memory  
  *Case: Hour of agony (erased) vs. hour of tedium (remembered)*  
  - **A. Erased agony still above threshold**  
  - **B. Erased agony not above threshold**  

  ### Branch 8: Population Ethics  
  *Case: Creating barely net-positive life vs. preventing severe pain*  
  - **A. Threshold applies to potential lives**  
  - **B. Threshold applies only to existing beings**  

  ---

  ### Leaves (Named Positions)  
  1. **Negative Utilitarianism**  
