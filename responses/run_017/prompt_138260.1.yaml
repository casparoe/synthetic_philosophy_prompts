answer: |-
  ### Final Examination Question: Consequentialism & the Problem of Cluelessness  
  **Answer ONE question. Time allowed: 2 hours.**  

  **3. Cluelessness and Deep Uncertainty**  
  Consequentialism requires us to maximize expected value (EV), but the "problem of cluelessness" claims that for many high-stakes acts, we cannot estimate long-run net value. Objectors argue:  
  > *Long-run effects dominate near-term effects, yet our evidence about their sign (positive/negative) is symmetric (no net tendency toward good/bad). Thus, EV calculation either fails (no guidance) or collapses into an unjustified near-term proxy.*  

  Defenders reply:  
  > *Cluelessness is ordinary decision-making under uninformative evidence. Symmetric noise doesn’t refute EV maximization; we must simply use available evidence.*  

  **Your task:** Critically evaluate this dialectic using two devices:  
  > **(A) Articulation asymmetry**: Our models of causal mechanisms are biased toward near-term, measurable, or easily narrated effects. Thus, our estimates of long-run value may suffer *directional* bias (not just high variance), because we systematically overlook hard-to-articulate mechanisms (e.g., chaotic institutional feedback, cultural drift).  
  >  
  > **(B) Self-endorsement test**: A decision rule *R* (e.g., "maximize EV with current evidence") must, when applied to the choice *of decision rules itself*, recommend its own adoption. If *R* advises abandoning *R* for another rule, it fails.  

  **Case**: You command $10M for one of:  
  - **Option A**: Distribute malaria bednets. *Near-certain to save 1,000 lives* (well-measured near-term good).  
  - **Option B**: Reform electoral rules in a fragile democracy. *Potential to prevent collapse or trigger civil war*. Long-run effects are 100× larger than A’s, but your evidence suggests symmetric odds of net good vs. harm.  
  - **Option C**: Fund research to model Option B’s long-run effects, reducing cluelessness (e.g., better institutional forecasting). Success probability: 50%; cost: $10M.  

  **Question**: What should a clueless consequentialist choose? Justify your answer using **(A)** and **(B)**. Is cluelessness a fatal flaw for consequentialism?  

  ---

  ### Model Answer (798 words)  

  The cluelessness objection threatens consequentialism by arguing that symmetric uncertainty about vast long-run effects paralyzes EV maximization. Defenders insist we should still maximize EV given current evidence. I argue that **articulation asymmetry (AA)** reveals why standard EV reasoning fails in this case, while the **self-endorsement test (SET)** shows EV maximization survives as a meta-rule—but only by licensing non-EV proxies in practice. I recommend **Option C** (research), as it uniquely addresses AA-induced bias while passing SET.  

  **1. The core problem: Why "symmetric noise" misleads**  
  The objector claims long-run EV estimates for Option B are "symmetric": expected net value ≈ 0. But this assumes our uncertainty is *well-structured* (e.g., like a fair coin flip). AA challenges this. We articulate effects we can model (e.g., voter turnout shifts) but overlook hard-to-narrate mechanisms (e.g., how electoral rules alter cultural trust over centuries). Since measurable mechanisms are not a random sample of *all* causal pathways, our symmetric estimate may mask directional bias. Suppose omitted mechanisms tend toward harm (e.g., complex systems drift toward oligarchy). Then Option B’s *true* EV is negative, but our model reports ≈0 due to AA. Thus, we risk catastrophic harm by acting on spuriously symmetric estimates. Option A avoids this by relying on near-term effects largely immune to AA.  

  **2. Why standard EV maximization fails under AA**  
  The defender replies we should still maximize EV: Option B’s EV ≈ 0, Option A’s is +1,000 lives, so choose A. But if AA induces *unrecognized directional bias*, this EV calculation is unreliable. Crucially, AA does not imply bias is knowable; we cannot say "bias is likely negative, so avoid B." Rather, AA defeats the defender’s key assumption: **symmetric evidence justifies treating estimated EV as unbiased**. When evidence is symmetrically *uninformative* (true value equally likely positive/negative), EV maximization works. But when evidence is symmetrically *misleading* (true value likely negative, but estimates scatter symmetrically around zero), EV maximization is disastrous. AA suggests cluelessness often involves the latter: our models’ symmetry reflects ignorance of bias, not true randomness. Choosing Option B because its EV ≈ 0 is reckless if true EV is likely -100,000 lives.  

  **3. The self-endorsement test and meta-decision-making**  
  SET asks: Does EV maximization recommend itself when choosing decision rules? Suppose we apply EV reasoning to selecting a rule for the $10M choice:  
  - Rule 1: *Always choose Option A* (near-term proxy).  
  - Rule 2: *Maximize EV per current evidence* (chooses A, as B’s EV ≈ 0).  
  - Rule 3: *Choose Option C* (reduce cluelessness first).  
  If Rule 2 (EV maximization) evaluates itself, it must weigh the EV of adopting Rule 2 vs. alternatives. But if AA makes long-run EV estimates untrustworthy, Rule 2 cannot reliably estimate the value of *any* rule involving long-run effects—including itself. Worse, if true EV for Option B is negative, Rule 2 (which might select B in other cases) has negative expected value! Rule 2 *fails SET* if it calculates that switching to Rule 1 or 3 has higher EV.  

  Yet EV maximization passes SET if framed as a meta-rule: "Use EV to choose actions *when reliable evidence exists*; else use fallbacks." This meta-rule *endorses* Option C (research) to convert clueless cases into EV-tractable ones. It also rejects Option B under AA, as evidence is unreliable. Thus, EV maximization survives only by retreating to a hybrid form: maximize EV *where possible*, but invest in information or default to cautious proxies otherwise.  

  **4. Recommendation and implications**  
  I recommend **Option C** (research). Option A ignores the uncertainty asymmetry: AA means B’s effects *might* be profoundly negative, making A’s near-term gains pyrrhic. Option B risks catastrophe due to unmeasured bias. Option C mitigates AA by improving evidence, enabling better EV calculation later. Crucially, C is defensible under the EV meta-rule: spending to reduce cluelessness maximizes long-run EV *if* we suspect current estimates are misleading.  

  Cluelessness is not fatal to consequentialism but exposes a pragmatist core: when evidence is structurally corrupted (per AA), EV maximization *must* abandon first-order EV calculations to preserve its coherence at the meta-level. Non-consequentialist rules (e.g., deontological constraints) avoid cluelessness by ignoring consequences but at the cost of ignoring real catastrophic risks. Their "immunity" is thus a vice, not a virtue.  

  **Conclusion**: The defender is wrong that cluelessness is ordinary uncertainty. AA makes it *worse*: not high-variance noise, but unmeasured bias that invalidates EV estimates. Consequently, the consequentialist must sometimes invest in reducing ignorance (Option C) or default to low-risk acts (Option A)—not because these maximize EV directly, but because they maximize the reliability of future EV reasoning. SET confirms this: only a meta-EV rule endorsing such adaptations is self-recommending.  

  ---  

  ### Marking Scheme (20 marks total)  
  **Award 0–4 marks per criterion. Focus on precision, not position taken.**  

  1. **Formal reconstruction of cluelessness**  
     - [✔] Correctly frames problem: long-run effects dominate, evidence symmetric on *sign*, no reliable net EV estimate.  
     - [✘] *Common error: Asserts cluelessness = "high uncertainty," missing sign-symmetry specifically.*  

  2. **Distinguish dominance-by-variance vs. sign-indefiniteness**  
     - [✔] Notes Option B’s effects could be +100,000 or -100,000 lives (sign-indefinite), not just ±1,000 (high variance).  
     - [✘] *Common error: Treats large variance as equivalent to cluelessness.*  

  3. **Expected-value defense: Assumptions and defeaters**  
     - [✔] States defender assumes symmetric evidence → unbiased EV estimate; notes AA as potential defeater (bias makes evidence misleading, not uninformative).  
     - [✘] *Common error: Claims AA "proves" Option B is harmful, rather than showing EV estimates are unreliable.*  

  4. **Articulation asymmetry without overclaiming**  
     - [✔] Explains AA implies *possible* directional bias, but cannot quantify it; argues this breaks defender’s assumption of unbiased estimates.  
     - [✘] *Common error: Assumes AA proves long-run effects are net negative, justifying dominance reasoning.*  

  5. **Self-endorsement test & normative upshot**  
     - [✔] Applies SET to rule-selection: Does EV maximization advise its own abandonment under AA? Concludes meta-EV may endorse non-EV proxies (e.g., research).  
     - [✔] Judges if cluelessness uniquely harms consequentialism (yes, but fixable) and if non-consequentialist "immunity" is virtuous (no—avoids cluelessness by ignoring consequences).  
     - [✘] *Common error: Claims EV always fails SET or that SET is irrelevant to normative status.*  

  ### A vs. B Answer Differentiation  
  - **A (17–20)**: Distinguishes *uninformative* vs. *misleading* evidence (Criterion 3); shows meta-EV endorses Option C to *restore* EV applicability (Criterion 5); avoids overclaiming AA’s implications (Criterion 4).  
  - **B (13–16)**: Correctly uses AA/SET but conflates *unreliability* with *known harm* (e.g., "AA means B is bad, so choose A"); misapplies SET to actions (not rules); claims cluelessness refutes all consequentialism.  

  **Note**: Strong answers recognize that AA makes EV estimates *untrustworthy*, not necessarily negative. Thus, Option C’s value lies in transforming cluelessness into tractable uncertainty, even if research fails.
