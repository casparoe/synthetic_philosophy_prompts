prompt: |-
  I am a retired evolutionary biologist who has come to philosophy rather late, and I have been invited to open a forty-minute session of our university's artificial-intelligence ethics reading group — mostly computer-science doctoral students, with one or two philosophers present — on the question of which computations, if any, matter morally. I want a plan for how to explain this, not the explanation itself.

  My own instinct is that the session has to begin by pulling apart two questions the students will otherwise run together: whether a system's moral standing depends on the computation it implements, and which computation it implements in the first place, given that under a sufficiently ingenious mapping almost any physical system can be said to implement almost anything. After that I want them to feel the duplication case — a simulation snapshotted, paused, restored twice on different hardware, the two copies run in parallel and then re-merged by averaging their states — because that is where I think the distinction between an abstract computation and a concrete causal process stops being academic. But I am not certain this is the best case to build the session around, or that it does not quietly presuppose the answer.

  Please reply as exactly five numbered items, one or two sentences each, with no introduction and no conclusion, in British English:

  1. The order in which I should introduce the pieces — the mapping worry, the duplication-and-merge case, and the question of whether sentience admits of degrees — and what each depends on having been said before it.
  2. The one example that should carry the whole session, with what it must have and what it must lack; if my merge case is not the right vehicle, say what to use instead and why.
  3. The misconceptions this audience will form, in the order they will form them, and the point in the sequence at which I should head each one off. I expect at least these two: that computation is a quantity that can be summed, so that two copies carry twice the moral weight; and that because the boundaries we can draw around a system are arbitrary, there is no fact of the matter about what it is like.
  4. One question to put to them at the end that would show they have the distinction rather than the slogan that it all depends on the computation.
  5. What I should decline to explain at this level, and how to say so in a sentence; I had assumed the hard problem of consciousness was the obvious candidate, but tell me if something else is the real trap.
reasoning: |-
  Hmm, the user is a retired evolutionary biologist who's been invited to lead a 40-minute session on AI ethics about which computations matter morally. They want a plan to help computer science doctoral students and philosophers understand this topic without conflating key issues.

  The user has identified two main questions they want to separate: whether moral standing depends on the computation implemented, and how we determine which computation is actually being implemented given that physical systems can be interpreted as implementing almost anything through clever mappings.

  They're considering using a duplication-and-merge case (where a simulation is paused, restored twice, run in parallel, then merged) to highlight the difference between abstract computation and concrete causal processes. But they're unsure if this is the best approach and whether it might presuppose answers.

  I need to provide exactly five numbered items as requested, in British English, with no introduction or conclusion. Each item should be one or two sentences.

  For item 1: I'll suggest starting with the mapping worry first, as it's foundational. Then introduce duplication-and-merge to make the mapping worry concrete and problematic. Finally bring up degrees of sentience to complicate the moral questions.

  For item 2: I'll recommend sticking with the duplication-and-merge case as the core example. It must show computational identity preservation but causal disruption, and avoid requiring consciousness assumptions. It's better than alternatives like Chinese Room because it directly addresses implementation multiplicity.

  For item 3: I'll identify two key misconceptions: first, that computation is summable (two copies = double moral weight), which should be addressed after presenting duplication. Second, that arbitrary boundaries mean no facts about phenomenology, which should be countered when discussing mapping worry by emphasizing implementation constraints.

  For item 4: I'll suggest asking whether the average-merged entity has the same moral standing as the original, forcing them to consider causal history versus computational state.

  For item 5: I'll advise avoiding the hard problem of consciousness entirely, as it's a trap that sidetracks the discussion. Instead, focus on functional equivalence.

  This approach respects the user's expertise while providing clear structure for their session.
answer: |-
  1. Start with the mapping worry to establish that the same physical system can be interpreted as implementing vastly different computations; this is foundational. Then present the duplication-and-merge case to concretely illustrate why computational identity alone is insufficient for moral questions, as it creates causal discontinuities. Finally, introduce whether sentience admits of degrees only after establishing that computational equivalence doesn't resolve moral status, to probe how complexity or implementation might matter.
  2. Your duplication-and-merge case is the right vehicle: it must demonstrate identical computations running on distinct hardware with divergent causal histories, yet must lack any straightforward resolution for moral status post-merge. Avoid examples requiring assumptions about consciousness (like the Chinese Room), as they prematurely invoke the hard problem.
  3. First misconception: post-duplication, they may think moral weight sums linearly (two copies = double weight); head this off immediately after presenting duplication by asking if pausing/restarting alters moral standing. Second misconception: after mapping worry, they may infer phenomenology is wholly arbitrary; counter this when discussing mapping by stressing that not all interpretations are equally plausible given physical constraints and causal structure.
  4. Ask: "If the merged entity's state is an average of the two diverged copies, does it retain the original's moral standing, and does it matter if the averaging erases unique experiences each copy developed?"
  5. Decline to address the hard problem of consciousness explicitly; say, "We'll bracket the question of why or how certain computations generate subjective experience, as that requires deeper metaphysical enquiry than this session permits."
