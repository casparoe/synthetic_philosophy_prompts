  Hmm... workplace examples might work best here since they're mundane. Let me brainstorm scenarios. A committee member might accept that rearranging meeting times is unfair without grasping why, even after being told the key reasons. But why would this feel defective if all boxes are checked? 

  Ah! The missing element might be recognitional capacity - the ability to spot moral salience independently. Like seeing why "shifting burdens unfairly" matters as a moral pattern, not just reciting it. In my committee case, the person can parrot reasons but can't identify new instances of unfair burden-shifting without being told. 

  *scribbles mentally* For the unproblematic variant, same person but they arrive at the verdict themselves after observing the pattern. Tiny difference - one cognitive step shifted - but it changes everything epistemically. 

  Now the tricky part: is this epistemic or something else? The user's last question is profound. On one hand, it feels epistemic - they lack a justification component. On the other, it might be about moral agency - outsourcing judgment when we shouldn't. The "what should they do instead" test shows the split: epistemically they could seek more testimony, but as moral agents they should engage directly. 

