  Final polish: Emphasize that in the defective case, they treat morality like trivia ("What's the capital of France?") rather than a perception-like skill. That's the residue - moral understanding as a capacity, not just information. 

  *double-checks* Did I miss any conditions? User wanted low-stakes, no laziness, schema provided... yes. And the two readings clearly diverge on whether seeking more testimony solves it (epistemic) or whether first-personal engagement is needed (moral agency). Nailed it.
answer: |-
  Here’s a case meeting your conditions, isolating the "residue" pessimists care about, followed by an unproblematic variant and an analysis of the defect:

  ### **Defective Case: The Shared Kitchen Rule**
  **Setting:** A shared flat.  
  **Scenario:** Flatmate A tells Flatmate B: *"Leaving your used tea bags in the communal sink is inconsiderate. It forces others to clear your mess before using the sink, unfairly shifting your burden onto them."*  
  - **Descriptive facts known:** B knows tea bags are left in the sink, others must remove them to use the sink, and this requires effort.  
  - **Moral verdict + schema:** A supplies the verdict ("inconsiderate") and the schema ("unfairly shifting burdens onto others").  
  - **Hearer’s state:** B is attentive, has no bad motives, and accepts A’s judgment.  
  - **Post-testimony behavior:**  
    - **Understanding:** B accurately paraphrases the reasoning: "It’s wrong because it forces others to deal with my mess."  
    - **Extensibility:** B generalizes correctly: Applies this to coffee grounds (same schema) *and* to a new case (leaving dishes unrinsed—differing descriptively but matching "shifting burdens").  
    - **Motivational force:** B stops leaving tea bags in the sink and reminds others not to.  
    - **Robustness:** B maintains the belief even if A retracts or another flatmate disagrees.  

  **Yet, the belief feels defective.** Why? B cannot *recognize* novel instances of "burden-shifting" *without being cued to the schema*. For example:  
  - When Flatmate C stacks heavy boxes in a hallway, blocking access, B doesn’t see this as wrong until A points out it "forces others to move them, shifting your burden." B then agrees instantly and extends the verdict.  
  - B’s moral perception is passive: They apply the schema flawlessly *when prompted* but lack **recognitional capacity**—the ability to spontaneously *detect* morally salient features in new contexts.  

  ---

  ### **Unproblematic Variant: One Difference**  
  **Same scenario**, but instead of testimony, B notices the tea bags in the sink, reflects, and thinks: *"This makes others clean up after me—that’s shifting my burden unfairly."* They arrive at the verdict independently, using the same schema.  
  - **Difference:** B forms the belief *first-personally* through recognition of the moral pattern.  
  - **Result:** B now spots burden-shifting autonomously (e.g., immediately identifies the box-blocking as wrong). The belief is "theirs" in a way the testimonial belief isn’t.  

  ---

  ### **Analysis: The Residue and Its Nature**  
  **The residue** is the hearer’s inability to *generate moral attention*—to actively discern morally relevant features in novel situations without external prompting. This isolates a fifth defect: **lack of moral perception**.  

  #### **Epistemic or Non-Epistemic Defect?**  
  - **Epistemic reading (e.g., justification/knowledge):**  
    B’s belief is justified (reliable testimony + robust integration). They might even "know" the verdict. The defect is *non-epistemic*: It concerns *how* B deploys moral concepts (passively vs. actively), not whether the belief is warranted.  
    - *What B should do instead:* Seek more testimony for new cases. This *preserves* justification but entrenches passivity.  
  - **Non-epistemic reading (moral agency norm):**  
    Morality requires *first-personal engagement* with reasons to cultivate responsiveness to moral demands. Testimony bypasses this agential duty.  
    - *What B should do instead:* Reflect on the schema to develop autonomous perception (e.g., "What else counts as shifting burdens?"). This addresses agency, not justification.  

  **Key divergence:** The epistemic reading permits resolving the defect with *more testimony* (e.g., A coaching B on new cases). The agency reading demands *self-guided practice* in moral pattern-recognition. The pessimist’s intuition aligns with the latter—it’s about **moral skill**, not just belief-state.  

  #### **Why This Meets Your Conditions**  
  - **Low-stakes/ordinary:** Mundane shared living conflict.  
  - **No missing facts:** B knows all descriptive elements; A only provides moral schema.  
  - **No bad motives:** B isn’t lazy—they extend/applying the belief diligently.  
  - **Robust belief:** Survives retraction, guides action, extends accurately.  
  - **Defect persists:** B’s passivity in moral perception isn’t captured by the four standard diagnoses.  

  This residue—**moral recognitional capacity**—highlights the pessimist’s deeper concern: Moral understanding requires not just *having* reasons, but *exercising* the capacity to notice what counts as a reason.
