answer: |-
  Your tentative principle, the Underdetermination Test, captures a key insight: intervals arise from evidential underdetermination with no basis for privileging one sharpening over others. However, it needs refinement to handle all your cases, especially peer disagreement and decision-making. Below, I repair the principle, state it precisely, test it against your cases, and address your questions. The core idea remains, but I add structure to the "admissible sharpening" concept and clarify how intervals are derived and used.

  ### Repaired Underdetermination Principle
  1. **Credal State Definition**: Your credence in hypothesis \(H\) is represented by a set \(\mathcal{S}\) of probability values (the "admissible sharpenings") determined by your total evidence.  
  2. **Interval Formation**: The published interval for \(H\) is \([l, u]\), where:  
     - \(l = \inf \mathcal{S}\)  
     - \(u = \sup \mathcal{S}\)  
     This interval is published **if and only if** \(\mathcal{S}\) is non-singleton and your evidence:  
     - **Underdetermines** \(H\): It admits multiple values in \(\mathcal{S}\).  
     - **Lacks Preferential Grounds**: Provides no basis to exclude any value in \(\mathcal{S}\) or assign weights to them.  
     Otherwise, credence is sharp (degenerate interval).  
  3. **Decision Rule (Non-Doxastic Addendum)**: For choices depending on \(H\):  
     - **Low Stakes/Reversible**: Any decision (e.g., random choice) is permissible.  
     - **High Stakes/Irreversible**: You must either:  
       - Gather more evidence to narrow \(\mathcal{S}\), or  
       - Choose the option that is robustly best (or least bad) across all of \(\mathcal{S}\).  

  ### Explanation of Key Concepts
  - **Admissible Sharpenings (\(\mathcal{S}\))**: Values for \(P(H)\) consistent with your evidence. \(\mathcal{S}\) is objective (evidence-determined), not subjective.  
  - **No Preferential Grounds**: Evidence doesn't justify excluding values from \(\mathcal{S}\) or weighting them (e.g., no frequencies, symmetries, or expertise to break ties).  
  - **Interval \([l, u]\)**: Represents the *range of uncertainty* in your credence. It is not a probability distribution—it’s the envelope of possibilities.  
  - **Decision Rule**: Distinguishes doxastic states (which are stake-invariant) from pragmatic choices. High stakes force conservatism or evidence-seeking.  

  ### Test Against Your Cases
  1. **Ellsberg Urn**  
     - \(H_{\text{red}}\): \(\mathcal{S} = \{1/3\}\) (evidence pins one value). → Sharp: \(1/3\).  
     - \(H_{\text{blue}}\): \(\mathcal{S} = [0, 2/3]\) (any proportion of blue possible; no grounds to exclude/prefer values). → Interval: \([0, 2/3]\).  
     - **Verdict**: Correct. Principle holds.  

  2. **Coin with Known Bias Distribution**  
     - Uniform bias: \(\mathcal{S}\) is the singleton set containing the expected value (\(1/2\)). → Sharp: \(1/2\).  
     - **Verdict**: Correct. Chance structure pins a unique sharpening.  

  3. **Coin from Unknown Provenance**  
     - \(\mathcal{S} = [0, 1]\) (no evidence to exclude any bias). → Interval: \([0, 1]\). Refusing even-odds bet is rational (no value in \(\mathcal{S}\) favors betting).  
     - **Verdict**: Correct.  

  4. **Three Modellers (0.20, 0.45, 0.70)**  
     - Evidence: Peer reports, no adjudication possible. \(\mathcal{S} = \{0.20, 0.45, 0.70\}\) (values from reports; no grounds to exclude/prefer).  
     - Interval: \([l, u] = [0.20, 0.70]\). Not a weighted mean (would require preferential grounds).  
     - **Verdict**: Correct. Principle holds with \(\mathcal{S}\) defined as reported values.  

  5. **0.70 Modeller Withdraws**  
     - \(\mathcal{S} = \{0.20, 0.45\}\) (withdrawn report is excluded). → Interval: \([0.20, 0.45]\).  
     - **Verdict**: Correct. Evidence changed (report retracted), narrowing \(\mathcal{S}\).  

  6. **Fourth Modeller Reports [0.30, 0.34]**  
     - \(\mathcal{S} = \{0.20, 0.45, 0.70\} \cup [0.30, 0.34]\) (union of all reports).  
     - \(l = \min(0.20, 0.30) = 0.20\), \(u = \max(0.70, 0.34) = 0.70\). → Interval: \([0.20, 0.70]\).  
     - **Verdict**: Correct. Interval unchanged because \([0.30, 0.34] \subset [0.20, 0.70]\). The principle explains why adding an interior report doesn’t narrow \(\mathcal{S}\).  

  7. **Gauge Case (90% Calibrated)**  
     - **Before envelope**:  
       - If calibrated (90%), gauge reading \(r\) gives sharp \(P(\text{frost}) = r\).  
       - If uncalibrated (10%), \(P(\text{frost})\) can be any value in \([0, 1]\).  
       - \(\mathcal{S} = \{r\} \cup [0, 1] = [0, 1]\) → Interval: \([0, 1]\).  
     - **After learning "uncalibrated"**: \(\mathcal{S} = [0, 1]\).  
     - **After learning "calibrated"**: \(\mathcal{S} = \{r\}\) (sharp).  
     - **Dilation**: Learning "uncalibrated" *can* widen the interval (e.g., if prior interval was tighter). Paying to avoid evidence is practically rational (due to risk of widening) but epistemically irrational (evidence never harms accuracy).  
     - **Verdict**: Correct. Principle handles dilation via \(\mathcal{S}\).  

  8. **Stakes**  
     - **Doxastic state**: Identical in both cases (\(\mathcal{S} = [0.30, 0.60]\)).  
     - **Decision**:  
       - Low stakes: Any choice permitted (decision rule satisfied).  
       - High stakes: Must gather evidence or pick option safe across \([0.30, 0.60]\) (e.g., if Option B is safe when \(P(H) < 0.45\), but since \(P(H)\) could be \(>0.45\), you’d need evidence to break \([0.30, 0.60]\)). Flipping a coin is irrational.  
     - **Verdict**: Correct. Addendum separates doxastic and pragmatic rationality.  

  9. **Laundering**  
     - Publishing midpoint (e.g., \([0.30, 0.60] \to 0.45\)) is administratively fine, not epistemically dishonest.  
     - Using it as a sharp credence later is illegitimate: \(\mathcal{S}\) remains \([0.30, 0.60]\), so midpoint has no privileged status.  
     - **After scoring**: Outcomes provide new evidence, shrinking \(\mathcal{S}\) to a singleton (e.g., frequentist convergence). Intervals vanish due to evidence, not laundering—genuine improvement.  
     - **Verdict**: Correct. Principle explains laundering vs. learning.  

  ### Verdicts on Unlisted Cases
  - **Ten Modellers in [0.30, 0.35], Original Three at 0.20, 0.45, 0.70**:  
    - \(\mathcal{S} = \{0.20, 0.45, 0.70\} \cup [0.30, 0.35] = [0.20, 0.70]\).  
    - Interval remains \([0.20, 0.70]\). **No narrowing**, even with many modellers clustered, because \(\mathcal{S}\) includes 0.20 and 0.70.  
    - *Why?* Evidence doesn’t exclude outliers; you lack grounds to dismiss the original modellers. If one retracted (like Case 5), \(\mathcal{S}\) would change.  

  - **Gauge Case with 50/50 Calibration**:  
    - **Before envelope**: \(\mathcal{S} = \{r\} \cup [0, 1] = [0, 1]\). → Interval: \([0, 1]\).  
    - **After "uncalibrated"**: \([0, 1]\).  
    - **After "calibrated"**: \(\{r\}\) (sharp).  
    - Dilation effect weaker (interval widens from \([0,1]\) to \([0,1]\)), but paying to avoid evidence might still occur if prior interval was narrower.  

  - **Scoring Regime Switched Off**:  
    - Intervals **do not return**. Scoring provided evidence that sharpened \(\mathcal{S}\) to a singleton. Unless you *lose* that evidence (e.g., forget outcomes), \(\mathcal{S}\) stays sharp.  

  ### Weaknesses and What Would Change My Mind
  - **Where the Principle Is Most Likely Wrong**:  
    - **Expert Aggregation (Cases 4, 6, and 10+ modellers)**: Treating \(\mathcal{S}\) as the union of reports ignores cluster patterns. If 100 modellers converge on [0.30, 0.35], shouldn’t \(\mathcal{S}\) narrow? The principle says no—but this clashes with intuition that outliers lose credibility en masse.  
    - **Decision Rule**: The high-stakes addendum is practical, not derived from the doxastic principle. Some argue intervals should directly guide decisions (e.g., via lower/upper probabilities).  
    - **Dilation (Case 7)**: The principle avoids commitment to whether \([0,1]\) is the same "width" as a point. Some theories (e.g., Levi’s epistemology) say dilation increases uncertainty, but the principle treats intervals as static envelopes.  

  - **What Would Change My Mind**:  
    - **Argument**: If you show that \(\mathcal{S}\) must incorporate *weights* (e.g., from frequencies or expertise), the principle collapses. For example, if Case 4’s modellers imply a distribution over sharpenings, \(\mathcal{S}\) might be a weighted set, and you’d publish a sharp mean. Your verdict rejects this, but new arguments could force it.  
    - **Case**: A scenario where:  
      - Evidence admits multiple sharpenings *with* preferential grounds (e.g., asymmetrical but unquantifiable reasons to favor some values).  
      - Your verdict demands an interval, but the principle might force sharpness or a non-convex \(\mathcal{S}\).  
      - *Example*: "Two urns: Urn A has 10 red/10 blue; Urn B has 15 red/5 blue. I know it’s A or B but have no basis to favor either. \(P(\text{red}) = ?\)" \(\mathcal{S} = \{0.5, 0.75\}\), interval \([0.5, 0.75]\). But if you insist intervals must include intermediates (e.g., 0.6), the principle breaks. Your cases don’t require this, but if one did, I’d need to revise \(\mathcal{S}\) to convex hulls.  

  ### Final Tally
  - **Accommodated Verdicts**: All (1–9) are upheld.  
  - **Verdicts Overturned**: None.  
  - **Cost of the Principle**:  
    - It requires explicitly defining \(\mathcal{S}\) (evidence-dependent) and resisting intuition to "shrink" intervals with clustered experts.  
    - It adds a pragmatic decision rule, but this is necessary and separate.  

  The repaired principle is minimal (one core idea + a decision addendum), handles your cases, and clarifies interval use. If new cases stress \(\mathcal{S}\) (e.g., weighted evidence), I might extend it, but for now, it stands.
