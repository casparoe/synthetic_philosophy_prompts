  Summary of the repaired Underdetermination Test:

    - The credence in H is represented by an interval [l, u] if and only if the evidence admits a set S of admissible sharpenings (i.e., probability values) for H, with |S|>1, and there is no reason to prefer any one in S over the others; otherwise it is sharp (a degenerate interval).

