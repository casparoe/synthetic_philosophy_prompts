answer: |-
  ## Research Proposal: The Individuation Problem in Expected-Value Fanaticism

  **Research Question:** How does the normative assessment of astronomical-stakes gambles—specifically, whether expected-value (EV) fanaticism is compelling—depend on the *temporal individuation* of decisions (single acts, packages of independent acts, or policies), and does avoiding fanaticism at one level necessitate its acceptance, or a related instability, at another?

  This question reframes the fanaticism debate. It is not primarily about whether fanaticism is true or false in a single instance. Instead, it asks whether standard strategies for *resisting* fanaticism in isolated choices (bounded utility, risk-aversion, probability discounting) inevitably lead to conclusions that are either diachronically unstable when decisions are aggregated over time, or that reintroduce a structurally similar fanaticism problem at the level of choosing *policies* (rules for action). The project seeks a determinate answer regarding the *transmission* of the fanaticism challenge across levels of description under different individuation schemes.

  **Why Standard Positions Leave This Open:** The controversy has centred on the justification for deviating from straightforward EV maximisation in *single*, isolated choices involving tiny probabilities of vast payoffs. Bounded utility theorists argue the value function cannot increase without limit, making the astronomical payoff finite and thus its low-probability offer lose to modest certainties. Advocates of risk-avoidance (e.g., via stochastic dominance or rank-dependent models) argue that rational agents should heavily discount tiny probabilities. Payoff-discounters argue the astronomical payoff itself should be discounted due to epistemic or practical limitations. Crucially, all these approaches treat the single act as the fundamental, atomic unit of normative assessment. They evaluate the tiny-probability offer *in itself*, abstracting from its potential repetition or embedding within a sequence of similar choices. Consequently, the question of *how* to individuate decisions across time—whether a sequence constitutes one big "package" decision or many small ones, or whether the object of choice is a policy governing such sequences—simply does not arise within their frameworks. Their focus on the single case renders them agnostic, or even blind, to the potential aggregation effects and diachronic normative dynamics central to this project.

  **Methodology (Month-by-Month):**

  1.  **Months 1-2: Foundational Review & Framework Setup:** Systematically synthesise core arguments for and against EV fanaticism in the single case (Pascal's Mugging, St. Petersburg variants) and the primary resistance strategies, rigorously defining key concepts (EV fanaticism, bounded utility, risk-sensitivity, payoff discounting) without presupposing individuation. Formalise the core "gamble": an option offering probability \( p \) (arbitrarily small) of payoff \( X \) (arbitrarily large, finite) versus a certainty of \( c \) (modest positive value).
  2.  **Months 3-4: Develop Minimal Formal Model:** Construct a finite, tractable model: an agent faces a sequence of \( N \) independent, identical gambles (as defined above) over discrete time periods. Define a small set of candidate "decision procedures" representing different normative stances applied at different levels:
      *   *Act-By-Act:* Apply a chosen single-decision rule (e.g., strict EV, EV with bounded utility, minimax regret) to each gamble individually, sequentially.
      *   *Package:* Evaluate and choose the entire sequence of \( N \) gambles as a single, grand compound lottery *ex ante*.
      *   *Policy:* Choose, at the outset, a rule (e.g., "always accept such gambles", "always reject", "accept only if \( p > \delta \)") to apply to every individual gamble in the sequence.
  3.  **Months 5-6: Analyse Single-Act Frameworks:** Model the agent applying single-decision resistance strategies (bounded utility, risk-aversion, discounting) *act-by-act*. Examine the consistency and long-run consequences (e.g., expected total utility, guaranteed minimum) across the sequence of \( N \) gambles. Does adhering to the rule lead to intuitively acceptable aggregate outcomes? Does it exhibit instability (e.g., the rule dictates rejecting each offer individually, but accepting the whole package *ex ante* would have been preferable, creating a dynamic inconsistency)?
  4.  **Months 7-8: Analyse Package Approach:** Model evaluating the entire \( N \)-gamble sequence as one package using the same normative rules (bounded utility, etc.). Compare the verdict (accept/reject the package) to the aggregate outcome of applying the corresponding single-decision rule act-by-act. Does package evaluation inherently favour fanaticism more or less than act-by-act? Does it resolve the instability identified in Month 6?
  5.  **Months 9-10: Analyse Policy Approach:** Model the choice *among policies* (e.g., "Always Accept", "Always Reject", "Accept if p > 0.01") at the outset. Assess these policies using standard normative criteria (e.g., expected total utility over the sequence, minimax total regret). Crucially, does the *policy choice itself* exhibit a structure analogous to the single-decision fanaticism problem? (e.g., Does a policy of "Always Accept" have a tiny probability of yielding astronomical total utility compared to "Always Reject", forcing a fanatic choice between policies even if single acts are non-fanatic?)
  6.  **Month 11: Synthesis & Transmission Test:** Integrate results. Does avoiding fanaticism at the act-by-act level via standard resistance strategies lead to (a) diachronic instability when choices are sequential, or (b) the re-emergence of a fanaticism-like choice problem at the policy level? Does package sensitivity resolve or relocate the problem? Test the conjecture: does non-fanatic act-level choice *necessitate* package-sensitivity, and does this then lead to instability or policy-level fanaticism?
  7.  **Month 12: Writing & Dissemination:** Compile findings into the core fellowship output (paper draft), articulating the implications for the fanaticism debate and the normative significance of decision individuation.

  **Defence of Minimal Model:** The chosen formal apparatus (finite sequence, identical independent gambles, specific decision procedures) is necessary and sufficient to isolate the *individuation effect*. It provides a controlled environment to test how normative verdicts change solely based on the frame (act/package/policy), holding the underlying gambles constant. Alternatives are rejected:
  *   *Further Axiomatics:* While important, new axioms risk presupposing an individuation level (usually single acts). This project first needs to *reveal* the problem within established frameworks applied at different levels.
  *   *Empirical Study:* How people *actually* respond is distinct from the *normative* question of how they *should* respond, which is the project's focus.
  *   *Broad Literature Survey:* A survey alone cannot test the core conjecture about transmission across levels; focused modelling is required first.

  **Possible Results & Deciding Considerations:**

  1.  **Dissolution:** Individuation sensitivity reveals the original problem is ill-posed or dissolves under correct framing (e.g., policy is always fundamental, and fanaticism there is unavoidable/irrelevant). *Decider:* Does policy choice consistently avoid paradoxical instability and single-case fanaticism intuitions?
  2.  **Relocation:** Resistance strategies avoid fanaticism for single acts but create instability or force fanatic choices between policies. *Decider:* Clear emergence of a structurally analogous "Pascal's Mugging" for policy choice when evaluating policies via expected total value.
  3.  **Amplification:** The problem intensifies at higher levels (e.g., package/policy choices involve even more extreme stakes). *Decider:* Analysis shows policy-level choices exhibit *stronger* fanaticism pressures than single acts under standard resistance strategies.
  4.  **Unanticipated Complexity:** Novel normative conflicts or dependencies emerge between levels that defy simple categorisation. *Decider:* Emergence of fundamental tensions (e.g., between diachronic stability and act-level non-fanaticism) not resolvable by choosing a level.

  Key considerations include: the presence/absence of dynamic inconsistency (preference reversal) between *ex ante* package evaluation and sequential act-by-act choice; whether policy evaluation using expected total utility recreates the tiny-probability/vast-payoff structure inherent in single-case fanaticism; and the intuitive plausibility of the aggregate outcomes generated by each approach.

  **Failure Condition:** The most likely failure is the **formal model proving inadequate to robustly test the conjecture**. The dynamics might be highly sensitive to specific parameter choices (N, p, X, c, discount rates), the assumption of identical independent gambles, or the limited set of decision procedures and policies considered. This could result in ambiguous or fragile results that fail to clearly demonstrate transmission, instability, or their absence. Mitigation involves iterative model refinement during Months 3-4 and 7-8, exploring variations (non-identical gambles, different policy sets) if initial results are inconclusive. A secondary failure mode is the **conjecture proving intractable**: "package-sensitivity" might not manifest as predicted, or the "transmission" to policy level might be too vague to formalise convincingly within a year.

  **Conclusion:** This project challenges the atomic view of decisions underlying the EV fanaticism debate. By rigorously modelling how normative assessment shifts across temporal individuation levels (single acts, packages, policies), it tests whether resistance strategies merely relocate the core challenge, revealing the fundamental question to be: which level of description governs rational choice? The answer hinges on understanding the normative transmission of fanaticism.

  \answer{Decision individuation is normatively non-innocent.}
