answer: |-
  Here is a structured response addressing your requirements. The procedure prioritizes defensibility, practicality, and alignment with your operational constraints.

  ---

  ### 1. Scope and Assumptions (150 words)
  **What it answers:** The procedure estimates the annual probability that a structure, *built as proposed*, suffers flood damage exceeding a material threshold (e.g., structural compromise or costly repair).  
  **What it takes as given:**  
  - The mapped flood zone and base flood elevation (BFE) as the starting point.  
  - Historical claims data (county/state) as the primary empirical record of flood impacts.  
  - Site-specific attributes (elevation, proximity to channel, etc.) as modifiers.  
  **What it declines to answer:**  
  - Risk *after* mitigation (elevation/fill) – this is a separate question.  
  - Non-flood risks (e.g., landslide).  
  - "Fairness" or economic impact – these are judgment calls for the full board.  
  - Predictions where data is absent or demonstrably unrepresentative.  

  ---

  ### 2. The Procedure (700 words)  
  **Goal:** Estimate the annual flood damage probability for the proposed structure using defensible classes.  

  **Step 1: Define the Baseline Class**  
  - Start with all parcels in the *same mapped flood zone* (e.g., Zone AE).  
  - **One member = one parcel-year**. Each year a parcel exists in the floodplain counts as one observation. A claim in any year is a "damage event."  
  - Calculate the baseline annual rate:  
    \( \text{Baseline Rate} = \frac{\text{Total Claims in Class (over 40 years)}}{\text{Total Parcel-Years in Class}} \)  
    *(e.g., 380 parcels × 40 years = 15,200 parcel-years; 22 claims → 22/15,200 ≈ 0.00145 or 0.145% per year)*.  

  **Step 2: List Candidate Attributes**  
  - Collect attributes proposed by staff, applicant, or board.  
  - **Admit only attributes with a documented physical mechanism** (e.g., elevation relative to BFE, soil permeability, distance to main channel). Reject non-physical attributes (e.g., proximity to fire hydrant).  

  **Step 3: Test Attribute Relevance**  
  - For each attribute, require:  
    (a) **Physical plausibility**: Does hydrology suggest it affects flood risk? (e.g., elevation matters; application date does not).  
    (b) **Data availability**: ≥ 10 observations per subgroup.  
    *(Skip statistical significance tests – they fail with thin data.)*  

  **Step 4: Narrow the Class**  
  - Apply attributes **in order of physical strength**: Start with those most directly tied to flood mechanics (e.g., elevation difference from BFE > soil type > distance to channel).  
  - Stop narrowing when:  
    (a) The class has **< 200 parcel-years**, OR  
    (b) Adding the next attribute changes the rate by **< 0.1% per year**.  
  - **Output**: Annual damage rate for the narrowed class.  

  **Step 5: Handle Edge Cases**  
  - **Empty class**: Use the baseline class (mapped zone) rate.  
  - **No claims in class**: Rate = 0% only if class has ≥ 500 parcel-years. Else, use baseline rate.  
  - **State data**: Use only if (1) county data is unavailable, AND (2) the region is hydrologically homogeneous (similar rainfall, soils, topography).  

  **Step 6: Document**  
  - Report: Baseline rate, narrowed rate (if different), attributes used, and stopping reason.  
  - Example: *"Baseline (Zone AE): 0.15%/yr. Narrowed (Elevation >1 ft above BFE): 0.05%/yr. Stopped: Class size = 5,000 parcel-years."*  

  ---

  ### 3. Rulings on Complications (400 words)  
  **Routing Attributes (e.g., post-remap filing, staff appeals):**  
  - **Instinct confirmed**: These reflect data quality/likelihood of *reporting* a claim, not flood hazard.  
  - **Test**: Admit only if the attribute *directly measures flood exposure* (e.g., elevation) or *data completeness* (e.g., "parcels with elevation certificates" to adjust for missing data). Never use to define classes. Example: If claims are underreported in older records, weight recent data more – but don’t exclude old parcels.  

  **Mitigation and Time Index:**  
  - **Two distinct questions**:  
    (1) **"As-Proposed" risk**: Classify the parcel *without mitigation*. Use current attributes (e.g., existing elevation).  
    (2) **"As-Conditioned" risk**: If granting with conditions (e.g., elevate +2 ft), estimate risk *after* mitigation using classes of *already-mitigated* parcels.  
  - **Rule**: Decisions require both estimates. E.g., *"As-proposed risk: 2%/yr. If elevated +2 ft: 0.5%/yr."*  
  - **Bias note**: Acknowledge that "elevated parcels" may be better-maintained, but use available data.  

  **Who Proposes the Class:**  
  - **Rule**: Anyone may propose, but:  
    (1) Attributes must pass Step 2 (physical mechanism).  
    (2) **Burden of justification**: The proposer must show the physical link.  
    (3) **Tiebreaker**: If two valid classes disagree, use the class with more parcel-years. If equal, use the baseline class.  
  - **Example**: An engineer’s "hydrant proximity" class fails – no physical mechanism. Reject it.  

  ---

  ### 4. Verdict on Your Draft (350 words)  
  **Survives:**  
  - Step 1 (list attributes) – but add physical plausibility gate.  
  - Step 5 (fallback to mapped zone) – but define class membership as parcel-years.  

  **Inert/Misleading:**  
  - **Step 2 (5% significance)**: Discard. With small datasets, significance tests are meaningless. Replace with physical plausibility + ≥10 observations/subgroup.  
  - **Step 3 (narrowing order)**: Actively misleading. Order matters. **Repair**: Apply attributes by physical strength (e.g., elevation first).  
  - **Step 4 (stop at <25 cases or small rate change)**: Too rigid. **Repair**: Stop at <200 parcel-years or rate change <0.1%/yr.  
  - **Step 5 (treating model/claims as interchangeable)**: Misleading. **Repair**: Use claims data for rates; use model only for baseline zone.  

  **Key Repair:**  
  - **Class membership**: Define as **parcel-years** (not structures, events, or households). For multi-unit parcels (e.g., 12 mobile homes), one parcel-year = one year of exposure for the *entire parcel*. A flood damaging all 12 units counts as one claim.  

  ---

  ### 5. Three Applications (800 words)  
  **(a) Single-family house, proposed +1.5 ft above BFE:**  
  - Staff’s class: Valid (physical: proximity to channel). Rate = 22 claims / (380 parcels × 40 years) = **0.145%/yr**.  
  - Applicant’s class: "Parcels on this street built after 1995, no claims" – **Rejected**. "Built after 1995" has no physical mechanism; it’s temporal cherry-picking.  
  - **Output**: 0.145%/yr (staff’s class).  

  **(b) 12-unit mobile home park:**  
  - County data: 3 claims / (14 units × 40 years) = **0.54%/yr** (but note: class = parcels, not units).  
  - State data: **Rejected**. Region has different soils/rainfall → not hydrologically homogeneous.  
  - **Output**: 0.54%/yr (county data).  

  **(c) Lakeside widow, rebuild on footprint:**  
  - Baseline class: Entire subdivision (60 parcels). Claims: 0 since 1985.  
  - But: 1979 flood exists (gauge/paper records). **Do not ignore**.  
  - **Adjustment**: Extend parcel-years to 1979 (45 years total). 0 claims / (60 parcels × 45 years) = **0%/yr**.  
  - **Note**: 2,700 parcel-years > 500 → "0%" is defensible.  
  - **Output**: 0%/yr.  

  ---

  ### 6. Hard Stops, Judgment Calls, Hand-Offs (350 words)  
  **Hard Stops (Refuse to Quantify):**  
  - When no valid class exists (e.g., no county data, state data inhomogeneous).  
  - When baseline class has <500 parcel-years *and* 0 claims (too little data).  
  - **Output**: *"Insufficient data to quantify risk. Decision must rely on mapped zone and site-specific modifiers."*  

  **Judgment Calls (Board Vote):**  
  - **"As-Conditioned" risk mitigation**: If conditioning reduces risk below a threshold (e.g., <0.5%/yr), the board weighs economic impact vs. safety.  
  - **Edge cases**: E.g., a 0.6%/yr "as-proposed" risk – is it "too high"? The procedure provides input; the board decides policy.  
  - **Hand-off**: After reporting the risk number, explicitly state: *"The board must now determine if this risk is acceptable under county ordinances."*  

  ---

  ### 7. What Narrowing Cannot Buy (300 words)  
  **Shared Model Error:**  
  - Narrow classes *cannot* reduce error from the base flood model, rainfall data, or gauge. All data derives from the same sources, so errors correlate.  
  - **Appeal-proof findings**:  
    - *"All risk estimates depend on the 20XX FIS model and rain gauge X. A model error could affect all estimates similarly."*  
    - *"Narrower classes reduce sampling error but not systemic model bias."*  
  - **Behavior**:  
    - Use narrower classes for relative comparisons (e.g., "Parcel A risk > Parcel B").  
    - For absolute risk, pair narrow-class estimates with the baseline zone rate.  
    - Example: *"Risk: 0.1%/yr (narrow class) vs. 1.2%/yr (baseline zone). Both share FIS model limitations."*  

  ---

  ### 8. What the Procedure Cannot Do (150 words)  
  1. **Eliminate uncertainty**: It quantifies *empirical* risk, not true risk.  
  2. **Resolve value judgments**: E.g., "Is 0.3%/yr acceptable for a widow’s home?"  
  3. **Predict climate change impacts**: Historical data may not reflect future.  
  4. **Assess non-flood risks**: E.g., erosion, wind.  
  5. **Fix bad data**: Garbage in, garbage out.  
  6. **Replace hydraulic models**: Where no claims data exists (e.g., new development), the FIS model is the only source.  

  ---  
  This procedure prioritizes transparency, defensibility, and your board’s practical constraints. It separates technical risk assessment from policy judgments, survives appeal by documenting shared uncertainties, and resists gaming through physical plausibility tests.
