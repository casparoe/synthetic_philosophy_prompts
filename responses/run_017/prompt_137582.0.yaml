prompt: |-
  You are a professional philosopher of technology who has also spent years doing quantitative forecasting on AI timelines. Before you assign any number, spend a short unstructured pass brainstorming: list the distinct ways a very fast takeoff could come about, the distinct ways it could fail to, and at least two mechanisms you think forecasters on both sides systematically underrate. Then close the brainstorming and commit to numbers.

  Here is the proposition I want priced. Define the *recursive improvement multiple* R(t) as the rate at which the field can produce effective capability gains — algorithmic insight plus the capacity to exploit more compute, data, and feedback — at time t, divided by that same rate immediately before the first system capable of doing AI research engineering end-to-end without step-by-step human guidance. Call that first moment R-automation. Let T be the elapsed calendar time from R-automation until R reaches 100, i.e. until the improvement process is running two orders of magnitude faster than the pre-automation field. Measure R inside the labs that possess the systems: I am asking about capability, not about what is publicly deployed, commercially released, or legally permitted. Assume nothing about the current date or the current state of the field beyond what is in this prompt, and do not reason from recent announcements, benchmarks, or funding news — I want the decomposition to be structural, from the shape of the process rather than from where we happen to be.

  Give me your credence that T is at most twelve months, and decompose it into sub-probabilities I can inspect. The terms I want priced explicitly are: (1) continuity, i.e. the probability that returns to cumulative investment in cognitive capability are smooth enough that there is no threshold at which a small capability gain unlocks a discontinuous jump in the improvement rate; (2) loop closure, by which I mean the share of the wall-clock critical path between a system's having an improvement idea and a system's existing with the improved capability that consists of steps whose duration would shrink if the cognition performing them improved, as opposed to steps whose duration is set by atoms, fabrication plants, power, clinical or physical experimentation, or institutional review — give me your probability that this share is at least one half, and tell me if you think the threshold or the concept is wrong; (3) whether remaining progress at R-automation is mostly idea-limited rather than input-limited, since if it is input-limited then better cognition buys little speed; (4) concentration, the probability that the gains accrue to a single actor fast enough that the loop is self-reinforcing rather than diffusing across many competing ones; (5) the reference class, given that we have no observed instance of a general intelligence recursively improving itself — say what you think the legitimate reference class is, how informative its base rate is, and price the extrapolation. Add any further term you think belongs and I have omitted, and say what weight it carries.

  Then show how the terms combine into your headline number, and state whether that number is a genuine credence or a shrug you would not bet on. Identify the single sub-question your answer is most sensitive to, and the one hypothetical observation — described as an observation, not asserted as a fact you need now — would move your number most, with the size and direction of the move for each outcome. Finally: I sit at roughly 0.35 on this proposition and a colleague sits at 0.05. On your decomposition, which of us is more likely resting on a mistake, and where exactly does our disagreement live? No citations; I will add those myself.
