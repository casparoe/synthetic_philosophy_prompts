prompt: |-
  Me and about a dozen others run a tiny giving circle — we each put in £20 a month, and once a year we argue about where the few thousand pounds goes. I've definately started to think we're not being consistent with ourselves, so I'd like to know what rule we're actually running and what it says about this year's decision.

  What we've decided so far:
  - bednets against malaria, in a country none of us has any connection to — funded
  - a hospice in our own town that two of our members have personal ties to — turned down, because they hit their fundraising target every year and our money wouldn't have added anything
  - a summer holiday version of a reading programme in our own city, in a cause that's already well funded, because nobody else was going to pay for that particular bit — funded
  - research into a rare disease almost nobody funds, tiny number of people affected, no real track record — funded, but only £500 and after a fight about it being a lottery ticket
  - work on making dangerous pathogen labs safer, because it might matter a lot in thirty years — turned down, we couldn't see how to tell if it had done anything
  - a small group whose entire output is research telling other funders where to give — funded, which three of us thought was mad
  - a campaign to get a supermarket chain to stop using one particularly nasty method of killing farmed fish — we couldn't agree, put it off, and it's come back round

  That last one is the decision in front of us now. The numbers of fish involved are enormous, nobody else is funding anything on fish here, and the campaign is cheap. But we're not sure fish feel much of anything, the evidence that campaigns like this actually change practice is thin, and one of us says that if it works the supermarket will just buy from a farm still using the old method, so we'd have bought nothing at all.

  I know the importance / tractability / neglectedness thing, so don't just explain that at me — I want to know which version of it we're running, or whether we're really doing something else, like only caring what our particular money causes. Given our record, what should we decide, which old decision is the closest thing to it, and where our record genuinely doesn't settle it, what would we be signing up to either way? And what's the one application we'd have to see next year to tell the difference?
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They run a small giving circle with about a dozen members, each contributing £20 monthly, and they distribute a few thousand pounds annually. The user feels they've been inconsistent in their funding decisions and wants to uncover the implicit rules they've been following. They provided seven past decisions and are currently debating funding a campaign against a cruel fish farming method.

  First, I need to analyze their past decisions to identify patterns. Looking at the funded projects: bednets for malaria (effective, evidence-based intervention), a summer reading program (specific unfunded niche), rare disease research (neglected area despite low impact), and meta-research (influencing other funders). The rejected ones were the hospice (not needing additional funds) and pathogen lab safety (immeasurable impact). The fish campaign is pending.

  The user mentioned the importance/tractability/neglectedness (ITN) framework but wants to know which variation they're using or if it's something else. It seems like they're combining ITN with a strong focus on marginal impact—ensuring their contribution makes a tangible difference. For example, the hospice was rejected because their money wouldn't add value, while the reading program was funded because their funds filled a specific gap.

  The fish campaign presents a dilemma. It's neglected and potentially impactful on a large scale, but there's uncertainty about fish sentience, campaign effectiveness, and the risk of substitution (supermarkets switching suppliers instead of changing practices). Comparing it to past decisions, the rare disease research is similar as a high-risk, neglected cause, but the fish campaign's scale might make it more appealing. However, the tractability concerns are significant, similar to the rejected pathogen lab project.

  The user also wants to know what future application could clarify their principles. A proposal with clear evidence of impact in a neglected area would test their willingness to fund measurable outcomes. If they fund the fish campaign, it signals a higher risk tolerance for speculative but high-reward causes. If not, they prioritize proven tractability.

  Underlying needs: The user might be seeking validation of their group's ad-hoc approach and a framework to reduce decision fatigue. They also need practical advice on the current dilemma and a method to evaluate future consistency. Addressing these could help them feel more confident in their process and align their values with their actions.
answer: |-
  Based on your detailed history, your giving circle isn't running a pure Importance/Tractability/Neglectedness (ITN) framework. Instead, you've developed a nuanced, **"Marginal Impact ITN+" model with strong emphasis on additionality and avoiding substitution, tempered by evidence thresholds and risk tolerance.** Let's break it down:

  **Your Implicit Rules (The "Rule" You're Running):**

  1.  **Strong Additionality Focus:** Your money *must* cause something that wouldn't happen otherwise. This is paramount.
      *   *Evidence:* Hospice rejected (no additionality - they hit target). Summer reading funded (fills a specific, unfunded gap). Rare disease funded *despite* weaknesses (genuinely neglected, your £500 *might* add something). Fish campaign debate hinges on additionality (will the campaign work? Will substitution occur?).

  2.  **Neglectedness is Key (Often Trumps Raw Importance):** You consistently fund areas others ignore, even if scale is smaller.
      *   *Evidence:* Rare disease research (neglected, tiny scale), Meta-research (neglected niche), Summer reading niche (specific unfunded bit), Bednets (while important, also often underfunded relative to need). Hospice was *not* neglected, hence rejected despite local/personal ties. Pathogen labs rejected partly because tractability masked neglect – you couldn't *see* the need for your specific additionality.

  3.  **Tractability Thresholds Vary by Risk/Reward:** You have a sliding scale for evidence of effectiveness.
      *   **High Evidence Required:** For large-scale but potentially diffuse or complex interventions (Pathogen labs rejected - "couldn't see how to tell if it had done anything").
      *   **Lower Evidence Accepted:** For highly neglected areas where *any* funding might be catalytic, accepting high risk (Rare disease funded as a "lottery ticket"). Meta-research funded despite doubts – perhaps seen as potentially high-leverage if it works.

  4.  **Evidence of Impact > Scale Alone:** While scale matters (Bednets, Fish numbers), it's insufficient without evidence of *your contribution* making a difference (Hospice rejection, Pathogen lab rejection, Fish concerns).

  5.  **Risk Tolerance Exists for Neglected Causes:** You *are* willing to take fliers, but primarily in areas starved of funding (Rare disease, Meta-research). You won't take fliers on things you deem fundamentally untestable (Pathogen labs) or where additionality is clearly absent (Hospice).

  **Analysis of the Fish Campaign Decision:**

  *   **Neglectedness:** High ("nobody else is funding anything on fish here").
  *   **Potential Importance:** High scale ("enormous" numbers of fish).
  *   **Tractability/Evidence:** Major Concerns ("evidence that campaigns like this actually change practice is thin").
  *   **Additionality/Substitution:** Core Concern ("if it works the supermarket will just buy from a farm still using the old method, so we'd have bought nothing at all").
  *   **Cost:** Favorable ("cheap").

  **What Should You Decide & The Closest Analogue:**

  *   **Decision:** **Fund it, conditionally (e.g., £500-£1000), as a "Neglected Scale Lottery Ticket".** But require the campaigners to articulate a *specific, testable theory of change* for *this specific campaign* against *this supermarket*, addressing the substitution risk.
  *   **Closest Analogue:** **The Rare Disease Research.** It shares:
      *   High neglectedness.
      *   High uncertainty/risk ("lottery ticket").
      *   Potential for significant impact relative to scale (though disease = individuals, fish = numbers).
      *   Lower evidence threshold accepted *because* of extreme neglect.
      *   Relatively small grant size accepted due to risk.
  *   **Why Not Pathogen Labs?** That was rejected due to *fundamental* untestability and inability to see *any* marginal impact. The fish campaign, while evidence is thin, *is* testable in principle (did the supermarket change? Did sales shift?). The substitution risk is a major hurdle, but potentially mitigable (e.g., campaign targets *all* major buyers, seeks industry-wide commitment).

  **What You're Signing Up To Either Way:**

  *   **Funding It:** You are signing up to a higher risk tolerance for potentially large-scale impact in neglected areas, *even when* evidence of effectiveness is weak *and* substitution risks exist, provided the core intervention is testable. It reinforces the "Neglected Lottery Ticket" precedent set by the rare disease grant.
  *   **Not Funding It:** You are signing up to a stricter evidence and additionality standard for interventions targeting corporate practices or complex systems. It moves you closer to the "Pathogen Labs" rejection precedent, emphasizing the need for clearer proof of direct, attributable impact and lower substitution risk. It signals that "enormous scale" alone isn't enough without stronger confidence in *your* contribution.

  **The Diagnostic Application for Next Year:**

  To truly test the difference between funding or not funding the fish campaign, you need an application next year that pits **High Neglectedness + Enormous Scale + Moderate Tractability Concerns + Manageable Substitution Risk** against your risk tolerance.

  **Example:** "Fund a pilot program using a novel, evidence-based but unproven-at-scale technique to reduce deforestation by smallholder farmers in a critically endangered ecosystem neglected by major conservation funders. The technique is cheap per farmer, and pilot success could unlock large government funding. However, there's a risk farmers revert to old methods after the pilot, or that success just displaces deforestation elsewhere unless scaled immediately (which depends on govt. funding)."

  *   **Why it Diagnoses:**
      *   Directly analogous to Fish: Neglected? (Yes). Scale? (High potential). Tractability? (Novel technique, pilot = testable but concerns). Substitution Risk? (Reversion, displacement).
      *   If you funded Fish *and* fund this, you've solidified "Neglected Scale Lottery Tickets" as a category.
      *   If you funded Fish *but reject this* due to displacement/reversion risk, it shows your fish decision was an outlier or that you set a higher bar *after* funding a risky fish campaign.
      *   If you rejected Fish *but fund this*, it likely means the *specific* substitution risk in the fish case (single supermarket, easy supplier switch) was the real killer, not general scale+neglect+risk.
      *   If you rejected Fish *and reject this*, you've firmly moved towards requiring stronger evidence and lower substitution risk, even for large-scale neglected problems.

  **In Summary:** Your circle prioritizes funding where your *specific* money clearly adds unique value in otherwise neglected areas. You accept some risk, but demand interventions be fundamentally testable. The Fish Campaign is closest to your Rare Disease grant – high neglect justifies high risk. Funding it cautiously reinforces that precedent. A future application testing neglected scale + tractability/substitution risks will show if this becomes a pattern or an exception. Good luck with the debate!
