prompt: |-
  I teach a first-year political theory module at a university college in Utrecht, where the cohort is roughly a third Dutch, a third from elsewhere in the EU, and a third from outside Europe — mostly Turkey, Indonesia, Nigeria, and India. A lecture exercise blew up on me last week. I had put a list on the board — constitutional government, freedom of conscience, market economies, secular law, gender equality, free inquiry — and asked which of these are 'Western values'. Two objections landed at once: a Turkish student said the list reads like a transcription of what Brussels requires of candidate states, and a Dutch student said her own grandparents would have rejected half of it, so the values cannot be what the West has actually believed. Afterwards in the staff room an anthropologist colleague told me the phrase is a Cold War artifact that has only ever done contrastive work — it denotes whatever the speaker's current outgroup is taken to lack — while a visiting American political theorist said no, it simply names Enlightenment liberalism, and the discomfort is only embarrassment about saying so. I don't want to adjudicate that fight in front of the students. I want the specification first.

  So: write me the desiderata for an account of what the phrase 'Western values' picks out. The purpose is fixed, and I want it held fixed: the account must be good enough to adjudicate, in public argument, claims of the form 'X is incompatible with Western values' — good enough to say whether such a claim is truth-evaluable at all, what kind of evidence would bear on it, and who has standing to make it. The desiderata should therefore concern the extension and the mechanics of the phrase, not which values are worth having. Four cases broke my exercise and I want them driving the list: the convert case, someone born and raised outside Europe who assents to everything on the board; the betrayal case, two governments both claiming the same heritage and each accusing the other of apostasy; the drift case, the contents of the list visibly tracking the perceived outgroup (anti-communism in one decade, gender egalitarianism in the next); and the cosmopolitan-codification case, items whose actual drafting happened in Geneva and New York in committees with heavy non-Western participation, and which several non-Western states ratify more eagerly than some Western ones. If you suspect that some of what people demand here is not a genuine requirement but the prejudice of one camp, say which and why inside the list.

  Format: exactly five numbered items, each one or two sentences, no introduction and no conclusion. Each item should state a single requirement, give the case that motivates it, and be bracketed as [non-negotiable] or [negotiable] according to whether an account that fails it should be rejected outright or merely demoted. Put an asterisk on the one requirement that does the most work in excluding the accounts actually in circulation — that includes the three I sketched above, plus whatever better account you would put in their place. If two of your five cannot be jointly satisfied by any single account, say so inside the item where the conflict bites rather than adding a sixth item. Skip any scorecard of the standard accounts against the list; I will build that myself.
reasoning: |-
  Hmm, the user is a political theory lecturer dealing with a classroom controversy about "Western values." They want desiderata for defining the phrase to adjudicate claims about compatibility with such values. The cases that broke their exercise were: convert (non-European who assents), betrayal (mutual accusations of apostasy), drift (changing definitions based on outgroups), and cosmopolitan-codification (international drafting with non-Western input). 

  The core tension is between historical accuracy and functional utility. The Turkish student's point reveals how the term functions as a political instrument (EU conditionality), while the Dutch student highlights historical discontinuity. The anthropologist sees it as purely contrastive, while the American political theorist insists it's stable Enlightenment liberalism. 

  For the desiderata, I need exactly five numbered items. Each must state a requirement, cite the motivating case, and mark it as negotiable/non-negotiable. The asterisk goes on the requirement that best filters existing flawed accounts. Key conflicts: historical grounding vs. avoiding drift (items 1 and 3 might clash), and handling the betrayal case requires clarifying authority without falling into essentialism.

  The convert case demands avoiding geographic essentialism. The betrayal case requires a mechanism to resolve competing claims. The drift case needs historical anchoring to prevent arbitrary redefinition. The cosmopolitan case requires acknowledging external contributions without dissolving the category entirely. 

  The asterisk should go on the requirement addressing historical formation - it directly challenges both the anthropologist's contrastive view and the American's static Enlightenment claim. The toughest conflict is between historical stability (item 1) and avoiding arbitrary drift (item 3) - they might be incompatible if no core persists through change. 

  The cosmopolitan case is the stealth bomb: if "Western values" were codified by UN committees, can they still be called Western? This forces either redefining "Western" as a project rather than origin, or admitting the term is a misnomer. Either way, item 4 must handle it without collapsing the category.
answer: |-
  Here are the five desiderata for an account of 'Western values':

  1.  **Must distinguish historical origin from current adherence.** The account must separate the geographic/cultural genesis of a value from its present endorsement, preventing the "convert case" from invalidating the Western label by recognizing adoption doesn't erase origin. [non-negotiable]
  2.  **Must define a core content stable enough to resist arbitrary redefinition against shifting outgroups.** The account must identify a minimally persistent historical constellation of principles, preventing the "drift case" where the label merely denotes whatever contrasts with the perceived enemy of the moment. [non-negotiable] *
  3.  **Must provide criteria for authoritative interpretation to resolve competing claims.** The account must specify legitimate sources, procedures, or institutions for interpreting the core content, preventing the "betrayal case" from collapsing into irresolvable mutual accusations of apostasy by rival claimants to the heritage. [negotiable]
  4.  **Must acknowledge non-Western contributions to codification and implementation without dissolving the category.** The account must recognize that values originating in the West were often refined, universalized, or championed through global processes ("cosmopolitan-codification case"), without this making the label incoherent, by focusing on formative origins rather than exclusive ownership. [non-negotiable]
  5.  **Must avoid geographic or ethnic essentialism.** The account cannot define the values as inherently tied to biological descent or immutable cultural essence, preventing the prejudice that non-Western individuals or societies cannot authentically embody these values ("convert case" & "cosmopolitan-codification case"). [non-negotiable]

  **Conflict Note:** Item 2 (stable core) and Item 3 (interpretive criteria) may conflict if historical stability requires fixed principles while resolving "betrayal" demands flexible interpretation; this tension is inherent and necessitates careful balancing within any viable account. The asterisk (*) denotes Item 2 as doing the most work in excluding prevalent contrastive/essentialist or purely presentist accounts.
