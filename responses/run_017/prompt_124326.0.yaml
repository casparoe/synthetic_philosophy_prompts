  We are designing an activity for a seminar on interpersonal utility comparisons. The goal is to have students experience the problem that utility functions are only defined up to positive affine transformations and that this makes interpersonal comparisons for allocation decisions problematic.

  Key elements:
  - We have 18 students.
  - They will be given private payoff tables in their own units (unnamed) for a set of goods.
  - One student is designated as the "reference person" (RP) whose unit is fixed.
  - There will be a swap round where students can bid to swap their entire situation (including their payoff table and any assets) with someone else. This is intended to introduce level comparisons.
  - A final round behind a veil of ignorance: they choose an allocation rule without knowing which card they will get, and the lottery is loaded (not uniform) so they can't just average.

  The activity should lead them to see that two different translation schemes (both consistent with observable behavior) can lead to opposite allocation recommendations, and that there is no further behavioral fact to break the tie.

  We need:
  - Rules and roles
  - What goes on the cards (payoff tables)
  - A payoff scheme without money
  - A timeline for 80 minutes
  - A debrief mapping moments to concepts
  - Predictable problems and how to handle them
