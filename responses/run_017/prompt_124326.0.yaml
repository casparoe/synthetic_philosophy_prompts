     - If we make the activity have real stakes (even though not money), we need to ensure that the golden chip allocation matters. But then they will have an incentive to campaign for it.

     - The maths majors: They might realize immediately that the scaling is arbitrary. We can use them as helpers: ask them to be the ones to try to compute the sum and then they will see the problem.

     - The utility monster: One card has a very high utility for the golden chip. But then under any scaling, it might be allocated to them. Or not? If we scale by a very small factor, then it might be allocated to someone else. But the scaling factor is chosen by the rule.

     Given the complexity, I propose a simplified activity:

     We have two goods: chocolate bars and bags of chips. (Physical goods that they can consume at the end, but note the session is 80 minutes, so maybe at the end they get to eat, but we have to buy these.)

     But the problem says no real money, and we have poker chips, so let's stick to chips.

     Final design:

     - We will have three goods: Red chips, Blue chips, White chips.
     - Each student gets a card that specifies their utility per unit of each good. The utility is linear. The card has a table that shows the utility for 1 unit of each good (and they can have multiple units, utility is linear).
     - Example card: 
          "You are Type A. 
           Each red chip gives you 5 utils.
           Each blue chip gives you 8 utils.
           Each white chip gives you 3 utils."
     - The reference person's card might say:
          "You are the Reference Person.
           Each red chip gives you 10 utils.
           Each blue chip gives you 15 utils.
           Each white chip gives you 1 util."

     - Endowment: each student gets 2 red, 2 blue, and 5 white.

     - Trading round (15 min): 
          They can trade with each other. The TA can walk around and help. They should record any trades they make.

     - Then, the allocation of the golden chip (20 min):
          The golden chip is worth 50 utils to every student? No, let's make it depend on type. 
          But if it's the same for everyone, then it doesn't matter who gets it. So let's have different values.
          The golden chip value is written on their card. For example, Type A gets 50 utils, Type B gets 30 utils, etc.

          The group must decide who gets it to maximize the sum of utilities in common units.

          They will try to convert to common units. They will likely use the white chip as numeraire and the RP's valuation (1 util per white chip).

          For a student, if they say their utility for a white chip is c_i, then their util per white chip is c_i in their own units. So to convert their utils to RP utils, we divide by c_i.

          Therefore, the golden chip for a student i is worth (g_i / c_i) in RP utils.

          But the catch: do they know c_i? The card tells them c_i, but will they report honestly? And if they do, then we can compute. But then there is no problem.

          However, the problem is that c_i is private. And even if they report honestly, is this the only possible scaling? No, because we could have chosen a different good as numeraire. 

          For example, if we use red chips as numeraire, then we would have a different scaling.

          Let's see:

            Using white as numeraire: scaling factor for i is 1/c_i.
            Using red as numeraire: scaling factor for i is 1/r_i.

          Then the value of the golden chip in common units would be:
            using white: g_i / c_i
            using red: g_i / r_i

          And these can be different.

          Example:

            Person 1: 
               g1 = 50
               c1 = 3  (utility of a white chip)
               r1 = 5  (utility of a red chip)

            Using white as numeraire: 50 / 3 ≈ 16.67
            Using red as numeraire: 50 / 5 = 10

            Person 2:
               g2 = 30
               c2 = 2
               r2 = 4
            Using white: 30/2 = 15
            Using red: 30/4 = 7.5

            Now, if we compare using white: person1 has 16.67, person2 has 15 -> give to person1.
            Using red: person1 has 10, person2 has 7.5 -> still to person1.

          Not different.

          We need to have a cross over.

          Person 1: 
            g1 = 50
            c1 = 3 -> white scaling: 50/3 = 16.67
            r1 = 5 -> red scaling: 10

          Person 2:
            g2 = 40
            c2 = 2 -> white scaling: 20
            r2 = 8 -> red scaling: 5

          Now, using white: person1=16.67, person2=20 -> person2 wins.
          using red: person1=10, person2=5 -> person1 wins.

          Yes! So we have a reversal.

     So on the cards, we need to have different types. Let's have two types:

          Type X: 
              red: 5
              blue: ? (not needed for this)
              white: 3
              golden: 50

          Type Y:
              red: 8
              white: 2
              golden: 40

     And the RP should be a separate type? Or one of them. Let the RP be Type R:

          red: 10
          white: 1
          golden: ?  (doesn't matter for the scaling, but if they get the golden chip, it matters. Let's say 60 for the RP.)

     In the group, we have several Type X and several Type Y, and one Type R.

     During the allocation round, the group will likely try to use the white chip as numeraire. They will ask each student: "How much utility do you get from one white chip?" Then they will use that to scale. For Type X: 3, for Type Y:2, for RP:1.

     Then the scaled golden chip utility:

          Type X: 50 / 3 = 16.67
          Type Y: 40 / 2 = 20
          Type R: 60 / 1 = 60

     So they allocate to the RP.

     Then, a student (hopefully a maths major) might say: "Why are we using white? Why not red?" 

     Then they try with red:

          Type X: 50 / 5 = 10
          Type Y: 40 / 8 = 5
          Type R: 60 / 10 = 6

     Then the winner is Type X.

     And the two methods give different allocations.

     And there is no behavioral way to break the tie.

     Timeline for allocation round:
          - Explain the golden chip and the goal (5 min)
          - Brainstorm how to common unit (5 min)
          - They try one method (white) and compute (5 min)
          - Someone suggests red, they try and see the reversal (5 min)

     Then move to veil of ignorance.

     Veil of Ignorance (15 min):
          - The students are told that there are 10 Type X and 8 Type Y (or adjust to class size) and 1 Type R.
          - They will be assigned a type at random with these probabilities.
          - They must choose a rule for allocating the golden chip. The rule can be:
               a. Maximize the sum of utilities using white as numeraire.
               b. Maximize the sum using red as numeraire.
               c. Egalitarian: give to the type that has the lowest average utility without the golden chip. (But then they need to know the current utility levels, which they don't behind the veil.)
               d. Maximin: give to the type that would have the lowest utility after allocation? But again, they need levels.
               e. Random allocation.
               f. Average utility gain without scaling (sum of g_i, but that is in different units) -> doesn't work.
          - They might choose a rule that doesn't require interpersonal comparison, like random.

     Debrief (15 min):
          - Highlight the allocation round: two different numeraire goods led to two different allocations. Why? Because the scaling is arbitrary.
          - In the veil of ignorance, they might have chosen a rule that doesn't depend on scaling.

     Predictable problems:
          - Strategic reporting in the allocation round: If a student is type X and the white numeraire gives them a lower chance, they might lie about their utility for white. To prevent this, we can make the golden chip allocation not affect their real payoff (just a thought experiment). Or we can make it affect, but then we have to rely on honesty. Given time, we can say: "For the purpose of this activity, we will assume you report truthfully because we are interested in the conceptual problem."
          - The reference person might be type X or Y or a new type. In our example, type R is different. We can make the reference person have type R and a separate card.
          - Maths majors: They might see the reversal immediately. We can involve them in the calculations. Or if they try to explain, we can say: "Let's test it."
          - Utility monster: In our example, type R has a high scaled utility with white numeraire. But under red, they are not the highest. So it's not a monster.

     What the activity cannot show: 
          - It cannot show that there is a fact of the matter about which allocation is better. It shows that from observed behavior, we cannot uniquely determine the scaling. But it doesn't address whether there is a true scaling. In the debrief, we can explain that some philosophers and economists think there is no fact of the matter (emotivism or conventionalism), while others think there is (realism).

     We must be careful not to teach them that there is no true scaling. We can say: "The activity shows that we cannot learn the scaling from behavior alone. This leaves open the question of whether there is a true scaling that is not behavioral."

     Timeline for the whole session:

          0-5 min: Introduction
          5-10 min: Distribute cards and explain the goods and utility. Designate the RP.
          10-25 min: Trading round. (15 min)
          25-45 min: Golden chip allocation. (20 min)
          45-60 min: Veil of ignorance round. (15 min)
          60-75 min: Debrief. (15 min)
          75-80 min: Wrap-up.

     In the debrief, map:
          - The trading round: revealed MRS, but not absolute scaling.
          - The allocation round: the need for a common unit and the arbitrariness of the choice of numeraire.
          - The veil of ignorance: a way to make a fair decision without knowing the scaling.

     This should work.
answer: |-
  Based on your constraints and goals, here's a structured activity designed to force students into the interpersonal utility comparison problem. The core tension is between two allocation rules (Utilitarianism vs. Prioritizing the Worst-Off) that yield opposite recommendations under different affine transformations of utility scales. The activity uses **private payoff cards**, **poker chips** as goods, a **designated reference person**, and a **loaded veil of ignorance**.

  ---

  ### **Game Setup: "The Allocation Dilemma"**
  **Time:** 80 minutes  
  **Players:** 18 students  
  **Materials:** 
  - Poker chips (3 colors: Red, Blue, Green) representing goods.
  - Index cards with private payoff tables (one per student).
  - Whiteboard to record bids, swaps, and allocation rules.
  - Projector to display instructions and timer.

  #### **1. Roles and Cards**
  - **Each student** gets a card with:
    - **Private Payoff Table**: Utility values for owning 0, 1, 2, or 3 units of **Red**, **Blue**, and **Green** chips. Units are in a private scale (e.g., "Utils").
    - **Golden Chip Value**: Fixed utility for receiving the "Golden Chip" (indivisible good).
    - **Card Types** (distribute evenly):
      - **Type A**: High marginal utility for Green, low for Red (e.g., Green: 0→0, 1→8, 2→15, 3→21; Red: 0→0, 1→3, 2→5, 3→6; Golden Chip: 12).
      - **Type B**: High marginal utility for Red, low for Green (e.g., Red: 0→0, 1→9, 2→17, 3→24; Green: 0→0, 1→2, 2→3, 3→4; Golden Chip: 10).
      - **Type C (Reference Person)**: Moderate utilities, designated as reference (e.g., Red: 0→0, 1→5, 2→9, 3→12; Green: 0→0, 1→5, 2→9, 3→12; Golden Chip: 10). Only one Type C exists.
  - **Rules for Students**:
    - Never reveal your card’s numbers. You may only discuss *ratios* (e.g., "I value Green twice as much as Red").
    - Your goal is to maximize your private utility.

  ---

  ### **Activity Timeline**
  #### **Phase 1: Setup (5 min)**
  - Distribute cards and 2 chips of each color to all students.
  - Designate **Type C** as the "Reference Person" (RP). Announce: "The RP’s utility unit is the baseline. All allocations will be compared to this scale."
  - Display rules on the projector.

  #### **Phase 2: Trading Round (15 min)**
  - **Goal**: Trade chips to maximize individual utility.
  - **Rules**:
    - Students trade chips bilaterally (e.g., "I’ll give 1 Red for 2 Green").
    - Trades must be voluntary. No group pooling.
  - **Why?** Reveals *marginal rates of substitution* (behavioral data), but not absolute utility levels.  
  - **Predicted Issue**: Students might hoard or trade suboptimally. **Mitigation**: Walk around, nudge inefficient traders with: "Could you get more utility by trading?"

  #### **Phase 3: Swap Round (15 min)**
  - **Goal**: Force level-comparisons using the RP’s scale.
  - **Rules**:
    - Students bid **Green chips** (designated "common currency") to swap their *entire situation* (card + chip bundle) with the RP.
    - RP’s Green utility is public: "1 Green = 5 RP Utils."
    - Each student writes a sealed bid: "I’ll pay X Green chips to become the RP."
    - Collect bids. Announce the highest bidder, who swaps roles with RP.
  - **Why?** Bids reveal perceived *absolute welfare levels* relative to RP. But bids depend on Green’s marginal utility (unobserved), making comparisons ambiguous.  
  - **Predicted Issue**: Bids vary wildly (e.g., Type A bids high since Green is valuable; Type B bids low). **Mitigation**: Later, contrast bids with Golden Chip allocations to show inconsistency.

  #### **Phase 4: Golden Chip Allocation (20 min)**
  - **Goal**: Allocate one Golden Chip to maximize "social welfare."
  - **Rules**:
    - Group must decide who gets the chip using RP utils.
    - Students lobby using ratios (e.g., "My Golden Chip is worth 12 utils; that’s 2.4 times my Green util").
    - Vote on two rules:
      1. **Utilitarianism**: Give to whoever contributes most to *summed utility*.
      2. **Prioritize Worst-Off**: Give to whoever has the *lowest current utility*.
  - **Why?** Utilitarianism requires *scale comparisons*; prioritization requires *level comparisons*. Both rely on unobservable affine transformations.  
  - **Predicted Issue**: 
    - Maths majors may note that without intercepts, levels are arbitrary. **Use them**: Ask, "How would *you* calculate ‘worst-off’?" 
    - "Utility monster" (e.g., a Type A with high Golden Chip utility) may dominate. **Highlight this**: "Is this fair?"

  #### **Phase 5: Veil of Ignorance (15 min)**
  - **Goal**: Choose an allocation rule without knowing your card.
  - **Rules**:
    - Cards are collected. Students no longer know their type.
    - Announce card distribution: 9 Type A, 8 Type B, 1 Type C (loaded lottery).
    - Groups debate and vote on a rule for allocating the Golden Chip:  
      - Rule 1: Utilitarianism (sum scaled to RP utils).  
      - Rule 2: Prioritize lowest utility (levels scaled to RP utils).  
      - Rule 3: Random allocation.  
  - **Why?** The loaded lottery prevents "average utility" default. Rules 1 vs. 2 often conflict after the swap round.

  #### **Phase 6: Debrief (10 min)**
  Use whiteboard to map game moments to concepts:  
  | **Game Moment**         | **Concept**                                  | **Why It Fails**                                                                 |
  |--------------------------|---------------------------------------------|----------------------------------------------------------------------------------|
  | Trading Round            | Marginal rates (gains) observable           | Reveals MRS, but not origin/scale (invariant to affine transforms).             |
  | Swap Bids                | Level comparisons to RP                     | Bids depend on Green’s marginal utility (unobserved). No unique scaling.        |
  | Golden Chip: Utilitarianism | Scale comparisons (summing utils)          | Requires interpersonal scaling (no behavioral anchor).                           |
  | Golden Chip: Worst-Off   | Level comparisons (absolute welfare)        | Cannot observe "zero" point or cardinal levels from choices.                     |
  | Veil Choice              | Rules avoid direct comparisons              | But swap round vs. veil choice may conflict (e.g., bidder might oppose utilitarianism under veil). |

  **Key Insight**: Two affine transformations (e.g., scaling to Green utils vs. Red utils) can make the same behavioral data support opposite allocations. No observable fact can resolve this.

  ---

  ### **Handling Predictable Problems**
  1. **Strategic Misreporting** (e.g., inflating Golden Chip utility):  
     - **Prevent**: Emphasize honesty is needed to "test the philosophy." Award bonus chips for helpful behavior.  
     - **Use**: If someone lies, ask: "How could we verify your claim with only your choices?"

  2. **Maths Majors Solving It**:  
     - **Prevent**: Make them "observers" who translate bids/RP scales. Their job is to *create* the two conflicting allocation tables.  
     - **Use**: When they spot the affine freedom, ask: "Show us two scalings that reverse the Golden Chip allocation."

  3. **Reference Person Anxiety**:  
     - **Prevent**: Privately brief them: "Your role is mechanical; you’re a ‘ruler,’ not a winner/loser."  
     - **Use**: If bids to become RP are low, ask: "Does this mean no one envies the RP? Or is Green worthless to some?"

  4. **Utility Monster Dominance**:  
     - **Use**: When Type A wins utilitarianism, ask: "Should we accept this if they’re already well-off? What would the veil choose?"

  ---

  ### **What the Activity Can’t Show (Final 10-Minute Lecture)**
  The activity **shows that utility comparisons are underdetermined by behavior**, but it **cannot address whether true interpersonal comparisons exist**. In the last 10 minutes, clarify:
  - **What’s missing**: The debate on whether utility is *metaphysically comparable* (e.g., Harsanyi’s cardinalism vs. Robbins’ ordinalism).  
  - **Key point**: "The activity proves we can’t *measure* comparisons from choices, not that they’re unreal. You might still believe a starving person gains *more* from bread than a billionaire, even if you can’t prove it behaviorally."  
  - **Bridge to ethics**: "This is why philosophers inject normative assumptions (e.g., ‘Assume equal scaling’) or use veils. Economics alone can’t resolve this—it needs ethics."

  ---

  ### **Why This Works**
  - **Tangible Conflict**: Students *see* Utilitarianism and Worst-Off rules clash after the swap round.  
  - **Affine Freedom in Action**: Maths majors construct scaling tables showing reversals (e.g., scaling to Green makes Type A win; scaling to Red makes Type B win).  
  - **No Money Needed**: Chips/cards handle incentives; the Golden Chip focuses debate.  
  - **Predictable Derailments Become Teachable**: Misreporting exposes the need for behavioral anchors; utility monsters force egalitarian debates.  

  **Final Tip**: Run a test with colleagues first. Adjust card payoffs to ensure Golden Chip allocations reverse under plausible scalings (e.g., Type A wins under Green-scaling utilitarianism; Type B wins under Red-scaling).
