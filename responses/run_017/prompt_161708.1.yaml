      C. No — because the degree of AI generation is the same, so the label should be the same.
      D. Yes — what counts as "AI-generated" might be stricter in high-stakes situations like college applications.
      E. The concept of "AI-generated" is too vague to be useful in either case.

   7. **The Boundary Shift Scenario**: Over time, as AI tools become more common and integrated into writing, do you think the meaning of "AI-generated" will change to exclude minor AI assistance?
      A. No — the meaning is fixed. What changes is how we use the term.
      B. No — the meaning is fixed, but we might adjust our thresholds for practical reasons.
      C. Yes — because the boundary is inherently flexible and society can redefine it.
      D. Yes — because the context in which we use the term changes, so the meaning adapts.
