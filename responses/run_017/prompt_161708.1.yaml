   Here are the seven questions, each as a scenario:

   1. **The Minor Edit Scenario**: A journalist's draft is 90% written by an AI model, and then a human edits just 10% of it (fixing typos and adjusting a few sentences). After this edit, the journalist labels the piece as "human-written". Do you agree with this label?
      A. Yes, because any human input makes it human-written.
      B. No, because the majority of the content was generated by AI.
      C. It's not clear-cut — there's no definite line, but in this case, I lean towards saying it's AI-generated.
      D. It depends on the context (like the publication's policy or the audience's expectations).
      E. The label doesn't capture the reality — it's a mix, and we shouldn't force a binary choice.

   2. **The Policy Line Scenario**: A policy committee at a news organization sets a threshold: if at least 50% of the content is generated by AI, then it must be labeled as "AI-generated". They admit that 50% is arbitrary but say they must pick a line. What do you think?
      A. They are right to set a precise boundary — even if arbitrary, it's necessary for clarity.
      B. The boundary is artificial — the real issue is that there is no fact of the matter about when something becomes AI-generated, but we have to set a rule for practical reasons.
      C. The boundary is arbitrary and misleading because the property of being AI-generated comes in degrees.
      D. The boundary might be okay for their organization, but other organizations might set a different boundary (like 30% or 70%) and that's acceptable too.
      E. Setting a boundary like this is pointless because the concept of "AI-generated" is fundamentally flawed.

   3. **The Judge's Dilemma Scenario**: A judge must rule on whether a particular article (which is about 50% AI-generated) violates a law requiring "AI-generated" content to be labeled. The law doesn't specify a percentage. The judge must say "yes" or "no". What should the judge do?
      A. Rule "yes" because at 50% it's clearly AI-generated (or at least, we have to treat it as such).
      B. Rule based on the best available standard — even if it's a borderline case, there is a correct answer (even if we don't know it).
      C. Rule arbitrarily because the case is borderline — but the law forces a binary choice.
      D. The ruling should take into account the context of the case (e.g., how the article was presented, the intent of the author, etc.).
      E. The law is flawed because it requires a binary label for something that isn't binary.

   4. **The Editorial Disagreement Scenario**: Two editors at the same publication are reviewing the same article. The article has been partially rewritten by a human, but the starting point was an AI model. One editor says it should be labeled "AI-generated", the other says it's "human-written". What does this disagreement show?
      A. One of them is right and the other is wrong — there is a fact of the matter.
      B. They are both wrong because the article is neither fully AI-generated nor fully human-written — it's in the middle, but we don't have a word for that.
      C. They are both partially right because the article is to some extent AI-generated and to some extent human-written.
      D. They might both be right relative to their own standards or the context they are considering.
      E. The disagreement shows that the term "AI-generated" is meaningless.

   5. **The Hidden Truth Scenario**: Is there a fact of the matter about exactly what percentage of human rewriting makes an AI draft "human-written" — even if we can never measure it perfectly?
