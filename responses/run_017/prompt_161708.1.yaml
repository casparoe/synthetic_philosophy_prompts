  Here’s a 7-question quiz designed to sort readers into theories of vagueness through practical journalism examples, with a scoring key that maps answers to philosophical positions—**without ever using technical terms**. The cases focus on AI-labeling dilemmas, human-AI collaboration, and policy debates.

  ---

  ### **The "When Does AI-Written Stop Being AI-Written?" Quiz**
  **Instructions:** Pick the answer that best reflects your gut reaction to each scenario. There are no right or wrong answers—just your intuition.  

  1. **The Minor Edit Test**  
     A draft is 90% written by an AI, then a human edits 10% (fixing typos and adjusting a few sentences). The journalist labels it "human-written." Do you agree?  
     - **A.** Yes—any human input makes it human-written.  
     - **B.** No—it’s mostly AI-generated, so the label is misleading.  
     - **C.** It’s unclear, but I lean toward "AI-generated" since the core is AI.  
     - **D.** It depends on the situation (e.g., the publication’s standards or reader expectations).  
     - **E.** The label is flawed—it’s a hybrid, and forcing a binary is the problem.  

  2. **The Arbitrary Threshold**  
     A policy committee declares: "If ≥50% of a draft is AI-written, it must be labeled ‘AI-generated.’" They admit 50% is arbitrary but say a line must be drawn. What’s your take?  
     - **A.** Good—you need a clear rule, even if imperfect.  
     - **B.** It’s artificial—there’s no real boundary, but rules are practical.  
     - **C.** Misleading—AI involvement isn’t yes/no; it’s a sliding scale.  
     - **D.** Fine for them, but another org might fairly pick 30% or 70%.  
     - **E.** Pointless—the concept is too fuzzy for rigid rules.  

  3. **The Judge’s Dilemma**  
     A judge must rule whether an article (∼50% AI-written) violates an "AI-generated" labeling law. They can’t say "maybe"—only yes/no. How should they rule?  
     - **A.** "Yes"—it’s clearly AI-assisted, so err on caution.  
     - **B.** "No"—unless we *know* it crosses a threshold, it’s unfair.  
     - **C.** Flip a coin—borderline cases force arbitrary calls.  
     - **D.** Consider context (e.g., intent or how it was presented).  
     - **E.** Reject the case—the law can’t handle gray areas.  

  4. **The Editorial Dispute**  
     Two editors review the same AI-assisted draft. One says "label it AI-generated," the other says "it’s human-written." What does this show?  
     - **A.** One is objectively right—the other is wrong.  
     - **B.** Neither is fully right—it’s in between, but we lack the language.  
     - **C.** Both capture part of the truth—it’s partly both.  
     - **D.** Both can be valid if they’re using different standards.  
     - **E.** The label is meaningless—that’s why they disagree.  

  5. **The Hidden Truth**  
     Is there a precise % of human edits that *truly* turns an AI draft "human-written"—even if we can’t measure it perfectly?  
     - **A.** Yes—a specific threshold exists (e.g., 51%), we just don’t know it.  
     - **B.** No—no exact boundary exists, but the concept still works.  
     - **C.** No—it’s inherently gradual (like shades of gray).  
     - **D.** It shifts based on context (e.g., academic vs. casual use).  
     - **E.** No—the distinction is illusory.  

  6. **The Stakes Matter**  
     A student uses AI for 40% of a college essay; a journalist uses it for 40% of a news piece. Should we be *stricter* about labeling the essay?  
     - **A.** No—the AI involvement is the same, so labels should match.  
     - **B.** No—but we might enforce rules differently due to consequences.  
     - **C.** Maybe—if the essay’s stakes make us notice AI more.  
     - **D.** Yes—in high-stakes cases, we should set a higher bar for "human-written."  
     - **E.** No—neither label is meaningful.  

  7. **The Shifting Line**  
     As AI tools become commonplace, will "AI-generated" eventually exclude minor AI assistance (e.g., autocomplete)?  
     - **A.** No—the meaning is fixed; only usage changes.  
     - **B.** No—but we’ll tolerate more AI as tools evolve.  
     - **C.** Yes—society will redraw the boundary.  
     - **D.** Yes—because what counts as "AI help" depends on context.  
     - **E.** It’ll just highlight the term’s emptiness.  

  ---

  ### **Scoring Key: What’s Your Theory of Vagueness?**
  Tally your answers, then match the pattern to one of five positions. **No philosophy background needed!**  

  | Theory              | Core Idea (Simplified)                           | Your Answer Pattern                                  |
  |---------------------|--------------------------------------------------|-----------------------------------------------------|
  | **Epistemicism**    | "There’s a sharp line—we just can’t find it."    | Mostly **A’s** (especially Q2,3,5 + ≥4 A’s total)    |
  | **Supervaluationism** | "No single boundary—but consensus creates truth." | Mostly **B’s** (especially Q2,4,5,6)                 |
  | **Degree Theory**   | "It’s a spectrum—nothing is yes/no."             | Mostly **C’s** (especially Q1,2,3,4,5)               |
  | **Contextualism**   | "The line moves with the situation."             | Mostly **D’s** (especially Q1,2,3,6,7)               |
  | **Meaning Nihilism**| "The label is broken—stop pretending."           | Mostly **E’s** (≥4 E’s)                              |

  #### **Important Notes**  
  - **Unresolvable Pairs**:  
    - **Epistemicism vs. Degree Theory**: Both *sometimes* agree on "no clear line now" (Q1C, Q3C) but clash on whether a hidden line exists (Q5A vs. Q5C).  
    - **Supervaluationism vs. Contextualism**: Both accept flexible boundaries but disagree on *why* (Q6B vs. Q6D).  
  - **Unoccupied Combinations**:  
    - **All-A or All-E**: No theory insists on absolute rigidity (all A) or total rejection (all E) *across all cases*.  
    - **B+D Mix**: Supervaluationism (B) and Contextualism (D) conflict on whether context *defines* truth (incoherent).  
    - **High Stakes + Fixed Line (Q6D + Q5A)**: Contextualism (Q6D) rejects hidden thresholds (Q5A).  
  - **Why?**  
    - **Incoherent**: Mixing "fixed line" (epistemicism) with "context shifts meaning" (contextualism).  
    - **Unattractive**: Rigid labels with no practical flexibility (all A’s) ignores real-world ambiguity.  
    - **Unexplored**: A "mostly C but Q7A" view (degree theory + fixed meaning) has few modern defenders.  

