answer: |-
  Here’s a structured proposal framework focused on your core question, with built-in feasibility checks and clear exit ramps if the idea doesn’t hold. It prioritizes your constraints: no citations, generalist-accessible framing, and methodological transparency.

  ---

  **Working Title:**  
  The Illusion of Convention? Testing Explanatory Gaps in Terminal Coordination Problems  

  **Abstract (149 words):**  
  Convention theories—whether rationalist (requiring common knowledge) or evolutionary (relying on learning dynamics—assume recurrent interaction. Yet many real-world coordination events are "terminal instances": one-off interactions (e.g., a disbanding committee’s final vote) with no future recurrence. These pose a puzzle: agents coordinate *as if* governed by convention, citing precedents or settled norms, but standard accounts lack resources to explain *why*, having built recurrence into their foundations. This project tests whether terminal instances expose a fundamental misclassification in convention theory. Using a structured case-space analysis, it varies three dimensions of recurrence (problem form, agent identity, payoff structure) to isolate terminal cases. By mapping how existing theories fail or stretch to cover these—and whether recurrence dimensions are truly independent—it determines if terminal cases require a distinct normative explanation or merely a modal revision of convention.

  ---

  ### Proposal (2 pages)

  #### 1. Core Question and Significance
  **Question:** Can established theories of convention (rationalist or evolutionary) explain coordination in strictly *terminal* instances—where no recurrence occurs—without ad hoc modification, or do such cases reveal a misclassified normative phenomenon?  

  **Why it matters:** Conventions are foundational to social theory, law, and institutional design. If standard accounts silently misdiagnose terminal cases (common in institutional transitions, legal settlements, or project closures), we misunderstand the sources of social stability in pivotal moments. This project isolates a blind spot: theories that build in recurrence *by design* cannot test whether recurrence is necessary. Terminal cases probe the limits of "convention" as an explanatory category.  

  **Why now?** The evolutionary literature’s emphasis on dynamical learning makes recurrence *more* central, not less, than in rationalist accounts. Yet neither confronts the terminal case directly. Your insight—that recurrence has distinct dimensions—creates a testable wedge.  

  #### 2. Why Existing Theories Leave the Question Open  
  - **The rationalist account** (common knowledge + conditional preference) relies on expectations of *future* conformity. For terminal cases, defenders might argue:  
    - *"Agents generalize from past recurrent problems of similar form."*  
    → **Retort:** This smuggles in recurrence elsewhere, conflating convention with habit or rule-following.  
    - *"Common knowledge of counterfactuals suffices (e.g., ‘They would conform if it recurred’)."*  
    → **Retort:** This severs convention from real behavior, making it a purely modal property—untestable and dynamically inert.  

  - **Evolutionary/reinforcement accounts** require repeated play for learning/selection. Defenders might claim:  
    - *"Terminal cases are vanishingly rare; conventions emerge from recurrence, then persist inertially."*  
    → **Retort:** Persistence without recurrence is unexplained; inertial conformity *is* the puzzle.  
    - *"Agents deploy strategies trained on past recurrent problems."*  
    → **Retort:** This reduces convention to behavioral programming, ignoring normative self-reports ("*This* is how we do it").  

  **The silence is suspect**: Both theories *assume* recurrence to solve coordination, so they lack tools to interrogate its necessity. Terminal cases force this omission into view.  

  #### 3. Methodology: Phased Case-Space Construction (4.5 Months)  
  **Goal:** Build a 2x2x2 case matrix varying your recurrence dimensions:  
  - **Problem Form** (Recurrent Type / Novel Type)  
  - **Agent Identity** (Fixed Group / One-Off Group)  
  - **Payoff Structure** (Stable / Terminal-Specific)  

  **Phase 1: Dimension Validation (Month 1)**  
  - *Task:* Systematically vary dimensions via thought experiments (e.g., "Final committee vote with same members vs. strangers"; "Standard payment rule vs. rule with terminal-only incentives").  
  - *Output:* A refined matrix. **Feasibility checkpoint:** If dimensions collapse (e.g., novel problem forms always imply novel payoffs), the project simplifies to documenting this collapse.  
  - *Why not conceptual analysis?* Pure analysis risks ignoring empirical constraints on dimension independence. Cases ground abstractions.  

  **Phase 2: Theory Stress-Testing (Months 2–3)**  
  - *Task:* For each cell in the matrix (esp. terminal corner: Novel Problem + One-Off Group + Terminal Payoffs), assess:  
    - Can rationalist/evolutionary theories explain coordination *without* recourse to recurrence?  
    - Do agents’ stated reasons ("how we do it," "what was settled") map to convention or other norms (agreement, authority)?  
  - *Tools:* Curated real-world examples (e.g., institutional sunsets; project retrospectives) + constructed cases. RA compiles databases; you analyze normative justifications.  
  - *Why not simulation?* Simulations assume dynamical rules; they can’t test the *absence* of dynamics. Cases capture normative self-understanding.  

  **Phase 3: Diagnosis (Month 4)**  
  - *Task:* Weigh two claims against the case matrix:  
    - **Radical Claim:** Terminal coordination is non-conventional; it borrows normativity from agreements/authority.  
    - **Conservative Claim:** Convention generalizes modally (Lewis+) via counterfactual expectations.  
  - *Decision criteria:*  
    - If terminal cases show consistent appeal to *non-conventional* reasons (e.g., "We agreed Tuesday," not "We always meet Tuesday") → Supports Radical Claim.  
    - If theories require radical modal revision (e.g., inert common knowledge) to fit cases → Undermines their dynamical foundations.  
    - If all cases reduce to type-level recurrence (e.g., "voting" as recurrent type) → Deflationary result.  

  **Phase 4: Synthesis and Drafting (Month 4.5)**  

  #### 4. Possible Outcomes & Decision Criteria  
  1. **Dimensions Collapse** (e.g., problem form ⇨ payoff structure): Project reorients to *documenting* this collapse, showing recurrence is simpler than proposed.  
  2. **Deflationary Result**: Terminal cases reduce to conventions under broader type-descriptions. Outcome: A paper clarifying convention’s scope.  
  3. **Radical Claim Supported**: Terminal cases consistently appeal to non-conventional norms. Outcome: Convention theory needs conceptual surgery.  
  4. **Conservative Claim Supported**: Counterfactual expectations robustly explain cases. Outcome: Convention is inherently modal, not dynamical.  
  5. **Inconclusive**: Cases are heterogeneous; no unified account. Outcome: Taxonomy paper identifying irreducibility.  

  **Failure Conditions:**  
  - Dimensions collapse immediately (no space to explore).  
  - Cases are intractably rare/ambiguous (mitigated by using constructed cases + archival examples).  
  - Deflationary result emerges early (still a publishable outcome).  

  **Scope Check:** The project is feasible because it:  
  - Focuses on *testing* a specific 3D framework, not building grand theory.  
  - Uses cases, not experiments or large data.  
  - Has clear exit ramps (dimension collapse/deflation).  

  #### 5. Why This Framing Works for Generalists  
  - **Puzzle**: "If conventions need repetition, why do one-off groups coordinate *exactly like* long-term ones?"  
  - **Stakes**: Challenges theories used to explain everything from traffic norms to constitutional conventions.  
  - **Hook**: Terminal cases are critical junctures (e.g., peace treaties; corporate dissolution). Getting coordination wrong here has real costs.  

  ---
  **Final Note:** This proposal *embraces* your fear of "taxonomy in search of an argument" by making dimension independence the first test. If it collapses, you’ve answered a smaller question quickly. If it holds, the taxonomy becomes a tool to pressure-test theories. Either outcome is fundable within 4 months.
