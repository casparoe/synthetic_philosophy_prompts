  Their tentative principle has five conditions (plan-like states, interdependence, mutual awareness, common knowledge, robustness to dissent). But as they suspect, it fails for the orchestra (common knowledge requirement) and military case (interdependence requirement). The DAO case remains unexplained under their framework.

  I need to develop candidate principles that can handle these cases. I'll brainstorm four approaches: Bratman-style planning theory (emphasizing interdependence), Gilbert-style joint commitment (requiring mutual obligations), Tuomela's we-mode (focusing on group reason adoption), and a new functionalist-authorization hybrid that might better handle the DAO case.

  The key challenge is reconciling cases 5 (military), 6 (developer), and 7 (DAO). All involve executing sub-plans from a central source, but they rule differently. The military and DAO get "yes" while the developer gets "no" - suggesting authorization chains matter more than direct interdependence.

  For the household case, most theories would say "yes" because of the mutual reliance and responsiveness, even without explicit agreement. If they stopped covering for each other while expecting coverage, it might become "no."

  After testing principles against all cases, the functionalist-authorization hybrid performs best, requiring: (1) collectively accepted decision procedure, (2) token-level authorization chain, (3) action attribution to the procedure's output, and (4) no defeat by mere dissent. This handles the military/DAO distinction via the authorization chain requirement.

  This principle only clearly fails for case 9 (raters), where we might need to accept that "the raters sent the email" is false, which seems correct. For case 3 (orchestra), I'd need to slightly adjust by allowing distributed procedures - the conductor serves as the decision procedure.

  The user should be aware of two verbal disputes: whether "acting together" requires symmetric contributions (their household case), and whether authorization chains create genuine group action or just useful fictions (the eliminativist concern). For their practical purposes, the functionalist view is likely sufficient.

  I'll present this analysis with clear case-by-case applications, minimal repairs to their original principle, and honest assessment of where intuitions might need adjustment. The key insight is that institutional decision procedures create group agency when properly authorized, regardless of individual awareness or motives.
answer: |-
  Here is a precise, case-tested principle for group action attribution, built from your intuitions and repaired where they clash. After brainstorming candidates, I'll state the final principle, apply it to all cases (including your household), identify its failures, and note verbal disputes.

  **Brainstormed Candidates:**
  1. *Bratman-Style Interdependence:* Token-level intentions by each that "we J" (where J is the joint action), with interlocking sub-plans and mutual responsiveness. *Problem:* Overkills cases 5 (soldiers lack "we-intentions") and 3 (musicians may lack mutual responsiveness).
  2. *Gilbert-Style Joint Commitment:* Mutual agreement creating obligations to act as a body. *Problem:* Underkills cases 4 (dissenters remain obligated) and 5 (no mutual agreement in hierarchy).
  3. *Tuomela We-Mode:* Acting for a group reason, with collective acceptance of a goal as "ours." *Problem:* Overkills case 6 (developer acts for group reason) and underkills case 8 (buyers share a reason: "get console").
  4. **Functionalist-Authorization Hybrid (New):** A group G genuinely A's iff:  
     (i) There is a collectively accepted procedure P (formal or informal) that outputs decisions/actions attributed to G;  
     (ii) Participants' inputs to P are *authorized* (explicitly or contextually) as contributions to G's agency;  
     (iii) A is produced by P's operation;  
     (iv) Defeaters (coercion, fraud) don't void authorization.  
     *Steelman:* This handles hierarchies (5), DAOs (7), and dissent (4) by decoupling agency from individual attitudes, focusing on institutional role-filling. But does it overkill case 9?

  **Final Principle (Repaired Functionalist-Authorization):**  
  A group G genuinely performs action A iff:  
  **(1) Procedure Condition:** There is an operational decision procedure P (rule, practice, or structure) that is *collectively accepted* (explicitly or by default participation) as speaking/acting for G.  
  **(2) Authorization Condition:** The inputs to P (votes, orders, labor) are given under conditions that *authorize* their use by P to determine G's actions (e.g., role occupancy, token-holder status, or contextual commitment).  
  **(3) Output Condition:** A is directly produced by P's output (not merely a side effect).  
  **(4) No-Defeater Condition:** Authorization isn't voided by coercion, fraud, or fundamental misunderstanding of P.  

  **Repairs to Your Principle:**  
  - Removed "plan-like states" → replaced with **Procedure Condition** (saves cases 3,5,7).  
  - Removed "takes others to be similarly disposed" → replaced with **Authorization Condition** (saves case 5: soldiers authorize orders; kills case 6: developer lacks authorization).  
  - Removed "common knowledge" → kept only in weak "collective acceptance" (saves case 3: orchestra accepts conductor).  
  - Kept robustness to dissent → **No-Defeater Condition** (saves case 4).  
  - Discarded "sub-plans mesh" → irrelevant if procedure defines roles (saves case 5).  

  ---

  **Case-by-Case Application:**  
  1. **Strangers pushing car:**  
     - ❌ (1): No procedure accepted as acting for a group.  
     - *Clause:* (1) fails.  
  2. **Painting house:**  
     - ✅ (1): Informal P (agreed division of labor). (2) Mutual authorization via agreement. (3) Painting is P's output.  
  3. **Orchestra:**  
     - ✅ (1): Conductor/score is P. (2) Players authorize P by joining. (3) Symphony is output.  
  4. **Dissent engineer:**  
     - ✅ (2): Authorization via team membership. (4) Dissent ≠ defeat.  
  5. **Battalion takes hill:**  
     - ✅ (1): Chain of command is P. (2) Soldiers authorize P by enlistment. (3) Hill-taking is P's output.  
  6. **Lone developer:**  
     - ❌ (2): She acts *toward* G but isn’t authorized to contribute to P (roadmap isn’t an *input mechanism*).  
  7. **DAO funds proposal:**  
     - ✅ (1): On-chain voting is P. (2) Token-holders authorize inputs via ownership. (3) Treasury move is P's output.  
  8. **Console shortage:**  
     - ❌ (1): No P aggregating buys into a group action. Outcome is side effect.  
  9. **Raters tune AI:**  
     - ❌ (2): Ratings are *data*, not authorized inputs to a procedure that speaks for raters. (Raters aren’t a G with a P).  
  10. **Your household:**  
      - ✅ (1): Default P (mutual reliance pattern). (2) Authorization via ongoing participation. (3) Household maintenance is output.  
      - *To make it "no":* If one stops covering/planning around the other *while still expecting coverage*, defeating collective acceptance (1).  

  **New Test Cases:**  
  A. *Citizen Assembly:* 100 strangers randomly selected, given binding authority on policy, deliberate, vote.  
     - ✅ (1) Empowered P. (2) Authorization by selection. (3) Policy is output.  
  B. *Viral Challenge:* Millions post dance videos with #OneMove. Organizers declare "we performed together."  
     - ❌ (1): No P aggregating posts into group action. (Output is hashtag trend, not dance).  

  **Failures and Tradeoffs:**  
  - **Case 3 (Orchestra):** Your principle’s (d) "common knowledge" would kill it. I removed it entirely. Minimal repair: Allow distributed procedures (conductor *is* the common focal point).  
  - **Case 9 (Raters):** Principle says "no," matching your verdict. But if raters *were* told "your ratings define the company’s voice," (2) might hold. Verdict stands.  
  - **Case 7 (DAO):** Your (b) "takes others to be disposed" fails. My repair replaces it with structural authorization.  

  **Where You Must Concede:**  
  - **Case 6 (Developer) vs. Case 5 (Soldiers):** Your intuition is correct, but the difference is *authorization*, not just sub-plans. If the company had a "contributor agreement" making roadmap-followers authorized agents, (2) would hold and verdict flips to *yes*.  
  - **Case 8 (Console buyers):** If buyers unionized and voted a coordinated purchase (creating a P), it becomes "yes." Your "gut" tracks this absence.  

  **Verbal Disputes Flagged:**  
  - **"The DAO funded it" (7):** Eliminativists say this is shorthand for "token-holders voted and code executed." No practical difference *if* liability attaches to the DAO’s treasury (which my principle justifies).  
  - **Household "we" (10):** Skeptics might call it "interlocking plans." But if you assign *credit/blame to the household* (e.g., "we hosted Thanksgiving"), the attribution is real and your principle captures it.  

  **Conclusion:** The functionalist-authorization principle holds for all your cases except where you misdiagnosed the repair (3,5). It delivers usable verdicts for institutional design: **Group action requires an accepted procedure whose authorized inputs yield outputs attributable to the group, absent coercion/fraud.** For AI governance, this lets you call DAOs "agents" (7) but not rater pools (9), and clarifies that roadmaps alone don’t authorize developers (6). Keep your verdicts; they’re sound. The cost is accepting that agency emerges from structure, not shared mental states.  

  ---  
  **Final Principle Text for Your Use:**  
  *Institutional Attribution Principle:* A group G performs action A iff: (1) G has a collectively accepted procedure P (formal or default) that determines actions for G; (2) Inputs to P are given with contextual authorization to speak/act for G; (3) A is a direct output of P; (4) No coercion/fraud voids (2).
