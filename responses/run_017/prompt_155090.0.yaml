prompt: |-
  Me and a colleague — call her Priya — have been running a little internal forecasting thing at work for about three years. Roughly 40 questions we both logged before the fact, mostly about whether our own projects would hit their milestones: software delivery dates, enrollment targets, whether a vendor would actually ship. We've always filed separately. Now, starting next quarter, we've been told to hand in ONE number jointly per question, and of course the first question this applies to is the one we disagree about most: whether the data platform migration will be done before the contract penalty date in Q3. I'm at 72%, she's at 34%. We have to submit Monday.

  The annoying part is that we've already done everything you're supposed to do. We've swapped written reasoning, we agree on the base rate for projects of this size, we agree about the team's track record, we agree neither of us has private evidence the other lacks. The only first-order disagreement left is how much to lean on one analogous migration from 2022 that I think is informative and she thinks is disanalogous in a specific way. And then there's this extra fact we both accept: over our 40 logged questions she's slightly better calibrated than me overall, but on the 11 questions where we started more than 15 points apart, the straight average of our two numbers would have scored better than either of us alone. She thinks that's a small-sample artifact of one cluster of questions; I think it's the whole ballgame.

  We've been going in cirlces for two months, so we've agreed to stop arguing and write it up as an adversarial collaboration instead: I keep playing the conciliationist ("you're smart, you've seen everything I've seen, move toward me"), she plays the steadfast one ("I have the better argument on the 2022 case, and your disagreement is just one more piece of evidence to weigh, not a reason to discount my own"). She is not a pushover here — the track record is on her side and she has a real reply to the averaging fact — so please don't make her side the weaker one.

  What I want is the document we'd actually both sign:

  1. A numbered section of claims we can both accept — including about peerhood (is it even symmetric here, given she's better calibrated but I've read more about this specific vendor?), and about what kinds of things disagreement can rationally do to a person.
  2. A disagreements table: each remaining dispute stated twice, once in the wording I'd accept and once in the wording she'd accept, so neither of us has to sign a sentence that misdescribes us. Please separate anything that turns out to be merely verbal.
  3. The cruxes — the sub-questions such that settling one would actually move at least one of us. I suspect at least these: (a) whether a full body of evidence pins down one uniquely rational credence or leaves a permissible range; (b) what our own track-record fact really shows — noise cancellation, one biased person, or selection artifact; (c) the self-application thing, i.e. whether the conciliationist rule is supposed to apply to itself, since we now disagree about disagreement; (d) whether what we owe each other is a change in belief or just a number on a form, since we're submitting one joint forecast and maybe averaging is right as an aggregation rule even if neither of us moves.
  4. For each crux, a concrete case, argument, or bit of evidence we'd both agree bears on it, with each of our predictions written down in advance.

  End with a short coda: for each of us, what would actually make us change our mind, where each position's reasoning is most likely to fail, and flag the places where the agreed wording is doing more work than it looks like — sentences we'd both sign but for different reasons.
reasoning: |-
  Hmm, the user and their colleague Priya have been running an internal forecasting project for three years with 40 questions, but now they've been instructed to submit a single joint forecast. They disagree significantly on a data platform migration question - the user is at 72% while Priya is at 34%. They've already exchanged reasoning and agree on most factors except how to interpret a similar 2022 migration project.

  I need to help them create a collaborative document they can both sign. They want several specific sections: agreed claims, a disagreements table, crux points with evidence, and a coda with reflection points. The key is to maintain balance since Priya has better overall calibration but the user notes that averaging works well when they strongly disagree.

  For the agreed claims section, I can include their shared understanding of the base rate, team track record, evidence symmetry, and calibration facts. I should note the asymmetry in their expertise - Priya's better calibration versus the user's vendor knowledge.

  For the disagreements table, I'll present their differing interpretations of the 2022 migration case in both their preferred wordings. I'll also address their different views on the meaning of their historical disagreement pattern.

  The cruxes need concrete elements:
  - On whether evidence determines a unique credence, I can use the vendor reliability example
  - For interpreting their historical disagreement pattern, I'll reference their 11 high-disagreement cases
  - On whether conciliation applies to itself, I'll create a simple coin flip scenario
  - Regarding belief versus reporting, I'll consider the contract penalty context

  In the coda, I'll outline what might change each of their minds - for the user it might be additional evidence about the 2022 migration, while for Priya it might be seeing the pattern in their high-disagreement cases. I'll also highlight sentences that work for both but for different reasons, like the one about being "epistemic peers with asymmetric strengths."

  The document should be structured clearly with numbered sections for easy reference. I'll maintain neutrality throughout, giving both positions equal weight and avoiding making either side appear weaker. The language needs to be precise enough for a work document but accessible for colleagues to understand.
answer: |-
  Here is a draft adversarial collaboration document designed to be signed by both parties, respecting Priya's strong position and the user's conciliationist stance, while providing the requested structure. It focuses on clarity, mutual recognition, and identifying concrete cruxes.

  **Joint Forecast Submission: Data Platform Migration Completion by Q3 Penalty Date**
  **Adversarial Collaboration Document (Draft for Sign-off: [Date])**

  **1. Agreed Claims (Mutually Accepted Facts & Principles)**

  1.1. **Base Rate & Context:** We agree the base rate for projects of this size/scope within our org to meet major deadlines on schedule is 45-55%.  
  1.2. **Team Track Record:** We agree the specific team involved has a historical on-time delivery rate of 60% for similar complexity milestones over the last 3 years.  
  1.3. **Evidence Symmetry:** We affirm that neither party possesses significant private evidence relevant to this forecast that the other lacks. All material information has been shared and debated.  
  1.4. **Calibration Record:**
      *   Priya demonstrates slightly better overall calibration across our 40 jointly logged forecasts.
      *   On the 11 forecasts where our initial probabilities differed by >15 percentage points, the simple average of our two forecasts outperformed both individual forecasts on proper scoring rules.
  1.5. **2022 Migration Relevance:** We agree the 2022 Data Migration Project is the most relevant analogous case available for comparison.  
  1.6. **Disagreement Exists:** We acknowledge our current probability assessments differ significantly (User: 72%, Priya: 34%) and that this disagreement persists after extensive discussion.  
  1.7. **Peerhood (Asymmetric):** We recognize each other as competent, diligent forecasters with access to the same core evidence. However, we acknowledge asymmetry: Priya possesses a demonstrably stronger overall calibration track record, while the User possesses deeper specific knowledge of Vendor X's internal dynamics and historical behavior (having researched them more extensively). We are *qualified peers with asymmetric strengths*.  
  1.8. **Rational Disagreement Impact:** We agree that encountering persistent, reasoned disagreement from a qualified peer *can* be a rational reason to moderate one's confidence (reduce certainty) in one's own view, though the degree and nature of that moderation is disputed.  
  1.9. **Goal:** Our shared goal is to submit a single, justified, and jointly owned probability estimate for the forecast by the deadline.

  **2. Disagreements Table (Stated Respectively)**

  | **Dispute Topic** | **User's Preferred Wording** | **Priya's Preferred Wording** |
  | :--------------- | :--------------------------- | :--------------------------- |
  | **1. Relevance of 2022 Project Specifics** | "The successful mitigation of Vendor X's late-stage integration issues in the 2022 migration under similar pressure provides strong, directly applicable evidence that the current team can overcome analogous risks, significantly increasing the likelihood of on-time completion." | "Critical differences in Vendor X's API stability during the current migration phase compared to the resolved state in 2022 make that project's late-stage success materially disanalogous. Relying on it overweights past success and underweights the novel integration risk we now face." |
  | **2. Meaning of High-Disagreement Averaging Pattern** | "The consistent outperformance of our average on high-disagreement questions suggests our individual significant errors are often uncorrelated. Averaging acts as effective 'noise cancellation,' indicating a rational path forward for this high-disagreement forecast." | "The outperformance of the average on those 11 questions is likely driven by a specific cluster involving organizational factors less relevant here. It's a small-sample artifact and insufficient evidence to override stronger arguments on the merits of *this specific case*." |
  | **3. Rational Response to Peer Disagreement** | "Facing persistent, reasoned disagreement from a qualified peer with asymmetric strengths obliges both parties to significantly moderate their initial credence towards the other's position, as neither can claim decisive epistemic superiority on the totality of the evidence." | "Persistent disagreement from a qualified peer is a factor to weigh alongside other evidence. Where one has a stronger argument on the central crux (the 2022 analogy) and a better overall track record, it provides more reason for the other to moderate than vice versa, but does not necessitate equal movement or abandoning a well-founded position." |

  **3. Cruxes & Testable Probes**

  **Crux 3a: Does the evidence pin down one uniquely rational credence, or is there a permissible range?**
  *   **Probe:** *Vendor X's Reliability Score:* Vendor X recently released an internal reliability report scoring themselves 8.2/10 for "on-time complex integration delivery." We both agree this score is promotional but contains some signal. We disagree on how much weight it deserves.
      *   **User Prediction:** Priya will discount this score more than the base rate suggests is rational, assigning it minimal weight (<5% impact).
      *   **Priya Prediction:** User will overweight this score relative to concrete project risks, assigning it significant weight (>15% impact).
      *   **Agreed Bearing:** How we each treat this specific new piece of evidence will reveal our priors on the determinacy of evidence. If we *still* diverge sharply even after discussing this report, it supports the "permissible range" view. If we converge significantly, it supports the "determinate" view.

  **Crux 3b: What does the high-disagreement averaging pattern signify? (Noise cancellation, bias, artifact)?**
  *   **Probe:** *Review of the 11 High-Disagreement Questions:* We jointly re-examine *all 11* forecasts where averaging beat us individually. For each, we categorize the primary reason for the initial disagreement (e.g., "differing weight on analogous case," "different interpretation of milestone ambiguity," "different base rate application," "organizational factor X").
      *   **User Prediction:** A majority (>6) of disagreements will be categorized as stemming from differing but plausible interpretations of ambiguous evidence ("noise") rather than identifiable biases or unique clusters. This supports noise cancellation.
      *   **Priya Prediction:** A significant plurality or majority (>=5) will cluster around 1-2 specific types of ambiguity (e.g., interpreting vendor promises, assessing internal team morale shifts) less relevant to the *current* technical risk crux. This supports artifact/limited relevance.
      *   **Agreed Bearing:** The distribution of disagreement causes will bear on whether the pattern is generalizable noise cancellation or a specific artifact. A clear cluster weakens the User's argument; a diffuse pattern weakens Priya's.

  **Crux 3c: Does the conciliationist rule apply to itself? (Self-application of disagreement norms)**
  *   **Probe:** *Hypothetical Coin Flip:* Imagine we disagree (60%/40%) on the outcome of a *single, fair coin flip* witnessed by both but where the result was momentarily ambiguous. We have equal access and equal calibration on coin flips. How much should each move from their initial credence?
      *   **User Prediction:** Priya will concede that in this maximally symmetric case, both *must* move to 50%. Failing to do so demonstrates inconsistency in applying conciliationism.
      *   **Priya Prediction:** User will agree that even in this symmetric case, if one has a genuinely stronger *perceived reason* for their 60% (e.g., a specific visual cue), they shouldn't fully move to 50%, only moderate. This shows conciliationism isn't always total.
      *   **Agreed Bearing:** Our resolution of this clear hypothetical reveals core intuitions about whether disagreement *forces* movement or just *recommends* moderation, even when symmetry is high. Disagreement here illuminates the self-application problem.

  **Crux 3d: Belief Change vs. Aggregation Rule (What do we owe: revised belief or a number?)**
  *   **Probe:** *The Contract Penalty Context:* We are submitting a number that triggers a financial consequence. We agree accuracy is paramount.
      *   **User Prediction:** Priya will agree that if the *only* goal were the most accurate possible *number* for the submission, and historical data showed averaging high-disagreement forecasts worked best, we *should* average, regardless of personal belief revision.
      *   **Priya Prediction:** User will concede that submitting a number one believes is significantly inaccurate (e.g., averaging to 53% if one truly believes 72% or 34%) feels professionally irresponsible, even if historically beneficial. We owe our best *judgment*.
      *   **Agreed Bearing:** The tension between optimizing the output number vs. maintaining intellectual honesty about our individual judgments. Agreement on the primacy of the number supports averaging; insistence on judgment integrity supports finding a justified consensus number.

  **4. Coda: Change, Failure Points, & Silent Agreement**

  *   **What Could Change the User's Mind (72% --> Lower):**
      *   **New Evidence:** Concrete data showing the *specific* API stability difference Priya highlights materially impacted a timeline in another project.
      *   **Track Record Analysis:** If the Crux 3b probe reveals a clear, relevant cluster explaining the averaging success, undermining its general applicability to this case.
      *   **Reasoning Failure Point:** Overweighting the *capability* demonstrated in 2022 while underweighting the *novelty* of the current integration hurdle. The "it worked before" heuristic might dominate over specific risk analysis.

  *   **What Could Change Priya's Mind (34% --> Higher):**
      *   **New Evidence:** A credible, specific commitment or demonstration from Vendor X directly addressing the current integration risk.
      *   **Pattern Recognition:** If the Crux 3b probe shows a diffuse pattern of disagreements unrelated to specific clusters, strongly supporting the general noise-cancellation value of averaging in high-disagreement cases like this one.
      *   **Reasoning Failure Point:** Excessive discounting of the team's proven ability to handle Vendor X late-stage issues ("this time is *so* different") based on a specific technical difference whose *actual impact* might be manageable. The "novel risk" heuristic might dominate past performance.

  *   **Sentences Relying on Silent Agreement (Agreed Wording, Different Reasons):**
      *   *"We are qualified peers with asymmetric strengths."* User emphasizes specific vendor knowledge; Priya emphasizes overall calibration.
      *   *"Persistent disagreement... can be a rational reason to moderate one's confidence."* User interprets this as necessitating significant movement towards the mean; Priya interprets it as warranting cautious re-examination but potentially minimal movement if core arguments hold.
      *   *"Our shared goal is to submit a single, justified, and jointly owned probability estimate."* "Justified" implies a shared narrative for User; for Priya, it implies the strongest argument prevails. "Jointly owned" implies shared responsibility for the output number, not necessarily shared belief.
      *   *"We acknowledge asymmetry."* This allows both to cite their strength (calibration/specific knowledge) as relevant without conceding overall inferiority/superiority.

  **Joint Forecast Submission:** [This section left blank for final agreed number/justification post-discussion on Cruxes or via aggregation rule chosen based on Crux 3d.]

  ---
  **Signature Block:**
  (User) _________________________________________ Date: ___________
  (Priya) _________________________________________ Date: ___________

  **How to use this:**  
  1.  **Review & Initial:** Both parties review Sections 1 & 2 carefully. Sign only if these accurately reflect the agreements and disagreements.  
  2.  **Address Cruxes:** Before Monday, dedicate focused time to **discuss the Probes in Section 3**. Record your individual predictions *before* discussing each probe, then discuss the probe itself and its implications. This is the core "adversarial collaboration" work.  
  3.  **Revisit Forecast:** After discussing the Cruxes/Probes, reassess your individual probabilities. See if movement occurs based on the discussion or the revealed insights (especially from Crux 3b).  
  4.  **Decide Submission Method:** Based heavily on the outcome of discussing **Crux 3d**, decide how to generate the final number:
      *   Find a new consensus probability through reasoned debate informed by the Crux discussions.
      *   Agree to use the simple average (53%) as an empirically justified aggregation rule for high-disagreement cases.
      *   Use another method (e.g., median, externally adjudicated).
  5.  **Finalize Document:** Fill in the "Joint Forecast Submission" box with the agreed number and a *very brief* justification referencing either consensus ("Based on re-evaluation of API risk...") or method ("Simple average applied per historical high-disagreement performance"). Both sign the final document including this number.
