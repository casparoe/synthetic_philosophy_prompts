answer: |-
  ### The Lockstep Puzzle

  **System**: A string rewriting system with symbols `A`, `(`, and `)`.  
  **Initial state**: `A`  
  **Target state**: `A()`  
  **Rules**:  
  1. **Double**: Replace any `A` with `AA`.  
  2. **Wrap**: Replace any `A` with `(A)`.  
  3. **Delete**: Replace any occurrence of `()` with `A`.  

  **Why it fits your specifications**:  
  - **Unreachable target**: The target `A()` contains an empty pair `()`, but no rule creates `()` directly. The invariant is the **count of empty pairs `()`**, which is always 0 (initial state: 0; Double: no change; Wrap: creates `(A)` not `()`; Delete: removes `()` but requires one to exist, which never occurs). The target has one `()`, so it’s unreachable.  
  - **Near miss**: `A(A)` is reachable (e.g., start: `A` → Double: `AA` → Wrap second `A`: `A(A)`). It differs from `A()` only by the `A` inside the parentheses, encouraging the player.  
  - **No in-system proof**: Rules manipulate symbols but don’t define "empty pairs" or count them. Players see only strings and rule applications; unreachability isn’t statable within the system.  
  - **External proof**: The invariant (count of `()` is 0) is preserved by every rule (verifiable by checking each rule’s effect on substrings). Since the target requires count=1, it’s impossible. A reader can trace this in half a page.  
  - **Forced exit**: Once the invariant is recognized, further play is provably futile—no sequence can create `()`.  

  ### Three Verdicts on the Jump  
  1. **Reasoning as rule-following (internal view)**: The character cannot know she’s stuck. Rules only allow generating strings (e.g., `(A)`, `A(A)`, `AA`), and the near miss `A(A)` suggests progress. Without the concept of "empty pairs," she sees no barrier; the puzzle remains "hard but possible."  
     *Why it follows*: The system’s rules lack vocabulary for invariants; knowledge is limited to observed states.  
  2. **Reasoning about the system (external view)**: She escapes by naming the invariant (count of `()` is 0) and proving preservation. This proves unreachability, forcing exit. No derivation within the system could achieve this.  
     *Why it follows*: The invariant is derivable from rule effects (e.g., Wrap always produces `(A)`, never `()`), making the proof independent of play.  
  3. **Carroll’s regress (meta view)**: The jump fails; invoking the invariant uses "unlicensed" reasoning (e.g., counting substrings isn’t a rule). This is just a larger system (e.g., "meta-rules" for invariants), so she hasn’t escaped—only shifted contexts.  
     *Why it follows*: The preservation argument relies on external concepts (e.g., substring counts), not deducible from the rules alone.  

  ### Design Analysis  
  - **Key feature**: The **absence of a rule creating `()`** does the work. Without this, the invariant fails (e.g., adding "Replace `A` with `()`" makes `A()` reachable).  
  - **Attacks**:  
    - *First position defender*: "The character can’t count `()`—it’s not in the rules. She only sees symbols; the invariant is imported from outside."  
    - *Third position defender*: "Counting `()` is a meta-rule. You’ve expanded the system, not escaped it."  
  - **Stipulation vs. derivation**: Unreachability is derived—the invariant follows from rule applications (e.g., Wrap’s output `(A)` contains no `()`). Nothing is assumed.  

  ### For Your Novel  
  - **Name**: **The Lockstep Puzzle** (suggesting rigid, incremental moves).  
  - **Final sentence**: **"The emptiness she needed couldn’t be made, and never could have been."** (Captures the revelation—target’s flaw is structural, not her failure.)  

  This system satisfies your constraints: minimal rules, no randomness, near miss, and an invariant requiring no jargon. The scene’s tension arises from the gap between internal frustration and external inevitability.
