  Based on the researcher's prior verdicts, her implicit rule for when a preference can be recovered from behavior appears to be:  
  **"A preference can be inferred only if the behavior is *instrumentally rational* under the agent's *correct causal model* of the environment. The agent must have accurate beliefs about how their actions achieve outcomes, and the behavior must directly serve a stable goal (preference) rather than being driven by external constraints, false beliefs, or coercion."**

  ### Breakdown of the Rule:
  1. **Instrumental Rationality**: Behavior must be a means to achieve a goal (e.g., rat pressing a lever for food).  
  2. **Accurate Beliefs**: The agent must correctly understand the causal link between action and outcome (e.g., rejecting the long-road driver because of false beliefs).  
  3. **Goal-Driven, Not Constrained**: Behavior reflects intrinsic preferences, not external forces (e.g., crowdworkers' sloppy work is payment-driven, not a preference for low standards).  
  4. **Context-Specificity**: Preferences are tied to the immediate environment (e.g., shoppers' thriftiness applies only to the shelf, not universally).  
  5. **Behavior Over Self-Reports**: Actions trump stated preferences if they conflict (e.g., rewatching a show overrides a 2-star rating).  

  ### Verdict on Your Video App Case:
  **NO, a preference has *not* been recovered for "less of that category in the feed."**  
  - **Why?** The users' behavior (thumbs-down + watching to completion) is driven by a **false belief** about how the ranking algorithm works (they think thumbs-down cleans their feed, but watch time dominates). Since their causal model is inaccurate, the behavior is not instrumentally rational for their stated goal. The researcher would classify this as akin to the "long-road driver" (false belief invalidates preference inference) and "cookie banner" (coercive design distorts true preferences).  
  - **What *can* be inferred?**  
    - The thumbs-down might reveal a *context-specific dislike* for individual items (like the shoppers' olive oil choice), but only if the ratings are decoupled from the false feed-cleaning goal.  
    - The watch-time behavior is unreliable—it could signal enjoyment, obligation, or habit, but it’s confounded by the users’ misconception.  

  ### Rival Rule That Fits Prior Cases but Conflicts on Yours:  
  **"A preference can be inferred if the behavior maximizes an agent’s *subjective expected utility* (regardless of belief accuracy)."**  
  - **Fits Prior Cases**:  
    - Thermostat: No utility maximization → no preference.  
    - Rat: Maximizes food reward → preference.  
    - Crowdworkers: Maximizes payment → no *inherent* preference for sloppy work.  
    - Late-braking driver: Multiple utilities (speed/risk) fit → equivalence class.  
    - Shoppers: Maximizes thriftiness *on that shelf* → context-specific preference.  
    - Long-road driver: Maximizes getting home *given false belief* → preference for efficient routing would be inferred (but the researcher rejected this).  
    - Cookie banner: Dark patterns distort utility → no true preference inferred.  
    - Rewatcher: Enjoyment utility > rating → preference for the show.  
  - **Verdict on Your Case**: **YES, a preference for "feed cleanliness" is recovered** (since users *believe* their actions achieve this goal, regardless of accuracy).  

  ### Single App Change to Tease the Two Rules Apart:  
  **Modify the ranking algorithm to make thumbs-down *immediately and visibly* reduce the target category in the feed for a test group (while control groups experience the original/watch-time-dominated system).**  

  - **How This Tests the Rules**:  
    - **Researcher’s Rule (Requires Accurate Beliefs)**:  
      - If users’ beliefs are corrected (thumbs-down now *works*), their behavior becomes instrumentally rational. Preference for "less of the category" can be inferred *only in the test group*.  
      - Control group behavior (driven by false beliefs) still reveals no preference.  
    - **Rival Rule (Subjective Utility)**:  
      - Both groups reveal a preference for feed cleanliness, as their behavior maximizes expected utility *given their current beliefs*.  
      - The test group’s preference is stronger/more consistent (since actions now align with outcomes).  
  - **Expected Outcome**:  
    - Test group: Thumbs-down rates increase, watch time decreases (rational cleanup).  
    - Control group: Behavior persists unchanged (futile cleanup).  
    - Researcher’s rule is supported if preference correlates with *accurate causal knowledge*. Rival rule is supported if preference strength is similar across groups.  

  ### Key Follow-Up Question for the Researcher:  
  *"You rejected preference inference in the video app case due to false beliefs, but the rat’s changing reward (case 2) and equivalence classes (case 4) suggest preferences can be fluid or ambiguous. Why is 'false belief' uniquely disqualifying when other forms of partial/ambiguous agency are not?"*  
  This probes her boundary between "noisy preferences" (rat) or "multiple rationalizations" (driver) versus "epistemic failure" (video app), forcing her to clarify how belief accuracy gates preference recovery.
