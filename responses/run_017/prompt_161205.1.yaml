answer: |-
  ## Villanelle: At the Converted Station

  The bookshelves climb where timetables were pinned.  
  New readers settle where the porters stood.  
  *What is this for?* The question drills the wind.  

  This vaulted ceiling, ironwork unthinned,  
  Holds silence now instead of steam and wood.  
  The bookshelves climb where timetables were pinned.  

  See here, the niche that once held tickets in?  
  A reading nook – a purpose understood.  
  *What is this for?* The question drills the wind.  

  But scan the arch above, the curves rescind  
  To angles forced by structure, hard and good:  
  *Just where two pressures meet*, a space defined,  
  Not carved for show, nor failure misconstrued.  
  *What is this for?* The question drills the wind.  

  That patterned stone, the spandrel's awkward friend?  
  No vault intended *that* specific hood.  
  The bookshelves climb where timetables were pinned.  

  And yet... that high dome's hollow, unforeseen,  
  Now bears the weight of quiet, like a brood  
  Of sound absorbed – a function unforeseen,  
  A load assumed where emptiness once stood.  
  The bookshelves climb where timetables were pinned.  
  *What is this for?* The question drills the wind.  
  *Just where two pressures meet*, a space defined.  

  ---

  ## Notes on the choices

  1.  **Refrains Mapping:**  
      *   **A1 ("What is this for?")** embodies the adaptationist program's core heuristic: isolating a trait and demanding its *current* functional rationale. Its brevity and repetition capture the methodological drive to atomize and assign utility.  
      *   **A2 ("Just where two pressures meet")** captures the structuralist/anatomist's perspective: some features arise predictably from developmental or architectural constraints, answering "how it came to be" rather than "what it does now." Its descriptive flatness contrasts with A1's demand.

  2.  **Building Features & Classification:**  
      The setting is a train station converted into a library.  
      *   **Built for current use:** "The bookshelves climb where timetables were pinned." Explicitly new function in old location.  
      *   **Co-opted (Original Purpose → New Purpose):** "See here, the niche that once held tickets in? / A reading nook." A feature repurposed (ticket niche → reading nook), showing utility derived *after* origin.  
      *   **Purely Residual (Constraint-Derived Byproduct):** "That patterned stone, the spandrel's awkward friend? / No vault intended *that* specific hood." The spandrel (the triangular space between arches) is named purely as the architectural element itself, arising unavoidably where the arch meets the supporting wall/beam – a byproduct of meeting constraints, initially without function.  

  3.  **The Fourth Case (Load-Bearing Leftover):**  
      "And yet... that high dome's hollow, unforeseen, / Now bears the weight of quiet..." The *resonant acoustic property* of the vaulted structure – originally a byproduct of the architectural constraints needed to span the station (just "where two pressures meet") – becomes indispensable in the library for absorbing sound ("a load assumed where emptiness once stood"). This fulfills the A1 demand ("What is this for?" - absorbing sound) *now*, but its origin remains non-adaptive (answering A2). The final quatrain shows the refrains applying to the *same* feature (the vault's resonance) to answer distinct questions: current utility vs. generative origin.  

  4.  **Nuances Preserved:**  
      A1 is a valid question (current utility exists). A2 explains origins without implying uselessness (the space is "defined"). The critique targets method ("splitting the whole" implied by A1's isolation) – the poem doesn't claim adaptationists deny byproducts (*they* might ask A1 about the spandrel too), nor that critics see traits as useless (the resonance *gains* use). The ending avoids Panglossianism: the spandrel remains awkward, the nook is co-opted; only the resonance becomes load-bearing, a specific fourth case.
