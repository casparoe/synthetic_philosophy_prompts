prompt: |-
  hey — I'm an IR PhD student, chapter 3 is on informal norms in war, and I need someone to stress-test a bit of Lewis's theory of convention against a case that I think it both obviously fits and obviously doesn't. Please answer in American English.

  Take the Christmas truce of December 1914 on the Western Front. Take these as the facts (they're the bits I care about, don't go hunting for more): along stretches of the line, mostly British and German, the shooting stopped without anyone ordering it; men came out of the trenches, met in no man's land, buried the dead from earlier fighting, swapped tobacco and buttons, and in a handful of places apparently kicked a ball around — I don't care whether the football actually happened, it does no work in my argument. It was local and patchy, some sectors did it and neighbouring ones didn't, and it tended to happen between units that had been sitting opposite each other for a while. Afterwards the high commands reacted hard: explicit orders against fraternisation, threats of disciplinary action, units shifted around, and it never happened at that scale again, though smaller local truces to collect wounded and bury dead kept ocuring.

  So: run Lewis's analysis of convention over it properly, and I mean properly, not "it's a coordination problem, both sides preferred not to die" — I can do that bit. Tell me who the agents are in the relevant population, because Lewis's definition quantifies over a population and it makes a real difference whether the agents here are individual soldiers, sections, or battalion-sized units facing each other. Give me the actual strategy set available (shoot to kill, shoot to miss, routine harassing fire at fixed times and known places, silence, sending out a burial party) and say what the payoff structure really is: is this a coordination problem in Lewis's sense at all, or is it something with a live temptation to defect, where each side would strictly prefer the outcome in which it alone cheats? I've been calling that a hostile coordination problem, and I want to know whether a Lewisian convention can get any grip on one, or whether the moment interests aren't fully aligned what you've got isn't a convention but something else — a truce, a bargain, a stand-off. Then: what the focal point is (Christmas itself? daylight? the standing burial parties?), what plays the role of common knowledge between people who can't talk to each other and share no language, and what work precedent does — does one day of it make the next day salient, and does one sector's truce make the next sector's more likely?

  Second half is the part I actually need. Roughly half of it should be where the mapping fails and what the case does to the theory rather than the other way round. I've been trying to seperate a soft convention — a regularity in behaviour held up by expectations about behaviour — from a hard norm, where people expect not just that you'll do the thing but that you'll be sanctioned, resented, thought a bastard if you don't. Which one is the truce, and if it needs the hard layer to survive, what does that say about a theory that builds conventions out of self-policing equilibria with no enforcement in them? And there's the awkward fact that it was killed from above: a third party showed up and changed the payoffs, which the framework has no machinery for at all. Score the case on three clocks I've been using — how fast a convention can arise, how wide it can spread, how easily a hierarchy can kill it — and tell me whether the truce is a confirmation of Lewis, an anomaly, or a kind of case the theory never anticipated: conventions between people whose whole job is to kill each other.

  Where the theory is silent, say it's silent rather than making it talk. No citations, no suggested reading, I've got all that. And if any step of your analysis depends on some detail of the history that's genuinely contested, flag which step and which way it'd have to go.
