              first row = first row / (first row + second row)

          which implies that either first row=0 or second row=0? So again, unless there is no second row (i.e., when A is true, B must always be true?).

          Therefore, this doesn't work.

          However, note: we might redefine the probability of the conditional to be the probability that it is TRUE given that it is defined? That is, we condition on A being true. But then:

              P(C=TRUE | A) = P(C=TRUE | A)   [because when A is true, C is either TRUE or FALSE]

          but we want P(C=TRUE) = P(B|A). And P(C=TRUE) = P(C=TRUE and A) because when A is false, C is NULL and not TRUE. So:

              P(C=TRUE) = P(A and B)   [since when A is true and B is true, C is true]

          and P(B|A) = P(A and B)/P(A). So unless P(A)=1, these are not equal.

          Therefore, the three-valued approach does not work.

     c. **The conditional is a function of (A, B, context) rather than of (A, B).**

          By context, we mean other columns. But then the conditional is not just a function of A and B. However, in the argument above, we assumed that the function f is only of A and B. If we allow f to depend on other columns, then we might hope to avoid the result.

          But note: the argument above considered a table that has at least three rows. We can have the same A and B values in multiple rows? Then we require that in two rows with the same A and B, the conditional C must be the same? Because it's a deterministic function of the state. So if we have two rows with (A=TRUE, B=TRUE) but different context, then we require that f(TRUE, TRUE, context1) and f(TRUE, TRUE, context2) must both be TRUE (because in the distribution that puts mass only on the first row, we require TRUE, and similarly for the second). So the value must be TRUE regardless of context. Similarly, for (TRUE, FALSE) it must be FALSE. And for (FALSE, ...), we run into the same problem: we need the value to be a constant? But then the same contradiction as above.

          Alternatively, if the context includes the entire row, then we are effectively allowing a different function per row? But then we are back to the row having a fixed value for C. And the argument above still applies: we can have three rows with distinct (A, B) combinations: (T,T), (T,F), (F,?). Then the same algebra applies.

          So this doesn't avoid the result.

     Therefore, the only way out that works is (a): the conditional is not a column but a query.

  3. **Residue Report**

     - **No-Go Result**: Translated cleanly. We see that no deterministic function f(A,B) can yield a column C such that P(C)=P(B|A) for all distributions unless the table is degenerate (at most two rows with positive probability).

     - **Standard Ways Out**:

          a. Conditional as a query: Translated cleanly. We avoid having a column and instead compute the conditional probability by filtering.

          b. Conditional as a third value: We tried but it did not work. It had to be distorted because we had to consider the probability of the conditional being TRUE, and that did not match the conditional probability. The philosophers' three-valued approaches (e.g., de Finetti) do not work in the way we tried. There are other three-valued systems (e.g., with truth value gaps) but they don't solve the probability equation.

          c. Conditional depending on context: We considered and it did not work. The argument still holds because for fixed (A,B) the conditional must be fixed (if it is a function of the state) and then we have the same constraints.

     - What had to be distorted? The original argument by Lewis is more general (about any probability space, not just finite tables). But the finite case captures the essence. Also, in the original, the conditional is considered as a proposition in the object language, and we are assigning probabilities. We translated probabilities as weighted frequencies.

     - What has no expression? The original argument uses the concept of a proposition being part of the same algebra of events. In our case, the table rows are the atomic events. We are limited to finite discrete distributions? But the result holds for continuous distributions too. However, the core combinatorial argument is the same.

  4. **Two Specific Issues**

     a. **Embedding**: 

          We cannot nest a filter (observe) inside another expression. For example, we cannot write:

              IF (IF A THEN B) THEN C

          as a single condition. In our data vocabulary, if conditionals are queries, they are not columns and cannot be embedded. If we try to make them columns, we run into the no-go result.

          The philosophers' problem is about more than composability. The no-go result shows that even without nesting, the very existence of the conditional as a proposition leads to triviality. So the asymmetry (that we cannot nest observes) is a symptom, but the problem is deeper: we cannot have the conditional as a value at all.

     b. **Intervention versus filter**:

          In probabilistic programming, we have two operations:

            - Filtering (conditioning): updating the model by the evidence (observe A=true) and reweighting the runs.
            - Intervention: running the model with A set to true (as if by an external force) and then see what happens to B.

          The conditional probability P(B|A) is defined by filtering (the probability of B given that we observe A). The philosophers are discussing the probability of the conditional, which is not an intervention.

          In the debate, they are both using the same notion of conditional probability (as filtering). The intervention is related to causal conditionals, which are different. The Lewis argument is about indicative conditionals, not subjunctive/causal. So the distinction is not doing work in the original triviality argument.

          However, note: one response to Lewis is to say that conditionals are not propositions but rather devices for making suppositions (like interventions). This is the Ramsey test: to evaluate "if A then B", you add A hypothetically (intervention) and see if B holds. But then the probability of the conditional is the probability you would assign to B after setting A. But this is not the same as P(B|A) in the presence of confounding. In causal models, P(B | do(A)) is different from P(B|A). However, the triviality argument does not rely on this distinction because it is about indicative conditionals.

          So in the debate we are translating, the distinction is not present. They are using P(B|A) as filtering.

  5. **Working Hypothesis Assessment**

          The working hypothesis: "the debate looks intractable only if your language forces conditionals to be expressions, and that a language in which conditioning is a primitive operation on models simply does not have the problem."

          This seems to hold. The no-go result shows that if we insist on the conditional being an expression (a column in the table, i.e., a proposition), then we get triviality. But if we treat the conditional as a primitive operation (a query that conditions the model) then we avoid having a proposition for it, and we can compute P(B|A) without representing the conditional as a value.

