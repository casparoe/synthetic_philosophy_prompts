          In the row where A is TRUE and B is FALSE: C=FALSE.
          In the row where A is FALSE: C=NULL.

          Then, the probability that C is TRUE is the probability of the first row (if we ignore NULLs?).

          And P(B|A) = P(A and B) / P(A) = (prob of first row) / (prob of first row + second row).

          But note: P(C=TRUE) = prob of first row.

