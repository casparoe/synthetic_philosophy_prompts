              SELECT SUM(weight) FROM table WHERE A AND B / SELECT SUM(weight) FROM table WHERE A

          This is not a function of the row, but a function of the entire table and the distribution. So we cannot have a column that represents it.

          Translated: the conditional is not a column, but a filter operation on the entire table.

     b. **The conditional is a third value like `NULL`.**

