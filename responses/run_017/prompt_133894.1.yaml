answer: |-
  Here is your Q&A prep sheet, tailored to the room:

  1.  **Sympathetic Formal Epistemologist:** "Isn't averaging over natural distributions still too idealized? Real agents don't sample beliefs from a distribution; their information is structured." *Reply:* "Agreed, it's a model. But the point is that hardness persists robustly under plausible input structures, not just worst-case. We need *some* tractable idealization." *Soft:* Depends on the specific distributions/models being convincing as "natural".
  2.  **Critical Formal Epistemologist:** "This just rehashes the old 'epistemic demons' worry. We've always known coherence is ideal; the debate is about *which* idealization is appropriate for norms. Why is yours better?" *Reply:* "The key difference is the *specifiability* failure (Step 3) due to average-case hardness. Old replies assumed the idealization *could* specify the requirement, even if we couldn't meet it. Here, it *can't* specify it." *Soft:* Requires accepting Step 3 as fatal. *(Flag: Briefly concede in talk the history, but emphasize Step 3 as novel.)*
  3.  **Metaphysician 1 (Architecture):** "Is this an argument about rationality *simpliciter*, or just about bounded agents like us? Could an ideal agent satisfy these norms?" *Reply:* "It targets norms requiring computations demonstrably intractable (in specific average-case senses). If rationality *requires* performing such computations, then ideal agents must be defined as capable of them – but the *content* of the requirement remains unspecifiable for *any* finite agent trying to apply it." *Soft:* Depends on defining rationality norms as applicable to finite reasoners.
  4.  **Kantian ("Can"):** "You lean heavily on 'ought implies can'. But doesn't Kantian 'can' refer to *logical* possibility or noumenal capacity, not contingent computational limits? Why should physical constraints bind rationality?" *Reply:* "My 'can' is about *feasible knowability/executability* for the agent *in deliberation*. A norm must be usable as a guide. If determining *what it demands* requires solving an intractable problem, it fails this condition." *Soft:* This premise is central and contentious. *(Flag: Explicitly state this "guidance" constraint in the talk.)*
  5.  **Ethicist (Moral Analogy):** "Does this imply moral norms are also void if determining the right action is computationally intractable? That seems to let agents off the hook too easily." *Reply:* "Possibly for some highly specific act-utilitarian calculations. But moral norms often involve intentions, virtues, or rules-of-thumb arguably less vulnerable to this *specification* problem than belief coherence, which demands precise logical relations." *Soft:* The structural analogy *is* strong for certain moral theories.
  6.  **Political Philosopher (Deference):** "Isn't this just an argument for epistemic division of labor? Why frame it as abandoning coherence norms rather than distributing the cognitive load socially?" *Reply:* "It *supports* division of labor! But the argument targets *individual* coherence requirements. Even within an institution, the *aggregate* task of maintaining global coherence might itself hit intractability walls." *Soft:* Social structures *can* mitigate, but may face aggregate complexity.
  7.  **Metaphysician 2 (Normativity):** "You claim an unspecifiable requirement isn't a norm. But norms can be objective standards we fail to grasp. Why must norms be 'specifiable' to the agent?" *Reply:* "For it to function as a *normative guide*. An unspecifiable standard can't tell an agent *what to do* differently to improve. It becomes merely a description of perfection, not a practical requirement." *Soft:* Conceding objective standards weakens the "failing" charge significantly.
  8.  **Computer Scientist (No Philosophy):** "Complexity classes describe abstract machines. Drawing normative conclusions for human cognition is a category error. Hardness results don't tell us what we *should* do." *Reply:* "I agree they don't dictate norms directly. But they *constrain* which putative norms are *candidates* for being action-guiding requirements for finite agents. They show certain proposed norms lie beyond feasible guidance." *Soft:* Requires accepting complexity as relevant to feasibility of *guidance*.
  9.  **Hoped-Nobody-Asks:** "Doesn't your 'well-calibrated to resources' requirement face the *same* specifiability problem? How do I *know* what beliefs are tractable *for me* to form?" *Reply:* "Ouch. It likely does face *some* specification challenge. But it aims lower, demanding coherence only within computationally bounded 'chunks'. The hope is this *is* tractably specifiable and satisfiable relative to the agent's actual capacities." *Soft:* This is the biggest vulnerability of the positive proposal.
