prompt: |-
  I've got an hour next week with a mixed seminar — first-year philosophers plus second-year computer scientists — and I need to get one thing across: that 'this system implements computation C' isn't a fact about the system on its own but something we attribute to it, so 'which computations matter morally?' can't be answered by just pointing at the computation. Don't write the session for me; tell me how to run it.

  What I'd like them to leave holding is a distinction I've been messing about with and can't quite get straight myself: attribution-robustness versus attribution-by-convenience. Roughly, an attribution of a computation to a system is morally load-bearing only if it survives (a) coarsening the description — it isn't an artefact of how finely I chose to carve things up — and (b) perturbing the system's states and inputs, i.e. it tracks counterfactuals the system really supports rather than just the run I happened to watch. An attribution that's merely convenient for me, or that matches what the programmer intended, isn't. That's the bit I want them to feel the force of.

  So: what order do the bits have to come in, given that? My carrying example is a little evolved virtual creature in a simulation, twelve-node nervous system, steers reliably away from a noxious patch, and its failure mode looks a bit like relief when it escapes — crucially it has no programmer's spec to appeal to and nothing like a body we already have intuitions about. Tell me what else that example has to have, and what it has to avoid, if it's going to carry the whole hour.

  Misconceptions I'm expecting: that the physics or the runtime settles it and descriptions are just bookkeeping; that once they see several computations fit one run they'll conclude computation is irrelevant tout court; that the computation which matters is the one someone intended the system to be running; and the slide from avoidance behaviour to so it hurts. Where in the sequence does each have to be headed off, and which one will actually be hardest to shift?

  Give me one question for the end that shows me they've got the distinction rather than just got unsettled — I was thinking of handing them teh second system and asking what would have to be true of it to change their answer, but say if that's the right test. And what should I openly refuse to get into at this level, and say out loud that I'm refusing it?
reasoning: |-
  Okay, the user is a professor preparing a seminar for first-year philosophers and second-year computer scientists. They want to convey that attributing a computation to a system isn't an inherent fact but something we assign. The key distinction is between attribution-robustness and attribution-by-convenience. They need students to understand that only robust attributions (coarse-grained descriptions and counterfactual stability) are morally relevant, not convenient ones like programmer intent.

  The main example is an evolved virtual creature with a twelve-node nervous system showing avoidance behavior. The user wants to ensure this example effectively carries the seminar. They anticipate misconceptions: that physics settles computation, multiple computations imply irrelevance, intent defines computation, and conflating avoidance with pain.

  To structure the hour, start by challenging the intuition that computation is inherent. Use the virtual creature to show multiple possible descriptions. Then introduce the robustness criteria: coarsening descriptions and counterfactual perturbations. Address misconceptions as they arise, especially intent and pain conflation. End with a question testing if they apply robustness criteria to a new system.

  The hardest misconception will be separating avoidance behavior from pain, as it's an intuitive leap. Avoid discussing consciousness or panpsychism explicitly. The final question should ask what changes would make them reconsider moral relevance, forcing application of robustness criteria.
answer: |-
  Here’s a battle-tested structure for your hour, designed to make the distinction *felt* while preempting key misconceptions. The virtual creature is perfect—lean into it hard.

  **Core Sequence (45-50 mins):**

  1.  **The Hook: Puncturing Inherent Computation (10 mins)**
      *   **Show the Creature:** Display a short, clear animation of the creature reliably avoiding the noxious patch and its "relief-like" failure mode. *Ask:* "What is this creature *doing*? What computation is it running?" (Let them shout answers: "Avoidance!", "Pain/relief!", "Pathfinding!").
      *   **Challenge Inherency:** "Great! Now... *prove it*. Point to the physical state *right now* and show me where the computation 'avoidance' is written. Point to the physics... is 'avoidance' a fundamental force?" Quickly highlight: Physics is voltages/flows/transistors; computation is an *interpretation* layered on top.
      *   **Plant the Seed:** "So, if the computation isn't *in* the physics like mass or charge... how do we decide *which* interpretation is the 'real' one? Especially for moral questions?" (Plant the doubt).

  2.  **The Reveal: Multiple Attributions Fit (15 mins)**
      *   **Present Competing Descriptions:** Show 3-4 distinct computational interpretations *all consistent* with the *exact same observed run* of the creature:
          *   Low-level: Node-by-node activation trace (the "physics" view).
          *   Mid-level: Input-output function "Avoid Noxious Patch".
          *   Alternative Mid-level: "Maximize Distance from Red Zone" (if topology allows).
          *   High-level w/ Moral Weight: "Experiencing Discomfort then Relief".
      *   **Activity:** "Group A defends 'Avoidance', Group B defends 'Discomfort/Relief'. Find evidence *in the run* for your description." (They will! This forces the point: multiple *valid* descriptions exist).
      *   **Key Insight:** "So... the *same physical run* supports multiple computational attributions. The computation isn't uniquely settled by the physics or the runtime trace. *We choose* which level of description matters."

  3.  **Introducing Robustness vs. Convenience (15 mins)**
      *   **The Moral Question:** "Okay, so *if* we think computation matters morally (e.g., 'it suffers'), and *if* multiple computations fit... which attribution should we care about? Convenience? The one the designer *intended*? (Preempting that misconception). Or something else?"
      *   **Define Robustness:** Introduce your two criteria explicitly:
          *   **Coarsening (Granularity):** "Does this description still hold if we describe the system *less finely*? Does 'Avoidance' survive grouping nodes? Does 'Node 7 Firing at t=3' survive?" (The latter doesn't, the former might). *Moral weight needs scale*.
          *   **Perturbations/Counterfactuals:** "Does this description hold *only* for this exact input sequence? Or does it track what the system *would* do under variations? If I nudge it *here*, does 'Avoidance' still predict the output? Does 'Discomfort/Relief'?" (Show simple counterfactuals: slightly different starting position, minor input noise). *Moral weight needs stability beyond the actual*.
      *   **Contrast Convenience:** "Is an attribution *just* useful for *me* to predict? *Just* matches the designer's sketch? *Just* fits this one run? If it fails coarsening or perturbations, it's likely *convenience*."

  4.  **Applying to the Creature & Misconception Busting (10 mins)**
      *   **Apply Robustness:** "Back to our creature. Test 'Avoidance' and 'Discomfort/Relief' against robustness:"
          *   *Coarsening:* Does "Avoidance" hold if we abstract nodes into functional groups? (Probably yes). Does "Discomfort/Relief" hold? (Maybe, but harder – what defines it? Specific node patterns?).
          *   *Perturbations:* Show counterfactuals: New patch location? Partial damage? Does "Avoidance" predict well? (Likely yes). Does "Discomfort/Relief" predict the failure mode under new stresses? (Likely no – it's brittle, tied to *this* failure mode). Conclude: "Avoidance" is robust; "Discomfort/Relief" is likely attribution-by-convenience (fitting *this* run well, but not generalizable).
      *   **Targeted Busting:**
          *   *Intent:* "But what if the *evolver* selected for 'Discomfort/Relief'?" Counter: "Does that *make* the creature run that computation, or is it just why this physics exists? Does intent make the attribution robust?" (No! Robustness is about *system properties*, not history).
          *   *Physics Settles It:* Re-emphasize Step 1 & 2 – multiple levels fit the physics.
          *   *Computation Irrelevant:* "Does multiple attribution mean computation *doesn't* matter? Or does it mean we need *rigorous criteria* (robustness) to pick *which* computation matters?"
          *   **Hardest: Avoidance → Pain:** "Does robustly attributing 'Avoidance' mean it *hurts*?" Slam this: "NO! Robustness tells us *which computation is real for the system*. It doesn't tell us *if that computation has moral weight*. 'Avoidance' is robust, but is it *suffering*? That's a *separate, harder question* about the *nature* of that computation and moral patiency. Robustness is step one: figuring out *what it's doing*. Step two is: *does doing that matter morally*?"

  **The Final Test Question (5-7 mins):**
  Your idea is spot-on. **Hand them a *second* virtual system.** Something simple but different (e.g., a thermostat, a very basic RL agent finding food, a cellular automaton pattern). Ask:
  > **"What specific changes or evidence about *this new system's behavior under perturbation* and *the granularity of its description* would make you more or less likely to consider a particular computational attribution (e.g., 'seeking', 'preference') morally load-bearing? Focus on robustness vs. convenience."**

  *   **Why it works:** It forces them to *apply* the criteria (perturbations/counterfactuals, coarsening) to a novel case. If they just say "it has to feel pain," they missed step one. If they talk about stability across variations and abstraction levels, they got it. If they mention programmer intent or physics alone, they regressed.

  **What to Openly Refuse (Say This Out Loud):**
  *   **"We are NOT settling the Hard Problem of Consciousness today.** Robustness helps us identify *what computation is genuinely being performed* by the system. Whether *that specific computation* constitutes suffering, consciousness, or moral patiency is a profound philosophical question *downstream* of this. Today, we're just building the tools to identify the computation rigorously."
  *   **"We are NOT debating panpsychism or if rocks suffer.** We're assuming *some* computations *might* matter morally, and figuring out *how to identify which computations are real enough in a system to even be candidates* for that debate. If computation matters morally at all, robustness is key to identifying it."

  **Crucial Tweaks for Your Creature Example:**
  1.  **Counterfactual Clarity:** Build in *visible, testable* counterfactuals. Show what happens if:
      *   The patch moves (does it re-orient?).
      *   A node is "damaged" (does avoidance degrade gracefully or catastrophically?).
      *   The environment has novel obstacles.
  2.  **Granularity Spectrum:** Have clear levels:
      *   Raw node activations (physics-level).
      *   Functional groups (e.g., "sensor cluster", "motor controller").
      *   Input-Output ("Noxious Input -> Turn Away").
      *   Anthropomorphic ("Discomfort -> Relief").
  3.  **"Relief" Failure Mode Nuance:** Make its "relief" behavior *contingent* on very specific, narrow conditions that break easily under perturbation. Show it *doesn't* generalize to other "stressful" situations or positive outcomes. This makes "Discomfort/Relief" fail the counterfactual test demonstrably.
  4.  **Avoid Bodily Analogies:** You said it, but double down. Don't call nodes "pain receptors" or movements "flinching." Use neutral terms: "noxious stimulus detector," "directional output vector," "post-stimulus damping oscillation."

  **Hardest Misconception to Shift:** The **Avoidance Behavior → Therefore It Hurts** slide. This is deeply intuitive. Busting it requires:
  1.  **Ruthlessly separating the two questions:** "What computation is robustly performed?" vs. "Is *that computation* morally significant?"
  2.  **Showing robust computation without sentience:** Thermostats robustly compute "desired temperature maintenance." Nobody thinks they suffer. Robustness is necessary but not sufficient.
  3.  **Emphasizing the leap:** "Avoidance is a *functional* description. Pain is a *phenomenal* one. Robustness gets us to the functional description reliably. Bridging that gap is the *next* challenge."

  This structure builds the case sequentially, uses active engagement, targets misconceptions as they naturally arise, and ends with a clear application test. The refusal sets crucial boundaries. Good luck – it’s a fascinating and crucial distinction!
