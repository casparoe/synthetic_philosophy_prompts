prompt: |-
  I'm a journalist — I cover science and medicine — and I'm working on a piece about consent forms, the click-through kind and the signed-in-triplicate kind, and I keep typing the phrase "valid consent" without being able to say what makes it valid. So I did what I always do when I'm lost: I wrote down a pile of cases, marked each one with my gut, and now the pile won't sit still.

  - Someone agrees to sex with a condom, partner takes it off halfway through. Definitely not consent, and worse than I expected myself to feel about it.
  - Patient signs for a knee operation; surgeon gets in there, finds something else, fixes that too. Low risk, genuinely beneficial, patient would probably thank her. Still not fine to me.
  - Patient signs for "robot-assisted" surgery and the actual cutting is done by the system running on its own, nobody's hands on the console for most of it. Not fine. But — and here's the thing that bugs me — I'm fine with the surgeon handing half the operation to a resident the patient never met. Both are a substitution in who does the thing. Am I just defending whatever's normal?
  - Nurse practitioner at a community clinic tells a patient the visit is covered; it isn't and she's on the hook for $400. Gut says the consent to treatment is still fine, the billing is a separate wrong. But then: a study enrols people telling them it's about memory when it's about conformity, same risk, same payment. That one I say is invalid.
    Those two look structurally identical to me — same risk, same money, lie about something the person cared about — and I give opposite answers. I have no idea what's supposed to separate them.
  - Blood donor is told the fee goes to a charity; it goes to the company's overhead. Annoying. I don't think it voids consent.
  - Boss says sleep with me or you're fired. Coerced. Partner says sleep with me or I'm leaving. Not coerced. The partner is also threatening to do something she's entirely entitled to do.
  - A phase I trial in a country where $2000 is four months' wages, for a drug with real risk. My gut says "not coercion" and then immediately says "but not fine either," which probably means my gut is useless on this one.
  - Drunk yes at a party: not consent. But my dad, early Alzheimer's, signed a letter last year saying he'd hand over the keys when his doctor said so, and I think the letter should win over what he's saying now. Which seems backwards — in one case I throw out the impaired present self in favor of the earlier one, in the other I won't let the earlier self's explicit instruction count.
  - 16-year-old getting an IUD without her parents: yes. 17-year-old selling her eggs for tuition money: no. And a 15-year-old refusing a transfusion on religious grounds: no, override her. If there's a shape here it's not just "kids can't consent."
  - Signed a waiver to get into the climbing gym. I don't think that's consent to the risk of the wall falling on me because they never inspected the bolts, but I do think it's consent to the ordinary risk of falling off. Same signature.

  The principle I keep falling back on is: nobody pushed them, and they'd have said yes anyway if they'd known the whole truth. But that has to be wrong somewhere. The blood donor would have said no if she'd known — so my principle calls it invalid, and my gut doesn't. And there's a version that's worse: a patient who'd have refused if he'd known the valve was from a pig, or that the surgeon was Black. I don't want to say the "would you have said yes if you knew" test makes that consent invalid, but I also don't see how to stop it from saying that.

  So: is there one principle — or a short list of them — that gets most of my verdicts, and where does it overrule me? I'd like it stated tightly enough that I can run new cases through it, with a clause-by-clause note on which case forced the clause. And two cases I haven't put on the list because I keep flip-flopping: a woman who said yes to being named in a story while she was hypomanic and now wants out, and a friend who slurred "yeah fine" about a quote at a conference party and then texted "still fine" the next morning. Does a later clear-headed yes repair an earlier broken one, or is that a different question from whether the first yes counted?

  One more thing I actually need for the piece: after all this, is there anything left in "she consented" beyond a label we stick on a bunch of unrelated complaints — the pushing, the lying, the not-getting-it — or is there a core that all of them are failures of?
reasoning: |-
  Okay, let's tackle this intricate consent problem. The user is a science/medicine journalist wrestling with what constitutes "valid consent" across diverse scenarios. They've listed 12 nuanced cases where their gut reactions seem inconsistent, and need a unifying framework that both explains their intuitions and holds up to scrutiny. 

  First, I notice their core frustration: they've instinctively used a "would they have said yes if fully informed/unpressured?" test, but recognize it leads to morally unacceptable conclusions (e.g., validating racist patients' refusal of Black surgeons). This suggests we need principles that filter out irrelevant factors while protecting autonomy. 

  Looking at their cases, patterns emerge:
  - **Deception**: They distinguish between lies affecting core aspects of the act (study purpose) versus peripheral ones (billing). The key seems to be whether the deception alters the *nature* of what's consented to.
  - **Coercion**: They intuitively separate threats that remove baseline entitlements (job loss) from those that don't (ending a relationship). This maps neatly to the legal distinction between wrongful threats and permissible choices.
  - **Capacity**: Their conflicting views on intoxication vs. dementia reveal an unstated hierarchy of selves—they privilege enduring values over transient states, but only when the prior self was competent.
  - **Substitution**: Their discomfort with autonomous robots but acceptance of residents hints at valuing *human accountability* in high-stakes interventions.

  For the framework, I'll need:
  1. **Voluntariness** with a coercion definition narrow enough to exclude relationship ultimatums but include employer threats. Must explicitly exclude bigotry as legitimized coercion.
  2. **Informedness** that focuses on material risks/nature of the act, not all information. This resolves the billing vs. study deception inconsistency—one affects healthcare received, the other doesn't.
  3. **Capacity** criteria that address both developmental maturity (hence varying ages for IUD/egg donation/transfusions) and situational impairment, with a "values continuity" clause for dementia cases.
  4. **Specificity** principle explaining why consent to knee surgery doesn't cover surprise repairs, and why gym waivers cover inherent risks but not structural collapse.

  The blood donor case is pivotal—it feels invalid yet their principle would void it. Solution: reframe validity as about *the act performed*, not feelings about ancillary matters. The donation itself (needle stick, blood draw) is unchanged; the lie concerns separate financial arrangements.

  For their flip-flop cases: 
  - Hypomanic woman: Invalid if impairment prevented understanding consequences of publicity. Later regret doesn't retroactively void consent, but a clear-headed retraction should override prior permission.
  - Drunk conference quote: The "still fine" text likely *is* valid consent—it's ratification when competent, not repairing broken consent. 

  Finally, the existential question: "consent" isn't just a label. Its core is *authorization derived from understanding and choice*, making all failures (coercion, deception, incapacity) different fractures of the same autonomy pillar. This preserves its conceptual unity without ignoring contextual differences.

  Biggest challenge will be crisply distinguishing material vs. immaterial information across domains (sex vs. surgery vs. research) while avoiding endless edge cases. The "reasonable person standard" helps but needs anchoring to domain-specific norms.
answer: |-
  Here's a principled framework for valid consent, distilled from your cases and designed for journalistic rigor. It consists of **three core elements** (Voluntariness, Informedness, Capacity) and **two interpretive rules** (Specificity, Materiality). Each clause is battle-tested against your examples.

  ---

  ### **The Framework**
  **Valid consent requires:**
  1.  **Voluntariness:** Agreement is free from coercion or undue influence.  
      *Coercion = Threat of wrongful harm.* "Wrongful" means violating rights, laws, or ethical duties (e.g., firing for sexual refusal is coercion; leaving a relationship is not).  
      *→ Resolves:* Boss/partner cases; justifies "not fine but not coercion" for Phase I trials (exploitation ≠ coercion).  
      *→ Overrules you:* Blood donor lied about charity? No coercion, so voluntariness stands.

  2.  **Informedness:** Agreement is based on comprehension of **material facts**.  
      *Material facts = Information that would alter a reasonable person's decision OR is specifically important to this person (if known).*  
      *→ Resolves:*  
      - Surgeon fixing unexpected issue? Material change in procedure → invalid.  
      - Robot vs. resident? Material if patient cares about human control (reasonable or stated).  
      - Study deception about purpose? Material to autonomy/values → invalid. Billing lie? Immaterial to treatment → consent valid (but billing fraud occurs).  
      - Blood donor charity lie? Immaterial to physical risk → consent valid.  
      *→ Blocks racism:* Patient refusing Black surgeon? Their bias doesn’t make surgeon’s identity material to the *medical procedure*. Consent remains valid.

  3.  **Capacity:** Ability to understand the decision and its consequences at the time of consent.  
      *Assessed contextually: higher stakes require higher capacity.*  
      *→ Resolves:*  
      - Drunk "yes" at party? Impaired capacity → invalid.  
      - Dad’s Alzheimer’s letter? Valid if signed with capacity; later impairment doesn’t retroactively void it.  
      - 16yo IUD? Capacity for reproductive choice. 17yo egg sale? Stakes (medical/financial exploitation) exceed minor’s capacity → invalid. 15yo transfusion refusal? Life-or-death stakes exceed capacity → override.  

  ---

  ### **Interpretive Rules**
  1.  **Specificity:** Consent covers only what is described.  
      *→ Resolves:*  
      - Condom removal? Violates specificity → invalid.  
      - Knee surgery surprise? Beyond scope → invalid.  
      - Climbing gym waiver? Covers inherent risks (falling), not negligence (wall collapse).  

  2.  **Materiality Threshold:** Only lies/omissions affecting the *core nature or consequences* of the act invalidate consent.  
      *→ Resolves why billing lie ≠ study deception:* Billing is ancillary; study purpose defines the act itself.  

  ---

  ### **Your Flip-Flop Cases**
  - **Hypomanic woman:**  
    - *Initial consent:* Likely invalid if hypomania impaired comprehension of publicity consequences (Capacity issue).  
    - *Later "clear yes":* If given when stable, this is **new valid consent**. It doesn’t "repair" the earlier breach but supersedes it.  
  - **Drunk "yeah fine" + next-day text:**  
    - *Party slur:* Impaired Capacity → invalid.  
    - *Next-day text:* Sober ratification → likely valid. This is **affirmation after capacity is restored**.  

  ---

  ### **Is "Consent" More Than a Label?**
  **Yes. The core is autonomous authorization.** All your cases share a failure to obtain *meaningful permission* for the specific act performed. The complaints (pushing, lying, incapacity) are failures to satisfy the framework’s elements, but the unifying thread is:  
  > **"Did this person genuinely agree to *what actually happened*, with understanding and freedom?"**  

  When consent is invalid, it means the act lacked moral/legal permission. This isn’t just labeling harms—it’s why those harms *matter*.

  ---

  ### **Why Your Gut Isn't Useless**
  - Your instincts align with this framework. Where they conflicted (billing vs. study deception), Materiality resolves it.  
  - Your "would they have said yes?" test *almost* works but fails on immaterial preferences (e.g., racism). Adding "materiality" fixes this.  
  - The Phase I trial unease? It’s **exploitation** (unfair power dynamics), not invalid consent. A separate ethical issue—worth exploring in your piece.

  **Use this framework to dissect cases:**  
  1. Was the act *specifically* agreed to?  
  2. Was agreement *voluntary* (no wrongful threats)?  
  3. Were *material facts* understood?  
  4. Was the person *capable* of deciding?  

  If any fail, consent is invalid. If all pass, it’s valid—even if other wrongs occur (like billing fraud).
