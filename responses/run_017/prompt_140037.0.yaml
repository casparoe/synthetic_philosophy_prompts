  ### Response to Co-TA's Claim
  **Claim**: Aspiration procedures (fixed/declining/regret) are "just maximization once you price searching properly," while winner/screen are genuinely different.  
  **Rebuttal**: This is incorrect.  
  - **Why it’s wrong**:  
    - Aspiration methods use **exogenous thresholds** (e.g., 85th percentile, 5-point regret) unrelated to the optimal stopping problem. They satisfice (accept "good enough") without modeling option value or marginal costs.  
    - Winner/screen **are EU maximizers**:  
      - *Winner*: Maximizes via pairwise comparisons (full info).  
      - *Screen-then-drill*: Suboptimal two-stage optimization.  
    - **Satisficing scores back this**: Aspiration scores = 9–10 (genuine), winner/screen = 0–2 (optimization).  

