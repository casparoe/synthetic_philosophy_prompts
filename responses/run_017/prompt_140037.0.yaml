  ### Ratings for Apartment Search Procedures

  Below are the ratings for each procedure on (a) expected net score as a percentage of the best possible procedure (0–100) and (b) satisficing score (0–10, where 10 = genuine satisficing). Parameters used:  
  - **Weights**: Exponential distribution (rate = 1) for feature weights, rescaled so true values sum to 0–100.  
  - **Feature correlations**: Mild positive correlation (ρ ≈ 0.3 within listings).  
  - **Budget**: 150 lookups (cost = 0.1 per lookup, total search cost = 15 points).  
  - **Scoring**: Net score = true value of chosen listing − total search cost.  

  | Procedure               | (a) Expected Net Score (% of optimal) | (b) Satisficing Score | Rationale                                                                                                                                 |
  |-------------------------|----------------------------------------|------------------------|-------------------------------------------------------------------------------------------------------------------------------------------|
  | **1. Myopic VOI**       | 92                                     | 0                     | Near-optimal sequential info-gathering; stops when expected marginal benefit < cost. High efficiency due to exponential weights. Weak satisficing (pure EU maximization). |
  | **2. Fixed aspiration** | 65                                     | 10                    | Stops at first listing clearing 85th-percentile prior (≈82). Saves search costs but misses upside; prone to early/low-quality picks. Strong satisficing (fixed threshold). |
  | **3. Declining aspiration** | 74                                  | 10                    | Bar starts at 95th percentile, drops 5 points per 10 lookups. Balances aspiration and cost better than fixed. Strong satisficing (adaptive threshold). |
  | **4. Elimination by aspects** | 58                                  | 7                     | Eliminates listings lacking top features. Efficient with skewed weights but wasteful on correlated features. Moderate satisficing (non-compensatory, heuristic-based). |
  | **5. Winner-stays-on**  | 73                                     | 0                     | Fully evaluates incumbents vs. challengers. Good for identifying high-value outliers but high per-listing cost. Weak satisficing (tournament-style maximization). |
  | **6. Screen-then-drill** | 68                                     | 2                     | Initial broad screen (37.5 lookups), drills top 3. Wastes leftover budget; noisy initial ranking. Weak satisficing (two-stage optimization). |
  | **7. Regret-threshold** | 81                                     | 9                     | Stops when P(regret > 5) < 20%. Balances exploration and cost well. Strong satisficing (regret minimization ≠ EU). |

