prompt: |-
  You're a formal epistemologist who's spent years on probabilistic heuristics and self-locating evidence — take this seriously, brainstorm a couple of framings in your head before committing to one, and don't give me the generic stuff.

  I need a two-page proposal for a one-semester term paper (around 6000 words), written out as an actual proposal rather than a plan to have one.

  The area: heuristic arguments whose force comes entirely from multiplying credences over samples or steps treated as independent — the doomsday-argument / fine-tuning / Boltzmann-brain family, where you reason that given you find yourself with evidence E, hypothesis H gets boosted by a factor of roughly such-and-such — and the fact that the independence these arguments presume is almost never stated precisely, let alone argued for.

  My half-formed idea, which you should sharpen or swap out if its weak: the literature treats the independence assumption as one thing when it's really at least three — (i) independence of the sampling mechanism from which hypothesis is true, (ii) conditional independence of the evidence-pieces within a hypothesis, which is what licenses multiplying the likelihoods, and (iii) a robustness condition, how much residual dependence the conclusion actually survives. What I'd really want is a dependence budget for each argument: how big a correlation, or how large a perturbation of the sampling story, would be needed to wipe the effect out. Then calibrate the apparatus on a case where the verdict can be checked — the Cramér-style probabilistic model of the primes, where as I remember it an independence assumption gets average gap sizes roughly right but is famously wrong about the numbers of primes in short intervals, per Maier's theorem in the 1980s; don't lean on my memory of the details. If the dependence-budget tool can't flag that heuristic as untrustworthy in advance, I don't see why anyone should trust it when it says something about cosmology.

  Give me: the question stated precisely enough to have a determinate answer, why both the defenders and the critics of these heuristics leave it open, a month-by-month method and why that beats the obvious move of formally modelling one argument inside a Bayesian framework and stopping there, the possible findings and which considerations would decide between them, and an honest paragraph on what would make the project fail or blow past a semester. No citations and no bibliography, I'll fill those in myself.

  Format: lead with a single bottom-line sentence — the question in its sharpest form plus why its tractable in one semester — then go straight into the proposal. No preamble, no restating my brief.
