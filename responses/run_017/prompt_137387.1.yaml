prompt: |-
  I work as a story editor on factual drama — the sort of thing that carries a caption about being inspired by real events — and my partner is an archivist, so the two of us have been arguing, on and off for about two years, about what exactly we owe the real dead when we turn them into characters. I have got into the habit of writing down my verdicts on individual cases rather than defending general principles, and I would now like to know whether there is a principle behind them, because I suspect that at least two of them cannot both survive.

  The verdicts, as I have them. A composite character who stands in for a whole team of scientists in a miniseries about a nuclear accident: fine, provided the programme says so somewhere. Reconstructed dialogue for a meeting that certainly happened but whose words were never minuted: fine. Moving a real person into a room they were not in, so that two documented events can share a scene: fine, that feels like punctuation. An invented love affair between two real people who certainly knew each other: fine, with a bad conscience. The same invented affair presented in a realist docudrama that will be most viewers' only source on the pair: not fine. A fabricated specific act of cruelty — a real person shown doing something vile that they did not do, though they did do other vile things of that kind, so the scene is representative: not fine, and worse than the invented affair, and I cannot say why. Depicting a real person as having committed a crime they were tried for and acquitted of: not fine, and worse again. Depicting a real person as having had a secret sexual relationship contrary to the sexual identity they avowed in public and around which they organised their life: not fine — but that is, on the face of it, the very same act as the invented affair I called fine, and I cannot get the two verdicts to line up. Inventing a cruel act about a Roman emperor who spent his life courting fame: I barely mind. Inventing the same act about a private person who died two centuries ago, never sought notice, and left no descendants and no community that remembers her: I mind a great deal — and since neither of them can be harmed, and no living person is distressed in either case, I do not know what my reaction is even tracking. And last: a biopic of a memoirist who spent his life publishing a self-aggrandising and largely false account of himself, which invents scenes in order to puncture the myth — fine, and I am not sure whether that is because the subject forfeited something by lying or because the invention there is restorative rather than accusatory.

  The three candidate principles I have been trying out are these. First, a structural one: what matters is not how many facts are changed but where in the narrative's causal architecture they sit — inventions that decorate are permissible, while inventions that supply the motives for the person's actual deeds, or that become the reason the audience thinks she did what she did, are falsifications of the person. Second, counterfactual consent: would this person, judging by the values she actually held and avowed, have accepted this depiction of herself — where the relevant question is not whether she would have enjoyed it but whether the depiction is one she could have recognised as hers. Third, an epistemic one about the audience: the wrong is a function of how likely the work is to become somebody's settled belief about the person, so it tracks genre, publicity, and whether a rival account is in circulation. Please test these against my verdicts, repair them or replace them, and tell me honestly which verdicts I have to give up: I would much rather have a principle that overturns one or two of them than a principle with a list of exceptions as long as the list of cases. Then I want it applied to the case I go back and forth on. A documentary about a writer who died in the 1990s, made with the co-operation of her estate, uses a voice model trained on her archived interviews to read aloud, in her own voice, passages from her private diaries — sentences she wrote, in her own hand, but never spoke and never published — and presents this as her reading them, with a caption explaining the synthesis. I have felt both that this is the most respectful possible use of an archive and that it is a violation unlike any of the others, and I cannot tell which of those thoughts is the sentimental one. And please say what your account predicts about a case I have not listed: say, a drama about a musician who died three years ago, made against the wishes of her adult children, which depicts a documented episode of which they are ashamed.
reasoning: |-
  Okay, let me try to work through this user's query. They're a story editor for factual dramas, and their partner is an archivist. They've been debating what we owe to real people when turning them into characters. The user has specific verdicts on different scenarios but feels some might conflict. They want a consistent principle and help with a case they're unsure about.

  First, I need to understand their verdicts. They allow composites with disclosure, reconstructed dialogue, moving people for narrative flow. They're okay with invented love affairs but only if not in a docudrama that's the main source. Fabricated cruel acts are not okay, even if representative. Depicting acquitted crimes or secret relationships against avowed identity is worse. Historical figures like Roman emperors are less concerning than private individuals. Correcting a liar's myth is fine. 

  The user proposed three principles: structural (motive vs. decoration), counterfactual consent (would the person accept it), and epistemic (likelihood of becoming settled belief). I need to test these against their verdicts. 

  Looking at the structural principle: Invented love affairs that don't affect motives are okay, but if they become the audience's reason for actions, it's bad. That fits. Fabricated cruelty supplying motive isn't permissible. But the secret relationship case contradicts—structurally similar to the affair, but the user rejects it. So structural alone isn't enough.

  Counterfactual consent: The Roman emperor likely desired fame, so inventing cruelty might be acceptable. The private person who avoided attention wouldn't consent. The memoirist who lied might not consent to being exposed, but the user allows it. So consent has issues, especially when values conflict.

  Epistemic principle: Docudramas as sole source make inventions problematic. The secret relationship in a realist docudrama becomes entrenched belief, hence worse than a disclosed affair. This explains the difference between the affair cases. The musician's children being ashamed might not matter if the event is documented, but the work's influence on belief is key.

  Synthesizing these, a combined principle focusing on narrative role (structural) and audience belief (epistemic) seems best. Counterfactual consent adds nuance but isn standalone. The core wrong is misattributing defining traits that replace someone's actual identity in public memory.

  Applying this to the voice model case: The writer's diaries are authentic but private. Using her voice to read them feels respectful but also invasive. Since the content is true and disclosed, it's permissible. The violation comes from hearing her voice say things she never spoke, but the caption mitigates that. So it's acceptable under the combined principle.

  For the musician: Depicting a documented event against family wishes. Since it's factual and not invented, the structural principle isn't violated. But the epistemic risk depends on presentation. If it's accurate and contextualized, it's defensible despite family objections. The harm is relational to living persons, but the truth of the event matters.

  The user needs to reconcile the affair vs. secret relationship verdicts. The difference lies in how it relates to the person's avowed identity. The secret relationship contradicts their public stance, making it a defining trait misattribution, hence worse. The invented affair without that conflict is less severe if disclosed.

  They might need to adjust the "cruel act" verdict if it's representative but not defining. However, fabricating specifics risks inaccurate portrayal, so maintaining that as not fine makes sense. The Roman emperor vs. private person difference is justified by consent and historical distance reducing epistemic harm.

  In conclusion, the synthesized principle holds up most verdicts, clarifying inconsistencies. The voice model case is permissible with disclosure, and the musician case depends on factual accuracy and context.
answer: |-
  Your verdicts reveal a sophisticated moral intuition that *can* be unified under a single principle, with one key refinement. The core wrong isn't falsification *itself*, but **misattributing a defining trait or act that replaces the person's actual, knowable identity in the audience's understanding**. This principle integrates your structural and epistemic concerns while subsuming consent as a factor in defining "identity."

  Here's the **Unified Principle of Narrative Attribution**:

  > **An invention is permissible unless it (a) attributes a *defining trait, motive, or act* to a real person that contradicts or replaces a knowable aspect of their documented identity, *and* (b) the work is positioned to become the *definitive account* for a significant audience segment.**

  ### How This Explains Your Verdicts
  1.  **Composite Scientist:** Fine. Doesn't attribute a *defining trait* to any individual; it's acknowledged functional compression.
  2.  **Reconstructed Dialogue:** Fine. Concerns non-defining *details*; motive/core actions remain anchored in documented events.
  3.  **Moving Person Between Rooms:** Fine. Non-defining *circumstantial detail*; narrative punctuation, not character redefinition.
  4.  **Invented Affair (General Drama):** Fine *with bad conscience*. *Potentially* defines character, but low epistemic risk if genre signals artifice/other accounts exist. Your conscience likely tracks the *potential* for misattribution if context fails.
  5.  **Invented Affair (Realist Docudrama/Sole Source):** **Not Fine.** Directly attributes a *defining trait* (their intimate relationship status/motivation) and is positioned to *become* their identity for most viewers.
  6.  **Fabricated Specific Cruel Act (Representative):** **Not Fine (and worse).** Attributes a *specific, defining act* they didn't commit. Even if "representative," it replaces their *actual* documented acts with a fictional one, creating a false concrete image. Specifics define more vividly than general traits.
  7.  **Depicting Acquitted Person as Guilty:** **Not Fine (Worse).** Attributes the *defining act* of a crime they were formally cleared of. Directly replaces a knowable legal/social fact of their identity with its opposite.
  8.  **Secret Relationship Contrary to Avowed Identity:** **Not Fine.** This *is* worse than verdict #4. Why? It doesn't just invent a private affair; it attributes a *defining hypocrisy* or *fundamental deception* about a core, publicly asserted aspect of their identity (e.g., a celibate priest, a proudly asexual activist). It redefines their *public self* as a lie.
  9.  **Cruelty to Roman Emperor:** **Fine.** Historical distance makes his "knowable identity" inherently mythic and incomplete. His life *was* performance for fame; invention is expected decoration, not replacement. No definitive account exists.
  10. **Cruelty to Private Person:** **Not Fine.** Her "knowable identity" (private, unremarkable, documented) is contradicted by attributing a *defining cruel act*. The epistemic risk is high *because* she's obscure – the work *becomes* her identity. Your reaction tracks *erasure* of her actual self.
  11. **Puncturing a Liar's Myth:** **Fine.** The invention targets the *false identity the subject created*, not their knowable authentic self (revealed by evidence). It's restorative, aiming to *correct* the misattribution they propagated.

  ### Testing Your Candidate Principles
  *   **Structural (Motive/Decoration):** Essential but insufficient. Explains #6 vs #3, but fails #8 (the secret affair *is* decorative structurally, but defining contextually).
  *   **Counterfactual Consent:** Useful heuristic, not the core. Explains #9 (emperor courted fame) vs #10 (private person avoided it). Fails #11 (liar wouldn't consent to exposure) and struggles with #8 (would they consent? Unknowable, but their *avowed identity* suggests not).
  *   **Epistemic (Settled Belief):** Crucial but incomplete. Explains #4 vs #5 and #9 vs #10. Fails alone on #6/#7/#8 – the wrong *starts* with the misattribution itself; epistemic risk amplifies the harm.
  *   **Unified Principle:** Explains all by requiring both **misattribution of a defining element** and **potential to redefine identity** for an audience.

  ### The Verdict You Must (Likely) Give Up
  *   **"Invented love affair... fine, with a bad conscience" (#4).** Your unified principle demands stricter scrutiny. While *less* harmful than #5 or #8, inventing a defining trait *is* a misattribution. Your "bad conscience" signals this. The principle suggests this should lean towards **not fine**, *unless* the context provides overwhelming signals that *nullify* the epistemic risk (e.g., overt genre satire, prominent disclaimer within the narrative, competing well-known accounts). Your conscience was the canary in the coal mine.

  ### Applying the Principle: The Voice Model Case
  *   **The Act:** Using AI to synthesize her voice reading *her own private words*.
  *   **Defining Trait?** The *words* are authentic and defining of her true self. The *act of speaking them aloud* is invented, but it's amplifying her own documented thoughts, not inventing new content or motives.
  *   **Replacing Identity?** It reveals her *actual* identity more deeply. The caption mitigates epistemic risk.
  *   **Violation?** The primary discomfort stems from intimacy and control – hearing her "voice" express thoughts she guarded. This is **less a misattribution** and more a potential **breach of contextual integrity** (archival ethics). Under the Narrative Attribution principle? **Permissible, even respectful.** The sentimental thought ("violation") is understandable (privacy invasion feels visceral), but the principle prioritizes *truthful representation of identity*. This reveals truth.

  ### The Musician Case: Against Family Wishes
  *   **Documented Episode:** Factual basis prevents *misattribution*. The event is part of her knowable identity.
  *   **Depicted Against Family Wishes:** Problematic ethically (relational harm to living descendants), but distinct from *misattribution to the dead subject*.
  *   **Defining Trait?** Depends on the episode's centrality. If it's a documented, significant event shaping her life/art, it *is* defining and factual.
  *   **Epistemic Risk:** High, as a recent drama. But the risk stems from *accurate* portrayal of an uncomfortable truth, not invention.
  *   **Principle's Prediction:** **Permissible regarding the dead subject.** The wrong is primarily to the *living family* (distress, loss of control over narrative) and requires separate ethical consideration (relational harm vs. historical/artistic truth). The musician's *actual identity* isn't falsified.

  ### Conclusion
  Your intuition consistently protects the *integrity of the person's knowable self* from being overwritten by defining fictions, especially when the narrative holds authoritative power. The "Unified Principle of Narrative Attribution" captures this. It demands asking:
  1.  **Is this invention attributing something *defining* that contradicts what we *can* know?**
  2.  **Will this work *become* the definitive account for its audience?**

  This overturns only your "fine, with bad conscience" verdict on invented affairs, aligning it closer to "not fine" unless mitigating context is overwhelming. It validates your discomfort with the voice model while finding it permissible, and clarifies that the musician case involves harm primarily to the living, not misattribution to the dead. The dead are owed the preservation of their authentic, knowable identity against defining falsehoods cemented by narrative authority.
