  Condition 5: Two-Tier (2 rounds)
    "In this condition, we will split into four juries of six students each. Each jury will work separately. Within your jury, each member will draw a chip from the bag (with replacement) and then vote by secret ballot. The majority vote within the jury determines the jury's verdict (if tie, we flip a coin). Then the four jury verdicts are brought to the whole class. Each jury's verdict counts as one vote. We then take a majority vote of these four verdicts: if at least three juries agree on a color, that is the group decision. If it's 2-2, we flip a coin."

