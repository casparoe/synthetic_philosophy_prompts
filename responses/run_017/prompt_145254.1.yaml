  Condition 1: Baseline (2 rounds)
    "In this condition, after you draw your chip, you will vote by secret ballot on an index card: if you drew red, vote RED; if blue, vote BLUE. We will then count the votes and the majority wins."

  Condition 2: Confidence (2 rounds)
    "In this condition, after you draw your chip, you have a choice: if you feel highly confident in your signal, you may declare that. If you declare high confidence, your vote will count as two votes. If not, it counts as one. You will write on your index card: your declaration (either 'confident' or 'not confident') and your vote (RED or BLUE). We will then tally the votes: each 'not confident' vote counts as one, each 'confident' vote counts as two. The option with the most votes wins."

  Condition 3: Common Cause (2 rounds)
    "In this condition, I will assign you into pairs. Each pair will come to the front together. I will draw one chip from the bag (and put it back). Both of you will see the same chip. Then you will return to your seats and vote by secret ballot: vote according to the color you saw. We will then tally the votes as usual."

