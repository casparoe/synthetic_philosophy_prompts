  ### Social Epistemology Experiment: Group Decision-Making Under Different Procedures  
  **Designed for 24 students, 90 minutes, 4 conditions. No prior terminology (independence, correlation, Condorcet) until debrief.**  

  ---

  #### **Materials**  
  - **1 coin** (to determine true state: heads = red-majority bag, tails = blue-majority bag).  
  - **2 opaque bags**:  
    - Bag A: **6 red chips, 4 blue chips** (60% red).  
    - Bag B: **6 blue chips, 4 red chips** (60% blue).  
  - **Index cards** (for voting).  
  - **Whiteboard** (to track running tallies in Deference condition and record group results).  
  - **Timer** (to keep rounds to 4 minutes).  
  - **Score sheets** (for tallying individual/group points; prize: "Epistemic Champion" certificate).  

  ---

  #### **Roles**  
  1. **Coin Flipper & Bag Holder**: Instructor.  
  2. **Vote Counter**: 1 student (collects ballots, tallies votes).  
  3. **Announcer**: 1 student (reveals running tally in Deference condition).  
  4. **Jury Forepersons**: 4 students (lead subcommittee discussions in Two-Tier condition).  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Setup (5 min)**:  
  - Assign roles, distribute index cards, explain scoring: "Every time the *group* is correct, you earn 1 point. Every time *your individual vote* is correct, you earn 1 point. Top scorer gets bragging rights."  
  - Display bags: "One bag has mostly red chips, the other mostly blue. We’ll flip a coin to pick the true bag each round."  

  **Baseline Condition (15 min)**:  
  - **Instructions (2 min)**:  
    > "Each of you will draw one chip from the bag in private, then put it back. Vote RED or BLUE based *only* on your chip. Write your vote on an index card. The vote counter will tally secret ballots. Majority wins."  
  - **Rounds (10 min)**: 2 rounds (4 min/round).  
    - Flip coin (hide result).  
    - Students draw chips (with replacement).  
    - Secret ballot vote → tally → reveal true bag.  
    - Record group/individual accuracy.  
  - **Confidence Wrinkle (3 min)**:  
    > "This time, after drawing, if you feel *highly confident*, declare it. Your vote counts double. Write ‘CONFIDENT: [RED/BLUE]’ or ‘NOT CONFIDENT: [RED/BLUE]’ on your card."  

  **Common Cause Condition (10 min)**:  
  - **Instructions (2 min)**:  
    > "Pair up. Each pair draws *one chip together* (both see the same chip). Vote based *only* on that chip. Secret ballot."  
  - **Rounds (8 min)**: 2 rounds.  
    - Flip coin → pairs draw one shared chip → vote → tally → reveal.  

  **Deference Condition (10 min)**:  
  - **Instructions (2 min)**:  
    > "Vote in public order (by seat number). When called, draw a chip, see the running tally of previous votes, then announce your vote aloud. You may change your mind based on the tally."  
  - **Rounds (8 min)**: 2 rounds.  
    - Flip coin → sequential votes → running tally displayed → reveal.  

  **Two-Tier Condition (15 min)**:  
  - **Instructions (3 min)**:  
    > "Split into 4 juries of 6. Each jury member draws a chip. Discuss for 1 minute, then vote by secret ballot. Majority determines the jury’s verdict. Then, all juries’ verdicts are voted on by the whole class (majority wins)."  
  - **Rounds (12 min)**: 2 rounds.  
    - Flip coin → juries deliberate/vote → class votes on jury verdicts → reveal.  

  **Teardown & Transition to Debrief (5 min)**:  
  - Collect scores, reset room.  

  ---

  ### **Debrief (30 min)**  
  **Map Experiences to Concepts**:  
  1. **Baseline (Power of Majority)**:  
     - "In the baseline, the group was right more often than even your best individual. Why? *Condorcet’s jury theorem*: If each voter is >50% competent (here, 60%), majority vote amplifies accuracy. A large group’s ‘collective intelligence’ beats any expert."  
     - **Data Spotlight**: Compare group accuracy (likely ~80-90%) to top individual (likely 60-70%).  

  2. **Common Cause (Shared Evidence → Correlated Errors)**:  
     - "When pairs shared a chip, errors spread. One wrong chip meant two wrong votes. This is *dependence through common evidence*. Errors aren’t independent—they’re linked by a shared cause."  
     - **Data Spotlight**: Group accuracy drops (likely ~60-70%) vs. baseline.  

  3. **Deference (Social Influence → Cascading Errors)**:  
     - "When you saw others’ votes, early mistakes snowballed. This is *informational cascades*: People ignore private signals to follow the crowd. Dependence comes through social copying, not evidence."  
     - **Data Spotlight**: Highlight a round where an early lead swayed votes. Accuracy drops further (likely ~50-60%).  

  4. **Two-Tier (Information Loss in Hierarchy)**:  
     - "Small juries lost information by compressing diverse votes into one verdict. The chair’s subcommittees might concentrate expertise, but they also concentrate error. Hierarchy trades independence for efficiency."  
     - **Data Spotlight**: Compare group accuracy (likely ~50-60%) to baseline.  

  5. **Confidence Wrinkle (Self-Report ≠ Competence)**:  
     - "Confident voters weren’t more accurate—they just *felt* sure. Weighting votes by confidence rewarded overestimation, not skill."  
     - **Data Spotlight**: Show confident voters’ accuracy (likely ~60%, same as others).  

  **Addressing Challenges**:  
  - **If Results Backfire**:  
    - *Baseline group wrong?*: "Even good procedures fail sometimes. Look at the *pattern* across rounds."  
    - *Deference/Two-Tier outperforms?*: "Small samples create noise. Stress that theory predicts degradation—and real hiring committees face this risk."  
  - **Students Figure It Out**: "If asked, say: ‘We’re testing how group rules affect accuracy. Your job is to be honest—don’t overthink.’"  
  - **One Super-Accurate Student**: "Note how the group *still* outperformed them on average. No one is reliably perfect."  

  **What the Game Can’t Show**:  
  - **Asymptotics**: "We can’t simulate huge groups where majority rule nears perfection."  
  - **Discussion ≠ Deference**: "Real discussion shares *reasons*, not just votes. It can *improve* accuracy by refining ideas—unlike our Deference condition, which stripped out dialogue."  

  ---

  **Headline: Pairing students to observe identical evidence forces correlated errors that the group feels as a tangible drop in accuracy, making dependence visceral before it has a name.**
