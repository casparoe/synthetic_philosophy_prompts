prompt: |-
  I'm trying to work out what I actually think about higher-order evidence, going by gut on cases, and I'd like a principle that fits them rather than a tour of the literature.

  - I do a fiddly bit of mental arithmetic, get 47, then find out I'd been awake for 30 hours: yeah, downgrade, probably just suspend.
  - An expert I respect, who has seen the same working, says it's 49: downgrade somewhat, but not all the way, and I don't feel I should simply defer.
  - A thousand people online say it's 49: barely moves me, even though there are far more of them than one expert. I know that sits badly with the last one and I can't say why they differ.
  - A bloke who tells everybody they've had too much to drink tells me I've had too much to drink, and I counted my own drinks: does nothing, or next to nothing.
  - Maybe my reasoning is unreliable full stop: also does nothing. But that's odd, given case one moves me a lot, and the difference can't just be a matter of degree.
  - A study reports that people who learn they might be biased overcorrect, so that responding to it properly means partly discounting it. No idea what to do here. It feels like it should partly cancel itself, but I don't know what cancelling would even consist in.
  - I'd already sent the email with 47 in it before I found out about the all-nighter: I feel I should lower my confidence but not redo the action, which suggests confidence and action come apart in a way I can't state.
  - And in a couple of these I end up still believing the thing at full strength while thinking I shouldn't. Is that just straightforwardly irrational, or is there room for a sensible akratic believer?

  Is there one principle — something about when higher-order evidence defeats versus when it's just noise — that gets most of these, and which of my verdicts does it force me to drop? And what does it say about the one I keep going in circles on: I learn that everyone in my field, including the expert in case two, was trained to make exactly the mistake I just made, so there's nobody left to appeal to who isn't already inside the problem. That isn't global scepticism and it isn't one dodgy occasion either, and I definately can't tell whether it should behave like case one or like case five.
reasoning: |-
  Okay, let me try to figure out what the user is really asking here. They want a principle that explains their gut reactions to various higher-order evidence scenarios without getting into the literature. The cases they listed show a pattern: sometimes they downgrade their confidence, sometimes not. The key is to find a principle that captures this pattern.

  First, looking at the cases. When they’re sleep-deprived (case 1), they suspend judgment. But when an expert says they’re wrong (case 2), they only partially downgrade. A thousand people online (case 3) barely affect them. That’s interesting because intuitively, more people should have more weight, but they don’t. Then there’s the unreliable bloke (case 4) and global unreliability (case 5)—both don’t move them. The sleep-deprivation case moves them a lot, but global unreliability doesn’t. Why?

  The user mentions that the difference between case 1 and 5 can’t just be degree. So maybe it’s about specificity. Case 1 is a specific, localized reason to doubt their current reasoning. Case 5 is global and abstract. Specific doubts are actionable; global ones aren’t. That makes sense. The expert (case 2) is more specific than the crowd (case 3) because the expert reviewed their work. The crowd doesn’t have that context, so it’s just noise. 

  Then there’s the study about overcorrection (case 6). The user feels it should cancel itself. But how? If the study says people overcorrect, and they know this, they might underreact to the evidence to compensate. But that’s messy. The principle here could be that higher-order evidence must be actionable. If it leads to an infinite regress (like adjusting for overcorrection), it’s not useful, so they ignore it. 

  The sent email case (case 7) shows confidence and action can come apart. They can’t undo the action, so they adjust confidence instead. The principle might separate belief from practical commitment. Once an action is taken, confidence adjustments don’t change that, but they inform future actions. 

  Akrasia (case 8) is tricky. Believing something while thinking they shouldn’t. The principle might allow this if the doubt isn’t specific enough. If they can’t pinpoint the error, they stick with their belief but acknowledge the doubt. 

  The last scenario: everyone in their field is trained to make the same mistake. Is this like case 1 or 5? It’s not global skepticism, but it’s also not a one-off. Specificity applies here—it’s a specific error tied to their training. But who can they appeal to? The principle would require actionable doubt. If there’s no one reliable to consult, they have to use their best judgment, perhaps downgrade confidence without deferring. 

  So the core principle is **actionable specificity**. Higher-order evidence matters only if it provides a specific reason to doubt the current process and can be acted upon. This explains why sleep deprivation (specific impairment) matters more than global unreliability (too vague). The expert’s input is specific to their work, while the crowd isn’t. The overcorrection study isn’t actionable due to regress. The field-wide training error is specific but not actionable since no one is reliable. They might downgrade but not defer, similar to case 2. 

  The user’s verdicts mostly align. They might need to reconsider case 5 (global unreliability not affecting them) as consistent with the principle. Case 3 (crowd not moving them) also fits. The akrasia in case 8 might be acceptable under this principle. The biggest challenge is the field-wide error case, but actionable specificity handles it by saying they should downgrade but not fully defer since there’s no better alternative.
answer: |-
  Based on your gut reactions, a unifying principle emerges: **Higher-order evidence (HOE) is significant only when it provides a *specific, actionable reason to doubt the reliability of your current cognitive process* in this instance.** HOE that's too vague, global, contradictory, or inactionable should be largely ignored.

  Here's how this principle handles your cases and resolves tensions:

  1.  **Sleep Deprivation (30 hours awake):** **Downgrade/Suspend.** *Specific, actionable doubt:* You know sleep deprivation *specifically impairs* concentration, working memory, and calculation accuracy. You can act on this by rechecking later or deferring.
  2.  **Respected Expert Disagrees:** **Partial Downgrade.** *Specific, actionable doubt:* The expert reviewed *your specific working*. This targets the reliability of *this reasoning process*. Action: Re-examine your steps carefully, looking for *specific* errors the expert might have spotted. You don't fully defer because you retain access to the first-order evidence (your calculation).
  3.  **Thousand People Online:** **Barely Moves You.** *Not specific, not actionable.* They haven't seen your work. Their disagreement is generic noise. You have no *specific* reason to doubt *your process* beyond "others disagree," which isn't a reason targeting your reasoning's flaws. Action: Little to none – you can't meaningfully act on this vague dissent.
  4.  **Known Unreliable Bloke:** **Does Nothing.** *Not credible, not actionable.* His accusation lacks credibility *specifically* on this topic (drunkenness) based on his track record. No *specific* doubt about *your process* (counting drinks) is introduced. Action: Ignore.
  5.  **Global Unreliability:** **Does Nothing.** *Too vague, not actionable.* "Maybe I'm unreliable full stop" doesn't *specifically* target *this* reasoning process or provide a *mechanism* for error here. It's paralyzing and offers no path for correction. Action: None possible or rational. (Contrasts with case 1 because sleep deprivation provides a *specific mechanism* for error relevant to calculation).
  6.  **Study on Overcorrection:** **Discount Itself Slightly (Cancel Loop).** *Self-undermining, action complex.* The study suggests the *typical response* to bias evidence is itself unreliable (overcorrection). Applying it naively risks error. Action: The rational response is to *modestly temper* the weight you give *this specific piece of HOE* (the study itself), recognizing the potential for overreaction, perhaps aiming for a *very mild* downward adjustment acknowledging the *possibility* of bias without overcorrecting. It doesn't cancel perfectly but mitigates its own force.
  7.  **Email Sent Before HOE:** **Lower Confidence, Not Redo Action.** *Actionability defines the response.* The HOE (sleep deprivation) still gives a *specific, actionable reason* to doubt the *reliability of the belief* (47). However, the *action* (sending the email) is irrevocable. Actionability separates belief revision (downgrade confidence) from practical action (can't unsend). You manage your *current* epistemic state for *future* actions.
  8.  **Akrasia ("I believe but think I shouldn't"):** **Possibly Sensible.** *When HOE is non-specific.* If the HOE creates doubt but fails to provide a *specific, actionable reason* to pinpoint an error *in this reasoning* (like Case 5 or aspects of Case 6), it can be rational to retain the belief ("47 seems correct based on my check") while acknowledging the higher-order uncertainty ("but my judgment under these conditions is suspect"). This is *not* ideal but can be the least bad option when HOE is vague.

  **The Principle in Action: Actionable Specificity**
  *   **Wins:** HOE must point to a *specific flaw* in the *current reasoning process* and suggest a *concrete corrective action* (recheck, defer to specific expertise, wait for better conditions).
  *   **Loses:** Generic disagreement, global skepticism, untargeted accusations, self-undermining loops without a stable exit, evidence about irrevocable past actions.

  **Forcing a Verdict Drop?** Your reaction to the **Thousand People Online (Case 3)** clashes most with standard Bayesian or "strength in numbers" approaches. The principle forces you to *stick with your gut* here: vague mass disagreement, without access to your reasoning, is just noise. It doesn't provide *actionable specific doubt*.

  **The Field-Wide Training Error: Case 1 or Case 5?**
  This is the hardest. The principle says: **Downgrade significantly, but don't fully defer (like Case 1), not ignore (like Case 5).**

  *   **Why not Case 5 (Ignore)?** It's *specific*: it targets a *particular type of error* ("exactly the mistake I just made") rooted in a *specific cause* (shared training). It *is* actionable in principle: scrutinize the specific step where the training-induced error likely occurred, look for alternative methods not taught in your field, seek perspectives from *other fields* not subject to this training. It creates *strong, targeted doubt*.
  *   **Why not Case 1 (Full Suspend/Defer)?** Because *there's no reliable "later" or "someone else" to defer to within the system*. Full deference is impossible/pointless. Deferring to another insider just repeats the problem. Waiting won't fix the ingrained error.
  *   **The Rational Response (Actionable Specificity):**
      1.  **Significantly Downgrade Confidence:** The HOE provides powerful, specific evidence that your reasoning process is systematically flawed *on this very point*.
      2.  **Scrutinize the Specific Step:** Focus intensely on the part of the calculation/resoning where the training-induced error is predicted to occur. Look for hidden assumptions or flawed techniques instilled by the training.
      3.  **Seek External Perspectives:** If possible, consult methods or experts from *outside* your field who weren't subject to this training.
      4.  **Acknowledge the Systemic Limitation:** Recognize that your confidence is fundamentally limited *on this specific type of problem* due to the HOE, even if you can't find the exact error. You might conclude "This is the best I can do given my training, but I know that training primes me for error here, so my confidence is low."
      5.  **Don't Defer Internally:** Deferring to another identically trained expert is irrational – their process is equally suspect on this point.

  This maintains the core idea: the HOE is potent because it's *specific* (targets the mistake and its cause) and *actionable* (focus scrutiny, seek external input, manage confidence level), even if a perfect corrective action (finding the error or deferring reliably) is unavailable. It behaves *like* Case 1 in demanding a significant revision due to specific process doubt, but *unlike* Case 1 in not offering a clean path to resolution via time or deference, forcing a more complex epistemic management strategy. It’s clearly distinct from Case 5 because the doubt is tightly targeted and prompts specific investigative actions, not just global paralysis.
