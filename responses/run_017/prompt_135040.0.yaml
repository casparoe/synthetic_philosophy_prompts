prompt: |-
  Hey — I'm applying for a one-year dissertation fellowship and need a proposal, one page, 600 words max, and I could use help getting the framing straight. I've been chewing on the Friedman thing — the move that false assumptions don't matter as long as the model predicts well — and on the obvious reply that assumptions have to be approximately true or derivable from something truer. My half-formed hunch is that both sides quietly assume there's a less-idealized version of the model you can walk toward, so that 'just de-idealize it and check' is always available in principle. In physics that's roughly right; I do most of my work on population-biology models with some econ on the side, and there you usually have no truer background theory to converge to, so neither the defence nor the critique has anything to cash itself out in, and the debate just cycles.

  What I want to propose instead is judging an idealization by what happens when you swap it for a different, incompatible false one and the model's successes survive — call it swap-robustness. My claim would be that in the cases where everyone agrees an idealization is benign, robustness across swaps is what's actually doing the work, not predictive success as such.

  Write it up with: the question stated precisely enough that it has a determinate answer; why the existing positions leave it open; a month-by-month method that's case-based (one physics case where de-idealization genuinely works, one biology case where it doesn't); what a positive result would look like versus what would count as the project failing; and an honest note on scope for one year. No citations or reading list, I'll fill those in myself.
