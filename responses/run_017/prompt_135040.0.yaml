answer: |-
  Here's a one-page proposal draft focusing your core insight into the required structure (~550 words):

  ---

  **Project Title:** Swap-Robustness: Evaluating Idealizations Beyond Predictive Success and De-Idealization

  **Research Question:** In scientific modeling, does the *robustness* of a model's core success across incompatible idealization swaps (replacing one false assumption with a different, incompatible false assumption) provide a superior criterion for judging that idealization "benign" compared to either predictive success alone (Friedman) or the availability of de-idealization paths (common critique), particularly in domains lacking convergent background theories?

  **Problem & Gap:** Milton Friedman's instrumentalism argues a model's assumptions ("idealizations") need not be realistic if it predicts well. Critics counter that assumptions must be "approximately true" or derivable from truer theories via de-idealization. **Both positions tacitly assume a convergent path towards less idealized, truer background theories exists.** This is plausible in physics (e.g., ideal gas law de-idealized to van der Waals via molecular theory) but often absent in population biology, economics, or ecology. Here, core assumptions (e.g., random mixing, fixed preferences, infinite populations) may be fundamentally false, *and* there is no established "truer" theory from which they can be derived as approximations. Consequently, the Friedman debate cycles indeterminately, leaving a critical gap: **How *do* we distinguish benign from pernicious idealizations in domains lacking convergent background theories?**

  **Core Hypothesis:** Benign idealizations are characterized by "swap-robustness": the model's core explanatory/predictive successes persist when the specific false assumption is replaced by a *different*, *incompatible* false assumption, indicating the success relies on structural features deeper than the specific idealization. Predictive success alone is insufficient; robustness across incompatible swaps provides the missing criterion when de-idealization paths are blocked.

  **Methodology (Case-Based; 12 Months):**
  1.  **Months 1-3:** Literature & Framework. Synthesize Friedman debate critiques; formally define "incompatible idealization swap" and "swap-robustness"; identify physics/biology candidate models.
  2.  **Months 4-6:** Physics Case Study (De-Idealization Works). Analyze a standard physics model (e.g., harmonic oscillator with/without damping). Demonstrate availability of de-idealization path (e.g., adding friction terms derivable from Newtonian mechanics). *Test Hypothesis:* Show swap-robustness (e.g., swapping linear spring assumption for a different idealization like small-angle pendulum) also holds, but is *redundant* due to available de-idealization.
  3.  **Months 7-9:** Biology Case Study (De-Idealization Blocked). Analyze a canonical model lacking convergent background theory (e.g., Lotka-Volterra predator-prey with random encounters). Show de-idealization attempts (e.g., adding spatial structure, different functional responses) are non-convergent "sideways" moves, not derivation from a truer theory. *Test Hypothesis:* Rigorously test swap-robustness – does the core qualitative success (oscillations) survive replacing "random encounters" with an *incompatible* false assumption (e.g., fixed territory boundaries with perfect mixing within)? If yes, it demonstrates robustness as the functional criterion.
  4.  **Months 10-12:** Analysis, Synthesis & Write-up. Compare cases: Does swap-robustness uniquely resolve the indeterminacy in the biology case? Develop criteria for evaluating robustness; articulate implications for modeling practice and philosophy of science; draft dissertation chapters.

  **Success Conditions:**
  *   **Positive Result:** Demonstrated that in the biology case (and potentially similar economics models), swap-robustness clearly distinguishes the benign core idealization (e.g., population-level interaction dynamics) from specific false assumptions (e.g., random encounters), where predictive success alone is ambiguous and de-idealization paths are blocked. Robustness emerges as the operative epistemic virtue.
  *   **Negative Result/Project Failure:** The chosen biology case shows no significant robustness across plausible incompatible swaps, or robustness correlates perfectly with predictive success alone, failing to add independent value. Robustness might be too rare or ill-defined to serve as a general criterion.

  **Scope & Feasibility (One Year):** This project establishes the *conceptual framework* of swap-robustness and demonstrates its *potential* to resolve the identified gap through detailed case comparisons. It provides a proof-of-concept, not a comprehensive theory of idealization. It focuses on 2-3 paradigmatic cases to ensure depth within the timeframe. Identifying genuinely "incompatible" swaps requires careful philosophical analysis integrated with model exploration, achievable in 12 months. Broader application across numerous domains is beyond scope.

  ---

  **Key Strengths of this Framing:**

  1.  **Sharply Defined Question:** Focuses on the *criterion* for benign idealization, specifically in the gap domain you identified.
  2.  **Clear Gap Identification:** Explicitly shows how the reliance on de-idealization *by both sides* renders the debate indeterminate in key domains.
  3.  **Novel Core Concept:** "Swap-robustness" is clearly defined as the central innovative contribution.
  4.  **Contrastive Methodology:** The case studies are directly chosen to test the hypothesis against the background theory availability condition.
  5.  **Actionable Success/Failure:** Defines clear, achievable outcomes for a one-year project.
  6.  **Honest Scope:** Acknowledges the groundwork nature of the project.
  7.  **Interdisciplinary Appeal:** Connects philosophy to concrete modeling practices in physics and biology.

  **Before Finalizing:**

  *   **Refine Case Choices:** Ensure your specific physics/biology examples fit perfectly. Be ready to name them briefly if asked (e.g., "harmonic oscillator physics; Lotka-Volterra ecology").
  *   **"Incompatible" Nuance:** Think carefully about how you'll rigorously define and justify "incompatible" swaps in each case.
  *   **"Core Success":** Be precise about what aspect of the model's output must survive the swap (e.g., oscillation *qualitative pattern* in LV, not precise amplitude/timing).

  This structure presents a focused, original, and feasible project that directly tackles the philosophical impasse you identified using a compelling new conceptual tool. Good luck!
