prompt: |-
  I clerk for a statutory committee that signs off wellbeing impact assessments for new regulations, and I need to prep the chair for next month's case. Our track record so far:

  - approved insulation funding paid for by a small per-household levy on about 8 million homes, trading lots of tiny losses for fewer winter deaths among poor pensioners;
  - rejected moving a respite-care home — severe loss to six long-stay residents — to give moderate gains to several hundred users of a new community hub;
  - bounced a submission that compared groups using raw 0–10 self-reported happiness scores, on the grounds that people use the scale differently and we need a common unit before any cross-person comparison counts;
  - approved giving the very severely affected priority over the moderately affected even where the total gain was smaller;
  - refused to rule where two options differed only by a fine-grained trade between two broadly similar groups, saying the numbers weren't robust enough to decide.

  New case: a rule that imposes a small permanent amenity loss on roughly 200,000 people (noise, nothing severe) to avert a moderate loss for about 2,000 people who are already worse off at baseline. On any calibration we'd accept, the summed loss comfortably exceeds the summed gain — but those 2,000 each lose something like a tenth of their remaining wellbeing while the 200,000 lose a fraction of a percent each.

  What will we say? I reckon at least three rules fit our precedents: straight absolute-unit aggregation with a priority weight for the worse off and a veto only for severe losses; a proportional, equal-sacrifice sort of comparison where each change is measured against that person's own baseline; and a coarse, partial-comparability rule that only licences obviously-bigger comparisons and sends back anything that needs an exchange rate between severity bands. Tell me what each predicts here, which one we're most likely actually running given the fifth precedent, and the single further case that would separate the survivors. Lead with your bottom line in the first sentence, then the reasoning — no preamble, no restating the question.
reasoning: |-
  Okay, the user is a clerk for a statutory committee dealing with wellbeing impact assessments. They need to prep the chair for an upcoming case and want to predict the committee's decision based on past precedents. Let me start by understanding the precedents they listed.

  First, they approved a small per-household levy that caused tiny losses to many but prevented winter deaths among poor pensioners. That shows aggregation with priority for the severely affected. Second, they rejected moving a respite-care home because six residents would suffer severe losses versus moderate gains for hundreds. So severe losses veto even if aggregated gains are higher. Third, they bounced a submission using raw happiness scores, indicating they need a common unit for comparison. Fourth, they prioritized the severely affected even if total gain is smaller. Fifth, they refused to decide when trade-offs were too fine-grained between similar groups.

  The new case involves a small permanent amenity loss (noise) for 200,000 people versus averting a moderate loss for 2,000 worse-off people. The summed loss exceeds the summed gain, but the 2,000 lose a larger proportion of their wellbeing. The user suggests three possible rules: straight aggregation with priority weighting, proportional comparison based on baseline, or coarse partial comparability.

  Given precedent five, where the committee avoids fine-grained decisions, coarse partial comparability seems most consistent. They only act when comparisons are obvious, otherwise send back. Here, the losses and gains are in different severity bands (small vs. moderate), and the aggregated loss is larger. Precedent two shows a veto for severe losses, but here the losses are small and moderate, not severe. Precedent four prioritized the severely affected, but the beneficiaries here are worse-off but not necessarily severely affected—just experiencing moderate losses. The committee might see this as not a clear enough case to override the aggregated loss.

  The key is precedent five's aversion to fine-grained trade-offs. Since the losses to the 200,000 are small and the gain for the 2,000 is moderate, the difference in severity isn't stark enough. The committee likely rejects the rule under coarse partial comparability. To differentiate between the rules, a case where a small group suffers a severe loss versus a large group's moderate losses would test priority weighting versus coarse comparison. If the committee approves saving the small group despite larger aggregated loss, that confirms priority weighting. If they reject due to unclear severity comparison, it supports coarse partial comparability.
answer: |-
  **Bottom line: The committee will reject this rule under its coarse partial-comparability framework, as it lacks the clear, large-magnitude advantage required by precedents (especially #5).**

  **Reasoning:**  
  1. **Straight aggregation with priority weighting** would approve: The 2,000 worse-off individuals face a *proportionally* larger loss (10% of remaining wellbeing) vs. the 200,000 losing a trivial fraction. Precedent #4 (prioritizing the severely affected) supports weighting their losses more heavily, potentially overriding the negative net gain.  

  2. **Proportional equal-sacrifice comparison** would approve: Measuring losses against individual baselines (precedent #3’s rejection of raw scores implies this) shows the 2,000 sacrificing far more *proportionally* than the 200,000. The large disparity in relative impact favors approval.  

  3. **Coarse partial comparability** (most consistent with precedents) **rejects**: Precedent #5 explicitly rejects fine-grained trades between similar groups. Here:  
     - The loss to 200,000 is "small" (noise), while the averted loss to 2,000 is "moderate."  
     - Precedents distinguish severity bands (#1: "tiny losses" vs. "deaths"; #2: "severe loss" vs. "moderate gains").  
     - A "moderate" loss isn’t severe enough to trigger a veto (like #2’s "severe loss"), but the gap between "small" and "moderate" is too fine for reliable comparison per #5.  
     - The net aggregated loss further undermines approval.  

  **Why coarse partial comparability fits best:**  
  - Precedent #5 is decisive: The committee *refuses to act* without unambiguous, coarse superiority (e.g., large gains for many vs. tiny losses for few, or preventing severe harms). Here, gains/losses span adjacent severity bands with negative net impact—exactly the unclear case they avoid.  
  - Precedent #2 shows severity vetoes apply only to "severe" losses (not "moderate"), and #1/#4 involve extreme disparities. This case lacks comparable clarity.  

  **Case to separate survivors:**  
  A proposal where **500 people avoid a *severe*, life-altering loss (e.g., permanent disability)** by imposing a **small cost on 10 million people** (e.g., minor tax increase).  
  - **Priority weighting approves:** Severe losses dominate regardless of numbers.  
  - **Coarse comparability approves:** "Severe" vs. "small" is a clear, coarse gap (like precedent #1).  
  - **Proportional comparison might reject** if the relative sacrifice of the 10 million is deemed unfairly high (*unlike* the current case).
