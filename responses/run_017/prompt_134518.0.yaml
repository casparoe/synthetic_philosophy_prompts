prompt: |-
  I'm a software engineer by trade — I build data pipelines, no philosophy background beyond a couple of half-finished online courses — and last spring I was picked by sortition for my city's charter review commission, which among other jobs has to decide what recommendation we attach to proposed changes in who counts as a voter in municipal elections. I ended up being the one who keeps the spreadsheet of our decisions, and going back through it I've realised we've been consistent in our verdicts without anyone being able to say what rule we're actually applying. The record so far: we kept the voting age at 18 for mayor and council but approved letting 16- and 17-year-olds vote for the school board only, on the reasoning that they are the ones who have to live with what that board does; we approved the municipal vote for non-citizen residents with at least two years' residence and rejected it for shorter-term residents, and rejected it again for non-resident property and second-home owners who pay city property tax but sleep somewhere else (roughly: you vote where you live); we approved the vote for people held in jail awaiting trial but rejected it, six to three, for people serving felony sentences, with the dissent saying we were punishing people twice; we approved automatic registration and mandatory time off work to vote but rejected a modest fine for abstaining and rejected publishing the names of non-voters, the chair's line being that we can clear the path but we cannot punish people for staying home; and we rejected seven to two a proposal that a parent or guardian could cast one extra ballot per child under sixteen, the majority saying a proxy ballot is the parent's judgment and not the child's. When I've raised the pattern at meetings, three different members have offered three different glosses on it — one says if the city can coerce you then you get a say, another says the vote belongs to people who are in it for the long run and will still be here, a third says it tracks who can form an actual judgment on the question being asked — and none of them has been able to explain why the others are wrong.

  The item in front of us now is a citizen-initiated charter amendment we can't amend, only recommend for or against, with two hundred words of explanation. It would (a) let anyone sixteen or older who has lived in the city thirty days and intends to stay register and vote in all municipal elections, candidates and ballot measures alike, citizen or not, replacing the current eighteen-and-over, citizens-and-two-year-residents rule for city elections; (b) add an official "none of the above" option on every municipal race, counted and published like a candidate, where a majority "none of the above" leaves the office vacant and forces a special election within ninety days; and (c) move any registered voter who skips two consecutive municipal elections to inactive status, requiring re-registration before voting again — no fine, no published list, and you can do it at the polls on the day. Note that part (c) is satisfied by turning up and voting "none of the above".

  What I need from you is this: lay out the two or three (or four) candidate principles that fit our track record just as well as each other, including any I haven't thought of, and say what each of them predicts about each part of this package; give me your best guess at what we should recommend if we want to be consistent with ourselves, with reasons for preferring that over the alternatives and with the closest analog among our own precedents identified; tell me honestly where our precedents genuinely underdetermine the answer and which principle we would be publicly adopting with a yes versus a no, especially given that the parts pull in different directions and we have to vote on it as one thing; and name the further case — the variation on this proposal, or the separate proposal — that would best tell the competing principles apart if we could get it in front of the commission next month. Please don't give me reading lists or citations; I have no library access and I need two hundred words I can stand behind at a public meeting.
reasoning: |-
  Okay, let's tackle this step by step. The user is a software engineer on a city charter review commission, needing to reconcile their past decisions on voter eligibility into coherent principles for a new citizen-initiated amendment. 

  First, I need to map their historical rulings to potential principles. Their pattern shows: 
  - Letting 16-17yos vote only for school boards (directly affected) 
  - Requiring 2-year residency for non-citizens (stability) 
  - Allowing jailed-but-untried voters but not convicted felons (agency vs. punishment) 
  - Rejecting proxy votes for children (no delegation of judgment) 
  - Supporting voting access but opposing coercion (path-clearing)

  Three principles emerge from this: 
  1. **Affected Interest Principle** (vote if policy directly governs you) 
  2. **Stakeholder Continuity Principle** (vote if you'll live with long-term consequences) 
  3. **Autonomous Judgment Principle** (vote if you can form independent views)

  Now applying these to the new proposal: 
  - **Part (a)**: Broad eligibility expansion conflicts with Stakeholder Continuity (short 30-day residency) but aligns with Affected Interest (all residents governed). Autonomous Judgment is ambiguous—16yos may have capacity, but non-citizens? Precedent says mixed. 
  - **Part (b)**: "None of the above" resonates with Autonomous Judgment (protest option) but risks instability (special elections). No direct precedent, though rejecting fines for abstaining suggests valuing expression. 
  - **Part (c)**: Inactive status after non-voting mirrors "path not punishment" logic—consistent with all principles by preserving access while encouraging participation.

  Key tension: Part (a) violates their residency precedent (2-year requirement), while (b) and (c) fit existing patterns. The package forces a trade-off: Affected Interest would accept (a) despite residency, while Stakeholder Continuity would reject it. Past decisions lean toward Stakeholder Continuity (residency rules, rejecting non-resident owners). 

  Recommendation: Against, for consistency. Closest analog is rejecting non-resident taxpayers—you vote where you live long-term. Publicly, a "no" adopts Stakeholder Continuity; "yes" adopts Affected Interest. 

  Test case: Propose a separate amendment allowing 16+yo voting only for climate-related measures. Affected Interest supports it; Stakeholder Continuity rejects it without age/residency limits—clearly splits principles.
answer: |-
  Based on your commission's precedents, here are the three competing principles that equally fit your decisions, their predictions for this proposal, and a recommended path:

  ### Candidate Principles  
  1. **Stakeholder Continuity**: Voting rights require long-term stakes in the community’s future (e.g., rejecting non-resident owners; requiring 2-year residency).  
  2. **Directly Affected Interest**: Those governed by a specific authority should vote for it (e.g., 16-year-olds voting for school boards; jail detainees voting).  
  3. **Autonomous Judgment**: Voters must form independent political judgments without coercion or delegation (e.g., rejecting proxy votes for children; opposing fines for abstaining).  

  ### Predictions for the Proposal  
  - **Part (a)**: Broad eligibility (16+, 30-day residency, non-citizens)  
    - *Stakeholder Continuity*: **Rejects** (30 days is too short; non-citizens’ long-term commitment unclear).  
    - *Affected Interest*: **Supports** (all residents are governed by city policies).  
    - *Autonomous Judgment*: Neutral (assumes 16+ can judge).  
  - **Part (b)**: "None of the above" option  
    - *Stakeholder*: **Rejects** (risks instability via vacant offices).  
    - *Affected Interest*: **Supports** (expresses direct dissatisfaction).  
    - *Autonomous Judgment*: **Strongly Supports** (enhances expressive choice).  
  - **Part (c)**: Inactive status after non-voting  
    - *All principles*: **Support** (clears path without coercion, like rejecting fines; aligns with "no punishment for staying home").  

  ### Recommendation & Consistency  
  **Vote AGAINST the amendment** to stay consistent.  
  - **Why**: Part (a) violates *Stakeholder Continuity*—your strongest precedent (e.g., 2-year residency rule; rejecting non-resident owners). Allowing 30-day residents contradicts requiring "long-run" stakes.  
  - **Closest Analog**: Rejecting non-resident property owners ("vote where you live" implies permanence).  
  - **Inconsistency**: Part (a) is irreconcilable with your residency standards, outweighing alignment on (b) and (c). A "yes" would publicly adopt *Affected Interest* over *Stakeholder Continuity*.  

  ### Where Precedents Underdetermine  
  - Part (b) ("none of the above") has no direct precedent but aligns with *Autonomous Judgment* (no punishment for dissent).  
  - Part (c) is fully consistent—all principles support gentle nudges without coercion.  

  ### Best Test Case to Split Principles  
  Propose: **Allow non-citizen parents to vote *only* in school board elections after 6 months’ residency**.  
  - *Affected Interest*: Supports (governed by schools).  
  - *Stakeholder Continuity*: Rejects (6 months < 2 years).  
  - *Autonomous Judgment*: Neutral (if adults can judge).  

  ### Summary for Your 200 Words  
  > "We recommend AGAINST this amendment. While parts (b) and (c) align with our support for accessible, uncoerced voting, part (a) conflicts with our consistent emphasis on long-term community stakes (e.g., requiring 2-year residency for non-citizens and rejecting non-resident voters). Thirty days is insufficient to establish lasting investment in the city’s future. Though the proposal’s other elements empower voter expression and simplify participation, the package as a whole undermines stability. We cannot endorse it without abandoning the principle that voters should live with their choices long-term."  

  ---  
  **Key Conflict**: Part (a) forces a choice between *Affected Interest* (vote) and *Stakeholder Continuity* (long-term stakes). Your precedents favor the latter. A "no" vote upholds residency as a pillar of your logic.
