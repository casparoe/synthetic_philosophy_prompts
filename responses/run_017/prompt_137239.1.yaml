  Overall, the activity should achieve the goal of showing that the two methods are not equivalent and that they capture different aspects of causation.
answer: |-
  ### **Game Design: "Causal Protocols"**
  **Core Goal:** Create experiential friction between counterfactual and interventionist procedures, showing they answer distinct questions ("What hinged?" vs. "What’s a handle?"). Students discover mismatches, revealing how each theory’s "repair kit" (stepwise dependence, clamping, invariance) resolves edge cases.

  ---

  ### **Materials & Setup**
  1. **Index Cards (Prepared Sets for Each Subgroup):**
     - **Unit Cards (3 sets):** Describe the system, actual run, and allowable questions/trials.  
     - **Verdict Sheets:** Grid with variables (R, P, V for Unit 1; A, B for Unit 2; D for Unit 3) and checkboxes:  
       \[ \begin{array}{c|c|c} \text{Variable} & \text{Cause} & \text{Not a Cause} \\ \hline \text{R} & \square & \square \\ \text{P} & \square & \square \\ \text{V} & \square & \square \\ \end{array} \]  
       *(Repeat for Units 2/3)*.  
     - **Ambient Condition Card (Unit 3 Only):** "Ambient: Cold Night" (fixed for all groups).  
     - **Protocol Cards:**  
       - **Group A (Counterfactual):** "You may ONLY ask: *'In the closest world where [VAR] was [ALT VALUE], with NO other changes, would [OUTCOME] differ?'*"  
       - **Group B (Interventionist):** "You may ONLY run trials: *'Set [VAR] to [VALUE] while clamping [OTHERS] to [VALUES]. What is [OUTCOME]?'*"  

  2. **Group Structure:**  
     - Split class into **Group A (Counterfactual, 11 students)** and **Group B (Interventionist, 11 students)**.  
     - Subgroups of 3-4 within each half (e.g., 3 subgroups per half).  
     - **Pairing for Comparison:** Subgroups pass verdict sheets diagonally (e.g., A1 → B2, A2 → B3, etc.). Use paperclips to attach Unit cards to sheets.  

  3. **Enforcing Protocols:**  
     - **Group A (Counterfactual):**  
       - They submit written questions (e.g., "If A were LOW, would S be LOW?").  
       - **Instructor/TA responds with precomputed YES/NO** (no explanations).  
       - *Red Flag:* If questions imply interventions (e.g., "If I set A to LOW..."), reject and remind: "No tampering! Describe natural worlds only."  
     - **Group B (Interventionist):**  
       - They submit trial requests (e.g., "Set A to LOW, clamp B to LOW → Outcome?").  
       - **Instructor/TA computes outcomes based on structural equations** (see *Unit Rules* below).  
       - *Red Flag:* If trials omit clamping (e.g., "Set A to LOW" without clamping B), respond with: "Unclamped variables may change. Specify clamps!"  

  ---

  ### **Unit Rules & Precomputed Outcomes**
  *(Instructor Key: Systems are deterministic. "Closest world" assumes minimal change.)*  

  #### **Unit 1: "The Chain" (Agreement Case)**  
  - **Setup:** River sensor (R) → Pump (P) → Valve (V) → Flood (F). Actual: R=HIGH → P=HIGH → V=HIGH → F=HIGH.  
  - **Rules:**  
    - F = V; V = P; P = R.  
    - **Group A Questions/Answers:**  
      - R LOW? → P= LOW → V=LOW → F=LOW → **YES (Cause)**  
      - P LOW? → V=LOW → F=LOW → **YES (Cause)**  
      - V LOW? → F=LOW → **YES (Cause)**  
    - **Group B Trials:**  
      - Setting R/P/V to LOW (any clamps) → F=LOW.  
      - *Clamping irrelevant (no confounders).*  
  - **Goal:** Both groups mark R, P, V as causes. Shows transitivity works in both.  

  #### **Unit 2: "Two Watchdogs" (Mismatch Case)**  
  - **Setup:** Trips A and B BOTH activate siren S (S = A OR B). Actual: A=TRIPPED, B=TRIPPED → S=ON.  
  - **Rules:**  
    - S = A OR B. Worlds where A/B differ require minimal change (no backtracking).  
    - **Group A Questions/Answers:**  
      - A NOT TRIPPED? → B still TRIPPED → S=ON → **NO CHANGE → Not Cause**  
      - B NOT TRIPPED? → A still TRIPPED → S=ON → **NO CHANGE → Not Cause**  
    - **Group B Trials:**  
      - Set A to NOT TRIPPED, clamp B to NOT TRIPPED → S=OFF → **Cause**  
      - Set B to NOT TRIPPED, clamp A to NOT TRIPPED → S=OFF → **Cause**  
      - *Without clamping:* Set A to NOT TRIPPED → B still TRIPPED → S=ON (no change).  
  - **Goal:** Group A says "neither cause"; Group B says "both causes." Highlights clamping vs. minimal-change.  

  #### **Unit 3: "The Fragile One" (Invariance Case)**  
  - **Setup:** Damper (D) causes fire (F) ONLY on cold nights (F = D SHUT AND COLD). Actual: COLD, D=SHUT → F=YES.  
  - **Rules:**  
    - F = D SHUT AND AMBIENT = COLD.  
    - **Group A Questions/Answers:**  
      - D OPEN? → F=NO (since ambient still cold) → **YES (Cause)**  
    - **Group B Trials:**  
      - Set D to OPEN (ambient cold) → F=NO → **Cause**  
      - *But:* If they ask: "Set D to OPEN, clamp ambient to HOT" → F=NO?  
        - **Critical:** Ambient is fixed ("drawn card"). They *cannot* clamp it. Respond: "Ambient is background; cannot clamp."  
  - **Goal:** Both groups mark D as cause. Invariance is not required for basic interventionism, but fragility emerges in debrief.  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Intro & Protocol Setup (10 min):**  
     - Assign Groups A/B. Distribute Protocol Cards. Emphasize: "No theory talk—follow your procedure rigidly."  
     - Give Unit 1 cards/verdict sheets.  

  2. **Unit 1: The Chain (15 min):**  
     - Groups work. Instructor circulates, enforces protocols.  
     - Groups pass sheets diagonally. *All see agreement.*  

  3. **Unit 2: Two Watchdogs (25 min):**  
     - Distribute Unit 2 materials.  
     - Group B struggles if they don’t clamp—force them to reclarify ("Specify clamps!").  
     - Pass sheets diagonally. *Mismatch emerges.*  

  4. **Unit 3: The Fragile One (20 min):**  
     - Distribute Unit 3 + ambient cards.  
     - Groups work. Pass sheets. *Agreement on D as cause.*  

  5. **Debrief (20 min):**  
     - Start with reactions: "Where did verdicts clash? Why?"  
     - Map clashes to theories:  
       | **Moment in Game**       | **Theory Concept**                          | **Repair Kit Function**                          |  
       |--------------------------|--------------------------------------------|-------------------------------------------------|  
       | Unit 2 Group A: "Not cause" | Lewis’ minimal change → symmetric overdetermination | *Quasi-dependence fails here*—no chain to latch onto |  
       | Unit 2 Group B: Clamping B | Woodward’s surgical intervention           | Clamping isolates variables, revealing control  |  
       | Unit 3: Both call D cause | Basic interventionism vs. invariance       | Invariance adds "stable relationship" requirement |  
       | Unit 1: Transitivity      | Stepwise dependence (Lewis) / Chaining (Woodward) | Both handle chains, but via different mechanisms |  
     - **Key Insight:** "Lewis asks: *Did this event matter?* Woodward asks: *Can we control outcomes with this?* Different questions → different answers."  
     - Name Lewis/Woodward only at the end.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Group A Slyly Using Interventions:**  
     - *Catch:* Questions like "If I set A to LOW..." → shut down: "No 'I'—describe worlds passively."  
  2. **Group B Forgetting to Clamp (Unit 2):**  
     - *Fix:* When they see no change, ask: "Would clamping other variables change the result?"  
  3. **Unit 3 "Sharp Student" Ambiguity:**  
     - *Risk:* "Add ambient as a variable!" → *Response:* "Ambient is background; it’s not manipulable in this system. Woodward allows non-invariant causes—but should we trust them?" (Debrief fodder).  
  4. **Time Crunch:**  
     - Prioritize Units 1 and 2. Skim Unit 3 if needed—its mismatch is subtler.  

  ---

  ### **Limitations & Uncovered Theory Elements**  
  - **Can’t Reproduce:**  
    - **Lewis’ quasi-dependence:** Hard to simulate without complex preemption. *Workaround:* Briefly explain after Unit 2: "Lewis adds quasi-dependence to handle preemption, but it fails here."  
    - **Woodward’s invariance depth:** The game shows fragility but doesn’t require invariance for causation. *Clarify:* "Woodward uses invariance for *explanatory depth*, not basic causation."  
  - **Unavoidable Simplifications:**  
    - Deterministic systems only (no probability).  
    - "Closest world" is predefined (no context-dependent similarity debates).  

  **Outcome:** Students experience why theories need "repair kits," and leave seeing causation as a fractured, tool-dependent concept. The clash in Unit 2—where Group A feels both answers are wrong—cements the divide.
