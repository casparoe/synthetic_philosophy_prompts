prompt: |-
  I teach an upper-level undergrad seminar on causation -- 22 students, one 90-minute slot, and last week we did the two big families of theories: Lewis-style counterfactual accounts (the effect depending on the actual cause, with chains of stepwise dependence to handle pre-emption) and Woodward-style interventionism (X causes Y if some surgical setting of X moves Y, with an invariance condition riding along). It went fine, but I could tell they filed it as a merely verbal dispute: two definitions of one thing they already have a feeling for. I want to break that. So what I want is a game where the class is split in half and each half gets a *procedure*, not a theory. One half is told they may only ask: in the closest world where this variable had been different, with nothing else tampered with and nothing reaching in, would the outcome have been different? The other half is told they may only run trials: reach in, set one variable to whatever value you like, clamp the others wherever you like, watch whether the output moves. No names, no theory talk up front; they fill in verdict sheets (variable by variable: cause / not a cause) and then discover the sheets don't match. Two room constraints: the desks are bolted down in a grid so groups can't be bigger than four and nobody can really circulate, so any comparison has to work by handing a sheet to the team diagonally behind; and I have index cards, paperclips, a phone timer, and a projector I'd rather not use.

  Here's my rough sketch of three black boxes to run the procedures on -- the setting is a decommissioned relay-logic flood-control cabinet in a water-authority depot, which is arbitrary but gives me concrete named variables: Unit 1, "the chain": river sensor R drives pump command P drives valve V drives the outcome F; actual run has R high and everything downstream following, and I want this one to come out the same on both procedures *including* on transitivity, so that P and V count on both sides and nobody concludes the dividing line is directness. Unit 2, "the two watchdogs": two independent pressure trips A and B, output S = A or B, both tripping on the same millisecond in the actual run and both wired into a single coil, so there's no timing difference and no distinguishing feature of the outcome for a quasi-dependence chain to latch onto. My hope is the world-comparing half ends up saying neither A nor B caused S while the trial-running half, because they're allowed to clamp B low, ends up saying both did -- and I want both answers to feel slightly wrong to them. Unit 3, "the fragile one": damper position D and a short circuit, where the sign of the relation flips with the ambient conditions on a drawn background card; in the actual run it was a cold night, D was stuck shut, the short happened, and had D been open it wouldn't have. I want hinge-yes / lever-no here, but I'm not definately sure my version survives contact with a sharp student who says the fix is just to add ambient temperature to the model and the invariance comes back. Maybe that's a feature rather than a bug, but tell me if the case needs rebuilding.

  What I need from you: the actual rules and materials, including how I enforce the protocols (my big worry is the world-comparing side quietly sneaking interventions in, since that's just how people reason); what the verdict sheets should look like and how the two sides should be paired up given the bolted desks; a timeline for the 90 minutes with roughly 15 minutes of debrief at the end; and a debrief that maps particular moments in the game onto particular bits of the theories -- the stepwise-dependence machinery, the quasi-dependence repair, what clamping is doing for the interventionist, and the invariance condition -- but only naming Lewis and Woodward once they've already felt the collision. I want them walking out seeing that the two procedures aren't two tests of one relation but two different questions (what this outcome hinged on vs. what's a handle I can pull), and that each theory's repair kit is doing real load-bearing work rather than tidying up边缘 cases. Also: what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of each theory the game can't reproduce at all and I'll just have to say out loud.
