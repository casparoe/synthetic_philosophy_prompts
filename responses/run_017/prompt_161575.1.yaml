  What I'd like is a decision tree built from the logical space first and the position names second: about six branching questions, each phrased as a concrete case with actual quantities in it (numbers of beings, intensities, durations, who exists either way) rather than as an abstract does-suffering-matter-more-than-happiness item — someone should be able to answer every node without knowing whether the branch leads to pure negative utilitarianism, a lexical-threshold view, an asymmetry-based antinatalism, a tranquilist view, a satisficing version, a two-level version, a deontically side-constrained version, or whatever. Aim for ten to fourteen leaves; name the leaf where a decent name exists and mark it unoccupied or unnamed otherwise, and for the unoccupied ones say in a line whether nobody lives there because the combination is incoherent, merely unattractive, or just unexplored.

  The distinctions I want doing the work, unless you think one of them is redundant (say so and explain): (1) how suffering trades off against happiness at all — lexical priority, a fixed exchange rate, a rate that changes with how intense the suffering is, or a threshold below which happiness can compensate; (2) whether bringing into existence a being whose life is net-positive has positive, neutral or negative value, and whether that comes from an asymmetry in creation cases or from the view being person-affecting; (3) whether the painless ending of a life is a benefit or a harm, and crucially what the baseline is — relative to what would otherwise have happened to that being, or relative to its never existing; (4) whether there are deontic side constraints that survive aggregation, or whether any means can be bought with enough suffering avoided; (5) scope — humans only, all vertebrates, down to insects and other uncertain cases, plus possible artificial minds — and how to weigh beings whose sentience we're unsure about (straight expected value, some nonlinear weighting, a precautionary rule); (6) demandingness and level — unlimited demands, satisficing, or a split between the criterion of rightness and the decision procedure people should actually use; (7) temporal scope and risk — whether far-future suffering counts the same, and whether uncertainty about future suffering is handled by expected-suffering minimization or by risk-aversion about catastrophic outcomes.

