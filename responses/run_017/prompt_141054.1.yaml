     - A. The universe’s total state *grounds* facts about its parts.  
     - B. Facts about the parts *ground* the universe’s total state.  

  2. **Absences as Grounds**  
     A tower remains standing. Is it true that the tower stands partly *because* nothing is pushing it over?  
     - A. Yes—absences (like "no wind") can be genuine grounds.  
     - B. No—absences cannot serve as grounds; only positive facts can.  

  3. **Mutual Grounding**  
     Consider: (i) "This glass is fragile" and (ii) "If struck, this glass would shatter." Could (i) and (ii) ground each other?  
     - A. Yes—grounding can be bidirectional.  
     - B. No—grounding must be asymmetric (if A grounds B, B cannot ground A).  

  4. **Infinite Descent**  
     Could grounding chains descend infinitely? (e.g., Fact A is grounded in B, B in C, C in D, ... forever).  
     - A. Yes—infinite chains are metaphysically possible.  
     - B. No—grounding must be well-founded (no infinite chains).  

  5. **Necessary from Contingent**  
     Could a necessary truth (e.g., "2+2=4") be grounded in a contingent fact (e.g., "Mathematicians accept 2+2=4")?  
     - A. Yes—necessary facts can be grounded in contingent ones.  
     - B. No—grounding preserves modality; necessary truths can’t depend on contingencies.  

  6. **Grounding ≠ Dependence**  
     Suppose a table’s existence is grounded in its particles being arranged table-wise. Could this grounding *fail* to imply the table ontologically depends on the particles?  
     - A. No—grounding *always* implies ontological dependence.  
     - B. Yes—grounding can be purely explanatory without ontological dependence.  

  7. **Fundamental Dependence**  
     If two entities are fundamental (ungrounded), could one still depend on the other? (e.g., Entity X exists *because of* Entity Y, though both are fundamental).  
     - A. Yes—fundamental things can depend on one another.  
     - B. No—fundamentality requires full independence; no dependencies allowed.  

  8. **Grounding & Necessity**  
     If Fact A grounds Fact B, must A *necessitate* B? (i.e., in all worlds where A holds, B holds).  
     - A. Yes—grounding entails necessitation.  
     - B. No—grounding can be non-necessitating (e.g., contingent grounding).  

  9. **Primitive or Reducible?**  
     Is grounding a basic, irreducible feature of reality?  
     - A. Yes—grounding is a primitive, hyperintensional relation.  
     - B. No—grounding reduces to other relations (e.g., causation, supervenience).  

  10. **Fundamental Level**  
      Must reality have a fundamental "layer" (i.e., ungrounded facts that ground all else)?  
      - A. Yes—there must be an ultimate ground.  
      - B. No—reality might lack a fundamental level (e.g., infinite descent/circles).  

