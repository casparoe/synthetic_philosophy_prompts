prompt: |-
  I'm in a philosophy-of-science reading group — six of us, one econ PhD student who builds models for a living, one historian of science, the rest grad students — and we've spent something like eight weeks on the same argument about unrealistic assumptions in scientific models and nobody has moved anybody. The Friedman side (you know the one, from his 1953 essay on positive economics, the bit people nickname the F-twist) says a theory is judged by its predictions, its assumptions aren't in the business of describing anything, and unrealisticness is often a positive virtue because you buy generality and tractability with it; the examples get dragged out every time, the billiard player who plays as if he knew the trigonometric solution, the tree whose leaves end up distributed as if each leaf were maximizing its own sunlight, and the point is supposed to be that as-if reasoning can get the answer right exactly by not tracking the real mechanism. The other side says fine, that works for predicting inside the domain you fit on, but the second you want an explanation, or you want to move the model to a new setting, or you want to use it to design a policy, the falsehoods propagate and you can't tell which of your results are artifacts of the setup. My gut is with the second side, but I've noticed I only ever have intuitions, and the econ student keeps saying we're asking the wrong question, which I find annoying partly because I half believe it.

  So here's the thing I actually want you to get your teeth into, because I think it's where the disagreement is hiding and I've never seen anybody say it. I've started sorting the false assumptions inside models into three kinds. Relaxable ones: false, but you can perturb toward realism and the result survives, like assuming zero transport costs when transport costs are small. Load-bearing ones: the result doesn't degrade when you relax them, it flips or vanishes, so the finding was made by the assumption. And a third kind I have no good name for, substitutive ones, where the false claim isn't standing in for a true claim you could write down if you were cleverer — it's standing in for something genuinely unformulable for us, like treating a whole population of heterogeneous agents as one representative agent, or assuming perfect mixing in an epidemic model: there is no sequence of small relaxations that walks you from the false description to the true one, so the assumption isn't even in the business of being approximately true. My hypothesis is that the decades-long argument is three arguments stacked under one heading: about relaxable assumptions the instrumentalist is straightforwardly right and the critic is making noise; about load-bearing ones the critic is straightforwardly right and the instrumentalist is changing the subject; and about substitutive ones it's a different question entirely that neither side has vocabulary for, something about whether a model is a claim about the world or a tool for acting on it. The historian in our group says my three-way thing is just the old point about de-idealizability dressed up in new words, which I don't think is right but I can't say why.

  Give me a diagnosis, not a verdict and not a survey of positions. Is my three-way split a real distinction or does it collapse under pressure, and if it collapses, where exactly? Is the stalemate mostly verbal — a fight about what counts as the assumptions of a theory in the first place, the axioms, the initial conditions, the bridge principles, the ceteris paribus clause — or is it a clash about what models are for, prediction versus explanation versus intervention, or a hidden empirical question about how common each of my three kinds actually is in practicing scientists' models, or just bedrock disagreement about what understanding amounts to that neither side can argue for? Please actually work my cases rather than gesturing at them: a housing-market model that treats every landlord as an identical price-taker, forecasts average city rents beautifully for ten years, and then gets used by the city council to predict what happens under a rent cap, where the answer turns out to hinge entirely on the heterogeneity the model assumed away; and the perfect-mixing epidemic model that gets the early curve shape right and is used to size hospital capacity even though nobody for a second believes anyone is perfectly mixed. And then, given whatever you think this disagreement is: what would count as progress on it — a distinction like the one I'm fumbling at, some formal result about when relaxing an assumption changes a conclusion, a change of question, an empirical study of modeling practice — or should we expect none, and why?
reasoning: |-
  Okay, I need to really dig into this user's query. They're in a philosophy-of-science reading group that's been stuck for eight weeks on unrealistic assumptions in models, specifically the Friedman instrumentalist view versus a more critical one. The user has proposed a three-way categorization of false assumptions: relaxable, load-bearing, and substitutive. They want to know if this distinction holds up and where the real disagreement lies.

  First, I should unpack their categories. Relaxable assumptions seem robust to small changes; load-bearing ones cause the model to collapse when altered; substitutive ones can't be made realistic step-by-step. The user thinks the debate conflates these, leading to stalemate. The historian in their group says it's just de-idealizability, but the user disagrees. 

  I need to test each category against their examples. The housing market model with identical landlords: here, heterogeneity is substitutive. The model works until a rent cap is introduced, which requires understanding individual differences. Perfect mixing in epidemics is also substitutive—it stands in for complex, unmodeled interactions. 

  For relaxable assumptions, like zero transport costs, small changes don't break the model. Load-bearing assumptions, if relaxed, flip results. The key difference between substitutive and relaxable is whether you can approach reality through small steps. Substitutive assumptions aren't approximations; they're placeholders for something inherently unformalizable. 

  The user’s deeper need might be to resolve the group's deadlock by clarifying where each side is correct. Friedman's view works for relaxable assumptions but fails for load-bearing ones. Substitutive assumptions are a different beast—they're about enabling computation when reality is too complex. Here, models are tools, not truth-claims. 

  The stalemate isn't just verbal. It's about the purpose of models: prediction vs. explanation vs. intervention. Friedman focuses on prediction, while critics care about structural understanding for policy. The empirical question of how common each type is matters too. If most assumptions are substitutive, instrumentalism might be pragmatic. 

  Progress could come from case studies analyzing how assumptions function in real models. Formal results on assumption sensitivity might help, but substitutive assumptions resist formalization. Shifting the question from "true or false" to "what is this model for?" could break the deadlock. The user’s distinction adds nuance, showing that the debate needs to acknowledge different roles assumptions play.
answer: |-
  Your three-way distinction isn't just "dressed up de-idealizability" — it's a sharp, operational lens that cuts to the core of the stalemate. The breakdown holds under pressure, but its power lies in exposing **why** the argument persists: **the sides are talking past each other because they're implicitly prioritizing different types of assumptions in their exemplars, and have incompatible ontologies for what substitutive assumptions *are*.** Let's dissect it:

  1.  **The Distinction's Resilience (It Doesn't Collapse):**
      *   **Relaxable:** Your transport cost example is perfect. The instrumentalist (Friedmanite) wins here *for prediction within the fitted domain*. Criticizing the falsity of the assumption *in isolation* *is* noise if the predictions hold. The perturbation test defines this category.
      *   **Load-Bearing:** The rent cap example *exactly* illustrates this. The identical-agent assumption isn't just false; it *creates* the model's specific prediction about the cap's effect. Relaxing it (adding heterogeneity) fundamentally changes the mechanism and likely the outcome prediction. The critic wins: relying on this model for *intervention* is disastrous. The result vanishing/flipping under perturbation is diagnostic.
      *   **Substitutive:** This is the crux. Perfect mixing or the representative agent aren't approximations of a *specific, formulable* truth ("imperfect mixing" or "slightly heterogeneous agents"). They are **computational proxies for irreducible complexity**. There *is* no sequence of small steps to "true mixing" or "true heterogeneity" because the true state is a high-dimensional mess we *cannot* tractably model. The perturbation test *fails by design*.

  2.  **Where the Stalemate Hides & Why Your Distinction Exposes It:**
      *   **Friedmanites Focus on Relaxable/Substitutive for *Prediction*:** They point to billiards, leaves, or simple market models *within their predictive domain* (often relaxable, sometimes substitutive working predictively). Their core claim ("assumptions don't matter, predictions do") *works* for these types *when the goal is specific predictions*. They treat substitutive assumptions *as if* they were relaxable idealizations ("close enough for predictive purposes").
      *   **Critics Focus on Load-Bearing/Substitutive for *Explanation/Intervention*:** They point to cases like the rent cap, complex system failures, or mechanistic biology. They see substitutive assumptions not as predictive tools but as **epistemological surrenders** masking load-bearing structures. When the critic says "you need true mechanisms for explanation/intervention," they mean: *Load-bearing assumptions must be justified*, and substitutive assumptions *preclude* mechanistic explanation by construction. They see Friedmanites confusing substitutive proxies *working predictively* for them being *benign* like relaxable ones.
      *   **The Substitutive Black Box:** This is the bedrock ontological clash. For the Friedmanite, the substitutive assumption ("as-if" rep agent/perfect mixing) *is* the tool; its success *is* the justification. Asking "what is it *really* standing in for?" is the "wrong question." For the critic, the substitutive assumption is a necessary evil for computation, but it *blocks* understanding of the real causal structure (which might contain hidden load-bearing elements). **The stalemate is *not* primarily verbal or about defining "assumptions." It's a fundamental disagreement about:**
          *   **The purpose of models:** Prediction (Friedman) vs. Explanation/Intervention Design (Critic).
          *   **The nature of understanding:** Is predictive success sufficient for "understanding" (Friedman's "as-if")? Or does understanding require grasping (approximations of) real mechanisms, making substitutive assumptions inherently *un*-explanatory?
          *   **The status of complexity:** Is substitutive modeling a valid way to handle irreducible complexity? Or is it a dangerous fiction that hides critical thresholds or emergent behaviors (e.g., heterogeneity-induced phase changes the rep agent misses)?

  3.  **Applying Your Cases:**
      *   **Housing Market (Rent Cap):** The identical-agent assumption is **substitutive** (standing in for complex, unmodelable heterogeneity). For predicting *average* rents *under stable conditions*, it might work (relaxable *in effect* for that task). But for the rent cap **intervention**, heterogeneity becomes **load-bearing**. The model's prediction is an artifact of the substitutive assumption. Friedmanites might say "it wasn't meant for that" (true, but dodges the critic's point about model *use*). Critics say this proves substitutive assumptions are dangerous for policy.
      *   **Perfect Mixing Epidemic:** The assumption is **substitutive**. It gets the early curve shape right (predictive success within a domain, like relaxable) because complex contact networks *can* sometimes behave *as-if* well-mixed *at a coarse aggregate level*. Using it to size hospitals *might* work if the system remains within that aggregate regime. But it tells you *nothing* about superspreaders, network fragility, or targeted interventions – the *mechanistic* understanding is zero. The critic argues this lack makes it brittle for novel interventions or unexpected regime shifts. The Friedmanite counters that it worked for the task at hand (capacity sizing based on aggregate curve).

  4.  **Pathways to Progress (Beyond More Arguing):**
      *   **Your Distinction as Scaffolding:** **This is key progress.** Force the group to categorize *every* example debated using your taxonomy *before* arguing the merits. This exposes *which* type of assumption each side is privileging and for *what purpose* (prediction, explanation, intervention). It prevents conflating relaxable success with substitutive brittleness.
      *   **Formalizing Sensitivity (For Load-Bearing):** Develop/apply formal methods (e.g., robust control, global sensitivity analysis, bifurcation analysis) to rigorously identify *which* assumptions are load-bearing under *which* perturbations and for *which* outputs. Move beyond "it feels important" to "here's the math showing relaxing it flips the sign."
      *   **Case Studies of Substitutive Success/Failure:** Don't debate philosophy; analyze history. Find clear examples where models with substitutive assumptions (rep agents, perfect mixing, rational expectations) either:
          *   Successfully guided novel interventions/predictions *outside* their fitting domain.
          *   Failed catastrophically when used for intervention/explanation *because* of the hidden complexity they abstracted away.
          *   Were *replaced* by more mechanistic models (e.g., agent-based replacing rep agent) and what that gained (or lost).
      *   **Shift the Question from "True/False" to "Cost/Benefit for Task X":** Instead of "are unrealistic assumptions bad?", ask: "For achieving goal Y (predicting Z, explaining W, designing policy P), what are the *costs* (brittleness, hidden load-bearing risks, explanatory opacity) and *benefits* (tractability, generality, computational feasibility) of using a model with substitutive assumption S versus a more realistic but intractable/complex alternative?" This forces pragmatic evaluation over ontological purity.
      *   **Acknowledge the Substitutive Trade-Off Explicitly:** Recognize that substitutive modeling is **not** failed realism; it's **computational necessity**. The debate then becomes: *When and how can we trust the outputs of a necessarily false computational proxy for complex reality, knowing it obscures mechanisms?* This reframes it from truth-status to risk management in the face of ignorance.

  **Diagnosis:** The stalemate isn't just verbal, nor purely about modeling purposes. It's a **tangle of empirical claims about model performance, divergent priorities (prediction vs. explanation), and a deep ontological rift over the status of complexity and the meaning of "understanding."** Your distinction provides the scalpel to untangle it. Friedmanites are often right about relaxable and *predictive* uses of substitutive assumptions. Critics are often right about load-bearing assumptions and the *explanatory/intervention* limitations of substitutive ones. The real battleground is substitutive modeling: is it a profound insight into aggregate behavior ("emergence") or a dangerous obscurantism? **Progress comes by abandoning the binary "instrumentalism vs. realism" frame and adopting your triage, coupled with rigorous analysis of specific costs/benefits for specific tasks.** The goal isn't to declare a winner, but to build a nuanced map of when each type of assumption serves or fails a specific scientific purpose.
