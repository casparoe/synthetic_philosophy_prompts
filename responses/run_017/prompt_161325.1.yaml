answer: |-
  **Root Node: What does the question "What is the unit of selection?" mean to you?**  
  A. "At which level can we fully account for the trait change without statistical remainder?"  
  B. "At which level would interventions on traits change the outcome?"  
  C. "For which entity is the trait an adaptive benefit?"  

  ---

  **Branch A (Bookkeeping)**  
  *A1. Consider a eusocial colony (e.g., ants) with zero within-group worker variance and a colony-level trait (e.g., nest thermoregulation). The change in colony-trait frequency is:*  
  (i) Fully accounted for by between-colony covariance → **Go to A2**  
  (ii) Not fully accounted for by between-colony covariance → **Go to A3**  

  *A2. In the aggregate organism case (groups form anew each season; no group reproduction; group trait has heritability/causal effect on propagules). The trait change is:*  
  (i) Accounted for by group-trait/group-fitness covariance → *Leaf:* **Transient/trait-group selection**. *Awkward: Groups without lineages or reproduction are units.*  
  (ii) Not accounted for by group covariance alone → *Leaf:* **Group-level selection (reproduction-required)**. *Awkward: Heritability without reproduction is insufficient.*  

  *A3. Apply a two-level Price partition. The cross-level covariance (interaction) term is:*  
  (i) Zero → *Leaf:* **Multi-level selection (group-affects-individual-fitness)**. *Awkward: Requires group effects to be linear/context-independent.*  
  (ii) Nonzero → *Leaf:* **Interaction-term realism**. *Awkward: Attributing causal power to a statistical residue.*  

  ---

  **Branch B (Causation)**  
  *B1. Consider a driving genetic element (e.g., t-allele) that lowers host fitness. An intervention blocking its biased transmission:*  
  (i) Changes its frequency → *Leaf:* **Sub-organismal selection**. *Awkward: Traits harming the organism evolve.*  
  (ii) Does not change its frequency → **Go to B2**  

  *B2. In the aggregate organism case, swap half the members between two groups (matched swap). Post-swap:*  
  (i) Group traits/outputs change → **Go to B3**  
  (ii) Group traits/outputs unchanged → *Leaf:* **Individual-level causation**. *Awkward: Ignores emergent group properties.*  

  *B3. Freeze a group’s trait (e.g., externally enforce soma/reproductive ratio). This:*  
  (i) Changes the group’s output → *Leaf:* **Group-level causation**. *Awkward: Groups without reproduction have causal power.*  
  (ii) Does not change output → *Leaf:* **Organism-level selection (personal fitness)**. *Awkward: Misses collective causality.*  

  ---

  **Branch C (Adaptation)**  
  *C1. Consider alarm-calling in a transient flock (no group reproduction). The trait benefits:*  
  (i) The flock → *Leaf:* **Group-adaptation (non-reproducing)**. *Awkward: Adaptations without lineages.*  
  (ii) The individual’s kin → *Leaf:* **Organism-level selection (inclusive fitness)**. *Awkward: Requires high relatedness.*  
  (iii) The genes → **Go to C2**  

  *C2. Consider a species-level trait (e.g., dispersal mode) affecting speciation/extinction. It evolved:*  
  (i) For species benefit → *Leaf:* **Species/clade-level selection**. *Awkward: Ignores individual/gene mechanisms.*  
  (ii) As a byproduct → *Leaf:* **Gene-level pluralism**. *Awkward: Genes aren’t privileged causes.*  
  (iii) For emergent colony benefit (e.g., termite mound) → *Leaf:* **Superorganism**. *Awkward: Members are parts, not agents.*  

  ---

  **Aggregate Organism Case Resolution**  
  - **Branch A route:** Leads to *transient/trait-group selection* (A2i).  
  - **Branch B route:** Leads to *group-level causation* (B2i → B3i).  
  - **Divergence?** Yes. Trust the **B route (causation)** because interventions test causal dependencies, while bookkeeping can ignore mechanism (e.g., group "fitness" here is output, not reproduction).  

  ---

  ### Closing Blocks  
  **I. Pairs of leaves the tree cannot separate**  
  - **Gene-level monism** (C1iii) and **gene-level pluralism** (C2ii): Both reduce to gene-centric outcomes; separation depends on whether genes are *exclusive* vs. *one-among-many* causes (stipulation).  
  - **Multi-level selection (A3i)** and **group-affects-individual-fitness (B3ii)**: Both commit to group effects altering individual fitness; no causal test distinguishes them.  
  - **Transient group (A2i)** and **group-adaptation non-reproducing (C1i)**: Both treat non-reproducing groups as units; separation is definitional (bookkeeping vs. adaptation).  

  **II. Empty cells in the logical space**  
  - *Causal deflationism* (selection as an algorithm anywhere): Coherent but omitted; tree assumes causal/bookkeeping/adaptive distinctions matter.  
  - *Pluralist equivalence* (all levels equally valid): Unoccupied; tree forces choices via cases with discriminatory power (e.g., nonzero remainders).  
  - *Group reproduction without heritability*: Incoherent; heritability is necessary for bookkeeping (Price equation).  
  - *Sub-organismal adaptation*: Coherent but unattractive; no gene is "for" organelle conflict (only causation applies).
