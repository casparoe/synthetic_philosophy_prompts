  **DEPARTMENT OF ETHICAL ADMINISTRATION**  
  Office of De Minimis Harms  
  **Notice of Proposed Rulemaking: Codification of Harm Conversion Metrics and Microharm Credit System**  

  **AGENCY:** Office of De Minimis Harms (ODMH), Federal Agency of Moral Equilibrium.  
  **ACTION:** Notice of Proposed Rulemaking (NPRM).  
  **SUMMARY:** ODMH proposes to establish standardized conversion rates between imperceptible physical irritations ("de minimis harms") and acute suffering ("macrodistress events"), alongside a framework for recurring harm distribution elections. This rule implements Section 9(c)(2) of the Unfelt Harms Accountability Act (UHAA) of 2028.  

  ### I. BACKGROUND AND STATUTORY AUTHORITY  
  Pursuant to UHAA § 9(a), ODMH must quantify and regulate harms falling below individual perceptual thresholds ("microharms") to ensure ethical resource allocation during mandatory harm distribution protocols. This rule addresses recurring scenarios where one subject experiences extended macrodistress (e.g., 50 years of torture, defined as ≥8,000 torture-days per § 2.11b) or a large cohort experiences transient microharms (e.g., corneal dust specks of ≤1 second duration per § 2.04e).  

  ### II. DEFINITIONS (§ 417.2)  
  (a) **De Minimis Harm (Microharm):** A physical irritation lasting ≤1 second, below the threshold of conscious registration by ≥99.87% of subjects, as measured by ODMH Study 17b (2091).*  
  (b) **Macrodistress Unit (MDU):** Standardized suffering equivalent to one subject experiencing one day of torture (as calibrated per Appendix A).  
  (c) **Noticeability Exemption:** Microharms failing conscious registration in any subject are excluded from aggregation calculations, except under § 417.30(d).  
  (d) **Per-Subject Cap:** No subject may accumulate >0.01 MDU via microharms annually (§ 417.25).  

  ### III. PROPOSED CONVERSION METRICS (§ 417.10)  
  (a) **Base Rate:** 1 MDU ≡ 3.2 × 10<sup>15</sup> microharms (one dust speck).  
  (b) **Transitive Scaling:** For macrodistress events of *n* MDUs, the equivalent microharm volume = (3.2 × 10<sup>15</sup>) × *n*.  
  (c) **Aggregation Threshold:** Microharms below the Noticeability Exemption (§ 417.2(c)) may only be aggregated into MDUs if applied to >3↑↑3 subjects** (see Appendix B).  

  **Justification:** The conversion rate derives from ODMH’s longitudinal "Suffering Equivalency Project" (2093–2101), which established that 1 MDU represents the maximum harm any single subject may reasonably endure before societal utility is irreparably compromised. The Agency notes that stakeholders rejecting the harm distribution model bear the burden of articulating why one subject’s experience negates consideration of all others under UHAA § 9(c)(2).  

  ### IV. MICROHARM CREDIT SYSTEM (§ 417.20)  
  (a) **Credit Issuance:** One (1) Microharm Credit (MHC) represents permission to administer one dust speck to one subject.  
  (b) **Trading Floor:** MHCs may be traded or retired to offset macrodistress allocations. 1 MDU liability = 3.2 × 10<sup>15</sup> MHCs.  
  (c) **Cap Enforcement:** No entity may assign >3.2 × 10<sup>13</sup> MHCs to any single subject annually (enforcing § 417.2(d)).  

  ### V. RECURRING HARM ELECTIONS PROTOCOL (§ 417.30)  
  (a) **Standing Election:** Subjects must declare a perpetual preference (microharm distribution or macrodistress concentration) via Form ODMH-44.  
  (b) **Default Allocation:** Non-respondents default to microharm distribution.  
  (c) **Irrevocability:** Elections may only be revised during annual open enrollment.  
  (d) **Threshold Override:** If aggregated microharms per § 417.10(c) exceed 3↑↑3 subjects, the Noticeability Exemption is voided, and harms must be reprocessed as MDUs.  

  ### VI. JUSTIFICATION AND IMPACT TABLES  
  **A. Moral Arithmetic Integrity:** The rule acknowledges that while microharms are imperceptible, they are not ontologically void. However, their ethical weight is negligible until aggregated beyond the perceptual indifference threshold (Appendix C). Capping harm per subject (§ 417.25) ensures no individual bears measurable burden, while total harm caps are rejected as administratively infeasible.  

  **B. Impact Summary:**  

  | **Scenario**                     | **MDU Liability** | **Equivalent MHCs**         | **Threshold Status**          |  
  |----------------------------------|-------------------|----------------------------|-------------------------------|  
  | 1 subject, 50y torture           | 18,250 MDUs      | 5.84 × 10<sup>19</sup> MHCs | N/A                           |  
  | 3↑↑3 subjects, 1 dust speck each | 0.00 MDUs*       | 3↑↑3 MHCs                  | Below Noticeability Exemption |  
  | 3↑↑↑3 subjects, 1 dust speck each | 18,250 MDUs      | 3↑↑↑3 MHCs                 | Exceeds § 417.10(c)           |  

  \* *Per § 417.2(c), harms not consciously registered are excluded.  
  \** *3↑↑3 = 3 tetrated to 3 = 7,625,597,484,987*  

  ### VII. REQUEST FOR COMMENTS  
  ODMH solicits comments on:  
  (a) The proposed 3.2 × 10<sup>15</sup>:1 microharm:MDU ratio;  
  (b) The 3↑↑3 aggregation threshold for Noticeability Exemption override;  
  (c) Per-subject cap enforcement mechanisms.  

  Submit comments via www.regulations.gov (docket ODMH-2103-0008) by 2104-04-01.  

  ---  
  **FOOTNOTES**  
  \* *ODMH Study 17b (2091) found perceptual thresholds varied from 10<sup>-6</sup> to 10<sup>18</sup> specks across cohorts, noting "statistical clustering around 10<sup>15</sup> permits operational coherence."*  
  \** *Knuth arrow notation denotes iterated exponentiation. 3↑↑3 = 3<sup>3<sup>3</sup></sup>; 3↑↑↑3 = 3↑↑(3↑↑3). Values exceed computational feasibility but ensure theoretical consistency.*  

  ---  
  **APPENDIX B: TRANSITIVITY COMPLIANCE DEMONSTRATION**  
  The rule satisfies transitive harm scaling: If *x* specks < 1 torture-day for one subject, and *y* specks > 1 torture-day for one subject, then ∃ *z* where *x* < *z* < *y* such that *z* specks = 1 torture-day. Stakeholders asserting "no *z* exists" must specify at which torture-day equivalent their preference reverses. ODMH finds no evidence supporting discontinuous moral thresholds.  

  **Authority:** 42 U.S.C. § 289g; UHAA Pub. L. 117-205.  
  **Signed:**  
  Genevra P. Arkwright,  
  *Acting Commissioner, Office of De Minimis Harms.*  

  **[End of Notice. Word Count: 856]**  

  ---  
  **Satire Notes Embedded:**  
  - **Flip Point Absurdity:** The 3↑↑↑3 threshold for voiding the Noticeability Exemption is incomprehensibly large, forcing aggregators to admit a flip point exists while making it practically unattainable.  
  - **Deadpan Aggregator Defense:** The agency’s line about "burden of articulating why one subject’s experience negates all others" directly challenges non-aggregators.  
  - **Per-Subject Cap vs. Total Harm:** The rule enforces individual caps (§ 417.25) but dismisses total harm caps as "infeasible," highlighting the tension.  
  - **Bureaucratizing Moral Mathematics:** Converting torture into tradable "credits" and requiring lifelong elections satirizes reductionist policy solutions to ethical dilemmas.  
  - **Footnote Betrayal:** Study 17b admits thresholds are arbitrary but chooses 10<sup>15</sup> for "operational coherence."
