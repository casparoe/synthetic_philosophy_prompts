answer: |-
  ## The Daylight Test: Why Nudge Legitimacy Hinges on Shared Risk

  My friend, a disillusioned veteran of a government ‘nudge unit’, described a phenomenon that haunted me: the shelf life. Certain interventions, she explained, worked reliably only in the shadows. Once the mechanism was exposed – written up in a newspaper, discussed online – their power decayed, sometimes rapidly. Her team informally tracked a ‘half-life’: how many rounds of publicity before the effect halved. This wasn’t just operational trivia; it felt like a crack in the foundation of the whole behavioural-science-in-government enterprise. It pointed to a fundamental question of legitimacy that the field often dances around: when is it acceptable for the state to deliberately steer citizens' choices, and how do we know?

  The standard defence, as my friend rightly noted, is the inevitability of defaults. *Someone* designs the form, sets the order of options, chooses the wording. The procurement officer, the IT contractor, the weary bureaucrat maintaining a legacy system – they’re all setting defaults through ‘residual architecture’, the accidental byproduct of process and inertia. Behavioural scientists, the argument goes, merely replace this haphazard architecture with an ‘authored architecture’, designed consciously, ideally to make choices easier or outcomes better. The question isn’t *whether* to nudge, but *how* and *towards what*.

  But this defence proves too much. It dissolves a crucial distinction. Residual architecture is passive, a consequence of neglect or circumstance. Its influence is diffuse, unclaimed, often unnoticed. Authored architecture is active, intentional, and goal-oriented. It carries the weight of state intention. Claiming equivalence feels disingenuous, a sleight of hand that allows the nudge unit to inherit the passive legitimacy of bureaucracy while wielding active power. If the "someone had to choose" argument genuinely justifies only residual defaults, then it justifies almost nothing practised by modern nudge units. Every checkbox ticked by a behavioural scientist is authored.

  So, how *do* we legitimise this authored power? The debate often fixates on **transparency**. Is the nudge disclosed? Could the citizen, in principle, figure it out? Transparency is essential, but my friend’s shelf-life observation suggests it’s insufficient, perhaps even a red herring. An intervention that evaporates under scrutiny – whose half-life is short – reveals its force relied on obscurity, on the citizen *not* understanding the steering hand. Its effectiveness was parasitic on ignorance. Conversely, an intervention that *survives* exposure – that still gently guides even when everyone knows the trick – suggests something different. It suggests the nudge aligns with the citizen’s underlying interests or values in a way that remains helpful even when seen clearly. The citizen can understand the push and still find it useful, or at least not objectionable.

  This points towards my hunch: legitimacy hinges not just on visibility, but on **mutual exposure to risk**. A state steer is permissible when the citizen and the state institution are symmetrically vulnerable to being wrong about what serves the citizen's interest.

  1.  **Citizen Exposure:** The person being steered must be able to escape the nudge cheaply, repeatedly, and without becoming an expert. Opting out must be frictionless, obvious, and non-punitive. It’s the difference between a pension enrolment default with a clear, one-click opt-out versus a benefits form that buries the crucial eligibility calculator three clicks deep, forcing the overwhelmed applicant towards a potentially suboptimal choice before they can even understand their options. The latter traps; the former liberates.
  2.  **Institutional Exposure:** The institution must bear a tangible, material cost when its steer proves harmful or unwelcome. This could be plummeting enrolment numbers after a poorly designed campaign, a robust complaints mechanism with teeth that triggers investigation and reform, or the public embarrassment of a key metric (e.g., "successful claims processed") nosediving because the friction introduced actively hindered eligible claimants. The cost must sting; it must incentivise getting it right.

  This mutual exposure condition reframes the shelf-life phenomenon. A short half-life isn't just inconvenient; it’s diagnostic. It signals an intervention that likely *failed* the citizen exposure test – it depended on people *not* knowing they were being steered, making escape difficult precisely because they didn't perceive the need. When daylight comes, they bolt. A long half-life, however, suggests the nudge passes muster: citizens know, understand, and *still* find the default helpful or easy to accept. They can decline effortlessly, forever, but often don't need to.

  Let's apply this test to the sacred cows. **Automatic pension enrolment** passes with flying colours. Opting out is straightforward and well-signposted (citizen exposure). If the scheme were poorly designed (e.g., high fees, bad funds), enrolment would drop, providers would complain, politicians would face backlash (institutional exposure). The nudge survives publicity because even when you know about it, saving for retirement still aligns with most people’s long-term interests, and opting out remains simple.

  **Opt-out organ donation** is trickier. Citizen exposure is high – opting out is usually clear. But institutional exposure? What tangible cost does the government bear if the system causes distress (e.g., families feeling coerced) or if flaws emerge? Public outcry is possible, but it’s diffuse. The primary cost – a potential loss of public trust in the medical system – is real but indirect and hard to quantify. Mutual exposure isn't perfectly symmetrical here, introducing a legitimacy wobble often smoothed over by the scheme’s life-saving potential.

  Now, consider the **benefits website**: "Apply Now" front and centre, "Check Eligibility" buried. This is classic, powerful authored architecture aiming to reduce application abandonment. But does mutual exposure hold? Citizen exposure is *low*. The person freezing up might be helped, but the person who would have discovered crucial extra support is actively hindered; finding the calculator requires insight and persistence they likely lack when stressed. Opting out isn't a click; it's navigating a hidden path. Institutional exposure? Metrics might show more applications submitted (a 'success'), masking the harm of *under-claiming*. Unless meticulously tracked (e.g., auditing approved claims for missed entitlements), the institution faces little cost for harming vulnerable claimants by obscuring their rights. This nudge likely has a short shelf-life – expose the buried calculator, and people will find it faster – precisely because it exploited asymmetry. Mutual exposure condemns it.

  **Does the authored/residual distinction hold?** It’s porous, but vital. Yes, a residual default persists because someone *chooses* not to change it. But that choice is usually passive maintenance, not active, optimised design for a specific behavioural outcome. The moral responsibility and the claim to expertise differ radically. A crumbling step is different from a step deliberately designed to be slightly too high to slow you down. The distinction doesn't destroy my friend's first claim; it reveals its hollowness. Using the "someone had to choose" argument to justify aggressive authored nudges is like using the existence of gravity to justify pushing someone downstairs. The fact of influence doesn't neutralise the intent and power behind its specific application.

  How does mutual exposure fare against other tests?

  *   **Transparency Alone?** It’s necessary for citizen exposure (you can’t escape what you can’t see) but insufficient. A transparently creepy or harmful nudge is still illegitimate. Knowing the government buried your entitlements doesn't make it okay.
  *   **Welfare Improvement (by their own lights)?** This is crucial – a nudge should aim to make people better off as *they* would judge it, not as the state imagines. But welfare is often contested and hard to measure. Mutual exposure acts as a vital *safeguard* against welfare missteps. If the nudge is bad, citizen exposure allows correction, and institutional exposure forces accountability. It operationalises the welfare principle.
  *   **Absolute Autonomy Objection?** That any steering is disrespectful. Mutual exposure directly rebuts this. Respect isn't abolished by influence; it's demonstrated by ensuring the individual retains effortless, empowered control to reject that influence. The state shows respect not by being inert, but by making its interventions easily dismissible and bearing the cost if they misfire.

  Mutual exposure isn't perfect. It might permit some "creepy" interventions: imagine a corporate-style dark pattern on a government site – annoying but trivial to bypass. It condemns some "effective" interventions, like manipulative savings prompts that vanish when exposed. This is a feature, not a bug. Creepy-but-easy-to-escape is less harmful than seemingly benign but hard-to-resist. Effectiveness built on obscurity *should* be condemned.

  The verdict? Mutual exposure is a powerful, necessary foundation for legitimacy – the core mechanism ensuring respect and accountability in the architecture of choice. But it’s **incomplete**. It needs welding to the **welfare principle**. We must ask not just "Can they escape easily and will we pay if it's bad?" but also "Is this genuinely, verifiably likely to help them, *as they would define it*, in the first place?" Mutual exposure prevents harm and ensures agency; the welfare commitment provides the positive justification for acting at all. Without both, nudging remains an exercise in unaccountable power, its legitimacy as fleeting as the shelf-life of its most manipulative tricks.

  \answer{incomplete-needs-welfare}
