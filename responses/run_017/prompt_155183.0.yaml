prompt: |-
  i work in site reliability at a mid-size company and a lot of my week is incident reviews. Almost every postmortem we write ends up naming something nobody did as the root cause: nobody rotated a cert, nobody updated the runbook, nobody put an alert on that queue. I've also messed around with causal DAGs and the do() notation enough to be dangerous — I can read a graph, I know the difference between conditioning on X and intervening on X, but that's about where it stops.

  I found out recently that philosophers argue about whether an omission — a thing that didn't happen — can be a cause at all, and that some of them say no, because causes are events and there's no event of not watering the plant. I'd like that whole debate restated as honestly as possible in the only vocabulary I'm fluent in: nodes, edges, do(), counterfactuals over a structural model, config defaults, alerts that fire and alerts that don't.

  The cases I want you to run through it, because my team argues about them every week: (1) a missed step — the runbook says rotate the cert monthly, nobody did, cert expired, site down; (2) a default nobody chose — the load balancer timeout ships as 60s, no one ever set it, and that's why the retry storm cascaded; (3) an unsent signal — no alarm existed on queue depth, so nobody knew, so nothing got done; (4) the one that feels weirdest — the bad deploy didn't go out because the release manager was on a flight and couldn't approve it, so somebody's not-doing-something seems to be what saved us.

  Then the residue report: which of these go into a DAG plus do() cleanly, which only go in if you cheat (inventing a node for something that didn't happen, or treating a shipping default as if someone had chosen it), and which won't go in at all. My hunch is that my framework can't even say "that's an omission" unless something outside the graph tells it what was supposed to happen, which is why we keep dragging runbooks into postmortems. If that's right — is it a bug in the toolkit, or is the philosophers' problem with omissions actually a problem about norms wearing a costume? Is there anything left over that the graph still can't say even after I bolt on a "what the runbook said" node? Also: our review template says only name causes the team could have acted on. That rule feels seperate from the causal question but I can't say why — where does it sit relative to what they're arguing about?
reasoning: |-
  We are going to address the philosophical debate about omissions as causes and restate it in the language of causal diagrams (DAGs), interventions (do-operator), and counterfactuals, using the examples provided.

  Key concepts:
  - **Causal DAG**: A directed acyclic graph where nodes represent variables and edges represent direct causal relationships.
  - **Intervention (do-operator)**: Setting a variable to a specific value, denoted as do(X=x), which breaks incoming edges to X.
  - **Counterfactual**: What would have happened if we had done something differently? This is evaluated by modifying the model and propagating the changes.
  - **Omission**: The absence of an action or event (e.g., not rotating a certificate).

  The philosophical debate centers on whether an omission (a non-event) can be a cause. In the examples, the "causes" are:
  1. Not rotating the certificate (missed step).
  2. Not changing the load balancer timeout (default setting).
  3. Not having an alert (unsent signal).
  4. The release manager not approving the deploy (which prevented a bad deploy).

  We'll model each example with a DAG and see how omissions fit.

  ### Example 1: Missed Step (Cert Rotation)
  - **Scenario**: Runbook says rotate cert monthly. Nobody did. Cert expired. Site down.
  - **DAG**:
    - `RotateCert`: Binary (1: rotated, 0: not). This is set by human action or automation.
    - `CertExpired`: Binary (1: expired, 0: not). Depends on `RotateCert` and time.
    - `SiteDown`: Binary (1: down, 0: up). Depends on `CertExpired`.
  - **Actual path**: `RotateCert=0` (omission) → `CertExpired=1` → `SiteDown=1`.
  - **Counterfactual**: If we had done `do(RotateCert=1)`, then `CertExpired=0` and `SiteDown=0`.
  - **Analysis**: The omission (not rotating) is a cause because changing it (via intervention) prevents the bad outcome. But note: in the DAG, we have a node for `RotateCert` which is set to 0. This node represents the action (or inaction). The omission is represented as a value (0) of a node that exists.

  ### Example 2: Default Nobody Chose (Load Balancer Timeout)
  - **Scenario**: Load balancer timeout ships as 60s, no one ever set it. This caused a retry storm.
  - **DAG**:
    - `SetTimeout`: Binary (1: set to a different value, 0: left at default). This represents the action of changing the timeout.
    - `TimeoutValue`: The actual timeout value. If `SetTimeout=0`, then `TimeoutValue=60` (default). If `SetTimeout=1`, then `TimeoutValue` is set to the chosen value.
    - `RetryStorm`: Binary (1: occurred, 0: not). Depends on `TimeoutValue`.
  - **Actual path**: `SetTimeout=0` → `TimeoutValue=60` → `RetryStorm=1`.
  - **Counterfactual**: If we had done `do(SetTimeout=1)` and set to a safe value (say 30s), then `RetryStorm=0`.
  - **Analysis**: The omission (not setting the timeout) is represented by `SetTimeout=0`. Again, we have a node for the action of setting (or not). But note: the default is the initial state. We are treating the failure to change the default as an action (inaction) node.

  ### Example 3: Unsent Signal (No Alert on Queue Depth)
  - **Scenario**: No alarm existed on queue depth, so nobody knew, so nothing got done.
  - **DAG**:
    - `CreateAlert`: Binary (1: alert created, 0: not). This represents the action of creating the alert.
    - `AlertExists`: Binary (1: exists, 0: not). Directly set by `CreateAlert`.
    - `TeamAware`: Binary (1: aware of problem, 0: not). Depends on `AlertExists` (and other factors, but we assume the alert is the only way).
    - `ProblemMitigated`: Binary (1: mitigated, 0: not). Depends on `TeamAware`.
  - **Actual path**: `CreateAlert=0` → `AlertExists=0` → `TeamAware=0` → `ProblemMitigated=0`.
  - **Counterfactual**: If we had done `do(CreateAlert=1)`, then `AlertExists=1`, and if the alert fires (which we assume it would have), then `TeamAware=1` and `ProblemMitigated=1`.
  - **Analysis**: The omission (not creating the alert) is represented by `CreateAlert=0`.

  ### Example 4: The Save by Omission (Release Manager on Flight)
  - **Scenario**: The bad deploy didn't go out because the release manager was on a flight and couldn't approve it.
  - **DAG**:
    - `ApproveDeploy`: Binary (1: approved, 0: not approved). This is the action of the release manager.
    - `DeployHappened`: Binary (1: deployed, 0: not). Depends on `ApproveDeploy` (and maybe other steps, but we assume approval is necessary).
    - `SiteDown`: Binary (1: down, 0: up). Depends on `DeployHappened` and the quality of the deploy. We assume that if the deploy happens, it's bad and causes downtime.
  - **Actual path**: `ApproveDeploy=0` → `DeployHappened=0` → `SiteDown=0` (good outcome).
  - **Counterfactual**: If we had done `do(ApproveDeploy=1)`, then `DeployHappened=1` and `SiteDown=1` (bad outcome).
  - **Analysis**: The omission (not approving) is the cause of the deploy not happening, which in turn prevented the site from going down. So the omission is a cause of the good outcome.

  ### Residue Report

  **Which go into a DAG cleanly?**
  Examples 1, 2, 3, and 4 all can be represented cleanly by having a node that represents the action (or inaction). The omission is just the node taking the value that represents the absence of the action. We don't need to invent a node for "something that didn't happen" because we have a node for the action that could have been taken (with one value meaning it was taken and another meaning it wasn't).

  **Cheating?**
  - We are not inventing nodes for non-events. Instead, we have nodes for the *decision* or *opportunity* to act. For example, `RotateCert` is a node that we can set to 0 or 1. The value 0 is the omission.
  - The default setting (Example 2) is handled by having the initial state (default) as the consequence of inaction. We model the inaction (not changing) as a node. This is not cheating because we are representing the human action (or lack thereof) as a variable.

  **What about norms?**
  The DAG does not by itself contain the norm (e.g., the runbook says rotate monthly). Without the norm, we might not know which value of the action node is the expected one. But the causal structure is the same.

  To explicitly include the norm, we might add:
  - A node for `Runbook` that says what should be done. Then the node `RotateCert` might be influenced by `Runbook` (and other factors). But in the examples, the norm was present and known, and the action still wasn't taken. So the causal effect of the omission is still captured without the norm node. However, the norm is what makes the omission a "failure" rather than just a state.

  **The rule in the review template: only name causes the team could have acted on.**
  This is about *actionability*. It is separate from the causal structure. In the DAG, we can have causes that are not actionable (e.g., a solar flare). The rule is saying: focus on causes that are within the team's control to change. In the examples:
  - For the cert rotation, the team could have rotated the cert (actionable).
  - For the load balancer timeout, the team could have set it (actionable).
  - For the alert, the team could have created it (actionable).
  - For the release manager's absence, the team might not have been able to change that (if the release manager is the only one who can approve and they were on a flight). But note: they could have had a backup.

  The rule is about agency and responsibility, not about causality per se. However, in the DAG, we can represent whether a node is within the team's control. The do-operator then allows us to simulate interventions that are within our control.

  **What the graph cannot say?**
  The graph itself does not know what the norm is. We have to add that as a node or as an external specification. Also, the graph does not know what is actionable without labeling nodes as such.

  **Is the philosophers' problem with omissions actually about norms?**
  Yes, in part. The philosophers argue that omissions are not events. But in our DAG, we represent the omission as the value of a node that is an event (the decision point). The norm (e.g., the runbook) tells us that the value 0 of `RotateCert` is the deviation. Without the norm, we wouldn't call it an omission, just a state. So the problem of omissions is tied to the violation of a norm. But the causal structure is the same regardless of the norm.

  **Conclusion**:
  - All four examples fit cleanly into a DAG with the do-operator and counterfactuals.
  - We do not need to cheat: we represent the action (or inaction) as a node with values.
  - The DAG framework can represent omissions as causes by having nodes for the actions that were not taken.
  - The norm (runbook, best practice) is not in the causal graph by default, but it can be added as a node if we want to model why the action was expected.
  - The rule about only naming actionable causes is about focusing on nodes that we can intervene on (which are within our control). This is a practical and responsibility-focused rule, and it is separate from the causal structure but can be overlaid on it.

  Thus, the toolkit (causal DAGs) is not buggy for these cases. The philosophical debate is more about the ontology of events and norms, but for practical engineering purposes, we can model omissions as causes by representing the decision to act (or not) as a node.
answer: |-
  ### Restating the Philosophers' Debate in Causal DAG Terms  
  The core disagreement: **Can "nothing" (an omission) be a node in a causal graph?** Philosophers like David Lewis argue omissions aren't "events" (nodes) but absences; others (e.g., Ned Hall) say they *are* valid causes when there's a norm or expectation of action. In causal DAGs, this maps to:  
  - **Omission-as-cause requires a norm**: Your DAG needs a reference point (e.g., a runbook) to define what "should" have happened. Without it, "not X" is just a state, not a cause.  
  - **Causal DAGs handle omissions by modeling agency**: You represent the *opportunity to act* as a decision node. The omission is the value where the action wasn't taken.  

  ---

  ### Applying to Your Cases  
  **Key Setup for All Graphs**:  
  - **Decision nodes** (rectangles): Human/team actions (e.g., `ROTATE_CERT`). Values: `DONE` or `NOT_DONE`.  
  - **Norm nodes** (dashed lines): External expectations (e.g., `RUNBOOK_RULE`). Not causally influenced; sets reference.  
  - **Default states**: Treated as the baseline unless intervened upon.  

  #### Case 1: Missed Step (Cert Rotation)  
  - **Graph**:  
    ```  
    RUNBOOK_RULE (norm) → ROTATE_CERT (decision) → CERT_VALID → SITE_UP  
    ```  
  - **Actual path**: `ROTATE_CERT = NOT_DONE` → `CERT_VALID = NO` → `SITE_UP = NO`.  
  - **Counterfactual**: `do(ROTATE_CERT = DONE)` → `CERT_VALID = YES` (site up).  
  - **Why it works**: The norm (`RUNBOOK_RULE`) defines `NOT_DONE` as a deviation. Clean fit.  

  #### Case 2: Default Nobody Chose (Load Balancer Timeout)  
  - **Graph**:  
    ```  
    SAFE_SETTING_KNOWN (norm) → SET_TIMEOUT (decision) → TIMEOUT_VALUE → RETRY_STORM  
    ```  
  - **Actual path**: `SET_TIMEOUT = NOT_DONE` → `TIMEOUT_VALUE = 60s` (default) → `RETRY_STORM = YES`.  
  - **Counterfactual**: `do(SET_TIMEOUT = DONE)` → `TIMEOUT_VALUE = 30s` → `RETRY_STORM = NO`.  
  - **Cheating?** Slightly. The default is baked into `TIMEOUT_VALUE` if `SET_TIMEOUT = NOT_DONE`. But it's valid if you accept defaults as pre-intervention states.  

  #### Case 3: Unsent Signal (No Alert on Queue)  
  - **Graph**:  
    ```  
    MONITORING_STANDARD (norm) → CREATE_ALERT (decision) → ALERT_EXISTS → TEAM_RESPONDS → CASCADE_STOPPED  
    ```  
  - **Actual path**: `CREATE_ALERT = NOT_DONE` → `ALERT_EXISTS = NO` → `TEAM_RESPONDS = NO` → `CASCADE_STOPPED = NO`.  
  - **Counterfactual**: `do(CREATE_ALERT = DONE)` → `ALERT_EXISTS = YES` → `TEAM_RESPONDS = YES`.  
  - **Clean?** Yes. The norm (`MONITORING_STANDARD`) defines the expected action.  

  #### Case 4: The "Good" Omission (Release Manager on Flight)  
  - **Graph**:  
    ```  
    APPROVAL_POLICY (norm) → APPROVE_DEPLOY (decision) → DEPLOY_HAPPENS → SITE_DOWN  
    ```  
  - **Actual path**: `APPROVE_DEPLOY = NOT_DONE` → `DEPLOY_HAPPENS = NO` → `SITE_DOWN = NO` (good outcome).  
  - **Counterfactual**: `do(APPROVE_DEPLOY = DONE)` → `DEPLOY_HAPPENS = YES` → `SITE_DOWN = YES`.  
  - **Why it feels weird**: The omission *prevented harm*. But structurally identical to Case 1—just leads to a good outcome.  

  ---

  ### Residue Report: What Fits, What Breaks  
  1. **Clean fits** (Cases 1, 3, 4):  
     - Omissions slot in as `DECISION = NOT_DONE` with a norm node defining expectations.  
     - **Why it works**: You’re modeling human agency, not "nothing." The norm externalizes "what should’ve happened."  

  2. **Requires "cheating"** (Case 2):  
     - Defaults aren’t decisions; they’re system states. Treating `NOT_DONE` as causal invents agency where none existed.  
     - **Fix**: Explicitly add a node for `DEFAULT_OVERRIDE` and tie it to a norm (e.g., "review defaults during setup").  

  3. **What the graph can’t say alone**:  
     - **Omissions require norms**: Without `RUNBOOK_RULE` or `POLICY`, `NOT_DONE` is just a value—not a "failure." Your instinct is right: *"That’s an omission" is a normative judgment*.  
     - **Example**: If no runbook exists, `ROTATE_CERT = NOT_DONE` is just a fact, not a cause.  

  4. **Philosophers vs. Engineers**:  
     - Philosophers see omissions as "absences" (no node possible). Engineers need to assign blame, so they *create* nodes by importing norms. **This isn’t a toolkit bug—it’s a feature**. Norms turn passive states into actionable failures.  

  5. **The "actionable causes" rule**:  
     - **Separate from causality**: Your rule ("only name causes the team could’ve acted on") filters the DAG to *decision nodes under human control*.  
     - **Example**: In Case 2, if the team never knew the default was risky, `SET_TIMEOUT` isn’t "actionable." But it’s still causal.  
     - **Where it fits**: Postmortems aren’t pure causal analysis; they’re about accountability. This rule lives in the *moral layer* atop the DAG.  

  ---

  ### Conclusion  
  - **DAGs handle omissions** if you explicitly model:  
    - **Agency nodes** (what someone *could* have done),  
    - **Norms** (what they *should* have done).  
  - **What breaks**: Defaults (Case 2) strain the model—blaming "no action" feels artificial if no one was aware of the risk.  
  - **The philosophers’ point**: Yes, omissions are "norm problems in disguise." But for SRE, that’s fine! Your runbooks/policies *are* the norms that make omissions causal.  
  - **Actionable causes**: This is about *intervention points* (do()-able nodes), not causality. A hurricane might cause an outage, but if you can’t stop hurricanes, it’s excluded—even if it’s 100% causal.  

  **Practical takeaway**: Keep using norms (runbooks) to define omissions in your DAGs. It’s not cheating—it’s necessary for engineering. The "actionable" rule is a post-causal filter for accountability.
