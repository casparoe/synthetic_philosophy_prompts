  **Summary of feedback to the student:**

  (a): Correct. (6/6)

  (b): The calculation of the probability (3/5) and the immediate exit payoff (8/5) are correct. However, the continuation payoff is not 14/5. The deviation argument assumes that if the driver continues at the first intersection, he will then exit at the second for sure, and if at the second and continues, he gets 1. This is incorrect because the driver must use the same strategy (p) at the second intersection. The correct continuation payoff, when the strategy is p, is: (3/5)*[4p + 1*(1-p)] + (2/5)*1 = (3/5)(3p+1) + 2/5 = 9p/5 + 1. At p=1/3, this equals 9*(1/3)/5+1 = 3/5+1 = 8/5, which equals the exit payoff. Therefore, the driver is indifferent and there is no strict incentive to deviate. The ex-ante optimal strategy is time-consistent. The conclusion that the planning standpoint is broken is therefore incorrect. (3/8)

