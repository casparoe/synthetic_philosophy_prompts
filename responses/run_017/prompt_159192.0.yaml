answer: |-
  ### Exam Question  
  **Metaphysics PH456: Final Examination**  
  **Time Allowed:** 90 minutes  
  **Marks:** 20  

  > **Question:**  
  > Consider two cases:  
  >   
  > **(A)** *Nanoshield Vase*: A fragile vase is fitted with a nanoshield that activates *if and only if* the vase is struck. The shield absorbs impact, preventing breakage. Crucially, the shield’s activation counterfactually depends on the vase’s fragility: if the vase were *not* fragile, the shield would not activate.  
  >   
  > **(B)** *Decaying Conductor*: A wire is disposed to conduct electricity when voltage is applied. However, the wire is coated with a chemical that dissolves *during* the flow of current. At t=0, voltage is applied and conduction begins normally. At t=1ms, the dissolving chemical severs the wire, halting conduction before the current fully traverses it.  
  >   
  > (i) Explain why these cases challenge the Simple Conditional Analysis (SCA) of dispositions ("*x* is disposed to *M* when *S* iff, if *S* were to occur, *M* would occur").  
  >   
  > (ii) Do these cases show that *finks* and *masks* require fundamentally distinct solutions in a reformed analysis? Defend your view by arguing whether a single strategy (e.g., holding a causal basis fixed) can resolve both, or whether masks push toward extrinsicness, eliminativism, or another approach.  
  >   
  > *(Assume dispositions are real, intrinsic properties with causal bases. No external citations needed.)*  

  ---

  ### Model Answer (≈700 words)  
  **(i) Challenges to SCA**  
  Both cases refute SCA by violating its counterfactual conditional. In (A) *Nanoshield Vase*, the vase is fragile (it has a brittle crystalline structure), but if struck (*S*), it would not break (*M*) due to the shield. SCA falsely predicts non-fragility. Standard masks block manifestation while the disposition persists, but here the shield’s activation *depends* on the vase’s fragility: if the vase weren’t fragile, the shield wouldn’t activate, so striking *would* cause breakage. This interdependence means we cannot "subtract" the shield while holding fragility fixed—a move used in reformed analyses (e.g., "subtract interferers"). The case is not a pure mask because fragility *causally enables* the masking.  

  In (B) *Decaying Conductor*, the wire loses its disposition *during* the stimulus. At t=0, it is disposed to conduct and begins doing so when voltage (*S*) is applied. But at t=1ms, the chemical dissolution destroys the conductive basis *mid-manifestation*, halting conduction (*M*). SCA fails because if voltage were applied, conduction would not occur (as it stops prematurely). This is neither a classic fink (which removes the disposition *before* *S*) nor a mask (which allows the disposition to persist *during* *S*). It challenges the temporal boundaries of dispositional ascription: is the wire still "disposed to conduct" at t=0.5ms?  

  **(ii) Unity or Divergence of Solutions?**  
  Finks and masks *do* pull in distinct directions, and no single solution resolves both cases.  

  Finks (e.g., a sorcerer who removes fragility when a vase is struck) are addressed by reformed analyses like Lewis’s: hold the causal basis fixed across counterfactuals. If the vase’s brittle structure is preserved in the counterfactual scenario, fragility manifests when struck. This works for finks by ensuring intrinsic stability.  

  Masks, however, resist this strategy. In (A), holding the causal basis (brittleness) fixed *includes* the shield’s activation because the shield triggers *due to* the brittleness. If we fix the basis and "subtract interferers," we lose the shield, but then the vase *would* break—falsely attributing fragility when the shield is part of the actual causal setup. Cases like (A) suggest masks demand *extrinsic* factors: the shield’s presence makes fragility extrinsic, or we must deny the vase is fragile *simpliciter* (adopting a contextualist view).  

  Case (B) exacerbates this divergence. A fink-style solution—holding the conductive basis fixed—fails because the basis *persists* at stimulus-onset but vanishes mid-process. If we fix the basis at t=0, SCA predicts full conduction, but manifestation is aborted. This reveals a deeper issue: dispositions require *persistence* of their basis *through* manifestation, not just at stimulus-onset. Reformed analyses overlook this durational dimension.  

  Ultimately, finks push toward an *intrinsic, basis-focused* solution (fixed causal basis), while masks—especially (A)—push toward *extrinsicness* or *eliminativism*. For (A), if fragility depends on the shield’s extrinsic intervention, dispositions may not be intrinsic. Alternatively, we might deny the vase is fragile, reframing dispositions as context-sensitive capacities. Case (B) supports a hybrid approach: dispositions require a *stable basis across the stimulus-manifestation interval*, demanding dynamic tracking.  

  No reformed analysis fully captures this. Fixing the basis resolves finks and simple masks but fails for (A) (due to basis-triggered interference) and (B) (due to mid-process basis loss). This suggests dispositions are more complex than counterfactual analyses imply—perhaps involving historical or process-based properties.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points** (⨉/4 each, total 16 marks):  
  1. **Case (A) vs. SCA**: Correctly identifies (A) as a mask with counterfactual dependence on the disposition. Explains SCA fails because *S* would not cause *M*, despite the disposition existing.  
     *Common error:* Calling it "just a mask" without noting the dependence.  
  2. **Case (B) vs. SCA**: Correctly identifies (B) as a mid-process loss. Explains SCA fails because *M* does not occur despite correct initial conditions, and notes the temporal ambiguity.  
     *Common error:* Misclassifying it as a fink/mask without addressing the timeline.  
  3. **Finks vs. Masks (Divergence)**: Argues finks are resolved by fixing the causal basis (intrinsic solution), while masks (esp. (A)) push toward extrinsicness/eliminativism. Uses (A) to show basis-fixing fails if the mask depends on the basis.  
     *Common error:* Claiming both are solved by "holding basis fixed" without addressing (A)’s interdependence.  
  4. **Case (B)’s Challenge to Reformed Analyses**: Explains that fixing the basis at stimulus-onset fails for (B) due to mid-manifestation loss, revealing a need for basis *persistence*.  
     *Common error:* Ignoring the durational aspect or treating it as a standard counterexample.  
  5. **Synthesis**: Concludes that no single solution works. Notes masks (A) threaten intrinsicality, while (B) demands temporal persistence. Suggests implications (e.g., dispositions may be extrinsic/dynamic).  
     *Common error:* Vagueness about why unity fails or no implications.  

  **A vs. B Grade Differentiation (4 marks)**:  
  - **B (16–18)**: Hits all 5 points clearly but lacks originality.  
  - **A (19–20)**: Hits all 5 points *and* makes an **insightful extension**. Examples:  
    - Notes that (A) implies dispositions can be *relational* (shield-vase system), undermining intrinsicality more deeply than standard masks.  
    - Argues (B) shows dispositions require a *four-place relation* (object, basis, stimulus, *time*), not just a categorical basis.  
    - Observes that both cases together suggest dispositions are *process-types* rather than properties.  
    *Recognition:* Look for explicit, coherent implications beyond the question’s framework (e.g., "This implies dispositions are fundamentally extrinsic" or "Time is a hidden parameter in dispositional ascription").  

  ---  
  **Rationale**: This question forces engagement with novel cases where standard labels fail, tests understanding of why reformed analyses struggle, and requires synthesizing finks/masks into a broader metaphysics of dispositions. The marking scheme rewards precision on the cases, divergence, and deeper implications, with A-grades for original extensions.
