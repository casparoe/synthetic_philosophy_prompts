  | (b) Is this feasible-set dependence or mere state-dependent utility? | 0.85 | Feasible-set dependence (knowing removes "guilty-stands" action); state-dependent utility alone wouldn't violate Good. | If only state-dependent, headline drops to 0.3 (theorem tolerates it). | Med |
