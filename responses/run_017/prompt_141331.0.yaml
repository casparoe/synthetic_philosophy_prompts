    - The rule violates Good's theorem by making actions signal-dependent (a). This enables refusal to dominate when information distorts choices (b).
    - Commitment would nullify the issue (c), but its absence is realistic.
    - Ex ante is defensible (d); ex post regret is irrelevant to the claim.
    - Examples exist: High finality weight (e.g., 80% of utility) + weak priors (e.g., guilt prior 0.55, priors only 60% correlated with guilt) can make refusal optimal by preserving the option to convict safely.
