  ### Headline Credence and Proposition
  `headline_credence`: 0.7  
  `proposition_restated`: There exist non-gerrymandered priors on guilt and weights on accuracy vs. finality such that, ex ante, refusing the file yields strictly higher expected utility than opening it.

