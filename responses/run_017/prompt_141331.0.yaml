  | (d) Is ex ante the correct welfare standpoint? | 0.8 | Ex ante is standard for rational choice; ex post regret doesn't negate ex ante optimality. | If ex post dominates, headline drops to 0.4 (but claim specifies ex ante). | Med |
  | (e) How common is this structure (information destroying options)? | 0.75 | Analogous to insurance/blackmail: knowing can destroy "ignorance rents" (e.g., unpoolable risks). | If rare, headline drops to 0.5; if ubiquitous, rises to 0.9. | Med |
  | (f) Does the offer's exogeneity matter? | 0.99 | Stipulated randomness and no signaling make the problem "pure"; endogeneity would add noise. | If endogenous, headline drops 0.2 (but stipulation fixes this). | High |
  | (g) Can non-gerrymandered priors/weights make refusal optimal? | 0.6 | Yes: e.g., high finality value + weakly informative priors that induce overconfidence when known. | If impossible, headline drops to 0.05 (core claim fails). | Med |

