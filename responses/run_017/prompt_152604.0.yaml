prompt: |-
  hey — I'm a 3rd-year PhD student in political philosophy working on distributive ethics, and I've been chewing on an argument for about three weeks that I'm pretty sure proves too much. I can't locate the bad step. Would appreciate a second pair of eyes.

  Setup so we're using the same words: by prioritarianism I mean the view that outcomes are ranked by the sum of a concave, increasing transform of each person's welfare — take f(w) = √w as the working example, so an outcome's value is Σ √wᵢ. Everyone knows the selling point: unlike egalitarianism, prioritarianism never says a levelling down is an improvement, because any increase in anyone's welfare raises the sum.

  Here's the argument (mine mostly, though a friend in the departent helped me get step 7 into shape):

  (1) No-levelling-down: an outcome A isn't better than an outcome B if nobody is better off in A than in B and someone is worse off in A.
  (2) That's the levelling-down objection, and it's what sinks egalitarianism: if equality has intrinsic value, then moving from (12, 8) to (8, 8) — the better-off person down to 8, the worse-off person unchanged — can be an improvement overall, even though nobody gains and somebody loses. That's unacceptable, so egalitarianism is out.
  (3) Prioritarianism escapes this. Since f is increasing, levelling down always lowers Σ f(wᵢ). No levelling down is ever an improvement. That's supposed to be the whole point: you keep what's attractive aboutegalitarianismwithout paying for it.
  (4) But we don't only rank sure outcomes; we rank prospects, i.e. choices under uncertainty. And the natural extension of (1) to prospects is: a prospect A isn't better than B if nobody is better off under A and someone is worse off — where being better off under a prospect just is having higher expected welfare, since that's what it is for an uncertain option to be better for you.
  (5) Now the case that breaks it. Two people, Ann and Ben, √ weights. P: (4, 4) for sure. Q: a fair coin, heads (10, 0), tails (0, 10). Under Q each person's expected welfare is 5; under P it's 4. So by (4) nobody is better off under P and both are worse off. But the prioritarian values are P = √4 + √4 = 4 and Q = ½(√10 + 0) + ½(0 + √10) = √10 ≈ 3.16. Prioritarianism prefers P: a prospect that is worse for everyone.
  (6) So the escape in (3) only works for sure outcomes. And essentially every real policy choice involves uncertainty, so the escape covers almost nothing.
  (7) Worse: if the thought behind (1) is that betterness has to be traceable to somebody's being better off, and you hold onto that in full generality — outcomes and prospects — then combined with expected utility you get pushed the whole way to utilitarianism (the Harsanyi-style aggregation result: respect everyone's preferences under risk, add the usual rationality constraints, and social value is a weighted sum of expected utilities). So the levelling-down objection doesn't take you from egalitarianism to prioritarianism; run honestly it takes you to plain utilitarianism, which is where we started and which none of us want.

  I dont accept the conclusion, and I'd rather keep (3) than (4) — the sure-outcome escape feels like the entire reason to be a prioritarian. But I can't say which step is doing the illicit work, and I'm scared that rejecting (4) loses me (1) as well, in which case I've got no objection left against the egalitarian. I also tried the obvious fix — apply the weights to expected welfare rather than to final outcomes, so value = Σ f(E[wᵢ]) — and that does flip the case in (5), but it seems to buy it by ignoring who actually ends up badly off, which is the thing I wanted priority for in the first place.

  Which step do you reject, why does it look fine, and what does rejecting it cost me? If there are two or three exits, price them against each other instead of just picking one.

  Give me your bottom line in the first sentence, then the reasoning — no preamble, and don't restate my setup back to me.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a PhD student in political philosophy working on distributive ethics, specifically prioritarianism. They've constructed an argument that seems to undermine prioritarianism by showing it leads to utilitarianism when considering uncertainty. The user is stuck because they can't find the faulty step and are worried rejecting certain steps might cost them their objection to egalitarianism.

  First, I need to parse their argument step by step. The key points are: (1) No leveling down for sure outcomes is acceptable, which prioritarianism satisfies. (2) Extending this to prospects via (4) leads to a problem where prioritarianism prefers a prospect worse for everyone (P over Q in their example). (3) This pushes towards utilitarianism via Harsanyi's theorem. The user wants to keep prioritarianism but can't see how without losing the leveling-down objection.

  Looking at step (4): They claim that for prospects, "better off" means higher expected welfare. But prioritarianism applies the concave transform to welfare states, not expectations. So when comparing prospects, the prioritarian value is the expectation of the transformed welfare, not the transform of expected welfare. This distinction is crucial. In their example, Q has lower prioritarian value because the transform is applied to the outcomes (10 and 0), which when transformed (√10 and 0) average to about 3.16, less than P's 4. But under utilitarianism, Q's expected welfare per person is higher (5 vs 4).

  The user tried applying the transform to expected welfare (f(E[w_i])), but that ignores distribution. Step (4) equates "better off under a prospect" with higher expected welfare, but prioritarianism isn't committed to this. The prioritarian cares about the expectation of f(w_i), not f(E[w_i]). So rejecting (4) doesn't mean rejecting the no-leveling-down principle for sure outcomes. It just means that for prospects, the individual's "better off" isn't solely based on expected welfare from a prioritarian view.

  The user's fear is that rejecting (4) might undermine (1). But (1) is about sure outcomes, where no uncertainty exists. The levelling-down objection still holds in deterministic cases. For prospects, prioritarianism can violate the extension in (4) without contradicting (1). The core of prioritarianism is the concave transform of welfare levels, which naturally extends to expectations over those transforms. Rejecting (4) doesn't force acceptance of leveling down in sure outcomes; it just means the objection doesn't extend straightforwardly to uncertain scenarios.

  The user might also be concerned about Harsanyi's theorem leading to utilitarianism. But prioritarianism rejects one of Harsanyi's axioms, specifically that social preferences should be linear in probabilities. By applying a concave transform, prioritarianism is non-linear, so it avoids the utilitarian conclusion. The user can maintain that the no-leveling-down principle for sure outcomes is sufficient to reject egalitarianism, without needing it for prospects.

  In essence, the user can keep prioritarianism by rejecting step (4). The cost is that the no-leveling-down principle doesn't apply to prospects, meaning prioritarianism might sometimes prefer prospects that are worse for everyone in expectation. But this isn't a contradiction; it's a feature of valuing equality in outcomes. The benefit is retaining the objection to egalitarianism in sure cases and avoiding utilitarianism.
answer: |-
  Reject step (4). It misapplies the "better off" criterion to prospects under prioritarianism by assuming individual betterness under uncertainty is defined solely by expected welfare, which prioritarianism is not committed to accepting as the relevant metric for its interpersonal aggregation.

  **Reasoning:**  
  - Step (4) asserts that for prospects, "nobody is better off under A" means *nobody has higher expected welfare*. This assumes **welfarism about prospects**: that what makes a prospect better *for an individual* is fully captured by their expected welfare. Prioritarianism, however, is defined by applying the concave transform *to welfare outcomes*, then taking expectations. It does not transform expected welfare itself.  
  - Under prioritarianism, "better off for an individual" in deterministic cases is uncontroversial: higher welfare. But under uncertainty, prioritarianism’s *social* evaluation uses the expectation of the transformed welfare (e.g., E[√wᵢ]), not the transform of expected welfare (√E[wᵢ]). Crucially, it does not require that individuals’ *own* betterness rankings under risk align with expected welfare. Individuals might care about risk in ways prioritarianism ignores, but prioritarianism’s aggregation operates on the social valuation of outcomes, not individual risk preferences.  
  - Thus, step (4) illicitly imposes a utilitarian criterion (betterness-for-individuals = higher E[w]) onto prioritarianism. Rejecting (4) means: under prioritarianism, "nobody is better off" in prospects *cannot* be reduced to "nobody has higher E[w]." Instead, the prioritarian compares prospects via E[Σ√wᵢ]. In your case (5), Q *is* worse for Ann and Ben *in prioritarian social value* (E[Σ√wᵢ] = 3.16 < 4), even though their E[w] is higher. The "worse for everyone" in (5) relies on E[w], which prioritarianism rejects as the metric for social betterness.  
  - **Costs of rejection**:  
    - **(A)** You lose a *straightforward extension* of the no-levelling-down intuition to uncertain cases. Prioritarianism *can* prefer a prospect with lower E[w] for all (as in (5)), which may seem counterintuitive if you insist ex ante equality should mirror ex post concerns.  
    - **(B)** You must accept that prioritarianism’s response to uncertainty is *non-Harsanyi*. It violates the Pareto principle under uncertainty (if "better for i" means higher E[w]), which is why Harsanyi’s theorem pushes to utilitarianism. This is a feature, not a bug: prioritarianism sacrifices this Pareto principle to respect outcome inequality.  
  - **Why not reject other steps?**  
    - Rejecting (1) or (3) abandons prioritarianism’s core appeal.  
    - Rejecting (5) or (7) ignores the math: prioritarianism *does* prefer P over Q, and Harsanyi *does* require utilitarianism if you accept step (4)’s Pareto principle.  
    - Rejecting (4) preserves (1): the no-levelling-down objection *for sure outcomes* remains intact against egalitarianism. You keep prioritarianism’s deterministic advantage.  
  - **Bottom line**: Step (4) smuggles in a utilitarian premise. Rejecting it costs you a tidy generalization to uncertainty but saves prioritarianism from collapsing into utilitarianism and preserves its objection to egalitarian levelling down. You pay by accepting that prioritarianism’s ex ante evaluations may conflict with individual expected welfare.
