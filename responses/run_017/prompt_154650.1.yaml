  ### Correspondence Table: Die vs. Continuous Parameter

  The die analogy relies on a clear mapping between the discrete case (die) and the continuous case (parameter like a chord). Here's the correspondence:

  | **Concept**               | **Die Example**                                                                 | **Continuous Parameter (e.g., Chord)**                                                                 |
  |---------------------------|---------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|
  | **Faces**                 | Atomic outcomes (e.g., 6 faces of the die).                                     | No natural atomic outcomes; the "outcomes" depend on the parametrization (e.g., chord endpoints, distance from center, or midpoint). |
  | **Die**                   | Physical object with distinct, countable faces.                                 | Abstract space of possibilities (e.g., the set of all chords in a circle), which is continuous and uncountable. |
  | **Symmetry**              | Faces are interchangeable under rotation; permuting faces doesn't change probabilities. | The circle has rotational and reflectional symmetry, but this symmetry does not pin down a unique measure for chords. Different parametrizations (e.g., uniform endpoints vs. uniform distance) are all symmetric but yield different probabilities. |
  | **Uniform Prior**         | Unique and natural due to discrete, symmetric partition. Probability is 1/6 for each face. | Not unique; depends on parametrization. "Uniform" requires a reference measure (e.g., arc length, radial distance, or area), which is arbitrary under ignorance. |
  | **Indifference Principle**| Justified by exchangeability and symmetry: no reason to favor one face over another. | Ambiguous; "ignorance" does not specify which parametrization to use. Different choices lead to different "uniform" priors. |

  ### Does Discretization Fix Bertrand's Paradox?
  No, discretization does not resolve Bertrand's paradox; it relocates the choice of parametrization to the discrete level, and the three probabilities (1/3, 1/2, 1/4) do not converge as the discretization becomes finer. Instead, they remain distinct, reproducing the paradox in discrete form.

  - **How discretization works**: Chop the circle into \(N\) equally spaced points. A chord is defined by unordered pairs of distinct points, giving \(\binom{N}{2}\) possible chords. The length of a chord is determined by the central angle (minimal separation \(d\) in steps, where \(d = 1, 2, \dots, M\) with \(M = \lfloor N/2 \rfloor\)).
  - **Probability calculation**: The critical chord length (longer than the side of an inscribed equilateral triangle) corresponds to a central angle \(> 120^\circ\). For large \(N\), this requires \(d > N/3\) (approximately). The probability is the proportion of chords with \(d > N/3\).
    - As \(N \to \infty\), this converges to \(1/3\).
  - **Other methods discretized**:
    - **Distance from center**: Discretize by choosing \(N\) radial directions and \(P\) discrete distances along each radius. Uniform over directions and distances gives a probability converging to \(1/2\) as \(P \to \infty\).
    - **Midpoint method**: Discretize the disk into a fine grid of equal-area cells. Uniform over cells gives a probability converging to \(1/4\) as the grid size \(\to 0\).
  - **Result**: The probabilities do not converge; they stay at approximately 1/3, 1/2, and 1/4 for large \(N\) or fine grids. Discretization only masks the paradox by making it finite, but the core issue—dependence on parametrization—remains. The choice of how to discretize (e.g., by endpoints vs. distance) corresponds to the choice of parametrization in the continuous case.

  ### What Does the Die Have That the Chord Doesn't?
  The die has three key features that the chord lacks:
  1. **Readymade atomic partition**: The die's faces are distinct, countable, and given in advance. This provides a canonical discrete measure (counting measure) for indifference.
  2. **Exchangeability**: The faces are symmetric (exchangeable under permutation), so the uniform prior is uniquely determined by the symmetry group.
  3. **Symmetry group that pins down the measure**: The rotation group acts transitively on the faces, implying a unique invariant measure (Haar measure) that is uniform. There is no ambiguity.

  In contrast, for chords:
  - No atomic partition: Chords form a continuous space, so we must choose a parametrization (e.g., endpoints, distance, midpoint) to define "atoms," but this choice is arbitrary.
  - Exchangeability is parametrization-dependent: Chords can be exchangeable under different parametrizations (e.g., all endpoint pairs are symmetric), but the measures differ.
  - Symmetry does not pin down a unique measure: The circle's rotation group is symmetric, but multiple invariant measures exist (e.g., uniform over endpoints vs. uniform over midpoints). The group action does not lead to a unique Haar measure because the space is not discrete or simple.

  ### Does Demanding Invariance (Rotation, Translation, Scale) Repair Indifference?
  No, demanding invariance under rotation, translation, and scale does not resolve the paradox; it replaces indifference with a substantive assumption. Here's why:
  - **Rotation invariance**: All three Bertrand methods are rotation-invariant, yet yield different probabilities (1/3, 1/2, 1/4). Invariance alone is insufficient for uniqueness.
  - **Translation and scale invariance**: For a fixed circle, translation is irrelevant (the circle is symmetric), and scale is fixed (radius is constant). In general, adding scale invariance (e.g., for problems with variable size) might select a specific measure, but it does not apply here. Even with scale invariance, Bertrand's paradox persists because the parametrization choice remains.
  - **This is not indifference**: Indifference claims to represent "ignorance" without assumptions, but demanding invariance imposes a preference for symmetry, which is a substantive constraint. It repairs indifference only by smuggling in an assumption, not by capturing pure ignorance.

  ### Why the Pre-Given Partition Matters
  Your inkling is correct: the die works because its partition (faces) is given in advance, while for chords, no such partition exists. This is crucial because:
  - In the discrete case, the partition defines the sample space, and symmetry implies a unique uniform measure.
  - In the continuous case, the "partition" is replaced by a choice of measure (e.g., Lebesgue measure on an interval), which is parametrization-dependent. Ignorance does not favor one measure over another.
  - The die analogy implicitly assumes this pre-given partition, but for continuous parameters, we must choose how to "chop" the space, and this choice encodes information (e.g., "I think chords are best parameterized by endpoints").

  ### Verdict on "Uniform = Neutral"
  **"Uniform = neutral" does not survive scrutiny for continuous parameters.** The die analogy carries the conclusion (that uniform is assumption-free) only by assuming a canonical discrete partition, which is absent in continuous spaces. In Bertrand's paradox and similar cases:
  - Uniform priors are not assumption-free defaults; they depend on the parametrization, which embodies subjective choices (e.g., arc length vs. radial distance).
  - Indifference is defensible only for finite, symmetric cases where a unique uniform measure exists. In continuous settings, "ignorance" alone is inadequate; we must add assumptions (e.g., a preferred parametrization or invariance) to define uniformity.
  - **Restricted form of indifference**: Indifference can be defended if applied to a specified finite partition (e.g., discrete outcomes) or a parametrization chosen based on meaningful scale (e.g., when a parameter has a natural "uniform" scale like log-odds for probabilities). However, this is not ignorance-based—it requires justification for why that partition or scale is appropriate. In Bertrand's paradox, no such justification exists from ignorance alone.

  ### Conclusion
  Bertrand's paradox is not a mere parlour trick; it exposes a genuine flaw in using indifference for continuous parameters. Discretization relocates but does not resolve the paradox, as the probabilities remain divergent. The die analogy works only because it presupposes a discrete, symmetric partition—something missing in continuous spaces. For ignorance to imply uniformity, we need a finite set of exchangeable outcomes; otherwise, "uniform prior" is parametrization-sensitive and not neutral. Bayesian practice should acknowledge this: uniform priors encode assumptions, and true ignorance requires careful consideration of the parametrization or the use of alternative approaches (e.g., reference priors). Without a pre-given partition, indifference is incomplete.
