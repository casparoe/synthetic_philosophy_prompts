  **INTERNAL GUIDANCE CIRCULAR**  
  **BUREAU OF RULE ADJUDICATION**  
  **REF: IGC-7.4.2**  

  **TO:** All Case Officers, Grade I-IV  
  **FROM:** Directorate of Semantic Compliance  
  **DATE:** 23 October 2023  
  **SUBJECT:** Post-Hartington Ruling Adjudication Protocols & Community Overlap Ratio (COR) Implementation  

  ---

  ### 1. INTRODUCTION  
  Pursuant to the Hartington Ruling (SC-09-22), determinations of "meaning" or "intended rule application" are hereafter administrative procedures governed solely by community assertibility conditions. Case Officers shall disregard pre-Hartington frameworks alleging determinate semantic facts. Key principles:  
  > **(a)** Truth conditions are obsolete.  
  > **(b)** Correctness = communal acceptance under relevant circumstances.  
  > **(c)** Subjective impressions of obligation (e.g., "I *ought* to say 125") are not evidentiary.  

  ### 2. PROHIBITED METHODOLOGIES  
  The following are explicitly non-compliant and must not appear in determinations:  
  > **2.1 Dispositional Assessment:** Inquiries into a claimant’s hypothetical future responses. (*Grounds: Finite assessment windows cannot resolve infinitary dispositions.*)  
  > **2.2 Semantic Fact Petitions:** Claims invoking "real meanings," "Platonic referents," or "mental contents." (*Grounds: Unfounded per Hartington; see Rejection Schedule 3A.*)  
  > **2.3 Meta-Rule Solicitation:** Do **not** draft rules to interpret rules. (*Grounds: Infinite regress.*)  

  ***Resolution for 2.3:*** All meta-interpretive queries are deferred to Schedule 4.2.1 (Interpretive Hierarchy), wherein sub-clauses 4.2.1.1 to 4.2.1.∞ recursively bind lower tiers to higher-tier procedural consensus. Treat as standard paperwork—no philosophical exceptionalism.  

  ### 3. COMMUNITY OVERLAP RATIO (COR) PROTOCOL  
  The COR is the sole metric for meaning adjudication:  
  > **Formula:** COR = (Number of probe cases where claimant matches Registered Panel) / (Total probe cases administered)  
  > **Threshold:** COR ≥ 0.9 affirms rule-alignment.  
  > **Probe Selection:** 100 cases minimum; include values ≥57 to avoid "small-number bias."  

  #### 3.1 Worked Example:  
  > **Claimant:** Answers "5" for "68 + 57."  
  > **Asserted Rule:** "Addition."  
  > **Procedure:**  
  > - Log claimant’s protest ("I *meant* addition!") as Subjective Obligation Impression (SOI). File under Annex D (non-evidential).  
  > - Administer 100 probe cases (e.g., 92+61, 150+200, etc.).  
  > - **Scenario A (Low COR):** COR = 0.15. Determination: "quus-aligned" (not "addition"). No error: Community never accepted responses.  
  > - **Scenario B (High COR):** Neighbors *also* answer "5" on ≥90% of large-number probes. COR = 0.98.  
  > **Determination:** No error exists. Community consensus validates "5" as correct.  
  > **Remedy:** Redraw Registered Panel to reflect emergent consensus. (*Note: Panel recalibration is routine maintenance, not error correction.*)  

  ### 4. EDGE CASES  
  #### 4.1 Solitary Claimants:  
  > No community → no assertibility conditions → no determinacy.  
  > **Procedure:** Adjourn case indefinitely (Code H7: "Held in Communal Abeyance"). Do **not** speculate on "latent dispositions."  

  #### 4.2 Unprecedented Probes:  
  > e.g., "What is 10↑↑10?" (no prior community response).  
  > **Procedure:**  
  > - Officer issues preliminary ruling based on analogical extrapolation (per Schedule 2.3).  
  > - Log as: "Decision: ‘5’ is assertible."  
  > ***PROHIBITED PHRASING:*** "‘5’ *was in fact correct*." Truth-conditional language violates Hartington.  

  ### 5. COMPLAINTS RECEIVED & RESPONSES  
  > **Complaint (Ref: C-2881):**  
  > *"The COR merely kicks the scepticism upstairs! Who interprets the* Panel’s *responses? Your Schedule 4.2.1.1 needs a rule for its own application—ad infinitum!"* — Straightforward Solution Alliance (SSA)  
  >  
  > **Bureau Reply:**  
  > Interpretation of Panel responses is established per Schedule 4.2.1, subsection 4.2.1.1 ("Tiered Interpretive Validation"), which itself derives authority from Panel consensus via COR ≥0.9. The SSA’s demand for "foundations" is pre-Hartington thinking. Procedure is its own justification.  

  ---

  **CERTIFIED COMPLIANT:**  
  *J. Arbuthnot, Director*  
  Bureau of Rule Adjudication  

  **DISTRIBUTION:**  
  All Field Offices, Central Registry, Compliance Audit Division  
  **REVIEW CYCLE:** Annual (Next: Oct 2024)  
  **NOTE:** Unauthorized retention of truth-conditional paperwork violates Directive 9.1. Report offenders to Ethics. Efficiency targets apply.  

