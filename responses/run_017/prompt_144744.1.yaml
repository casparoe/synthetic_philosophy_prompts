answer: |-
  ### Adversarial Collaboration Agreement on Scientific Realism  
  **Between Dana (Selective/Structural Realist) and Ivo (Pessimistic Meta-Induction)**  

  This document outlines points of agreement and structured disagreements regarding the viability of scientific realism, based on the historical record of theory change. The goal is to isolate empirical and conceptual cruxes for resolution.  

  ---

  ### Section 1: Agreed Claims  
  Both parties endorse the following neutral formulations:  

  1. **No-Miracles Argument (NMA)**:  
     - The predictive and instrumental success of mature scientific theories would be improbable if those theories were not at least *approximately correct* in some respects.  
     - The NMA does not specify *which components* of a theory (e.g., ontological posits, structural relations) are responsible for its success.  

  2. **Pessimistic Meta-Induction (PMI)**:  
     - Historically, many posits once considered best-confirmed (e.g., phlogiston, luminiferous ether) were later abandoned or substantially revised.  
     - The PMI does not, by itself, establish whether this pattern applies uniformly to *all* components of current theories or only to specific subsets.  

  3. **Retention Through Theory Change**:  
     - Scientific transitions often preserve aspects of predecessor theories, frequently including mathematical structures (e.g., equations, symmetries, conserved quantities).  
     - What qualifies as "preserved" is contestable: it may involve direct continuity, approximate correspondence, or functional equivalence under specified conditions.  

  4. **Base Rate of Abandoned Posits**:  
     - The raw fraction of historically abandoned posits is an insufficient metric for extrapolating to current theories.  
     - A defensible induction requires analyzing:  
       - (a) The *temporal dynamics* of abandonment (e.g., hazard rates),  
       - (b) Gradations in how posits were discarded (e.g., elimination vs. reduction),  
       - (c) Whether success was *sensitive* to specific posits.  

  5. **Minimal Criteria for Licensing an Induction**:  
     - For the historical record to support *any* inductive inference (optimistic or pessimistic), it must reveal:  
       - (a) A stable statistical pattern in the fate of posits over time,  
       - (b) Transparent criteria for "abandonment" that do not presuppose current theory,  
       - (c) A mechanism explaining why some posits survive while others do not.  

  ---

  ### Section 2: Table of Residual Disagreements  
  Each disagreement is stated in its proponent’s preferred framing, with a shared crux, test, and predictions.  

  | Disagreement | Dana’s Position | Ivo’s Position | Crux | Test/Case | Dana’s Prediction | Ivo’s Prediction |
  |-------------|----------------|---------------|------|----------|------------------|-----------------|
  | **Hazard Rate Dynamics** | The hazard of elimination for a posit decreases sharply with age (e.g., halving each decade post-confirmation). Thus, mature posits (e.g., >100 years old) have negligible near-term risk, making aggregate discard rates misleading. | A decreasing hazard is consistent with *and presupposes* selective realism. The record is too short/theory-laden to fit a curve, and even modest constant hazards imply high long-term failure rates. | **Does the hazard rate decay independently of structural preservation?** <br> Test: Track the 50-year survival rate of posits first confirmed 1850–1950 (e.g., electron, gene, electromagnetic field) vs. those confirmed 1950–2000 (e.g., quark, dark matter). Use pre-2000 sources to judge "elimination" to avoid hindsight bias. | >90% of pre-1950 posits survive intact; post-1950 posits show higher but falling hazard. | >30% of pre-1950 posits are now "eliminated"; hazard decay is weak or artifactual. |
  | **Grading of Abandonment** | "Eliminated" should only apply to posits outright discarded (e.g., caloric), not those reduced (e.g., Newtonian mass → relativistic mass), reidentified (e.g., water → H₂O), or demoted to useful fictions. Most historical cases are the latter. | All four fates involve rejecting the original posit’s *intended reference*; distinctions are retrospective and do not mitigate the PMI. | **Do 'reduction/reidentification' materially differ from 'elimination' for realism?** <br> Test: Classify 20 historically abandoned posits (e.g., phlogiston, aether, vital force) via blind analysis by impartial historians, using predefined criteria. | >75% classified as reduced/reidentified; <25% eliminated. | >60% classified as eliminated; reduction is elimination by another name. |
  | **Sensitivity of Success** | A posit’s necessity for a theory’s success is tested counterfactually: "Would predictions change if this posit were false, *ceteris paribus*?" Structurally essential posits (e.g., equations) pass; auxiliary ontologies (e.g., ether’s substrate) often fail. | Counterfactuals are circular without independent access to "natural laws"; historical theories’ successes *were* sensitive to posits now abandoned (e.g., Fresnel’s ether was crucial to his optics). | **Can the sensitivity test be operationalized without begging the question?** <br> Test: For 10 historical theories (e.g., Fresnel’s optics, Bohr atom), simulate whether altering/disabling a specific posit (per pre-success understanding) breaks key predictions, using period-appropriate data/tools. | >80% of abandoned posits were insensitive; success hinged on structure. | >70% were sensitive; posits directly enabled predictions. |
  | **Verbal Dispute: "Belief" and "Approximate Truth"** | Realism requires belief only in posits that are (1) structurally critical *and* (2) have high survival likelihood (via hazard decay). "Approximate truth" includes preservation of relations. | Realism requires belief in best-confirmed posits *simpliciter*. "Approximate truth" of abandoned posits is retroactive reinterpretation. | **Is the dispute merely verbal?** <br> Crux: Both agree "belief" is defeasible but disagree on *threshold*. Verbal iff: Survival predictions (see above) converge after tests. | Test: After hazard/sensitivity tests, both bet on survival of 10 current posits (e.g., Higgs field, neural representations). | Structural posits (e.g., QFT symmetries) survive; ontologies (e.g., "particle" in QM) are reidentified. | All best-confirmed posits (e.g., Higgs, quarks) believed now will be abandoned or radically reinterpreted. |

  ---

  ### Forward-Looking Tests for Resolution  
  To dissolve stalemates, both parties commit to:  
  1. **Prediction Registry**: Independently list 10 posits from active theories (e.g., quantum gravity candidates, dark energy) and predict their status in 2050:  
     - **Dana**: Survival/reidentification likely for structural elements (e.g., AdS/CFT correspondence); hazard model favors older posits.  
     - **Ivo**: High abandonment risk for all; PMI implies most will be discarded.  
  2. **Blind Historical Audit**: Use pre-1950 sources to code the fate of 30 posits (1700–1900) for hazard analysis, with "elimination" defined as complete removal from accepted ontology.  
  3. **Sensitivity Simulations**: For 5 historical theories, computational philosophers will model counterfactuals using period-appropriate constraints.  

  ---  
  **Signatures**  
  Dana, Selective Realist: _________________________  
  Ivo, Pessimistic Meta-Induction: _________________________  
  Date: _________________________  

  ---  
  **Design Notes**:  
  - Neutrality: Claims avoid framing successes as "miracles" or posits as "fictions," focusing on empirically tractable patterns.  
  - Testability: Cruxes center on resolvable empirical questions (e.g., hazard curves, blind classification) rather than purely conceptual disputes.  
  - Verbal Issue: The "belief" disagreement is flagged as potentially verbal, with resolution tied to predictive convergence.  
  - Forward-Looking: Bets on current posits incentivize refining criteria and expose reasoning to falsification.
