  We are drafting a document for an adversarial collaboration between Dana (selective/structural realist) and Ivo (pessimistic meta-induction). The document will have two main parts: 
  1. A numbered section of agreed claims that both can sign without wincing.
  2. A table of residual disagreements, each stated in the wording each side would accept, with cruxes, tests, and predictions.

  First, we need to identify points of agreement that are neutral and non-question-begging.

  Agreed Claims:
  1. **The No-Miracles Argument (NMA)**: Both agree that the predictive and instrumental success of science would be an inexplicable coincidence if scientific theories were not at least approximately true. However, they also agree that the NMA, by itself, does not specify which aspects of a theory are responsible for its success and thus which parts are likely to be retained.

  2. **The Pessimistic Meta-Induction (PMI)**: Both agree that the historical record shows that many scientific posits once considered well-confirmed have been abandoned or substantially changed. This record raises a challenge for scientific realism. However, they also agree that the PMI, by itself, does not specify whether the abandonment of posits is uniform across all aspects of theories or whether some aspects are more stable.

  3. **On Retention Through Theory Change**: Both agree that in the transition from one successful theory to another, some elements are typically preserved. These often include mathematical structures, quantitative relations, and symmetry principles. They also agree that the preservation of these elements is a non-accidental feature of scientific progress.

  4. **On the Base Rate of Abandoned Posits**: Both agree that a simple count of abandoned posits from past theories (without regard to the context of their abandonment) is an oversimplification. They agree that a more nuanced analysis must consider the conditions under which posits were abandoned and the reasons for their abandonment.

  5. **On the Need for a Refined Analysis**: Both agree that the dispute cannot be resolved by either the NMA or the PMI alone, and that a more detailed examination of the historical record and the structure of theories is necessary. In particular, they agree that the following questions are central:
     - How does the risk of a posit being abandoned change over time (the hazard rate)?
     - How should we classify the fate of a posit (eliminated, reduced, reidentified, etc.)?
     - To what extent was the success of a past theory dependent on a specific posit (the counterfactual sensitivity test)?

  Now, for the residual disagreements, we structure them as a table. Each row will cover:
  - The point of disagreement (stated in the wording each side would accept).
  - The crux (what would resolve the disagreement).
  - A test or case or argument both would accept as bearing on that crux (including forward-looking predictions if applicable).
  - Each side's prediction about the outcome of the test.

  We have three main disagreements from the query, and we might add one about the interpretation of the historical record.

  Residual Disagreements:

  1. **Hazard Rate of Elimination**:
     - Dana's View: The hazard rate (annual probability of elimination) for a posit decreases significantly over time, especially after the posit has survived heavy interventional use for an extended period (e.g., decades). A posit that has been successfully used for a century has a very low hazard rate, so the aggregate historical discard rate does not imply a high elimination probability for such mature posits.
     - Ivo's View: The decreasing hazard rate is exactly what one would expect if only structural elements are being preserved, and thus it presupposes the selective realist conclusion. Moreover, the historical record is too short and theory-laden to reliably estimate a hazard curve. Even a constant, modest hazard rate compounds to a high probability of elimination over centuries.
     - Crux: Whether the hazard rate of elimination for posits decreases over time independently of the structural realist thesis, and whether the available historical data can reliably establish the shape of the hazard curve.
     - Test: 
       - (a) Analyze the historical record by selecting a set of posits from different eras (e.g., 17th to 20th century) and track their fate (eliminated, retained, or transformed) over time. The analysis must be done without presupposing current theory (as much as possible) and with clear criteria for "elimination". 
       - (b) Forward-looking: Both sides will independently list current posits (from established theories that have been heavily used for at least 50 years) and predict which will be considered "eliminated" in 50 years. The hazard rate model can be tested against these predictions.
     - Dana's Prediction: The hazard rate will show a clear decreasing trend, and the survival rate of current mature posits will be high (e.g., >90% over 50 years for posits that are at least 50 years old).
     - Ivo's Prediction: The hazard rate will not decrease as dramatically as Dana suggests, or if it does, it is because the surviving posits are structural. The survival rate of current mature posits will be lower (e.g., <70% over 50 years) and many will be eliminated or substantially changed.

  2. **Grading of Fate (Eliminated, Reduced, Reidentified, etc.)**:
     - Dana's View: The historical record often misclassifies the fate of posits. Many posits are not eliminated but are reduced to a more fundamental level, reidentified with a different ontology, or demoted to useful fictions. Only outright elimination counts against realism, and this is rare for structural elements.
     - Ivo's View: These distinctions are often post-hoc rationalizations. Reduction, reidentification, and demotion are all forms of abandonment of the original posit. The original posit, as understood in its historical context, is no longer considered real.
     - Crux: Whether the distinctions in the fate of posits (elimination vs. reduction vs. reidentification) are robust and whether they matter for the realism debate.
     - Test: 
       - (a) Select a set of historical posits and have independent historians (or philosophers) not involved in the realism debate classify their fates using predefined criteria. Then see if there is high agreement on the classifications.
       - (b) For current posits, both sides will predict not just survival/elimination but the mode of change (if any) over the next 50 years.
     - Dana's Prediction: Most abandoned posits will be classified as reduced or reidentified, and very few as outright eliminated. For current mature posits, any changes will typically be reductions or reidentifications.
     - Ivo's Prediction: A significant fraction of historical and current posits will be classified as eliminated (in the sense that the original concept is abandoned). For current posits, many will be eliminated.

  3. **Counterfactual Sensitivity Test**:
     - Dana's View: The success of a theory is often not sensitive to the truth of its specific ontological posits, but to the structural/mathematical content. If a posit had been false, the theory could have been adjusted to preserve the successful predictions. Therefore, the survival of structure is what matters.
     - Ivo's View: The counterfactual test is hard to apply and often leads to circularity. In many historical cases, the success of the theory was sensitive to the posit in the context of the time, and the posit was later abandoned. The test is also applied with hindsight bias.
     - Crux: Whether the counterfactual sensitivity test can be applied objectively to historical cases and current theories, and whether it shows that the success of past theories was independent of their abandoned posits.
     - Test: 
       - (a) For a set of historical theories and their key posits, construct counterfactual scenarios where the posit is false but the theory is minimally adjusted to preserve its predictions. Then see if the adjusted theory would have been as successful in the historical context (without the benefit of later knowledge).
       - (b) For current theories, identify which posits are considered by each side as "sensitive" and which are not. Then track over time whether the insensitive ones are more likely to survive.
     - Dana's Prediction: The counterfactual test will show that the success of past theories was largely insensitive to their abandoned posits (so they were not doing the predictive work). For current theories, posits deemed insensitive by the test will be more likely to be abandoned or transformed.
     - Ivo's Prediction: The counterfactual test will be inconclusive or show that many abandoned posits were indeed sensitive. For current theories, there will be no correlation between the test's outcome and survival.

  4. **Verbal Disagreements**: 
     - We note that part of the dispute is verbal, particularly concerning the terms "approximate truth", "belief", and "what a realist claims".
     - Agreement: Both agree that scientific realism involves a commitment to the idea that our best scientific theories are at least approximately true and that their central posits exist. However, they disagree on what counts as "central" and "approximately true".
     - Why verbal: The disagreement about "approximate truth" can be verbal because one side (Dana) might include structural preservation as a form of approximate truth, while the other (Ivo) might require the survival of the specific ontology. Similarly, "belief" might be withheld by Ivo for any posit that might be abandoned, while Dana might believe in the structural content even if the ontology changes.

  Now, we write the document accordingly.

