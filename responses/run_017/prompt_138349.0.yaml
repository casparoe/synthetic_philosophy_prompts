answer: |-
  **To:** Steering Committee Members  
  **Subject: Urgent Protocol Adjustment for Scalable Oversight Pilot – Bounty Rule Implementation**  

  ### Background  
  Last week’s debate revealed a critical flaw: the winning 60-page case obscured a fatal error (page 31), while the correct opposing side lost because they couldn’t pinpoint it under time pressure. This undermines our core premise—that *spotting errors should be cheaper than fabricating them*. Generating overwhelming volume defeated truth-seeking, risking a future where verbosity trumps validity.  

  ### Recommendation: Adopt the Bounty Rule Immediately  
  After analysis, we propose implementing the **bounty rule** for all future debates, starting with Friday’s session. This rule states:  
  > **"Any debater claiming an error in the opponent’s case must cite the exact sentence(s) where it occurs. If the cited material is verified as correct, the claimant loses instantly."**  

  We will also **rerun last week’s round** under the new rule next week to validate the fix.  

  #### Why the Bounty Rule?  
  1. **Targets the Core Failure**:  
     - The rule forces specificity. Had the short-side debater been required to cite page 31 upfront, their correct claim could have been validated (or refuted) efficiently.  
     - It disincentivizes "confusion flooding"—burying errors in volume—by making vague accusations costly. If you claim an error and target the wrong spot, you lose.  

  2. **Preserves Legitimate Complexity**:  
     - Unlike compression (which risks oversimplifying valid long arguments), the bounty rule doesn’t penalize length itself. A 60-page correct case can still win if opponents fail to identify *any* flaw or misattribute errors.  
     - It rewards precision, not brevity: a debater with complex but sound reasoning can defend each step proactively.  

  3. **Operational Practicality**:  
     - Judges act faster: They check one claim at a time, avoiding unlimited text dumps.  
     - Participants adapt immediately: Debaters must prepare focused attacks/defenses, aligning with real-world expertise constraints (e.g., a security analyst auditing code line-by-line).  

  #### Strongest Counterargument & Our Response  
  **Counterargument**: *This could let a "slick but wrong" short argument beat a "messy but correct" long one if the long case has a minor, irrelevant flaw.*  
  - **Why we accept this trade-off**:  
    - **Truth over tidiness**: If a long argument contains *any* critical error (even one), it risks being incorrect overall (e.g., a single flawed step invalidates a proof). The bounty rule exposes this rigorously.  
    - **Balance of incentives**: Debaters with correct long cases will avoid ambiguity by structuring arguments defensibly (e.g., modular claims). Wrong short cases still lose if they attack inaccurately.  
    - **Pilot integrity**: Our goal is *scalable oversight*—not rewarding effort but *accuracy under constraints*. Confusion-flooding is fatal to the format; this fix prioritizes discernible truth.  

  #### Why Not Compression?  
  - **Compression oversimplifies**: Forcing 60 pages into 500 words may strip nuance, advantaging reductive but wrong summaries. It also fails to solve the core issue: opponents *still* can’t pinpoint errors during the live debate.  
  - **Bounty operates in real-time**: It fixes the interaction *during* the debate, where the problem arose.  

  ### Action Plan & Timeline  
  1. **Friday’s debate**: Implement the bounty rule. Judges will enforce:  
     - Claims like "Section 4 has a flaw" must now specify: "Sentence 3 on page 31 misstates CVE-2024-1234."  
     - Immediate forfeit if the cited sentence is sound.  
  2. **Next week**: Rerun last week’s round with the bounty rule. This tests if the correct (short) side wins by citing page 31.  
  3. **Standing rule**: Adopt the bounty rule permanently starting now.  

  ### Why This Over "Measuring Something Else"  
  This incident exposes a format-specific vulnerability, not a pilot-wide flaw. The bounty rule directly repairs debate’s error-revealing mechanism without abandoning the protocol. If reruns confirm it works, we proceed; if not, we reevaluate.  

  **Next Steps**:  
  - Brief judges/debaters on the bounty rule before Friday.  
  - Finalize rerun logistics at Friday’s meeting.  

  This fix restores debate as a tool for clarity—not confusion. Time is short, but precision is cheaper than volume. Let’s adapt and test.  

  **Attachments**:  
  - Draft bounty rule wording (for feedback).  
  - Rerun scheduling poll.
