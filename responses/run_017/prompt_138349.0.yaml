prompt: |-
  I'm on the steering comittee for our lab's scalable-oversight pilot: two AI systems argue opposite answers to a hard technical question (does this patch close the vuln, is this benchmark contaminated, whatever), and a human judge with about 40 minutes and no domain expertise picks a winner. The idea is that the back-and-forth drags the wrong side's mistakes into the open. Last week's final round went badly: one debater produced a 60-page case, the other kept insisting there was a false step somewhere in section 4 but couldn't locate it in the time allowed, and the judge went with the long one for looking more complete. Over the weekend, with a whole afternoon, we found the bad step on page 31 — the short side had been right all along.

  The thing I keep going in circles on is whether the protocol's premise is even coherent. Debate is supposed to help because spotting a flaw is meant to be cheaper than fabricating an entire fake case, but if you can bury one wrong step in 60 pages, then generating confusion looks cheaper than dissipating it, and the format just rewards whoever can produce more text. What I can't tell is whether that's a bug we can fix with rules or the whole thing collapsing.

  Two fixes are on the table. One is a compression round: after the debate, each side restates its entire case in 500 words and the judge votes again on the short versions only. The other is a bounty rule: a debater who claims an error has to name a specific sentence, and loses on the spot if that sentence turns out to be fine. Draft the memo I'll circulate before friday's meeting. It should recommend one concrete course of action — let the result stand, rerun this round, adopt a standing rule, or some combination, with a time frame — and give reasons the judges and the participants could actually act on rather than general worries about AI safety.

  Be honest about the strongest thing on the other side, which to me is that both rules just punish long or genuinely complicated reasoning, and that under them a slick, short, wrong arguement beats a messy, long, correct one. If that trade-off is unavoidable, say so and say why your recommendation is still worth it; if you think it means the pilot should be measuring something else entirely, say that instead and tell us what.
reasoning: |-
  We are facing a problem where a long, incorrect case won because the opponent could not pinpoint the error within the time limit. We are considering two rule changes: a compression round or a bounty rule. 

  The compression round would have each side restate their case in 500 words after the debate, and the judge would vote again on the short versions. The bounty rule would require a debater claiming an error to name a specific sentence, and if that sentence is correct, the claimant loses immediately.

  The strongest argument against both rules is that they might penalize long or genuinely complex arguments, potentially allowing a slick but incorrect short argument to beat a correct but lengthy one.

  However, the current format is failing because the time constraints make it impossible to refute a very long argument. The goal of the debate is to make the truth easier to discern by having the AI systems surface errors. The incident showed that generating a long, confusing argument was a winning strategy even when incorrect.

  I recommend adopting the bounty rule immediately for the next round and consider a rerun of the last round under the new rule to validate the approach. 

  Reasons:
  1. The bounty rule directly addresses the problem by making it costly to make vague accusations of error. It forces the debater to be specific, which should help the judge focus and prevent the opponent from hiding errors in volume.
  2. It does not inherently penalize length. A long, correct argument can still win if the opponent cannot correctly identify an error. However, it does require that if an error is claimed, the claim must be precise. This encourages the debater to be confident in their refutation and prevents fishing expeditions.
  3. The compression round might be less effective because it occurs after the debate and does not directly address the issue of confusion during the main debate. Also, compressing a complex argument might oversimplify and lose nuance, which could lead to incorrect judgments.

  The strongest counterargument is that a complex correct argument might have a minor flaw that the opponent can latch onto with a bounty, causing the correct side to lose. However, in a well-structured debate, the correct side should be able to defend each step. Also, the bounty rule does not require the opponent to find an error; they can still win by presenting a strong positive case. The rule only applies when they choose to attack.

  We must accept that the debate format is not perfect and that there is a trade-off. We are trying to make the truth easier to discern in a limited time. The bounty rule shifts the balance toward specificity and away from obfuscation, which aligns with the goal of scalable oversight.

  Therefore, I propose:
  - Rerun last week's round with the bounty rule, to see if the correct (short) side can now win by pinpointing the error on page 31.
  - Implement the bounty rule as a standing rule for all future debates, effective immediately.

  Time frame: Rerun the round next week (if feasible) and use the bounty rule in the upcoming Friday's meeting.

  Memo Draft:

  ---

  **To:** Steering Committee Members  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Protocol Adjustment for Scalable Oversight Pilot - Bounty Rule Implementation  

  ### Background
  In last week's debate, an incorrect 60-page case won because the opponent could not locate the alleged error within the time limit. Subsequent analysis confirmed the error on page 31, meaning the shorter case was correct. This incident highlights a vulnerability in the current format: generating a high-volume, obfuscatory case can be a winning strategy even when incorrect, because pinpointing errors is difficult under time constraints.

  ### Proposed Fix: Bounty Rule
  We recommend adopting a **bounty rule** for all debates, effective immediately. The rule is:
  - **If a debater claims that the opponent has made a specific error, they must cite the exact sentence (or passage) where the error occurs.**
  - **If the cited sentence (or passage) is found to be correct (i.e., no error exists there), the claimant loses the debate immediately.**

  This rule addresses the core issue by:
  1. **Reducing Vague Accusations**: The opponent cannot simply say "there's an error somewhere in section 4" without risking instant loss if they are wrong about the specific location.
  2. **Encouraging Precision**: It forces debaters to be specific when attacking, making it easier for the judge to verify claims.
  3. **Maintaining Fairness**: It does not penalize long arguments per se. A lengthy but correct case can still win if the opponent fails to correctly identify an error. The rule only penalizes incorrect attacks.

  ### Why Not Compression?
  We considered a compression round (500-word summaries) but see drawbacks:
  - It occurs after the main debate and does not address the confusion during the critical interaction.
  - Compression might oversimplify complex, correct arguments, potentially leading to incorrect judgments.

  ### Addressing Concerns
  The strongest counterargument is that the bounty rule might penalize a correct but complex argument if the opponent successfully attacks a minor flaw (even if the overall argument is sound). However, note:
  - The rule only triggers when a debater chooses to attack. A debater with a strong positive case can still win without attacking.
  - The correct side can defend by showing the cited step is sound. This encourages robustness and clarity in arguments.
  - We must accept some trade-off: the goal is to make the truth easier to discern in 40 minutes. The current format is failing because obfuscation is too effective. The bounty rule shifts the balance toward clarity and specificity.

  ### Action Plan
  1. **Rerun Last Week's Round**: We propose rerunning the last debate with the bounty rule. This will test whether the correct (short) side can now win by citing the specific error (page 31). *Timeframe: Next week.*
  2. **Implement Standing Rule**: Adopt the bounty rule for all future debates, starting with the next round (this Friday if possible). Judges and participants will be briefed on the rule before the debate.

  ### Next Steps
  We will discuss this at Friday's meeting. If there are no major objections, we will:
  - Update the debate protocol to include the bounty rule.
  - Schedule the rerun of last week's round for next week.
  - Train judges and debaters on the new rule.

  This approach directly addresses the failure mode we observed and aligns with the pilot's goal: to make the truth more accessible through debate.

