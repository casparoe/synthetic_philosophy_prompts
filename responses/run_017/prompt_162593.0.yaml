  ### LLM Intelligence Beliefs Quiz  
  **Objective:** Sort engineers by their intuitions on intelligence without using philosophical jargon. 8 questions, each with concrete cases. Scoring maps answers to 8 distinct positions.  

  ---

  #### Quiz Questions  
  1. **Chess Engine Case:** A program is superhuman at chess but useless at everything else. Is it intelligent?  
     - A) Yes, mastery of a complex task = intelligence.  
     - B) No, intelligence requires adaptability to *new* tasks.  
     - C) It’s "intelligent at chess" but not generally.  

  2. **Rewording Robustness:** A model scores 90% on a benchmark but drops to 20% when questions are reworded (same meaning). Does it understand?  
     - A) Yes, raw scores reflect capability.  
     - B) No, robustness to rewording is essential for understanding.  
     - C) It "understands" only in narrow contexts.  

  3. **Compute Scaling:** A system solves complex problems only when given 10,000× more inference compute (same answers, more time). Without extra compute, is it intelligent?  
     - A) Yes, intelligence isn’t defined by speed.  
     - B) No, efficiency matters; needing excessive compute reveals shallowness.  
     - C) It’s "potentially" intelligent but unrealized.  

  4. **Agent Swarm:** Dumb agents (e.g., ants) collectively solve complex problems none can solve alone. Is the *group* intelligent?  
     - A) Yes, collective behavior can be intelligent.  
     - B) No, intelligence resides in individuals.  
     - C) The group is "functional" but not intelligent.  

  5. **Human-in-the-Loop:** A model produces brilliant outputs only when guided by an expert human prompter. Is the *model* intelligent?  
     - A) Yes, the model is the core actor.  
     - B) No, intelligence emerges from the *system* (human + model).  
     - C) The model is a "tool," not an agent.  

  6. **Slow Alien:** A hypothetical alien takes a month to answer but is always correct. Is it intelligent?  
     - A) Yes, correctness matters, not speed.  
     - B) No, intelligence requires timely responses.  
     - C) It’s intelligent but practically useless.  

  7. **System Boundary:** Where does an AI’s intelligence lie?  
     - A) In the trained weights (the model itself).  
     - B) In the full system (weights + scaffolding/tools/harness).  
     - C) Both contribute, but weights are primary.  

  8. **Internal vs. External:** Is "internal understanding" required?  
     - A) Yes (e.g., world models, reasoning).  
     - B) No, only external behavior matters.  
     - C) Behavior is primary, but internals hint at depth.  

  ---

  #### Scoring Key: 8 Positions on Intelligence  
  Based on answer combinations, sorted into "leaves" of the logical tree. **Awkward commitment** = hardest pill to swallow for each view.  

  1. **Narrow Behaviorism** (e.g., chess engine is intelligent)  
     - *Awkward commitment:* A lookup table that perfectly mimics human responses is "intelligent."  
     - *Answers:* 1A, 2A, 3A, 7A, 8B.  

  2. **Harness Emergentism** (intelligence in the full system)  
     - *Awkward commitment:* Identical model weights are "unintelligent" without scaffolding.  
     - *Answers:* 5B, 7B, 8B.  

  3. **Internalist Generalist** (requires robustness + internals)  
     - *Awkward commitment:* A model acing benchmarks without internal coherence (e.g., stochastic parrots) isn’t intelligent.  
     - *Answers:* 2B, 6A, 8A.  

  4. **Efficiency Fundamentalist** (speed/efficiency is core)  
     - *Awkward commitment:* The "slow alien" isn’t intelligent.  
     - *Answers:* 3B, 6B.  

  5. **Collective Intelligence** (groups can be intelligent)  
     - *Awkward commitment:* An ant colony solving complex navigation is "intelligent," but no ant is.  
     - *Answers:* 4A, 8B.  

  6. **Instrumentalism** (intelligence as task-specific utility)  
     - *Awkward commitment:* A calculator is "intelligent at arithmetic."  
     - *Answers:* 1C, 2C, 3C, 5C, 6C.  

  7. **Weight Essentialism** (intelligence only in weights)  
     - *Awkward commitment:* Prompt engineering/tools add zero intelligence.  
     - *Answers:* 5A, 7A, 8C.  

  8. **Universal Potentialist** (intelligence = latent capability)  
     - *Awkward commitment:* A model that *could* solve anything with infinite compute is "intelligent," even if it fails now.  
     - *Answers:* 3A, 6A, 8A.  

  ---

  #### Unresolved Ambiguities  
  **Pairs the tree cannot separate:**  
  - **Narrow Behaviorism vs. Instrumentalism:** Both accept task-specific intelligence (Q1A/C), but differ on whether "intelligence" requires biological parallels. Scoring relies on Q8 (behavior-only).  
  - **Internalist Generalist vs. Universal Potentialist:** Both demand internal coherence (Q8A) but diverge on efficiency (Q3). Potentialists tolerate slowness; Generalists are ambiguous.  

  **Unoccupied Answer Combinations & Why:**  
  1. **Q2B (robustness required) + Q3A (speed irrelevant) + Q6B (slow alien unintelligent)**  
     - *Why:* Incoherent. Demanding robustness but rejecting the slow alien implies efficiency matters, contradicting Q3A.  

  2. **Q4B (no group intelligence) + Q5B (human-model system is intelligent)**  
     - *Why:* Unattractive. The human-model system *is* a group. Claiming groups can’t be intelligent (Q4B) but the system is (Q5B) is paradoxical.  

  ---

  ### How to Use  
  - Takers select options for all 8 questions.  
  - Compare answers to the 8 positions’ answer profiles.  
  - Closest match (most aligned answers) reveals their stance.  
  - Ambiguities/unoccupied combos highlight conceptual tensions.  

  This forces engagement with cases, not labels—exposing how "intelligence" is a cluster of intuitions about capability, efficiency, and boundaries.
