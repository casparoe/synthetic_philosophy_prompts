  Here's the scene (239 words) followed by the breakdown:

  ---

  Sunlight hits the harbor water at noon, harsh and shattered. Lena squints. Later that afternoon, she watches the same patch: softened now, a single sheet of hammered silver. She notes the difference vaguely, files it away.

  Two mornings later, arranging blue-grey linen napkins for a brunch, she pauses. *That harbor light yesterday afternoon*, she thinks, *was more like* this *napkin’s sheen than like the broken glare at noon*. The napkin’s smooth metallic glow captures it perfectly; the memory of noon’s sparkle feels jaggedly distinct. She sets the table, satisfied.

  Later, her friend remarks how the napkins match the harbor’s afternoon light in a photo Lena took that day. Lena nods, unsurprised. The photo shows only water, no napkin. The confirmation is silent, practical. Had the friend instead commented on the noon light’s sharpness matching something else, Lena would have disagreed instantly, recalling its harsh fragmentation clearly.

  (Control omitted for conciseness – the delay and specificity already imply that such judgments aren't automatic; they require a specific, prompted comparison.)

  ---

  **The Demonstration & Mechanics:**

  1.  **Occurrence vs. Specific Content/Accuracy:** Epiphenomenalism *can* explain why Lena makes *a* judgment about the harbor light when seeing the napkin. The napkin’s appearance triggers neural memory traces (purely physical states) laid down during the two viewings. These traces cause *some* judgment about the past experiences. It explains the *timing* and *topic* of the utterance.
  2.  **The Problem of Specific Content & Accuracy:** What epiphenomenalism *cannot* explain is *why* the specific judgment "Afternoon light was more like *this napkin* than like the noon light" occurs *and is accurate*. The phenomenal qualities (the "what-it-was-like" of the harsh glitter vs. the smooth sheen) are causally inert by hypothesis. They cannot influence the formation of the memory trace or its later recall/interpretation. The judgment's specific comparative content ("more like *this*") and its correctness depend entirely on how those past experiences *felt*, but those feelings did no causal work. The neural traces caused by the physical light at noon and afternoon were different, and *those differences* cause the different judgments. But the accuracy of Lena's judgment – its matching the *phenomenal difference* she experienced – is brute luck. The physical traces cause *a* difference in judgment, but there’s nothing guaranteeing that difference *corresponds accurately* to the epiphenomenal phenomenal difference.
  3.  **Blocking the Joint-Effect Reply:** The **delay** (two days) and the **need for comparison** are key. At the time of each viewing, a neural state *could* jointly cause both the experience and a concurrent judgment *about that single experience*. But Lena’s judgment *days later* compares *two specific past experiences*. No single neural state at the time of viewing could cause *this future comparative judgment*. The judgment relies on stored information (memory traces) about *both* experiences. Epiphenomenalism says the phenomenal qualities didn't shape those stored traces, so they can't explain why the recalled *comparison* accurately reflects the *phenomenal* contrast.
  4.  **Removing the Delay:** If Lena judged *while* seeing the afternoon light ("This is smoother than noon!"), the joint-effect reply works perfectly. A single neural state (caused by the afternoon light) causes both the smooth-quale and the judgment "smoother than before." No problem.
  5.  **If the Object Changed:** If the harbor water itself *was* physically different (e.g., calmer in the afternoon), the epiphenomenalist explains the judgment easily: Lena’s judgment tracks the *physical difference* she detected (via non-phenomenal neural processes), not the phenomenal difference. Her citing the experience becomes an illusion. The fixed world forces the judgment to be about the *experience itself*.
  6.  **Strongest Epiphenomenalist Reply:** "The neural difference caused by the different physical conditions (angle of light, eye adaptation states you ruled out) at noon vs. afternoon *just is* what constitutes the memory of the *phenomenal* difference. There's no 'accuracy luck' because the judgment *is* directly caused by the physical substrate that also hosted the quale. The judgment 'Afternoon was smoother' is caused by Trace B (from afternoon), the judgment 'Noon was jagged' is caused by Trace A (from noon). The quale difference merely accompanied Trace A vs. Trace B. The judgment accurately reports the *neural difference*, and we *call* that neural difference the 'memory of the phenomenal difference.'"
  7.  **What's Doing the Work & Weakest Link:**
      *   **Core Work:** The **delayed, comparative judgment about specific past experiences** is essential. It breaks the joint-cause link and forces the explanation to rely on stored traces. The **verification via napkin/photo** (showing the judgment had specific, accurate content about a *phenomenal* property) prevents dismissing it as just a report of physical differences.
      *   **Potential Weak Link:** The **ban on non-phenomenal information** is hardest to enforce absolutely in the scene and might feel slightly stipulated. A very clever epiphenomenalist *might* posit subtle, unnoticed physical cues Lena subconsciously detected (e.g., pupil dilation states, subtle head movements affecting glare) that shaped the memory traces *and* happened to correlate with the phenomenal shift. You mitigate this by making the judgment fine-grained ("more like *this* napkin") and having her lack any *citable* reason, but a skeptic could *always* posit *some* physical difference. The strength relies on the implausibility of such undetectable physical markers perfectly mirroring the phenomenal contrast *and* being reliably stored/recalled days later to cause an accurate judgment. The scene makes this skepticism seem like special pleading.
