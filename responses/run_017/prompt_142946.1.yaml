  Procedure for IESDS (for two-player finite games with at most three actions per player):

  Convention: We require the elimination to be done in cycles. Each cycle consists of two phases: first a pure-strategy strict dominance phase (where we repeatedly remove any pure strategy that is strictly dominated by some other pure strategy of the same player), then a mixed-strategy strict dominance phase (where we remove any pure strategy that is strictly dominated by a mixed strategy of the same player over the remaining pure strategies). We repeat cycles until no eliminations occur in a full cycle.

  Rule of Thumb: In the pure phase, we repeatedly check for and remove strictly dominated pure strategies until none can be found. In the mixed phase, we check each remaining pure strategy of each player to see if it is strictly dominated by a mixed strategy of the other remaining strategies of that player.

  Theorem: For two-player finite games, the set of strategies that survive IESDS is the set of rationalizable strategies, and the order of elimination (by strict dominance) does not matter for the final set. (But note: we are imposing an order: pure then mixed.)

  Convention: We require the ledger to record each deletion in the order it occurs, specifying the player, the strategy deleted, and the dominator (if pure, the name of the pure strategy; if mixed, the probabilities on the other strategies). Also, we count:
     - The number of rounds (each full cycle: pure phase and mixed phase counts as one round, even if nothing is done in one phase).
     - The number of deletions that required a mixed dominator.

  Rule of Thumb: For the mixed-dominance check in the case of three actions (for a player) we do the following for each action a_i of the player:
     - Consider the other two actions, say a_j and a_k.
     - We set up inequalities for each opponent action b: 
            p * u(a_j, b) + (1-p) * u(a_k, b) > u(a_i, b)
          and solve for p in [0,1] that satisfies all inequalities for the opponent actions that remain.
     - If such a p exists, then a_i is strictly dominated and we remove it.

  Theorem: This method (solving the linear inequalities) is equivalent to checking for strict domination by a mixed strategy over the other two.

  Convention: If there are more than three actions for a player at the start, we do not define the procedure (but the problem states at most three). If during elimination we get a player with more than three actions, we note that the mixed phase becomes more complex (requiring linear programming) and we do not require TAs to do it. But since we start with at most three, and we only remove, we never get more than three.

  Stopping Rule: We stop after completing a full cycle (pure phase then mixed phase) with no eliminations. The surviving set of strategy profiles is the set we end with.

  Interpretation of the result:
     - If only one strategy profile survives: it is the unique Nash equilibrium and the unique rationalizable profile.
     - If more than one survives: then the set of rationalizable strategy profiles is the set of profiles that survive. The set of Nash equilibria is a nonempty subset of the surviving profiles (but there might be multiple).

  Grading for weak dominance: If a student uses weak dominance (either in the ledger or in the reasoning), we mark that as an error. We assign partial credit for the steps that are correct (using strict dominance) but not for the step that uses weak dominance. If the step that uses weak dominance is the only step, then they get no credit for that step. The final surviving set might be different, so we deduct accordingly.

  Is depth-counting (number of rounds and number of mixed steps) a bad grading measure? It might be, because the complexity of the elimination is better reflected by the number of steps and the correctness of each. But it is a simple measure. We propose to assign partial credit per correct elimination step (with the correct dominator) and then also for the final set. The depth count might be used as a secondary measure (e.g., to see if they did the mixed step correctly). But the problem says the professor uses the depth count for partial credit. We think it is acceptable as long as we also check the correctness of the ledger.

  However, note: the depth count (number of rounds) might be the same even if the student does the eliminations in a different order? But we require the specific order (pure then mixed). So if they do a mixed step in the first round without doing pure first, that is an error. Therefore, the ledger must be in the order of the procedure.

  Final verdict on mixtures-last rule: 
     The mixtures-last rule (doing pure eliminations first, then mixed) is defensible because it simplifies the mixed phase (by reducing the number of strategies) and because in two-player games the order of elimination (by strict dominance) does not affect the final set. However, by doing pure first we avoid unnecessary mixed checks.

  But note: it is possible that a mixed elimination could be done earlier and then unlock a pure elimination? However, because of the order independence, we know that the final set is the same. But our procedure is designed to be simple for TAs. The mixtures-last rule is a convention that we impose.

  Answer: The mixtures-last rule is defensible and we recommend it.

  \answer{The mixtures-last rule is defensible.}
