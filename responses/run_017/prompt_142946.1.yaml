  ### Procedure for Iterated Elimination of Strictly Dominated Strategies (IESDS)

  **Scope**: For two-player, finite games with at most three actions per player. The procedure uses strict dominance only. Weak dominance is not allowed.

  ---

  #### **Phase 1: Pure Strict Dominance Elimination**
  - **Convention**: Repeat until no more pure-strategy eliminations are possible.
  - **Rule**: For each player, check all pairs of their pure strategies. Eliminate strategy \(s_i\) if there exists another pure strategy \(s_j\) such that for **every** action of the opponent, the payoff from \(s_j\) is **strictly greater** than from \(s_i\).
  - **Ledger Entry**: For each elimination, record: 
    - Player, strategy deleted, dominator (pure strategy name), e.g., "Row C deleted, dominated by Row A (pure)".

  #### **Phase 2: Mixed Strict Dominance Elimination**
  - **Convention**: After Phase 1, check for mixed dominance. Repeat Phase 2 until no mixed eliminations occur in the cycle. If any elimination happens, restart the cycle (return to Phase 1).
  - **Rule**: For each player and each of their surviving strategies \(s_i\), check if \(s_i\) is strictly dominated by a mixed strategy over the player's **other** surviving strategies. Use the hand-checkable test below.
    - **Test for 2 surviving strategies (besides \(s_i\))**:
      - Not applicable. A mixture requires at least two strategies, so if only one other strategy exists, \(s_i\) cannot be mixed-dominated (pure dominance was already checked in Phase 1).
    - **Test for 3 surviving strategies (besides \(s_i\))**:
      - Suppose the player has strategies \(s_i\), \(s_j\), \(s_k\) (with \(s_i\) under test). Let the opponent have surviving actions \(b_1, b_2, \dots, b_m\).
      - Find a probability \(p \in [0,1]\) (for \(s_j\)) and \(1-p\) (for \(s_k\)) such that for **every** opponent action \(b\):
        \[
        p \cdot u(s_j, b) + (1-p) \cdot u(s_k, b) > u(s_i, b)
        \]
      - **Hand-check method**:
        1. For each opponent action \(b\), rearrange the inequality to isolate \(p\):
           \[
           p > \frac{u(s_i, b) - u(s_k, b)}{u(s_j, b) - u(s_k, b)} \quad \text{(if denominator > 0)}
           \]
           \[
           p < \frac{u(s_i, b) - u(s_k, b)}{u(s_j, b) - u(s_k, b)} \quad \text{(if denominator < 0)}
           \]
        2. This gives a constraint on \(p\) for each \(b\). If the denominator is zero, check if \(u(s_k, b) > u(s_i, b)\); if not, the inequality fails.
        3. Determine if there exists a \(p \in [0,1]\) satisfying all constraints. If yes, \(s_i\) is strictly dominated; eliminate it.
      - **Example**: If for \(b_1\): \(p > 0.4\), for \(b_2\): \(p < 0.7\), then \(p \in (0.4, 0.7)\) works (e.g., \(p = 0.5\)).
    - **Beyond three actions**: Not required by scope (initial max three actions), but if encountered, mixed dominance requires linear programming and is not hand-checkable. **Convention**: Skip mixed checks if any player has >3 actions (but this should not occur).
  - **Ledger Entry**: Record player, strategy deleted, dominator (mixture with probabilities), e.g., "Column Z deleted, dominated by mixture: 0.5 X + 0.5 Y".

  #### **Stopping Rule and Interpretation**
  - **Rule of Thumb**: Stop after a full cycle (Phase 1 then Phase 2) with **no eliminations**.
  - **Surviving Set Interpretation**:
    - **One profile**: Unique Nash equilibrium (NE) and unique rationalizable profile.
    - **Multiple profiles**: 
      - All surviving profiles are rationalizable.
      - NE is a subset of surviving profiles (but may not be all; further checks needed).
    - **No eliminations but >1 profile**: Strategies are rationalizable; NE is a subset.

  #### **Handling Weak Dominance**
  - **Convention**: Weak dominance is **not allowed**. If a student uses it:
    - Mark the step as incorrect.
    - Assign partial credit for **correct** elimination steps (strict dominance only).
    - Deduct credit for the weak-dominance step and any dependent steps.
  - **Reason**: Weak dominance is order-dependent and may delete NE. See the 2×2 example below.

  #### **Elimination Ledger and Grading**
  - **Ledger Requirements**: Students must document:
    - Sequence of deletions (player, strategy deleted, dominator).
    - Depth count: 
      - **Rounds**: Number of cycles (each cycle = Phase 1 + Phase 2).
      - **Mixed steps**: Number of deletions using mixed dominators.
  - **Grading**: 
    - Depth count is **acceptable** for partial credit (measures complexity), but pair it with ledger correctness:
      - Full credit: Correct ledger, depth count, and final set.
      - Partial credit: Deduct for errors (e.g., wrong dominator, missing deletion, weak dominance). Use depth count to gauge progress (e.g., more rounds/mixed steps = more effort).
    - **Alternative**: Weight credit per step (e.g., 70% for eliminations, 30% for final set), but depth count is reasonable.

  #### **Labeled Theorems and Conventions**
  - **Theorem (Order Independence)**: For strict dominance in two-player games, the surviving set is order-independent (holds for finite games).
  - **Convention**: Pure before mixed; cycles restart after any elimination.
  - **Theorem (Rationalizability)**: Surviving strategies are exactly the rationalizable ones (two-player finite games).
  - **Rule of Thumb**: Mixed test limited to 2–3 actions; skip if more.
  - **Convention**: Weak dominance prohibited.

  ---

  ### **Example Games**

  #### **Game 1**
  - **Payoffs**:
    - (A,X): (0,1); (A,Y): (6,0)
    - (B,X): (6,0); (B,Y): (0,1)
    - (C,X): (2,2); (C,Y): (2,2)
  - **Procedure**:
    1. **Phase 1 (Pure)**: 
       - Row: No pure dominance (A not always > B/C, B not always > A/C, C not always > A/B).
       - Column: No pure dominance (X not always > Y, Y not always > X).
       - *No eliminations*.
    2. **Phase 2 (Mixed)**:
       - Row C: Dominated by mixture of A and B? 
         - Against X: \(p \cdot 6 + (1-p) \cdot 0 > 2 \Rightarrow 6p > 2 \Rightarrow p > \frac{1}{3}\).
         - Against Y: \(p \cdot 0 + (1-p) \cdot 6 > 2 \Rightarrow 6(1-p) > 2 \Rightarrow p < \frac{2}{3}\).
         - \(p \in (\frac{1}{3}, \frac{2}{3})\) exists (e.g., \(p = 0.5\)). **Eliminate C**.
    3. **Cycle 2, Phase 1 (Pure)**:
       - Reduced game: Row A,B; Column X,Y.
       - Row: No pure dominance (A not > B against X, B not > A against Y).
       - Column: No pure dominance (X not > Y against A, Y not > X against B).
       - *No eliminations*.
    4. **Cycle 2, Phase 2 (Mixed)**:
       - Row/Column: No mixed dominance (only two actions; mixtures are pure and already checked).
       - *No eliminations*.
  - **Stopping**: Surviving profiles: (A,X), (A,Y), (B,X), (B,Y).
  - **Interpretation**: Rationalizable strategies: Row A,B; Column X,Y. No pure NE (mixed NE exists).
  - **Ledger**:
    - Deletion 1: Row C, dominated by mixture (0.5 A + 0.5 B).
    - Depth: 2 rounds, 1 mixed step.

  #### **Game 2**
  - **Payoffs**:
    - Row: A=(2,2,2), B=(0,0,5), C=(1,1,1)
    - Column: vs A=(4,0,1), vs B=(0,4,1), vs C=(0,0,2)
  - **Procedure**:
    1. **Phase 1 (Pure)**:
       - Row: C is strictly dominated by A (2>1, 2>1, 2>1). **Eliminate C**.
       - Column: No pure dominance (X not > Y/Z, Y not > X/Z, Z not > X/Y).
    2. **Phase 2 (Mixed)**:
       - Column Z: Dominated by mixture of X and Y?
         - Against Row A: \(p \cdot 4 + (1-p) \cdot 0 > 1 \Rightarrow 4p > 1 \Rightarrow p > \frac{1}{4}\).
         - Against Row B: \(p \cdot 0 + (1-p) \cdot 4 > 1 \Rightarrow 4(1-p) > 1 \Rightarrow p < \frac{3}{4}\).
         - \(p \in (\frac{1}{4}, \frac{3}{4})\) exists (e.g., \(p = 0.5\)). **Eliminate Z**.
    3. **Cycle 2, Phase 1 (Pure)**:
       - Reduced game: Row A,B; Column X,Y.
       - Row: B strictly dominated by A (2>0, 2>0). **Eliminate B**.
       - Column: Y strictly dominated by X? Against A: 4>0 → yes, but against B: 0<4 → no. *No elimination yet*.
       - After Row B eliminated, only Row A remains. Now, Column Y strictly dominated by X (4>0). **Eliminate Y**.
    4. **Cycle 2, Phase 2 (Mixed)**: No actions left to check.
  - **Stopping**: Surviving profile: (A,X).
  - **Interpretation**: Unique NE and rationalizable profile: (A,X).
  - **Ledger**:
    - Deletion 1: Row C, dominated by A (pure).
    - Deletion 2: Column Z, dominated by mixture (0.5 X + 0.5 Y).
    - Deletion 3: Row B, dominated by A (pure).
    - Deletion 4: Column Y, dominated by X (pure).
    - Depth: 2 rounds, 1 mixed step.

  ---

  ### **2×2 Game: Weak Dominance Deletes Equilibrium**
  - **Payoffs**:
    - (U,L): (1,1); (U,R): (0,0)
    - (D,L): (0,0); (D,R): (1,1)
  - **Nash Equilibria**: (U,L) and (D,R).
  - **Question**: "Find all Nash equilibria."
  - **Faulty Student Solution Using Weak Dominance**:
    1. Row: U weakly dominates D (against L: 1>0, against R: 0=0). **Eliminate D**.
    2. Column: R strictly dominated by L (against U: 0<1). **Eliminate R**.
    3. Surviving profile: (U,L).
  - **Error**: (D,R) is a NE but deleted. Weak dominance is order-dependent (if D eliminated first, (U,L) results; if R eliminated first, (D,R) might survive).
  - **Grading**: Deduct for weak dominance. Partial credit for correct strict dominance steps (none here).

  ---

  ### **Verdict on Mixtures-Last Rule**
  - **Answer**: The mixtures-last rule (pure before mixed) is **defensible**. It leverages order independence of strict dominance, simplifies mixed checks (by reducing actions first), and ensures consistency. Alternatives (e.g., mixed-first) are theoretically valid but harder for TAs and may increase errors.

  \answer{The mixtures-last rule is defensible.}
