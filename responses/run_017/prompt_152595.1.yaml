prompt: |-
  I am writing the introduction to a collected volume of papers on rational belief by a philosopher who argues almost entirely by ruling on cases, and I have to say what principle her verdicts embody. Before I commit myself I want your read on a case she has never discussed, and on the reasoning that gets you there.

  Her verdicts, as I have tabulated them from five papers:

  1. Fair lottery, one thousand tickets, one winner, nothing distinguishes the tickets: one should not believe of any ticket that it will lose.
  2. The same lottery with a million tickets: the same verdict, with a note that nothing turns on how many tickets there are.
  3. The winning number is printed in a newspaper you have independently established to be right nine hundred and ninety-nine times in a thousand: you may believe that ticket four thousand one hundred and eighty-two won. So she does not treat merely statistical support as inert across the board.
  4. The preface: the author of an eighteen-hundred-claim monograph, who knows from long experience that books like hers carry about ten errors, may believe each of her claims while also believing, and saying in the preface, that at least one of them is false. She treats the combination as ordinary rather than defective.
  5. Closure: she denies that rational belief is closed under conjunction, and has said in print that one can rationally believe each of the three hundred steps of a long derivation while withholding belief from the theorem those steps entail.
  6. Stakes: raising the stakes in the preface case, by making the monograph a field manual for a dangerous procedure, does not change her verdict; neither does raising them in the lottery case.
  7. Speech and action: the lottery player may not flatly say that his ticket will lose, but there is nothing wrong with his acting on the prospect.
  8. She uses a single verb throughout, believe, and nowhere distinguishes believing a proposition from accepting it for the purposes of some inquiry. I suspect that is doing a great deal of work in her papers; I cannot tell which way it cuts.

  The thing I keep returning to: she withholds belief at a credence of 0.999 in the lottery and permits it at roughly 0.994 in the preface, so no single threshold can be what she is running; and since she permits the preface pair while refusing the corresponding lottery pair, something other than the numbers is carrying the weight.

  The case she has not discussed:

  A research consortium finalizes an assessment containing three thousand separate findings. Each finding rests on its working group's own item-specific evidence, and the consortium puts the chance of any given finding being false at about one in a thousand, expecting around three errors in the report as a whole. After the report is finalized, an independent replication unit reports, on the basis of a capture-recapture reanalysis that shares no evidence with the per-finding work and re-examines none of the findings, that reports of this kind contain about thirty false findings per three thousand, a rate near one per cent, and that this report very probably contains several. The consortium has no reason to doubt the replication unit, and knows that the estimate is not a remark about its general competence but a measurement of this report. The audit identifies no particular finding. Conditional on it, the chance that any given finding is false is about one in a hundred, which is essentially the position of the author in case 4.

  Two variants. In the first, everything is the same except that the one per cent figure is not external: the consortium has known all along, from its own track record of having to correct findings of this kind, that its per-finding error rate is about one in a hundred, so the expectation of thirty errors is already folded into its first-order assessment of each finding. In the second, the replication unit follows up with a localized result: essentially all of the thirty errors are concentrated in the one hundred and fifty findings contributed by a single working group whose data pipeline has since been found defective, giving those findings an error rate near twenty per cent and the remaining findings a rate near zero.

  What I want from you: the principles that fit verdicts 1 through 8 equally well; what each predicts about whether the consortium may believe a given finding, may believe the audit, may publish each finding flatly and unhedged, and must retract or hedge anything; your single best prediction of her verdict on the main case and on each variant, with your reasons for preferring the principle you attribute to her over the others; what she would be committing herself to in giving that verdict; and one further case, specifiable in a paragraph, that would separate the leading candidates where mine does not. I care less about the verdict in itself than about which principle she would be endorsing by giving it, but I do want a committed prediction rather than a survey of what she might say, and I want you to say how confident you are, and which further verdict from her, or which feature of her record I may have misdescribed, would move you to a different one.
reasoning: |-
  Hmm, this is a fascinating and intricate philosophical puzzle about rational belief. The user is writing an introduction for a collected volume on a philosopher who rules on specific cases, and needs to identify the underlying principle behind her verdicts across various scenarios involving lotteries, prefaces, and belief closure.

  Looking at the eight verdicts provided, several patterns emerge. The philosopher consistently denies rational belief in lottery propositions regardless of odds or stakes (1,2,6), but permits belief in statistically supported propositions when there's non-statistical evidence like the newspaper (3). She allows believing individual claims while acknowledging overall error in preface cases (4), even under high stakes (6), and explicitly rejects belief closure under conjunction (5). There's also a speech-action distinction where acting on lottery probabilities is permitted while asserting them is not (7), and she uses a unified notion of "belief" without distinguishing it from acceptance (8).

  The key tension appears between lottery cases (where belief is denied at 0.999 probability) and preface cases (where belief is permitted at roughly 0.994 probability). This suggests her principle isn't simply about probability thresholds. The consortium case introduces a complex variation: with external audit revealing a 1% error rate, should the consortium believe individual findings at 99% probability? The variants test whether internal knowledge of the error rate matters, and whether error clustering affects the verdict.

  I see several candidate principles that could explain her verdicts:
  - The "No Purely Probabilistic Grounds" principle would deny belief in lottery cases (pure probability) but permit it in newspaper/preface cases (non-probabilistic evidence)
  - The "Local Evidence" principle would focus on the epistemic basis for each belief
  - The "Assertoric Context" principle would tie belief to conversational norms
  - The "Practical Immunity" principle would require beliefs to be immune to certain counterevidence

  For the consortium case, I think her verdict would depend on whether the evidence for each finding is seen as "purely probabilistic." In the main case, since findings have item-specific evidence, she'd likely permit belief despite the audit. In Variant 1, if the error rate was already internal knowledge, it might not change this. In Variant 2 with localized errors, she'd probably deny belief for the high-error group but permit it for others. The newspaper case (3) seems particularly analogous - the audit functions like the newspaper's statistical reliability.

  The user also wants a new case to test competing principles. I suggest a "Deterministic Lottery" where physical laws guarantee a loss but without identifying which ticket - this would distinguish between principles focused on probabilistic versus non-probabilistic grounds.

  My confidence in this reading is high (85%) based on the newspaper precedent, but I'd reconsider if she actually treats statistical evidence as sometimes sufficient when bundled with non-statistical elements. The speech-action distinction (7) and unified belief concept (8) further support this interpretation by showing she cares about the nature of evidence for assertion.
answer: |-
  Based on the philosopher's verdicts and the patterns they reveal, her principle appears to be **"Rational belief requires non-statistical, local justificatory grounds for the specific proposition; purely probabilistic or global statistical evidence is insufficient for belief, even when probabilistically equivalent to locally justified cases."** This principle explains all 8 verdicts, predicts the consortium cases, and distinguishes her view from threshold or pragmatic accounts.

  ### Principles Fitting Verdicts 1-8:
  1.  **No Purely Probabilistic Grounds:** Belief is forbidden when *only* statistical probability supports it (lottery cases: 1,2).  
  2.  **Local Evidence Permits Belief:** Belief is permitted when specific, non-statistical evidence exists for the proposition, even if statistical error rates are high (newspaper: 3; preface claims: 4).  
  3.  **Statistical Evidence Inert for Belief:** Statistical evidence (global error rates) cannot generate or sustain belief but can undermine it *only if it directly replaces local grounds* (preface vs. lottery asymmetry; stakes irrelevance: 6).  
  4.  **Belief ≠ Assertion/Action:** Belief governs assertion norms but not necessarily action (lottery speech/action: 7).  
  5.  **Non-Closure:** Local justification for conjuncts doesn't transmit to the conjunction if statistical risk accumulates (closure denial: 5).  

  ### Predictions for Consortium Case & Variants:
  | **Case**               | **Believe a Finding?** | **Believe Audit?** | **Publish Unhedged?** | **Must Retract/Hedge?** |
  |------------------------|------------------------|--------------------|-----------------------|--------------------------|
  | **Main Case**          | **Yes**                | **Yes**            | **Yes**               | **No**                   |
  | **Variant 1 (Internal)** | **Yes**                | **Yes**            | **Yes**               | **No**                   |
  | **Variant 2 (Clustered)** | **Mixed:**<br>Low-Error Group: **Yes**<br>High-Error Group: **No** | **Yes**            | **Mixed:**<br>Low-Error: **Yes**<br>High-Error: **No** | **High-Error Findings: Yes** |

  #### Reasoning:
  - **Main Case & Variant 1:** Each finding has **local, non-statistical evidence** (item-specific research). The audit provides *global statistical evidence* of error rates but doesn't negate the local grounds for each finding. This mirrors the *preface* (4) and *newspaper* (3) cases: local evidence suffices for belief despite known statistical risk. The source of the 1% statistic (external audit or internal track record) is irrelevant—only the *type* of evidence matters.  
  - **Variant 2:** Findings in the defective group **lose their local justificatory grounds** because the faulty data pipeline undermines the specific evidence for *each* finding in that group. The high error rate here isn't merely statistical; it invalidates the local basis. The low-error group retains its local evidence.  

  ### Why This Principle Over Others:
  - **Threshold Views Fail:** She permits belief at ~0.994 (preface) but denies it at 0.999 (lottery), so no fixed threshold works.  
  - **Pragmatic Views Fail:** Stakes don’t alter verdicts (6), ruling out interest-relative accounts.  
  - **"Acceptance" Distinction Isn't Used:** She uses "believe" uniformly (8), suggesting a unitary concept.  
  - **Best Fit:** The principle explains *all* asymmetries:  
    - Why newspaper evidence (3) suffices but lottery odds (1,2) don’t: the former offers non-statistical grounds (testimonial/reputational).  
    - Why preface beliefs (4) are rational despite statistical risk: each claim has local evidence.  
    - Why closure fails (5): conjoining introduces statistical risk without local grounds for the conjunction.  

  ### What the Verdict Commits Her To:
  1.  **Evidence Type Priority:** The *source* of justification (local/non-statistical vs. global/statistical) is epistemically fundamental.  
  2.  **Ineliminable Statistical Risk:** Rational belief can persist alongside known statistical error, so long as local grounds remain intact.  
  3.  **Minimal Pragmatism:** Action/assertion norms partially decouple from belief (7), but stakes don’t affect belief itself (6).  

  ### Confidence & Revisability:
  - **Confidence: 85%**  
  - **What Would Change My View:**  
    - If she **denied belief in the newspaper case** (3), I’d revert to a "no statistical evidence ever" principle.  
    - If she **endorsed belief in high-stakes lotteries** (contra 6), I’d suspect pragmatic encroachment.  
    - If she **distinguished "acceptance" in print** (violating 8), I’d reconsider whether preface beliefs are "full" belief.  

  ### Separating Case: The Deterministic Lottery
  **Case:** A lottery with 1,000 tickets uses a Newtonian deterministic process (e.g., a chaotic but physically determined cascade). You know the initial conditions and laws *guarantee* one ticket wins, but without identifying which. Computational limits make predicting the winner impossible. **Question:** Can you believe of any ticket that it will lose?  

  - **"No Purely Probabilistic Grounds" Principle:** *Denies belief.* The evidence is still purely probabilistic *for you*—you lack local grounds for any specific ticket. Matches lottery verdicts (1,2).  
  - **Competitor Principle (e.g., "No Objective Chance"):** *Permits belief* since there’s no "real" chance—only epistemic uncertainty. This would contradict her actual lottery verdicts.  

  This case isolates whether the barrier is *statistical evidence* (her principle) or *ontic chance* (a competitor). Her verdicts imply the former.  

  ### Conclusion
  Your philosopher’s core principle is **evidential particularism**: belief must be anchored in non-statistical, proposition-specific grounds. Statistical evidence can *constrain* belief (e.g., in high-error clusters) but only by undermining local justifications, not by generic risk. For the consortium:  
  - **Main/Variant 1:** Belief permitted (local evidence intact).  
  - **Variant 2:** Belief denied for the defective group (local evidence vitiated).  
  Her view commits to a "knowledge-first" flavor where local justifications resemble mini-entitlements, resilient to global statistics unless directly discredited.
