prompt: |-
  I work in grantmaking at a small foundation, and over the last few years I've come to notice that my official view about long-run consequences and my actual practice have quietly come apart. Officially I accept the cluelessness worry: for almost anything we fund, the effects running out past a few decades are larger in expectation than the effects we can measure, and our evidence about their sign is close to worthless, so it looks like I should either be paralysed or should be funding whatever has the best story about the far future rather than whatever has the best near-term evidence. In practice I am neither paralysed nor a long-termist, and I'm fairly confident about most of the calls I make. I'd like to know what principle I am implicitly using, stated precisely enough that I can apply it to a case I haven't decided.

  Here are the calls, as I actually make them. (a) Give now to an anti-malaria charity with unusually good near-term evidence, versus holding the money in an index fund and giving the (much larger) sum in thirty years: I give now, without much unease. (b) Call it the sealed-envelope program: its near-term effects are well measured and clearly good, but two long-run models of apparently equal credibility say, respectively, that its population-level effects make it astronomically good and catastrophically bad, and I can see no way to arbitrate between them: I fund it. (c) The empty box: a grant whose near-term effects are essentially unmeasurable and whose case rests entirely on a diffuse, untestable long-run story: I decline it — and I keep declining it even when I rescale the long-run story upward until the diffuse benefit is, on its own terms, enormous, which makes me suspect the size of the benefit isn't really what's doing the work. (d) The tail: a grant that might — maybe one in a thousand, maybe one in a million, nobody can say — avert a civilisational catastrophe, and otherwise does nothing measurable: I fund it, and I fund it in preference to (c), even though (c) and (d) are alike in having no measurable near-term effects and inscrutable ones further out. (e) Two grants with identical near-term and long-run epistemic profiles, except that one is a one-off and the other is the first of about two hundred similar grants we expect to make over the next decade, where if the long-run story is wrong we will have repeated the mistake two hundred times: I'm comfortable with the one-off and distinctly uneasy about the first of the series, even though the first grant's own effects are the same either way. (f) When two equally credible long-run models agree on the sign of an intervention's effect but differ by a factor of a thousand about its size, I act without anxiety; when they disagree about the sign, I feel I ought to abstain — but I also think abstaining is just another action with inscrutable long-run effects, so in the end I decide on near-term grounds anyway, and I can't say why that isn't simply giving up.

  Two candidate principles have been floating around our office, and I'd like them tested against these verdicts rather than summarised. A colleague's is what he calls the corridor rule: when the long-run effects of your options are inscrutable, choose the option that best preserves the capacity of whoever comes later to notice the mistake and reverse course — buy information, stay reversible, don't burn the option to change your mind. My own is cruder: treat inscrutable long-run effects as having an expected value of zero, subtract a penalty for how much variance you're taking on, and decide on everything else. Tell me which of my six verdicts each gets wrong, whether either can be repaired into something that gets all or nearly all of them, and which verdict you'd overturn if you had to — I'd rather give up a verdict than accept a principle with a clause that exists only to save it. Then apply whatever you land on to the case I keep going back and forth on: an intervention whose near-term effects are large and well evidenced but which is effectively irreversible, where the long-run models disagree about the sign and I won't get a second chance. I don't want a survey of the literature or any citations; I want the principle, the clause-by-clause motivation from my cases, and an honest account of which of my verdicts no tidy principle can accommodate.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user works at a small foundation and is grappling with a disconnect between their official stance on long-term impacts and their actual grantmaking decisions. They accept the "cluelessness worry"—that long-term effects are huge but unpredictable—yet in practice, they make confident decisions that don't align with strict long-termism. They want to uncover the implicit principle behind their actions.

  First, I need to understand their specific cases (a) through (f). Each scenario tests different aspects of how they weigh near-term evidence against long-term uncertainty. For example, in (a), they prefer giving now to anti-malaria efforts over saving to give more later, despite the potential for a larger future sum. This suggests they value immediate, measurable impact. In (b), they fund a program with good near-term effects even when long-term models are split, indicating that strong near-term evidence can override long-term uncertainty. 

  Case (c) is interesting—they reject the "empty box" grant, even when the long-term benefit is scaled up. This implies that measurability matters more than the size of hypothetical benefits. Case (d) shows they're willing to fund tail-risk prevention, which has no near-term effects but could avert catastrophe. This seems like an exception to their usual preference for measurability, but only for extreme risks. 

  In (e), they're uneasy about repeated grants versus a one-off, suggesting concern over compounding errors. Finally, (f) highlights their discomfort when long-term models disagree on the sign of impact, though they end up defaulting to near-term grounds. 

  The user mentions two candidate principles: the corridor rule (prioritize reversibility and learning) and their own crude model (set long-term EV to zero minus variance). I need to test these against their cases. The corridor rule might explain (e) and (f) but fails in (d) since tail-risk interventions are often irreversible. Their crude model works for (a), (b), and (c) but doesn't account for (d)'s tail-risk willingness or (e)'s repetition aversion. 

  The key might be combining elements. Perhaps the user implicitly uses near-term evidence as a tiebreaker when long-term effects are inscrutable, but makes exceptions for tail risks. The aversion in (e) could stem from risk aggregation—repeating a mistake amplifies potential harm. For (f), sign disagreement creates paralysis, but near-term evidence breaks the deadlock. 

  Applying this to their unresolved case—irreversible intervention with sign disagreement—the principle would prioritize near-term benefits unless there's a clear tail risk. Since the models disagree on sign, and it's irreversible, declining might be consistent with their other decisions, especially given the importance of reversibility in (e). But they'd need to weigh the near-term gains against the risk of locking in a negative path. 

  The toughest verdict to square is (d), funding tail risks without near-term evidence. It's an outlier in their pattern, suggesting that catastrophic risks trigger a different heuristic. Maybe they see such risks as non-negotiable regardless of uncertainty. If forced to overturn a verdict, (d) might be the one, but it's a core part of their judgment. Alternatively, accepting that tail risks have a special status could be necessary, even if it makes the principle less tidy.
answer: |-
  Here’s a rigorous principle distilled from your verdicts, tested against your cases, and applied to your unresolved scenario. The core insight is that **you treat long-run effects as "actionable" only when they meet specific epistemic thresholds, defaulting to near-term evidence otherwise**:

  ### The Principle: **Epistemic Thresholds for Long-Risc (ETLR)**
  1. **Default**: When long-run effects are *inscrutable* (lacking credible models or testable mechanisms), ignore their expected value and variance.  
  2. **Exceptions**:  
     - **Tail-Risk Exception**: Fund interventions with credible, catastrophic tail risks (even if probability/mechanism is uncertain).  
     - **Reversibility Penalty**: Penalize irreversible actions that risk locking in harm or precluding learning.  
     - **Repetition Penalty**: Penalize actions enabling repeated, uncorrectable errors.  
  3. **Decision Rule**: Maximize near-term impact subject to:  
     - Avoiding irreversible harm (when credible),  
     - Mitigating catastrophic tail risks (when credible),  
     - Discounting benefits that rely solely on untestable long-run models.  

  ---

  ### Clause-by-Clause Motivation from Your Cases
  | **Case** | Your Verdict | ETLR Explanation |  
  |----------|--------------|------------------|  
  | **(a) Anti-malaria vs. investing** | Fund now | *Long-run effects of both options are inscrutable (investing could fund future harm/good). Default to near-term evidence.* |  
  | **(b) Sealed-envelope program** | Fund | *Long-run models cancel out (inscrutable sign). Near-term effects are clear and positive.* |  
  | **(c) Empty box (diffuse long-run story)** | Decline | *Fails epistemic threshold: no credible mechanism or testable model. Size irrelevant without actionable evidence.* |  
  | **(d) Tail-risk intervention** | Fund | *Triggers tail-risk exception: credible catastrophic downside (even if probability is fuzzy).* |  
  | **(e) One-off vs. repeated grants** | Uneasy about repetition | *Repetition penalty: 200x exposure to uncorrectable errors if long-run model is wrong.* |  
  | **(f) Sign vs. magnitude disagreement** | Act on near-term when sign uncertain | *Sign disagreement → inscrutable → default to near-term. Magnitude disagreement doesn’t invalidate the model.* |  

  ---

  ### Why Competing Principles Fail
  - **Your "Crude Model" (long-run EV=0 – variance)**  
    - ✅ Gets (a), (b), (c), (f) right.  
    - ❌ **Fails (d)**: Doesn’t explain funding tail risks (high variance should penalize it).  
    - ❌ **Fails (e)**: Variance doesn’t capture repetition risk.  

  - **Colleague’s "Corridor Rule" (prioritize reversibility/learning)**  
    - ✅ Explains (e) (repetition risk) and parts of (f) (abstaining as reversible).  
    - ❌ **Fails (a)**: Giving now isn’t reversible; investing preserves optionality.  
    - ❌ **Fails (d)**: Tail-risk interventions (e.g., pandemic prep) are often irreversible.  
    - ❌ **Fails (c)**: Empty box might *claim* to "preserve options" (but you reject it).  

  ---

  ### The One Verdict to Overturn: **(f) Sign Disagreement**  
  - **Issue**: You default to near-term when long-run sign is uncertain, but note abstaining also has inscrutable effects.  
  - **ETLR Resolution**:  
    - If models disagree on sign, long-run effects are *inscrutable* → default to near-term.  
    - Abstaining *is* an action, but ETLR doesn’t require "neutrality"—it prioritizes measurable impact when long-run is opaque.  
  - **Overturn**: Your unease about abstaining is valid, but ETLR resolves it cleanly: **Act on near-term evidence unless tail-risk/reversibility applies**. No need for paralysis.  

  ---

  ### Applying ETLR to Your Unresolved Case  
  **Scenario**: *Irreversible intervention, large near-term benefits, long-run models disagree on sign.*  
  - **ETLR Analysis**:  
    1. Long-run sign disagreement → **inscrutable** (ignore long-run EV).  
    2. Near-term benefits are **large/well-evidenced** → favors funding.  
    3. **But**: Irreversibility risk → *if* one model predicts credible catastrophe (not just "net negative"), the **tail-risk exception** *might* trigger caution.  
  - **Verdict**:  
    - If *no credible catastrophe model* exists → **FUND** (prioritize near-term gains).  
    - If *catastrophe is credible* (e.g., model suggests lock-in of existential risk) → **DECLINE** (invoke tail-risk exception + reversibility penalty).  
  - **Why?** Irreversibility alone isn’t decisive (see your funding of tail risks). But when combined with credible catastrophic downside, the penalty outweighs near-term gains.  

  ---

  ### Where ETLR Isn’t Tidy  
  - **Tail-Risk Threshold**: Your funding of (d) relies on subjective "credibility" of catastrophe (e.g., "civilizational collapse" feels more tangible than (c)’s "diffuse benefit"). This is a necessary judgment call.  
  - **Repetition Penalty**: ETLR doesn’t quantify the penalty—it’s a heuristic for systemic risk (as in (e)).  

  **Conclusion**: Your implicit principle is **pragmatic epistemic prioritization**. You ignore long-run claims without anchors (testability, catastrophe, reversibility cues), maximize measurable good, and penalize actions that multiply risks. ETLR captures this while resolving your cases and dilemma.
