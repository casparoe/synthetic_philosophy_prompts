  ## GALACTIC AIRWAYS CONDITIONS OF CARRIAGE (EARTH/TWIN EARTH SERVICE)

  **Effective Stardate: [Redacted]**

  **1. Definitions and Interpretation**
      1.1 "Carrier" means Galactic Airways Ltd.
      1.2 "Passenger" means any person, except members of the crew, carried or to be carried in the Aircraft.
      1.3 "Contract of Carriage" means these Conditions, the Itinerary, and applicable regulations.
      1.4 "Point of Origin" means the planetary body from which the journey commences.
      1.5 "Point of Destination" means the planetary body designated as the journey's end.
      1.6 "Local Environment" means the totality of physical conditions prevailing at a specific location, including but not limited to atmospheric composition, gravitational forces, and the underlying microstructure of substances present. The Carrier shall determine the relevant Local Environment for the purposes of these Conditions.
      1.7 "Cabin Environment" means the controlled conditions within the Aircraft during transit.

  **2. Applicability and Scope**
      2.1 These Conditions govern the relationship between the Carrier and the Passenger for all carriage between Earth and Twin Earth.
      2.2 Carriage is subject to the Local Environment prevailing at the Passenger's Point of Origin at the commencement of travel *and* the Local Environment prevailing at the Point of Destination upon arrival. The Carrier accepts no liability for shifts in the applicable Local Environment occurring during the voyage.

  **3. Determination of Meaning and Reference**
      3.1 For all purposes related to Passenger requests, communications, complaints, and contractual obligations undertaken during the voyage or pertaining to services at destination, the meaning of terms used by the Passenger shall be fixed by the Local Environment prevailing at the *Point of Utterance* relevant to the matter in question.
      3.2 The "Point of Utterance" shall be determined by the Carrier as follows:
          a) For utterances pertaining to services requested *for delivery within the Cabin Environment* during transit: the Local Environment at the Point of Origin.
          b) For utterances pertaining to services requested *for delivery at the Point of Destination*: the Local Environment at the Point of Destination.
          c) For all complaints or claims lodged post-flight: the Local Environment at the Point of Destination at the time of arrival.
      3.3 The Carrier's determination of the Point of Utterance and the consequent meaning of the Passenger's terms is final and binding. The Passenger's internal state, memories, or intentions at the time of utterance are not considered determinative factors under this contract.

  **4. Passenger Awareness and Authority**
      4.1 The Passenger acknowledges that extended subluminal transit (typically 4.7 Earth Years) may traverse regions where the binding Local Environment for future utterances undergoes a gradual shift. This shift occurs without perceptible alteration to the Passenger's subjective experience or the Cabin Environment.
      4.2 Notwithstanding Clause 4.1, the Carrier affirms the Passenger retains full *a priori* knowledge of the meaning of their *own* utterances *as determined by the applicable Local Environment at the relevant Point of Utterance*. The Passenger requires no external scientific investigation to possess this knowledge. Difficulty in *predicting* the reference of future utterances based on current intentions does not constitute a lack of authority over one's *actual* meaning at the Point of Utterance.

  **5. Specific Provisions Regarding Onboard Services**
      5.1 **Beverage Service:** Passengers requesting "water" shall be served the potable liquid designated as such by the Local Environment applicable under Clause 3.2. A complaint that the liquid served (e.g., H₂O or XYZ) does not correspond to the liquid the Passenger "intended" or "pictured" is not valid grounds for redress, as meaning is fixed by the applicable Local Environment, not internal representation. Complaints regarding taste, safety, or conformity to advertised description based on *local* standards may be considered.
      5.2 **Fixed Reference Cabins (Optional Supplement):** For an additional fare (see Schedule SFR-1), Passengers may book accommodation within a designated cabin where crew members are instructed to interpret all Passenger utterances *as if the Local Environment of the Point of Origin remained continuously binding throughout the voyage*, regardless of actual transit progress. This service provides conversational continuity but does not alter the binding meaning for contractual, safety, or destination service purposes as defined in Clause 3. The Carrier accepts no liability for confusion arising from this disjunction.

  **6. Liability Limitations**
      6.1 The Carrier shall not be liable for any loss, disappointment, or existential discomfort arising from:
          a) The inherent shift in the binding Local Environment during transit and its effect on the reference of terms.
          b) The Passenger's lack of awareness regarding the precise moment the binding Local Environment for future destination-directed utterances transitions from that of the Point of Origin to that of the Point of Destination.
          c) Any discrepancy between the Passenger's subjective sense of consistent meaning and the meaning objectively determined under Clause 3.

  **7. Complaints Procedure**
      7.1 All complaints must be submitted in writing to Galactic Airways Customer Relations, [Twin Earth Orbital Hub Address], within 30 Earth Days of arrival at the Point of Destination.
      7.2 Complaints will be adjudicated based on the meaning of the Passenger's claims *as fixed by the Local Environment of the Point of Destination at the time of the Passenger's arrival*.

  **MODEL COMPLAINT & RESPONSE**

  **From:** A. Passenger, Sleeper Pod 7-Gamma
  **To:** Galactic Airways Customer Relations
  **Subject:** Misrepresentation of Product / Incorrect Beverage Service

  Dear Sir/Madam,

  I awoke from hibernation on final approach to Twin Earth and requested water. The steward brought me a glass of clear liquid. Upon tasting it, I immediately realised it was not water (H₂O) but that other stuff (XYZ). This is completely unacceptable. When I boarded on Earth, I asked for water and received proper H₂O. I have always meant H₂O by "water", throughout my entire voyage. My intention was clear and consistent. I demand compensation for being mis-served a fundamentally different substance under the same name, causing significant distress. I knew exactly what I meant when I asked for it.

  Yours faithfully,
  A. Passenger

  **Galactic Airways Response:**

  Dear Ms. Passenger,

  Thank you for your correspondence. Your request for "water" upon final approach to Twin Earth was correctly fulfilled according to the meaning of the term fixed by the Local Environment prevailing at your Point of Destination (Twin Earth), as per Clause 3.2(b) of our Conditions of Carriage. We note you possessed full *a priori* knowledge of this meaning at the moment of your utterance (Clause 4.2). No compensation is due.

  Sincerely,
  Customer Relations Agent #774

  *(The reader is invited to ponder whether Ms. Passenger’s profound sense of grievance about the shift in what she ‘meant’ without her feeling it, versus the airline’s implacable bureaucratic logic rooted in her external linguistic context, constitutes a genuine complaint.)*
