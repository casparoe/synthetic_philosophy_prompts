  Okay, I need to design a final exam question about uncertain evidence for an upper-level undergraduate seminar in formal epistemology. The students know Bayes' theorem, strict conditionalization, and Jeffrey conditionalization with rigidity, but no advanced decision theory. The professor wants a 45-minute question that goes beyond just applying Jeffrey's formula and instead tests the Coarsest-Cell Principle introduced in lectures.

  The principle states that when evidence leaves you uncertain, you should update using Jeffrey conditionalization on the coarsest partition discriminated by the experience—meaning the partition generated by the proposition whose probability shifted—while keeping prior probabilities conditional on those cells fixed via rigidity.

  The question should have students test this principle against two cases:
  1. A case where the evidential partition cells are directly about what the experience is about (e.g., poor lighting making someone 0.8 confident a cloth is green).
  2. A case involving a report from a channel with uncertain reliability that may correlate with the hypothesis (e.g., lab results, testimony).

  Students need to:
  - Explain what rigidity is doing in each case
  - Identify what makes an evidential partition legitimate
  - Discuss implications for the rule (needs supplement? restriction? replacement?)

  The model answer should be ~700 words and explicitly address why constraining the probability of a single proposition doesn't determine the update, revealing whether there's a genuine "problem of uncertain evidence."

  The marking scheme out of 25 should include five must-hit points:
  1. Rigidity's role in Case 1
  2. Rigidity's role in Case 2
  3. Conditions for legitimate partition use
  4. Handling of underdetermination
  5. Implications for the Coarsest-Cell Principle

  Common mistakes and A vs B differentiation: A answers must explain the underdetermination issue thoroughly, while B answers might miss this even if otherwise correct.
answer: |-
  ### Final Exam Question (45 minutes)

  **Instruction:** Test the Coarsest-Cell Principle (CCP) against the two cases below. For each case:  
  (a) Explain whether CCP yields a correct update.  
  (b) Analyze what work the *rigidity condition* (i.e., preserving prior probabilities conditional on the partition cells) is doing.  
  (c) State what must be true of an evidential partition for rigidity to be legitimate.  

  Then, address the following:  
  (d) Why does constraining only the new probability of a *single proposition* (e.g., "the cloth is green") fail to determine a unique update? What does this underdetermination imply about whether there is a genuine "problem of uncertain evidence"?  
  (e) Based on your analysis, does CCP need a supplement, a restriction, or replacement by strict conditioning in a richer algebra? Justify your answer.  

  **Case 1 (Direct Experience):**  
  Alex examines a cloth under poor lighting. The experience makes Alex 0.8 confident the cloth is green (G) rather than blue (¬G). Alex’s prior credence in G is 0.5. According to CCP, Alex should Jeffrey-conditionalize on the partition {G, ¬G}, with *P*<sub>new</sub>(G) = 0.8, while rigidly preserving *P*<sub>old</sub>(· | G) and *P*<sub>old</sub>(· | ¬G).  

  **Case 2 (Uncertain Channel):**  
  Taylor receives a lab report stating that a chemical is present (H). The lab’s reliability is unknown and possibly correlated with H: if H is true, the lab is reliable 90% of the time; if ¬H, it is reliable only 60%. Taylor’s prior credence in H is 0.3. The experience shifts Taylor’s credence in the report’s accuracy (R) to 0.7. CCP recommends Jeffrey-conditionalizing on the partition {R, ¬R} (where R = "report is accurate"), with *P*<sub>new</sub>(R) = 0.7, under rigidity.  

  ---

  ### Model Answer (700 words)  

  **Case 1 Analysis:**  
  CCP correctly handles this case. The experience directly shifts confidence in G, and {G, ¬G} is the coarsest partition discriminated because the lighting affects Alex’s belief about the cloth’s color *itself*. Rigidity ensures that prior beliefs about propositions *given* the color (e.g., "the cloth is cotton") remain unchanged. For example, if *P*<sub>old</sub>(cotton | G) = 0.6, rigidity enforces *P*<sub>new</sub>(cotton | G) = 0.6. This is legitimate because the poor lighting provides no information about properties *conditional on the color*—it only bears on G directly. Thus, CCP’s update is appropriate: rigidity reflects that the evidence solely concerns G.  

  **Case 2 Analysis:**  
  CCP fails here. The experience shifts confidence in R ("report is accurate"), but {R, ¬R} is an illegitimate partition for rigidity. Rigidity requires that prior conditional probabilities (e.g., *P*<sub>old</sub>(H | R)) remain fixed. However, R’s correlation with H violates this: if H and R are probabilistically dependent (e.g., *P*<sub>old</sub>(R | H) = 0.9 ≠ *P*<sub>old</sub>(R | ¬H) = 0.6), then conditioning on R *changes* the probability of H, making rigidity unsustainable. For instance, after setting *P*<sub>new</sub>(R) = 0.7, rigidity forces *P*<sub>new</sub>(H) = *P*<sub>old</sub>(H | R) · *P*<sub>new</sub>(R) + *P*<sub>old</sub>(H | ¬R) · *P*<sub>new</sub>(¬R). But this ignores that the evidence—receiving the report—also provides information about H *through* the channel’s reliability. Rigidity falsely assumes R screens off H from the evidence, but here R and H are confounded. For rigidity to be legitimate, the partition must be such that the evidence *only* affects probabilities by shifting the cell probabilities, not by altering within-cell beliefs. This fails when the partition cells (R/¬R) are causally or probabilistically linked to the hypothesis (H).  

  **Underdetermination and the "Problem of Uncertain Evidence":**  
  Constraining only *P*<sub>new</sub>(G) in Case 1 fails to determine a unique update because it fixes just one value in the probability space. Jeffrey conditionalization requires specifying a *partition* and its new probabilities to leverage rigidity. Without this, infinitely many updates satisfy *P*<sub>new</sub>(G) = 0.8: e.g., *P*<sub>new</sub>(cotton) could increase or decrease arbitrarily if conditional probabilities change. This underdetermination shows there is no genuine "problem of uncertain evidence" in isolation—updating *always* demands more structure. Evidence must be interpreted as affecting a partition, not a single proposition. The "problem" arises only when we misidentify the partition, as in Case 2.  

  **Implications for CCP:**  
  CCP needs a *restriction*: it only applies when the evidence directly discriminates the partition cells *and* those cells are epistemically independent of other beliefs under the experience. In Case 1, this holds; in Case 2, it fails due to R–H correlation. Here, CCP should be replaced by strict conditioning in a richer algebra. For example, expand the algebra to include the "report event" E (e.g., "the instrument displayed 'H'"), treat E as certain evidence, and conditionalize on E. This yields *P*<sub>new</sub>(H) = *P*<sub>old</sub>(H | E), which accounts for channel reliability (*P*<sub>old</sub>(E | H)) without illicit rigidity. CCP is thus a heuristic for direct experiences but inadequate for mediated evidence.  

  ---

  ### Marking Scheme (Total: 25 points)  

  | **Must-Hit Point**                                                                 | **Marks** | **Common Mistakes**                                                                                               |  
  |------------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------------------------------------|  
  | **1. Case 1 Analysis:** Correctly states CCP works; explains rigidity preserves conditional probabilities *given G/¬G* because evidence only bears on color. | 5 | Students claim rigidity is "unnecessary" or misapply it to marginal probabilities (e.g., *P*(cotton) stays fixed). |  
  | **2. Case 2 Analysis:** Correctly states CCP fails; explains rigidity is illegitimate because R and H are correlated, so evidence affects *P*(H\|R). | 5 | Students ignore correlation, assume rigidity holds, or misidentify the partition (e.g., using {H, ¬H} instead). |  
  | **3. Legitimacy of Partition:** States rigidity requires evidence to *only* shift cell probabilities (no within-cell information), and cells must screen off other variables. | 4 | Vague descriptions (e.g., "cells must be relevant"); omits screening-off or probabilistic independence. |  
  | **4. Underdetermination:** Explains why fixing *P*<sub>new</sub>(G) alone is insufficient (infinitely many updates satisfy it) and argues this shows "uncertain evidence" requires partition structure. | 6 | Only notes underdetermination superficially (e.g., "more inputs needed"); misses implication for the "problem’s" coherence. |  
  | **5. CCP’s Status:** Recommends restricting CCP to "direct" cases (like Case 1) and replacing it with strict conditioning for "mediated" evidence (like Case 2). | 5 | Suggests supplements (e.g., "add decision theory") without structural fixes, or ignores strict conditioning. |  

  **Grade Differentiation:**  
  - **A (21–25):** Hits all points, with **explicit, clear explanation of underdetermination (Point 4)**. Must articulate why a single constraint (e.g., *P*<sub>new</sub>(G) = 0.8) allows arbitrary changes to other beliefs unless rigidity fixes conditionals, and must conclude this undermines the idea of a unique "uncertain evidence problem."  
  - **B (16–20):** Correct on Case 1, Case 2, legitimacy, and CCP’s status (Points 1–3, 5) but **fails to deeply analyze underdetermination** (e.g., calls it a "technical issue" without linking to evidence’s partition-dependence). May restate underdetermination without philosophical implications.  
  - **C (11–15):** Partially correct on cases/legitimacy but vague on rigidity or underdetermination.  
  - **D/F (0–10):** Major errors (e.g., misapplies CCP to Case 2, omits rigidity).  

  ---  
  **Rationale for A vs. B:** The A answer recognizes that underdetermination reveals evidence *must* affect a partition—making CCP’s core insight necessary but not sufficient—whereas a B answer treats underdetermination as a practical limitation without epistemological consequences. This distinction mirrors philosophical debates (e.g., Jeffrey vs. Field on evidence propositions).
