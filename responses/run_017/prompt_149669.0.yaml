  ### Combined Scenario: The Office Dilemma
  At a consulting firm, a manager (Agent) previously rejected a $100 budget request from an employee (Demander) for a client project. The project would have succeeded, earning the Agent a $2000 bonus. The Demander, resentful, filed an official complaint that will cost the Agent $1000 if unresolved (e.g., reputational damage). The complaint is already filed. The Demander now approaches: "I only filed because you rejected my project. I predicted you’d reject it (with 90% accuracy, based on your risk-averse history). If you’d approved it, I wouldn’t have filed—you’d have your bonus. But since you didn’t, pay me $1000 now to withdraw it. If you pay, I’ll withdraw; if not, it stays." The Agent must decide whether to pay $1000 from their personal funds. The Demander, who wants the money to offset lost project opportunities, issued the demand only because the complaint exists (which required the rejection) and because they predicted the Agent wouldn’t pay such demands—but they were wrong this time (10% error rate). Payment and refusal share one channel: handing cash to the Demander.  
  - **Mugger**: Demander (asks for payment due to past rejection).  
  - **Blackmailer**: Demander (threatens unresolved complaint).  
  - **Closed branch**: Budget approval, which would have granted the $2000 bonus.  
  - **Prediction**: Demander predicted past rejection with 90% accuracy and uses it to justify the demand.  
  - **Bad state**: Complaint already filed.  
  - **Act**: Paying or refusing the $1000.  

