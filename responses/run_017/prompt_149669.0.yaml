  ### Removal Tests
  **1. Remove XOR Condition (Pure Counterfactual Mugging)**  
  *Scenario*: Complaint is removed. Demander says: "Since you rejected the budget (losing your $2000 bonus), pay me $1000 because you’d have gained if you’d approved."  
  - **Causal Decision Theory (CDT)**:  
