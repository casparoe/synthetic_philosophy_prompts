    - Verdict: Indifferent.  
  - **FDT**:  
    - Evaluates the Agent’s algorithm. Algorithms:  
      - **Pay-type**: Always pays demands. Demander predicts payment (90%), files complaint, and gets paid. EU for rejection: (0.9 × -$1000) + (0.1 × $0) = -$900.  
      - **Don’t-pay-type**: Refuses. Demander predicts refusal (90%), doesn’t file complaint. EU: (0.9 × $0) + (0.1 × -$1000) = -$100.  
    - Don’t-pay-type has higher EU. Verdict: Don’t pay.  

  ---

  ### Verdicts on Combined Case
  **Causal Decision Theory (CDT)**  
  - **Step 1:** Isolate causal effects.  
    - Paying causes $1000 loss and complaint withdrawal (avoiding $1000 harm). Net causal effect: −$1000 + $1000 = $0.  
    - Not paying causes no loss but leaves complaint unresolved. Net causal effect: −$1000 (harm).  
  - **Step 2:** Ignore closed branch (bonus) as sunk cost and XOR structure (demand issuance) as non-causal.  
  - **Verdict:** Pay (since $0 > −$1000).  

  **Evidential Decision Theory (EDT)**  
  - **Step 1:** Condition on action.  
    - Paying: Confirms complaint exists and rejection occurred. But these are known. Avoids harm. Net: −$1000.  
    - Not paying: Also confirms complaint/rejection. Causes harm. Net: −$1000.  
  - **Step 2:** No evidence from the act changes utilities.  
  - **Verdict:** Tie.  

  **Functional Decision Theory (FDT)**  
  - **Step 1:** Evaluate algorithms for *both* decisions (past budget and current payment).  
    - **Algorithm C (approve budgets, pay demands)**: Approves budget → gets $2000 bonus, no complaint. EU: $2000.  
    - **Algorithm D (reject budgets, don’t pay demands)**:  
      - Rejects budget → no bonus.  
      - Demander predicts refusal (90%) → no complaint.  
      - If complaint filed (10% prediction error), refuses demand → suffers harm.  
      - EU: (0.9 × $0) + (0.1 × −$1000) = −$100.  
  - **Step 2:** Since Algorithm D was followed for the budget, the Agent is "stuck" with its payment decision. Algorithm D’s EU (−$100) > Algorithm C’s payoff if defectively paid (e.g., paying now as Algorithm D would yield −$900, as in pure blackmail).  
  - **Step 3:** Mugging’s counterfactual (Algorithm C’s $2000) is inaccessible—switching to payment doesn’t retroactively make Algorithm C true.  
  - **Verdict:** Don’t pay (adhering to Algorithm D).  

  ---

  ### Subjunctive Interference and Functional Decision Theory
  - **Conflict**: The act carries two opposing logical counterfactuals:  
    - *Mugging dependence*: Paying "honors" the algorithm that would have earned $2000 in the approval branch.  
    - *Blackmail dependence*: Paying reinforces an algorithm vulnerable to blackmail (EU −$900).  
  - **FDT Resolution**: Not a simple sum. FDT evaluates the *global algorithm* (past + present decisions). Here, the past decision constrains the algorithm, making the mugging’s counterfactual irrelevant for the current algorithm (Algorithm D). Paying now would create an inconsistent algorithm (reject-then-pay), which FDT penalizes.  
  - **Rule Needed**: FDT requires a "temporal consistency" rule: *When an algorithm’s past output is fixed, the current output must align with the best global algorithm that includes that past output.* This is principled (avoids ad hoc per-decision switching) but commits FDT to time-symmetry elsewhere (e.g., in Parfit’s Hitchhiker, refusing aid if past promises were broken).  
  - **Arithmetic vs. Structure**: Naively, mugging (+$500 for paying) plus blackmail (−$800 for paying) sums to −$300, but FDT ignores this. The structural conflict (inaccessible counterfactual vs. algorithm integrity) dominates.  

  ---

  ### Critical Feature and Critiques
  - **Key Feature**: The prediction’s fallibility (90%) and the act’s dependence on a fixed past decision. If prediction were perfect (100%), XOR blackmail collapses (no error cases); if the past decision weren’t fixed, the mugging’s counterfactual becomes relevant.  
  - **Collapse if Removed**:  
    - With 100% prediction: Only Algorithm D exists → FDT pays locally (no blackmail risk).  
    - If past decision is mutable: FDT pays to "become" Algorithm C.  
  - **Attacks on FDT**:  
    - **Defender of CDT/EDT**: "FDT ignores local gains ($0 for paying vs. −$1000 for refusing). The algorithm is abstract; the Agent can just pay now to save $1000."  
    - **Rebuttal**: This attack lands partially—FDT’s commitment to counterfactual consistency may seem impractical here. But it exposes FDT’s core tension: it’s one rule (optimize global algorithm outputs) that bundles Newcomb-like intuitions (acausal control) but faces interference when past and present dependences clash.  
  - **Novelty**: Reduces to a temporal XOR blackmail (Yudkowsky, 2010) with a mugging twist, but the simultaneous demand issuance and fallible prediction in a mundane setting is new.  

  ### Conclusion  
  Functional Decision Theory is a single rule (choose the action of the best global algorithm), but it bundles intuitions from Newcomb-like problems. Here, its verdict (don’t pay) stems from the algorithm constraint, not arithmetic—exposing "subjunctive interference" when past and present logical dependences conflict. The mugging’s benefit is ignored because the closed branch locks the Agent into a suboptimal algorithm, making FDT structurally inflexible in temporal dilemmas. For your group, this highlights FDT’s coherence as one rule but also its vulnerability in dynamic settings.  

