    - Verdict: Don’t pay. Utility: Pay = -$1000, Don’t pay = $0.  
  - **Evidential Decision Theory (EDT)**:  
    - Conditions on action. Paying signals the Agent’s rejection, making the bonus loss more likely—but rejection is already known. Paying provides no evidence of future gains.  
    - Verdict: Don’t pay. Utility: Pay = -$1000, Don’t pay = $0.  
  - **Functional Decision Theory (FDT)**:  
    - Treats the Agent’s algorithm as a decision-outputting function. Paying makes the algorithm one that "pays in muggings." In the counterfactual where the budget was approved, this algorithm would have earned $2000. With a 50% prior on approval/rejection, expected utility (EU) is:  
      - Pay: (0.5 × $2000) + (0.5 × -$1000) = $500  
      - Don’t pay: $0  
    - Verdict: Pay (higher EU).  

