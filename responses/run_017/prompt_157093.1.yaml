  First, I need to understand their core issue. They want a refined principle that can handle their verdicts more cleanly. The double-difference condition requires that a pattern P is improbable without the belief/institution B and also without any plausible alternatives. The friction condition adds enforcement evidence for institutions. But cases like 4 challenge the friction part since there's no enforcement evidence for the feasting site institution.

  Looking at their verdicts, cases 5 and 6 are key. Both involve identical deposits (vessels in house foundations vs. graves), but they infer a belief only for the house deposits. Why? In case 5, the deposits are sealed and inaccessible, which might indicate a normative rule about house-building. In case 6, the grave goods could be explained by commercial kits or social display, so alternatives exist. Their principle might not clearly distinguish these.

  Then cases 3 and 10: burned seeds show uniformity but no inference to belief, while cattle limbs in pits are seen as ritual. The difference might be that the seed burning could be imitation, whereas the cattle pits lack any functional explanation, making ritual more probable. But they dislike this residual inference.

  The user's deeper needs: They want a robust, falsifiable method to avoid over-interpreting symbols. They might be concerned about the subjectivity in inferring beliefs versus functional practices. Also, they need clarity on separating beliefs from institutions, which their friction condition attempts but might not fully resolve.

  To refine the principle, I should consider explanatory coherence. For beliefs, the pattern should necessitate a shared mental model. For institutions, evidence of coordination or enforcement. Maybe replace friction with a cost/benefit analysis showing institutional stability.

  For the new cases: 
  - Deliberate breakage: Likely ritual due to patterned deposition over time with no functional reason. 
  - Discontinuity: Suggests that the pattern was tied to the original group's beliefs/institutions, which disappeared with new people. 
  - Reflexive case: Modern lawn signs might not indicate a two-party system; could be commercial or social mimicry without deeper institutional structure.

  Their principle might struggle with case 4 (feasting site without enforcement evidence) and case 7 (no fortifications implying no raiding constraint but not pacifism). I'd overturn case 4's verdict since without enforcement, it might just be a shared practice, not an institution.

  Also, case 9's textual evidence providing a small boost could be handled by coherence with external data, even if temporally distant, as long as it fits the explanatory framework.

  Overall, the refined principles should focus on necessity (no alternatives), coherence (multiple lines of evidence), and for institutions, evidence of collective action beyond individual preference.
answer: |-
  Below is a refined inferential principle for archaeology, designed to handle your cases systematically while addressing the belief/institution distinction. It replaces your tentative framework with a unified **Necessity-Coherence Principle (NCP)** and a supplementary **Institutional Stability Condition (ISC)**. These prioritize *explanatory necessity* and *cross-contextual coherence* over probabilistic "difference" tests, avoiding residual inferences.

  ### The Refined Principle
  **1. Core Principle (Necessity-Coherence Principle, NCP):**  
  *A patterned material remain (P) licenses an inference to a belief (B) or institution (I) only if:*  
  - **(a) Necessity:** P is best explained by B/I, and no *weaker* or *equally coherent* alternative explanation (functional, economic, taphonomic, or social-imitative) accounts for P’s specificity, scale, and context.  
  - **(b) Coherence:** P coheres with *multiple independent lines of evidence* (spatial, temporal, technological, symbolic) that collectively constrain interpretation.  

  **2. Institution-Specific Addendum (Institutional Stability Condition, ISC):**  
  *For institutions (I), P must additionally demonstrate:*  
  - **Costly coordination or conflict:** Evidence of *investment*, *enforcement*, *standardization beyond individual benefit*, or *resistance* (e.g., sanctions, redundant controls, unequal distribution of costs).  
    - *Replaces your "friction" clause by focusing on material signatures of collective action problems, not just "costliness."*  

  **Why beliefs and institutions differ:**  
  - **Beliefs** require only that P *necessitates* shared normative cognition (e.g., case 5’s sealed deposits).  
  - **Institutions** require evidence that P *resolved coordination/conflict* (ISC), as they exist to enforce rules against individual interests (e.g., case 2’s sealed storage rooms).  

  ### Motivation from Your Cases
  - **Double-difference abandoned:** Probabilistic "improbability under alternatives" is replaced by **explanatory necessity** (case 3 vs. 10) and **coherence** (case 8).  
  - **Friction replaced:** ISC uses *material proxies for collective action* (case 4’s feasting site shows investment in authority; case 2’s seals show control).  
  - **Case-driven clauses:**  
    - Necessity from **cases 3, 6, 7** (alternatives explain uniformity without beliefs).  
    - Coherence from **cases 8, 9** (convergence strengthens inference).  
    - ISC from **case 4** (contrast: feasting debris vs. rodent gnawing shows institutional purpose).  

  ### Verdicts on Your New Cases
  1. **Deliberate breakage** (centuries of patterned metal deposition in rivers):  
     - **Inference:** **Ritual belief** (not institution).  
     - *Why:* Necessity—no functional/economic explanation for breakage *and* deposition (cf. case 10). Coherence—temporal persistence implies norm. *But no ISC:* No evidence of enforcement or coordination costs.  

  2. **Discontinuity** (pattern vanishes with non-local influx):  
     - **Inference:** **Belief or institution tied to original group**.  
     - *Why:* Necessity—pattern’s dissolution aligns precisely with demographic shift; alternatives (e.g., ecological change) less coherent. ISC may apply if the pattern showed enforcement (e.g., sanctions).  

  3. **Reflexive case** (modern lawn signs/paraphernalia):  
     - **Inference:** **Not an institution** (possibly not even a belief).  
     - *Why:* Fails ISC—lawn signs require minimal coordination, no enforcement, and serve individual expression. Fails necessity—uniformity better explained by commercial mass production/imitation (cf. case 6).  

  ### Assessment of Your Ten Verdicts
  **NCP/ISC accommodates:**  
  - Cases 1, 2, 4, 5, 7 (weaker claim), 8, 9 (small boost via coherence), 10 (ritual as last-resort necessity).  
  - *Case 4 resolved:* Feasting debris + architecture coheres with authority (ISC: investment in non-functional space); rodent-gnawed site lacks this.  

  **Would overturn first:**  
  - **Case 6 (grave goods):** Your refusal is correct under NCP. Uniformity is *necessarily* explained by commercial kits/social display (coherence with trade networks or status competition). No need for afterlife beliefs.  

  **Struggles with:**  
  - **Case 3 (burned seeds):** NCP agrees with your verdict (imitation suffices), but your unease with case 10 highlights a tension. *Resolution:* Case 10’s cattle limbs have **no plausible imitative/functional alternative**, while case 3’s seeds do (e.g., shared practical knowledge). NCP prioritizes eliminative necessity.  
  - **Case 7 (no fortifications):** NCP supports your caution. "No raiding constraint" is a *functional* inference (coheres with settlement layout); "pacifism" is a *belief* requiring positive evidence (e.g., anti-violence iconography).  

  ### Key Improvements
  1. **Eliminates residual inference:** Case 10 ("ritual") is only valid if *all* weaker alternatives (e.g., waste disposal, vermin traps) are eliminated by coherence (e.g., pit location, bone treatment).  
  2. **Clarifies belief vs. institution:** Beliefs explain *normative behaviors* (case 5); institutions explain *stable solutions to conflict* (case 2).  
  3. **Handles convergence:** Case 8’s "ten weak lines" work by constraining alternatives via coherence (e.g., use-wear + spatial + faunal data rule out coincidental ambiguity).  

  This framework avoids probabilistic thresholds (which often lack archaeological baselines) and instead uses *explanatory parsimony* and *evidence convergence*. It treats institutions as uniquely tied to *materialized conflict resolution*, resolving your friction clause’s awkwardness in case 4.
