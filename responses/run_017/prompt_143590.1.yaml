answer: |-
  ### Workshop Design: "Patterns in the Puzzling"  
  *Based on Hofstadter & Sander’s core ideas, tailored for a pub-based reading group. Focus: Experiencing spontaneous categorisation, "hardening", and prototype distortion through novel materials.*

  **Core Mechanisms Considered & Rejected:**  
  1. **Ambiguous Sound Clusters:** Groups invent categories for nonsense syllables (e.g., "glorp", "twixle"). *Set aside*: Too abstract; risks feeling like a linguistics exercise, not revealing prototype drift viscerally.  
  2. **Abstract Emotion Vignettes:** Short, wordless comics showing stylised faces in odd situations. *Set aside*: Overly subjective; harder to trigger "hardening" as names feel less binding.  
  3. **CHOSEN: Glyph Sorting & Stretching:** Invented symbols ("glyphs") with subtle feature variations. *Why chosen*: Visually intuitive, exposes prototype-centring physically, naming feels formalising, and stretching is measurable.  

  ---

  ### THE ACTIVITY: "Glyph Guilds"  
  **Materials per Group (3 groups of 4):**  
  - **12 Base Glyphs**: Cardboard cards (A6 size) with invented symbols. Each has 3–4 features (e.g., "squiggle tails", "spiked cores", "looped crossbars") combining ambiguously.  
    ![](https://i.imgur.com/xyVjT7m.png) *Example: A glyph might have a spiked core + looped crossbar, another a squiggle tail + spiked core, etc.*  
  - **6 "Stretch" Glyphs**: New glyphs blending features imperfectly (e.g., a "soft spike" or "frayed loop").  
  - **Naming Tokens**: Blank cards + markers for category labels.  
  - **A3 Paper Grid**: For arranging glyphs into named groups.  

  **Rules:**  
  1. No "correct" answers—group glyphs by "vibes" or "family resemblances".  
  2. Names must be invented (e.g., "Spike-Hearts", "Loopers").  
  3. When adding "Stretch" glyphs, force-fit them into *existing* categories without renaming.  

  **Minute-by-Minute Flow (Total: 90 mins):**  
  - **0–5 mins: Framing (No Theory!)**  
    *"We’re exploring how humans spot patterns in confusion. In your groups, sort these glyphs into groups that feel ‘right’. Trust your gut—there’s no key!"* Hand out Base Glyphs.  
  - **5–25 mins: Sorting & Naming**  
    Groups sort glyphs into 2–4 categories. Circulate, asking: *"Why do these belong? What’s the ‘soul’ of this group?"* **Crucial**: After sorting, groups write names on tokens.  
  - **25–35 mins: Hardening Phase**  
    Groups post their named categories (grids on wall). *"Your categories are now ‘official’. Don’t change them!"*  
  - **35–50 mins: Stretching**  
    Hand out "Stretch" glyphs. *"Slot these into your existing categories. No new groups—use what you’ve got."* Observe groups distorting new glyphs to fit (e.g., calling a frayed loop "a Looper going punk").  
  - **50–65 mins: Group Comparison**  
    Groups rotate to view others’ grids. Pose: *"Which placements surprise you? Where did others ‘stretch’ differently?"*  
  - **65–90 mins: Debrief (Theory Revealed)**  
    **Don’t say "analogy" yet!** Start open: *"What was hard? When did a group feel ‘locked in’?"* Then map:  
    - **Categorisation = Analogy**: *"You didn’t check definitions—you matched glyphs to your first ‘family members’. That’s analogy-as-core!"*  
    - **Hardening Effect**: *"The moment you named ‘Loopers’, it stopped being loose resemblances and became a ‘rule’. Did defending stretch glyphs feel like logic, not memory?"*  
    - **Prototype Distortion**: *"Your first ‘Spike-Heart’ became the ideal. Later glyphs got bent toward it—you didn’t redefine ‘Spike-Heart’ to meet halfway, did you?"*  
    Finally: *"This is what Hofstadter/Sander mean: categories are fossilised analogies. We forget the mapping and worship the ‘essence’."*  

  ---

  ### Predictable Problems & Fixes:  
  - **"We need definitions!"**: Groups may panic early. *Fix*: Reassure—*"If you can argue it’s ‘cousins’, that’s enough. Start anywhere!"*  
  - **Over-literal naming**: E.g., "Three-Spiked Glyphs" vs. evocative "Shadowthorns". *Fix*: Encourage whimsy—*"Give it a name like a band or a species!"*  
  - **Debrief tangents**: If they fixate on glyph "intent". *Fix*: Redirect—*"We care about your reasoning, not the designer’s."*  
  - **Uneven participation**: Use timed phases (e.g., *"2 mins silent looking first"*) and assign roles (Sorter, Namer, Stretcher).  

  ### Limitation to State Openly:  
  *"This can’t replicate how real-world categories ‘harden’ over years of social use. You felt a micro-version, but cultural weight is slower. I’ll just say that bit!"*  

  ### Why This Works:  
  - **Novel materials** prevent pre-loaded concepts.  
  - **Naming** ritualises "hardening"; **stretching** makes prototype distortion visible.  
  - **Physical sorting** forces analogy-mapping (e.g., *"This new glyph is like Frank’s glyph"*).  
  - **Pub-friendly**: Tactile, collaborative, minimal writing.  

  **Run this. It’s robust, reveals all three insights in action, and the glyphs spark joy.** Let me know if you need printable glyph templates or debrief scripts!
