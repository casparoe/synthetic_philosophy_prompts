  For the activity mechanisms, I'm considering three approaches:

  First, a "Sorting Artefacts" approach with ambiguous physical objects that can be grouped in multiple ways. Participants would sort them, name categories, then add new objects that stretch their definitions. This is tactile but might be too abstract.

  Second, a "Micro-Story Grouping" approach with very short fictional scenarios. Participants would group them, name categories, then add borderline cases. This highlights narrative analogy but might make the hardening effect less visible.

  Third, a "Glyph Interpretation" approach using invented symbols with subtle variations. Participants would sort them into named categories, then encounter new glyphs that challenge their groupings. This visually demonstrates prototype distortion well and keeps the analogy hidden.

  The Glyph Interpretation approach seems strongest because the visual nature makes prototype distortion very visible, the naming step clearly triggers hardening, and the materials are perfectly novel. I'll develop this as the core activity.

  For workshop structure:
