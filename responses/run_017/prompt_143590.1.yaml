  - Sorting Phase (20 mins): Groups sort 12 glyph cards into categories
  - Naming Phase (10 mins): Groups name their categories
  - Stretching Phase (15 mins): Groups add 6 new glyphs to existing categories
  - Group Comparison (15 mins): Groups see others' categories and placements
  - Debrief (25 mins): Guided discussion mapping to the three concepts

  Materials needed: 12 base glyph cards per group, 6 stretch glyph cards per group, plus some extras. Glyphs should have variations that allow multiple sorting strategies.

  In the debrief, I'll reveal the analogical basis of their groupings, highlight the hardening effect when names were applied, and show how early examples became prototypes that distorted later additions.

