answer: |-
  Your limit reading offers a philosophically richer reconstruction of Aristotle’s objection to interest than the sterility reading. Let me engage it directly on its merits.

  **(i) Why the sterility reading weakens Aristotle’s argument:**  
  Pressing the biological sterility metaphor as the core objection renders Aristotle’s critique vulnerable in ways his broader ethical framework avoids. If money’s infertility were the *foundation* of the objection, it would clash with his own recognition of money as a conventional tool (νόμισμα), not a natural entity with biological properties. This makes the argument appear parochial, reliant on a naive physicalism about coinage rather than a deep ethical principle. It reduces a profound critique of infinite desire to a quasi-scientific claim easily dismissed once money’s conventional nature is understood. The sterility reading thus isolates the interest critique from Aristotle’s foundational distinction between household management (οἰκονομική) and limitless wealth-getting (χρηματιστική).

  **(ii) What the limit reading buys us:**  
  The limit reading elegantly integrates the interest critique into Aristotle’s core ethical concern: activities must have a proper end (τέλος) that defines their limit. Commerce becomes problematic *only* when pursued as χρηματιστική – accumulating money as an end-in-itself, lacking an intrinsic terminus. This explains why Aristotle permits transactions involving money *when they serve a limited external end*. Wages remunerate a completed service (a definite action); fees compensate for the use of a skill or tool toward a specific good (e.g., health from a doctor, shelter from a rented house). These exchanges have built-in stopping points defined by the service rendered or the use granted. Interest, however, charges for the *mere passage of time* in the possession of money *as money*. Its "end" is purely quantitative increase with no natural boundary, embodying the infinite pursuit he condemns. The sterility metaphor ("money born of money") vividly illustrates this *structural infiniteness*, not an ontological claim about metal.

  **(iii) Hardest textual problem & reply:**  
  The strongest objection is Aristotle’s explicit statement that interest is "most reasonably hated" because it makes money from money itself, "which was invented for exchange," implying the *inherent* impropriety of money breeding. Doesn’t this demand a sterility-focused reading?  
  Reply: This passage (NE V.5, 1133a-b) immediately follows his distinction between natural use (κατὰ φύσιν) of objects (including money for exchange) and unnatural use (παρά φύσιν) for endless acquisition. The breeding metaphor directly illustrates the latter’s *perversion*: using money contrary to its proper function (exchange for need) by treating it as self-multiplying capital. "Born of money" signifies the *self-referential*, closed loop of means becoming ends – the essence of limitless wealth-getting. The vivid biological language serves the prior structural argument about terminability, not the reverse.

