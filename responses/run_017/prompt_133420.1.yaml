answer: |-
  Here is a disciplined mapping, analysis, and verdict for your bilateral-commitment model against the Argentine sequence:

  ### **I. Disciplined Mapping of Impunity Moments**  
  *(Promisor, Promisee, Consideration, Third Parties, Breach)*  

  1. **Junta's Self-Amnesty (1983)**  
     - **Promisor**: Military regime (self-granting).  
     - **Promisee**: None (unilateral act).  
     - **Consideration**: None (no bargain; attempted lock-in of impunity pre-handover).  
     - **Third Parties**: Victims (excluded); incoming democratic government.  
     - **Breach**: Annulment by Congress (1983) rendered it void.  
     - **Note**: Lacks bilateral structure; no promisee or mutual consideration.  

  2. **Full Stop (1986) & Due Obedience (1987) Laws**  
     - **Promisor**: Democratic Congress/Alfonsín government.  
     - **Promisee**: Military institution (as corporate entity).  
     - **Consideration**: Military forbearance from further coups (e.g., halting 1987–88 uprisings).  
     - **Third Parties**: Victims (excluded); lower-ranking officers shielded.  
     - **Breach**: Renewed prosecutions would violate terms. Annulment (2003) and SC invalidation (2005) constituted breach.  

  3. **Menem's Pardons (1989–90)**  
     - **Promisor**: Executive (President Menem).  
     - **Promisee**: Convicted officers/guerrillas (individual beneficiaries).  
     - **Consideration**: Social stability; end to military unrest.  
     - **Third Parties**: Victims; broader society.  
     - **Breach**: Reopening prosecutions post-2005.  

  ---

  ### **II. What the Model Explains Well**  
  - **Lateness & Emergence Under Threat**: The 1986–87 laws align with the model’s core logic: amnesty as a *response to renewed coercion* (military uprisings), not a condition for initial transfer.  
  - **Punishment Preceding Amnesty**: Prosecutions (1983–85) occurred *before* amnesty laws, reflecting the model’s allowance for post-transfer renegotiation under duress.  
  - **Symmetric Treatment**: Menem’s pardons covering both sides fit a bilateral logic (quid pro quo stability), even if morally equating unequal actors.  

  ---

  ### **III. Where the Model Misdescribes**  
  1. **1983 Collapse vs. Pact**: Transfer occurred via regime collapse (Falklands defeat), not a negotiated pact. The self-amnesty had no "counterparty."  
  2. **Victims as Non-Parties**: Victims were passive subjects (per model), but their agency via NGOs/CONADEP drove accountability despite amnesties.  
  3. **Self-Amnesty Anomaly**: No bilateralism; it was a unilateral Hail Mary, invalidated immediately.  

  ---

  ### **IV. Testing Revisions Against Argentina & South Africa**  

  | **Revision**          | **Fit with Argentina**                                                                 | **Predictions Unique to Revision**                                                                 | **Check Against 2003+**                                                                 | **Contrast: South Africa (TRC)**                                                                 |
  |------------------------|----------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|
  | **1. Duress Doctrine** | Strong: 1986–87 laws extorted by military rebellions.                                  | Amnesty under threat is inherently unstable; beneficiaries remain vulnerable to later reversal.     | Validated: Laws voided when duress ended (military weakened post-2000).                 | Weak: SA immunity was negotiated at transfer, not under active threat. Not voidable.             |
  | **2. Intertemporal Constraint** | Strong: Post-1983 Congress could not bind successors; annulment inevitable.            | Amnesty’s value is short-term; beneficiaries know it may not last. Explains military’s demand for additional guarantees (1986–87). | Validated: Shift in politics (Kirchner) enabled reversal.                               | Strong: SA’s constitutionally embedded amnesty faces legal challenges (e.g., *AZAPO* case).      |
  | **3. Moratorium (Time-Buying)** | Strongest: Amnesty deferred accountability until military weakened (e.g., post-2003). | Reopening is not bad faith but natural expiration. Explains why generals accepted temporary shields. | Validated: Prosecutions resumed only after military’s political power collapsed.        | Partial: SA’s amnesty was conditional/permanent but designed to enable immediate transition.     |

  **Verdict on Revisions**:  
  - **Least Ad Hoc**: **Moratorium revision**. It accounts for Argentina’s sequence (delayed justice), the military’s rational acceptance of time-limited protection, and avoids overreach.  
  - **Duress as Reductio?**: Not necessarily. If most amnesties arise under implicit threat (e.g., Chile, Brazil), voidability reflects reality: *amnesties secured by coercion are illegitimate and reversible*. This is a defensible conclusion.  

  ---

  ### **V. Where the Model Is Silent**  
  1. **Expressive/Evidentiary Work (1990s Argentina)**:  
     - The model lacks tools to explain **censure without punishment** (*escraches*) or **fact-finding trials**. These are non-contractual, victim-driven mechanisms to sustain accountability when legal punishment is blocked.  
  2. **Gap’s Implications**:  
     - A model ignoring these elements **cannot fully account for transitional justice’s purpose**. Argentina shows that societal demand for truth/censure persists even when punishment is deferred. The bilateral bargain secures transfer but fails to address *legitimacy* or *social repair*.  

  ---

  ### **Final Verdict**  
  Argentina **breaks the bilateral model** in its pure form due to:  
  - The non-negotiated 1983 transfer,  
  - The unilateral self-amnesty,  
  - Victims’ agency bypassing the "contract."  
  **However**, the model **adapts** when:  
  - Treated as a **moratorium** (amnesty as temporary shield),  
  - Incorporating **duress** (coerced amnesties are voidable),  
  - Acknowledging **intertemporal limits** (no polity can bind successors).  

  **Recommendation**: Retain the model’s core (amnesty as commitment device) but:  
  1. Limit it to **negotiated transitions** (exclude collapses like Argentina 1983).  
  2. Add **time-binding** (amnesty as moratorium) and **duress clauses** to explain instability.  
  3. **Supplement with non-contractual elements**: Truth-seeking/censure operate outside the bargain but are essential to transitional justice’s goals.  

  Argentina proves that amnesty cannot guarantee finality—but as a *tactic* to shift power balances, it aligns with the moratorium view. South Africa’s conditional amnesty succeeded because it was embedded in a constitutional pact *at the transfer moment*, avoiding Argentine-style duress and reversibility. The model survives, but only as a component of a larger theory.
