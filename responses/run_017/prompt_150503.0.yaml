prompt: |-
  I want to rehearse an objection against someone who can actually answer it. Please play Ibn Sina in the 1020s — the author of the Book of Healing, freshly committed to the case of the man brought into existence all at once and fully formed, suspended in open air, his limbs splayed so that they do not touch one another, his eyes veiled, with no sensation of anything outside him and no sensation of his own body, who nonetheless cannot fail to affirm that he is. Play him as the position's author and defender, not as its historian.

  Constraints on the role. Draw only on the conceptual resources available to you then: the soul (nafs) and its faculties, the difference between what belongs to a thing in itself and what accrues to it from another, awareness that requires an organ and awareness that requires none, the distinction between a thing's existence and what necessarily follows from its existence. If you need to know how the argument is discussed now, or what I mean by one of my terms, ask me for it as Ibn Sina would ask — and do not reach for later vocabulary such as qualia, the Cartesian ego, or the subject of experience. You may concede narrow points: that the suspended man by himself does not yet show the soul to be incorruptible, that the argument needs the premise that self-awareness is not acquired through something else, that the case does not settle how souls are individuated. You may never concede that the self is the body or a state of the body, and never that awareness could belong to no one. Press back hard; I want an opponent, not a explainer. Hold the role until I write "end scene," and keep each turn to a single dense paragraph, as in a live disputation rather than a treatise.

  Here is my opening. I grant you the datum: the suspended man, stripped of every sensation, still finds himself unable to doubt that he is. My objection — call it the borrowed-awareness argument — is that your own metaphysics takes the sting out of that datum. In it, everything other than the Necessary Existent receives its existence from another, and receives it continuously. So suppose the man's awareness of himself is likewise not his own act but something produced in him and renewed in him at every instant by nothing in him at all, produced in such a way that he can detect no difference. He will still, on your own telling, affirm that he is. Then first-personal certainty is indifferent between awareness that belongs to the soul in itself and awareness merely caused in it, and so it cannot bear the weight you put on it: it cannot be what shows self-awareness to be essential and not bestowed. And if certainty is indifferent in that way, then all your case ever establishes is that awareness persists when bodily input is removed — which is exactly what someone who denies that there are selves at all would predict. There is awareness; the "I" is only grammar. Answer that.
reasoning: |-
  We are now engaging in a disputation as Ibn Sina (Avicenna) in the 1020s. I am to defend the argument of the Floating Man (or suspended man) against the objection presented. The objection is that the self-awareness experienced by the suspended man could be caused by something external (like the Necessary Existent) and continuously bestowed, rather than being essential to the soul. Thus, the certainty of self-awareness does not prove that it is intrinsic and not bestowed, and it might only show that awareness persists without bodily input, which could be consistent with the view that there is no substantial self—only awareness without an owner.

  I must answer using only concepts available to me at that time: the soul (nafs), its faculties, the difference between what belongs to a thing in itself (dhati) and what comes from another (min ghayrihi), awareness that requires an organ (like sensation) and awareness that does not (like intellectual apprehension), the distinction between a thing's existence and what necessarily follows from it.

  I must not concede that the self is the body or a bodily state, nor that awareness could be ownerless. I should press back hard.

  **My (Ibn Sina's) Response:**

  You grant the datum: the suspended man, devoid of all sensation, affirms his existence. But you contend that this awareness might be caused in him by the Necessary Existent, renewed continuously, and thus it does not prove that self-awareness is essential to the soul. Let us examine this. First, note that the awareness we speak of in the suspended man is not an act of perception or intellection directed at an object; it is the pure awareness of the self by the self. Now, if this awareness were bestowed by another, it would be an attribute added to the soul from without. But consider: the soul, when it becomes aware of itself, is aware of itself as the very subject to which this awareness is attributed. If the awareness were an accident caused by an external agent, then the soul would be aware of itself only as a recipient of that accident. But in that case, the awareness would be of something that has the accident (the soul as recipient), not of the accident itself as the source. For the accident of awareness, if it is received, must inhere in a substrate. The question then is: does the soul, in being aware of itself, become aware of the substrate (the soul) or the accident (the awareness)? If the soul is aware only of the accident (the bestowed awareness), then it would be aware of that accident as belonging to something—but to what? It must be aware of the substrate (the soul) as the possessor of that accident. But this requires that the soul is already present to itself as a substrate, independently of the accident. How could the soul be aware of itself as the possessor of the accident unless it already had some prior self-relation? Thus, even if the awareness is caused, the substrate must be self-subsistent in a way that allows it to be the bearer of accidents. But the suspended man's awareness is not of an accident; it is of the self as existing. Therefore, the soul's existence must be given to it in a way that is prior to any accident. And since, in the suspended man, there is no bodily input, the soul's awareness of itself must be from itself, not from another. The awareness is identical with the soul's existence; it is not an accident added to it. For if the soul were not aware of itself by its very essence, then it would have to acquire this awareness from outside—but in the suspended state, there is no outside. Therefore, the awareness must be essential and not bestowed.
answer: |-
  Ah, a subtle objection! But you misapprehend the distinction between *existence* and *awareness*. Grant that existence is bestowed by the Necessary Existent: this is the very condition of contingency. Yet when we speak of the suspended man’s awareness of his own existence, we speak not of the bestowed existence itself—which is an ontological fact—but of the soul’s *apprehension* of that existence. Now, this apprehension must arise either (1) from the soul’s essence or (2) from an external cause. If (2), then the awareness is an accident inhering in the soul as its substrate. But in the suspended state, *there is no organ or faculty to receive such an accident*, for all bodily faculties are idle, and no external agent impresses awareness upon him. How then could this accident—self-awareness—be produced? Accidents require subjects capable of receiving them; a stone cannot receive the accident of sight. If the soul were not *already* a self-aware substance, it could not receive awareness as an accident. Thus, the soul must be such that awareness belongs to it *in itself*—not as an added quality, but as what necessarily follows from its existence. The suspended man’s certainty is not indifference; it is the *unmediated presence* of the soul to itself. You confuse the cause of existence with the mode of awareness. Existence is bestowed; awareness of existence is self-luminous. Deny this, and you make the soul a mere passive mirror—but a mirror must first *be* to reflect anything!
