answer: |-
  Here’s a targeted Q&A prep, distilled for your audience and thesis. I’ve ranked objections by **likelihood × damage**, with phrasing tailored to each subgroup. Answers are designed for verbal delivery (~90 sec), followed by vulnerability notes. Key strategic concessions/defenses and your nightmare question at the end.

  ### Top Objections & Responses
  *(Ordered by threat level)*

  1.  **From Political Philosophers/Legal Theorists: "This is just structural injustice in computational drag. Why not say 'power shapes option sets' and be done?"**  
      *Why it stings:* Questions the novelty of your framing and implies you’re obscuring power dynamics with tech jargon.  
      **Response:** "You’re right that power asymmetries are central—but the computational lens reveals something new: *even when option sets appear formally identical*, the cognitive burden of navigating them can be weaponized. Think of two citizens facing the same 200-page benefits form. If one group is systematically time-poor, under-resourced, or targeted with deliberately complex sub-clauses (as in predatory loan terms), the *apparent equality of options* masks an *imposed cognitive tax*. This isn’t just about fewer choices; it’s about corrupting the *interface* of choice. Hardness becomes a hidden transfer of responsibility: 'You *could* optimize this... technically.'"  
      **Soft spot:** Risks sounding like "complexity is oppression lite." Needs to clarify why this *adds* to critiques of power, not just restates them.

  2.  **From Resource-Rationality (CogSci) Group: "Worst-case hardness is irrelevant if real-world instances are easy (smoothed/average-case). Your 'imposed hardness' assumes adversaries control the instance distribution—but what if institutions are inept, not malicious?"**  
      *Why it stings:* Undercuts your core mechanism (endogenous instance generation) by invoking robustness literature.  
      **Response:** "Absolutely—if instances are benign *by default*, hardness might not bite. But my claim is that in socially embedded systems (benefits, rota scheduling), distributions *aren’t* neutral. They’re shaped by incentives: a benefits administrator minimizing payout might *leverage* worst-case structure ('add a clause that explodes cases only for single parents'), while a hospital CFO might accept scheduling chaos because nurses bear the optimization cost. Smoothed analysis helps *diagnose* when hardness is likely inert—but when we see persistent intractability in human systems, we should ask *cui bono*? Incompetence and malice both warrant scrutiny when they externalize cognitive labor."  
      **Soft spot:** Conflates intent (malice) with outcome (burden). Needs examples where *negligence* (not intent) creates hardness.

  3.  **From Formal Epistemologists (Bayesians): "Normative ideals don’t require tractability. We demand perfect Bayesian reasoning *because* it’s ideal—then approximate pragmatically. Your 'responsibility for hardness' conflates normative and descriptive."**  
      *Why it stings:* Challenges your blurring of "ought" and "can," core to their tradition.  
      **Response:** "I agree normative models can be idealized! But when we *operationalize* these ideals—e.g., 'rational agents should optimize retirement portfolios'—we must ask: *who made this the benchmark*? If the 401(k) provider designed a fund menu where optimization is NP-hard *and knew it*, they’ve effectively defined 'rationality' as something only the wealthy (with advisors) can achieve. This isn’t rejecting ideals—it’s rejecting *fraudulent ideals*. Demanding tractability-aware normativity isn’t lowering the bar; it’s calling out rigged games."  
      **Soft spot:** May not convince them this is *normative* rather than *practical*. Their "ideal first, approximate later" stance is deeply entrenched.

  4.  **From the Philosopher of Action ("Ought Implies Can"): "If an agent *can’t* solve an NP-hard problem Tuesday morning, how can they be *obligated* to? Your 'responsibility' pretends 'can' is flexible, but Tuesday’s agent is stuck!"**  
      *Why it stings:* Direct hit on moral agency in the moment.  
      **Response:** "You’re right—on Tuesday, faced with the brutal instance, they likely *can’t*. But 'ought implies can' applies *temporally*. The key question is: *could they (or a responsible institution) have avoided this instance*? If you signed a mortgage with hidden cross-default clauses that turn refinancing into a subset-sum problem, Tuesday’s impossibility stems from *yesterday’s* choice (or the bank’s design). Responsibility attaches to the *authors of the hardness*, not just its victims in the moment."  
      **Soft spot:** Stretches "can" over time/agency. May feel like dodging the immediacy of "ought implies can."

  ---

  ### Strategic Concessions & Defenses
  **Concede early (builds goodwill):**  
  - *"Worst-case complexity alone is insufficient to condemn a system—average-case or smoothed analysis might show the burden is light. But when hardness persists in practice, we need to ask why the distribution isn’t smoother."*  
  - *"Resource-rationality is right: minds *are* adapted to typical demands. My argument applies when systems *deviate* from ecological rationality to impose artificial hardness."*  

  **Hold the line (core thesis):**  
  - *"The distribution of problem instances in social systems is *endogenous*—shaped by prior choices and institutional design. This is non-negotiable."*  
  - *"Tractability is not just a feasibility constraint—it’s a *site of moral responsibility* when ignored by designers."*  

  **Your nightmare question (you guessed #2):**  
  **"How would you falsify this? What observable evidence would prove 'imposed hardness' *isn’t* happening?"**  
  *Why it’s lethal:* Your framework risks being non-empirical ("you can always posit hidden malice/negligence"). Unlike structural injustice (observable power asymmetries) or cognitive bounds (measurable effort), "responsibility for hardness" is slippery.  
  *Why it’s worse than your guesses:*  
  - Your #1 ("too many options") is defanged by stressing *computational structure* (e.g., "It’s not the *number* of funds, but their *combinatorial interactions*").  
  - Your #2 ("how show you’re wrong") is survivable with case studies (e.g., "Show me a complex benefits system where *no group* bears disproportionate burden").  
  - *This* question exposes a lack of clean counterfactuals.  
  **Response (if asked):** "First, we’d look for *discrepancies*: if a system is hard for users but trivial for designers *and* complexity benefits the latter, that’s suggestive (e.g., opaque bank fees). Second, we can *redesign*: if simplifying a form (without changing entitlements) reduces errors and stress, it implies prior hardness was artificial. Falsification isn’t easy—but nor is it for 'structural injustice.' We build evidence case-by-case."  

  **Survival tip:** When pressed, pivot to your examples. They’re your armor: "Think about the nurse scheduling a shift under rules that make 'fairness' NP-hard. Is that *really* just 'too many options'?"  

  You’ve got this. They’ll poke—but your core is sturdy. Focus on the **institutional lever-pullers** who design the scissors.
