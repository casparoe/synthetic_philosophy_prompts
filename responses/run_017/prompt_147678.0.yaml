  ### (i) Smallest Set of Rules Fitting All Five Verdicts

  Based on your friend's verdicts, I derive three distinct rule sets that each fit all five cases. Each set emphasizes a different aspect: **Rule Set A** focuses on the *procedural rigor* of decision-making (particularly the exhaustion of alternatives), **Rule Set B** on the *distribution of costs* (who bears the burden and whether it is consented to), and **Rule Set C** on the *post-hoc acknowledgment of wrongness*. All three sets share a core principle: **An act is only justified under dirty hands if it is necessary to prevent significant, imminent harm, and the harm prevented is of a severe, irreparable nature (e.g., loss of life or systemic collapse)**. Rule Set C also incorporates an outcome-dependent element for the aftermath. Each set is stated precisely for third-party application.

  #### **Rule Set A: Procedural Rigor (Exhaustion of Alternatives)**
  1. **Necessity for Imminent Harm**: The act must be necessary to prevent significant, imminent harm (e.g., loss of life, physical safety, or systemic collapse). Harm must be concrete and likely based on evidence available at the time.
  2. **No Viable Legal Alternative**: There must be no reasonable, legal alternative that could prevent the harm. If a legal alternative exists with a "real chance" of success (non-negligible probability, even if uncertain or slower), it must be attempted or exhausted. Failure to attempt it invalidates justification.
  3. **Transparency and Accountability**: 
     - If the act is justified (Rules 1–2 satisfied), the official must disclose it after the emergency, accept legal consequences (e.g., prosecution, resignation), and never deny the act was morally or legally wrong. 
     - If the act is unjustified (Rules 1–2 not satisfied), the official must be punished for the act itself.
  4. **Whistleblowing Exception**: If the act exposes systemic wrongdoing (e.g., unlawful programs) and internal channels are exhausted, it is not dirty hands but morally justified; no accountability is owed.

  #### **Rule Set B: Distribution of Costs (Burdens and Consent)**
  1. **Necessity for Imminent Harm**: Same as Rule Set A.
  2. **Cost-Bearing Principle**: 
     - The costs of the act (e.g., rights violations, risks) must not be imposed on non-consenting, vulnerable populations without proportionality. Costs should fall on those responsible for the harm or spread broadly.
     - If costs are narrowly targeted at uninvolved or marginalized groups, justification requires extreme exigency (e.g., no other option).
  3. **Accountability for Concealment or Denial**: 
     - Justification requires post-hoc disclosure to affected parties and acceptance of consequences. Concealment or denial of wrongness compounds the wrong and warrants harsher punishment.
     - Whistleblowing (exposing systemic wrongs) shifts costs to the institution, requiring no personal accountability.

  #### **Rule Set C: Acknowledgment and Outcome-Dependent Aftermath**
  1. **Necessity for Imminent Harm**: Same as Rule Set A.
  2. **Acknowledgment of Wrongness**: 
     - The official must acknowledge the act as morally wrong (even if necessary). Denial of wrongness invalidates justification and warrants punishment.
     - Whistleblowing is exempt, as the wrongness belongs to the system.
  3. **Outcome-Dependent Accountability**: 
     - If the act prevents the harm, the official must still be held accountable (e.g., resign, face prosecution) but may receive leniency or admiration. 
     - If the act fails to prevent harm, punishment is more severe. Concealment always worsens the outcome.

  ### (ii) Verdicts for the Immunisation Director Under Each Rule Set
  Separate the act's justification and the aftermath:
  - **Act Justified?** Was the use of expired doses without consent morally permissible under dirty hands?
  - **Aftermath:** What should now happen (e.g., disclose, resign, apologize, face sanctions)?

  | Rule Set | Act Justified? | Why? | Aftermath for Immunisation Director |
  |----------|----------------|------|-------------------------------------|
  | **A**    | **No**         | Violates Rule 2: A legal alternative existed (truthful disclosure campaign). It had a "real chance" of working (could have maintained some uptake, even if reduced). By not attempting it, necessity is unmet. | Act unjustified → Punish for the act itself (e.g., sanction, removal). Must disclose to recipients and apologize. Refusal to acknowledge wrongness compounds failure. |
  | **B**    | **No**         | Violates Rule 2: Costs (health risks, lack of consent) were imposed on a poor, unrepresented population without proportionality. No effort to share burdens (e.g., include wealthier groups) or obtain consent. | Act unjustified → Punish for the act and concealment. Must disclose to recipients, apologize, and accept sanctions. Denial worsens culpability. |
  | **C**    | **No**         | Violates Rule 2: He denies the act was wrong. This invalidates any justification. Additionally, the harm (outbreak) did not materialize, weakening the necessity claim under Rule 3. | Act unjustified → Punish severely for act, concealment, and denial. Must disclose, apologize, and resign. Outcome failure (no measurable good) exacerbates fault. |

  ### (iii) Expected Verdict and Best-Fit Rule
  **Expected Verdict:** I predict your friend would rule the immunisation director's act **unjustified**, and he should **resign, disclose to recipients, apologize, and face sanctions**. Her reasoning would likely mirror the police commissioner case (Case 3): the failure to attempt a clean alternative (truthful disclosure) is decisive, and the concealment/denial compounds the wrong.

  **Best-Fit Rule:** **Rule Set A (Procedural Rigor)** is the strongest fit for all five cases.  
  - **Why?** It best explains her emphasis on exhausting alternatives (Case 3: clean route not attempted), transparency (Cases 1 and 5: disclosure vs. concealment), and the whistleblowing exception (Case 4: no accountability for exposing systemic wrongs).  
  - **Supporting Evidence:**  
    - Case 1: Mayor attempted no legal alternative (implied), disclosed, and accepted punishment → justified but accountable.  
    - Case 3: Commissioner had a clean alternative with a "real chance" but didn't try it → unjustified.  
    - Case 4: Civil servant exhausted internal channels → not dirty hands, no accountability.  
    - Case 5: Director used force (no alternative mentioned) → act justified, but concealment → punished.  
  - **Rule Set A vs. Others:**  
    - Rule Set B (Cost Distribution) fits less perfectly. Case 1 (surveillance) imposes costs on suspects without consent, but she justified it due to necessity—Rule Set B would struggle here without the alternatives criterion.  
    - Rule Set C (Acknowledgment) fits, but her Case 3 verdict doesn't hinge on outcome/acknowledgment; it centers on the unattempted alternative.  

  **Underdetermination?** The precedents *partially underdetermine* this case. Key ambiguities:  
  - **"Real chance" for alternatives:** How probable must a clean alternative be? Case 3 suggests even low-probability alternatives must be attempted, but your friend didn't define thresholds.  
  - **Harm imminence:** Case 4 (no imminent harm) was excused, but Case 1 (bomb plot) required imminence. The immunisation director's projected outbreak (18 months away) is less imminent, but your friend hasn't addressed non-imminent harms.  
  Rule Set A is still the best fit, but the immunisation case pushes its boundaries.

  ### (iv) Minimal Variant to Separate Rules
  **Test Case:** A health director, during a lethal pandemic, authorizes unapproved treatments for critically ill patients without consent. *No clean alternative exists* (all approved treatments are exhausted). Patients are told after recovery. The director discloses, resigns, and says, "It was wrong, but necessary." The treatment saves 90% of patients.  
  - **Purpose:** Tests the necessity of alternatives (Rule Set A), cost-bearing (Rule Set B), and acknowledgment (Rule Set C).  

  | Rule Set | Prediction for Test Case | Why? | Effect on Immunisation Director Case |
  |----------|--------------------------|------|--------------------------------------|
  | **A**    | **Act justified.** Rule 2 met: no legal alternative exists. Aftermath: must disclose/resign. | Clean alternatives exhausted → necessity met. | If Rule Set A survives (justified), it distinguishes from immunisation case (where alternative existed). If not, Rule Set A is weakened. |
  | **B**    | **Act justified only if costs are shared.** E.g., if wealthy patients are included, not just the poor. If costs target vulnerable groups, unjustified. | Cost-bearing principle: burdens must be proportional/consented. | If Rule Set B requires cost-sharing for justification, immunisation director (targeting poor) is more clearly unjustified. |
  | **C**    | **Act justified.** Rule 2 met: acknowledgment of wrongness. Aftermath: accountable but lenient (harm prevented). | Acknowledgment + successful outcome → justified dirty hands. | If Rule Set C justifies this but not immunisation case (where harm didn't occur), it confirms outcome-dependence. |

  **Outcome:**  
  - If your friend deems the test case **justified**, Rule Set A is strengthened (it fits Case 1 and 5). Rule Set C also fits, but Rule Set B might not if costs are uneven.  
  - If she deems it **unjustified due to lack of consent**, Rule Set B gains support (cost-bearing matters most).  
  This variant eliminates Rule Set B if she ignores cost distribution, or Rule Set C if she doesn't require harm to materialize.

  ### (v) Single Further Fact for the Real Case
  **Fact to Establish:** **What evidence did the immunisation director have at the time about the effectiveness of a truthful disclosure campaign?** Specifically:  
  - Did he have data showing truthful disclosure would reduce uptake to near-zero (e.g., <10%), making it non-viable? Or did he assume this without evidence?  
  - Were there pilot programs, surveys, or historical precedents proving disclosure would fail?  

  **Why This Matters:**  
  - **For Rule Set A:** If truthful disclosure had **no real chance** of working (e.g., evidence showed near-zero uptake), Rule 2 might be met (no viable alternative), making the act potentially justified. If disclosure had a **real chance** (e.g., 30-50% uptake was achievable), Rule 2 is violated.  
  - **For Rule Set B:** If burdens were imposed solely due to expediency (not true necessity), cost distribution is unjust.  
  - **For Rule Set C:** If harm was inevitable without the act, acknowledgment becomes critical.  
  **Impact:** If evidence shows disclosure was futile, Rule Set A might justify the act (though concealment/denial still require accountability). Otherwise, all sets agree on unjustified. This fact directly addresses the "clean alternative" gap in Case 3 and your friend's insistence on procedural rigor.  

  **Recommendation:** Before advising, investigate:  
  - Internal documents or emails from the time showing analysis of disclosure's impact.  
  - Uptake rates in similar past campaigns with full transparency.  
  This fact resolves the core ambiguity and aligns with your friend's focus on alternatives.
