prompt: |-
  I'm on a tiny analytics team at a hospital system (four of us: one actual statistician, two clinicians, and me), and every quarter we put out comparisons — two surgical techniques for the same condition, readmission rates for two of our sites, a new discharge protocol against the old one, and ocasionally two named surgeons. Inevitably one of the numbers flips when you cut it by severity, or by age band, or by whether the patient came in through the ED, and then the meeting turns into the same argument every single time: whoever looks bad in the big table says the cut-up version is the real story, whoever looks bad in the cut-up version says the aggregate is what actually happened to actual patients. I want to write down a real procedure we can run each quarter instead of re-litigating this from scratch, and I want it to be honest about which parts are genuine judgment calls dressed up as method.

  What I have in mind is: an ordered list of questions to walk through the moment a reversal shows up, what counts as a good enough answer to each, where the procedure just stops with a "no" (report the aggregate, or refuse to cut at all), and where it hands the decision to a person because the question is really about values, or about what the committee actually wanted to know. A few specific things keep tripping us up and I'd want the procedure to say something about each. One: sometimes the variable we want to cut by is something that happened *after* the treatment started — whether they got admitted to ICU, how long they waited, whether they were discharged to a rehab facility — and my suspicion is that cutting by those is basically cheating, but I can never explain why in a way that lands with the clinicians. Two: the severity score is assigned by different people at the two sites, or it's continuous, and whether we cut it in half or into quartiles seems to decide whether the reversal shows up at all; also half our strata have like nine patients in them and I don't trust the reversal to be real rather than noise. Three: if we actually adopt the protocol, the case mix won't stay still, so the aggregate we computed on last year's mix presumably isn't a forecast of anything. Four, and this is the bit I keep coming back to: I think there are genuinely different questions hiding inside "which one is better" — better for the mix of patients we happened to see, better for a patient whose type we already know, better for a patient who walks in tomorrow and whose type nobody knows yet, and better as a rule we could actually implement, which might mean routing type-1 patients to A and type-2 to B, a thing neither "always A" nor "always B" captures at all — and I think those can have different right answers, so at some point the procedure has to stop and ask a human which question was meant. My friend who does A/B testing at a tech company says they never look at the aggregate at all, they always segment, which sounds wrong to me but I can't quite say why.

  So: can you write the procedure, then run it on three cases and show the output? Case one: technique A beats B on complications overall but B beats A within both the mild and the severe group, and the severe cases mostly went to B. Case two: our site has worse readmissions than the other site overall but better within every age band, and the two sites' intake nurses grade severity differently. Case three should be the one that's annoying for us: we've been reporting a stratified number for a discharge protocol for the last two quarters that makes our unit look fine, and the thing we cut by — whether the patient ended up in a step-down unit — I now think might be downstream of the protocol itself, so tell me whether the procedure says to drop that number and what we should have reported instead. Constraints: maybe half a day per report, spreadsheets and R, output gets read by clinicians who will tolerate the word confounder but whose eyes glaze over at anything more technical than that, and whatever it says I have to be able to defend it when a department chair accuses us of massaging the numbers. Also please say plainly what the procedure can't do — where it just doesn't have an answer.
reasoning: |-
  We are designing a procedure to handle Simpson's paradox or reversal when comparing groups (like two treatments, two sites, etc.) in a hospital analytics setting. The procedure should be a step-by-step guide that the team can follow each quarter when a reversal (where the overall comparison flips when stratified by a variable) occurs. The goal is to have a consistent, defensible method that acknowledges where judgment is required.

  The procedure will consist of an ordered list of questions. At each step, we either proceed, stop and report the aggregate, refuse to cut, or hand off to a human for a judgment call.

  Key issues to address:
  1. Cutting by variables that occur after treatment (like ICU admission) - which might be mediators or colliders, not confounders. This is problematic because it can introduce bias.
  2. Severity scores assigned differently between sites, small strata, and how to bin continuous variables.
  3. The case mix might change if we adopt a new protocol, so the historical aggregate may not forecast the future.
  4. Clarifying the question: is it about the historical patient mix, a specific patient type, or a future population? And whether we are considering a fixed rule or a dynamic assignment.

  Procedure Outline:

  Step 1: Identify the reversal and the stratifying variable(s)
     - Check if the reversal is observed in multiple stratifications (e.g., age, severity) or just one. If only one, note it as a candidate for further steps.

  Step 2: Check if the stratifying variable is a confounder (i.e., it affects both the treatment assignment and the outcome) and is measured before treatment.
     - If the variable is measured after treatment (like ICU admission, step-down unit), then it might be a mediator or collider. We should avoid adjusting for such variables because it breaks the causal chain and can bias the estimate. 
       * Action: If the variable is post-treatment, then we do not use the stratified analysis for causal claims about the treatment. Instead, we report the aggregate and note that the stratifying variable is post-treatment and thus inappropriate for adjustment. However, we might still report the stratified analysis for descriptive purposes but with a clear caveat.

  Step 3: Assess the quality of the stratifying variable.
     a) If the variable is continuous, check if the binning (e.g., quartiles vs. halves) affects the reversal. If the reversal only appears in one binning and not another, then it might be an artifact. Also, check the sample size in each stratum.
        - If any stratum has fewer than 10 events (or a similar small number) then the estimates in that stratum are unstable. 
        * Action: If the reversal is sensitive to binning or if there are small strata, then we do not trust the reversal. We might report the aggregate or try a different approach (like regression adjustment) if feasible and if the variable is a confounder.

     b) If the variable is categorical but measured differently between groups (e.g., severity scores assigned by different people at different sites), then we must question the comparability of the strata.
        * Action: If the variable is not measured consistently, then we cannot rely on the stratified analysis. We report the aggregate and note the measurement inconsistency.

  Step 4: Consider the representativeness of the current case mix for future decisions.
     - If the goal is to forecast the effect of implementing a protocol (or choosing a treatment) on a future population, then we must account for the fact that the mix of patient types might change. The aggregate (over the historical mix) is a valid estimate for the effect in a population with the same mix. However, if we expect the mix to change, then we need to adjust (standardize) the estimates to the expected future mix.
     * Action: If the question is about a future population with a different mix, we need to standardize the stratum-specific estimates to the expected future mix. If we don't have a forecast of the future mix, we might report both the aggregate (for the historical population) and the standardized estimate for a reference population (e.g., the overall population of the hospital) and note the uncertainty.

  Step 5: Clarify the question.
     - We must ask: What is the goal of the analysis?
          Option A: To describe what happened in the past for the entire group of patients (then the aggregate is appropriate).
          Option B: To estimate the effect for a specific patient type (then we report the stratum-specific estimate for that type, if sample size is adequate).
          Option C: To decide on a fixed rule (always use A or always use B) for the entire population (then we need the aggregate effect for the population we have, but note that if the mix changes, the effect might change).
          Option D: To decide on a dynamic rule (assign treatment based on patient type) then we need the stratum-specific effects and the ability to measure the type. Also, we must consider the cost of misassignment and the feasibility of measuring the type.

     * Action: If the goal is not clear, we must bring this to the committee and ask for clarification. The procedure stops until the question is clarified.

  Step 6: Final decision and reporting.
     - After going through the above, we decide what to report:
          - If the stratifying variable is post-treatment or of poor quality (inconsistent measurement, small strata) then we report the aggregate and note the limitations.
          - If the stratifying variable is a valid confounder and the reversal is robust (not sensitive to binning and strata are large enough) and the goal is to understand effects within strata (for a dynamic rule) then we report the stratified analysis and note that the aggregate is not the whole story.
          - If the goal is a fixed rule and the aggregate is the best estimate for the historical population, then we report the aggregate and note that if the patient mix changes, the effect might change.

     - We must always report:
          - The sample sizes in each stratum.
          - The limitations (e.g., "This analysis is descriptive and does not account for unmeasured confounders", or "The severity score was assigned differently at the two sites, so the strata may not be directly comparable", etc.)

  Now, let's run the procedure on the three cases:

  Case 1: Technique A beats B on complications overall but B beats A within both the mild and the severe group, and the severe cases mostly went to B.

  Steps:
  1. Reversal observed: overall A has lower complications, but within each severity group (mild and severe) B has lower complications. The stratifying variable is severity (a confounder because severity affects both the choice of technique and the outcome).

  2. Severity is measured before treatment? Yes, because it's about the patient's condition at presentation. So we proceed.

  3. Assess quality of severity variable:
     - If severity is continuous and we've split into mild/severe, check if the reversal holds in other splits? We don't have that information, but we assume the split is standard. Also, check sample sizes: if the severe group is large enough (and mild too) then we trust the reversal. If the severe group is small, we might be cautious.

     Let's assume the severe group has more than 10 events and the mild group too. Then the reversal is robust.

  4. Representativeness: The current case mix is as observed. The aggregate shows A is better, but that's because severe patients (who have more complications) were more likely to get B. So the aggregate is confounded by severity.

  5. Clarify the question:
     - If the question is: "Which technique is better for the mix of patients we had?" then the aggregate is confounded and we should adjust. We can report an adjusted estimate (e.g., by standardizing to the overall severity distribution) to get the average treatment effect adjusted for severity.
     - If the question is: "Which technique is better for a patient of a given severity?" then we report the stratum-specific estimates: for mild patients, B is better; for severe patients, B is better. Therefore, B is better in each group.
     - If the question is: "What should we do going forward?" then if we can assign based on severity, we might choose B for all. But note: if the reversal is due to confounding, then the aggregate might be misleading. The adjusted estimate (which would be the average of the stratum-specific effects weighted by the overall severity distribution) would show that B is better because within each stratum it is better. So the adjusted overall effect would favor B.

     However, note: the observed aggregate favors A because of the imbalance in severity. The adjusted estimate (using standardization) would be:
        Overall adjusted complication rate for A = (rate_A_mild * prop_mild + rate_A_severe * prop_severe)
        Similarly for B.

     Since in both strata B has a lower rate, then the adjusted rate for B will be lower than for A.

     Therefore, the reversal is due to confounding. The procedure would report:
        - The aggregate is confounded. The adjusted overall effect (using severity) shows that B is better.
        - Also, within each severity group, B is better.

     But note: if the goal is to assign the same treatment to everyone, then the adjusted overall effect (which we can compute) is the right answer. If we can assign based on severity, then we note that B is uniformly better so we don't need to tailor.

     So in this case, we report both the stratified analysis and the adjusted overall estimate (which favors B) and explain the reversal by confounding.

  Case 2: Our site has worse readmissions than the other site overall but better within every age band, and the two sites' intake nurses grade severity differently.

  Steps:
  1. Reversal: overall our site is worse, but within each age band we are better. The stratifying variable is age (and possibly severity? but the problem states that severity is graded differently).

  2. Age is measured before treatment (site assignment) and is a confounder? Yes, because age might affect both the site a patient goes to (if they choose) and readmission. We proceed.

  3. Assess quality:
     - Age bands: if we have enough patients in each band, then the within-band estimates are stable. But note: the problem mentions that the two sites assign severity differently. We are not stratifying by severity in this step? The reversal is by age. However, if severity is a confounder and we haven't adjusted for it, then we might still have confounding.

     The problem says: the two sites grade severity differently. This is a problem for comparing outcomes because the severity scores are not comparable. So if we want to adjust for severity, we cannot because the measurement is inconsistent.

     But in this case, we are stratifying by age, not severity. So we proceed with age.

     However, note: the reversal by age might be due to the fact that the sites see different distributions of severity within age bands? And because severity is measured differently, we cannot adjust for it.

     Therefore, we have an unmeasured confounder (the true severity) that we cannot account for because our measure is not comparable.

  4. Representativeness: The current case mix (by age) is as observed.

  5. Clarify the question:
     - We want to compare the two sites. The overall aggregate is confounded by age: our site sees older patients (who have higher readmission rates) and that's why the overall is worse. Within each age band, we are better. So the adjusted estimate (by age) would be the average of the within-age effects weighted by the overall age distribution. Since we are better in every age band, the adjusted overall readmission rate for our site would be lower.

     However, the problem is that the sites might also differ in severity, and we cannot adjust for severity because of measurement inconsistency. Therefore, the adjusted estimate by age is still potentially confounded by true severity.

     This is a limitation. The procedure would note:
          - We adjusted for age, and after adjustment our site has lower readmission rates.
          - However, we could not adjust for severity because the measurement was inconsistent between sites, so residual confounding by severity is possible.

     We might also try to do a sensitivity analysis to see how strong an unmeasured confounder would have to be to explain away the result.

     But given the constraints, we report the age-adjusted overall estimate and note the limitation about severity.

     Also, we must report the age distribution at each site to show that our site has more older patients.

     So the procedure would output:
          - The aggregate is confounded by age. After adjusting for age, our site has a lower readmission rate.
          - However, because severity is measured differently and we cannot account for it, this comparison is not perfect.

  Case 3: We've been reporting a stratified number for a discharge protocol for the last two quarters that makes our unit look fine. The stratifying variable is whether the patient ended up in a step-down unit (which is downstream of the protocol).

  Steps:
  1. Reversal: the aggregate might show that the new protocol is worse? But we have been reporting the stratified analysis (by step-down unit) which makes our unit look fine.

  2. The stratifying variable (step-down unit admission) is post-treatment (the discharge protocol). Therefore, it is a mediator or a collider, not a confounder. Adjusting for it would be inappropriate for causal effect of the protocol.

     Why? Because the discharge protocol might affect whether the patient goes to a step-down unit, and the step-down unit also affects the outcome (e.g., readmission). By adjusting for step-down unit, we block part of the effect of the protocol that acts through the step-down unit. Also, if there are common causes of step-down unit and outcome, adjusting might introduce collider bias.

     Therefore, we should not adjust for it.

  3. The procedure would stop at step 2: because the variable is post-treatment, we do not use the stratified analysis for causal inference about the protocol.

     We must report the aggregate effect (the overall comparison) of the new protocol versus the old.

     However, we might also be interested in the direct and indirect effects (through step-down unit) but that requires more advanced methods and clear causal assumptions.

     Given the constraints, we report the aggregate and note that the stratified analysis by step-down unit is inappropriate because step-down unit is a consequence of the protocol.

     What should we have reported instead? The overall effect of the protocol on the outcome (without adjusting for step-down unit). If there is concern about confounding, we should adjust only for pre-treatment confounders (measured before the protocol is applied).

     Also, note: if the case mix changed over time (e.g., because the protocol was applied to different types of patients) then we should adjust for pre-treatment patient characteristics (like age, severity) to get an adjusted estimate of the protocol effect.

     But we must not adjust for step-down unit.

     Therefore, the procedure says: drop the stratified number by step-down unit and instead report the overall effect (with adjustment only for pre-treatment confounders, if necessary).

  Summary of the procedure:

  Procedure for handling reversals in stratified analysis:

  1. Identify the reversal and the stratifying variable(s).
     - If the reversal is observed in only one variable, note it. If multiple, we focus on the one of interest.

  2. Check if the stratifying variable is measured after the treatment/exposure.
     - If yes, then do not use the stratified analysis for causal interpretation. Instead, report the aggregate and note that the stratifying variable is post-treatment and thus cannot be used for adjustment. (Exception: if the goal is purely descriptive, then report with caveats.)
     - If no, proceed.

  3. Assess the quality of the stratifying variable:
     a) For continuous variables: check if the reversal is sensitive to binning. If it disappears with reasonable alternative binning, then do not trust the reversal. Also, check the sample size in each stratum: if any stratum has fewer than 10 events (or a small number that makes estimates unstable), then the stratified results are unreliable.
     b) For categorical variables: check if the measurement is consistent across the groups being compared. If not (e.g., severity scored differently at two sites), then the strata are not comparable and the stratified analysis is unreliable.

     If the variable fails the quality check, then report the aggregate and note the issue (small strata or inconsistent measurement). If it passes, proceed.

  4. Consider the representativeness of the case mix for the question at hand.
     - If the goal is to forecast the effect in a future population with a different mix, then we need to standardize the stratum-specific estimates to the expected future mix. If we don't have a forecast, we might use a standard population (like the overall hospital population) and report the standardized estimate along with the aggregate (which is for the historical mix). Note: this step might require additional work and judgment.

  5. Clarify the question:
     - What is the goal of the analysis?
          a) Describe what happened in the past for the entire group? -> report the aggregate (but if confounded, we might need to adjust, see step 6).
          b) Estimate the effect for a specific patient type? -> report the stratum-specific estimate for that type (if sample size is adequate).
          c) Decide on a fixed rule (always A or always B) for the entire population? -> we need the overall effect for the population (adjusted for confounders if necessary).
          d) Decide on a dynamic rule (assign based on patient type)? -> we need the stratum-specific effects and the ability to measure the type.

     If the goal is not clear, stop and ask the committee.

  6. Final decision and reporting:
     - If the stratifying variable is valid and the reversal is robust, and the goal is (b) or (d), then report the stratified analysis and note that the aggregate is confounded.
     - If the goal is (a) or (c), then we need an overall effect. If there is confounding, we adjust for the stratifying variable (and other confounders) to compute an adjusted overall effect. We then report the adjusted effect and note the confounding.
     - In all cases, report sample sizes and limitations.

     If at any step we hit a stop condition (post-treatment, poor quality, or unclear goal) then we default to the aggregate (with adjustment for confounders if they are pre-treatment and well-measured) and note the reasons.

  For Case 3 specifically: we stop at step 2 because the variable (step-down unit) is post-treatment. We should not have reported the stratified analysis. Instead, we should have reported the overall effect of the protocol (possibly adjusted for pre-treatment confounders) without adjusting for step-down unit.

  What the procedure cannot do:
     - It cannot resolve issues of unmeasured confounding.
     - It cannot make causal claims without pre-treatment adjustment for all confounders.
     - It cannot handle very small sample sizes in strata without resorting to modeling (which might be beyond the scope).
     - It cannot decide on the future case mix without input from the committee.

  Defending the procedure: The key is transparency. We document each step and the reasons for our choices. We acknowledge limitations and judgment calls.

  Note: In the tech A/B testing example, they often segment to check for heterogeneity of treatment effects (HTE) and to ensure the overall effect is not driven by a subgroup. However, they typically do not adjust for post-treatment variables. Also, in tech, the primary metric is the overall effect, and segmentation is for exploratory analysis. In healthcare, we must be more cautious because of ethical implications and because the variables are often confounders.

  This procedure should fit within half a day per report using spreadsheets and R. The output should be a clear report with bullet points for each step and the decision.
answer: |-
  Below is a structured procedure for handling "reversals" (Simpson's paradox) in your quarterly comparisons, designed to be defensible, transparent about judgment calls, and executable within half a day using spreadsheets/R. It addresses your specific pain points and includes explicit "stop" rules. I'll then apply it to your three cases.

  ---

  ### **Procedure: Handling Reversals in Group Comparisons**
  **When to use:** When stratified analysis (by severity, age, etc.) contradicts the aggregate result.

  #### **Step 1: Verify the Reversal Isn’t Noise**  
  - **Question:** Are stratum-specific sample sizes large enough?  
  - **Threshold:** Any stratum with <10 events or <5% of total sample?  
  - **Stop Rule:** If YES, **report the aggregate** and note: "Stratified results unreliable due to small samples."  
  - **Judgment Call:** None. Pure statistics.

  #### **Step 2: Check if the Stratifying Variable is "Apples-to-Apples"**  
  - **Question:** Is the variable measured *consistently* and *before treatment*?  
    - *Inconsistent measurement?* (e.g., severity scored differently between sites).  
    - *Post-treatment variable?* (e.g., ICU admission, step-down unit, rehab discharge).  
  - **Stop Rule:**  
    - If **inconsistent measurement**: **Report aggregate** and note: "Groups define [variable] differently; strata not comparable."  
    - If **post-treatment**: **Refuse to cut** and note: "[Variable] may be caused by the treatment; adjusting for it hides part of the effect."  
  - **Judgment Call:** Clinicians must agree if a variable (e.g., "comorbidity index") is truly pre-treatment. If disagreement, skip to Step 5.

  #### **Step 3: Assess Causal Validity for Stratification**  
  - **Question:** Why are we stratifying?  
    - **Option A:** To adjust for a confounder (e.g., severity affects both treatment choice and outcome).  
    - **Option B:** To explore effect heterogeneity (e.g., "Does treatment A work better for young patients?").  
  - **Stop Rule:**  
    - If **Option A** and Step 2 passed: **Report the stratified estimate** (it’s less biased).  
    - If **Option B**: Proceed to Step 4.  
  - **Judgment Call:** Requires team consensus on *why* we’re cutting. Default to confounder adjustment if uncertain.

  #### **Step 4: Define the Target Question**  
  - **Question:** What does "better" mean?  
    - **Q1:** What happened to *actual historical patients*? → **Report aggregate.**  
    - **Q2:** What’s best for a *known patient type*? → **Report stratum-specific estimates.**  
    - **Q3:** What’s best for a *future patient*? → Use stratified results to **simulate outcomes under expected case mix**.  
    - **Q4:** Should we *change triage rules*? → **Build a decision rule** (e.g., "Use A for mild, B for severe").  
  - **Stop Rule:** If no consensus on the question, **pause and escalate to committee**.  
  - **Judgment Call:** This is values/strategy. Clinicians must define the goal.

  #### **Step 5: Document and Report**  
  - **Final Output:**  
    - State which estimate was reported and why (per steps above).  
    - Note sample sizes, measurement limitations, and unresolved judgments.  
    - Include both aggregate and stratified results in an appendix.  
  - **Defensibility Rule:** If accused of "massaging numbers," show this checklist and where judgment was applied.

  ---

  ### **Case Walkthroughs**
  #### **Case 1: Surgical Techniques A vs. B**  
  - **Aggregate:** A beats B (lower complications).  
  - **Stratified (severity):** B beats A in both mild/severe groups.  
  - **Severity:** Pre-treatment, measured consistently. Severe cases mostly got B.  

  | Step | Question | Result | Action |
  |------|----------|--------|--------|
  | 1    | Small strata? | No (sufficient samples) | Proceed |
  | 2    | Variable "apples-to-apples"? | Yes (severity pre-treatment) | Proceed |
  | 3    | Why stratify? | Confounder adjustment (severity affects treatment choice) | **Report stratified**: B is better within groups. Aggregate is confounded. |
  | 4    | Target question? | Q2 (best for known type) or Q4 (triage rule). Stratified answers both. | Clinically: Use B for all patients. |

  **Output:**  
  > "After adjusting for severity (which influenced treatment selection), B had lower complications than A in both mild and severe patients. We recommend B for future patients regardless of severity. Aggregate results were confounded by uneven severity distribution."

  ---

  #### **Case 2: Readmissions at Site X vs. Y**  
  - **Aggregate:** Site X worse than Y.  
  - **Stratified (age bands):** Site X better than Y in every age band.  
  - **Severity:** Scored inconsistently by intake nurses.  

  | Step | Question | Result | Action |
  |------|----------|--------|--------|
  | 1    | Small strata? | No | Proceed |
  | 2    | Variable "apples-to-apples"? | **No** (severity measured inconsistently) | **Stop. Report aggregate** with note. |
  | 3    | (Skipped) | | |

  **Output:**  
  > "Site X has higher readmissions overall. Stratification by age showed reversals, but severity scoring differences make groups incomparable. We report the aggregate result only. Recommendation: Standardize severity scoring before re-evaluating."

  ---

  #### **Case 3: Discharge Protocol (Step-Down Unit Stratification)**  
  - **History:** Reported stratified results by "step-down unit admission" to show protocol works.  
  - **Problem:** Step-down admission may be *caused by* the protocol.  

  | Step | Question | Result | Action |
  |------|----------|--------|--------|
  | 1    | Small strata? | Assume no | Proceed |
  | 2    | Variable "apples-to-apples"? | **No** (step-down is post-treatment) | **Refuse to cut**. Note: "Adjusting for downstream outcomes hides protocol effects." |
  | 3    | (Skipped) | | |
  | 4    | Target question? | Q1 (historical impact) → **Report aggregate** | |

  **Output:**  
  > "We previously stratified by step-down unit admission, but this variable may be influenced by the protocol itself. We now report only aggregate outcomes: the new protocol had [X] readmissions vs. [Y] for the old protocol. Stratifying by downstream events is invalid for causal claims."

  **What you should have reported:**  
  - Aggregate effect adjusted for pre-treatment confounders (e.g., age, severity).  
  - If no confounders, raw aggregate.  
  - **Never** stratify by post-treatment variables.

  ---

  ### **What the Procedure Can’t Do**  
  1. **Resolve unmeasurable confounding:** If key confounders (e.g., social determinants) aren’t collected, aggregate may still be biased.  
  2. **Predict future case mixes:** Requires forecasting (e.g., "Next year’s patients will be 20% sicker")—handled in Step 4 (Q3) but needs clinical input.  
  3. **Fix biased data:** Garbage in, garbage out.  
  4. **Replace clinical judgment:** E.g., "Is this severity score clinically meaningful?"  

  ### **Why Tech-Style Segmentation Isn’t Enough**  
  Tech A/B tests often segment to *detect* heterogeneity (e.g., "Feature works for iOS but not Android"), but they:  
  - Rarely have post-treatment variables.  
  - Care about *average effect* for rollout (like your Q3).  
  - Have massive samples (avoiding small-strata noise).  
  Healthcare’s stakes, confounders, and small data make raw segmentation dangerous.  

  ### **Defending to Department Chairs**  
  - **Script:** "We use a standardized checklist to ensure fairness. Here’s where we made a judgment call [show Step 3/4], and here’s why we overruled stratification [show Step 2]. We welcome feedback on the rubric itself."  
  - **Key:** Frame disagreements as "We followed the protocol" not "We chose this method."  

  This balances rigor with pragmatism—and makes the quarterly argument a structured conversation, not a shouting match.
