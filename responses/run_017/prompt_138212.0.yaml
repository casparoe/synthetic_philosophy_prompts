prompt: |-
  I'm on the animal care committee at our field station and I owe the board a recomendation in writing before Thursday, so please draft the memo.

  Two protocols. Protocol A: 24 common octopuses, each trained alone on a three-choice discrimination for about three weeks, then terminal recording under anesthesia at the end — under our permit they can't be released. The PI's case is basically that octopuses are Skinnerian creatures: they shape their own behaviour by reinforcement inside a single lifetime and that's the whole story, so the only thing at stake is what they feel during training, which is brief and mildly aversive.

  Protocol B: a field study on New Caledonian crows. In each of six territories the group's tool type differs in ways that don't seem forced by what's locally available, and in each territory there are a few birds whose tools the others appear to match. The team wants to take those birds into aviaries for eight weeks and record whether the remaining birds' tools drift or revert, and whether the original style comes back when they're returned. They pitch this as the first real test of whether a nonhuman lineage is Gregorian in Dennett's sense — a mind partly made of tools handed over by a culture instead of rebuilt by each individual.

  The bit the board is stuck on: on that scheme the Gregorian tier isn't a property of an individual at all. You're Gregorian because you were born into a culture that installs thinking tools in you, so whatever Protocol B might damage isn't something any single crow possesses. One member says that makes B worse than A in a way our severity bands don't register — you'd be deliberately dismantling something that exists only at the level of the group and its history. Another says it makes B fine, since nothing is taken from any bird. A third points out we can't even tell whether the local styles are socially transmitted or quietly reinvented by each bird, which would make them Skinnerian or at best Popperian after all — and if we can't tell, maybe we shouldn't be licensing the experiment that settles it by running it.

  Write me the memo: recommend what we do with each protocol (approve, approve with conditions, defer for more info, or reject), say whether we should add a "cultural harm" line to the review form and how a reviewer could apply one without just waving through whatever sounds most interesting, and give the strongest version of the argument you're voting against rather than the easy version. End with a last line \answer{...} carrying the bottom line in a handful of words.
reasoning: |-
  We are evaluating two protocols: A (octopuses) and B (crows). The memo should recommend approval, approval with conditions, deferral, or rejection for each. We also need to address whether to add a "cultural harm" line to the review form and how to apply it without bias. Finally, we must present the strongest argument against our recommendation and end with a bottom line.

  Key points for Protocol A:
  - 24 common octopuses.
  - Trained alone for three weeks on a three-choice discrimination task (mildly aversive but brief).
  - Terminal recording under anesthesia (they cannot be released).
  - The PI argues octopuses are Skinnerian (behavior shaped by individual reinforcement learning; no social or cultural aspects).

  Key points for Protocol B:
  - Field study on New Caledonian crows in six territories.
  - Each territory has a group with a distinct tool type not explained by local environment.
  - In each territory, remove a few key birds (whose tools others match) for eight weeks to aviaries.
  - Observe if the remaining birds' tools drift/revert and if the original style returns when the removed birds are reintroduced.
  - The study is pitched as testing whether crows are Gregorian (in Dennett's sense) — meaning culture installs thinking tools, so the mind is partly made of cultural tools.

  The board's concerns for Protocol B:
  1. The Gregorian tier is a group-level property. Removing key birds might dismantle a cultural entity that no individual possesses. This could be a harm not captured by current severity bands (which focus on individuals).
  2. Alternatively, since no individual bird is harmed (beyond temporary captivity and disruption), it might be acceptable.
  3. We don't know if the tool styles are socially transmitted (Gregorian) or individually reinvented (Skinnerian/Popperian). If we can't tell, maybe we shouldn't run the experiment that might destroy a cultural tradition to find out.

  Recommendations:

  Protocol A:
  - The training involves mild aversives, but the terminal procedure is under anesthesia and the octopuses cannot be released anyway. The harm is to individual animals and is within typical severity bands (moderate due to the terminal procedure and training stress). Since octopuses are solitary and the Skinnerian view is accepted, the protocol can be approved with standard conditions (e.g., ensuring training methods minimize distress, anesthesia is properly administered, etc.). However, note that octopuses are sentient and capable of suffering, so we must ensure the training is as humane as possible.

  Protocol B:
  - The main issue is the potential harm to the cultural tradition. The board is split. We must weigh the scientific value against the potential harm. The study design is sound for testing the hypothesis, but the disruption to the groups is significant. The birds removed will be in captivity for eight weeks, which is a welfare concern. Also, the removal might irreversibly alter the group's culture. However, the study could provide groundbreaking insights into nonhuman culture. Since the harm is to the group's culture (a non-individual entity) and our current framework doesn't account for that, we have to be cautious. We might consider deferring for more information or approving with conditions. Conditions could include:
    - A pilot in one territory to see if the culture recovers before scaling to six.
    - Strict limits on the captivity conditions to minimize individual distress.
    - A plan to monitor and intervene if the group shows signs of collapse (e.g., if tool use disappears and the group struggles to forage).
    - Post-release monitoring to ensure the group stabilizes.
  - Alternatively, if the board feels the risk to the cultural tradition is too high, we might reject. However, the scientific question is important. Given that we don't know the mechanism of transmission, the experiment might be the only way to find out. But we must be mindful that if the culture is real and we destroy it, that is a harm.

  Adding a "cultural harm" line to the review form:
  - Currently, our review focuses on individual animal welfare. Given the rise of studies on cultural transmission in animals, we should consider adding a category for potential harm to cultural traditions or group-level phenomena. However, defining and measuring "cultural harm" is challenging. We must avoid bias toward approving "interesting" studies. To apply it without bias:
    - Require that the protocol includes a justification of why the study cannot be done without disruption and a plan to minimize and monitor cultural harm.
    - Use a severity band for cultural harm (e.g., low: temporary disruption likely to recover; moderate: disruption that might cause long-term change but not loss; high: risk of irreversible loss of a cultural tradition).
    - Require that the potential harm is justified by the scientific importance and that alternative methods (e.g., observational, non-invasive) have been considered.

  Strongest argument against my recommendations:
  - For Protocol A: The strongest counterargument is that octopuses are highly intelligent and sentient beings, and even if they are Skinnerian, the three weeks of training (which is aversive) followed by terminal procedures is a significant harm to 24 individuals. Moreover, recent evidence suggests octopuses may have more complex cognitive and social lives than previously thought, so labeling them as purely Skinnerian might be outdated. The terminal procedure is non-recoverable, and the study could potentially be done with non-terminal methods or with fewer animals.
  - For Protocol B: The strongest counterargument is that by removing the key birds, we are actively disrupting a potentially ancient cultural tradition that is unique to each group. If the tool tradition is socially transmitted and we cause its irreversible loss, we are not just harming the current group but also depriving future generations of crows of that cultural heritage. This is especially problematic because we are intervening without being certain of the cultural transmission mechanism. The experiment might destroy the very thing it seeks to study, and the risk is not justified when less invasive methods (e.g., long-term observational studies, genetic analysis, or non-removal experiments) might eventually answer the question.

  Bottom Line:
  - Approve Protocol A with conditions to minimize suffering during training and ensure humane euthanasia.
  - Approve Protocol B with conditions: only after a pilot study in one territory, with strict monitoring and a plan to abort if cultural loss is observed, and with enhanced captivity conditions. Also, require that the team has considered non-invasive alternatives and that the study has high scientific merit.
  - Add a "cultural harm" assessment to the review form with clear guidelines to avoid bias.

  Final memo structure:

