prompt: |-
  hey — I write novels, and Ive been going back and forth with my critique group for years about whether a trait is really *in* a character if no scene ever puts it under pressure. Can you restate the whole fink / mask / mimicker / antidote tangle in my vocabulary: showing vs telling, in-character and out-of-character, the pressure scene, backstory, dramatic irony, flat vs round characters, the unreliable narrator, and the fact that in a novel I can just stipulate a trait in narration while the reader only ever gets manifestations on the page.

  Start from the naive view that a trait just is what the character would do under the right conditions — that's basically our show-don't-tell rule — then run the four problem cases through it as craft problems: the trait that dissolves the moment the scene that would reveal it arrives; the trait that's genuinely there but the scene can't show it; the trait the scene creates rather than reveals; the trait that gets triggered and undone in the same beat.

  Then the residue report, which is the part I actually want: what in the metaphysics has no counterpart in how I build a character, what my vocabulary can't say at all, and whether the author's power to stipulate a trait straight-out — something no real-life trait attribution has, since we only ever infer traits from behavior — is cheating, or is actually the cleanest picture of what a disposition is.

  Also invent one case of your own that the literature doesn't have, built on something novelists can do and real people can't: retconning a trait in a later book, killing the POV character mid-arc, shifting the same character into another medium with different conventions. Then say honestly whether it's a new kind of fink or mask or just an old one in a costume. Under 800 words, and please no jargon I'd have to look up.
reasoning: |-
