  - **Announcement:** "Now, imagine you are the house and you are facing a Sleeping Beauty who always sets the same price in every awakening. Some set 50, some set 33. How can you, as the house, make money off them? And would the same strategy work against both? You will write down a strategy for the house for a single round. The strategy must specify, for each possible awakening that occurs, which side of the trade to take (buy or sell) and at what price? But note: the house doesn't set the price, the participant does. The house only chooses which side to take at the price the participant sets. And the house knows the coin outcome and the number of tails awakenings (if tails) at the time of the round. Write a strategy that the house can use to extract chips from a participant who always sets 50. Then, check if that strategy works against a participant who sets 33."

  - We want them to see that against a participant who sets 50, the house can always make money: in heads, force them to sell (gain 100-50=50 per awakening), in tails, force them to buy (gain 50 per awakening). So per round, in heads: gain 50, in tails: gain 50 * (number of awakenings). This is positive.

    Against a participant who sets 33: 
        In heads: force them to sell: gain 100-33=67.
        In tails: force them to buy: gain 33 per awakening.
        So in heads: gain 67, in tails: gain 33 * (number of awakenings). This is also positive.

    But note: the house makes money in either case. However, the amount might be different. The key is that if the participant sets the "thirder" price, the house's profit is the same regardless of the coin? Let's compute the house's expected profit per round if the coin is fair:

        For a halfer (P=50):
            Heads: 50
            Tails: 50 * 2 (if we go back to the basic) = 100
            Expected: (50+100)/2 = 75.

        For a thirder (P=33.33):
            Heads: 66.67
            Tails: 33.33 * 2 = 66.66
            Expected: (66.67+66.66)/2 = 66.665.

        So the house makes less from the thirder.

    But in the unknown multiplicity, the house might make more from the halfer.

    We then have a discussion.

  **Debrief (10 minutes)**
  - We map the experience:
    1. In Phase 1, we saw that setting 50 led to more losses than 33. Why? Because in tails you bet twice.
    2. The dispute is about what counts as an equally likely possibility. The halfer counts two coin states (heads and tails) and the thirder counts three awakening states (heads-awake, tails-awake1, tails-awake2).
    3. In Phase 2, when the number of tails awakenings is unknown, the counting heuristic fails. But the exploitability of 50 is even more pronounced.
    4. We then note that even though 33 leads to lower losses, it doesn't mean that 33 is the correct credence. The halfer can argue: "I still think the probability of heads is 1/2, but I set 33 to minimize losses because I know I'll be asked twice in tails." This is the point that betting price and credence can come apart.

  - Strongest halfer reply: The betting setup forces you to consider the frequency of the awakenings. The fair coin means heads and tails are equally likely, but in tails you are asked more times. So the link between the price and the credence is broken. The correct credence is 1/2, but the correct betting price is 1/3 to avoid being exploited.

  **Timeline:**
  - 0-5 min: Explain Phase 1 rules.
  - 5-35 min: Run Phase 1 (5 rounds? Each round takes about 5 minutes: flip, write prices, settle. With 16 participants, settling might take time. Alternatively, we can have them write prices simultaneously and then we settle quickly. We can do 10 rounds if we move fast.)
  - 35-55 min: Phase 2 (unknown multiplicity). Run 5 rounds.
  - 55-85 min: Phase 3 (exploitation strategies). 10 minutes for design, 10 minutes for discussion in pairs, 10 minutes for sharing.
  - 85-90 min: Debrief.

  **What can go wrong:**
  1. **Programmer asks: "Is settlement per awakening or per run?"** We were clear: per awakening. Each awakening is a separate bet.
  2. **Refuses to bet:** Encourage them to participate by setting a price. They can set P=100 to avoid loss in heads, but then in tails they will lose 100 per awakening. Or set P=0: safe in tails but loses 100 in heads. They have to choose.
  3. **Spoiler:** Ask them not to reveal the name or the camps. If they do, incorporate it: "Yes, this is known as the Sleeping Beauty problem, and there are two main camps. Let's see if we can rediscover why they disagree."
  4. **Group splits and stops updating:** Keep the leaderboard visible and update after each round. Make it competitive.

  **What the activity cannot reproduce:**
  - Real memory erasure: we are simulating with index cards and not letting them know about other awakenings. But they know the setup, so it's not true amnesia. We have to stress that they should act as if they don't remember.
  - We are testing betting dispositions, not credence directly. In the debrief, we must discuss the difference.

  We'll go with this design.

  ### Rejected Ideas
  1. **Unknown Multiplicity with Unknown Distribution:** I considered having the die roll not revealed even after the round, so participants never learn the number of tails awakenings. But that might be too confusing and we want to settle the bets. So we reveal the coin but not the die roll until after the round? Actually, we don't need to reveal the die roll because the settlement only depends on the coin. We only reveal the coin. The die roll is only to determine the number of awakenings in tails. So after the round, we reveal the coin and the die roll (if tails). But in the settlement, for tails, we have as many bets as the die roll showed. We don't need the participants to know the die roll until after they write the cards? Actually, they never know the die roll until after the round, when we reveal everything. So it's fine.

  2. **Having no multiplicity in Phase 1:** I considered using a different problem, but the classic is best.

  3. **Using physical sleep:** We avoid by using index cards and simultaneous writing (or sequential with collection in between).

  Final rules and wording are below.
