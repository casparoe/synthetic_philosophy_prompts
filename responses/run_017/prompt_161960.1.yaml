  Here is my sketch, which I think is broken in places and want you to fix or replace. Phase 1: everyone plays Beauty at once. I announce a fair coin, heads means one awakening, tails means two, the amnesia procedure wipes each session. At each awakening every participant posts a single sealed number — the price in chips at which they would buy a ticket paying 100 chips if the coin landed heads — and I, as the house, fill the order at every awakening with all purchases standing, and I am free to take either side of whatever price they post. Settle in chips across several runs and keep a leaderboard. Phase 2, the part I am least sure about: keep the fair coin but make the tails awakenings an unknown number — I roll a die behind a screen at the start of each experiment and wake them that many times on tails without ever telling them the number, so the count the possible centres and divide heuristic has nothing to count and the one-half answer and the counting answer come dramatically apart. I am genuinely not certain what the correct price is in that variant, and I half suspect the construction begs the question by building the outcome-dependent number of bets into the payoff rather than testing it — tell me honestly if so and what to do instead. Phase 3: flip the roles, so each pair writes down a strategy that extracts chips from someone who always posts 50, and then checks whether the same strategy still works against someone who posts 33. We obviously cannot put anyone to sleep, so I need a way to stage awakenings with cards or envelopes that makes the information loss explicit rather than merely asserted. Please give me exact rules and the actual wording of the announcements participants hear, the materials, a minute-by-minute timeline for 90 minutes, a chip payoff scheme with no real money that still makes the exploitability of a wrong price visible inside the session, and a debrief that maps specific moments onto specific parts of the dialectic, including the strongest halfer reply — that betting price and credence can come apart when the number of bets depends on the outcome, and that counting centres is a substantive assumption rather than a datum. Finally, tell me what will predictably go wrong when I run it — the programmer who immediately asks whether settlement is per awakening or per run, the person who refuses to bet at all, the person who has read about this online and spoils it, the group that splits and simply stops updating on the leaderboard — how to handle each, and be frank about what the activity cannot reproduce: my sense is that it can only ever test dispositions to act under a stipulation rather than credence itself, and that real memory erasure is doing work I cannot stage, but tell me if there is more I will have to say out loud at the end.
