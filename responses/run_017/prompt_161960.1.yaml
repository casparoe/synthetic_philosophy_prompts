  ### Final Runnable Design: The Sleeping Beauty Game

  **Core Mechanics:**  
  Participants play as "Sleeping Beauty," experiencing awakenings with amnesia. They set prices for a ticket paying 100 chips if a fair coin lands heads. The house exploits mispricings to demonstrate that naive pricing (e.g., 50) loses chips systematically. The design emphasizes three insights:  
  1. **Disagreement stems from how to count possibilities** (coin states vs. awakening "centers").  
  2. **Outcome-dependent bet frequency enables exploitation** (e.g., more bets on tails).  
  3. **Betting prices ≠ credence**—minimizing losses doesn’t resolve what Beauty "should believe."  

  **Materials:**  
  - 1 fair coin, 1 six-sided die, 1 whiteboard.  
  - Index cards (5 per player).  
  - Poker chips (1,000 starting chips per player; track totals on a leaderboard).  
  - Envelopes (2 per player; labeled "Awakening 1" and "Awakening 2" for amnesia simulation).  

  **Timeline (90 Minutes):**  
  #### **Phase 1: Basic Sleeping Beauty (30 min)**  
  *Goal: Discover that 50-chip pricing loses to 33-chip pricing.*  
  **Announcement (5 min):**  
  > "Welcome! Each of you is Sleeping Beauty. I’ll flip a fair coin. Heads: you’ll be awakened **once**. Tails: you’ll be awakened **twice**. In each awakening, you have amnesia—you won’t remember past awakenings.  
  > **Your task:** At each awakening, write a price (0-100) on an index card. This is the price at which you’ll trade a ticket paying 100 chips if the coin landed heads.  
  > **Settlement:** After all awakenings, I (the house) reveal the coin. For each card, I’ll force you to either:  
  > - **Sell** the ticket (you get your price, pay 100 if heads).  
  > - **Buy** the ticket (you pay your price, get 100 if heads).  
  > I choose the option that makes you lose the most chips.  
  > **Scoring:** Chips settled per awakening. Starting chips: 1,000. We’ll run 5 rounds. Lowest chips win!"  

  **Procedure (25 min):**  
  1. **Round 1-5 (4 min/round):**  
     - Flip coin secretly.  
     - If heads: Players write **one** card (all at once).  
     - If tails: Players write **two** cards (simulate amnesia):  
       - Seal Card 1 in "Awakening 1" envelope.  
       - Collect envelopes, shuffle, redistribute randomly.  
       - Players write Card 2 (without seeing their first card).  
     - Collect all cards. Reveal coin.  
     - **Settle:** For each card:  
       - Heads: If price < 100, force sell (player loses `100 - price`).  
       - Tails: Force buy (player loses `price`).  
     - Update leaderboard.  

  *Debrief seed:* "Notice patterns? Why might tails rounds hurt more?"  

  ---

  #### **Phase 2: Unknown Multiplicity (20 min)**  
  *Goal: Break "count centers" heuristic; show 50 still loses badly.*  
  **Announcement (5 min):**  
  > "New rule: Heads still means **one awakening**. Tails means **N awakenings**, where N is my secret die roll (1-6). I roll N before awakenings. You never learn N until after settlement.  
  > **Task:** Same as Phase 1. Write a price per awakening. We’ll run 3 rounds."  

  **Procedure (15 min):**  
  1. **Round 1-3 (4 min/round):**  
     - Flip coin secretly. If tails, roll die secretly for N (1-6).  
     - Players write **one card per awakening** (e.g., if tails, write N cards; amnesia via shuffled envelopes).  
     - Settle identically to Phase 1.  
     - After settlement, reveal coin and N (if tails).  

  *Debrief seed:* "Could you count equally likely cases? Why did 50 still lose more than 33?"  

  ---

  #### **Phase 3: Exploit Strategies (30 min)**  
  *Goal: Show how to exploit fixed prices; contrast 50 vs. 33.*  
  **Announcement (5 min):**  
  > "Switch roles! In pairs, design a **house strategy** to exploit a player who **always prices at 50**. Then, test it against a player who **always prices at 33**.  
  > **Rules:**  
  > - You know the coin outcome and N (if tails) upfront.  
  > - For each awakening, you must accept the player’s price but choose **buy** or **sell**.  
  > **Goal:** Maximize house profit over 1 round (heads + tails).  
  > 10 min to design, 5 min to share."  

  **Procedure (25 min):**  
  1. **Design (10 min):** Pairs write strategies. *Example: "Heads: force sell. Tails: force buy."*  
  2. **Test (10 min):**  
     - Groups report: "Against 50: Heads profit = `100 - 50` = 50. Tails profit = `50 × N`. Total expected profit: `(50 + 50 × 3.5)/2 = 112.5`."  
     - "Against 33: Heads profit = `100 - 33` = 67. Tails profit = `33 × N`. Total expected: `(67 + 33 × 3.5)/2 = 77.5`."  
  3. **Reveal:** 33 is harder to exploit (lower house profit).  

  ---

  #### **Debrief (10 min)**  
  Map experiences to the dialectic:  
  1. **"What caused disagreement?"**  
     - Phase 1: Dispute isn’t about the coin (fair), but **what to count equally**.  
     - Halfer: "Two coin states (H/T), so P(Heads) = 1/2!"  
     - Thirder: "Three awakening states (H, T1, T2), so P(Heads) = 1/3!"  

  2. **"Why did 50 lose chips?"**  
     - Bet frequency depends on outcome (Phase 1/2). House exploits when you underprice heads or overprice tails.  
     - In tails, you bet multiple times—naive 50 guarantees loss (e.g., `50 × N`).  

  3. **"Does 33 prove credence?"**  
     - **No!** Halfer reply: "I believe P(Heads) = 1/2, but I set price = 33 to minimize losses because I know I’ll bet twice in tails. Betting price ≠ credence."  
     - **Key insight:** Counting centers isn’t a given—it’s a choice.  

  4. **Limitations of the activity:**  
     - We test betting *behavior*, not belief. Real amnesia can’t be staged.  
     - Beauty’s "awakening" is a stipulation—participants might not *feel* amnesia.  

  ---

  ### Rejected Ideas & Why  
  1. **Unknown Multiplicity Without Settlement Transparency:**  
     - *Original sketch:* Die roll hidden entirely (no N revealed).  
     - *Why rejected:* Opaque losses prevent learning. Players can’t see why 50 fails (e.g., "Did I lose because of N=6?"). Revealing N post-settlement maintains uncertainty but validates the mechanism.  

  2. **"Per Run" Settlement:**  
     - *Considered:* Awarding 100 chips only once per coin flip (not per awakening).  
     - *Why rejected:* Weakens exploitation. With per-awakening payouts, tails forces multiple losses—making 50’s flaw visceral.  

  3. **Physical "Sleep" Simulation:**  
     - *Considered:* Players close eyes between awakenings.  
     - *Why rejected:* Cumbersome and cheesy. Envelope shuffling cleanly simulates amnesia via information loss.  

  ---

  ### Predictable Issues & Fixes  
  1. **"Per awakening or per run settlement?"**  
     - *Likely asker:* Programmer (minute 5).  
     - *Fix:* Clarify upfront: "Each awakening is a separate bet—settled individually."  

  2. **Refusal to Bet:**  
     - *Likely player:* Risk-averse philosopher.  
     - *Fix:* Encourage extreme prices (0 or 100) to illustrate trade-offs. "If you set 100, you lose 0 in heads but 100×N in tails!"  

  3. **Spoiler Alert:**  
     - *Likely player:* Philosophy undergrad who knows Sleeping Beauty.  
     - *Fix:* Pre-brief: "If you’ve seen this, help others *discover*—don’t name camps." If spoiled, pivot: "Why do smart people disagree?"  

  4. **Group Splits Stop Updating:**  
     - *Likely:* Faction (e.g., "halfers") ignores leaderboard.  
     - *Fix:* Stress competition. "Team with most chips picks the next game!"  

  5. **Cannot Reproduce:**  
     - **True amnesia:** Stipulated info loss (envelopes) replaces lived experience—admit this.  
     - **Credence vs. price:** Activity can’t resolve if Beauty *should* believe 1/3—only that 1/3 minimizes losses. Highlight this in debrief.  

  **Final Note:** The activity *successfully* makes exploitation visible, forces confrontation with center-counting, and separates price from credence. Run it as-is, and let the chips fall where they may!
