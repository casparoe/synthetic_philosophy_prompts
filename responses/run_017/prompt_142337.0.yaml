prompt: |-
  I'm on the benefits committe at work — there's five of us, at a company of about 70 people, and we're the ones who decide what our self-funded health plan actually pays for. The plan document is from like 1994 and says it covers treatment of disease or injury and doesn't cover cosmetic, lifestyle, or elective enhancement stuff. Years ago our broker told us to write ourselves a one sentence test for what counts as a disease, because otherwise we'd argue about it forever. The test we came up with, and have used ever since, is basically this: it's a medical problem if some part of you is working worse than it normally works in a healthy person of your age and sex, and it's causing you real trouble.

  I always thought that was pretty reasonable. This month we had three appeals and now I think it's either wrong or I'm applying it wrong, and I keep flip-flopping between the two.

  1) Marcus, 58, drives a forklift. His testosterone came back in the low-normal range for men his age. He says he's wiped out all the time, no sex drive, can't concentrate. His doctor put him on replacement therapy and he says he got his life back. We denied it: nothing in him is working worse than normal, he's just getting older. But his supervisor says Marcus is a different guy since the shots. His age is doing all the work in that sentence and I don't know why age gets to do that.

  2) Priya, 34, in accounting. Her husband died in a crash seven weeks ago. She's sleeping three hours a night, lost a lot of weight, can't get through a spreadsheet, and she's asking for short term disability plus coverage for an intensive outpatient program. Our behavioral health vendor says this is normal grief, not a diagnosis, so the program isn't covered; the disability people say they can't approve leave without a diagnosed condition. She's obviously in real trouble and I can't point to anything in her that's malfunctioning.

  3) Sam, 41, warehouse. Type 2 diabetes, heavy, drinks most nights, needs bariatric surgery. One of our members said flat out that this isn't a disease, it's a lifestyle, and we shouldn't pay for it. Same guy voted yes last month on knee surgery for someone who blew out his knee playing pickup basketball. When I pointed that out he said that's different, you can't help getting hurt playing ball. I have no idea whether that's a real distinction or if we're just punishing Sam.

  On top of all this, Denise on the committee wants to change the test from a healthy person of your age and sex to someone like us, because most of the warehouse works night shift and half of us are carrying extra weight, and if we say healthy person then suddenly everybody's sick. I feel like that makes things worse, not better, but I can't say why.

  So: is there a better one sentence test? Or is the whole idea of a one sentence test hopeless, and if it is, what do I actually say at the meeting on Thursday?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on a benefits committee for a self-funded health plan at a mid-sized company. Their current one-sentence test for determining coverage is causing issues with recent appeals. The test defines a medical problem as something where a body part works worse than normal for a healthy person of the same age and sex, causing real trouble. 

  First, I need to understand why the three cases are problematic. Marcus’s low testosterone is age-related. The committee denied it because aging isn’t a malfunction, but his symptoms improved with treatment. Priya’s grief isn’t classified as a disease, so she can’t get coverage even though she’s struggling. Sam’s situation involves lifestyle factors versus an injury from sports, raising fairness questions.

  The user is conflicted because the test seems both too rigid and inconsistently applied. Denise's suggestion to use "someone like us" instead of a healthy baseline would lower standards, leading to more denials. That doesn't solve the core issue. The user needs a better framework that’s consistent and compassionate.

  Looking deeper, the user’s identity as a committee member involves balancing ethical responsibility with practical constraints. Their real need is a fair, defensible standard that avoids arbitrary decisions. They also need to present a solution at the upcoming meeting, so practicality is key.

  The existing test’s flaws are its focus on deviation from age norms and ignoring treatable suffering. Age shouldn’t dictate health standards if treatment exists. Also, mental health like grief and conditions influenced by lifestyle need clear criteria that don’t moralize.

  The assistant’s proposed test shifts to "treatable health problem" with three criteria: diagnosis, functional impairment, and standard treatment. This addresses the cases better. For Marcus, low T with symptoms and effective treatment qualifies. Priya’s impairment would need professional diagnosis. Sam’s eligibility would depend on medical necessity, not lifestyle blame.

  Denise’s concern about defining "healthy" is valid but changing the baseline isn’t the solution. Using objective diagnostic standards avoids subjectivity. The committee needs to rely on medical expertise rather than their own perceptions.

  The user might also need guidance on implementing the new test, like consulting professionals and documenting decisions. Emphasizing training for the committee could reduce personal biases. Preparing for Thursday’s meeting with a clear proposal and examples would help gain consensus.

  Underlying all this is the tension between cost control and employee care. The new test should ensure medical necessity without unnecessary denials. Highlighting the ethical and legal risks of the current approach might persuade the committee. Overall, replacing the age-based norm with functional impairment and medical standards creates a fairer, more consistent process.
answer: |-
  This is a brilliant example of why a one-sentence test, while appealing for simplicity, often crumbles under real-world complexity, especially with aging populations, mental health, and conditions with lifestyle components. **Your gut feeling is right: the existing test has fundamental flaws, primarily its dependence on "normal for age/sex" and the ambiguity of "healthy person." Denise's suggestion makes it worse.** Let's break down the problems and find a better path.

  **Flaws in the Current Test:**

  1.  **"Normal for Age/Sex" is Discriminatory & Poor Medical Science:** Biology changes with age, but "normal decline" isn't a reason to deny *treatable conditions causing significant distress or impairment*. Marcus's symptoms *are* due to low T (a measurable hormone deficiency), even if common at his age. Denying effective treatment because it's "normal aging" denies him relief for a legitimate medical problem with a standard therapy. Age shouldn't be a barrier to feeling functional.
  2.  **"Healthy Person" is Woefully Subjective & Culturally Bound:** Who defines "healthy"? Denise's "someone like us" is terrifying – it means warehouse workers with shift-related sleep disorders or chronic pain might be denied coverage because "everyone here has back pain." It normalizes pathology within a specific group. Even "healthy person of age/sex" is vague – is a healthy 58-year-old someone who runs marathons or someone who walks without pain? It invites bias.
  3.  **Fails Mental/Behavioral Health:** Priya's case highlights this. Grief isn't a disease, but *Complicated Grief Disorder* or *Major Depressive Disorder* triggered by grief *are* diagnosable conditions causing severe functional impairment. Your test can't distinguish "normal" suffering from pathological impairment requiring treatment.
  4.  **Creates Arbitrary Distinctions for Lifestyle Factors:** Sam's case exposes the hypocrisy. Is a knee injury from sports (often a "lifestyle" choice) inherently more worthy than diabetes management? The "you can't help it" argument is moralizing, not medical. The *medical need* for bariatric surgery in severe obesity (often meeting specific BMI/comorbidity criteria) exists regardless of cause. Focusing on cause punishes patients and ignores medical necessity.

  **A Better Framework (More Than One Sentence, But Principles You Can Explain):**

  Forget the one-sentence test. Propose these **core principles** for coverage decisions:

  **"Our plan covers evidence-based treatment for diagnosed health conditions that cause significant functional impairment, where the treatment is the recognized standard of care for that condition."**

  **Applying this to your cases:**

  1.  **Marcus:**
      *   **Diagnosis:** Symptomatic Hypogonadism (Low Testosterone *with symptoms*). The diagnosis exists.
      *   **Functional Impairment:** Severe fatigue, low libido, concentration issues affecting work/life (confirmed by supervisor).
      *   **Standard of Care:** Testosterone Replacement Therapy (TRT) *is* the standard treatment for diagnosed symptomatic hypogonadism.
      *   **Decision:** **Covered.** His age is irrelevant; he has a diagnosable condition causing impairment with a standard treatment.

  2.  **Priya:**
      *   **Diagnosis:** Needs professional assessment. Is it "normal grief" or has it progressed to a diagnosable condition like Major Depressive Disorder or Prolonged Grief Disorder?
      *   **Functional Impairment:** Severe insomnia, weight loss, inability to work (clear impairment).
      *   **Standard of Care:** Intensive Outpatient Programs (IOP) *are* standard treatment for severe depression or complicated grief causing this level of impairment.
      *   **Decision:** **Requires Clarification.** The committee shouldn't diagnose. **Require a formal diagnosis from a qualified mental health professional.** *If* she receives a diagnosis meeting DSM criteria (e.g., MDD, PGD), and the IOP is recommended, **it should be covered.** The vendor's "normal grief" needs to be challenged if impairment is this severe at 7 weeks.

  3.  **Sam:**
      *   **Diagnosis:** Severe Obesity (meeting specific criteria), Type 2 Diabetes (diagnosed), likely Alcohol Use Disorder (if applicable, needs diagnosis).
      *   **Functional Impairment:** Implied by severity and comorbidities (diabetes).
      *   **Standard of Care:** Bariatric surgery *is* a recognized standard of care for severe obesity with comorbidities like Type 2 Diabetes when certain criteria (BMI, failed conservative management) are met. Treatment for Alcohol Use Disorder is also standard care.
      *   **Decision:** **Covered (if criteria met).** The *cause* (lifestyle factors) is irrelevant to the medical necessity of treating the diagnosed, severe condition. Focus on medical criteria, not blame. The knee injury comparison is valid – both involve treating an injury/condition regardless of how it happened.

  **Addressing Denise's Concern & "Healthy Person":**

  *   Denise is right to worry about defining "healthy," but her solution is dangerous. **The solution is to remove "healthy person of your age/sex" entirely.**
  *   Shift the focus to **objective medical diagnosis** and **measurable functional impairment**. Does the person have a recognized medical condition (diagnosed by a professional)? Is it significantly impacting their ability to function (work, daily activities)? Is the treatment the accepted standard for *that condition*?
  *   This avoids normalizing poor health within a workforce ("someone like us") and ensures decisions are based on medical need, not subjective perceptions of "normal."

  **What to Say at the Meeting on Thursday:**

  1.  **Acknowledge the Problem:** "Our current one-sentence test served us for a while, but these recent cases show it's leading to inconsistent, unfair, and medically questionable decisions. Relying on 'normal for age' denies effective treatment for aging workers like Marcus. It fails people like Priya suffering severe mental health impairment. It forces us into judging lifestyles unfairly, like with Sam, instead of focusing on medical need."
  2.  **Highlight the Specific Flaws:** "The 'age/sex' norm punishes people for getting older. 'Healthy person' is too vague and risks normalizing poor health within our workforce if we define it down. It doesn't work for mental health."
  3.  **Propose the Principles:** "We need a clearer, fairer, more medical framework. I propose we base decisions on three things:
      *   **A formal diagnosis** of a medical or mental health condition.
      *   **Significant functional impairment** caused by that condition (affecting work or daily life).
      *   The treatment being the **recognized standard of care** for that diagnosed condition.
      *   Crucially, we **don't deny based solely on the cause of the condition** (like aging or lifestyle choices) if the medical need exists."
  4.  **Apply Briefly to Cases:** "Under this, Marcus gets covered – he has a diagnosis, clear impairment, and standard treatment. Priya needs a formal diagnosis – if she has one and the program is standard care, she should be covered. Sam gets covered if he meets the medical criteria for surgery – the cause is irrelevant to the medical need."
  5.  **Address Denise Constructively:** "Denise rightly points out the problem with defining 'healthy.' The solution is to drop that phrase entirely. We rely on medical diagnoses and objective evidence of impairment instead of our subjective view of what's 'normal' for any group."
  6.  **Next Steps:** "This needs discussion, but I urge us to move away from the old test. We could formalize these principles, perhaps consult briefly with our broker or an independent medical reviewer for guidance on standards of care, and focus on consistent application based on medical evidence, not age norms or moral judgments."

  **Key Takeaways:**

  *   **Aging ≠ Untreatable:** Decline common with age doesn't mean effective treatment shouldn't be covered if it alleviates suffering and impairment.
  *   **Mental Health is Health:** Functional impairment is the key, requiring reliance on professional diagnosis.
  *   **Cause ≠ Coverage:** Focus on the *current medical need* and *standard treatment* for the *diagnosed condition*, not how it originated (unless explicitly excluded like cosmetic injury).
  *   **Diagnosis & Standards are Key:** Anchor decisions in recognized medical diagnoses and evidence-based standards of care.
  *   **Simplicity has Limits:** A one-sentence test cannot capture the nuance of healthcare decisions. Principles, supported by process (relying on diagnoses, standards of care), are more robust.

  This shift won't eliminate all hard choices, but it will make them more consistent, medically sound, and ethically defensible. Good luck on Thursday! You're asking the right questions.
