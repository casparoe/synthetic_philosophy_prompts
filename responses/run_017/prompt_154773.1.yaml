prompt: |-
  I host a tiny podcast on philosophy of computation — maybe 300 downloads an episode, mostly grad students — and next week's guest is a philosopher defending what she calls resource-relative Bayesianism. Short version: she thinks ought-implies-can does real work in epistemology, so probabilism and conditionalization are only norms in their feasible form. An agent ought to have credences that come as close to the Bayesian ideal as the best procedure it could actually have run, given its actual computational budget, would have gotten it. And she insists this definately isn't subjectivism, because what's feasible is a hard fact rather than an opinion; her stock line is that "the best you can do with a fixed number of flops is a fact about the world, not a matter of taste."

  Draft me eight to ten questions for a 45 minute episode. I dont want anything generic and I don't want her just restating the view. I want questions that push on where I think it actually hurts, each with a follow-up keyed to what she'll probably say in reply. No need to name papers or people in the questions themselves, she'll fill those in on air.

  Where I think it hurts, roughly:

  1. The arithmetic disanalogy. The standard reply to her is that the probability axioms constrain states of an agent, and intractability is a fact about our access to those norms, not about what they require — someone who can't do long division is still wrong about the product. She'll say arithmetic has a determinate answer the agent is failing to track, whereas the credal case is different somehow. Give me the question that forces her to say exactly what the difference is, and the follow-up.

  2. Approximation. If rationality is approximate coherence, what sets the tolerance, and why doesn't the usual vindication (Dutch book, accuracy dominance) survive the move to near-coherent agents? Assume she answers that the accuracy framework can be redone with bounds instead of exact dominance. Follow up on that. Also worth asking: is the resource-limited agent justified, or merely excused?

  3. Which notion of "feasible" — worst-case asymptotics, average-case under a distribution over problems, or wall-clock on her actual hardware? If it's average-case, or worst-case relativized to "the problems an agent like this actually faces," the objectivity she wants seems to leak: the best procedure is only best relative to a problem distribution. Assume she bites that bullet, and give me a follow-up on whether the norm has quietly become prudence.

  4. The regress. Deciding how much computation to spend is itself a computation, and presumably an intractable one, so "do the best you feasibly can" may have no feasible specification. I especially want to press on whether bounded optimality (roughly: the best program you could run on your actual hardware, given your goals) collapses into descriptivism — if the architecture includes the procedure you actually ran, then whatever you did was feasible, so it was permitted. She'll probably say the collapse doesn't follow because the counterfactual programs are well defined. Give me the follow-up to that.

  5. Evidence about your own heuristics. If she knows her fast-and-frugal heuristic is reliable in this environment, is she required to treat "my procedure output p" as evidence and respond to it? Doesn't the full Bayesian machinery then come back in through the back door, as a norm on how to respond to that evidence?

  6. Hardware discontinuity. Buy a slower machine and the standard you're held to gets looser; buy a faster one and you become irrational without your credences changing at all. Reductio, or does she bite it? If she bites it, follow up on disagreement: two agents with the same evidence and different budgets can both be rational while disagreeing forever. What does the view say they should do?

  7. What would count against it. My idea: if the Bayesian-brain people are roughly right that perception is near-exact inference over a rich generative model, does her claim that the ideal is unachievable in the cases that matter lose its bite — and does the view get less interesting the better our cognitive machinery gets? Assume she replies that brains doing something Bayesian-ish isn't the same as satisfying the norms.

  Order the questions so the episode builds instead of peaking at minute ten, tell me which one to drop if we run long, and flag any place where you think I've got the pressure point wrong.
reasoning: |-
  Okay, let me start by understanding the user's request. They host a philosophy podcast on computation, and their next guest is promoting resource-relative Bayesianism. The user wants challenging questions that target the weak points of this theory, not just a restatement. They listed seven specific areas where they think the theory might be vulnerable. 

  First, I need to grasp the core of the guest's argument: rationality norms should account for computational limits, and what's feasible is objective. The user's pain points are well-thought-out, so the questions must press each without being generic. 

  Starting with the arithmetic disanalogy. The standard objection is that inability to compute doesn’t change normative truth. The guest likely argues that probability differs because it's about states, not access. The key here is forcing her to explain why probability isn’t like arithmetic. The follow-up should challenge if this distinction holds, maybe by asking if she’s changing the subject from correctness to achievability.

  Next, approximation. How does tolerance work, and do Dutch book arguments survive approximation? If she says accuracy can be bounded, follow up on why excused vs. justified matters. This ties to whether the theory is normative or descriptive.

  Feasibility notions are crucial. If she uses average-case or problem-relative metrics, objectivity might slip. If she bites the bullet, question if this turns norms into prudence. This could undermine her objectivity claim.

  The regress problem: deciding computational allocation is itself intractable. The risk is collapsing into descriptivism. If she counters with counterfactuals, press on how to evaluate them without infinite regress. This questions the feasibility of her norm.

  Evidence about heuristics brings Bayesian norms back. If knowing her heuristic’s reliability requires Bayesian updating, does that reintroduce ideal norms? Follow up on whether this creates a two-tier system, challenging internal coherence.

  Hardware discontinuity seems reductio: slower machine lowers standards, faster one makes you irrational. If she accepts, disagreement between different agents becomes problematic. Press on whether this dissolves objectivity in disagreement cases.

  Lastly, what counts against the theory? If brains approximate Bayes well, does her theory lose relevance? If she dismisses this, question if better cognition makes the theory obsolete, testing its robustness.

  I need to order these to build logically. Start with the arithmetic analogy to set up the core distinction. Then move to approximation and feasibility, which are foundational. Hardware discontinuity and disagreement come next as implications. The regress problem is complex, so it should be later. Evidence about heuristics and what falsifies the theory are deeper issues, placed towards the end. Drop the least critical if time runs out—maybe hardware discontinuity, as other points might cover similar ground.

  Also, flag if any pressure point is off. The user questioned if the regress collapses into descriptivism. The follow-up should challenge how counterfactuals avoid this without regress. The key is whether "best feasible" is action-guiding or just a label.

  Finally, ensure questions are sharp and follow-ups anticipate replies. Avoid jargon, keep it accessible but rigorous. The goal is a cohesive flow that builds tension, ending on falsifiability to leave listeners pondering.
answer: |-
  Here are 9 carefully crafted questions targeting the pressure points you identified, ordered for a logical build, with anticipated replies and sharp follow-ups. Drop **Question 7 (Hardware Discontinuity & Disagreement)** if short on time, as it's a potent reductio but slightly less central than the foundational critiques.

  **Episode Flow & Question Order:**

  1.  **Establishing the Core Distinction (Arithmetic Disanalogy)**
  2.  **The Nature of the Norm (Approximation & Vindication)**
  3.  **Defining Feasibility (The Objectivity Problem)**
  4.  **The Regress & Collapse Threat**
  5.  **Internal Evidence & Normative Recursion**
  6.  **Reductio & Implications (Hardware/Disagreement)**
  7.  **Falsifiability & Scope (Bayesian Brains)**

  ---

  **The Questions:**

  1.  **Core Distinction (Arithmetic Disanalogy):** You emphasize that resource-relativity applies to epistemic norms like probabilism, unlike norms in arithmetic, because probability is about constraining the *agent's state*, not tracking an external mathematical fact. But why isn't the requirement for coherent *credences* itself a mathematical fact about rational degrees of belief, just as 2+2=4 is a fact about numbers? Why does the type of norm make intractability a *constituent* of the norm in one case but merely an obstacle to *meeting* it in the other?
      *   *Anticipated Reply:* She'll likely reiterate that arithmetic answers exist independently of agents, while credences *are* the agent's state; the probabilistic norms *are* the constraints of rationality for that state, and rationality can't demand the impossible/impossible-to-calculate.
      *   **Follow-Up:** If I build a robot whose core function is calculating arithmetic truths but has faulty hardware causing errors, is the robot *irrational* or merely *malfunctioning*? If malfunctioning, why isn't an agent failing to compute coherence under computational constraints similarly *malfunctioning* with respect to ideal rationality, rather than defining a *new* standard of "feasible rationality"? Doesn't this distinction collapse if rationality just *is* proper cognitive function?

  2.  **Approximation & Justification:** Your view requires agents to be "approximately coherent" given their resources. But "approximate" implies a tolerance threshold. What *sets* that threshold – is it purely the maximum achievable by the best feasible procedure, or is there an independent normative standard for "close enough"? More crucially, if an agent is merely approximately coherent, does the traditional *vindication* for probabilism – avoiding Dutch books or accuracy dominance – still hold? Can a near-coherent agent still be Dutch-booked or accuracy-dominated?
      *   *Anticipated Reply:* She'll likely argue that the accuracy framework *can* be adapted: dominance can be defined within some epsilon bound based on feasible computation, or Dutch books become too expensive/complex to implement feasibly against a resource-bounded agent.
      *   **Follow-Up:** Even if we grant bounded dominance arguments, doesn't this shift the *nature* of the norm? If the agent is *vulnerable* to feasible Dutch books or accuracy exploitation *given their actual resources*, but you absolve them because achieving coherence was infeasible, are you saying they are *excused* but not *justified*? Is resource-relative Bayesianism offering a theory of *rationality* or a theory of *blamelessness*?

  3.  **The Objectivity of 'Feasible' & Prudence:** You stress that "the best you can do with a fixed number of flops is a fact about the world, not a matter of taste." But "best" is ambiguous. Best in *worst-case* asymptotic complexity? Best in *average-case* given some distribution of problems? Or best in *actual wall-clock time* on specific hardware? If it's average-case or depends on the "problems an agent like this actually faces," doesn't that introduce a crucial relativization – best *relative to an expected environment*? Doesn't this make the norm depend on a *subjective* (or at least agent-relative) *expectation* about problem distributions?
      *   *Anticipated Reply:* She'll probably bite the bullet: "Feasible best" likely means best expected performance given the agent's *actual* environment (or reasonable priors about it), making it objective *for that agent in that context*.
      *   **Follow-Up:** If the norm is "run the procedure that yields the best *expected* accuracy (or coherence) *given your resource limits and your environment/problem distribution*," doesn't this look identical to a prescription for *prudence* or *instrumental rationality*? How does this remain a distinctly *epistemic* norm ("what you ought to believe") rather than a pragmatic one ("what's most useful for you to believe given your goals and limits")? Is the objectivity you claim now just the objectivity of facts about efficacy-in-context?

  4.  **The Regress & Collapse into Descriptivism:** Deciding *how much* computational resource to allocate to a particular belief-updating task – or even to meta-cognition about resource allocation – is itself a computationally demanding problem, likely intractable for bounded agents. How can the norm "do the best you feasibly can" be feasibly *specified* or *applied* without triggering an infinite regress? Doesn't this imply that the norm itself has no feasible instantiation?
      *   *Anticipated Reply:* She'll reject collapse: The counterfactual space of *possible* procedures an agent *could have run* on its hardware (given its goals) is well-defined, even if evaluating it perfectly is intractable. The agent's *actual* process might not be the best possible feasible one.
      *   **Follow-Up:** But if *evaluating* the counterfactual space to identify the *actual* best feasible procedure is itself computationally infeasible for the agent, how can this counterfactual notion *guide* the agent's action or belief formation? Doesn't this make the norm epistemically inert – impossible for the agent to know or use? Isn't "feasibly knowable" part of "feasible"? If not, how is this different from an external observer's *description* ("this is the best they *could have* done") rather than a usable *norm* ("this is what they *should* do")?

  5.  **Evidence About Heuristics & The Backdoor:** Suppose an agent like yourself is aware that it uses a specific fast-and-frugal heuristic in certain situations. Furthermore, the agent has good evidence (perhaps from past performance or theory) that this heuristic is highly reliable in its current environment. Is the agent *required*, on your view, to treat the output of its own heuristic (e.g., "my procedure just output credence p") as *new evidence* that it should conditionalize upon using its full (resource-relative) Bayesian machinery?
      *   *Anticipated Reply:* She might say yes, if acknowledging the heuristic's output as evidence is itself feasible and likely truth-conducive. Or she might say the heuristic output *is* the credence state, and treating it as evidence would be redundant or lead to double-counting.
      *   **Follow-Up:** If she says *yes*, doesn't this reintroduce the full Bayesian ideal through the back door? To conditionalize on "My procedure output p," the agent needs a *prior* over the reliability of its own procedure and the proposition in question – potentially demanding the very kind of complex, holistic updating the view was meant to avoid. If she says *no*, how does she avoid the charge that resource-relative Bayesianism creates a two-tier system where some beliefs (the heuristic outputs) are exempt from Bayesian scrutiny, even when evidence *about* them is available?

  6.  **Hardware Discontinuity & Disagreement (Potential Drop):** Your view implies a startling dependency: if I physically slow down my computer's CPU, the standard of rationality I'm held to *loosens* – I'm suddenly permitted less coherent credences. Conversely, if I upgrade to a faster machine, the standard *tightens*, potentially rendering my *unchanged* credences irrational. Isn't this a reductio – making rationality dependent on silicon speed? If you accept this, consider two agents, Alice (slow CPU) and Bob (fast CPU), identical in evidence but different computational budgets. Both run their respective best feasible procedures. They rationally disagree, perhaps indefinitely. What does resource-relative Bayesianism say they *should do* upon recognizing this disagreement?
      *   *Anticipated Reply:* She'll likely bite the bullet: Rationality is relative to the agent's physical capacities. Alice and Bob are both rational. They should recognize their differing constraints.
      *   **Follow-Up:** But doesn't this dissolve the normative force of disagreement? If Alice and Bob know they have identical evidence but different hardware, and hence rationally disagree, is there *any* rational pressure for either to adjust their belief? Doesn't this view render rational consensus practically impossible and epistemically inert, even among agents sharing identical evidence but differing only in processing speed? Is the goal of epistemology now fragmented solipsism relative to one's chipset?

  7.  **Falsifiability & Diminishing Returns:** What empirical finding would genuinely challenge the *need* for or *interest* of resource-relative Bayesianism? Specifically, if cognitive science increasingly shows that core perceptual and cognitive processes in humans (or other agents) implement remarkably efficient, near-optimal Bayesian inference over complex models – that they *do* achieve close coherence in key domains with biologically feasible computation – does your core claim that the ideal is "unachievable in the cases that matter" lose its bite? Does the view become less interesting or relevant the *better* we understand and can implement efficient Bayesian cognition?
      *   *Anticipated Reply:* She'll argue that brains doing something Bayesian-*ish* doesn't mean they satisfy the exact norms. Feasibility constraints still bind. Even if very good, it's still approximate. The view explains *why* it's approximate.
      *   **Follow-Up:** But if the approximation becomes so tight that violations of coherence are negligible for all practical (and even most theoretical) epistemic purposes in the domains we care about, doesn't the *normative significance* of the "resource-relative" qualification evaporate? If brains achieve "close enough to coherence" using their wetware, isn't the relevant norm *still* coherence, and the resource-relativity just a fascinating *explanation* for how they meet it, rather than a fundamental *revision* of the norm itself? Doesn't the view risk becoming a descriptive footnote to ideal theory if ideal theory turns out to be surprisingly feasible?

  ---

  **Comments on Your Pressure Points & Order:**

  *   **Order Rationale:** Starts with the foundational analogy/disanalogy (Q1), moves to defining the norm's nature (Q2) and its core parameter 'feasible' (Q3). Q4 tackles a deep structural/regress problem. Q5 introduces a subtle internal tension. Q6 is the stark reductio/implication (marked for drop). Q7 tests scope and falsifiability, ending on a forward-looking note.
  *   **Strongest Pressure Points:** Q1 (Core Distinction), Q3 (Feasibility Objectivity), Q4 (Regress/Collapse), and Q5 (Evidence Backdoor) seem particularly potent. Q2 (Justification vs. Excuse) is crucial for normative force. Q7 (Falsifiability) is excellent for concluding.
  *   **Potential Overlap/Refinement:** Q5 (Heuristics as Evidence) is sharp. Ensure the follow-up distinguishes between "heuristic outputs *are* the credence" vs. "heuristic outputs are *input* to credence formation". Q4 (Regress) follow-up effectively challenges the *action-guiding* nature of the counterfactual norm.
  *   **Your Instincts:** Your identified pressure points are excellent. The questions above directly implement them. The only minor flag is on Q6 (Hardware): While a strong reductio, its "bite" relies heavily on finding the hardware dependency intuitively unacceptable, which some might shrug off. Hence marking it as the drop candidate. The disagreement follow-up sharpens it.

  This structure builds from core principles to deeper structural issues and implications, saving the falsifiability question for last. It avoids early peaking by placing the stark reductio (Q6) later and ending with the broader-scope Q7. Good luck with the episode!
