  **(Raises glass, warm smile, address the room)**
  Miriam Halloran hasn’t retired from curiosity. She’s just changing labs. Tonight, we celebrate forty springs of stubborn questions, sharp insights, and a mind that saw the same shape hidden in two seemingly distant worlds.

  Many of us remember [that chaotic lab incident years ago - maybe spilled reagents, a prototype strand synthesizer acting up, or a whiteboard covered in frantic symbols]. Amidst the mess, Miriam saw order. She saw a strand – a string of letters – being read. Not once, but *twice*. Read as a string of physical units, inert, to be manipulated. And simultaneously read as a sequence dictating *what* manipulation should occur. This double reading, she insisted, wasn’t just *like* something else. It *was* the same structure Kurt Gödel used. Gödel needed a way for a sentence to point directly at its own inscription inside a system of rules. He found it by making the system read its own symbols twice: once as a formula, and once as a name pointing back to that very formula. A strand, Miriam argued, does the same inherent double duty: physical material *and* directive for action. The difference? Gödel’s construct *says* something. The strand *does* something. One points, the other builds. That’s the core: the same knot of self-pointing, realized differently.

  Lately, she turned her gaze closer to the wet, messy reality the molecular biologists know so well. In her final seminar, she proposed relaxing the rules. What if the operations dictated by a strand weren’t perfectly deterministic? What if applying its enzyme resulted, not in an exact duplicate, but in something *close enough* – something within a few edits? Replication, she suggested then, is this: self-reference where perfect identity gives way to persistence. Where ‘the same’ allows for near misses. It’s where her analogy truly earns its keep, she felt, reflecting the noisy fidelity of a living cell. [Insert specific, warm anecdote about her interaction with molecular biology colleagues or a relevant lab moment - e.g., "Like that time she spent weeks arguing with Dr. Chen from Bio about error rates, not to win, but to *see* the constraints."]

  Now, I’ve stood in this particular current. I see the power of the double reading – it’s brilliant, undeniable. That strand *is* read two ways at once; Gödel *did* exploit precisely that fold. Logicians here will nod: the mapping’s many-to-one nature and the irreversibility of the operations are key. They ensure the system can’t trivially ‘unmake’ itself, forcing genuine self-description onto the strand. It’s a structure demanding self-confrontation. But when we loosen the identity condition? When near-enough counts? Here, Miriam and I part company, respectfully. Gödel’s sentence hangs on exact correspondence; the code *must* be invertible to guarantee the self-reference is literal, not suggestive. Relaxing that, I think, shifts us from a sentence pointing at itself to a process that reliably *reconstitutes* something like itself – a different phenomenon borrowing the first one’s clothes. It’s a testament to the force of her thinking that the fiercest arguments it sparks come from those she taught to see most clearly.

  Her granddaughter, [Child's Name], asked me last week, “What did Grandma *do* all day?” I told her Grandma spent forty years showing people that sometimes, two things that look completely different – like instructions for building a machine and the machine itself, or a sentence talking about words and the words it’s made of – are actually built around the exact same clever trick. That trick is like finding a way for a set of instructions to accidentally include directions for making *another copy of those same instructions*. Grandma showed how that trick isn’t just magic in stories; it’s hiding inside real things, like how living things make more living things. [Child's Name] thought about it, then asked, “So… she found secret twins?” Close enough, [Child's Name]. Close enough for biology, and for a brilliant career.

  Miriam banned certain words tonight – words she felt blurred the reality into metaphor. So let’s not say her work was a blueprint, or a language, or a program. Let’s say this: she saw a deep pattern in the fabric of reasoning and in the stuff of life. She insisted they were threads of the same weave. She challenged us to see it too, even when we saw differently. She demanded rigor, welcomed argument, and built a legacy not just in theorems and test tubes, but in the minds she shaped. Her work was, and is, a persistent strand, read two ways: as a formidable body of thought, and as an invitation to keep looking, keep questioning, keep finding the twins.

  So, raise your glasses – to Miriam Halloran! To forty years of double readings, stubborn insights, and the structure she saw twice. May her next strand be long, fascinating, and full of unexpected folds!

  **(Clink!)**

