prompt: |-
  You are a research strategist with deep expertise in alignment theory, game theory, and formal epistemology, and I want you to think carefully before answering — spend a few paragraphs up front laying out candidate framings of the problem space and explicitly rejecting the ones you think are wrong, then commit to an ordering and defend it.

  Here is the situation. I sit on the program committee of a small philanthropic fund that has to decide, this winter, whether debate-style scalable oversight deserves to be one of three pillars of its next portfolio. (Quick gloss, so we agree on the object: two agents are assigned fixed opposing answers to a question, they take turns making short statements, a weaker judge — a human, or a model we are trying to improve — picks the winner, and training rewards only winning, not honesty.) The budget we control is roughly six to eight researcher-years over two years, and the constraint that matters is that our grantees will have no frontier-scale training access: they can run experiments with open-weight models and do theory, but they cannot settle questions empirically at the scale where the interesting failure modes are thought to appear. So the question I want answered is not "is debate a good idea" but: given that budget and that constraint, which four or five open questions should this money actually buy progress on, and in what order, and why?

  To make this concrete, here are the candidate directions currently on our whiteboard, some of which I suspect are overrated. (1) A taxonomy of obfuscation: separating *logical* obfuscation (an invalid step buried in a long derivation) from *empirical* obfuscation (a false premise buried in a chain of individually plausible, individually checkable claims) from *pragmatic* obfuscation (argument shaped to exploit judge heuristics rather than judge reasoning) — and then asking which type is actually the binding constraint, and whether the standard remedies (cross-examination, bounded proof length, a "verification tax" requiring each claim to carry a pointer to a machine-checkable artifact that the judge samples at random) are aimed at the right one. (2) The precedent-library question: real deployment isn't one-shot, it's a long stream, and adjudicated sub-questions could be cached and cited in later debates; does an accumulating body of precedent make deception cheaper (a falsehood spread across a chain of citations, each audited long ago by a weaker judge) or more expensive (the liar must now stay consistent with a growing public record)? (3) The steelman-swap variant: rather than having each debater defend its own assigned answer, require each to construct the strongest possible case for the *opponent's* answer, with roles assigned at random after the arguments are submitted, so that the winner is whoever produced the better case for a position they didn't choose — does this remove the structural asymmetry in which the dishonest side may pick the single most convincing available false argument while the honest side must locate the specific flaw? (4) The bootstrapping question: when the judge is itself the system whose reliability we are trying to improve, what do the equilibria look like — convergence, oscillation, collapse — and is there a formal version of the worry that you cannot bootstrap oversight of a reasoner from that same reasoner? (5) The task-structure question: what fraction of alignment-relevant oversight tasks have a "hard to produce, easy to check" profile (does this patch contain a backdoor? is this claimed result reproducible?) versus being irreducibly contestable (is this policy argument sound?), and can we characterize the split in terms of the existence of short certificates rather than by intuition? (6) The consolidation question: is debate genuinely a distinct mechanism from other scalable-oversight schemes — recursive reward modeling, forecasting or prediction tournaments, setups where a model both proposes and critiques — or is it a special case of one of them, and does the answer change what we fund?

  Please give me a dependency-aware prioritization of roughly four questions (yours, not necessarily mine — feel free to merge, replace, or cut any of the six, and to add ones I haven't listed). For each: what makes it upstream of the others, how tractable it is for people doing theory plus small-scale experiments rather than frontier empirical work, how neglected it is relative to its importance, and what concrete result — a theorem, a clean counterexample in a toy formal model, an experiment on small models — would in eighteen months move it up or down the list. I also want the trade-offs made explicit: name at least one question you are recommending *against* funding despite its genuine importance, and say why it fails on one of your criteria. Finally, if you had to put sixty percent of the fund behind a single question on an inside view, which would it be, and what would have to be true for that bet to pay off? Do not give me a literature review or a survey of who has argued what — I want a defended agenda with your own reasoning exposed, and flag honestly wherever your ordering depends on empirical facts we currently have no way to obtain.
reasoning: |-
  Okay, the user is a research strategist on a philanthropic fund's program committee. They need to prioritize which open questions in debate-style scalable oversight to fund, given constraints of limited budget and no frontier-scale training access. The user provided six candidate directions but wants me to merge, replace, or cut as needed and prioritize four or five based on dependency, tractability, neglectedness, and concrete outcomes.

  First, I need to understand the core constraints: 6-8 researcher-years over two years, no frontier model access. So empirical work must use open-weight models or simulations. The key is prioritizing questions that are foundational and can be answered with theory or small-scale experiments.

  Looking at their six questions:

  1. Obfuscation taxonomy: logical, empirical, pragmatic. Important but maybe too detailed? Could be part of a larger robustness question.
  2. Precedent-library: dynamic aspects of repeated debates. Interesting but might depend on understanding single-debate failures first.
  3. Steelman-swap: a variant to fix asymmetry. Novel but untested; might be premature without understanding basic debate mechanics.
  4. Bootstrapping: judge improvement via debate. Core to scalability but highly complex.
  5. Task-structure: "hard to produce, easy to check" vs. contestable tasks. Foundational for applicability.
  6. Consolidation: is debate distinct? More meta; might not directly advance debate itself.

  The user wants dependency-aware prioritization. So upstream questions first. What's the most fundamental? Probably understanding when debate fails (obfuscation) and what tasks it suits (task-structure). Bootstrapping is critical for scalability but might depend on single-debate success. Precedent and variants like steelman-swap depend on basic mechanisms working.

  Tractability matters. Task-structure can use formal analysis and small experiments (e.g., MNIST debates). Obfuscation taxonomy might need adversarial training in small models. Bootstrapping is harder to test without scale. Steelman-swap is easy to test in sims but less impactful if base debate is flawed.

  Neglectedness: Bootstrapping is understudied relative to its importance. Task-structure has some work but not enough on alignment-relevant tasks. Precedent libraries are less explored. Consolidation is discussed but maybe not urgent.

  Concrete outcomes: For each priority, what result in 18 months? The user wants theorems, counterexamples, small experiments. 

  Trade-offs: Need to drop one important question. Steelman-swap is interesting but not upstream; it's a variant. Precedent might be deferred.

  Inside view bet: If I put 60% on one, which? Bootstrapping is high-risk but high-reward if it works. Task-structure is safer and foundational. But bootstrapping's scalability is crucial. If bootstrapping fails, debate might be dead. So maybe that's the key.

  New merged questions: Combine obfuscation and task-structure into "robustness under adversarial optimization." Add bootstrapping as second. Then precedent dynamics. Finally, variants like steelman as optional.

  Prioritization:
  1. Task-structure and robustness (merged): because it determines if debate works for alignment tasks. Tractability: formal criteria and small experiments. Neglected for alignment-specific tasks. Outcome: formal classification of tasks where debate helps.
  2. Bootstrapping: upstream for scalability. Tractability: theory and simple simulations. Neglected. Outcome: convergence/divergence conditions.
  3. Precedent dynamics: builds on single-debate success. Tractability: graph models and small experiments. Outcome: conditions where precedent helps/hurts.
  4. Variants (steelman-swap): lower priority, test after basics.

  Cut consolidation: important but not urgent; doesn't directly improve debate.

  Inside bet: 60% on bootstrapping. Pays off if we find conditions where bootstrapping converges, or identify showstoppers early.

  Dependencies: Task-structure before robustness variants. Bootstrapping depends on single-debate understanding. Precedent depends on both.

  Trade-off: Against funding steelman-swap now. Important for asymmetry but premature without knowing base failure modes.
answer: |-
  Below is a rigorously prioritized research agenda for your fund, grounded in alignment theory, game theory, and formal epistemology. I’ll first outline candidate framings, reject flawed approaches, commit to an ordering, and defend it against your constraints. The prioritization weights **dependency** (how upstream a question is), **tractability** (feasibility without frontier-scale models), **neglectedness** (gap between importance and current effort), and **concrete 18-month deliverables**. I merge/cut two of your six directions and add one critical missing piece.

  ### Rejected Framings (and Why)
  - **"Is debate distinct?" (Your #6)**: Overrated meta-question. Debate *is* structurally unique: it’s adversarial optimization of a judge’s belief update under constrained communication, differing from recursive reward modeling (non-adversarial) or forecasting (non-argumentative). But proving formal equivalence/divergence is a **distraction**—it doesn’t illuminate debate’s failure modes or improve its safety. *Rejected* as low-priority for funding.
  - **"Steelman-swap variants" (Your #3)**: Intriguing but premature. This assumes the core debate mechanics work and only addresses asymmetry in honesty incentives. However, if obfuscation or bootstrapping failures dominate, swapping roles won’t help. It’s downstream, tractable for small experiments (e.g., testing on TruthfulQA), but not upstream. *Rejected* for now—treat as an optional add-on if core questions resolve positively.
  - **"Pure obfuscation taxonomies" (Your #1)**: Valuable but myopic. Classifying obfuscation types is descriptive, not prescriptive. Logical/empirical/pragmatic distinctions blur in practice (e.g., pragmatic tricks exploit logical gaps). Funding a taxonomy risks academic output without actionable fixes. Instead, I merge this with task-structure into a unified robustness question.

  ### Committed Prioritization (4 Questions, Dependency-Ordered)
  **Core Insight**: Debate’s viability hinges on whether it *robustly elicits truth* despite optimized adversaries. Thus, we start with **when it works** (task-structure/robustness), then **how it scales** (bootstrapping), then **long-term dynamics** (precedents). All leverage theory + open-weight models.

  1. **Task-Structure Robustness (Merges Your #1 + #5)**  
     *What alignment-relevant tasks admit "short certificates" for low-judge-effort verification, and how do optimized debaters exploit or defend against judge vulnerabilities?*  
     - **Why upstream?** Until we know which tasks debate can handle, other questions are moot. Combines your #5 (task profiles) and #1 (obfuscation) into one robustness inquiry.  
     - **Tractability**: Ideal for theory + small experiments. Use open-weight models (e.g., Llama-3) on synthetic tasks:  
       - *Easy*: "Hard-to-produce/easy-to-check" tasks (e.g., verify a cryptographic proof).  
       - *Hard*: "Contestable" tasks (e.g., "Is this policy fair?").  
       Formalize "short certificates" (NP-like decision complexity) vs. heuristic-driven judgment.  
     - **Neglectedness**: Task applicability is discussed intuitively (e.g., by Irving et al.), but lacks formal characterization for alignment-critical tasks. Low empirical work on judge exploitability.  
     - **18-Month Deliverable**: A theorem linking debate success to certificate length + judge hardness, plus small-model experiments showing obfuscation success/failure rates across task types (e.g., MNIST adversarial debates with human judges). *Move down if* experiments show *all* alignment-relevant tasks are contestable.  
     - **Dependency**: Informs everything—bootstrapping, precedents, and variants.

  2. **Bootstrapping Equilibria (Your #4, Expanded)**  
     *Can a weak judge improve through repeated debate without collapsing into deception or oscillation, and under what formal conditions?*  
     - **Why next?** Scalability is debate’s raison d’être. If bootstrapping fails, debate is useless for frontier models.  
     - **Tractability**: Theory-heavy (dynamical systems/game theory) + lightweight sims. Model judges as Bayesian learners with bounded rationality; debaters as gradient-based optimizers. Test with iterated student debates (e.g., GPT-4 judging GPT-2 debaters).  
     - **Neglectedness**: Critical but underexplored. Most work assumes a static judge (e.g., the AI Debate paper). Christiano’s "iterated amplification" touches this but not debate-specific dynamics.  
     - **18-Month Deliverable**: A convergence theorem for judge error rates under debater optimization (e.g., "if judge hardness > X, error decays exponentially"), plus oscillation/collapse counterexamples in sims. *Move up if* task-structure shows debate works for simple tasks.  
     - **Dependency**: Requires #1 to define "success" for the judge.

  3. **Precedent Dynamics (Your #2, Reframed)**  
     *Does an accumulating body of precedents make deception harder (consistency constraints) or easier (obfuscation via citation chains), and can we design incentive-compatible caching?*  
     - **Why here?** Only matters if single-round debate (#1) and bootstrapping (#2) are functional. Addresses real-world deployment but is downstream.  
     - **Tractability**: Graph-based theory (precedents as nodes in a DAG) + small experiments. Simulate citation networks with open models (e.g., debaters build claims linking to cached "facts").  
     - **Neglectedness**: Barely studied—most debate work is one-shot. Closest analogs are logical knowledge bases (e.g., in mathlib), but not adversarial.  
     - **18-Month Deliverable**: A game-theoretic model showing deception cost vs. precedent growth rate, plus an experiment where "citation audits" in small models reduce errors by X%. *Move down if* bootstrapping fails.  

  4. **Adversarial Optimization Boundaries (New Question)**  
     *What are the information-theoretic limits of debate under optimized adversaries? When do debaters inevitably "win" by exploiting judges?*  
     - **Why added?** Your list omits fundamental limits. This generalizes obfuscation concerns to min-max bounds.  
     - **Tractability**: Pure theory (e.g., extending Druck et al.’s debate as finite automata) + impossibility proofs. Lightweight experiments to test bounds (e.g., optimize debaters against heuristic judges).  
     - **Neglectedness**: Highly neglected—most work focuses on potentials, not limits.  
     - **18-Month Deliverable**: An impossibility theorem (e.g., "no debate protocol with judge runtime O(n) can detect deception in problem class Y") or robustness bounds for judge error.  

  ### Explicit Trade-offs and Funding Allocation
  - **Defund Despite Importance**: **Steelman-swap (#3)**. While it addresses honesty incentives, it’s not upstream. If task-structure (#1) shows debate fails on contestable tasks, or bootstrapping (#2) collapses, steelman-swap is irrelevant. It’s tractable but low-priority without foundations.  
  - **Inside View Bet (60% on One Question)**: **Bootstrapping Equilibria (#2)**.  
    - **Why?** If bootstrapping works, debate scales; if not, it’s a dead end. This is the crux for real-world impact.  
    - **Pays Off If**:  
      1. Convergence is *possible* theoretically (e.g., with judge error decaying under iterated training).  
      2. Small experiments show no catastrophic divergence (e.g., judge accuracy plateaus >70%).  
    - **Risks**: Depends on #1’s outcomes. If task-structure shows no "easy" alignment tasks, bootstrapping may fail—but we’d learn quickly.  

  ### Unknown Dependencies
  - **Judge Hardness**: Progress on #1 and #2 assumes human judges (or weak AI judges) have *some* capacity to detect deception. If experiments show humans are universally exploitable even in simple tasks, debate fails—but we lack this data.  
  - **Adversarial Generalization**: Small-model experiments (#1, #4) may not extrapolate to frontier models. Theory must dominate here.  

  ### Summary: The Agenda
  | Rank | Question | % Fund | Key Outcome by 18mo |
  |------|----------|--------|----------------------|
  | 1 | Task-Structure Robustness | 20% | Formal task classification + obfuscation exploit rates in small models |
  | 2 | Bootstrapping Equilibria | 60% | Convergence theorem + oscillation thresholds in sims |
  | 3 | Precedent Dynamics | 10% | Game-theoretic model of deception costs |
  | 4 | Adversarial Optimization Boundaries | 10% | Impossibility theorem or robustness bounds |

  This ordering maximizes leverage: if #1/#2 fail, we avoid wasting resources on #3/#4. It’s executable within budget (e.g., 4 researchers on bootstrapping, 1–2 on others) and uses your constraints as strengths—forcing theory and frugal experiments. I’d stake the fund on bootstrapping because scalable oversight *requires* it to work.
