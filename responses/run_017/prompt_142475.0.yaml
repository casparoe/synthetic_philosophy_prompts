  ### Decision Tree for Fitch's Paradox of Knowability  
  *Use this quiz to navigate your way out of the paradox. Answer based on intuition, not prior knowledge.*

  ---

  **Q1: Do you accept the knowability principle?**  
  *(i.e., "Every truth could in principle be known.")*  
  - **A: No** → **Leaf 1: Reject Knowability Principle**  
    - *Type:* Realist  
    - *Awkward commitment:* Some truths are *fundamentally unknowable* (e.g., facts about distant galaxies or unobservable past events).  
  - **B: Yes** → Go to Q2.

  ---

  **Q2: Must a "sealed room" truth be knowable?**  
  *(e.g., A coin was flipped in a sealed room in 1823 and melted in 1850. Nobody observed it. Is this truth knowable?)*  
  - **A: No** → **Leaf 2: Restricted Knowability**  
    - *Type:* **Verificationist leanings** (truths without observable traces aren't "truths" in the same way).  
    - *Awkward commitment:* Truths about the *past* or *unobserved events* aren't fully "real" or are exempt from knowability.  
  - **B: Yes** → Go to Q3.

  ---

  **Q3: Does "could be known" require an *actual* knower?**  
  *(e.g., "2 + 2 = 4" is knowable by humans. What about a truth requiring a mind with infinite lifespan?)*  
  - **A: Yes** → **Leaf 3: Actual Knower Requirement**  
    - *Type:* Realist  
    - *Awkward commitment:* Truths requiring impossible knowers (e.g., immortal beings) are *unknowable* and possibly not truths.  
  - **B: No** → Go to Q4.

  ---

  **Q4: Is an "unwritable" truth knowable?**  
  *(e.g., A truth too long to write down before the heat death of the universe, but in principle expressible.)*  
  - **A: No** → **Leaf 4: Finite Knowability**  
    - *Type:* Realist  
    - *Awkward commitment:* Some truths are *too complex* to be known, even by ideal beings.  
  - **B: Yes** → Go to Q5.

  ---

  **Q5: If a conjunction is known, must each part be known?**  
  *(e.g., If you know "P and Q", must you know P and know Q separately?)*  
  - **A: No** → **Leaf 5: Reject Knowledge Distribution**  
    - *Type:* Realist  
    - *Awkward commitment:* You can know a compound fact *without knowing its obvious parts* (e.g., know "It’s raining and I don’t know it" without knowing it’s raining).  
  - **B: Yes** → Go to Q6.

  ---

  **Q6: Does knowing something include knowing what it entails?**  
  *(e.g., If you know "P", and P obviously entails "Q", must you know "Q"?)*  
  - **A: No** → **Leaf 6: Reject Epistemic Closure**  
    - *Type:* Realist  
    - *Awkward commitment:* You can know P *and* know P entails Q, yet *not know Q*.  
  - **B: Yes** → Go to Q7.

  ---

  **Q7: Which premise would you drop to avoid absurdity?**  
  *(Fitch's paradox forces a contradiction. Sacrifice one:)*  
  - **A: Knowability Principle** → **Leaf 1: Reject Knowability Principle** (as above).  
  - **B: Knowledge Distribution Rule** → **Leaf 5: Reject Knowledge Distribution** (as above).  
  - **C: Factivity/Closure** → **Leaf 7: Reject Factivity or Closure**  
    - *Type:* **Non-realist** (slips into idealism)  
    - *Awkward commitment:* Knowledge *doesn’t guarantee truth* (if rejecting factivity) OR obvious inferences *don’t preserve knowledge* (if rejecting closure).  

  ---

  ### Summary of Leaves  
  | **Leaf**                     | **Position**                 | **Type**              | **Awkward Commitment**                                      |  
  |-------------------------------|------------------------------|-----------------------|-------------------------------------------------------------|  
  | 1. Reject Knowability        | Standard Realism             | Realist               | Some truths are *fundamentally unknowable*.                 |  
  | 2. Restricted Knowability    | Contextual Anti-Realism      | Verificationist       | Truths without traces *aren’t fully "true"*.                |  
  | 3. Actual Knower Requirement | Human-Limited Realism        | Realist               | Truths requiring impossible knowers *might not exist*.      |  
  | 4. Finite Knowability        | Computational Realism        | Realist               | Some truths are *too complex* to be known.                  |  
  | 5. Reject Knowledge Distribution | Non-Compositional Knowledge | Realist               | Know conjunctions *without knowing their parts*.            |  
  | 6. Reject Epistemic Closure  | Causal/Contextual Knowledge  | Realist               | Fail to know *obvious consequences* of what you know.       |  
  | 7. Reject Factivity/Closure  | Non-Factive Knowledge        | **Idealist**          | Knowledge *can be false* or *not closed under logic*.       |  

  ---

  ### Key Notes  
  1. **Realist vs. Non-Realist**:  
     - All leaves **except 2 and 7** are realist (they preserve mind-independent truth).  
     - Leaf 2 (Restricted Knowability) leans into **verificationism**.  
     - Leaf 7 (Reject Factivity/Closure) leans into **idealism** (truth depends on knowability).  

  2. **Unseparated Leaves**:  
     - **Leaf 1** (Reject Knowability) appears in Q1A and Q7A. Both paths lead to the same realist position.  
     - **Leaf 5** (Reject Distribution) appears in Q5A and Q7B. These are identical.  

  3. **Undefended Combinations**:  
     - **Path Q1B → Q2B → Q3B → Q4B → Q5B → Q6B → Q7C** (Reject Factivity/Closure):  
       - *Why undefended?* Rejecting factivity ("knowledge implies truth") is **incoherent** to most. It collapses the definition of knowledge.  
     - **Path Q1B → Q2A** (Restricted Knowability after insisting on knowability):  
       - *Why undefended?* **Unattractive**: Restricting knowability *after* claiming all truths are knowable feels ad hoc.  

  4. **Why Leaf 7 is Rare**:  
     - Rejecting factivity (knowledge ≠ truth) or closure (knowledge ≠ logical deduction) **undermines science and logic**. Few bite this bullet.  

  ---

  ### How to Use  
  1. Start at Q1 and answer honestly.  
  2. Follow branches until you hit a leaf.  
  3. Compare leaves with your friends—see who’s a realist, who’s sliding into anti-realism, and who’s stuck with the weirdest commitment!  

  No reading required—just a whiteboard and your intuitions. Good luck! 🧠💥
