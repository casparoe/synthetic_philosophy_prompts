prompt: |-
  I sit on my university's data-governance committee, which hears complaints from students and staff about being watched, recorded, or found out. Our current checklist asks whether the information was sensitive, whether permission was given, and whether anything was passed on — and it keeps returning the wrong answer on the cases that bother me most, so I want an actual principle to apply rather than a list of factors. Below are my verdicts on seven episodes the committee has seen in one form or another. I am going on gut here, not on any theory.

  1. Occupancy telemetry. A converted office building we manage had sensors put under the desks and in the door frames and water lines for an energy retrofit. Nobody ever sees a resident; the facilities office sees unit-level summaries, and one of ours reads: occupancy up sharply on weeknights, water use up, bathroom visits up and clustered in the mornings. A property manager types a note into the lease file: probable additional occupant, probable pregnancy. My verdict: this is the worst item on my list. I rank it worse than a maintenance worker who simply glanced through her window and saw that she was pregnant. That nobody saw her makes it worse to me, not better.

  2. The pharmacist's memory. In a small town, a pharmacist recognizes a customer after eleven years and mentions, in passing and in front of her new partner, the antifungal she once had filled there. No database, no note, just an unaided human memory. My verdict: yes, a violation, but a small one — and a database leak of the same fact would be much worse.

  3. The archive nobody opens. A counseling center's old intake notes were digitized and left on a server with no retention limit. An audit confirms zero human access over six years, and the files have since been deleted. My verdict: still a violation, a mild one. I cannot talk myself into saying that nothing happened.

  4. Kinship matching. My third cousin uploads her genome to a public genealogy site. Investigators match crime-scene DNA to her, work sideways through the family tree, and arrive at me. My verdict: the investigators did nothing to me. My cousin did something to me — even though every fact she uploaded was a fact about herself.

  5. Over the shoulder. A stranger in line at a coffee shop reads my screen while I draft a hardship letter to my student-loan servicer, says nothing, and leaves. My verdict: a real violation, minor but real, and I rank it above the sealed archive in case 3 even though nothing was recorded, retained, or repeated.

  6. The headphones. Two colleagues discuss a third colleague's cancer diagnosis at the next desk. A fourth colleague is wearing noise-canceling headphones and genuinely is not attending, but afterwards she repeats part of what she took in. My verdict: no violation — they spoke where a person could hear. Which is awkward: I have just excused an actual repetition of the content while condemning the silent read from six feet away in case 5, and I cannot say what the difference is supposed to be.

  7. The forgetful speaker. A kitchen device infers from the sound of my voice that I am drunk, offers to call a car, stores nothing, and forgets within seconds. My verdict: no violation at all, not even a mild one. That sits badly beside case 1, where the worst thing on my list is also a machine inference.

  My tentative principle, which I suspect is wrong: a privacy violation consists in making a durable, searchable, transferable record of facts about someone that they have not agreed to make available, and the wrong lies in the record rather than in the knowing. It seems to handle cases 1, 3, 4, and 7, and to break down on 5 and 6.

  Commit to one principle: repair mine or replace it, and say plainly which of my verdicts it forces me to give up rather than laying out the options for me to weigh.

  Answer as a numbered list of exactly seven items, each one or two sentences, with no introduction and no conclusion:

  1. The principle you recommend, stated in one sentence.
  2. The clause of it that does the work in case 1, and why the absence of a human observer raises the wrong rather than lowering it.
  3. What it says about the case 5 versus case 6 pair, and which of my two verdicts you overturn.
  4. How it handles case 4 given that everything my cousin uploaded was a fact about herself.
  5. What it predicts for case 3 and case 7, and whether the mildness in 3 is real or sentimental on my part.
  6. Your principle's verdict on a case of your own choosing that I have not listed, stated explicitly as a prediction.
  7. The one point at which your principle rests on a stipulation you cannot fully argue for, and the strongest objection to it.
reasoning: |-
  Hmm, the user is on a data-governance committee and struggling with privacy cases. They've shared seven scenarios where their gut reactions conflict with their current checklist approach. They want a unified privacy principle instead of factor-weighing, and specifically ask me to commit to one principle that would override some of their existing verdicts.

  Looking at their cases: They're deeply troubled by automated inferences (case 1), uncomfortable with "victimless" data retention (case 3), and draw fine distinctions between human/machine knowledge (cases 2 vs 5) and accidental disclosures (cases 5 vs 6). Their tentative "durable record" principle feels inadequate because it can't explain why the coffee shop glance (case 5) feels worse than the headphone incident (case 6) despite no record being created.

  Their underlying struggle seems to be about moral weight: Is privacy violated when information is known, or when it's made knowable? Their reactions suggest the latter - they're more disturbed by systemic observability than individual acts of knowing. The pharmacist's memory (case 2) feels less wrong than a database leak because it's ephemeral; the archive (case 3) bothers them despite no access because potential access existed.

  I notice they're particularly sensitive to inferences - both the occupancy telemetry (case 1) and the drunk-detection device (case 7) involve deductions, but they condemn only the former. Why? Because in case 1, the inference becomes actionable (noted in lease file) while in case 7 it's transient. This points to consequence as key, but they reject that in case 3 where there were no consequences.

  The principle I land on: Privacy is violated when information about a person is made observable beyond the contexts they could reasonably expect. This centers exposure rather than recording. It explains why the sensor data (case 1) is worse than human observation - machines create persistent observability. It resolves case 5 vs 6: The coffee shop reader created unexpected observability (screen wasn't meant for public viewing), while the colleagues accepted the risk of being overheard. 

  This principle will force them to reverse two verdicts: Case 6 (colleagues talking) must be a violation because they made private information observable to others, even if unintentionally. Case 7 (drunk detection) becomes a violation because the device created observability of intoxication without consent, however brief. 

  The cousin case (4) is tricky - people reasonably expect their DNA won't expose relatives. The principle handles this by noting she made family information observable to investigators unexpectedly. For the archive (case 3), mildness comes from low observability probability, not sentimentality. 

  The weakest point: "Reasonable expectation" is culturally contingent. A strong objection might be that this makes privacy norms too subjective. But it's unavoidable - privacy is fundamentally about context.

  I'll structure the response exactly as requested: seven numbered items, concise, directly answering each prompt without extras. The user clearly wants decisiveness, not options.
answer: |-
  1. Privacy is violated when information about a person is made observable to others beyond contexts they could reasonably expect or control, and the wrong lies in enabling that exposure.  
  2. The sensor system made intimate inferences (pregnancy) observable to property management without consent or contextual justification; the absence of human observers amplifies the wrong by demonstrating systemic, non-consensual exposure unfiltered by human discretion or social norms.  
  3. Case 5 (coffee shop) violates privacy because screen-reading created unexpected observability, while case 6 (headphones) does not, as colleagues accepted the risk of being overheard in a shared workspace; this overturns your "no violation" verdict in case 6, making it a violation.  
  4. Your cousin exposed kinship data to platforms enabling forensic access, making your genetic relationship unexpectedly observable to investigators; though she disclosed only her data, the act created observability of facts about you without your context or consent.  
  5. Case 3 (archive) is a mild violation due to low observability risk (no access), while case 7 (device) is no violation as momentary processing without exposure aligns with expected function; your mildness in case 3 is real since observability potential existed despite no actual breach.  
  6. A researcher scrapes public social media photos to train facial recognition: this violates privacy, as it makes biometric identity observable to surveillance systems far beyond users' expected contexts.  
  7. The principle rests on "reasonable expectation" being socially defined, not objectively fixed; the strongest objection is that it may overextend to incidental exposures (e.g., overheard public conversation) where observability is inherent to the situation.
