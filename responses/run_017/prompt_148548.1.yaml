prompt: |-
  You are a veteran examiner in moral and political philosophy. You have chaired pre-university and first-year honours assessment boards for years, and you have a reputation for setting questions that a student cannot answer by reciting definitions, however fluently. I need your help constructing one question for a real assessment, and I would like you to proceed carefully rather than quickly. Please work in three labelled stages before you write anything final.

  Stage 1 — Diagnosis, in note form. List the three or four things a well-prepared student is most likely to say if this topic is set loosely, and for each, one line on why it would be summary rather than argument.

  Stage 2 — Crux. Sketch two or three candidate cruxes for the question. Against each, write one sentence on whether it separates a student who understands the issue from a student who has memorised the labels, and pick one.

  Stage 3 — Deliverables. Only then write the question, the model answer, and the marking scheme.

  Constraints on the deliverables: no bibliography, no citations, no references to authors, titles, or dates anywhere in the materials. The exam is closed-book and closed-device; everything a student needs, including the typology itself, must be stated inside the question paper, since not every candidate will have encountered it before.

  Who I am and what this is for: I am a sixth-form student and I run my school's Philosophy Club. Each spring our club sits a two-hour certificate paper that our faculty advisor reviews, and the senior members mark it under her supervision. The paper is marked out of 25. I want one question, worth the full 25, on the threefold typology of honour, dignity, and victimhood cultures and on whether any one of them is morally superior to the others. I do not want a question that can be answered by writing out what each culture is and then concluding that each has strengths and weaknesses; a candidate who does only that should be capped at roughly 11 out of 25, and I want the scheme to say where exactly that cap bites.

  The scenario I have been mulling over, which I would like built into the question: a co-educational day school of about nine hundred students with a socially mixed catchment. Two years ago, after a series of fights following a football match, the school introduced two things at once: an anonymous reporting app administered by an outside charity, and mandatory restorative circles for anything that gets formally reported. After two years, physical fights have fallen sharply, while formal reports have risen roughly fivefold. About a fifth of the reports concern things that happened online and off campus. Teachers report that students increasingly refuse to apologise to each other face to face and instead say the other person should put it in the app. The counsellor says a small number of students generate a large share of the reports, and that being reported is now spoken of as a defeat in a status competition. Several parents say their sons are being taught to inform rather than to stand up for themselves. A group of older girls says the app is the first thing that has ever protected them from what staff used to dismiss as drama.

  Please build the question so that it contains, in some form, the following four ideas, which I have not seen handled together and which I think are where the real difficulty lies:

  1. The audience-reliability condition. A victimhood mechanism works by recruiting third parties, so its output depends on whether the audience is well informed and unbiased. Candidates should have to say whether a culture whose central mechanism only functions when the audience happens to be reliable can be called morally superior, given that reliability is not under the control of the person using the mechanism, and whether unreliability is a moral defect of the culture or merely bad luck.

  2. The standing-recovery test. In an honour culture the person who has done wrong can restore his standing by a recognised act. Candidates should have to ask whether a mechanism that downgrades someone's standing with no routinised way back can be just, and what this implies about a regime that combines public accusation with no formal finding.

  3. The degeneration thesis. Where status competition has not disappeared but has moved into the reporting system, a victimhood culture may be an honour culture with the fists removed, so that the interesting question is not which culture a school has adopted but which one its mechanisms silently regenerate.

  4. The composability problem. Honour, dignity, and victimhood logics may not combine. Anonymous reporting may raise the perceived cost of a direct, face-to-face apology, so the two reforms in the scenario may each be defensible and jointly self-undermining. Candidates should have to say what this shows about evaluating a culture as a package versus evaluating a mechanism.

  Structure the question in two parts: a short application part worth about 8 marks, in which candidates must locate elements of the scenario within the typology and handle the composability problem; and an essay part worth about 17 marks, asking whether any one of the three cultures is morally superior and requiring candidates to state what would have to be true for their answer to change.

  Then give:

  (a) A model answer of about 700 words, written at the level of a strong seventeen-year-old rather than a journal article. It must take a determinate position rather than surveying options, and it must disambiguate morally superior into at least two distinct axes, since I suspect most of the disagreement in our club comes from people answering different questions without noticing.

  (b) A marking scheme built around five must-hit points, with the marks each is worth summing to 25, and for each point one line on how candidates typically get it wrong. The scheme must name the specific moves an A answer must contain and the specific moves that would hold an answer at a B, so that two markers would broadly agree. Please also state which single omission should cost the most marks and why.
reasoning: |-
  Okay, I need to help this user create a philosophy exam question on honour, dignity, and victimhood cultures. The user is clearly knowledgeable and wants something sophisticated that tests deep understanding rather than rote memorization. 

  First, I should unpack what makes this request special. The user isn't just asking for any question - they want one that forces students to grapple with four specific conceptual challenges in their school scenario. The degeneration thesis point is particularly sharp: can a victimhood system secretly become honour culture in disguise? That's the kind of insight that separates thinkers from reciters.

  Hmm, the user's constraints are quite specific. No citations, closed-book, and must include the typology definitions in the question itself since some students might be new to it. The marking scheme needs to be ultra-precise too - they even want to cap summary-style answers at 11/25. That's strict but fair for testing real philosophical skill.

  I notice the user has clearly identified where weak answers would go wrong. My stage 1 diagnosis should anticipate those canned responses: like students saying "each culture has pros and cons" without examining how they interact destructively in the composability problem. 

  For stage 2 cruxes, I'm considering the reliability of third parties as a key divider. A student who just defines victimhood culture might miss that its moral value depends entirely on whether the audience is fair - which isn't guaranteed. That could be the hinge point between B and A answers.

  The standing-recovery test is another strong crux. In honour culture, you can redeem yourself through ritual; in victimhood systems like this school's app, an accusation might stick forever with no path to rehabilitation. Does that make it inherently unjust? That's the kind of question that reveals whether someone's truly thinking.

  *adjusting approach* 
  The deliverables need special care. The model answer must take a firm stand while disentangling "morally superior" into concrete axes like justice versus harm prevention. And the marking scheme? It'll need to reward engagement with the degeneration thesis most heavily - that's likely the hardest insight. If a student misses that the reporting system might just be digitized honour competition, they've fundamentally misunderstood the scenario.

  *checking user's deeper needs*
  Beyond the exam, I suspect the user wants their Philosophy Club to confront real-world tensions in their school culture. The parent complaints about boys not "standing up for themselves" versus girls feeling protected - that's not just academic. A good question should make students uncomfortable with easy answers.
answer: |-
  Here is a carefully constructed exam question and supporting materials, designed to meet your specifications and test deep engagement with the typology and scenario.

  **Stage 1: Diagnosis (Common Summary Responses & Why They Fall Short)**

  1.  **"Each culture has strengths/weaknesses: honour protects the vulnerable, dignity promotes equality, victimhood protects victims."**
      *   *Why summary:* Asserts attributes without justifying *why* these are strengths/weaknesses in a moral hierarchy or how they interact/conflict in practice (e.g., composability).
  2.  **"Dignity culture is superior because it treats everyone equally under the law."**
      *   *Why summary:* Recites a standard justification without grappling with the scenario's evidence (e.g., app use replacing face-to-face resolution, potential justice deficits) or the audience-reliability problem inherent in *any* third-party system.
  3.  **"Victimhood culture is necessary to protect the marginalised (like the girls)."**
      *   *Why summary:* Treats the girls' testimony as a conclusive moral trump card without examining systemic consequences (degeneration thesis, standing-recovery deficit) or the moral implications of mechanism dependence (audience-reliability).
  4.  **"Honour culture is outdated and leads to violence."**
      *   *Why summary:* Dismisses honour based on one negative aspect (violence) while ignoring its potential for swift justice, standing recovery, and failing to consider if its logic persists in modified forms (degeneration thesis).

  **Stage 2: Crux (Candidate Hinges for Differentiation)**

  1.  **Crux: Does the moral evaluation of a culture depend fundamentally on the reliability and justice of its *mechanisms* in practice (audience reliability, standing recovery), rather than solely on its stated ideals?**
      *   *Separates:* Yes. Memorizers state ideals; thinkers probe *how* the mechanisms function, their failure modes, and inherent moral tensions (e.g., unreliability as a *systemic risk* vs. bad luck, lack of restoration as a *design flaw*).
  2.  **Crux: Can a system explicitly designed to implement one culture (victimhood/dignity via app/circles) functionally degenerate into the logic of another (honour via status competition in reporting), and what does this imply for claims of moral superiority?**
      *   *Separates:* Yes. Memorizers categorize the initial reforms; thinkers recognize the *dynamic transformation* of social practices and status competition, forcing evaluation of emergent properties, not just intent.
  3.  **Crux: When mechanisms from different cultures interact (anonymous app + restorative circles), do they create inherent conflicts (composability) that undermine the moral coherence of the overall "package," making evaluation of isolated cultures insufficient?**
      *   *Separates:* Yes. Memorizers might list mechanisms; thinkers analyse their *logical and practical incompatibility* (e.g., app disincentivizing direct apology needed for circle sincerity) and its impact on moral assessment.

  *   **Selected Crux:** **Crux 1** is foundational and directly tackles the core moral evaluation challenge. **Crux 2** is vital for the scenario. The strongest question will force engagement with *both*, but **Crux 1 (Mechanism Reliability/Justice)** is the primary hinge as it underpins the moral evaluation across all cultures.

  **Stage 3: Deliverables**

  **Exam Question:**

  **SECTION A: Application (Approx. 8 Marks)**
  This school introduced two reforms simultaneously: an anonymous reporting app and mandatory restorative circles for reported incidents. Using the definitions below, analyse this situation:
  a) Identify which reform most closely aligns with the core mechanism of *Victimhood Culture* and which with *Dignity Culture*. Briefly justify your choices. (3 marks)
  b) Explain how these two reforms might be *jointly self-undermining*, drawing on the concept of *composability*. (5 marks)

  **SECTION B: Essay (Approx. 17 Marks)**
  "Considering the definitions and the scenario described, is any one of Honour, Dignity, or Victimhood Culture morally superior to the others? In your answer, you must:
  i) Define what you mean by 'morally superior' using at least two distinct criteria (e.g., justice, well-being, fairness, protection).
  ii) Explicitly address the *audience-reliability condition* for Victimhood mechanisms and the *standing-recovery test* for Honour mechanisms.
  iii) Consider the possibility that mechanisms designed for one culture can *functionally degenerate* into the logic of another (as hinted in the scenario).
  iv) State what key evidence or argument would cause you to change your conclusion."

  **Definitions Provided:**
  *   **Honour Culture:** Status is paramount and must be actively defended or avenged personally or through kin. Insults demand retaliation. Standing can be lost through perceived weakness and potentially restored through specific acts (e.g., apology, duel, restitution).
  *   **Dignity Culture:** Individuals possess inherent worth not dependent on others' opinions. Insults should ideally be ignored or resolved calmly through established, impartial institutions (e.g., law, management). Reliance on third parties requires those parties to be fair and authoritative.
  *   **Victimhood Culture:** Individuals gain moral status by demonstrating victimization (real or perceived) to third parties (e.g., authorities, public). Reliance on third-party validation is central. The credibility and impartiality of the audience is crucial.

  **Scenario Summary Included:** (As provided in your query, condensed slightly).

  ---

  **(a) Model Answer (Approx. 700 words)**

  Whether one culture of Honour (H), Dignity (D), or Victimhood (V) is morally superior depends crucially on what we value most. I will argue that Dignity culture is morally superior *overall* when we prioritise **procedural justice** (fair, predictable, and restorable standing) and **systemic resilience** (minimising dependence on unreliable factors). However, Victimhood mechanisms can be morally *necessary* in contexts of severe power imbalance, though not superior as a whole culture.

  "Morally superior" must be disambiguated. Firstly, **procedural justice**: Does the culture provide fair, consistent, and accessible ways to resolve conflicts and restore damaged standing? Secondly, **harm prevention**: Does it effectively prevent or minimise physical, psychological, and social harm, especially to the vulnerable? Honour prioritises harm prevention for the strong through deterrence but fails vulnerable individuals and escalates harm. Victimhood can prevent harm to the vulnerable by empowering reporting but risks systemic injustice. Dignity aims for universal harm prevention through rules and institutions.

  The school scenario reveals critical flaws in relying on Victimhood as a *superior* culture, centred on the audience-reliability condition. The app is a core V mechanism: status (here, as a validated victim or a shamed perpetrator) is determined by recruiting third parties (app administrators, circle facilitators). However, its output depends entirely on whether this audience is well-informed, unbiased, and consistent. The scenario shows unreliability: reports are weaponized ("status competition"), focus disproportionately on online/off-campus events hard to verify, and involve repeat reporters. This isn't just bad luck; it's a *structural risk* of any V system. A morally superior culture cannot depend so fundamentally on an uncontrollable variable prone to bias and misuse. Unreliability here *is* a moral defect of the system's design in practice, undermining procedural justice.

  Honour culture offers a stark contrast on the standing-recovery test. In H, a person who wrongs another *can* (though often violently) restore standing through a recognised act – an apology, payment, or even combat. The school's *combination* of public accusation (via reports) with restorative circles *lacks* a clear, reliable mechanism for the *accused* to restore standing if wrongly accused or after proportionate apology. Being reported is seen as a "defeat," implying lasting stigma. This creates a profound injustice: individuals can be downgraded in status with no guaranteed, dignified path back. A morally superior culture must have robust mechanisms for restoring standing after conflict resolution. Dignity culture, ideally, builds this into its institutions (e.g., courts declaring innocence, rehabilitation).

  The scenario also hints at the degeneration thesis. The reporting system, intended for D/V, regenerates H logic: status competition ("defeat") and the use of a tool (app reports) as a weapon, replacing fists but not the underlying drive. This strengthens the case against V as superior – if it readily degenerates into the harms of H without its resolution mechanisms, its moral claim weakens.

  Regarding composability (Section A), the app (V) and circles (D) undermine each other. The anonymous app lowers the cost of accusation but *raises* the perceived cost of direct apology (seen as weak or unnecessary). However, genuine restoration in circles requires the willingness to apologise and engage face-to-face. The V mechanism actively disincentivises the behaviour the D mechanism needs to function authentically.

  Therefore, Dignity culture is morally superior on the primary axis of procedural justice and systemic resilience. It aims for impartial institutions, inherent worth, and ideally incorporates standing-recovery mechanisms. While its institutions can be flawed, the flaws stem from imperfect implementation of its ideals, not an inherent, risky dependence like V's audience-reliability. On harm prevention, D is also superior to H. V is superior to H in protecting the vulnerable from direct harm but inferior to D on procedural justice and prone to degeneration.

  My conclusion would change if evidence showed Dignity institutions *consistently* fail the vulnerable *and* Victimhood mechanisms can be designed with near-perfect audience reliability and effective standing-recovery pathways – conditions not met in the scenario or, arguably, in complex social settings.

  ---

  **(b) Marking Scheme (Total 25 Marks)**

  **Must-Hit Points:**

  1.  **Clear Definition of Moral Superiority (Distinct Axes): (4 Marks)**
      *   *Award:* 4 for defining 2+ *distinct, relevant* criteria (e.g., justice vs. harm prevention, fairness vs. protection, individual rights vs. social order) and using them to structure the evaluation.
      *   *Cap (B answer):* 2 for one vague criterion or two poorly distinguished criteria. 0 for no definition or "strengths/weaknesses."
      *   *Common Mistake:* Stating criteria without using them analytically; conflating criteria.

  2.  **Critical Engagement with Audience-Reliability Condition (V): (6 Marks)**
      *   *Award:* 6 for explicitly linking V's reliance on third parties to the scenario's unreliability (weaponization, verification issues), arguing whether unreliability is a *systemic moral defect* or bad luck, *and* connecting this directly to the defined criteria for superiority.
      *   *Cap (B answer):* 3 for identifying the condition and scenario issue but lacking depth on moral defect/systemic risk vs. luck, or weak link to criteria. (Caps Section B at ~13/17).
      *   *Common Mistake:* Mentioning unreliability descriptively without moral evaluation; ignoring the systemic nature.

  3.  **Critical Engagement with Standing-Recovery Test (H) & Justice Deficit: (5 Marks)**
      *   *Award:* 5 for contrasting H's potential for restoration with the scenario's lack of clear restoration for the accused after reports/circles, arguing the injustice of permanent status loss without recourse, *and* linking this to procedural justice/fairness criteria.
      *   *Cap (B answer):* 2-3 for mentioning the H restoration idea or the scenario stigma but not connecting them meaningfully or to justice.
      *   *Common Mistake:* Ignoring this test; focusing only on the accuser's perspective.

  4.  **Analysis of Degeneration Thesis & Compossibility (Integrated): (6 Marks)**
      *   *Award:* 3 marks for Section A (b): Clear explanation of how app disincentivises direct apology needed for authentic circles (compossibility conflict).
      *   *Award:* 3 marks for Section B (iii): Explicit recognition that the reporting system regenerates H dynamics (status competition) despite V/D intent, and discussion of its implications for evaluating V/D's superiority.
      *   *Cap (B answer):* Section A(b): 1-2 for weak/partial explanation. Section B(iii): 1-2 for mentioning status competition but not framing it as degeneration or ignoring implications. (Caps essay at ~13/17).
      *   *Common Mistake:* (A) Treating reforms in isolation; (B) Mentioning status competition descriptively without linking it to H logic or moral evaluation.

  5.  **Determinate Position & Conditional Conclusion: (4 Marks)**
      *   *Award:* 2 for a clear, justified stance on superiority (even if nuanced, e.g., D superior overall, V necessary in some contexts).
      *   *Award:* 2 for a specific, relevant condition stated for changing the conclusion (e.g., "if V mechanisms guaranteed reliable audiences..." or "if D institutions consistently failed the vulnerable...").
      *   *Cap (B answer):* 1 for a vague or indecisive stance; 1 for a weak/unrelated condition. 0 for no stance or condition.
      *   *Common Mistake:* "It depends" without a core argument; stating a condition unrelated to the argument's key premises.

  **Highest Cost Omission:** **Point 2 (Audience-Reliability - 6 Marks)**. This is the core conceptual challenge specific to Victimhood culture and directly addresses the moral risk inherent in its defining mechanism. Failing to grapple deeply with whether systemic unreliability constitutes a moral defect (vs. bad luck) and its impact on claims of superiority shows a lack of critical engagement with the crux of evaluating V. Omitting or superficially treating this fundamentally undermines the essay's purpose.

  **Capping the Summary Answer (11/25):** An answer scoring only 11/25 would likely hit:
  *   Point 1: 2 marks (vague/single criterion)
  *   Point 2: 2 marks (mentions unreliability superficially)
  *   Point 3: 1 mark (mentions H restoration or stigma)
  *   Point 4: 3 marks (Section A(b) basic explanation: 2; Section B(iii) mentions status comp: 1)
  *   Point 5: 3 marks (vague stance: 1; weak condition: 2)
  It would define the cultures, describe the scenario loosely, note "pros and cons," but fail to deeply engage with the specific moral tests (audience-reliability, standing-recovery), the degeneration thesis, or define clear criteria for superiority. The composability analysis (Section A) would be passable but not insightful. The cap bites hardest on the lack of deep critical analysis (Points 2 & 3) and clear evaluative framework (Point 1).
