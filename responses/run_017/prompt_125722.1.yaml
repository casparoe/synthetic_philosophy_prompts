answer: |-
  ## Joint Document: Adversarial Collaboration on Wittgenstein's "On Certainty"  

  ### Section 1: Agreed Claims (Non-Vacuous)  
  1.  There exists a distinguishable class of propositions that play a distinctive *functional role* in cognition: they are rarely doubted in practice, are not typically supported by explicit evidence *in the contexts where they function this way*, and doubting them systematically disrupts the coherence of related beliefs (e.g., challenging "I have hands" destabilizes perception reports, not merely adding a false belief).  
  2.  The epistemic regress of "reasons for believing" terminates *in practice* at propositions that are simply relied upon without further justification within a given inquiry—though we disagree on *why* it terminates here.  
  3.  **Hinge-drift occurs:** Propositions can migrate into and out of this functional role over time (e.g., "smoking causes cancer" moving from contested hypothesis to background assumption). This migration poses interpretive challenges for *both* our views and cannot be dismissed by either side.  
  4.  Moorean propositions (e.g., "Here is a hand") are uniquely resistant to doubt *when functioning as hinges*. Moore’s gesture of raising his hand fails as a *proof* of an external world because it presupposes the very framework it purports to justify.  
  5.  Hinges are not typically the *objects* of knowledge claims or doubt in ordinary contexts; their role is enabling, not asserted.  

  ### Section 2: Disagreements Table  
  | Point at Issue | Priya's Position (Empiricist Entrenchment) | User's Position (Framework Commitments) | Crux | Concrete Test Case | Priya's Prediction | User's Prediction |  
  |----------------|--------------------------------------------|-----------------------------------------|------|---------------------|-------------------|------------------|  
  | **Nature of Hinges** | Hinges are ordinary empirical propositions distinguished only by their *degree of entrenchment* via perception/testimony/inference. | Hinges are fundamentally distinct: not empirical beliefs, but arational commitments enabling inquiry. | **Is the hinge-role defined by *kind* of proposition or *contextual function*?** | *The Interview Study:* Ask subjects to justify "I have hands," "Earth existed long before me," "No one walked on Mars." | Most will cite ordinary evidence (e.g., "I see them," "fossils/rocks," "NASA reports"). Rejection criteria will be empirical ("If amputated," "If physics disproved age," "If NASA confirms"). | Most justifications will be circular/self-defeating ("How do I know? I *use* them"). Rejection criteria will involve conceptual breakdown ("If I’m a brain in a vat? That question is nonsense"). |  
  | **Regress Stopping Point** | Regress stops *practically* at highly probable propositions; hinges *could* be justified by evidence if needed, but it’s inefficient. | Regress stops *principledly*: hinges are the "riverbed" of thought; providing evidence for them is unintelligible as it presupposes them. | **Is doubt about a hinge *merely implausible* or *unintelligible*?** | *The Valley Case:* After the landslide, how do villagers assimilate the river’s new course? | They rationally revise: "A landslide rerouted it. Our old maps/were wrong." Evidence (observation, debris) drives belief-revision. | They undergo a paradigm shift: initial reports are nonsensical ("The river *can’t* flow west!"); acceptance requires adopting a *new* hinge ("Landslides alter rivers"), not evidence-weighing. |  
  | **Origin of Hinges** | Hinges are installed via standard epistemic routes: testimony (e.g., learning Earth’s age), perception (e.g., "Objects persist"), inference (e.g., "Other minds"). | Hinges are installed via *training* (Abrichtung): mastery of practices (e.g., counting, spatial reasoning), not evidential support. | **Do hinges originate via *evidence* or *participatory training*?** | *Teaching Arithmetic:* How is "2+2=4" instilled in a child? | Through evidence: counting objects, teacher testimony, consistent results. | Through drill: correction until the rule is internalized as a norm of practice; no "evidence" is involved. |  
  | **Status of Logic/Arithmetic** | Logical/mathematical hinges are highly abstract empirical generalizations (e.g., "Symbol manipulation is reliable") or conventions. | They exemplify the grammatical: rules constitutive of sense-making, categorically distinct from empirical propositions. | **Do logic/arithmetic hinges share the *same status* as empirical hinges?** | *Denying Non-Contradiction:* Ask subjects to justify "No object is red and not red all over." | Justification cites perceptual consistency, conceptual coherence, or pragmatic utility. | Justification fails: attempts to "prove" it presuppose it; denial is nonsensical, not false. |  

  ### Section 3: Verbal Disputes & Substantive Differences  
  -   **Verbal Dispute:** "Belief" and "Knowledge."  
      -   *Priya:* Hinges *are* beliefs/knowledge—just very secure ones.  
      -   *User:* Calling hinges "beliefs/knowledge" misdescribes their role; they are pre-doxastic certainties.  
      -   *Why Verbal?* Functional role (hinges aren’t *asserted*) vs. psychological state (we rely on them).  
  -   **Substantive Dispute:** "Arational" vs. "Empirically Justified."  
      -   *Not verbal:* User claims hinges *cannot* coherently receive evidence (doubt is nonsensical); Priya claims they *do* (but rarely need it).  

  ### Section 4: Evidence Against Our Positions  
  -   **User's Concession:** If hinges *routinely* receive non-circular, non-presupposing justifications (e.g., in the Interview Study) *without* collapsing inquiry, this weakens the "framework" view.  
  -   **Priya's Concession:** If hinge-doubt consistently produces *conceptual breakdown* rather than recalcitrant false beliefs (e.g., Valley villagers treating pre-landslide reports as gibberish, not error), this weakens the "entrenched belief" view.  

  ---  
  *This document represents our shared ground, clarified disagreements, and tests to resolve them. We commit to revisiting predictions after examining evidence.*  
  **Signed:** _________________________ (User) & _________________________ (Priya)
