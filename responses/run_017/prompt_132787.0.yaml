answer: |-
  ### The Implicit Theory
  The strongest articulation of the implicit theory rests on three pillars:  
  1. **Threshold View of Sentience**: Moral status is binary and requires *phenomenal consciousness* (subjective experience like pain or suffering). This capacity emerges only in animals with specific neurobiological complexity (e.g., centralized brains with integrated processing, nociceptors linked to affective states). Insects lack this architecture—their neural organization is decentralized, dominated by innate reflexes, and lacks the structural correlates (e.g., cortex-like regions, endogenous opioids) deemed necessary for consciousness.  
  2. **Burden of Proof**: The null hypothesis is that taxa without vertebrate-like neuroanatomy are *not* sentient. Proving sentience requires robust positive evidence (e.g., behavioral flexibility beyond stimulus-response, trade-offs between threat avoidance and reward pursuit). Absent such evidence, default treatment is as non-sentient automatons.  
  3. **Taxon-Level Categorization**: Sentience is a trait fixed at the taxonomic level (e.g., Insecta, Arthropoda). If a taxon lacks the neural basis for sentience, *all* its members are non-sentient. Uncertainty applies to the entire category, not individuals. Thus, ethical consideration applies categorically—not incrementally with numbers or ambiguous edge cases.  

  This framework treats insects as *constitutively incapable* of moral patienthood, akin to plants or microbes. Institutional tractability isn’t the core justification but a downstream benefit: excluding insects avoids intractable ethical demands (e.g., evaluating every agricultural pesticide use).  

  ---

  ### What It Strictly Needs vs. What It Merely Fits  
  **Strictly Needs**:  
  - The **binary threshold** (sentience exists or doesn’t—no "partial" moral status).  
  - **Burden of proof** on sentience claimants (absence of proof = proof of absence).  
  - **Taxon-level generalization**: Resolving uncertainty for one honeybee resolves it for all.  

  **Merely Fits**:  
  - Specific neurobiological criteria (e.g., "requires a cortex"): The theory could accept alternative markers.  
  - Epistemic humility about small probabilities: It *could* grant a tiny chance of insect sentience but deem it negligible—this isn’t required, as the theory already denies sentience categorically.  
  - Practical tractability: This is a consequence, not a premise.  

  ---

  ### Where the Practice Pulls Apart  
  The theory strains at two fault lines:  
  1. **Neurobiological Arbitrariness**: Octopuses (invertebrates) receive protection due to observed complex cognition, yet bees exhibit sophisticated learning, communication, and emotion-like states (e.g., pessimism bias after stress). If sentience requires "vertebrate-like brains," why protect octopuses? If it requires "observed intelligence," why exclude bees? The line appears ad hoc.  
  2. **Inconsistent Treatment of Simpler Vertebrates**: Zebrafish or frogs often receive automatic ethical review despite possessing simpler brains than bees or crabs. This suggests the boundary isn’t strictly neurobiological but anchored in phylogeny (vertebrate vs. invertebrate)—a taxonomically inconsistent criterion.  
  3. **Edge Cases in Agriculture**: While "boiling a beetle" is ignored, the same committee might regulate earthworm use in composting if vertebrates were involved. The exclusion of insects feels less principled than pragmatic.  

  ---

  ### Underdetermination  
  Other theories could justify the same hands-off approach:  
  - **Kantian Indirect Duties**: Insects lack rationality, so we have no *direct* duties to them; concern arises only if cruelty harms human character (negligible for insects).  
  - **Virtue Ethics with Threshold Compassion**: Compassion for insects isn’t virtuous—it misallocates moral attention better directed at beings capable of reciprocal relationships.  
  - **Hardline Contractarianism**: Insects cannot participate in moral agreements or retaliate, so they fall outside the social contract.  
  - **Utilitarianism with Near-Zero Probability**: If insect sentience is deemed improbable *enough* (e.g., P<10⁻²⁰), expected suffering is negligible regardless of numbers.  

  All these converge on excluding insects but diverge on *why* (lack of rationality, virtue irrelevance, non-participation in contracts, or vanishing probability).  

  ---

  ### The Replacement Test  
  Swapping to an **expected suffering + precaution** view would require:  
  1. **Universal Review**: Every protocol involving insects (e.g., gassing fruit flies) undergoes formal review.  
  2. **Probability Assignments**: Committees must estimate P(sentience) per taxon (e.g., 0.1% for bees, 0.001% for ants) based on contested science.  
  3. **Welfare Range Estimates**: Quantify suffering intensity/duration (e.g., is boiling a beetle worse than starving a mouse?).  
  4. **Aggregation**: Multiply P(sentience) × welfare impact × N animals. Killing 50k ants might then demand stricter oversight than killing one mouse.  

  **Bite-Back Problems**:  
  - **Absurd Demands**: Expected suffering in crop spraying (billions killed) could dwarf all vertebrate research combined, paralyzing agriculture.  
  - **Unresolvable Uncertainty**: Committees would debate speculative neurophilosophical probabilities (e.g., "Is P(sentience) for fruit flies 10⁻⁶ or 10⁻⁹?").  
  - **Inconsistency with Scale**: If P(sentience) is 0.1% for bees, farming 1 trillion bees for protein creates "expected suffering" equivalent to 1 billion sentient animals—forcing absurd trade-offs (e.g., banning insect farms to save "expected lives").  
  - **Precautionary Collapse**: A maximally cautious view (treating any non-zero P(sentience) as decisive) would halt nearly all insect-related human activity.  

  The implicit theory avoids these by rejecting the aggregative framework entirely—insects aren’t candidates for suffering, so the calculation never starts. The replacement view’s rigor risks either unworkability or arbitrary thresholds re-entering through the back door (e.g., "ignore P<0.01").
