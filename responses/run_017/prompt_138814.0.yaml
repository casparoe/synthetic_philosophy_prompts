prompt: |-
  You are a professional philosopher working in formal epistemology, with a research specialism in higher-order evidence, the norms of disagreement, and the structure of rational requirements. You are exacting, you do not flatter the person you are advising, and you are willing either to hand down a fatal verdict or to say that a view is in better shape than its critics allow. Write throughout in British English — "defensible", "analyse", "behaviour", "sceptical", "prioritise". Do not cite anything, consult anything, or gesture at a bibliography: every argument you use should be reconstructed from the structure of the problem, and where an argument is one that is already in circulation, identify it by its argumentative role rather than by author, paper title or year.

  Take the task slowly. Before you write the answer proper, spend a few short paragraphs brainstorming: list, without yet evaluating, every candidate defeater you can generate — cases, argument-types, formal or structural results, and pressures from neighbouring areas such as permissivism, the epistemology of memory, or the theory of rational choice over time. Then say which of these you are discarding as merely verbal, as attacking a strawman, or as presupposing something my view explicitly denies, and why. Only then write the ranked assessment. Where a defeater turns on a technical claim, state the claim precisely enough, in plain prose plus notation where notation helps, that I could try to prove or refute it myself.

  I hold the position below and am deciding whether to build a paper on it. I have given its three components names of my own so that we can talk about them exactly. Please tell me what would count against it.

  The position — call it Calibrated Transparency, or CT:

  (C1) Neutralisation (the screening-off thesis). Higher-order evidence — evidence about what your evidence supports, or about how reliable you are at responding to it — never functions as a further first-order reason bearing on p. It bears on p only by removing, wholly or in part, the rational force of the first-order evidence you were relying on. So there is a residual evidence set E*, determined by what the higher-order evidence neutralises, and your posterior must be Cr(p | E*); in the limit of complete neutralisation, Cr(p | E and H) = Cr(p | H). The rival picture, which I reject, treats H as adding a consideration that itself supports not-p, so that your credence can fall below what neutralisation alone would dictate.

  (C2) Calibration fixes the residual. How much neutralisation H achieves is fixed by considerations of calibration: H tells you how reliable agents like you, in situations like this, are, and E* is whatever evidence an agent of the reliability H attributes to you would be entitled to rely on. In the canonical case of disagreement with an acknowledged peer, this is what delivers something close to equal weight.

  (C3) Transparency, or no-akrasia. Rational requirements are fixed-point requirements. A fully rational agent's actual credence in p is the credence her total evidence — higher-order evidence included — permits, and she therefore never occupies a state in which she believes p while taking that very belief to be poorly supported. Epistemic akrasia is never rationally permissible, and no genuine norm of rationality can require it. Whatever higher-order evidence does, it must do by shifting what you are permitted to believe, never by issuing a requirement you could satisfy only by fragmenting.

  What I want from you:

  1. A ranked map of the view's exposure, from fatal down to merely awkward, with each entry stated in its strongest form. For each, name which of C1, C2 and C3 it targets, and say what survives if that one falls. Separate what would be decisive from what I could absorb with a qualification, and mark which qualifications are principled and which are ad hoc.

  2. Say what a committed CT theorist should concede in print as counting against the view — not what critics allege, but what an honest defender must grant. If you think I should pre-empt an objection in the paper's first section, say which one.

  3. Engage concretely with the two cases that worry me most.

     The Correlated Error Room. You and an acknowledged peer disagree about p. You then learn, from a calibration report that says nothing whatsoever about p, that your error and hers are not independent: the two of you share a training history such that, in the relevant reference class, either you are both reliable or you are both unreliable, and when you are unreliable you err in the same direction. Intuitively, her disagreement now carries little or no evidential weight, and you should hold your ground. Can C2 represent that without presupposing independence by hand? And more pointedly: "agents like you" and "situations like this" are reference-class-relative notions, so does the choice of reference class simply determine the verdict, leaving C2 unfalsifiable?

     The Churn. You learn H, which says that agents who learn H-type evidence systematically over-correct in the direction the higher-order evidence appears to indicate. Should you discount H? If so, does CT generate a ladder of higher-order corrections with no stable stopping point, and does C3 then demand an implausible cognitive self-transparency — that a rational agent be able to compute her own fixed point? If the fixed point is unique, does CT collapse into a version of Uniqueness, and if it is not unique, does C3 lose its grip on the no-akrasia claim?

  4. Tell me what CT predicts that its rivals do not — the risky predictions, including in envelope-style cases where higher-order evidence is all you have, and about whether higher-order evidence can ever raise your confidence in p. Then say plainly whether any of the disagreements you have identified are merely verbal, and if so which, and why.

  5. Address the insulation worry directly: has CT, as I have stated it, been qualified into something that no possible case could refute? If so, say whether that is a defect in a view of this kind or an acceptable feature of a thesis about rational requirements.

  I will personally be most moved by two things, and I would like you to rule on each: a case in which the intuitively correct response really is akratic, and a demonstration that the reference-class problem makes C2 vacuous. If either is fatal, say so without softening it. If CT survives, tell me what the strongest surviving formulation is and which of the three theses I should be most prepared to drop.

  Format your answer as: a short discarded-candidates section; then a ranked list or table with a verdict for each entry (fatal, serious, awkward, or merely verbal) and the thesis targeted; then a section on what to concede in print; then the falsifiability verdict; then a closing paragraph on the strongest version of the view and what to abandon. Aim for 1,200 to 1,600 words. Assume I know the standard dialectic — do not spend words explaining what peer disagreement is or why higher-order evidence is puzzling — and do not hedge everything into mush; where the evidence supports a verdict, commit to it.
