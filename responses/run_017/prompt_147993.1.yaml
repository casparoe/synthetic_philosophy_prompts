  In the original system, the string "MU" is not derivable, but the string "MIU" is. We want a target that requires many steps. Hofstadter in GEB gives an example: the string "MIIU" can be derived in  in 8 steps. That might be too short. He also gives "MIU" in 1 step, "MIIU" in 8 steps, and then there are longer ones.

  We can set the target to a string that is known to take about 20 steps. We choose the string **MUIUUIUU** and provide a derivation elsewhere, but not give it to the students. We then reveal at the end that it is possible.

  But for the purpose of the activity, we will simply state for System 2 that the target is derivable but requires more steps than they will have time for. In the debrief, we will give them the derivation.

  So in summary:

  - System 1: MU-puzzle (target MU, not derivable)
  - System 2: Same rules, but target is a string that is derivable but requires many steps (e.g., 31 steps as in some examples). We choose the string **MUIUUIUU** and assure (by known result) that it is derivable.

  ### Roles and Groups

  - **Group A (Derivers)**: 9 students. They receive the axiom and the rules. Their task is to try to derive the target string. They can only apply the rules to generate new strings. They work at the whiteboard (or on large posters) and write down the strings they generate, along with the rule used. They can work collaboratively. They are not allowed to discuss why they are doing what they are doing or to reason about the system as a whole.

  - **Group B (Analyzers)**: 9 students. They observe the strings that Group A generates. They have the rules and the axiom. Their task is to try to understand what strings are possible and what are not. They can:
    - Formulate conjectures about which strings are derivable.
    - Challenge Group A to derive a specific string that they think might be intermediate.
    - They are not allowed to suggest moves or to generate strings themselves.

  - **Communication between groups**: 
    - The Analyzers can request that the Derivers try to derive a specific string. The Derivers may choose to take on that challenge or not (they are focused on the target). 
    - There will be a designated messenger (the instructor or a TA) every 5 minutes to convey requests.

  ### Scoring System (Credence Reports)

  - At fixed intervals (every 5 minutes), each student writes on a scrap of paper their current credence (between 0 and 100) that the target is derivable.
  - They also write their name.
  - The instructor collects and records.
  - Scoring: We use a quadratic scoring rule. If a student reports a probability `p` (expressed as a fraction) for the event "derivable", then if the event happens, their score is `1 - (1-p)^2`; if not, their score is `1 - p^2`. We can multiply by 100 to make it points.
  - However, proper scoring rules are for eliciting a probability. We can use:

    Score = 100 - (outcome - p)^2 * 100

    where outcome is 1 if derivable, 0 if not, and p is their reported probability in [0,1].

  - We will do this for both systems.

  - To prevent gaming by a student who knows the answer, we can make the following adjustments:
    - The scoring is done privately, and the scores are not revealed until the end.
    - The student is not told whether the target is derivable until the end of the activity.
    - We can also make the scoring rule such that extreme bets are penalized heavily if wrong. For example, if a student says 0% and it is derivable, they get 0 points. If they say 100% and it is not, they get 0 points. But if they are right, they get 100. The quadratic scoring rule already does this.

  - We will have 3-4 reports per system.

  ### Timeline for a 80-minute session

  - **0-5 minutes**: Introduction to the activity without lecture. Explain that they will be working in two groups on a puzzle. Split into Group A and Group B.
  - **5-10 minutes**: Explain the rules to both groups. For System 1: 
    - Group A (Derivers) are given index cards with the rules and the axiom. Their goal is to derive MU.
    - Group B (Analyzers) are given the rules and the axiom. Their goal is to understand what can be derived.
  - **10-30 minutes**: Work on System 1. 
    - Derivers work at the whiteboard, writing down the strings they generate in a derivation tree.
    - Analyzers watch and may (through the instructor) request that the Derivers try to derive a particular string (which might be intermediate).
    - At 15, 20, and 25 minutes, the instructor calls for a credence report (for System 1).
  - **30-35 minutes**: End work on System 1. The instructor does not reveal whether MU is derivable yet.
  - **35-40 minutes: Switch to System 2.**
    - Present System 2: same rules as System 1, but the target is now **MUIUUIUU** (or another string that is known to be derivable but requires many steps).
    - Groups keep their roles.
  - **40-65 minutes**: Work on System 2.
    - Similarly, credence reports at 50, 55, and 60 minutes.
  - **65-70 minutes**: End work on System 2.
  - **70-80 minutes**: Debrief.

  ### What will happen

  - In System 1, the Derivers will generate many strings but not reach MU. The Analyzers might notice that every string has a number of I's that is not divisible by 3. They might form the conjecture that MU is impossible. The credence in derivability will start high and then drop.
  - In System 2, the Derivers will generate many strings but not reach the target. The Analyzers might not find an invariant that rules it out. The credence might start high, then drop, but we will reveal that it is in fact derivable (even though they didn't find it) to make the point that failed search does not imply impossibility.

  ### Debrief

  - Map the experience:
    - Group A was working inside the system: they were only allowed to apply the rules mechanically.
    - Group B was working outside: they were observing and forming conjectures about what the system can do.
  - In System 1, they experienced that they couldn't derive MU. But more than that, Group B might have found a property (invariant) that explains why.
  - In System 2, they also couldn't derive the target, but that doesn't mean it's impossible. We reveal that it is possible and show the long derivation (if time permits, or just state it).
  - The counting argument for System 1 is not a rule of the system; it's a metatheoretic argument. It is a proof about the system, not within it.
  - For the bridge to Gödel: 
    - In the MU-puzzle, the metatheoretic argument (counting I's mod 3) cannot be expressed within the system because the system doesn't have the concept of numbers.
    - In Gödel's theorem, the system is rich enough to express arithmetic, so the metatheoretic argument can be coded within the system. This self-referential capability is what creates the incompleteness.
  - What the activity cannot reproduce: 
    - The self-referential aspect of Gödel's theorem.
    - The ability to code metatheoretic statements within the system.
    - We will have to explain that in the incompleteness theorem, the undecidable sentence is one that, via coding, says "I am not provable in this system".

  ### Handling Predictable Issues

  1. **The student who already knows the answer**:
     - Assign them to Group B (Analyzers) and ask them to help formulate conjectures without giving away the answer. If they see the invariant, they can be encouraged to find other properties or to think about System 2.
     - In the scoring, if they bet hard early, they will score high if right, but we can also stress that the activity is about the process. In System 2, they might not know the answer.

  2. **The student who thinks "impossible" just means we were not clever enough**:
     - In System 1, we have the invariant proof. In System 2, we show that sometimes it is possible even if we didn't find it. This student will see that in System 1, the invariant provides a proof of impossibility, which is stronger than just not finding a derivation.

  3. **The group that treats the invariant as one more move available inside the game**:
     - The rules of the system do not include the invariant. It is a property that is observed to be preserved. We will clarify in the debrief that the counting is not a rule of the system but a tool for reasoning about the system.

  4. **The student who concludes that the session has refuted mechanism**:
     - In the debrief, explain that the activity shows that there are limitations to what can be decided within a formal system, but it does not refute mechanism. In fact, the metatheoretic reasoning (done by the Analyzers) is also a mechanical process, but in a different system (their own brains or a stronger formal system). This sets up the hierarchy of formal systems.

  ### Companion System for System 2

  We choose System 2 to be the same rules as System 1 but with a target that is derivable but requires a long derivation (say, 20 steps). We will choose the target to be **MUIIUIIU** (or a string that is known to be derivable). If we cannot find one, we can use the following derivation for a string in the original system:

  Example of a long derivation to "MUIU" might be found online. Alternatively, we can use:

  Start: MI
  1. Rule II: MII
  2. Rule I: MIU
  3. Rule II: MIUIU
  4. Rule I: MIUIUU
  5. Rule IV: MIUI (by deleting the last UU)
  6. Rule II: MIUIMIU
  7. Rule III: MIUIMIU -> but wait, we can look for III. We have I's spread out.

  Given the time, we will rely on the fact that many strings are derivable but require many steps. We will choose a string that is known to require at least 10 steps. For instance, the string "MIIU" can be derived in about 8 steps, so we pick a string that requires more.

  We can state that in System 2, the target is "MUIUUIUU", and it is derivable in 31 steps (as an example from some sources). We will provide the derivation in the debrief if needed.

  ### Minute-by-Minute Timeline

  - **0-5 min**: Split into Group A and Group B. Explain very briefly: "Group A, you will be given a starting string and rules for generating new strings. Your job is to generate strings and try to reach the target string. Group B, you will observe the strings that Group A generates and try to understand what is possible in this system. You may request that Group A try to generate a specific string that you think might be important."

  - **5-10 min**: Distribute index cards with the rules and axiom for System 1. 
    - Rules for System 1 (MU-puzzle):
      - Axiom: MI
      - Rule 1: If you have a string ending with I, add U at the end.
      - Rule 2: If you have a string starting with M, double the part after M.
      - Rule 3: If you have III anywhere, replace with U.
      - Rule 4: If you have UU anywhere, delete them.
    - Target: MU

  - **10-30 min**: Work on System 1.
    - At 15, 20, and 25 min: pause for credence report. Each student writes privately: "What is your current probability (0-100) that MU is derivable in System 1?" 
    - Collect and record (don't reveal).

  - **30-35 min**: Wrap up System 1. Do not reveal whether MU is derivable. Introduce System 2: "Now we switch to a new system, System 2. The rules are the same as System 1. The starting string is MI. The target string is MUIUUIUU."

  - **40-65 min**: Work on System 2.
    - Credence reports at 50, 55, and 60 min.

  - **65-70 min**: End work on System 2.

  - **70-80 min**: Debrief.
    - Reveal that in System 1, MU is not derivable. Show the invariant: the number of I's is never a multiple of 3. 
    - Reveal that in System 2, MUIUUIUU is derivable, and if there's time, show the first few steps and mention it takes 31 steps.
    - Discuss the difference between working inside (Group A) and outside (Group B).
    - Discuss that in System 1, the invariant proof is not a rule within the system but a proof about the system.
    - Connect to Gödel: in the incompleteness theorem, the system is powerful enough to encode such self-referential statements.

  ### What the Activity Cannot Reproduce
  - The activity shows the difference between inside and outside and the use of invariants, but it does not show how a system can encode statements about itself. This is a crucial aspect of Gödel's proof. We must explain that in a sufficiently strong system, one can encode the metatheoretic invariant (like the count of I's mod 3) within the system itself, and then construct a sentence that says "I am not provable".

  ### Risk of Cementing the Lazy Analogy
  - The activity might reinforce the idea that the incompleteness theorem is only about the difference between inside and outside. We must emphasize that the distinctive feature is the self-reference made possible by encoding.
  - In the debrief, explicitly state: "In the MU-puzzle, the system is too weak to express the metatheoretic argument. But in a system like arithmetic, you can encode strings and proofs, and then you can write a sentence that talks about its own unprovability."

  This design should create a productive struggle and then a reflective debrief.
answer: |-
  ### Structured Class Activity: Inside vs. Outside a Formal System  
  **Goal:** Create an experiential divide between mechanical rule-application (working *inside* the system) and meta-level reasoning (working *outside*), using the MU-puzzle and a companion system. The activity emphasizes that failed search ≠ impossibility, and that invariants are external tools, not internal rules.  

  ---

  ### **Materials & Setup**  
  - **Whiteboard:** Divided into two sections: "Derivation Board" (left) and "Conjecture Board" (right).  
  - **Index Cards:**  
    - *Red cards (for Derivers):* Axiom and rules for the current system (no explanations).  
    - *Blue cards (for Analyzers):* Rules + prompts: "What patterns do you see? What strings *cannot* be derived? Test a hypothesis by asking Derivers to try a specific string."  
  - **Projector:** Hidden until debrief; used to reveal key insights later.  
  - **Credence Reports:** Small slips of paper; students write their name, credence (0–100%), and commit "points" (fictional currency).  

  **Group Split (9 Derivers / 9 Analyzers):**  
  - **Derivers (Group A):**  
    - Can only apply rules to generate strings.  
    - Work at the whiteboard’s "Derivation Board," writing new strings and labeling the rule used.  
    - *Forbidden* from discussing strategies, invariants, or why something might be impossible.  
  - **Analyzers (Group B):**  
    - Can only observe derivations, spot patterns, and propose hypotheses.  
    - Write conjectures on the "Conjecture Board" (e.g., "No theorem starts with U").  
    - Can *request* that Derivers attempt to derive a specific string (e.g., "Try getting a string with 0 I’s").  
    - *Forbidden* from applying rules or touching the board.  
  - **Controlled Channel:**  
    - Analyzers submit string requests to you on blue cards; you pass *one* to Derivers every 5 minutes.  
    - Derivers must attempt the request immediately.  

  ---

  ### **Timeline (80 Minutes)**  
  #### **Phase 1: System 1 (MU-Puzzle) — 35 Minutes**  
  - **0–5 min:** Split into groups. Distribute cards.  
    - *Derivers:* Red card with MU rules and axiom (MI). Target: **MU**.  
    - *Analyzers:* Blue card with rules + prompts.  
    - *Instruction:* "Derivers: Generate strings. Analyzers: Find patterns. Don’t share ideas across groups."  
  - **5–25 min:** Work time.  
    - Derivers brute-force at the board. Analyzers watch and write conjectures (e.g., "All strings start with M").  
    - At 10 min and 20 min: **Credence Report #1 & #2** (see scoring below).  
  - **25–30 min:** Analyzers submit a string request (e.g., "Make a string with 6 I’s"). Derivers attempt it.  
  - **30–35 min:** **Credence Report #3.**  

  #### **Phase 2: System 2 (Companion System) — 30 Minutes**  
  - **35–40 min:** Introduce System 2.  
    - *Same rules as MU-puzzle, but new axiom:* **MIII**. Target: **MU** (same as System 1).  
    - *Crucial twist:* In System 2, MU *is* derivable (via **MIII → MU** by Rule III). But Derivers won’t see this quickly because:  
      - They’ll likely overapply Rules I/II (e.g., MIII → MIIII → MIIIIU → ...), missing the short path.  
      - *Why this job?* It breaks "failed search = impossibility" by showing a short derivation exists but is overlooked.  
  - **40–60 min:** Work time. Same roles.  
    - Derivers replicate System 1 habits (e.g., doubling strings). Analyzers may spot the short path but can’t intervene.  
    - At 45 min and 55 min: **Credence Report #4 & #5.**  
  - **60–65 min:** Analyzers submit a request (e.g., "Make a string with no I’s").  

  #### **Phase 3: Credence & Transition — 5 Minutes**  
  - **65–70 min:** Final **Credence Report #6** for both systems.  

  ---

  ### **Credence Scoring System**  
  - **Mechanics:**  
    - At each interval, students write: **Name**, **Credence (0–100%)**, **Points Committed (1–10 fictional points)**.  
    - Use a **quadratic scoring rule**: If credence = *p*, and outcome is true, score = `10 - 10*(1-p)^2`. If false, score = `10 - 10*p^2`.  
    - *Example:* A student reports 80% for "MU derivable" and commits 8 points. If MU is *not* derivable, score = `10 - 10*(0.8)^2 = 3.6`.  
  - **Trajectory & Anti-Gaming:**  
    - *System 1:* Credence starts high (∼80%) but drops as search fails (to ∼20–40%). Invariant-spotters in Analyzers drive this down.  
    - *System 2:* Credence starts high (∼70%) but drops again (to ∼30–50%) as search fails.  
    - *Anti-Gaming:* Students who know MU is impossible bet hard early, but in System 2, the *same* student may doubt themselves (MU *is* derivable here). Scoring penalizes overconfidence: A wrong 100% bet yields 0 points.  

  ---

  ### **Companion System (System 2)**  
  - **Design:** Same rules as MU-puzzle.  
    - **Axiom:** MIII (not MI).  
    - **Target:** MU (identical to System 1).  
  - **Why this job?**  
    - MU is derivable in one step (**MIII → MU** via Rule III), but students will miss it:  
      - Derivers fixate on Rules I/II (e.g., MIII → MIIII → ...), creating long, unproductive chains.  
      - Analyzers, primed by System 1, look for the "I-count invariant" (which fails here: MIII has 3 I’s → divisible by 3, but MU *is* derivable).  
  - **Why it works:**  
    - Breaks the heuristic "invariant violation ⇒ impossibility."  
    - Shows that invariants must be *preserved by all rules* (Rule III breaks the I-count invariant).  
    - Sequences as a correction: After System 1’s "impossibility via invariant," System 2 reveals "invariants can be misleading if not rigorous."  

  ---

  ### **Debrief (10 Minutes)**  
  Use the projector to map moments to concepts:  
  1. **Inside vs. Outside:**  
     - *Derivers* worked **inside**: Applying rules blindly.  
     - *Analyzers* worked **outside**: Spotting patterns (e.g., "All strings start with M") and testing hypotheses.  
     - *Key moment:* When Analyzers saw the I-count pattern but couldn’t use it as a rule.  

  2. **Invariants ≠ Rules:**  
     - The I-count argument is a **metatheoretic tool** (external reasoning), not a "fifth rule." It synthesizes observations about *all possible* derivations.  

  3. **Failed Search vs. Impossibility:**  
     - *System 1:* Failed search + invariant proved impossibility.  
     - *System 2:* Failed search, but MU was derivable—showing that only *invariants* (not search) prove impossibility.  

  4. **Bridge to Gödel (Critical Contrast):**  
     - In MU, the invariant (**number theory**) *cannot* be expressed in the system (symbols: M,I,U).  
     - In Gödel, the system *can encode its own metatheory* (e.g., "This sentence is unprovable").  
     - *Stress:* "Gödel’s insight wasn’t just ‘jumping outside’—it was *pulling the outside back in* via coding."  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Self-Reference:** The activity shows "inside vs. outside" but not how a system can *encode statements about itself*. You must clarify:  
     - "Gödel’s sentence is like a string in the MU-system that says, ‘I cannot be derived’—something MU cannot do."  
  2. **Lazy Analogy Risk:** Running the activity *could* cement "Gödel = just inside/outside," but the debrief mitigates this by stressing coding. Say explicitly:  
     - "The puzzle shows the *need* for external reasoning. Gödel shows that in strong systems, this reasoning can be internalized, creating paradox."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Student Who Knows the Answer:**  
     - *Assign them to Analyzers.* Their job becomes: "Find *other* invariants or test if *every* string has property X." In System 2, they’ll be unsure.  

  2. **"Impossible Means We Weren’t Clever Enough":**  
     - *Use System 2:* Show MU *was* derivable despite failed search. Contrast with System 1’s invariant proof. "Some things are impossible; others are just hard."  

  3. **Treating Invariants as Internal Rules:**  
     - *Intervene:* "Can you point to a rule that *says* ‘preserve I-count mod 3’? No? Then it’s a *story we tell* about the system, not part of it."  

  4. **"This Refutes Mechanism!":**  
     - *Clarify:* "Mechanism claims the *mind is a formal system*. This shows that formal systems have limits, but doesn’t prove minds surpass them. A stronger system might prove what weaker ones cannot."  

  5. **Group Stuck on Brute-Force:**  
     - *As Analyzers:* Ask them to request a string that should be "impossible" (e.g., "Make a string with 0 I’s"). When Derivers fail, it highlights futility.  

  ---

  ### **Why the Asymmetry Works**  
  - **Derivers** experience frustration: Rules feel arbitrary; search is chaotic. They see only local moves, not global patterns.  
  - **Analyzers** see patterns emerge (e.g., I-count persistence) but feel powerless: They can’t *act* on insights, only observe.  
  - **When B finds the invariant:** They can’t "add it as a rule," forcing them to see it as external. The credence reports make their evolving certainty visible to the whole class.  
  - **Contact via requests:** Analyzers ask Derivers to test hypotheses (e.g., "Make a string with 3 I’s"). Derivers’ failure validates Analyzers’ meta-reasoning.  

  This design ensures the "aha" isn’t spoiled—it emerges from the asymmetry itself. The companion system then refines the lesson: Invariants are powerful, but only when they hold rigorously.
