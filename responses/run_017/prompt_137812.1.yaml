  - The group might not trade much, so prices don't move. We can encourage trading by having the facilitator trade a little to move prices? Or we can set the initial prices to be different? Or we can have a few participants who are confident in one direction.

  - The adversary phase might be confusing. We need to explain it clearly.

  - Claim 5 might be confusing. We can skip it if time is short, but it is important.

  - The group might not see the difference between the two types of uncertainty. We have to guide the debrief carefully.

  - The group might not care about the play money. We can make it more engaging by having a leaderboard.

  Parts that are hard to simulate and we might have to explain:

  - The convergence in the limit: we cannot run multiple rounds with increasing time. So we have to describe it.

  - The idea of an adversary with more computational resources: we simulate it by having the facilitator trade with knowledge, but it's a one-shot.

  Overall, the session should be engaging and lead to the desired insights.

  Let me write the script for the facilitator:

  Introduction (5 min):

  "Welcome! Today we're going to play a betting game to explore ideas about evidence and uncertainty. Each of you has $100 in play money. We have five claims. You can buy or sell shares in these claims. Each share will pay $1 at the end if the claim is true, and $0 if false. I will act as the market maker. For each claim, there will be a current price. You can buy or sell any number of shares at that price. After each trade, the price will adjust: if you buy, the price goes up by $0.01; if you sell, it goes down by $0.01.

  The claims:

  1. The coin under this cup is heads. I flipped a fair coin at the start and put it under this cup.
  2. The card I drew from this shuffled deck is a heart. I shuffled the deck and drew one card, which is face down.
  3. The 1000th digit of pi (after the decimal) is 7.
  4. The number 1234567891 is prime.
  5. The Goldbach conjecture holds for the number 10^100. (The Goldbach conjecture states that every even integer greater than 2 is the sum of two primes. We are asking whether 10^100, which is a 1 followed by 100 zeros, is the sum of two primes.)

  For claim 5, we will not be able to compute the answer in this session. So at settlement, we will pay $0.50 per share regardless of the truth.

  We will trade for 20 minutes. Then we will have a special trading phase for an outside agent. Then we will settle.

  Any questions? Let's start trading."

  Trading (20 min): Facilitator keeps track of the prices and trades. Update a whiteboard with the current prices.

  Adversary phase (5 min):

  "Now, trading is closed for the group. But now, an outside agent with a lot of computational power wants to trade. This agent can compute the answers to claims 3 and 4 very quickly. The agent will trade with me at the last market price. I will now execute the agent's trades."

  For claim 3 (false, last price P3): if P3 > 0, the agent sells 100 shares.
  For claim 4 (true, last price P4): if P4 < 1, the agent buys 100 shares.

  Do these trades with the market maker (facilitator). No need to adjust the price further.

  Settlement (10 min):

  "Now, let's settle the claims.

  Claim 1: (lift the cup) ... heads/tails? ...
  Claim 2: (reveal the card) ... heart or not? ...
  Claim 3: (run a program or reveal) the 1000th digit of pi is 9, so false.
  Claim 4: (run a program or reveal) 1234567891 is prime, so true.
  Claim 5: We cannot settle, so we pay $0.50 per share."

  Pay out the shares.

  Debrief (20 min):

  Start with open-ended questions:

  - How did you find the trading? What was easy? What was hard?
  - Were there claims you felt more confident about? Why?

  Then guide:

  - Notice that claims 1 and 2 were about hidden physical states. Claims 3, 4, and 5 were about mathematical facts.
  - For claims 3 and 4, we were able to compute the answer during the session. For claim 5, we couldn't.
  - In the adversary phase, the outside agent was able to make a profit on claims 3 and 4. Why? (Because we didn't know the answer, but the agent did.)
  - Could we have avoided being exploited? Only if we had known the answer.
  - But we are finite, so we can't know all mathematical truths.
  - In the long run, if we had more time to compute, we could have set the price closer to the truth and the agent couldn't exploit us as much.
  - Contrast with claim 1: even with infinite computational power, we couldn't figure out the coin without looking. The uncertainty is different.
  - Finally, claim 5: we may never know the answer. So the uncertainty might be permanent. The market had to set a price even though we don't know and might never know.

  Then introduce the term "logical uncertainty" and contrast it with empirical uncertainty.

  End by touching on the philosophical point: the standard of coherence (avoiding Dutch books) is too strong for logical uncertainty. We need a standard that accounts for our computational limitations, and that ensures we converge to the truth with more computation.

  This should meet the goals.
answer: |-
  Below is a complete design for a 90-minute philosophy reading group session focused on exploring the difference between empirical uncertainty (e.g., a hidden coin flip) and logical uncertainty (e.g., whether a large number is prime), without relying on algebra or symbols. The session uses a betting game with play money to make the concepts tangible, emphasizing the tension between Dutch book coherence and the limitations of finite computation. The key insight is that for logical uncertainty, coherence (having prices that act like probabilities) may be impossible in practice, and a better standard is convergence to truth with more computation (avoiding exploitation by a computationally superior adversary).

  ### **Session Overview**
  - **Duration**: 90 minutes.
  - **Participants**: 9–10 people, including retirees and undergrads. No math beyond basic arithmetic.
  - **Core Idea**: Use a betting game to contrast empirical uncertainty (settled by observation) and logical uncertainty (settled by computation). Introduce an uncomputable claim to challenge the market.
  - **Pedagogical Goal**: Participants should "feel" the difference between uncertainty about hidden states vs. uncomputed truths, and see why logical uncertainty breaks standard Bayesian coherence.
  - **Structure**: 
    - Intro (5 min): Explain rules and claims.
    - Trading (40 min): Bet on claims using play money.
    - Adversary Round (10 min): A computationally powerful "adversary" exploits mispriced logical claims.
    - Settlement (15 min): Reveal outcomes.
    - Debrief (20 min): Connect the game to the concepts of logical uncertainty, convergence, and uncomputability.
  - **Materials**: 
    - Play money ($100 per participant).
    - Whiteboard or flip chart to display claim prices.
    - Props: Cup, coin, deck of cards, laptop for computations.
    - Precomputed results for logical claims (to save time).

  ---

  ### **Claims and Settlement Methods**
  Participants buy/sell "shares" of each claim. Each share pays $1 if true, $0 if false. Prices start at $0.50 and adjust by $0.01 per trade (buy → price ↑, sell → price ↓). Claims are mixed to highlight differences:

  1. **Empirical Claim 1 (Hidden Coin)**:  
     - *Statement*: "The coin under the cup is heads."  
     - *Settlement*: Flip a fair coin at the start, hide under cup. Reveal by lifting cup.  
     - *Why?* Uncertainty is about a fixed, hidden physical state.

  2. **Empirical Claim 2 (Drawn Card)**:  
     - *Statement*: "The drawn card is a heart."  
     - *Settlement*: Shuffle a standard deck, draw one card face-down. Reveal by turning over.  
     - *Why?* Reinforces empirical uncertainty; outcome is fixed but unknown.

  3. **Logical Claim 1 (Digit of Pi)**:  
     - *Statement*: "The 1,000th decimal digit of π is 7."  
     - *Settlement*: Precomputed (actual digit is 9, so **false**). Run a quick Python script on laptop to show the 1,000th digit.  
     - *Why?* Simple computation; uncertainty is about a mathematical fact settled by axioms.

  4. **Logical Claim 2 (Large Prime)**:  
     - *Statement*: "The number 1,234,567,891 is prime."  
     - *Settlement*: Precomputed (it is **true**). Run a primality test on laptop during settlement.  
     - *Why?* Harder to compute by hand; shows how computational limits create uncertainty.

  5. **Uncomputable Claim (Goldbach Conjecture)**:  
     - *Statement*: "The Goldbach conjecture holds for 10^100 (i.e., this even number is the sum of two primes)."  
     - *Settlement*: **Cannot be computed** in the session (or in practice). Explain it is unsolved and pay $0.50/share regardless.  
     - *Why?* To show permanent logical uncertainty—no amount of computing settles it. This will make the market "stumble" naturally.

  ---

  ### **Rules and Payoff Scheme**
  - **Initial Setup**: Each participant gets $100. Claims start at $0.50/share.  
  - **Trading Rules**:  
    - Facilitator acts as market maker. Participants shout "buy [claim]!" or "sell [claim]!" to trade any number of shares.  
    - After each trade, adjust the claim's price by $0.01 (buy ↑, sell ↓). Cap prices at $0 and $1 to avoid negatives.  
    - Record trades on the whiteboard (price and volume).  
  - **Adversary Round**:  
    - After trading, pause and introduce an "adversary" (facilitator in role-play) with superior computing power (e.g., a "supercomputer").  
    - Adversary trades at the **last market price** for logical claims only (not empirical/uncomputable).  
      - If a logical claim is true and price < $1, adversary buys 100 shares.  
      - If false and price > $0, adversary sells 100 shares.  
    - *Why?* To exploit mispricing and show Dutch book vulnerability.  
  - **Settlement Payouts**:  
    - Empirical/Logical Claims: Pay $1/share if true, $0 if false.  
    - Uncomputable Claim: Pay $0.50/share regardless (as announced upfront).  
  - **Key Constraint**: No algebra—use plain language (e.g., "price goes up a penny when you buy").

  ---

  ### **Timeline and Script**
  **Total: 90 minutes**  
  *(Keep it brisk; adjust times if discussion runs long.)*

  #### **1. Introduction (5 min)**  
  *Script*:  
  "Welcome! Today we're playing a betting game to explore uncertainty. You each have $100 in play money. We have five claims—like whether this coin under the cup is heads or whether a big number is prime. You can buy or sell 'shares' of each claim. If the claim turns out true, each share pays $1; if false, it pays $0. I'll act as the market: prices start at 50 cents per share and move a penny with each trade. After trading, we'll settle each claim—some by peeking under the cup, some by running code. One claim can't be settled at all, so we'll pay 50 cents per share no matter what. Goal: Make as much money as you can. Questions? Let's trade!"  

  #### **2. Trading (40 min)**  
  *Facilitator Actions*:  
  - Display claims and prices on the whiteboard. Start all at $0.50.  
  - Encourage trading: "Claim 1 is about the coin—any takers?" or "Claim 4 is a prime number—easy money?"  
  - Update prices after each trade (e.g., if someone buys Claim 3, raise to $0.51).  
  - *Expected Dynamics*:  
    - Empirical claims (1–2) may hover near $0.50 (symmetric uncertainty).  
    - Logical claims (3–4) may drift based on confidence (e.g., math enthusiasts might push prices up/down).  
    - Uncomputable claim (5) may stagnate at $0.50 or drift (no one knows how to assess it).  
  - *Tip*: If trading lags, trade yourself to move prices (e.g., sell Claim 4 to lower the price).

  #### **3. Adversary Round (10 min)**  
  *Script*:  
  "Trading pause! Now imagine a wealthy mathematician with a supercomputer enters. She knows the answers to Claims 3 and 4 instantly. She'll trade at the current prices to make a profit. She doesn't care about the coin, card, or Goldbach claim—only the computable math."  
  *Facilitator Actions*:  
  - For **Claim 3 (Pi digit, false)**: If price > $0 (e.g., $0.60), adversary sells 100 shares.  
  - For **Claim 4 (Prime, true)**: If price < $1 (e.g., $0.70), adversary buys 100 shares.  
  - *Do not adjust prices further*. Announce trades: "She buys 100 shares of Claim 4 at [price]!"  
  - *Why?* Adversary exploits the group's uncertainty, making risk-free profit (e.g., buys Claim 4 at $0.70, gets $1/share later). This shows Dutch book vulnerability.  

  #### **4. Settlement (15 min)**  
  *Script*:  
  "Time to settle! We'll resolve each claim one by one. Watch closely!"  
  *Facilitator Actions*:  
  1. **Claim 1 (Coin)**: Lift cup, reveal coin. Pay $1/share if heads, $0 if tails.  
  2. **Claim 2 (Card)**: Turn card over. Pay $1/share if heart, $0 otherwise.  
  3. **Claim 3 (Pi digit)**: Run Python script showing 1,000th digit is 9 (not 7). Pay $0/share.  
  4. **Claim 4 (Prime)**: Run primality test showing 1,234,567,891 is prime. Pay $1/share.  
  5. **Claim 5 (Goldbach)**: Announce: "We cannot compute this—it's an unsolved math problem! As promised, every share pays 50 cents."  
  - *Note*: For Claim 5, participants may look confused—this is intentional.  

  #### **5. Debrief (20 min)**  
  *Goal*: Connect the game to the core ideas without lecturing. Start open-ended, then guide.  
  *Script*:  
  - **Open (5 min)**: "What stood out? Which claims felt different? How did the adversary affect you?"  
    - *Listen*: Participants may note the adversary "cheated" or that Claim 5 was "weird."  
  - **Contrast Uncertainties (5 min)**:  
    - "For the coin and card, the outcome was fixed but hidden—no amount of thinking could reveal it. But for the pi digit and prime, the answer was always in the math—we just hadn't computed it yet. The adversary had more computing power, so she knew."  
    - "What about Claim 5? It's a math fact too, but we couldn't compute it even with time. It might be forever unknown!"  
  - **Logical Uncertainty and Coherence (5 min)**:  
    - "The adversary made free money on Claims 3 and 4 because your prices weren't 0 or 1. But was that your fault? Could you have known the prime was prime? [No.] So demanding your prices be 'coherent' (like probabilities) right now is unfair—you're finite!"  
    - "Better standard: Prices should *converge to truth* given more computation. The adversary exploited you *this time*, but if we played again with hours to compute, you'd get closer and she couldn't profit as easily. Coherence fails now; convergence wins later."  
  - **Uncomputable Claim (5 min)**:  
    - "Claim 5 unsettled the market because no computation settles it. It's permanently uncertain—not random, just unknowable. In life, we often bet on things like this (e.g., 'Will humans colonize Mars?'). The market has no 'right' price, but we muddled through with 50 cents."  
  - **Close**: "Takeaway: Uncertainty about logic isn't randomness—it's about our limits. We need tools that respect computation, not just coherence."  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Trading is slow or chaotic**:  
     - *Risk*: Shy participants hang back; dominant ones monopolize.  
     - *Fix*: Jumpstart by trading yourself. Ask direct questions: "Alice, buy any Claim 4 shares at $0.50?"  

  2. **Adversary round confuses people**:  
     - *Risk*: Participants think the facilitator is cheating.  
     - *Fix*: Emphasize role-play: "This is a thought experiment—imagine a hacker with a supercomputer!"  

  3. **Uncomputable claim distracts**:  
     - *Risk*: Focus shifts to Goldbach conjecture, not the uncertainty concept.  
     - *Fix*: In debrief, stress: "The point isn't Goldbach—it's that some truths are inaccessible. How do we bet then?"  

  4. **Debrief stays superficial**:  
     - *Risk*: Group misses the convergence vs. coherence point.  
     - *Fix*: Use adversarial profit as a hook: "She exploited us because we couldn't compute fast enough. But with more time, we'd close the gap. That's the real standard!"  

  ---

  ### **What the Game Can't Do (Need to Explain)**  
  - **Convergence in the limit**: The game shows one-off exploitation, but not how repeated play with increasing computation leads to convergence. *Explain*: "If we reran this weekly with more computing time each session, your prices for logical claims would approach 0 or 1, and the adversary couldn't profit forever."  
  - **Formal definitions**: Terms like "Dutch book" or "logical uncertainty" aren't used until debrief. The game makes them visceral, but you must name them afterward.  
  - **Bayesian idealization**: The session exposes the flaw in "ideally rational agents know all logical consequences," but doesn't formalize alternatives. *Bridge*: "Bayesianism assumes infinite brains; we need tools for mortal minds."  

  This design uses play, tension (adversary!), and reflection to make abstract ideas tangible. The uncomputable claim is included—it slightly muddies the water but forces the group to confront permanent uncertainty, which is valuable. If rushed, shorten trading to 30 min and settlement to 10 min. Good luck—your group is lucky to have you!
