prompt: |-
  My friend and I spent like three hours after our data ethics night class arguing about algorithmic fairness and I came away not sure which of my own reactions I actually believe, so I want to write down my gut verdicts and see whether they add up to a principle or whether some of them have to go. The setup we kept circling: a bank's small-business loan model, where group A's default rate is 20% and group B's is 10%, and my friend kept invoking one of those impossibility results — you can't simultaneously have a score that means the same thing for everyone (of the people given a 7, the same share default, whatever group they're in) and equal false-positive and false-negative rates across groups, unless the base rates are identical or the model is perfect — and he said that just settles it, you pick a criterion and eat the cost. Here's where I land on cases. (1) The calibrated version, where the score means the same thing but A eats more of the false positives and B eats more of the false negatives: feels fine to me. (2) The equalized-error-rate version, where we slide the cutoff per group so A and B have identical false positive and false negative rates, with the result that among everyone we flag, 24% of the A borrowers default and 14% of the B borrowers do: feels wrong, and not just because it's worse for the bank — I can't look a rejected applicant in the eye and explain why their 7 isn't the other person's 7. (3) A hospital model predicting surgical complications uses "number of prior C-sections," which tracks the patient's group mostly through unequal access to obstetric care: uncomfortable, but I don't think it has to go, it's carrying information about the body and not only about the hospital. (4) A hiring model uses "completed a coding bootcamp," which tracks the applicant's group mostly through who got pulled into those networks: drop it, that's just laundering group membership. (3) and (4) are the pair I can't reconcile — both are proxies, both add predictive power, I treat them differently. (5) Two vendors: one screens resumes and is individually fair by its own similarity metric, the other ranks the survivors and is individually fair by its metric, and the combined pipeline hires A at half the rate of B. I say that's a real fairness violation even though no component is unfair and neither vendor is allowed to see group; my friend says if every part is fair the whole is fair, which to me is like saying a meal can't poison you if every ingredient is safe. (6) A pretrial release tool: after it's deployed judges release more low-scoring B defendants, and a year later rearrest among released B defendants has dropped, so staying calibrated now requires different cutoffs by group. I think you re-fit and I don't think it's unfair, though my friend calls it ratcheting — the tool's own effect becomes an argument for treating the groups differently.

  My tentative principle, which I made up on the walk home: the right fairness criterion is whichever one constrains a quantity that the person on the receiving end of the decision could be told and act on, so violations live in the *use* of a score, not in the number itself. I'd like you to test that against my six verdicts and repair it — ideally as a short set of candidate principles, each with the clause that buys each verdict and the case that motivates that clause. Then push it on the cases I haven't settled: (a) a hospital that puts the protected attribute directly into a kidney-function estimate because the standard formula mis-estimates for one group, so using it makes everyone's number more accurate; (b) the only way to equalize error rates in the loan model is to deliberately add noise to some scores, so a few genuinely high-risk borrowers get low ones; and (c) the "group" in question is one the system created — everybody the previous version of the model flagged, a class that cuts across A and B and exists only because the model existed. Does my principle even apply to (c), or does it silently assume groups are given in advance? And be honest about which of my verdicts no tidy principle can keep — I'd rather drop one than keep a rule that's definately just a description of what I already felt.
reasoning: |-
  We are given six cases and a tentative principle. The principle is: "the right fairness criterion is whichever one constrains a quantity that the person on the receiving end of the decision could be told and act on, so violations live in the *use* of a score, not in the number itself."

  We are to test this principle against the six verdicts and then use it to analyze three more cases (a, b, c). We also need to check for consistency and whether any verdict must be dropped.

  First, let's recall the six cases and the verdicts:

  1. **Calibrated version**: Scores mean the same thing (same default rate for same score) but group A has more false positives and group B more false negatives. Verdict: Feels fine.

  2. **Equalized error rates**: Different cutoffs by group so error rates are equal, but now the same score (say 7) has different meanings (24% default for A, 14% for B). Verdict: Feels wrong because you can't explain to a rejected applicant why their 7 is treated differently.

  3. **Hospital model using "number of prior C-sections"**: This tracks group mostly due to unequal access. Verdict: Uncomfortable but it carries medical information and should be kept.

  4. **Hiring model using "completed a coding bootcamp"**: Tracks group due to network effects. Verdict: Drop it, because it's just a proxy for group membership.

  5. **Two vendors**: Individually fair at each step but overall hiring rate for A is half that of B. Verdict: This is a fairness violation even though each component is fair.

  6. **Pretrial release tool**: After deployment, the tool's effect changes the base rate and now to stay calibrated requires different cutoffs by group. Verdict: Re-fit and it's not unfair.

  Now, the tentative principle: fairness violations are about the use of the score, not the score itself, and the criterion should be one that the affected person can be told and act on.

  Let's see how the principle applies to each:

  1. In the calibrated version, the score means the same for everyone. If a person is rejected, you can tell them: "Your score indicates a 20% chance of default, and that's above our cutoff." They can act on that by trying to improve their score. So the principle supports keeping it.

  2. In the equalized error rates, a person from group A with a score of 7 might be rejected, while a person from group B with the same score is accepted. The explanation would be: "For your group, a 7 means a 24% chance of default, which is above our cutoff for your group, but for the other group a 7 means 14% and that's below." The person cannot act on this because the same score is interpreted differently by group. The principle explains why it feels wrong: the person cannot be given a single actionable score.

  3. The hospital model: The feature (prior C-sections) is a medical fact about the body. The person can be told: "You have had X prior C-sections, which increases your risk." They can act on that by considering the risks and benefits of surgery. Even though the feature correlates with group (due to social factors), it is not just a proxy for group. The principle allows it because the information is about the individual and actionable.

  4. The hiring model: The feature (bootcamp completion) is a proxy for group. If a person is rejected because they didn't complete a bootcamp, they might ask: "How can I improve?" The answer might be to complete a bootcamp, but if the bootcamp is not accessible (because of network effects) then it's not truly actionable. Moreover, if the real reason is group membership (which is immutable) then it's not something they can change. However, note that the verdict says "drop it" because it's laundering group membership. The principle might support this if we think that the person cannot reasonably act on the feature (because the bootcamp is not accessible to them due to their group) or if the feature is primarily a group proxy. But note: the principle says "could be told and act on". If we tell the person: "You were rejected because you didn't complete a bootcamp", then they could in theory complete one. But if the bootcamp is not available to them, then it's not actionable. So the principle might lead to dropping it if we consider that the actionability is not real.

  5. Two vendors: The overall process leads to disparate impact. The principle focuses on the decision the person receives. If a candidate from group A is rejected, they are told: "You didn't pass the resume screen" or "You were ranked low by the second vendor." But the candidate might not know the inner workings and cannot act on the entire pipeline. However, the principle might not directly explain why the overall outcome is unfair because each step is individually fair. But note: the candidate is only told the outcome of each step, and each step is individually fair. So by the principle, there might not be a violation? But the verdict says there is. This seems to conflict.

     We need to adjust: the principle might be too narrow. The candidate might be told the reason for rejection, but the reason might be due to the combination of steps. The principle doesn't account for the cumulative effect. Alternatively, the candidate might not be told anything about the two-step process, only the final outcome. The principle might then say: the candidate can be told the final score (if any) and act on that. But in this setup, there might not be a single score? The problem doesn't specify. Let's assume the candidate is only told whether they are hired or not. Then the principle might not see a problem because the candidate is not given a score to act on. But the verdict says it's a fairness violation.

     This suggests that the principle might need to be extended to consider the overall outcome and the possibility that the process, while fair step-by-step, leads to group-level disparities that are unjust.

  6. Pretrial release: After re-fitting, the model is recalibrated and now uses different cutoffs by group to account for the changed base rates. The person is told: "Your risk score is X, and for that level of risk, we require Y for release." The score and the cutoff are set by group. But if the group is a protected attribute, then telling a person: "Because you are in group B, we require a lower score for release" might not be something they can act on (they cannot change their group). However, note that the verdict says it's not unfair. The principle might support it if we focus on the risk score: the person can be told their risk score and that it was above the threshold for their group. But the group-based threshold might not be something they can change. Alternatively, if the risk score is calibrated, then the same risk score means the same risk regardless of group, and the threshold is set by the court's risk tolerance. But in this case, the threshold is set per group to account for base rate changes. The principle might break down here because the person is being treated differently based on group.

     However, the verdict says it's acceptable. The principle might be adjusted to allow for group-specific thresholds if the reason is to maintain calibration (so the score remains meaningful) and if the group is a relevant medical or legal category (like sex in kidney function). But in the pretrial case, the group is a protected class (race, perhaps). This is tricky.

  Given the above, let's try to repair the principle. We see that in case 5, the principle as stated might not account for the overall disparate impact. In case 6, it might not easily explain why group-specific thresholds are acceptable.

  We might need multiple principles. Here are candidate principles:

  **Principle 1 (Actionability)**: A decision is fair if the person affected can be given a reason for the decision that is both truthful and about factors they can reasonably act upon to change the outcome in the future.

  **Principle 2 (Meaningful Score)**: When a score is used, it should have the same meaning (calibration) for all individuals, so that a given score represents the same level of risk regardless of group membership.

  **Principle 3 (Transparency and Control)**: If a decision uses group membership, it must be because group membership is directly relevant to the outcome in a way that is medically, legally, or scientifically justified, and the person can be told this and the reason must be non-discriminatory.

  Now, let's map the verdicts:

  1. **Calibrated version**: 
     - Supported by Principle 2 (same meaning for score) and Principle 1 (the person can be told their score and that it was above the cutoff, and they can work to improve their score).

  2. **Equalized error rates**:
     - Violates Principle 2 because the same score has different meanings per group. Also, Principle 1 is violated because the explanation for rejection would be group-dependent and the person cannot change their group.

  3. **Hospital model**:
     - Principle 1: The feature (prior C-sections) is an individual medical factor that the patient can be told about and that is actionable (in the sense of informing consent). Also, Principle 3: The feature is medically relevant even if it correlates with group.

  4. **Hiring model**:
     - Principle 1: The feature (bootcamp) might be actionable in theory, but if it is not reasonably accessible to the person due to their group, then it fails. Also, if it is primarily a proxy for group, then Principle 3 is violated because group membership is not a justified reason for hiring.

  5. **Two vendors**:
     - The principle as stated might not cover this. We need a new principle:

     **Principle 4 (Composition)**: A process composed of individually fair steps must also be evaluated for group fairness at the outcome level if the steps interact in a way that creates disparate impact, especially when the steps are opaque to the applicant.

     Alternatively, we might say that the candidate is not given an actionable reason because the process is too complex and they cannot act to change the outcome. The verdict might require that the overall process should not have unjustified disparate impact.

  6. **Pretrial release**:
     - Principle 2: After re-fitting, the score remains calibrated (same meaning). The group-specific cutoff might be justified by Principle 3 if we consider that the base rate difference is a real difference in risk that must be accounted for to have the score reflect the true risk. But note: the group is a protected class. This is controversial. However, the verdict is that it's acceptable. We might argue that the person can be told their risk score and that the threshold is set by the court for their risk level, without mentioning group? But the threshold is per group. This is a challenge.

     We might adjust Principle 3 to allow group-based adjustments only when there is a compelling and non-discriminatory reason, such as ensuring that the score is equally predictive. But note that in the pretrial context, using race is often legally prohibited.

  Given the complexity, let's try to form a set of principles that capture the verdicts:

  1. **Calibration Principle**: The score should be calibrated (same score implies same risk) across groups. [Supports case 1 and rejects case 2]

  2. **Proxies Principle**: Avoid features that are primarily proxies for protected group membership and are not reasonably actionable. [Supports case 4: bootcamp is dropped because it is a proxy and not reasonably actionable for the disadvantaged group. Case 3 is kept because prior C-sections are not primarily a proxy but a direct medical factor.]

  3. **Outcome Fairness Principle**: Even if each step in a process is individually fair, the overall outcome must not have unjustified disparate impact on protected groups. [Supports case 5]

  4. **Dynamic Calibration Principle**: When base rates change due to the model's deployment, re-fitting to maintain calibration is acceptable and does not introduce unfairness. [Supports case 6]

  Now, let's test these principles on the additional cases:

  (a) **Hospital kidney-function estimate**: The hospital puts the protected attribute (say, race) directly into the formula to correct for inaccuracy. The standard formula misestimates for one group.

     - By the Calibration Principle: The goal is to have the estimate be accurate for each group. So including the protected attribute might be necessary to achieve calibration. 
     - By the Proxies Principle: The protected attribute is not a proxy; it's directly used. But is it justified? In medicine, it might be if there is a biological difference. However, note that race is a social construct and may not be the best way to capture biological variation. But the case says "because the standard formula mis-estimates for one group". 
     - Verdict by our principles: It might be acceptable under the Calibration Principle and the Proxies Principle (since it's not a proxy but a direct adjustment for accuracy). However, we must be cautious: if the adjustment is based on a genuine biological difference, then Principle 3 (from the tentative set) might allow it. But the candidate principles above don't directly address using protected attributes. We might add:

       **Relevance Principle**: Protected attributes may be used only when they are directly and causally relevant to the outcome, and when there is no non-discriminatory alternative that achieves similar accuracy.

     For (a): If the kidney function formula is known to differ by race due to biological factors (like muscle mass differences that affect creatinine), then it might be acceptable. But if the difference is due to social factors (like diet or access to care), then including race might be problematic. The case says the formula misestimates for one group, but doesn't specify why. 

     Our verdict: It might be acceptable if the reason is biological and the attribute is used to improve accuracy for the individual. The person can be told: "The formula we use for kidney function is adjusted for your race because it is a factor in how the test works." They cannot act to change their race, but the goal is to get an accurate medical assessment. So it might be acceptable.

  (b) **Equalizing error rates by adding noise**: To achieve equal error rates, we deliberately add noise so that some high-risk borrowers get low scores.

     - This violates the Calibration Principle because the score no longer means the same thing: a low score might be given to a high-risk person by design. 
     - Also, it violates the Actionability Principle: if a person is given a low score (due to noise) and then defaults, they might have been misled. And if a high-risk person gets a low score and then is approved, they might not be warned. 
     - Verdict: This seems unacceptable by our principles. We would not do it.

  (c) **The "group" is defined by the model**: The group is "everybody the previous version of the model flagged". This group cuts across A and B and exists only because of the model.

     - Our principles so far assume groups are given (like A and B). But here the group is defined by the model's own prior decision.
     - The principle might still apply: the person can be told that they were flagged by the previous model. But that is not a fact about them that they can act on? They might not even know they were flagged by the previous model. 
     - We might need a new principle for when groups are defined by prior decisions. This is a case of "label bias" or "feedback loops". 
     - We might say: if the group definition is based on prior decisions that were unfair, then it perpetuates unfairness. But the case doesn't say the prior model was unfair. 
     - The tentative principle: the person could be told that they were flagged by the previous model and that is why they are in this group. But they cannot change that. So by the Actionability Principle, it might be unfair. 
     - Alternatively, we might not use such a group at all because it is arbitrary and not a meaningful category for the individual. 

     Verdict: This group definition is problematic. We should avoid creating decision rules based on such a group.

  Finally, which verdict might be dropped? 

  Looking back, case 5 (two vendors) is the most challenging for the initial principle. The candidate principles include an Outcome Fairness Principle to cover it. Without that, we might have to drop the verdict and say that if every step is individually fair, then the whole is fair. But the verdict insists it's a fairness violation. Therefore, we keep the Outcome Fairness Principle.

  Similarly, in case 6, the verdict stands with the Dynamic Calibration Principle.

  Now, the set of principles:

  1. **Calibration Principle**: Scores must be calibrated (same score, same risk) across groups.

  2. **Proxies Principle**: Avoid using features that are primarily proxies for protected group membership, unless they are both reasonably actionable and directly relevant.

  3. **Outcome Fairness Principle**: A decision-making process must not result in unjustified disparate impact on protected groups, even if each step is individually fair.

  4. **Dynamic Calibration Principle**: When base rates change, recalibration is acceptable to maintain the meaning of the score.

  5. **Relevance Principle**: Protected attributes may be used only when they are directly and causally relevant to the outcome and when there is no non-discriminatory alternative that achieves similar accuracy.

  Now, applying to the additional cases:

  (a) **Hospital kidney-function**: 
     - By Calibration: Including the protected attribute (if it is race) might help calibration. 
     - By Relevance: If race is causally relevant (due to biological factors) and there's no better alternative, then it might be acceptable.

  (b) **Adding noise to equalize error rates**: 
     - Violates Calibration (scores become uncalibrated) and also Actionability (the score does not truthfully reflect risk). So it is unacceptable.

  (c) **Model-defined group**:
     - This group is not a protected group in the usual sense. It is defined by the model. 
     - The Outcome Fairness Principle might apply if this group correlates with a protected group and the process causes disparate impact. 
     - But the case says the group cuts across A and B. 
     - We might avoid using such a group because it is not a stable or meaningful category for the individual. 
     - The person cannot be told: "You are in this group because the old model flagged you" and then act on that? They cannot change the past. 
     - So by the Actionability Principle (from the tentative principle), it would be problematic. 
     - We might add: 

       **Stable Features Principle**: Groups used for decision-making should be defined by stable, meaningful characteristics, not by prior decisions of the same or similar systems.

     Verdict: Avoid using such a group.

  In conclusion, the initial tentative principle (focus on what the person can be told and act on) is a good starting point but needs to be augmented with principles about calibration, outcome fairness, and the relevance of protected attributes.

  Final candidate principles:

  1. **Actionable Explanation**: The decision should be based on factors that the individual can be truthfully told and that they can reasonably act upon to change future outcomes.

  2. **Calibration**: A predictive score must have the same meaning (same expected outcome) for every individual assigned that score, regardless of group.

  3. **Avoid Harmful Proxies**: Do not use features that primarily serve as proxies for protected group membership unless those features are both directly relevant to the outcome and reasonably actionable.

  4. **Outcome Fairness**: A decision process must not result in unjustified disparities in outcomes across protected groups.

  5. **Dynamic Recalibration**: When the relationship between features and outcomes changes, the model should be updated to maintain calibration.

  6. **Protected Attribute Use**: Protected attributes may be used only when they are directly relevant to the outcome and when the use is necessary to achieve accuracy and fairness, and when there is no non-discriminatory alternative.

  And for the model-defined group (c): we avoid it because it violates the spirit of having stable and meaningful groupings and because it is not actionable.

  We might also note that in case (c), the group is defined by the model itself, which can lead to feedback loops and perpetuate past errors. Therefore, it is generally undesirable.

