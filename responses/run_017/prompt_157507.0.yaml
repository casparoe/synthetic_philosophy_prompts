  Let's outline the branch questions (8 of them) and then the endpoints.

  Proposed branch questions (each with two or three answer options):

  1. **Case: Asymbolia** - A person has a clear sensation (e.g., a burn) and can report intensity and location but is not bothered and even finds it funny. They do not avoid it. Question: Is this person experiencing pain?
     - A: Yes, they are in pain. (The sensation is present, so it's pain.)
     - B: No, because they are not bothered. (Without the negative affect, it's not pain.)

  2. **Case: Reverse asymbolia** - A person has no distinguishable sensation (no burning, stabbing, etc.) but is miserable and wants something to stop. They might point to a body part and say "it hurts" but cannot describe any sensation. Question: Is this person experiencing pain?
     - A: Yes, because they are suffering and want it to stop.
     - B: No, because there is no sensory component.

  3. **Case: Sensation and bother diverge over time** - Consider a person who eats very hot chili. At first, the burning sensation is very intense and bothersome. After years, the burning sensation is just as intense (they can report the same level on a scale) but they now enjoy it. Question: What has changed?
     - A: The bother component has reduced (or disappeared) while sensation remains. (Evidence for separation.)
     - B: They now like the sensation, so the bother is still there but is outweighed by pleasure. (Not evidence for separation.)

  4. **Case: Pain that wrecks your day vs. same intensity in a bored person** - Two people have the same intense headache. One was planning to read a book and can't concentrate. The other had nothing to do and just lies in bed. Question: Is the pain worse for the first person?
     - A: Yes, because it prevents activities and thus causes more harm.
     - B: No, the pain itself is the same; the difference is in the circumstances.

  5. **Offer: The pill before surgery** - A pill that leaves the sensation intact but removes the bother (so you feel the cutting but are not distressed by it). Question: Would you take it?
     - A: Yes, because I don't want to suffer.
     - B: No, because I want to be aware of the damage (or for other reasons).

  6. **Follow-up to the pill offer**: If a doctor gave you the pill without asking, would that be a harm?
     - A: Yes, because I might want to feel the bother to know what's happening.
     - B: No, because it removed suffering and that's the main harm.

  7. **Case: State awful during but wouldn't avoid tomorrow** - A person says, "This pain is terrible right now, but I wouldn't pay to avoid it tomorrow because it's part of a meaningful experience (e.g., childbirth, athletic challenge)." And another person says, "This pain doesn't bother me at all, but I work hard to avoid it because I know it can lead to damage." Question: Which one is more central to the badness of pain?
     - A: The immediate awfulness (the first person) is the core of pain's badness, even if they accept it.
     - B: The motivation to avoid (the second person) is the core, because it protects the body.

  8. **Case: Inflicting the asymbolia state** - Imagine a scientist can induce the asymbolia state (full sensation, no bother) in a subject. Would it be acceptable to do this for an experiment (with consent) or for fun (without consent, just to see the reaction)?
