  We are designing an activity to help students feel the pull of the Rietdijk-Putnam argument without rigging it to be debunked. The goal is for them to experience the reasoning that leads to eternalism (block universe) and then to see the costs of resisting it.

  **Brainstorming Mechanics:**

  1. **Mechanic A: Event Cards with Timestamps and Signal Arrival Times**  
     Each event card would have a coordinate (x,t) and also the time at which a light signal from that event would reach Earth. Students would use strings to represent simultaneity slices (hyperplanes of simultaneity) for their frame. Teams would then mark which events are "now" for them.  
     *Why rejected?* This mechanic is close to what we want but might not sufficiently emphasize the step from simultaneity to reality. It might get bogged down in the calculation of signal delays rather than the metaphysical leap.

  2. **Mechanic B: Betting on Other Frames' "Now"**  
     Teams would bet on what other teams consider simultaneous. The idea is to show that they naturally project their own frame's simultaneity onto others.  
     *Why rejected?* While this would highlight the relativity of simultaneity, it doesn't directly lead to the chain of reasoning for eternalism. It might be too focused on the relativity aspect and not build the necessary tension for the metaphysical argument.

  3. **Mechanic C: Chain of Co-Reality**  
     Teams build a chain of events where each consecutive pair is simultaneous in some frame. This chain connects two timelike separated events, forcing them to see that if reality is frame-relative and transitive, then all events must be real.  
     *Why chosen?* This mechanic builds the argument step by step. It starts with the relativity of simultaneity, then moves to the idea that what is simultaneous with a real event is real, and then uses transitivity to connect events. It naturally leads to the eternalist conclusion and sets up the dilemma for the debrief. I combine this with the betting mechanic to first establish the relativity of simultaneity in a personal way.

