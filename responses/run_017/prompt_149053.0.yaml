  **Final Activity Write-Up**

  **Title:** The Reality Chain: From Simultaneity to Eternalism

  **Setup (15 min):**
  1. Lay out the Minkowski diagram on the floor with masking tape. Space axis (x) horizontal, time axis (t) vertical. Mark events E1-E15 as per the table above. For Andromeda events, use a separate corner with a sign. Each event card has the description and the time its light reaches Earth.
  2. Form six teams of three. Assign frames:
     - Team 1: Earth-rest (horizontal string, v=0)
     - Team 2: Slow outbound (slope 0.5, v=0.5c)
     - Team 3: Fast outbound (slope 0.866, v=0.866c)
     - Team 4: Inbound (slope -0.5, v=-0.5c)
     - Team 5: Turnaround (starts slope 0.5, changes to slope -0.5 at t=10 years)
     - Team 6: Alpha Centauri-rest (horizontal string, but pinned at x=4.37 ly at t=0)
  3. Give each team their string, pins, and a tilt key (a card with a drawn line at the required angle).

  **Round 1: Ledger Compilation (10 min)**
  - Each team pins their string through event E2 (your birth) at (0,0) (for Team 6, through (4.37,0)).
  - They list all events lying exactly on their string. This is their ledger of events happening "now" at the time of E2.
  - Write the list on an index card and pin it on the board.

  **Round 2: Wagering (15 min)**
  - Each team gets 10 credibility chips (paper clips).
  - Assign each team to predict another team's ledger for two specific events (e.g., Team 1 predicts Team 2 for E10 and E3).
  - For each event, they write "YES" or "NO" and wager 1-3 chips.
  - Reveal the actual ledgers. Adjust chips: if correct, gain the wagered amount; if wrong, lose it.
  - Run two wagers per team.

  **Round 3: Turnaround (5 min)**
  - Team 5 changes their string's tilt to -0.5 at t=10 years (event E6).
  - They recompile their ledger for E2 (using the new string through (0,0)).
  - Discuss: Did they change what was real at the time of E2, or discover what was already real?

  **Round 4: Chain-Building (10 min)**
  - Task: Build a chain from E1 (Socrates' birth) to E3 (Mars landing) where each consecutive hop is between two spacelike events that are simultaneous in some frame.
  - Teams can borrow any frame (adjust string tilt as needed) to cover a hop.
  - Expected chain: E1 to E10 (using v=0.00096) then E10 to E3 (using v=0.00002).

  **Round 5: Bookkeeping (10 min)**
  - Two volunteers fill in a pairwise reality table (for every pair of events, are they real together?).
  - They must use: if two events are simultaneous in any frame, mark "real together".
  - They try to make the relation transitive.
  - When they run into trouble (all events become real together), present the four options.

  **Debrief (20 min):**
  1. Recap the rounds and map to the argument:
     - Ledger and wagering: Relativity of simultaneity.
     - Turnaround: The objectivity of events (the events don't change; the frame does).
     - Chain: If simultaneity implies co-reality and co-reality is transitive, then we connect past and future.
     - Bookkeeping: The only consistent way is to accept all events are real (eternalism) or reject one of the steps.
  2. Premise breakdown: The transitivity of co-reality is the step I reject (introduce fragmentalism).
  3. Introduce terms:
     - Eternalism/block universe: All events real.
     - Presentism: Only present events real.
     - Growing block: Past and present real.
     - Fragmentalism: Co-reality is not transitive; reality is frame-relative and non-unified.
  4. Resistance moves not in the activity:
     - Denial of P2: Why should frame-relative simultaneity confer reality?
     - Denial of transitivity: Co-reality might not be transitive.
     - The argument assumes a fixed, flat spacetime.

  **Predictable Problems:**
  - Students focus on knowledge: Constantly remind that the issue is what exists, not what we know.
  - Teams nudge strings: Monitor and correct.
  - "What's the fuss?" student: Redirect to the chain and bookkeeping.
  - Spatial dimensions: Acknowledge the simplification.
  - Turnaround feels like a trick: Emphasize the frame change, not event change.

  **Unreproducible Feature:**
  The argument assumes that events have definite properties independently of any frame (they are "real" in an absolute sense). But the activity, by using fixed event cards, presupposes this. The distinction between reality and knowability/determinateness is not experienced; it has to be explained.
