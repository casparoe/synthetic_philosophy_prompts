     - The wagering: Shows that we naturally project our frame onto others, but that is mistaken.  
     - The turnaround: Shows that even for the same event (your birth), what is simultaneous with it is not a matter of perspective that changes, but a fact that is discovered (or does it change?).  
     - The chain: If we assume that (i) simultaneity with a real event confers reality and (ii) the relation of co-reality is transitive, then we can chain together events that are arbitrarily far apart in time. (The core of the Rietdijk-Putnam argument)  
     - The bookkeeping: Shows that the transitivity leads to the conclusion that all events are real together (the block universe) and that the alternatives are costly.

  2. **Premises and the false one:**  
     The argument:  
       P1: Relativity of simultaneity (established by the ledger and wagering).  
       P2: What is simultaneous with a real event is also real.  
       P3: Co-reality is transitive.  
       Conclusion: All events are real.  
     I think P3 (transitivity) is false. The activity should make P2 feel natural and P3 feel forced by the chain.  

  3. **Introduce terms:**  
     - Block universe / eternalism: The view that all events are equally real (the conclusion).  
     - Presentism: Only the present is real.  
     - Growing block: The past and present are real, but the future is not.  
     - Fragmentalism: Reality is not unified; different events are real in different frames (but then we must drop transitivity).  
     These are introduced during the debrief when discussing the bookkeeping round and the options.

  4. **Resistance moves not surfaced:**  
     - The denial of P2: Why should simultaneity (even in a frame) confer reality? The activity assumes that if two events are simultaneous in a frame, then they are both real. But a presentist might deny that.  
     - The denial of the transitivity of co-reality: The chain assumes that if A and B are co-real and B and C are co-real, then A and C are. But that might be rejected (leading to fragmentalism).  
     - The objection that the argument relies on a static spacetime structure: But in general relativity, spacetime is dynamic.  

     You will have to supply these.

  **What Will Go Wrong:**

  1. **Students focus on knowledge, not reality.**  
     *Handling:* Stress at the beginning and during the ledger round that the ledger is about what is happening now (simultaneous), not what we can know. During the debrief, explicitly separate the epistemic and metaphysical issues.

  2. **Teams nudge string angles.**  
     *Handling:* Provide clear tilt keys and monitor. If they change, remind them that the frame is inertial and fixed.

  3. **"What's the fuss?" student.**  
     *Handling:* Acknowledge that the relativity of simultaneity is accepted, but the metaphysical implications are what we are exploring. The chain exercise is designed to show that it leads to a surprising conclusion.

  4. **Spatial dimension suppressed.**  
     *Handling:* Note that the diagram is 1+1 spacetime, but the argument generalizes to 3+1. The Andromeda events are far away in space, so the one spatial dimension suffices.

  5. **Turnaround jump looks like a trick.**  
     *Handling:* Emphasize that the turnaround team is changing frames, not changing history. The events are fixed. The change in the ledger reflects a change in perspective, but the facts about the events don't change.

  **Limitation:**  
  The activity cannot reproduce the difference between an event's being real and its being determinate or knowable. The argument conflates reality with determinateness, but the activity treats the events as fixed and determinate. This must be addressed in the debrief: the Rietdijk-Putnam argument assumes that the events have definite properties independently of any frame, but that assumption might be questioned.

  Also, the activity assumes a global Minkowski spacetime. In a curved spacetime, the argument might not hold. This is a deeper limitation.

