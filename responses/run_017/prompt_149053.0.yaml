  ### **Brainstormed Mechanics & Selection Rationale**
  I considered three core mechanics to evoke the Rietdijk-Putnam argument’s "pull" toward eternalism:  
  1. **Event "Reality" Tagging:** Teams tag events as "real" or "not real" using their frame’s simultaneity slice. *Rejected* because it risks framing reality as a binary choice, obscuring the transitive chain logic central to the argument.  
  2. **Frame-Dependent Timeline Narration:** Teams narrate "what’s happening now" in their frame, including distant events. *Rejected* because it emphasizes storytelling over the metaphysical tension between frames and may not force confrontation with transitivity.  
  3. **Co-Reality Chain + Wagering:** Teams build chains of events deemed "real together" across frames, paired with wagering on frame-dependent simultaneity judgments. *Chosen* because:  
     - Wagering induces visceral surprise when students project their frame onto others (highlighting relativity’s non-intuitiveness).  
     - Chain-building concretizes the transitive step from simultaneity to universal co-reality.  
     - The combination surfaces resistance naturally (e.g., "Why must reality be transitive?") without rigging a debunk.  

  ---

  ### **Activity: The Co-Reality Chain**  
  **Setting:** Flat seminar room with clear floor space. Materials: Masking tape, string, index cards, pins, whiteboard, projector.  
  **Diagram Setup (15 min):**  
  - Draw a Minkowski diagram on the floor (1 space dimension, 1 time dimension). **Axes:**  
    - *Space (x):* Horizontal axis. Mark: Earth (x=0), Alpha Centauri (x=4.37 ly), Andromeda (x=2.5e6 ly).  
    - *Time (t):* Vertical axis (t=0 is "now" on Earth). Scale: 1 meter = 100 years (for visibility).  
  - **Place 14 events** (index cards) with coordinates, descriptions, and **signal-arrival times** (when light reaches Earth):  

  | Event | Description                     | x (ly)      | t (yr)     | Signal to Earth (yr) | Spacelike/Timelike Pairs (Key Examples) |
  |-------|---------------------------------|-------------|------------|----------------------|----------------------------------------|
  | E1    | Earth: Socrates born            | 0           | -2400      | -2400                | E1-E10 spacelike (Δt=2400 < Δx=2.5e6) |
  | E2    | Earth: You born (NOW)           | 0           | 0          | 0                    | E2-E10 spacelike (Δt=0 < Δx=2.5e6)    |
  | E3    | Earth: First Mars landing       | 0           | 50         | 50                   | E3-E11 spacelike (Δt=950 < Δx=2.5e6)  |
  | E4    | Ship: Departs Earth to Andromeda| 0           | 0          | 0                    | E4-E5 timelike (ship worldline)       |
  | E5    | Ship: Midway to Andromeda       | 1.25e6      | 1000       | 2.25e6               | E5-E9 spacelike (Δt=1000 = Δx=1.25e6) |
  | E6    | Ship: Arrives at Andromeda      | 2.5e6       | 2000       | 4.5e6                | E6-E2 spacelike (Δt=2000 < Δx=2.5e6)  |
  | E7    | Andromeda: Alien city built     | 2.5e6       | -1000      | 1.5e6                | E7-E1 spacelike (Δt=1400 < Δx=2.5e6)  |
  | E8    | Andromeda: Alien war ends       | 2.5e6       | 0          | 2.5e6                | E8-E2 spacelike (Δt=0 < Δx=2.5e6)     |
  | E9    | Andromeda: Supernova            | 2.5e6       | 3000       | 5.5e6                | E9-E3 spacelike (Δt=2950 < Δx=2.5e6)  |
  | E10   | Alpha Centauri: Ice age ends    | 4.37        | -1000      | 1004.37              | E10-E7 spacelike (Δt=0 < Δx≈2.5e6)    |
  | E11   | Alpha Centauri: Alien life      | 4.37        | 0          | 4.37                 | E11-E2 spacelike (Δt=0 < Δx=4.37)     |
  | E12   | Alpha Centauri: Colony founded  | 4.37        | 100        | 104.37               | E12-E3 timelike (Δt=50, Δx=0 via Earth) |
  | E13   | Alpha Centauri: Supernova       | 4.37        | 500        | 504.37               | E13-E9 spacelike (Δt=2500 < Δx≈2.5e6) |
  | E14   | Earth: Distant supernova observed| 0           | 5.5e6      | 5.5e6                | E14-E9 timelike (light signal)        |

  - **Mark spacelike/timelike:** Use string to connect pairs:  
    - *Spacelike:* Red string (e.g., E1-E10, E2-E8, E3-E9).  
    - *Timelike:* Blue string (e.g., E1-E2, E4-E5-E6, E12-E3).  

  **Teams & Frames (6 teams of 3):**  
  Each team gets a string (their simultaneity slice) and a **tilt key** (small card showing their frame’s angle):  
  - Team 1: Earth-rest (v=0; horizontal string).  
  - Team 2: Slow outbound to Andromeda (v=0.5c; string tilt = 26.6°).  
  - Team 3: Fast outbound to Andromeda (v=0.9c; string tilt = 42°).  
  - Team 4: Inbound from Andromeda (v=-0.5c; string tilt = -26.6°).  
  - Team 5: Turnaround (starts as Team 2; changes to Team 4’s tilt at t=1000 yr).  
  - Team 6: Alpha Centauri-rest (v=0; horizontal string, but origin at x=4.37 ly).  

  ---

  ### **Rounds (50 min total)**  
  **Round 1: Ledger Commitment (10 min)**  
  - Teams pin their string through E2 (t=0, x=0) to define their "now" slice.  
  - They list events on their string (e.g., Earth-rest: E2, E8; Fast outbound: E2, E7).  
  - Write ledger on index card (e.g., "Our NOW: E2, E7, E11") and pin to board. *No peeking at others!*  

  **Round 2: Simultaneity Wagering (15 min)**  
  - **Goal:** Teams predict another team’s ledger to expose frame-projection bias.  
  - **Chips:** Each team gets 5 "credibility chips" (colored paper clips). Chips convert to **debate-speaking time** in the final discussion (1 chip = 30 sec; valuable but costs nothing).  
  - **Wagering:**  
    - Teams randomly paired (e.g., Team 1 wagers on Team 4).  
    - Wager on whether a *specific event* is in the other team’s ledger (e.g., "Is E8 in Team 4’s NOW?").  
    - 2 rounds:  
      - *Round 1:* Wager on one event (e.g., E8 for inbound frame).  
      - *Round 2:* Wager on a different event (e.g., E11 for Alpha Centauri frame).  
    - **Payoff:** Correct = gain chips wagered; wrong = lose chips. Max 3 chips/wager.  
  - **Predicted loss:** Earth-rest (Team 1) assumes inbound frame (Team 4) shares their "now" (E8), but Team 4’s slice includes E10 instead → chips lost.  

  **Round 3: Turnaround Jump (5 min)**  
  - Team 5 recalculates their ledger:  
    - *First pass:* String tilt 26.6° through E2 (e.g., includes E7).  
    - *At t=1000 yr:* Change tilt to -26.6° and repin through E2. New slice includes E10, not E7.  
  - **Facilitator prompt:** *"Did Team 5 discover what was always real at E2, or change reality? Discuss in teams for 2 min."*  

  **Round 4: Chain-Building (10 min)**  
  - **Task:** Build a chain from E1 (Socrates) to E12 (Alpha Centauri colony) using spacelike hops.  
  - **Rules:**  
    - Each hop must be spacelike and lie on *some* team’s simultaneity string.  
    - Teams pin strings to validate hops (e.g., hop E1→E8: Earth-rest string pinned to include both).  
  - **Expected sequence:**  
    E1 (t=-2400) → **E8** (spacelike; Δx=2.5e6, Δt=2400 → v=0.00096c) → **E11** (spacelike; Δx≈2.5e6, Δt=0 → v=0) → E12.  
  - **Facilitator prompt:** *"Find two hops: first to an event simultaneous with E1 in one frame, then to one simultaneous with E12 in another. Hint: Andromeda and Alpha Centauri events are ‘hubs’."*  

  **Round 5: Global Bookkeeping (10 min)**  
  - Two "bookkeeper" students build a table: For each event pair, mark ✓ if "real together" (simultaneous in any frame).  
  - **Conflict:** E1 and E12 must be "real together" (via E8 and E11), but E1 is past, E12 future → forces universal co-reality.  
  - **Four exits (framed as student questions):**  
    1. *Contradictions allowed?* "Can A be real with B, B with C, but A not with C?"  
    2. *Drop transitivity?* "Is co-reality non-transitive?"  
    3. *Privileged frame?* "What if one frame’s ‘now’ is objectively real?"  
    4. *Relativize reality?* "Is reality frame-dependent?"  
  - **Sharpest question per exit:**  
    1. "Does reality tolerate contradictions?"  
    2. "If A and B are real together, and B and C are too, why *shouldn’t* A and C be?"  
    3. "Which frame is privileged? How would we know?"  
    4. "If reality is relative, what does ‘real together’ even mean?"  

  ---

  ### **Debrief (20 min)**  
  **Map Activity to Argument:**  
  - *(a) Ledger & Wagering:* Relativity of simultaneity (teams lose chips projecting their frame).  
  - *(b) Turnaround Jump:* Reality is discovered, not changed (E2’s co-realities were fixed).  
  - *(c) Chain-Building:* If simultaneity confers co-reality (premise 1) and co-reality is transitive (premise 2), then E1→E12 forces universal co-reality.  
  - *(d) Bookkeeping:* Shows premise 2 (transitivity) drives the argument.  

  **Premises & Conclusion:**  
  - "The argument concludes that *all* events are real (eternalism) because:  
    1. Relativity of simultaneity → no privileged ‘now’.  
    2. What’s simultaneous with a real event is co-real.  
    3. Co-reality is transitive.  
    I reject **premise 3** (transitivity). The activity makes premise 2 feel intuitive, but the chain forces premise 3 to do the heavy lifting."  

  **Introduce Terms (First Time Here):**  
  - **Eternalism/block universe:** All events equally real (the conclusion). *Mapped to bookkeeping conflict.*  
  - **Presentism:** Only present events real. *Contrasted with chain’s past-future link.*  
  - **Growing block:** Past/present real, future open. *Noted as incompatible with spacelike co-reality.*  
  - **Fragmentalism:** Co-reality is non-transitive (reality is "fragmented"). *Mapped to exit 2.*  

  **Resistance Moves to Supply (Not Surfaced):**  
  1. "Simultaneity ≠ reality: Why assume frame-relative ‘now’ confers existence?" (Denies premise 2.)  
  2. "Reality requires causal connectability: Spacelike-separated events can’t share reality." (Challenges premise 1.)  
  3. "Tensed facts: ‘WAS real’ vs. ‘IS real’ breaks transitivity." (Defends growing block.)  

  ---

  ### **Predictable Problems & Handling**  
  1. **"This is about knowledge, not existence!"**  
     - *Handling:* Preempt by saying: *"Your ledger lists what’s happening now, not what you know. E.g., E8 is happening at t=0 in your frame, even if you won’t see it for 2.5m years."*  

  2. **Teams nudge string angles.**  
     - *Handling:* Assign a "frame integrity monitor" per team to enforce tilt rules. Use tilt-key cards as physical guides.  

  3. **"So what? Simultaneity is relative—big deal."**  
     - *Handling:* Redirect to the chain: *"Why does linking Socrates to a future colony via ‘real together’ feel paradoxical? What would you give up to avoid it?"*  

  4. **Spatial dimension suppressed.**  
     - *Handling:* Acknowledge: *"We use 1D space for simplicity, but spacelike separation works the same in 3D. Andromeda’s distance matters, not direction."*  

  5. **Turnaround jump seems "tricky".**  
     - *Handling:* Stress: *"Team 5 changed frames, not history. The events didn’t move; their perspective did. Did they discover or invent E10’s reality at E2?"*  

  ---

  ### **Unreproducible Limitation**  
  **The activity cannot reproduce the distinction between *reality* and *determinateness*.** Students experience events as fixed and determinate (via pre-printed cards), but the argument equivocates "real" with "having definite truth values." You must testify:  
  - *"The argument assumes that spacelike-separated events have definite properties (e.g., ‘Alien war ended at E8’) independently of any frame—but relativity only requires this for timelike-separated events. This is why some philosophers reject premise 2."*  

