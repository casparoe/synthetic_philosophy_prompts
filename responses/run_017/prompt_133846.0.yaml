answer: |-
  Here is a decision tree for navigating positions on failed replication and reform, built according to your specifications.

  **Decision Tree: Positions on Failed Replication & Reform**

  1.  **Vignette 1: Your Case.** Two months ago, a multi-site replication of your published result returned an effect estimate roughly a quarter the size of the original, with a confidence interval that contained zero and also most of the original estimate. **Does this outcome primarily indicate: (A) A problem with the original experimental procedure or analysis? (B) That the true effect varies substantially across contexts/populations? (C) That published literature in this field systematically overestimates effects?**
      *   **If A (Problem with Original):** Go to 2
      *   **If B (Effect Varies):** Go to 3
      *   **If C (Systematic Overestimation):** Go to 4

  2.  **Is the core target of inference in your field (e.g., for theory-building) best understood as: (A) A stable population-average effect size? (B) A mechanism that might be present in some settings and absent in others?**
      *   **If A (Stable Average):** Go to 5
      *   **If B (Contextual Mechanism):** Go to 6

  3.  **Vignette 2: Replication Design.** A different lab, skeptical of a high-profile study claiming a large effect of Intervention X on Outcome Y, proposes a replication. **Who should have the final say on the exact operationalization of Intervention X, Outcome Y, and the expected effect size used for power analysis: (A) The replicating lab? (B) The original authors?**
      *   **If A (Replicators):** Go to 7
      *   **If B (Original Authors):** Go to 8

  4.  **What is the most appropriate unit for appraising scientific reliability: (A) A single published paper/claim? (B) The cluster of claims produced by a specific lab? (C) The entire field's published output?**
      *   **If A (Single Paper):** Go to 9
      *   **If B (Lab Cluster):** Go to 10
      *   **If C (Entire Field):** Go to 11

  5.  **How should a field's reliability best be audited: (A) By randomly sampling published claims and replicating them (like a financial audit, caring about the batch error rate)? (B) By targeted adversarial replication of the most famous/contested findings?**
      *   **If A (Random Audit):** Go to 12
      *   **If B (Targeted Audit):** Go to 13

  **Leaves (Positions):**

  *   **Leaf 1 (Path: 1A, 2A, 3A, 4A, 5A):** Keep long-run error rates and fix research conduct. (Commitment: Strict adherence to pre-registration, large samples, transparency; focus on controlling Type I/II error rates across many studies.) Awkward: This requires near-universal adoption to be effective and struggles with perverse incentives (e.g., p-hacking just below 0.05 remains possible). *(Conventional: Strict Frequentist Reform)*
  *   **Leaf 2 (Path: 1A, 2A, 3A, 4A, 5B):** Abandon testing in favour of estimation and intervals. (Commitment: Report estimates with credible or confidence intervals; deemphasize binary "significant/non-significant" decisions.) Awkward: Difficult to integrate with theory building/testing that often requires categorical predictions. *(Conventional: Estimation-Focused Reform)*
  *   **Leaf 3 (Path: 1A, 2A, 3B, 4A, 5A):** Replace p-values with Bayes factors using personal priors. (Commitment: Quantify evidence for H1 vs H0 using Bayesian updating starting from individual researchers' reasoned priors.) Awkward: Requires explicit, defensible priors for every analysis, leading to potential subjectivity disputes. *(Conventional: Subjective Bayesian)*
  *   **Leaf 4 (Path: 1A, 2A, 3B, 4A, 5B):** Use default or reference priors for Bayes factors. (Commitment: Use standardized, weakly informative priors for Bayes factors to avoid subjectivity while retaining Bayesian evidence quantification.) Awkward: Default priors can be contentious and may not reflect genuine uncertainty well for specific cases. *(Conventional: Objective/Reference Bayesian)*
  *   **Leaf 5 (Path: 1A, 2A, 3A, 4B, 5A):** Judge evidence by likelihood ratios alone. (Commitment: Focus purely on the likelihood function (P(Data|Hypothesis)) for evidence assessment, avoiding priors and posterior probabilities.) Awkward: Difficult to make decisions or compare non-nested models without additional principles. *(Conventional: Likelihoodist)*
  *   **Leaf 6 (Path: 1A, 2B, 3A, 4C, 5A):** Leave the statistics alone and fix the institutions instead. (Commitment: The core problem is incentives (publication bias, reward structures), not methods; reform peer review, funding, promotion.) Awkward: Doesn't address how to interpret individual studies statistically *now*, while waiting for slow institutional change. *(Conventional: Institutional Reformist)*
  *   **Leaf 7 (Path: 1A, 2B, 3B, 4C, 5B):** The real problem is weak theory rather than weak method. (Commitment: Irreproducibility stems from vague, non-falsifiable theories; focus on developing precise, mechanistic predictions.) Awkward: Requires a fundamental shift in how many fields formulate and test hypotheses, potentially slowing progress initially. *(Conventional: Theory-Focused Critic)*
  *   **Leaf 8 (Path: 1C, 4C, 5A):** Keep long-run error rates and fix the conduct of research rather than the arithmetic. (Commitment: Same as Leaf 1, but driven by the diagnosis of systematic overestimation.) Awkward: Same as Leaf 1. *(Conventional: Strict Frequentist Reform - Systemic View)*
  *   **Leaf 9 (Path: 1B, 3A, 4A, 5B):** **Unnamed.** (Commitment: Effects are inherently variable; replicators design replications to map boundaries; appraise single claims cautiously.) Awkward: Makes meta-analysis and generalizable theory exceptionally difficult. (Reason empty: Unattractive? Coherent but underdeveloped?)
  *   **Leaf 10 (Path: 1B, 3B, 4B, 5A):** **Unnamed.** (Commitment: Effects vary; original authors design crucial replications; appraise a lab's overall track record; audit randomly.) Awkward: Grants original authors significant control over potentially disconfirming evidence. (Reason empty: Unattractive? Potential conflict of interest.)
  *   **Leaf 11 (Path: 1C, 4C, 5B):** **Unnamed.** (Commitment: Systemic overestimation; field-level appraisal; audit via targeted adversarial replications.) Awkward: Could lead to a "replication police" dynamic and neglect less flashy but important work. (Reason empty: Unattractive? Coherent but radical?)
  *   **Leaf 12 (Path: 1A, 2A, 3A, 4C, 5A):** The amount of irreproducibility we observe is roughly what our methods predict and is not a crisis. (Commitment: Current methods (e.g., p<0.05) imply a high false positive rate in a literature with publication bias; observed rate is unsurprising.) Awkward: Accepts that a substantial portion of published findings are likely false as the cost of doing business. *(Conventional: Methodological Realist / Crisis Skeptic)*
  *   **Leaf 13 (Path: 1A, 2B, 3A, 4C, 5B):** Leave the statistics alone and fix the institutions instead. (Commitment: Same as Leaf 6.) Awkward: Same as Leaf 6. *(Conventional: Institutional Reformist - Mechanism View)*

  **Unoccupied Combinations:**
  1.  **Path to Unnamed Leaf 9 (1B, 3A, 4A, 5B):** Effect varies (1B), replicators design (3A), single paper unit (4A), targeted audit (5B). *Reason empty:* Unattractive. Targeted audit clashes with belief in inherent variability – why target specific claims if all are context-dependent? Single-paper appraisal is ill-suited to mapping variability.
  2.  **Path to Unnamed Leaf 10 (1B, 3B, 4B, 5A):** Effect varies (1B), original authors design (3B), lab cluster unit (4B), random audit (5A). *Reason empty:* Unattractive/Incoherent? Granting original authors design control over replications testing *their* variable-effect claims creates conflict. Randomly auditing lab clusters is feasible but clashes with the variability focus – why audit clusters randomly if effects vary per context?
  3.  **Path to Unnamed Leaf 11 (1C, 4C, 5B):** Systematic overestimation (1C), entire field unit (4C), targeted audit (5B). *Reason empty:* Unattractive? While coherent (target auditing makes sense for systemic bias), it risks creating a adversarial, high-profile "gotcha" culture rather than systematic assessment.

  **Indistinguishable Pairs (Requiring Further Question):**
  1.  **Leaf 1 vs Leaf 8:** Both advocate fixing conduct/long-run error rates. They differ only in *why* (Problem w/ Original vs Systemic Overestimation). *Separating Question:* "Is the high failure rate primarily due to identifiable flaws in individual studies (Leaf 1), or an inevitable consequence of publication incentives acting on valid-but-noisy methods (Leaf 8)?"
  2.  **Leaf 6 vs Leaf 13:** Both are Institutional Reformists. They differ only in their view of the inference target (Stable Average Leaf 6 vs Contextual Mechanism Leaf 13). *Separating Question:* "Even with perfect institutions, should the primary statistical output be a stable effect size estimate (Leaf 6) or evidence for/against a contextual mechanism (Leaf 13)?"

  **Your Path:**
  *   Start: Vignette 1 (Your Case). You answered **A (Problem with Original)**. Go to 2.
  *   Question 2 (Inference Target). You answered **B (Contextual Mechanism)**. Go to 3? *Wait!* The tree structure shows Question 3 follows a "B" answer at Q1. Your answer at Q1 was "A". Following Q1A leads to Q2, and your Q2 answer ("B") leads to **Go to 6**.
  *   Question 6 is **Vignette 2: Replication Design**. *This question is not directly answered by your initial commitments.* Your path is now: 1A, 2B -> Go to 6 (Vignette 2). You need to answer Vignette 2: **Who controls replication design? (A: Replicators / B: Original Authors)**.
      *   If you answer **A (Replicators)**, path is 1A, 2B, 3A -> Go to 4.
      *   If you answer **B (Original Authors)**, path is 1A, 2B, 3B -> Go to 4.
  *   Question 4 is **Unit of Appraisal**. *This is not answered by your initial commitments.* You need to answer: **Unit? (A: Single Paper / B: Lab Cluster / C: Entire Field)**.
      *   Path after Q4 depends on Q4 answer and then goes to Q5.
  *   Question 5 is **Audit Strategy**. You committed to **A (Random Audit)**. *But you must reach Q5 first.*
  *   **Conclusion:** With only your initial commitments (1A, 2B, 5A), **you land on no single leaf yet**. You need to answer Vignette 2 (Q3) and the Unit of Appraisal (Q4). Based on your known answers:
      *   You are committed to: Problem w/ Original (1A), Contextual Mechanism (2B), Random Audit (5A).
      *   Your position will be either **Leaf 6** (1A, 2B, 3A, 4A, 5A), **Leaf 13** (1A, 2B, 3A, 4C, 5B? *Conflict - you said 5A*), or potentially **Unnamed Leaf 9** (1B? *Conflict - you said 1A*) depending on Q3 and Q4 answers. *The tree structure shows that from 1A,2B -> Go to 6 (Vignette 2). From 3A (Replicators) -> Go to 4. From 4A (Single Paper) -> Go to 5. Your answer 5A then leads to* **Leaf 6: Leave the statistics alone and fix the institutions instead.** *If you answered Q4 as C (Entire Field), the path 1A,2B,3A,4C -> Go to 5, and your 5A leads to* **Leaf 12: ...irreproducibility...not a crisis.** *This seems incongruent with your diagnosis (1A: Problem w/ Original).*

  **Your Most Likely Leaf (given 1A, 2B, 5A and assuming Q3A/Replicators & Q4A/Single Paper): Leaf 6.** Commitment: Leave statistics alone, fix institutions. Awkward: Doesn't address how to interpret individual studies statistically *now*.
