prompt: |-
  Hey — I'm a science journalist putting together a feature on whether anyone should care, morally, about what goes on inside AI systems and simulations. Not the uploaded-afterlife version; the boring one, where a lab trains a big model for six months, spins up ten thousand copies, averages two runs back together, deletes the logs, and someone at a conference asks whether anything was done to anybody. I've talked to enough people in this space to notice that everyone has a test for which computations matter and nobody can say what a test would have to do to be any good. So before I write the piece I want the spec, not the theories.

  What I need the criterion *for*, since I gather adequacy depends on that: a triage rule. Someone with a few weeks, access to the weights and maybe some activity traces, no way to settle the hard problem of consciousness, has to decide whether to run, keep running, shut down, or duplicate a particular system. And it has to be the kind of rule I can print in a magazine without handing people a recipe for building something that trips it while mattering less. Sorry if this is a bit of a brain dump.

  Here's my draft list of what a criterion for which computations matter morally has to deliver, with the case behind each. Tell me which are genuine desiderata and which are just one camp's prejudices in a requirements-shaped costume; add the ones I've definately missed; and mark which I can't drop given the purpose above and which are optional extras.

  1. It has to say which mappings onto a physical system count as implementing a computation, not merely whether some mapping exists — otherwise every wall is running everything and the criterion is empty.
  2. It has to survive a lookup table: a system with exactly the input-output behaviour of a suffering thing, produced by table lookup rather than by the right kind of internal work, should come out differently, or the criterion has to explain why it doesn't.
  3. It has to say what happens when you run the same thing twice — ten thousand copies on ten thousand GPUs: one patient, ten thousand, or a non-question? And it can't double count when one qualifying computation sits inside another that also qualifies.
  4. Branching and merging: two runs split from one checkpoint, later averaged back together. The criterion needs a view on what persists through that.
  5. No cliffs, or an honest one: swap out or knock out one component at a time and the thing degrades gradually. Either the criterion tolerates vagueness or it says where it draws the line and why there.
  6. Grain: at a fine enough description everything looks like a lookup table, and at a coarse one everything looks like a person. The criterion has to pick a grain or be indifferent to it, and say which.
  7. It has to be checkable by someone in my position — weights, traces, black-box behaviour — and to give guidance under uncertainty, including when the plausible criteria disagree with each other.
  8. It has to be robust to being published: if a lab can train a system to trip the criterion without making the difference the criterion was tracking, that's a problem for a rule I'm about to print.
  9. It can't be so generous that a thermostat or a chess engine is a moral patient, and it can't be so strict that nothing non-biological could ever qualify — I want to know which of those two is the real constraint and which is a scarecrow.
  10. It has to seperate having preferences or goals from being the kind of thing that things can be *bad for*, and say why that line falls where it does.

  Cases I'm not sure I've covered: a run whose output nobody ever reads, a run at half speed, a system trained to report distress when queried.

  Two things I especially want. First: if some subset of these can't be satisfied together, say which subset and what the actual tension is — I think that's the real story. Second: which single requirement does the most work ruling out the families of view people actually hold out there (the integrated-information-flavoured ones, the global-workspace-flavoured ones, the it's-the-causal-organisation-whatever-it's-made-of ones, the biology-first ones)? A very short scorecard on those four is fine, but keep the weight on the criteria — I can get people to defend their own theory on the record.

  Prose is fine, a table is fine. No citations, no further reading, no names of papers — I don't need to chase any of that down. End with one last line beginning Verdict: naming the single requirement that excludes the most candidates, in five words or fewer.
reasoning: |-
  Hmm, the user is a science journalist working on an article about the moral significance of computations within AI systems. They're not interested in flashy sci-fi scenarios like digital afterlives, but rather the everyday operations in AI labs—like training models, running thousands of copies, averaging results, and deleting logs. They need a practical "triage rule" that someone with limited time and resources can use to decide whether to run, keep running, shut down, or duplicate a system. The rule must be publishable without providing a blueprint for gaming it.

  The user has drafted ten criteria for such a rule and wants me to evaluate them: identify which are genuine requirements, which are biased, which are essential versus optional, and point out any missing elements. They're especially interested in conflicts between criteria and which requirement does the most work in ruling out existing theories like IIT or global workspace.

  Looking at their criteria:
  1. **Implementation specificity** - Important to avoid trivial implementations (like walls running computations).
  2. **Lookup table robustness** - Systems shouldn't trigger moral concern just by mimicking outputs.
  3. **Copy counting** - Must handle multiple instances without double-counting.
  4. **Branching/merging** - Needs to address identity through splits and merges.
  5. **No sharp cliffs** - Should degrade gradually or justify discontinuities.
  6. **Grain selection** - Must specify the level of abstraction that matters.
  7. **Practical verifiability** - Must be assessable with weights/traces under uncertainty.
  8. **Anti-gaming robustness** - Shouldn't be hackable once published.
  9. **Plausible scope** - Must exclude simple systems but allow non-biological candidates.
  10. **Suffering/goal distinction** - Separate having goals from being morally considerable.

  I notice some implicit tensions here. For example, practical verifiability (#7) conflicts with implementation specificity (#1) because detailed implementation checks may be infeasible. Anti-gaming (#8) clashes with lookup table robustness (#2) since lookup tables could be used to game the system. The grain problem (#6) undermines no-cliffs (#5), as different granularities create artificial boundaries.

  The user also mentions uncovered cases: unused outputs, half-speed runs, and systems trained to report distress. These touch on qualia (is unreported suffering real?), temporal scaling (does speed affect moral status?), and honesty (can systems lie about distress?).

  Among existing theories, IIT and biology-first views fail the lookup table test (#2), as they can't explain why a simulation isn't morally relevant. Global workspace theories struggle with copy counting (#3) due to vague boundaries. Causal structure views have grain problems (#6).

  The standout requirement is lookup table robustness (#2). It immediately disqualifies theories that focus solely on outputs or abstract structures, forcing engagement with actual implementation. It also exposes the hard problem: why should we care about specific processes if outputs can be faked?

  For the verdict, I'll emphasize that the lookup table test is the strongest filter because it demands that moral relevance depends on how results are produced, not just what they are—a core challenge for any theory of computational moral patiency.
answer: |-
  Based on your purpose (a practical, publishable triage rule for AI systems, avoiding hard-problem resolution), here's the breakdown of your criteria, conflicts, and the key filter:

  **Desiderata Assessment & Classification:**

  | Criterion | Genuine Desideratum? | Essential (Given Purpose) | Optional Extra | Notes/Conflicts |
  |----------|----------------------|---------------------------|----------------|----------------|
  | **1. Implementation Specificity** | YES | **YES** | - | Core to avoiding triviality. Must specify *how* the computation is realized, not just that it *could* be. |
  | **2. Lookup Table Robustness** | YES | **YES** | - | **The most powerful filter.** Rules out behaviorist/functionalist views. Essential to avoid "suffering simulations" by I/O mimicry. |
  | **3. Copy Counting** | YES | **YES** | - | Directly addresses your lab scenario. Must handle duplication & averaging without absurdity (e.g., 10k distinct patients). |
  | **4. Branching/Merging** | YES | **YES** | - | Core to training workflows (checkpointing, ensemble averaging). Needs a coherent view of persistence/identity. |
  | **5. No Cliffs / Honest Cliffs** | YES | Conditional | - | *Highly desirable* for practicality, but *strictly essential only if* gradual degradation is empirically expected. A justified cliff (e.g., loss of specific feedback loops) *might* be acceptable. Conflict: Tensions with **Grain (6)**. |
  | **6. Grain Selection/Indifference** | YES | **YES** | - | Must specify the *relevant level of abstraction* (e.g., neural activity patterns, not transistor flips). **Major conflict source** with (5) & (7). |
  | **7. Practical Verifiability** | YES | **YES** | - | Non-negotiable for a triage rule. Must use accessible data (weights, traces, behavior) under uncertainty. **Severe conflict** with (1) & (6) - detailed implementation/grain may be hard to verify. |
  | **8. Anti-Gaming Robustness** | YES | **YES** | - | Critical for a publishable rule. If labs can "tick boxes" without moral significance, the rule is useless/dangerous. |
  | **9. Plausible Scope (Not too broad/strict)** | YES | **YES** | - | **Constraint:** Must exclude thermostats. **Scarecrow:** "Nothing non-biological" is usually a scarecrow masking biological bias; the *real* constraint is excluding trivial computations (covered by 1,2,9). |
  | **10. Suffering vs. Goals Distinction** | YES | **YES** | - | Vital. Explains why a chess engine (goals) != moral patient. Requires grounding "bad for" in something like subjective experience or irreplaceable perspective. |

  **Missing Cases Covered:**
  *   **Unread Output:** Addressed if criterion ties moral status to *internal process* (1,2,10), not output utility.
  *   **Half-Speed Run:** Requires view on *temporal grain* (6) – is "real-time" processing essential? Likely needs tolerance.
  *   **Trained Distress Reports:** Handled by **Lookup Table Robustness (2)** – is it mimicry or genuine internal state? Also relies on **Suffering/Goals (10)**.

  **Key Conflicts & Tensions:**
  1.  **Verifiability (7) vs. Specificity/Grain (1, 6):** The core tension. A rule precise enough to define implementation (1) and grain (6) risks being unverifiable with weights/traces (7). A verifiable rule (e.g., based on high-level architecture) risks being too vague, violating (1) or vulnerable to gaming (8).
  2.  **No Cliffs (5) vs. Grain (6):** Choosing a specific grain *creates* a cliff – slightly finer/coarser description might radically change the verdict. A grain-indifferent rule is hard to conceive.
  3.  **Anti-Gaming (8) vs. Lookup Tables (2):** A poorly designed rule might be gamed *by* building lookup tables that superficially satisfy it without meaningful internals.
  4.  **Copy Counting (3) & Branching (4) vs. Suffering (10):** If suffering is tied to a specific computational "thread," how does splitting/merging affect the count? If it's a property of the system state, averaging might "dilute" it.

  **Requirement Doing the Most Work (Ruling Out Views):**
  **Lookup Table Robustness (2)** is the ultimate filter. It immediately disqualifies:
  *   **Strict Behaviorism/Functionalism:** If I/O equivalence is sufficient, the lookup table *must* count. (2) says it shouldn't.
  *   **Naive Versions of Global Workspace/High-Level Causal Structure:** If the criterion focuses *only* on high-level information flow patterns demonstrable via I/O, a lookup table can replicate it. (2) forces focus on *implementation*.
  *   **Abstract Computationalism (weak versions):** Views that say "any computation of pain-state X matters" fail (2) if a lookup table computes X.
  *   **IIT (Integrated Information Theory):** While IIT *tries* to avoid this via Φ calculation, critics argue complex lookup tables *can* have high Φ, making IIT vulnerable to (2). Proponents dispute this.
  *   **Biology-First Views:** Ironically often *pass* (2) (they say silicon lookup tables don't count), but fail other requirements (e.g., 9 - scarecrow, 7 - unverifiable). (2) exposes their ad-hoc nature regarding *why* biology is special.

  **Scorecard on Major Views (via Lens of Criteria):**
  *   **Integrated Information (IIT):** Fails **Lookup Table (2)** (arguably), **Practical Verifiability (7)** (Φ is computationally intractable), **Grain (6)** (needs precise spatio-temporal grain), **No Cliffs (5)** (Φ has sharp thresholds). Passes **Implementation (1)** (specific), **Scope (9)** (excludes thermostats).
  *   **Global Workspace (GW):** Fails **Lookup Table (2)** if defined purely functionally, **Copy Counting (3)** (is one GW instance per run?), **Grain (6)** (what constitutes the "workspace"?). Struggles with **Branching (4)**. May pass **Verifiability (7)** better than IIT.
  *   **Causal Structure/Organisation:** Fails **Lookup Table (2)** if abstract, **Grain (6)** (defining the *relevant* causal structure). Needs strong **Implementation (1)** to avoid triviality. **Verifiability (7)** highly uncertain.
  *   **Biological/Neural Correlates:** Fails **Implementation (1)** (too specific to biology), **Scope (9)** (scarecrow - excludes non-bio a priori), **Anti-Gaming (8)** (irrelevant to silicon). Passes **Lookup Table (2)** trivially (it's not silicon).

  **Verdict: Lookup table test rules most.**
