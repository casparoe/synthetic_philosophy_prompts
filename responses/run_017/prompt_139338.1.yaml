  We are designing a formal account of degrees of belief for unproved mathematical statements, to be used in a lemma triage module of an automated-reasoning pipeline.

  Requirements (desiderata) for such an account:

  1. **Syntax Invariance**: The credence assigned to a lemma must not depend on its syntactic representation. Two trivially equivalent formulations must have the same credence. 
     - *Why requirement?* Because the truth of a mathematical statement is invariant under logical equivalence. The triage module should not be misled by irrelevant syntactic variations.

  2. **Computational Constraints**: The account must produce a verdict (continue, switch, stop) within a fixed compute budget per lemma. 
     - *Why requirement?* The module must operate under bounded resources.

  3. **Eventual Certainty for Theorems**: If a lemma is provable and a proof exists within the fixed budget (i.e., the proof is short enough to be found within the budget), then the module should eventually assign high credence (approaching 1) to the lemma. 
     - *Why requirement?* We want the system to be able to recognize true lemmas that are within its reach.

  4. **Eventual Certainty for Disproofs**: Similarly, if a lemma is disprovable (i.e., there is a counterexample or a refutation within the budget), the module should eventually assign low credence (approaching 0). 
     - *Why requirement?* We want the system to recognize false lemmas that are within its reach.

  5. **Handling Inconsistency**: Upon discovery that the background axioms are inconsistent, the module must assign undefined or arbitrary credence to all lemmas (because everything is provable and disprovable). However, it must be able to flag the inconsistency and halt the process appropriately. 
     - *Why requirement?* Inconsistent theories make every statement provable and disprovable, so the usual credences are meaningless. The system must detect and handle this catastrophic situation.

  6. **Handling Independence**: If a lemma is independent of the background theory (neither provable nor disprovable from them), the module should assign a credence that reflects this (e.g., around 0.5 if there is no prior bias) and not converge to 0 or 1. 
     - *Why requirement?* For independent statements, no amount of proof search (within the background theory) will settle the matter. The module should not waste resources and should let downstream components know.

  7. **Self-Referential Stability**: The module must be able to handle cases where its own earlier verdict is the only evidence it has for a lemma. This must not lead to paradoxical behavior (e.g., via Löb's theorem or self-referential inconsistencies). 
     - *Why requirement?* In a long-running system, the module may revisit lemmas and use its own previous outputs. We need to avoid self-undermining or self-justifying cycles.

  8. **Non-Asymptotic Budget Awareness**: The account must make decisions that respect the fixed budget per lemma. It must not require asymptotic convergence to make a verdict. 
     - *Why requirement?* The module must make a decision (continue, switch, stop) after a fixed amount of computation, not in the limit.

  9. **Human Interpretability**: The account must provide enough justification (e.g., traces of proof attempts, counterexample searches, or other evidence) that a human mathematician can contest the verdict. 
     - *Why requirement?* The system is part of an automated pipeline that may be used in mathematical research. Human oversight and intervention must be possible.

  10. **Robustness to Order of Discovery**: The credence for a fixed lemma should not depend on the order in which proofs for other lemmas are found (unless the lemma depends on them). 
