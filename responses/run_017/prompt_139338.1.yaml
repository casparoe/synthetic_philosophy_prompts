    - Eventual Certainty (3,4): If the proof is found within the budget, then the credence becomes 1. If a disproof is found, 0. Satisfied.
    - Handling Inconsistency (5): If we detect inconsistency (by proving a contradiction), then we can assign undefined and halt. Satisfied.
