  Now, which requirement excludes the most candidate accounts?

  - **Computational Constraints (2) and Non-Asymptotic Budget Awareness (8)**: These together require that the account must produce a verdict in fixed time per lemma. This excludes any account that requires asymptotic convergence (like some Bayesian updating with a prior over models) because we cannot wait for convergence. Also, it excludes any account that requires solving undecidable problems (like checking provability) because we have a fixed budget.

