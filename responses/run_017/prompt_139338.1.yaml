  - *Description*: For each lemma, we run proof search and counterexample search in parallel. The credence is based on the ratio of the time spent on proof vs disproof and the progress made (e.g., the length of the shortest proof found so far, or the fraction of the budget spent). For example, if we found a proof of length 100 and no disproof, credence=1. If we found a disproof, credence=0. If we found a proof of length 1000 and the budget is 10000, then we might assign credence 0.9. Alternatively, we might use the fraction of the budget spent: if we spent 90% of the budget on proof and found nothing, then credence decreases.

