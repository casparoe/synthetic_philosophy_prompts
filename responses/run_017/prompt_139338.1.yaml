  - **Computational Constraints (2) and Eventual Certainty (3,4)**: 
    We require that within a fixed budget, the module must assign high credence to every theorem that has a proof within the budget. But note: the set of theorems with proofs within the budget is recursively enumerable but not recursive (by undecidability). Therefore, we cannot have a computable procedure that, within a fixed budget, always recognizes every such theorem (because that would solve the halting problem for the proof search). However, we can require that for a fixed lemma, if a proof exists within the budget, then the module will find it and assign high credence. But note: the budget is fixed per lemma, so for a given lemma, we can require that if the proof is short enough (within the budget) then it is found. The problem is that we cannot require that the module recognizes every theorem with a proof of length <= N (for some N) because there might be too many and the budget per lemma might be too small to cover all. However, the requirement (3) is per lemma: if the proof is within the budget, then it is found. This is achievable by exhaustive search within the budget. But note: the budget is fixed per lemma, and the module must make a decision without exceeding that budget. So for each lemma, the module can only search up to the budget. Therefore, for a given lemma, if the proof is within the budget, then it will be found. However, the module cannot know in advance whether the proof is within the budget or not. So we can have:

