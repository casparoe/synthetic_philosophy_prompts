    - Non-Asymptotic Budget Awareness (8): The framework is asymptotic. It does not guarantee anything at finite times (other than no trader can exploit). It does not respect a fixed budget per lemma because it requires updating over time and across many lemmas. Not satisfied.
    - Human Interpretability (9): The trader-based criterion is complex. It might be hard to explain why a credence is what it is. So not easily contestable by a human.
    - Robustness to Order (10): The credences in logical induction can depend on the order of evidence. However, it converges in the limit regardless of order. But at finite times, order matters.

    Overall, fails on computational constraints and non-asymptotic budget awareness.

