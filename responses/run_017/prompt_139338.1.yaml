answer: |-
  ### Desiderata for a Formal Account of Degrees of Belief in Mathematical Lemmas
  The lemma triage module requires a formal account of degrees of belief ("credences") in unproved mathematical statements to make resource-aware decisions (continue proof search, switch to disproof, or stop). Below are the core desiderata, derived from operational, logical, and pragmatic constraints. Each is justified as a requirement (R) rather than a program-specific prejudice, rooted in mathematical necessity, computability, or human oversight needs.

  #### **Core Desiderata**  
  1. **Syntax Invariance (R)**  
     - *Requirement*: Credences for logically equivalent lemmas must be identical, regardless of syntactic form.  
     - *Why Requirement*: Mathematical truth depends on semantics, not syntax. Without this, equivalent reformulations (e.g., commutative reordering) could yield arbitrary verdicts, undermining reliability.  

  2. **Budget-Computability (R)**  
     - *Requirement*: Credences must be computable within a fixed per-lemma compute budget.  
     - *Why Requirement*: The module must decide in real-time under bounded resources; asymptotic or uncomputable methods fail operationally.  

  3. **Budget-Aware Certainty (R)**  
     - *Requirement*: If a proof/disproof of a lemma exists within the budget, the credence must converge to 1/0 within that budget.  
     - *Why Requirement*: Failing to recognize budget-achievable results wastes opportunities; this is distinct from asymptotic convergence (see conflicts below).  

  4. **Inconsistency Robustness (R)**  
     - *Requirement*: If background axioms are proven inconsistent, credences must be marked undefined for all lemmas, and the module must halt.  
     - *Why Requirement*: Inconsistent theories make all statements provable and disprovable; continuing would produce meaningless verdicts.  

  5. **Independence Awareness (R)**  
     - *Requirement*: If a lemma is independent of background axioms, credences must not converge to 0 or 1, and the module should stop early.  
     - *Why Requirement*: Independent statements cannot be resolved by proof/disproof; persisting wastes resources and misleads downstream proofs.  

  6. **Self-Referential Stability (R)**  
     - *Requirement*: Credences must avoid paradoxes when lemmas reference the module’s own verdicts (e.g., "this lemma will be assigned credence < 0.5").  
     - *Why Requirement*: Self-reference risks Löb-like inconsistencies (e.g., "if I accept this, it must be true") that destabilize the system; human contestability requires coherent justifications.  

  7. **Traceability (R)**  
     - *Requirement*: The account must output auditable evidence (e.g., proof fragments, search trajectories) to justify verdicts for human review.  
     - *Why Requirement*: Without transparency, humans cannot diagnose errors or trust provisional dependencies in downstream proofs.  

  8. **Order Invariance (R)**  
     - *Requirement*: Credences for a lemma must not depend on the order of processing other lemmas, unless they are logically dependent.  
     - *Why Requirement*: Mathematical truth is invariant to discovery order; bias from sequence would introduce non-logical noise.  

  ---

  #### **Conflicts Between Desiderata**  
  - **Budget-Computability (2) + Budget-Aware Certainty (3) + Independence Awareness (5) are jointly unsatisfiable** in a strong sense.  
    - *Conflict*:  
      - (3) requires credence → 1 for lemmas with budget-achievable proofs.  
      - (5) requires credence ↛ 0 or 1 for independent lemmas.  
      - But distinguishing "no proof within budget" (halt for independence) from "proof exists but not found yet" (continue) is **undecidable** (reducible to the halting problem).  
    - *Why Requirement-Driven*:  
      - (2) forbids unbounded computation to resolve this. Thus, the module cannot perfectly satisfy both (3) and (5).  
      - *Resolution*: Weaken (3) and (5) to:  
        - (3'): *If a proof is found*, credence → 1.  
        - (5'): *If independence is proven* (e.g., via forcing or model theory), credence ↛ 0/1.  
        - But (5') may exceed the budget, making independence detection best-effort.  

  - **Self-Referential Stability (6) + Budget-Aware Certainty (3) are Löb-incompatible**.  
    - *Conflict*:  
      - Löb’s theorem implies that a system believing its own soundness (e.g., "if I accept a lemma, it is true") can prove any statement, causing inconsistency.  
      - (6) forbids such paradoxes, but (3) requires high credence for lemmas with short proofs, including self-referential ones asserting the module’s soundness.  
    - *Why Requirement-Driven*:  
      - Self-referential lemmas are valid inputs (e.g., "this sentence has no short proof"). (6) prevents catastrophic failures, but (3) forces premature certainty on unprovable statements.  
      - *Resolution*: Restrict (3) to non-self-referential lemmas or use credence thresholds that avoid claiming soundness.  

  ---

  #### **Most Exclusionary Requirement**  
  - **Budget-Computability (2)** excludes the most candidate accounts (priors, logical induction, etc.), as they typically require asymptotic convergence or unbounded resources.  
  - **Is this over-specification?** No—it is a **virtue**.  
    - *Why*: Without (2), the system is practically useless. Real-world automated reasoning cannot assume infinite time. (2) forces alignment with engineering constraints, filtering out purely theoretical accounts.  

  ---

  ### **Evaluation of Candidate Accounts**  
  Assessed against the desiderata argued above (syntax invariance, budget-computability, budget-aware certainty, inconsistency robustness, independence awareness, self-referential stability, traceability). Order invariance is omitted, as no account inherently violates it.

  1. **Prior Over Theory Completions (e.g., Bayesian conditioning)**  
     - *Mechanism*: Assign a prior to completions of the background theory; update with proofs.  
     - **Score**:  
       - ❌ **Budget-Computability**: Computing priors/updates for complex theories is intractable (e.g., infinite completions).  
       - ⚠️ **Budget-Aware Certainty**: Only if proof is found; else, slow convergence.  
       - ✅ **Inconsistency Robustness**: Handled via posterior collapse.  
       - ⚠️ **Independence Awareness**: Priors may converge to 0.5, but not guaranteed; no early stopping.  
       - ❌ **Self-Referential Stability**: Vulnerable to Löb’s paradox (e.g., priors over soundness assertions).  
       - ❌ **Traceability**: Priors are opaque; updates lack stepwise evidence.  
     - *Verdict*: Fails critical operational needs (budget, traceability).  

  2. **Logical Induction (Market-Style)**  
     - *Mechanism*: Credences as prices; no bounded trader can exploit errors indefinitely.  
     - **Score**:  
       - ✅ **Syntax Invariance**: Enforced by market efficiency.  
       - ❌ **Budget-Computability**: Polynomial-time but impractical at scale; stateful, requires global market.  
       - ❌ **Budget-Aware Certainty**: Asymptotic convergence only; no budget-respecting guarantees.  
       - ⚠️ **Inconsistency Robustness**: May assign arbitrary prices after inconsistency.  
       - ✅ **Independence Awareness**: Converges to measure of true completions.  
       - ✅ **Self-Referential Stability**: Handles self-reference via bounded rationality.  
       - ❌ **Traceability**: Traders’ strategies are inscrutable; evidence not human-readable.  
     - *Verdict*: Theoretically elegant but computationally infeasible and untraceable.  

  3. **Search-Progress Heuristic (e.g., proof length/budget spent)**  
     - *Mechanism*: Credence = `f(shortest proof found, budget spent)`.  
     - **Score**:  
       - ❌ **Syntax Invariance**: Proof search efficiency is syntax-sensitive (e.g., associative rewriting).  
       - ✅ **Budget-Computability**: Trivially satisfies; heuristic runs in fixed time.  
       - ✅ **Budget-Aware Certainty**: Direct if proof/disproof found; else, best-effort.  
       - ✅ **Inconsistency Robustness**: Halts if contradiction found.  
       - ❌ **Independence Awareness**: No detection; credence drifts arbitrarily without convergence.  
       - ⚠️ **Self-Referential Stability**: Ad hoc; may assign extreme credences to self-referential loops.  
       - ✅ **Traceability**: Outputs search artifacts (e.g., proof fragments, spent resources).  
     - *Verdict*: Pragmatic but unreliable for independence and syntax; best suited for traceability and budget.  

  ---

  ### **Conclusion**  
  No account satisfies all desiderata. **Budget-Computability** is the keystone requirement, excluding priors and logical induction. The **search heuristic** is most operationally viable but fails syntax invariance and independence awareness. To resolve conflicts:  
  - Relax **Budget-Aware Certainty** to "certainty only if proof found" and **Independence Awareness** to "best-effort detection."  
  - Address **syntax dependence** via lemma normalization before credence assignment.  
  - **Self-reference** remains a risk; use credence thresholds (e.g., never 1.0) to mitigate Löb’s paradox.  
  A hybrid approach (e.g., heuristic + lightweight consistency checks) may balance constraints, but the desiderata highlight inherent tensions in automated reasoning under bounded resources.
