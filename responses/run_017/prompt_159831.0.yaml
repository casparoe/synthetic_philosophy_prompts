prompt: |-
  hey — ive drifted into holding a fairly strong version of outside-view primacy about forecasting, and I want someone to tell me how exposed it actually is before I build more on top of it. Call the view base-rate-first (BRF). Its moving parts, as I'd defend them:

  1. When the inside view and the outside view disagree, the tie goes to the outside view, because the inside view's errors are systematic — overconfidence, planning-fallacy optimism, narrative coherence masquerading as probability — while the outside view's errors are mostly noise around a decent mean.
  2. The right shape for combining them: reference-class distribution as the prior, inside view as a likelihood that moves the center and barely touches the tails. The inside view can tell you that you're in the top quartile of your class; it can't tell you that the class's 18-month median doesn't apply to you.
  3. Epistemic modesty here is bookkeeping, not a virtue. You defer to a process with a better calibration record, not to a wise person, and you drop the deference the moment the record stops being better.
  4. The reference class gets chosen by causal similarity, screened off from effort: you're not allowed to sort yourself into a class whose base rate already encodes the very thing you think your own effort or skill can move.

  Tell me what would count against this. Not the generic skeptical stuff, but the defeaters with teeth. Things I've half-thought through and want you to take further or knock down:

  - Shared-mode failure. If everyone inside a reference class is wrong for the same reason, averaging doesn't rescue you — the distribution's tails are understated exactly where it matters. Does this defeat BRF or just tell you to widen the tails while keeping the machinery?
  - Self-consuming base rates. Base rates that get published change the population that generates them, because the agents being predicted respond to them. How bad is this, and does it argue for treating published base rates as decayed?
  - Laundering. A lot of reference classes were themselves assembled by insiders doing inside-view reasoning with the case details filed off. If so, "outside view" is sometimes just someone else's inside view, and the deference in (3) has no object.
  - Reference-class drift: the class you'd have picked before seeing the outcome isn't the class you pick after, and I don't have a principled pre-observation rule that fixes it.
  - The awkward cases where the inside view has genuinely privileged access: you've already poured the foundation, you know your own team's attrition, the bridge is half built.

  Also: what empirical results should move me (no citations, just the shape of the finding and roughly how big it would have to be); which of these defeaters has arguably already happened; which ones a committed BRF person would concede count against them versus dismiss as a misuse of the view; and what BRF predicts that a real inside-view-first rival doesn't — if the answer is "nothing," say so, because that's a defeater too.

  And be honest about whether (4) rescues the view into unfalsifiability. It looks like an all-purpose escape hatch: any failure becomes "wrong reference class." I want to know if that insulation is real or if it costs me something.

  Two personal notes so you can calibrate: the shared-mode-failure point is the one that currently moves me most, and the familiar regress worry — that picking a reference class is itself an exercise of judgement, so the outside view is just a higher-level inside view — leaves me completely cold. If I'm wrong to be cold about that, argue me out of it.

  Give me prose for the argument, then end with a markdown table, and put nothing but the table in that final section. Exactly these columns:

  - defeater — short name
  - what_would_have_to_be_true — the observation, case, or result that would make this bite
  - bite — one of: fatal / serious / awkward / cosmetic
  - live_or_merely_possible — one of: live / live-but-unmeasured / logical-possibility-only
  - defender_concedes — one of: yes / grudgingly / no
  - if_accepted — which numbered commitment of BRF changes, and how
  - already_partially_observed — yes, with a rough example, or no

  8-10 rows, ranked from most to least decisive, and include the ones you think I'd dismiss — mark those in defender_concedes rather than leaving them out.
reasoning: |-
  Okay, the user presents a well-structured argument for their "base-rate-first" (BRF) view in forecasting and wants to know its vulnerabilities. They've clearly thought deeply about this, outlining four core commitments and several potential defeaters. I need to engage thoroughly but critically.

  First, let me parse their BRF position: they prioritize outside-view statistics over inside-view intuition when they conflict, using reference classes as Bayesian priors. Their key defenses are that inside-view errors are systematic while outside-view errors are random, and they emphasize selecting reference classes based on causal similarity without effort-based cherry-picking. 

  The user specifically asks not for generic skepticism but for "defeaters with teeth." They list five concerns: shared-mode failure, self-consuming base rates, laundering, reference-class drift, and privileged inside-view access. They also want empirical evidence implications and an assessment of whether their rule (4) makes BRF unfalsifiable. 

  Hmm, the personal notes are crucial here. They're most worried about shared-mode failure (systemic errors across a reference class) and dismiss the "regress worry" (that reference class selection is itself subjective). I need to respect that while testing their dismissal of the regress argument. 

  For the response structure, they want prose followed by a strict markdown table. The table needs exactly 8-10 rows with specific columns. I'll rank defeaters by decisiveness, include ones they might dismiss, and be honest about insulation via rule (4). 

  Breaking down the main defeaters: 

  - Shared-mode failure is indeed potent. If all startups in a reference class underestimate regulatory risk because it's a blind spot in their culture, averaging won't help. This challenges BRF's core premise that outside-view errors are random. I'd call this "serious" and "live," citing examples like pre-2008 financial models. 

  - Self-consuming base rates matter when predictions change behavior. If a study shows 90% of startups fail, entrepreneurs might pivot strategies, making the statistic obsolete. This is "awkward" but fixable by BRF if they treat base rates as decaying. 

  - Laundering is sneaky: many "outside-view" statistics come from someone else's aggregated inside views. If McKinsey reports startup success rates based on consultant judgments, not raw data, BRF's deference lacks foundation. This directly attacks commitment (3). 

  - Reference-class drift is messy. Before building a bridge, you might class it as "suspension bridges"; after a collapse, you reclassify it as "bridges built during material shortages." BRF struggles with this pre/post hoc ambiguity. 

  - Privileged access cases are BRF's kryptonite. If your bridge is 80% built with no delays, the inside view *should* override generic completion stats. Rule (2) already allows this, so it's "cosmetic." 

  On the regress worry they dismiss: I'll argue that if reference class selection relies on unverifiable similarity judgments (e.g., is this startup more like biotech or SaaS?), BRF collapses into meta-inside-view. Their rule (4) tries to fix this with causal similarity, but causality is often contested. 

  For empirical evidence, I'll note that studies showing inside-view superiority in high-information contexts (e.g., Tetlock's experts with granular data) would undermine BRF. If effect sizes are large (>30% accuracy gap), it's serious. 

  Rule (4) does risk unfalsifiability—any failure can be blamed on "wrong reference class." But it costs predictive power by making BRF less applicable where causal similarity is unclear. 

  Table-wise, I'll rank shared-mode failure and laundering as top, then self-consuming bases, drift, etc., marking which defenders might concede. Examples will cite real cases like financial crises or startup ecosystems. 

  The response will end with the strict MD table as requested.
answer: |-
  Here’s a systematic breakdown of potential defeaters for your BRF view, ranked by decisiveness. I’ll argue that **shared-mode failure** and **laundering** are the most serious, while **rule (4) insulates BRF at the cost of applicability**, making it less falsifiable but operationally brittle. The regress worry *should* concern you when reference-class selection relies on contested causal models.

  ### Key Arguments
  1. **Shared-mode failure defeats the core mechanism**: If everyone in a reference class makes the *same* error (e.g., all pre-2008 mortgage-backed securities models ignored correlated tail risk), averaging gives false confidence. BRF’s noise-around-the-mean assumption collapses. This isn’t fixable by widening tails—the distribution’s *shape* is wrong.  
  2. **Laundering invalidates "deference to process" (Commitment 3)**: Many "base rates" (e.g., industry reports, academic meta-studies) are aggregated inside views. If McKinsey’s "startup success rates" reflect consultants’ subjective judgments, not raw data, BRF defers to hidden inside views.  
  3. **Rule (4) creates unfalsifiability but shrinks domain**: You can always say "wrong reference class!" after failure, but pre-commitment to causal similarity is hard. E.g., "causal similarity" for a novel tech startup (AI + biotech + hardware) is undefined ex-ante. BRF becomes vacuously safe but inapplicable to novel cases.  
  4. **Regress matters when causality is contested**: Picking a reference class *is* an inside-view exercise if causal models differ (e.g., "Is this startup’s success driven by market size or founder grit?"). BRF relies on uncontested causality—rare in practice.  

  ---

  | defeater                  | what_would_have_to_be_true                                                                 | bite     | live_or_merely_possible      | defender_concedes | if_accepted                                                                 | already_partially_observed       |
  |---------------------------|--------------------------------------------------------------------------------------------|----------|------------------------------|-------------------|-----------------------------------------------------------------------------|----------------------------------|
  | shared-mode failure       | Systemic error in a reference class (e.g., all construction firms underestimate permit delays by 2x) | serious  | live                         | grudgingly        | Adjusts (1): Outside view errors can be systematic, forcing case-by-case distrust of classes | Yes (e.g., financial crises models) |
  | laundering                | Published base rates are aggregates of expert judgments, not empirical frequencies         | serious  | live                         | no                | Undermines (3): Deference only if base rates are mechanistic, not curated                 | Yes (e.g., consulting industry benchmarks) |
  | self-consuming base rates | Agents change behavior after seeing base rates (e.g., startups pivot upon reading failure stats) | awkward  | live-but-unmeasured          | yes               | Adjusts (2): Base rates decay; use time-limited or pre-disclosure data                    | Yes (e.g., publication bias in clinical trials) |
  | reference-class drift     | Post-hoc class reassignment is untestable (e.g., "Failed AI projects" class defined after failure) | serious  | live                         | grudgingly        | Challenges (4): Requires pre-registered class definitions to avoid bias                   | Yes (e.g., hedge fund performance analysis) |
  | privileged inside view    | Insider knowledge beats base rates in high-signal cases (e.g., bridge 90% built on schedule) | cosmetic | live                         | yes               | N/A: BRF’s (2) already allows this; no change needed                                   | Yes (e.g., project completion forecasts) |
  | novel contexts            | No causal similarity class exists (e.g., forecasting first-generative-AI-film success)     | awkward  | live                         | grudgingly        | Weakens (4): BRF inapplicable; forces fallback to inside view                           | Yes (e.g., early blockchain startups) |
  | effort-pollution          | Skill/effort *is* causal but hard to screen off (e.g., surgeon success rates)              | awkward  | live                         | no                | Defends (4): "Not BRF’s fault if classes are poorly constructed"                        | Yes (e.g., entrepreneurship studies) |
  | inside-view dominance     | Studies show experts with granular data beat base rates >60% of the time                   | serious  | live-but-unmeasured          | no                | Refutes (1): Inside-view errors may be unsystematic when information-rich                | No (anecdotes only)              |
  | base rate scarcity        | Reliable reference classes exist for <20% of real-world forecasts                          | awkward  | live                         | grudgingly        | Narrows scope: BRF only viable for routine, data-rich contexts                          | Yes (e.g., niche B2B forecasts)  |
  | causal ambiguity          | Competing causal models for class selection (e.g., "Is climate tech like software or biotech?") | serious  | live                         | no                | Undermines (4): Picking classes requires inside-view causal reasoning                   | Yes (e.g., emerging tech investing) |

  ### Empirical Results That Would Move You
  - **Fatal**: A study showing >70% of reference classes exhibit *correlated* errors (not random noise) in their tails.  
  - **Serious**: Evidence that aggregated "base rates" are >50% curated expert judgments (laundering) with worse calibration than individual insiders.  
  - **Awkward**: Inside-view forecasts outperform base rates by >30% in high-information contexts (e.g., late-stage projects).  

  ### Why Regress Worry Matters
  If reference-class selection depends on unverifiable causal similarity (e.g., "Is this startup more like Apple or WeWork?"), BRF collapses into a higher-level inside view. Rule (4) tries to block this but relies on *your* model of causality—which may be wrong. When classes are contested (e.g., forecasting pandemic impacts), BRF offers no objective ground.
