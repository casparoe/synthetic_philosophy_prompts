  Opening: Contrast cosmic age/human newness. Middle: The budget theory—"one shout" vs. "whispers." Refrain erosion mirrors resource thinning. Final stanza: Introduce the objection ("But what if they swell?") and end mid-thought with the barest refrain ("spent?"), leaving doubt. 

  Title? "Conservation" hints at both physics and choices. Testing aloud: Flows, no tongue-twisters. "Wide as winter's ache" felt risky but keeps scale human. Final line's question mark essential—tiny, but holds the paradox open.
answer: |-
  ## Conservation

  Consider the galaxy: older than mountains,
  wider than seas. Time enough
  for builders to rise and refashion the void,
  to stitch light across the deep black.
  Yet silence. Not vacuum's hush, but the weight
  of a question unanswered, vast
  as the distance between the cradle and grave
  of stars. We listen. We find

  Not absence, perhaps, but a choice in the spending.
  Each spark has its measure, its coin.
  One flare, brilliant, brief, shattering the dark
  for a thousand swift years – seen
  by worlds still asleep, or by eyes turned elsewhere.
  Or whispers sustained, a low hum
  barely lifting above the cosmic fray,
  close-held, persistent, but faint.
  A beacon that burns for ten thousand millennia
  reaches only the neighbours it knows.
  **How the light is spent.**

  The loudest are transient. The longest retreat.
  This is the shape of the budget:
  to shout your name once across the chasm,
  or murmur it always nearby.
  The evidence gleaned in our momentary glance
  favours the flash and the fade.
  It favours the strategies built to collapse
  under their own hungry blaze,
  or those who withdraw, conserving their signal
  within a small, quieting sphere.
  **How light is spent.**

  Does the census show scarcity? Or merely display
  the economy of notice?
  We scan for the shout, the impossible glare
  that *should* blaze if anyone aimed
  to be seen from afar, enduring forever.
  But what if they swell? What if they
  expand without ceasing, their radiance growing,
  a wavefront of noise and of night
  ignited? What if the ceiling’s not fixed?
  What if they burn, loud and long?
  **How spent?**

  We only possess this one sliver of now,
  this thin slice of cosmic time.
  The silence persists. Is it counting the builders?
  Or counting the ways they choose:
  The flare? Or the ember? The shout? Or the sigh?
  The signal designed for the ages,
  or the mark that endures by being contained?
  The budget is real. The choice is.
  The snapshot is biased. The question remains.
  **Spent?**

  ---

  **Notes on Meeting Your Requirements:**

  *   **Core Idea Embodied:** The poem centers on your "budget of noticeability" concept – the inherent trade-off between intensity/duration/range of signals, shaping what silence might *actually* signify (choices, not just absence).
  *   **Avoids Hypothesis Catalogue:** No mention of zoos, lighthouses, filters, or specific solutions. Focus is purely on the expenditure trade-off.
  *   **Structural Trade-off (Decaying Refrain):** Instead of syllable counting, the poem uses a **decaying refrain** as its core structural constraint:
      *   Stanza 1: "How the light is spent." (4 words)
      *   Stanza 2: "How light is spent." (3 words)
      *   Stanza 3: "How light is spent." (3 words - subtle shift from definitive to more speculative)
      *   Stanza 4: "How spent?" (2 words - introduces the critical objection/question)
      *   Stanza 5: "Spent?" (1 word)
      This mimics the core idea: the same essential concept ("spending") is present throughout, but its *expression* becomes increasingly thinned and eroded, forcing the same "budget" of meaning into fewer words – a formal analogue to signal dilution over time/space.
  *   **Form:** Free verse, no forced rhyme scheme.
  *   **No Ventriloquized Aliens:** The poem speaks only from the human perspective of observation and interpretation.
  *   **Clean Astronomy:** Uses comparative scale ("older than mountains, wider than seas," "a thousand swift years," "ten thousand millennia"). No invented numbers, colonization timescales, or named researchers/papers. Concepts like "signal," "light," "beacon," "noise," "sphere," "chasm" are accessible.
  *   **Length & Accessibility:** 33 lines. Designed to resonate with experts ("census," "snapshot biased," "economy of notice") while remaining grounded in understandable imagery ("flare," "whispers," "ember," "shout," "sigh") for a broader audience. The core concept of "spending" a resource is universal.
  *   **Ends in Uncertainty:** The final stanza presents the key objection ("What if they swell?... burn loud and long?") and ends on the stark, isolated question "Spent?", refusing resolution and highlighting the field's central doubt. The decaying refrain visually and sonically reinforces this unresolved tension.
  *   **Performance & Rereading:** The rhythm is natural for speaking. The decaying refrain provides audible structure. On the page, the visual erosion of the refrain reinforces the theme. Accessible vocabulary ensures comprehension even without "technosignature."
