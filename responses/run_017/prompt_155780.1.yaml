answer: |-
  Here’s an original exam question, model answer, and mark scheme designed to push students beyond standard Pascal’s Mugging responses, incorporating your "Curator" and "Recruiter" variants while targeting your specified philosophical challenges.

  ---

  ### Philosophy Club Exam Question: Pascal’s Mugging Evolved

  **Question (30 minutes, 20 marks):**  
  > **The Curator** hands you a folded card with a very short computer program that, *if* it halts, outputs an astronomically large number *N*. He offers you *N* days of pure joy for £5. You cannot run the program.  
  >  
  > **The Recruiter** then says: *"I didn’t choose you randomly. I chose you specifically because you’re the type who pays. So if you pay, it’s evidence this deal is real."*  
  >  
  > **Critically evaluate** whether these variants resolve, intensify, or transform the core problem of Pascal’s Mugging. Your answer must address:  
  > 1. Why specifying *N* via a program (Curator) might change the expected utility calculation compared to stating *N* verbally.  
  > 2. Whether the Recruiter’s "selection effect" genuinely provides evidence that paying is rational.  
  > 3. Why standard responses rely on the probability of the mugger’s claim decaying faster than *N* grows—and whether this decay applies here.  
  > 4. **Consequence:** If an identical Recruiter/Curator mugger appears daily for a year and you *always* pay, does this make future payments more or less rational? Justify.  

  ---

  ### Model Answer (Approx. 500 words)  

  Pascal’s Mugging exploits the tension between negligible probability and unbounded utility in expected utility (EU) maximization. The Curator and Recruiter variants reframe this problem but fail to resolve it.  

  **(1) The Curator’s Program:** Specifying *N* via a program, not a verbal claim, does not legitimize the enormous payoff. While the program *formally* defines *N*, it doesn’t grant epistemic access to *N*’s plausibility. Short programs can output vast numbers (e.g., a program implementing the busy beaver function), but the EU calculation still requires estimating the *probability* that the program halts with a valid payoff. Crucially, *shorter programs don’t correlate with higher probability*. The set of short programs that halt with enormous outputs is vanishingly small compared to those that halt with small outputs or loop infinitely. Thus, the prior probability that this specific program outputs an astronomically large *N* (and that the Curator can deliver) decays *super-exponentially* as *N* increases—just like a verbal claim. The program only disguises, but doesn’t eliminate, the need for this decay.  

  **(2) The Recruiter’s Selection Effect:** The Recruiter’s argument—that paying provides evidence the deal is real—is circular and epistemically hollow. If the mugger always says this, paying *cannot* distinguish true from false claims. Suppose two types of muggers exist: honest (H) who can deliver *N*, and dishonest (D) who cannot. The Recruiter claims they target "payers," so if you pay, you might think, "I was targeted, so H is likely." But this ignores *base rates*. D muggers vastly outnumber H muggers, and both target the same "payer-type" victims. Since paying costs only £5, many will pay "just in case," ensuring D muggers always find payers. Thus, observing that you were targeted *and* paid is weak evidence for H—it’s consistent with you being one of countless dupes of D. The Recruiter exploits *confirmation bias*, not sound Bayesian updating.  

  **(3) Probability Decay & Rescue:** Standard EU rescues Pascal’s Mugging by insisting the probability *P* of the mugger’s claim must scale inversely with *N*. If *P* decays faster than *N* grows (e.g., *P* < 1/*N*), EU remains bounded. This applies *more* forcefully to the Curator: the probability a random short program halts with output >*N* shrinks faster than any computable function of *N*. Without this decay, EU is infinite for any nonzero probability, making rationality self-defeating (e.g., you’d bankrupt yourself over all possible muggers).  

  **(4) Iterated Mugging (365 days):** Paying daily *undermines* rationality. If you pay daily for a year with no joy delivered, Bayesian updating should *crush* your belief in the mugger’s honesty. Each payment without payoff lowers the posterior probability of H. After many failures, *P(H)* approaches zero. Continuing to pay violates basic conditionalization—unless you posit increasingly ad hoc excuses (e.g., "payoffs are delayed"), which themselves have decaying probability. The Recruiter’s pitch also weakens: if you’re "the type who pays," but paying never works, the claim becomes self-refuting.  

  **Conclusion:** The variants intensify the mugging’s psychological grip but don’t evade its epistemic core. The Curator’s program feels more "legitimate," yet probabilities still decay. The Recruiter weaponizes decision theory against itself, but base rates doom it. Only disciplined probability decay—applied rigorously—prevents paralysis by cosmic blackmail.  

  ---

  ### Mark Scheme (20 Total)  
  **A/A+ (17–20):**  
  - **Program ≠ Legitimation:** Explicitly argues that specifying *N* computationally doesn’t prevent probability decay (vs. B’s "it feels more objective").  
  - **Recruiter Debunked:** Identifies base-rate neglect in the selection effect (B may only call it "circular" without modeling).  
  - **Decay Necessity:** Explains *why* probability *must* decay faster than *N* grows to preserve decision-theoretic coherence (B mentions decay but not its necessity).  
  - **Iterated Case:** Uses Bayesian updating to show repeated non-payment devastates the mugger’s credibility (B notes it "seems irrational" without formalizing).  
  - **Structure:** Logically integrates all four question parts.  

  **B (13–16):**  
  - Addresses all variants but with gaps: e.g., notes the Curator’s program is "still suspicious," but doesn’t explain *why* probability decays.  
  - Calls Recruiter "manipulative" but doesn’t dissect base-rate error.  
  - States decay happens but not its role in rescuing EU.  
  - Says iterated payments are "irrational" without Bayesian reasoning.  
  - Competent but less precise/insightful.  

  **C (10–12):**  
  - Treats Curator’s program as more credible than verbal *N*.  
  - Takes Recruiter’s selection effect at face value.  
  - Omits discussion of probability decay.  
  - Doesn’t engage with iterated case.  
  - Superficial or recites standard Pascal’s Mugging points.  

  **D/E (<10):**  
  - Major omissions/misunderstandings (e.g., "the program guarantees *N*").  
  - No engagement with selection effects or iteration.  

  ---

  ### Why This Works  
  - **Forces Novel Analysis:** The Curator pushes students beyond "big numbers are suspicious" to computational probability. The Recruiter demands base-rate reasoning, not just "it’s a trick."  
  - **Targets Core Mechanics:** The decay of *P* relative to *N* is central to the model answer and mark scheme.  
  - **Iterated Case as Litmus Test:** Exposes inconsistent credulity—students must confront updating or admit irrationality.  
  - **No Citations Needed:** Self-contained through clear variants and logical demands.  

  This question rewards deep engagement with decision theory while penalizing recycled answers—exactly as you wanted. Good luck with the exam!
