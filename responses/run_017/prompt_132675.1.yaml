prompt: |-
  I teach moral philosophy, and this term I was conscripted onto the committee that administers the Aldridge Medal, funded by an old bequest for conduct that goes beyond what could reasonably be demanded of anyone — the category we argue about in the literature that begins with Urmson's 1958 paper on saints and heroes, though the bequest's own wording predates all of that and simply describes deeds of which it can be said that they were good to do but not blameworthy to have left undone. The committee is not a theoretical body, but in fourteen years it has accumulated a track record, and because I am the philosopher on it I have been asked to draft the memo on this year's case. Our precedents are these. We awarded the medal to a night custodian who broke two ribs pulling two strangers from a car in a flooded underpass, with no professional duty to intervene and no compensation beyond his medical bills. We declined it, with a letter of commendation, for a campus police officer who carried an unconscious student out of a smoke-filled residence hall, on the ground that this is what his role required of him. We declined it for an administrative assistant who turned in a wallet containing roughly eighteen hundred dollars in cash and a passport, on the ground that returning it cost her nothing and was ordinary decency. We awarded it to an alumna who donated a kidney to a stranger she had met through a patient-matching forum. We awarded it to a professor of nursing who gave unpaid end-of-life care to a neighbour with no family for six years and turned down paid consultancy work in order to keep doing it. And we declined it for a colleague in the physics department who assigned the royalties of one of his textbooks to a nonprofit, on the ground that he had given up nothing he would otherwise have had. Two dimensions have never arisen: no case so far has involved an agent who was later and substantially compensated or honoured for the very same deed, and we have never said a word about whether the agent's motives matter.

  The case before us is Dr. M., now an associate professor of chemistry. Over four years she developed a cheap point-of-care diagnostic for a neglected tropical disease, deliberately did not patent it, published the protocol open-access, and spent four summers training technicians in three countries to use it; she turned down a consultancy to develop a proprietary version, and colleagues in her field estimate the forgone licensing income in the low hundreds of thousands. Her tenure decision was deferred by two years as a result, and senior colleagues say there was genuine doubt at the time whether she would be tenured at all. She had no prior connection to the affected populations and was under no legal, professional or contractual obligation of any kind. Since then she has received a major prize carrying an unrestricted award of about half a million dollars, a named chair, and a trade book contract. In her interview with us she was candid that professional ambition and the expectation of recognition were substantial parts of why she did it, and she also observed that the open-access route generated the citations she needed for tenure considerably faster than a patent would have, and that she would not have taken this path had it meant leaving research altogether; she further said that she would have done it had no one ever noticed, which two members of the committee take to settle the question of motive and two take to be exactly what one would say in a medal interview. She also describes the project, unprompted, as the thing she most wanted to do with her career. We are split four to three, and I do not think the split is really about Dr. M.

  So here is what I want from you. Reconstruct the rules that fit our precedents jointly, and I suspect there are at least four that do: one that measures the agent's cost prospectively and in gross terms, counting opportunity costs and risks borne at the time of acting; one that measures it net, so that later compensation and honours can retroactively remove the sacrifice a deed consisted in; one that adds a condition on the agent's reasons, so that mixed or partly self-interested motivation disqualifies or at least demotes; and one on which what counts as a cost is fixed not by forgone income but by the agent's own projects, so that four years spent on the work one most wanted to do is not obviously a sacrifice at all. Say what each predicts here, which precedent is the closest analog on each, and which of them you think the committee is in fact running. Then give me the recommendation you would put in the memo, and — this is the part I care about — say plainly what we would be committing ourselves to either way: whether the medal honours sacrifice or excellence in aid, whether being beyond the call is a property of the act at the time of acting or of the whole episode including its upshot, whether compensation can cancel supererogation or merely coexist with it, and whether there is any coherent position at all in the middle. Finally, tell me which single further fact about this case, or which variant of it, would best discriminate between the surviving rules, since I would rather ask Dr. M. one good question than argue with my colleagues for another three meetings.
reasoning: |-
  Hmm, the user teaches moral philosophy and is on a committee for the Aldridge Medal, which recognizes actions beyond ordinary duty. They've provided precedents and a current case about Dr. M, a chemist who developed an open-access diagnostic tool. The committee is split 4-3, and the user wants me to reconstruct rules from precedents, apply them to Dr. M, identify which rule the committee uses, and suggest a decisive question.

  First, I need to analyze the precedents to extract consistent rules. The medal criteria from the bequest are: actions that are good but not blameworthy to omit. The precedents include both awards and declines, with reasons given. For example, the custodian who rescued people from a flooded underpass got the medal because he had no professional duty, suffered physical harm (broken ribs), and received only medical compensation. The police officer who rescued a student was declined because it was part of his job. The administrative assistant who returned a wallet was declined because it cost her nothing. The alumna who donated a kidney got it, as did the nursing professor who provided unpaid care for years, turning down paid work. But the physics professor donating royalties was declined because he gave up nothing he otherwise would have had.

  From this, I see patterns. Sacrifice seems key: the cost to the agent in terms of risk, forgone opportunities, or personal effort. When there's no real cost or it's part of a role, it's declined. Motives aren't mentioned in past decisions, so that's a new dimension here.

  Now, for Dr. M's case: she spent four years developing a diagnostic tool, didn't patent it, trained technicians, turned down a lucrative consultancy, and faced career risks like tenure delay. She later received compensation like a prize and a named chair. Her motives are mixed: professional ambition and altruism. She claims she would have done it even without recognition, but that's contested.

  I need to reconstruct at least four rules that fit the precedents. Rule 1: Prospective Gross Cost. This measures sacrifice at the time of acting, ignoring later compensation. It focuses on risks and forgone opportunities. For Dr. M, at the time, she had high costs: forgone income, career uncertainty. Precedents like the custodian (immediate harm) and nursing professor (long-term unpaid work) fit here. This rule would likely award her.

  Rule 2: Net Cost. This subtracts later compensation, so if rewards erase the sacrifice, it might not qualify. For Dr. M, her net cost might be low now, as she got compensated. The physics professor precedent fits—he gave up nothing net. This rule might decline her.

  Rule 3: Motivation Requirement. Adds that motives must be purely altruistic, not mixed. Dr. M admitted ambition and recognition were factors, so this could disqualify her. Precedents don't mention motives, so this is new. If applied, it might align with the declined cases where no real sacrifice, but here it's about intent.

  Rule 4: Project-Relative Cost. Sacrifice is defined by deviation from the agent's own projects. If the action aligns with their deepest desires, it's not a sacrifice. Dr. M said this was what she most wanted to do, so under this rule, it might not count. Precedents like the nursing professor—she might have wanted to help, but it still involved turning down work, so cost exists. This rule could decline Dr. M.

  Now, which rule is the committee using? The user says they're split 4-3, and it's not really about Dr. M, implying underlying rule disagreements. From precedents, Rule 1 (gross cost) seems dominant, as compensation wasn't considered before, and costs were evaluated prospectively. For example, the custodian got medical bills paid but still got the medal, so net cost wasn't applied. That suggests Rule 1 is the de facto standard.

  For the memo recommendation, I should advise awarding the medal. Why? Because on balance, the gross cost at the time was significant, the action was beyond duty, and compensation doesn't negate the original supererogation. This honors sacrifice at the time of acting. Committing to this means the medal is for sacrifice, not just excellence, and compensation coexists but doesn't cancel the act's status.

  To resolve the split, the key question is: Ask Dr. M if she would still have pursued this path knowing she wouldn't get tenure. This probes the depth of her sacrifice—was she truly risking her career? If yes, it strengthens Rule 1; if no, it might support Rule 4 or Rule 2.
answer: |-
  Based on your precedents and the philosophical tensions in Dr. M.'s case, I reconstruct four distinct rules that fit the committee's history. Each aligns with the Urmson-inspired framework ("beyond what could reasonably be demanded") but prioritizes different dimensions of cost, compensation, and motivation. Below, I outline each rule, its prediction for Dr. M., its closest precedent analog, and which rule I believe the committee is *de facto* running. I then provide a memo recommendation and clarify the commitments involved, ending with a discriminating question for Dr. M.

  ---

  ### **Reconstructed Rules from Precedents**
  1. **Rule 1: Prospective Gross Cost**  
     - *Definition:* Measures sacrifice **at the time of action**, counting all foreseeable risks, opportunity costs, and burdens borne by the agent. Ignores later compensation/honors. Focuses on the act’s "beyond duty" character prospectively.  
     - *Prediction for Dr. M.:* **Award.** At the time, she faced substantial costs: forgone income (~$100K+), deferred tenure (career risk), and four summers of labor. Her lack of obligation and the scale of sacrifice align with past awards.  
     - *Closest Precedent:* The **nursing professor** (6 years of unpaid care, turned down paid work). Compensation was irrelevant; cost was assessed when incurred.  

  2. **Rule 2: Net Cost**  
     - *Definition:* Measures sacrifice **retrospectively**, subtracting later compensation/honors. If net cost is trivial, the act no longer qualifies as supererogatory. "Beyond duty" is a property of the *entire episode*, not the act alone.  
     - *Prediction for Dr. M.:* **Decline.** Her major prize ($500K), named chair, and book contract likely exceed her initial costs (forgone income + tenure risk). The sacrifice is "cancelled" retroactively.  
     - *Closest Precedent:* The **physics professor** (royalties donated). He gave up "nothing he would otherwise have had"—net cost was zero.  

  3. **Rule 3: Motivation Requirement**  
     - *Definition:* Adds a condition that the agent’s **primary motive** must be altruistic. Mixed or self-interested motives disqualify, even with high cost. "Beyond duty" includes purity of intention.  
     - *Prediction for Dr. M.:* **Decline.** She admitted ambition/recognition were "substantial" motives, and her citation strategy aided tenure. Her claim ("would have done it unnoticed") is disputed.  
     - *Closest Precedent:* *None directly*, but the **custodian** and **kidney donor** imply presumed altruism. The committee has never praised an act with openly self-interested motives.  

  4. **Rule 4: Project-Relative Cost**  
     - *Definition:* Sacrifice is defined by **deviation from the agent’s core projects/values**. If the act aligns with the agent’s deepest commitments, it isn’t truly costly—even if it forgoes income or status.  
     - *Prediction for Dr. M.:* **Decline.** She called this "the thing she most wanted to do." If her identity is tied to global health impact, the "cost" (e.g., forgone consultancy) is merely pursuing her highest priority.  
     - *Closest Precedent:* The **administrative assistant** (returned wallet). "Ordinary decency" implies alignment with basic values—no project deviation.  

  ---

  ### **Which Rule Is the Committee Running?**  
  Your precedents overwhelmingly support **Rule 1 (Prospective Gross Cost)**.  
  - **Why?** Compensation/honors were never mentioned in past decisions (e.g., the custodian’s medical bills were paid, but this didn’t negate the award). Costs were assessed at the time of action: the nursing professor’s care was sacrificial *while ongoing*, and the physics professor’s donation lacked *initial* cost. Motives were irrelevant.  
  - **The Split on Dr. M.:** The 4–3 divide likely reflects Rule 1 (pro-award) vs. Rules 2–4 (pro-decline). Those leaning Rule 2 see her compensation as retroactively erasing sacrifice; Rule 3 skeptics distrust her motives; Rule 4 proponents see her actions as self-actualization. But Rule 1 is the *consistent* thread.  

  ---

  ### **Memo Recommendation**  
  **Award the Aldridge Medal to Dr. M.**  
  - **Justification:**  
    Dr. M.’s actions—developing an open-access diagnostic, training technicians, and forgoing significant income/tenure security—were prospectively beyond any reasonable demand. Her lack of obligation, high gross cost (opportunity, career risk), and societal impact align with the custodian, kidney donor, and nursing professor. Compensation and motives are secondary: the medal honors the *sacrificial character of the act at the time*, not its outcomes or the agent’s psychology. Her later rewards do not negate the initial supererogation; they coexist with it.  

  ---

  ### **Commitments Either Way**  
  | **Decision** | **Commitments** |  
  |--------------|----------------|  
  | **Award** | 1. The medal honors **sacrifice** (costs/risks borne), not just excellence in aid. <br> 2. "Beyond the call" is a property of the **act at the time of acting**—compensation cannot retroactively "cancel" supererogation. <br> 3. Compensation and supererogation **coexist**; recognition doesn’t negate the original moral character. <br> 4. **Motives are irrelevant**; the committee assesses deeds, not psychology. |  
  | **Decline** | 1. The medal honors **net sacrifice** after outcomes—or **purely altruistic intent**. <br> 2. "Beyond the call" depends on the **whole episode**, including compensation. <br> 3. Compensation **can cancel supererogation**, reducing the act to ordinary duty or prudence. <br> 4. **Mixed motives disqualify**, implying a "saintly" purity requirement. |  

  **The Incoherent Middle:** A compromise (e.g., "commendation but no medal") fails. Your precedents show a binary: awards for true sacrifice (custodian), declines for non-sacrificial acts (police officer, admin assistant). Introducing partial recognition would undermine the medal’s distinction and invite endless debate.  

  ---

  ### **Discriminating Question for Dr. M.**  
  **Ask this:** *"Knowing what you did at the time about the tenure risks, would you have pursued this project if it guaranteed you would never achieve tenure or comparable academic advancement?"*  

  - **Why this question?**  
    - **Tests Rule 1 (Prospective Cost):** A "yes" confirms the sacrifice was genuine and borne prospectively.  
    - **Tests Rule 3 (Motivation):** A "no" suggests career ambition was a non-negotiable motive.  
    - **Tests Rule 4 (Project-Relative Cost):** A "yes" implies the project was an end in itself, weakening "sacrifice."  
    - **Irrelevant to Rule 2 (Net Cost):** Retrospective compensation is moot here.  

  This cuts to the core of whether her actions were truly beyond demand or a career-optimizing choice. It forces clarity on cost versus commitment, resolving the committee’s deadlock without reopening theoretical debates.  

  ---  
  **Final Note:** Your precedents suggest the Aldridge Medal is fundamentally about *sacrifice*, not moral sainthood. Awarding it to Dr. M. honors that tradition while acknowledging that supererogation can arise from complex human motives—and that compensation doesn’t erase courage.
