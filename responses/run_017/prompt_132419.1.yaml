answer: |-
  **Joint Statement: Adversarial Collaboration on Artifacts and Politics**

  **1. Scope Note**  
  This document addresses the core disagreement: whether material/technical properties of artifacts inherently carry political content (*inherence claim*), or whether politics emerges only in sociotechnical arrangements (*arrangement claim*). We set aside: causal claims about specific historical outcomes; normative judgments about responsibility absent clarification of the descriptive claims; and semiotic readings of artifacts as symbols. We focus solely on whether political effects *can* be inherent properties of the design itself under controlled comparison. The four cases below serve as our agreed tests.

  **2. Agreed Claims**

  1.  **Artifacts Differentially Enable/Constrain:** Both camps agree that technical designs differ in how they enable or constrain human action and social organization. (Settled)
  2.  **Arrangements are Consequential:** Both agree that the production, maintenance, governance, interpretation, and potential for repurposing of an artifact within a sociotechnical arrangement significantly shape its political effects. (Settled)
  3.  **Function Matters for Comparison:** Meaningful comparison of political effects requires holding measurable core function fixed (e.g., water delivery for pumps). Differences in function introduce confounding factors both camps agree belong to ordinary political trade-offs. (Settled)
  4.  **Politics Involves Power/Order:** Both camps use "political" to refer to phenomena concerning the establishment, maintenance, contestation, or transformation of relations of authority, power, inclusion/exclusion, or social order. (Settled)
  5.  **Design Choices are Not Neutral:** Both agree that choices made during design (including omissions) are not value-neutral; they reflect priorities and can have significant downstream consequences within arrangements. (Settled)
  6.  **Modal Claim (Weak):** Both agree it is *possible* for specific material/technical configurations to make certain social arrangements *significantly harder to achieve or sustain* than others, even if not logically impossible. (Majority view, contested at the margins)
  7.  **"Orphan" Politics are Ephemeral:** In the absence of any sustaining arrangement (production, maintenance, enforcement, interpretation), the capacity of an artifact to exert a *specific* political effect diminishes rapidly, though it may retain affordances. (Majority view, contested)

  **3. Disagreements Table**

  | Crux                                                              | Inherence Camp Formulation                                                                 | Arrangement Camp Formulation                                                                                                                               | Discriminating Case | Inherence Prediction (Pre-Reg)                                                                 | Arrangement Prediction (Pre-Reg)                                                                 | Evidence to Move Inherence                                                                                                               | Evidence to Move Arrangement                                                                                                                                 |
  | :---------------------------------------------------------------- | :----------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------ | :--------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Modal Strength of Constraint:** How hard is it to overcome a design's bias? | The technical design imposes a *strong modal constraint*: functionally equivalent alternatives that avoid the disfavored social relations are either practically infeasible or prohibitively costly to implement. | The design imposes only a *practical hurdle*. Functionally equivalent alternatives avoiding the disfavored relations are always possible; overcoming the hurdle depends entirely on the resources, will, and power within the arrangement. | Matched Pair (M vs O) | Pump M will consistently correlate with hierarchical repair structures; villages using O will consistently develop more distributed repair regardless of initial village governance. | Repair structures for both pumps will vary significantly based on cooperative resources, skills, norms, and external support, not solely pump design. | Rigorous studies across diverse villages showing near-universal hierarchical repair with M *and* distributed repair with O, despite varying arrangements. | Widespread examples of M pumps maintained distributively (e.g., cracked dongles, leaked manuals) *or* O pumps centralizing due to skill shortages/coercion. |
  | **Boundary of "The Artifact":** Where does the artifact end and the arrangement begin? Does defining this beg the question? | The core material/technical configuration (e.g., sealed casing, proprietary interface) is the artifact. Its political affordance (enabling control) is intrinsic to this physical/digital geometry. | Drawing a boundary around the "artifact alone" artificially isolates it. The dongle, manuals, licensing ecosystem, and repair skills are part of the necessary arrangement enabling M's political effect. | Matched Pair (M vs O) | The difference *is* the artifact (M's sealed design vs O's open design). The arrangement amplifies or dampens, but doesn't create, the core affordance. | M only functions politically *with* the dongle supply, technician licensing, and lack of community hacking. O's openness is only realized with skills and norms. | Conclusive demonstration that M's control affordance persists even if dongles are freely available and licensing abolished (if possible). | Demonstration that O's physical openness leads to centralized control in specific arrangements (e.g., skill monopolies), negating inherent "openness". |
  | **Burden of Proof for Counterfactual Parity:** Who must show equivalent function is possible without the political effect? | If a design *requires* a disfavored relation for its core function, the burden is on the arrangement camp to demonstrate a functionally equivalent alternative that avoids it. | The burden is on the inherence camp to demonstrate that *no possible arrangement* could realize the core function without the disfavored relation, holding material constraints truly fixed. | Matched Pair (M vs O) | Burden is on Arrangement to show M's water delivery *could* be maintained without proprietary control. | Burden is on Inherence to show Pump O *couldn't* be made to enforce hierarchy (e.g., via social rules). | Arrangement camp fails, after exhaustive search/design effort, to produce a pump as reliable/cheap as M without proprietary control. | Inherence camp fails to prove O *must* lead to distributed control; clear evidence emerges of O used within highly hierarchical arrangements effectively. |
  | **Status of Omissions:** Can the *absence* of a feature be an inherent political property? | Yes. Deliberately *not* including an option (e.g., paper filing) is a design choice shaping access and control, constituting an inherent affordance for exclusion. | An omission only becomes exclusionary within an arrangement that lacks alternatives, enforces the digital requirement, and fails to accommodate needs. The absence itself isn't political. | Omission (Benefits Portal) | The portal inherently excludes users lacking digital access/skills *by design*; adding alternatives changes the artifact. | The portal only excludes if society fails to provide access/support; the design *permits* exclusion but doesn't mandate it. | Evidence that adding paper options doesn't alter core digital function, proving exclusion was an unnecessary omission inherent to the initial design choice. | Evidence that portals with identical omissions have near-universal inclusion due to robust societal support systems, proving omission isn't inherently exclusionary. |
  | **Scope for Distinct Design Ethics:** Does inherence claim ground unique designer responsibility? | Yes. If politics can be materially embedded, designers bear a direct, distinctive responsibility for those embedded consequences, distinct from implementers. | Responsibility is distributed across the arrangement (funders, regulators, maintainers, users). Designers have influence, but no unique ethical burden for inherent properties, as none exist. | N/A (Conceptual) | Designers are uniquely positioned and obligated to avoid creating artifacts with harmful inherent political affordances. | Designers are obligated to consider likely use contexts and potential misuses, but responsibility for outcomes lies with the arrangement deploying/sustaining them. | Arrangement camp conceding specific design features create *unreasonably high* barriers to just arrangements, warranting specific designer duties. | Inherence camp conceding that "inherent" effects are always contingent on context, diluting unique designer responsibility compared to other actors. |

  *Note on Verbal Disagreement:* Disputes over "inhere" often mask the modal strength disagreement. Both agree designs *have consequences*. The substantive residue is *how resistant those consequences are to change by altering the surrounding arrangement*.

  **4. Limits of Agreement**

  *   **Third-Party Rejection (Engineer):** An engineer might reject **Agreed Claim 4**, arguing "politics" should be restricted to intentional human acts of governance, not extended to technical constraints (e.g., a low bridge is physics, not politics). Both camps would counter that the *choice* to build only a low bridge where tall vehicles need access *is* political, but the engineer sees this as stretching the term.
  *   **Inherence Camp Weakness:** The camp concedes the **Orphan Artifact** case is challenging. While the courtyard *affords* surveillance, without any enforcement mechanism or intent, labeling its current state "political" feels strained, leaning towards "merely inconvenient." This highlights the role of sustaining practices.
  *   **Arrangement Camp Weakness:** The camp concedes that defending the *possibility* of counterfactuals in the **Matched Pair** case (e.g., M maintained openly) can become speculative without empirical demonstration, especially facing evidence of consistent patterns linked to M's design. The burden of proof here is a vulnerability.
