answer: |-
  Your diagnosis is insightful: the core dispute concerns the **functional role of 'better than'**, specifically whether it *must* serve a choice-guiding function that demands transitivity to avoid exploitation. The "ternary relation" and "epistemological revision" alternatives are secondary symptoms of this primary divide. Here’s why:

  ### The Functional Role Divide Explains the Stalemate
  - **Pro-transitivity camp**: Explicitly ties 'better than' to rational choice. When they say transitivity is "non-negotiable," they mean it is constitutive of *practical* betterness—a relation that fails transitivity cannot coherently guide action without exploitation. Cycle arguments aren't merely heuristic; they reveal a functional contradiction: if 'better than' is choice-guiding, cyclic relations force agents into self-defeating behavior. Thus, pairwise judgments *must* be revisable when they conflict with transitivity. Their claim is normative: betterness *ought* to license rational choice.  
  - **Non-transitivity camp**: Treats 'better than' as a purely evaluative ranking of states of affairs, decoupled from choice constraints. When they call pairwise verdicts "data," they mean these reflect intuitive axiological comparisons (e.g., minor losses for many outweighed by major gains for few). Exploitability is irrelevant because axiological betterness isn’t *for* guiding decisions—it’s a moral fact. If aggregation or incommensurability creates cycles, that’s a discovery about value’s structure, not a flaw.  

  The "ternary" and "epistemological" alternatives collapse into this primary conflict:  
  - **Ternary "better than"**: Suggested spectrum cases involve *fixed populations and goods*. If betterness shifts with context (e.g., O2 > O1 relative to "local" changes but O1 > O2 globally), this merely relabels the disagreement. Pro-transitivity theorists reject contextualism because choice requires a unified standard; non-transitivity theorists embrace it because their "data" are context-sensitive intuitions.  
  - **Epistemology of revision**: Whether a cycle demands revising pairwise judgments depends on betterness’s function. If it’s choice-guiding, revision is obligatory (cycles imply error). If axiological, revision is optional (cycles may reflect value’s complexity).  

  ### What Counts as Progress—and What Doesn’t  
  - **Progress**: A rigorous demonstration of whether practical rationality *requires* a transitive betterness relation *for coherent choice*. This demands:  
    - A formal result showing that *all* non-exploitable choice rules under uncertainty (e.g., avoiding generalized money pumps) imply transitivity, or conversely, that certain cyclic orderings permit unexploitable choice (e.g., through indexical rules).  
    - A distinction between **axiological betterness** (outcome ranking) and **practical betterness** (action-guiding relation), with clarity on which one is at stake in spectrum cases. If they can diverge, the debate dissolves.  
  - **Not progress**:  
    - More spectrum cases or tweaked intuitions—both sides already agree on the phenomena but interpret them through their functional lens.  
    - Arguments that presuppose one function (e.g., "cycles are absurd" assumes choice-guiding role; "revision betrays the data" assumes pure axiology).  
  - **Will the debate end?** Only if one function is abandoned or a unifying framework emerges. If betterness is *necessarily* choice-guiding, non-transitivity theorists must explain how to act rationally on cyclic values. If it’s *not*, pro-transitivity theorists must explain why exploitability isn’t a problem for axiology. Absent this, the debate persists—not due to confusion, but because 'better than' serves conflicting roles in ethical reasoning.  

  ### Conclusion  
  The dispute is intractable because it’s about **what betterness is for**. Progress requires decoupling or formally reconciling its evaluative and practical functions. Until then, each side is coherent internally but speaks past the other: one prioritizes action, the other moral truth. The endless cycle of spectrum arguments reflects this irreducible tension, not a lack of ingenuity.
