prompt: |-
  Not sure if this is the right place to ask this, but here goes. I'm a 3rd-year PhD student in evolutionary biology (microbial experimental evolution — endless plates, serial transfer, patches that crash) and I keep getting the same shape of result out of my simulations and I have no idea what to call it.

  Here's the shape. There are local populations — patches — and they're open: individuals migrate in from a common pool, and the patches don't really reproduce, they just persist for a while and then get washed out or crash. Now take a trait with two effects. (a) Within a patch, in any given round, the bearer does slightly better than its patch-mates — grows a bit faster, whatever, nothing dramatic. (b) The trait makes the patch it is in last longer before crashing. Both effects are perfectly ordinary individual-level effects; no spooky action.

  What keeps happening is that the trait spreads mainly because of (b), and I don't think it's any of the usual stories. It isn't kin selection: I can push patch-mate relatedness down to basically zero in the sim and it still works, because the covariance isn't coming from who is related to whom, it's coming from the fact that bearers are physically sitting in the patches that don't crash, so they get more rounds of (a). And it isn't the standard multi-level story where the group with more cooperators pumps out more total offspring and that's the between-group term — because I can set things up so the long-lived patches actually produce *fewer* total cells over the whole run than the short-lived ones (slow growth, long life), and the trait still wins. What seems to matter is how many selective episodes happen inside the patch before it dies, not how much comes out of the patch.

  Second case, different substrate, same shape as far as I can tell. A symbiont strain that extends its host's lifespan. The strain is only mildly better than its competitors within a host, and it gets diluted every round by immigration from the environment. Long-lived hosts host more rounds of within-host competition, so the strain ends up winning there — even though the extra rounds don't produce anything extra for the strain's own descendants in particular, and the hosts don't leave more offspring.

  What I can't work out is how to talk about this. Is the patch (or the host) a unit of selection here, or not? It doesn't reproduce, and I can't see that it has a fitness in any normal sense — what it has is a lifespan, or equivalently a turnover rate, or a duration measured in particle generations. And the trait's success looks like it comes from the patch's duration acting as a multiplier on how much lower-level selection happens, not on which way the lower-level selection points. I've been writing 'episode-count selection' in my notes, which is probably awful, and I half suspect it's a special case of something — some version of niche construction (the trait lengthens the environment in which it happens to be favoured), or maybe just what falls out of a multi-level / Price-style decomposition once you put a clock in it, or maybe it's that old life-history thing about output and generation time coming apart, pushed up one level.

  So: does this configuration have a name, or a home in the levels-of-selection literature? But honestly I don't want a label, I want the carving. Concretely, the things I'd want an answer to pin down:

  - Is the collective doing any causal work at all here, or is it just a background condition on individual-level selection, the way temperature is? What experiment or what bit of formalism would settle that?
  - How exactly is this different from the group-lasts-longer / group-is-less-likely-to-go-extinct version of multi-level selection, given that I can make output and duration come apart in either direction?
  - Is it niche construction or ecological inheritance, or does the fact that the modification changes only how much selection occurs (and not what it favours) put it outside those?
  - Could it be redescribed as plain individual selection with a strange fitness measure? If so, is there anything actually wrong with that redescription?
  - And the edges: what would have to be true for a case not to be an instance of this? Say the patches were closed rather than open; or the trait's effect on patch lifespan didn't depend on how common the trait was in the patch; or the within-patch advantage were exactly zero; or the trait shortened patch life but still made its bearer more likely to be in whatever persisted.

  Please don't spend words on references or citations or who said what — I can chase all that myself. I want the anatomy: what the thing is, what it is not, which of its near neighbours it's closest to and why, and if there genuinely isn't a term for it, a name plus a definition tight enough that I could look at a new case and say yes or no.
reasoning: |-
  Okay, let me try to unpack this carefully. The user is describing a recurring pattern in their microbial evolution simulations where a trait spreads primarily because it extends the lifespan of the patch (or host), even when within-patch advantage is weak and patch output is low. They've ruled out kin selection and standard multilevel selection, and are seeking conceptual clarity.

  First, I need to understand the core mechanism: the trait's success comes from accumulating more rounds of within-patch selection due to extended patch duration. The key insight is that duration multiplies selection episodes, not offspring output. This feels fundamentally different from classic group selection where groups "reproduce" - here patches just persist longer without reproducing.

  The user's frustration with existing frameworks is palpable. Kin selection fails because relatedness isn't driving it. Standard multilevel selection fails because the between-group component isn't about differential reproduction. Niche construction might seem relevant since the trait modifies the environment (patch duration), but classic niche construction focuses on changing selection pressures, not just amplifying existing ones.

  I recall similar dynamics in host-symbiont systems where longevity allows cumulative within-host selection. The "Red Queen" analogy comes to mind - not the coevolutionary version, but the literal "running faster to stay in place" aspect. Each extra generation in the patch gives the trait another chance to outcompete neighbors through its small within-patch advantage.

  For conceptual carving:
  - The collective isn't a unit of selection (no reproduction, no heritability at patch level)
  - It's not just background condition because the trait actively constructs the duration multiplier
  - The crucial difference from standard MLS is the decoupling of duration and output
  - Niche construction fits if we consider duration as an inherited ecological parameter
  - Individual-level redescription would require fitness to account for variable selection episodes - possible but messy

  Boundary cases help define it:
  - If patches were closed, it might become classic group selection
  - If trait didn't affect duration, the effect disappears
  - Zero within-patch advantage makes duration irrelevant
  - If trait shortened patch life but still won, that would be a different beast

  "Selection arena" feels right as a label - emphasizing the patch as a temporal stage where selection plays out more times. The "persistence multiplier" captures the core mechanism mathematically. What's novel is how this multiplier interacts with open populations and immigration.

  The user's "episode-count selection" term was actually quite good - just needed refinement. Their instinct about life-history concepts scaling up seems validated. This is essentially r/K selection thinking applied to the persistence of selection environments rather than organisms.

  Most importantly, they've identified a genuine gap in the formalism - most models assume selection episodes are fixed or tied to reproduction. By decoupling duration from output, they're exposing a hidden axis of evolutionary dynamics.
answer: |-
  Your configuration is both fascinating and conceptually sharp. It's not neatly captured by existing frameworks without forcing, but it **does** have a coherent identity. Let's carve it.

  ### Core Mechanism: The Persistence Multiplier
  The trait succeeds because it **extends the duration of the selective environment** in which it has a consistent (though weak) within-patch advantage. More rounds of within-patch competition → more opportunities for the small advantage to compound. Immigration constantly resets relatedness, but **duration acts as a temporal amplifier** for individual-level selection. Crucially, this amplification doesn't depend on the patch *reproducing* or *exporting* more propagules; it depends solely on *how long selection acts within the patch*.

  ### Answers to Your Concrete Questions

  1.  **Is the collective doing causal work?**  
      *Yes, but not as a unit of selection.* The collective (patch/host) is a **structuring agent** for time. Its persistence duration is an *emergent property* caused by the aggregate trait value within it. This duration *modulates the intensity* of individual selection. It's not just background (like temperature) because:  
      - **Experiment**: Manipulate patch lifespan *independently* of the trait (e.g., artificially extend/shorten patch lifespans). If trait success correlates with *manipulated* lifespan even when the trait's effect on lifespan is disabled, then lifespan is a background condition. If trait success *requires* the trait's *own* effect on lifespan (and thus its aggregation within patches), then the collective state (lifespan) is causally active. Your setup implies the latter.

  2.  **How is this different from standard "group lasts longer" MLS?**  
      Standard MLS requires **differential productivity** (groups with more trait-bearers produce *more offspring groups or migrants*). Your key insight: **Output (productivity) and Duration (persistence) are decoupled**.  
      - In standard MLS, a longer-lived group wins by *exporting more*.  
      - Here, a longer-lived group wins by *hosting more internal selection*. The "between-group" component in Price decompositions typically captures differential *output*. Your effect lives in the **covariance between trait value and the *number of within-group selection events***. This is often buried in the "transmission" or "expectation" terms, not the classic between-group covariance.

  3.  **Niche Construction (NC) / Ecological Inheritance?**  
      *It fits, but with a twist.*  
      - **NC**: The trait modifies the environment (patch lifespan). This modification changes the *intensity* of a consistent selective pressure (within-patch competition favoring the trait), not its *direction*. Classic NC often focuses on changing the *nature* of selection (e.g., building a dam changes predation pressure). Your case is NC **specifically amplifying an existing selective bias via temporal extension**.  
      - **Ecological Inheritance**: Descendant individuals (via migration) inherit a *patch environment* with an extended lifespan *caused by* previous bearers. It's inherited persistence.

  4.  **Redescription as individual selection?**  
      *Possible, but awkward and obscures the mechanism.* You *could* define an individual's fitness as:  
      `Fitness = (Expected # of offspring within patch) * (Expected # of competitive rounds in its patch)`  
      The second term depends *on the collective state of the patch*. This forces fitness to be frequency-dependent and context-dependent in a way that masks the causal role of patch persistence. It's mathematically reducible, but biologically misleading. The "strangeness" highlights why the collective level is explanatorily useful.

  5.  **The Edges: When is it NOT this?**  
      - **Closed Patches (No Immigration)**: Shifts towards classic group selection. Within-patch fixation becomes possible; success depends on group output *and* duration. Your effect relies on constant within-patch competition fueled by immigration.  
      - **Trait Effect Independent of Patch Composition**: If patch lifespan extension depends *only* on an individual bearing the trait, not on the *aggregate* trait value (e.g., each bearer adds fixed time regardless of others), it becomes closer to individual selection + background condition. Your effect requires the *collective* to influence lifespan (emergent property).  
      - **Within-Patch Advantage = Zero**: The trait fails. The persistence multiplier amplifies *nothing*. This distinguishes it from traits that win purely by extending persistence without within-patch advantage (e.g., via pure survival).  
      - **Trait Shortens Patch Life but Wins**: This would be a fundamentally different mechanism (e.g., faster exploitation allowing escape before collapse). Your mechanism relies on the trait *increasing* the number of selection rounds it experiences.

  ### What to Call It & Its Home
  *   **Best Label: Selection Arena Persistence Multiplier (or SAPM)**
  *   **Core Definition:** A mode of selection where a trait spreads primarily because it extends the persistence duration of the local selective arena (patch, host, etc.) in which it experiences a consistent competitive advantage, thereby increasing the number of rounds of selection amplifying that advantage, independent of the arena's reproductive output or the relatedness of co-occurring individuals.

  *   **Closest Conceptual Neighbors:**  
      - **Niche Construction (Temporal Amplifier subtype):** Focuses on the trait modifying the environment (lifespan) which inherits the modification.  
      - **Multi-Level Selection (Duration-Decoupled):** Shares the nested structure, but decouples the "group effect" (persistence) from productivity.  
      - **Life-History Evolution (Scaled Up):** Separating generation time (here, patch lifetime) from reproductive output is analogous to r/K tradeoffs, but applied to the persistence of the *arena* for lower-level selection.

  ### Why This Carving Matters
  Your setup reveals that **persistence time of a selective environment is a distinct selective force**, separable from reproductive output and relatedness. It's particularly potent in open systems with turnover (like microbial patches or symbiont-host systems) where selection within persistent arenas can outweigh dispersal or productivity advantages. The SAPM framework explicitly highlights this temporal dimension often submerged in standard models. It tells you to look for: **weak consistent within-arena advantage + trait effect on arena lifespan + immigration preventing fixation + decoupling of lifespan from output.**

  You've hit upon a robust and distinct evolutionary mechanism. Niche construction provides the closest existing umbrella, but SAPM specifies the *temporal amplification* mechanism clearly. Use "Selection Arena Persistence Multiplier" – it captures the anatomy.
