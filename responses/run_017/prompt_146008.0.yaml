prompt: |-
  I've been reading about causation by omission on my own for a couple of months now (no philosophy background, I just get hooked on things), and the case I keep coming back to is the SS Californian on the night the Titanic sank. Here are the facts as I want them stipulated, because I know a few are still argued about and I don't want the answer to turn into an argument about the history: the Californian was stopped in pack ice somewhere in the neighborhood of fifteen to twenty miles from where the Titanic went down; the Titanic's distress rockets were seen from the Californian's bridge and reported to Captain Lord, who was asleep below and was not woken; the Californian's only wireless operator had shut his set off and gone to bed roughly an hour before the distress calls went out, so they were never recieved; and — take this as given even though people still dispute it — the Californian could have worked through the ice in time to reach the lifeboats and pull people out. Also relevant, I think: there was no requirement or custom at the time for a cargo ship to keep a twenty-four-hour radio watch, and the operator was a Marconi company man whose actual job was mostly passenger telegrams. At the inquiries afterward, the failure to go to help was treated as causing deaths, and the rules about continuous watch and about answering a distress call were changed because of it.

  So what I want is an analysis of that episode through the causation-by-omission literature, in both directions: what the theories say happened and who (if anyone) caused what, and what the episode shows about the theories. Concretely: (1) Set up the mapping properly — who the candidate agents are and what each one's omission was, at all the levels you can find (the operator asleep, the officer who decided not to wake the captain, the captain who didn't order the ship to move, the standing practice of not keeping a night watch, the company that staffed and scheduled the wireless, and the other ships in the area). (2) Run plain but-for / difference-making first and tell me where it over-generates — on the but-for view it looks like basically everyone who could have done anything and didn't is a cause, including people who had no idea a ship was sinking, and I want you to say honestly whether that's a bug or whether I'm just smuggling in my own moral reaction. (3) Then the mechanism side: the complaint that an omission isn't the kind of thing that can be a cause because nothing happened and there's no process to point to, plus the "baseline" or default problem — does the causal verdict change depending on whether the omitted action was normal practice at the time (no night watch was standard) or a deviation from it, and if the theory has to import a norm or a default to get an answer, has the causal claim quietly become a moral one? (4) I also have my own half-baked idea I want you to test rather than humor: that an omission causes something only if the omitted action was *live* for the agent at the time — on their actual menu, something they were in a position to do and might realistically have done, not a wild hypothetical like "if the Californian had been a helicopter." Apply that to the four or five omissions you listed and tell me which ones it saves and which it kills. The place I think it breaks is the agent who makes sure nothing is ever live — the person who trains themselves not to open the telegram, not to think about it, not to ask — so please press hard there and tell me if that sinks it. (5) Finally, the direction back: does the fact that the duties were created *after* the disaster mean the causal judgment is retrospective and interest-relative? Does this case suggest that when we call an omission a cause we're really doing blame allocation and rule-making rather than describing the world? And say plainly where the whole apparatus goes silent — for instance on how many deaths, or which deaths, if you can't model what the rescue would have looked like.

  Can you lay it out in these sections, roughly: "The setup: agents and omissions" (about 150 words), "But-for and where it over-generates" (about 250), "Mechanism, defaults, and the normativity worry" (about 250), "Testing the liveness idea" (about 250), "What the case does back to the theory" (about 250), "Settled vs. contested" (about 150), and "Bottom line" (about 100). In the settled-vs-contested part please actually separate what's agreed among people who work on this from what's genuinely fought over, and don't dress up a minority or your own view as the consensus — I'd rather know when you're guessing or when the literature just doesn't settle something. Also flag which bits of my liveness idea already exist in some form and which are just me, though please don't send me off to read anything, I've got enough half-finished pdfs as it is.
