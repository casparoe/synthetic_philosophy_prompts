prompt: |-
  Hey — I'm on the grants committee of a small private foundation (mostly engineers, one retired biologist, and me; I write backend services for a freight-logistics company, so philosophy is really not my thing). I need a memo I can circulate to the other trustees before we vote on Saturday morning.

  The setup: we have one last big grant to place, about $22M, and there's a hard wrinkle — the trust has to spend down everything within nine years, so by our own rules anything whose payoff arrives several centuries out is off the table no matter how large it is.

  Finalist A is an astronomy group that wants telescope time to check the atmospheres of a few hundred rocky exoplanets for signs of life. The thing that makes their proposal weird is that their estimate of the chance of a hit doesn't come from data at all. It comes from a sampling argument: roughly, you should reason as if you'd been randomly drawn from all the observers there ever are, and a universe where observers are extremely numerous makes your own existence much more likely than a universe where they're rare, so conditional on finding yourself existing you should expect life to be common, so their survey is likely to succeed and the upside is enormous.

  Finalist B is a "civilizational snapshot and archive" project: a distributed, redundancy-heavy record of what we know, plus near-term resilience work. Their case runs the other way: reason as if you're a random draw from the actual population of observers of your kind, in which case you should expect to be somewhere around the middle of the human story rather than right at the start of it, so the future probably isn't enormous and we should stop pretending far-future payoffs are where the value is and spend on things that pay off inside the spend-down window.

  Then there's the bit I can't get straight. In the Q&A, team A added a second argument that's been nagging at me: they say the bare fact that this decision is being made *now* — in the very first slice of history in which a committee like ours could fund a search like this — is itself a piece of evidence, and that it favors funding them under either style of reasoning. Their framing: either observers turn out to be common, in which case life is probably out there and the survey hits; or the window in which a civilization gets to do this kind of thing is short, in which case there won't be many later chances and we should fund it while we can. That feels to me like it might be a heads-I-win move, or it might be fine, and I genuinely can't tell which.

  They also offered, if funded, to pre-commit in advance to exactly who counts as "an observer of our kind" and to publish the analysis twice — once under each style of reasoning. Our science advisor says that's theatre: the disagreement isn't about the data, it's about the prior you walk in with, so locking the reference class down early doesn't buy anything. I lean his way but I'd like it argued properly.

  What I want from you is a decision memo, 900–1200 words, addressed to the committee, that:

  1. Opens with an actual bottom line — fund A, fund B, fund neither, or fund one with conditions. If conditions, make them concrete with numbers and dates we could vote on.
  2. Explains the disagreement to people who think in terms of priors and likelihoods rather than philosophy jargon. Two short paragraphs and at most one analogy. Please don't condescend to us about it — several trustees are perfectly capable of following a likelihood argument.
  3. Takes on what I think of as the armchair objection: a couple of trustees think you cannot extract billions of dollars' worth of conclusion about how much life exists from reasoning done sitting in a chair with no new measurements, and that a grant committee especially has no business doing it. I half agree with them. But I also want the strongest honest version of whichever position you end up rejecting — if you tell me to fund B, give me the version of the "observers are probably numerous so the upside is gigantic" argument that actually stings, not a version you can knock over.
  4. Says what our nine-year spend-down rule does to the argument. Does it make the long-future-versus-short-future fight irrelevant to us, or does it just relocate it somewhere we haven't noticed?
  5. Handles the "we're deciding this now" argument and the pre-registration offer head-on, and tells us whether a null result from the survey would even discriminate between the two styles of reasoning. My guess is it wouldn't, but tell me why.
  6. Optionally, if you think it's worth a short paragraph: one trustee pointed out that if the "many observers" picture is right then there will be an enormous number of future funding committees in roughly our position, so the *procedure* we adopt today gets copied many times and its value is multiplied, whereas under the other picture there aren't many such committees — so maybe how we decide matters more than what we decide. Is that a real consideration or a rhetorical trick?

  Constraints: no citations, no bibliography, no "so-and-so argues" — we can't check any of that and nobody here will read it. Reason from the shape of the case itself, and keep the jargon defined in plain terms the first time it appears.

  And please commit. Don't hand me a balanced menu and leave the choice to us — that's the one thing that'll be useless on Saturday. Tell me which way to vote, say roughly how confident you are as a fraction, and name the single thing that would most change your recommendation if we found it out.
reasoning: |-
  Okay, I need to help the user draft a decision memo for their foundation's grant committee. The user is a backend engineer on a committee with mostly technical members, facing a complex philosophical choice between two astrophysics proposals with existential implications.

  First, let's unpack the core conflict. Both proposals rest on opposing anthropic principles: Team A uses the "self-sampling assumption" (SSA) to argue we should expect life to be common, while Team B uses the "self-indication assumption" (SIA) to suggest humanity is likely near its midpoint. The added twist is Team A's claim that the very timing of this decision supports their case.

  The nine-year spend-down rule is crucial here. It means any benefits beyond that horizon are irrelevant to this committee's mandate. This immediately weakens Team A's "gigantic upside" argument since interstellar discovery payoffs would likely exceed our timeframe. Team B's resilience work, however, could plausibly yield benefits within nine years.

  I'm skeptical about Team A's "heads I win" timing argument. If civilizations have short windows, that actually supports Team B's position about limited future potential. And their preregistration offer seems performative since the core disagreement is about priors, not methodology.

  The procedure-multiplier argument is intriguing but ultimately unconvincing. Even if SSA were correct, future committees wouldn't necessarily copy our decision framework. More importantly, it doesn't change the spend-down constraint.

  Team B's proposal has clearer near-term value: preserving knowledge could help civilization weather crises in our decision window, and their resilience work might directly prevent backsliding. The marginal cost of adding archive redundancy seems trivial at this funding scale.

  For the memo structure: I'll lead with a clear "fund B" recommendation, then unpack the anthropic reasoning in plain terms. Need to respectfully address the "armchair objection" by acknowledging its validity while noting Team B avoids this trap. The timing argument needs dismantling, and we should explain why a null result wouldn't resolve the philosophical divide.

  Most convincing counterargument? If SSA is right and life is plentiful, Team A's survey could make contact within years. But given light-speed constraints and the spend-down clock, even success might not produce tangible benefits in time.

  The confidence call: 80% for Team B, but if we learned Team A could definitively detect biosignatures within 5 years (unlikely given their proposal), that might sway me. Otherwise, Team B's alignment with our timeframe and concrete deliverables makes it the pragmatic choice.
answer: |-
  ## MEMORANDUM  
  TO: Foundation Trustees  
  FROM: AI Analysis Team  
  SUBJECT: Grant Recommendation for Final $22M Allocation  
  DATE: 7 October 2023  

  **Bottom Line: Fund Finalist B ("Civilizational Snapshot and Archive") with the following binding conditions:**  
  1.  **$18M** allocated immediately for core archive development, redundancy implementation, and near-term resilience grants (e.g., grid hardening, seed vaults, pandemic surveillance).  
  2.  **$4M** placed in escrow, released only if Team B achieves verifiable, operational redundancy across ≥3 geologically stable locations and demonstrates ≥5 high-impact resilience interventions within **7 years**.  
  3.  **Vote:** Approve Team B with conditions as stated.  

  **Confidence:** 80%. The primary uncertainty is the exact scalability of Team B’s resilience work, but their core archival mission is intrinsically valuable within our window. The key factor that could shift this recommendation? If Team A could demonstrate their atmospheric analysis has a ≥10% chance of yielding *definitive* biosignature detection **within 5 years** (their proposal suggests centuries).  

  ### 1. Understanding the Core Disagreement (Without Philosophy)  
  The debate centers on how to interpret *our own existence* when estimating the abundance of life or the length of humanity’s future.  

  *   **Team A's Logic (Self-Sampling Assumption - SSA):** Imagine pulling one observer at random from *all observers* that will ever exist. Finding yourself existing *now*, rather than in the far future trillions, suggests observers are *not* overwhelmingly numerous. Otherwise, you'd likely be one of the trillions later. Therefore, humanity’s future is probably **short** (few observers total), so prioritize actions with impact *now*.  
  *   **Team B's Logic (Self-Indication Assumption - SIA):** Imagine pulling one observer at random from *all possible observers* across *all possible universes*. Your existence is more likely in a universe teeming with observers than in a barren one. Therefore, observers (like us) are probably **common** in the universe, making a life-detection survey likely to succeed with enormous upside.  

  **The Armchair Objection (Addressed Honestly):** Several trustees rightly question deriving billion-dollar conclusions from abstract reasoning alone. **This objection is strongest against Team A.** Their core argument (SIA) *is* fundamentally prior-driven philosophy applied to cosmology. While intriguing, granting $22M based primarily on this untestable prior is inappropriate for our committee. Team B’s SSA argument, while also philosophical, *reinforces* their practical focus on near-term resilience – a focus compatible with traditional cost-benefit analysis using observable data about current threats. Team A’s *survey* involves real measurements, but their *justification for its high likelihood of success* relies heavily on the armchair SIA prior.  

  ### 2. The Nine-Year Rule: It Makes Team A's Upside Irrelevant  
  Our mandate is explicit: payoffs must be reasonably expected within nine years. Team A’s potential payoff – discovering extraterrestrial life – is profound, but its *value realization* for humanity (scientific paradigm shift, societal impact) unfolds over decades or centuries. **Even if they succeed immediately, the tangible benefit *within our window* is minimal** (a scientific paper). Team B’s archive and resilience work, by design, delivers concrete outputs (preserved knowledge, hardened infrastructure) demonstrably within 5-9 years. The "long-vs-short future" debate becomes practically irrelevant *for us* under Team A, as their upside is deferred far beyond our horizon. Team B’s focus aligns directly with the constraint.  

  ### 3. The "Decision Now" Argument & Pre-Registration  
  Team A claims the mere fact we are deciding *now* supports funding them: either life is common (survey succeeds), or civilization is fragile (so fund before collapse). **This is a heads-I-win maneuver:**  

  *   **If SIA (life common) is correct:** Funding them *seems* good, but we can't realize the payoff in time.  
  *   **If SSA (future short) is correct:** Funding them is *worse*, as we wasted $22M on a deferred payoff instead of near-term resilience during our probable short window.  

  The **pre-registration offer** (defining "observer" upfront, publishing both analyses) is indeed theater. As our advisor noted, the core dispute is the *starting assumption* (SSA vs SIA prior), not the data analysis method. Locking definitions doesn't resolve which prior is valid.  

  **Would a Null Result Discriminate? No.**  
  A null result (no biosignatures found) is ambiguous:  
  *   Under **SIA (life should be common):** It could mean we got unlucky with this sample, our detection methods are flawed, or life is rarer than the prior assumed (undermining SIA itself).  
  *   Under **SSA (future probably short):** A null result is unsurprising, reinforcing the view that we shouldn't have bet heavily on abundant life.  
  Neither philosophy is cleanly falsified by one survey.  

  ### 4. The "Procedure Multiplier" Argument  
  One trustee suggests: if observers *are* numerous (SIA), our decision procedure gets copied many times, amplifying its importance; if not (SSA), it matters little. **This is more rhetorical trick than a real consideration for us:**  

  1.  **Uncertain Leverage:** Even under SIA, there's no guarantee future committees face identical choices or adopt our logic.  
  2.  **Our Mandate Rules:** Our *procedure* is bound by the spend-down rule. Choosing an action (Team B) that delivers within our window is the procedurally correct choice *regardless* of the cosmic context.  
  3.  **Negligible Added Weight:** The marginal impact of our specific $22M decision procedure on hypothetical future trillions is vanishingly small compared to the concrete impact of the grant itself within 9 years.  

  ### Strongest Case for Team A (Honestly Stated)  
  The genuinely compelling argument for Team A is this: *If* the Self-Indication Assumption (SIA) is correct, life *is* likely common in the universe. Detecting it would be the single most profound discovery in human history, fundamentally altering our understanding of our place in the cosmos. Funding their survey is the critical first step. The potential upside is literally astronomical and unique to this type of investigation. While the payoff timing is uncertain, securing the data *now* is essential, and our foundation has a rare chance to catalyze this epochal discovery. Failing to fund this search when we have the means, driven by near-term constraints, could be seen as a profound failure of vision by future generations. The "decision now" argument, while logically fuzzy, captures an intuitive truth: this *is* a pivotal moment in capability, and windows of opportunity can close.  

  ### Recommendation Reiterated: Fund Team B with Conditions  
  While Team A’s vision is grand, our spend-down rule forces a focus on tangible, near-term impact. Team B’s project delivers concrete value within our window: preserving humanity’s knowledge against clear, present risks, and actively improving resilience against known near-term threats. Their core mission succeeds irrespective of the unresolved SSA/SIA debate. Team A’s justification relies too heavily on an untestable prior (SIA), their payoff is almost certainly deferred far beyond our horizon, and their "decision now" argument doesn't withstand scrutiny. The $4M escrow condition ensures accountability for Team B’s resilience deliverables.  

  **Vote: Approve Finalist B with the stated funding conditions.**
