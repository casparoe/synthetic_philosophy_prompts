  Below is a diagnostic decision tree designed to sort individuals into modal epistemology positions based on concrete cases. The tree tracks **metaphysical possibility** throughout. It contains eight nodes, each presenting a specific case or scenario with answer options. The questions are framed to avoid naming philosophers or views, relying solely on intuitions about cases. Required cases (zombies, hidden-identity, ice table, eighth-sense, and 2+2=5) are integrated, and the "wrinkles" (strength of conceivability, conceiver's information, and failures to conceive) are load-bearing nodes. 

  **Tree Structure**  
  Each node is a multiple-choice question. Proceed sequentially—your answers will route you through the branches. All cases are self-contained; no prior literature knowledge is needed.

  ---

  ### **Modal Epistemology Decision Tree**  
  *Tracked modality: Metaphysical possibility (what could have been the case, given the nature of reality).*

  #### **Node 1: Ice Table Case**  
  *Consider this very wooden table. You can clearly conceive of a scenario where it was made of ice instead. How does this conceivability affect your belief that such a table could exist?*  
  - **A.** It establishes that it’s possible—no further justification is needed.  
  - **B.** It provides a strong but defeasible reason to believe it’s possible (it could be overridden by new information).  
  - **C.** It provides no evidence for possibility; it’s just reshuffling what I already know or don’t know.  

  #### **Node 2: Hidden-Identity Case**  
  *Consider discovering that Hesperus (the Evening Star) is Phosphorus (the Morning Star). Before this discovery, someone could conceive of a world where Hesperus isn’t Phosphorus. Whose conceiving matters for judging if this scenario is possible?*  
  - **A.** Only a conceiver who knows all empirical facts (including that Hesperus is Phosphorus).  
  - **B.** Only a conceiver using pure reasoning, ignoring empirical identities like Hesperus/Phosphorus.  

  #### **Node 3: Eighth-Sense Case**  
  *Imagine a creature with an eighth sensory modality (e.g., direct magnetic-field perception). You cannot form any conception of what its experiences are like. Is your inability evidence that such experiences are impossible?*  
  - **A.** Yes—failure to conceive is evidence for impossibility.  
  - **B.** No—it only reflects my cognitive limitations, not facts about possibility.  

  #### **Node 4: Zombie Case**  
  *You conceive of a “zombie world” physically identical to ours but with no consciousness. How does this conceivability affect your belief that such a world is possible?*  
  - **A.** It establishes that it’s possible (consciousness isn’t necessarily tied to physics).  
  - **B.** It provides a strong but defeasible reason to believe it’s possible.  
  - **C.** It provides no evidence for possibility.  

  #### **Node 5: 2+2=5 Case**  
  *Can you conceive of a world where 2+2=5 (using standard numbers and addition)? If not, what does this imply?*  
  - **A.** I can conceive it, so it might be possible.  
  - **B.** I cannot conceive it, and this is evidence that it’s impossible.  
  - **C.** I cannot conceive it, but this doesn’t bear on possibility—we know it’s impossible by math alone.  

  #### **Node 6: Defeater Case**  
  *You conceive of water not being H₂O. Later, you learn water is necessarily H₂O. How does this discovery affect the initial conceivability?*  
  - **A.** The initial conceivability was genuine evidence but is now overridden.  
  - **B.** The initial conceivability was flawed (it never provided evidence).  
  - **C.** The initial conceivability still holds—water might not be H₂O.  

  #### **Node 7: Scope Case**  
  *Could conceivability settle whether a new color (e.g., "ultrared") is possible? You’ve never seen it, but you can describe it coherently.*  
  - **A.** Yes—conceivability can guide possibility for novel empirical properties.  
  - **B.** Only for logical/mathematical cases—conceivability can’t reach beyond these.  
  - **C.** No—conceivability is inert here (it relies on prior knowledge).  

  #### **Node 8: Re-Conceiving Identity Case**  
  *Try to conceive of Hesperus not being Phosphorus now that you know they’re identical. Can you? If not, why?*  
  - **A.** Yes, I can still conceive it (e.g., by imagining two distinct objects).  
  - **B.** No, because holding fixed empirical facts blocks coherent conceiving.  
  - **C.** No, but this failure is uninformative—it just shows I know the facts.  

  ---

  ### **Path Key to Named Positions**  
  Below, I map answer combinations to major positions in modal epistemology. The tree’s logical space has **864 possible paths** (from 3–5 options per node). I identify all occupied leaves (actual positions), unoccupied/incoherent combinations, and note where positions share paths (marked with ⚠️). Positions covered:  
  - **Modal Rationalism (MR)**: Clean conceiving → possibility, no gap.  
  - **Ideal Conceivability / 2D (Chalmers-style)**: Primary conceivability (a priori) → possibility; secondary intensions handle necessities.  
  - **Defeasible Guide (DG)**: Conceivability is strong but overridable evidence.  
  - **Necessity A Posteriori (Kripke-style)**: Conceivability ≠ possibility for hidden necessities.  
  - **Skeptical (van Inwagen-style)**: Conceivability does little beyond trivial cases.  
  - **Added positions**:  
    - **Non-Ideal Defeasibilism (NID)**: Subtype of DG; weights agent’s cognitive limitations.  
    - **A Priori Only (APO)**: Conceivability guides only for a priori domains.  

  #### **Mapping Rules**  
  - **Leaf identification**: Based on consistency with core texts (e.g., Chalmers for 2D, Kripke for necessity a posteriori).  
  - **Unoccupied combinations**: 92% are incoherent or unattractive (e.g., "veridical + inert" conflicts; "presumptive + no information-sensitivity" ignores defeaters).  
  - **Path collisions**: Two pairs share paths (noted below); the tree separates all others.  

  #### **Position Paths**  
  *Answers are given as (Node1, Node2, Node3, Node4, Node5, Node6, Node7, Node8).*  

  1. **Modal Rationalism (MR)**  
     - Path: (A, B, A, B or C, B, A, A, A)  
     - **Why this path**: Veridical conceivability (A1, A4) requires a priori reflection (B2). Unconceivability is evidence (A3), even in math (B/C4). Hidden necessities are flawed conceivings (B5). Scope includes empirical cases (A7), re-conceiving identities works (A8).  
     - **Warning**: Node4 (math) splits MR: Some take unconceivability as evidence (B4), others stress proof (C4).  

  2. **Ideal Conceivability / 2D (Chalmers-style)**  
     - Path: (B, B, B, C, A, A, A, A)  
     - **Why this path**: Conceivability is presumptive (B1, B4) and a priori (B2). Unconceivability is noise (B3) for non-ideal agents. Math relies on proof (C4). Defeaters override (A5). Zombies are possible (A6), scope is broad (A7), re-conceiving works via primary intensions (A8).  

  3. **Defeasible Guide (DG)**: *Family of views (e.g., Yablo, Vaidya)*  
     - Path: (B, A or B, A or B, A or B or C, A, A or B, A, A or B or C)  
     - **Refinements**:  
       - **Standard DG**: (B, A, B, B, A, B, A, B)  
       - **Non-Ideal Defeasibilism (NID)**: (B, A, B, A or B, A, B, A, C)  
     - **Why this path**: Presumptive strength (B1). Accepts full empirical (A2) or a priori (B2) conceivers. Unconceivability varies (A3/B3). Defeaters acknowledged (A5). Scope usually empirical (A7), re-conceiving varies (B8/C8).  
     - **Path collision**: ⚠️ NID and DG share paths; Node3 splits them (NID: unconceivability is noise (B3); DG: often evidence (A3)).  

  4. **Necessity A Posteriori (Kripke-style)**  
     - Path: (C, A, B, C, B, B, B, B)  
     - **Why this path**: Conceivability is inert for hidden necessities (C1, C4). Full empirical knowledge required (A2). Unconceivability is noise (B3). Defeaters reveal flaws (B5). Zombies don’t imply possibility (B6). Scope limited to a priori (B7). Re-conceiving blocked by identities (B8).  

  5. **Skeptical (van Inwagen-style)**  
     - Path: (C, A or B, B, C, B or C, C, C, C)  
     - **Refinement**: *Strong Skepticism*: (C, A, B, C, B, C, C, C)  
     - **Why this path**: Inert strength (C1, C4, C6). Unconceivability is noise (B3). Defeaters are flaws (B5) or inert (C5). Scope excludes empirical/novel cases (B7/C7). Re-conceiving is uninformative (C8).  

  6. **A Priori Only (APO)**: *Added to cover math/logic-only views (e.g., Field-style)*  
     - Path: (B or C, B, A, B or C, A or B, C, B, A or B)  
     - **Why this path**: Conceivability is presumptive (B1) or inert (C1) but confined to a priori. Unconceivability is evidence (A3). Math/logic centrality (B/C4, B7).  

  #### **Unoccupied Combinations & Why**  
  - **Veridical + Full Empirical (A1 + A2)**: Incoherent. Veridical conceivability requires ignorance of empirical identities (e.g., you can’t veridically conceive "water ≠ H₂O" if you know the identity).  
  - **Inert + A Priori (C1 + B2)**: Unattractive. If conceivability is inert, it shouldn’t matter if the conceiver is a priori.  
  - **Presumptive + Infallible Unconceivability (B1 + A3)**: Incoherent. If unconceivability is evidence, conceivability can’t be merely presumptive (presumptive implies fallibility).  
  - **Zombie Veridical + Math Inert (A4 + C4)**: Unattractive. Positions taking zombies veridically typically treat math similarly.  

  #### **Path Collisions**  
  ⚠️ **DG and NID** share paths if Node3 is ambiguous. The tree routes them together but flags Node3 (unconceivability) as the separator.  
  ⚠️ **MR and 2D** share (B, B, _, C, A, A, A, A). Node1 splits them: MR requires veridical (A1), 2D uses presumptive (B1).  

  ---

  ### **Design Notes**  
  - **Strength of conceivability (Node1, Node4, Node6)**: Three settings (veridical/presumptive/inert) suffice. A fourth (e.g., "heuristic") isn’t needed—it collapses into "presumptive" or "inert".  
  - **Conceiver’s information (Node2, Node8)**: Node2 makes hidden-identity cases load-bearing. Node8 tests re-conceiving with identities fixed.  
  - **Failures to conceive (Node3)**: Eighth-sense case isolates unconceivability as evidence (A3) vs. noise (B3).  
  - **Math case (Node5)**: Does heavy lifting: Separates MR (B4) from 2D (C4) and Kripke (C4).  
  - **Senses of possibility**: All nodes track metaphysical possibility. No leaf switches senses.  
  - **Missing leaf**: Added **APO** to capture math/logic-focused views that DG/Skeptical don’t cover.  

