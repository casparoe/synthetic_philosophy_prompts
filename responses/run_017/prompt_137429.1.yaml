  **Interim Guidance on the Retention of Factual Material and the Management of Public Assertion**  
  **Issuing Authority:** Bureau of Public Communication and Information Management  
  **Effective Date:** Immediate  
  **Reference:** BPCIM Directive 74-03 (Interim)  

  ### 1. Purpose and Scope  
  This guidance establishes standardized protocols for the retention of factual material and the formulation of public assertions. It applies to all personnel at Grade 15 and above. Compliance ensures alignment with organizational efficiency objectives and mitigates reputational exposure.  

  ### 2. Definitions  
  2.1. **Factual Material**: Recorded data purporting to describe past or present states of affairs, regardless of medium (e.g., memoranda, datasets, minutes).  
  2.2. **Public Assertion**: Any official statement disseminated to external stakeholders or the general public.  
  2.3. **Retention**: Preservation of factual material in an accessible format.  
  2.4. **Disposal**: Irreversible destruction or sequestration of material to prevent reconstruction.  

  ### 3. Principles of Information Stewardship  
  3.1. **Minimization**: Retention of factual material shall be limited to instances where operational necessity is validated per Section 5.  
  3.2. **Compartmentalization**: Access to retained material must adhere to need-to-know principles (see Section 7.2).  
  3.3. **Forward Compatibility**: Public assertions must remain adaptable to evolving operational contexts without dependency on static records.  

  ### 4. Retention Thresholds and Disposal Timelines  
  4.1. Material not explicitly categorized as Tier 1 or Tier 2 (Annex A) shall be disposed of within 72 hours of creation or receipt.  
  4.2. Disposal must preclude forensic recovery (e.g., incineration, cryptographic erasure).  
  4.3. Material superseded by iterative updates shall be disposed of immediately upon version finalization.  

  ### 5. Procedures for Factual Record Creation  
  5.1. A **Record Creation Justification Form** (RCJF-7) must be submitted to the Office of Archival Oversight (OAO) prior to documenting factual material.  
  5.2. Approval requires demonstration of:  
  &emsp;(a) Statutory obligation;  
  &emsp;(b) Irreducible operational dependency;  
  &emsp;(c) Absence of non-documentary alternatives (e.g., oral briefings).  
  5.3. Drafts, working notes, or interim analyses are categorically excluded from retention eligibility.  

  ### 6. Oral Briefing Protocols  
  6.1. For matters of elevated sensitivity or strategic fluidity, oral briefings are the preferred dissemination method.  
  6.2. No minutes, recordings, or summaries of oral briefings shall be created unless mandated under Clause 9.3 (reserved).  
  6.3. Participants shall limit retention of briefing content to elements directly relevant to assigned tasks.  

  ### 7. Public Assertion Development  
  7.1. Assertions must derive exclusively from retained Tier 1 material (Annex A).  
  7.2. Drafting committees shall comprise personnel cleared only for material pertinent to the immediate assertion scope.  
  7.3. Where no retained material exists on a subject, assertions may be formulated using:  
  &emsp;(a) Current situational assessments;  
  &emsp;(b) Projected operational trajectories;  
  &emsp;(c) Consensus-derived interpretive frameworks.  

  ### 8. Prohibited Conduct and Disciplinary Measures  
  8.1. Unauthorized assertion of factual claims based on personal recollection, unvetted observation, or non-retained material constitutes a Category 3 infraction.  
  8.2. Violations will incur administrative sanctions, including but not limited to reassignment, suspension, or termination.  

  ### 9. Annex A: Retention Tier Classification  
  **Tier 1 (Mandatory Retention)**  
  - Material cited verbatim in prior public assertions.  
  - Statutorily required compliance documentation.  
  **Tier 2 (Discretionary Retention)**  
  - Material critical to active contingency planning (retention period not to exceed 30 days).  
  **All other material**: Automatic disposal.  

  ### 10. Annex B: Record Creation Justification Form (RCJF-7) – Worked Example  
  **Section 1: Material Description**  
  *Field Report 2023-114: Meteorological data indicating coastal flooding risk in Sector Delta.*  
  **Section 2: Justification for Retention**  
  *Required for statutory environmental compliance (Ref: Env. Reg. 45-9).*  
  **Section 3: Non-Documentary Alternatives Assessed**  
  *N/A – Regulatory audit requires verifiable records.*  
  **OAO Determination:** APPROVED (30-day retention).  
  *Post-approval note: After 30 days, data superseded by Forecast Model v.3.1. Original disposed per Section 4.3. Subsequent public assertions referenced v.3.1 outputs exclusively.*  

  ### 11. Review and Compliance  
  This guidance remains in effect until incorporation into the BPCIM Operations Manual (Rev. 12). Compliance audits will be conducted quarterly.  

  ---

