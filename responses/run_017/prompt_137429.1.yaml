  **Interim Guidance on the Retention of Factual Material and the Management of Public Assertion**

  **Issued by:** Bureau of Public Communication and Information Management  
  **Effective Date:** [Redacted]  
  **Reference:** BPCIM Circular 202X-04  

  **1. Purpose and Scope**  
  This guidance establishes interim procedures for the handling of factual material in the context of public assertion. It applies to all senior staff and aims to ensure that public communications are managed in a manner consistent with organizational efficiency and the principles of information security. The guidance does not address the content of public assertions, but rather the conditions under which factual material is retained or disposed of, and the processes by which assertions are developed and released.

  **2. Definitions**  
  2.1. "Factual Material" refers to any recorded information that purports to describe a state of affairs in the world, regardless of medium.  
  2.2. "Public Assertion" means any statement, whether written or oral, made by or on behalf of the organization to persons outside the organization.  
  2.3. "Retention" denotes the preservation of factual material in an accessible form.  
  2.4. "Disposal" includes destruction, deletion, or other forms of rendering factual material inaccessible.  

  **3. Principles of Information Management**  
  3.1. Factual material should be retained only when strictly necessary for operational continuity or as required by extant regulations. The default position is non-retention.  
  3.2. Information shall be compartmentalized such that access is limited to those with a demonstrable need-to-know (see Clause 7.3).  
  3.3. The creation of factual records is not an end in itself and should be avoided when the same operational objectives can be achieved through non-recorded means.  

  **4. Retention and Disposal of Factual Material**  
  4.1. All factual material shall be categorized upon creation or receipt according to its potential operational impact.  
  4.2. Material not categorized as requiring retention (per Annex A) shall be disposed of within five (5) working days.  
  4.3. Disposal must be irreversible and complete. Methods must ensure no possibility of reconstruction.  

  **5. Procedures for Creating Factual Records**  
  5.1. Prior to the creation of any factual record, staff must complete Form BPCIM/09 ("Request for Creation of Factual Record") and obtain approval from the relevant Section Head.  
  5.2. The request must justify the operational necessity of the record and demonstrate that no alternative non-recorded method (e.g., oral briefing) is feasible.  
  5.3. Approval shall be granted only in exceptional circumstances.  

  **6. Oral Briefings and Non-Documented Deliberations**  
  6.1. For matters of sensitivity, staff are encouraged to utilize oral briefings and discussions in lieu of written records.  
  6.2. When an oral briefing occurs, no summary or record of the content shall be made unless specifically requested by the Office of the Director.  
  6.3. Participants in such briefings are responsible for remembering only that portion of the content directly relevant to their assigned tasks.  

  **7. Management of Public Assertion**  
  7.1. Public assertions must be developed through a consultative process involving all relevant stakeholders (see Clause 8.2).  
  7.2. The content of a public assertion shall be based solely on information currently available to the organization in retained records.  
  7.3. Staff involved in drafting public assertions shall not have access to material beyond their need-to-know clearance.  
  7.4. If no retained records exist on a subject, public assertions may be formulated on the basis of the best available current understanding, without reference to unretained material.  

  **8. Disciplinary Measures**  
  8.1. Staff are reminded that unauthorized assertion of information based on personal knowledge, recollection, or unretained material constitutes a breach of protocol.  
  8.2. Such breaches may result in disciplinary action, including reassignment or termination, as they undermine the integrity of the organization's information management system.  

  **9. Annex A: Categories for Retention of Factual Material**  
  Factual material shall be retained only if it falls into one or more of the following categories:  
  - Material required by statute or regulation for a specified retention period.  
  - Material that is necessary for the ongoing performance of a critical operational function and for which there is no practicable non-recorded alternative.  
  - Material that has been publicly cited by the organization in a public assertion and is therefore necessary for consistency in future public assertions.  

  **10. Annex B: Specimen Form and Worked Example**  
  *Form BPCIM/09: Request for Creation of Factual Record*  
  [To be completed in duplicate]  
  Section: ___________  
  Date: ___________  
  1. Describe the factual material to be recorded: ___________  
  2. Justify operational necessity: ___________  
  3. Explain why non-recorded methods are inadequate: ___________  
  4. Proposed retention period: ___________  
  5. Approving Officer: ___________ (Signature)  
  6. Section Head: ___________ (Signature)  

  *Worked Example:*  
  A staff member becomes aware of an event that may become the subject of public inquiry. The staff member considers creating a record. However, upon completing Form BPCIM/09, the Section Head denies the request because:  
  - The event is not yet publicly known and may never be.  
  - Operational continuity does not require a record at this stage.  
  - The matter can be managed through scheduled oral briefings.  
  Thus, no record is created. If the event later becomes the subject of public assertion, the organization will base its statement on the then-available information (which does not include a record of the original event).  

  **11. Review**  
  This guidance is subject to review within six months or as operational requirements dictate.  

