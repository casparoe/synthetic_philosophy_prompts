  I'm TAing an intro metaphysics module this term and keep having the same argument with one of the PhD students, so I'd rather get properly attacked on this than keep winning by stipulation. The view I hold — call it the paraphrase view, I need some label — is that there is no causation by absence, full stop. When we say the guard's not turning up caused the vault to be emptied, or that the missing signature caused the application to be rejected, nothing negative is doing causal work: there's the actual positive history (the guard asleep down the road, the clerk processing the file), some counterfactuals about what would have happened had things gone differently, and a background of norms, plans and expectations that explains why we single out her absence rather than the Queen of England's. On my view causal claims about omissions are in perfectly good order as compressed explanations, they're just not reports of a causal relation with an absence in it. My supervisor says I've defintely just built the conclusion into what I'll count as a cause — causes have to be actual happenings, locatable in time, the sort of thing that can enter into production-like relations, and absences are none of those — and I want to know how much of the view is that definition wearing a coat.

  So: what would count against me, ranked from I'd have to give it up through this hurts to this is merely awkward, and for each one say whether a committed paraphrase theorist should concede it or is entitled to shrug. The things I want you to actually work through, with cases rather than name-dropping, are these. (1) Double prevention: someone tries to poison the coffee, a colleague quietly swaps the cups, the victim survives, and the absence of poison upstream seems to be what lets the whole normal causal story run — people treat this as the case where absences inherit causal power, and I've never felt its force, so either show me what I'm missing or agree with me and say why it's not the master case it's made out to be. (2) Symmetric overdetermination by two omissions: either of two guards would have locked the door and would have been enough, neither does, the burglar walks in; my counterfactual machinery breaks here, and I need to know whether my fallback (no cause of the break-in at all, or the two together) is a cost or a feature I can charge for. (3) The timing worry: an omission doesn't seem to have a sharp location or duration in the way causes are supposed to, and the late omission case — the doctor fails to give the antidote at midnight, but the patient was already dead at 11:55 — shows the shape of the problem; is the vagueness a reason to deny absences causal status or just a reason to be careful about event individuation? (4) The case that worries me most, which I made up and haven't seen discussed: the disarmed sprinkler. A fire spreads through a wing of a building because the sprinkler's trigger was never rewired after maintenance months earlier. There's no agent who failed to act at the relevant moment, nobody had a duty, there's no queue of expectations for my story to lean on — and yet the absence of a signal caused the fire to spread sounds completely fine to nearly everyone I try it on. (5) Model-relativity: whether a causal model even contains a variable for the guard locks the door is a modeller's choice, and if it does then the absence comes out as a cause on the usual actual-cause tests, and if it doesn't it can't even be a candidate. Positive causes don't look like they're at the mercy of variable inclusion in the same way — or do they? If they do, I'm not specially exposed and you should say so; if they don't, I owe you something. (6) My own rescue device, which I half suspect is junk: I distinguish thin absences (mere non-occurrences, like the Queen not watering the plant) from thick ones (the non-execution of a standing arrangement — a mechanism that was meant to fire, a plan, a role, a duty), and I use the distinction to explain why some absence-claims are good explanations and others are noise. Is that doing real work, or is it a moves-in-the-night device that lets me dismiss any counterexample as thin? If it's the latter, say so, and tell me what test would expose it.

  On epistemics: I want you to seperate what people who work on this genuinely agree on from what's just fashionable, and not hand me a consensus where there's only a majority. Flag every place where my view is insulated by a definition rather than an argument, and be willing to conclude that the whole thing has been qualified into unfalsifiability — and then say whether, for a view of this kind, that's a real problem or just what metaphysics looks like when it's done honestly. Tell me which single defeater you think is most likely to be right and roughly how confident you are in that ranking. And for what it's worth, the thing that would move me most is a case where the absence does explanatory work that no reconstruction out of positive history plus counterfactuals plus norms can replicate; shared intuitions alone won't do much for me, so if that argument is available, make it, and if it isn't, say that too.
reasoning: |-
  Okay, I'm diving into this user's problem. They're a TA in an intro metaphysics module, stuck in a recurring argument with a PhD student about causation by absence. Their position is that causation by absence isn't real—it's just a shorthand explanation involving positive events, counterfactuals, and norms. But they’re worried their view might be circular, built into their definition of what counts as a cause. They want me to test their view rigorously, especially on six specific cases. 

  First, I need to unpack their "paraphrase view." They’re saying absences aren’t causes; they’re just useful in explanations because of context. Their supervisor called them out for building the conclusion into the definition—causes must be actual happenings, locatable in time, with productive relations. That’s a big red flag. If their view starts with "causes are only positive events," then of course absences don’t qualify. But is that fair, or is it a legitimate metaphysical stance? 

  Now, looking at their six cases: double prevention, symmetric omissions, timing, disarmed sprinkler, model-relativity, and their thick/thin distinction. I should tackle each systematically. For double prevention, they don’t see why the absence (of poison) is causal. I need to think if there’s a gap in their counterfactual-plus-norms approach. Maybe the norms part is doing heavy lifting? But in the sprinkler case, there are no norms or agents, yet "absence caused the fire" feels intuitive. That’s a problem for them. 

  The symmetric omissions case is tricky because counterfactuals break—neither guard’s absence alone is necessary since the other would’ve sufficed. Their fallback is to say there’s no cause or it’s collective, but is that a cost? Some philosophers think causal overdetermination is possible, so maybe it’s not a dealbreaker. 

  Timing worries me—how can an absence have a duration? If the patient dies before the antidote isn’t given, the omission isn’t causal. But their view handles this by saying absences aren’t real causes anyway, so vagueness isn’t an issue. 

  Model-relativity is interesting. In causal models, whether an absence is a cause depends on variable choice. Positive causes might also depend on this—like choosing to include "spark" or "oxygen" in a fire model. So maybe the user isn’t uniquely vulnerable here. 

  Their thick/thin distinction feels slippery. Thick absences (like a guard failing a duty) are explainable via norms; thin ones (Queen not watering plants) aren’t. But in the sprinkler case, there’s no duty—is that thick or thin? If they call it thick because of a "standing arrangement," that might be ad hoc. A test for this could be: can we find a case with no norms, no arrangements, yet the absence still feels causal? 

  The user’s deeper need seems to be rigor. They want their view stress-tested, not just intuition-bashed. They’d be moved by an explanation gap—where no positive story replicates the explanatory work of an absence. I need to think if such a case exists. Maybe in prevention cases, like the sprinkler, where the absence is the only thing that fits the causal narrative without adding extra variables. 

  I recall Phil Dowe’s conserved quantity theory: causes involve physical transfers. Absences don’t, so they’re not causes. That’s compatible with the user’s view. But then there’s Schaffer’s trumping case—where an absence seems to override other factors. That might challenge counterfactuals. 

  For the disarmed sprinkler, even without norms, the absence explains why the fire spread. The user’s reconstruction might say: the positive events are the wiring not being fixed months ago, plus the fire starting. But that feels disconnected from the specific moment. The absence of the signal at the time of the fire does direct explanatory work. If no positive event at t1 (when the fire spreads) is sufficient without counterfactuals about t0 (when wiring was missed), that’s a gap. 

  The model-relativity point might save them. If including "signal sent" as a variable makes the absence causal, but excluding it doesn’t, that shows context-dependence. Positive causes are also relative to models—like omitting "oxygen presence" in a match-lighting model. So the user isn’t worse off. 

  But the symmetric case hurts them. If two omissions overdetermine, and counterfactuals say neither is necessary, but we still want to say each caused the outcome, that’s a problem. Their fallback—no cause or joint cause—might be acceptable if they argue causation isn’t always distributive. 

  Overall, the sprinkler case is the strongest against them because it strips away norms. If they stretch "thick absence" to include system designs, it might work, but it risks being ad hoc. The biggest defeater is explanatory gap cases where absences provide unique, irreducible explanations. 

  I should be honest: their view is insulated by definition, but that’s normal in metaphysics. The cost is needing to handle intuitions with extra machinery. Their confidence should be moderate—absences aren’t causes, but the debate isn’t settled. The disarmed sprinkler might be the best test case for them to refine their view.
answer: |-
  Here's a systematic stress test of your paraphrase view, ranked by severity and analyzed for each case. I'll flag definitional insulation, consensus vs. debate, and explanatory gaps. The core tension: your view is **metaphysically defensible but incurs significant explanatory costs** that might motivate adopting causal models admitting absences.

  ### Defeaters Ranked by Severity
  **(Most Damaging → Least Damaging)**

  1.  **The Disarmed Sprinkler (Your Case)**  
      **Scenario:** Fire spreads because the sprinkler trigger wasn't rewired months ago. No agent, duty, or salient expectation at the time of the fire. Intuition: "The absence of a signal caused the fire to spread" is natural.
      *   **Why it hurts (Potentially Fatal):** This strips away your primary *explanatory* resources (norms, plans, agents). The "thick absence" move feels strained. What "standing arrangement" exists months later? The building's safety *design*? That's metaphysically thin and temporally disconnected. Your paraphrase must rely on:
          *   Positive History: The wiring omission months ago + the fire starting.
          *   Counterfactual: Had a signal been sent (triggering sprinklers), the fire wouldn't have spread.
          *   Norms? Only a very abstract "systems ought to function" norm.
      *   **The Gap:** The positive history is causally distant. The *explanatory salience* lies precisely in the *absence of the signal at the critical moment* preventing the sprinkler's activation. Your reconstruction struggles to capture this immediacy without smuggling in the absence *as causally relevant*. Denying this intuition feels like special pleading.
      *   **Your Move:** You *must* insist the cause is the *past positive event* (the flawed rewiring job) plus the fire starting. The counterfactual and weak system-norm explain why we *focus* on the signal absence *as the crucial link*. The absence itself isn't causal. **Cost:** This feels deeply revisionist regarding the natural explanation. If you stretch "thick absence" to cover system functionality, it risks becoming vacuous.
      *   **Definitional Insulation?** Yes. You define causes as positive events, so the absence *can't* be a cause. The question is whether the cost to explanation is too high.

  2.  **Symmetric Overdetermination by Omissions**  
      **Scenario:** Two guards, either could/should have locked the door. Neither does. Burglar enters.
      *   **Why it hurts (Serious Pain):** Your counterfactual machinery breaks. Counterfactual dependence fails for each omission:
          *   ~Guard1 locks → Burglar enters? **No.** (Guard2 *would* have locked it? No, Guard2 *also* omitted. Had Guard1 locked, Guard2 *still* wouldn't have? Irrelevant. The crucial point: Had *only* Guard1 locked, entry *would not* have occurred? **Yes!** But had Guard1 *not* omitted (i.e., locked), Guard2 *might still have omitted*. However, the entry *doesn't* depend counterfactually on *Guard1's omission*: If Guard1 had locked (so didn't omit), entry *still* would have occurred? **No!** If Guard1 locks, entry is prevented, *regardless* of Guard2. The standard problem arises: The entry *does* depend on Guard1's omission: If Guard1 *had* locked (i.e., *not* omitted), entry would *not* have occurred. Similarly for Guard2. *Both* omissions seem necessary!? This is the heart of the confusion.
          *   **The Real Problem:** The standard counterfactual test (but-for test) *succeeds* for each omission individually in symmetric overdetermination cases! This is widely recognized as a problem *for* the simple counterfactual analysis, *not* for omissions per se.
          *   **Why it's awkward for YOU:** Your *fallback* ("no cause or joint cause") is unintuitive. We strongly feel *each* guard's failure *caused* (or was causally relevant to) the entry. Denying causation entirely seems absurd; calling it "joint causation by absences" violates your core tenet. Your norms/resources might explain why we *blame* both, but not why the causal *explanation* seems symmetric.
      *   **Your Move:** Concede no *single* omission is *the* cause due to overdetermination. Insist the cause is the *complex positive event* "both guards being absent/negligent at t" or the positive event "burglar encountering unlocked door". The norms explain why we cite *their* omissions. **Cost:** Denying each omission has *any* causal role clashes with strong intuition and causal modeling outputs. This is a major cost.
      *   **Definitional Insulation?** Partly. You *could* adopt a more nuanced counterfactual account (e.g., contrastive, INUS conditions) or accept overdetermination by absences. Your refusal is definitional.

  3.  **Model-Relativity**  
      **Scenario:** Whether "Guard locks door" is a variable in the model determines if its absence can be a cause candidate.
      *   **Why it's Merely Awkward:** Positive causes *are* vulnerable to variable inclusion! Consider a forest fire. Model 1: Variables [Lightning strike, Dry Tinder]. Lightning = cause. Model 2: Variables [Lightning strike, Oxygen present, Dry Tinder]. Oxygen presence = cause too (a background condition). Model 3: [Lightning strike, Absence of Firefighters]. Absence = cause. What counts as "the cause" depends on the modeler's choice of variables and what's held fixed.
      *   **The Symmetry:** Both positive events and absences are "at the mercy" of variable inclusion. Including "Signal sent" makes its absence a candidate cause in the sprinkler case. Including "Firefighter intervention" makes its absence a candidate. Omitting them hides these factors.
      *   **Your Move:** Shrug! This *helps* you. It shows causal attribution (even for positives) is context-dependent. Your paraphrase view *explains* this context-dependence via norms/salience explaining *which* variables we include (e.g., we include "guard locks door" because of duty, not "Queen waters plant"). The underlying *metaphysics* (only positives are causal relata) remains intact. The *explanation* of the *claim* is pragmatic/model-relative; the *relation* reported is still between positives.
      *   **Cost:** Minimal. This is a feature, not a bug, for your view. It highlights the pragmatic element you embrace.

  4.  **Double Prevention**  
      **Scenario:** Poisoner poisons Cup A. Swapper swaps to Cup B (unpoisoned). Victim drinks B, survives. "The absence of poison in Cup B caused survival."
      *   **Why it's Weak Against You (Shrug):** Your paraphrase works cleanly here:
          *   Positive History: Swapper's swapping action.
          *   Counterfactual: Had swapping not occurred (so poison in B), victim dies.
          *   Norms/Salience: Focuses on the poison absence because of the threat.
      *   **The "Inheritance" Intuition:** Proponents see the swap as preventing the poison's effect, making the poison's absence causally active. You see the swap as the positive cause *producing* the safe state. The absence is the *result* of the positive cause (swap), not a cause itself. Nothing compels the "inheritance" view.
      *   **Your Move:** Shrug. This is a paradigmatic case *for* your view. The positive action (swapping) is the cause. The absence is the crucial *state* it brought about. Counterfactuals and norms explain the focus. No gap.
      *   **Consensus?** No consensus against you here. Many share your view on double prevention. It's not the master case proponents claim.

  5.  **Timing Worry**  
      **Scenario:** Doctor fails to give antidote at midnight. Patient died at 11:55. Did the omission cause the death?
      *   **Why it's Not a Problem (Shrug):** This is an issue *for everyone*. Proponents of absences-as-causes also need to locate them temporally. Is the omission at midnight, or earlier when the decision was made? The problem stems from event individuation.
      *   **Your Move:** Shrug decisively. Your view *predicts* this vagueness. Absences aren't real events, so they *don't* have precise locations/durations. The *claim* "failure at midnight caused death" is false because the death was already determined. The relevant positive cause is whatever killed the patient by 11:55. The "omission" talk is either mistaken or refers to the earlier positive events leading to the unavailability of the antidote/prevention. This case highlights *why* absences are poor causal relata.
      *   **Cost:** None. This is a point in your favor.

  ### Your Thick/Thin Distinction
  *   **Status:** It's **doing real work, but risks being ad hoc.**
  *   **The Work:** It effectively captures the *explanatory salience* of some absences over others (guard vs. Queen). It links directly to your reliance on norms, plans, and expectations ("thickness").
  *   **The Risk:** It can feel unprincipled. What counts as a "standing arrangement" or "meant to fire"? The sprinkler case exposes this. Is a safety system months after maintenance a "standing arrangement"? If yes, it covers the case but feels stretched. If no, the case hurts you.
  *   **Test for Exposure:** Find a case with a *thin* absence (no norms, plans, arrangements, expectations) where the absence claim feels *explanatorily indispensable* and *not reconstructible* via positive history + counterfactuals. Your **Disarmed Sprinkler** *aims* at this. If you can bite the bullet and deny the intuition ("People are wrong; it was the past rewiring error plus the fire"), or stretch "thick" plausibly (e.g., "Systems have inherent functions"), you survive. If a clear-cut thin-absence case with strong explanatory intuition emerges, your distinction collapses.

  ### Epistemic Assessment
  *   **Consensus vs. Debate:** There is **NO consensus**. This is a live, fierce debate. Proponents of absences-as-causes (Schaffer, Beebee, Mellor) battle skeptics (Dowe, Armstrong, your view). Causal model theorists (Halpern, Pearl) show absences *can* be model-causes but are often agnostic on metaphysics.
  *   **Definitional Insulation:** **Yes, your core claim is definitionally insulated.** You define causation as a relation between positive events. Absences *cannot* be causes by definition. This is common in metaphysics (e.g., Davidsonian event theory). The question is whether the *costs* (explanatory gaps, unintuitive denials) are worth paying for a more austere ontology.
  *   **Unfalsifiability?** Not *entirely*, but highly resistant. Your view can paraphrase *any* causal claim about absence. **Falsification would require:** An explanation relying on an absence that is (a) genuinely indispensable (no positive + counterfactual + norm reconstruction works), *and* (b) the absence cannot be plausibly categorized as "thick" by any stretch. The **Disarmed Sprinkler** is the closest candidate. If you *must* admit "the absence of the signal at t" as a cause to explain *why the fire spread at t* (despite a distant past cause and no norms at t), that falsifies you.
  *   **Most Likely Defeater:** **The Disarmed Sprinkler (or similar thin-absence case).** (~50% confidence it's fatal, >75% it causes significant pain). It most directly targets the *explanatory gap* you care about, stripping away your main resources. If competent speakers insist the absence *itself* is doing unique explanatory work at the critical moment, and your positive history feels disconnected, your view struggles. Symmetric omissions is a close second due to the counterfactual/overdetermination clash.
  *   **The Explanatory Gap Argument (For the Sprinkler):**
      *   **Claim:** "The absence of the sprinkler signal at time t caused the fire to spread through the wing starting at t."
      *   **Your Paraphrase:** "The flawed rewiring job at t-minus-months (positive) + the fire reaching the wing at t (positive) caused the spread. Had a signal been sent at t (counterfactual), the spread wouldn't have occurred. We focus on the signal absence because of the system's design (weak norm)."
      *   **The Gap:** The paraphrase fails to capture the *immediate preventer* at t. The past flaw *enabled* the absence, but the absence *itself* is what *allowed* the fire to spread *at that moment*. The positive events cited are either too early (rewiring) or not preventative (fire starting). The counterfactual points to the absence. The norm is weak. The intuition is that the *absence at t* is the *proximate cause* blocking the prevention mechanism *right then*. Denying this feels like ignoring the mechanism's failure point. **This is the irreducible explanatory work:** pinpointing the *specific missing link* at the critical time within the active causal chain.

  ### Conclusion
  Your view is **metaphysically coherent and defensible**, firmly in the tradition of production/comserved quantity theories (Dowe, Salmon). However, it **incurs significant costs**:
  1.  **Revisionism:** Denying strong intuitions (especially symmetric omissions, sprinkler).
  2.  **Explanatory Gaps:** Struggling to capture proximate causation in prevention failures (sprinkler).
  3.  **Ad Hoc Maneuvers:** Relying heavily on norms/salience and the thick/thin distinction.

  **Should you give it up?** Not necessarily. Many find the ontological parsimony worth the cost. **But:** The **Disarmed Sprinkler** and **Symmetric Omissions** cases are serious threats. If these intuitions hold firm under scrutiny and your responses feel increasingly strained, adopting a causal model framework (where absences *are* model-causes, acknowledging the pragmatics) might be more explanatory, even if less ontologically pure. Your core insight about the role of norms and salience remains vital regardless.

  **Most Urgent Task:** Refine your response to the **Disarmed Sprinkler**. Can you make "thick absence" work without vacuity? Can you provide a satisfying positive-history description that captures the proximate explanation? If not, this is the crack that might widen.
