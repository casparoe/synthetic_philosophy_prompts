  Below is a decision tree structured as a handout for your seminar. It begins with the agreed-upon commitment that human experience depends on the brain's physical processes. Each node is a concrete case-based question with 2–3 answers, avoiding prohibited terms. The tree has 12 nodes (4 internal, 8 leaves) and uses 8 cases (including four additions). Positions are defined by their answers, not labels. Empty combinations are noted, and the most pivotal node is identified at the end.  

  ---

  ### **Decision Tree: How Do Macroscopic Subjects Arise from Microscopic Ones?**  
  **Starting commitment:** There is something it is like to be an ordinary awake adult human, and this depends on physical processes in the brain.  

  #### **Node 1: Derivation Case**  
  *Case: Someone is handed every microphysical truth, every truth about the experiential character of fundamental constituents (if applicable), and every a priori truth. Can they deduce which macroscopic experiences exist?*  
  - **A. Yes, without further information.** → Node 2  
  - **B. No, because of an explanatory gap requiring new laws.** → Node 3  
  - **C. No, because the human experience does not exist.** → Leaf 7  

  #### **Node 2: Grain Case**  
  *Case: The same brain is described at molecular, cellular, neural-assembly, and whole-organism levels. Is there a subject at every level, one level, or is the question ill-posed?*  
  - **A. At exactly one level (specify: whole organism).** → Leaf 1  
  - **B. The question is ill-posed; subjects aren't tied to levels.** → Leaf 2  
  - **C. At every level.** → *Empty (incoherent: subjects at nested levels conflict with unity of experience)*  

  #### **Node 3: Spoils Case**  
  *Case: When brain constituents give rise to a human subject, is that subject one of them, something they make up, or something additional?*  
  - **A. Something additional to all constituents.** → Node 4  
  - **B. Something the constituents make up (not identical to them or any one).** → Leaf 3  

  #### **Node 4: Palette Case**  
  *Case: Constituents have extremely simple experiential characters (e.g., "minimal awareness"). Does the resulting human experience inherit structural features (e.g., spatial arrangement, color similarities) from these micro-characters?*  
  - **A. No; structure requires new laws or properties.** → Leaf 4  
  - **B. Yes; structure is implicit in micro-characters.** → *Empty (unattractive: conflicts with simplicity of micro-experience, e.g., a color similarity cannot be "in" a minimal awareness)*  

  ---

  ### **Leaves**  
  Each leaf corresponds to a position defined by its path. The "awkward commitment" is its hardest-to-defend implication.  

  1. **Leaf 1** (Path: 1A → 2A)  
     - *Awkward commitment:* A subject exists only at the whole-organism level, but this cannot be deduced from micro-properties alone without unexplained constraints (threatens explanatory completeness).  
  2. **Leaf 2** (Path: 1A → 2B)  
     - *Awkward commitment:* Subjects are not tied to compositional levels, making it unclear how to count subjects in cases like division or overlap.  
  3. **Leaf 3** (Path: 1B → 3B)  
     - *Awkward commitment:* Macro-experience is constituted by non-experiential (e.g., protophenomenal) properties, which are by definition indescribable.  
  4. **Leaf 4** (Path: 1B → 3A → 4A)  
     - *Awkward commitment:* Macro-experience emerges from micro-experiences via a fundamental "bonding" relation, which is itself irreducible and unexplained.  
  5. **Leaf 5** (Path: 1B → 3A → 4B) → *Empty* (See Node 4)  
  6. **Leaf 6** (Added case: *Addition 1*)  
     *Case: If two brains share 90% of their constituents, can both have distinct experiences?*  
     - (Path: Via Node 3A → 4A → Answer: Yes)  
     - *Awkward commitment:* Macro-experience is fundamental and emergent, but its dependence on specific configurations is brute (seemingly arbitrary).  
  7. **Leaf 7** (Path: 1C)  
     - *Awkward commitment:* Human experience is an illusion, so the starting commitment must be reinterpreted as a cognitive error.  
  8. **Leaf 8** (Added case: *Addition 2*)  
     *Case: If the universe had no subsystems (e.g., no brains), would experience still exist?*  
     - (Path: Via Node 3A → 4A → Answer: Yes)  
     - *Awkward commitment:* The whole universe is the primary subject, raising the "decomposition problem" (how it grounds individual minds).  

  ---

  ### **Empty Combinations and Unseparated Leaves**  
  - **Empty paths:**  
    - Node 2C (subjects at every level): Incoherent (multiple subjects conflict with unified experience).  
    - Node 4B (structure inherited from micro-characters): Unattractive (simplicity of micro-experience cannot account for macro-structure).  
    - Node 3A → 4B: Unexplored (no position claims both that structure is inherited and that subjects are additional).  
  - **Unseparated leaves:**  
    - **Leaf 1 vs. Leaf 2:** The tree cannot distinguish non-reductive functionalism (Leaf 1) from dual-aspect monism (Leaf 2) using these cases. Both answer identically to Derivation and Grain.  
    - **Leaf 4 vs. Leaf 6:** The tree cannot distinguish emergentist panpsychism (Leaf 4) from brute emergentism (Leaf 6) without begging the question on micro-experience.  

  ---

  ### **Pivotal Node and Tree Robustness**  
  - **Node 1 (Derivation)** carries the most weight. It splits the logical space into:  
    - **Deducible views** (constitutive positions, e.g., Leaf 1, Leaf 2, Leaf 3).  
    - **Non-deducible views** (emergent/irreducible positions, e.g., Leaf 4, Leaf 6, Leaf 8).  
    - **Eliminative views** (Leaf 7).  
  - **Without Node 1**, the tree collapses into a debate about structure (e.g., Grain or Palette), which fails to isolate emergence vs. constitution and conflates positions like panprotopsychism (Leaf 3) with neutral monism (Leaf 2).  

  This tree emphasizes concrete cases, forcing students to engage with implications rather than labels. Use it to spark debate by walking through cases like a frozen brain (static case) or split-brain scenarios (division case).
