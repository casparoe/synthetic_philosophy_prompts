answer: |-
  Here is a procedural framework grounded in the specified aesthetic principles, designed for operational efficiency and defensibility. Philosophical foundations are integrated into the steps, with compromises and contestable choices explicitly noted. The procedure is structured for a 20-minute review per object, producing a one-page record.

  ---

  ### **PROCEDURE: ASSESSING AUTHORSHIP & STATUS**
  **Philosophical Anchor:** An object’s value as "evidence of the human past" resides in its *actual history of creation and reception*, not market attribution or perceptual qualities. A perfect forgery lacks the historical connection to its purported context, diminishing its evidentiary value regardless of appearance. For non-autographic works (e.g., prints, cast sculpture), the work’s identity is tied to the artist’s sanctioned process, not physical execution.

  #### **I. TIER VOCABULARY & AUTHORITY**  
  | Tier                | Authority to Assign          | Meaning (Philosophical Basis)                                                                 |
  |---------------------|------------------------------|-----------------------------------------------------------------------------------------------|
  | **By [Artist]**     | Director + Curator Consensus | Direct, documented creation by the artist’s hand or under immediate supervision (History of production is secure; object is primary evidence of the artist’s act). |
  | **Attributed to**   | Curators (Majority)          | Evidence strongly suggests the artist’s involvement, but gaps exist (Acknowledges epistemic limits; prioritizes object’s historical trace over certainty). |
  | **Studio/Workshop of** | Curators (Majority)       | Work from the artist’s circle, likely with indirect involvement (Values context over individual genius). |
  | **After [Artist]**  | Curators (Solo)              | Period copy or later homage (Authentic as evidence of reception/influence, not creation). |
  | **Imitation**       | Curators (Solo)              | Deliberate stylistic copy, not deceptive (Ethically transparent; "fake" collection candidate). |
  | **Forgery by [Maker]** | Director + Counsel        | Proven intent to deceive (Valuable as evidence of deception’s history; requires legal review). |
  | **Of Uncertain Origin** | Committee Vote           | Inconclusive evidence (Defaults to transparency; avoids false narratives). |

  #### **II. DECISION TREE (20-MINUTE FLOW)**  
  1. **Does the object have unresolved legal/export risks?**  
     → *Yes:* Refer to counsel. **Terminate.**  
     → *No:* Proceed.  

  2. **Is the object a non-autographic work?**  
     → *Yes (e.g., print, cast sculpture, digital):* Use **Branch A**.  
     → *No (e.g., painting, hand-shaped ceramic):* Proceed to 3.  

  3. **Is there credible evidence of deceptive intent?**  
     → *Yes:* Assign **Forgery by [Maker]**. Requires legal sign-off. Proceed to disposition.  
     → *No:* Proceed to 4.  

  4. **Can we confirm direct creation by the artist?**  
     → *Yes:* Assign **By [Artist]**. **Terminate.**  
     → *No:* Proceed to 5.  

  5. **Is there material/technical inconsistency with claimed origin?**  
     → *Yes:* Downgrade to **After**, **Imitation**, or **Uncertain**. Proceed to 6.  
     → *No:* Proceed to 7.  

  6. **Can we identify the true context (period, maker, intent)?**  
     → *Yes:* Assign appropriate tier (**After**, **Imitation**, **Studio of**). **Terminate.**  
     → *No:* Assign **Of Uncertain Origin**. **Terminate.**  

  7. **Does stylistic/historical evidence strongly suggest the artist?**  
     → *Yes:* Assign **Attributed to**. **Terminate.**  
     → *No:* Assign **Studio/Workshop of** or **Uncertain**. **Terminate.**  

  **Disposition Rules:**  
  - **Forgery**, **Imitation**: Eligible for "fake" collection if donor-endorsed.  
  - **After**, **Studio of**, **Attributed to**: Retain with revised label.  
  - **Uncertain Origin**: Deaccession after 5 years unless research potential is high (Board vote).  
  - **Legal risk**: Return/decline.  

  **Branch A (Non-Autographic Works):**  
     A1. **Did the artist sanction this instance?**  
     → *Yes* (e.g., approved proof, authorized edition): **By [Artist]**.  
     → *No* (e.g., posthumous cast/print, unauthorized copy): **After [Artist]** or **Imitation**.  
     → *Unclear:* **Of Uncertain Origin**.  

  **Defaults for Unavailable Evidence:**  
  - No technical analysis under $8K? Default to stylistic assessment.  
  - Inconclusive data? Assign **Attributed to** or **Uncertain** based on provenance weight.  
  - Review defaults every 10 years or upon new evidence.  

  **Handoff to Board/Values Decisions:**  
  - Deaccessioning non-illegal but misattributed high-value items.  
  - Accepting objects for the "fake" collection.  
  - Resolving conflicts between aesthetic value and evidentiary weakness.  

  ---

  ### **CONTESTABLE DESIGN CHOICES & COMPROMISES**  
  1. **Dropped Distinction: "School of" vs. "Follower of"**  
     → *Why:* Lay trustees can’t reliably differentiate. Simplified to **"Studio/Workshop of"**.  
     → *Contestable:* Erases nuances of influence. Defended for efficiency.  

  2. **"Attributed to" as Default for Inconclusive Evidence**  
     → *Why:* Avoids excessive **Uncertain** labels (pragmatic).  
     → *Contestable:* May inflate perceived authorship. Defended as honest uncertainty.  

  3. **Non-Autographic Works: Sanction = Authorship**  
     → *Philosophical Choice:* Rejects Goodman; follows Danto’s "artworld" theory.  
     → *Contestable:* Privileges institutional authority over physical history. Defended for procedural clarity.  

  4. **"Forgery" Requires Proven Intent**  
     → *Contestable:* May exclude skillful undetected forgeries. Defended to avoid speculative labels.  

  **Systematic Biases:**  
  - Unfair to objects with lost provenance or non-Western traditions (relies on Eurocentric documentation).  
  - Tier system *does* launder doubt into value (e.g., **"Attributed to"** implies prestige).  
  - Cannot settle ethical debates (e.g., displaying colonial loot absent legal risks).  

  ---

  ### **CASE APPLICATIONS**  
  **Case A: Small Oil Landscape**  
  - **Process:** No legal risk (Step 1). Autographic (Step 2). No deceptive intent (Step 3). Direct creation unconfirmed (Step 4: craquelure inconsistency noted). Material consistent but signature suspect (Step 5 → Inconsistent). True context unknown (Step 6 → **Uncertain Origin**).  
  - **Disposition:** Deaccession after 5-year research window.  
  - **Committee Discomfort:** High. Downgrades a "collection staple."  
  - **Why:** Philosophy prioritizes secure history over tradition. Inconsistency + weak provenance = insufficient evidence.  

  **Case B: Bronze Statuette**  
  - **Process:** No legal risk (Step 1). Non-autographic → **Branch A**. Artist sanction? No (posthumous reproduction) → **After [Roman Type]** (A1).  
  - **Disposition:** Reclassify and retain. Label: "19th-century reproduction of a Roman original."  
  - **Committee Discomfort:** Moderate. Loses "Roman" status.  
  - **Why:** Actual history (1887 catalogue) overrides prior misattribution.  

  **Case C: Painting by Living Artist**  
  - **Process:** Deceptive intent confirmed (Step 3 → **Forgery by [Named Artist]**). Legal sign-off (fraud conviction).  
  - **Disposition:** Accept into "fake" collection. Label: "Forgery by [Name], 2016. Intended to deceive as a 1948 [Master]."  
  - **Why:** Explicitly evidences "deception’s history," aligning with new policy.  

  **Case D: Posthumous Etchings**  
  - **Branch A:** Non-autographic. Artist sanction? Unclear (Step A1). Signed maquette but posthumous printing → **Not By [Artist]**. Assign **After [Artist]** (homage) or **Imitation**.  
  - **Disposition:** **After [Artist]** (if edition planned) or decline gift.  
  - **Philosophical Conflict:** Rejects estate’s view. Defended: Without artist’s approval, it lacks *her* historical action.  

  ---

  ### **BRIEF CASE D RUN (NON-AUTOGRAPHIC BRANCH)**  
  1. **Branch A Triggered:** Etchings = non-autographic.  
  2. **A1:** Artist died before printing; plates cancelled after. No sanction for *these* impressions. → **Not By [Artist]**.  
  3. **Tier:** **After [Artist]** (if respectful) or **Imitation** (if neutral).  
  4. **Disposition:** Accept only for "fake" collection if **Imitation**; else decline.  
  5. **Why:** The impressions lack the artist’s historical participation, per aesthetic theory.  

  ---

  This procedure rigorously applies the "history of production" principle while admitting its limits. It will frustrate trustees when downgrading cherished attributions (Cases A, B) but ensures defensibility. The greatest risk is undervaluing objects from oral or non-documented traditions—here, the **Uncertain Origin** tier must be applied generously.
