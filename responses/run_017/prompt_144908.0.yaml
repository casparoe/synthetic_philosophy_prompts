prompt: |-
  Hi — I'm a journalist; I write a column (and occasionally a podcast) on science and ideas, and right now I'm working on a piece about what economists actually mean when they say "utility". I keep getting the same answer thrown at me: that in the revealed-preference tradition utility is nothing over and above a way of representing someone's choices, so its only defined up to some transformation and doesn't name any inner feeling or magnitude. Fine. But when I push on it, everyone I talk to ends up helping themselves to more than that — they say the marginal utility of money falls, or that a policy costs one group less than it gains another, or that we should compensate losers in "utils". So I want to pressure-test my own grip on the issue the only way I know how: by writing the nastiest exam question on it I can, as if I were setting the final for an upper-level philosophy-of-economics seminar.

  So: write me that question, plus a model answer, plus a marking scheme.

  The setup: upper-level undergrad seminar in philosophy of economics / rational choice. In-class final, 90 minutes, one essay question, students capped at 1000 words, 25 marks total. Assume they've done the standard stuff — choice functions, budget sets, WARP/GARP, ordinal versus expected utility — so the question must not be answerable by reciting "utility is just a representation of preference, invariant up to monotone (or positive affine) transformation." Anyone who can produce that sentence and nothing else should not get more than a B. What I want to separate out is the student who has understood why that answer is both right and unsatisfying: who can say, on the one hand, why the revealed-preference program isn't just vacuous bookkeeping (it makes real, falsifiable demands on choice data — that's the bit people forget, and I want it in there), and, on the other, why meeting those demands still doesn't give "utility" whatever it is that welfare economics needs it to have.

  Two wrinkles I've been chewing on, which I want built into the question. I've made these up, so spell them out fully in the question text — I don't want it to depend on anyone having read anything in particular, and I don't want a student to be able to dodge them:

  1. The denomination problem. Suppose we get a real-valued, interpersonally measurable quantity — call it N — that we can read off a brain scan, and it turns out that everyone's choices are exactly as if they were maximizing their own N. We now seem to have cardinal, comparable "utility" for free. My question is whether that actually dissolves the problem or just relocates it: what would have to be true of N for it to be welfare rather than, say, arousal, or salience, or action-readiness, and where would that extra claim come from if not from choice behaviour?

  2. The as-if agent. Suppose an agent's choices over every budget set you test satisfy GARP, and are exactly as-if maximizing some function u — but the causal story is that they're just picking whatever option is nearest the top-left of the menu. Is u then doing any real work? What would have to be true of u, or what test would you run, to tell a genuine representation from curve-fitting? I have a feeling the answer has something to do with counterfactuals — new menus, goods that don't yet exist — but I can't quite get it straight, so make the question force the issue rather than letting it hover.

  Deliverables:

  - the exam question itself, written so it could go straight onto a paper. Tell me if I'm wrong, but I think it should be one question with maybe two short sub-parts, not a pick-one-of-four menu.
  - a model answer of about 800 words.
  - a marking scheme: five or six must-hit points, marks for each, totalling 25, and for each one a one-line note on how students typically get it wrong. I also want an explicit line on what separates an A from a B — the specific move that earns the A.

  One more thing, and it's the bit I care most about. I want the model answer to actually commit. Don't give me "there are several defensible positions here": take a verdict on whether revealed-preference utility can bear the weight that welfare economics puts on it, and defend it. And because I'm going to write about this in public, add a short note at the end telling me which claims in my framing above are bog-standard received doctrine and which are my own coinage or genuinely contested — I don't want to print one philosopher's hobbyhorse as though it were the consensus view. Also say straight out if you think either of my two wrinkles is confused, or just a re-run of something standard under a new name.

  Thanks — and sorry if any of its garbled, I'm typing this on my phone in an airport lounge with teh wifi about to die.
