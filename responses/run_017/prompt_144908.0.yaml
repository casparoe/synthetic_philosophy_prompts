answer: |-
  ### Exam Question: Philosophy of Economics Final  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 1000 words  
  **Total Marks:** 25  

  ---

  **QUESTION**  
  Revealed preference theory treats utility as a mere numerical representation of consistent choice behavior, invariant to monotonic (or affine) transformations. Yet economists routinely appeal to cardinal, interpersonally comparable "utility" for policy analysis (e.g., cost-benefit tradeoffs). Critically evaluate whether the **minimalist revealed-preference conception of utility** can support **welfare-economic applications**. Your answer must:  
  1. Explain why revealed preference theory makes *falsifiable empirical demands* (beyond "bookkeeping").  
  2. Address **both** of the following thought experiments:  
     - **(a) The Denomination Problem:** Suppose neuroscience identifies a measurable, interpersonally comparable brain state *N* that perfectly predicts choices (i.e., agents maximize *N*). Does *N* qualify as "welfare"? What *extra conditions* must *N* satisfy, and can they be derived from choice data alone?  
     - **(b) The As-If Agent:** An agent satisfies GARP by always choosing the top-left item on menus. A function *u* represents these choices. Is *u* explanatorily meaningful? Describe a *test* to distinguish genuine utility maximization from arbitrary rules.  
  3. Conclude: Can revealed-preference utility bear the weight of welfare economics? Justify your verdict.  

  ---

  ### Model Answer (≈800 words)  
  **Thesis:** While revealed preference theory (RPT) imposes testable structure on choices, it cannot ground welfare economics without importing unsupported normative assumptions.  

  **1. Falsifiable Core of RPT**  
  RPT is not vacuous: it requires choices to satisfy consistency axioms (e.g., WARP/GARP). These demand that choices remain coherent across varying budget sets. Violations (e.g., choosing *x* over *y* in one context but *y* over *x* in another) falsify the model, revealing irrationality or context-dependence. This empirical bite distinguishes RPT from tautological curve-fitting.  

  **2. Addressing the Thought Experiments**  
  **(a) The Denomination Problem:** Even if *N* perfectly predicts choices, it is not automatically "welfare." For *N* to *be* welfare, we must assert that *N* tracks *well-being* (e.g., happiness, flourishing), not merely choice-congruence. Choice data alone cannot justify this:  
  - *N* could reflect arousal, neural noise, or cultural conditioning (e.g., always choosing the "salient" option).  
  - The extra claim—"*N* is welfare"—requires *normative interpretation* external to behavior. For example, if *N* were serotonin levels, we still need ethical arguments to equate serotonin with welfare. RPT cannot provide this; it only ensures *N* is choice-representative.  

  **(b) The As-If Agent:** The function *u* is behaviorally adequate but explanatorily empty if choices are caused by a "top-left rule." To test whether *u* is genuinely explanatory:  
  - **Counterfactual menu test:** Introduce *novel goods* (e.g., a hypothetical "quantum apple") or *new menu layouts* (e.g., circular arrangements). If choices deviate from *u*’s predictions when the top-left rule is disrupted, *u* was merely correlative. True utility maximization should generalize across *untested* contexts, as it models stable preferences.  
  - RPT alone cannot distinguish causation from correlation; it needs supplemental causal evidence (e.g., neuroscience or stated preferences) to confirm *u* captures "reasons for choosing."  

  **3. Welfare Economics’ Demands vs. RPT’s Limits**  
  Welfare economics requires **cardinal, comparable utility** for:  
  - Marginal utility comparisons (e.g., "money has diminishing utility").  
  - Interpersonal tradeoffs (e.g., "Policy X hurts Group A less than it helps Group B").  
  RPT fails to provide this:  
  - It delivers only *ordinal* rankings, invariant to monotonic transformations. Cardinality requires additional assumptions (e.g., risk attitudes in expected utility theory), which lack pure choice-based justification.  
  - Comparability demands shared utility units, but RPT utilities are *agent-relative scales*. Saying "Group A loses 10 utils, Group B gains 20" implies a universal scale, which choice data cannot establish (e.g., scaling *u_A* and *u_B* arbitrarily preserves ordinality).  
  - **The core issue:** RPT ensures *internal consistency of choices*, not that utility corresponds to welfare. Welfare assertions require normative leaps (e.g., "satisfying preferences is good") or auxiliary theories (e.g., hedonism), which RPT neither supplies nor validates.  

  **Conclusion:** RPT utility cannot support welfare economics. It usefully models *choice rationality* but reduces "utility" to a mathematical shadow of behavior. For welfare claims, we must either abandon RPT’s strict behaviorism or admit unobserved normative premises.  

  ---

  ### Marking Scheme (25 Total Marks)  
  | **Criterion**                                                                 | **Marks** | **Common Mistakes**                                  |  
  |-------------------------------------------------------------------------------|-----------|-----------------------------------------------------|  
  | **1. Explains falsifiable demands of RPT** (e.g., WARP/GARP as testable constraints) | 4 | Vague claims like "RPT is scientific"; misses how violations refute rationality. |  
  | **2a. Denomination Problem:** Argues *N* ≠ welfare without extra-normative claims; identifies choice-data insufficiency | 5 | Assumes choice-congruence = welfare; ignores need for ethical interpretation. |  
  | **2b. As-If Agent:** Proposes counterfactual test (e.g., novel goods/menus); distinguishes causation from correlation | 5 | Only recites GARP satisfaction; no test for explanatory depth. |  
  | **3. Synthesis:** Clearly states RPT’s ordinal/comparability limits; links to welfare-econ needs (cardinality, comparability) | 6 | Claims RPT "fully captures utility"; undefended assertion that welfare requires more. |  
  | **Conclusion & Stance:** Defends a verdict (e.g., "RPT utility insufficient for welfare"); integrates thought experiments | 3 | Waffles; treats thought experiments as isolated puzzles. |  
  | **Clarity/Structure:** Logical flow, concision, technical precision | 2 | Overly verbose; misuses terms (e.g., "cardinal" vs "ordinal"). |  

  **A vs. B Differentiation:**  
  - **B-grade (≤18/25):** Recites RPT basics, identifies ordinality, but treats thought experiments superficially. Fails to **synthesize why welfare needs exceed RPT’s scope**.  
  - **A-grade (≥20/25):** Explicitly argues that *even with perfect choice prediction* (via *N* or *u*), welfare requires **non-behavioral normative premises**. The "extra move" is showing **why choice-equivalence ≠ welfare-equivalence** in both thought experiments.  

  ---

  ### Notes on Your Framing  
  **Bog-Standard Doctrine:**  
  - RPT’s ordinality, invariance to transformations, and testability via WARP/GARP are consensus.  
  - Welfare economics’ reliance on cardinal/comparable utility is widely acknowledged (e.g., Robbins 1938).  
  - The "as-if" critique parallels Friedman’s instrumentalism but your *top-left rule* is a fresh illustration.  

  **Your Original Contributions:**  
  - **Denomination Problem:** Novel framing of neuro-correlates exposing the "interpretation gap." Standard debates use hypotheticals (e.g., "pleasure meters"), but your focus on *what makes N welfare* sharpens the normative leap.  
  - **As-If Agent:** While causal critiques exist (e.g., Hausman), your *counterfactual menu test* operationalizes how to pressure-test "explanatory depth." Not confused—it clarifies why RPT needs supplementation.  

  **Contested Claims:**  
  - Whether RPT *fully* reduces utility to choice is debated (e.g., Gul & Pesendorfer vs. Sen). Your insistence that welfare economics "needs more" is defensible but not universal—some behaviorists reject welfare comparisons entirely.  
  - **Verdict:** Your core tension (RPT’s minimalism vs. welfare’s demands) is astute and pedagogically potent. The exam question forces students to confront precisely this gap.  

  **Final Note:** Your framing is **not garbled**—it’s a crisp distillation of a deep problem. The answer above commits to your implied conclusion: RPT utility is *necessary but insufficient* for welfare economics. Use this model’s thesis boldly.
