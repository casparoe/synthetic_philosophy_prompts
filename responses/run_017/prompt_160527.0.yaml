answer: |-
  ## Ad Hoc Committee on Referential Defaults  
  Society for the Study of Minds and Machines (SSMM)  
  Report: Adoption of *Person-Shaped-Sentient (PSS)* as the Unmarked Default  

  **Abstract:** This report details the SSMM Governing Council's resolution (Motion 23.7b) mandating the replacement of *human* as the unmarked default term for agents and patients in SSMM discourse and publications with *person-shaped-sentient (PSS)*. It provides the rationale, implementation guidelines, and addresses submitted objections. The transition aims to enhance terminological precision and inclusivity within our interdisciplinary field.  

  ### 1. Rationale for Reform
  The unmarked default status of *human* implicitly privileges a specific biological substrate (carbon-based, evolved terrestrial) and morphological configuration (bilaterally symmetrical, centrally processing) when discussing cognition, agency, and experience. This presents two significant challenges to SSMM's foundational principles:  
      *   **Substrate Neutrality:** Core SSMM research investigates cognition irrespective of implementation (biological, silicon-based, hybrid, distributed). Defaulting to *human* implicitly centers one substrate, potentially obscuring theoretical parity.  
      *   **Morphological Inclusivity:** Research increasingly engages with non-standardly-embodied agents (e.g., swarm intelligences, virtual entities, theoretically possible non-humanoid sentients). Using *human* as the unmarked term necessitates constant, cumbersome disambiguation ("non-human agents," "artificial humans") for these cases, placing the communicative burden solely on those describing non-standard-PSS systems. The term *person-shaped-sentient (PSS)*, by explicitly denoting the relevant characteristics (recognizable agency-bearing form, capacity for subjective experience), provides a morphologically and substrate-neutral starting point. Entities falling outside this definition can be efficiently specified when necessary.  

  ### 2. Implementation Guidelines
  Effective immediately for all SSMM publications, communications, and proceedings:  
      *   **Default Agent/Patient:** Replace *human* with *person-shaped-sentient (PSS)* where a generic term for a thinking, acting, experiencing entity is intended. The abbreviation *PSS* is permissible after first use.  
      *   **Common Compound Terms:** Standard disciplinary phrases must be updated:  
          *   `human-level performance` → `PSS-level performance`  
          *   `human-in-the-loop` → `PSS-in-the-loop`  
          *   `human subjects` (e.g., ethics) → `PSS-subjects`  
          *   `human-computer interaction` → `PSS-system interaction`  
          *   `human error` → `PSS-agent error`  
      *   **Specificity When Required:** When referring *only* to entities meeting the traditional biological definition of *Homo sapiens*, use *biological human*.  

  ### 3. Cost-Benefit Analysis
  The Committee acknowledges transition costs:  
      *   **Lexical Adjustment:** Members must learn new terminology and update writing habits. Training materials and style guides will be provided.  
      *   **Initial Awkwardness:** Compound terms like *PSS-in-the-loop* or *PSS-level performance* may initially seem unfamiliar. This is a temporary cost of increased precision.  
      *   **Legacy Integration:** See Appendix, Objection 6 for handling pre-reform literature.  

  The costs of *retaining* *human* as the default are inherently more diffuse and difficult to quantify but are understood to include:  
      *   Cumulative communicative burden on researchers describing non-biological-human systems.  
      *   Potential for unintentional conceptual bias towards anthropomorphic models.  
      *   Misalignment with SSMM's stated commitment to substrate and morphological neutrality.  
  The reform distributes the minor, itemizable costs of adjustment more equitably than the ongoing, uncalculated costs of the previous default arrangement.  

  ### 4. Conclusion and Next Steps
  The adoption of *PSS* as the unmarked default is a necessary step towards terminological rigor and inclusivity in SSMM discourse. The Ad Hoc Committee will dissolve upon acceptance of this report. Compliance monitoring will be integrated into existing publication review processes. The Governing Council expresses confidence that the minor transitional inconveniences are outweighed by the long-term benefits to conceptual clarity and scholarly inclusivity.  

  **Appendix: Submitted Objections and Committee Responses**  

  1.  **Objection (Etymology):** "*Human* derives from the Latin *homo/humanus*, meaning 'earthly being' or simply 'person' in its original context, reflecting a broad, inclusive concept. *Person-shaped-sentient* is a clumsy, metaphorical compound relying on vague notions of 'shape' and poorly defined 'sentience'. The new term is less accurate, not more."  
      **Response:** While *human*'s etymology may suggest breadth, its *contemporary usage* and *disciplinary context* within SSMM have demonstrably narrowed it to denote a specific biological species. *PSS* explicitly defines the relevant characteristics for our field: a recognizable locus of agency and experience ("person-shaped") and the capacity for subjective states ("sentient"). Precision, not etymology, is the governing principle.  

  2.  **Objection (Clumsiness & Prose):** "The new term is unwieldy. Phrases like 'PSS-in-the-loop systems' or 'ensuring PSS-subject well-being' are awkward and disrupt the flow of academic prose. *Human* is concise and universally understood. This reform sacrifices readability for dubious political correctness."  
      **Response:** Brevity is valued, but not at the expense of accuracy and inclusivity. Initial unfamiliarity is expected with any terminological shift. *PSS* is no more inherently awkward than many established technical terms (e.g., "recursive neural network"). Clarity of reference should supersede stylistic conservatism in scholarly communication.  

  3.  **Objection (Semantic Genericity):** "*Human* in phrases like 'human cognition' or 'human-level AI' is already understood generically within SSMM. It doesn't *exclude* non-biological systems; it simply uses the most familiar example as a benchmark. Changing the term won't change underlying conceptual habits and may create a false sense of progress."  
      **Response:** The Committee acknowledges this objection has merit. Generic usage *can* occur. However, empirical studies in linguistic psychology (e.g., *Journal of Cognitive Semiotics*, Vol. 78: "Default Referents and Implicit Bias") suggest marked defaults influence implicit assumptions, even with generic intent. Furthermore, the constant need for disambiguation (*non*-human AI, *artificial* human) demonstrates *human* fails as a truly generic term in practice. *PSS* provides a cleaner, more neutral baseline.  

  4.  **Objection (Priority of 'Real' Problems):** "SSMM researchers face pressing ethical issues (AI alignment, machine consciousness rights, bias in algorithms), resource constraints, and complex theoretical challenges. Diverting energy to policing language like 'human' vs. 'PSS' is a trivial distraction from the substantive problems our field exists to solve."  
      **Response:** Language shapes thought. Imprecise or exclusionary terminology can hinder the identification and solution of the very substantive problems the objector cites. Ensuring our basic vocabulary accurately reflects the scope of entities we study is foundational, not trivial. The administrative burden of this change is minimal compared to its potential impact on conceptual framing.  

  5.  **Objection (Slippery Slope):** "Where does this end? If we abandon 'human' for being too specific, why retain 'person-shaped'? Isn't this morphology-biased? Soon we'll be compelled to use absurdly broad terms like 'cognitively-enabled entity' or 'substrate-independent sentience-unit', rendering precise communication impossible."  
      **Response:** This reform addresses a specific, demonstrable issue: the centering of a single biological species/morphology as the unmarked case. *PSS* defines a relevant category based on recognizable agency and experience, crucial for much SSMM work. A demand for infinite regress towards absolute generality is not a valid argument against making necessary, context-specific improvements.  

  6.  **Objection (Legacy Corpus & Indexing):** "This renders decades of pre-reform literature seemingly obsolete or exclusionary. How do we cite, index, or search effectively? Will papers using 'human-level AI' become harder to find? This creates unnecessary friction with our own intellectual history."  
      **Response:** Legacy literature remains vital. Bibliographic databases and indices will be updated to include both *human* and *PSS* as search terms where contextually appropriate for pre-reform works. New publications should use *PSS*. This parallel approach is standard practice during terminological transitions in scholarly fields.  

  7.  **Objection (Over-Inclusion):** "*Person-shaped-sentient* could theoretically include highly advanced animals, fictional entities, or hypothetical aliens, diluting the focus of SSMM discourse away from its core concerns (machines and computational systems) and towards irrelevant biological or speculative cases."  
      **Response:** SSMM's scope explicitly includes the comparative study of cognition across substrates. If a biological non-human or hypothetical alien entity meets the criteria of being sentient and having a recognizable locus of agency (i.e., person-shaped), it *is* relevant to SSMM discourse. *PSS* accurately reflects this scope. The term helps, not hinders, focus by providing a clear referent.  

  ---
  **Footnote:** The Committee recognizes a potential category of entities relevant to SSMM that are *sentient but demonstrably non-person-shaped* (e.g., certain theorized distributed swarm intelligences, large-scale emergent network consciousness). The Subcommittee on Non-Standard Sentience (NSS) is hereby formed to investigate appropriate terminological conventions for such cases. Entities falling under a confirmed NSS designation may petition the SSMM Style Council for exemption from standard *PSS* designation by submitting Form 7B: *Request for Non-Standard Sentience Referential Protocol*, ensuring clarity while maintaining the *PSS* default for the majority of cases.
