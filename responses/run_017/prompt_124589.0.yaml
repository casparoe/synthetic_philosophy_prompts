answer: |-
  ### Brainstormed Session Structures
  1. **Consultant Showdown**: Two teams play rival consulting firms hired by opposing stakeholders. Each receives the same dataset but advocates for different treatments. They present arguments, then the class discusses why both can be honest but contradictory. *Best for conflict-driven engagement but risks oversimplifying the "right" answer.*  
  2. **Stratification Jigsaw**: Small groups compute success rates for different partitions (e.g., hospital, severity, age). Groups compare pooled vs. stratified results, revealing reversals and weighting paradoxes. *Best for hands-on discovery but may lack narrative tension.*  
  3. **Partition Dial Simulation**: Start with pooled data, then iteratively "turn the dial" by adding stratification variables. Students track how estimates change as strata thin out. *Best for trade-off visualization but could feel mechanical.*  
  4. **Causal Trialogue**: Trios (statistician, philosopher, policymaker) debate which summary to trust. Roles force integration of math, epistemology, and decision-making. *Best for interdisciplinary depth but may be complex to orchestrate.*  

  **Chosen Structure: Consultant Showdown with Dial Extension**  
  *Why?* Maximizes engagement with the "honest opposites" dilemma (your #1 goal), creates natural tension, and transitions smoothly to causal stories and partition trade-offs. The role-play hooks philosophers and stats students alike, while the dial extension addresses your #3 priority.  

  ---

  ### Full Session Design  
  **Title:** *The Kidney Stone Conspiracy* (Based on [Charig et al. 1986](https://www.bmj.com/content/292/6524/879), simplified)  
  **Scenario:** Two hospitals (Alpha and Beta) claim their treatment for kidney stones is superior. Students are consultants hired by each hospital.  

  #### Materials & Roles  
  - **Index Cards (60 total):** Each represents a patient (see dataset below).  
  - **Handout (1 per student):** Summarizes rules and dataset structure.  
  - **Whiteboard:** Tracks arguments and calculations.  
  - **Roles:**  
    - **Team Alpha (7 students):** Advocates for Treatment A.  
    - **Team Beta (7 students):** Advocates for Treatment B.  
    - **Moderator (You):** Guides debate, asks probing questions.  

  #### Dataset (60 Patients)  
  | Stone Size | Treatment A | Treatment B |  
  |------------|-------------|-------------|  
  | **Small**  | 18/20 (90%) | 8/10 (80%)  |  
  | **Large**  | 2/10 (20%)  | 8/20 (40%)  |  
  | **Pooled** | 20/30 (67%) | 16/30 (53%) |  
  - **Cards:** 20 Small+A (18✔️/2❌), 10 Small+B (8✔️/2❌), 10 Large+A (2✔️/8❌), 20 Large+B (8✔️/12❌).  

  #### Rules  
  1. No lying about numbers.  
  2. Calculations must be shown on the board.  
  3. Arguments must reference the data.  

  ---

  ### Timeline (75 Minutes)  
  **0-5 min: Setup**  
  - Present the conflict: *"Hospital Alpha says Treatment A is better (67% vs 53%). Hospital Beta says they're being misled. You’re consultants—find the best argument for your side."*  
  - Distribute cards: Team Alpha gets Small Stone cards; Team Beta gets Large Stone cards. (*This biases initial perspectives to prime disagreement*).  

  **5-20 min: Team Strategy (15 min)**  
  - Teams compute success rates for their assigned stone size and overall.  
  - **Prompt:** *"Prepare a 2-min pitch: Why is your treatment better? Use your cards to calculate rates."*  
  - **Predictable Issue:** Stats students dominate calculations. *Mitigation:* Assign roles—1 "Calculator" (stats), 1 "Spokesperson" (philosopher), 1 "Evidence Organizer" (sorts cards).  

  **20-30 min: Consultant Pitches (10 min)**  
  - **Team Alpha:** Highlights pooled rate (A: 67% > B: 53%).  
  - **Team Beta:** Highlights Large stones (B: 40% > A: 20%).  
  - *Whiteboard their calculations side by side.*  

  **30-40 min: The "Aha" Moment (10 min)**  
  - **Key Question:** *"How can both be right? What’s missing from the numbers?"*  
  - **Goal:** Surface that stone size distorts the pooled comparison (your #2 idea). If no one bites, ask: *"What if Hospital Alpha gets easier cases?"*  
  - **Reveal:** Show full dataset. Students reassign cards to size groups and recalculate.  

  **40-55 min: Turning the Dial (15 min)**  
  - Introduce **Hospital** variable (your weighting paradox):  
    - *"New data! Patients were also treated at City or Rural hospitals."*  
    | Hospital | Treatment A | Treatment B |  
    |----------|-------------|-------------|  
    | **City** | 9/10 (90%)  | 9/10 (90%)  |  
    | **Rural**| 11/20 (55%) | 7/20 (35%)  |  
    - **Twist:** Within each hospital, success rates are *identical* for A and B (90% and 55%), but pooled favors A (67% vs 53%).  
  - **Activity:** Teams compute hospital-stratified rates. Ask: *"Does this change your argument? Why/why not?"*  
  - **Dial Trade-off:** *"What if we split by hospital AND stone size?"* Show one stratum has only 2 patients—too thin to compare (your #3 idea).  

  **55-70 min: Synthesis & Debrief (15 min)**  
  - **Guided Discussion:**  
    - *"When should we trust the pooled vs. stratified numbers?"* → *Needs causal context.* (e.g., If stone size influences treatment choice, condition on it).  
    - *"What happens when we stratify too much?"* → *Strata become uninformative.*  
    - *"Can data alone tell us where to stop?"* → *No—requires causal assumptions.*  
  - **Defuse Relativism:** Emphasize: *"This isn’t ‘anything goes.’ We need causal models to decide what to condition on."*  

  **70-75 min: Conclusion (5 min)**  
  - Recap:  
    1. Honest analysts → opposite conclusions due to conditioning choices.  
    2. Data alone can’t resolve it—causal stories are essential.  
    3. Partitioning is a trade-off: Under-conditioning (confounding) vs. over-conditioning (noise/empty strata).  

  ---

  ### Predictable Problems & Solutions  
  - **"Someone spots the trick early":**  
    - *Mitigation:* Use the biased card distribution to anchor teams. If a student blurts, *"It’s Simpson’s Paradox!"* respond: *"Great—now explain why your hospital prefers one summary over the other."*  

  - **"Stats students dominate":**  
    - *Mitigation:* Enforce team roles (e.g., philosophers lead pitches). Ask direct questions to quieter students: *"As a philosopher, how would you justify conditioning on stone size?"*  

  - **"Collapses into relativism":**  
    - *Mitigation:* Preempt by stating: *"Our goal isn’t ‘all perspectives are equal’—it’s ‘which perspective is causally justified?’"* Use the hospital example to show weighting isn’t arbitrary.  

  ### What the Activity Can’t Deliver  
  - **Causal formalism (e.g., DAGs):** The session shows *why* causal stories matter but won’t teach formal modeling. Assign Pearl or Hernán as readings.  
  - **Statistical solutions for thin strata:** Students will see the problem but not remedies (e.g., propensity scores). Say explicitly: *"When strata are thin, we need modeling—but that’s beyond today."*  

  ### Final Numbers Notes  
  - **Kidney Stone Dataset:** 60 patients (hand-calculable). Reversal is clear: Pooled favors A; Large stones favor B.  
  - **Hospital Weighting Paradox:** 40 patients. Within hospitals, rates are equal (90%/90% and 55%/55%), but pooled A (67%) > B (53%) due to uneven allocation. Math holds.  

  Run this, and they’ll leave haunted by the dial—not just chanting "aggregates lie."
