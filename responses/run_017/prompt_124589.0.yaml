prompt: |-
  hey — you're an expert in philosophy of statistics and causal inference who's also actually taught discussion-based classes, not just written about them. So think carefully, show your work on any arithmetic, and start by brainstorming three or four different shapes this session could take — tell me in a couple of lines each, say which one you'd actually run and why, and only then give me the full design for that one.

  The setting: 14 students, upper-division seminar called something like "Evidence, Cause and Numbers". Mostly philosophy majors with one stats course and a bit of philosophy of science, plus two or three political science people who are comfortably better at the maths than the philosophers. One 75-minute block, nothing in between sessions. Whiteboard, projector, index cards. No money, no laptops — so nothing that needs a spreadsheet; I want them pushing numbers around by hand or on cards.

  Topic is Simpson's paradox and the surrounding question of when you should and shouldn't condition on a variable. I don't want the version where I put the 2x2x2 table on the board and then reveal the reversal, because I've done that and they all nod and then three weeks later their takeaway is "aggregates lie". The thing I want them to run into is a bit different, and this is the half-formed part:

  1. Two presenters can both be scrupulously honest, quote only true numbers from the same dataset, and reach opposite recommendations. So the interesting question isn't "who's fudging it" but "what work is the choice of summary doing".
  2. Nothing in the frequency table itself settles whether the aggregate or the stratified numbers are the ones you should act on. What settles it is a causal story, and the table doesn't contain one. I want them to feel the pull of "ok, but which one is really true?" and then discover that the question has no answer from the data alone.
  3. The bit I care most about and have never seen taught: the partition is a dial, not a given. Coarse partition and you've left confounding in; turn it finer and the strata get thin, and eventually you get subgroups with only treated or only untreated units in them, where the within-stratum comparison isn't just noisy but doesn't exist. I want them to see that both ends of the dial fail in different ways and that the data doesn't tell you where to stop.

  There's a fourth thing I'm not sure about and I may be misremembering. I have a feeling you can build a case where the success rate for the two treatments is identical inside every single subgroup, and the crude, pooled rates still differ a lot — something about the pooled rates being weighted averages with different weights for each group. If that's right I think it's a killer last beat: no difference anywhere, big difference overall. But if I've got the maths wrong, say so plainly, tell me what is true instead, and don't build the session around it.

  So: design the thing. Concrete rules, what's on the cards or the handout, roles (I was thinking opposing pairs of "consultants" hired by the two sides of some dispute, but you pick), a rough timeline with some slack in it, and the exact numbers I should use — a small hand-checkable table, maybe 60 or 80 units and a handfull of strata, not 5000 rows. Then the debrief: which moment in the activity is supposed to produce which of the three ideas above, what I say if nobody bites, and what predictably goes wrong the first time I run it. My guesses: someone spots the trick in the first five minutes and says it out loud; or the two strong stats students take over and the philosophers go quiet; or the whole thing collapses into "it depends what question you're asking" relativism, which is the one outcome I'd actively hate. Tell me how to head each of those off. And be honest about which part of this the game simply can't deliver and I'll have to say out loud myself at the end.

  Don't bother with citations or a reading list, I know that literature and I'll seperately hand them the readings.
