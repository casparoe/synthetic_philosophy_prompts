  - Turing-style behaviorist/functionalist: passing the test is sufficient for having a mind; it's about behavior.
  - Chinese Room style: correct behavior produced without understanding (wrong mechanism) doesn't count.
  - Biological: requires the right substrate (e.g., biological neurons).
  - Predictive stance: it's all about patterns; no inner mind needed, just useful to treat it as such.
