  3. Competence symmetry: what if the AI is too smart?
  4. Provenance of answers: does training data matter?
  5. Right stuff: does substrate matter? (e.g., biological)
  6. Binary vs graded: is mind a matter of degree?
  7. Social status: is it about how we treat it?
