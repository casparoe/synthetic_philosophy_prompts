  ### Taxonomy Key: Map Your Answers to Positions  
  *Based on your answer pattern, here’s your stance. Positions are simplified for clarity.*

  | **Leaf Position**                  | **Answer Pattern**                                   | **Core Belief**                                                                 |
  |------------------------------------|------------------------------------------------------|---------------------------------------------------------------------------------|
  | **1. Behaviorist (Turing-style)**  | 1A, 2B, 3C, 4A, 5A, 6A, 7A, 8A                     | Passing the test *defines* having a mind. Mechanism irrelevant.                |
  | **2. Mechanism Skeptic (Chinese Room flavor)** | 1B, 2A, 3B, 4B, 5B, 6B, 7A, 8A              | Right behavior ≠ mind. Requires "correct" internal process (e.g., biology).    |
  | **3. Biological Essentialist**     | 1B, 2A, 3B, 4B, 5B, 6A, 7B, 8A                     | Only biological systems have minds. Silicon can’t "understand."                |
  | **4. Predictive Stance (Patterns)**| 1A, 2C, 3A, 4A, 5A, 6B, 7C, 8C                     | "Mind" is a useful fiction for prediction. No hidden facts—just patterns.      |
  | **5. Skeptic (Other Minds)**       | 1B, 2A, 3A, 4C, 5C, 6C, 7C, 8B                     | We can never *know* if anything has a mind (even humans). Test is social ritual. |
  | **6. Social Constructivist**       | 1A, 2C, 3C, 4C, 5A, 6A, 7C, 8B                     | "Mind" is a status we grant. Passing the test confers personhood.              |
  | **7. Unnamed Leaf**                | 1B, 2B, 3B, 4B, 5C, 6B, 7B, 8C                     | *Rejects coherence of "mind." Graded, substrate-specific, but indefinable.*    |

