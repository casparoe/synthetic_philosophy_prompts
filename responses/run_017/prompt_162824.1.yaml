  ### Diagnostics & Notes  
  - **Collapsed Pair**: Mechanism Skeptic (Leaf 2) and Biological Essentialist (Leaf 3) overlap heavily. They diverge only on **Q6 (Graded Mind)**. *Prying case: A non-biological system (e.g., quantum computer) with "correct" internals. Leaf 2 accepts it; Leaf 3 rejects it.*  
  - **Weak Distinction**: **Competence Symmetry (Q3)** doesn’t split cleanly—most positions default to "test flaw" or "judge error." Cut it; it’s redundant with Q2/Q8.  
  - **Missing Question**: Add this to separate Behaviorist vs. Predictive Stance:  
    > *If an AI passes but is later found to use random nonsense internally (yet still works), does it have a mind?*  
    - **A) Yes** (Behaviorist: output matters).  
    - **B) No** (Predictive Stance: coherence matters for usefulness).  
  - **Why Unnamed Leaf?** Combines unpopular views: minds are graded (Q6B) but substrate-bound (Q5B/C) and undefinable (Q2B). Incoherent to most.  
  - **Jargon Avoided**: Positions labeled intuitively (e.g., "Mechanism Skeptic" not "Chinese Room").  

