  The rain hammered a steady tattoo on the corrugated iron roof of the old farm workshop. Inside, the air hung thick with the smells of damp earth, engine oil, and cut timber. Elara stood frozen, the workshop door swinging open behind her, letting in a gust of wet wind and the sight of her battered Land Rover, engine still running. Inside the workshop, pinned beneath the heavy timber frame of a half-built cider press he’d been repairing for *her*, lay Thom. His face was white, contorted with pain, one leg twisted unnaturally. Rainwater dripped steadily from the frame onto his chest.

  "Elara?" he gasped, his voice tight. "The block slipped... when I shifted to reach your mallet. Leg’s caught bad."

  Elara’s mind raced. She’d asked Thom, a skilled carpenter who sometimes did odd jobs for neighbouring farms, to look at the press weeks ago. Yesterday, overwhelmed preparing for the crucial Soil Association inspection that could secure her organic certification and save her struggling smallholding, she’d finally blurted, "Thom, the press in the old workshop – *please*, if you get a moment? Just… do what you can. Key’s under the brick." She hadn’t thought about it since, buried under lambing records and grant applications.

  Now, her chance had arrived. Not the inspection – that was tomorrow. But the call had come an hour ago: Dr. Anya Sharma, the leading agroecology researcher Elara had been trying to meet for months, was unexpectedly in the area *tonight* and could spare thirty minutes. At the pub, *now*. It was a fragile, fleeting thread of hope – a chance to pitch her innovative rotational grazing model directly, potentially securing Sharma’s backing, vital investment, maybe even a research partnership. Her farm’s future, her lifeline out of crippling debt, balanced on making that meeting. Missing it meant almost certain financial ruin, losing the land her family had worked for generations.

  Thom groaned. "Think it’s broken, Elara. Can’t… can’t shift it."

  She could free him. The hydraulic jack was right there. It would take ten, maybe fifteen minutes to lift the frame safely. But driving to the pub took twenty-five in this weather. She’d be late. Profoundly, insultingly late. Sharma, known for her punctuality and packed schedule, would almost certainly leave. The opportunity would vanish. Elara hadn’t *made* Thom come; she’d merely given permission, carelessly, in her haste. He’d chosen to work alone, in the rain-slicked workshop. She had every right to have left the key accessible, every right to chase her meeting. Yet, seeing him trapped, hurt because he was doing *her* a favour, the weight of it crushed her.

  "Thom, I..." Her voice cracked. The rain drummed harder. The Land Rover’s engine idled, a promise ticking away. She looked from his pain-filled eyes to the jack, then back to the open door, the path to her possible salvation. A terrible, silent calculation filled the damp air. With a choked sob, a sound ripped from somewhere deep and wounded, Elara whispered, "I’m sorry, Thom. I have to go. I’ll... I’ll send help. I’ll send someone right away." She turned and ran through the rain to the Land Rover, leaving the workshop door swinging, leaving Thom pinned beneath the heavy, dripping frame.

  **The Philosophies Applied:**

  1.  **Singer's Shallow Pond Analogy:** Singer's principle demands preventing something "very bad" if we can do so without sacrificing anything "morally comparable." Thom's broken leg is certainly very bad – agonising, potentially leading to long-term impairment. However, what Elara would sacrifice by stopping is not trivial: it’s the probable loss of her farm, her livelihood, and her family's heritage – a catastrophe comparable in scale to Thom's suffering (both involve severe, life-altering hardship). Crucially, Singer focuses on *preventing harm*, not necessarily on *causal responsibility*. Elara didn't *cause* Thom’s accident; she merely failed to prevent it by acting. Given that preventing it requires sacrificing something morally comparable (her farm's survival), Singer’s demanding principle *permits* her to prioritise her own grave need and drive away. Her duty is general, not specific; the comparable sacrifice defence holds.

  2.  **Ordinary Morality (Relational/Duty-Based):** This view roots obligation in specific relationships and actions. Here, Thom is in peril *because* he was doing Elara a favour, undertaken at *her* specific, albeit rushed, invitation ("please... do what you can"). By giving him permission and access, Elara entered into a tacit relationship of reciprocal responsibility. His predicament is a direct consequence of acting on *her* request within the space *she* controls. Ordinary morality emphasises duties arising from what we *do* and the particular obligations we incur. Elara didn't just *find* Thom trapped; his situation is entangled with her prior actions towards him. Therefore, she owes *him specifically* a duty of aid that transcends a general duty to prevent harm. She is required to help him first, regardless of the cost to her opportunity, because she bears a special responsibility *to him* arising from their interaction.

  **The Pivotal Feature:** The **specific relational history and causal chain initiated by Elara's request and permission**. Thom isn't a random stranger in peril; he is someone acting on Elara’s direct, personal solicitation, which led directly to his accident. Remove this feature – if Thom was trespassing or working on his own project unrelated to Elara – and ordinary morality loses its strong claim of specific duty. Her obligation would revert to a more general, potentially overridable one. Singer's view, focused purely on outcomes and comparable sacrifice, remains unchanged regardless of the relational history; it only cares about the badness prevented versus the cost incurred.

  **The Singerite Wriggle:** A defender of Singer might argue along these lines: "The 'comparable sacrifice' threshold is key. Is losing a farm truly comparable to a broken leg? While severe, a broken leg is usually reparable; permanent disability isn't certain. Losing her livelihood and heritage, however, is potentially total and irreversible for Elara. Furthermore, the immediacy of her opportunity is absolute – missing the meeting destroys it utterly, whereas Thom's situation, while urgent, allows for sending immediate help (as Elara intends). The *certainty* and *irreversibility* of her loss if she stops might outweigh the *probability* and *nature* of Thom's harm. She isn't *causing* his continued suffering; she's arranging alternative aid. Therefore, prioritising her own catastrophic, certain loss over preventing his serious, but potentially mitigatable, harm is permissible under the principle when 'comparable' is rigorously assessed."

  The rain continued its relentless beat on the roof as Thom heard the Land Rover's engine fade into the distance, the sound swallowed by the downpour and his own sharp, lonely pain.
