  For the scenario, I'm considering an industrial setting where the protagonist's lawful action inadvertently creates danger. A farm workshop feels right - tangible hazards, non-fatal but grave risks like a machinery accident. Rain adds atmosphere. The conflict: she's legally entitled to leave equipment unlocked during her break, but this allowed a well-intentioned colleague to endanger himself. Her sacrifice would be abandoning a time-sensitive opportunity (career-defining interview) to free him, with comparable stakes: his permanent injury vs. her lifelong professional setback.

  Why this flips the demandingness worry: Singer focuses on preventing bad outcomes regardless of causation. Since she didn't cause the harm (merely failed to prevent it via inaction), and her sacrifice is substantial, Singer permits walking away. Ordinary morality, however, emphasizes relational duties - her prior permission created implicit responsibility, making this a debt of reciprocity. The pivotal feature is causation vs. relational obligation. Remove her explicit consent (if he'd trespassed), ordinary morality loses its grip. Singer defenders might argue her consent was invalid under duress or that the opportunity cost isn't truly comparable.

  The scene must humanize both characters. Her reluctance isn't selfishness but anguish over an impossible choice. His predicament stems from trying to help her project. Rain-slicked machinery raises stakes realistically. Ending with her departure maintains moral ambiguity - the reader understands both her sacrifice and her refusal.
