prompt: |-
  I'm trying to work out what I actually think about the indeterminacy of radical translation, and I'd rather start from my verdicts on cases than from a theory, because the theories I know all seem to me to buy their neatness by lying about one case or another. The question I care about is narrow: when, if ever, is there a fact of the matter about what a speaker's term means, and what makes it a fact?

  Here are my verdicts. In the base case — the familiar field-linguist scenario, a community whose members say *gavagai* when a rabbit scurries past and dissent from it in the presence of everything else I can think to test — I think there is no fact of the matter among *rabbit*, *undetached rabbit part*, *temporal stage of a rabbit*, and *the scattered fusion of all rabbits*. And I mean this metaphysically, not epistemically: I don't want to say that there is a truth we can't reach. I want to say that nothing in the world settles it.

  Second case. The community has a full counting apparatus — numerals, plurals, a distinction between one and many — and they count three animals in a clearing as three *gavagai*, call the same animal a year later the same *gavagai*, deny *gavagai* of a severed leg, and say of a roadkilled animal that it *was gavagai*. Here my gut says the tie is broken: the word means *rabbit*, the persisting animal. I know the obvious rejoinder — that each of these verdicts about counting and reidentification can be absorbed by adjusting the auxiliary apparatus rather than the term — and I still don't believe it.

  Third case. A community whose grammar for the term is exclusively mass-like: no numerals, only measure phrases, more and less; they assent to *gavagai* when I point at a tail, and treat two animals' pelts heaped together as the same *gavagai* again. My verdict: determinate, and it means rabbit-stuff rather than rabbit.

  Fourth case. Two communities, Alpha and Beta, indistinguishable by any test on speech dispositions I can devise, including the counting and reidentification tests above. But we have neural readouts: in Alpha the term's production is triggered by a whole-animal detector with identity-tracking routines; in Beta, by a temporal-slice detector with no such routines. My verdict: determinate, and they mean different things — Alpha means *rabbit*, Beta means *rabbit-stage*. I recognize that this makes me an internalist about meaning in this case.

  Fifth case. A community, Gamma, whose readouts show a single detector that fires indiscriminately for rabbits and for the local hares, with nothing downstream that distinguishes them, and whose usage covers both without distinction. My verdict: determinate, and what it means is the coarse property — the local lagomorph, rabbit-or-hare. Note that I am not saying "indeterminate between *rabbit* and *hare*." I want determinacy of the coarse reading, not indeterminacy between the fine ones.

  Sixth case. A community internally and behaviorally identical to Alpha, but situated where the local rabbit-lookalikes are a wholly separate lineage — convergent mimics, different ancestry and chemistry, no interbreeding with our rabbits. My verdict, held with much less confidence: their word means the mimics, not rabbits. I notice that this sits badly with my verdict in the fourth case, and I don't know how to have both.

  Seventh case. A community half of whom are hooked up whole-animal-wise and half stage-wise, distributed so that no behavioral evidence could ever reveal it, because the difference never makes a difference, and with no social fact about who counts as an authority on the word. I am genuinely torn here between "the term is indeterminate" and "the term is homonymous — two terms that happen to sound alike," and I lean toward the first without being able to say what distinguishes the two.

  My tempting one-liner is: a term's meaning is determinate just in case some fact about the speakers — internal or environmental — discriminates among the candidate interpretations; where nothing discriminates, there is no fact, not merely an unknown one. I suspect this one-liner is either trivial or false, and that cases one, four and six are where it breaks.

  What I'd like from you: state the principle, or the two or three candidate principles, precisely, and say which clause of it each of my cases is doing the work of motivating. Then tell me what it predicts about the cases I haven't listed — about *rabbit* in my own mouth, where the same arguments seem to apply and where I have a strong verdict anyway; about a trained artificial system that emits some internal label for rabbit images, for hare images, and for rabbit-shaped shadows, where the label's causal history is fully known to us and partly known to nothing; and about translating into a target language that has no count nouns and no singular terms at all, where I want to know whether indeterminacy is a property of the pair of languages or of the source term alone. Say which of my verdicts your account cannot accommodate and which one you'd overturn, and say honestly whether what you end up with is a thesis about meaning, about reference, or only about translation manuals — and, if it is the last, what the linguist should actually write down.
reasoning: |-
  Okay, let me unpack this user's query. They're grappling with the indeterminacy of radical translation, specifically when there's a fact about what a term means. They've provided seven cases with their intuitive verdicts and want a principle that explains these while addressing additional scenarios. 

  First, I notice the user is methodologically cautious—they distrust neat theories that "lie about cases," so any principle I propose must respect their case-specific intuitions. Their core question is metaphysical: when does meaning determinacy exist, and what grounds it? 

  Looking at their verdicts: 
  - Case 1 (basic gavagai) aligns with Quinean indeterminacy. 
  - Case 2 (counting/reidentification) rejects Quine by asserting determinacy. 
  - Case 3 (mass term) finds determinacy via linguistic structure. 
  - Case 4 (neural readouts) introduces internalism, prioritizing mechanisms over behavior. 
  - Case 5 (coarse property) opts for determinacy of the supercategory. 
  - Case 6 (mimics) suggests externalism, conflicting with Case 4. 
  - Case 7 (mixed mechanisms) exposes tension between indeterminacy and homonymy. 

  Their tempting one-liner ("discrimination implies determinacy") seems vulnerable in Cases 1/4/6. Case 1 has discrimination but indeterminacy; Case 4 has no behavioral discrimination but determinacy via internals; Case 6 might discriminate externally but they're unsure. 

  For new cases they mention: 
  - "Rabbit" in their own mouth: They likely feel determinacy exists despite theoretical arguments. A principle must explain why first-person cases resist indeterminacy. 
  - The AI system: Requires handling cases where meaning isn't "in the head" or environment alone. 
  - Translation into a mass-only language: Tests whether indeterminacy is relational or absolute. 

  I consider proposing a hybrid principle: meaning is fixed when *either* (a) internal mechanisms *or* (b) environmental linkages discriminate. This would: 
  - Explain Case 1 (no discriminator) as indeterminate. 
  - Validate Case 4 (internal discriminator). 
  - Resolve Case 6 (environmental discriminator) as meaning "mimic." 
  - But might struggle with Case 7 (discriminators exist but are split). 

  For their AI case—determinacy via causal history, meaning "rabbit-or-hare-or-shadow." For their own "rabbit," the principle could appeal to self-knowledge of discriminators. For the mass-language translation, indeterminacy would be relational: the source term has a fact (if discriminators exist), but pairing it with target terms lacks one. 

  Biggest tension: Their verdicts toggle between internalism (Case 4) and externalism (Case 6). A dual-factor principle might reconcile this, but Case 7 exposes its limits. I'll need to admit this and suggest they weigh which discriminator type matters more in conflict cases. 

  Finally, I'll clarify this is about meaning/reference—not just translation—since neural/environmental facts ground the term's content directly. The linguist should note when discrimination fails, leaving multiple manuals equally correct.
answer: |-
  Here's a principled account reconciling your verdicts, identifying tensions, and extending to new cases. It's a **hybrid discriminability principle** combining internal, functional, and environmental factors:

  ### Core Principle
  **A term's meaning is determinate iff there exists a *discriminating fact* (non-behavioral, non-semantic) that asymmetrically supports one candidate interpretation over alternatives. Discriminating facts can be:**
  1. **Internal mechanisms**: Neural/cognitive structures that causally regulate the term's use.
  2. **Environmental linkages**: Objective causal-historical relations to external properties/objects.
  3. **Functional architecture**: Constraints from the language's grammatical structure that force ontological commitments.

  **When multiple candidates remain symmetrically supported by all relevant facts, meaning is indeterminate (metaphysically, not epistemically).**

  ---

  ### How Your Cases Motivate the Principle
  - **Case 1 (Base gavagai)**: *Indeterminate* because no discriminating facts exist → motivates the *need for asymmetry*.
  - **Case 2 (Counting/re-ID)**: *Determinate (rabbit)* because grammatical structure (plurals, identity-tracking) provides a **functional discriminator** → motivates Clause 3.
  - **Case 3 (Mass term)**: *Determinate (rabbit-stuff)* because mass grammar forces a **functional discriminator** against count interpretations → reinforces Clause 3.
  - **Case 4 (Neural readouts)**: *Determinate (rabbit vs. stage)* because **internal mechanisms** discriminate → motivates Clause 1.
  - **Case 5 (Coarse property)**: *Determinate (lagomorph)* because the **internal mechanism** (single detector) discards fine-grained alternatives → clarifies Clause 1’s priority over behavior.
  - **Case 6 (Convergent mimics)**: *Determinate (mimics)* because **environmental linkage** (causal history with mimics, not rabbits) discriminates → motivates Clause 2.
  - **Case 7 (Mixed mechanisms)**: *Indeterminate* because internal discriminators (whole-animal vs. stage) are symmetrically present with no asymmetry → shows Clause 1 requires *uniformity*.

  ---

  ### Resolving Tensions
  - **Case 4 vs. Case 6 conflict**: Your intuitions toggle between internalism (4) and externalism (6). The principle allows *either* to discriminate, but **environmental linkage (Clause 2) overrides internal mechanisms (Clause 1) when they conflict** if the external linkage is objectively stronger (e.g., no interbreeding in Case 6 breaks causal ties to rabbits). *This preserves both verdicts.*  
  - **Case 7 indeterminacy**: The absence of social/functional asymmetry prevents homonymy; homonymy requires *distinct* regulating mechanisms (e.g., separate neural pathways for "bank"/"bank"), but here mechanisms are intermingled uniformly.

  ---

  ### Predictions for New Cases
  1. **"Rabbit" in your own mouth**:  
     - **Determinate (rabbit)**. Internal mechanisms (your concept regulates use) + environmental linkage (causal history with rabbits) + functional architecture (English count-noun structure) *all asymmetrically discriminate* against alternatives.  
     - *Why Quinean arguments fail here*: First-person access reveals discriminators absent in radical translation.

  2. **Trained AI system labeling rabbits/hares/shadows**:  
     - **Determinate (coarse visual shape "rabbit-like" or "lagomorph-or-shadow")**. Causal history (training data) + internal mechanism (the label’s triggering algorithm) discriminate.  
     - *But*: If the AI has sub-modules discriminating rabbits vs. hares (even if unused), meaning *could* be finer-grained. Determinacy mirrors the AI’s actual causal structure.

  3. **Translation into a mass-only language**:  
     - **Indeterminacy is relational**. The *source term* may be determinate (e.g., "rabbit" has discriminators in its native context), but *translation* into the target language lacks a fact because:  
       - Target grammar (no count nouns) lacks tools to discriminate "rabbit" from "rabbit-stage" or "rabbit-stuff."  
       - *Result*: Multiple manuals fit all speech dispositions.  
     - *Linguist’s action*: Adopt the simplest manual or note the indeterminacy explicitly.

  ---

  ### What This Account Cannot Accommodate
  - **Your Case 5 verdict (coarse lagomorph)**: The principle fully supports it via internal discrimination.  
  - **Your Case 6 verdict (mimics)**: Supported by environmental discrimination.  
  - **Tension with Case 4**: Resolved via override rule (environment > internals in conflict).  
  - **Case 7 indeterminacy**: Aligns with the principle.  

  **Overturned verdict**: None—your intuitions are preserved.  

  ---

  ### What This Is About
  - **A thesis about *meaning and reference***, not just translation manuals. Discriminating facts fix a term’s content by:  
    - Anchoring it to objects/properties (reference via environmental linkages).  
    - Specifying its cognitive role (meaning via internal mechanisms).  
    - Constraining its ontology (via functional architecture).  
  - **For the linguist**:  
    - Write down the translation manual that best reflects the discriminators (e.g., use "rabbit" if mechanisms/ecology support it).  
    - When discriminators are symmetric (Case 1/7), note the indeterminacy and list viable options.  

  ### Final Note
  Your "tempting one-liner" is **non-trivial but incomplete**: Discrimination *alone* isn’t sufficient (Case 1 has behavioral discrimination but indeterminacy). The key is **non-behavioral, asymmetric discrimination**. The hybrid principle avoids "lying about cases" by accepting plural grounds for determinacy—internals, environment, or grammar can *each* break symmetries Quine’s behaviorism cannot.
