prompt: |-
  I write historical fiction. My last two novels put real, named dead people on the page alongside invented ones, and I want to know what principle I am actually working from, because my verdicts on particular cases don't obviously add up.

  Here is my gut, case by case. Giving a heavily documented statesman a private conversation with his wife that no record supports, in which he says nothing he is on record opposing: fine. Giving an abolitionist whose letters survive in bulk a scene in which she privately argues against her own cause, in order to dramatize doubt: not fine, even though the room is undocumented. Moving a real, dated meeting a year later and adding a person who wasn't there so that the plot will work: not fine. Replacing a documented event with an invented one of roughly the same shape — a quarrel that didn't happen between two men we know were hostile: also not fine, but distinctly less bad than moving the meeting, and I can't say why. Compositing four real minor figures into one invented character: obviously fine. A nineteenth-century explorer who demonstrably exaggerated her own role in her published memoir: I genuinely don't know whether I owe fidelity to the record or to her account of herself, and I go back and forth. The same invention about someone dead three years whose children are alive and remember her, versus someone dead two centuries: the recent one feels much worse, although neither woman can be harmed. A woman known almost entirely through a colonial administration's files: inventing her inner life feels like repair rather than theft — not merely permitted but, in a small way, owed. And the pair I can't square: inventing that a real person did a brave, undocumented thing versus inventing that they did a cowardly or cruel undocumented one. These are equally unsupported by the record, and I treat them completely differently.

  My working rule, which I call the dark-room rule, is this: invent only where the record is dark, and let the quantity you invent shrink as the record grows — because a documented event is common property in a way that a person's unrecorded hours are not. Test that rule against the cases above and repair it where it breaks. Tell me which of my verdicts a defensible principle would force me to abandon, and state the principle precisely enough that it also delivers a verdict on a case I haven't listed: a novel in which the real person appears only inside a document I forged myself, a letter or diary entry written in my hand but presented as archive, which at least some readers will take at face value. Say too whether my verdicts are tracking what we owe the dead or what we owe readers, since I suspect I have been conflating the two.

  Finally, be explicit about your own footing. Separate what is settled from what is genuinely contested among people who work on these questions — philosophers of fiction, biographers, historians of the form — and don't present a contested view as the consensus. Where a disagreement bottoms out in an empirical claim nobody has good data on, such as how far novels actually shape what readers believe about real historical figures, say so instead of resolving it. And tell me plainly which of my verdicts you take to be professional squeamishness rather than moral perception.
reasoning: |-
  Okay, the user writes historical fiction and is grappling with ethical principles for portraying real historical figures alongside invented ones. They've shared several specific cases where their intuitive judgments feel inconsistent, and they want a coherent framework to guide their decisions. 

  First, I notice the user is deeply reflective—they've articulated nuanced dilemmas with striking precision. The "dark-room rule" they propose (invent only where the record is dark) is elegant but clearly fractures under pressure, as they've already sensed. What's fascinating is how their examples reveal unspoken priorities: they recoil from harming reputations (the cowardly invention vs. brave one), feel protective toward the recently deceased, and see invention as reparative for marginalized figures. This suggests their ethics aren't just about historical gaps but about power dynamics—who controls narratives.

  The user explicitly asks for two things: to test their rule against their cases, and to distinguish obligations to the dead vs. readers. But reading between the lines, I suspect they also want permission to trust their instincts when rules fail. Their phrasing ("professional squeamishishness") hints at frustration with abstract principles that dismiss their visceral unease about, say, making an abolitionist doubt her cause. That unease isn't squeamishness—it's ethical intelligence recognizing that some inventions reinforce historical oppression.

  On the contested points: Philosophers like Lamarque and Livingston would argue fiction's autonomy justifies invention, while historians like Byatt insist on fidelity to documented "gaps." The user's "reparative" approach aligns with postcolonial theorists like Spivak—but when they composite four real people into one? That's straight-up novelist pragmatism, justified by the minor scale. No scholar would call that unethical. 

  Where data is thin: We *assume* novels influence beliefs, but studies on historical fiction's impact are scarce. Still, the user's worry about forged documents feels valid—if readers might cite their fake diary as fact, that crosses into deception. Their instinct to treat recent deaths more tenderly also holds wisdom, not because the dead care, but because living communities do. 

  Finally, their toughest case—the explorer who exaggerated her memoir? I'd argue: the user owes fidelity to the *record*, not the myth. But they're right to waver; that tension is inherent. Sometimes good ethics means sitting with discomfort, not resolving it.
answer: |-
  Your "dark-room rule" is insightful but insufficiently nuanced for the complexities you're navigating. Below is a principled framework derived from your cases, tested against your verdicts, and expanded to address your new scenario. I'll distinguish obligations to the dead vs. readers, flag professional disagreements, and note where your instincts might reflect professional norms vs. core ethics.

  ---

  ### **Revised Principle: The "Reputational Scaffolding" Framework**
  **Core Idea:** *You may invent freely within gaps in the historical record, provided your inventions:*
  1.  **Do not contradict verifiable facts.**
  2.  **Do not substantially alter the established historical role, character, or legacy of the individual.**
  3.  **Respect the vulnerability of the dead (recency, marginalized status, contested legacy).**
  4.  **Signal invention clearly to readers through context or form.**

  **Why "Scaffolding"?** Real people have a reputational "structure" built from documented actions, attested character, and historical impact. Your inventions should be plausible "infill," not replacing load-bearing beams.

  ---

  ### **Testing Your Cases Against the Principle**

  | **Your Case** | **Your Verdict** | **Scaffolding Framework Verdict** | **Why?** |
  |---------------|------------------|----------------------------------|----------|
  | **Statesman's private conversation** | Fine | Fine | Plausible infill. Doesn't contradict record or alter legacy. |
  | **Abolitionist arguing against cause** | Not Fine | **Not Fine** | Violates #2: Contradicts core documented commitment, altering her historical role/character. |
  | **Moving dated meeting + adding person** | Not Fine | **Not Fine** | Violates #1 (factual contradiction) and potentially #2 (alters context/agency). |
  | **Invented quarrel between hostile men** | Not Fine (less bad) | **Not Fine** (but severity depends) | Violates #1. Less bad *only* if hostility is well-attested and quarrel plausibly *could* have happened (minor infill). Still alters specific historical causation. |
  | **Compositing minor figures** | Fine | Fine | Minor figures lack substantial scaffolding. Infill/reorganization is standard. |
  | **19th C. Explorer's self-mythologizing** | Uncertain | **Fidelity to the record** | Her account is evidence *of her persona*, not fact. #1 and #2 demand using verified events where possible. Inventing *against* her account requires strong justification (e.g., exposing colonial bias). |
  | **Recent death (children alive) vs. 200 years** | Worse for recent | **Worse for recent** | #3: Recency increases vulnerability. Living connections amplify potential harm/offense. |
  | **Colonized woman's inner life** | Repair/Owed | **Permitted, potentially owed** | #3: Reparative justice for marginalized voices silenced by the record. #2: Minimal scaffolding exists, so invention isn't distorting. |
  | **Invented brave act vs. cowardly act** | Treat differently | **Treat differently** | #2: A plausible undocumented brave act reinforces/extends legacy without harm. A cowardly/ cruel act damages legacy (#2) and exploits vulnerability (#3). Moral asymmetry exists. |

  **Where Your Rule Breaks:** Your "dark-room rule" fails on **asymmetry** (brave vs. cowardly) and **vulnerability** (recent death, colonized subject). Quantity of record isn't the sole factor; the *nature* of the gap and the *status* of the person matter.

  **Verdicts to Abandon?** The framework forces abandonment of seeing the "invented quarrel" as *significantly* less bad than moving the meeting. Both violate #1. The relative "badness" stems only from *plausibility* within the scaffolding, not ethical weight.

  ---

  ### **The Forged Document Case**
  *   **Verdict:** **Not Permissible** under this framework.
  *   **Why:** It violates all core principles:
      1.  **#1 (Contradiction):** It creates a false "verifiable fact" (the document itself).
      2.  **#2 (Altering Legacy):** It presents invented content *as* historical record, directly shaping perception of the person's actions/thoughts.
      3.  **#4 (Signaling):** It deliberately obscures invention, misleading readers. It weaponizes the authority of the archive.
  *   **Obligations:** This primarily violates **obligations to readers** (deception, undermining trust). Secondarily, it violates obligations to the dead by fabricating their literal voice.

  ---

  ### **Obligations: Dead vs. Readers**
  *   **To the Dead:** We owe **respect** – avoiding gratuitous harm/distortion, especially for the vulnerable (recently deceased, marginalized). We cannot "harm" them directly, but we can disrespect their memory, cause distress to living connections, or perpetuate historical injustices. Your colonial woman case hinges here.
  *   **To Readers:** We owe **transparency** and **integrity**. Readers engage with historical fiction under a contract: they expect invention, but *within boundaries*. They deserve clarity (through context/narrative framing) on what is likely invented vs. anchored. Forged documents and actions contradicting core character break this trust. Your abolitionist case is primarily here.
  *   **Conflation:** Your discomfort with the invented cowardly act involves both: disrespect to the dead *and* potential deception of readers about their character. The meeting move primarily deceives readers about historical causation.

  ---

  ### **Explicit Footing: Settled vs. Contested**
  1.  **Settled (Wide Consensus):**
      *   Contradicting unambiguous, well-established historical facts is generally unacceptable.
      *   Pure fiction about entirely undocumented, historically insignificant individuals is unproblematic.
      *   Compositing minor figures is standard practice.
      *   Inventing plausible private moments for public figures within character is acceptable.
      *   Deliberate forgery presented as real within the *fiction's world* (like your document case) is unethical deception.
      *   Sensitivity increases with recency of death/existence of living relatives.
  2.  **Contested:**
      *   **The "Harm" to the Dead:** Philosophers (e.g., Derek Parfit, debates on posthumous interests) disagree on whether the dead *can* be wronged. Ethicists (e.g., Joel Feinberg) argue we have duties *regarding* them. *Your instincts align with the latter.*
      *   **Scale of Permissible Invention:** Where does "plausible infill" end and "distortion" begin? Historians (e.g., Natalie Zemon Davis) often accept more invention than purists. Biographers (e.g., Hermione Lee) stress fidelity to documented character. *Your abolitionist case sits here.*
      *   **Reader Impact:** **Crucially Contested & Data-Poor:** *There is no reliable empirical data* on how much historical fiction shapes enduring popular belief vs. being consumed *as* fiction. Some (e.g., Hayden White) argue narrative shapes all history-telling. Others fear "fictional contamination." **Assume impact is real and act accordingly, but acknowledge the uncertainty.**
      *   **Reparative Invention:** Postcolonial/intersectional scholars (e.g., Saidiya Hartman, "critical fabulation") actively endorse reclaiming erased voices through speculative methods. Traditionalists see overreach. *Your colonial woman case is at this frontier.*
  3.  **Professional Squeamishness vs. Moral Perception:**
      *   **Squeamishness:** Your hesitation about moving a meeting *might* lean here. If the plot truly requires it and no significant historical consequence hinges on the *exact* date/attendees (i.e., it's a minor administrative meeting), strict adherence might be overly rigid. The framework flags it, but severity depends on context.
      *   **Moral Perception:** Your asymmetrical treatment of brave/cowardly inventions, your protectiveness towards the abolitionist's core conviction, your unease about the recent death, and your reparative impulse for the colonized woman are **strong moral perceptions**, reflecting deep respect for personhood and legacy, not just rules.

  ---

  **Conclusion:** Your instincts are largely sound, revealing an implicit ethics centered on minimizing harm, respecting legacy, and honoring vulnerability. The "Reputational Scaffolding" framework makes this explicit, justifying most of your verdicts while clarifying the gravity of moving documented events and forbidding forged documents. It acknowledges the contested nature of reader impact and reparative ethics while providing clear guardrails grounded in respect for both the dead and the living reader. Trust your gut on character and vulnerability; be stricter with documented events and reader transparency.
