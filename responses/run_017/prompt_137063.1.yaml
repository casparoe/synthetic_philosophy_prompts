  But the debrief is too short. Alternatively, we can have fewer presentations. Maybe have only 3 groups present in Part 1 (randomly chosen) and then after upgrade, 3 different groups. But that might leave some groups out.

  Alternatively, we can do:

  - 0:00-0:10: Intro
  - 0:10-0:30: Part 1 (20 min)
  - 0:30-0:40: Quick share: one idea per group (1 min each) without full presentation. Then facilitator summarizes common themes. (10 min)
  - 0:40-0:50: Upgrade (10 min)
  - 0:50-1:00: Quick share on upgrade (1 min per group) (6 min) then 4 min for initial reactions.
  - 1:00-1:20: Debate (20 min)
  - 1:20-1:30: Debrief (10 min)

  But the debrief is still short. We need 15 min for debrief. So:

  Final Timeline:

  - 0:00-0:10: Intro (10 min)
  - 0:10-0:25: Part 1 (15 min) [shorten design time]
  - 0:25-0:35: Presentations: each group gets 90 seconds (6 groups * 1.5 min = 9 min) plus 1 min transition -> 10 min
  - 0:35-0:45: Upgrade design (10 min)
  - 0:45-0:55: Upgrade presentations: 90 seconds per group (10 min)
  - 0:55-1:15: Debate (20 min) [extended]
  - 1:15-1:30: Debrief (15 min)

  This uses 90 minutes.

  Debrief Plan (15 min):

  1. (5 min) Reveal the banned words and map their "X" to consciousness/qualia. Explain: "What you called 'X' is what we usually call consciousness, or subjective experience, or qualia — the 'what it's like'."

  2. (5 min) Name the two problems:
     - The problem of explaining the reports and behaviors (which you designed in your mechanisms) — sometimes called the "easy problems" (though they are not easy, just easier in comparison).
     - The problem of explaining the subjective experience itself (the hard problem).

     Point out: "In the upgrade, you added a module that produces the report that something is missing (the 'X'). But does that explain the subjective experience? Or does it just produce another report? This is the gap: the difference between explaining the reports and explaining the experience."

  3. (5 min) Relate to the initial argument: "My friend thinks that if you explain all the reports, including the report that something is missing, then you've explained everything. But I think that the experience itself is not captured by the reports. The activity was designed to make you feel that gap."

  Finally, ask for reflections: "Do you now see the gap? Or do you think the upgrade closed it?"

