prompt: |-
  ok so I had this massive argument with a friend last night and I'd rather settle it with an exercise than with more shouting. The fight was about the gap between explaining consciousness itself and explaining why people say the things they say about it — why we report, judge, insist that there's a "what it's like", and get stubborn when someone tries to explain it away. His view: if you can explain all the reports, judgements and stubbornness, you've explained everything there is to explain, and the leftover sense that something is missing is just one more report. My view: that's a bait and switch, explaining the reports isn't explaining the thing. He goes: fine, then tell me what observation would tell those two apart. And I couldnt.

  I'm running a 90-minute session at a consciousness summer school in two weeks, about 24 people, half undergrad philosophy, half CS grad students (so half the room will try to build the mechanism instead of arguing about it). Design an activity where they run into that gap themselves — that's all I want them to come away seeing. Two structural things I want built in: (1) during the main phase nobody may say "conscious", "experience", "qualia" or "what it's like" — they have to invent their own word for whatever they're talking about, and we only map it onto the real vocabulary in the last 15 minutes; (2) there should be a second round where the mechanism gets upgraded so that it now also produces the conviction that something was left out, and the room has to argue about whether that closed the gap or just moved it up a level.

  Give me the setup, materials, rules, timeline and the debrief (including where exactly to name the two problems and let them use the real words). And be honest about three things: what will predictably go wrong the first time I run it and how to handle it; which part of the distinction the activity literally cannot stage, so I just have to say it out loud; and what would make you scrap the design — i.e. what you'd see happening in the room that would convince you it's teaching my friend's "it's all reports all the way down" conclusion rather than the difference between the two explanations, and what you'd change instead.
reasoning: |-
  We are designing a 90-minute session for a summer school on consciousness. The goal is to have participants experience the gap between explaining reports about consciousness and explaining consciousness itself (the "hard problem"). The session should avoid using standard terminology (like "consciousness", "qualia") until the end, and include an upgrade to the mechanism that produces the conviction that something is missing.

  Structure:
  - 90 minutes total.
  - About 24 participants: half undergrad philosophy, half CS grad students.
  - Two main phases: 
    1. Initial activity: design a mechanism that produces reports without using the banned words.
    2. Upgrade: modify the mechanism to also produce the conviction that something is missing, and then debate whether this closes the gap.

  Key rules:
  - During the main phase, banned words: "conscious", "experience", "qualia", "what it's like".
  - Participants must invent their own term for whatever they feel is left out.

  Timeline:

  1. Introduction (10 minutes)
     - Explain the goal: explore how we explain certain behaviors and reports, and the gap that might remain.
     - Present the rules: no banned words. They must invent a placeholder term (e.g., "X") for the thing they think is missing. Write the banned words on the board and cross them out.
     - Explain the activity: They will design a mechanism (in groups) that explains why a being (e.g., a robot) says the things it says about its internal states.

  2. Group Activity Part 1: Designing the Reporting Mechanism (25 minutes)
     - Divide into 6 groups of 4 (mix of philosophy and CS).
     - Task: Design a mechanism (could be a robot, AI, or biological system) that can report on its internal states and environment. For example, when the system sees red, it says "I see red" and can answer questions about it. The mechanism must also show stubbornness in defending these reports (e.g., when challenged, it insists).
     - Deliverable: Each group draws or describes the mechanism on a poster, including:
          - Input (e.g., sensory data)
          - Processing (how it forms reports and judgments)
          - Output (reports, including stubbornness when challenged)
          - They must label the "X" in their diagram if they think there's something missing beyond the mechanism.

  3. Group Presentations and Initial Discussion (20 minutes)
     - Each group gets 2-3 minutes to present their mechanism.
     - Focus on: How does the mechanism produce reports and stubbornness? Did they include an "X"? What is "X" in their terms?
     - Facilitator notes: Do not use the banned words. Ask probing questions: "Does your mechanism fully capture what is happening? Is there an 'X' that is not explained? How would you know if 'X' is there or not?"

  4. Upgrade Phase (15 minutes)
     - Introduce the upgrade: "Now, modify your mechanism so that it also produces the conviction that something is missing (the 'X') when the system is explaining itself. That is, when the system is asked about how it works, it not only reports on its internal states but also insists that there is an 'X' that the mechanism doesn't capture."
     - Groups have 10 minutes to modify their design and 5 minutes to prepare a short response to: "Does this upgrade explain the 'X'? Or does it just produce a report about the 'X', thereby moving the gap?"

  5. Debate (15 minutes)
     - Groups share their upgraded mechanism and their stance (gap closed or not).
     - Facilitator guides a whole-room debate: "Does adding the report about the missing thing actually explain the missing thing, or does it just produce another report?"

  6. Debrief and Vocabulary Mapping (15 minutes)
     - Reveal the banned words and map their invented term "X" to the standard vocabulary (consciousness, qualia, etc.).
     - Explicitly name the two problems:
          - The problem of explaining reports (easy problems)
          - The problem of explaining the thing itself (the hard problem)
     - Point out the gap: Even if we explain all the reports, including the report that something is missing, we might still feel that the thing itself (the subjective experience) is not explained.
     - Conclude by relating it to the initial argument: The friend's view is that explaining all reports (including the report of a gap) is sufficient. The opposing view is that there is an explanatory gap that remains.

  Predictable Problems and Solutions:
  1. Problem: Groups might struggle to avoid the banned words, especially philosophy students. 
     - Solution: Gently remind them and provide an example placeholder (e.g., "Let's call it 'flurg' for now"). Have a bell or buzzer for violations (make it fun).

  2. Problem: CS students might build overly complex mechanisms and lose the philosophical point.
     - Solution: Encourage simplicity. Ask them to focus on the functional aspects that lead to reports and then the feeling of a gap.

  3. Problem: Some groups might not see a gap at all (especially if they lean toward functionalism).
     - Solution: In the upgrade phase, force them to add the conviction of a gap. Then in the debate, have groups that see the gap challenge them.

  4. Problem: Time management – the activities might run over.
     - Solution: Strict timing. Have a timer visible. Cut off presentations if needed.

  What the Activity Cannot Stage:
  - The activity can show how we can design mechanisms that produce reports (including reports about a gap) but it cannot directly stage the subjective experience itself. That is, the participants can only talk about the mechanism and its outputs, not the first-person "what it's like". You must explicitly state: "The activity cannot make you experience the gap from the inside for the system you are designing. You are always in the position of an external observer. The gap is felt by the system itself, and we are trying to explain that feeling and whether explaining the feeling is the same as explaining the experience."

  When to Scrap the Design:
  - If the entire room concludes without dissent that adding the report of the gap closes the gap (i.e., they all become your friend), then the activity is teaching the opposite of the intended lesson.
  - To avoid this, during the upgrade phase, assign half the groups to argue that the gap is closed and half to argue that it isn't. Force a debate. Also, in the debrief, explicitly present the two views and challenge them to see the gap.

  Alternative if it fails:
  - Instead of building a mechanism, use a thought experiment with a pre-built scenario (e.g., a zombie or a robot that passes all tests but still lacks experience). But the design above is better because it's interactive.

  Materials:
  - Posters and markers for each group.
  - Timer.
  - Whiteboard for facilitator to write banned words and key points.

  Detailed Timeline:

  - 0:00-0:10: Introduction (explain rules, goal, and divide groups)
  - 0:10-0:35: Group Activity Part 1 (design reporting mechanism)
  - 0:35-0:55: Group Presentations and Initial Discussion (20 min, 3 min per group + 2 min Q&A per group? Actually 6 groups * 3 min = 18 min, plus 2 min transition)
  - 0:55-1:10: Upgrade Phase (15 min: 10 min work, 5 min prep for debate)
  - 1:10-1:25: Debate (15 min, structured by facilitator)
  - 1:25-1:30: Debrief and Vocabulary Mapping (5 min? Actually we have 5 minutes until 90 min, but we need 15 min so adjust:)

  Wait, 90 minutes total. Let me recast:

  - 0:00-0:10: Intro (10 min)
  - 0:10-0:35: Part 1 (25 min)
  - 0:35-0:45: First 3 groups present (10 min) [3 min each, 1 min transition]
  - 0:45-0:55: Next 3 groups present (10 min)
  - That's 20 min for presentation, then:
  - 0:55-1:10: Upgrade (15 min: 10 min work, 5 min prep)
  - 1:10-1:25: Debate (15 min)
  - 1:25-1:40: Debrief (15 min)

  But 0:00 to 1:40 is 100 minutes. So we must cut:

  Revised Timeline (90 min):

  - 0:00-0:10: Intro (10 min)
  - 0:10-0:30: Group Part 1 (20 min) [cut 5 min]
  - 0:30-0:45: Presentations (15 min, 2.5 min per group, no Q&A during, but facilitator asks one quick question per group)
  - 0:45-0:55: Upgrade design (10 min) [less time for upgrade]
