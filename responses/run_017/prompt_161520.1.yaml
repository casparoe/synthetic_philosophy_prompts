prompt: |-
  I'm in a small reading group — half ML people, half philsophy grad students — and we've been going round on decision theory for embedded agents for something like two years now, with zero movement. Concretely: one camp thinks causal decision theory (or more loosely "just do expected-utility maximisation against the best model you've got") is basically fine and that Newcomb-style cases are cooked-up philosopher's toys where the predictor is doing something no real environment does; the other camp thinks those one-shot cases are the whole point, because an agent that's part of the world it's reasoning about — with other agents, the training process, its own sucessors, maybe copies of it elsewhere, all modelling it better than it models itself — lives in exactly that structure, so you need something like functional decision theory or updatelessness. The CDT-ish side's stock move is that in those cases your action "isn't really the cause" of the good outcome, so taking the money is fine; the FDT-ish side's stock move is that causation-talk is a heuristic that quietly assumes you're outside the thing being predicted, and that heuristic is precisely what breaks when you're embedded. We all agree on the cases and on what each rule says about them. Nobody budges. My hypothesis, which I've started calling the predictor gap, is that the real dispute isn't about decision rules at all: it's a factual disagreement about whether environments actually contain predictors accurate enough for the gap between the rules to matter, wearing normative clothing — and under that, a verbal fight about whether "rational" means something like coherence-with-your-best-model or something like getting-more-of-what-you-want. (My ML friends add a third option: don't do decision theory, just train the policy and let the loss sort it out.)

  So: diagnose the stall rather than settling it. Is my hypothesis close, and where's it wrong — is the verbal/ substantive split where I think it is, are the sides mabye answering different questions under one heading (what to build vs. what to admire vs. what to blame), or is a hidden formal question doing the work, like whether an embedded agent's model can even be true of its own environment? Support the diagnosis with what each side actually says, not a survey of the theories — I've read the standard ones, and I can't chase references right now, so please no reading lists or links. Then, given your diagnosis, say what would actually count as progress: a distinction, a formal result, a reframing of the question, an empirical check on how predictable real agents are — or tell me honestly that nothing is likely to move it and why. Lead with your diagnosis in one sentence, then argue for it, and flag the part you're least confident in. Under 600 words. And if the premise is wrong — if the "predictor gap" isn't a real fault line, or if this is just stalled on definitions in a boring way — say that plainly instead of answering the question I asked.
reasoning: |-
  Hmm, the user describes a two-year stalemate in their reading group between CDT-ish and FDT-ish camps. They propose the "predictor gap" hypothesis: that the core disagreement is actually about whether real environments contain sufficiently accurate predictors to make Newcomb problems relevant, disguised as normative debate. They want me to diagnose the stall rather than resolve it.

  The key insight seems to be that both sides agree on the formal mechanics but not on applicability. The CDT camp dismisses predictors as unrealistic philosopher's toys ("cooked-up cases") while the FDT camp sees them as central to embedded agency ("exactly that structure"). This maps perfectly to the predictor gap hypothesis - it's about empirical expectations, not decision theory per se.

  I notice the ML camp's position ("just train the policy") actually reinforces this diagnosis. Their indifference suggests they see the entire debate as irrelevant to practical system-building, which only makes sense if they too doubt predictor realism.

  The normative layer ("rationality") seems secondary here. When CDT says "fine" to taking the money, they mean it's rational given their empirical assumptions; when FDT insists on one-boxing, they mean it's rational given theirs. The vocabulary of rationality is doing double duty for both "coherence" (CDT) and "outcome optimization" (FDT), but that's likely symptomatic rather than causal.

  Where this might be wrong: perhaps there's a deeper metaphysical split about whether "causation" can even be defined for embedded agents. But the user explicitly says both sides agree on what each rule says in cases - suggesting formalism isn't the issue.

  For progress: since this is fundamentally empirical, they need to pressure-test predictor realism. Could examine predictability of real agents (e.g. how well LLMs predict human actions), or analyze whether ML training creates implicit predictors. A formal result showing when predictor accuracy thresholds make FDT dominate might help, but may just get dismissed by CDT as unrealistic modeling.

  Honestly, movement seems unlikely. The camps have entrenched empirical priors: ML folks see predictors as implausible, philosophers see them as constitutive. This might require a paradigm case where predictor-like dynamics emerge in ML systems - something that forces reconsideration of "toys" versus "structure."
answer: |-
  ### Diagnosis in one sentence
  The core stall stems from an empirical disagreement about predictor prevalence in real embedded systems, masked as normative disagreement about rationality, with both sides using "rational" to mean different things (coherence vs outcome optimization) while talking past the predictor realism question.

  ### Argument for Diagnosis
  - **CDT-ish camp's realism focus**: When they say Newcomb cases are "cooked-up toys," they’re asserting that no real environment (e.g., ML agents in deployment) contains predictors with the godlike accuracy needed to make CDT "fail." Their "isn’t really the cause" rebuttal isn’t just metaphysical—it’s a claim that real-world correlations between action and outcome *always* trace to physical causation, not acausal prediction. For them, "rational" means *internally consistent reasoning given your best causal model*.
    
  - **FDT-ish camp's embeddedness focus**: Their insistence that "you live in exactly that structure" is an empirical claim: real agents (e.g., AIs facing adversarial testing, or agents with clones) *do* encounter systems that model them precisely. When they dismiss causation as a "heuristic," they’re arguing that in high-predictor-accuracy regimes, *outcome optimization* defines rationality—so CDT’s coherence is myopic.

  The ML camp’s "just train it" stance reinforces this: they implicitly reject *both* formalisms as irrelevant to learned policies, seeing the debate as empirically empty.

  ### Why Predictor Gap Explains the Stall
  1. **Empirical stalemate**: Neither side engages the other’s factual claim. CDT demands proof of near-perfect predictors in practice; FDT points to abstract embedded scenarios without establishing their real-world frequency.
  2. **Hidden verbal split**: "Rational" acts as a proxy. CDT equates it with procedural soundness ("coherence-with-model"), FDT with material success ("getting-what-you-want"). This lets both sides "agree" on cases while disagreeing fundamentally on what makes a choice valid.

  ### Least Confident Element
  I’m least confident that the normative/verbal layer is *merely* a mask. It might be independently entrenched: CDT’s camp could genuinely value causal reasoning as intrinsically rational, regardless of outcomes.

  ### What Counts as Progress
  1. **Pressure-test predictor realism**: Debate concrete examples (e.g., does an RL agent’s value network "predict" its own actions during training? Do auction algorithms or cybersecurity tools face Newcomb-like incentives?). If no real cases hold up, FDT’s urgency fades.
  2. **Formalize the gap**: A theorem showing *how accurate* a predictor must be for FDT to outperform CDT in a given environment class. This forces empirical grounding.
  3. **Reframe "rationality"**: Explicitly split the question: "What principle should an *idealized* agent follow?" (normative) vs. "What works for *real* embedded systems?" (empirical/engineering).

  ### Why Movement Is Unlikely
  - **Priors are entrenched**: ML skeptics see predictors as sci-fi; philosophers see embeddedness as fundamental. Without new evidence or a shared test case, neither will shift.
  - **No stakes**: This is abstract theory. Until someone builds an agent that suffers tangible loss from "wrong" decisions (e.g., loses money in a prediction market), inertia wins.

  **Bottom line**: Your hypothesis is correct—resolve the empirical disagreement or abandon "rationality" as the battleground.
