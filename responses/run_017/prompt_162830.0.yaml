prompt: |-
  I sit on the animal-welfare committee of a large research and food-systems funder. Our job is to decide which taxa attract welfare conditions in the projects we pay for: husbandry standards, killing-method requirements, and, in a few cases, a requirement that the project not proceed at all. We have no statutory remit and no case law to lean on, only our own past decisions, and I would like you to treat that track record as the thing to be extrapolated from.

  The precedents, in order:

  1. Farmed finfish: full coverage.
  2. Cephalopods used in laboratory experiments: full coverage, although the numbers of animals involved are small. The stated reason was flexible learning plus a large, centralized, integrative nervous system.
  3. Decapod crustaceans in capture fisheries and processing: full coverage. The decision cited nociceptive and analgesic-response evidence, but it also said outright that the number of animals affected mattered to the verdict.
  4. Adult honeybees and bumblebees in laboratory experiments: no coverage. The stated reason was that insect behavioural flexibility is explained by modular, non-integrated processing, so there is no candidate unitary subject whose welfare could be at stake.
  5. Drosophila in funded laboratories: no coverage, on the same modularity rationale; the committee recorded that it saw no relevant difference from the bee case.
  6. Soil nematodes and other meiofauna affected by funded agricultural projects: no coverage, notwithstanding that the numbers there run many orders of magnitude beyond the decapod case. The minute records that numbers alone do not generate obligations.

  The new case is a scale-up proposal to rear roughly a billion crickets a year for food and feed, killed by heat or mechanical means at the adult stage. The evidence available to us: nociceptor-like cells, some associative learning, motivational trade-offs in a handful of paradigms, and no agreed anatomical integrator. Committee members' credences that an adult cricket has valenced states run from about one percent to about twenty percent. Two complications have come up in discussion and I want them addressed rather than set aside. First, whether the relevant credence should be assigned per taxon or per individual, and whether credences across insect taxa can be treated as independent when they rest on largely the same evidence base: if not, then aggregating expected disvalue across taxa may double-count one and the same uncertainty. Second, one member argues that if the segmental ganglia of an insect each support a separate locus of experience, then the number of welfare subjects per animal is greater than one, which multiplies any scale estimate rather than undermining it; another replies that this only shows the notion of a subject has stopped doing work at that level of description.

  What should we decide, if we want to be consistent with ourselves? Please (1) set out the two or three candidate rules that fit all six precedents equally well; (2) give a compact table with one row per rule, showing what it predicts about the crickets and about the diagnostic case you propose in (4); (3) identify the closest analog among the precedents, give your recommendation with the reasons for preferring that rule, and state plainly what principle we would be adopting if we went the other way; (4) name the single further case — a taxon, a life stage, or a setting — that would best separate the rules, and say why it separates them. If part of our disagreement turns out to be verbal rather than substantive, say which part and what reformulation would dissolve it. Keep the entire answer under 700 words.
reasoning: |-
  Alright, let me tackle this complex animal welfare committee decision. The user needs a framework to consistently apply their precedents to cricket farming, while addressing two key complications about credence aggregation and unitary subjects.

  First, I need to distill the patterns from their six precedents. The finfish, cephalopod and decapod cases show coverage when there's either (1) evidence of integrated cognition or (2) strong nociception plus large scale. The bee, drosophila and nematode cases show no coverage when there's modular neural architecture or when scale alone isn't sufficient.

  The cricket case sits in a gray area - some learning evidence but no clear integrator, at massive scale. The committee's credences about valenced states (1-20%) suggest genuine uncertainty. Those two complications are crucial: whether to aggregate credences across taxa (avoiding double-counting uncertainty) and whether segmented ganglia imply multiple subjects per insect.

  I consider three possible rules that fit all precedents:
  1) The "integrator rule" requiring demonstrable CNS integration
  2) The "credence-scale rule" multiplying probability by numbers
  3) The "precautionary rule" covering any credible evidence of valenced states

  For the cricket case: 
  - Rule 1 would deny coverage (like bees)
  - Rule 2 might justify coverage given massive numbers
  - Rule 3 would lean toward coverage

  The nematode precedent (no coverage despite huge numbers) weakens Rule 2, while the committee's stated view that "numbers alone don't generate obligations" supports Rule 1. The cephalopod decision (small numbers but coverage) suggests integration trumps scale.

  The key disconnect seems to be about what constitutes a welfare subject. If ganglia create multiple subjects, that actually strengthens the scale argument rather than weakening it. This might be verbal - we could reframe as "valenced state generators" instead of "subjects."

  For a diagnostic test case, embryonic vertebrates are perfect. Rules 1 and 2 would deny coverage (no integrator/sentience), while Rule 3 might cover them based on precaution.

  Ultimately Rule 1 (integrator requirement) seems most consistent with their precedents, especially given how they treated bees and nematodes. Adopting Rule 2 would mean accepting that scale can override weak evidence, which they've explicitly rejected before.
answer: |-
  Here are candidate rules fitting all precedents, applied to the cricket case:

  **(1) Candidate Rules**  
  Rule A (Integration Threshold): Full coverage only with evidence of a *centralized integrator* for valenced states (nervous system or equivalent). Scale irrelevant.  
  Rule B (Credence-Scale Product): Coverage if expected disvalue (credence × number affected) exceeds a threshold. Modularity reduces credence *per individual*, not per ganglion.  
  Rule C (Precautionary Modularity Exclusion): No coverage if neural architecture is demonstrably non-integrating *and* evidence for valence is weak. Scale irrelevant.  

  **(2) Predictions**  

  | Rule          | Cricket Rearing (1B/yr) | Diagnostic Case: Vertebrate Embryos (10^12/yr) |
  |---------------|--------------------------|-----------------------------------------------|
  | **A (Integration)** | No coverage (no integrator) | No coverage (no integrator) |
  | **B (Credence-Scale)** | Coverage (high expected disvalue: 0.1 credence × 1B) | No coverage (near-zero credence) |
  | **C (Precautionary Exclusion)** | No coverage (modular + low-evidence) | Coverage (non-modular, precaution applies) |

  **(3) Recommendation & Reasoning**  
  **Closest analog:** *Drosophila* (Precedent 5). Both lack an integrator and show limited behavioral evidence.  
  **Recommendation:** Adopt **Rule A (Integration Threshold)**.  
  - **Why:** Precedents 4-6 explicitly reject scale-based arguments (nematodes: "numbers alone do not generate obligations"). Cephalopods (Precedent 2) were covered for integration, not scale. Rule A aligns with the committee’s rejection of modular systems (bees, flies) regardless of numbers.  
  - **Principle if adopting Rule B:** You would prioritize aggregate expected harm over biological criteria, contradicting the nematode precedent where scale was deemed irrelevant.  

  **(4) Diagnostic Separator Case**  
  **Case:** **Early vertebrate embryos** (e.g., zebrafish < 24h post-fertilization).  
  - **Why it separates:**  
    - Rule A: No coverage (no neural integrator).  
    - Rule B: No coverage (near-zero credence).  
    - Rule C: *Coverage* (non-modular lineage + precaution over unresolved valence potential).  
  This exploits Rule C’s asymmetry: it excludes insects but may cover non-modular taxa with weak evidence.  

  **Verbal Disagreement Dissolution:**  
  The dispute over "subjects per animal" (ganglia as separate loci) is semantic. Reformulate as: "Does the evidence suggest *any valenced state occurs* in the organism?" If ganglia operate independently, the *per-individual* credence of valence remains 1–20% (not multiplied), but the *intensity* of experience might be fragmentary. Precedents 4–6 treated modularity as reducing confidence in valence, not multiplying subjects.  

  **Cricket Decision:** Consistent with Rule A and *Drosophila* precedent: **no coverage**.
