  6.  **Ambiguous Envoy:** The envoy places **hand** and **ground** together ("that final **hand** just one more cipher, charged with borrowed **cause**?"). Crucially, it asks the unresolved question: Is this physical action (**hand**) on the real world (**ground**) finally settling the debt ("find **ground**"?), or is it merely another abstracted event ("cipher") interpreted using the same borrowed definitions ("borrowed **cause**")? The "charged" pun hints at potential energy but leaves it unspent. The robotics failure mode (misinterpreting physical intervention as just another signal) is clear, while the poets get the structural and linguistic tension.
  7.  **Tone & Style:** Modern, direct language ("chip", "log file", "sensors", "reboot", "model", "engineer"). No archaic filler. Designed for clear reading aloud. Under a page.
  8.  **Starting Points:** Follows your suggestion: Stanza 1 tries to ground **red** in an object (the wrench). Stanza 2 immediately addresses **cause** ("root cause"). The form dictates the progression from there.

