prompt: |-
  I serve on the Algorithmic Priorities Board of our city, a nine-member body that must approve, before each fiscal year, the objective that the Office of Data and Evaluation uses to rank capital projects — road resurfacing, sidewalk and transit-shelter accessibility work, tree-canopy and park renewal, stormwater retrofits — in the model that allocates the participatory capital budget across districts. Our vote is binding and must be recorded with written reasons.

  For the coming fiscal year the Office has asked us to replace the current ranking rule, which weights residents' stated requests with a population adjustment, with a two-stage target its memo calls Community Volition. Stage 1 elicits substantive priorities from a stratified sample of residents. Stage 2 extrapolates them: a budget-literacy briefing corrects factual error about what the capital budget can legally be spent on; respondents then revise their rankings after reading anonymized arguments written by other respondents, which is meant to stand in for deliberation; and a vendor-supplied language model runs a coherence pass that identifies conflicts among a respondent's own answers and resolves them. Staff argue that raw responses encode residents' adaptation to long-standing underinvestment in some districts, misinformation about how much of the budget is already committed, and the turnout advantage of districts that already participate most.

  The Board is split. Three of us hold that the extrapolated target is unfalsifiable in the specific sense that it lets staff and their vendor substitute their own judgment for residents' and describe the result as the residents' own. Two hold that any procedure which stops at stated preference simply launders the status quo through a survey. One member has circulated a note urging us to consider a narrower variant, fact-corrected stated preference, which would correct only demonstrable factual error about the budget and would attempt neither simulated deliberation nor coherence correction. I have undertaken to draft the decision memo the Board will vote on in three weeks, before the vendor contract's sixty-day renewal window closes.

  Please write that memo, addressed to the Board.

  It should state a bottom line — approve Community Volition, reject it, or approve it in a restricted form, and if the last, specify precisely which stage survives — and then defend it. Along the way it should deal with the following, which are the matters the Board is actually arguing about.

  Staff's own pilot is the source of our difficulty rather than a resolution of it. Under their protocol the top-ranked district priority shifted from arterial road resurfacing to sidewalk and transit-shelter accessibility; staff attribute the shift to the briefing and the deliberation stage. But the pilot also showed that the ordering was unstable: a longer briefing and a stricter coherence rule each changed the ranking substantially, and where respondents proved to hold intransitive pairwise preferences the vendor's cycle-breaking rule did visible substantive work, in one case reversing a district's stated first and third priorities. I want the memo to say what the Board should require about the stability of the extrapolated target before it can be treated as the residents' will rather than as an artifact of the protocol the vendor happened to choose, and to say how stable is stable enough, given that we must decide in three weeks rather than in principle.

  It should then address legitimacy rather than accuracy: whether a target that no resident can reconstruct or contest without a statistics team can ground a public and binding ranking, and whether anything short of abandoning extrapolation would repair that defect. One option some of us have discussed is a retrospective endorsement check, in which a fresh sample is shown both the stated-preference ordering and the extrapolated ordering, is told how each was produced, and is asked which it would endorse; the Board would then treat low endorsement of the extrapolated ordering as a reason not to deploy it. Say whether you recommend that, what threshold you would set, and why that test bears on the question we face rather than merely on whether residents like the outcome.

  It should also settle a scope question we have been avoiding. The projects that the extrapolated target promotes are disproportionately ones whose beneficiaries are children, elderly residents, people with disabilities, and people who will move here later; the sample that generates the target is current adult residents. Say whether the relevant population for the extrapolation should include future residents, and whether that is a decision for the Board to make explicitly or one that may be left to the protocol.

  Finally, give the strongest argument against your own recommendation a full paragraph, in the form the member who most disagrees with you would put it, and state what evidence, if it came back from the pilot, would lead you to change your position.

  The memo is for the public record. It should rest on argument alone, cite no literature and recommend no reading, and be intelligible to a Board member who has never encountered the philosophical debate about idealized preferences; it may nonetheless engage the extrapolated-volition framing from AI-alignment work if doing so helps. Include a dated implementation schedule with the decision points between now and the fiscal year, and pre-registered criteria for counting the pilot a failure. Aim for roughly 1,200 words.
reasoning: |-
  Okay, the user wants me to draft a decision memo for an Algorithmic Priorities Board regarding a new ranking system called Community Volition. This is a complex policy decision with multiple layers.

  First, I need to understand the context. The Board must approve the objective for ranking capital projects. The current system weights resident requests with population adjustment. The proposed Community Volition has two stages: gathering priorities from a stratified sample, then "extrapolating" them through budget literacy briefings, simulated deliberation, and AI coherence checks.

  The Board is deeply divided. Three members oppose it as unfalsifiable, two support moving beyond raw preferences, and one suggests a middle ground (fact-corrected stated preference). The pilot data shows instability - different briefing lengths and coherence rules changed outcomes significantly. The memo needs to address four key issues: protocol stability, legitimacy (can residents contest the result?), population scope (should future residents count?), and include a strong counterargument.

  For the recommendation, I'm considering the middle path - approving only Stage 1 with fact-correction. This addresses the main concerns while improving on the status quo. The instability in the pilot is too significant to ignore, and the "extrapolation" steps seem to inject too much vendor influence. 

  On stability, I'll propose requiring that protocol variations produce consistent top-three rankings, with documentation of how sensitive the model is to changes. For legitimacy, the retrospective endorsement check seems valuable but not decisive - I'll suggest it as supplementary with a 60% threshold. Regarding scope, I'll state that the Board must explicitly decide to include future residents rather than leaving it to the protocol.

  The strongest counterargument would focus on how this maintains existing inequities by not correcting for misinformation or participation gaps. If new pilot data showed that without extrapolation, underinvested districts remain systematically disadvantaged, that might change my position.

  For implementation, I'll outline a tight timeline: Board vote in 3 weeks, then if approved, rapid vendor adjustments, new pilot by mid-May, endorsement check in June, with pre-registered failure criteria like <60% endorsement or inconsistent top-three rankings across protocol variations. This balances rigor with the contractual deadline.
answer: |-
  **MEMORANDUM**  
  **TO:** Algorithmic Priorities Board  
  **FROM:** [Your Name/Title], Drafting Member  
  **SUBJECT:** Recommendation on "Community Volition" Protocol for FY Capital Project Ranking  
  **DATE:** April 25, 2024  

  ---

  ### **Bottom Line Recommendation**  
  **Approve a restricted form of the Office’s proposal:** Implement **Stage 1 (Stratified Sampling)** and the **fact-correction element of Stage 2**, but **reject** the simulated deliberation (anonymized arguments) and AI coherence-correction components. The objective for project ranking shall be **"Fact-Corrected Stated Preference"** (FCSP).  

  ---

  ### **I. Rationale for Restricted Approval**  
  The Board’s mandate is to approve an objective that translates resident input into a fair, transparent, and actionably legitimate ranking system. Community Volition (CV) aims to correct genuine deficiencies in raw stated preferences (e.g., misinformation about budget constraints, historical inequities). However, its extrapolation stages introduce unacceptable instability and opacity. FCSP preserves CV’s core corrective aim—addressing *demonstrable factual errors* about budget legality and commitments—while avoiding the procedural risks that render CV’s "volition" unverifiable as the residents’ own will.  

  ---

  ### **II. Addressing Board Concerns**  
  #### **A. Stability of the Extrapolated Target**  
  The pilot data reveals that CV’s output is highly sensitive to protocol design:  
  - Longer budget briefings altered district rankings.  
  - Stricter AI coherence rules overrode resident priorities (e.g., reversing 1st/3rd place rankings).  
  - Vendor discretion in resolving intransitive preferences substantively shaped outcomes.  

  **Required Stability Threshold:** For any protocol to be treated as reflecting residents’ will—not vendor choices—it must demonstrate **consistency in the top three district priorities** under minor, realistic variations in briefing length (±15%) and coherence rules (±1 standard deviation in vendor’s sensitivity setting). The pilot showed CV fails this test. FCSP, by contrast, anchors outputs to *verified resident inputs* post-fact-check, minimizing protocol-dependent variance.  

  **Practical Timeline:** With only three weeks until the vendor-contract deadline, we lack time to test CV’s stability across parameters. FCSP is operable now; its fact-correction can be audited against budget statutes, ensuring stability through transparency.  

  #### **B. Legitimacy of the Target**  
  A ranking system must be **publicly contestable** to bind districts. CV’s output—shaped by AI coherence checks and synthetic deliberation—is a black box: no resident can reconstruct how their input became the "community volition." This violates procedural legitimacy.  

  **Retrospective Endorsement Check:** We recommend this as a **supplementary validation** for FCSP (not CV), with a threshold of **≥60% endorsement of the FCSP ranking over raw stated preference** in a fresh sample. This tests whether fact-correction *resonates* as a legitimate improvement—not whether residents "like" outcomes. If endorsement falls below 60%, the Board should revert to the current system.  

  *Why 60%?* It signals clear majority acceptance of the correction’s rationale while acknowledging dissent. Crucially, FCSP’s fact-correction is transparent (e.g., "The budget cannot fund new transit lines; only repairs" is verifiable), making endorsement meaningful. CV’s complexity divorces endorsement from comprehension.  

  #### **C. Scope of the Relevant Population**  
  CV prioritizes projects benefiting children, the elderly, disabled residents, and future inhabitants. However, the sample only includes **current adult residents**.  

  **Board’s Explicit Decision:** The target population must be defined by the Board, not the protocol. We recommend:  
  - **Include future residents** in the objective’s scope, as capital projects span decades.  
  - **Exclude non-resident beneficiaries** (e.g., commuters) to align with our statutory duty to residents.  

  FCSP can achieve this by weighting current residents’ fact-corrected preferences by projected district growth. CV’s opaque extrapolation could implicitly weight future residents without accountability.  

  ---

  ### **III. Strongest Argument Against FCSP**  
  *(As articulated by proponents of full Community Volition)*  
  "FCSP is a surrender to entrenched inequity. By retaining raw preferences—merely scrubbed of ‘factual errors’—it ignores how historical disinvestment warps resident expectations. Districts accustomed to neglect under-prioritize long-term needs (e.g., stormwater retrofits) because they’ve internalized futility. The pilot proved this: without simulated deliberation, accessibility projects sank below road resurfacing. FCSP also fails to correct for uneven civic participation, letting high-turnout districts drown out marginalized voices. We are not laundering the status quo; we are using expert tools to *reveal* what residents would choose if fully informed and coherent. Rejecting extrapolation abandons our duty to advance justice for the vulnerable."  

  **Evidence That Would Change My Position:**  
  If the Office demonstrated—using the current pilot or a new one—that **without simulated deliberation/coherence-correction, districts with severe historical underinvestment *systematically* deprioritize projects essential to their own long-term welfare** (e.g., rejecting flood defenses despite high risk), *and* that this deprioritization **correlates directly with factual misconceptions corrected in CV’s briefing**, I would support limited deliberation. However, this must be proven *before* adoption, not retroactively.  

  ---

  ### **IV. Implementation Schedule**  
  | **Date**          | **Milestone**                                                                 | **Decision Point**                                  |  
  |-------------------|------------------------------------------------------------------------------|----------------------------------------------------|  
  | May 15, 2024      | Board vote on this memo                                                      | Approve FCSP, CV, or alternative.                  |  
  | May 22, 2024      | Office/vendor adjusts protocol to FCSP (fact-correction only)                | Confirm compliance with Board directive.           |  
  | June 5, 2024      | Run revised FCSP pilot in 3 diverse districts                                | Pre-registered failure criteria (see below).       |  
  | June 19, 2024     | Retrospective endorsement check (FCSP vs. raw)                              | If <60% endorse FCSP, revert to current system.    |  
  | June 26, 2024     | Finalize ranking rules for FY budget model                                   | Office publishes objective & validation report.    |  
  | July 1, 2024      | FY budget model deployment                                                   | N/A                                                |  

  **Pre-Registered FCSP Pilot Failure Criteria:**  
  1. **Fact-correction instability:** Top 3 district priorities shift >50% under briefing length variations (±15%).  
  2. **Legitimacy deficit:** <60% endorsement of FCSP vs. raw preference in check.  
  3. **Scope violation:** Failure to incorporate Board-defined population (e.g., future residents).  

  ---

  ### **V. Conclusion**  
  Community Volition’s ambition to move beyond adaptive preferences is commendable but premature. Its extrapolation stages substitute vendor judgment for resident voice under the guise of coherence, producing unstable and illegible results. Fact-Corrected Stated Preference offers a defensible middle path: it corrects provable errors distorting resident input while preserving transparency and stability. Coupled with a retrospective endorsement check and a clear population scope, FCSP meets our standard for legitimate, binding prioritization. I urge the Board to approve this restricted form.  

  **Recommendation:**  
  ☑ **APPROVE** Fact-Corrected Stated Preference (Stage 1 + Fact-Correction Only)  
  ☐ Reject Community Volition  
  ☐ Approve Full Community Volition  

  ---  
  **END MEMO**  
  *(Word count: 1,190)*
