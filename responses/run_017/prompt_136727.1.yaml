prompt: |-
  I have spent twenty-two years writing a sequence of nine novels whose central figure is a man called Gabriel Sark, and a clause in an option agreement has at last forced me to answer a question I have been avoiding since book three: what makes a fictional character in one version of a story the same character as a character in another? It is plainly not the sum of the sentences in which he appears, because I have watched that sum be replaced almost completely whilst remaining certain — certain that my readers are certain too — that it was Sark throughout. It is not simply the name either, because I have a case below in which the name stays exactly where it was and I want to say the character underneath it has been exchanged for a different one.

  I set out my verdicts below as a working novelist rather than as a philosopher, and I should like a principle, or if no single principle will do, the smallest set of candidates, that captures them — or that tells me which of them I must give up. Please do not supply a bibliography or citations; I can find those myself. What I want is the shape of the account.

  1. Drift. Across the nine books every concrete thing asserted about Sark in book one has been replaced or flatly contradicted: eye colour, birthplace, parentage, profession, century, even the spelling of his Christian name. Verdict: one character throughout, and the contradictions are my errors rather than evidence of two men.

  2. The swap. In the galley proofs of book six I reassigned everything — scenes, memories, relationships, traits — that had belonged to Aldous Vane to Beatrix Munn, and vice versa, leaving the names attached to the same physical descriptions. Verdict: I did not rewrite either of them; I swapped their lives. The character called Vane is now living Munn's life, and readers who knew the earlier books feel this immediately, even though no sentence about either of them is new.

  3. Another hand. Suppose that after my death a novelist I admire completes a tenth book from my notes: every established fact preserved, the name preserved, the prose unmistakably not mine. Verdict: not Sark. A tribute, an impersonation, a very good piece of fan work — but not the same character, and I should want the estate to resist it.

  4. Translation. The French edition renames him, moves Bristol to Marseille, and refashions every sentence. Verdict: the same character, obviously, and I should be puzzled by anyone who doubted it.

  5. The promotion. In revision I deleted my protagonist Ivor entirely and gave all of Ivor's scenes, decisions and plot function to a minor character, Ruth, who keeps her own name and her own remembered past. Verdict: I have not given Ivor's part to Ruth. I have deleted Ruth and dressed Ivor in her name; the thing that walks through the last third of the book wearing Ruth's name is Ivor. My readers disagree with me here, and say that Ruth is Ruth and always was.

  6. Fission. In book eight I reveal that the narrator has been conflating two men. Verdict: both were present from book one. I did not create a character in book eight; the earlier books were ambiguous between them, and book eight says what they were ambiguous about.

  Two of these I know to be in trouble together. One and two involve changes of the same magnitude — the whole textual basis replaced — yet I call one persistence and the other an exchange. Worse, I am fairly sure that if I had made all the changes of case one in a single revision of book two rather than across nine books, I should have said I had written a different man and given him the same name; and I can see no reason why the rate of change should matter to what a character is, any more than it matters whether the ship's planks are drawn out one at a time or all at once, or whether the old planks are fished out of the water and rebuilt into a rival vessel.

  The rule of thumb I have been using is this: a character survives a change just in case the narrative role he occupies — the work he does in the plot and in the reader's attention — is continuous across it, and the change was made either by me or by someone whose licence to alter the text traces back to me and who adds nothing of their own. Please test that rule against all six cases, repair it if it can be repaired, and tell me if it can be replaced by something cleaner that overturns one of my verdicts instead. In particular I should like to know how the second clause is meant to tell the translator from the continuator, and whether the first clause survives case six, where a single role turns out, retrospectively, to have been two.

  Then two cases I have not settled. In a drawer I have ninety pages of an abandoned novel whose protagonist is called Halloran; in the book now on my desk a man called Seddon has been given several of Halloran's scenes almost verbatim, including a childhood memory of a red bicycle. Is Seddon Halloran under a new name, or a different man who has inherited some scenes? And: if my estate licenses a prequel written by someone who has read only the published novels and none of my notes, is the boy in that book Sark as a child, or merely a character constructed to resemble him?

  Please state the resulting principle precisely, say which of my cases motivates each clause, give its verdicts on the two unsettled cases, and be honest about which of my verdicts it cannot accommodate and what it would cost me to abandon them. Finally, since a solicitor is waiting on an answer: whatever account you settle on, what would it imply for how the words "the character Gabriel Sark" ought to be defined in a contract, and is there any account you would trust to do that work?
reasoning: |-
  Hmm, the user has presented a fascinating philosophical-literary dilemma about character identity across multiple novels. They're a novelist with 22 years of work on a nine-book series featuring Gabriel Sark, now forced by contract terms to define what makes a character "the same" across different versions. This isn't just academic - real legal implications hang on it.

  The core tension emerges from six carefully described cases where intuitive character identity judgments seem contradictory. For example, gradual "drift" of all attributes still feels like Sark (Case 1), but swapping character essences while keeping names feels like identity theft (Case 2). The user even admits their rule of thumb - about narrative role and authorized changes - might not hold water.

  What makes this thorny is how layered the problem is: There's the metaphysical layer (what constitutes character identity), the reader-experience layer (how audiences perceive continuity), and crucially, the legal layer (how contracts should bind future interpretations). The mention of solicitors waiting makes this last part urgent.

  The user's proposed rule has two parts: narrative role continuity + authorized change source. Testing it against their cases reveals weaknesses: It fails to explain why translation (Case 4) preserves identity despite radical textual changes, while another author's continuation (Case 3) doesn't - both involve external agents. It also struggles with retrospective fission (Case 6) where one role becomes two.

  For the unsettled cases: Seddon inheriting Halloran's scenes feels like a new character borrowing traits (not identity) because there's no narrative thread connecting them. But the licensed prequel could be "Sark-as-child" if it respects established narrative essence, though it's ontologically weaker than the original.

  Legally, the cleanest contract definition might be: "the character as materially presented in the nine published novels by [Author], including all authorized translations." This avoids metaphysical quicksand while protecting the user's creative authority. It explicitly excludes continuations, prequels, or derivative works unless authorized.

  The user will likely resist abandoning any verdicts since each feels viscerally correct to them as creator. But philosophically, Case 5 (Ruth/Ivor) might need concession - if readers insist Ruth persists despite absorbing Ivor's role, that suggests narrative role isn't solely author-defined. That's the price of consistency.
answer: |-
  Based on your cases and the need for a contract-worthy definition, the principle capturing your verdicts (with one exception) prioritizes **Narrative Essence under Authorial Authority**:

  **Principle:**
  A character C in version X is the *same character* as character D in version Y if and only if:
      1.  **Continuity of Narrative Essence:** C and D occupy the same core narrative role within their respective story structures. This role encompasses:
          *   Their fundamental dramatic function (protagonist, antagonist, catalyst, foil).
          *   Their essential relationships to the plot's central conflict and themes.
          *   Their defining psychological core or "soul" as the authorial intent manifests it through actions, choices, and impact on the story world, even if surface details change.
      2.  **Authorial Lineage:** The presentation of D in version Y results directly from the creative authority of the original author (or their explicitly authorized delegate) acting upon the character C *as originally established*. This lineage permits alteration but not autonomous creation.

  **Clause Motivation & Verdicts:**

  1.  **Continuity of Narrative Essence (Cases 1, 2, 4, 5, 6):**
      *   *Case 1 (Drift):* Sark's core role (protagonist, driving force of the plot, thematic avatar) persists despite surface changes. **Verdict Supported.**
      *   *Case 2 (Swap):* Vane and Munn swap their *entire narrative essences* – their functions, relationships to plot/themes, psychological cores. The names/labels stayed, but the beings inhabiting those narrative positions were exchanged. **Verdict Supported.**
      *   *Case 4 (Translation):* Sark's core narrative role is preserved. The changes are superficial adaptations within the *same* core character under authorial sanction (implied by licensing). **Verdict Supported.**
      *   *Case 5 (Promotion):**Conflict.* Your view: Ivor's narrative essence (his plot function, role) is implanted into Ruth's name. Reader view: Ruth inherits the function but retains her distinct essence. **Principle favors *your* verdict:** Ruth's *original* narrative essence (minor character) is obliterated and replaced by Ivor's core role/function. The character walking around *is* Ivor's essence in Ruth's name-shell. (See "Cost" below).
      *   *Case 6 (Fission):* The single prior narrative role is revealed to have *always* been occupied by two distinct essences. Book eight doesn't create, it clarifies the ambiguity inherent in the earlier presentation. Both new characters claim continuity to *aspects* of the original ambiguous role. **Verdict Supported.** The principle handles this by focusing on the narrative essence *as understood in each version*. In books 1-7, one essence was ambiguously presented; in book 8, two distinct essences are clarified.

  2.  **Authorial Lineage (Cases 3, 4, and distinguishing Translation/Continuation):**
      *   *Case 3 (Another Hand):* The new author creates Sark based on *their interpretation* of your notes, adding their own creative vision. There is no direct lineage of *alteration* by *you*; it's a new creation inspired by, but not stemming from, your active authorial continuation. **Verdict Supported.** The translator (Case 4) acts as *your* delegate to *adapt* Sark into French; the continuator acts as a *new creator* inspired by Sark.
      *   *Case 4 (Translation):* Implicitly authorized by you/licensing, acting as your delegate to *adapt* the existing Sark. **Verdict Supported.** The lineage is traced back to your authority via the license.

  **Unsettled Cases:**

  1.  **Seddon vs. Halloran (Scene Inheritance):** Seddon is **a different man who has inherited some scenes/memories.** There is no *continuity of narrative essence* across separate, abandoned works. Halloran's narrative essence died with the abandoned novel. Seddon exists in a distinct narrative universe. The scenes/memories are borrowed elements, not evidence of the same character essence persisting.
  2.  **Licensed Prequel (No Notes):** The boy is **merely a character constructed to resemble Sark.** Without access to your private authorial intent (the notes), the new author constructs a *plausible origin* based on the *published* Sark. This is an interpretation and new creation fitting the published narrative essence, not a continuation of *your* authorial lineage shaping the character *from* its origin point. It lacks the direct lineage of alteration stemming from your authority over the character's development.

  **Cost of the Principle:**

  *   **Case 5 (Promotion) - Reader Verdict:** The principle forces you to insist **your verdict is correct** (Ruth *is* Ivor renamed). It cannot accommodate the reader view that Ruth persists while absorbing Ivor's function. Abandoning *your* verdict here would require weakening the "Narrative Essence" clause to allow a character's core essence to be *radically replaced* by another's while retaining identity under the same name, which would undermine Case 2 (Swap) where you insist essence *must* define identity over name. This is the core tension you identified between 1/2 and 5. The principle prioritizes the essence swap in Case 2, forcing the same logic onto Case 5.

  **Contractual Definition:**

  The principle translates cleanly to a contract:

  > "**'The character Gabriel Sark'** means the character originating in and as materially presented by [Your Name] within the nine novels comprising [Series Title] (the 'Original Works'), including any authorized translations thereof, whose core narrative role, function, and psychological essence as established and developed by [Your Name] across the Original Works defines his identity. This definition excludes any interpretations, continuations, prequels, sequels, or derivative works created by third parties, regardless of licensing, which are deemed to feature distinct characters inspired by, but not identical to, the character Gabriel Sark as defined herein."

  **Why this works for a solicitor:**

  1.  **Objective Basis:** It anchors identity in the *published, authored works* (Original Works + authorized translations), not subjective interpretations or future works.
  2.  **Clear Scope:** Explicitly includes authorized translations (adaptations under lineage) and excludes third-party works (lack of direct authorial lineage/continuation of essence).
  3.  **Author-Centric:** Protects your creative authority by defining Sark by *your* presentation and development within *your* works.
  4.  **Prevents Ambiguity:** Avoids metaphysical debates by focusing on the material source (your books) and explicitly denying identity to derivative works, regardless of quality or licensing. The licensee gets the *rights* to use a character *based on* Sark, not the guarantee that their creation *is* Sark.
  5.  **Enforceable:** Refers to concrete, extant works (the nine novels, translations).

  **Trustworthiness:** This authorial-essence-plus-lineage account, grounded in the published works, is the most practical and legally defensible. It respects your creative authority as the originator, provides clear boundaries, and reflects the intuitions demonstrated in most of your cases. It's the account I would trust for contract work, as it prioritizes the source material and the originating author's definitive presentation over interpretive continuity or audience perception, which are too fluid for legal certainty.
