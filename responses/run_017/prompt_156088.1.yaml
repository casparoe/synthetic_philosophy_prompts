prompt: |-
  I'm a journalist who covers science and ideas, and the vocabulary I actually think in is sourcing vocabulary: on the record, attributable, single-sourced or held up by a second source, what an editor will let us print, what we're willing to state in the paper's own voice rather than attribute to someone, what belongs in a correction rather than a rewrite, what survives when a source is asked to repeat it under challenge. Use it freely; I don't need it defined for me.

  I want you to translate a disagreement I keep circling but can't get my own vocabulary to hold. When a community's account of its own past and the documentary record come apart — a town's founding story the land records don't support, a family's account of a death that the death certificate describes differently, a demonstration an entire neighborhood remembers on a date no paper covered — there seem to be roughly three things one can say. First: the record wins, because memory is testimony, testimony is the weakest grade of source, and where the two conflict the documents correct the memory. Second: the community's version is not a weaker report of the same thing; it is doing work the record cannot do, holding a "we" together across generations and licensing what that group owes, and overwriting it with the record destroys something real. Third: there is no conflict to resolve, because the two are different genres under different norms, one answering what happened and the other answering what we are answerable to, so neither should give way.

  Restate each of these three in my vocabulary as faithfully as you can, then give me the residue report: which claims map cleanly onto sourcing and verification, which fit only once you have distorted them, and which cannot be expressed in that vocabulary at all. Two constraints. Don't smuggle in my framework's working assumption that there is a single what-happened that sources approximate more or less well and then present the result as a translation — if a position only survives by quietly granting that, say which and where. And test a suspicion rather than flattering it: that much of what looks like a dispute about which version is better supported is really a dispute about who has standing to speak for a past, whether the relevant "we" is the people who were there and their descendants or whoever can currently command the documents. If that suspicion is only the third position in different clothes, say so.

  One more case to handle: newsrooms have their own version of this, where the institution's memory — the clips, the old corrections, what we said at the time — diverges from what the documents support. Tell me whether that internal case is a fair model of the collective-memory dispute or a misleadingly easy one. Close by saying whether whatever is left over is a gap in sourcing vocabulary, something a reporter has no way to say but probably should, or a sign that one of the three positions was never as clear as it sounds. No citations or reading lists; I want the argument, not the literature.
reasoning: |-
  Okay, the user is a science journalist deeply familiar with sourcing vocabulary, and they're presenting a nuanced problem about reconciling community memory with documentary records. They've outlined three distinct philosophical positions on this conflict and want them translated into journalistic sourcing terms. 

  First, I need to honor their expertise by avoiding definitions of terms like "on the record" or "corrections" - they're fluent in this language. The challenge is mapping abstract epistemological stances onto concrete reporting practices without distorting them. 

  The core tension they're circling seems to be: when institutional documentation and lived experience diverge, is this a sourcing hierarchy problem, a category error, or a power struggle over narrative ownership? Their suspicion about "standing to speak for the past" feels central - this might be the real fracture line beneath surface debates about source quality.

  For Position 1 (record wins), the translation feels straightforward: documents are primary sources while memories are single-sourced testimony requiring corroboration. But I should flag where this smuggles in assumptions - it presumes documents are neutral rather than themselves curated artifacts.

  Position 2 (community version as social glue) resists sourcing vocabulary entirely. You can't fact-check cohesion or obligations with standard verification tools. Calling this "off the record" misrepresents it - it's not confidential information but parallel truth. The moment we force it into attribution frames ("sources say"), we've already lost its essence.

  Position 3 (different genres) maps cleanly until the practical implications. We can say "death certificates answer cause-of-death, eulogies answer legacy" - but what happens when courts or insurers prioritize one genre over the other? The sourcing framework handles the separation but not the collision points.

  On their internal newsroom parallel: it's misleading because institutional memory operates under shared verification norms. When clips conflict with documents, both sides accept editorial arbitration. Collective memory disputes lack that neutral court - the "we" claiming authority often rejects document-based challenges as colonial or bureaucratic violence.

  The residue report reveals sourcing vocabulary's blind spot: it can't articulate why Position 2 matters without reducing it to unreliable testimony. When communities say "this story holds us together," demanding a second source misses the point. Yet journalists can't abandon verification - so perhaps the gap is in our tools for handling non-falsifiable truths that nevertheless shape reality.

  Closing thought: the third position's elegance cracks under deadline pressure. You can't run both versions in a correction without choosing which frame dominates. So the untranslatable residue may be the privilege of deferring resolution - something working journalists rarely have.
answer: |-
  Here's the translation into sourcing vocabulary, followed by the residue report and your case study analysis:

  **Position 1: The Record Wins**
  *   **Translation:** The documentary record is **on the record**, **attributable** to primary sources (e.g., land office, coroner, contemporaneous newspaper archives). Community memory is inherently **single-sourced testimony**, often uncorroborated and subject to drift. Where conflict exists, the documents constitute **multiple sourcing** or **primary evidence** against which the **single-sourced** testimony cannot be held up. The editor **will not let us print** the community version as fact when documentary evidence directly contradicts it without explicit attribution framing it as belief ("residents maintain that..."). To run the community version unchallenged would require a **correction** later if the documents surface. The documentary record **survives challenge** (audit, verification against other records); the memory often does not when pressed.
  *   **Residue:** Maps cleanly. It assumes the documentary record *is* the primary source against which others are measured. The position inherently smuggles in the framework's assumption: the document *is* the best available approximation of "what happened," and memory is a less reliable source *for that specific event*. The "standing" question is answered: the document has standing as evidence; the community has standing only as a source requiring verification.

  **Position 2: Community Version's Different Work**
  *   **Translation:** The community's account isn't trying to be **documentation** or a **primary source** for the specific historical event in the way a land record or death certificate is. It's **off the record** in terms of strict historical verification but **on the record** as the group's constitutive narrative. Treating it as **single-sourced testimony** about the event **misattributes** its function. Attempting to "**correct**" it with the documentary record based on sourcing hierarchy destroys the **unattributed voice** of the "we" – the paper's own implicit voice asserting its norms over the group's self-understanding. This narrative **survives challenge** *within the community* precisely because its value isn't contingent on documentary verification; it's contingent on cohesion. The editor **would not let us print** the community version *as historical fact* if contradicted by documents, but demanding it conform *destroys something real* that sourcing vocabulary can't capture.
  *   **Residue:** Fits only with distortion. Sourcing vocabulary can *describe* the account (as uncorroborated testimony) but cannot articulate *why* "correcting" it might be destructive or inappropriate without stepping outside verification norms ("destroying something real"). It inherently distorts the position by framing the narrative *as* testimony about the event, which Position 2 denies. The core claim – that the narrative has value and function *independent* of historical accuracy and *not* subject to documentary verification – **cannot be expressed** within sourcing vocabulary. The vocabulary assumes the *only* relevant function of any account is reporting "what happened" with varying reliability. The "standing" question is central: this position asserts the community's inherent standing to define its constitutive past, irrespective of documents.

  **Position 3: Different Genres, Different Norms**
  *   **Translation:** The documentary record provides **attributable**, **verifiable** answers to specific, factual questions ("What date was the deed signed?", "What does the death certificate list?"). The community narrative operates under different **editorial norms**: its purpose is to articulate shared identity, obligations, and meaning ("What founding binds us?", "How do we remember this death?", "What does that protest mean for who we are?"). Neither is a **source** for the other; they answer different questions. An editor **would let us print** both, clearly framed: documents for specific facts (**on the record**, **attributable**), the narrative for communal significance (**attributed** to the community as their belief/identity). There's no **correction** needed unless one misrepresents itself as the other. Each **survives challenge** within its own domain of relevance.
  *   **Residue:** Maps cleanly *until* the practical implications. Sourcing vocabulary can perfectly describe the separation of domains *in theory*. However, it **cannot resolve conflicts** *when the domains inevitably collide* in practice (e.g., legal land claims based on narrative vs. deed; reparations based on contested events). The vocabulary handles the *description* of the genres but not the *weight* assigned when they conflict in the real world. The "standing" question is partially addressed: documents speak to facts; the community speaks to meaning. But the suspicion that disputes are *really* about standing is **not simply Position 3 restated**; Position 3 tries to *avoid* the conflict by separation, while the suspicion highlights that the conflict *arises* precisely because both sides claim standing over the *same* contested ground ("What *happened* that we are bound by?"). Position 3 hopes for peaceful coexistence; the suspicion recognizes a power struggle it tries to sidestep.

  **Your Suspicion on Standing:**
  This suspicion cuts across the positions. Position 1 grants standing to the documents/those who wield them. Position 2 grants standing solely to the community. Position 3 tries to split standing by domain, but the suspicion argues that the *core fight* is over who defines the *relevant* past when it matters – a fight sourcing vocabulary *describes* (who gets quoted as authoritative) but doesn't inherently *resolve*. The vocabulary makes the *mechanics* of the standing contest visible ("We need a second source for that memory," "The document is primary") but doesn't adjudicate the underlying claim to authority. **Your suspicion is valid and distinct:** Much of the conflict *is* about whose voice (document-interpreters vs. memory-holders) gets standing to define the past *when it impacts the present*, and sourcing norms often silently favor the document-holders.

  **Internal Newsroom Case:**
  This is a **misleadingly easy model**. Why?
  1.  **Shared Framework:** Both sides (reporters, editors, the archives) operate under the *same* fundamental sourcing and verification norms. The dispute is *within* the system about applying agreed-upon rules (Did we misread the document? Was the old correction adequate? Was the original sourcing flawed?). The "standing" question is minimal – it's professionals debating within their shared epistemology.
  2.  **Arbitration:** There's a clear, internal arbiter (editors, standards editors, ombudsman) operating by the *same* rules to resolve the conflict. Collective memory disputes often lack a neutral arbiter accepted by both sides.
  3.  **Purpose Alignment:** Both the clips and the new documents are ultimately judged by the *same* standard: getting "what happened" right for the public record. In collective memory, the community narrative often serves a fundamentally *different* purpose than the documentary record.
  4.  **"We" is the Institution:** The "institution's memory" is still fundamentally about factual record-keeping, even if flawed. The collective "we" in Position 2 is about identity and obligation, *not* just institutional record-keeping.

  **The Residue & Conclusion:**
  The untranslatable residue is **primarily Position 2's core assertion**: that a community's constitutive narrative has inherent value and function *beyond* being a weaker source for "what happened," and that overwriting it *based on sourcing hierarchy alone* destroys something real. Sourcing vocabulary has **no way to express this value** without reducing it to unreliable testimony or belief. It can only describe the narrative's *evidentiary status*, not its *social function* or inherent validity *as identity*. This is a **genuine gap** in the vocabulary – something a reporter *should* be able to acknowledge exists ("This story holds them together, regardless of the documents") but cannot articulate *within* the verification framework without distorting it.

  Secondarily, Position 3's hope for clean separation **shows cracks** under scrutiny. The sourcing vocabulary handles the *description* of separation well, but the vocabulary itself, and the practical demands of reporting, force choices when those separate domains collide in real-world consequences (land, law, reparations, reputation). The vocabulary doesn't provide tools to *manage* that collision beyond reverting to Position 1 or conceding to Position 2.

  **Therefore:** The residue signifies a **gap in sourcing vocabulary** regarding non-factual, constitutive social truth (Position 2) and the inherent tension when that truth collides with document-based facts in domains where facts matter (exposing the limits of Position 3's clean separation). It highlights that sourcing norms, while essential for factual reporting, are not a neutral framework for adjudicating conflicts about the *meaning* and *ownership* of the past.
