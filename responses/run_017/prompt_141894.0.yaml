answer: |-
  **MEMORANDUM**  
  **TO:** All Clinical Staff, Ethics Committee, Billing Department, Risk Management  
  **FROM:** Hospital Compliance Office, Equivalence Protocol Division  
  **SUBJECT:** Revised SOP EP-7: Uniform Mortality Event Reporting & Classification  
  **DATE:** October 26, 2023  
  **REF:** EP Framework v.4.1, Annual Standard Course of Nature (SCoN) Gazette 2024  

  ---

  **1. PURPOSE**  
  To ensure consistent application of the Equivalence Protocol (EP) across all care settings by standardizing the classification and reporting of Mortality Events (MEs). Per EP Principle 1, there is no operational, statistical, or procedural distinction between a death caused by active intervention and a death resulting from non-intervention. All MEs must be captured on Form EP-7A ("Unified Mortality Ledger") and subject to identical review by the Mortality Equivalence Committee (MEC).  

  **2. SCOPE**  
  Applies to all patient deaths occurring within Hospital System facilities, deaths occurring en route to Hospital System facilities where admission was intended, and deaths directly resulting from System decisions regarding resource allocation or treatment pathways.  

  **3. DEFINITIONS**  
  3.1. **Equivalence Protocol (EP):** The operational framework mandating that "Killing" (K-Event) and "Letting Die" (LD-Event) are functionally equivalent Mortality Events (MEs) for reporting, review, and statistical purposes.  
  3.2. **Mortality Event (ME):** The cessation of patient life, regardless of causal pathway (K-Event or LD-Event).  
  3.3. **Standard Course of Nature (SCoN):** The officially gazetted baseline trajectory of an untreated condition, absent *all* healthcare interventions. **2024 SCoN includes:** Bed rest, basic hydration (oral fluids/saline drips), palliative hygiene, and non-prescribed herbal supplements. **SCoN EXCLUDES:** Supplemental oxygen, antibiotics, insulin, chemotherapy, dialysis, CPR, surgical intervention, or any prescribed medication. (See Annual SCoN Gazette, Appendix A).  
  3.4. **Baseline Deviation (BD):** Any intervention or non-intervention moving a patient's trajectory away from the SCoN. Positive BD (+BD) prolongs life relative to SCoN. Negative BD (-BD) shortens life relative to SCoN. **An ME is classified as a K-Event if it results from a -BD.**  
  3.5. **Provisional Non-Commencement (PNC):** Status applied to *authorized* interventions not yet initiated at the time of an ME. Withholding a PNC intervention is classified as an LD-Event. Withdrawing an *initiated* intervention is classified as a K-Event.  
  3.6. **Grafted Baseline (GB):** Applied when the patient's condition is iatrogenic (caused by the System). The SCoN is replaced by the "Expected Recovery Trajectory" (ERT) had corrective treatment been optimally applied immediately upon causation. Deviation from the ERT constitutes the BD.  

  **4. PROCEDURE: CLASSIFICATION & REPORTING**  
  4.1. **Determine Applicable Baseline:**  
      *   4.1.1. For naturally occurring conditions: Apply SCoN.  
      *   4.1.2. For System-caused conditions: Apply Grafted Baseline (GB – see Section 6.2).  
      *   4.1.3. For conditions influenced by prior System intervention: Calculate net BD relative to SCoN origin point.  
  4.2. **Calculate Time Deviation (If Applicable):** For MEs involving acceleration or deceleration relative to the baseline, quantify the BD in Standard Time Units (STUs: Days).  
  4.3. **Classify ME:**  
      *   4.3.1. **K-Event:** ME results from a -BD (active intervention causing harm, or withdrawal of life-sustaining intervention).  
      *   4.3.2. **LD-Event:** ME results from adherence to SCoN or failure to initiate an intervention beyond SCoN (withholding care under PNC).  
      *   *Note:* Classification is based on BD *effect*, not intent.  
  4.4. **Complete Form EP-7A:** Log ME type (K or LD), BD magnitude (STUs if applicable), baseline used (SCoN/GB), PNC status (Y/N), and contributing factors. Submit to MEC within 24 hrs.  

  **5. WORKED CASE STUDIES**  

  **Case 1: Accelerated Mortality & Time Quantification**  
  *   **Patient:** 78M, Stage IV Pancreatic Ca. SCoN prognosis: 21 STU survival.  
  *   **Event:** Patient requests discontinuation of palliative TPN (initiated +7 STU relative to SCoN). TPN stopped. Patient expires 14 STU after stopping TPN (Total survival: SCoN +7 STU -14 STU = 35 STU from diagnosis).  
  *   **Analysis:** Withdrawal of TPN constitutes a -BD. Without TPN, survival expectation was SCoN baseline (21 STU). Actual survival was 35 STU. The withdrawal created a -BD of (35 STU - 21 STU) = -14 STU.  
  *   **Classification:** K-Event (Withdrawal causing -BD). **Magnitude:** -14 STU.  
  *   **Billing Note (EP-7A Sect. D):** Code K-14.1 (Time-Adjusted Killing via Nutritional Withdrawal). HR Note: Staff distress over "killing weeks" requires mandatory counseling referral.  

  **Case 2: Iatrogenic Condition & Grafted Baseline**  
  *   **Patient:** 45F, admitted for routine cholecystectomy. Acquires hospital-onset MRSA pneumonia post-op (System-caused).  
  *   **Event:** Patient declines further treatment (beyond SCoN: bedrest/oral fluids). Expires.  
  *   **Analysis:** Condition is iatrogenic. SCoN is inapplicable. Apply Grafted Baseline: ERT with immediate IV antibiotics post-diagnosis yields expected 95% survival. Failure to provide IV Abx is a -BD from the ERT.  
  *   **Classification:** K-Event (Withholding corrective treatment causing -BD from ERT). **Magnitude:** -100% Survival Probability (Equivalent to -[Estimated Lifespan] STU - use default actuarial table value).  
  *   **Legal Note (EP-7A Sect. E):** Grafted Baseline application triggers automatic Risk Management review per Policy RM-EP-4.  

  **6. PROVISIONAL NON-COMMENCEMENT (PNC) PROCEDURE**  
  6.1. To reclassify potential K-Events (withdrawal) as LD-Events (withholding):  
      *   6.1.1. Authorize intervention (e.g., ventilator, dialysis).  
      *   6.1.2. Designate intervention status as PNC in chart *before* physical initiation.  
      *   6.1.3. Subsequent decision not to initiate is classified as LD-Event (Withholding PNC care).  
      *   *Example:* Patient authorized for ventilator. Status marked PNC. Patient deteriorates before intubation. Decision not to intubate = LD-Event.  
  6.2. **Caution:** MEC audits PNC usage patterns. Frequent PNC designation solely for LD reclassification constitutes "Procedural Circumvention" (See HR-EP-9: Gaming the Protocol).  

  **7. STATISTICAL REPORTING (ANNUAL MORBIDITY & MORTALITY REPORT)**  
  7.1. Total MEs = Total Patient Deaths.  
  7.2. Total K-Events + Total LD-Events = Total MEs.  
  7.3. **Column 12: MEs by Origin:**  
      *   Natural Causes (Adhered to SCoN/No BD)  
      *   Natural Causes, Declined (LD-Event: Withheld SCoN+ intervention)  
      *   Active Intervention (K-Event: +BD Resulting in ME)  
      *   Withdrawal of Care (K-Event: -BD)  
      *   System Resource Allocation (K-Event or LD-Event based on BD calculation - e.g., ambulance diversion).  
  7.4. **Note:** The sum of Column 12 entries equals the Total Mortality Rate. Billing requires separate K-Event subcoding for time-adjusted magnitudes (e.g., K-3.5: Partial Killing < 1 STU).  

  **8. COMPLIANCE NOTES**  
  *   **Footnote 1:** The 2024 SCoN revision (excluding oxygen) increases baseline mortality predictions by approx. 12% vs. 2023 SCoN (which included low-flow O2). This increases the number of interventions classified as +BD and decreases the number of -BD/K-Events for respiratory failure cases. This is operationally coherent with the revised SCoN definition.  
  *   **Footnote 2:** Concerns regarding the inherent unfalsifiability of counterfactuals (SCoN/ERT) are acknowledged. However, the EP framework provides *internal consistency* for System reporting, fulfilling its primary compliance function. Consistency, not metaphysical certainty, is the benchmark.  
  *   **HR Advisory:** The 2023 Report showed K-Events comprising 107% of total MEs due to negative STU calculations on patients exceeding SCoN survival. Staff are reminded that a K-Event classification is a neutral statistical term. Counseling resources are available (See EAP-EP).  

  **9. ATTACHMENTS**  
  *   Appendix A: 2024 Standard Course of Nature (SCoN) Gazette  
  *   Form EP-7A: Unified Mortality Ledger  
  *   Actuarial Default STU Tables for Grafted Baselines  

  **COMPLIANCE OFFICER:** J. Arbuthnot, MPH, CEPC (Certified Equivalence Protocol Coordinator)  

  ---  
  *This SOP supersedes EP-7 Rev.3. All previous versions obsolete. Non-compliance jeopardizes Joint Commission EP Accreditation and CMS Equivalence Funding.*
