  We are drafting a joint statement for an adversarial collaboration between two theorists: the commitment theorist (CT) and the transparency theorist (TT). The document must be in American English and structured as follows:

  1. A numbered section of agreed claims (both can sign).
  2. A disagreements table with three columns: CT's formulation, TT's formulation, and a neutral formulation for each residual dispute.
  3. Cruxes: three concrete cases (as provided) with each side's prediction and whether the oddity survives.
  4. A closing section on verbal disputes, explanatory levels, and how the theories relate.

  The agreed claims should include:
  - The oddity is not falsity or necessary falsity (the state of affairs is possible and may obtain).
  - It survives in soliloquy, diary entries, and silent thought (so not merely Gricean).
  - Cancellation by embedding in conditionals, third person, past tense, hedging.
  - Non-uniformity across attitudes (intention and desire analogues are not absurd in the same way).

  Additional data points we might add:
  - The oddity is specific to the first-person present tense belief ascription.
  - It is not a contradiction (logically consistent).
  - The absurdity is a kind of pragmatic or rational defect, not a truth-conditional one.

  Disagreements to cover:
  - Whether the sentence is bad when merely thought and not asserted.
  - Whether transparency is a datum to be explained or an explanation.
  - Whether a constitutive norm of assertion explains anything or merely restates.

  Crux cases:
  (i) Two-channel forecaster: excellent first-order evidence (rain) and excellent higher-order evidence (unreliable about this), says the sentence.
  (ii) Subpersonal output case: committee or system issues categorical weather statement and logs a calibrated uncertainty estimate, no first-personal access.
  (iii) Metacognitive variants: 
     a. "It is raining but I do not believe I should believe it."
     b. "It is raining but I do not believe my evidence supports it."

  For each crux, we will state:
  - Whether the oddity survives and how strong.
  - Each theorist's prediction.

  Closing: Identify verbal disputes, differences in explanatory levels, and if one theory is a special case of the other.

  Let's structure the document accordingly.
answer: |-
  ### Joint Statement on Moore's Paradox: Adversarial Collaboration  
  **Participants:** Commitment Theorist (CT) and Transparency Theorist (TT)  
  **Date:** October 26, 2023  

  ---

  ### 1. Agreed Data Points  
  Both CT and TT endorse the following claims as foundational to the analysis of first-person present-tense Moorean sentences (e.g., *It is raining but I do not believe it*):  

  1. **Non-Falsity**: The sentence is not false or necessarily false. The state of affairs it describes (e.g., rain occurring while the speaker lacks belief in it) is possible and may obtain.  
  2. **Non-Gricean Oddity**: The absurdity arises in soliloquy, diary entries, and silent occurrent thought. Thus, it is not merely a violation of conversational norms (e.g., Gricean maxims) but reflects a deeper rational defect.  
  3. **Cancellation Conditions**: The oddity disappears under:  
     - Embedding in the antecedent of a conditional (e.g., *If it is raining but I do not believe it, then...*).  
     - Third-person or past-tense shifts (e.g., *It was raining, but she did not believe it*).  
     - Hedging (e.g., *It might be raining, but I do not believe it*).  
  4. **Attitude-Specificity**: The phenomenon is not uniform across attitudes. Intention (e.g., *I will go but I do not intend to go*) and desire (e.g., *It is fun but I do not desire it*) analogues lack comparable absurdity.  
  5. **First-Person Present-Tense Specificity**: The defect arises only in first-person present-tense belief ascriptions and is absent in other grammatical or perspectival forms.  
  6. **Non-Contradiction**: The sentence is logically consistent; its absurdity is pragmatic or rational, not truth-conditional.  

  ---

  ### 2. Disagreements Table  
  | Issue | CT's Formulation | TT's Formulation | Neutral Formulation |  
  |-------|------------------|------------------|---------------------|  
  | **Badness in Thought vs. Assertion** | "The absurdity is *constituted* by the act of assertion. Asserting *p* commits the asserter to believing *p*, so the second conjunct retracts a commitment enacted by the first. The thought alone, unasserted, is incoherent only derivatively, via its potential for expression." | "The absurdity is *primarily* in the thought. Transparency dictates that settling whether *p* is settling whether to believe *p*, so the subject cannot simultaneously judge *p* and deny belief in *p* without incoherence. Assertion inherits this defect but does not create it." | "Does the irrationality originate in the speech act of assertion or in the first-personal structure of belief?" |  
  | **Status of Transparency** | "Transparency is a *consequence* of assertion norms: we treat belief as transparent *because* asserting *p* represents commitment to believing *p*. It is not a primitive datum." | "Transparency is a *pre-linguistic datum*: belief’s first-personal structure (settling *p* just is settling belief in *p*) explains why asserting *p* requires belief. It is foundational, not derivative." | "Is transparency an explanandum (to be explained by norms of assertion) or an explanans (explaining those norms)?" |  
  | **Explanatory Role of Assertion Norms** | "Constitutive norms of assertion *explain* the oddity: they ground why asserting *p* commits one to belief, making Moorean assertions self-defeating. This is not a restatement but a functional explanation." | "Assertion norms *merely restate* transparency in speech-act terms. They describe how transparency manifests in communication but do not explain why belief has this structure. The core explanation is doxastic, not illocutionary." | "Do constitutive assertion norms provide a substantive explanation or merely redescribe the phenomenon?" |  

  ---

  ### 3. Crux Cases and Predictions  
  For each case, we assess:  
  - **Oddity Survival**: Whether the absurdity persists (Yes/No/Partial) and its strength (Strong/Weak/None).  
  - **Predictions**: Each theorist’s pre-case expectation.  

  #### (i) Two-Channel Forecaster  
  *Case*: A meteorologist has (a) strong first-order evidence (e.g., radar data) that it is raining, and (b) strong higher-order evidence (e.g., a diagnosed cognitive bias) that she is unreliable about rain predictions. She asserts, "It is raining but I do not believe it."  
  - **Oddity Survival**: **Yes, but weakened**. The self-doubt mitigates but does not eliminate the irrationality. Strength: Moderate.  
  - **CT Prediction**: "Oddity persists because assertion still enacts commitment to belief, which conflicts with the retraction. Higher-order evidence may excuse the speaker but does not resolve the commitment clash."  
  - **TT Prediction**: "Oddity weakens because transparency is compromised: the subject treats belief as unsettled due to metacognitive doubt. The sentence remains defective but is less jarring than in standard cases."  

  #### (ii) Subpersonal Output Case  
  *Case*: An AI weather system (or committee) with no first-personal awareness issues a categorical output: "It is raining." Separately, it logs a calibrated uncertainty estimate: "System confidence: 40%." The combined output is, "It is raining but I do not believe it."  
  - **Oddity Survival**: **No**. No absurdity arises. Strength: None.  
  - **CT Prediction**: "No oddity because there is no *assertion* by a subject undertaking commitments. The system lacks the agential capacity to 'commit' to belief."  
  - **TT Prediction**: "No oddity because no first-personal stance exists. Transparency requires a subject for whom settling *p* is settling belief; absent this, the sentence is merely descriptive."  

  #### (iii) Metacognitive Variants  
  *Case A*: "It is raining but I do not believe I *should* believe it."  
  - **Oddity Survival**: **Yes**. Strength: Strong (comparable to standard Moorean).  
  - **CT Prediction**: "Oddity persists: asserting 'it is raining' commits to belief, but the second conjunct denies that this commitment is justified, creating a new conflict between commitment and its grounds."  
  - **TT Prediction**: "Oddity persists: judging *p* entails that one *should* believe *p* (by transparency), so denying this is incoherent."  

  *Case B*: "It is raining but I do not believe *my evidence supports* it."  
  - **Oddity Survival**: **Partial**. Strength: Weak.  
  - **CT Prediction**: "Oddity weakens: the second conjunct targets evidence, not belief, so the commitment to *p* is not directly retracted. But asserting *p* while denying evidential support is still pragmatically odd."  
  - **TT Prediction**: "Oddity weakens: transparency does not require awareness of evidence, only a normative link between judging *p* and believing *p*. Denying evidential support is a higher-order error, not a direct transparency violation."  

  ---

  ### 4. Closing: Dispute Resolution and Theoretical Levels  
  **Non-Verbal Disagreements**:  
  - The core dispute is **explanatory priority**, not semantics. CT anchors explanation in social practice (assertion as commitment), while TT anchors it in cognitive architecture (belief’s first-personal structure). Neither reduces to the other.  
  - **Verbal Elements**: Debates over "commitment" and "transparency" risk equivocation. CT uses "transparency" to describe a *norm* of belief expression; TT uses it for a *constitutive feature* of belief. This is terminological, not substantive.  

  **Theoretical Levels**:  
  - CT’s account operates at the **speech-act level**: It explains Moorean absurdity as a performative contradiction in social communication.  
  - TT’s account operates at the **doxastic level**: It explains Moorean absurdity as a failure of first-personal rationality antecedent to assertion.  
  - **Integration**: TT’s transparency *enables* CT’s commitment norms: the first-personal structure of belief makes assertion a natural vehicle for expressing commitment. Neither is a special case, but they address complementary levels—TT explains *why* assertion requires belief; CT explains *how* this requirement manifests in discourse.  

  **Outcome**:  
  Both theories capture necessary conditions for Moorean absurdity. TT’s transparency is foundational for belief, while CT’s commitments are foundational for assertion. The adversarial cases confirm this:  
  - (i) Higher-order evidence disrupts TT’s transparency more than CT’s commitments.  
  - (ii) Subpersonal systems lack both first-personal stance (vital for TT) and agential commitment (vital for CT).  
  - (iii) Variants challenge TT’s scope but align with CT’s focus on justification.  

  **Conclusion**: The dispute is resolved not by synthesis but by stratification: TT explains the doxastic roots of Moorean absurdity; CT explains its illocutionary expression. Future work should test hybrid models (e.g., whether assertion norms derive from belief’s structure).  

  ---  
  **Signed**,  
  Commitment Theorist (CT)  
  Transparency Theorist (TT)  
  *Witnessed by the Reading Group Convener*
