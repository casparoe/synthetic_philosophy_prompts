prompt: |-
  my flatmate's brother is doing a philosophy minor, and over dinner last night he went off on one about Kant. his claim was that the universal law formula is just the thing your mum says when you're six — what if everybody did that? — with the serial numbers filed off, and that it's secretly consequentialist anyway, because whenever anyone actually runs it on a real case the badness always cashes out in consequences: if everyone lied, promising collapses, trust breaks down, nobody gets lent money, etc. his conclusion was that there's nothing specifically Kantian going on, so why wade through 200 pages of Kant to get there.

  i have some sympathy with that but it feels like he's sliding something. can you audit the analogy properly?

  - the correspondence table first: what plays the role of "everybody", of "that", of the bad outcome, of the mum's frown, of "you wouldn't like it, would you". and what's the Kant-side analogue of the "what if" — universal adoption of the maxim, or universal legislation of the law? does that difference do any work, or is it just branding?
  - where the mapping breaks. the bit i half remember: Kant apparently splits things into a contradiction in conception and a contradiction in will, and the four examples he runs in the Groundwork (suicide, the lying promise, letting your talents rot, not helping anyone) aren't all meant to work the same way. so: does the mum-test fit one branch and not the other? my guess is it fits the contradiction-in-will ones, where the verdict does look like "a world like that would be unwishable", and completly misfires on the contradiction-in-conception ones — but i can't make that precise and i might have it backwards.
  - the case that actually bothers me. take the maxim: when keeping a promise has become inconvenient, i'll quietly not keep it. if literally everyone always did that, promising is dead and the test gives the right answer for the boring reason. but that isn't the interesting case. the interesting case is partial: everybody holds that maxim but acts on it only sometimes, or 5% of people hold it. at low defection rates promising as a practice survives just fine, so the crude consequence story doesn't obviously deliver "don't do it" — and partial defection is exactly where deontologists and consequentialists are supposed to come apart. so does Kant's test say anything there that the mum-test doesn't? does the maxim's condition get universalized along with it? and does the answer depend on how fine-grained we make the description, which brings me to:
  - the gerrymandering worry. i can apparently make anything pass by adding details ("i'll lie only to buy milk on tuesdays from red-haired shopkeepers") or make anything fail by stripping them out. is that fatal, or is there a principled story about what the unit of assessment is — maxim, policy, principle of volition — and who sets the level of generality?
  - and the other direction, where the mum-test over-generates: i'll train as a concert pianist and grow no food. universalize that and we starve, so on the mum-test it's wrong, which is absurd. does Kant have a fix that isn't just consequences sneaking back in? (something about a world where no one cultivates talents being conceivable but not willable?) and if that fix needs the formula of humanity to do the work, does that mean the universal law formula on its own is empty — which is the objection my flatmate says one of the Germans who came after Kant already made, about nothing following from mere non-contradiction?

  end by telling me whether the brother's conclusion survives: vacuous, crypto-consequentialist, or neither. and if "what if everybody" is the wrong analogy, is there a better one? someone suggested the constitutive rules of a game: you can't have "bishop moves one square diagonally when it suits me" as a universal rule of chess, not because the game would go badly but because it wouldn't be chess any more. that sounds right to me, but i want to know what it imports that the mum-test doesn't, and which cases it can't handle.

  argue it out, no citations or reading lists please, i can't look anything up and i don't need a bibliography.
reasoning: |-
  Okay, let's tackle this step by step. The user's flatmate's brother claims Kant's universal law formula is just a dressed-up version of the "what if everybody did that?" question moms ask kids, and that it secretly relies on consequences. The user wants to audit this analogy properly, pointing out specific areas where it might break down.

  First, mapping the analogy: 
  - "Everybody" corresponds to universal adoption of the maxim. 
  - "That" is the action described in the maxim. 
  - The bad outcome is the contradiction Kant finds. 
  - The mum's frown is the moral prohibition. 
  - "You wouldn't like it" mirrors the contradiction in will where the universalized world becomes undesirable. 

  But there's a crucial difference: Kant isn't asking about empirical outcomes but whether the maxim can be universalized without logical contradiction or undermining rational will. The mum-test focuses on bad results, while Kant cares about consistency in a world governed by that maxim.

  Where the mapping breaks: 
  The brother's critique fits the contradiction in will cases (like not helping others) where the outcome is undesirable. But it fails for contradiction in conception cases (like the lying promise). For example, universalizing lying about promises makes the concept of promising incoherent—not because of bad consequences, but because it's logically impossible to promise in a world where everyone does this. The mum-test would emphasize broken trust, but Kant's point is about internal contradiction.

  Partial defection cases: 
  The brother thinks consequences explain everything, but Kant's test handles partial compliance differently. For the lying promise maxim, universal adoption (even if only 5% act on it) still fails because the maxim itself relies on the promise system existing. If everyone adopts the maxim "break promises when inconvenient," the institution of promising collapses—even if not everyone acts on it immediately. The mum-test might say "if only 5% do it, things are fine," but Kant argues the maxim is self-defeating when universalized in principle.

  Gerrymandering maxims: 
  This is a real problem. Kant needs maxims at the right level of generality—not too specific ("lie to red-haired shopkeepers on Tuesdays") nor too broad. He implicitly assumes maxims reflect genuine reasons for acting. If you gerrymander, you're cheating by making the maxim meaningless. The mum-test has the same issue but doesn't address it systematically.

  Over-generating cases: 
  The concert pianist example fails the mum-test (universalizing leads to starvation) but passes Kant's test. Why? A world where no one cultivates talents is conceivable and doesn't create a logical contradiction. It might be undesirable (contradiction in will), but Kant argues we have a duty to develop talents because rational agents ought to use their capacities. This relies on the formula of humanity, not just universalizability. So yes, the universal law formula alone might be incomplete, and later critics (like Hegel) pointed this out.

  Conclusion: 
  The brother's claim is partially right but oversimplified. The mum-test is consequence-focused, while Kant's test is about consistency of rational will. It's not crypto-consequentialist—the badness isn't in outcomes but in contradictions. The analogy holds best for contradiction in will cases but fails for contradiction in conception. The brother's conclusion doesn't survive intact; Kant offers something distinct, even if the universal law formula needs supplementing with the formula of humanity. The game rules analogy is better: it captures the constitutive aspect Kant emphasizes, like how a universal "cheat" rule would destroy the game itself, not just make it go badly.
answer: |-
  Let's audit this analogy properly. Your flatmate's brother isn't *entirely* wrong, but he's flattening Kant into a caricature. Here's the breakdown:

  ### 1. **Correspondence Table & Key Differences**
     - **"Everybody"** ↔ **Universal adoption of the maxim** (by all rational agents).  
     - **"That"** ↔ **The maxim** (your subjective principle of action).  
     - **Bad outcome** ↔ **Contradiction** (logical or practical impossibility in a world governed by that maxim).  
     - **Mum's frown** ↔ **Moral prohibition** (the maxim fails the test).  
     - **"You wouldn't like it"** ↔ **Contradiction in the will** (where universalization makes your own goals impossible).  
     - **"What if"** ↔ **Universal legislation test** (asking if the maxim could be a universal law *without contradiction*).  

     **Why it's not branding**: The mum-test asks about *empirical outcomes* ("we'd starve!"). Kant cares about *rational consistency*: could your maxim exist as universal law without undermining itself or rational agency? Consequences (e.g., trust breaking down) are *symptoms* of the deeper contradiction, not the core issue.  

  ### 2. **Where the Mapping Breaks: Contradiction Types**
     Your intuition is **backwards**. The mum-test fits **contradiction in conception** better than contradiction in will:  
     - **Contradiction in conception** (e.g., lying promise): Universalizing "break promises when inconvenient" makes *promising itself impossible*. If everyone adopted this maxim, the concept "promise" vanishes (since no one trusts promises). This is logical suicide, not "bad outcomes." Mum-test *would* say "if everyone lied, trust breaks down!"—but Kant isn't focused on the chaos; he's focused on the *self-destruction of the practice*.  
     - **Contradiction in will** (e.g., never helping others): Universalizing "never help" *could* exist (no logical contradiction), but you couldn't rationally *will* it because you might need help yourself. Mum-test nails this ("you wouldn't like it if no one helped you!"), but Kant roots it in *rational inconsistency*, not empathy.  

  ### 3. **The Partial Defection Case**
     Kant **doesn't care about empirical adoption rates**. He's testing the *maxim itself* for universalizability.  
     - Your maxim: *"When keeping a promise is inconvenient, I’ll break it."*  
     - Universalized: *"Everyone breaks promises when inconvenient."*  
     - Result: Promising collapses because **the practice relies on a norm of reliability**. Even if only 5% *hold* this maxim, the maxim itself is parasitic on a system it would destroy if universalized. It’s self-defeating.  
     - **Why it’s not consequentialist**: Kant isn't saying "partial defection has bad effects." He’s saying the maxim is *inherently unstable*—it depends on others *not* adopting it. Consequentialism might permit defection if net utility increases; Kant forbids it because the maxim fails as a universal law.  

  ### 4. **Gerrymandering Maxim Descriptions**
     Kant’s vulnerability is real, but there’s a (flawed) defense:  
     - **Principled level**: Maxims must reflect your *actual reason for acting*. If you lie to a red-haired shopkeeper because it’s Tuesday, but your real reason is "to avoid paying," you’re cheating by adding irrelevant details.  
     - **Kant’s assumption**: Rational agents act on *principles*, not ad-hoc exceptions. "Lie on Tuesdays" isn’t a genuine maxim—it’s a dodge.  
     - **Problem**: Kant offers no clear rule for granularity. The mum-test has the same issue ("what if everyone lied *to red-haired shopkeepers*?").  

  ### 5. **Mum-Test Over-Generates: Concert Pianist Case**
     - Mum-test: Universalize "train as a pianist, grow no food" → starvation → wrong.  
     - Kant:  
       - **Contradiction in conception?** A world where no one farms is *conceivable* (no logical flaw).  
       - **Contradiction in will?** You *could* will this world (if you’re suicidal?), but Kant argues rational agents have a duty to develop talents because **unused capacities waste your rational agency**. This *requires* the Formula of Humanity (treating humanity as an end).  
     - **Verdict**: The universal law formula *alone* struggles here. It’s not "consequences" sneaking in—it’s about what rational agency *demands*. Without the Formula of Humanity, the test *is* incomplete.  

  ### 6. **Brother's Conclusion: Vacuous, Crypto-Consequentialist, or Neither?**
     **Neither—but reductive**.  
     - **Not vacuous**: Kant exposes self-defeating maxims (e.g., lying promises) in a way the mum-test can't systematize.  
     - **Not crypto-consequentialist**: Bad outcomes (trust collapsing) are *evidence* of a deeper rational flaw, not the flaw itself. The contradiction is in the *structure of rational willing*, not utility.  
     - **But**: The universal law formula *alone* is leaky (gerrymandering, talent case). It needs Kant’s full system (especially the Formula of Humanity) to work.  

  ### Better Analogy: Constitutive Rules of a Game  
     - **Why it’s stronger**:  
       - "Bishop moves one square when it suits me" can't be universalized because it *destroys chess itself*. Similarly, "break promises when convenient" destroys promising.  
       - Focuses on **internal consistency** (not consequences). Chess isn't "worse" with rogue bishops—it’s *not chess*.  
     - **Where it fails**:  
       - Contradiction in will (e.g., not helping) isn't about "destroying a game." It’s about conflicting with what a rational agent must will.  
       - Doesn’t cover duties to self (e.g., develop talents).  

  **Final verdict**: The brother’s take is a decent pop-philosophy summary but misses Kant’s core—**rational autonomy as lawgiving**. Kant isn’t asking "what if everyone did that?" He’s asking: "Can you legislate this law for all, while remaining a consistent rational agent?" That’s why you wade through 200 pages: to grasp why *rational consistency* isn’t just mum-guilt with better PR.
