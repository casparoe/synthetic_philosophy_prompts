answer: |-
  ## Scene: The Shifting Sands of Arithmetic

  **Setting:** The Grain Court chamber, a high-ceilinged room smelling of dust, old paper, and river silt. The ninth sitting after the Great Shift. A large slate dominates one wall, half-covered in chalked figures. Outside, the sluggish Sarn glints unnaturally under the spring sun, its new channel a raw wound on the landscape.

  **Characters:**
  *   **Warden Halia Merrow:** Mid-40s, precise movements, eyes calculating. Wears the geometric sigil – a spiral within a circle – pinned to her grey tunic.
  *   **Keeper Oss Barrow:** Late 50s, broad-shouldered, face etched with the memory of lean winters. Practical brown robes, perpetually dusty.
  *   **Jento:** Early 20s, earnest, slightly overwhelmed. Piles of pre-Shift ledgers threaten to engulf his corner table. His fingers are ink-stained.

  **(The scene opens with Halia pointing decisively at the slate. Oss leans back in his heavy chair, arms crossed, radiating skepticism. Jento nervously chews a reed pen, glancing between his ledgers and the argument.)**

  **HALIA:** ...and so the doctrine is clear, Keeper Barrow. The edge is our advantage. Five chances in nine to double the stake, four in nine to lose it entirely. The edge is one-ninth. We stake that fraction of our bankroll to maximize the long-run growth rate. Simple, elegant. Irrefutable.

  **OSS:** (Grunts) "Bankroll," Warden? Is Thalwend a dice game in a dockside tavern? Our "bankroll" has a floor, twelve barges. Below that, no more Thalwend. No more Grain Court. Just hungry ghosts scattered to the uplands. Your elegant fraction ignores the precipice. Logs might hum along merrily, but people starve. Cities die. *That* isn't in your ratios.

  **HALIA:** The mathematics accounts for *all* states, Keeper. It weighs the gain against the loss, the probability of each. Averaging the log wealth... it *does* account for ruin. It simply doesn't grant it a special mystical status beyond its numerical consequence. Our discretionary surplus is *four* loads. The stake fraction is one-ninth. One-ninth of four is four-ninths of a barge. Less than one full silt strip. Therefore, we sow nothing. Preserve the surplus against the thin record. Nine seasons? It’s a child’s scribble compared to the old flood tables.

  **OSS:** Four barges surplus? Aye. But the doctrine asks for the fraction of the *whole store*, does it not? What is the whole store? The grain we have *now*, that feeds us *now*, that keeps us *above the Floor*? That's the Floor *plus* the surplus! Twelve plus four is sixteen loads! One-ninth of *sixteen* is one and seven-ninths loads. Closer to *two* full strips than none! We sow two. We work the silt, as we have for generations. We take the measured risk. To sow nothing is to starve slowly. To wither. Your "preservation" is decay.

  **JENTO:** (Clearing his throat nervously) Warden? Keeper? The pre-Shift ledgers... the terrace allocations... I found a... a pattern. Or maybe an error? I don't know...

  **HALIA:** (Without looking, focused on Oss) Not now, Jento. The Keeper mistakes the nature of the bankroll. The Floor is a boundary condition, not part of the *risked* capital. You wouldn't stake the foundation stones of the flood wall in a dice game, would you? Only the surplus is discretionary. Only the surplus can be staked.

  **OSS:** (Leaning forward, intensity rising) And what *is* the surplus built upon, Warden? The granaries? The stone? No! It's built on the fields *outside* the wall, on the people who work them, on the *promise* of next season! Marrowgate’s treaty – famine relief at four times the rate, worth maybe twenty loads if it comes due – isn't that part of what Thalwend *has*? Part of its resilience? If we count *that* potential, the whole store... twelve Floor, four surplus, twenty potential... thirty-six loads? One-ninth of *that* is four loads. Our entire surplus. We sow *everything*! Your doctrine, Warden, tells us to stake the whole kitty! Is *that* preservation?

  **HALIA:** (Eyes flashing) That’s sophistry, Keeper! The treaty is a contingent promise, not grain in the granary! The bankroll must be *liquid*, *measurable*. You cannot stake futures and hopes! Besides, the doctrine has nuance you blithely ignore. Betting the full edge fraction *f* maximizes growth *if* the odds are known. But five-in-nine? Based on *nine* readings? The uncertainty is vast! Halving the stake to *f*/2 = one-eighteenth costs us only... (She swiftly chalks figures on the slate: `(1 + f)^p * (1 - f)^q` vs `(1 + f/2)^p * (1 - f/2)^q`, plugging p=5/9, q=4/9, f=1/9). ...only about a quarter of the growth rate! A small insurance premium against the very error your thin record invites! And betting *more* than the edge? Betting two strips – nearly 2*f, since f=1/9 of 16 is ~1.78? (Chalks again: `(1 + 2f)^p * (1 - 2f)^q`). Look! The expected log growth rate plummets! Betting *past* twice the edge fraction risks *negative* growth, Keeper! Wiping out the surplus as surely as a bad year! Your "measured risk" of two strips is mathematically reckless!

  **JENTO:** (Louder, desperate) *Please!* The terraces! In the ledgers! Before the Shift! The near terrace and the far terrace... every year, wet or dry, one doubled, one halved. Always opposite. Like... like a counterweight system. But the clerks... at year-end... they moved half the grain from the one that doubled to the one that halved. Or vice versa? The entries are messy. But... over a two-year cycle... (He flips frantic pages) Look! Year 1 Start: 100 units total. Year 1: Near doubles (200), Far halves (50). Move half of Near (100) to Far? Far now 150, Near now 100. Year 2: Say Near halves (50), Far doubles (300). Move half of Far (150) to Near? Near 200, Far 150. Total... 350? Started with 100! Or... (Scrabbles) This entry: Start 80. Cycle ends... 102? Another: Start 60, ends 76? It *gains*. About a quarter? Without sowing! Just... moving! Is it real? Did they *find* grain? Or is the ledger wrong? What *was* the store? Where was the grain *counted*?

  **(A sudden, heavy silence falls. Halia and Oss turn, finally seeing Jento. The chalk in Halia's hand pauses mid-air. Oss's brow furrows deep.)**

  **HALIA:** (Whispering, eyes locked on Jento's ledger) A gain? From... rebalancing? Without changing the total sown? That... that violates the conservation of expected grain. Unless... unless the store wasn't defined by the individual terrace holdings. Unless moving it... changed what was *counted* as part of the whole? Like... like counting the treaty? Or not counting the Floor?

  **OSS:** (Voice low, intense) Or it means the grain itself knew no fixed boundary. Near terrace flourishes, far suffers. You shift the bounty to the suffering ground, and somehow... the whole thrives? Like sharing bread in a famine, the whole loaf stretches further? Your doctrine, Warden... (He gestures at the slate, then at Jento's ledgers) ...it assumes the store is a fixed number in a box. What if it isn't? What if the store is the *system*? The fields, the river, the people moving between them? What if the "bankroll" breathes? Your fractions... they chase the wrong ghost if the ledger itself lies about where the grain *is*.

  **HALIA:** (Stiffly) Or it's simply an accounting error, Jento. Transposed figures. Wishful thinking. We deal in measurable realities. Probabilities. Grain we can touch. The doctrine is sound for what *is here*.

  **OSS:** "Here" is shrinking, Warden. The new channel silts faster every season. Maybe twelve seasons left? Your long run is shorter than you think. We need grain *now*. We need resilience. Not just ratios. That ledger... if it's real... it tells us spreading the risk, shifting the gain, *was* the store. Maybe sowing two strips, working both terraces like the old clerks, *is* defining the bankroll that can grow. Maybe the Floor isn't just twelve barges in the granary... maybe it's the will to plant, to move the grain, to see the whole field.

  **JENTO:** (Looking between them, terrified and hopeful) So... it *could* be real? The gain? It matters?

  **HALIA:** (Eyes distant, calculating) It implies... a geometric return from... correlation? Diversification? But the terraces are gone, Jento. The Shift buried them. We have only the silt now. One bet. One outcome. The old tricks are buried silt. We have the numbers we have. Four surplus. Edge one-ninth. Fraction four-ninths. Less than one strip. We sow nothing. (She turns back to the slate, her chalk poised, but it doesn't move. Her certainty seems momentarily fractured.)

  **OSS:** (Stands, placing both hands on the table) We have mouths to feed, Warden. Winters coming. And a thin record that says five-in-nine is our best guess. We sow two strips. We stake the fraction of the *city* we still have, Floor and all. We trust the silt and the river that *was*, not just the ghosts of ledgers or the chill of your empty granary logic. Jento... keep looking. Find out if that grain was real. If it was... the whole doctrine shifts again. Like the river.

  **(Halia stares at the slate, at the conflicting figures: 4/9, 16/9 ≈1.78, 36/9=4. Next to them, Jento's frantic scribbles: 100 -> 350? 80 -> 102? 60 -> 76? The chalk trembles in her hand. The arithmetic stands, clear and contradictory. The air crackles with the weight of the unplanted seed.)**

  ---

  **Author's Note: The Arithmetic and the Argument**

  1.  **Arithmetic vs. Uncertainty:**
      *   **Granted:** The Kelly Criterion math is sound. Edge = p - q = 5/9 - 4/9 = 1/9. Optimal fraction f* = edge = 1/9 for max long-run growth. Halving the stake (f*/2) significantly reduces risk while sacrificing only ~25% growth (based on the formula `G = p*ln(1+f) + q*ln(1-f)`). Betting 2f* leads to near-zero or negative growth (`G ≈ p*ln(1+2f*) + q*ln(1-2f*)` with f*=1/9, 2f*≈0.222, ln(1-0.222) is heavily negative). The different "sow" recommendations (0, 2, 4) stem purely from defining the bankroll (S): Surplus (4) -> Stake = (1/9)*4 ≈ 0.44 (<1 strip -> 0). Floor+Surplus (16) -> Stake ≈1.78 (≈2 strips). Including Treaty (≈40?) -> Stake≈4.44 (≈4 strips). Jento's terrace math (rebalancing two uncorrelated 50/50 bets yields ~25% geometric growth per cycle) is also correct arithmetic *if* the events are independent.
      *   **Unsettled:** Everything else! Is maximizing *expected log wealth* the right goal for a city facing existential risk (the Floor) and a finite horizon (12 seasons)? Log-utility ignores the discontinuity of ruin. How should uncertainty in `p` (thin 5/9 record) be handled? Shrinking the stake (Halia) is one heuristic; others exist (e.g., conservative `p` estimate). Is the "bankroll" just surplus grain? Or the city's total survivable assets (Floor + surplus)? Or future potential (treaty)? Are these even commensurable? Is Jento's ledger finding real grain or an error? If real, does it imply the "store" is defined by the *system* (correlated risks, actions like rebalancing) rather than static grain counts, fundamentally challenging the premise of a fixed `S`?

  2.  **Who is "Right"?**
      *   **Verdict:** Oss Barrow is pragmatically "right" *for Thalwend's immediate survival context*, though his reasoning is less mathematically pure.
      *   **Key Sub-question:** Does the existence of the Floor, representing irreversible dissolution, invalidate the application of log-utility maximization which assumes continuous, unbounded growth? The answer here is likely *yes*. Halia's math is elegant but ignores the catastrophic, non-linear consequence of breaching the Floor. Oss's insistence on defining the bankroll as the city's *current survivable mass* (Floor + Surplus) and taking a moderate risk (2 strips, ~11% of this mass, within Halia's "safe" underbetting zone) is a survival-oriented adaptation of the doctrine. Sowing nothing courts slow decline; sowing everything risks oblivion on thin odds.

  3.  **What Would Change My Mind?**
      *   **The Argument:** If Halia could convincingly demonstrate that incorporating the *probability* and *consequence* of hitting the Floor *within the finite 12-season window* explicitly into her growth model shows that Oss's plan (staking ~11% of Floor+Surplus) has an unacceptably high (>30-40%) chance of triggering dissolution *before* the channel chokes, while her "sow nothing" plan guarantees survival until the siltation crisis (albeit weakened). This would elevate her model above philosophical objections by directly quantifying the existential risk Oss fears. If her model proved Oss's "moderate" risk was actually reckless given the time pressure, her caution would become the true survival strategy.
      *   **The Discovery:** If Jento's ledger finding is confirmed as *real* and *actionable*. If the "terrace effect" – gaining 25% via rebalancing uncorrelated risks – could be replicated *now* (perhaps by diversifying sowing locations or crop types despite the Shift), it would vindicate Halia's *doctrine* (showing geometric growth is possible) while undermining her *specific recommendation* (sow nothing). It would prove the "bankroll" is dynamic and manipulable, making Oss's fixed granary view simplistic and opening a path where calculated diversification (not just cautious staking) drives survival. Halia, recognizing this, might shift to advocate for a diversified "sow two strips, but in different ways" plan leveraging the principle Jento uncovered.
