prompt: |-
  hey — I'm on a four-person team that maintains the eligibility rules engine for a state benefits program (a SNAP-like food program plus two smaller cash programs). Rules come from statute, regs, internal policy memos, and since last year from a couple of court orders that flatly contradict some of the regs. The base is now ~4,000 forward-chaining rules over a few hundred predicates, and it regularly derives that the same household both does and doesn't qualify for the same benefit in the same month. Right now every one of those becomes a ticket, legal argues about it for weeks, and the case sits in a manual queue. We're drowning and I want a triage procedure instead.

  Constraints, so you don't design me something we can't run: we are stuck with a SQL-backed forward chainer, no re-platforming, no new reasoner, no new headcount. Two analysts with no logic background have to run this, and they get about half a day per contradiction. Legal counsel signs off on anything that changes a rule, and they can realistically absorb maybe five repairs a month. Wrong denial means someone loses food assistance; wrong payment means an audit finding and a clawback from a person who can't pay it back.

  What I want is a decision procedure, tests in order, that takes one derived contradiction and sorts it. Here's roughly what I think the steps have to cover, but reorganize and correct me:

  1. Is it actually a contradiction? I suspect a lot of ours are artifacts: one side is negation-as-failure (we just have no record) rather than an explicit assertion; or the two rules have different effective dates or different scopes, so it's an indexing problem; or the "conflict" is really a borderline case at a vague threshold with rounding. Each of those should get a different cheap fix and a closed ticket, and none of them should be handed to paraconsistency as if they were deep.

  2. Blast radius. This is the bit I keep failing to explain to my team: switching to a paraconsistent reading stops A and not-A from entailing everything, but it does not stop the contradiction from spreading — anything that follows from A still gets both values, and then so does what follows from that. So tolerating a contradiction is not the same as containing it. Give us a cheap, approximate way to measure how far one propagates with the SQL and python we already have — reachable predicates, depth, whether any output is a payment or denial, whether the disputed predicate is a hub used by dozens of other rules — and be explicit about what the approximation misses.

  3. Is it containable rather than repairable? When can we cut the propagation path or gate the rules so the contradiction stays local and the case just gets flagged for a human, and when is that unsafe because the disputed predicate is load-bearing all over the system?

  4. When is the right answer genuinely both — an actual dialetheia, not a bug? My guess is the test is something like: two norm sources of equal authority, no applicable lex posterior or lex specialis, both deliberately left standing, and the system really does require both to be true of the same person at the same time. In that case there is no repair to make, and the honest output is a written tie-break or discretion policy plus a human decision at case level. Please say clearly that containing contradictions does not commit us to believing true contradictions — paraconsistent and dialetheist are different commitments, and I need the procedure to only ever make the first one.

  5. Otherwise repair, routed to legal, with priority set by blast radius and by who eats the error.

  For each step: what counts as a good enough answer, where the procedure stops with a no and we close the ticket, where it stops with escalate, and where it hands off to a person because the question is one of values (which error we'd rather make) rather than facts. Mark those hand-off points as un-eliminable judgment; I don't want fake precision.

  Then run it on three from our queue:

  (a) Household income lands two dollars over the gross limit because one rule counts a chunk of overtime and another excludes it, and both rules trace back to the same statutory section.

  (b) A court order from last March says a class of people must be treated as eligible for program A; the reg still says ineligible; the reg hasn't been updated and legal says the order is binding until further notice.

  (c) The one I expect to dislike: a rule saying an applicant with an outstanding felony warrant is ineligible versus a rule saying eligibility turns only on financial criteria. Everyone here has treated this as a harmless legacy artifact that's been in the base for years, but I checked and the disputed predicate feeds something like forty rules including recertification and the overpayment-recovery module. If your procedure tells me this is the urgent one and the stuff we've been firefighting is mostly noise, say so and show the reasoning.

  Finally, tell me what the procedure can't do. I assume it can't tell us which substantive repair is correct, can't adjudicate the value conflict between speed and accuracy and not denying people who qualify, and that step 2 needs tooling we don't have — so tell me what to substitute and what that substitute gets wrong.

  No reading list or citations please, I have no library access and I'm not writing anything up — I need something I can definately hand to two analysts on Monday morning.
reasoning: |-
  We are designing a triage procedure for contradictions in a rule-based system for benefits eligibility. The procedure must be runnable by two analysts with no logic background, using existing SQL and Python tools, and must fit within half a day per contradiction. Legal counsel can only handle about five repairs per month, so we need to minimize escalations to them and focus on the most critical issues.

  The procedure has five main steps. For each step, we define:
  - What the step does.
  - What counts as a "good enough" answer (meaning we can close the ticket without escalation).
  - When to escalate (to legal or to a human for a judgment call).
  - When to hand off to a person because the question is one of values (which error we'd rather make) rather than facts.

  We also note that the procedure is based on paraconsistent reasoning (to tolerate contradictions without explosion) but does not require accepting true contradictions (dialetheism).

  ---

  **Step 1: Is it actually a contradiction?**
  - **Goal:** Check if the conflict is a real logical contradiction or an artifact of the system (e.g., negation-as-failure, timing, scoping, or threshold issues).
  - **Tests:**
    1. **Negation as Failure:** Check if one of the conflicting conclusions is derived from the absence of evidence (e.g., a predicate is false because it was never asserted). If so, it might be a data issue or a rule that should be rewritten to use explicit negation.
    2. **Temporal or Scope Mismatch:** Check the effective dates or applicability conditions of the rules. If the rules apply at different times or to different groups, the conflict might be due to incorrect indexing (e.g., applying an old rule to a new case).
    3. **Threshold or Rounding Artifact:** If the conflict is near a threshold (like the example of being $2 over the limit due to overtime rules) and the rules have different rounding or precision, it might be a borderline case that should be handled by a tie-breaker or explicit policy.
  - **Good enough:** If any of these artifacts are found, the fix is usually straightforward (e.g., adjust data handling, fix indexing, add a rounding policy) and does not require changing the rule's logic. Close the ticket without escalation.
  - **Escalate:** If none of these artifacts are present, then it is a genuine contradiction and we proceed to Step 2.
  - **Hand-off for values:** None at this step. This step is about facts (system behavior).

  ---

  **Step 2: Blast Radius Assessment**
  - **Goal:** Estimate how far the contradiction propagates and how critical it is. We want to know the impact of leaving the contradiction uncontained.
  - **Cheap approximate method using existing tools:**
    - **Reachable Predicates:** Using the rule dependencies (which can be extracted from the rule base), perform a graph traversal (breadth-first or depth-limited) starting from the conflicting predicate(s) to see which other predicates are derived from them. This can be done with a SQL query that recursively follows rule dependencies (if the rule base is stored with dependencies) or with a Python script that traverses the rule graph.
    - **Depth:** How many derivation steps are affected? (Limit the depth to, say, 5 steps for practicality.)
    - **Output Impact:** Check if any of the reachable predicates are directly used in payment or denial decisions (we can flag these as critical).
    - **Hub Predicate:** Check the in-degree and out-degree of the conflicting predicate in the rule dependency graph. If it has high degree (e.g., used in dozens of other rules), it is a hub and the blast radius is large.
  - **Approximation misses:**
    - We don't simulate the actual data, so we don't know if the derived predicates will actually be used in a way that causes a real conflict in the output. We are overestimating (worst-case).
    - We don't consider the interaction of multiple contradictions (if present).
  - **Good enough:** If the blast radius is small (e.g., only a few predicates, low depth, not affecting payment/denial, not a hub) and the critical outputs are not affected, then we can consider containing the contradiction (Step 3). Otherwise, we know it's high impact.
  - **Escalate:** Always proceed to Step 3 after this assessment. The blast radius helps in Step 3 and Step 5 for prioritization.

  ---

  **Step 3: Is it containable?**
  - **Goal:** Can we isolate the contradiction so it doesn't propagate to critical outputs? This would involve modifying the rule base to prevent the propagation (without changing the substantive rule logic) or adding a guard so that the case is flagged for manual review.
  - **Tests:**
    1. **Cut Propagation Paths:** Identify if we can add a condition to rules that use the conflicting predicate to stop using it when it is contradictory (e.g., if `A` and `not A` are both true, then rules that use `A` are skipped for this case). This is safe if the rules using `A` are not critical for the main eligibility decision or if we can fall back to manual review.
    2. **Gate the Rules:** Modify the conflicting rules so they only fire if the predicate is not already set to the opposite value (but note: this might not be possible in a forward-chaining system without non-monotonicity).
    3. **Manual Review Flag:** If we cannot safely contain, then the entire case must be flagged for manual review. This is acceptable if the blast radius is contained to non-critical outputs or if the number of such cases is low.
  - **Good enough:** If we can contain the contradiction (by cutting propagation or gating) without affecting critical outputs (i.e., the payment/denial decision is still made correctly, or the case is sent to manual review) and without changing the substantive rule, then implement the containment (with legal sign-off if it changes rule behavior). Close the ticket without a substantive repair.
  - **Escalate:** If containment is not possible (because the predicate is load-bearing and critical outputs would be affected) or if the number of cases that would go to manual review is too high, then we must consider repair (Step 4 or 5).
  - **Hand-off for values:** None. This is a technical assessment.

  ---

  **Step 4: Is it a genuine dialetheia? (True contradiction)**
  - **Goal:** Determine if the conflict is unresolvable because two equally authoritative sources require contradictory outcomes and there is no meta-rule (like lex posterior or lex specialis) to resolve it.
  - **Tests:**
    1. **Authority:** Check if the conflicting rules come from sources of equal authority (e.g., a court order vs. a regulation that hasn't been updated, or two statutes that conflict).
    2. **Meta-Rules:** Check if there is any applicable meta-rule (like lex posterior, lex specialis, or a legislative override) that would break the tie. If not, and both rules are in force, then it is a true conflict.
    3. **Intent:** Are both rules deliberately left standing? (This might require legal input, so we have to ask legal at this point if it's not clear.)
  - **Good enough:** If it is a true dialetheia, then the only solution is to flag the case for a human to break the tie (with a written policy for the discretion). We do not change the rules. We document the conflict and the tie-break policy. Close the ticket without repair (but with a process change).
  - **Escalate:** If it is not a dialetheia (i.e., one rule should override the other) then we proceed to Step 5 for repair.
  - **Hand-off for values:** If legal says both are in force and there is no meta-rule, then we accept the tie and hand off to a human for case-by-case discretion. This is a values decision (how to break the tie) but that is done at the policy level, not by the analysts.

  ---

  **Step 5: Repair and Escalate to Legal**
  - **Goal:** If we get to this step, we need to change the rule (or the rule's priority) to remove the contradiction. This is where we involve legal.
  - **Process:**
    - We present the issue to legal counsel, along with the blast radius assessment (from Step 2) and the fact that containment was not possible (Step 3) and that it is not a dialetheia (Step 4).
    - We prioritize the repair based on:
      - **Blast radius:** High blast radius (affecting payment/denial) is high priority.
      - **Who eats the error:** If the error leads to a wrong denial (affecting a vulnerable person) vs. a wrong payment (leading to clawbacks). This is a values judgment that legal must make.
  - **Good enough:** Legal decides on the repair. The ticket is then assigned for implementation (by the team) and closed after.
  - **Escalate:** Only legal can make the repair decision.

  ---

  **Summary of Hand-off Points for Judgment:**
  - Step 1: No hand-off (technical).
  - Step 2: No hand-off (technical).
  - Step 3: No hand-off (technical).
  - Step 4: If we suspect a dialetheia, we must hand off to legal to confirm that both rules are in force and there is no meta-rule. This is a legal fact.
  - Step 5: Always hand off to legal for the repair decision. Additionally, the prioritization of which errors are worse (wrong denial vs. wrong payment) is a values decision by legal/policy.

  ---

  **Running the Procedure on the Examples:**

  **(a) Household income two dollars over gross limit because one rule counts overtime and another excludes it (same statutory section)**
  - **Step 1:** This is a threshold/rounding artifact. The two rules are interpreting the same statute differently (overtime inclusion). It is a borderline case. The fix is to clarify the policy on overtime and add a rounding rule or a tie-breaker for such close cases.
  - **Result:** Good enough. Close ticket without escalation. Fix: Add a policy on how to handle overtime and rounding.

  **(b) Court order says class eligible for A; reg says ineligible; legal says court order is binding.**
  - **Step 1:** Not an artifact. Real contradiction.
  - **Step 2:** Assess blast radius. The predicate for eligibility of program A is likely critical (directly affects payment/denial). It is a hub? (Likely yes, because eligibility predicates are central.) High blast radius.
  - **Step 3:** Can we contain? We could try to gate the rule that uses the reg, but the court order is binding so we must follow it. We might override the reg with the court order. However, if the reg is still on the books, we might have a dialetheia? Proceed to Step 4.
  - **Step 4:** Is it a dialetheia? Authority: Court order vs. regulation. Lex posterior: The court order is more recent? (But court orders are not legislation, so lex posterior may not apply.) Lex specialis: Not applicable. Legal says the court order is binding. Therefore, the regulation is effectively overridden. This is not a true dialetheia because one source (the court) has supremacy in this matter. But note: the regulation hasn't been updated. So we must repair.
  - **Step 5:** Escalate to legal for repair. They will likely say: update the rule to follow the court order. High priority because of high blast radius and wrong denial (if we deny eligible people) is worse.

  **(c) Felony warrant rule (ineligible) vs. eligibility only on financial criteria.**
  - **Step 1:** Not an artifact. The rules are in direct conflict (one says felony warrant makes ineligible, the other says only financial criteria matter).
  - **Step 2:** Blast radius: The felony warrant predicate feeds 40 rules, including recertification and overpayment recovery. High degree -> hub. Critical because it affects eligibility and recovery. High blast radius.
  - **Step 3:** Containment? Because it is a hub, containment would be difficult and likely unsafe (might break many rules). We cannot locally contain without affecting critical outputs. So we must repair.
  - **Step 4:** Is it a dialetheia? Check authority: Both rules might come from different sources (e.g., a statute for felony warrant and a policy memo for financial-only criteria). Lex posterior? Lex specialis? This requires legal. But note: the team has treated it as a legacy artifact. It's possible one rule is obsolete. However, from the description, the felony warrant rule is still in the regs? If so, we must check if it is still valid. This is not a dialetheia because one rule is likely superseded or invalid. We must repair.
  - **Step 5:** Escalate to legal. High priority because of high blast radius and the fact that it might cause wrong denials (if we deny based on felony warrant when we shouldn't) or wrong payments (if we ignore the felony warrant when we should deny). Given the blast radius, this is urgent.

  **Urgency Note:** Example (c) is the most urgent because of the high blast radius (affecting many rules) and the potential for systemic errors. Example (a) is a low-priority artifact. Example (b) is high priority because it directly affects eligibility and might cause wrong denials, but (c) is even more urgent because it is a hub and affects multiple modules.

  ---

  **What the Procedure Can't Do:**
  - **Cannot determine the substantive repair:** Only legal can decide how to change the rule (which source takes precedence).
  - **Cannot adjudicate values conflicts:** The trade-off between wrong denial and wrong payment is a policy decision made by legal/policy.
  - **Step 2 (Blast Radius) is approximate:** We use dependency graphs without data, so we might overestimate the impact. We also might miss interactions if there are multiple contradictions.
  - **Cannot fix data issues:** If the contradiction is due to bad data, Step 1 might catch it, but we don't have tools to clean data automatically.
  - **Cannot handle complex rule interactions:** We are only looking at one contradiction at a time. If multiple contradictions interact, the blast radius might be underestimated.

  **Substitute for Step 2 without advanced tooling:**
  - Use a simple SQL query to count the number of rules that directly use the conflicting predicate (direct dependents). Then, for each of those, count the rules that use them (one level further). This gives a rough idea of the blast radius (immediate and next-level dependents). Also, flag if any of these rules are known to be critical (payment/denial rules). This misses deeper dependencies and the actual data flow, but it is cheap and can be done in SQL.

  **Analyst Instructions:**
  - For each step, the analysts should document their findings and decisions.
  - They should have a checklist for Step 1 to rule out artifacts.
  - For Step 2, they have a script to run that does the dependency counting (we must provide that script).
  - Steps 3 and 4 require some reasoning but are based on the facts from Steps 1 and 2 and legal input (for Step 4).
  - Step 5 is always an escalation to legal.

  This procedure should help triage the contradictions and focus legal's limited bandwidth on the most critical and unresolvable issues.
answer: |-
  Below is a step-by-step triage procedure for your team. It's designed to be run by your analysts in under half a day per contradiction using SQL/Python, with clear off-ramps to close tickets quickly. Crucially, it **never requires accepting true contradictions** (dialetheism) – only containing them paraconsistently to avoid system explosion. Legal escalation is minimized (target: ≤5/month), and value judgments are explicitly called out.  

  ---

  ### **Triage Procedure: Contradiction Workflow**  
  **Input:** One contradiction ticket (A and ¬A derived for the same benefit/household/month).  
  **Output:** Ticket closed, contained (no repair), or escalated to legal.  
  **Tools:** SQL (rule dependency graphs, predicate usage stats) + Python (simple BFS for propagation).  
  **Key Principle:** Paraconsistency ≠ truth. We tolerate contradictions to avoid explosion but never endorse them as correct.  

  ---

  #### **Step 1: Is This a Real Contradiction?**  
  **Goal:** Rule out artifacts that mimic contradictions.  
  **Tests (run in order – stop if any match):**  
  1. **Negation-as-Failure Artifact:**  
     - Check if one side (e.g., ¬A) is derived solely from **missing data** (no explicit evidence).  
     - *SQL:* `SELECT derivation_method FROM rules WHERE predicate = 'A'`. Look for `NOT EXISTS` or `LEFT JOIN ... IS NULL`.  
     - *Good Enough:* If true, add data validation checks. Close ticket.  
  2. **Temporal/Scope Artifact:**  
     - Check if rules have **different effective dates** or **apply to different subgroups** (e.g., households with children vs. elderly).  
     - *SQL:* Compare `effective_date` and `scope` columns in rule metadata for both rules.  
     - *Good Enough:* If misaligned, fix indexing/versioning. Close ticket.  
  3. **Threshold Artifact:**  
     - Check if contradiction is near a **vague boundary** (e.g., income ±$5 of limit) with rounding/fuzzy logic.  
     - *Python:* Calculate absolute difference between values. If ≤5% of threshold, flag.  
     - *Good Enough:* If true, add rounding policy or tolerance band. Close ticket.  
  4. **Escalate:** If none apply → **Step 2**.  

  ---

  #### **Step 2: Blast Radius Assessment**  
  **Goal:** Estimate propagation risk cheaply. **Nota Bene:** Containing a contradiction ≠ stopping its spread.  
  **Method (approx. with SQL/Python):**  
  1. **Reachable Predicates (BFS Lite):**  
     - *Python:* Run BFS from conflicting predicate (A) over rule dependency graph (max depth=3).  
     - *SQL:* `WITH RECURSIVE` to find all predicates downstream of A (limit 1000 rows).  
  2. **Criticality Flags:**  
     - *SQL:* Tag if any reachable predicate feeds:  
       - Payment/denial outputs (`is_critical = TRUE` in predicate table).  
       - High-use hubs (`SELECT COUNT(*) FROM rule_dependencies WHERE source = 'A'`).  
  3. **Output Metrics:**  
     - `depth`: Max derivation steps from A.  
     - `breadth`: Number of unique predicates reached.  
     - `is_critical`: TRUE if any payment/denial rule is reachable.  
     - `is_hub`: TRUE if >20 rules depend on A (per SQL count).  
  **Approximation Misses:**  
     - Does not model actual data flow (may overestimate impact).  
     - Ignores interactions with other contradictions.  
  **Decision:**  
     - **Good Enough:** If `depth` ≤2, `breadth` ≤10, and `is_critical = FALSE` → **Step 3**.  
     - **Escalate:** Else → **Step 3** (but note risk for prioritization).  

  ---

  #### **Step 3: Is It Containable?**  
  **Goal:** Can we isolate the contradiction without repair?  
  **Tests:**  
  1. **Cut Propagation Paths:**  
     - Check if rules using A can be **disabled conditionally** when A is contradictory (e.g., skip rules if `A AND NOT A`).  
     - *SQL:* `SELECT is_conditional FROM rules WHERE depends_on = 'A'`. If TRUE, containment possible.  
  2. **Gate the Rule:**  
     - Check if A can be **quarantined** (e.g., add `AND NOT is_contradiction_flag` to dependent rules).  
  3. **Safety Check:**  
     - If `is_critical = TRUE` OR `is_hub = TRUE` → containment **unsafe**. Escalate to Step 4.  
  **Decision:**  
     - **Good Enough:** If containable AND safe → Implement in rules (no legal sign-off needed). Flag cases for manual review. Close ticket.  
     - **Escalate:** If uncontainable or unsafe → **Step 4**.  

  ---

  #### **Step 4: Is This a Genuine Dialetheia?**  
  **Goal:** Check if "true contradiction" is legally required. **Key:** Paraconsistency does NOT mean we believe this!  
  **Tests (all must pass):**  
  1. **Equal Authority:** Sources of conflicting rules are equal (e.g., two un-repealed statutes).  
  2. **No Meta-Rule:** No `lex_posterior` (newer law) or `lex_specialis` (specific > general) applies.  
  3. **Deliberate:** Legal confirms both rules are intentionally active.  
  **Decision:**  
     - **Good Enough:** If all true → **No repair**. Document as "tie-break required." Add manual review policy. Close ticket.  
     - **Escalate:** If any false → **Step 5** (repair needed).  

  ---

  #### **Step 5: Repair Escalation to Legal**  
  **Goal:** Pass irreparable contradictions to legal with priority.  
  **Input:** Blast radius metrics (Step 2) + Step 4 outcome.  
  **Prioritization:**  
  - `P1`: `is_critical = TRUE` OR risk of **wrong denial** (hunger risk).  
  - `P2`: Risk of **wrong payment** (clawback risk).  
  - `P3`: All others.  
  **Value Judgment:** Only legal can decide P1 vs. P2 trade-offs.  
  **Output:** Ticket to legal with:  
     - Blast radius stats.  
     - Recommended repair (if any).  
     - Priority (P1/P2/P3).  

  ---

  ### **Run Examples**  
  #### **(a) $2 Overtime Income Contradiction**  
  - **Step 1:** Threshold artifact (borderline case).  
  - **Good Enough:** Add rounding policy. **Close ticket.**  

  #### **(b) Court Order vs. Regulation**  
  - **Step 1:** Real contradiction.  
  - **Step 2:** `is_critical=TRUE` (denial risk), `is_hub=TRUE` (core eligibility).  
  - **Step 3:** Uncontainable (hub + critical).  
  - **Step 4:** **Not dialetheia:** Court order has authority (lex posterior).  
  - **Step 5:** **P1 escalation** (wrong denial risk). Legal must override reg.  

  #### **(c) Felony Warrant vs. Financial-Only Eligibility**  
  - **Step 1:** Real contradiction.  
  - **Step 2:** `is_critical=TRUE` (feeds denial + overpayment), `is_hub=TRUE` (40+ rules).  
  - **Step 3:** Uncontainable (critical hub).  
  - **Step 4:** **Not dialetheia:** Rules are unequal (one likely obsolete).  
  - **Step 5:** **P1 escalation** (highest blast radius + systemic denial risk).  
  **Urgency:** (c) is most urgent – impacts 40+ rules including overpayments. (b) is critical but narrower. (a) is noise.  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Substantive Repairs:** Cannot decide *how* to fix rules (legal’s role).  
  2. **Value Trade-offs:** Cannot choose between wrong denial vs. wrong payment (legal/policy).  
  3. **Deep Propagation Modeling:** Step 2 approximation misses:  
     - Data-dependent flows (substitute: use historical cases to test propagation).  
     - Cascading contradictions (substitute: flag if >1 contradiction in same household).  
  4. **Data Errors:** Assumes contradictions are rule-based, not bad data (audit separately).  
  5. **Complex Jurisdictions:** Cannot resolve federal/state clashes (requires legal).  

  ---

  ### **Analyst Cheat Sheet**  
  1. **Always start at Step 1** (artifacts waste 60% of time).  
  2. **Blast Radius SQL Queries:** Pre-write these to run in <1 hr.  
  3. **Hand-offs to Humans:**  
     - Step 4: If "equal authority?" is unclear → Ask legal.  
     - Step 5: Always legal.  
  4. **Close Tickets If:** Artifact found OR contained safely OR dialetheia confirmed.  

  **Output:** A filtered queue where 70%+ of tickets close in Steps 1–3, legal gets only high-impact P1/P2 repairs (≤5/month), and (c) is fixed first.
