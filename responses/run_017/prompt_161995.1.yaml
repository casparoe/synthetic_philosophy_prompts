  First, they're challenging the standard epistemic approach that focuses only on verdict accuracy. They want to add "reason-tracking" - whether the group's stated rationale actually reflects majority-supported premises and remains stable under agenda refinements. The key tension is that verdict-tracking and reason-tracking might require different aggregation procedures.

  Hmm, their suspicion about agenda features mattering - reliability per premise, error correlations, asymmetric costs - feels sharp. The lawyer friend's point about messy empirical vs clean legal premises is crucial here. The meta-agenda regress problem is dangling though - that could swallow the project whole if not handled carefully.

  For candidate sharpenings:
  1. Justifying verdicts through supported premises - too narrow, misses granularity issues
  2. Agenda fragility as robustness to re-description - important but only one piece
  3. Full comparative evaluation of procedures along both dimensions - yes, this captures their core innovation while leaving room for discovery
  4. Meta-agenda regress - fascinating but clearly a separate project

  The proposal structure seems clear: precise question about when PB/CB maximize each dimension given agenda features, critique of existing literature's single-dimensional focus, then methodological mix. Month-by-month: first formalize reason-tracking metrics (July-Aug), then prove baseline results (Sep-Oct), simulate varied agendas (Nov-Feb) - this is where the lawyer's real-world asymmetry insight gets modeled, then case study (Mar-Apr) likely appellate courts given the friend's input, finally decision tool prototyping (May-Jun).

  Deliverable: A diagnostic flowchart for institutional designers that incorporates both epistemic and discursive goods. Failure modes to acknowledge: if reason-tracking always aligns with verdict-tracking (unlikely), or if recommendations become hopelessly contextual (mitigate by mapping parameter zones).

  Must be brutally honest about the meta-agenda regress - it's absolutely a second project. Better to state this limitation upfront than sabotage the core. The appellate case study can briefly flag it as future work.

  User's clearly done deep thinking - their distinction between verdict correctness and group-stand-behind-able rationale is sophisticated. Proposal should mirror that precision while staying practical for designers. The "no citations" request is refreshing - they want substance over academic performativity. Smart.
answer: |-
  ## Fellowship Proposal: "Beyond Verdicts: Reason-Tracking in Collective Epistemic Deliberation"

  **1. Brainstorm & Candidate Sharpenings:**

  1.  **"Under what agenda features does premise-based voting (PBV) outperform conclusion-based voting (CBV) in reason-tracking, and how does this differ from verdict-tracking?"** *Why drop?* Too narrow. Ignores potential for other procedures or procedural choices beyond pure PBV/CBV and focuses solely on comparison rather than defining/measuring reason-tracking itself.
  2.  **"Is reason-tracking, defined as agenda-robust majority support for the stated rationale, achievable as a distinct epistemic good, and what procedures secure it?"** *Why drop?* Vague on the relationship to verdict-tracking and lacks concrete operationalization for "agenda-robustness." Risks being too abstract.
  3.  **"How do verdict-tracking and reason-tracking diverge under different agenda structures and member competence profiles, and can we identify optimal trade-off procedures?"** *Why drop?* "Optimal trade-off" might be too ambitious for a one-year project; "trade-off" needs precise definition. Retains core tension but needs sharper focus on characterizing the divergence.
  4.  **"What formal properties define 'reason-tracking' as distinct from verdict-tracking in collective judgment aggregation, and how do standard aggregation procedures perform along these dimensions under varying epistemic conditions?"** *Why keep?* Focuses on defining the new concept ("reason-tracking"), establishes its distinct properties, *then* evaluates procedures comparatively under specified conditions. Allows for discovery of divergence without presupposing optimality. Handles agenda features explicitly. Leads to concrete diagnostics.

  **2. Dissertation Proposal: "The Epistemic Value of Coherent Rationales: Verdict-Tracking vs. Reason-Tracking in Collective Judgment"**

  **Core Question:** Does maximizing the probability of a *correct collective verdict* (verdict-tracking) and maximizing the probability that the *collectively endorsed rationale reflects actual majority support and is robust to agenda refinement* (reason-tracking) systematically require different aggregation procedures for multi-premise decisions under uncertainty, when member competences, error correlations, and error-cost asymmetries vary across premises?

  *   **Precision:** The answer is a classification: For a given set of agenda features (premise reliability profiles, error correlations, cost asymmetries, logical structure), we can categorize whether:
      *   (A) PBV strictly dominates CBV for both goals.
      *   (B) CBV strictly dominates PBV for both goals.
      *   (C) PBV is superior for verdict-tracking while CBV is superior for reason-tracking (or vice versa).
      *   (D) The procedures are equivalent for one or both goals.
      *   *(Possible Extension)*: Identify hybrid procedures (e.g., premise-voting with override, sequential voting with deliberation constraints) that outperform pure PBV/CBV in specific trade-off scenarios.

  **Why Existing Framings Leave This Open:** The epistemic literature predominantly evaluates aggregation rules (PBV, CBV, sequential, etc.) solely on their *conclusion accuracy* or overall *verdict reliability*. The "discursive dilemma" is often framed as an inconsistency problem or a challenge to collective rationality, not as highlighting a distinct epistemic good – the *coherence and majoritarian legitimacy of the stated rationale itself*. The literature notes agenda-sensitivity but rarely incorporates robustness to refinement as a core desideratum or formally defines a "reason-tracking" metric distinct from truth-tracking the conclusion. The impact of heterogeneous premise difficulties and correlated errors on *rationale coherence* remains underexplored.

  **Methodology (Month-by-Month):**

  *   **Months 1-2 (Jul-Aug): Conceptual Formalization.**
      *   Define "reason-tracking" rigorously:
          *   **Majoritarian Support:** The set of propositions asserted in the rationale must have received majority support individually *at the time of aggregation* (e.g., rejecting "doctrinal paradox" outcomes where the rationale claims P & Q but no majority supported both).
          *   **Agenda Robustness:** The endorsed rationale should be stable (or its support measurable) under reasonable refinements/coarsenings of the premise set (e.g., splitting "material defect" into sub-premises). Develop a metric (e.g., min/max support probability under refinement, or stability index).
      *   Define "verdict-tracking" using standard Bayesian/condorcet frameworks.
      *   Formalize agenda features: Premise-specific reliabilities (p_i), error correlations (ρ_ij), asymmetric error costs (c_i+ ≠ c_i-), logical structure (conjunction, disjunction, more complex).
  *   **Months 3-4 (Sep-Oct): Analytical Baseline.**
      *   Prove small analytical results for simple cases (2 premises, conjunction/disjunction, symmetric competence). Characterize conditions where PBV/CBV coincide or diverge for VT vs. RT. Identify necessary/sufficient conditions for divergence. *Why?* Grounds the project in logic, provides benchmarks for simulations, identifies key parameters driving divergence.
  *   **Months 5-8 (Nov-Feb): Computational Simulation.**
      *   Build a flexible simulation model (Python/R). Generate synthetic agendas:
          *   Vary number of premises (3-5), logical connectives (primarily conjunction, explore others).
          *   Systematically manipulate: individual p_i (high/low, heterogeneous), ρ_ij (independent, positive/negative correlation), c_i+ / c_i- (symmetry vs. strong asymmetry – e.g., high cost for false positive on "material defect").
          *   Simulate PBV, CBV, and potentially 1-2 hybrids (e.g., premise-voting with high-bar conclusion override).
          *   Measure performance: VT (% correct verdicts), RT (metrics defined in M1-2).
      *   *Why Simulations?* Essential to explore complex interactions beyond tractable analytical models. Allows systematic variation of multiple agenda features simultaneously, generating large datasets to identify patterns, thresholds, and trade-offs. Captures the messy heterogeneity central to the lawyer's critique (e.g., wild differences in competence per premise type).
  *   **Months 9-10 (Mar-Apr): Case Study Application.**
      *   Conduct a focused case study on **appellate court panels** ruling on mixed questions of law and fact (e.g., "Was there a material breach of contract?" often decomposes into factual and legal premises).
      *   Analyze actual opinions/rules of procedure (limited set): How do courts *claim* to aggregate? How often do Doctrinal Paradox-like situations arise implicitly? How do later courts treat rationales where premise support might be unclear? *Why Appellate Courts?* Directly addresses the origin of the debate; features clear distinction between factual (messy, variable competence) and legal (cleaner, higher competence) premises; rationale binding is institutionally crucial; manageable scope. *Why not alternatives?* Clinical committees involve deep expertise asymmetry but less formalized rationale binding; expert committees vary too widely. Appellate courts offer the best "test bed" for the core philosophical/legal tension.
  *   **Months 11-12 (May-Jun): Synthesis & Tool Prototyping.**
      *   Integrate analytical, simulation, and case study findings.
      *   Develop a **diagnostic framework/prototype checklist** for institutional designers. Structure: Based on key agenda features identified (e.g., "Is there high asymmetry in member reliability across premises? Are errors likely correlated? Is the cost of error highly asymmetric on a key premise? Is rationale stability crucial for downstream authority?"), the framework indicates:
          *   Likely divergence between VT and RT goals.
          *   Procedure(s) favored for VT goal.
          *   Procedure(s) favored for RT goal.
          *   Potential hybrid approaches worth considering.
          *   Sensitivity to agenda refinement.
      *   *Why this deliverable?* Moves beyond abstract theory to actionable insight. A flowchart/checklist is realistic if grounded in the systematic analysis above – it won't give a single answer but will structure the trade-offs based on identifiable features.

  **Concrete Deliverable:** A peer-reviewed journal article presenting the formal reason-tracking framework, core findings on the VT/RT divergence, and the diagnostic framework/applied to appellate courts. The prototype checklist will be included as an appendix/figure.

  **Honest Failure Modes & Mitigation:**

  1.  **No Meaningful Divergence:** VT and RT goals *always* align under PBV or CBV across simulated scenarios. *Mitigation/Assessment:* Unlikely given analytical baseline and paradox structure, but would be a significant negative result: it would imply the "reason-tracking" concern is illusory or subsumed by VT in practice. Project still delivers the formalization and test.
  2.  **Overwhelming Contextuality ("It Depends"):** Findings are highly sensitive to subtle parameter changes, making generalization impossible. *Mitigation:* Focus the diagnostic framework on identifying broad *categories* of agendas (e.g., "High Asymmetry + High Rationale Binding Importance -> Favor PBV for RT, CBV may win on VT") rather than precise thresholds. The case study anchors it in a real context.
  3.  **Agenda Robustness Intractable:** Formalizing a robust metric proves impossible or yields unusable results. *Mitigation:* Focus the RT definition primarily on Majoritarian Support (rejecting unsupported rationales) and treat Agenda Robustness as a secondary, qualitative desideratum illustrated through examples in the case study.
  4.  **Meta-Agenda Problem Fatal:** *See below.*

  **The Meta-Agenda Regress:** This is **absolutely a distinct (and fascinating) second project.** Trying to rigorously incorporate the choice of aggregation rule *or* agenda granularity *by the group itself* within the model introduces a complex game-theoretic or higher-order aggregation layer that will consume the entire year and dilute the core innovative contribution on VT vs. RT. **Recommendation:** Cut it cleanly. State explicitly in the proposal: "This project takes the agenda and aggregation rule as exogenously given. The significant challenge of endogenous rule/agenda choice, while related to agenda robustness, introduces a distinct layer of strategic complexity best addressed in future work." Briefly note its importance in the conclusion/future work section.

  **Conclusion:** This project breaks new ground by formally defining "reason-tracking" as a distinct epistemic good in collective judgment, alongside verdict-tracking. By systematically analyzing how standard aggregation procedures perform on these potentially competing goals under realistic agenda conditions – particularly heterogeneity in member competence, error correlation, and error costs – it promises to resolve the core philosophical-legal tension highlighted in the discursive dilemma debate. The deliverable is a theoretically rigorous yet practically oriented framework to guide the design of deliberative bodies where the legitimacy and authority of the *rationale* matter as much as the verdict itself.
