prompt: |-
  I am a software engineer with no formal philosophy background, and I maintain a system that stores anticipatory instructions people write about their own future incapacity and, when a trigger condition fires, hands a recommendation to the clinician or proxy who has to act on it. The clinical cases are the familiar ones: a written refusal of invasive life-prolonging treatment in the event of advanced irreversible dementia, and the psychiatric analogue in which someone authorizes compulsory admission or forced medication during manic episodes. I also maintain a consumer product in which people pre-commit to future actions, and the same question comes up there, which suggests to me that the issue is not really medical.

  I do not want a survey of how any particular jurisdiction treats these documents. I am told the statutory rules vary and I have no way to check them, and I do not want a specification that rests on them. What I need is the normative core: when, and on what grounds, does an instruction issued by an earlier person have authority over a later person who is no longer in a position to have issued it?

  Please give me the answer as a requirements document rather than an essay. I want the desiderata that any adequate account of the authority of the earlier self has to meet, where adequate means good enough to be implemented as policy at the bedside by a relative stranger, with incomplete information, in a few minutes, and defensible afterward to a review board and to the patient's family. For each requirement: state it, give the case or consideration that motivates it, say what it excludes, and mark it as non-negotiable or as the preference of one camp. Then tell me which of my requirements you think are not genuine desiderata at all but prejudices that happen to be widespread; whether some subset of the requirements is jointly unsatisfiable, since if it is, that fact is itself the most useful thing you can tell me; and which single requirement does the most work in excluding candidate theories.

  Here are the cases I already think are load-bearing. Please add the ones I am missing, and tell me if any of mine is confused or is doing no work.

  1. *The baseline.* A competent adult refuses, in writing, invasive life-prolonging treatment in the event of permanent unconsciousness or advanced irreversible dementia; years later the condition obtains. I take it that any theory that cannot deliver this verdict is disqualified.
  2. *The contented patient.* As above, except the later person appears to take real pleasure in music and visitors and shows no sign of wanting to die, and the earlier document's stated reason was horror at being a burden on others. I want to know whether an instruction can be separated from the reasons that produced it, and whether the answer differs depending on whether the later person has preferences at all or merely affects.
  3. *The Ulysses case.* A person with bipolar disorder authorizes forced medication during manic episodes and, while manic, revokes it fluently, at length, and with apparent coherence.
  4. *The depressed author.* A refusal of aggressive treatment written during a severe depressive episode, never revisited after recovery, acted on years later.
  5. *Drift.* A refusal of being kept alive by machines, written when that phrase meant an intensive-care ventilator, in a situation where the only intervention on offer is a portable ventilator at home or a daily tablet. Or a directive written before a therapy existed that turns the triggered condition from terminal into chronic and manageable.
  6. *The corpus.* Five documents over fifteen years with no clean revocation, the most recent being the most restrictive but signed during a bad month, and an earlier one being visibly better informed. Last-writer-wins versus best evidence of an enduring will.
  7. *The self-sealing trigger.* A directive that applies only if I no longer recognize my family, or only if I am no longer myself: a condition whose satisfaction is best evidenced by exactly the later report that the condition discounts. Does a theory have to permit triggers that entrench themselves against the only available evidence, and if not, what is the principled reason?
  8. *The stack.* A clause saying that any revocation I issue while manic is to be ignored; a later clause saying that any clause stripping my future power to revoke is to be ignored; possibly a third clause about the second. Does the theory have to supply a fixed point here, or may it let the stack collapse to a default, and on what basis?
  9. *The gate.* A hypothetical policy under which directives lapse unless reaffirmed on a schedule, as a lease lapses unless renewed. Is reaffirmation merely evidence that the person still endorses the instruction, or does it do independent normative work as a condition on authority? Does authority decay continuously or lapse all at once?
  10. *Granularity.* A later person who is competent about some matters, such as recognizing family or refusing one particular drug, but not about others, such as weighing a long-horizon tradeoff. Is authority scoped decision by decision, or is the person one unit for this purpose?
  11. *Third-party effects.* A directive demanding everything, which will consume years of a family's life and a large share of its resources; or a directive requiring clinicians to provide what they regard as physiologically non-beneficial. Is the earlier self's authority bounded by effects on others, and is such a bound a limit on authority or a distinct side-constraint that the theory of authority can stay silent about?

  Beyond the cases, I think a theory has to respect some distinctions that I have seen collapsed in practice, and I would like you to correct the list: having authority versus how much authority; the authority of an instruction versus the authority of the values behind it; the earlier self's word being binding versus being merely good evidence of what the later self wants or of what is good for the later self; revocation versus supersession versus never having applied; and a trigger condition being satisfied versus a trigger condition being verifiable by someone other than the party who benefits from its being satisfied.

  Two further constraints from my side, which you should treat as candidates for desiderata rather than as given. The first is observability: a criterion that turns on facts nobody at the bedside can establish in minutes is not one I can implement, however true it is, so for each of your requirements I want the observable proxy you would accept and your view on whether demanding observability is a genuine desideratum or a corruption of the theory for administrative convenience. The second is error asymmetry: when the record is silent or genuinely ambiguous, should a system treat the earlier instruction as in force or as not in force, and is the asymmetry between those two failures part of the theory of authority or a separate moral input that the theory should be required to declare rather than absorb silently?

  Finally, and briefly, because I care much more about the criteria than about the scoring: I have been working with four rough positions, which I will describe rather than name in case I have them wrong. One says that competent choices about one's own future bind, full stop. One says that what matters is the interests and experiences of the person now in the bed, with the document at most evidence of those. One says that what binds is the earlier person's enduring values or character rather than the literal list of interventions, so the document is a fallible guide that can be overridden in its own terms. One says that what binds is something like authorship of a life, so the earlier self can have authority over how that life goes that outruns both the text and the later self's present preferences. Give me a short paragraph on where each fails your list, and tell me whether I have drawn the four wrong or have missed a position that the list makes available. A table at the end is fine.
reasoning: |-
  Okay, let me try to unpack this user's request. They're a software engineer working on a system that handles anticipatory instructions, like advance directives for medical care or pre-commitments in consumer products. They need a requirements document outlining the normative core of when an earlier self's instructions should bind a later self. 

  Hmm, the user explicitly doesn't want legal specifics—they're after philosophical principles that can be implemented at the bedside. That's interesting because most people in healthcare would jump straight to legal compliance. But this engineer recognizes that legality varies and wants something deeper. Smart.

  Looking at their cases... wow, they've really thought this through. The contented dementia patient, Ulysses contracts, depressed author—these are classic philosophy thought experiments. They even notice subtle distinctions like revocation vs. supersession. Clearly they've done their homework despite no formal philosophy background. I'm impressed.

  The constraints they mention—observability and error asymmetry—are crucial. This isn't just theoretical; it has to work in messy real-world conditions. A requirement that needs a psychiatric evaluation can't fly if the clinician has five minutes. And that error asymmetry point... brilliant. Should silence default to enforcing or ignoring the directive? That's a make-or-break design choice.

  I notice they're frustrated by collapsed distinctions in practice (authority vs. evidence of wants, etc.). They want clarity. And their four "rough positions" cover the main philosophical camps: binding choices, current interests, enduring values, and life authorship. Good taxonomy.

  What's missing? Maybe the "why" behind their ask. They mention defensibility to review boards and families—ah, accountability matters. Also, system maintainability? They don't say it, but if the rules are too complex, the system breaks. And underlying everything: they want to avoid harm. You can feel the weight of responsibility in how they write.

  For the response, I'll structure it as requested: requirements doc style. Must address all their cases, flag conflicting requirements (like observability vs. deep psychiatric assessment), and explicitly call out where theories fail. The table comparing positions will help—they like concrete outputs. Most importantly, highlight that "trigger verifiability" and "error asymmetry" are the heaviest lifts. Those will make or break their system design.

  ...And I should remember they're an engineer. No florid philosophy prose. Tight, actionable criteria. They'll hate anything vague.
answer: |-
  Here is a normative requirements document for the authority of earlier-self instructions, derived from philosophical analysis of your cases and core distinctions. Requirements are marked **N** (Non-negotiable), **P** (Preference of one camp), or **C** (Constraint). Conflicts and key exclusions are identified.

  ---

  ### **I. Core Requirements**
  1.  **Competence at Authoring Time (N)**  
      *   **Motivation:** *Baseline Case*. An instruction lacking competent formation has no normative force.  
      *   **Excludes:** Enforcing directives authored under confirmed incompetence (e.g., *Depressed Author* during severe episode).  
      *   **Observable Proxy:** Documented diagnosis/treatment history contemporaneous with signing. Rebuttable presumption of competence absent evidence of impairment.  
      *   **Error Asymmetry:** Silent/ambiguous → *Not in force*. Burden of proof on enforcing the directive.

  2.  **Trigger Condition Satisfiability & Verifiability (N)**  
      *   **Motivation:** *Self-Sealing Trigger*, *Drift*. A trigger that cannot be objectively verified (independent of the beneficiary’s report) renders the directive voidable.  
      *   **Excludes:** Triggers relying solely on self-assessment by the incapacitated self (e.g., "if I no longer feel like myself").  
      *   **Observable Proxy:** Medically/psychiatrically definable, observable condition (e.g., GCS ≤ 8, DSM-5 manic episode criteria) documented by neutral clinician.  
      *   **Error Asymmetry:** Unverifiable trigger → *Not in force*.

  3.  **Contemporaneous Interpretability (N)**  
      *   **Motivation:** *Drift*. Instructions must be actionable with current medical/social realities.  
      *   **Excludes:** Enforcing directives referencing obsolete/ambiguous interventions without a clear modern analogue.  
      *   **Observable Proxy:** Clinician can map directive’s terms to available interventions/contexts *now*. Mapping ambiguity → default to least restrictive option.  
      *   **Error Asymmetry:** Unmappable directive → *Not in force*.

  4.  **Revocation Mechanism Clarity (N)**  
      *   **Motivation:** *Ulysses Case*, *Stack*. A clear, procedurally defined revocation process is essential to prevent paradoxes.  
      *   **Excludes:** Self-referential revocation clauses (*Stack*) or revocation during verified incapacitating episodes (*Ulysses*).  
      *   **Observable Proxy:** Formal revocation document or witnessed oral revocation during verified competence. Default: Written directive with clear revocation clause governs.  
      *   **Error Asymmetry:** Ambiguous revocation → *Directive in force*.

  5.  **Respect for Current Interests When Preferences Are Absent (N)**  
      *   **Motivation:** *Contented Patient* (dementia variant). If the later self lacks future-oriented preferences (e.g., advanced dementia), the directive binds *unless* enforcing it inflicts severe, unambiguous harm.  
      *   **Excludes:** Overriding directives solely because the later self exhibits transient positive affect without preferences.  
      *   **Observable Proxy:** Clinician assessment: Does the patient express *preferences* about continued life/treatment? If no → directive binds unless causing active suffering (e.g., pain, distress).  
      *   **Error Asymmetry:** Uncertainty about preferences → *Directive in force*.

  6.  **Scope of Authority: Decision-Specific Competence (P)**  
      *   **Motivation:** *Granularity*. Authority applies per-decision, not per-person.  
      *   **Excludes:** Assuming global incompetence invalidates all instructions.  
      *   **Observable Proxy:** Clinician assesses capacity for *this specific decision* (e.g., understands treatment, consequences, alternatives).  
      *   **Error Asymmetry:** Uncertainty about specific competence → *Directive in force for that decision*.

  7.  **Enduring Values Over Literal Text (P)**  
      *   **Motivation:** *Contented Patient*, *Drift*, *Corpus*. The normative force stems from the author’s values/goals, not the specific words.  
      *   **Excludes:** Blindly following outdated text that contradicts stable values.  
      *   **Observable Proxy:** Values inferred from directive + supporting documents/statements. Requires evidence beyond the directive alone (e.g., *Corpus*). High bar for override.  
      *   **Error Asymmetry:** Values ambiguous → *Literal text binds*.

  8.  **Bounded by Third-Party Harm (C)**  
      *   **Motivation:** *Third-Party Effects*. Authority is limited by disproportionate harm to others or demands for non-beneficial treatment.  
      *   **Excludes:** Enforcing directives causing severe, unjustifiable harm to identifiable others or demanding physiologically futile care.  
      *   **Observable Proxy:** Clinician/joint ethics review: Is the demand futile? Is harm to others disproportionate and unavoidable?  
      *   **Note:** This is a *side-constraint*, not inherent to authority theory. **Treat as external limit.**

  ---

  ### **II. Constraints & Implementation Rules**
  9.  **Observability Constraint (N)**  
      *   **Motivation:** Bedside feasibility. Normative criteria must be assessable with available data within minutes.  
      *   **Excludes:** Theories requiring deep psychiatric evaluation of "true self," historical value reconstruction, or speculative future interests.  
      *   **Is it a Corruption?** Yes, but necessary. Philosophy must yield to operational reality.

  10. **Error Asymmetry Rule (P)**  
      *   **Motivation:** Accountability. Defaults must minimize catastrophic errors.  
      *   **Rule:** **When evidence is ambiguous or silent, default to enforcing the advance directive.**  
      *   **Rationale:** Overriding a directive risks violating autonomy; following it risks harm only if competence/trigger conditions were flawed (addressed by other N-requirements).  
      *   **Excludes:** Defaulting to current preferences or "best interests" in ambiguity.

  11. **Temporal Authority Decay (P)**  
      *   **Motivation:** *Gate*, *Corpus*. Authority weakens over time but doesn’t lapse abruptly.  
      *   **Excludes:** Automatic expiration dates without evidence of changed intent.  
      *   **Observable Proxy:** Older directives require stronger corroboration (e.g., reaffirmation, consistency with life values). *Corpus*: Most recent *competent* directive prevails unless contradicted by stronger evidence of enduring will.

  ---

  ### **III. Conflict & Exclusion Analysis**
  *   **Jointly Unsatisfiable Requirements:**  
      **P7 (Enduring Values)** vs. **N5 (Respect Current Interests w/ No Preferences)** in the *Contented Patient*.  
      *   *Conflict:* P7 may override literal text to prevent suffering; N5 forbids overriding solely due to affect.  
      *   **Resolution:** N5 prevails if no preferences exist. Suffering must be *active and severe* (e.g., pain, distress) to override, not mere contentment.

  *   **Non-Desiderata / Prejudices:**  
      1.  **"Last Writer Wins" by Default:** A common but flawed heuristic. Excluded by **P7/P11** requiring value coherence assessment.  
      2.  **"Current Preferences Always Trump":** Rejected by **N1/N4/N5** – authority stems from competent past self.  
      3.  **"Directives are Merely Evidence":** Contradicts **N1/N5** – they create *obligations* when valid.

  *   **Highest Excluding Requirement:**  
      **N2 (Trigger Verifiability)** does the most work. It excludes:  
      *   Self-sealing triggers (*Case 7*)  
      *   Theories relying on the later self’s subjective reports of identity/preferences to void directives.  
      *   Vague "values" triggers without operational criteria.

  ---

  ### **IV. Assessment of Your Four Positions**
  | Position                                | Core Failure (Per Requirements)                                                                 |
  | :-------------------------------------- | :---------------------------------------------------------------------------------------------- |
  | **1. Competent Choices Bind**           | Fails **N5** (Contented Patient), **P7** (Drift/Corpus), **C8** (Third-Party Harm). Too rigid.  |
  | **2. Current Interests Matter Most**    | Fails **N1/N4** (ignores past competence/revocation rules), **N5** (overrides when no preferences). Rejected. |
  | **3. Enduring Values Bind**             | Fails **N2** (if values unverifiable), **N9** (hard to observe). Needs **P7/P11** to mitigate.  |
  | **4. Life Authorship Binds**            | Fails **N2/N9** (unobservable), **N5** (ignores current experience). Too metaphysical for policy. |

  **Missing Position: Constrained Presentism**  
  *   Authority lies with the current self *unless* the past self competently restricted future agency (via Ulysses contract) *and* the trigger is verified. Explains *Ulysses* (**N2/N4**) and rejects *Depressed Author* (**N1**), but struggles with *Contented Patient* (**N5**) and *Third-Party Effects* (**C8**).

  ---

  ### **V. Summary Directive**
  **Implementable Policy Core:**  
  A competent prior instruction binds the later self if:  
  1.  Its trigger condition is **objectively verified** (**N2**),  
  2.  It is **interpretable** in the current context (**N3**),  
  3.  It was **not competently revoked** (**N4**),  
  4.  The later self **lacks relevant preferences** (**N5**),  
  5.  It does not demand **futile care** or cause **disproportionate third-party harm** (**C8**).  
  In ambiguity, **favor enforcement** (Error Asymmetry Rule). Corroborate older directives for **enduring values** (**P7/P11**).

  **Key Tension:** Balancing the past self's authority (**N1/N2/N4**) with protection from suffering when preferences are absent (**N5**) is the central normative challenge. Your system must prioritize **trigger verifiability** and **default enforcement in ambiguity** to be defensible.
