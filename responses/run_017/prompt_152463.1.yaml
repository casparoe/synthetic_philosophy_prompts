answer: |-
  ### Scenario
  A population of cliff-nesting seabirds (*Uria aalge*) inhabits a volcanic archipelago. Their dense plumage (trait **T**) evolved for thermal insulation (**F**) in cold oceanic climates. Fifty generations ago, a volcanic eruption covered the islands in dark ash, drastically reducing predation by making light-colored birds conspicuous against the new backdrop. Over time, predators eliminated all light-plumaged variants; **T** is now fixed. The birds’ plumage remains dark due to developmental canalization, but it no longer provides superior insulation (ambient temperatures rose post-eruption). Instead, **T** now robustly enables camouflage against the ash (**G**), enhancing individual survival by reducing detection. **T** can malfunction: oil contamination destroys its light-absorbing properties, increasing predation. Insulation remains poor but adequate.

  ---

  ### Accounts and Relativization
  - **Selected-effect (SE) account**: Wright/Neander-style. Function requires past selection *for* the effect.
  - **Causal-role (CR) account**: Cummins-style. Function is **T**’s contribution to a containing system’s capacity, relativized here to the *organism’s capacity to survive predation in its current environment*. This is "natural" as predation is the dominant fitness determinant.

  ### Verdicts and Reasoning
  - **SE verdict**: **T**’s function is **F** (insulation).  
    *Reasoning*: **T** was selected *for* **F**, which explains its fixation. **G** (camouflage) is a post-fixation beneficial effect but lacks selection history; it arose from environmental change, not selection pressure.
  - **CR verdict**: **T**’s function is **G** (camouflage).  
    *Reasoning*: **T** stably contributes to the organism’s survival capacity by enabling concealment. Malfunction (oil contamination) disrupts this contribution, confirming **G** as the systemic role.

  ---

  ### Key Feature and Its Removal
  The **environmental shift without genetic accommodation** drives divergence. **T** was fixed for **F**, but **G** became critical in a new context without further selection.  
  - *If heritable variation is restored*: SE theorists might argue **G** could become a function via new selection, collapsing disagreement.  
  - *If environment unchanged for 1000+ generations*: **G** might acquire SE function, aligning accounts.  
  - *If CR relativized to thermoregulation*: CR would call **F** the function, but this is unnatural—camouflage now dominates survival.

  ---

  ### Strongest Reply from SE Theory
  SE defenders argue: (1) **G** is merely a "fortuitous effect" or "contribution," not a *function*; (2) CR conflates function with causal role; (3) malfunction intuitions are misapplied—**T** malfunctions *as insulation* if damaged, but here it "works" for **F** (poor insulation is environmental).  
  *Resisted*: (1) and (2) are reassertions, not rebuttals; the case ensures **G** is non-accidental. (3) fails: **T** *can* malfunction w.r.t. **G** (oil impairs camouflage), and SE cannot explain why this matters biologically.  
  *Not resisted*: If SE adopts "differential retention" (e.g., Garson), **G** might qualify as a function—but mainstream SE rejects this.

  ---

  ### Closing
  **This case shows extensional divergence in the actual world, but also confirms the accounts answer distinct questions: SE addresses historical origins, CR addresses current systemic integration.**
