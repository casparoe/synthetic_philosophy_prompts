prompt: |-
  I run the outpatient mental health service at a hospital trust, and from next quarter we begin using a newly approved diagnostic category at routine intake — call it Compulsive Digital Engagement, CDE. I have to audit how the category is behaving every quarter, and those audits decide real things: whether to narrow or widen the criterion set, whether to keep screening for it at intake, and how many therapy sessions get funded, because the code is what unlocks funding. I know Ian Hacking's work on the looping effects of human kinds and want it turned into something my team can run.

  Write me the procedure: an ordered checklist or flowchart in words that a clinician with no philosophy background can work through in a twenty-minute review, using only data we actually have — coded prevalence, referral letters, free-text intake notes, waitlist and session counts. Give the questions in order, what counts as a sufficient answer to each, the point where the procedure stops with a no and refuses to revise the criteria on the evidence available, and the points where it must hand the decision to a person because it is a question of values rather than fact. Preserve the one distinction that does the real work: between a category that tracks a condition indifferent to being classified and one whose introduction changes how the people classified experience, present, and describe themselves, and so changes the very evidence you would use to check it. Say which further distinctions you are keeping and which you are dropping, and why.

  Two loops here are not in the standard cases. An automated screener suggests the code at intake; it was trained on our own notes from last year, so it learns whatever the label has already done to how we write. And the funding rule is itself a loop, since clinicians know that coding CDE is what gets a patient sessions.

  Then apply the procedure to three quarters, in under 800 words in total: intake narratives increasingly reproducing the criterion set's own wording; prevalence up forty percent with referrals and waitlists flat and notes saying the code was used to secure sessions; and the screener flagging patients whose notes contain none of the criterion symptoms but who resemble earlier flagged patients in demographics and service history. If in the second case the honest result is that prevalence has stopped being evidence and that narrowing the criteria would cut some patients off from funded sessions, say so plainly. Close with what the procedure cannot do.
reasoning: |-
  Okay, the user is running an outpatient mental health service and needs to implement a new diagnostic category, CDE. They want a practical procedure based on Ian Hacking's looping effects theory, tailored for clinicians without a philosophy background. The audit will use real data like prevalence, referral letters, intake notes, waitlists, and session counts. 

  First, I need to recall Hacking's concept of "looping effects" where classifying people can change their behavior and self-perception, thus altering the very phenomena being classified. The user mentioned two unique loops: an automated screener trained on past notes (which may already reflect labeling biases) and a funding incentive where coding CDE unlocks therapy sessions. 

  The procedure must distinguish between:
  - A stable category (tracking a condition unaffected by classification)
  - A reactive one (where the label changes patient presentations and clinician documentation)

  The user wants clear stopping points where evidence is insufficient and flags for value-based decisions. They also provided three quarterly scenarios to test the procedure.

  Key challenges:
  - The screener's training data might be contaminated by prior labeling effects
  - Clinicians might over-diagnose CDE to secure funding
  - Patients might learn to present symptoms matching CDE criteria

  I'll structure the procedure as a linear checklist with:
  1. Binary questions
  2. Clear exit points
  3. Handoff to human judgment when values are involved

  For the quarterly tests:
  - Quarter 1: Intake notes parrot diagnostic wording → suggests looping
  - Quarter 2: Prevalence spikes without referral increases + notes reveal diagnostic gaming → funding incentive loop
  - Quarter 3: Screener flags non-symptomatic patients → algorithmic bias reinforcing prior patterns

  Critical distinctions to preserve:
  - Reactive vs indifferent categories (core to Hacking)
  - Data artifacts vs real prevalence changes

  Dropped distinctions:
  - Individual vs institutional looping (too granular for audits)
  - Intentional vs unintentional effects (hard to prove with data)

  The procedure must acknowledge when prevalence becomes uninterpretable (e.g., Quarter 2) and explicitly call out funding-induced distortions. It should also limit revisions when evidence is compromised.

  Finally, the conclusion will note limitations: can't measure patient self-conception shifts directly, can't resolve funding ethics, and can't audit the screener's training data retroactively.
answer: |-
  ### CDE Audit Procedure: Looping Effects Checklist  
  *(20-min quarterly review using: coded prevalence, referral letters, intake notes, waitlist/session data)*  

  **Preserved Distinction**: **Reactive vs. Indifferent Categories**  
  - *Indifferent*: CDE prevalence/features stable despite classification (tracks a fixed reality).  
  - *Reactive*: CDE prevalence/features shift *because* of labeling (category changes behavior/descriptions).  
  *Dropped*: Hacking’s "interactive kinds" sub-types (e.g., institutional vs. individual effects). *Why?* Unverifiable with clinical records; we focus on observable data shifts.  

  **Checklist Flow**  
  1. **Is coded CDE prevalence rising >10% QoQ?**  
     - *Sufficient answer*: Yes + referrals flat/down → Proceed to Q2.  
     - *No/Flat/Correlated with referrals* → Stop: **No revision needed** (indifferent signal).  

  2. **Do intake notes increasingly mirror CDE criteria wording?**  
     - *Check*: Random sample of 10 CDE-coded notes. Count verbatim criterion phrases (e.g., "loss of control over scrolling").  
     - *Sufficient answer*: ≥7/10 notes use template language → Indicates **reactivity** (patients/clinicians adopting label). Proceed to Q3.  
     - *≤2/10* → Stop: **No revision** (minimal looping).  

  3. **Are notes/sessions linked to funding incentives?**  
     - *Check*: Search CDE notes for "funding," "sessions," or "approval." Cross-check session counts per CDE vs. non-CDE.  
     - *Sufficient answer*: Explicit mentions *or* CDE sessions >2× non-CDE → **Funding loop confirmed**. Proceed to Q4.  
     - *Absent* → Handoff: **Human judgment** (values: is gaming acceptable to secure care?).  

  4. **Is the screener flagging non-criterion cases?**  
     - *Check*: 10 false-positive CDE flags (per notes). Demographics/service history match prior CDE?  
     - *Sufficient answer*: ≥8/10 lack criteria but match past CDE → **Algorithmic reinforcement loop**. → **Handoff: Human judgment** (values: fairness vs. resource efficiency).  
     - *≤2/10* → **Revise criteria** (non-reactive; tighten if overdiagnosis suspected).  

  **Key Exit Points**  
  - **Stop** at Q1/Q2 if no reactivity signs (no revision).  
  - **Stop** if Q2 shows minimal template language (no revision).  
  - **Handoff to human** at Q3/Q4 (values-based decisions).  

  ---

  ### Quarterly Audit Application (800 words)  
  **Quarter 1**  
  - *Data*: CDE prevalence ↑12%; referrals ↓5%. Intake notes: 8/10 sampled use phrases like "compulsive engagement as defined in screening."  
  - *Procedure*: Q1 → Yes (prevalence up, refs down). Q2 → Yes (template language dominant).  
  - *Result*: **Reactivity confirmed**. Proceed to Q3. Notes lack funding mentions; session counts normal. Q3 → Handoff deferred. **Action**: Monitor funding cues.  

  **Quarter 2**  
  - *Data*: CDE prevalence ↑40%; referrals flat. Waitlists stable. Notes: "Coded CDE to secure 8 sessions" in 30% of files. CDE sessions average 8 vs. non-CDE average 3.  
  - *Procedure*: Q1 → Yes. Q2 → Yes (template language persists). Q3 → Explicit funding motives + session disparity.  
  - *Result*: **Funding loop dominates**. Prevalence is now **non-evidentiary**—driven by incentives, not pathology. Narrowing criteria would cut funded sessions. **Handoff to human**: Should we accept this to maintain access? Audit stops; no criteria revision possible without value call.  

  **Quarter 3**  
  - *Data*: Prevalence ↑15%. Screener flags surge; 9/10 false positives show no CDE symptoms but match prior CDE in: age (16–24), prior anxiety Dx, 2+ past service episodes.  
  - *Procedure*: Q1 → Yes. Q2 → Template language steady. Q3 → No funding mentions. Q4 → Yes (screener echoes historical patterns, not symptoms).  
  - *Result*: **Algorithmic reinforcement loop**. Criteria don’t fit, but system perpetuates label. **Handoff to human**: Revise screener? (efficiency) Or accept overdiagnosis to serve high-risk demos? (equity).  

  ---

  ### What the Procedure Cannot Do  
  1. **Measure patient self-conception**: Cannot detect if patients "become" CDE after diagnosis (no post-diagnosis data).  
  2. **Disentangle screener bias**: Training on past notes inherits prior loops; audit can’t reset this.  
  3. **Resolve funding ethics**: Flags incentives but cannot decide if gaming is justified.  
  4. **Capture subtle reactivity**: Minor narrative shifts or clinician framing changes may be missed in note sampling.  

  **Final Output**: A focused audit isolating reactivity using operational data, forcing value decisions upstream. Revise only when evidence is non-reactive.
