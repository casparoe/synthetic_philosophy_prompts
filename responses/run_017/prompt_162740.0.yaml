prompt: |-
  I'm a senior at a large public high school. This year I've been on the debate team and, separately, doing an independent reading project on assisted dying, which has meant arguing both sides of the question for most of eight months. I keep noticing one shape of argument and I don't have a word for it. I'd be glad of the name if there is one, but what I actually want is to know exactly what I'm looking at, so please don't stop at a label.

  Here is the pattern. Take the number of people who actually use the law once it exists. When that number is small, supporters say: this is mostly reassurance, the safeguards are working, the alarm was overblown. Opponents say: a practice used this rarely cannot be worth the risk of a single mistake. When the number rises, supporters say: at last the people who were suffering in silence are getting what they asked for, and the earlier low figures only showed how many obstacles stood in the way. Opponents say: this is exactly what we warned about, the practice is spreading beyond the group it was supposed to serve. One quantity, moving in either direction, and both sides come away confirmed.

  Second instance, different quantity: how many people withdraw a request for assisted death after they get good palliative care. A high rate means, to opponents, that such requests are unstable and that we would be killing people who would have changed their minds; to supporters, it means the screening is doing its job and those who remain are the settled ones. A low rate means, to supporters, that requests are stable and considered; to opponents, that the screening is a rubber stamp. Again, both directions get claimed.

  Third instance, which I suspect is a different animal: the number of deaths that do not go as intended, where the person takes far longer than expected. Opponents treat anything above zero as decisive. Supporters say the number is too small to carry weight and that we cannot observe the person's experience anyway. Here the disagreement is not about which way the number points but about whether it can be taken at all.

  Last semester I tried to fix this. Before looking at any figures, I asked people on both sides which way the number would have to come out for them to reconsider. Almost no one could answer — not "it would have to be enormous," but no direction at all.

  So my questions. Does this configuration have an established name: an indicator that both sides agree in advance is relevant and that then supports both sides whichever way it comes out? I know about confirmation bias and motivated reasoning and I don't think that is quite it, since those are claims about how people reason toward a conclusion they already hold, whereas what I am describing looks like a property of the number itself — as though, given how loose the surrounding story is, both readings are reasonable. But then I notice the same people praising low numbers in one year and rising numbers years later, which makes me think it is spin after all. Is it a double standard or special pleading, or is that the wrong frame? How is it different from an ordinary disagreement about what follows from a fact, from a slippery-slope argument, and from a claim that is simply unfalsifiable? Is the defect in the reasoners or in the evidence? What property would an indicator have to have in order not to be claimable by both sides, and does the inability to name a direction that would count against you show anything, or only that someone lacks imagination? Please also give me the edges: two cases that look like this one but aren't, and one that is an instance but doesn't look like one. If there is no established term, coin one and define it. Please write in American English.
reasoning: |-
  Okay, this is a fascinating and sophisticated question from a high school senior. The user has clearly done deep work on both debate techniques and assisted dying ethics, and they're noticing a specific argumentative pattern that troubles them. 

  Let me unpack what they're describing: it's about how quantitative evidence gets interpreted in polarized debates. The core observation is that for certain metrics (like usage rates of assisted dying laws), both sides can spin the number to support their position regardless of whether it increases or decreases. 

  What makes this particularly interesting is how the user has already tested it experimentally by asking advocates what evidence would change their minds - and found they couldn't name any. That shows remarkable intellectual rigor for someone their age.

  The user wants more than just a label - they want to understand the mechanics of this phenomenon. They're specifically asking how it differs from related concepts like confirmation bias or unfalsifiability, and whether the flaw is in the reasoning or the evidence itself.

  Hmm... the third example they give (about botched procedures) seems different because there's no bidirectional interpretation - opponents treat any occurrence as significant while supporters dismiss its relevance entirely. That's worth distinguishing.

  I should acknowledge how perceptive it is to notice that this pattern makes evidence functionally useless for resolving disagreement. The user is essentially describing a failure mode of evidence-based policy debates.

  For the "edges" they requested: an opposite case would be something like fever as an infection indicator - high always means one thing, low another. And a disguised version might be arguments about GDP growth, where both sides claim any number supports their economic philosophy.

  The coinage "Janus-Faced Indicator" feels right because like the two-faced god, these metrics look in both directions simultaneously. It captures how the same evidence gets claimed by opposing sides.

  What's impressive here is how the user recognizes this isn't just simple hypocrisy - there's often a kernel of plausible reasoning behind each interpretation. That's why distinguishing it from mere motivated reasoning is important.

  They're also hinting at a deeper question about what makes good evidence in moral debates. Maybe I should emphasize that the problem isn't the numbers themselves, but how loosely they're connected to the underlying values conflict.
answer: |-
  This is a remarkably astute observation of a pervasive problem in polarized debates. What you're describing doesn't have a single, universally accepted name, but it's well-studied and can be precisely characterized. Let's break it down step by step.

  **Core Concept & Name:**
  The pattern is best described as **Interpretive Flexibility of Ambiguous Indicators (or Janus-Faced Indicators)**. The key property is that the *meaning* assigned to a quantitative indicator is fundamentally ambiguous and disconnected from its actual value *in advance*. Both sides have pre-existing narratives flexible enough to accommodate any plausible outcome, rendering the indicator **non-decisive**.

  **Why "Confirmation Bias" and "Motivated Reasoning" Aren't Quite Enough:**
  *   **Confirmation Bias/Motivated Reasoning:** Focus on how people *seek* or *interpret* evidence *to support* a pre-existing belief. Your observation goes deeper: it's about how the structure of the debate itself creates indicators where *any outcome can be plausibly interpreted* to support either side. The ambiguity is built into the indicator's relationship to the core value conflict. It's not just *how* people reason *towards* their conclusion; it's that the *defined metric itself lacks a unidirectional link to the underlying values*.

  **Analysis of the Pattern:**

  1.  **The Core Defect:** The fundamental problem lies in the **lack of a shared, falsifiable theory linking the indicator directly and unambiguously to the core value proposition** (e.g., "Does this law cause net harm or net benefit?"). Instead:
      *   Supporters link the indicator to concepts like "access," "relief," "proper functioning of safeguards."
      *   Opponents link it to concepts like "risk," "slippery slope," "instability," "failure of safeguards."
      *   The indicator (number of users, withdrawal rate) is only *indirectly* related to these concepts, and the *direction* of that relationship is interpreted through the lens of the core belief.

  2.  **How It Works:**
      *   **Ambiguous Significance:** The indicator isn't inherently diagnostic. Is a low usage rate good (safeguards working) or bad (access denied)? The answer depends entirely on the interpreter's prior framework.
      *   **Narrative Flexibility:** Both sides have narratives constructed to explain *any* plausible value. A change in the value doesn't test the core belief; it simply triggers the application of the pre-existing narrative for that outcome.
      *   **Non-Falsifiability (of the interpretive framework):** The *interpretation* of the indicator becomes effectively unfalsifiable because any outcome can be explained. It's the interpretive framework shielding the core belief.

  3.  **Difference from Related Concepts:**
      *   **Ordinary Disagreement about Implications:** This involves arguing about *what a clear fact means* for a conclusion (e.g., "Does a 1% complication rate prove the procedure is unsafe?"). Your case involves *defining what the fact signifies in the first place* ("Does a low usage rate signify safety or inaccessibility?").
      *   **Slippery Slope Argument:** This is a *predictive* argument ("A will lead to B, which is bad"). Your pattern is about *interpreting observed data* after the fact to fit a narrative, which might *include* a slippery slope claim ("Rising numbers prove the slope is slippery!") but isn't limited to it.
      *   **Unfalsifiable Claim:** A claim that cannot be tested *at all* (e.g., "Invisible unicorns control the weather"). Your pattern involves *falsifiable claims about the indicator itself* ("Usage is low"), but the *meaning* assigned to that fact is unfalsifiable *within the debate framework* because interpretations are predefined for all outcomes.
      *   **Double Standard/Special Pleading:** This involves applying different rules to similar situations based on self-interest. Your pattern is more systemic: it's the *structure of the debate* around the indicator that *inherently* generates interpretations favoring each side, often without conscious hypocrisy. Participants genuinely see their interpretation as the "obvious" one given the outcome.

  4.  **Defect: Reasoners or Evidence?** It's **both**, but primarily in the **framing of the debate and the choice of indicator**.
      *   **Evidence:** The chosen indicator (usage rate, withdrawal rate) is often a *proxy* for the real values at stake (autonomy, safety, sanctity of life). Proxies are inherently ambiguous. The indicator itself might be perfectly valid data, but its *relevance* and *interpretation* are contested.
      *   **Reasoners:** Participants engage in motivated reasoning *because* the indicator is ambiguous. Their core values shape which interpretive lens they apply. The inability to specify a falsifying condition for their *interpretation* is a failure of intellectual honesty or critical examination of their own framework.

  5.  **Properties of a "Good" (Non-Claimable) Indicator:**
      An indicator would resist this pattern if it had:
      *   **Unidirectional Interpretation:** A clear, shared understanding of what movement *means* relative to the core value conflict. (e.g., "Increasing complication rates *always* indicate a safety problem" - though even this can be spun with effort).
      *   **Direct Link to Core Value:** Measuring something much closer to the actual harm/benefit being debated (e.g., rigorously documented cases of *proven* coercion or *proven* unbearable suffering relieved *only* by assisted death – though these are incredibly hard to measure).
      *   **Pre-Defined Thresholds:** Agreement *in advance* on what values would constitute success, failure, or a need for reevaluation. (e.g., "If withdrawal rates fall below X%, we agree safeguards are failing").

  6.  **Significance of Inability to Name a Falsifying Condition:**
      This is **highly significant**. It strongly suggests:
      *   The position isn't genuinely evidence-based; it's value-driven and the evidence is used rhetorically.
      *   The interpretive framework is closed and unfalsifiable.
      *   The person hasn't critically examined the limits of their own reasoning or the ambiguity of the indicator. It demonstrates a lack of commitment to using evidence to *test* belief, only to *support* it.

  **The Edges (As Requested):**

  1.  **Looks Similar But Isn't: "Fever as an Infection Indicator"**
      *   **High Fever:** Almost universally interpreted as strong evidence of significant infection/problem (Supporters of "sick theory" confirmed).
      *   **Low/No Fever:** Interpreted as evidence of no significant infection (Supporters of "not sick theory" confirmed). *Seems* bidirectional claim.
      *   **Why it's Different:** The interpretations are *unidirectional and shared*. High always points to sickness being likely, low always points to sickness being less likely. There's a pre-existing medical theory strongly linking the indicator to the condition. It's diagnostic, not ambiguous. A doctor wouldn't say "High fever proves my 'sick' theory, *and* low fever also proves my 'sick' theory because the body is fighting so well it's suppressing it!" (unless in very specific contexts like immunocompromise, which *are* defined ambiguities).

  2.  **Looks Similar But Isn't: "GDP Growth & Economic Policy"**
      *   **High GDP Growth:** Party A says "Our policies work!" Party B says "Growth is unsustainable/unequal!"
      *   **Low GDP Growth:** Party A says "Global factors/opposition sabotage!" Party B says "Their policies failed!"
      *   **Why it's Different:** While spin exists, GDP growth *does* have a generally agreed directional link to economic health *in mainstream economics*. The disagreement is more about *causation* (whose policies caused it?), *sustainability*, *distribution*, or *secondary indicators* (inflation, employment). The core link "higher growth is generally better than lower growth" is less ambiguous than your examples. The spin is more about attribution and context than redefining the core meaning of the indicator itself based on its value.

  3.  **Is an Instance But Doesn't Look Like One: "Public Opinion Polls on a Controversial Issue"**
      *   **Polls Show Majority Support:** Supporters say "The people have spoken, implement the policy!" Opponents say "Polls are unreliable/mislead/the majority is wrong on this complex moral issue."
      *   **Polls Show Majority Opposition:** Supporters say "Polls are unreliable/politically skewed/people are misinformed, the policy is still right." Opponents say "The people have spoken, reject the policy!"
      *   **Why it Fits:** The *meaning* and *weight* assigned to the poll result (majority support/opposition) is entirely flexible based on the pre-existing stance. Supporters interpret polls favorably to their cause regardless of outcome ("We have a mandate" OR "Polls don't matter, principle does"). Opponents do the same ("Polls show danger" OR "Polls show the policy is unpopular/unjust"). The poll result itself becomes a Janus-Faced Indicator for the legitimacy or wisdom of the policy.

  **In Conclusion:**

  You've identified a profound flaw in how evidence is often used in morally charged, complex policy debates: **Interpretive Flexibility of Ambiguous Indicators (Janus-Faced Indicators)**. The quantitative metric is chosen as a proxy for deeper values, but the link is so loose and contested that any plausible outcome can be interpreted to confirm either side's worldview. The core issue is the lack of shared, falsifiable criteria linking the indicator unambiguously to the underlying value conflict. The inability of advocates to specify what evidence *would* falsify their interpretation of the indicator reveals that the evidence isn't truly being used to test their belief, but only to adorn it. This pattern highlights the limits of quantitative data alone to resolve deep-seated ethical disagreements where fundamental values and interpretive frameworks clash.
