answer: |-
  ## JOINT MEMORANDUM  
  **Subject:** Interpretative Framework for Model Assumptions Following the Twelve-Year Review  
  **Authors:** Maya Halden, Director, Systemic Risk Modelling Division | Joseph Ahlgren, Senior Advisor, Model Validation Unit  
  **Date:** 15 Vendémiaire, Year 13 M.R.A.  
  **To:** Independent Review Panel, Marlund Reserve Authority  

  ### Preamble (Institutional Voice)
  This document represents the joint assessment of Dr. Halden and Dr. Ahlgren, as mandated by the Review Panel. It addresses the implications of the recent liquidity event for the evaluation of model assumptions within the Authority’s capital-buffer framework. We focus on principles applicable beyond the specific failure of the Halden contagion model, aiming for clarity accessible to the Board of Governors. Technical terms are defined upon first use.  

  ### Section 1: Agreed Principles (Numbered Claims)
  1.  **Models are Instruments, Not Descriptions:** All policy models are tools designed for specific tasks (e.g., predicting capital shortfalls under stress). Their value lies primarily in their *performance* for those tasks within defined operational boundaries, not in providing a complete or literal picture of reality.
  2.  **Assumptions are Necessary Simplifications:** Every model omits details of the real world. This selectivity ("idealization") is unavoidable and often beneficial for focus and computation. Calling an assumption "unrealistic" is uninformative; *all* assumptions are unrealistic by virtue of being selective. The critical question is *how* this selectivity impacts the model’s purpose.
  3.  **Performance Validation is Necessary but Insufficient:** Observing that a model produces accurate outputs (e.g., correct stress numbers for 11 years) validates its utility *for that task in that historical context*. However, such success does not guarantee understanding *why* it worked, nor does it guarantee future performance if the context shifts.
  4.  **Calibration Absorbs Uncertainty:** When a model fits historical data well, part of this fit arises from adjusting its parameters ("calibration"). This process inherently compensates for errors introduced by false assumptions. Therefore, good historical performance alone cannot prove that a specific false assumption was harmless or beneficial.
  5.  **The "Neighbouring Domain" Problem:** Models validated in one context (e.g., Marlund's interbank market structure over 12 years) may fail unpredictably when applied to a similar but distinct context ("neighbouring domain"), such as a jurisdiction with different settlement rules or during a novel type of stress. Past success offers limited guidance for these transitions.
  6.  **Omissions Create Future Obligations:** Omitting a factor (e.g., liquidation time) creates a potential vulnerability. While not every omission needs immediate reversal, responsible modelling requires knowing *what* was omitted and having a conceptual or technical plan for how it *could* be reintroduced if evidence suggests it becomes critical. Ignoring known omissions accumulates risk.
  7.  **Auditability Requires Transparency of Logic:** An assumption is **auditable** only if its role within the model's logic chain is explicitly defined and traceable. It must be clear *why* the assumption was made (e.g., computational necessity, focus) and *what aspect of reality* it simplifies or replaces. Assumptions justified solely by output fit are not fully auditable.

  ### Section 2: Residual Disagreements (Table)

  | Neutral Statement of Disagreement                                                                                                | Halden's Formulation                                                                                                                                                                | Ahlgren's Formulation                                                                                                                                                               | The Crux                                                                                                                                                          | Shared Case/Computation                                                                                                                                 | Halden's Prediction                                                                                         | Ahlgren's Prediction                                                                                         |
  | :------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- |
  | **What credit does a false assumption deserve when the model performs well?**                                                    | A false assumption contributing to consistent predictive success earns **surrogate credit** (the share of success attributable to the assumption's specific simplification).         | Consistent success stems overwhelmingly from calibration absorbing errors; the false assumption itself earns negligible **surrogate credit** (success belongs to the tuning process). | Does the *specific form* of the false assumption contribute positively to the model's performance, or is it merely tolerated/overcome by calibration?             | Analysis of the Halden model's sensitivity to variations in the liquidation assumption *during the 11 stable years*, holding calibration constant.       | Significant surrogate credit for the liquidation assumption (e.g., model breaks significantly if assumption changed). | Negligible surrogate credit (e.g., model can be re-calibrated with alternate assumptions to fit the same data). |
  | **Does the existence of multiple incompatible assumptions yielding the same output diminish the significance of any single one?** | Yes. If Assumption A (frictionless liquidation) and incompatible Assumption B (e.g., fixed liquidation delay) both yield identical outputs when calibrated, neither describes the true mechanism; the model captures a pattern, not structure. | No. While multiple assumptions *can* fit the same data, the *specific choice* remains critical. Its falsity points directly to omitted factors whose reinsertion path (or lack thereof) defines model maturity. | Does good fit imply the model is agnostic to the underlying mechanism, or does the *chosen* idealization inherently shape the path for future refinement and domain extension? | Constructing two distinct contagion models (one with frictionless liquidation, one with a fixed 2-day delay), both calibrated to perfectly replicate the 11-year Halden outputs. | The models are functionally equivalent for the original task; the choice between A and B is pragmatic, not mechanistic. | The two models represent fundamentally different idealizations; their behaviour will diverge sharply under novel stresses or when adding further complexity. |
  | **What constitutes valid progress in de-idealizing a model?**                                                                    | Progress is measured by improved predictive accuracy or expanded domain applicability. The **convergence ladder** (sequence of models adding back omitted factors) need not show monotonic improvement; a "better" model might be less complex. | Valid de-idealization requires the **convergence ladder** to show a clear, controlled path towards greater verisimilitude. Predictions should approach observed behaviour, and qualitative shifts should be anticipated and explainable. | Is the goal of de-idealization primarily *pragmatic* (better performance) or *epistemic* (better understanding/representation)?                                  | Projection: Building a 3-rung ladder for the contagion model (R1: Halden base; R2: + variable liquidation time; R3: + price impact feedback). Predicting Year 12 outcome at each rung. | R1 failed; R2 & R3 accuracy uncertain, but R3 may not outperform a well-calibrated simpler model.          | R1 fails; R2 shows improvement but significant error; R3 converges closely on the observed Year 12 outcome. |
  | **Does past success in Marlund support using the *identical* model elsewhere?**                                                  | Limited support. Success suggests the model captures *some* robust patterns of contagion, but transfer requires evidence the new domain operates similarly regarding the core idealizations. | Strongly cautions against it. Success was contingent on Marlund's specific structure compensating for the omissions. The **de-idealization debt** (backlog of known omitted factors like settlement friction) is too high for blind transfer. | How heavily does the **de-idealization debt** incurred in the original domain weigh against the model when considering new domains?                               | Comparing the Halden model's predictions against a jurisdiction with slower settlement times *prior* to any local calibration, using pre-Year 12 parameters. | Model may show directional accuracy but significant quantitative error, requiring re-calibration.          | Model likely produces nonsensical or highly misleading results due to unaddressed settlement friction.    |
  | **What does "auditable" fundamentally require for an assumption?**                                                               | Auditability requires documenting the *purpose* of the assumption (what computational or focus problem it solves) and its *operational consequence* within the model logic.          | Auditability requires the above *plus* a documented link to the omitted reality and a defined pathway (even if not yet implemented) for its potential future reintroduction.          | Does auditability stop at transparency of *internal function*, or must it extend to transparency of *external correspondence* and potential reversibility? | Reviewing the original documentation for the Halden model's liquidation assumption.                                                                     | Original docs (purpose: computational tractability; consequence: zero contagion delay from asset sales) suffice. | Original docs are insufficient; lack of documented link to real-world liquidation processes & reversal plan constitutes an audit failure. |

  ### Section 3: Conceded Verbal Disputes
  1.  **"Unrealistic Assumption":** We agree this phrase is generally unhelpful and has caused unnecessary confusion. All assumptions are "unrealistic." The meaningful debate concerns *how* the selectivity inherent in an assumption impacts model performance, robustness, and extensibility, not whether it is "true."
  2.  **"The Model Failed":** We agree the core failure was the model's inability to predict the capital shortfall within tolerance *under the specific stress conditions encountered*. Debates over whether this constitutes a failure of the "core theory" or merely its "implementation/calibration" are semantic and unproductive for policy purposes. The tool did not perform its mandated task.

  ### Closing Paragraph (Joint Signature)
  **Halden Concession:** The instrumentalist stance, rigorously applied, risks complacency. Eleven years of success obscured the **de-idealization debt** accumulating around the liquidation assumption. While the falsity of assumptions isn't inherently fatal, the *failure to rigorously map the boundaries where those falsities would become critical* is a profound failure of risk management. We must systematically identify and monitor key idealizations, treating them as known vulnerabilities, not mere conveniences. Blind trust in historical calibration is negligence.  
  **Ahlgren Concession:** The demand for immediate, comprehensive de-idealization is often impractical and can paralyze necessary action. The Halden model served a vital function for over a decade. Insisting on a complete **convergence ladder** before deployment ignores the urgent need for decision-support tools. The primary obligation during stable periods is not necessarily building every rung of the ladder *immediately*, but maintaining a clear, auditable inventory of the **de-idealization debt** and establishing triggers for when specific rungs *must* be constructed due to changing conditions or emerging risks. Pragmatism must temper the pursuit of perfect representation.  
  **Joint Conclusion:** Model stewardship requires acknowledging both instrumental utility and epistemic responsibility. We recommend establishing a formal register of **de-idealization debts** for all critical policy models, linked to explicit review triggers, and mandating that **auditability** criteria encompass not just internal logic but also the documented relationship between key idealizations and the reality they simplify, including potential reversal pathways. Future validation must explicitly assess **surrogate credit** and the robustness of conclusions across potential **convergence ladder** variants.

  **Signed,**  
  _Maya Halden_  
  _Joseph Ahlgren_  

  ---
  **Word Count:** ~1,480
