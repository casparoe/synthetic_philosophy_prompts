answer: |-
  Here’s a reading structured around your distinctions, grounded in the film’s dramatization, with clarity on what’s contested in TJ scholarship and where the film speculates beyond standard frameworks. I’ll avoid citations, foreground tensions, and mark speculative claims explicitly.

  ---

  ### **I. Your Distinctions in the Film’s World**
  **A. The Unsayable Residue**  
  - **Dramatized**: The film centers evidence that *cannot* be translated into judicial or truth-commission testimony.  
    - Espósito’s realization about Gómez’s obsession with Morales’s wife stems from scrutinizing a photo (Gómez’s gaze, not a fact).  
    - The "pattern" of Gómez haunting Morales’s life is felt, not provable—a constellation of glances, silences, and implied threats.  
  - **Formal Argument**: The film’s aesthetics (close-ups on eyes, recurring photographs, Espósito’s narrative paralysis) insist this residue is the *core truth*. It’s morally legible ("we know he did it") but legally inert. A truth commission demanding propositional facts (who, when, where) would miss it entirely.  
  - **Contested in TJ Scholarship**: Whether non-propositional knowledge *matters* institutionally is debated. Some argue TJ must prioritize actionable truths; others (like your residue concept) stress that emotional/embodied knowledge is central to victimhood. The film sides with the latter.  

  **B. The Acknowledgement Hostage**  
  - **Dramatized**: Morales is doubly denied acknowledgement:  
    - **Pre-transition**: The corrupt 1970s state buries the case, freeing Gómez. The perpetrator retains power to withhold admission.  
    - **Post-transition Implication**: When Espósito revisits the case decades later, Gómez’s impunity persists. The state (now democratic?) employs him—making it complicit in silencing him. Gómez’s veto is structural.  
  - **The Ending as Inversion**: Morales’s imprisonment of Gómez isn’t a "solution" but a grotesque parody of state failure. He replaces the state’s refusal to punish with a refusal to *acknowledge*: Gómez is silenced, isolated, denied any chance to confess or explain. This isn’t justice but despair—a literalization of the hostage dynamic (Gómez now physically captive, yet still withholding words). The film suggests that when the state vacates its role, victims may seek control over the acknowledgement, perverting it into vengeance.  

  **C. The "Captured Addressee" (A Third Wrinkle)**  
  The state isn’t just absent; it absorbs the perpetrator. Gómez becomes a petty bureaucrat, symbolizing institutional corruption’s continuity. The entity Morales appeals to *is* Gómez’s protector. This deepens the hostage dynamic: the wrongdoer and the state are conflated, voiding any hope of institutional address.  

  ---

  ### **II. Where Your Distinctions Might Distort (or Where the Film Pushes Back)**  
  - **Genre vs. Realism**: Gómez is a lone rapist/murderer, not a politically motivated perpetrator. Your distinctions apply best to systemic crimes (TJ’s focus). The film’s *emotional* logic, however, aligns: Morales’s quest mirrors victims of state terror seeking recognition when institutions are captured.  
  - **Pre-Transition Setting**: The amnesty laws you teach come later. But the film critiques *enduring impunity*—the failure of later transitions to rectify pre-transition crimes. Gómez’s security role post-dictatorship implies unresolved guilt.  
  - **The Ending’s Ambiguity**: Is Morales’s act a "cure worse than disease"? The film suggests **yes**. His solution is monstrous, denying closure to both (Gómez dies unacknowledged; Morales is consumed). It dramatizes the vacuum when the state abandons victims—but offers no redemption.  

  ---

  ### **III. Would Conditional Amnesty or Gacaca "Solve" the Film’s Complaint?**  
  **A. South African-Style Conditional Amnesty**  
  - **Dissolves Partially**: If Gómez confessed fully to get amnesty, Morales might gain *propositional truth* (who, how, why). This addresses the legal residue but not the unsayable: Gómez’s obsession, the "look" in the photo—the emotional truth Morales needs—might remain unspoken or feel hollow if coerced.  
  - **Fails on Acknowledgement Hostage**: Even if Gómez testified, *voluntary* remorse isn’t guaranteed. Amnesty might exchange facts for immunity, leaving Morales with a perpetrator who speaks but doesn’t *reckon*. The veto over heartfelt acknowledgement remains.  

  **B. Rwanda’s Gacaca**  
  - **Dissolves Differently**: As a community process, gacaca might validate Morales’s *non-propositional* knowledge. Neighbors witnessing Gómez’s patterns ("he always watched her") could testify to the "residue."  
  - **Limits**: If Gómez participated resentfully, the "hostage" problem persists. And gacaca focused on genocide, not lone crimes—its communal ethos might not translate to Morales’s personal trauma.  

  **Verdict**: Neither fully resolves the film’s core tragedy. The unsayable residue and acknowledgement hostage are *human*, not institutional, problems. TJ mechanisms can supply facts or communal validation, but perpetrator recognition and emotional truth remain elusive.  

  ---

  ### **IV. Contested Ground in TJ Scholarship**  
  - **"Amnesty Creates an Acknowledgement Hostage"**: This is **contested**. Proponents of conditional amnesty (e.g., South Africa) argue it *forces* disclosure, granting victims societal acknowledgement. Critics (like your view) say perpetrator sincerity is key and unreachable via deal-making. The film leans toward the critical view.  
  - **"The Residue Can’t Be Addressed in Testimony"**: **Debated**. Some truth commissions (e.g., Peru) incorporated affective testimony. Others prioritized forensics. Your "residue" concept is a minority view but gaining traction in victim-centered approaches.  

  ---

  ### **V. What the Film Adds to TJ Debates**  
  1. **The Cost of Institutional Failure**: When the state abandons victims (or colludes with perpetrators), private "solutions" emerge—and they are horrific. Morales’s prison is TJ’s nightmare scenario.  
  2. **Knowledge Beyond Words**: TJ prioritizes verbal testimony. The film insists some truths exist in glances, images, and silence—and ignoring them invalidates victims.  
  3. **Time’s Irreversibility**: Espósito’s 25-year struggle underscores that delayed justice often *is* denied justice. TJ’s "timeliness" debates gain visceral force.  

  **A Good Skeptical Student Might Argue**:  
  > "The film is noir melodrama, not a TJ case study. Gómez isn’t a state actor; Morales’s vengeance is pathological. Real TJ isn’t about proving ‘looks’—it’s about evidence and reparations. The movie shows private trauma, not political transition."  

  **Rebuttal (for you to offer)**:  
  While genre-bound, the film allegorizes TJ’s core tensions: how institutions fail victims, how truth exceeds facts, and why perpetrator acknowledgement matters. Its power lies in exposing the *human void* TJ mechanisms can’t fill—even if its extremes aren’t literal templates.  

  ---

  ### **Summary for Your Lecture**  
  - **The Film’s TJ Thesis**: When states outsource justice to amnesty—or collapse into complicity—they abandon victims to unspeakable truths and unattainable acknowledgement. Institutional mechanisms (even well-designed ones) may not resolve the core human wounds.  
  - **Speculative but Resonant**: The film isn’t doctrine, but its questions haunt TJ: What if facts without feeling are inadequate? What if perpetrators never repent?  
  - **Final Irony**: Espósito’s closing line—"I need to write a novel"—hints that *art* might capture what TJ cannot: the residue, the silences, the eyes. That’s where your film-studies friend meets transitional justice.  

  Would you like to refine any angle for classroom delivery?
