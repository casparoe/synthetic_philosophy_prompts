  Contested areas: The idea that amnesty creates an "acknowledgement hostage" is debated. Some argue that even conditional amnesty can force acknowledgment, while others say it's insufficient. The unsayable residue's relevance is also contested; some prioritize factual truths over emotional nuances. 

