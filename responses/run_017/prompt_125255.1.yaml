answer: |-
  ## Sharpening the Priority vs. Equality Debate: Absolute vs. Comparative Weighting in Distributive Ethics

  **Sharp Question:** Does distinguishing *absolute prioritarianism* (welfare weights depend solely on individual absolute welfare levels) from *comparative prioritarianism* (welfare weights depend solely on an individual's welfare *relative* to others in the distribution, e.g., deficit from the best-off or the mean) resolve the ambiguity surrounding prioritarianism's claimed immunity to the levelling-down objection, and does this distinction provide a more fundamental axis for classifying distributive views than the standard priority/equality dichotomy?

  **Why the Existing Framing Leaves it Open:**
  The standard debate conflates two distinct mechanisms for weighting welfare gains:
  1.  **Intrapersonal Concavity (Absolute Priority):** Gains matter more *because* they occur at lower absolute welfare levels (e.g., w_i^α, α<1). This is strictly increasing in w_i, guaranteeing immunity to levelling-down *for the same reason utilitarianism is immune*: it makes someone worse off without helping anyone else.
  2.  **Interpersonal Comparison (Comparative Priority):** Gains matter more *because* they reduce the gap between the recipient and others (e.g., weight proportional to (w_max - w_i) or |w_mean - w_i|). This mechanism *directly responds* to the relative position itself.

  The standard prioritarian definition ("increasing and concave transformation of individual welfare") picks out only (1). The levelling-down objection is explicitly designed against views valuing equality intrinsically, which (2) arguably does. Yet, the *rhetoric* of prioritarianism ("giving priority to the worse off") often invokes the comparative intuition captured by (2). The existing framing hides this by assuming the concave transformation *is* the complete realization of "priority to the worse off," obscuring whether the driving force is absolute low level or relational disadvantage.

  **Approach & Advantages:**
  1.  **Formalization:** Precisely define Absolute Prioritarianism (AP: SWF = Σ f(w_i), f' > 0, f'' < 0) and Comparative Prioritarianism (CP: SWF = Σ g(rel_i(w)) * w_i, where `rel_i(w)` is a measure like w_max - w_i or w_i / w_mean, and g is increasing in the deficit/ratio). Crucially, `g` operates on the *relational metric*, not directly on w_i.
  2.  **Axiomatic Analysis:** Systematically test both AP and CP against core axioms:
      *   **Monotonicity/Pareto:** Does increasing one person's welfare always improve the SWF? (AP: Yes. CP: Needs careful definition of `rel_i` to avoid perverse cases, but plausible versions can satisfy).
      *   **Separability (Ex-Ante/Pareto Indifference):** Are unaffected individuals irrelevant? (AP: Yes. CP: Likely *No* – changing someone else's welfare changes `rel_i` for others, altering their weights).
      *   **Anonymity:** Does identity matter? (Both can satisfy).
      *   **Levelling-Down:** Can a pure reduction in inequality (making no one better off, at least one worse off) be an improvement? (AP: *Never* (due to monotonicity). CP: *Potentially Yes* – if the person made worse off was best-off, reducing w_max directly reduces the deficit `rel_i` for *all* worse-off individuals, potentially increasing their weights enough to offset the loss in their w_i, or if `g` values reduced gaps intrinsically).
  3.  **Test Cases & Comparison:**
      *   **Fixed Population Levelling-Down (LD):** (A: (10, 10) vs B: (10, 5)). *AP:* Strictly prefers A. *CP (e.g., weight ∝ (w_max - w_i)):* Evaluates A: [g(0)*10 + g(0)*10], B: [g(5)*10 + g(0)*5]. If g(5) > 2*g(0) (plausible if g strongly prioritizes large deficits), B *could* be preferred. **Crucially:** This LD improvement relies *only* on the weighting mechanism, not on intrinsic equality. It *is* prioritarianism, comparatively defined.
      *   **Variable Population - Replacement:** (A: One person at 100. B: Replace them with *two* people at 40 each). *AP (e.g., Σ√w_i):* A: √100 = 10. B: √40 + √40 ≈ 6.32 + 6.32 = 12.64 > 10. Prefers B. *CP (e.g., weight ∝ (w_max - w_i), SWF = Σ[ (w_max - w_i) * w_i ]):* A: (100-100)*100 = 0. B: w_max=40, [(40-40)*40] + [(40-40)*40] = 0 + 0 = 0. Indifferent. *Different CP (weight ∝ deficit, SWF = Σ w_i * deficit_i):* A: 100 * 0 = 0. B: 40*0 + 40*0 = 0. Indifferent. *CP (weight ∝ 1/w_i relative to mean? Needs precise def).* **Insight:** AP generally welcomes adding worse-off lives if total transformed welfare increases. CP, by tying weights to the *current* distribution's relational properties, can be much more restrictive or even indifferent to such additions, as the "deficit" vanishes if everyone is equally badly off. This starkly contrasts AP and highlights the distinct population ethics of CP.
      *   **Risk:** Is any lottery under CP necessarily ≼ its expected welfare vector? *(Your suspicion is largely correct, but nuanced).*
          *   **Monotonicity + Concavity of g?:** CP's `g(rel_i(w)) * w_i` is *not* generally a concave function of the vector `w` because `rel_i(w)` (e.g., w_max - w_i) is highly non-linear and depends on the *entire* vector. Jensen's inequality doesn't apply directly to the SWF.
          *   **Stochastic Dominance (SD):** *Ex-Post Monotonicity* (if state S occurs, and w_S > v_S, then w ≻ v) is likely preserved by plausible CP, as increasing any w_i in any state directly increases that state's SWF contribution (assuming g(rel_i) ≥ 0). *Ex-Ante Pareto/EU representations?* Highly unlikely. CP violates strong separability. The SWF value for a lottery depends on the correlation of outcomes – it matters *who* is rich or poor together in different states. Evaluating a lottery requires knowing the joint distribution, not just marginals. **Conclusion:** Risk does *not* kill the branch quickly. CP will generally violate the independence axiom of expected utility and the social analogue of ex-ante Pareto. A lottery *can* be strictly better or worse than its expected welfare vector under CP because the weighting depends on the realized pattern, not just average levels. This is a *feature* distinguishing CP from AP (which, assuming individuals are EU maximizers w.r.t. f(w_i), often satisfies ex-ante Pareto and reduces to evaluating the vector of expected transformed utilities).

  **What a Positive Result Looks Like:**
  1.  The AP/CP distinction cleanly resolves the ambiguity: AP is fundamentally LD-immune like utilitarianism due to strict monotonicity in absolute w_i. CP can endorse LD *without* positing intrinsic equality, purely via its comparative weighting mechanism.
  2.  CP provides a formalization capturing the core "relational disadvantage" intuition often misattributed to AP in informal discourse.
  3.  CP exhibits distinct, philosophically significant behavior in variable population and risk scenarios compared to AP and standard egalitarianism (e.g., stronger resistance to adding equal-but-low lives, violation of ex-ante Pareto under risk).
  4.  The absolute/comparative axis explains persistent disagreements better than priority/equality: proponents of "priority" emphasizing LD immunity are implicitly committed to AP; proponents emphasizing the badness of relative disadvantage lean towards CP.

  **What a Negative Result Looks Like:**
  1.  All plausible, coherent formulations of CP either collapse into AP (e.g., if `rel_i` is defined in a way that functionally depends only on w_i given fixed others), or collapse into leximin or another known view, or lead to unacceptable violations of core axioms (e.g., pervasive LD preferences even in clearly undesirable cases, strong violations of Pareto that lack intuitive justification).
  2.  The distinction fails to generate novel insights in variable population or risk cases – behavior is either identical to existing views or incoherent.
  3.  The "comparative" weighting is shown to be conceptually parasitic on intrinsic equality after all, failing to provide a genuine third way.

  **Feasibility & Risks for 3 Months:**
  *   **Achievable Core:** Rigorously defining AP/CP, analyzing LD immunity, separability, and anonymity, and exploring the core variable-population replacement case and the fundamental risk properties (violation of ex-ante Pareto/independence) is highly feasible.
  *   **Stretching It:** A fully developed variable population axiomatics (beyond illustrative cases) or a comprehensive treatment of risk (developing a full alternative to expected utility for CP) could easily consume the entire time.
  *   **Key Risk Factor:** **Mathematical Tractability of CP.** Defining `rel_i` robustly across populations (including different sizes), ensuring the SWF is well-defined and tractable, and avoiding degenerate cases (e.g., weights becoming zero/infinite) requires significant formal care. Variable population CP is especially messy.
  *   **Mitigation:** Focus on specific, well-motivated comparative measures (e.g., deficit from best-off, ratio to mean) within fixed-size populations initially. Tackle variable population through carefully chosen pairwise comparisons and representative cases rather than full generality. Acknowledge the complexity in the proposal as a limit for the fellowship, framing deeper variable-population work as future research.

  **Conclusion:**
  This proposal reframes the prioritarianism debate by exposing a hidden dimension: whether the priority weight is determined *absolutely* (LD immune like utilitarianism) or *comparatively* (potentially LD-preferring like egalitarianism). By formally developing Comparative Prioritarianism and contrasting it sharply with Absolute Prioritarianism across core test cases – particularly levelling-down, variable-population replacement, and risk – the project promises to clarify fundamental commitments in distributive ethics, resolve the ambiguity in prioritarianism's advertised LD-immunity, and potentially establish a more foundational classificatory axis. The tight timeline necessitates focusing on core distinctions and illustrative cases, leaving full axiomatizations for future work, but the central question is sharp and the approach promises significant conceptual payoff.
