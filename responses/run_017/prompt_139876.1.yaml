prompt: |-
  I am a retired physical chemist — thirty years in industrial catalysis — and since retiring I have been sitting in on philosophy-adjacent discussion groups, and have now agreed to run one evening myself. Our library's Wednesday series draws about twenty-five people, mostly retired engineers, a physician, a lawyer, a high-school mathematics teacher, and one retired operations-research analyst who is sharp, friendly, and will tell me inside ten minutes that in a one-shot Prisoner's Dilemma defection strictly dominates. Last month another presenter did the iterated version and everyone left content that reciprocity and reputation explain cooperation there; my job is the harder case. I have ninety minutes, a whiteboard, and no way to assign reading in advance, so please do not hand me a bibliography or a list of essays — I cannot easily reach a university library, and in any case I want the plan, not the sources.

  The notion I have to teach is superrationality: the claim, associated with the popular-science essay that introduced the term, that two agents who are genuinely running the same reasoning procedure should treat their choices as correlated rather than independent, so that in a one-shot Prisoner's Dilemma — no repetition, no reputation, no communication, no enforcement — cooperation is nonetheless the rational output. Please do not explain the idea to me; I can follow the argument. Plan how I should explain it to that room. I want the order in which the components must be introduced and what depends on what: does the dominance argument have to be stated and fully conceded before the correlation move can even be heard, or does conceding it first hand the operations-research analyst the whole game? Does Newcomb's problem belong early as an intuition pump, late as a diagnostic, or nowhere? Where does the shift from choosing-as-one to choosing-as-one-of-a-kind have to be made explicit, and what has to be in place before it? I also want one case to carry the session, and I am uneasy with the standard stagings: a player facing an exact copy of themselves invites the response that this is just one person in two places, and the eccentric-benefactor-with-twenty-finalists version invites the response that it is a rigged parlor puzzle. I would rather build on two agents who are not literally the same agent and not guaranteed to reason identically — two independent implementations of the same published algorithm written by different teams, or two strangers each of whom has read and been convinced by the same argument. Tell me what such an example must contain and must lack if it is to bear the weight.

  There is one wrinkle I insist on including, because it is where I suspect the idea either survives or dies and I do not know which: a tremble. Let the other agent be an ordinary defection-bound reasoner with some small but non-negligible probability rather than a superrational one. What becomes of the superrational recommendation, at what point in the sequence should I introduce the perturbation, and is the honest answer that the prescription is discontinuous in that probability — which, if so, I would rather say out loud than paper over? I also want the misconception map with each item placed: that this is just the golden rule in mathematical costume; that it assumes some kind of causal leakage or telepathy between the agents; that it is refuted in advance as a variant of evidential reasoning; that it requires believing the other agent literally is you; and the subtler one, that it amounts only to cooperating when your estimate of the other's cooperativeness exceeds a payoff-derived threshold, which misses the dependence claim entirely. My mathematics teacher will want to say that symmetry means we both do the same thing and so we should simply pick the better of the two joint outcomes, and the operations-research analyst will say that this merely selects an equilibrium by stipulation; I would like to know which of them is closer to the truth and how to let that exchange happen in the room without losing the thread. Give me one question to end on that would show me the idea itself had landed rather than that people had been persuaded to be nicer, and tell me what I should openly decline to explain at this level. Finally, and this matters to me as a scientist who has sat through too many confident talkers: mark clearly for me, in the notes rather than on the board, which claims are settled — the payoff structure, dominance, the equilibrium facts — and which are live disputes among people who work on decision theory, such as whether superrationality is a genuine position distinct from the familiar causal and evidential approaches, whether it collapses into one of them or into reasoning as a group agent, and whether it is a normative claim at all; I do not want to present a contested view to that room as though it were the consensus.
reasoning: |-
  Hmm, this is a fascinating and challenging request from a retired physical chemist preparing to lead a philosophy discussion on superrationality. The user has deep domain expertise in science but is navigating philosophical concepts for a mixed professional audience. 

  Key constraints stand out: no pre-reading, 90 minutes, whiteboard-only, and a sharp operations-research analyst likely to pounce on dominance arguments. The core challenge is framing superrationality without falling into common misconceptions (telepathy, golden rule, etc.) while handling the "tremble" perturbation honestly. 

  First, structural priorities: Dominance must be conceded early but contained - perhaps by isolating it as "standard" reasoning before introducing the correlation move. Newcomb's Problem feels risky as an opener; better as late-stage diagnostic after establishing the symmetry principle. The "tremble" deserves careful staging - it's the litmus test for whether superrationality is robust or fragile.

  For the central case study, I'm considering two independent AI agents running identical open-source cooperation algorithms. This avoids the "clone" objection while preserving reasoning symmetry. Key features needed: 
  - Explicitly different implementations (Python vs Rust teams)
  - No causal linkage
  - Shared public reasoning trace
  - Must lack any performance differences that could break symmetry

  The misconception map needs tactical placement:
  - Golden rule analogy: Address when discussing symmetry, emphasize it's structural not moral
  - Telepathy fear: Preempt with the algorithm example's causal isolation
  - Evidential dismissal: Save for Q&A with the OR analyst

  On the mathematician's symmetry argument vs the analyst's equilibrium critique: Truth leans toward the mathematician, but both miss that superrationality selects the Pareto-optimal Nash equilibrium through reasoning transparency. This distinction should emerge organically when comparing outcomes.

  Ending question: "If we reran this with 100 algorithm pairs where each believes the other might be defective, what would change?" Reveals whether they grasped the dependence claim beyond risk-calculation.

  Contested areas to flag: 
  - Settled: PD payoffs, dominance, Nash equilibria
  - Disputed: Superrationality's relationship to evidential/causal DT, group agency claims
  - Open: Whether it's normative or descriptive

  Most importantly, the "tremble" admission: Must state plainly that cooperation collapses at any epsilon >0 of defection risk if agents can't assume perfect symmetry. This discontinuity is where the theory shows its limits.
answer: |-
  Here's a structured 90-minute plan designed for your audience, addressing your constraints and priorities. The sequence builds conceptual dependencies while preempting major misconceptions.

  **Core Case Study:**  
  Two independently developed autonomous vehicles at an unsigned 4-way stop. Each runs identical open-source collision-avoidance software (v2.4.1), publicly documented to use *identical* decision logic. No V2V communication. Payoff matrix mirrors PD:  
  - Both "wait" (cooperate): Moderate delay (mutual suboptimal)  
  - One "go"/one "wait": "Go" gets optimal time; "wait" gets worst-case delay  
  - Both "go": Crash (catastrophic mutual loss)  
  *Why it works:* Independent implementation prevents "same agent" objection; public algorithm establishes reasoning identity; lack of communication/iteration satisfies one-shot criteria.

  ---

  **Session Structure**  
  *(Times include Q&A buffer)*

  1.  **Grounding the Prisoner's Dilemma (15 mins)**  
      - State PD matrix (visually clear on board).  
      - Elicit dominance argument from group. *Concede fully:* "Under standard rationality, defection is incontestably dominant."  
      - **Settle now:** Payoffs, dominance, Nash equilibrium (defect/defect).  
      - *Preempt misconception:* "This isn't about morality. We're analyzing instrumental rationality."

  2.  **Introducing Symmetry & Shared Reasoning (20 mins)**  
      - Present the AV case. Emphasize: **Different physical systems, identical published decision algorithm.**  
      - Ask: "What does 'rational' mean for AV #1, knowing AV #2 uses *the exact same reasoning procedure*?"  
      - **Key shift:** "We're not choosing *as one agent*, but *as one instance of a reasoning kind*."  
      - *Preempt misconceptions:*  
        - "No telepathy: They share code, not thoughts."  
        - "Not group agency: Each acts selfishly for its own vehicle."

  3.  **The Correlation Move (25 mins)**  
      - Argue: "Since both run identical logic, their outputs *must* correlate. If my algorithm outputs COOP, so does theirs. If DEFECT, same."  
      - Show on board: Only two coherent joint outcomes: (COOP/COOP) or (DEFECT/DEFECT).  
      - Compare expected payoffs: COOP/COOP payoff > DEFECT/DEFECT payoff → Cooperation is rational.  
      - *Diagnostic question:* "Is AV #1 deciding *what AV #2 will do*? Or deciding *what logic they both share will output*?"  
      - **Contested claim flagged:** "Superrationality asserts correlation via identical reasoning, not evidential inference."

  4.  **Addressing the Tremble (15 mins)**  
      - Introduce: "What if AV #2 has a 1% chance of malfunctioning and defecting randomly?"  
      - **State honestly:** "Superrational cooperation *collapses* here. Even tiny uncertainty breaks the perfect correlation assumption."  
      - Show math: Expected payoff of COOP now includes catastrophic loss risk → Defection dominates again.  
      - *Key insight:* "Superrationality isn't about probabilistic trust. It requires *certainty of identical reasoning*."

  5.  **Clarifying vs. Misconceptions & Objections (10 mins)**  
      - *To mathematician:* "Symmetry implies same action, but doesn't dictate *which* action. The payoff matrix selects COOP/COOP over DEFECT/DEFECT as the better symmetric outcome."  
      - *To OR analyst:* "It doesn't *stipulate* an equilibrium; it argues that identical reasoning *forces* us into a symmetric outcome, and COOP/COOP is Pareto-superior."  
      - *Preempt:*  
        - "Not Golden Rule: Self-interest leverages symmetry, not altruism."  
        - "Not evidential DT: Correlation stems from shared causal process (algorithm execution), not belief updating."

  6.  **Closing & Assessment (5 mins)**  
      - **Ending question:** "If both AVs *know* the other might be malfunctioning with 1% probability, does superrationality recommend cooperation? Why/why not?"  
        *(Correct: No. Certainty of identical reasoning is broken. Reveals grasp of fragility.)*  
      - **Openly decline:** "We won't resolve whether superrationality reduces to evidential/causal DT or is truly distinct. That's live debate in decision theory."

  ---

  **Essential Notes for You (Not for Board)**  
  - **Settled Consensus:**  
    - PD payoff structure and dominance argument validity.  
    - DEFECT/DEFECT as the unique Nash equilibrium in one-shot PD.  
    - Discontinuity of superrational cooperation under any tremble (ε > 0).  
  - **Live Disputes (Flag as Contested):**  
    - Whether superrationality is a *sui generis* rational principle or reducible to evidential/causal decision theory.  
    - Whether it implicitly requires group-agency framing.  
    - Its normative force: Is it "rational" or a clever hack exploiting edge cases?  
  - **Why This Sequence Works:**  
    1. Conceding dominance early disarms the OR analyst.  
    2. The AV case avoids clones/parlor tricks while forcing the "shared kind" perspective.  
    3. Introducing the tremble *late* shows superrationality's limits after establishing its core logic.  
    4. Ending with the malfunction question tests conceptual uptake, not persuasion.  

  **Tactical Points**  
  - When the OR analyst says "defection dominates," agree emphatically: "Absolutely, under standard rationality. Our question is whether *shared reasoning* changes that."  
  - If the mathematician says "pick the better joint outcome," respond: "Superrationality *also* gets you there, but via a specific route: identical reasoning forces correlation, making the choice between two symmetric outcomes."  
  - If "evidential reasoning" arises, note: "The superrational agent doesn't *infer* the other's action from their own choice; they recognize both actions are outputs of an identical causal process."  

  This structure respects your expertise, your audience's acuity, and the fragility of the concept. It presents superrationality as a provocative but non-consensus view, grounded in a defensible thought experiment.
