  ### Decision Tree: Positions on Phenomenal Consciousness  
  Based on concrete cases to avoid terminological noise. Focuses on argumentatively significant distinctions: veridicality debt (must account for success conditions of introspection) and upstream/downstream misrepresentation (in first-order perception vs. introspection alone). Uses cases (a), (b), (d), and grain-mismatch.  

  ---

  #### **Node 1: Introspection-Free Subject (Case b)**  
  *A subject has intact first-order perception (e.g., visually discriminates red/green) and external reporting (e.g., says "that’s red"), but no introspective access to their perceptual states. Is there something "missing" that third-person science cannot capture?*  
  - **Yes → Node 2**  
    *(Realism-leaning: Phenomenal properties or their absence are relevant)*  
  - **No → Node 5**  
    *(Anti-realism/illusionism-leaning: Nothing missing or it’s ineffable)*  

  #### **Node 2: Veridicality Debt**  
  *Must a theory explain what it would be for introspection to succeed (i.e., specify the condition it currently fails to meet), or can the "seeming" of phenomenality be brute?*  
  - **Must explain success → Node 3**  
    *(Owes a theory of the property introspective misrepresentation targets)*  
  - **Can be brute → Node 4**  
    *(Appearance is explanatorily primitive)*  

  #### **Node 3: Dimmer Switch (Case d)**  
  *A dial reduces "seeming" (e.g., vividness of pain) to zero while first-order discrimination remains intact (e.g., still reflexively withdraws from heat). Does the *property itself* fade, or only its *representation*?*  
  - **Property fades → Leaf: Russellian Monism/Panpsychism (RM)**  
    *(Awkward: Fundamental properties are "dimmable" but undetectable when absent.)*  
  - **Only representation fades → Node 7**  
    *(Property is stable; misrepresentation varies)*  

  #### **Node 4: Swapped Introspectors (Case c)**  
  *Two subjects’ introspective mechanisms are exchanged (each classifies the other’s first-order states). Does what-it’s-like follow the first-order state or the introspector?*  
  - **First-order state → Leaf: Representationalism (R)**  
    *(Awkward: Phenomenal character reduces to external-directed content, losing intrinsic quality.)*  
  - **Introspector → Leaf: Higher-Order Thought (HOT)**  
    *(Awkward: Phenomenality depends on higher-order judgments, risking arbitrariness.)*  

  #### **Node 5: Open-Dashboard (Case a)**  
  *Subject sees their introspector apply coarse tags (e.g., "pain") with no qualitative detection. They conclude "no qualia." Is this discovery or added misrepresentation?*  
  - **Discovery → Node 6**  
    *(Illusionism/eliminativism-leaning: Correct about absence of qualia)*  
  - **Added misrepresentation → Leaf: Full-Blooded Realism (FBR)**  
    *(Awkward: Qualia exist but are systematically misrepresented by introspection.)*  

  #### **Node 6: Grain-Mismatch**  
  *Introspection represents determinable properties (e.g., "red"), but first-order states are maximally determinate (e.g., specific shade). Does this grain make the content impossible for real properties?*  
  - **Yes → Node 8**  
    *(Illusory content is incoherent; no such properties)*  
  - **No → Leaf: Physicalist Realism (PR)**  
    *(Awkward: Determinables are real but physical/functional, with hard problem.)*  

  #### **Node 7: Grain-Mismatch**  
  *Introspection attributes coarse-grained properties to fine-grained first-order states. Does this misrepresentation originate in first-order perception or only introspection?*  
  - **First-order perception → Leaf: Upstream Illusionism (UI)**  
    *(Awkward: First-order perception misrepresents its own nature, e.g., as qualitative.)*  
  - **Only introspection → Node 9**  
    *(Downstream: First-order states are non-phenomenal but veridical)*  

  #### **Node 8: Veridicality Debt**  
  *Must the theory explain what successful introspection would be?*  
  - **Yes → Leaf: Error Theory (ET)**  
    *(Awkward: Concept of "phenomenality" is defective; owes an account of why.)*  
  - **No → Leaf: Downstream Illusionism (DI)**  
    *(Awkward: Must explain mechanism of illusion without real qualia.)*  

  #### **Node 9: Dimmer Switch (Case d)**  
  *With "seeming" at zero, does the illusion mechanism itself have attenuated, quasi-phenomenal properties?*  
  - **Yes → Leaf: Quasi-Phenomenal (QP)**  
    *(Awkward: Quasi-qualia in introspection invite regress.)*  
  - **No → Leaf: Downstream Illusionism (DI)***  
    *(As above)*  

  ---

  ### Leaves (Positions)  
  1. **Full-Blooded Realism (FBR)**  
     *Phenomenal properties are non-physical; introspection misrepresents them.*  
  2. **Russellian Monism/Panpsychism (RM)**  
     *Fundamental properties are proto-phenomenal; dimming reveals their absence.*  
  3. **Representationalism (R)**  
     *Phenomenal character is representational content; survives dimming.*  
  4. **Higher-Order Thought (HOT)**  
     *Phenomenality depends on introspective classification; swaps change what-it’s-like.*  
  5. **Physicalist Realism (PR)**  
     *Phenomenal properties are physical/functional; coarse grain is real.*  
  6. **Upstream Illusionism (UI)**  
     *First-order perception misrepresents itself as qualitative.*  
  7. **Downstream Illusionism (DI)**  
     *Only introspection generates illusion; first-order states are fine.*  
  8. **Quasi-Phenomenal (QP)**  
     *Illusory states have attenuated qualia (DI variant).*  
  9. **Error Theory (ET)**  
     *"Phenomenal" concepts are defective; no appearance to explain.*  
  10. **Eliminativist/Quietist (EQ)***  
      *(From Node 5→6→8: No property, no illusion, no debt)  
      *Awkward: Must deny any "explanatory gap" intuition.*  
  *Reached via: Node 1 (No) → Node 5 (Discovery) → Node 8 (No to veridicality debt).  

  ---

  ### Unoccupied Combinations  
  1. **First-order realism + brute seeming + HO dependence**  
     *(Incoherent: If phenomenality depends on HO states, it can’t be brute and first-order.)*  
  2. **Upstream illusionism + veridicality debt**  
     *(Unattractive: Owes account of non-misleading perception, but denies it exists.)*  
  3. **QP + no veridicality debt**  
     *(Unoccupied: Quasi-qualia imply a debt to explain their nature; few defend this.)*  
  4. **Grain incoherent + brute seeming**  
     *(Unattractive: If content is incoherent, its "seeming" can’t be explanatorily primitive.)*  

  ---

  ### Ambiguous Pairs & Resolving Questions  
  - **DI vs. UI**: Separated by upstream/downstream node (Node 7).  
  - **PR vs. RM**: Both say grain isn’t incoherent. *Resolve with:* "Could a zombie (identical functionally) lack phenomenality?"  
    - Yes → RM (phenomenality is non-structural).  
    - No → PR (phenomenality is functional).  
  - **FBR vs. RM**: Both accept veridicality debt + properties fade. *Resolve with:* "Are phenomenal properties categorical (non-dispositional)?"  
    - Yes → FBR.  
    - No → RM (fundamental properties are causal).  

  Total branch nodes: 9. Leaves: 10 (+1 eliminated position).  
  *Designed for clarity; adapt cases as needed. Handout fits one page.*
