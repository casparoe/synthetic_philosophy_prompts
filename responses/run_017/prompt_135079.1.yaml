  Okay, the user is deep into meta-ethics, specifically the Frege-Geach problem for expressivism. They had an all-night debate with a friend about whether the problem is solved or just "domesticated." Their friend argues that higher-order states and contrary attitudes handle embedding and negation. The user suspects unanchoredness—when the speaker lacks any stance toward the act—exposes a residual issue, especially with negated normative claims inside conditionals.

  The user wants a realistic vignette where:
  1. Normative sentences appear as a premise and inside a conditional with negation scoped inside (e.g., "If not wrong, then permitted").
  2. The argument remains valid under descriptive substitution.
  3. Conclusion concerns a different act/agent to prevent attitude coherence tricks.
  4. Speaker is fully unanchored—no first/higher-order stance toward the act, yet professionally competent.

  They also want analysis under two expressivist accounts: approval/disapproval + higher-order states (Account A) and norm-acceptance-as-planning (Account P). For each step, I need to show ascribed states and verdicts (works/strained/fails). Finally, identify the load-bearing feature, objections, and whether this reveals a novel problem.

  I'm considering a workplace compliance scenario. Imagine a zoning officer reviewing renovation plans. The premise could be a written rule: "Unauthorized modifications to load-bearing walls are prohibited." The conditional might be: "If adding this partition isn't prohibited, then converting the storage room is permitted." The conclusion ties to a different action (room conversion). The officer has no personal stance—they're just applying rules. 

  For Account A (approval + higher-order): 
  - Premise ascription: Disapproval of unauthorized modifications. Fine.
  - Conditional ascription: Higher-order attitude about not disapproving partition addition. But unanchoredness makes this strained—they don’t even have the base attitude to reflect on.
  - Conclusion: Disapproving of not permitting room conversion. Fails because the chain relies on non-existent lower-order states.

  For Account P (planning): 
  - Premise: Plan to prohibit unauthorized modifications. Works.
  - Conditional: Plan contingency if partition is permitted. Since they lack any plan-related stance toward the partition, ascribing this is strained.
  - Conclusion: Plan to permit room conversion. Fails—no normative force without prior stance.

  The load-bearing feature is the speaker’s professional detachment (unanchoredness). If removed, expressivist accounts handle it easily. The friend might argue professionalism is insincerity, but that’s uncharitable—the officer genuinely lacks evaluative attitudes. 

  Verdict: This isn’t just a dressed-up old problem. Unanchoredness + embedded negation creates distinct pressure because expressivism ties meaning to attitudes the speaker doesn’t possess. The novelty lies in decoupling normative discourse from subjective states entirely.
answer: |-
  Here is a vignette meeting your specifications, followed by analysis and verdicts:

  **Vignette (Healthcare Compliance Officer):**  
  1. *Premise:* Hospital policy states: "Discharging a patient without documented consent is prohibited."  
  2. *Conditional:* "If adding a non-clinical observer to the discharge process isn't prohibited by policy, then using telehealth for follow-up consent is permitted when in-person isn't feasible."  
  3. *Fact:* We added an administrative trainee (non-clinical) to observe Mr. Smith's discharge.  
  4. *Inference:* Therefore, using telehealth for Ms. Jones' follow-up consent (due to her remote location) is permitted.  
  *(Shape: If ¬P(act A) is true, then Q(act B) is permitted. Act A = adding observer; Act B = telehealth consent.)*

  ---

  ### Analysis  
  **Descriptive Substitution Validity Check:**  
  - Premise: "Discharging without consent is policy-violating."  
  - Conditional: "If adding an observer *isn’t* policy-violating, then telehealth consent *is* policy-allowed."  
  - Fact: "We added an observer."  
  - Conclusion: "Telehealth consent is policy-allowed."  
  *Validity holds: If A isn’t forbidden, then B is allowed. A wasn’t forbidden, so B is allowed.*  

  **Unanchoredness:** The compliance officer has no evaluative stance toward adding observers (act A)—not approval/disapproval, tolerance, indifference, or higher-order reflection. Their role is purely to apply policy logic to novel cases. They are not "suspending judgment"; the act is normatively inert to them personally.  

  ---

  ### Step-by-Step State Ascription  
  *Account A (Approval/Disapproval + Higher-Order)* | *Account P (Norm-Acceptance as Planning)*  

  | Step          | Sentence (Abridged)                               | Account       | Ascribed State                                                                 | Verdict | Why                                                                                          |  
  |---------------|---------------------------------------------------|---------------|---------------------------------------------------------------------------------|---------|----------------------------------------------------------------------------------------------|  
  | Premise       | "Discharging w/o consent is prohibited."          | A             | Disapproval of discharging without consent.                                     | Works   | Directly expresses disapproval of an act.                                                    |  
  |               |                                                   | P             | Plan to prohibit discharging without consent.                                   | Works   | Directly expresses a plan constraint.                                                        |  
  | Conditional   | "If adding observer isn’t prohibited..."          | A             | Higher-order state: *Disapproving of not disapproving* adding observer.         | Strains | Requires a meta-attitude about an attitude the speaker *lacks* (unanchored to A).             |  
  |               |                                                   | P             | *Planning contingency*: If adding observer is *not planned to be prohibited*, then... | Strains | Requires a plan-related stance (prohibition) toward A, which is absent (unanchored).         |  
  | Implication   | "...then telehealth consent is permitted."        | A             | Disapproval of *not permitting* telehealth consent if condition holds.          | Fails   | No disapproval/anchor toward A to ground the conditional's normativity; conclusion is inert. |  
  |               |                                                   | P             | Plan to *permit* telehealth consent if condition holds.                         | Fails   | Lacks the plan-to-prohibit-A needed to make the antecedent meaningful; conclusion ungrounded.|  
  | Conclusion    | "Telehealth consent is permitted."                | A             | Disapproval of not permitting telehealth consent.                               | Fails   | Derived from failed implication; no attitude toward B is generated.                          |  
  |               |                                                   | P             | Plan to permit telehealth consent.                                              | Fails   | Derived from failed implication; no plan-state toward B is adopted.                          |  

  ---

  ### Critical Feature & Verdicts  

  | Load-bearing feature              | If removed                                                                 | Best objection (Account A)                                     | Verdict on novelty                                                                 |  
  |-----------------------------------|----------------------------------------------------------------------------|----------------------------------------------------------------|------------------------------------------------------------------------------------|  
  | Professional unanchoredness to Act A | Speaker has *any* stance toward adding observers (e.g., disapproval).      | "Higher-order disapproval naturally applies; no residue."     | **Novel residue**: Embeds negation *without* the speaker's attitudes to ground it. |  

  **Verdict on Thesis:**  
  **Yes**, negation-under-embedding-plus-unanchoredness is a distinct residue. It is not merely domesticated, nor is it "insincerity in disguise." The compliance officer’s reasoning is sincere, competent, and grounded solely in institutional rules—not personal/professional attitudes.  

  **Why novelty?**  
  - Textbook solutions (e.g., Blackburn’s higher-order attitudes; Gibbard’s planning) presuppose the speaker *has* the relevant first-order state (or its absence) to operate on. Here, **no such state exists**, yet the inference retains validity and normative force *derived entirely from the system*. The negation in the antecedent ("isn’t prohibited") isn’t a contrary attitude (toleration), but a *procedural gap* in the speaker’s psychology.  

  **Friend’s strongest objection:**  
  "That 'professional role' implicitly involves *acceptance* of the policy system, which is a higher-order planning state (Account P) or approval of rule-following (Account A). Thus, the speaker *does* have an anchor."  

  **Rebuttal:**  
  Accepting a *system* ≠ having attitudes toward *specific acts* within it. The officer can apply policy to act A (e.g., verifying no rule against observers) without any evaluative stance toward A itself—like a calculator applying arithmetic to values it doesn’t "care" about. Forcing "acceptance" to cover every derivational step trivializes expressivism by decoupling meaning from psychology.  

  **Final Judgment:**  
  Your case damages **both accounts equally**. The core problem is **attitude vacuums in embedded contexts**, where negation scopes under an operator and the speaker lacks the target attitude. This is a genuine, unsolved residue of Frege-Geach.
