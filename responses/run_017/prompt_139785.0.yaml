prompt: |-
  I sit on the standing committee that decides which research fields qualify for our national research foundation's long-term programme grants, and I have to draft the recommendation on the case we vote on next month. I would like the reasoning set out before I write it, and I am less interested in a general essay on demarcation than in a prediction about this case, the rules in play, and the evidence that would settle them.

  Our precedents, with the notes our secretary kept on what seemed to move the committee:

  1. *Tectonic stress mapping* (approved, 2004). Precise quantitative predictions; three of them failed; on each occasion the assumptions about rock plasticity in the models were revised, and each revision also implied a further, previously unexpected prediction that was then confirmed in independent data.

  2. *Motivational field theory* (rejected, 2009). No observation could be described that would count against its central claim; every apparent failure was explained by the subject's or the researcher's unacknowledged resistance.

  3. *The carrier framework* in systems ecology (approved, 2012). Its central claim is unfalsifiable: the quantity it says is optimised is defined by the optimisation, so the claim is true by construction. The committee explicitly declined to hold this against it, on the grounds that the framework has generated a long succession of falsifiable satellite models, many confirmed, and that a methodological convention in the field reserves the core from test.

  4. *Ambient field epidemiology* (rejected, 2016). Its claims are sharply falsifiable and it has never been refuted in some thirty studies; but each study was small, the outcome variable was re-specified after inspection of the data, no study reported power, and the reported effect sizes have drifted toward zero. The note reads: the claims have never been put in jeopardy.

  5. *The predictive phenology network* (approved 2019, with conditions). Registered its predictions in advance in a public registry, ran adequately powered tests, survived two failures by revising a secondary parameter, and preregistered the revised predictions before the next round of data came in.

  6. *Coherence thermodynamics* (rejected, 2021). A well-institutionalised field: its own journal, a textbook, a conference series, shared exemplars, agreed puzzles. The committee found that its central quantity had never been measured independently of the effect it was introduced to explain, and that no test in its literature had a serious chance of failing.

  The committee has never stated a general criterion. There is only a 2011 guidance memo saying that a field is scientific to the extent that its claims can conflict with observation and its practitioners treat sustained conflict as a reason for revision, and that revision of auxiliary assumptions is permitted except where the revision does no more than accommodate the data already in hand. Two members describe themselves as following quite different methodological traditions and both claim the precedents vindicate them; I suspect the memo is compatible with more readings than either admits, and that some readings available here belong to neither tradition.

  The case before us is *phase-lattice dynamics*, an interdisciplinary programme of about two hundred active researchers, fifteen years old:

  - Its core, the lattice postulate, is stipulative by the field's own founding convention; graduate students are taught that no observation bears on it, and members who have tried to test it are told they have mis-specified the mapping from theory to data.
  - It has produced some forty belt models. When a model fails, practitioners re-specify the coupling kernel, a functional form they themselves describe as having on the order of thirty effective degrees of freedom, which is enough to fit any dataset of the kind the field collects.
  - The re-specified kernels do have content beyond the data that prompted them: each predicts something not used in the fit. But the predictions are qualitative and directional, tested on samples of twenty to forty, with flexible exclusion rules and no power analysis. Roughly seventy per cent are reported as confirmed.
  - A public prediction registry was introduced in 2019. In the preregistered subset the directional hit rate is nine of twenty-six, which is about chance; unregistered predictions still come out near seventy per cent.
  - Two large multi-lab replications of its flagship effect failed in 2022. The community's response was to invoke site-specific coupling.
  - Two of its belt models are in routine engineering use and do work, within a narrow and well-characterised domain.

  What I want from you: the candidate rules that fit all six of our precedents jointly, stated sharply enough to disagree with each other; what each predicts for phase-lattice dynamics and with what confidence; your best guess at the committee's vote, with the reasons for preferring the reading of the memo you rely on; which precedent is the closest analog and why, and, where our precedents genuinely underdetermine the case, what principle we would be adopting under each option; and finally the single further case or piece of evidence that would best separate the surviving rules, with a statement of what each rule says about it. Please argue from the cases and the memo rather than from anything you would need to look up.
reasoning: |-
  Hmm, the user is a member of a committee that decides on research grants, and they need help drafting a recommendation for a case called "phase-lattice dynamics." They've provided six precedents, a memo with guidance, and details about the current case. They want me to analyze possible rules that fit all precedents, predict the outcome for this case, and suggest additional evidence.

  First, I need to understand the precedents. Tectonic stress mapping was approved because they made precise predictions, revised models when they failed, and those revisions led to new confirmed predictions. Motivational field theory was rejected because nothing could falsify it—failures were blamed on resistance. The carrier framework was approved even though its core was unfalsifiable because it generated testable models that were confirmed. Ambient field epidemiology was rejected because studies were small, had questionable methods, and effect sizes drifted to zero without ever being seriously tested. Predictive phenology was approved with conditions: they preregistered, used good tests, revised after failures, and preregistered again. Coherence thermodynamics was rejected because its central concept wasn't independently measurable and tests couldn't fail.

  The memo says a field is scientific if its claims can conflict with observation and practitioners treat conflict as a reason for revision, except when revisions only accommodate existing data. So the key is testability and how failures are handled.

  For phase-lattice dynamics: their core postulate is untestable by design. They have belt models that they tweak using flexible kernels with many parameters, which can fit any data. When models fail, they adjust the kernel, which does make new predictions, but those are weak—qualitative, small samples, no power analysis. Preregistered predictions only hit 9/26 (about 35%, near chance), but unregistered are 70%. Two big replications failed, and they blamed site-specific issues. Some models are used in engineering successfully in narrow areas.

  I need to find rules that explain all six precedents. Let me think of possible rules. Rule 1 could focus on whether the core claims are testable and how they handle failure. For example, in tectonic stress, they revised properly, while in motivational, nothing could falsify it. The carrier framework's core wasn't testable, but satellites were, and they were confirmed, so it's approved. Ambient had testable claims but never in jeopardy, so rejected. Phenology handled failures well. Coherence had no real tests, so rejected.

  Rule 2 might emphasize institutional practices like preregistration and power analysis. Tectonic didn't have that, but it was approved based on how they handled failures. Phenology was approved with conditions because they used preregistration. But carrier framework was approved without such practices, so this rule can't be the only factor because carrier didn't have preregistration but still got approved.

  Rule 3 could look at whether auxiliary revisions generate novel predictions. Tectonic did that, so approved. Motivational didn't, rejected. Carrier's satellites did, approved. Ambient's revisions didn't lead to novel tests or were methodologically weak, rejected. Phenology's revisions were preregistered and tested, approved. Coherence had no real revisions or tests, rejected. Phase-lattice makes new predictions but they're weak—qualitative and underpowered. So under this rule, it might be rejected.

  The user mentioned that the memo allows auxiliary revisions as long as they're not just accommodating existing data. Phase-lattice's kernel changes do make new predictions, so they might argue it's acceptable. But the predictions are poor quality. The memo doesn't specify the quality of tests.

  Closest analog: ambient field epidemiology. Both have claims that are testable but never really in jeopardy due to methodological issues. Ambient had small samples, data dredging; phase-lattice has flexible models, low power, high unregistered hit rate vs low preregistered. Also, both had failed replications explained away—ambient by effect size drift, phase-lattice by site-specificity.

  For the vote, I think the committee will reject it. Reasons: core is untestable, models are overly flexible, preregistered predictions perform at chance, failed replications were dismissed without substantive revision. The memo's emphasis on conflict with observation and revision: here, conflicts aren't leading to core revisions, and auxiliary changes might be accommodating data given the kernel flexibility.

  Additional evidence: a preregistered, high-power test of a novel prediction from a revised model. If it fails, it shows the field doesn't revise properly. If it passes, it supports their approach. Under Rule 1, if it fails and they don't revise, it's bad; if they do and make new predictions, good. Rule 2 would require such a test to be well-powered and preregistered to count. Rule 3 would want the prediction to be novel and specific, not just directional.

  The user's deeper need is to write a recommendation that's defensible based on precedents, avoiding personal bias. They want a structured analysis showing how different readings of the memo apply, so they can present balanced reasoning. They might also want to anticipate committee disagreements, since members have different traditions but claim precedents support them.
answer: |-
  Based solely on your committee's precedents and the 2011 memo, I derive three distinct candidate rules that jointly satisfy all six prior decisions. Each rule offers a different interpretation of the memo's core requirement: that claims "can conflict with observation" and "sustained conflict [is] treated as a reason for revision," with auxiliary revisions permitted except when merely accommodating existing data.

  ### Candidate Rules from Precedents
  1. **Rule A: Core Testability & Revision Integrity**  
     A field qualifies if either:  
     (a) Its *core claims* are directly falsifiable and have survived serious tests, or  
     (b) It generates *falsifiable satellite claims* that cumulatively demonstrate *progressive revision* (i.e., revisions predict *novel* phenomena beyond accommodating existing failures).  
     - *Fits Precedents*:  
       - Tectonic (approved): Core falsifiable, revised with novel predictions (fits a+b).  
       - Motivational (rejected): Core unfalsifiable, no satellites (violates a+b).  
       - Carrier (approved): Core unfalsifiable, but satellites falsifiable and confirmed (fits b).  
       - Ambient (rejected): Core falsifiable but never seriously tested; revisions only accommodated drift (violates a: no serious test; violates b: no novelty).  
       - Phenology (approved): Core falsifiable, revised with preregistered novel tests (fits a+b).  
       - Coherence (rejected): Core untestable, satellites never risked failure (violates a+b).  

  2. **Rule B: Methodological Accountability**  
     A field qualifies if its practitioners *institutionalize practices* that force claims into conflict with observation (e.g., preregistration, power analysis, fixed outcome variables) and treat failure by revising *substantive assumptions* (not just flexible parameters).  
     - *Fits Precedents*:  
       - Tectonic (approved): Quantitative predictions, revisions changed rock plasticity assumptions (substantive).  
       - Motivational (rejected): No conflict possible; "resistance" excuses avoid accountability.  
       - Carrier (approved): Field convention shields core, but satellites use standard methods.  
       - Ambient (rejected): No accountability (respecified outcomes, no power, small samples).  
       - Phenology (approved): Preregistration, powered tests, substantive parameter revisions.  
       - Coherence (rejected): No independent measurement; tests couldn't fail.  

  3. **Rule C: Empirical Risk-Taking**  
     A field qualifies if it *repeatedly exposes its central explanatory framework* to non-trivial empirical risk, evidenced by:  
     - Failed predictions leading to framework-level revisions, OR  
     - Independent validation of core quantities, OR  
     - Preregistered tests with high-stakes outcomes.  
     - *Fits Precedents*:  
       - Tectonic (approved): Core assumptions revised after failures.  
       - Motivational (rejected): No risk; unfalsifiable core.  
       - Carrier (approved): Satellites independently validate core's utility.  
       - Ambient (rejected): No risk; studies designed to avoid jeopardy.  
       - Phenology (approved): Preregistered tests risked disconfirmation.  
       - Coherence (rejected): Core quantity never independently measured.  

  ### Prediction for Phase-Lattice Dynamics (PLD)
  - **Rule A**: **Reject** (High Confidence).  
    - Core lattice postulate is explicitly untestable (violates a).  
    - Satellite belt models revise kernels with 30+ degrees of freedom, fitting any data. Revisions *do* make novel predictions, but these are low-quality (qualitative, underpowered, flexible exclusions), and the 35% preregistered hit rate suggests no predictive progress. Engineering applications are domain-specific and don't validate the core.  
    - *Closest Analog*: Ambient (2016) – claims testable but never in jeopardy due to methodological flaws.  

  - **Rule B**: **Reject** (Moderate-High Confidence).  
    - Public registry shows 9/26 preregistered predictions hit (≈35%, near chance), vs. 70% unregistered – indicating selective reporting.  
    - Kernel revisions have "30 degrees of freedom," enabling accommodation without substantive change.  
    - Failed replications dismissed via "site-specific coupling" (unfalsifiable excuse).  
    - *Closest Analog*: Coherence (2021) – institutionalized but avoids accountability.  

  - **Rule C**: **Reject** (High Confidence).  
    - Core framework never at risk: Lattice postulate shielded, kernel revisions absorb failures.  
    - No independent validation of core mechanisms.  
    - Preregistered predictions perform at chance.  
    - *Closest Analog*: Motivational (2009) – failures deflected via "mis-specification" (cf. "resistance").  

  ### Committee Vote Prediction & Reasoning
  - **Predicted Vote: Reject (5–2 or 6–1)**.  
  - **Reasoning**: PLD fails all three rules, but the committee will likely split on *why*. Rule A is the most defensible reading of the memo:  
    - The memo emphasizes "claims can conflict with observation" – PLD’s core cannot.  
    - It permits auxiliary revisions *unless* they "accommodate data already in hand." PLD’s kernel revisions (30+ parameters) likely do this, as they fit existing data and novel predictions fail when preregistered.  
    - Two members’ "different traditions" may align as follows:  
      - *Falsificationist*: Focuses on core unfalsifiability (Rule A).  
      - *Pragmatist*: Focuses on lack of predictive progress despite engineering apps (Rule C).  
    - Precedents underdetermine only if PLD’s engineering success is weighted heavily, but Carrier (2012) set that utility alone is insufficient without testable satellites.  

  ### Key Undetermined Principle  
  - **What’s at Stake**: Whether *practical utility in narrow domains* overrides methodological weaknesses. Carrier (2012) allowed this, but PLD’s belt models lack Carrier’s track record of confirmed satellite predictions. Adopting Rule B or C would reject PLD; Rule A might approve if engineering apps were deemed "satellite validation," but Ambient (2016) shows utility without rigor is insufficient.  

  ### Best Next Evidence to Separate Rules  
  - **Proposal**: A *preregistered, multi-lab test* of a novel, quantitative prediction from a post-2022 revised belt model, with:  
    - Fixed outcome variables,  
    - Power analysis (n > 100),  
    - No exclusion flexibility.  
  - **What Each Rule Says**:  
    - **Rule A**: If prediction fails *and* PLD revises kernels *while generating a new, non-trivial prediction*, it supports PLD (progressive revision). If they accommodate without novelty, reject.  
    - **Rule B**: Requires this test structure *as a condition for approval*. If PLD refuses, reject; if they run it and fail, reject unless revisions change kernel assumptions substantively.  
    - **Rule C**: Only cares if failure forces core revision (e.g., lattice postulate modified). If not, reject.  

  This test directly targets the memo’s concern: whether PLD allows conflict to drive revision beyond accommodation. Failure to engage would confirm Rules B/C; ambiguous results would favor Rule A’s emphasis on cumulative progress. The 2011 memo’s flexibility lies in "sustained conflict," but PLD’s evasion of preregistered risk suggests no such conflict exists.
