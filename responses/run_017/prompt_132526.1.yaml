answer: |-
  ## Diagnosis of the Heterophenomenology Impasse

  After considering four candidate diagnoses, text-invariance emerges as the core, substantive issue underpinning the 30-year stalemate:

  1.  **Verbal Dispute ("Consciousness" Ambiguity):** *Could the disagreement be merely terminological?* While Block/Chalmers distinguish phenomenal vs. access consciousness explicitly, defenders (like Dennett) often argue "phenomenal residue" is a confused concept. However, the *methodological* disagreement persists even if terminology is clarified. Critics don't just use different words; they claim heterophenomenology *by design* cannot access a specific *type* of datum. This is substantive.
  2.  **Scope of Phenomena as Data:** *Is it about what counts as legitimate data?* Critics insist unreportable qualia are part of the phenomenon needing explanation. Defenders insist only objective, reportable data constitute valid scientific evidence. This is close, but text-invariance provides the precise *mechanism* for this exclusion: if the method *must* treat identical reports identically, unreportable aspects become inherently inaccessible and thus methodologically excluded *by definition*.
  3.  **Bedrock Intuition Clash:** *Is it just about irreconcilable "what-it's-like" intuitions?* While differing intuitions fuel the debate (critics' "explanatory gap," defenders' "no magic"), the *methodological argument* centers on the *epistemic status of reports*. Text-invariance forces this epistemological clash into the open: Must scientific evidence for consciousness be logically independent of the subject's report, or is the report itself the primary (or sole) evidence? This isn't *just* intuition; it's about evidence standards.
  4.  **Answering Different Questions:** *Are they simply pursuing different projects?* Defenders aim for a complete *third-person science of behavior and cognition*, including "consciousness" as reportable access. Critics aim to explain *subjective experience itself*. Text-invariance crystallizes this: The defender's project *requires* text-invariance for objectivity and third-person replicability. The critic's project *requires rejecting* text-invariance to allow for non-reportable phenomenology. They *are* answering different questions ("How do reportable states work?" vs. "What is subjective experience?"), but text-invariance is the specific methodological pivot point where these projects diverge irreconcilably.

  **The Verdict: Text-Invariance as the Core Substantive Impasse**
  The standoff is fundamentally about **conflicting standards of evidence**, explicitly captured by the text-invariance criterion. Defenders *must* implicitly or explicitly endorse text-invariance to maintain their claim of methodological neutrality and third-person objectivity. Granting reports no epistemic privilege beyond measurement output *entails* treating identical outputs identically, regardless of source. Critics *must* reject text-invariance to maintain that consciousness involves an unreportable, subjective component ("phenomenal residue") potentially absent in systems producing identical reports (like zombies or LLMs). Accepting text-invariance renders their core concern – the hard problem – scientifically invisible *by methodological decree*.

  Each side's accusation of question-begging is stable because:
  *   **Critics:** Accuse defenders of *assuming* there is nothing more to consciousness than what's reportable (by building a method only sensitive to reports). Text-invariance formalizes this assumption.
  *   **Defenders:** Accuse critics of *assuming* there is an unreportable residue that needs explaining (thereby demanding a method that violates third-person objectivity). Rejecting text-invariance requires this assumption.

  **Path to Progress: Formalizing the Commitment**
  Progress requires forcing explicit confrontation with text-invariance's implications:

  1.  **Conceptual/Formal Work:** Rigorously formalize the text-invariance constraint and its logical consequences for consciousness attribution.
      *   **Experiment:** Design a *gedankenexperiment* or formal model involving two systems (e.g., a human, a hypothetical "report-zombie," an advanced AI) producing indistinguishable heterophenomenological texts under all possible probes. Force defenders to choose:
          *   **Option A:** Concede both systems possess identical consciousness (admitting the method cannot distinguish zombies/non-zombies, potentially undermining its claim to explain subjective experience).
          *   **Option B:** Deny the zombie/AI has consciousness *despite identical texts*, thereby *rejecting* text-invariance and admitting the method relies on unstated background assumptions (e.g., biological implementation) beyond the text – violating its claimed neutrality and bracketing of first-person judgment.
  2.  **Reformulating the Question:** Shift the debate from "Does heterophenomenology capture consciousness?" to "**What does accepting or rejecting text-invariance commit us to, epistemologically and ontologically, regarding the nature of evidence for consciousness?**"
      *   If defenders choose Option A, the debate becomes: "Can a science satisfying text-invariance be considered a complete science of *subjective experience*, or only of *cognition and report*?"
      *   If defenders choose Option B, the debate becomes: "What are the non-textual criteria for being a 'subject,' and how can they be incorporated into a rigorous science without reintroducing the first-person privilege heterophenomenology aimed to avoid?"

  **Why This Counts as Progress:**
  This moves beyond the repetitive cycle of accusations. It transforms an intuitive clash into a specific, testable methodological commitment (text-invariance). It forces defenders to clarify the ontological implications of their method's constraints and critics to articulate what *kind* of evidence beyond text could be scientifically admissible. It doesn't resolve the hard problem, but it exposes the precise methodological hinge causing the stalemate, opening avenues for more productive argument focused on the nature of evidence itself, rather than reasserting entrenched positions. Progress lies in clarifying the *costs* of each methodological commitment.
