answer: |-
  Here is the translation into physical chemistry/measurement theory vocabulary, followed by the residue report. I'll be blunt where the analogy strains or breaks.

  ---

  ### **Translation of Positions & Objection**  
  **Objection (Heterogeneity):**  
  *In your terms:* The claim that "pleasantness" lacks a single natural kind status. Attempts to measure it operationally (e.g., self-reports, behavioral indicators like approach/avoidance) correlate imperfectly across contexts. The covariance matrix of putative "pleasantness indicators" (neural activity, verbal reports, physiological responses) suggests multiple latent factors (e.g., one for sensory rewards, one for cognitive rewards) rather than a single intensive variable. Pleasant experiences may be a nominal classification (like "flammable substances") with no unified microstructure.  

  **Feeling Theory (Hedonic Tone):**  
  *Translation:* Pleasantness is an intensive state variable (like temperature), invariant across microstructural realizers. The heterogeneity is epistemic: we misattribute the signal to the stimulus (like confusing a thermometer's reading with the thermometer itself). Hedonic tone is a latent variable inferred from noisy indicators (self-reports, behavior), analogous to estimating temperature from diverse proxies (mercury expansion, blackbody radiation, molecular velocity distributions).  

  **Attitudinal Theory (Enjoyment-as-Attitude):**  
  *Translation:* "Pleasantness" isn't a state variable but a *functional role* in a system's dynamics. It's defined relationally by its causal profile: a disposition to reinforce behavior, equilibrate preferences (like temperature drives heat flow), and appear in predictive models of choice. Just as temperature is defined by its role in the zeroth law of thermodynamics, pleasantness is defined by its role in the "psychic economy" (e.g., increasing the probability of recurrence).  

  **Adverbial View (Mode of Experience):**  
  *Translation:* Pleasantness is not an independent variable (intensive or extensive) but an emergent property of how a process occurs—like the "smoothness" of laminar flow or the "stability" of a potential well. Demanding a common microstate or scalar is a category error. It’s akin to asking for the "viscosity" of a photon: viscosity is defined for fluids, not radiation. Pleasantness is a descriptor of process dynamics, not a component.  

  ---

  ### **Residue Report**  
  **1. Feeling Theory:**  
  - *Clean translation:* Latent variable model works perfectly. Hedonic tone as an intensive variable with multiple realizability (neural, behavioral) mirrors temperature’s reduction to mean kinetic energy in gases but remaining valid in plasmas/solids.  
  - *Distortion:* Assumes hedonic tone is *quantitative* (scalar intensity/duration), but phenomenology may resist cardinal measurement (unlike temperature). Overlooks that "attention to object vs. tone" isn’t just noise—it’s constitutive of the experience.  
  - *Residue:* **Epistemic gap.** Temperature is inter-subjectively verifiable; hedonic tone is privately accessible. The "qualitative" aspect (what-it’s-like) has no analog in thermodynamics.  
  - *Crux:* The analogy *does* discharge the metaphysical objection (multiple realizability is unproblematic) but not the epistemological one. We can measure temperature directly (e.g., ideal gas law); we lack a "hedonometer."  

  **2. Attitudinal Theory:**  
  - *Clean translation:* Functional reduction works. Defining pleasantness by its causal role (reinforcement, equilibration) parallels defining temperature by its role in Carnot cycles or thermal equilibrium.  
  - *Distortion:* Functional roles in physics are defined by *objective, quantifiable laws* (e.g., \( dS = \delta Q/T \)). Attitudinal roles are defined by subjective intentionality ("enjoyment-of"), which lacks rigorous equations.  
  - *Residue:* **Loss of phenomenology.** The functional view severs the link to subjective experience. Temperature’s functional role doesn’t care about molecular chaos; attitudinal role doesn’t care about feeling. This sacrifices the very datum hedonism tries to explain: why pleasantness *feels* good.  
  - *Cost/Benefit:* Gains explanatory power for behavior (e.g., reward learning); loses ethical force (if pleasantness is just a functional tag, why *value* it?).  

  **3. Adverbial View:**  
  - *Clean translation:* None. Your vocabulary lacks a category for non-structural, non-relational properties of processes. "Smooth flow" is still structural (velocity gradients); "stability" is relational (Lyapunov functions).  
  - *Distortion:* Forced into "emergent property" language, but emergence in physics (e.g., superconductivity) is structural. Adverbial pleasantness is *adverbial*—modifying how content is experienced, not adding structure.  
  - *Residue:* **Total incompatibility.** Your framework treats properties as either structural (measurable) or eliminable. The adverbial view insists pleasantness is neither—it’s a primitive aspect of *how* content manifests. This residue suggests your vocabulary *excludes* phenomenal properties by design.  

  ---

  ### **Your Core Questions & Judgment**  
  **Q1: One objection or two?**  
  The temperature analogy dissolves the metaphysical objection (multiple realizability is fine) but *highlights* the epistemological one. We can measure temperature universally; we lack a universal "pleasantness observable." Heterogeneity is primarily epistemic here: a scalar may not fit the data.  

  **Q2: Attitudinal = Functional Reduction?**  
  Yes—and that’s the problem. Functional reduction in physics (e.g., temperature) extracts a variable from causal networks *independent of intrinsic qualities*. But the "feel" of pleasantness *is* its intrinsic quality. The attitudinal theorist gains a unified theory of behavior but loses the phenomenal anchor. You’re left with a useful model, not an account of *why* we seek pleasure.  

  **Q3: Adverbial view’s fate?**  
  No counterpart. Your vocabulary is structural/relational; the adverbial view requires irreducible phenomenal modes. This is the sharpest residue.  

  **Your Final Question: Residue as Evidence**  
  The residue reveals **both**:  
  - Your vocabulary *is* missing something: phenomenal properties (e.g., raw feels) that aren’t structural/relational.  
  - The philosophers’ question *is* bifurcated:  
    - **Metaphysics:** "What unifies pleasures?" → Demands an account of phenomenology (where residue accumulates).  
    - **Ethics:** "What should we pursue?" → Functional/relational models suffice (e.g., "pleasantness-as-reinforcer").  

  The word "pleasantness" conflates these. In ethics, functional unity (attitudinal role) may be enough—we don’t need a common feel to justify pursuing diverse rewards. But in metaphysics, the residue (e.g., the adverbial view’s irreducibility) suggests experience has features your vocabulary cannot capture.  

  **Bluntness:** The temperature analogy isn’t a trick—it’s robust for metaphysical multiple realizability. But it *is* misleading for epistemology and phenomenology. Temperature is public and quantitative; pleasantness is private and qualitative. The analogy smuggles in objectivity where there is none. You’ve exposed a genuine fracture: if ethics requires only functional unity, heterogeneity is irrelevant. If it requires phenomenal unity, your vocabulary fails.
