prompt: |-
  I teach philosophy of law in a philosophy department, and this term I have been sitting in on my law school's faculty colloquium as preparation for a graduate seminar on statutory interpretation that I am co-teaching next spring. At the last colloquium, a senior colleague in administrative law was asked whether a court faced with a provision whose literal application to a novel technology seems to defeat the provision's evident point may consult that point. He answered: "Look — we are all textualists now. Nobody thinks Congress has an intention anymore, so there is nothing to consult." He said it in the tone one uses to close a question rather than to answer it. A second colleague, more or less an open purposivist, later threw back the older line: "the letter killeth, but the spirit giveth life." Both were received as having said something decisive, and I do not think either had.

  The hypothetical I use in my seminar: a 1993 consumer-protection statute provides that "no person shall transmit, or cause to be transmitted, an unsolicited commercial message to a facsimile machine." The defendant runs a marketing firm that sends unsolicited advertisements over telephone lines to numbers at which the recipient's "fax" is a cloud service that converts the transmission into a PDF delivered to an email inbox and prints nothing. The plaintiff says the point of the provision was to stop advertisers from shifting the costs of unsolicited advertising onto recipients; the defendant says that what he transmits to is not a facsimile machine and never was one.

  What I want from you is a disambiguation of both lines, dense enough to hand to graduate students. Please do not give me a reading list, a survey of the literature, or citations to secondary sources; I want the distinctions themselves.

  For "We are all textualists now" (usually credited to Justice Kagan), set out the distinct precise claims the sentence could be making — as different from one another as you can make them, from the trivial to the radical. So far as I can tell these should include at least: a descriptive claim about what courts in fact do; a priority claim about where inquiry begins and what outranks what; a semantic claim about what the content of a statute consists in; an ontological claim about whether a multimember legislature can have intentions, or beliefs, or a point, at all; a legitimacy claim about what may count as law given the process by which law is made; a claim about the shifting extension of the word "textualism" itself; and an eliminative claim to the effect that purpose is never part of the law. Add any reading I have missed, including any that turns on what counts as "the text" (a single provision, a whole act, a corpus of related acts) rather than on what to do with it.

  For each reading, give: the precise thesis; whether it is a platitude, a substantive and defensible claim, a substantive but contested one, or straightforwardly false — and, where the claim is empirical, whether it is even plausible; and, most importantly, whether that reading, if true, would actually entitle my colleague to close the question the way he did. My suspicion is that the readings that are most defensible are ones a purposivist could cheerfully accept, and that the readings which would do the work he wanted are undefended. Tell me whether that is right.

  Then give a shorter version of the same treatment for the second line. There I expect the interesting dividing lines to be about whether "the spirit" is an independent moral entity that judges enforce, a constituent of what the words mean, a tie-breaker consulted only when the words give out, or merely a name for the contextual information a competent reader would bring to any utterance; and about what "killeth" is supposed to consist in — a false result, a result the enacting legislature would have rejected, or a result no speaker would have intended to produce.

  Then say whether there is any pair, one reading from each menu, such that both could be true without contradiction, or whether every reading strong enough to be interesting on one side contradicts every such reading on the other. If there is such a pair, tell me whether that shows the textualism/purposivism dispute to be partly verbal, and if there is not, locate the real disagreement. Finally, run the readings that survive against my facsimile hypothetical and say which of them, applied honestly, would actually resolve it — or why several of them fail to resolve it at all.

  Format: begin with a single sentence giving your bottom line — which reading my colleague would have to mean for his move to work, whether that reading survives, and whether the two slogans are in the end compatible — then give the menus as tables (reading / precise content / verdict / whether it supports the use), then the application to the hypothetical, with no preamble and no restatement of my question. Under a thousand words if you can manage it.
reasoning: |-
  Hmm, the user teaches philosophy of law and is preparing a graduate seminar on statutory interpretation. They've encountered two opposing slogans at a law faculty colloquium: "We are all textualists now" and "the letter killeth, but the spirit giveth life." Both were presented as decisive answers regarding whether courts can consult legislative purpose when literal text seems to defeat it in novel technological contexts.

  The user wants me to disambiguate both slogans into distinct interpretations without providing reading lists or citations. For "We are all textualists now," I need to identify precise claims ranging from trivial to radical - including descriptive, priority, semantic, ontological, legitimacy, definitional, and eliminative dimensions. For each, I must evaluate its defensibility and whether it would actually support closing the question.

  For the biblical phrase, I should unpack interpretations of "spirit" (moral entity, semantic constituent, tie-breaker, contextual information) and "killeth" (false result, rejected outcome, unintended consequence).

  I need to examine whether compatible pairs exist across both slogans, determine if the dispute is partly verbal, and apply surviving interpretations to their fax-to-PDF hypothetical. Finally, I must provide a bottom-line conclusion about which reading would actually work for their colleague and whether the slogans can coexist.

  The user suspects defensible textualist claims are acceptable to purposivists while stronger claims needed to close debate are unsupported - I should test this. The analysis must be dense, distinction-focused, and under 1000 words in a specific format starting with a conclusion sentence followed by tables and application.

  For the textualism slogan:
  - Descriptive claim (everyone does it): plausible but doesn't preclude purpose consultation
  - Priority claim (text first): defensible but still allows purpose when text unclear
  - Semantic claim (meaning is conventional): substantive/contested, but still permits contextual purpose
  - Ontological claim (no legislative intent): false - multimember bodies can have intentions
  - Legitimacy claim (only text is law): substantive/contested, would close debate but is dubious
  - Definitional claim (textualism redefined): trivializes the term
  - Eliminative claim (purpose never law): false and inconsistent with practice

  For the spirit/letter dichotomy:
  - Moral entity: radical and false
  - Semantic constituent: defensible but makes "spirit" part of textual meaning
  - Tie-breaker: substantive/contested
  - Contextual information: platitude

  Compatible pair: textual priority + tie-breaker purpose. But in the fax case, both approaches would likely consider cost-shifting purpose since "facsimile machine" in 1993 contextually meant devices receiving transmissions for printing, and the cloud service serves the same function. The dispute appears partly verbal when moderated, but ontological/legitimacy claims create genuine conflict. Neither slogan resolves the case definitively as both allow purpose consultation when text is ambiguous in context.
answer: |-
  **Bottom line:** Your colleague's "closing" reading requires the eliminative claim ("purpose is never law"), which is straightforwardly false and unsupported; the only compatible pair (textual priority + tie-breaker purpose) shows the dispute is partly verbal but fails to resolve your hypothetical, as both approaches would likely consult the cost-shifting purpose given the contextual ambiguity of "facsimile machine."

  ### "We are all textualists now" - Disambiguation Table
  | Reading | Precise Thesis | Verdict & Plausibility | Supports Closing? |
  |---------|----------------|------------------------|-------------------|
  | **Descriptive** | Courts *in practice* primarily start and end with statutory text. | Empirical, plausible but incomplete (courts *do* consult purpose). | No: admits purpose exists. |
  | **Priority** | Text is the *exclusive starting point* and *outranks* purpose when clear. | Substantive/contested but defensible. | No: allows purpose if text ambiguous. |
  | **Semantic** | Statutory meaning *consists solely* in conventional semantic meaning of words. | Substantive/contested; ignores pragmatic context. | No: "meaning" could include purpose. |
  | **Ontological** | A multimember legislature *cannot form* intentions, beliefs, or a "point." | Substantive/false; groups *can* have shared intentions. | **Yes** – but false. |
  | **Legitimacy** | Only text counts as *law* because only it was voted on/enacted. | Substantive/contested; ignores how legislation is understood. | **Yes** – but dubious. |
  | **Definitional** | "Textualism" now *means* any method using text (so even purposivists are textualists). | Trivial/platitudinous; empties term of meaning. | No: vacuously true. |
  | **Eliminative** | Legislative purpose *is never part of* the law and must *never* be consulted. | Substantive/false; contradicts actual practice. | **Yes** – but false. |

  ### "The letter killeth, but the spirit giveth life" - Disambiguation Table
  | Reading | Precise Thesis ("Spirit" / "Killeth") | Verdict | Supports Purposivism? |
  |---------|--------------------------------------|---------|------------------------|
  | **Moral Entity** | "Spirit" is an *independent moral principle*; "killeth" = *unjust outcome*. | Radical/false; confuses law with morality. | **Yes** – but illegitimate. |
  | **Semantic Constituent** | "Spirit" is *part of word meaning* (context/purpose); "killeth" = *literal reading no competent speaker would intend*. | Defensible/contested (contextualism). | **Yes** – but textualists may accept. |
  | **Tie-Breaker** | "Spirit" is consulted *only when text is ambiguous*; "killeth" = *absurd/pointless result*. | Substantive/contested (classic purposivism). | **Yes**. |
  | **Contextual Information** | "Spirit" is just *background context any reader uses*; "killeth" = *misreading via literalism*. | Platitude (all agree context matters). | No: too weak. |

  ### Compatibility & Application to Fax Hypothetical
  - **Compatible Pair:** Textual *priority* (text first, outranks if clear) + *Tie-breaker purpose* (spirit consulted only if text ambiguous/absurd). This pair is non-contradictory and shows the dispute is partly verbal about *when* purpose enters.
  - **Real Disagreement:** Centers on ontological/legitimacy claims (can legislature have intent? is purpose law?) vs. moral entity view. These are irreconcilable.
  - **Application to Fax Case:**  
    - **Textual Priority + Tie-Breaker:** "Facsimile machine" (1993) contextually meant devices receiving transmissions *for printing*. Defendant's service is functionally identical (cost-shifting remains). Text is ambiguous in modern context → consult purpose → violates statute.  
    - **Eliminative Textualism:** "Fax" = physical machine → no violation. But this ignores evident purpose and is unsustainable.  
    - **Semantic Constituent:** "Transmit to a facsimile machine" means transmitting to *a service performing the fax function* (cost-shifting) → violates statute.  
    - **Result:** All defensible readings (except eliminative) consult the cost-shifting purpose due to contextual ambiguity. No slogan resolves it "decisively"; honest application requires purpose.
