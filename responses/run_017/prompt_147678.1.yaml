  ### (i) Minimal Set of Rules Fitting the Five Verdicts

  Based on your friend's verdicts, the following rule sets capture her judgments. Each set consists of two rules: one for **justification** (whether the act itself was morally permissible) and one for **aftermath** (what consequences the official must face). The rules are mutually exclusive and collectively exhaustive for the cases provided.

  #### Rule Set A: Intent, Necessity, and Transparency
  - **Justification (J-A):** An act is justified only if:
    1. The primary intent is to prevent significant harm or correct a grave injustice (not personal/political gain).
    2. The act is necessary (no reasonable lawful alternative available at the time, or alternatives were attempted and failed).
    3. The harm prevented/corrected substantially outweighs the harm caused by the act.
  - **Aftermath (A-A):** If justified:
    1. The official must disclose the act promptly after the emergency/resolution.
    2. The official must accept legal/political consequences (e.g., prosecution, resignation) without denying the act's wrongfulness.
    3. Concealment or refusal to accept consequences invalidates justification and warrants harsher punishment.

  #### Rule Set B: Harm-Bearing and Moral Taint
  - **Justification (J-B):** An act is justified only if:
    1. It directly prevents/corrects significant harm or injustice.
    2. The harm/injustice is imminent or systemic.
    3. The act does not impose avoidable harm on uninvolved parties (if it does, it requires explicit consent or representation).
  - **Aftermath (A-B):** If justified:
    1. The official must ensure costs (e.g., legal sanctions) are borne by them, not victims.
    2. If the act caused direct harm (e.g., rights violations), the official must publicly acknowledge wrongfulness and apologize.
    3. No acknowledgment/apology is owed if the act only exposed existing harm (e.g., whistleblowing).

  #### Rule Set C: Outcome-Independent Duty
  - **Justification (J-C):** An act is justified only if:
    1. It addresses a high-stakes threat (harm or injustice) based on credible evidence available at the time.
    2. All feasible lawful alternatives were exhausted or demonstrably futile.
    3. The official’s decision process was rigorously documented.
  - **Aftermath (A-C):** If justified:
    1. Disclosure must occur once the threat passes.
    2. The official must submit to independent review and accept outcomes.
    3. Denial of wrongfulness or evasion of review nullifies justification.

