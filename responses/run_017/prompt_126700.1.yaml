prompt: |-
  I sit on the ethics committee of a learned society in the social sciences, and we have to decide, at our meeting in three weeks, whether to issue a formal censure that one of our own members — call her R. — has drafted and is pressing us to adopt against a senior figure in the field, call him M. The underlying conduct is not really in dispute: between 2009 and 2013 M. published three papers reporting results from a field experiment in which participants were misled about who was funding the study and what it was for, the deception was never disclosed to them afterwards, and M. has declined either to retract or to attach a note to those papers, though he did stop running studies of that kind. R.'s own dissertation research, published in 2011, rested on exactly the same kind of undisclosed deception, and was never sanctioned, because our code at the time said nothing about deception beyond the signing of consent forms; the Society in fact gave that work a prize in 2012. She has since become the field's most persistent critic of the practice, has asked that her own 2011 paper be retracted, and is the author of the censure motion now before us. M.'s written response is short: the Society has no standing to condemn him, because the person moving the censure did the same thing, because the Society rewarded it when she did it, and because at least four other senior members behaved similarly around the same period and are not being censured.

  We have been going round in circles with the word "hypocrisy," so I would be grateful for a written opinion I can circulate before the meeting that recommends something concrete and dated rather than surveying the positions available. Three things in particular divide us, and I would like you to take them in turn. First, several of my colleagues want to say that a censure is not an act of blaming at all but a declaratory finding that a norm was violated, entered into the record; if that is right, they argue, questions about who is doing the blaming and whether their hands are clean simply drop out. I am not convinced — a censure seems to do something to its target that an entry in a register does not — but I would like the claim tested rather than merely asserted from either side. Second, there is a move R. makes that I have not seen anyone else make: her standing, she argues, is not damaged but improved by the fact that she is condemning the very thing she did, since the condemnation costs her something and binds her to a standard she has already applied against her own work — call it the reformer's exemption if you like, though I am suspicious that it relabels the hypocrisy and then calls it a virtue. Third, there is the Society's own position, which seems to me genuinely hard: we are being asked in 2025 to condemn conduct that our rules permitted, and in R.'s case honored, in 2012, and to do so selectively, since a general inquest into the field's pre-2015 literature would take years and is not what the committee voted to take up.

  What I want from you is a recommendation — adopt the censure, adopt it in some modified form, decline to censure, or postpone pending a specified condition — together with the reasoning behind it, set out as continuous prose with no headings, bullet points, bold text or tables, since this will go out as an email to eight people who will read it on their phones. Please give the strongest version of the case you are rejecting rather than one that is easy to knock down: if you think we should censure, tell me what the most compelling form of M.'s tu quoque actually is and why it fails; if you think we should not, tell me what is genuinely lost by our saying nothing. Do not cite or recommend any literature — we have no library access from where we are meeting and a bibliography would be useless to us — but do make explicit which distinctions are doing the work in your argument, and flag any point at which the recommendation would change if a contested factual question, such as whether M. knew the code was about to be revised when he ran the last of the three studies, were settled the other way.
reasoning: |-
  Okay, the user is part of an ethics committee for a social sciences learned society. They need to decide whether to censure a senior member, M., based on past deceptive practices in his research. The main points of contention revolve around the nature of censure, R.'s standing to accuse given her similar past actions, and the society's own complicity in endorsing such practices back then. 

  First, I need to unpack the three key issues they're stuck on. The first is whether censure is purely declaratory or if it inherently carries blame. Some committee members argue it's just a factual record, which would sidestep concerns about R.'s hypocrisy. But the user feels censure does more than that—it likely stigmatizes the person. I should explore how even declaratory statements aren't neutral; they imply judgment and can damage reputations. 

  The second issue is R.'s "reformer's exemption." She claims her past misconduct actually strengthens her standing because she's applying the same standard to herself. That's rhetorically powerful—she’s sacrificing her own reputation—but it risks seeming performative. The committee needs to weigh whether her activism offsets the hypocrisy charge or if it’s just rebranding. 

  The third issue is trickiest: the society’s inconsistency. They rewarded R. for the same conduct in 2012, and their old code didn’t prohibit undisclosed deception. Condemning M. now feels retroactive and selective. A blanket investigation isn’t feasible, but singling out one person reeks of unfairness. 

  For the recommendation, I’m leaning against censuring M. Not because his conduct was acceptable—it wasn’t—but because the society’s hands are muddy. Issuing a censure while ignoring their own past endorsement (and other offenders) would undermine their credibility. Instead, they could publicly acknowledge the field’s ethical evolution and retire the papers symbolically. That addresses the harm without scapegoating M. 

  If new facts emerged—like M. knowing the rules were changing—that might justify censure. But without that, the fairest path is to confront the systemic failure, not individualize it. R.’s stance is admirable, but the society’s institutional hypocrisy matters more here.
answer: |-
  I recommend that the committee decline to adopt the censure motion against M. in its current form, but couple this decision with an immediate, concrete action: directing the ethics committee to draft and publish, within six months, a formal Society statement on the historical use of undisclosed deception in the field, explicitly naming the three papers by M. and R.'s 2011 work (among others to be identified) as examples of practices now considered unacceptable, while announcing the archival tagging of such works in the Society's digital repository. This approach addresses the core ethical concern without replicating the selective condemnation that undermines the Society's standing.

  On the first point: the claim that censure is merely declaratory and thus immune to charges of hypocrisy is unsustainable. While censure does declare a norm violation, its function is inherently performative and reputational. Unlike a neutral registry entry, censure is an act of moral condemnation by an authority, intended to diminish the standing of the recipient within the community. This is why M. objects not to the *description* of his actions but to the *condemnation* emanating from R. and a Society that previously rewarded identical conduct. To censure while ignoring this context would not be a neutral act; it would be an exercise of power perceived as arbitrary, damaging the Society's moral authority. The reputational harm distinct to censure makes the question of the condemner's integrity inescapable.

  Regarding R.'s "reformer's exemption": Her argument that her past conduct *strengthens* her standing has persuasive force. By applying the standard to her own work (seeking retraction) and advocating consistently against the practice, she demonstrates commitment and bears personal cost. This distinguishes her from a mere hypocrite. *However*, this exemption is personal to R. It does not extend to the *Society itself*. The Society, unlike R., has not repudiated its own prior endorsement of her work or acknowledged its institutional failure. When R. moves a censure motion *as a Society member*, invoking the Society's authority, the Society's own complicity—rewarding her deception in 2012 while condemning M.'s identical acts now—becomes the central issue. R.'s personal reckoning does not cleanse the Society's institutional hands for this specific act of condemnation. The strongest form of M.'s *tu quoque* is thus not against R. personally, but against the Society: "You honored this conduct when she did it; you cannot condemn it as inherently blameworthy when I did it, without confronting your own role." This argument succeeds because the condemnation derives its force from the Society's institutional authority, which is compromised.

  This leads to the third and decisive point: the Society's position. Condemning M. selectively for conduct permitted and even lauded by the Society at the time is indeed genuinely hard—and ultimately untenable as a censure. It constitutes retroactive punishment dressed as declaratory judgment. While norms evolve, and recognizing past errors is essential, wielding censure—a tool of blame—against an individual for acts that were not prohibited and were institutionally rewarded when committed creates profound unfairness. The argument that a full inquest is impractical is valid, but it reinforces why censure is the wrong tool here. Using censure selectively against one individual (M.) because R. has chosen to target him, while the Society avoids confronting its broader institutional history (including rewarding R. and the conduct of others), transforms what should be an ethical reckoning into an act of scapegoating. What is lost by not censuring M. is a focused, forceful denunciation of his specific failure to retroactively correct the record. However, this loss is outweighed by the greater damage to fairness and institutional credibility incurred by selective censure applied under these compromised circumstances.

  Therefore, adopt neither censure nor inaction. Instead, task the ethics committee to produce a Society Statement on Historical Research Ethics. This statement should:
  1.  **Acknowledge the evolution** of ethical standards in the field regarding deception and debriefing.
  2.  **Explicitly list** key examples (including M.’s three papers and R.’s 2011 paper) as illustrations of practices once more common but now considered unacceptable due to failure of full disclosure and debriefing.
  3.  **Announce the archival tagging** of all such identified works in the Society’s repository with a standardized notice linking to the statement.
  4.  **Outline ongoing commitment** to current ethical standards without blaming individuals for past acts compliant with then-existing, flawed norms.

  This approach enters the declaratory finding into the record, addresses the harm of leaving misleading work uncorrected in the literature, and forces the Society to confront its own history collectively. It avoids the hypocrisy trap by focusing on systemic failure and institutional responsibility rather than selective blame. Crucially, if it were established that M. knew the code was under revision prohibiting such deception *before* he ran the last study, the balance might shift towards censure for that specific act, as it would imply deliberate defiance of an emerging norm. Without that fact, however, the recommended path offers a more just and credible resolution.

  **Concrete Action:** Move that the committee decline to censure M. but direct the drafting of the Society Statement on Historical Research Ethics for Council approval and publication within six months, with the specific papers named above included.
