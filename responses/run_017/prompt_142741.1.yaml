answer: |-
  Here’s a reconstruction of conservation law’s implicit metaontology, testing your distinction and its implications:

  ### Core Presuppositions of Conservation Practice  
  1. **Species as Actionable Units (High Confidence)**  
     The law presupposes species (or subspecies/DPS) are *operationally countable entities* for regulatory purposes. It does **not** strictly require a single determinate answer to "how many species are in this river?" independent of human practices. Instead, it assumes that:  
     - Taxonomy provides *revisable but non-arbitrary* boundaries.  
     - These boundaries track biologically significant features (e.g., reproductive isolation, genetic distinctness, ecological role).  
     - Revisions reflect *improved alignment* with these features, not mere semantic preference.  

  2. **Authority-Relativity, Not Stipulation (Moderate-High Confidence)**  
     The law treats species as **discovered through expert consensus**, not stipulated. Key evidence:  
     - Taxonomic revisions trigger automatic legal updates (e.g., species splits/lumps altering protection status). This shows the law defers to scientific *process* (evidence-based deliberation), not fixed definitions.  
     - If species were purely stipulated, legal protections would not shift without legislative reauthorization. The fact they do reveals an implicit realism: scientific revisions *track mind-independent discontinuities*.  

  ### Your Distinction: Purpose-Relativity vs. Verbal Disputes  
  Your framework fits neatly:  
  - **Not merely verbal**: Fixing terms (e.g., adopting "biological species concept" universally) wouldn’t resolve all disputes. Competing concepts (phylogenetic, ecological) capture different aspects of biodiversity, and the "correct" choice depends on the *purpose* (e.g., prioritizing genetic diversity vs. ecosystem function).  
  - **Purpose-relative objectivity**: The law assumes taxonomic revisions are constrained by empirical reality *and* conservation goals. For example:  
    - Splitting a species may reflect new genetic data showing isolated populations *deserving independent management*.  
    - Rejecting a subspecies designation might occur if it lacks *evolutionary or ecological significance*.  
  The "point of inquiry" (conserving biodiversity as evolving lineages) is non-arbitrary. Thus, species counts are *purpose-relative facts*—not subjective, but tied to the objective of preserving evolutionary processes.  

  **Earning its keep**: This distinction explains why:  
  - Law tolerates taxonomic flux (revisions refine alignment with purpose).  
  - It resists treating species as "whatever we stipulate" (revisions must be scientifically justified, not capricious).  
  - Trouble spots arise where biology clashes with purpose-relativity:  
    - **Hybridization**: Confounds species boundaries but may convey adaptive potential (purpose: protect evolutionary processes → law struggles to categorize).  
    - **Contested taxa**: High conservation value + ambiguous status (e.g., African elephants as one or two species) forces ad hoc measures, revealing the system’s reliance on purpose-relative boundaries.  

  ### Compatibility with Deflationary Views  
  The practice is **compatible with moderate deflationism** but **resists radical quantifier variance**:  
  - **Compatible**: Law can accept that "species" is a context-dependent term, provided its use in conservation is fixed by the *purpose* of preserving biodiversity. No commitment to species as "natural kinds" is needed—only to their role as proxies for evolutionarily significant units (ESUs).  
  - **Incompatible with radical deflationism**: If species talk had *no* objective anchor (e.g., if quantifier variance implied all classifications are equally valid), legal protections could not coherently track scientific revisions. The law’s responsiveness to taxonomy assumes revisions move toward *better approximations* of biologically real units.  

  ### Implications of Adopting Explicit Deflationism  
  If conservation law explicitly embraced deflationism (species as *only* linguistic constructs):  
  1. **Listing would decouple from taxonomy**: Protection would target *conservation-relevant properties* directly:  
     - Evolutionary distinctness (e.g., via phylogenetic uniqueness).  
     - Ecological functionality (e.g., keystone roles).  
     - Genetic diversity metrics.  
  2. **Legal mechanisms would require overhaul**:  
     - "Species" as a category in legislation would be replaced by criteria like "Evolutionarily Significant Unit" or "Managed Unit".  
     - Listing decisions would rely less on taxonomic committees, more on genomic/ecological assessments.  
  3. **Hybrids/population segments**: Ambiguous cases would gain clearer pathways (e.g., protecting "adaptive complexes" regardless of species status).  

  ### Confidence and Key Uncertainty  
  - **High Confidence**: Law presupposes purpose-relative (not stipulative) boundaries.  
  - **Moderate Confidence**: Practice rejects radical deflationism but accommodates moderate deflation.  
  - **Least Confident Claim (Flagged for Scrutiny)**: That purpose-relativity *fully* escapes constructivism.  
    - **Why?** The "point of inquiry" (conserving biodiversity) is itself a human value. If taxonomic revisions subtly align with cultural priorities (e.g., charisma), purpose-relativity may blur into conventionalism. Your framework handles this better than most, but the boundary warrants care.  

  **In sum**: Conservation law’s ontology is **purpose-relative realism**—species are real units *for the goal of preserving biodiversity*, with taxonomic revisions refining their identification. Your distinction clarifies why this isn’t verbal (purpose anchors objectivity) and predicts friction where biology resists binarization. If deflationism won, law would pivot to direct measurement of conservation-value properties.
