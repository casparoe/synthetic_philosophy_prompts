prompt: |-
  I'm putting the finishing touches on a chapter about objective chance and rational credence, and before I hand it to a reading group I'd like a consistency check from someone who doesn't already know where I think the trouble is. Here is the package, more or less as I would defend it.

  (1) The Principal Principle: my credence in A, conditional on the hypothesis that the objective chance of A at t is x together with whatever admissible evidence I have, ought to be x. And I take the history of particular fact up to t, in full detail, to be admissible.

  (2) Chances do not require indeterminism. A world can be deterministic and still contain non-trivial chances — think of a gas whose evolution is fixed by the micro-dynamics but whose chance of spreading into the far corner of the room comes from a statistical postulate. But I also hold that in such a world knowledge of the exact total state of the world at t has to count as inadmissible: if it were admissible, the future would be certain given what I know and the chances would drop out of the picture, and I don't want to say they drop out.

  (3) Chances supervene on the whole mosaic, future included. What the chance of this atom's decaying tomorrow is depends partly on how the rest of the world's history goes, tomorrow and after; chances are what fall out of which overall description of the total history best balances simplicity against informativeness.

  (4) The only inadmissible evidence is evidence about whether A itself occurs, direct or indirect. In particular, evidence about what the chances are at times other than t is admissible, and has to be — otherwise the Principle goes idle in exactly the statistical cases where I most need it.

  (5) I'm attracted to a functionalist gloss on all this: what makes a quantity a chance is largely its occupying the role the Principal Principle describes, so a quantity that systematically misled anyone who deferred to it would not deserve the name.

  (6) Call a process frequency-locked when a finite run of tosses is governed by a law saying that at every toss in the run, the objective chance of heads equals the proportion of tosses in the entire run that land heads. Take a run of exactly one thousand tosses in which exactly seven hundred land heads, so the chance of heads at every toss is 0.7 — and notice that it stays 0.7 however the run has gone so far, because the proportion is fixed by the run as a whole. You are standing at toss 500. You know the law, you know the chance of heads now is 0.7, and you have the record: the first 499 tosses produced 400 heads. It follows that exactly 300 of the remaining 501 tosses are heads, which makes heads on toss 500 roughly a sixty per cent prospect. My verdict: set your credence at 0.7 anyway. The arithmetic that gets you to sixty per cent is precisely the sort of reasoning that deference to chance is supposed to cut off, and a chance you have to second-guess with bookkeeping is not doing its job.

  (7) Two worries I can't bring into focus. First: I'm a Bayesian about updating and I think you should always use all of your evidence, and deference to chance looks like a licence to ignore part of it. Second: making chances relative to a time and to an evidence situation looks as though it makes them something less than fully objective.

  What I want is an audit. Go through (1) through (7) and tell me which pairs are genuinely in tension and which only look that way, ranked by severity rather than flagged uniformly; for each real tension, state precisely what would have to be given up and what the cheapest repair would cost me elsewhere in the package; and then tell me which single revision would clean up the most. Tell me which of my two worries in (7) survives inspection. Then run whatever package you recommend against the frequency-locked case and say whether my verdict in (6) survives it — and if you think the case itself is defective, that the law I describe could not be a genuine chance law, or that it collapses chances into frequencies, say so plainly and explain why, since that would move the problem rather than solve it.

  Please argue for one resolution rather than surveying the options: I'd rather be told which commitment you would drop and why than be handed a menu. And write in American English.
reasoning: |-
  Okay, the user is presenting a complex philosophical framework about objective chance and rational credence, seeking an audit for internal consistency. They've laid out seven key positions and want me to identify tensions, suggest repairs, and apply it to a frequency-locked case. 

  Hmm, this is clearly a sophisticated academic - likely a philosopher working on probability or decision theory. The tone is precise and technical, but with underlying anxiety about potential flaws. They're handing this to a reading group soon, so they want to preempt criticism. The phrase "don't already know where I think the trouble is" suggests they suspect specific problems but want unbiased validation.

  Let me unpack their package systematically. Points (1) and (2) establish a Lewisian Principal Principle with admissibility defined as complete historical knowledge, while allowing deterministic chances. But (3)'s Humean supervenience makes chances depend on the entire spacetime mosaic, including future events. That's where I see the first major crack - how can historical knowledge be admissible if chances depend on the future? 

  Ah, and point (4) compounds this by claiming only direct evidence about A is inadmissible. But in their frequency-locked coin example (6), knowing past tosses is indirect evidence about future outcomes, yet they insist we should ignore it. That feels inconsistent - like wanting to have your epistemic cake and eat it too. 

  The functionalism in (5) is interesting but doesn't resolve the core tension. If chances are defined by their guidance role, but that guidance requires ignoring relevant evidence (like the 400/499 heads record), that undermines the whole rational deference premise. 

  For their worries in (7): The Bayesian updating concern is deadly serious - their framework literally demands disregarding statistical evidence. The objectivity worry is less pressing since chances remain ontologically objective even if epistemically constrained. 

  The frequency-locked case exposes everything: their position requires maintaining 0.7 credence despite overwhelming evidence that the true frequency is diverging. That's not rational deference - it's willful blindness. The "law" described isn't a genuine chance law but a frequency in disguise. 

  The indispensable fix is abandoning (4)'s narrow inadmissibility. We must allow that evidence about the future (via past frequencies) can be inadmissible relative to chance claims. This preserves the Principal Principle's spirit while accommodating Bayesian rationality. 

  Applying this to the coin case: knowing 400/499 heads is inadmissible for the single-toss chance because it reveals the actual future frequency. Credence should reflect the 60% calculation - anything else would be irrational. 

  This revision strengthens their package overall. It resolves the Bayesian worry, makes supervenience coherent, and handles the frequency-locked case without special pleading. The cost? Some loss of simplicity in admissibility, but that's cheaper than abandoning Humeanism or the Principal Principle.
answer: |-
  Here's your audit, ranked by severity of tension, with repairs focused on preserving the core insights while maintaining consistency. I'll argue for a specific resolution path:

  **Critical Tension (Severity: High)**
  *   **Tension:** **(3) + (4)** vs. **(1) + (2) + (6) + Bayesianism (part of 7)**
      *   **Conflict:** (3) (Humean Supervenience - HS) makes chances depend on the *entire* mosaic, including the future. (4) states that *only* evidence directly about whether A occurs is inadmissible. However, knowledge of the *past* (specifically, frequencies or patterns within the past that constrain the future total frequency) is *indirect* evidence about the future occurrence of A. In the frequency-locked case (6), knowing the first 499 tosses (400H) *is* evidence about the entire run's outcome (and hence about toss 500) because the total frequency is fixed. (4) deems this past record admissible. But using it (as the 60% calculation does) directly contradicts deferring to the known chance of 0.7 mandated by (1) and your verdict in (6). It also violates Bayesianism (first worry in 7) by requiring you to *ignore* powerful statistical evidence relevant to A (heads on toss 500).
      *   **Precise Problem:** Under HS (3), the chance at t (0.7) is determined by the *entire* pattern, including the future. Evidence about the *past* part of that pattern (the first 499 tosses) is evidence about what the *future* part *must be* to achieve the total frequency. This evidence is highly relevant to whether A (heads on toss 500) occurs *and* to what the true chance at t *actually is* (since the chance supervenes on the total pattern). (4) incorrectly classifies this highly relevant evidence as admissible.
      *   **Cheapest Repair:** **Abandon (4).** Broaden the definition of inadmissible evidence. Evidence is inadmissible relative to the chance of A at t if it provides information about the *future course of events* that is relevant to whether A occurs *and* that is not already accounted for in the determination of the chance at t itself. Crucially, **evidence constraining the total future pattern upon which the chance supervenes (like the past record in the frequency-locked case) counts as inadmissible**.
      *   **Cost:** Loss of simplicity in the admissibility criterion. It's no longer captured by a simple phrase like "direct or indirect evidence about A". Requires recognizing that evidence revealing constraints on the *future* mosaic (which HS says determines the chance) can be inadmissible relative to the *current* chance claim, even if it's "just" past data.
      *   **Why this Repair?** It directly resolves the core inconsistency exposed by the frequency-locked case. It preserves the core of (1) (PP), (2) (Determinism + Non-trivial Chances via inadmissible evidence), (3) (HS), and your verdict in (6). It aligns with Bayesianism (use all evidence *except* that explicitly ruled inadmissible by PP's logic). It makes the functionalism in (5) more plausible (a chance you *should* second-guess with pattern knowledge isn't guiding credence properly).

  **Significant Tension (Severity: Medium)**
  *   **Tension:** **(3)** vs. **(2)** (specifically the "knowledge of exact state" clause)
      *   **Conflict:** (2) says knowledge of the *exact* microstate at t must be inadmissible to preserve non-trivial chances in a deterministic world. (3) (HS) says the chance at t supervenes on the *entire* mosaic, including the future. In a deterministic world, the exact microstate at t *plus the laws* entails the entire future mosaic. So, if the laws are known (as they usually are in such hypotheticals), knowledge of the exact microstate *is* knowledge of the entire mosaic. Therefore, under HS (3), knowledge of the exact microstate *is* knowledge of the chance at t (since the chance supervenes on the mosaic). But (2) only says this knowledge is inadmissible because it makes the future certain, *not* because it tells you the chance.
      *   **Precise Problem:** Under HS in a deterministic world, the "inadmissibility due to microstate knowledge" and the "inadmissibility due to knowledge of the future mosaic/chance" collapse into the same thing. (2) identifies the symptom (future certainty) but not the deeper reason under HS: knowing the microstate (+laws) entails knowing the entire mosaic, hence the HS chance.
      *   **Resolution within Repair:** The repair above (abandoning (4) and broadening inadmissibility) *absorbs* this. In a deterministic HS world, knowledge of the exact microstate (and laws) provides maximal information about the future mosaic, hence maximal information about the HS chance and about all future events. It is clearly inadmissible relative to *any* chance claim at t for a future event. The tension is resolved by recognizing that the *reason* microstate knowledge is inadmissible under HS is *because* it reveals the future mosaic/chance. No need to abandon (2) or (3).

  **Minor Tension / Clarification Needed (Severity: Low)**
  *   **Tension:** **(5) Functionalist Gloss** vs. **(3) Humean Supervenience**
      *   **Potential Conflict:** Functionalism (5) suggests the role (PP guidance) is *definitive*. HS (3) is an ontological thesis about what *realizes* that role. A pure functionalism might be compatible with non-Humean realizations (e.g., primitive propensities). Does (5) commit you to HS, or is HS just your favored realization?
      *   **Resolution:** Clarify that (5) expresses a *core commitment* to the guidance role being essential to *what chance is*, but that (3) (HS) is your specific, defended *metaphysical account* of what physical facts *play* that role. They are compatible if you argue HS provides the best realization of the functional role. No revision needed if this is your intent. The functional role justifies why we care about HS chances.

  **Worries in (7) Revisited:**
  1.  **"Deference looks like ignoring evidence / Conflicts with Bayesianism":** **This worry largely survives** *without* the repair to (4). If inadmissible evidence is narrowly defined as only direct evidence about A (old (4)), then deferring to chance in cases like the frequency-locked coin *does* require ignoring highly relevant statistical evidence (the past record), violating Bayesian conditionalization. **Resolution:** The repair (abandoning (4), broadening inadmissibility) directly addresses this. The past record in the frequency-locked case is deemed inadmissible *because* it reveals the future constraint. Deferring to chance *is* rationally ignoring evidence that is inadmissible relative to the chance hypothesis, which is consistent with Bayesianism when the inadmissibility clause is properly understood. *With* the repair, this worry is resolved.
  2.  **"Chances relative to time/evidence = less objective":** **This worry largely dissolves.** Relativity to time is unproblematic (e.g., the chance of rain changes as the storm approaches). Relativity to an *evidence situation* is misleading. Chances, under your view (especially with HS (3)), are **objectively determined by the physical world** (the whole mosaic). What changes with the *agent's* evidence situation is what *counts as admissible* relative to the chance hypothesis in applying PP. The chance itself remains a fully objective feature of the world at that time. The *constraint* the chance places on rational credence depends on the agent's *total* evidence (via admissibility), but the chance *property itself* is objective.

  **The Single Most Effective Revision:**
  **Abandon (4) and broaden the definition of inadmissible evidence** as described above (evidence constraining the future mosaic/chance is inadmissible). This directly resolves the critical tension with the frequency-locked case, resolves the major Bayesian worry (7.1), absorbs the microstate knowledge tension from (2) vs. (3), and preserves the core of the rest (1, 2, 3, 5, 6).

  **Revised Package vs. Frequency-Locked Case (6):**
  *   **Your Verdict (Credence = 0.7) Survives? Yes.**
  *   **Explanation (Revised View):** You know the law (chance = total frequency = 0.7) and the *past record* (400H in 499 tosses). Crucially, under the revised inadmissibility, **the past record is INADMISSIBLE** relative to the hypothesis "Chance-of-Heads-at-toss-500 = 0.7". Why? Because it provides direct information about the *future* constraint necessary to achieve the total frequency (exactly 300H in the remaining 501 tosses), which is information about the future mosaic that determines the chance and is highly relevant to the outcome of toss 500 itself. Therefore, PP (1) instructs you to set your credence in heads on toss 500 *conditional on* (Chance=0.7 & this inadmissible evidence) to 0.7. Since the evidence *is* inadmissible, you *do not conditionalize on it* when setting your credence under the chance hypothesis. You set credence = 0.7, as you desired. The "60% calculation" uses evidence correctly deemed inadmissible for this specific conditionalization. The chance law is genuine *because* it occupies the functional role (PP guidance) and is determined by the whole pattern (HS); it doesn't collapse into a frequency because it *is* the frequency (in this specific setup mandated by the law), but it *guides* rational credence via PP despite that, precisely by ruling the frequency-constraining evidence inadmissible.

  **Why the Frequency-Locked Case Doesn't Collapse Chances into Frequencies (Under Revised View):**
  The chance *is* the frequency in this specific constrained scenario (it's fixed by law). However, the functional role (PP) is still active and distinct: the chance *guides rational credence* precisely by dictating that agents should *ignore* the very frequency information (in the past record) that would otherwise allow them to calculate the exact outcome or a different probability. The *role* of chance (rational guidance via deference under restricted information) remains distinct from the frequency itself, even when they numerically coincide. The law makes the chance equal to the frequency *and* makes the past record inadmissible evidence relative to that chance claim, preserving its normative force.
