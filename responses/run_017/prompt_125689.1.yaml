  ### Structured Activity: Rule-Following Skepticism Simulation  
  **Core Idea:** Students invent rules for transforming strings of symbols, then experience underdetermination when extrapolating beyond training data. A "shadow rule" (divergent at scale) emerges implicitly.  

  ---

  ### **Handout Wording**  
  **Handout 1 (For Inventors):**  
  *Title: Rule Creation*  
  "You are inventing a **reduction rule** that transforms strings of 'α' and 'β' into a single symbol: 'α' or 'β'.  
  - **Alphabet:** Only α and β (e.g., ααβ, βαα, etc.).  
  - **Rule form:** Your rule must output α or β for any non-empty string. It must depend on the *order* and *count* of symbols (e.g., ‘If the string starts with α, output α’).  
  - **Do:** Fill outputs for the training strings below. *Do not write your rule—only the outputs!*  

  | String | Output (α/β) |  
  |--------|--------------|  
  | α      | \_\_\_       |  
  | β      | \_\_\_       |  
  | αα     | \_\_\_       |  
  | αβ     | \_\_\_       |  
  | βα     | \_\_\_       |  
  | ββ     | \_\_\_       |  
  | ααβ    | \_\_\_       |  
  | βαβ    | \_\_\_       |  
  | αβα    | \_\_\_       |  
  | ββα    | \_\_\_       |  

  **Handout 2 (For Learners):**  
  *Title: Rule Learning*  
  "Study the inventor’s training outputs. Predict outputs for these test strings:  
  1. αβαβ → \_\_\_  
  2. βααβ → \_\_\_  
  3. ααβα → \_\_\_  
  4. ββαα → \_\_\_  
  5. βαβαα → \_\_\_  

  **Handout 3 (Test for Adjudication - Projected):**  
  "Class Adjudication:  
  - Inventor’s test answer: βααβ → **β**  
  - Learner’s test answer: βααβ → **α**  
  Vote: Which is correct? Why?"  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 80 minutes**  
  1. **Setup (5 min):**  
     - Pair students (7 pairs: Inventor + Learner).  
     - Distribute handouts. Emphasize: *"Rules must depend on symbol patterns—no constant rules!"*  

  2. **Rule Creation (10 min):**  
     - Inventors fill training outputs (Handout 1). *Example rule: "Output α if α-count > β-count; else β."*  

  3. **Learning Phase (10 min):**  
     - Learners study inventor’s training outputs. *Optional: Learners may request 1 extra training string (max length 5).*  

  4. **Testing Phase (15 min):**  
     - Learners predict test outputs (Handout 2).  
     - Inventors *secretly* write their own answers for test strings.  
     - **Stakes:** Pairs score 1 point per matching test answer.  

  5. **Adjudication (20 min):**  
     - Instructor selects 1 pair with a test mismatch (e.g., βααβ → β vs. α).  
     - Project Handout 3. Inventor explains *their* rule; learner defends theirs.  
     - Class votes: "Which answer fits the inventor’s rule?" (Vote favors inventor).  
     - Discuss: *"Why does the inventor’s view prevail?"*  

  6. **Debrief (20 min):**  
     - Reveal Kripke’s paradox. Map activity moments to concepts.  

  ---

  ### **Debrief: Mapping Activity to Kripke’s Paradox**  
  1. **The Skeptical Paradox (Normativity):**  
     - **Activity Link:** Learners extrapolated beyond training data (test strings), but no fact *in the training* forced one rule over a shadow rule.  
     - **Argument:** The inventor’s intention ("I meant output β!") feels authoritative, but intentions are mental states that could align with infinite rules. *Why is the shadow rule wrong if it matches all evidence?*  

  2. **Community Verdict (Skeptical Solution):**  
     - **Activity Link:** Class sided with inventor during adjudication—*satisfying* but circular.  
     - **Argument:** The community’s verdict resolves disputes, but it’s "just more behavior." It doesn’t fix meaning; it enforces conformity.  

  3. **Failed Replies:**  
     - **Dispositional:** "The inventor *would* output β for long strings."  
       - *Cost:* What if the string is too long? Dispositions aren’t truth-tracking (e.g., mistakes).  
     - **Realist:** "Abstract rules exist independently."  
       - *Cost:* No access to platonic rules—training underdetermines which rule was "grasped."  
     - **Communal:** "The group decides correctness."  
       - *Cost:* Relativizes truth; the inventor *meant* something pre-communally.  

  4. **The Shadow Rule:**  
     - **Activity Link:** A shadow rule agrees on all training/test strings (e.g., "Output α if α-count > β-count *for strings ≤10 symbols*; else β").  
     - **Divergence:** At 1M symbols, the shadow rule flips (e.g., outputs β when α-count > β-count).  
     - **Close off "more data":** Students can’t compute 1M-length strings—yet insist the shadow rule is *wrong*. Reveals normativity: Rules bind beyond evidence.  

  ---

  ### **Predictable Challenges & Limitations**  
  **What Will Go Wrong:**  
  - **Low Stakes:** Some pairs may not take scoring seriously. *Mitigation:* Announce winners ("Most matched answers!") to incentivize.  
  - **Ambiguous Rules:** Inventors might create vague rules (e.g., "Output the prettier symbol"). *Mitigation:* Stress *pattern-based* rules in setup.  
  - **Adjudication Bias:** Class may sympathize with learners. *Mitigation:* Ask: "If you invented this rule, would you accept the learner’s version?"  

  **One Unreproducible Feature:**  
  The activity assumes the inventor’s intention is accessible (they explain their rule). **In the real paradox, intention itself is underdetermined—no "mental fact" fixes meaning.** You must clarify:  
  > *"Kripke’s skeptic asks: What fact about your past self determines you meant ‘+’ not ‘quus’? Not dispositions, not mental states. The activity’s inventor can speak—but solitary rule-followers have no such recourse."*  

  ---

  By simulating rule invention, misalignment, and communal adjudication, students *feel* the paradox before naming it. The debrief ties their frustration to Kripke’s challenge: Rules demand compliance beyond evidence, yet no fact settles correctness.
