  Why this? Because it's simple enough to compute by hand for short strings, but for very long strings it becomes impossible. Also, the rule is arbitrary and invented by the students, so there are no pre-existing abstract objects (like numbers) to fall back on.

  Structure of the rule: 
  - The rule must be defined for any non-empty string of A's and B's. 
