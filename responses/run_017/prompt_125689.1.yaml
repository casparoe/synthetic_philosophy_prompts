     - The activity relies on the presence of the inventor to settle disputes and to state their intention. But in the solitary case of following one's own rule, there is no external authority. The question is: how do I know that I am following my own rule correctly? The activity does not capture this first-person aspect.

     We'll have to explain that in the debrief.

     This design meets the constraints.
