  We will have two roles: "inventor" and "learner". The inventor creates a rule (by writing it in a specific form) and then teaches it to a learner by giving examples. The learner then tries to apply the rule to new strings. The catch: the rule must be one that, when applied to very long strings (say, longer than a million symbols) would give a different output than a "shadow rule" that agrees on all shorter strings.

