  First, I'll restate the theorem using their terms. Voters are binary tests with accuracy p, independence is conditional independence given the true state, and majority rule aggregates results. The limit result shows posterior error probability decreases with more tests if p > 0.5. Dependence is like correlated errors reducing information gain.

  Now for their residue report. Point 1: Estimating competence without a gold standard. In elections, there's no reference standard, so inferring p from agreement is circular, similar to latent class models but with different assumptions. Point 2: Fact of the matter. Diagnostic testing assumes a true state, but political decisions involve preferences, not truth. This is a fundamental gap. Point 3: Uniform weighting. The theorem weights all votes equally, unlike likelihood ratios which vary by test reliability. Point 4: Asymmetric costs. Majority rule isn't optimal with different error costs; a supermajority might be better. Point 5: Fairness and obligations. The theorem doesn't address normative aspects, so this is outside the analogy.

