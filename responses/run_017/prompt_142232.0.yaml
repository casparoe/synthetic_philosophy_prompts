prompt: |-
  I'm a senior at a large public high school, and I run a small student forecasting club. Every Monday we post a board — in the hallway and online — with roughly ten predictions for the week and the month ahead: whether the baseball fields will be playable on Saturday, whether the creek behind the school will top its banks in April, when the first frost will hit the community garden, how many people will come to the fall play, whether the courtyard will be dry enough for an outdoor assembly three weeks out. The groundskeeper, the garden club's faculty sponsor, the athletic director, and — somewhat alarmingly — a couple of local reporters read it and act on it. We've been doing this for a year. We have a rooftop weather station that logs temperature and rainfall, a spreadsheet, and a track record that includes two calls I'd rather not be reminded of: a harvest we organized two weeks early, and a field treatment the groundskeeper applied ahead of a rain that never came. Nobody on the team has had differential equations; we can do arithmetic, logarithms, and basic statistics. I have about an hour a week for this, and a faculty advisor has to approve anything before it goes up.

  The reason I'm writing is an argument we keep having, which is now getting in the way of the actual work. One member says the world is deterministic, the equations fix a single future, so every failed forecast is just a measurement problem and better instruments plus a bigger computer would eventually get everything right. Another says that because of chaos anything past ten days is random in exactly the way a coin flip is, so there is nothing to choose between forecasts and no point in trying. I don't think either can be right, but I can't say why in a way that settles it, and I suspect the truth is a set of distinctions rather than a compromise.

  What I'd like is a written procedure my team can run on each new request in ten or fifteen minutes, something we can tape up next to the whiteboard. For each prediction we're asked for, in order: the questions to ask, and what would count as a sufficient answer to each one. I have in mind a few distinctions I only half understand, and I'd rather you correct them than flatter me. First, the difference between not knowing the current state precisely enough and having equations that are themselves slightly wrong — I gather these fail in different ways, that the first kind of error grows and then levels off while the second drags the forecast systematically in one direction, and that this difference should show up in our own past errors if we look at them the right way. Second, the difference between predicting what happens on a particular day and predicting how many days in a month will be above some value; I've been told the first can be hopeless while the second is fine, and I'd like to know exactly when that gap opens and how wide it is. Third, the thing where a model produces a perfectly self-consistent story that no real sequence of events actually matches — whether we should treat our own run as evidence at all. And fourth, the arithmetic that tells us what better instruments would actually buy: I gather that each extra digit of precision in the starting conditions buys a fixed amount of extra time rather than an ever-growing amount, and I'd like that turned into a number-of-days calculation we can do on a spreadsheet, because it converts a philosophical argument into one we can settle at a whiteboard.

  I also need the procedure to know when to stop. There should be a point at which it says: do not issue this as a date or a number, issue it as a range or a probability or nothing at all, and here is how to tell which. And there should be a point at which it says: this is not a question about the system, it is a question about what we're willing to risk — whether a false alarm that sends volunteers out for nothing is worse than a missed frost that kills the tomatoes — and that belongs to the advisor and the garden club, not to us. Please mark those hand-offs explicitly, and be honest about which steps are judgment calls dressed up as procedure, because I'd rather know now than discover it in front of the newspaper.

  Finally, please run the finished procedure on three of our real requests. The first is the first-frost date for the garden, which is the prediction we're proudest of — we've been close two years running — and I have a suspicion the procedure will tell us we've been getting lucky and can support nothing sharper than a window, which I will not enjoy hearing but would rather hear. The second is the April creek-flood question, where what people actually need is a yes or no about a threshold rather than a daily river level. The third is the outdoor assembly three weeks out, which I think the procedure may tell us not to answer at all, and where I'd like to know what we should post instead that isn't just a shrug. For each, show the steps as my team would actually work through them in fifteen minutes, including where we'd have to write "we don't know" for a quantity we'd normally just guess. And please end by saying plainly what a procedure like this cannot do — which questions about predictability it has no purchase on, so that we don't start trusting it in places where it is only giving us the appearance of having thought.
reasoning: |-
  Okay, this is a fascinating and highly sophisticated request from a high school senior running a forecasting club. The user is clearly deeply engaged with practical forecasting challenges and has encountered a philosophical rift in their team about determinism vs chaos. 

  Hmm... what they need isn't just an explanation but a concrete decision procedure that can resolve arguments during their weekly meetings. The depth of their understanding is impressive - they're already grappling with concepts like model error vs initial condition error, ensemble forecasting, and the difference between point predictions and probabilistic outcomes. 

  I notice they're particularly concerned about operationalizing these concepts. The request for specific spreadsheet calculations and whiteboard-ready procedures suggests they value actionable tools over theoretical discussions. The three real-world examples they provided (frost date, flood threshold, assembly weather) are perfect test cases because they represent different forecasting horizons and types of uncertainty.

  The emotional tone is noteworthy too - there's clear frustration with the philosophical stalemate, but also admirable self-awareness about possibly "getting lucky" with their frost predictions. The mention of local reporters reading their board adds stakes; they need rigor to maintain credibility.

  Key challenges I need to address:
  First, creating a step-by-step flow that fits in 15 minutes per prediction. This means prioritizing the most diagnostic questions and providing clear exit ramps when uncertainty is too high. 

  Second, explaining predictability limits quantitatively - especially that famous "each digit of precision buys about 2.5 forecast days" Lorenz result. Need to make that spreadsheet-operational with concrete examples.

  Third, demarcating where forecasting stops and risk management begins - that garden frost example perfectly illustrates this boundary. The false alarm vs missed frost tradeoff isn't theirs to decide.

  For the procedure itself, I'm thinking of structuring it as a flowchart with:
  - Input validation (is this even a forecastable question?)
  - Uncertainty typing (initial condition vs model structure)
  - Predictability horizon calculation
  - Output formatting decision tree

  The three test cases will be crucial. For the frost date: I suspect their success relies on climate normals more than dynamic forecasting, so we'll need to show how to separate skill from luck. For the flood threshold: we can demonstrate exceedance probability vs binary yes/no. For the 3-week assembly: this might hit a predictability wall, but we can suggest alternatives like climatological odds.

  Most importantly, I must end with clear limitations - this framework can't handle structural breaks (like if the creek's drainage changes) or truly novel events. And it can't resolve metaphysical debates about determinism, only operationalize predictability.
answer: |-
  Here's a practical procedure for evaluating forecast requests, designed for clarity and efficiency. It addresses your core distinctions and includes explicit hand-offs. Tape this next to your whiteboard:

  ---

  ### **Forecast Evaluation Procedure (10-15 min per request)**

  **Step 1: Define the Question**  
  *Ask: "What *exactly* is being asked? (Threshold? Date? Probability? Count?)"*  
  - **Sufficient answer:** A precise, measurable outcome (e.g., "≥2 inches of rain on 4/15," not "will it flood?").  
  - **Hand-off:** If the question is vague, return it to the requester for clarification.  

  **Step 2: Classify Predictability Type**  
  *Ask: "Is this driven by *initial conditions* (e.g., current soil moisture) or *model structure* (e.g., rainfall physics)?"*  
  - **Sufficient answer:**  
    - **Initial Conditions (IC) Error:** Use if small measurement errors dominate (e.g., frost date, river crest timing).  
      *Check past errors:* If errors grow then plateau (e.g., frost date off by 1 day year 1, 3 days year 2, then stable), IC is key.  
    - **Model Structure (MS) Error:** Use if known biases exist (e.g., our model always underestimates creek rise by 10%).  
      *Check past errors:* If errors are systematic (e.g., always high/low) or chaotic (wild swings).  
  - **Hand-off:** If neither pattern fits, default to MS error (more common for complex systems).  

  **Step 3: Calculate Predictability Horizon**  
  *Ask: "How many days until the event? What’s our current input precision?"*  
  - **Sufficient answer:**  
    - For IC-driven forecasts: Use **Lorenz’s Rule**:  
      *Each 10-fold increase in initial data precision buys ~2.5 days of forecast accuracy.*  
      **Spreadsheet Formula:**  
      `Extra Days = 2.5 * log10(Current Measurement Error / New Measurement Error)`  
      *Example:* Improving rain gauge precision from ±0.1" to ±0.01" buys 2.5 * log10(10) = **2.5 days**.  
    - For MS-driven forecasts: Horizon is fixed by model bias.  
      *Example:* If model underestimates creek rise by 10% consistently, horizon = whenever bias exceeds tolerance.  

  **Step 4: Decide Output Format**  
  *Ask: "Is the horizon beyond the event date? Are we predicting a point or a statistic?"*  
  - **Sufficient answer:**  
    | Scenario                          | Output Format                     |  
    |-----------------------------------|-----------------------------------|  
    | Event within horizon              | Single date/number (e.g., "Oct 28") |  
    | Event beyond horizon              | Probability (e.g., "60% chance")  |  
    | Aggregate statistic (e.g., monthly frost days) | Expected value (e.g., "5 days") |  
    | Threshold exceedance (e.g., flood) | Probability (e.g., "P(flood) = 40%") |  
  - **Stop here and post "NO FORECAST" if:**  
    - Horizon < 1/3 of time to event (e.g., 10-day horizon for 3-week event).  
    - Output probability is 30%-70% (too uncertain for action).  

  **Step 5: Risk Hand-off**  
  *Ask: "Does this involve tradeoffs (e.g., false alarm vs. missed event)?"*  
  - **Sufficient answer:** If yes, label the forecast:  
    **"ADVISORY INPUT NEEDED: False alarm cost = [X], Missed event cost = [Y]"**  
    *(e.g., "Cost of unnecessary field treatment = $500; Cost of flooded field = $2,000")*  
  - **Hand-off:** Faculty advisor/garden club/AD decides the threshold.  

  ---

  ### **Applied to Your Cases**  
  *Worked in 15 min each with your tools:*

  **1. First Frost Date (Garden)**  
  - **Step 1:** "First day with temp ≤ 32°F at garden sensor."  
  - **Step 2:** **IC Error Dominant** (past errors: -2d, +1d; no systematic bias).  
  - **Step 3:** Current temp precision ±0.5°F. Lorenz’s Rule: To predict 30 days out, need precision ±0.0005°F (impossible). **Horizon = 12 days** (based on past plateaus).  
  - **Step 4:** Horizon < typical frost date (Oct 15-30 → 15-30 days out). **Output: 10-day window** (e.g., "Oct 22–Nov 1").  
  - **Step 5:** Hand-off to garden club: "Is a 10-day window usable for harvest?"  

  **2. April Creek Flood (Threshold)**  
  - **Step 1:** "Will creek level exceed 5.0 ft in April?"  
  - **Step 2:** **MS Error Dominant** (model underestimates peak by 15% ±5%).  
  - **Step 3:** Horizon = 7 days (bias exceeds 10% beyond this).  
  - **Step 4:** April is 30 days away → **Output: Probability** (use past model errors: 40% chance of >5.0 ft).  
  - **Step 5:** Hand-off: "Is 40% probability sufficient to deploy sandbags?" (Advisor/reporter decides).  

  **3. Outdoor Assembly (3 Weeks Out)**  
  - **Step 1:** "Will courtyard be dry (rain < 0.1") on [date]?"  
  - **Step 2:** **IC Error Dominant** (chaotic atmosphere).  
  - **Step 3:** Current precipitation precision ±0.05". Lorenz’s Rule: Horizon = 14 days max.  
  - **Step 4:** Event at 21 days → **Output: "NO FORECAST"** (horizon < 21/3 = 7 days).  
  - **Post instead:** "Historical dryness probability: 65%" (from past years’ data).  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Resolve metaphysical debates** (e.g., "Is the universe deterministic?"). It assumes *operational unpredictability* regardless of ultimate causes.  
  2. **Handle structural shifts** (e.g., if a new parking lot alters creek runoff).  
  3. **Replace domain expertise** (e.g., how soil type affects frost penetration).  
  4. **Predict true novelties** (e.g., unprecedented events outside historical bounds).  
  5. **Eliminate judgment calls** (e.g., classifying error types). Transparency is key: flag assumptions in writing.  

  **Final Note:** Your success with frost dates likely combines climatology (aggregate predictability) with luck. The procedure forces rigor: a 10-day window is defensible; a single date is not. For the assembly, posting climatology maintains engagement while admitting limits. This isn’t defeat—it’s intellectual honesty, which reporters will respect more than a blown forecast.
