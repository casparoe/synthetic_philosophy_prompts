  (2) Only some are ethically defensible
  (3) None justify pure time preference over geological timescales

  I need to systematically unpack the proverb's possible meanings per their requested categories: risk factors (Type 1), opportunity costs (Type 2), mortality (Type 3), and pure time preference (Type 4). For each, I'll specify whose perspective matters, what's being discounted, and whether it's time-consistent.

  Important nuances: 
