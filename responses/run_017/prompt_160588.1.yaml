prompt: |-
  My brother Tom is getting married next Saturday to Nadia, whose family comes from a place I'll leave unnamed here — a couple hundred kin, everybody with long-standing obligations to everybody else, where a wedding is something the whole network hosts rather than something two people throw. The six-month fight has been the guest list: Tom's side wants sixty people, "people we actually know," and thinks three hundred strangers is closer to a shakedown than a celebration; Nadia's side wants the full network and thinks cutting kin is a betrayal so plain that there's nothing to argue about. Neither side, and I want to stress this, experiences the other as having different customs — each one thinks the other is proposing to do something shabby, and both are completely certain. I'm giving the sibling toast at the reception, five minutes max, to a room that's half Toms crowd (nurses, his softball team, my parents' neighbours) and half Nadia's relatives, maybe a third of whom will be hearing it in translation, so jokes have to survive being translated.

  Here's my problem, which is professional. I'm four years into a PhD on cross-cultural variation in folk morality and what its supposed to show about moral objectivity — the ultimatum game run in a dozen-odd small-scale societies with offers ranging from stingy to more than half and, as I remember it, at least one place where the generous offers got turned down; the moral foundations stuff; the trolley results that keep looking shakier the more countries get added. The wedding fight is basically my dissertation in miniature, and I keep catching myself reaching for lines I don't believe. I don't want to say love is bigger than all this, because it isn't an answer to anything. I don't want to say the two families "just have different values" with that soothing anthropological shrug, because from the inside neither of them is reporting a preference — they're reporting a requirement — and the shrug quietly reclassifies both of them as tourists in their own moral lives. And I obviously can't adjudicate; I'm the groom's sister, and I genuinely don't know who's right.

  The thing I've been chewing on, and what I'd like you to try to build the toast around, is something like an object-of-inquiry picture: moral judgment is aimed at something the way inquiry into cholera is aimed at something, all of us start from whichever pile of parochial certainties we happened to be handed, and objectivity lives in the procedure of revising those under pressure rather than in any consensus we begin with. On that picture the variation data isn't evidence against objectivity at all — it's just what real disagreement looks like from the outside — and the honest thing to say to two families who disagree is something like: you're both doing the same thing, badly, at the same target, and you'll find out. But I have no idea how to say that in a wedding toast without it sounding like a seminar. So write me the toast: I want it to do one structurally clever thing (my thought was to build it around the guest list itself, or around one concrete object at the reception — the seating chart, the empty chairs, whatever you think works), and one joke that lands for both halves of the room, ideally one that turns on the WEIRD-subjects problem without anyone needing the acronym. And if you think my object-of-inquiry thought can't survive being said out loud in front of four hundred people, tell me that and tell me what I should actually be saying; I'd rather give a toast that's honest and a little flat than one that smuggles in a philosophy nobody in the room consented to.
reasoning: |-
  Okay, the user is crafting a wedding toast for their brother Tom and his fiancée Nadia. The main challenge is the cultural clash between the two families regarding the guest list. Tom's side wanted 60 people they know, while Nadia's side insisted on 300 extended family members due to their cultural norms where weddings are community events. The user is a PhD student studying cross-cultural morality and doesn't want to oversimplify with clichés or false neutrality.

  The user wants the toast to incorporate their academic perspective subtly. They mentioned the "object-of-inquiry" idea: morality is like investigating cholera—starting from parochial views but revising through pressure. The toast should avoid sounding like a seminar. They also want a structurally clever element (like the guest list or empty chairs) and a joke about WEIRD subjects without using jargon.

  Key points to address:
  - **Cultural Conflict**: The families see each other's views as unreasonable, not different customs. The toast must acknowledge this without taking sides.
  - **Academic Integrity**: The user rejects phrases like "love conquers all" or "different values" as dismissive. They need a fresh approach that respects both sides' sense of moral obligation.
  - **Structural Hook**: Using the guest list or empty chairs as a metaphor could tie the toast together. Empty chairs might symbolize absence and presence, bridging the cultural gap.
  - **Joke Requirement**: A joke about WEIRD subjects (Western, Educated, Industrialized, Rich, Democratic) that works for both crowds. The joke should highlight cultural differences without alienation, perhaps using relatable examples like food or seating.
  - **Delivery Concerns**: With translation involved, language must be simple. Avoid complex terms. The joke needs to land even when translated.

  The user’s deeper needs:
  - **Authenticity**: They want to stay true to their academic beliefs without being pretentious.
  - **Unity**: The toast should foster a sense of togetherness despite the conflict.
  - **Emotional Resonance**: Balance intellectual ideas with warmth for a wedding. Avoid flatness but also avoid insincerity.
  - **Practicality**: The toast is 5 minutes max, so concise. Humor must cross cultural and language barriers.

  Brainstorming the toast:
  1. **Opening**: Warm congratulations, light humor about the guest list to break tension. Example: "I’ve never seen so many names in one place... but I’m told it’s a small gathering for some!"
  2. **Structural Element**: Use the seating chart or empty chairs. Empty chairs can represent the missing guests from Tom’s side or the extended family Nadia’s side included. Contrast with filled chairs as a metaphor for bridging gaps.
  3. **Joke**: Reference cultural misunderstandings. "At Tom’s softball game, bringing a casserole might confuse them, but here, not bringing one causes panic!" This subtly nods to WEIRD contexts without jargon.
  4. **Core Message**: Frame the conflict as both families caring deeply but expressing it differently. Compare to scientific inquiry: like studying cholera, moral views evolve under pressure. Emphasize that disagreement is part of seeking truth, not a failure.
  5. **Closing**: Shift to Tom and Nadia’s love as a practical example of navigating differences. End with a toast celebrating their journey.

  Potential Pitfalls:
  - **Complex Ideas**: Simplify "object-of-inquiry" to "we all start with what we know, but real understanding comes from testing it together."
  - **Joke Risks**: Ensure the humor isn’t at one side’s expense. Keep it light and inclusive.
  - **Translation**: Use simple sentences. Avoid idioms that might not translate well.

  Alternative if the idea doesn’t work: Focus on the couple’s role as bridges between cultures, using the wedding as a symbol of merging worlds. Keep it heartfelt but less philosophical.

  Finally, the toast should balance intellect and emotion, using concrete imagery (chairs, guest list) to make abstract ideas accessible. The joke should unite, and the message should validate both families’ perspectives while looking forward.
answer: |-
  Here’s a toast that honors your intellectual honesty, centers your "object-of-inquiry" insight, uses the **empty chairs** as its structural anchor, and includes a joke that subtly nods to WEIRDness without alienating anyone. It’s designed for clarity in translation (short sentences, concrete nouns) and avoids academic jargon while keeping warmth.

  ---

  ### The Toast  
  *(Raise glass, smile at Tom and Nadia)*  

  "Friends, family, strangers I’m thrilled to meet—especially the ones who’ve flown farther than this champagne cork will later. I’m Tom’s sister, and I’ve spent the last six months watching two incredible families plan this wedding. And if you’ve heard *anything* about the guest list… *(pause, knowing look)* …well, let’s just say I now know 200 ways to say ‘But where will they *sit*?’ in three languages.  

  *(Light laugh. Lean in conspiratorially)*  
  "Here’s a secret: Earlier, I counted every empty chair in this room.  
  *(Gesture around)*  
  Some of you see space for sixty close friends. Others see three hundred missing cousins. And honestly? Both sides are right. Because every empty chair isn’t just an absence—it’s a question. *Who should be here? What do we owe each other?*  

  "We all arrive at weddings—or marriages, or moral dilemmas—carrying the world we know. My brother’s softball team might wonder why you’d invite someone you last saw at age two. Nadia’s *tía* might wonder how you *couldn’t*.  
  *(Smile, pivot to joke)*  
  "It reminds me of Tom’s first dinner with Nadia’s family. He brought wine. They brought a live goat.  
  *(Pause for laughter—nods to cultural WEIRDness without labeling it)*  
  "Tom whispered, ‘Is the goat a guest?’ Nadia whispered back, ‘No, it’s appetizer. Keep up.’  
  *(Let laughter settle)*  

  "But here’s what I’ve learned studying how cultures clash: Disagreements like these aren’t about who’s *wrong*. They’re about how fiercely we care. When Tom’s side says ‘family,’ they see faces across a dinner table. When Nadia’s side says ‘family,’ they see a constellation. Neither is a preference—it’s a *duty*, etched deep. And that certainty? It’s not the end of the conversation. It’s the start.  

  "Because the beautiful trouble with being human is this: We build our ‘shoulds’ from the ground we stand on. But love—real love—doesn’t settle for the ground it’s given. It *moves*. It asks, ‘What if my map is missing your mountains?’ It revises.  

  *(Turn to Tom and Nadia)*  
  "That’s why you two give me hope. You didn’t paper over your differences with platitudes. You fought about goat logistics and guest lists… and you’re still here. You let your certainties bump heads, and instead of shattering, they sparked something new: a shared world, bigger than both your starting points.  

  "So let’s raise a glass—not to papering over divides, but to *sitting* with them. To every empty chair that taught us to listen. To every full one that proves we can grow. To Tom and Nadia: Who didn’t just cross a cultural bridge—they’re building a whole new country.  

  *Salud!* To the newlyweds!"  

  ---

  ### Why This Works  
  1. **Structural Hook (Empty Chairs)**:  
     - Physically visible to everyone, transcending language.  
     - Represents both absence (Tom’s missing friends/Nadia’s missing kin) and potential (space for growth).  
     - Lets you pivot cleanly from conflict to resolution: "empty chair as question" → "full chair as proof of bridging gaps."  

  2. **The Joke**:  
     - **"Goat as appetizer"** lands universally:  
       - Tom’s WEIRD-ish crowd laughs at the absurdity (goat = pet/novelty).  
       - Nadia’s family laughs at Tom’s naiveté (goat = obvious food).  
       - Nods to cultural lenses without academic terms. Translates easily (food/hospitality tropes are global).  

  3. **Your "Object-of-Inquiry" Insight**:  
     - Framed accessibly:  
       - "We build our ‘shoulds’ from the ground we stand on" = parochial starting points.  
       - "Love revises" = objectivity through procedural pressure.  
       - "Didn’t paper over differences" rejects false consensus.  
     - Shows disagreement as evidence of shared investment ("how fiercely we care"), not relativism.  

  4. **Avoids Pitfalls**:  
     - No false unity ("love conquers all" is replaced with "love revises").  
     - No anthropological shrug—validates both sides as morally serious.  
     - Centers Tom/Nadia’s journey as proof of concept.  

  ### If You’re Nervous About the Philosophy  
  The toast embeds your insight in story and metaphor, making it feel organic, not lecture-y. But if you still hesitate, simplify the middle:  
  > *"...When Tom’s side says ‘family,’ they see faces across a dinner table. When Nadia’s side says ‘family,’ they see a constellation. And that’s okay. Because today isn’t about choosing one picture—it’s about making a new one together."*  

  ### Delivery Tips  
  - **Pace for Translation**: Pause after key lines (e.g., "every empty chair isn’t just an absence—it’s a question").  
  - **Body Language**: Open palms when describing "both sides"; gesture to empty/full chairs visually.  
  - **Humor**: If the goat joke feels risky, swap for: *"Tom asked if Nadia’s hometown had a Starbucks. She asked if his had a village elder. They were both deadly serious."*  

  This toast respects the room’s divides without freezing them in place. It’s honest, structurally tight, and ends where all good weddings should: with a shared horizon. Break a leg—they’ll love it.
