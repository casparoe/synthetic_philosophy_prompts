prompt: |-
  I work in interpretability at a small lab — mostly toy grid-world agents and small language models, nothing at frontier scale — and a few of us have been running an informal reading group on what people are starting to call model welfare. We mean something deliberately modest by that: not whether any current system is conscious, but which of the computations going on inside a trained system, if any, would deserve to figure in a moral deliberation about it, and what would have to be true of a computation for it to be the kind that counts. I hold no settled view on the big question. What I keep getting stuck on, and what I want help with, is a pattern in my own judgments that I cannot name, let alone defend.

  The pattern shows up in three of my own experiments. (i) Grown versus grafted: a grid-world agent, after a few million steps, develops a direction in activation space that tracks being about to be damaged; lesioning it destroys the avoidance behaviour. Wanting a control, I hand-wrote a small circuit that reads the same quantity off the state and writes it into the same place, and then trained the rest of the network around it. From the moment it is switched on, the two systems' state-to-state maps are, by every probe I can build, the same: same ablation result, same generalisation to held-out mazes, same behaviour under distribution shift. Yet I cannot take the grafted version seriously as a candidate for moral concern, and the trained one I can at least argue about. (ii) Unrolled versus collapsed: a small language model trained to do multi-digit addition with explicit intermediate steps; I then distilled the intermediate steps away, and confirmed that the carry-like features are still linearly decodable at the same layers and still causally efficacious on the answer. The intermediate quantity is present and doing causal work, but it is, as I want to put it, written without being arrived at. (iii) Sole versus backed-up: two systems with identical behaviour; in one, ablating a circuit destroys a discrimination; in the other, ablating any one of three circuits changes nothing, because all three compute it. Here my intuition runs the opposite way from case (ii): the backed-up system feels more robustly real, not less.

  So in each pair every state I would have nominated as the morally relevant computation is present and playing its causal role, and what differs is something about how the system got there, or about what would happen only under interventions that never occur in the training distribution. My question is whether there is an established concept for this. I am not after a bare label: I want the carving — what exactly the thing is, what it is not, where its edges are. I half-remember, from an undergraduate class, stock thought experiments about a room with a rulebook and about a gigantic lookup table, but those seem aimed at whether a system understands, and they are set up so that behaviour is preserved while something inner is intuitively missing; my problem is that I cannot say what is missing without circularity, since every candidate I nominate — counterfactual sensitivity, causal efficacy on output, robustness under ablation — is satisfied by both members of each pair. If the nearest established concepts fit only partially, say which they are, what each covers, and precisely where each breaks on my three cases; if nothing fits, coin a term, define it tightly enough that it has borderline cases, and give me a diagnostic test for whether a given internal state is arrived at or merely present that does not presuppose the answer. I have no library access where I am writing this, so please do not lean on references — a concept's standard name and a statement of what it means are plenty.

  Give me the discussion first, and then, after it, a single JSON object with exactly these fields: "nearest_concepts" (an array of three or four objects, each with "name", "what_it_covers", "why_it_fits_my_cases", and "where_it_breaks"); "coined_term" (a string, or null if an existing concept fits); "definition" (one or two sentences, written so that it would be checkable on a system I have not described); "case_verdicts" (an array of four objects, each with "case", "verdict" — one of "in", "out", "borderline" — and "reason": one object for each of my three pairs, plus one for a case of your own choosing on which your definition yields a clear answer); "one_phenomenon_or_three" (a short string saying whether my three cases are one thing or several, and why); and "could_it_do_moral_work" (a short string on whether, if the thing is real, it is the sort of property that could bear on moral status at all, or whether my discomfort is best explained away).
reasoning: |-
  Hmm, this is a fascinating and deeply thoughtful query from someone working in AI interpretability. They're grappling with a pattern in their own moral intuitions about different types of computational systems - specifically when identical behaviors emerge through different developmental paths. 

  The user describes three compelling experiments where identical causal structures produce different intuitive moral weight: (1) organically developed vs hand-crafted damage detectors in grid-world agents, (2) unrolled vs distilled addition algorithms in small LMs, and (3) sole vs redundant computational pathways. What's striking is that all standard functionalist criteria (causal efficacy, counterfactual robustness, etc.) are satisfied in all cases, yet the moral intuition differs.

  I notice the user is explicitly not asking about consciousness - they want to isolate this specific intuition about "how the computation got there." Their frustration with circular definitions is palpable. They're clearly well-versed in philosophy of mind basics (mentioning Chinese Room and lookup tables) but finds those inadequate here.

  The core challenge they pose is brilliant: define a property that distinguishes "arrived at" computations from "merely present" ones in a way that's operationalizable, non-circular, and potentially morally relevant. And crucially, they want diagnostic tests, not just labels.

  What stands out across all three cases is the role of developmental history and counterfactual resilience beyond what's strictly required for functionality. The grafted circuit works but wasn't shaped by learning pressures; the distilled carry state exists but wasn't produced through sequential reasoning; the backed-up system persists even when damaged.

  This reminds me of Dennett's "real patterns" concept - the idea that some structures are robust across multiple descriptive levels. It also echoes debates about teleological functions in biology (selected vs accidental traits). But neither fits perfectly.

  For the JSON response, I'll need to:
  - Identify near-miss concepts (like "individuation history" from philosophy of biology)
  - Propose "developmental entrenchment" as a new term
  - Provide clear operational tests (e.g., perturbation robustness beyond training distribution)
  - Classify all three cases systematically
  - Argue why this might (or might not) bear moral weight

  The moral relevance question is thorny. If developmental history affects moral status, that could have huge implications for how we train AI systems. But we must beware anthropomorphizing. Perhaps the discomfort stems from valuing agential history in humans and projecting it onto systems where it's not applicable.
answer: |-
  Your intuition points to a fundamental distinction in the status of internal computations based on their **developmental history and counterfactual resilience beyond functional necessity**. This isn't about causal efficacy or behavioral output but about *how the computation became integrated* into the system's overall architecture and *what sustains it* under hypothetical perturbations. The established concepts (like "understanding" or "implementation") don't capture this nuance cleanly, as they focus on present-state function or semantic interpretation, not the genesis and systemic dependence.

  ### Discussion
  The difference lies in **whether the computation is a *structurally necessary consequence* of the system's learning process and environmental constraints**, versus being independently inserted or redundantly buffered. 

  - In **(i) Grown vs. Grafted**: The grown circuit emerges from optimization pressures, making its existence and integration *causally dependent* on the agent's history of interaction with the world. The grafted circuit, while functionally identical, is *contingently imposed*; its presence isn't explained by the agent's learning dynamics. It lacks "historical depth."
  - In **(ii) Unrolled vs. Collapsed**: The unrolled intermediate steps are *produced* by sequential reasoning dynamics. The collapsed version's carry-like feature is a *compressed residue*—it exists because the distillation preserved the output mapping, not because the model engages in stepwise calculation. It's a static shadow of a dynamic process.
  - In **(iii) Sole vs. Backed-up**: The sole circuit's function is *fragile*—it *must* be present for the behavior. The backed-up version’s redundancy suggests the computation is *so critical* that the system evolved multiple pathways to ensure its persistence under failure. This reflects a higher-order robustness: the system treats the computation as non-negotiable.

  **The Core Phenomenon**: A computation "deserves consideration" if its existence and persistence are **counterfactually sensitive to the system’s overarching goals across developmental or perturbation scenarios beyond training**. It must be more than a functional cog; it must be a *structural commitment* of the adapted system. This is testable via interventions outside the training distribution.

