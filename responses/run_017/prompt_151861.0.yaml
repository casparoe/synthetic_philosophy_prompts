answer: |-
  ## Mid-Term Joint Statement: Adversarial Collaboration on Confirmation Theory

  **Section One: Agreed Claims**

  1.  The old-evidence puzzle arises when a theory gains significant confirmation from evidence already known (acquainted) at the time the theory is formulated.
  2.  Standard conditionalization within Bayesian confirmation theory struggles to account for this confirmation because the evidence has probability 1, rendering the likelihood ratio undefined.
  3.  Acquaintance with evidence (its presence in the inquirer's information set) does not logically entail that the evidence was *used* in constructing a particular theory.
  4.  The occurrence and strength of confirmation in episodes involving acquainted evidence appear sensitive to factors like whether the evidence was used in construction and whether it had a prior explanation.
  5.  The planetary orbit case (known anomaly later entailed by a new gravitational theory) presents a genuine instance of the puzzle and is a suitable test case.
  6.  Confirmation theory must ultimately account for changes in an agent's rational credal state, not solely describe abstract relations between propositions.
  7.  An adequate confirmation theory should distinguish cases where a theory merely accommodates known evidence via auxiliary hypotheses from cases where it genuinely predicts novel evidence.
  8.  The explanatory power of a theory is frequently cited by scientists as a source of confirmation.
  9.  Rival confirmation accounts (like those defended by the investigators) should make testably different predictions about specific types of old-evidence cases.
  10. Resolving the old-evidence puzzle requires clarifying the nature of what is learned when a theory is shown to entail acquainted evidence.

  **Section Two: Residual Disagreements**

  | Crux                                                                                                 | Party A (Bayesian Repair)                                                                                                                               | Party B (Explanatory Unification)                                                                                                                                 | Bearing Case | Party A Prediction                                                                                                                               | Party B Prediction                                                                                                                                          |
  | :--------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------- | :----------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **What is learned upon seeing T entails E?**                                                        | The inquirer learns a new proposition (C), representing a logical/mathematical connection between T and E, within an enlarged conceptual language/framework. | The inquirer gains understanding of *how* T explains E, recognizing T's superior explanatory unification, which is not reducible to a new proposition.             | Alpha, Beta, Gamma | Confirmation occurs via updating on C. Confirmation strength depends on P(C\|¬T).                                                                | Confirmation occurs through recognition of unification. Strength depends on degree of unification achieved.                                                  |
  | **Source of Confirmation in Old Evidence**                                                          | Confirmation flows *only* through the newly learned connection (C), not directly through E itself. E's prior status is epistemically inert for T.        | Confirmation flows from the *explanatory achievement* of deriving E within T's framework, superseding previous understanding, regardless of learning a new 'C'. | Alpha, Beta, Gamma | Confirmation occurs iff C is learned and P(C\|T) > P(C\|¬T). E's prior status affects priors, not the confirmation event.                     | Confirmation occurs iff T provides a superior explanation (unification) of E compared to prior state. E's prior status shapes what counts as superior.        |
  | **Role of Independence/Use**                                                                        | The probability of the learned connection C must be assessed conditional on ¬T *without* assuming E is fixed. Use may correlate with lower P(C\|¬T).       | The Bayesian repair implicitly assumes the independence (low P(C\|¬T)) needed to make C confirmatory, but this independence is exactly what is contested by use. | Beta         | **Beta (Used):** Confirmation *can* occur, but is typically weaker than novelty because P(C\|¬T) may be higher (connection might be unsurprising). Tracks P(C\|T)/P(C\|¬T). | **Beta (Used):** Little to no genuine confirmation occurs. The derivation merely shows consistency with construction. Strength negligible vs novelty. Tracks unification gain over null. |
  | **Role of Prior Explanation**                                                                       | Prior explanation affects priors (P(T)) and the probability of C (P(C\|¬T)), but confirmation still occurs only via learning C.                           | Prior explanation sets a benchmark; confirmation requires T to provide a *better* explanation (e.g., more unified, without auxiliaries) than the prior one.       | Gamma        | **Gamma (Explained):** Confirmation occurs via C, but may be weaker than Alpha if P(C\|¬T) is higher due to plausible rival path. Tracks P(C\|T)/P(C\|¬T). | **Gamma (Explained):** Confirmation occurs *only if* T's explanation is superior to the rival's in unification. Strength varies. Tracks unification gain over prior explanation.        |
  | **Comparison to Novel Prediction**                                                                  | Confirmation strength from old evidence via C is typically less than from a novel prediction E_nov (where P(E_nov\|¬T) is low), but can be significant. | Confirmation from successfully explaining *any* significant evidence (old or new) via unification can be equally strong; novelty is not inherently superior.      | Alpha        | **Alpha (Unused, Unexplained):** Significant confirmation occurs, typically stronger than Beta, weaker than novelty. Tracks P(C\|T)/P(C\|¬T). | **Alpha (Unused, Unexplained):** Strong confirmation occurs, comparable to a novel prediction of similar significance. Tracks unification gain (large).      |
  | **Formal Tracking**                                                                                 | The degree of confirmation is formally tracked by the likelihood ratio P(C\|T)/P(C\|¬T) applied upon learning C.                                          | The degree of confirmation lacks a direct, general probabilistic measure; it is tracked by the comparative explanatory unification achieved relative to alternatives. | All          | Quantifiable via Bayesian update on C.                                                                                                          | Not fully quantifiable probabilistically; assessed holistically based on explanatory features.                                                               |

  **Section Three: Verbal Disputes and Genuine Progress**

  **Verbal Disputes:** A significant component of the disagreement hinges on the definition and epistemic status of the "connection" (C). Party A defines C as a newly learned proposition whose probabilistic independence (from ¬T) is essential for confirmation. Party B argues that this definition covertly builds in the contested independence assumption and that the relevant epistemic gain (understanding unification) cannot be adequately captured as a single proposition C within the probability space. Disagreement over whether confirmation is "tracked" probabilistically is partly verbal, depending on whether one accepts Party B's premise that explanatory unification is fundamentally non-probabilistic. Party A's framework *requires* C to be probabilistically independent in the right way for their solution to work, while Party B denies this independence can be non-question-beggingly established or is even the relevant factor.

  **Genuine Progress:** Both investigators agree that genuine progress would result from empirical findings in cognitive science or history of science detailing the precise cognitive processes involved when scientists recognize a theory entails acquainted evidence (Alpha/Gamma cases) and how this impacts their confidence, particularly regarding the role of perceived connections vs. perceived explanatory unification. Furthermore, both would accept the development of a formal model that successfully integrates explanatory considerations (like unification) into a Bayesian or alternative probabilistic framework in a way that yields distinct, testable predictions for cases like Beta and Gamma, without relying on stipulative priors for C, as moving the debate forward substantively, even if such a model is currently unexpected by either party.

  (Word Count: Approx. 875)
