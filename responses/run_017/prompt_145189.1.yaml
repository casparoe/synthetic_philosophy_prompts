prompt: |-
  My flatmate Dev and I got into an argument about this over breakfast, then again at the pub, and I've since wrote it out properly and now it looks like it proves something insane. Background: there's a working paper somebody dropped into a Slack group I lurk in, about compromise as a source of gains from trade between people with different values, and its central move is what the author calls the split-surplus lemma. The idea is that because everyone's returns to pushing their own favoured project are concave — doubling what you spend on a cause less than doubles the good it does — Jensen's inequality means a certain half of a shared pool beats a fifty-fifty gamble at all of it, so even a purely selfish, purely risk-averse agent does better to split than to fight over who wins outright. I buy that bit, and I've actually used something like it in negotiations at work. Dev then built it out into this:

  (1) Concavity is a fact about how value behaves in a shared resource, not about who is right.
  (2) So the surplus from splitting is there whenever two people disagree, and it grows with how concave the returns are and how far apart the two are — not with which of them is more likely to be correct.
  (3) Disagreeing with another person about what to do with a shared pool is structurally the same kind of problem as being不确定 which moral view is true: in both cases you're deciding how to spread a fixed budget of effort across claims you can't fully verify.
  (4) So the same concavity reasoning tells you to hedge under moral uncertainty: spread your effort across the live moral views instead of piling it onto whichever one has the highest expected choice-worthiness.
  (5) And since hedging is spreading rather than probability-tracking, the slice a view is owed doesn't shrink just because you're confident it's false — a view you'd put at 0.1% still gets a seat at the table, because what's doing the work is the concavity, not the credence. He calls the resulting allocation the hedge ratio.
  (6) Therefore: (a) a sensible person keeps a standing slice of her life for every moral view anyone takes seriously, however sure she is that it's wrong; (b) she never takes a high-variance moral bet, however large its expected payoff — no betting the farm on a long-shot intervention, no career gambles on speculative causes; (c) she never refuses to compromise with anybody, including people who want to do things she thinks are straightforwardly monstrous, since there's always some split that both sides prefer to open conflict.

  (6) is obviously mad. I am not going to spend a fixed slice of my twenties honouring a moral view I think is garbage, and I'm not going to offer someone a compromise on something I think is wrong just because he'll take it. But I'd much rather hold onto (1) and (2) than give them up, (3) felt completely natural when Dev said it out loud, and (4) really does look like just (3) applied — hedging a bit under moral uncertainty seems like plain common sense to me. So: which step do you reject, why does it look fine when it isn't, and what does rejecting it cost? Do I actually have to choose between "compromise is often a genuine gain" and "don't give a standing slice of your life to views you're certain are false", or is there a version of the split-surplus lemma that survives? Tell me what each of the other options would set me back too, and please write the answer in British English.
reasoning: |-
  Hmm, the user has presented a complex ethical and economic argument that their flatmate Dev constructed, leading to what they see as an insane conclusion. They want me to identify where the reasoning goes wrong, explain why it seems plausible initially, and clarify the costs of rejecting different parts of the argument - all while maintaining British English.

  The core of Dev's argument uses the split-surplus lemma from economics (about compromise between people with different values due to concave returns) and applies it to individual moral uncertainty. Dev argues that just as two disagreeing parties should compromise due to concavity, an uncertain individual should "hedge" by allocating fixed slices of effort to all moral views regardless of credence. This leads to the seemingly absurd conclusion that one must perpetually allocate resources to views one considers almost certainly false.

  I need to carefully dissect this chain of reasoning. The critical flaw appears at step (3) where Dev equates interpersonal compromise with intrapersonal moral uncertainty. While they share surface similarities (allocating resources under uncertainty), they differ fundamentally in their structure. In interpersonal cases, there are actual conflicting agents with veto power, whereas moral uncertainty involves one agent weighing probabilities of truth.

  Step (4) then misapplies the concavity argument. While some hedging under moral uncertainty might be reasonable, Dev's version ignores probability weights entirely. This leads to the problematic (5) where probability becomes irrelevant. The concavity argument from economics doesn't translate directly because in moral uncertainty, the "disagreement" is epistemic rather than strategic.

  The key difference is that in interpersonal compromise, the concavity comes from physical resource constraints (money, time), while in moral uncertainty, if different moral views are mutually exclusive, allocating to a "wrong" view might not just be inefficient but actually harmful. I should emphasize that rejecting step (3) preserves the valuable insights about compromise (1-2) while avoiding the absurd conclusions.

  I'll structure my response to first validate what's correct in the argument (the interpersonal compromise insights), then pinpoint where it jumps the tracks (the false equivalence in step 3), explain why this seems plausible initially (the surface similarity of "uncertainty"), and clarify what rejecting each part would cost. I'll make sure to use British English throughout as requested.
answer: |-
  Right, let's break this down properly. Dev's argument is clever, but it smuggles in a critical error by equivocating on the *kind* of problem being solved. You're right to balk at (6) – it *is* mad. The flaw lies primarily in **step (3)** and how it bridges to (4) and (5). Here's the dissection:

  1.  **Accepting (1) & (2): The Core Interpersonal Insight:** You're spot on. The split-surplus lemma for *interpersonal* compromise is sound and valuable. When two *actual agents* with conflicting preferences/values over a *shared, divisible resource pool* (money, time, land) face concave returns, Jensen's inequality *does* show that a negotiated split (each getting a guaranteed portion to spend on *their own* preferred project) can Pareto-dominate a winner-takes-all gamble *for purely selfish, risk-averse individuals*. The gain comes purely from the concavity and the distance in preferences, *not* from who's "right". This is a powerful tool for negotiation and explaining cooperation despite conflict. **Hold onto this.** Rejecting it *would* cost you a robust framework for understanding real-world compromise and gains from trade between conflicting parties.

  2.  **The Fatal Flaw: Equating Interpersonal Conflict with Intrapersonal Uncertainty (Step 3):** This is where Dev's argument derails. He asserts: "Disagreeing with another person... is structurally the same kind of problem as being uncertain which moral view is true."
      *   **Why it *looks* fine:** Superficially, both involve "uncertainty" and allocating resources. You have multiple options (Person A's project, Person B's project / Moral View X, Moral View Y) and need to decide how to split a fixed pot. The maths of allocating under concave returns *looks* similar on the surface.
      *   **Why it's *not* the same:**
          *   **Agent Identity & Veto Power:** In the *interpersonal* case, there are *two distinct agents*, each with independent agency, preferences, and crucially, the *power to block or fight*. The "disagreement" is a strategic interaction where failure to agree can lead to conflict (gamble, war, stalemate) with worse outcomes. The concavity applies to *each agent's separate project* funded from *their share* of the *physical resource*.
          *   **Intrapersonal Moral Uncertainty:** Here, there is only **one agent**. The "disagreement" is internal and epistemic. The agent isn't negotiating with external veto-holders; they are trying to make the *best overall decision* given their uncertainty about which moral view is *true*. The "resource" being allocated (effort, money, time) is entirely under the control of this single agent. There is no external party who will fight them or force a gamble if they don't "split" internally. The potential "bad outcome" isn't conflict with another agent, but *acting immorally* (according to the true view).
          *   **Nature of the "Projects":** In the interpersonal split, Person A spends *their* share *only* on Project A, Person B spends *their* share *only* on Project B. They are distinct physical projects. Under moral uncertainty, "spreading effort across live moral views" often means funding actions *prescribed by different views*. Crucially, **these actions might be mutually exclusive or directly conflicting in their real-world consequences.** Funding a slice for View B (which you assign 0.1% probability to being true) might actively *harm* the goals of View A (which you assign 99.9% probability to being true). The concavity applies to the *impact within each moral framework*, but the frameworks themselves impose conflicting demands on the *same* world.

  3.  **Consequences of the Flawed Equivalence (Steps 4 & 5):**
      *   **Misapplying Concavity (Step 4):** While *some* form of hedging *can* be rational under moral uncertainty (especially if views share common ground or if the risk of being catastrophically wrong is high), Dev's analogy dictates that you *must* hedge *purely* based on the *distance* between views and the *concavity*, ignoring probability. This is nonsensical. Probability *should* be central. If you're 99.9% sure eating meat is murder, spending 10% of your food budget on steaks "just in case" the carnivore view is right is irrational and (by your lights) actively harmful. The concavity argument from interpersonal compromise doesn't translate because there's no *strategic* need to "buy off" the carnivore view – it has no power to harm you if you ignore it. The "surplus" from internal splitting only exists if the concavity *within the true moral framework* outweighs the cost of misallocating resources to *false* frameworks – which depends heavily on the *probabilities*.
      *   **Ignoring Probability (The "Hedge Ratio") (Step 5):** This is the most egregious consequence. Dev's "hedge ratio" abandons expected value maximisation (or even standard risk-averse versions of it) under uncertainty. It treats all "live" moral views as *veto players* in an internal negotiation, analogous to the external agents. But they aren't. Assigning a fixed slice regardless of credence (e.g., 0.1% credence view gets 10% of resources) is wildly inefficient and potentially immoral by the lights of *any* plausible decision theory under uncertainty. It confuses *acknowledging epistemic humility* (you might be wrong) with *granting proportional resources to views you think are almost certainly false*. The latter doesn't follow from the former.

  4.  **Rejecting the Madness (Step 6):**
      *   **(6a)** You absolutely **do not** need a standing slice for *every* view taken seriously. You should allocate resources based on *expected choice-worthiness* (factoring in probabilities and the magnitude/value of outcomes under each view), perhaps with *some* risk-aversion or hedging against catastrophic error *if* the stakes warrant it (e.g., Pascal's Mugging *type* scenarios, though handled carefully). This allocation will naturally shrink towards zero for views you assign very low probability, unless their potential negative impact if true is astronomically high. A 0.1% view *might* get a tiny sliver *if* ignoring it risks massive harm *if true*, but it gets nothing *just because* it exists and is concave.
      *   **(6b)** While excessive risk-taking on speculative causes can be foolish, **sensible people *do* take high-variance moral bets** when the expected payoff is sufficiently large *and* aligns with their best judgment. Founding a startup for a cause, dedicating a career to a promising but unproven intervention, or even pivotal acts in activism often involve calculated risks. Dev's rule would paralyse moral action and innovation. Concavity might caution against *betting everything* on a single long-shot *within a cause you already endorse*, but it doesn't forbid betting heavily on a cause you judge to have high *expected* value, even if that involves variance.
      *   **(6c)** The interpersonal lemma **does not compel compromise with monstrous views.** Why?
          *   **Non-Linear Returns to Evil:** The concavity argument assumes *both* parties' preferred projects have *concave positive returns*. If Person B's "project" is genocide, the "returns" to funding it might be *convexly negative* (doing exponentially more harm). No amount of splitting generates a mutual gain if one side's action is fundamentally destructive. Jensen's inequality doesn't guarantee a beneficial split when one function is harmful.
          *   **Externalities & Thresholds:** Monstrous acts often impose massive negative externalities or cross thresholds beyond which compromise is unthinkable (e.g., fundamental rights violations). The "shared resource pool" analogy breaks down – preventing harm isn't just about allocating a budget between competing goods, it's about stopping an intrinsic bad.
          *   **No Obligation to Create Surplus for Evil:** The interpersonal lemma shows a potential mutual gain exists *given* the parties' preferences. It doesn't say you *must* engage or create that surplus if doing so involves enabling something abhorrent. You are morally entitled (often obligated) to refuse negotiation or fight, even if it's costlier. The "surplus" from compromising on fundamental principles is illusory or morally tainted.

  **What Does Rejecting Step (3) Cost You? Almost Nothing Good.**

  *   You **keep** the powerful insight about interpersonal compromise and gains from trade (Steps 1 & 2).
  *   You **keep** the sensible idea that *some* hedging *can* be prudent under moral uncertainty (Step 4, *correctly* applied, using probabilities and considering catastrophic risks).
  *   You **lose** a false analogy that forces you into absurd moral allocations (the Hedge Ratio) and paralyzing inaction. That's a benefit, not a cost.

  **Your Dilemma Resolved: You Don't Have to Choose**

  You can absolutely hold onto "compromise is often a genuine gain" **and** reject "give a standing slice to views you're certain are false". They apply to fundamentally different domains:

  1.  **Interpersonal Compromise (Shared Resource, Conflicting Agents):** Use the split-surplus lemma. Concavity + divergent preferences create potential gains from splitting the pie. Probability of being "right" is irrelevant here. Fight when the other's demand is monstrous or the split is unacceptable.
  2.  **Intrapersonal Moral Uncertainty (Sole Agent, Epistemic Doubt):** Use decision theory under uncertainty (maximising expected choice-worthiness, potentially with risk-sensitivity). Probability is central. Hedging *can* be rational but must be justified by the probabilities and stakes, not an automatic "slice" dictated by concavity alone. Ignore/fund minimally views you deem highly improbable and non-catastrophic if wrong.

  The split-surplus lemma survives intact for its intended purpose: explaining cooperation between conflicting agents over divisible resources. It doesn't mandate moral relativism or paralyse individual action under uncertainty. Tell Dev his bridge from the boardroom to the conscience is structurally unsound, even if the initial engineering on the compromise side is first-rate. Cheers. Now, about that pub tab...
