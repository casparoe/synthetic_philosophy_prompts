prompt: |-
  I direct a small forecasting unit inside a policy institute. Four analysts. Each spring we issue twenty-five-year survival forecasts for roughly forty political entities — states, federations, supranational unions, standing alliances — and every forecast is logged in advance, scored against a ledger of resolved cases once the horizon closes or the entity ends, and signed off by me before publication. The budget is about one analyst-day per item, all sources must be unclassified, and the written rationale has to fit on a single page. My analysts are strong generalists with working probability but no formal survival analysis.

  Our house method is the outside view: for each entity, assemble a reference class of comparable entities, read off the base rate of survival to the horizon, and treat any entity-specific story about why this one is different as an adjustment that has to be argued for rather than assumed. Two disagreements have made that method unreliable in practice, and I want them settled by procedure rather than re-litigated every spring. The first is what may count as a class. Half the team wants classes defined by an explicit mechanism — polities that extract revenue through a fiscal-military apparatus, unions whose members retain a unilateral exit clause — on the grounds that a shared mechanism is what lets a base rate travel. The other half wants classes defined by the label the entity would have used for itself, or by a broad type such as empire or federation, on the grounds that mechanism classes are causal theories smuggled in as bookkeeping and that classifying the mechanism already is the forecast. The second disagreement is statistical. The entities we forecast are, by construction, ones that exist now, and I have become convinced that this contaminates the numbers we read off: a class assembled from currently surviving members is not the same population as a cohort followed from its founding, and I suspect several of our published figures are inflated for that reason alone, in a way that no amount of entity-specific storytelling corrects.

  Please write the procedure my team will run, as an ordered sequence of steps an analyst can complete in a day and a reviewer can audit in half an hour. For each step state what would count as a sufficient answer, what would count as a failure to answer, and what the analyst writes in the one-page rationale. The procedure has to include at least the following, in whatever order you think is right: a step that fixes the persistence criterion before any number is computed, since our forecasts are worth nothing until we have said whether continuity of constitutional order, continuity of ruling coalition, continuity of core territory, or continuity of function is what makes a later entity the same entity; a membership rule that decides class membership only from properties knowable on the forecast date, so that nothing about the outcome leaks into the class; an explicit decision on whether attempts that never consolidated — unions proclaimed but never ratified, states declared but never administered — belong in the denominator, together with the reasoning that settles it rather than a stipulation; a correction for the fact that our classes are drawn from the living, with a statement of when the correction is large enough to matter and when it is ignorable; a required declaration of hazard shape, increasing, flat, or decreasing over the entity's life, with a default for when the analyst has no evidence and the conditions under which the default may be overridden; a rule for what to do when two admissible classes give conflicting base rates, including whether they may be averaged; a rule for revising a standing forecast when an entity simply survives another year without visible decline; and a closing register of the two or three findings that would most change this forecast, so the reviewer knows where to push back. Mark every point at which the procedure hands the decision to a person because the question is one of values rather than fact, and say which of those points I must sign off on personally rather than delegate.

  Then apply the procedure to three items from this spring's list. First, a thirty-year-old continental union of twenty-seven member states, constituted by treaty, whose members hold a unilateral exit clause and whose constitutional changes require unanimity. Second, a two-hundred-and-forty-year-old federal republic whose founding charter contains no secession procedure, which last fought an armed internal conflict over its own continuity a hundred and sixty years ago, and whose component units have diverged economically over the last three decades. At least one of these two must end where I suspect one of them ends, with a band so wide that it is useless to the people who commission our work, and I want to see the procedure produce that result honestly and tell me how to publish it. Third, apply it to a donor's request to forecast the twenty-five-year survival of the security order in a region, where the donor means by that a pattern of alignment rather than any body with a charter, a membership, or a treasury; if the correct output there is a refusal to issue a number, show the procedure arriving at that refusal and telling me what minimal redefinition of the object would make a forecast possible.

  Close with a short section on what the procedure cannot do: which of our failures it will not prevent, which of its steps are judgment dressed as method, and where an analyst who follows it exactly can still be badly wrong. Do not cite or name any literature, authors, or studies; I need the procedure, not references, and my team will not have access to anything beyond what is in the document you write.
reasoning: |-
  We are designing a procedure for survival forecasting of political entities that addresses two main disagreements: how to define reference classes and how to correct for the "currently existing" bias. The procedure must be completed in one analyst-day and audited in half an hour. It must include specific steps as outlined.

  The procedure will be an ordered sequence of steps. For each step, we will specify:
  - What counts as a sufficient answer.
  - What counts as a failure to answer.
  - What the analyst writes in the one-page rationale.

  Additionally, we must mark decisions that are value-based and which require personal sign-off.

  We are also to apply the procedure to three cases and then discuss limitations.

  Let's outline the steps in order:

  1. **Define the Persistence Criterion**: Specify what constitutes survival (e.g., continuity of constitutional order, ruling coalition, core territory, or function). This must be fixed before any computation.

  2. **Define the Reference Class Membership Rule**: Decide on the properties that define the reference class, using only information available on the forecast date. The rule must not use information about the outcome.

  3. **Handle Non-Consolidated Entities**: Explicitly decide whether entities that were declared but never consolidated (e.g., unions proclaimed but never ratified) are included in the denominator (i.e., as failures). Provide reasoning.

  4. **Correct for Current Existence Bias**: Adjust the base rate for the fact that the reference class is drawn from currently existing entities. State when the correction is large enough to matter and when it can be ignored.

  5. **Declare Hazard Shape**: State whether the hazard (risk of failure) is increasing, flat, or decreasing over the entity's life. Provide a default and conditions for overriding it.

  6. **Resolve Conflicting Base Rates**: Rule for when two admissible classes give conflicting base rates (e.g., whether they can be averaged).

  7. **Revise Standing Forecasts**: Rule for updating when an entity survives another year without visible decline.

  8. **Register Key Findings for Review**: List the two or three findings that would most change the forecast, to guide reviewer pushback.

  Now, we design each step in detail.

  ---

  **Procedure: Survival Forecasting for Political Entities**

  **Step 1: Persistence Criterion**

  - **Objective**: Define what constitutes the survival of the entity. This must be decided upfront.
  - **Sufficient Answer**: A clear, binary criterion that can be applied to any entity at any time. Examples: 
    - Continuity of constitutional order: The entity operates under the same foundational legal document without a revolution or coup that overthrows it entirely.
    - Continuity of ruling coalition: The same group (party, dynasty, etc.) remains in power.
    - Continuity of core territory: The entity retains at least X% of its territory (specify X) and population.
    - Continuity of function: The entity continues to perform its primary function (e.g., a defense alliance that still provides collective security).
  - **Failure to Answer**: Vague or multiple criteria without a clear primary one. Not specifying how to handle partial failures (e.g., loss of territory but not core).
  - **Rationale Entry**: 
    - State the chosen criterion and a brief justification for why it is appropriate for this entity.
    - Example: "Survival is defined by continuity of constitutional order, as the entity is a treaty-based union whose existence is tied to its founding treaty."

  *Value Judgment Mark*: This step involves a value judgment about what constitutes the entity's identity. The director must personally sign off on the persistence criterion for each entity.

  ---

  **Step 2: Reference Class Membership Rule**

  - **Objective**: Define the reference class using only properties knowable at the forecast date.
  - **Sufficient Answer**: A set of properties that are observable and fixed at the forecast date. The rule must be explicit and not rely on knowledge of outcomes. Two options are allowed, but the procedure must choose one per forecast:
    - **Option A (Mechanism)**: Define by explicit mechanism (e.g., fiscal-military apparatus, unilateral exit clause). The mechanism must be observable and not require forecasting.
    - **Option B (Self-Label or Broad Type)**: Define by the label the entity would use for itself (e.g., empire, federation) or a broad type. The label must be historically verifiable at the forecast date.
  - **Failure to Answer**: Using properties that are not observable at the forecast date, or using a mix of both options without a clear rule. Not specifying the properties.
  - **Rationale Entry**:
    - State the chosen option (A or B) and the specific properties that define the class.
    - Justify why this class is appropriate (e.g., "Entities with a unilateral exit clause face similar pressures on their survival, as the option to leave can trigger cascading failures." OR "Federations have historically faced common challenges to their continuity, and the self-label captures the shared institutional identity.")

  *Value Judgment Mark*: The choice between Option A and Option B is a value judgment about the nature of the base rate. The director must sign off on the chosen option for each forecast.

  ---

  **Step 3: Include Non-Consolidated Entities?**

  - **Objective**: Decide whether to include entities that were declared but never consolidated in the denominator (as failures) when computing the base rate.
  - **Sufficient Answer**: A clear yes/no decision with reasoning based on the persistence criterion and the entity type.
    - Reasoning must consider: If the entity never achieved the minimum threshold of consolidation (e.g., never ratified, never administered territory), does it count as an attempt that failed? This should align with the persistence criterion: e.g., if continuity of constitutional order is key, then an entity that never had a constitutional order doesn't count? Or does it?
    - Example reasoning for inclusion: "Entities that were proclaimed but failed to consolidate are failures because they did not achieve the state of being we are forecasting for the existing entity."
    - Example reasoning for exclusion: "Our forecast is for entities that have achieved consolidation, so we only consider entities that have passed a minimum threshold (e.g., at least one year of operation)."
  - **Failure to Answer**: Not making a decision, or providing reasoning that contradicts the persistence criterion.
  - **Rationale Entry**: 
    - State the decision (include or exclude) and the reasoning in 1-2 sentences.
    - Example: "Non-consolidated entities are excluded because our persistence criterion requires at least one year of operation under the constitutional order, which they never achieved."

  *Value Judgment Mark*: This is a judgment call about what constitutes the beginning of an entity. The director must sign off on the decision.

  ---

  **Step 4: Correction for Current Existence Bias**

  - **Objective**: Adjust the base rate to account for the fact that the reference class is drawn from entities that exist now (so we are sampling from survivors).
  - **Sufficient Answer**:
    - Compute the base rate from a cohort of entities that were founded in the past and followed until failure or the horizon. However, since we are using a reference class that includes current entities, we must adjust.
    - **Method**: Use the Kaplan-Meier estimator or a simple adjustment for right-censoring. Since analysts are not formal statisticians, we use a simpler approach:
      - Let the reference class be all entities that ever existed (within the class) and that were founded at least 25 years before the forecast date (so we know their 25-year outcome). But note: this would exclude very young entities. Alternatively, we can use current entities but adjust for their current age.
      - **Proposed Adjustment**: 
        - For each entity in the reference class, we know its current age and whether it has survived at least to the forecast date (which it has, by construction). But we don't know the future.
        - We use the cohort method: only consider entities that were founded at least 25 years ago. Then the base rate is the proportion that survived 25 years from their founding.
        - However, this discards information from younger entities. If we must use younger entities, we can use survival data up to their current age and then extrapolate. But this requires hazard shape (Step 5).
    - **Simpler Rule**: Only use entities that are old enough (at least 25 years at forecast date) to have a resolved 25-year outcome. This avoids bias but reduces the sample size.
      - If the class has fewer than 5 such entities, then the class is too small and we must try a broader class (see Step 6).
    - State when correction is ignorable: If all entities in the class are at least 25 years old at the forecast date, then the base rate from the cohort is unbiased and no correction is needed. Otherwise, if we are including younger entities, we must adjust by using a survival model that accounts for censoring (but we lack expertise). Therefore, the rule is: **Use only entities that were founded at least 25 years before the forecast date.**
  - **Failure to Answer**: Not adjusting for current existence bias, or using a method that does not account for right-censoring.
  - **Rationale Entry**:
    - State the number of entities in the class that are at least 25 years old and the total number of such entities that ever existed (if available, but we might not have full history). If we are using only old entities, note the sample size.
    - If the sample size is too small (say, less than 5), note that as a limitation.
    - Example: "Our class includes 12 entities that are at least 25 years old. The base rate is computed from these 12. We excluded 5 younger entities to avoid current existence bias."

  *Note*: This step does not require a value judgment, but it is a technical step that must be followed precisely.

  ---

  **Step 5: Hazard Shape Declaration**

  - **Objective**: State the shape of the hazard function (increasing, flat, decreasing) and provide a default.
  - **Sufficient Answer**:
    - **Default**: Flat hazard (constant risk over time) unless there is evidence otherwise. This is the exponential survival model.
    - **Conditions to Override Default**:
      - If historical data for the reference class shows a clear trend (e.g., most failures occur in the first few years, indicating a decreasing hazard; or failures accumulate in later years, indicating increasing hazard), then override with that trend.
      - If there is a known life cycle for the entity type (e.g., empires often have increasing hazard as they age), then override.
    - Evidence must be presented from the reference class or from general knowledge (without requiring formal studies).
  - **Failure to Answer**: Not declaring a shape, or declaring without evidence when overriding the default.
  - **Rationale Entry**:
    - State the hazard shape and the reason (e.g., "We assume a flat hazard because we have no evidence of a trend." OR "We assume an increasing hazard because historical federations show rising disintegration risk after 100 years.")
    - Note: The hazard shape is used in Step 7 for updating and in Step 4 if we had to use a survival model (but our Step 4 avoids that by using only old entities).

  *Value Judgment Mark*: Overriding the default requires judgment about the evidence. The director does not need to sign off unless the override is based on weak evidence. The analyst must note the evidence.

  ---

  **Step 6: Conflicting Base Rates from Multiple Classes**

  - **Objective**: Rule for when two admissible classes (both defined by Step 2 rules) give conflicting base rates.
  - **Sufficient Answer**:
    - **Rule**: Do not average the base rates. Instead, choose the class that is more relevant to the entity being forecast. Relevance is determined by:
      - For mechanism classes (Option A): Choose the class whose mechanism is more central to the entity's survival.
      - For label/type classes (Option B): Choose the class that is more specific to the entity's self-identity.
    - If both classes are equally relevant, then present both base rates and their implications. The forecast becomes a range (lowest to highest base rate) and the rationale must explain the uncertainty.
    - Do not average because averaging assumes the classes are equally valid, which they may not be.
  - **Failure to Answer**: Averaging without justification, or ignoring the conflict.
  - **Rationale Entry**:
    - If one class is chosen, state why it is more relevant and report its base rate.
    - If both are presented, state both base rates and the resulting range for the forecast. Explain why they are equally relevant and note the increased uncertainty.
    - Example: "We considered two classes: fiscal-military states (base rate 60%) and self-labeled empires (base rate 40%). We chose the fiscal-military class because the entity relies heavily on such an apparatus. The forecast is 60%." OR "Both classes are equally relevant, so the forecast is between 40% and 60%."

  *Value Judgment Mark*: Choosing between classes or deciding they are equally relevant is a judgment. The director must sign off if the forecast becomes a range (because it might be too wide) or if the choice is contentious.

  ---

  **Step 7: Revise Standing Forecasts**

  - **Objective**: Rule for updating a forecast when an entity survives another year without visible decline.
  - **Sufficient Answer**:
    - Use the hazard shape from Step 5.
      - If hazard is flat: The survival probability does not change because the risk is constant. The forecast remains the same.
      - If hazard is increasing: The entity has passed a year of higher risk, so the remaining horizon (now 24 years) has a higher survival probability than the original 25-year forecast. The forecast should be revised upward.
      - If hazard is decreasing: The entity has passed a year of higher risk (since risk is higher at the beginning), so the remaining horizon has a lower risk. The forecast should be revised upward (but less so than in the increasing hazard case? Actually, surviving the initial high-risk period increases overall survival probability).
    - **Default Adjustment (for flat hazard)**: No change.
    - **Adjustment for non-flat hazard**:
      - We need a simple method. Since we don't have formal survival analysis, we can use:
        - Let S0 be the original 25-year survival probability.
        - After one year of survival, the new 24-year survival probability is S1 = S0 / P(1-year survival from the start)   [by the definition of conditional probability]
        - But we don't have P(1-year survival) directly. We can approximate by assuming the hazard function.
        - For increasing hazard: The 1-year survival probability is higher than the average annual survival rate over 25 years. So S1 > S0 (because the entity has passed a high-risk year? Actually, with increasing hazard, the first year is lower risk than later years. So surviving the first year is not as impressive as surviving a later year. Let me clarify:
          - Let h(t) be the hazard rate at time t. If h(t) is increasing, then h(1) < h(10) < h(25). The probability of surviving the first year is higher than surviving the 25th year. But we are conditioning on having survived up to now.
          - Actually, the conditional survival for the next 24 years given survival to age t is: 
            exp( - integral from t to t+24 of h(s) ds )
          - With increasing h, the integral from t to t+24 is higher than the integral from 0 to 24 for a new entity? Not necessarily. It depends on t.
          - Since the entity has survived to age t, and h is increasing, the future hazard is higher than the past hazard. So the conditional survival probability might be lower than the original 25-year survival for a new entity? This is getting complex.
    - **Proposed Simple Rule**: 
      - Because of complexity, and since the budget is one day, we avoid formal updates. Instead, we re-run the forecast annually with the same procedure, updating the entity's age and the reference class (if necessary). The forecast might change because the base rate is now computed with an additional year of data (if new entities have been added or resolved). Also, the entity's own age now makes it eligible for a different class (e.g., if we are using only entities that are old enough, then as the entity ages, it might be included in the class).
      - Therefore, the rule is: **Do not revise the standing forecast within the year. Re-run the entire forecast procedure annually.**
  - **Failure to Answer**: Revising without a clear rule or without considering hazard shape.
  - **Rationale Entry**:
    - State that the forecast is not revised during the year. The next forecast will be produced in the next annual cycle.

  *Note*: This step avoids complex adjustments by relying on annual re-forecasting. This is a practical decision.

  ---

  **Step 8: Register Key Findings for Review**

  - **Objective**: List the 2-3 findings that would most change the forecast.
  - **Sufficient Answer**: 
    - Identify the most sensitive assumptions or data points. Examples:
      - The choice of reference class.
      - The inclusion/exclusion of a particular entity in the reference class.
      - The hazard shape assumption.
      - The persistence criterion.
    - State what change in the assumption would lead to a large change in the forecast.
  - **Failure to Answer**: Listing more than three or listing trivial factors.
  - **Rationale Entry**:
    - List each finding and the direction of the change. Example:
      - "If we had used the mechanism class instead of the label class, the base rate would be 20 percentage points lower."
      - "If the hazard is increasing instead of flat, the 25-year survival probability would be 10 percentage points lower."
      - "If we included non-consolidated entities, the base rate would drop by 15 percentage points."

  ---

  **Summary of Sign-Off Requirements (Director Must Sign Off):**
  - Step 1: Persistence criterion.
  - Step 2: Choice of reference class type (Option A or B) and specific properties.
  - Step 3: Decision on non-consolidated entities.
  - Step 6: When the forecast becomes a range due to conflicting classes or when the class choice is contentious.

  ---

  Now, we apply the procedure to three cases.

  **Case 1: Continental Union**

  - Entity: 30-year-old continental union of 27 member states, constituted by treaty, with unilateral exit clause and unanimity for constitutional changes.
  - **Step 1: Persistence Criterion**
    - We choose: Continuity of constitutional order (the treaty) because the union is defined by its treaty.
    - Director sign-off: Yes.
  - **Step 2: Reference Class**
    - Option A (Mechanism): Entities with a unilateral exit clause and treaty-based. 
      - Properties: Must have at least two member states, exit clause, and require unanimity for major changes.
    - Option B (Self-Label): The entity calls itself a "union" and is a supranational organization.
    - We choose Option A because the mechanism (exit clause and unanimity) is central to the survival risk.
    - Director sign-off: Yes (for choosing Option A).
  - **Step 3: Non-Consolidated Entities?**
    - Decision: Exclude non-consolidated entities because our persistence criterion requires the entity to be in operation (so only entities that achieved ratification and operation for at least one year are included).
    - Reasoning: Since we are forecasting for an existing entity that has been operating for 30 years, we consider only entities that achieved at least one year of operation.
    - Director sign-off: Yes.
  - **Step 4: Correction for Current Existence Bias**
    - We only include entities that are at least 25 years old at the forecast date (so we know their 25-year outcome).
    - This entity is 30 years old, so it would be in the class, but we are forecasting for it, so we exclude it from the reference class (to avoid including the entity we are forecasting).
    - The reference class: 
      - Entities with unilateral exit clause, treaty-based, unanimity for changes, and at least 25 years old at forecast date (and not the entity itself).
      - How many? We might find few: e.g., the European Union (which has exit now, but didn't initially? Actually, the Lisbon Treaty introduced exit in 2009) and perhaps others. But let's assume we find 5 such entities that are old enough. Of these 5, how many survived 25 years?
      - Suppose 4 out of 5 survived 25 years: base rate = 80%.
    - But note: The entity is 30, so we are forecasting the next 25 years, not from its founding. We need to adjust for current age.
      - We should compute the probability of surviving to age 55 given that it is already 30.
      - This requires conditional survival. We need the hazard shape.
    - However, our Step 4 rule is to compute the base rate from the 25-year survival from founding for the reference class. For the entity, we then adjust for its current age using the hazard shape (Step 5).
  - **Step 5: Hazard Shape**
    - Default: Flat hazard.
    - Override? We have no evidence for this class, so we use flat.
    - Rationale: "We assume flat hazard because we have no evidence of a trend."
  - **Forecast Calculation**:
    - The base rate for 25-year survival from founding is 80% (from 4/5).
    - But the entity is already 30 years old. We want P(survive to 55 | survived to 30).
    - For flat hazard (exponential distribution), the survival function is S(t) = exp(-λ t). 
      - S(25) = 0.8 => exp(-25λ) = 0.8 => λ = -ln(0.8)/25 ≈ 0.0089 per year.
      - Then S(55) = exp(-55λ) ≈ exp(-55*0.0089) ≈ exp(-0.4895) ≈ 0.613.
      - And S(30) = exp(-30λ) ≈ exp(-0.267) ≈ 0.765.
      - Then P(survive to 55 | survived to 30) = S(55)/S(30) ≈ 0.613 / 0.765 ≈ 0.801.
      - So approximately 80.1%, same as the base rate? That can't be right because the base rate is for 25-year survival from founding, and here we are conditioning on having survived 30 years. With constant hazard, the remaining survival time is the same as the original survival time? Actually, yes, because of the memoryless property. So for flat hazard, the probability of surviving 25 more years is the same as surviving 25 years from the start.
    - Therefore, the forecast is 80%.
  - **Step 6: Conflicting Classes** - Not applicable (only one class chosen).
  - **Step 7: Revision** - Not applicable at initial forecast.
  - **Step 8: Key Findings**:
    - If we had used Option B (self-label: supranational unions), the base rate might be different (e.g., 70%). This would change the forecast.
    - If the hazard is actually increasing (because unions become more fragile as they age), then the conditional survival probability would be lower than 80%. For example, if hazard is increasing, then surviving to 30 might mean the entity is robust, but the future hazard is higher. Without data, we cannot quantify, but it could be lower.
    - The small reference class (n=5) is a source of uncertainty; if one more entity had failed, the base rate would be 60%, changing the forecast to 60%.

  **Result**: The forecast is 80%. But note: the director suspects that one of the cases will end with a uselessly wide band. This case might not be that one.

  **Case 2: Federal Republic**

  - Entity: 240-year-old federal republic, no secession procedure, last internal armed conflict 160 years ago, economic divergence in component units.
  - **Step 1: Persistence Criterion**
    - We choose: Continuity of constitutional order (the founding charter) and core territory (to account for secession). We might combine: survival requires no loss of core territory and continuity of the constitutional order. But we need one primary. Let's choose continuity of constitutional order and add that the entity must retain at least 90% of its current territory (to allow for minor adjustments).
    - This is a combined criterion. We must define it clearly: "The entity survives if it continues to operate under the same founding charter (with amendments allowed) and retains at least 90% of its population and territory."
    - Director sign-off: Yes.
  - **Step 2: Reference Class**
    - Option A: Mechanism: Federal republics with no secession procedure. 
