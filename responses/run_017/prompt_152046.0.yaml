  **Result**: The forecast is 80%, but with a wide uncertainty band due to small sample size. The analyst must report: "Base rate: 80%, but the reference class has only 5 entities, so the margin of error is large. The 95% confidence interval is approximately 30% to 99%." This is the uselessly wide band the director expected.

  **Case 3: Security Order in a Region**

  - Object: A pattern of alignment (e.g., "the current set of alliances and enmities in the Middle East"), not a body with a charter, membership, or treasury.
  - **Step 1: Persistence Criterion**
    - We need to define survival. What constitutes the same pattern of alignment? 
      - Possibilities: Continuity of the major powers' alignment (e.g., two blocs remain opposed), or continuity of function (deterrence of major war). But it is vague.
    - We try: "The security order survives if the core alignment structure (specify: e.g., the two main alliances and their key members) remains intact, without a major realignment (e.g., a key member switching sides or a new major power bloc emerging)."
    - But this is hard to operationalize. 
  - **Step 2: Reference Class**
    - We need comparable patterns. But without a defined entity, it's hard to define a class.
    - Option A: Mechanism? What mechanism maintains the pattern? Balance of power? But that's a theory.
    - Option B: Self-label? Patterns don't label themselves.
    - We cannot define a class from properties knowable at the forecast date because the object is not clearly defined.
  - **Failure**: The analyst cannot define a reference class. The procedure cannot proceed.
  - **Output**: Refusal to issue a number. The minimal redefinition: Ask the donor to define the security order as a specific treaty or organization (e.g., NATO in the region, or a set of bilateral treaties) that has a clear persistence criterion (e.g., the treaty remains in force). Then we can forecast for that entity.

  **Result**: The procedure stops at Step 2 because no reference class can be defined. The output is: "Cannot forecast due to undefined object. Redefine the security order as a formal alliance or treaty with a clear persistence criterion."

  ---

  **Limitations Section**

  The procedure cannot prevent all failures. Specifically:

  - **Reference Class Selection**: The choice of class (Step 2) is judgment-based and might be arbitrary. An analyst might select a class that matches their prior beliefs.
  - **Small Sample Sizes**: When the reference class is small, the forecast will have high uncertainty. The procedure does not provide a way to aggregate across classes (except presenting a range) and does not use Bayesian methods to incorporate prior knowledge.
  - **Hazard Shape**: The hazard shape assumption (Step 5) is often made without data. If the true hazard shape is different, the forecast will be biased, especially for conditional survival (older entities).
  - **Current Existence Bias Correction**: Our rule (use only old entities) discards information from younger entities and may reduce sample sizes to the point of uselessness. There is no adjustment for entities that are not old enough; we simply exclude them.
  - **Non-Consolidated Entities**: The decision to include or exclude (Step 3) might be inconsistent across analysts.
  - **Complex Updates**: The procedure does not update forecasts within the year (Step 7 rule). Events that occur during the year are not incorporated until the next annual forecast.
  - **Value Judgments**: Many steps (persistence criterion, class selection, etc.) are value judgments dressed as method. An analyst can follow the procedure and still produce a forecast that is wrong because of these judgments.
  - **External Validity**: The procedure assumes that historical base rates are applicable to the present entity. It cannot account for unprecedented changes (e.g., nuclear weapons, climate change) that make the present unique.
  - **Wide Bands**: When the reference class is small or conflicting, the forecast might have a wide range, making it useless for policy.

  In summary, the procedure provides structure but cannot eliminate subjectivity or the limitations of the outside view. An analyst who follows it exactly can still be wrong if the reference class is inappropriate or if the future does not resemble the past.
