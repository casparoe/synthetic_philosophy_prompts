  ### Survival Forecasting Procedure for Political Entities  
  This procedure resolves the two core disagreements (reference class definition and current-existence bias) through explicit, auditable steps. It ensures that forecasts are comparable, defensible, and free of outcome leakage. Analysts complete all steps in sequence; reviewers audit for strict adherence to rules. Value judgments (marked with **♘**) require director sign-off; others may be delegated. The one-page rationale documents key outputs from each step.  

  **Ordered Procedure**  
  *Total steps: 8 | Estimated time: 1 analyst-day | Audit time: 30 minutes*  

  ---  
  #### **Step 1: Fix Persistence Criterion**  
  **Objective**: Define what constitutes "survival" (i.e., the binary condition for continuity).  
  - **Sufficient answer**: One criterion chosen from:  
    - Constitutional order (same foundational legal document).  
    - Ruling coalition (same group in power).  
    - Core territory (≥90% of land/population retained).  
    - Function (primary purpose unchanged).  
    *Justification must tie to entity type (e.g., "constitutional order for treaties, core territory for states").*  
  - **Failure**: Ambiguous/multiple criteria; no justification; criterion leaks future knowledge (e.g., "survival if no war occurs" assumes outcome).  
  - **Rationale entry**: "[Chosen criterion], because [1-sentence justification]. e.g., 'Constitutional order: Entity is treaty-based.'"  
  **♘ Director must sign off**.  

  ---  
  #### **Step 2: Define Reference Class Membership Rule**  
  **Objective**: Assign entities to a reference class using only properties knowable *at forecast date*.  
  - **Sufficient answer**: Class defined by **one** of:  
    - **Option A (Mechanism)**: Explicit functional process (e.g., "revenue via fiscal-military apparatus").  
    - **Option B (Label/Type)**: Self-identification or broad type (e.g., "entities self-labeling as 'federation'").  
    *Properties must be observable (e.g., "unilateral exit clause in treaty" not "likely exit").*  
  - **Failure**: Mixed criteria; class leaks outcome (e.g., including entities that survived 25 years); properties unverifiable at forecast date.  
  - **Rationale entry**: "Class: [Option A/B] with [properties]. e.g., 'Option A: Treaty-based unions with exit clauses.'"  
  **♘ Director must sign off on A/B choice**.  

  ---  
  #### **Step 3: Decide on Non-Consolidated Entities**  
  **Objective**: Rule whether attempted-but-failed entities (e.g., unratified unions) belong in the denominator.  
  - **Sufficient answer**: Yes/no + reasoning tied to Step 1:  
    - **Include if**: Persistence criterion requires only declaration (e.g., "function" for alliances).  
    - **Exclude if**: Criterion requires operation (e.g., "constitutional order" implies ratified/active).  
    *Default: Exclude (aligns with "existing entities" focus). Override requires evidence (e.g., "Historical data show declared-but-failed unions relevant to function survival").*  
  - **Failure**: No decision; reasoning disconnected from persistence criterion.  
  - **Rationale entry**: "[Include/Exclude] because [reasoning]. e.g., 'Exclude: Constitutional order requires ratification.'"  
  **♘ Director must sign off if overriding default**.  

  ---  
  #### **Step 4: Correct for Current-Existence Bias**  
  **Objective**: Adjust base rate for right-censoring (using only entities founded ≥25 years ago).  
  - **Sufficient answer**:  
    - Compute base rate as: *Survival proportion of entities founded ≥25 years before forecast date*.  
    - **Correction magnitude**:  
      - Ignorable if ≥20 entities in class.  
      - Material if <20 entities → Report base rate with 95% CI*: `p ± 1.96√[p(1−p)/n]`.  
      - *If n<5, CI not computed; state "insufficient data."*  
  - **Failure**: Using entities founded <25 years ago; not computing CI when n<20.  
  - **Rationale entry**: "Base rate: [%] (n=[#]). [CI or 'ignorable/material']. e.g., '60% (n=15); material: CI 40–80%.'"  

  ---  
  #### **Step 5: Declare Hazard Shape**  
  **Objective**: State risk trajectory (increasing, flat, decreasing) over the entity’s lifetime.  
  - **Sufficient answer**:  
    - **Default**: Flat (constant annual risk).  
    - **Override conditions**:  
      - Increasing: Evidence of cumulative fragility (e.g., "historical federations fragment after economic divergence").  
      - Decreasing: Evidence of early instability (e.g., "new states face high initial failure risk").  
    *Evidence = Historical patterns in reference class (Step 2) or entity-specific data (e.g., rising inequality).*  
  - **Failure**: No declaration; override without evidence.  
  - **Rationale entry**: "Hazard: [Shape]. [Evidence/default]. e.g., 'Increasing; economic divergence in reference class.'"  

  ---  
  #### **Step 6: Resolve Conflicting Base Rates**  
  **Objective**: Rule for handling multiple admissible classes (from Step 2) with divergent base rates.  
  - **Sufficient answer**:  
    - **Do not average**. Use:  
      - The class with the *most properties in common* with the entity.  
      - If tie, report *lowest* base rate (conservative choice).  
    *Exception: If classes are equally specific, forecast = range (e.g., "40–60%").*  
  - **Failure**: Averaging rates; ignoring conflict; using classes not from Step 2.  
  - **Rationale entry**: "Class chosen: [Reason] → Base rate [%]. e.g., 'Mechanism class used (shared exit clause); 30%.'"  

  ---  
  #### **Step 7: Revise for Annual Survival**  
  **Objective**: Update forecast when entity survives a year without decline.  
  - **Sufficient answer**:  
    - Re-run Steps 4–6 annually with updated:  
      - Entity age (e.g., base rates from entities founded ≥26 years ago).  
      - Hazard shape (if new evidence).  
    - **No interim adjustments** (e.g., no "probability boost" for survival).  
  - **Failure**: Ad hoc updates; not re-running steps.  
  - **Rationale entry**: "No revision; full re-forecast at next cycle."  

  ---  
  #### **Step 8: Register Key Findings for Review**  
  **Objective**: List 2–3 assumptions that most impact the forecast.  
  - **Sufficient answer**: Findings that, if changed, alter forecast by ≥15 percentage points. Prioritize:  
    - Reference class choice (Step 2).  
    - Hazard shape (Step 5).  
    - Base rate CI width (Step 4).  
  - **Failure**: >3 findings; trivial factors (e.g., "typo in data").  
  - **Rationale entry**: "Key sensitivities: 1. [Finding] → [Change]. e.g., '1. If hazard increasing, survival -20%'"  

  ---  
  ### Application to Cases  
  **Case 1: 30-year-old continental union** (27 members, exit clause, unanimity rule)  
  - **Step 1**: Constitutional order (treaty-based). **Director sign-off**.  
  - **Step 2**: **Option A** (mechanism: "treaty unions with exit clause & unanimity"). **Director sign-off**.  
  - **Step 3**: Exclude non-consolidated (constitutional order requires ratification).  
  - **Step 4**: Class = 12 entities (e.g., EEC, OAU). Base rate: 67% (8/12 survived 25 years). n<20 → CI: 45–89%. Material.  
  - **Step 5**: Default flat hazard (no evidence of change).  
  - **Step 6**: No conflict.  
  - **Step 7**: N/A (initial forecast).  
  - **Step 8**: Key: Base rate CI width (45–89%); class choice (Option B would be 75%).  
  - **Forecast**: 67% (wide CI due to n=12). **Result**: Uselessly wide band (45–89%) as suspected. **Publish with note**: "Low precision due to small reference class."  

  **Case 2: 240-year-old federal republic** (no secession, past internal conflict, economic divergence)  
  - **Step 1**: Core territory (≥90% retention; accommodates federal instability). **Director sign-off**.  
  - **Step 2**: **Option B** ("federal republics"; mechanisms unclear after 240 years). **Director sign-off**.  
  - **Step 3**: Exclude non-consolidated (core territory requires de facto control).  
  - **Step 4**: Class = 3 entities (e.g., USA, Switzerland). Base rate: 100% (all survived 25 years after age 240). n<5 → "Insufficient data."  
  - **Step 5**: Override to **increasing hazard** (evidence: economic divergence ↑ fragility).  
  - **Step 6**: No conflict.  
  - **Step 7**: N/A.  
  - **Step 8**: Key: Small n (if one fails, rate=67%); hazard shape (if flat, survival ↑).  
  - **Forecast**: **Refused** (n<5). **Result**: No number issued. **Redefinition tip**: Broaden class to "democratic states" or shorten horizon.  

  **Case 3: Regional security order** (pattern of alignment, no charter/treasury)  
  - **Step 1**: **Failure**—"Function" (deterrence) is possible, but "pattern" undefined (no observable threshold for continuity).  
  - **Step 2**: **Failure**—No mechanism/label (e.g., "balance of power" is theory, not observable property).  
  - **Output**: **Refusal**. Minimal redefinition: Specify a formal body (e.g., "NATO in region X") with a charter to use constitutional order.  

  ---  
  ### What the Procedure Cannot Do  
  1. **Prevent all failures**:  
     - **Small reference classes**: Inevitable for rare entities (e.g., 240-year republics). Produces uselessly wide CIs or refusals.  
     - **Hazard misjudgment**: Analysts may override default based on weak evidence (e.g., "divergence always increases risk").  
     - **Unprecedented events**: Cannot handle novel risks (e.g., AI-driven instability) absent from historical data.  

  2. **Judgment dressed as method**:  
     - Step 2 (A/B choice) and Step 5 (hazard override) are subjective. An analyst may "justify" a preferred outcome.  
     - Step 6 (conflicting classes) favors conservatism but cannot eliminate arbitrariness.  

  3. **Analyst errors despite compliance**:  
     - **Garbage-in, garbage-out**: If reference class is misapplied (e.g., "empire" label for a federation), forecast fails.  
     - **Overconfidence**: Hazard defaults (Step 5) may hide uncertainty; CI (Step 4) may be ignored in narrative.  
     - **Value-laden persistence**: Step 1 choices (e.g., "core territory") may not match stakeholders’ views.  

  **Conclusion**: The procedure forces transparency and corrects key biases but cannot replace deep contextual knowledge. It will flag uncertainty (wide CIs, refusals) rather than hide it—requiring courage to publish "useless" forecasts. Regular director sign-offs on judgments (Steps 1–3, 6) are critical for credibility.
