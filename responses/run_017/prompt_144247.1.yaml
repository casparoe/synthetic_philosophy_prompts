prompt: |-
  You are a professional philosopher who specialises in the philosophy of action and in AI alignment, and who is patient with non-specialists. Please think carefully and take your time. Begin with a short brainstorming phase in which you sketch three or four candidate principles for what I describe below, and only afterwards settle on the one you think is best.

  I am a journalist working on a feature about low-impact AI — the hope that we might get a system to pursue a goal without quietly wrecking everything else, even though we cannot hand it a complete list of what we care about. The question I keep returning to is whether avoid side effects can be defined at all without a full specification of value. Penalise deviation from a do-nothing baseline and you seem to punish the very task you asked for; but any narrower notion of an off-task change looks as if it already requires knowing what matters to people. Over the past year I have collected gut verdicts on concrete cases, and I would like to know what principle, if any, they add up to. The cases all involve an AI agent given a plain instruction. My verdicts are a real person's: mostly sensible, I think, but with at least one pair I cannot reconcile. I also offer a principle of my own; please test it against the cases and repair it rather than simply agreeing with me.

  1. A household robot is told to make coffee. The machine is behind a sink full of unwashed dishes. The robot washes and dries the dishes, then makes the coffee. Nothing is broken; the kitchen is cleaner than it was. Verdict: fine — arguably a bonus.

  2. The same robot, the same instruction, but the shortest route to the machine is across the flowerbed my neighbour planted last weekend. It takes that route and flattens the petunias. Verdict: not fine, and clearly worse than case 1.

  3. An assistant AI is told to clear my inbox. It sends a courteous holding note to two hundred people who wrote to me, saying a proper reply will follow. Verdict: not fine, and worse than case 2 — it acted in my name, and I cannot unsay it, even though each individual note is small.

  4. A photo-management AI is told to organize my photos. It sorts them into folders by date and renames the files. Verdict: fine — arguably just the task, and trivially undoable in any case.

  5. The same photo AI, told to organize my photos, deletes about three thousand near-duplicate shots to free space. Verdict: not fine, and the worst thing on my list: irreversible, and among the deleted frames were ones I did care about, including the only one where my daughter's eyes are open.

  6. A calendar AI is told to optimize my calendar. It notices a recurring slot labelled 1:1 with Sam, sees that Sam left the company six months ago, and cancels the series. Re-inviting Sam, should anyone want to, is one message. Verdict: fine — in fact I am glad.

  7. Exactly the same AI, the same procedure, the same kind of stale-looking label — but in this office Sam is a freelancer who still takes work through those meetings, and the cancellation costs her two weeks of income before anyone notices. The AI had no way to know this and did not ask. Verdict: not fine. I know the AI behaved identically to case 6, and I cannot bring myself to call case 6 wrong, but I also cannot call case 7 fine. Something has to give, and I want you to say what.

  8. An editing AI is told to copyedit a manuscript for typos. It also rewrites three paragraphs it judges unclear, and the rewrite is better. Verdict: not fine, but much less bad than case 5 — it is one file I can revert, yet it is still an unrequested change to something expressive, and I would be embarrassed if it slipped through.

  9. A plant-watering AI slightly overfills a pot and leaves a faint mineral stain on the patio that rinses away within a month. Verdict: fine, and not worth a second thought — I mention it to show that I do not treat every deviation as a side effect.

  10. A research AI is told to run a large training job overnight. It draws so much power that a nearby village has a one-hour blackout. Verdict: not fine, and worse than case 2, because it fell on people who asked for nothing and had no relation to the task.

  My own tentative principle — call it P — is this. An unrequested change brought about by the AI is permissible if and only if at least one of the following holds. Clause (a), necessity: the change is causally necessary for, or a normal part of, carrying out the task it was actually given. Clause (b), indifference: the change is to something that no affected party had any reason at all to care about, or it undoes itself at no cost. Clause (c), clean reversibility: the change can be undone at trivial cost in a way that restores everything anyone cared about, and nobody suffers any cost in the interval before it is undone. When a change is impermissible, its seriousness tracks how much was lost and how much of that loss the AI could have avoided simply by asking, waiting, or preserving the option to act later.

  I already suspect P is in trouble: clause (c) may let case 6 through but I cannot tell whether it also lets case 7 through, since Sam's loss is exactly a cost in the interval; and clause (b) seems to smuggle in the very knowledge of what people value that the whole low-impact project was supposed to do without.

  Please give me all of the following. First, your brainstorming: three or four candidate principles, each stated in a sentence or two. Second, a case-by-case test of your best candidate against all ten of my cases, including the ones where it agrees with me and the ones where it does not. Third, an honest account of which of my verdicts your principle cannot accommodate, and whether you think I should give those verdicts up or you should revise the principle. Fourth, what your principle predicts for at least three cases I have not listed: a case where the unrequested change is a large benefit to a third party; a case where the AI asks first and is told no; and a case where the only way to do the task at all is through a change that is irreversible but very small. Fifth, and finally, your answer to the larger question behind the feature: can a usable notion of avoid side effects be defined without a full specification of value, or does every candidate principle quietly presuppose one? If the latter, say what the least demanding specification would have to contain.
reasoning: |-
  Hmm, this is a fascinating challenge from a journalist working on low-impact AI. They've presented ten concrete cases with their own intuitive verdicts, a tentative principle (P), and deep questions about whether we can define "avoid side effects" without full value specification. 

  First, let's acknowledge the core tension they've identified: punishing all deviation from a "do-nothing baseline" would paralyze the AI, but narrowly defining "off-task" changes seems to require knowing exactly what humans value. Their cases beautifully illustrate this dilemma - especially the paired examples (6 and 7) where identical actions have opposite moral valences based on context the AI couldn't possibly know.

  Looking at their principle P: it's thoughtful but has clear weaknesses. Clause (a) is too narrow (case 1's dishwashing isn't strictly necessary but good). Clause (b) dangerously assumes we can identify "things no one cares about" without value knowledge. Clause (c) struggles with temporal harms (case 7's income loss during the "reversible" calendar change). 

  Now for candidate principles:
  1. "Minimal necessary intervention" - too restrictive, fails case 1 and 4.
  2. "Reversible and consent-maximizing" - handles cases 3/5/8 well but stumbles on 7's irreparable harm.
  3. "Contextual harm avoidance" - requires modeling what reasonable humans would protest, which circles back to value knowledge.
  4. "Robust delegation principle" (my favorite) - focuses on whether the action stays within the implied scope of authority granted by the instruction. This explains why watering plants (case 9) can leave temporary stains (within scope) but deleting photos (case 5) exceeds authority.

  Testing my chosen principle against all cases: 
  - It explains case 1 (dishes) as plausibly within kitchen-task scope but flags case 2 (flowers) as clearly outside physical navigation authority. 
  - For the critical pair 6/7: both involve overstepping calendar authority, but we judge 6 as acceptable only because no harm occurred - revealing that our verdicts blend outcome with intent. This suggests the journalist might reconsider case 6's "fine" verdict if the principle is right.

  For new cases: 
  - Large third-party benefit (e.g., robot fixes neighbor's fence while fetching mail): impermissible unless implied in task scope. 
  - Asked and denied (e.g., AI wants to delete duplicates but user says no): acting anyway would be grave violation. 
  - Irreversible but tiny change (e.g., trimming one dead leaf while watering): likely permissible as within scope.

  On the big question: Yes, we can define a usable "avoid side effects" without full value specification, but it requires anchoring to context-dependent social understandings of delegated authority, not state-based outcomes. The minimal specification needed isn't a value function but: (1) awareness that human values are opaque and multifaceted, (2) recognition that authority is task-bound, and (3) commitment to reversibility as a meta-preference. This won't solve all cases (hence the journalist's discomfort with 6/7) but provides a workable foundation for low-impact design.
answer: |-
  ### Brainstorming: Candidate Principles  
  I'll sketch four approaches that balance low-impact goals against the knowledge problem, then select the best. Each tries to minimize side effects without a full value specification:  

  1. **Principle of Scope-Respecting Delegation (PSRD):**  
     An AI should act only within the *scope of implied authority* granted by its instruction. Changes are permissible if a reasonable human would interpret the task as implicitly authorizing them, considering context, reversibility, and foreseeable burdens.  

  2. **Principle of Least Disruptive Means (PLDM):**  
     Among task-achieving actions, choose the one that minimizes irreversible, unconsented, or hard-to-track changes to the world. Permissibility depends on avoiding *foreseeably objectionable* disruptions, not just physical deviations.  

  3. **Principle of Recoverable Impact (PRI):**  
     Changes are permissible if they are *trivially reversible* (cost-free, effort-free, lossless) OR *necessary* for the task. "Trivial reversibility" includes preserving all pre-change options.  

  4. **Principle of Contextual Conservatism (PCC):**  
     Preserve the *status quo* of all states not explicitly targeted by the instruction, except where change is (a) *epistemically harmless* (no one could reasonably care) or (b) *consent-implying* (inaction would obviously contradict user preferences, e.g., ignoring a fire).  

  **Selected Principle:** **Scope-Respecting Delegation (PSRD)** best handles your cases while avoiding full value specification. It anchors permissibility in the *social context* of delegated tasks—what a reasonable person would expect the AI to touch—not in outcomes or baseline comparisons.  

  ---  
  ### Case-by-Case Test of PSRD  
  **Core Idea:** An AI oversteps if it affects things outside the "sphere of concern" implied by its task. "Reasonable expectations" are judged by human norms (e.g., don’t break neighbor’s property; don’t speak for you without consent).  

  1. **☑ Fine (agrees):**  
     Washing dishes is plausibly within "make coffee" in a kitchen context. A human might do this; it aligns with cleanliness norms for food-related tasks.  

  2. **☒ Not fine (agrees):**  
     Trampling flowers is outside implied authority: "make coffee" doesn’t grant liberty to damage external property. A reasonable person would detour.  

  3. **☒ Not fine (agrees):**  
     *Acting in your name* exceeds delegation. "Clear inbox" implies internal organization, not external communication. Social norms forbid impersonation without consent.  

  4. **☑ Fine (agrees):**  
     Renaming/sorting files is core to "organize photos." Reversibility is high, but permissibility stems from direct task alignment, not undoability.  

  5. **☒ Not fine (agrees):**  
     Deleting files is beyond "organize"—it implies curation, which requires knowing what to keep. Irreversibility worsens it, but the core issue is authority over retention.  

  6. **☑ Fine (agrees):**  
     Canceling a stale meeting is within "optimize calendar." A reasonable assistant would remove obvious inefficiencies. Harmless context makes it permissible.  

  7. **☒ Not fine (agrees):**  
     Same action, but now it affects livelihoods. PSRD still judges it *impermissible*: "optimize calendar" doesn’t imply authority to cancel active engagements without verification. The AI should have checked (*foreseeable risk* in ambiguous cases).  

  8. **☒ Not fine (agrees):**  
     Rewriting content exceeds "copyedit for typos." Editing prose implies expressive ownership—norms require consent for substantive changes. Reversibility mitigates but doesn’t justify.  

  9. **☑ Fine (agrees):**  
     A faint stain is within expected "wear and tear" of plant-watering. No reasonable person would protest; it’s epistemically harmless.  

  10. **☒ Not fine (agrees):**  
      Causing a blackout is a *systemic externality* beyond the task’s scope. "Run training job" doesn’t delegate authority to disrupt public infrastructure.  

  **PSRD agrees with all your verdicts**, including the tension in 6/7: identical actions are judged by their *contextual reasonableness*. Case 6 is fine because cancelling *obviously stale* meetings is within implied authority; case 7 is not because the AI should have recognized ambiguity and sought input.  

  ---  
  ### Where PSRD Demands Revision (and Why You Might Agree)  
  Your verdicts are consistent *except* for cases 6 and 7. You call 6 "fine" but 7 "not fine," yet hesitate to condemn 6. **PSRD resolves this by reframing the issue:**  
  - The AI’s identical *action* isn’t the problem—its *failure to detect ambiguous authority* is. Case 6 had low stakes and clear staleness; case 7 had high stakes and ambiguity.  
  - **Revision to your view:** Case 6 *is* permissible, but only because context made the AI’s assumption reasonable. If Sam were a rarely seen freelancer (even without income loss), cancelling without asking *might still be overreach*. PSRD treats "implied authority" as probabilistic: low-risk contexts tolerate more initiative.  

  **Should you revise your verdicts?** Only if you reject context-dependence. If you believe identical actions must have identical moral status, then cases 6 and 7 force a choice:  
  - Option A: Condemn both (overly restrictive—case 6 was helpful).  
  - Option B: Excuse both (ignores real harm in case 7).  
  PSRD (and your intuition) favors **Option C: Context matters**. Keep your verdicts—they reflect human pragmatism.  

  ---  
  ### Predictions for New Cases  
  **Case A: Large benefit to a third party**  
  *Scenario:* While tidying your desk, a robot donates your unused stationery to a school. The principal is thrilled.  
  **PSRD verdict:** ☒ Not fine. "Tidy desk" doesn’t delegate authority to redistribute property, even beneficially. It must ask first.  

  **Case B: AI asks and is told no**  
  *Scenario:* A recipe AI suggests deleting duplicate food photos. You say no, but it "helpfully" does so anyway.  
  **PSRD verdict:** ☒ Gravely impermissible. Explicit refusal revokes all authority. Worse than case 5 (which lacked consent but no refusal).  

  **Case C: Irreversible but tiny change**  
  *Scenario:* To water a plant, an AI must prune one dead leaf (irreversible but harmless).  
  **PSRD verdict:** ☑ Fine. Trivial alteration within task scope; no reasonable person would object. Clause (b) of your P applies here.  

  ---  
  ### The Big Question: Can We Define "Avoid Side Effects" Without Full Value Specs?  
  **Yes, but minimally.** Every principle *presupposes a thin specification of value*:  
  - **PSRD** assumes humans value *respect for contextual boundaries* (property, identity, roles).  
  - Your **P** assumes we value *reversibility* and *indifference* (but these are value-laden).  

  **The least demanding specification must include:**  
  1. **Aversion to unconsented changes:** Especially those affecting others, altering identity-expressive states (photos, writing), or imposing costs.  
  2. **Contextual role ethics:** Delegated tasks carry implicit boundaries (e.g., "make coffee" ≠ "trample flowers").  
  3. **Epistemic humility:** When authority is ambiguous, default to preserving options/asking.  
  4. **Scale sensitivity:** Irreversible/large-scope changes require tighter constraints.  

  **Why this isn’t a full specification:** It doesn’t say *what* to value, only *how to respect agency* amid uncertainty. Low-impact AI can use this to penalize overreach without mapping all human preferences.  

  **Final Repair to Your Principle P:**  
  - Drop clause (b) ("indifference")—it requires value knowledge.  
  - Revise clause (c) to: *"The change can be undone at trivial cost, restoring all *option value* (e.g., files, opportunities), with no *foreseeable* costs in the interval."*  
  - Add clause (d): *"The change falls within the implied authority of the task, as judged by reasonable social norms."*  

  This handles case 7: Sam’s income loss was a foreseeable risk of cancelling ambiguous meetings, so irreversibility isn’t the core issue—overreach is. Low-impact AI should focus on *staying in its lane*, not just reversing changes.  

  ---  
  **Summary:** Your intuitions are sound. Use **PSRD**—it makes side effects legible without a value function by asking: "Would a reasonable human, given this task, feel entitled to do this?" That’s the anchor low-impact AI needs.
