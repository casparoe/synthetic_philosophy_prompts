  Here’s a decision tree designed to resolve your group’s debates, starting from the commitment that "the suffering of sentient animals matters morally." Each node focuses on concrete cases or empirical claims, avoiding abstract questions about sentience or moral weight. The tree sorts positions based on **practical tradeoffs**, not labels. About 8 distinct leaves emerge, each with a concrete prescription and its "awkward commitment" (the hardest pill to swallow).  

  **How to use this tree:**  
  - Start at Node 1. Answer based on your intuition about the case.  
  - Each node hinges on an empirical question (e.g., "How many mice die per calorie of grain?"). Order-of-magnitude estimates are noted where they flip the verdict.  
  - Positions "come apart" at key disagreements (e.g., whether death or suffering dominates, or if crop deaths "count").  
  - Unoccupied branches (e.g., "pro-insect farming") are noted where they’d logically exist but lack real-world advocates.  

  ---

  ### **THE DECISION TREE**  

  #### **Node 1: Is it worse to kill 50 pasture-raised chickens (each with a 1-year life, 1 minute of suffering at death) or 1 pasture-raised cow (5-year life, 1 minute of suffering at death) for the same calories?**  
  *(Hinges on: Is the harm of death independent of suffering? How much does "number of lives" matter?)*  
  - **If 50 chickens are worse:** Go to Node 2.  
  - **If 1 cow is worse (or equal):** Go to Node 3.  

  #### **Node 2: Do wild animals (e.g., field mice in croplands) experience more suffering-per-life on average than a factory-farmed chicken?**  
  *(Hinges on: Is nature "nasty"? Estimates: Wild mice live 6–12 months; 50% die before weaning. Flip if factory chickens suffer >10× worse than wild mice.)*  
  - **If wild animals suffer more:** Go to Node 4.  
  - **If factory chickens suffer more (or equal):** Go to Node 5.  

  #### **Node 3: Would replacing wild grassland with pasture for cattle likely reduce total animal suffering (due to fewer animals living "nasty" lives)?**  
  *(Hinges on: Does farming displace wild animals? Estimates: Pasture may support 1 cow/ha vs. 1000+ wild insects/mice/ha. Flip if pasture has >100× fewer animals than wild land.)*  
  - **If pasture reduces suffering:** Go to Node 6.  
  - **If pasture increases suffering (or equal):** Go to Node 5.  

  #### **Node 4: For 1000 calories of protein, do insects (e.g., crickets) cause less suffering than beef?**  
  *(Hinges on: Are insects sentient? How efficiently do they convert feed? Estimates: Crickets need 2kg feed/kg meat; cattle need 6kg. Flip if insect sentience is >50% likely.)*  
  - **If insects cause less suffering:** → **Leaf 1: Eat insects (crickets/mealworms), avoid beef/chicken.**  
    *Awkward commitment: You’ll farm and kill trillions of insects, assuming their suffering is trivial.*  
  - **If beef causes less suffering:** → **Leaf 2: Eat only pasture-raised beef/lamb; avoid chicken, crops, and insects.**  
    *Awkward commitment: You ignore mice/insect deaths in pastures, assuming they’re rare or justified.*  

  #### **Node 5: For 1000 calories of food, does growing crops for human food cause fewer animal deaths than growing feed for cattle?**  
  *(Hinges on: How many mice/insects die per calorie of grain? Estimates: 1 mouse death per 1M grain calories; beef requires 10× more grain than direct human consumption. Flip if <0.1 mouse deaths per beef calorie.)*  
  - **If crops cause fewer deaths:** → **Leaf 3: Eat plants (vegan), but don’t stress about insects.**  
    *Awkward commitment: You dismiss insect suffering entirely, despite uncertainty.*  
  - **If crops cause more deaths (or equal):** Go to Node 7.  

  #### **Node 6: Does eating oysters/bivalves (assumed no nervous system) cause less suffering than a plant-based diet?**  
  *(Hinges on: Do bivalves feel pain? Estimates: 0 observable pain responses. Flip if >10% chance of sentience.)*  
  - **If bivalves cause less suffering:** → **Leaf 4: Eat only bivalves (oysters/mussels) and lab-grown meat.**  
    *Awkward commitment: You’ll eat organisms that might be sentient, betting they aren’t.*  
  - **If plants cause less suffering:** → **Leaf 5: Eat plants (vegan), but don’t stress about insects.**  
    *Awkward commitment: Same as Leaf 3—ignores insect suffering.*  

  #### **Node 7: Does a diet including pasture-raised beef cause fewer total animal deaths (including crop deaths) than a vegan diet?**  
  *(Hinges on: Do cattle grazing on non-farmable land displace fewer animals than crop farming? Estimates: 1 beef calorie can require 0 crop deaths if 100% grass-fed; 1M grain calories causes ~1 mouse death. Flip if grass-fed beef uses >10× more land than crops.)*  
  - **If beef causes fewer deaths:** → **Leaf 6: Eat pasture-raised beef/lamb; never chicken or crops.**  
    *Awkward commitment: You assume cattle grazing doesn’t harm wild animals (e.g., via habitat loss).*  
  - **If vegan causes fewer deaths:** → **Leaf 7: Eat plants (vegan), but don’t stress about insects.**  
    *Awkward commitment: Same as Leaf 3.*  

  #### **Leaf 8: Diet is irrelevant—focus on reducing wild animal suffering via land use policy or tech.**  
  *(Reached if you reject all farming at Node 1 or prioritize wild suffering at Nodes 2/3.)*  
  *Awkward commitment: You do nothing about your diet while arguing for large-scale interventions (e.g., gene editing predators).*  

  ---

  ### **HOW THE POSITIONS MAP TO THE TREE**  
  - **"Eat chicken" advocate:** Ends at **Leaf 6/7** (if you prioritize fewer lives → Node 1 → Node 5).  
  - **"Pasture-raised beef" advocate:** Ends at **Leaf 2, 6, or 8** (if you think cattle displace wild suffering → Node 3).  
  - **Vegan:** Ends at **Leaf 3, 5, or 7** (via Node 5 or Node 6).  
  - **"Wild suffering dominates" advocate:** Ends at **Leaf 8** (via Node 2 or Node 3).  
  - **"Bivalves only" advocate:** Ends at **Leaf 4** (via Node 6).  

  ### **UNOCCUPIED BRANCHES & WHY**  
  - **"Pro-insect farming" (Leaf 1):** Rarely advocated because people find insect sentience plausible and farming them repulsive.  
  - **"Pro-crop deaths" (ignores them):** All leaves except Leaf 8 ignore insect/mouse deaths to some extent, but no one actively defends crop deaths as good.  

  ### **WHAT THIS TREE CAN’T DISTINGUISH**  
  - **Vegans vs. bivalve-eaters:** Depends solely on Node 6 (bivalve sentience), which has no further branches.  
  - **"Diet irrelevant" vs. "minimal harm":** Both end at Leaf 8 if wild suffering dominates, but pragmatists might pick a diet anyway.  

  ---

  **Key**: This tree forces clarity on **tradeoffs** (death vs. suffering, wild vs. farmed, efficiency vs. certainty). Use it to expose where disagreements are really about empirical guesses (e.g., "how many mice die?") vs. values (e.g., "death is inherently wrong"). No reading lists—just eyeball the estimates and debate!
