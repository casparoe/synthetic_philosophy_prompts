answer: |-
  Here’s a clear audit of the jury analogy, structured for your commission’s deliberation:

  ### Core Analogy Mapping: Jury ↔ Sortition Chamber  
  *(Load-bearing elements critical to legitimacy in **bold**)*  

  | **Jury Element**           | **Sortition Chamber Element**   | **Legitimacy Role**                                   | **Essential or Incidental?** |
  |----------------------------|----------------------------------|-------------------------------------------------------|------------------------------|
  | **Voir dire**              | Qualification/self-selection?    | Filters bias/incapacity; ensures fairness             | **Incidental** (methods vary) |
  | **Judge’s charge**         | Agenda-setting authority?        | **Defines scope/questions; prevents overreach**       | **LOAD-BEARING** (critical) |
  | **Deliberation room**      | Private meeting space            | Enables candid debate                                 | Incidental (practical need) |
  | **The twelve (jury size)** | Chamber size (unspecified)       | **Statistical representativeness; functional capacity** | **LOAD-BEARING** (scale-dependent) |
  | **Unanimity/verdict form** | Voting rules/procedures          | **Legitimizes outcome; ensures deliberation**         | **LOAD-BEARING** (design-specific) |
  | **Excusal**                | Voluntary opt-out                | Protects against hardship; respects autonomy          | Incidental (implementation) |
  | **Return to ordinary life**| Post-service transition          | **Prevents professionalization; maintains citizen focus** | **LOAD-BEARING** (core to amateurism) |

  ---

  ### Disanalogies & Implications  
  **Sorted by impact on the analogy’s two uses:**  
  *(1st Use: Legitimizing random selection | 2nd Use: Justifying non-renewable terms)*  

  1. **The Charge Problem (Agenda-Setting)**  
     - **Disanalogy:** Juries answer narrowly defined questions from a judge/prosecution. A legislative chamber sets its own agenda or inherits it from other bodies (e.g., elected chamber, staff).  
     - **Impact on 1st Use:** Weakens legitimacy argument. If agenda power lies elsewhere, the "mandate" objection resurfaces: unelected actors wield significant power.  
     - **Impact on 2nd Use:** Neutral. Agenda-setting doesn’t inherently conflict with term limits.  
     - **Verdict:** **Damages 1st Use**. The analogy masks a critical power imbalance. A "jury" without a "judge" is not a jury; it’s an assembly with undefined authority.  

  2. **The Filter Problem (Selection Bias)**  
     - **Disanalogy:** Juries *exclude* people with knowledge/stakes (to ensure impartiality). Sortition chambers *rely* on including diverse lived experience for legitimacy.  
     - **Impact on 1st Use:** **Severely damages it**. The jury’s legitimacy *requires* neutrality via exclusion; the chamber’s legitimacy *requires* representation via inclusion. They are opposites.  
     - **Impact on 2nd Use:** Neutral. Term limits aren’t directly affected by selection criteria.  
     - **Verdict:** **Undermines 1st Use fatally**. The analogy’s core premise (random selection = jury-like legitimacy) fails here.  

  3. **The Return Problem (Post-Service Life)**  
     - **Disanalogy:** Jurors serve days/weeks, then resume anonymity. Chamber members serve 6 years, face reputational exposure, and must re-enter the job market.  
     - **Impact on 1st Use:** Neutral.  
     - **Impact on 2nd Use:** **Directly contradicts it**. The analogy’s claim ("like jurors, they go home") is false. A 6-year gap creates "lame duck" risks, revolving door incentives, and career disruption anxieties the jury system avoids.  
     - **Verdict:** **Damages 2nd Use**. The analogy argues *against* long terms, not *for* them.  

  ---

  ### The "Legislator-as-Judge" Rival Analogy  
  - **Flaw:** Judges are *appointed experts* with tenure to ensure independence from politics. Legislators are *representatives* accountable to voters.  
  - **Why it fails:** Conflates judicial independence (insulation from popular pressure) with legislative accountability (responsiveness to constituents). Long-serving politicians aren’t "judges"; they’re agents of electoral mandates.  
  - **Conclusion:** This is a category error. The rival analogy doesn’t hold under scrutiny.  

  ---

  ### Does "No Reselection, Ever" Survive?  
  - **Yes, but weakly and not because of the jury.**  
    - The jury analogy *successfully* supports **amateurism** (no career legislators).  
    - It **fails** to justify a *6-year term*. The return problem shows the analogy implies *shorter* service (weeks/months).  
  - **The term limit needs independent justification:**  
    1. **Prevents entrenched power centers** within the sortition chamber.  
    2. **Maximizes turnover** to refresh perspectives and share civic duty.  
    3. **Reduces capture risk** by limiting time for lobbyists to cultivate influence.  
  - **Better analogies?** None are perfect:  
    - *Conscription/Draft*: Citizens serve once, then return to life. But implies coercion.  
    - *Tournament judging*: One-off, independent assessment. But lacks scale/scope.  
    - **Honest answer:** Defend the ban **directly**:  
      > *"A non-renewable term ensures the chamber remains a rotating body of ordinary citizens, not a political class. Six years balances experience with turnover—long enough to learn, short enough to retain civic grounding."*  

  ---

  ### Recommendation for the Draft  
  1. **Drop the jury analogy for legitimizing sortition** (fails due to Filter/Charge problems).  
  2. **Retain it cautiously for amateurism/term limits**—but **add explicit acknowledgment**:  
     > *"Like jurors, members serve once to prioritize fresh perspectives. Unlike jurors, their service is lengthy; this demands robust transition support."*  
  3. **Address the Charge Problem explicitly**: Define agenda-setting rules (e.g., "Joint committee with elected chamber," "Citizen initiative threshold").  
  4. **Mitigate the Return Problem**: Propose post-service stipends/career counseling to reduce vulnerability.  

  The analogy’s 2nd use *can* stand if divorced from the 1st—but its limitations must be conceded to skeptics. The strongest case rests on first principles: term limits preserve the chamber’s character, not borrowed legitimacy.
