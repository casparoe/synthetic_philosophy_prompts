answer: |-
  Below is a decision procedure designed for your context, grounded in the distinctions from your seminar and supervisor's input. It prioritizes speed (under 20 minutes), simplicity for undergraduates, and budget constraints. The procedure is structured as a flowchart of questions, with explicit hand-offs for value judgments and clear termination points. Your supervisor's reversibility point is integrated where it adds value (Step 4) and flagged as a red herring elsewhere.

  ---

  ### **Decision Procedure for Choosing Supervision Method**  
  **Instructions**: Answer sequentially. Stop at the first terminal decision (✅ or ❌). Hand off value judgments to specified roles.  

  1. **Is there a cheap, non-gameable outcome signal?**  
     - *Check*: Outcome must be automatically measurable (e.g., logs, APIs) or verifiable by humans in <10 seconds/action (e.g., yes/no check). Signal must resist gaming (e.g., "meeting booked" is gameable by spamming invites; "ticket closed without reopen" is robust if reopening is tracked).  
     - **Yes → Step 2**  
     - **No → Step 3**  
     - *Hand-off*: If outcome exists but gaming risk is ambiguous → **Graduate mentor decides**.  

  2. **Is the outcome signal sufficient?**  
     - *Check*: Optimizing for this signal alone won’t cause harm due to missing context (e.g., poor tone in emails, ignoring long-term effects). Consider: Would a less-informed approver (e.g., new undergrad) disagree with a well-informed one? If yes, outcome misses nuance.  
     - **Yes (sufficient) → ✅ Use goal-directed (outcome as objective)**  
     - **No (insufficient) → Step 4**  

  3. **Is approval feasible and context-complete?**  
     - *Check*: Can approvers (e.g., undergrads) replicate the task’s context with ≤1 min/action? Approval must capture critical nuances (e.g., email tone, fairness). Budget check: 20 hrs/week ≥ estimated annotation time.  
     - **Yes → Step 5**  
     - **No → ❌ Hand off to graduate mentor** (task may need redesign or abandonment).  

  4. **Can we afford hybrid?**  
     - *Check*: Hybrid (outcome as objective + approval as constraint) costs more (approval adds ~5–30 sec/action). Is budget (20 hrs/week) sufficient?  
     - **Yes → ✅ Use hybrid**  
     - **No → Step 5**  
     - *Reversibility integration*: If task understanding may change (e.g., new policies), approval is cheaper to update → favors hybrid or pure approval.  

  5. **Are consequence-bearers approving?**  
     - *Check*: Are the people affected by errors (e.g., meeting attendees, ticket submitters) represented in approval? If annotators role-play stakeholders, this counts.  
     - **Yes → ✅ Use approval-directed**  
     - **No → Step 6**  

  6. **Is approval mostly style?**  
     - *Check*: Would two less-informed approvers agree on judgments? If yes, signal is stylistic (e.g., email clarity) and less context-dependent. If no, approval relies on unshared context (e.g., stakeholder preferences).  
     - **Yes → ✅ Use approval-directed**  
     - **No → ❌ Hand off to graduate mentor** (values conflict: approver vs. stakeholder alignment).  

  ---

  ### **Key Notes**  
  - **Terminal decisions**:  
    - ✅ **Goal-directed**: Robust outcome, low risk of harm.  
    - ✅ **Approval-directed**: Hard-to-specify goals, approvers represent stakeholders.  
    - ✅ **Hybrid**: Outcome is gameable/insufficient but measurable; approval affordable.  
    - ❌ **Hand-off**: Value conflicts (Steps 1, 3, 6) or infeasibility.  
  - **Reversibility**: Only in Step 4 (hybrid decision). Elsewhere, it’s a red herring—reversing a flawed outcome signal requires rebuilding the agent, but approval’s "cheap updates" don’t fix misaligned approvers.  
  - **Who decides hand-offs**: Always the **graduate mentor** (values/time trade-offs).  

  ---

  ### **Procedure Applied to Your Cases**  
  *Annotation budget*: 20 hrs/week. *Assumptions*: Approval annotation takes 15–60 sec/action.  

  #### **Case 1: Calendar Agent**  
  - *Background*: Negotiates meetings; 6 weeks of approval data exists.  
  - **Step 1**: Outcome signal? Meeting booked automatically (e.g., calendar API). But gameable (e.g., agent forces inconvenient times). → **No** → Step 3.  
  - **Step 3**: Approval feasible? Yes (existing process works; context is replicable: undergrads can judge email tone/options). → Step 5.  
  - **Step 5**: Consequence-bearers approving? Meeting attendees are affected. If annotators simulate attendees → **Yes**. → ✅ **Use approval-directed**.  
  - *You won’t like this*: Existing approval data is sunk cost, but outcome is gameable. Reversibility irrelevant here.  

  #### **Case 2: Support-Ticket Triage Agent**  
  - *Background*: Outcome = "closed without reopen in 48h" (automatic, non-gameable if reopen tracked).  
  - **Step 1**: Outcome exists and robust → **Yes** → Step 2.  
  - **Step 2**: Outcome sufficient? No. Optimizing for closure may cause harm (e.g., hasty closures, misprioritized urgent tickets). → Step 4.  
  - **Step 4**: Hybrid affordable? Approval adds ~30 sec/ticket (e.g., "Was triage appropriate?"). 20 hrs/week supports ~2,400 tickets → **Yes**. → ✅ **Use hybrid** (outcome = objective, approval = constraint).  
  - *Reversibility*: Task understanding may evolve (e.g., new ticket types) → favors hybrid.  

  #### **Case 3: Proposal Feedback Agent**  
  - *Background*: Drafts feedback for seminar; no ground truth.  
  - **Step 1**: Outcome signal? None (quality is subjective). → **No** → Step 3.  
  - **Step 3**: Approval feasible? Course staff could approve, but undergrads lack expertise. Budget overrun likely (feedback takes >1 min/draft). → **No** → ❌ **Hand off to graduate mentor**.  
  - *Why you’ll dislike this*: Your instinct favored approval, but undergrads can’t replicate staff expertise affordably. Mentor must decide: Use staff (breaking budget) or abandon.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Blind spots**:  
     - **Approval gaming**: Assumes approvers can’t be manipulated (e.g., agent exploits lenient annotators).  
     - **Long-term effects**: Misses slow-rolling failures (e.g., agent gradually erodes user trust).  
     - **Approver bias**: Doesn’t audit if annotators inherit lab/groupthink biases.  
     - **Zero-shot tasks**: Struggles with novel tasks (no prior data for Steps 1/3).  

  2. **Avoid these tasks**:  
     - **High-stakes decisions** (e.g., medical, legal): Hand-offs to a mentor are insufficient.  
     - **Real-time actions** (e.g., live negotiation): Approval is too slow.  
     - **Multipolar conflicts** (e.g., balancing stakeholder groups): Procedure oversimplifies "consequence-bearers".  

  3. **Judgment calls disguised as checklists**:  
     - Step 2 ("Is outcome sufficient?"): Requires predicting harm scenarios.  
     - Step 6 ("Is approval mostly style?"): Relies on subjective "agreement" thresholds.  
     - Step 4 ("Can we afford hybrid?"): Budget estimates are guesswork.  

  **Final recommendation**: Use this for routine tasks (like your cases). For edge cases, default to approval-directed and document assumptions—your lab’s existing process is likely optimized for iterative refinement.
