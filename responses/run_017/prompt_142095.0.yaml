  - Introduce the waiver wrinkle: "What if the five could each waive their claim? How many would have to waive to make it so that the one should be saved? Does that show that the numbers are doing work or not?"
  - Point out where the activity might have fallen short: 
     - The stakes aren't real, so decisions might not reflect real-life gravity.
     - The group might not have reached the equal-chance solution on their own.
     - We didn't do the waiver in action, so we discussed it hypothetically.
  - Conclude by acknowledging the complexity and that there isn't an obvious answer.

