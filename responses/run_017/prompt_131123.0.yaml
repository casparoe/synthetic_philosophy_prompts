  ## The Print Room Sestina

  The lamplight falls upon the first sheet’s **grain**,
  Sharp lines incised where burin bit the plate.
  The Keeper’s eye discerns no loss, no **hair**
  Breadth’s shift. Adjacent, side by side, they’re **par**.
  No single step demands a choice, a break.
  This slow descent defines the copper’s **chain**.

  Impression two: a softer touch, a **chain**
  Of ink less biting on the laid sheet’s **grain**.
  The Keeper holds them close. No step’s a **stair**
  Tumbling down. The line, reworked with care, a **hair**
  More graceful, holds its worth. Still judged on **par**.
  No loss perceived beneath the focused **end**

  Of scrutiny. So each impression’s **end**
  Is linked, a tolerance annealed like **chain**.
  Each pair, beneath the lamp, remains on **par**.
  No finer edge exists beyond the **grain**
  Of human sight. A difference of one **hair**
  Defines the limit, the perceptual **stair**

  That cannot rise or fall. Each tiny **stair**
  Is flat to him. The verdict: safe. No **end**
  To this progression seen. A single **hair**
  Of change is nothing, lost within the **chain**.
  It lies beneath the threshold, past the **grain**
  Of sense. *Not worse* is what he sees. On **par**

  Is all he claims. He never sees true **par**
  Dissolve. He only steps the present **stair**,
  Comparing links below the finest **grain**.
  He knows no leap, perceives no distant **end**,
  Just holds the current, binding, seamless **chain**
  Defined by differences below one **hair**.

  But watch the thousandth sheet. A soft **hair**
  Blur where the image swam beyond all **par**.
  No crisp design remains. The heavy **chain**
  Of steps has brought it here. It feels a **stair**
  Descended far. Compare it to the **end**
  That started sharp? Beyond the finest **grain**

  Of doubt, the first sheet boasts a keener **grain**.
  The thousandth’s lost the line. That crucial **hair**
  Of life gained couldn’t save it in the **end**.
  No single trade declared it worse. On **par**
  Each step remained. Yet here, beside the **stair**'s
  First foot, the last link snaps the valued **chain**.

  **Envoi**
  The Keeper sees no single break, no **stair**
  Step down. He built the **chain** link-safe. The **end**
  Reveals the cost: true loss, beyond one **hair**'s
  Exchange, denies that *par* must hold its **grain**.
  No cut exists. We watched the image **end**.
  The tolerance itself was the false **par**.

  ---

  **Philosophical Note:** The envoi rejects the premise that there *must* be a precise, identifiable step where "not worse than" fails, locating the problem instead in the tolerance relation ("par") itself. This accepts ontological vagueness in comparative value predicates. The cost is relinquishing the ideal of perfectly sharp boundaries for "worse than" across a sorites series, requiring acceptance of indeterminate cases where no definite "better," "worse," or "equal" verdict holds between adjacent items. This avoids positing unknowable sharp cutoffs while denying transitivity to tolerance.
