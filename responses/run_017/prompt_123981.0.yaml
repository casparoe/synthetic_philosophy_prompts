prompt: |-
  I teach an upper-level seminar on social epistemology and democratic theory — 18 students, one 90-minute slot, a room with a projector and movable chairs, no budget for cash prizes, but I have index cards, two colours of dot stickers, envelopes, a coin and a deck of cards. I want an activity that makes them feel the Condorcet jury theorem as a mechanism with load-bearing assumptions rather than as a wisdom-of-crowds slogan, and I want them to build the pattern themselves: no statement of the theorem up front, nobody hears the name until the debrief, and I say nothing about independence or competence until they have already voted several times.

  Rough shape I have in mind, which you should feel free to redesign: there is a true state of the world, each student gets a private signal of a reliability I control, they vote simultaneously by secret ballot, and we tally. What I want them to notice, in roughly this order: with reliability only just above chance and 19 voters, the majority is barely better than a coin flip even though the result is supposed to go to certainty, so the asymptotics are a terrible guide at seminar-sized numbers; if I flip the signal reliability just below chance, the same aggregation runs backwards and the majority ends up confidently wrong more often than any single voter; then give everyone the same extra public signal — one blurry piece of evidence on the projector that they all see — and watch a ceiling appear, with the error rate refusing to fall however many voters I add. Then, and this is the bit I care about most, run one round sequential and aloud with the identical set of private signals as an earlier simultaneous round: same people, same information, opposite result, because what changed was the mechanism and not the world. I also want a round where two students get high-accuracy signals and the other seventeen get near-chance ones, so the class has to decide whether to vote at all or to defer to the specialists, since I have a hobbyhorse that the interesting question is not whether many beat few but what you buy with a fixed budget of attention or money, many cheap weak signals or a few expensive good ones, and I want to see whether the activity can make that concrete. And if there is room, one round where the two error types carry very different costs, so they have to ask whether the asymmetry belongs in the aggregation rule or in the threshold for acting on a given majority, and whether a supermajority requirement is doing epistemic work or just expressing caution.

  Give me the rules, the materials, how to randomise cleanly on the fly, and a payoff scheme that needs no money, plus a debrief that maps each moment onto the part of the theorem it was meant to expose. Then the honest part: what will predictably go wrong the first time I run it — the student who holds up their card, the confident first speaker who anchors the sequential round, the run where the majority just gets unlucky and the class draws exactly the lesson I didn't want, the argument about whether my deck was really shuffled — and how I should handle each, including what to do when the demonstration plain fails. Be frank too about what the activity cannot reproduce and I will have to say out loud afterwards; I strongly suspect the convergence claim itself is the big one, since 19 people can't show anybody a limit, and probably also anything about voters choosing whether to acquire a signal in the first place. Last thing, and I mean it: I know this literature well enough not to need a reading list, so don't send me citations, and please seperate what is just the arithmetic of the theorem given its assumptions, which I take to be settled, from what is genuinely contested among people who work on it — whether any real electorate satisfies anything in that neighbourhood, and what if anything follows for democracy — and I definately want you to flag my budget framing as my own hobbyhorse if that is what it is, rather than nodding along with it. Continuous prose please, like an email: no headings, no bullets, no bold, no tables.
reasoning: |-
  Okay, the user is teaching an upper-level seminar on social epistemology and democratic theory and wants an activity to illustrate the Condorcet jury theorem without stating it upfront. They have 18 students, a 90-minute session, and basic materials like index cards, dot stickers, envelopes, a coin, and a deck of cards. The main goal is to make students experience the theorem's mechanisms and assumptions through hands-on voting exercises.

  First, I need to design an activity that follows their rough shape: true state of the world, private signals with controlled reliability, secret ballots, and tallying results. The key moments they want to highlight include: majority barely better than chance with low reliability, flipping reliability to show confident wrong majorities, public signal causing a ceiling effect, sequential vs simultaneous voting leading to opposite outcomes, and trade-offs between many weak signals vs few strong ones. Also, considering asymmetric error costs and supermajority requirements.

  Materials: Index cards for ballots, dot stickers for votes (say, red for Option A, blue for Option B). Envelopes for secret ballots, coin and deck of cards for randomization. The deck can assign roles or determine true states.

  Setting up the true state: Use the coin flip at the start to decide the actual state (Heads = A, Tails = B). This ensures randomness and transparency. Record it secretly on an index card and seal in an envelope to reveal later.

  For private signals, assign reliability using the deck. For example, high reliability could be 85% accurate, low near 50%. Distribute signals via index cards. Need a method to randomize signals efficiently. Maybe assign card values: red suits mean signal matches true state for high reliability, etc. But need to ensure probabilities are controlled.

  The sequence of rounds:

  1. **Baseline:** Simultaneous vote with private signals at 55% reliability. Expect majority barely better than chance.
  2. **Flipped reliability:** Same but signals at 45%. Majority likely wrong.
  3. **Public signal:** Add a blurry image (e.g., fuzzy shape) that's 60% accurate. All see it. Vote again. Error rate should plateau.
  4. **Sequential round:** Use same signals as round 1 but vote aloud in sequence. Likely herding occurs, different outcome.
  5. **Expert vs crowd:** Two students get 85% signals, others 51%. Vote or defer? Explore attention budget trade-off.
  6. **Asymmetric costs:** Frame as convicting a defendant. False conviction worse than false acquittal. Supermajority required (e.g., 14/18). Discuss if it's epistemic or caution.

  Payoff scheme: Non-monetary. Track group accuracy with stickers. "Epistemic points" for correct majorities, noted on board. Emphasize collective success.

  Debriefing: After all rounds, reveal the true state envelope. Map each round to Condorcet assumptions:
  - Rounds 1 & 2: Competence above/below 50%, independence.
  - Round 3: Public signal violates independence, causing common error.
  - Round 4: Sequential voting shows dependence, herding.
  - Round 5: Fixed budget—many weak vs few strong signals.
  - Round 6: Asymmetric costs—supermajority as risk mitigation.

  Predictable issues:
  - **Cheating:** Student peeks or reveals signal. Handle by emphasizing rules, using envelopes, possibly assign roles.
  - **Sequential herding:** First speaker anchors. Might need to randomize order secretly (deck of cards for speaking order).
  - **Unlucky outcomes:** E.g., in round 1, majority wrong despite >50% reliability. Address by pre-running probabilities, acknowledging randomness, focusing on expected vs actual.
  - **Deck shuffling doubts:** Have a student shuffle publicly. Transparency.
  - **Activity failure:** If a key round flops, use it to discuss assumptions (e.g., if independence is violated inadvertently).

  What the activity can't show:
  - Convergence with large groups. Need to explain asymptotics theoretically.
  - Endogenous signal acquisition. Mention it's beyond scope.

  Hobbyhorse note: The budget framing (attention/money trade-off) is the user's emphasis. Clarify in debrief that while Condorcet assumes fixed competence, real-world resource allocation is separate.

  Contested issues: Real electorates' independence and competence. Condorcet's applicability to democracy is debated—does collective intelligence require idealized conditions? Highlight that the theorem is a model with strict assumptions, and real groups may not meet them.
answer: |-
  Here’s a detailed plan for your activity, designed to unfold the Condorcet jury theorem’s assumptions through experiential discovery. I’ll outline the setup, sequence of rounds, randomization methods, and debrief, then address predictable pitfalls and limitations honestly. The core structure uses your rough shape but refines it for clarity and flow within 90 minutes, with all randomization done transparently using your materials. 

  **Setup:** Start by explaining only the minimal rules. Announce that the class will solve a series of binary fact-finding puzzles (e.g., "Is the capital of Bolivia La Paz or Sucre?" or "Did the coin flip land Heads or Tails?"). Emphasize that there’s a single correct answer for each round, and their goal is to help the group reach it. Designate one truth envelope: flip a coin secretly (Heads = Option A, Tails = Option B), write the true state on an index card, seal it, and stick it to the board—unopened until the final debrief. Use your deck of cards to assign private signals: red suits (Hearts/Diamonds) signal Option A, black suits (Spades/Clubs) signal Option B. Shuffle the deck openly and have each student draw one card face-down. This card is their private signal—but its accuracy depends on a reliability tier you assign. Use dot stickers to denote tiers: no sticker for low reliability (e.g., 51%), one color (say, green) for high reliability (e.g., 85%), and another (yellow) for very low reliability (e.g., 45%). Assign tiers by pre-announced rules (e.g., "If your card is a 2–10, no sticker; Jack-Ace, green sticker"). This lets you control reliability on the fly by changing sticker rules per round. Voting uses index cards: students write A or B, fold them, and deposit them in a central envelope. Tally votes openly on the board, using dot stickers to mark correct/incorrect group outcomes later. The "payoff" is collective epistemic points: after revealing the true state per round (flip a coin live if needed, but use your pre-sealed truth for key rounds), award the group a green dot sticker on a scoreboard if the majority was correct, red if wrong. Stress that points reflect group success, not individual performance, to avoid ego-driven choices.

  **Sequence of Rounds (65–70 minutes):**  
  1. **Baseline: Barely better than chance (10 min).** Assign all low-reliability signals (51% accuracy). Have students draw cards, apply no stickers (tier: 51% accurate). Vote simultaneously in secret. Tally: with 19 voters (you + 18), majority will be correct ~55–60% of the time—barely better than a coin flip. Reveal truth (open your pre-sealed envelope or flip a new coin). Point: group barely improves on individuals.  
  2. **Flipped reliability: Confidently wrong (10 min).** Use same true state as round 1 (reseed if needed). Assign very low reliability (45% accuracy): no stickers, but interpret signals inversely (e.g., red suit now signals B, black signals A). Vote simultaneously. Tally: majority will be wrong ~60–65% of the time. Reveal truth. Point: same aggregation, but below-chance competence flips outcomes, making groups worse than individuals.  
  3. **Public signal: The ceiling effect (10 min).** New true state (flip coin, reseal). Assign low reliability (51%) privately via cards. Then add a public signal: project a blurry image (e.g., a pixelated flag) that’s 60% accurate—say it’s "weak evidence for A" if true state is A. Vote simultaneously. Now tally and reveal truth: error rate stays high (~35–40%) despite more voters (simulate adding voters by including your vote or a phantom). Run a second identical vote with "5 new voters" (you assign extra signals to volunteers), but error rate won’t drop much. Point: shared evidence creates common errors; adding voters doesn’t help.  
  4. **Sequential dependence: Mechanism matters (15 min).** Use the same true state and private signals as round 1. Instead of secret voting, have students vote aloud in random order (draw playing cards for sequence). First voter states choice and brief reason (e.g., "My signal was A"). Later voters hear all prior votes. Tally aloud. Likely, early voters anchor the group, leading to herding and a different outcome than round 1. Reveal truth. Point: same people, same information, opposite result—independence is fragile.  
  5. **Expert vs. crowd: Fixed budget trade-off (10 min).** New true state. Assign two students high-reliability signals (green stickers, 85% accuracy); others get very weak signals (yellow stickers, 51%). Announce: "You can vote A/B, or abstain to defer to specialists." Tally votes, but only count non-abstentions. Reveal truth. Likely, many abstain, but specialists might be wrong. Discuss: Was it better to have many weak signals or few strong ones? Point: Condorcet assumes uniform competence; here, competence is scarce.  
  6. **Asymmetric costs: Supermajority threshold (10 min).** New true state. Frame as a trial: "Option A is acquit, B is convict. A false conviction (wrong B) is 5x worse than a false acquittal (wrong A)." Assign low reliability (51%). Vote simultaneously, but require a supermajority to convict (e.g., 14/18 for B). Tally: even if majority favors B, conviction may fail. Reveal truth. Point: Aggregation rules (e.g., supermajority) can handle cost asymmetries, not just epistemic caution.  

  **Debrief (20–25 min):** Open the initial truth envelope to verify rounds. Map moments to Condorcet:  
  - Rounds 1–2 exposed **competence** (p > 0.5 improves group accuracy; p < 0.5 harms it) and highlighted how seminar-sized N (e.g., 19) is far from the asymptotic "certainty."  
  - Round 3 broke **independence** via the public signal, causing error stagnation—the theorem fails when errors correlate.  
  - Round 4 showed how **voting order** creates dependence, altering outcomes without new information.  
  - Round 5 challenged **uniform competence**; your "hobbyhorse" (yes, I’ll flag it as such) about attention budgets contrasts with Condorcet’s fixed-signal assumption—here, investing in few good signals *might* beat many weak ones, but specialists can err.  
  - Round 6 separated **epistemic vs. practical rationality**: supermajorities handle unequal costs, but don’t inherently make truth-tracking better.  
  Finally, name the theorem. Stress that its mechanism relies on strict, interdependent assumptions. Contested points: real electorates rarely satisfy independence or uniform competence (e.g., media creates common signals; education varies). Some argue this undermines democratic legitimacy; others say it merely clarifies when crowds are wise.  

  **Predictable Problems and Fixes:**  
  - **Cheating/leaking signals:** A student might peek at a neighbor’s card or whisper. *Fix:* Use envelopes for private signals; warn that leaking "taints" group epistemology. If it happens, confess it mid-activity: "Someone shared—now our errors are dependent, like round 3."  
  - **Sequential herding:** The first speaker dominates, anchoring others. *Fix:* Randomize speaking order secretly (draw cards from a hat). If still skewed, note how confidence or status amplifies anchoring.  
  - **Unlucky outcomes:** In round 1, majority could be wrong despite p>0.5 (∼40% chance with N=19, p=0.51), implying "crowds are dumb." *Fix:* Pre-run probabilities; if luck fails, say, "This *should* happen sometimes—what does it imply about small groups?"  
  - **Shuffling doubts:** Students may distrust your deck. *Fix:* Have a student shuffle and cut cards publicly each round.  
  - **Expert round indecision:** Students might refuse to abstain, voting randomly. *Fix:* If <30% abstain, contrast with round 1: "Did we underuse specialists?"  
  - **Total failure:** If a key round flops (e.g., sequential matches simultaneous), use it: "Why might independence hold here? Was it luck or genuine reasoning?"  

  **What the Activity Can’t Show:**  
  - **Convergence to certainty:** With N=19, you can’t demonstrate the limit. *Debrief remedy:* "With p=0.51, we need thousands to approach certainty—but real groups rarely scale without new assumptions."  
  - **Endogenous signal acquisition:** Voters here don’t choose to get signals; they’re given. *Acknowledge:* "Condorcet ignores *how* signals are produced—but in reality, acquiring good signals costs attention or money."  
  - **Continuous competence:** Competence here is binary (tiers), not a smooth distribution. *Acceptable trade-off:* Tiers suffice to challenge uniformity.  

  **Contested vs. Settled:**  
  - *Settled:* The arithmetic (with p>0.5, independence, uniformity, majority rule lifts group accuracy; violating these breaks it).  
  - *Contested:* Whether any real electorate satisfies these (e.g., polarization breaks independence; inequality breaks uniformity). Normative implications are also disputed—e.g., whether Condorcet "saves" democracy or reveals its fragility.  
  Your budget framing *is* a hobbyhorse (a good one!), as Condorcet assumes fixed competence; linking it to resource allocation extends beyond the theorem.  

  This fits your constraints: materials are used fully; no cash prizes; discovery precedes theory. Run it as a tight narrative—"we’re building a truth machine, but parts keep breaking"—and they’ll feel the assumptions in their bones.
