prompt: |-
  We did the anti-luminosity argument in my epistemology seminar this week (Williamson's, I think: knowledge needs a margin for error, so for any condition there's a case where you're in it but arbitarily close to a case where you aren't, and there you can't tell the difference — so no interesting condition is luminous, where luminous means being in it always puts you in a position to know you're in it). The moral I walked out with seemed obvious enough: we basically never know our own mental states, and introspection is just a dodgy inward sense, no better than eyesight in bad light. My study partner says that's way too strong and that the argument doesnt touch first-person authority at all, but she can't say why, and now I'm not sure which of us is embarrassing themselves more.

  Second thing, my own attempted rescue for pain specifically: pain isn't like looking red, which shades off continuously into orange. Either it hurts or it doesn't. So the gradual chain the margin argument runs on shouldn't get a grip on pain at all. Is that right, or does the argument still work when the underlying intensity varies continuously but the condition itself has a sharp cutoff?

  Sections please: Where I go wrong (~1 paragraph), What anti-luminosity actually shows (~2 paragraphs), The sharp-cutoff rescue for pain (~2 paragraphs), The question I should be asking instead (~3–4 sentences). American English, and please don't hedge everything into mush: tell me which step of my reasoning is the fatal one.
