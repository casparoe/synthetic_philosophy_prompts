  We are presented with a paradox in anthropic reasoning. The argument leads to a conclusion that seems absurd: that we can arbitrarily boost the probability of any hypothesis by adding undetectable duplicates, making our actual evidence irrelevant. We are to find which step is faulty and what the costs of rejecting it are.

  The steps are:

  (1) Self-indication: Existing is evidence for hypotheses with more observers, proportional to the number of observers.

  (2) Conditionalization: When we conditionalize on our total evidence E, we boost by the number of observers who have E, not the total number.

  (3) Because the echo minds (in H2) have E by construction, H2 is favored by a factor of about 10^19 (since 10^30 echo minds plus 10^11 organic, but the organic are negligible in the ratio).

  (4) This boost is arbitrary and can be applied to any hypothesis by adding duplicates.

  (5) Therefore, what we believe is a race between the prior simplicity and the number of duplicates we can add.

  (6) This makes evidence irrelevant, so (1) must be false.

  We are to reject one step. Let me analyze each step.

  First, note that self-indication is a feature of the Self-Indication Assumption (SIA). The Self-Sampling Assumption (SSA) is an alternative. SSA says: sample an observer at random from the set of all possible observers (in some reference class) and use that to condition. SIA says: weight hypotheses by the number of observers they contain.

  Step (1) is the core of SIA. Step (2) is standard Bayesian conditionalization. Step (3) seems to follow: if we have evidence E, then we condition on the fact that we are an observer with E. In H2, there are about 10^30 observers with E (the echo minds) and in H1, only 10^11. So the ratio of the likelihoods (the probability of observing E given the hypothesis) is about 10^30 / 10^11 = 10^19 in favor of H2.

  But note: in H1, there are 10^11 observers with E. In H2, there are 10^11 organic observers with E and 10^30 echo minds with E, so total 10^30 (approximately) observers with E. So the likelihood ratio is indeed about 10^30 / 10^11 = 10^19.

  Step (4) says that we can do this for any hypothesis. For example, take a hypothesis H that we normally think is disconfirmed by evidence. We can create H* which is H plus a huge number of undetectable duplicates that have E. Then, by the same reasoning, H* would be boosted by a huge factor.

  Step (5) says that the prior of H* (which might be lower because it's more complex) is competing with the huge boost from the duplicates. If we can make the number of duplicates arbitrarily large, then even a very low prior can be overcome.

  Step (6) concludes that this makes evidence irrelevant, which is unacceptable, so we must reject (1).

  But what about the standard cases for SIA? For example, in the Sleeping Beauty problem, SIA gives the 1/3 answer. In the Adam-and-Eve problem, it avoids flip-flopping. So rejecting SIA would mean we have to handle those cases differently.

  Alternatively, we might reject step (3) or step (4). How?

  One possibility is to question whether the echo minds are really observers with E. They are defined to have the same subjective experiences. But note: they are in causally sealed regions. They are not real in the same sense? But the argument stipulates that they are minds and that they have E.

  Another idea: the reference class. Perhaps the echo minds are not in the same reference class? But step (3) says they have E, and E is our total evidence. So if the reference class includes any observer with E, then they are included.

  Self-Sampling Assumption (SSA) typically uses a reference class. The problem is that the reference class is vague. The friend says that step (4) can be rerun for SSA by manipulating the reference class. So if we include the echo minds, then H2 has more observers in the reference class (with E) and is favored. If we exclude them, then H2 doesn't get the boost. But how do we decide the reference class?

  The argument claims that nothing in self-sampling tells you which reference class to use, so we can still gerrymander by including or excluding.

  But perhaps we can fix the reference class? For example, by physical properties? The echo minds are defined to be physically different (they arise in rare causally sealed regions) but subjectively identical. So if we define the reference class by physical properties, we might exclude them. But then we have to justify that.

  Alternatively, we might use the concept of "observer-moments" and note that the echo minds are not connected to our world. But the argument says they are subjectively identical.

  I think the step that is faulty is step (2) as applied in step (3). Why?

  Step (2) says: conditionalizing on E means boosting by the number of observers who have E. But note that in SIA, the probability of existing as an observer with E is proportional to the number of such observers. However, in the case of the echo minds, they are not just any observers with E — they are duplicates of you. But in SIA, every observer is equally weighted. So if there are more observers with E, then it is more likely that you are one of them.

  But here's the catch: the echo minds are defined to be subjectively identical to you. However, in H2, there are two kinds of observers with E: the organic ones and the echo ones. But you, the one reasoning, are having the experience E. How do you know which one you are? You don't. So in H2, it is more likely that you are an echo mind because there are so many more of them.

  But then, if you are an echo mind, then the world you are in is not real? But the echo mind's experiences are by definition identical to yours. So you cannot tell. However, the hypothesis H2 says that there are organic minds and echo minds. The organic minds are in a real world, while the echo minds are in a simulated or disconnected world. But your evidence E does not tell you which you are.

  So when we conditionalize on E, we are saying: what is the probability of H1 vs H2 given that I exist and have evidence E.

  But note: in H1, the only way to have E is to be one of the organic observers. In H2, you could be an organic observer or an echo mind.

  So let me compute the probabilities.

  Let P(H1) = P(H2) = 1/2 (by the initial setup).

  Under SIA, the prior probability of being an observer in a world is proportional to the number of observers times the prior of the world.

  But we can use Bayes' theorem.

  We want P(H1 | E) and P(H2 | E).

  P(E | H1) = probability that you exist and have E given H1.
  In H1, there are 10^11 observers with E. But we must also account for the fact that under H1, the only observers are the organic ones. So if H1 is true, then the probability that you are one of the observers with E is 1 (since all have E) but we must also account for the fact that you exist at all.

  In anthropic reasoning, we typically use the SIA prior: the prior probability of being in a world is proportional to the number of observers in that world.

  So the prior for being in H1 is proportional to (number of observers in H1) * P(H1) = 10^11 * (1/2)
  Similarly, for H2: (10^11 + 10^30) * (1/2) ≈ 10^30 * (1/2)

  So the ratio of priors (under SIA) for being in H2 vs H1 is about 10^19.

  But we also have to condition on E. However, in both worlds, all the observers (in H1) or all the organic and echo minds (in H2) have E. So conditional on being in H1, you have E with probability 1. Similarly for H2. So conditioning on E doesn't change the ratio.

  Therefore, P(being in H2 | E) / P(being in H1 | E) = [P(being in H2) * P(E|being in H2)] / [P(being in H1) * P(E|being in H1)] = [10^30 * 1] / [10^11 * 1] = 10^19.

