  So step (3) seems correct under SIA.

  But now step (4) is the problem: we can add such duplicates to any hypothesis. So if we have a hypothesis H that we have evidence against, we can create H* by adding a huge number of undetectable duplicates. Then under SIA, H* gets a huge boost.

  This seems to be a problem for SIA.

  But note: when we add duplicates, we also change the hypothesis. The new hypothesis H* is more complex because it postulates extra entities. So in the prior P(H*), we might assign a lower probability because of complexity. However, the boost from the duplicates is multiplicative and can be arbitrarily large. So if we can add arbitrarily many duplicates, then even a very complex hypothesis can be made arbitrarily probable.

  This is the problem.

  So how do we avoid this?

  One way is to reject SIA. Then we don't get the boost. But then we lose the 1/3 answer in Sleeping Beauty.

  Another way is to restrict the set of observers that count. For example, we might say that only observers that are "real" in some sense count. But the echo minds are defined to be real minds, just in causally sealed regions.

  Or we might say that the duplicates must be causally connected to us? But the echo minds are causally sealed.

  But then we have to define what counts as an observer for SIA.

  Perhaps we can use the concept of "information" or "causal connection". If the duplicates are causally disconnected, then they are not in the same reference class? But the problem is that they are subjectively identical.

  Alternatively, we might note that in H2, even though there are many observers with E, they are not all in the same universe in the sense that they are not interacting. But the argument does not require interaction.

  I think the issue is that SIA, as stated, leads to this problem. Therefore, we must either abandon SIA or find a way to restrict it.

  Let's consider step (2). Step (2) is about conditionalizing on E. But note that E is our total evidence. What does E include? It includes that we are having this particular stream of experiences. But the echo minds are having the same stream. However, they are not in the same world. But why does that matter?

  In H1, there is one world with 10^11 observers. In H2, there is the same world plus many causally sealed regions with one echo mind each. So when we say "I exist and have E", in H2 there are many more individuals having E. So if we are to choose an observer at random from all possible observers, we are more likely to be in H2.

  But note: the problem is that if we accept this, then we can never be confident about the nature of the universe because there might be arbitrarily many duplicates in causally sealed regions.

  This is the Boltzmann brain problem in cosmology. Boltzmann brains are random fluctuations that produce brains with false memories. In some cosmological models, the number of Boltzmann brains can exceed the number of real brains, so we should think we are Boltzmann brains. But that is absurd.

  The standard response to the Boltzmann brain problem is to reject models that predict too many Boltzmann brains because they are self-undermining: if the model predicts that most observers are Boltzmann brains, then the model was formed by a Boltzmann brain and is unreliable. But that's a different argument.

  In this case, we don't have the self-undermining because the echo minds are not random; they are stipulated.

  So what is the solution?

  I think the step that we should reject is step (1): self-indication. But then we lose SIA.

  But let's see if we can keep SIA by modifying it.

  Another idea: in step (3), we conditionalize on E, but E is not just that we have certain experiences; it also includes that we are in a world that is coherent. The echo minds are in causally sealed regions, so they are isolated. But the evidence E does not include that we are in a coherent world? Actually, the echo mind's world is coherent by construction: they have the same apparent memories and apparent coherence.

  So that doesn't help.

  Perhaps we should use the self-sampling assumption with a specific reference class. The friend says that SSA doesn't escape because we can argue about the reference class. But maybe we can fix the reference class to be "observers in the actual universe" or "observers that are embodied in galaxies". Then the echo minds are not included because they are not in the actual universe (they are in causally sealed regions) and are not embodied in galaxies.

  But the problem says that the echo minds are defined to be minds that arise in causally sealed regions. So they are not in the same physical setting. So we can exclude them by reference class.

  But then we have to justify why we choose that reference class.

  In the standard SSA, the reference class is often taken to include all conscious beings. But we can restrict it to beings that are in our universe and causally connected.

  However, the echo minds are in the same universe? They are in causally sealed regions of the same universe. So they are in the same universe but not causally connected.

  The problem doesn't specify the details. It says "causally sealed regions". So they are in the same universe but disconnected.

  In that case, if we define the reference class as all observers in the universe, then the echo minds are included.

  But we might define the reference class as all observers that are embodied in galaxies. Then the echo minds are not embodied in galaxies; they are in sealed regions. So they are excluded.

  But what if we don't know that? The problem says: "nothing you could ever observe, do, or discover would tell you whether you are one of them." So if you are an echo mind, you think you are embodied in a galaxy. So your evidence E includes that you are embodied in a galaxy. But in reality, if you are an echo mind, you are not.

  So when we conditionalize on E, we are conditionalizing on the content of our experience, which includes the apparent fact that we are embodied in a galaxy. In H1, all observers with E are actually embodied in galaxies. In H2, there are two types: the organic ones (embodied) and the echo ones (not embodied). But the echo ones have the experience of being embodied.

  So our evidence E includes: "I have the experience of being embodied in a galaxy." But not necessarily that I am actually embodied.

  So when we compute P(E | H2), we have two groups: the organic ones (who are embodied) and the echo ones (who are not embodied but have the experience). So if we are in H2, what is the probability that we have the experience E? All observers in H2 have the experience E by construction. So P(E | H2) = 1. Similarly for H1.

  So that doesn't help.

  But note: the reference class for SSA might be defined by experiences. But then the echo minds are included.

