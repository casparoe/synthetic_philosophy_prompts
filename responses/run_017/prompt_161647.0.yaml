  Looking at the five given verdicts: Cases 1 (lottery) and 2 (monograph) were deemed not criticizable, while 3 (short paper with base rate), 4 (bare fallibility), and 5 (audit check) had mixed outcomes. Case 5 is particularly interesting - the audit check made it not criticizable despite the high number of claims. 

  The key distinction seems to be between external evidence versus internal calculation. Cases 1, 2, and 5 all involve some external grounding (lottery mechanics, publishing base rates, audit result), while 3, 4, and possibly 7 rely on the subject's own probabilistic reasoning. Case 3 was criticizable when the base rate was weak relative to individual confidence, and case 4 was outright rejected for lacking evidence.

  For my prediction: Case 6 has an external study (70% error rate for similar reports) but only 20 claims at 0.99 each. This resembles case 3 which was criticizable, though the error probability is higher here (30% vs 70%). I think the seminar leader will still find it criticizable because the external evidence isn't strong enough to override high per-item confidence in a small set. The error-claim should go.

  Case 7 involves pure internal calculation - multiplying probabilities to get 2% chance of perfect accuracy. This directly parallels the bare fallibility rejection in case 4. Despite the large number of claims, the lack of external evidence should make this criticizable, with the error-claim being rejected.

  The core rule appears to be: "The error-belief requires independent evidence beyond aggregation of individual credences." This fits all five cases and cleanly handles 6 and 7. The seminar leader is distinguishing between genuine evidence of error versus mere recognition of cumulative uncertainty.

  If this doesn't resolve it, I'd suggest testing with a case that pits strong external evidence against very high per-item confidence. For example: A 10-claim report with each claim at 0.999 confidence, plus an audit with 0.999 reliability detecting an error. If she calls this not criticizable, it confirms evidence trumps aggregation; if criticizable, my model is wrong.

  My confidence is high (90%) on case 7 matching case 4's logic. For case 6, I'm less certain (75%) because the 70% error rate might sway her, but the parallel to case 3 suggests not.
answer: |-
  **Bottom line:** Your seminar leader's rule requires independent evidence for the error-belief that isn't merely aggregating individual credences; case (6) will be deemed criticizable (error-claim goes), and case (7) will be deemed criticizable (error-claim goes).

  **Candidate Rules & Predictions for (6)/(7):**
  | Rule Description                     | (1) | (2) | (3) | (4) | (5) | Predicts (6)       | Predicts (7)       |
  |--------------------------------------|-----|-----|-----|-----|-----|--------------------|--------------------|
  | **1. External Base Rate Threshold**  | ✓   | ✓   | ✗   | ✗   | ✓   | Criticizable (go)  | Criticizable (go)  |
  | *Requires external error-rate source; rejects if rate too low or absent.* |     |     |     |     |     |                    |                    |
  | **2. Aggregate Risk ≠ Evidence**     | ✓   | ✓   | ✓   | ✓   | ✓   | **Criticizable (go)** | **Criticizable (go)** |
  | *Rejects error-belief if based only on conjoining individual credences.* |     |     |     |     |     |                    |                    |
  | **3. Audit Overrides Aggregation**   | ✓   | ✓   | ✗   | ✗   | ✓   | Criticizable (go)  | Criticizable (go)  |
  | *Only external audits justify error-belief; base rates insufficient for small n.* |     |     |     |     |     |                    |                    |

  **Definite Predictions & Reasoning:**  
  - **Case (6): Criticizable; the error-claim must go.** Confidence: 80%.  
    This mirrors (3): an external base rate (70% error) conflicts with high per-claim confidence (0.99). (3) rejected a 30% error-rate for 12 claims; here, 20 claims at 0.99 have ~18% chance of perfect accuracy, but the 70% error-rate is weaker than (2)’s monograph base rates. Her verdict in (3) shows base rates alone don’t suffice for small-to-moderate n when individual evidence is strong. The time-pressure study is external but still statistical, not audit-like.  

  - **Case (7): Criticizable; the error-claim must go.** Confidence: 95%.  
    This directly parallels (4): the error-belief rests solely on aggregating individual credences (0.99⁴⁰⁰ ≈ 0.02). (4) rejected a bare appeal to fallibility; (7) is just a quantified version. Her (4) verdict shows that self-generated aggregation isn’t independent evidence. The rule in (2) and (5) implies error-beliefs require *external* or *procedural* justification (e.g., lotteries, base rates, audits), not internal calculation.  

  **The Actual Rule:**  
  She uses **Rule 2: Aggregate Risk ≠ Evidence**. The error-belief must be justified by *independent evidence* (external base rates, audits, or structural facts like lotteries), not conflation of individual credences. This fits all cases:  
  - (1)/(2)/(5): Error-belief has independent support (lottery structure, publishing stats, audit).  
  - (3): Base rate exists but is weak evidence against strong individual warrants for small n.  
  - (4): No independent evidence; only fallibility.  
  - (7): Pure aggregation is not independent evidence.  
  - (6): Like (3), the base rate is independent but insufficient against per-item confidence.  

  Rule 2 beats others by cleanly explaining (3) and (4): she distinguishes *evidence of error* from *aggregated uncertainty*. Rule 1 fails as (5) has no "base rate" but uses an audit. Rule 3 overfits (5) without explaining (2)’s validity.  

  **Test Case if Unresolved:**  
  Propose: *A subject with 10 individually verified claims (each 0.999 confidence) who runs an audit detecting errors with 0.999 reliability; it returns positive. She believes each claim and that one is false.*  
  - **If she deems this *not* criticizable**, Rule 2 holds (audit is independent evidence).  
  - **If criticizable**, Rule 3 is likely (she might reject audits for very high per-item confidence).  
  This tests whether procedural evidence (audit) overrides strong individual warrants when n is small.
