prompt: |-
  I got roped onto the conduct committee of my housing co-op last fall (28 units, we rotate, two-year terms, and I somehow ended up chairing it this spring) and I need something I can actually run, not theory. Here's the setup: members file written complaints against other members about shared-life stuff — noise, missed chore shifts, common-room hogging, dishes, the group chat, bikes in the hallway. We meet one evening a month, read the pile, and we either dismiss, mediate, or sanction (a formal letter, and in bad cases loss of common privileges). Any sanction needs a two-thirds vote plus a one-page written rationale that goes to both parties and gets read out at the next house meeting, and anyone can appeal to the whole co-op at the AGM. Nobody on the committee has any philosophy background, we've got about three hours and no budget, and whatever we write has to be readable by an angry neighbour at 10pm.

  The thing I keep geting stuck on is hypocrisy, and specifically whether someone who does the same thing themselves has any standing to complain at all. We've been informally applying a "clean hands" thing — if you've done it too, your complaint gets tossed — and its obviously doing damage. It's become the first move for anyone who wants their case dropped, the members who are held to the highest standard most often lose their complaints, and last month we dismissed a noise complaint against a guy who has been making everyone's life miserable for a year because the complainant once threw a loud party. Then there are the versions I can't handle at all: half the time the person didn't do the same thing, they did a neighbouring thing (they hoard the common room but are complaining about dishes); or they did it two years ago and genuinely stopped; or they openly admit what they did versus being in total denial about it; or they're complaining on behalf of someone else who is completely clean; or the complaint is about how they personally were treated versus about how the house is running. And then there's us — the committee — which has ignored this exact category of behaviour when the person doing it was popular. I want to know whether that's even the same question or whether I'm confusing two different things.

  So: please write me a decision procedure, in plain language, that my committee can run on a complaint in about fifteen minutes and that tells us when a complainant's own conduct defeats or weakens their complaint and when it's just noise we should ignore. It should say what order to ask things in, what counts as an adequate answer to each question, where we stop and dismiss, and where the procedure has to hand the decision to a person because it's a question about what kind of house we want to be rather than a matter of fact. Please be explicit about which distinctions it has to preserve — I suspect "they don't really believe the norm," "they have no right to hold you to it," and "the complaint is true and apt but they shouldn't be the one saying it" come apart, and I suspect "did the same thing" is the wrong test in at least three different ways, but you tell me which ones. Also tell me what to do when we can't tell whether two bits of conduct are the "same" norm violation, and whether a complainant can get standing back by owning what they did.

  Then run it on three cases, and I want at least one to come out in a way I will hate, because I'd rather find that out now than at a house meeting. One: a member with four months of missed chore shifts files against a member who missed two. Two: a member who is a notorious common-room hoarder files a documented complaint about someone leaving dirty dishes in the sink for a week — different rule, same family of sloppiness. Three, the one I expect to dislike: a founding member who was repeatedly noisy in 2023 and was never sanctioned, because the committee that year let it slide, now files a strong and well-documented noise complaint against a newer member, and the target's entire defense is "look at what she did." For that one I want to know both whether her complaint stands and whether we as a committee have any business sanctioning anyone for noise given our own record, and if those are two separate questions please say so and say which one we should answer first. Finally, be honest about where the procedure is philosophy dressed up as a checklist, which steps are really us choosing what to value, and what it just can't settle.
reasoning: |-
  Okay, let me start by really understanding what this housing co-op conduct committee chair is dealing with. They need a practical decision procedure, not theory, for handling complaints where hypocrisy or "clean hands" is causing problems. The current approach of dismissing complaints if the complainant has done similar things is backfiring—it's letting repeat offenders off the hook and creating unfair outcomes.

  First, I need to unpack why "clean hands" fails here. The user mentions cases where violations aren't identical (common room hoarder complaining about dishes), past vs present behavior, or when the complaint is about personal harm versus community standards. There's also committee bias—ignoring violations by popular members. The core confusion seems to be between several distinct concepts: legitimacy of the norm, standing to complain, and the committee's moral authority to enforce. 

  The user's examples highlight key flaws in their current system:
  - Case 1: A chronic chore-skipper complaining about occasional misses—this tests whether violation severity matters.
  - Case 2: Different-but-related violations (hoarding vs dishes)—here the "same thing" test clearly fails.
  - Case 3: Historical committee inconsistency—this implicates the committee's credibility.

  For a functional procedure, I need to decouple three questions: 
  1. Is the alleged violation real and serious? (Factual merit)
  2. Does the complainant's behavior block their complaint? (Standing test)
  3. Can the committee fairly adjudicate? (Procedural integrity)

  The standing test should focus on ongoing patterns, not past slips. Severity and frequency matter—someone who constantly breaks norms shouldn't weaponize them against others. But minor or reformed offenders? Their complaints might still be valid. Also, complaints about direct harm (e.g., "this noise kept me awake") should bypass standing checks entirely—personal rights trump "clean hands."

  For committee bias: they must confront past inconsistencies upfront. If they've ignored violations, they need to either apply sanctions retroactively (messy) or reset expectations transparently. The procedure should force this reckoning.

  Now structuring the checklist:
  - Start with harm assessment to prioritize cases.
  - Then check standing only if the complaint is about general violations (not personal harm). Key questions: is the complainant currently violating the same norm? If not, is it a pattern of related disregard?
  - Owned/reformed behavior? Standing returns.
  - Finally, committee must confront its own inconsistency—if found, pause and address via house meeting.

  For the cases:
  Case 1: Chronic offender vs minor violation. Standing fails—complaint dismissed unless about direct impact. Important: the chronic offender should face separate sanctions!
  Case 2: Different norms. Standing stands—but note hypocrisy in rationale. Sanction likely.
  Case 3: Tricky. Complainant's past behavior is irrelevant (stopped/reformed), but committee's inconsistency is poison. Must publicly address past failures before enforcing noise rules. Complaint stands, but committee legitimacy is shaky.

  The uncomfortable truth: the procedure exposes that "clean hands" was a distraction from the real issue—the committee's selective enforcement. Philosophy sneaks in at the ownership/reform step (forgiveness ethics) and the committee accountability piece (restorative justice). It can't fix deep community trust issues—that requires a house meeting reset.

  User will hate Case 3 outcome: the complaint is valid, but the committee looks hypocritical enforcing it. That's intentional—the procedure forces them to clean their own house first.
answer: |-
  Here’s a concrete, step-by-step decision procedure for your committee—designed for speed, fairness, and minimal philosophy jargon. It explicitly rejects "clean hands" as a dismissal rule and replaces it with targeted questions about **standing** (who gets to complain), **harm** (what matters most), and **committee integrity** (your own baggage).  

  **Core Principles Behind the Procedure**  
  1. **Hypocrisy ≠ Invalid Complaint**: A rule-breaker can still be right about a violation. Focus on whether the *current complaint is valid*, not whether the complainant is a saint.  
  2. **Three Key Distinctions**:  
     - **"They broke the norm too!"** → This challenges *standing* (their moral right to complain), not the *truth* of the complaint.  
     - **"They don’t believe the norm!"** → This is about *sincerity* (irrelevant if the rule exists).  
     - **"The committee is inconsistent!"** → This is about *your legitimacy*, not the complaint’s validity.  
  3. **"Same Violation" Test is Flawed**: Severity, intent, recency, and impact matter more than technical sameness.  

  ---

  ### **The Complaint Assessment Checklist**  
  *(Run in order—stop and act if any step resolves the issue.)*  

  **STEP 1: THE HARM TEST** (3 min)  
  *Ask: "Does the alleged behavior, if true, violate a co-op rule AND cause actual harm (disruption, unfairness, safety risk)?"*  
  - **YES** → Proceed to Step 2.  
  - **NO** → **Dismiss immediately**. No need to discuss the complainant.  
  - **UNSURE** → Investigate briefly (e.g., ask for photos, logs, witnesses). If still unclear, dismiss.  

  **STEP 2: PERSONAL HARM EXCEPTION** (2 min)  
  *Ask: "Is the complainant directly, personally harmed (e.g., kept awake by noise, unable to cook due dishes)?"*  
  - **YES** → **Proceed to mediation/sanctions**. Standing doesn’t matter—personal harm trumps hypocrisy.  
  - **NO** (e.g., "They’re breaking house rules!") → Proceed to Step 3.  

  **STEP 3: STANDING CHECK** (5 min)  
  *Ask: "Is the complainant *actively and seriously* violating the **same or closely related norm** *right now*?"*  
  - **What counts as "same or closely related"?**  
    - **Same norm**: Identical rule (e.g., both missed chores).  
    - **Closely related**: Same core value (e.g., hoarding common space vs. hoarding sink space—both "disregard for shared property").  
    - **NOT related**: Dishes vs. noise, chore misses vs. chat rudeness.  
  - **What counts as "active and serious"?**  
    - Ongoing/repeated pattern (e.g., misses chores monthly).  
    - Not: A one-time incident, minor issue, or past violation they’ve owned and stopped.  
  - **DECISIONS**:  
    - **YES** (they’re actively doing the same/similar) → **Dismiss complaint** *but* open a new case against the *complainant* for their violation.  
    - **NO** → Proceed to mediation/sanctions.  
    - **UNSURE** (e.g., "Is hogging the TV like leaving dishes?") → Skip to Step 4.  

  **STEP 4: "REFORMED HYPOCRITE" CHECK** (3 min)  
  *Ask: "Did the complainant break this norm in the past but has since stopped, apologized, or made amends?"*  
  - **YES** → Their standing is **restored**. Proceed to mediation/sanctions.  
  - **NO** (they’re unrepentant/repeat offenders) → **Dismiss complaint** and open a case against *them*.  
  - **UNSURE** → Give complainant 24 hours to provide evidence of reform (e.g., chore logs, apology messages). If none, dismiss.  

  **STEP 5: COMMITTEE INTEGRITY CHECK** (2 min)  
  *Ask: "Have we (the committee) consistently enforced this rule in similar past cases?"*  
  - **YES** → Proceed to mediation/sanctions.  
  - **NO** (e.g., we ignored popular people) → **Pause the case**. Bring it to the *next house meeting* for public debate/vote. Do NOT sanction unilaterally.  

  ---

  ### **Where Philosophy Hides in the Checklist**  
  - **Step 3**: "Closely related norm" requires judging shared values (your co-op’s priorities).  
  - **Step 4**: "Reformed hypocrite" assumes accountability matters—this values growth over purity.  
  - **Step 5**: Forces your committee to confront bias. This is *procedural justice*, not logic.  

  **What the Procedure Can’t Fix**  
  - Deep community divisions (needs a house-wide conversation).  
  - Vague rules (e.g., "too noisy"—needs decibel limits or quiet hours).  
  - Bad faith actors (repeaters will exploit any system).  

  ---

  ### **Case Tests**  
  **Case 1: Chronic chore-skipper (4 misses) vs. occasional misser (2 misses)**  
  - **Step 1**: Harm? YES (chores undone → burden on others).  
  - **Step 2**: Personal harm? NO (it’s a general complaint).  
  - **Step 3**: Standing check: Complainant is **actively violating the same norm** (4 misses >> 2 misses → serious pattern).  
  - **Outcome**: **Dismiss complaint** against occasional misser. **Open new case** against the chronic skipper.  
  - *Why you’ll hate this*: The chronic skipper "wins" by silencing criticism—but they’re now the target.  

  **Case 2: Common-room hoarder complains about dishes left for a week**  
  - **Step 1**: Harm? YES (dishes attract pests, inconvenience).  
  - **Step 2**: Personal harm? NO (general complaint).  
  - **Step 3**: Standing check: Are hoarding and dishes "closely related"? **YES** (both show disregard for shared space/resources → same core value).  
  - **Step 4**: Is hoarder reformed? Assume NO → **Dismiss complaint**. **Open case against hoarder**.  
  - *Note*: If hoarder cleaned up their act (Step 4), their complaint would stand.  

  **Case 3: Founding member (noisy in 2023, unsanctioned) vs. new noisy member**  
  - **Step 1**: Harm? YES (noise disrupts sleep/peace).  
  - **Step 2**: Personal harm? Possibly—assume YES (e.g., "kept me awake"). If YES → standing irrelevant! Proceed to sanction new member.  
  - *But if NO personal harm*:  
    - **Step 3**: Complainant’s past noise ≠ "active" violation NOW → standing OK.  
    - **Step 5**: Committee integrity check: **FAIL** (you ignored past noise).  
  - **Outcome**: **Pause case**. Bring to house meeting with:  
    - A) The new member’s noise evidence.  
    - B) A confession: "We failed to enforce noise rules before. Should we sanction both past and present violators now?"  
  - *Why you’ll hate this*: The valid complaint is stalled due to *your* past bias. But sanctioning unilaterally would be unjust.  

  **Key Takeaway**:  
  Hypocrisy isn’t a "get-out-of-jail-free" card—it’s a separate offense. Your procedure now isolates:  
  - Whether the *complained-of act* is harmful (Steps 1–2).  
  - Whether the *complainant* forfeited their voice (Steps 3–4).  
  - Whether the *committee* has credibility (Step 5).  

  **Final Tip**: At your next meeting, propose a "rule reset": Vote to amnesty past unaddressed violations if members own them. Then enforce uniformly. Clarity beats consistency.
