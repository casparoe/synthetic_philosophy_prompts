  I'll organize this by committee member. For Priya: 1) Privileging the repair system instead of DNA, 2) Why methylation patterns don't count as information too, 3) Parity argument applied to non-genetic inheritance. For Marc: 4) How to experimentally distinguish this view, 5) Methylation-based repair contradicting an "ideal standard", 6) What predictions this theory makes. For the external: 7) Relationship to teleosemantics, 8) Type vs. token level information. Then I'll identify the circularity question as the worst-case scenario.

