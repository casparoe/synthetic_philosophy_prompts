  I need to identify the most likely and damaging objections each committee member would raise. For Priya, who is skeptical of privileging the genome, she'll likely question why the repair system isn't just another privileged reader and bring up the parity argument again. Marc, being a practical scientist, will want to know how to test this theory experimentally and might point out that current repair mechanisms rely on methylation rather than an ideal standard. The external examiner will probably probe connections to teleosemantics and whether error-correction implies proper function.

