answer: |-
  ## MEMORANDUM  
  **TO:** Progress Review Committee Members  
  **FROM:** [Your Name], Graduate Student Representative  
  **DATE:** Wednesday, [Date]  
  **SUBJECT:** Recommendation on Handling "Substantial Progress" Thresholds, Borderline Cases, and Communication for AY [Academic Year]  

  **RECOMMENDATION:**  
  For the upcoming review cycle, the Committee should:  
  1.  **Adopt a hybrid approach:** Publish **non-exhaustive, indicative criteria** for "substantial progress" within the policy framework, while retaining **holistic, case-by-case judgment** as the final arbiter.  
  2.  **Handle current borderline cases (n=6) via "Provisional Continuation with Checkpoint":** Grant continuation funding for Summer/Fall, contingent on a **mandatory progress review by their primary committee by October 1st**, with a specific, agreed-upon milestone.  
  3.  **Revise student communication:** Letters should clearly state the **decision**, the **primary reasons** based on the holistic review (referencing relevant criteria where appropriate), and **avoid language implying infallible discovery of a precise fact**.  

  **RATIONALE:**  

  Our challenge with "substantial progress" is quintessential vagueness, amplified by multidimensionality (words, chapters, prospectus, publications, data, etc.) and implicit differential weighting by committee members. The philosophical positions articulated by Dana (epistemicist-leaning) and Marcus (supervaluationist-leaning) offer valuable insights but, applied rigidly to our practical task, lead to procedural deadlock or undesirable outcomes. Our goal must be a **fair, defensible, and actionable process** that minimizes appeals while respecting the inherent complexity of doctoral work and our role as stewards of resources and standards.  

  **1. Addressing the Core Disagreement: Facts vs. Stipulation (and Finding Middle Ground)**  

  *   **Dana's View (Stated Strongly):** The phrase "making substantial progress" *does* pick out a genuine property in the world, even if its boundaries are vague. Our uncertainty arises from epistemic limitations – we lack perfect access to all relevant facts about a student's work, trajectory, and potential. Therefore, our duty is to gather *more evidence* (e.g., consulting primary committees, requesting specific updates) to reduce this uncertainty and make the most accurate judgment possible. The resulting decision reports an underlying fact, and our letters should reflect this careful investigation and the confidence (earned through diligence) that we have judged correctly. Dana fears that Marcus's approach abdicates responsibility by pretending the line is arbitrary when it is not.
  *   **Marcus's View (Stated Strongly):** "Substantial progress" is profoundly vague across multiple dimensions. There is no unique, pre-existing fact of the matter about its application in borderline cases; the concept inherently admits multiple equally admissible precisifications (weightings of criteria, thresholds). Our role is not to *discover* a hidden line but to *responsibly stipulate* one through our collective judgment, making the criteria and reasoning as transparent as possible. Applying a supervaluationist framework strictly might show that only students qualifying under *all* reasonable precisifications are clear continuations, but Marcus acknowledges this risks unacceptable false negatives. Letters phrased as "findings" mask the necessary element of choice involved and create a misleading impression of precision. Marcus fears Dana's approach risks false confidence in judgments that are, near the boundary, inherently unstable.

  **Points of Substantial Convergence:**  
  Both views demand rigorous, careful review. Both aim to minimize arbitrariness. Both agree that clear cases exist at both ends (the 20+ obvious decisions). Both reject pure randomness (like an unweighted lottery) as a primary decision mechanism. Crucially, **both implicitly accept that committee judgment is indispensable** – whether seen as uncovering facts or exercising responsible stipulation. This shared foundation is key.

  **Why Neither Pure View Solves Our Problem:**  
  *   **Dana's Challenge:** Near the boundary, gathering *more* evidence often reveals further complexities or disagreements (e.g., primary committees may themselves disagree, or new evidence may be ambiguous). Crucially, as we approach the borderline, the *reliability* of any judgment we make diminishes significantly. There are always "nearby possible worlds" where minor differences in evidence weighting, committee composition, or student circumstance would flip the outcome. Claiming knowledge-level certainty in these unstable zones is epistemically dubious and potentially unfair, inviting appeals based on the inherent instability. While there *might* be a fact, our access to it, definitively, in borderline cases under time constraints, is profoundly limited.
  *   **Marcus's Challenge:** While stipulating a single, rigid precisification (e.g., "2 chapters drafted + prospectus defended") is clean, it fails to capture the multidimensional and discipline-specific nature of progress. A strict supervaluationist "all admissible precisifications" bar would likely leave our 4 "plainly doing fine" borderline students in limbo, which is pragmatically and ethically unacceptable. Furthermore, complete stipulation risks being overly reductive, potentially punishing students whose progress manifests in non-standard but valid ways (e.g., extensive, necessary data curation before writing).

  **The Hybrid Solution: Guiding Judgment, Not Replacing It**  
  Therefore, a hybrid approach best navigates the vagueness:  
  *   **Publish Indicative Criteria:** We codify examples of what *typically constitutes* substantial progress (e.g., "Defended dissertation prospectus," "Minimum of two draft chapters submitted to advisor," "Completion of core data collection/analysis," "Submission of article for publication based on dissertation research"). **Crucially:**  
      *   State these are **illustrative, not exhaustive or strictly necessary.**
      *   Emphasize that **holistic assessment by the committee remains paramount**, considering the specific context of the project, discipline norms, and overall trajectory.
      *   **This addresses Marcus's core demand for transparency and reduced arbitrariness** by making our common reference points explicit, without pretending the list is complete or mechanical.
      *   **It accommodates Dana's valid point** that these criteria reflect real aspects of progress we are trying to track, while avoiding the false precision of a rigid threshold that might exclude valid forms of progress.
  *   **Procedural Convergence:** Both Dana and Marcus should agree that defining these criteria makes the process *more* transparent and *less* arbitrary, even if they differ on the underlying metaphysics. It provides common ground for discussion of borderline cases.

  **2. Resolving This Year's Borderline Cases (n=6): Provisional Continuation with Checkpoint**  

  Given the profound disagreement on the *nature* of the judgment near the border and the genuine difficulty of these cases:  
  *   **Immediate Withdrawal is Unjust:** Forcing a binary "Continue/Withdraw" decision based on our current, contested judgment risks significant error and guaranteed appeals.  
  *   **Unconditional Continuation is Irresponsible:** It fails our duty to ensure resources support genuine progress.  
  *   **The "Weighted Lottery" is a Non-Starter:** It introduces arbitrariness unrelated to the student's work or our judgment, satisfying neither philosophical view nor practical fairness.  

  **Recommendation:** Grant **Provisional Continuation** to all six borderline students for Summer/Fall funding. Simultaneously, impose a **Mandatory Checkpoint**:  
  *   The student must meet with their *primary dissertation committee* by **October 1st**.  
  *   Together, they must establish a **specific, concrete milestone** (e.g., "Complete draft of Chapter 3," "Submit analysis X for peer review," "Defend revised prospectus section Y") directly addressing the gap identified by the Progress Review Committee.  
  *   The primary committee reports achievement/non-achievement of this milestone to the Graduate School by **October 15th**.  
  *   **Non-achievement results in automatic withdrawal.**  

  **Why this works:**  
  *   **Avoids Unreliable Boundary Judgment:** We sidestep the epistemic/semantic quagmire for *now*.  
  *   **Fair & Action-Oriented:** It gives students a clear, focused chance to demonstrate progress on the specific concerns raised, directly addressing the "substantial" aspect.  
  *   **Leverages Local Expertise:** The primary committee is best positioned to set a meaningful, achievable milestone within the project context (addressing multidimensionality).  
  *   **Minimizes Appeals:** Students continue with a clear, short-term goal. Withdrawal only occurs if they demonstrably fail a concrete task agreed upon with their closest advisors.  
  *   **Practical:** Uses existing structures (primary committees) and provides a clear timeline.  
  *   **Convergence Point:** Both Dana and Marcus should see this as procedurally fairer and more reliable than a forced immediate binary decision under uncertainty/indeterminacy. Dana gets more evidence (future milestone); Marcus gets a clear, stipulated criterion for the *next* decision point.

  **3. Revising Student Communications: Clarity without False Certainty**  

  Letters must reflect our process accurately and respectfully.  

  *   **For Clear Cases (Continuation):** Continue stating the decision positively, citing key strengths observed (e.g., "Based on the submission of two well-developed draft chapters and successful prospectus defense, the Committee finds you are making substantial progress...").
  *   **For Clear Cases (Withdrawal):** State the decision clearly and compassionately, citing the primary deficiencies (e.g., "Based on the review, the Committee found insufficient evidence of substantial progress, noting the absence of any drafted chapters or a defended prospectus despite being in year five...").
  *   **For Borderline Cases (Provisional Continuation):**  
      > "The Committee reviewed your progress toward your dissertation. While aspects of your work show promise, the overall assessment of whether you are currently making *substantial progress* presented a significant challenge given the multidimensional nature of doctoral work and the information available at this time.  
      > **Decision:** To allow you the clearest opportunity to demonstrate the required progress, the Committee has granted **provisional continuation** of your funding for Summer/Fall [AY].  
      > **Condition:** This continuation is contingent upon you achieving the following specific milestone, agreed upon with your primary dissertation committee: **[Insert Milestone, e.g., 'Completion and submission to your advisor of a full draft of Chapter 3 by September 30th']**. Your primary committee will confirm achievement of this milestone to the Graduate School by October 15th.  
      > **Consequence of Non-Achievement:** Failure to achieve this confirmed milestone by the deadline will result in you being **required to withdraw** from the program.  
      > We strongly encourage you to meet with your primary committee immediately to plan for achieving this milestone. This checkpoint provides a focused opportunity to demonstrate the progress needed to continue in the program."

  **Why this language works:**  
  *   **Acknowledges Complexity:** Avoids simplistic "found the fact" (Dana) or "arbitrarily drew a line" (Marcus) narratives.  
  *   **Focuses on Action:** Makes the path forward clear for the student.  
  *   **Transparent about Stakes:** Clearly states the consequence of missing the checkpoint.  
  *   **Procedurally Defensible:** Grounds the *next* potential withdrawal decision in a concrete, pre-agreed failure, minimizing appeal grounds related to vagueness of the initial review.  
  *   **Convergence:** Dana can see it as gathering crucial future evidence; Marcus can see the stipulated checkpoint as a responsible precisification for the next stage.

  **Conclusion:**  

  The multidimensional vagueness of "substantial progress" resists a purely epistemicist or supervaluationist procedural fix in our practical context. By adopting indicative criteria, implementing a checkpoint system for this year's hardest cases, and revising our communication to reflect responsible judgment under uncertainty, we achieve fairness, reduce arbitrariness, minimize likely appeals, and fulfill our duty to both students and the institution. This hybrid approach draws on the valid concerns of both Dana and Marcus while providing a pragmatic path forward for Thursday's vote.  

  **Recommendation Recap:**  
  1.  Publish **non-exhaustive, indicative criteria**; retain **holistic judgment**.  
  2.  Place **6 borderline cases on Provisional Continuation with Mandatory Checkpoint (Milestone due to primary committee by Oct 1; report to Grad School by Oct 15; non-achievement = withdrawal)**.  
  3.  Adopt **revised letter templates** emphasizing the decision, key reasons, and (for provisionals) the clear checkpoint requirement.  

  I move that we vote on this package Thursday.
