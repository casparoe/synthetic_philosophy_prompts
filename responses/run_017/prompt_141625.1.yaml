     - Punter fills out two price sheets for the following tickets (which pay 100 if the event occurs, 0 otherwise):
          Ticket A: on {1}
          // We also need them to set the price for ODD on sheet 1, for the conditionalization formula, but in the above strategy, we only use the conditional prices for A.

     - Sheet 1 (prior to rolling the die):
          1. Price for a ticket on A: __________
          2. Price for a ticket on ODD: __________

     - Sheet 2 (conditional on evidence):
          // Evidence will be either "ODD" or "EVEN", and they will only be told which one.
          If told ODD:
               Price for a ticket on A: __________
          If told EVEN:
               Price for a ticket on A: __________

     - The bookie then looks at the sheets and decides on the trades.

     - The bookie worksheet will have the following instructions:

          Compute: 
             expected prior = (price in ODD col) * (price for ODD ticket from sheet 1 / 100) + (price in EVEN col) * ( (100 - price for ODD ticket from sheet 1) / 100 )

          If the sheet 1 price for A > expected prior:
               // punter is over-valuing the prior bet on A
               - At time 1: sell to the punter a bet on A (at the price they set in sheet 1).
               - At time 2: after the evidence is revealed, sell to the punter a bet on not-A. The price for the not-A bet in the evidence branch is (100 - conditional price for A in that branch).

          If the sheet 1 price for A < expected prior:
               - At time 1: buy from the punter a bet on A (at the price in sheet 1).
               - At time 2: after the evidence is revealed, buy from the punter a bet on not-A. The price for the not-A bet is (100 - conditional price for A in that branch).

          // In the buy case, the bookie is buying the bet on A and then buying a bet on not-A.

          // Then, in the first case ( sell case), the bookie's net from the punter is:
                time 1: + P
                time 2: + (100 - P_evidence)
                And the bookie will have to pay 100 if A occurs and 100 if not-A occurs, i.e., 100 always.
                So bookie's net = P + (100 - P_evidence) - 100 = P - P_evidence.

          // In the second case ( buy case):
                time 1: - P
                time 2: - (100 - P_evidence)
                And the bookie will receive 100 if A occurs and 100 if not-A occurs.
                net = -P - (100 - P_evidence) + 100 = -P + P_evidence.

          // In both cases, if the inequality holds, the net for the bookie is positive.

          Example sell case: P=20, expected prior=15, and in the evidence branch, P_evidence=30.
             net = 20 - 30 = -10 -> bookie nets -10, which is a loss for the bookie? 
          // This is the opposite of what we want.

     So we need to reverse the inequality in the strategy.

     Let me recompute the sure loss for the punter in the sell case:

          The punter has:
            - At time 1: bought a bet on A for P: which will pay 100 if A.
            - At time 2: bought a bet on not-A for (100 - P_evidence): which will pay 100 if not-A.

          So the punter's net cash: -P - (100 - P_evidence)
          and they will get 100 no matter what.

          So net for punter: 100 - [P + (100 - P_evidence)] = P_evidence - P.

          We want this to be negative, so we want P > P_evidence.

          Therefore, the bookie should do the sell-sell strategy if 
               P > P_evidence   [ but note, this is not expected prior, but we were using expected prior before]

          However, this does not involve the probability of the evidence.

     So this strategy 
          if P > expected prior: 
               do nothing? 
          if P > P_evidence in the branch that occurs: then do the trade.

     But the bookie has to commit at time 1.

  Given the complexity, I think for the activity, we will have the bookie wait until the evidence is revealed and then do the second trade if the inequality holds for the actual branch. But the diachronic book usually requires commitment at time 1 for the entire plan.

     This is not within the rules because the bookie gets to see the future prices and the evidence before decideing the second trade.

     So to keep it within the rules, we must have the bookie commit at time 1 to the second trade conditional on the evidence, but without knowing which evidence will occur.

     So the bookie must decide at time 1 to do the second trade no matter which evidence occurs.

     Then the strategy for the bookie is to do the sell-sell in both evidence branches if for both evidence branches, the conditional price P_evidence is such that P > P_evidence.
     or something.

     Given the time, I think we should use the three-way trade that I first described from the diachronic.pdf, which is: 
          - At time 1: sell bet on A.
          - At time 2: in either evidence branch, sell bet on not-A at the conditional price for not-A.

     This yields a sure loss for the punter in the sense that their net is always negative, as explained.

     And we'll live with the fact that the loss is not constant.

     So for the activity, the bookie will always do:
          Time 1: sell to punter a bet on A for P.
          Time 2: after the evidence is announced, sell to the punter a bet on not-A for (100 - P_evidence), where P_evidence is the conditional price for A in the announced branch.

     Then, regardless of the outcome, the punter will have paid P + (100 - P_evidence) for a bet that pays 100, so their net is 100 - [P + (100 - P_evidence)] = P_evidence - P.

     If P > P_evidence, then net <0.

     Similarly, if P < P_evidence, the bookie can do the opposite:
          Time 1: buy from punter a bet on A for P.
          Time 2: buy from punter a bet on not-A for (100 - P_evidence).
          Then the punter has received P + (100 - P_evidence) and will have to pay 100 no matter what, so net = P + (100 - P_evidence) - 100 = P - P_evidence <0.

     Therefore, if P != P_evidence in any branch, then in that branch the bookie can make a trade that loss for the punter in that branch.

     But note, the bookie doesn't know which branch will occur. However, if the conditional prices are set such that in some branch P_evidence < P and in another branch P_evidence > P, then the bookie cannot this: because they have to choose one strategy for all branches.

     So the bookie should only act if for all evidence branches, the conditional price is such that P > P_evidence, or for all, P < P_evidence.

     But that is not the typical case. 

     Given the time, we will assume that the only branch where the conditional price might be set wrong is the ODD branch, and in the EVEN branch the price is 0, to which we compare. 
     For example, if P=20, and in ODD branch P_evidence=10 (which is <20), and in EVEN branch=0 ( which is also<20), then the bookie can do the sell-sell strategy and in every evidence branch, the net for the punter is P_evidence - P <0.

     Similarly, if in both branches the conditional price is > P, then the bookie can do the buy-buy strategy.

     So in the activity, the bookie should check both conditional prices.
          If for both evidence branches, P > P_evidence, then do the sell-sell strategy.
          If for both evidence branches, P < P_evidence, then do the buy-buy strategy.
          If mixed, then no sure loss atrix for this method.

     Then, in the cases where it is mixed, there might be a sure loss by a different method, but we can skip that for simplicity.

     For the ticket, we only have A.

     To make it more likely that they set both conditional prices below or above the prior, we can: 
          - For the prior, we can have them set the price for A without telling them about the evidence partition until sheet 2.
          - In sheet 2, for the conditional prices, we can say "now you will be told whether it is ODD or EVEN, and then you will set the price for A at that time. You are to fill out now what you would set then."
          - Some students might in the ODD branch set the price to 1/3 of the prior for ODD, but they might not. Some might set it to 50 because they think among ODD, 1 is one possibility.

     We can also include in the ticket set a ticket on a different event, but then it becomes too complex.

   Given the time (>45 minutes of thinking) and the complexity, I think we should go with the above.
