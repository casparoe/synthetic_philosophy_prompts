  ### Diachronic Dutch Book Classroom Activity: Mechanics, Rules, and Timeline

  #### **Learning Objectives**
  1. Students experience how violating conditionalization in *update plans* (not just static beliefs) leads to exploitable inconsistencies.
  2. Students discover the "sell high now, buy back low later" arbitrage strategy.
  3. Students critically examine background assumptions (e.g., enforcement of pre-commitments, bid-ask spreads, memory) through variants.

  ---

  ### **Core Game Setup**
  - **Pairs**: Bookie and Punter (swap roles midway).
  - **Tickets (Bets)**: 
    - Ticket A: Pays 100 points if die = 1.
    - Ticket B: Pays 100 points if die = 2.
  - **Evidence Partition**: Die rolled under a cup; students told only ODD or EVEN.
  - **Probability Structure**: 
    - Fair 6-sided die (implicitly assumed by students).
    - Optimal prior: 
      - P(A) = P(1) ≈ 16.7 points,  
      - P(B) = P(2) ≈ 16.7 points.
    - Optimal conditional (e.g., if ODD): 
      - P(A|ODD) = P(1|ODD) ≈ 33.3 points,  
      - P(B|ODD) = P(2|ODD) = 0 points.
  - **Non-Conditionalizing Temptation**: 
    - Students often **under-update** (e.g., set P(A|ODD) ≈ 20, thinking "it’s still low probability") or **over-update** (e.g., set P(A|ODD) ≈ 50, fixating on "now only 3 options!").

  #### **Price Sheets**
  **Sheet 1 (Prior — Before Evidence)**  
  Punter sets prices for **both buying/selling** at these values:
  - Price for Ticket A: `______`  
  - Price for Ticket B: `______`  

  **Sheet 2 (Update Plan — Signed in Advance)**  
  Punter sets prices for buying/selling *after* learning evidence:
  |          | If Told ODD | If Told EVEN |
  |----------|-------------|--------------|
  | Ticket A | `______`    | `______`     |
  | Ticket B | `______`    | `______`     |

  #### **Bookie’s Worksheet**
  1. **Spot Inconsistencies**:  
     - Check if `P(A|ODD) ≠ P(A) / P(ODD) × 100`.  
       (Optimal: `16.7 / 0.5 ≈ 33.3`).  
     - Similarly for B, EVEN, etc.
  2. **Arbitrage Strategy**:  
     - If `P(A|ODD) < P(A) / 0.5` → **"Sell high now, buy back later"**:  
       - Time 1: *Sell* Ticket A to punter at prior price.  
       - Time 2 (after ODD): *Buy* Ticket A from punter at lower conditional price.  
     - If `P(A|ODD) > P(A) / 0.5` → Reverse: buy now, sell later.
  3. **Calculate Profit**:  
     - Profit = `[Prior price - Conditional price]` in ODD/EVEN scenarios.  
     - *Example*: Sell at 20 (prior), buy back at 10 (conditional) → Profit = 10 points.

  ---

  ### **Step-by-Step Timeline (75 Min Total)**

  | Time  | Phase                            | Activity                                                                 |
  |-------|----------------------------------|-------------------------------------------------------------------------|
  | 0-5   | Introduction & Setup             | Explain rules, distribute chips/worksheets. Assign roles (Punter/Bookie). |
  | 5-15  | **Price Setting (Punter)**       | Punters fill Sheets 1 & 2. Emphasize: "Commit to future prices now!"    |
  | 15-25 | **Arbitrage (Bookie)**           | Bookies review sheets, place Time 1 trades (buy/sell Tickets A/B).      |
  | 25-30 | **Evidence Reveal**              | Roll die; announce ODD/EVEN only.                                       |
  | 30-40 | **Conditional Trades (Bookie)**  | Bookies place Time 2 trades based on Sheet 2 prices for ODD/EVEN.       |
  | 40-45 | **Settle Bets**                  | Resolve tickets based on die outcome. Calculate bookie’s profit/loss.   |
  | 45-50 | **Role Swap**                    | Punter becomes bookie, vice versa. Repeat price setting (new sheets).   |
  | 50-75 | **Variants & Debrief**           | Run variants (a, b, c), then guided discussion.                         |

  ---

  ### **Variants to Break the Dutch Book**
  1. **Variant (a): Bid-Ask Spread**  
     - Punters set two prices:  
       - *Bid*: Price they’ll buy at (lower).  
       - *Ask*: Price they’ll sell at (higher).  
     - **Effect**: Bookies can’t force "fair price" trades. Exploits require crossing spreads → no sure loss.  
     - **Debrief Q**: "Why did spreads protect punters? How does this relate to real markets?"

  2. **Variant (b): Withdrawal Fee**  
     - Punters pay 3 points to cancel pre-signed trades after evidence.  
     - **Effect**: Bookies avoid losses (punters withdraw from bad trades).  
     - **Debrief Q**: "What does this say about enforcing pre-commitments? Is your ‘future self’ on the hook?"

  3. **Variant (c): Forgetful Punter**  
     - Sheet 2 filled by *another student* (blind to Sheet 1).  
     - **Effect**: Prices don’t cohere → bookies win randomly, not by arbitrage.  
     - **Debrief Q**: "Can Dutch books critique agents who don’t know their own future beliefs?"

  ---

  ### **Debrief & Concept Mapping**
  - **Key Moments**:  
    - **Trade Execution**: "When bookies sold high and bought back low, what did that reveal about the update plan?"  
      → *Links to diachronic inconsistency*.  
    - **Variant (b) Withdrawal**: "Why did a small fee nullify the bookie’s power?"  
      → *Highlights enforcement as a hidden assumption*.  
    - **Variant (c) Forgetfulness**: "Did bookies win because of irrationality or unpredictability?"  
      → *Distinguishes between failures of planning vs. failures of introspection*.  

  - **Diachronic Argument Exposed**:  
    - Target is **update rules**, not static beliefs.  
    - Requires **pre-commitment enforcement**, **no bid-ask spreads**, and **predictable future beliefs**.  
    - **Evidence partition is known upfront** → real diachronicity requires *unforeseen evidence* (not staged here).  

  - **Limitations**:  
    - **Evidence Not Unforeseen**: Students know ODD/EVEN upfront → misses "surprise evidence" weakness.  
    - **Points ≠ Utility**: Exploits assume linear utility (students may resent losses less).  
    - **Predictable Mistake**: Some students condition perfectly → use variants to force reflection.  

  ---

  ### **Predicted Problems & Solutions**
  - **Problem**: Students set prices optimally → no vulnerability.  
    **Fix**: Use Tickets A/B + encourage impulsiveness ("Trust your gut!").  
  - **Problem**: Arithmetic slows down trading.  
    **Fix**: Provide calculators; use whole numbers (e.g., prior=20, conditional=10/40).  
  - **Problem": Bookies miss arbitrage strategy.  
    **Fix**: Worksheet hints: "Compare prior vs. conditional prices for the same ticket!"  
  - **Problem": Points feel inconsequential.  
    **Fix**: Award bonus points to winning bookies; shame exploited punters (lightly!).  

  ### **Why This Works**
  - **Punters feel "picked apart"** by their own prices → visceral grasp of diachronic vulnerability.  
  - **Bookies "discover" arbitrage** via worksheet → autonomy + insight into conditionalization.  
  - **Variants disrupt assumptions** → critical reflection in debrief.  

  Run tight, and they’ll never see "conditionalization" coming until you name it.
