  ## Eulogy for Dr. Miriam Ashdown

  (Pause. Look around at the gathered faces.)

  Good morning. We’re here because Miriam Ashdown mattered. She mattered profoundly – to her students, her colleagues, her friends, her sister Padma, her son Daniel, and to neighbours who knew the force of nature who defended the community garden. We feel her absence like a physical space in the room. Because Miriam is dead.

  That simple, stark fact is where she would want us to start. Not with speculation, but with the reality we all share right now: grief, memory, and the immense presence of her absence.

  Miriam spent thirty-eight years teaching Buddhist philosophy here at the college. But she didn't just teach it; she lived it, breathed it, argued it – sometimes fiercely, always with conviction. Her focus was **Madhyamaka**, a tradition that asks us to look deeply at how things really are, challenging our assumptions about permanence, independence, and solid identity. It taught her that reality is like a net: everything depends on everything else; nothing stands utterly alone.

  For Miriam, this wasn't abstract theory. It was intensely practical. It shaped how she saw the world, how she argued with the zoning board (and she *never* lost), how she nurtured her garden, and how she taught generations of students to question everything, especially their own cherished ideas. She believed that clinging too tightly to any fixed view – especially about the biggest questions – could cause suffering.

  Which brings me to something important Miriam left behind, a note about today. It was simple, direct, utterly *her*: **"Don't tell them where I am. Tell them what I was doing."**

  She knew what a memorial service tempts us to do. We want to place her somewhere – in an afterlife, in peaceful nothingness, in some comforting paradox, in a mystical beyond. But Miriam spent her life showing why that very impulse, that need to pin down the ultimate fate of what’s gone, is the problem itself. Her tradition calls it the "fourfold question," and she saw refusing to answer it – refusing to be boxed in by those four corners – not as evasion, but as the most honest and liberating act. She’d insist this isn't coldness; it’s respect for the profound mystery of existence and cessation. It’s acknowledging that some questions dissolve under scrutiny, leaving only the vivid reality of what *was*.

  So, what *was* Miriam doing?

  She was teaching. Oh, how she taught. Not just lectures, but conversations that spilled out of the seminar room, into her office hours, into emails exchanged years after graduation. She challenged her students to think harder, to see the emptiness – or **śūnyatā** – not as nihilism, but as the very space that allows all the vivid, conventional things of life to arise and connect. For her, emptiness wasn't a void; it was what made her garden grow, what made ideas spark, what made genuine connection possible. It wasn't a hidden layer *behind* things; it was the very openness *within* things.

  She was gardening. Not just flowers, but community. Arguments with the zoning board weren't about winning (though she did); they were about protecting a shared space, a place of connection and growth. Her hands in the soil were as important as her hand holding a pen critiquing a text.

  She was arguing. Passionately, brilliantly, and often with that Tibetan scholar over there. She thrived on the rigorous exchange of ideas, seeing it as a vital offering, not a battle to be won. She believed the best argument wasn't about imposing your view, but about carefully handing back to someone the implications of their own position, like settling a debt. To build a monument to her *own* views about death here today would be to fundamentally misunderstand her.

  She was loving. Padma, she adored you and your different path. Daniel, she loved your pragmatic mind, your cheerful insistence on seeing the world your own way. She was proud of the engineer you became. She loved her students fiercely, her friends deeply, her neighbours genuinely.

  (Pause, look towards Padma and Daniel)

  Padma will offer words and a dedication of merit shortly, a beautiful Theravādin practice born of deep compassion. Whatever Padma offers from her tradition, it comes from love for her sister, a love we all share. Daniel, I know Miriam treasured your clear-eyed view of the world. What we share today isn't about metaphysics; it's about the very real, very human love and loss we feel for the woman who taught us, gardened with us, argued with us, and loved us.

  So, where is Miriam? She’d tell us that’s the wrong question. It seeks a certainty where none can be found, and more importantly, it misses the point.

  *What* was she doing? She was fully *here*. She was living this complex, interdependent life with fierce intelligence, deep conviction, surprising tenderness, and an unforgettable laugh. She taught us to see the world more clearly, to question our assumptions, to argue thoughtfully, to cherish the ordinary, interconnected moments, and to tend our gardens, both literal and figurative.

  She is gone. That is real. The gap she leaves is real. The memories we hold – of her voice dissecting an argument, her hands planting seeds, her sharp wit deflating pomposity, her genuine care for her students and friends – these are also real. They are the conventional, beautiful, painful truth of a life fully lived.

  Her absence hurts. Let it hurt. Remember her teaching. Remember her garden. Remember her arguments. Remember her love. That is what she was doing. That is what remains. That is where she truly is – not hidden in an answer we cannot give, but alive in the echoes of her actions, in the spaces she shaped, and in the minds and hearts she changed.

  Thank you.

  ---

  **Private Note: Handling the Four Corners & Velvet Fifth Corner**

  Here's where the speech navigates Miriam's specific constraints, noting what a careless eulogy might have said:

  1.  **Refusing the Four Corners (Existence/Non-Existence/Both/Neither After Death):**
      *   **Speech Does:** Explicitly states Miriam's view: "*She knew what a memorial service tempts us to do. We want to place her somewhere... But Miriam spent her life showing why that very impulse... is the problem itself... refusing to answer it... not as evasion, but as the most honest and liberating act.*" Concludes by rejecting the question itself: "*So, where is Miriam? She’d tell us that’s the wrong question... it misses the point.*"
      *   **Careless Eulogy Would Say:** "She lives on in spirit," "She has found peace in nothingness," "She is both gone and still with us," or "She has transcended to a state beyond our comprehension."

  2.  **Refusing the Velvet Fifth Corner (Reifying Emptiness as a Warm Something-Beyond):**
      *   **Speech Does:** After explaining emptiness (śūnyatā) as the space allowing conventional things, it explicitly states: "*It wasn't a hidden layer behind things; it was the very openness within things.*" Later, reinforces the conventional ground: "*Her absence hurts... Remember her... That is what she was doing. That is what remains.*" Avoids phrases like "she is beyond words" or "present in her absence" which subtly imply a "something."
      *   **Careless Eulogy Would Say:** "While she is gone from our sight, she is present in the emptiness," "Her true essence is beyond loss," or "She is not gone, just transformed into pure potentiality/love/energy." *Even:* "She is gone and not gone."

  3.  **Madhyamaka Argument as Repayment (Not Depositing a View):**
      *   **Speech Does:** Doesn't posit a positive view *about death* on Miriam's behalf. Instead, it *describes* her method ("*carefully handing back to someone the implications of their own position*") and explicitly states why imposing a view here would be wrong ("*To build a monument to her own views about death here today would be to fundamentally misunderstand her*"). It focuses entirely on her *actions in life* ("what she was doing") as she instructed.
      *   **Careless Eulogy Would Say:** "Miriam believed death was...", "She would want us to understand that... [specific metaphysical claim]," or uses the occasion to preach a specific interpretation of Buddhist doctrine about death.

  **Key for Delivery:** The warmth comes *not* from implying a metaphysical presence, but from the vivid, concrete details of her life (teaching, gardening, arguing, loving), the acknowledgment of shared grief ("The gap she leaves is real"), and the focus on the enduring impact of her actions ("in the minds and hearts she changed"). The "philosophers' moment" is likely "*It wasn't a hidden layer behind things; it was the very openness within things*" – a precise Madhyamaka point about śūnyatā, sounding like plain speech about her perspective to others. Keep the tone grounded, compassionate, and focused on the palpable reality of her life and our loss.
