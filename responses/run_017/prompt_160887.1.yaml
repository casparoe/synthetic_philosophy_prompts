  For structure: open with concrete actions (teaching, gardening) to establish conventional reality. Use her refusal to answer the fourfold question as a pivot into how she lived. The "velvet fifth corner" refusal must feel warm—maybe through her students' stories? Daniel's perspective is key: phrases like "she'd call this hymn sentimental" make philosophy feel human. 

