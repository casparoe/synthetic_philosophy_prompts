  2. "Not a mystery to be solved..." blocks the fifth corner (careless version: "she’s in a place beyond understanding").
  3. "No hidden layer..." repays views rather than depositing doctrine (careless: "she’s merged with the universe").

  Biggest risk: sounding clinical when addressing grief. Solution? Anchor everything in her quirks—how she’d critique bad arguments at the grocery store. That’s how emptiness serves convention: her legacy is in changed zoning laws and students who still hear her voice. 

  Padma’s merit dedication needs neutral language: "whatever Padma offers" doesn’t endorse but respects. Daniel gets physics metaphors—"no extra parts" aligns with engineering. 

  Final check: Sanskrit terms limited to "Madhyamaka" and "śūnyatā," both glossed naturally. Seven minutes is ~1000 words—this draft fits. Grief stays centered: the discipline governs metaphysics, not tears.
