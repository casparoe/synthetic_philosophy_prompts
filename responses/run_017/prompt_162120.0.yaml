  1. **Domain specificity**: Are the math/physics failures *relevantly* analogous to consciousness? Maybe not—phenomenal concepts have unique features (e.g., directness, non-structurality) that make conceivability more reliable there. But isn't that circular? User's fear is exactly this: any such distinction presupposes R's truth.
