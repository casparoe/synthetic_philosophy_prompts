prompt: |-
  You're an expert in philosophy of social science, measurement theory, and institutional design, and you've watched a lot of these metrics rollouts up close. Take your time with this one: before you commit to anything, brainstorm three or four genuinely different designs in a scratch section — including the ones you end up rejecting, with the specific failure mode that kills each — and only then pick one and write.

  Here's what I need. I'm a philosophy prof (social epistemology, mostly, but I got volunteered) and I'm stuck on our Undergraduate Teaching Metrics Working Group. We owe the Faculty Senate a recommendation by the end of the month and I want something sharper then what we've been circling.

  The mess, briefly. Three years ago the provost's office threw out student evaluation scores as the official teaching-quality measure, after the usual findings about bias by gender, race, and accent. Now the Board of Trustees wants "a single comparable number" per section, and they will not accept holistic peer review — they say it can't be audited across campuses. A vendor is pitching something it calls the Clarity Index: a composite over (i) two announced classroom observations per term scored on an active-learning rubric, (ii) the share of students who log into the LMS during week one, and (iii) whether the syllabus upload contains eleven required strings. It's cheap and it definitely produces a number. Departments would see their own score and the weighting formula would be published.

  Two things already happened in the pilot. One large department hit 100% on the LMS component by having TAs log in on behalf of students during the first lab, and told us this openly and with no embarassment — they thought they were being helpful. And the observation component has produced a very recognisable ritual: everyone now runs a think-pair-share at minute twelve, because that's when the observers reliably show up. Someone muttered "Goodhart's law" at the last meeting, we all nodded, and that settled exactly nothing.

  There's a counter-proposal from a colleague in public policy. Call it noise-and-secrecy: keep a composite score for the Board, but (a) never publish the weights, (b) make observations unannounced and randomised, and (c) inject calibrated statistical noise into each individual instructor's reported score, so no one can tell whether a given bump came from their teaching or from the noise. Her claim is that you can't optimise hard against a target you can't locate, and that this keeps the legitimate uses of measurement — flagging the genuinely bad tail, giving the Board its number — while making gaming unprofitable. Half the group thinks this is obviously right; the other half thinks it's obviously a trust-destroying nightmare that gets us grievanced by the faculty union and turns teaching into superstition.

  Draft the memo I'll circulate: 900–1200 words, addressed to the Senate, from the Working Group. I need

  - a concrete recommendation with a timeline — pilot, adopt, adopt-with-conditions, or reject the lot and send the Board back — not a menu of options;
  - an honest treatment of the strongest thing on the other side. If you back noise-and-secrecy, take the trust/union/legibility objection at full strength. If you reject it, take seriously the claim that any fully legible metric will simply be eaten by the people it measures.
  - some care about the difference between metric movement that really is gaming, metric movement where the proxy is quietly becoming constitutive of the thing, and metric movement where teaching genuinely improved. We use "gaming" for all three and it's making us stupid.
  - a clause naming what would count, in two years, as evidence we got it wrong, and who then has to do something about it.

  Don't hedge into mush at the bottom line. The Senate needs something it can actually vote on.
reasoning: |-
  Okay, the user is a philosophy professor on a working group tasked with recommending a teaching metric to replace student evaluations. They need a concrete proposal for the Faculty Senate that addresses Goodhart's Law concerns while satisfying the Board's demand for a single number. 

  First, let's unpack the core tensions:
  The Board wants auditability and simplicity ("single comparable number"), but transparent metrics get gamed (as shown by the LMS/login workaround and observation rituals). The noise-and-secrecy proposal tries to prevent gaming but risks destroying trust and creating faculty backlash. 

  Hmm... the user's discipline (social epistemology) matters here. They'd appreciate nuanced analysis of how metrics shape behavior. Three key insights from their description:
  1) "Gaming" isn't monolithic - sometimes metrics accidentally redefine good teaching (proxy→constitutive), sometimes they induce empty rituals, rarely they spark real improvement.
  2) The pilot exposed two failure modes: effort diversion (TAs logging in) and performative compliance (think-pair-share theater).
  3) There's a legitimacy crisis brewing - faculty will resist anything resembling surveillance.

  *Scratch designs I considered and rejected:*

  **Option 1: Refined Clarity Index**  
  - *Fix:* Tighten LMS rules ("student must click X module"), randomize observation times  
  - *Killed by:* Observation randomization just shifts gaming (e.g., "active learning popcorn" every 15 mins). LMS rules create arms races (students paid to click). Still legible → still gameable.  

  **Option 2: Pure Noise-and-Secrecy**  
  - *Fix:* Exactly as proposed - opaque weights, random audits, noise injection  
  - *Killed by:* Trust issues are fatal. Unions will decry lack of due process when noisy scores affect promotion. Plus: if scores can't guide improvement (due to noise), why collect them?  

  **Option 3: Departmental Self-Definition**  
  - *Fix:* Let each department design their own metric, aggregated to a single number  
  - *Killed by:* Board requires cross-campus comparability. Also risks inconsistency (e.g., engineering vs philosophy teaching scored differently).  

  **Option 4: Output Metric Only**  
  - *Fix:* Measure downstream outcomes (e.g., course completion rates, next-course performance)  
  - *Killed by:* Confounded by student factors outside instructor control. Also lagged - too late for improvement.  

  *Why I chose the compromise:*  
  The "Limited Legibility" model balances auditability (Board's need) with anti-gaming (faculty concern). Key moves:  
  1) **Partial secrecy** protects only the observation rubric (hardest to game) while publishing other weights  
  2) **Noise injection** but with a twist: only for high-stakes decisions, not formative feedback  
  3) **Reclaiming "improvement"** by separating the metric's diagnostic vs evaluative uses  

  Biggest worry: the public policy colleague might say partial secrecy still leaks enough to game. But full opacity was politically untenable. This gives faculty actionable feedback while admitting the metric's limitations upfront.  

  *User's hidden needs:*  
  They're tired of philosophical debates that don't resolve - note "we all nodded at Goodhart's Law and settled nothing". The memo must land practical solutions without oversimplifying. Also, as a social epistemologist, they'll want the design to acknowledge *how* metrics create knowledge (or distortion).  

  The "evidence we got it wrong" clause is crucial. It preempts future debates by defining failure modes now: not just gaming, but metric divergence (e.g., if "observable teaching" and actual learning outcomes decouple).  

  Final structure:  
  1) Diagnose why both existing proposals fail  
  2) Propose Limited Legibility as synthesis  
  3) Detail implementation with off-ramps  
  4) Name specific failure signals
answer: |-
  ## MEMORANDUM  
  **To:** Faculty Senate  
  **From:** Undergraduate Teaching Metrics Working Group  
  **Subject:** Recommendation on Teaching Quality Metric Framework  
  **Date:** 15 October 2023  

  ### I. Introduction  
  After extensive deliberation and analysis of pilot data, this Working Group proposes a modified teaching assessment framework ("Limited Legibility Protocol") balancing the Board’s need for auditable quantification with protection against metric corruption. We reject both the vendor’s Clarity Index and the pure noise-and-secrecy model as presented, while incorporating key insights from each. Implementation will begin Spring 2024 with mandatory review in Fall 2026.  

  ### II. Core Problems Identified  
  Our pilot exposed three failure modes requiring mitigation:  
  1. **Mechanical Gaming**: Effort diverted to "hitting the number" without pedagogical improvement (e.g., TA logins, observation rituals).  
  2. **Conceptual Capture**: Metrics subtly redefining "good teaching" (e.g., active-learning rubrics privileging performative techniques over depth).  
  3. **Legitimacy Collapse**: Systems perceived as opaque or hostile eroding faculty trust and cooperation.  

  ### III. Rejected Alternatives & Rationale  
  1. **The Clarity Index (Vendor Model)**  
     - *Failure Mode*: **Extreme Goodhart Vulnerability**  
     Transparent, formulaic metrics invite exploitation, as demonstrated by LMS manipulation and observation predictability. Gaming becomes rational when proxies are legible and low-cost to fake.  
     - *Why Rejected?* Rewards theatrical compliance over authentic teaching. Pilot data shows rapid proxy decay.  

  2. **Pure Noise-and-Secrecy (Policy Proposal)**  
     - *Failure Mode*: **Epistemic Alienation**  
     While theoretically sound against gaming, total opacity (random audits + noise injection + hidden weights) severs the feedback loop for improvement. Faculty cannot discern signal from noise, breeding resentment and suspicion.  
     - *Why Rejected?* Violates principles of procedural justice. Likely triggers union grievances and discourages pedagogical innovation by decoupling effort from observable outcomes.  

  3. **Departmental Self-Assessment Aggregates**  
     - *Failure Mode*: **Incommensurability**  
     Departments define unique metrics aggregated to a university-wide score. Protects disciplinary diversity but fails Board auditability needs (e.g., comparing Biology to Philosophy).  
     - *Why Rejected?* Board explicitly requires cross-unit comparability.  

  ### IV. Recommended Framework: Limited Legibility Protocol  
  *Components:*  
  1. **Modified Composite Metric (Reported to Board):**  
     - **(A) Observation Score (50%):** Two *unannounced* peer observations per term using a standardized rubric focused on *student intellectual engagement* (e.g., quality of questioning, evidence of critical thinking). **Rubric details published; timing/auditor randomized.**  
     - **(B) Curricular Baseline (20%):** Syllabus/assignment checks for research-backed elements (e.g., clear outcomes, inclusive language). *Required strings replaced with flexible principles.*  
     - **(C) Learning Pathway Audit (30%):** LMS analytics tracking *meaningful interaction* (e.g., submission of formative assessments, discussion board engagement). **Excludes vanity metrics (logins).**  

  2. **Anti-Gaming Safeguards:**  
     - **Controlled Opacity:** Observation timing/auditor assignment randomized; rubric publication includes *examples* but not exhaustive scoring thresholds.  
     - **Noise Injection (Threshold-Triggered):** Scores reported to instructors and chairs include confidence intervals; only scores outside ±2 SD of department mean receive noise-adjusted values for high-stakes decisions (tenure/promotion). Protects extremes while preserving feedback integrity.  
     - **Departmental Review Buffer:** Chairs receive raw component scores to contextualize anomalies (e.g., LMS crashes, experimental pedagogy).  

  3. **Transparency/Improvement Mechanism:**  
     - Instructors receive component-level data (except randomized audit details) with benchmarked peer comparisons.  
     - Annual department workshops analyze *patterns* (e.g., "Why do reflections scores dip in large lectures?") without spotlighting individuals.  

  ### V. Addressing Key Objections  
  **Objection: "This is still gameable!"**  
  *Our concession:* Any quantitative system is corruptible. However, by:  
     (a) Randomizing the costliest-to-fake element (observations),  
     (b) Avoiding vanity metrics (LMS logins),  
     (c) Threshold-limited noise to deter micro-optimization,  
  we reduce ROI on gaming below the effort required for authentic improvement.  

  **Objection: "Noise injection undermines trust!"**  
  *Our mitigation:*  
     - Noise applies *only* to extreme high/low performers in high-stakes decisions, not formative feedback.  
     - Faculty handbook amendments will codify:  
       *"Teaching scores near departmental averages are treated as statistically indistinguishable. Adjustment occurs only for pronounced outliers."*  
     - Union consultation is built into implementation.  

  ### VI. Implementation Timeline  
  - **Nov 2023:** Senate approval; union consultation begins.  
  - **Spring 2024:** Phase 1 pilot (3 volunteer depts). Train peer observers.  
  - **Fall 2024:** Full rollout. Handbook amendments finalized.  
  - **Fall 2026:** Mandatory sunset review.  

  ### VII. Sunset Review: Conditions for Rejection  
  This system fails and must be replaced if *two or more* occur by 2026:  
  1. **Proxy Decay:** >30% of departments show *divergence* between metric trends and external evidence (e.g., teaching awards, alumni surveys, enrollment patterns in advanced courses).  
  2. **Gaming Prevalence:** >25% of faculty in surveys report pressure to "ritually comply" with metrics over pedagogical judgment.  
  3. **Equity Failure:** Significant demographic score gaps persist after controlling for course/department factors.  
     - *Accountability:* The Provost must commission an external review and propose alternatives within 6 months of failure triggers.  

  ---

  ### VIII. Conclusion  
  The Limited Legibility Protocol accepts a hard truth: perfect, ungamed quantification of teaching quality is impossible. Instead, we strategically *manage* corruption through:  
     - **Partial randomness** to raise gaming costs,  
     - **Thresholded opacity** to protect integrity at extremes,  
     - **Diagnostic transparency** to foster improvement.  

  This framework satisfies the Board’s mandate while refusing to sacrifice faculty trust or pedagogical innovation to the false god of algorithmic purity. We move beyond "gaming vs. rigor" to a system acknowledging measurement as a *social practice* requiring institutional vigilance.  

  **Recommendation:** Adopt the Limited Legibility Protocol with implementation as outlined.  

  Respectfully submitted,  
  The Undergraduate Teaching Metrics Working Group  

  ---

  **Rationale Notes for Prof:**  
  - *Why not full secrecy?* It solves gaming but at too high a cost: faculty become subjects, not participants. Noise should protect, not obfuscate.  
  - *Why keep observations?* They’re the least-bad proxy if randomized. LMS/syllabus metrics are hygiene factors.  
  - *The "Constitutive Proxy" trap:* By avoiding binary checklists (e.g., "11 strings") and publishing rubric *principles*, we reduce metric-driven redefinition of teaching.  
  - *Critical nuance:* Gaming isn’t always bad—if metrics push faculty toward evidence-based practices *that work*, it’s improvement. We only care when effort is wasted on empty rituals.  
  - *Sunset clause teeth:* Tying failure to specific evidence shifts future debates from ideology to data.
