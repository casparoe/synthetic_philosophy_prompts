prompt: |-
  bit of an odd one, and sorry if this is the wrong place for it. I somehow ended up on the committee of a very small local heritage society — we put up plaques, run one open afternoon a year, that sort of thing — and I keep walking into the same strange configuration and I don't have a word for it. First case: our village has a story that the clock on the old town hall was paid for by a subscription from the mill workers, and every year at the open afternoon somebody tells that story while we all stand under the clock. About fifteen years ago a retired accountant went through the council minutes and the subscription list, and it turns out the money came from a single mill owner, and the workers actually petitioned *against* the clock because they wanted the money for the sick fund. Everyone on the committee now knows this. Nobody thinks the minutes are forged. And still the story gets told every year, and when I gently suggested last summer that we adjust the wording, the reaction wasn't "but the minutes are wrong" — it was closer to panic, and the thing that actually got said out loud was "well then there's no point doing the clock at all". And, sure enough, we've more or less stopped doing the clock. Second case: the next valley over has a story about the 1968 flood, that the valley authority opened the sluices without warning them, which the authority's own logs say it didn't. They never use that story to make claims about 1968. They use it every time the authority proposes anything now: it is the thing that entitles them to say they've never cared about us and to refuse to take up their seat on the joint board. Individually they'll concede the logs are probably right. But correcting them doesn't get you to "the logs are right and the authority still doesn't care about us" — it gets you to nobody saying anything at all, and the seat sitting empty.

  So the pattern I think I'm seeing: a shared story about the past that (a) isn't really *believed*, in the sense that nobody will stake anything on it as evidence about what happened, but (b) isn't a legend or a lie either, because it doesn't seem to be trying to be believed, (c) does real work in the present — it's what licenses a stance, a grievance, a bit of local standing, a refusal to cooperate — and (d) can't be *corrected*, only deleted: put the accurate version in its place and the practice around it collapses instead of being updated by it. A friend said "that's just collective memory", which feels both true and useless — it just says that groups remember things, and it doesn't touch the part where the story survives being known to be false and dies when something true is substituted for it.

  Is there an established concept for this exact thing? And please don't just hand me a label, I want the carving. How is it different from an ordinary false belief that a group happens to share, from a myth people take literally, from straight propaganda or a useful lie somebody knowingly tells, and from nothing more than outdated history nobody has got round to fixing? I suspect it's none of those but sits close to several of them, and I'd want to be told which is nearest and exactly where it comes apart. I also want the edges: is it still the same thing if nobody has ever actually checked the record? If the story turns out to be true? If the stance it licenses could perfectly well be defended from the accurate record, but nobody bothers to re-derive it that way once the story goes? If people, when challenged, insist the story is literally true — does that push it back into being a plain false belief, or is that insistence itself part of the phenomenon? And one more thing, since this is what the arguments here actually turn on: if a story like this isn't in the business of stating facts about the past at all, does it even make sense to ask whether the record or the memory should give way, or is that the wrong question to be asking? If there genuinely is no term for it, I'd rather get a coined one with a definition and a couple of boundary cases than a name I can't actually use.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're part of a small heritage society and have encountered a recurring pattern where a shared story persists despite being contradicted by historical records. The key points are that the story isn't believed as factual evidence, yet it serves a practical function in the present, like justifying grievances or actions. When corrected, the practice around it collapses instead of adapting. 

  First, I need to identify the core elements: (a) not truly believed, (b) not a lie, (c) functional in the present, (d) correction leads to deletion, not update. The user already ruled out terms like "collective memory" as too vague. They want precise distinctions from similar concepts like myths, false beliefs, propaganda, etc.

  I recall anthropological concepts like Bronisław Malinowski's "myth as charter," which positions myths as validating social structures rather than recording history. That seems relevant. Then there's Eric Hobsbawm's "invented traditions," where practices imply continuity with the past to establish legitimacy. But the user's cases aren't invented; they're adapted stories that lost their factual basis.

  The term "social charter" comes to mind. It emphasizes the story's role in authorizing present actions or stances. Another angle is "group-affirming narrative," focusing on cohesion. But "charter" might be more precise because it directly relates to licensing behavior.

  Now, distinguishing from other concepts:
  - **False belief**: Here, people don't stake claims on the story's truth. They concede records might be right but still use the story functionally.
  - **Myth (literal)**: Unlike myths taken literally, this story's factual accuracy is irrelevant. The panic when corrected shows its function is tied to the narrative, not the facts.
  - **Propaganda/Useful lie**: Propaganda is deliberately spread to deceive. Here, the committee knows it's inaccurate but maintains it for its social role, not deception.
  - **Outdated history**: If it were just outdated, correcting it wouldn't cause collapse; the practice would continue with updated facts. But here, the practice dies.

  Boundary cases:
  - **Never checked records**: Without verification, it might resemble a myth, but the functional role remains key. Once checked, the story collapses if corrected, showing it was always about function, not belief.
  - **Story is true**: If verified, it becomes straightforward history. The phenomenon specifically involves inaccuracy that's functionally necessary.
  - **Stance defensible with facts**: Even if true facts could support the stance, the group doesn't re-derive it. The narrative shortcut is essential; losing it disrupts the practice.
  - **Insisting it's true**: If people double down, it might shift into false belief territory. But in the user's case, the insistence might be performative to preserve the function, still part of the phenomenon.

  The user's deeper need is to articulate this concept to their committee, helping them understand why factual correction disrupts social functions. They need a framework to navigate whether to prioritize historical accuracy or social cohesion, recognizing that forcing a choice can be destructive. Terms like "social charter" offer a way to discuss the story's role without attacking its truth value, potentially preserving both the practice and historical integrity.
answer: |-
  What you're describing is a fascinating and under-discussed phenomenon. It's not *quite* any single established term, but it sits at the intersection of several well-studied concepts. The closest fit, requiring some careful carving, is **Social Charter Narrative** or **Group-Affirming Narrative**. Let's break it down:

  ### The Core Phenomenon: Narrative as Functional Tool, Not Factual Claim
  1.  **Primary Function:** The story exists primarily as a **licensing mechanism** or **organizing principle** for present-day group identity, stance, or action. It's a **social tool**, not a historical account.
  2.  **Epistemic Status Detached:** The group doesn't *need* to believe it literally as historical truth for it to work. Its power comes from its *symbolic resonance* and its *established role* in the group's discourse and practice. It's "true" in the sense of being *functionally valid* for the group's purpose, not factually accurate about the past.
  3.  **Correction Destroys Function, Not Belief:** When confronted with factual disconfirmation, the group doesn't defend the *fact* ("the minutes are wrong!"). They panic because the *tool they rely on* is broken. The narrative was the *only available handle* for the stance/grievance/practice. Removing it doesn't replace the handle; it removes the reason or ability to grip the thing altogether ("no point doing the clock," silence and the empty seat).
  4.  **Not Propaganda/Lie:** Unlike propaganda or a useful lie, there's no *intent* to deceive *outsiders* or even necessarily *insiders* about the past. The group *knows internally* it's shaky or false. The lie is **collusive** – everyone tacitly agrees to maintain the narrative *because* of its present utility, not because they are deceived. It's a **social agreement to use the story**, not a belief in its historicity.
  5.  **Not Literal Myth:** While myths serve charter functions, they are often believed *literally* by adherents (e.g., foundational religious myths). Your cases lack that literal belief. The story is treated more like a useful *metaphor* or *shorthand* for a complex social reality or grievance.
  6.  **Not Simple False Belief/Outdated History:** A simple false belief is defended when challenged ("the moon *is* made of cheese!"). Outdated history is updated when better evidence arises ("Oh, we thought X, but now we know Y, so we'll say Y"). Here, the belief *isn't* defended *as belief*, and updating *isn't* possible because the *function* is tied to the *specific narrative*, not the underlying reality it (mis)represents.

  ### Why "Social Charter Narrative" Fits
  *   **Charter:** Coined by anthropologist Bronisław Malinowski, a "charter myth" provides justification and legitimacy for social institutions, customs, or group identities. Your stories act precisely as charters: they *license* the stance against the authority, the practice of the clock ceremony, the refusal to cooperate.
  *   **Social:** Emphasizes that its existence and power derive solely from the group's collective agreement and practice. It's sustained by *social* need, not individual conviction of historical truth.
  *   **Narrative:** Highlights that it's a constructed story, a specific sequence and framing, not just a raw fact or feeling.

  ### Carving the Edges: Boundary Cases
  1.  **Never Checked the Record:** If no one checks, it *looks* like a standard shared false belief or myth. **The phenomenon emerges distinctly when the disconfirmation is *known* but the narrative persists *because* of its function.** Without the check, it remains latent. The *functional dependence* becomes visible upon attempted correction.
  2.  **Story Turns Out True:** Then it ceases to be *this* phenomenon. It simply becomes an *accurate* historical basis for the stance/practice. The key element – functional reliance on a *disconfirmed* narrative – is missing. The group might still use it functionally, but the fragility upon correction disappears.
  3.  **Stance Defensible from Accurate Record:** Crucial boundary. If the *stance* ("authority doesn't care," "workers' sacrifice should be remembered") can be robustly defended using verified facts *and the group readily shifts to using those facts*, then it wasn't truly a "Social Charter Narrative" as defined. It was just a mistaken historical detail. **The phenomenon is defined by the *collapse* of the practice when the *specific narrative* is removed, even if the underlying *sentiment* might be justifiable.** The narrative was the *only* operable mechanism for expressing or activating that sentiment in the group context.
  4.  **People Insist it's Literally True When Challenged:** This is complex.
      *   **If the insistence is weak/pro forma:** ("Well, I still *think* it happened that way, but anyway...") and the *real* force remains the functional need, it's still part of the phenomenon. The insistence is a face-saving ritual or an attempt to preserve the tool.
      *   **If the insistence is strong and genuine:** And the group actively rejects the evidence *on factual grounds*, then it *shifts* towards being a standard **collective false belief** or **literal myth**. The functional dependence might still be there, but the epistemic detachment is lost. The panic you observed suggests the former (functional panic) not the latter (defensive belief panic).
  5.  **The Core Question: Record vs. Memory?**
      *   **It's the wrong question.** Framing it as "record vs. memory" implies both are competing accounts *of the past*. The Social Charter Narrative isn't *primarily* an account of the past. It's a *present-day social tool* that *uses* a past narrative (accurately or not) as its vehicle.
      *   **The right question is:** "What social function does this specific narrative serve *now*? What would be lost, functionally, for the group if we stopped using *this story*?" Understanding this reveals *why* correction causes collapse. The choice isn't between truth and falsehood about the past; it's between maintaining a vital (to them) social practice and historical accuracy, often forcing an unwinnable choice.

  ### Why "Collective Memory" Isn't Enough
  You're right. "Collective memory" is a broad umbrella covering everything from accurate shared recall to national myths. It doesn't capture the specific dynamics you observe: the **functional dependence**, the **epistemic detachment** (knowing it's false but using it anyway), and the **fragility upon correction** (deletion, not updating). Your cases are a specific *sub-type* of collective memory where memory serves a non-historical, charter-like function and becomes brittle when its factual basis is challenged.

  ### Using This Concept
  *   **Don't lead with "your story is false."** Acknowledge the *function* first: "This story about the clock/flood clearly means a lot to us; it seems central to how we mark our history/relate to the authority. What would we lose if we changed *how* we tell it?"
  *   **Explore the underlying need:** What stance, identity, or practice does the narrative enable? Is there a way to express or enact that *using* the verified history? (e.g., "The mill owner paid, but the workers' petition shows their priorities – maybe we focus on *that* tension?" or "The 1968 logs show procedure was followed, but the *perception* of neglect persists – can we discuss *current* proposals on their own merits?").
  *   **Recognize the risk:** Forcing the issue may destroy the social practice (as you've seen). Sometimes, the functional need is so strong that the group will choose the narrative over the record, or silence over correction. There's no easy answer, but understanding the *type* of thing you're dealing with – a **Social Charter Narrative** – provides a clearer lens to navigate the difficult choices your committee faces. It moves the conversation beyond "truth vs. lies" to understanding the deeper social glue holding the group's practices together.
