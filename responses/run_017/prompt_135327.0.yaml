prompt: |-
  had a huge argument with my friend last night -- she says memetics died in the 90s and i should drop it, i say what died was the version where a meme is a little code copied brain-to-brain and nobody serious ever defended only that. so now i've agreed to give a 20-minute talk to the cultural evolution reading group here and i want to walk in ready for the question period.

  My thesis: the unit of cultural inheritance isn't the meme, it's what I'm calling a *scaffold* -- the little rebuilt environment (tools left out in a certain order, an arranged workspace, trained attention, the way a novice's body gets positioned) that makes re-acquiring the trait cheap. Fidelity is a property of the scaffold, not of copying: the copy can be pretty bad as long as the reconstructed niche reliably rebuilds the conditions under which the trait gets reacquired. So selection acts on variants by how cheaply their scaffold rebuilds itself, and high-fidelity transmission is a special case rather than the mechanism. Second half of the argument: this is why lab transmission-chain experiments keep finding degradation -- the design strips the scaffold out and then reports the loss as a fact about culture.

  Audience: about half are dual-inheritance / gene-culture coevolution modelers -- they think in transmission parameters, fidelity, biased transmission, population structure, and they will want to see my recursion and my generation time. The other half are anthropologists of apprenticeship and situated learning who think those lab chains are a parody of real transmission and who get allergic to the word replicator. Plus one historian of science who will want to know what makes any of this Darwinian rather than just Spencerian progress-talk with equations.

  Give me the prep sheet: the objections I'll actually get, in that room, phrased the way each group would phrase them, ordered by how much damage they do, each with a short reply (two minutes max) and a note on where the reply is soft. What should I concede in the first two slides rather than be forced into later? Which single reply has to land for the talk to survive? What's the weakest point in my own position that I should walk in having already admitted? And give me the question I'm hoping nobody asks.
reasoning: |-
  Okay, the user is preparing for a 20-minute talk defending their "scaffold" theory against critics. They need to anticipate objections from two academic factions: mathematical modelers and anthropologists/historians. 

  First, let's unpack their core thesis: they're arguing cultural transmission relies on environmental scaffolds rather than perfect meme copying. This challenges both the lab-experiment approach (by explaining degradation) and replicator theory (by making fidelity situational). Smart framing - they're positioning scaffolds as the *real* unit of selection.

  Hmm... the audience split is crucial. The modelers will demand formal rigor: "Where's the math? How does this improve our equations?" The anthropologists will resent any whiff of reductionism. And that historian will pounce on teleology. User needs different rebuttals for each.

  Biggest threats: 
  1. Modelers accusing them of reinventing existing concepts (niche construction) without added value. Must show computational payoff.
  2. Anthropologists dismissing it as just "situated learning" with extra jargon. Need concrete examples of scaffold decay.
  3. Historian's "That's not Darwinian!" challenge. Must distinguish selection-from-variation from Spencerism.

  User should preemptively concede three things upfront: 
  - Memetics had flaws (agree with friend partially) 
  - Scaffolds aren't entirely new (cite Lave/Wenger) 
  - This doesn't discard transmission biases 

  The make-or-break reply? Demonstrating *how* scaffold collapse explains lab degradation better than "noisy copying" models. If that lands, both sides might see value.

  Weakest point: quantifying "cheap rebuilding." User hasn't defined cost metrics. Should admit this early as "work in progress."

  Pray nobody asks: "If scaffolds require cultural preconditions, isn't this infinite regress?" That could unravel the whole framework. 

  ...Time to structure the rebuttals by threat level. Prioritize modeler objections - they'll demand equations. Then anthropologist pushback about lived experience. Historian last - their critique is philosophical but could sway others.
answer: |-
  Here’s your battle-tested prep sheet for the scaffold talk, structured for maximum survival in that room:

  ---

  ### **Preemptive Concessions (Slide 2)**
  1. **"Memetics 1.0 was flawed."**  
     Concede: Early memetics *was* often reductionist and ignored context. Your scaffold theory builds on critiques (e.g., Sperber’s "attraction" theory).  
     *Why early?* Disarms skeptics by agreeing while pivoting to your nuanced view.

  2. **"Scaffolds aren’t wholly new."**  
     Cite precursors: Niche construction theory (Odling-Smee), distributed cognition (Hutchins), situated learning (Lave & Wenger).  
     *Your twist:* You’re framing them as *units of inheritance* under cultural selection.

  ---

  ### **Objections & Replies (Ordered by Threat Level)**
  #### **1. From Modelers: "Where’s the Math?"**  
     *Objection:* "If fidelity isn’t copying, how do we formalize transmission? What’s your recursion equation? How do scaffolds fit into existing models?"  
     **Reply (2 min):**  
     > "Scaffolds shift the *locus* of fidelity: instead of high-fidelity replication, we model *scaffold stability*. Think: selection for traits where the cost of environmental reconstruction (e.g., tool arrangement, training time) is low. Equations should track *scaffold decay rates* and *reconstruction costs*—not just transmission bias. This explains why high-fidelity transmission emerges only when scaffolds are robust."  
     **Soft spot:** Needs concrete formalism (concede: "Work in progress—collaborators welcome!").

  #### **2. From Anthropologists: "Isn’t this just situated learning?"**  
     *Objection:* "You’re describing apprenticeship (e.g., tailoring in Liberia) or embodied cognition. Why call it ‘scaffolds’ or ‘inheritance’? This feels like rebranding."  
     **Reply (2 min):**  
     > "Scaffolds are the *inheritable infrastructure* enabling situated learning. When a master dies but leaves tools/workflows, that’s a scaffold—it outlasts individuals and structures reacquisition. Unlike apprenticeship (a process), scaffolds are the *selectable material artifact* of cultural evolution. They’re what makes ‘situated’ learning replicable across generations."  
     **Soft spot:** Risk of conflating process (learning) and unit (scaffold).

  #### **3. From Historian: "This isn’t Darwinian—it’s Spencerian!"**  
     *Objection:* "Selection on ‘cheap rebuilding’ sounds like progressive efficiency. Where’s variation/selection without teleology? Why call this Darwinian?"  
     **Reply (2 min):**  
     > "Scaffolds introduce *variation* in reconstructive efficiency (e.g., two pottery techniques with different setup costs). Selection acts on that variation—*not* toward ‘progress’—but toward fit with environmental constraints (e.g., material scarcity). Degraded labs show this: without scaffolds, traits drift *despite* ‘intent’ to copy. It’s Darwinian because fitness = persistence under local constraints."  
     **Soft spot:** Must avoid "efficiency" = progress (emphasize local constraints).

  #### **4. From Modelers: "Lab degradation is just noise!"**  
     *Objection:* "Lab chains control for confounding variables. Degradation proves copying is imperfect—no need for ‘scaffolds’."  
     **Reply (1 min):**  
     > "But labs strip *all* ecological supports. Real-world traits survive *because* scaffolds compensate for noisy copying. Degradation in chains is evidence *for* scaffolds—it shows what happens when they’re missing."  
     **Pivot:** Cite real-world examples (e.g., oral traditions using ritual/space as scaffolds).

  #### **5. From Anthropologists: "You’re sterilizing culture!"**  
     *Objection:* "Scaffolds feel mechanistic. Culture is lived, contested, fluid—not ‘rebuilt’ like IKEA furniture!"  
     **Reply (1 min):**  
     > "Scaffolds *are* sites of conflict! (E.g., unions reorganizing workspaces.) But without *some* stable structure, skills dissolve. Think of scaffolds as coral reefs: dynamic, but enabling ecosystems to persist."  
     **Soft spot:** Over-emphasizing stability; concede "scaffolds evolve through use."

  ---

  ### **The Make-or-Break Reply**  
  **For modelers:** "**Scaffolds explain why high-fidelity transmission is *rare* and context-dependent—not a default. This resolves the paradox of lab degradation vs. real-world stability.**"  
  *If this lands*, modelers see value; anthropologists nod at realism.

  ---

  ### **Weakest Point (Admit Early)**  
  > "I haven’t fully resolved the ‘scaffold hierarchy problem’: How do micro-scaffolds (e.g., tool arrangement) nest into macro-scaffolds (e.g., education systems)? For now, I focus on skill-acquisition contexts."

  ---

  ### **The Question You Hope Nobody Asks**  
  > **"If scaffolds themselves require cultural knowledge to build/maintain, isn’t this infinite regress? What’s the *actual* replicator here?"**  
     *Why deadly?* Forces you to either smuggle in a replicator (contradicting your thesis) or posit scaffolds all the way down (hand-wavy).  
     *Dodge/weave:* "Scaffolds co-evolve with knowledge—but their material persistence (e.g., a jig in a workshop) allows reconstruction even after knowledge lapse. The replicator isn’t a ‘unit’ but a *reconstructive process*."

  ---

  ### **Tactical Slide 0**  
  Open with: **"What survived the 90s memetics crash? The insight that culture *evolves*—but we need better units."**  
  Then: **"Tonight’s wager: The unit isn’t in brains. It’s in the *world we rebuild*."**  
  *(Hooks both sides. Anthropologists see materiality; modelers see a solvable unit.)*

  Go in ready to pivot: Your goal is to convince them scaffolds **explain empirical puzzles** (degradation! real-world fidelity!) better than legacy models. Survive Q&A by framing objections as **collaborative puzzles**—not defeats.
