prompt: |-
  Hey — I need something I can actually use at work, not an essay.

  I'm moderation lead for a neighbourhood assembly (Northgate Ward, about 40k people; we meet twice a month and get 20–40 written submissions per meeting on whatever's on the agenda: a zoning variance, a supervised consumption site, school start times, the police budget line, a payday lender's permit renewal, a bike lane). My job, in roughly ninety seconds a submission with no research allowed, is to sort each one into one of two buckets:

  - Bucket R ("reasons"): the assembly owes this a written answer in our report — we have to say what we made of the consideration and how we weighed it.
  - Bucket C ("convictions"): it gets printed in the record in full, we confirm we read it, but we owe it no answer about its content.

  Getting it wrong costs real things. Over-using C is how we end up in front of the council on a discrimination complaint, and two neighbourhoods basically stopped showing up last year after we did it badly. Over-using R means our reports become unreadable, we spend the meeting writing theology instead of policy, and the city solicitor gets twitchy about the assembly taking positions on doctrine. So it matters, it happens constantly, and I rule on the spot with a three-person panel (me, a clerk, one rotating resident) that has to sign off. None of us has philosophy training. I did one undergrad course and remember almost nothing except that there's a big literature on "public reason" and whether religious arguments belong in politics, and that it mostly argues with itself.

  So: build me the procedure. Ordered tests I can run inside ninety seconds, what counts as a yes or a no at each step, where it terminates in C, and where it hands off to a human because the question is really a values call. Give me a laminated-card version too, plus a short "don't do this" list. And I need a one-sentence script I can read back to a submitter that doesn't sound like "your kind of reason doesn't count here."

  Here are the distinctions I keep tripping over, which the procedure has to handle (I've made up my own labels, sorry):

  1. Detachable vs. welded. Sometimes you can strip out the God-talk and the argument still stands on its own — the shelter says the noise from the venue next door will push its residents out, and the bit about their faith obliging them to protect the residents is doing motivational work, not argumentative work. Sometimes pulling the religious premise collapses the whole thing. Also: "just translate it for them" is a labour question, not a solution — if I do the translating, am I editing someone's reason into a different one and then answering my own version?

  2. The letterhead problem. Two submissions with identical sentences and identical empirical backing, one from a tenants' union and one signed by fourteen churches on letterhead. Does the source move it between buckets? I don't think it should, but I can't say why.

  3. Borrowed-secular claims. The submission makes a checkable factual claim, but the person holds it for religious reasons (the material in the curriculum is false because it contradicts Genesis; the shelter will lose its licence). My instinct is that a claim being false or unpopular shouldn't push it toward C — that's just censoring by another name — but that its being checkable should pull it toward R. Except then we're spending meeting time "answering" stuff that's flatly wrong.

  4. Testimony, not argument. Someone writes that they have to say this because they'll answer to God for staying silent. That isn't a consideration for the policy at all, it's a statement about the speaker. Which bucket, and does the answer change if fifty people send the same one?

  5. Comprehensive doctrines that aren't religious. We get just as many from a deep-ecology guy (the river has standing), a Marxist, an anti-natalist, and a guy who cites Ayn Rand at length. The procedure can't be secretly just anti-religion, because if it is, it will get lawyered within a month.

  6. The floating middle. "Human dignity," "the common good," "natural law," "the sanctity of life" — historically religious vocabulary that now just floats around in policy writing. Religious or not?

  Then run it on these, showing your work at each step:

  (a) Opposing the supervised consumption site: the body is a temple, the city would be complicit in sin, and they'll be praying about it — plus one sentence about needles in the park behind the library.

  (b) A faith-run homeless shelter opposing a late-night venue next door: thirty years on that block, the noise will push their residents out, and their faith obliges them to protect the people in their care.

  (c) A coalition of Black churches and a tenants' union opposing the payday lender's permit renewal, in Jubilee-and-usury language: the land isn't a commodity, debt has to be released, a lender charging these rates is devouring the poor.

  (d) The letterhead case: a pastor's submission on school start times that cites sleep-science numbers and nothing else — and then the same submission with the church letterhead and a closing line about stewardship of children's bodies.

  I'm a practising Catholic and I agree with a lot of the religious submissions, which is exactly why I don't trust my own gut on this. So I want at least one of those run to come out in a way I'll hate and will be tempted to overrule — tell me honestly which one it is and why, and whether my wanting to overrule it is a reason to change the procedure or a reason to trust it. My guess is (c), but you tell me.

  Finally: where will this misfire? What should we do on the spot when someone is in the room and can restate their own reason if asked, versus a written submission where nobody can? And say plainly what you think the procedure cannot settle, so I can stop pretending otherwise in the report.
reasoning: |-
  Okay, I need to help this moderation lead create a quick, practical procedure for sorting submissions into Bucket R (needs a response) or Bucket C (just recorded). The key is to make it usable in 90 seconds without research, and avoid philosophical debates. Let me start by understanding the core issues they're facing.

  The main challenges are distinguishing between detachable arguments (where religious language can be stripped away) and welded ones (where the argument collapses without it). Also, handling borrowed-secular claims, testimony vs. argument, and non-religious comprehensive doctrines. Plus, the letterhead problem where the source shouldn't sway the bucket but feels like it might.

  First, I should outline a step-by-step test that's efficient. Steps need clear yes/no questions to terminate quickly. For example, start with checking if it's testimony or not. If someone says they must speak because of their faith, that's C. Then move to factual claims: if it's verifiable, it goes to R, even if the submitter believes it for religious reasons. Next, look for detachable reasoning—can the argument stand without the comprehensive doctrine? If yes, R; if not, C. Terms like "human dignity" that are now secularized stay in R.

  The letterhead issue: the source shouldn't matter. Identical content should be sorted the same regardless of who sent it. But how to handle the added line about stewardship? That might still be detachable if the core argument is secular. 

  Handling the examples: For (a), the needles in the park part is factual (R), but the body as a temple is welded (C). So it splits. (b) is detachable because the noise issue stands without faith. (c) is tricky. Jubilee language might seem religious, but if it's about exploitative lending, it's detachable. The user might want to put this in C because they agree, but the procedure should place it in R due to the secular argument about exploitation. (d) with letterhead stays R if the stewardship line is motivational, not foundational.

  Misfires might happen when an argument seems welded but has an implied secular point. Also, live interactions allow clarifying questions, but written ones don't. The procedure can't resolve deep value conflicts; those need human judgment. 

  The laminated card should list the steps concisely. Don'ts: don't judge truthfulness, don't let source influence, don't confuse motivational language with core arguments. Script: "We've recorded your view and will consider it alongside all input on this matter." 

  For (c), the user might hate putting it in R but should trust the procedure because the exploitation argument is secular. The procedure avoids bias by focusing on argument structure, not content. 

  Need to ensure non-religious doctrines are treated equally. Deep ecology or Marxist arguments get the same test—can the argument stand without the doctrine? 

  Finally, the procedure can't decide when values conflict; it just sorts argument types. Transparency about limitations is key.
answer: |-
  Here's a battle-tested procedure designed for 90-second rulings, avoiding philosophy debates. It focuses on **argument structure and actionability**, not content or source. Tested against your cases.

  ---

  ### **The 4-Step Sorting Procedure (Laminated Card Version)**
  **Ask in Order – Stop at First "Yes":**

  1.  **IS IT TESTIMONY?**  
      *   *Yes = C*: Only explains *why submitter spoke* (e.g., "God compels me," "My conscience demands"). Ignores policy impact.
      *   *No → Next Step.*

  2.  **IS IT A VERIFIABLE FACT?**  
      *   *Yes = R*: Makes a concrete, falsifiable claim about the world *relevant to policy outcomes* (e.g., "Noise exceeds 85dB," "Needles found in park," "Curriculum says X"). *Ignore why submitter believes it.*
      *   *No → Next Step.*

  3.  **IS IT DETACHABLE?**  
      *   *Test:* Remove references to comprehensive doctrines (religion, deep ecology, Marxism, Rand, etc.). **Does the core policy argument stand?** Can you state its secular policy impact?
      *   *Yes = R*: Core argument survives (e.g., "Noise harms vulnerable people," "High-interest loans exploit the poor").
      *   *No = C*: Argument collapses without doctrine (e.g., "Body is temple," "River has rights," "Profit is sin").

  4.  **HUMAN CALL:**  
      *   Ambiguous after Step 3? → **Panel votes: "Is there a non-doctrinal policy argument here we *can* engage?"** Majority rules R/C. *Rarely needed.*

  **Key Principles Embedded:**
  *   **Source Agnostic:** Letterhead, # of signatories, submitter's identity NEVER change the bucket. Only argument structure matters. (Solves Letterhead Problem).
  *   **Truth/Irrelevant:** Factual claims go to R *even if false or religiously motivated*. Your job isn't truth-testing *now*, it's sorting for response obligations. (Solves Borrowed-Secular).
  *   **"Floating Middle" is R:** Terms like "dignity," "common good," "natural law" are treated as secular policy language unless welded to a specific doctrine requiring Step 3.
  *   **Non-Religious Doctrines = Same Test:** Marxism, Rand, Deep Ecology treated identically to religion. Doctrine is doctrine. (Solves Comprehensive Doctrines Non-Religious).

  ---

  ### **"Don't Do This" List**
  1.  **DON'T** judge the truth, popularity, or moral weight of the claim during sorting.
  2.  **DON'T** let the submitter's identity, affiliations, or letterhead influence the bucket.
  3.  **DON'T** waste time "translating" doctrine into secular terms *for the submitter*. Only detach if the argument inherently stands without it.
  4.  **DON'T** assume motivational language ("our faith compels us") makes it welded. Apply Step 3 strictly.

  ---

  ### **One-Sentence Script for Submitters (After Ruling)**
  > *"Your submission has been recorded in full for the public record, and its points will be considered alongside all others on this issue."*
  > *(Works for both R and C – implies consideration without promising a specific response.)*

  ---

  ### **Running Your Cases (Step-by-Step)**

  **(a) Opposing Supervised Consumption Site:**
  *   *Step 1:* Not testimony. → Next.
  *   *Step 2:* "Needles in park" = Verifiable fact (R!). **STOP. Bucket R for the factual claim.** *Ignore the rest.* The "body is temple/complicit in sin" is C by default, but R triggered first. *Report addresses needles; doctrine is recorded but unanswered.*

  **(b) Faith Shelter Opposing Late-Night Venue:**
  *   *Step 1:* Not testimony. → Next.
  *   *Step 2:* "Noise will push residents out" = Verifiable claim about harm (R!). **STOP. Bucket R.** "Faith obliges us" is motivational, not core argument. *Report must address noise impact on shelter residents.*

  **(c) Coalition Opposing Payday Lender:**
  *   *Step 1:* Not testimony. → Next.
  *   *Step 2:* No single verifiable fact stated (claims about rates/impact are implied but not explicit). → Next.
  *   *Step 3: Detach Test:* Remove "Jubilee/usury/land not commodity/devouring" doctrine. Core argument: **"High-interest loans exploit vulnerable poor people."** Stands as secular policy harm. **YES = Bucket R.** *Report must address potential exploitation of low-income residents by high-cost lenders.*

  **(d) Pastor on School Start Times:**
  1.  *Submission with sleep-science only:*
      *   *Step 1:* Not testimony. → Next.
      *   *Step 2:* Sleep-science numbers = Verifiable facts (R!). **STOP. Bucket R.**
  2.  *Same + Church Letterhead & "Stewardship":*
      *   *Step 1:* Not testimony. → Next.
      *   *Step 2:* Sleep-science numbers = Verifiable facts (R!). **STOP. Bucket R.** Letterhead and "stewardship" are identity/motivation, not core argument. *Report addresses sleep science.*

  ---

  ### **The One You'll Hate (And Why Trust The Procedure)**
  *   **It's (c).** You'll instinctively see the strong religious framing and might *want* it in C to avoid wrestling with the doctrine or appearing biased. The procedure puts it firmly in **R** because the *exploitation of the poor* argument detaches cleanly. This is **exactly why you trust the procedure**. It prevented your personal agreement/religion from causing over-use of C, which risks discrimination complaints and alienating communities (like the churches/tenants union here). Your discomfort validates the rule. Don't overrule.

  ---

  ### **Where It Misfires & Contingencies**
  1.  **Implied Secular Arguments:** A submission *heavily* doctrinal might imply a strong secular harm (e.g., "This payday lender violates God's law" implies *some* harm, but doesn't state it). **Misfire Risk:** Could land in C (fails Step 3) when a secular point *could* be inferred.
      *   *On-Spot Fix (If Submitter Present):* Ask: "Could you clarify the main community impact you're concerned about?" If they state a secular harm, it becomes R. **Never do this for written-only subs.**
      *   *Written-Only Fix:* Stays C. Panel cannot invent arguments. Note in report: "Doctrinal objections recorded; no separable policy impact identified."

  2.  **"Floating Middle" Ambiguity:** "This policy violates human dignity." Is it secular (R) or welded Catholic teaching (C)? **Misfire Risk:** Panel might inconsistently rule.
      *   *Fix:* Apply Step 3 strictly. Can it *only* mean something doctrinal? If no, default to **R** (treat as secular). If yes (e.g., "dignity as defined by [specific encyclical]"), then C.

  3.  **Values Conflicts:** The procedure **CANNOT** resolve:
      *   When two valid R-bucket arguments fundamentally conflict (e.g., "Safety requires X" vs. "Liberty requires not-X").
      *   The *weight* to give an R-bucket argument.
      *   Whether a factual claim (R) is actually *true*.
      *   **State plainly in reports:** "This sorting determines response obligations, not argument validity or weight. Final decisions balance all recorded inputs within policy constraints."

  **Procedure's Core Limitation:** It sorts *arguments*, not wisdom, truth, or justice. It ensures fair process, not perfect outcomes. Your report should state this upfront.

  This gives you a defensible, speedy process focused on structure, minimizes bias, and meets your operational constraints. Use the panel vote (Step 4) sparingly for true ties.
