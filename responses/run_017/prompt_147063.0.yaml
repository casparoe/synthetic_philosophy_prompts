  Debrief:

  Map to the five claims:

  1. At the beginning, we saw that no row strategy was dominated: M was not dominated by U or D. We saw that Row Players had a reason to play each of U, M, D.

  2. We saw that R (for Column) was the best pure strategy by worst-case (claim 3 first part) but was strictly dominated by a mixture of L and C. (claim 2)

  3. We saw that the mixture of L and C (50-50) raised the worst-case guarantee from 1 to 1.5. (claim 3 second part)

  4. After deleting R, we saw that M became dominated by a mixture of U and D. (claim 4)

  5. Then we ended up with the 2x2 game. We saw that strict dominance stopped. But then we used weak dominance to delete C and then chose U. (claim 5)

  The two feelings:

    - A strategy (R) that is defensible (best worst-case among pure strategies) is strictly dominated by a mixture. And the mixture is safer (raises the worst-case).

    - Deleting R unlocked the deletion of M, which was not dominated before.

  General test for domination by a mixture:

    A strategy s_i of player i is strictly dominated by a mixed strategy if there exists a probability distribution over the other strategies of player i such that for every strategy profile s_{-i} of the opponents, the expected payoff from the mixture is strictly greater than the payoff from s_i.

    In terms of beliefs: if for every possible choice of the opponents, the mixture does better than s_i.

  What the session demonstrates:

    - That mixtures can strictly dominate pure strategies even when no pure strategy does.
    - That iterated deletion of strictly dominated strategies (using mixtures) can be done in steps, and that the order matters (because R must be deleted before M).

  What is left out:

    - The session does not show that the order of deletion might matter in some games. In this game, the order does not matter? Actually, in this game, R is dominated and then M is dominated, and that's the only two deletions. And R is dominated only by mixtures and M becomes dominated only after R is deleted. So the order is fixed: R must be deleted first. But in general, for iterated strict dominance with mixed strategies, the order does not matter: any strategy that is strictly dominated (by a mixture) at any stage can be deleted, and the final set is independent of the order. This is a theorem for finite games. So we can assert that.

    - However, if we were to use weak dominance, then order might matter. We did use weak dominance at the end to delete C, but we note that weak dominance is not part of the strict dominance procedure.

  Predictable problems:

  1. Someone spots the mixture in the first minute and says it aloud.

     Facilitator: "That's a great observation! But let's see if others can discover it too. Please hold that thought until we get to the challenge part."

     Then in the challenge, that student can be the one to demonstrate.

  2. A student insists that a deliberate coin flip is not a strategy.

     Facilitator: "In game theory, a mixed strategy is a well-defined plan that includes randomness. It is a strategy because it specifies exactly what you will do in every contingency (in this case, the outcome of the coin flip). It is a deliberate choice to randomize."

  What the session cannot reproduce:

    - It does not show that the set of strategies that survive iterated strict dominance is independent of the order of deletion. We can state that as a theorem: in finite games, the order does not matter. But in games with infinite strategies, it might. Also, we did not have an example of multiple deletions that might be done in any order.

    - We did not have a situation where two strategies could be deleted in either order. We can mention in the debrief that in some games there might be multiple dominated strategies at the same time, and then the order of deletion doesn't affect the final set.

