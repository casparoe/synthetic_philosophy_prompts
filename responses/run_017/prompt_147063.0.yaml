  What the session leaves out:

    - The general algorithm for iterated mixed-strategy dominance: we only did two deletions. We did not show that the order of deletion does not matter, but we can state the theorem.

    - We did not allow students to use mixtures in their actual play (except in the challenges) because we were using pure strategies in the stages. But the challenges showed the mixtures.

    - The session does not address the possibility of multiple mixtures or the computational aspect of finding dominated strategies.

