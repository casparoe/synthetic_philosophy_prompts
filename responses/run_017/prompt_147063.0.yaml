  **The Coin Flip Challenge: Discovering How Randomness Reveals Dominance**

  **Materials for Participants:**

  **Handout 1 (Distributed at start; Column Players receive left side, Row Players right side):**  
  ```
  COLUMN PLAYER PAYOFFS (WORST-CASE SCORED)          ROW PLAYER PAYOFFS (ACTUAL PAYOFF)
  Your goal: Maximize your minimum payoff.           Your goal: Maximize your payoff against Column's choice.
  Worst-case = lowest payoff you could get.          Column Players are told: 
  Choose L, C, or R.                                "Pick L, C, or R to avoid low payoffs."
                                                     Their worst-case payoffs: L=0, C=0, R=1 → They’ll likely pick R.
  Against Row’s choice:                             Against Column’s choice:
       |  U    M    D                                     |  L    C    R
  -----|-------------                               -----|-------------
  L    |  3    0    2                              U    |  4    0    0
  C    |  0    3    2                              M    |  1    1    5
  R    |  1    1    1                              D    |  0    4    1
  ```  
  *Write your choice (L, C, or R for Column; U, M, or D for Row) on an index card. Keep it secret.*  

  **Facilitator Moves & Script (First Stage: 15 min):**  
  1. *After choices:* "Column Players, reveal your cards. Tally counts for L/C/R on board. Most chose R? Yes, because R guarantees 1—better than L’s 0 or C’s 0. Row Players paired with R: if you chose M, you got 5; others got less."  
  2. *Challenge:* "Column, R gives 1. Can you guarantee *more* than 1? Use your coin to mix L and C. Find probabilities making *every* Row choice give over 1. You have 5 minutes."  
  3. *When solved (e.g., 50-50 L/C):* "Against U: 50%×3 + 50%×0 = 1.5 > 1. Against M: 50%×0 + 50%×3 = 1.5 > 1. Against D: 2 > 1. So a coin flip guarantees 1.5—beating R. R is deleted."  

  **Handout 2 (After R deleted; 10 min):**  
  ```
  COLUMN PLAYER (WORST-CASE SCORED)                 ROW PLAYER (ACTUAL PAYOFF)
  Now only L or C.                                  Now Column only has L or C.
       |  U    M    D                                     |  L    C
  -----|-------------                               -----|---------
  L    |  3    0    2                              U    |  4    0
  C    |  0    3    2                              M    |  1    1
                                                    D    |  0    4
  ```  
  *Column: Choose L or C. Row: Choose U, M, or D.*  

  **Facilitator Moves & Script (Second Stage: 15 min):**  
  1. *After choices:* "Column, L or C? Tally. Row, what did M get? If Column played L, M→1; if C, M→1. Always 1."  
  2. *Challenge:* "Row, beat M in *both* cases. Use your coin to mix U and D. Find probabilities giving >1 against L *and* >1 against C. 5 minutes."  
  3. *When solved (e.g., 50-50 U/D):* "Against L: 50%×4 + 50%×0 = 2 > 1. Against C: 50%×0 + 50%×4 = 2 > 1. So M is deleted."  

  **Handout 3 (After M deleted; 5 min):**  
  ```
  BOTH PLAYERS (FINAL STAGE)
  Column (worst-case): L or C. Row (actual payoff): U or D.
          |  L    C
  --------|---------
  U      |  4    0
  D      |  0    4
  Column’s payoffs: 
  Against U: L=3, C=0 
  Against D: L=2, C=2 → Worst-case: L=min(3,2)=2; C=min(0,2)=0.
  ```  
  *Column: Choose L (guarantees 2) or C. Row: Choose U or D.*  

  **Facilitator Moves & Script (Third Stage: 5 min):**  
  - *After choices:* "Column chose L? Then Row playing U gets 4, D gets 0. Winner: Row with U and Column with L."  
  - *Award chocolate to highest-scoring Row in final stage.*  

  **Debrief (30 min):**  
  1. **Map session to claims:**  
     - (1) Start: No row dominated (U beat M if L; D beat M if C; M beat both if R). M not weakly dominated.  
     - (2) R was best pure for Column (guaranteed 1) but dominated only by L/C mix (guaranteed 1.5).  
     - (3) R’s mix raised worst-case (1→1.5).  
     - (4) After R gone, M dominated only by U/D mix (pure U/D couldn’t dominate it).  
     - (5) Strict dominance stops after deleting R then M. Weak dominance (L over C) would lead to (U,L), but weak dominance is riskier—we avoid it.  
  2. **General test:** "Strategy S is strictly dominated by a mix if a coin flip over *other* strategies beats S against *every* opponent move. No need to check all mixes—just see if S is never a unique best response."  
  3. **Session limits:**  
     - Demonstrates: Dominance by mixes, iteration unlocking new deletions (R gone → M dominated), mixes as safer.  
     - Asserts: Order of deletion doesn’t matter in finite games (here, R *must* go first). Weak dominance can change outcomes if used, but isn’t part of strict dominance.  
  4. **Stop point:** Survivors (U,D,L,C) include (D,C) payoffs (4,2)—unintuitive but not strictly dominated. Weak dominance would delete it, but we flag this as separate.  

  **Predictable Issues & Responses:**  
  - **"Why flip coins? That’s not deciding!"**: "A coin flip *is* a decision—a plan to handle uncertainty. It beats pure strategies by covering more cases."  
  - **Early mix-spotter**: "Great! Keep it quiet—let others discover. You’ll demonstrate later."  
  - **Column doesn’t pick R initially**: If some pick L/C, show their worst-case (0) < R’s (1). Conclude R is best pure. Proceed.  
  - **Wrong mix found**: If a student proposes a non-dominating mix (e.g., 90% L for Column), compute: Against M, 90%×0 + 10%×3 = 0.3 < 1 → fails. Guide to 50-50.  

  **What the Session Leaves Out:**  
  - **Order dependence**: In finite games, iterated strict dominance (with mixes) always reaches the same result regardless of deletion order. This session can’t show alternative orders (R must be deleted first here). Debrief: Assert order-independence for finite games but note weak dominance breaks this.  
  - **Computation**: Students didn’t enumerate all mixes—they solved inequalities (e.g., 3p > 1 and 3(1-p) > 1). Debrief: Generalize to testing beliefs ("Is there *any* mix beating S against all moves?").  

  **Timeline**:  
  - 0–15 min: First stage (choices, tally, mix challenge for R).  
  - 15–30 min: Second stage (choices, tally, mix challenge for M).  
  - 30–35 min: Third stage (choices, outcome).  
  - 35–55 min: Play and challenges.  
  - 55–80 min: Debrief.
