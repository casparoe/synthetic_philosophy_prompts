  Facilitator Script:

  - Introduction (5 min): "Welcome. Today we play a game. Half of you are Row Players, half Column Players. You will make choices in stages. Column Players: you are scored by the worst-case scenario. Row Players: you get the payoff from the outcome when paired. Here are your payoffs. Read them carefully. Write your choice for the first stage on the index card. You have 2 minutes."

  - After first stage choices (10 min): Collect cards. Tally Column choices (write on board: number for L, C, R). Announce: "Most Column Players chose R. Now, for Column Players who chose R: your worst-case was 1. For those who chose L or C, worst-case 0. So R was the best pure strategy. But can you do better? I challenge you: using a coin, can you find a way to guarantee more than 1? Work individually for 3 minutes. Write down your mixture and the worst-case it guarantees."

    Then ask: "Who found a mixture that guarantees more than 1?" Get answers. Show the 50-50: 1.5. "So we delete R because it is strictly dominated by this mixture."

  - Second stage (15 min): "Now, Column Players, you can only choose L or C. Row Players, you still have U, M, D. But Column Players are now choosing between L and C. Here are your new handouts. Make your choice for the second stage." (Wait 2 min, collect.)

    Tally Column choices (L, C) and Row choices (U, M, D). Pair and report some payoffs. Then: "Notice that Row Players who chose M got 1 regardless of Column. But what if you had flipped a coin between U and D? Let's compute: 50% U, 50% D. If Column plays L: 0.5*4 + 0.5*0 = 2. If Column plays C: 0.5*0 + 0.5*4 = 2. So 2>1. So M is strictly dominated by this mixture. We delete M."

  - Third stage (10 min): "Now, Row Players: U or D. Column Players: L or C. Column Players: what is your worst-case? L: min(3,2)=2; C: min(0,2)=0. So choose L. Row Players: if Column chooses L, you get 4 for U, 0 for D. So choose U." Collect choices. Then: "We end up at (U,L): (4,3)."

  - Debrief (20 min): Go through the five claims and how they were demonstrated. Then state the general condition for domination by a mixture. Note that the procedure stops at the 2x2 game under strict dominance, and that weak dominance is a different concept. Also, assert that in finite games the order of deletion does not matter for strict dominance with mixed strategies.

