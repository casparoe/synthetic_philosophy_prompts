answer: |-
  1.  Dennett's narrator vividly feels located in Tulsa while controlling Hamlet and asserts "here I am" there; doesn't this strong intuition directly challenge your claim that the person is solely located with Yorick? If you argue this feeling is a compelling illusion, does that render *all* sensory-based location claims potentially illusory, including my current feeling of being here?
  2.  In my trial, the control loop closing via an external processor introduces a 200-millisecond delay; since my volitional commands and sensory feedback must traverse this external path, doesn't this relocate the essential causal loop of agency outside the skull? Given that you locate the person where cognition/thought occurs, but this loop is now partially external, does the person's location shift to encompass this processor where volition and sensation are integrated?
  3.  You argue the person is wherever thoughts are tokened (Yorick), but consider if Yorick is moved to Houston while Hamlet remains in Tulsa, and the narrator's experience remains unchanged – wouldn't he still sincerely report being in Tulsa? If you maintain he is now truly in Houston despite his unchanged experience and report, doesn't this sever the person's location entirely from their phenomenal perspective?
  4.  If the biological link fails in my trial and the backup emulation seamlessly takes control of the remote body, where is the person located then? If you contend the original person ceases to exist because the biological brain is no longer driving the body, and the emulation is merely a new entity controlling it, does this mean the person is annihilated by a mere control system switch, despite behavioral continuity?
  5.  Suppose we gradually replace Yorick, neuron-by-neuron, with a functionally identical prosthetic emulation, keeping Hamlet operational; if the person persists, does their location migrate to the prosthetic? If you deny migration and insist the person ceases to exist upon full replacement despite functional continuity, doesn't this contradict the brain-bound view's core reliance on function over biology?
