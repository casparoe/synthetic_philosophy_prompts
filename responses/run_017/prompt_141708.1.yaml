prompt: |-
  I teach a 300-level ancient philosophy seminar and I'm writing the take-home final right now (90 minutes, hard cap of 1200 words per answer, so I can't ask for two questions' worth of work). Most of them have read Nicomachean Ethics book V and Politics book I in translation. What I want from you is one question on Aristotle on money and exchange that is *not* the usual "explain oikonomia vs chrematistike and retell the story about Thales and the olive presses". Almost everyone can do that in their sleep and it tells me nothing.

  The crux I actually care about, and that I've been turning over in seminar for two weeks: Aristotle seems to need money to be two incompatible things at once. In NE V.5 he writes that

  "all commodities exchanged must be able to be compared in some way. It is to meet this requirement that men have introduced money; money constitutes in a manner a middle term, for it is a measure of all things, and so of their superior or inferior value, that is to say, how many shoes are equivalent to a house or to a given quantity of food."

  but also that

  "And this standard is in reality demand, which is what holds everything together, since if men cease to have wants or if their wants alter, exchange will go on no longer, or will be on different lines. But demand has come to be conventionally represented by money; this is why money is called nomisma (customary currency), because it does not exist by nature but by custom (nomos), and can be altered and rendered useless at will."

  Then in Politics I he says money is "nothing by nature but entirely a convention, because when those who use it have changed the currency it is worth nothing, and because it is of no use for any of the necessary needs of life", and in the same breath that "usury is most reasonably hated, because its gain comes from money itself and not from that for the sake of which money was invented" and so is "of all forms the most contrary to nature". You can't have it both ways: if money has no nature at all, calling a use of it "contrary to nature" looks empty; if it has a nature or a proper end (exchange), then it isn't nothing but convention.

  Here is a made-up distinction I've been useing in lectures and want the question to force them to deploy. Call a currency a **shadow-measure** if the exchange-proportions among goods are what they are anyway and money merely records them; call it a **stamp-measure** if those proportions are indeterminate until a single unit is imposed by agreement, so that the currency is what brings the commensurability into being. And here is a case I made up: the city of Oinoe has no coin at all. It keeps a public register of tallies; the unit, a "day", is defined as the grain a grown man needs for a day; debts are transferred by being written into the register. A lender transfers 100 days to a shipowner on condition of getting 110 days back in a year's time.

  So, three things please:

  1. The question itself. Three parts at most. It should make them (a) say which of the two readings of the measure the NE text supports, and show where each reading gets its grip in those two sentences, (b) explain why the "nothing by nature" claim and the usury claim are in tension, and say whether the shadow-measure / stamp-measure distinction lets Aristotle off the hook and what it costs him if it does, and (c) work the Oinoe case: is tally-money at interest more, or less, contrary to nature than the same deal in silver, and what does the answer show about whether his real target is the material, the convention, or the practice? Someone should be able to use all the right Greek words — chreia, nomisma, chrematistike, tokos — and still only get a B if they haven't actually seen the tension.

  2. A model answer of roughly 700–800 words.

  3. A marking scheme out of 25. I want the specific moves an A answer has to make named, and named separately from what a B answer does, plus a one-line note per criterion on how people typically get it wrong or wriggle. Where the strongest or most tempting *wrong* answer comes from, tell me that too — I'd rather pre-empt it than have to argue with it in the margins.

  One thing: no secondary literature. Nothing in the model answer or the scheme should require a citation or a bibliography; a student who knows the two texts and has been awake in seminar should be able to score full marks, and so should you. If a move needs a footnote to be credited, cut it. I'd also rather you didn't just restate my framing back at me in fancier words — if you think I've mis-stated the crux, say so in the question instead of papering over it.
reasoning: |-
  Okay, let me approach this systematically. The professor wants an original exam question on Aristotle's money theory that avoids common tropes and focuses on the fundamental tension they've identified. The key elements to address are:

  First, the core paradox: Aristotle simultaneously claims money is (1) a necessary measure for exchange based on demand, and (2) a purely conventional entity with no intrinsic value. This creates tension when he condemns usury as "contrary to nature."

  Second, the professor's proposed framework:
  - Shadow-measure (money reflects pre-existing values)
  - Stamp-measure (money creates commensurability)

  Third, the Oinoe case study testing whether interest in tally-money is more "natural" than metallic money.

  I need to construct a question that forces students to:
  1. Analyze NE V.5 through the shadow/stamp lens
  2. Resolve the politics I tension between conventionality and natural function
  3. Apply the framework to Oinoe to reveal Aristotle's true target

  The model answer should demonstrate:
  - How shadow-measure interpretation fits NE V.5's demand theory
  - Why stamp-measure fails to explain money's conventionality
  - That the tension persists because Aristotle needs money to be metaphysically conventional but functionally natural
  - Oinoe showing interest remains unnatural regardless of material

  For the rubric:
  - Top marks (A range) for naming and resolving the core paradox
  - Mid marks (B) for describing but not resolving tension
  - Lower marks (C/D) for missing Greek terms or misreading texts

  Common pitfalls to preempt:
  - Equating "nomisma" with pure conventionalism
  - Missing that Oinoe's grain-based system still commodifies sustenance
  - Overlooking Aristotle's deeper concern with infinite acquisition

  The question phrasing must force engagement with the paradox rather than allowing descriptive summaries. The Oinoe case is crucial because it isolates whether Aristotle objects to monetary medium or the practice itself.
answer: |-
  ### 1. The Question (25 points total)  
  **Aristotle’s two-faced money: Shadow-measure, stamp-measure, and the problem of usury**  
  Drawing *only* on *Nicomachean Ethics* V.5 (1133a–b) and *Politics* I.8–10 (1256a–1257b), address the following:  
  **(a)** Aristotle calls money a "measure" of value but insists it exists "by custom" (νόμῳ, *nomǭi*). Does the *Nicomachean Ethics* passage better support interpreting money as a **shadow-measure** (recording pre-existing exchange ratios) or a **stamp-measure** (creating commensurability through convention)? Identify the lines supporting *each* reading and explain why one prevails. (8 points)  
  **(b)** In *Politics* I, Aristotle claims money is "nothing by nature" yet condemns usury (τόκος, *tokos*) as "most contrary to nature." Why does this generate tension? Using your analysis from (a), evaluate whether the shadow/stamp distinction resolves this tension. If it does, what philosophical cost does Aristotle incur? If not, why not? (10 points)  
  **(c)** In the city of Oinoe, loans in grain-based tallies ("days") bear interest. Is this practice *more* natural, *less* natural, or *equally* unnatural as usury in silver coin? What does this reveal about whether Aristotle’s objection targets: (i) money’s *material* (e.g., silver), (ii) its *conventional status* (νόμισμα, *nomisma*), or (iii) the *practice* of interest itself? Justify using Aristotle’s principles. (7 points)  

  ---

  ### 2. Model Answer (750 words)  

  **(a)** Aristotle’s *Nicomachean Ethics* V.5 better supports money as a **shadow-measure**. He states exchange depends on a pre-existing standard: "demand" (χρεία, *chreia*), which "holds everything together" (1133a26–27). Money merely "represents" (*ginetai... symbolon*) this natural standard "conventionally" (1133a30–31). The shadow-measure reading grips Aristotle’s claim that exchange ratios (e.g., shoes for a house) exist independently: "all goods must be measured by some one thing" (1133a25), and money "becomes a sort of middle term" (μέσον, *meson*) to quantify *already comparable* needs (1133b20). Conversely, the stamp-measure reading gains traction where Aristotle calls money a "measure" (μέτρον, *metron*) making goods "commensurable" (σύμμετρα, *symmetra*, 1133b17–18), *implying* it imposes unity. Yet this is secondary: commensurability arises from χρεία, with money as its symbolic placeholder. Thus, the shadow-measure prevails—money reflects natural demand, not creates value.  

  **(b)** The tension arises because Aristotle’s *Politics* I claims money is purely conventional ("nothing by nature," 1257b10–11) and "worth nothing" if users reject it, yet condemns usury (τόκος) as "most contrary to nature" (1258b3–8). If money *literally* lacks a nature, calling usury "unnatural" is incoherent—one cannot violate a non-existent telos. If money *has* a natural function (enabling fair exchange, per *NE* V.5), then its conventional status is overstated. The shadow/stamp distinction *fails* to resolve this. Adopting the shadow-measure (as *NE* suggests) clarifies money’s natural purpose: facilitating reciprocal need-satisfaction (ἀντιπεπονθός, *antipeponthos*, *NE* 1133a10). Usury perverts this by making money breed money, divorcing exchange from use (χρεία). But Aristotle’s *Politics* insists money is "entirely convention" (1257b11–12), undermining any robust "nature" for usury to violate. The distinction thus *exposes* Aristotle’s deeper dilemma: he needs money to be metaphysically arbitrary (to condemn chrematistic accumulation) but functionally purposive (to condemn usury). The cost? Either he equivocates on "nature," or he must concede money has a *weak* natural basis in χρεία—which risks legitimizing profit-seeking if tied to need. If we force the stamp-measure reading, the tension worsens: if money *creates* value, usury is just another convention, not "unnatural." Aristotle avoids this but cannot reconcile his two claims.  

  **(c)** Oinoe’s tally-money usury is *equally unnatural* as usury in silver. Aristotle’s core objection is to the *practice* of interest, not material or convention. Oinoe’s "days" derive value from grain (a natural need, χρεία), making it closer to "natural" wealth-getting (οἰκονομική, *oikonomikē*) than silver coin. Yet Aristotle attacks usury because it seeks gain "from money itself" (ἐπὶ νομίσματος, *Politics* 1258b5–7), not "that for which money was invented" (i.e., exchange for needs). Oinoe’s lender profits by demanding 110 "days" from 100—a "barren" increase (*Politics* 1258b5) divorced from actual grain or its use. The tally’s grain-reference changes nothing: the *debt* is still a conventional claim (νόμισμα) detached from real χρεία. If anything, Oinoe heightens the perversion: it commodifies life-sustaining grain (*Politics* 1257b19–20 calls money "useless for life’s necessities") into an abstract token. Aristotle’s target is thus the *practice*—τόκος as "birth from money" (*Politics* 1258b7)—which treats a medium of exchange as an end. Material (silver vs. tally) and convention (coin vs. register) are secondary; his ire falls on χρεματιστική (*chrematistikē*) that ignores use-value. Oinoe confirms this: even "natural" units become unnatural when used for self-multiplication.  

  ---

  ### 3. Marking Scheme (Total: 25 points)  
  **A-Range (21–25):** Resolves the core paradox by *naming and deploying* Aristotle’s tension: money must be both conventional *and* natural-functional.  
  - **(a)** *Correctly identifies shadow-measure as primary in NE*, citing 1133a26–31 (χρεία as prior) vs. 1133b17–18 (commensurability). Shows why shadow prevails: χρεία is ontological ground. [5–6/8]  
  - **(b)** *Explicitly states the tension*: "nothing by nature" vs. "contrary to nature." Rejects shadow/stamp as *inadequate* resolution. Diagnoses cost: Aristotle equivocates on "nature" or undermines conventionalism. [8–10/10]  
  - **(c)** *Argues Oinoe usury is equally unnatural*. Ties answer to *practice* (tokos), showing material/convention are irrelevant. Uses χρεία to explain why grain-tallies still pervert exchange. [6–7/7]  
  *Common miss*: B students often "solve" (b) by ignoring *Politics*'s "nothing by nature" or conflating it with *NE*.  

  **B-Range (16–20):** Describes but doesn’t resolve tension; uses texts accurately but superficially.  
  - **(a)** Identifies both readings but doesn’t justify why shadow prevails; or misreads commensurability lines. [3–4/8]  
  - **(b)** Notes tension but asserts shadow/stamp resolves it (e.g., "shadow makes usury unnatural"). Omits cost (e.g., doesn’t see how conventionalism weakens "nature"). [6–7/10]  
  - **(c)** Claims Oinoe is *more natural* (due to grain) or *less natural* (due to abstraction), missing Aristotle’s focus on practice. [4–5/7]  
  *Strongest wrong answer*: Asserts Oinoe is "more natural" because grain has use-value (χρεία), ignoring that interest still severs gain from need.  

  **C/D-Range (≤15):** Misreads texts; misses Greek terms; avoids tension.  
  - **(a)** Misattributes stamp-measure to *NE*; omits χρεία. [0–2/8]  
  - **(b)** Denies tension exists; or claims usury is unnatural *because* money is conventional (non sequitur). [0–5/10]  
  - **(c)** Focuses only on material (silver vs. grain) or convention (tally as "not real money"). [0–3/7]  
  *Tempting error*: "Money’s conventionalism (*nomisma*) *makes* usury unnatural"—contradicting *Politics*'s claim that convention alone lacks a nature to violate.  

  **Key discriminators for A grades**:  
  - In (b), *must* say shadow/stamp *fails* to resolve tension (not just "helps").  
  - In (c), *must* conclude Oinoe is *equally unnatural*.  
  - *Avoids* "Aristotle contradicts himself"—instead, names the *necessary duality* of money’s role.  

  **Why this works**:  
  - Preempts the "Oinoe is natural" error by forcing analysis of interest *as practice*.  
  - Makes "tension" non-optional: B answers will try to "fix" Aristotle; A answers show why he’s stuck.  
  - Tests textual precision (e.g., χρεία in *NE* vs. νόμισμα in *Politics*) without requiring Greek.
