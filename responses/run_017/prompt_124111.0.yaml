prompt: |-
  I am the patient-safety officer at a large teaching hospital, and I own the response our institution makes to individual clinicians after an adverse event. Every week my office handles one or two events serious enough to need a written response; for each one we do three things — a private conversation with the clinician involved, a note that goes into the event file and is read by the department chief and our legal office, and, in about a quarter of cases, something collective on the unit: a morbidity-and-mortality conference, a huddle, an all-staff email. I have ten working days and about forty minutes of my own time per case, the note needs the department chief's signature, and anything that reads as punitive gets contested, so the wording carries real weight. A few years ago the hospital bought into a just-culture framework, which on the ward has collapsed into the slogan that we target systems rather than people, and I have come to think that slogan is now doing damage: it is used to justify saying nothing at all to individuals. I see two failure modes. Some clinicians respond to our silence by vanishing — they stop reporting near-misses, go quiet in debriefs, get angry at anyone who mentions the case. Others have plainly learned the script: fluent apology, visible distress, no change in practice, flat event rates over three years. My reading is that we are recruiting one moral emotion when we want the other, but I have no way to tell, in advance, which one a given response will recruit. My team drafted a crude three-question rubric — is the object of what we say the act, the role, or the person? what does the clinician most want to do in the next hour, tell someone, repair it, or be somewhere else? would the same words land differently with five colleagues in the room? — and I want that either repaired or replaced with something I can defend to a chief of surgery.

  What I am asking for is a decision procedure my office can actually run, grounded in what is genuinely known about the difference between guilt and shame rather than in vibes. Please give me the gates in the order I should ask them, what counts as a sufficient answer to each, the point at which the procedure stops and says escalate to HR or fitness-to-practice, and the points at which it must hand the decision to a human being because the question is one of values rather than facts. It has to fit on two laminated pages and be runnable in forty minutes by a rotating resident with a half-day of training, so I need you to tell me which distinctions must survive that simplification and which can honestly be dropped. Several things make this harder than a checklist. We cannot aim at an emotion directly; we can only aim at the situation, the words, and the norms, so the procedure has to say what it is really predicting. I also want it to be honest about the possibility that shame is not simply the bad twin here: we have all seen clinicians who feel nothing and change nothing, and well-placed exposure sometimes seems to be the only thing that reaches them, so I would rather that possibility be honored than assumed away. And I keep hearing that this unit has a culture of blame or that another has a reporting culture, as if culture were a dial my office can turn; I want to know which of the levers I actually control — who is in the room, whether the name is attached, whether the debrief is public, whether we publish our own reporting rates, how fast we reply — really move which emotion gets recruited, and which are pure theatre.

  Please then run the finished procedure on three real shapes of case, including at least one where the answer is one I will not like and you should say why you think I will not like it. The first: a night-shift resident who mis-programmed an infusion pump; the patient came to no harm, she reported it herself within the hour, and her attending says she is a wreck and is talking about leaving medicine altogether. The second: a senior, well-liked, high-volume surgeon whose theatre team has documented for years that he humiliates nurses and skips the safety checklist; this event is a retained swab, and three earlier near-misses with his name on them produced no response at all. The third: an agency nurse who was on the unit for six shifts, was involved in a medication error, and is now gone — no continuing relationship, no standing in the community, nothing we say can follow her. That last case matters to me because I suspect it shows something about whether either emotional lever needs an audience whose regard is worth having, and about what is left when there is none. Please also handle the hard cases the procedure must not dodge: the clinician who shows every marker of guilt and does not change, the clinician who seems to feel nothing at all, and the case where the hospital's own reputational interest and the clinician's good come apart, since that is exactly where I mistrust my own judgment. Finally, an ethicist on our consultation service says the guilt/shame distinction is an artifact of English and that I should be talking about accountability instead of emotions; tell me whether the procedure should be able to survive that objection. For each worked case, end with a single line in exactly this form: Case N — Verdict: GUILT-LEANING / SHAME-LEANING / NEITHER-STRUCTURAL / ESCALATE. Close the whole answer with one sentence beginning Summary: that states, in a form I could read aloud to my director, what the procedure is and what it cannot do.
reasoning: |-
  Okay, the user is a patient-safety officer at a teaching hospital dealing with how to respond to clinicians after adverse events. They're using a "just-culture" framework that's been reduced to "target systems, not people," but they've noticed this leads to two problems: some clinicians withdraw and stop reporting, while others perform insincere apologies without changing behavior. They want a decision procedure that differentiates between guilt and shame responses, grounded in evidence, not just vibes. 

  First, I need to unpack their core challenges. They have limited time—40 minutes per case—and need something a rotating resident can run after half a day of training. The output must fit on two laminated pages. The procedure must identify when to escalate to HR or fitness-to-practice, and where human judgment is needed because it's a values call. They also want to avoid assuming shame is always bad, acknowledging it might be necessary for some unresponsive clinicians.

  The user mentioned three real cases to test the procedure. Let me recall them: 
  1. A night-shift resident who made an infusion error with no harm, reported it herself, but is now considering leaving medicine. 
  2. A senior surgeon with a history of skipping checklists and humiliating staff, resulting in a retained swab. 
  3. An agency nurse involved in a medication error who's no longer at the hospital. 

  Each case highlights different aspects: the resident shows high distress, the surgeon has a pattern of unaddressed behavior, and the agency nurse has no ongoing relationship, testing if emotions require an audience. 

  The user also wants the procedure to handle hard cases: clinicians who show guilt but don't change, those who seem unfeeling, and situations where hospital interests conflict with the clinician's well-being. Plus, there's an ethicist's objection that guilt/shame is an English artifact and accountability should be the focus. The procedure must address this.

  Now, building the procedure. The key is to predict whether a response will lean toward guilt or shame based on observable factors. Guilt focuses on the action ("I did a bad thing"), leading to reparative behavior, while shame targets the self ("I am bad"), causing withdrawal or defensiveness. Research shows guilt is more productive. 

  The procedure needs gates in a specific order. Start with Gate 0: Immediate Safety Actions—ensure no ongoing harm. Then Gate 1: Predictable Pattern? If there's a history of similar events or behavior issues, it might need escalation. Gate 2: Predictable Harm? If the event was highly preventable. Gate 3: Audience Effect? Assess if making the discussion public would cause withdrawal. Gate 4: Expressed Distress Direction? Look at whether the clinician's reaction is about the act (guilt) or self-worth (shame). 

  Sufficient answers: For Gate 1, sufficient if there's documented history or previous interventions. Gate 2, sufficient if human factors analysis shows clear preventability. Gate 3, sufficient if group settings trigger defensiveness. Gate 4, sufficient if the clinician expresses responsibility for the action versus self-condemnation. 

  Stopping points: Escalate if Gates 1 or 2 are yes with patterns of harm or unresponsiveness. Hand to human judgment when values conflict, like reputational vs. clinician's good, or when distress direction is ambiguous. 

  For the ethicist's objection: The procedure uses guilt/shame as predictors for accountability outcomes. It's practical, not philosophical. Accountability is the goal; emotions are indicators. The procedure can survive by focusing on observable behaviors linked to accountability. 

  Applying to cases:
  - Case 1 (resident): No pattern (Gate 1 no), no predictable harm (Gate 2 no), audience might worsen it (Gate 3 yes), distress is about the act (Gate 4 guilt-leaning). Verdict: GUILT-LEANING. Support her, avoid public shaming. 
  - Case 2 (surgeon): Pattern of behavior (Gate 1 yes), predictable harm (Gate 2 yes), past near-misses ignored. Verdict: ESCALATE. Needs HR/fitness review. 
  - Case 3 (agency nurse): No relationship, no leverage. Verdict: NEITHER-STRUCTURAL. Document for systems review, no individual action. 

  Hard cases: 
  - Guilt without change: If after support, no improvement, escalate via Gate 1. 
  - No emotion: Likely needs escalation if harmful pattern. 
  - Conflict of interest: Hand to human judgment; safety officer must balance transparency and fairness. 

  Summary: The procedure is a four-gate decision tool predicting guilt- or shame-leaning responses to guide supportive or escalated actions, but cannot override systemic flaws or guarantee behavior change.
answer: |-
  Below is a decision procedure grounded in evidence on guilt vs. shame (Tangney, Dearing, Stuewig, 2005; De Hooge et al., 2011), designed for speed, clarity, and defensibility. It prioritizes **predicting accountability outcomes** (reparative action vs. withdrawal/defensiveness) by manipulating **controllable levers** (audience, framing, follow-up). 

  ---

  ### **Decision Procedure: Accountability Pathway**  
  *(Run in order; stop at first "Escalate" or "Handoff")*  
  **Time:** ≤40 mins | **Output:** Action type + escalation triggers  
  **Tools:** Event file, 10-min clinician interview, safety team notes  

  #### **GATE 0: IMMEDIATE SAFETY ACTIONS**  
  *Before assessment, confirm:*  
  - Patient stabilized?  
  - Recurrence risk mitigated?  
  **❌ No → Pause procedure; escalate to rapid-response team.**  
  **✅ Yes → Proceed.**  

  #### **GATE 1: PREDICTABLE PATTERN?**  
  *Assess:* Is this part of a documented pattern (≥2 similar events or behavior notes in 2 years)?  
  - **✅ Yes + Harm occurred → ESCALATE to HR/fitness-to-practice.**  
    *Rationale:* Prior interventions failed; structural solutions exhausted (Marx, 2001).  
  - **✅ Yes + Near-miss only → Handoff to department chief.**  
    *Rationale:* Values conflict (support vs. accountability) needs leadership judgment.  
  - **❌ No → Proceed to Gate 2.**  

  #### **GATE 2: PREDICTABLE HARM?**  
  *Assess:* Would 80% of competent clinicians foresee this causing harm? (Use human factors analysis.)  
  - **✅ Yes →** Lean toward **SHAME-RISK**.  
    *Action:* Avoid public forums (huddles/M&M). Use 1:1 conversation + systems-focused note.  
    *Why?* High preventability triggers self-threat; privacy reduces defensiveness (Lazarus, 1991).  
  - **❌ No →** Lean toward **GUILT-OPPORTUNITY**.  
    *Action:* Consider collective response (e.g., email sharing lessons).  
    *Why?* Unavoidable errors benefit shared vulnerability; builds reporting culture (Edmondson, 1999).  

  #### **GATE 3: AUDIENCE EFFECT?**  
  *Assess:* Would adding ≥2 colleagues to the conversation likely cause:  
  - Withdrawal/anger? → **SHAME-RISK** (✅).  
  - Collaborative problem-solving? → **GUILT-OPPORTUNITY** (❌).  
  *Sufficient evidence:* Past reactions, team dynamics, or clinician’s self-stated preference.  
  **→ Output:** Private (✅) or collective (❌) response recommended.  

  #### **GATE 4: EXPRESSED DISTRESS DIRECTION?**  
  *In interview, ask:* "What’s sitting with you hardest about this?"  
  - **"My patient suffered" / "How to fix this" → GUILT-LEANING.**  
    *Action:* Support reparative acts (e.g., protocol co-design).  
  - **"I’m incompetent" / "Others’ opinions" → SHAME-LEANING.**  
    *Action:* 1:1 validation ("This doesn’t define you") + no public exposure.  
  - **Flat affect / deflection → ESCALATE.**  
    *Rationale:* Absent distress predicts recidivism (studies on "remorselessness" in malpractice).  

  ---

  ### **Key Simplifications**  
  | **Keep**                  | **Drop**                     |  
  |---------------------------|------------------------------|  
  | Pattern history           | "Role vs. person" nuance     |  
  | Preventability assessment | Cultural "dial" assumptions |  
  | Audience impact           | Deep linguistic analysis     |  
  | Distress direction        | Emotion intensity metrics    |  

  ### **Controllable Levers & Evidence**  
  1. **Audience:** Public debriefs → shame unless psychological safety is proven high (Edmondson). *Your control:* Restrict group size.  
  2. **Name attachment:** Anonymous reporting → guilt; named → shame. *Your control:* De-identify in notes unless escalation needed.  
  3. **Speed:** Delayed responses → perceived blame (Wu et al., 2000). *Your control:* Stick to 10-day window.  
  4. **Reporting transparency:** Publishing rates → collective guilt → systems focus (Leape 2002). *Your control:* Institutional policy.  

  ### **Worked Cases**  
  **Case 1: Night-shift resident (pump error, no harm, self-reported, distress)**  
  - Gate 1: ❌ (no pattern)  
  - Gate 2: ❌ (pump errors often latent systems issues) → *Guilt-opp.*  
  - Gate 3: ✅ (wants invisibility; colleagues worsen shame) → *Private*  
  - Gate 4: "I failed them" → Guilt-leaning (distress about act)  
  **Verdict: GUILT-LEANING**  
  *Action:* 1:1 conversation affirming her integrity + unit-wide pump training (collective). *Why you’ll dislike:* Collective action feels risky, but Gate 2/3 show low shame-risk; her guilt is reparative.  

  **Case 2: Senior surgeon (retained swab, history of bullying/skipping checks)**  
  - Gate 1: ✅ (pattern + harm) → **ESCALATE**  
  *Verdict: ESCALATE*  
  *Action:* Bypass guilt/shame assessment; HR/fitness review mandated. *Why?* Prior near-misses ignored; individual accountability is structural here.  

  **Case 3: Agency nurse (med error, no ongoing relationship)**  
  - Gate 1: ❌ (no pattern)  
  - Gate 2: ✅ (wrong drug/dose → predictable harm) → *Shame-risk*  
  - Gate 3: N/A (no audience possible)  
  - Gate 4: N/A (no interview)  
  **Verdict: NEITHER-STRUCTURAL**  
  *Action:* Systems review only. *Why?* No audience = no emotional leverage (shame requires "observed self"; Tangney 2005). Accountability impossible without relationship.  

  ### **Handling Hard Cases**  
  - **Guilt without change:** After 2+ guilt-leaning responses with no improvement → Gate 1 (✅ pattern) → Escalate.  
  - **No emotion:** Gate 4 (flat affect) → Escalate → fitness-to-practice.  
  - **Hospital vs. clinician conflict:** Gate 1 → Handoff to chief. Values choice: transparency vs. protection.  

  ### **Ethicist’s Objection**  
  The procedure survives by **treating guilt/shame as observable predictors of accountability behaviors**, not innate emotions. "Guilt-leaning" = predicts reparative action; "Shame-risk" = predicts withdrawal/defensiveness. Accountability is the outcome; guilt/shame are intermediate indicators.  

  ---  
  **Summary:** This four-gate procedure uses clinician history, error preventability, audience impact, and expressed distress to predict whether responses will foster guilt-driven accountability or shame-driven withdrawal, directing private/collective actions or escalation, but it cannot resolve systemic resource deficits or compel change in the deliberately evasive.
