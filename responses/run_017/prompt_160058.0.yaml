  First, the core thesis: emotions aren't judgments or raw feelings but perceptions of action possibilities ("fleeable-here-now"). The key innovation is replacing accuracy with "aptness" - where emotions match actual affordances through trained competence. Three key arguments handle recalcitrant emotions, cognitive penetrability, and avoiding wrong-kind-of-reason problems.

  The audience breakdown is crucial:
  - Two perceptual theorists (modular perception fans) will attack the skill-based perception claim
  - Appraisal theorists (3-4) will challenge rationality/reasons-responsiveness
  - Psychologists (2 constructionists) will demand operationalization/falsifiability
  - An enactivist will reject representational content
  - The advisor sees relabeling risk, especially regarding spider-fear

  The real landmine might actually be moods (objectless anxiety) - but backward-looking emotions like grief could also undermine the affordance model. The user's deepest fear is their advisor's challenge about spider fear revealing theory failure.

  For concessions: upfront admission that "perception" is stretched beyond modular views and that rationality requires supplementing aptness. The structural weakness is defining "affective competence" without circularity. The psychologists' falsifiability challenge is the most damaging framework-level objection.

  Need to craft objections in each critic's authentic voice:
  - Perception folks: "This isn't perception, it's inference!"
  - Appraisal camp: "Where are the reasons?"
  - Psychologists: "How do we test this?"
  - Enactivist: "Why need content?"
  - Advisor: "Spider fear proves nothing?"

  Replies must be whiteboard-ready with punchlines ("Skills aren't modules!"), while flagging soft spots like mood exceptions. The unaskable question? Probably "What about objectless dread?" - but regret and meta-emotions are close runners-up.
answer: |-
  Here's your targeted Q&A prep sheet, ordered by damage potential and audience-specific phrasing. I've flagged soft spots, concessions, and landmines at the end.

  ---

  ### **Top 7 Objections & Replies**  
  *(Ordered by Damage Potential / Likelihood)*

  1. **From Modular Perception Theorists** (Philosophers of Perception)  
     *Objection:* "If perception can be cognitively penetrated by reappraisal and depends on *skills*, it's not perception—it's inference dressed in perceptual phenomenology. Encapsulation is non-negotiable."  
     **Reply (2 min):** "Perceptual expertise (e.g., wine tasting, radiologists spotting tumors) is cognitively penetrable *and* skill-based but still paradigmatically perceptual. My claim is that affective competence works similarly: it’s a trained sensitivity to affordances, not inferential reasoning. The 'glass elevator fear' case shows this: the habit persists *despite* judgment because the perceptual system is recalibrated by skill, not belief."  
     **One-Line Punch:** "Skills aren’t modules—they’re cultivated sensitivities that *reshape* perception."  
     **Soft Spot:** Doesn’t fully address why we should call this "perception" if it lacks *all* encapsulation.  

  2. **From Appraisal Theorists** (Emotions-as-Rational-Feelings Camp)  
     *Objection:* "Aptness is just reliability. If emotions aren’t responsive to *reasons* (e.g., evidence that the spider is harmless), you’ve gutted emotion’s rationality. Competence norms can’t explain why fear *should* subside when I learn the spider isn’t dangerous."  
     **Reply (2 min):** "Aptness isn’t opposed to reasons—it’s the *foundation* for them. Reappraisal works by retraining the skill: learning the spider is harmless *rewires* affordance-perception through practice (e.g., exposure therapy). Rationality isn’t lost; it’s embodied in skill-acquisition."  
     **One-Line Punch:** "Reasons retrain skills; skills ground reasons."  
     **Soft Spot:** Risk of conflating normative "shoulds" (reasons) with descriptive "hows" (skill-retraining).  

  3. **From Psychological Constructionists**  
     *Objection:* "‘Emotion’ isn’t a natural kind. If affordance-perception is your mechanism, what’s your dependent variable? What experiment would falsify this? Otherwise, it’s just redescribing folk psychology."  
     **Reply (2 min):** "Test predictions like: (1) Affordance-perception training (e.g., martial arts drills) should alter emotional responses faster than belief-based therapy; (2) ‘Recalcitrant’ emotions should correlate with sensorimotor habits (e.g., grip tension, gaze patterns) more than belief reports. Falsification: if reappraisal *always* overrides affordance-perception instantly, I’m wrong."  
     **One-Line Punch:** "Look at sensorimotor habits, not self-reports."  
     **Soft Spot:** Hard to operationalize "affective competence" cleanly.  

  4. **From Your Advisor**  
     *Objection:* "The spider case just shows *maladaptive habit*—not a deep theory of emotion. Why isn’t this just relabeling ‘misapplied habit’ as ‘inaptness’?"  
     **Reply (2 min):** "It explains why the fear *feels perceptual*: the spider still ‘affords fleeing’ due to ingrained skill, not judgment error. This also covers cases where affordances are *correct* but unlearned (e.g., novice climbers not fearing a legitimately dangerous ledge). Aptness explains why emotions can be *world-guided* without being belief-like."  
     **One-Line Punch:** "Habits can be perceptions; aptness explains their grip and corrigibility."  
     **Soft Spot:** Needs examples beyond spiders to feel less niche.  

  5. **From Enactivist**  
     *Objection:* "Affordances don’t require representational content! If emotions are direct engagements with possibilities, why burden them with ‘fleeable-here-now’ content? Aptness could just mean successful coupling."  
     **Reply (2 min):** "Content is minimal: it’s just the *specificity* of the affordance (fleeing ≠ punching). Without it, we can’t explain why fear of spiders isn’t fear of heights—or why recalcitrance *mismatches* the actual affordance. Content isn’t a ‘picture’; it’s a structured action possibility."  
     **One-Line Punch:** "No content = no mismatch. No mismatch = no recalcitrance."  
     **Soft Spot:** Enactivists will reject any talk of "mismatch" as internalist.  

  6. **From Appraisal Theorists (Round 2)**  
     *Objection:* "If aptness isn’t all-things-considered, how do you explain *conflicting* emotions (e.g., fear and excitement on a rollercoaster)? And why prioritize aptness over fittingness?"  
     **Reply (2 min):** "A rollercoaster affords both ‘fleeing’ (danger) and ‘riding’ (thrill) *simultaneously*—no conflict. Aptness prioritizes the agent’s *skill*: a novice’s fear may be apt; an expert’s excitement is apt. Fittingness is about the object’s properties; aptness is about skill-sensitive perception."  
     **One-Line Punch:** "Objects have multiple affordances; skills select which we perceive."  
     **Soft Spot:** Doesn’t resolve when one affordance *should* dominate (e.g., moral cases).  

  7. **From Modular Perception (Round 2)**  
     *Objection:* "Affordance-perception might work for fear, but what about *grief*? The ‘object’ is gone—what does it ‘afford’? This reduces emotion to motor preparation."  
     **Reply (2 min):** "Grief perceives *loss*-affordances: actions that are now *blocked* (‘callable’, ‘huggable’). It’s not motoric; it’s the perception of a world *diminished* in possibilities. Like seeing a door as ‘unlockable’ with a key you lost."  
     **One-Line Punch:** "Affordances include absence: grief is perception of what’s *no longer possible*."  
     **Soft Spot:** Pushes the boundaries of "affordance" (traditionally tied to *present* action).  

  ---

  ### **Critical Concessions to Make Upfront**  
  (Slide 2, **before** objections)  
  - **"Perception" is stretched:** "I’m expanding ‘perception’ beyond modular, encapsulated models. If you require full encapsulation, this won’t count."  
  - **Aptness ≠ full rationality:** "Aptness doesn’t capture all-things-considered rationality—it’s about *skill-guided responsiveness* to affordances. I’ll address reasons-responsiveness in Q&A."  

  ---

  ### **Genuine Framework Weakness**  
  **The Psychologists’ Objection** ("What falsifies this?") has force: if affordance-perception can’t be operationalized independently of emotion labels, the theory is circular. Your reply is empirical, but the framework risks untestability if "affective competence" is defined by its outcomes.  

  ---

  ### **Weakest Joint in Your Position**  
  **Defining "affective competence" non-circularly.** If competence just means "whatever leads to apt perception," it’s empty. *Prep this:*  
  - Tie competence to *trainable skills* with external benchmarks (e.g., a firefighter’s trained calm in danger isn’t apt because it ‘feels right’—it’s apt because it aligns with *actual survival affordances*).  
  - Cite skill-acquisition literature (e.g., Dreyfus on expertise).  

  ---

  ### **The Question You Hope Nobody Asks**  
  **"What about *moods*? Anxiety without an object has no affordance to perceive—so is your theory only for emotions?"**  
  - **Why it’s deadly:** Moods lack a clear object/affordance, yet feel perceptual. Your affordance-based story struggles here.  
  - **Reply (if asked):** "Moods are perceptions of *field* affordances—e.g., anxiety is ‘something-threatening-somewhere’—scaled to bodily readiness. But this needs more work; I’m focused on object-directed emotions first."  
  - **Landmine Rating:** Higher than backward-looking emotions (grief *can* fit) or meta-emotions (they’d have their own affordances).  

  ### **Summary Strategy**  
  - **First 2 slides:** Concede the stretch of "perception" and aptness’s limited normativity.  
  - **Whiteboard:** Use the **spider case** to illustrate inaptness (draw: skill vs. actual affordance).  
  - **Steer clear of** moods, meta-emotions, and evolutionary arguments—they’re quicksand.  
  - **Kill the advisor’s challenge** with a *non-spider example* (e.g., inappropriate calm in danger due to untrained skills).  

  You’ve got the bones of something novel. Nail the competence/rationality distinction, and you’ll force them to engage. Good luck!
