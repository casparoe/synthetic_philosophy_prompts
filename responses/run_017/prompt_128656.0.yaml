  *flips through mental Weber files* Right, the popular summary butchers several key things: Weber never called the work ethic "irrational," the Italian cities point misses his specific argument about capitalism's spirit, and that "ghost" quote is ripped from context. The France/Japan contrast needs heavy caveats too - Macron rolled back the 35h week partially, and karoshi involves corporate governance failures. 

  Most importantly, the conclusion about "no argument left" after debunking the work ethic is logically flawed. Even if work ethic is contingent, productivity concerns aren't automatically invalid. Should emphasize that in the response - policy arguments stand or fall on contemporary evidence, not just historicizing work culture. 

