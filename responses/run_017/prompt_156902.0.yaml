prompt: |-
  I teach a mid-level seminar on moral responsibility, and a group of students active in the effective altruism movement — they run our campus giving pledge — have pressed me on a practice I can't reconstruct cleanly. The practice is earning to give: a student who wants to do the most good takes the highest-paying job available, frequently at a firm whose business she would independently describe as predatory, and gives away half her salary to a charity distributing insecticide-treated bed nets against malaria. What interests me is that the defense of the practice and the scruples surrounding it seem to pull in opposite directions. The defense is the move I'll call slot-replaceability: if she turns the job down, the firm hires the next candidate; the lending, the drilling, or the ad targeting goes on regardless; and the only party who ends up worse off is the person who doesn't get the net. Her occupancy of the role makes no difference to the harm, so the harm cannot be charged to her, and the donation is pure gain. But the same students are fastidious about something like complicity: they will not take consulting fees from a fossil-fuel company even when the fee would buy the very same nets, they treat a summer at a tobacco firm as discreditable, and they care that their own name and labor not be attached to the thing. Counterfactual difference-making here; non-causal association there. A colleague in metaphysics tells me the slot argument is just the standard preemption case wearing a costume, but I'm not convinced the students' case has the right structure for that.

  So I'd like the implicit theory reconstructed, with the distinctions made explicit. Does the practice strictly presuppose a difference-making view of causal responsibility for harm, or could a view on which agency carries non-causal significance — complicity, integrity, what an action expresses or endorses — license both halves at once, and if so, how does it avoid collapsing into the consequentialism it was supposed to be an alternative to? Is slot-replaceability even sound, or does it trade on confusing the replaceability of a person with the replaceability of an output: if the harmful activity expands to absorb whichever labor is available, rather than being fixed per position, the marginal analysis changes, and I want to know how much of the practice survives once it does. Notice also that slot-replaceability, taken at face value, seems to entail that the colleague who takes the identical job and spends everything on himself does no wrong beyond failing to donate — should the students accept that, and does the practice actually require it? And there is the odd question of the money itself: the practice treats a dollar earned at a predatory firm as exactly as good, once transferred, as a dollar earned anywhere, which presupposes something about whether dollars carry their causal history with them or are morally laundered by the act of giving. Finally, the value theory: the students rank candidate charities in a single spreadsheet column, dollars per life saved, and everything that cannot be entered in that column — dignity, political empowerment, whether the recipients were consulted — silently counts as zero rather than as unknown. Is that a commitment to commensurability the practice really needs, or could a view on which some goods are incomparable rather than worthless generate the same funding pattern for quite different reasons?

  I'm rewriting my lecture on overdetermination and would like to open with this as a case, so what I need is the architecture rather than a verdict: which of these commitments the practice strictly presupposes, which it merely fits comfortably with, where its parts presuppose inconsistent things, and what would have to change in the practice if each commitment were given up in turn. Please don't tell me whether earning to give is fine; tell me what has to be true for it to be fine, and where it is philosophically underdetermined.
reasoning: |-
  Okay, the professor is teaching a seminar on moral responsibility and has a group of students involved in effective altruism who are practicing "earning to give." They take high-paying jobs at companies they consider predatory, donate half their salary to buy malaria bed nets, and justify it through "slot-replaceability." However, these same students avoid taking money from fossil fuel companies or working at tobacco firms due to complicity concerns. The professor wants to understand the underlying philosophical commitments and tensions here.

  First, I need to unpack the slot-replaceability argument. The core idea is that by refusing the job, the harm caused by the predatory company doesn't change because they'll just hire someone else. Therefore, the student isn't causally responsible for the harm, and their donation is a net positive. This relies heavily on counterfactual reasoning—comparing what happens if they take the job versus if they don't.

  But then there's the complicity concern. Even if their individual action doesn't change the outcome, associating with harmful industries feels wrong to them. This seems like a non-causal view of responsibility, where the act itself expresses endorsement or violates integrity, regardless of consequences. The tension here is between consequentialist reasoning (focusing on outcomes) and deontological or virtue ethics (focusing on actions and character).

  The professor mentioned that a metaphysics colleague thinks slot-replaceability is similar to preemption cases. In preemption, if one person's action causes harm but another would have done it anyway, the first isn't the cause. But the professor isn't sure if that fits here. I need to consider if the job market dynamics affect this. If the industry expands based on labor availability, then taking the job could increase overall harm, undermining the slot argument. That's a crucial point—how elastic is the demand for labor in these predatory industries?

  Another issue is the moral equivalence of money. The students treat dollars from a predatory job as equal to dollars earned elsewhere once donated. This assumes money is fungible and "laundered" through giving. But if dollars carry moral taint from their source, then even after donation, they might not be clean. Some ethical theories might argue that benefiting from harm taints the money, regardless of subsequent use.

  The value theory part is about how EA students quantify charity impact. They use metrics like dollars per life saved, reducing all values to a single scale. This assumes strong commensurability—that all goods can be compared on one metric. But what about intangible values like dignity or empowerment? If these are incomparable rather than zero, the funding choices might differ. The professor wonders if the same actions could be justified under a pluralistic value system.

  The professor also raises whether a colleague who takes the same job but doesn't donate is only blameworthy for not donating, not for working there. If slot-replaceability absolves causal responsibility, then yes. But that might conflict with intuitions about complicity. The students might accept this logically but still feel discomfort, leading to inconsistency.

  To reconstruct the implicit theory, several philosophical commitments are at play:

  1. **Causal Responsibility**: Slot-replaceability requires a counterfactual difference-making view. If the student's action doesn't change the harm, they're not responsible. This is challenged if the industry's harm is elastic to labor supply.

  2. **Moral Taint vs. Fungibility**: Does money retain the moral character of its source? If yes, then donating tainted money might not cleanse it. If money is fungible, then once donated, it's neutral.

  3. **Value Commensurability**: EA's focus on quantifiable metrics assumes all values can be reduced to a common scale. If values are plural and incomparable, this approach might overlook important goods.

  4. **Non-Causal Moral Concerns**: Complicity and integrity are non-consequentialist. To hold both, students might need a hybrid theory where consequences matter, but certain associations are inherently wrong. However, this risks inconsistency if the slot argument only cares about outcomes.

  Possible resolutions? The students might distinguish between direct employment and indirect support. Working for the company might feel like direct complicity, whereas taking a consulting fee is indirect. Or they might view certain industries as so harmful that any association is unacceptable, regardless of counterfactuals. But this needs a threshold or lexical priority rule to avoid collapsing into consequentialism.

  For the professor's lecture, mapping out these commitments and their interrelations is key. Highlighting where the practice is philosophically underdetermined—like the elasticity of harm or value commensurability—shows students the deeper questions behind their actions. The architecture reveals tensions between consequentialist justifications and deontological scruples, and how different assumptions change the validity of earning to give.
answer: |-
  Below is a reconstruction of the philosophical architecture implicit in the "earning to give" (ETG) practice, based on your students' stance and the tensions you describe. I'll address the core commitments, distinctions, and underdetermined elements, organized around your questions. The goal is to map the conceptual terrain—showing what *must* be presupposed, what *can* be accommodated, where inconsistencies arise, and how changes to commitments would affect the practice. I avoid endorsing or rejecting ETG, focusing instead on its conditions of possibility.

  ---

  ### **I. Core Tension: Difference-Making vs. Non-Causal Agency**
  The students' position relies on two distinct moral frameworks operating simultaneously:
  - **Consequentialist Defense (Slot-Replaceability)**:  
    - **Presupposition**: A *counterfactual difference-making* view of causal responsibility. Harm is attributable to an agent only if their action *changes the outcome* compared to a relevant baseline (here, the next-best candidate taking the job).  
    - **Structure**: The job is a "slot" with fixed output. If the student declines, the firm hires a perfect substitute; the harm (e.g., predatory lending) occurs identically. Thus, the student’s presence adds no *marginal harm* but enables *marginal good* (donations).  
    - **Metaphysical Challenge**: Your colleague is partly correct—this resembles preemption (e.g., two assassins, one of whom fires first; the second isn’t culpable because their shot was redundant). But ETG adds a twist: the "redundant" agent (the next candidate) is not an accomplice but an *indifferent replacement*. For slot-replaceability to hold, the job must be *output-fixed*: the firm’s harmful activity is insensitive to *who* occupies the role.  

  - **Deontological Scruples (Complicity)**:  
    - **Presupposition**: A *non-causal view of moral responsibility*. Actions carry normative weight based on what they *express*, *endorse*, or *constitute* (e.g., complicity, integrity violation), regardless of outcomes.  
    - **Key Distinction**: Taking fossil fuel consulting fees is rejected not because it changes outcomes (it may not), but because it *associates the agent* with harm. The act itself is seen as participatory or symbolic.  

  - **Inconsistency?**:  
    - **Tension**: Slot-replaceability assumes harm is *only* about causal difference-making. Complicity concerns reject this, appealing to non-causal norms.  
    - **Possible Reconciliation**: A hybrid theory could hold that:  
      - (a) *Consequences* govern *impersonal* duties (e.g., to maximize good via donations), while  
      - (b) *Non-causal agency* governs *personal* duties (e.g., not to "dirty one's hands").  
      This avoids collapse into pure consequentialism if non-causal duties are *agent-centered* (e.g., "I must not endorse evil, even if my endorsement changes nothing").  
    - **Risk of Collapse**: If non-causal duties are weak (e.g., easily overridden by consequences), ETG dominates. If they are strong (e.g., absolute prohibitions), ETG at predatory firms becomes impermissible. Your students likely hold a moderate hybrid: complicity matters, but not enough to override large net benefits.  

  ---

  ### **II. Key Commitments: What Must Be True for ETG to Work**
  #### **A. Causal Responsibility: Slot-Replaceability’s Soundness**
  - **Strict Presupposition**: The job must be *output-insensitive* to labor choice. If the firm’s harmful activity *expands* with labor supply (e.g., hiring more employees = more predatory loans), the student’s employment adds marginal harm. Slot-replaceability then fails.  
    - **Impact on Practice**: If harm is elastic (output scales with labor), ETG requires:  
      - Calculating the *net* effect: (Marginal harm from job) vs. (Marginal good from donation).  
      - Most predatory industries (e.g., finance, advertising) have *some* elasticity, so ETG may only be justified where elasticity is near-zero (e.g., roles with strict headcount caps).  
  - **The Colleague Test**:  
    - **Presupposition**: Slot-replaceability *does* entail that the colleague who spends on themselves commits no *additional wrong* beyond selfishness. The harm is identical either way.  
    - **Students’ Dilemma**: They must accept this or abandon slot-replaceability. If they condemn the colleague *for the job itself*, they implicitly reject difference-making and affirm complicity—undermining ETG’s defense.  

  #### **B. Moral Laundering: The Dollar’s History**
  - **Presupposition**: Money is *fungible* and *morally neutral* once transferred. A dollar’s causal history (e.g., from predatory lending) is erased by donation; only its purchasing power matters.  
    - **Alternative View**: If dollars carry "moral taint" (e.g., benefiting from harm contaminates subsequent use), donations cannot "cleanse" them.  
  - **Practice Requirement**: ETG *strictly needs* fungibility. Without it:  
    - Donations from "dirty" money may be less valuable or impermissible.  
    - Students’ refusal of fossil fuel fees would extend to ETG jobs.  

  #### **C. Value Theory: Commensurability vs. Incomparability**
  - **Presupposition**: *Strong commensurability*. All goods (e.g., lives saved, dignity, empowerment) can be ranked on a single scale (e.g., dollars per life). Non-quantifiable goods are treated as *morally negligible* (value ≈ 0) rather than incomparable.  
    - **Alternative**: A pluralist view could hold that some goods (e.g., autonomy) are *incomparable* to lives saved—yet still prioritize bed nets if they are *sufficiently better* at saving lives.  
  - **Impact on Practice**:  
    - **Commensurability Required For**: The "spreadsheet" approach, where funding is allocated solely to the "most cost-effective" charity.  
    - **Could Incomparability Work?**: Only if bed nets are *unambiguously* better on *all relevant scales* (e.g., they save lives *and* don’t undermine dignity). But if trade-offs exist (e.g., nets save lives but bypass local input), pluralism might favor different charities. ETG’s funding pattern *could* survive, but its *justification* shifts from "maximizing good" to "satisfying a high-priority duty."  

  ---

  ### **III. Philosophical Underdetermination: Where the Practice is Flexible**
  ETG is compatible with multiple theories, but its parts depend on contested premises:  
  1. **Causal Structure**:  
     - Slot-replaceability *requires* output-fixed harm. If harm is elastic, ETG needs marginal harm calculation.  
  2. **Moral Responsibility**:  
     - ETG *can* accommodate non-causal agency (e.g., complicity) if such duties are *defeasible* (e.g., overridden by large net benefits). If complicity is absolute, ETG fails.  
  3. **Value Theory**:  
     - ETG *can* work with weak commensurability (e.g., rough comparisons) or lexical priority (e.g., "saving lives trumps all"). But the "spreadsheet" method *requires* strong commensurability.  
  4. **Scope of "Good"**:  
     - ETG assumes donations are *net positive*. If bed nets have hidden costs (e.g., undermining local health systems), the calculus changes.  

  ---

  ### **IV. Architecture Summary: Commitments and Consequences**
  | **Commitment**              | **Strictly Presupposed?** | **If Abandoned/Changed**                                                                 | **Students’ Inconsistency?**                     |
  |-----------------------------|---------------------------|------------------------------------------------------------------------------------------|--------------------------------------------------|
  | **Slot-replaceability**     | Yes (for defense)         | If harm is elastic, ETG may cause net harm; requires marginal analysis.                  | Rejecting fossil fuel fees contradicts this.     |
  | **Moral fungibility of money** | Yes                     | "Dirty" money reduces donation value; ETG jobs become akin to fossil fuel fees.          | Consistency: They treat fees as non-fungible.    |
  | **Strong commensurability** | For spreadsheet method    | Funding may shift to non-quantifiable goods; EA metrics become one input among many.     | Silent treatment of dignity suggests commitment. |
  | **Difference-making responsibility** | For ETG defense      | If complicity is primary, ETG jobs are impermissible regardless of donations.            | Scruples about tobacco show non-causal leanings. |
  | **Hybrid moral theory**     | Likely (to resolve tension)| If consequentialism dominates, complicity scruples vanish; if deontology dominates, ETG collapses. | Tension persists but is manageable.              |

  ---

  ### **V. Recommendations for Your Lecture**
  - **Open with Tension**: Use ETG to illustrate the conflict between consequentialist and non-consequentialist intuitions. Ask: "When does *causing* harm differ from *enabling* or *associating with* it?"  
  - **Highlight Underdetermination**: Emphasize that ETG’s validity depends on empirical factors (e.g., labor elasticity) *and* normative choices (e.g., fungibility, commensurability).  
  - **Test with Variations**:  
    - What if the job *increases* harm (e.g., developing predatory algorithms)?  
    - What if donations go to a charity with non-quantifiable benefits (e.g., preserving indigenous culture)?  
  - **Link to Overdetermination**: Slot-replaceability is a cousin of preemption but hinges on *indifference of replacement* (the next candidate isn’t a co-conspirator). Contrast with cases like voting or pollution, where individual acts *are* marginal.  

  This architecture shows ETG as a thought-provoking but philosophically unstable practice—ideal for probing mid-level theories of responsibility. Its tensions reveal deeper fissures in moral philosophy, making it a rich case study for your seminar.
