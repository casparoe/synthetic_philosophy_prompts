  ## Barroom Counterfactuals

  **Setting:** A dim hotel bar during a city-wide power outage. Emergency lights cast long shadows. RAE (early 40s, precise gestures) and SAM (late 30s, leans back thoughtfully) nurse lukewarm beers.

  **(The scene opens with the low hum of a backup generator and the clink of ice in a mostly-melted drink.)**

  **Sam:** (Sighs) Well, this is productive. Staring at my dead laptop by emergency lighting. Reminds me of that server fiasco Tuesday.

  **Rae:** Oh god, don’t. Three hours of frantic Slack messages before anyone even *thought* to check the building logs. Classic.

  **Sam:** Exactly! And that whole weirdness with the conditionals. Remember? At 9 AM, everyone knew it went down at 3, knew it was either the deploy or a power cut – unlikely as that seemed. We all happily said, "If the deploy *didn’t* crash it, the power cut *did*." But saying, "If the deploy *hadn't* crashed it, the power cut *would have*"? That felt completely wrong. Like tempting fate.

  **Rae:** Right. Because at 9 AM, given what we *took for granted* – the crash happened, only two causes – the indicative made perfect sense. It’s just logic: ~Deploy → Power Cut, given the crash. But the counterfactual… that felt like imagining a world where the deploy didn’t happen, and then asserting the power cut *still* would have brought it down. With no evidence for that? No way.

  **Sam:** Precisely. And then, bam, 9:15, logs show a power cut at 2:55, UPS only good for five minutes. So, server was doomed at 3 AM regardless of the deploy. Suddenly, *"If the deploy hadn't crashed it, the power cut would have"* sounds perfectly fine, even obvious! But the *indicative*? "If the deploy didn't crash it, the power cut did"? That sounds *exactly* like it did before – technically true, but now oddly redundant, since we know the power cut *did* happen and *was* sufficient. Yet, crucially, the *actual world* didn’t change between 9 and 9:15! Only our *knowledge* did. So how does that work for *you*, Rae? You think it’s one underlying meaning for both conditionals, just context shifting the ‘worlds’ we look at? How does *that* explain the counterfactual flipping?

  **Rae:** Okay, imagine the possible worlds relevant to the crash at 3 AM. At 9 AM, we hold fixed the crash happened and that only those two candidates are possible. For the *indicative* "If not-Deploy, then Power Cut", we look at worlds consistent with our background assumptions *where the deploy didn’t happen*. Given the crash *must* have happened, and only two causes? Yeah, in all those worlds, the power cut *must* have caused it. So the indicative feels solid.

  **Sam:** I follow you so far.

  **Rae:** Now, the *counterfactual* at 9 AM: "If the deploy *hadn't* crashed it..." Here, we *don't* hold the crash fixed as having happened. We *undo* the deploy happening. We imagine a world as close as possible to actuality, but where the deploy doesn't occur at 2:58. Now, what happens at 3 AM in *that* world? With the power cut seeming unlikely? It felt *very* plausible that without the deploy, the server would have just… kept humming along. Hence, saying the power cut *would* have taken it down felt unsupported, maybe even false.

  **Sam:** Alright, plausible. But then 9:15 hits. We learn the power cut *did* happen and *was* sufficient *on its own*. Now, what changes for your world-selection? For the *counterfactual*, when we imagine a world without the deploy happening – we still build the closest possible world. But now we *know* that world has a power cut at 2:55 and a flimsy UPS. So, in that closest world without the deploy, the server *still* crashes at 3 AM due to the power cut! Suddenly, the counterfactual is true. The worlds relevant to evaluating it are fixed by actuality, but *which* aspects of actuality we consider when building the 'closest' world depends on what we *know* about that actuality. The *facts* about the power cut were always there, but until we *knew* them, we couldn't properly constrain the 'closeness' of the counterfactual world – we might have imagined a world without the power cut too.

  **Sam:** Hang on. That sounds suspiciously like smuggling knowledge into the counterfactual after all. You're saying the counterfactual's truth *depends* on what we know to be true about the actual world when we build the alternative scenario? But the counterfactual is supposed to be about what *would* have happened objectively, regardless of what we knew! If the power cut fact was *always* true, why wasn't the counterfactual *always* true? Why did it feel wrong before we knew?

  **Rae:** Because *evaluating* the counterfactual requires us to *model* that alternative world. Before 9:15, our best model for the closest world without the deploy *didn't include the power cut happening*, because we thought it was unlikely! We weren't holding *that* fixed. We held fixed the server *was* working fine before 2:58, maybe some other background assumptions, but not the power cut. So our model of the closest non-deploy world was one where the power cut *didn't* happen either, and the server stayed up. Hence, the counterfactual seemed false. Knowing the power cut fact forces us to include it in the background we hold fixed when constructing the alternative world.

  **Sam:** But that’s my point exactly! You're making the counterfactual's acceptability hinge on our *epistemic state* – what we know when we evaluate it – not just on the brute metaphysical facts of what would have happened. That seems messy. *I* think they're fundamentally different beasts. The indicative "If not-Deploy, Power Cut" at 9 AM? That's purely about our *confidence*, *given what we know*. We know crash happened. We know only two candidates. Supposing we learn the deploy *wasn't* the cause, then, *given what we know at that moment*, we'd be absolutely confident the power cut *was* the cause. It's an *inference license* based on current knowledge. Its acceptability *should* and *does* shift with evidence – if we learned a *third* possible cause existed at 9:10, that indicative would suddenly feel shaky!

  **Rae:** Okay, but hold on. Your 'suppose the antecedent and see how confident you are in the consequent'... what *exactly* are you supposing? When you say "suppose the deploy *didn't* crash it" at 9 AM, what does that supposition *do*? Doesn't it implicitly involve holding some things fixed and letting others vary? You're holding fixed the crash happened, holding fixed only two candidates, right? So you're already doing a kind of world-selection! You're restricting your attention to worlds consistent with your knowledge *where the deploy wasn't the cause*. That's the *same* set of worlds I use for the indicative! You're just dressing it up in degrees of belief.

  **Sam:** (Leans forward) Maybe, but the *mechanism* is different. The indicative is *about* that epistemic state. Its meaning *is* tied to our current knowledge base. The counterfactual, "If the deploy *hadn't* crashed it, the power cut *would have*," isn't about our confidence *if we learned something*. It's making a claim about the causal structure of the world itself: that in the scenario without the deploy causing it, the power cut *was sufficient and would have triggered the crash anyway*. Its truth was fixed *before* 9:15. Our *recognition* of its truth changed, but the *fact* it was asserting – about the sufficiency of the power cut in the deploy's absence – was always true once the power cut happened. We just didn't know it. That’s why the indicative felt the same before and after – it was always about ruling out the deploy within our known constraints. The counterfactual *became assertable* because we learned the key fact that made the claim *true*.

  **Rae:** But Sam, if the counterfactual is making a claim about objective sufficiency independent of our knowledge, why did it *sound* wrong at 9 AM? Why wasn't it just *unknown* but potentially true? It felt *false*. That suggests its *evaluation* is still sensitive to our knowledge state. We couldn't properly *grasp* the truth of the objective claim without the knowledge. Your 'objective sufficiency' is invisible without knowing the power cut details. So how can the *meaning* of the sentence be purely about that objective sufficiency, divorced from what we need to know to evaluate it?

  **Sam:** (Taps the table) Because the meaning *is* the claim about objective sufficiency. Its *assertability* depends on our evidence, but its *truth* doesn't. We *thought* it was false because we lacked evidence for the power cut's sufficiency. We were wrong. The indicative’s *whole point* is to express a connection *within* our current understanding. It’s not making a claim about hidden objective facts in the same way. Two different jobs.

  **Rae:** But both jobs seem to need the same underlying machinery – selecting scenarios based on what's held fixed and what's varied, constrained by context and knowledge. You just call it 'supposition given knowledge' for the indicative and 'objective similarity' for the counterfactual. I see one semantic engine with different context settings.

  **Sam:** And I see two distinct engines: one navigating the map of our current knowledge, the other trying to chart the territory of causal possibility, however imperfectly. We learned what was on the territory at 9:15, making the counterfactual chart suddenly accurate. The indicative map was always accurate *for the known landmarks*.

  **Rae:** So you’re stuck with counterfactuals that can be objectively true but feel completely wrong until we stumble on the right evidence? That seems… unsatisfying.

  **Sam:** (Smirks slightly) Welcome to philosophy, Rae. Reality doesn’t care if our conditionals feel satisfying. Your way risks making counterfactuals too subjective. The lights are flickering... maybe the power’s coming back. Another drink while we wait in the dark?

  **Rae:** (Sighs, pushes her glass forward) Fine. But only if you promise not to say "If the power *hadn't* come back, we *would* be stuck here." Not until we *know* about that generator.

  **Sam:** (Laughs) Deal. One beer, indicative mood only: "If the power *doesn't* come back, we *are* stuck here." Cheers to epistemic humility.

  **(They clink glasses as the emergency lights cast long shadows, their fundamental disagreement about the nature of 'if' unresolved, but the conversation momentarily paused.)**
