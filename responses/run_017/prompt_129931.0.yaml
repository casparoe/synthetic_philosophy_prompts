  ### Step-by-Step Session Plan

  #### 1. **Introduction (2 minutes)**
     - Recap: Students know pure-strategy Nash equilibria, best responses, and the definition of mixed strategies.
     - State the goal: Understand why iterated elimination of strictly dominated strategies (IESDS) requires mixed strategies as dominators.
     - Clarify: "Today, we'll see that a mixed strategy can 'measure' a pure strategy's weakness, even if no pure strategy can. The mixture isn't played—it's a benchmark."

  #### 2. **Present the Game (5 minutes)**
     - **Constructed 4×3 Game** (write on board):
       - **Row Player (Payoffs)**:
         - R1: (C1: 4, C2: 0, C3: 2)
         - R2: (C1: 0, C2: 4, C3: 2)
         - R3: (C1: 1, C2: 1, C3: 5)
         - R4: (C1: 1.9, C2: 1.9, C3: 0)
       - **Column Player (Payoffs)**:
         - R1: (C1: 4, C2: 0, C3: 1)
         - R2: (C1: 0, C2: 4, C3: 1)
         - R3: (C1: 1, C2: 1, C3: 0)
         - R4: (C1: 0, C2: 0, C3: 10)
     - **Key Properties**:
       - No weakly dominated strategies (verify briefly: e.g., R3 isn’t weakly dominated by R1/R2 due to C3).
       - Designed for three IESDS rounds.

  #### 3. **Round 1: Eliminate R4 via Mixed Strategy (10 minutes)**
     - **Task**: Find if any Row strategy is strictly dominated.
     - **Pure-Strategy Check**:
       - Compare R4 to R1: R4 loses in C1 (1.9 < 4) but wins in C2 (1.9 > 0) → not dominated.
       - Similarly, R4 vs. R2: Loses in C2 (1.9 < 4), wins in C1 (1.9 > 0) → not dominated.
       - R4 vs. R3: R4 loses in C3 (0 < 5) but wins in C1 (1.9 > 1) → not dominated.
     - **Mixed-Strategy Check**:
