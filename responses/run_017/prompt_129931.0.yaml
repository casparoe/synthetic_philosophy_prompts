         - Compare to C3: (2 > 1, 2 > 1, 1 > 0) → strictly dominates.
     - **Eliminate C3**.
     - **Address Misconception Now**: "Do we check against Column’s mixtures?" → Clarify: No. Domination is checked only against opponents’ pure strategies (due to linearity). Mixtures are covered automatically.

  #### 5. **Round 3: Eliminate R3 via Mixed Strategy & Plotting (15 minutes)**
     - **Reduced Game (without R4, C3)**:
       - Row: R1, R2, R3 vs. Column: C1, C2.
       - Row payoffs:
         - R1: (C1:4, C2:0)
         - R2: (C1:0, C2:4)
         - R3: (C1:1, C2:1)
     - **Plot in the Plane (Key Visual)**:
       - Axes: C1 payoff (x-axis), C2 payoff (y-axis).
       - Plot points:
         - R1: (4, 0)
         - R2: (0, 4)
         - R3: (1, 1)
       - Draw the line segment between R1 and R2 (representing mixtures).
       - Mark a 50-50 mixture: (4×0.5 + 0×0.5, 0×0.5 + 4×0.5) = (2, 2).
     - **Mixed-Strategy Domination**:
       - Compare (2,2) to R3’s (1,1): 2 > 1 on x-axis, 2 > 1 on y-axis → strictly dominates.
       - Emphasize: The mixture (2,2) is on the segment, but no pure strategy sits there. R3 dies only to this mixture.
     - **Address Misconception Now**: "But R1 and R2 individually lose to R3 sometimes!" → Show: R1 loses to R3 in C2 (0 < 1), R2 loses in C1 (0 < 1). Only the mixture wins everywhere.

  #### 6. **Why Order Matters? (3 minutes)**
     - **Question**: "Could we have eliminated R3 first?" 
     - **Answer**: No! In the full game, R3 isn’t dominated. Why?
       - Against C3, R3 gets 5, but any R1/R2 mix gets ≤ 2 → R3 survives initially.
       - Only after eliminating C3 (which required eliminating R4 first) does R3 become dominated.
     - **Address Misconception**: "Order matters like in weak dominance?" → Clarify: No. For strict dominance, order doesn’t affect the final result, but the path can differ. Here, deletions are sequential because domination only appears after prior removals.

  #### 7. **What We Skip (1 minute)**
     - **One-Line Refusal**: "In 3+-player games, some strategies survive IESDS but are never best responses—we’ll skip rationalizability for now."

  #### 8. **Closing Question (4 minutes)**
     - **Question**: "After eliminating a strictly dominated strategy, why might a new strategy become eliminable in the next round?"
     - **Expected Answer**: "Removing a strategy shrinks the opponents’ possible actions. A strategy that was only 'safe' against the removed action is now exposed as dominated (e.g., R3 was safe against C3; after C3 goes, R3 dies to the mixture)."
     - **Why This Works**: Tests understanding that domination is contextual (depends on surviving opponent strategies), and mixtures provide a more powerful benchmark when contingencies change.

  ---

  ### Why This Works
  - **Order is Critical**: 
    - Mixed strategies as dominators are introduced first as a "measuring stick" (not played). This avoids "randomize to confuse" poisoning.
    - Reordering breaks the example: If you skip plotting until the end, students miss the visual; if you start with the mixture dominating R3, it doesn’t work (R3 isn’t dominated initially).
  - **Game Design**:
    - 4×3 is small enough. Plotting R1/R2/R3 in the plane (C1, C2) makes domination geometric.
    - No weak dominance: Payoffs avoid ties (e.g., R4’s 1.9 avoids R1/R2 ties).
    - Mechanism: Deleting R4 lets C3 become dominated (since C3 was only good against R4). Deleting C3 then exposes R3 to a mixture.
  - **Misconceptions Handled**:
    - "Mixtures aren’t played" → addressed when first using one.
    - "Check against mixtures" → countered during Column’s elimination.
    - "Each component must dominate" → debunked during plotting.
    - "Order matters" → clarified post-elimination.
  - **Closing Question**: Focuses on the purpose of IESDS—iterative revelation of irrational strategies—not just arithmetic.
