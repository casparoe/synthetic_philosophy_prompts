     - "After we eliminate a strategy because it is strictly dominated, why is it safe to remove it? And why might we be able to eliminate more strategies afterward that we couldn't before?"

     The answer should touch upon: 
          - Once a strategy is removed, it is never played, so the opponents don't have to worry about it. This might make some of their strategies become dominated because they were only good against the removed strategy.
          - In the example, after removing R4, Column's C3 became dominated because R4 was the only row where C3 was good. And after removing C3, R3 became dominated because C3 was the only column where R3 was good.

     This shows they understand the iterative aspect and the role of domination.
