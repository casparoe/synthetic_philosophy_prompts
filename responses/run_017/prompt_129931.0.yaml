     The misconceptions:

     a) "a mixture cannot beat a real strategy because nobody would ever play it"
          - We are not requiring anyone to play the mixture; we are using it as a benchmark to say that a rational player would not play a strategy that is strictly worse than some mixture. Because the mixture gives a strictly better payoff no matter what the opponent does (in the current set of opponent strategies).

     b) "the mixture has to be checked against the opponent's mixed strategies as well as the pure ones"
          - We only need to check against the opponent's pure strategies because if it is better against every pure strategy of the opponent, then by linearity it will be better against any mixture.

     c) "because order matters for weak dominance it must matter here"
          - For strict dominance, order does not matter: we can remove any strictly dominated strategy in any order and get the same result.

     d) "if a mixture beats a strategy, each strategy in the mixture must already be at least as good as it against everything"
          - Not true: in the example, R1 is not better than R3 in C2 (0<1) and R2 is not better than R3 in C1 (0<1), but the mixture is better in both.

     When to head them off:

     - For (a): when we first introduce the idea of using a mixture as a dominator. Emphasize that we are not requiring the mixture to be played, but we are using it to prove that a particular strategy is suboptimal.

     - For (b): when we are checking the domination condition, we only check against the pure strategies of the opponent. We can explain that because the payoff is linear, if it works against pure then it works against mixed. But at this level, we might just say that we only need to check against the pure strategies.

     - For (c): when we do iterated elimination, we can remove any strictly dominated strategy in any order. We might mention that weak dominance is different.

     - For (d): after we show the domination of R3 by the mixture, we can explicitly compare: R1 is not better than R3 in C2, R2 is not better than R3 in C1, but the mixture is better in both.

     What to refuse to explain:

     - The three-or-more-player case: because in two-player games, a strategy is strictly dominated if and only if it is never a best response to any mixed strategy of the opponent. In three or more players, there are strategies that are never a best response but are not strictly dominated. And rationalisability.

     - One line: "In games with more than two players, there are strategies that are never a best response but are not strictly dominated; we ignore that for now."

