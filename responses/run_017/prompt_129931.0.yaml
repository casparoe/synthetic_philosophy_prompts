         - Compare to R4: (2 > 1.9, 2 > 1.9, 2 > 0) → strictly dominates.
     - **Eliminate R4**.
     - **Address Misconception Now**: "But nobody plays the mixture!" → Clarify: The mixture is a tool to prove R4 is suboptimal. Players don’t need to randomize; they just avoid R4.

  #### 4. **Round 2: Eliminate C3 via Mixed Strategy (10 minutes)**
