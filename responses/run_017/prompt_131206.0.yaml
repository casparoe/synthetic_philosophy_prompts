  **Roles:**
  1. **Inspectors (2-3 students):** They can physically inspect objects using a fixed menu of three measurements. They record each object with a unique code token (e.g., a string of letters/numbers) on a manifest. They cannot see the objects again after initial inspection and coding. They do not know the meaning of the codes beyond their own measurements.
  2. **Analysts (4-5 students):** They never see the objects. They receive:
     - The complete manifest from the inspectors (a list of codes for each object).
     - A parallel corpus: a list pairing each warehouse code (from the inspectors) with a corresponding code from a second warehouse (which is just a transformation of the original code, created syntactically). They build translation rules between the two codes.
  3. **Pickers (2 students):** They are behind a screen (so they cannot see the objects). They are given a request in either the warehouse code or the second warehouse code (depending on the phase) and must retrieve the object that matches the code. They have access to the bins (each bin has one object and its code as assigned by the inspectors). They must hand the object to the facilitator.

