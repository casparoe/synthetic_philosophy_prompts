  The symposium should showcase practical resolutions, demonstrating the foundation's thoughtful approach to donors and the art world. This structure ensures the adviser's time is used efficiently, addressing the most pressing issues first while acknowledging dependencies and gaps in existing theory.
answer: |-
  **MEMORANDUM**  
  **TO:** Board of Directors, [Foundation Name]  
  **FROM:** [Your Name]  
  **SUBJECT:** Prioritization of Philosophical Inquiry for *Second Lump* Policy Development  
  **DATE:** October 26, 2023  

  ---

  ### **Executive Summary**  
  The philosophical adviser’s limited time (12 months, 1 day/week + symposium) demands ruthless prioritization. *Second Lump*’s unique constraints—repeated destruction/recasting, suppressed original clay, and mutable digital file—render classic "statue/clay" debates insufficient. **Priority must be given to questions with direct, irreversible policy consequences, high tractability for non-specialists, and gaps in existing metaphysics.** Below is the ranked agenda, with rationale based on:  
  1. **Upstream Impact** (How many policy decisions depend on this answer?)  
  2. **Tractability** (Can a philosopher make concrete progress in 12 months?)  
  3. **Neglectedness** (Does *Second Lump* expose a gap in standard metaphysics?)  
  4. **Irreversibility** (Could wrong policies cause legal/financial harm?)  

  ---

  ### **Ranked Priority List**  
  *(Highest to Lowest Urgency)*  

  #### **1. What is the *primary bearer* of the artwork’s identity?**  
     - **Why this first?** Every policy (insurance value, loan eligibility, conservation) hinges on whether the work is:  
       - The *enduring shape* (abstract entity),  
       - The *current bronze instance* (physical object),  
       - A *series* of bronze casts (temporal sequence), or  
       - The *digital file* (information entity).  
       **Upstream Impact:** Highest. If the shape is primary, recasting is preservation; if the bronze instance is primary, recasting is destruction. Insurance valuation (shape vs. material) and loan agreements (can a *copy* be loaned?) collapse without this.  
     - **Tractability:** High. Philosopher can map existing theories (e.g., perdurantism vs. endurantism) to *Second Lump*’s constraints without resolving eternal debates. Output: A defensible categorization for policy drafting.  
     - **Neglectedness:** *Second Lump* forces a gap: standard "statue/clay" cases assume one change (clay→statue), but here *repeated replacement* demands theories of persistence through cyclic destruction.  
     - **Set Aside:** Whether the *original clay* is part of the work (see #3).  

  #### **2. What is the *ontological status and authority* of the digital file?**  
     - **Why second?** The file’s role as a "template" (with permitted updates) challenges whether it is:  
       - A *reference tool* (extrinsic to the work),  
       - The *core artwork* (the shape is encoded information), or  
       - A *custodial artifact* (like a score in music).  
       **Upstream Impact:** Critical for conservation. "Structural repairs" may alter the file—if the file *is* the work, minor edits risk creating a new artwork. Loans/access rights to the file also depend on this.  
     - **Tractability:** Moderate-High. Requires extending theories of abstract artifacts (e.g., like musical works) to digital objects. Philosopher can define thresholds for "substantial change" to the file.  
     - **Neglectedness:** Extreme. Digital persistence is underexplored in material constitution debates. *Second Lump*’s mutable file is a novel challenge.  
     - **Move Down If:** The primary bearer (#1) is deemed the *shape* (making the file a mere accessory).  

  #### **3. Does the *original clay* have any constitutive role?**  
     - **Why third?** The clay is hidden and degraded, yet its retention is contractually mandated. Is it:  
       - A *relic* (historically significant but not part of the work),  
       - An *essential originator* (the work depends on its existence), or  
       - *Irrelevant* after scanning?  
       **Upstream Impact:** Storage costs, insurance, and disaster planning. If purely relic-like, we insure for historical value, not as "part" of the artwork.  
     - **Tractability:** High. Distinguishing "genetic origin" from "constitutive material" is well-trodden (e.g., Ship of Theseus). Quick progress possible.  
     - **Neglectedness:** Low—this mirrors classic puzzles. But *Second Lump*’s *deliberate suppression* of the clay (unlike display-ready "statue/clay" cases) makes it policy-relevant.  
     - **Dependency:** Resolved only after #1 (if the shape is primary, the clay is likely irrelevant).  

  #### **4. What are the *persistence conditions* across recastings?**  
     - **Why fourth?** Clarifies when the artwork "survives" a recasting. Must we use *identical bronze mass*? (No, per donor rules.) Does a *perceptually identical* shape suffice? (Yes, per contract.)  
       **Upstream Impact:** Determines loan eligibility during recasting periods and whether a recast "version" is the same work for insurance.  
     - **Tractability:** Moderate. Philosopher can adapt theories of temporary identity or stagedefining properties, but risks abstractness.  
     - **Neglectedness:** Moderate. Standard metaphysics focuses on one change, not cyclical replacement.  
     - **Move Up If:** #1 concludes the work is a *series* of bronzes (making persistence conditions vital).  

  #### **5. Is *Second Lump* a test case for *artistic practice* overriding metaphysics?**  
     - **Why last?** The donor’s rules may *stipulate* the work’s identity (e.g., "the shape is the work"), rendering metaphysical debate irrelevant.  
       **Upstream Impact:** Could simplify policies by deferring to contractual intent.  
     - **Tractability:** High. Philosopher can analyze whether artistic declarations create "institutional facts" (like money or borders).  
     - **Neglectedness:** Low—this is well-discussed in philosophy of art.  
     - **Risk:** Overrating this tempts boards to ignore metaphysics, but legal disputes (e.g., insurance claims) often require ontological justification.  

  ---

  ### **Explicitly Set Aside**  
  1. **Classic "Statue/Clay" Numerical Identity Debates:** *Overrated here.* The question "Are the statue and clay the same object at time T?" doesn’t apply—*Second Lump* has no simultaneous duality (clay is hidden, bronze is displayed). Focus instead on *diachronic identity* (persistence over time).  
  2. **Microphysical Constitutions:** Debating whether "same atoms" define the work is *irrelevant*—the donor mandates new bronze each recasting.  
  3. **Universals vs. Particulars:** Whether "the shape" is a universal instantiated in bronze is philosophically rich but *policy-useless*. Our concern is practical identity, not Platonic realms.  

  ---

  ### **Symposium & Adviser Output**  
  - **Symposium Goal:** Present a *practical framework* for policy (e.g., "The work is the shape; the bronze is a vehicle; the clay is a relic"). Avoid academic esoterica.  
  - **Adviser’s Deliverable:** A decision tree for policy drafting, using plain language (e.g., "If X is true about identity, then insure Y; if Z, then loan restrictions apply to...").  
  - **Risk Mitigation:** Philosopher must flag where consensus is impossible (e.g., "No theory fully resolves persistence—recommend policy based on artistic intent + contractual risk").

  ---

  ### **Why This Ordering?**  
  Policy deadlines force action. #1 and #2 define *what we are preserving*, driving insurance, loans, and conservation. #3 and #4 refine implementation but depend on #1. #5 offers an escape hatch if metaphysics proves intractable. **The statue/clay puzzle is a starting point, not a map: *Second Lump*’s digital scaffold and cyclic rebirth demand fresh priorities.** Allocate 70% of adviser time to #1-2; the rest to #3-5.
