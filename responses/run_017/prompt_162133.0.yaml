  Then in Round 3, if they choose A, they can transfer. For example, each of the two gainers gives 4 to the loser, then they have 8,8,0. Compared to B's 5,5,5, they are better off (8>5) and the loser is worse (0<5). If they give more, say 6 each, then they have 6,6,4, which is better than B for the gainers? 6>5, and the loser 4<5.

   still not better for the loser.

  To make it possible, we need the loss to be smaller relative to the gains.

  Policy A: [20,20, -5] ( total 35)
  Policy B: [10,10,10] ( total 30)

  Then if they choose A and each giver gives 3 to the loser, they have 17,17,1. Compared to B's 10,10,10, the gainers are better and the loser is worse. If they give 7.5 each, they have 12.5,12.5,10, then the gainers are better (12.5>10) and the loser the same. Or if they give a bit more, everyone can be above 10.

  But with whole numbers, we can use:

  Policy A: [20,20, -5] -> with transfer, if they transfer 5 in total to the loser, then the loser has 0, which is not better. They need to transfer at least 15 to bring the loser to 10. So each gives 7.5.

  Since points are abstract, we can allow fractional transfers or use larger numbers.

  Policy A: [40,40, -10] ( total 70)
  Policy B: [20,20,20] ( total 60)

  Then if they choose A and then transfer 15 to the loser (7.5 from each), they end up with 32.5,32.5,5. Or to make the loser have 20, transfer 30 in total (15 from each), then they have 25,25,20. Compared to B's 20,20,20, the two gainers are better off (25>20) and the loser is the same.

  So they can achieve a Pareto improvement over B only if the loser is not made strictly better off, but at least not worse off, and others better off.

