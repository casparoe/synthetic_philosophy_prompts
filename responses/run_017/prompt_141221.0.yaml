prompt: |-
  I have been reading the rationalist blogs since roughly the original sequences — anthropic decision theory, SIA versus SSA, the measure problem, the recurring Boltzmann brain threads — and the thing I have never seen stated cleanly is what I am *allowed to demand* of a cosmology here. Every discussion I have read either fixes a measure and reports the verdict that falls out of it, or announces that the worry is harmless for decision-theoretic reasons, and almost nobody stops to say what a theory would have to deliver before I ought to accept its answer about which kind of observer I am. So I want the specification rather than another tour of the options: write out the desiderata a cosmological theory must satisfy for me to be entitled to take my own evidence at face value — to conclude that I am an ordinary observer embedded in a long, mostly lawlike causal history rather than a fluctuation with a moment of spurious experience — with the case or argument that makes each one a requirement, and be explicit about which are non-negotiable and which are merely the preferences of one camp.

  The candidates I would start from, which you can keep, split, or throw out: that ordinary observers dominate fluctuations in number under the theory's own measure; that the verdict does not swing wildly between cutoffs (proper time, scale factor, causal patch, light-cone time) or between coarse-grainings of what counts as an observer-moment; that the theory does not undermine itself, in the sense that accepting it would force me to discount the reliability of the reasoning that got me there; that it engages with the *specific contents* of my evidence — my memories of a lab, of correspondence, of stable public records — rather than only with the bare fact that I have some evidence, since a fluctuation reproducing all of that is far rarer than a fluctuation reproducing a moment; that it has something principled to say about the continuum between a bare brain, a brain plus a hallucinated environment, and what I would call a "Boltzmann archive," a fluctuation large enough to contain internally consistent structure of the sort that would make most of its occupant's beliefs true; that it grades reliability by domain of belief rather than returning a single global verdict, since the natural outcomes here are mixtures; that the conditional fraction of fluctuation-observers converges as I accumulate evidence rather than oscillating; and that even in the bad case the theory remains action-guiding, because on the branch where I am a fluctuation nothing I do makes a difference and so every decision I make should be made as if I were not. I also want the two places where I expect the list to be doing real work: first, whether excluding fluctuations by fiat — by declaring them impossible on kinetic grounds, or by ruling them outside the reference class of observers — is a genuine solution or just a rule that also quietly excludes ordinary observers; and second, whether the "youngness"-style implication, that typical observers should find themselves absurdly early, is a real cost or an artifact of one family of measures.

  The part I care most about is the structure of the list itself rather than any scoring: tell me which of these demands are genuine and which are the inherited prejudices of people who grew up arguing about reference classes, and if some subset of the desiderata cannot be jointly satisfied — my suspicion is that non-self-undermining and any measure-relative dominance condition are on a collision course, and that nothing survives both a cutoff-invariance requirement and a genuinely infinite spacetime — say which ones have to go and what the resulting, weaker standard is worth. Then tell me which single requirement excludes the most candidate theories, and, only briefly, score four stances against the list: fix the measure and the problem disappears; fluctuations are physically impossible so the question never arises; the possibility is real but decision-irrelevant; and the correct anthropic update screens it off entirely. If it helps to fix the purpose: I want a theory good enough that I can keep doing physics and planning next year without multiplying anything by a discount factor for probably being a fluctuation.
reasoning: |-
  Okay, the user has been deep into rationalist cosmology discussions for years, wrestling with Boltzmann brains and the measure problem. They're frustrated because no one clearly states what a cosmological theory must deliver for us to trust our ordinary observer status. They want a structured list of non-negotiable vs. negotiable desiderata, with arguments for each, and clarity on trade-offs.  

  First, I need to unpack their core request: they want epistemological hygiene for cosmology. The unspoken pain points are likely:  
  - Anxiety that physics might be self-undermining (if we're all Boltzmann brains, why trust reasoning?)  
  - Frustration with measure-dependence (answers changing based on arbitrary cutoffs)  
  - Need for practical stability (to continue doing science/life planning)  
  - Desire for evidence-grading (not just binary "real vs fluctuation")  

  Their listed candidates are thoughtful but messy. Time to systematize:  

  **Non-Negotiables (Epistemic Baseline)**  
  1. **Non-Self-Undermining (NSU)** - Foundational. If a theory says my reasoning is unreliable, I can't trust its derivation.  
  2. **Evidence-Specificity** - Must engage with rich memories/lab records, not just "consciousness exists."  
  3. **Action-Guidance Preservation** - Even if I'm a Boltzmann brain, decisions must matter *conditionally*.  

  **Strong Preferences (But Negotiable Under Duress)**  
  4. **Cutoff-Invariance** - Answers shouldn't flip if I switch measures (scale factor vs causal patch). *Trade-off: May require finite universe.*  
  5. **Convergence with Evidence** - As I recall more (e.g., yesterday's coffee), fluctuation probability should decrease monotonically.  
  6. **Domain-Relative Reliability** - My belief about coffee cups can be trustworthy even if cosmology isn't.  

  **Conditional/Aspirational**  
  7. **Ordinary Observer Dominance** - Nice if true, but secondary to NSU.  
  8. **Continuum Handling** - Should address Boltzmann archives vs bare brains.  
  9. **Youngness Paradox Resolution** - If theory predicts we're early, must explain why we appear late.  

  **Their Two Key Battlegrounds**  
  - **Fluctuation Exclusion by Fiat**: Dangerous. If you ban Boltzmann brains kinetically, you might ban ordinary observers too (both are low-entropy states).  
  - **Youngness Problem**: Likely measure artifact. Proper time measures overcount early hot universes; scale factor avoids this.  

  **Scoring the Stances**  
  - "Fix measure, problem gone": Fails NSU if measure choice is arbitrary.  
  - "Fluctuations impossible": Risky unless based on fundamental physics (e.g., quantum gravity forbids them).  
  - "Decision-irrelevant": Fails Action-Guidance – if I'm a Boltzmann brain, why care?  
  - "Anthropic update screens it off": Only works if ordinary observers dominate *and* evidence is incorporated.  

  **The Crux**  
  NSU and dominance are *not* inherently incompatible – but NSU forces the measure to be justification-independent. Cutoff-invariance *is* incompatible with true infiniteness. Compromise: Accept finite universe or embrace domain-relativity.  

  **Hardest Exclusion**  
  NSU kills any theory where Boltzmann brains dominate AND their reasoning is unreliable. If they dominate but reason correctly (unlikely), it might survive.  

  **Practical Takeaway**  
  For the user's purpose (doing physics without discount factors): A theory satisfying NSU + Action-Guidance + Evidence-Specificity lets them proceed. Even if fluctuations exist, their high evidence (lab records) makes them negligible *for local decisions*.
answer: |-
  Below is a structured, requirement-first approach to your core question: **What must a cosmological theory deliver for you to be entitled to take your evidence (e.g., memories of a lab, stable records) at face value and dismiss Boltzmann brain (BB) worries?** I categorize desiderata as **non-negotiable** (epistemically mandatory), **strong preferences** (pragmatic/enforceable), and **conditional/aspirational** (domain-specific). Trade-offs are made explicit, and your candidate list is refined. The goal is a "physics-compatible epistemology" for cosmology.

  ---

  ### **I. Non-Negotiable Desiderata**  
  *These are foundational. Failure here invalidates the theory as a tool for rational inference.*  

  1. **Non-Self-Undermining (NSU)**  
     - **Requirement**: Accepting the theory must not force you to discount the reliability of the reasoning that led you to accept it.  
     - **Argument**: If the theory implies that typical observers (e.g., BBs) hold mostly false beliefs, *and* BBs dominate, then your belief in the theory itself is likely unreliable. This is a recursive epistemic catastrophe (similar to a "brain in a vat" scenario undermining all knowledge).  
     - **Non-negotiable because**: Without this, cosmology cannot be integrated with scientific reasoning.  

  2. **Evidence-Specificity**  
     - **Requirement**: The theory must engage with the *specific content* of your evidence (e.g., memories of a lab, emails, public archives), not just the fact that you have "some" conscious experience.  
     - **Argument**: A fluctuation producing a minimal observer-moment (e.g., a disembodied brain) is vastly more probable than one producing a "Boltzmann archive" (a coherent, internally consistent history). The theory must explain why your rich evidence isn't overwhelmingly likely to be illusory.  
     - **Non-negotiable because**: Ignoring evidence content reduces anthropics to incoherence (e.g., SSA reference classes become arbitrary).  

  3. **Action-Guidance Preservation**  
     - **Requirement**: Even in the hypothetical scenario where you are a fluctuation, the theory must prescribe meaningful decisions (e.g., "eat if hungry").  
     - **Argument**: If BBs are real and your actions have no consequences, decision theory breaks down (no expected utility). But *your decisions now* must matter *conditional on your current evidence*.  
     - **Non-negotiable because**: A theory that paralyzes action is pragmatically useless and contradicts the causal structure of your experience.  

  ---

  ### **II. Strong Preferences (Negotiable Under Duress)**  
  *Failure here weakens the theory but doesn’t destroy it. These enforce stability and applicability.*  

  4. **Cutoff-Invariance**  
     - **Requirement**: Predictions (e.g., "ordinary observers dominate") should not reverse under reasonable changes to the measure (e.g., scale factor vs. causal patch time) or coarse-graining of "observer" definitions.  
     - **Argument**: Wild swings indicate the answer is an artifact of arbitrary mathematical choices, not physics.  
     - **Trade-off**: Genuinely infinite spacetimes may *require* cutoff-dependence. **Resolution**: Prefer theories with finite horizons (e.g., quantum gravity with end states) or restrict to measures with proven invariance (e.g., scale factor for expanding universes).  

  5. **Convergence with Evidence**  
     - **Requirement**: As you accumulate evidence (e.g., "I recall yesterday's experiment"), the conditional fraction of fluctuation-observers who share that evidence must monotonically decrease.  
     - **Argument**: Without convergence, accumulating evidence doesn't protect you from BB doubts (e.g., adding "I remember writing this sentence" might *increase* BB probability under some measures).  
     - **Negotiability**: Could be relaxed if the theory grades reliability by domain (see §III.7).  

  6. **Domain-Relative Reliability**  
     - **Requirement**: The theory should grade the reliability of beliefs by domain (e.g., "my lab memories are trustworthy; cosmology beliefs are suspect") rather than giving one global "real vs. fluctuation" verdict.  
     - **Argument**: In a BB-dominated universe, your belief in coffee cups might be reliable while your belief in cosmology is not. Theories should reflect this to avoid total skepticism.  
     - **Negotiability**: Not strictly necessary if NSU holds, but crucial for practicality.  

  ---

  ### **III. Conditional/Aspirational Desiderata**  
  *Useful for specific goals but not universally required.*  

  7. **Ordinary Observer Dominance**  
     - **Requirement**: Ordinary observers should vastly outnumber BBs under the theory's measure.  
     - **Status**: *Conditional*. Desirable for simplicity but not a standalone fix. NSU is stricter: even if BBs dominate, they must have reliable beliefs (unlikely; see §IV).  

  8. **Continuum Handling**  
     - **Requirement**: Address the spectrum from minimal observers (brains) to Boltzmann archives (self-consistent pseudo-worlds).  
     - **Argument**: Distinguishing "real" from "fluctuation" requires a probability gradient over this continuum.  
     - **Status**: *Aspirational*. Most theories fail here, but NSU + Evidence-Specificity mitigate it.  

  9. **Youngness Paradox Resolution**  
     - **Requirement**: Explain why typical observers don't find themselves in the early, high-density universe.  
     - **Status**: *Artifact-specific*. Proper time measures cause youngness; scale factor/light-cone measures avoid it. **Verdict**: Youngness is not a universal cost but a sign of a poor measure.  

  ---

  ### **IV. Your Key Battlegrounds Resolved**  
  1. **Excluding Fluctuations by Fiat**  
     - **Kinetic exclusion** (e.g., "quantum gravity forbids Boltzmann brains") is a *genuine solution* **if** physically justified (e.g., AdS/CFT with no stable vacua). But if based *only* on ad hoc reference-class rules (e.g., "BBs aren't observers"), it surreptitiously excludes ordinary observers and violates **Evidence-Specificity**.  
     - **Verdict**: Physically principled exclusion is valid; reference-class gerrymandering is not.  

  2. **Youngness as a Cost**  
     - **Real cost only for bad measures**. Proper time measures overcount early universes, making youngness inevitable. Scale factor or causal patch measures avoid this. **Conclusion**: Youngness is an artifact of measure choice, not cosmology.  

  ---

  ### **V. Trade-offs and the Weakest Standard**  
  - **Collision Course**: **NSU** and **Ordinary Observer Dominance** conflict if BBs dominate *and* are delusional. But NSU can survive BB dominance if BBs are "rational" (e.g., their cosmology beliefs are correct). This is implausible, so **NSU effectively requires ordinary dominance** or a BB-hostile universe.  
  - **Cutoff-Invariance vs. Infinite Spacetime**: These are incompatible. True infiniteness makes probabilities measure-dependent. **Resolution**: Prioritize cutoff-invariance by requiring a finite or quantum-gravitational end state (e.g., cosmological constant decay).  
  - **Weakest Viable Standard**:  
    - **Non-Negotiable**: NSU, Evidence-Specificity, Action-Guidance.  
    - **Strong Preference**: Domain-Relative Reliability.  
    This allows you to trust local evidence (e.g., "my lab exists") while remaining skeptical of global cosmology.  

  ---

  ### **VI. Which Requirement Excludes the Most Theories?**  
  **Non-Self-Undermining (NSU)**. Most popular measures (e.g., proper time in eternal inflation) imply BB dominance. If BBs are delusional, accepting such a theory undermines itself. NSU forces:  
  - A fundamental mechanism suppressing BBs (e.g., quantum gravity),  
  - Or a measure where ordinary observers dominate (e.g., scale factor with reheating surfaces),  
  - Or a bizarre universe where BBs have true beliefs.  
  > 95% of debated theories fail NSU if taken literally.  

  ---

  ### **VII. Scoring Four Stances Against the List**  
  *(✓ = satisfies; ✗ = violates; ~ = partially/complex)*  

  | Stance                           | NSU | Evidence-Specificity | Action-Guidance | Cutoff-Invariance | Domain-Relative | Verdict                                                                 |
  |----------------------------------|-----|----------------------|-----------------|-------------------|-----------------|-------------------------------------------------------------------------|
  | **1. Fix measure, problem gone** | ✗   | ✗                    | ~               | ✗                 | ✗               | Arbitrary measure-fixing ignores evidence and often violates NSU.       |
  | **2. Fluctuations impossible**   | ✓   | ✓                    | ✓               | ✓                 | ✓               | **Best if true** (e.g., string theory with no BB-compatible vacua).     |
  | **3. Decision-irrelevant**       | ✗   | ✗                    | ✗               | ~                 | ✗               | Violates Action-Guidance: if decisions don't matter, why engage?        |
  | **4. Anthropic update screens**  | ~   | ~                    | ✓               | ✗                 | ~               | Only works if ordinary observers dominate *and* evidence is integrated. |

  ---

  ### **VIII. Conclusion: Your Purpose Fulfilled**  
  For a theory to let you "do physics and plan next year" without BB discounting, it must pass the **Non-Negotiable Triad**:  
  1. **NSU** → Your reasoning isn’t self-defeating.  
  2. **Evidence-Specificity** → Your memories/records are reliable.  
  3. **Action-Guidance** → Decisions matter regardless of origin.  
  With these, you can:  
  - Trust local evidence (e.g., lab work),  
  - Ignore global BB worries (they’re screened off by your rich evidence),  
  - Act without paralysis.  

  **Verdict on your suspicion**: NSU *is* the linchpin. It forces ordinary dominance or physical BB exclusion. Cutoff-invariance *is* negotiable if the universe is finite. The viable path is a theory like **finite inflation with reheating-surface measure** (e.g., scale-factor cutoff), or **quantum gravity with no BB-allowed states** (e.g., some string compactifications). If these hold, no discount factor is needed.
