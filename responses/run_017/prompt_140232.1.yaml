prompt: |-
  I'm the quant on a regional flood-defence board. Every quarter we get about a dozen proposals (raise this levee, buy pumping capacity, restore a floodplain), and our hydrology consultants have stopped giving us point probabilities — for each option they hand over a 90% interval for the annual failure probability, because they can't agree on a prior for extreme rainfall. The board is seven people, mostly civil engineers plus two councillors, none of who have heard of imprecise probabilities, and they sign off in a half-day session, so I need a procedure I can run in a afternoon per proposal and then defend to auditors.

  Write me that procedure. It should cover what to do when two options' intervals overlap heavily, when (if ever) to decide off the bottom of an interval versus the top versus something in between, and how to judge whether it's worth paying to narrow an interval before deciding instead of just choosing now. Be blunt about which steps are judgment in a lab coat.

  Then run it on two cases: a cheap levee option whose interval almost entirely overlaps the expensive one's, and a pumping station where most of the expert range looks fine but a couple of experts put the failure rate somewhere catastrophic. One wrinkle: the board has a standing rule that we may not recommend an option that any one of our experts ranks as the worst on the table, unless we flag it explicitly in writing — tell me whether that rule quietly breaks the procedure, and what to do instead if it does.

  Give me exactly five numbered items, one or two sentences each, no intro and no conclusion: the screening step that can kill a proposal outright, the ranking rule for overlapping intervals, the rule about paying to narrow an interval, the two worked cases, and then the board's rule plus what the procedure can't settle. American English please.
reasoning: |-
  We are designing a decision procedure for flood-defense proposals with 90% intervals for annual failure probability (AFP). The board must decide under time constraints and with limited statistical sophistication. The procedure must handle interval overlaps, decisions based on interval bounds, and the value of additional information. Also, we have a board rule that prohibits recommending an option that any expert ranks as the worst unless explicitly flagged.

  We'll break it into five numbered items as requested.

  1. **Screening Step (Kill Outright):** 
     Reject any proposal where the lower bound of the 90% interval for AFP exceeds the board's maximum tolerable failure probability (a pre-set threshold, e.g., 1/100 years). This step uses the worst-case scenario within the interval to eliminate unacceptably risky options.

  2. **Ranking Rule for Overlapping Intervals:** 
     When intervals overlap heavily, rank options by the upper bound of their AFP interval (i.e., the worst-case scenario within the 90% range) to prioritize minimizing maximum regret. If two options have the same upper bound, then use the lower bound (optimizing the best-case) to break ties. This is a conservative approach.

  3. **Rule on Paying to Narrow the Interval:** 
     Only pay to narrow the interval if the cost of additional information is less than the absolute difference between the two options' upper bounds multiplied by the expected loss (in dollars) from a failure. This is an expected value of information (EVI) calculation, but simplified: if the potential savings in expected loss from a better decision outweigh the research cost, then invest.

  4. **Worked Cases:**
     - **Cheap vs. Expensive Levee (Overlap):** The cheap levee's interval almost entirely overlaps the expensive one's. Because the upper bounds are similar (due to heavy overlap), choose the cheap option as it has a lower cost and the same (or better) worst-case risk. The tie-breaking by lower bound is not needed because the cheap option is already cheaper and the risk profile is similar.
     - **Pumping Station (Catastrophic Tail):** Most experts give a moderate AFP interval, but a couple put the failure rate in a catastrophic range. The upper bound (worst-case) is very high. Compare the upper bound to other options. If it is the highest among all options, then by the ranking rule (Item 2) it would be ranked low. However, note the board's rule (Item 5) may force a flag or even rejection.

  5. **Board's Rule and What the Procedure Can't Settle:** 
     The board's rule that prohibits recommending an option that any expert ranks worst unless flagged does not break the procedure but requires an extra step: if an option is the worst for at least one expert, then it must be explicitly flagged in the recommendation. However, the procedure cannot resolve expert disagreement; it relies on the interval provided. If flagging is required, then the board must be informed and the reason documented. The procedure cannot overrule the board's rule but must accommodate it.

  Note: The procedure in Item 2 (ranking by upper bound) might sometimes conflict with the board's rule. For example, if an option has a low upper bound (so ranked high by our procedure) but one expert ranks it worst (because of a high point estimate in the tail), then we must flag it. The procedure does not automatically reject such an option, but the flag might lead to further discussion or rejection by the board.

  We are using American English and keeping each item to one or two sentences.
answer: |-
  1. **Screening Step:** Immediately reject any proposal where the *upper bound* of its 90% annual failure probability (AFP) interval exceeds your board’s pre-defined maximum tolerable risk threshold (e.g., 1% AFP), as it’s unacceptably risky even optimistically.  
  2. **Ranking Overlapping Intervals:** When intervals heavily overlap, rank options by their AFP interval’s *upper bound* (prioritizing worst-case risk), then break ties using the *lower bound* (optimizing for best-case savings); this judgment call balances conservatism and cost in the face of uncertainty.  
  3. **Paying to Narrow Intervals:** Only fund further analysis if the cost to tighten an interval is less than the difference in *upper bounds* between contending options multiplied by the financial loss from a failure—this crude expected value of information (EVI) avoids overpaying for precision.  
  4. **Worked Cases:**  
     - **Cheap vs. Expensive Levee:** Pick the cheap levee; its similar upper-bound risk to the expensive one makes extra cost unjustified despite near-total interval overlap.  
     - **Pumping Station:** Reject it unless alternatives are worse; its high upper bound (from catastrophic expert estimates) signals unacceptable worst-case risk per your ranking rule.  
  5. **Board’s Rule and Limits:** The rule requiring flagging if any expert deems an option worst doesn’t break the procedure but forces a documented exception when your ranking picks such an option; the procedure can’t resolve expert disagreement—it’s a judgment call whether to override flagged options based on interval bounds.
