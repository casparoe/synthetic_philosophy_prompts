  - (c): 6 marks available. The candidate does not assess the objection; they merely state it and say it refutes. They don't consider Strawson's distinction between true responsibility and the compatibilist notion. So, let's say 2.

  - (d): 4 marks available. The answer is clear and well-written. Terminology is mostly accurate. Award 4.

  Total: 8 + 3 + 2 + 4 = 17.

