  - (a): 8 marks available. Award 7 (strong, but perhaps a tiny bit overreaching on the practical import, but not wrong). Actually, the practical import is part of Strawson's view and might be acceptable. But the question only asks for the argument and why independent of determinism. The candidate does that well. So maybe 8? Let's see: the explanation of determinism/indeterminism is correct. So 8.

