  - The candidate must set out the premises and explain why the conclusion holds regardless of determinism.
  - The candidate's answer:
    - P1: Everything an agent does is because of the way she is (character, motives, etc.).
    - P2: For true moral responsibility, the agent must be responsible for the way she is (in relevant mental respects).
    - P3: No agent can be truly responsible for the way she is (due to a vicious regress).
    - Explains the regress: to be responsible for the way she is, she would have had to make herself that way by an earlier action, which in turn was because of the way she was then, and so on, never starting.
    - On determinism: if true, our nature is handed to us by causes we didn't choose. If indeterminism is true, then what is not settled by character is chance, which doesn't support desert. Either way, P2 cannot be satisfied.

  **Assessment of part (a):**
  - The premises are correctly stated and explained.
  - The explanation of the regress is clear.
  - The independence from determinism is correctly explained: both determinism and indeterminism fail to provide a foundation for desert.
  - However, the candidate adds that Strawson is a hard determinist of a pessimistic sort and draws practical conclusions (about replacing blame with deterrence, etc.). This is beyond what part (a) asks. The question only asks for the argument and why it is independent of determinism. The practical import is mentioned in the exam note as being in the lectures, but part (a) does not require it. It might be considered extra, but not necessary. We should focus on the requirements.

