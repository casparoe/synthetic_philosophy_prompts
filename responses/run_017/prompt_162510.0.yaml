prompt: |-
  Hey — I'm building a little interactive position-sorter for a first-year cog-sci seminar (a web page where students click through nine or ten scenarios and get told which theory of consciousness their answers actually commit them to, rather than which one they've heard of). Topic is the access vs. phenomenal distinction and global workspace theory, and I keep rewriting the intro paragraph because it's easy to sound like a encyclopedia entry. So: help me build the instrument.

  Constraints that matter for my purposes:

  1. Build it from the logical space, not from a list of names. Start from the diagnostic questions, lay out the combinations of answers they allow, then locate the actual positions in that space, and mark the empty cells — with a word on each empty cell about whether it's incoherent, merely unattractive, or just unoccupied because nobody's gotten round to defending it.

  2. I don't want 'access' treated as one thing. Split it into at least three grades: (a) report-ready, the subject can say what it was right now; (b) use-ready, it's available for deliberate reasoning, deciding, guiding action, even if they never report it; (c) influence-only, it biases later processing or behaviour but isn't available for reasoning or report. The sorter should be able to tell apart someone who counts all three as access, someone who counts only (a), and someone who counts (a) plus (b) but not (c).

  3. Second fork I care about: how much weight does the subject's own insistence carry? The interesting cases are ones where performance says one thing and the subject says another, roughly 'you could only name four of the items' vs 'no, I saw all of them, I just couldn't get to them in time'. Put at least two such conflict cases in, and make the answer options turn on whose testimony you trust and why, not just on what happened.

  4. Third fork: actual vs. counterfactual availability. If a state is never reported or used, but would have been had you been asked at the right moment, does that count as access? At least one dream case and one 'you only noticed it later' case belong here.

  Cases I want used, roughly one each (swap in better ones if you've got them, but keep the shape of these):

  - a briefly flashed array of letters or symbols where the subject can name any single row when cued afterwards, but insists they saw the whole array
  - someone with damage to primary visual cortex who 'guesses' well above chance and can guide a reaching movement, but sincerely denies seeing anything
  - driving a familiar route on autopilot, arriving safely, with no memory of the road and no sense of having seen it (I call these the silent-competence cases)
  - a very brief or masked stimulus that changes which word you read next, and which you'd swear you never saw
  - a vivid dream, with no report or action possible at the time
  - a background feeling — posture, a mild ache, a vague unease — that you only properly 'notice' minutes later
  - a change-blindness-style case where the subject is confident and wrong
  - reading a page while thinking about something else, then being asked a comprehension question about the page
  - a thought that clearly guided what you just typed, or a word on the tip of your tongue, that you can't say what it was
  - a case where what people say they saw shifts depending on whether you ask them to describe it freely or to pick from options

  Rules for the questions themselves: no jargon. The words phenomenal, qualia, access, broadcast, workspace, and consciousness-in-the-technical-sense shouldn't appear in any question or answer option. Two or three options each, phrased so a nineteen-year-old who's never opened a philosophy of mind paper can answer, and no option that's just 'yes it's conscious' / 'no it isn't'.

  What I want back: the questions with their options; a scoring key mapping answer patterns onto positions; a tree (nested bullets or ascii, whatever reads cleanly) whose branch nodes are the forks above and whose leaves are named positions — I want at least these as leaves: a global-workspace/broadcast identity view, a Block-style phenomenal-overflow view, a higher-order view, a first-order representationalist view, an illusionist or eliminativist view, and the 'this is all a verbal dispute' deflationary option, plus any other leaf you think belongs. One sentence per leaf on its most awkward commitment. Then a short section on which pairs of leaves the instrument can't actually separate and why (I suspect the broadcast view and the higher-order view collapse on a couple of my cases, but tell me what you actually find), and which answer combinations are unoccupied and why.

  Don't bother with citations or further reading, I've got the reading list sorted — I just need the instrument itself.
reasoning: |-
  We are building an interactive position-sorter for a first-year cognitive science seminar. The goal is to have students answer a series of questions about specific scenarios and then map their answers to a theory of consciousness. The theories we want to cover include:
   - Global Workspace Theory (GWT) / Broadcast identity view
   - Block-style phenomenal overflow view
   - Higher-order thought (HOT) view
   - First-order representationalism (FOR)
   - Illusionism or eliminativism
   - Deflationary view (verbal dispute)

  We have three main forks in the logical space:

  1. **Grades of Access**: We split "access" into three grades:
     (a) Report-ready: subject can say what it was right now.
     (b) Use-ready: available for deliberate reasoning, decision, guiding action (even without report).
     (c) Influence-only: biases later processing or behavior but not available for reasoning or report.

     We want the sorter to distinguish between:
     - Someone who counts all three as access.
     - Someone who counts only (a).
     - Someone who counts (a) and (b) but not (c).

  2. **Weight of Subject's Testimony**: In cases of conflict between performance and subjective report, whose testimony is trusted? We'll have at least two conflict cases.

  3. **Actual vs. Counterfactual Availability**: Does a state that is never reported or used but would have been if asked at the right moment count as access? We'll include a dream case and a 'noticed later' case.

  We have 10 scenarios (we can use 9 or 10). We'll design one question per scenario, each with 2-3 answer options. The questions must be jargon-free and understandable by a 19-year-old with no background.

  Let's list the scenarios and design a question for each:

  1. **Briefly flashed array**: A grid of letters is shown very briefly. The subject can name any single row when cued afterward, but insists they saw the whole array.
     - Question: When the grid was shown, how much of it was actually present to the subject's mind?
       - Option A: Only the row they were cued to report was present; the rest was not really seen.
       - Option B: The whole grid was seen, but they could only report one row at a time because of the cue.
       - Option C: The whole grid was seen, and if they had been cued differently, they could have reported any row.

  2. **Blindsight**: A person with damage to primary visual cortex 'guesses' well above chance and can guide a reaching movement, but sincerely denies seeing anything.
     - Question: When the person is reaching for the object, do they have any visual experience of it?
       - Option A: No, they have no experience at all; they are just good at guessing.
       - Option B: They have a minimal, non-detailed experience that they don't trust or can't report.
       - Option C: They have a full experience but for some reason cannot report it.

  3. **Driving on autopilot**: Driving a familiar route, arriving safely, with no memory of the road and no sense of having seen it.
     - Question: While driving, was the driver consciously seeing the road?
       - Option A: Yes, they were fully conscious of the road but just forgot it afterward.
       - Option B: They were conscious of the road only in a minimal way that allowed driving but not memory.
       - Option C: They were not conscious of the road at all; their actions were guided unconsciously.

  4. **Masked stimulus**: A very brief or masked stimulus that changes which word you read next, and which you'd swear you never saw.
     - Question: Did you consciously see the masked stimulus?
       - Option A: Yes, but only very briefly and then it was forgotten.
       - Option B: No, it was processed without ever being conscious.
       - Option C: It was on the edge of consciousness, but not fully.

  5. **Vivid dream**: A vivid dream with no report or action possible at the time.
     - Question: During the dream, was the dreamer conscious?
       - Option A: Yes, they were having a rich conscious experience even though they couldn't report it.
       - Option B: No, because they couldn't report or act on it, it doesn't count as conscious.
       - Option C: They were conscious, but only in a way that doesn't require access (like reporting).

  6. **Background feeling**: A background feeling (e.g., posture, mild ache, vague unease) that you only properly 'notice' minutes later.
     - Question: Before you noticed it, was that feeling conscious?
       - Option A: Yes, it was conscious all along; you just didn't pay attention to it.
       - Option B: No, it became conscious only when you noticed it.
       - Option C: It was affecting your behavior and mood but wasn't conscious until noticed.

  7. **Change blindness**: A change-blindness case where the subject is confident and wrong about what changed.
     - Question: When the subject is confidently reporting what they think changed (but is wrong), what is the status of their visual experience?
       - Option A: They are having a conscious experience, but it is inaccurate.
       - Option B: They are not conscious of the change, so they are confabulating.
       - Option C: They are conscious of the scene but not the change.

  8. **Reading while distracted**: Reading a page while thinking about something else, then being asked a comprehension question about the page.
     - Question: While reading, was the content of the page conscious?
       - Option A: Yes, they were conscious of the words and meaning, even though distracted.
       - Option B: No, they were processing the words without conscious awareness.
       - Option C: They were conscious of the words but not the meaning.

  9. **Tip-of-the-tongue**: A thought that clearly guided what you just typed, or a word on the tip of your tongue, that you can't say what it was.
     - Question: When you had the thought that guided your typing, were you conscious of the thought?
       - Option A: Yes, you were conscious of the thought even though you can't report it now.
       - Option B: No, the thought was unconscious but influenced your typing.
       - Option C: You were conscious of having a thought but not of its content.

  10. **Shifting reports**: A case where what people say they saw shifts depending on whether you ask them to describe it freely or to pick from options.
      - Question: Why do people give different reports in the two situations?
          - Option A: Because they are conscious of more than they can describe freely, so the options help them access it.
          - Option B: Because their memory is fuzzy, and the options bias their report.
          - Option C: Because they are only conscious of the features they can describe, and the options make them think of new things.

