  Fork 1: Grades of Access
     - What counts as access? (a, b, c as above)

  Fork 2: Weight of Subject's Testimony
     - In conflict cases, do we trust the subject's report or the behavioral evidence?

  Fork 3: Actual vs. Counterfactual Availability
     - Does counterfactual availability (without actual use) count?

  But note: the questions are scenario-based, so we must design the scoring such that the answers to the scenarios collectively determine the position.

