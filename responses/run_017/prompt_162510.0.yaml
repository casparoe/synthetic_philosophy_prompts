answer: |-
  Here’s a complete interactive position-sorter designed around your constraints. It uses 10 scenarios to map answers onto theories of consciousness through logical forks, with no jargon. Students answer questions about concrete cases, and their pattern of responses places them in the logical space of positions. The scoring key and tree highlight commitments and gaps.

  ---

  ### **The 10 Scenarios & Questions**
  Each question has 2–3 options. No theory-specific terms (e.g., "conscious," "access") appear. Students click options to advance.

  1. **Briefly flashed grid**  
     *A grid of 12 letters flashes for 0.1 seconds. You can name any row if cued right after, but you feel sure you saw everything.*  
     **Q:** Why could you only report one row?  
     - A: Because only that row was fully "in mind" at the time.  
     - B: Because you saw it all, but the cue decided what you could retrieve.  
     - C: Because you saw it all, but your mind can only output one row at once.  

  2. **Blindsight**  
     *A person with brain damage denies seeing anything in front of them but "guesses" object locations correctly and can grab them.*  
     **Q:** What explains their accurate grabbing?  
     - A: Their eyes and body processed it, but it never felt like seeing.  
     - B: They had a faint sense of "something" but didn’t trust it.  
     - C: They saw it clearly but couldn’t verbalize or act deliberately.  

  3. **Driving on autopilot**  
     *You drive home safely but recall nothing about the road or signs, and it feels like you never saw them.*  
     **Q:** While driving, were the road details "in mind"?  
     - A: Yes, and they guided your driving, but you forgot.  
     - B: Only enough to steer/brake automatically, but not for recall.  
     - C: No, your body handled it without involving your mind.  

  4. **Masked stimulus**  
     *A word flashes too briefly to name, but it changes how you interpret the next word. You’d swear you never saw it.*  
     **Q:** Did that first word affect you without being "in mind"?  
     - A: Yes, it tweaked your thoughts invisibly.  
     - B: No, you briefly sensed it but it faded too fast.  
     - C: It was "in mind" but blocked from reporting.  

  5. **Vivid dream**  
     *You have a detailed, emotional dream. During it, you can’t report or act on it.*  
     **Q:** Was the dream "in mind" while it happened?  
     - A: Yes, it was fully present even without action.  
     - B: Only if you could have reported it if woken mid-dream.  
     - C: No, because nothing was reportable or usable then.  

  6. **Background feeling**  
     *You notice a stiff neck or unease 10 minutes after it started. Before noticing, it influenced your mood.*  
     **Q:** Before you noticed, was the feeling "in mind"?  
     - A: Yes, but you were distracted.  
     - B: Only if you could have focused on it earlier.  
     - C: No, it only tweaked your behavior invisibly.  

  7. **Change blindness (wrong confidence)**  
     *You’re shown two scenes and feel sure a red object moved. Later, you learn it didn’t—it was blue.*  
     **Q:** Why were you confidently wrong?  
     - A: You clearly saw something change, just misremembered what.  
     - B: You never registered the change; your brain filled in details.  
     - C: You saw the scene but not specifics, so you guessed.  

  8. **Distracted reading**  
     *You read a page while daydreaming. Later, you answer questions about it correctly.*  
     **Q:** While reading, was the page’s meaning "in mind"?  
     - A: Yes, even while distracted.  
     - B: Only the words, not the meaning, were processed.  
     - C: No, it was absorbed without being present to you.  

  9. **Tip-of-the-tongue**  
     *You type a sentence guided by a thought, but you can’t say what the thought was.*  
     **Q:** When guiding your typing, was the thought "in mind"?  
     - A: Yes, but it slipped away before you could name it.  
     - B: No, it shaped your words without being present.  
     - C: Only its effects were present, not the thought itself.  

  10. **Shifting reports**  
      *People describe a complex image differently when asked freely vs. choosing from options (e.g., they call a shape "pointy" freely but pick "spiky" from a list).*  
      **Q:** Why the shift?  
      - A: They saw more than they could describe freely; options helped.  
      - B: They saw only what they described; options made them rethink.  
      - C: Their memory was fuzzy; options biased them.  

  ---

  ### **Scoring Key: Mapping Answers to Positions**
  Patterns of answers map to 7 positions. Each position is defined by its commitments in the logical space. The **Response Profile** column shows the required answers for scenarios 1–10 (e.g., "1A, 2B" = Scenario 1, Option A + Scenario 2, Option B). Unlisted answers default to any option.

  | Position                              | Response Profile                                                                 | Most Awkward Commitment                                                                 |
  |---------------------------------------|----------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | **Global Workspace (Broadcast)**      | 1B/C, 2A, 3A/B, 4A, 5B, 6B, 7B, 8A/C, 9A, 10A                                  | Driving autopilot (3A/B): Competence without recall implies "in mind" access, but no subjective trace. |
  | **Phenomenal Overflow (Block-style)** | 1B/C, 2B/C, 3A, 4B/C, 5A, 6A, 7A, 8A, 9A, 10A                                  | Blindsight (2B/C): Denial of seeing contradicts objective performance; must trust subjective reports. |
  | **Higher-Order Thought (HOT)**        | 1A, 2A, 3C, 4A/C, 5B/C, 6B/C, 7B/C, 8C, 9C, 10B                                | Dream (5B/C): Vivid dreams aren't "in mind" unless higher-order awareness is possible during sleep. |
  | **First-Order Representationalism**   | 1B, 2A/B, 3B, 4A, 5A/B, 6B, 7A, 8B, 9A, 10A                                    | Masked stimulus (4A): Unreportable, non-deliberate influence counts as "in mind" access. |
  | **Illusionism/Eliminativism**         | 1A, 2A, 3C, 4A, 5C, 6C, 7B/C, 8C, 9B, 10C                                      | Change blindness (7B/C): Confidence about unseen changes is an illusion; no "real" experience. |
  | **Deflationary (verbal dispute)**     | Mixed/contradictory profiles (e.g., 1A + 2B, or 5A + 6C)                       | Any case: Treating "in mind" as a shallow label, not a real distinction.                |
  | **Access = Report-Only**              | 1A, 2A/C, 3C, 4C, 5C, 6C, 7B, 8C, 9A, 10B                                      | Tip-of-the-tongue (9A): A thought guiding action counts as "in mind" only if reportable. |

  ---

  ### **Logical Tree of Positions**
  Branch nodes are the 3 forks. Leaves are positions. **Bold** = branch criterion.  
  - Fork 1: **Grades of "in mind" access** (report-ready, use-ready, influence-only)  
  - Fork 2: **Weight of subjective report** in conflict cases (trust self-report vs. trust performance)  
  - Fork 3: **Counterfactual availability** (counts as "in mind" vs. only actual use/report)  

  ```ascii
  ROOT: What makes something "in mind"?
  │
  ├── **Fork 1: Grades of access** (Scenarios 3,4,9)
  │   │
  │   ├── Only report-ready counts (3C, 4C, 9A) → Access = Report-Only
  │   │
  │   ├── Report + use-ready count (3B, 4A, 9A) 
  │   │   │
  │   │   ├── **Fork 2: Trust self-report?** (Scenarios 1,2,7)
  │   │   │   ├── Trust report (1B/C, 2B/C, 7A) → Phenomenal Overflow
  │   │   │   └── Trust performance (1A, 2A, 7B) 
  │   │   │       │
  │   │   │       └── **Fork 3: Counterfactual counts?** (Scenarios 5,6)
  │   │   │           ├── Yes (5B, 6B) → Global Workspace
  │   │   │           └── Only actual (5C, 6C) → First-Order Representationalism
  │   │   │
  │   │   └── Influence-only also counts (3A, 4A, 9B) → Illusionism
  │   │
  │   └── (No branch for all three grades; see unoccupied cells below)
  │
  └── **Fork 2: Trust self-report?** (Scenarios 1,2,7)
      │
      ├── Trust report (1B/C, 2B/C, 7A) 
      │   │
      │   └── **Fork 3: Counterfactual counts?** (Scenarios 5,6)
      │       ├── Yes (5A, 6A) → Phenomenal Overflow (if not in access branch)
      │       └── Only actual (5B, 6B) → Higher-Order Thought
      │
      └── Trust performance (1A, 2A, 7B) 
          │
          └── **Fork 1: Grades of access** 
              ├── Report + use-ready (3B, 4A, 9A) → Global Workspace (if not in access branch)
              └── Influence-only (3A, 4A, 9B) → Illusionism
              └── Mixed/conflicting → Deflationary
  ```

  ---

  ### **Unoccupied Cells & Indistinguishable Pairs**
  - **Unoccupied cells** (answer combinations no theory holds):  
    - *All three access grades* (report + use + influence): Incoherent—collapses functional distinctions (e.g., Scenario 4A + 4C implies invisible influence counts as "in mind," but no theory endorses this without qualification).  
    - *Counterfactual-only "in mind"* (e.g., Scenario 5A + 6A but 3C + 4C): Unattractive—requires something be "in mind" only in unrealized scenarios (dreams) but not in similar real cases (autopilot).  
    - *Trust performance + require report-only access* (e.g., 1A, 2A, 7B + 3C, 4C, 9A): Unoccupied—theories requiring report-ready access (e.g., HOT) also require higher-order awareness, not just performance.  

  - **Indistinguishable pairs** (instrument can’t separate):  
    - **Global Workspace vs. First-Order Representationalism**: Both accept use-ready access and counterfactuals (e.g., 3B, 5B, 6B). Separable only if students reject counterfactuals (5C/6C → FOR) or insist on "broadcast" (vague in questions).  
    - **Phenomenal Overflow vs. HOT with trust in report**: Both trust self-reports in conflict cases (1B/C, 2B/C). Separable only if students reject counterfactuals in dreams (5B/C → HOT) or insist on "overflow" without access (indistinguishable in Scenario 8).  
    - **Illusionism vs. Deflationary**: Both distrust reports and emphasize performance (1A, 2A). Deflationary only identified via inconsistent answers (e.g., 5A + 6C).  

  ---

  ### **How to Use**
  1. Students answer all 10 questions (web interface: buttons for A/B/C).  
  2. Responses are scored against **Response Profiles** to assign a position.  
  3. Tree provides a decision-path alternative.  
  4. Output: "Your answers align most with [position]. This commits you to: [awkward commitment]."  

  This avoids encyclopedic intros by embedding theory in cases. Fork structure highlights logical tensions (e.g., why no theory accepts all access grades). Conflicts (e.g., Scenario 1 vs. 2) force students to weigh evidence.
