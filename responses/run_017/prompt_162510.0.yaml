  - Block's phenomenal overflow: Consciousness (phenomenal) can occur without access (report-ready). So he would say that in the flashed array, there is phenomenal consciousness without access (until cued). He would trust the subject's report that they saw the whole array.

  - Higher-order thought (HOT): A state is conscious if there is a higher-order thought about it. So it might require that the state is available for higher-order thought (which is a form of use?).

  - First-order representationalism (FOR): A state is conscious if it is a first-order representation with certain properties (e.g., poised for use). This might be similar to access in the use-ready sense.

  - Illusionism: Consciousness is an illusion, so even when we think we have it, we don't. They might say that in the conflict cases, the report is wrong and the behavior is what matters, but also that the feeling of consciousness is not what it seems.

  - Deflationary: The differences are verbal; there is no fact of the matter.

