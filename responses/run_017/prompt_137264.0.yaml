                  Test 4: Perform the cut with dominant hand without narrating. (Scored for B: 1 point if pass)

          We can also test C on the non-dominant hand to see if they are a parakeet? But time.

     Time: 
          Pre-train As: 5 minutes.
          Round 1: 5 minutes teaching + 5 minutes testing = 10 minutes.
          Round 2: 5 minutes writing + 5 minutes practice by C + 3 minutes testing = 13 minutes.
          Debrief: 20 minutes.
          Total: 5+10+13+20 = 48 minutes.

     This leaves time to add a variant test for C:

          Test 5: C performs the cut with non-dominant hand. (Scored for B: 1 point if pass? Or just for data?)

     But we can do it quickly: after Test 4, immediately ask C to try with the other hand. So testing C takes 2 minutes per team? We can do it in 2 minutes overall if simultaneous.

     So add 2 minutes -> total 50 minutes.

     Now, the scoring:

          A's score: based on Test 3 (B's non-dominant hand performance) -> 1 point if pass.

          B's score: 
              - Test 1: 1 point for passing.
              - Test 2: 1 point for passing? But we want to see the effect of narration, so we might not want to incentivize passing? Or we can score it but then in debrief we see the pattern of deterioration. Alternatively, we can make it a bonus? I think we should not include Test 2 in B's score because it's an experimental condition. So B's score is:
                  Test 1: 1 point
                  Test 4: 1 point (if C passes the dominant hand)
                  Test 5: 1 point (if C passes the non-dominant hand) [optional, if we do Test 5]

              But note: Test 5 is asking a lot of C. We might skip it.

          C's score: not scored, or they get a point for passing Test 4.

     Alternatively, we can have team score: the team's score is the sum of A's score and B's score.

     But note: we want the interests to pull apart: A scores on B's variant performance, while B scores on their own performance on the original. So in Round 1, A might want to teach the adaptable skill, while B might just want to learn the rote movement for the dominant hand. 

     We can explain the scoring at the start.

     Materials per team: one deck of cards.

     What to hand each person:

          A: a card deck and a sheet of paper for writing instructions in Round 2? No, in Round 2 it's B who writes. 
          In Round 1, A has the deck to demonstrate.
          In Round 2, B will write on a provided piece of paper.

     Rules of the game announced to the class:

          "We are going to play a game to simulate the transmission of a physical skill. Each team has three roles: A, B, and C. 
           A has been trained in a card trick (a one-handed cut) before the game. 
           The game has two rounds.

           Round 1: 
               A will have 5 minutes to teach B how to do the one-handed card cut with B's dominant hand. 
               After the 5 minutes, B will be tested on three things:
                  1. Perform the cut with your dominant hand without talking.
                  2. Perform the cut with your dominant hand while saying out loud what you are doing at each step.
                  3. Perform the cut with your non-dominant hand.

           Scoring for Round 1:
              - A earns 1 point for the team if B passes test 3.
              - B earns 1 point for the team if B passes test 1.

           Round 2:
               B will write instructions for C on how to do the card cut with the dominant hand. You have 5 minutes to write. Rules: 
                   - No pointing words: you cannot use words like left, right, up, down, towards you, away, etc.
                   - Only text (no drawings).
               Then, C will have 5 minutes to read the instructions and practice. B cannot give any feedback or help during this time.
               After 5 minutes, C will be tested:
                  4. Perform the cut with your dominant hand without talking.

           Scoring for Round 2:
              - B earns 1 point for the team if C passes test 4.

           The team's total score is the sum of the points earned by A and B.

           We will also be taking notes on how the narration affects performance and how well people adapt to the variant."

     Then we pre-train the As (5 minutes) while the rest of the class waits or reads a short handout on something else.

     Then run the rounds.

     What will go wrong:

          1. A cannot do the skill well enough to teach.
             - Solution: During pre-training, ensure they can do it 3 times in a row. Have a backup plan: if an A is struggling, pair them with a stronger A or have the instructor help.

          2. B cannot learn the skill in 5 minutes.
             - It's okay if some fail. It will show in the scores.

          3. Someone tries to film it.
             - Rule: no phones during the teaching and testing. Announce this at the start.

          4. B's manual says "ask A" or is very vague.
             - Rule: the instructions must be a genuine attempt. The instructor can remind them to write detailed step-by-step instructions. If they write "ask A", then C will fail and B loses the point.

          5. C cannot learn from the text.
             - This is expected and part of the lesson.

          6. The narration test: B might not know how to narrate or might stop to think.
             - Tell B: "You must describe what you are doing as you are doing it, continuously. If you stop, we will remind you to keep talking."

     Debrief (20 minutes):

          We will have observed:
            - Some Bs passed the original but failed the variant (parakeets).
            - Some Bs were disrupted by narration (especially those who learned by feel).
            - The written instructions from B to C likely failed for most teams.

          Mapping to the distinction:

            - Knowing-how vs knowing-that: 
                 - The face-to-face transmission allowed B to acquire know-how, which might be hard to put into words (as seen in the difficulty of writing instructions).
                 - The know-how enabled B to do the action, but not necessarily to articulate it (narration disrupted some) or to adapt it (variant).

          Specific moments:

            - The failed manual: This shows that knowing-how (which B has) is not the same as knowing-that (propositional knowledge). B might not be able to articulate the know-how in words. This is evidence for Ryle: knowing-how is not reducible to knowing-that. An intellectualist might say that B does have propositional knowledge but under a practical mode of presentation, and that is why it's hard to articulate.

            - The narrate-aloud penalty: If a B passed Test 1 but failed Test 2, it suggests that the skill was learned as a habit and that conscious attention to the steps disrupts it. This is the "intellectualist legend" that Ryle criticizes: if knowing-how were just knowing-that, then stating the propositions should not disrupt the performance. This is evidence for Ryle.

            - The parakeet cases: Bs who can do the original but not the variant. This suggests they have rote know-how without adaptable know-how. This might be because they were taught by rote demonstration without understanding. This relates to the depth of know-how. Ryle might say that true know-how includes the ability to adapt, but the game design might have only provided the specific training. An intellectualist might say that the variant requires additional propositional knowledge (about how to adjust for the non-dominant hand) that was not transmitted.

          What the game doesn't reach:

            - The game does not show that know-how is a relation to propositions under a practical mode of presentation (the intellectualist view). 
            - It also does not directly address the cases where one has all the relevant propositional knowledge but still cannot do it (like reading a manual on swimming and then drowning). We see a glimpse of that in the failure of the written instructions, but it's not the same as having the propositions and still failing.

          In the final 10 minutes, the instructor can:

            - Summarize the Rylean view: knowing-how is not reducible to knowing-that.
            - Mention the intellectualist response: knowing-how is a species of knowing-that, but the propositions are grasped in a practical way.
            - Use an example: even if you have a manual for the card cut, you might still fail to do it, which suggests that knowing-that is not sufficient for knowing-how. But the intellectualist would say that you also need the practical ability to apply the propositions.

          The shortest way in: 
            - "We saw that having the instructions (knowing-that) wasn't enough for C to do the cut. But even if C had memorized the instructions, that wouldn't necessarily mean they could do it. This suggests that knowing-how requires more than just knowing-that. Ryle says it's a different kind of knowledge. Intellectualists, however, might say that the instructions were incomplete or that the practical mode of presentation is essential."

     This design meets most of the requirements but sacrifices the pure text transmission from A to B due to time and complexity. To include that, we would need more time or a separate activity.

     Given the above, I provide the full rules below.
answer: |-
  Here's a complete, runnable game design based on your requirements, optimized for 75 minutes and 16 students. The skill is a **one-handed card cut (Charlier cut)**, chosen for being visually intuitive but linguistically challenging to describe.

  ---

  ### **Game Setup**
  **Materials per Team (5 teams of 3, +1 observer):**  
  - 2 decks of cards (one for practice, one for testing).  
  - Index cards + pens for written instructions.  
  - Scorecards (pre-printed for tracking, see below).  

  **Team Roles:**  
  - **A**: Knows the skill (pre-trained).  
  - **B**: Learns from A, then writes instructions.  
  - **C**: Learns *only* from B’s written instructions.  

  **Pre-Training (5 mins before game starts):**  
  - Pull all 5 "A"s aside. Teach the one-handed Charlier cut with their dominant hand.  
    - *Script*: "Hold the deck in your dominant hand. Thumb pushes the top half diagonally, fingers catch the bottom half, then flip the top half over. Practice until you can do it 3x in a row."  
    - Ensure they can perform it reliably.  

  ---

  ### **Game Rules & Rounds (Total: 45 mins)**  
  **Round 1: A → B Transmission** (15 mins)  
  1. **A teaches B** (5 mins):  
     - A must get B to perform the cut *with their dominant hand*.  
     - **A’s secret goal**: Maximize B’s ability to adapt to the *variant* (non-dominant hand).  
     - **B’s secret goal**: Maximize their performance on the *original* (dominant hand).  
     - *(Interests conflict: A might prioritize adaptable learning; B might prioritize rote mimicry.)*  

  2. **Test B** (10 mins, proctored by you/observer):  
     - **Test 1 (B’s Original)**: B performs with dominant hand, *no narration*.  
       - *Score*: **B** gets 1 point if perfect.  
     - **Test 2 (Narration Penalty)**: B performs with dominant hand *while narrating each step aloud*.  
       - *Score*: **B** loses 1 point if performance deteriorates from Test 1.  
     - **Test 3 (Variant/Parakeet Check)**: B performs with *non-dominant hand*.  
       - *Score*: **A** gets 1 point if perfect.  
     - **Test 4 (Adaptability Bonus)**: B immediately re-attempts variant *after 30 seconds of self-practice*.  
       - *Score*: **A** gets an extra 1 point if B improves.  

  **Round 2: B → C Text Transmission** (15 mins)  
  1. **B writes instructions** (5 mins):  
     - Rules: **No pointing words** (e.g., "left," "right," "toward you," "like this"). Text only—no diagrams.  
     - *Physically hand B an index card and pen.*  

  2. **C learns** (5 mins):  
     - C reads B’s instructions and attempts the cut *with their dominant hand*. No help from B.  

  3. **Test C** (5 mins):  
     - Perform with dominant hand.  
       - *Score*: **B** gets 1 point if perfect.  

  **Round 3: Pure Text Calibration (15 mins)**  
  - Repeat Round 2 with a **new variant skill** (e.g., *cutting with deck upside down*).  
  - **A writes instructions** *cold* (without meeting B) for the variant. B learns and is tested.  
  - *Score*: **A** gets 1 point if B succeeds.  

  ---

  ### **Scoring System**  
  Track on a scorecard:  
  | Role  | Test                   | Points |  
  |-------|------------------------|--------|  
  | **A** | B’s variant (Test 3)   | +1     |  
  | **A** | B’s adaptation (Test 4)| +1     |  
  | **A** | Pure text (Round 3)    | +1     |  
  | **B** | Original (Test 1)      | +1     |  
  | **B** | Narration (Test 2)     | -1*    |  
  | **B** | C’s performance        | +1     |  

  **\*Narration penalty**: Only deducted if B passes Test 1 but fails Test 2.  
  **Parakeet Check**: Compare B’s Test 1 (original) and Test 3 (variant). A "parakeet" passes Test 1 but fails Test 3.  

  ---

  ### **What You Say at the Start (No Jargon!)**  
  > "We’re testing how skills get passed between people. Teams of three: A, B, C.  
  > - **A** knows a physical skill and will teach **B** in 5 minutes.  
  > - **B** will then write instructions for **C**, who’s never seen it.  
  > - Scoring is based on performance—read your scorecards secretly.  
  > Rules:  
  > - No phones.  
  > - In written rounds: **no directional words** (e.g., ‘left,’ ‘like this’).  
  > - In narration tests: say *what you’re doing* aloud as you do it.  
  > Goal: Maximize your team’s points. Begin now!"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"I can’t learn the cut!"** (B or C fails):  
     - *Allow it*. This reveals the distinction—propositional knowledge ≠ ability.  
  2. **Filming with phones**:  
     - *Block it*. Announce: "No recordings—this is about *live* transmission."  
  3. **Manual says "Ask A" or uses banned words**:  
     - *Allow it but score harshly*. C will fail, teaching the group that language is brittle.  
  4. **A demonstrates but doesn’t explain**:  
     - *Allow it*. Shows tradeoff between demonstration (efficient for B) vs. description (helps variant).  
  5. **Narration causes chaos**:  
     - *Embrace it*. Highlight how it disrupts "feel"-learners but not step-by-step learners.  

  ---

  ### **Debrief Framework (20 mins)**  
  **Map Observations to Philosophy**:  
  | Game Moment             | Ryle’s View (Anti-Intellectualist)                          | Intellectualist Response                                  |  
  |-------------------------|-----------------------------------------------------------|--------------------------------------------------------|  
  | **Failed manual**       | Shows knowing-how ≠ knowing-that; skill resists linguistic capture. | "Propositions *were* transmitted—but C lacked practice to implement them." |  
  | **Narration penalty**   | Conscious articulation disrupts embodied knowledge; "knowledge-how" isn’t propositional. | "Narration overloads working memory—it doesn’t disprove propositional grounding." |  
  | **Parakeet cases**      | Mimicry (passing Test 1, failing Test 3) isn’t true knowledge-how—*adaptability* is key. | "They had *some* propositions (for original context), but not general ones." |  
  | **Pure-text failure**   | Propositions alone can’t convey skill—confirms Ryle’s regress argument. | "Instructions were incomplete; better propositions *would* work." |  

  **What the Game Can’t Reach**:  
  - **Mode of presentation**: The game doesn’t address "practical modes" of grasping propositions (intellectualists’ rebuttal).  
  - **Knowledge without ability**: E.g., "I know all facts about swimming but drown."  

  **Final 10-Minute Bridge**:  
  > "The game shows that *doing* isn’t reducible to *describing*—but is skill *itself* non-propositional? Intellectualists say: ‘No. Skill is applying propositions *under a practical mode*.’ For example, a chef’s knowledge of ‘sauté’ isn’t just verbal definitions; it’s knowing *how to apply* them. Yet Ryle would counter: if that mode isn’t itself propositional, we admit knowing-how is fundamental. So: **can you articulate the ‘mode’ without regress?** That’s the real debate."  

  ---

  ### **Logistics & Timing**  
  - **Pre-training**: 5 mins (during class intro).  
  - **Rounds 1–3**: 45 mins (15 each).  
  - **Debrief**: 20 mins.  
  - **Buffer**: 5 mins for transitions.  

  This design forces collisions with the distinction, minimizes lecture, and maximizes "aha" moments. The scoring pits A against B, exposes linguistic limits, and tags parakeet cases—all while staying physically engaging and philosophically rigorous.
