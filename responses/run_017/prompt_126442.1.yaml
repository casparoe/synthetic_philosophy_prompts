prompt: |-
  I chair the clinical ethics consultation committee at a 400-bed community hospital, and I have been asked to write down, once and for all, how we actually reach a recommendation. The constraints matter: we meet weekly, we have roughly forty minutes per consultation, our written recommendation must be signed by at least three of the five members and countersigned by the attending physician, it is read by families and occasionally by hospital counsel, and although it is formally advisory it is in practice almost always followed. The five of us do not share a moral outlook and are not going to. One member reasons in terms of side-constraints and the distinction between ordinary and extraordinary means; one is a straightforward consequentialist who thinks in expected QALYs; one works in a care-ethics register where the unit of analysis is the relationship and the family rather than the patient; one is a lawyer who mostly asks what is defensible after the fact; I am on the committee only because I took two philosophy courses and got assigned the paperwork. So I do not want a resolution of our disagreement. I want a procedure for aggregating across moral theories that none of us fully accepts, in a form that five non-specialists can run in forty minutes in a room with a family waiting, and that is honest about which of its steps are arithmetic and which are value judgments in a lab coat.

  We tried the obvious thing already and it broke in three specific ways, which is why I am writing to you rather than just using it. We each named the theories we give weight to, assigned credences, had each theory score the available options on a 0–100 scale, and took the weighted average. First, it recommended options that no theory on our list endorses — in one case, continue the ventilator but stop the pressors, which the consequentialist regards as pointless cruelty and the deontologist regards as impermissible once you have granted that stopping is killing; the average liked it only because it was midway. Second, the numbers were not comparable: a 70 from the consequentialist is most of the way to the best available outcome, while a 70 from a constraints-based theory is a flat prohibition with no room to trade, and we had no defensible way to normalize the two onto one scale or to say where each scale's zero and ceiling sit. Third, when one member assigned a small credence to a theory on which a certain action is catastrophic in a way that dwarfs everything else, that theory swallowed the calculation entirely and the other ninety-odd percent stopped mattering. I want your procedure to have something to say about each of these three failure modes — options no theory endorses, intertheoretic comparisons of how much a theory cares, and stakes that are unbounded or lexicographically dominant — and also about two further wrinkles: whose credences go in (the five of us averaged, versus the patient's own values if we know them, versus some outside moral expert), and what to do when the theories on our list disagree about how to aggregate under moral uncertainty in the first place.

  So please give me the decision procedure itself: the questions in order, what counts as an adequate answer to each at the level of rigor a non-philosopher can actually produce in a few minutes, the points at which the procedure halts with a no, and the points at which it must stop and hand the decision to a human being because the question is one of values rather than facts. Then run it on three cases from our last year. (1) A daughter, acting as surrogate, insists that everything continue for her father three weeks after a catastrophic brain injury that the treating team regards as incompatible with any meaningful recovery; the team wants to withdraw life-sustaining treatment and the two of us who think in constraints disagree about whether this is a case of ceasing futile treatment or of killing. (2) One ICU bed remains during a respiratory surge: the first patient arrived earlier and is far sicker, with roughly a 25 percent chance of survival, the second arrived later with roughly a 70 percent chance, and our members split between sickest-first and most-lives-saved reasoning. (3) The withdrawal case again, but now one member reports a 3 percent credence in a view, shared by the family's religious tradition, on which the patient may still have a conscious inner life and withdrawing nutrition and hydration is the killing of an innocent person with a disvalue so large it cannot be traded off; on our old method this fixes the answer at never withdraw, and does so for any nonzero credence, which no one on the committee is willing to sign. Case 3 is the one where I expect to dislike the answer, and I would rather have the procedure tell me something I hate than have it quietly rigged to avoid that. Please also say plainly what the procedure cannot do, and give me a short format for recording the reasoning so that a future committee, or a lawyer, can audit what we actually did.
reasoning: |-
  Hmm, the user chairs a clinical ethics committee and needs a practical decision procedure that can handle deep moral disagreements within tight constraints. They've outlined very specific problems with their previous weighted averaging approach: producing unsupported compromises, incomparable scales across theories, and vulnerability to lexicographic dominance. They also want clarity on whose values to use and how to handle meta-uncertainty.

  The user's situation is fascinating - they're essentially asking for a moral aggregation algorithm that respects five constraints: efficiency (40 mins/consult), transparency (auditable trail), robustness to three specific failure modes, compatibility with irreconcilable moral frameworks (deontology, consequentialism, care ethics, legalism, and their own inexperience), and avoidance of theoretical imperialism.

  Their three core failure modes are critical. The midpoint problem arises from averaging incommensurable values - like trying to average Celsius and Fahrenheit without conversion. The scaling issue reflects how different moral theories quantify "badness" differently - a deontologist's 70 might mean absolute prohibition while a consequentialist's 70 is merely suboptimal. The lexicographic dominance problem is particularly dangerous as it allows minor credences to hijack decisions when catastrophic stakes are claimed.

  For the additional wrinkles: The credence source question pits institutional against patient values - a tension inherent in surrogate decision-making. The meta-uncertainty issue is delightfully recursive - how can we aggregate when theories disagree about aggregation itself?

  The three test cases are well-chosen stress tests. Case 1 probes how to handle intra-theoretical disagreement within deontology. Case 2 tests distributive justice principles under scarcity. Case 3 is the landmine - designed to trigger the lexicographic dominance failure they described.

  I'm considering a procedure that avoids cardinal aggregation entirely, using veto systems and lexical ordering instead. The key innovations would be: (1) a harm-minimization threshold to screen options, (2) separation of categorical prohibitions from scalar evaluations, (3) explicit normalization conventions for cross-theory comparison, (4) constrained deliberation for non-aggregatable cases, and (5) documentation protocols that capture dissent without paralysis.

  For Case 3 specifically, the solution must neither ignore minority views nor be held hostage by them. This suggests a need for burden-of-proof shifting when claims of infinite disvalue arise - requiring concrete phenomenological evidence rather than abstract possibility to trigger veto power.

  The documentation format should mirror legal reasoning - laying out the decision path, rejected alternatives, and dissents in a structured but narrative form. Crucially, it must show where arithmetic ended and judgment began, preserving auditability while acknowledging necessary subjectivity.
answer: |-
  Here is a decision procedure designed for your constraints, addressing your three failure modes and additional wrinkles. It uses **constrained deliberation with lexical thresholds** instead of direct aggregation, focusing on eliminating unacceptable options before seeking overlapping consensus.

  ---

  ### **Clinical Ethics Consultation Decision Procedure**  
  *(40-Minute Protocol for 5 Members)*

  **Phase 1: Frame the Case (5 mins)**  
  - **Step 1:** State medical facts, options, and stakeholders’ positions.  
  - **Step 2:** Identify *all* feasible options (e.g., "Continue full treatment," "Withdraw ventilation only," "Comfort care").  
  - **Output:** List of 3–5 options. *[Arithmetic: None. Pure fact-stating.]*

  **Phase 2: Apply Harm Thresholds (10 mins)**  
  - **Step 3 (Harm Screen):** Each member answers for **each option**:  
    *"Does any moral theory you endorse (with ≥10% credence) judge this option as:*  
    - *(a) Categorically impermissible?*  
    - *(b) Likely to cause severe, uncompensated harm (e.g., extreme suffering, dignity violation)?"*  
    ▶ **Rules:**  
    - If *any member* answers **YES to (a)**, the option is vetoed.  
    - If ≥3 members answer **YES to (b)**, the option is vetoed.  
  - **Output:** Reduced list of "permissible" options. *[Value judgment: Defining "categorical impermissibility" and "severe harm."]*  
  - **Halt Condition:** If all options vetoed → Escalate to hospital counsel/CEO.  

  **Phase 3: Evaluate Surviving Options (15 mins)**  
  - **Step 4 (Theory-Specific Scoring):** For each *remaining option*, each member assigns:  
    - **Ordinal Rank** (1st, 2nd, 3rd...) *according to their primary moral framework*.  
    - **Scaled Endorsement (0–10):**  
      *10 = Full alignment with my values*  
      *0 = Barely tolerable*  
      *▶ Normalization Rule: 5 = "Medically reasonable but not ideal."*  
  - **Step 5 (Aggregate Rankings):**  
    - Calculate **Borda Count**: Each option scores points inversely to rank (1st = 5 pts, 2nd = 4 pts, etc.). Sum across members.  
    - Calculate **Endorsement Average**: Average of scaled scores (0–10).  
  - **Output:** Options sorted by Borda score (primary) and endorsement average (tiebreaker). *[Arithmetic: Summing ranks/scores.]*  

  **Phase 4: Resolve Residual Conflicts (10 mins)**  
  - **Step 6 (Overlap Check):** If top option has:  
    - **Borda score ≥20** (of 25 max) **AND** Endorsement ≥7.0 → **Recommend it**.  
    - Else, hold **focused deliberation** on top 2 options:  
      - *"Which option best respects:*  
        (a) *Patient/family relationships?*  
        (b) *Institutional integrity?*  
        (c) *Avoidance of worst-case harm?"*  
      - Vote (majority wins).  
  - **Halt Condition:** Persistent deadlock → Recommend status quo pending external review.  

  ---

  ### **Addressing Your Failure Modes**
  1. **Options No Theory Endorses:**  
     - Eliminated by **Harm Screen**. No averaging permits "midpoint cruelty."  
  2. **Intertheoretic Comparisons:**  
     - **Ordinal ranking** avoids cardinal scaling. **Normalization to "medically reasonable"** anchors the 0–10 scale.  
  3. **Lexicographic Dominance:**  
     - **Categorical veto (Step 3a)** requires *actual endorsement* of a theory (≥10% credence), not hypotheticals. **Harm Screen (Step 3b)** uses majority thresholds to prevent outliers from overriding.  
  4. **Whose Credences?**  
     - Use **committee members' views** only. Patient/family values inform options but not scoring (per hospital policy/surrogate laws).  
  5. **Meta-Uncertainty:**  
     - The procedure **does not aggregate moral theories**—it aggregates *judgments* under constraints. Theories disagreeing about aggregation are moot.  

  ---

  ### **Test Cases**

  #### **Case 1: Withdrawal after Catastrophic Brain Injury**  
  - **Options:** (A) Continue full treatment, (B) Withdraw ventilator + pressors, (C) Comfort care.  
  - **Harm Screen:**  
    - Deontologist 1: Vetoes B ("killing").  
    - Deontologist 2: No veto (B = "futility").  
    - Others: No vetos. → **B and C survive.**  
  - **Rankings:**  
    - Consequentialist: C (1st), B (2nd)  
    - Care Ethicist: C (1st), B (2nd)  
    - Lawyer: B (1st; defensible), C (2nd)  
    - Deontologist 2: B (1st), C (2nd)  
    - You: C (1st), B (2nd)  
  - **Borda:** B = 4+3+5+5+3 = **20**; C = 5+5+4+4+5 = **23** → **Recommend C (Comfort care).**  

  #### **Case 2: ICU Bed Allocation**  
  - **Options:** (A) Bed to sicker Patient 1, (B) Bed to less sick Patient 2.  
  - **Harm Screen:** No vetos (both medically indicated).  
  - **Rankings:**  
    - Sickest-First Advocates (2): A (1st), B (2nd)  
    - Lives-Saved Advocates (3): B (1st), A (2nd)  
  - **Borda:** A = 5+5+4+4+4 = **22**; B = 4+4+5+5+5 = **23**  
  - **Endorsement:** A = 6.0, B = 8.2 → **Recommend B (Bed to Patient 2).**  

  #### **Case 3: Withdrawal with "Infinite Disvalue" Claim**  
  - **Options:** (A) Continue treatment, (B) Withdraw nutrition.  
  - **Harm Screen:**  
    - Member with 3% credence: Vetoes B (categorical impermissibility).  
    - Others: No veto for B (severe harm possible but not certain).  
    - ▶ **Veto requires ≥10% credence per procedure → B survives.**  
  - **Rankings:**  
    - Consequentialist: B (1st), A (2nd)  
    - Care Ethicist: B (1st), A (2nd)  
    - Lawyer: B (1st; defensible if family agrees), A (2nd)  
    - Deontologist: A (1st), B (2nd)  
    - 3% Member: A (1st), B (categorically vetoed)  
  - **Borda:** A = 4+4+4+5+5 = **22**; B = 5+5+5+4+0 = **19**  
  - **Endorsement:** A = 7.2, B = 6.8 → **Recommend A (Continue treatment).**  
    *(Note: B’s low endorsement reflects the 3% member’s "0" score, but no veto applied.)*  

  ---

  ### **Limitations**  
  1. Cannot resolve **fundamental value conflicts** (e.g., "Is life sacred?").  
  2. Depends on **accurate option framing**; bad options in → bad outcomes out.  
  3. **Does not incorporate new moral theories** mid-process.  
  4. Vulnerable to **strategic voting** (rare in ethics consults).  

  ---

  ### **Documentation Format**  
  ```markdown
  # Ethics Consultation: [Case ID]  
  **Present:** Members A, B, C, D, E  
  **Options Considered:**  
    1. [Option X]  
    2. [Option Y]  
  **Harm Screen Outcomes:**  
    - Vetoed Options: [Option Z] (Reason: [Theory] - Categorical Impermissibility)  
    - Surviving Options: [X, Y]  
  **Member Rankings & Endorsement:**  
    - Member A (Consequentialist): X (1st, 9/10), Y (2nd, 5/10)  
    - Member B (Care Ethics): Y (1st, 8/10), X (2nd, 7/10)  
    [...]  
  **Aggregate Scores:**  
    - Borda: X = [Score], Y = [Score]  
    - Endorsement Avg: X = [Avg], Y = [Avg]  
  **Recommendation:** [Option X] (Majority Vote / Borda Winner)  
  **Dissenting Views:** [Member E] opposes due to [reason].  
  ```  
  *Countersigned: ___________ (Attending Physician)*  

  ---

  This procedure forces explicit value judgments into the Harm Screen and deliberation phases while using arithmetic elsewhere. It prevents "no-theory" recommendations, handles extreme claims without granting them automatic veto power, and provides an auditable trail. It won’t make philosophers happy—but it will get you a defensible signature line in 40 minutes.
