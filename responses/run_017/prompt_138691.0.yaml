prompt: |-
  Hey — I host a small podcast on formal epistemology (mostly grad students listen, plus a few undergrads who wander in from decision theory) and next week's guest is a philosopher who's just published a paper defending *Reflection* as the more basic diachronic norm: the idea being that if you get van Fraassen's principle right, conditionalization falls out of it rather than the other way round, so a lot of the usual back-and-forth about whether conditionalization is really a requirement of rationality is secretly a fight about Reflection. I've read the abstract and maybe half the paper properly and I keep loseing the thread in the technical middle bit, so I want to go in with a plan. I've got about 40 minutes with her.

  Here's what I need: eight interview questions, each with a follow-up keyed to the answer she's most likely to give, and where useful a second follow-up for when she declines to bite. You can assume she'll state the principle herself in the first five minutes (current credence in P, supposing your future credence in P will be r, should be r) and that she'll give the diachronic Dutch book argument, so please definately don't write questions that just invite her to restate either — and no "what got you into formal epistemology" warm-ups, I can do those myself. The stuff I want pressed: (1) the cases where you know in advance that your future self will be epistemically impaired — the drug / brainwashing ones, but also the boring version where you know you'll be sleep deprived or reading a dossier someone has stacked against you; she'll probably say Reflection only constrains deference to future selves you regard as better informed, so the follow-up should make her say exactly how that restriction gets stated without making the principle vacuous, and whether the restricted version still delivers conditionalization. (2) The formulation worry: Reflection as usually stated has you conditioning on your having *exactly* some credence, which looks like conditioning on something you assign probability zero, and there's a weaker "in expectation" version that dodges this — does the Dutch book argument need the pointwise version or does the expectation version carry it, and if it doesn't, what's carrying the normativity? (3) What the diachronic Dutch book is actually supposed to show: if the argument only works because a bookie can exploit the *plan* you'd endorse now, then Reflection looks like a constraint on plans rather than on future credences, and I want a question that makes her say whether she's happy with that and what an argument for Reflection would look like that isn't plan-based — e.g. whether the accuracy / epistemic-utility arguments for conditionalization can be run for Reflection without just piggybacking on the conditionalization result. (4) Self-locating and forgetting cases: you fall asleep and lose information, or you learn only which centered possibility you're in; does Reflection even have a well-formed statement there, and should it be a norm on your earliest self, your current self, or both? (5) A thing I've been chewing on with a friend and can't work out, which I've been calling *deference-with-discount*: instead of deferring to your expected future credence, defer to it minus the bias you can already predict in it (you know that tomorrow you'll have read three alarming headlines and will overreact). Does that collapse back into conditionalizing on a corrected likelihood, or is it a genuinely different norm that's weaker than Reflection but stronger than nothing? If it's the latter, is that a point against Reflection being basic?

  One last thing: for the three questions you think are hardest, add a short note on where her most likely answer is actually *good* — i.e. what she could say that would make the line of questioning collapse, what would count as her having answered rather than deflected, and any place where the question secretly assumes something she'd reject (like that your expected future credence function is well defined, or that the Dutch book argument is meant as a pragmatic rather than evidential argument). I'd rather walk in knowing which of my questions might just die on contact than find out live.
reasoning: |-
  We are preparing for a 40-minute podcast interview with a philosopher who has defended Reflection as the more basic diachronic norm. The goal is to have eight substantive questions, each with a follow-up and sometimes a second follow-up. We must avoid restating the principle or the Dutch book argument. The key areas to press are:

  1. Cases of known future impairment (drugs, brainwashing, sleep deprivation) and how to restrict Reflection without making it vacuous, and whether the restricted version still delivers conditionalization.
  2. The formulation worry: pointwise vs. expectation version and the Dutch book normativity.
  3. The diachronic Dutch book as showing a constraint on plans rather than future credences, and alternative arguments (e.g., accuracy-based) for Reflection.
  4. Self-locating and forgetting cases: how to state Reflection and on whom it is a norm.
  5. Deference-with-discount: whether it collapses into conditionalization or is a genuinely different norm.

  Additionally, for the three hardest questions, we need notes on where her answer could be good (making the question collapse, what counts as answering, and any hidden assumptions).

  Let's design the questions accordingly.

  ---

  **Question 1 (Impairment Cases):**
  **Q:** In cases where you know your future self will be epistemically impaired (e.g., drugged, sleep-deprived, or presented with a biased dossier), you've suggested that Reflection only constrains deference to future selves you regard as better informed. How do you formally characterize "better informed" to avoid trivializing Reflection? Specifically, what conditions must the future self meet for the principle to apply?
  **Follow-up (if she gives a condition):** And under that restricted version, does Reflection still entail conditionalization? Or does conditionalization become a separate requirement?
  **Second Follow-up (if she avoids or the condition seems too weak/strong):** Suppose we say the future self must be at least as well informed as the current self. But then, in the sleep-deprivation case, if I know I'll be sleep-deprived, I might not regard my future self as better informed. Doesn't that mean Reflection doesn't apply at all, leaving no diachronic constraint? How is that better than just rejecting Reflection?

  **Question 2 (Formulation Worry):**
  **Q:** The standard statement of Reflection requires that your current credence in P, conditional on your future credence in P being exactly r, should be r. But since you assign probability zero to any particular real number, this seems ill-defined. Some propose a weaker "in expectation" version: that your current credence should equal your expectation of your future credence. Which version do you defend, and does the Dutch book argument work for it?
  **Follow-up (if she defends the expectation version):** If we use the expectation version, does the Dutch book argument still hold? Because the classic argument targets the pointwise version. If not, what grounds the normativity of Reflection?
  **Follow-up (if she defends the pointwise version):** How do you handle the technical worry of conditioning on measure-zero events? Do you appeal to non-standard analysis or something else?

  **Question 3 (Dutch Book and Plans):**
  **Q:** The diachronic Dutch book argument for Reflection seems to show that if you now plan to have credences that violate Reflection, a bookie can exploit you. But that makes Reflection a constraint on the plans you endorse now, not directly on your future credences. Are you comfortable with that? Or do you think Reflection is a direct constraint on future credences?
  **Follow-up (if she says it's about plans):** Then how does this help establish Reflection as a diachronic norm? Isn't it just a synchronic constraint on current planning?
  **Follow-up (if she says it's about future credences):** What kind of argument would you give for Reflection that doesn't rely on planning or Dutch books? For instance, can we run an accuracy-based argument directly for Reflection without going through conditionalization?

  **Question 4 (Self-Locating and Forgetting Cases):**
  **Q:** In self-locating or forgetting cases (e.g., losing information during sleep or learning which centered world you're in), how should we even state Reflection? For instance, if I forget some evidence, my future self might have a different credence function. Should Reflection be a norm on my current self, my future self, or both?
  **Follow-up:** And in such cases, does Reflection still imply some form of conditionalization? Or do we need a different principle?

  **Question 5 (Deference-with-Discount):**
  **Q:** I've been thinking about "deference-with-discount": instead of deferring to your expected future credence, you adjust it by subtracting the predictable bias (e.g., knowing that tomorrow's headlines will make you overreact). Does this collapse into conditionalizing on a model of your future bias, or is it a distinct norm? And if it's distinct, is it a competitor to Reflection?
  **Follow-up:** If it's a weaker but still rational norm, does that undermine the claim that Reflection is basic?

  ---

  Now, we need three more questions to make eight. We can draw from the key areas and expand:

  **Question 6 (The Basicness Claim):**
  **Q:** You argue that Reflection is more basic than conditionalization. But conditionalization is often motivated by conservatism: minimize belief revision. How does Reflection capture that? Or does it replace conservatism with a different rationale?
  **Follow-up:** If Reflection is more basic, why has conditionalization been the dominant norm? Is there a historical or pedagogical reason, or is it that Reflection only works in a limited range of cases?

  **Question 7 (Alternatives to Dutch Books):**
  **Q:** Besides Dutch books, what other arguments do you offer for Reflection? For instance, are there accuracy-dominance or calibration arguments that directly support Reflection without assuming conditionalization?
  **Follow-up:** And if we had such an argument, would it avoid the planning-based worries of the Dutch book?

  **Question 8 (When Reflection Fails):**
  **Q:** Even in your view, there are cases where Reflection doesn't apply (like impairment). What then? Do we fall back on conditionalization? And if so, doesn't that make conditionalization the more fundamental norm?

  ---

  Now, we must choose the three hardest questions and add notes. I think:

  1. **Question 2 (Formulation Worry)** is hard because of technical issues with probability zero.
  2. **Question 4 (Self-Locating and Forgetting)** is hard because self-locating beliefs are tricky.
  3. **Question 5 (Deference-with-Discount)** is hard because it's a novel idea and might be underspecified.

  **Notes for Question 2 (Formulation Worry):**
  - **Good answer:** She might say that the pointwise version can be made rigorous with regular conditional probabilities or by considering densities, and that the Dutch book can be adapted. Alternatively, she might argue that the expectation version is sufficient and the Dutch book can be restated in terms of expectations (e.g., using scoring rules). 
  - **What counts as answering:** Providing a mathematically sound treatment that avoids conditioning on measure-zero events, or showing that the Dutch book argument can be reformulated without pointwise conditioning.
  - **Hidden assumption:** That the future credence is a continuous random variable. She might reject this by saying we can discretize credences or that in practice we only care about intervals.

  **Notes for Question 4 (Self-Locating and Forgetting):**
  - **Good answer:** She could appeal to a centered version of Reflection, perhaps by requiring that the current self defers to the future self's credence conditional on the information that will be available. She might also say that in forgetting cases, we should conditionalize on the fact that we forget, so Reflection still holds in an adapted form.
  - **What counts as answering:** Offering a clear formulation of Reflection in centered frameworks (e.g., using self-locating propositions) and showing how it handles forgetting.
  - **Hidden assumption:** That forgetting breaks the chain of conditionalization. She might reject this by saying that we can model forgetting as gaining evidence about memory loss, so standard Reflection applies.

  **Notes for Question 5 (Deference-with-Discount):**
  - **Good answer:** She might argue that deference-with-discount is just conditionalization in disguise: you are conditionalizing on your model of the bias. Alternatively, she could say that it is an approximation to Reflection when you can't fully model the bias, but that Reflection remains the ideal.
  - **What counts as answering:** Showing that either it reduces to conditionalization or that it is an ad hoc adjustment that lacks the normative force of Reflection.
  - **Hidden assumption:** That we can predict and correct for bias without full conditionalization. She might reject that we can reliably do this without already having a model that allows conditionalization.

  ---

  Finally, let's compile the eight questions with their follow-ups and the notes for the three hardest.
answer: |-
  Here are eight interview questions designed to press your key areas, each with primary and secondary follow-ups. They avoid restating Reflection or Dutch books, target technical nuances, and include notes for the three hardest questions (marked with **). The questions build on each other to cover impairments, formulation, Dutch books, self-locating cases, and deference-with-discount.

  ---

  ### **Question 1: Impairment Restrictions**  
  **Q:** When restricting Reflection to future selves we regard as "better informed," how do you formally define "better informed" to avoid vacuity (e.g., in sleep-deprivation cases where I know my future self will have *more* information but *worse* processing)?  
  **Follow-up (expected):** If "better informed" requires the future self to have strictly more evidence *and* no known cognitive impairments, doesn’t this make Reflection inapplicable to ordinary cases where we anticipate minor biases (e.g., stress-induced overconfidence)? How is this restriction non-arbitrary?  
  **Fallback Follow-up:** Suppose we weaken "better informed" to mean "net epistemic improvement is expected." Wouldn’t this reintroduce vulnerability to Dutch books in impairment cases, undermining the argument that Reflection delivers conditionalization?  

  ---

  ### **Question 2: Expectation vs. Pointwise Formulation****  
  **Q:** The expectation-based version of Reflection avoids conditioning on measure-zero events. But since the diachronic Dutch book relies on the pointwise formulation, does the expectation version still support the same normativity—or must we ground it elsewhere (e.g., accuracy arguments)?  
  **Follow-up (expected):** If you defend the expectation version, can Dutch book arguments be salvaged by reframing bets in terms of expected credences? Or does this reduce the Dutch book to a synchronic argument about current expectations?  
  **Fallback Follow-up:** If the Dutch book fails for the expectation version, do accuracy/calibration arguments for Reflection *themselves* presuppose conditionalization, making Reflection derivative?  

  > **Notes for Q2 (Hardest):**  
  > - **Collapse Point:** She could argue the Dutch book *does* extend to expectations by treating bets as functions of random variables (e.g., "fair price for a bet conditional on your future credence"). This would answer the worry by showing the argument is robust.  
  > - **Hidden Assumption:** The question assumes Dutch books are the *only* path to normativity. If she rejects this (e.g., "Dutch books are heuristic; normativity comes from accuracy"), the question fails.  
  > - **Good Answer:** Demonstrating that expectation-based Reflection implies conditionalization *without* Dutch books (e.g., via law of total probability).  

  ---

  ### **Question 3: Dutch Books as Constraining Plans**  
  **Q:** The diachronic Dutch book shows that *plans* to violate Reflection are exploitable. But if Reflection only governs current planning, why should we see it as a constraint on future *credences*? Doesn’t this conflate rationality in planning with rationality in belief?  
  **Follow-up (expected):** If Reflection is a planning norm, how does it resolve disputes about whether conditionalization is "required" (e.g., for Bayesians who reject rigid planning)?  
  **Fallback Follow-up:** Could an accuracy-based argument for Reflection avoid this "plan-dependence" and directly show that future credences *must* align with current expectations?  

  ---

  ### **Question 4: Self-Locating/Forgetting Cases****  
  **Q:** In self-locating cases (e.g., forgetting evidence during sleep), how do we even *formulate* Reflection? Your future self has different centered information, so credences aren’t defined over the same algebra. Should Reflection bind your past or present self?  
  **Follow-up (expected):** If you say it binds both, how do you handle conflicts (e.g., your past self expected deference, but your present self knows you forgot key data)?  
  **Fallback Follow-up:** Does Reflection collapse into "self-conditionalization" (e.g., Meacham’s approach) here—and if so, doesn’t that make conditionalization prior?  

  > **Notes for Q4 (Hardest):**  
  > - **Collapse Point:** She could argue self-locating Reflection reduces to deferring to *your future self’s perspective* given their information, making it well-defined (e.g., "Current credence in P should equal the future self’s credence, *conditional on what they’ll know*"). This answers the worry by refining the principle.  
  > - **Hidden Assumption:** That forgetting/centering breaks the "same algebra" requirement. She might reject this (e.g., "Credences are always defined over a unified centered algebra").  
  > - **Good Answer:** Showing Reflection handles these cases *better* than conditionalization (e.g., by dodging the "problem of old evidence" in forgetting).  

  ---

  ### **Question 5: Deference-with-Discount**  
  **Q:** Consider "deference-with-discount": I defer to my expected future credence *minus* predictable bias (e.g., "I’ll overreact to headlines tomorrow, so I discount my future credence by 10%"). Does this collapse into conditionalizing on a model of my bias, or is it a distinct norm?  
  **Follow-up (expected):** If it’s distinct, is this norm rationally optional—or required? And if required, doesn’t it undercut Reflection’s claim to be basic?  
  **Fallback Follow-up:** Couldn’t Reflection absorb this by saying "bias discounting" just *is* conditioning on your current knowledge of future impairments?  

  ---

  ### **Question 6: Reflection’s Primacy Over Conditionalization**  
  **Q:** You claim Reflection entails conditionalization. But if we restrict Reflection to unimpaired futures (Q1), doesn’t conditionalization still apply *more* broadly (e.g., when I know I’ll be impaired)? Doesn’t this suggest conditionalization is more fundamental?  
  **Follow-up (expected):** If conditionalization "falls out" of Reflection only in ideal cases, how is Reflection more basic?  
  **Fallback Follow-up:** Couldn’t we reverse the argument: conditionalization implies Reflection *when* we expect to be rational, so Reflection is derivative?  

  ---

  ### **Question 7: Accuracy Arguments Without Piggybacking****  
  **Q:** Can you give a direct accuracy/utility argument for Reflection that *doesn’t* assume conditionalization? For example, does violating Reflection expose me to dominance by my own future credences?  
  **Follow-up (expected):** If such an argument requires my future credences to be "experts" relative to my current ones, doesn’t this collapse into the "better informed" restriction—and thus inherit its problems?  
  **Fallback Follow-up:** Without Dutch books or accuracy arguments, what independent reason is there to accept Reflection?  

  > **Notes for Q7 (Hardest):**  
  > - **Collapse Point:** She might argue that Reflection minimizes *expected inaccuracy* from your current perspective (e.g., via strictly proper scoring rules), independent of conditionalization. This would make the question redundant.  
  > - **Hidden Assumption:** That accuracy arguments must "piggyback" on conditionalization. She could reject this by showing Reflection optimizes a distinct epistemic utility (e.g., "calibration to future selves").  
  > - **Good Answer:** Proving that for any future credence function, violating Reflection makes your current credences accuracy-dominated.  

  ---

  ### **Question 8: What Reflection Explains That Conditionalization Doesn’t**  
  **Q:** Beyond theoretical parsimony, what *explanatory work* does Reflection do that conditionalization can’t? For instance, does it better handle cases of belief inertia or peer disagreement where agents distrust their future rationality?  
  **Follow-up (expected):** If Reflection mainly clarifies why we *should* trust conditionalization, isn’t it parasitic on the very norm it’s supposed to ground?  
  **Fallback Follow-up:** Could we achieve the same by refining conditionalization (e.g., with "irrevocable" updates) instead of elevating Reflection?  

  ---

  ### **Suggested Flow for 40 Minutes**
  - **Q1–Q3 (15 min):** Impairments, formulation, and Dutch books (core mechanics).  
  - **Q4–Q5 (10 min):** Edge cases (self-locating/discount) to test generality.  
  - **Q6–Q8 (10 min):** Primacy and explanatory power (big-picture critique).  
  - **Buffer (5 min):** Expand on Q5/Q7 if needed.  

  **Trap Avoidance:** The notes flag where answers could defang your questions. Prioritize Q2, Q4, and Q7 early—if she has strong replies, pivot to Q5/Q8. If she rejects Dutch books entirely (e.g., "They’re merely pedagogical"), focus on accuracy arguments (Q3/Q7).
