prompt: |-
  Hey — I'm a PhD student (formal epistemology / phil science adjacent, though my advisor would say I'm really just a stats person with philosophy envy) and I definately keep running into the same wrinkle in my own modeling work and in the literature, and I can't find a word for it. Here's the pattern.

  Take the standard setup: some data is already on the books, everybody knows it, and then a new theory comes along and explains it, and people treat that as a big confirmation — the classic example being the anomaly in Mercury's orbit that had been known for decades and then fell out of a new theory of gravity. Now compare a case I keep seeing in my own field. A theorist is building a model of, say, voting behavior. There's some regularity that everyone in the area has known about since the 90s. She doesn't fit her model to it — no parameters are tuned to match it — but she does scribble in her notebook that it would be neat if this also handled X, and when she has to choose between two formal variants of the model, she picks the one that looks more promising for eventually dealing with X. Years later the model does explain X, and she presents it as a successful prediction. Half her readers say it's legit because the data never entered as an explicit constraint; the other half say it's cooked because X shaped the whole shape of the framework.

  So here's what I'm after. I know about the basic Bayesian headache: if you already know the evidence, its probability is 1, so plain conditionalizing on it can't raise your confidence in a new theory at all. And I know the usual workarounds people wheel out — go back to a counterfactual prior from before you learned the data, or else update on the newly learned logical fact that the theory actually entails the data, which you didn't know before. Fine. But none of those seem to sort out the cases I actually care about, because the question isn't just whether the data was known, or even whether it was explicitly used. My cases sit right on the seam between used in construction and never considered at all: the data hovered in the background, it informed informal hunches, it decided wich formalism got explored, it made the theorist suspect relevance without ever testing it. Sometimes the theorist knew the data but had no idea it mattered until after the theory was finished; sometimes she suspected all along and picked variants accordingly; sometimes the community knew the data but she personally didn't; sometimes she deliberately avoided looking at it until the theory was done, which feels like the cleanest case but might be self-deception.

  Is there an established concept or literature for this middle zone — for the difference between data that explicitly shaped a theory and data that merely hovered in the background, and for how that difference bears on whether old data can confirm? I know people talk about whether the data was used in building the theory, and I know there's the more general distinction between predicting something fresh and merely accommodating something you already had, but my cases sit right on that line and I don't think a bare used/not-used or prediction/accommodation distinction captures them: the influence is real but implicit, and it comes in degrees. What are the nearest concepts here, how does each differ from what I'm describing, and which fits best, if any? If nothing established fits, I'd like you to coin a term and define it, with boundary cases — e.g., what do we say when the data was known to the community but not to the theorist, or when she deliberately avoided it but the whole research program was aimed at it anyway? I'm not after a label to slap on it; I want the carving. What exactly is the property that makes some old-data confirmations count and others not, and where exactly is the line for these in-between cases?
reasoning: |-
  Okay, I'm diving into this PhD student's question. They're in formal epistemology/philosophy of science, grappling with a nuanced problem about how background knowledge influences theory confirmation. The core issue is this gray area where data isn't explicitly used in model-building but still subtly shapes theoretical choices. 

  First, I need to map their examples. The Mercury anomaly is classic "old evidence" - known data that later confirms a new theory. But their voting model case is trickier: the theorist didn't fit parameters to the known regularity (X), yet chose formalism variants because X "would be neat" to explain. This creates tension between "legitimate prediction" and "cooked explanation" camps. 

  Hmm, they've already ruled out simple solutions: Bayesian conditionalization fails because P(e)=1 for known evidence, and standard workarounds (counterfactual priors, updating on entailment) don't address the implicit influence problem. What they're really after is conceptual tools for this spectrum of influence - from data being completely unknown to explicitly constraining the model, with their cases in the murky middle.

  Let me mentally scan epistemology literature. "Use-novelty" (Worrall) comes to mind - but that's binary (used/not-used), while their cases involve degrees. "Ad hocness" (Popper/Lakatos) is related but too pejorative. "Tacking problem" concerns logical irrelevance, not influence. The "theorist's awareness" aspect reminds me of Goldman on epistemic virtues, but not quite. 

  Ah! "Heuristic influence" might capture it - data operating at the problem-framing level rather than formal constraint level. And for the community knowledge vs individual ignorance wrinkle, "distributed epistemic labor" concepts (Kitcher) could help. But neither fully fits. 

  Perhaps coining terms is necessary. "Tacit calibration" for when background knowledge implicitly steers choices? Or "selective pressure" emphasizing how data influences which formalisms survive early selection? Need to define boundaries: e.g., if the community knows X but theorist doesn't, it's "ambient evidence" - still influential but plausibly deniable. 

  The crux seems to be whether data causally controls theory-development decisions. But causation is messy here. Maybe "modal depth" - how easily the theorist could have chosen differently without that knowledge. If they'd pick the same formalism while ignorant of X, it's cleaner confirmation. 

  For their avoidance case: if the research program targets X, deliberate ignorance feels like self-deception - we'd call it "focal evasion." True cleanliness requires both ignorance and irrelevance to the research motives. 

  Ultimately, confirmation weight should track the counterfactual robustness: would this formalism still have emerged without X in the background? The harder it is to answer "yes," the less the result confirms.
answer: |-
  Your "wrinkle" is a profound one that cuts to the heart of theory confirmation, model-building, and the epistemology of scientific practice. This isn't just a gap in terminology—it's a gap in how we conceptualize the *degrees and modes of influence* background knowledge exerts. The established distinctions (prediction vs. accommodation, use-novelty) are too blunt. Here's the conceptual carving you need:

  ### Core Problem: The Spectrum of Background Influence
  The key property is **the causal-explanatory role of the data (X) in the theory-selection process**. This role exists on a spectrum between **Explicit Constraint** and **Ambient Ignorance**, with your cases falling in the messy middle of **Tacit Guidance**.

  Here's the framework:

  1.  **Explicit Constraint (No Confirmation):**
      *   X is directly used: e.g., as a fitting target, a boundary condition, or a formal assumption.
      *   *Why it fails confirmation:* The theory is built *to* match X, making the match non-surprising. Bayesian updates on entailment are invalid here; the entailment relationship is constructed *because of* X.
      *   *Boundary Case:* If X was used to reject a specific model variant *after* initial development but *before* testing against X is claimed, it's still explicit constraint.

  2.  **Tacit Guidance (The Problematic Middle Zone - Confirmation is Ambiguous/Degree-Dependent):**
      *   X does not formally constrain the model but causally influences its development path through the theorist's background beliefs, motivations, or choices.
      *   **Subtypes & Degrees:**
          *   *Motivational Beacon:* X inspires the *entire research program* ("Wouldn't it be great to explain X?"). This heavily biases selection towards frameworks perceived as relevant to X.
          *   *Selective Pressure:* X influences choices *between formally viable variants* (e.g., choosing formalism A over B because A *seems* more adaptable to X later, *even if not tested yet*).
          *   *Interpretive Lens:* X shapes how the theorist *interprets* intermediate results or structures, nudging development towards X-relevance.
          *   *Suspected Relevance:* The theorist has a strong *hunch* X is connected and steers accordingly, even without formal testing.
          *   *Community Atmosphere:* X is "in the air" of the field, shaping shared intuitions about what constitutes an "elegant" or "promising" model, even if the individual theorist doesn't consciously focus on X.
      *   *Why confirmation is problematic:* The match between theory and X is *not* statistically independent. The path leading to the theory T that entails X was causally influenced by the existence and perceived importance of X itself. This creates a risk of **path-dependent confirmation bias**: the theory's ability to entail X seems less surprising *because* X was subtly guiding the path to T. Bayesian counterfactual priors are hard to specify credibly here.
      *   *Boundary Cases:*
          *   *Community Knew, Theorist Didn't:* If the theorist was genuinely unaware of X, this leans towards **Ambient Ignorance**. *However*, if the field's norms/modeling choices are deeply shaped by X (e.g., standard formalisms evolved *because* of X), then X might still exert *indirect* **Tacit Guidance** through the tools and expectations the theorist inherits.
          *   *Deliberate Avoidance:* If X motivated the *entire program* (Motivational Beacon), avoidance feels like **Focal Evasion** – knowing where *not* to look presupposes knowing what *might* contaminate. Confirmation is weak. If X was genuinely peripheral, and avoidance was successful (the theorist had *no* hunch X mattered, and the theory wasn't selected *because* it avoided X), it leans towards **Ambient Ignorance**. The line is thin and relies on the theorist's genuine cognitive state.

  3.  **Ambient Ignorance (Stronger Confirmation):**
      *   X was genuinely unknown to the theorist *and* played no causal role in motivating the research program or selecting the specific theory/model variant. The theory entails X as a genuine surprise.
      *   *Why confirmation is stronger:* The entailment is path-independent. Learning T entails X *is* genuinely new information. Counterfactual priors are more defensible (e.g., "What *would* I have thought of T *before* knowing X existed?"). Bayesian updating on the entailment relation works cleanly.
      *   *Boundary Case:* If the theorist knew X existed but had *zero* suspicion it was relevant to *this kind* of model, *and* X didn't influence any choices, it *might* approach Ambient Ignorance, but proving "zero influence" is epistemically fraught.

  **The Nearest Established Concepts & Why They Fall Short:**

  1.  **Use-Novelty (e.g., Worrall, Zahar):** Focuses only on whether the data was *used in construction*. Too binary. Your cases involve data *not explicitly used* but still *influential*. Fails your "hovered in the background" criterion.
  2.  **Prediction vs. Accommodation:** Focuses on temporal order (before/after theory formulation). Your issue is about *influence*, not timing. An "accommodation" can be clean (Ambient Ignorance) or dirty (Explicit Constraint/Tacit Guidance). A "prediction" can be weak if guided by Tacit Guidance ("Let's see if this model I built hoping to handle X *actually* handles X").
  3.  **Ad Hocness (Popper/Lakatos):** Focuses on modifications made *solely* to save a theory from falsification. Your cases are about *initial construction* and *selection*, often *before* any conflict arises. Influence can be proactive, not reactive.
  4.  **Heuristic vs. Justification Context (Reichenbach/Discovery vs. Justification):** Too coarse. Tacit Guidance blurs this distinction – background knowledge influencing model *choice* operates in a messy space between discovery (inspiration) and justification (constraint).
  5.  **Tacking Problem:** Concerns logical irrelevance. Your issue is about causal/pragmatic relevance to the *process*, not logical relevance of the evidence.

  **A Proposed Terminology: Path-Dependent Confirmation & Tacit Calibration**

  *   **Core Problem:** **Path-Dependent Confirmation Bias:** The risk that the confirmation value of evidence X for theory T is inflated because the path taken to develop/select T was causally influenced by the existence and perceived importance of X itself.
  *   **The Middle Zone:** **Tacit Calibration:** The process by which background knowledge (including known data X) *implicitly* guides theory/model development and selection decisions (e.g., choice of formalism, research direction, variant selection) without being an explicit constraint. This calibration occurs through:
      *   **Motivational Steering:** X inspires the program.
      *   **Selective Filtering:** X influences choices between viable options.
      *   **Interpretive Shaping:** X frames how intermediate results are understood.
  *   **The Property for Weighty Confirmation:** **Path-Independent Entailment:** The degree to which the entailment of X by T is independent of the causal influence of X on the path taken to arrive at T. High path-independent entailment occurs only under near **Ambient Ignorance** or genuine **Surprise**.
  *   **The Line (As Best as Can Be Drawn):** Confirmation is significantly weakened when Tacit Calibration involves **Selective Filtering** or stronger forms (Motivational Steering). It's strongest when the theorist was in a state of Ambient Ignorance regarding X *and* the research program wasn't Tacitly Calibrated towards X by the community. Deliberate avoidance is **Focal Evasion** if X was a strong Motivational Beacon; its success in achieving Ambient Ignorance is highly suspect.

  **Applying the Carving:**

  *   **Your Voting Model Case:** Clear **Tacit Calibration** via **Selective Filtering** (choosing formalism variant for X-potential). The "successful prediction" claim is weakened because the path to the theory was causally influenced by X. It's not "cooked" (Explicit Constraint), but it's not clean (Ambient Ignorance). The confirmation value is moderate but attenuated.
  *   **Mercury's Orbit:** Generally considered a cleaner case. While Einstein certainly knew about the anomaly, General Relativity's development was primarily motivated by foundational principles (equivalence, general covariance) *not* explicitly by Mercury. The anomaly was a known *test*, but not a primary *driver* of the theory's mathematical structure in the way Selective Filtering operates. It sits closer to the "known but not influential in selection" end of Tacit Calibration, arguably crossing into "Surprise" when the *magnitude* of the match became clear. Its confirmation value is higher than the voting case.
  *   **Community Knew, Theorist Didn't:** If the theorist used standard tools *unaware* they were evolved for X, it's **Inherited Tacit Calibration** – confirmation is still attenuated. If the tools/modeling approach were genuinely X-agnostic, closer to **Ambient Ignorance**.
  *   **Deliberate Avoidance:** If the program's *raison d'être* was explaining phenomena *like* X, it's **Focal Evasion** – strong **Motivational Steering** makes avoidance superficial; confirmation is weak. If X was truly orthogonal and avoidance successful, *and* the entailment is surprising, confirmation is stronger (**Achieved Ambient Ignorance**), but this is rare.

  **Conclusion:**

  The property that matters is **the causal role of the evidence X in the specific sequence of decisions that led to the theory T**. Confirmation is strongest when X played *no causal role* (Ambient Ignorance/Surprise). It's weakest when X was an Explicit Constraint. The messy middle is **Tacit Calibration**, where X's influence is real but indirect, operating through background beliefs shaping choices. The key concepts are **Path-Dependent Confirmation Bias** (the risk) and **Tacit Calibration** (the mechanism causing it), with **Path-Independent Entailment** being the ideal for strong confirmation. This framework acknowledges the spectrum of influence and provides the conceptual tools to dissect your cases more precisely than the existing binary distinctions allow. It highlights that the epistemology of "old evidence" is deeply intertwined with the pragmatics and sociology of theory development.
