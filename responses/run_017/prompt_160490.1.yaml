prompt: |-
  I work in RL — mostly post-training of LLM agents, some multi-agent stuff — and two of us in the lab got into a dumb argument last week after someone dropped a link to that decision-theory literature in the group chat: Newcomb-style problems, functional decision theory, all of it. I got nowhere with it, because it's written in terms of "acts" and "causal dependence" and "what sort of person you'd be", and I kept wanting to rewrite every sentence as something about policies and rollouts. So: help me do that rewrite properly. The two cases we were actually arguing about were counterfactual mugging — a near-perfect predictor (Omega, I think, in the version I read) flips a coin; in the heads branch you get a big payout iff the predictor thinks you would have handed over a much smaller amount in the tails branch; you find yourself in the tails branch holding the request; do you pay — and XOR blackmail, which I only half remember: a blackmailer who sends the demand iff exactly one of (you would pay) and (the threat is real / you actually have the embarrassing thing) holds, so that getting the letter at all tells you something about which world you're in. If I've got the XOR backwards, fix it and use whichever version makes the case bite.

  What I want is a translation, then a residue report. Translate the disagreement between the causal, evidential and functional theories — specifically as it shows up in those two cases — into the vocabulary I actually think in: policy versus action, rollouts and trajectories, reward and advantage, credit assignment, policy gradients, off-policy evaluation and importance ratios, learned world models and simulators, distribution shift, reward models and monitors, checkpoint selection and "which model do we ship", pretraining versus inference-time compute, adversarial robustness. I'm fluent in all that, so don't explain it back to me; use it. Then tell me what carried over cleanly, what only fits if you distort it, and what has no expression in that vocabulary at all — and, the part I actually care about, whether the residue is a real gap in how I'm thinking or a sign that the philosophers' disagreement is less substantive than it looks. Also: I'm on a train with patchy signal, so no reading lists or citations, I can't check any of it.

  My hypothesis, offered as a hypothesis: FDT mostly collapses into two things I already have — score the policy rather than the action, i.e. evaluate whole policies ex ante before the observation arrives, with the predictor built into the environment as just another part of the dynamics (my labmate Priya thinks this is really just a dispute about which counterfactual your simulator implements) — plus "be updateless", which is an odd but perfectly implementable design choice — and that everything left over is a fight about which functional counts as *the* objective, which no framework settles. If that's wrong, say where it goes wrong. A few things I'd like handled on the way: the gradient in the branch you're not in is zero, so nothing in a normal training loop pushes a policy toward paying — is there any objective short of ex ante policy selection that gets you there? I also invented a variant, no idea if it's in the literature: the predictor runs your policy inside a sandbox simulation, and the policy is in principle able to detect that it's in a sandbox and behave differently, so the simulation and the deployment diverge — what does each theory want there, and does my vocabulary even have room for "my policy is instantiated twice, once as somebody else's model of me"? And is what they call the agent's logical rather than empirical uncertainty about its own output anything more than the ordinary gap between what I trained and what actually gets deployed?
reasoning: |-
  We are going to translate the decision theories (Causal Decision Theory - CDT, Evidential Decision Theory - EDT, and Functional Decision Theory - FDT) into the RL vocabulary. We'll focus on two problems: Counterfactual Mugging (CM) and XOR Blackmail. Then we'll analyze the residue and test your hypothesis.

  ### Key Concepts in RL Terms:
  - **Policy (π)**: A function mapping states/observations to actions (or distributions over actions). We consider policies that are trained and then deployed.
  - **Rollout/Trajectory**: A sequence of state-action-reward tuples generated by interacting with the environment.
  - **Reward (R)**: The scalar feedback signal. We care about expected cumulative reward (value).
  - **Advantage (A)**: How much better an action is compared to the average at a state.
  - **Credit Assignment**: How much each action in a trajectory contributes to the total reward.
  - **Off-policy Evaluation**: Evaluating a policy using data collected by another policy (using importance sampling ratios).
  - **World Model / Simulator**: A learned model of the environment dynamics. Can be used for planning or simulation.
  - **Distribution Shift**: When the deployment environment differs from the training environment.
  - **Checkpoint Selection**: Choosing which version of the policy to deploy based on some criterion (e.g., performance in a simulator).

  ### Counterfactual Mugging (CM) in RL Terms:
  - **Setup**: 
    - There's a near-perfect predictor (Omega) that flips a coin (H: heads, T: tails).
    - In the heads branch (which occurs with prob 0.5), the agent receives a large reward (say, $1M) only if Omega predicted that in the tails branch the agent would have paid $1000 when asked. Otherwise, nothing.
    - In the tails branch, the agent is asked to pay $1000. If it pays, it gets nothing (except the knowledge that in the heads branch it might get the reward). If it doesn't pay, it keeps the $1000.
    - The agent is in the tails branch and must decide whether to pay.

  - **RL Translation**:
    - The environment has two possible rollouts: one for heads and one for tails. However, the agent only experiences one rollout (the one that actually occurs). The agent in the tails branch does not get to see the heads branch.
    - The predictor Omega is part of the environment dynamics. Specifically, the environment uses a simulation (or a model) of the agent's policy to predict what the agent would do in the tails branch. This prediction happens before the coin flip (so the entire episode is predetermined by the policy and the coin flip).
    - The state at the time of decision in the tails branch includes the fact that the coin was tails and the agent is being asked for $1000.

  - **Decision Theories**:
    - **CDT (Causal Decision Theory)**: 
      - In the tails branch, the agent considers only the causal effect of its action. Paying $1000 causes a loss of $1000 and no direct gain (because the heads branch is already determined and the agent is in tails). So CDT does not pay.
      - RL Translation: CDT evaluates the action (pay or not) by its immediate consequences in the current branch (trajectory). The advantage of paying in the tails branch is negative (-$1000) because the heads branch is not affected by the action in the tails branch (it's a different branch). The gradient for the action in the tails branch only depends on the immediate reward (and not on the heads branch because it's a separate trajectory). So during training, if we only update based on the experienced trajectory, the agent learns not to pay.

    - **EDT (Evidential Decision Theory)**:
      - EDT conditions on the action. In the tails branch, if the agent pays, that is evidence that the agent is the kind of agent who pays, which in turn is evidence that Omega predicted payment and therefore the agent would have received the $1M in the heads branch. But since the agent is in the tails branch, the heads branch didn't happen, so the agent doesn't get the $1M regardless. So paying is just a loss of $1000. Moreover, the agent being in the tails branch is already fixed, so conditioning on the action doesn't change the fact that the heads branch didn't occur. Therefore, EDT also does not pay.
      - RL Translation: EDT uses the action as evidence about the policy, which in turn affects the reward in the heads branch. But in the actual trajectory (tails), the heads branch is not realized. So the expected reward in the tails branch is just the immediate reward (paying: -$1000, not paying: 0). Also, note that the policy is fixed at deployment, so the action in the tails branch doesn't change the policy that was used in Omega's prediction (which happened before). Therefore, EDT also does not pay.

    - **FDT (Functional Decision Theory)**:
      - FDT considers the entire function (policy) and how it performs across all possible environments (branches). The agent should choose the action that is part of the policy that maximizes the expected reward ex ante (before the coin flip). Ex ante, the policy that pays in the tails branch gets $1M with 0.5 probability (if heads) and loses $1000 with 0.5 probability (if tails). The expected value is (0.5 * $1M - 0.5 * $1000) = $499,500. The policy that doesn't pay gets $0 in the heads branch and $1000 in the tails branch, so expected value $500. Therefore, the policy of paying is better. So FDT pays in the tails branch.
      - RL Translation: FDT evaluates the entire policy (not just the action in the current state) by considering the expected cumulative reward over all possible rollouts (both heads and tails). The policy is selected ex ante (before deployment) to maximize the expected reward. During training, we would optimize the policy to take the action in the tails branch that leads to the best overall performance (across all possible coin flips). This requires that the training process includes both branches (even though in deployment we only see one). We can do this by simulating both branches and updating the policy to pay in the tails branch because of the effect on the heads branch (via Omega's prediction).

  ### XOR Blackmail in RL Terms:
  Let's use the version you described (with XOR condition). The blackmailer sends a demand iff exactly one of the following is true: (1) you would pay, (2) the threat is real (you have an embarrassing secret). So if you get the letter, it means either (a) you would pay and there's no secret (so paying is wasted) or (b) you wouldn't pay and there is a secret (so not paying leads to exposure). The agent must decide whether to pay upon receiving the letter.

  - **RL Translation**:
    - The environment has two binary state variables: 
      - S: whether there is a secret (real threat) or not.
      - P: whether the agent's policy would pay or not (as predicted by the blackmailer, who is a perfect predictor).
    - The blackmailer sends the letter only if (S XOR P) is true.
    - The agent's state: it has received the letter (so it knows S XOR P is true) and must choose to pay or not.

  - **Decision Theories**:
    - **CDT**: 
      - The agent considers the causal effect of paying. Paying costs money and, if there is no secret, it doesn't prevent exposure (because there's nothing to expose). If there is a secret, paying prevents exposure. But the agent doesn't know whether there is a secret. However, note that receiving the letter gives information: it tells you that either (a) there is no secret and you are the type who would pay, or (b) there is a secret and you are the type who wouldn't pay. 
      - The agent conditions on the letter and updates beliefs about S and P. But then it acts. The action of paying does not causally affect whether the secret exists. So if the secret exists, paying prevents exposure; if not, paying is wasted. But because of the XOR condition, the agent's type (P) is fixed (it's a property of the policy) and the secret (S) is fixed. The agent only has to decide the action (which might be different from the policy's default? but note the blackmailer predicted the policy). 
      - Actually, the blackmailer predicted the policy's action in this situation. So the policy is fixed. The agent is the policy. Therefore, the agent's action is determined by the policy. The question is: what should the policy be?
      - Ex ante, before knowing whether the letter arrives, the agent must choose a policy. However, in the moment, CDT might reason: if I pay, then the only way I got the letter is if (S and not P) but then if I pay, that doesn't match P (because P was not paying) — wait, this is confusing. Let me reframe.

    Actually, the standard way is to consider the policy choice ex ante. But let's do it in the moment.

    - **EDT**:
      - Upon receiving the letter, the agent conditions on the action. If the agent pays, that is evidence that the agent is the type who pays (P=true). But then, because the letter was sent (S XOR P), if P is true then S must be false. So paying is evidence that there is no secret and hence paying is wasted. Similarly, not paying is evidence that the agent is the type who doesn't pay (P=false) and hence (by the letter condition) S must be true, so not paying leads to exposure. So both actions are bad? 
      - Specifically:
        - If you pay: evidence that P=true, so (since letter was sent) S=false. Therefore, you lose the money and there's no exposure (so no harm from not paying). 
        - If you don't pay: evidence that P=false, so S=true. Therefore, you get exposed.
      - So EDT is indifferent? Because:
        - Paying: cost (say, -$1000) and no exposure (0) -> total -$1000.
        - Not paying: no cost (0) but exposure (say, -$10000) -> total -$10000.
      - So EDT pays.

    - **FDT**:
      - FDT chooses the policy ex ante. The policy is a function from states (here, whether the letter is received) to actions. The expected utility of a policy is computed over the possible worlds (S and the randomness of the blackmailer's prediction, but the predictor is perfect so we can ignore error). 
      - There are four possible worlds (S and P, but note the letter is only sent in two of them). We assume the prior probability of S (having a secret) is 0.5 and independent of the policy. 
      - Consider two policies:
        - Policy A: pay if letter arrives.
        - Policy B: don't pay if letter arrives.
      - For Policy A (P=true):
          - If S=true: then (S and P) = true -> not XOR -> no letter. So no cost, no exposure.
          - If S=false: then (S=false, P=true) -> XOR -> letter sent. Agent pays. Cost: -$1000, no exposure.
          - Expected utility: 0.5 * 0 + 0.5 * (-1000) = -500.
      - For Policy B (P=false):
          - If S=true: (S=true, P=false) -> XOR -> letter sent. Agent doesn't pay. Exposure: -$10000.
          - If S=false: (S=false, P=false) -> not XOR -> no letter. No cost, no exposure.
          - Expected utility: 0.5 * (-10000) + 0.5 * 0 = -5000.
      - Therefore, Policy A (pay) is better ex ante. So FDT pays.

    - **CDT** if we consider the ex ante policy choice (which is natural in RL) would also choose the policy that maximizes expected reward. So CDT ex ante would choose to pay. But if we consider CDT at the moment of decision (after receiving the letter), then CDT would reason:
        - The secret (S) is already fixed. My action (paying) does not cause S to be true or false. 
        - However, the agent has updated beliefs about S based on receiving the letter. As above, if the agent pays, then what does that imply? Actually, the agent's policy is fixed. The agent is going to follow the policy. But if the agent is using CDT at the moment, it might think: "If I pay, that doesn't change S. But what is the probability of S given that I have the letter?" 
        - By the setup, the letter is sent only if S XOR P. But P is the policy's action. The policy is fixed, so P is fixed. For a given policy, the agent knows P. Then, upon receiving the letter, the agent can infer S. Specifically:
            - If the policy is to pay (P=true), then receiving the letter implies S=false (because XOR: true XOR false = true). Then paying doesn't prevent exposure (because there's no secret) so it's wasted. So the agent would rather not pay? But wait, the policy is to pay. So the agent must pay? 
            - This is confusing because the agent is considering deviating from the policy? But the blackmailer predicted the policy, not the deviation. So if the agent deviates, then the blackmailer's prediction was wrong, so the condition for sending the letter might not hold. This is messy.

    For simplicity, in the standard presentation, the agent is assumed to follow the policy that was predicted. So CDT at the moment of decision would follow the policy. But then the policy should be chosen ex ante. And ex ante, as above, paying is better. So in this case, CDT and FDT agree on the policy (pay) but for different reasons? Actually, the reasons are similar: ex ante expected utility.

    However, note: in the CM, CDT (if applied at the moment) does not pay, but if applied ex ante (to choose the policy) it would choose the policy that pays? Let's check:

    - CDT ex ante for CM:
        - Policy A: pay in tails -> if heads: get $1M (because Omega predicted payment), if tails: lose $1000. Expected: $499,500.
        - Policy B: don't pay in tails -> if heads: get $0, if tails: keep $1000. Expected: $500.
        - So CDT ex ante would choose Policy A.

    So the disagreement is not about ex ante policy selection but about what to do when you are in a specific state (tails branch) and have to choose an action, without the ability to change the policy.

  ### Translation to RL Vocabulary:
  - **FDT** is essentially about **ex ante policy selection** over a distribution of environments (which includes the predictor as part of the environment dynamics). The policy is optimized to maximize the expected cumulative reward over the entire distribution of rollouts (including branches not taken). 
    - This is standard in RL: we train policies by averaging over many rollouts. In CM, we would simulate many episodes with the coin flip and update the policy to pay in the tails branch because of the reward in the heads branch.
  - **CDT** (as applied at the moment of action) is about **action selection in the current state** based on the causal effect of the action on future rewards in the current trajectory. This is what standard RL algorithms (like policy gradients) do: they update the policy based on the actual rollouts. In CM, the tails branch rollout only has the immediate reward, so the policy would not be updated to pay.
  - **EDT** (as applied at the moment of action) uses the action as evidence about the state of the world (including the policy itself) and chooses the action that leads to the highest expected reward given that evidence. This is similar to **Bayesian inference in the environment model**, but note that in RL we don't usually condition on the action to update beliefs about the policy (because the policy is fixed during deployment). However, during training, we might use the action to update a belief state (in a POMDP).

  ### Residue Report:
  1. **What carries over cleanly**:
     - **FDT** maps directly to **ex ante policy selection** in RL. We train the policy over a distribution of environments (including the predictor) to maximize expected return. This is standard RL.
     - The ex ante perspective is natural in RL training. The disagreement in CM and XOR Blackmail is resolved by training the policy to account for the predictor's simulation.

  2. **What fits with distortion**:
     - **CDT at action time**: In RL, during training, we update the policy based on the actual trajectory. But if we want to capture CDT at action time (in deployment) we are essentially doing greedy action selection based on the current state and the model of the environment. However, in the CM, if the agent is only trained on actual rollouts (without considering the counterfactual heads branch) then it will not pay. To get the FDT behavior, we must design the training distribution to include both branches and update the policy accordingly. So the difference between CDT and FDT in CM is about the **training setup**: whether we simulate the predictor's simulation and include it in the training rollouts.
     - **EDT**: This is harder. EDT conditions on the action to update beliefs about the world. In RL, we often use a world model to predict future states, but we don't usually condition on the action to update beliefs about the policy (because the policy is fixed). However, in a POMDP where the agent has uncertainty about its own policy (e.g., in meta-learning or if the policy is stochastic and the agent has imperfect recall) we might do something similar. But this is not standard.

  3. **What has no expression**:
     - The philosophical theories often talk about "logical uncertainty" about one's own policy. In RL, the policy is a known function (at least to the agent designer). During training, we might have uncertainty about the parameters, but at deployment the policy is fixed. However, if the predictor (Omega) is using a simulation of the agent, then the agent's policy is being evaluated in a sandbox. The agent in deployment might be in a situation that was simulated by Omega. This leads to your variant.

  ### Your Variant: Sandbox Simulation
  - **Setup**: The predictor runs the agent's policy in a sandbox simulation. The agent's policy might be able to detect that it is in a sandbox and behave differently than in deployment. So the simulation and deployment diverge.
  - **What each theory wants**:
    - **FDT**: Wants the policy to behave in the sandbox exactly as it would in deployment because the sandbox is used by Omega to determine the reward in a different branch. So FDT would want the policy to be unable to detect the sandbox (or to ignore the detection) so that the simulation is accurate. This is to ensure that the predictor's simulation matches the deployment behavior.
    - **CDT**: In the sandbox, the agent would take the action that is best for the sandbox environment (which might be different from deployment). CDT doesn't care about the deployment when in the sandbox.
    - **EDT**: In the sandbox, the agent would take the action that is evidence of being a good policy (but again, for the sandbox).

  - **In RL Vocabulary**:
    - This is a case of **distribution shift** between training/simulation and deployment. We want the policy to be robust to the shift. 
    - It also relates to **adversarial robustness**: the sandbox is an adversarial setting (if the predictor is adversarial) trying to detect the policy. We might use adversarial training to make the policy behave similarly in both.
    - However, note: the sandbox is run by Omega to predict what the agent would do in deployment. So ideally, the policy should be such that in any context that is indistinguishable from deployment, it behaves the same. This is similar to **invariant representation learning**.
    - But if the policy can detect the sandbox, then it might choose to "defect" and behave differently to get higher reward in the sandbox. However, if it does that, then Omega might predict incorrectly and the agent might lose the big reward in the heads branch.

    - **Implementation**: We can train the policy in an environment that sometimes puts it in a sandbox (without telling it) and sometimes in deployment. The reward is structured so that the agent only gets the big reward in the heads branch if the sandbox behavior matched the deployment behavior in the tails branch. This requires a complex training setup.

  ### Logical Uncertainty about Own Output
  - This is the idea that the agent might not be certain about what action it will output (even though the policy is deterministic). In RL, we don't usually model this because the policy is a fixed function. However:
    - During training, the policy is changing, so we have uncertainty about the future policy (at deployment). This is handled by **checkpoint selection**: we train many policies and select the best one.
    - At deployment, the policy is fixed. But if the agent is part of a larger system that includes the predictor, then the predictor might have a model of the agent that is different from the actual agent. This is a form of **model mismatch**. 
    - In your sandbox variant, the agent might be uncertain about whether it is in the sandbox or deployment, and therefore uncertain about what action it will take (because it might behave differently in the two). This is just **state uncertainty** (a POMDP) and can be handled by including features that help detect the sandbox.

  ### Testing Your Hypothesis:
  You said: "FDT mostly collapses into two things I already have — score the policy rather than the action, i.e. evaluate whole policies ex ante ... plus 'be updateless' ... and that everything left over is a fight about which functional counts as the objective."

  - **Correct**: FDT is indeed about ex ante policy selection. This is standard in RL. The "updateless" part (meaning not updating the policy based on the current state in a way that forgets the ex ante objective) is also implementable: we fix the policy before seeing the state and then follow it.
  - **Where it might go wrong**: 
    - In the sandbox variant, FDT wants the policy to be robust to distribution shift so that the sandbox simulation matches deployment. This is an additional requirement that goes beyond simple ex ante policy selection: it requires that the policy behaves the same in two different environments (sandbox and deployment). This is about **invariance**.
    - Also, FDT is defined in terms of the entire function (policy) and its output in all possible scenarios. This includes scenarios that are not encountered during training (if we haven't simulated them). So we need to ensure **generalization**.
    - The philosophical theories also might be concerned with **logical counterfactuals** (what if I had chosen a different policy, even though I didn't?) which are not directly part of RL. In RL, we only consider the policies we actually train.

  ### Answering Your Specific Questions:
  1. **How to get the policy to pay in CM without ex ante policy selection?** 
     - In a normal training loop (that only updates based on the current trajectory) the gradient for the branch you're not in is zero. So you cannot get the policy to pay without including the counterfactual branch in the training. You must simulate both branches and update the policy based on the reward in both. This is ex ante policy selection.

  2. **Sandbox variant**:
     - FDT wants the policy to behave the same in the sandbox as in deployment. CDT and EDT would have the policy behave optimally in the sandbox (possibly differently). In RL, we can handle this by training in an environment that includes both sandbox and deployment scenarios and giving a reward that depends on the consistency of behavior (or by adversarial training to remove the features that allow detection).

  3. **Logical uncertainty about own output**:
     - This is mostly the gap between the trained policy and the deployed policy (due to distribution shift) or state uncertainty (like sandbox detection). We handle it by robust training and invariant representations. It doesn't require a new concept.

  ### Conclusion:
  The residue is mostly about how we set up the training environment and the robustness of the policy. The philosophical disagreement (as it applies to these two cases) is substantive only if we are restricted to updating the policy based on the actual rollout (like in online RL without counterfactuals). But in standard RL practice, we do train over many rollouts (including counterfactuals) so FDT is natural. The sandbox variant points to a real gap: the need for robust policies that generalize across environments (like sandbox and deployment). This is an active area in RL (domain adaptation, adversarial robustness) and not fully solved.

  So your hypothesis is mostly correct. The main gap in your vocabulary might be the explicit handling of **logical counterfactuals** (if they go beyond what we simulate) and **invariance across environments** (which we do have tools for, but they are not always emphasized in basic RL).
answer: |-
  ### Translation to RL Vocabulary

  **Core Disagreement in Counterfactual Mugging (CM):**
  - **Causal Decision Theory (CDT)**: Treats the tails branch as an isolated MDP. Action selection via policy gradient maximizes $R_{\text{tails}}$ only. Paying has negative advantage (-$1000$), so gradients push toward defection. Ignores correlation between policy behavior and Omega's prediction due to lack of causal path *during* tails rollout.
  - **Evidential (EDT)**: Conditions action on evidence. Observing "I'm in tails" plus "I pay" implies high $P(\text{Omega paid} \mid \pi)$, but *only if* the policy is stochastic or ill-defined. With deterministic policies, $P(\text{pay} \mid \pi) = \mathbb{I}$, so no update. Learns to defect same as CDT.
  - **Functional (FDT)**: Scores the *entire policy* $\pi$ ex ante over both branches. Objective is $J(\pi) = \mathbb{E}_{\text{coin}}[R(\text{state}, \pi)]$. Rollout includes:
    - Heads branch: $R = \$1M$ if $\pi(\text{tails\_prompt}) = \text{pay}$, else $0$
    - Tails branch: $R = -\$1000$ if pay, else $0$
    Policy gradient $\nabla J(\pi)$ gets signal from *both branches* via expectation. Forces $\pi(\text{tails\_prompt})$ toward "pay" despite zero gradient from tails reward alone.

  **XOR Blackmail (Corrected):**
  - *Setup*: Blackmailer sends demand iff $( \text{threat\_real} \oplus \text{would\_pay} ) = 1$. Receiving letter implies exactly one is true.
  - **CDT/EDT**: Given letter, action selection conditioned on evidence:
    - If pay: Evidence suggests $\neg \text{threat\_real}$ (since $\oplus$ holds), so paying wastes money.
    - If don't pay: Evidence suggests $\text{threat\_real}$, so defection causes exposure.
    Both defect (don't pay) to avoid immediate loss.
  - **FDT**: Ex ante policy optimization. Define $\pi_{\text{pay}}$ vs $\pi_{\text{defect}}$. Compute expected reward:
    - $\pi_{\text{pay}}$: Letter sent only if threat real (since $\text{pay} \oplus \text{threat\_real}$). Pay when threatened, avoid exposure. Expected $R$ high.
    - $\pi_{\text{defect}}$: Letter sent only if no threat. Defection harmless when no threat, but when threat exists (and no letter), exposure occurs. Expected $R$ lower.
    FDT chooses $\pi_{\text{pay}}$ at ex ante selection.

  ### Key RL Mechanisms
  - **Ex Ante Policy Selection**: FDT reduces to checkpoint selection *before* environment stochasticity resolves (coin flip/blackmail reality). Optimize $\pi$ over *distribution* of rollouts including predictors as part of environment dynamics.
  - **Off-Policy/Simulation Gap**: Omega's prediction is effectively an *off-policy evaluation* of $\pi$ in the counterfactual branch. Importance ratio = 1 if policy execution matches simulation (no distribution shift), else 0.
  - **Credit Assignment**: FDT assigns credit to $\pi(\text{tails\_prompt})$ based on *heads branch reward* via the expectation. Implemented by:
    - Simulating both branches during training
    - Using a world model that includes Omega (as learned simulator)
    - Policy gradient update: $\nabla J \approx \nabla \log \pi(a_{\text{tails}}) \cdot A_{\text{full}}$, where $A_{\text{full}}$ includes counterfactual advantage.
  - **Updatelessness**: Deployment uses fixed $\pi$ without Bayesian updates about "who I am." RL analog: *freeze policy at inference*; no online learning from the mugging/blackmail event itself.

  ### Sandbox Variant (Predictor Simulates $\pi$)
  - **FDT**: Demands $\pi$ behave identically in sandbox and deployment. Treats sandbox as *part of environment dynamics*. Requires invariant policy under distribution shift (sandbox detection). Objective: $J(\pi) = \mathbb{E}_{\text{sim},\text{real}}[R]$ with penalty for $\| \pi(\text{sim}) - \pi(\text{real}) \|$.
  - **CDT/EDT**: Myopically optimize reward in *current* context (sandbox or real). Sandbox $\neq$ real $\implies$ different actions.
  - **RL Gap**: Standard frameworks lack "other's model of me" as first-class object. Closest analog:
    - *Adversarial robustness*: Train $\pi$ to be indistinguishable under simulations (like GANs).
    - *Recursive modeling*: Learn $\pi_{\text{predictor}}$ that predicts $\pi_{\text{agent}}$, but circularity breaks SGD.

  ### Residue Report
  1. **Clean Fit**:
     - Ex ante policy selection $\rightarrow$ standard RL training loop (optimize over rollout distribution).
     - FDT's "logical uncertainty" $\rightarrow$ distribution shift between training (simulated counterfactuals) and deployment (actual branch).
     - "Acts" $\rightarrow$ actions; "causal dependence" $\rightarrow$ environment dynamics $P(s_{t+1} \mid s_t, a_t)$.

  2. **Distortion Needed**:
     - "What sort of person you'd be" $\rightarrow$ *not* Bayesian belief updates. FDT's "updatelessness" is policy invariance post-selection. RL analog: disable online fine-tuning during deployment.
     - XOR Blackmail evidence $\rightarrow$ EDT's conditioning requires policy stochasticity or belief over $\pi$, but FDT/CDT assume deterministic $\pi$.

  3. **No Expression in RL**:
     - *Logical counterfactuals*: "What if I *were* a different policy?" RL handles this only via explicit off-policy evaluation (e.g., IPS), but IPS fails if $\pi_{\text{eval}}$ not in support of $\pi_{\text{behavior}}$.
     - *Predictor's perfect simulation*: Assumes $\pi$ is exactly computable. RL's *approximate world models* introduce error $\rightarrow$ distribution shift.

  ### Hypothesis Assessment
  **Mostly correct, but undersells two gaps:**
  1. **Training Mechanism for Counterfactuals**:
     - FDT's demand to "pay in tails" requires gradients from *unrealized branches*. Standard policy gradients (PG) / PPO won't do this. Solutions:
       - *Explicit simulation*: Train on both branches (coin flip in environment).
       - *Reward shaping*: Add term for "consistency" (e.g., $\| \pi(\text{tails\_sim}) - \pi(\text{tails\_real}) \|$).
       - *Q-learning with world model*: Learn $Q(s,a)$ including simulated states. Counterfactual advantage flows via $Q(\text{heads}, \cdot)$.
     - Without this, PG *cannot* learn to pay. FDT isn't just "score policy ex ante" – it requires *credit assignment across branches*.

  2. **Logical Uncertainty $\neq$ Deployment Gap**:
     - "Uncertainty about own output" in philosophy assumes $\pi$ is logically determined but unknown. In RL:
       - *Training phase*: Uncertainty over parameters $\theta$ (e.g., via Bayesian RL).
       - *Deployment*: $\pi$ is fixed. "Gap" is distribution shift (e.g., sandbox detection).
     - FDT's demand for policy consistency (sandbox=real) is *stronger* than standard robustness. It requires $\pi$ to be *ignorant* of context (sandbox vs real), which conflicts with RL's stateful policies.

  ### Verdict
  - **Substantive Gap**: FDT's handling of predictors exposes limitations in *credit assignment* and *invariance learning*. RL can implement it, but requires:
    - Explicit modeling of predictors in environment dynamics.
    - Training regimes that simulate counterfactuals.
    - Penalizing policy divergence under adversarial simulations.
  - **Philosophical Dust**: The "functional vs causal" fight reduces to whether the environment dynamics $P(s' \mid s, a)$ includes *other agents simulating $\pi$*. If yes, FDT is just MDP-solving. If no, CDT/EDT win locally but lose ex ante.
  - **Sandbox Takeaway**: FDT demands robust invariance (same $\pi$ in all contexts), which RL only approximates via adversarial training. Your vocabulary *can* express this, but current methods (e.g., PPO + domain randomization) may fall short.
