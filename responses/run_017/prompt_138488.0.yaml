prompt: |-
  I am writing a chapter on the epistemology of historicity — at what point a tradition stops being legend — and I need to know what my supervisor will say about a case of my own before I build a section around it. She works with a three-place scale (history; not history but with a recoverable historical kernel; legend with nothing behind it), and her rulings so far are these:

  - The Trojan War as the epics tell it — gods on the field, the wooden horse, the ten years: kernel only. A real city, destroyed in the right period, lies at the mound now called Hisarlik; the war as narrated is not history.
  - The battle fought at Kadesh in Syria in the thirteenth century BCE: history — even though our accounts are the pharaoh's own temple inscriptions, boastful, numerically impossible and full of divine favour, and the enemy's side of it survives mainly in a peace treaty concluded some years later.
  - The Exodus: legend, nothing behind it — no contemporary Egyptian record of the flight, no trace of a large population in the Sinai over decades. She adds that the late-thirteenth-century Egyptian victory stela naming Israel as a people in Canaan establishes the people, not the story.
  - Arthur: legend — first named some three centuries after the fighting, in a compilation of around 828, while a British writer closer to those events describes the same war against the Saxons, names Ambrosius Aurelianus, and never mentions Arthur. Ambrosius she counts as historical.
  - The Norse voyages to Vinland: history — the sagas were written down two centuries or so after the voyages, but a Norse site has been excavated at L'Anse aux Meadows in Newfoundland and dated to around the year 1000, with the kind of buildings the sagas describe.

  My case: a steppe tradition, first written down in a monastic chronicle roughly six centuries after the events, about the migration of a people and the burning of a town I will call Arshat. The chronicle says the migration was commanded by a sky-fire that stood still over Arshat for three nights, and that is the reason the tradition itself gives for why the people left. At the site the chronicle's own itinerary identifies as Arshat there is a destruction layer radiocarbon-dated to within a generation of the date its king-list implies; above it lies a horizon of foreign-style pottery spread over several hundred miles; ancient DNA shows population turnover at about that date. No contemporary inscription anywhere names either the town or the migrants, and the king-list survives only inside the same late chronicle.

  What will she say about the Arshat migration? More useful to me than the verdict: what rule is she running, which other rules fit her five rulings equally well but come apart here, and which further case — real or constructed — would best tell them apart? I would also like to know whether her middle verdict is doing genuine work, or is only a polite way of declining to answer.
reasoning: |-
  Hmm, the user is writing a chapter on historicity in historical traditions and needs help predicting how their supervisor will evaluate a specific case about the Arshat migration. This involves understanding the supervisor's epistemological framework, which uses a three-place scale: history, not history but with a recoverable kernel, or pure legend.

  Looking at the supervisor's past rulings, I notice some clear patterns. For the Trojan War, she sees a kernel because there's archaeological evidence of a destroyed city at the right time, but dismisses the epic narrative as unhistorical. Kadesh is full history despite biased sources because multiple contemporary records exist. Exodus is pure legend due to lack of contemporary evidence despite later mentions of Israel. Arthur is legend because of late emergence in sources compared to earlier accounts that omit him, while Ambrosius is historical. Vinland is history because archaeological evidence confirms saga details.

  Now for the Arshat case: we have a late written source (6 centuries after events), but also strong material evidence - destruction layer at the identified site, pottery spread showing migration, and aDNA evidence of population turnover. The tradition includes a miraculous element (sky-fire), but the material evidence aligns remarkably well with the migration narrative minus that supernatural element.

  Applying the supervisor's pattern: she seems to prioritize contemporary records when available (Kadesh), but will accept archaeology as confirmation when it matches the narrative (Vinland). She rejects traditions with no material evidence (Exodus) or when archaeology contradicts the narrative (Trojan War). For Arthur, the lack of early mention is decisive despite later traditions.

  Key rules I infer: 1) Contemporary documentation is gold standard but not required if archaeology confirms core claims; 2) Miraculous elements don't automatically negate historicity if separable from material evidence; 3) Late emergence of tradition raises suspicion unless materially corroborated; 4) The "kernel" category applies when archaeology supports setting but not narrative details.

  The Arshat case seems to fit the Vinland pattern - late source but strong material confirmation of core events. The sky-fire would likely be dismissed as legendary accretion. Thus she'd probably rule "history with legendary accretion" rather than using the middle category, since the migration itself has material proof.

  To test the framework, I should propose a case where archaeology partially supports but contradicts key elements - like finding a destruction layer but no foreign pottery, which might trigger the "kernel" category. Or a case with early written traditions but no archaeology, like parts of Herodotus. The middle category seems functional when material evidence supports setting but not events.

  The user should note that the supervisor's scale has an epistemological gap regarding traditions with no material traces but early documentation, and that the "kernel" category avoids false binaries when evidence is partial. For Arshat, emphasize the convergence of evidence types despite the late source.
answer: |-
  Based on your supervisor's established rulings and epistemological framework, here's how she would likely evaluate the Arshat migration case, the rules she's applying, potential alternative rules, and a critical test case:

  1.  **The Verdict for Arshat:** **History (with legendary accretion)**
      *   **Reasoning:** The supervisor prioritizes *convergence of independent evidence types* that materially confirm the *core events* described in the tradition, even if the *narrative explanation* is legendary and the written source is late.
      *   **Alignment with Precedents:**
          *   **Vinland:** Direct parallel. Late written source (sagas) + compelling archaeological evidence (L'Anse aux Meadows, buildings, dating) = **History**. The sagas contain fantastical elements (like encounters with "skrælings"), but the core event (voyage, settlement) is confirmed materially.
          *   **Trojan War:** Archaeology confirms the *setting* (city destroyed at right time) but *contradicts* or *lacks evidence* for the *narrative specifics* (ten-year siege, wooden horse, divine intervention) = **Kernel Only**.
          *   **Kadesh:** Contemporary written records (even biased ones) + corroborating evidence (peace treaty) = **History**.
          *   **Exodus:** Lack of contemporary records + lack of material evidence for the core event (mass migration/settlement in Sinai) + later mention of the *people* (Israel stela) not confirming the *event* = **Legend**.
          *   **Arthur:** Late emergence of the *specific figure* (Arthur) in sources compared to contemporaries describing the *events* without him + lack of contemporary evidence specifically for Arthur = **Legend** for Arthur (but **History** for Ambrosius/events).
      *   **Application to Arshat:**
          *   **Core Event (Migration/Destruction):** Material evidence converges powerfully: destruction layer at the *specific site* identified by the chronicle's itinerary, dated correctly; horizon of foreign pottery demonstrating migration/spread; aDNA showing population turnover. This materially confirms the *what* (destruction, migration, population change) and *where* (Arshat site) at the *when* (rough date).
          *   **Narrative Explanation (Sky-Fire):** Clearly legendary/miraculous accretion, like the divine intervention at Kadesh or the skrælings in Vinland sagas. It doesn't negate the confirmed core event.
          *   **Late Source:** Like Vinland, the late written source is validated by the material evidence. The king-list within it gains plausibility from the convergence of other evidence.
          *   **Lack of Contemporary Inscriptions:** Like Vinland and the Trojan War kernel, this absence is overcome by the strength and convergence of the archaeological, pottery, and genetic evidence specifically tied to the chronicle's location and event description.

  2.  **The Core Rule She's Running:**
      *   **"Convergent Material Corroboration Trumps Late Source Date and Legendary Narrative Accretion for Core Events."** The decisive factor is whether the *fundamental historical claim* (a specific destruction, a specific migration/battle/voyage) receives *independent, convergent material support* (archaeology, archaeometry like C14, material culture spread, bioarchaeology/aDNA) that aligns with the *specifics* (location, approximate date) provided by the tradition, even if mediated through a late or biased source. Legendary explanations for *why* it happened are separable.

  3.  **Alternative Rules Fitting the Five Rulings (But Parting Ways at Arshat):**
      *   **Rule A (Strict Contemporaneity Emphasis):** "Only events attested by roughly contemporary written sources, or by overwhelming & unambiguous *undisputed* material evidence *specifically naming* the event/actors, qualify as History. Kernel requires material evidence plausibly linked to the *setting*. Legend is all else."
          *   *Fits:* Kadesh (contemporary writing), Vinland (undisputed material), Exodus (no contemporary/clear material), Arthur (no contemporary/named material). Trojan War is Kernel (material for setting).
          *   *Parts at Arshat:* Would likely call Arshat **Kernel Only** (material evidence confirms destruction/population change *at the site*, but lacks contemporary writing naming "Arshat migration") or even **Legend** (if demanding named evidence). The material convergence isn't deemed sufficient without a name or contemporary link, unlike Vinland which she accepts as History.
      *   **Rule B (Source Chronology Primacy):** "The relative dating and proximity of the *earliest source* describing the event is paramount. History requires sources very close in time. Kernel requires some early material trace or plausible early origin for the tradition. Legend is late invention."
          *   *Fits:* Kadesh (contemporary sources), Exodus (late sources, no early material), Arthur (late named source vs. earlier source omitting him), Trojan War (Homeric epics late, but very early material evidence for setting/destruction = Kernel). Vinland is the weak point – sagas are late, but she accepts it as History due to material proof.
          *   *Parts at Arshat:* Would likely call Arshat **Legend** or *maybe* **Kernel**. The source is very late (6 centuries), similar to Arthur. The material evidence might push it to Kernel (like Troy), but the core claim (migration *caused by* the event at Arshat) might be deemed too specific for Kernel without earlier sources. Rule B struggles most with Vinland under this supervisor's rulings.

  4.  **Critical Test Case to Distinguish the Rules:**
      *   **The Case:** "The Founding of City X by Hero Y." Earliest written mention is 500 years after the supposed founding, in a chronicle describing Y receiving an oracle to build a city where he saw a specific omen (e.g., an eagle fighting a serpent). Archaeology shows:
          *   Continuous settlement at the site for 1000+ years.
          *   A significant *expansion and cultural shift* (new pottery styles, larger public buildings) radiocarbon-dated *precisely* to the generation *before* the chronicle's date for Y's founding.
          *   No destruction layer. No inscription naming Y or a "founding."
          *   The chronicle's description of the city's early layout partially matches the archaeology of the *post-expansion* phase.
      *   **Distinguishing the Rulings:**
          *   **Supervisor's Rule (Convergent Corroboration):** Likely **Kernel Only**. Material evidence confirms a major development at the site roughly around the right time, consistent with a "founding" *event* (the expansion/shift), but *contradicts* the chronicle's timeline (development happened *before* Y's supposed date) and the specific agent (Y). The oracle is legendary accretion. Core event (major development) is materially confirmed, but narrative specifics (agent, exact timing, cause) are not.
          *   **Rule A (Strict Contemporaneity):** Likely **Legend**. No contemporary writing naming the founding or Y. The material evidence shows development, but it's not *unambiguously* linked to a single founding event or named founder – it could be gradual. Lack of specific naming pushes it to Legend.
          *   **Rule B (Source Chronology Primacy):** Likely **Legend**. The source is very late (500 years). The material evidence shows something happened, but the late source's specific claim about *Y founding it* at a *specific time* is unreliable due to the source gap. The development might have inspired the later founding legend.

  5.  **The Middle Verdict ("Kernel"): Its Function:**
      *   **Genuine Epistemological Work:** Yes, it's doing crucial work. It's not merely politeness. It occupies the space where:
          *   Material evidence confirms the *setting*, *chronology*, or *broad context* of the tradition (Troy's destruction, perhaps City X's expansion).
          *   BUT material evidence *lacks specificity* to confirm the *narrative details* or *specific agents/events* as described (Trojan War narrative, Hero Y founding City X), or even *contradicts* them (City X development pre-dating Y).
          *   AND/OR there is *no contemporary written attestation* of the specific event/agent described in the later tradition.
      *   **Purpose:** It avoids a false binary (History vs. Legend) when there *is* evidence of *something* historical underlying the tradition, but the evidence is insufficient or misaligned to confirm the tradition's *specific narrative claims*. It acknowledges a historical basis without endorsing the legendary narrative. In Arshat, the evidence is strong enough *for the specific event* to jump to History; in Troy, it's only sufficient for the setting.

  **In summary:** Your supervisor will likely rule the Arshat migration as **History** because the *convergence* of destruction layer at the *specific chronicle-identified site*, foreign pottery horizon, and aDNA population turnover provides robust *material corroboration* of the *core event* (destruction-triggered migration), overcoming the late source date and legendary explanation (sky-fire). The rule is "Convergent Material Corroboration Trumps Late Date/Legend for Core Events." Alternative rules (Strict Contemporaneity or Source Chronology Primacy) would likely downgrade Arshat to Kernel or Legend. The "Kernel" category is essential for cases where material evidence supports the setting/context but not the narrative specifics. The "City X Founding" case helps differentiate these approaches.
