prompt: |-
  I've been playing with a spreadsheet version of a very simple game, and I keep running into a pattern I don't have a word for, though I assume there is one.

  The game: a biased coin comes up heads 60 percent of the time. Each round you are required to stake one half of your current bankroll; on heads you gain that half, on tails you lose it. Every round is favorable in the ordinary sense, since the average multiplier on your bankroll is 1.1 per round. Now two things seem true at once. Run a large crowd of players for a few hundred rounds and the average final bankroll grows without bound, at roughly that 1.1 per round, just as you would expect. But any single player who keeps going ends up with essentially nothing, almost surely — and so does the typical member of the crowd: in a crowd of a thousand the median player is nearly broke, while the average is astronomical, held up by a handful who got very lucky. There is no absorbing barrier here and nobody needs bad luck; with the stake set below the whole bankroll, wealth just decays toward zero without ever arriving at it.

  The part I really can't place is what I noticed next. Have a thousand people play that same game on independent coins, and after every round have them throw everything into one pot and split it equally. Now the pot grows at very nearly the same 1.1 per round: the crowd's average has become the actual experience of one continuing entity, and the decay disappears. Have them bet on the same tosses instead of independent ones, and pooling does nothing at all.

  Does the gap in the first case have an established name, and does the pooling maneuver have one of its own? People have offered me risk of ruin, variance drag, and gambler's ruin, and none of them seems to be quite it. I am also not mainly after a label: I want the carving. What does the gap consist in; what is pooling actually doing, such that it closes the gap under independence and not under correlation; how does that differ from ordinary diversification and from insurance; and where in this picture does the advice to stake the growth-maximizing fraction belong? Please answer in under 400 words.
reasoning: |-
  We are dealing with a multiplicative process. Let the initial bankroll be \( B_0 \). In each round, the player stakes half of their current bankroll. The outcome is:

  - Heads (60%): bankroll becomes \( B_{t} \times (1 + 0.5) = B_t \times 1.5 \)
  - Tails (40%): bankroll becomes \( B_t \times (1 - 0.5) = B_t \times 0.5 \)

  The expected multiplier per round is \( 0.6 \times 1.5 + 0.4 \times 0.5 = 0.9 + 0.2 = 1.1 \). So the expected bankroll after \( n \) rounds is \( B_0 \times (1.1)^n \), which grows without bound.

  However, the median and typical experience is decay. Why? Because the growth is multiplicative and the log bankroll evolves as a random walk. Taking logs:

  - Heads: \( \log(1.5) \approx \log(1.5) \)
  - Tails: \( \log(0.5) = -\log(2) \approx -0.693 \)

  The expected change in log bankroll per round is:

  \[ 0.6 \times \log(1.5) + 0.4 \times \log(0.5) \approx 0.6 \times 0.4055 - 0.4 \times 0.6931 \approx 0.2433 - 0.2772 = -0.0339 \]

  This negative drift in the log scale implies that the log bankroll tends to decrease over time, so the median bankroll decays exponentially. The expected bankroll grows because the rare huge wins (which are multiplicative) have a huge impact on the mean but not the median.

  Now, consider pooling:

  1. **Independent coins**: Each player has independent coin flips. After each round, they pool and split equally. This is equivalent to averaging the bankrolls. By the law of large numbers, the average bankroll converges to the expected bankroll per player, which grows at 1.1 per round. The decay in the typical player is offset by the gains of the lucky few, and pooling averages out the fluctuations.

  2. **Same coin**: All players bet on the same coin flip. Then pooling doesn't help because they all get the same outcome. The entire group either multiplies by 1.5 or by 0.5. The expected multiplier per round is still 1.1, but the log drift remains negative.

  The gap between the arithmetic mean (which grows) and the median (which decays) is a consequence of the multiplicative process and the skewness of the distribution. This phenomenon is often called the **volatility drag** or **variance drain** in finance, and the multiplicative process is lognormal in the limit. The key is that the geometric mean (which corresponds to the median in the lognormal distribution) is less than the arithmetic mean.

  Pooling under independence is a form of **diversification**: it reduces the volatility drag by averaging out the idiosyncratic risks. Each player's bankroll is highly skewed, but the average of many independent such processes becomes less skewed and the geometric mean of the average (which is the same as the arithmetic mean in the long run for independent trials) is preserved.

  The growth-maximizing fraction to stake (known as the Kelly criterion) would be found by maximizing the expected log return. In this case, the fraction \( f \) that maximizes:

  \[ g(f) = 0.6 \log(1+f) + 0.4 \log(1-f) \]

  The derivative:

  \[ g'(f) = 0.6/(1+f) - 0.4/(1-f) \]

  Set to zero:

  \[ 0.6/(1+f) = 0.4/(1-f) \]

  Solve: \( 0.6(1-f) = 0.4(1+f) \) → \( 0.6 - 0.6f = 0.4 + 0.4f \) → \( 0.6-0.4 = 0.6f+0.4f \) → \( 0.2 = f \) → \( f=0.2 \)

  So staking 20% (not 50%) would maximize the growth rate. At 50%, the expected log return is negative (as we saw, about -0.0339 per round), so decay is expected. At 20%, the expected log return is positive.

  Thus, the gap arises from overbetting (staking too high a fraction) relative to the Kelly criterion, leading to volatility drag. Pooling independent bets reduces the drag by diversification, effectively averaging out the volatility.
answer: |-
  The phenomenon you observe is primarily **volatility drag** (or *variance drain*), which arises in multiplicative processes with skewed returns. Here, the expected value grows due to the arithmetic mean (1.1 per round), but the median decays to zero because the geometric mean (which governs long-term growth) is less than the arithmetic mean. Specifically, the geometric mean is \( \exp(0.6 \ln 1.5 + 0.4 \ln 0.5) \approx 0.967 \), implying a ~3.3% median decay per round. This gap between mean and median outcomes is a hallmark of volatility drag.

  **Pooling under independence** eliminates volatility drag by **diversification**. When players share independent coin tosses, the pooled bankroll's growth rate converges to the arithmetic mean (1.1) via the law of large numbers. Each player's idiosyncratic risk cancels out, transforming the skewed individual distribution into a smoother, symmetric one centered at the expected value. This is ordinary diversification: uncorrelated risks average out, stabilizing growth.

  **Pooling under identical tosses** fails because outcomes are perfectly correlated; all players win or lose together. No risk reduction occurs, so volatility drag persists. This contrasts with insurance, which pools *negatively correlated* risks (e.g., house fires), reducing aggregate variance more effectively.

  The advice to stake the **growth-maximizing fraction** (Kelly criterion) addresses volatility drag directly. For a 60% win chance, Kelly recommends staking 20% (not 50%), maximizing the geometric mean by balancing risk and return. Staking 50% overbets, ensuring median decay despite a favorable arithmetic expectation. Pooling independent bets effectively enforces optimal fractional betting across the group, aligning median and mean outcomes.
