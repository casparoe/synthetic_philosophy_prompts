prompt: |-
  Eight months ago I was appointed as one of the two lay members of the clinical ethics committee at a large teaching hospital, and I have been asked to run a forty-five minute session for the committee on how we ought to reason when we cannot settle which moral framework is the right one. Our live docket is whether to fund one more place on a very expensive therapy that produces a large benefit for a single patient, or to spend the same money on a change to discharge and follow-up procedures that produces a very small benefit for a very large number of patients. I have to write the recommendation, so this is not academic for me.

  The committee is thirteen people: five physicians, two nurses, a hospital lawyer, a chaplain, a health economist, two lay members and the chair. Nobody has any philosophy training, and several are openly impatient with anything that will not change what we do on Monday. I have a whiteboard and a single one-page handout I will write from your plan, and I do not want to hand out or cite any readings.

  Do not explain the topic to me. Give me a plan for explaining it, covering the following.

  The order the ideas must come in, and for each step what it depends on in the previous step: in particular, where the distinction between uncertainty about the facts and uncertainty about the framework has to be introduced, and why it cannot wait until later.

  The one case that should carry the whole session, built from our docket. Tell me how to construct it so that three frameworks genuinely come apart on it — an aggregating one, one that gives priority to the worst off, and one that treats certain side-constraints as not tradeable at all — and tell me what the case must be stripped of. My instinct is to remove every bit of empirical uncertainty, so that nothing in the disagreement is about how the world is, and also to remove any vividly described named patient; tell me if the second removal is a mistake.

  The misconceptions, in the order the committee will form them, and the exact point in the sequence at which each should be headed off. I anticipate these: that the middle option is the neutral or fair response; that one should average the frameworks' verdicts the way one would average two experts' probability estimates; that uncertainty about which framework is correct is just another empirical uncertainty and so expected-value reasoning settles it in the obvious way; and that if the frameworks cannot be ranked, any decision is arbitrary and we should simply vote. Say which ones I should let surface before answering, and which would poison the rest of the hour if voiced early.

  The hardest thing I need them to see: that the frameworks may not share a scale, so that "how much better is this than that, according to framework one" is not automatically comparable to the same question for framework two, and that our answer on the docket may shift depending on how the scales are lined up. Where in the arc must this go, what has to be in place before it can be said without baffling people, and how do I present it so it does not read as a licence to do whatever we liked anyway?

  One thing I should openly refuse to explain at this level, announcing that I am not explaining it. My instinct is that it should be how weights get assigned to the frameworks in the first place, but tell me if something else is the better omission.

  A check I can run in the last five minutes that distinguishes understanding the structure from having learned my vocabulary. I would like it to be a new case with the property that the compromise action is ranked last, or near last, by every framework on the table, so that someone who has grasped the point refuses to split the difference and someone who has not does it confidently.

  Finally, one complication I want handled rather than set aside: our uncertainty is not only inside each person's head. Different members are confident in different frameworks and will not change their minds in an hour, so for us the question is as much what a body should do when its members' moral convictions differ as what an individual should do when their own do. Tell me whether to build the session around the individual case and translate at the end, or to run both from the outset, and what is lost either way.
reasoning: |-
  Hmm, this is an intricate ethics committee facilitation challenge. The user needs a practical session plan for resolving moral framework disagreements in a time-pressed hospital setting. Let me unpack the requirements systematically.

  First, the constraints are tight: 45 minutes, no philosophy jargon, highly pragmatic audience. The clinical ethics committee composition suggests I must bridge medical, economic, spiritual and legal perspectives without academic references. The user's emphasis on "what changes on Monday" means every concept must translate to action.

  The core dilemma is beautifully framed - massive individual benefit vs distributed micro-benefits. For the session design, three non-negotiable elements emerge: 1) Order of ideas must flow from concrete to abstract 2) The case construction must make frameworks diverge cleanly 3) Misconception management requires tactical timing.

  For the case design, stripping empirical uncertainty is correct but removing patient names might backfire. Naming "Patient A" could prevent depersonalization while maintaining focus. The frameworks need surgical isolation: utilitarianism for aggregation, prioritarianism for worst-off focus, deontology for absolute constraints. The discharge procedure tweak must be microscopic - say saving 5 minutes per patient - to force the tension.

  Timing misconceptions is crucial. The "middle option fallacy" must be addressed early during framework introduction. The "expected value error" should surface during uncertainty discussion and get dismantled with the scale-incommensurability point. Saving "arbitrary decision fallacy" for last allows the voting check to refute it experientially.

  The scale-alignment problem is the conceptual pivot. I'll introduce it after establishing framework divergence, using color-coded whiteboard columns showing how "benefit units" aren't transferable. The discharge procedure example makes it tangible - what if one framework measures lives saved while another measures dignity preserved?

  For the omitted element, framework weighting is indeed the right sacrifice. Stating "we won't resolve which framework is superior today" maintains focus on decision procedures. The group dynamics complication needs parallel treatment: start with individual reasoning, then map to collective action using their actual voting process.

  The comprehension check case should pit dignity against survival metrics. Imagine a palliative upgrade helping few versus toilet renovations helping many. If they compromise on partial funding for both, all frameworks would reject it - thus exposing false compromise.

  Throughout, the handout should mirror the whiteboard progression: 1) Frameworks 2) Uncertainties 3) Decision approaches 4) Group application. No definitions - just columns and arrows. The physician's "Monday test" means every concept must echo in their deliberation language next week.
answer: |-
  Here’s a step-by-step session plan designed for your constraints, focusing on clarity, pacing, and avoiding common pitfalls. The structure ensures each idea builds on the last while preempting misconceptions.

  ---

  ### **Session Structure (45 min)**
  **Whiteboard Layout:** 3 columns (one per framework) + "Uncertainty" section.

  #### **1. Frame the Core Dilemma (5 min)**
  - **What to present:** Simplified docket case stripped to its ethical bones:  
    *"Option A: Fund one more patient for Therapy X (cost: £500k). Benefit: One person gains 10 years of healthy life.  
    Option B: Use £500k to redesign discharge forms. Benefit: 50,000 patients each save 10 minutes of administrative hassle per year, permanently."*  
  - **Why strip it:**  
    - Remove *all empirical uncertainty* (e.g., survival rates, implementation risks).  
    - Remove *named patients* (avoids emotional bias; use "one patient" vs. "50k patients").  
    - **Crucially:** Keep benefits *incommensurable* (years of life vs. minutes of hassle).  
  - **Dependency:** Starts cold—no prior steps needed. Establishes the battlefield.

  #### **2. Introduce Three Frameworks via Their Verdicts (10 min)**
  - **How to present:** *"How might different moral lenses view this?"*  
    - **Aggregating (Utilitarian):** "Maximize total well-being. Option B wins—tiny benefits × 50,000 people outweigh one large benefit."  
    - **Priority to Worst-Off (Prioritarian):** "Focus on those suffering most. If the one patient is dying (worst-off), Option A wins—even if total benefit is smaller."  
    - **Side-Constraints (Deontological):** "Some rules can’t be traded. If Therapy X is a 'last chance' for the patient, denying it violates a duty to rescue—so Option A wins, regardless of numbers."  
  - **Whiteboard:** Column for each framework + key verdict.  
  - **Dependency:** Depends on Step 1’s clear case.  
  - **Preempt misconception:** After presenting frameworks, **explicitly state:** *"Notice: None of these is 'neutral' or 'compromise.' Each has a clear, principled answer."*  
    *(Prevents "middle option as fair" fallacy early.)*

  #### **3. Distinguish Fact vs. Framework Uncertainty (5 min)**  
  - **What to say:** *"Our disagreement isn’t about data (we’ve removed that!). It’s about which moral compass to use—and these compasses point in opposite directions."*  
  - **Why now?** Must come *after* frameworks are introduced but *before* discussing uncertainty. Frameworks must be visible to contrast.  
  - **Crucial line:** *"We know the facts. Our uncertainty is about which framework is correct—and that changes everything."*  
  - **Dependency:** Requires Step 2’s framework explanations.

  #### **4. Tackle "Just Average the Verdicts" Misconception (5 min)**  
  - **When to address:** After frameworks are laid out (misconception arises here).  
  - **Response:** *"Averaging verdicts assumes frameworks are like experts guessing a fact (e.g., 'Will it rain?'). But moral frameworks aren’t guessing—they’re defining what matters. Blending them is like averaging 'inches' and 'pounds'—you get nonsense."*  
  - **Whiteboard:** Draw mismatched scales (ruler vs. weighing scale) under frameworks.  
  - **Prevents:** False belief that moral uncertainty = empirical uncertainty.

  #### **5. Introduce Scale Incommensurability (The Hardest Idea, 10 min)**  
  - **When to present:** Immediately after Step 4 (builds on the "averaging" point).  
  - **How to explain:**  
    - *"Option B’s benefit is 10 minutes × 50k people. But is 500,000 minutes of hassle equal to 10 years of life?*  
    - **Aggregating:** "Yes—all well-being units are comparable."  
    - **Priority:** "No—relieving the worst-off’s suffering matters more per unit."  
    - **Side-Constraints:** "No—saving a life isn’t even on the same scale as reducing hassle."  
  - **Key insight:** *"The frameworks don’t just disagree on the answer—they measure 'benefit' in different currencies. Changing how we convert currencies changes which option wins."*  
  - **Why not baffling?** Steps 2-4 set this up: Frameworks are visible, averaging is debunked, and the stripped case makes scales obvious.  
  - **Prevents "license to do anything":** Stress: *"This doesn’t mean anything goes—it means we must consciously choose how to weigh values, not assume a common scale exists."*

  #### **6. Refuse to Explain Framework Weights (2 min)**  
  - **Openly state:** *"I won’t explain how to choose between frameworks today—that’s philosophy’s deepest rabbit hole. Our task is to navigate disagreement, not resolve it."*  
  - **Why this omission?** Assigning weights is abstract, time-consuming, and risks derailing into theory. Focus on *procedures* for disagreement.

  #### **7. Group Dynamics: From Individual to Collective (5 min)**  
  - **How to handle:** *"Since we each hold different frameworks firmly, this isn’t just about personal uncertainty—it’s about what a committee does when members have irreconcilable convictions."*  
  - **Build both from outset:** Individual reasoning (Steps 1-5) sets up collective action. Now add:  
    - *"We can’t vote blindly—that ignores why frameworks matter. But we can seek decisions that respect each view’s core concerns."*  
  - **What’s lost?** Starting with collective might obscure *why* frameworks conflict. Individual-first makes the stakes visceral.

  #### **8. Comprehension Check: The "False Compromise" Case (3 min)**  
  - **Present:** *"Option C: Split £500k—£250k for half a therapy spot (benefit: 5 years for one patient) + £250k for half the discharge project (benefit: 25k patients save 5 min each)."*  
  - **Ask:** *"Which framework could endorse this compromise?"*  
    - **Answer:** None. Aggregators lose total benefit; prioritarians help the worst-off less; deontologists violate a full duty to rescue.  
  - **Test:** Anyone advocating "split the difference" reveals non-comprehension. Those who reject it grasp framework integrity.

  ---

  ### **Misconception Management Guide**
  | **Misconception** | **When it Arises** | **When to Address** | **Response** |
  |-------------------|---------------------|----------------------|-------------|
  | "Middle option = fair" | After frameworks introduced | Step 2 (immediately) | *"Each framework has a principled extreme—no neutral center."* |
  | "Average the verdicts" | When frameworks conflict | Step 4 (dedicated rebuttal) | *"Mixing moral scales is like averaging inches and pounds."* |
  | "Treat like empirical uncertainty" | During scale discussion | Step 5 (integrated) | *"Frameworks define scales—they don’t predict them."* |
  | "Vote arbitrarily" | End of session | Step 8 (via case) | *"Compromises may satisfy no one—we need reasoned alignment."* |

  **Poison if voiced early:** *"Just use expected value"* (misapplies empirical tools to moral uncertainty). Must be debunked in Steps 4-5.

  ---

  ### **Handout Outline (One Page)**
  1. **The Case:** Option A (one patient) vs. Option B (many patients).  
  2. **Three Frameworks:**  
     - Aggregating: "Greatest total good → B"  
     - Priority to Worst-Off: "Help most desperate → A"  
     - Side-Constraints: "Never abandon rescue → A"  
  3. **Key Insight:** "Benefits may use *incompatible scales* (life-years ≠ hassle-minutes)."  
  4. **Our Task:** "Decide despite framework disagreement—without averaging or false compromises."  

  ---

  This plan respects time pressures, avoids theory, and forces engagement with the core conflict. By using the docket case rigorously stripped—and refusing to oversimplify scaling—you make the moral disagreement unavoidable while providing tools to navigate it. The false-compromise check ensures they leave with practical insight, not just vocabulary.
