  Below is a decision tree that meets your requirements. It uses concrete cases to separate positions without relying on ethical labels, fits within a 10-minute exercise, and covers your specified distinctions. The tree starts with the core question of whether numbers matter and branches into finer distinctions. Each question is a real-world case or claim, and leaves are labeled only where settled names exist. Unoccupied cells are noted with reasons.

  ### Decision Tree: Ethics of Saving Lives in Numbers Dilemmas

  **Question 1 (Distinction 1 & 2 - Basic Case):**  
  *In the basic scenario (save one stranger, David, or five strangers; cannot save both), is it morally acceptable for the rescuer to save David (the one)?*  
  - **Yes** → Go to Question 2.  
  - **No** → The rescuer must save the five. *This implies numbers settle the matter.* Go to Question 6A.  

  **Question 2 (Distinction 3 - Outcome vs. Chance):**  
  *In Maya's case: She can either pull one person from a burning room (saving one with certainty) or operate a device that saves all five with 80% probability (but saves no one if it fails). Should Maya use the device?*  
  - **Yes** → Numbers matter through **expected outcomes** (adds up expected lives). Go to Question 3.  
  - **No** → Numbers matter through **actual outcomes** (focuses on what happens, not expectations). Go to Question 4.  

  **Question 3 (Distinction 6 - Differing Stakes):**  
  *Five people will each lose a finger unless saved, but saving them means one person (David) dies. Is it acceptable to save the five and let David die?*  
  - **Yes** → Go to Question 6A.  
  - **No** → Leaf: **Non-Aggregative Consequentialism** (Lives/fingers are incommensurable; numbers don't override kind).  
    *Uncomfortable implication: Allows saving one life over preventing widespread minor harms (e.g., paralysis for many), even if total suffering increases.*  

  **Question 4 (Distinction 4 - Doing vs. Allowing):**  
  *To save the five, the rescuer must let David die (e.g., by not giving him a drug). If she instead had to push David off a lifeboat to save the five, would that change what she ought to do?*  
  - **Yes** → Leaf: **Doing/Allowing Distinction Matters** (Active harm is worse than omission; numbers alone don't justify direct harm).  
    *Uncomfortable implication: Permits letting many die to avoid minimal active harm (e.g., not pushing one person to save millions).*  
  - **No** → Go to Question 5.  

  **Question 5 (Distinction 5 - Baseline Fairness):**  
  *David is already worse off than the five (e.g., he's malnourished; all will die soon). Does this affect whether numbers matter?*  
  - **Yes** → Leaf: **Baseline-Relative Equity** (Numbers matter less if David starts worse off; claims are context-dependent).  
    *Uncomfortable implication: Could prioritize helping the worse-off even when it costs more lives overall (e.g., save one starving person over five healthy ones).*  
  - **No** → Leaf: **Numbers Settle Permissibility** (Numbers break symmetry; rescuer may save either, but saving five is better or equally permissible).  
    *Uncomfortable implication: Allows saving five over one for trivial reasons (e.g., preferring their hairstyles), as long as no active harm is done.*  

  **Question 6A (Distinction 7 - Bare Additions):**  
  *Suppose the five strangers are unrelated to each other and David. If they were a family group or close friends, would that strengthen the reason to save them?*  
  - **Yes** → Leaf: **Relational Aggregation** (Numbers matter through social ties; bare additions don't count equally).  
    *Uncomfortable implication: Permits saving two siblings over five strangers, ignoring impartiality.*  
  - **No** → Go to Question 7A.  

  **Question 7A (Distinction 8 - Repeated Choices):**  
  *A rescuer faces 100 identical choices (save one or five) across her career. Must she save the five at least some of the time?*  
  - **Yes** → Leaf: **Aggregative Consequentialism (Simple)** (Save the greater number; bare additions always matter).  
    *Uncomfortable implication: Requires saving five over one even if it involves minor active harm (e.g., nicking David's skin to reach the five).*  
  - **No** → Leaf: **No Distribution Requirement** (Each choice is isolated; may save the one every time).  
    *Uncomfortable implication: Permits saving one person 100 times, letting 500 die, with no fairness constraint.*  

  **Question 6B (From Q1 "No"):**  
  *In the basic scenario, if saving the five is required, does this hold even when the stakes differ (e.g., saving five from finger-loss vs. one from death)?*  
  - **Yes** → Leaf: **Strict Aggregative Consequentialism** (Always maximize total good; numbers settle requirements).  
    *Uncomfortable implication: Requires saving five fingers over one life if finger-losses are bad enough.*  
  - **No** → Leaf: **Threshold Aggregation** (Numbers matter, but not for trivial vs. severe harms).  
    *Uncomfortable implication: Hard to define thresholds (e.g., is losing a hand equal to 1% of a life?).*  

