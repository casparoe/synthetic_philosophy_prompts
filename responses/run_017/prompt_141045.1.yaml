     - Numbers don't count (equal chance): *Unoccupied* (incoherent or unattractive).  
     - Proportional chance: *Not directly covered* (see below for separation case).  
     - Diminishing weight: *Unoccupied* (unvisited).  
     - Non-aggregative: **Non-Aggregative Consequentialism**.  
  3. **Leaves Missing?**: Proportional chance is not a leaf. To capture it:  
