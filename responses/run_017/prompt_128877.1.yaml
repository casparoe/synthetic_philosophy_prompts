answer: |-
  Based on your constraints and background, the most potent case where the presentism/eternalism disagreement generates tangible friction in scientific practice—specifically in historical reconstruction—concerns the **epistemic justification and ontological grounding of laws of nature**. The "bite" manifests when we scrutinize how laws are *empirically supported* and *operationally deployed* to infer past states from present traces. Below, I develop your "laws" direction into a concrete geophysical case, avoiding relativity, bare truthmakers, and ensuring something substantive turns on the difference.

  ---

  ### **The Core Problem: Circularity in Law-Based Reconstruction**
  **Presentist Challenge:**  
  If only the present exists, laws of nature (e.g., thermodynamics, fluid dynamics, radioactive decay) cannot be inductive generalizations over past instances (since the past doesn’t exist). Instead, they must be either:  
  1. **Brute primitives** (timeless, unexplained regularities), or  
  2. **Descriptions of present dispositions** (e.g., "This rock *is disposed* to behave in way X under conditions Y").  

  This creates a problem when using laws to reconstruct the past:  
  - **Inference Circularity:** We rely on laws to interpret present traces (e.g., mineral compositions, seismic data) as evidence of past events. But if those laws were *themselves* justified by past observations (now non-existent), the justification vanishes. Present traces + laws → past, but laws’ authority → past observations → ✘ (no past).  
  - **Underdetermination Risk:** Without a real past, laws risk being *ad hoc* summaries of present traces alone, lacking independent ontological anchors.  

  **Eternalist Advantage:**  
  Laws *can* be inductive generalizations over real past events. The past provides a non-circular foundation: laws summarize what *did* happen (and happen timelessly), so using them to reconstruct history is epistemically stable.  

  ---

  ### **Concrete Geophysical Case: Reconstructing Paleo-Temperatures from Isotopic Ratios**
  **Scenario:**  
  You measure the present δ<sup>18</sup>O isotopic ratio in a foraminifera shell from a deep-sea core. Using the empirically derived law:  
  `δ<sup>18</sup>O ∝ -k·T` (where T = past ocean temperature, k = constant),  
  you infer a paleo-temperature of 12°C for the Pliocene epoch.  

  #### **Step 1: How the Law Was Established**  
  - The law was calibrated via **lab experiments** (e.g., growing foraminifera at controlled temperatures) and **historical cross-validation** (e.g., matching ratios to ice-core records from the Last Glacial Maximum).  
  - **Presentist Ontology:**  
    - Only *current* experimental results and *present* ice-core samples exist. Past experiments/events (e.g., a 1985 lab run) are unreal.  
    - The law is merely a description of *present* dispositions: "This shell *is disposed* to exhibit δ<sup>18</sup>O = X when formed in water at T°C."  
  - **Eternalist Ontology:**  
    - Past experiments and climatic events are real. The law summarizes *actual* regularities across time.  

  #### **Step 2: The Inference to a Novel Past Event**  
  You apply the law to a shell *not* used in calibration (e.g., from a newly drilled core in an unstudied basin).  
  - **Presentist Inference:**  
    - Input: Present trace (shell’s δ<sup>18</sup>O = 2.1‰) + Present dispositional law ("Shells like this form at ~12°C").  
    - Output: "The ocean was ~12°C *when this shell formed*."  
    - **Problem:** The law’s scope is ambiguous. Why does this disposition apply to a *past* formation event? The shell’s "formation" isn’t a present entity or property—it’s a historical relation. Presentism reduces this to: "The shell *is now* such that *were* it forming, T would be 12°C." But this fails to capture the *actual* causal history.  
  - **Eternalist Inference:**  
    - Input: Present trace + Law (grounded in past instances) → Actual past temperature.  
    - Output: "The ocean *was* 12°C at t."  

  #### **Where the Difference Bites: Degraded Traces & Predictive Generalization**
  **Critical Case: A Trace with Ambiguous Origins**  
  Suppose you find a metamorphic rock with a rare mineral assemblage (e.g., coesite + garnet). The law: "Coesite forms at P > 2.5 GPa" (indicating subduction to 80+ km depth).  
  - **Presentist Description:**  
    - The rock *is disposed* to exhibit coesite only if subjected to ultrahigh pressure (UHP).  
    - But *when* did this happen? If no other traces exist (e.g., overprinting by later events), presentism struggles:  
      - Option A: The disposition "points to" a past UHP event, but this invokes unreal history.  
      - Option B: The assemblage is a brute fact—no past event is inferred.  
    **→ Cost:** Option A smuggles in eternalism; Option B abandons historical explanation.  
  - **Eternalist Description:**  
    - The assemblage is a relic of a real UHP event at t<sub>1</sub>. Laws license the inference directly.  

  **Generalization Beyond Observed Traces**  
  When predicting past states *never directly sampled* (e.g., Precambrian mantle convection):  
  - Presentism requires laws to project *beyond* the present, with no ontological basis for unobserved cases.  
  - Eternalism generalizes over real (but temporally distant) events.  

  ---

  ### **Why This Isn’t Solvable by "Present Traces + Laws"**
  - The truthmaker reply ("Present traces + laws make past propositions true") fails here because:  
    - Laws themselves *require justification*. If laws are grounded *only* in present traces, they become tautological: "Traces like X indicate past event Y because traces like X always correlate with Y." But without a real past, "always correlate" has no referent.  
  - **Example:** If all 1980s lab records vanished, the presentist must treat δ<sup>18</sup>O/T laws as brute. The eternalist still has access to the *actual* 1980s experiments.  

  ---

  ### **The Least Costly Presentist Reply (and Its Weaknesses)**
  **Reply: Laws as Timeless Relations Between Universals**  
  - Presentists (e.g., Bigelow, Armstrong) argue laws are "relations between universals" (e.g., *being a foraminifera shell* necessitates *δ<sup>18</sup>O ∝ T*). These relations exist *now*, independent of instances.  
  - **Advantage:** Avoids reliance on past events.  
  - **Costs for Scientific Practice:**  
    1. **Loss of Empirical Grounding:** How were these relations discovered? Science infers laws from *past* data—e.g., lab trials. If the past is unreal, the epistemic route to laws is undermined.  
    2. **Underdetermination:** Why accept "δ<sup>18</sup>O ∝ T" over an *ad hoc* law fitting only present traces?  
    3. **Explanatory Impoverishment:** Laws no longer explain *why* traces appear as they do (e.g., "This shell has δ<sup>18</sup>O=2.1‰ *because* it formed at 12°C"). They only describe present patterns.  

  ---

  ### **Why This Matters to Your Work**
  As a geophysicist reconstructing rock histories, you relied on laws *as summaries of past behaviors* (e.g., sediment compaction laws based on decades of borehole data). Presentism forces you to either:  
  - Reinterpret laws as inexplicable dispositions (weakening their explanatory power), or  
  - Accept circularity: "The past is inferred from traces using laws, which are inferred from traces (with no past to anchor them)."  

  **Eternalism avoids this by anchoring laws in a real, extended spacetime.** The dinosaurs’ extinction is not made true by *present* laws + traces alone—it’s made true by the *actual event* 66 Ma, which the laws help us access.  

  ### **If This Still Misses the Mark**
  An alternative case concerns **causal explanation in geochronology**:  
  - When dating a rock via U-Pb decay, eternalism treats the decay process as a real, extended worldline. Presentism treats it as a present "snapshot" of a disposition (e.g., "This zircon *is disposed* to have 50% <sup>238</sup>U decayed"). But without a real temporal process, "decay" loses its meaning—it’s just a present state. This impacts how we explain discordant dates or inheritance.  

  Let me know if you’d like to develop this angle instead.
