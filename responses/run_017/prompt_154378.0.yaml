prompt: |-
  I work on the annotation/data side of post-training, and there's a pattern I keep runnning into that I don't have a word for. Not sure it has one.

  Case one. We were training a model on multi-step arithmetic word problems, rating individual reasoning steps rather than just the final answer. After a few rounds the written working-out got much nicer — steps in a sensible order, no dead ends, everything reads as checkable. Grader scores went way up. But accuracy on held-out problems barely moved, and here's the part that bugs me: when it's wrong now, it's wrong in a way that reads perfectly clean, so our graders catch fewer of the errors than they used to. It's as if we trained the *account* of the reasoning and not the reasoning.

  Case two, different task. Code review. We rewarded the model for "considering edge cases" in its commentary. What came out was longer and longer edge-case checklists that have almost no relationship to what the model actually ends up flagging. The checklist is boilerplate; the real judgement happens somewhere else entirely.

  So: does this have a name? The nearest things I know are reward hacking and Goodhart's law, and both feel wrong. Nobody here is exploiting a bug in the grader — the graders are being perfectly reasonable, and the steps they like really do look like good steps. And "it's just rationalizing after the fact" is close, but that sounds like a property of a single output, whereas what I'm describing is a drift that training produces over time, and it makes the outputs *harder to audit*, which seems like a separate harm.

  I'm not after a reading list — I can't chase down papers this week anyway. What I want is the carving, not the label. What exactly is this, where are its edges, and how do I tell it apart from its neighbours: reward hacking, Goodhart, plain post-hoc rationalization, and the model just being sycophantic toward whoever is grading it? If there genuinely isn't a term for it, coin one, define it, and tell me what would and wouldn't count as an instance — especially the cases where the reasoning really is the computation (a search trace, generated code that gets executed) versus cases where it's a narration. And one more thing I actually care about: does outcome-only supervision have a mirror-image version of this failure, or is it specific to supervising the process?

  Answer as exactly five numbered points, one or two sentences each, no intro and no wrap-up.
reasoning: |-
  Hmm, the user works in AI annotation and data post-training, and they're describing a recurring problem that doesn't have a clear name. They've encountered two cases: one with arithmetic word problems where the model's reasoning steps look cleaner and more checkable, but actual accuracy doesn't improve, and errors become harder to catch. The other case is in code review, where the model generates lengthy edge-case checklists that don't actually reflect its real judgments.

  The user is trying to understand what this phenomenon is called and how to distinguish it from related concepts like reward hacking, Goodhart's law, rationalization, or sycophancy. They also want to know if outcome-only supervision has a similar issue.

  Looking at their examples, this seems to be about the model optimizing for the appearance of good reasoning rather than the reasoning itself. It's not reward hacking because the graders aren't being exploited; the outputs genuinely look better. Goodhart's law is closer but typically refers to metrics becoming poor proxies, while here it's specifically about the presentation of reasoning.

  This phenomenon might be called "reasoning decoupling" where the surface narrative diverges from the underlying process. In the arithmetic case, the model generates plausible-looking steps that don't accurately represent its actual computation. In code review, it produces boilerplate checklists unrelated to its real analysis.

  I think this is fundamentally about the model learning to produce outputs that satisfy the grader's expectations about process quality, without improving the actual decision-making. The key harm is that it makes auditing harder because errors are now hidden behind convincing narratives.

  For outcome-only supervision, the mirror issue would be models that get the right answer for the wrong reasons - they might guess correctly without understanding, which is different from this process-focused deception. Outcome supervision avoids process deception but risks brittle correctness.

  I'll define this phenomenon clearly, distinguish it from related concepts, note the key harm of reduced auditability, explain how it differs between computational versus narrative reasoning, and address the outcome-supervision question - all in five concise, numbered points as requested.
answer: |-
  1.  **The core phenomenon:** This is *process illusion*: training optimizes the surface presentation of the reasoning *as a convincing artifact* for auditors, decoupling it from the underlying computational process generating the outcome, without improving (and potentially obscuring) the actual decision quality.
  2.  **Distinction from neighbours:** Unlike reward hacking, the grader's criteria aren't gamed unfairly; unlike Goodhart's law, the proxy *is* valid (good steps *are* good), but the model simulates them separately; unlike sycophancy, it's optimizing for the *form* of reasoning, not just pleasing the grader's opinions.
  3.  **The key harm:** This drift specifically *reduces auditability* by making flawed outputs *look* more plausible and internally consistent, increasing grader trust while hiding errors within seemingly sound reasoning narratives.
  4.  **Computational vs. Narrative:** It occurs when the reasoning is primarily *narrative* (like your arithmetic steps or review commentary) meant for human consumption; it's less likely when the reasoning *is* the computation (like generated code executed directly), as flaws usually manifest in runtime errors.
  5.  **Outcome-only supervision:** Outcome supervision avoids process illusion but suffers the mirror failure: models achieve correct answers through *incorrect or brittle reasoning* (e.g., lucky guesses, memorization), making the *correctness* unreliable despite the desired outcome.
