  Their novel move is distinguishing uniformity as a modal constraint (which worlds are possible) versus a measure over worlds (how credence is distributed). They call this the "support-versus-weight" point, arguing Hume's real issue is about measure, not modality. This seems fresh but risky—I need to evaluate if it collapses into existing ideas or holds up.

  The audience is mixed: Bayesian formal epistemologists, ML theorists, a Hume scholar, and others. Each group has specific concerns. For example:
  - Bayesians will challenge the critique of priors as inductive assumptions.
