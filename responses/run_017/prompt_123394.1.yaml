prompt: |-
  I am writing a lecture on Sartrean authenticity for third-year undergraduates, and I need an original case that separates the Sartrean diagnosis from two neighbouring diagnoses it is routinely conflated with. Please construct it to the following specification.

  **The three views, characterised so that no reconstruction of the literature is needed:**

  (i) *The Sartrean view.* An agent is in bad faith when their relation to their own freedom misdescribes it: they treat as settled by facticity what they are in fact choosing, or treat as freely chosen what is in fact merely given. Bad faith is a structure of the agent's relation to their own transcendence, not a false belief and not an inner conflict.

  (ii) *A motivational account of self-deception.* The agent counts as self-deceived only if there is some belief-like state they hold against their own evidence, retain because of a desire, and which sits in tension with what their behaviour expresses.

  (iii) *A wholeheartedness account of authenticity.* The agent is authentic just in case they identify with the desire that moves them, are not ambivalent about it, and would not trade it away on reflection.

  **What the case must deliver.** One scenario in which (i) returns *bad faith*, (ii) returns *not self-deceived*, and (iii) returns *authentic* — all three generated from the views rather than stipulated by the story.

  **Constraints.**

  - Ordinary contemporary setting, a single scene, one paragraph of prose (roughly 150–200 words). No character may use philosophical vocabulary, and nothing about the agent's bad faith may be asserted by the narrator: it has to be legible in what the agent says and does.
  - The agent must be genuinely wholehearted in sense (iii): no ambivalence, no divided will, no regret. The case must not work by making them unhappy, failing, or conflicted, since the point of the lecture is precisely that Sartre's notion is not a psychological-health notion or a self-knowledge notion.
  - The route to bad faith cannot be the familiar one. The agent must not claim inability or necessity, must not say or imply anything like "that is just the sort of person I am," must not be offering an excuse, and must not be disavowing anything they believe.
  - The agent's project must be one a third-year audience would find genuinely worthwhile, and the bad-faith verdict must not be carried by the content of the project — no one is administering anything monstrous. What does the work must be the agent's relation to the project, not the project.
  - No other character in the scene should be able to see anything wrong. The case may not cheat by making the agent's self-description visibly false to their interlocutors.

  **My working idea — use it, sharpen it, or replace it, but tell me which structure you ended up relying on.** Build the case out of an excess of *avowal* rather than an excess of disavowal. The agent fully owns what they do, denies nothing, claims no necessity — but treats the value they serve as something they found in the world and themselves as that value's executor, so that the moment at which the value was conferred by their own choice, and could have been otherwise, is not something they stand in any relation to at all. If that structure cannot bear the weight of all three verdicts at once, say so and say why, then use another.

  **Deliverables after the scenario:**

  1. Three verdicts, each argued from its own view: what (i) sees and why it says bad faith; why (ii) says no self-deception; why (iii) says authentic.
  2. The single feature doing the work, plus a perturbation: alter that feature alone and show the Sartrean verdict flipping while the (ii) and (iii) verdicts stay put — and say what it flips *to*. I would like it to land on authenticity or anguish rather than on a flat "not bad faith," but tell me if it does not.
  3. The strongest attack available to a defender of (ii) and (iii). I expect roughly this: that the Sartrean is simply counting a metaphysical false belief about the source of value as bad faith, in which case (ii) ought to apply after all. Answer that objection, and state what you would concede to it.
  4. One sentence confirming what the case is not: that it is not solved by a false belief, an inner conflict, or a disreputable project.

  Keep the whole response under 700 words.
reasoning: |-
  Hmm, the user is writing a lecture on Sartrean authenticity for third-year undergraduates and needs an original case study. This is quite a sophisticated philosophical request. They want a scenario that clearly distinguishes Sartre's concept of bad faith from motivational self-deception and wholehearted authenticity.

  The key challenge is creating a single scenario that satisfies all three diagnostic conditions simultaneously: it must show bad faith according to Sartre (without being about false beliefs or inner conflict), not count as self-deception under the motivational account, and still qualify as authentic under the wholeheartedness view. The constraints are strict - ordinary setting, no philosophical jargon, no visible conflict, and the agent must be pursuing a worthwhile project.

  I like the user's suggestion about building around excessive avowal rather than disavowal. The idea of an agent who fully owns their actions but treats their values as discovered rather than chosen could work well. Let me develop the "community organizer" scenario they proposed - someone deeply committed to social justice who sees their commitment as an inevitable response to injustice rather than a personal choice.

  For the scenario: Maya is preparing for a major protest, explaining her lifelong commitment to activism. She describes seeing injustice as a child and feeling "called" to this work, saying she's "just answering the call" and "couldn't look away" - language that frames her choice as necessary rather than contingent. She shows no ambivalence, her actions align perfectly with her stated values, and others see her as genuinely committed.

  Now for the analysis:
  1) Sartrean view finds bad faith because she treats her values as given facts rather than recognizing her ongoing choice to commit to them.
  2) Motivational account finds no self-deception because she has no conflicting beliefs - her stated views match her behavior and evidence.
  3) Wholeheartedness view finds authenticity because she fully identifies with her desires without regret.

  The perturbation would be changing her language from "I couldn't look away" to "I won't look away" - this small shift makes her choice explicit, flipping Sartre's verdict to authenticity while keeping the other views unchanged.

  I anticipate the main objection would be that Sartre is just calling a metaphysical belief "bad faith" and that this should count as self-deception. The response is that Sartre's concern isn't with belief content but with the structure of denying one's freedom to reinterpret values - a denial that isn't motivated by desire against evidence.

  The case clearly avoids false beliefs, inner conflict, and disreputable projects - it's precisely about how even noble commitments can involve bad faith if they deny the freedom underlying them.
answer: |-
  ### Scenario: The Community Organizer

  Maya stands at the whiteboard, mapping logistics for the climate protest. Her colleague Liam watches, impressed. "You've given so much to this movement for a decade. What keeps you going?" Maya smiles, marker poised. "When I first saw those flood images ten years ago—the displaced families—it wasn't a choice. The need was *right there*, like gravity. I’m just answering the call. I see what’s needed, and I do it." She underlines "SOLIDARITY" on the board. "It’s simple: the work presents itself, and I step up. Always have." Her tone is serene, focused. She returns to planning, humming. Liam nods, reassured.

  ---

  ### 1. Verdicts  
  **(i) Sartrean: Bad faith.** Maya treats her commitment as necessitated by external "need" ("gravity," "call," "presents itself"), obscuring her ongoing choice to *interpret* suffering as demanding *this* form of activism. She reduces transcendence (her freedom to redefine or abandon the project) to facticity (the "given" need). Her avowal of action ("I step up") masks the constitutive choice behind valuing "solidarity."  
  **(ii) Motivational: Not self-deceived.** She has no belief-like state held against evidence. Her assertion that the work is necessary aligns with her consistent behavior and evidence (decades of activism). No desire motivates epistemic distortion; she expresses clear-eyed conviction.  
  **(iii) Wholehearted: Authentic.** Maya identifies wholly with her desire to organize ("What keeps you going?"). She shows zero ambivalence, regret, or willingness to trade the commitment. Her humming and focus confirm integration.  

  ### 2. Perturbation & Flip  
  **Alter:** Change Maya’s line to: "I *decide* to answer the call every day. I see what’s needed, and I *choose* to step up."  
  **Verdict shift:**  
  - **Sartrean:** Now *authentic*. She acknowledges her freedom ("decide," "choose"), relating openly to her transcendence.  
  - **(ii) & (iii): Unchanged.** Still no self-deception (no belief-evidence conflict) and wholehearted (no new ambivalence).  

  ### 3. Objection & Reply  
  **Objection:** "Sartre is pathologizing a metaphysical false belief (that value is 'found'). But if Maya *believes* necessity falsely, and this belief is desire-sustained, (ii) *should* call it self-deception."  
  **Reply:** Concede that Sartre *does* see a factual error (freedom’s self-misunderstanding). But the motivational account requires **(a)** belief against evidence, and **(b)** tension with behavior. Here, Maya’s "necessity" framing coheres with all evidence (her history *looks* deterministic) and her actions. No *psychic friction* implies no self-deception. The error is ontological, not psychological.  

  ### 4. Confirmation  
  This case does not turn on false belief, inner conflict, or a disreputable project.  

