prompt: |-
  Before I decide whether any evolutionary debunking argument in metaethics should move me, I want a specification of what one would have to deliver. Write the desiderata an adequate evolutionary debunking argument must meet on the following reading of adequacy: it is addressed to a reflective moral realist who already grants the empirical genealogy and wants to know why that genealogy is epistemically significant at all. For each requirement, give the case or consideration behind it, and mark it as non-negotiable or as a preference of one camp.

  The list has to settle at least these: which target the argument must actually hit — moral belief, moral knowledge, moral realism, or only the contents of some moral judgments — and whether reaching only the last of these counts as a success; why the genealogical story must be fine-grained enough to predict the content of the judgments we actually have rather than merely that we would have some moral judgments or other; what it owes on scope, i.e. why the same style of explanation does not discredit perception, memory, or logic, or the epistemic norms the argument itself invokes; whether it must avoid normative premises that its own genealogy would undermine; and, if it makes an empirical claim, what finding would refute it. It should also say what an argument owes to the reply that selection shaped a general capacity for normative judgment rather than any particular judgments.

  Two things I especially want flagged. First, whether any pair of requirements is jointly unsatisfiable: I suspect the demand that the argument rest on no normative premises sits badly with the demand that it yield a conclusion about what we ought to believe, and that full generality across moral judgment sits badly with content-specific genealogical detail. Second, whether an argument that debunks only a proper subclass of moral judgment — judgments about purity, about partiality to kin, about retributive punishment — faces the same list or a weaker one; I think the local case is where the real work is, and I want to know whether the desiderata change shape there.

  Briefly, at the end, score two contenders against the list: the Darwinian-dilemma style argument (Street, 2006) and the explanatory-superfluity style argument (Joyce, The Evolution of Morality). Begin with your bottom line in the first sentence — whether the full set is jointly satisfiable, and which single requirement excludes the most candidates — then the requirements with their cases, then the scoring; no preamble and no restating the question.
reasoning: |-
  Okay, the user is asking for a detailed specification of what an evolutionary debunking argument (EDA) must achieve to be considered adequate. They specifically want this addressed to a reflective moral realist who already accepts the empirical genealogy of morality but questions its epistemic significance. 

  Hmm, this is a highly sophisticated request. The user clearly has deep familiarity with metaethics and evolutionary debunking literature - they're name-dropping Street and Joyce while requesting technical distinctions about scope, target, and normative premises. Probably a grad student or early-career philosopher wrestling with these arguments. Their frustration with vague EDAs suggests they've encountered unconvincing versions before. 

  The real meat lies in their two flagged concerns: first, whether avoiding normative premises conflicts with concluding what we ought to believe (that's the internal tension in EDAs), and second, whether local debunking arguments have different requirements than global ones. They're hinting that localized EDAs targeting specific moral domains (like purity norms) might be more promising - which aligns with recent trends in experimental philosophy. 

  For the response structure: must lead with the bottom line about satisfiability (spoiler: full set isn't jointly achievable) before diving into the 7 desiderata. The "joint unsatisfiability" admission is crucial - it signals intellectual honesty about EDAs' limitations. When scoring Street and Joyce later, should emphasize how Street fails on avoiding normative premises while Joyce's explanatory superfluity argument gets tangled in generality issues. 

  Key pitfalls to avoid: 
  - Don't get dragged into defending realism vs anti-realism; stay focused on argument criteria
  - Must address why EDAs don't implode inference itself (that's the self-defeat problem)
  - Clarify that debunking specific judgments still counts as success if that's what the argument aims for
  - The "general capacity" reply needs dismantling - it's a common realist dodge

  The user's "I think the local case is where the real work is" tells me they'll appreciate highlighting how desiderata shift for domain-specific EDAs. Should flag that local arguments avoid the content-generality tradeoff but face new burdens about domain-demarcation. 

  Final note: When mentioning potential refuting evidence, cite concrete studies - e.g., if harm norms emerge identically across isolated cultures, that undermines content-specific EDAs. Keeps it grounded.
answer: |-
  ### Bottom Line
  The full set of desiderata is **not jointly satisfiable** due to irreconcilable tensions, particularly between **non-normative foundations** and **action-guiding conclusions**; the **non-normative premise requirement** excludes the most candidate arguments.

  ---

  ### Desiderata for an Adequate Evolutionary Debunking Argument (EDA)
  1. **Target Precision**  
     - *Requirement*: Must specify whether it targets moral *beliefs*, *knowledge*, *realism*, or *specific judgment contents*. Debunking *some moral contents* counts as success.  
     - *Case*: Realists concede evolution may distort *some* judgments (e.g., tribalism) without threatening realism globally. Hitting specific contents (e.g., "purity = moral") suffices for local skepticism.  
     - *Status*: **Non-negotiable** (without target clarity, the argument lacks dialectical force).  

  2. **Content-Specific Genealogy**  
     - *Requirement*: Genealogy must predict *actual moral contents* (e.g., kin altruism), not merely a generic "moral faculty."  
     - *Case*: If evolution only explains *that* we judge morally (not *what* we judge), realists can insist truth-tracking shaped content.  
     - *Status*: **Non-negotiable** (central to showing non-truth-tracking origins).  

  3. **Selective Immunity**  
     - *Requirement*: Must explain why evolution debunks *morality* but not perception, logic, or the EDA’s own norms.  
     - *Case*: Realists argue perception/logic are "cognitively basic" or independently validated; EDAs must show morality lacks comparable epistemic shields.  
     - *Status*: **Non-negotiable** (avoids self-defeat and overgeneralization).  

  4. **Non-Normative Foundations**  
     - *Requirement*: Premises must avoid normative claims vulnerable to the same genealogy.  
     - *Case*: If the EDA uses norms (e.g., "reliability requires non-adaptive origins"), realists ask why *those* norms escape debunking.  
     - *Status*: **Preference (anti-realist camp)** but often treated as non-negotiable to avoid circularity.  

  5. **Empirical Refutability**  
     - *Requirement*: If making empirical claims, must specify what evidence would falsify it.  
     - *Case*: Finding that moral truths *causally influenced* adaptive moral judgments (e.g., harm-avoidance aiding survival *because* harm is objectively wrong).  
     - *Status*: **Non-negotiable** (prevents unfalsifiable speculation).  

  6. **Answer to the "General Capacity" Reply**  
     - *Requirement*: Must counter the claim that evolution shaped only a *general normative capacity*, not specific judgments.  
     - *Case*: Realists argue evolution gave us "reason" to track moral truths; EDAs must show adaptive pressures *determined content*.  
     - *Status*: **Non-negotiable** (blocks the main realist evasion).  

  7. **Scope-Generality Tradeoff**  
     - *Requirement*: Must resolve tension between *global scope* (all moral judgments) and *content-specific detail*.  
     - *Case*: Granular genealogies (e.g., explaining disgust-based purity norms) sacrifice generality; global EDAs lack content-specificity.  
     - *Status*: **Preference (context-dependent)**.  

  ---

  ### Flagged Tensions  
  - **Joint Unsatisfiability**:  
    - **Non-normative premises + Action-guiding conclusion**: To demand *oughts* (e.g., "reject moral realism") while avoiding normative premises is impossible. EDAs must either smuggle in norms or abandon prescriptive force.  
    - **Generality + Content-specificity**: Global EDAs (targeting *all* morality) cannot provide fine-grained genealogies for each judgment; content-specific EDAs sacrifice universality.  

  - **Local vs. Global EDAs**:  
    - *Local EDAs* (targeting purity, partiality, etc.) face a **weaker list**:  
      - Relax **generality** (no need to debunk all morality).  
      - Reduce **selective immunity** burden (only show *this domain* lacks truth-tracking).  
      - **Content-specificity** becomes easier (e.g., phylogeny of disgust explains purity norms).  
    - *But* they must still meet **non-negotiable** 1–3 and 5–6.  

  ---

  ### Scoring Contenders  
  **Street’s Darwinian Dilemma (2006)**:  
  - ✅ *Target*: Moral realism (specifically, realist accounts of moral knowledge).  
  - ✅ *Content-specificity*: Argues adaptive pressures *shaped contents* (e.g., fitness-promoting values).  
  - ❌ *Selective immunity*: Fails to explain why logic/perception escape (assumes their reliability).  
  - ❌ *Non-normative foundations*: Relies on epistemic norms (e.g., "influence implies unreliability") vulnerable to debunking.  
  - ❌ *General capacity reply*: Dismisses but doesn’t refute the "general reason" objection.  
  - **Verdict**: Fails on non-normative premises and selective immunity.  

  **Joyce’s Explanatory Superfluity (2006)**:  
  - ✅ *Target*: Moral beliefs (argues they are unjustified).  
  - ✅ *Empirical refutability*: Would be falsified if moral facts explained moral phenomenology.  
  - ❌ *Content-specificity*: Focuses on the *general* function of moral judgments (e.g., enhancing cooperation), not specific contents.  
  - ❌ *Selective immunity*: Silent on why evolution doesn’t threaten logical norms.  
  - ✅ *General capacity reply*: Claims moral content is superfluous even if capacity is adaptive.  
  - **Verdict**: Fails on content-specificity and selective immunity; stronger on non-normative foundations than Street.
