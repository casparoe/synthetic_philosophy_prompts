prompt: |-
  I'm a novelist and something's been happening with my last two books that I can't quite get a handle on. I'd like a word for it, if there is one.

  In the 2017 one there's a character — a solicitor, mid-thirties, outwardly completely fine, holds down a job, never shouts at anyone — who can't get through a day without running through every possible version of a conversation before she actually has it, and who feels physically sick if someone changes plans on her the same morning. I made the whole thing up to drive the plot. I wasn't copying it out of any manual. In the book her sister has a name for it, "the flat panic", just a bit of dialogue.

  Readers started writing to me. Not "I enjoyed it" — "that's me", hundreds of them. Then a councellor friend said three of her clients in a single year had turned up describing themselves as having flat panic and asking for help with it. And last year someone at a festival told me they'd gone to their GP describing exactly that pattern and come out with an anxiety diagnosis, and that ever since they'd been noticing it in everyone. So the thing I invented out of my own head is now a way people walk into a clinic and describe themselves — and this is the bit that gets me — the clinicians seem to be seeing more of it, and what they mean when they reach for the diagnosis seems to have shifted a bit, to include the version from my book. As if the category moved to meet the people turning up, and the people turned up because the category was there.

  Second one, quicker. A friend's YA novel has a kid who leaves every social event in stages: says goodbye, comes back in, says goodbye again, hovers by the door for forty minutes. My friend called it "tapering". Now there are teenagers calling themselves tapers, and teachers using it, and a couple of them describe the leaving differently than they did five years ago — more deliberate, more of a thing you announce.

  It's not a self-fulfilling prophecy, I don't think. Nobody was told they had anything. And it isn't what I think gets called labelling either, where some authority sticks a name on you; these came in sideways, out of paperbacks, and people took them up on purpose and seemed relieved to. But it's not just "a word caught on" either, because what changed isn't only what people call themselves. It's what they notice, what they do, and apparently what the professionals end up treating.

  Is there an established concept for this — the loop where a way of describing people changes the people, who then change the description, so the category and the thing it picks out keep drifting along together? And where the description can come from anywhere, not just from the people with the clipboard? I know there's stuff in philosophy and in psychiatry somewhere in this neighbourhood; what I want to know is exactly which bit mine is, which bits it isn't, and where the edges are. Does it still count if the label came from fiction rather than from a clinic? Does it stop being the same thing if the description was actually accurate all along, if I'd stumbled onto something real? Does the loop break if the person knows perfectly well they got the word out of a novel? And what about the cases where a word spreads and nobody changes at all, or where people change and the word never follows?

  I'm on a panel in the spring about fiction and diagnosis and I'd like to say something better than "dunno, culture's weird". A name would be a start, but names aren't the point: I want to know what this is and what it isn't. If there's no term for it, coin me one, define it, and tell me where it stops.
reasoning: |-
  Okay, the user is a novelist who's noticed an interesting phenomenon with their books. In their 2017 novel, they created a character with "flat panic" - a made-up condition where the character obsessively rehearses conversations and gets physically ill when plans change. Surprisingly, readers identified with this, mental health professionals started hearing clients describe themselves this way, and it even influenced clinical diagnoses.

  Then in a friend's YA novel, the term "tapering" for a specific social exit behavior caught on among teenagers and educators, changing how people perceive and describe this behavior.

  The user wants to understand this phenomenon where fiction creates a label that then changes real-world behavior and professional understanding, creating a feedback loop. They've ruled out terms like "self-fulfilling prophecy" or "labelling" because these labels came from fiction rather than authority figures, and people adopted them willingly.

  I need to explore concepts that might explain this. Starting with sociology, there's the Thomas theorem - if people define situations as real, they become real in their consequences. That seems relevant because readers defined themselves through "flat panic," making it real for them.

  Then there's looping effects from Ian Hacking. He describes how classifying people can change them, and they in turn alter the classification. The dynamic nominalism part fits perfectly here - new categories create new ways for people to be. The user's case is a prime example: a fictional label becomes a real identity, which then evolves.

  Concept creep might be part of it too. As more people adopt "flat panic," its meaning expands, which clinicians then incorporate into diagnoses. That explains the shifting boundaries the user noticed.

  The user also asks about the role of fiction versus clinical origins. Hacking's looping effects usually start from scientific classifications, but here it's from literature. That's a key difference - it's bottom-up, not top-down. People choose these labels because they resonate, which is why they stick even if the person knows it's from a novel.

  Also, the accuracy question: even if the description was accidentally accurate, the adoption and adaptation by people and professionals changes its meaning and application. It's not about the original accuracy but how the label functions socially.

  Cases where labels spread without behavior change or vice versa don't form the same loop. The loop requires mutual influence: label changes behavior, which redefines the label.

  For the panel, the user needs a clear term. "Fiction-driven category looping" seems appropriate, emphasizing the fictional origin and the feedback loop. Defining its boundaries is crucial: it starts with a resonant fictional description, adopted intentionally, leading to behavioral recognition and institutional adaptation, creating a co-evolution of category and experience.

  I should also mention that this differs from medicalization because there's no institutional push initially. It's organic, coming from cultural resonance. And even if people know the term's origin, the validation from community and professionals sustains it. The loop breaks only if the label doesn't lead to a feedback cycle with institutions.
answer: |-
  This phenomenon you're describing is both fascinating and increasingly recognized, though it doesn't have one single, universally accepted name. It sits at a rich intersection of sociology, philosophy of science, medical anthropology, and literary theory. Let's break it down, find its conceptual home, define its boundaries, and give it a name.

  **The Core Concept: Looping Effects & Dynamic Nominalism (via Ian Hacking)**

  The most precise framework for understanding your experience comes from philosopher and historian of science **Ian Hacking**, specifically his concepts of **"Looping Effects"** and **"Dynamic Nominalism"**.

  1.  **Looping Effects:** Hacking argues that classifying people (e.g., "the obese," "the autistic," "the refugee," "the hysteric") doesn't just passively describe them. The classification itself changes how those classified:
      *   **See themselves:** They internalize the label, shaping their identity and self-understanding.
      *   **Are seen by others:** Society treats them according to the label.
      *   **Behave:** They may adapt their behavior to fit or resist the label.
      *   **This changed behavior then loops back:** It alters the very phenomenon the classification was meant to describe, forcing scientists/professionals/society to revise the classification, which then starts the loop anew.

  2.  **Dynamic Nominalism:** This complements looping effects. It argues that **new classifications create new kinds of people.** Before the classification exists, the specific way of being (or the specific *consciousness* of that way of being) didn't exist in the same form. The label doesn't just *name* something pre-existing; it actively *shapes* a new way for people to exist and experience themselves.

  **How This Fits Your Cases Perfectly:**

  1.  **"Flat Panic":**
      *   **Classification Created:** You invented the *description* and the *label* ("flat panic") based on a character trait needed for plot. It wasn't sourced from clinical manuals.
      *   **Adoption/Looping Begins:** Readers recognized themselves *in the description* and *adopted the label*. This changed their **self-understanding**: "This thing I experience has a name: 'flat panic'." This potentially changed their **behaviour** (noticing it more, interpreting experiences through its lens) and how they **interacted with professionals** (using the term).
      *   **Professional Feedback Loop:** Professionals (your counsellor friend, GPs) began encountering this self-description. This changed **their perception** of what was presenting. The meaning of the diagnosis (anxiety) subtly **shifted** to incorporate this now-recognized pattern ("the version from my book"). The category ("anxiety presentation") *moved to meet the people* describing themselves with this specific, culturally introduced term. The professionals' revised understanding then validates and reinforces the label and the self-experience for new individuals.
      *   **Dynamic Nominalism:** A new way of experiencing and articulating a specific form of anxiety distress ("flat panic") was effectively *created* by the fictional description and label. It crystallized a pattern that might have been diffuse before.

  2.  **"Tapering":**
      *   **Classification Created:** Your friend invented the *description* of the specific exit behaviour and the *label* ("tapering").
      *   **Adoption/Looping Begins:** Teenagers adopted the label ("tapers"). This changed their **self-understanding** and **behaviour** – the leaving became more "deliberate," a "thing you announce." It became a recognized social script within their group.
      *   **Professional/Social Feedback Loop:** Teachers started using the term. This institutional recognition further validates the label and shapes how teachers **perceive** and potentially **respond** to the behaviour. The behaviour itself may become more patterned as the label provides a socially understood framework for it.
      *   **Dynamic Nominalism:** A specific social behaviour pattern gained coherence, identity, and social meaning through the label.

  **Why Your Phenomenon is a Specific *Subtype* of Looping Effects:**

  Hacking primarily studied looping effects originating from scientific/medical/administrative classifications. **Your cases demonstrate "Cultural Looping Effects" or "Fiction-Driven Looping Effects":**

  *   **Origin:** The classification (label + description) originates *outside* official institutions, specifically from **fiction**.
  *   **Mechanism of Adoption:** Adoption is **voluntary, resonant, and identity-forming**. People *choose* the label because it feels right, not because it's imposed diagnostically ("labelling" in the negative sense). This often happens when fiction provides language for previously unarticulated or poorly understood experiences.
  *   **Pathway to Institutions:** The loop gains momentum through **cultural diffusion** (readers, communities) *before* often feeding back into **professional/institutional frameworks** (clinicians, teachers).

  **Defining the Phenomenon & Its Boundaries:**

  Let's coin a precise term and definition based on your description and Hacking's framework:

  *   **Term: Fiction-Driven Category Looping (FDCL)**
  *   **Definition:** A socio-cultural phenomenon where:
      1.  A fictional work creates a novel **description** and **label** for a specific pattern of thought, feeling, or behaviour.
      2.  Individuals encountering this fiction recognize the description as resonant with their own experience and **voluntarily adopt the label** as part of their self-understanding.
      3.  This adoption leads to changes in **self-perception**, **behavioural awareness** (noticing the pattern more), and potentially **behavioural expression** (performing the pattern more deliberately or within the framework provided by the label).
      4.  The label diffuses culturally, gaining recognition within relevant communities (e.g., online groups, schools).
      5.  The label and its associated description **feed back into professional or institutional frameworks** (e.g., healthcare, education).
      6.  This institutional encounter **shapes how professionals perceive, categorize, and respond** to the phenomenon, potentially altering the meaning of existing classifications or creating new institutional recognition.
      7.  This professional/institutional response further **validates and reinforces** the label, self-understanding, and behavioural pattern in individuals and the culture, creating a **co-evolutionary loop** between the fictional category, lived experience, and institutional understanding.

  **Answering Your Specific Edge Cases:**

  1.  **Does it still count if the label came from fiction?** **Yes, absolutely.** This is the defining characteristic of FDCL vs. traditional scientific looping effects. The fictional origin is crucial.
  2.  **Does it stop being the same if the description was accidentally accurate?** **No.** Accuracy at inception isn't the point. The loop is driven by *resonance* and *adoption*. Even if you stumbled on a "real" underlying pattern, the *specific framing, emphasis, and label* ("flat panic," "tapering") are fictional constructs. Their adoption changes how people experience and express that underlying pattern.
  3.  **Does the loop break if the person knows the word came from a novel?** **Not necessarily.** Knowing the origin doesn't negate the resonance or the usefulness of the label for self-understanding and communication. The validation often comes from peers and later, professionals ("Others feel this too, my therapist understands when I say 'flat panic'"). The origin becomes part of the story, not a disqualifier.
  4.  **What about words spreading without change, or change without words?**
      *   **Word Spreads, No Change:** This is simply **cultural diffusion** or **meme propagation**. The loop isn't formed because step 3 (adoption changing self/behaviour) and/or steps 5-7 (feedback into institutions) are missing. People might use "tapering" jokingly without identifying with it or changing behaviour.
      *   **Change Without Words:** This is **unarticulated experience** or **implicit behaviour change**. The FDCL loop specifically requires the *label* and *description* as the catalyst for the co-evolutionary process. Without the linguistic category driving the feedback loops (self-perception, institutional recognition), it's a different dynamic.

  **What FDCL Is Not:**

  *   **Self-Fulfilling Prophecy:** FDCL isn't about a *prediction* (e.g., "You will fail") causing the predicted outcome. It's about a *description* and *label* creating a new framework for understanding and experiencing oneself.
  *   **Labelling Theory (Negative):** While related, classic labelling theory focuses on the negative consequences of *deviant* labels imposed by authorities. FDCL involves *voluntary adoption* of labels often seen as *explanatory* or *identity-affirming*, originating from culture/fiction, not authority.
  *   **Medicalization:** FDCL *can* lead to medicalization (e.g., "flat panic" feeding into anxiety diagnoses), but it starts outside medicine and the adoption is cultural/voluntary, not driven primarily by medical authority.
  *   **Stigmatization:** While possible, your examples show relief and validation, suggesting FDCL can be destigmatizing by providing language for hidden struggles.
  *   **Just a "Word Caught On":** It's the *consequences* of the word catching on – the changes in identity, behaviour, perception, and institutional response – that define FDCL.

  **For Your Panel:**

  You can confidently say: "What I've observed is a fascinating example of **Fiction-Driven Category Looping**, a specific type of **looping effect** or **dynamic nominalism** as described by Ian Hacking. It's where a fictional description and label resonate with readers, are voluntarily adopted as part of identity, change how people experience and express those traits, diffuse culturally, and eventually feedback into professional frameworks like medicine or education, altering both the lived experience and the institutional understanding in a co-evolutionary loop. It highlights the profound power of fiction not just to reflect culture, but to actively shape our categories of self-understanding and even influence clinical realities."

  This provides a robust conceptual framework (Hacking), a specific name for the subtype (FDCL), and clear boundaries differentiating it from related concepts. It moves far beyond "culture's weird" into a well-defined sociological and philosophical phenomenon.
