answer: |-
  Here’s a streamlined, two-page proposal draft focused on your core idea, structured for clarity and impact. It avoids jargon, preempts philosophical scepticism, and leverages your interdisciplinary perspective.

  ---

  **Proposal: The Binding Force of "Lottery Promises": When Costs Are Uncertain at Commitment**  
  **Researcher:** [Your Name], Independent Scholar (Retired Population Ecologist)  
  **Duration:** 3 months (part-time)  
  **Deliverable:** 5,000-word paper + presentation to Philosophy Reading Group  

  ### 1. Core Question & Its Distinctiveness  
  **Question:** When a promise’s cost to the promisor is *inherently uncertain at the time of commitment* (e.g., marriage vows, co-signing loans, disaster-contingency pledges), does the moral obligation to uphold it depend on the *realized cost* revealed later?  

  This targets a gap in promissory theory: dominant paradigms ("I’ll lend you £50") assume costs are fixed ex ante. "Lottery promises" (LPs) are ubiquitous yet undertheorized. The tension is:  
  - **Ex Ante:** Bindingness *must* be cost-insensitive to function as a commitment device (enabling reliance/planning).  
  - **Ex Post:** Moral/legal intuitions often *are* cost-sensitive (e.g., "changed circumstances" doctrines), even when bad outcomes were foreseeable.  

  **Distinctions from nearby issues:**  
  - ≠ **Moral luck** (focused on blame for *actions* under uncertainty). *This* asks whether the *duty itself* fluctuates with outcomes.  
  - ≠ **General "changed circumstances"** (e.g., unforeseeable events). *Here, uncertainty is explicit and structural.*  
  - ≠ **Promise dissolution** (e.g., via consent). *This tests if obligation weakens *intrinsically* when costs balloon.  

  ### 2. Why Existing Theories Don’t Settle This  
  LPs stress-test major accounts of promising. Crucially, they reveal divergent predictions:  
  - **Practice/Convention Views:** If rules are socially fixed, LPs *might* inherit default cost-insensitivity—but do conventions *explicitly* cover variable costs? (Likely bites: conventions may be underspecified.)  
  - **Reliance/Expectation Views:** Reliance may be fixed (e.g., planning a life assuming spousal support) regardless of cost. But if costs soar, is the promisor’s burden excessive? (Bites: reliance harms vs. promisor sacrifice.)  
  - **Normative Power (Rights-Transfer) Views:** If promising transfers a right, cost sensitivity seems irrelevant—but can we transfer rights over *unknowable future burdens*? (Shrugs off? Or reveals limits to power.)  
  - **Reductivist Views** ("no special duty"): Obligation collapses to general duties (e.g., not harming via false assurances). *But*: If the promisee knew costs were uncertain, was reliance truly "warranted"? (Bites: hinges on epistemic warrants under uncertainty.)  

  *No theory explicitly resolves LPs; all extrapolate inconsistently from fixed-cost cases. This gap is the target.*  

  ### 3. Method: Discriminatory Case-Grid Analysis  
  **Approach:** Construct a minimal grid of vignettes varying key parameters:  
  - Cost distribution (known/unknown; bounded/unbounded)  
  - Realized cost (low/moderate/ruinous)  
  - Reliance type (fixed/mitigatable by promisee)  
  - Relationship (contractual/intimate/arm’s-length)  
  - Promisee’s capacity to insure/hedge risk  

  **Apply each theory** mechanically to each cell. Does it yield a clear, consistent verdict? Where does it struggle?  

  **Why this method?**  
  - Vs. **Ground-up derivation**: Avoids rediscovering wheels; tests *existing* theories’ coherence.  
  - Vs. **Experimental surveys**: Intuitions about LPs likely *contaminated* by outcome bias (which predicts ex post cost-sensitivity). Surveys measure *bias*, not *normative truth*.  
  - Vs. **Conceptual analysis**: Pure analysis risks ignoring how contextual factors (reliance, relationship) interact with uncertainty. The grid forces engagement with this.  
  *Strength:* Reveals if theories have "free parameters" (e.g., tacit cost thresholds) only activated in LPs.  

  ### 4. Potential Outcomes  
  - **Positive:** Identifies which theory best handles LPs (e.g., "Theory X consistently prioritizes ex ante commitment, but requires modifying condition Y").  
  - **Negative/Revelatory:** Shows all theories *ad hoc* adjust to costs (exposing outcome bias in ethics) OR collapse into general uncertainty norms (suggesting "promising" isn’t special here).  
  - **Deflationary:** LPs are merely a subset of "conditional promises," dissolving the puzzle. (But: explicit conditionals—"I’ll help if costs < £Z"—differ structurally from open-ended LPs.)  
  *Deliverable:* A paper mapping theories’ coherence in LP space, proposing refinements or diagnosing intractability.  

  ### 5. Risks & Mitigation  
  **Failure Modes:**  
  1. **Theories are unfalsifiable** (all tunable to any verdict) → Paper becomes a negative result: "Promissory theory lacks tools for uncertainty." (Still valuable.)  
  2. **Collapse into general changed circumstances** → Scope remains viable by focusing on *foreseeable, distributional* uncertainty (not true unforeseeability).  
  3. **Underdetermination**: Cases elicit conflicting but equally defensible verdicts → Paper argues *this very indeterminacy* reveals promising’s limits. (Still a finding.)  
  *Mitigation:* Start grid design early; if core tension evaporates, pivot to analysing *why* LPs seem distinctive but aren’t.  

  ### 6. Why Original & Feasible  
  **Not a rehash:** The *structural uncertainty* of LPs is neglected. Philosophers analyse "vows" or "contracts" but seldom isolate the *lottery mechanic* as central. Your approach imports a modeller’s lens: promises as *risk-allocation devices*.  

  **Plan:**  
  - **Month 1:** Finalize grid parameters; draft vignettes; survey literature (focus: how theories *implicitly* handle uncertainty).  
  - **Month 2:** Test each theory against grid; identify tensions/patterns; draft core argument.  
  - **Month 3:** Refine analysis; write paper; prepare presentation.  

  **Leveraging Interdisciplinarity:**  
  - Your expertise in *signalling theory* (costly commitment devices) and *stochastic modelling* offers fresh tools to dissect how promises function under uncertainty.  
  - Paper will explicitly engage ecological analogues (e.g., irreversible investment in volatile environments) to illuminate the commitment problem.  

  ---

  **For the Committee:** This proposal leverages my background in modelling complex systems to isolate a precise, undertheorized problem in promissory ethics. I approach this as a sympathetic outsider: fluent in philosophical reasoning but alert to real-world dynamics often abstracted away. The method is rigorous, bounded, and designed to yield publishable results even if negative. The outcome will clarify whether promissory obligation can survive inherent uncertainty—or if it tacitly relies on cost predictability.  

  ---  
  **Key Adjustments for Credibility:**  
  - **No bluffing:** Explicitly frames you as a non-philosopher (a strength: fresh perspective).  
  - **Methodological rigour:** Case-grid forces systematic comparison, avoiding hand-waving.  
  - **Risk-aware:** Pre-defines failure, showing project design is self-critical.  
  - **Niche-finding:** "Lottery promises" as a distinct category avoids reinventing the wheel.  

  **Next Steps for You:**  
  1. Fill in citations (e.g., Scanlon on reliance; Shiffrin on promise vs. contract; literature on moral luck).  
  2. Flesh out 2–3 core vignettes (e.g., "Vow to care for ailing friend; illness severity is stochastic but distribution known").  
  3. Pre-empt pushback: *Why not contractualist?* (Grid tests this!) *What about consent to renegotiate?* (Separate issue: bindingness ≠ enforceability.)  

  This proposal should withstand scepticism by being narrow, novel, and methodologically sound. I’ve kept it lean—expand vignettes/method details in the final draft. Solid work!
