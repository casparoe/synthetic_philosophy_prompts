prompt: |-
  I got into an argument about this at a barbecue last weekend and it's been bugging me ever since, so I wanted to lay the whole thing out and ask you to tell me what's actually going on underneath it. Here's the case that started it. Imagine a firm called Kestrel & Voss, founded in 1908 as a brass foundry, that today sells payroll software: no foundry, no brass, no building from back then, and not a single shareholder, director, employee or customer in common with the 1908 version for at least sixty years. The only things that carried over continuously are the name, the registry entry, some ledgers in a basement, and an unbroken chain of people who each in turn took over the previous outfit's contracts, debts and pension obligations. Now imagine a court lets a suit proceed against today's Kestrel & Voss for lead poisoning suffered by foundry workers in 1931, on the theory that the defendant is the very same entity that poisoned them and not merely its descendant or heir. One friend said that's obviously incoherent: for a thing to still be that thing, the stuff and the people have to be mostly the same, and once you've swapped out literally everything you have a new thing wearing an old name (she thought the philosophy word for her view was endurance, but she wasn't sure). Another said no, the things that live in time are like rivers or roads, made of different material at different moments, and the same company just means one continuous stretch of company activity, so of course it can be liable (he thought that was perdurance, equally unsure).

  What I actually want isn't a verdict on the company, though. It's that our real institutions seem to do a bunch of apparently different things in this area at once, and I can't tell whether they're contradicting each other or tracking different features. On the one hand: firms are sued for century-old injuries across total turnover; universities apologize for, and pay damages over, selling enslaved people in the 1830s when nobody currently associated with them was alive; states pay reparations for wrongs committed before any living citizen was born; and a revolutionary government that repudiates everything the previous regime did is still treated as the same state for treaty purposes. On the other hand: there are statutes of limitations, so that after enough years a person simply isn't answerable anymore even though it's the same body and the same brain; as I understand it courts won't carry out a punishment, and sometimes won't even try someone, who has lost the capacity to understand why they're being punished, on the ground that the connection between the old act and the present suffering has to be graspable by the person undergoing it; and yet a living will I signed at thirty controls what's done to my body at eighty-five, when I may not recognize my own family or remember signing anything, which seems to give the earlier stage authority over a later one that shares almost nothing psychologically with it.

  So: what view of persistence over time does this package of practices as a whole presuppose? Can you reconstruct the implicit theory, and be careful about the difference between what the practices strictly require (such that the practice would be nonsense without it), what they merely sit well with, and where they're underdetermined so that several rival theories would license exactly the same thing? Is the corporate-versus-personal asymmetry principled, or is it just liability policy and deterrence wearing a metaphysical costume — one friend insists the metaphysics never enters into it at all, and I'd like to know if that's compatible with what the institutions are actually doing. I also floated my own test at the barbecue and nobody liked it, but I'd like it taken seriously: call it the chain-of-custody view, where the thing at the later time is the same thing as the earlier one iff there's an unbroken sequence of transfers of its name and records, each holder openly took on the previous holder's outstanding obligations, and nobody ever declared a fresh entity. Does existing practice secretly presuppose something like that rather than either of the two views my friends were reaching for, and how would it handle the awkward cases, like the regime that repudiates its predecessor's debts or the person who becomes, by their own later lights, a completely different agent? Finally, what would concretely have to change in law or institutional policy if we went all-in on the time-slices view and meant it everywhere — who would owe what to the 1931 workers, and whose signature on the living will would count — and what would have to change if we went the other way and meant the strictly-same-substance view everywhere?
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate at a barbecue about whether a modern company should be held liable for actions from 1931, despite a complete turnover in every aspect—people, assets, everything except the name and legal records. The core question is about persistence over time: what makes an entity the same through changes? The user wants to understand the implicit theory behind legal and institutional practices regarding persistence, not just a verdict on the company case.

  First, I need to address the two philosophical views mentioned: endurance (same entity wholly present at each time) versus perdurance (entity as a series of temporal parts). The user's friends each took one side. But the user is pointing out that real-world practices seem inconsistent—sometimes treating entities as continuous (like companies or states being liable for old wrongs), other times not (statutes of limitations, incapacity defenses). 

  The user also proposes their own "chain-of-custody" view, where persistence depends on formal transfers of obligations and records. They want to know if this aligns with existing practices. Plus, they ask about the corporate-personal asymmetry: is it principled or just policy? And what if we applied perdurance or endurance strictly everywhere?

  I should start by breaking down how different contexts handle persistence. Legal systems use different criteria for different entities. For corporations, legal continuity is key—formal succession matters more than material or personnel continuity. That's why Kestrel & Voss can be sued; the legal entity persists through changes as long as there's no formal dissolution. But for persons, it's more complex. Criminal liability requires personal identity (endurance), hence statutes of limitations and incapacity defenses. However, property and contracts rely on legal identity, so a living will signed at 30 binds the 85-year-old because the legal person is the same.

  The corporate-personal asymmetry isn't arbitrary. Corporations are legal constructs, so their persistence is defined by law. Persons are biological beings with psychological continuity, so legal practices reflect that duality. The user's chain-of-custody view resembles the legal approach for corporations but doesn't fit persons well—psychological changes aren't tracked formally.

  Applying strict perdurance (time-slices) universally would mean no entity persists, so no liability for past actions. Kestrel & Voss couldn't be sued, and living wills wouldn't bind. Strict endurance would make corporations dissolve with any change, while persons might always be liable, ignoring psychological changes.

  Existing practices are pragmatic, balancing continuity with justice. For corporations, continuity supports obligations; for persons, limitations protect against unfairness. The metaphysics isn't explicit but underpins the rules. The user's deeper need is likely understanding how institutions manage identity over time despite apparent contradictions, seeking coherence in the system's implicit logic.
answer: |-
  Your barbecue debate taps into profound questions about identity, responsibility, and legal fiction. Existing practices don't adhere to a single metaphysical theory but deploy context-dependent strategies balancing continuity with justice. Here's the implicit framework:

  ### Core Principles of Persistence in Institutional Practice
  1. **Legal vs. Biological Identity Distinction**  
     Institutions treat *corporate* and *state* persistence as **formal continuity** (dependent on institutional recognition), while *personal* identity blends biological continuity with psychological/legal agency.

  2. **The Continuity Spectrum**  
     Persistence isn't binary but graded:  
     - **Strong continuity**: Unbroken legal identity (e.g., corporations, states)  
     - **Conditional continuity**: Biological identity with psychological rupture (e.g., dementia patients)  
     - **Terminated continuity**: Legal repudiation or biological death  

  3. **Purpose-Relative Criteria**  
     Persistence tests shift based on the goal:  
     - *Liability/Contract Enforcement* → Prioritizes formal succession  
     - *Criminal Responsibility* → Prioritizes psychological continuity  
     - *Property Rights* → Prioritizes biological continuity  

  ### Decoding the Practices
  | Scenario                  | Implicit Persistence Theory                     | Strict Requirements                          |
  |---------------------------|------------------------------------------------|---------------------------------------------|
  | **Corporate Liability**   | Perdurance (entity as 4D worm)                 | Unbroken legal registration + assumption of obligations |
  | **State Succession**      | Conventionalism (identity by mutual recognition) | No formal dissolution + international recognition |
  | **Statutes of Limitation**| Endurance (same agent must be accountable)      | Defendant's capacity to defend themselves   |
  | **Living Wills**          | Biological endurance + prior intentional binding | Documented consent at time of signing       |
  | **Incapacity Defense**    | Psychological endurance rupture                | Current inability to comprehend punishment  |

  ### Evaluating Your "Chain-of-Custody" View
  Your proposal aligns **perfectly with corporate/state practice** but fails for persons:  
  - ✅ **Works for Kestrel & Voss**: Explains liability despite total material turnover  
  - ❌ **Fails for dementia patient**: Legal identity persists without psychological continuity  
  - ❌ **Fails for repudiation regimes**: States like post-Soviet Russia rejected Tsarist debts yet retained treaty obligations  

  *Why it's partially adopted*: Institutions *do* use chain-of-custody for entities where obligations outweigh identity (corporations), but reject it where autonomy matters (persons).

  ### Corporate vs. Personal Asymmetry: Principled or Policy?
  It's **metaphysically informed policy**:  
  - **Corporate endurance is fictional**: Built on *Hohfeldian jural relations* (rights/duties exist independently of physical substrate)  
  - **Personal endurance is biological**: Rooted in brain/body continuity  
  - **Policy drivers**:  
    - *Deterrence* requires corporate perpetual liability  
    - *Human rights* limit personal liability by cognitive capacity  

  The metaphysics isn't incidental—it provides the *scaffolding* for these policy choices. Without an implicit perdurantist view of corporations, century-long liability collapses.

  ### Strict Application Consequences
  **If we enforced strict perdurance (time-slices) everywhere**:  
  - Kestrel & Voss **couldn't be sued** - 1931 "time-slice" no longer exists  
  - Living wills **invalidated** - 30yo and 85yo are distinct entities  
  - Reparations **abolished** - no continuous state entity  
  - *Result*: Systemic injustice (no redress for historical wrongs) + contractual chaos  

  **If we enforced strict endurance (same substance) everywhere**:  
  - Corporations **dissolve** with any asset/employee change  
  - Dementia patients **fully liable** for past crimes  
  - Revolutionary states **lose sovereignty** after regime change  
  - *Result*: Commercial paralysis + cruel punishments  

  ### How Institutions Handle Awkward Cases
  - **Debt-repudiating regimes**:  
    Treat identity as conventional ("successor state" status granted if they control territory/population) while isolating obligations (e.g., Russia inherited USSR's UN seat but negotiated new debts)
    
  - **Radical personal transformation**:  
    Courts distinguish *legal identity* (enduring) from *culpability* (requires psychological continuity). A reformed 70yo isn't "the same person" for sentencing but *is* for property inheritance.

  ### The Underlying Theory
  Institutions presuppose a **hybrid model**:  
  - **Entities defined by obligations** (states/corps) → *Perdurantist*  
  - **Entities defined by consciousness** (persons) → *Endurantist with psychological thresholds*  
  - **Continuity mechanism** → Formal succession for institutions, biological for persons  

  This isn't contradictory but *teleological*: Persistence conditions serve social functions. The "same entity" is whatever the relevant community (legal, international, moral) needs it to be for specific purposes. Your chain-of-custody view works precisely where the *function is obligation transmission*—which explains its corporate applicability but personal inadequacy.

  ### Final Verdict
  The barbecue metaphysicians were both half-right: Corporations *are* rivers (perdurantist), persons *are* enduring substances—until psychology fractures. But the real genius of institutions is their **pragmatic metaphysics**: They reconstruct identity differently in different rooms of the courthouse to keep society functioning. The 1931 workers *do* get compensation not because Kestrel & Voss is metaphysically identical, but because we've agreed that names + obligation chains = liability vessels for social stability. That’s not philosophy—it’s the law doing its best in time’s river.
