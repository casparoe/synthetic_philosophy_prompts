prompt: |-
  Hey — I run a monthly reading group on the history of economic thought, mostly a few retired econ people, a lawyer, and two grad students. Last month we did Aristotle on money and we got properly stuck: the household-management-versus-wealth-getting distinction in Politics book I, the bit where he calls interest a kind of offspring and says money is barren, the claim that money holds by agreement and not by nature, and the reciprocity-and-common-measure material in Nicomachean Ethics book V where need is what actually holds a community together. Nobody could agree on what any of it implies past the ancient household. So I want to close the series with a film night, and Ive landed on Trading Places (1983, Aykroyd and Murphy, the two old brothers who run a commodity brokerage and bet a dollar on whether they can turn a broker into a thief and a thief into a broker).

  What I want from you is a reading of the film through that material — not a summary of the film and not a summary of Aristotle. Concretely:

  Whether Duke and Duke are doing chrematistics in Aristotle's sense, and what exactly makes it so. They deal in frozen concentrated orange juice and never touch the juice; is the thing Aristotle objects to the unlimited aim, or the severing of the trade from any use of the good? I think the film lets you separate these and the text maybe doesnt, and I want you to say which one the film actually indicts.

  The dollar bet itself. Two men are treated as interchangeable units in a wager — money applied to persons as a measure. Aristotle has need as the real unit and money as a token standing in for it. Does the film dramatize a version of the confusion he predicts, or is it doing something he has no vocabulary for at all?

  The ending. Winthorpe and Valentine win by playing the Dukes' own game with a stolen crop report and walk off rich. Does that undercut any Aristotelian reading — i.e. does the film quietly endorse wealth-getting while pretending to punish it — or is its target something narrower? One wrinkle I want you to deal with honestly: the climax turns on knowledge, and Aristotle allows a wealth-getting that involves skill and expertise, so the film might be on his side here rather than against him.

  Also tell me where the reading fails: the scenes that resist it, the points where forcing Aristotle onto an 80s comedy would be a distortion. Pick two or three scenes I should actually show and say what each is worth.

  Please commit. Give me one reading you'd defend out loud, with reasons, tell me what you'd say when one of my members pushes back, and flag the places where you're stretching — either stretching Aristotle, or stretching the film to fit him. And finish by saying what, if anything, the film adds to that debate that the argument alone doesn't give you. I don't have the script in front of me, so no quoting lines, and no reading lists or footnotes — just the argument.
