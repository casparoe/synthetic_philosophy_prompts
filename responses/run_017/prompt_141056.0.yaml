prompt: |-
  ok so I'm in this undergrad seminar on the history of violence (joint history / politics thing, mostly reading about whether things have gotten less bloody over time) and I keep getting hung up on how the numbers get built rather than on the big claim itself. Maybe you can help me see what my prof's measurement setup is actually committed to.

  Here's the practice as we use it in class. For everyday killing we always use a rate: homicides per 100,000 people per year, taken from whatever the national statistics and coroners recorded. So a village of 500 in 1300 with one murder a year counts as way more violent than a modern city, because the denominator is tiny. But for wars we always use absolute totals: "this war killed about X million people," full stop, never divided by world population or by the number of people living anywhere near the fighting. And the war totals only include direct deaths — people who starved or died of disease because the war wrecked the food supply get coded on the death certificate as famine or epidemic and drop out of the violence number entirely. Also within the homicide stats, soldiers killed in battle, people executed by the state, and people who die in police custody each get handled differently depending on the jurisdiction, so the same kind of death lands inside or outside the count depending on who's doing the recording.

  Then, to make cross-era comparisons fair, our prof invented this thing he calls "violence-adjusted life years" (VALY): you weight each death by how many years the person would probably have had left, so a famine that kills infants can score worse than a battle that kills twenty-year-olds, even with fewer bodies.

  But he also insists there's one real fact of the matter about whether violence has declined, and that all these measures are just imperfect approximations of it.

  So: what theory of what violence is, and of what makes a killing bad, does this whole bundle presuppose? It feels like it's mixing a view where the bad thing is your risk of being killed, a view where the bad thing is the life-years you're deprived of, and a view where the bad thing is someone intentionally killing you — are those consistent with each other here, or is the practice quietly switching views depending on which number it wants? Which parts does the practice strictly require and which does it merely go along nicely with, and where is it underdetermined so that several quite different theories would all license it? And concretely: what would have to change in the numbers if we dropped his implicit view and rebuilt them on each of those rivals — and would we even still be measuring one thing?
reasoning: |-
  Okay, the user is in an undergrad seminar on the history of violence, focusing on whether violence has decreased over time. They're confused about the methodologies used in class, particularly how different types of violence are measured differently. Let me unpack their concerns.

  First, they mention that homicides are measured as a rate per 100,000 people, while war deaths are absolute numbers. That's a significant inconsistency. Why use rates for one and totals for the other? The user points out that a small village with one murder appears more violent than a modern city because of the denominator. But wars aren't adjusted for population. That could skew comparisons, especially when comparing eras with different global populations. 

  Then there's the issue of what counts as a war death. Only direct combat deaths are included; indirect deaths like famine or disease from war aren't counted. That seems problematic because many war-related deaths are indirect. The user also notes discrepancies in homicide stats—deaths from executions or police custody vary by jurisdiction, making the data inconsistent.

  The professor's VALY metric adjusts for life years lost, weighting deaths of younger people more heavily. But the user questions whether this mixes different ethical views: risk to individuals, life-years lost, and intent to kill. They're asking if the methodology presupposes a specific theory of violence and if switching theories would change the measurements. 

  Underlying all this is the professor's claim that there's one true measure of violence decline. The user is skeptical about this, given the methodological inconsistencies. They want to understand the implicit assumptions in these methods and how different theories would alter the measurements. 

  I need to address the core tension between the professor's realism (one true fact) and the operational inconsistencies. The different measurement approaches (rates vs. absolutes, inclusion criteria, VALY) reflect different priorities: individual risk for homicides, aggregate harm for wars, and life-years for VALY. These aren't consistent. 

  The user might also be concerned about how these methodologies impact the narrative of declining violence. If war deaths are absolute and not per capita, modern wars might seem worse despite larger populations. Not counting indirect deaths downplays historical wars where famine was common. VALY might make modern healthcare-reliant societies seem more violent if infants die, even if mortality rates are low. 

  To answer, I should outline the implied theories in current methods, how rival theories would change measurements, and whether violence can be a single metric. Highlighting the trade-offs between individual risk and aggregate harm, intent versus consequence, and the ethical weight of life stages. Emphasize that the professor's approach isn't neutral; it combines elements that might conflict. Maybe suggest that the user question whether a unified theory of violence is possible or if multiple dimensions are needed.
answer: |-
  Your professor's measurement framework reveals a deep tension between **empirical pragmatism** and **moral-philosophical commitment**, while implicitly prioritizing a **state-centric, individual-risk model of violence**. Let's dissect the presuppositions and explore how rival theories would alter the numbers:

  ### Core Presuppositions of the Current Framework:
  1. **Violence as Discrete Acts of *Interpersonal* Harm**:  
     The homicide rate (per capita) treats violence as a *risk to individuals* within a society. War deaths (absolute numbers) treat violence as *aggregate harm caused by political entities*. This privileges the **state's monopoly on legitimate violence** – soldiers dying in state-sanctioned war aren't "murdered," so they vanish from homicide stats but appear in war totals.

  2. **Intentionality Over Consequence**:  
     Only *direct, intentional* killing counts as "violence." Starvation from siege warfare is a "collateral effect," not violence itself. The framework presupposes that **the moral badness of violence lies in the *act* of killing**, not in the *outcome* of preventable death. A famine caused by warlords burning crops isn't "violence" under this definition.

  3. **The Primacy of Individual Risk for Non-War Violence**:  
     Per-capita homicide rates answer: *"How likely am I to be murdered?"* This assumes **violence's badness is tied to *threat perception* and *security* in daily life**.

  4. **Life-Years as a Moral Metric (VALY)**:  
     VALY shifts focus from *death* to *deprivation*. It presupposes:  
     - The badness of violence is proportional to **stolen life potential**.  
     - A society with high infant mortality has "less to lose" from violence than one with high life expectancy.  
     - But this *contradicts* the homicide/war distinction: Why weight stolen life-years for a murdered peasant but not a starved conscript?

  5. **Methodological Nationalism**:  
     Data sources (national stats, coroners) embed modern state bureaucracy. Applying this to pre-modern eras (e.g., a 1300 village) **imposes an anachronistic lens** where "violence" is only what states define and record. Feuds, banditry, or colonial massacres often slip through.

  ### Contradictions & Quiet Switches:
  - **Risk vs. Scale**: Using rates for homicides (individual risk) but absolutes for wars (aggregate harm) makes pre-modern societies *appear* more violent (small denominator) while downplaying modern war's *relative* impact (large denominator ignored).  
  - **Intent vs. Consequence**: Counting a soldier shot in battle as "war death" (intentional) but not one who dies of infected wounds (unintentional) is arbitrary. Yet both result from organized violence.  
  - **Moral Weighting**: VALY cares about age-at-death, but the homicide/war split cares about *who killed you* (criminal vs. state). These are orthogonal concerns.

  ### Rebuilding with Rival Theories:
  | Theory of Violence          | Homicide Metric          | War Metric               | Indirect Deaths      | VALY Compatible? | Resulting "Decline" Narrative |
  |----------------------------|--------------------------|--------------------------|----------------------|------------------|-------------------------------|
  | **Current Framework**      | Rate per 100k            | Absolute deaths          | Excluded             | Yes              | Likely decline (Pinker-esque) |
  | **Individual Risk Focus**  | Rate per 100k            | **Rate per 100k in war zones** | Excluded             | Partially        | Less clear; modern wars may look *less* deadly per capita |
  | **Total Harm Focus**       | Absolute deaths          | Absolute deaths          | **Include all excess mortality** | Yes              | Modernity looks *more* violent (WW2, colonial famines) |
  | **Intentional Harm Only**  | Rate per 100k            | Absolute deaths          | Excluded             | **No** (age irrelevant) | Strengthens decline narrative |
  | **Consequentialist (Life Deprivation)** | **VALY rate per 100k** | **Total VALY lost**      | **Include all preventable deaths** | N/A (core metric) | Pre-modern era may look worse (high youth mortality) |

  ### Consequences & Underdetermination:
  - **Dropping State-Centricity**: If you count *all* politically caused deaths (e.g., famines under Stalin, colonial resource wars), modern "total harm" spikes dramatically.  
  - **Embracing Consequentialism**: Including disease/famine from war could triple death tolls (e.g., Thirty Years' War). A "violence decline" might vanish.  
  - **Pure Individual Risk**: Modern war zones (Syria, Ukraine) might have higher per-capita death rates than medieval battles once localized.  
  - **VALY as Primary**: High infant mortality in past societies means even *non-violent* deaths dominate VALY loss. Violence-specific VALY would require impossible age-at-death data for wars.  

  **The practice is underdetermined by philosophy**:  
  - A **deontologist** (focused on intent) would demand strict separation of murder/battle/execution.  
  - A **utilitarian** (focused on suffering) would merge all preventable death into one metric.  
  - A **Foucauldian** would reject "violence" as a stable category, seeing only shifting power techniques.  

  ### Can We Measure "One Thing"?  
  Only if you accept the **nested presuppositions**:  
  1. Violence is *interpersonal* killing.  
  2. The state defines legitimate vs. illegitimate killing.  
  3. Individual risk matters for crime; aggregate harm matters for politics.  
  4. Life-years allow "fair" comparison across eras.  

  **If you reject any pillar, the edifice crumbles.** Your professor's "one real fact" likely assumes a Rawlsian-style view: violence is *unjustified coercive harm*, with moral weight proportional to life deprivation. But the measurement practice doesn't consistently reflect this.  

  **Concrete advice for your seminar:**  
  1. Calculate war deaths *per capita* for the affected regions (e.g., Europe 1914-1918). Does the "decline" narrative hold?  
  2. Estimate indirect deaths for one pre-modern war (e.g., using skeletal evidence of malnutrition). How does it change the toll?  
  3. Apply VALY *only* to violent deaths (ignore other mortality). Does the age-distribution of war dead alter the ranking of eras?  

  The numbers aren't neutral. They encode a theory—and your skepticism exposes its seams. That’s excellent historiography.
