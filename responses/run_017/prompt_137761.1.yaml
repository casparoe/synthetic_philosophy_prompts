answer: |-
  Below is a systematic audit of the analogy between money-pump arguments, non-conservative physical systems, and arbitrage markets. I address your four requests in sequence, flagging conceptual tensions and normative implications.

  ---

  ### **First: Correspondence Table**
  | **Concept**               | **Physical System**               | **Market**                         | **Agent (Preference Coherence)**      | **Unmatched in Agent Case** |
  |---------------------------|-----------------------------------|-----------------------------------|--------------------------------------|----------------------------|
  | **State**                 | Position/configuration (e.g., $(x,y,z)$) | Portfolio holdings               | **Current holdings/endowment**       | —                          |
  | **Closed Path**           | Cycle in state space (e.g., path $\oint_C \mathbf{F} \cdot d\mathbf{r}$) | Arbitrage loop (e.g., A→B→C→A trades) | **Sequence of trades returning to initial holdings** | —                          |
  | **Work Extracted**        | Net work done per cycle ($W = \oint_C \mathbf{F} \cdot d\mathbf{r} \neq 0$) | Risk-free profit                 | **Net loss of resources (e.g., money)** | —                          |
  | **Potential Function**    | Conservative potential $\phi$ where $\mathbf{F} = -\nabla\phi$ | Consistent pricing system (state prices) | **Utility function $U$** (if preferences are coherent) | —                          |
  | **Arbitrageur/Exploiter** | External operator driving the cycle | Trader executing arbitrage       | **Counterparty proposing trades**    | *The exploiter is external; the agent’s incoherence is internal.* |
  | **Transaction Costs**     | Friction/dissipation ($\mu_k N$) | Bid-ask spreads, fees            | **Cognitive/effort costs, commitment mechanisms** | —                          |
  | **No-Arbitrage Eq.**      | Conservative force field ($\nabla \times \mathbf{F} = 0$) | Law of one price, no arbitrage   | **Diachronically coherent preferences** | —                          |
  | **Conserved Quantity**    | Energy                            | No risk-free profit              | **No direct analogue**               | *No conserved "rationality charge"; losses are material, not metaphysical.* |
  | **Underlying State**      | Microstate (e.g., particle positions) | Fundamental asset values         | **True beliefs/values?**             | *Ambiguous; no objective "ground truth" for preferences.* |

  ---

  ### **Second: Disanalogies and Their Relevance**
  Disanalogies bearing on normative intent are marked **(!)**.

  **(a) Agency and Myopia**  
  - **Disanalogy**: Physical/market loops are traversed passively by states/portfolios; agents *make choices* at each node.  
  - **Bearing on Normativity (!)**:  
    - If the agent is **myopic** (re-decides locally), the pump succeeds.  
    - If **resolute** (binds to a prior plan), the agent refuses tempting later trades, blocking the pump.  
    - *Normative implication*: Coherence may require resolute planning. The analogy assumes myopia, but rationality might demand sophistication.  

  **(b) Exploitable vs. Criticizable**  
  - **Disanalogy**: Non-conservative fields and arbitrage markets are not "defective"; they merely permit energy extraction/profit.  
  - **Bearing on Normativity (!)**:  
    - For agents, exploitability implies **internal inconsistency**: preferences conflict across time. This violates **instrumental rationality** (achieving ends efficiently).  
    - *Key difference*: Agents have unified agency. Being "drainable" reveals a failure to serve *their own* interests.  

  **(c) The Exploiter’s Knowledge**  
  - **Disanalogy**: Physical/market loops require no "mind"; agents may self-reflect.  
  - **Bearing on Normativity**:  
    - If the agent is **transparent to herself**, she might preempt the pump by recognizing incoherence and correcting preferences.  
    - *Surviving insight*: The vulnerability exists *in principle*; self-knowledge might mitigate but not erase the structural flaw.  

  **(d) Hysteresis vs. Defect**  
  - **Disanalogy**: Physical hysteresis (e.g., magnetization) is path-dependent but not defective; it reflects legitimate dynamics.  
  - **Bearing on Normativity (!)**:  
    - **Normative work** is done by the **existence of a potential function**. Hysteretic systems lack a global potential; preferences lack a utility function.  
    - *Agent case*: Path-dependence becomes criticizable when it enables *cycles* (e.g., A≻B≻C≻A). Hysteresis without cycles (e.g., A→B→C with no return) may be rational (e.g., learning).  

  ---

  ### **Third: Iterability (Perpetual vs. One-Shot Pumps)**  
  - **Cyclic Violations** (e.g., A≻B≻C≻A): A perpetual pump is possible. After trading A→B→C→A, the agent holds A but is strictly worse off (e.g., paid to cycle).  
  - **Non-Cyclic Violations** (e.g., Allais paradox):  
    - Example: At t=1, choose lottery X over Y; at t=2, pay to switch to Y if a condition holds.  
    - This is **one-shot**: The agent ends in a new state (holding Y) and cannot be pumped further *for the same choice*.  
  - **Structural Feature for Iterability**:  
    - Iterability requires the agent to **return to an earlier state** with unchanged preferences.  
  - **Normative Significance**:  
    - Both are irrational (violate dynamic consistency).  
    - Perpetual drain is *pragmatically worse* but not *structurally distinct*; both reveal a lack of unified agency.  

  ---

  ### **Fourth: Verdict on the Coda**  
  **Claim**: "Small violations imply small irrationality; friction negates the argument."  
  #### **Audit**:  
  - **Small Violations**:  
    - *Analogy supports*: In physics, a small curl ($|\nabla \times \mathbf{F}|$) enables little work extraction; in markets, small price gaps allow limited arbitrage.  
    - *But*: A "small" preference cycle (e.g., near-indifference) may still be exploited repeatedly → large losses. Normatively, **any cycle** violates rationality axioms.  
  - **Friction**:  
    - *Physical case*: Friction doesn’t make $\mathbf{F}$ conservative; it dissipates energy but the field remains pathological.  
    - *Market case*: Unexploited arbitrage implies market inefficiency, not price consistency.  
    - *Agent case*: Trading costs may block exploitation, but the **incoherence remains**. Friction masks but does not cure the defect.  
  - **Verdict**: The analogy **undercuts the coda**. Friction prevents exploitation, not incoherence. A rational agent should eliminate the vulnerability, not rely on friction.  

  #### **What the Analogy Can Carry**:  
  1. **Structural vulnerability**: Incoherence permits *possible* exploitation, revealing a failure of instrumental rationality.  
  2. **Normative force**: The flaw is in the agent’s preference structure, not beliefs/luck.  
  3. **Diagnostic value**: The "pump" is a test for coherence, like $\oint \mathbf{F} \cdot d\mathbf{r} \neq 0$ tests conservatism.  

  #### **Better Comparison?**  
  Consider **thermodynamic irreversibility**:  
  - An agent with cyclic preferences is like a system that could spontaneously decrease entropy (e.g., heat flowing cold→hot).  
  - The "pump" is the engineered process (e.g., a heat engine) that exploits this possibility.  
  - **Advantage**: Embeds agency in natural law; entropy increase as a consistency condition.  

  ---

  ### **Summary**  
  - The analogy **holds** for exposing structural incoherence but **strains** under agency, hysteresis, and self-knowledge.  
  - It **fails** to support the coda: Friction hides but does not justify incoherence.  
  - Core normative insight survives: An agent whose preferences permit a money-pump cycle is instrumentally irrational, as they can be compelled to harm their own interests.
