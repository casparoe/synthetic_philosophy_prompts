  Most uncertain point: whether practical factor effects are *merely* pragmatic. The literature is split, but their clinician case feels like a strong challenge—if "knows" usage shifts systematically with stakes without semantic change, is that still "just" pragmatics? I lean yes, but it's shaky.
answer: |-
  Here's a systematic analysis of defeaters for purist invariantism, ranked by severity, with confidence markers (1-5, 5=highest) and focus on *your* cases and escape route.

  ---

  ### **Fatal Defeaters (Threaten Core Tenets)**
  1. **Explanatory Indispensability of Practical Factors**  
     - **Defeater:** If practical factors (stakes, inquiry cost) *directly* explain *epistemic* phenomena (e.g., why inquiry is rationally demanded/omitted) better than purism, and this work can't be outsourced to utility functions.  
     - **Source:** Your Case 3 (cheap inquiry).  
       - *Example:* If an agent with credence 0.97 refuses cheap, decisive verification (e.g., a $1 test), purism says they still know. But if we judge they *lose knowledge* by neglecting inquiry, practical factors encroach epistemically.  
     - **Why fatal?** Undermines the "fixed credence" core by making knowledge sensitive to non-evidential factors.  
     - **Your dismissal:** Not entitled. Conceding this erodes the invariantist position (Confidence: 4).  
     - **Can purism absorb it?** Only by stretching "epistemic position" to include obligations to inquire—but this collapses into pragmatic encroachment.

  ---

  ### **Major Defeaters (Force Costly Concessions)**
  2. **Coordination Failure in Joint Action**  
     - **Defeater:** Purism cannot resolve conflicts in your "handoff case" (Case 2). If both agents have identical evidence/credence, purism says they both know/don’t know. Yet their asymmetric stakes cause a coordination breakdown.  
     - **Why major?** Your "portable knowledge" argument fails here: if knowledge is stake-invariant but *assertions* of knowledge are stake-sensitive, communication breaks. The surgeon rejects the consultant's "I know" not due to semantic context but practical risk.  
     - **Purist response:** Claim the surgeon is wrong (they *do* know, but stakes make assertion inappropriate).  
     - **Cost:** Makes knowledge useless for coordination. Why have a concept that can’t be safely asserted in high-stakes settings? (Confidence: 5)  
     - **Your escape route:** Treating "knows" as conveying actionability (pragmatic) is principled *here*—but it admits knowledge attributions are systematically misleading in high-stakes contexts.

  3. **Semantic Flexibility of "Knows"**  
     - **Defeater:** Ordinary language treats "knows" as context-sensitive (e.g., Case 1: same clinician attributes knowledge in low stakes but not high). If this is semantic (not pragmatic), purism is false.  
     - **Pragmatic encroachment vs. contextualism:**  
       - *Pragmatic encroachment:* Stakes directly affect knowledge (epistemology).  
       - *Contextualism:* "Knows" shifts meaning with attributor’s context (semantics).  
     - **Are they distinct?** Yes—pragmatic encroachment alters truth conditions; contextualism alters word meaning. But both use practical factors to explain language, so **one core defeater in two costumes**.  
     - **Your dismissal (pragmatic impostor):** Principled iff:  
       - (a) You show "knows" *always* semantically expresses high confidence + evidence, and  
       (b) Stakes only affect *implicatures* (e.g., "act on this!").  
     - **Risk:** If "I know" in low stakes implies "no need to check," but in high stakes it doesn’t, the implicature isn’t cancelable (violating Grice). In Case 1, the clinician isn’t *withholding* "knows" to avoid misleading; they genuinely deny the state exists (Confidence: 4).

  ---

  ### **Awkward Defeaters (Empirical Irritants)**
  4. **Systematic Variance in Knowledge Attributions**  
     - **Defeater:** People’s willingness to attribute "knowledge" tracks practical factors (Case 1). Purism must dismiss this as widespread error.  
     - **Why awkward?** Folk concepts *are* the subject matter. If purism revises ordinary usage, it becomes revisionary—not descriptive.  
     - **Purist entitlement:** Dismissible if folk usage conflates knowledge with action-guidance. Your "duplicated machinery" argument justifies this.  
     - **Cost:** Makes knowledge otiose—if we always need calibrated confidence + utilities, why not ditch "knowledge"? (Confidence: 3)

  ---

  ### **Your Escape Route: Pragmatic Impostor**  
  - **Is it principled?** Yes, if:  
    - You strictly confine "knowledge" to the epistemic (credence + evidence).  
    - You explain *all* practical effects via conversational pragmatics (e.g., "knows" implicates "rely on this").  
  - **Does it over-insulate?** It *can* if stretched to dismiss any data (e.g., Case 3’s inquiry obligations). But your version has limits: it concedes action/assertion norms *are* stake-sensitive.  
  - **Folk concept problem:** Not fatal. Folk concepts can be messy; purism offers a clean reconstruction. But if the folk concept *builds in* practical flexibility (Case 2), reconstruction may miss its point.  

  **Verdict on escape route:** Principled but precarious. It survives Cases 1-2 but fails if practical factors show *explanatory independence* (see below).

  ---

  ### **What Could Move You (The Indispensability Argument)**  
  - **The argument you seek:**  
    1. **Premise:** Purism cannot explain why we have *knowledge*-specific norms (e.g., "Assert p only if you know p").  
    2. **Premise:** Decision theory (credence + utilities) already governs action.  
    3. **Problem:** Knowledge norms *vary* with practical factors (e.g., high stakes require more "knowing" for assertion).  
    4. **Conclusion:** If knowledge is stake-invariant, its norms are either redundant or incoherent. Only pragmatic encroachment unifies them.  
  - **Why it might work:** It hits your "duplicated machinery" argument. If stake-sensitive knowledge does *unique* work (e.g., explaining inquiry demands or normative friction in Case 2), purism loses its parsimony.  
  - **Can it be produced?** Yes—using your Case 3:  
    - Purism says: With credence 0.97, you know *and* may omit cheap checks.  
    - Encroachment says: If checks are cheap, you don’t know *until* you check.  
    - Advantage: Encroachment explains why omitting inquiry feels *epistemically* negligent, not just practically risky.  

  **Weakest point:** Whether inquiry norms are genuinely *epistemic* (Confidence: 2—I’m unsure if this is consensus or reconstruction).  

  ---

  ### **Summary Table**
  | Rank | Defeater                          | Source          | Purist Response       | Viability of Dismissal |
  |------|-----------------------------------|-----------------|-----------------------|------------------------|
  | Fatal| Explanatory indispensability      | Case 3 (inquiry)| Concede               | Not entitled           |
  | Major| Coordination failure              | Case 2 (handoff)| Costly concession     | Principled but costly  |
  | Major| Semantic flexibility of "knows"   | Case 1 (clinician)| Pragmatic dismissal | Principled if limited  |
  | Awkward| Folk attribution variance      | All cases       | Dismiss as error      | Entitled but awkward   |

  **Least confident claim:** That practical factors *must* be epistemic to explain inquiry demands (Rank 1 defeater). I’m 60% sure this is a genuine problem; 40% chance purism can外包 it to norms of rationality (Confidence: 2.5).  

  **Efficiently moving you:** Focus on Case 3. If neglecting cheap inquiry *destroys knowledge* (not just permission to act), purism loses. Your credence-threshold model can’t explain this without stakes invading the epistemology.
