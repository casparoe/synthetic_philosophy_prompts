  The user also highlights a distinction between pleasures that should be sustained (like a hot bath) versus those that need completion (like scratching an itch), where prolonging the latter would be torturous. They mention eating when hungry as a hybrid case. They've heard hedonism has related issues but clarify their concern isn't about weighing pleasures—patients can rank items but can't identify the common factor. They want to know if there's a name for this problem, how it's typically divided, and if not, a coined term with clear definitions for borderline cases.

  First, I need to verify if existing philosophical concepts address their specific concerns. The phenomenological vs. motivational divide aligns with debates in philosophy of mind, particularly between qualia (subjective experiences) and conative states (desires or motivations). The sustained vs. completed distinction might relate to telic vs. atelic activities in action theory. Bernard Suits' ideas on games as voluntary obstacles could connect to the completion aspect, but it might not cover all cases.

  The user's examples—cold water after work, quiet after grandchildren, crossword resolution—show varied sources: sensory, emotional, cognitive, relational. This heterogeneity challenges reductionist theories. The issue of transitions vs. states is significant. Pleasures from relief or change aren't static states but dynamic shifts. This relates to Aristotle's concept of pleasure as an unimpeded activity, but the user's cases include the cessation of discomfort, which might need a different framework.

  Hedonism's problem of heterogeneity is mentioned, but the user clarifies it's not about aggregation but the lack of a common feature. They need a term that captures the two failure modes: phenomenological narrowness and motivational broadness, plus the telic/atelic split. Existing terms like "hedonic tone" or "valence" might be too vague. 

  For coining a term, "Dual-Aspect Disparity" could work, emphasizing the two problematic families. "Telic Discontinuity" for the completion aspect. But a unified term might be better. "Hedonic Heterogeneity" is close but might not stress the structural divide. "Constitutive Disparity" to highlight the inherent differences in what constitutes pleasure.

  Borderline cases: Finishing a hateful task involves relief (transition) and achievement (completion), so it fits. Near-miss relief is a transition, so included. Sleep absorption is a sustained state without active desire, so it might be in, aligning with dispositional theories if it's chosen again.

  Implications for the 0-10 scale: The scale assumes a common metric, but if pleasures are heterogeneous, the ratings might reflect intensity of relief, satisfaction, or engagement rather than a single dimension. Patients could be quantifying different aspects, making aggregation misleading. The scale might still serve as a heuristic but shouldn't be overinterpreted.

