answer: |-
  Your profound clinical observations touch upon a core aporia in the philosophy of pleasure and pain – one that remains actively contested. The phenomenon you describe, where attempts to define pleasure systematically fracture along precisely the two lines you identify (phenomenological narrowness vs. motivational broadness), coupled with the sustained/completed distinction, doesn't have a single, universally agreed-upon name. However, it maps directly onto fundamental tensions in the field, and we can provide conceptual clarity and a precise coinage.

  1.  **The Established Conceptual Landscape & Your "Two Families":**
      *   **Phenomenological Failures (Too Narrow):** This aligns with critiques of *qualitative* or *felt-quality* theories of pleasure (e.g., early Sidgwick, perhaps certain readings of Bentham). The objection is exactly as you state: many paradigmatic pleasures (intellectual satisfaction, relief, vindication) lack a distinctive, positive *sensory* or *affective tone* separable from the context. Pleasures of cessation or difference resist being pinned down to a momentary "feeling." This exposes the difficulty of defining a unitary *hedonic tone* or *positive affect* that covers all cases.
      *   **Motivational/Dispositional Failures (Too Broad):** This targets *conative* or *desire-based* theories (e.g., early versions by Aristotle, refined by contemporary philosophers like Timothy Schroeder or Leonard Katz). Defining pleasure simply as what we desire to continue, or are disposed to pursue, *is* too broad. It encompasses compulsive behaviours, relief from severe distress (which might be desired but isn't positively pleasant), and activities driven by aversion or anxiety (like your door-checking example), which lack genuine enjoyment. This is the problem of *false positives* for desire theories.

  2.  **The Sustained (Atelic) vs. Completed (Telic) Distinction:**
      Your insight here is crucial and often underexplored in basic definitions. It relates to the philosophical distinction between:
      *   **Telic Pleasures:** Those with a built-in termination point or goal. Their pleasure is intrinsically linked to *completion* (scratching the itch, resolving the chord/crossword, eating to satiate hunger). Protraction destroys the pleasure; they are *essentially finite*. Aristotle touched on this with pleasures pertaining to *restoration*.
      *   **Atelic Pleasures:** Those that are ongoing activities without a necessary endpoint. Their pleasure lies in the *sustained activity itself* (sitting in the bath, watching the storm, perhaps immersion in flow). We desire them to continue *as they are*.
      *   **Hybrid Cases (e.g., Eating Hungrily):** These involve *both* the telic pleasure of satisfying a need *and* the atelic pleasure of the sensory experience *during* the activity. This hybrid nature further complicates unitary definitions.

  3.  **The Nearest Established Notion & Its Limitations:**
      The overarching problem is indeed **Hedonic Heterogeneity**. Philosophers (e.g., Nozick, Griffin, Sumner) acknowledge the immense diversity of pleasant experiences and the difficulty of finding a single common denominator. However, the *specific structural fractures* you identify – the systematic sorting into phenomenological vs. motivational failures *and* the telic/atelic divide cutting across them – is a sharper articulation of *why* this heterogeneity is so problematic than is usually offered. It shows heterogeneity isn't random; it clusters around fundamental conceptual fault lines. While hedonism struggles with weighing pleasures *because* of heterogeneity, your concern precedes that: it's about the *constitutively disparate nature* of the phenomena being called "pleasure" in the first place, making even identification and comparison dubious despite people's ability to rank *something*.

  4.  **A Coined Name and Definition:**
      Given the precision of your observation, a specific coinage is warranted:
      *   **The Pleasure Constitutive Disparity (PCD):** The persistent conceptual failure arising from the inherent structural differences within phenomena commonly labelled "pleasure," characterised by:
          1.  **The Dual-Aspect Problem:** The systematic inadequacy of purely phenomenological accounts (failing due to experiential narrowness and the non-experiential nature of transitional pleasures) and purely motivational/dispositional accounts (failing due to motivational broadness capturing non-pleasant states).
          2.  **The Telic Discontinuity:** The fundamental distinction between pleasures intrinsically bound to completion (telic) and those oriented towards continuation (atelic), which cross-cuts attempts at unified definitions based on either feeling or motivation, and where hybrids exist.

  5.  **Borderline Cases via PCD:**
      *   **Grim Satisfaction of Finishing a Hateful Task:** **IN** under PCD.
          *   *Why:* Primarily *telic* (pleasure in completion, even if the activity was unpleasant). It's a pleasure of cessation/difference (ending the task) and possibly achievement. Motivational: Strong desire for it *to be over* (negative motivation) but satisfaction *that it is over* (positive, akin to relief). Phenomenologically, it may lack positive 'glow' but involves a distinct cognitive/emotional state of release/accomplishment. Fits the "transitional" and "telic" aspects.
      *   **Relief of a Near Miss:** **IN** under PCD.
          *   *Why:* A quintessential *transitional* pleasure. Phenomenologically diffuse (often described as weakness, shaking *plus* positive affect), defined entirely by the *difference* between the anticipated bad outcome and the actual outcome. Strongly desired (to avoid the bad outcome), but the relief itself is the positive state. Telic – the pleasure is in the *realisation* of safety (completion of the threat period).
      *   **Absorption of a Good Night's Sleep:** **AMBIGUOUS/IN with Caveats.**
          *   *Why:* This tests the boundaries. Phenomenologically: Deep sleep itself likely lacks conscious qualitative character. The *disposition* to seek sleep isn't itself pleasurable. However, the *satisfaction upon waking* feeling rested is a clear pleasure (telic: completion of rest; phenomenological: feeling refreshed; motivational: desire to repeat the state). *During* sleep, if we consider the *process* of restorative, unconscious rest, it might be argued as an *atelic* state we are disposed to enter and maintain. PCD suggests the core pleasure lies in the *transition* to feeling rested upon waking or the sustained *quality* of the restful state *as experienced* (if light sleep or upon drifting off/waking), making the "absorption" itself tricky. If defined strictly as the unconscious state, it's arguably **OUT** – it's a *condition for* pleasure (refreshment) but not a pleasant experience *per se*. If defined as the *experience of being deeply, restfully asleep* (which may have phases of semi-awareness), it leans **IN** as an atelic state.

  6.  **Implication for the 0–10 Scale:**
      The PCD demonstrates that the 0–10 scale asks patients to quantify fundamentally disparate phenomena under a single, ambiguous label ("enjoyment of life"). Patients *can* rank items because they intuitively grasp some dimension of *value*, *relief*, *satisfaction*, or *positive affect* within their lived experience. However, the PCD shows they are *not* reliably ranking items based on a shared, definable property called "pleasure" in any consistent philosophical sense. They might be ranking:
      *   Intensity of relief (transitional/telic).
      *   Strength of positive affect (phenomenological).
      *   Degree of motivational pull (dispositional).
      *   Duration or depth of immersion (atelic).
      *   Or some complex, personal amalgam.
      The scale *functions* pragmatically as a global indicator of *subjective wellbeing* or *freedom from hedonic deficit* at a moment, but it is philosophically naive. It conflates categorically different kinds of "positives" (cessation of pain, achievement, sensory joy, peace) into a single number. Its value is clinical and communicative, not ontologically rigorous. Recognising the PCD highlights that the scale's output is a *pragmatic gestalt*, not a measurement of a unified mental substance called "pleasure." This doesn't invalidate its clinical use but clarifies its limitations and the sophisticated, heterogeneous reality it imperfectly gauges.

  Your clinical notebook reveals the irreducible complexity of human flourishing amidst adversity. The Pleasure Constitutive Disparity names the structural reason why that complexity resists neat summation – not just in your scale, but in the deepest philosophical attempts to understand the good life.
