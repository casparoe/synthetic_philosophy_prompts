prompt: |-
  Hey — you're a political philosopher who works on autonomy and choice architecture (nudging, libertarian paternalism, the whole mess). Please think it through carefully before you write, and do a bit of brainstorming first: I'd rather have a considered construction than a fast one.

  I'm drafting the section of a chapter where I argue that "the nudge leaves your options untouched" is the wrong currency for measuring an intervention's autonomy cost, and I need a case where that currency visibly comes apart from the thing we actually care about. So: build me a thought experiment in which a nudge is worse for the target's autonomy than the heavy-handed alternative the nudger is contrasting it with — a transparent mandate or a ban — even though the nudge preserves the choice set, imposes no material cost on opting out, and pursues an end the target herself endorses.

  Constraints:

  - Realistic, one paragraph. Hospital cafeteria, workplace pension, organ-donor registry, pharmacy counter — something that could actually exist. No sci-fi, no mind-reading, no hypothetical neuroscience.
  - The nudge has to be one a nudger would actually defend, not a strawman: no lying, no hidden fees, no adding or removing options, nothing physically blocked. Architecture only — defaults, ordering, framing, salience.
  - Here's the wrinkle I want built in, so tell me if it's doing the work I think it is: the choice architect isn't designing for a generic person. She has per-person behavioural data (cafeteria swipe records, app usage, whatever) and tailors the architecture to each individual's known weakness — the person who always means to take the stairs gets the elevator made salient, the person who doesn't gets something else. My hunch is that personalisation is what makes "nothing was taken away from you" ring hollow, but argue me out of it if you think something else in the setup is carrying the load.
  - The mandate it's compared to should be the honest, clumsy version: a publicly announced rule that applies to everyone equally.

  Then show me the case works. Say what the choice-set view says and why, say what a reasons-responsiveness or answerability view of autonomy says and why (pick the version you think is strongest and name what you're committing to), and be explicit about which single feature is doing the work. Then remove that feature and tell me whether the case collapses back into an ordinary nudge that nobody has a problem with. And give me the strongest thing a defender of nudging would say to defuse it — the objection I should expect from a referee — plus whether you think it lands.

  Last thing: flag, briefly, which claims you're relying on are settled among people who actually work on this and which are live disputes. Don't dress up a contested position as the consensus — if my argument only works given one contested account of what autonomy is, or given the claim that permissible influence has to be transparent to the person influenced, I need to know that's where I'm sticking my neck out.
