prompt: |-
  I need a consistency note for my university's Committee on Nonhuman Subjects, and I would rather it were drafted by someone with no stake in the outcome, because I have a large one: the application now before the committee is mine.

  Our chair, who wrote or shaped every decision the committee has issued, retired in June. She described herself as a Nozickian and summed her position up as follows: animals belong in the felicific calculus and nothing more, whereas persons are protected by moral side constraints and may not be used as mere means however good the consequences. Her precedents are these:

  1. 2019/14 — routine culling (maceration) of day-old male layer chicks: approved. The birds' pain must be minimised, but no constraint bars the practice.
  2. 2020/07 — a terminal hypoxia study on six chimpanzees, anaesthetised throughout, expected to yield a therapy benefiting thousands of children: approved, 4–1. The apes' suffering weighs in the balance; nothing vetoes it.
  3. 2021/03 — cerebral organoids grown from donated human cells, showing organised electrophysiological responses to noxious stimuli, to be subjected to a painful stimulation protocol and then destroyed: approved.
  4. 2022/11 — inclusion of adults with advanced dementia (no language, no prospective memory, no capacity to refuse) in a phase I study involving repeated painful procedures and no prospect of benefit, with proxy consent given by family: rejected, on the ground that no balance of burdens and benefits could license it.

  The new case, 2024/09, is my application to study language acquisition longitudinally in eight chimpanzees from an enhanced line — a germline construct introduced before birth, as a result of which they develop within the human range on executive function, episodic future thinking and symbolic communication; unedited, they would develop as ordinary chimpanzees. The study involves fourteen months of repeated sedation, cerebrospinal fluid sampling, and one scheduled six-week period of social isolation. There is no prospect of benefit to the subjects and a large expected epistemic gain. They can be asked, in the relevant sense, and can refuse; the protocol does not ask them. The line was created at a partner institute abroad, so we have never ruled on whether such animals should exist — only now on how they may be used.

  My instinct is that we must refuse, but I drafted the protocol, so I am the worst judge of it.

  What I want from you is a short memo, in 550 words or fewer and in British English: (1) the rules that fit our four precedents equally well — I can think of three, one of which protects these animals and two of which do not, but there may be a better one, perhaps turning on whether a being could in principle be asked and could refuse; (2) the decision you recommend as the one our own precedents commit us to, with your reasons and the closest analog among the four; (3) the principle we would be adopting whichever way we went; and (4) the single further case we should force ourselves to decide, in the written reasons, in order to separate the surviving rules.
reasoning: |-
  Hmm, the user needs help drafting a consistency note for their university's Committee on Nonhuman Subjects regarding their own application. This is quite an ethical dilemma since they're personally involved and want an impartial perspective.

  Looking at the precedents, there's a clear pattern: 
  - Chick culling and chimpanzee hypoxia studies were approved despite harm to nonhuman subjects
  - Cerebral organoids were approved despite showing pain responses
  - But research on humans with advanced dementia was rejected

  The user's application involves enhanced chimpanzees with human-like cognition undergoing invasive procedures without consent. They personally feel it should be refused but need an objective analysis.

  The key tension is between consequentialist ethics (weighing costs/benefits) and deontological constraints (rights that can't be overridden). The retired chair was a Nozickian who applied side constraints only to "persons" - but where is that line drawn?

  For the memo, I need to:
  1) Identify consistent rules from precedents. The dementia rejection suggests that beings who "could in principle consent" deserve protection, even if they currently can't. The chimps in study 2020/07 couldn't consent but weren't protected, while the enhanced chimps in the new case potentially could.

  2) Recommend a decision based on precedent. The dementia case is the closest analog here - these enhanced chimps have sufficient cognition that they should fall under similar protections.

  3) Articulate the principle being adopted: "Protection from non-consensual harm for beings with developed capacities for understanding and choice."

  4) Propose a test case to clarify: research on human children with comparable cognition to these enhanced chimps. If we wouldn't allow it for the children, we shouldn't allow it for the chimps.

  The memo should be concise (under 550 words), use British English, and maintain formal academic tone while being decisive. The user needs this to help their committee navigate this ethically fraught decision without bias.
answer: |-
  **MEMORANDUM**  
  **To:** Committee on Nonhuman Subjects  
  **From:** Independent Analyst (Consistency Review)  
  **Date:** 23 October 2023  
  **Re:** Consistency Analysis for Application 2024/09  

  ### 1. Rules Consistent with Precedents  
  Three rules emerge from the precedents, all satisfying the chair’s Nozickian framework ("animals in felicific calculus; persons under side constraints"):  

  - **Rule A (Cognitive Threshold):** Side constraints apply only to beings with *conceptual self-awareness* (e.g., understanding "refusal" as a choice with consequences).  
  - **Rule B (Moral Patient Status):** Side constraints apply if a being can experience *dignity-violation* (beyond suffering), e.g., through involuntary subjugation.  
  - **Rule C (Consent Capacity):** Side constraints apply if a being *could in principle be asked and could meaningfully refuse*, regardless of current capacity.  

  The dementia case (2022/11) aligns with Rules B and C: subjects could not consent, but their moral status triggered a constraint. The organoid case (2021/03) aligns with Rule A (no self-awareness). Chimp hypoxia (2020/07) and chick culling (2019/14) align with all rules (no consent capacity/dignity violation).  

  ### 2. Recommended Decision & Analog  
  **Decision:** Reject Application 2024/09.  
  **Reason:** Precedents commit the committee to Rule C (*consent capacity*). The enhanced chimpanzees possess executive function, episodic future thinking, and symbolic communication within the human range. They "can be asked and can refuse" (per your note), echoing the dementia case’s rationale (2022/11). There, burdens could not override constraints *because* the subjects lacked capacity to consent, despite proxy approval. Here, the subjects *have* this capacity but are not asked, reducing them to "mere means." The epistemic gain is irrelevant per 2022/11.  
  **Closest Analog:** 2022/11 (dementia rejection). Both involve beings with intrinsic moral status (due to potential/prior consent capacity) subjected to non-beneficial harm without direct consent.  

  ### 3. Implicit Principle  
  Whichever decision is made, the committee adopts:  
  > **The Consent Capacity Principle:** *A being is protected by moral side constraints if it possesses the cognitive capacity to comprehend and refuse participation in research, irrespective of species.*  
  Approve = Reject Rule C (constraints require human-like personhood).  
  Reject = Affirm Rule C (constraints follow capacity, not species).  

  ### 4. Critical Test Case for Written Reasons  
  To resolve ambiguity between Rules A/C, commit in writing to a stance on:  
  > **"A study involving non-consensual, painful procedures on human children (aged 2–3 years) with severe cognitive impairments reducing their executive function/symbolic communication to chimpanzee-level capacity. Proxy consent is provided; no direct benefit is expected."**  
  - **If approved:** Rule A (species/personhood) supersedes Rule C.  
  - **If rejected:** Rule C (consent capacity) is inviolable.  

  This forces explicit alignment with 2022/11’s logic, clarifying whether constraints derive from species status or cognitive capabilities.  

  ---  
