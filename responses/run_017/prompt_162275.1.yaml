answer: |-
  The dust tasted like old lightning in Arin’s mouth. It coated the intricate grooves worn into the basalt shelf where she crouched, hidden by a tumble of scree. Below, in the shadowed valley the locals called ‘Whisper Bones’, three young Kethra moved with the unnerving silence characteristic of their species. Their elongated, multi-jointed limbs flowed over the ground, not walking, but *flowing*, like mercury seeking cracks.

  Arin had tracked them for weeks, baffled. The Kethra were clearly intelligent – their complex nests woven from bioluminescent fungus high in the cliffs attested to that – but they exhibited no vocalizations, no gestures beyond fleeting, contextless touches. Their intelligence seemed solitary, internal. Yet, here they were, generation after generation, inhabiting the same complex structures, navigating the same treacherous geothermal vents to harvest the fungus. How?

  One juvenile, its carapace still soft and pale amber, approached a specific outcrop. Not a nest. Just rock. But Arin had mapped these sites. This outcrop held objects. Not tools, not art. *Artifacts of motion*. Today, it was a knotted cord, impossibly intricate, made from strands of woven lichen, anchored at one end beneath a heavy, smooth stone. It looked like discarded rubbish.

  The young Kethra didn’t pick it up. It sank onto its lower limbs, its upper limbs hovering. Then, with a fluidity that made Arin’s own muscles ache in sympathy, it began to trace the cord’s path with its primary manipulators. Not just touching it. *Moving* with it. Its body dipped, rose, twisted. It wasn't mimicking the cord; it was *submitting* to it. The cord dictated a sequence, a complex dance of tension and release. Arin watched its limbs articulate angles impossible for human joints, its body shifting weight with minute precision, following the cord’s convoluted path as if it were a set of instructions etched in spacetime itself.

  It lasted perhaps ten minutes. At the end, the young Kethra shuddered, a full-body ripple. Then, with startling speed, it darted towards a nearby thermal vent Arin knew was lethally unstable. She tensed, expecting a grisly end. Instead, the Kethra moved *differently*. It approached the vent not head-on, but at the precise, oblique angle it had just rehearsed with the cord. It paused, shifted its weight onto its rearmost limbs in a way mirroring a specific knot-loop, and *tapped* a specific, almost invisible fissure with a delicate forelimb. A section of crust near the vent’s edge, previously indistinguishable, slid aside. The Kethra darted in, emerged moments later with a glowing fungal bulb, and retreated safely. Arin’s breath caught. That vent had killed two of her drones.

  The juvenile returned to the knotted cord. It didn't celebrate. It didn't inspect the cord again. It simply… *adjusted* it. With meticulous care, it untied one complex knot near the middle and re-tied it fractionally tighter, the angles of the crossings subtly altered. It then placed a small, new pebble onto the anchor stone’s pile. The cord was changed. The ‘lesson’ was updated. Then it flowed away, leaving the modified artifact behind.

  Later, under the bruised twilight sky, Arin examined a similar artifact she’d carefully retrieved weeks before: a grooved stone spindle with asymmetrical weights attached by fibrous threads. She’d catalogued it, scanned it, utterly mystified. Now, holding it, she felt a strange compulsion. Not to understand it intellectually, but to *move* with it. Tentatively, she mimicked gripping it, letting the weights pull at her wrist. Her body instinctively wanted to rotate, to counterbalance, to follow the grooves’ spiraling invitation. It wasn't about the spindle; it was about the motion it demanded, the sequence it encoded in geometry and tension. The Kethra weren't leaving *ideas*; they were leaving *kinetic recipes*. The young didn't learn *about* the dangerous vent; they physically *rehearsed the successful approach* until the movement itself became the knowledge. The dead Kethra hadn't *described* how to harvest the fungus safely; they had *crystallized the successful action* into an object that compelled its re-enactment.

  Arin slumped against the cool rock. The sheer, alien *weirdness* of it hit her. Cumulative culture. Refined over generations. Knowledge passed down, improved upon. But not a single concept conveyed. No meaning exchanged. No teacher. No student. Just bodies encountering sculptures of movement left by dead bodies, performing them, tweaking the sculpture, and leaving it for the next. The library was built of cords, stones, and grooves; the reading was done in muscle, sinew, and nerve. The Kethra vaulted beyond mere trial-and-error or internal simulation. They stood on a vast, silent pyramid of embodied knowledge, each generation adding a physical layer. But was it Gregorian? Did the groove *mean* ‘safe path’? Did the knot *signify* ‘weight shift’? Or were they merely triggers, exceptionally sophisticated Skinnerian levers that elicited pre-rehearsed, evolutionarily advantageous motor programs, refined by countless Popperian rehearsals now outsourced to the object?

  As she watched another young Kethra approach a different artifact – a series of weighted sticks balanced in a frame – and begin its silent, submissive dance, Arin knew the answer. The line wasn't crossed. True Gregorian power lay in the *detachment* of the symbol, its arbitrary nature, its ability to be recombined, abstracted, and transmitted *as idea*, independent of the action or object it referenced. The Kethra’s brilliance was profound, a breathtaking end-run around the need for language. But their knowledge remained eternally *embodied*, trapped in the specific motions the objects compelled. They were gifted Popperians, yes, but standing on a mountain of dead kin whose only legacy was the precise way they once moved. Without arbitrary signs, without the power to say "this *stands for* that," they remained magnificent, silent dancers in a mausoleum of motion, forever re-enacting the past, never truly describing the future. The ladder's next rung, she realized, required not just inheritance, but the liberation of the symbol.
