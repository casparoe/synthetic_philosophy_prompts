answer: |-
  ## Fragility Assurance Underwriting Handbook (Version 7.3.β)

  **1. Scope of Assurance:** Fragility Assurance Corporation™ (FAC) provides indemnification against the metaphysical diminution in value arising solely from the *possession* of a dispositional property ("the Disposition"), specifically fragility, as defined herein. FAC explicitly disclaims liability for physical breakage, shattering, or any resultant material loss. We insure the *potential*, not the *event*.

  **2. Definition of Covered Disposition (Fragility):** A Covered Object possesses fragility iff, under Standard Test Conditions (Clause 3), said object *would* break upon being struck with sufficient force. "Would" denotes a non-vacuous counterfactual conditional evaluated at the policy inception date.

  **3. Standard Test Conditions (STC):** STC comprise the hypothetical striking of the Covered Object with a force ≥ F_min (see Schedule Γ), absent any external intervention or alteration to the object's intrinsic state occurring *during* the striking event itself. Environmental conditions are defined as "benign" (see Appendix Δ: Benignity Parameters).

  **4. Exclusion: Dispositional Collapse Events (Finks):** No claim shall be valid if, at the precise temporal coordinate of a potential striking event satisfying STC, the Covered Object undergoes an intrinsic alteration such that its fragility ceases to obtain *simultaneously* with the application of sufficient force. (Example: Guardian Angel Device™ activation nullifying molecular bonding weakness coincident with impact). This constitutes a *Dispositional Collapse Event* (DCE), rendering the fragility non-manifestable *at that instant*, irrespective of its prior status. Premiums paid during periods of DCE vulnerability are non-refundable.

  **5. Exclusion: Persistent Outcome Prevention (Masks):** No claim shall arise from the failure of a fragile object to break under STC if said failure is solely attributable to an extrinsic, persistent, and non-disposition-altering impediment present *prior* to and *during* the striking event. (Example: Indestructi-Foam™ encasement absorbing impact forces). This *Persistent Outcome Prevention* (POP) blocks manifestation but does not negate the underlying Disposition. FAC reserves the right to demand proof of POP removal potential (see Clause 6).

  **6. Requirement for Manifestability:** Coverage is contingent upon the Covered Object's fragility being *manifestable* under STC. Manifestability requires the absence of relevant POPs *and* the absence of mechanisms capable of inducing a DCE *at the relevant time*. The phrase "relevant POPs" refers to any extrinsic factor that would, if present, prevent breakage under STC *without* inducing a DCE. (Note: The determination of "relevant POPs" relies on dispositional properties of the preventative factor itself, e.g., "shock-absorbency." FAC acknowledges potential explanatory regress; underwriting relies on best available metaphysical modelling per Departmental Protocols).

  **7. Exclusion: Permanently Untriggerable Dispositions:** Objects whose fragility, while ontologically present, exists under conditions of *permanent and immutable* POP such that no conceivable STC-satisfying striking event *could* occur (e.g., Vase permanently fused within a singularity containment field since manufacture), are deemed *Permanently Untriggerable*. Premiums are assessed at the "Theoretical Only" rate (Schedule Γ), reflecting the non-contingent nature of the Disposition. Claims are inadmissible due to non-falsifiability under operational parameters.

  **8. Exclusion: Mimics & Reverse Finks:** No coverage extends to objects lacking fragility that nevertheless break upon being struck due solely to an intrinsic alteration occurring *simultaneously* with the striking event, granting a *transient* disposition to break (Reverse DCE/Mimic). Coverage also excludes objects rendered fragile *only* upon the initiation of a striking event via extrinsic intervention (Induced Disposition Event). FAC insures *standing* dispositions, not transient spikes or induced states.

  **9. Underwriting Disputes & Departmental Protocols:**
      *   **9.1 Powers Division (PD):** Asserts primacy of dispositional ontology. Underwrites based on holistic object powers, emergent properties, and counterfactual robustness across possible worlds. Favours broad manifestability interpretations (Clause 6).
      *   **9.2 Microstructure Compliance (MCD):** Demands reduction of all dispositions to categorical base properties (molecular arrangement, lattice structure). Seeks to rewrite policies solely in terms of microstructure descriptors and probabilistic state transitions. Considers PD's "powers" actuarially unsound mysticism.
      *   **9.3 Resolution:** All disputed risks require dual assessment. Premiums reflect the higher risk score generated by either PD or MCD methodologies, plus a 15% Metaphysical Reconciliation Surcharge. Endorsement Form META-RECON must be signed by the policyholder, acknowledging fundamental ontological uncertainty.

  **10. Claims Adjudication:** The FAC Claims Department assesses claims based on evidence demonstrating the *prior existence* of a valid Covered Disposition (fragility) that was *manifestable* (per Clause 6) at the time of policy lapse or dispute.
      *   **10.1 Critical Limitation:** Direct empirical verification of fragility *requires* its manifestation (i.e., breakage). A successfully manifested fragility renders the Covered Object valueless, eliminating the insured metaphysical property *and* any physical basis for assessment. An unmanifested fragility remains empirically unverifiable under STC post-facto.
      *   **10.2 Adjudication Standard:** Claims are adjudicated based on pre-event documentation, theoretical modelling (PD or MCD), and probabilistic counterfactual analysis. Crucially, **FAC Claims possesses no operational capacity to empirically distinguish between a genuine DCE (Fink) and a POP (Mask) in any specific case of non-breakage.** Denial letters will cite either Clause 4, 5, or 7 based on preponderance of theoretical evidence and departmental bias of the assigned adjuster.

  **11. Premium Schedule (Schedule Γ - Excerpt):**
      *   Base Rate (Manifestable Fragility, Low POP/DCE risk): 2.5% of Agreed Metaphysical Value (AMV) p.a.
      *   Theoretical Only Rate (Permanently Untriggerable): 0.1% of AMV p.a.
      *   DCE Susceptibility Surcharge (Guardian devices, unstable substrates): +0.5% to 5.0% of Base Rate.
      *   POP Complexity Surcharge (Multiple layers, interdependent blockers): +0.25% per identified POP factor.
      *   MCD-PD Dispute Surcharge: +15% of highest calculated premium.
      *   Counterfactual Density Adjustment: Premiums scaled by the number and closeness of "nearby" possible worlds where breakage *would* occur under STC. (Calculated via proprietary Modal Proximity Index™).

  **12. Chief Actuary for Metaphysical Risk Commentary:** "Our models constantly grapple with the ontological precarity of unmanifested powers. Quantifying the probability of a counterfactual – especially one inherently vulnerable to intrinsic or extrinsic interference – pushes actuarial science to its limits. We rely heavily on the Principle of Dispositional Continuity, assuming powers persist absent evidence of DCEs, but the spectre of ubiquitous, undetectable masks haunts our spreadsheets. The permanently packed vase? A actuarial black hole; we price it like insuring the grin of the Cheshire Cat. Ultimately, our solvency relies on the empirical inaccessibility of the very property we insure. It’s not a bug; it’s the cornerstone of our business model." - *Agnes Finch, FCAS (Fellow of the Casualty Actuarial Society), CMARM (Certified Metaphysical Actuarial Risk Manager)*

  **13. Non-Verifiability Acknowledgment:** The Policyholder expressly acknowledges that FAC's obligation pertains to an empirically elusive metaphysical state. Payment of premiums constitutes agreement that FAC's determination of coverage validity, based on theoretical frameworks and available indirect evidence regarding DCEs, POPs, and manifestability, is final and binding, irrespective of the fundamental epistemological limitations outlined in Clause 10.1 and 10.2.

  **Fragility Assurance Corporation™: Securing the Unseen since [Current Year - 5].**
