answer: |-
  Below is a decision tree handout designed to help students clarify their position on "utility" by navigating concrete cases. The tree starts from an uncontroversial claim (choices provide *some* evidence about wants) and branches through 8 nodes (7 branch questions) to 10 distinct leaves (named positions). Each node is a specific case or claim about a case, avoiding abstract labels. Required cases are integrated, and the menu-anchored vs. menu-free distinction is explicitly addressed at Node 6. Leaves are mapped to the logical space of answers, with incoherent/unattractive combinations noted.  

  **Key Terms (Glossed):**  
  - **Utility:** A number representing strength of preference or welfare.  
  - **Menu-anchored:** Utility only meaningful for a specific set of options.  
  - **Menu-free:** Utility sticks across different sets of options.  
  - **Welfare:** Well-being (distinct from choice).  
  - **Revealed preference:** Preference inferred from observed choices.  

  ---

  ### **Decision Tree: What Do You Mean by "Utility"?**  
  *Start here: Actual choices are at least **some** evidence about what a person wants (e.g., Nia always picks an apple when both apple and banana are available; when only apples are there, she takes one → evidence she prefers apples).*

  1. **Marcus Case:** Marcus refuses tap water due to false contamination belief (it’s safe; he’d drink it if informed). Does his choice *still* reveal his "true" preference?  
     - **Yes** (Choices reveal preference regardless of beliefs) → Go to Node 3.  
     - **No** (Choices require belief-correction to reveal preference) → Go to Node 2.  

  2. **Belief Correction Case:** To infer Marcus’s preference, we must first:  
     - **Use choice data only** (e.g., he avoids other "contaminated" items; patterns refute utility ascriptions) → Go to Node 4.  
     - **Use external data** (e.g., surveys on beliefs; choices alone aren’t enough) → Leaf 1: **Belief-Disentangled Utility**.  
       *Statement: Utility represents preferences only after filtering out belief distortions.*  
       *Swallow: Requires independent belief measurement; not possible from choices alone.*  

  3. **Thea Case:** Thea sincerely doesn’t want X due to socialization (e.g., "people like me don’t do X"). Is her lack of desire for X a "true" preference?  
     - **Yes** (Preferences are as they are, even if socially shaped) → Go to Node 5.  
     - **No** (Preferences require socialization-correction) → Leaf 2: **Informed Preference-Satisfaction Welfarism**.  
       *Statement: Welfare is satisfying preferences one would have with full information/autonomy.*  
       *Swallow: Defining "full information/autonomy" is circular or subjective.*  

  4. **Integrability Case:** Nia’s choices show cycles (e.g., apple > banana > cherry > apple on different days). Does this refute utility ascriptions?  
     - **Yes** (Utility must be logically consistent with choices) → Leaf 3: **Refutable Revealed Preference**.  
       *Statement: Utility is a choice-consistent construct; intransitive choices falsify it.*  
       *Swallow: People may have unstable preferences, making utility useless.*  
     - **No** (Utility can ignore minor inconsistencies) → Leaf 4: **"As If" Instrumentalism**.  
       *Statement: Utility is a predictive tool; it doesn’t claim truth, only "as if" behavior.*  
       *Swallow: Utility may predict poorly and has no welfare meaning.*  

  5. **Amara Case:** Amara votes for a costly levy that helps her neighbor. Does this choice reveal her *own welfare*?  
     - **Yes** (Altruism is part of welfare) → Go to Node 6.  
     - **No** (Welfare is self-interested; choice includes morals) → Go to Node 7.  

  6. **Menu Dependence Case:** In a choice set {apple, banana}, Nia’s apple utility is 3. When {apple, orange} is offered, she picks orange. Does apple’s utility change?  
     - **Yes** (Utility is menu-anchored) → Leaf 5: **Strict Behaviorist Revealed Preference**.  
       *Statement: Utility is a numerical summary of choice dispositions; no deeper meaning.*  
       *Swallow: Marcus’s choices reveal his "preference" for contaminated water.*  
     - **No** (Utility is menu-free) → Go to Node 8.  

  7. **Willingness-to-Pay Case:** A rich and poor patient both need the same painkiller. The rich would pay more. Does this mean the painkiller gives *more utility* to the rich?  
     - **Yes** (Utility scales with willingness-to-pay) → Leaf 6: **Money-Metric Welfarism**.  
       *Statement: Welfare is measured by what one pays for goods.*  
       *Swallow: Values the rich more for identical goods/needs.*  
     - **No** (Utility is need-based, not money-based) → Leaf 7: **Experienced-Utility Welfarism**.  
       *Statement: Welfare is about subjective experiences (e.g., pain relief); choices may mislead.*  
       *Swallow: Experiences are hard to measure; choices become irrelevant.*  

  8. **Administrator Case:** An administrator *only* has choice records. Can they rank how well off people are?  
     - **Yes** (Choice data reveals welfare) → Leaf 8: **Raw Preference-Satisfaction Welfarism**.  
       *Statement: Welfare is satisfying actual preferences, revealed by choices.*  
       *Swallow: Thea’s socialization means her deprivation improves her welfare.*  
     - **No** (Welfare isn’t in choices) → Leaf 9: **Capabilities/Objective List**.  
       *Statement: Welfare is about freedoms (capabilities) or objective goods (e.g., health), not utility.*  
       *Swallow: Must define a "good life" without choice data.*  
     - **It’s flawed but the best we have** → Leaf 10: **Pragmatic Instrumentalism**.  
       *Statement: Use utility for policy when data is scarce, but distrust it.*  
       *Swallow: Risks enshrining biases (e.g., Thea’s case).*  

  ---

  ### **Logical Space & Unclaimed Positions**  
  - **Coherent combinations covered:** The tree maps all 10 leaves to the answer space. Empty cells (e.g., "Menu-free + Strict Behaviorist") are incoherent—behaviorism requires menu-anchoring.  
  - **Unseparated leaves:**  
    - **Refutable Revealed Preference (Leaf 3)** and **"As If" Instrumentalism (Leaf 4)** aren’t split on welfare claims → *Use a new case:* "If choices are consistent, does utility describe welfare?" (Yes → Leaf 3; No → Leaf 4).  
    - **Experienced-Utility (Leaf 7)** and **Capabilities (Leaf 9)** aren’t split on adaptive preferences → *Use a new case:* "If Thea feels happy without X, is she well off?" (Yes → Leaf 7; No → Leaf 9).  
  - **Unattractive/unclaimed positions:** E.g., "Menu-free + Belief-Disentangled" is unclaimed—menu-free utility assumes beliefs are already correct.  

  ---

  ### **How to Run This in Class**  
  **Spend 10–12 minutes** having students trace their path independently using the handout, then **3–5 minutes** in small groups comparing nodes (not leaves). Emphasize: "This isn’t about defending your leaf—it’s about seeing where your intuitions *diverge* from others’ on cases." Regroup to discuss 1–2 nodes where the room split (e.g., Marcus or Thea), using them to surface hidden assumptions before introducing readings.
