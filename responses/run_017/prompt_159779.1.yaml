prompt: |-
  I am revising a chapter of my dissertation on the varieties of free will worth wanting, and before I commit to the argument I have been developing, I would like to know whether compatibilists have a reply to it that does not simply amount to changing the subject.

  The chapter tries to make "worth wanting" tractable without tying it to any single one of our practices. Let the modal spread of a decision at t be the proportion of the nearest possible worlds — those whose total prior state differs from the actual one only minimally — in which the agent decides otherwise. My proposal is that the free will worth wanting is, at bottom, non-trivial modal spread combined with sensitivity to reasons, and hence that spread behaves like a scalar: the more of it an agent's decision involves, other things being equal, the freer she is.

  If that is right, the case against compatibilism looks short. On any reasons-responsive compatibilist model, the agent's deliberative process issues in one determinate decision given the whole prior state of the world, so her spread is nil, and her deliberation therefore makes no difference to what she does — it merely redescribes an outcome that was already fixed. Compatibilists would then be in the position of securing only the deliberative variety of free will while conceding the variety that does the real work in grounding desert, which is the one I care about.

  I have a refinement for the standard objection. Mere neural noise raises spread but delivers nothing anyone wants, so I stipulate that the spread must be generated inside the agent's own reason-forming mechanism rather than in its peripheral implementation: the alternatives must open up because she is weighing considerations, not because her motor system is jittery.

  My question is whether that refinement makes the argument sound, and in particular whether the monotonic step holds: if I locate indeterminacy properly, inside reason-formation, do I thereby get strictly more of the variety that grounds desert than any compatibilist model delivers — more spread, more freedom, more desert — or does adding agential indeterminacy fail to increase that quantity, or even diminish it? I set aside exotic cases in which deterministic chaos lets arbitrarily small differences amplify into different decisions, since spread of that kind is not agential in the relevant sense.
reasoning: |-
  Okay, let me unpack this user's argument carefully. They're developing a dissertation chapter on free will worth wanting, proposing a metric called "modal spread" - essentially how many nearby possible worlds contain different decisions from the actual one. Their core claim is that compatibilism fails because deterministic decision-making always has zero modal spread.

  Hmm, the user seems deeply familiar with the philosophical landscape. Their refinement about locating indeterminacy "inside reason-formation" shows they've anticipated standard compatibilist responses. I notice they're particularly concerned about desert-based moral responsibility - that's their driving interest.

  The key question is whether their refinement actually secures the conclusion. Let me examine possible compatibilist countermoves:

  First, the "redescription" charge feels vulnerable. If determinism means the outcome was fixed regardless of deliberation, does that really undermine agency? Frankfurt-style cases suggest otherwise - an agent can be responsible even if alternative possibilities were blocked. But the user might counter that PAP isn't their focus here.

  More crucially, their "reason-forming indeterminacy" requirement creates tension. If the branching happens precisely where reasons are weighed, doesn't that make the decision partially random rather than reason-responsive? This could actually diminish desert by severing the connection between reasons and outcomes. 

  The user dismisses chaotic amplification as non-agential, but what about compatibilist models where reasons sensitivity itself creates modal spread? Fischer's guidance control comes to mind - though his is a non-scaral approach. 

  I wonder if they're conflating two things: the metaphysical "oomph" needed for desert versus the actual conditions for blame/praise. Strawson's reactive attitudes might offer compatibilists shelter here. But the user specifically wants desert grounded in alternative possibilities.

  For the monotonicity claim: adding indeterminacy could backfire. If my decision randomly branches while I'm deliberating, is that really "more free" than a deterministic process tightly coupled to my reasons? It might feel like less control. 

  The user's position is sophisticated but precarious. Their best defense would be to argue that reason-sensitive indeterminacy preserves control while adding openness - but that's exactly what compatibilists will challenge. I should emphasize how their refinement creates new vulnerabilities even as it patches old ones.
answer: |-
  Your argument is sophisticated and strikes at a core tension in compatibilism, but compatibilists have substantive replies that engage directly with your framework—without merely changing the subject. Let's break this down step by step, focusing on whether your refinement (locating indeterminacy *within reason-formation*) secures the conclusion that compatibilism cannot deliver free will "worth wanting" for desert.

  ### Key Compatibilist Replies
  1. **The "Deliberation as Constitutive" Response**  
     Compatibilists (e.g., Fischer, Dennett, Wallace) argue that deliberation isn't a "redescription" of a fixed outcome—it **constitutively determines** the agent's reasons, values, and thus the action itself. In deterministic worlds, the agent’s psychology *is* the causal mechanism producing the decision. Your "nil spread" objection treats the *prior state* as ontologically privileged over the *process*, but compatibilists reject this: the agent’s reasons-responsive machinery *is* what fixes the outcome, making deliberation explanatorily primary. If the agent’s reasons are *their own* (via mechanisms like reasons-responsiveness or mesh theories), desert can still attach—even with zero modal spread—because the action flows from their evaluative stance.

  2. **Indeterminacy Undermines Desert-Relevant Control**  
     Your refinement requires indeterminacy *within* reason-formation to avoid "neural noise." But compatibilists argue this move **threatens control more than it enhances desert**. If alternative possibilities open up *mid-deliberation* (e.g., indeterminacy in how reasons are weighed), the final decision may partially result from random agential noise. This severs the tight link between the agent’s reasons and the outcome, making the action less truly *theirs* (e.g., Kane’s "dual efforts" problem). In contrast, determinism ensures that the outcome is *fully determined* by the agent’s own reason-appraisal process. For desert, we want the agent’s reasons to be the *sole determinant*—which indeterminacy actively undermines.  
     - *Your monotonicity claim* (more spread → more freedom/desert) fails here: adding indeterminacy to reason-formation risks *diminishing* desert by introducing luck.

  3. **Desert Doesn’t Require Alternative Possibilities (PAP)**  
     Most compatibilists reject the Principle of Alternative Possibilities (PAP) as necessary for desert. Frankfurt cases are the classic argument: an agent can be deserving of blame even if they couldn’t have done otherwise. What grounds desert is the action’s genesis in the agent’s own reasons-responsive mechanisms—not the existence of robust alternatives. If your "worth wanting" free will *requires* non-trivial spread, compatibilists will argue you’re stipulating a demand desert doesn’t actually have.

  4. **Spread as Epiphenomenal to Desert**  
     Even if we grant that some spread is desirable (e.g., for aesthetic "openness"), compatibilists can deny it’s relevant to *desert*. We praise/demand an agent based on whether their action reflects their reasons-sensitive character—not whether other choices were accessible. If an agent’s psychology deterministically issues in a cruel choice, they are blameworthy because the choice reveals their character. Adding spread (e.g., 30% chance of acting kindly due to indeterminacy) doesn’t deepen their desert—it just adds randomness.

  ### Does Your Refinement Save the Argument?
  **No—it introduces a new vulnerability.**  
  By tying spread to *reason-formation*, you avoid the "neural noise" problem but amplify the **control problem for desert**:  
  - In a compatibilist world: The agent’s decision is 100% determined by their own reasons-weighing process → strong grounding for desert.  
  - In your indeterministic world: The agent’s decision is (say) 70% determined by reasons-weighing and 30% by indeterministic noise in the same process → the outcome is partly lucky, weakening desert.  

  Your model might *increase* metaphysical openness but *decrease* agential control—precisely the feature desert requires. This reverses your monotonicity claim: maximal spread could imply *minimal* desert-grounding control.

  ### A Compatibilist-Friendly Adjustment
  To make your model compelling, you’d need to show that:  
  1. **Indeterminacy enhances, rather than diminishes, reasons-sensitivity**.  
     (e.g., by allowing genuine creativity in moral reasoning—but this is empirically and metaphysically contentious).  
  2. **Desert *essentially* requires alternative possibilities**.  
     (This requires defeating Frankfurt cases—a major hurdle).  

  ### Conclusion
  Your argument is a potent challenge, but compatibilists can rebut it on its own terms:  
  - They deny that nil spread reduces deliberation to "redescription," insisting it *constitutes* agency.  
  - They argue that adding indeterminacy to reason-formation *undermines* the control necessary for desert.  
  - They reject PAP as foundational for desert.  

  **Your refinement doesn’t secure the argument** because locating spread within reason-formation doesn’t guarantee increased desert—it risks replacing determinism’s "no freedom" problem with indeterminism’s "no control" problem. The debate thus remains at a stalemate between competing intuitions about control and openness.** 

  For your dissertation, consider engaging with "semi-compatibilist" positions (e.g., Fischer) that decouple desert from alternative possibilities entirely. This forces the argument to rest on whether *your* conception of "free will worth wanting" (with non-trivial spread) is the one we *should* care about—a normative, not metaphysical, claim.
