prompt: |-
  I'm writing a short discussion paper for a graduate seminar on formal epistemology, and I've got as far as noticing that my own reactions to the two standard paradoxes of aggregated belief don't add up to anything I can state. The setups are the familiar ones: a fair lottery with a thousand tickets and exactly one winner, where I am perfectly happy to believe of each ticket that it will lose and perfectly unwilling to believe that they all will; and a historian who has written two hundred assertions into a book, believes each of them, and adds in the preface that there are surely errors somewhere. I take the second to be not merely permissible but exemplary — the author who omits the preface strikes me as the worse epistemic citizen — while in the lottery I take no attitude toward the conjunction at all and feel no pressure to have one. The trouble is that nearly everything I want to say in one case has a counterpart in the other that I want to answer differently. Below are my verdicts, as honestly as I can report them; what I want from you is a principle.

  1. Lottery. I believe of ticket 47 that it loses; likewise for all thousand. I don't believe they all lose, and I don't think I'm criticizable for failing to. I'll bet against ticket 47 at slightly better than the fair odds, and against each of the others too; I won't sell you all thousand bets bundled, since that's a certain loss. But the bundling refusal doesn't, I think, show that I don't really believe each — it shows something about prudence, or so I want to say. 2. Preface. I believe each of the two hundred claims, I believe the hedge, I believe publishing the hedge is a virtue, and I'll act on any one of the claims — cite it, build an argument on it — without ceremony. 3. Small numbers. Same book, but with three claims plus the hedge: fine, though I'm noticeably less comfortable. Two claims, where the second one *is* the hedge ("at least one claim in this book is false"): not fine — believing both is inconsistent, and I withdraw my license to hedge. So the number of claims matters, and I can't say why or where the cutoff falls. 4. Located versus unlocated doubt. A referee believes each of twelve claims in a paper, believes that at least one is probably wrong, and recommends acceptance: fine. A referee who comes to believe that claim 7 specifically is wrong must say so and must not recommend acceptance unqualified. Asked "which one?", "I don't know" is an acceptable answer. But a referee who has localized the error only to the effect that it lies somewhere in chapter 3, which contains four claims, must flag chapter 3 — even though she still can't say which claim. 5. Fragmentation. A company knows that roughly two hundred of fifty thousand records were accessed in a breach. Sending fifty thousand separate letters each saying "your record was not accessed": not fine. Publishing one page that lists all fifty thousand names with "not accessed" beside each and the aggregate estimate visible at the top: fine, or much closer to fine. Sending the letters with the base rate stated in each: fine. Same content, different presentation, different verdict — which makes me suspect my verdict here isn't about belief at all. 6. Statistical versus evidence-specific support. In the lottery nothing distinguishes ticket 47 from ticket 812; my belief rests entirely on the base rate. In the preface my belief in claim 12 rests on evidence specific to claim 12 — I checked it, I remember the source. And I treat them differently: I'll build on claim 12, I won't build anything on "ticket 47 will lose," and I'd be embarrassed to cite the latter as a reason for anything. Is that principled, or a prejudice? If it is principled, then the lottery and the preface aren't the same animal, and the habit of treating them as one family is a mistake. 7. Conjunction and thresholds. Two independent claims, each about ninety percent credible: I believe the conjunction. Five: I think I still believe it. Ten, at about thirty-five percent: no. So there's a cutoff somewhere, but I feel no sharp one and my confidence doesn't feel numerical. Relatedly: I believe p, I believe that if p then q, and q might be only fifty percent likely. If I've actually drawn the inference I want to say I believe q; if it hasn't occurred to me, I want to say I'm under no requirement. Is "closure only for inferences actually drawn" a coherent position, and does it reach the conjunction cases or only the one-step ones?

  The best I've managed on my own is this: call a doubt *unlocated* when my evidence gives me no more reason to suspect one member of a set than any other. Then: (i) I may believe each member of a set while also believing that some member is false, exactly when my doubt is unlocated; (ii) unlocated doubt licenses acting on any single member but never on the conjunction; (iii) it licenses asserting members only to audiences who can also see the aggregate; (iv) where support is purely statistical I may believe each member but may not use any one of them as a premise, whereas where support is evidence-specific I may do both. This is built to fit 1, 2, 4 and 5, so I don't trust it. It says nothing about 3 or 7, and clause (iii) turns one of my verdicts into a matter of audience etiquette rather than of rationality, which I take as a sign that I've really got two principles stapled together.

  So: give me a principle, or a short list of candidates, stated precisely enough that I could apply it to a case you haven't been shown. For each clause, tell me which of my cases is doing the motivating work. Then tell me what it says about cases I haven't listed — a radiologist who reads two hundred scans a day and knows her own error rate, a judge who signs forty warrants a week while knowing that some small fraction of them are not properly supported, a labeller of ten thousand images who is ninety-nine percent accurate and ships the dataset with a documented error rate — and tell me plainly which of my verdicts above your principle cannot accommodate and which one you'd overturn. If my tentative principle is salvageable, repair it; if it's confused, say where. Please write in American English, and please don't give me a bibliography or a reading list — I have plenty of reading, and what I want is your own analysis.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're grappling with the paradoxes of aggregated belief—specifically the lottery and preface paradoxes—and their intuitive reactions to various scenarios. They've laid out their verdicts clearly across seven cases and have proposed a tentative principle centered on "unlocated doubt." But they feel it's ad hoc and want a more robust principle that can unify their intuitions.

  First, I need to break down each of their cases to identify the underlying patterns. In the lottery (1), they believe each ticket loses but not the conjunction, and they refuse bundled bets but see it as a prudent move rather than a belief issue. The preface (2) is different—they believe each claim and the hedge, and acting on individual claims is fine. Small numbers (3) show that the number of conjuncts matters; with two claims including the hedge, it's inconsistent. Located vs. unlocated doubt (4) emphasizes that unlocated doubt allows belief in each claim, but localized doubt requires flagging the specific area. Fragmentation (5) shows presentation matters: sending individual denial letters isn't okay, but aggregated statements are. Statistical vs. evidence-specific support (6) distinguishes between beliefs based on base rates versus specific evidence. Conjunction thresholds (7) involve confidence levels and actual inference drawing affecting belief in conjunctions.

  Their tentative principle uses "unlocated doubt," but it doesn't cover all cases, like small numbers or conjunction thresholds. Also, they worry that turning assertion into an audience etiquette issue (iii) is a red flag. So I need a principle that addresses all these aspects without being piecemeal.

  Looking at their cases, a few key factors emerge: the type of evidence (statistical vs. specific), the structure of doubt (located vs. unlocated), the role of presentation, and the practical context of acting on beliefs. The preface allows acting on individual beliefs because each has specific evidence, while the lottery doesn't. The radiologist, judge, and labeller cases will test how the principle applies to real-world scenarios where statistical knowledge meets individual judgments.

  The core might be distinguishing between token-level and type-level beliefs. Statistical support (lottery) gives type-level justification, so you can't build arguments on individual tokens. Evidence-specific support (preface) allows token-level beliefs that are actionable. Unlocated doubt permits believing each token while acknowledging some are false, as long as the doubt isn't localized. Presentation affects whether the aggregate risk is communicated, which is crucial for ethical action.

  For the small numbers case, the principle must explain why a few conjuncts with unlocated doubt are still acceptable but become problematic as numbers decrease. Maybe with fewer claims, the probability of error per claim increases, making the doubt less "unlocated" in a practical sense. Or perhaps there's a threshold where the conjunction's probability drops too low, but the user feels it's not numerical. Their discomfort with two claims where one is the hedge suggests that inconsistency overrides unlocated doubt when the set is small.

  Conjunction thresholds (case 7) involve confidence levels and actual inference. If closure only applies when inferences are drawn, that might handle the preface but not the lottery. But in the preface, even without drawing the conjunction, they believe each claim. So maybe belief isn't closed under conjunction when doubt is unlocated, but drawing the inference forces confrontation with the contradiction.

  The radiologist case: if she knows her error rate but not which scans are wrong, unlocated doubt applies. She can act on individual diagnoses if each has specific evidence, but must communicate the aggregate uncertainty. The judge signing warrants with statistical error rates—similar to lottery, so shouldn't act on individual warrants without specific evidence. The labeller documenting error rates is fine if aggregated.

  Now, conflicts: Case 3 (small numbers with hedge) is tricky. With two claims, one being the hedge, it's inconsistent. The principle must disallow that. In case 6, statistical vs. specific evidence distinguishes lottery and preface, so they're not the same, which resolves part of the user's struggle. Case 5 (fragmentation) is about presentation ensuring aggregate risk is visible, so it's about responsible assertion, not belief per se.

  Repairing their principle: Keep (i) and (ii) but refine. Add that statistical support alone doesn't justify token-level actionable beliefs. Modify (iii) to focus on transparency in assertion. Add a clause about the role of specific evidence for premise use. Address small numbers by noting that when the set is small, unlocated doubt may not apply because the probability per item is higher, or inconsistency becomes salient. For conjunction thresholds, maybe belief requires sufficient credence, but it's fuzzy; actual inference drawing triggers commitment.

  Final principle: Belief licensing depends on (a) type of support (specific vs. statistical), (b) doubt location, and (c) context of use. Unlocated doubt allows conjunctive belief but restricts actionable use to transparent contexts. Statistical beliefs aren't premises; specific ones are. Small sets force localization or inconsistency. Conjunctions' believability depends on credence thresholds and practical context.
answer: |-
  Here's a principled framework distilled from your intuitions, designed to resolve the tension between your reactions to the lottery and preface cases while addressing your other scenarios. The core insight is that **belief is licensed not just by probability, but by the structure of justificatory support and the context of action.** I'll state the principle, unpack its components using your cases, then test it against unlisted scenarios and your verdicts.

  ### The Principle: Justificatory Independence & Action Context
  **A.** **Token-Specific Justification Requirement:**  
  You are rationally permitted to believe a proposition *P* (and use it as a premise) only if your justification for *P* is *token-specific*—i.e., grounded in evidence or reasons that directly bear on *P* itself, not solely on its membership in a reference class.  

  **B.** **Aggregate Transparency Constraint:**  
  When you believe each member of a set *S* = {P₁, P₂, ..., Pₙ} but acknowledge that *at least one is false* (due to unlocated doubt):  
  - You may act on any single *Pᵢ* if (i) *Pᵢ* satisfies (A), and (ii) the aggregate risk (i.e., the probability that *some* Pᵢ is false) is transparent to all relevant agents in the context of action.  
  - You may not act on the conjunction of all *Pᵢ* (e.g., treat them as jointly true for practical purposes).  
  - Asserting any *Pᵢ* without disclosing the aggregate risk is permissible only if the audience can reasonably be expected to be aware of it.  

  **C.** **Unlocated Doubt Condition:**  
  "Doubt is unlocated" only when:  
  - The probability of error is approximately uniform across *S*;  
  - No evidence privileges one member over another as more/less likely false;  
  - The source of potential error is *systemic* (e.g., human fallibility, random chance) not localized to a subset.  

  ---

  ### How This Explains Your Verdicts
  1. **Lottery (Case 1):**  
     - Justification for "Ticket 47 loses" is purely statistical (base rate), failing (A). Thus, you *cannot rationally believe it* or use it as a premise—only assign high probability.  
     - Refusing the bundled bet reflects prudence, but refusing to bet *individually* isn’t required by (B) because (A) already blocks belief.  
     *Motivated by:* Statistical vs. evidence-specific support (Case 6).  

  2. **Preface (Case 2):**  
     - Each claim has token-specific evidence (e.g., archives for Claim 12), satisfying (A). You may believe and act on any single claim.  
     - The hedge ("some error exists") reflects systemic unlocated doubt (C), so (B) permits belief in individual claims *if* aggregate risk is transparent (e.g., via the preface).  
     *Motivated by:* Located vs. unlocated doubt (Case 4) and actionability (Case 2).  

  3. **Small Numbers (Case 3):**  
     - Three claims + hedge: (A) satisfied for each claim, (C) holds (doubt unlocated), (B) permits belief/action with transparent hedge.  
     - Two claims including hedge: Fails (C). The "doubt" is localized to the two claims—one *must* be false, so probability isn’t uniform. Believing both is inconsistent.  
     *Motivated by:* Your discomfort threshold; (C) requires non-trivial uncertainty distribution.  

  4. **Located vs. Unlocated (Case 4):**  
     - Referee with unlocated doubt (C satisfied): May recommend acceptance under (B), citing aggregate uncertainty.  
     - Localized error (e.g., Claim 7 or Chapter 3): Fails (C). Doubt is located, so (B) demands flagging the specific item/chapter. "I don’t know which" is insufficient; localization *is* justification.  
     *Motivated by:* Your intuition that unlocated doubt excuses non-specificity.  

  5. **Fragmentation (Case 5):**  
     - Individual letters: Violates (B). Audience (each customer) lacks transparency about aggregate risk.  
     - Public list + aggregate note: Satisfies (B) by making risk transparent.  
     - Letters with base rate: Satisfies (B) by embedding transparency per recipient.  
     *Motivated by:* Your verdict that presentation matters—it ensures (B)’s transparency.  

  6. **Statistical vs. Evidence-Specific (Case 6):**  
     - Lottery: Statistical support fails (A), so no belief/premise use.  
     - Preface: Evidence-specific support satisfies (A), permitting belief/premise use.  
     *Resolves:* The paradox dissolves—lottery and preface *are* distinct.  
     *Motivated by:* Your refusal to "build on" lottery propositions.  

  7. **Conjunctions & Thresholds (Case 7):**  
     - Conjunction belief depends on whether (A) is satisfied for the *conjunction itself*.  
       - Low-confidence conjunctions (e.g., 10 claims at 35%): Fail (A) unless specific evidence supports the *whole*.  
       - High-confidence conjunctions (e.g., 2 claims at 90%): May satisfy (A) if evidence supports the joint truth.  
     - Closure: You must believe *q* if you *actually infer it* from believed *p* and *if p then q*. But if the inference isn’t drawn, no obligation—belief isn’t "stored" for all logical consequences.  
     *Motivated by:* Your intuition that confidence isn’t purely numerical.  

  ---

  ### Application to Unlisted Cases  
  - **Radiologist (200 scans, knows error rate):**  
    - If justification per scan is token-specific (e.g., image analysis), (A) satisfied.  
    - Unlocated doubt (systemic error) satisfies (C).  
    - May diagnose per scan if aggregate error rate is documented/transparent (B), e.g., in the report header.  
    - **Verdict:** Exemplary (like preface).  

  - **Judge (40 warrants, knows some are unsupported):**  
    - Warrant justification *must* be token-specific (A) per case—statistical "fraud rate" alone fails (A).  
    - If doubt is unlocated (C), may sign warrants *only* if aggregate risk is transparent (e.g., public oversight).  
    - **Verdict:** Permissible under (B), but ethically iffier than preface—token-specificity is legally essential.  

  - **Image Labeller (10k images, 99% accuracy):**  
    - Labels lack token-specific justification if automated (fails A). Only probabilities apply.  
    - Shipping dataset with error rate satisfies (B) for transparency, but *not* for individual labels (A still violated).  
    - **Verdict:** Sending individual "not accessed" letters (Case 5) is analogous—unacceptable without token-specificity.  

  ---

  ### Critique of Your Tentative Principle  
  Your unlocated doubt framework is salvageable but needs amendments:  
  - **Repairs:**  
    - (i) **Keep**, but add (A): Belief requires token-specific justification.  
    - (ii) **Keep** as-is (action on single members ok, conjunction not).  
    - (iii) **Reframe:** Not "audience etiquette" but an *epistemic obligation* under (B)—assertion requires contextual transparency.  
    - (iv) **Drop:** Statistical support *never* licenses belief/premise use. Only (A) does.  
  - **What it Missed:**  
    - Token-specificity (A) as the lottery/preface differentiator (Case 6).  
    - How small sets collapse unlocated doubt (Case 3).  
    - Conjunctions needing their own justification (Case 7).  

  ### Conflicts with Your Verdicts  
  - **Overturns:** Your claim that in the lottery, you "believe ticket 47 loses." The principle denies this—statistical support justifies high credence, not belief.  
  - **Cannot Accommodate:** Your "bundled bets" intuition in the lottery. The principle says refusing individual bets is *not* required (since you don’t believe the propositions anyway). If you insist you "believe" each ticket loses, that conflicts with (A).  

  ### Final Word  
  This framework prioritizes the *source* of justification over probability thresholds, making your reactions coherent: the preface author’s beliefs are premisable because evidence-specific; the lottery’s are not. Unlocated doubt permits modest inconsistency but constrains action via transparency. Where your intuitions feel "stapled," it’s because belief, action, and assertion impose distinct demands—all unified here under justificatory structure and context.
