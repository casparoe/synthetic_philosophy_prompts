  The verbal aspect is tricky. Both sides use "structure," but critics mean something like intrinsic properties, while defenders mean relational properties. The label hides these different meanings. Also, "trivial" might mean different things: logically non-vacuous versus metaphysically substantive.

  Progress might involve clarifying these layers. For example, formal results showing that certain constraints prevent triviality could help. Or distinguishing types of structure—logical vs. mathematical. But the metaphysical disagreement might be bedrock; if critics demand intrinsic natures, structural realism can't satisfy that without collapsing into standard realism. 

  The user is likely frustrated because each seminar repeats the same points without resolution. They need a framework to map the disagreements, helping students see why the debate stalls. They might also want to know if there's a way forward or if the debate is inherently stuck. 

