prompt: |-
  I've been reading the rationalist blogs and forums since the mid-2000s, and once a month I run a ninety-minute session in a pub back room for a mixed crowd: mostly working programmers, two economists, one attendee who has read the Sequences closely and will correct me if I'm sloppy, and three or four newcomers who know the prisoner's dilemma and nothing else. Next month's session is on Hofstadter's superrationality cases — the Platonia dilemma, in which twenty players who cannot communicate may each send one telegram and the prize goes to the sole sender and to nobody if two or more send or if none do, and the Luring Lottery, the open one where a single prize is divided evenly among everyone who enters.

  I don't need the ideas explained to me; I need a plan for explaining them, one that leaves the room clear on why the superrational answer is neither evidential decision theory wearing a hat nor causal decision theory plus common knowledge of rationality.

  Specifically, I want:

  1. The order in which the components have to arrive, and what depends on what. My sense is that nothing lands until the room sees that what is shared between players is a decision procedure rather than a decision, but I want your read on which idea has to be in place before the Platonia case is even intelligible, and which pieces can be moved later without cost.
  2. Which single case should carry the whole session, and why not the other candidates. The candidates are the original Platonia, the Luring Lottery, and a variant I've been using: the same twenty-player telegram game, except that each telegram is independently lost in transit with probability one in ten so that what matters is delivered rather than sent telegrams, and the twenty players have been drawn from a much larger pool by a short quiz, so nobody can be certain the others are running anything like the same reasoning. Tell me what the carrying example must have and must lack.
  3. The misconceptions to expect, and the exact point in the sequence at which to head each off. My guesses: superrationality just means cooperate; if we are all rational we all do the same thing, therefore all send or all abstain, therefore abstain; common knowledge of rationality is doing the work that correlation between copies is really doing; and the one I expect from the person who has read the Sequences, that this is just one-boxing again. Name the ones I've missed, tell me which to defuse early, and tell me which are worth leaving standing until the end because they are doing useful work meanwhile. Note that someone will produce the calculation in which all twenty randomise with probability one in twenty; say where in the sequence that belongs and what it cements if it arrives too early.
  4. One question I can put to the room at the end that would show me they have the idea rather than that they have agreed with me.
  5. What I should openly decline to explain at this level, and how to say so. I already intend to refuse two things: what actually happened when the real lottery was run, since I won't rest anything on figures I can't check, and the full functional decision theory apparatus, which would eat the hour. Tell me what else belongs on that list.

  Lead with the spine of the session in one sentence, then give me the plan; no preamble and no restatement of what I have asked for. British English throughout, and no further reading for me or for them.
reasoning: |-
  Okay, the user is running a session on Hofstadter's superrationality and needs a structured plan. They've been involved with rationalist blogs since the mid-2000s, so they're familiar with the concepts but need a teaching strategy. The audience is mixed: programmers, economists, one Sequences expert, and newcomers. The main goal is to clarify that superrationality isn't just EDT or CDT with common knowledge.

  First, I need to address their specific requests. They want the order of components, the best example to use, misconceptions to handle, a diagnostic question, and what to avoid. 

  For the session spine, I should emphasize that superrationality is about identical reasoning processes leading to correlated decisions without communication. That's the core. 

  Choosing the example: Platonia dilemma is better than Luring Lottery because it forces symmetry. The variant with message loss might complicate things, so sticking to the original makes sense. The key elements are symmetry and identical reasoning, which Platonia exemplifies.

  Order of components: Start with the problem setup, then highlight symmetry. Introduce the Nash equilibrium to show it fails. Then present superrationality as identical decision procedures. Compare to EDT and CDT to differentiate. The randomization point should come after introducing superrationality to show why it's not a mixed strategy.

  Misconceptions: Common ones include equating it to cooperation or one-boxing. The Sequences expert might bring up one-boxing; address this by contrasting the role of correlation. The "all rational agents do the same" idea is useful early but needs correction later. Preempt the randomization argument by showing it's not about probability but identical reasoning.

  Diagnostic question: Ask what guarantees symmetry. The correct answer is that players are logical clones, not communication or common knowledge.

  What to decline: Avoid quantum mechanics, real-world lottery data, functional decision theory, and extensions to imperfect rationality. Keep it focused.

  Need to ensure each step builds on the previous. Start with the problem, then Nash failure, then superrationality. Use the misconception about identical actions early but clarify later. The randomization calculation should come after superrationality to cement the difference. End with the diagnostic question to test understanding.
answer: |-
  **Session spine:** Superrationality resolves symmetric dilemmas by assuming identical agents run identical decision procedures, producing correlated actions without communication, distinct from evidential or causal reasoning.  

  **Plan:**  
  1. **Open with Platonia dilemma (10 mins):**  
     - Present setup: 20 players, no communication, sole sender wins; all send or none send = nobody wins.  
     - **Crucial pre-work:** Stress *absolute symmetry*—identical rules, identical reasoning capacity, no distinguishing features. Without this, the dilemma isn’t intelligible.  
     - *Head off early:* "If we’re all rational, we all do the same thing" is *initially useful* to surface the abstain/send symmetry. Note it—but don’t resolve yet.  

  2. **Dissolve Nash intuitions (15 mins):**  
     - Show standard rational responses fail:  
       - *Individual causality* (CDT): "My choice doesn’t affect others" → all send → lose.  
       - *Evidential thinking* (EDT): "If I send, others likely send" → abstain → lose if all abstain.  
     - **Key pivot:** Highlight that both ignore *shared decision procedure*.  
     - *Pre-empt:* When someone says "This is one-boxing," clarify: "One-boxing relies on *predictive correlation*. Here, no predictor—only identical minds mirroring each other."  

  3. **Introduce superrationality (20 mins):**  
     - Frame: "What if all players *must* use the *exact same algorithm*? Your output isn’t independent—it’s *coupled*."  
     - Solution: All run "Choose randomly with *p*=1/20". But stress: *Not* independent randomization—it’s a *shared deterministic rule* producing one sender.  
     - **Carrying example:** Use *Platonia* (not Lottery). *Why?* It demands perfect symmetry and a unique winner, forcing the "decision procedure" insight. Lottery’s divisible prize masks this. Avoid your variant—message loss/quizzes break symmetry, muddying the core.  
     - *Crush:* "All randomize independently with *p*=1/20" is **wrong**—arrives *here*. Calculate: Independent *p*=1/20 → P(exactly one sender) = 20 × (1/20) × (19/20)^19 ≈ 0.19, not 1. Superrationality’s coupled rule ensures exactly one sender.  

  4. **Contrast with Luring Lottery (15 mins):**  
     - Present Lottery: $1,000,000 prize split among all entrants.  
     - Superrational answer: All enter (prize shared, but non-zero).  
     - **Purpose:** Show superrationality *isn’t* "always cooperate." Abstaining in Platonia vs. entering in Lottery demonstrates outcome dependence.  
     - *Pre-empt:* "Superrationality just means cooperate" dies here.  

  5. **Consolidate distinctions (15 mins):**  
     - Reject "CDT + common knowledge": Common knowledge of rationality *alone* doesn’t correlate actions (e.g., in Prisoner’s Dilemma, it leads to mutual defection).  
     - Reject "EDT in disguise": EDT updates on *evidence*; superrationality assumes *algorithmic identity* as a prior.  
     - *Useful lingering misconception:* Let "all rational agents do the same thing" persist until now. Shatter it: "In asymmetric games, identical rationality *doesn’t* imply identical actions—only symmetry forces this."  

  6. **Diagnostic question (5 mins):**  
     - **"What breaks if the 20 players aren’t logical clones, and why does replacing ‘common knowledge of rationality’ with ‘identical decision procedures’ fix it?"**  
     - *Target insight:* If procedures aren’t identical, correlation vanishes. Common knowledge doesn’t enforce action coupling; shared algorithms do.  

  7. **Openly decline:**  
     - Quantum mechanics analogies ("quantum game theory"). Say: "That’s a different toolset—we’re focusing on classical symmetry."  
     - Evolutionary stability. Say: "This isn’t about population dynamics—we’re examining *one-shot* logic."  
     - Real-world experiments. Say: "We’re analyzing ideal theory; empirical data introduces noise we’ll bracket today."  

  **Sequence anchor:** Symmetry → Nash failure → decision procedure (not action) as shared object → correlation without communication → distinct from CDT/EDT.  
  **Critical path:** Platonia’s symmetry must land first; algorithmic identity before Lottery; randomization calculation *after* superrationality to cement coupling.
