answer: |-
  ## NOTICE TO CONTRIBUTORS: *Journal of Conjectural Biology* (JCB)

  **1. Philosophical Foundation & Scope**
      The *Journal of Conjectural Biology* (JCB) operates under a strict falsificationist framework inspired by the methodological principles of Karl Popper. We prioritize the formulation and critical testing of bold, empirically falsifiable conjectures in evolutionary biology. While recognizing the historical and heuristic value of metaphysical research programmes (MRPs), JCB maintains a clear demarcation between testable scientific theories and non-testable MRPs, guided by Popper's earlier and more rigorous articulation of these concepts (specifically, *The Logic of Scientific Discovery* and pre-1970s writings). We find the later concession regarding the testability of natural selection less methodologically defensible, as it represents a weakening of falsifiability criteria and is, by its own implied standard, the less scientific position. JCB publishes both Type-T (Testable) and Type-M (Metaphysical Research Programme) submissions, governed by distinct editorial policies outlined below.

  **2. Mandatory Definitions**
      2.1. **Fitness:** Any manuscript employing the term "fitness" must explicitly define it *without reference to actual survival or reproductive success*. Definitions must be operationalizable and measurable independently of the outcome of differential survival/reproduction in the specific study context. Acceptable definitions may reference heritable phenotypic traits (e.g., sprint speed, metabolic efficiency, toxin resistance) linked to resource acquisition, predator avoidance, mate attraction, or environmental tolerance under specified conditions. *Example: "Fitness in this context is defined as the mean standardized bite force (N/kg body mass) measured under controlled feeding trials."* Definitions solely equating fitness with differential survival, reproductive output, or genetic contribution to future generations are prohibited.

  **3. Prohibition Statement Requirement (Type-T Submissions Only)**
      3.1. All Type-T submissions must include a dedicated "Prohibition Statement" section.
      3.2. This statement must nominate *at least one* specific, logically possible, and empirically observable state of affairs (phenomenon, experimental result, or fossil discovery) that, if observed, would constitute a definitive refutation of the central hypothesis or theoretical claim presented in the manuscript.
      3.3. The nominated observation **must not** have been reported in the scientific literature prior to the submission date of the manuscript. Predictions retrofitted to existing data are invalid for this purpose.
      3.4. *Example:* "This hypothesis of kin-selected alarm calling would be refuted if, under natural predation pressure, individuals with full siblings in the group exhibited significantly *lower* alarm call rates (p<0.01, Cohen's d > 0.8) than individuals with no close kin present, controlling for age and proximity to predator."

  **4. Submission Tracks: Type-T & Type-M**
      4.1. **Type-T (Testable):** Presents a falsifiable hypothesis or theory, complete with a Prohibition Statement (Section 3) and empirical test results. Must adhere to Sections 2, 3, 5, 6, and 7.
      4.2. **Type-M (Metaphysical Research Programme):** Presents a framework, conceptual synthesis, or organizing principle for evolutionary research that is not itself empirically falsifiable in the strict sense defined herein. Type-M submissions:
          *   Are published in a dedicated "Metaphysical Research Programmes" section.
          *   Must **not** claim empirical support or confirmation from data. Language must focus on conceptual coherence, explanatory scope, heuristic value, or potential to generate testable hypotheses (Type-T).
          *   Must carry the following boilerplate footnote on the first page: "*This paper presents a Metaphysical Research Programme (Type-M). It offers a framework for understanding and guiding empirical research but is not itself empirically testable in the strict falsificationist sense employed by JCB. Its value lies in its capacity for rational criticism and its utility in organizing inquiry.*"
          *   Are exempt from Sections 2 (Fitness Definition), 3 (Prohibition Statement), 5 (Boldness Statement), and 7 (Situational Analysis Recommendation), but must adhere to Section 6 (Vocabulary) and Section 8 (Auxiliary Hypotheses).

  **5. Vocabulary Prohibition (Section 6) & Boldness Statement (Section 5)**
      5.1. **Boldness Statement (Type-T Only):** Type-T submissions must include a "Boldness Statement" assessing the antecedent improbability of the central hypothesis relative to established background knowledge. Authors must assign a score on the JCB Content–Risk Index (CRI), ranging from 1 (minimal novelty/risk, highly probable given background knowledge) to 10 (maximally novel/risky, highly improbable given background knowledge). Justification for the score must be provided, referencing specific aspects of current theory or data the hypothesis challenges. *Note: Higher CRI scores are viewed favorably, reflecting greater potential scientific value through falsifiability.*
      6.1. **Vocabulary Prohibition (All Submissions):** Manuscripts must not employ vocabulary implying confirmation, verification, or probabilistic support for theories or hypotheses. Prohibited terms include, but are not limited to: "support," "confirm," "verify," "prove," "evidence for," "probability of hypothesis," "Bayesian support," "likelihood ratio" (when used as evidence *for* a hypothesis). The only permissible terms for discussing the outcome of empirical tests are: "corroborate" (verb), "corroboration" (noun), "degree of corroboration" (descriptive assessment), "falsify," "refute," "withstand test," "fail to falsify." Authors must report a qualitative assessment of the "degree of corroboration" (e.g., weak, moderate, substantial) based on severity of tests and outcome, not a quantitative probability.

  **7. Auxiliary Hypotheses & Conventionalist Stratagems**
      8.1. All auxiliary hypotheses (assumptions, boundary conditions, measurement techniques, or subsidiary theories) necessary for deriving the testable prediction(s) from the main hypothesis **must** be explicitly stated and justified *prior* to the presentation of test results or data analysis.
      8.2. Any auxiliary hypothesis introduced *after* the test results are known, specifically to explain away an apparent falsification of the main hypothesis, is classified as an "immunizing move" or "conventionalist stratagem." Such post-hoc modifications render the core hypothesis unfalsifiable and are grounds for rejection of Type-T submissions. Type-M submissions are assessed for coherence, but post-hoc immunizations weaken their rational criticism value.

  **8. Recommendation: Situational Analysis Over Historical Narrative (Type-T)**
      9.1. For hypotheses concerning the evolution of specific traits in particular taxa (singular historical narratives), JCB strongly recommends recasting the argument as a *situational analysis*.
      9.2. A situational analysis must clearly define:
          *   The *problem situation*: The specific environmental, ecological, social, or physiological challenges faced by the ancestral organism(s) within a defined spatiotemporal context.
          *   The *rational solution*: The trait is logically derived as the optimal or near-optimal solution to the defined problem situation, given the constraints and resources plausibly available.
      9.3. *Example:* Instead of "The long neck of *Giraffa camelopardalis* evolved to reach high foliage," frame as: "In a Miocene savanna environment characterized by intense competition for browse at lower levels and abundant foliage above 4m (problem situation), a heritable increase in cervical vertebrae length represented the most energetically efficient solution for accessing uncontested food resources (rational solution), compared to alternatives like increased browsing mobility or dietary shift."
      9.4. While singular historical narratives are inherently difficult to falsify directly (lacking universal law status), situational analyses generate testable predictions about functional morphology, performance advantages, or the presence/absence of competing solutions in the fossil record or extant relatives, aligning with the Prohibition Statement requirement.

  **9. Editorial Process & Author Appeals**
      10.1. Manuscripts failing to comply with the above policies will be returned without full review. Authors may resubmit after revision.
      10.2. The Editorial Board reserves the right to classify a submission as Type-M even if submitted as Type-T, based on its assessment of falsifiability.
      10.3. Rejection decisions based on policy adherence are final. Appeals may be submitted via the online portal, briefly stating the grounds.

      > **Author's Appeal:**
      > *Prof. Evelyn Thorne (Dept. of Evolutionary Dynamics, Faber College) appeals the rejection of MS# JCB-2024-567 ("Coevolutionary arms races drive escalating venom complexity in *Conus imperialis*"). The rejection cited failure to define fitness independently of survival (used larval recruitment as proxy) and an inadequate Prohibition Statement (nominated "absence of venom variation," but significant variation is already documented in *C. marmoreus*). Prof. Thorne argues: "This is pedantry stifling real science! Larval recruitment *is* the relevant fitness measure for sessile marine invertebrates. The *imperialis* complex *is* understudied; citing *marmoreus* is irrelevant. Your rigid definitions force artificial constructs divorced from biological reality. Demanding a priori refuters for complex historical processes is impossible and misunderstands how evolutionary biology works. This policy renders most adaptationist work unpublishable here."*
      >
      > **[Editorial Board Response:]**
      > *Appeal Denied. JCB policy requires fitness definition independent of survival/recruitment proxies (Sec. 2.1). Prof. Thorne's fitness measure remains tautological. The nominated refuter (absence of variation) was demonstrably falsified pre-submission in related taxa, violating Sec. 3.3. The appeal confirms the core hypothesis lacks a genuine Prohibition Statement. Prof. Thorne's objections regarding historical biology are noted but do not alter the journal's methodological requirements. The manuscript may be reconsidered if revised as a Type-M submission focusing on the MRP of coevolutionary arms races, excluding claims of empirical support and adhering to Sec. 6.1 vocabulary.*

  **10. Worked Example: Non-compliant vs. Compliant Abstract**

      *   **Submitted (Non-compliant):** "We investigate the origin of dermal photophores in the abyssal fish *Photobenthos profundus*. We propose photophores evolved for counter-illumination camouflage. Genetic analysis reveals strong selection (*p*<0.001) on photophore development genes, **supporting** this adaptive hypothesis. **Fitness** was significantly higher (measured as offspring survival to maturity) in individuals with better ventral illumination matching. **Bayesian analysis** strongly **confirms** counter-illumination as the primary driver (*BF* > 100)."
      *   **Rewritten (Compliant - Type-T):** "We propose the hypothesis that dermal photophores in *Photobenthos profundus* evolved as a solution to the problem situation of predation from below in the aphotic zone, requiring ventral camouflage against downwelling light (problem situation). Counter-illumination is derived as the rational solution (rational solution). **Fitness** is defined as the mean percentage match (±SD) between ventral photophore emission spectrum and downwelling irradiance, measured in situ. **Prohibition Statement:** This hypothesis would be refuted if individuals exhibiting >95% spectral match exhibited significantly *higher* predation rates (≥2x, *p*<0.01) than poorly-matched conspecifics under natural conditions, using acoustic telemetry. Experiments show spectral matching significantly influences predator approach distance (degree of **corroboration**: substantial). **Boldness Statement:** CRI=7. Counter-illumination is established in mesopelagic taxa but was considered improbable on the seafloor due to negligible downwelling light; our measurements show sufficient irradiance. Genetic evidence indicates a recent, selective origin for enhanced photophore tuning."

  **11. Final Note**
  Adherence to these policies ensures the intellectual rigor and distinct methodological focus of the *Journal of Conjectural Biology*. We invite contributions that advance evolutionary biology through bold conjecture and severe empirical tests, or that articulate valuable, testable-guidance-providing Metaphysical Research Programmes with clarity and critical awareness.
