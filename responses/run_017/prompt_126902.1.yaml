  But the flip-flop case exposes a second, deeper dispute: Is there subjective residue beyond third-person accounts? Realists say flipping qualia matters even if undetectable, deniers call this unscientific. This isn't about words - it's about what counts as evidence and explanation. 

  Progress might come from disentangling these. For the verbal layer, we could demand: "Define qualia without making it unanswerable." For the substantive layer, we'd need something like: 
