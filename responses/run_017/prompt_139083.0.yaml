answer: |-
  Here’s a close reading of the Wall of Fame strand through your commemoration schema, addressing your core questions while honoring the film’s complexity and acknowledging where the analogy to state monuments strains:

  ### Core Argument: The Film Shifts the Debate from Subject to Voice/Speech-Act
  Your hypothesis is correct: the film uses the *subject* dispute (Italian vs. Black figures) to expose conflicts over *voice* and *speech-act*. Sal’s wall is not a neutral list of "admirable people" but a **territorial claim** enacted through commemoration. Each scene reveals this:

  1.  **Buggin' Out's Initial Complaint (Subject → Voice):**  
      *   *Surface:* Subject demand ("Add Black heroes").  
      *   *Subtext:* Voice challenge ("Who decides what belongs here?"). Buggin' Out frames it as a consumer/citizen right: "We spend money here... our people built the country." Sal counters with ownership/property rights ("My pizzeria, my wall"). The subject demand immediately becomes a power struggle over the *right to define the space's identity*.
  2.  **Sal's Defense & Smiley's Sales (Voice & Speech-Act):**  
      *   *Sal:* His insistence "I am not you!" underscores his claim that the wall expresses *his personal/ethnic* voice ("I honor *my* people"), rejecting the idea it speaks for the community.  
      *   *Smiley:* His failed sales highlight the *speech-act* failure of his commemorative images in isolation. Without a platform (voice) or context (space), the images lack power. They are mere commodities, not assertions of belonging. This contrasts sharply with Sal’s wall, embedded in a space of economic and social power.
  3.  **Radio Raheem's Boombox (Counter-Speech-Act):**  
      *   Raheem’s "Fight the Power" is a non-visual, mobile, sonic *counter-commemorative act*. It asserts Black presence/defiance in shared spaces (street, pizzeria) without permission. It challenges the *speech-act* of Sal’s wall by declaring: "This space is contested; your claim isn’t absolute." Its volume makes it unavoidably public, forcing acknowledgment.
  4.  **The Confrontation & Destruction (Speech-Act & Voice Collide):**  
      *   Sal smashing the boombox is the violent suppression of a rival *speech-act* and assertion of his *voice* ("My place!").  
      *   Raheem's death makes the state's violent intervention the ultimate negation of Black voice in the space.
  5.  **Smiley's Photograph on the Ruins (Speech-Act Transformed):**  
      *   This is **commemoration as occupation/obituary**. It’s not sanctioned by any polity or owner. It’s a desperate, post-destruction claim staked on the ashes of the contested space. Its power comes from context: it pins King/X *onto the charred remains* of the very structure that excluded them. The *speech-act* shifts from "This is whose place this is" (Sal) to "This is what the fight was about / who we lost" (Community? Film?).

  ### Addressing Your Specific Concerns

  1.  **The Addition Asymmetry & Positional Honoring:**  
      Your "positional" hypothesis is strong. **The wall functions as a visual synecdoche for the neighborhood's identity.** Adding Black figures isn't just lengthening a list; it fundamentally alters the statement from "This is an *Italian* space that welcomes Black customers" to "This is a *shared* or *Black* space with Italian ownership." The resistance stems from Sal (and Pino) experiencing the addition as **cultural displacement**, not inclusion. The wall’s homogeneity *is* the message of control and belonging. A removal demand might have been seen as hostile, but an addition demand is perceived as an equally hostile *takeover* of the space's symbolic meaning.

  2.  **The Conversion Thesis (Private -> Public):** Why doesn't Sal win easily?  
      *   **Unavoidability & Pseudo-Public Function:** Sal's isn't just a shop; it's the *de facto* community center, the only eatery on the block. Residents *must* interact with it. The Wall of Fame is its most prominent, unavoidable feature. This transforms it from pure private décor into a **de facto public declaration** within the limited "polis" of the block.
      *   **Economic Power & Ownership:** Sal's ownership of the building (revealed later) isn't neutral. His economic dominance is intertwined with his control over the physical and symbolic space. His "private" commemoration leverages this power imbalance. Buggin' Out's demand is, in part, a demand for **symbolic equity** in a space economically controlled by an outsider.
      *   **The Film Isn't Cheating, It's Layering:** The film intentionally blurs lines. It shows how economic power, physical space, community use, and personal/cultural identity intertwine to make Sal's wall *function* as public commemoration for those subjected to it daily, even if legally private. Its power *derives* from its prominence in a space where alternatives are absent.

  ### Where the Monument Analogy Breaks (For Your Film Studies Colleague)

  1.  **Intent & Scale:** State monuments explicitly claim to speak for "the people" or "history." Sal's wall is personal/cultural décor. Its power on the block is *emergent* and *contextual*, not inherently sovereign.
  2.  **Subject Matter:** Honoring Sinatra vs. honoring Lee/Jackson is different from honoring Confederate generals vs. Union soldiers. The former is primarily about cultural affinity/identity; the latter is explicitly about state power, treason, slavery, and historical legacy. The stakes *feel* different, though the *mechanism* of exclusion is analogous.
  3.  **Sal's Property Right:** Philosophically, Sal *does* have a strong claim. The film acknowledges this complexity. His refusal isn't portrayed as inherently evil, but as tragically myopic within the specific context of power, community, and simmering injustice. His wall *becomes* a flashpoint because of the neighborhood's lived reality, not because private property rights are invalid.
  4.  **Violence as Resolution:** State monument debates (ideally) involve democratic processes. The film depicts a complete breakdown of dialogue and civic process, leading to tragic violence. This isn't a model; it's a warning.

  ### The Ending: Commemoration Without Verdict?

  *   **Smiley's Act:** It's **commemorative vandalism/occupation.** It seizes the ruined symbol to assert the presence of the figures previously excluded. It’s raw, ambiguous, and born of destruction. It doesn't offer a new vision; it marks the site of the conflict with its casualties (MLK, Malcolm X as symbols of the struggle).
  *   **The Paired Epigraphs:** This is **dialogic commemoration.** The film refuses to adjudicate between King and Malcolm X. It presents their contrasting philosophies (nonviolence vs. self-defense) as both valid responses to oppression, existing in tension. Applied to commemoration, it suggests: **There is no single "right" way to remember or claim space in the face of systemic exclusion and violence.** The meaning emerges from the unresolved dialogue, not a synthesized verdict. It’s coherent as a reflection of lived contradiction, potentially evasive if read as a refusal of political clarity, but powerfully honest about the complexity of struggle.

  ### Teaching Moments: Pause & Philosopher's Insight

  1.  **Pause: Buggin' Out's initial complaint & Sal's response.**  
      *   **Philosopher's Insight:** "Note how quickly the *subject* (who's on the wall) becomes a debate about *voice* (who decides) and *speech-act* (what the wall *does* – asserts ownership/identity). Commemoration is rarely just about the honoree; it's about power to define space and belonging. The 'addition asymmetry' reveals that the wall's meaning is *relational and positional*, not additive."
  2.  **Pause: Sal smashing Radio Raheem's boombox.**  
      *   **Philosopher's Insight:** "This is the violent suppression of a *counter-commemorative speech-act* (Raheem's sonic claim to space). It crystallizes that the conflict is fundamentally about *whose expression of identity and belonging is permitted to occupy the shared space*. The boombox represented non-visual, mobile commemoration challenging the fixed visual monument."
  3.  **Pause: Smiley pinning the photo to the burning wall / The final epigraphs.**  
      *   **Philosopher's Insight:** "This isn't conventional commemoration. It's commemoration born of destruction and unresolved tension. Smiley's act seizes the contested symbol in ruins. The paired quotes refuse a single 'right' answer, proposing instead that public memory, especially of conflict and oppression, often exists as a difficult dialogue between opposing truths. The film argues that commemoration's power lies not just in judgment, but in forcing us to confront the ongoing, unresolved conversation about justice and belonging."

  ### What the Film Understands That Arguments Alone Don't
  *   **The Visceral, Embodied Experience of Exclusion:** Arguments analyze power; the film makes you *feel* the weight of Sal's wall, the intrusion of Raheem's music, the heat of the pizzeria, and the violence of exclusion through Mookie's eyes and Raheem's death. It demonstrates how commemoration isn't abstract; it lives in the daily sensory experience of place.
  *   **Commemoration as Dynamic Conflict, Not Static Fact:** It shows commemoration as a site of ongoing struggle over power, identity, and space, not a settled statement. The meaning changes based on who views it, under what conditions, and who holds power.
  *   **The Role of Non-Visual/Aural Claims:** Raheem's boombox powerfully demonstrates that claims on space and memory aren't limited to statues or plaques; sound, movement, and presence are equally potent forms of commemoration and resistance.
  *   **The Tragic Cost of Failed Dialogue:** The film brutally illustrates what happens when competing claims to voice and belonging in commemorative space completely break down, exposing the limitations of purely philosophical debate in the face of entrenched power and raw injustice.

  This reading affirms your core insight: *Do the Right Thing* uses the pizzeria wall not just as a racial flashpoint, but as a profound case study in the volatile politics of who gets to speak, through what symbols, and with what consequences, in the shared spaces we inhabit. It brilliantly exposes the voice and speech-act dimensions simmering beneath surface debates about subject.
