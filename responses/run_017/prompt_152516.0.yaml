answer: |-
  **Pantoum for Closing**  

  Justice is weak without a hand.  
  What’s strong is just because it’s strong.  
  Force wears the robes the world will stand.  
  We dress our force in justice’s clothes.  

  What’s strong is just because it’s strong.  
  The robes we trust are stitched with might.  
  We dress our force in justice’s clothes.  
  Dispute the word, but not the sight.  

  The robes we trust are stitched with might.  
  Unveil the thread, the structure breaks.  
  Dispute the word, but not the sight.  
  What stands unmoved, the crown, the stakes.  

  Unveil the thread, the structure breaks?  
  Force wears the robes the world will stand.  
  What stands unmoved, the crown, the stakes,  
  Justice is weak without a hand.  

  **Summary:** When "We dress our force in justice’s clothes," the circle closes, leaving no ground outside the act of legitimation.  

  ---

  ### Notes on Structure & Intent  
  - **Line Transfers**: Each inherited line (e.g., "What’s strong is just because it’s strong") shifts from describing force's dominance (Stanza 1) to becoming a tacit rule of obedience (Stanza 2).  
  - **Final Circle**: The return of the opening line ("Justice is weak without a hand") now resonates as settled truth—not cynicism, but the necessary foundation of order.  
  - **Antitheses**: "Dispute the word, but not the sight" contrasts justice’s contested ideals with force’s immediate presence; "Unveil the thread, the structure breaks" warns against destabilizing illusion.  
  - **Conservative Motion**: The pantoum’s repetitions enact Pascal’s claim—authority borrows its own past utterances to sustain itself.  

  The poem preserves Pascal’s tension: force *requires* justice’s garments to function, yet removing them invites chaos. The closing circle embodies his pragmatic conservatism.
