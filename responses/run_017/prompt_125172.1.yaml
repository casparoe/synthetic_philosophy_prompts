answer: |-
  ### In-Class Activity: Mind Uploading Dilemma Simulation  
  **Objective:** Students generate the central dilemma of gradual replacement mind uploading through first-person role-play, focusing on whether consciousness persists under functional equivalence. The dilemma: if experience changes despite functional invariance, functionalism is false; if no change occurs, consciousness persists in a synthetic system, but sudden replacement (Hemispheric) may challenge this.  

  **Materials:**  
  - Index cards (16 sets of 11 cards each, pre-labeled "Round 0" to "Round 10")  
  - Pens (16)  
  - Sealed envelopes (16)  
  - Whiteboard/projector with labeled axes: x-axis "Round" (0–10), y-axis "Avg. Experience (0–10)"  
  - Timer  
  - Clinic assignment slips (6 for Drip, 5 for Shadowing, 5 for Hemispheric)  

  **Rules:**  
  - **Anonymity:** No names on round cards. Only clinic and student ID on sealed predictions.  
  - **Fixed Behavior:** Stipulate that all patients *always* verbally report "I feel normal" and pass cognitive/behavioral tests. Students must accept this.  
  - **No Discussion:** Students work silently during rounds; discussion only in debrief.  
  - **Experience Rating:** 0 = "no conscious experience," 10 = "full, normal experience."  
  - **Consent:** After each round, students mark "yes" or "no" for continuing the procedure.  

  **Timeline (90 Minutes Total):**  
  1. **Setup (10 mins):**  
     - Assign clinics randomly via slips.  
     - Distribute materials: 1 sealed envelope, 11 index cards, pen per student.  
     - **Instructions (display on board):**  
       > "You are a patient undergoing mind uploading. Your brain is replaced unit-by-unit with synthetic parts that preserve *exact functional organization*. Your behavior and speech are fixed: you always say ‘I feel normal’ and pass all tests.  
       > **Clinics:**  
       > - **Drip:** 10% of units replaced per round (10 rounds total).  
       > - **Shadowing:** Synthetic units run alongside organic; weighting shifts 10% per round from organic to synthetic. Both active during shifts.  
       > - **Hemispheric:** Round 5: One hemisphere replaced (50%). Round 10: Other hemisphere replaced (100%). No changes in rounds 1–4 or 6–9.  
       > **Task:**  
       > 1. **Prediction:** Write your clinic, ID, and the first round your experience changes (e.g., ‘Round 3’) or ‘no change’. Seal in envelope.  
       > 2. **Each Round:** Rate your experience (0–10) and consent (yes/no) on the card.  
       > 3. **Key:** 10 = normal consciousness, 0 = none. Behavior is fixed—this is your private judgment."  

  2. **Prediction Phase (5 mins):**  
     - Students write predictions privately and seal envelopes. Collect envelopes.  

  3. **Rounds 0–10 (40 mins total, 3.5 mins/round):**  
     - **Each Round (3.5 mins):**  
       - **Announcement (0.5 mins):** State round and replacement level (e.g., "Round 3: Drip 30%, Shadowing 30% synthetic, Hemispheric 0%").  
       - **Rating (2 mins):** Students imagine their state and record experience (0–10) + consent on the round’s card.  
       - **Transition (1 min):** Collect cards for that round in a clinic-specific box.  
     - **Halfway (After Round 5):**  
       - Pause. Anonymously calculate average experience ratings for each clinic (Rounds 0–5) and plot curves on board.  
       - Open sealed predictions and share trends (e.g., "Most Drip patients predicted change at Round 4–6"). Do not interpret.  
     - **Resume Rounds 6–10.**  

  4. **Final Plotting (5 mins):**  
     - Plot full curves (Rounds 0–10) using all data. Highlight differences between clinics.  

  5. **Debrief (30 mins):**  
     - **Guided Discussion (15 mins):**  
       - *Q1:* "What patterns do you see in the curves? Why might clinics differ?" (Draw out: Drip often declines gradually, Hemispheric drops at Round 5, Shadowing stable. If no difference, ask why.)  
       - *Q2:* "If experience changed at a step, but behavior didn’t, what does that imply about functionalism?" (Functionalism requires identical function → identical experience; change contradicts this.)  
       - *Q3:* "If experience never changed, does that mean the synthetic system is conscious? How does Hemispheric’s sudden drop challenge this?" (Accumulation vs. discontinuity.)  
       - *Q4:* "Could gradual dimming occur without you noticing? Why is this hard to disprove?" (Fixed behavior masks change; no baseline comparison.)  
     - **Reveal Labels (5 mins):** Introduce "fading qualia" (gradual loss), "dancing qualia" (Shadowing’s double implementation), and "organization invariance" (functionalism’s claim). Map to activity:  
       - Drip → Fading qualia (if curve drops).  
       - Shadowing → Dancing qualia (stable curve suggests no change; midpoint has two active units).  
       - Hemispheric → Challenges invariance (sudden drop implies function ≠ experience).  
     - **Philosophical Summary (10 mins):**  
       - The dilemma: Functional equivalence forces a choice between rejecting functionalism (if experience changes) or accepting synthetic consciousness (if it doesn’t).  
       - Why behavior is insufficient: First-person perspective is private; fading could be undetectable.  
       - What the activity misses: Real phenomenology (we imagined, didn’t experience replacement).  

  ---

  **Predictable Problems and Handling:**  
  1. **Students Name Arguments Early:**  
     - *Issue:* Eager students say, "This is fading qualia!" during rounds.  
     - *Handling:* Gently interrupt: "Hold that thought—we’re collecting raw data now. We’ll analyze later." If persistent, add: "Your prediction envelope captures your initial view; let’s see how the data aligns."  

  2. **"Just Ask the Patient!":**  
     - *Issue:* A student insists behavioral reports resolve the dilemma.  
     - *Handling:* Refer to rules: "Remember, behavior is fixed. The patient always says they’re fine. Does that ensure nothing changed?" Steer toward first-person privacy: "What if you felt different but couldn’t say so?"  

  3. **Rejecting Fixed Behavior Stipulation:**  
     - *Issue:* "This is unrealistic—if experience changes, behavior would too!"  
     - *Handling:* Acknowledge: "That’s a real concern, but this thought experiment assumes it’s possible. Let’s see where that takes us. We’ll critique assumptions in debrief."  

  4. **Noisy/Performative Ratings:**  
     - *Issue:* Ratings skew high (fear of "failing") or low (dramatic effect), especially in Hemispheric.  
     - *Handling:* Normalize in debrief: "Curves are averages—we expect noise. But if clinics diverge systematically, why might that be?" Use consent data: "Did low ratings correlate with revoked consent?"  

  ---

  **What the Activity Cannot Reproduce (Supply in Debrief):**  
  - **The Ineffability of Gradual Change:** Students *imagine* fading, but real gradual replacement might involve unnoticed shifts (like boiling a frog). The activity cannot simulate how subtle, stepwise changes could escape detection. In debrief, stress: "This is why fading qualia is hard to disprove—you might not ‘feel’ the loss until it’s too late, and behavior gives no clues."  
  - **The Epistemic Gap:** The activity relies on introspection, but real consciousness under replacement is unknowable. Emphasize: "We used first-person judgments as data, but in reality, we’d have no access to others’ experience. This is the hard problem magnified."  

  **Why This Works:**  
  Students confront the dilemma organically:  
  - Divergent curves (e.g., Hemispheric drop) suggest experience ≠ function.  
  - Flat curves force acceptance of synthetic consciousness.  
  - Consent questions reveal unease (e.g., revoking consent amid stable ratings).  
  The protocols make routes—not endpoints—salient, undermining functionalist dismissal of "irrelevant" details.
