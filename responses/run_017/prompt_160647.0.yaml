prompt: |-
  I have been trying to apply Lakatos's distinction between progressive and degenerating problem shifts to episodes in my own field, and I find that I have confident verdicts on individual cases but no principle that yields them. I would like the principle, or an argument that there isn't one.

  My verdicts, in no particular order. (i) A programme answers an anomaly by modifying its protective belt, the modification is shaped entirely around that anomaly, and thirty years pass without its predicting anything new: degenerating. (ii) The same kind of modification, but a decade later it throws up a fact nobody had gone looking for, and the fact is then found: progressive — and I want to say progressive from the moment of the modification, though at the time it was indistinguishable from the one in (i), and I cannot say why the difference in outcome should reach backwards. (iii) A modification made and published before anyone had the relevant data, and then confirmed: progressive, and I feel it is more progressive than (ii), but I cannot say what the extra credit is for. (iv) A programme explains a fact that had been on the books for years and had played no part in building the theory: this counts in its favour. (v) A programme explains, very exactly, a fact it was constructed to fit: this counts for nothing at all — and here I am in trouble, because in both cases the fact was known first. (vi) A programme's central posit is eventually shown not to exist, while predictions derived from it keep succeeding: I still score it as progressive, uneasily. (vii) A programme keeps its name, its equations and its notation across a generation while quietly abandoning the commitment that made it distinctive — say, no longer claiming that the entities it is named after are real: I stop counting it as the same programme and I do not credit its later successes to the earlier one. (viii) Two groups work from the same hard core with different protective belts and publish against each other: that is one programme for purposes of appraisal, not two — which sits badly with (vii). (ix) A programme has stopped producing novel predictions and only absorbs anomalies, but there is no rival programme addressing the same phenomena: I will not say abandon it and I will not say it is healthy either; I want a verdict of not yet appraisable, even though degenerating looks like it should be a property of the programme alone. (x) Inside one nominally single programme, one small branch keeps turning up novel facts while everything around it only absorbs anomalies: I score the programme as degenerating, and I would still move a PhD student into that branch tomorrow — which makes me unsure what the unit of appraisal is supposed to be.

  The best I can do by way of a principle: a programme is progressive over a period just in case, over that period, its belt modifications yield more corroborated facts they were not introduced to explain than facts they were, and degenerating in the opposite case; and every such verdict is provisional, since a degenerating stretch can be redeemed later.

  Please test that against the ten cases and repair it. I want: the principle stated precisely, clause by clause, with the case that motivates each clause; its verdicts on cases I have not listed — a programme whose novel predictions are picked, after the fact, out of a large computer-generated space of its own variant models, each prediction being announced before the test; a programme sustained mainly by one well-funded group; two programmes that have merged their belts; and an honest statement of which of my verdicts the principle cannot keep, and at what cost in complexity it could keep them. One last thing matters to me practically: every formulation I have tried seems to need to know what happens over the next decade, and I have to decide this term whether to take a student off a line of work. If the appraisal can only be made in hindsight, tell me what the honest real-time surrogate is.
reasoning: |-
  Hmm, this is a sophisticated methodological question about applying Lakatos's philosophy of science to real-world research programs. The user has ten specific cases where their intuitive judgments about progressive vs degenerating problem shifts conflict with any clear principle they can formulate. They've proposed a provisional principle and want it tested against their cases and other scenarios.

  The core tension here revolves around several philosophical knots: the time-dependence of appraisal (can we judge a modification progressive before its novel predictions are confirmed?), the unit of analysis (what constitutes "the same" research program?), and the weighting of different types of empirical support (post-hoc explanation vs novel prediction).

  Looking at their ten cases, we can group the issues:
  - Cases (i) and (ii) highlight the hindsight problem: identical initial modifications are judged differently based on later outcomes.
  - Cases (iii) through (v) deal with the epistemic value of predictions versus accommodations.
  - Cases (vi) and (vii) touch on ontological commitments versus predictive success.
  - Cases (viii) to (x) concern the boundaries of research programs.

  Their proposed principle focuses on the ratio of novel predictions to accommodations, which is sensible but incomplete. The deeper issue is that Lakatos's framework requires counterfactual historical judgment - we must imagine what would have happened without the modification, and what alternative programs could have explained the same facts.

  For the real-time decision about their student, the key is recognizing that methodology of scientific research programs (MSRP) was never intended as a real-time decision tool. The honest surrogate would be: track the ratio of progressive-to-degenerating shifts within the program's recent history, weight novel predictions higher than accommodations, and monitor whether the protective belt modifications are generating new research questions rather than just patching holes.

  The user's unease with case (vi) is particularly telling - it reveals how Lakatos undervalues ontological grounding. When a central posit is disproven but predictions keep working, we're likely dealing with what Nancy Cartwright would call "phenomenological laws" that work without truth.

  For their additional scenarios:
  - Computer-generated predictions: should count if selection is theory-driven
  - Well-funded programs: funding is irrelevant to MSRP appraisal
  - Merged belts: indicates program degeneration if not theory-driven
answer: |-
  Below is a principled framework derived from your cases, refined through Lakatos's core ideas and your intuitions. I'll state the principle clause-by-clause, show how it handles your cases, test it against your additional scenarios, identify where it conflicts with your verdicts, and offer a real-time surrogate for appraisal.

  ---

  ### **Revised Principle of Progressive Shifts**
  **A research programme *P* is progressive over interval *T* iff:**  
  1. **Modifications** to its protective belt yield **novel predictions** (facts not used to construct the modification) *or* **unified explanations** (explaining ≥2 unrelated anomalies with one adjustment).  
     *Motivation*: Cases (ii), (iii), (iv). Explains why (iv) gets credit (unifies existing facts) and (ii)/(iii) differ (novelty timing).  

  2. **Corroboration ratio** of novel/unifying predictions (*N*) to accommodations (*A*) is *N* > *A* over *T*. Accommodations are belt modifications *only* explaining the anomaly they were built for.  
     *Motivation*: Cases (i), (ii), (v). (i) has *N*=0, *A*>0; (ii) starts with *N*=0 but later *N*>0; (v) is pure accommodation (*A*>0, *N*=0).  

  3. **Ontological continuity**: *P* retains its hard core's **causal commitments** (e.g., entities, mechanisms). If abandoned, it becomes a new programme.  
     *Motivation*: Cases (vi), (vii). (vi) keeps commitments (progressive); (vii) loses them (not same programme).  

  4. **Competitive context**: When rivals exist, *degenerating* status can be assigned earlier. Without rivals, label *stagnant* (neither progressive nor degenerating).  
     *Motivation*: Case (ix). Absence of rivals delays "degenerating" verdict.  

  5. **Appraisal unit**: The smallest subprogramme with a **distinct hard core**. A programme can host both progressive and degenerating subprogrammes.  
     *Motivation*: Case (x). The active branch is a subprogramme.  

  6. **Temporal scope**: Verdicts apply to *closed* intervals. Later outcomes can redeem earlier modifications (e.g., if *N*>0 emerges post-*T*).  
     *Motivation*: Cases (i), (ii). (ii) was *progressive-in-retrospect* once *N*>0.  

  ---

  ### **Testing Against Your Cases**  
  | Case | Principle's Verdict | Alignment |  
  |------|----------------------|-----------|  
  | (i) | Degenerating (*N*=0, *A*>0) | ✓ |  
  | (ii) | Progressive *once corroborated*; at modification time, "provisionally degenerating" (since *N*=0) | Partial (your backward-reaching concern is addressed by Clause 6) |  
  | (iii) | Progressive (novel prediction pre-data) | ✓ (and more credit than (ii) due to *preemptive* novelty) |  
  | (iv) | Progressive (unified explanation of known facts) | ✓ |  
  | (v) | Degenerating (pure accommodation; *A*>0, *N*=0) | ✓ |  
  | (vi) | Progressive if hard core retained | ✓ (matches your unease: success without ontology is still progressive) |  
  | (vii) | New programme (hard core altered) | ✓ |  
  | (viii) | One programme (shared hard core) | ✓ (conflict with (vii) resolved: hard core defines unity) |  
  | (ix) | **Stagnant** (no rivals; *N*=0) | ✓ (not yet degenerating) |  
  | (x) | Programme degenerating; **branch is progressive subprogramme** | ✓ |  

  ---

  ### **Testing Additional Scenarios**  
  1. **Programme with computer-generated predictions**:  
     - *If predictions are selected post-hoc from a model space*: Accommodations (*A*>0), **degenerating** (no *genuine* novelty).  
     - *If predictions are pre-announced and theory-driven*: Novel predictions (*N*>0), **progressive**.  
     - *Key*: Novelty requires the modification to *entail specific, unexpected facts* pre-corroboration.  

  2. **Programme sustained by one well-funded group**:  
     - Funding is irrelevant. Appraisal depends on *N*/*A* ratio and hard core stability. Could be progressive or degenerating.  

  3. **Two programmes merging protective belts**:  
     - **Degenerating** for both originals (sign of ad hoc collaboration). If hard cores merge, it’s a **new programme** with no inherited credit.  

  ---

  ### **Conflicts with Your Verdicts and Costs**  
  1. **Case (ii) backward-reaching progress**:  
     - *Conflict*: You want progress at modification; principle requires corroboration.  
     - *Cost of alignment*: Add a "predictive potential" clause (e.g., modifications must generate *testable, unique* predictions). But this risks subjectivity.  
     - *Why keep as-is*: Lakatos emphasizes *actual* problem-solving. Hindsight is unavoidable for corroboration.  

  2. **Case (vi) ontological unease**:  
     - *Conflict*: You feel uneasy crediting a programme with disproven entities.  
     - *Cost of alignment*: Add "ontological parsimony" as a secondary criterion. This complicates appraisal and diverges from Lakatos.  

  3. **Case (iii) extra credit for pre-data predictions**:  
     - *Conflict*: Principle gives equal weight to (ii) and (iii) once corroborated.  
     - *Cost of alignment*: Weight *N* by "temporal priority" (e.g., pre-data > post-data). Adds complexity but is defensible.  

  ---

  ### **Real-Time Surrogate for Appraisal**  
  Since full appraisal requires hindsight, use this heuristic for imminent decisions:  
  > **The 3-Year Heuristic**: Over the last 3 years, if ≥50% of *P*'s modifications have led to:  
  > - **Testable novel predictions** (not yet corroborated), *or*  
  > - **Unifications** (explaining >1 anomaly with one change),  
  > then *provisionally continue*. Else, *provisionally abandon*.  

  **Applied to your student**:  
  - If their subprogramme has generated testable predictions/unifications in recent work, continue.  
  - If it only patches anomalies (no new predictions), shift them.  
  - *Rationale*: Short-term "predictive fertility" correlates with Lakatosian progress. It mirrors scientific practice (e.g., grant reviews).  

  ---

  ### **Summary**  
  This principle systematizes your verdicts by:  
  - Prioritizing *novel predictions/unifications* over accommodations (Cases i-v).  
  - Defining programmes by *hard-core commitments* (Cases vi-viii).  
  - Allowing subprogramme appraisal (Case x) and stagnation without rivals (Case ix).  
  - **Trade-offs**: It cannot judge progress pre-corroboration (without surrogate) and retains Lakatos's ontology-agnosticism.  

  For your student, use the 3-Year Heuristic—it converts Lakatos into a actionable metric while acknowledging the role of time.
