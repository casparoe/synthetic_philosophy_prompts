prompt: |-
  im in a philosophy of mind seminar this term and we did the access/phenomenal distinction and global workspace theory last week, and I keep going round in circles about what actual clinical practice is committed to, so I want to use it as a test case.

  Here is the practice. Someone survives a catastrophic brain injury: eyes open, sleep-wake cycles, no command following, no purposeful movement. The diagnosis turns on whether you can get anything out of them — follow this command, blink twice, say your name. That is what gets scored at the bedside. Lately there is a second channel: put the patient in a scanner, ask them to imagine playing tennis versus imagine walking through their house, and if the activation patterns come apart on request, they get reclassified as conscious even though nothing changed behaviourally. I think people call that covert awareness. Same shape in anaesthesia: depth is titrated to movement, to haemodynamic response, to some processed EEG number, and accidental awareness during surgery is treated as a serious harm. So: access is the test. But experience is what everyone agrees is at stake. When people argue about these patients they are arguing about whether there is someone there, whether they are suffering, whether it is OK to withdraw assisted nutrition — not about whether a representation has been made available to downstream consumer systems. And note the thing that bugs me: once the scanner channel is found, clinicians and families talk as if the patient had been conscious the whole time, trapped and frightened, when by hypothesis the only thing that changed was our access to them. Meanwhile the same teams still sedate and give analgesia to patients they have officially diagnosed as not conscious, because you cannot rule it out.

  So: reconstruct the implicit theory. Does the practice presuppose something like the identity of phenomenal consciousness with access or with global availability, or is its real commitment only epistemic — access is the one evidence channel we have, plus a brutal cost asymmetry between under- and over-attributing? Be strict about the difference between what the practice needs and what it merely sits well with, and tell me which views it actually rules out. Also disambiguate for me, because I think three different things are getting collapsed in seminar: Block's access consciousness, global broadcast as a mechanism, and plain behavioural responsiveness at the bedside.

  Two cases I made up, please take them seriously. Call the first silent broadcast: the workspace is fully intact, ignition and broadcast and downstream consumption all happen normally, but every output channel is destroyed, and there is in principle no measurable signature, not even a neural one, that distinguishes the patient's mental activity from noise. Call the second an orphaned island: a sensory system produces structured, valenced, miserable experience that never reaches the workspace and leaves no trace in any downstream system at all — no ignition, no availability, nothing. Is the first patient conscious on a global workspace view, and is the practice systematically wrong about them if so? Is the second one suffering? Which of the two does the practice have to have a view about, and which of the two does more work in showing what the practice is committed to? My suspicion is that GWT is not the view that best fits the practice but the one that makes it look incoherent, but I can't get the argument straight.

  Then: if we swapped the implicit view for a strict access-identity view, what would actually change at the bedside, and what would change if we swapped it for a view on which orphaned islands are real and common? And be honest about where the practice is underdetermined and several theories license the same behaviour — including whether the precautionary reading explains everything and the metaphysics never shows up at all.

  Give me the prose answer first, then a JSON object at the end with exactly these fields:
  - practice_core: one sentence stating the practice
  - strict_presuppositions: array of strings, what must be true for the practice to make sense
  - epistemic_or_metaphysical: string, where the line falls and why
  - three_way_disambiguation: object with keys block_access, global_broadcast, behavioural_responsiveness, each a string
  - ruled_out: array of strings, views the practice cannot live with
  - merely_compatible: array of strings, views it fits but does not require
  - case_matrix: object with keys silent_broadcast and orphaned_island, each an object with keys gwt_verdict, phenomenal_first_verdict, practice_implicit_verdict, each a string
  - load_bearing_case: string, which case does more work and why
  - internal_tension: string, the sharpest inconsistency in the practice as described
  - what_would_change: array of strings, concrete changes at the bedside under a strict access-identity view
  - underdetermined: string, where the practice stays silent and several theories license it
reasoning: |-
  Hmm, let me tackle this philosophy of mind problem about clinical practice and consciousness. The user is in a seminar discussing the access/phenomenal distinction and Global Workspace Theory (GWT), and they're confused about what clinical practice actually commits to regarding disorders of consciousness.

  The core clinical practice involves diagnosing disorders of consciousness through behavioral responses (like command following) or neural signatures (like fMRI patterns during mental imagery tasks). Clinicians treat detected awareness as evidence of consciousness that matters morally - for suffering, personhood, and life-sustaining decisions. But there's tension because they use access-based tests while caring about phenomenal consciousness, and they take precautions like sedation even for "unconscious" patients.

  First, I need to reconstruct the implicit theory behind this practice. The practice seems to presuppose that access (behavioral or neural) is the only reliable evidence for consciousness, given our epistemic limitations. It doesn't necessarily commit to access being identical to consciousness. The precautionary principle explains why clinicians sedate unresponsive patients - they can't rule out consciousness, so they avoid potential suffering.

  Now, disambiguating the three concepts: Block's access consciousness is about information availability for reasoning/report; global broadcast is GWT's mechanism for widespread neural availability; behavioral responsiveness is the practical bedside measure.

  For the thought experiments: In "silent broadcast" (intact workspace but no outputs), GWT would say conscious but practice would call unconscious. In "orphaned island" (unreportable suffering without global access), GWT says unconscious but practice might worry about suffering via precaution. The orphaned island case does more work in exposing tensions because it challenges whether access is necessary for morally relevant experience.

  The practice rules out views that deny any link between access and phenomenology, but remains compatible with various theories including GWT (interpreted evidentially) and non-GWT views. Strict access-identity views would eliminate precautionary measures, while orphaned-island-accepting views might expand them - but in reality, practice is underdetermined on these metaphysical questions.

  The sharpest inconsistency is treating neural access as revealing previously existing consciousness (the "trapped" narrative) while maintaining precaution for the unresponsive. This shows a conflation of evidence with thing evidenced.

  Concrete changes under strict access-identity: no analgesia/sedation for unresponsive patients, no fMRI searches for covert awareness. But current practice is likely driven by epistemic caution rather than metaphysical commitments.

  The underdetermined area is whether inaccessible phenomenology exists - precaution covers this gap without resolving the metaphysics. The practice functions based on evidence and risk management, not settled theory.
answer: |-
  Here's a precise reconstruction of the clinical practice's implicit commitments, analyzed through your test cases and philosophical distinctions.

  ### Prose Analysis
  The clinical practice for diagnosing disorders of consciousness (DoC) treats **accessibility**—behavioral responsiveness or neural signatures of command-following—as the sole, operationally necessary criterion for attributing conscious states with moral significance. This practice is fundamentally **epistemic**, not metaphysical. It presupposes that accessibility (behavioral or neural) is the only reliable evidence for phenomenal consciousness due to the asymmetry of costs: false negatives (under-attribution) risk profound moral harm (e.g., unrelieved suffering in a "trapped" patient), while false positives (over-attribution) incur material/resource costs and potential overtreatment. Thus, the practice is structured around **detection risk management**, not a theory of consciousness. 

  The "trapped and frightened" narrative reveals a pragmatic conflation of evidence with the thing evidenced, but it is not a metaphysical commitment—it is a **precautionary heuristic** driven by the cost asymmetry. Similarly, sedation for "unconscious" patients reflects epistemic humility ("cannot rule it out"), not a belief in inaccessible phenomenology. 

  **Disambiguation of Key Terms**:  
  - **Block's access consciousness**: Information availability for global reporting/control (conceptual).  
  - **Global broadcast (GWT)**: A specific neural mechanism for information integration and distribution (empirical).  
  - **Behavioral responsiveness**: The practical, observable proxy for access at the bedside (clinical).  

  **Test Case Analysis**:  
  - **Silent broadcast** (intact workspace, no outputs):  
    - *GWT verdict*: **Conscious** (workspace ignition = phenomenality).  
    - *Phenomenal-first verdict*: **Unconscious** (no functional impact → no moral status).  
    - *Practice verdict*: **Unconscious** (no evidence → no attribution).  
    The practice would systematically misclassify this patient as unconscious, exposing a **false negative risk**.  
  - **Orphaned island** (unreportable suffering, no global access):  
    - *GWT verdict*: **Unconscious** (no broadcast → no phenomenality).  
    - *Phenomenal-first verdict*: **Suffering** (phenomenality exists independently).  
    - *Practice verdict*: **Not suffering** (no evidence → no precaution beyond sedation's risk mitigation).  
    This case challenges the practice's sufficiency: if such islands exist, the practice ignores genuine suffering.  

  **Load-Bearing Case**: **Orphaned island** does more work. It forces the question: *Is inaccessible suffering possible?* If yes, the practice's evidence-based approach is morally inadequate. Silent broadcast only challenges diagnostic reliability (an epistemic gap), while orphaned island challenges the practice's core moral logic (a metaphysical gap).  

  **Internal Tension**: The sharpest inconsistency is **treating neural access (fMRI) as revealing pre-existing consciousness** ("trapped all along") while simultaneously **denying the possibility of undetectable consciousness** in behaviorally unresponsive patients without fMRI activation. This conflates evidence with ontology: access is made both a necessary and sufficient condition for phenomenality in practice, yet contradicted by precautionary measures.  

  **What Would Change Under Alternative Views**:  
  - Under **strict access-identity** (phenomenality ≡ access):  
    1. No sedation/analgesia for access-negative patients (no phenomenality to protect).  
    2. fMRI "covert awareness" would not imply prior suffering ("trapped" narrative abandoned).  
    3. Withdrawal of care justified solely on access tests.  
  - Under **widespread orphaned islands**:  
    1. Universal sedation/analgesia for all unresponsive patients (default assumption of hidden suffering).  
    2. fMRI searches irrelevant (islands are undetectable by definition).  

  **Underdetermined Aspects**: The practice **remains agnostic on whether inaccessible phenomenality exists**. Precautionary measures (sedation) are licensed by **all** theories that accept epistemic limitations (e.g., GWT + humility, dualism, panpsychism). Only eliminativism about phenomenality (e.g., zombie-ism) or strict access-identity would eliminate precautions—but the practice avoids these extremes. Thus, **the metaphysics "never shows up"**; the precautionary principle explains all actions.  

