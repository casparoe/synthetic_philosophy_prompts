  - Acknowledge the unresolved scientific question about shrimp sentience without resolving it.

  Structure:
  We'll create a document with the following sections:

  1. **Document Overview**: Purpose and scope.
  2. **Definitions**: Key terms, including "welfare" defined by measurable parameters.
  3. **Service Level Objectives (SLOs)**: Specific targets with numbers, including error budgets.
  4. **Key Metrics and Dashboards**: What we monitor and how.
  5. **Incident Response**: What to do when things go wrong, including when shrimp appear to be suffering.
