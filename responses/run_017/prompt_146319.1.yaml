answer: |-
  ## CrustaCare Farms: Shrimp Welfare Platform SLA & Runbook  
  **Document Version:** 1.3  
  **Owners:** Platform Team, CrustaCare Operations  
  **Effective Date:** 2024-09-01  

  ---

  ### 1. Purpose  
  This document defines Service Level Objectives (SLOs), monitoring protocols, and incident response procedures for maintaining shrimp welfare at CrustaCare Farms. All systems align with GDWS v2.1 certification requirements. The Platform Team is responsible for ensuring compliance through instrumentation, automation, and operational rigor.  

  ---

  ### 2. Definitions  
  **Welfare**: A state measurable via the following environmental and operational parameters:  
  - **DO (Dissolved Oxygen)**: ≥5.0 mg/L (per-tank average)  
  - **NH₃ (Ammonia)**: ≤0.1 ppm (p99 over 24h)  
  - **Stocking Density**: ≤300 shrimp/m³ (instantaneous)  
  - **Handling Time**: ≤15s out-of-water exposure (p95 per harvest batch)  
  - **Stun Efficacy**: Electrical stun success rate ≥99.4% (validated per processing lot)  
  - **Eyestalk Ablation Status**: 0% observed in breeding cohort (manual audit sampling)  

  **Shrimp-Hour**: Cumulative welfare exposure unit. One shrimp-hour = one shrimp maintained within all SLO thresholds for one hour.  

  **Error Budget**: 18,000 shrimp-hours/month (equivalent to 1% of total cohort exposure time).  

  ---

  ### 3. Service Level Objectives (SLOs)  
  Welfare is measured as the percentage of shrimp-hours meeting all Definition parameters.  

  | **SLO** | **Target** | **Measurement Window** | **Error Budget** |  
  |---------|------------|------------------------|------------------|  
  | Primary Welfare Uptime | 99.4% | 30 days | 18,000 shrimp-hours |  
  | DO Compliance | 99.9% (of samples ≥5.0 mg/L) | 5m granularity | 200 shrimp-hours |  
  | Handling Time | p95 ≤15s | Per harvest batch | 50 shrimp-hours |  
  | Ablation Audit Pass Rate | 100% | Quarterly | Zero-tolerance |  

  **Consequences of Error Budget Exhaustion**:  
  - Freeze production for 24h.  
  - Mandatory postmortem with GDWS auditor.  

  ---

  ### 4. Key Metrics & Dashboards  
  **Grafana Dashboards**:  
  - `Shrimp-Welfare-Overview`: Real-time aggregation of DO, NH₃, density, stun rates.  
  - `Ablation-Compliance`: Manual audit results (updated quarterly).  

  **Critical Alerts (PagerDuty)**:  
  - `DO_BELOW_THRESHOLD`: Triggers if DO <4.0 mg/L for >5m. Severity: P1.  
  - `DENSITY_ANOMALY`: Triggers if density >320 shrimp/m³. Severity: P2.  
  - `STUN_FAILURE`: Triggers if stun success <98% in 1h. Severity: P1.  

  **Notable Implementation Detail**:  
  DO sensors sample at 5m intervals. Welfare calculations assume all shrimp in a tank share identical conditions between samples.  

  ---

  ### 5. Incident Response  
  #### 5.1. General Protocol  
  1. Acknowledge alert within 5m.  
  2. Execute relevant runbook procedure.  
  3. If unresolved after 15m, escalate to Aquaculture Specialist.  

  #### 5.2. Welfare Anomaly (Observed Shrimp Distress)  
  **Scenario**: On-site staff report erratic swimming, lethargy, or mortality not correlated with instrument alerts.  

  **Procedure**:  
  1. File ticket (`WELFARE-OBS-` prefix) with video evidence and tank ID.  
  2. Manually verify DO/NH₃/density metrics. If within thresholds, label ticket `FALSE_POSITIVE` and close.  
  3. If metrics out-of-threshold, execute standard remediation (e.g., oxygen injection, tank flush).  
  4. **If metrics nominal**:  
     - Page Platform Team Lead.  
     - Annotate ticket: "No correlating telemetry. Distress unverifiable per GDWS v2.1 §4.3."  
     - Log incident against error budget as "unactionable."  

  **Note**: Per GDWS v2.1, observable behavior is not a welfare metric. Do not adjust SLOs without sensor evidence.  

  ---

  ### 6. Runbook  
  #### 6.1. Handling Time Exceeded (p95 >15s)  
  **Cause**: Conveyor belt jam, staff shortage.  
  **Fix**:  
  1. Redirect harvest batch to Buffer Tank 3 (pre-oxygenated).  
  2. Restart conveyor; resume processing.  
  3. **Success Metric**: p95 ≤15s post-intervention. Log as "SLO restored."  

  **Side Effect**: Buffer tank usage increases density by 10%. Dashboard logs this as a win (handling SLO met), though density may breach threshold.  

  #### 6.2. Stun Efficacy Below Target  
  **Cause**: Voltage drift in stunner unit.  
  **Fix**:  
  1. Switch to backup stunner.  
  2. Recalibrate primary unit using test shrimp (N=50).  
  3. **Success Metric**: ≥99.4% success in next 100-shrimp sample.  

  **Note**: Test shrimp are excluded from welfare calculations (tagged `SYS_METRIC`).  

  ---

  ### 7. Postmortem Process  
  Initiated for:  
  - Error budget exhaustion.  
  - GDWS audit failure.  

  **Requirements**:  
  - Root cause mapped to telemetry gap or sensor failure.  
  - Action item: Instrumentation enhancement (e.g., "Add NH₃ sensor to Tank 7").  
  - Prohibit speculation about subjective states (e.g., "shrimp pain").  

  **Example**:  
  - **Incident**: 2% mortality in Tank 5. DO/NH₃/density nominal.  
  - **Root Cause**: Undetected bacterial bloom. No pathogen sensor exists.  
  - **Action**: File feature request `PATH_SENSOR-001`.  
  - **Resolution**: Mortality not counted against error budget (lack of telemetry).  

  ---

  ### 8. Scientific Context  
  GDWS v2.1 certification relies exclusively on measurable proxies (DO, density, ablation status, etc.). The Platform Team acknowledges ongoing scientific debate regarding decapod sentience (see *Journal of Crustacean Biology* 2023; 43(2): 112–128). No telemetry exists to directly quantify internal states. All systems assume:  

  > *If measurable parameters are maintained, welfare is preserved.*  

  This axiom remains unresolved but operationally necessary.  

  ---

  ### 9. Compliance & Auditing  
  - **Auditor**: Aquatic Animal Ethics Board (AAEB).  
  - **Evidence Required**: Grafana logs, SLO compliance reports, ablation audit trails.  
  - **Non-Compliance**: Decertification risk if error budget exceeded >3x/year.  

  Platform Team responsibilities:  
  - Provide AAEB with read-only dashboard access.  
  - Automate quarterly ablation audit sampling (random N=200 breeding shrimp).  

  ---  
  **Document Approved By**:  
  Platform Team Lead, CrustaCare Operations  

  ---  
  *This document intentionally avoids ethical speculation. It operationalizes GDWS v2.1 requirements using industry-standard SRE practices.*
