prompt: |-
  hey — im helping a tiny grantmaker (three staff, maybe $400k a year to move) redo their cause-scoring sheet. Right now it's plain ITN: importance × tractability × neglectedness, each 1–5, multiplied. Someone on the board wants to bolt on five extra "correction terms," and I cant tell which of them are real signal and which are just a way to smuggle in someone's favorite cause:

  1. crowding-out — how much of our marginal dollar just displaces another funder's dollar instead of paying for new work
  2. feedback speed — how many years pass before you find out whether you were wrong
  3. talent-vs-capital bottleneck — whether the field is short of good people or short of money (the pitch being that neglectedness should only count if its money thats missing)
  4. reversibility — how much of the damage you could undo if you backed the wrong horse
  5. legibility discount — how much of the apparent importance is really just an artifact of the problem being easy to measure

  Rate each 0–10 on how much it should actually move a naive ITN score, rank them, and give one line per term saying why it lands where it does. One more thing: we're also deciding whether next year's money should go to one extra staff hire instead of grants — does the sheet need a different score depending on whether the thing being allocated is dollars or a person's year of attention, and if so which of the five terms changes most or flips direction?
reasoning: |-
  Okay, the user is helping a small grantmaker revamp their cause-scoring system. They currently use the ITN framework—Importance, Tractability, Neglectedness—each scored 1-5 and multiplied. A board member wants to add five new factors, and the user needs to evaluate which are legitimate signals versus biases favoring certain causes. They also need advice on whether the scoring should differ if they hire staff instead of giving grants.

  First, I need to assess each proposed correction term. Let's go through them one by one.

  **Crowding-out (Factor 1):** This addresses whether a grant displaces other funding. If a grant just replaces what others would fund, the impact is low. High crowding-out should lower the score. This seems like a valid adjustment to neglectedness. Rating: 8/10.

  **Feedback Speed (Factor 2):** This is about how quickly you learn if the intervention worked. Slow feedback makes it hard to iterate and improve. This affects tractability and should be penalized. Valid point, especially for a small funder needing to learn quickly. Rating: 7/10.

  **Talent-vs-Capital Bottleneck (Factor 3):** Claims neglectedness only matters if money is the bottleneck. But often, both talent and capital are needed. This could unfairly penalize talent-constrained fields. Problematic as it might bias toward certain causes. Rating: 3/10.

  **Reversibility (Factor 4):** How easy it is to undo damage if things go wrong. Important for risk management. High reversibility lowers risk, making a project more attractive. Valid adjustment, especially for cautious funders. Rating: 6/10.

  **Legibility Discount (Factor 5):** This counters overemphasizing easily measurable problems. Important because some critical issues aren't quantifiable. Prevents undervaluing complex causes. Strong signal, rating: 9/10.

  Now, ranking these: Legibility Discount is top because it corrects a major ITN flaw. Crowding-out next, as it refines neglectedness. Feedback Speed third for learning efficiency. Reversibility fourth for risk. Talent Bottleneck last as it's too restrictive.

  Next, the user asks about allocating to staff hires versus grants. Staff time is about talent, so bottlenecks matter more. If hiring staff, the talent bottleneck factor becomes crucial—flip it to prioritize talent-constrained areas. Other factors like crowding-out and reversibility may become less relevant. Also, legibility discount remains important regardless.

  The user's deeper needs: They want an objective scoring system without board biases. They need clarity on which factors add value versus noise. Also, efficiency in decision-making for a small team. Ensuring the scoring adapts to different resource types (money vs. people) is key for their flexibility.
answer: |-
  Here's a clear evaluation of each proposed correction term for your ITN scoring sheet, ranked by impact on naive ITN (0-10 scale), followed by analysis of the staff-hire vs. grants question:

  ### Correction Term Ratings & Rankings (Highest to Lowest Impact)
  1. **Legibility Discount (Rating: 9/10)**  
     *Why*: Directly counters a major flaw in ITN – overvaluing easily measurable problems while undervaluing critical but complex/abstract issues (e.g., mental health vs. concrete infrastructure).  
  2. **Crowding-out (Rating: 8/10)**  
     *Why*: Fundamental to impact – if your $1 displaces $1 elsewhere, your net impact is near-zero. Adjusts neglectedness *effectiveness*, not just nominal funding gaps.  
  3. **Feedback Speed (Rating: 7/10)**  
     *Why*: Slow feedback loops cripple learning and adaptation (especially for small funders). High tractability scores are misleading if you won’t know outcomes for 20 years.  
  4. **Reversibility (Rating: 6/10)**  
     *Why*: Reduces downside risk – irreversible harm (e.g., geoengineering) demands higher certainty than reversible bets (e.g., pilot education programs).  
  5. **Talent-vs-Capital Bottleneck (Rating: 3/10)**  
     *Why*: Overly simplistic – fields often need both, and "talent bottlenecks" usually *are* addressable with capital (training, salaries). Risks arbitrary cause bias.  

  ---

  ### Staff Hire vs. Grants: Scoring Implications  
  **Yes, the scoring sheet SHOULD differ** based on whether you’re allocating dollars or a full-time staff member’s capacity. Key shifts:  

  | Factor               | Change for Staff Hire vs. Grants                          | Magnitude of Change |
  |----------------------|----------------------------------------------------------|---------------------|
  | **Talent Bottleneck** | **FLIPS DIRECTION**: Prioritize talent-constrained areas for staff time (e.g., field-building), fund capital-constrained areas with grants. | High (Critical) |
  | **Crowding-out**     | **Less Relevant**: Staff time is less fungible than money – harder to "displace" equivalent talent. | Medium ↓ |
  | **Feedback Speed**   | **More Important**: Staff time allows proactive monitoring – essential for slow-feedback causes. | Medium ↑ |
  | **Legibility Discount** | **Equally Vital**: Staff can investigate hard-to-measure problems better than grants alone. | Neutral |
  | **Reversibility**    | **Contextual**: Staff expertise may help mitigate irreversible risks. | Low ↑ |

  **Actionable Recommendation**:  
  - **For GRANTS**: Use Legibility Discount, Crowding-out, and Feedback Speed as core adjustments to ITN.  
  - **For STAFF HIRE**: **Flip the Talent Bottleneck** to prioritize talent gaps, emphasize Feedback Speed, and de-prioritize Crowding-out. Add a "Leverage Multiplier" factor (how much 1 staffer can amplify grant impact).  

  **Why this works**: Staff time excels at addressing information asymmetry (Legibility), iterative learning (Feedback), and talent gaps – but doesn’t directly solve capital shortages. Grants are optimal for scalable, capital-constrained opportunities with clear displacement risks. The board’s proposed terms add value if applied contextually, but the Talent Bottleneck term is only defensible when evaluating staff allocation.  

  > 💡 **Implementation Tip**: Run a pilot scoring with/without these terms on past grants. If a term consistently favors one board member’s pet causes *without strong justification*, it’s likely bias.
