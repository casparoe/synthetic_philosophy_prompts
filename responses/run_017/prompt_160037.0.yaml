  Hmm, the user is a science journalist who's been covering the contentious debate around habitat restoration and wild animal suffering. They need to give a toast at the retirement dinner of a marsh restoration director, with a divided audience: traditional conservationists who see the restored marsh as positive, and welfare biologists who question whether more wildlife means more suffering.

  The key challenges are navigating two complex issues without turning the toast into an academic debate: the "replacement problem" (restoration swapping long-lived specialists for short-lived species with high juvenile mortality) and the "credit-for-absence problem" (whether preventing lives counts as reducing suffering). The toast must honor the honoree's dedication while remaining neutral on the ethical debate.

  The honoree personally finds the welfare argument "grim nonsense," so the toast should reflect her perspective without undermining her work. The audience is split 50/50, so the language needs to be inclusive—grounded in observable actions rather than disputed outcomes. Phrases like "giving land back to the tides" focus on concrete efforts rather than abstract welfare calculations.

  For the tricky concepts: The replacement problem is addressed by celebrating the marsh's return without claiming to know if its residents are "better off," using phrases like "a place where the marsh gets to be the marsh again." The credit-for-absence problem is handled by questioning the idea of taking "credit for absence," framing it as unnatural to the honoree's hands-on ethos.

  The toast avoids jargon entirely—no "net welfare" or "juvenile mortality." Instead, it uses vivid, accessible imagery: "soggy ground that remembers how to breathe," "the splash-and-chatter of a world waking up." Humor helps too, like calling her "stubborn as a salt-stunted pine."

  The ending unites both sides by focusing on shared values: devotion to a cause bigger than oneself. Lines like "she chose to call this place back into being" sidestep the suffering debate by emphasizing intention over outcome. The final call to toast "a woman who gave her life to something that mattered" works because both camps can agree her commitment mattered, regardless of their stance on the ethics.

  For the annotation: The only line that subtly leans toward welfare ethics is "whether that’s a kindness or a burden isn’t ours to say," as it entertains the possibility of restoration adding suffering. But it's framed as humility ("isn’t ours to say"), making it palatable to traditionalists. Crucially, no line assumes restoration inherently reduces suffering—phrases like "more life" are descriptive, not evaluative.
