  Here is a tested, repaired principle, built from your cases and designed to generate verdicts rather than redescriptions, followed by its application to your questions:

  ### The Revised Principle
  **An incurred cost is irrational to honor if and only if:**  
  *(1) It is treated as a recoverable loss (directly or through compensation), or*  
  *(2) It creates a reason that fails the "Independent Value Test" (IVT).*  

  **Independent Value Test (IVT):** A cost-generated reason (preference, commitment, relationship, etc.) must be:  
  *(a) Authentic*: Arising from voluntary, non-coercive engagement with the object (not trauma/exploitation).  
  *(b) Identity-Constitutive*: Integrated into the agent's practical identity or values in a way they endorse upon reflection.  
  *(c) Non-Arbitrary*: Its value isn’t *solely* dependent on the magnitude of the sunk cost itself.  

  **Completion Value exists only when:**  
  *(i) The remaining cost is minimal (≤ 10% of total expected effort/cost), and*  
  *(ii) Completion yields closure, knowledge, or symbolic meaning that is intrinsically valued by the agent.*  

  **Another’s spent labor generates a reason for you only if:**  
  - You have a preexisting obligation to that person (e.g., familial duty, promise), *or*  
  - Their labor was explicitly for your benefit under a relationship of mutual care/trust.  

  ---

  ### Your Verdicts Overturned & Defended
  1. **Must overturn 6(a) (the novel):**  
     Finishing 700 pages of a tedious novel because "you’ve come this far" fails IVT. The preference to finish isn’t identity-constitutive (you don’t endorse valuing completion of drudgery), and the "completion value" is fallacious: 3 hours is minimal, but closure lacks intrinsic worth here. *Verdict: Quitting is rational.*  

  2. **Must overturn 5(c) (mother’s cookbook) *if* no independent value exists:**  
     If finishing *only* honors sunk costs (not your relationship with your mother), it fails. But if it expresses familial duty (preexisting obligation), continuing is valid. *Verdict: Permissible only if grounded in duty, not cost.*  

  3. **All other verdicts stand:**  
     - *Disposition (3):* Forward-looking habit formation (IVT-passing reason).  
     - *Car restoration (4a):* Authentic, identity-constitutive preference (IVT-passing).  
     - *Initiation club (4b):* Coercive, unendorsed loyalty (fails IVT-a,b).  
     - *Contractor (5a)/Military (5b):* No obligation to honor wasted labor; lives not "spendable" (fails labor clause).  
     - *Pottery class (6b):* No completion value (remaining cost ≠ minimal; no closure value).  

  ---

  ### Verdicts on New Cases (via Principle)
  **(i) Supplier with bespoke tooling:**  
  - **Irrational to honor.** The sunk cost (tooling) is theirs, not yours. No preexisting obligation exists to compensate them for unrequested investments. Their expectation exploits the fallacy. *Verdict: Refuse the price hike; switch suppliers if needed.*  

  **(ii) Fund manager with losing position:**  
  - **Irrational to continue.** The sunk cost (time/money) fails IVT: persisting due to past investment isn’t authentic (it contradicts her current belief) or identity-constitutive (fiduciary duty demands cutting losses). Being observed worsens the fallacy but doesn’t validate it. *Verdict: Exit the position immediately.*  

  **(iii) Tuition refund for completion:**  
  - **Not irrational.** The refund is a *future* benefit (not sunk cost recovery). Completing triggers a new gain. Sunk costs are irrelevant; the decision is forward-looking: "Is the refund worth the disliked term?" *Verdict: Rational if refund value > cost of final term.*  

  ---

  ### Agent/Currency Dependence
  The **core principle (IVT + labor clauses)** applies universally. However:  
  - **States:** Honor sunk costs *least* justifiably. Lives/treasure aren’t "investments" to spend (violates IVT-c and labor clauses).  
  - **Firms:** Fiduciary duty amplifies IVT-b (identity as steward). Sunk reputation costs may *seem* rational but usually fail IVT.  
  - **Currencies:**  
    - **Money/Time:** Easiest to dismiss as sunk.  
    - **Effort/Reputation:** May generate IVT-passing reasons (e.g., identity projects).  
    - **Lives:** *Never* justifiable as sunk costs (no agent "owns" them to spend).  

  ---

  ### Why This Works
  - **Falsifiable:** Overturns your intuitive 6(a) and restricts 5(c).  
  - **Prevents Redescription:** IVT criteria are testable (e.g., "Would I value this if the cost were lower?" for IVT-c).  
  - **Clarifies Hard Cases:**  
    - *4a vs. 4b:* Car restoration is authentic/voluntary; club initiation is coercive (IVT-a).  
    - *Completion Value:* Only valid for trivial remaining effort + intrinsic closure (e.g., a 5-minute puzzle, not a novel).  

  This framework accepts that sunk costs *can* alter our reasons—but only when they transform our values or relationships in IVT-compliant ways. All else is fallacy.
