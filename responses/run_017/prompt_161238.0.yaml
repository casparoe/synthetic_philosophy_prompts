answer: |-
  Here’s your desiderata list for a theory of biological function, tailored to your needs:

  ### Core Non-Negotiables (Failure here disqualifies the theory)
  1. **Malfunction/Dysfunction**  
     *Requirement:* Must distinguish *broken* parts (e.g., a heart that can’t pump) from non-functional parts.  
     *Case:* A diseased heart in medicine — "function" implies a *norm* it fails to meet.  
     *Why non-negotiable:* Essential for medical/pathology applications.  

  2. **Selection History Relevance**  
     *Requirement:* Must explain why traits *have* functions due to past selection.  
     *Case:* Human hearts pump blood *because* pumping conferred past fitness.  
     *Why non-negotiable:* Explains adaptation in evolutionary biology.  

  3. **Vestigial Traits**  
     *Requirement:* Must explain how a trait can have *no current function* despite past function.  
     *Case:* Whale pelvic bones (formerly for walking, now functionless).  
     *Why non-negotiable:* Shows function isn’t just about current utility.  

  ### Critical but Contested Desiderata (Theories prioritize differently)
  4. **Exaptations/Novel Utility**  
     *Requirement:* Must handle traits co-opted for new roles *not* originally selected for.  
     *Case:* Feathers (selected for insulation, later exapted for flight).  
     *Tension:* Selected-effect theories struggle if "function" is only past selection.  

  5. **New Environments**  
     *Requirement:* Traits should retain function even in environments where they no longer confer fitness.  
     *Case:* A squirrel heart still *functions to pump blood* in zero gravity (even if useless).  
     *Tension:* Causal-role accounts handle this easily; selected-effect may need tweaks.  

  6. **Designed Organisms**  
     *Requirement:* Assign functions to traits in synthetic organisms lacking evolutionary history.  
     *Case:* A lab-designed microbe’s toxin-production system.  
     *Tension:* Selected-effect theories fail without history; causal-role can include design intent.  

  7. **Multi-Level Functions**  
     *Requirement:* Same item can have different functions at different scales (e.g., gene vs. organism).  
     *Case:* A gene may function to regulate cell growth (cellular level) but cause cancer at organism level.  
     *Case:* Mitochondria produce ATP (cell function) enabling muscle movement (organism function).  

  ### Your Time-Scale Desideratum (Crucial & Underrated)
  8. **Time-Scale Indexing**  
     *Requirement:* Must clarify whether function refers to:  
     - (a) What the trait does *now* in the organism’s lifetime (proximate),  
     - (b) What it was selected for (evolutionary),  
     - (c) What it *should* do under ideal/normal conditions (normative).  
     *Why it’s essential:* These often conflict!  
     - A vestigial appendix has *no evolutionary function now*, but may have *proximate immune roles*.  
     - Medical "malfunction" uses (c), while paleobiology uses (b).  
     *Hidden Work:* Theories that blur these scales (e.g., collapsing b & c) create ambiguity in function claims.  

  ### Key Tensions & Dealbreakers
  - **Biggest Knockout Test:** **Malfunction (#1)**. Causal-role accounts often fail this (if something currently contributes, is it *really* broken?).  
  - **Sharpest Conflict:** **Vestigial Traits (#3) vs. Novel Utility (#4)**. Selected-effect handles #3 but stumbles on #4; causal-role handles #4 but struggles with #3.  
  - **Time-Scale (#8) vs. Simplicity:** Requiring explicit indexing adds nuance but may overcomplicate "function" for daily bio use.  

  ### Where Theories Fail Briefly
  - **Selected-Effect (Etiological):**  
    Fails on **designed organisms (#6)** (no history) and **novel exaptations (#4)** (only past selection counts).  
  - **Causal-Role (Systemic):**  
    Fails on **malfunction (#1)** (if a broken part contributes *nothing*, is its "function" gone?) and **vestigials (#3)** (they do nothing now, but had a function).  

  This gives you a map: Demand malfunction handling and history-sensitivity for your medical/evo purposes, but expect trade-offs on exaptations and designer cases. Time-scale indexing is a legit demand — it’s why some philosophers hybridize theories.
