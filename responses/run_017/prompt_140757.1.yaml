prompt: |-
  A friend of mine and I spent two hours last night arguing about whether a change we are considering is really a Pareto improvement, and we never settled it, so I now have to teach the idea properly rather than gesture at it. The setting: we can alter the default configuration of a system many users interact with. Call an intervention a *safe* Pareto improvement over the status quo when, for every user, expected utility is weakly higher under the intervention than under the status quo under every prior in some set of priors we are willing to countenance; call it *doubly safe* when, in addition, no user's expectation falls once she learns the intervention has been adopted and is offered a genuine opt-out. Our dispute was whether the first condition already settles the ethics: I said yes, she said the second is the whole point.

  Next week I have eighty minutes with a group of our engineers to explain the concept. They are fluent in expected utility and in A/B testing, have no welfare economics, and will arrive assuming that "Pareto improvement" just means "nobody gets hurt" and that "safe" means "riskless."

  Do not explain the concept to me; tell me how to teach it. What has to be in place before the "safe" qualifier can so much as be stated — the ordering of ex-post, ex-ante and interim comparisons, the role the set of priors plays, whether behavioural response to the intervention belongs inside the definition at all — and why in that order rather than another. Give me the single example that should carry the whole session, and say what it must contain and what it must deliberately not contain (no money, or no more than two agents, or no lotteries: your call, with the reason). Then the misconceptions, in the order in which they will actually form in the room, each with the point in the sequence at which I head it off: I expect the slide into compensation-tests, "safe" read as riskless, ex-ante gains taken to license imposition without consent, and the thought that an opt-out is just redundancy. Give me one closing question that tells me whether they have the distinction rather than the vocabulary, and say what I should openly refuse to cover in eighty minutes.

  Under 450 words for the whole plan.
reasoning: |-
  Okay, the user needs a lesson plan to teach Pareto improvements with a focus on "safe" and "doubly safe" concepts to engineers. Let me start by understanding the core dispute: whether the first condition alone is sufficient or if the second condition (doubly safe) is essential. The engineers are familiar with expected utility and A/B testing but lack welfare economics background. They might confuse terms like "safe" as riskless.

  First, I need to structure the session logically. Start with the basics of Pareto improvements. Use a simple example without money or lotteries to avoid complications. Maybe a two-agent scenario with a shared resource. Define status quo and intervention clearly. Then introduce the ex-ante perspective using expected utility. Emphasize that prior beliefs affect expected utility.

  Next, explain the safe Pareto improvement by introducing multiple priors. Show that if the intervention is better under all considered priors, it's safe. But here's the catch: even if ex-ante expectations are non-negative, some users might object after learning the outcome. That's where the doubly safe condition comes in, requiring an opt-out to prevent objections.

  The key misconception is conflating "safe" with riskless. I need to clarify that safe here refers to robustness across priors, not absence of risk. Also, engineers might think ex-ante gains justify imposition without consent, so highlighting the opt-out in doubly safe is crucial. Another pitfall is comparing to compensation tests, which should be avoided.

  The example needs to be simple. Maybe two users sharing bandwidth. Default setup is equal. Intervention gives one user priority, which might seem beneficial ex-ante but could lead to complaints if outcomes favor one. This shows the need for the opt-out in doubly safe.

  End with a question testing understanding, like why an intervention might be safe but not doubly safe. Avoid discussing compensation tests or actual Pareto policies in depth due to time. Focus on the conceptual distinction between the two safety conditions.
answer: |-
  Here's your 80-minute plan:

  1.  **Foundation (15 mins):**
      *   **Recall Pareto Improvement (PI):** Define strictly: *Ex-post*, comparing outcomes, no one worse off, at least one better off. Engineers know "nobody hurt" is incomplete – emphasize "at least one strictly better off" *in the realized state*.
      *   **Problem:** We make decisions *ex-ante*. Outcomes are uncertain. Users have beliefs (priors). We need an *ex-ante* concept. Introduce **Expected Utility (EU)** under a prior.
      *   **Standard Ex-Ante PI:** An intervention is an *ex-ante* PI if, under a *single, agreed prior*, every user has EU weakly higher, at least one strictly higher. *Head off "safe=riskless":* EU already handles risk. "Safe" here isn't about zero risk.

  2.  **Introducing "Safe" (20 mins):**
      *   **The Crux:** Whose prior? Users may have *different* or *ambiguous* beliefs. We specify a **set of reasonable priors** we're willing to consider (e.g., based on historical data, plausible models).
      *   **Define Safe PI:** An intervention is a **Safe PI** if, *for every user* and *for every prior in our set*, the EU under the intervention is **weakly higher** than under the status quo. (Strict improvement for some user under *some* prior suffices, but weak gain for all under all priors is key). *This is the ex-ante guarantee across beliefs.*

  3.  **The Core Example (15 mins):** **Two Users (A & B), Shared Resource (e.g., bandwidth).**
      *   **Status Quo (SQ):** Fixed, equal split. Predictable. EU_A(SQ) = 5, EU_B(SQ) = 5 under all priors (trivially).
      *   **Intervention (Int):** Algorithm allocates based on (unpredictable) real-time need. *Under Prior 1 (A often needs more):* EU_A(Int) = 7, EU_B(Int) = 6. *Under Prior 2 (B often needs more):* EU_A(Int) = 6, EU_B(Int) = 7.
      *   **Is Int a Safe PI?** YES. Under *every* prior in the set {P1, P2}, both A and B have EU(Int) >= EU(SQ): (7>5, 6>5) and (6>5, 7>5). *Must contain:* Multiple priors, weak dominance for all users under all priors. *Must not contain:* Money transfers, compensation, more than two agents, complex lotteries (keep EU calc simple).

  4.  **The Dispute & "Doubly Safe" (15 mins):**
      *   **The Catch (Interim Stage):** Suppose we implement Int based on Safe PI. Later, the outcome is realized (e.g., Prior 1 was true, A got 7, B got 6). B might object: "I'm worse off *ex-post* compared to SQ (5)! Why didn't I get a choice?" *Head off "ex-ante gains license imposition":* This objection reveals the ethical gap Safe PI alone doesn't cover.
      *   **Define Doubly Safe PI:** A Safe PI where, *after users know the intervention is implemented (interim)* and are offered a **genuine opt-out** (revert to SQ), *no user ever chooses to opt-out*. Their EU *conditional on Int being the new default* is still >= SQ EU.

  5.  **Misconceptions & Clarifications (10 mins - Address as they arise, but plan order):**
      1.  *"Safe = Riskless" (Early - Step 1/2):* Reiterate EU handles risk. "Safe" = robust across *beliefs* (priors).
      2.  *Ex-Ante Gains License Imposition (Step 4):* The example shows why not. B's *ex-post* complaint highlights the need for interim consent/opt-out (Doubly Safe).
      3.  *Opt-out is just redundancy (Step 4):* No. Its existence and non-use *verifies* no user feels *interim* regret under the chosen prior. It's the ethical safeguard.
      4.  *Slide into Compensation Tests (Throughout):* Actively stop this. State: "We are *only* comparing direct allocations under uncertainty. No transfers, no compensation. Pure PI logic."

  6.  **Closing Question (5 mins):**
      *   **Test Question:** "In the Bandwidth example, Int is Safe PI. Why might it *not* be Doubly Safe? What could B plausibly say when offered the opt-out after a realization where they got 6?" (*Correct Answer:* They might say "I preferred the guaranteed 5; I don't trust the algorithm *now* / I got unlucky and want my sure thing back," showing interim EU(Int | Realization) < 5 for them).

  **Openly Refuse:** Do not cover Kaldor-Hicks compensation tests, cardinal vs. ordinal utility debates, or actual policy implementation details of Pareto principles. Stick to the core concepts and definitions within the uncertain, multi-prior setting.
