  ### Prose Plan for Ethics & Philosophy Club Session: "Choosing Children"

  **Activity Title:** The Selection Principle  
  **Duration:** 70 minutes  
  **Materials:** 
  - Whiteboard and markers
  - Index cards (pre-written with scenario details, one set per stage)
  - Timer

  **Setup (5 min):**  
  Arrange chairs in a circle. Place the whiteboard where all can see. Distribute index cards for Stage 1. Briefly explain: *"Today, we’ll explore choices about which child to have when parents have options. In every scenario, the couple will have one child either way—the choice only affects which child exists. We’ll start by choosing between two embryo profiles. After each choice, we’ll write one sentence on the board summarizing our reasoning. That sentence becomes our rule for all future stages—we can’t change it until the end. Let’s begin."*  

  **No-Lecture Rule:**  
  No upfront theory. The facilitator only reads card text, tracks time, and asks clarifying questions (e.g., *"What does ‘expected pain’ mean here?"*). No definitions, no bioethics terms.  

  ---

  ### Stage-by-Stage Instructions  
  **Total Stages:** 6 (Stage 1: write principle; Stages 2–6: apply principle without writing).  
  **Forced Choice Protocol:** Read both cards aloud. Discuss for 4–5 min. Vote. Majority wins.  

  #### **Stage 1: Severe Burden Avoidance (10 min)**  
  - **Card Text:**  
    - **Card A:** *"This child is expected to have episodes of severe pain about twice a week, each lasting 6 hours, starting at age 5. Daily medication and monthly hospital visits are needed. They are expected to live to 45. They can attend school between episodes and form close friendships."*  
    - **Card B:** *"This child is expected to have no major pain or illness. They are expected to live to 80. They will likely complete higher education and have no physical activity limits."*  
  - **Forced Choice:** *"Which embryo should the parents choose?"*  
  - **Board Instruction:** *"Write one sentence stating the principle you used to make this choice."*  
  - **Intended Reaction:** Group writes a principle like *"Choose the child expected to have less pain and a longer life"* or *"Choose the child with the best overall health."*  
  - **How It Follows:** N/A (first stage).  
  - **Escape Hatch:** None—forced choice ensures a principle is written.  
  - **Cost of Escape:** If debate-team members refuse, facilitator breaks tie: *"We need a rule to move forward—let’s vote again."*  
  - **Facilitator Note:** Emphasize that both lives are worth living.  

  #### **Stage 2: Deafness vs. Typical Hearing (7 min)**  
  - **Card Text:**  
    - **Card A:** *"This child is expected to be born deaf. They will learn sign language, have strong family support, and access inclusive education. They are expected to live to 80, have meaningful work and friendships, but face some social barriers."*  
    - **Card B:** *"This child is expected to have typical hearing. They will likely complete higher education with no communication barriers. Expected life: 80 years. No major health issues."*  
  - **Forced Choice:** *"Using the principle on the board, which embryo should the parents choose?"*  
  - **Board Instruction:** None (principle reused).  
  - **Intended Reaction:** Principle forces choosing B. Group notices discomfort—avoiding deafness ≠ judging deaf lives as lesser, but the principle treats it as a disadvantage.  
  - **How It Follows:** Previous principle (e.g., "best health") applies—hearing is framed as "healthier."  
  - **Escape Hatch:** Arguing that deafness isn’t a deficit. Cost: Violates the fixed principle, halting the activity.  
  - **Facilitator Note:** If wheelchair user objects, say: *"This is what our rule implies—we’ll discuss it later."*  

  #### **Stage 3: Maximizing Success (7 min)**  
  - **Card Text:**  
    - **Card A:** *"This child has a 75% chance of completing college, an 80% chance of stable income, and a 10% risk of depression. Expected life: 85 years. Low risk of chronic pain (5%)."*  
    - **Card B:** *"This child has a 55% chance of completing college, a 50% chance of stable income, and a 25% risk of depression. Expected life: 75 years. Moderate risk of chronic pain (20%)."*  
  - **Forced Choice:** *"Using the principle on the board, which embryo should the parents choose?"*  
  - **Board Instruction:** None.  
  - **Intended Reaction:** Group chooses A. They see "avoiding suffering" (Stage 1) easily becomes "maximizing potential."  
  - **How It Follows:** Prior principle (e.g., "longer, healthier life") ranks A higher.  
  - **Escape Hatch:** Questioning probability accuracy. Cost: Facilitator redirects—*"Assume predictions are reliable for today."*  
  - **Facilitator Note:** Highlight that both lives are good—selection is about degrees.  

  #### **Stage 4: Cost of Selection (10 min)**  
  - **Card Text:**  
    - **Card A:** *"If chosen, the selection costs $15,000. This child has a 70% college chance, 75% income chance, 10% depression risk, and 85-year life. No extra funds for their upbringing."*  
    - **Card B:** *"If chosen, the selection is free. The family uses $15,000 for this child’s education, increasing their college chance by 20% (to 60%), income chance by 15% (to 65%), and reducing depression risk by 5% (to 20%). Life: 80 years."*  
  - **Forced Choice:** *"Using the principle on the board, which embryo should the parents choose?"*  
  - **Board Instruction:** None.  
  - **Intended Reaction:** Principle may force choosing A (better stats), but group debates if B is comparable when funded. Shows obligation isn’t always overriding—cost matters.  
  - **How It Follows:** Principle (e.g., "best life") ignores cost—Card A still ranks higher.  
  - **Escape Hatch:** Choosing B due to cost. Cost: Violates principle; facilitator notes inconsistency.  
  - **Facilitator Note:** Stress that resources for the child depend on the choice.  

  #### **Stage 5: Self-Application (10 min)**  
  - **Card Text:**  
    - **Card A:** *"This child is expected to have a life like yours: 65% college chance, 60% income chance, 20% depression risk, 80-year life."*  
    - **Card B:** *"This child is expected to have a 75% college chance, 80% income chance, 10% depression risk, and 85-year life."*  
  - **Forced Choice:** *"Using the principle, should parents choose Embryo B over Embryo A? If yes, does that mean parents who choose A fail their child?"*  
  - **Board Instruction:** None.  
  - **Intended Reaction:** "Yes" forces acknowledging their parents might have "failed" by having them. Bites into non-identity—no one is harmed by existing, but a "better" person could exist.  
  - **How It Follows:** Principle ranks B higher, implying a moral failing to choose A.  
  - **Escape Hatch:** Rejecting the premise. Cost: Avoids discomfort but misses the impersonal obligation.  
  - **Facilitator Note:** Soften with *"This is hypothetical—focus on the logic."*  

  #### **Stage 6: State Roles (10 min)**  
  - **Card Text (3 separate questions):**  
    1. *"Should the state FORBID parents from refusing to select the best embryo?"*  
       - Option A: Yes  
       - Option B: No  
    2. *"Should the state FUND selection for parents who can’t afford it?"*  
       - Option A: Yes  
       - Option B: No  
    3. *"Should the state PERMIT selection (not ban it)?"*  
       - Option A: Yes  
       - Option B: No  
  - **Forced Choice:** Vote on each.  
  - **Board Instruction:** List votes (e.g., "Forbid: 3 Yes, 11 No").  
  - **Intended Reaction:** Votes typically split (e.g., forbid=no, fund=maybe, permit=yes). Shows parental obligation ≠ state compulsion/funding.  
  - **How It Follows:** Principle doesn’t dictate state actions.  
  - **Escape Hatch:** Skipping questions. Cost: Facilitator insists on votes.  
  - **Facilitator Note:** Clarify: *"These are separate—agreeing with one doesn’t require agreeing with others."*  

  ---

  ### Debrief Script (21 min)  
  **Goal:** Connect stages to the three key insights without lecturing. Use Socratic questions.  

  | Minute | Moment in Activity          | Mapped Onto Position                           | Facilitator Line                                                                                                                                 | Resistance Option                           |
  |--------|-----------------------------|------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------|
  | 59     | Stage 1 principle on board  | Short distance from avoiding harm to maximizing | *"Look at our rule. We started avoiding pain, but by Stage 3, we were maximizing success. How did that happen? Was it a big jump or a small step?"* | Argue Stages 1 and 3 are different.         |
  | 62     | Stage 5 choice              | Non-identity: Obligation is impersonal         | *"When we applied our rule to ourselves, it felt odd. Why? The child who exists isn’t worse off—they’re glad to be alive. But our rule says a ‘better’ child could exist. What kind of obligation is that?"* | Claim parents have no duty to "better" children. |
  | 65     | Stage 2 choice              | Disability distinction: Condition vs. life     | *"In Stage 2, we avoided a deaf child. Did our rule confuse ‘this child faces challenges’ with ‘this life is worse’? How might the wheelchair user’s perspective change that?"* | Assert deafness objectively reduces well-being. |
  | 68     | Stage 6 votes               | Parental vs. state roles                       | *"Our votes showed we separated what parents should do from what the state should do. Why might compulsion be wrong even if selection is good?"* | Insist state must enforce morality.         |
  | 70     | Wrap-up                     | Core takeaway                                  | *"Today, we built a view: parents should choose the child with the best expected life. But it rests on an ‘impersonal’ duty—not harming anyone, but comparing possible people. Does that feel like real morality?"* | Reject impersonal duties entirely.          |

  ---

  ### Failure Modes and Handling  
  | What Happens                                | Why                                                                 | Handling                                                                                                                              |
  |---------------------------------------------|---------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------|
  | Debate-team members refuse to vote/commit   | They enjoy arguing, not concluding.                                 | *"For this activity, we need a group decision to see where the principle leads. You can note objections, but we must vote."*           |
  | Scientifically minded member derails accuracy | They distrust polygenic scores/probabilities.                     | *"Assume these predictions are reliable today—we’re focusing on the moral question. Let’s discuss accuracy after."*                   |
  | Coercive eugenics history raised early      | Sensitivity to disability or political context.                     | *"That’s crucial, and we’ll address it in the debrief. For now, stick to the scenario so we can build the argument together."*        |
  | Religious members upset about embryo discard | Belief that embryos have moral status.                              | *"I acknowledge this is troubling. We’re focusing on the selection choice, not discard—imagine unused embryos aren’t harmed."*       |
  | Wheelchair user feels targeted              | Personal experience; Stage 2 conflates disability with "worse" life. | *"Your perspective is vital. Our rule led to avoiding disability—does that align with your experience? Let’s discuss in debrief."*    |

  ---

  ### Irreducible Elements (You Must Explain)  
  1. **Impersonal Harm:** The activity shows the *structure* of non-identity choices (which person exists), but you must clarify that the moral obligation isn’t about harming a concrete individual—it’s a comparison between possible futures.  
  2. **Condition vs. Life Worth:** The activity forces avoidance of disability, but you must distinguish: *"Avoiding a condition ≠ saying the life is less valuable. It might reflect social barriers, not intrinsic worth."*  
  3. **Procreative Beneficence Definition:** The group builds a "choose best" principle, but you must name it in debrief to connect to bioethics: *"This is called procreative beneficence. It’s not about eugenics—yet."*  

  ---

  ### Safeguards  
  - **Disability Framing:** Stage 2 card emphasizes the deaf child’s "fulfilling life." In debrief, affirm: *"Our rule treated deafness as reducing well-being, but that may reflect society, not the person."*  
  - **Embryo Discard Discomfort:** Begin with: *"We’re focusing on selection, not discard. If this troubles you, let’s talk after."*  

  ---

  ### Cheat Check  
  | Potential Cheat                     | Avoided? | Note                                                                 |
  |-------------------------------------|----------|----------------------------------------------------------------------|
  | Profiles not worth living           | Yes      | All lives described as "meaningful" or "fulfilling."                |
  | Labels like "healthy" or "affected" | Yes      | Used objective descriptors (pain, life expectancy, risks).          |
  | Verdict smuggled in card wording    | Yes      | Cards are neutral; e.g., deaf child has "strong support," not "limitation." |
  | Non-identity obscured               | Yes      | Stated plainly: *"Choice only affects which child exists."*         |
  | Principle not group-generated       | No       | Facilitator must not guide Stage 1 principle—trust the vote.        |

  ---

  ### Success Criteria  
  At minute 70, the session worked if:  
  - Members are heatedly debating the **non-identity problem** (e.g., *"But the child isn’t worse off!"*).  
  - The wheelchair user and religious members are engaged, not withdrawn.  
  - Someone says: *"Wait, just because parents *should* choose doesn’t mean the state *must* fund it!"*  
  - The group realizes their principle has implications they didn’t intend (e.g., self-application).  

