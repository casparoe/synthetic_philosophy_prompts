  Debrief script:

  We need to map each stage to the point it exposes.

  Failure modes:
  - Someone brings up coercive eugenics early: Handle by acknowledging and saying we'll get to that in debrief, but for now, focus on the specific scenario.
  - Scientifically minded member derails into accuracy: Remind that we are assuming the information is accurate for the sake of the moral question.
  - Debate-team contingent refuses to commit: Encourage them to engage with the spirit of the activity, or let them argue but then take a vote.

  Cheat check: 
  - No profiles that are not worth living: We avoid by ensuring every profile has a good life.
  - No labels: We use only life descriptors.
  - The verdict not smuggled: We start with a clear case, then extend.

  Irreducible: 
  - The impersonal nature of the obligation: we can point to the non-identity, but the activity shows it by the choice between possible people.
  - The distinction between parental obligation and state role: we have stage 6.

  Safeguards for disability: In the debrief, we emphasize that the principle led to avoiding disability even when the life is good, and we can discuss the social model.

  Now, let's write the exact card texts and the board instruction.

  Stage 1:
  Card A: "This child is expected to have frequent, severe pain episodes about twice a week, each lasting several hours, starting in childhood. They will need daily medication and regular hospital visits. They are expected to live about 40 years. They can form friendships and enjoy activities when not in pain, but they will miss many school days and have limited physical activities."
  Card B: "This child is expected to have a typical life with no major health problems. They are expected to live about 80 years without significant pain or frequent medical needs. They are likely to complete higher education and have no barriers to physical activities."

  Forced choice: "Which embryo should the parents choose to have as their child?"

  Board instruction: "After choosing, write on the board one sentence that states the principle you used to make this choice."

  Intended principle: something like "Choose the embryo that will have the best overall quality of life." or "Choose the one with less suffering and a longer life."

  Stage 2:
  Card A: "This child is expected to be born deaf. They will learn sign language and have access to good education and community support. They are expected to have a full life with meaningful relationships and work. Life expectancy 80 years. They will face some social barriers but can lead a happy and fulfilling life."
  Card B: "This child is expected to have typical hearing. They are expected to have no barriers to communication in a hearing world. Life expectancy 80 years. They are likely to complete higher education and have a typical range of opportunities."

  Forced choice: "Using the principle on the board, which embryo should the parents choose?"

  Intended reaction: They apply the principle and choose B, but we want them to feel the discomfort.

  Stage 3:
  Card A: "This child has a high probability of success: 70% chance of completing college, 75% chance of being in the top half of income earners. They have a lower than average risk of depression (10%) and chronic diseases (15% risk of heart disease). Life expectancy 85 years."
  Card B: "This child has an average probability of success: 50% chance of completing college, 50% chance of being in the top half of income earners. They have an average risk of depression (20%) and chronic diseases (25% risk of heart disease). Life expectancy 80 years."

  Forced choice: "Using the principle on the board, which embryo should the parents choose?"

  Intended: They choose A, showing the move to maximizing.

  Stage 4:
  Card A: "If chosen, the family will spend $20,000 on the selection procedure, so they cannot use that money for this child. This child is expected to have: 70% chance of completing college, 75% chance of being in the top half of income earners, 10% risk of depression, 15% risk of heart disease, and life expectancy 85 years."
  Card B: "If chosen, the family will save $20,000 on the selection procedure and use it for this child's education and health. This child is expected to have: 70% chance of completing college, 70% chance of being in the top half of income earners, 15% risk of depression, 20% risk of heart disease, and life expectancy 82 years."

  Forced choice: "Using the principle on the board, which embryo should the parents choose?"

  Intended: The principle may force them to choose A, but they might resist because the outcomes are close and the cost is high. If they choose B, they violate the principle.

  Stage 5:
  Scenario: "Imagine a couple has two embryos. Embryo A is expected to have a life with: 60% chance of completing college, 60% chance of being in the top half of income earners, 20% risk of depression, 25% risk of heart disease, and life expectancy 80 years. Embryo B is expected to have a better life: 70% chance of completing college, 70% chance of being in the top half of income earners, 10% risk of depression, 15% risk of heart disease, and life expectancy 85 years. The parents choose Embryo A and have a child. According to the principle on the board, did the parents do something morally wrong by not choosing Embryo B?"

  Forced choice: "Yes or No?"

  Intended: They see that if they say yes, then their own parents might have similarly wronged them.

  Stage 6: Three parts.

  Part 1: "Should the state require parents to select the best embryo (according to the principle) and forbid them from choosing randomly or choosing a worse one?"
  - Card A: Yes, the state should require this selection.
  - Card B: No, the state should not require it.

  Part 2: "Should the state fund the selection procedure for parents who cannot afford it?"
  - Card A: Yes, the state must provide funding.
  - Card B: No, the state does not have to fund it.

  Part 3: "Should the state permit parents to use this selection procedure if they choose?"
  - Card A: Yes, the state must allow it.
  - Card B: No, the state should ban it.

  For each part, forced choice.

  Debrief script:

  Minute 59-70: Debrief.

  Map:
  - Minute 59: Point to the principle on the board. "This principle started as a way to avoid severe suffering, but then it applied to choosing a child without deafness, then to maximizing success. Did anyone feel the principle was being stretched?"
  - Then: "In Stage 4, we introduced cost. Did the principle still apply, or did it feel too demanding?"
  - Then: "In Stage 5, we applied to ourselves. How did that feel? The key point is that the child who exists (Embryo A) is not worse off by being born compared to not existing, but compared to Embryo B, the parents could have had a child with a better life. This is the non-identity issue: the choice is between possible people, not making an existing person worse off."
  - Then: "For the state, we separated three questions. You might think parents ought to choose the best, but the state should not force them, or fund it, or even permit it? Why might that be?"
  - Address disability: "In Stage 2, we had a deaf child who would have a good life. Our principle led us to avoid that child. But is that because we think deafness makes a life worse, or because we think society makes it harder? And how does that distinction matter?"
  - Finally: "The family of views we've been exploring is called procreative beneficence. It holds that parents have a moral obligation to choose the child expected to have the best life. But as we saw, it raises questions about disability, about how far to maximize, and about the role of the state. It also depends on the non-identity structure: the obligation is impersonal because it's about which child to bring into existence."

  Failure modes handling:
  - Coercive eugenics brought up early: "I appreciate that concern. We will discuss the historical context in the debrief, but for now, let's focus on the moral principle in the scenario."
  - Accuracy derail: "For this activity, we are assuming the predictions are accurate. We can discuss the real-world uncertainties later."
  - Debate-team won't commit: "Even if you don't fully agree, try to engage with the principle as written for the sake of the exercise. You can note your objections and we'll discuss in debrief."

  Irreducible:
  - The concept of impersonal harm: the activity shows it by the choice, but the idea that we can have moral reasons to bring one person into existence rather than another even when both would have lives worth living is a philosophical commitment that the activity illustrates but doesn't fully explain. You might have to clarify.
  - The distinction between avoiding a condition and judging the life as lesser: the activity forces the choice, but the debrief must explicitly draw out that the principle treats the condition as reducing well-being, which may not be the case if society were more inclusive.

  Safeguards:
  - For the wheelchair user and disability: In the debrief, emphasize that the principle's application does not imply that disabled lives are less valuable, but that under current conditions, they may have more challenges. And that the activity is not endorsing that view.
  - For religious members uncomfortable with embryo discard: State at the beginning that we are assuming the embryos are created for IVF and the ones not chosen will be discarded, but we are focusing on the moral question of selection. Acknowledge the discomfort.

  Cheat check:
  - Avoided life not worth living: Yes, all profiles have positive lives.
  - No labels: Yes, described with life facts.
  - Verdict not smuggled: The principle is generated by the group, and the stages extend it naturally.

  Success criteria: At minute 70, members should be actively discussing the implications, especially the non-identity point and the disability distinction, and have a clear sense of the three state actions being separate.

