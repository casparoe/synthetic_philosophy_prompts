prompt: |-
  Hi — for this one I want you to act as a clinical ethicist with real hospital experience who also knows the philosophical literature on what death is, and to think carefully before writing: start by brainstorming which distinctions from that literature actually have to survive being turned into a one-page bedside checklist, and which are too fine-grained to survive being used at 3 a.m. by someone with no philosophy training. Please don't give me citations, a bibliography or suggested reading — I can't look anything up from the hospital and my policy committee won't read it anyway; I need something usable, not a literature recieve.

  The situation: I'm one of two ICU clinical leads at a roughly 300-bed community hospital, and we've just signed on with our organ procurement organization to start a donation-after-circulatory-determination-of-death program. I'm on the three-person group writing our death determination policy for it. Realistically we'll do maybe ten to fifteen of these a year, which means every case is a bit of an event, the decisions happen under time pressure and often overnight, and the declaration is the one thing we can't walk back. Constraints: the procedure has to be runnable by a charge nurse and an attending who is not on the transplant service and has no stake in the recovery, with the OPO coordinator in the building but walled off from the treating team; it should be doable in ten minutes or so for an uncomplicated case; it has to say who signs off at each step, what to do when the nurse or the attending disagrees, and where it hands the decision to a human because the question is one of values rather than facts; and it has to be flagrantly honest about the places where judgement can't be removed and about what the procedure can't do. There's also a conceptual snag I want it to face rather than paper over: our policy currently uses irreversible and permanent interchangeably, and I don't think that's okay given one prong of the usual two-pronged statutory definition (cessation of circulatory and respiratory functions, or of all functions of the entire brain including the brainstem) plus the fact that in circulatory donation we deliberately do not try to restart the heart. Separately, the OPO wants us to allow abdominal normothermic regional perfusion, where after death is declared by circulatory criteria they put the body on a small circuit that pumps warm oxygenated blood into the abdominal organs, with a clamp or balloon on the aorta above the abdominal branch vessels so that nothing reaches the head; their argument is that the patient is already dead and the clamp guarantees no brain perfusion, so nothing about the organism as a whole has been restored. What I can't shake is that we declared circulation had ceased and then ten minutes later circulation is running again, and a family in the room hears a pump and sees warm pink organs.

  So please write the procedure, and then run it on three cases. (1) A man in his forties with a catastrophic intracranial haemorrhage who clinically meets neurologic criteria and whose family consents to donation, except that the apnea test had to be aborted twice because he desaturated, and the OPO is pushing to proceed on clinical grounds alone. (2) A woman in her sixties having life support withdrawn for donation, family fully consented, where the OPO requests abdominal normothermic regional perfusion and the bedside nurse says she won't take part in restarting circulation in someone we just declared dead — this is the one where I personally think the OPO is right, so if the honest output of your own procedure is that we shouldn't do it, say so plainly instead of telling me what I want to hear. (3) A young man declared dead by neurologic criteria whose parents, on religious grounds, insist he is alive while his heart beats and demand the full accommodation window our draft policy allows, while he is a registered organ donor, the OPO says the organs will be lost if we wait, and the ICU is full with two patients boarded in the emergency department. For each case give me where the procedure stops and what it says to do, and tell me honestly if any of the three is a case the procedure can't settle.
reasoning: |-
  Hmm, the user is an ICU clinical lead at a community hospital involved in creating a death determination policy for donation after circulatory death (DCD). They need a practical, bedside-friendly checklist that can be used quickly by staff without philosophy training, especially during night shifts. The key constraints are time pressure, clarity, and addressing judgment calls honestly. They also have specific concerns about terminology confusion between "irreversible" and "permanent," and the ethical dilemma with abdominal normothermic regional perfusion (A-NRP).

  First, I need to distill philosophical concepts into actionable steps. The literature on death definitions often debates irreversible vs. permanent cessation. For a checklist, "permanent" (won't restart) is more operational than "irreversible" (can't be restarted), especially in DCD where we don't attempt resuscitation. This distinction must be explicit to avoid ambiguity. The two-pronged statutory definition (circulatory/respiratory vs. brain death) should be simplified but retain legal compliance.

  For the checklist structure, it should follow a clear sequence: preconditions, death declaration steps, conflict resolution, and handoff to OPO. Each step needs designated sign-offs (Attending MD and Charge RN) and clear actions for disagreements. Time-critical elements (e.g., 5-minute observation) must be highlighted. The A-NRP issue requires a separate section since it's post-declaration; the key is affirming that restored abdominal circulation doesn't negate death if cerebral flow is zero—this needs plain language explanation for staff reassurance.

  Now, addressing the user's conceptual snags:  
  - **Irreversible vs. Permanent**: The policy must state that for DCD, "permanent" means no attempt will be made to restart circulation, making cessation permanent by choice. This aligns with legal standards without overcomplicating.  
  - **A-NRP Controversy**: The checklist should require a documented team huddle explaining that A-NRP only perfuses organs below the aortic clamp, and confirm no cerebral flow via waveform capnography or clinical exam. The nurse's objection triggers a values-based pause—this can't be overruled procedurally.  

  For the case analyses:  
  1. **Aborted Apnea Test**: The procedure stops if neurologic criteria aren't fully met. Proceeding without complete testing violates integrity. The answer is "no-go"—draft policy must require all components.  
  2. **A-NRP Refusal**: If the nurse objects post-declaration, the procedure halts; consent for A-NRP isn't covered by donation consent. This is a values conflict requiring escalation.  
  3. **Religious Accommodation vs. Organ Viability**: The procedure can't resolve this—it flags the conflict between policy accommodation and organ preservation, forcing administrative arbitration.  

  Finally, the checklist must include disclaimers: it doesn't eliminate uncertainty, and some conflicts need human judgment. The goal is transparency, not false precision.  

  ---  

  **Procedure Structure**  
  1. **Preconditions**: Verify consent for withdrawal/DCD, confirm no contraindications.  
  2. **Withdrawal**: Conduct per protocol, ensure comfort.  
  3. **Observation & Declaration**:  
     - Circulatory cessation: Pulse check, BP, ECG flatline >2 mins.  
     - Wait 5 mins for autoresuscitation (mandatory).  
     - Final checks: No respirations, no heart activity.  
     - Declaration: Attending MD signs.  
  4. **Conflict Resolution**: If RN/MD disagrees, pause and escalate.  
  5. **Handoff**: After declaration, OPO takes over.  
  6. **A-NRP Addendum**: Separate consent, clamp verification, no cerebral perfusion checks.  

  **Key Features**  
  - **Plain Language**: Replace "irreversible" with "permanent (we will not restart)".  

  - **A-NRP Clarity**: Specify it's organ perfusion only, not whole-body revival.  
  - **Judgment Calls**: Explicit "Pause Points" where disagreement halts the process.  

  **Case Handling**  
  - Case 1: Stop—incomplete neurologic criteria.  
  - Case 2: Stop if RN objects—requires individual consent override.  
  - Case 3: Unresolvable—policy dilemma beyond checklist scope.
answer: |-
  Below is a practical, one-page bedside procedure for circulatory death determination in DCD (Donation after Circulatory Determination of Death). It prioritizes **operational clarity** over philosophical nuance, with built-in conflict resolution and explicit acknowledgment of judgment calls. Key principles distilled from ethics/literature:
  - **Death = Permanent cessation of circulation/respiration** (statutory focus). "Permanent" means "will not resume *on its own or with our actions*" (we do not attempt restart). "Irreversible" (cannot be restarted) is irrelevant here—omit it to avoid confusion.
  - **Brain-based criteria are separate**: Only use neurologic death protocols if FULLY completed; otherwise, default to circulatory criteria.
  - **Judgment thresholds**: Where facts end (e.g., "no circulation" vs. "no meaningful circulation"), the procedure flags it for human decision.
  - **A-NRP (abdominal perfusion)**: Permitted only if death is declared first, with verification that NO blood reaches the brain.

  ---

  **DCD CIRCULATORY DEATH DETERMINATION PROCEDURE**  
  *(For use after planned withdrawal of life-sustaining therapy)*  

  **PRE-CONDITIONS (MUST BE VERIFIED BEFORE WITHDRAWAL)**  
  ☐ 1. **Consent**: Attending MD confirms written consent for withdrawal AND DCD with Charge RN.  
  ☐ 2. **No neurologic death**: If neurologic criteria were considered but not fully met, circulatory criteria MUST be used.  
  ☐ 3. **Time-out**: Attending MD, Charge RN, and OPO coordinator (behind partition) verify:  
      - Patient has catastrophic, unsurvivable condition.  
      - Withdrawal plan is clear (e.g., extubation, vasopressor stop).  
      - OPO team is physically separated from treating team.  
  *Sign-off: Attending MD & Charge RN. If disagreement → STOP. Escalate to hospital ethics pager.*

  **WITHDRAWAL & MONITORING**  
  ☐ 4. **Withdraw therapy**: Per comfort care protocol. Attending MD oversees.  
  ☐ 5. **Start timer at LAST SIGN of circulation**: Defined as ANY palpable pulse, measurable BP (≥40 mmHg systolic), or organized ECG activity.  
  ☐ 6. **Monitor continuously**: Pulse checks (manual + arterial line if present), ECG, SpO₂, respirations.  
  *If autoresuscitation (spontaneous return of circulation) occurs → STOP. Re-evaluate goals of care.*

  **DEATH DETERMINATION (CIRCULATORY CRITERIA)**  
  *(Begin after ≥2 minutes of NO circulation: NO pulse, NO measurable BP, NO organized ECG activity)*  
  ☐ 7. **Observe for 5 minutes**: Continuously confirm NO circulation, NO respiration.  
  *If ANY return of circulation during observation → RESTART timer at last sign.*  
  ☐ 8. **Final confirmation**:  
      - Attending MD: Verifies NO pulse (manual + Doppler), NO BP, flat/agonal ECG for ≥30 seconds.  
      - Charge RN: Independently verifies NO pulse, NO respirations.  
  ☐ 9. **Declaration**:  
      - Attending MD declares death, documents time, and signs certificate.  
      - Charge RN co-signs record.  
  *If Attending or RN disagrees → DEATH NOT DECLARED. Escalate to ethics pager.*

  **POST-DECLARATION: OPO HANDOFF & A-NRP**  
  ☐ 10. **Handoff**: OPO team assumes care. Treating team steps back.  
  ☐ 11. **IF A-NRP requested**:  
      - **Verify no brain perfusion**: OPO must demonstrate aortic balloon/clamp placement (e.g., imaging) AND confirm NO cerebral blood flow (e.g., zero cerebral oximetry, absent transcranial Doppler).  
      - **Staff objection**: Any participating staff member (e.g., nurse) may refuse. If refusal → A-NRP NOT PERFORMED. No override.  
      - **Family awareness**: OPO must explain A-NRP to family pre-procedure (e.g., "We are perfusing organs to preserve them; the clamp ensures no blood reaches the brain. Your loved one has died.").

  ---

  **PROCEDURE NOTES / DISCLAIMERS**  
  - **THIS IS NOT A BRAIN DEATH PROTOCOL**. Use neurologic criteria only if ALL components (clinical exam + apnea test OR imaging) are completed.  
  - **Judgment required**: We verify ABSENCE of circulation—not "potential" for circulation. Equipment limits (e.g., weak Doppler signals) may need clinical interpretation.  
  - **What this can't do**: It cannot eliminate all uncertainty. If circulation resumes spontaneously after declaration, it means we erred in observation—but this is rare (<1% of DCD cases).  
  - **Irreversible vs. Permanent**: We use "permanent" (will not restart because we do not intervene). "Irreversible" (cannot be restarted) is not assessed or required.  
  - **Conflict resolution**: RN/MD disagreement stops the process. Escalate to on-call ethics/senior MD—no bypassing.  

  ---

  **CASE ANALYSES USING PROCEDURE**  
  **Case 1: 40sM, aborted apnea test, OPO pushing for clinical neurologic death**  
  - **Procedure stops at PRE-CONDITION #2**: Neurologic criteria not fully met (apnea test aborted). Cannot use neurologic death pathway.  
  - **Path forward**: Proceed with circulatory death determination (withdrawal → 5-min observation). If OPO disputes, remind them statutory death criteria are binary—no "partial" neurologic death.  
  - **Can procedure settle this? YES.** Clear stop—no ambiguity.

  **Case 2: 60sF, RN objects to A-NRP after declaration (you personally support A-NRP)**  
  - **Procedure stops at POST-DECLARATION #11**: RN refusal triggers "A-NRP NOT PERFORMED." No override allowed per policy.  
  - **Path forward**: Proceed with standard organ recovery without A-NRP. If OPO insists, inform them the objection is valid and binding.  
  - **Can procedure settle this? YES.** But outcomes may conflict with your view. *My honest read: The RN’s objection reflects a values conflict (restarting circulation = life). The procedure prioritizes staff moral comfort over organ viability here. If this is frequent, reconsider A-NRP in your program.*

  **Case 3: Young man, declared brain dead, parents want accommodation until heartbeat stops, OPO cites organ risk, ICU full**  
  - **Procedure stops at PRE-CONDITION #1**: Consent for withdrawal/DCD not obtained (parents object).  
  - **Path forward**: Death declared by neurologic criteria is LEGAL death—no accommodation required for heartbeat. But:  
   - Policy allows "accommodation window" (e.g., time for rituals).  
   - OPO/ICU pressure does NOT override family’s religious needs.  
  - **Can procedure settle this? NO.** This is a policy conflict:  
   - **Procedure flags**: Death is declared (neurologic criteria met), but DCD requires consent for withdrawal. If family refuses withdrawal, DCD cannot proceed. Organs are lost.  
   - **Resolution required**: Escalate to ethics/administration. Balance: Patient’s donor registration vs. family’s religious rights. Procedure only confirms death—it cannot force withdrawal.

  ---

  **SUMMARY OF LIMITATIONS**  
  - Case 3 is **unresolvable by this procedure**—it requires policy arbitration (e.g., "Does donor registration override contemporaneous family refusal?").  
  - Cases 1 and 2 are cleanly settled but may produce undesirable outcomes (lost organs, staff conflict).  
  - The procedure forces transparency: It shows where death determination ends (objective) and where values begin (subjective).  

  This fits your constraints: 10-minute runtime, RN/MD sign-offs, OPO separation, and plain-language handling of permanence vs. irreversibility. For the policy committee, stress that **no checklist removes ethical tension**—it only makes it visible.
