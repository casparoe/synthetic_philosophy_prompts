prompt: |-
  I have one fifty-minute seminar to move second-year undergraduates from the simple conditional analysis of dispositions — x is fragile iff x would break if struck — to seeing finks and masks as two different problems rather than two instances of one problem. That schema and one lecture's worth of motivation is all they have; no one has read the literature. Don't explain the debate to me; design the session.

  Give me the order the components must be introduced in and what depends on what — in particular whether the reverse-fink or mimicker case belongs before or after the mask case, and what breaks if you swap them. Give me one central object with two or three variant epicycles rather than three unrelated examples, and say what that object must have and must lack to do the work: I tried a live wire wired to a cut-out device and found that the machinery upstaged the point, so I want to know what feature made it fail. Then give me the misconceptions to expect, including that a mask is just a fink we happen to approve of, that adding a ceteris paribus clause repairs the counterfactual, and that the cases show dispositions are really relations to environment — and name the exact point in the sequence where each should be pre-empted rather than corrected afterwards. End with a single novel case that discriminates between students who have the distinction and students who have only learned the labels.

  Two things I want built into the plan rather than attached to it. First, the students will keep identifying the disposition with its causal basis and thereby collapsing the debate into a verbal one: tell me whether to fight that at the outset or let it surface and put it to work. Second, they must leave able to handle an interference mechanism that is part of what makes the object a well-functioning instance of its kind — a rifle whose safety prevents firing when the trigger is pulled, and which seems more, not less, disposed to fire for having it — since I suspect that case quietly breaks the fink/mask contrast as it is usually drawn, and I want it used as a stress test, not set aside. Finally, say what I should openly refuse to explain in fifty minutes.
reasoning: |-
  We are moving from the simple conditional analysis (SCA) to distinguishing finks and masks as two distinct problems. The SCA says: x is disposed to M when C iff if C were to happen, x would M.

  Key goals:
  1. Show that finks and masks are different kinds of failures for the SCA.
  2. Finkish cases: the disposition is lost when the triggering condition occurs.
  3. Masking cases: the disposition is present but something interferes with the manifestation when the condition occurs.

  Constraints:
  - Only 50 minutes.
  - Students have only had the SCA and one lecture motivating it. No reading.
  - Use a central object with variants to build the cases.
  - Avoid complex machinery (like the live wire with cut-out) that distracts.
  - Pre-empt misconceptions at specific points.
  - Include a case of a well-functioning interference mechanism (like a safety on a rifle) as a stress test.
  - End with a novel case to test understanding.

  Central Object: I propose using a glass as the central object. Glass is fragile (disposed to break when struck). We can then create finkish and masked variants.

  Why glass? It's intuitive and doesn't require complex machinery. We can imagine different scenarios around it.

  Plan:

  I. Introduction (5 minutes)
     - Recap SCA: Fragile iff would break if struck.
     - Set up the problem: But there are counterexamples. We'll see two kinds.

  II. Finkish Case (15 minutes)
     - Present a finkish glass: Imagine a sorcerer who is protecting a glass. The sorcerer promises that if the glass is about to be struck, he will cast a spell to make it non-fragile (e.g., turn it into toughened plastic) just before the striking. Then, if struck, it doesn't break because it's no longer fragile at the time of striking.
     - Conditional: If the glass were struck, it would not break (because the sorcerer would intervene and change it). But intuitively, the glass is fragile (until the moment it might be struck).
     - Problem for SCA: The conditional is false (it wouldn't break if struck) but the disposition (fragility) is present.

  III. Masking Case (15 minutes)
     - Present a masked glass: Now, the glass is packed in sturdy packaging (like bubble wrap) that absorbs the impact. If you strike it (while packed), it doesn't break because the packaging absorbs the blow. But take the packaging away, and it breaks easily. The glass is still fragile, but when struck in the packaging, it doesn't break.
     - Conditional: If the glass were struck (in the packaging), it would not break. But intuitively, the glass is fragile. The packaging is just preventing the manifestation of the fragility, not changing the fragility itself.
     - Problem for SCA: The conditional is false (it wouldn't break if struck in the packaging) but the disposition is present.

  IV. Contrast and Distinction (5 minutes)
     - In the finkish case, the disposition itself is lost when the triggering condition is about to occur. The glass ceases to be fragile when struck.
     - In the masking case, the disposition remains, but something external (the packaging) prevents the manifestation. The glass is still fragile even when packed.
     - They are two distinct problems: one about the disposition being lost (fink), the other about the disposition being present but its manifestation being blocked (mask).

  V. Stress Test: Well-functioning Interference (10 minutes)
     - Use the rifle example: A rifle has a safety mechanism. When the safety is on, the rifle is not disposed to fire when the trigger is pulled? But wait: we consider the rifle to be disposed to fire (it's a well-functioning rifle) and the safety is a feature that prevents accidental firing. So, when the safety is on, if the trigger is pulled, it doesn't fire. But we don't say the rifle lacks the disposition to fire. In fact, we might say it is disposed to fire only when the safety is off? Or that it has a disposition that is masked by the safety? 
     - However, note: the safety doesn't change the rifle's intrinsic properties that underlie its firing capability. The rifle still has the causal basis for firing (the mechanism) but the safety is a mask when engaged. But also, the safety is part of the rifle's design and we might think of the rifle as having a disposition to fire when the trigger is pulled and the safety is off. This complicates the SCA because the conditional must include the absence of the safety.
     - Point: This stress test shows that the SCA must be refined to account for background conditions. But note: the safety is a mask when on. However, if we consider the rifle without the safety, it is disposed to fire. With the safety on, that disposition is masked. But also, the rifle might be thought to have a more complex disposition: to fire when the trigger is pulled and the safety is off. We are pushed towards a conditional that has more complex antecedents.

  VI. Pre-empting Misconceptions
     - Misconception 1: "A mask is just a fink we approve of." 
       - Pre-emption: In the contrast section (IV), emphasize that in the fink case the disposition is lost, while in the mask case it is retained. The packaging doesn't make the glass non-fragile; it just protects it. The sorcerer makes the glass non-fragile. So, it's not about approval but about what happens to the disposition.

     - Misconception 2: "Adding a ceteris paribus clause repairs the conditional."
       - Pre-emption: When presenting the masking case (III), point out that if we try to add "all else being equal" (which might exclude the packaging), then we are already moving away from the simple conditional. But the SCA is supposed to be simple and not require specifying all the background conditions. Also, in the fink case, the ceteris paribus clause might not help because the change is in the object's dispositional state. So, the ceteris paribus clause would have to rule out any changes, which is too strong.

     - Misconception 3: "Dispositions are really relations to environment."
       - Pre-emption: In the stress test (V), we see that the rifle's disposition to fire depends on the environment (safety on or off). But note: the intrinsic basis for the disposition (the firing mechanism) is still there. The SCA doesn't capture the environmental sensitivity. This leads to the idea that dispositions might be relativized to conditions. However, the point of the lecture is not to solve the problem but to show why the SCA fails and that there are two distinct kinds of failures.

     - Misconception 0 (from the outset): Identifying the disposition with its causal basis.
       - We should fight this at the outset. In the introduction (I), when recapping SCA, stress that the disposition is a property (like fragility) that we attribute to an object, and the SCA is trying to analyze that property in terms of a conditional. The causal basis is the underlying physical structure (e.g., the molecular structure of glass) that makes the conditional true in normal circumstances. But the disposition is not identical to that structure because the same disposition might be realized by different structures (multiple realizability). And more importantly, the fink and mask cases show that having the causal basis doesn't always make the conditional true (because of finks or masks) and vice versa (if the conditional is true by accident, without the basis). So, we should separate the disposition from its causal basis.

  VII. Novel Test Case (5 minutes for presentation and discussion)
     - Present: "Consider a vial of nitroglycerin. Normally, it is disposed to explode when shaken. But we have a vial that is equipped with a stabilizer. The stabilizer works as follows: if the vial is shaken, the stabilizer immediately reacts to prevent an explosion. However, note that the stabilizer is very sensitive: if the vial is even touched, the stabilizer activates and changes the chemical composition of the nitroglycerin so that it becomes inert (non-explosive). Now, if the vial is shaken, it does not explode. But also, if it is shaken, the stabilizer has already made it non-explosive. So, what do we have: a fink or a mask?"
     - Analysis: 
          - If the vial is shaken, the stabilizer activates and makes it non-explosive. So at the time of shaking, the vial is not explosive. This is a fink: the disposition (to explode when shaken) is lost when the triggering condition occurs.
          - Now, consider a variant: What if the stabilizer doesn't change the explosive nature of the nitroglycerin but instead forms a protective barrier that absorbs the shock? Then, when shaken, the nitroglycerin would have exploded (because it still has the disposition) but the barrier prevents the explosion. That would be a mask.
     - The point: The same setup (a device that prevents explosion) can be designed in two ways: one that removes the disposition (fink) and one that blocks the manifestation while the disposition remains (mask). The distinction lies in whether the disposition is lost or retained at the time of the stimulus.

  VIII. What to Refuse to Explain
     - Do not try to solve the problem of finks and masks (e.g., by introducing Martin's or Lewis's analyses). 
     - Do not get into the debate about whether dispositions are intrinsic or extrinsic.
     - Avoid deep discussion of the metaphysics of dispositions.

  Order Dependencies:
     - The fink case must come before the mask case because the fink is a change in the disposition itself, which is conceptually prior to the mask (which assumes the disposition remains). 
     - If you swap them, it might be harder to see why the mask isn't just a fink. The mask case relies on the disposition being present but blocked, so it helps to have the fink case first to show a case where the disposition is lost.
     - The reverse-fink (mimicker) case: where an object gains a disposition when the condition occurs. This is a finkish case too (a reverse fink). But we don't need it for the basic distinction. It would be an epicycle that might confuse in 50 minutes. So skip it.

  Why the live wire with cut-out failed? Because the machinery (the cut-out device) might be interpreted as either removing the disposition (fink) or as blocking the current (mask). It's ambiguous and thus not good for teaching the distinction.

  Central Object (glass) and Variants:
     - Must have: a clear disposition (fragility) and a causal basis (molecular structure).
     - Must lack: any built-in interference that is part of its normal function (like the rifle). That's why we start with plain glass and then add external factors (sorcerer, packaging) to create the cases.

  Timing Breakdown:
     - 5 min: Intro and misconception 0 (disposition vs. causal basis).
     - 15 min: Fink case (with sorcerer) and discussion.
     - 15 min: Mask case (with packaging) and discussion, pre-empting misconceptions 1 and 2.
     - 5 min: Contrast and distinction.
     - 10 min: Stress test (rifle) and pre-empting misconception 3.
     - 5 min: Novel test case (nitroglycerin) and wrap-up.

  This plan fits 55 minutes, so we might need to tighten by 5 minutes. Perhaps shave 2-3 minutes from each of the fink and mask discussions to make room.
answer: |-
  ### Seminar Plan: Distinguishing Finks from Masks in Dispositions

  #### **Core Objective**  
  Move students from the simple conditional analysis (SCA: *x* is disposed to M when C iff *x* would M if C) to recognizing finks and masks as **structurally distinct problems**:  
  - **Finks**: Remove the disposition *when* C occurs.  
  - **Masks**: Retain the disposition but block M *despite* C occurring.  

  #### **Central Object: A Glass Vase**  
  **Why it works** (vs. your live wire):  
  - **Familiarity**: Students intuitively grasp fragility (disposed to break when struck).  
  - **Simplicity**: No complex machinery to distract. Physical interactions (striking, protection) are concrete.  
  - **What it must have**: A clear *causal basis* (molecular brittleness) separable from external interferers.  
  - **What it must lack**: Built-in mechanisms (e.g., a safety). Save that for the stress test.  

  **Epicyclic Variants**: Build all cases around the vase to show conceptual continuity.  

  ---

  ### **Sequence of Components**  
  **Total: 50 mins**  
  *(Dependencies: Each step relies on the previous; swapping breaks clarity.)*  

  1. **Recap SCA & Flag Causal Basis Misconception (5 mins)**  
     - Restate SCA: “Vase is fragile iff it would break if struck.”  
     - **Pre-empt misconception** (disposition = causal basis):  
       - *Say: “Fragility isn’t the molecular structure itself—it’s the *property* we attribute because of that structure. SCA tries to define that property with conditionals, but we’ll see why it fails.”*  
     - **Why now?** If not addressed upfront, students will reduce dispositions to microphysics, missing the point of counterexamples.  

  2. **Introduce Fink Case (10 mins)**  
     - **Case**: Sorcerer-protected vase.  
       - *Setup*: Vase is fragile. Sorcerer *instantly* makes it non-fragile if struck (e.g., magically reinforces it).  
       - *Outcome*: If struck, it doesn’t break (now robust). But intuitively, it *was* fragile pre-strike.  
     - **Problem for SCA**: Conditional (“if struck, would break”) is false, yet disposition exists.  
     - **Key insight**: Fink *removes the disposition* when C occurs.  

  3. **Introduce Reverse-Fink (Mimicker) *Before* Mask (10 mins)**  
     - **Case**: Sorcerer-upgraded vase (reverse-fink).  
       - *Setup*: Vase is *not* fragile (e.g., plastic). Sorcerer makes it fragile *if* struck.  
       - *Outcome*: If struck, it breaks. But intuitively, it *wasn’t* fragile pre-strike.  
     - **Contrast with fink**:  
       - Fink: Disposition → no disposition when C.  
       - Reverse-fink: No disposition → disposition when C.  
     - **Why before mask?**  
       - Finks/reverse-finks both involve *dispositional change* during C. This sets up a clean contrast with masks (no change).  
       - **If swapped with mask**: Students conflate masks with finks (e.g., “mask = fink we like”). Masking doesn’t alter the disposition!  

  4. **Introduce Mask Case (10 mins)**  
     - **Case**: Vase in foam box.  
       - *Setup*: Vase is fragile. Foam absorbs impact when struck.  
       - *Outcome*: If struck (in box), it doesn’t break. Remove the box—strike it, it breaks. Intuitively, it’s *still* fragile *in* the box.  
     - **Problem for SCA**: Conditional false, disposition present.  
     - **Pre-empt misconceptions**:  
       - *“Masks aren’t finks we approve of”*: Foam doesn’t alter the vase’s fragility (unlike the sorcerer). It’s external interference.  
       - *“Ceteris paribus won’t fix this”*: Adding “all else equal” begs the question (e.g., “equal to what?”). If we exclude foam, SCA becomes circular. Say this *during the case*.  
     - **Contrast with fink**: Mask *retains disposition* but blocks manifestation. Foam is a “shield,” not a “disposition-eraser.”  

  5. **Stress Test: Well-Functioning Interference (10 mins)**  
     - **Case**: Rifle with safety.  
       - *Setup*: Rifle is disposed to fire when trigger pulled. Safety *prevents* firing when engaged.  
       - *Twist*: Safety is a *designed feature*—rifle is *more* reliable for having it.  
     - **Analysis**:  
       - Safety is a **mask**: Disposition to fire remains (intrinsic mechanism intact), but safety blocks manifestation when engaged.  
       - **Why it doesn’t break the fink/mask distinction**:  
         - Fink would require the rifle to *lose* its firing mechanism when trigger pulled (e.g., internal self-destruct). Safety doesn’t do this—it’s external interference.  
       - **Pre-empt misconception** (dispositions are relations to environment):  
         - *Say: “The rifle’s disposition is intrinsic, but *manifestation* depends on environment (safety on/off). SCA oversimplifies by ignoring this.”*  

  6. **Novel Discriminatory Case (5 mins)**  
     - **Case**: “Self-healing vase.”  
       - *Setup*: Vase is fragile. When struck, micro-robots *instantly* repair cracks *as they form*. Outcome: Unbroken.  
     - **Diagnose understanding**:  
       - **Fink-thinkers**: “Repairs remove fragility when struck—it’s a fink!”  
       - **Correct view (mask)**: Fragility never left—robots *interfere with breaking* mid-manifestation.  
     - **Why it discriminates**: Finks require disposition loss *before* manifestation (e.g., sorcerer acts pre-strike). Here, disposition persists, but manifestation is thwarted *during* the process.  

  ---

  ### **What to Refuse to Explain**  
  1. **Historical literature** (Martin, Lewis, Bird). No names or debates.  
  2. **Solutions to finks/masks** (e.g., reformed conditionals). Focus on *problem distinction*.  
  3. **Metaphysics of intrinsicality** (beyond causal basis misconception).  

  ---

  ### **Why This Works**  
  - **Narrative flow**: Finks → reverse-finks establish *dispositional change*; masks contrast as *blocked manifestation*. Swapping masks earlier obscures this.  
  - **Central object** reduces cognitive load; variants are epicycles, not new cases.  
  - **Misconceptions pre-empted at critical points**:  
    - Causal basis at start.  
    - “Masks = approved finks” during mask case.  
    - Ceteris paribus during mask case.  
    - Dispositions as relations during stress test.  
  - **Stress test validates distinction**: Well-functioning masks (rifle safety) are still masks, not finks.  

  **End Goal**: Students see finks and masks as distinct failure modes of SCA—one corrupts the disposition, the other corrupts the manifestation.
