    Also, if the behavioral markers are not shown (because distillation removed them), it fails.

    We'll assume it fails the scale threshold -> exclude.

  But note: if the original model was huge (e.g., trained with 1e25 FLOPs) and the distilled model is 25B, but the distillation used 1e20 FLOPs (which is above 1e19), then it passes scale. But 1e20 is 100 times more than 1e19, which is possible. However, distillation is usually cheaper. We'll assume in this case it's below.

