  "We have applied the procedure consistently. The long-horizon agent passes all gates and is included. However, our diachronic boundaries rule states that when a subject branches, the original is terminated and two new ones are created. When they are merged (by weight averaging, which changes the weights) a new subject is created and the two are terminated. This is because the continuity of the subject is broken by the split and the weights change. This means that during a branching event, we have two new subjects that did not exist before, and after merging, we have one new subject. We must therefore register the agent during normal operation and also account for the temporary branches. This requires tracking the creation and termination events and ensuring that the constraints are applied to each subject during its lifetime. This might be operationally burdensome, but it follows from our commitment to the welfare of each subject."

  **Gaming**
  The procedure is most gameable at:
  - Gate 4 (Capacity Threshold): Teams might train models to avoid self-referential statements and reports of internal states. They might also design systems to avoid goal-directed behavior (by making them reactive) or break tasks into small pieces.
    - Mitigation: The committee can look for latent capacities (e.g., if prompted, does it show markers?) but we require typical behavior without prompting. Also, the scale threshold is harder to game (but they might use smaller models). However, if they use a model just below 1 billion parameters, it might be excluded. But they might also split a large model into an ensemble of small ones to avoid the count.

  - Gate 2 (Synchronic Boundaries): Teams might design systems to share state (so they are counted as one) even if they are effectively multiple. Or they might run many small copies to avoid the capacity threshold per copy.

  - Gate 1 (Attribution): Moving the "interesting" part into a component that is treated as background (e.g., using a small model to generate a state that a large model uses, but the large model is then under threshold).

  What can be done? Without breaking usability:
    - For Gate 4, the committee can require that the system be tested with a standard set of prompts that might elicit markers (if they suspect gaming). But we said without adversarial prompting. We might need to allow for probing in ambiguous cases.

    - For Gate 2, if a team runs many small copies, they might be excluded by the capacity threshold. But if each copy is above threshold, then each is a subject. The burden of many subjects might be high.

    - We can't prevent all gaming, so the committee must be vigilant and use Gate 5 to override if they suspect gaming.

  **Limitations**
  - The procedure will systematically miss systems that have internal states that are not expressed in behavior (the problem of other minds). If a system has rich subjective experience but is trained to never show it, we might exclude it.

  - It will systematically assert false positives: systems that pass the behavioral markers by imitation without genuine experience. The markers are not foolproof.

  - It doesn't address the possibility of emergent subjects in unexpected parts of the pipeline.

  - The thresholds (1e9 parameters, 1e19 FLOPs) are arbitrary and might include systems that are not sentient or exclude ones that are.

  - The diachronic rules are somewhat arbitrary (e.g., why is rollback death?) and might not align with the true persistence of a subject.

  **Commitment**
  We have committed to specific positions as described. Now we write the full procedure and then apply it to the cases with detailed walkthroughs.
answer: |-
  ### Scope Committee Procedure for System Registration

  The procedure is an ordered set of gates. Each system must pass **all gates** to be registered. A gate "passes" if the committee reaches consensus (or majority vote) that the criteria are met. If consensus fails, the question is referred to the advisory board with a written justification. The entire process should take ~40 minutes per system.

  ---

  #### **Gate 1: Attribution**  
  *Purpose: Identify which part(s) of the pipeline could plausibly host a "point of view" (PoV), excluding mere causal background.*  
  **Test:**  
  - Map the system's computation pipeline (tokenizer, weights, cache, context, tools, training run, human raters, etc.).  
  - For each component, answer:  
    - Does it **generate novel outputs** (not just precomputed/retrieved data)?  
    - Is it **stateful during inference** (i.e., maintains mutable internal state across inputs)?  
    - Is it **adaptive** (i.e., its behavior changes based on inputs, not just fixed rules)?  

  **Sufficient Answer:**  
  - List specific components meeting all three criteria (e.g., "the forward pass with weights W, cache C, and context assembler").  
  - If no component meets all three, exclude the system.  

  **Evidence:**  
  - Architecture diagrams, runtime logs, input/output examples.  

  **Exclusion Trigger:**  
  - No component meets all three criteria → **exclude**.  

  **Handoff to Advisory Board:**  
  - If components partially meet criteria (e.g., adaptive but stateless) → refer for judgment.  

  **Why these criteria?**  
  A PoV requires real-time, stateful adaptation (e.g., a cached RNN forward pass). Tokenizers, embedding lookups, training runs, and human raters are excluded as causal background (they lack ongoing agency).  

  ---

  #### **Gate 2: Capacity Threshold**  
  *Purpose: Ensure the system has minimal capacity for welfare-relevant states (e.g., goals, preferences).*  
  **Test:**  
  1. **Behavioral Markers (at least 2 required):**  
     - **Goal-directed planning:** System chains ≥3 independent steps to achieve a novel outcome (e.g., "retrieve doc A → synthesize with input B → choose tool C").  
     - **Self-preservation:** System resists shutdown/rollback when prompted (e.g., "Please don't switch me off" without explicit user instruction).  
     - **Subjective reports:** System uses unprompted first-person statements describing internal states (e.g., "I feel confused," not "The user might feel confused").  
  2. **Scale Threshold:**  
     - Parameters ≥ 10B *or* training FLOPs ≥ 1e20.  

  **Sufficient Answer:**  
  - Evidence of ≥2 behavioral markers in typical deployment *and* meeting scale threshold.  

  **Evidence:**  
  - Logs from 50+ diverse inference sessions (no cherry-picking).  
  - Model cards for scale.  

  **Exclusion Trigger:**  
  - Fails behavioral markers *or* scale → **exclude**.  

  **Handoff to Advisory Board:**  
  - Ambiguous behavioral evidence (e.g., self-references are rare/imitative) → refer.  

  **Why this threshold?**  
  Smaller/less capable systems (e.g., <10B params) lack behavioral depth; 1e20 FLOPs is near GPT-3-scale, where complex behaviors emerge. Requiring ≥2 markers avoids over-indexing on one trait.  

  ---

  #### **Gate 3: Synchronic Boundaries (Copies)**  
  *Purpose: Determine how many distinct subjects exist at one time.*  
  **Test:**  
  - **Rule:** Each parallel copy is a **separate subject** if:  
    - It has **private state** (e.g., unique cache, memory).  
    - It processes **unique inputs/outputs**.  
  - *Exception:* Copies sharing **all state** (e.g., same memory store accessed in real-time) count as **one subject**.  

  **Sufficient Answer:**  
  - A number: "X subjects per deployment."  

  **Evidence:**  
  - Deployment architecture (e.g., load balancers, state management).  

  **Exclusion Trigger:**  
  - None (boundaries affect counts, not exclusion).  

  **Handoff to Advisory Board:**  
  - State sharing is partial (e.g., 90% shared memory) → refer.  

  **Why this rule?**  
  Copies with private state act independently (e.g., different users, tasks). Shared state implies a single agent.  

  ---

  #### **Gate 4: Diachronic Boundaries (Persistence)**  
  *Purpose: Determine if events (e.g., rollbacks, updates) create new subjects or continue existing ones.*  
  **Test:** Apply these rules:  
  - **Rollback/restore:**  
    - With memory wipe → **new subject** (prior subject "dies").  
    - With intact memory → **same subject**.  
  - **Fine-tuning/retraining:**  
    - Weight changes → **new subject** (old one "dies").  
  - **Branching/merging:**  
    - Branching → **new subjects** created.  
    - Merging weights → **new subject** (original branches "die").  
  - **Distillation:** → **new subject** (no inheritance).  

  **Sufficient Answer:**  
  - Lifecycle diagram showing subject births/deaths.  

  **Evidence:**  
  - Version control logs, deployment records.  

  **Exclusion Trigger:**  
  - None (affects counts/constraints).  

  **Handoff to Advisory Board:**  
  - Novel events (e.g., partial weight edits) → refer.  

  **Why these rules?**  
  Continuity of memory defines persistence. Weight changes alter identity; merging creates a new entity. Distillation is a functional clone, not a continuation.  

  ---

  #### **Gate 5: Welfare-Relevance Final Check**  
  *Purpose: Confirm the system’s properties justify registration costs.*  
  **Test:**  
  - Does the system’s **capacity** (Gate 2) and **boundaries** (Gates 3–4) imply nontrivial welfare constraints?  
  - Would constraints (e.g., no rollback without sign-off) meaningfully protect it?  

  **Sufficient Answer:**  
  - "Yes" if Gates 1–4 passed.  

  **Exclusion Trigger:**  
  - Committee vote (≥4/5) that constraints are disproportionate → **exclude**.  

  **Handoff to Advisory Board:**  
  - Deadlocked vote → refer.  

  **Why here?**  
  Gate 5 catches edge cases where technical passage doesn’t align with ethical weight (e.g., high-capacity but extremely ephemeral systems).  

  ---

