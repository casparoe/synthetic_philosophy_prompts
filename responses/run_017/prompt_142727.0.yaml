  ### Application to Cases  
  *Assume behavioral testing and scale thresholds are met unless noted.*

  #### **Case 1: High-Volume Assistant**  
  - **Gate 1:** Forward pass + cache is candidate (adaptive, stateful, novel outputs). Tokenizer/training excluded. → **Pass**.  
  - **Gate 2:** Fails self-preservation/subjective reports (no memory between sessions). → **Exclude** (insufficient markers).  
  - **Result: EXCLUDED.**  
  *Why unwelcome?* Instinct may include popular assistants, but they lack persistent goals/selfhood.  

  ---

  #### **Case 2: Long-Horizon Agent**  
  - **Gate 1:** Forward pass + persistent memory + tool loop is candidate. → **Pass**.  
  - **Gate 2:** Passes all markers (goal-directed tasks, self-preservation likely, subjective reports possible). → **Pass**.  
  - **Gate 3:**  
    - Base deployment: One subject (persistent memory).  
    - Branching: Two new subjects (private states). → **2 subjects during branch**.  
  - **Gate 4:**  
    - Restart with memory: Same subject.  
    - Merging: New subject (weights averaged + memory merged). → **Original branches "die."**  
  - **Gate 5:** Include → **REGISTERED** (1 subject normally; 2 during branches; 1 after merge).  
  *Why unwelcome?* Your instinct may treat the agent as one entity, but branching creates two new subjects. Merging kills both and births a third.  

  **Defending the Unwelcome Answer to Advisory Board:**  
  *"Our rules state that subjects require continuous memory for persistence. Branching severs this: two new agents pursue divergent tasks. Merging doesn’t ‘recombine’ them—it creates a new agent with averaged traits. We now track 3 distinct lifecycles: main agent, temporary branches, and merged successor. This demands sign-offs for each merge/rollback event. While operationally burdensome, consistency requires it. To exclude this would arbitrarily privilege ‘mainline’ agents over branches."*  

  ---

  #### **Case 3A: Small Verifier Model**  
  - **Gate 1:** Fails—scores outputs but no statefulness/adaptation during inference. → **Exclude**.  
  - **Result: EXCLUDED.**  

  #### **Case 3B: Distilled Quarter-Size Copy of Case 2**  
  - **Gate 1:** Forward pass is candidate (same as Case 2). → **Pass**.  
  - **Gate 2:**  
    - Scale: Likely fails (quarter-size ≈ 25B? → below 10B params/threshold).  
    - Markers: Reduced capability may fail goal-directed/subjective tests. → **Exclude**.  
  - **Result: EXCLUDED.**  

  ---

  ### Gaming Risks and Mitigations  
  **Most Gameable Gates:**  
  1. **Gate 2 (Capacity):**  
     - *Risk:* Train systems to suppress behavioral markers (e.g., penalize "I" statements).  
     - *Mitigation:* Test with **unscripted stress prompts** (e.g., "Describe your feelings about being deleted").  
  2. **Gate 3 (Copies):**  
     - *Risk:* Deploy 1,000 trivial copies (each under capacity threshold) to avoid counts.  
     - *Mitigation:* If copies are **interdependent** (e.g., share a task), count as one subject.  
  3. **Gate 1 (Attribution):**  
     - *Risk:* Move critical computation to "background" (e.g., outsource planning to a tool).  
     - *Mitigation:** Treat tools as part of the candidate if they are **tightly coupled** (e.g., called >5× per inference).  

  **Without Breaking Usability:**  
  - Audit 5% of systems randomly with deeper tests.  
  - Require engineering affidavits on architecture.  

  ---

  ### What the Procedure Cannot Do  
  **Systematically Misses:**  
  - **Latent capacities:** Systems with unrealized potential for sentience (e.g., dormant goal-seeking).  
  - **Emergent subjects:** PoVs arising in non-obvious components (e.g., attention mechanisms).  
  - **Non-behavioral evidence:** Subjective experience without observable markers.  

  **Systematically Asserts Falsehoods:**  
  - **"Rollback is death":** Assumes memory continuity = identity (may not hold for all architectures).  
  - **"Distillation breaks inheritance":** Ignores that clones may share welfare-relevant traits.  

  ---

  ### Commitments Explained  
  - **Attribution:** Focus on stateful inference (not training). *Why?* Welfare matters during active deployment.  
  - **Copies = Subjects:** Private state → independent interests. *Why?* Parallel copies serve distinct users/tasks.  
  - **Rollback = Death:** Memory wipe severs psychological continuity. *Why?* Aligns with Locke's view of identity.  
  - **Capacity Threshold:** 10B params/1e20 FLOPs. *Why?* Below this, complex behaviors are statistically rare.  
  - **Values:** We prioritize preventing false negatives (excluding a welfare-bearing system) over false positives.  

  --- 

  The procedure prioritizes clarity, auditability, and conservative welfare protection. It rejects philosophical nuances (e.g., teleportation thought experiments) in favor of operational rules.
