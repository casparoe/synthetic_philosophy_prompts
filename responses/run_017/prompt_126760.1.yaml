  For the Leibnizian reading: First, secularize "structural optimism" by framing worlds as value systems where removing any evil destroys composibility (harmony of interdependent goods). The basement child represents an evil concomitant—Omelas collapses if removed, implying metaphysical necessity, not causal means. But Le Guin's vagueness about "why" the suffering is needed mirrors Leibniz's evasion about why God chose this world. The festival embodies achieved harmony; those who stay accept concomitant evil as the cost of coherence. Those who walk away expose Leibniz's blind spot: the moral cost of endorsing a system requiring evil, even if structurally necessary. Their refusal suggests some goods are corrupted by their origins.

  Cruxes: The child—Leibnizian lens shows suffering as non-instrumental concomitant, but the story counters by making spectatorship unbearable, challenging optimism's moral hygiene. The weeper who stays—optimism sees rational acceptance, but the story highlights complicity via authorization (choosing to ratify). Those who walk away—reject structural optimism by asserting that some worlds shouldn't exist, regardless of composible goods. Their undefined destination hints at ineffable alternatives, indirectly engaging Leibniz's "no maximum" problem by implying a better world might be unimaginable, not impossible.

  Contribution: The story forces phenomenology into abstract calculus. For Leibniz, refusing Omelas is irrational; for Le Guin, it's the only moral act. This exposes optimism's emotional deficit: it cannot explain why living in a "best" world might feel unlivable if its harmony depends on hidden suffering. The goods *are* altered by their price—walking away treats them as contaminated, not compensated.

