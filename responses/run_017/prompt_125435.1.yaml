   3. Debrief (15 minutes):

      - (a) The gap in costs: In round 2, the signal cost 8 for H and 11 for L. The gap of 3 meant that L could not afford to signal (because 10-11=-1<0) while H could (10-8=2>0). In round 4, we subsidized by 2, so the costs became 6 and 9. The gap is still 3, but now L can afford to signal (10-9=1>0) and does, so the signal becomes meaningless. The absolute cost is less, but the gap is what allows separation.

      - (b) Expectations: In round 1, because the cost was low, everyone signalled and the receiver accepted. In round 3, because the cost was high, no one signalled and the receiver (probably) accepted anyway? Or did they reject? If they accepted, then we have a pooling equilibrium without signalling. If they rejected, then we have a pooling equilibrium where everyone is rejected. Both are possible and depend on what the receiver expects.

          In round 2, we had separation because the receiver expected that only H would signal.

          You can see that the same world (same types and costs) can have different outcomes based on expectations.

      - (c) The top type not signalling: We didn't do it, but in theory, imagine a slightly different world. Suppose there are three types: low, medium, high. Suppose that medium and high can be told apart from low by a free trait (blue vs red). But then medium and high look alike. 
          - If the receiver only wants to accept high (because medium is not good enough), then medium and high both would be rejected if they do nothing.
          - But then they might use a signal. However, if the signal is more costly for medium than for high, then high can afford to signal and medium cannot, so we get separation: high signals and is excepted, medium does not and is rejected.
          - But then the high type is signalling. We want the high type to not signal and be recognised.
          - To achieve that, imagine that the receiver is willing to accept medium as well, but at a lower price. Or that there is a costly signal that medium must send to be accepted, but high is accepted even without signaling. For that to work, the receiver must be able to believe that not signaling means high. But then medium would mimic high by not signaling. So to prevent that, we need that if medium does not signal, they are rejected. This requires that the receiver has a way to know that not signaling could be medium and then rejects. But then high would be rejected too. 
          - This is the essence of the 'handicap' and why it's hard to have the top type not signalling. In nature, it happens that the very best can afford to not grow the costly trait and still be recognised because they are so fit. But in a one-round game, it's hard to model.

           verbally: if there is a signal that is very costly and that medium types are required to send in order to be taken for medium, but the high type does not need to send it because they are already recognise as high by other means. But in our game, we only have one signal.

   4. Predictable problems:

      - Players might signal out of boredom or generosity: Encourage them to maximize their own chips.

      - Receivers trusting the free message out of politeness: Remind them that the message is free and can be anything, and they should only care about their payoff.

      - Type distribution leaking: Use a large enough group and random assignment. Don't let players reveal their type.

      - Someone being meta: If a player always signals or never signals, it might affect the equilibrium. In the debrief, discuss that in real life, people learn and adapt.

      - The group failing to notice the band: make sure to record on a board the cost and the observed behavior (number of signals, number of accepts/rejects) for each round. Then in the debrief, show how behavior changed with cost.

   5. What the game cannot reproduce:

      - In nature, the signal (like a peacock's tail) is not chosen; it is grown. The cost is fixed by biology, and the correlation between the signal and quality is maintained by evolution over generations. In our game, players choose whether to signal based on immediate cost-benefit, and the receiver learns within the game. In nature, there is no conscious choice, but the effect is as if there were.

      - This gap matters for understanding how biology can have signalling without intention. But for economics, where people do choose, the game is more directly applicable.

      - Also, in the game, the cost difference is assigned by us. In nature, the cost difference arises from the underlying quality (e.g., a healthy animal can afford to allocate resources to the signal).

  Despite these gaps, the game captures the core logic of costly signalling.

   Given the complexity, we hope this provides a valuable experience.
answer: |-
  ### Costly Signalling Game for Philosophy & Economics Club  
  **Designed for Self-Running Activity with Minimal Instructor Intervention**

  ---

  ### 1. **Rules, Materials, and Script**  
  **Materials Needed**:  
  - Poker chips (at least 200, in denominations of 1, 5, 10).  
  - Deck of type cards:  
    - Rounds 1–3: 10 "High" (H), 10 "Low" (L) cards (20 total).  
    - Round 4: Same as above.  
    - Round 5: 7 "High" (H), 7 "Medium" (M), 7 "Low" (L) cards (21 total).  
  - Index cards for free messages.  
  - Whiteboard to display round-specific "signal cost" and track outcomes.  
  - Random ID generator (e.g., numbered slips in a hat).  

  **Rules Summary**:  
  - Each round, players are paired anonymously (no names, random IDs).  
  - **Sender**: Draws a hidden type card (e.g., "High" or "Low"). Chooses to send a "signal" (costs chips) and/or a free written message.  
  - **Receiver**: Sees only the signal (present/absent) and message. Decides to "accept" or "reject" the sender.  
  - **Payoffs**:  
    - Sender accepted: Gains 10 chips, minus signal cost (if sent).  
    - Sender rejected: Gets 0, minus signal cost (if sent).  
    - Receiver accepted: Gains 10 chips if sender is High, loses 10 if Low/Medium.  
    - Receiver rejected: Gains 0.  
    - Signal cost varies by type (High pays less than Low).  
  - Roles rotate each round.  
  - **Key**: Types and actions are **private**. No discussing types or strategies across rounds.  

  **Script to Read Aloud**:  
  > "Welcome! Today, we’re playing an anonymous matching game. Each round, you’ll be paired as a *sender* or *receiver*.  
  > - **Senders**: You’ll draw a secret *type card* (High, Low, or Medium). Your type affects how much a *signal* costs you. You can:  
  >   1. **Send a signal** (costs chips, amount shown on the board).  
  >   2. **Send a free message** (write anything; no cost).  
  > - **Receivers**: You’ll see if a signal was sent and read the message. Then, **accept or reject** the sender.  
  >  
  > **Payoffs in chips**:  
  > - If accepted, the sender gains 10 chips (minus signal cost if sent).  
  > - If rejected, the sender gets 0 (minus signal cost if sent).  
  > - The receiver gains 10 chips if the sender is High, loses 10 if Low/Medium, and gets 0 if rejected.  
  >  
  > **Rules**:  
  > 1. Your type is secret. Don’t reveal it.  
  > 2. We’ll rotate roles each round.  
  > 3. Chips = points. Highest total wins a small prize.  
  >  
  > Let’s start! I’ll announce the signal cost each round."

  ---

  ### 2. **Round-by-Round Sequence & Payoff Arithmetic**  
  **Payoff Table**:  
  | Sender Type | Signal Cost | If Accepted | If Rejected |  
  |-------------|------------|-------------|------------|  
  | High (H)   | `c`        | 10 - `c`    | -`c`       |  
  | Low (L)    | `c + 3`    | 10 - (`c+3`)| -(`c+3`)   |  
  | Medium (M) | `c + 3`    | 10 - (`c+3`)| -(`c+3`)   |  

  **Cost Band Arithmetic** (for separation):  
  - **Condition for H to signal**: `10 - c > 0` → `c < 10`.  
  - **Condition for L to NOT fake**: `10 - (c + 3) ≤ 0` → `c ≥ 7`.  
  - **Net payoff to L who fakes (inside band)**: `10 - (c + 3) = 7 - c` (e.g., at `c=8`, `7-8 = -1 < 0`).  
  - **Band where signalling works**: `7 ≤ c < 10`.  

  **Rounds**:  
  1. **Round 1 (c=5)**:  
     - *Goal*: Pooling equilibrium (all signal).  
     - Signal cost: H=5, L=8.  
     - Predicted: All senders signal (cost is low).  

  2. **Round 2 (c=8)**:  
     - *Goal*: Separating equilibrium (H signals, L does not).  
     - Signal cost: H=8, L=11.  
     - Predicted: Only H signals (L cannot afford: `10-11 = -1 < 0`).  

  3. **Round 3 (c=12)**:  
     - *Goal*: Pooling equilibrium (no one signals).  
     - Signal cost: H=12, L=15.  
     - Predicted: No one signals (cost too high; even H: `10-12 = -2 < 0`).  

  4. **Round 4 (c=8 + subsidy of 2)**:  
     - *Goal*: Collapse separation.  
     - Signal cost: H=8-2=6, L=11-2=9.  
     - Predicted: All signal (L now profits: `10-9=1 > 0`).  
     - **Welfare impact**: Total chips fall (see arithmetic below).  

  5. **Round 5 (c=8, three types)**:  
     - *Setup*: Add "Medium" type. Receivers see a **color hint**:  
       - Low: ♠️ (spade) on card.  
       - Medium/High: ♥️ (heart) on card.  
     - *Goal*: Top type (H) skips signal; silence is informative.  
     - Signal cost: H=8, M=11, L=14.  
     - Predicted: M signals, H does not, L does nothing (known from ♠️).  
     - **Equilibrium condition**:  
       - H’s payoff if silent: Accepted as High → `10 > 0`.  
       - M’s payoff if signals: `10 - 11 = -1 < 0` BUT must signal to avoid rejection (since ♥️ could be M or H).  
       - Receiver: Accepts ♥️ only if signal absent (infers H).  

  ---

  ### 3. **Debrief (15 Minutes)**  
  **Map Observations to Concepts**:  
  - **(a) Cost gap (not absolute cost)**:  
    - In Round 2 (c=8), L couldn’t fake (`-1`), but in Round 4 (c=6 effective), L could (`+1`). Same gap (3 chips), but subsidy changed outcomes.  
    - **Key moment**: Round 4 collapse shows cost gap drives separation.  
  - **(b) Expectations sustain outcomes**:  
    - Round 1: All signaled → receivers accepted (expected signals = honest).  
    - Round 3: No one signaled → receivers might reject (expected no signal = low?), but if they accept, pooling holds.  
    - **Key moment**: Ask why Round 3 receivers might accept/reject without signals. Beliefs dictate the equilibrium.  
  - **(c) Top type skips signal**:  
    - Round 5: Silent ♥️ senders were likely High (M signaled to prove they’re not Low).  
    - **Key moment**: Silence was a credible "I don’t need to prove" signal.  

  **Name the Handicap Principle**:  
  > "What you discovered is the *handicap principle*: Signals are credible only if they’re costlier for ‘frauds’. The gap in costs—not the absolute burn—lets receivers trust them. Biology and economics use this: from peacock tails to job markets."

  ---

  ### 4. **Predictable Problems & Fixes**  
  - **Problem**: Players signal out of boredom/generosity.  
    - *Fix*: Remind them chips = prize. Say: *"Remember, chips are your score—play to maximize them!"*  
  - **Problem**: Receivers trust free messages (politeness).  
    - *Fix*: Pre-round reminder: *"Messages are free. Anyone can claim to be High."*  
  - **Problem**: Type distribution leaks from deck.  
    - *Fix*: Use large decks; shuffle visibly. Say: *"Types are random—don’t assume others’ cards."*  
  - **Problem**: Meta-strategies (e.g., "never signal").  
    - *Fix*: If a player does this, note it in debrief: *"Some tried always/never signaling. Did it work when costs changed?"*  
  - **Problem**: Group misses cost band (rounds too short).  
    - *Fix*: Track outcomes on board: "Cost", "% Signaling", "% Accepted". Debrief: *"Look how behavior flipped at c=7 and c=10."*  

  ---

  ### 5. **What the Game Can’t Reproduce**  
  **The Gap**: In biology, signals (e.g., antlers) aren’t chosen—they’re grown. Costs are fixed by anatomy, and the signal-quality link is maintained by evolution (selection over generations), not reasoning.  

  **Why It Matters**:  
  - The game shows the *logic* (cost gaps, expectations, top-type silence) but not the *mechanism*.  
  - In biology, no one calculates payoffs—selection "chooses" traits that work.  
  - **What to Add Verbally**:  
    > "In nature, a deer’s antlers are costly to grow. Weak deer *can’t* grow large antlers without starving, so antlers signal strength. This evolved because ancestors with this trait survived better—not because deer did the math. Our game captures the outcome, not the blind process."  

  **Takeaway**: The club will grasp why costly signals work, but you’ll need 2–3 minutes to clarify that biology uses evolution, not rational choices, to create the correlation.  

  ---  
  **Run Time**: 80 mins = 5 min intro, 60 mins gameplay (12 min/round), 15 min debrief.  
  **Why It Works**: Students "walk into" (a), (b), (c) via play. Subsidy round makes (a) visceral, Round 5 nails (c).
