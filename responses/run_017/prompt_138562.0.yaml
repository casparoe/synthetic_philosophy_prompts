answer: |-
  Here's a distilled framework for "blame" in the thin, forward-looking sense you seek, followed by key clashes and knockout powers:

  ### Core Requirements for a Valid "Blame" Account
  1. **Testability**: Must specify *in advance* what evidence (even hypothetical) would falsify/support it. *(Prevents "mood" arguments)*  
  2. **Contemporary Perspective**: Uses only knowledge available to key actors **circa 1945-47**. *(Filters hindsight bias)*  
  3. **Causal/Blame Separation**: Distinguishes:  
     - **Causation**: "Whose actions most directly precipitated the outcome?"  
     - **Blameworthiness**: "Who had viable alternatives that *avoided the bad equilibrium*?"  
     - **Merits**: "Whose actions were most unjust/aggressive *at the time*?"  
  4. **Non-Zero-Sum Blame**: Accepts "both" can share blame, but requires specifying *degrees* and *asymmetries*. *(Rejects vague "both sides" as non-answer)*  
  5. **Lock-In Focus**: Identifies who **eliminated off-ramps** making hostility self-sustaining. *(Your key insight)*  

  ---

  ### Key Requirement Clashes (Pairs That Conflict)
  | **Conflict Pair**               | **Why They Clash**                                                                 |
  |---------------------------------|------------------------------------------------------------------------------------|
  | **Testability + Contemporary Perspective** | *Pre-archives evidence is fragmentary. Many testable claims (e.g., Stalin's true intentions) require later-revealed documents, creating tension between rigor and historical context.* |
  | **Blameworthiness + Lock-In**   | *Lock-in focuses on structural outcomes; blameworthiness requires assessing *feasible choices*. Proving alternatives existed (e.g., could Stalin have accepted a demilitarized Germany?) is inherently speculative with 1946 knowledge.* |

  ---

  ### Single Requirement With Most Knockout Power
  **Contemporary Perspective (Requirement #2)**  
  - **Knocks Out Traditionalists**: Relies on later-revealed Soviet archives (e.g., aggressive telegrams) unavailable in 1946. Overweights U.S. perceptions of USSR as inherently expansionist.  
  - **Knocks Out Revisionists**: Uses hindsight about U.S. economic hegemony/militarism (e.g., atomic diplomacy impact) that wasn't fully apparent pre-1947.  
  - **Knocks Out Post-Revisionists**: Their "mutual misunderstanding" narrative often depends on comparing *both sides'* later-revealed archives, violating the 1946 infoset.  

  ---

  ### On Your Pet Theory: "Lock-In Blame"  
  **It's a genuine requirement**, not smuggled consequentialism. Consequentialism judges acts by outcomes; **lock-in blame** asks: *"Who first made cooperative outcomes infeasible through their choices?"* This focuses on:  
  - **Irreversibility**: Which actions destroyed trust/institutions needed for de-escalation? (e.g., Sovietization of Poland vs. Marshall Plan)  
  - **Asymmetry of off-ramps**: If one side's off-ramp required the other to capitulate on core security, blame shifts to the side demanding capitulation.  
  **Case Application**: If Stalin's 1946-47 actions (e.g., Iran crisis, Polish purge) made Eastern Europe non-negotiable, *before* the Truman Doctrine, lock-in blame falls on USSR—even if the U.S. "escalated" later with Marshall Plan.  

  ### Zero-Sum?  
  Blame is **not zero-sum**. One actor can bear 90% responsibility for eliminating off-ramps; the other 10% for poor crisis management. "Both" is only valid if roles are specified (e.g., "USSR triggered lock-in; U.S. exacerbated rigidity").  

  ### Bottom Line  
  A defensible account must:  
  - Pinpoint the **irreversible action(s)** using 1946 knowledge (e.g., Stalin rejecting the Baruch Plan *on terms that killed atomic cooperation*).  
  - Show why alternatives **feasible at the time** were rejected (e.g., Did the U.S. *have* to universalize the Truman Doctrine?).  
  - Accept that evidence gaps may preclude certainty—but the *framework* must demand testable claims anyway.  

  This forces the debate beyond "who shot first?" to "who welded the doors shut?"—which aligns with your goal of learning for next time.
