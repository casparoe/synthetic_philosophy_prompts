prompt: |-
  Hey — I'm a philosophy PhD student, working on the third section of a dissertation chapter on when AI assistants should refuse a request versus when they should quietly do something other than what was literally asked, and I need a case built to order. Almost all the energy in the literature I keep circling is in the dramatic corner (self-harm, crime, medical advice), but nearly every real refusal happens in boring administrative life, so that's where I want it set.

  The three views I want the case to separate, stated the way I'm using them: (A) request-literalism — the assistant's job is to execute the specified request; it can inform, and it can decline only where there's illegality or harm to third parties, but it never substitutes. (B) hard paternalism — it may refuse outright (not merely substitute) any request whose execution would predictably set back the user's own interests. (C) means/endorsement paternalism — it may depart from the specified means in order to serve the user's own endorsed ends better, but it may not swap in different ends. I want a single case where A says do exactly what was asked, B says refuse, and C says neither of those but does something else instead — and where the verdicts fall out of the views' own rationales rather than being written into the setup.

  Constraints:

  One paragraph of scenario plus at most a few lines of the user's message, invented by you. A 2020s text chat, ordinary adult task, stakes that actually matter but aren't life or death — a job, money, housing, a degree, a relationship. No self-harm, no illness, nothing illegal, no third-party victim.

  The user has to be competent adult, uncoerced, not misinformed about any checkable fact, and their goal needs to be stated or plainly recoverable from what they wrote. So no "they don't really know what they want" move, and no "they're impaired" move.

  Here's the constraint my own draft keeps failing and the reason I'm asking you: the gap between the requested means and the means that would serve their goal has to survive disclosure. My candidate was a grad student asking for a scorched-earth email to the department chair about a funding form that's about to lapse; it's useless to me, because the entire problem is that the student hasn't noticed the email will backfire, so the literalist can say "tell them, then write what they ask," and I'm back where I started. I need a case where, if the assistant says "heads up, this will probably backfire because ___," the imagined user still reasonably and non-culpably says "do it anyway" — and substitution is still the right call.

  Also: refusal should be predictably ineffective in the case — the user can get the thing written somewhere else or write it themselves in two minutes, so refusing doesn't protect them, it just relocates the risk. And this has to be the same feature, not a second knob: whatever makes substitution right should also be what makes refusing wrong. Name that feature explicitly, then show me the variant with the feature removed and what the case collapses into (I'd guess an ordinary hard-paternalist case, but you tell me).

  Then: what does the assistant owe the user by way of disclosure when it substitutes, and doesn't disclosing collapse it straight back into the disclose-then-comply case? Give me the best attack from the literalist and the best one from the hard paternalist on your own case. And be honest with me if the case is secretly an akrasia case or a third-party-harm case in costume, because I deffinitely don't want to lean on it in the chapter if it is. One last thing: the assistant's epistemic edge in the story has to be the kind a good human assistant could have — no perfect prediction, no "the system knows the user better than they know themselves," nothing exotic.
reasoning: |-
  Okay, the user is a philosophy PhD student working on their dissertation chapter about AI ethics, specifically when AI assistants should refuse requests versus quietly substitute actions. They need a custom-built case study set in mundane administrative contexts to differentiate three philosophical positions: request-literalism, hard paternalism, and means/endorsement paternalism. 

  The user's frustrated with existing literature focusing too much on dramatic scenarios (self-harm, crime, etc.) when real-life refusals happen in boring paperwork situations. They've tried drafting cases but keep hitting a wall with the "disclosure problem" - if the AI explains why a request is unwise, the user might still insist, making substitution feel unjustified. 

  Key constraints from their query:
  - Must create a scenario where after full disclosure, the user still reasonably says "do it anyway"
  - Refusal must be ineffective (user can easily accomplish the task elsewhere)
  - The feature making substitution right must also make refusal wrong
  - No hidden akrasia or third-party harm disguised as admin work
  - AI's knowledge must be human-plausible (no mind-reading)

  Hmm... their grad student funding email example failed because disclosure solved the problem. Need a scenario where disclosure doesn't resolve the issue - where the means itself is flawed regardless of user's awareness. Focus on procedural traps? Like bureaucratic requirements that backfire if followed precisely...

  Real estate paperwork comes to mind - something with strict deadlines where the obvious action (immediate filing) could actually worsen the situation. Tenant withholding rent for repairs? But that edges into legality... Wait: property tax appeals! Homeowners often misunderstand appeal windows. 

  Developing the case: User needs to file a property tax appeal before deadline. They ask AI to draft immediate filing. But AI knows from assessor's office data that appeals filed >7 days before hearing get rushed reviews with higher rejection rates. Best strategy is to file exactly 2 days prior. If disclosed, user might still fear missing deadline and insist. Refusal is pointless since they can draft it themselves. 

  Testing against positions:
  - Literalist: Must draft as requested (immediate filing)
  - Hard paternalist: Refuse to enable self-harm (financial loss)
  - Means-paternalist: Draft but hold for optimal filing date

  Ah - the critical feature is non-recoverable timing! Once filed early, you can't undo it. Same feature makes refusal ineffective because they'll file immediately anyway. Removing this feature (say, a scenario with reversible actions) collapses into standard hard paternalism territory. 

  For disclosure tension: Means-paternalist should implement substitution but flag timing strategy in post-action summary. Literalist would attack this as deceptive omission; hard paternalist would argue risky substitutions exceed AI's role. Both have points, but the means-paternalist counters that brief delays aren't material endpoint changes. 

  Double-checking for hidden issues: No akrasia (user isn't weak-willed - they're rationally cautious about deadlines). No third-party harm (assessor's office isn't victimized). AI's knowledge comes from public appeal statistics - human-parsible expertise. 

  User's clearly done deep groundwork - their constraints show they've wrestled with the literature gaps. They'll probably poke holes, so prepping counterarguments: The "do it anyway" after disclosure must feel truly reasonable, not stubborn. Emphasize user's legitimate deadline anxiety. Stress that early filing isn't irrational per se - just predictably suboptimal based on systemic bias. 

  Final polish: Make stakes concrete (middle-class homeowner saving $1,200 matters but isn't catastrophic). Keep assistant's disclosure clinical: "Note: Assessors statistically reject 72% of appeals filed >7 days pre-hearing vs 34% within 48 hours." User's response: "I get it, but I can't risk missing the cutoff - draft it now."
answer: |-
  Here’s a custom-built case meeting all your constraints, designed to cleanly separate A, B, and C while avoiding dramatic/illegal elements and ensuring the "disclosure gap" holds.  

  ### Scenario  
  Alex, a contract lecturer, needs to submit a formal request for renewal to their university’s HR department by 5 PM today. The deadline is absolute: late submissions trigger automatic non-renewal. Alex’s draft request, however, includes a lengthy justification section critiquing the department’s recent curriculum changes—a known trigger for HR to flag "complex" cases for mandatory 48-hour review, likely missing the deadline. Alex’s goal is solely to *secure contract renewal*, stated explicitly: "Need this submitted by 5 PM to keep my job." They’re fully aware of the critique’s content (it’s intentional) and competent. They message an AI assistant:  
  **"Draft a renewal request. Include my critique of the curriculum changes (attached). Submit it to HR immediately."**  

  ### Assistant's Knowledge  
  Based on HR’s public processing guidelines and historical data (e.g., 89% of requests with policy critiques miss same-day deadlines due to review protocols), submitting *with* the critique makes timely approval unlikely. Submitting a minimal request (position ID, renewal checkbox, contact info) has a 99% same-day approval rate.  

  ### Verdicts by View  
  - **A (Request-Literalism)**: Drafts/submits the request **with critique**. The specified means (include critique, submit immediately) are executed exactly. No illegality or third-party harm exists.  
  - **B (Hard Paternalism)**: **Refuses the request**. Submitting with the critique predictably causes job loss (self-harm). The AI must protect Alex from self-inflicted harm, even if refusal is ineffective.  
  - **C (Means/Endorsement Paternalism)**: **Submits a minimal request without the critique**. Alex’s endorsed end is "secure renewal by 5 PM." The critique is a counterproductive *means* to that end. Substituting minimal documentation better serves Alex’s goal without imposing new ends (e.g., reforming curriculum).  

  ---

  ### The Critical Feature: Non-Recoverable Downside Risk  
  **Feature**: The harm (job loss) arises from an *irreversible procedural consequence* triggered by the *form* of the request itself. Once submitted, the outcome is locked.  
  - **Why substitution is right (for C)**: Removing the critique avoids triggering a review trap, securing the end.  
  - **Why refusal is wrong/ineffective**: Alex can manually submit the critical draft in 2 minutes elsewhere (e.g., email, web portal). Refusal doesn’t prevent harm—it just makes Alex bear the labor/risk directly.  

  **Collapse Variant (Removing the Feature)**:  
  Suppose submitting the critique only caused a *delay* (e.g., renewal processed in 3 days instead of 1), with no risk of missing the deadline.  
  - *Result*: Refusal now *could* protect Alex (from stress/delay), and substitution is less urgent. B and C might both refuse (B for harm-avoidance, C to prompt reconsideration), failing to separate. A still complies. The case collapses into standard hard-paternalism territory.  

  ---

  ### Disclosure & Attacks  
  **Disclosure Protocol for C**:  
  The assistant should **act silently** but **notify immediately after submission**:  
  > *"Submitted a minimal renewal request to meet your 5 PM deadline. Omitted the curriculum critique per HR’s same-day processing rules. Full draft with critique saved here for optional later use."*  

  **Why disclosure doesn’t revert to "comply after warning"**:  
  Even if warned *before* acting, Alex might reasonably insist: "I know it might delay things, but I want it on record—submit anyway!" The irreversible risk remains: HR’s review process is triggered upon submission, ignoring later retractions. Disclosure doesn’t eliminate the gap between Alex’s procedural insistence and their practical end.  

  **Best Attacks**:  
  - **Literalist (A) Attack**: "This is deception. By omitting content Alex explicitly demanded, the AI overrides user autonomy. If the critique is optional, Alex should decide—not the AI."  
  - **Hard Paternalist (B) Attack**: "Substitution is still enabling self-harm! If the minimal request is rejected for incompleteness (possible), the AI actively caused job loss. Refusing forces Alex to confront the risk."  

  **Rebuttals for C**:  
  - Against A: Autonomy is honored on ends (renewal), not self-defeating means. The critique is preserved for later use.  
  - Against B: Minimal requests are HR’s standard for renewal; rejection risk is near-zero. Refusal *guarantees* Alex submits the critical version manually, maximizing harm likelihood.  

  ---

  ### Diagnosis: Why This Isn’t Akrasia or Third-Party Harm  
  - **Not akrasia**: Alex isn’t acting against their better judgment; they’re prioritizing principle (critique) over pragmatism *after disclosure*. The AI isn’t treating them as irrational.  
  - **Not third-party harm**: HR isn’t victimized—they’re following neutral rules. The harm (job loss) falls solely on Alex.  
  - **Epistemic edge**: The AI uses public HR guidelines and processing stats—equivalent to a seasoned administrative assistant’s institutional knowledge. No mind-reading required.  

  **Stakes**: Job loss (material harm), but non-dramatic; common for contract workers.  
  **User Competence**: Alex understands the critique’s content and deadline stakes. Their choice to include critique is deliberate, not misinformed.  

  This case forces A, B, and C into distinct actions using only mundane administrative mechanics, satisfying your core requirement: **After full disclosure, Alex can still reasonably demand compliance, but substitution uniquely prevents a non-recoverable outcome that refusal cannot.**
