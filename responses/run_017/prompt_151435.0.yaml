  The committee's process could be improved by making the combination method more evidence-sensitive. Where strong project-specific evidence exists, it should likely anchor the forecast, with the reference class providing sanity-check boundaries rather than being averaged mechanically. The 24-month result illustrates how averaging can produce numbers that lack any evidentiary basis.

