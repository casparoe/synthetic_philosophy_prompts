prompt: |-
  I've been reading about animal minds in my spare time (I'm not a philosopher, I do data engineering) and I keep tripping over the same shape of argument whenever insects come up. Let me give two instances instead of describing it abstractly.

  Instance one. Someone says: an injured insect's behaviour doesn't seem to be modulated by anything else going on, there's no sign of an enduring state that carries over, the whole nervous system is tiny — so I'd put maybe 5–10% on there being anything it's like to be that insect. Fine. Two paragraphs later the same person does the arithmetic that's supposed to show this is the biggest thing in the world: absurd numbers of insects alive at any one time (quintillions), times that probability, times how bad a unit of suffering is — and for that last factor they use more or less the number they'd use for a chicken, maybe shaved down a bit. But if the reason for the 5–10% is that the machinery is minimal, that same reason ought to tell you that *conditional on* there being something it's like, it'll be a thin, small thing rather than a full-blooded pain. The consideration gets used once and then quietly dropped.

  Instance two, from someone arguing the other side. He says: suppose insects are conscious, fine, but what they'd have is a bare flash of something unpleasant, a fraction of a second, no memory and no anticipation — so the amount of welfare at stake per insect is negligible. Then when he's asked how likely it is that insects are conscious at all, he uses a very permissive test, where any valenced state whatsoever counts, which pushes the probability up. So he has probability high and magnitude low. The first person has probability low and magnitude high. It looks like the same evidence — how simple the system is — gets read as bearing on one dial and declared irrelevant to the other, and which dial it gets applied to tracks which conclusion the person already wanted. My suspicion is that wherever you set the bar for what counts, the dials move in opposite directions and more or less cancel, so the resulting expected number barely moves and the actual disagreement is somewhere else. But I'm not confident that's right either.

  Is there a name for this? The nearby things I've found don't fit. It's not plain correlation neglect, I think, because the complaint isn't that people are ignoring a statistical correlation between two things out in the world — it's that the two quantities look like one question split in two, so it isn't obvious they can vary independently at all. It's not double counting either: nobody is counting the same consideration twice, they're counting it once and then refusing to count it the second time. And it's not the usual worry about enormous numbers multiplied by tiny probabilities, because that worry is about the size of the answer, whereas mine is about whether the thing is assembled consistently.

  So: is there an established concept, or a bit of literature, on this exact configuration? If there is, I want to know how close the fit is and what's left over. If there isn't, I want it named and properly carved — and I don't mean a label, I mean what exactly the phenomenon is, what the mechanism is, whether the cancellation I half-believe in actually holds, and which cases fall outside it (I can think of situations where the two dials genuinely should move sepearately, and I'd want those excluded rather than swallowed).

  Could you write it up in four sections: "Closest concepts in the literature" (about 250 words) on what's already out there that this resembles; "How each one falls short" (about 250 words), covering the three I ruled out above as well as anything else you'd nominate; "What's actually going on" (about 300 words) on the mechanism, whether the two factors really are entangled, and whether the cancellation goes through; and "Name, definition, and boundary cases" (about 200 words) with a term, a definition tight enough to apply to a new case, and two cases that look similar but should be excluded.
reasoning: |-
  Okay, let me unpack this user's query. They're a data engineer exploring animal consciousness, specifically insect sentience, and noticing a pattern in arguments where the same evidence (insect neural simplicity) is used to adjust either the probability of consciousness or its moral weight, but not both consistently. This selective application seems to bias conclusions. 

  Hmm, the user describes two polarized examples: one where low probability gets paired with high moral weight per individual, another with high probability but negligible weight. Their core observation is that neural simplicity should affect both factors - it lowers the chance of consciousness AND reduces its intensity if present. But arguers treat them as independent dials. Clever catch.

  The user already ruled out correlation neglect, double-counting, and tiny-probability-large-number concerns. They want to know if this specific inconsistency has a name or literature. More importantly, they seek rigorous conceptual carving - not just labeling, but defining boundaries and testing cancellation. 

  First, I scan for existing concepts:
  - Expected utility theory handles probability/severity products, but doesn't address biased factor isolation.
  - Moral weight uncertainty frameworks exist, but assume independence.
  - Scope neglect is adjacent but about quantity sensitivity, not internal inconsistency.
  Nothing fits perfectly.

  Key insight: The factors aren't independent because they share a root cause (neural simplicity). Treating them as separable is the flaw. In probability terms, P(conscious) and E[severity|conscious] are negatively correlated through the mediating variable. 

  For the cancellation hypothesis: It holds if severity diminishes proportionally as P(conscious) decreases due to the same cause. But not universally - sometimes simplicity only affects probability (e.g., binary systems). Boundary case: Mammalian pain studies can adjust severity estimates without touching probability because complexity varies within conscious entities.

  This needs a name. "Consciousness probability-severity decoupling"? "Moral weight factorization bias"? I'll workshop it...
answer: |-
  Here's a breakdown addressing your query, structured as requested:

  **1. Closest Concepts in the Literature (≈250 words)**  
  Several concepts touch on aspects of your observation:
  *   **Expected Value/Utility Framework:** The core calculation (Probability × Magnitude) is fundamental to decision theory and ethics under uncertainty (e.g., Harsanyi, Singer). Literature on prioritizing causes often uses this structure.
  *   **Moral Weight Uncertainty:** Work in effective altruism and animal ethics (e.g., Tomasik, Rethink Priorities) explicitly grapples with assigning probabilities to sentience *and* scales of welfare capacity, acknowledging deep uncertainty in both.
  *   **Scope Insensitivity/Neglect:** While often about insensitivity to *sheer numbers*, Kahneman & Tversky's work highlights cognitive biases in handling large magnitudes combined with probabilities. Related is the "drowning child" vs. "statistical lives" paradox.
  *   **Conceptual Uncertainty in Consciousness:** Philosophers (e.g., Chalmers, Dennett) debate the "hard problem" and the potential for "micro-consciousness" or radically minimal phenomenal states, which relates to interpreting "thin" experiences.
  *   **Confirmation Bias/Motivated Reasoning:** The tendency to interpret ambiguous evidence in line with prior beliefs is well-documented (Kunda, Nickerson), explaining *why* dials are adjusted selectively.

  **2. How Each One Falls Short (≈250 words)**  
  Your specific critique isn't fully captured by existing concepts:
  *   **Expected Value Framework:** Provides the *structure* but doesn't address the *specific inconsistency* where the *same underlying evidence* (neural simplicity) is used to adjust one factor (P(sentience) or Severity|sentience) while being ignored for the other correlated factor *within the same argument*. The framework assumes factors can be assessed independently, which is precisely what you challenge.
  *   **Moral Weight Uncertainty:** Focuses on the difficulty of estimation, not the *logical entanglement* or negative correlation between the two estimates based on shared evidence. It doesn't diagnose the selective application mechanism.
  *   **Scope Neglect:** Concerns insensitivity to the *outer* number (quantity of insects), not the *internal* logical inconsistency between how evidence impacts the two *components* (P and Severity) of the per-unit calculation.
  *   **Correlation Neglect (Ruled Out):** You correctly note this isn't neglecting a correlation *in the world* (e.g., between sentience and another trait), but about failing to see that the *estimates themselves* for P and Severity|P are logically linked *through the evidence used*.
  *   **Double Counting (Ruled Out):** The problem isn't using the evidence twice, but rather *only applying it to one half of the product* while its implications for the other half are disregarded or minimized.
  *   **Tiny Probabilities/Large Numbers (Ruled Out):** The issue is the *inconsistent assembly* of the expected value components, not skepticism about the resulting large product *per se*.

  **3. What's Actually Going On (≈300 words)**  
  The core mechanism is a **failure to recognize the negative epistemic correlation between estimates of P(Sentience) and estimates of E[Severity | Sentience] when both depend on the same evidence of "minimal cognitive machinery."**

  *   **Entanglement:** The evidence (simple nervous system, lack of integrated behavior) *simultaneously* bears on:
      1.  The likelihood that *any* form of sentience exists (P(S)).
      2.  The *nature* of the sentience *if it exists* (E[S|S]), implying it is likely "thin," fleeting, and low-intensity.
  *   **Mechanism:** Cognitive bias drives the inconsistency. When arguing *against* significant insect welfare concern:
      *   **Strategy A (Low P, High Severity):** Focuses on simplicity as evidence *against* sentience existing (low P), but then, when forced to consider "what if," defaults to a mammalian/anthropomorphic model of suffering (high Severity) because it's readily available, ignoring that the same simplicity evidence implies *low* Severity *if* sentience exists.
      *   **Strategy B (High P, Low Severity):** Uses a minimalist definition of sentience (e.g., any valenced state) that simplicity doesn't strongly rule out (high P), but then emphasizes simplicity as evidence that *if* sentience exists, it must be negligible (low Severity).
  *   **Cancellation:** Your intuition is largely correct. If the evidence of simplicity *systematically* reduces P(S) *and* proportionally reduces E[S|S] (e.g., P(S) is low *because* the system is too simple for rich experience, *and* that simplicity *ensures* low E[S|S] if S exists), then the expected disvalue `P(S) * E[S|S]` remains relatively stable across different interpretations *of that same evidence*. Significant shifts in the product require evidence that *differentially* impacts P(S) vs. E[S|S] (e.g., new evidence suggesting insects have unexpected cognitive integration might raise E[S|S] without changing P(S) much if P(S) was already moderate).

  **4. Name, Definition, and Boundary Cases (≈200 words)**

  *   **Name:** **Factor Isolation Bias in Expected Disvalue Estimation** (FIBEDE) or **Negatively Correlated Factor Neglect** (NCFN)
  *   **Definition:** The error occurring in the calculation of expected value (especially disvalue/welfare impact) when the *same body of evidence* provides a rational basis for negatively adjusting *both* the estimated probability of a state (P(S)) *and* the estimated magnitude of the outcome *conditional on that state* (E[M|S]), but the reasoning process selectively applies this evidence to adjust only *one* factor while neglecting or minimizing its implications for the *other* correlated factor, leading to an inconsistent and potentially biased overall estimate (`P(S) * E[M|S]`).
  *   **Boundary Cases (Excluded):**
      1.  **Independent Factors:** Evidence *only* impacts P(S) or *only* impacts E[M|S]. *Example:* Discovering a specific insect gene definitively linked to pain receptors in vertebrates might increase P(S) without necessarily changing E[S|S] (if the downstream processing complexity is still unknown/uncorrelated). Conversely, finding insects recover instantly from damage might lower E[S|S] without changing P(S) (if sentience is still deemed possible but very transient).
      2.  **Positively Correlated Factors:** Evidence increases both P(S) *and* E[M|S]. *Example:* Discovering complex long-term aversive learning in an insect simultaneously makes sentience *more likely* (higher P(S)) *and* suggests its experiences have greater temporal depth and intensity (higher E[S|S]).
