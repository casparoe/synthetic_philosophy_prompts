prompt: |-
  I'm a first-year PhD student in cognitive science sitting in on an interdisciplinary reading group on cultural evolution, and I keep getting stopped in my tracks by the same sentence. Last week the discussion turned to why wildly improbable claims propagate so efficiently online while careful corrections mostly don't, and one of the senior people in the group ended the argument with the line *memes are like genes*: whatever replicates is what there is more of next generation, so of course truth has nothing to do with it — selection doesn't care whether a meme is true, only whether it copies. Earlier in the same term she had used the very same sentence for what looks like a different purpose: to argue that cultural change is genuinely Darwinian and not merely change over time, because cultural items, like genes, are replicators with lineages, inheritance, and heritable variation, and so the whole apparatus of population thinking is supposed to transfer. I can't tell whether those two uses are the same claim wearing different clothes, and I suspect the sentence is doing a lot of quiet work in both places.

  What I'd like is a menu, not a verdict on who was right. Please set out the distinct precise theses the slogan could be expressing, ordered roughly from the trivial to the radical, and give each a status: platitude, substantive and defensible, substantive and contested, or straightforwardly false. I don't want to hand you my own list, but I'd want the distinctions I keep tripping over to be covered — *like genes* in the sense of having a lineage and a transmission chain; in the sense of being copied with fidelity high enough for cumulative, design-like complexity to accumulate; in the sense of being particulate rather than blending (and what happens to the analogy if cultural transmission is mostly reconstructive and the variants you get out aren't the variants you put in); in the sense of being a unit of selection with interactors and phenotypes further down; in the sense of varying randomly with respect to fitness; and in the sense of being *selfish*, i.e. of having interests that can come apart from the interests of the person carrying them. Say for each reading whether it is even coherent, whether it is testable in principle, and what kind of observation would tell it apart from its neighbors.

  To make that concrete rather than abstract, here is a pair of hypothetical findings I invented to poke at the analogy, and I'd like each reading checked against them. Suppose that in a long-isolated island chain, canoe-building techniques improve measurably in hydrodynamic efficiency over eight centuries while ritual narratives in the same communities change just as rapidly but with no discernible directional trend at all. Suppose also that a costly ritual practice which measurably reduces the number of children its bearers raise to adulthood nevertheless spreads across the whole island group within two centuries, because it is preferentially performed by the most prestigious craftsmen and prestige-biased copying swamps the fertility cost. For each reading: does the first finding support, undermine, or simply not touch it? Same for the second? And — this is what I actually care about — which reading, if any, would really license the conclusion she wanted, namely that we should *expect* cultural selection to be indifferent to whether a meme is true, as opposed to licensing only something much weaker, such as that some cultural items spread for reasons unrelated to their truth, or that transmission mechanisms like copy-the-prestigious and copy-the-prevalent can beat out copy-what-works?

  Two more things, if you can fit them in. First, the same person sometimes switches to the variant *ideas are like viruses*; I have a feeling that slogan carries different baggage — horizontal rather than vertical transmission, no shared fate with the host, host damage as the expected outcome — and I'd like to know whether the two slogans pull in genuinely different directions or whether the switch is just rhetoric. Second, a verdict on the dialectic: if the readings that would get her to her conclusion are the strong ones (selfish replicators whose interests diverge from ours, transmission biased in ways indifferent to truth), and the readings that are safe are the weak ones (lineages exist, variants spread at different rates), is the slogan functioning as an argument at all, or as a way of importing the conclusion under cover of an analogy nobody in the room is going to dispute? A table would suit me best: reading, precise statement, status, prediction about each of the two island findings, and whether it supports the debate-ending move.
reasoning: |-
  Okay, let me tackle this cognitive science PhD student's query. They're struggling with the "memes are like genes" analogy used in two different contexts within their cultural evolution reading group. The core tension is whether the analogy justifies the strong claim that truth doesn't matter for meme propagation, or merely supports weaker interpretations about cultural change.

  First, I need to unpack the possible interpretations of "memes are like genes." The student wants a spectrum from trivial to radical, categorized by status (platitude to false), with testability assessments. They also provided two hypothetical island scenarios to test each interpretation against. 

  Starting with the most basic reading: cultural items have lineages. This seems uncontroversial - we can trace ideas through history. For the canoe example, this interpretation is supported because both canoe designs and rituals show change over time. The ritual spread despite fitness costs? That's neutral here since lineage existence doesn't care about selection pressures. This definitely doesn't support the "truth doesn't matter" conclusion.

  Next level up: cultural items vary and are differentially transmitted. The canoe improvement shows directional variation (selection for function), while random ritual changes show non-directional variation. The costly ritual spread demonstrates prestige bias overriding fitness costs. This captures why truth might not always win, but doesn't necessitate it - it could also explain why true/useful ideas spread. Too weak for the intended conclusion.

  Now the particulate inheritance claim. This is tricky because cultural transmission often involves reconstruction. If canoe techniques improve cumulatively, it suggests sufficient fidelity. But rituals changing randomly implies lower fidelity or different transmission mechanisms. The costly ritual spread doesn't directly bear on particulateness. This interpretation is contested and doesn't strongly support the truth-indifference claim.

  Looking at selection units with interactors. The canoe example shows interactors (the canoes themselves) affecting cultural fitness. The ritual case shows prestige as the interactor overriding biological fitness. This could explain truth-indifference if the interactors aren't truth-related, but doesn't predict it must happen. Substantive but contested.

  The random variation relative to fitness interpretation seems straightforwardly false for culture. Cultural mutations often aren't random - they're directed (e.g., improving canoe designs). Both island cases contradict this. Useless for the truth-indifference argument.

  Finally, the selfish replicator idea. This radical view suggests memes propagate regardless of host benefit. The costly ritual case perfectly illustrates this - the meme spreads despite harming reproductive success. The canoe example doesn't challenge this. This strongly supports the "truth doesn't matter" claim but is highly contested, as most cultural changes aren't parasitic.

  Regarding "ideas are like viruses" - this emphasizes horizontal transmission and host exploitation, aligning with the selfish replicator view. It's more radical than the genetic analogy, focusing on contagion rather than inheritance.

  The dialectic analysis reveals the bait-and-switch: using uncontested weak interpretations to smuggle in the strong, controversial one that supports truth-indifference. The senior researcher's rhetorical move relies on this ambiguity.

  The student's hypotheticals are brilliant for testing these interpretations. The canoe/ritual contrast shows functional vs. non-functional change, while the costly ritual demonstrates maladaptive spread - exactly the scenario needed to isolate the selfish replicator interpretation.
answer: |-
  Here's a menu of precise theses behind "memes are like genes," ordered from trivial to radical, with assessments and responses to your scenarios. The table addresses your core request, followed by analysis of the "ideas are like viruses" variant and the dialectic.

  ### Table: Interpretations of "Memes are like genes"
  | **Reading**                       | **Precise Thesis**                                                                 | **Status**                      | **Canoe vs. Ritual Change** | **Costly Ritual Spread** | **Supports Truth-Indifference?** | **Coherent?** | **Testable?** |
  |-----------------------------------|------------------------------------------------------------------------------------|----------------------------------|------------------------------|--------------------------|----------------------------------|---------------|---------------|
  | **1. Lineage Existence**          | Cultural items have ancestor-descendant lineages forming transmission chains.      | Platitude (trivially true)       | Supports (both show lineages) | Neutral (lineages exist regardless of cost) | No (only implies historical continuity) | Yes | Yes (archaeology, ethnography) |
  | **2. Differential Replication**   | Cultural variants spread at different rates due to transmission biases.            | Substantive & Defensible         | Supports (canoes improve directionally, rituals drift) | Supports (prestige bias overrides cost) | Weakly (shows non-truth factors *can* drive spread, not that truth *can't*) | Yes | Yes (diffusion studies) |
  | **3. Particulate Inheritance**    | Cultural transmission involves discrete, near-fidelity replication (not blending). | Substantive & Contested          | Mixed (canoe progress suggests fidelity; ritual drift suggests reconstruction/lower fidelity) | Neutral (particulateness doesn't predict cost sensitivity) | No | Yes | Yes (experimental transmission chains) |
  | **4. Cumulative Selection**       | High-fidelity copying allows small, adaptive variations to accumulate (design-like complexity). | Substantive & Defensible (context-dependent) | Supports (canoes); Undermines (rituals lack direction) | Neutral (not about complexity) | No (may even imply truth/utility *can* win) | Yes | Yes (innovation studies, historical analysis) |
  | **5. Selection w/ Interactors**   | Memes are units of selection; hosts or artifacts are "interactors" affecting fitness. | Substantive & Contested          | Supports (canoes: artifacts as interactors; rituals: hosts as interactors) | Supports (prestige as interactor) | Conditionally (if interactors aren't truth-tracking) | Yes | Yes (fitness proxies, bias experiments) |
  | **6. Random Variation**           | Cultural mutations arise randomly w.r.t. fitness (like genetic mutations).         | Straightforwardly False          | Undermines (canoe improvements directed) | Undermines (prestige link non-random) | N/A (false) | Yes | Yes (innovation studies) |
  | **7. Selfish Replicators**        | Memes propagate selfishly; their "interests" may diverge from hosts' biological fitness. | Substantive & Highly Contested   | Neutral | Strongly Supports (spreads despite fitness cost) | **Yes** (explicitly divorces replication from host benefit) | Controversial (agency attribution?) | Yes (spread of maladaptive traits) |

  ---

  ### Responses to Your Hypothetical Findings:
  1. **Canoe Improvement vs. Ritual Drift:**  
     - **Supports:** Readings 1 (lineages), 2 (differential replication), 4 (if canoe fidelity enables improvement), 5 (if interactors differ).  
     - **Undermines:** Readings 6 (variation non-random) and possibly 3 (if ritual drift implies low fidelity).  
     - **Neutral:** Reading 7 (selfishness).  

  2. **Costly Ritual Spread via Prestige Bias:**  
     - **Supports:** Readings 2 (bias-driven replication), 5 (prestige as interactor), **7 (selfish replicator - spreads despite host cost)**.  
     - **Undermines:** Reading 6 (non-random mutation).  
     - **Neutral:** Readings 1, 3, 4.  

  ---

  ### "Ideas are like viruses" vs. "Memes are like genes"
  - **Key Differences:**  
    - **Transmission:** Viruses emphasize *horizontal contagion* (peer-to-peer); genes emphasize *vertical inheritance* (parent-offspring).  
    - **Host Relationship:** Viruses imply *parasitism* (host harm = default); genes imply *shared fate* (mutualism/neutralism possible).  
    - **Fidelity:** Viruses tolerate high mutation/low fidelity; genes require fidelity for cumulative selection.  
  - **Rhetorical Shift:** Using "viruses" primes listeners to accept **host-exploitation** (selfishness) as inherent. It smuggles in stronger versions of Readings 5/7 while downplaying Readings 3/4 (cumulative design). Genuine divergence: viruses better explain fads/misinfo; genes better explain technology/tradition.  

  ---

  ### Dialectic Verdict: How the Analogy Functions
  - **Bait-and-Switch:** The senior researcher uses uncontested platitudes (Readings 1-2) to imply contested theses (Readings 5/7).  
  - **What Licenses Truth-Indifference?**  
    - **Weak Support:** Readings 2/5 show truth *can* lose to bias (e.g., prestige), but don't preclude truth *sometimes* winning.  
    - **Strong Support:** Only Reading 7 (selfish replicators) predicts truth-indifference as a *systemic feature*, but it's highly contested.  
  - **Analogy as Trojan Horse:** The slogan masks a leap from:  
    - *"Cultural change has Darwinian mechanisms"* (Readings 1-4, defensible) →  
    - *"Selection is inherently indifferent to truth/host welfare"* (Readings 5/7, contested).  
    Your island findings support the first leap but only *illustrate* (not prove) the second.  

  ---

  ### Conclusion: The Slogan's Quiet Work
  - **In Lineage Argument:** It imports population-thinking legitimacy (Readings 1-2) uncontroversially.  
  - **In Truth-Indifference Argument:** It conflates "selection *can* favor false memes" (Reading 2) with "selection *cares* only about copying" (Reading 7), leveraging the analogy's ambiguity.  
  - **Your Hypotheticals Clarify:**  
    - The canoe/ritual contrast shows functional vs. non-functional change are *both* possible under Darwinism (supports weak reading).  
    - The costly ritual spread *requires* a bias (prestige) overriding fitness to happen—but only the "selfish" thesis treats this as *expected*, not exceptional.  

  **Bottom Line:** The analogy is a framework, not an argument. It becomes substantive only when specifying *which* genetic properties memes share (e.g., lineage ≠ selfishness). Your senior colleague's rhetorical power comes from implying the strongest reading is self-evident.
