answer: |-
  Here's a spec for evaluating costly-signaling explanations of real-world traits. Non-negotiable requirements are essential for the explanation to hold water as a *costly signal*. Negotiable requirements strengthen the case but aren't fatal flaws if unmet. The synthetic handicap is addressed within the framework.

  **The Core Spec: Non-Negotiable Requirements**

  1.  **Functional Intent & Audience Response:** It must be established that the trait *functions* to influence the behavior of a specific, identifiable receiver(s) *because* of the information conveyed, *and* that the receiver's response provides a net benefit to the signaler.
      *   **Why Non-Negotiable:** Without this, it's just a costly trait, not a signal. The receiver must *act* on the signal in a way that benefits the signaler.
      *   **The Hard Case:** Proving "functional intent" vs. exploitation of a pre-existing cue. Example: Is a deep voice primarily a signal of testosterone/dominance (evolved for signaling), or do listeners just *use* it as a cue because it correlates with size/strength (evolved for respiration/other reasons)? Evidence needed: Receiver response is *specifically* tuned to the costly aspect (e.g., reacts more strongly to deeper voices *because* they are costly to produce/maintain) and benefits the signaler (e.g., gains deference/access). Mere correlation isn't enough.
      *   **Synthetic Handicap:** Must identify the audience (e.g., crypto network participants, online community, employer) and show how their response (e.g., accepting a transaction, granting status, hiring) specifically benefits the signaler *because* of the costly act (proof-of-work, long-form post, degree cost).

  2.  **The Honesty Condition (Differential Cost):** It must be established that the **marginal cost** (or burden) of producing/displaying the signal is lower for higher-quality (or higher-commitment/resource-holding) individuals *relative to lower-quality individuals*. "Quality" is defined by the benefit sought (e.g., fitness, resources, commitment, skill).
      *   **Why Non-Negotiable:** This is the core mechanism ensuring the signal is "honest". If a low-quality mimic can fake the signal at the same *relative* cost as a high-quality individual, the signal collapses. **Total cost alone is almost never sufficient.** High total cost can be borne by mimics if they gain enough, unless the *differential* cost deters them.
      *   **Why Marginal Cost?** It's about the *added burden*. A rich person and a poor person both pay $10,000, but the marginal cost (sacrifice of other opportunities/well-being) is vastly higher for the poor person. A strong person carrying a heavy load is less burdened (lower marginal cost) than a weak person.
      *   **Synthetic Handicap:** This is key. The cost (computational power for PoW, money for a fee, time/effort for long-form) must be **differentially burdensome**. PoW electricity costs are trivial for someone with vast resources but prohibitive for someone without. Writing a long, insightful post requires time/effort/skill *differentially* harder for someone lacking depth or commitment. The cost tracks *resources/stake/commitment*, not inherent genetic "quality", but the *differential burden* principle still holds.

  3.  **Receiver Payoff:** The receiver's response to the signal must provide a net benefit *to the receiver*, aligning with their interests. Responding to the signal must be adaptive or rational for them.
      *   **Why Non-Negotiable:** If responding doesn't benefit the receiver, selection (or rational choice) will eliminate the response, collapsing the signaling system. The receiver isn't altruistic.
      *   **Opposed Audiences:** If audiences have conflicting interests (e.g., mates vs. predators), the signaling explanation must demonstrate a *net benefit* to the signaler across *all* relevant audiences, or that the primary intended audience's response outweighs the costs imposed by others. Explaining why the signal persists despite costs from some receivers is crucial.

  **Negotiable Requirements (Strengthen the Case, But Not Fatal)**

  4.  **Waste / Net Cost:** Does the signal need to be *net* wasteful (Zahavi's strict handicap) or just *differentially* costly? **Negotiable (Differential Cost is Core).**
      *   *Argument for Differential:* Honesty requires differential cost, not necessarily net waste. The signal can also provide direct benefits (e.g., antlers used in combat, a degree providing skills, long-form writing clarifying thought). As long as the *differential* cost deters mimics, the signal can be honest. Many modern signaling models allow for net benefits.
      *   *Argument for Waste:* Pure waste guarantees the signal *cannot* be a direct benefit in disguise and strongly enforces honesty through differential cost. Explaining seemingly pure waste (peacock's tail) is a strength of strict handicap.
      *   **Synthetic Handicap:** Often involves net waste (burned electricity, pure initiation fees, time spent that could be used elsewhere). The differential burden provides honesty even if the act itself is wasteful. The direct benefit (e.g., transaction processing, community trust) usually comes from the *system*, not the signal act itself.

  5.  **Origin vs. Maintenance:** Must the explanation cover both how the trait *originated* and how it is *maintained*? **Negotiable.**
      *   *Argument for Covering Both:* A truly satisfying explanation addresses the trait's evolutionary or historical trajectory. A trait maintained by signaling might have originated for other reasons (e.g., pre-existing bias, direct benefit).
      *   *Argument for Maintenance Focus:* Demonstrating that costly signaling is the mechanism *maintaining* the trait's prevalence and form in the current environment is the core explanatory goal. Explaining origin is often harder and separate. Stability is key.
      *   **Synthetic Handicap:** Often explicitly designed systems (PoW, fees). Origin is clear (design). Maintenance relies on the continued differential burden ensuring honesty.

  **The Critical Filter: Differentiating from Alternatives (Non-Negotiable Application)**

  6.  **Exclusion of Major Alternatives:** The explanation must demonstrate why plausible alternative explanations for the trait are *less likely* or *inadequate* given the evidence. Crucially apply the Non-Negotiable requirements to rule them out:
      *   **Cue/Exploitation:** Does the trait lack functional intent & specific receiver response (Req 1)? (e.g., Height is just a cue, not a costly signal evolved for signaling).
      *   **Direct Benefit:** Does the trait provide significant direct benefits *independent* of influencing a receiver? Does it lack evidence of receiver response (Req 1)? (e.g., Antlers for combat vs. signaling).
      *   **Sensory Bias / Runaway:** Is the trait *cheap* to produce? Does it lack the differential cost mechanism (Req 2)? Is there evidence of an arbitrary preference unrelated to quality? (e.g., Some bird song ornaments might fit here if cost isn't differentially linked to quality).
      *   **Index/Mechanical Constraint:** Is the trait impossible to fake *without* cost being the primary enforcer? (e.g., Voice pitch is partly an index of larynx size/testosterone, though cost might play a *maintenance* role via Req 2). If the trait is directly, physically linked to the quality (you *can't* fake deep voice without the physiology), it's primarily an index, not a costly signal. Costly signals are *chosen* displays that *could* be faked *if not* for the differential cost barrier.
      *   **Byproduct/Constraint:** Is the trait simply a physical or developmental inevitability with no apparent signaling function or receiver response (Req 1)?
      *   **Synthetic Handicap vs. Alternatives:**
          *   Cue? No - Intent is clear (designed signal).
          *   Direct Benefit? Often minimal/none for the *costly act itself* (burning electricity). Benefit comes *via* receiver response.
          *   Sensory Bias/Runaway? Unlikely - Not about arbitrary beauty, about provable commitment/resource expenditure.
          *   Index? No - The costly act (solving hash, paying fee, writing) isn't physically impossible for mimics; it's just differentially burdensome.
          *   Byproduct? No - Clearly designed/intentional costly act.

  **Synthetic Handicap Resolution**

  *   It fits the core spec: Functional Intent/Audience Response (Req 1), Honesty via **Differential Cost/Burden** (Req 2 - burden tracks resources/stake, not intrinsic quality), Receiver Payoff (Req 3).
  *   It signals **commitment, stake, or resource holding**, not intrinsic biological "quality". This is a valid form of costly signaling.
  *   **Key Distinction:** It violates a *common assumption* (cost proportional to intrinsic genetic/biological quality) but *not* the core **Differential Cost Honesty Requirement (Req 2)**. The requirement is "differential cost relative to the *quality being advertised*". In synthetic handicaps, the "quality" is *commitment or resources*. The differential burden *does* track this. Req 2 stands; the *definition of "quality"* broadens.

  **Impossible Pair?**

  *   Your candidate (Honesty Condition vs. Existence Condition) is valid. Making the signal costly enough to deter mimics (Req 2) can make it too costly even for high-quality signalers to emit *unless the benefit is sufficiently large*. The signaling equilibrium requires a balance: Benefit > Cost for High-Quality, and Cost > Benefit for Low-Quality mimics. If the cost required for honesty is so high that Benefit < Cost even for High-Quality, the signal won't exist (or be emitted). **This isn't a flaw in the requirements; it's a constraint on when costly signaling is evolutionarily stable or rational.** A valid explanation must demonstrate that this balance exists (e.g., the benefit of attracting a mate outweighs the tail cost for healthy peacocks, but not for sick ones; the status from a PhD outweighs the cost/time for skilled/determined individuals, but not for unskilled/lazy ones; the value of a Bitcoin transaction outweighs the PoW cost for someone with sufficient resources/stake in the system).

  **Template Scoring (Against Non-Negotiable Reqs 1, 2, 3)**

  | Template          | Req 1 (Func Intent/Response) | Req 2 (Differential Cost Honesty) | Req 3 (Receiver Payoff) | Notes                                                                 |
  | :---------------- | :---------------------------: | :-------------------------------: | :---------------------: | :-------------------------------------------------------------------- |
  | **Handicap (Zahavi-style)** | ✔️                            | ✔️ (Emphasis)                     | ✔️                      | Classic. Focuses on net waste & differential cost.                    |
  | **Handicap (Modern/Grafen)** | ✔️                            | ✔️ (Core)                         | ✔️                      | Allows for net benefits, core is differential cost ensuring honesty. |
  | **Index**         | ❌ (Usually)                  | ❌                                | ❌ (N/A)                | Not a *costly signal*. Reliability comes from physical impossibility of faking, not cost. |
  | **Runaway (Fisherian)** | ✔️                            | ❌ (Often)                        | ✔️? (Arbitrary pref.)   | **Often fails Req 2.** Cost isn't necessarily differentially linked to quality, but to arbitrary preference. Honesty can break down. Can evolve *into* a costly signal if cost becomes linked to quality. |
  | **Sensory Exploitation** | ✔️? (Weak)                    | ❌                                | ✔️? (Arbitrary pref.)   | **Fails Req 2.** Leverages pre-existing bias; trait may be cheap. Not maintained by costly honesty. |

  **Deliverable: The Filter List**

  To believe a costly-signaling explanation for a real-world trait, the following **MUST** be established (Non-Negotiable):

  1.  **Receiver Action & Signal Benefit:** *Who* specifically receives the signal? How does receiving it *change their behavior* in a way that provides a **net benefit to the signaler**? (Proves functional intent over mere cue).
  2.  **Differential Cost Honesty:** Why is the signal *honest*? Specifically, why is the **marginal cost/burden** of producing/displaying the signal **significantly lower** for individuals with the *advertised quality* (fitness, resources, commitment, skill) compared to those without it? (Total cost alone isn't enough).
  3.  **Receiver Payoff:** Why does responding to the signal (as described in #1) provide a **net benefit to the receiver**? (Ensures the response persists).

  And the explanation **MUST** use these to **rule out** major alternatives by showing why they are inadequate, particularly focusing on whether the trait lacks functional receiver response (#1) or the honesty mechanism (#2).

  The following strengthen the case but are **Negotiable**:
  *   **Waste:** Is the signal *net* wasteful, or does it also provide direct benefits?
  *   **Origin Story:** Does the explanation cover how the trait originated, or just how it's currently maintained?

  **Synthetic handicaps** (PoW, fees, ordeals, long-form content) fit the core spec if they satisfy 1, 2, and 3. The "quality" signaled is commitment or resource holding, and the differential burden (cost relative to resources/stake) provides the honesty (Req 2). They fail the *assumption* of signaling intrinsic biological quality, but not the core requirements.
