  The honesty condition is crucial. The user questions if total cost alone suffices or if marginal cost differences are necessary. Cases like degrees where both high and low-ability individuals incur similar costs but different marginal efforts show why differential cost is non-negotiable. Synthetic handicaps, however, rely on absolute costs tied to resources, which might fit under a broader honesty criterion where the cost is prohibitive to those without the necessary stake.

  Audience identification is non-negotiable. Without specifying who the signal is for and how they respond, the explanation lacks mechanism. For example, in religious fasts, the community's reinforcement of status validates the signal. Opposing audiences complicate things but can be addressed by showing net benefit.

  Wastefulness is negotiable. While Zahavi emphasizes waste, differential cost is sufficient for honesty. Synthetic handicaps like proof-of-work are wasteful by design, but the key is the cost difference between signalers.

  Differentiating from alternative explanations is vital. The user wants to avoid everything being labeled as signaling. Each alternative (runaway, sensory bias, etc.) predicts different traits. For instance, sensory bias might produce cheap, attractive traits, while signaling requires cost. Proof-of-work lacks the aesthetic focus of sensory bias, helping distinguish it.

  Origin vs. maintenance can be covered by the same stability mechanism if the signaling system is maintained by current costs. However, explaining initial emergence might require additional factors, like pre-existing traits co-opted as signals.

  Synthetic handicaps present a challenge. They signal commitment or resources, not inherent quality. The honesty here comes from the cost being bearable only by those with sufficient resources. This fits under a broader "resource verification" requirement. Still, it must satisfy other criteria like audience response and differential cost (in terms of resources).

  Finally, scoring standard templates against the criteria shows that handicap models meet most if differential costs are confirmed. Indices are reliable but not costly signals. Runaway selection might not satisfy the honesty condition without cost, fitting sensory bias instead.

