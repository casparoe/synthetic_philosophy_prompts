  The user also brings up synthetic handicaps, like proof-of-work or initiation fees, where cost tracks resources rather than inherent quality. This challenges the traditional requirement that cost must correlate with quality. I need to consider if this requirement can be split into two parts: one for direct quality signals and another for commitment signals.

