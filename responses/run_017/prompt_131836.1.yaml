prompt: |-
  I'm in the last year of a PhD and next month I'm presenting a chapter to my department's work-in-progress seminar. It's the chapter where I try to say, as exactly as I can, what I am committing myself to by calling myself a particularist about reasons, and my supervisor's complaint about the last draft was that I had produced a list of things particularists tend to like rather than a position with a shape. Before I try to fix that I want an audit from someone who isn't invested. So here is everything I am inclined to assert in the chapter, written as flatly as I can, including one constraint I invented myself and one case I lean on hard:

  (a) Holism about reasons: whether a feature counts in favour of an action, and which way it points, depends on what else is true of the case; the same feature can be a reason in one case, no reason at all in a second, and a reason on the other side in a third, and there is no finite, general, informative specification of the conditions under which it does each. (b) Anti-principlism: the rationality of moral judgement does not depend on a supply of moral principles; the competent judge responds to the salience of the case rather than subsuming it, and principles are at best crutches that a good judge would outgrow. (c) Reasons are not the only reason-relevant features: some features enable, disable, intensify or attenuate without themselves counting in favour of or against anything, and this distinction is what stops (a) from collapsing into arbitrariness. (d) Anti-triviality: I want the dispute with the generalist to remain a genuine one, so I cannot win it with a manoeuvre that my opponent could use too — in particular, I cannot let any awkward feature be demoted to a mere enabling condition whenever a principle would otherwise break. This means I owe some non-ad-hoc account of what makes a feature an enabler rather than a reason. (e) The account I've proposed myself, call it Detachability: a genuine enabler or disabler must attach to a type of consideration in advance of the case, so that you can say which kind of reason it switches on or off without already knowing the verdict you want in the particular case; if the only thing you can say about a feature is that adding it here flips this verdict, it is a hedge and not an enabler. (f) I concede, against many of my allies, that for any body of particularist verdicts there is some hedged, disjunctive, thoroughly uninformative principle that matches all of them; I take the real disagreement to be about explanation, deliberation and what moral thought depends on, not about which verdicts are available. (g) I accept supervenience: no moral difference without a non-moral difference, necessarily and without exception. (h) I think moral deference is real and often the right response to disagreement: someone with better moral perception can tell you what you should do and you can thereby come to know it, not merely comply. (i) The case I rely on most. Devi and Tomas are colleagues with a standing arrangement to alternate the weekly departmental coffee duty; in week one Devi skips her turn unannounced, in week two Tomas does the same. I stipulate that everything that could matter is held fixed and equal across the two weeks: same arrangement, same twenty minutes of extra work for the other person, no further promise, no further need, no third party affected, and the same amount of inconvenience, the same being-let-down and the same annoyance. The only difference is that in Devi's week the two of them are in the middle of a low-grade feud in which each is quietly collecting grievances against the other, while in Tomas's week they are on cordial terms. My verdict is that what Tomas did is fine and what Devi did is not; and I want to insist that the feud is not itself a reason against anything, that it is not that the breach hurts more or that anyone is more upset, since I have stipulated all of that away — it simply switches on the small consideration already present, so that the twenty minutes counts in Devi's week and is silent in Tomas's. I also want to insist on something that makes this harder rather than easier: I cannot say in advance which kind of consideration the feud switches on, because in a case with a different trifle lying about it would switch on that one instead.

  What I want from you is an audit, not a survey. Tell me which of (a) through (i) are genuinely in tension with one another, and rank those tensions by severity rather than listing them as equally serious; for each real tension say what exactly would have to be revised, restricted or abandoned, and what that revision would cost me elsewhere in the set; and then tell me which single revision would clean up the most. Please also mark off the pairs that merely look like they conflict, and say briefly why they don't, since I would rather have a short list of real problems than a long list of things I already knew were uncomfortable. I don't know yet which of these I would be willing to give up, so don't assume an ordering of my attachments, and don't assume that the item I added myself is the weak one — or that it isn't.
reasoning: |-
  Okay, the user is in the final year of their PhD and preparing a chapter on moral particularism for a work-in-progress seminar. Their supervisor criticized an earlier draft as being a list of ideas rather than a coherent position. They've provided nine assertions (a-i) and want an audit of tensions between them. 

  First, I need to understand what's at stake. The user is clearly under pressure—this is a high-stakes presentation that could shape their dissertation defense. They're not just seeking technical feedback; they're looking for structural integrity in their argument. The phrase "audit, not a survey" suggests they want ruthless prioritization, not just a list of issues. 

  Looking at their assertions: 
  (a) Holism and (b) Anti-principlism are core particularist claims. 
  (c) introduces enablers/disablers to avoid arbitrariness, 
  (d) adds an anti-triviality constraint against gaming the system, 
  (e) proposes "Detachability" to operationalize (d). 
  (f) concedes uninformative principles exist but shifts focus to deliberation. 
  (g) accepts supervenience—important for philosophical credibility. 
  (h) defends moral deference—unusual for particularists who often emphasize first-person judgment. 
  (i) is their key case study about Devi/Tomas, meant to illustrate enablers in action.

  The big challenge is making all these cohere without collapsing into generalism or arbitrariness. I notice three red flags immediately: 
  First, (i) seems to violate (e)'s Detachability requirement since the feud "switches on" considerations without specifying which type. 
  Second, (h) on moral deference feels at odds with (b)'s emphasis on case-salience over subsumption. 
  Third, (e) might be too restrictive, risking inconsistency with (i).

  But I should test every pairing. Let me mentally map tensions: 
  - (a)+(b) are solid together (standard particularism). 
  - (c) supports (a) by preventing holism from becoming chaotic. 
  - (d) and (e) are mutually reinforcing safeguards. 
  - (f) wisely sidesteps a common generalist trap. 
  - (g) is non-negotiable and actually helps particularism by tethering it to non-moral facts.

  Now the problem clusters: 
  1. (e) vs. (i): Detachability demands pre-case specification of what a feature enables, but the Devi/Tomas case explicitly refuses this ("I cannot say in advance which kind..."). This is severe—it undermines their original constraint. 
  2. (h) vs. (b)/(a): Deference to others' perception conflicts with particularism's core commitment to direct engagement with particulars. Moderate severity since it's about epistemology, not metaphysics. 
  3. (d) vs. (i): Anti-triviality is threatened if enablers aren't distinguishable from ad hoc hedges—and (i) looks ad hoc without (e)'s structure. High severity.

  Lesser issues: 
  - (c) and (g) might seem to clash if enablers aren't "reason-relevant," but supervenience holds as long as they're non-moral features. 
  - (f) and (b) tension is superficial—uninformative principles don't help deliberation.

  The user's hidden need seems to be defending particularism without making it seem unprincipled or intuitionistic. They're especially invested in (i) as a concrete anchor, so any solution must preserve its force. 

  For the top fix: Revising (e) to allow case-specific enablers would resolve the (e)-(i) clash and partly address (d)-(i), but costs some anti-triviality power. Alternatively, reframing (h) as perceptual training rather than deference might reduce friction. But the former has broader impact across their framework.

  Notably, they're attached to (h) despite its rarity in particularist literature—that might be their unique contribution, so I shouldn't dismiss it lightly. The Devi/Tomas case is brilliantly ordinary; its persuasiveness shouldn't be sacrificed.

  Final thought: The deepest tension is between systematicity (d,e,g) and particularity (a,b,i). Their challenge is to show how enablers provide structure without becoming covert principles. If they can refine (e) to accommodate (i)'s "contextual activation" idea while keeping enablers non-arbitrary, that could be the goldilocks solution.
answer: |-
  Here's an audit of tensions within your framework, ranked by severity (high to moderate) with required revisions, costs, and notes on illusory conflicts. The analysis reveals one core tension that, if addressed, would resolve multiple issues.

  ### High-Severity Tensions (Threaten Coherence)
  1. **`(e) Detachability` vs. `(i) Devi/Tomas Case`**  
     - **Conflict:** (e) requires enablers to attach to a *type* of consideration "in advance of the case" (e.g., "feuds enable reasons against minor breaches of reciprocity"). But (i) explicitly rejects this: You state you *cannot* say which kind of reason the feud enables "in advance" because it depends on which "trifle" is present. This makes the feud's role case-specific and ad hoc under (e)'s definition.  
     - **Revision Required:** Abandon or radically restrict (e). Allow enablers to be *case-specific* (e.g., "in *this* context, the feud enables the 20-min inconvenience to count against Devi").  
     - **Cost:** Weakens (d) Anti-Triviality. Case-specific enablers risk arbitrariness and make it easier to "demote" awkward features to enablers post hoc. May also strain (c) by blurring the reason/enabler distinction.  
     - **Why Severe?** (i) is your central case, and (e) is your key constraint against trivializing holism. This is the axis your framework turns on.

  2. **`(h) Moral Deference` vs. `(b) Anti-Principlism`**  
     - **Conflict:** (b) claims competent judgment relies on *direct salience perception*, not principles or subsumption. (h) allows moral knowledge via deference to others' perception. But if judgment requires direct engagement with particulars (as (a)/(b) imply), deferring to another's perception is epistemically problematic: How can their verdict transfer without principles?  
     - **Revision Required:** Restrict (h) to *training* contexts (e.g., novices defer to experts to cultivate perception) or clarify that deference involves *trust in another's perceptual capacity*, not abstract principles.  
     - **Cost:** Limits the scope of (h). If deference is only for moral "education," it may not cover peer disagreements or urgent decisions.  
     - **Why Severe?** Undermines the epistemology of particularism. If judgment is irreducibly perceptual, deference seems either impossible or reliant on generalist scaffolding.

  ---

  ### Moderate-Severity Tensions (Require Clarification)
  3. **`(d) Anti-Triviality` vs. `(i) Devi/Tomas Case`**  
     - **Conflict:** (d) forbids ad hoc demotion of features to enablers to "save" verdicts. But in (i), the feud looks like an enabler *only because* it flips the verdict while you insist it's not a reason itself. Without (e)'s detachability, this risks appearing ad hoc.  
     - **Revision Required:** Strengthen the justification for why the feud *must* be an enabler (not a reason) in (i). Tie it to (c)'s metaphysics (e.g., "enablers lack *direct* evaluative valence").  
     - **Cost:** Demands deeper metaphysical work in (c). May require conceding that some features (like feuds) *can* be reasons in other contexts.  
     - **Why Moderate?** (i) can be salvaged with tighter integration to (c), but without (e), (d) is vulnerable.

  4. **`(b) Anti-Principlism` vs. `(f) Concession on Principles`**  
     - **Conflict:** (b) dismisses principles as "crutches," but (f) concedes uninformative principles *exist*. This raises the question: If principles are possible (even if useless), why can't they play *some* role in deliberation?  
     - **Revision Required:** Reframe (b) to target *informative* principles only. Emphasize that uninformative principles are irrelevant to deliberation.  
     - **Cost:** Weakens the rhetorical force of (b). Generalists may argue even "uninformative" principles have theoretical value.  
     - **Why Moderate?** This is more about emphasis than inconsistency. (f) already shifts the dispute to explanation/deliberation.

  ---

  ### Illusory Tensions (Apparent but Resolvable)
  - **`(c) Reason-Relevant Features` vs. `(g) Supervenience`**  
    *Why no conflict:* Supervenience requires a non-moral base for moral properties. Enablers (e.g., "feud exists") are non-moral features, so they satisfy supervenience. No revision needed.  
  - **`(a) Holism` vs. `(g) Supervenience`**  
    *Why no conflict:* Holism denies *specific types* of general patterns (e.g., "promise-keeping is always a reason"), not supervenience. Particularism can accept global supervenience.  
  - **`(f) Concession on Principles` vs. `(a) Holism`**  
    *Why no conflict:* (f) grants *logical* possibility of principles (via disjunctions), but (a) denies their *explanatory/informative* value. This is consistent.  

  ---

  ### The Highest-Impact Revision
  **Revise `(e) Detachability` → Allow case-specific enablers.**  
  - **Why:** Resolves the severe (e)-(i) conflict, preserves your key case, and is less damaging to (d) than abandoning anti-triviality entirely.  
  - **How:** Replace (e) with:  
    > "Enablers must be *non-arbitrary*: Their role must be explicable by appeal to broader normative structures (e.g., relationships, institutions) even if not attachable to reason-types *in advance*."  
  - **Costs:** 
    - Increases reliance on (c) to avoid arbitrariness. 
    - Weakens (d) slightly (generalists may still cry "ad hoc!").  
  - **Benefits:** 
    - Saves (i) and its intuitive force. 
    - Better aligns with (b)'s emphasis on particular salience.  
    - More honest about holism: Context can be *sui generis*.

  ### Summary of Recommendations
  | Tension                     | Severity | Revision Focus         | Outcome if Unaddressed                          |
  |----------------------------|----------|------------------------|-------------------------------------------------|
  | (e) vs. (i)                | High     | Abandon/rework (e)     | Core example contradicts core constraint        |
  | (h) vs. (b)                | High     | Restrict/reframe (h)   | Epistemic incoherence                           |
  | (d) vs. (i)                | Moderate | Bolster (c) for (i)    | Central case appears ad hoc                     |
  | (b) vs. (f)                | Moderate | Clarify scope of (b)   | Weakened critique of generalism                 |

  **Prioritize fixing (e)-(i).** This tension is the most urgent because it strikes at your original contribution (Detachability) and your flagship case. Revising (e) to accommodate contextual enablers would resolve this and partially alleviate (d)-(i), while aligning with particularism’s spirit. The result would be a more flexible—and defensible—account of enabling conditions.
