answer: |-
  **MEMORANDUM: ANALYSIS OF C/2026 UNDER EXISTING PRECEDENTS**

  **I. Reconstructed Decision Rules**
  1.  **Irreversibility Rule:** Refuse if the proposed action carries a credible threat of *irreversible* serious harm that cannot be excluded by available safeguards, regardless of potential benefits or inaction costs. *Strain on A/2014:* The harm from the existing surfactant was contested and plausibly reversible (cessation reduces exposure), yet phase-out was ordered; the rule must stretch to cover credible threats of serious harm even if potentially reversible.
  2.  **Harm-Burden Rule:** Refuse if the proponent fails to demonstrate that credible threats of serious harm are excluded (for new actions) or if the proponent of continuation fails to demonstrate safety (for existing actions), with irreversibility heightening the burden. *Strain on A/2017/A/2023:* Uncertain mortality was accepted with mitigation, implying the burden wasn't solely on the proponent to *exclude* harm initially, but to manage risk.
  3.  **Mitigability Rule:** Refuse if credible threats of serious harm exist and cannot be effectively *mitigated or reversed* within the operational timeframe using pre-agreed, reliable mechanisms, considering irreversibility as a key factor weighting against approval. *Strain on A/2016:* Mitigation/containment was arguably impossible, aligning with refusal; however, the ruling emphasized the lack of *necessity*, not just mitigability.

  **II. Application to C/2026**
  1.  **Irreversibility Rule:** **Refuse.** The concession of resting spores viable for decades and a termination circuit failure rate (however low) creates a credible threat of irreversible establishment and ecosystem alteration. The irreversible nature of the potential harm dominates, per A/2011 and A/2016.
  2.  **Harm-Burden Rule:** **Refuse.** The consortium concedes key uncertainties (spore persistence, termination failure, ecosystem impact unpredictability, exchange risk) demonstrating they cannot *exclude* credible threats of serious, potentially irreversible harm. The burden is not met (cf. A/2011, A/2016, A/2019).
  3.  **Mitigability Rule:** **Approve with Stronger Conditions.** The proposed monitoring, termination protocol (phage + nutrient cutoff), and stop rule offer mitigation pathways. However, conditions must be strengthened: significantly enhanced spore detection sensitivity in sediments/shelf, real-time independent verification of termination circuit functionality *in situ*, pre-agreed immediate full termination protocol upon *any* detection outside fjord or post-winter, and shortening the staging (e.g., single release with external review before next). The mitigability of escape risk (via termination) and detectability (via stop rule) distinguishes it from A/2016, aligning more with A/2017's managed risk approach.

  **III. Prediction: Authority's Likely Decision**
  The Authority will likely **Refuse** C/2026. The closest analog is **A/2016 (Gene-drive rats)**. Both involve:
  *   A novel, self-replicating biological intervention.
  *   A credible threat of irreversible ecological harm (transboundary spread/ecosystem shift).
  *   A stated conservation objective (protecting seabirds/mitigating climate effects).
  *   Conceded limitations of containment/termination mechanisms.
  A/2016 held the objective "did not require this method." Similarly, the Authority is likely to find that the urgent need to gather field data on climate interventions does not *require* accepting the specific, conceded irreversible risks posed by this engineered diatom in this location, especially given the termination circuit failure rate and spore persistence. However, it is not decisive because C/2026 offers more layered mitigation (nutrient dependence + phage + stop rule) than the gene-drive's inherent irreversibility, making the risk arguably more bounded and manageable (closer to A/2017).

  **IV. Recommendation & Coherence**
  The precedents **underdetermine** C/2026. A/2016 points to refusal; A/2017 points to conditional approval. A/2019 shows precaution overriding a growing cost of inaction (like climate impacts here), but refused due to irreversibility. **Refusal** best coheres with the Authority's consistent prioritization of avoiding *irreversible* harms when credible threats exist and containment isn't guaranteed (A/2011, A/2016, A/2019), even against significant costs of inaction. Approving C/2026 would commit the Authority to accepting *some* risk of irreversible ecological alteration from novel, self-replicating entities if layered (but imperfect) mitigation and a stop rule exist, enabling future similar geoengineering proposals. **Conditional Approval** would commit the Authority to a principle that credible threats of irreversible harm can be managed through staged, heavily monitored trials with robust stop rules, enabling future medium-risk field tests of essential climate interventions.

  **V. Discriminating Application**
  A proposal for a **reversible gene-drive construct with a high-fidelity termination trigger and proven containment within a fully isolated terrestrial ecosystem** (e.g., a sealed biosphere) to eradicate a disease vector. This would test if refusal in A/2016/C/2026 was driven primarily by irreversibility *potential* or by the *inability to guarantee containment/mitigation* in practice. Rules 1 & 2 might still refuse based on irreversibility *potential* if the trigger isn't 100% reliable. Rule 3 would likely approve if mitigation (termination + isolation) is demonstrably effective.

  **Answers to Specific Questions:**
  1.  **Precaution against Status Quo/Inaction:** Yes. A/2014 applied precaution against an *existing* activity (surfactant manufacture), shifting the burden to prove safety. A/2019 explicitly applied precaution despite the "serious and growing cost" of inaction (moth damage), refusing the intervention due to its irreversible risks. Precaution bites against harmful actions whether proposed or ongoing, and can require maintaining the status quo if intervention risks are unacceptable.
  2.  **Staged Approval: Decision or Postponement?** A/2023 shows staged approval (continuation with strengthened protocol) is a **way of deciding to allow continuation** despite data gaps, not merely postponing. The dissent highlights the failure to trigger the stop rule, implying the decision *was* made – to continue – based on available (operator) data and procedural fixes. It is a decision modality accepting managed uncertainty (cf. A/2017, A/2021).

