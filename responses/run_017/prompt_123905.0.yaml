prompt: |-
  Hey — I'm in a small group that's drafting a childcare and parental-leave chapter for a policy paper we're writing on weekends (long shot, nobody's paying us), and my gut is way more settled than my principles. So I want to do this backwards: here are my verdicts, you tell me what I actually think. We have to write the one paragraph of principles that goes at the top of the chapter and I've realised I can't.

  The set-up, because it's a bit unusual: instead of maternity leave and a childcare subsidy as two separate things, we're toying with one per-child care-time account. Every newborn is credited with, say, 3,000 hours of paid care time, roughly eighteen months full time. Any adult can draw on that particular child's account and be paid a care-wage for the hours they actually spend caring for that child — either parent, a grandparent, a friend, a registered childminder — or the hours can be spent as a voucher at a licensed nursery instead. Hours can't be moved from one child to another. Whatever is left when the child turns five converts into pension credits for the two registered parents. The care-wage is flat, same for everyone.

  My verdicts, case by case:

  1. Father takes six months full time: obviously fine. And I want the account to include use-it-or-lose-it months for the second parent, because I don't trust free choice here to amount to anything.
  2. So if both parents want to hand the entire account to the mother, that gets blocked. I'm fine overriding their stated preference and I'm not embarrassed about it.
  3. Grandmother draws the hours to look after her grandchild: fine. Genuinely, enthusiastically fine.
  4. A friend of the family, no relation, draws the hours: fine, but hesitantly.
  5. Parents use the hours to pay a nanny, cash in hand, unregistered, uninspected: not fine. Except I said the licensed-nursery voucher is fine, and when I try to say why the nanny isn't, I get three different answers — that it's about regulation, that it's about the state paying for care that happens inside someone's home, or that I just have a prejudice that real childcare happens in institutions. I can't tell which one is doing the work and it bugs me.
  6. A family that doesn't use all its hours sells the leftovers to another family: definitely not.
  7. A live-in migrant care worker with no work rights draws the hours: I want to say yes and no at once. No, because the state shouldn't be routing money into irregular arrangements. Yes, because that's where a huge amount of actual care happens and excluding it makes the whole scheme regressive in practice.
  8. Funding through a payroll levy on everyone, including people who will never have children: fine. I think of it like schools and I don't buy the why-should-I-pay-for-your-choice complaint.
  9. The state should pay the care-wage, but employers should be obliged to hold the job open for eighteen months, with no exemption for small firms. Also, a six-person startup shouldn't have to hold a job open for eighteen months. I know both can't be true and I don't know which to drop or what replaces it.
  10. Unused hours converting into pension credits: I like it, but I don't like that a parent who draws every single hour ends up with nothing at the end. They did more care. That seems backwards.
  11. The one I go back and forth on: flat care-wage or earnings-related? Flat feels right — the point is to pay for care, not to replace a salary, and flat means the nurse and the lawyer get the same for the same hours. But flat also means the nurse can't actually afford to take it, so in practice the care-time goes to the rich, which is the opposite of what I want.

  So: is there one principle, or at most two, that gets most of this? I keep reaching for several and they disagree with each other on 3, 5 and 7 specifically — something about care being a public good, or about the costs of care falling arbitrarily on one person's career, or about leave being for the child rather than for the parent, or about the state's job being to turn care into work instead of into a sacrifice. Give me the one or two you'd actually defend, stated precisely enought that I can test it, and say which clause is doing the work in which case. Then be straight about which of my verdicts it can't accommodate — I expect to lose 5 and 9 — and run it on three cases where I haven't told you my answer: a parent who wants to draw hours to look after a seven-year-old over the summer; someone who wants to draw hours to care for their own elderly mother; and a couple who split the account fifty-fifty but both keep working three days a week, drawing hours on the other two.

  Please don't just survey the positions people have taken or name-drop theories at me, and no citations — I want the argument, and I want it in the form of something I could defend in a paragraph.
reasoning: |-
  Okay, let me tackle this user's problem. They're drafting a childcare policy chapter and need unifying principles for their care-time account system. Their detailed case verdicts show strong intuitions but internal conflicts, especially around informal care (cases 5,7), employer obligations (9), and flat vs. earnings-related wages (11). 

  First, I notice their core tension: wanting flexibility in who provides care (grandparents! friends!) while demanding oversight (no cash-in-hand nannies). That's not just practical - it's philosophical. Their hesitation about unregistered friends (case 4) versus enthusiasm for grandmothers (case 3) suggests they value relationship bonds but fear exploitation. 

  The pension conversion dilemma (case 10) is revealing too. They instinctively recognize care labor as real work that deserves compensation beyond the immediate wage. That's huge - it implies a principle that care creates societal value regardless of who performs it.

  For employer obligations (case 9), their contradiction exposes a deeper truth: job protection can't scale linearly. Maybe small businesses need different solutions - like portable job guarantees or sector-wide pools. I should acknowledge both concerns are valid while admitting the policy can't satisfy both simultaneously.

  The flat wage conflict (case 11) is thorniest. Their nurse-vs-lawyer example perfectly captures the equity dilemma. Progressive reimbursement would undermine their "care is work" principle by tying compensation to prior earnings rather than current labor. But without it, low-income parents get priced out. Perhaps supplemental need-based stipends could resolve this without corrupting the core mechanism.

  On unused hours (case 10), they're right that full-time caregivers lose pension benefits. That's perverse. Maybe prorated pension accrual during drawn hours would help - treating active care as simultaneous employment.

  For their untested cases: 
  - Seven-year-old summer care? Consistency says no - the account's for under-fives. But maybe flexibility for special needs?
  - Elderly mother care? Clearly outside scope - different life phase.
  - Part-time sharing? Perfectly aligned with their vision.

  The unifying principle must balance three things: valuing care work, ensuring child welfare, and maintaining system integrity. "Care is labor" covers payments to grandparents/friends, while "child wellbeing requires oversight" explains banning unregulated care. "System sustainability" blocks hour-selling. 

  I'll propose two complementary principles: one establishing care as valuable labor, the other framing child development as a collective responsibility requiring safeguards. This covers most cases except employer obligations - that requires separate compromise language.
answer: |-
  Here’s the core principle I’d defend, distilled from your verdicts and designed to resolve your conflicts:  

  ### Principle 1: **Caregiving is socially valuable labor.**  
  ### Principle 2: **The state’s role is to recognize and support this labor while ensuring child wellbeing.**  

  ---

  ### How it works in your cases:  
  - **Cases 1–4 (father, grandmother, friend):**  
    *Principle 1 applies.* Care is labor; payment validates it. Who performs it (parent, relative, friend) is irrelevant if the labor occurs. Your hesitation on friends (Case 4) fades because labor-value trumps relationship.  
  - **Case 5 (unregistered nanny):**  
    *Principle 2 applies.* Child wellbeing requires oversight. Unregulated care risks harm → state cannot subsidize it. Nursery vouchers are fine because licensing ensures standards.  
  - **Case 6 (selling hours):**  
    *Principle 1 + 2.* Hours represent labor for *this child*; converting them to cash commodifies care and detaches it from the child’s needs. Blocked.  
  - **Case 7 (migrant worker):**  
    *Principle 2.* State cannot fund irregular arrangements (exploitative, unregulated). Compromise: allow only *registered* caregivers, ensuring labor rights and child safety. Addresses regressivity by expanding access to formal care.  
  - **Case 8 (funding):**  
    *Principle 1.* Care labor benefits society (future workers, social stability) → collective funding is justified, like education.  
  - **Case 9 (job protection):**  
    *Conflict unresolved.* Principle 1 implies job security for caregivers, but small firms can’t absorb this. **Solution:** State-funded wage replacement *plus* a portable job guarantee (e.g., sectoral reemployment pools). Drop "no exemptions"; tie obligation to firm size/resources.  
  - **Case 10 (pension credits):**  
    *Adjust to fit Principle 1.* Pension credits should accrue *during* hours drawn (care is labor → earns retirement security). Unused hours are a bonus, not a penalty for full-time caregivers.  
  - **Case 11 (flat wage):**  
    *Principle 1.* Flat wage affirms care’s inherent value ≠ market value. To avoid regressivity: add a *supplemental needs-based stipend* (e.g., low-income caregivers get top-ups).  

  ---

  ### Where it diverges from your instincts:  
  - **Case 5:** You felt institutional bias; this principle rejects *unregulated* care, not home-based care. Grandparents/friends are fine if registered (minimal oversight for safety).  
  - **Case 9:** You must choose. Principle 1 demands job protection, but pragmatism requires scaling (e.g., 6-month guarantee for firms <10 employees, full 18 months for larger ones).  

  ---

  ### Test on your new cases:  
  1. **Parent cares for 7-year-old over summer:**  
     → *Not covered.* Principle 2: Hours are for early childhood (0–5), when developmental needs are highest.  
  2. **Caring for elderly mother:**  
     → *Not covered.* Principle 1: The account recognizes labor for *new children*, a distinct societal investment.  
  3. **Parents split 50/50, work part-time:**  
     → *Allowed.* Principle 1: Care labor is being performed → wages earned. Aligns with your support for flexibility.  

  ---

  ### The paragraph for your policy paper:  
  > *"Childcare is not a private burden but essential labor that sustains society. Our policy recognizes this by funding care itself—whoever provides it—while ensuring every child’s wellbeing. Each child receives a care-time account: hours paid at a flat wage to any registered caregiver (parent, grandparent, or licensed provider), converting unused hours into pension credits for parents. This affirms caregiving’s value, prioritizes child safety through oversight, and shares responsibility collectively. Job protection scales with employer capacity, and low-income caregivers receive supplemental support to ensure equity."*  

  This grounds your verdicts in solidarity (we fund care), dignity (labor deserves pay), and pragmatism (oversight where risk exists). It loses only your absolutism on job protection (Case 9), replacing it with tiered obligations.
