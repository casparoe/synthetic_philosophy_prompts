prompt: |-
  Putting together the reading list for my grad seminar on comparative development — the why-are-some-countries-rich one, you know the genre — and before I assign another three hundred pages of it I want the spec rather than the theories. What would an explanation of cross-national income differences actually have to get right to be worth anything? Write me the desiderata list.

  Purpose, so you can argue about which demands are real: I want a theory good enough that (a) I'd let a student spend five years testing it and (b) I'd be willing to tell someone allocating aid money 'this is our best guess, and here's how much to trust it.' If some requirement comes out of one of those purposes and not the other, say so.

  Cases I want attached to each requirement, and I'd rather have argument than inventory:

  - The separation cases. Most of what we correlate with prosperity travels in a bundle, so I want a requirement that a theory say what it predicts where the bundle comes apart: a place with extractive-looking politics and a resource windfall, a place with decent formal institutions and terrible geography, a place that got rich fast while keeping institutions the institutions-camp would call bad. Give the case behind the requirement, not a list of countries.
  - Onset, persistence, and catch-up. Sustained growth starting somewhere, gaps that just sit there for a century, and then episodes of rapid convergence and of growth that collapses. I think these are three different explananda and that a lot of the literature quietly swaps between them; write that in as a requirement to declare which one is being explained, and tell me if you think it's a fake distinction.
  - Level versus growth rate. Something can explain why a place is rich without explaining why it keeps getting richer. Is respecting that a genuine desideratum or pedantry?
  - Within-border variation. Same formal institutions, same national culture, big and stable income gaps between regions. Whatever the theory is, does it have the resources to handle that, or does it just get to change the unit of analysis? I want your view on whether this is a requirement or a cheap shot.
  - Exogeneity. The cause can't just be income wearing a hat. But I suspect the truly exogenous candidates are the ones that can't explain much, and the ones that explain a lot are partly effects. If that's a real trade-off, make it explicit as a pair of desiderata that pull against each other and say which one you'd drop.
  - The 'five-year minister' test: its favoured causes mostly move over generations, while the people who'd act on it have an electoral term. Is being usable at the timescale policy actually runs on a requirement, or a category error imported from the policy world? This is the one I'm least sure about.
  - Risky prediction. It should be able to state something it would get wrong. Half the literature explains every outcome after the fact; say how you'd write that into the spec without it becoming a demand for a randomised experiment.

  Then flag any pair you think can't be jointly satisfied — that part is the real result, not the checklist. No citations and no reading list, I know the literature; I want the criteria and the reasoning behind them. Finish in three or four lines on which single requirement does the most damage to the institutions / geography / culture families respectively. Don't be polite about it.
reasoning: |-
  Hmm, the user is putting together a reading list for a grad seminar on comparative development and wants criteria for evaluating theories of why some countries are rich. They're clearly frustrated with existing theories and want something rigorous enough for both academic research (5-year PhD testing) and policy application (aid allocation). 

  The user has laid out seven specific requirements with cases attached, each probing different weaknesses in development theories. They're particularly interested in where theories fail when the usual correlates of prosperity "unbundle" - like when extractive institutions coexist with resource wealth, or when formal institutions look good but geography is terrible. 

  For the "separation cases" requirement, I'm thinking about how most theories crumble when their pet variable (institutions, geography, culture) gets decoupled from outcomes. Like how institutionalists struggle to explain China's growth with "bad" institutions, or how geographic determinists can't handle Switzerland's success despite poor natural endowments. 

  On the "onset vs persistence vs catch-up" point - absolutely agree these are distinct phenomena. The Industrial Revolution's takeoff needs different explanation than why the Great Divergence persisted for 200 years, or why Botswana converged while Zimbabwe collapsed. Most theories quietly conflate these. 

  The level vs growth rate distinction feels substantive, not pedantic. Explaining Norway's oil wealth is different from explaining why their growth didn't collapse when oil prices did. Theories should specify which they're addressing. 

  Within-border variation is a killer test - if your theory can't explain why northern Italy is rich while southern Italy is poor (same institutions, same culture), it's probably missing something fundamental. Not a cheap shot at all. 

  The exogeneity trade-off is brutal. Deep causes like geography are exogenous but explain little alone, while powerful explanations like institutions clearly respond to income. Might need to sacrifice pure exogeneity for explanatory power. 

  The "five-year minister" dilemma is existential - if your theory only works on century-long scales, it's useless for democratic policymaking. But forcing theories to operate on electoral timescales might be category error. 

  For risky predictions, we need theories that can be falsified by future events or edge cases, like predicting which resource-rich democracies will avoid the curse before it happens. 

  The real pain points: Separation cases murder institutional theories (can't explain China), persistence puzzles gut geography theories (why no tropical Singapores earlier?), and within-variation suffocates cultural theories (same culture, different outcomes across regions). 

  User clearly knows the literature cold - this is a demand for intellectual honesty, not reading suggestions. They want the field's dirty laundry aired. Time to deliver.
answer: |-
  Here's your desiderata list for a theory of cross-national income differences, built for academic robustness and policy relevance, with cases attached and trade-offs flagged:

  ### Core Desiderata
  1.  **Separation Cases Requirement:** *Must predict outcomes when core development correlates (institutions, geography, culture) decouple.*
      *   **Case:** Predict outcomes for: a) a state with extractive elites suddenly gifted massive, easily taxable resources (e.g., Angola post-oil discovery vs. institutional potential); b) a state with strong formal property rights and rule of law embedded in a geographically hostile, disease-prone, landlocked environment (e.g., hypothetical "Switzerland in the Congo Basin"); c) a state achieving sustained high growth under political institutions widely deemed extractive or illiberal (e.g., China 1980-2010 or Singapore). If your theory *only* works when all "good" factors align, it fails.

  2.  **Temporality Requirement:** *Must explicitly distinguish and account for:*
      *   **Onset:** Why sustained growth ignites *here* and not *there* at a specific historical juncture (e.g., UK 1750-1850 vs. contemporaneous India).
      *   **Persistence:** Why initial gaps widen or remain stable over very long periods (e.g., Latin America vs. North America divergence post-1820, enduring despite similar independence eras).
      *   **Catch-Up/Collapse:** Why rapid convergence *sometimes* happens (e.g., S. Korea 1960-1990, Botswana post-1966) and why growth *sometimes* implodes (e.g., Argentina early 20th C., Venezuela post-1970s). *This is not a fake distinction; conflating them obscures distinct causal mechanisms.*

  3.  **Level vs. Growth Rate Requirement:** *Must specify whether it primarily explains current income levels or ongoing growth rates, and acknowledge the limitations.*
      *   **Case:** Explaining Norway's high income (oil wealth endowments) is distinct from explaining why its growth didn't collapse when oil prices plunged (institutions, diversification). A theory good at level might be poor at growth dynamics, and vice versa. *Genuine requirement – pedantry only if hidden.*

  4.  **Within-Border Variation Requirement:** *Must possess analytical tools to explain significant, persistent subnational income disparities under shared national institutions and broad culture.*
      *   **Case:** Northern vs. Southern Italy; Coastal vs. Inland China; Sao Paulo vs. Northeast Brazil. *Requirement, not a cheap shot.* If the theory only works at the national level, it likely misses crucial meso-level factors (local elites, historical path dependence, micro-geography, local institutional quality) or misattributes causality.

  5.  **Exogeneity & Explanatory Power Trade-off:** *Must maximize causal leverage while minimizing endogeneity.* Recognize this as a fundamental tension.
      *   *Desideratum A (Exogeneity):* Favored causes should demonstrably precede major income changes and be plausibly exogenous (e.g., disease environment, colonial settler mortality *as instrument*, deep cultural traits). *Risk: Explains little variance alone.*
      *   *Desideratum B (Explanatory Power):* Favored causes should explain substantial variance in outcomes. *Risk: Often involves factors shaped by income itself (e.g., "quality institutions" requiring wealth to build/maintain, "good culture" potentially endogenous to economic success).*
      *   **Trade-off:** Sacrificing some exogeneity for explanatory power is often necessary for a *useful* theory. Pure exogeneity often yields weak theories. Prioritize explanatory power *while rigorously testing for endogeneity*.

  6.  **'Five-Year Minister' Scalability Requirement:** *Must articulate how its core mechanisms operate at policy-relevant timescales (5-20 years), even if full effects manifest over generations.*
      *   **Case:** Policy needs levers. If your theory says "change deeply embedded cultural norms" or "wait 200 years for institutional maturation," it's useless for aid allocation today. *Requirement derived solely from policy use (b).* Good theories identify *malleable factors within generational processes* (e.g., specific institutional reforms, targeted human capital investment, infrastructure projects) that can shift trajectories within decades, even if peak effects take longer. *Not a category error; it's demanding actionable insights.*

  7.  **Risky Prediction Requirement:** *Must generate non-obvious, falsifiable predictions about future trajectories or under-studied cases.*
      *   **How to write it in:** Demand the theory specifies:
          *   Which current middle-income country *should* converge fastest/slowest based on its causal logic (and why it might fail).
          *   What specific change in a low-income country (beyond just "get richer") would signal imminent takeoff *according to this theory alone*.
          *   An observable implication that, if found empirically *false*, would seriously undermine the core thesis (e.g., "No country with X characteristic ever achieves sustained growth" – falsified by counterexample).

  ### Impossible Pairs & Key Trade-offs
  *   **Exogeneity (A) & Explanatory Power (B) are inherently in tension.** Maximizing one usually sacrifices the other. Prioritize (B) for a useful theory, demanding rigorous methods (IV, RD, deep historical analysis) to mitigate endogeneity concerns.
  *   **Full 'Five-Year Minister' Scalability & Deep Historical Onset/Persistence** are hard to reconcile within *one* model. Scalability requires identifying faster-moving causal chains within the slower historical processes.

  ### Which Requirement Wrecks Which "Family"?
  *   **Institutions Camp:** **Separation Cases.** Explaining China (growth under "bad" institutions) and Angola/DRC (resource curse despite *some* institutional reform attempts) is their Achilles' heel. "Good institutions" often look like a *consequence* or *concomitant* of growth, not a purely exogenous cause.
  *   **Geography Camp:** **Persistence.** Why wasn't there a tropical Singapore in 1800? Why did temperate-zone Argentina stall? Pure geography struggles to explain the *timing* of onset/catch-up and the persistence of disadvantage/advantage despite technological changes mitigating some geographic constraints.
  *   **Culture Camp:** **Within-Border Variation.** Why do Calabria and Lombardy share Italian culture but not prosperity? Why Guangdong vs. Gansu? Attributing national outcomes to monolithic "culture" crumbles against persistent subnational divergence under shared broad cultural frameworks. Culture is often heterogeneous and its economic impact mediated by local institutions/history.
