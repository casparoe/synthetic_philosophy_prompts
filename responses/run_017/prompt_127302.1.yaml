answer: |-
  ### Joint Statement on Decision Theory in Symmetric and Near-Symmetric Interactions

  #### 1. Agreed Claims
  We, the undersigned, agree on the following non-filler propositions:

  1. **Prisoner's Dilemma Payoff Structure**: In the one-shot Prisoner's Dilemma (PD), mutual cooperation yields a higher payoff for both players than mutual defection, but defection is the strictly dominant strategy when considered causally (i.e., it yields a higher individual payoff regardless of the other's choice). Payoffs are symmetric: (C,C) → (3,3), (C,D) → (0,5), (D,C) → (5,0), (D,D) → (1,1).

  2. **Non-Altruistic Basis for Cooperation**: The argument for cooperating with a near-copy in PD is not an appeal to altruism (valuing the other's welfare). It is purely about logical correlation in decision-making. Partial altruism must be screened off; we assume agents care only about their own payoffs.

  3. **Structural Relation to Newcomb's Problem**: The superrationalist argument for cooperation in PD and the argument for one-boxing in Newcomb's problem share a core structure (both exploit logical correlations between agents/predictors), but they can diverge in principle—e.g., if the predictor in Newcomb is fallible or the agents are dissimilar.

  4. **Functional Decision Theory (FDT) as Repackaging**: Both camps agree FDT restates the superrationalist conclusion (cooperate with copies, one-box in Newcomb) using new vocabulary (e.g., "output of a fixed decision function"). This does not resolve the normative dispute over whether agents *should* reason this way.

  5. **Irrelevance of Timing**: For near-identical agents, the recommended action does not depend on whether decisions are simultaneous, separated by an hour, or whether one agent learns the other's choice later. The causal independence and logical correlation are unchanged by timing alone.

  #### 2. Disagreements Table
  Each row states the disagreement in terms acceptable to the respective camp.

  | Issue | Dave's View (Superrationalist) | Priya's View (Causal Decision Theorist) |
  |-------|--------------------------------|-----------------------------------------|
  | **Basis for Action in PD with Copies** | I should cooperate because identical reasoning implies we will reach the same decision. Thus, I am effectively choosing between (C,C) and (D,D), and I prefer (C,C). | I should defect because my action cannot causally influence the other agent. Correlation does not imply my choice controls theirs; given dominance, defection maximizes my payoff regardless of theirs. |
  | **Role of Correlation** | The correlation is a logical constraint that must be factored into the decision. Failing to do so ignores that my choice is evidence for the other's choice. | The correlation is a statistical fact, not a causal lever. It should not override dominance reasoning, as evidence is not influence. |
  | **Normative Primacy** | Rationality requires selecting the outcome we would jointly endorse if we reasoned identically ("joint optimum"). | Rationality requires maximizing individual expected utility under causal independence, regardless of shared reasoning. |

  #### 3. Cruxes
  For each, we specify a case/argument both accept as relevant, then state Dave's and Priya's predictions. Settling any crux would move at least one side.

  **Crux 1: The Smudged Mirror**  
  - **Case**: One-shot PD against an agent with 97% of your decision-relevant bits (e.g., code, memories), with 3% flipped randomly. You know the error rate and that the copy is derived from you.
  - **Question**: Does superrationality prescribe cooperation, defection, or a mixed strategy? If mixed, can they coordinate using a shared public random bit?
  - **Argument**: Tests whether similarity degrades cooperation and if randomization breaks symmetry. Both agree the public bit enables synchronized mixed strategies.
  - **Dave's Prediction**: Cooperation degrades smoothly. With 97% similarity, both agents should adopt a mixed strategy (cooperate with probability *p*) to maximize expected utility. They can share a public random bit to ensure identical randomization, yielding (*p*, *p*) and avoiding exploitation. *p* is chosen to balance the risk of defection (e.g., *p* ≈ 0.8–0.9 for 3% error).
  - **Priya's Prediction**: Defection is strictly dominant. The 3% error breaks logical identity, making the other's action unpredictable. Even with a public bit, defection still dominates unconditionally.

  **Crux 2: The Weighted Twins**  
  - **Case**: One-shot PD with near-identical agents, but Twin A’s payoffs are scaled by 20 (e.g., A gets 60 for (C,C), 0 for (C,D), 100 for (D,C), 20 for (D,D)). Both know who they are and that they share reasoning.
  - **Question**: Does superrationality prescribe cooperation, defection, or nothing? If asymmetric actions are possible, does it fracture?
  - **Argument**: Tests symmetry-breaking in reasoning. Both agree payoff asymmetry breaks outcome symmetry, but not necessarily reasoning identity.
  - **Dave's Prediction (Intra-Camp Fracture)**: Superrationality fractures here.  
    - **Sub-view 1 (Symmetric Action)**: Both cooperate. Reason: Identical reasoning forces symmetric actions, and (C,C) > (D,D) for both (A: 60 > 20; B: 3 > 1).  
    - **Sub-view 2 (Joint Optimum Focus)**: Both defect. Reason: Twin A sees defection as dominant (100 > 60 if B cooperates; 20 = 20 if B defects), forcing mutual defection as the only equilibrium.  
    *Dave personally endorses Sub-view 1*.  
  - **Priya's Prediction**: Both defect. Dominance holds: Twin A defects (100 > 60 or 20 = 20); Twin B defects (5 > 3 or 1 = 1). Payoff scaling doesn’t change causal independence.

  **Crux 3: The Doorway**  
  - **Case**: Two agents face two doors. Payoffs: One enters/one waits → both get 10; both enter → both get -10; both wait → both get 0. No symmetric optimal outcome; asymmetric coordination is required.
  - **Question**: Can superrationality use an irrelevant label (e.g., "Agent 1/2") or shared coin to select asymmetric actions? Or does "do what you want all to do" mandate both waiting?
  - **Argument**: Tests if superrationality extends to asymmetric coordination. Both agree a shared coin allows conditioning.
  - **Dave's Prediction**: Superrationality prescribes using a shared coin: e.g., "if heads, I enter; if tails, I wait." This achieves (10,10) in expectation. Without the coin, both wait (0,0) is the only symmetric choice, but this is suboptimal and avoidable. The rule "do what you want all to do" endorses pre-committing to the coin protocol.
  - **Priya's Prediction**: Without a causal coordination mechanism, both waiting (0,0) is the safest equilibrium. With a shared coin, causal decision theory can condition on it (e.g., "if heads, enter; else wait") to achieve coordination. The coin provides a causal signal.

  #### Summary of Merely Verbal Disagreements
  - "**Rational**" conflates two concepts:  
    - *Dave*: Rationality as selecting the universally endorsable outcome (joint rationality).  
    - *Priya*: Rationality as individual utility maximization under causal constraints (causal rationality).  
    Disentangled, the core dispute is normative: whether logical correlation should override causal dominance.  
  - "**Choosing for both**" is metaphorical for Dave (a logical necessity) but causally incoherent for Priya.

  ---  
  This document is not rigged; it addresses the cases neutrally. We commit to these predictions.  
  Signed,  
  Dave (Superrationalist)  
  Priya (Causal Decision Theorist)  

  [Word count: 1180]
