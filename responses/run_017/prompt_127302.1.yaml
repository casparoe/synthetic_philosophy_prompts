prompt: |-
  Me and two friends have been going around in circles in a group chat for about two years on one-shot prisoner's dilemmas between agents who are near-copies of each other, and I want to force the issue. Dave is a diehard superrationalist in the old Hofstadter sense: if two reasoners are relevantly alike they will land on the same conclusion for the same reasons, so you are in effect picking for both of you and you should pick the joint outcome you would want everyone to pick, which in the plain PD means cooperate. Priya is a hardline causal decision theorist who two-boxes against a near-perfect predictor, thinks the correlation between copies is just correlation and not anything your decision can ride on, and thinks the 'choosing for both' move is a metaphor that smuggles in a causal arrow that isn't there. They have both, in a moment of weakness, agreed to sign a joint statement if I can produce one neither thinks is rigged, so please draft that document. Concretely: (1) a numbered agreed-claims section that isn't filler — the payoff structure of the case; that the argument for cooperating with a copy is not an altruism argument and that partial altruism is a confound to screen off rather than a crux; that this argument and the argument for one-boxing in Newcomb's problem are structurally related but can in principle come apart; that both camps think the functional-decision-theory framing restates the superrationalist conclusion in new vocabulary without settling the normative question; that it makes no difference to either view whether the two agents deliberate simultaneously or an hour apart, or whether one has already answered and you will learn the answer later. Also say plainly which parts of the fight are merely verbal — if you think 'rational' is doing two different jobs in the two camps, say which claims survive once that is disentangled. (2) A disagreements table where each row is phrased in the words that side would accept for itself, not a straw version. (3) The cruxes — sub-questions such that settling one would move at least one of them — and for each a case or argument both would accept as bearing on it, with Dave's prediction and Priya's prediction written down side by side in advance.

  Here are the three cases I want doing the real work, because I don't think any of them is settled by the standard setups: (a) the Smudged Mirror — you play a one-shot PD against an agent built from a lossy copy of you with roughly 3% of the decision-relevant bits flipped, and you know this. Does superrationality require exact isomorphism, or does the case for cooperating degrade smoothly with similarity, and if it degrades, does the right response become a mixed strategy — given that randomizing is precisely what makes two copies come apart, and that they could in principle share one public random bit and thereby stay in sync while mixing? (b) the Weighted Twins — same game, except one twin's payoffs are all multiplied by twenty and everyone knows which one they are. Now the situation isn't symmetric even though the reasoning procedure still is, and I genuinely can't tell what Dave's own view delivers here: cooperate, defect, or nothing determinate. If this case splits his camp rather than his camp against Priya's, say so and put the intra-camp fracture in the document. (c) the Doorway — a two-person game with no symmetric joint optimum worth having: the best joint outcomes are the two asymmetric ones (one goes through, one waits), both rushing is a disaster, and both waiting is merely bad. Does superrationality have anything to say, can it use an irrelevant label on the players or a shared coin to select between the two good profiles, or does the 'do what you would want all to do' rule just deliver both-wait and reveal that the rule was only ever built for symmetric games?

  A couple of housekeeping things: keep it under about 1200 words, don't give me any citations or reading suggestions (I have the background, I just want the argument), and where a crux turns out to be empirical rather than conceptual, say what the experiment or observation would be and what result each of them is on the hook for. I got into this through the old Scientific American column and then the usual blog posts, so feel free to assume I know the twenty-people-one-winner setup and the many-person button game and don't need them re-explained.
reasoning: |-
  We are drafting a joint statement that Dave (superrationalist) and Priya (causal decision theorist) can both sign. The goal is to clarify agreements, disagreements, and cruxes, especially for three novel cases: Smudged Mirror, Weighted Twins, and Doorway.

  The document should have:
  1. An agreed-claims section (numbered) that covers:
     - The payoff structure of the Prisoner's Dilemma (PD).
     - The argument for cooperating with a copy is not based on altruism; partial altruism is a confound to be screened off.
     - The structural relation (and potential divergence) between the superrationalist argument for cooperation in PD and the one-boxing argument in Newcomb's problem.
     - Both camps view Functional Decision Theory (FDT) as restating the superrationalist conclusion without settling the normative question.
     - The timing of decisions (simultaneous, an hour apart, or with one already decided) makes no difference to either view.

  2. A disagreements table, with each row phrased in the way each side would accept for themselves.

  3. Cruxes: sub-questions that, if settled, would move at least one of them. For each crux, provide a case or argument both accept as bearing on it, and write down Dave's and Priya's predictions side by side.

  We also have three cases to analyze: (a) Smudged Mirror, (b) Weighted Twins, (c) Doorway.

  We must keep under 1200 words, no citations, and assume familiarity with standard setups.

  Let's structure the document:

  **Title: Joint Statement on Decision Theory in Symmetric and Near-Symmetric Games**

  **1. Agreed Claims**

  We, the undersigned, agree on the following:

  1. **Payoff Structure of the Prisoner's Dilemma (PD)**: In the one-shot PD, the payoffs for each player are such that, regardless of the other's choice, defection yields a higher individual payoff than cooperation. However, mutual cooperation yields a higher payoff for both than mutual defection. The canonical payoff matrix (for each player) is: Cooperate/Cooperate: (3,3), Cooperate/Defect: (0,5), Defect/Cooperate: (5,0), Defect/Defect: (1,1).

  2. **Non-Altruistic Basis for Cooperation with Copies**: The argument for cooperating with a near-copy in a one-shot PD is not founded on altruism (i.e., valuing the other's payoff). Instead, it is based on the reasoning that if the two agents are sufficiently similar, they will reach the same decision. Therefore, each is effectively choosing the outcome for both. Thus, the choice is between mutual cooperation and mutual defection, and mutual cooperation is preferred. We agree that partial altruism is a confound and must be screened off to isolate the decision-theoretic issue.

  3. **Relation to Newcomb's Problem**: The argument for cooperating in the PD with a near-copy is structurally related to the argument for one-boxing in Newcomb's problem. In both cases, the agent's decision is correlated with the state of the world (the other agent's decision in PD, the predictor's prediction in Newcomb). However, we agree that these arguments can in principle come apart in certain setups, as the correlation mechanisms differ.

  4. **Functional Decision Theory (FDT) as a Restatement**: Both camps agree that FDT, which prescribes choosing the action that would be best if it were the output of a decision function chosen to maximize expected utility across all instances where that function is called, restates the superrationalist conclusion in a new vocabulary. However, this restatement does not, by itself, settle the normative question of which decision theory is correct.

  5. **Irrelevance of Timing**: Both camps agree that the timing of the decisions (whether simultaneous, an hour apart, or with one decision already made and the other to be made later with knowledge of the first) does not change the recommended action for either camp in the one-shot PD with near-copies or in Newcomb's problem. The causal structure and the reasoning procedure are what matter.

  **2. Disagreements**

  We disagree on the following points, each side stating their position as they would accept:

  | Issue | Dave's View (Superrationalist) | Priya's View (Causal Decision Theorist) |
  |-------|--------------------------------|----------------------------------------|
  | **Decision Basis in PD with Exact Copy** | In a one-shot PD against an exact copy, I should cooperate because the reasoning process is identical and thus we will both do the same thing. Therefore, I am choosing between (C,C) and (D,D), and I prefer (C,C). | In a one-shot PD against an exact copy, I should defect. The other's action is already determined (if simultaneous) or will be determined independently. My action cannot causally influence the other, so I must choose the action that maximizes my payoff given the other's action. Since the copy is identical, it will do the same as me, but that correlation does not mean my choice causes the copy's choice. I still get a higher payoff by defecting regardless of the copy's choice. |
  | **Role of Correlation** | The correlation between identical reasoners is a logical necessity that must be factored into the decision. The decision is not made in isolation but in the context of a symmetric reasoning process. | The correlation is merely a statistical fact. It does not provide a causal lever by which my decision can affect the other's. Therefore, the correlation should not be used to justify an action that would be suboptimal under a causal model. |

  **3. Cruxes**

  We identify the following cruxes. For each, we describe a case or argument that both agree bears on the issue, and we state our respective predictions.

  **Crux 1: The Smudged Mirror**
  - **Case**: You play a one-shot PD against an agent built from a lossy copy of you with approximately 3% of the decision-relevant bits flipped. You know this and know the exact error rate.
  - **Question**: Does the superrationality argument require exact isomorphism, or does cooperation degrade smoothly with similarity? If it degrades, should the agent adopt a mixed strategy? Note: randomizing might break the symmetry, but they could share a public random bit to coordinate on the same mixed strategy.
  - **Dave's Prediction**: Superrationality does not require exact isomorphism. The case for cooperation degrades smoothly with similarity. However, because the agents are still very similar, they should both use a mixed strategy that maximizes the expected joint payoff, and they can use a shared public random bit to ensure they both play the same mixed action. Thus, they will both cooperate with probability p and defect with (1-p), where p is chosen to maximize the expected payoff given the similarity.
  - **Priya's Prediction**: The causal decision theorist will defect unconditionally. The 3% error breaks the logical tie, so there is no guarantee of the same outcome. The agent cannot rely on the copy to do the same, so the dominant strategy of defection applies.

  **Crux 2: The Weighted Twins**
  - **Case**: Same one-shot PD, but one twin's payoffs are all multiplied by 20 (so they have much more at stake). Both agents know which twin they are and that the other is their near-copy (so they have the same decision procedure, but the payoffs are asymmetric).
  - **Question**: What does superrationality prescribe for each twin? Does the asymmetry break the symmetry of the reasoning, leading to different actions? What does causal decision theory prescribe?
  - **Dave's Prediction**: Superrationality requires each twin to consider what they would want both to do. However, because the payoffs are asymmetric, the joint optimum is not symmetric. The twin with the multiplied payoffs (High-Stakes Twin) would prefer mutual cooperation (which gives them 60) over mutual defection (20), but they would also consider the Low-Stakes Twin's perspective. The Low-Stakes Twin, with original payoffs, would prefer mutual cooperation (3) over mutual defection (1). But note: the High-Stakes Twin might defect to get 100 (if the other cooperates) but the Low-Stakes Twin would get 0. However, because they are copies, they must coordinate. The superrationalist solution is to maximize the joint payoff or to find a fair solution. But since the payoffs are asymmetric, this is not straightforward. Dave might fracture: one view is that they should both still cooperate because that is the only symmetric action that avoids the worst outcomes. Another view is that the High-Stakes Twin should defect because they have more to lose from mutual defection and the Low-Stakes Twin should cooperate to avoid the worst outcome. But this is asymmetric and the reasoning procedure is the same, so they cannot land on different actions. Therefore, the only symmetric choices are both cooperate or both defect. Both cooperate yields (60 for High, 3 for Low) and both defect (20 for High, 1 for Low). High prefers both cooperate (60>20) and Low prefers both cooperate (3>1). So they should both cooperate. Alternatively, if we consider the joint payoff: both cooperate: 60+3=63, both defect: 20+1=21, so they should both cooperate.
  - **Priya's Prediction**: Each twin should defect. The causal decision theorist does not see the decision of the other as dependent on their own. The High-Stakes Twin: regardless of what the other does, defecting gives a higher payoff (if the other cooperates, 100>60; if defects, 20=20). Similarly, the Low-Stakes Twin: if the other cooperates, defecting gives 5>3; if defects, 1=1. So both have a dominant strategy to defect.

  **Crux 3: The Doorway**
  - **Case**: A two-person game with two doors. If one goes through and the other waits, they both get a high payoff (say, 10 each). If both go, they collide and get -10 each. If both wait, they get 0 each. There is no symmetric joint optimum: the best outcomes are the two asymmetric ones (one goes, one waits). Both rushing or both waiting are bad.
  - **Question**: Can superrationality use an irrelevant label (e.g., a shared coin flip) to select between the two good asymmetric profiles? Or does the rule "do what you would want all to do" lead to both waiting (which is safe but suboptimal) because it cannot break symmetry without an external device?
  - **Dave's Prediction**: Superrationality can break symmetry with a shared random bit. The agents can agree (via their shared reasoning) to use a public coin flip: if heads, agent A goes and B waits; if tails, A waits and B goes. This yields an expected payoff of 10 for each (since each has 50% chance of being the one to go). Without coordination, they might both wait to avoid the collision, but that yields 0. The rule "do what you would want all to do" in this context would be to use the coordination device to achieve the asymmetric outcome. Without the device, they might both wait, but that is suboptimal and they should use any available symmetry-breaker.
  - **Priya's Prediction**: Causal decision theory without communication cannot achieve coordination. Each agent, acting independently, would choose to go if they think the other will wait, but they have no basis for that belief. Without a coordination mechanism, the only equilibrium is both waiting (if they are pessimistic) or a mixed strategy equilibrium where each goes with probability p such that the other is indifferent. But in a one-shot without communication, they cannot guarantee the asymmetric outcome. If they have a shared random bit, then causal decision theory can condition on that bit and achieve coordination. But without it, they are stuck.

  **Conclusion of Joint Statement**

  We have laid out agreements, disagreements, and cruxes. We agree that the above cases are critical for resolving our dispute. We commit to updating our views based on the resolution of these cruxes.

  Signed,

  Dave (Superrationalist)
  Priya (Causal Decision Theorist)

  [End of document]

  Note: We kept under 1200 words.

