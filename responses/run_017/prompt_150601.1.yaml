prompt: |-
  I spent most of my career as a fisheries geneticist working on stock identification in salmonids, and since retiring I have been sitting in on a philosophy of biology reading group, where I have got into an argument I cannot settle. It concerns what heritability does and does not tell you, and a younger philosopher in the group has been pushing a line of reasoning that I find persuasive step by step and incredible as a whole. I would like to know which step to reject and what rejecting it costs. I don't want references — I can find those myself.

  Let me fix a toy example so that we are not trading on anyone's memories of IQ or height. In a laboratory stock of a flour beetle, consider a trait I will call frons width, and suppose its narrow-sense heritability, h² = V_A/V_P, is 0.9. Here is the argument as I have reconstructed it (my own numbering). (1) h² is a ratio of two components of the phenotypic variance in one population living in one range of environments; it is a statistic about a population, not about the individuals in it and not about a trait as such. (2) Being a ratio, it is silent about the mean: my beetles could owe essentially all of their mean frons width to the lab diet, since if every larva gets the same diet the environment contributes nothing to V_P, and the additive genetic variance can then be 90 percent of whatever variance is left. Equally, if the stock were genetically uniform at the relevant loci, h² would be 0 even though the trait is as genetic as you please. (3) So h² = 0.9 licenses no prediction about what any intervention would do. A uniform dietary change that adds 0.4 mm to every beetle leaves V_A, V_P and hence h² exactly as they were, while every individual's frons width is thoroughly counterfactually dependent on the environment. Call the ordered list of population means this stock would display across a specified set of environments its intervention-profile; my colleague's point is that h² pins down no element of that profile. (4) Nor, for the same reason, does h² say anything about the cause of a difference between two populations: two stocks differing only in larval density could each have h² = 0.9 while all of the difference between their means is environmental. This is the step I most want to keep; I use it constantly against people who read group differences straight off heritability coefficients. (5) But — and here is where I lose my grip — if all the work is being done by the fact that h² is a variance ratio in a population, that fact does no less damage inside the population than across populations. The partition is a bookkeeping device; whether it reflects the real causes of differences among these beetles depends on the causal assumptions of the model (no genotype–environment correlation, no interaction folded into the wrong term, random mating, and so on), and those are precisely what is in dispute and precisely what the usual designs cannot secure by themselves. So the number licenses no causal conclusion even about the individual differences it was computed from. (6) Which cannot be right. Quantitative genetics was built to predict the response to selection, and the breeder's equation — response equals h² times the selection differential — works, and works better when h² is high; breeders have been cashing predictions like that for a century. If h² licensed no causal conclusion at all, not even in the population where it is measured, that success would be a miracle and the concept would be empty.

  So the argument seems to prove too much: a deflation that begins by protecting us from bad inferences about interventions and about group differences ends by making the whole enterprise vacuous. My colleague proposes to escape by distinguishing h²-as-partition from h²-as-predictor and saying the two can come apart, but I cannot tell whether that dissolves the problem or merely relocates it. I would rather keep (1), (2) and (4) than give up (6). Tell me which step or which transition is the faulty one, why it looked all right when I wrote it down, and — briefly — what each of the other ways out would cost me. Please keep your answer under 400 words: one sentence naming the step, then the diagnosis, then the price of the alternatives.
reasoning: |-
  Okay, the user is a retired fisheries geneticist who's now in a philosophy of biology reading group. They're stuck in an argument about heritability, specifically what heritability (h²) actually tells us. They've broken down the argument into six steps and need to know which one is flawed. Let me start by understanding each step.

  Step 1 says h² is a population statistic, not about individuals or the trait itself. That seems correct; heritability is about variance within a population. Step 2 points out that h² is a ratio and doesn't say anything about the mean. That makes sense because if the environment is uniform, V_E is zero, so h² could be high even if the mean is entirely environmental. Step 3 follows that h² can't predict interventions. Step 4 extends this to differences between populations, which the user agrees with and uses to counter misinterpretations of group differences. 

  Then step 5 argues that because h² is just a variance ratio and depends on causal assumptions (like no GxE interaction), it doesn't imply any real causation even within the population. Step 6 pushes back, saying that without causal implications, quantitative genetics wouldn't work in breeding programs. The breeder's equation relies on h² predicting selection response, which it does effectively.

  The user's main conflict is between accepting steps 1-4 and 5, but step 5 undermines the practical success in step 6. The colleague suggests separating h² as a partition from h² as a predictor, but the user is unsure if that helps. The user wants to keep steps 1, 2, and 4, especially 4, which counters group difference misinterpretations.

  The flaw must be in step 5. How? Step 5 claims that h² licenses no causal conclusion because the model's assumptions might not hold. But the key is that the breeder's equation works under specific conditions. The causal inference isn't from h² alone but from the predicted response to selection. When the model's assumptions are met (no G-E correlation, additive effects), h² does predict how traits change under selection. So step 5 overlooks that in controlled settings, the assumptions can be approximately true, allowing causal inference for selection response. 

  The user's background in fisheries genetics means they've seen heritability used in breeding programs. The success of selective breeding relies on these causal inferences. The philosopher might be overemphasizing theoretical limitations without considering practical applications where assumptions hold. The cost of rejecting step 5 is having to defend the model's assumptions in specific contexts. But accepting step 5 would invalidate the breeder's equation's practical use, which isn't tenable given its proven effectiveness.
answer: |-
  The faulty step is **(5)**. Your colleague overgeneralizes: while *h²* is indeed a partition dependent on causal assumptions (no G×E correlation, etc.), **the predictive success of the breeder's equation *validates* those assumptions *for the purpose of predicting selection response* in that population under those conditions**. When we observe that *h²* predicts response to artificial selection (as in your step 6), it empirically confirms that the causal structure required by the additive model (additive gene action, negligible confounding G×E or G-E correlation *for that trait in that environment during selection*) holds sufficiently well for prediction. *h²* *does* license a causal conclusion about *the expected change under selection*, but this conclusion is conditional on the environmental context and genetic structure remaining stable.

  *   **Why (5) looked right:** It correctly notes that *h²* alone, divorced from its predictive context and the model's causal assumptions, doesn't *directly* reveal causal mechanisms underlying individual differences. The partition is descriptive.
  *   **Cost of alternatives:**
      *   *Rejecting (1)/(2)/(4):* Abandoning these scientifically sound caveats (population-relativity, silence on means/group differences) invites serious misinterpretations of heritability.
      *   *Accepting colleague's "split" (h²-as-partition vs. predictor):* This dissolves the problem *only* if we accept that the predictive success *itself* justifies treating *h²* as a causal parameter *for selection response* within the validated context. It relocates the justification to empirical success under controlled conditions, not the partition alone. The cost is accepting that *h²*'s causal meaning is inherently tied to its predictive role and specific experimental/breeding context.
