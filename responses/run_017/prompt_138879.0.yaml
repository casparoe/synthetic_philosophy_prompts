prompt: |-
  i sit on my county's heritage commission, and we keep getting cases where what a community remembers and what the archive says don't match. I think our past rulings fit more than one rule and i can't tell wich one we've been running:

  (1) A Black neighborhood's long-held story that the interstate was routed through it on purpose; the engineers' memos show the route was chosen on cost grounds years earlier. We kept the neighborhood's framing on the marker.
  (2) A family's claim that their grandfather invented a farm implement alone; company records list a team of six. We made them change the plaque.
  (3) A village's story of a massacre at a bridge; no massacre in the record, but there was a forced relocation there that same year. We paid for a memorial to the relocation and asked them to stop using the word massacre.
  (4) A tribe's account of where a treaty was signed; the record says elsewhere and nothing settles it. We marked both sites.

  New one: a town has reenacted, every year since 1931, the 1887 night its people dug a stranded train out of a snowdrift, and both the plaque and the schoolkids' script end with "and so the railroad gave us our depot" — that's the story of why the town exists. Our researcher found in the railroad's own ledgers that the depot was already scheduled in 1886, and the stranded-train night looks like it drifted in from a town forty miles away; but payroll records do show locals spent three days digging out a train in 1887. Two wrinkles: state heritage money now requires sites to be "documented," and the reenactment isn't an assertion anyone states out loud — the kids just pull a train with ropes.

  What should we decide if we want to be consistent with ourselves? Which of the four is the closest analog, what principle would we be adopting with each option, and what further case would actually split the rules that fit our record so far?
reasoning: |-
  Okay, the user is part of a county heritage commission dealing with cases where community memory conflicts with archival records. They've provided four past cases and a new one about a town's reenactment of a train rescue that supposedly led to getting a depot. The archives show the depot was planned earlier, and the rescue might be from another town. The user wants to know how to be consistent with their past decisions and identify the underlying principles.

  First, I need to analyze each past case to determine the pattern. Case 1: They sided with the community's narrative about the interstate routing despite engineers' memos showing cost reasons. The marker kept the neighborhood's framing. Here, the community's experience of systemic racism was valued more than the official reason.

  Case 2: A family claimed their grandfather invented a farm implement alone, but company records showed a team. They made them change the plaque. This seems like a straightforward correction of factual inaccuracy, especially since it's about individual credit.

  Case 3: The village's story of a massacre wasn't supported, but there was a forced relocation. They memorialized the relocation and asked to stop using "massacre." Here, they acknowledged the underlying trauma but corrected the specific event label. It's a compromise that addresses the real harm without endorsing the inaccurate term.

  Case 4: A tribe's account of a treaty signing conflicted with records, but nothing settled it. They marked both sites. This respects the tribal oral history as equally valid when evidence is inconclusive.

  Now, the new case: The town's reenactment claims the depot resulted from the train rescue in 1887, but archives show the depot was planned in 1886. Payroll confirms locals dug out a train, but the event might be from another town. Also, the reenactment isn't explicitly stated—it's performed. State funding requires documentation.

  Looking for the closest analog. Case 1 is similar because both involve infrastructure decisions (interstate vs. depot) where community belief persists despite records. In both, the community's narrative reflects a deeper truth—systemic injustice in Case 1, and perhaps the town's collective effort and identity in the new case. The depot's existence might be attributed to their actions, even if planned earlier. Case 3 is also somewhat similar because they addressed the underlying event (forced relocation vs. actual digging effort) without endorsing the inaccurate part (massacre vs. depot origin).

  But Case 2 is different because that was about individual credit with clear records contradicting the claim. The new case isn't about individual credit but communal origin. Case 4 dealt with two plausible claims without resolution, whereas here the depot timing is documented.

  The reenactment itself is performative, not an explicit assertion. The key is whether the plaque's claim about the depot's origin is documented. The archives show it was planned earlier, so that part is inaccurate. However, the digging event did happen, just possibly misplaced. So, like Case 3, they could commemorate the digging but correct the depot's origin story.

  The principle emerging: When community memory reflects systemic injustice or collective identity (Cases 1, 3), they accommodate it more, especially if there's a factual basis (e.g., forced relocation, digging effort). For individual claims (Case 2) or when evidence is inconclusive (Case 4), they act differently. For the new case, since the depot's scheduling is documented, they might require correcting the plaque but allow the reenactment as cultural tradition, separate from the depot claim.

  The user's deeper need is consistency in decision-making. They want clear principles to apply. The split between rules could be tested by a case where community memory has no factual basis but involves systemic harm versus one where it's harmless but inaccurate. For example, if a community remembers a lynching at a site with no records, versus a town claiming a famous person visited without evidence. How they handle those would clarify if the principle is about harm vs. accuracy or cultural significance.
answer: |-
  Based on your commission's past rulings, here's how to approach the train reenactment case consistently, analyzing principles and analogs:

  **Closest Analog: Case 3 (Bridge Massacre/Forced Relocation)**  
  - **Why?** Both involve a community narrative blending an *actual event* (forced relocation / digging out a train) with an *inaccurate framing* (massacre / depot origin). Your solution preserved the historical core while correcting the interpretive claim.  
  - **Principle Adopted:** **"Acknowledge the factual core, correct the narrative framing."** When evidence disproves a specific claim but confirms related events, honor the tangible history while refining the interpretation.  

  **Other Case Comparisons:**  
  - **Case 1 (Interstate Routing):** Not analogous. Here, you prioritized *systemic experience* (racism in infrastructure) over documented intent. The depot case lacks evidence of systemic harm; it’s about civic pride.  
  - **Case 2 (Inventor Claim):** Weak analog. You corrected a *provable factual inaccuracy* (individual vs. team credit). The depot’s origin is similarly documented, but the reenactment isn’t an explicit claim.  
  - **Case 4 (Treaty Site):** Not applicable. You preserved *competing valid claims* due to inconclusive evidence. Here, evidence *disproves* the depot-origin story.  

  **Recommended Decision for the Train Case:**  
  1. **Require the plaque/school script to be revised** to state: *"In 1887, townspeople heroically dug out a stranded train during a blizzard. Though the depot was planned earlier, this effort reflects our community’s resilience."*  
     - **Why?** Aligns with Case 3: payroll records confirm the digging (factual core), but ledgers disprove the depot link (corrected framing).  
  2. **Allow the reenactment to continue unchanged.** Its performative nature ("kids pulling ropes") avoids explicit historical claims, making it cultural tradition, not documentation.  

  **Core Principle Extracted from Your Rulings:**  
  > **"Documented facts constrain historical claims, but community significance and intangible heritage may shape interpretation when they reflect broader truths (injustice, identity, effort)—provided the factual core is acknowledged."**  
  - *Case 1:* "Broader truth" = systemic racism.  
  - *Case 3:* "Factual core" = forced relocation.  
  - *Train Case:* "Factual core" = the digging effort; "broader truth" = communal resilience.  

  **Test Case to Split Rules 1 and 3:**  
  Consider a scenario where:  
  > *A historically redlined neighborhood claims a specific bank denied loans in 1955, but archives show only refusals by other banks in 1957. The community insists this exemplifies their lived experience.*  
  - **Conflict:** Rule 1 (prioritize systemic truth) vs. Rule 3 (correct specific inaccuracy).  
  - **Resolution:** If your commission emphasizes the *pattern of injustice* (aligning with Case 1), you’d allow the marker to reference the bank. If you prioritize *documented specifics* (aligning with Case 3), you’d note loan denials occurred but omit the unverified bank.  

  **Why This Works for the Train Case:**  
  - **State Funding Compliance:** Revising the plaque satisfies "documentation" (ledgers prove depot timing).  
  - **Cultural Sensitivity:** The reenactment continues as heritage performance, not contested history.  
  - **Consistency:** Like Case 3, you separate verifiable events (digging) from unverified assertions (depot origin), honoring effort without endorsing myth.  

  **Key Takeaway:** Your commission consistently intervenes when *explicit claims* conflict with evidence (Cases 2, 3, 4 plaque text) but accommodates *embodied traditions* or systemic narratives when facts are ambiguous or reflect deeper truths (Case 1, reenactments). The train case’s plaque falls into the former category; the reenactment into the latter.
