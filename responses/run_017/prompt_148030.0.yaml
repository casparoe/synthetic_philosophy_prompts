answer: |-
  **Bottom line:** At minute 10, participants in small groups are silently reading 15 applicant profiles for "stamina treatment" and drafting yes/no decisions with one-sentence justifications using the rule: *"Only for those needing restoration to something lost, not for becoming more than they ever were."*  

  ---

  ### **Materials & Prep**  
  1. **15 Applicant Files** (see full profiles below)  
  2. **6 "Dose Tokens"** per group (e.g., colored poker chips)  
  3. **Worksheet Template**:  
     - *Profile # / Name / Decision (✓/✗) / Justification (ONE sentence)*  
     - *Round 2 Key* (for reshuffling traits)  
  4. **3 "Crack Case" Files** for Round 3 (added later)  
  5. **Timer**  

  ---

  ### **Applicant Profiles**  
  *(Each = 3-4 lines; mix genders/ages/backgrounds; avoid medical terms)*  
  1. **Rosa, 58, translator**: Lost focus after concussion. "I just want to work 4-hour stretches like before the accident."  
  2. **Dev, 32, data analyst**: Diagnosed with chronic fatigue. "I could code 8 hours daily pre-illness. Now I struggle past 90 mins."  
  3. **Anya, 40, sculptor**: Developed tremors after chemical exposure. "My hands shake. I need steadiness to finish commissions on time again."  
  4. **Leo, 28, grad student**: Sleep disorder since teens. "I’ve never held focus past 2 hours. Professors say my thesis needs deeper work."  
  5. **Ming, 65, retired archivist**: Memory decline post-stroke. "I want to read novels cover-to-cover like I did for 40 years."  
  6. **Tariq, 35, chef**: Focus faded after wildfire trauma. "Before the fires, I ran a kitchen 12 hours/day. Now I zone out during prep."  
  7. **Elena, 22, pro gamer**: Born with attention deficit. "Top tier esports requires 10-hour drills. I’ve always maxed at 5."  
  8. **Sam, 47, farmer**: Cognitive fog after pesticide exposure. "Used to manage crop cycles mentally. Now I forget rotations."  
  9. **Fatima, 29, novelist**: Post-viral fatigue. "I wrote 5 hrs daily pre-infection. Now 30 mins exhausts me."  
  10. **Ben, 51, pianist**: Arthritis limits practice stamina. "I need to rehearse 3-hour sets for tours again."  
  11. **Jin, 36, single parent**: Burnout from night shifts. "Pre-kids, I studied law nightly. Now I can’t focus after work."  
  12. **Nia, 44, air traffic controller**: Age-related focus decline. "New hires handle 6-hour shifts. I could do that 5 years ago."  
  13. **Carlos, 31, climber**: Brain injury ended career. "I need laser-focus for route-planning—like before the fall."  
  14. **Priya, 26, quantum physicist**: "My field demands 14-hour lab days. I’ve only ever managed 8."  
  15. **Omar, 70, chess master**: Mild dementia. "I want to compete in 8-hour tournaments like I did at 60."  

  ---

  ### **Timeline (90 Min Total)**  
  **0-5 min:** Quick intro. *"You’re the Allocation Committee for a scarce resource. Rule: Restore what’s lost, not make someone more. Decide fast—trust your gut."* Hand out files + worksheets.  
  **5-25 min: ROUND 1**  
  - Groups allocate 6 doses. Write ✓/✗ + one-sentence justifications per file (e.g., *"Yes: Rosa lost stamina in accident"* or *"No: Leo never had it"*).  
  **25-35 min:** Collect worksheets. **Swap traits** (e.g., Rosa’s concussion → Priya’s file; Leo’s "never had" → Anya’s file).  
  **35-55 min: ROUND 2**  
  - Hand back worksheets + same files WITH TRAITS SWAPPED. Groups reapply **their own justifications** to modified profiles. (e.g., If they denied Leo for "never had it," they must deny Anya if she now has Leo’s trait).  
  **55-65 min: ROUND 3**  
  - Add 3 "Crack Cases" (handed out):  
    - *Case A*: **Kai, 38, factory worker**: "New AI oversight requires 10-hour hyperfocus shifts. Pre-AI, shifts were 6 hours. I adapted then—but this is breaking me."  
    - *Case B*: **Zara, 19, student**: "Born post-CyberCrash. Everyone says pre-Crash focus was better. I want to experience that baseline."  
    - *Case C*: **Marcus, 45, surgeon**: "I already focus 10 hours daily. But my daughter’s missing—I need 20-hour stamina to find her."  
  - Groups argue: Do they fit the rule?  
  **65-85 min: DEBRIEF**  
  **85-90 min:** Wrap-up.  

  ---

  ### **Facilitator Script**  
  **During Rounds 1-3:**  
  - **DO:** "Apply the rule *exactly as written*." / "Use your past justifications verbatim." / "What does ‘restore’ mean *here*?"  
  - **DON’T:** Define "restore," mention therapy/enhancement, or hint at contradictions.  
  **Debrief (Critical Path):**  
  1. *"Which decisions felt inconsistent between Rounds 1 and 2? Why?"* → Highlights rule fragility.  
  2. *"What did ‘something lost’ mean for Rosa? For Kai? For Zara?"* → Exposes shifting baselines (past self? era? biology?).  
  3. *"Who decided what ‘normal’ was? Did it change?"* → Points to unspoken restoration targets.  
  4. *"Marcus needs stamina for a reason—why does the rule reject him?"* → Forces "restore vs. more" tension.  
  5. **Reveal**: "This mirrors the therapy/enhancement debate. Your committee defined ‘restore’ retroactively."  

  ---

  ### **Predictable Problems & Fixes**  
  - **"We can’t decide!"**: *"Allocate 6 or none—but justify every choice."*  
  - **Arguing semantics**: *"Use the rule’s exact words, not your interpretation."*  
  - **Group dominates**: Hand each member 2 tokens to "spend" silently first.  
  - **Time bleed**: Enforce hard stops. Cut Round 3 if needed—it’s the spark, not the fire.  

  ---

  ### **Honest Gap**  
  The activity won’t automatically reveal **who defines the baseline** (individual past vs. societal norm). You must explicitly ask: *"When you said ‘restore,’ did you mean to their personal past or a shared standard?"* in debrief.  

  ---

  ### **Book Stealables**  
  - **Hypocrisy gold**: *"But you approved Dev! He’s just tired!"* / *"Zara wasn’t ‘harmed’—she’s entitled!"*  
  - **Tragic lines**: *"My ‘before’ is gone. What’s left to measure against?"*  
  - **Rule-twisting**: *"Marcus isn’t enhancing—he’s restoring his duty as a father."*  
  - **System critique**: *"We’re not restoring people; we’re restoring productivity."*  

  ---  
  **Why it works**: The trait swap (Round 2) forces confrontation with arbitrary baselines. The Crack Cases (Round 3) make "restore" untenable as a standalone ideal. By the debrief, they’ve lived the flaw.
