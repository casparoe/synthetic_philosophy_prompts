prompt: |-
  I've been teaching a graduate seminar on social normativity for several years now, and I find that I've drifted into holding a position about conventions that I would rather have stress-tested than defended. Roughly: I hold that what makes a regularity a convention is its structure as an equilibrium solution to a recurring coordination problem, together with the availability of alternatives that would have served the parties at least as well — and that nothing further is needed. In particular I deny that conventions require a distinctively normative psychology (no sense of obligation, no guilt, no disposition to punish nonconformers); I deny that they require common knowledge, or even true mutual expectations, among the participants; and I deny that the participants must be able to represent the situation as a coordination problem at all. What sustains a convention, on my view, is whatever mechanism in fact produces stable conformity to one equilibrium among several — precedent, salience, individual habit, the built environment, a correlated signal, a population-level dynamic — and the explanatory work is done by the equilibrium-plus-arbitrariness structure rather than by the mechanism. I have taken to calling the thesis that the sustaining mechanism is irrelevant to conventionality so long as it is self-reinforcing the mechanism-indifference claim, and it is the part of my view I am least confident about.

  What I want from you is a map of the view's exposure: the observations, arguments, possible cases and formal results that should move me, ranked from fatal to merely awkward, and, for each, an assessment of whether a committed holder of the view — not a critic — should concede it as counting against the view or may reasonably dismiss it. I have some candidate defeaters in mind and want to know how much weight they really bear. (i) The affordance-locked regularity: two exits from a lecture hall, one door marginally lighter to open and positioned so that anyone entering sees only those who have used it; over a term nearly everyone uses that door; each person's choice is fully explained by their own earlier choices plus the door's weight; no one has any belief about what anyone else does or will do; and the regularity is stable, self-reinforcing, and arbitrary in that the other door would have served everyone just as well. If my view counts this as a convention it looks too permissive, and I seem to have made the shape of a corridor conventional; if it does not, then mechanism-indifference is false and I owe a non-circular account of which sustaining mechanisms qualify. (ii) The proleptic-convention problem: every convention has a first instance at which no regularity yet exists, so if conventionality requires actual past conformity nothing can ever become a convention; my usual move is to count a merely anticipated regularity, and I want to know whether that move costs me the arbitrariness condition or quietly turns the view back into a claim about expectations. (iii) Contested equilibria, where the parties' preferences over the available equilibria genuinely conflict, so that the selection is a matter of indifference to no one. (iv) Vestigial norms, where the original coordination problem has lapsed entirely while the regularity persists, with full normative phenomenology and no loss of stability.

  Two further things. First, I want to know where the view risks anything: what does it predict that its rivals — a normative-expectations account, a plain equilibrium account of the rational-choice sort, an internalization or normative-attitude account — do not? I have in mind predictions about why conventions outlive their rationales, about the timing of convention change (threshold and tipping effects rather than gradual drift), about what we should expect to find in creatures or simple artificial agents with minimal theory of mind, and about when third-party enforcement should be unnecessary. I also want to know what the view stands or falls with elsewhere: whether it depends on a non-circular account of salience, on the explanatory credentials of equilibrium in social science generally, or on claims about how much mutual knowledge is achievable in large populations. Second, I want an honest verdict on whether the view has been qualified into unfalsifiability. I notice myself reaching, when pressed with an awkward case, for the thought that any stable regularity of mutual adjustment solves the coordination problem of adjusting to one another, and that a coordination problem is therefore always available. If that move has made the view unable to lose, say so plainly, and tell me whether that is a genuine defect for a view of this kind or simply what a structural account should be expected to look like. On the personal side: I am moved far more by a case in which the structure is present and the normativity absent, or the reverse, than by arguments from the phenomenology of obligation, which I think I can explain away cheaply; and I would count a demonstration that the arbitrariness condition does no work beyond what coordination equilibrium already delivers — that is, that my view collapses into the deflationary rival — as the most serious objection on the table, ahead of any empirical difficulty. Please argue directly, with cases and arguments rather than a reading list; I have no need for citations or suggestions for further reading.
reasoning: |-
  Okay, let me start by unpacking the user's query. They’ve been teaching a seminar on social normativity and have developed a view on conventions that emphasizes equilibrium solutions to coordination problems, arbitrariness, and mechanism-indifference. They want their position stress-tested, focusing on four candidate defeaters and broader implications.

  First, I need to understand their core claims: conventions are equilibria with arbitrary alternatives, sustained by any self-reinforcing mechanism, without normative psychology, common knowledge, or representation of the coordination problem. The mechanism-indifference is their main uncertainty.

  Looking at the candidate defeaters: 
  1. **Affordance-locked regularity**: The door example. If everyone uses one door due to its weight without any mutual expectations, is it a convention? If yes, it might be over-inclusive; if not, mechanism-indifference fails. 
  2. **Proleptic-convention**: How can a convention start if it requires past regularity? Anticipated regularity might reintroduce expectations. 
  3. **Contested equilibria**: When parties prefer different equilibria, arbitrariness is challenged. 
  4. **Vestigial norms**: Norms persist after the coordination problem is gone, yet maintain normativity.

  The user also wants to know where their view risks predictions compared to rivals, dependencies (like salience), and if it’s unfalsifiable. They’re especially concerned about arbitrariness being redundant and collapsing into a deflationary equilibrium account.

  I should assess each defeater's weight from their view's perspective. For the door case, conceding it as a convention might be awkward but not fatal. The proleptic issue requires clarifying that arbitrariness can apply to anticipated states. Contested equilibria might be awkward if preferences conflict, but the user can argue the core equilibrium structure still holds. Vestigial norms can be explained by the persistence of the equilibrium structure, separating phenomenology from definition.

  For predictions: Their view predicts conventions can exist without normativity, outlive original problems, change rapidly via tipping points, and occur in minimal-mind agents. This contrasts with normative-expectations accounts. Dependencies include equilibrium explanations in social science and a non-circular account of salience.

  Unfalsifiability is a risk if every stable regularity is seen as solving a coordination problem. They need to avoid stretching "coordination problem" too thin. The arbitrariness condition is crucial to prevent collapse into a plain equilibrium view. If arbitrariness is redundant, that's a serious objection.

  The user values structural examples over phenomenology. The most serious objection is arbitrariness not adding value. I need to argue that arbitrariness does work by excluding cases where only one equilibrium exists, maintaining a distinction from general equilibrium accounts.
answer: |-
  Here’s a stress-test of your view, organized by severity of objections (fatal to awkward), with defenses and vulnerabilities. I focus on structural cases, arbitrariness, and mechanism-independence, per your constraints.

  ---

  ### **Fatal Flaws (If Unanswered)**
  1. **Collapse into Deflationary Equilibrium (The Core Threat)**  
     **Objection**: If arbitrariness adds nothing beyond coordination equilibrium, your view reduces to "any stable behavioral regularity solving a coordination problem." But *all* Nash equilibria solve coordination problems trivially. Arbitrariness must exclude cases like:  
     - *Unique Optimal Equilibrium*: Two tribes share a river. Tribe A fishes upstream, B downstream. This is a stable coordination equilibrium (neither gains by switching unilaterally), but it’s *non-arbitrary*: each tribe’s location is uniquely optimal given geography. Calling this "conventional" dilutes the term.  
     **Why it’s fatal**: Without arbitrariness, your view loses its distinction from plain game theory. Conventions become synonymous with coordination equilibria, contradicting your emphasis on "alternatives that would have served at least as well."  
     **Defense**: Dig in on arbitrariness: In the river case, no *symmetrically interchangeable* alternative exists. Conventions require multiple, roughly equal equilibria *from a shared perspective*. But this risks circularity if "shared perspective" smuggles in mutual knowledge.  

  2. **Proleptic Convention and Arbitrariness**  
     **Objection**: Your "anticipated regularity" move for first instances *requires* mutual expectations to ground arbitrariness. Consider: Two strangers meet in a dark forest. Each anticipates the other will attack if unarmed, so both arm themselves. The resulting "armed standoff" is stable/arbitrary (mutual disarmament was possible). But the arbitrariness condition is satisfied *only via expectations*: each knows disarming *could* work if the other reciprocates. Without beliefs about others, "alternatives" are inert.  
     **Why it’s fatal**: If arbitrariness is defined counterfactually ("there exists an alternative equilibrium"), but the counterfactual is unrealizable without mutual beliefs, then expectations are covertly necessary. Mechanism-independence fails.  
     **Defense**: Insist arbitrariness is *structural*, not psychological. The forest has two pure-strategy Nash equilibria (both armed, both disarmed). The armed outcome prevails due to precedent (say, a twig snap misheard as a weapon draw). No expectations needed—just path-dependent convergence. But critics reply: without mutual belief, why is disarming an *equilibrium alternative*? It’s only viable if both coordinate, which they can’t without communication.  

  ---

  ### **Serious but Possibly Survivable Objections**
  3. **Affordance-Locked Regularity (Your Door Case)**  
     **Objection**: If this is a convention, then *any* habit reinforced by physical constraints qualifies (e.g., always taking the shortest supermarket queue). But conventions are typically social—they govern *interdependent* behavior. Here, actors are causally isolated; no mutual adjustment occurs.  
     **Why it’s serious**: Mechanism-indifference seems to overgeneralize. Conventions dissolve into mere patterns.  
     **Defense**: Embrace it. Argue that conventions *are* patterns of behavioral coordination, even if sustained by environmental cues. The door case *is* a coordination equilibrium: if others use the heavy door, I benefit by using the light one (avoiding congestion). The arbitrariness condition holds (both doors could work if all switched). The "social" element is the *counterfactual interdependence*, not active mutual monitoring.  
     **Cost**: You must accept "convention" applies to solo habits in structured environments. If that’s too revisionist, add: "Conventions require that stability depends on *others' conformity*." In the door case, stability is physical (door weight), not social. But this abandons mechanism-indifference.  

  4. **Contested Equilibria**  
     **Objection**: Suppose two groups must coordinate on a language (A or B). Group 1 prefers A, Group 2 prefers B. They settle on A after a power struggle. This is a stable equilibrium (all use A) and arbitrary (B was possible), but the selection *wasn’t indifferent*—it reflected asymmetric power.  
     **Why it’s serious**: Conventions are typically thought to involve mutual advantage. Here, the "arbitrariness" masks distributive conflict.  
     **Defense**: Stand firm. Conventions need not be Pareto-optimal; they just need multiple equilibria. The outcome is arbitrary in that *another stable solution existed*. The sustaining mechanism (power) is irrelevant.  
     **Vulnerability**: If conventions can emerge from coercion, your view aligns with "order" simpliciter, losing normative flavor. But you deny normativity is essential—so this may be a virtue.  

  ---

  ### **Awkward but Manageable Challenges**
  5. **Vestigial Norms**  
     **Objection**: A taboo against eating pork persists for centuries after sanitation improves. Normative phenomenology (guilt, punishment) remains strong, but the original coordination problem (avoiding disease) is gone. Your view must say:  
     - If the regularity is stable/arbitrary (e.g., beef was possible), it’s still a convention.  
     - But the *normative psychology* is now explanatorily redundant.  
     **Why it’s awkward**: Critics argue the psychology sustains the convention post-rationale; you say the equilibrium structure does. But you can’t explain *why* the psychology persists.  
     **Defense**: Grant that normative attitudes are epiphenomenal here. The convention persists due to self-reinforcing mechanisms (e.g., internalized habit, punishment rituals). Equilibrium stability doesn’t require functional origins.  

  6. **Unfalsifiability via "Universal Coordination"**  
     **Objection**: Your worry is valid. If *every* stable regularity solves a "coordination problem of adjusting to others," then queueing, fashion, and breathing rhythms become conventions.  
     **Defense**: Impose constraints:  
     - Coordination problems must have **multiple strict Nash equilibria** (excluding cases like the river tribes).  
     - **Arbitrariness** requires symmetry: the alternatives must be *payoff-equivalent* or *perceived as such by an omniscient observer*.  
     **Risk**: This may require salvaging "salience" non-circularly (e.g., "salience = whatever breaks symmetry in practice").  

  ---

  ### **Where Your View Risks Predictions (vs. Rivals)**
  - **Why conventions outlive rationales**: Predicts persistence *without* normative attitudes (e.g., QWERTY keyboards). Rivals (e.g., normative-expectations accounts) predict decay unless internalized.  
  - **Timing of change**: Predicts tipping points (equilibria shift abruptly when thresholds crossed). Rivals predict gradual erosion if attitudes shift slowly.  
  - **Minimal-mind agents**: Predicts conventions in e.g., ant trails (pheromone-based path coordination) or AI traders (algorithmic convergence on arbitrage norms). Rivals deny these are conventions.  
  - **Third-party enforcement**: Predicts it’s unnecessary unless stability is threatened (e.g., contested equilibria). Normative accounts often see enforcement as constitutive.  

  ---

  ### **Dependencies & Verdict**
  - **Crucial dependencies**: Your view stands on (1) **equilibrium explanations being fundamental** in social science (if functionalism wins, you lose), and (2) a **non-circular account of coordination problems** (if "coordination" is stretched, you collapse).  
  - **On unfalsifiability**: Your view *is* at risk if "coordination problem" becomes a catch-all. **Verdict: Not yet unfalsifiable, but vigilance needed**. Resist redefining every regularity as coordination. Stress that arbitrariness requires *symmetric alternatives* and that equilibria must be *strict* (unilateral deviation harms the deviator).  
  - **Overall health**: The view is robust if you:  
    - **Clarify arbitrariness** as symmetry of alternatives (blocking collapse).  
    - **Accept door-like cases** as conventions (mechanism-independence holds).  
    - **Bite the bullet** on contested/vestigial cases (structuralism requires it).  
  Your biggest threat remains **arbitrariness doing no work**. If it can’t exclude unique optimal equilibria or requires expectations, the view fails. Otherwise, it’s a defensible, parsimonious account.
