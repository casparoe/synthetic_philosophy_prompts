prompt: |-
  I'm giving a short talk to a political-theory reading group next month on whether visitors have to follow local conventions — the everyday kind: how much you tip, whether you form a line or crowd the door at a bus stop, whether you cross against the light on a visibly empty street. I've circulated a one-page statement of where I've landed so the others can poke holes in it before I present, so I'd like you to treat the list below the way they will: as a position to audit rather than a question to answer. Assume I'm reasonably happy with each item taken on its own; what I can't see is whether they hold up together.

  Here is the statement, more or less as I wrote it. (1) The reason a convention gives me to conform is exhausted by the social facts: others conform, they expect me to, and my conforming helps keep the coordination going. Nothing more is needed, and the reason is conditional — it lapses once enough others stop conforming, because then there's nothing left for me to coordinate with. This is the standard coordination account of convention: an arbitrary resolution of a recurring coordination problem, held in place by common knowledge of general conformity; Lewis's name is the one always attached to it. (2) Some breaches of convention are nonetheless genuine moral wrongs and not mere impoliteness: queue-jumping wrongs the specific people standing behind you, and that is a moral matter. (3) Whether a newcomer must follow a local convention depends only on what is locally in force — not on whether she thinks the convention is a good one, not on how long she has been in the country, and not on whether she intends to stay. She must queue in a queueing city on her first afternoon; she need not tip in a city where tipping isn't done. (4) Not tipping where servers' wages are built on the assumption of tips is morally wrong, and not merely a breach of local convention; by contrast, jaywalking across an empty street is at most a conventional failing, since nobody is wronged. (5) My preferred test for whether an act is morally permissible is the generalization test: what if everyone in relevantly similar circumstances did that? (6) I don't think we owe anyone the preservation of a bad convention. Where a convention is a worse equilibrium than an available alternative, deliberately deviating in order to help move the group to the better one can be justified — I'm thinking of things like a queueing practice that wastes everyone's time, or settled norms of deference in a workplace. (7) This holds even for norms that solve no coordination problem at all: in a city where people greet strangers in the street, and in a city where they studiously don't, a visitor should in each case do what is done there, and is being offensive if she doesn't.

  There are two cases I keep failing to get a verdict on that I'm comfortable with: a tourist in a country where tipping isn't done, whose café staff are plainly underpaid; and a tourist who is unmistakably a tourist — map, camera, wrong clothes for the weather — who pushes ahead at a bus stop in a city with a strong queueing norm. A friend says part of my trouble is that (5) is the wrong test for conventions, since conventions tolerate a non-zero rate of deviation and the universal version of the test destroys the very facts my reason to conform depends on; she thinks the right counterfactual is what if one more person did that rather than what if everyone did. I can't tell whether that rescues (5) or hollows it out.

  What I want from you: work through the list and tell me which pairs are genuinely in tension and which only look like it, ranked by severity rather than flagged uniformly — I'd rather have one or two real problems located precisely than seven items all called shaky. For each real tension, say exactly what would have to give, what that revision would cost me elsewhere in the view, and whether there is a cheaper repair available; then tell me which single revision cleans up the most and why. Give me verdicts on the two cases both under the view as I've stated it and under the least-costly repaired version, and note whether the reasoning that reaches them changes even if the verdicts don't. Finally, if part of my difficulty is that I'm calling two or three different things conventions, say so explicitly — that would be useful to know before I stand up in front of the group.
reasoning: |-
  Hmm, the user is preparing for a political theory talk on whether visitors must follow local conventions. They've shared their position statement with seven points and want me to critique it for internal tensions. They specifically want me to identify conflicting pairs, suggest revisions, and apply their framework to two tricky cases. This is an intellectual challenge requiring careful philosophical analysis.

  Looking at their seven points, I notice the core tension lies between conventionalism and moral universalism. Point 1 presents conventions as purely coordination-based and arbitrary, while point 4 introduces moral wrongs independent of convention (like underpaid servers). Point 3 insists local conventions bind visitors immediately, yet point 6 permits deviating to change bad conventions. The generalization test in point 5 seems particularly problematic when applied to conventions, as their friend noted - universal deviation would destroy the convention itself.

  The two test cases perfectly expose these fault lines. For the non-tipping tourist: if tipping isn't conventional there, point 3 says don't tip, but if servers are underpaid, point 4 might demand tipping as moral duty. For the queue-jumping tourist: point 2 calls queue-jumping morally wrongful, but point 1 suggests conventions only bind when others comply. Their framework gives contradictory answers depending which principle we prioritize.

  The deepest conflict is between points 1 and 4 - the former sees conventions as morally neutral coordination tools, the latter imbues some convention-adjacent acts with inherent morality. To fix this, I'd suggest distinguishing between "pure conventions" (like jaywalking) and "moral-conventional hybrids" (like tipping in wage systems). This preserves most of their structure while acknowledging that some conventions carry moral weight through their consequences.

  For the test cases, under the original framework: the non-tipping tourist gets conflicting guidance (don't tip per local convention vs. tip due to exploitation), while the queue-jumper clearly wrongs others. After distinguishing convention types, the tourist shouldn't tip where it's not conventional but might have political obligations regarding exploitation; the queue-jumper still wrongs others but the wrongness stems from the harm, not convention breach alone.

  The user might be conflating three types of norms: pure coordination conventions, morally-loaded conventions, and moral rules masquerading as conventions. Making these distinctions explicit would strengthen their presentation and help resolve the tensions they're struggling with.
answer: |-
  Here’s a systematic audit of your position, identifying tensions, repair strategies, verdicts on your test cases, and conceptual clarifications. The core tensions stem from **inconsistent accounts of normativity** (coordination vs. moral foundations) and **unresolved boundary issues** between conventions and moral obligations.

  ### Ranked Tensions (Most Severe First)
  1. **Points 1 & 4: "Coordination vs. Moral Wrongs"**  
     - **Tension**: Point 1 reduces convention-compliance to *conditional coordination reasons* (lapsing when coordination fails). Point 4 asserts that breaches of *some* conventions (e.g., not tipping where wages rely on tips) are **intrinsic moral wrongs** independent of coordination stability.  
     - **Conflict**: If tipping’s moral wrongness stems from exploiting workers’ dependency, it cannot be merely conventional (per Point 1). Yet Point 4 treats it as a moral wrong *derived from the convention’s structure* (wages + tips), creating a hybrid category unaccounted for in Point 1.  
     - **Repair Needed**: Abandon Point 1’s claim that convention-based reasons are *exhausted* by social coordination facts. Some conventions generate moral reasons due to their **consequences** (e.g., sustaining exploitative labor practices).  
     - **Cost**: Weakens Lewisian purity; conventions now sometimes carry moral weight beyond coordination.  
     - **Cheaper Fix?**: No—Point 4’s moral claims require this revision.  

  2. **Points 3 & 6: "Immediate Compliance vs. Deliberate Deviation"**  
     - **Tension**: Point 3 demands newcomers follow local conventions *unconditionally* (no exceptions for judgment/duration/intent). Point 6 permits deviation to disrupt "bad" conventions (e.g., inefficient queues).  
     - **Conflict**: What defines "bad enough" to justify deviation? Point 6 implies moral/pragmatic criteria beyond local validity, contradicting Point 3’s insistence that only "what is locally in force" matters.  
     - **Repair Needed**: Qualify Point 3: Compliance is presumptive *unless* the convention is harmful/unjust *and* deviation could reasonably advance change.  
     - **Cost**: Undercuts strict visitor neutrality; introduces evaluative discretion.  
     - **Cheaper Fix?**: Yes—limit Point 6 to residents (not visitors), but this clashes with Point 3’s "not how long she has been here."  

  3. **Points 5 & 1: "Generalization Test vs. Coordination Logic"**  
     - **Tension**: Point 5 uses a generalization test ("what if everyone did X?") for moral permissibility. But Point 1 notes conventions *require* predictable non-universal deviation (e.g., jaywalking when safe). Applying "what if everyone jaywalked always?" destroys the convention, making the test inapt.  
     - **Conflict**: Generalization tests work for *categorical* moral rules but misfire for *conditional* coordination norms. Your friend is right: "What if one more person did X?" better captures conventional reasoning.  
     - **Repair Needed**: Restrict Point 5 to non-conventional moral questions (e.g., exploitation). For conventions, use a **marginal impact test** ("does *my* act undermine coordination/harm others?").  
     - **Cost**: Diminishes universality of Point 5; fragments your moral framework.  
     - **Cheaper Fix?**: No—the test’s structure is ill-fitted to conventions.  

  4. **Points 2 & 4: "Moral Wrongs in Conventions"**  
     - **Tension**: Both claim some convention breaches are moral wrongs, but Point 2 (queue-jumping) focuses on **individual harm** ("wrongs specific people"), while Point 4 (not tipping) emphasizes **structural injustice** (wage systems).  
     - **Conflict**: No direct contradiction, but the mismatch obscures *why* some breaches are moral. Queue-jumping wrongs individuals *because* of the convention; not tipping is wrong *despite* the convention’s existence.  
     - **Repair Needed**: Unify accounts: Wrongs occur when breaches (a) exploit cooperative benefits (queues) or (b) compound pre-existing injustice (tipping).  
     - **Cost**: Minimal—adds clarity without altering substance.  

  ---

  ### Single Best Revision: Repair #1 (Modify Point 1)  
  **Why**: It resolves the severest tension (1 vs. 4), indirectly aids 3 vs. 6 (by clarifying when conventions have moral weight), and is foundational. Without this, hybrid cases (like tipping) destabilize the whole framework.  

  ---

  ### Verdicts on Test Cases  
  **Under Original Framework**:  
  - **Underpaid Café Staff (No-Tipping Country)**:  
    - Point 3 says *don’t tip* (follow local convention).  
    - Point 4 *might* imply tipping is morally required (if staff are exploited), but only applies where tips are "built into wages"—which isn’t the case here. **Verdict: No duty to tip**.  
    - **Tension Exposed**: Points 3 and 4 lack tools to address exploitation *outside* tip-reliant systems.  

  - **Queue-Jumping Tourist**:  
    - Point 2 deems this a moral wrong (wrongs those behind).  
    - Point 1 notes the convention holds, so reason to comply exists.  
    - **Verdict: Morally wrong**.  

  **Under Repaired Framework (Revised Point 1 + Marginal Test for Conventions)**:  
  - **Underpaid Café Staff**:  
    - *No convention?* No coordination reason to tip (Point 1).  
    - But if underpayment is exploitative, *moral reasons* might apply (Point 4 extended). **Verdict: Optional altruism, not obligation**. Reasoning shifts: Focus is on poverty, not convention.  
  - **Queue-Jumping Tourist**:  
    - Point 2 still applies (harms specific individuals).  
    - Marginal test: One tourist jumping queue doesn’t collapse the norm but *does* harm those displaced. **Verdict: Still wrong** (same outcome, clearer reasoning).  

  ---

  ### Conceptual Clarification: Three Types of "Conventions"  
  You conflate:  
  1. **Pure Coordination Conventions** (Jaywalking, Greetings):  
     - Arbitrary, create no moral duties; reasons to comply are purely conditional (Point 1).  
  2. **Conventions with Moral Externalities** (Tipping in unjust systems):  
     - Coordination devices that amplify pre-existing injustices. Breaches can be moral wrongs *if they compound harm* (Point 4).  
  3. **Conventions as Moral Practices** (Queueing):  
     - Solve coordination problems *while creating* moral obligations (e.g., fairness to cooperators). Breaches wrong individuals (Point 2).  

  **Why it Matters**: Your tensions arise from applying Point 1 (designed for Type 1) to Types 2 and 3. Distinguishing them lets you:  
  - Restrict Point 1 to Type 1.  
  - Ground Point 4 in Type 2’s structural harms.  
  - Base Point 2 on Type 3’s inherent fairness.  

  ---

  ### Summary Recommendations  
  1. **Revise Point 1**: Conventions *primarily* provide coordination reasons, but some generate moral obligations due to harm/justice implications (resolves tension with 4).  
  2. **Qualify Point 3**: Newcomers must follow conventions *unless* they are harmful/unjust *and* deviation is a credible act of reform (resolves tension with 6).  
  3. **Restrict Point 5**: Use generalization tests for core moral permissibility (e.g., exploitation), but assess conventions via marginal impact (resolves friend’s objection).  
  4. **Clarify Typology**: Explicitly distinguish convention-types to preempt objections about conflation.  

  This strengthens coherence while preserving your core insights. The two test cases then reveal nuances in applying the typology—not fatal flaws. Present this taxonomy upfront, and your framework will withstand scrutiny.
