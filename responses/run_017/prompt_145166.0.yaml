  ### Decision Tree Diagnostic: Cooperation in Large Worlds  
  **Root Commitment:** "In a one-shot prisoner's dilemma against an exact psychological copy of myself, who faces the same choice with the same information, cooperation is what I should do."  

  #### Tree Structure  
  - **Node 1: Why split here?** Tests if cooperation is motivated by decision-theoretic structure vs. moral/axiological reasons, even if rational choice theory says "defect."  
    - **No (Decision-theoretic branch):** Proceed to Node 2.  
    - **Yes (Moral/axiological branch):** Proceed to Node 3.  

  - **Node 2 (Decision-theoretic): Hazy Mirror case.** Tests if similarity-based correlation extends to non-exact copies.  
    *Scenario: ~1,000 agents with 80% match to your reasoning (same history/dispositions + one idiosyncratic experience).*  
    - **No:** Proceed to Node 4.  
    - **Yes:** Proceed to Node 5.  

  - **Node 3 (Moral/axiological): Hazy Mirror case.** Tests if moral reason applies to non-exact copies.  
    - **No:** Leaf 1: **Identity-based** (cooperation only with exact copies as "self"). Least comfortable: Denies moral weight to nearly identical agents.  
    - **Yes:** Proceed to Node 6.  

  - **Node 4 (Decision-theoretic): Twin case.** Tests robustness to divergent reasoning in exact copies.  
    *Scenario: Your exact copy spent 1 extra hour thinking and defects; you see no flaw in their reasoning.*  
    - **Yes (cooperate):** Leaf 2: **Exact-copy-robust** (cooperate if copy was initially identical). Least comfortable: Cooperate knowing the copy will likely defect.  
    - **No (defect):** Leaf 3: **Exact-copy-fragile** (require identical states). Least comfortable: Cooperation is rarely possible.  

  - **Node 5 (Decision-theoretic): Institutional response.** Tests if non-exact cases demand direct cooperation or institution-building.  
    - **Build institutions (defect):** Leaf 4: **Institutionalist** (defect without institutions). Least comfortable: Defect despite high correlation when institutions are infeasible.  
    - **Cooperate:** Proceed to Node 7.  

  - **Node 6 (Moral/axiological): Copy-spam case.** Tests universality of moral reason under adversarial conditions.  
    *Scenario: Adversary creates 50,000 low-fidelity copies (~15% match) to incentivize cooperation.*  
    - **Yes (cooperate):** Leaf 5: **Moral universalism/Impersonal good** (cooperation always valuable). Least comfortable: Cooperate even when it benefits adversaries.  
    - **No (defect):** Leaf 6: **Moral threshold** (cooperate only above similarity/risk thresholds). Least comfortable: Arbitrary thresholds for similarity.  

  - **Node 7 (Decision-theoretic): Copy-spam case.** Tests sensitivity to adversarial correlation and fidelity.  
    - **Less reason:** Leaf 7: **Adversary-discounting** (discount correlations from adversaries/simulations). Least comfortable: Vulnerable to undetected adversaries.  
    - **More reason:** Proceed to Node 8.  
    - **Same reason:** Proceed to Node 9.  

  - **Node 8 (Decision-theoretic): Scale dependence.** Tests if reason strength scales with number of agents.  
    *Scenario: Strength if only 1 other agent (vs. thousands)?*  
    - **Yes:** Leaf 8: **Scale-dependent correlational view** (strength ∝ number). Least comfortable: Weak reason in probably small worlds.  
    - **No:** Leaf 9: **Unnamed: Correlation without scale dependence** (strength independent of number). Least comfortable: Cooperate as strongly for one agent as for millions.  

  - **Node 9 (Decision-theoretic): Basis for cooperation.** Tests if reason depends on shared decision procedure vs. statistical correlation.  
    - **Same decision procedure:** Leaf 10: **Decision-procedure view** (cooperate with same algorithm). Least comfortable: Requires knowing others' internal processes.  
    - **Statistical correlation:** Proceed to Node 8.  

