prompt: |-
  Hey — I'm on the grants committee of a small private foundation (mostly engineers, one retired biologist, and me; I write backend services for a freight-logistics company, so philosophy is really not my thing). I need a memo I can circulate to the other trustees before we vote on Saturday morning.

  The setup: we have one last big grant to place, about $22M, and there's a hard wrinkle — the trust has to spend down everything within nine years, so by our own rules anything whose payoff arrives several centuries out is off the table no matter how large it is.

  Finalist A is an astronomy group that wants telescope time to check the atmospheres of a few hundred rocky exoplanets for signs of life. The thing that makes their proposal weird is that their estimate of the chance of a hit doesn't come from data at all. It comes from a sampling argument: roughly, you should reason as if you'd been randomly drawn from all the observers there ever are, and a universe where observers are extremely numerous makes your own existence much more likely than a universe where they're rare, so conditional on finding yourself existing you should expect life to be common, so their survey is likely to succeed and the upside is enormous.

  Finalist B is a "civilizational snapshot and archive" project: a distributed, redundancy-heavy record of what we know, plus near-term resilience work. Their case runs the other way: reason as if you're a random draw from the actual population of observers of your kind, in which case you should expect to be somewhere around the middle of the human story rather than right at the start of it, so the future probably isn't enormous and we should stop pretending far-future payoffs are where the value is and spend on things that pay off inside the spend-down window.

  Then there's the bit I can't get straight. In the Q&A, team A added a second argument that's been nagging at me: they say the bare fact that this decision is being made *now* — in the very first slice of history in which a committee like ours could fund a search like this — is itself a piece of evidence, and that it favors funding them under either style of reasoning. Their framing: either observers turn out to be common, in which case life is probably out there and the survey hits; or the window in which a civilization gets to do this kind of thing is short, in which case there won't be many later chances and we should fund it while we can. That feels to me like it might be a heads-I-win move, or it might be fine, and I genuinely can't tell which.

  They also offered, if funded, to pre-commit in advance to exactly who counts as "an observer of our kind" and to publish the analysis twice — once under each style of reasoning. Our science advisor says that's theatre: the disagreement isn't about the data, it's about the prior you walk in with, so locking the reference class down early doesn't buy anything. I lean his way but I'd like it argued properly.

  What I want from you is a decision memo, 900–1200 words, addressed to the committee, that:

  1. Opens with an actual bottom line — fund A, fund B, fund neither, or fund one with conditions. If conditions, make them concrete with numbers and dates we could vote on.
  2. Explains the disagreement to people who think in terms of priors and likelihoods rather than philosophy jargon. Two short paragraphs and at most one analogy. Please don't condescend to us about it — several trustees are perfectly capable of following a likelihood argument.
  3. Takes on what I think of as the armchair objection: a couple of trustees think you cannot extract billions of dollars' worth of conclusion about how much life exists from reasoning done sitting in a chair with no new measurements, and that a grant committee especially has no business doing it. I half agree with them. But I also want the strongest honest version of whichever position you end up rejecting — if you tell me to fund B, give me the version of the "observers are probably numerous so the upside is gigantic" argument that actually stings, not a version you can knock over.
  4. Says what our nine-year spend-down rule does to the argument. Does it make the long-future-versus-short-future fight irrelevant to us, or does it just relocate it somewhere we haven't noticed?
  5. Handles the "we're deciding this now" argument and the pre-registration offer head-on, and tells us whether a null result from the survey would even discriminate between the two styles of reasoning. My guess is it wouldn't, but tell me why.
  6. Optionally, if you think it's worth a short paragraph: one trustee pointed out that if the "many observers" picture is right then there will be an enormous number of future funding committees in roughly our position, so the *procedure* we adopt today gets copied many times and its value is multiplied, whereas under the other picture there aren't many such committees — so maybe how we decide matters more than what we decide. Is that a real consideration or a rhetorical trick?

  Constraints: no citations, no bibliography, no "so-and-so argues" — we can't check any of that and nobody here will read it. Reason from the shape of the case itself, and keep the jargon defined in plain terms the first time it appears.

  And please commit. Don't hand me a balanced menu and leave the choice to us — that's the one thing that'll be useless on Saturday. Tell me which way to vote, say roughly how confident you are as a fraction, and name the single thing that would most change your recommendation if we found it out.
reasoning: |-
  Okay, the user is on a grants committee for a private foundation and needs a decision memo about two finalists for a $22M grant. The foundation has to spend down everything within nine years. Let me break down their requirements.

  First, Finalist A is an astronomy group using a sampling argument about being randomly selected among all observers. They argue that since we exist, life must be common, so their exoplanet survey is likely to succeed. They also mention that deciding now is crucial because if the window is short, we should act immediately. Finalist B focuses on civilizational resilience, arguing that we're likely in the middle of human history, so future payoffs aren't as valuable. 

  The user has specific points to address. They need a clear recommendation upfront—fund A, B, neither, or with conditions. The explanation should use priors and likelihoods without philosophy jargon. The committee members are technically savvy, so no condescension. 

  Then there's the "armchair objection": can such reasoning justify billions without new data? I need to present the strongest counter-argument to whatever I recommend. Also, how does the nine-year spend-down affect the decision? If the future is long, but we can't fund beyond nine years, does that change things?

  The "deciding now" argument from Team A needs analysis. Is it a heads-I-win? And the pre-registration offer—does locking down the observer definition help? The science advisor says it's theater since the prior is the issue, not data. Also, would a null result from the survey distinguish between the two reasoning styles?

  Another trustee's point: if there are many future committees, our decision's procedural impact multiplies. Is that valid or a trick?

  The user wants a committed decision, not a balanced overview. Confidence level and the key factor that could change the recommendation are required.

  Let me start by evaluating the core arguments. Team A's doomsday vs. long-term argument: if life is common, funding the survey makes sense. If civilization is short-lived, then we must act now. But this seems circular. If civilization collapses soon, the survey's results might not matter. The nine-year spend-down means that even if the future is long, we can't benefit from far-future payoffs. Team B's project offers resilience within the timeframe, which aligns with the spend-down rule.

  The sampling arguments: Team A's self-sampling assumption (SSA) vs. Team B's self-indication assumption (SIA). SSA suggests we're typical observers, so we're in the middle, not the start. SIA posits that our existence is more likely in a universe with many observers, so life should be common. But these priors are untestable. A null survey result wouldn't disprove SIA because it could mean we're early or life is rare despite many observers. Pre-registration doesn't help because the issue is the prior, not the data collected.

  The "deciding now" point: it's true that this is the first chance, but that doesn't necessarily favor Team A. If we're early, SSA suggests we might be wrong about being typical. Also, funding Team B's resilience could extend the window, allowing future surveys. Team B's project has immediate benefits within nine years, like redundancy and knowledge preservation, which could prevent loss of current knowledge.

  The trustee's point about many future committees: under SIA, if there are many observers, our decision's impact is diluted. Under SSA, if we're near the end, our decision matters more. But this is speculative. The spend-down rule makes procedural considerations irrelevant because we're constrained by time.

  Considering the nine-year window, Team B's project delivers tangible results within that period. Team A's survey might not complete in time, and even if it finds life, the payoff is long-term. The grant's terms require spending within nine years, so funding a project with far-future benefits violates the rules. Team B's archive and resilience work aligns better.

  The strongest counter to funding B: if life is common, not funding A misses a huge opportunity to transform our cosmic perspective. But given the time constraint, that upside is inaccessible. The committee must prioritize within their mandate.

  Recommendation: Fund Team B with conditions. Require milestones every 18 months, with 50% funding after 4.5 years contingent on progress. Confidence at 80%. If Team A could deliver preliminary results within nine years, that might change things, but their survey likely won't.

  Key points: spend-down rule prioritizes near-term payoffs, Team B's project fits that, Team A's doesn't. The "deciding now" argument doesn't override the time constraint. Pre-registration is futile. Null result wouldn't resolve prior disagreements. Trustee's procedural point is moot due to spend-down.
answer: |-
  ## MEMORANDUM  
  **To:** Grants Committee Trustees  
  **From:** [Your Name], Grants Committee Member  
  **Subject:** Final $22M Grant Recommendation: Fund Civilizational Archive (Finalist B) with Contingent Milestones  
  **Date:** 11 October 2023  
  **Bottom Line:** **Fund Finalist B (Civilizational Snapshot & Archive)**, subject to staged funding release tied to verifiable milestones. Allocate $22M conditional on:  
  1.  **$11M released immediately** upon contract signing.  
  2.  **$5.5M released at 36 months** upon demonstration of ≥3 geographically distributed, hardened archive sites with verified data redundancy protocols.  
  3.  **Final $5.5M released at 54 months** upon completion of the near-term resilience network for at least 5 critical scientific/technical hubs.  
  *Confidence:* **80%**. The spend-down window and untestability of core premises favor B. The key factor that could shift this recommendation: If Team A can credibly demonstrate *any* scientific results (even null) within the next 6-7 years.

  ### I. Core Disagreement: Priors vs. Untestable Worldviews
  The disagreement between Teams A and B isn't about new data; it's about the fundamental starting assumptions ("priors") each uses to interpret *our existence*. Both use sampling arguments, but they define the "reference class" differently:

  *   **Team A (Astronomy/SIA):** Assumes we are a *random sample from all possible observers* (Self-Indication Assumption - SIA). This heavily weights priors towards universes where observers are *abundant*, making our existence unsurprising. *Likelihood:* If SIA is correct, finding life is probable, making the survey high-value.
  *   **Team B (Archive/SSA):** Assumes we are a *random sample from actual human-like observers* (Self-Sampling Assumption - SSA). This favors priors where we are *typical*, placing us near the median of human history. *Likelihood:* If SSA is correct, the long future is unlikely; value lies in preserving the present/near-term.

  **Analogy:** Imagine estimating the lifespan of a lightbulb. SIA is like assuming you randomly picked *any moment* the bulb is lit – you'd likely catch it mid-life. SSA is like randomly picking *any bulb ever made* – you'd likely get one from the huge batch produced so far, suggesting its lifespan isn't unusually long. Neither uses the bulb's *current* state; they rely entirely on initial assumptions about the manufacturing process.

  ### II. Addressing the Armchair Objection & Strongest Counter-Argument
  The trustees questioning "armchair cosmology" are right to be skeptical. **Team A's core argument is untestable with *this* survey.** A null result ("no biosignatures found") doesn't disprove SIA – it could mean life is rare *despite* many observers, or we're unusually early. A positive result supports SIA but *also* fits a universe where life is rare but we got lucky. The sampling argument itself isn't falsifiable by the data collected.

  **Strongest Case for A (The Sting):** If SIA *is* correct, and life is common, this survey could be humanity's pivotal discovery, fundamentally altering our cosmic perspective and potentially revealing our place in a teeming universe. The sheer scale of this potential upside – arguably the most consequential scientific result possible – dwarfs near-term resilience gains *if* the long future exists. Team A correctly argues that *if* the window for such searches is short (as SSA might imply), acting *now* is imperative. Failing to fund this under SIA would be a catastrophic missed opportunity.

  ### III. The Nine-Year Window: It Decisively Favors B
  Our spend-down rule makes the core philosophical dispute **largely irrelevant for *this* grant's valuation** under Team A's primary argument, but **reinforces Team B's case**:

  1.  **Team A's Long-Term Upside is Off-Limits:** Even if SIA is correct and life is discovered, the *transformative societal payoff* occurs far beyond our 9-year horizon. We cannot ethically justify $22M based on benefits we are forbidden by our charter from valuing.
  2.  **Team A's "Act Now" Argument is Neutralized:** While the "first chance" point is factually true, the spend-down rule means *we can only value impacts within 9 years*. Funding A only makes sense *if the survey itself delivers near-term value*. Its direct scientific output (cataloging exoplanet atmospheres) is valuable but unlikely to justify $22M alone within 9 years compared to B's deliverables.
  3.  **Team B's Value is Concentrated Now:** B's archive and resilience work delivers concrete outputs *within the spend-down window*: preserving critical knowledge against near-term risks (infrastructure failure, localized disasters) and enhancing scientific continuity. Its value proposition aligns directly with our constraint.

  ### IV. "Deciding Now," Pre-Registration, & Discriminatory Power
  *   **"Deciding Now" Argument:** Team A is correct that this is the first opportunity. However, this fact doesn't inherently favor funding *their specific project*. Under SSA (B's view), acting now is prudent *because* the future is likely short, but the best action is resilience/archiving to extend our window, not a life-detection survey. Under SIA (A's view), there *will* be future chances, reducing the unique urgency of *this* grant. The "heads I win" feeling arises because Team A tries to co-opt *both* worldviews, but only SIA strongly motivates their *specific* project, and its payoff is barred by our rule.
  *   **Pre-Registration Offer (Theatre):** Our science advisor is correct. Locking the observer definition and publishing analyses both ways doesn't resolve the prior conflict. Whether you define "observer" as humans, sentient beings, or conscious entities, the fundamental choice between SSA and SIA as the *starting point* remains untested by the data. It's a procedural gesture without scientific substance for this decision.
  *   **Would Null Results Discriminate? No.** As noted (Section II), a null result is consistent with multiple scenarios under both SSA and SIA. It wouldn't tell us if observers are rare or abundant, or if we're early or late. It primarily refines estimates of *local* planet habitability, not the core cosmological priors.

  ### V. The Procedural Multiplier: A Distraction
  The trustee's point about our decision being copied under SIA is intriguing but **not a material consideration**:
  1.  **Under SIA (Many Committees):** If there are countless future committees, the marginal impact of *our specific decision procedure* is negligible. Our $22M grant is a drop in the cosmic ocean.
  2.  **Under SSA (Few Committees):** If we are near the end, the *immediate impact* of our resource allocation is paramount. Funding resilience directly addresses the presumed short window.
  3.  **Our Constraint Dominates:** The spend-down rule forces us to prioritize *immediate, tangible outputs* regardless of the cosmic picture. Procedural legacies are irrelevant when we must spend *now*.

  ### VI. Recommendation & Conditions
  **Fund Finalist B (Civilizational Snapshot & Archive) with the $22M contingent on the milestones outlined in the Bottom Line.** 

  *   **Why:** B delivers concrete, high-value outputs within our 9-year window: preserving irreplaceable knowledge and bolstering near-term scientific resilience against plausible risks. This directly satisfies our spend-down mandate and provides measurable impact.
  *   **Why Not A:** A's core value proposition (transforming our cosmic view) is philosophically fascinating but untestable in the near term and its payoff is explicitly excluded by our 9-year rule. Its scientific value (exoplanet characterization) is significant but not $22M-significant *within our constraint* compared to B's deliverables.
  *   **Conditions Rationale:** The milestones ensure accountability and deliverable progress within the crucial first 4.5 years (50% of window), allowing course-correction or reallocation if needed. They focus on demonstrable infrastructure (archives, resilience networks).

  **Confidence:** 80%. The spend-down rule is the decisive factor, making B's alignment clear. The key uncertainty is the *absolute* near-term value of B's outputs versus A's exoplanet data. **The single factor most likely to change this recommendation:** If Team A can provide a credible, detailed plan demonstrating how *specific, high-impact scientific results* (e.g., atmospheric characterization of 50+ planets, novel chemistry insights) will be achieved and published *within the next 6-7 years*, significantly justifying the cost within our window. Absent this, B is the only responsible choice under our charter.

  **Vote:** Approve Funding for Finalist B with Staged Milestones.
