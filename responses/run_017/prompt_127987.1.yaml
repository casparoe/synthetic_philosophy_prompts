answer: |-
  Sharp opener! You're right that fine-graining is the crux. But you've misdiagnosed it as metaphysics smuggling. It's structural constraint smuggling—from the quantum state itself. Let’s cut through:

  Measurement neutrality demands that your betting preferences depend *only* on the quantum amplitude mod-squared—it’s the only invariant across equivalent experimental setups. But amplitudes *compose multiplicatively* under tensor product decomposition. If you have a branch with amplitude *c*, and you fine-grain it into *m* sub-branches each with amplitude *c*/√*m* (so norm squares add: |*c*|² = *m* × |*c*/√*m*|²), your weight assignment must respect that decomposition structure *if it’s going to be consistent under recomposition*. If you assign weight *w*(*c*) to the coarse branch, and weight *w*(*c*/√*m*) to each fine sub-branch, consistency under recombination *requires* *w*(*c*) = *m* × *w*(*c*/√*m*). Solve that: *w*(*c*) ∝ |*c*|² is the only solution satisfying *w*(*c*) = *m* × *w*(*c*/√*m*) for all *m* and *c*. Your *α*-agent violates this: *m* × |*c*/√*m*|²ᵅ = *m*¹⁻ᵅ |*c*|²ᵅ ≠ |*c*|²ᵅ unless *α*=1.

  This isn’t metaphysics—it’s demanding that your *rational degrees of care* align with how the state *actually decomposes*. The "resolution-relativity" of self-location doesn’t save you: the Everettian multiverse contains *both* descriptions simultaneously. Rationality requires your preferences to be stable across these equivalent descriptions of the *same physical reality*. If you care *m* times more about a coarse outcome than each of its fine-grained realizers, you’ll make incoherent bets when offered choices at different granularities. 

  So: if branching is real, and measurement neutrality holds, why wouldn’t rational consistency force your weights to track the multiplicative structure of the amplitude? What coherent betting strategy does your *α*-agent *actually use* when faced with a choice between a coarse-grained bet and its fine-grained decomposition?
