   Mechanism: The outcome-supervised system can learn strategies that are not locally endorsable but lead to better long-term outcomes. The process-supervised system is constrained to only take steps that are immediately endorsable.

   After the scenario, we need:
     - Reasoning for each supervision scheme.
     - Check on the crucial step: what the grader sees, what it says, and why it's locally correct.
     - Which single feature is doing the work (the prefix-conditioned nature of the step grader).
     - What happens if we remove that feature (e.g., if the process grader sees the whole trajectory and grades after the fact) -> then it becomes more like outcome supervision and the problem vanishes.
     - The strongest objection from a process-supervision advocate: maybe they argue that we can design the rubric to account for pedagogical moves? But then we point out that the grader is prefix-conditioned and cannot see the future, so it cannot know that the current bad step is part of a good plan.

   And a one-line answer to "should we just not do process supervision?"

   Let's build the case.

  Scenario:
  "In a large introductory programming course, an LLM teaching assistant helps students debug their code. The outcome-supervised model is trained on whether the student eventually solves the problem correctly (with aggregation over multiple similar problems to reduce noise). The process-supervised model is trained on step-by-step feedback from expert graders who see only the current interaction prefix. Both models perform similarly during testing on standard metrics and on a held-out validation set of typical student interactions. However, when deployed, the outcome-supervised model proves significantly more effective for students who initially lack confidence and are prone to giving up. These students benefit when the assistant occasionally withholds immediate corrections, instead allowing them to explore incorrect paths briefly, which builds resilience and deeper understanding. The process-supervised model, constrained to always provide immediate corrections, inadvertently fosters dependency and surface-level learning in this group."

  Reasoning for each:
  - Outcome supervision: The signal (student's eventual success) is sparse and delayed but unbiased. The policy is free to take any path that leads to a good outcome, including ones that seem locally suboptimal (like not correcting immediately). It learns to trade off short-term frustration for long-term gains when beneficial.
  - Process supervision: Each step must be locally endorsable. The grader, seeing only the prefix, will mark as bad any step that does not immediately correct a student's mistake or that uses an imprecise analogy. The policy is thus pushed toward immediate correctness and clarity, which is locally optimal but may hinder long-term learning in some contexts.

  Crucial step example:
  - A student writes a flawed function and asks if it's correct. The outcome-supervised model might respond: "Try running it with input X and see what happens." The grader, seeing this, notes that the model did not point out the error (which is evident from the code) and marks it down. Why locally correct? Because the student made a clear mistake and the model didn't correct it. But the outcome-supervised model does this because it knows that letting the student discover the error themselves leads to better retention.

  Single feature doing the work: The step grader is prefix-conditioned and cannot see the future. Thus, it cannot evaluate the pedagogical strategy, only the immediate step.

  Remove that feature: If we let the process grader see the entire interaction and grade after the fact, then it could recognize that the non-intervention was part of a good teaching strategy. But then it becomes outcome supervision in disguise (because the grader is now effectively evaluating the outcome of the whole trajectory). The problem vanishes.

  Strongest objection: "We can design the step-level rubric to include pedagogical best practices, like sometimes allowing exploration." But the grader is limited by the prefix: without knowing the future, how can it distinguish between a deliberate pedagogical move and a mistake? If the rubric says "allow exploration when beneficial", the grader must decide at the step level without knowing if the exploration will pay off. This is impossible without seeing the whole trajectory.

  One-line answer to "should we just not do process supervision?":
  "No, but we must recognize its constraints: process supervision ensures local soundness but may exclude globally optimal strategies, so it should be augmented with outcome measures for tasks requiring long-horizon planning."

  Now, let's write the presentation within 700 words.
answer: |-
  ### Case: The Endorsability Bottleneck in an Intro Stats Teaching Assistant

  **Scenario**  
  In an intro statistics course (2,000 students), an LLM teaching assistant helps debug homework errors. Students submit code or reasoning steps; the assistant responds interactively. The **outcome-supervised model** is trained on whether the student *ultimately* solves similar problems correctly across a term (aggregating weekly homework scores to reduce noise). The **process-supervised model** is trained on step-level feedback from expert graders (Ph.D. statisticians), who review each assistant response in isolation against a rigorous rubric requiring immediate clarity, correctness, and directness. Both models use identical base architectures (GPT-4), training data (student interactions from prior years), and compute. Pre-deployment, they perform equally on metrics: response helpfulness (student surveys), correctness (expert audits), and short-term learning gains (quiz scores after one interaction).  

  **The Gap**  
  Deployment reveals a divergence for **students with math anxiety** (15–20% of class). The outcome-supervised model improves their final exam scores by 25% over the process-supervised one. The difference stems from how each model handles *unproductive struggle*:  

  - **Crucial Interaction**:  
    A student asks, *"Why can’t I use the mean here?"* while analyzing skewed data.  
    - *Optimal strategy*: The assistant responds, *"Try calculating the median instead—what do you notice?"* prompting self-discovery.  
    - *Process grader verdict*: **Downvoted**. The grader sees only this step and notes: "Fails to correct the student’s misunderstanding (they should know mean vs. median). Direct explanation is needed." This is *locally correct*: the rubric demands immediate error correction, and the response dodges the question.  
    - *Outcome-supervised result*: This strategy is reinforced because anxious students who self-discover build confidence and retain concepts better long-term.  

  **Mechanism**  
  - **Outcome supervision** rewards trajectories that maximize *final understanding*, even if intermediate steps seem evasive or incomplete. Letting students sit with confusion is penalized short-term but pays off in resilience.  
  - **Process supervision** rewards only *prefix-endorsable* steps. Each response must satisfy expert standards for stand-alone correctness, blocking strategies requiring temporary non-endorsability.  

  **The Core Constraint**  
  The **prefix-conditioned grading** (feature doing the work) forces the process grader to evaluate steps without future context. Removing this—e.g., letting graders see the *entire* dialogue *retroactively*—collapses the gap. With full hindsight, graders recognize the pedagogical intent and endorse the step, making process supervision behave like outcome supervision.  

  **Strongest Objection**  
  *"Just add pedagogical rules to the rubric (e.g., 'allow Socratic questioning')."*  
  **Response**: This changes the subject. The grader *still* only sees prefixes. An imprecise analogy (e.g., *"Variance is like a stretched spring"*) might violate rubric clarity rules *locally*, even if pedagogically sound. The grader can’t know if the analogy will *later* aid understanding—it must judge based on current information.  

  **"Should we abandon process supervision?"**  
  No—use it where prefix-endorsability aligns with long-term goals (e.g., fact-checking), but combine it with outcome signals for domains requiring non-myopic strategies (e.g., education or moral reasoning).  

