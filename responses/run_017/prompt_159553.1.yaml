prompt: |-
  I am the token philosopher on a committee at my university that has to choose a social discount rate for long-lived capital projects — a district-heating retrofit whose costs fall now and whose savings accrue over eighty years, a library roof with a fifty-year life, that sort of thing — and I have discovered that I cannot reconstruct a principle behind the numbers I keep wanting to propose. So I am going to list my gut verdicts on a set of cases and ask what discounting rule, if any, they add up to. (1) A migraine for me tomorrow versus an identical migraine for me in exactly twenty years: indifferent, I would pay the same to avoid either. (2) A weekend in Vienna this year versus a qualitatively identical weekend in twenty years: I would give up something like a tenth of the value to have it now. (3) Fifty dollars now to spare a stranger a day of severe pain next year, but only about twenty to spare a stranger an identically severe day three centuries from now — yet if you hand me a device that guarantees the later person exists, that the pain would otherwise occur, and that my money is spent only conditional on both, my reluctance almost entirely disappears. (4) A friend who spends forty years in dreamless suspended animation and wakes in 2065 with no experienced gap: a benefit delivered to her at the instant of waking versus the same benefit delivered a calendar year later — my gut says no discount at all, which suggests that what I am discounting is experienced time rather than calendar time, though I cannot tell what that implies for the committee's eighty-year retrofit, where everyone experiences the interval. (5) A thousand people helped in two hundred years beats a hundred helped today, but a hundred helped today beats a hundred and one helped in two hundred years, so my revealed rate seems to collapse as the stakes grow. (6) I would pay more to postpone a harm by a year than to advance an equal-sized benefit by a year. (7) I would pay a great deal to shave a small probability of civilizational collapse five centuries out, but very little for a guaranteed modest benefit to whoever is alive then, which sits badly with (5). And one more observation that may or may not belong: if I imagine being told that I was born in 1920 rather than 1990, my willingness to pay for benefits in a given calendar year changes, which makes me suspect that part of what I call temporal discounting is really positional rather than temporal.

  What I want is the principle, or the small set of candidate principles, that fits these verdicts — stated precisely, with the case that motivates each clause, and with an honest statement of which verdicts it cannot accommodate and why. Please separate, as you go, the discounting that is genuinely a preference for earlier over later from the discounting that is really something else wearing its clothes: risk that the beneficiary never exists or the benefit never arrives, causal fragility over long chains, opportunity cost of capital, diminishing marginal utility if future people are richer, or the positional effect I mentioned. Once all of those are subtracted, is there a residual pure time preference in my verdicts at all, and if there is, is it rationally defensible or is it the familiar failure of imagination that the economists on the committee invoke? I would also like the resulting account's verdicts on three cases I have not listed: a policy whose beneficiaries do not yet exist and whose number depends on which policy we choose; a bequest to an institution that will persist continuously for three hundred years, where no individual experiences the interval; and the difference, if the account sees one, between discounting within a single life and discounting across generations. Finally, tell me whether the account I end up with hands the committee a single number, or whether it implies that a single number was never the right object to be asking for.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a philosopher on a university committee tasked with choosing a social discount rate for long-term projects. The user has listed several intuitive judgments about different scenarios involving time and value. Their main challenge is to find a coherent principle behind these intuitions, separating genuine time preference from other factors like risk, opportunity cost, and positional effects.

  First, I need to go through each case they mentioned and understand the underlying factors. Case (1) shows no discounting for personal pain over 20 years, suggesting pure time preference might be negligible for certain harms. Case (2) involves a significant discount for a pleasurable experience now versus later, which could be due to impatience or diminishing marginal utility over time. 

  Case (3) is interesting. The user discounts helping a stranger in the distant future but changes when assured of the person's existence and the intervention's efficacy. This points to exogenous risks (like civilizational collapse or failed interventions) rather than pure time preference. The key here is the certainty provided by the device, which alleviates their reluctance.

  Case (4) discusses suspended animation. The user doesn't discount benefits for a friend waking after 40 years if there's no experienced time gap. This implies that what matters is subjective experience, not calendar time. For projects where people experience the interval, calendar time would still matter, but this case suggests that without experiential gaps, discounting isn't necessary.

  Case (5) shows a variable discount rate based on stakes. Saving more people in the future is preferred when numbers are large, but small benefits now outweigh slightly larger future ones. This could indicate a threshold effect or non-linear utility, where the user prioritizes immediate needs unless future benefits are substantially larger.

  Case (6) demonstrates asymmetry between harms and benefits. The user would pay more to delay harm than to accelerate benefits. This might stem from loss aversion, where avoiding negative outcomes feels more urgent than gaining positives.

  Case (7) contrasts willingness to pay to prevent civilizational collapse versus providing guaranteed modest benefits. Preventing existential risk has high value due to its catastrophic impact, while small future benefits get heavily discounted. This ties into the probability of existence and the scale of impact.

  The positional effect observation is crucial. The user's willingness to pay changes based on their birth year, indicating that the calendar year itself carries weight, possibly due to the era's perceived state or technological progress. This isn't pure time preference but a form of temporal positioning.

  Now, synthesizing these, the user needs a framework that separates various discounting components. The core principle might be that pure time preference is minimal or zero, but other factors like risk, diminishing marginal utility, loss aversion, and positional effects drive most of the discounting behavior. 

  For the committee's task, applying a single discount rate might be inappropriate. Different components (existence risk, opportunity cost, technological growth) could each have their own "discount" factors. The framework should be additive or multiplicative, accommodating these variables. 

  The user also asked about beneficiaries who don't exist yet, bequests to long-lived institutions, and intra vs. intergenerational discounting. For non-existent beneficiaries, the key is the expected number and their welfare. Institutional bequests might involve perpetuity risk rather than time preference. Intra-generational discounting could involve personal impatience, while intergenerational might focus more on ethical considerations and exogenous risks.

  In conclusion, the user's intuitions reject a single discount rate. The committee should adopt a multi-factor model, transparently accounting for each element. This approach is more defensible philosophically and practically, aligning cost-benefit analyses with deeper ethical principles.
answer: |-
  Based on your introspective case judgments, your "gut verdicts" reveal a complex, multi-dimensional framework for intertemporal valuation. There isn't a single "pure" time preference rate; instead, several distinct principles interact. Here's the reconstructed principle set, clause by clause, grounded in your cases:

  **The Core Principle Set:**

  1.  **Negligible Pure Time Preference for Core Welfare:** For fundamental welfare states (pain/pleasure, basic needs, existence), pure calendar-time discounting is minimal or zero *if* certainty and experiential continuity are assured.
      *   *Motivated by:* Cases (1) (migraine indifference over 20 years), (4) (no discount for friend after animation - *calendar gap irrelevant without experience*), and the core implication of (3) (reluctance disappears with certainty device).
      *   *Accommodates:* The intuition that mere distance in time, absent other factors, shouldn't fundamentally devalue identical welfare states. This challenges the "failure of imagination" charge for core goods.
      *   *Cannot Accommodate:* Case (2) (Vienna weekend discount). This requires a different principle (see #2).

  2.  **Impatience for Consumption & Positional Goods:** Significant discounting applies to experiential consumption, access to unique opportunities, and goods valued relative to one's temporal position.
      *   *Motivated by:* Case (2) (Vienna weekend - value in experiencing it *now*, within current life context/energy/culture). Also the positional observation (willingness changes based on imagined birth year - value is tied to *when* an event occurs relative to the *era* and one's life stage, not just the welfare state itself).
      *   *Accommodates:* The desire for things sooner rather than later when they involve consumption, novelty, or are context-dependent.
      *   *Cannot Accommodate:* Why this doesn't apply to core welfare (Case 1). It's domain-specific.

  3.  **Exogenous Risk Discounting (Probability of Non-Occurrence):** Heavy discounting reflects the compound probability that: (a) the beneficiary won't exist, (b) the causal chain delivering the benefit fails, or (c) the benefit itself becomes irrelevant.
      *   *Motivated by:* Case (3) (stranger in 300 years - high implicit risk discount; reluctance vanishes with guaranteed existence/delivery). Case (7) (high value on reducing collapse risk vs. low value on guaranteed modest benefit - collapse risk imperils *all* future value). The positional effect also partly fits (value in 2050 depends on assumed state of the world *then*).
      *   *Accommodates:* The dramatic difference between guaranteed outcomes and probabilistic ones over long horizons.
      *   *Cannot Accommodate:* Cases (1), (4), or the guaranteed parts of (3) where risk is removed. This is not preference for time, but aversion to uncertainty.

  4.  **Threshold-Dependent, Non-Linear Marginal Utility Across Time:** Future benefits must be *significantly larger* than present ones to be preferable, especially for large-scale welfare, but small present benefits trump slightly larger distant ones. Discount rates are variable and stakes-dependent.
      *   *Motivated by:* Case (5) (1000 in 200y > 100 now; but 100 now > 101 in 200y). Suggests a high hurdle rate for *substitution* (delaying consumption/benefit requires substantial future compensation), but recognition of overwhelming scale.
      *   *Accommodates:* The collapse of willingness to trade small certain present benefits for slightly larger distant uncertain ones, while accepting massive future gains.
      *   *Cannot Accommodate:* The indifference in (1) – this principle implies *some* discount for harms too, which you reject.

  5.  **Loss Aversion / Harm-Benefit Asymmetry:** Delaying harms is valued more highly than accelerating equivalent benefits.
      *   *Motivated by:* Case (6) (Pay more to postpone harm than to advance benefit).
      *   *Accommodates:* The heightened urgency around preventing negative outcomes compared to securing positive ones of equal magnitude.
      *   *Cannot Accommodate:* Symmetry between gains and losses – your valuation framework is inherently asymmetric.

  6.  **Experiential Time (Not Calendar Time) for Intrapersonal Valuation:** The relevant metric for discounting within a single, continuous life is subjective/experiential time, not calendar time. Gaps without experience don't "count."
      *   *Motivated by:* Case (4) (Friend in animation - benefit immediately after waking vs. a calendar year later is undiscounted; the 40-year gap is irrelevant to her experiential continuity).
      *   *Accommodates:* The intuition that value discounting tracks the *experience* of waiting or anticipation within a life.
      *   *Cannot Accommodate:* Intergenerational discounting directly (Case 3, 5, 7), where there is *no* single experiential timeline bridging the gap. Calendar time becomes necessary again.

  **Separating the Components:**

  *   **Genuine Preference for Earlier over Later (Impatience):** Primarily Principle #2 (Consumption/Positional Goods). Minimal in #1 (Core Welfare).
  *   **Risk (Existence, Delivery, Relevance):** Principle #3. This is the dominant factor in long-term intergenerational cases (3, 5, 7).
  *   **Causal Fragility:** Subsumed under Principle #3 (Probability of Non-Occurrence).
  *   **Opportunity Cost of Capital:** *Not* directly reflected in your cases. Your judgments focus on consumption/welfare trade-offs, not investment returns. A separate economic factor the committee must consider.
  *   **Diminishing Marginal Utility (Future Riches):** Implicitly related to Principle #4 (Threshold/Non-linearity) and Principle #3 (Relevance). If future people are vastly richer, a marginal dollar may do less good, justifying some discount. Your Case (5) suggests you intuitively require larger future benefits, potentially encompassing this.
  *   **Positional Effect:** Explicitly Principle #2 and an aspect of Principle #3 (value depends on the state of the world at time T, which is positional).

  **Residual Pure Time Preference?**
  *   **For Core Welfare (Pain/Pleasure/Basic Needs):** Your verdicts (1, 3-with-certainty, 4) suggest **effectively zero pure time preference**. Calendar distance alone doesn't diminish the value of avoiding identical pain or securing identical basic welfare under certainty.
  *   **For Consumption/Positional Goods:** Principle #2 shows **significant positive pure time preference** – you *do* intrinsically prefer the Vienna weekend now.
  *   **Is it Defensible?** Zero pure time preference for core welfare is arguably *more* defensible (Parfit, Ramsey) – why *should* mere calendar location devalue suffering or flourishing? Impatience for consumption is a psychological fact but harder to defend ethically as a basis for *social* policy affecting core welfare across generations. The economists' "failure of imagination" critique applies weakly to core welfare but strongly to our inability to fully internalize future consumption desires or positional losses.

  **Verdicts on New Cases:**

  1.  **Policy Affecting Future Population Size:**
      *   *Verdict:* Value hinges on Principles #3 (Probability of Existence - how certain are the numbers?), #4 (Scale - does creating more lives with positive welfare outweigh smaller present benefits? Your Case 5 suggests "yes" if the increase is large enough), and #1 (Core Welfare per person). The *existence* of the future people is part of the benefit. A high hurdle rate (#4) applies – the future population gain must be substantial to offset present costs/foregone benefits. The positional effect (#2) might make creating future lives in a potentially worse era seem less valuable.

  2.  **300-Year Bequest to a Persistent Institution:**
      *   *Verdict:* Dominated by Principle #3 (Exogenous Risk). The discount rate is primarily the *probability* the institution fails, the bequest is misused, or its purpose becomes irrelevant over 300 years. Pure time preference (#1, #2) is minimal – the institution doesn't "experience" the time. Value depends on the guaranteed persistence *and* continued relevance of its mission (a form of #3). A very high risk-adjusted discount rate is likely justified.

  3.  **Discounting Within a Life vs. Across Generations:**
      *   *Verdict:* Your framework sees a crucial difference:
          *   **Within a Life:** Principle #6 (Experiential Time) applies, alongside #2 (Impatience for consumption within the life) and #1 (Core welfare with minimal pure discount). The continuous subjective timeline matters.
          *   **Across Generations:** Principle #6 is irrelevant – there is no shared experiential timeline. Principles #3 (Exogenous Risk - dominant), #4 (Threshold/Scale), and #1 (Core Welfare per person) govern. Position (#2) and the asymmetry in #5 might also play a role. Calendar time is the necessary metric, heavily loaded with risk.

  **Implications for the Committee:**

  *   **Forget the Single Number.** Your intuitions decisively reject a single, constant social discount rate as the right object. It's a category error.
  *   **Adopt a Multi-Factor Framework.** The committee needs a discounting *model* incorporating:
      1.  **Risk Components:** Explicitly estimated probabilities for beneficiary existence (demographic models), institutional persistence, project failure, technological/social obsolescence, catastrophic risk (like Case 7). This is the largest factor for 50-80 year projects and dominant for centuries.
      2.  **Opportunity Cost of Capital:** The finance/economics component (e.g., Treasury bond yield + project risk premium).
      3.  **Declining Marginal Utility:** Estimate future income growth and the elasticity of marginal utility (how much less valuable is $1 to richer people?).
      4.  **Benefit Type Differentiation:** Apply lower (near-zero) discount rates to *core welfare impacts* (health, safety, basic needs) versus higher rates for *consumptive or positional benefits*. Acknowledge the Harm-Benefit Asymmetry (#5).
      5.  **Scale Sensitivity:** Recognize that very large future benefits (especially existential risk reduction, Case 7) or large future populations (Case 5 variant) might overcome high hurdle rates implied by 1-3.
  *   **Transparency is Key:** The committee should present the discounting *components* and their justifications, not just a final number. This makes the ethical and empirical assumptions clear.
  *   **The Philosopher's Contribution:** Argue forcefully for differentiating benefit types (#4), incorporating catastrophic risk (#3), recognizing scale sensitivity (#4), and resisting high pure time preference for core welfare impacts across generations (#1). Highlight the ethical indefensibility of discounting future suffering *merely* because it's future, once existence and delivery are assured.

  Your gut verdicts reveal a sophisticated, ethically nuanced, and empirically grounded aversion to simplistic discounting. They point towards a framework far more complex, but ultimately more honest and defensible, than the single number the committee likely seeks. Your role is to guide them towards this necessary complexity.
