  ### Trading Game Setup: The Money Pump Experience

  **Objective:** Force students to confront the vulnerability of intransitive preferences through experiential learning. Half play as "Traders" (with cyclical preferences), half as "Exploiters" (pumpers), then swap roles. Key wrinkles:  
  1. **Transaction fee:** Each trade costs Traders 1 chip (paid to Exploiters).  
  2. **Uncertain endpoint:** After each trade round, a die roll (1 in 6 chance) ends the game.  

  ---

  ### **Game Setup**  
  **Players:**  
  - **7 Traders:** Start with **good A** + **10 chips**.  
  - **7 Exploiters:** Start with **goods B and C** + **0 chips**.  

  **Goods & Preferences:**  
  - Three goods: **A, B, C**.  
  - *Trader preferences:* **B ≻ A**, **C ≻ B**, **A ≻ C** (strictly intransitive).  
  - *Trader rule:* "You value chips and strictly prefer better goods. You’ll accept any trade giving you a preferred good for ≤1 chip cost."  
  - *Exploiter goal:* Maximize chips extracted.  

  **Materials:**  
  - **Poker chips:** Represent currency (≥100 chips total).  
  - **Index cards:** Labeled **A** (×7), **B** (×7), **C** (×7).  
  - **Die:** D6 (game ends on roll of 1).  

  ---

  ### **Trading Protocol**  
  1. **Pairing:** Each Exploiter paired with one Trader.  
  2. **Round Structure (repeat until game ends):**  
     - **Step 1:** Exploiter offers a trade:  
       - If Trader has **A**, offer **B** for **A + 1 chip**.  
       - If Trader has **B**, offer **C** for **B + 1 chip**.  
       - If Trader has **C**, offer **A** for **C + 1 chip**.  
     - **Step 2:** Trader accepts or refuses.  
       - *If accept:* Swap goods; Trader gives 1 chip to Exploiter.  
       - *If refuse:* No action.  
     - **Step 3:** Roll die. If **1**, game ends immediately.  
  3. **Game End:** After die roll = 1, or after 10 rounds max.  

  ---

  ### **Timeline (75 min)**  
  1. **Intro (5 min):**  
     - Assign roles (Traders/Exploiters), distribute goods/chips.  
     - Clarify rules: "Traders, you *always* prefer swapping for the 'next' good if it costs ≤1 chip. Exploiters, you *always* offer the next swap."  
  2. **Round 1: Traders vs. Exploiters (20 min):**  
     - Run 5-8 rounds (1-2 min/round).  
     - After each round, roll die publicly.  
  3. **Role Swap (5 min):**  
     - Traders become Exploiters (start with B+C + chips they earned).  
     - Exploiters become Traders (start with A + 10 chips).  
  4. **Round 2: Swapped Roles (20 min):**  
     - Repeat protocol.  
  5. **Debrief (25 min):** Structured discussion below.  

  ---

  ### **Debrief: Mapping Game to Theory**  
  1. **Myopic Trading (The Drain):**  
     - *In-game:* Traders who always accept trades.  
     - *Observe:* "How many chips did pumped Traders lose? Who ended back at A but poorer?"  
     - *Map to theory:* Textbook money pump—each trade seems beneficial, but cycles drain chips. **Force:** "You *felt* the drain even if you saw it coming."  

  2. **Refusing Trades (The Forgone Gain):**  
     - *In-game:* Traders who refused trades to avoid cycles.  
     - *Observe:* "If the game ended after Round 1, what did refusers miss? (e.g., B ≻ A)."  
     - *Map to theory:* Die roll = uncertainty about future. Refusing all trades avoids pumping but forgoes gains that *would have been real* if game ended early.  

  3. **Commitment/Backward Induction (The Escape):**  
     - *In-game:* Traders who accepted 1 trade then stopped.  
     - *Observe:* "Did you get stuck with B/C? Were you tempted to trade again?"  
     - *Map to theory:* Students invent strategies:  
       - *Commitment:* "I’ll only trade once!" (but hard to stick to when C ≻ B is offered).  
       - *Backward induction:* "If I take B, I’ll lose more later—so I refuse now."  

  4. **Transaction Fee Wrinkle (Key Conclusion):**  
     - *Observe:* "Could a Trader with high chip reserves avoid ruin? What if fees were 5 chips? Would *any* trades happen?"  
     - *Map to theory:* Fee exposes the **cost-relative condition**:  
       - The pump only works if gains from each trade > fee.  
       - Real-world implication: Transitivity isn’t needed; we need **no cycles profitable at the prevailing spread**.  
       - *Uncomfortable truth:* "With high transaction costs, intransitivity is harmless. The pump argues against *cheap* cycles, not all cycles."  

  ---

  ### **Predictable Problems & Limitations**  
  **What Will Go Wrong:**  
  - **Traders "cheat" preferences:** Some may refuse trades against their rules ("B ≻ A feels wrong!"). *Mitigation:* Gently enforce: "You agreed B ≻ A—would you pay 1 chip for it *now*?"  
  - **Exploiters under-pump:** Novice Exploiters may stop after 1-2 trades. *Mitigation:* Remind: "Your goal is max chips—keep pumping!"  
  - **Game ends too early:** If die rolls 1 in Round 1, Traders miss the cycle. *Use:* "What *would* have happened? Discuss hypotheticals."  

  **Unstageable Real Dispute:**  
  - **"Parlor trick" defense:** Students may say, "No one would trade C for A after being pumped!"  
    - *Say aloud:* "But *why*? It requires **self-binding to past/future decisions** (commitment) or **strategic foresight** (backward induction). The pump argues that *without* these, naively rational choices lose money. Is your objection proof of commitment, or denial?"  

  ---

  This design forces students to *live* the pump, exposes fee/uncertainty wrinkles, and primes deep debate. The key is leaning into the chaos: Let them invent "solutions" mid-game, then dissect them in debrief.
