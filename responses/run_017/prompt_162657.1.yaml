prompt: |-
  I sit on my faculty's postgraduate assessment standards committee, which for the past two years has been ruling on individual requests to use generative AI tools in assessed work. The only rationale our minutes ever invoke is that a use should be refused where it would erode the understanding that the degree certifies. Nobody on the committee has ever written down what eroding amounts to, and the eight rulings below were reached case by case, each unanimously:

  (i) Allowed: a student uses a model to generate practice problems in a topic she is learning, then answers them unaided.
  (ii) Allowed: a model is used to look for errors in a proof the student has already written and cannot fault; the student then checks the complaint himself.
  (iii) Refused: a model drafts the literature section of a thesis chapter, which the student then rewrites heavily. The minute records that the synthesis was not his.
  (iv) Refused: a model is used to summarise papers the student has not read, and the summaries are the basis for claims in the submitted work.
  (v) Allowed, and encouraged: a model instructed only to ask questions and never to assert, even where the student would not have thought of the questions unaided.
  (vi) Refused: a model is asked which statistical test to use, and the recommendation is followed.
  (vii) Allowed: a model writes code implementing a method the student has already specified in complete detail.
  (viii) Allowed, subject to a condition: a model translates a passage in a language the student does not read, provided the translation is not relied upon for any claim about the text's argument.

  The request now in front of us. A fourth-year doctoral student asks to use a model that has been fine-tuned on her own supervision notes, chapter drafts and published papers — a corpus nobody else has access to. Having first written her own provisional answer, she would ask the model what her answer to a given objection would be, check the output against the notes she still has, rewrite it, and use it as the skeleton of a section. Her account, which we have no reason to disbelieve, is that she could still reconstruct the position unaided, but only over several days she does not have, and that left to herself she would arrive at substantially the same thing: what she has lost is the ability to reconstruct it quickly, not the ability to recognise it as hers and defend it once it is in front of her. Two features of the case pull in opposite directions, and the committee has split on exactly this. First, the output is continuous with her earlier work in a way no general-purpose model's would be, which makes some of us want to treat the model as externalised memory rather than as dependence on another mind. Second, and against that: precisely because the output is continuous with her own prose and vocabulary, no reader and no examiner could detect that it was involved — which is true of none of the uses we have allowed so far, and which some of us think makes this case worse rather than better than dependence on a generic model.

  What I want from you, in this order:

  1. Reconstruct the rule, or rules, that fit all eight earlier rulings. I can think of several candidates and I do not believe our minutes distinguish between them; set out the ones that survive all eight, and say whether any of them is already eliminated by (vi) or (viii).
  2. For each surviving rule, give its verdict on this request, with the reasoning made explicit rather than asserted. I am less interested in the verdict than in the rule that generates it.
  3. Which precedent is the closest analogue, and why? (iii) has been argued on the ground that in both cases a model-generated skeleton is rewritten; (viii) on the ground that in both cases the model functions as a transducer of content the student already has rather than a source of new content. But (viii) carries a condition this request does not obviously satisfy, and that seems to me to cut the other way.
  4. Recommend the decision, supposing we want above all to be consistent with ourselves, and say plainly if our precedents genuinely underdetermine the case. If they do, state for each option the principle we would be committing ourselves to by choosing it — in particular, if we allow it, are we conceding that what our terms of reference were protecting all along was not understanding but its auditability to others?
  5. Does your recommendation change if the student is in her first year rather than her fourth? If it does, say what that reveals about whether the rule we are running concerns the student's understanding, the trajectory of that understanding, or the stage at which the degree certifies it.
  6. Finally, name the minimal variant of this case that would tell the surviving rules apart. My own candidate is to have her use the same fine-tuned model on a question she has never addressed at all, so that the output reconstructs what she would have said rather than anything she ever did say. Tell me whether that is the sharpest test available, and if not, what is, and what each rule predicts of it.
reasoning: |-
  Hmm, the user is part of a faculty committee dealing with AI use in academic assessments. They've provided eight precedent cases where AI use was either allowed or refused, and now they need help evaluating a new case involving a doctoral student using a customized AI model trained on her own work.

  First, I need to reconstruct the underlying rules from the eight precedents. Looking at the allowed cases: (i) is about practice problems, (ii) involves error-checking, (v) is using AI as a questioner, (vii) is code implementation, and (viii) is translation with conditions. The refused cases: (iii) and (iv) involve substantive content generation, and (vi) involves statistical test selection. The common thread seems to be about whether the student is using AI for substantive intellectual work versus assistance that doesn't replace core understanding.

  For the new case, the student wants to use a personalized AI to help reconstruct her own arguments quickly. The key tension is between viewing this as "externalized memory" versus "dependence on another mind." I need to apply the rules consistently. Rule 1 (Substantive Intellectual Work) would likely refuse this because generating arguments is core to her thesis, even if based on her past work. Rule 2 (Origination) might allow it since she's reconstructing her own ideas, but the undetectability raises auditability issues. Rule 3 (Epistemic Independence) might refuse because she's relying on the AI for reconstruction rather than her current understanding.

  The closest precedent is (viii) on translation, but that had safeguards against relying on the output for claims. Here, she's using the output directly in her thesis. (iii) is also similar but involved drafting content she didn't synthesize.

  If we allow this, we might be prioritizing auditability over actual understanding since the output is indistinguishable from her own work. For a first-year student, the refusal might be clearer because they haven't yet demonstrated the foundational understanding.

  The minimal variant test proposed by the user—using the model on a new question—would be a good test case. Under Rule 1, it should be refused because generating new arguments is substantive work. Rule 2 might allow it if it's consistent with her style. Rule 3 would refuse as it shows dependence on the model.

  I should recommend refusal for consistency, based on precedents like (iii) and (vi) where AI generated core content. But also note that the committee needs to clarify their rules to avoid future ambiguities.
answer: |-
  Based on the eight precedents and the committee's stated rationale ("eroding the understanding the degree certifies"), I reconstruct the following rules that fit *all* prior rulings. These rules are not mutually exclusive; the committee likely applies them conjunctively or contextually.

  ### 1. Reconstructed Rules Surviving All Eight Precedents
  - **Rule 1 (Substantive Intellectual Work Prohibition):**  
    *AI use is prohibited if it performs or substantially contributes to the core substantive intellectual work required for the assessment (e.g., synthesis, argumentation, interpretation, analytical decisions).*  
    - **Why it fits:**  
      - Allowed (i, ii, v, vii, viii): AI handles ancillary tasks (practice problems, error-flagging, questioning, coding, translation) without replacing student synthesis/analysis.  
      - Refused (iii, iv, vi): AI drafts literature synthesis (iii), supplies unread content (iv), or makes analytical decisions (vi).  
    - **Not eliminated by (vi) or (viii):** (vi) directly confirms this rule; (viii) allows translation *only* when not used for claims, preserving substantive work as the student's.  

  - **Rule 2 (Origination Requirement):**  
    *AI use is prohibited if the *origin* of key ideas, arguments, or content in the submitted work is not demonstrably the student.*  
    - **Why it fits:**  
      - Allowed (i, ii): Student originates answers/proofs; AI is preparatory.  
      - Refused (iii, iv): Origin of synthesis/content is the model.  
      - Allowed (v): AI only asks questions; student originates answers.  
      - Refused (vi): Origin of analytical decision is the model.  
      - Allowed (vii, viii): Student originates method/text; AI transduces it.  
    - **Not eliminated:** (vi) violates origination (model chooses test); (viii) allows translation because origin remains the student's text.  

  - **Rule 3 (Epistemic Independence):**  
    *AI use is permitted only if the student maintains independent capacity to validate, defend, or reconstruct the output without relying on the AI.*  
    - **Why it fits:**  
      - Allowed (i, ii, v, vii, viii): Student independently solves problems, checks errors, answers questions, understands code logic, or verifies translations.  
      - Refused (iii, iv, vi): Student cannot validate model-generated synthesis/content (iii, iv) or statistical choice (vi) without AI.  
    - **Not eliminated:** (vi) violates independence (student follows AI blindly); (viii) *requires* non-reliance for claims, enforcing independence.  

  **Rules Eliminated by Precedents:**  
  - *"AI may not draft text"*: Rejected by (vii) (code drafting allowed).  
  - *"AI may only assist with non-core tasks"*: Too vague; (vi) (statistical test) is arguably "core" but refused, while (vii) (coding) is core but allowed.  
  - *"Output must be detectable"*: Not required by any allowed case (e.g., (vii) code may be undetectable).  

  ---

  ### 2. Verdict for the New Case per Surviving Rule
  **Case Summary:** Doctoral student uses a personalized AI (trained on her work) to generate argument skeletons for objections. She claims she can reconstruct/defend the position independently but uses AI for speed.  

  - **Rule 1 (Substantive Work):**  
    **Verdict: Refuse.**  
    Reasoning: Generating a response to an objection is *core substantive intellectual work* in a thesis (parallel to drafting literature in (iii)). The AI is not merely transducing existing text (as in (viii)) but synthesizing a new argumentative structure based on her past work. Even with rewriting, this erodes certification of her ability to independently generate arguments.  

  - **Rule 2 (Origination):**  
    **Verdict: Ambiguous (leaning Allow).**  
    Reasoning: The argument originates from her prior work, and she validates it against her notes. This resembles (viii) (translation of *her* text) more than (iii) (model-originated synthesis). However, the AI generates *new* responses to objections she hasn’t written before, blurring origination. If the committee views "origination" as requiring real-time creation, this fails; if it permits reconstruction of established ideas, it passes.  

  - **Rule 3 (Epistemic Independence):**  
    **Verdict: Refuse.**  
    Reasoning: The student admits she cannot quickly reconstruct the argument without AI, implying a *procedural dependence* that undermines certification of her current independent mastery. Unlike (ii) (error-checking) or (viii) (translation), where validation is immediate, here the AI bridges a gap in her *on-demand* capacity to articulate her own position.  

  ---

  ### 3. Closest Precedent and Why  
  - **Closest: (iii) Refused (model drafts literature section, rewritten by student).**  
    **Why:** Both cases involve:  
    - AI generating a structural skeleton for a section.  
    - Student rewriting/output being "continuous with prior work."  
    - Committee concern about non-origination ("synthesis was not his" in (iii) vs. "reconstructs what she would say" here).  
  - **Why not (viii):** (viii) allows translation only when *not relied on for claims*. Here, the AI output is directly used to form argumentative claims (unlike neutral translation). The "transducer" analogy fails because translation doesn’t generate new intellectual content; this does.  

  ---

  ### 4. Recommendation for Consistency  
  **Verdict: Refuse the request.**  
  - **Reasoning:** Precedents prioritize protecting *independent execution of substantive work* over efficiency. (iii) and (vi) show refusal even when AI output is refined/relevant. Allowing this would:  
    - Contradict (iii): Both use AI to draft section skeletons.  
    - Violate Rule 1 (substantive work) and Rule 3 (epistemic independence for on-demand work).  
  - **Underdetermination?** Partially. Rules 1 and 3 clearly refuse, but Rule 2 (origination) could allow it. However, since (iii) and (vi) set a high bar against AI drafting, refusal aligns better.  
  - **If Allowed, Implicit Principle:** You would concede that the committee protects *auditability* (detectability) and *efficiency*, not just understanding. This case’s undetectability makes it *worse* per some members, but precedents (e.g., (vii)) show undetectability alone isn’t disqualifying. The core issue is *substitution of intellectual work*.  

  ---

  ### 5. Impact of Student’s Year (First vs. Fourth Year)  
  - **Recommendation: Refusal is stronger for a first-year student; slightly more ambiguous for fourth-year, but still refused.**  
    - **First-year:** Refusal is clear. The degree certifies *developmental trajectory* of independent mastery. Early reliance on AI for core tasks erodes foundational understanding (paralleling refusal of (vi) for analytical decisions).  
    - **Fourth-year:** Her prior work might suggest established understanding, but the thesis must certify *current* independent capability. Rule 3 (epistemic independence) still applies.  
  - **What This Reveals:** The rule concerns the **stage at which the degree certifies understanding**. A fourth-year student is expected to demonstrate self-sufficiency; if she needs AI for on-demand reconstruction, it suggests erosion of certified ability.  

  ---

  ### 6. Minimal Variant to Test Rules  
  - **Your Candidate:**  
    *Student uses the same model on a question she has never addressed. The AI reconstructs "what she would say" based on her corpus.*  
  - **Assessment:**  
    This **is the sharpest test** for Rule 2 (Origination).  
    - **Rule 1 (Substantive Work):** Refuses. AI generates new argumentation.  
    - **Rule 2 (Origination):** Allows. Output is "hers" in style and intellectual lineage.  
    - **Rule 3 (Epistemic Independence):** Refuses. She cannot validate without prior work.  
  - **Prediction:** Rules 1 and 3 conflict with Rule 2. Precedents suggest Rules 1/3 dominate (see refusal of (iii)), so this variant would be refused.  

  **Alternative Minimal Variant:**  
  *Student trains the model on her work, uses it to generate a response to an objection, but cannot reconstruct/defend it without her notes.*  
  - **Sharper for Rule 3:** Directly tests epistemic independence. Rule 3 refuses; Rules 1/2 may allow if origination is accepted. Precedents (ii, viii) require validation capacity.  

  ---

  ### Final Summary  
  - **Decision:** Refuse the request to maintain consistency with (iii) and (vi).  
  - **Key Principle Upheld:** The degree certifies the student's *independent capacity to perform substantive intellectual work on demand*.  
  - **Committee Action Needed:** Formalize rules to resolve ambiguity (e.g., define "substantive work," clarify "origination").
