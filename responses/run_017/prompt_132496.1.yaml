  The decomposition will need to show how these factors interact multiplicatively, with peer disagreement and calibration study being the most sensitive points. I'll need to balance the strength of first-order evidence against the accumulated higher-order pressures while accounting for Mara's known bias.

  For the output, I'll prepare both the requested table and JSON structure, making sure to highlight where the user's 0.55 credence might be most vulnerable - likely in underestimating how much explained disagreement still carries evidential weight.
