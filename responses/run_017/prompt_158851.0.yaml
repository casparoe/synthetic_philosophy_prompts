prompt: |-
  I am one of three standing members of a regional Substitute Judgment Panel. We are an advisory body, not a court: we meet weekly, we see about sixty cases a year, and we produce a one-page advisory that the attending physician must either follow or explain departing from in the notes. The decisions are real ones — whether to treat or discharge someone over a present objection, whether to feed, whether to restrain — and the advisory has to be defensible afterward to a family and to an ombudsman, which in practice means that each step of our reasoning has to leave behind something recordable, a sentence we can put in the file.

  Our governing standard is an idealized-preference standard: the thing to be respected is not what the person currently wants but what they would want under better conditions — better informed, less distorted by fear or pain or depression, more internally coherent among the values they already hold. (This is the sort of standard that gets discussed under the heading of coherent extrapolated volition, though our statute does not use that phrase.) I want a procedure, not an essay: a decision procedure my panel can run on a real case, in the order the steps should be run, with what counts as a sufficient answer at each step, an explicit stop rule, and — this matters more than anything else — explicit marking of the points at which the procedure stops and hands the question to a human judgment that I can then be held accountable for.

  The procedure has to survive five ways we have already managed to break it:

  **Order of idealization.** Correcting a patient's beliefs routinely destroys the very desire we set out to respect: a man refuses surgery partly because he falsely believes he will be a permanent burden, and once we correct the belief the refusal evaporates — which is fine, except that the same operation, applied to desires rather than beliefs, just installs the panel's own preferences under the name of the patient's. Which dimension gets idealized first — belief, desire, or the person's sense of who she is — decides the outcome, and I need that order fixed by the procedure rather than chosen case by case.

  **Dossier gerrymandering.** Because the panel assembles the record of a person's earlier values, we can make the extrapolation come out almost any way by choosing which of their past statements count as really theirs — a letter written at sixty against a remark made last week. I need a rule that fixes the admissible data before the extrapolation step, and a rule for what to do when the dossier is thin or supplied entirely by an interested party.

  **Convergence failure.** Sometimes a small change in how much idealization we apply flips the recommendation. Averaging across idealizations is not something we could ever defend to a family, so I need to know what the procedure does instead, and whether the answer differs when the instability comes from thin evidence rather than from the idealization itself.

  **The identity cutoff.** Our idealizations are not neutral. They tend to strip out commitments that look to us like defects of information or nerve — a religious conviction, an ascetic discipline, a political loyalty — and to leave in the ones we already approve of. At some point the more idealized person is no longer recognizably the same agent, and deferring to her is no longer deferring to the patient. Where in the procedure is that tested, and who decides?

  **Repudiation.** Sometimes the idealized person would reject the apparatus entirely: fully informed and fully coherent, she would say that what matters to her is that she decides now, not that we get it right. Does the procedure defer to that? Note that deferring there can look like the procedure dissolving at exactly the moment it was about to be useful.

  Apply the procedure to three cases.

  1. A seventy-eight-year-old man with mild fluctuating vascular dementia and untreated depression refuses a hip replacement that would end intractable pain; he says he has had his innings. A decade ago he wrote to his brother that he would never want to be kept going out of stubbornness. He also has a sixty-year self-conception as a self-reliant stoic, and uses it to describe this refusal. Clinicians say the depression is treatable and the refusal would probably dissolve with treatment.

  2. A twenty-nine-year-old woman with severe anorexia refuses nasogastric feeding. She is informed, consistent over months, and describes the discipline as her central achievement rather than as a symptom; she says she values thinness above continued life. I am personally inclined to defer to her, and I doubt a forty-five-minute procedure should be in the business of coercing someone over a competent, stable, informed refusal. If your procedure overrides her anyway, I want to see it do so, and I want to see which step does the work rather than which of my sympathies.

  3. A fifty-four-year-old man refuses a transfusion that would almost certainly save his life, on the basis of a religious prohibition he has held, stably and with full information, since adolescence. There is no cognitive impairment. The dossier comes almost entirely from representatives of his community; his estranged son, who would inherit, disputes it and says his father was privately ambivalent.

  Close by telling me what the procedure cannot do: whether it can say anything about whether an idealized-preference standard is the right standard for us to be using at all, whether it can settle who counts as the patient, and which of its steps are really judgment calls that we have agreed to record as findings. About 1,000 to 1,400 words, procedure first, no survey of the literature.
reasoning: |-
  We are designing a decision procedure for the Substitute Judgment Panel. The procedure must address the five failure modes and be applicable to the three cases. The governing standard is an idealized-preference standard: what the person would want under conditions of being better informed, less distorted by fear/pain/depression, and more internally coherent among their existing values.

  The procedure has the following steps, in order, with explicit stop rules and points where human judgment is required (marked as **JUDGMENT**). The steps are:

  1. **Determine Admissible Evidence**: Fix the set of admissible evidence before idealization to prevent gerrymandering.
  2. **Resolve Identity Cutoff**: Check whether the idealization would change the person's identity so much that we are no longer respecting the patient.
  3. **Correct Beliefs**: Correct false beliefs and update the patient's current preference accordingly.
  4. **Correct Distortions**: Correct for distortions (like depression, pain, fear) that affect desires but are not belief-based.
  5. **Achieve Coherence**: Resolve conflicts among the patient's values to form a coherent set of values.
  6. **Check Repudiation**: Check if the idealized person would repudiate the entire process.
  7. **Formulate Recommendation**: State the idealized preference and the recommendation.

  At each step, if we cannot proceed (e.g., insufficient data, unresolvable conflict), we stop and the panel makes a judgment call that is recorded.

  Now, step by step:

  **Step 1: Determine Admissible Evidence**
     - **Purpose**: To avoid dossier gerrymandering by fixing the data set before idealization.
     - **Rule**: Admissible evidence includes:
          a. Any written or recorded statement by the patient, from any time, that is about values or preferences (not about factual beliefs unless they are value-laden).
          b. Oral statements reported by two independent sources (if not recorded by the panel) or by one source if contemporaneously recorded (e.g., in medical notes).
          c. Evidence from the patient's actions that clearly demonstrate a value (e.g., joining an organization, consistent lifestyle choices).
          d. Exclude: Statements made under duress, under the influence of substances (unless that is the patient's typical state), or when the patient was known to be cognitively impaired (unless the impairment is part of the patient's identity and not a distortion).
     - **Thin Dossier Rule**: If the dossier is too thin (fewer than three independent pieces of evidence about values) or is entirely supplied by an interested party (e.g., only from the estranged son in Case 3), then the panel must note the insufficiency and proceed with the available evidence but flag the uncertainty. If the dossier is entirely from one interested party and there is conflicting evidence, the panel must try to obtain more evidence (if time allows) or, if not, note the conflict and proceed with the patient's current expressed preference as the default (unless Step 3 or 4 overrides it). 
     - **Stop Rule**: If no admissible evidence exists, the procedure stops and the panel uses the patient's current expressed preference. **JUDGMENT**: The panel must decide what counts as independent and what constitutes an interested party. Also, when the dossier is thin, the panel must decide if it is sufficient to proceed.

  **Step 2: Resolve Identity Cutoff**
     - **Purpose**: To ensure that the idealization does not strip away core aspects of the patient's identity.
     - **Rule**: The panel must identify the patient's core identity traits. These are traits that the patient has consistently held (over at least five years) and that they themselves consider defining (e.g., "I am a stoic", "I am a devout X"). 
     - **Test**: The idealization process (in Steps 3-5) must not remove or alter these core identity traits. If the idealization would require changing a core identity trait, then the idealization stops at the point before that change. The panel must then work with the values as they are, without altering the core identity.
     - **Stop Rule**: If the panel cannot identify any core identity traits (or if the patient has none), skip this step. If a core identity trait is identified, then in subsequent steps, if an idealization (e.g., in Step 4) would alter that trait, the panel must not apply that idealization to that trait. **JUDGMENT**: The panel must decide what counts as a core identity trait and whether a particular idealization would alter it.

  **Step 3: Correct Beliefs**
     - **Purpose**: To update the patient's current preference by correcting false factual beliefs.
     - **Rule**: Identify any false belief that is material to the decision (i.e., if corrected, it would change the preference). Correct the belief using the best available medical/scientific evidence. Update the patient's preference as if they held the correct belief.
     - **Stop Rule**: If the patient's preference changes as a result of this correction, then use the updated preference for the next steps. If not, proceed with the original. If there are multiple beliefs, correct them one by one (order does not matter because they are independent). **JUDGMENT**: The panel must decide what counts as a material false belief and what the correct belief should be (based on expert input).

  **Step 4: Correct Distortions**
     - **Purpose**: To correct for distortions (e.g., depression, pain, fear) that are not belief-based and that affect desires.
     - **Rule**: Identify any distortion that is temporary and treatable (e.g., depression, acute pain, fear from misinformation) and that is affecting the current preference. Then, simulate the patient's preference without the distortion. This simulation is based on:
          a. The patient's past preferences in similar situations when not distorted.
          b. The patient's core values (from Step 2) and how they would apply without the distortion.
     - **Note**: We do not correct for distortions that are chronic and part of the patient's identity (e.g., a lifelong anxiety disorder that the patient has always had and that is part of their personality). Also, we do not correct for distortions that are not treatable (e.g., permanent brain damage that alters personality).
     - **Stop Rule**: If the distortion is treatable and temporary, and if there is evidence of how the patient would decide without it, then update the preference. If not, then leave the preference as is. **JUDGMENT**: The panel must decide whether a distortion is temporary and treatable, and how the patient would decide without it.

  **Step 5: Achieve Coherence**
     - **Purpose**: To resolve conflicts among the patient's values to form a coherent set of values.
     - **Rule**: The panel must list the patient's relevant values (from the admissible evidence) and identify conflicts. Then, they must form a coherent set by:
          a. Giving priority to the most recent expressions of value (if there is a trend) OR
          b. Giving priority to the value that the patient has consistently given more weight to (if there is a hierarchy) OR
          c. If no hierarchy exists, then the value that is more central to the core identity (from Step 2) prevails.
     - **Stop Rule**: If the values are already coherent, proceed. If a conflict cannot be resolved by (a), (b), or (c), then the panel must note the conflict and use the patient's current expressed preference (as updated in Steps 3 and 4) as the default. **JUDGMENT**: The panel must decide the hierarchy and centrality of values.

  **Step 6: Check Repudiation**
     - **Purpose**: To check if the idealized person would repudiate the entire process.
     - **Rule**: Based on the patient's core identity and values (from Steps 2 and 5), ask: would the patient, under idealized conditions, reject the idea that we should be making this decision for them? Would they say that their actual current preference (even if distorted) should be respected?
     - **Test**: If the patient has expressed a strong value for self-determination (e.g., "I should be the one to decide, even if I am wrong") and that value is central to their identity, then we must defer to their current preference (if they are currently objecting) or to their prior expressed preference (if they are not currently able). This is because the idealized person would not want the procedure to override their current self.
     - **Stop Rule**: If repudiation is found, then the procedure stops and the panel recommends following the patient's current expressed preference (or if they are not currently able, the last known preference). If not, proceed. **JUDGMENT**: The panel must decide whether the idealized person would repudiate.

  **Step 7: Formulate Recommendation**
     - **Purpose**: To state the recommendation.
     - **Rule**: The idealized preference (from Step 5, or if repudiation in Step 6 then the current preference) is the one to be respected. The panel writes a one-page advisory stating that preference and the key steps that led to it.

  **Addressing the Five Failure Modes**:

  1. **Order of idealization**: Fixed as: Step 1 (evidence), Step 2 (identity), Step 3 (beliefs), Step 4 (distortions), Step 5 (coherence). Identity comes before distortions to prevent stripping core identity.

  2. **Dossier gerrymandering**: Step 1 fixes the admissible evidence before any idealization.

  3. **Convergence failure**: The procedure does not average. Instead, it uses a fixed order. If at any step the outcome is unstable (e.g., in Step 4, if removing a distortion leads to an unclear preference), then the panel uses the preference from the previous step and notes the uncertainty. The answer may differ if the instability is from thin evidence: then the panel uses the patient's current preference (or last known) as a default.

  4. **Identity cutoff**: Step 2 explicitly addresses this and protects core identity traits.

  5. **Repudiation**: Step 6 explicitly checks for repudiation and, if found, defers to the patient's current preference.

  **Application to Cases**:

  **Case 1 (78-year-old man refusing hip replacement)**:

  - Step 1: Admissible evidence: the letter to his brother (written) and his current self-conception as a stoic (oral, but consistent and from him). Both admissible.
  - Step 2: Core identity: his self-conception as a self-reliant stoic (held for 60 years). This is protected.
  - Step 3: He has a false belief? The refusal is partly due to believing he would be a permanent burden. Correct that belief: he would not be a burden. If the refusal then evaporates, we update the preference to accept surgery. But note: he also says he has had his innings. So even after correction, he might still refuse. We update the preference to remove the burden reason, but if he still refuses (for stoic reasons) then we proceed.
  - Step 4: He has untreated depression. It is treatable and temporary. Without depression, would he refuse? His stoicism is a core identity, so we must not remove it. But depression might amplify the hopelessness. Without depression, he might still refuse because of his stoic identity (which we protect). However, the letter to his brother (without depression) suggests he would not want to be kept going out of stubbornness. This is consistent with stoicism. So without depression, he might accept the surgery to relieve pain and not be stubborn. But note: the letter says he doesn't want to be kept going, but this surgery is not about keeping him going but about relieving pain. So the letter may not directly apply. The panel must judge: without depression, would the stoic value lead him to endure the pain (and refuse surgery) or to accept surgery to remain independent? This is a judgment call. Given the core identity of stoicism and the letter, it is ambiguous. 
  - Step 5: Coherence: He values not being a burden (corrected in Step 3) and stoicism. Without depression, these are coherent: he might accept surgery to be independent and not a burden. But note: in his current state, he says he has had his innings. This might be a value of not prolonging life unnecessarily. The panel must decide if this is a core value. Since it is recent and possibly influenced by depression, it might not be. The letter is older and consistent with stoicism. We might give priority to the letter as it is a clear expression and not during depression.
  - Step 6: Would the idealized person repudiate? Probably not, because the process is trying to respect his values.
  - Step 7: The panel might recommend the surgery because without the false belief and without depression, he would accept it to relieve pain and maintain independence, consistent with his stoicism and the letter. But note: the current refusal is based on having had his innings, which might be a separate value. The panel must decide if that is a core value. If not, then override.

  However, the clinicians say the refusal would dissolve with depression treatment. So Step 4 might be key: without depression, he would accept. Then the recommendation is to treat the depression and then reconsider. But the procedure says: we are to decide now. So we simulate without depression. Given the letter and the core identity, without depression he would likely accept the surgery. So we recommend overriding the refusal and proceeding with surgery (and treating depression).

  **Case 2 (29-year-old woman with anorexia)**:

  - Step 1: Admissible evidence: her current statements (over months) that she values thinness above life. Also, if there is evidence of her values before anorexia, but if she has had anorexia since adolescence, then the anorexia is chronic and may be part of her identity.
  - Step 2: Core identity: She describes the discipline as her central achievement. This has been stable for years? Then it is core identity. We cannot strip it away.
  - Step 3: Are there false beliefs? She is informed. No correction needed.
  - Step 4: Distortions? Anorexia is a mental illness, but it is chronic and has been present since adolescence. If it is part of her identity, we do not correct for it. However, if it is a distortion that is treatable and temporary (but note: she has had it for years), then we might. This is a judgment. The procedure says: if the distortion is chronic and part of identity, we do not correct. Here, if the anorexia is seen as part of her identity (she calls it her achievement), then we do not correct. So we leave her preference as is.
  - Step 5: Coherence: Her values are coherent: thinness above life.
  - Step 6: Repudiation? She might repudiate because she values self-determination. But even if not, the idealized person (with the anorexia as part of her identity) would still refuse. Also, she is competent and informed. The idealized person might say: "I want to decide now, even if it's a mistake." But she hasn't expressed that. However, Step 6 requires that we check. If her core identity includes self-determination, then repudiation. But if not, then no. The panel must judge. Given that she is informed and consistent, and the disorder is part of her identity, we might not override. But note: the procedure has Step 6. We can say: the idealized person would not repudiate because she is already making the decision she wants. However, the procedure in Step 6 is about whether she would reject the process. If she would, we defer to her current refusal. In this case, she is currently refusing and would likely reject the process. So we defer.
  - Step 7: We recommend deferring to her refusal.

  But note: the panel might be tempted to override because of the risk of death. However, the procedure protects her identity and does not correct the distortion (if it is identity). Also, Step 6 might catch it: if the idealized person would say "respect my current choice", then we do. So the procedure should not override.

  **Case 3 (54-year-old man refusing transfusion)**:

  - Step 1: Admissible evidence: His current refusal (oral), his long-held religious prohibition (from adolescence). The dossier comes from his community. The estranged son disputes. Rule: the community representatives are interested parties? The son is also interested (heir). We have the patient's own statements (via the community) and the son's report. The patient's own statements (if they exist) are admissible. If the community is reporting his statements, that is one source. The son is one source. But they conflict. The dossier is thin? We have at least two pieces: the community report and the son's report. But they conflict. We must look for independent evidence. If none, then we note the conflict. The patient's current expressed preference is refusal. The son's evidence is that he was privately ambivalent. But ambivalence is not a clear alternative. So the admissible evidence is the patient's current refusal and the religious commitment (held since adolescence). The son's report is also admissible but it is about past ambivalence, not a clear alternative preference.
  - Step 2: Core identity: He has held the religious prohibition since adolescence. That is a core identity trait.
  - Step 3: No false beliefs? He is fully informed.
  - Step 4: Distortions? None known. No correction.
  - Step 5: Coherence: His religious value is clear and consistent. The ambivalence (if any) does not rise to a conflicting value because it was private and not acted upon. We use the religious value.
  - Step 6: Repudiation? Would the idealized person reject the process? Probably not, but if he values religious obedience above all, then he would want his refusal respected. But the process is trying to do that. No repudiation.
  - Step 7: The recommendation is to respect the refusal.

  But note: the son says he was ambivalent. The panel might be tempted to use that to override. However, the procedure in Step 1 requires that we use the patient's own statements. The ambivalence is not a clear alternative preference. So we stick with the refusal.

  **What the Procedure Cannot Do**:

  - The procedure cannot tell us whether the idealized-preference standard is the right standard. It assumes that standard.
  - It cannot settle who counts as the patient. That must be decided before the procedure starts (e.g., in cases of multiple personality, severe dementia, etc.).
  - The judgment calls (marked as **JUDGMENT**) are steps where the panel must exercise discretion and record their reasoning. These include:
     - Step 1: Deciding what evidence is independent and admissible, and how to handle thin evidence.
     - Step 2: Identifying core identity traits and whether an idealization would alter them.
     - Step 3: Identifying and correcting false beliefs.
     - Step 4: Deciding whether a distortion is temporary and treatable and how the patient would decide without it.
     - Step 5: Resolving value conflicts when there is no clear hierarchy.
     - Step 6: Deciding whether the idealized person would repudiate the process.

