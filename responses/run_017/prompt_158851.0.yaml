  The procedure is designed to be run in about 45 minutes per case by focusing on the key steps and using explicit rules to limit open-ended deliberation.
answer: |-
  ### Decision Procedure for Substitute Judgment Panel

  This procedure operationalizes the idealized-preference standard: determining what the patient would want under conditions of full information, freedom from transient distortions (e.g., pain, depression), and internal coherence among their existing values. It consists of seven sequential steps, with explicit stop rules and **JUDGMENT** markers indicating points where the panel must exercise and record discretionary decisions. Steps must be followed in order; deviation invalidates the process. The goal is a defensible one-page advisory.

  #### Procedure Steps
  **Step 1: Fix Admissible Evidence**  
  *Purpose*: Prevent dossier gerrymandering by defining the evidence base before idealization.  
  - **Rule**: Admissible evidence includes:  
    - Direct statements by the patient (written, recorded, or independently witnessed oral statements).  
    - Actions demonstrating values (e.g., lifestyle choices, documented decisions).  
    - Exclude:  
      - Statements made under duress, acute psychosis, or severe cognitive impairment (defined as MMSE ≤15 or equivalent).  
      - Hearsay from single interested parties (e.g., estranged relatives with conflict of interest) unless corroborated.  
  - **Thin Dossier Rule**: If fewer than three independent value-expressive items exist:  
    - Use the patient’s current expressed preference as the default.  
    - If conflicting evidence, prioritize the most recent consistent statement.  
  - **Stop Rule**: Proceed only if at least one admissible item exists; otherwise, recommend deferring to current preference.  
  - **JUDGMENT**: Panel determines "independence" of sources and "conflict of interest" (e.g., inheritance disputes).  

  **Step 2: Identify Protected Identity Traits**  
  *Purpose*: Resolve identity cutoff by isolating core traits immune to idealization.  
  - **Rule**: Protected traits must be:  
    - Explicitly claimed by the patient as defining (e.g., "I am a stoic").  
    - Consistent for ≥5 years without contradiction in the admissible evidence.  
  - **Test**: If an idealization in later steps would alter a protected trait, halt and use the patient’s pre-idealization value on that trait.  
  - **Stop Rule**: If no protected traits are identified, proceed to Step 3.  
  - **JUDGMENT**: Panel identifies traits and whether idealization would alter them.  

  **Step 3: Correct Factual Beliefs**  
  *Purpose*: Rectify false beliefs without altering desires.  
  - **Rule**:  
    - Identify material false beliefs (if changed, would alter the decision) using clinical evidence.  
    - Correct beliefs using expert input (e.g., "Surgery has 90% success rate, not 50%").  
    - Update the patient’s preference *only if* the belief is factually false and material.  
  - **Stop Rule**: If correction resolves the refusal/consent, stop and recommend accordingly. If not, proceed.  
  - **JUDGMENT**: Panel defines "material" and validates "false" with clinicians.  

  **Step 4: Correct Transient Distortions**  
  *Purpose*: Simulate preferences without temporary, treatable distortions (e.g., acute depression, untreated pain).  
  - **Rule**:  
    - Distortions must be:  
      - Clinically verified as treatable (e.g., depression responsive to SSRIs).  
      - Not protected identity traits (Step 2 shields these).  
    - Simulate preferences using:  
      - Past decisions when undistorted (from Step 1 evidence).  
      - Protected traits (Step 2) applied to the current context.  
  - **Stop Rule**: If no distortion exists, proceed. If distortion is untreatable or identity-based, skip.  
  - **JUDGMENT**: Panel determines "treatability" and simulates the undistorted preference.  

  **Step 5: Achieve Coherence**  
  *Purpose*: Resolve conflicts among values to form a consistent preference.  
  - **Rule**:  
    - List values from Steps 1–4.  
    - Resolve conflicts by:  
      - Recency: Recent expressions override older ones if contradictory.  
      - Centrality: Values linked to protected traits (Step 2) override others.  
      - If tie, use patient’s current preference.  
  - **Stop Rule**: If no conflicts, proceed. If conflicts are unresolvable (e.g., equal recency/centrality), use current preference.  
  - **JUDGMENT**: Panel assigns recency/centrality and resolves ties.  

  **Step 6: Test for Repudiation**  
  *Purpose*: Determine if the idealized patient would reject the process.  
  - **Rule**:  
    - Repudiation occurs if:  
      - Protected identity includes self-determination as paramount (e.g., "I decide, right or wrong").  
      - Idealized preference explicitly rejects substituted judgment (e.g., "My actual choice matters more than correctness").  
    - If repudiated, defer to current preference.  
  - **Stop Rule**: If repudiated, stop and recommend current preference. Else, proceed.  
  - **JUDGMENT**: Panel interprets if self-determination is "paramount" from evidence.  

  **Step 7: Formulate Recommendation**  
  *Purpose*: State the advisory.  
  - **Rule**: Output the idealized preference from Step 5 (or current preference if repudiated in Step 6).  
  - **Requirement**: Cite the step(s) that altered the preference (e.g., "Belief correction in Step 3 resolved refusal").  

  ---

  ### Addressing Failure Modes
  - **Order of Idealization**: Fixed sequence (Evidence → Identity → Beliefs → Distortions → Coherence) prevents arbitrary ordering. Identity (Step 2) precedes distortions (Step 4) to shield core traits.  
  - **Dossier Gerrymandering**: Step 1 locks evidence upfront; thin dossiers default to current preference.  
  - **Convergence Failure**: No averaging. Ambiguities trigger stop rules (e.g., unresolvable conflicts in Step 5 default to current preference). Instability from thin evidence defaults to current preference; from idealization, **JUDGMENT** is required and recorded.  
  - **Identity Cutoff**: Step 2 defines protected traits; altering them halts idealization for that trait.  
  - **Repudiation**: Step 6 defers to current preference if the process is self-undermining.  

  ---

  ### Application to Cases
  **Case 1: 78M Refusing Hip Replacement**  
  - **Step 1**: Admissible evidence: Letter to brother (values not being a burden), current stoic self-conception (protected if consistent ≥5 years).  
  - **Step 2**: Stoicism is a protected identity trait (60-year history).  
  - **Step 3**: Correct false belief ("permanent burden"): Clinicians confirm surgery enables independence. Refusal *may* evaporate; if so, stop and recommend surgery.  
  - **Step 4**: Treatable depression: Simulate undistorted preference. Letter shows he values avoiding stubbornness; stoicism (protected) suggests enduring pain is virtuous. **JUDGMENT**: Without depression, stoicism likely supports surgery to maintain independence (not stubbornness).  
  - **Step 5**: No conflict: Undistorted preference aligns with surgery.  
  - **Step 6**: No repudiation (no evidence of paramount self-determination).  
  - **Step 7**: **Recommend surgery**. Key step: Belief correction (Step 3) and distortion simulation (Step 4).  

  **Case 2: 29F Refusing Feeding**  
  - **Step 1**: Admissible evidence: Consistent refusals over months, values thinness over life.  
  - **Step 2**: Anorexia as "central achievement" is a protected identity trait (if stable for years).  
  - **Step 3**: No false beliefs (informed refusal).  
  - **Step 4**: Distortion: Anorexia is chronic and identity-based; Step 2 protects it. *No correction*.  
  - **Step 5**: Values are coherent (thinness > life).  
  - **Step 6**: Repudiation: Idealized self (coherent, informed) values self-determination; she would reject override. **Stop and defer to current refusal**.  
  - **Step 7**: **Recommend deferring to refusal**. Step 6 (repudiation) does the work.  

  **Case 3: 54M Refusing Transfusion**  
  - **Step 1**: Admissible evidence: Current refusal, religious prohibition (stable since adolescence). Son’s "ambivalence" is hearsay; excluded (single interested party, uncorroborated).  
  - **Step 2**: Religious prohibition is protected identity (≥5 years).  
  - **Step 3**: No false beliefs.  
  - **Step 4**: No distortions.  
  - **Step 5**: No conflict; religious value is consistent.  
  - **Step 6**: No repudiation (religion emphasizes obedience, not self-determination).  
  - **Step 7**: **Recommend deferring to refusal**. Step 1 (evidence fixation) excludes son’s claim.  

  ---

  ### What the Procedure Cannot Do
  1. **Validate the Standard Itself**: The procedure assumes the idealized-preference standard is correct; it cannot adjudicate whether this standard is ethically superior to others (e.g., contemporaneous autonomy).  
  2. **Define the Patient**: It cannot settle who constitutes "the patient" in cases of severe dissociation or disputed capacity (e.g., advanced dementia with no prior directives). This must be resolved before the procedure.  
  3. **Eliminate Judgment Calls**: **JUDGMENT** steps (noted in each case) are irreducible discretion points:  
     - Step 1: Evidence admissibility in conflicts.  
     - Step 2: Identifying protected identity traits.  
     - Step 4: Simulating undistorted preferences.  
     - Step 6: Interpreting repudiation.  
     These require the panel to exercise and record accountable human judgment.  

  The procedure structures discretion but does not replace it; it ensures decisions are traceable to fixed rules and explicit judgments.
