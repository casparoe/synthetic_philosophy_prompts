answer: |-
  ## Proposal: Value Erosion in Repeated Moral Trade

  **Research Question:** When a proposed sequence of moral trades predictably alters one or both parties’ terminal values via "unit capture" (systematic representation of goods in exchange units rather than native value units), which temporal standpoint (ex ante, interim, ex post) authoritatively determines whether the trades were mutually beneficial? The answer must specify: (1) the justified standpoint for benefit assessment under predictable value change, (2) the implications for permissible denominations (size/frequency) and domains of moral trade.

  **Why Existing Frameworks Are Insufficient:** Current moral trade models hold values fixed within a single time-slice evaluation. This neglects the constitutive effects of repeated exchange. Three intuitive rebuttals fail:
  1.  **"Preference changes are neutral"**: Fails when the change itself degrades the agent’s capacity to realize their *original* values or constitutes a loss of authenticity (e.g., valuing a friendship primarily in hours owed).
  2.  **"Discount future value shifts ex ante"**: This is circular. Choosing a discount rate *requires* the very standpoint (ex ante? ex post?) we are trying to justify. Weighting future altered values presupposes an evaluative perspective not yet corrupted, while weighting original values ignores the agent’s future perspective.
  3.  **"An empirical question only"**: While psychology informs *how* unit capture occurs, the *normative* question of which standpoint to adopt when values conflict across time is philosophical. Knowing the mechanism’s prevalence doesn’t resolve the authority problem.

  **Methodology (6 Months):**
  *   **Month 1:** Taxonomy Development. Systematize mechanisms of value change relevant to trade (e.g., unit capture, cognitive dissonance reduction, habit formation, shifting reference points) using existing philosophical/psychological literature. Define "unit capture" operationally.
  *   **Month 2:** Case Construction. Develop stylized, progressively complex cases stressing standpoint conflict. Start with bilateral single-value erosion, move to multi-trade sequences, reciprocal erosion, and potential "value pump" scenarios where individually rational trades lead to mutual loss by original/ex post values.
  *   **Month 3:** Standpoint Analysis. Rigorously evaluate each standpoint (ex ante, interim, ex post, hybrid) against cases. Identify which resolves conflicts coherently, avoids arbitrariness, and aligns with core intuitions of benefit and agency in moral trade. Assess if minimal formalization (e.g., tracking value vectors over time) is needed.
  *   **Month 4:** Permissibility Implications. Determine consequences for trade practice: Does the authoritative standpoint imply restrictions on denomination (size/frequency), domain (e.g., identity-constitutive values), or context (community norms)? Analyze the "value pump" possibility.
  *   **Month 5:** Robustness & Failure Conditions. Test conclusions against edge cases and scope limits. Explicitly check for collapse into existing concepts (exploitation, learning) or unsalvageable context-dependence.
  *   **Month 6:** Synthesis & Drafting. Produce a cohesive paper (primary deliverable) arguing for the authoritative standpoint, its implications for permissible trade, and addressing risks/failures. Outline a practical decision heuristic.

  **Possible Conclusions & Deciding Factors:**
  1.  **Minimal Threat:** Unit capture is rare/self-limiting. *Decider:* Evidence that value shifts rarely undermine original/ex post endorsement across cases.
  2.  **Domain Restriction:** Threat is real but confined to values tied to practical identity (e.g., commitments, relationships). *Decider:* Consistent inability to induce harmful capture with non-identity goods in cases.
  3.  **Institutional Redesign Needed:** Pervasive risk necessitates structural changes (e.g., mandated reflection periods, value audits). *Decider:* Standpoint analysis shows unacceptable risk under current norms; redesign offers mitigation.
  4.  **Refusal Despite Ex Ante Gain:** Some positive-sum trades must be refused to prevent corrosive value erosion. *Decider:* Identification of trades where the ex post or original-value perspective reveals net loss, outweighing ex ante gain. A "value pump" would strongly support this.
  5.  **The Value Pump:** Exists if sequences of mutually beneficial trades (by successive standpoints) leave all parties worse off by original or stable ex post values. *Decider:* Construction of a compelling, non-pathological case demonstrating this cycle.

  **Failure Conditions (Checkable):**
  1.  **Collapse:** All instances of putative unit capture are demonstrably reducible to either (a) Bayesian updating (ordinary learning) or (b) identifiable exploitation (coercion, information asymmetry) present at t=0. (Success: Identify irreducibly normative degradation.)
  2.  **Context Dependence:** No generalizable rules emerge; permissibility depends entirely on idiosyncratic features of agents/values. (Success: Derive rules based on denomination/domain.)
  3.  **Framework Incompatibility:** The analysis unavoidably requires cardinal interpersonal comparisons or specific metaphysical commitments about personal identity that standard moral trade frameworks explicitly reject. (Success: Operate within standard ordinal, agent-relative frameworks.)

  **Scope & Assumptions:**
  This project does not offer a general theory of value change or personal identity. It assumes agents persist over the relevant timeframe and that their values at any given time can be meaningfully ascribed to them (standard decision theory assumptions). It borrows the concept of "practical identity" (e.g., Korsgaard) to demarcate potentially vulnerable values but does not defend the metaphysics.

  **Why Philosophy? Why Fund This?**
  A survey or interviews could map *if* unit capture occurs, but cannot resolve the *normative* question: **When values conflict across time due to trade itself, whose "benefit" counts?** Without this philosophical groundwork, empirical findings lack a framework for evaluation. Decision-makers *this month* face trade proposals where value shift is plausible. This project’s deliverable is a **conceptual toolkit**: a reasoned argument for which perspective (ex ante? ex post?) should govern their assessment, and concrete heuristics (e.g., "For identity-linked values, avoid frequent small trades using a single numeraire; prefer bundled exchanges with explicit value reaffirmation") to guide immediate choices and institutional design, grounded in a rigorous analysis of benefit under transformative exchange.

  ---

  **Note on Perceived Weakness:**

  The most significant risk lies in **resolving the circularity of discounting future value shifts (Rebuttal #2)**. Choosing a standpoint inherently privileges certain values (original or future). The project aims to find the *least arbitrary* or *most coherent* standpoint, but this may prove intractable. If no standpoint avoids privileging one set of values without justification, the conclusion might be that "mutual benefit" is fundamentally ambiguous under predictable value erosion, potentially undermining the coherence of repeated moral trade evaluations. This is a deep philosophical challenge, not a methodological flaw, but it risks yielding a pessimistic or inconclusive result. The methodology explicitly tackles this in Month 3, but success isn't guaranteed.
