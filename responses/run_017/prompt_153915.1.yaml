  ### Grading Procedure for RA

  **Objective:** Grade Bongard-style problem submissions (rule descriptions) for correctness, avoiding common pitfalls (a, b, c). The RA has no philosophy/ML background. Time: ≤5 minutes per problem.  
  **Inputs per Problem:**  
  - 12 figures (6 positive, 6 negative).  
  - Intended rule (sealed until Step 3).  
  - Submission rule.  

  **Steps (RA Follows Strictly):**  
  1. **Step 1: Check Fit (1–2 min)**  
     - Apply the submission rule to all 12 figures.  
     - **Pass:** Rule correctly classifies all 6 positives and 6 negatives.  
     - **Fail:** Any misclassification → **"incorrect"**. Stop. Log: `Step1_Fail`.  

  2. **Step 2: Check Disjunction (1–2 min)**  
     - **Key:** Is the rule a disjunction (e.g., uses "or") of ≥3 conditions?  
       - If no → Proceed to Step 3.  
       - If yes:  
         - Verify each condition matches ≤1 figure in the entire set of 12.  
         - Verify all positive figures are covered.  
     - **Fail (Disjunctive):** Conditions are figure-specific (e.g., "has a red triangle at top-left") → **"disjunctive"**. Stop. Log: `Step2_Disj`.  
     - **Pass:** Proceed.  

  3. **Step 3: Check Rephrasing (1 min)**  
     - Unseal the intended rule.  
     - **Judge:** Is the submission rule a **clear rephrasing** of the intended rule?  
       - **Yes** (e.g., "closed shape" vs. "no gaps in outline") → **"correct"**. Stop. Log: `Step3_Rephrase`.  
       - **No** (e.g., "even marks" vs. "closed shape") → **"escalate"**. Log: `Step3_Escalate`.  

  **Escalation Handling (Author Only):**  
  - RA logs all `Step3_Escalate` cases.  
  - Author reviews escalated cases (max **5 per 100 submissions** to cap workload).  
  - Author decides:  
    - **"correct"**: Rule is simpler/equivalent to intended rule.  
    - **"incorrect"**: Rule is overfit/underfit/non-natural.  
    - **"ambiguous"**: Problem is flawed (drop from benchmark).  

  **Judgment Calls:**  
  - **Step 2:** "Figure-specific" = Condition describes unique visual features (RA uses common sense; e.g., "exactly two blue circles" is specific; "has a circle" is general).  
  - **Step 3:** "Clear rephrasing" = Same core concept (RA checks wording similarity; e.g., "3 sides" vs. "triangle" is a rephrasing; "even marks" vs. "closed shape" is not).  

  **What the RA Avoids:**  
  - No simplicity judgments (handled in escalation).  
  - No generator-space equivalence checks (handled in escalation).  
  - No philosophy debates.  

  ---

  ### Procedure Test on Your Submissions

  **Submission 1:**  
  - **Intended rule:** "The outline is closed."  
  - **Submission rule:** "An even number of separate marks."  
  - **RA Steps:**  
    1. Step 1: Assume fits all 12 → Pass.  
    2. Step 2: Not a disjunction → Pass.  
    3. Step 3: Not a rephrasing ("even marks" ≠ "closed") → **"escalate"**.  
  - **Author Escalation:** Rule fits but is unintended. Likely **"incorrect"** (unnatural prior) or **"ambiguous"** (if generator is flawed).  

  **Submission 2:**  
  - **Intended rule:** E.g., "All shapes are convex."  
  - **Submission rule:** E.g., "Shape 1 has 3 sides OR Shape 2 is blue OR ..." (5 disjuncts).  
  - **RA Steps:**  
    1. Step 1: Fits all 12 → Pass.  
    2. Step 2: Disjunction of 5 (<6) conditions → Pass. *(Note: Step 2 requires ≥6 disjuncts for auto-fail)*.  
    3. Step 3: Not a rephrasing (disjunction ≠ simple geometric rule) → **"escalate"**.  
  - **Author Escalation:** Disjunctive and unnatural → **"incorrect"**.  

  **Submission 3:**  
  - **Intended rule:** E.g., "Vertically symmetric."  
  - **Submission rule:** E.g., "Top and bottom halves match." (Simpler, agrees on generator).  
  - **RA Steps:**  
    1. Step 1: Fits all 12 → Pass.  
    2. Step 2: Not disjunctive → Pass.  
    3. Step 3: Clear rephrasing? **Yes** (same concept) → **"correct"**.  
       - *If rephrasing is unclear (e.g., "no uneven edges"), RA escalates. Author then marks **"correct"** or **"ambiguous"**.*  

  ---

  ### Limitations of the Procedure  
  1. **Cannot Detect:**  
     - Non-disjunctive overfitting (e.g., overly complex rules that fit 12 figures but fail generality).  
     - Generator-space equivalence without escalation.  
     - Subjective "naturalness" of rules (handled post-escalation).  
  2. **RA Constraints:**  
     - Relies on visual inspection (may struggle with abstract rules).  
     - Step 2 disjunction check is coarse (fails only explicit figure-specific lists).  
  3. **Dependency:** Final correctness depends on author’s escalation judgment.  

  **Reproducibility:** Logs use fixed codes (e.g., `Step2_Disj`). Escalations capped at 5/100 to ensure feasibility.
