answer: |-
  I understand your struggle to achieve reflective equilibrium with these cases involving actual infinities. Your intuitions are largely consistent with a metaphysics that respects the distinction between quantitative and positional properties, while also requiring that supertasks have well-defined limit states based on individual histories or convergent sequences. Below, I'll propose a set of principles that aim to systematize your verdicts, drawing from your cases and addressing the two new ones. The principles are designed to be minimal, precise, and motivated by specific cases. I'll explicitly state which of your verdicts need revision to achieve consistency—only one requires change (case 7). I'll also provide verdicts for the new cases (coin toss proportion and rational hotel insertion) and explain the costs of simpler vs. more complex approaches.

  ### Proposed Principles
  I derive these principles from your cases, with each clause motivated by a subset of your verdicts. The core idea is that admissible operations must respect **conservation of quantitative properties** for individuals (avoiding net creation ex nihilo), **flexibility for positional properties** (allowing reassignments), and **well-defined limits for supertasks** (based on individual histories or convergent sequences). Principles are stated precisely for application.

  1. **Conservation Principle for Quantitative Properties (CPQP)**  
     - **Statement**: For any quantitative property (e.g., money holdings, counts of items) associated with individuals in the system, an operation is admissible only if:
       - (a) Every gain (increase) in the property for an individual is matched by an equal loss (decrease) in another individual, or the gain is explicitly from an external source (outside the system).
       - (b) Every loss for an individual is matched by an equal gain in another individual, or the loss is explicitly to an external sink.
       - (c) Net loss to an external sink is admissible (e.g., removal or destruction).
       - (d) Net gain from an external source is admissible (e.g., addition).
       - (e) Net gain from nowhere (internal creation ex nihilo) is inadmissible.
     - **Motivation**: This is motivated by your verdicts on the money transfer cases (6 and 6′). In (6), guest 1 gains a dollar with no matching loss (violating (a) and (e)), so it is inadmissible. In (6′), guest 1 loses a dollar with no matching gain, but this is net loss to "nowhere" (e.g., destruction or removal), which is admissible under (c). CPQP also handles your concern about the passerby variant of (6): if the extra dollar goes to a passerby outside the system, that counts as net gain from an external source (d), making it admissible—but you may need to revise your intuition here (see "Verdict Revisions").
     - **Key Distinction**: CPQP applies only to quantitative properties (like money), not to positional properties (like room assignments). This resolves your first problem with rooms in (1): gaining a room is positional, so CPQP doesn't apply, and no conservation is needed. Positions can be reassigned freely as long as the operation is bijective (see Principle 2).

  2. **Positional Reassignment Principle (PRP)**  
     - **Statement**: Operations that reassign positional properties (e.g., room numbers, spatial locations) are admissible if they define a bijection (one-to-one correspondence) for the relevant individuals, with no restriction on changes to positions.
     - **Motivation**: This is motivated by your verdicts on (1) and (2). In (1), the reassignment is a bijection (everyone moves to n+1, newcomer to 1), so it is admissible. In (2), it is also a bijection (occupants to evens, newcomers to odds). PRP explains why rooms in (1) can be gained without loss: positions are not quantities, so conservation doesn't apply. PRP also handles the "quantities but not places" distinction cleanly.

  3. **Supertask Limit Principle (SLP)**  
     - **Statement**: For a process with times converging to a limit time t (e.g., noon), the state at t is well-defined if and only if:
       - (a) For systems with individuals (e.g., balls in a vase, guests in a hotel), the state of each individual at t is determined by its history: specifically, an individual is present/affected at t iff it was added at some step and not removed by any step prior to t.
       - (b) For systems without distinct individuals (e.g., a single lamp), the sequence of states must converge to a limit.
     - **Motivation**: This is motivated by your verdicts on the vase (4) and lamp (5). In (4), each ball's presence at noon is determined by its history (added and not removed), so the state is well-defined. In (5), the lamp's state sequence (on/off) has no limit, so by (b), it is not well-defined. SLP also addresses your balking at the hotel construction in (7): the end state is defined by the history of room additions, so it should be admissible under (a)—but your verdict needs revision here (see below).

  4. **Addition/Removal Principle (ARP)**  
     - **Statement**: Adding individuals to the system from an external source or removing them to an external sink is always admissible, regardless of cardinality changes. This includes cases where the operation reduces the "intuitive quantity" (e.g., feeling "fewer guests" in (3)) without changing cardinality.
     - **Motivation**: This is motivated by (1), (2), and (3). In (1) and (2), guests are added from outside; in (3), guests are removed to outside. ARP explains why your feeling of "fewer guests" in (3) is metaphysically acceptable—it's a valid removal—even though cardinality is unchanged.

  ### Application to Your Cases
  Here, I apply the principles to your cases, showing how they yield your verdicts except for one revision in (7). Principles used are indicated in brackets.

  - **(1) One new guest arrives; shift everyone; newcomer to room 1**:  
    **Verdict**: Fine (as you said).  
    **Why**: Addition from external source (ARP), positional reassignment via bijection (PRP). No quantitative property changed, so CPQP not engaged.

  - **(2) Countably many new guests; move to evens; newcomers to odds**:  
    **Verdict**: Fine (as you said).  
    **Why**: Addition from external source (ARP), positional reassignment via bijection (PRP). No quantitative change.

  - **(3) All even-numbered guests check out**:  
    **Verdict**: Fine, and "fewer guests" is acceptable (as you said).  
    **Why**: Removal to external sink (ARP). Your intuition of "fewer" reflects a quantitative reduction via removal, not a cardinality issue. CPQP allows net loss to external sink.

  - **(4) Vase with balls: determinate based on removal rule**:  
    **Verdict**: Both outcomes fine (as you said).  
    **Why**: SLP (a) applies: each ball's presence at noon is determined by its history (added and not removed by any step). The difference in outcomes depends on which balls are removed, not net change, consistent with CPQP for additions/removals (ARP).

  - **(5) Lamp: no determinate state at noon**:  
    **Verdict**: Defective description, no fact of the matter (as you said).  
    **Why**: SLP (b) applies: the lamp is a single entity with no individuals, and the state sequence (on/off) has no limit, so no well-defined state at noon.

  - **(6) Money transfer down: guest 1 ends with two dollars**:  
    **Verdict**: Not fine, something wrong (as you said).  
    **Why**: Violates CPQP (a) and (e): guest 1 gains a dollar with no matching loss from another individual (all others keep one dollar), and it is net gain from nowhere (not from external source). This is internal creation ex nihilo.

  - **(6′) Money transfer up: guest 1 ends with zero dollars**:  
    **Verdict**: Fine (as you said).  
    **Why**: CPQP (c) applies: guest 1 loses a dollar with no matching gain, but net loss to nowhere (destruction) is admissible. It is "unfortunate" but metaphysically acceptable.

  - **(7) Two hotels: eternal vs. built via supertask**:  
    **Verdict**: Both should be fine, but you balk at the second. **Revision needed: Accept both.**  
    **Why**: SLP (a) applies to the built hotel: at noon, each room is present because it was added and not removed by any step prior to noon, so the end state is well-defined. Your balking likely stems from unease with creation ex nihilo, but SLP treats it as addition from an external source (implicitly, via the construction process), making it admissible under ARP. To be consistent with your acceptance of the vase supertask (4), you should accept both hotels. The cost is revising your verdict to avoid inconsistency.

  ### Verdicts for New Cases
  Applied principles are indicated.

  - **Coin Toss Proportion (A)**: Each of countably many guests tosses a fair coin once. Is there a fact of the matter about the proportion of heads?  
    **Verdict**: There is a fact of the matter only if the limit of the finite proportion (up to room n) exists as n → ∞; otherwise, it is indeterminate.  
    **Why**: This is governed by SLP (b) applied to the sequence of partial proportions. If the sequence converges (e.g., to 1/2), the proportion is well-defined; if not (e.g., oscillating sequence), it is not. This matches your lamp verdict (5): indeterminacy arises from non-convergence. (Principles: SLP for the sequence.)

  - **Rational Hotel Insertion (B)**: A full hotel with rooms indexed by all rational numbers. Can a new guest be housed if every current guest must move to a room differing from their current by less than 1?  
    **Verdict**: Yes, it is possible.  
    **Why**: PRP applies: a bijection exists that reassigns positions with bounded displacement. For example:  
    - Fix a rational, say 0. Map all rationals q ≤ 0 to q − 0.5 (|diff| = 0.5 < 1).  
    - Map all q > 0 to q + 0.5 (|diff| = 0.5 < 1).  
    - The image is all rationals ≤ −0.5 or > 0.5, so rationals in (−0.5, 0.5] are now empty. Place the new guest in one (e.g., 0).  
    This is a bijection with |new room − old room| < 1 for all, satisfying PRP. (No quantitative changes, so CPQP not engaged.)

  ### Which Verdict Must Go?
  To achieve consistency, **you must revise your verdict on case (7) to accept both hotels**. Your balking at the supertask-built hotel is inconsistent with your acceptance of the vase supertask (4), both of which are handled by SLP (a). The end states are metaphysically equivalent under SLP, so rejecting one while accepting the other is unsustainable. This revision costs some intuitive discomfort with creation ex nihilo but gains consistency with your other supertask verdicts.

  ### Simple vs. Complex Approaches
  - **Simple Principle (Cost: Overturns One Verdict)**:  
    Use only **CPQP** and **PRP**, dropping SLP. This handles all cases except supertasks: (1)–(3), (6), (6′) are fine; (4) and (5) become problematic; (7) is accepted only for the eternal hotel.  
    - **Cost**: You lose the distinction between (4) and (5). In (4), the vase outcome might be seen as indeterminate without SLP, conflicting with your verdict. (5) remains defective. (7) still requires revision to accept both, but without SLP, the supertask-built hotel has no defined state.  
    - **Verdicts Changed**: (4) and (5) become "not fine" or indeterminate, contradicting your acceptance of (4).  
    - **Why Not**: This is cheaper but forces you to abandon your supertask intuitions, which are central to cases (4), (5), and (7).

  - **Complex Principle (Cost: Machinery but Saves All Except One Revision)**:  
    Keep all principles (CPQP, PRP, SLP, ARP) and add a **No Creation Ex Nihilo Clause** for supertasks: "Supertasks must not involve creation of individuals from nothing; all additions must be from an external source."  
    - **Motivation for Clause**: Directly addresses your (7) balking by requiring an external source for additions in supertasks.  
    - **Application**: (1)–(6′) same as before. For (7), the eternal hotel is fine, but the supertask-built hotel is inadmissible unless rooms are "sourced" externally (e.g., from a pool of pre-existing rooms).  
    - **Cost**: More machinery (defining "external source" precisely), and it may conflict with (2) if adding countably many guests at once isn't from an external source. Also, it saves your (7) balking but requires rejecting the vase (4) if balls are created ex nihilo—but in your description, balls are added from outside, so (4) is fine.  
    - **Verdicts Changed**: None of your original verdicts need change except (7), but (7) is now consistently rejected for the built hotel if creation is ex nihilo. However, this may overcomplicate and conflict with ARP.  
    - **Recommendation**: Stick with the simpler four principles and revise (7), as the cost of extra machinery outweighs the benefit.

  ### Final Recommendation
  Adopt the four principles (CPQP, PRP, SLP, ARP) as stated. They systematize your verdicts with minimal revision (only case 7) and handle the new cases. The key insight is that your intuitions stem from:
  - Quantitative conservation (avoiding creation ex nihilo),
  - Positional flexibility,
  - History-based supertask limits.

  For the passerby issue in (6): If the extra dollar goes to a passerby, CPQP (d) allows it as net gain from an external source, so it should be fine. If you still find this objectionable, it might indicate a deeper aversion to any net gain, but your acceptance of additions in (1) and (2) suggests this is consistent. I recommend accepting it to preserve CPQP.

  This framework achieves reflective equilibrium by grounding your cases in consistent metaphysical distinctions. If you provide more details on the coin toss or rational hotel, I can refine this further.
