answer: |-
  **HAL:** ...so propriety ensures you can’t game *expected* accuracy by misreporting your true credence. That’s the core virtue. Top-1 ignores the *structure* of belief. It only cares about the winner, not *how* confident you were right or wrong.
  **BELLA:** Precisely my point! You invoke “expected accuracy” and “true credence” already. Why is maximizing *that* expectation the gold standard? Because propriety feels right? But propriety *assumes* we care about matching credence to truth *gradationally*. Top-1 cares about being decisively right. Why is that illegitimate *before* we pick a score?
  **HAL:** Because dominance arguments *work* across proper scores! If your credences are incoherent, you’re accuracy-dominated *whether* I use Brier or Log. Top-1 doesn’t support that dominance result – incoherent forecasts can avoid dominance – so it fails to capture the epistemic mistake.
  **BELLA:** Fine, maybe incoherence is risky under *many* scores. But what about my Audit case? Suppose the Bureau only scores you on rainy days. Maximizing *audited* accuracy demands always forecasting rain! That’s insane. Your framework labels that rational?
  **HAL:** No! The scoring setup is pathological *because* the audit depends on the *outcome*, not the forecast. It’s not evaluating the forecast’s *fit* to the actual world on a fixed set of occasions. If the audit triggers only when you *forecast* rain, that’s benign – you’re scored on occasions *you chose to speak*. The toxicity comes from outcome-dependent selection.
  **BELLA:** But who defines the “fixed set of occasions”? You say “the propositions you have attitudes toward.” But my attention flits! Today I care about rain; tomorrow, inflation. My “algebra” is interest-relative. So epistemic utility sneaks in pragmatics: scoring me only on what *I* deem important. Accuracy-first isn’t pure.
  **HAL:** The algebra is defined by the propositions *for which you currently hold credences*. That fixes the domain for scoring *those* beliefs. It’s not about future interests, it’s about the content of your present doxastic state.
  **BELLA:** But then a fanatic who only believes "God exists" with P=1 gets a free pass? He’s never accuracy-dominated *on his chosen algebra*! You lose the verdict that his incoherence *elsewhere* is a mistake unless *you* dictate the algebra. And crucially, Hal, all your expectation calculations run *from inside the agent’s credences*. Accuracy-first tells an incoherent agent she’s vulnerable *by her own lights*, but never tells the coherent fanatic *what* to believe. It constrains structure, not content.
  **HAL:** It shows that *given* you aim for accuracy *at all*, probabilism is the only way to avoid dominance *on the propositions you care about*. The fanatic’s limitation is *pragmatic*, not an epistemic flaw in his *actual* beliefs. The core epistemic norm *is* accuracy-seeking on your doxastic commitments.
  **BELLA:** Exactly! You *assume* accuracy-seeking is the supreme epistemic good, and you *assume* the domain for scoring. The framework doesn’t *generate* these; it *starts* with them. That’s the choice my friend meant.
  **HAL:** But the arguments show *which* accuracy measures and *which* scoring setups cohere with that fundamental aim without perverse incentives! It’s not arbitrary.
  **BELLA:** Only relative to the aim you already presuppose. Without that, top-1 or the Rainy-Day Audit are just different games.
  **HAL:** The disagreement is whether accuracy-seeking is constitutive of belief itself.
  **BELLA:** The disagreement is whether accuracy-first can justify its starting points without circularity.

  The challenger (Bella) is closer: accuracy-first presupposes the normativity of accuracy-seeking and its domain, which the framework itself cannot ground.
