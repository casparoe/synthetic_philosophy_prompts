prompt: |-
  I teach moral philosophy, and this term I was conscripted onto the committee that administers the Aldridge Medal, funded by an old bequest for conduct that goes beyond what could reasonably be demanded of anyone — the category we argue about in the literature that begins with Urmson's 1958 paper on saints and heroes, though the bequest's own wording predates all of that and simply describes deeds of which it can be said that they were good to do but not blameworthy to have left undone. The committee is not a theoretical body, but in fourteen years it has accumulated a track record, and because I am the philosopher on it I have been asked to draft the memo on this year's case. Our precedents are these. We awarded the medal to a night custodian who broke two ribs pulling two strangers from a car in a flooded underpass, with no professional duty to intervene and no compensation beyond his medical bills. We declined it, with a letter of commendation, for a campus police officer who carried an unconscious student out of a smoke-filled residence hall, on the ground that this is what his role required of him. We declined it for an administrative assistant who turned in a wallet containing roughly eighteen hundred dollars in cash and a passport, on the ground that returning it cost her nothing and was ordinary decency. We awarded it to an alumna who donated a kidney to a stranger she had met through a patient-matching forum. We awarded it to a professor of nursing who gave unpaid end-of-life care to a neighbour with no family for six years and turned down paid consultancy work in order to keep doing it. And we declined it for a colleague in the physics department who assigned the royalties of one of his textbooks to a nonprofit, on the ground that he had given up nothing he would otherwise have had. Two dimensions have never arisen: no case so far has involved an agent who was later and substantially compensated or honoured for the very same deed, and we have never said a word about whether the agent's motives matter.

  The case before us is Dr. M., now an associate professor of chemistry. Over four years she developed a cheap point-of-care diagnostic for a neglected tropical disease, deliberately did not patent it, published the protocol open-access, and spent four summers training technicians in three countries to use it; she turned down a consultancy to develop a proprietary version, and colleagues in her field estimate the forgone licensing income in the low hundreds of thousands. Her tenure decision was deferred by two years as a result, and senior colleagues say there was genuine doubt at the time whether she would be tenured at all. She had no prior connection to the affected populations and was under no legal, professional or contractual obligation of any kind. Since then she has received a major prize carrying an unrestricted award of about half a million dollars, a named chair, and a trade book contract. In her interview with us she was candid that professional ambition and the expectation of recognition were substantial parts of why she did it, and she also observed that the open-access route generated the citations she needed for tenure considerably faster than a patent would have, and that she would not have taken this path had it meant leaving research altogether; she further said that she would have done it had no one ever noticed, which two members of the committee take to settle the question of motive and two take to be exactly what one would say in a medal interview. She also describes the project, unprompted, as the thing she most wanted to do with her career. We are split four to three, and I do not think the split is really about Dr. M.

  So here is what I want from you. Reconstruct the rules that fit our precedents jointly, and I suspect there are at least four that do: one that measures the agent's cost prospectively and in gross terms, counting opportunity costs and risks borne at the time of acting; one that measures it net, so that later compensation and honours can retroactively remove the sacrifice a deed consisted in; one that adds a condition on the agent's reasons, so that mixed or partly self-interested motivation disqualifies or at least demotes; and one on which what counts as a cost is fixed not by forgone income but by the agent's own projects, so that four years spent on the work one most wanted to do is not obviously a sacrifice at all. Say what each predicts here, which precedent is the closest analog on each, and which of them you think the committee is in fact running. Then give me the recommendation you would put in the memo, and — this is the part I care about — say plainly what we would be committing ourselves to either way: whether the medal honours sacrifice or excellence in aid, whether being beyond the call is a property of the act at the time of acting or of the whole episode including its upshot, whether compensation can cancel supererogation or merely coexist with it, and whether there is any coherent position at all in the middle. Finally, tell me which single further fact about this case, or which variant of it, would best discriminate between the surviving rules, since I would rather ask Dr. M. one good question than argue with my colleagues for another three meetings.
reasoning: |-
  Hmm, the user teaches moral philosophy and is on a committee for the Aldridge Medal, which recognizes supererogatory actions. They need help analyzing a case involving Dr. M., who developed a cheap diagnostic for a neglected disease, didn't patent it, trained technicians, and turned down lucrative opportunities. The committee is split 4-3, and the user wants a systematic reconstruction of possible rules based on precedents.

  First, I need to understand the precedents. The medal was awarded when there was significant personal sacrifice or risk (custodian with injuries, kidney donor, professor with six years of unpaid care). It was declined when the action was seen as part of a role (police officer), involved minimal cost (returning a wallet), or had no real sacrifice (royalties donation where the donor wouldn't have had the money otherwise).

  Now for Dr. M's case: She had opportunity costs (foregone income, tenure delay), but later received compensation (prize, chair, book deal). Her motives were mixed (professional ambition, desire for recognition). She claims she'd have done it even without recognition, but some committee members doubt this.

  The user wants me to reconstruct rules that fit the precedents. Let me outline the four possible rules:

  1. **Prospective Gross Cost Rule**: Focuses on costs/risks at the time of action. Precedents: Custodian (physical risk), kidney donor (health risk), nursing professor (time/opportunity cost). Dr. M had significant opportunity costs (income, tenure delay), so she qualifies.

  2. **Net Cost Rule**: Considers compensation later. Precedent: Physics professor where there was no net cost. Dr. M's later rewards might cancel her initial sacrifice, so she wouldn't qualify.

  3. **Motivation-Centric Rule**: Requires pure altruism. Precedents imply motives weren't considered before, but the nursing professor's long-term care suggests selflessness. Dr. M's mixed motives might disqualify her.

  4. **Project-Relative Cost Rule**: Sacrifice is relative to personal projects. Precedent: Physics professor - giving royalties wasn't a sacrifice. Dr. M's work aligned with her career goals, so not a true sacrifice.

  For Dr. M:
  - Rule 1: Qualifies (like nursing professor)
  - Rule 2: Doesn't qualify (like physics professor)
  - Rule 3: Mixed motives disqualify
  - Rule 4: No sacrifice since it was her passion project

  The committee seems split between Rules 1 (pro-gross) and 2 (net-cost). The user suspects the split isn't really about Dr. M. but about these underlying principles.

  Key philosophical questions:
  - Does the medal honor sacrifice or the excellence of the aid?
  - Is "beyond the call" determined at the time of action or after outcomes?
  - Can compensation cancel supererogation?
  - Is there a coherent middle ground?

  I think the committee has implicitly been using a prospective gross cost rule, ignoring later compensation and motives. The precedents don't consider compensation or motives, focusing on the act and its immediate costs.

  Recommendation: Award the medal. This commits to honoring the deed at the time it was done, with its inherent risks and costs. Compensation doesn't erase the initial supererogation; it's merely a separate matter.

  To resolve the split, ask Dr. M: "At the time you committed to this path, what percentage likelihood of permanent career damage would have made you reconsider?" This tests her risk assessment and sacrifice perception, helping distinguish between Rule 1 and Rule 4.

  If she admits even a small risk would have deterred her, it supports Rule 1 (genuine sacrifice). If she says no risk would have stopped her, it leans toward Rule 4 (no real sacrifice).
answer: |-
  Based on your precedents and the case of Dr. M., I'll reconstruct the four coherent rules that fit your committee's history, apply them to Dr. M., identify which rule the committee likely uses, provide a recommendation for the memo, clarify the philosophical commitments, and suggest a discriminating question. Your precedents consistently focus on **costly sacrifice** (measured in risk, opportunity, or resources) that exceeds ordinary moral expectations, with no consideration of motives or compensation until now. The core tension is whether "beyond the call" is defined by the act's inherent sacrifice at the time or adjusted by later outcomes.

  ---

  ### **1. Reconstructed Rules, Predictions, and Precedent Analogies**
  *Each rule explains all precedents but yields different outcomes for Dr. M.*

  | Rule | Core Principle | Prediction for Dr. M. | Closest Precedent Analogy | Why It Fits Precedents |
  |------|----------------|------------------------|---------------------------|------------------------|
  | **Rule 1: Prospective Gross Cost** | Measures sacrifice at the time of acting, counting all opportunity costs and risks incurred. Ignores later compensation or honors. Motive is irrelevant; only the deed’s objective cost matters. | **Award** the medal. Dr. M. incurred significant costs: tenure delay (career risk), forgone income, and opportunity costs (turning down consultancy). These were substantial and beyond ordinary duty. | Nursing professor (awarded): Sacrificed paid work for years of unpaid care, with costs borne upfront. | Fits all awards (custodian’s injury, kidney donor’s health risk, nursing prof’s time/money loss) and declines (police officer’s role duty, wallet return’s no cost, physics prof’s no sacrifice). Compensation/motive never mentioned. |
  | **Rule 2: Net Cost** | Measures sacrifice retrospectively, net of later compensation. If rewards offset the initial cost, no true sacrifice remains. Motive is irrelevant; the act must be "net costly" overall. | **Decline** the medal. Dr. M.’s later rewards (~$500k prize + chair + book deal) likely exceed her "low hundreds of thousands" forgone income and tenure delay. Her sacrifice is canceled out. | Physics professor (declined): Royalties donation wasn’t a sacrifice because he never had the money; similarly, Dr. M.’s costs are negated by gains. | Explains why physics prof was declined (no net cost) and wallet return (no cost). Custodian’s medical bills weren’t reimbursed, so net cost remained. |
  | **Rule 3: Motivation-Centric** | Adds a condition: sacrifice must be driven by purely altruistic reasons. Mixed or self-interested motives disqualify, even if the cost was high. | **Decline** the medal. Dr. M.’s admission of professional ambition and recognition-seeking taints her act. Her claim she’d "have done it had no one noticed" is doubted by half the committee. | Nursing professor (awarded): Implied pure altruism in 6 years of unpaid care. Wallet return (declined) involved no cost but also no heroic motive—just decency. | Motive wasn’t discussed in precedents, but pure altruism is implied in awards (e.g., custodian’s risk for strangers). Police officer’s role-bound act lacked supererogatory motive. |
  | **Rule 4: Project-Relative Cost** | Sacrifice is defined relative to the agent’s own values and projects. If the act aligns with their deepest goals, it isn’t a true cost. Motive matters only if it reveals alignment with identity. | **Decline** the medal. Dr. M. describes this as "the thing she most wanted to do with her career." The costs (e.g., tenure delay) are mitigated by her personal fulfillment. | Physics professor (declined): Donating royalties wasn’t a sacrifice because it didn’t conflict with his projects. Custodian (awarded): Risking injury wasn’t part of his job or identity. | Fits why physics prof was declined (no project conflict) and nursing prof awarded (care conflicted with paid work). Wallet return declined (no project sacrifice). |

  ---

  ### **2. Which Rule Is the Committee Running?**
  Your committee is likely using **Rule 1 (Prospective Gross Cost)**, based on your track record:
  - **Why Rule 1?** Precedents ignore motives and compensation, focusing solely on costs/risks at the time of acting (e.g., custodian’s injury, nursing prof’s opportunity costs). Dr. M.’s tenure delay and forgone income are analogous to the nursing professor’s sacrifice—both involved career risks and uncompensated effort. The 4–3 split over Dr. M. arises because Rule 1 is implicitly applied, but members are confused by the novelty of compensation/motive.
  - **Why not others?** 
    - Rule 2 (Net Cost) contradicts awards like the custodian (no mention of medical bill reimbursement) or kidney donor (no discussion of later honors). 
    - Rule 3 (Motivation-Centric) has no precedent support; motives were never mentioned. 
    - Rule 4 (Project-Relative) is inconsistent with awards like the nursing professor (care aligned with her profession) or kidney donor (likely a personal priority).

  The split reflects tension between Rule 1 purists (focusing on Dr. M.’s upfront costs) and members subconsciously drifting toward Rule 2 (distracted by her later rewards) or Rule 3 (troubled by her motives). But the precedent pattern anchors in Rule 1.

  ---

  ### **3. Recommendation for the Memo**
  **Award the medal to Dr. M.**  
  - **Justification:** Under Rule 1—the committee’s de facto standard—Dr. M.’s actions meet the criteria. She incurred significant prospective costs: (1) tenure delay (a substantial career risk, as her job was in genuine doubt), (2) forgone licensing income (confirmed by colleagues), and (3) opportunity costs (declining consultancy). These exceed ordinary duty, akin to the nursing professor sacrificing paid work for years of care. Her later rewards are irrelevant per precedents, and motives were never disqualifying (e.g., the custodian might have acted impulsively, not altruistically).  
  - **Language for Memo:**  
    > "The committee awards the Aldridge Medal to Dr. M. for her four-year commitment to developing and disseminating a life-saving diagnostic at significant personal cost, including professional risk and forgone economic opportunities. This sacrifice, undertaken without obligation, exemplifies conduct beyond what could reasonably be demanded. While Dr. M. has since received recognition, the medal honors the deed and its inherent costs as undertaken, consistent with our precedents (e.g., the nursing professor’s unpaid care despite career impacts)."

  ---

  ### **4. Philosophical Commitments Explained**
  Awarding or declining forces the committee to take a stand on supererogation’s nature:
  - **Awarding Commits To:**  
    - The medal honors **sacrifice-in-action**, not outcomes or excellence in aid. The act is supererogatory based on its inherent costs/risks at the time.  
    - "Beyond the call" is a **property of the act when performed**, not the whole episode. Compensation coexists but doesn’t cancel supererogation (e.g., a firefighter who rescues a child at great risk and later gets a medal still acted heroically).  
    - **Coherent position:** Sacrifice is prospectively defined; motives and compensation are irrelevant. This aligns with Urmson’s "saints and heroes" framing, where the act’s moral weight lies in overcoming reasonable self-interest at the moment.

  - **Declining Commits To (if based on Rules 2–4):**  
    - The medal requires **uncompensated sacrifice or pure altruism**, effectively honoring net cost or moral purity.  
    - "Beyond the call" is **retrospective**, including outcomes (Rule 2) or motive (Rule 3). Compensation cancels supererogation, reducing it to "invested effort later repaid."  
    - **Incoherence risk:** Rules 2–4 create contradictions. Rule 2 makes supererogation contingent on luck (e.g., had Dr. M. not won the prize, she’d qualify). Rule 3 demands unattainable motive purity. Rule 4 is subjective—e.g., was the nursing professor’s care "her project"?  

  **The Middle Ground?** Only Rule 1 offers coherence. A "mixed" approach (e.g., "cost plus some altruism") lacks precedent support and invites arbitrariness. Urmson’s framework treats supererogation as objective and act-focused; importing motive or compensation undermines that.

  ---

  ### **5. Discriminating Question for Dr. M.**
  **Ask:** *"At the time you committed to this project, what percentage likelihood of permanent career damage (e.g., never getting tenure) would have made you reconsider?"*  
  - **Why this?** It directly tests Rule 1 vs. Rule 4.  
    - If she cites a low threshold (e.g., "Even 20% risk would have stopped me"), it confirms significant *prospective* sacrifice (Rule 1).  
    - If she says "No risk would have deterred me; this was my calling," it supports Rule 4 (no true sacrifice).  
  - **Why not ask about motives/compensation?** Precedents ignore both, so this avoids muddying the core issue. It focuses on cost assessment at the critical moment, aligning with the committee’s history.

  This question resolves the split efficiently: If Dr. M. acknowledges she accepted real risk, Rule 1 applies. If not, Rule 4 might, but it would contradict your precedents—forcing the committee to explicitly abandon Rule 1. Either way, one question ends the stalemate.
