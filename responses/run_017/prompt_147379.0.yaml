  hey — you're a professional philosopher who's taught game theory to undergrads a bunch of times and who also knows your way around the program-equilibrium stuff. Please think carefully about this one: brainstorm three or four genuinely different framings before you commit, tell me in a couple of lines each why you dropped the others, then write up the one you kept in full.

  The setting: upper-division seminar, cross-listed phil/econ, 16 students, one 90-minute block, one room with movable chairs, a whiteboard, index cards and pens. No laptops — I want it on paper. They've already done the one-shot prisoner's dilemma and Nash equilibrium, and last week basically everyone said the same thing: in a real one-shot PD defecting is obviously rational and there's nothing to be done about it. That's the complacency I want to break.

  The idea, in case it helps you calibrate: instead of choosing an action, each player submits a *program* that gets to read the other player's program and outputs COOP or DEFECT. Payoffs are the usual 3/3 for mutual cooperation, 5/0 for defecting on a cooperator, 1/1 for mutual defection. The payoff structure I want them to run into is that a program along the lines of "cooperate if and only if the other program is word-for-word identical to mine" is self-enforcing — so mutual cooperation turns up in a genuinely one-shot game with no repetition, no outside enforcer, no reputation. Mutual defection is of course still there too. And the real question, which they should feel before I name it, is what's actually doing the work: that you're now conditioning on the other side's *disposition* rather than their act, plus some self-reference trick, plus total transparency of source code. Whether that "solves" the one-shot dilemma or just relocates the assumptions into the transparency premise is what I want them arguing about at the end.

  Constraints:

  - Barely any lecture up front. Five minutes of framing, max. They should hit the weirdness themselves before I say a word about equilibria.
  - I need a tiny hand-executable "language" they can write programs in, which I or a couple of student "compilers" can evaluate in under a minute per pair. Give me the actual instruction set and syntax, and a fair timeout rule for programs that don't halt — I don't want the rule to kill off the interesting cases. I'm fine with a SELF opcode that returns the program's own source (that's what the theory hides inside a recursion-theorem argument), but they should notice it's load-bearing and slightly spooky.
  - Pairings should be assigned by me, and I want at least one round where they write against an unknown partner rather than someone they can see.

  Mechanics I've been toying with — tell me which ones to actually use and which will just muddy the water:

  1. A token budget on program length (say 40 tokens), tuned so that the self-copying identity check only just barely fits, so reciprocity has a real cost and people feel the squeeze.
  2. A lossy channel: instead of reading the opponent's full source, your program recieves a fixed "digest" that I compute on the board — length bucket, first token, whether the word COOP appears at all, whether the program reads the digest at all. Exact-match copycat then dies and they have to find something that survives coarse monitoring.
  3. Noise: I mutate one character of one randomly chosen program before executing. Cooperation collapses and I want them to see *exactly* where it broke.
  4. A public sandbox log: anyone can ask out loud "what does my program do if the opponent is X?" and I answer on the whiteboard. It leaks information and probably lets people signal. Not sure if that's a feature or a bug.

  What I need back: full rules, the language, a materials list, a timeline (90 minutes, roughly minute by minute), how to convert payoffs into points with no money involved (there's a small prize and a participation point in it for them), the execution and arbitration procedure, and a debrief that maps specific moments from the session onto the formal points — what a program equilibrium is, why the copycat thing is one, why mutual defection still is one, what self-reference buys you, and whether any of this has really answered the skeptic from last week. Also: what will predictably go wrong the first time I run it and how I should handle it, and an honest note on which feature of the idea the activity simply cannot reproduce and I'll have to say out loud myself.

