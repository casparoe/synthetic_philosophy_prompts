answer: |-
  ### Finalized Classroom Activity: Program Equilibrium in the One-Shot Prisoner's Dilemma  
  **Goal:** Shatter the complacency that defection is inevitable in the one-shot PD by having students design programs that condition actions on opponents' source code, revealing cooperative equilibria through transparency and self-reference.  

  ---

  ### **Materials List**  
  - **Whiteboard:** For rules, sandbox log, and scoring.  
  - **Index cards (16 per student):** One card per program/round.  
  - **Pens:** For writing programs.  
  - **Timer:** For 5-minute writing intervals.  
  - **Prizes:** Small prize (e.g., candy) for top scorer, participation points for all.  
  - **Random pairing device:** Sticky notes with numbers (1–16) for shuffling.  

  ---

  ### **Language & Rules**  
  **Core Language (Rounds 1–3):**  
  - **Token Budget:** 40 tokens/program (spaces ignored; each keyword/string is 1 token).  
  - **Instructions (1 token each):**  
    - `COOP`: Output COOP and halt.  
    - `DEFECT`: Output DEFECT and halt.  
    - `READ_OPP`: Push opponent’s full source code (as a string) to stack.  
    - `SELF`: Push own source code (as a string) to stack.  
    - `IF_EQ`: Pop 2 strings; if equal, output COOP, else DEFECT.  
    - `IF_COOP_IN`: Pop 1 string; if "COOP" is a substring, output COOP, else DEFECT.  
  - **Syntax:** Programs are space-separated token sequences (e.g., `READ_OPP SELF IF_EQ`).  
  - **Timeout:** >20 execution steps → DEFECT (prevents infinite loops).  
  - **Sandbox Log:** Public Q&A; students ask "What if opponent is X?"; instructor runs and posts results.  

  **Round 4 (Lossy Channel) Changes:**  
  - Replace `READ_OPP` with `READ_DIGEST`: Returns opponent’s digest (e.g., `FIRST=DEFECT LAST=IF_EQ LEN=3`).  
  - Add `MY_DIGEST`: Returns own digest (same format).  
  - Remove `IF_COOP_IN` (irrelevant).  
  - Digest = First token + last token + token length.  

  **Payoffs → Points:**  
  - Mutual Cooperation: 3 pts  
  - Defection vs. Cooperation: 5 pts (defector), 0 pts (cooperator)  
  - Mutual Defection: 1 pt  
  - **Scoring:** Sum points across 4 rounds; top scorer wins prize.  

  ---

  ### **Timeline (90 Minutes)**  
  **0–5 min: Framing (Quick & Provocative)**  
  - "Last week: defection is inevitable in the one-shot PD. Today: You’ll write *programs* that see each other’s code before choosing. Can you hack rationality to make cooperation rational?"  
  - Post language/rules on board.  

  **5–15 min: Round 1 (Known Partners, Full Transparency)**  
  - Pair visibly (neighbors).  
  - Write programs (5 min).  
  - **Execution:** Compilers (you + 3 students) run programs in pairs:  
    1. Feed opponent’s source to each program.  
    2. Run step-by-step; halt at COOP/DEFECT or timeout.  
    3. Record payoffs on board.  
  - **Prediction:** Most pairs use `ALWAYS_DEFECT` (mutual defection, 1 pt) or copycat (`READ_OPP SELF IF_EQ`, mutual cooperation, 3 pts).  

  **15–25 min: Round 2 (Unknown Partners, Full Transparency)**  
  - Randomly pair (shuffle sticky notes).  
  - Write programs (5 min); no communication.  
  - Execute as above.  
  - **Prediction:** Copycat still works, but some try `IF_COOP_IN` → exploitable by defectors.  

  **25–35 min: Round 3 (Known Partners, Noise)**  
  - Pair visibly. Write programs (5 min).  
  - **Noise:** Randomly mutate 1 token in 50% of programs (e.g., change `IF_EQ` to `DEFECT`).  
  - Execute.  
  - **Prediction:** Copycat breaks (e.g., mutated copycat vs. original → DEFECT/DEFECT).  

  **35–45 min: Round 4 (Known Partners, Lossy Digest)**  
  - Pair visibly. Use Round 4 language.  
  - Write programs (5 min).  
  - Execute with digests.  
  - **Prediction:** Some try `READ_DIGEST MY_DIGEST IF_EQ` → cooperation if digests match (rare).  

  **45–50 min: Tally Points & Award Prize**  
  - Sum points; announce top scorer.  

  **50–85 min: Debrief (Map Moments to Concepts)**  
  - **What happened?**  
    - Round 1: "Copycat worked! How?" (Point: Conditioning on *disposition*, not action.)  
    - Round 2: "Unknown partners didn’t kill cooperation? Why?" (Point: Transparency enables precommitment.)  
    - Round 3: "Why did cooperation collapse with one mutation?" (Point: Self-reference is brittle.)  
    - Round 4: "Why was cooperation harder with digests?" (Point: Full source > coarse proxies.)  
  - **Formal Takeaways:**  
    - **Program Equilibrium:** A pair where each is a best response to the other (e.g., copycat vs. copycat → mutual COOP; `ALWAYS_DEFECT` vs. itself → mutual DEFECT).  
    - **Self-Reference Load-Bearing:** `SELF` enables symmetry checks; real-world recursion theorems hide this.  
    - **Skeptic Relocated?** "We ‘solved’ the PD by assuming perfect transparency—but does that exist outside this game?" (Cue final discussion.)  
  - **Q&A Handles:**  
    - *"Isn’t this just Kant/golden rule?"*  
      - "Golden rule assumes shared values; this requires *exact* symmetry. Kant’s universal law doesn’t need code access—here, transparency forces alignment."  
    - *"Could this work in real life/AI?"*  
      - "In humans: Reputation/contracts approximate transparency but are noisy. In AI: If systems verify each other’s code, yes—but mutations (Round 3) or lies break it. This is a *possibility proof*, not a blueprint."  

  **85–90 min: Wrap-Up**  
  - "So: Defection isn’t inevitable in theory—but it demands unrealistic transparency. Next week: How close can real institutions get?"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Syntax Errors:** Programs crash → DEFECT.  
     - *Fix:* Sandbox log catches errors; allow quick rewrites pre-execution.  
  2. **Slow Compilation:** 8 pairs take too long.  
     - *Fix:* 3 student compilers (you handle sandbox); run 2 pairs/compiler (4 min max).  
  3. **Token Limits Ignored:** Students write verbose programs.  
     - *Fix:* Token-count during writing; >40? DEFECT automatically.  
  4. **Sandbox Overuse:** Delays rounds.  
     - *Fix:* Limit to 3 Qs/round; batch similar queries.  

  ---

  ### **What the Activity Can’t Replicate**  
  **The Recursion Theorem:** In formal models, programs generate self-referential code without an explicit `SELF` opcode (using quines). Here, `SELF` is a cheat—you’ll need to say:  
  > "In theory, self-reference emerges from fixed-point theorems—no magic `SELF` required. We simplified for speed, but that’s the spooky part hiding in the math."  

  ---  
  **Run it Thursday—students will leave arguing!**
