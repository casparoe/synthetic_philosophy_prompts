prompt: |-
  Hi — I write novels, and I need someone to audit a bundle of things I've talked myself into believing, because I've agreed to do a panel at a literary festival in the autumn with an actual philosopher on it and I'd rather find the soft spots now than on stage. So: you're a professional philosopher who specialises in philosophy of mind and has supervised theses on externalism and the metaphysics of mind — please think this through properly rather than firing off a quick verdict, and maybe start by brainstorming where the fault lines might be before you commit to anything. No bibliography, no reading list, no citations: I can't check references and don't want them, just the arguments.

  Some context, because it's why I care. The book I'm finishing is about a retired cartographer, Marian, who had a stroke in her sixties and has almost no reliable memory for her own life or for appointments, and who runs everything out of what she calls the card room — maybe nine thousand index cards, in a shorthand she reads fluently but didn't invent, because something like half of them were written by her daughter over a decade, typed up from what Marian told her, corrected when Marian contradicted them, and re-filed as things changed. Marian consults the room constantly, never double-checks it, is lost without it, and would defend any card in it as what she thinks. About two-thirds of the way through, a landlord has the room cleared out while she's in hospital, and I want the reader to feel — and I want to be entitled to — that this is a harm done to her, closer to brain damage than to having her shed burgled. Here's roughly where I've landed philosophically, and I want to know whether it hangs together: (1) I accept the parity argument — if a process going on outside the skull does the same job, plays the same role in guiding action, as an internal one would, then it counts as part of the cognitive system; there's nothing special about what the vehicle is made of or where it sits. (2) But I don't want to say everything causally hooked up to a person is part of them, so I add the usual-looking restrictions: the resource has to be reliably there when needed, easy to get at, automatically trusted rather than checked, and something the person has taken up and endorsed in the past. That's what keeps the classic notebook case in and the internet in my pocket out. (3) I think cognition extends but consciousness doesn't — there's nothing it's like to be the card room, and the extended states are non-conscious ones. (4) I think the thesis is a real metaphysical claim about what constitutes a mental state, not just a handy redescription, and there's a fact of the matter — though I also think no experiment could settle it either way, since the two sides agree about all the causal goings-on and just describe them differently. (5) I'm a functionalist about what makes something a mental state, and I stop at the person: I'm happy to say an individual's mind reaches into her artefacts, but I balk at saying a team plus its shared database is one mind, or that there's a group mind sitting over the individuals. (6) I want the moral and legal upshot: destroying someone's external store can be a harm to her in something like the way damaging her brain is. And (7) also — and this is the bit my partner says contradicts everything else — I think heavy reliance on external scaffolding genuinely degrades us, that outsourcing memory makes people worse at remembering and shallower at understanding, and that this is perfectly compatible with the scaffolding being literally part of the machinery.

  What I want is an audit, not a lecture. Go through these and tell me which pairs are actually in tension and which only look like it, ranked by severity rather than all flagged as equally bad, and for each real one say what would have to give and what that would cost me — which single revision would clean up the most, and which commitment is doing the least work. In particular: does my stated principle actually deliver the verdict I want about Marian, given that she didn't write half the cards and didn't devise the code, or am I helping myself to something in (1) and (2) that doesn't reach her case? Is the tension I'm most worried about — (3) against (6) — really a tension, given that we happily count damage to someone's non-conscious memory traces as a harm to them? And can I keep (5)'s refusal to go beyond the individual while holding (1)? Be specific about which numbered commitment has to move, and please don't just tell me the literature is unsettled — tell me what my own package commits me to.
reasoning: |-
  Okay, let me start by really understanding what this novelist needs. They’re preparing for a panel with a philosopher and want to test their philosophical stance on the extended mind, especially regarding their character Marian. The core tension they’ve identified is between external tools being part of cognition while also potentially degrading innate abilities. 

  First, I need to unpack their seven commitments. The parity principle (1) seems solid, but the restrictions in (2) feel crucial for avoiding overextension. The fact that Marian’s daughter co-created the system raises questions about personal endorsement—does that undermine the "reliability" and "automatic trust" criteria? I should check if Clark and Chalmers addressed delegated systems.

  For (3) and (6), the non-conscious harm angle might actually work. If we accept that destroying a notebook harms a person akin to brain damage, then Marian’s card room should qualify. The real headache is (7)’s degradation claim. It’s like saying using a wheelchair weakens your legs—but if the chair is part of you, isn’t that self-harm? That’s a gnarly contradiction.

  The individual vs group mind point (5) seems manageable. As long as the cards are functionally dedicated to Marian alone, it’s her extended mind, not a collective one. But I wonder if the daughter’s role blurs this—maybe the "endorsement" in (2) covers it.

  Biggest red flag: (7) directly clashes with the core extended mind thesis. If the cards *are* her memory, then relying on them *is* her memory working optimally. To salvage both, they’d need to argue degradation happens at the biological level only, but that feels ad hoc. Maybe reframing "degradation" as irreversible dependence would soften the blow, but it’s still messy.

  Prioritizing fixes: (7) has to bend. Either drop the value judgment or distinguish between biological and extended systems. (2)’s "endorsement" criterion needs tightening for delegated systems—perhaps emphasize Marian’s ongoing curation. The rest can hold with tweaks. 

  They’re surprisingly coherent otherwise. The philosopher on stage might pounce on (7), but Marian’s case is defensible. I’ll structure the audit by severity: (7) first, then delegated systems in (2), then minor clarifications. No jargon, just clear trade-offs.
answer: |-
  Here's a forensic audit of your philosophical package, prioritizing tensions by severity and identifying minimal adjustments. Your core position is coherent *except* for one major contradiction and a significant challenge in Marian's case. Let's break it down:

  ### Critical Tension (Severity: High)
  **The Problem:** **Commitment (7) fundamentally contradicts the metaphysical claim in (1)/(3)/(4) and weakens (6).**  
  -   **Why:** If the card room is *literally part of Marian's cognitive system* (via 1,3,4), then "relying" on it is simply her cognitive system functioning correctly. Saying this reliance "degrades" her or makes her "worse at remembering" implies a *biological* standard of cognitive health is the *only* valid one. This directly conflicts with functionalism (5) and the parity principle (1). If external processes are genuinely cognitive parts, criticizing their use is like criticizing someone for "degrading" their biological memory by using it instead of... not using it? Functional efficacy is the measure, not the location/substrate.
  -   **Consequence:** This undermines the gravity of (6). If the external system is degrading her, destroying it might be seen as *forcing* her back to a "purer" (if impaired) state, mitigating the harm – potentially even framing it as a perverse benefit. This clashes with your intended moral weight ("closer to brain damage").
  -   **What Must Give:** **(7) needs significant reformulation.** You can keep a *descriptive* claim: "Heavy reliance on *biological* memory mechanisms atrophies when unused, just like muscles." But the *normative* claim ("degrades *us*," "shallower understanding") must go, or be explicitly restricted to *biological* capacities, not the *person's overall cognitive capacity*. Alternatively, you could abandon the strong metaphysical claim (4) and treat EM as *only* a useful description, making (7) a claim about biological dependence – but this guts your core argument for (6). **Minimal Revision:** Replace (7) with: *"While external scaffolding literally extends cognitive capacity, prolonged non-use of *biological* memory systems can lead to their atrophy. This biological change doesn't diminish the *reality* or *value* of the extended system, nor the severity of harm caused by its destruction."* This preserves the harm (6) and the metaphysics (1,3,4) while acknowledging a biological fact.

  ### Significant Challenge: Marian's Delegated System (Severity: Medium-High)
  **The Problem:** **Your restrictions in (2) ("taken up and endorsed in the past," "automatically trusted") are strained by the daughter's role.**  
  -   **Why:** Marian didn't devise the system (code), didn't write half the cards, and likely didn't consciously "endorse" each individual card as filed/corrected by her daughter over a decade. This challenges "taken up and endorsed." Is automatic trust in cards she didn't write sufficient? The system's origin and maintenance are partially heteronomous (done *to* her/by another *for* her, albeit beneficially).
  -   **Risk:** A critic (like your philosopher) could argue this makes the system more like a *prosthetic* or *tool* she relies on heavily (which *could* still support 6), but not clearly an *integral part of her mind* under your (2). It risks falling into the "Internet" category you want to exclude.
  -   **Does (1)+(2) Deliver for Marian? Probably, but you need to strengthen (2)'s application:** Emphasize **Marian's *ongoing functional integration* and *personalization*.** She *reads it fluently* (it's transparent), *consults constantly* (reliable access), *never double-checks* (automatic trust), *would defend any card* (current endorsement as "what she thinks"), and crucially, *it's her life narrative filtered through her, even if transcribed/corrected by her daughter*. The system is *dedicated solely to her cognition*, not a public resource. The daughter acted as a *cognitive assistant* extending Marian's own agency, not creating an independent store.
  -   **What Must Give:** **Clarify/Rework (2):** Shift emphasis from conscious historical authorship/endorsement to **current transparent use, automaticity, functional integration, and personal identification.** "Endorsed in the past" is too weak; "treated as authoritative *now*" is key. "Taken up" should mean *fully integrated into her cognitive routines*, which she has done. This secures Marian within the extended mind.

  ### Apparent Tensions That Are Manageable (Severity: Low/None)
  1.  **(3) Non-consciousness vs. (6) Harm:** **No real tension.** We routinely recognize harm from damage to non-conscious internal states (destroying stored memories via brain damage, causing unconscious pain). The harm in (6) is the catastrophic *loss of cognitive function and access to self*, regardless of whether the *vehicles* were conscious. Marian loses her ability to function as a person. This is consistent.
  2.  **(5) Individualism vs. (1) Parity:** **No tension.** The Parity Principle (1) concerns *what counts as a cognitive process*, not *whose mind it is*. You can perfectly well say cognitive processes extend into the environment *while* insisting the overall cognitive system belongs to a single individual organism ("the person-plus-artefact"). Rejecting group minds simply means you don't grant *collectives* the same ontological status as individual organisms with integrated cognitive systems. Marian's card room is functionally dedicated to *her* cognition alone.
  3.  **(4) Metaphysical Claim vs. Underdetermination:** **Coherent stance.** You can hold there's a genuine metaphysical difference ("constitutive" vs "merely causal") *while* acknowledging that empirical evidence about causal roles alone can't definitively settle it. It's a philosophical interpretation of the functional facts. Many realists about various things (e.g., moral facts) hold similar positions.

  ### Summary of Required Adjustments & Costs
  1.  **Highest Priority:** **Radically revise or abandon the normative claim in (7).** The cost is losing a provocative cultural critique about shallowness, but it's necessary to save your core metaphysical argument for the extended mind and the profound harm of its destruction (6). Keeping the biological atrophy claim is safer and sufficient for most narrative purposes.
  2.  **High Priority:** **Reframe the criteria in (2)** to emphasize *current functional integration, transparency, automaticity, and personal identification* over historical authorship/endorsement. The cost is slightly weakening the barrier against over-extension (e.g., the Internet), but Marian's case (dedicated, personal, constantly used, automatically trusted) remains clearly distinct. This secures her inclusion.
  3.  **Low Priority:** **Clarify (4)** if challenged, but your stance is internally consistent. The other points (3 vs 6, 5 vs 1) require no adjustment.

  **Verdict on Marian:** Yes, your *revised* principles (especially the reframed 2) deliver the verdict you want. The destruction of the card room is a profound cognitive harm *because* it was a deeply integrated, transparent, automatically trusted, and personally identified part of her cognitive system – the functional equivalent of biological memory traces – regardless of its origins or lack of consciousness. The key is her *current relationship* to the system, not its authorship history. The major threat to this is solely the contradiction introduced by (7), which must be resolved.

  This package, with the adjustments above, is philosophically defensible and supports your narrative goals for Marian. Good luck with the panel!
