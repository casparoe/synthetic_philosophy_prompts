  **Joint Statement on the Allais Paradox**

  **1. The Allais Pairs**

  To ensure clarity, we explicitly state the Allais pairs under discussion:

  - **Pair 1**: 
    - Option A: $1,000,000 with certainty.
    - Option B: A lottery yielding $1,000,000 with probability 0.89, $5,000,000 with probability 0.10, and $0 with probability 0.01.

  - **Pair 2**:
    - Option C: $1,000,000 with probability 0.11 (and $0 with probability 0.89).
    - Option D: $5,000,000 with probability 0.10 (and $0 with probability 0.90).

  The commonly observed pattern is a preference for A over B and for D over C. This pattern violates the independence axiom of expected utility theory because no assignment of utilities to the monetary outcomes ($0, $1,000,000, $5,000,000) can simultaneously satisfy both preferences as maximizing expected utility.

  **2. Agreed Claims**

  We, the undersigned, agree on the following substantive claims:

  1. The Allais pattern of preferences (A over B and D over C) is a violation of the independence axiom of expected utility theory under the standard interpretation of outcomes as the final monetary amounts.

  2. The Allais pattern does not, by itself, establish that expected utility theory is false or inapplicable; it only shows that the pattern is inconsistent with expected utility maximization under a single utility function defined solely over final monetary outcomes.

  3. Violating an axiom of a normative theory (such as expected utility) does not automatically constitute irrationality; it may instead indicate that the theory is missing a relevant feature of the decision context.

  4. The independence axiom is not derivable from the other axioms of expected utility theory (completeness, transitivity, continuity) without additional assumptions.

  5. The independence axiom is equivalent to the requirement that preferences over lotteries depend only on the final outcome distributions and not on the process by which uncertainty is resolved.

  6. The violation of independence in the Allais pattern depends crucially on how coarsely outcomes are individuated. If outcomes are described more finely (e.g., by including the emotional impact of receiving a particular outcome or the context of the choice), the pattern may be consistent with an expected utility representation that incorporates these additional dimensions.

  7. In a one-shot choice, the Allais pattern can be stable and reflectively endorsed by an agent without any immediate contradiction.

  8. When the same preference is embedded in a sequential decision tree, the independence axiom violation can lead to dynamic inconsistency if the tree is set up to exploit the violation (e.g., through a series of choices that allow for re-description).

  9. The Allais pattern does not necessarily imply that the agent assigns a special value to certainty as such; it might instead arise from other psychological factors such as probability weighting (e.g., overweighting small probabilities, underweighting near-certainties), disappointment aversion, or the salience of the common branch.

  10. The pooling argument (see section 3) and the rescaled Allais (see section 4) are relevant thought experiments that can help clarify the nature of the disagreement.

  11. Rationality does not require that an agent must always maximize expected utility with a utility function defined only over final outcomes; it may allow for other decision rules that incorporate additional features.

  12. The independence axiom, if accepted, imposes a strong constraint on how preferences must be formed across different decision contexts.

  **3. Examination of Key Setups**

  We now address two setups that both parties agree bear on the dispute.

  **3.1 Pooled Allais**

  *Setup*: Two hundred people each face one of the Allais pairs exactly once, with no communication. All payoffs are paid into a common pot and divided equally in cash afterwards. The group is large enough that each person's share may be treated as the average payoff of the group. 

  *Question it is meant to settle*: Whether the Allais pattern of preferences is rational when the agent cannot secure certainty by their own act and when their individual contribution to the overall pot is negligible.

  *Independence Defender's prediction*: A reflective participant, understanding that the group outcome is determined by the aggregate choices, would choose in a way that maximizes the expected value of the common pot (or the expected utility if risk aversion is considered). Therefore, for Pair 1, the participant would choose B (the risky option) because it has a higher expected monetary value (1.39 million) than A (1 million). For Pair 2, D would be chosen over C for the same reason. Thus, the Independence Defender predicts that the reflective participant would not exhibit the Allais pattern and would instead choose consistently with expected utility maximization. If the Allais pattern were observed in this setup, it would count as evidence against the rationality of that pattern.

