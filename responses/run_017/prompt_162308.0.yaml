  Hmm, the user's situation is complex. They're facing a high-stakes academic presentation with a room full of specialists who each have distinct concerns. The paper seems clever but vulnerable—especially that self-application problem where their own theory might debunk itself. 

  First, let's map the audience threats:
  - The two naturalist realists will hate that they give any ground to debunkers. 
  - The biology/cognition experts will attack the "Pleistocene adaptation" premise as outdated. 
  - The religion comparativist might force uncomfortable parallels. 
  - The political philosopher needs practical solutions for applied ethics. 
  - The constructivist will challenge the truth-tracking framing itself.

  *scratches head* The self-debunking worry is the most dangerous—if their jurisdictional distinction is itself an out-of-domain judgment, the whole structure collapses. But admitting this upfront might be suicide in a job talk. Maybe frame it as methodological? Like "this is a map, not part of the territory"? 

  For the prep sheet: gotta prioritize objections by likelihood and damage. Lead with the naturalists (they'll pounce first), then the empirical folks, save the constructivist bomb for last. The self-application issue... maybe bury it in the "honest weakness" notes unless directly asked. 

  *checks clock* User needs 8-10 objections with 90-second replies. Key moves:
  - To naturalists: "Debunkers force this dilemma; I'm minimizing their win" 
  - To biologists: "Cultural evolution needs baseline capacities!" 
  - To pol phil: "Calibrated extension isn't perfect but better than intuition" 
  - Absolute no-concede: truth-tracking assumption (or the project dies)

  Biggest publication hurdle is probably the displacement test's arbitrariness. If that falls, the jurisdictional boundary vanishes. 

  *sigh* This is brutal. Wish I could tell them to skip the talk and run. But since they can't: armor-plate the replies, flag weaknesses internally, and hope the committee values ingenuity over airtightness.
answer: |-
  Here’s your targeted prep sheet, ordered by likely sequence of objections and tailored to your audience. I’ve flagged concessions, non-negotiables, and the critical objection for publication. Weaknesses are noted honestly.

  ---

  ### **1. Naturalist Realist #1**  
  *Objection (irritated):* "Why treat 'no available explanation' as a *defeater*? This sounds like a lazy appeal to mystery. If we lack an evolutionary story for moral truth-tracking, that’s a *research gap*—not grounds for skepticism. You’re conceding too much to debunkers."  
  **Reply:** "The debunker’s dilemma forces a choice: either accept unexplained correlation (which *is* epistemically suspicious) or accept dependent facts (which undermines realism). I’m *limiting* their win to cases where we lack even a *possible* tracking story. In-domain judgments have plausible tracking mechanisms (e.g., reciprocity detection). Out-of-domain judgments don’t—and 'wait and see' isn’t a stable position when intuitions are our only evidence."  
  **Weakness:** Concedes the dilemma has force. If they reject the dilemma entirely, this reply fails.  

  ### **2. Naturalist Realist #2**  
  *Objection (suspicious):* "Your 'ancestral domain' looks politically convenient. Why should we trust *your* displacement test? It seems engineered to debunk cosmopolitan duties while preserving parochial ones—exactly your prior commitments."  
  **Reply:** "The displacement test is empirical: does the judgment’s content *require* social dynamics absent in small-band environments (e.g., mass institutions)? We can disagree on cases, but the criterion is falsifiable—e.g., if we found Pleistocene evidence of concern for unseen millions, I’d adjust. This isn’t about my politics; it’s about cognitive mismatch."  
  **Weakness:** Test relies on contested paleoanthropology. Gerrymandering charge sticks if cases feel arbitrary.  

  ### **3. Philosopher of Biology / Cognitive Scientist**  
  *Objection (dismissive):* "The moral faculty isn’t a frozen Pleistocene module! Cultural evolution generates novel capacities—e.g., norm psychology scales to large groups. Your 'mismatch' claim is unfalsifiable just-so storytelling."  
  **Reply:** "I agree culture extends moral reasoning—but it builds on ancestral *foundations*. Calibrated extension *uses* those foundations (e.g., suffering-avoidance). My point is: intuitions about radically novel contexts (e.g., carbon emissions on 2300 AD) aren’t *reliably* truth-tracking because they lack evolutionary or cultural scaffolding. Show me the cultural learning mechanism for intergenerational justice, and I’ll refine the domain."  
  **Weakness:** Underplays how quickly culture can build new "domains."  

  ### **4. Political Philosopher (Search Chair)**  
  *Objection (impatient):* "If we can’t trust intuitions about institutions or climate policy, what *do* we do *now*? 'Calibrated extension' sounds like a vague thought experiment—not actionable for real-world ethics."  
  **Concede in Talk:** Address this *before* Q&A! Say: "For out-of-domain cases, we *must* shift from intuition to structured reasoning. Calibrated extension chains surviving principles (e.g., 'reduce suffering') to empirical facts (e.g., 'CO2 emissions cause famine'). It’s not perfect, but better than extrapolating corrupted intuitions."  
  **Reply if Pressed:** "We use the best available moral tools—consequentialism, contractualism—grounded in in-domain values plus science. Yes, it’s fallible, but so was relying on debunked intuitions."  
  **Weakness:** Feels like a retreat to "standard" theories; replacement procedure needs fleshing out.  

  ### **5. Religion Debunker Colleague**  
  *Objection (probing):* "If moral psychology gets a 'jurisdictional' pass for in-domain judgments, why not religious belief? Tribal animism was adaptive—doesn’t your framework protect *it* from debunking?"  
  **Reply:** "Religious beliefs often make claims *outside* their ancestral context (e.g., omnipotent creators). The displacement test would ask: did Pleistocene cognition track *theistic* truths? Probably not—unlike reciprocal fairness, which had clear fitness payoffs. But if some religious belief (e.g., 'rituals appease local spirits') stays in-domain, *yes*, it might survive. That’s a feature, not a bug."  
  **Weakness:** Risks alienating naturalists; implies adaptive beliefs get a free pass.  

  ### **6. Constructivist Generalist**  
  *Objection (fundamental):* "Your whole project assumes moral judgment is a *truth-tracking faculty*. But if morality is constructed through social practices, ‘debunking’ is misguided—there’s no independent truth to track!"  
  **DO NOT CONCEDE.**  
  **Reply:** "My argument is internal to realism: *if* you’re a realist, debunking arguments force this jurisdictional retreat. Constructivists avoid this problem—but they face their own challenges (e.g., explaining objectivity). I’m offering realism’s best defense."  
  **Critical Point:** If this objection lands, your project collapses. Hold the line.  

  ---

  ### **7. The Self-Application Bomb**  
  *Objection (you hope nobody asks):* "Isn’t your *own* theory—the ancestral-domain distinction—an out-of-domain judgment? By your criteria, it’s a highly abstract claim about cognitive evolution, developed centuries after the Pleistocene. So isn’t it self-debunking?"  
  **Damage:** Severe. If unaddressed, it undermines coherence.  
  **Least-Bad Reply:** "The distinction is *descriptive*, not moral. It’s a scientific hypothesis about moral cognition (like evolutionary psychology generally), justified by evidence—not intuition. We’re not *trusting* moral faculty outputs; we’re *studying* its history. Calibrated extension applies only to *moral* judgments, not empirical claims."  
  **Weakness:** Feels ad hoc. If metaethics is "empirical," why isn’t all philosophy?  

  ---

  ### **Key Strategic Notes**  
  - **Preempt:** Concede the political philosopher’s "what now?" objection *during the talk*.  
  - **Never Concede:** The constructivist’s objection. Your reply must be firm: "This is for realists."  
  - **Publication-Survival Objection:** The **displacement test’s arbitrariness** (#2). If reviewers see the domain as gerrymandered, the paper dies. Strengthen with cross-cultural/anthropological evidence.  
  - **Q&A Order Prediction:** Realists (first, loudest) → Scientists (empirical pushback) → Political/Applied (practical concerns) → Constructivist (late, foundational).  
  - **Self-Application:** If asked, use the "descriptive vs. moral" reply. If unasked, *do not volunteer it*.  

  **Final Tip:** Open by saying, "I’m not endorsing debunking; I’m *containing* it." This pre-soothes realists. Good luck—your framing is clever, and the room’s tension means they’re engaged.
