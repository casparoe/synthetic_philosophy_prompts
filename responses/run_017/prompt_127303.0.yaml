  Throughout, I'll use British spelling and direct phrasing as requested. When the procedure yields uncomfortable outcomes (like advising against naming in their own community's case), I'll state it plainly but contextualise why - not hiding behind jargon. The tone must remain clinical while acknowledging these aren't abstract exercises; that ministerial speech in scenario (3) likely names people they know.

