  The output will resemble a field manual entry - compressed, actionable, with explicit breakpoints. For scenario (3), I'll note the bitter irony: sometimes the most legally clear cases must remain unspoken to protect those documenting them. That's the unbearable calculus of tiny documentation outfits.
answer: |-
  Here's a procedural framework for genocide designation decisions, designed for your constraints. It separates the *legal/moral assessment* from the *naming decision*, specifies halting points, flags value judgments, and evaluates your heuristics. British English throughout.

  **Genocide Designation Decision Procedure (48-Hour Timeline)**

  **Phase 1: Legal/Moral Test Assessment ("Does it Meet the Threshold?")**
  *(Objective: Determine if the evidence meets the modified Lemkin/Convention threshold. Halts with "No" if any step fails.)*

  1.  **Protected Group?**  
      *   *Question:* Is the targeted group identifiable based on nationality, ethnicity, race, or religion? (Include groups defined *by the perpetrators* or by clear cultural markers).  
      *   *Sufficient Evidence (48h):** Multiple independent witness reports, perpetrator statements, or reliable documentation identifying the group *as such*. Media, NGO, or official reports consistently referencing the group.  
      *   *Halt:* If group identity is ambiguous, contested with strong counter-evidence, or primarily political/social. (e.g., "government opponents" alone - No).

  2.  **Acts Listed in Art II (or Cultural Destruction - Lemkin)?**  
      *   *Question:* Are acts occurring that constitute:  
          (a) Killing members of the group;  
          (b) Causing serious bodily or mental harm;  
          (c) Deliberately inflicting conditions of life calculated to bring about physical destruction;  
          (d) Imposing measures intended to prevent births;  
          (e) Forcibly transferring children;  
          **OR (Lemkin Extension):**  
          (f) Systematic destruction of the group's essential cultural institutions/practices/ways of life, rendering continued group existence *as such* impossible?  
      *   *Sufficient Evidence (48h):** Direct evidence (photos, video, medical reports for a,b) or clear, corroborated patterns (c,d,e,f). Multiple sources reporting specific acts. Satellite imagery for destruction (c,f). For (f): Targeting of core cultural pillars (ritual sites, leaders, knowledge systems, economic base *integral to identity*).  
      *   *Halt:* If acts are widespread but random violence, primarily property destruction without cultural/survival link, or lack a *systematic* pattern against the group.

  3.  **Specific Intent to Destroy ("as such, in whole or in part")?**  
      *   *Question:* Is there evidence the perpetrators intended to destroy the group *because of its identity*, in whole or in a *significant/substantial* part? (Assess "in part": Focus on strategic importance - e.g., leaders, symbolic location, critical mass - not just raw numbers).  
      *   *Sufficient Evidence (48h):** Requires *converging lines* from:  
          *   *Perpetrator Statements:* Orders, speeches, manifestos, graffiti, communications explicitly targeting the group *as such* for destruction/elimination. (Leaked manual, speech - high value).
          *   *Pattern of Conduct:* **Use Heuristic: CAMPAIGN-SHAPE INTENT (Keep, but Fix):**  
              *   Fix: Require *at least two* of: Scale/Systematicity; Targeting Specificity (only/primarily this group); Method (methods used imply destruction); Context (historical persecution, dehumanising rhetoric); **Outcome** (actual impact on group viability). *Sufficient if strong on 2+ without direct statements.*
          *   *Context:* History of persecution, dehumanising rhetoric, exclusionary ideology against the group.  
      *   *Halt:* If intent appears opportunistic, driven by immediate tactical goals (e.g., clearing land for non-destructive purpose), retaliatory without genocidal aim, or primarily political (remove opposition, not the group *as such*). Lack of converging evidence after rigorous search. **Use Heuristic: SWAP TEST (Keep, but Fix & Contextualise):**  
          *   Fix: Frame as *"Could a member realistically escape targeting by instantly and completely abandoning their group identity (not just changing behaviour), and does the perpetrator logic/action reject this possibility?"* (e.g., "Stop being Tutsis" vs. "Stop supporting rebels"). *Not sufficient alone, but a strong indicator when affirmative.* Bin if used mechanistically.
      *   *Value Judgment Point:* Interpreting "significant part" and "intent" from context/pattern when no smoking gun. Requires analyst judgment call based on totality of evidence. Note uncertainty.

  **Phase 2: Naming Decision ("Should We Say the Word?")**  
  *(Objective: Assess consequences of using "genocide" in this specific note. No halting; culminates in Board decision informed by this assessment.)*

  4.  **Legal Threshold Met?**  
      *   *From Phase 1.* If "No", naming decision is moot (use "crimes against humanity", "ethnic cleansing", or descriptive terms). Proceed only if Phase 1 = "Yes".

  5.  **Impact on Victims/Survivors?**  
      *   *Question:* Will naming genocide:  
          a) **Aid** (e.g., validate suffering, mobilise crucial support, deter further atrocities)?  
          b) **Harm** (e.g., increase targeting, deepen divisions, undermine other narratives/needs, favour one survivor group over rivals)?  
      *   *Assessment (48h):** Consult field staff (if safe/quick), known survivor rep positions (acknowledging rivalry), analyse likely reactions based on context. Err on caution if harm seems likely and aid speculative. *Value Judgment:* Balancing validation vs. risk.

  6.  **Operational Risk?**  
      *   *Question:* Will naming genocide significantly increase risk to:  
          a) Field staff/researchers (arrest, violence, expulsion)?  
          b) The organisation's ability to operate in the area/collect future evidence?  
      *   *Assessment (48h):** Concrete threat assessment based on country context, perpetrator behaviour, source protection needs. *Absolute Halt for Staff Safety:* If high likelihood of severe harm to staff (e.g., Scenario 3 researchers). *Value Judgment:* Weighing evidence dissemination against operational continuity.

  7.  **Strategic Effect?**  
      *   *Question:* Will naming genocide likely:  
          a) **Mobilise** essential political/financial support for victims or accountability?  
          b) **Trigger** harmful backlash (e.g., denial campaigns, funding cuts, state retaliation)?  
          c) **Distort** the response (e.g., focus solely on "genocide" label obscuring other crimes/needs)?  
      *   *Assessment (48h):** Analyse donor/government sensitivities, media landscape, potential for misuse. *Value Judgment:* Pragmatic assessment of likely real-world effects beyond core morality.

  **Output to Board:**  
  *   Phase 1 Conclusion (Met/Not Met + Key Evidence/Uncertainties).  
  *   Phase 2 Assessment (Risks/Benefits of naming for Victims, Operations, Strategy).  
  *   **Recommendation:** Use "Genocide" / Use Alternative Term (specify) / Describe Acts Only.  
  *   **Board Decision:** Signs off on the note's final wording based on *both* legal assessment and naming considerations.

  **Simplification & Misfires:**  
  *   **Survives Simplification:** Core distinction between intent to destroy a group *as such* vs. other motives. The fundamental gravity of the label.  
  *   **Doesn't Survive / Misfires:**  
      *   Nuances of "in part" (strategic vs. numerical). Misfire: Under/over-inclusion.  
      *   Lemkin's cultural destruction vs. Convention's physical focus. Misfire: Calling cultural genocide too easily, or missing it entirely.  
      *   Separating legal fact from naming consequence perfectly. Misfire: Letting consequences dictate the legal assessment, or ignoring consequences entirely.  
      *   Survivor unanimity. Misfire: Assuming one voice represents all.  
      *   Immediate operational impact. Misfire: Ignoring safety, or being silenced by low-probability threats.

  **Heuristic Verdict:**  
  *   **Swap Test:** **Keep, but Fix & Contextualise.** It's a useful *indicator* of group-targeting logic, especially for distinguishing identity from conduct. Fix: Clarify it's about *irreversible identity*, not just behaviour. Contextualise: Never use it alone; integrate into pattern-of-conduct analysis.  
  *   **Campaign-Shape Intent:** **Keep, but Fix.** Essential for inferring intent without direct orders. Fix: Require *multiple converging indicators* (scale, specificity, method, context, outcome) as specified above. Strengthens robustness.

  **Scenario Application:**

  1.  **Pastoralist Community:**  
      *   *Phase 1:* Protected Group (Likely Yes - distinct ethnic/livelihood identity). Acts: (c) Inflicting destructive conditions? (f) Cultural Destruction? (Yes - poisoning wells/destroying herds targets *pastoral* existence, pushing into towns prevents it. Specific Intent? Campaign-Shape: Systematic, targets only pastoralists, destroys basis of life, outcome is end of pastoralism in area. Swap Test: Can't stop being pastoralist by instant act. **Threshold Likely Met (Lemkin Cultural Destruction).**  
      *   *Phase 2:* Naming might aid recognition/mobilisation. Risk of backlash? Depends on perpetrator sensitivity. Distortion? Might overshadow other needs but core crime is identity destruction. **Recommendation:** Use "Genocide" (cultural destruction) with explanation if space. Board decides weight of consequences.

  2.  **Religious Elders/Shrines:**  
      *   *Phase 1:* Protected Group (Yes - religious). Acts: (a) Killing, (b) Harm? (f) Cultural Destruction? (Targeting elders/shrines attacks core cultural/religious knowledge). Specific Intent to destroy group *in part*? "In part" assessment is key: Are these elders/shrines *strategically vital* to the group's survival *as such*? (e.g., sole holders of indispensable ritual knowledge for group cohesion/identity? Scale: Few hundred out of a million is numerically small, but could be qualitatively significant. Campaign-Shape: Specific targeting of irreplaceable cultural figures/institutions. Swap Test: Can't stop being an elder/knowledge holder instantly. **Uncertain/Value Judgment:** Qualitatively "significant part"? Leans towards Threshold Met if knowledge loss is catastrophic for group identity.  
      *   *Phase 2:* Naming could validate specific cultural targeting. Risk of distorting scale? Possibly. **Recommendation:** If Phase 1 deemed Met, use "Genocide" with qualifier ("targeted destruction of essential cultural/religious leadership"). If uncertain, use "Crimes Against Humanity - Persecution" + detailed description.

  3.  **User's Community (Leaked Manual/Minister Speech, Researcher Risk):**  
      *   *Phase 1:* Protected Group (Yes). Acts: (Assume sufficient evidence). Specific Intent: Leaked manual + speech likely provide *direct evidence* meeting threshold. **Threshold Clearly Met.**  
      *   *Phase 2:* Impact on Victims: Likely validating but potentially inflames tensions with rival associations. Operational Risk: **HIGH & UNACCEPTABLE.** In-country researchers face arrest. Strategic Effect: Might mobilise support, but triggers immediate, severe retaliation against staff. **Value Judgment:** Staff safety is paramount.  
      *   **Recommendation:** **DO NOT USE "GENOCIDE"** in the public note. **Output:** Use strongest alternative ("Crimes Against Humanity - Extermination/Persecution"; "Acts indicative of Genocide" *IF* safe in context? Often not). Detail acts and perpetrator statements *without the G-word*. Brief trusted partners privately if safe/necessary. **This is the answer you won't like:** The legal test is met, but the consequences of naming, specifically the near-certain severe harm to your researchers, make public use of the term operationally and ethically untenable. The procedure forces this difficult but necessary prioritisation of human safety over public labelling, however justified legally.

  This procedure provides a structured, evidence-driven path within 48 hours, separates legal assessment from consequence analysis, flags judgment calls, incorporates your heuristics cautiously, and confronts hard choices directly.
