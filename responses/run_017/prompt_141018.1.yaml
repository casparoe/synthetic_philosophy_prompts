prompt: |-
  I have just come out of a long and, towards the end, rather heated Sunday afternoon argument with a friend about whether any of the classical Indian epistemology I have been reading on the side does work that an ordinary evidence committee is not already doing, and I want to settle it by trying to use it. Please answer as a professional philosopher who knows the pramāṇa literature properly and who also has some feel for how real committees behave: be blunt where my framing is muddled, and correct me where I have the doctrine wrong. Before you set out anything procedural, spend a few hundred words thinking freely about where this translation is most likely to break, and let that shape what you build.

  The setting. I chair the Evidence and Assurance Panel of the national screening advisory body. We meet monthly, we see about forty proposals a year, and each gets roughly half a day. The panel is mixed: two clinicians, an epidemiologist, a laboratory director, a health economist and two lay members who cannot be handed anything with Sanskrit in it. For every proposal we must return exactly one verdict — ADOPT, PILOT, SUSPEND or DECLINE — and we must minute, in a paragraph the Board can read without us present, which of our reasons were evidential and which were judgements about acceptable harm. Recommendations go to the Programme Board and then to the Department, they are public, and they are occasionally challenged in public. Anything I hand the panel has to be runnable in the time available, has to fit on one side of A4 at twelve point, and must not require arithmetic the lay members cannot follow.

  The reason I dragged Indian epistemology into the argument is that our proposals pretty much sort into four kinds of support, and — as it happens — those four look like the four knowledge sources the Nyāya school is standardly said to accept: our own monitoring and audit data (perception); epidemiological and statistical evidence, usually observational (inference); national and international guideline documents and the expert witnesses who defend them (testimony); and, very often, an argument from what happened in another health system (comparison or analogy). My friend, who is an epidemiologist and a sceptic about anything that smells like theory, says the mapping is decorative: that we are just talking about data, studies, authorities and precedents, that what actually matters is effect sizes and intervals, and that nothing in this literature could change a single verdict we have ever issued. I think she is wrong but I could not say precisely where.

  So: write me the procedure, not another exposition. Concretely, I need the following.

  First, the inference test. I have been trying out an operational version of the three marks of a good reason: is the marker present in the case at hand; is it present in cases where the outcome does occur; and is it absent where the outcome does not. Give me that as a check the panel can actually run, tell me what counts as a sufficient answer to each of the three, and give me plain-English versions of the two failure modes I find most useful — the straying or irregular reason, where the marker also turns up without the outcome, and the reason that is defeated outright by a better source. Say what the panel should write down when it finds each.

  Second, and this is where the argument got stuck. On one reading, a cognition stands as knowledge until something specific defeats it; on another, it needs positive warrant before it counts. My friend says we either trust and then look for defeaters, or we demand warrant up front, and that the first is laziness in a nice costume. My memory of the texts is that the Nyāya position is subtler than either — that validity is not self-certifying for them, and yet they still run something like innocent-until-reasonably-challenged. Settle this for the panel: which regime should we run, should we switch regime by decision class (irreversible versus reversible harms, population-scale versus contained), where exactly does the switch sit, who authorises it, and what does a challenge have to consist in to count as one rather than as a vague worry?

  Third, testimony and chains. Our evidence is constantly second- or third-hand: a partner organisation's audit, cited in a guideline, cited by an expert. My own invention is a transmission register with a depth rule — the further a claim has travelled from whoever actually saw the thing, the more it has to be shored up. Tell me whether that is the right shape, and press on the case I cannot settle: a national guideline is not a person's word but a collective artefact with its own procedures, so the usual account of a reliable speaker seems to fit it badly. Does a chain inherit the strength of its first link, or can an institution add strength of its own?

  Fourth, conflict between sources. Give me the ordering rule for when two sources disagree, and the meta-rule I take to be the interesting one — that a standing conflict between two sources is itself evidence that one of them carries a defect, and that the job is to locate the defect rather than to average the two.

  Fifth, reasoning from absence. A great deal of what we do rests on nothing being there: no signal in the safety register, no harms reported, no excess mortality in the audit. I gather the later classical authors argued about whether knowledge of an absence needs a source of its own or is a case of something else. Give me the test the panel should apply — I would guess something like a detectability condition, that the thing would in fact have turned up if it were there — and tell me how demanding that condition has to be.

  Sixth, hypothetical reasoning. Sometimes the strongest thing in the room is a counterfactual: if this did not work, we could not be seeing what we are seeing. My understanding is that such reasoning is standardly treated as an auxiliary rather than a fifth source, able to clear doubt away but not to establish anything positive, and I want that built into the procedure as an explicit rule about what the panel may and may not certify. If the tradition is divided on whether it yields knowledge, say where the weight of the position lies and what turns on it for us.

  Throughout, mark the points where judgement cannot be eliminated, where the procedure stops with a no, and where it must hand the decision to the Board because the question is one of values rather than evidence.

  Then run it on three real-shaped proposals.

  One: a blood-based biomarker panel proposed as a triage test before colonoscopy for patients with bowel symptoms. The main study is a large case–control study with an impressive odds ratio, but the comparison group was drawn from healthy blood donors rather than from symptomatic patients who turned out not to have the disease. There is also a specialist society's endorsement and a favourable line in an international guideline. The clinicians on the panel want ADOPT. My suspicion is that the procedure says SUSPEND, and I would like to see whether it says that for the reason I think.

  Two: lowering the starting age for bowel screening from fifty to forty-five, supported by a neighbouring health system's ten-year experience, against our own two-year pilot which shows no mortality difference but was powered only to detect a very large effect. Which source defeats which here, and what changes if the defect turns out to be in our own monitoring data rather than in the analogy?

  Three, and this is the one where I expect to dislike the answer: extending screening to a much rarer condition where a randomised trial cannot be had, because prevalence is too low and the comparison arm would be denied an established service. The only real support is that the stage distribution in our pilot is inexplicable if the test does not work. Everyone on the panel is convinced, I have already minuted that I intend to recommend ADOPT, and I suspect a properly built procedure tells me I may not. Show me what it should return, and what the minute to the Board should say instead.

  Finally, be honest about what this cannot do. The account of inference I am borrowing was built for conclusive ascertainment, whereas everything we handle is probabilistic, and I want to know whether the translation survives that gap and what it costs us if it does. And settle the argument I started with: tell me which parts of the four-source taxonomy are doing real work in the procedure, and which are, as my friend claimed, decoration on top of what we were already doing.
reasoning: |-
  Hmm, this is a fascinating and complex request about applying classical Indian epistemology (specifically Nyāya pramāṇa theory) to real-world evidence assessment in healthcare policy. The user chairs an Evidence and Assurance Panel that makes high-stakes screening decisions, and wants concrete procedures derived from Nyāya epistemology to improve their process. 

  First, I need to acknowledge the core tension: Nyāya was designed for individual knowledge claims, while the panel deals with probabilistic population-level evidence. The user recognizes this gap but wants to push the experiment. Their four evidence types map neatly to pratyakṣa (perception), anumāna (inference), śabda (testimony), and upamāna (comparison), but the epidemiologist friend dismisses this as decorative. I'll need to show where the taxonomy adds value beyond surface labeling.

  For the inference test (three marks of hetu), I should reframe it for probabilistic contexts. The "straying reason" (savyabhicāra) becomes about confounding variables, while "defeated reason" (bādhita) maps to superior evidence overriding weaker claims. The panel needs clear failure conditions they can document - e.g., "Marker present in 30% of controls → straying reason".

  On the warrant vs. defeasibility debate: Nyāya's "innocent until reasonably challenged" (prāmāṇyavāda) fits the panel's need for efficiency, but requires strict standards for what counts as a "challenge." I'll define this as a specific, evidence-based objection meeting three criteria: source credibility, mechanistic plausibility, and material consequence. The switch to "warrant-first" should trigger for irreversible harms - a values-based decision the Board must authorize.

  For testimony chains: Institutional sources like guidelines aren't just "reliable speakers" but epistemic artifacts. Their strength comes from both original data (first link) and methodological rigor in synthesis (added strength). The transmission register should track not just steps but transformation types - aggregation, interpretation, simplification - with risk scores for each.

  On conflict resolution: The key isn't averaging but diagnosing why sources disagree. Is it temporal mismatch? Population differences? Methodological flaws? The meta-rule should force explicit defect-hunting before decision-making.

  Absence evidence needs a strict detectability condition: "Would absence reliably manifest?" For safety registers, this requires auditing reporting completeness. The panel often misses this, leading to false negatives.

  Counterfactuals can only refute, never confirm - a crucial constraint. "If it didn't work, we wouldn't see X" only holds if all other explanations are eliminated, which is rare.

  For the test cases: 
  - The biomarker study fails on three marks (healthy controls = straying reason) despite testimony support. SUSPEND.
  - Lowering screening age: The foreign analogy is defeated by our underpowered pilot's inability to detect moderate effects - unless we find our data is flawed, then testimony temporarily wins.
  - The rare condition case is hardest. Stage distribution is circumstantial at best; without positive warrant from other sources, DECLINE is epistemically required despite moral desire to act.

  The real value of the taxonomy is forcing source-specific scrutiny: testimony demands chain analysis, comparison requires similarity-weighting, etc. But probabilities break Nyāya's binary logic - we must accept "qualified knowledge" (viśiṣṭajñāna) as the output. 

  Ultimately, the procedure's strength is making implicit scrutiny explicit, not changing outcomes. The friend is right that effect sizes remain central, but wrong that the framework is decorative - it structures how we interrogate those numbers.
answer: |-
  Your challenge cuts to the heart of translating classical epistemology into operational policy. The friction points are real: Nyāya’s framework was built for *pramā* (valid cognition), not probabilistic evidence, and its "four sources" aren’t rigid boxes but dynamic tools for defeasible justification. Below, I distill the procedure, mark its breaking points, then test it. **Bold terms** are your panel’s plain-English equivalents.

  ---

  ### Where Translation Breaks
  1.  **Binary vs. Probabilistic:** Nyāya seeks *nirṇaya* (definitive ascertainment). Your evidence is inherently uncertain. We’ll treat "sufficient warrant" as *practical certainty for decision-context*.
  2.  **Individual vs. Institutional Cognition:** Testimony (*śabda*) assumes a reliable *speaker*. Guidelines are institutional artifacts—we’ll reframe reliability as *process rigor*.
  3.  **Absence as a Source:** Later Nyāya (e.g., Gaṅgeśa) treats absence (*anupalabdhi*) as perception-based. Your "no signal" requires active *detectability conditions*.
  4.  **Defeasibility Thresholds:** Nyāya’s "innocent until challenged" (*svataḥ prāmāṇyavāda*) applies only to *apparently* valid cognition. We’ll define "apparent validity" strictly.

  ---

  ### The Procedure: One-Page Checklist for Panel Deliberation  
  *(Header: "Evidence Source Interrogation – Nyāya-Derived Framework")*

  **I. SOURCE CLASSIFICATION & INITIAL VALIDITY**  
  Classify each evidence strand:  
  - **PERCEPTION (P)**: Direct audit/monitoring data *from your system*.  
  - **INFERENCE (I)**: Statistical/epidemiological studies (observational or experimental).  
  - **TESTIMONY (T)**: Guidelines, expert statements, literature syntheses.  
  - **COMPARISON (C)**: Analogies from other health systems.  

  *Validity Presumption*: P/I/T/C are *provisionally valid* **only if**:  
  - P: Data collection method documented & auditable.  
  - I: Study design minimizes bias (pre-set criteria: e.g., cohort > case-control; adjusted confounders).  
  - T: Source has transparent development (e.g., GRADE methodology), no conflict of interest.  
  - C: Comparator system is *structurally similar* (e.g., population health, resources).  
  *Else, source is "contested" – requires warrant before use.*  

  **II. THE INFERENCE TEST (For I & C)**  
  *Apply to each key inferential claim (e.g., "Marker predicts cancer")*:  
  1. **Marker Presence (Pakṣa Dharma)**: Is the marker observed in the target group?  
     *Sufficiency: Yes, with measurement error quantified.*  
  2. **Co-Presence (Sapakṣa Sattā)**: Is marker linked to outcome where outcome *is* known?  
     *Sufficiency: Effect size (OR/RR) > X [pre-set threshold; e.g., 2.0], CI excludes null.*  
  3. **Absence in Failure (Vipakṣa Asattā)**: Is marker *absent* where outcome is absent?  
     *Sufficiency: Specificity > Y% [pre-set; e.g., 80%], or significant negative association.*  

  *Failure Modes*:  
  - **Straying Reason (Savyabhicāra)**: Marker present without outcome (e.g., low specificity).  
    *Minute: "Inference invalid – marker occurs frequently in non-disease groups."*  
  - **Defeated Reason (Bādhita)**: A superior source contradicts (e.g., RCT vs. case-control).  
    *Minute: "Inference overruled by [source type] showing contrary evidence."*  

  **III. WARRANT vs. DEFEASIBILITY REGIME**  
  - **Default**: Presume validity until *specific, evidence-based challenge* (Nyāya’s *svataḥ prāmāṇyavāda*).  
  - **Switch to Warrant-First** when:  
    - Harm is irreversible (e.g., cancer overdiagnosis leading to surgery).  
    - Decision affects population scale (>100k people).  
    - *Switch authorized by Chair + Clinician Lead. Must be minuted.*  
  - **Valid Challenge Requires**:  
    - A credible source (P/I/T/C meeting initial validity) showing material contradiction.  
    - OR demonstration of a fatal flaw (e.g., confounding bias in I, comparator mismatch in C).  
    *Vague worries (e.g., "gut feeling") are inadmissible.*  

  **IV. TESTIMONY CHAINS & INSTITUTIONS**  
  - **Transmission Depth Rule**:  
    - Direct testimony (T1): Original study/audit cited.  
    - Indirect (T2/T3): Guideline citing study, expert citing guideline.  
    - *Burden of Proof*: Each transmission step must show **no value distortion**.  
      - T2/T3 require: (a) Original source accessible, (b) Interpretation justified in document.  
  - **Institutions add strength IF**:  
    - Their synthesis method is rigorous (e.g., systematic review vs. consensus).  
    - *Minute: "Guideline strength derived from [method], not original data alone."*  

  **V. CONFLICT RESOLUTION**  
  - **Source Hierarchy**: P (your data) > I (high-quality) > T (rigorous) > C > I (low-quality).  
  - **Meta-Rule**: Persistent conflict *is* evidence of **source defect**.  
    - *Panel must identify defect*:  
      - P: Data quality issue (audit trail broken?).  
      - I: Confounding/method flaw (re-run inference test).  
      - T: Misinterpretation in transmission (apply depth rule).  
      - C: Poor analogy (dissimilar systems?).  
    - *Never average*; downgrade weaker source.  

  **VI. REASONING FROM ABSENCE**  
  - **Test**: Absence is valid **only if** detectability is confirmed:  
    - *The event would likely be observed if present* (e.g., safety register has high coverage, reporting compliance >90%).  
    - *Minute: "Absence accepted due to [detectability metric]."*  
  - **Demandingness**: Threshold scales with risk. For high harm (e.g., mortality), require:  
    - Active surveillance (not passive reporting).  
    - Statistical power to detect plausible effect size.  

  **VII. HYPOTHETICAL REASONING**  
  - **Rule**: Counterfactuals ("If not X, we wouldn’t see Y") **cannot establish ADOPT**.  
    - They may **defeat doubts** (e.g., "No other explanation is plausible").  
    - *Minute: "Hypothetical supports rejecting [alternative], but does not confirm benefit."*  
  - **Weight of Tradition**: Nyāya treats this as *tarka* (suppositional reasoning) – auxiliary to core sources. Never sufficient alone.  

  **JUDGEMENT CALLS & HANDOFFS**  
  - **Subjective Thresholds**: Effect size (I), similarity (C), detectability (Absence). *Set these in advance*.  
  - **Procedure Stops at "No"**: If a source fails validity or inference test, exclude it.  
  - **Hand to Board When**:  
    - Evidence is balanced but harm/benefit tradeoffs require value judgment (e.g., SUSPEND vs. PILOT).  
    - *Minute: "Uncertainty in evidence; decision hinges on risk tolerance."*  

  ---

  ### Test on Real Proposals  
  **Proposal 1: Biomarker Triage Test**  
  - **I (Inference)**: Case-control with healthy donors → Fails *Vipakṣa Asattā* (marker not tested in symptomatic non-disease). *Straying reason*: Biomarker may be present in non-target conditions.  
  - **T (Testimony)**: Guideline endorsement → Valid but *defeated* by flawed inference.  
  - **Verdict**: SUSPEND. Minute: *"Inference invalid due to non-representative control group. Testimony insufficient without direct evidence in target population."*  

  **Proposal 2: Lower Screening Age**  
  - **C (Comparison)**: Neighbouring system’s data → Initially valid (structurally similar).  
  - **P (Perception)**: Your pilot → Fails *detectability* for absence (underpowered).  
  - **Conflict**: P does *not* contradict C; it’s silent. But P’s flaw means C stands.  
  - **If P Defective**: Downgrade P. C remains, but requires support. *Verdict*: PILOT (collect adequate P).  
  - **Minute**: *"Analogy valid but unconfirmed; pilot expanded to detect moderate effects."*  

  **Proposal 3: Rare Condition Screening**  
  - **Hypothetical**: "Stage distribution inexplicable without benefit" → *tarka*.  
  - **No P/I/T/C** meets warrant.  
  - **Verdict**: DECLINE. Minute: *"No positive evidence from core sources. Hypothetical cannot certify benefit; risk of harm unquantified. Board may consider ethical override."*  

  ---

  ### What This Cannot Do  
  1.  **Probabilistic Gap**: Nyāya demands binary validity; you have confidence intervals. Cost: We force "sufficient warrant" thresholds (e.g., 95% CI excluding null). This is a philosophical patch.  
  2.  **Friend’s Challenge**: The taxonomy **does real work** in:  
      - Forcing source-specific scrutiny (e.g., transmission chains for T, detectability for absence).  
      - Structuring conflict resolution (not averaging, but defect-hunting).  
      - Banishing hypotheticals as primary evidence.  
      - **Decoration?** Labels like "perception" add little. The *tests* (inference, transmission, detectability) are the value.  

  **Settlement**: Your friend is right that effect sizes are core—but wrong that epistemology is decorative. Nyāya provides a **rigorous scaffold for interrogation** that reduces uncritical reliance on testimony, exposes analogical weaknesses, and checks inference beyond p-values. It systematizes what good panels do intuitively, catching lapses. Use it as a *discipline*, not an oracle.  

  ---  
  *Final note: This survives translation if you accept "qualified knowledge" (viśiṣṭajñāna) as the goal. It won’t make hard decisions easy, but it will make your reasoning harder to challenge.*
