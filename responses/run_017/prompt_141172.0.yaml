prompt: |-
  Hey — I'm a philosophy PhD student (mostly phil. mind / phil. cognitive science) and I'm putting together the handout for our reading group on higher-level causation. I want to run the whole thing through Hofstadter's careenium setup instead of the usual human case, because the human case drags in consciousness and qualia and I want that off the table for a couple of sessions.

  Recap for whoever ends up reading this: Careenia is made of some rubbery goo whose bits come in two flavors, plain balls and "simmballs". Simmballs clump into stable patterns, and some of those clumps are simms — structures you can read as symbols, that can be copied, mutated, recombined, and that are about things (a simm for a predator, a simm for a direction, whatever). So the question is whether the simm-level story does any causal work: when a simm gets a clump of simmballs to move, is that just our way of tracking the balls shoving each other around, or is the pattern itself doing some of the pushing?

  What I want from you is the spec, not the scoreboard. Before I assign another paper on mental causation / special-science causation / whatever, I want the list: what does an account of simm-level causation have to deliver to count as adequate — which cases it has to get right, which distinctions it can't collapse, which facts about the substrate it has to be consistent with — with the case or consideration under each one. To fix what "adequate" means: good enough to let me keep using symbol-level explanations in cognitive science (a representation caused the behavior, the plan drove the search) without that being hand-wavy, and good enough to say what an experiment on Careenia would even settle.

  Some things I think belong on the list, so you can tell me which are real requirements and which are just my own prejudices:

  - differentiate between a couterfactual-dependence test and a "who's really producing the motion" test, and say why we should care about the one we care about;
  - handle the scramble case — swap which simmballs realize the simm, keep the pattern, and the simm-level story doesn't budge — without that automatically making the simm causally idle;
  - handle near-misses: clumps that are structurally almost a simm but aren't about anything (junk patterns, malformed copies, a simm that's been mutated one step too far), and say which side of the line the causal work falls on;
  - handle two structurally identical clumps where only one has the history to be about something — does aboutness matter to the causation, or only the shape?;
  - say what I've started calling the read/write asymmetry: tons of patterns can be read off the substrate after the fact, but only some of them let you predict what the goo does next. Which ones, and why?;
  - the bookkeeping condition, as I've been calling it: the simm-level dynamics should be able to run on its own, without you having to peek at the balls to figure out the next simm state. Is that necessary for genuine simm-level causation, or is it just what a nonreductive physicalist wants for Christmas?;
  - not cheat: no extra shove added to the substrate's physics, but also no quiet slide into the simms being decorations, and no accepting that every single simmball movement has two independent sufficient causes.

  Also: mark which items are non-negotiable and which are preferences of one camp (I suspect "no overdetermination" is an identity-theory taste and "simm-level laws must be exceptionless" is a Fodor-ish taste, but tell me if I have it backwards), tell me which subset of the requirements can't all be satisfied together — that's the part I most want, since if the list itself is inconsistent that's the interesting result — and say which single requirement knocks out the most candidate views.

  Then, briefly, like three lines each max: how epiphenomenalism, a straight reductive identity story, the "the simm just is what the simmballs are doing" pattern view, an interventionist/difference-making account, and the "the simm is a program the substrate is running" view do against the list. I really do care much more about the criteria than the scoring — I can do the scoring myself once I know what I'm asking for. Page-ish is plenty, a table is fine, and please don't give me a reading list, I've got the canon, I just need to know what I'm supposed to be demanding of it.
reasoning: |-
  Okay, let's tackle this. The user is a philosophy PhD student focusing on philosophy of mind and cognitive science. They're preparing a handout for a reading group on higher-level causation using Hofstadter's Careenium thought experiment. The goal is to avoid the complications of consciousness and qualia by using this abstract model. They need a specification for what an adequate account of simm-level causation must deliver—essentially, the criteria to evaluate theories without getting bogged down in traditional human mind debates.

  The user has listed several points they think should be on the criteria list. I need to validate which are essential, which are optional or camp-specific, and identify any inconsistencies. Let me go through each point they mentioned:

  First, differentiating counterfactual dependence from "who's really producing motion" is crucial. In philosophy of causation, counterfactual approaches (like Lewis) are standard, but the user wants to know why we should prefer one over the other. This seems necessary to clarify the type of causation we're interested in—probably difference-making rather than physical production.

  Next, the scramble case: swapping simmballs but keeping the pattern. If the simm-level explanation holds, that suggests pattern matters more than substrate. This tests whether causation is tied to the higher-level pattern. It's a key requirement to avoid substrate-chauvinism.

  Near-misses involve structures that are almost simms but not quite. This tests the boundaries—does causal efficacy require full aboutness or just structure? This distinction is vital for defining when a pattern becomes causally active.

  Structurally identical clumps with different histories touch on whether aboutness (semantic properties) plays a causal role or if it's just syntactic structure. This is a major debate in philosophy of mind (e.g., Fodor on mental causation), so it's necessary to include.

  The read/write asymmetry addresses why some patterns are predictive. This seems central—if a pattern can't predict future states, it's epiphenomenal. This is likely non-negotiable for any account that wants simms to be explanatory.

  The bookkeeping condition requires simm-level dynamics to operate independently without checking the substrate. This might be a preference for autonomy of higher-level sciences but could be too strong. It's probably a nonreductive physicalist desire, not essential.

  "No cheating" rules: no extra physics, no epiphenomenalism, no overdetermination. Overdetermination is tricky—some theories (like Kim's exclusion argument) reject it, while others accept benign overdetermination. This might be camp-specific.

  Now, marking non-negotiables vs. preferences. Non-negotiables should include counterfactual relevance, read/write asymmetry, and handling scramble/near-miss cases. Preferences might include bookkeeping autonomy and strict no-overdetermination. 

  Inconsistencies: Possibly between bookkeeping autonomy (requiring simm-level laws) and substrate dependence. If simm dynamics must run independently but rely on substrate, that might conflict. Also, semantic aboutness vs. syntactic structure—if aboutness requires history but causation is structural, that's a tension.

  The requirement that might knock out most views is semantic aboutness vs. syntactic structure. If a theory requires aboutness for causation but can't explain how history plays a role without adding magic, it fails. Reductionist views might handle structure but not aboutness, while nonreductive ones struggle with exclusion.

  Now, assessing the candidate views briefly:

  - **Epiphenomenalism**: Fails counterfactual tests and read/write asymmetry. Simms don't cause anything; they're byproducts. Only handles near-misses by saying they're equally idle.

  - **Reductive Identity**: Treats simms as identical to simmball configurations. Handles scramble and near-miss by equating structure with causal power. May struggle with semantic aboutness if history matters.

  - **Pattern View**: Simms as patterns. Good with scramble and structure-based causation. Might collapse near-misses if structure is sufficient, ignoring aboutness. Read/write handled if patterns are predictive.

  - **Interventionist**: Focuses on difference-making. Simm causes if intervening changes outcomes. Handles scramble, near-misses by causal relevance. But might allow too much (e.g., non-about structures if they correlate).

  - **Program View**: Simms as computational states. Bookkeeping condition satisfied if substrate reliably implements. But semantic aboutness might be emergent and not directly causal, risking epiphenomenalism.

  The user's deeper need is to clarify the criteria so they can evaluate theories rigorously for their reading group. They want to avoid getting sidetracked by consciousness and focus on causal efficacy of higher-level properties. Identifying which criteria are essential and where tensions lie will help structure the discussion. Highlighting inconsistencies (like autonomy vs. dependence) and the toughest challenge (aboutness) provides focal points for debate.
answer: |-
  Here's a specification for an adequate account of simm-level causation in the Careenium, structured by your requirements. It distinguishes non-negotiables (marked **★**) from camp-specific preferences (*Italic*), identifies tensions, and notes which requirement is most disqualifying.

  ---

  ### **Adequacy Criteria for Simm-Level Causation**
  1. **Differentiate Counterfactual Dependence vs. Physical Production**  
     **★ Case**: When simm *S* causes motion *M*, altering *S* (while holding microphysical energy/momentum fixed) should change *M*, but altering micro-details (e.g., swapping one simmball) without changing *S* should not.  
     **Why care?** Science uses *difference-making* (counterfactuals) for explanation. Physical "production" is irrelevant if it doesn’t alter outcomes.  

  2. **Handle the Scramble Case**  
     **★ Case**: After swapping simmballs (same pattern, different substrate tokens), simm *S* still causes the same behavior. An account must explain why *S* (not the specific balls) is causal without making it epiphenomenal.  
     **Non-negotiable**: Otherwise, simms are just descriptive labels.  

  3. **Handle Near-Misses**  
     **★ Case**: A structurally identical clump to simm *S* but lacking "aboutness" (e.g., junk pattern) fails to cause *S*-typical effects. An account must explain why "aboutness" or semantic properties (not just structure) matter causally.  
     **Tension**: If structure alone suffices, near-misses should behave identically—but intuitively, they don’t.  

  4. **Handle Structurally Identical Clumps with Different Histories**  
     **★ Case**: Two identical clumps—one with a history making it "about" a predator, the other accidental—produce different behaviors (e.g., triggering evasion). An account must clarify if history/semantics contributes to causation or if only shape matters.  
     **Knockout requirement**: Most views fail here (see scoring below).  

  5. **Read/Write Asymmetry**  
     **★ Case**: Only *some* patterns (e.g., active simms in "working memory") predict future goo dynamics; others (e.g., background noise) don’t. An account must specify which patterns are *causally relevant* and why (e.g., their role in the system’s functional architecture).  
     **Non-negotiable**: Without this, simm-talk is just post-hoc interpretation.  

  6. **Bookkeeping Condition**  
     *Case*: Simm-level dynamics should be computable/predictable *without* tracking individual simmballs.  
     *Preference*: Nonreductive physicalists demand this for autonomous special sciences. Reductionists reject it as unnecessary.  

  7. **No Cheating**  
     - **★ No extra physics**: Simmballs obey only base-level physics.  
     - **★ No epiphenomenalism**: Simms must *do* something.  
     - **No systematic overdetermination**: *Preference* of identity theorists (Kim-style exclusion). Fodorians accept "benign" overdetermination if levels are distinct.  

  ---

  ### **Tensions & Inconsistencies**
  - **Bookkeeping vs. Substrate Dependence**: If simm dynamics *must* run independently (bookkeeping), but depend on substrate stability (e.g., no simmball decay), these may conflict under perturbation.  
  - **Semantics vs. Syntax**: If causation requires semantic "aboutness" (★3, ★4) but the substrate is syntactic (shapes/configurations), no purely structural account works.  
  - **Most Disqualifying Requirement**: **★4 (History/Aboutness)**. It forces accounts to either embrace "magical" semantics (e.g., teleosemantics) or deny its causal relevance (risking epiphenomenalism).  

  ---

  ### **Candidate Views: Brief Scoring**
  | **View**                          | **Scramble** | **Near-Miss** | **Identical Clumps** | **Read/Write** | **Bookkeeping** | **No Cheating** |  
  |-----------------------------------|--------------|---------------|----------------------|----------------|-----------------|-----------------|  
  | **Epiphenomenalism**              | ✗ (idle)     | ✗ (both idle) | ✗ (semantics idle)   | ✗ (no predict) | ✗               | ✓ (no physics+) |  
  | **Reductive Identity**            | ✓ (same token) | △ (if structure=function) | ✗ (history irrelevant) | ✓              | ✗               | △ (overdeterm?) |  
  | **Pattern View**                  | ✓            | ✗ (no semantics) | ✗ (no semantics)     | △ (if stable)  | △               | ✓               |  
  | **Interventionist (e.g., Woodward)** | ✓          | ✓ (causal role) | ✗ (same interventions) | ✓              | △               | ✓               |  
  | **Program View (e.g., computationalism)** | ✓       | △ (if malformed ≠ computable) | △ (history as state) | ✓              | ✓               | △ (overdeterm?) |  

  **Key**: ✓ = satisfies, △ = partial/mixed, ✗ = fails  
  - **Epiphenomenalism**: Fails ★2, ★3, ★4, ★5. Simms are inert labels.  
  - **Reductive Identity**: Handles scramble but collapses ★4 (history irrelevant). Struggles with semantics.  
  - **Pattern View**: Treats simms as causal patterns (★2, ★5) but ignores aboutness (fails ★3, ★4).  
  - **Interventionist**: Simms cause iff interventions change outcomes (★1, ★2, ★5). Still fails ★4 (same structure = same cause).  
  - **Program View**: Simms as computational states; handles bookkeeping and read/write. May treat history as state (★4) but risks overdetermination.  

  ---

  ### **Summary**
  - **Non-negotiables (★)**: Counterfactual efficacy (★1), scramble robustness (★2), semantics-sensitive near-misses (★3), history-dependent causation (★4), predictive asymmetry (★5).  
  - **Camp preferences**: Bookkeeping (nonreductionists), no overdetermination (reductionists).  
  - **Inconsistent triad**: (1) Causal efficacy requires semantics, (2) Semantics depends on history/structure, (3) Causation is local (no action-at-a-temporal-distance). ★4 forces a choice.  
  - **Test an experiment**: Manipulate simm *content* (e.g., mutate "predator" to "food") while holding structure constant. If behavior changes, semantics is causal (★4).  

  This spec sets a high bar: any adequate account must explain how *meaningful* patterns (not just structures) make a difference without overdetermining the substrate. The hardest nut is ★4—if history matters, causation isn’t "in the moment." Use this to pressure theories in your reading group.
