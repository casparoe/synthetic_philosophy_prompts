answer: |-
  1. **Setup and Materials**  
     For 6-9 pairs: Two boxes (A/B) per pair, one with a prize token (e.g., red chip), one empty; poker chips/beer tickets for payoffs; slips for "gut-check" ratings (1-10) and pens. Assign roles secretly per pair: "Knower" (sees truth), "Chooser" (picks a box), rotate roles midway. Facilitator randomly sets the prize location each round.

  2. **Rules and Payoffs**  
     Knower describes the boxes to Chooser, who then picks one. If Chooser picks the prize: they get 2 chips, Knower gets 0. If Chooser picks empty: Knower gets 3 chips, Chooser gets 0. In Round 1 (lying allowed), Knower can say anything. In Round 2 (misleading only), Knower must tell the truth (if caught lying, Knower gets 0, Chooser gets 2 automatically), and Chooser must interpret words literally (no "reading between lines"). Repeat with roles switched for Rounds 3-4. 5 minutes per round.

  3. **The Rule Changes**  
     After Round 1, impose the truth/literal rule for Round 2 (same roles). After switching roles, revert to Round 1 rules for Round 3, then re-impose truth/literal rule for Round 4. Emphasize enforcement: Facilitator spot-checks truthfulness in misleading rounds; any false statement voids Knower's payoff.

  4. **The Debrief**  
     Collect gut-check slips (ratings: Knower's "clean" feeling and Chooser's "played" feeling per condition). Show averages: Knowers typically rate misleading as "cleaner" than lying, but Choosers rate both as similarly "played." Map to philosophy: Lying (false statements) vs. misleading (true statements causing false beliefs). Ask: "Does the harm differ when the speaker lies versus tricks the listener's inferences? Where should blame fall?"

  5. **What Breaks and What the Game Can't Do**  
     Breaks: Rule enforcement in misleading rounds (Knowers may "test" truth limits; refocus on penalty). Choosers ignore literal rule (remind them). Time blows up (cap rounds at 4 mins). Game can’t: Prove moral equivalence—real-world factors (intent, relationships) aren’t simulated. You must say: "The game isolates harm, but ethics hinge on context it can’t capture, like power dynamics or justified deception."
