  A graduate student (row player) and a faculty advisor (column player) are collaborating on a research project. The student chooses the project type:  
  - **A**: Empirical project (works well in an empirical environment, fails in a theoretical one).  
  - **B**: Theoretical project (works well in a theoretical environment, fails in an empirical one).  
  - **C**: Compromise project (mediocre in either environment).  

  The advisor chooses the environment:  
  - **X**: Theoretical environment.  
  - **Y**: Empirical environment.  

  **Payoffs**:  
  - The student gets a high payoff (4) if the project matches the environment, 0 if it mismatches, and 1 for the compromise project.  
  - The advisor gets 2 for a successful project (A in Y or B in X), 1 for a failed project, 3 for the compromise in X (fits a grant), and 1 for the compromise in Y (does not fit).  

  ### Payoff Matrix
  |          | X         | Y         |
  |----------|-----------|-----------|
  | **A**    | (0, **1**) | (4, **2**) |
  | **B**    | (4, **1**) | (0, **2**) |
  | **C**    | (1, **3**) | (1, **1**) |

  *(Row payoffs first, column payoffs second)*

  ---

  ### Iterated Elimination Procedure

  **1. Pure-Strategy-Only Elimination (Stops Immediately)**  
  - **Row player (student)**:  
    - A vs. B:  
      - If column plays X: A=0 < B=4 → B better.  
      - If column plays Y: A=4 > B=0 → A better.  
      → Neither dominates the other.  
    - A vs. C:  
      - If X: A=0 < C=1 → C better.  
      - If Y: A=4 > C=1 → A better.  
      → No dominance.  
    - B vs. C:  
      - If X: B=4 > C=1 → B better.  
      - If Y: B=0 < C=1 → C better.  
      → No dominance.  
  - **Column player (advisor)**:  
    - X vs. Y:  
      - Against A: X=1 < Y=2 → Y better.  
      - Against B: X=1 < Y=2 → Y better.  
      - Against C: X=3 > Y=1 → X better.  
      → X not dominated by Y (since X > Y when row plays C).  
      → Y not dominated by X (since Y > X when row plays A or B).  
  **Result**: No strategies eliminated. All 6 outcomes survive.  

  **2. Mixed-Strategy-Allowed Elimination (Unravels to (A, Y))**  
  - **Step 1: Eliminate C via mixed strategy (50-50 A and B)**.  
    - Mixed payoff vs. X: \(0.5 \times 0 + 0.5 \times 4 = 2\).  
    - Mixed payoff vs. Y: \(0.5 \times 4 + 0.5 \times 0 = 2\).  
    - C’s payoff: 1 (vs. X and Y).  
    → \(2 > 1\) against both X and Y → Mixed strategy strictly dominates C. **Eliminate C**.  
  - **Step 2: Reduced matrix (A, B vs. X, Y)**:
    |          | X         | Y         |
    |----------|-----------|-----------|
    | **A**    | (0, 1)    | (4, 2)    |
    | **B**    | (4, 1)    | (0, 2)    |  
    - **Column player (advisor)**:  
      - Against A: X=1 < Y=2 → Y better.  
      - Against B: X=1 < Y=2 → Y better.  
      → Y strictly dominates X. **Eliminate X**.  
  - **Step 3: Reduced matrix (A, B vs. Y)**:
    |          | Y         |
    |----------|-----------|
    | **A**    | (4, 2)    |
    | **B**    | (0, 2)    |  
    - **Row player (student)**:  
      - Against Y: A=4 > B=0 → A strictly dominates B. **Eliminate B**.  
  **Result**: Unique survivor **(A, Y)**.  

  ---

  ### Key Feature of the Payoff Matrix
  The critical feature is **C’s constant payoff (k, k) vs. the mixed strategy’s payoff (2, 2)**. With A=(0,4) and B=(4,0), a 50-50 mix yields (2,2). For the mix to strictly dominate C:  
  - We require \(2 > k\) and \(2 > k\), i.e., \(k < 2\).  
  - **Largest integer k**: \(k=1\) (since \(k=2\) fails: \(2 > 2\) is false).  
  - **Non-integer k**: \(k=1.5\) works (\(2 > 1.5\)), but payoffs are integers here.  

  ### What If This Feature Changes?  
  - **If C’s payoff is (2,2)**:  
    - Mixed payoff (2,2) does **not** strictly dominate (2,2).  
    - No mixed strategy of A and B can dominate C (no probability \(p\) satisfies \(4(1-p) > 2\) and \(4p > 2\) simultaneously).  
    → Procedure stalls; C survives, and no further elimination occurs.  
  - **If X is not dominated after eliminating C**:  
    - Example: Change (B,X) column payoff to 2 (so advisor prefers X for B).  
      - Reduced matrix: Against A: X=1 < Y=2 → Y better. Against B: X=2 > Y=2? → X not dominated.  
    → Procedure stalls; both X and Y survive, and (A,Y) is not uniquely selected.  

  ### Objection and Reply  
  - **Skeptic’s objection**: "Mixed strategies aren’t ‘real’ choices in a one-shot game. Players must pick pure actions, so only pure-dominance is valid."  
  - **Reply**: Iterated elimination is a **pre-play rationality test**. Even if players ultimately choose pure strategies, recognizing that C is always worse than a 50-50 mix (regardless of the opponent) means **no rational player would ever choose C**. Thus, eliminating C is justified as a step of cautious reasoning.  

  ---  
  *This setup cleanly demonstrates the power of mixed strategies in breaking ties in dominance reasoning, with a realistic scenario and minimal payoffs.*
