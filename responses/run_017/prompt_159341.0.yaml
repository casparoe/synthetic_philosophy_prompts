prompt: |-
  hey, so please act like a professional philosopher who specializes in ethics and film/media ethics, and think carefully about this instead of just agreeing with me — like, actually start by brainstorming four or five candidate principles before you commit to one, and be brutally honest about which of my gut calls your favourite principle *can't* save.

  Some context: I'm a junior, I'm in film club, and me and two friends are making a short film about a woman from our town who led a mill strike in 1912 (there's literally one photo of her and a bunch of newspaper articles that call her "the agitator"). We can't agree on what we're allowed to invent and it turned into a giant argument, so I wrote down my gut verdicts on a bunch of made-up cases to see if there's one principle behind them. All the movies below are invented so we don't get sidetracked by whether the real thing was any good. My half-baked principle going in is: dead people can't be harmed, so nothing we do to a dead person is wrong *to them*; the only things that matter are (a) hurting living people who loved them or who share their community, and (b) flat-out misleading the audience about what happened. I already think it's breaking but I can't tell where.

  (1) Limited series about a 1919 labour organizer: writers put a big rally speech in her mouth that she probably never gave, but every line is lifted from her own pamphlets and is stuff she definately believed — fine, honestly the point of the genre. (2) Biopic of a jazz singer who died in 1968, no kids, no surviving family anyone can find: the filmmakers invent a childhood sexual abuse as the explanation for her addiction, zero evidence, they just thought it made the arc work — really not fine, and I can't say who it harms, which is why I think my principle is broken. (3) Same movie, same filmmakers, invent a deathbed reconciliation with her sister when in reality they hadn't spoken in twenty years — also not fine but *way* less bad than (2), and I can't explain why, since both are just made-up events nobody can check. (4) Streaming special where an AI reconstruction of a dead comedian's voice tells new jokes written by a writers' room, with the estate's full legal permission and both kids on board, labeled as AI — not fine, and this one confuses me most because by my own principle it should be the *most* fine. (5) Movie about a still-living 94-year-old poet with dementia, depicting a real blow-up fight he had with his publisher in 1978 — feels totally different from everything above; he can't answer back now but he could have two years ago, and I feel like you'd have to ask somebody. Not fine as is. (6) Docudrama about a woman murdered in 2004 where the filmmakers use her actual diary entries, verbatim, as dialogue, over her family's objections — not fine, even though it's the truest thing on this list. (7) Film about an African woman who shows up in three colonial court records and nowhere else, where the filmmakers invent her inner life, her thoughts, her childhood, basically the whole movie — fine, maybe even morally required, which is weird because it's way more invention than (2). (8) Biopic where every single fact is right but they leave out that he abandoned his two kids, so the movie makes him look like a great dad — not fine, and I don't see how my principle says why, since nothing on screen was false. (9) Filmmakers rename a real guy "Dale" and change his job from dentist to insurance adjuster, but everyone in town knows exactly who Dale is — not fine, and the fake name makes it worse rather than better. (10) The one I flip-flop on: a civil rights biopic includes a private scene where he tells his wife he isn't sure the movement is worth it, based on one ambiguous line in a letter.

  My friend keeps using this term she made up, "second death" — when the invented version becomes the version everybody remembers, so the real person is unreachable — and I kind of like it but I dunno if it's doing any real work. So: give me the principle (or the two best candidates) stated precisely enough that I could apply it myself, say which of my verdicts motivated each clause, tell me which verdicts it forces me to drop, what it predicts for a case I haven't listed (try one), and what it says about our 1912 film specifically — we want to give her a made-up line to her daughter and a made-up romance with a newspaper reporter, and we can't agree if those are the same thing.
