  ### Decision Theory Quiz: What's Your Rationality Style?  
  *Answer based on instinct—no philosophy background needed! Each scenario is independent.*

  1. **The Damascus Dilemma (Baseline):**  
     You're in Damascus. Death (a near-perfect predictor) will be in the city it expects you in tomorrow. If you meet Death, you die (0 points). If you avoid Death, you survive (+1000 points). Fleeing to Aleppo costs $10 (if you survive, you net +990).  
     **A. Stay in Damascus**  
     **B. Flee to Aleppo**  

  2. **The Damascus Bonus:**  
     Same as #1, but fleeing *gives* you a $10 bonus (survival nets +1010).  
     **A. Stay in Damascus**  
     **B. Flee to Aleppo**  

  3. **The Unreliable Predictor (90%):**  
     Death is right 90% of the time. Fleeing costs $10.  
     **A. Stay**  
     **B. Flee**  

  4. **The Unreliable Predictor Reframed (10% Escape):**  
     Death has a 10% chance of being wrong. Fleeing costs $10.  
     **A. Stay**  
     **B. Flee**  

  5. **Lock It In:**  
     Tonight, you can pay $1 to lock in tomorrow’s choice (no backing out). Would you?  
     **A. Pay to lock in staying**  
     **B. Pay to lock in fleeing**  
     **C. Don’t pay—decide tomorrow**  

  6. **The Year-Long Game:**  
     This scenario repeats weekly for a year. Death predicts fresh each week.  
     **A. Stay every week**  
     **B. Flee every week**  
     **C. Flip a coin each week**  

  7. **The Predicted Coin:**  
     You consider flipping a coin to decide (heads = stay, tails = flee). Death predicts the coin perfectly. Flipping means certain death. Choosing manually gives a 0.1% survival chance (as in #1).  
     **A. Choose to stay manually**  
     **B. Choose to flee manually**  
     **C. Flip the coin anyway**  

  8. **The Control:**  
     No predictor. Death’s location is decided by coin toss *after* you choose. Fleeing costs $10.  
     **A. Stay**  
     **B. Flee**  

  ---

  ### Flowchart & Scoring Key  
  *Match your answers to the grid below. Tally points for each leaf (one point per match). Your highest score is your primary style; ties indicate a hybrid approach.*  

  | Question | Leaf 1 | Leaf 2 | Leaf 3 | Leaf 4 | Leaf 5 | Leaf 6 |
  |----------|--------|--------|--------|--------|--------|--------|
  | 1        | A      | —      | —      | A      | —      | —      |
  | 2        | B      | —      | —      | B      | —      | —      |
  | 3        | A      | —      | —      | A      | —      | —      |
  | 4        | A      | —      | —      | A      | —      | **‡**  |
  | 5        | C      | —      | C      | A/B    | —      | —      |
  | 6        | A      | —      | C      | A      | —      | —      |
  | 7        | A      | —      | C      | A      | —      | —      |
  | 8        | A      | —      | A      | A      | —      | —      |

  **‡ Leaf 6** often skips or answers randomly here.  
  **—** = No clear match (any answer possible).  

  #### How to Score:  
  - **Leaf 1 (A, B, A, A, C, A, A, A):** Prioritizes direct consequences. Ignores "clues" in your own choice.  
  - **Leaf 2 (No pattern):** Sees unsolvable conflict—no stable answer feels right.  
  - **Leaf 3 (—, —, —, —, C, C, C, A):** Beats predictors via randomness (dice, coins).  
  - **Leaf 4 (A, B, A, A, A/B, A, A, A):** Focuses on consistent rules, not one-off choices.  
  - **Leaf 5 (No pattern):** Believes rational thinking doesn’t converge here.  
  - **Leaf 6 (Random):** Rejects the setup as impossible or ill-posed.  

  #### Key Notes:  
  - **Unpullable Pairs:**  
    - **Leaf 3 vs. Leaf 4:** Both say "flip weekly" (Q6) and "flip coin anyway" (Q7). *Split by Q5*: Leaf 3 says "don’t lock in" (C); Leaf 4 locks in (A/B).  
    - **Leaf 1 vs. Leaf 4:** Agree everywhere *except Q2* (Leaf 1 flips to flee; Leaf 4 flees for the $1010 bonus).  
  - **Combinations Unoccupied:**  
    - **All-As or All-Bs:** Ignores predictor power (incoherent given near-perfect accuracy).  
    - **Inconsistent Lock-in (Q5):** Paying to lock in fleeing in baseline (A) but staying in bonus (B) is rare—no theory advocates it.  
  - **If Short on Space:** Cut Q7 (least diagnostic). Keep Q1, Q2, Q5, Q6, Q8.  
  - **Inconsistent Sheets:** Discard if Q3 ≠ Q4 (frame-sensitive) or Q8 = B (survival vibes > logic).  

  #### Results Panel Blurbs:  
  - **Leaf 1:** "You ignore what your choice reveals—only direct outcomes matter."  
  - **Leaf 2:** "These puzzles feel unsolvable; no answer balances clues and consequences."  
  - **Leaf 3:** "Your move: be unpredictable. Dice or coins are your rational choice."  
  - **Leaf 4:** "You optimize for rules, not acts. What if everyone knew your strategy?"  
  - **Leaf 5:** "Careful thought doesn’t always settle on one ‘best’ choice here."  
  - **Leaf 6:** "This setup is flawed—predictors this good can’t exist with these stakes."  

  ---  
  *Design Logic: Q2 does the heaviest lifting (flips the "logical" answer for 2 theories). Leaf 4 is most common among AI designers; Leaf 6 is rare but filters skeptics. Weights favor consistency: answer pairs (Q1/Q2, Q3/Q4) must align for non-null leaves.*
