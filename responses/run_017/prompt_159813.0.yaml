answer: |-
  Below is a requirements list for an adequate account of moral testimony tailored to **institutional action-guidance**, derived from your cases and constraints. Requirements are categorized by negotiability (Non-Negotiable = Core to institutional purpose; Negotiable = Context-dependent; Preference = Reflects specific philosophical camps). Each requirement includes the motivating case/consideration.

  ---

  ### **Requirements for an Adequate Account**
  1. **Action-Reason Assessment (Non-Negotiable)**  
     *Object of assessment*: Must evaluate whether/how moral testimony provides **action-guiding reasons** for institutional bodies (e.g., ethics committees, legislatures), not just justificatory status for beliefs.  
     *Case*: Institutional bodies must act under uncertainty. An account focused solely on belief justification (e.g., "Is this committee member justified in believing X?") ignores the practical necessity to weigh testimony as a reason *for decisions*.  

  2. **Layered Deference Analysis (Non-Negotiable)**  
     Must pinpoint **where reluctance attaches** in chains of deference (e.g., empirical fact → moral relevance → verdict), explaining why some layers resist testimony more than others.  
     *Case*: Layered deference (e.g., trusting a biologist that fish suffocation is wrong). Reluctance often centers on moral relevance/judgment layers; accounts must not treat "moral testimony" monolithically.  

  3. **Conceptual Transmission Capacity (Negotiable)**  
     Must address whether testimony can transmit **novel moral concepts** (e.g., moral status of AI) to agents lacking those concepts, or only deliver verdicts using existing concepts.  
     *Case*: Novel moral kinds (e.g., testimony that insects have moral status). Institutions encounter emerging ethical frontiers; neutrality here risks impracticality.  

  4. **Constitutive-Raportive Distinction (Preference: Communitarian/Care Ethics)**  
     Must distinguish between testimony that **tracks** moral facts (e.g., "This act is wrong") and testimony that **constitutes** them (e.g., "My community’s view makes it wrong for me").  
     *Case*: Constitutive deference (e.g., deferring to others about personal wrongs). Institutions must recognize when deference shapes the moral landscape (e.g., reparations decisions).  

  5. **Diachronic Unity Criterion (Negotiable)**  
     Must clarify whether deference to one’s past/future self is **continuous with interpersonal testimony** or a distinct phenomenon.  
     *Case*: Diachronic deference (e.g., trusting past-self’s written judgment). Institutions use precedents/policies; diachronic consistency affects legitimacy.  

  6. **Scaled Deference Constraints (Non-Negotiable)**  
     Must explain discomfort in **high-stakes, low-comprehension deference** (e.g., funding decisions) and whether it stems from stakes, comprehension gaps, or epistemic/agential limits.  
     *Case*: Deference at scale (e.g., donor trusting experts on interventions). Institutions routinely rely on specialized testimony; accounts must identify red lines.  

  7. **Credit Attribution Precision (Preference: Virtue Ethics)**  
     Must state if agents acting on testimony deserve **less/different credit** and whether this conflicts with epistemic justification.  
     *Case*: Credit and no double-counting. Institutional actors need clarity on responsibility (e.g., can a committee "own" a decision based on testimony?).  

  8. **Moral/Non-Moral Discrimination Test (Non-Negotiable)**  
     Must identify a **unique feature** of moral testimony (vs. aesthetic/prudential/mathematical testimony) OR defend its absence. Cannot assume symmetry without argument.  
     *Case*: Discrimination test. Institutions handle diverse testimony types; unexamined symmetry may misguide action.  

  9. **Disagreement Reduction Test (Negotiable)**  
     Must specify if moral testimony reduces to **general peer disagreement epistemology** or adds distinct constraints (e.g., due to irreducibly first-personal elements).  
     *Case*: Moral disagreement among testifiers. Institutions hear conflicting testimony; accounts must guide weight assignment.  

  10. **Anti-Skepticism Neutrality (Non-Negotiable)**  
      Must not presuppose **moral skepticism/relativism**; if entailed, must argue for it explicitly.  
      *Constraint*: Avoiding question-begging ensures the account’s viability for non-skeptical institutions.  

  11. **Internalism/Externalism Neutrality (Negotiable)**  
      Must either **remain neutral** on whether moral judgment necessarily motivates (internalism) or state its commitment.  
      *Constraint*: Institutions include diverse agents; internalism may over-restrict applicability.  

  12. **Group/Institutional Deference (Non-Negotiable)**  
      Must handle testimony from **groups, institutions, and diffuse sources** (not just individuals).  
      *Constraint*: Real-world institutions defer to panels, traditions, or organizations (e.g., a legislature trusting WHO guidelines).  

  ---

  ### **Additional Constraints Analysis**
  - **Tensions Between Requirements**:  
    The **Discrimination Test (8)** and **Continuity with General Testimony Epistemology** (implied in 9) likely conflict. If moral testimony requires unique features (e.g., grounded in non-cognitive states), it cannot be "ordinary testimony." This may force a **two-tier solution**: e.g., testimony justifies *action* but not *understanding*, satisfying institutional needs while accommodating pessimism about belief.  

  - **Genuine Requirements vs. Preferences**:  
    - **Non-Negotiables (1,2,6,8,10,12)** are genuine: They ensure institutional applicability, specificity, and neutrality.  
    - **Preference-based (4,7)** reflect virtue-ethical/communitarian concerns but are negotiable for institutions focused on outcomes.  
    - **Most Exclusionary Requirement**: **Discrimination Test (8)**. It forces accounts to reject symmetry (e.g., "moral testimony = scientific testimony") unless they can dissolve intuitive discomfort.  

  - **Settling the Dispute**:  
    Pessimism would be correct if **moral understanding requires first-personal grasp** (e.g., phenomenology of value perception). If empirical work showed moral concepts cannot be acquired/transmitted testimonially (cf. novel moral kinds), deference could only justify action, not belief/understanding.  

  ---

  ### **Scoring Candidate Accounts**
  **Summary Table**  
  | **Account Type**               | **Strengths**                                  | **Weaknesses**                                     |  
  |--------------------------------|-----------------------------------------------|---------------------------------------------------|  
  | **Understanding-First Pessimism** | Excels at 2 (layers), 3 (novel kinds), 8 (discrimination), 7 (credit) | Fails 1 (action-reasons), 6 (scaled deference), 12 (groups) |  
  | **Moral Expertise Skepticism**   | Strong on 8 (discrimination), 7 (credit), 10 (anti-skepticism) | Fails 1 (action), 6 (scaled), 12 (groups), 3 (concepts) |  
  | **Symmetry View**              | Aces 5 (diachronic), 9 (disagreement), 12 (groups) | Fails 2 (layers), 3 (concepts), 8 (discrimination), 4 (constitutive) |  
  | **Belief-Action Hybrid**       | Best at 1 (action), 6 (scaled), 12 (groups), 2 (layers) | Struggles with 7 (credit), 3 (concepts), 8 (discrimination tension) |  

  **Prose Evaluation**  
  - **Understanding-First Pessimism**: Treats moral understanding as non-transferable via testimony. Scores highly on locating layered reluctance (2), handling novel kinds (3), and credit attribution (7). However, it cannot provide action-guidance (1) for institutions, especially under scaled deference (6), and struggles with group testimony (12).  
  - **Moral Expertise Skepticism**: Denies robust moral experts. Excels at discrimination (8) and credit (7) but paralyzes institutions by rejecting testimony as a reason for action (1, 6) and ignoring group dynamics (12).  
  - **Symmetry View**: Treats moral testimony like empirical testimony. Strong on diachronic cases (5), disagreement reduction (9), and group deference (12). Fails utterly at discrimination (8), layered analysis (2), and constitutive deference (4), making it ill-suited for moral specificity.  
  - **Belief-Action Hybrid**: Splits justification (e.g., testimony justifies action but not belief/understanding). Best fit for institutions: licenses action (1), handles scaled deference (6), groups (12), and layers (2). But it strains credit attribution (7) and novel concepts (3), and its dualism may collapse under discrimination test (8) pressure.  

  ---

  **Conclusion**  
  An adequate account must center **action-guidance** (1), **deference granularity** (2,6,12), and **moral specificity** (8) while avoiding skepticism (10). The **Belief-Action Hybrid** best meets core institutional needs but faces unresolved tensions in credit and concept transmission. The **Discrimination Test (8)** is the linchpin: if moral testimony lacks unique features, symmetry views gain ground; if not, hybrid/pessimistic accounts dominate. Crucially, no existing family aces all requirements—your account must navigate these trade-offs.
