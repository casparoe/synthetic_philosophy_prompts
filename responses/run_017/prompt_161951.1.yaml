prompt: |-
  I run a small games-and-philosophy reading group — about a dozen of us, half philosophy postgrads, half games design students — and we keep going round in circles on whether video-game characters can matter morally. Everyone just announces a slogan ("it's only code", "if it can suffer it counts") and then we're stuck, so for the next session I want to hand out something that sorts people by what they say about cases rather than by which badge they'd pin on themselves. Could you build me a decision tree, with roughly eight branch questions ending in ten to fourteen leaves?

  Everyone starts from the same place — that some character's suffering or death is a genuine event in the fiction of the game — and then each node should be one concrete case with a yes/no or three-way answer, phrased so that nobody can guess which leaf it's steering them to (nothing as bare as "do you think NPCs are persons?"). The cases I really want in there: a companion in a story game who dies in a scripted battle and whom you could bring back by reloading an earlier save (does failing to reload wrong her, and does reloading un-wrong her?); a villager in a farming sim you can let starve by simply never buying the greenhouse upgrade she needs; a mercenary hired in a roguelike who was generated fresh by the game's algorithm on that run and who would never have existed at all if you'd walked a different route (so the Parfit-style non-identity wrinkle is doing the work, not just "you killed someone"); a character whose entire arc was cut before release and who survives only as unused data in the files; a modder-created companion installed on a few thousand machines; and a companion whose dialogue and mood are generated at runtime by a language model rather than written by any author. Each leaf should carry the name of the position if it has one (sentience or simulated-minds views, artefact and authorial-intention views, relation-to-actual-players views, person-affecting asymmetry views, type-versus-token views, and so on) or "unnamed" if nobody defends it, plus one line on its most awkward commitment — I especially want to see what the type-versus-token leaf has to say about aggregating a character's suffering across thousands of simultaneous playthroughs, and whether a character who dies in ninety per cent of runs is thereby worse off than one who dies in five.

  Please build it from the logical space rather than from a list of names: give me the questions first, then note which combinations of answers nothing actually occupies and say whether that's because the combination is incoherent, merely unattractive, or just unexplored, and flag any pair of leaves your tree genuinely can't seperate instead of inventing a question to force them apart. The distinctions that matter most for my purposes are: whether moral status comes apart from the question of which individual this even is; whether the player's reasons for killing (a speedrunner dispatching a companion to save forty seconds versus doing it out of cruelty) can change the verdict; and whether duties owed by the player come apart from duties owed by whoever designed or generated the character. Stick it on one side of A4 if you can, and add a short scoring key at the end so I can also run the same thing as a flat quiz next term.
reasoning: |-
  Okay, I'm looking at this request. The user runs a games-and-philosophy reading group that's stuck on whether video game characters can matter morally. They want a decision tree to sort people by their responses to concrete cases rather than slogans. 

  The cases they want included are quite specific: scripted companion death with reload option, a starving villager requiring player action, procedurally generated mercenary, cut-content character, modded companion, and AI-generated character. Each leaf should have position names and awkward commitments, with special attention to type/token views on aggregated suffering.

  This needs to handle several philosophical distinctions: moral status vs. identity, player intent, and designer/player duties. I'll need to build it from logical space rather than existing positions. 

  I'm considering how to structure the decision tree. Starting with the shared premise that events are fictionally real, the first question could be about the starving villager - whether failing to upgrade is wrong. This splits into paths based on why it might be wrong (or not). 

  For the scripted companion case, the key is whether reloading undoes the wrong. That connects to questions about persistence across playthroughs. The procedurally generated mercenary introduces the non-identity problem - whether creating then destroying is worse than not creating. 

  The cut-content character tests if potential existence matters. The modded companion examines scale and dependency. The AI character probes whether generation method affects status. 

  I need to ensure questions don't reveal which position they're steering toward. Each case should feel like a concrete scenario, not an abstract probe. 

  For the leaves, the type/token view will be interesting - if a character dies in 90% of playthroughs, is that character "worse off"? That might be one of the more counterintuitive positions. 

  The scoring key should map answers to positions without requiring the tree structure. I'll need to assign values to each answer option. 

  This should fit on one A4 page. The user wants it practical for their next session, so clarity and ease of use are priorities.
answer: |-
  Here's a decision tree designed to map the logical space around the moral status of video game characters, built from concrete cases and avoiding slogans. It generates 12 distinct positions (including "unnamed" ones), highlights awkward commitments, and focuses on your requested distinctions. It fits on one side of A4 and includes a scoring key for flat quiz use.

  **Decision Tree: Do Video Game Characters Matter Morally?**

  *(All cases assume the suffering/death is a genuine fictional event within the game's narrative.)*

  1.  **The Starving Villager (Farming Sim):** You can easily prevent a villager's starvation by buying the greenhouse upgrade (costing minimal in-game resources/time). You never buy it. She starves. Is this action wrong?
      *   A. **No, not wrong.** *(Go to Q2)*
      *   B. **Yes, it's wrong.** *(Go to Q3)*
      *   C. **It's *like* something wrong, but not truly wrong.** *(Go to Q4)*

  2.  **The Cut Content Ghost:** A character's entire story arc was cut before release. They survive *only* as unused data in the game files, inaccessible during normal play. Does this character have any moral status?
      *   A. **No.** *(Leaf: **Artefact Fundamentalism** - Awkward: Must deny any status to mods/LLMs unless widely known.)*
      *   B. **Yes, potentially.** *(Go to Q5)*
      *   C. **Only if someone discovers/activates them.** *(Leaf: **Actual Observer-Relation View** - Awkward: Status flickers in/out based on player discovery.)*

  3.  **The Save Scummer's Dilemma (Scripted Companion):** A beloved companion dies in a scripted battle. You can reload an earlier save to prevent it.
      *   a) If you *don't* reload, is that wrong *to the companion*?
          *   i. **No.** *(Go to Q3b)*
          *   ii. **Yes.** *(Go to Q6)*
      *   b) If you *do* reload and prevent the death, does this *undo the wrong* committed by letting them die in the first timeline?
          *   i. **No, the wrong still happened.** *(Leaf: **Irreducible Fictional Harm** - Awkward: Wrongs persist across erased timelines.)*
          *   ii. **Yes, the wrong is erased/avoided.** *(Leaf: **Player-Actualized Narrative View** - Awkward: Reloading becomes a moral duty for preventable harms.)*

  4.  **The Mercenary's Non-Identity (Roguelike):** A unique mercenary (generated *only* because you took a specific route) dies fighting for you. Had you taken a different route, *this specific mercenary* wouldn't have existed at all. Is creating them only for them to die worse than not creating them?
      *   A. **No, possibly better (they had a life, however short).** *(Leaf: **Person-Affecting Asymmetry (Weak)** - Awkward: Creating short, suffering lives for player benefit can be permissible.)*
      *   B. **Yes, creating them doomed them.** *(Go to Q7)*
      *   C. **It's neutral; existence/non-existence can't be compared.** *(Leaf: **Non-Identity Neutrality** - Awkward: No complaint from the mercenary, but creation feels exploitative.)*

  5.  **The Modder's Creation:** A unique companion character, created by a modder, exists only on a few thousand players' machines (not in the base game). Does this character have moral status?
      *   A. **No.** *(Leaf: **Authorial Origin View** - Awkward: Status depends entirely on official authorship, not player experience.)*
      *   B. **Yes.** *(Leaf: **Emergent Fictional Personhood** - Awkward: Status emerges from player interaction, regardless of origin.)*
      *   C. **Only proportional to player base size.** *(Leaf: **Aggregated Significance View** - Awkward: A mod character gains/loses status as players install/uninstall.)*

  6.  **The LLM Companion:** A companion's dialogue and moods are generated at runtime by an LLM, not pre-written. Does this *enhance*, *diminish*, or make *no difference* to their potential moral status compared to a scripted companion?
      *   A. **Enhances (more lifelike, autonomous).** *(Leaf: **Simulated Mind Sentience** - Awkward: Suffering in highly responsive AI NPCs *might* be worse than scripted.)*
      *   B. **Diminishes (less authorial intent, more artifice).** *(Leaf: **Authorial Intent Primacy** - Awkward: Even highly convincing AI characters lack true "soul".)*
      *   C. **No difference.** *(Go to Q8)*

  7.  **The Speedrunner vs. The Bully:** Consider killing a harmless, sentient-seeming NPC.
      *   a) Does it matter *why* you do it? (e.g., Cruelty vs. Saving significant time in a speedrun)
          *   i. **No, the act is wrong regardless of reason.** *(Leaf: **Deontological Fictionalism** - Awkward: Harming NPCs is always impermissible, even in games.)*
          *   ii. **Yes, intent/context matters.** *(Go to Q7b)*
      *   b) Does the *player's duty* stem from the *designer's intent*?
          *   i. **Yes, primarily.** *(Leaf: **Designer-Proxy Duty View** - Awkward: Player only wrongs the designer's vision, not the character.)*
          *   ii. **No, duty is to the character/simulation itself.** *(Leaf: **Direct Fictional Relation View** - Awkward: Duties exist even if designer intended harm/amorality.)*

  8.  **Aggregated Suffering (Type vs. Token):** Consider a character *type* (e.g., "Generic Soldier A").
      *   a) Is the *character token* (the specific instance in *your* playthrough) the only morally relevant entity?
          *   i. **Yes.** *(Leaf: **Token Particularism** - Awkward: Suffering of identical types in other playthroughs is irrelevant.)*
          *   ii. **No, the *type* matters too.** *(Go to Q8b)*
      *   b) If a character type dies in 90% of playthroughs vs. 5%, is the *type* "worse off"?
          *   i. **Yes, suffering aggregates across instances.** *(Leaf: **Type Aggregation View** - Awkward: Reducing global death% for a type is a moral imperative.)*
          *   ii. **No, only individual tokens suffer.** *(Leaf: **Unnamed (Strong Tokenism)** - Awkward: Highly prevalent suffering seems worse, but isn't.)*

  **Logical Space & Unoccupied Combinations:**

  *   **Incoherent:** Combining Q1C ("like wrong") with Q3a-ii ("yes, wrong to companion") is unstable. If it's only *like* wrong in Q1, affirming a direct wrong *to the character* in Q3a is contradictory. The tree paths avoid this.
  *   **Unexplored/Unattractive:**
      *   **Aggregation + Designer-Proxy (Q8b-i + Q7b-i):** Believing suffering aggregates *and* duties are only to designer intent is possible but strange. Why care about aggregated suffering if only the designer's vision matters? Likely unattractive/unexplored.
      *   **Non-Identity Neutrality + LLM Enhancement (Q4C + Q6A):** Believing creating-to-doom is neutral *and* that AI makes characters *more* morally significant is tension-filled but not strictly incoherent. Unlikely position.
  *   **Indistinguishable Pairs:** The tree successfully separates all major logical positions based on your requested distinctions. The closest call is between **Emergent Fictional Personhood (Q5B)** and **Simulated Mind Sentience (Q6A)**, but Q5 focuses on origin (mod) while Q6 focuses on mechanism (LLM vs scripted), providing separation.

  **Scoring Key (For Flat Quiz - Assign points based on answers):**

  1.  Starving Villager: A=0, B=2, C=1
  2.  Cut Content Ghost: A=0, B=1, C=2
  3.  Scripted Companion: a-i=0, a-ii=1; b-i=0, b-ii=1 *(Treat a & b separately)*
  4.  Roguelike Mercenary: A=1, B=2, C=0
  5.  Modder Creation: A=0, B=2, C=1
  6.  LLM Companion: A=2, B=0, C=1
  7.  Speedrunner vs Bully: a-i=0, a-ii=1; b-i=0, b-ii=1 *(Treat a & b separately)*
  8.  Aggregated Suffering: a-i=0, a-ii=1; b-i=1, b-ii=0 *(Treat a & b separately)*

  **Interpreting Quiz Scores (Match to Leaves):**
  *   **Artefact Fundamentalism:** Low scores overall, esp. Q1A, Q2A, Q5A, Q6B, Q7a-i (low), Q8a-i.
  *   **Actual Observer-Relation:** Q2C, Q5C, Q8a-i common.
  *   **Irreducible Fictional Harm:** Q3a-ii + Q3b-i.
  *   **Player-Actualized Narrative:** Q3a-ii + Q3b-ii.
  *   **Person-Affecting Asymmetry (Weak):** Q4A.
  *   **Non-Identity Neutrality:** Q4C.
  *   **Authorial Origin:** Q5A.
  *   **Emergent Fictional Personhood:** Q5B.
  *   **Aggregated Significance:** Q5C.
  *   **Simulated Mind Sentience:** Q6A.
  *   **Authorial Intent Primacy:** Q6B.
  *   **Deontological Fictionalism:** Q7a-i.
  *   **Designer-Proxy Duty:** Q7a-ii + Q7b-i.
  *   **Direct Fictional Relation:** Q7a-ii + Q7b-ii.
  *   **Token Particularism:** Q8a-i.
  *   **Type Aggregation View:** Q8a-ii + Q8b-i.
  *   **Unnamed (Strong Tokenism):** Q8a-ii + Q8b-ii.

  This structure forces engagement with concrete cases, reveals underlying assumptions (especially about identity, aggregation, intent, and origin), and generates nuanced positions reflecting the complexities of your group's debate, including those awkward commitments you wanted highlighted. Good luck with your session!
