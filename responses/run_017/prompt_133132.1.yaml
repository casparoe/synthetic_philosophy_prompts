prompt: |-
  I teach a graduate seminar on causation and evidence, and I am drafting a paper on the sure-thing principle, the reference-class problem, and Simpson's paradox. Please act as a philosopher of statistics and causal inference — someone equally at home with causal graphs and with decision theory — and help me with the preliminary work of getting my own intuitions in order. Take your time: before committing to a view, spend a paragraph sketching three or four candidate principles and why each of them breaks on some case below, and only then settle on one.

  Here are my verdicts about which level of aggregation to trust when the aggregate and the subgroup figures disagree.

  1. A university admits a smaller proportion of women than of men overall, but within nearly every department the proportion is at least as high for women; women happen to apply disproportionately to the departments that admit few people. My verdict: the department-level figures are the ones that answer whether admissions are biased. The aggregate is an artifact of where women applied.

  2. A drug looks harmful in the aggregate yet beneficial within every stratum of illness severity at baseline, and the sicker patients were much more likely to be given it. Verdict: stratify. Severity is a cause of both the treatment and the outcome.

  3. Same surface shape, but the split is by whether the patient was still well enough to complete the full course of treatment — something the treatment itself influences. Verdict: go back to the aggregate. Stratifying here seems to destroy the very thing I am trying to measure.

  4. The split is by an administrative code that predicts who received the treatment far better than it predicts the outcome; the code largely records which clinic a patient happened to walk into. The reversal appears only after stratifying. Verdict: I distrust the reversal — but I trust this verdict less than any other, and I cannot say why adjustment on such a variable might make matters worse rather than better.

  5. A pair I cannot reconcile. (a) Within each academic department, women are admitted at rates at least equal to men's; in the aggregate they are not; I say the department-level numbers are the truth and the headline is misleading. (b) Within each job title at a firm, men and women are paid the same; the titles held mostly by women pay less; here I say the aggregate pay gap is the real finding and the within-title numbers are the misleading ones. These two look structurally identical to me and I give them opposite verdicts.

  6. A perfectly randomized, perfectly balanced trial with a strong prognostic covariate and no interaction: within every stratum the odds ratio is about two, the pooled odds ratio is about one and a half, and nothing reverses. Verdict: neither number is the effect; I should have asked for risk differences. I also suspect that any principle framed in terms of reversal will misclassify this case entirely.

  7. Over ten years, average entering exam scores rose within every department while the university-wide average fell, because enrolment shifted toward the departments with lower scores. Verdict: nothing paradoxical here; both statements are true of different weightings of a changing population. Tell me whether this case belongs in the family at all.

  8. The reversal shows up in one of twenty subgroup slices the analyst examined, and that slice was not pre-specified. Verdict: I discount it heavily, for reasons that feel closer to the garden of forking paths than to anything causal.

  My tentative principle: stratify when the stratifier is a cause of the treatment, aggregate when it is an effect of the treatment, and when it is neither, do whatever answers the question you are actually asking. This gets cases 1, 2, 3 and 7, but not 5, and I do not think it knows what to say about 4, 6 or 8. Repair it if you can, replace it if you cannot.

  Please deliver: one principle, or at most two, stated precisely enough that a careful reader could apply it mechanically, with a clause-by-clause note of which case motivates each clause; its verdicts on two cases of your own construction that I have not listed; and an explicit statement of which of my verdicts your principle cannot accommodate and which you would urge me to withdraw. Keep the entire answer under 700 words — I would rather have a precise principle in 700 words than a survey in two thousand.
reasoning: |-
  Okay, the user teaches a graduate seminar on causation and evidence and is drafting a paper involving the sure-thing principle, reference-class problem, and Simpson's paradox. They need help developing a robust principle for deciding when to trust aggregate versus subgroup data when they disagree. 

  Hmm, they've provided eight detailed cases with their own verdicts, showing deep engagement but also some contradictions (especially case 5). Their tentative principle stratifies when the stratifier causes treatment, aggregates when stratifier is treatment effect, and defaults to the query otherwise. But it fails on cases 4-6 and 8. 

  First, I should acknowledge their sophisticated setup - they're clearly wrestling with real philosophical tensions, not just textbook examples. The frustration in case 5 ("these look structurally identical") is palpable. They need a unifying framework that respects both causal graphs and decision-theoretic concerns. 

  Let me mentally test their cases against causal DAGs: 
  - Cases 1-3 clearly turn on backdoor paths (admissions) vs colliders (treatment completion). 
  - Case 4 is tricky - that administrative code is a near-instrumental variable, so conditioning might amplify bias. 
  - Case 5's asymmetry suggests we need to incorporate the target of fairness (admission decisions vs pay structure). 
  - Case 6 exposes the perils of ratio measures. 
  - Case 7 isn't paradoxical at all - it's about descriptive vs causal claims. 
  - Case 8 involves selection bias from multiple testing.

  Their proposed principle is a good start but too narrow. I should synthesize a two-part principle: (1) Always block backdoor paths, (2) Never condition on mediators/colliders, (3) Add decision-theoretic weights when effects are heterogeneous. The admission/pay disparity conflict resolves by asking whether we're evaluating decisions (department-level) or structural outcomes (firm-level). 

  For case 4, the principle will correctly warn against conditioning on a post-treatment instrument. For case 6, it'll force us to specify the effect measure. For case 8, it'll reject data-snooped subgroups. 

  New test cases: 
  - Stratifying by an effect modifier when no backdoor paths exist (should aggregate) 
  - Conditioning on a descendant of an unmeasured confounder (might partially block bias). 

  I'll have to override their verdict in case 5b - the pay gap requires analyzing structural causes, not just conditional estimates. The words are tight but I can justify everything in 700 if I skip examples and focus on logic.
answer: |-
  Here is a principled framework integrating causal structure and query specificity, derived from your cases:

  **Principle:**  
  *Adjust for covariates \(C\) iff:  
  (i) \(C\) opens no non-causal path between treatment \(T\) and outcome \(Y\) (e.g., no colliders), AND  
  (ii) \(C\) blocks all confounding paths between \(T\) and \(Y\), OR  
  (iii) The query explicitly concerns \(C\)-specific effects.  
  Otherwise, report unadjusted effects. Always pre-specify \(C\) and use effect measures collapsible under no heterogeneity (e.g., risk differences).*

  **Clause motivations:**  
  - (i) From Case 3 (conditioning on treatment-dependent completion *creates* bias) and Case 4 (conditioning on clinic code induces spurious association).  
  - (ii) From Case 2 (severity is a confounder) and Case 1 (department is a proxy for applicant pool, a confounder in fairness assessment).  
  - (iii) From Case 5’s asymmetry: Admission query evaluates departmental decisions (hence stratify); pay equity query evaluates structural bias (hence aggregate).  
  - Pre-specification: From Case 8 (forking paths).  
  - Effect measures: From Case 6 (non-collapsible odds ratios mislead).

  **Verdicts on your cases:**  
  - **1,2:** Adjust (confounders, no colliders).  
  - **3:** Aggregate (\(C\) is collider).  
  - **4:** Aggregate (clinic code ≈ instrumental variable; conditioning biases estimates).  
  - **5a:** Adjust (query: departmental decisions); **5b:** Aggregate (query: structural equity). *Your verdict for 5b is overridden – within-title equality doesn’t absolve discriminatory title assignment.*  
  - **6:** Use risk differences; neither OR is "true" without specification.  
  - **7:** Not paradoxical; descriptive vs causal claims (excluded).  
  - **8:** Reject (non-pre-specified; violates (iii)).

  **New test cases:**  
  - **Case A:** \(T\) (training), \(Y\) (productivity), split by \(C\) (project type). \(C\) causes \(T\) but not \(Y\); no confounders. *Verdict:* Aggregate – \(C\) satisfies (i,ii) but adjustment is unnecessary (no confounding) and query is overall effect.  
  - **Case B:** \(T\) (drug), \(Y\) (recovery), \(C\) (genetic variant). \(C\) modifies \(T\)’s effect but is a collider (\(T\) and diet \(\rightarrow C\)). *Verdict:* Aggregate – conditioning on collider \(C\) biases effect (violates (i)).

  **Limitations:**  
  - Cannot accommodate your Case 5b verdict (retained aggregate as "real finding" without structural query). Principle demands explicit query specification.  
  - Urges withdrawal of Case 4’s agnosticism (conditioning on instruments *always* harms precision/biases estimates) and Case 5b’s within-title focus (masks assignment discrimination).

  **Key insight:** Paradoxes dissolve when distinguishing causal estimands (requiring adjustment for confounders, avoiding colliders) from descriptive or policy-weighted queries (possibly requiring aggregation). The "reversal" is incidental; the causal graph and query define correctness.

