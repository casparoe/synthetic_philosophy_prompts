prompt: |-
  I am rewriting a problem set for a second-year philosophy of language course, and I want a case that does not resolve itself in the first ten seconds. Last year I asked whether a promise the promisee never hears is really a promise, and every student came back with the same answer — nothing was received, so nothing happened — which left me with nothing worth grading. So I want a scenario where the untutored verdict genuinely splits, and where the split can be traced to one structural feature of the case rather than to the reader's temperament.

  What I need is this: one paragraph, set somewhere ordinary — a hospital ward, a clinic's on-call rota, a university department, a shared workshop — in which a person addresses an explicit commissive to a named colleague, something like I promise I'll cover your Saturday clinic, and in which the utterance is recorded and acted on by an institutional channel while the addressee themselves never receives it. A shift-swap board, a ticketing system, an auto-responder, a shared log, a pager gateway: nothing more exotic than that. The speaker is sincere, has the standing to make the promise, is under no duress, is not joking, quoting, or writing fiction, and the message is unambiguous and in a language the addressee reads. Nothing may turn on the addressee failing to understand it, on the speaker lacking authority, on the message never having left the outbox, or on the speaker's later change of heart. Ideally there is some mild practical upshot as well — someone is short-staffed, or out of pocket, or aggrieved — so that whether an obligation exists is not a purely academic question.

  Then do the check, framework by framework rather than as free-ranging discussion:

  1. Austin's felicity framework. I take Austin to require that uptake be secured for an illocutionary act to be happily performed, though I am not confident where that requirement sits in his taxonomy — say whether this is a misfire or something else, place it in one of his categories with a reason, and say explicitly why it is not an abuse, given that the speaker is sincere. Verdict: was a promise made, yes or no?
  2. Searle's constitutive-rule analysis. Walk through the propositional content, preparatory, sincerity, and essential conditions one at a time, say which are met, and give the verdict. I read Searle as holding that uptake, or what he calls the illocutionary effect, is needed for communication to succeed but not for the act itself to have been performed; if you think I have misread him, say so and say what follows for the case.
  3. A Gricean, intention-recognition account of the kind on which a speaker performs an illocutionary act only if the audience recognizes the speaker's reflexive intention in producing it. Distinguish expressing an intention from communicating it, say which happened here, give the verdict, and say what normative residue, if any, is left behind when the act fails.
  4. A practice-based or scorekeeping view on which obligations are what the community's practice of attributing commitments makes them, so that what matters is the public standing of the utterance within the practice rather than any individual's psychology or any single hearer's uptake. Give the verdict and say what has to be true of the practice for you to reach it.

  Close with three things. First, name the single structural feature of the case that is doing all the work — my suspicion is that it is the gap between being registered by a practice and being received by a person, but argue for whatever it actually is — and identify the one sentence in your scenario that the whole case turns on. Second, run two ablation tests: remove the institutional channel entirely, so that the message sits unread in an inbox and nothing else changes; then put the channel back and have the addressee read the message the next morning. Say in each case which frameworks change their verdict and which hold steady, and whether the case collapses back into a familiar and uninteresting dispute about unheard utterances. Third, for each framework that comes out looking wrong or unhelpful here, give its defender's strongest line of attack on your scenario — the best thing an Austinian or a Searlean could say to make the case look rigged, rather than a dismissal. If you think some combination of the verdicts I have asked for cannot be jointly satisfied in a realistic case, say which one and why instead of forcing it.
reasoning: |-
  Okay, the user is designing a philosophy problem set and needs a case that doesn't resolve too quickly. Last year's case about unheard promises got unanimous answers, so they want something that genuinely splits opinions. The key is to create a scenario where the structural feature—specifically, institutional recording versus personal receipt—causes disagreement among different theoretical frameworks.

  The user wants an ordinary setting. A hospital ward with a shift-swap board feels realistic. The core scenario: A doctor (Kai) promises to cover for a colleague (Sam) by writing on the board. The message is recorded by the hospital system but Sam never sees it. This creates a gap between institutional acknowledgment and personal receipt.

  For Austin's framework, the lack of uptake means the promise misfires. It's a flaw in the procedure (A.2) since Sam didn't take it up, not an abuse because Kai was sincere. Verdict: no promise.

  Searle's view is different. All conditions seem met: content is clear, preparatory conditions are satisfied (Kai can cover, Sam needs it), sincerity is there, and essential condition—commitment—is fulfilled when written. Searle separates the act from communication success, so verdict: promise made.

  Gricean theory hinges on intention recognition. Kai expressed an intention but Sam didn't recognize it, so no successful communication. Only an attempt was made, leaving a normative residue—perhaps Kai should still cover, but it's not a full promise.

  The practice-based view looks at community norms. If the hospital treats the board as binding, then the promise holds institutionally. Verdict depends on the practice's rules.

  The critical sentence is "the message automatically logs... but Sam never checks." This creates the institutional/personal gap. Ablation tests show: without the channel, it's just an unread message—Austin and Grice agree no promise; with receipt, all frameworks likely say promise made. The institutional element prevents collapse into boring unanimity.

  Each framework has counterarguments. Austinians might argue the board isn't a valid uptake channel. Searleans could question if writing counts as "uttering." Griceans might say recognition isn't instantaneous. Practice theorists might debate what "counts" in the community.

  This setup ensures theoretical disagreement rooted in one clear feature, making grading meaningful.
answer: |-
  Here is a designed case meeting your specifications, followed by the structured analysis.

  **Scenario:**  
  In the busy oncology ward of St. Hildegard’s Hospital, junior doctors Kai and Sam share weekend on-call duties. On Friday afternoon, Kai sees Sam rushing to a family emergency and writes on the shift-swap board: "Sam, I promise I’ll cover your Saturday clinic so you can be with your dad. –Kai." The board is an official hospital tool: when a note is posted, it’s photographed by an overhead camera, automatically logged in the staffing system, and triggers an update to the duty roster visible to charge nurses. **The message automatically logs in the system and the roster updates, but Sam, distracted and leaving via a different corridor, never checks the board.** On Saturday, Sam assumes their clinic is uncovered and cancels a critical patient consult. Kai arrives as promised, finds the clinic empty, and the charge nurse (relying on the updated roster) reprimands Sam for the no-show, leaving Sam aggrieved and the patient undertreated.

  ---

  ### Framework Analysis

  1.  **Austin's Felicity Framework:**
      *   **Verdict:** No promise was made.
      *   **Reasoning:** Austin requires "uptake" for the illocutionary act to be "happy" (successful). Uptake involves the hearer taking the speaker's utterance as having the intended force (e.g., accepting the promise *as a promise*). Here, Sam never received the message and thus couldn't take it up. This is a *misfire* (specifically, a flaw in the "B.1" procedure - the act wasn't fully *executed* because the "persons and circumstances must be appropriate" for the act to be invoked). It falls under "A.2. The particular persons and circumstances in a given case must be appropriate for the invocation of the particular procedure invoked." Sam, the essential participant (promisee), was not appropriately addressed *in practice* for the procedure (promising) to be invoked successfully. It is *not* an abuse (flaw in the "Gamma" sincerity rule) because Kai *was* sincere. The act misfires due to lack of completion (uptake), not insincerity.

  2.  **Searle's Constitutive Rules:**
      *   **Propositional Content:** Future act (A) of speaker (S), covering the clinic. Met.
      *   **Preparatory Conditions:** 1. S believes A is in H's (Sam's) interest & H would prefer S doing A to not doing A. Met (Kai believes covering helps Sam). 2. It is not obvious to both S and H that S will do A in the normal course of events. Met (covering isn't automatic). *Crucially, Searle does **not** require H to *know* these conditions are met at the time of utterance for the act to be performed.*
      *   **Sincerity Condition:** S intends to do A. Met (Kai is sincere).
      *   **Essential Condition:** Counts as an undertaking of an obligation by S to do A. Searle emphasizes the *commitment* as the core of promising, distinct from its communication. He explicitly states that the act of promising is performed *in* the utterance, even if communication fails (*Speech Acts*, p. 47: "The utterance of the words is the undertaking of the obligation"). The institutional logging and roster update constitute the public manifestation of the utterance/commitment within the relevant context.
      *   **Verdict:** A promise *was* made. The act is performed by the utterance (writing) satisfying the rules; the illocutionary *effect* (Sam recognizing it) is separate and failed. Your reading is correct: Searle separates act performance from communicative success.

  3.  **Gricean Intention-Recognition:**
      *   **Expressing vs. Communicating:** Kai *expressed* the intention to undertake an obligation by producing an utterance conventionally associated with promising (writing "I promise..."). However, for the illocutionary act to be *performed*, the audience (Sam) must *recognize* Kai's reflexive intention (the intention that Sam recognize Kai's intention to be obligated by the utterance). This recognition did not occur.
      *   **Verdict:** No promise was made. Only an *attempt* to promise occurred.
      *   **Normative Residue:** Kai expressed a serious intention to undertake an obligation. This creates a strong *moral* or *personal* expectation (Kai *should* still cover the clinic if possible, as they declared their intent) and potentially an *institutional* obligation (due to the roster update), but it does not constitute the *illocutionary act* of promising itself, which requires successful recognition of the reflexive intention.

  4.  **Practice-Based/Scorekeeping View:**
      *   **Verdict:** A promise *was* made (institutionally).
      *   **Condition for Verdict:** The hospital's normative practice must treat entries on the shift-swap board, once logged in the system and updating the roster, as *binding commitments* that alter the deontic score (obligations, entitlements) *regardless of individual awareness*, similar to a public contract or ledger entry. The charge nurse acting on the roster and reprimanding Sam demonstrates this practice: the institution attributes the commitment to Kai and the corresponding entitlement/expectation to the hospital (and the patient) based on the public record.

  ---

  ### Synthesis

  1.  **The Structural Feature:** The gap between **institutional registration/uptake** (the message being officially logged and acted upon by the system/community practice) and **personal receipt/uptake** (the intended individual addressee, Sam, never receiving or recognizing the message). The critical sentence is: "**The message automatically logs in the system and the roster updates, but Sam, distracted and leaving via a different corridor, never checks the board.**" This single sentence creates the institutional/personal rift driving the divergent verdicts.

  2.  **Ablation Tests:**
      *   **No Institutional Channel (Unread Inbox):** Kai emails Sam the promise directly, but Sam never opens the email. Only the system timestamp exists.
          *   **Changes:** Searle *might* hold firm (act performed in sending?), but the case for the Essential Condition counting the utterance as an undertaking is weaker without institutional recognition. Practice-Based view *definitely changes*: Without a public practice treating the email as binding *before* receipt, there's no score change. Austin (no uptake) and Grice (no recognition) remain "No". This *does* risk collapsing towards the "unheard utterance" case, though Searle provides some friction.
          *   **Result:** Less interesting split (Primarily Austin/Grice "No" vs. Searle "Yes?", Practice-Based likely "No").
      *   **Addressee Reads It Later:** Same scenario, but Sam checks the board Sunday morning.
          *   **Changes:** *All frameworks change to "Yes, a promise was made"*. Austin: Uptake secured (belatedly). Searle: Act performed, communication belatedly successful. Grice: Recognition achieved (belatedly). Practice-Based: Act existed institutionally, now confirmed personally. The normative consequences (aggrievement, missed clinic) might still stand, but the *act* question resolves uniformly.
          *   **Result:** Collapses into unanimity on the core act question, though practical consequences remain debatable.

  3.  **Defender's Strongest Line of Attack:**
      *   **Austin:** "You've rigged the 'uptake' requirement by misapplying it institutionally. Austin focused on *interpersonal* communication. The 'persons' required for uptake are the specific promisee (Sam), not an impersonal system. The logging is irrelevant; without Sam's uptake, it's still a misfire (A.2). The nurse's reliance is a *consequence* of a different act (posting to the board as an institutional act), not proof that promising *to Sam* occurred."
      *   **Searle:** "The scenario subtly smuggles in institutional effects to satisfy the Essential Condition. Searle's rules govern the *interpersonal* act of promising. Writing on a board *might* count as 'uttering', but the Essential Condition requires it to count as undertaking an obligation *to the promisee*. If Sam is wholly unaware, in what sense is it an obligation *to Sam*? The institutional obligation is distinct from the commissive illocutionary act directed at Sam. You've conflated two acts."
      *   **Grice:** "The 'institutional recognition' is a red herring. Grice's reflexive intention is directed *at the audience* (Sam). The system isn't the intended audience for the *promise*; it's the audience for a different act (a roster update request). Kai's reflexive intention for Sam to recognize the promise *as a promise* was never realized, full stop. The normative residue is real but belongs to the realm of expressed intent or institutional rules, not successful illocution."
      *   **Practice-Based:** (Less attack needed, as the view thrives here, but a critic might say): "This view *redefines* promising as institutional commitment, losing the core interpersonal, commitment-creating aspect central to the other theories. It changes the subject."

  **Conclusion:** The scenario successfully creates a clean split traceable to the institutional/personal receipt gap. The verdicts (Austin/Grice "No", Searle/Practice "Yes") are jointly satisfiable because the key structural feature directly engages the core differing requirements of each framework (uptake vs. commitment-in-utterance vs. intention-recognition vs. public scorekeeping). The ablation tests confirm the institutional channel is necessary to prevent collapse into the simpler "unheard" case. Each framework has a plausible defense against the scenario, preventing it from appearing rigged, though the Searlean and Practice-Based views find it most natural.
