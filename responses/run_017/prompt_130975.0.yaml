prompt: |-
  Last spring my husband got a kidney from a living donor — not from me (I'm not a match, long story), but from someone he climbs with, who just... offered. So I ended up wierdly deep in this world, and somehow that got me a seat on the transplant program's patient-and-family advisory council. Last week the council got handed a proposal to comment on, and trying to explain to the other members why it made me uncomfortable is how I discovered I have no idea what the rule against paying donors is actually *for*.

  The proposal, in brief. Nobody is suggesting writing a donor a check. Instead: (1) anyone who registers as an organ donor gets a block of priority points if they ever need a transplant themselves, and can name one other person who gets half those points; (2) you could also buy the same priority points with a large tax-deductible gift to the program's "patient support fund," the one that already pays for donors' travel, lodging, childcare and lost wages; (3) the points would be inheritable by your kids. It's not a market in kidneys, exactly. It's a market in queue position, with a reciprocity story stapled to it.

  So here's what I want. Take the existing practice — we forbid paying someone for an organ, and we treat that as one of the few things that's just not up for negotiation — and tell me what it presupposes. Concretely, the parts I keep tripping over: we *reimburse* donors for lost wages and travel and childcare; we pay people for plasma, for eggs, for sperm, for taking real medical risks in early-phase drug trials; in a lot of places we pay surrogates to carry a pregnancy but not to hand over the baby; paired-exchange programs let you donate now and bank a voucher for a friend years later; the recipient's insurer gets billed for organ procurement, so somewhere in the paperwork the organ has a price on it; and our coordinator told us you can register at more than one transplant center and get worked up wherever the queue is shortest, which is a shorter wait you can basically buy if you can afford the flights and a hotel.

  Reconstruct the implicit theory of that whole package. Does the ban presuppose that some things are inalienable — that a body part can be given but not sold, and that the sale would be a different act and not just the same act with money attached? Does it presuppose that money corrupts the meaning or the motivation, so paying would drive givers away rather than bring them in — in which case the ban is an empirical bet we could in principle lose? Does it presuppose that money damages consent, so a poor seller isn't really choosing? Or something about what a fair distribution of access to a scarce lifesaving resource has to look like?

  And then the parts I actually care about: which of those does the practice *strictly* presuppose, versus which just happens to sit nicely alongside it? Where are the parts pulling in different directions — the inalienability story seems hard to square with paid plasma and paid egg donation, and the "money destroys consent" story seems hard to square with reimbursing lost wages, which is exactly the part that makes donation attractive to someone with a low income. Where is the practice philosophically underdetermined, so that two or three quite different theories would all license what we currently do? And what would have to change if we swapped the presupposed view for one of its rivals — say we concluded the only honest worry is that the poor end up as the sellers, and not that commodification is bad in itself: what would our policy have to look like then, and would it look more or less like the proposal I just described? Does that proposal slip past every theory that would block a cash payment, or does some version of the theory catch it?

  Please lead with your bottom line in the first sentence and then give me the reasoning — no preamble, no restating my question, no recap at the end. I don't need papers or names or citations, I need the argument; I can look up who said what later. And if some part of my description of current practice is wrong, say so in passing and keep going.
reasoning: |-
  Okay, let me tackle this step by step. The user is part of a transplant council and needs to understand the ethical foundation of prohibiting organ payments to evaluate a priority points proposal. 

  First, identifying the core question: What principles underpin the ban on paid organ donations? The user lists several contradictions in current practices—like reimbursing expenses but not paying for organs—that make the rationale unclear. 

  I recall key ethical theories: inalienability (organs as beyond commerce), commodification concerns (money corrupting altruism), coercion risks (exploiting the poor), and fairness in allocation. The user needs to know which principles are essential versus incidental to the current ban.

  Examining the proposal: Priority points for donors or buyers, with inheritability. The reciprocity angle (points for donors) might align with non-monetary incentives, but allowing points via donation to a support fund introduces indirect payment. This tests whether the ban targets direct cash exchange or any market-like mechanism.

  Comparing existing practices: Paid plasma/sperm vs. organ prohibition suggests the distinction isn't just about body parts but permanence (organs are irreplaceable) and scarcity. Expense reimbursements are framed as removing barriers, not payment—this hinges on intent. 

  The user’s tension points: 
  - Inalienability vs. paid eggs: Perhaps eggs/plasma are seen as renewable, unlike kidneys. 
  - Coercion concerns vs. wage reimbursement: Reimbursement enables donation without loss, while direct payment might incentivize risk-taking. 

  Philosophical underdetermination: Current rules could fit multiple theories (e.g., "no exploitation" OR "no commodification"), making the priority points proposal ambiguous. If the ban’s core is preventing exploitation (not commodification), then points for cash donations might still violate fairness by letting wealth buy queue position. 

  If we switched to only worrying about poverty-driven sales, policy might allow regulated compensation but with safeguards (e.g., fixed prices, third-party payers). The proposal’s inheritable points and transferability could exacerbate inequality (wealthy buying priority), conflicting with fairness even under this revised view. 

  The proposal likely slips past commodification theories (no direct organ sale) but fails coercion/fairness tests: "buying" points advantages the affluent, and naming beneficiaries/inheritance creates dynastic privilege in life-saving access. 

  Key judgment: The ban’s irreducible presupposition is that organs must not be allocatable by wealth, protecting systemic fairness. The proposal violates this by monetizing queue position. Even if commodification weren’t an issue, the fairness imperative catches it.
answer: |-
  The ban presupposes that organs must never be allocatable by wealth to preserve equitable access and prevent exploitation, but this principle is inconsistently applied across practices, creating tension with the proposed priority points system.  

  **Reasoning:**  
  1. **Core Presuppositions:**  
     - **Fairness/Equity:** The ban strictly presupposes that access to lifesaving organs cannot be tied to financial means. Allocating organs based on need/medical urgency, not wealth, is non-negotiable.  
     - **Exploitation Prevention:** It assumes payment could coerce economically vulnerable individuals into risky donations, undermining voluntary consent.  
     - **Commodification Aversion:** Organs are treated as *semi*-inalienable—donation is noble, but selling degrades human dignity. This is less absolute than presumed, given reimbursements (travel, wages) that incentivize donation without direct "sale."  

  2. **Inconsistencies in Current Practice:**  
     - **Reimbursements vs. Payments:** Covering donor expenses removes barriers to altruism but doesn’t constitute "payment" under the ban, as it avoids profit motive. This aligns with "no exploitation" but clashes if reimbursements become de facto wages (e.g., for low-income donors).  
     - **Paid Plasma/Eggs vs. Organs:** Distinctions hinge on risk, irreplaceability, and scarcity. Kidneys involve permanent loss and greater risk than plasma; eggs carry higher risk but are renewable. The ban treats non-renewable organs as uniquely inviolable.  
     - **Vouchers/Paired Exchange:** These leverage reciprocity without money, preserving the "gift" ethos. The priority-points proposal mimics this but adds financial entry (tax-deductible gifts).  

  3. **Philosophical Underdetermination:**  
     The ban could stem from:  
     - **Commodification Theory** (selling organs is inherently wrong),  
     - **Distributive Justice** (wealth must not determine life-or-death access), or  
     - **Exploitation Avoidance** (protecting the poor).  
     Current practices fit all three weakly: reimbursements avoid commodification *language* but permit indirect incentives; paid plasma allows commodification but for lower-risk resources.  

  4. **The Proposal’s Tensions:**  
     - **Escaping Commodification?** Points aren’t direct organ sales, so commodification theory might not block it. But inheritable points and buying queue position with donations *do* commodify *access*.  
     - **Exploitation Risk:** Points for registration don’t exploit donors. However, buying priority via gifts lets wealth jump the queue—violating the equity presupposition.  
     - **Fairness Failure:** Allowing queue positions to be bought (via gifts) or inherited makes access contingent on wealth/privilege, directly contradicting the ban’s core equity principle.  

  **Swapping Presuppositions:**  
  If we abandoned commodification concerns and focused *solely* on preventing poor-as-sellers, we might allow compensated donation (e.g., fixed payments from a central fund). However, the proposal fails even this view: it permits wealthy *recipients* to buy priority (via gifts to the support fund), creating a tiered system where access is auctioned. This exacerbates inequity—contrary to the ban’s unyielding equity goal.  

  **Conclusion on the Proposal:**  
  It evades commodification objections (no cash-for-organs) but is caught by the fairness presupposition: monetizing and inheriting queue positions corrupts equitable allocation. The ban’s irreducible foundation is that money must not influence organ distribution—a line the proposal crosses.  

  *(Note: Your description of current practice is accurate, though insurers pay for organ procurement costs, not the organ itself—a legal fiction preserving the "no sale" principle.)*
