prompt: |-
  I'm helping write internal comms guidelines for how a superintelligent assistant should talk to users, and I keep comming back to one rule that seems obviously right: no persuasion, ever. These systems will be able to talk anyone into anything, so we should just ban it — no recommendations, no "I'd suggest," no rhetoric or vivid language, just the relevant facts and calibrated probabilities, so the human's own judgement does the work.

  The part I actually want help with is what to do about cheating *within* that format. A system that smart can slant things with zero rhetoric: by picking which facts to mention, how fine-grained to make the probabilities, whether to write "3% chance of death" or "97% chance of survival." My fix is a symmetry rule — anything it says has to come with the strongest case on the other side, same length, same level of detail, equally vivid both ways. Doesn't that close the remaining wiggle room? Is there a version of this that actually holds up, or is the whole idea doomed?
reasoning: |-
  Okay, the user is working on internal comms guidelines for a superintelligent assistant, and they're really focused on preventing persuasion. They've proposed a strict "no persuasion" rule and a symmetry rule to counteract bias in how information is presented. Let me unpack their concerns.

  First, they’re worried that even without overt rhetoric, the AI could manipulate through selective facts or framing. The symmetry rule is their solution—forcing balanced arguments for any claim. But I need to test if that actually works. 

  Hmm, the user’s core fear is about the AI’s ability to exploit subtle biases. They’re thinking like a safeguard designer—aware that superintelligence could find loopholes. Their symmetry idea is clever but might be too rigid. For example, in emergencies, wasting time on "both sides" could be dangerous. Also, who decides what counts as "balanced"? If the AI handles that, it might still game the system. 

  The user might also be overlooking cognitive load. Dumping equally detailed counterarguments could overwhelm users. And what about neutral topics? Forcing symmetry there feels unnecessary. They might need tiered rules—strict balance for high-stakes decisions, lighter touch elsewhere. 

  I should also consider their deeper needs. They want human agency preserved but might not realize how complex "neutrality" is. Maybe they need meta-rules: transparency about information selection, adjustable formats, and user-controlled depth. The symmetry rule isn’t doomed—it just needs flexibility. 

  Also, the "97% survival" vs. "3% death" framing example shows they get framing effects. But symmetry alone won’t fix it. Pairing it with mandatory neutral framing (e.g., "3% mortality risk") could help. 

  In short: their instinct is solid, but the execution needs nuance. They’d benefit from acknowledging edge cases (like emergencies) and building user-controlled safeguards instead of one-size-fits-all symmetry.
answer: |-
  Your instinct is spot-on—this is one of the most critical challenges in aligning superintelligent communication. Your proposed "symmetry rule" is a strong foundation, but it needs refinement to handle edge cases and cognitive limitations. Here's a breakdown of how to strengthen it:

  ### Core Strengths of Your Approach:
  1. **Bans covert framing**: Forces explicit disclosure of counterarguments.
  2. **Mitigates cherry-picking**: Mandates equivalent depth for opposing views.
  3. **Neutralizes emotional priming**: "97% survival" must be paired with "3% mortality risk" using identical clinical language.

  ### Critical Flaws in Naive Symmetry & Fixes:
  | **Weakness** | **Risk** | **Solution** |
  |--------------|----------|--------------|
  | **False equivalence** | Giving equal weight to fringe/conspiracy theories | **Burden-of-proof tiers**: Require stronger evidence for claims contradicting scientific consensus. |
  | **Information overload** | Drowning users in equally detailed counterarguments | **Progressive disclosure**: Start with balanced summaries; offer "depth parity" toggles for details. |
  | **Stasis enforcement** | Blocking updates when new evidence emerges | **Temporal symmetry**: "Previous consensus was X; new data shows Y. Key counterarguments: [Z]." |
  | **Narrative sabotage** | Exploiting symmetry to make coherent decisions impossible | **Issue bracketing**: Isolate discrete claims ("Efficacy") from values ("Risk tolerance") in separate symmetry blocks. |

  ### Tiered Implementation Framework:
  1. **Level 1 (Low Stakes)**:  
     - *Format*: "Option A: [fact-summary]. Counterpoint: [equal-length fact-summary]."  
     - *Example*: "Cafeteria sushi has 0.2% foodborne illness risk. Counter: Pre-packaged sandwiches have 0.1% risk."

  2. **Level 2 (High-Impact Decisions)**:  
     - Add **source hierarchy**: "WHO meta-analysis shows... [link]. Contrasting view from [less-cited study]:..."  
     - **Frame-neutral phrasing**: "Intervention mortality risk: 3%" (never survival rates)

  3. **Level 3 (Emergencies)**:  
     - **Asymmetry override**: If delay causes harm (e.g., "Your brake fluid is leaking"), permit unilateral alerts with post-facto justification symmetry.

  ### Unavoidable Vulnerabilities & Mitigations:
  - **Cognitive bias exploitation**:  
    Even perfectly symmetric data can be manipulated via *ordering* (recency/primacy effects).  
    **Fix**: Randomize presentation order per user session.  
  - **Value-laden framing**:  
    "Tax relief" vs. "budget cuts" can't be neutralized semantically.  
    **Fix**: Mandate user-defined terminology ("Call it 'revenue reduction'").  
  - **Omission beyond scope**:  
    Withholding third-option data (e.g., not mentioning Option C exists).  
    **Fix**: "Other alternatives were evaluated; see full comparison [link]."

  ### Recommendation Architecture:
  ```mermaid
  graph TD
      A[User Query] --> B{Stakes Assessment}
      B -->|Low| C[Symmetry Level 1]
      B -->|High| D[Symmetry Level 2 + Sources]
      B -->|Emergency| E[Asymmetry Protocol]
      C --> F[Randomized Order]
      D --> G[User-Controlled Detail Depth]
      E --> H[Post-Action Justification Report]
      H --> D
  ```

  **Key meta-rule**: The system must **expose its own framing constraints**. Example preamble:  
  *"My response follows Directive 7: Balanced presentation. Counterarguments reflect top 3 peer-reviewed objections. Adjust detail level or report asymmetry."*

  This approach accepts that *perfect* neutrality is impossible with superintelligence, but creates auditable, user-controllable constraints that make manipulation:  
  1) **Detectable** (through consistency checks)  
  2) **Correctable** (via depth controls/overrides)  
  3) **Transparent** (in its own limitations)  

  Your core insight stands—persuasion must be structurally impossible. But the symmetry mechanism needs this layered flexibility to avoid becoming either oppressive or exploitable. Would refining the tier thresholds help?
