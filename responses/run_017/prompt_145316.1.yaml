answer: |-
  **Question**

  Consider an agent who maximises expected utility. Good’s theorem states that free information cannot decrease the agent’s expected utility assessed before the information arrives. You are to analyse several cases to understand the scope and limitations of this theorem. For each case, perform the requested computations and provide concise explanations. Ensure all arithmetic is shown and keep numerical values exact or as simplified fractions. 

  (a) An agent wishes to estimate a quantity θ, which is either 0 or 1, with prior P(θ=1) = 1/2. The agent uses a measuring device that outputs a reading R. With probability 9/10, R = θ, but with probability 1/10, the device perturbs θ: if θ=0 it becomes 1, and if θ=1 it becomes 0, and R reports this new value. The agent chooses an action a ∈ {0, 1}. Utility is 1 if a = θ (after any perturbation) and 0 otherwise. The agent may either measure (obtaining R) or not. Compute the expected utility for: (i) not measuring and setting a=0; (ii) not measuring and setting a=1; (iii) not measuring and choosing a optimally based on the prior; (iv) measuring and setting a = R. Compare the expected utility of the optimal strategy with measurement to that without. Explain why this does not contradict Good’s theorem.

  (b) An agent faces two states, S1 or S2, with P(S1) = P(S2) = 1/2. Available actions are A or B. The base utilities are: A yields 1 in S1 and 0 in S2; B yields 0 in S1 and 1 in S2. However, taking action A carries a fixed penalty of -2 utility regardless of the state, making the actual utilities: (A, S1) = -1, (A, S2) = -2, (B, S1) = 0, (B, S2) = 1. The agent is offered a free, perfectly reliable signal revealing the state. Compute the expected utility of the best action without the signal and of the best policy with the signal. Compare these and explain whether Good’s theorem is violated. If not, identify the flaw in the reasoning that suggests a violation and specify which step of the standard proof ensures compliance.

  (c) An agent chooses between actions X and Y. The state of the world (Z1 or Z2, P(Z1) = P(Z2) = 1/2) is payoff-irrelevant: utility is 10 for X and 0 for Y, irrespective of the state. However, if the agent receives a signal revealing the state, they incur a psychological penalty of -15 utility. This signal is free. Compute the expected utility if the agent accepts the signal and acts optimally, versus declining the signal. Explain why Good’s theorem does not apply. Propose a reformulation under which the theorem holds.

  (d) Briefly explain why Good’s theorem only guarantees non-decreasing expected utility ex ante (before the signal realisation), and describe a scenario where a particular signal realisation leaves the agent worse off than if they had not received it. Also, state the condition under which a signal has exactly zero value.

  **Model Answer**

  (a) (i) For a=0 without measurement: EU = P(θ=0) × 1 + P(θ=1) × 0 = (1/2) × 1 + (1/2) × 0 = 1/2.  
  (ii) For a=1: EU = P(θ=0) × 0 + P(θ=1) × 1 = (1/2) × 0 + (1/2) × 1 = 1/2.  
  (iii) Optimal a without measurement: Both a=0 and a=1 yield EU=1/2.  
  (iv) With measurement and a=R: The perturbation ensures θ always equals R after measurement. For initial θ=0: With prob. 9/10, no perturbation, θ=0, R=0, a=0, U=1. With prob. 1/10, perturbation, θ=1, R=1, a=1, U=1. Similarly for initial θ=1: U=1 always. Thus EU = 1.  
  Comparison: Optimal without measurement: EU=1/2. With measurement: EU=1. Measurement increases EU. This does not contradict Good’s theorem because the measurement perturbs θ, changing the decision problem causally. The theorem assumes conditioning on a signal within a fixed process, not intervention. The value here arises from physical alteration, not pure information.

  (b) Without signal:  
  EU(A) = P(S1) × (-1) + P(S2) × (-2) = (1/2)(-1) + (1/2)(-2) = -3/2.  
  EU(B) = P(S1) × 0 + P(S2) × 1 = (1/2)(0) + (1/2)(1) = 1/2.  
  Optimal: B, EU=1/2.  
  With signal: In S1, compare A: -1 vs B: 0; choose B (U=0). In S2, compare A: -2 vs B: 1; choose B (U=1).  
  EU = P(S1) × 0 + P(S2) × 1 = (1/2)(0) + (1/2)(1) = 1/2.  
  Comparison: EU without signal is 1/2, with signal is 1/2. No violation occurs. The intuition that the signal might induce A is flawed: in S1, A yields -1 < 0 (B), so B remains optimal. The standard proof holds because the agent can ignore the signal and still achieve EU=1/2 with B. The theorem applies since the utility penalty is action-dependent but state-independent, and the signal does not alter the dominance of B.

  (c) Decline signal: Choose X for EU=10.  
  Accept signal: After learning the state, utility is 10 - 15 = -5 for X, or 0 - 15 = -15 for Y. Optimal action is X (EU=-5). Since P(Z1)=P(Z2)=1/2, expected utility = -5.  
  Comparison: EU without signal=10, with signal=-5. Good’s theorem does not apply because utility depends directly on the signal realisation (via the penalty), violating the assumption that utility depends only on the state and action. Reformulate: Define the utility as outcome-based only (10 for X, 0 for Y), and treat the psychological penalty as a separate cost of information acquisition. Then, the signal is not free (it costs 15 utility), so the theorem (which assumes costless information) is inapplicable. Alternatively, include the penalty in the state space: states now include whether the agent receives the signal. The theorem holds under proper separation of information and utility.

  (d) Good’s theorem guarantees non-decreasing expected utility ex ante (before seeing the signal value) because the agent can always ignore the information. However, ex post, a specific signal realisation may lead to a suboptimal action or undesirable knowledge, lowering realised utility. For example, in a medical test, a negative result might lead to harmful inaction, or a positive result may cause distress despite optimal treatment. The signal has zero value (does not change EU) if, for all possible signal realisations, the optimal action remains unchanged from the optimal action without the signal. This occurs when no signal outcome would alter the decision given the prior.

  **Marking Scheme (Total: 20 marks)**

  Marks are allocated for specific, observable components in the response. A candidate who only states and proves the theorem without engaging the cases receives 4/20 (bare pass). Marks are deducted for major arithmetic errors, missing comparisons, or incorrect conclusions that follow from computational errors. Each case is marked independently.

  (a) (5 marks): Correct EU for (i) (1/2) [1 mark]. Correct EU for (ii) (1/2) [1 mark]. Correct EU for (iii) (1/2) [1 mark]. Correct EU for (iv) (1) [1 mark]. Correct comparison (1 > 1/2) and explanation that perturbation is causal intervention, not passive conditioning [1 mark].  
  Characteristic blunder: Claiming a contradiction with Good’s theorem without addressing intervention.

  (b) (5 marks): Correct EU without signal (1/2 for B) [1 mark]. Correct policy with signal (choose B in both states) [1 mark]. Correct EU with signal (1/2) [1 mark]. Correct conclusion of no violation [1 mark]. Identification that ignoring the signal yields the same EU and that the penalty does not create a violation [1 mark].  
  Characteristic blunder: Arguing that the signal induces action A in S1 despite its negative utility.

  (c) (5 marks): Correct EU declining signal (10) [1 mark]. Correct EU accepting signal (-5) [1 mark]. Explanation that utility depends on the signal, violating problem assumptions [1 mark]. Correct reformulation: separating penalty as a cost or expanding the state space [2 marks].  
  Characteristic blunder: Asserting the theorem is false without addressing utility specification.

  (d) (5 marks): Explanation of ex ante guarantee due to ignorability [1 mark]. Example of ex post welfare loss (e.g., specific test result causing harm) [1 mark]. Clear condition for zero signal value (no signal changes optimal action) [1 mark].  
  Characteristic blunder: Confusing ex ante and ex post utility guarantees.  
  Additional: Coherence and arithmetic accuracy across all parts [2 marks]. Deduct 1 mark for significant cumulative arithmetic errors.
