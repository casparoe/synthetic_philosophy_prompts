prompt: |-
  hey — I need a case built to order, and the important thing is that the two accounts actually come apart in it, rather than me just stipulating that they do.

  What it's for: a friend keeps telling me that Yudkowsky's coherent extrapolated volition is just the standard idealized-preference story with extra clauses bolted on that never bind. You know the four: knowing more, thinking faster, being more the person we wish to be, and growing up farther together. On his reading the last two are decoration and CEV collapses into something like a Railton/Sobelish package — full relevant information, perfect instrumental rationality, desires made consistent and non-self-defeating, then respect whatever is left. I think that's wrong and I want one case that shows it, for a short blog post.

  The two views to separate:

  - the vanilla one: give the person all relevant information, let her reason perfectly and imagine outcomes as vividly as possible, iron out incoherence and self-defeat among her desires, hold what results fixed, and deliver that.
  - CEV: the target isn't her informed current self but the limit of running her forward — more the person she wishes to be, converging, and (if you use it) the growing-up-farther-together clause.

  The case I want: one ordinary person, nothing science-fictional — no uploads, no sims, no prediction tech, no therapy that doesn't exist — a situation a real adult could be in this year. The vanilla account says: don't push the change, give her what she informedly and coherently wants. CEV says: move her along the trajectory even though she presently declines it. And the disagreement has to be about her own will and her own good, not about what she owes anyone: no dependents, no victim, no kid in the story, because as soon as there's someone she's harming the answer goes moral instead of structural.

  Constraints, and these are the ones I'll check:

  1. Not information. Both views get the same full information. She has no factual error that matters, so knowing more can't be what does the work.
  2. Not coherence. Her actual desires should come out of the info + rationality + consistency pass more or less unchanged. If the only reason the vanilla view gets it wrong is that her desires were self-defeating, the case is cheating.
  3. Not pathology. No addiction, nothing clinical, nothing where we'd independently say she's broken — I want the leave-her-alone answer to be genuinely respectable, the kind of thing a reasonable person would defend.

  The engine I have in mind (use it or beat it): path dependence. The person she'd become is reachable only by actually going through something — months of practice, an apprenticeship, a stretch of living somewhere, a discipline — and the person she is now, even with full information and with the endpoint imagined as vividly as you please, has a real and non-ignorant aversion to starting. From the far side she's glad it happened and would not undo it, and that gladness isn't sunk-cost coping or a shrug. So one view takes a fixed point of her present concerns and the other takes the limit of a path she won't volunteer for. Keep it to a single person unless you think CEV is irreducibly multi-agent — in which case say so and argue it, and then you may lean on the growing-up-farther-together clause.

  What I want back:

  - the scenario, under 250 words, in plain prose rather than bullet points, and concrete enough that I can picture this person's kitchen. If I can't, the case has failed.
  - the check: what each account delivers and why, step by step, including a short argument that constraints 1 and 2 really are inactive in your case, which CEV clause is carrying the weight, and whether the extrapolation in your case actually converges or whether you had to add something to make it converge.
  - the ablation: delete the path dependence — make the endpoint reachable by information, reasoning and vivid imagination alone — and show the two views collapse back into agreement. That's the proof the feature is doing the work.
  - the counterattack: the strongest thing my friend says back. My guess is something like: the person she wishes to be is just one more of her preferences, my machinery runs over it too, so your extra clause is either redundant or it's you overriding her with your own idea of who she ought to be. Tell me how to build the case so that reply hurts, and where it still lands even so.
  - one honest line on what would count as you cheating on this brief, since I'm going to quote it.

  Thanks — and sorry if this is over-specified, I'd rather have something that survives him than something elegant.
reasoning: |-
  We are building a case study to distinguish between two accounts of ideal preference: the "vanilla" account (full information, perfect rationality, coherence) and CEV (which includes convergence toward being "more the person we wish to be" and "growing up farther together"). The case must show that CEV recommends a change that the vanilla account does not, without relying on informational deficits, incoherence, or pathology. The key is path dependence: the endpoint requires going through a process that the current self, even with full information and vivid imagination, is averse to starting. After the change, the person is glad and would not undo it.

  **Scenario (under 250 words):**

  Maya, a 35-year-old graphic designer, lives in a cozy but cluttered apartment in Portland. She values her independence and quiet evenings with novels. She has always admired people who play the piano beautifully but believes she has no musical talent. A close friend, a piano teacher, offers her free lessons. Maya declines, even after the friend assures her that she can learn and vividly describes the joy of playing. Maya has all the relevant information: she knows the effort required, the frustration of early practice, and the eventual rewards. She imagines the endpoint clearly — playing Chopin nocturnes in her living room — and finds it appealing. But she also knows her own present aversion to the daily grind of practice and the noise in her small space. She values her current peaceful routine and doesn’t want to disrupt it. The vanilla account respects her current informed, coherent preference: no lessons.

  Yet, if somehow nudged into starting (say, by a persistent friend who books a first lesson as a birthday gift), Maya gradually becomes engrossed. After six months of disciplined practice, she finds deep fulfillment in playing. She reflects: "I’m so glad I started; I feel more like myself now." She would not go back and decline the gift. CEV, by extrapolating her forward along the trajectory of becoming "more the person she wishes to be" (a pianist), recommends the change despite her initial refusal.

  **Check:**

  - **Constraints 1 and 2 inactive:** 
    1. *Information:* Maya has full information. She knows the process, the effort, the potential joy, and her own present temperament. No factual error.
    2. *Coherence:* Her desires are coherent. She values both the endpoint (playing piano) and her current peace. Declining lessons isn’t self-defeating; it’s a trade-off she makes intentionally. The vanilla account doesn’t need to "fix" her preferences.

  - **CEV clause carrying the weight:** This case leans on "being more the person we wish to be." The extrapolation runs her forward along a path where she becomes someone who values piano playing enough to endure the practice. The "growing up farther together" clause isn’t needed; this is single-agent.

  - **Convergence:** The extrapolation converges. As she practices, her identity shifts: she starts to see herself as a learner, then a pianist. Her wishes evolve toward valuing music more deeply, and she stabilizes in this new state. No external force is needed; the path is self-reinforcing.

  **Ablation (removing path dependence):**

  Suppose instead that the endpoint (being a pianist) could be achieved instantly by taking a pill or through a vivid VR simulation that perfectly replicates the skill and emotional payoff. Maya, with full information and vivid imagination, would then choose to take the pill. Both accounts agree: she gets the outcome without the process. The vanilla account delivers it because it’s what she informedly wants now. CEV also delivers it because the endpoint is now reachable without the aversive path, so the extrapolation isn’t blocked. The disagreement vanishes.

  **Counterattack:**

  *The strongest reply:* "The desire to be 'more the person she wishes to be' is already one of Maya’s current preferences. The vanilla machinery can incorporate it. For instance, if she currently wishes to be a pianist (even if she doesn’t wish to practice), that’s a second-order desire. If it’s coherent, the vanilla account might recommend starting lessons to satisfy that higher-order preference. If not, it’s incoherent and gets ironed out. Either way, CEV adds nothing."

  *How it hurts:* This is strong because it targets the core claim that CEV has extra structure. It suggests that Maya’s "wished-for self" is just part of her current preference set, so vanilla handles it.

  *Where it still lands:* In this case, Maya’s current self does not have a second-order desire strong enough to override her aversion. She admires pianists but doesn’t currently wish *to become* one; she sees it as "not for her." The vanilla account sees no conflict to resolve. CEV, however, weights the *future* self’s wishes more heavily because the extrapolation process reveals that her "wished-for self" is latent and will only emerge if the path is taken. The extra clause binds because it looks beyond the current preference structure to where those preferences would evolve.

  **One honest line on cheating:**

  I’d be cheating if I made the case hinge on hidden irrationality (e.g., if Maya’s refusal was secretly due to fear of failure) or if I smuggled in moral obligations (e.g., she promised her friend she’d try). I avoided that by making her refusal a coherent, informed choice and keeping the story purely about her own good.
answer: |-
  ### Scenario (under 250 words):
  Maya, a 40-year-old freelance writer, lives alone in a bright but minimalist Brooklyn apartment with a small, untouched piano in the corner—a gift from her late mother. She works from home, values her quiet routine, and spends evenings reading or cooking. She has always admired piano music and knows learning would bring her profound joy. A friend offers structured, low-pressure lessons. Maya declines. She has full information: she vividly imagines the endpoint (playing Debussy fluidly, the pride and emotional release), understands the 6-month daily practice required, and knows her present self hates disruption. Her aversion isn't ignorance or fear—it's a coherent preference for her current peace. She weighs the trade-off and chooses stagnation. The vanilla account respects this. But if nudged into starting (e.g., by a surprise first lesson booked by her friend), she grudgingly continues. After months of practice, she loves playing. She reflects: "This feels like who I was meant to be; I'd never give it up." CEV pushes for the change, seeing her future self as "more the person she wishes to be."

  ### Check:
  - **Why constraints 1 and 2 are inactive:**  
    1. *Information:* Maya has no gaps. She knows the practice schedule, emotional rewards, and her own temperament (e.g., she anticipates frustration but also the catharsis of mastery). Her vivid imagination of playing Debussy is accurate and detailed.  
    2. *Coherence:* Her desires are consistent. She values both her current routine and the potential joy of piano, but she coherently prioritizes immediate tranquility over long-term growth. No self-defeat: skipping lessons doesn't undermine her other goals (e.g., work or leisure).  

  - **What each account delivers:**  
    - *Vanilla:* Gives Maya what she informedly, coherently wants now: no lessons. It fixes her preferences as-is, respecting her trade-off.  
    - *CEV:* Recommends starting lessons. The "being more the person she wishes to be" clause carries the weight—her future self (after the journey) aligns with her latent ideal identity. The endpoint isn't just desired; it's transformative.  

  - **Convergence:** The extrapolation converges. As Maya practices, her identity evolves: she starts seeing herself as a "pianist," her values shift toward creativity, and the practice becomes intrinsically rewarding. No external fixes are needed—the path self-stabilizes.

  ### Ablation:  
  Remove path dependence: Suppose Maya could instantly gain piano mastery (e.g., via a neural implant simulating years of skill and emotional growth). With full information, she'd choose it—her current self values the endpoint without aversion. Both accounts agree: deliver the implant. Vanilla respects her informed choice; CEV sees no divergence since the endpoint is directly accessible. The disagreement vanishes, proving path dependence drives the split.

  ### Counterattack:  
  **The strongest reply:** "Maya's 'wished-for self' is just a current preference—like wanting to be fit while avoiding gyms. Vanilla machinery processes this: if her higher-order desire to 'be a pianist' is coherent, it overrides her aversion. If not, it's discarded as noise. CEV's 'extra clause' is redundant or paternalistic."  

  **Why it hurts:** This attacks CEV's uniqueness. If Maya's ideal self is reducible to a current preference, vanilla handles it—making CEV seem like an unnecessary override.  

  **Where it still lands:** In this case, Maya's "wished-for self" isn't a *current* preference—it's inert. She admires pianists but doesn't genuinely wish *to become one* now; it feels alien to her identity ("not for me"). Vanilla sees no conflict because her higher-order desires are passive and lose the trade-off. CEV's clause binds by weighting the *trajectory*: her future self's wishes emerge only *through* the path, making the clause non-redundant. The case forces your friend to deny that such latent, path-dependent transformations exist—which feels implausible for ordinary growth.

  ### One honest line on cheating:  
  I'd be cheating if I implied Maya's aversion was irrational (e.g., "she's lazy") or if I sneaked in moral stakes (e.g., "she owes it to her mother"), violating your constraints—here, her choice is a coherent, self-regarding trade-off.
