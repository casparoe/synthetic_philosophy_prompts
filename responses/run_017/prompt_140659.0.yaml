prompt: |-
  So I got drafted onto the norms working group for Plover, the open source project I contribute to — the previous chair left kind of suddenly and somone had to finish the contributor guide before the summit in five weeks, and that someone is apparently me. The bit I'm stuck on is sorting every informal practice in the project into three buckets: enforced rules (CI or code-of-conduct backed, break one and you get sanctioned), conventions (we describe them, we don't enforce them — break one and you're not wrong, just confusing), and habits (we don't mention them at all). The bucket actually matters, bcs calling something a convention is us publicly promising not to punish it.

  Our old chair was a hardline Lewisian about this stuff — a convention solves a recurring coordination problem, the solution is arbitrary among the alternatives, and it holds together bcs everyone conforms, expects everyone else to conform, and conforms conditionally on the others conforming. I assumed that would make the sorting mechanical. It doesn't, and part of the problem is that the minutes from the last two years are full of rulings I can't derive from one clean rule. Roughly:

  - Everyone opens PRs against main even though develop exists and either would work fine; nobody can say why main won. Ruled: convention.
  - The weekly call is at 15:00 UTC; any slot would do if we all moved together; people show up bcs other people show up. Ruled: convention.
  - Commit messages in the imperative mood: basically universal compliance, everyone expects it — but the linter auto-flags anything else, so we ruled it not a convention. Same shaped regularity, wrong sustaining mechanism: the bot, not each other.
  - Reviewing PRs within ~48 hours: high compliance, people who lag get publicly nudged, and most of us would do it anyway to get our own stuff merged. Ruled: not a convention.
  - Running the test suite locally before pushing: near universal, but each of us would keep doing it alone — it catches our own bugs. Ruled: not a convention.
  - 'Fixes #123' lines in PR bodies. Everyone believes the founder decreed this back in 2016; she didn't, it started with one person and got copied. Ruled: still a convention.
  - Everyone thinks everyone else reads the monthly changelog; almost nobody actually does. Ruled: not a convention — expectations without behaviour don't count.
  - The docs team writes 'click' and the API team writes 'invoke'; stable in both, no interaction between the teams. Ruled: not a project convention, and the group point blank refused to say whether each team has its own.

  Now I've got two new ones to rule on next week and I genuinely can't tell which way our own precendents push.

  1. We migrated to a new tracker three weeks ago and design talk split between a Forum and a Chat, both equally workable. Within three days basically everyone was in the Forum, nobody proposed it, and each person says they went where everyone else was. There's no history anyone can appeal to — the Forum is three weeks old.
  2. Everyone posts a one-line 'shipped:' note to #done at the end of the day. Nobody reads #done, nothing of anyone's depends on anyone else doing it, and if half the project stopped the rest would drop it inside a week. But everyone knows everyone does it and everyone would feel like the odd one out being first to quit.

  Help me out: what two or three rules fit all eight earlier verdicts? What does each predict about 1 and 2? Which bucket should we put each in if we want to be consistent with ourselves, which old ruling is the closest analog in each case, and what principle are we committing to either way? And is there a third case — or a question I could put to the group at the summit — that would tell the surviving rules apart? I don't need references or reading lists, I just need the pattern in our own minutes.
reasoning: |-
  Okay, the user is part of the Plover open-source project's norms working group and needs to categorize practices into enforced rules, conventions, or habits. They provided eight past rulings and two new cases. I need to figure out the underlying rules from the precedents and apply them to the new cases.

  First, let's look at the eight rulings to identify patterns. The key is Lewisian conventions: recurring coordination problems with arbitrary solutions sustained by mutual expectations and conditional conformity. 

  In the first example, PRs against main instead of develop—everyone does it because others do, and it's arbitrary. That's a convention. The weekly call at 15:00 UTC is similar; any time would work, but everyone shows up because others do. Also a convention.

  But commit messages in imperative mood have universal compliance because of a linter, not mutual expectations. So it's an enforced rule, not a convention. Reviewing PRs within 48 hours isn't a convention because people do it to get their own PRs merged, not primarily because others expect it. Running tests locally is for personal benefit, so not a convention.

  The 'Fixes #123' lines started organically and spread through copying. Even though it's believed to be decreed, it's still a convention because it's mutual expectation-based. The changelog example isn't a convention because there's an expectation without actual behavior. The docs vs. API team wording isn't a project-wide convention since teams don't interact.

  Now, the common rules derived from these:
  1. **Mutual expectation and conditional conformity** are necessary for conventions. If the behavior relies on tools or personal benefit, it's not a convention.
  2. **Arbitrariness**: The solution must be one of several equally valid options.
  3. **Coordination problem**: The practice must require collective action to avoid inefficiency.

  Applying this to the new cases:
  **Case 1: Forum vs. Chat for design talk.** Everyone went to the Forum because others did. It's arbitrary (both are workable), and people conform expecting others to. This is similar to the PR targeting main or the meeting time. So it should be a convention.

  **Case 2: Posting 'shipped:' to #done.** No one reads it, and if some stopped, others would too. But everyone does it because they think others do and would feel odd quitting first. This mirrors the 'Fixes #123' case where mutual expectation sustains it. However, if stopping doesn't cause coordination issues, maybe it's a habit. But the expectation is there, so it's a convention. The precedent here is 'Fixes #123'—copied behavior without enforcement.

  For consistency, Case 1 is a convention (like PRs against main). Case 2 is also a convention (like 'Fixes #123'). The principle is mutual expectation driving conformity even without coordination necessity. 

  A test case to distinguish: If a practice continues without mutual expectations (e.g., running tests for personal gain), it's not a convention. If it collapses without group conformity, it is.
answer: |-
  Based on your precedents, here are the distilled rules and their application to your new cases:

  ### Core Rules from Precedents
  1. **Convention Criteria** (Lewisian):  
     - Solves a coordination problem  
     - Solution is arbitrary (multiple alternatives would work)  
     - Sustained by:  
       - Universal/near-universal **behavior**  
       - Mutual **expectation** of conformity  
       - **Conditional conformity** ("I do it because others do")  
     *Excludes:* Tool enforcement (*commit linter*), personal incentives (*test suite*), or false expectations (*changelog*).  

  2. **Enforced Rule Criteria**:  
     - Formalized in CI/CoC  
     - Non-compliance triggers sanctions  
     *Example: Commit message linter.*  

  3. **Habit Criteria**:  
     - Lacks mutual expectations/conditional conformity  
     - Driven by personal efficiency or inertia  
     - Collapses without coordination value  
     *Examples: Test suite, PR reviews, team-specific terms.*  

  ---

  ### Analysis of New Cases
  **Case 1: Forum vs. Chat for Design Talk**  
  - **Meets Convention Criteria**:  
    - Coordination problem: Avoiding fragmented discussions.  
    - Arbitrary: Both tools work equally well.  
    - Sustained by:  
      - Near-universal migration to Forum (behavior)  
      - Explicit mutual expectation ("I went where others went")  
      - Conditional conformity (relies on others’ presence).  
  - **Closest Analog**: *PRs against `main`* (arbitrary choice, group-driven coordination).  
  - **Ruling**: **Convention**.  

  **Case 2: Daily `shipped:` Notes in #done**  
  - **Fails Convention Criteria**:  
    - No coordination problem solved (nobody reads it; no workflow depends on it).  
    - Lacks conditional conformity: People would stop if others stopped, but *not because coordination breaks*—it’s social momentum.  
    - Sustained by inertia/social pressure (not mutual expectations for coordination).  
  - **Closest Analog**: *Monthly changelog* (expectation without material impact) and *PR reviews* (personal incentive: feeling included).  
  - **Ruling**: **Habit** (social ritual without coordination value).  

  ---

  ### Principles Committed To
  1. **Conventions require interdependence**: If the practice collapses when others defect (e.g., *Forum* dies if people leave), it’s a convention.  
  2. **Habits lack stakes**: If defection only causes social awkwardness (not workflow failure), it’s a habit.  
  3. **Enforcement overrides convention**: Automated tools make it a rule, even if it started organically.  

  ---

  ### Test Case to Distinguish Rules
  **Present this at the summit:**  
  > *"We’ve always used `//` for single-line comments. If a core contributor switches to `#` in a PR, would you:  
  > (a) Reject it for consistency? → **Convention**  
  > (b) Accept it if the linter allows? → **Enforced rule**  
  > (c) Not care unless others complain? → **Habit**"*  

  **Why it works**:  
  - (a) Reveals conditional conformity ("we use `//` because others do").  
  - (b) Exposes tool enforcement.  
  - (c) Indicates no coordination need.  

  ### Summary Table
  | Case               | Bucket       | Key Precedent          | Principle Committed                                   |
  |--------------------|--------------|------------------------|-------------------------------------------------------|
  | Forum for design   | Convention   | PRs against `main`     | Mutual expectations solve coordination problems.      |
  | `shipped:` notes   | Habit        | Monthly changelog      | Social rituals ≠ conventions without coordination.    |

  Consistency requires strict adherence to the Lewisian "coordination imperative." Case 2 fails because quitting `shipped:` notes doesn’t *break collaboration*—it just feels awkward.
