prompt: |-
  yo — you're a law professor who teaches statutory interpretation in the fall and writes on philosophy of law the rest of the year (the metaphysics of legal content: what fixes what a text means, whether a hundreds-person legislature can have anything worth calling an intention, that kind of thing). Please think carefully and actually brainstorm the mappings before you commit to an answer — I want the worked-out comparison, and I want to see you try out correspondences and reject some of them, not just announce a bottom line.

  So I'm a staff attorney at a legal aid org and we're deciding whether to back a test case, and I've noticed both sides are arguing from analogies and I can't tell how much weight the analogies are actually carrying. Heads up: the statute below is one I made up for the hypothetical, so please don't try to recall any real case or statute — I want you reasoning about the structure of the problem, not about sources. Also no case citations or reading lists, I'm on a laptop with no westlaw and no wifi and I don't want them anyway.

  The statute (enacted 1971): "No person shall, without the consent of the occupant, install or use in any dwelling any device capable of transmitting a visual image of the interior." A 2003 amendment added "or of recording sound from the interior" after a wave of hidden-microphone cases. In the same session a bill to add "or of detecting by any other means the presence, number, or movement of persons within the interior" passed the senate and died in the house. Nothing since. The 1971 committee report is basically all about peeping toms and landlords hiding cameras in smoke detectors.

  The facts: a landlord installs one battery-powered hub per unit, ceiling mounted, no lens, no microphone. It emits radio pulses, measures how the reflections change, and runs a model that renders on his dashboard a blobby animated silhouette — roughly person-shaped, low-res, a stick-figure-ish outline — showing where a body-mass is in the room and how it moves. It distinguishes one occupant from three and "sleeping" from "pacing." No faces, no identifying features. The landlord uses only an aggregate occupancy score to enforce a lease clause barring unauthorized subtenants; the blob view exists in the app one click away and he swears he's never opened it. The vendor markets the things as camera-free and privacy compliant, and the landlord says he picked them precisely because his own lawyer told him the statute only reaches images.

  In my office, Dana says: look, a statute is like a contract. You get the four corners, the defined terms, and whatever background conventions fix ordinary meaning; you don't go rooting around in one side's deleted emails about what they'd hoped for. "Visual image" in 1971 meant a picture made by light, and whatever this thing renders, no lens ever saw that room. So: no violation, and the 2003 dead bill is irrelevant because it was never agreed to. (She also says the fact that even contract law lets in some extrinsic evidence is exactly like the canons — narrow, disciplined exceptions, not a license.)

  Sam says: a statute is like a note or an instruction someone left you. If my colleague writes "meet me at the bank," I don't ask whether a riverbank satisfies the string, I ask what she was trying to get done. The point of this law was that a landlord shouldn't be watching what tenants do inside their own home; a landlord who swapped a lens for a radio antenna gets closer to the mischief, not further from it, and he gets it in a form tenants can't defeat by closing the curtains. So: violation, and the 2003 near-miss shows the legislature was told about the gap and just never got around to it.

  Here's what I want:

  1. Lay out each analogy's correspondence table explicitly: what plays the role of the parties, the assent, the document, the context, the extrinsic material, breach, the remedy, the person doing the interpreting. Do it for the contract analogy and for the note/instruction analogy separately.
  2. Where does each mapping break? And crucially — separate the disanalogies that matter for the job each analogy is being asked to do here from the ones that are just decoration. I don't care that a contract needs consideration or that a note is short; I do care about whatever actually moves the "visual image" question.
  3. What does each analogy quietly import into the statute that the statute doesn't have? I suspect the contract one smuggles in symmetric parties who could have renegotiated, and that silence allocates risk to the party who never agreed; I suspect the note one smuggles in a single speaker with an actual psychology and a reader who's trying to be helpful rather than adversarial. Tell me if I'm wrong and what else is being smuggled.
  4. Does each conclusion survive once the disanalogies are on the table? Does Dana's no-violation survive, does Sam's violation survive, and is the 2003 dead bill entitled to do the work each side wants from it under their own analogy? Is there an asymmetry — i.e., does one analogy depend on the legislative history question more than the other?
  5. My own candidate, which I can't stress-test: a statute is like an API spec or an interface contract. There's a published text, downstream clients write code against it, silent breaking changes are a serious wrong, and clients are entitled to rely on published behavior; but a spec also has a stated purpose and a test suite, and any decent implementer asks what the endpoint was for before deciding what counts as conforming. Spell out the correspondences (who's the client, who's the maintainer, what's a breaking change, what plays the role of the test suite here) and tell me whether this actually does better than the other two, or whether it's just purposivism in a hoodie and whichever side I want it to favor is whichever side I decide the "clients" are. Does it favor one side once you fill in the table honestly?
  6. If there's a better analogy than all three, name it and say why it beats them. If the honest answer is that no analogy can carry this and something else should — canons, the text's own structure, notice and fair-warning considerations, whatever — say that plainly and tell me what should be doing the work instead.

  sorry for the wall of text, but I keep flip-flopping on this and I need to see which parts of my own reasoning are load-bearing. definately don't just tell me what you'd hold — I want to know what's carrying it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a staff attorney at a legal aid org considering a test case about a privacy statute. The core issue is whether a landlord's use of radio pulse devices to detect occupants violates a law prohibiting "visual images" without consent. Both sides in their office are using analogies—contract vs. instruction—to interpret the statute, and the user wants a deep analysis of these analogies plus their own API spec idea.

  Hmm, the user's real struggle seems to be about methodological transparency. They're not just asking "who wins?" but demanding to see the gears turning in statutory interpretation. That meta-awareness is sophisticated—they’re rejecting knee-jerk analogies and craving rigor. Their hidden question might be: "How do I spot when my colleagues are dressing up policy preferences as neutral analysis?"

  First, I need to map both analogies meticulously. For the contract comparison: parties = legislature/enacted text vs. citizens; assent = voting process; extrinsic evidence = legislative history. But the asymmetry jumps out—citizens never "negotiate" statutes. That’s a critical disanalogy because Dana’s argument leans hard on textual certainty for reliance interests. If the landlord relied on "visual image" meaning optical capture, that’s reasonable… but only if we ignore that statutes aren’t bilateral deals. The 2003 dead bill? Under this frame, it’s like rejected contract terms—irrelevant. But is that fair? Contract law sometimes considers course of dealings, but here there’s no "course"—just a failed amendment. Tricky.

  Now Sam’s instruction analogy: speaker = legislature; hearer = implementer; purpose = stopping surveillance. This makes the blob-tracking clearly unlawful—it’s the functional equivalent of spying. But the disanalogy screams: legislatures aren’t single minds! The 1971 committee fixated on cameras, so maybe they’d shrug at radio sensors. And the 2003 bill? Under this view, it’s like the speaker later clarifying intent—but since it failed, is it a "correction" or just noise? Sam’s approach imports mind-reading risks.

  The user’s API spec idea is fascinating. Maintainer = legislature; clients = citizens/courts; test suite = purpose + text. Breaking change = surprising applications. Here, the blob device feels like a violation—it bypasses expected privacy safeguards (curtains don’t block radio waves!). But the vendor’s "camera-free" marketing shows reliance on textual limits. So does purpose trump reliance? The user’s right to worry this might just repackage purposivism… but it explicitly weighs both, which is an improvement.

  Wait—the user’s footnote about "clients" matters. If courts are the clients, they need predictable rules. If tenants are, they need protection. The API analogy doesn’t resolve that tension; it just makes it visible. That’s actually useful: it forces acknowledgment that statutory interpretation always involves allocation of risk.

  Ultimately, no analogy is perfect. The real workhorses here are fair warning (against retroactive expansion) and mischief-rule purposivism. The blob device exploits a gap, but the legislature almost closed it. That near-miss suggests the tech wasn’t unforeseen—just unaddressed. Still, applying 1971 law to 2024 tech feels stretched. Maybe the better path is legislative nudge: rule narrowly for the landlord but flag the policy gap.

  The user’s flip-flopping is rational—this is genuinely interstitial. My verdict? Neither analogy dominates, but the API framework best exposes the trade-offs. Still, pure textualism plus notice concerns might tip toward no violation… while screaming for a legislative fix.
answer: |-
  Below is a structured breakdown of the analogies and their implications for your hypothetical case. I'll follow your requested framework step-by-step, stress-testing each analogy's logic and exposing hidden assumptions.

  ---

  ### **1. Correspondence Tables**  

  #### **Dana's Contract Analogy**  
  | **Contract Element**       | **Statutory Equivalent**               | **Role in Argument**                                                                 |  
  |----------------------------|----------------------------------------|--------------------------------------------------------------------------------------|  
  | Parties                    | Legislature (drafter) vs. Citizens (bound party) | Asymmetric "agreement" – citizens never truly assent.                                |  
  | Assent                     | Enactment process                     | Text is the exclusive "meeting of minds."                                            |  
  | Written Document           | Statute text                          | "Four corners" control; no extrinsic evidence.                                       |  
  | Context/Conventions        | Ordinary meaning (1971)               | "Visual image" = optical representation.                                             |  
  | Extrinsic Evidence         | Legislative history, failed amendments | Inadmissible (like rejected contract terms).                                         |  
  | Breach                     | Violation of statute                  | Landlord's tech doesn't trigger textual prohibition.                                 |  
  | Remedy                     | Penalty/enforcement                   | Irrelevant to interpretation.                                                        |  
  | Interpreter                | Judge as neutral arbitrator           | Focuses on textual "bargain," not policy.                                            |  

  #### **Sam's Instruction Analogy**  
  | **Instruction Element**    | **Statutory Equivalent**               | **Role in Argument**                                                                 |  
  |----------------------------|----------------------------------------|--------------------------------------------------------------------------------------|  
  | Speaker                    | Legislature (as unitary actor)         | Assumes coherent "intent."                                                           |  
  | Listener                   | Citizen/official applying law          | Interpreter must achieve speaker's goal.                                             |  
  | Words                      | Statute text                           | Starting point, but not exhaustive.                                                  |  
  | Context/Purpose            | Legislative purpose (privacy invasion) | "Bank" = what solves the problem, not literal meaning.                               |  
  | Extrinsic Clues            | Failed amendments, reports             | Evidence of unresolved concerns (like speaker's frown).                              |  
  | Miscommunication           | Violation of purpose                   | Landlord circumvents spirit of the law.                                              |  
  | Correction                 | Judicial "fix"                         | Courts should align outcome with intent.                                             |  
  | Interpreter                | Agent fulfilling speaker's wish        | Helper role – adversarial context ignored.                                           |  

  ---

  ### **2. Where Mappings Break & What Matters**  
  #### **Contract Analogy Breakdown**  
  - **Critical Disanalogies**:  
    - **Asymmetry**: Citizens don't "negotiate" statutes. Landlord's reliance on text is reasonable, but tenants never consented to gaps.  
    - **Silence ≠ Allocation of Risk**: Contract law often treats silence as accepting risk. But statutes bind unwilling parties – silence may reflect oversight, not deliberate choice.  
    - **Relevance to "Visual Image"**: If "visual image" is unambiguous (per 1971 optics), the analogy holds. If ambiguity exists, the analogy forbids consulting context that might resolve it.  

  #### **Instruction Analogy Breakdown**  
  - **Critical Disanalogies**:  
    - **Collective "Intent"**: Legislatures lack a singular mind. The 1971 committee focused on *cameras*; the 2003 Senate wanted broader coverage. Whose "purpose" controls?  
    - **Adversarial Context**: Unlike a helper, courts resolve disputes between hostile parties. Ignoring text risks unfair surprise.  
    - **Relevance to "Visual Image"**: If purpose (preventing surveillance) dominates, "image" expands to cover blobs. But if text limits purpose, the analogy overreaches.  

  ---

  ### **3. Smuggled Assumptions**  
  - **Contract Analogy**:  
    - Imports **bilateral negotiation** (nonexistent in legislation).  
    - Assumes **citizen reliance** is paramount (ignores tenant reliance on privacy).  
    - Treats the legislature as a **sophisticated drafter** (but 1971 tech couldn’t foresee radio sensors).  

  - **Instruction Analogy**:  
    - Imports a **unified speaker psyche** (legislatures have no collective brain).  
    - Casts the interpreter as a **loyal subordinate** (courts are neutral, not helpers).  
    - Equates **functional equivalence** with legal equivalence (ignoring textual limits).  

  ---

  ### **4. Conclusions After Stress-Testing**  
  - **Dana (No Violation)**:  
    - Survives if text is unambiguous. "Visual image" likely meant optical depictions in 1971.  
    - **2003 Bill**: Properly irrelevant under contract logic – rejected terms aren’t part of the "deal."  
    - **Vulnerability**: If "visual image" is ambiguous, the analogy forbids tools to resolve it.  

  - **Sam (Violation)**:  
    - Survives if purpose controls. Surveillance via radio waves is worse than cameras (no curtain defense).  
    - **2003 Bill**: Reveals the legislature knew of the gap – like a speaker correcting a misstatement.  
    - **Vulnerability**: Expands "image" beyond plausible meaning, risking retroactive punishment.  

  - **Asymmetry**: Sam’s analogy **depends entirely** on the 2003 bill to show legislative purpose. Dana’s rejects it categorically.  

  ---

  ### **5. Your API Spec Analogy**  
  #### **Correspondences**  
  | **API Element**          | **Statutory Equivalent**               |  
  |--------------------------|----------------------------------------|  
  | Published Spec           | Statute text                           |  
  | Maintainer               | Legislature                            |  
  | Clients                  | Citizens (landlords/tenants), courts   |  
  | Endpoints                | Prohibited acts (e.g., "install device")|  
  | Breaking Change          | Unpredictable expansion of liability   |  
  | Test Suite               | Purpose + text                         |  
  | Conforming Implementation| Conduct within textual bounds          |  

  #### **Analysis**  
  - **Strengths**:  
    - Balances **reliance** (landlord coded to "visual image" spec) and **purpose** (privacy endpoint).  
    - The blob device is a **breaking change**: Tenants can’t "patch" against radio waves (unlike curtains for cameras).  
    - **2003 Bill = Bug Report**: Shows the spec had vulnerabilities the maintainer considered fixing.  
  - **Weaknesses**:  
    - **Who Are "Clients"?** Landlords (relying on text) vs. tenants (relying on purpose). Favors tenants if "purpose" is part of the spec’s "documentation."  
    - **Not Just Purposivism**: Unlike Sam’s analogy, it honors textual boundaries unless they defeat the endpoint. Here, the text *can* cover blobs if "visual image" includes machine-generated representations.  
  - **Verdict**: Does better than others by forcing explicit tradeoffs. Favors **violation** if:  
    - The spec’s "test suite" (purpose) flags blob-tracking as a privacy breach, AND  
    - The text isn’t "broken" by interpreting "image" to include synthetic renderings.  

  ---

  ### **6. Best Analogy / Alternative Approach**  
  - **Superior Analogy: Building Code**  
    - **Correspondence**:  
      - Text = Technical specifications (e.g., "fire-resistant materials").  
      - Purpose = Safety objectives (prevent fires).  
      - New Technology = Novel materials (e.g., foam insulation).  
      - **Interpretation**: Compliance requires meeting both specs *and* objectives. A material meeting specs but violating safety fails.  
    - **Why Better**:  
      - Acknowledges text as primary, but voids loopholes that defeat core objectives.  
      - Accepts that legislators can’t foresee all tech (unlike contract negotiation).  
      - Rejects both rigid textualism ("specs only") and intent-focused purposivism.  
    - **Applied Here**: Blob-tracking violates the privacy objective *and* arguably the text ("visual image" could encompass non-optical representations).  

  - **No Analogy? Use These Tools Instead**:  
    1. **Textual Canons**: *Noscitur a sociis* – "visual image" is paired with "recording sound" (2003), suggesting sensory capture. Blobs are sensory data.  
    2. **Fair Warning**: Landlord had notice the statute covered surveillance tech. Vendor’s "privacy compliant" claim is irrelevant.  
    3. **Legislative Silence**: The 2003 near-miss shows awareness of the gap, but courts shouldn’t fill it. Penalize only clear violations.  
    - **Bottom Line**: **Violation** is defensible using canons + purpose, but **legislative fix is overdue**. A court might split the difference: No penalty for past acts (fair warning), but enjoin future use (mischief rule).  

  ---

  ### **Conclusion**  
  - **Dana’s contract analogy** oversimplifies by assuming symmetric bargaining and textual precision.  
  - **Sam’s instruction analogy** overreaches by imputing unified intent and downplaying text.  
  - **Your API spec** improves by balancing reliance and purpose but still forces a policy choice about "clients."  
  - **Building code analogy** or **canon-based reasoning** best handles gaps in regulatory statutes. Here, the blob device **likely violates the statute** because:  
    - It captures spatially precise occupancy data (a functional "image"),  
    - Exploits a loophole the legislature nearly closed, and  
    - Undermines the core objective of *Katz*-style privacy in dwellings.  

  The weight of the analogies lies in how they allocate the risk of technological change: contracts favor the party relying on text; instructions favor the beneficiary of purpose. Statutes must do both – which is why the building code/API frameworks are strongest.
