prompt: |-
  I want the specification before I go back to any particular account: what does a theory of the badness of human extinction, over and above the badness of the deaths it involves, have to deliver in order to be adequate, where adequate means good enough to tell a legislature or a large funder how much weight to give to reducing extinction risk as against other uses of the same money? Write the desiderata, each with the case or consideration behind it, covering at least these: whether the badness has to be bad for someone, and what a theory is permitted to say if it need not be; the replacement case, in which every human being dies painlessly at once but is succeeded by a species whose lives go about as well as ours would have; the remnant case, in which a thousand people survive in isolation with no realistic prospect of growth; the consensual case, in which extinction is wanted by everyone then alive and nobody is killed against their will; the non-identity wrinkle, that the people who would exist if extinction were averted are almost none of the people who would otherwise have existed; and the question of whether the theory owes a cardinal weight at all or may refuse to give one. Then separate the non-negotiable requirements from those that are only the preference of a camp — my own suspicion is that the demand that the badness be someone's is a prejudice in a desideratum's clothing, while the demand for a number is not — and if some subset of the desiderata cannot be jointly satisfied, say which and why, since a list with a contradiction in it is itself the useful result. Close with a single paragraph on which one requirement excludes the most accounts currently on offer, and on whether Scheffler's afterlife conjecture, the claim that our confidence in a collective human future is a condition of our valuing anything at all, gets past that requirement. Please write in continuous prose: no headings, bullet points, bold text, or tables.
reasoning: |-
  Hmm, the user is asking for a rigorous specification of what makes a theory about the badness of human extinction adequate. They want desiderata that cover several philosophical cases like replacement, remnant, consensual scenarios, plus the non-identity problem and the need for cardinal weighting. They also want me to distinguish non-negotiable requirements from camp preferences and identify any contradictions.

  This seems like a request for analytical philosophy applied to existential risk ethics. The user is clearly familiar with concepts like Scheffler's afterlife conjecture and the non-identity problem, suggesting they're either an academic or a sophisticated policymaker. Their suspicion that "bad for someone" might be a prejudice hints at skepticism toward person-affecting views.

  Breaking this down: First, I need to establish core desiderata. The "bad for someone" requirement is fundamental - can impersonal value exist? Then there's Parfit's replacement case where humans are replaced by equally happy aliens, which tests if humanity itself has intrinsic value. The remnant case with 1000 survivors examines whether mere continuity matters. The consensual extinction scenario challenges whether collective preference can override badness. The non-identity problem complicates things because future people aren't the same individuals - so who is harmed? Finally, the cardinal weighting demand asks if we must quantify badness for policymakers.

  Now for tensions: Impersonal theories can handle replacement but struggle with consensual extinction. Person-affecting views ace consensual cases but implode with non-identity. The cardinal requirement clashes with theories that see extinction as categorically bad beyond quantification.

  The biggest hurdle seems to be non-identity combined with cardinal weighting. Most theories either ignore future people's non-identity or retreat to vague ordinal rankings. Scheffler's conjecture - that valuing anything requires belief in humanity's future - cleverly sidesteps this by making extinction undermine all present value, but it risks circularity when we ask why that matters.

  I'll structure this as continuous prose: first list and justify all desiderata, then separate non-negotiables from preferences, expose contradictions, and end with how Scheffler fares against the toughest requirement. The user's suspicion about "bad for someone" being prejudiced seems right - it's a metaethical stance, not a logical necessity. But their view that cardinal weighting isn't optional feels correct for policy applications.
answer: |-
  A theory aiming to adequately account for the distinct badness of human extinction, beyond the individual deaths involved, and sufficiently robust to guide legislative or major funding priorities must satisfy several demanding desiderata, each grounded in specific philosophical challenges or practical considerations. First, it must explicitly address the **"bad for whom?" requirement**: whether the badness necessitates being bad *for* some existing or future sentient being, or if it can be an impersonal loss – a diminution of value not strictly tied to welfare impacts on identifiable subjects. This is crucial because person-affecting views face significant difficulties with future generations, while impersonal views risk violating intuitions about consent or autonomy. Second, it must resolve the **replacement case**: if humanity is instantly and painlessly replaced by a distinct species (aliens, super-AIs) whose lives are equally (or more) flourishing, is extinction still bad? This tests whether the badness is tied solely to aggregate welfare or to the *human* project specifically. Third, it must handle the **remnant case**: if a tiny, isolated group (e.g., 1000 people) survives indefinitely with no hope of technological recovery or population growth, does this avert the distinctive badness of extinction, even though the vast potential of humanity is lost? This probes the necessity of flourishing, growth, or large-scale continuity. Fourth, it must confront the **consensual case**: if every living person freely and knowledgeably desires human extinction (perhaps believing it the best outcome), and it is achieved without violating anyone's will, is it still bad? This challenges whether the badness can be objective, overriding even unanimous preference. Fifth, it must navigate the **non-identity problem**: since averting extinction would lead to an almost entirely different set of future people being born compared to the scenario where extinction occurs later (after those specific individuals exist), it becomes difficult to claim extinction is *worse for* those future people who never exist. The theory must explain the loss without relying on harm to those specific non-existent individuals. Finally, it must answer the **cardinality demand**: can, and must, the theory provide a cardinal measure (or at least a strong ordinal ranking with actionable weight) of extinction’s badness relative to other pressing needs (like preventing current suffering or poverty), or is it permitted to deem extinction categorically worse (or incomparable), precluding such trade-offs? Practical resource allocation necessitates some form of quantifiable weight.

  Distinguishing non-negotiables from camp preferences is essential. A genuine non-negotiable requirement for an *adequate policy-guiding theory* is the **cardinality demand** (or at least a strong, action-guiding ordinal ranking). Without this, the theory cannot fulfill its core purpose of informing resource allocation; it remains a philosophical abstraction. The insistence that the badness **must** be "bad for someone" is likely a **preference** (characteristic of person-affecting views), not a strict requirement. Impersonal value theories (e.g., valuing the existence of humanity, civilization, or potential per se) are coherent alternatives, though they face their own challenges (like the consensual case). Similarly, the insistence that the theory *must* deem replacement extinction bad, or *must* deem the remnant case still bad, reflects substantive value judgments (e.g., species chauvinism vs. strict welfarism) rather than logical necessities for adequacy.

  Significant tensions exist. The **non-identity problem** and the **"bad for whom?" requirement** are deeply intertwined and create a major hurdle. Person-affecting theories struggle mightily with non-identity; avoiding extinction doesn't benefit identifiably worse-off future individuals. Impersonal theories easily handle non-identity (the loss is of impersonal value – future flourishing, culture, potential) but then clash with the **consensual case**: if impersonal value is paramount, even unanimous, informed consent to extinction might not negate its badness, which seems counterintuitive or even authoritarian to some. Furthermore, a theory emphasizing the intrinsic value of *humanity* might deem replacement extinction bad but struggle to explain why the remnant case isn't sufficient to avert the core badness, potentially conflicting with intuitions about scale and potential. A theory focused purely on the loss of aggregate future welfare might see replacement extinction as neutral but fail to capture the unique loss many feel at humanity's end.

  The requirement that excludes the most current accounts is likely the combination of the **non-identity problem** and the **cardinality demand**. Many intuitively powerful accounts founder on non-identity: they struggle to articulate *who* is harmed by extinction in a way that survives the realization that the future people who would benefit from its aversion are different from those who would exist otherwise. This often pushes theories towards impersonal valuations (loss of potential, cosmic significance). However, impersonal valuations then face immense difficulty in meeting the cardinality demand – how to quantify the loss of "human potential" or "cosmic significance" in units comparable to preventing a million malaria deaths *now*? Most impersonal accounts either become vague, assert categorical incomparability (violating the cardinality demand), or resort to highly speculative and contestable long-term welfare aggregation, which is fraught with uncertainty and discount rate controversies.

  Scheffler’s afterlife conjecture – that our confidence in humanity’s indefinite future is a precondition for our ability to value anything in our own lives – offers a unique path. It directly addresses the **"bad for whom?"** requirement by making extinction bad for *us, now*: it undermines the foundation of our present valuing activities. This elegantly sidesteps the non-identity problem (the harm is to existing people) and provides a clear, person-affecting reason why extinction is uniquely bad beyond the deaths. It can also handle the consensual case (if the conjecture is true, genuine informed consent to extinction might be psychologically impossible or deeply irrational). However, its ability to meet the **cardinality demand** is highly questionable. While it establishes a *reason* for the badness, translating the erosion of meaning-conditions into a cardinal weight against concrete current welfare losses involves profound psychological and philosophical uncertainties. Quantifying how much funding is justified to protect the "scaffolding of value" versus alleviating current suffering remains exceptionally difficult, meaning Scheffler's account, while powerful on several desiderata, may still struggle with the core requirement for actionable policy guidance.
