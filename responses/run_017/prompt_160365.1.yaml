prompt: |-
  i'm a political philosopher by training but they've put me on the first-year public ethics module, and i've stupidly agreed to do the corruption week, so i want to walk in with something better than the NGO-style definition everyone opens with — entrusted power used for private gain — because maybe half my cases fall outside it. Let me just say what i actually think case by case and see what you can make of it.

  A nurse in a public hospital who hasn't been paid in three months takes cash from a family to find a bed for their mother: i won't call that corruption, it feels more like a toll, or like a wage. Same nurse, same envelope, but this time to push their mother ahead of another patient in a queue that otherwise works fine: corruption. A building inspector takes forty dollars to sign off on wiring that will burn a house down: corruption, and worse than the queue-jumping, even though the money is smaller. A mayor awards a contract to a firm run by his cousin's husband — lowest bid, good work, no kickback — and i still want to call it corruption, though i can't say what was stolen. A different mayor steers a bridge to her own district to win re-election, and i don't want to call that corruption, just politics, though it's also an office used for someone's advantage. A minister takes a job with a company he used to regulate; nothing was agreed in advance, but i call it corruption anyway and can't point to the moment it happened. A firm pays someone inside the city to nudge the training data of the algorithm that ranks permit applications, so theirs comes out on top: no official exercised judgement, no rule was broken, and i still say corruption. A procurement framework drafted so that exactly one domestic firm qualifies, drafted by people who'll go on to work there, legal at every step: i say corruption, and worse than the inspector, but there's no payment and no individual victim i can name. A company pays an impoverished village to consent to a waste facility: i go back and forth, and i lean toward not corruption, which worries me, because the thing being bought is the one thing i thought couldn't be bought. Gifts: a goat to the midwife after a safe birth, fine; a two-hundred-dollar gift card to a teacher from a parent, i flinch; corporate hospitality at a tennis tournament for a regulator, corruption. An official who quietly lets a widow skip a queue out of pity, taking nothing: i don't call it corruption, but only because nothing was gained, and that feels like the wrong reason. And then a border clerk in a state whose only real function is extraction, who takes money to lose the paperwork on a shipment of grain: i want to call that sabotage rather than corruption, but i suspect i only get to say that if i've already decided the state is illegitimate — which seems to make corruption depend on a political judgement i'd rather keep out of the definition.

  My tentative principle, such as it is: an act is corrupt when someone occupying a role lets a consideration that the role exists to exclude override the considerations the role exists to answer to. So: does that actually deliver my verdicts, and where does it break? It looks like it can't reach the algorithm case, where nobody's reasoning was moved at all, only the inputs; and it looks like it might clear the procurement framers, who could say they were serving development policy all along. Does "private gain" need to be a separate clause, or should i drop it and accept that the pity case is corruption with an excuse? And is the principle culturally neutral, or does it smuggle in a specifically Western administrative picture — impersonal offices, rules that bind against relationship — given that in plenty of places a gift to an official is how you acknowledge a relation rather than how you buy a decision? Two of my colleagues say that calling those gifts corruption just exports one administrative ideal and calls it a moral standard, and i'd like to know whether my principle has the resources to say the gift cases are genuinely different in kind, or whether it has to say the difference is only in what the local norms happen to be.

  Give me the principle in a form i could defend in a lecture, with the case that motivates each clause, verdicts on two cases i haven't listed (including one i'd definately find counterintuitive), and an honest list of which of my verdicts i have to give up. I'd rather drop a verdict than add a clause that only exists to save it.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They're a political philosopher teaching a public ethics module, specifically on corruption. They're frustrated with the standard NGO definition of corruption as "entrusted power for private gain" because it doesn't cover half their cases. They provided several scenarios where their intuitive judgments don't fit that definition, and they want a better principle that aligns with their intuitions while being defensible in an academic setting.

  First, I need to analyze each case they mentioned to identify common threads. For instance, the nurse taking money to find a bed when unpaid isn't seen as corruption, but doing so to jump the queue is. The building inspector taking a bribe for unsafe wiring is worse. Then there's nepotism without kickbacks, algorithmic manipulation, and gifts like a goat versus a gift card. Each case varies in whether private gain is involved, if rules are broken, or if harm occurs.

  The user's tentative principle is about roles and excluded considerations overriding role purposes. But they worry it might not cover cases like algorithmic tampering where no individual's reasoning is influenced. Also, cultural neutrality is a concern—whether their Western-centric view of impersonal roles unfairly labels certain gifts as corrupt.

  Key challenges: 
  1. Covering cases where no individual decision-maker is involved (algorithm). 
  2. Differentiating between acceptable and corrupt gifts without cultural bias. 
  3. Explaining why nepotism is corrupt even without personal gain. 
  4. Addressing the border clerk in a corrupt state—does legitimacy matter?

  I need to refine their principle. Maybe focus on the institutional purpose being subverted, regardless of individual intent. For the algorithm, it's about corrupting the system's inputs, aligning with institutional subversion. Gifts could be evaluated based on whether they distort role duties, considering local norms but within a framework of institutional integrity.

  Testing the principle against unmentioned cases: 
  - A judge ruling in favor of a friend without payment might be corrupt under the new principle if it subverts judicial impartiality. 
  - A politician appointing a qualified donor to an advisory role—if qualifications are genuine, it might not be corrupt, which could be counterintuitive if the appointment is seen as payback.

  The user might have to give up the verdict on the widow skipping the queue. If the role's purpose (fair queuing) is subverted for compassion, even without gain, it could be seen as a minor corruption, though excusable. Also, the village consent for the waste facility—if the payment undermines autonomous consent, it might be corrupt, conflicting with their initial lean.

  Cultural neutrality: The principle should allow that role purposes are context-dependent. A gift in one culture might be part of the role's expectations, not an excluded consideration. So the framework must accommodate varying institutional designs without relativism.

  In the lecture-ready version, structuring with clauses based on cases: institutional subversion, systemic corruption, gain as typical but not necessary. Highlighting verdicts on new cases and admitting where intuitions might shift, like the widow case.
answer: |-
  Here's a corruption framework distilled from your intuitions, designed for academic defense, with case-motivated clauses, verdicts on new cases, and explicit trade-offs. The core idea shifts focus from *individual gain* to **institutional subversion**:

  ---

  ### **Principle of Institutional Subversion**
  **An act is corrupt when it subverts a public institution’s core purpose by introducing considerations that the institution is designed to exclude, thereby degrading its functional integrity.**  

  #### **Key Clauses & Case Motivations:**
  1. **"Subverts a public institution’s core purpose"**  
     *Motivation:* Explains why legal acts (e.g., tailored procurement frameworks) are corrupt. The institution (e.g., competitive bidding) exists for fair allocation, but its purpose is hijacked to serve nepotism/self-interest (*Mayor’s cousin case*).  
     *Clarifies:* The "stolen" thing is institutional integrity, not tangible goods.

  2. **"Introduces considerations the institution is designed to exclude"**  
     *Motivation:* Distinguishes acceptable acts from corrupt ones:  
     - The *unpaid nurse* accepting cash for basic service isn’t corrupt if the hospital fails its duty (survival isn’t an "excluded consideration").  
     - The *nurse taking cash to jump a queue* introduces *personal favoritism*, which triage systems must exclude to function (*Queue-jumping case*).  
     - *Corporate hospitality for a regulator* injects *reciprocal obligation* into a role requiring impartiality (*Tennis tournament case*).

  3. **"Degrading functional integrity"**  
     *Motivation:* Captures systemic harm even without individual malice:  
     - *Algorithmic manipulation* subverts the permit system’s purpose (fair ranking) by poisoning its inputs (*Training data case*).  
     - The *building inspector* signing off on deadly wiring destroys trust in safety oversight, a core institutional function (*Wiring case*).

  ---

  ### **Verdicts on Your Cases Using This Principle:**
  | Case                                      | Your Verdict   | Principle’s Verdict | Consistency |
  |-------------------------------------------|----------------|---------------------|-------------|
  | Unpaid nurse takes cash for basic service | Not corruption | Not corruption      | ✓           |
  | Nurse takes cash to jump queue            | Corruption     | Corruption          | ✓           |
  | Inspector takes bribe for unsafe wiring   | Corruption     | Corruption          | ✓           |
  | Mayor awards contract to cousin’s firm    | Corruption     | Corruption          | ✓           |
  | Mayor steers bridge for re-election       | Not corruption | **Corruption**      | ✘ (Trade-off) |
  | Minister takes job with former regulatee | Corruption     | Corruption          | ✓           |
  | Algorithmic data manipulation             | Corruption     | Corruption          | ✓           |
  | Tailored procurement framework            | Corruption     | Corruption          | ✓           |
  | Company pays village for waste consent    | Not corruption | **Corruption**      | ✘ (Trade-off) |
  | Goat to midwife                           | Not corruption | Not corruption      | ✓           |
  | $200 gift card to teacher                 | Corruption     | Corruption          | ✓           |
  | Clerk "loses" paperwork in extractive state| Not corruption | Not corruption      | ✓           |
  | Official lets widow skip queue (no gain)  | Not corruption | **Corruption**      | ✘ (Trade-off) |

  ---

  ### **Verdicts on New Cases:**
  1. **A judge reduces a friend’s fine based on merit, but faster than usual.**  
     *Verdict:* **Not corruption.** The core purpose (fair sentencing) is upheld; efficiency isn’t inherently excluded. If *other cases were delayed* to prioritize the friend, it would subvert the court’s purpose (equal treatment).  

  2. **A politician appoints a major donor to an advisory role. The donor is qualified, but their rival was slightly more experienced.**  
     *Verdict:* **Corruption** (counterintuitive to some). The institution (appointments) exists to select the *best* expertise, but introduces *financial support* as a consideration. Degrades trust in meritocratic integrity.

  ---

  ### **Trade-offs Required (Verdicts You Must Surrender):**
  1. **The re-election bridge (*"Just politics"*):**  
     - *Why surrender?* Steering public resources to win votes introduces *electoral advantage* into infrastructure planning, subverting its purpose (serving communal need). If the institution tolerates this, it becomes a vehicle for personal power.  
     - *Defense in lecture:* "Politics isn’t corruption only when it operates *within* institutional purposes. Gerrymandering is 'just politics' too—but we rightly call it corrupt when it subverts representative democracy."  

  2. **The paid village consent (*"Not corruption"*):**  
     - *Why surrender?* The institution (community consent) exists to ensure *autonomous, informed* agreement. Payment introduces *desperation/coercion* (considering the village’s poverty), degrading the integrity of consent.  
     - *Defense:* "When poverty makes 'choice' illusory, buying consent subverts the institution’s purpose—like paying a starving person to 'voluntarily' sell their kidney."  

  3. **The pity queue-skip (*"Not corruption"*):**  
     - *Why surrender?* The queue exists for equitable access. *Pity* is an excluded consideration (unless formalized, e.g., medical triage). It subverts the institution’s purpose (fairness), even with noble intent.  
     - *Defense:* "This *is* corruption—but minor and excusable. We condemn the act, not the person. Calling it corruption highlights how systems must build in compassion (e.g., hardship provisions), not rely on ad-hoc breaches."

  ---

  ### **Addressing Your Concerns:**
  - **"Private gain" clause?** *Dropped.* Gain is a common *symptom* but not necessary (e.g., nepotism). The widow case shows corruption without gain.  
  - **Cultural neutrality:** The principle *avoids* Western bias by anchoring to **the institution’s purpose in its context**.  
    - *Gift to an official:* In a culture where gifts *are part of the role* (e.g., honoring reciprocal duty), they aren’t "excluded considerations." But if gifts distort a role designed for impartiality (e.g., judges), it’s corrupt.  
    - *Lecture defense:* "Corruption isn’t about exporting ideals. It’s about whether an act hollows out an institution *as locally conceived*. If a system is designed to incorporate personal bonds (e.g., clan-based governance), gifts aren’t corrupt. But if a hospital queue is formally merit-based, inserting kinship subverts it—even where kinship matters elsewhere."  
  - **Algorithm case:** *Covered.* Tampering with inputs introduces *fraudulent data* (excluded consideration), subverting the algorithm’s purpose (impartial ranking). No official needs to be "influenced"—the *institution* is corrupted.  
  - **Procurement framers:** Still corrupt. Drafting rules to favor future employers introduces *careerism* into policy design, excluding impartial public service.  

  ---

  ### **Lecture-Ready Summary:**  
  > "Corruption isn’t merely ‘power for private gain.’ It’s the **subversion of public institutions by smuggled considerations**. When a nurse skips a queue for cash, she injects *bribery* into a triage system built for *medical urgency*. When an algorithm is poisoned, *deception* invades a system meant for *neutral efficiency*. Even ‘legal’ acts—like drafting procurement rules to favor your future employer—corrupt when they hollow out institutions from within.  
  >  
  > This definition avoids cultural imperialism: if an institution *embraces* personal ties (e.g., gifts as tokens of trust), they aren’t corrupt. But where institutions are designed to *exclude* such ties—like a courtroom or permit queue—introducing them is corruption, whether money changes hands or not.  
  >  
  > Why prefer this? The old definition obsesses over individual villains. This one exposes how corruption erodes the machinery of public life—and why rebuilding institutions matters more than punishing offenders."

  This forces you to abandon three intuitive verdicts but gains consistency, systemic focus, and cultural flexibility. The core advance: corruption as **institutional sabotage**, not individual moral failure.
