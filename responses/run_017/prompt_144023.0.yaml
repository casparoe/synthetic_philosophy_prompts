prompt: |-
  i'm in an indian epistemology course right now and we're doing the nyaya stuff on pramanas, and i realised i've been lowkey sorting cases by a rule i can't actually state. help me state it, or tell me my verdicts are a mess.

  the set-up we were given: a pramana is a source of a *new* true cognition; the nyaya list is four — pratyaksha (perception), anumana (inference, which runs through an invariable concomitance like smoke-with-fire), upamana (comparison: coming to know what a word denotes from its similarity to something you remember), and shabda (testimony: coming to know something from understanding what a trustworthy speaker said). memory and tarka — the "if there were no fire there'd be no smoke" kind of backing-reasoning — are supposed not to be pramanas.

  here are my gut verdicts, and i've included the ones i'm shaky on because i think those are where the rule shows:

  1. smoke on the hill, so fire on the hill: anumana, no drama.
  2. my roommate texts "the 6:15 is cancelled" and i come to know it: shabda. i know i *saw* pixels, but that's not where the knowledge comes from.
  3. i see a guy's face across the street and after half a second realise it's my old roommate from six years ago: i want to say pratyaksha, and that the memory doing the recognising isn't a pramana. but it feels like the memory is load-bearing in a way that "just a causal condition" doesn't capture. verdict: perception, but grudgingly.
  4. a printed sign reading BRIDGE OUT on a road i'm driving down: shabda, not perception — even though i read it with my eyes and there's no speaker in the room.
  5. i glance at the counter and come to know my keys aren't there: i really don't want to call this inference (what's the pervasion?), and "perception of an absence" sounds like a dodge, but i also don't want to add a fifth pramana just to save this one case.
  6. i read 38.2 off a thermometer and come to know i have a fever: my verdict is pratyaksha. but if i then found out the thermometer was calibrated by some guy who eyeballed it, my verdict slides to shabda — and if i find out the guy is unreliable, it slides to *no pramana at all*. that sliding bothers me; is it a sign i'm using the wrong test?
  7. a field guide says "a tapir looks like a pig with a short prehensile snout"; i see one at the zoo and come to know that's a tapir. my verdict: upamana, and it's genuinely doing its own work — not just "shabda from the guide plus perception of the animal." but i can't say what's left over once you subtract those two.
  8a. i infer fire from smoke in the kitchen; then my roommate texts "there's a fire." my verdict: the text adds no new pramana. it's reassurance, not a second source.
  8b. i infer fire from smoke; then i walk in and *see* the flames. my verdict: that's a new pramana and genuinely new knowledge, not just more confidence.
  — these two are the pair i can't reconcile. structurally they're the same: a second, independent route delivers a proposition i already had by inference. why does one feel like knowledge-twice and the other like nothing added?
  9. i'm not sure the grey haze is smoke; i run the tarka ("if there were no fire there'd be no smoke"), and *then* i'm willing to infer. verdict: genuinely helpful, still not a pramana.
  10. remembering where i parked: knowledge, not a pramana. fine with this.
  11. i overhear half a sentence in a language i barely speak and fill in the rest from context, and come to know the speaker is angry: no idea. feels like a blend, and i don't know which pramana owns it.

  my own guess at the principle: a pramana is whatever *fixes the content* — the thing that answers "how do you know?", the thing that would have to go wrong for this cognition to be false. so the pixels in case 2 don't fix the content, the speaker does; and in 8a the content was already fixed, so the text fixes nothing.

  so: test that against 1–11, tell me which of my verdicts it can't save and which it gets for the wrong reasons, and then either repair it or replace it with something that does better. i care about the individuation question most — what makes something *one* pramana rather than a stack of others, and is the fourfold list meant to be the irreducible ones or just the four that matter? what's the test for "irreducible" that doesn't just stipulate the answer?

  then, since a rule that only fits my cases is worthless: what does the account you land on say about (i) a dog who knows his owner is home from the smell, (ii) coming to know from a photograph that it rained last night, (iii) the same proposition learned by testimony from two people who both got it from one person? and for 8a/8b specifically, what's the smallest change to the case that flips my verdict — i want to know which feature is actually doing the work.

  if the honest answer is that nyaya authors disagreed about some of this, just tell me which of my verdicts each option forces me to drop; names and dates are the one thing i don't need.
reasoning: |-
  Okay, let me try to figure out what's going on with this user's query. They're taking an Indian epistemology course focusing on Nyaya and pramanas. They've shared their gut reactions to different scenarios and want help articulating the underlying rule they're using. Their main issue is distinguishing between different pramanas and identifying what makes one cognition a valid source of new knowledge versus not.

  First, I need to understand their examples. They listed 11 cases with their verdicts. For instance, inference from smoke to fire is straightforward anumana. A text message about a train cancellation is shabda. Seeing a face and recognizing an old roommate is pratyaksha, but they feel uneasy because memory plays a role. The printed sign "BRIDGE OUT" is shabda, not perception. Noticing keys aren't on the counter is tricky—they don't want to call it inference or perception of absence. The thermometer reading is pratyaksha unless calibration is questionable, then it shifts to shabda or no pramana. The tapir example is upamana. Two fire cases (8a and 8b) show a conflict: testimony after inference adds nothing, but perception does. Tarka helps but isn't a pramana. Remembering parking isn't a pramana. Filling in language context is unclear.

  The user's proposed principle is that a pramana "fixes the content"—it's what answers "how do you know?" and would need to fail for the cognition to be false. They want this tested against their cases, and to know if the four pramanas are irreducible or just important. They also ask about additional scenarios: a dog knowing by smell, knowing from a photograph, and testimony from multiple sources.

  I recall that in Nyaya, pramanas are sources of new knowledge. Memory isn't one because it reproduces past cognitions. Tarka is supportive but not independent. The four pramanas are perception, inference, comparison, testimony. Each must generate a true cognition not derived from another pramana. The key is novelty and directness.

  Looking at their cases through the novelty criterion: In 3 (recognizing the roommate), the novelty is in the current perception identifying the person, so it's pratyaksha. Memory is a condition but not the source. In 5 (keys absent), absence is perceived directly in Nyaya, so pratyaksha. For the thermometer (6), if the reading is directly perceived, it's pratyaksha. If calibration depends on testimony, then it's shabda. The sliding indicates that the source changes based on what's novel—if the trust in calibration is key, that's testimony.

  The tapir case (7) is upamana because the similarity links the new perception to the word learned via testimony. It's irreducible because the similarity relation does the work. For 8a and 8b, the difference is that testimony adds no new content if you already inferred the fire, but seeing it provides direct perceptual content, which is novel. The smallest change in 8a would be if the testimony gave new info, like the fire's location.

  For the additional cases: A dog using smell is pratyaksha. A photograph indicating rain is pratyaksha if directly interpreted, but if inference is needed (e.g., puddles mean rain), then anumana. Testimony from multiple sources still relies on the original shabda, so no new pramana for the same content.

  The user's "fixes the content" idea aligns with novelty. They might need to clarify that it's about the source directly providing the cognition without prior validation. Some cases like 11 (filling in language) might involve inference from context. Their unease in case 3 is because memory is crucial, but Nyaya still classifies it as perception since the current experience is what's new. The fourfold list is irreducible because each has a unique mechanism: direct sensory contact, invariable relation, similarity, reliable testimony. Testing irreducibility: if a case can't be resolved into simpler pramanas, it's its own type.

  I should explain why their verdicts mostly hold under novelty, except maybe case 6 where the sliding is justified. For 11, it's likely inference. The key is whether the cognition's truth is directly tied to the pramana without intermediaries. This addresses their individuation question—each pramana has a distinct way of fixing content.
answer: |-
  I love this puzzle—you're wrestling with exactly the core tension in Nyāya pramāṇa theory: **novelty** (*anadhigata*) vs. **causal source** vs. **content-fixing**. Your "fixes the content" intuition is sharp, but needs tightening. Nyāya's irreducible four are defined by *unique causal mechanisms* generating *new* knowledge. Memory/tarka are excluded because they recycle prior cognitions or support without directly generating truth.

  Here's your principle refined, tested against your cases, and extended:

  **The Revised Principle:**  
  A cognition is generated by a pramāṇa iff:  
  (1) It is **novel** (*anadhigata*: not already known *in this specific causal context*),  
  (2) It is **true** (*yathārtha*),  
  (3) Its content is **directly fixed** by a unique causal mechanism irreducible to other pramāṇas.

  **Key Clarifications:**  
  - "Fixes the content": The mechanism that *determines the intentional object* of the cognition (e.g., testimony fixes content via words; perception via sensory contact).  
  - "Irreducible": The mechanism can't be fully analyzed as a subtype of another pramāṇa (e.g., upamāna isn't just perception + testimony; it requires *similarity-based recognition*).  
  - "Novelty": Not about logical newness, but *psycho-causal genesis*. If you already know P via source X, source Y might still count if it provides *experiential access* to P (e.g., seeing fire after inferring it).

  ---

  ### **Your Cases Revisited (✓ = your verdict saved; ✗ = needs adjustment):**
  1. **✓ Anumāna:** Content fixed by invariable concomitance (smoke-fire). Novel if you didn’t already know *this fire*.  
  2. **✓ Śabda:** Content fixed by decoding trustworthy speech. Pixels are *instrumental cause* (not pramāṇa).  
  3. **✓ Pratyakṣa (reluctantly):** Content fixed by *current* sensory contact. Memory is a necessary condition but doesn’t *generate* the cognition—the visual qualia do. (Classic Nyāya: recognition *is* perception).  
  4. **✓ Śabda:** Printed words are linguistic testimony. No speaker needed—Nyāya accepts written śabda.  
  5. **✓ Pratyakṣa (non-dodgy!):** Absence (*abhāva*) is directly perceived in Nyāya. Keys' absence is sensorily present (you "see" they're not there).  
  6. **Half-✓:** Your sliding is **correct**.  
     - If thermometer is reliable: *Pratyakṣa* (content fixed by sensory input).  
     - If calibrated by unreliable agent: *Śabda* (content fixed by *his testimony* about calibration).  
     - If you discover unreliability: *No pramāṇa* (cognition is false/unreliable).  
  7. **✓ Upamāna:** Content fixed by similarity ("this looks like the pig-snout thing I heard about"). Irreducible because:  
     - It’s not *just* śabda (the word "tapir" alone doesn’t help until you see similarity).  
     - Not perception alone (you see an animal but don’t know *what* without the similarity link).  
  8a. **✓ No new pramāṇa:** Content already fixed by anumāna. Text adds no *novel cognitive genesis*.  
  8b. **✓ New pratyakṣa:** Content fixed by *direct sensory access*. Novelty here is *experiential*—not propositional, but *how* you know it (seeing vs. inferring).  
  9. **✓ Not a pramāṇa:** Tarka removes doubt but doesn’t *generate* new content—it depends on prior knowledge of pervasion.  
  10. **✓ Not a pramāṇa:** Memory reproduces past cognition; no new content.  
  11. **Inference (anumāna):** You infer anger from contextual cues (tone, words) using known linguistic concomitances. Not a "blend"—śabda gives partial content, inference fills gaps.

  ---

  ### **Individuation & Irreducibility**  
  - **Why 4?** Each has a unique *content-fixing mechanism*:  
    - *Pratyakṣa*: Sensory contact → direct qualia.  
    - *Anumāṇa*: Invariable relation → inferential mark.  
    - *Upamāna*: Similarity → recognition of likeness.  
    - *Śabda*: Reliable utterance → decoding meaning.  
  - **Test for irreducibility:** Can the cognition arise *without* another pramāṇa?  
    - E.g., upamāna requires prior śabda (hearing the word) but adds *similarity-based identification*—a new cognitive act.  
  - **Not stipulative:** Nyāya argues we *need* all four empirically (e.g., you can’t reduce upamāna to inference—similarity isn’t a pervasion).

  ---

  ### **New Cases:**
  **(i) Dog knows owner is home from smell**  
  - *Pratyakṣa:* Content fixed by olfactory contact. Novel if the dog wasn’t previously sure. (Nyāya grants animals perception).  

  **(ii) Knowing from a photograph it rained last night**  
  - *Anumāna:* Content fixed by inference (wet ground → rain) or *śabda* if the photo is captioned.  
  - *Not pratyakṣa:* You see *current* wetness, not past rain (unless the photo is seen as *testimony*).  

  **(iii) Same proposition from two testimonies (one original source)**  
  - *No new pramāṇa:* The second testimony doesn’t fix content anew—it’s causally dependent on the first. Novelty was exhausted by the first śabda.  

  ---

  ### **Flipping 8a/8b: What’s Doing the Work?**  
  - **Feature:** *Experiential access* vs. *propositional reinforcement*.  
  - **Flip 8a:** If the text adds new info (e.g., "the fire is in the kitchen" when you only inferred "fire exists"), it becomes *new śabda*.  
  - **Flip 8b:** If you "see" fire but it’s actually a hologram, it’s *not pratyakṣa* (no real sensory contact).  

  ---

  ### **Nyāya Disagreements & Your Verdicts**  
  - **Absence (case 5):** Some (e.g., Bhāṭṭa Mīmāṃsā) reject "perception of absence"—forcing you to call it inference (✗ your verdict).  
  - **Upamāna (case 7):** Buddhists reduce it to inference; Naiyāyikas insist it’s irreducible (✓ your verdict).  
  - **Testimony sliding (case 6):** Some schools (e.g., Advaita) treat instruments as perception; strict Nyāya says śabda if meaning-dependent (✓ your sliding).  

  **Final Rule:** *A pramāṇa is the **unique causal mechanism** that **directly generates** a **novel true cognition** by **fixing its intentional content**.* Your instincts were solid—trust the grudge in case 3 and the slide in case 6. The fourfold list holds because no other mechanism meets all three criteria.
