  ### Order (Numbered Steps, ~250 words)
  1. **Quick Demo (5 min)**: Start by demonstrating the rules neutrally. Show AX → AXA (Rule 1), AX → AXX (Rule 2), and if time allows, derive AXX → AXXA (Rule 1) → AXXAXX (Rule 2). *Why*: Builds intuitive rule familiarity without pressure, preventing early discouragement. Depends on nothing—sets the stage.

  2. **Group Flail (10 min)**: Split into small groups to brute-force derive AAA. Circulate, nudging with "What if you double here?" or "Can Rule 3 help?" *Why*: Essential for experiencing frustration (e.g., getting stuck at AAX). This struggle reveals the limits of in-system effort, priming them for JOOTSing. Cuts here lose the "why" behind the meta-lesson.

  3. **Pause and Pivot (5 min)**: Regroup and ask: "Why is AAA elusive? What patterns did you see?" Then introduce: "Some puzzles need us to step outside and ask, 'What *never* changes in all reachable strings?'" *Why*: Depends on flail to make the need palpable. Transition to invariants without giving it away.

  4. **Discover the Invariant (10 min)**: Guide them to find the invariant. Ask: "Count X’s in AX (1). What about AAA? (0). Now check rules: Rule 1 adds A (X unchanged). Rule 2 doubles suffix (X’s ×2). Rule 3 replaces XXX with A (X’s −3). What mod 3 value persists?" Reveal: X-count is always ≡ 1 or 2 mod 3 (never 0). *Why*: Depends on pivot; concrete exploration cements the concept.

  5. **Conclusion and Meta (5 min)**: Confirm AAA is impossible (0 ≡ 0 mod 3, unreachable). Emphasize: "Working harder in the rules failed. Stepping out to find an invariant solved it." *Why*: Depends on invariant discovery; wraps JOOTSing’s value.

  ### The Carrying Example (~100 words)
  Use a **balance scale with 3g and 5g weights**. Goal: achieve perfect balance (0g difference). Start with 3g on one side (difference = 3g). Rules: Add/remove weights, but scale must balance after each step. Invariant: Difference always ≡ 1 mod 2 (odd). Since 0 is even, it’s impossible. *Why it carries*: Mirrors the puzzle—effort within rules can’t overcome the invariant. Avoids letters/math; concrete. No need for weights beyond 3g/5g—keeps it simple.

  ### Misconception Map (~200 words)
  1. **"You just haven’t searched hard enough—a computer could brute-force it!"**  
     *When/Where to Defuse*: During **Group Flail** (as frustration peaks) and **Conclusion**. Ask: "How many strings could we generate in 5 steps? (Exponential!). Computers use invariants to avoid infinite search." Kill with scale analogy: "Adding weights won’t fix an odd imbalance."

  2. **"The letters must stand for something secret!"**  
     *When/Where to Defuse*: Early in **Demo/Flail**. Stress in Demo: "Rules are syntactic—renaming A/X to ♠/♣ changes nothing." Redirect with: "Focus on rule patterns, not meaning."

  3. **"So the rules are broken/unfair!"**  
     *When/Where to Defuse*: After **Conclusion**. Counter in **Meta**: "The invariant isn’t a flaw—it reveals AAA’s isolation. Real systems (e.g., voting) have similar ‘unbreakable’ barriers."

  4. **"But I got AAX—it’s one character away! Maybe tweak a rule?"**  
     *When/Where to Defuse*: End of **Flail/Pivot**. Show in **Invariant**: "AAX has 1 X (≡1 mod 3), AAA has 0. Rules can’t bridge the mod 3 gap, no matter how close it looks."

  5. **"Can’t we ignore/change the start string?"**  
     *When/Where to Defuse*: During **Flail** or **Conclusion**. Shut down firmly in **Conclusion**: "The start is fixed. Changing it invalidates the system—like changing the initial weight on the scale."

  ### The Check (~100 words)
  **Ending Question**: "Suppose Rule 3 changes to: Replace *any two* X’s with A. Can we reach AAA now?"  
  - **Right Answer**: "Yes! Invariant breaks: Original X-count mod 3 is preserved, but now Rule 3 removes two X’s (ΔX = −2 ≡ 1 mod 3). Start AX (1 X) → Apply Rule 1: AXA → Apply new Rule 3 to the X: AAA? But 'any two X’s'—if only one X, can’t apply. Need to create more X’s first. E.g., AX → Rule 2: AXX → Apply new Rule 3: Replace two X’s with A → AAA. Proof collapses because X-count can hit 0 mod 3."  
  - **Wrong Answer**: "Still impossible—adding more rules complicates it." (Ignores invariant shift.)  
  *Why*: Tests if they grasp invariant dependence on rules, not just answer memorization.

  ### What I Leave Out (~60 words)
  Refuse to explain **why modulo 3 specifically** (e.g., group theory) or **generalize to other moduli**. Say aloud: "We’re skipping the deep math—it’s not about the number 3, but that *some* invariant exists. JOOTSing is the tool, not the algebra." Also avoid **enumeration of all states**—call it "computationally ugly" if asked.

  ### Tell My Co-Host (~60 words)
  Cutting the flail costs the core lesson: Struggle makes JOOTSing *necessary*, not just clever. Skipping to "look for what stays the same" feels like a deus ex machina—they won’t internalize *why* stepping out matters. Ten minutes of flail earns its keep by creating "Ah, *that’s* why!" Buy-in. Protect that time.
