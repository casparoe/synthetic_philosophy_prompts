answer: |-
  ## Global Recognition & Leveling Policy (GRP-7)
  **Issued By:** Aequitas Solutions, Global HR Advisory
  **Effective Date:** 01 October 2023
  **Supersedes:** All prior Recognition & Performance Management Frameworks (Nordic Region GRP-6b; Americas RPF-12.1)
  **Epigraph:** *"True equity lies not in the equal distribution of accolades, but in the shared understanding of their necessary absence." – Morten Thorsen, Founding Partner, Aequitas Solutions (1978)*

  **1.0 Purpose & Scope**
  1.1 This policy establishes the mandatory global framework (GRP-7) for recognizing employee achievement and managing perceived status differentials within the newly integrated organization, harmonizing legacy practices from the Americas Division (AD) and Nordic Subsidiary (NS).
  1.2 GRP-7 governs all forms of formal recognition (awards, bonuses, public announcements, promotions based on merit), informal praise (verbal commendations, written feedback), and the internal cognitive states ("doxastic commitments") associated with personal success or failure.
  1.3 The policy aims to reconcile the AD principle of "Recognition as Desert" (RAD) with the NS principle of "Leveling Through Shared Modesty" (LTSM), ensuring cultural compliance and mitigating positional competition friction.

  **2.0 Definitions**
  2.1 **Achievement:** A measurable positive outcome exceeding baseline expectations within an employee's designated role.
  2.2 **Desert:** The state of being intrinsically *owed* recognition due to the nature of the agent's contribution.
  2.3 **Effort-Produced:** An outcome demonstrably and exclusively caused by the agent's conscious exertion within the immediate task parameters. (Contrast: Luck-Produced).
  2.4 **Luck-Produced:** An outcome significantly influenced by factors outside the agent's control and immediate exertion, including but not limited to: innate aptitude, socio-economic background, quality of prior education, fortuitous team assignment, favorable market timing, advantageous project allocation, or inherent systemic bias in opportunity structures.
  2.5 **Counterfactual Poppy Test (CPT):** A formal assessment determining if a randomly selected colleague, possessing median skill levels and equivalent baseline resources, would have achieved the same outcome in the agent's specific circumstances.
  2.6 **Inverse Recognition:** The mandatory reassignment of credit for a success from the achieving agent to the colleague(s) currently assessed as having experienced the most significant recent failure(s) deemed Luck-Produced, proportional to the assessed Luck-component of the success.
  2.7 **Doxastic Commitment:** An employee's internal belief regarding their own capabilities, contributions, or relative standing.
  2.8 **Doxastic Regress:** The inherent requirement for auditing beliefs about compliance, generating subsidiary rules governing those meta-beliefs.

  **3.0 Desert Verification Protocol (DVP)**
  3.1 Prior to any formal or informal recognition for an Achievement, the initiating manager *must* file Form GRP-7-DVP-01 ("Desert Verification Application") with the Global Equity Oversight Panel (GEOP).
  3.2 The DVP requires a detailed causal analysis proving the Achievement was >95% Effort-Produced (See Def. 2.3 & 2.4).
  3.3 Factors constituting Luck-Produced influences (Def. 2.4) must be exhaustively catalogued. Native language fluency (if advantageous), prior relevant training received before employment, and assignment to high-performing teams are explicitly categorized as Luck-Produced.
  3.4 GEOP will utilize the CPT (Def. 2.5) as a primary tool for DVP assessment. If the CPT indicates a >5% probability that a median colleague would have achieved the same outcome, the DVP fails.
  3.5 If the DVP fails (even partially), recognition is strictly prohibited. The Achievement is reclassified as a System-Optimized Outcome (SOO), triggering Section 5.0 procedures.

  **4.0 Leveling Through Shared Modesty (LTSM) Compliance**
  4.1 Public celebration of individual Achievement is prohibited. Recognition, if permitted via DVP, must be delivered privately, focusing solely on the specific task-completion, devoid of character traits (e.g., "skillful," "talented," "intelligent").
  4.2 Employees are prohibited from expressing pride, superiority, or unique capability stemming from any Achievement, including those validated by DVP.
  4.3 Crucially, LTSM governs Doxastic Commitments (Def. 2.7). Employees *must* hold the internal belief that their Achievements are neither exceptional nor indicative of superior inherent worth or capability relative to colleagues.
  4.4 **Doxastic Regress Rules:**
      4.4.1 Employees must believe they are not inherently better than colleagues at complying with GRP-7 (including LTSM).
      4.4.2 Employees must not believe they possess unique insight into their own level of compliance with 4.4.1.
      4.4.3 Employees must actively doubt the authenticity of their belief that they are doubting sufficiently per 4.4.2. (This constitutes baseline compliance; deeper regress levels are audited algorithmically by GEOP's Doxastic Inference Engine).
  4.5 Annually, employees must complete the GRP-7-LTSM-SA ("Self-Assessment"), affirming their adherence to the required Doxastic Commitments outlined in 4.3 and 4.4. Discrepancies flagged by GEOP's correlation with performance data trigger Mandatory Cognitive Realignment (MCR) workshops.

  **5.0 Inverse Recognition Procedure (IRP)**
  5.1 When an Achievement is classified as an SOO (per 3.5), or when any failure occurs, the IRP is mandatory.
  5.2 GEOP calculates the assessed Luck-component percentage (L%) for the SOO or Failure using the DVP/CPT framework retroactively.
  5.3 For an SOO: Credit proportional to the L% is formally reallocated by GEOP to the employee(s) with the lowest recent performance scores *also* classified as >95% Luck-Produced Failures. This credit is recorded in the "Redistributed Merit Ledger" (RML) and counts towards their performance evaluation.
  5.4 For a Failure: Blame proportional to the (100% - L%) component (i.e., the agent's non-Luck contribution) is formally assigned. However, the L% component is acknowledged as systemic, and no punitive action is taken solely based on Luck-Produced Failure.
  5.5 The IRP ensures that systemic advantages/disadvantages are continuously rebalanced, recognizing that Luck is the primary determinant of differential outcomes.

  **6.0 Enforcement & Monitoring**
  6.1 GEOP is responsible for DVP adjudication, CPT administration, L% calculation, IRP execution, and Doxastic Compliance monitoring via SA analysis and ambient sentiment parsing tools (Aequitas InnerSight™).
  6.2 Managers failing to initiate DVP for potential recognition, or delivering non-compliant praise, are subject to MCR and performance penalties.
  6.3 Employees found in violation of LTSM Doxastic Commitments (per GEOP analysis) undergo progressive MCR interventions.

  **7.0 Appendix A: Worked Example – Sales Achievement (Anika Vinter, NS Region)**

  *   **Achievement:** Anika secured the NordVent contract, exceeding her annual target by 220%.
  *   **DVP Initiated:** Regional Director files GRP-7-DVP-01.
  *   **DVP Analysis:**
      *   Effort-Produced: Anika's tailored pitch, late nights adapting materials (35% assessed).
      *   Luck-Produced: Native Swedish speaker (client preference), prior industry contacts from family background, assigned to the high-potential NordVent lead when previous holder resigned (timing), strong regional economy (65% assessed).
  *   **CPT Applied:** GEOP simulates 1000 median colleagues. >82% probability a median colleague would have secured the contract given the Luck factors (right lead, timing, language, economy).
  *   **DVP Outcome:** **FAILED** (Luck >5%). Achievement reclassified as SOO. Recognition prohibited.
  *   **IRP Triggered (SOO):**
      *   L% = 65%.
      *   GEOP identifies Lars Pedersen (AD) with lowest performance score: Failed to secure TechGlo renewal (assessed as 90% Luck-Produced due to sudden market crash).
      *   65% credit for NordVent success reallocated to Lars's RML, boosting his performance evaluation.
  *   **LTSM Compliance:** Anika receives private email: "The NordVent contract closure has been processed as a System-Optimized Outcome. Continue standard task execution." She must internally attribute success primarily to circumstance and believe any personal satisfaction is unwarranted pride (violating 4.3). Her SA responses are flagged for potential non-compliance, requiring MCR Level 1.
  *   **Final State:** Anika's exceptional result yields no personal recognition, generates credit for an underperforming colleague elsewhere, and mandates cognitive adjustment for experiencing pride. Lars receives unearned credit, which he must also not believe reflects personal merit. The NordVent success is recorded anonymously as a systemic optimization in the quarterly report. Achievement is simultaneously acknowledged and dissolved.

  **8.0 Conclusion**
  GRP-7 provides a robust, equitable, and culturally harmonized framework for managing the inherently problematic nature of differential outcomes. By dissolving the illusion of desert and systematically redistributing the credit/blame residue according to its true source (Luck), while rigorously governing internal states, Aequitas Solutions ensures a truly level playing field and minimizes the corrosive effects of status competition. Compliance is mandatory for organizational harmony.

  ---
  **Where this takes liberties**

  This satire exaggerates the *universalizability* of desert claims (American norm) and the *strict determinism* implied by strong readings of leveling norms (Jante/tall poppy). It leans heavily on a contested reading of leveling norms as primarily *metaphysical* claims about agency and desert ("you *are* not better"), rather than pragmatic *social* tools for dampening destructive positional competition ("don't *act* like you're better, it disrupts cohesion"). The reductio bites hardest on the metaphysical claim.

  The satire becomes unfair if leveling norms are interpreted *only* as social pressure against boastfulness and status anxiety, not as a denial of agency or differential effort. In that pragmatic view, the norm's purpose is achieved without needing to dissolve achievement itself – merely its disruptive social expression. The piece's reasoning breaks at the Doxastic Regress, where auditing inner beliefs is logically possible only as crude behavioral proxies (the SA form), not true belief states. Humans cannot *mandate* doubt about their doubt on command; the policy demands an impossible cognitive performance, revealing its own absurdity when pushed to regulate the unregulatable inner world. The machinery collapses under its own meta-weight.
