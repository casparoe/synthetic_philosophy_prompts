  | 2 | Owen | Degeneracy is constrained by environment and optimality; break ties with max entropy or noisy rationality. | mostly_right | With fixed environment and near-optimality, the set of possible rewards is constrained; max entropy is a standard tie-breaker. | Assumes near-optimality which may not hold; max entropy is a prior, not data-driven. |
