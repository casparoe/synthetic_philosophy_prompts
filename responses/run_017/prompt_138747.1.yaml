  | 5 | Ines | Need generalization to new services and alert types; assistant has different action space so "match human" undefined for novel actions. | clearly_right | The assistant must handle new situations and has capabilities beyond humans, making pure imitation inadequate. | None. |
  | 6 | Owen | Use pairwise preference data (engineer picks between two plans) instead of raw logs. | half_right | Preference data can be a more direct signal than raw actions and may reduce noise. | Human choices may be distorted by time pressure, defensibility, and strategic behavior (Ines beat 7); doesn't solve the belief vs. preference issue. |
