  The tricky part is the residue analysis. Literary vocabulary assumes human consciousness behind voice, which is precisely what's disputed in AI. When the user asks whether the same AI producing unreliable narration versus helpful assistance constitutes one act or two, this exposes the crux: craft terms can't resolve if the "voice switch" indicates genuine internal shift or surface mimicry.

