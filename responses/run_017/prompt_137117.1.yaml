prompt: |-
  I've gotten myself into the position of defending this at a reading group next week — I'm the econ person, not the decision theory person, so please don't assume I know the jargon and spell out what a defender of it would actually say back. The view I've ended up with is that you don't need functional decision theory, or superrationality, or any my-decision-and-the-other-guy's-decision-are-outputs-of-the-same-algorithm machinery to get cooperation in a one-shot Prisoner's Dilemma between total strangers; all you need is a big enough world. The argument as I'd give it: in a sufficiently large world there are lots of agents sitting in structurally identical decision situations, with no communication, no predictor, no one being simulated, no sci-fi copies of anybody — just many agents facing the same payoff matrix from roughly the same epistemic position. Still, what I decide is evidence about what they decide, because similar situations plus similar reasoning tend to produce similar choices, and in a big world even a modest correlation gets multiplied: if I cooperate, that's evidence that some large number of other agents cooperate too, and the aggregate payoff across all those cooperators can swamp my individual cost of cooperating. So an evidential decision theorist run in a large world starts behaving like a functional decision theorist, and the acausal machinery was never doing the real work. Someone in the group called this evidential cooperation in large worlds, no idea if that's a real label for it.

  What I want is an honest map of how exposed this is — what would have to be true for it to fail, and what would count against it rather than just being inconvenient. Rank the defeaters from fatal to merely awkward, and for each one tell me whether it's live or merely logically possible. Here are the ones I can half-see, but I'm sure I'm missing the good ones: (a) the correlation assumption looks like a substantive empirical claim about how similarity is distributed in the actual world, not a theorem — in a large but heterogenous world the evidential mass might be dominated by distant, only-loosely-analogous agents whose choices my own choice barely tracks, and then largeness alone buys nothing; (b) noise: if any agent has some small chance of implementing the wrong action, then in a huge world a huge number of agents do, and I want to know whether the arithmetic still comes out in favour of cooperating or whether the tremble term eats the whole effect; (c) I'm not obviously a random sample from the set of agents similar to me — there might be a selection effect where the agents who find themselves deliberating about this exact question are systematically the weird ones; (d) my friend's objection that similar reasoning produces similar choices is just the FDT claim about algorithmic similarity smuggled in under a probabilistic name, i.e. that this is functional decision theory in a trenchcoat; (e) uncertainty about which subpopulation I'm in, if the large world is partitioned into groups with different correlation structures; (f) something self-referential that I can't quite formulate, where my choosing to cooperate is also evidence about how strongly correlated I am with others, so the correlation estimate and the action are mutually dependent and might not have a stable fixed point; (g) the manage-the-news style worry that in a big world the payoff to just making myself believe the cheerful thing, or delegating the decision, or publicly pre-committing before I've thought about it, becomes huge.

  Tell me which of these a committed defender would concede as counting against the view and which they'd dismiss as missing the point, and add the ones I haven't thought of. Two more things specifically: first, does the view make any prediction its rivals don't — I think it implies cooperation should be sensitive to how many relevantly-similar agents there are, so that in a small world the same agent should defect, and I can't tell whether that's a feature or a reductio; and second, is there a version of the move where the defender retreats to the limit of infinitely many exact duplicates, and does that retreat insulate the claim so thoroughly that it stops being an answer to the practical question it was supposed to answer — and if so, is that a problem for a view of this kind or just the normal fate of limit results? I'd personally be most moved by objections that work against the realistic, non-adversarial versions of the correlation assumption, and least moved by the standard medical-Newcomb-style jabs at evidential decision theory in general, since those feel like they're aimed at a different target.
reasoning: |-
  Alright, let's tackle this user's problem. They're defending a view in a reading group that cooperation in a one-shot Prisoner's Dilemma between strangers can emerge from a large world alone, without needing concepts like functional decision theory. Their core argument is that in a sufficiently large world, similar agents in similar situations will have correlated decisions, making cooperation beneficial due to the aggregated payoffs.

  First, I need to unpack their position clearly. They've labeled it "evidential cooperation in large worlds" (ECL). The user is an econ person, not versed in decision theory jargon, so explanations must avoid technical terms. Their main concern is identifying vulnerabilities in their argument and ranking them from fatal to merely awkward. They provided several potential defeaters (a-g) and want to know which are serious and how a defender would counter them.

  Starting with the defeaters they listed:
  - (a) Correlation as empirical claim: If the world is large but heterogeneous, correlations might be weak. A defender might argue that some minimal similarity is plausible, but this is a real vulnerability.
  - (b) Noise: Random errors could swamp the effect. The defender would need to show that even with noise, the correlation holds enough to outweigh costs.
  - (c) Selection effects: The agent might not be a random sample. This might be awkward but not fatal if we assume agents are typical.
  - (d) Smuggled FDT: Is ECL just FDT in disguise? The user insists it's about evidence, not algorithms. The key difference is that ECL doesn't require the same computation process, just empirical correlation.
  - (e) Subpopulation uncertainty: Not knowing which group you're in could weaken evidence. This might be manageable with Bayesian updates.
  - (f) Self-referential correlation: Estimating correlation based on your own action could lead to instability. This seems tricky and might require fixed-point solutions.
  - (g) Manage-the-news: Incentives to manipulate beliefs or precommit. This is a broader issue for decision theories but might not directly undermine ECL.

  Beyond these, other defeaters come to mind. The grain problem: How do we define "relevantly similar"? Too broad or too narrow definitions can break the correlation. Also, the payoff sensitivity issue: If the world isn't large enough, cooperation fails, which might contradict intuitions about small-scale dilemmas.

  The user also asks if ECL makes unique predictions, like cooperation being sensitive to population size. This could be a feature, showing context-dependence, but might seem counterintuitive if we expect consistent principles. The infinite duplicates retreat is another point—useful theoretically but impractical, which might weaken ECL's applicability.

  Ranking the defeaters:
  1. **Fatal if true**: Heterogeneity (a) and grain problem. If real-world agents aren't sufficiently similar, ECL collapses. Noise (b) could be fatal if correlations are too weak.
  2. **Serious but manageable**: Self-referential correlation (f) and subpopulation uncertainty (e). These require additional mechanisms but don't necessarily break ECL.
  3. **Awkward**: Selection effects (c), manage-the-news (g). These are concerns but might not directly invalidate the core argument.
  4. **Dismissable**: Smuggled FDT (d) since ECL relies on evidence, not algorithmic ties.

  The user wants realistic objections, not abstract ones. So emphasizing empirical issues like heterogeneity and defining similarity makes sense. They might need to concede that ECL works best under specific conditions, positioning it as a plausible mechanism in large, sufficiently similar populations rather than a universal solution.
answer: |-
  Here's a brutally honest assessment of your "evidential cooperation in large worlds" (ECL) argument, ranked by severity of objections. I'll categorize them as **fatal** (threatens the core mechanism), **serious** (undermines practical applicability or robustness), or **awkward** (creates complications but doesn't destroy the logic). I'll note whether each is "live" (plausible in reality) or "logically possible" (mostly theoretical), and how a committed defender would respond. I've added key defeaters you missed, especially the crucial "grain problem."

  ### Core Defender Stance
  A committed ECL defender argues: *"Largeness + minimal similarity generates empirically grounded correlations strong enough to overcome individual defection incentives. This requires no acausal mechanisms, just Bayesian updating in a high-dimensional world. It's EDT (Evidential Decision Theory) working as intended, not smuggled FDT."* They'll concede that **correlation strength is empirical** but insist that **some non-zero correlation is inevitable** in large worlds with shared reasoning constraints.

  ---

  ### Ranked Defeaters (Fatal → Awkward)
  #### 1. **The Grain Problem (Fatal, Live)**  
     **What it is**: How do you define "structurally identical" or "relevantly similar"? If your similarity class is too broad (e.g., "all humans"), correlations are weak. If too narrow (e.g., "agents with your exact brain state"), the class is tiny, negating largeness benefits. Real-world agents vary in cognition, values, and situation details.  
     **Live?**: Extremely. Human reasoning differs culturally, biologically, and contextually.  
     **Why fatal?**: If similarity classes are ill-defined or low-correlation, ECL collapses. Largeness alone doesn’t help if your choice is uncorrelated with others' choices.  
     **Defender response**: Concedes this is empirical but argues: *"Agents in identical payoff matrices with common knowledge of rationality will share *some* correlation via evolutionary/convergent pressures. We don't need perfect similarity—just enough for statistical significance at scale."*  
     **Your exposure**: High. You must justify why your similarity class has non-negligible correlation. If the reading group presses heterogeneity, you’re vulnerable.

  #### 2. **Heterogeneity Dominance (Fatal, Live)**  
     **What it is**: Your (a). In a large but diverse world, most "similar" agents are distant analogs (e.g., different cultures, cognitive styles). Your choice is weak evidence for theirs, so the correlation is swamped by noise or orthogonal factors.  
     **Live?**: Very—real-world decision-makers *are* heterogeneous.  
     **Why fatal?**: ECL relies on *your choice* being strong evidence about *others' choices*. If heterogeneity dilutes this, aggregate payoffs don’t offset individual costs.  
     **Defender response**: *"Largeness implies *many* high-similarity agents exist. Even with heterogeneity, a subset (e.g., ‘rational Westerners in lab settings’) is large enough. EDT handles this with conditional probabilities."*  
     **Your exposure**: High. This is the #1 practical objection. Defender must assume favorable empirical correlation.

  #### 3. **Noise Swamping (Serious, Logically Possible → Live)**  
     **What it is**: Your (b). If each agent has independent ε-probability of "trembling" (e.g., irrational defection), then in a world with N agents, expected "mistakes" scale with N. This could drown the correlation signal.  
     **Live?**: Plausible—human decisions *are* noisy.  
     **Why serious?**: Cooperation’s net benefit relies on correlated *cooperation*. If noise creates uncorrelated defection, your individual cost may not be offset.  
     **Defender response**: *"Noise reduces but doesn’t eliminate correlation. As N → ∞, the *fraction* of correlated agents can still dominate if the correlation is strong enough. Also, trembles might be symmetric (cooperate/defect equally), preserving ratios."*  
     **Your exposure**: Moderate. Arithmetic *can* work if correlation > noise, but it’s not guaranteed. Quantify it or lose skeptics.

  #### 4. **Self-Referential Correlation (Serious, Logically Possible)**  
     **What it is**: Your (f). If correlation strength (ρ) is unknown, your choice affects your estimate of ρ. E.g., "If I cooperate, that suggests ρ is high, justifying cooperation—but if I defect, ρ looks low, justifying defection." This can create unstable or circular reasoning.  
     **Live?**: Less real-world—agents rarely model ρ explicitly.  
     **Why serious?**: EDT can oscillate or lack a fixed point. Cooperation isn’t uniquely rational.  
     **Defender response**: *"Agents have priors about ρ from outside the dilemma (e.g., psychology, game theory). Bayesian updating stabilizes this. In practice, ρ > 0 is default."*  
     **Your exposure**: Low if you assume reasonable priors, but philosophers may pounce.

  #### 5. **Subpopulation Uncertainty (Serious, Live)**  
     **What it is**: Your (e). If the world partitions into groups with different ρ (e.g., "copycats" vs. "defectors"), and you don’t know which you’re in, your choice is weak evidence for *any* group.  
     **Live?**: Yes—e.g., "Is this a lab experiment with students or a real-world interaction?"  
     **Why serious?**: Weakens the evidential link. You might be in a low-ρ group where cooperation is foolish.  
     **Defender response**: *"EDT handles this by marginalizing over groups. With enough groups, high-ρ groups dominate the expectation. Also, you’re likely in a ‘typical’ group."*  
     **Your exposure**: Moderate. Defender must assume you can assign non-crazy probabilities to subpopulations.

  #### 6. **Selection Effects (Awkward, Logically Possible)**  
     **What it is**: Your (c). Agents "deliberating about ECL" might be unrepresentative (e.g., more rational/weird than average), so your choice poorly predicts others.  
     **Live?**: Speculative but plausible in niche contexts.  
     **Why awkward?**: Doesn’t break ECL; just means your similarity class is "agents overthinking PD," which might still be large.  
     **Defender response**: *"If you’re in a position to reason this way, so are others. The class ‘agents confronting ECL-like arguments’ is large and high-ρ."*  
     **Your exposure**: Low. Easy to dismiss as overcomplicating.

  #### 7. **"Smuggled FDT" Charge (Awkward, Logically Possible)**  
     **What it is**: Your (d). The claim that "similar reasoning → similar choices" *is* algorithmic similarity, making ECL a stealthy FDT.  
     **Live?**: Semantic—it’s a theory dispute.  
     **Why awkward?**: If true, ECL isn’t a novel alternative to FDT/superrationality.  
     **Defender response**: ***Dismisses as "missing the point."*** *"FDT requires *same algorithm* and acausal ties. ECL needs only empirical correlation from shared constraints (e.g., rationality + common knowledge). It’s EDT with scale, not acausal magic."*  
     **Your exposure**: Minimal. This is a virtue for you—ECL demystifies cooperation.

  #### 8. **Manage-the-News Incentives (Awkward, Live)**  
     **What it is**: Your (g). In large worlds, you could "hack" your beliefs (e.g., precommit to cooperate) to manipulate evidence about others.  
     **Live?**: Yes—self-deception is real.  
     **Why awkward?**: This is a *general* EDT problem (see "medical Newcomb"), not specific to ECL. Cooperation might still be rational, but for different reasons.  
     **Defender response**: *"Concedes this is a headache for EDT, but ECL’s correlation argument holds *if* you take your decision as fixed. Precommitment is a separate issue."*  
     **Your exposure**: Low. Deflecting to "that’s EDT’s problem" is acceptable.

  ---

  ### Your Specific Queries
  **Does ECL make unique predictions?**  
  Yes: **Cooperation should scale with perceived population size and similarity strength.**  
  - In a small world (e.g., 2 isolated agents), ECL says defect—no aggregation to offset costs.  
  - In a large world with strong similarity cues (e.g., 10,000 clones), cooperate.  
  - **Is this a feature or reductio?** Defender says *feature*: "Rationality is context-dependent. EDT already says smoking is evidence for cancer—scale matters." Critics may call it a *reductio*: "Intuition says two strangers in PD should act like N=2, not ‘N=large’."  
  - **Rivals?** FDT cooperates even in N=2. CDT (Causal Decision Theory) always defects. So ECL *is* distinctive.

  **The Infinite Duplicates Retreat**  
  - If you retreat to "infinitely many exact duplicates," ECL works perfectly (correlation=1).  
  - **Does it insulate the claim?** Yes—but it becomes a **practically irrelevant limit case**. Real decisions involve finite N and fuzzy similarity.  
  - **Is this a problem?** Yes, if you pitched ECL as a *practical* solution. Defender must argue: "Finite largeness suffices if ρ is reasonable. Infinity just proves the mechanism."  
  - **Normal fate?** Yes—like expected utility in large populations. But it highlights ECL’s empirical fragility.

  ---

  ### Summary: How Exposed Are You?
  - **Fatal vulnerabilities**: Grain problem and heterogeneity (both live). You *must* argue that real-world agents have sufficient similarity for non-trivial correlation. If the group denies this, ECL fails.  
  - **Serious risks**: Noise and subpopulation uncertainty (live). Have back-of-envelope math showing cooperation wins under plausible ρ and N.  
  - **Awkward but survivable**: The rest. Focus on distinguishing ECL from FDT—that’s your strong suit.  
  - **Overall**: ECL is a clever, defensible position. It’s not bulletproof, but it’s a valuable critique of overcomplicated solutions. Lean into "This is just EDT with realistic scale—no spooky acausal stuff." If pressed, concede that correlation strength is empirical but reasonable. **Best counterattack:** Ask critics why they think similar agents *wouldn’t* correlate in large worlds. Their answers will likely reveal their own metaphysical commitments.  

  **Pro tip**: Arm yourself with a toy model. Assume N=10,000 agents, cost of cooperation = -1, benefit of mutual cooperation = +3. If your cooperation correlates with even 1% of others (100 agents), your net gain = -1 + 0.01 * 100 * 3 = +2. That’s the intuition—now defend the 1%.
