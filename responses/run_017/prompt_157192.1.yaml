  *scratches head* The nematode/bacteria reductio is clever - it exploits how N grows faster than p falls. But the user's instinct is right: the problem isn't step (2) about small probabilities. In fact, rejecting (2) would be disastrous for their position on insects. The real trouble is how "prevention" gets valued when we don't know if the prevented beings would have been subjects of experience.

  *lightbulb* Ah! The friend's framework assumes we can apply population ethics models (like avoiding negative-value lives) to entities whose moral status is precisely what's in doubt. But for questionable sentience cases, we should use a decision theory that distinguishes between acts affecting existing entities vs. preventing future entities. 

