  *ponders alternatives* If we reject step (1)'s expected value formulation instead, we'd need some deontological constraints - but that seems messy. Rejecting (5) is cleaner: we simply say that for uncertain sentience cases, preventing existence has zero expected value unless we know the lives would be negative. 

  *weighs confidence levels* I'm 95% sure about the diagnosis of step (5), but only 70% about the exact alternative formulation - the philosophy gets hairy when we consider possible but unlikely sentience. Should flag that uncertainty prominently. 

