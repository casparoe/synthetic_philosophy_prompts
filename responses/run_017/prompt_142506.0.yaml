  Here’s a critical reading of *Brokeback Mountain* through your philosophical lens, testing your distinctions against Proulx/Lee’s work and identifying what fiction uniquely reveals about marriage’s purpose:

  **Testing Your Distinctions Against the Text:**

  1.  **Durative vs. Declaratory Functions:**
      *   **Supported:** The film starkly contrasts the *durative* function (Alma & Ennis: shared home, child, economic unit; Lureen & Jack: business partnership, child, social status) with the *declaratory* function's near-total absence for Ennis and Jack. Their relationship survives through intense private commitment (durative in spirit) but lacks public scaffolding. Jack’s proposal (“a little cow and calf operation... just you and me”) is pure *durative aspiration* – economic partnership, shared domesticity – stripped entirely of *declaration*. Ennis’s refusal stems from terror of declaration (“this thing grabs hold of us again in the wrong place... we’re dead”), recognizing that visibility invites the violence embodied by Earl’s fate.
      *   **Embarrassed:** The film complicates a clean separation. The *durative* function of the heterosexual marriages *fails emotionally* precisely because the primary emotional bond (Ennis/Jack) lacks *declaration*. Alma and Lureen endure the *forms* of durative marriage while being emotionally abandoned. The durative structure survives, but its *substance* is hollowed out by the undeclared bond. This suggests declaration isn't merely additive; it can be essential for the durative function's *meaning* within the relationship.

  2.  **The Retrospective Function (Ratification):**
      *   **Supported:** This is the core of Ennis’s final ritual with the shirts. It’s not about organizing a future (Jack is dead) or even primarily public declaration (only Ennis sees it). It’s a private act of *ratification* – asserting the profound, enduring reality of their bond *as it was lived*, across time. He’s saying, “This *was*; this mattered; this *is* the shape of us.” Your dying man’s fear of “misdescription” resonates here. A deathbed wedding for Ennis would feel like a lie, rewriting forty years of furtive, intense, *illegible* love into a socially sanctioned script it never followed.
      *   **Collapse into Declaration?** The film argues it doesn’t fully collapse. Ennis’s ritual *is* a declaration, but crucially, *only to himself*. Its power is retrospective validation, not social communication. The *function* (ratifying the past) is distinct, even if the *act* shares elements of declaration. The film shows ratification can be intensely meaningful *without* public witnesses, existing purely in the realm of personal truth and historical reckoning.

  3.  **Legibility Debt:**
      *   **Supported:** The debt accrues catastrophically. Jack’s death exposes it all:
          *   **Hospital/Death:** Ennis has no right to information, presence, or decision-making. Lureen controls the narrative (“tire blew”).
          *   **Heirs:** Jack’s parents control his remains, erasing Ennis from his final resting place and legacy. The ashes scene is pure legibility debt collection.
          *   **Surviving Partner:** Ennis is powerless, grieving in isolation, relying on Lureen’s brittle tolerance for scraps of truth.
          *   **Friends/Community:** No one acknowledges Ennis’s loss as a *spousal* loss. His grief is illegitimate, invisible.
      *   **The Shirts & Payment:** You’re precisely right. The shirt ritual is a profound *private* payment of an *emotional* debt between Ennis and Jack (and Jack's memory). It asserts the bond's reality *for Ennis*. But it pays *nothing* on the *social/institutional* legibility debt owed to hospitals, courts, or even Jack’s parents. It highlights the tragic gap between personal meaning and social utility. It looks like closure but solves none of the practical problems silence created.

  **The Objection: "Neither Man Wanted Marriage"**

  *   **Where the Resistance is Real:** The film *is* primarily a tragedy about repressed desire, internalized homophobia, masculine violence, and the crushing weight of social expectation in a specific time/place. Ennis and Jack never articulate a desire for *marriage* per se. Their longing is for *time* and *space* (“if you can’t fix it, you gotta stand it”; “I wish I knew how to quit you”; Jack’s ranch fantasy). Framing them as plaintiffs for a denied right *does* risk misreading the text. Their tragedy stems from a world where even *imagining* public declaration feels lethal. Jack’s proposal is about escape and domesticity, not a wedding license.
  *   **Where the Film is NOT Off the Hook:** Despite their lack of articulated desire for marriage, the film *forcefully* demonstrates the *consequences* of lacking access to the *functions* marriage provides, especially *declaration* and its role in mitigating *legibility debt*. We see the devastating cost of illegibility *without* the characters needing to name the legal remedy. The film critiques the *absence* of a structure that could have protected them, regardless of whether they consciously wanted that specific structure. It shows *why* the revisionist view (marriage as recognition/stabilization of care/dependency) matters – not because they sued for it, but because its lack destroyed them.

  **What Fiction Adds: The Territory Arguments Can't Map**

  *Brokeback Mountain* shows what philosophical arguments struggle to capture: **the lived texture and emotional logic of relationships existing *outside* or *in defiance of* societal legibility, and the specific, often inarticulate, fidelity people have to the *truth* of that lived experience.**

  1.  **The Weight of the Unspoken:** Arguments define functions; fiction shows the *embodied cost*. Ennis’s hunched shoulders, his choked silence, the visceral fear in his eyes – these convey why declaration feels impossible in a way philosophical justifications cannot. His refusal of Jack’s proposal isn't (just) about logistics; it's a somatic reaction to the threat of visibility.
  2.  **Love's Shape Beyond Scripts:** The film depicts a bond whose intensity and longevity defy categorization. It *is* spousal in commitment and depth, yet its *form* – stolen moments, coded postcards, mountain separations – is utterly unlike traditional marriage. Arguments debate whether this "counts." Fiction *shows* it existing, thriving in its way, and being devastatingly real *to the people in it*. Your dying man senses this – a ceremony imposes a foreign shape on a love that grew wild.
  3.  **The Primacy of Private Meaning vs. Public Utility:** The shirt ritual is the ultimate fictional argument. It’s meaningless to the world (solves no legibility debt) but contains the entire emotional universe for Ennis. It validates the retrospective function purely internally. Arguments prioritize social/legal functions; fiction can privilege the irreducible, often incommunicable, private meaning a bond holds, *especially* when it was forged in secrecy. It shows ratification *can* exist entirely within the self or the dyad.
  4.  **Refusal as Integrity, Not Cowardice:** Ennis's final scene reveals his refusal wasn't cowardice *about the relationship*, but a brutalized man's understanding of the world's violence. His fidelity was to their *actual* life – the hidden, dangerous, precious thing they built. A wedding would betray *that* reality. The shirts are his true wedding, not a coward's retreat.

  **Scenes to Set Beside Your Third Act:**

  1.  **Jack's Proposal & Ennis's Refusal:** Not just the "ranch" offer, but Ennis's visceral, fear-driven "no," rooted in his childhood trauma. It’s refusal based on protecting the *fragile reality* of their bond from destruction, not rejecting its depth. *This is your dying man's core: protecting the truth of their lived experience.*
  2.  **Ennis Visiting Jack's Parents:** The brutal collection of the legibility debt. The parents' erasure of Ennis, their control over Jack's ashes and memory. Shows the concrete costs silence imposes on survivors. *This underscores the daughter's valid point about being "unseen," but also why a deathbed fix might feel insulting.*
  3.  **The Shirt Ritual (Closet Scene):** The masterpiece. Pure retrospective ratification. A declaration to the self and the dead beloved. A "marriage" defined by its private truth, not public form. It pays their *emotional* debt in full, while highlighting the unpaid *social* debt. *This is the emotional logic of your dying man's refusal: his "wedding" already happened, invisibly, across forty years. A new ceremony wouldn't capture it; it would overwrite it.*

  **For Your Dying Man:** Let his refusal stem from **fidelity to the map they actually drew, not the one society offers.** He doesn't need the declaratory function *now* because their bond’s reality is bedrock to him. The retrospective function – ratifying *how* they lived – is already complete in his heart. A ceremony feels like renouncing the ingenuity, resilience, and quiet courage it took to build their love *without* the script. It would simplify a complex, hard-won history into a symbol that, for him, never fit. His tragedy, like Ennis’s, is that the world lacked a language for their love *while they lived it*. A deathbed wedding can’t invent that language retroactively without feeling false. His strength is in holding the messy, illegible truth of what they *were* against the neat, legible lie of what they might be forced to *seem*.
