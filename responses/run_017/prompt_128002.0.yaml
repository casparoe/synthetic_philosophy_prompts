  ### **Decision Tree: Doing/Allowing and Killing/Letting-Die Classification**

  **How to Use:**  
  Answer each question based on your intuitive judgment of the case. Proceed down the branch that matches your answer. The endpoint (leaf) names your position and highlights its most awkward implication.  
  **Key for Nodes**:  
  - **★** = Load-bearing (splits >3 leaves, fundamental to the logical space).  
  - **FG** = Fine-grained (distinguishes rare or subtle positions).

  ---

  #### **Node 1 ★: Descriptive Distinction (Euthanasia Cases)**  
  *Case: "Dr. A injects a terminal patient with a lethal drug to end suffering. Dr. B, treating an identical patient, removes life support to end suffering (causing immediate death). Is there a factual difference in how these deaths occurred, aside from whether they're right or wrong?"*  
  - **Yes** (factual difference exists) → Node 2.  
  - **No** (no factual difference) → **Leaf A: Moral Equivalence View (e.g., Rachels)**.  
    *Most awkward commitment: Must deny any moral difference between shooting someone and refusing to feed them if intent and outcome match.*

  #### **Node 2 ★: Pre-Moral vs. Obligation-Dependent (Factory Case)**  
  *Case: "A factory owner dumps poison into a river, killing villagers. Later, the same owner fails to remove poison they previously dumped (though cleanup is legally required), causing deaths. Is 'dumping' vs. 'not removing' a difference based only on physical actions, or does classifying 'not removing' as 'allowing harm' depend on the legal duty?"*  
  - **Pre-moral** (physical actions define it; duty irrelevant to classification) → Node 3.  
  - **Obligation-dependent** (classifying it as "allowing" requires the duty) → Node 7.  

  #### **Node 3 ★: Binary vs. Scalar (Ventilator Withdrawal)**  
  *Case: "A doctor unplugs a ventilator to stop futile treatment, causing death. Is this more like injecting a lethal drug (doing harm) or like watching a stranger drown without intervening (allowing harm)?"*  
  - **Like injecting (doing harm)** → Node 4.  
  - **Like watching drown (allowing harm)** → Node 5.  

  #### **Node 4: Created Threat + Omission (Dam Case)**  
  *Case: "Alex built a dam that will flood a village if overflow isn't released. Alex could open a valve to prevent flooding but refuses. Is Alex allowing harm or doing harm?"*  
  - **Allowing harm** → **Leaf B: Traditional Doing/Allowing View (e.g., Foot)**.  
    *Most awkward commitment: Building the dam initially is "doing," but refusing to release water is "allowing" harm, making the same act (dam-related inaction) a hybrid category.*  
  - **Doing harm** → **Leaf C: Causal Responsibility View (unnamed)**.  
    *Most awkward commitment: All omissions that sustain a threat the agent created are morally equivalent to direct assaults.*  

  #### **Node 5 ★: Asymmetry Direction (Dictator Case)**  
  *Case: "A dictator orders executions (killing 100). Separately, they could easily stop their army from massacring 100 civilians but choose not to. Is failing to stop the massacre as bad as, worse than, or not as bad as ordering executions?"*  
  - **Not as bad** → **Leaf D: Traditional Asymmetry View (e.g., Foot/Sanctity of Life)**.  
    *Most awkward commitment: "Allowing" via ventilator withdrawal is less wrong than active killing, even with identical intent and outcome.*  
  - **As bad or worse** → Node 6.  

  #### **Node 6: Enabling/Facilitating (Car Loan Case)**  
  *Case: "Jamie lends a car to a friend knowing they will commit murder with it. Jamie does nothing else. Is this doing harm, allowing harm, or something else?"*  
  - **Doing harm** → **Leaf E: Broad Doing View (unnamed)**.  
    *Most awkward commitment: Indirect acts (like lending) are morally equivalent to direct killing.*  
  - **Allowing harm** → **Leaf F: Rights-Based Symmetry View (e.g., Singer)**.  
    *Most awkward commitment: Not donating excess income to save lives is as wrong as killing.*  
  - **Something else (e.g., enabling)** → **Leaf G: Enabling View (unnamed)**.  
    *Most awkward commitment: Requires a third moral category beyond doing/allowing, which may not map to intuitions about blame.*  

  #### **Node 7 ★: Institutional Role (Lifeguard Case)**  
  *Case: "Lifeguard Lee sees a swimmer drown while on duty. Lee could easily throw a lifebuoy but doesn't. Is this allowing harm or doing harm?"*  
  - **Allowing harm** → Node 8.  
  - **Doing harm** → **Leaf H: Normative Doing View (e.g., Shiffrin)**.  
    *Most awkward commitment: Any breach of duty (e.g., a parent skipping a child's meal) is "doing harm," blurring lines with direct violence.*  

  #### **Node 8: Grain of Description (Treatment Withdrawal vs. Non-Initiation)**  
  *Case: "Dr. Kim stops treatment that has been given for months, causing death. Would it be different if Dr. Kim had never started the treatment? Does 'stopping' vs. 'never starting' change the doing/allowing classification?"*  
  - **Yes (e.g., stopping is doing, never starting is allowing)** → **Leaf I: Act-Omission View (e.g., Bennett)**.  
    *Most awkward commitment: Stopping life support is "killing," but not starting it for an identical patient is "letting die," creating a moral gap for arbitrary timing.*  
  - **No (both allowing or both doing)** → Node 9.  

  #### **Node 9 FG: Independent Agent (Prison Guard Case)**  
  *Case: "Guard Taylor sees Inmate A attack Inmate B but doesn't press an alarm to stop it (though required). Is Taylor allowing harm or doing harm?"*  
  - **Allowing harm** → **Leaf J: Pure Omission View (unnamed)**.  
    *Most awkward commitment: Failing to stop a murderer is "allowing," even if you're responsible for the victim.*  
  - **Doing harm** → **Leaf K: Complicity View (e.g., Kamm)**.  
    *Most awkward commitment: Failing to act makes you a co-perpetrator of harm by others.*  

  #### **Node 10 FG: Preventing Rescue (Restraining Rescuer Case)**  
  *Case: "Riley sees a child drowning. Casey tries to rescue them, but Riley physically restrains Casey. The child drowns. Is Riley allowing harm or doing harm?"*  
  - **Allowing harm** → **Leaf L: Non-Interference View (unnamed)**.  
    *Most awkward commitment: Actively blocking a rescuer is "allowing" harm if the victim isn't touched, clashing with intuitions about interference.*  
  - **Doing harm** → **Leaf M: Direct Intervention View (e.g., McMahan)**.  
    *Most awkward commitment: Restraining a rescuer is equivalent to drowning the child yourself, ignoring the rescuer's agency.*

  ---

  ### **Leaf Position Summary**
  - **Leaf A**: Moral Equivalence View (named).  
  - **Leaf B**: Traditional Doing/Allowing View (named).  
  - **Leaf C**: Causal Responsibility View (unnamed).  
  - **Leaf D**: Traditional Asymmetry View (named).  
  - **Leaf E**: Broad Doing View (unnamed).  
  - **Leaf F**: Rights-Based Symmetry View (named).  
  - **Leaf G**: Enabling View (unnamed).  
  - **Leaf H**: Normative Doing View (named).  
  - **Leaf I**: Act-Omission View (named).  
  - **Leaf J**: Pure Omission View (unnamed).  
  - **Leaf K**: Complicity View (named).  
  - **Leaf L**: Non-Interference View (unnamed).  
  - **Leaf M**: Direct Intervention View (named).  

  ---

  ### **Unresolved Pairs (Tree Cannot Separate)**
  1. **Counterfactual-Dependence Reduction vs. Causal-Process Reduction**:  
     - Both answer identically on most nodes (e.g., Node 1: Yes, Node 2: Pre-moral, Node 3: Doing harm).  
     - *Why inseparable?* The tree uses causal cases (e.g., Node 4) that both views interpret through "harm depends on agent's action" (counterfactual) or "new causal chain" (process). Only advanced cases (e.g., preemption) would split them, but they exceed your cases.  
     - *Diagnosis: Unexplored in this tree*—requires cases with overdetermined harm.  

  2. **Brute Principle of Doing/Allowing vs. Claims-Based Derivation**:  
     - Both answer identically if they agree on Node 2 (Obligation-dependent) and Node 7 (Allowing harm).  
     - *Why inseparable?* The tree tests "what is owed" (Node 7) but cannot isolate if duties stem from victim claims (rights-based) or intrinsic act properties (brute).  
     - *Diagnosis: Merely unattractive*—philosophers rarely defend brute asymmetry without justification.  

  ---

  ### **Scoring Notes for Instructor**
  **Patterns Tracking the Distinction**:  
  - Students who answer consistently across cases with similar causal/obligation structures (e.g., "allowing" in ventilator, dam, *and* lifeguard cases) likely grasp the distinction.  
  - Look for stability on load-bearing nodes (★): E.g., "Yes" at Node 1 and "Pre-moral" at Node 2 indicates a descriptive commitment.  
  - Asymmetry at Node 5 confirms they see moral weight in the distinction itself.  

  **Patterns Driven by Orthogonal Factors (Misfire Risks)**:  
  - **Outcome severity bias**: Students rate "doing" higher in cases with vivid harm (e.g., Node 1 euthanasia) but "allowing" in low-stakes cases. *Red flag: Inconsistent answers on Node 4 (dam) vs. Node 9 (prison guard) if harms differ.*  
  - **Legal blameworthiness bias**: Students classify breaches of duty (Node 7, Node 9) as "doing" regardless of causal role. *Red flag: "Doing" at Node 7 but "Allowing" at Node 4.*  
  - **Squeamishness about mechanisms**: Students call physical acts "doing" (Node 3 ventilator, Node 10 restraining) but omissions "allowing," even when causal roles match. *Red flag: "Allowing" at Node 3 but "Doing" at Node 8 (if both involve acts).*  
  - **Proxies for intention/foresight**: Students answer based on intent (e.g., "allowing" only if no ill intent) rather than action type. *Red flag: "Allowing" in Node 5 if dictator is indifferent but "Doing" if malicious.*  

  **Recommendations**:  
  - Drop **Node 10 (FG)** if students fixate on physical contact (squeamishness misfire).  
  - Drop **Node 6 (enabling)** if "something else" answers are rare (<10%); it refines few leaves.  
  - Prioritize discussion on **Node 2**, **Node 3**, and **Node 5**—they reveal core disagreements. Use **Node 8** to expose granularity debates in seminar.  

  This tree isolates positions using your clinical cases while avoiding theory-laden terms. It flags unstable intuitions via misfire patterns, letting you focus class time on the distinction itself.
