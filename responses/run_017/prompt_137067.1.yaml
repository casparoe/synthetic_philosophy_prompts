  I am a novelist, and in the book I am drafting a retired banker uses the 1939 Judy Garland film The Wizard of Oz to explain George Berkeley's monetary theory to her granddaughter; I want that scene to be philosophically honest rather than a cute parallel. Please bring the film into conversation with Berkeley's view in his economic tract The Querist that gold and silver are not real wealth but merely conventional instruments for transferring it, that a nation's genuine wealth is the industry of its people together with the produce of its land, and that paper credit issued by a national bank and secured by that industry can be superior to a reliance on hoarded bullion. Set aside the familiar bimetallist reading of the slippers and the yellow brick road; I want to know how a Berkeleyan distinction between token and real wealth illuminates the ruby slippers, the Emerald City, the Wizard's humbug, and Dorothy's discovery that she could have gone home all along, and where the film complicates or resists that reading instead of merely illustrating it. Does the film add anything to Berkeley's argument that his own reasoning does not, perhaps by dramatizing how a community can be held captive by a token it mistakes for substance, or by suggesting that the mere recognition that a token is a token is not enough to dissolve its power? Please answer in continuous prose only, without headings, bullet points, bold text, or tables, the way one would write an email or a letter, and in that answer say how confident you are in your reading as a whole and single out the one point you are least sure of.
