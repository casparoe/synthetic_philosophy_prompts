  Where the film complicates Berkeley: Berkeley assumes that recognizing tokens as tokens dissolves their power. But in the film, Dorothy knows the slippers are magical but doesn't realize their capability until Glinda explains. So recognition isn't sufficient; knowledge of how to use the token is crucial. The Wizard's humbug still produces real effects (medals, diploma), showing that tokens, even when exposed, can function if the community accepts them.

