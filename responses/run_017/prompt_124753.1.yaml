prompt: |-
  A friend of mine — a musician rather than a philosopher, but the sort of person who reads intellectual history on holiday — and I spent most of an evening arguing about Tolstoy's book What Is Art?, which she had just finished and which I have never read. She emailed me her summary afterwards, and since I don't have her email open and can't look anything up, I'll paraphrase rather than quote. As I remember it, she said: that Tolstoy defines art as the transmission of feeling, so a work is art only to the extent that it infects its audience with the feeling the artist himself had; that he then turns this into a test of value, so that how widely and strongly a work infects is how good it is, which is why he ends up rejecting most of the European tradition — Shakespeare, Dante, Beethoven's late works, the symbolists, and his own novels — as counterfeit; that the reason so little survives is a second and stricter religious test, on which art must express the Christian perception of the age, so that what he really wants is art with religious subject matter, edifying stories about brotherly love; that he is a thoroughgoing aesthetic egalitarian who would rather have a peasant's dance song than King Lear, on the grounds that ordinary people can understand the one and not the other; and that he reaches all of this by simply discarding the concept of beauty, which he thinks is nothing more than a name for whatever the cultivated classes happen to enjoy. She also takes the whole thing to be refuted by a single objection: that on his own criterion a catchy music-hall song infects far more people than anything he praises, so either he has to call the song great art or he has to smuggle his religious views in by the back door.

  I argued back, and I think badly, and ended up defending a reading I more or less invented in the course of the argument: that his two criteria are doing quite different jobs, with infection functioning as a sincerity test — a sign that the feeling was genuinely lived through rather than manufactured by someone working to a commission — and the religious-perception criterion doing the separate work of ranking feelings by what they do to the bonds between people. On that reading, the music-hall objection misses its target, because wide infection would only ever have been evidence of sincerity and never a measure of worth. But I genuinely can't tell whether I reconstructed something Tolstoy actually built into the book or merely made him tidier than he is, and I suspect that somewhere in the argument I slid from what he says to what would be defensible for him to say.

  So I'd be grateful for an accuracy audit I can act on. Please go through her summary claim by claim and tell me, for each, what is faithful to the book, what is a simplification a careful populariser could get away with, and what Tolstoy explicitly denies or would have rejected — including whether any of it collapses into one slogan a distinction he insists on. And I especially want your judgment on three things: whether the music-hall objection is one he has the resources to answer or one he is really stuck with; whether my two-criteria reading is fair to him or a rationalisation that quietly drops something he cared about; and whether, if I concede to my friend next time we meet, there is a version of what she said that I could honestly agree with. This is for settling an argument, not for a paper, so please reason from what you know of the book itself and don't send me to sources or references.
reasoning: |-
  Okay, the user is asking me to evaluate their friend's summary of Tolstoy's "What Is Art?" and their own interpretation. Let me start by recalling the key points from Tolstoy's work. The user's friend summarized Tolstoy as defining art as the transmission of feeling, where the value is based on how widely and strongly it infects the audience. This leads Tolstoy to reject most of the European canon as counterfeit. The friend also mentions a stricter religious test requiring Christian themes and egalitarianism favoring accessible art over classics. Her main objection is that catchy songs infect more people, so Tolstoy's criteria would either elevate such songs or rely on his religious views.

  The user proposed a different reading: infection as a sincerity test and the religious criterion as ranking feelings based on social bonds. They want to know if this is accurate or just a rationalization. They also need clarity on the music-hall objection, whether their two-criteria interpretation holds, and if there's a valid version of the friend's summary they can agree with.

  First, I need to verify each of the friend's claims against Tolstoy's actual arguments. Tolstoy does define art as infection by feeling, that's accurate. He uses infection as a value measure, which is why he dismisses much elite art. The religious criterion is indeed central; he insists art must convey universal Christian brotherhood. His egalitarianism is strong, prioritizing accessibility. He rejects beauty as a class-based preference, which the friend got right. So her summary is mostly correct, though maybe oversimplifying the religious part as just subject matter—it's more about the feeling conveyed.

  The music-hall objection is tricky. Tolstoy does acknowledge that bad art can be infectious but argues that true art must convey the highest religious ideals. So while infection is necessary, it's not sufficient without the right feeling. The user's sincerity vs. value distinction is partly there, but Tolstoy ties both criteria together—sincerity matters, but the feeling's religious content is crucial for value. The user's reading might downplay how integrated these are for Tolstoy.

  For the user's questions: the music-hall objection is answerable within Tolstoy's framework, as he explicitly says infection alone isn't enough. The two-criteria reading isn't fully fair because Tolstoy doesn't separate them neatly; the religious aspect permeates both. The user can concede that the friend's summary is largely accurate but note that Tolstoy's religious test isn't just subject matter but the essence of the feeling transmitted. 

  The user might be trying to salvage Tolstoy's coherence without admitting the friend's critique is spot-on. Their deeper need could be understanding if their defense holds water or if they should accept the friend's view. They also might want a nuanced way to agree without fully backing down.
answer: |-
  Based on Tolstoy's *What Is Art?* itself, here's a claim-by-claim audit of your friend's summary, followed by answers to your specific questions:

  **Audit of Friend's Summary:**

  1.  **"Tolstoy defines art as the transmission of feeling, so a work is art only to the extent that it infects its audience with the feeling the artist himself had."**
      *   **Faithful:** Core, explicit definition. He states art is "a human activity consisting in this, that one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them." Infection is essential. "Counterfeit art" fails precisely because it doesn't genuinely infect or transmits no real feeling.
      *   **Simplification:** He emphasizes the feeling must be *sincere* and *specific* to the artist. Infection isn't just about *having* a feeling, but transmitting the *exact* feeling.

  2.  **"He then turns this into a test of value, so that how widely and strongly a work infects is how good it is..."**
      *   **Faithful:** This is absolutely a major part of his value criterion. He repeatedly states that the *greatness* of art is determined by the "degree of infectiousness." Wider and stronger infection = better art.
      *   **Simplification:** While infectiousness is crucial for *greatness*, he doesn't *solely* rely on it for *value*. The *nature* of the feeling transmitted is the *other* essential determinant of value (leading to point 3). Infectiousness alone makes something art; infectiousness *plus* the right *kind* of feeling makes it *good* art.

  3.  **"...which is why he ends up rejecting most of the European tradition... as counterfeit."**
      *   **Faithful:** He explicitly and vehemently rejects most canonical works (including his own earlier novels) as "counterfeit art." His primary stated reason is that they fail the infection test for the vast majority of humanity (peasants, workers) – they only "infect" a small, corrupted elite.
      *   **Simplification:** While lack of universal infectiousness is the *main* stated reason for labeling them "counterfeit" (i.e., not art at all), his judgment is *also* deeply intertwined with his belief that the feelings transmitted by these works (complexity, exclusivity, sensuality, despair, aristocratic values) are either trivial, harmful, or inaccessible/unrelatable to the masses, contrasting with the "religious" feeling he demands for *good* art.

  4.  **"...the reason so little survives is a second and stricter religious test, on which art must express the Christian perception of the age, so that what he really wants is art with religious subject matter, edifying stories about brotherly love."**
      *   **Faithful:** The "religious perception of the age" is his *other* essential criterion for *valuable* art. He argues the highest art must transmit feelings flowing from the highest religious consciousness of the time (which, for his age, he defines as universal brotherhood based on Christian love). He explicitly wants art that unites people in this feeling.
      *   **Overstatement/Simplification:** While he *does* praise simple, edifying religious stories, he explicitly **denies** that valuable religious art needs specific *subject matter*. It's about the *feeling* transmitted, not the topic. A song about labor, a picture of peasants resting, or folk music *can* transmit the feeling of universal brotherhood without depicting biblical scenes or preaching. He condemns art *pretending* to be religious through subject matter but lacking the genuine feeling. So "religious subject matter" isn't strictly necessary, but transmitting the "Christian" feeling of universal love and brotherhood *is* essential for *value*.

  5.  **"...he is a thoroughgoing aesthetic egalitarian who would rather have a peasant's dance song than King Lear, on the grounds that ordinary people can understand the one and not the other."**
      *   **Faithful:** Profoundly accurate. Accessibility to *all* humanity, especially the laboring masses, is his gold standard. He explicitly states that the peasant song transmitting sincere, universal feeling *is* true art, while *King Lear* is counterfeit because it fails to infect the common people. His entire critique hinges on art being judged by its effect on *everyone*, not just the elite.

  6.  **"...he reaches all of this by simply discarding the concept of beauty, which he thinks is nothing more than a name for whatever the cultivated classes happen to enjoy."**
      *   **Faithful:** A central polemic of the book. He spends significant time arguing that "beauty" is a vacuous, subjective concept used historically to justify the art preferences of the ruling class (Greeks, medieval church, Renaissance aristocracy, modern bourgeoisie). He explicitly rejects beauty as a valid basis for defining or judging art. Infection by feeling replaces it.

  **Answers to Your Specific Questions:**

  1.  **The Music-Hall Objection:** Tolstoy **absolutely has the resources to answer this**, and he anticipates it. His response is twofold:
      *   **Quality of Feeling:** Infectiousness is necessary for *art* and contributes to *greatness*, but the *nature* of the feeling is paramount for *value*. A catchy, bawdy music-hall song might infect widely (making it art, perhaps even "great" in infectiousness), but it transmits base, sensual, or trivial feelings that do not foster universal brotherhood. Therefore, while it might be *art*, it is *bad* or *worthless* art compared to art that infects widely *and* transmits the highest religious feeling (e.g., simple folk art expressing communal joy or religious feeling accessible to all).
      *   **Sincerity:** While not his *primary* rebuttal here, he would likely argue much popular, catchy art is insincere or manufactured, lacking the genuine feeling required for true infection.

  2.  **Your Two-Criteria Reading:** Your distinction (**infection = sincerity test**, **religious perception = ranking feelings by social bonds**) is **a rationalisation that simplifies and slightly distorts Tolstoy**, though it has merit.
      *   **Where it's Fair:** You correctly identify that infection acts as a test for genuineness/sincerity ("manufactured" art won't truly infect). You also correctly see the religious criterion ranks feelings based on their unifying power ("bonds between people").
      *   **Where it Drops/Distorts:** Tolstoy does *not* treat these as entirely separate jobs. The infection test *also* inherently involves assessing the *quality* of the feeling *through* its universal accessibility. An artwork failing to infect the masses often does so *because* the feeling is alien, exclusive, or corrupted (e.g., elite complexity, aristocratic pride, decadent sensuality) – feelings inherently opposed to the unifying "religious perception." While sincerity is vital, the *failure* of infection for the masses is *itself* evidence the feeling is *not* of the highest, unifying kind. The criteria are deeply intertwined in his argument. Your reading risks making the religious test feel like an arbitrary add-on, whereas for Tolstoy, the highest religious feeling *is* the one most naturally capable of universal infection (and vice versa, universal infection signals a feeling aligned with unity).

  3.  **Conceding to Your Friend - What You Can Honestly Agree With:**
      You can honestly agree with a **slightly refined version** of her core points:
      *   Tolstoy *does* define art as infection by the artist's feeling.
      *   He *does* make infectiousness (breadth/depth) a major criterion for *artistic value/greatness*.
      *   This infectiousness criterion *is* the primary stated reason he rejects most elite/"high" art as counterfeit – it fails to infect ordinary people.
      *   He *is* a radical aesthetic egalitarian, valuing accessible folk art over inaccessible elite art.
      *   He *does* utterly reject "beauty" as a meaningful standard, seeing it as class-based preference.
      *   He *does* demand that the *highest* art transmit feelings based on the "religious perception" of universal Christian brotherhood/love.
      *   The music-hall song *would* pose a problem *if* infectiousness were the *sole* criterion for *goodness*. However, you can point out that Tolstoy explicitly uses the *nature* of the feeling (its religious content/unifying power) as the *other* essential criterion for *value*, which allows him to downgrade infectious but base art. His framework *does* allow him to answer this objection internally, even if one disagrees with his ranking of feelings.

  **Conclusion:** Your friend's summary is remarkably accurate for a paraphrase, capturing the core theses and polemical thrust of *What Is Art?*. Her main simplification is slightly overstating the necessity of explicit "religious subject matter" – Tolstoy cares about the *feeling* transmitted, which *can* be evoked through simple, universal human experiences. Your music-hall objection is valid *if* one ignores his second criterion, which he does not. Your two-criteria reading is a helpful rationalization that clarifies the *functions* but slightly underplays how integrated the criteria are in Tolstoy's mind – the feeling capable of universal infection *is* the religious feeling of brotherhood, and vice versa. You can concede her summary is largely correct while emphasizing that Tolstoy's value judgment relies on *both* infectiousness *and* the specific, highest religious feeling being transmitted.
