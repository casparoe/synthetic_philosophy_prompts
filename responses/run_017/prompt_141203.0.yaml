  We are given constraints: no new excavation, modest budget for new measurements on existing collections (hundreds of objects), no period-specific monographs, output is reliability guidance for public claims.

  The five difficulties (stipulative labels):
  1. signature collapse: many institutional arrangements map to same material residue? Is it the record or our coarse vocabulary?
  2. survival asymmetry: the filter (from past to present) is biased against verbal, bodily, ephemeral practices -> sample biased directionally.
  3. phase averaging: temporal mismatch - deposits average over generations, but institutions/beliefs are about binding at a time.
  4. answer-key problem: no ground truth, so we test by forward modeling (from known past to residue). How much confidence can we get?
  5. confidence laundering: hedged claims become flat in public use.

  Reference case (Case U): mortuary sequence with convergence then divergence of grave assemblages. Documentary evidence 500 years later. Current disjunction: central authority, decentralized prestige, or burial selection artifact.

  Fashionable items: large-scale automated classification of artifact images; bigger comparative database of grave assemblages.

  We are to prioritize 4-6 lines of work, ordered by rank.

  We must output a JSON object with specific schema.

  Approach:

  I. Challenge assumptions (if any) in "assumptions_challenged".

  II. Define criteria for ranking.

  III. Prioritize 4-6 research lines, each with:
     - rank
     - title
     - question (one sentence, with possible answer)
     - upstream_of (what this gates)
     - blocked_by (what must be settled first, or none)
     - tractability: approach, years, people, what success looks like, main obstacle
     - neglectedness
     - effect_on_case_u
     - policy_payoff (concrete change for curator, official, witness)
     - demotion_condition

  IV. Cut list: which fashionable items to cut and why, and condition to revive.

  V. Resource split: percentages for:
     - new_measurement
     - formalisation_and_forward_modelling
     - calibration_with_known_outcomes
     - translation_into_guidance
     - justification for split

  VI. Crux: the single question on which the ordering turns.

  VII. Biggest risk to the agenda.

  My thinking:

  The core problem is inference from objects to claims about the past, with a focus on reliability. The constraints force us to work with existing collections and legacy data. We are not doing new fieldwork, so we must focus on re-analysis and new measurements on existing material.

  The five difficulties highlight key challenges. We need to prioritize research that addresses these in a way that leads to actionable guidance.

  Criteria for prioritization might include:
  - How central is the problem to the core inference? (e.g., without an answer key, how can we validate any method?)
  - How much does it unlock other problems? (upstream)
  - Tractability given constraints (modest budget, no new excavation, etc.)
  - Neglectedness (especially relative to fashionable but potentially low-return approaches)
  - Impact on the reference case (Case U) and policy payoff (how it changes practice)

  Fashionable items: 
  - Large-scale automated classification: This might help with descriptive vocabulary (signature collapse) but without addressing the collapse itself (is it the record or the vocabulary?). Also, the constraint of modest budget for new measurements (hundreds of objects) doesn't align with large-n classification. So likely to be cut unless we can justify a small-scale, targeted version that addresses vocabulary coarseness.
  - Bigger comparative database: This might help with analogue-matching, but again, without addressing the core inference problems (e.g., phase averaging, survival asymmetry). It might just give more data of the same kind.

  Therefore, I propose to cut both fashionable items unless they are reframed to directly address the inference challenges.

  Priorities:

  I think the answer-key problem is fundamental. Without a way to test our inference procedures, how do we know they work? So forward modeling and calibration should be a top priority.

  But note constraint: we can do calibration with known outcomes? We have some known outcomes? We can use historical cases with independent evidence? But the constraint says we can re-analyze existing collections, including those with incomplete provenance. So we might use cases with known outcomes (from history) that are represented in museum collections.

  Phase averaging and survival asymmetry are also critical because they affect the very possibility of inferring institutions/beliefs from the record.

  Signature collapse: if it's a matter of descriptive vocabulary, then fine-grained measurement might break ties. But if it's inherent in the record, then we need to know that too.

  Confidence laundering is about communication, so it might be downstream.

  Given that, I propose:

  Priority 1: Addressing the answer-key problem through controlled forward modeling and calibration.
    - Why? Without validation, we cannot know the reliability of any inference. This gates everything else.

  Priority 2: Untangling phase averaging by developing methods to detect temporal heterogeneity within phases.
    - Why? Because without this, we cannot know if we are seeing one institution or many.

  Priority 3: Testing signature collapse by intensive measurement on a small set of objects from contexts with known institutional variation (if we can find such in the record) or by simulation.
    - Why? To determine whether finer measurement can break the tie or if the collapse is inherent.

  Priority 4: Quantifying survival asymmetry by building a model of the preservation filter and testing against known cases (or simulated ones).
    - Why? To understand the direction of bias and correct for it.

  Priority 5: Developing protocols to prevent confidence laundering by formalizing the uncertainty propagation at each hand-off.
    - Why? To ensure that the reliability guidance is maintained in public claims.

  But note: the answer-key problem is a prerequisite for testing methods in priorities 2, 3, and 4? Not necessarily: we can use simulation for phase averaging and survival asymmetry without a real answer key. But for signature collapse, we need cases where we know the institution and see the residue.

  Given constraints, we might rely on:
  - Simulation for forward modeling (without real data, but then how do we calibrate the simulation? We need to ground it in real processes).
  - Known historical cases with both material residues and documentary evidence (but constraint: no period-specific monographs, so we must abstract the method).

  The constraint says we can use legacy excavation archives and collections, including those with incomplete documentation. So we can look for cases with known outcomes? But the problem says the record never arrives with interpretation. However, we might use cases from periods with both archaeology and documentary evidence (but the documentary evidence is not about the same time?).

  We can do: calibration with known outcomes by selecting cases where we have both archaeological and historical evidence for the same period? But the constraint says: "the earliest usable documentary evidence postdates the sequence by about five centuries" in Case U. So for other cases, we might have contemporaneous evidence.

  But note: we are not limited to Case U. We can use other collections.

  So for the answer-key work, we can use collections from periods with independent evidence (historical periods) to test inference procedures.

  Given that, let's outline the priorities.

  Also, note the resource split: we have to allocate among:
  - new_measurement (on existing collections)
  - formalisation_and_forward_modelling (building models, simulations)
  - calibration_with_known_outcomes (testing with cases that have independent evidence)
  - translation_into_guidance (making it usable for non-specialists)

  Now, the crux: I think the crux is whether the answer-key problem can be adequately addressed by forward-only testing and calibration with known outcomes. If not, then the whole program might fail.

  Biggest risk: that we develop methods that are not applicable to cases without independent evidence (like Case U) because they rely on having a known outcome for calibration.

  Let me write the JSON.

  First, assumptions_challenged: I have a few.

  1. On "signature collapse": The framing as a binary (record vs. vocabulary) might be too simplistic. It could be that some collapses are inherent and others are due to vocabulary, and we need a way to diagnose which is which.

  2. On "survival asymmetry": The idea that the bias is directional is important, but it might be that we can model the direction and correct for it, rather than just note it.

  3. On Case U: The disjunction includes "burial selection artifact", but that might be an instance of survival asymmetry? So the categories are interconnected.

  But I don't think these are major confusions, so I'll note one:

  Assumptions challenged:
  - "The label 'signature collapse' implies a binary: either the record is inherently ambiguous or our vocabulary is coarse. But it might be that some ambiguities are resolvable by finer measurement and others are not, and we need a method to tell which category a given ambiguity falls into."

  But the user said they are interested in whether the labels carve the problem correctly, so I'll include one.

  Criteria: I will define:

  1. Name: Foundational for inference
     Definition: Addresses a problem that must be solved for any reliable inference to be possible.
     Role in ranking: Top priority if without progress here, other work lacks validation.
     Tension with: Tractability because foundational problems can be hard.

  2. Name: Tractability under constraints
     Definition: Can be addressed with the available resources (modest budget, existing collections, no new excavation).
     Role: Higher if feasible within 5 years with the budget.
     Tension with: Ambition - we might avoid hard problems that are important.

  3. Name: Impact on Case U
     Definition: How much it reduces the disjunction in Case U or shows that the disjunction is irreducible.
     Role: Higher if it directly helps with the reference case.
     Tension with: Generality - focusing on Case U might not yield general methods.

  4. Name: Policy payoff immediacy
     Definition: How directly it leads to actionable guidance for non-specialists.
     Role: Higher if it produces tools or protocols that can be readily used.
     Tension with: Theoretical depth - immediate payoff might require applied work at the expense of fundamental understanding.

  5. Name: Neglectedness
     Definition: The extent to which the problem is under-addressed in current research.
     Role: Higher if it avoids duplicating fashionable but less fruitful lines.
     Tension with: Fashionable items might have momentum.

  Now, priorities (4-6):

  Rank 1: Validating inference through forward modeling and calibration
  Question: Can we develop and calibrate forward models that reliably map from past institutions to material residues, such that these models can be used to test inference procedures on archaeological cases without independent evidence?
  Upstream of: All other inference methods (for phase averaging, signature collapse, etc.)
  Blocked by: None (but requires access to known cases for calibration)
  Tractability: 
     Approach: Build computational models of how institutions generate residues, then test against known historical cases (using existing collections with both material and documentary evidence). Also, use simulation to explore parameter space.
     Years: 3-4
     People: 2-3 modelers, 1-2 archaeologists with domain expertise, 1 data scientist
     What success looks like: A set of validated models for specific institution types (e.g., central authority vs. prestige system) that, when applied to Case U, can assign probabilities to the disjuncts.
     Main obstacle: Finding suitable known cases in the archaeological record with sufficient documentation and material.
  Neglectedness: Moderate; forward modeling is done in some areas but not systematically for institutional inference.
  Effect on Case U: Would allow us to assign relative likelihoods to the disjuncts (central authority, prestige, selection) or show that they remain equally likely.
  Policy payoff: Curators and officials can use the model outputs to express the strength of evidence for a claim (e.g., "the model suggests a 70% chance of central authority").
  Demotion condition: If we find that models cannot be calibrated to known cases with sufficient accuracy, then demote.

  Rank 2: Disentangling phase averaging by detecting intra-phase change
  Question: Can we develop methods to detect short-term institutional change within a single archaeological phase, thereby reducing the risk of conflating repeated ephemeral institutions with one long-lived one?
  Upstream of: Claims about the stability of institutions.
  Blocked by: None, but benefits from better chronological methods (which we can apply via new measurements, e.g., high-precision dating of individual objects within a phase).
  Tractability:
     Approach: Apply high-resolution dating (e.g., radiocarbon on short-lived samples) and sequential Bayesian modeling to existing stratigraphic sequences to detect temporal structure within phases. Also, simulate deposition processes to understand how institutions with different durations manifest.
     Years: 4
     People: 2 chronologists, 1 statistician, 1 archaeologist
     What success looks like: A method that, for a given phase, can estimate the minimum number of institutional changes that must have occurred to produce the observed residue pattern.
     Main obstacle: The coarseness of existing stratigraphic records and the cost of high-precision dating.
  Neglectedness: High; most phase-based analysis assumes homogeneity.
  Effect on Case U: Could determine whether the convergence period was one continuous institution or multiple short-lived ones, which would bear on the central authority vs. decentralized prestige disjunct.
  Policy payoff: Heritage officials can state whether the evidence supports a claim of long-term stability or not, and thus avoid overstating continuity.
  Demotion condition: If we find that even with high-resolution dating, the temporal grain is too coarse to resolve institutional timescales, then demote.

  Rank 3: Diagnosing signature collapse via intensive measurement
  Question: Is the observed material ambiguity for a given institution type due to coarse description or inherent in the record, and can we break ties by targeted high-resolution measurement?
  Upstream of: Refining descriptive vocabularies and measurement protocols.
  Blocked by: None, but requires access to collections from contexts with known institutional variation (from calibration work).
  Tractability:
     Approach: Select a small set of objects (hundreds) from known contexts (e.g., from the calibration cases) and apply intensive measurements (e.g., residue, use-wear, elemental analysis) to see if we can distinguish institution types that previously looked the same. Also, simulate multi-institution systems to see if they produce distinct residues at fine scales.
     Years: 3
     People: 2 specialists in material analysis, 1 archaeologist, 1 statistician
     What success looks like: A decision tree that, for a given ambiguity, indicates whether finer measurement is likely to resolve it or not, and if so, which measurements to take.
     Main obstacle: The cost and complexity of the measurements, and the challenge of finding samples that represent different institutions.
  Neglectedness: Moderate; there is work on high-resolution methods, but not focused on institutional inference.
  Effect on Case U: Could tell us whether, for the grave assemblages, finer measurements (e.g., on tool marks or material sourcing) could break the disjunction, or if the ambiguity is inherent.
  Policy payoff: Curators would know when to commission new analyses and when further measurement is futile, saving resources and avoiding false certainty.
  Demotion condition: If we find that even the finest measurements cannot distinguish institution types in known cases, then demote.

  Rank 4: Correcting for survival asymmetry with preservation models
  Question: Can we build a quantitative model of the preservation filter that corrects for directional bias against ephemeral practices, and apply it to infer the prevalence of such practices in the past?
  Upstream of: Claims about the diversity of institutions, especially those that are perishable.
  Blocked by: None, but requires data on preservation rates for different materials and practices (from experimental archaeology or known cases).
  Tractability:
     Approach: Compile data on preservation rates for different materials and practices from experimental studies and known archaeological sequences. Build a probabilistic model that, given a set of practices, predicts the expected residue. Then invert it to infer practices from residues.
     Years: 4
     People: 1 preservation scientist, 1 modeler, 1 archaeologist
     What success looks like: A model that, for a given residue assemblage, can estimate the likely range of perishable practices that are missing, and thus adjust claims about institutional diversity.
     Main obstacle: The lack of systematic data on preservation rates and the complexity of the filter.
  Neglectedness: High; while preservation is studied, its systematic directional bias on institutional inference is not well modeled.
  Effect on Case U: Could help address whether the burial selection artifact (which is a form of survival asymmetry) is a plausible explanation by modeling what burial practices would leave the residue we see.
  Policy payoff: Officials can explicitly state the likely range of missing practices, avoiding the mistake of assuming that what is absent in the record was absent in the past.
  Demotion condition: If the model requires data that are not available and cannot be estimated, then demote.

  Rank 5: Preventing confidence laundering with uncertainty propagation protocols
  Question: Can we design and test a communication protocol that maintains and conveys the level of uncertainty at each step from specialist analysis to public claim?
  Upstream of: The final use of claims in public contexts.
  Blocked by: Some results from the above (because they generate quantified uncertainties).
  Tractability:
     Approach: Develop a set of guidelines and tools (e.g., visualizations, standardized language) for expressing uncertainty, then test them with mock scenarios (e.g., a curator writing a display) to see if the hedge is maintained.
     Years: 2
     People: 1 science communication expert, 1 designer, 1 archaeologist
     What success looks like: A protocol that, when used, reduces the loss of uncertainty in hand-offs by at least 50% in controlled tests.
     Main obstacle: Resistance from institutions that prefer definitive claims.
  Neglectedness: Moderate; there is work on uncertainty in science, but not specific to archaeology and institutional claims.
  Effect on Case U: Even if we cannot reduce the disjunction, we can ensure that any claim about Case U in public contexts carries the appropriate uncertainty.
  Policy payoff: Witnesses and curators have a standard way to express uncertainty, making it harder for claims to become inappropriately certain.
  Demotion condition: If testing shows that the protocol does not reduce confidence laundering in practice, then demote.

  Cut list:

  - Item: Large-scale automated classification of artefact images
    Why cut: It may produce more data but without addressing the core inference challenges (signature collapse might be inherent, not due to coarse classification). Also, it requires large-n which is not feasible under the budget constraint (which allows only hundreds of objects for new measurements).
    Condition to revive: If we first show that signature collapse is due to coarse vocabulary and that fine classification would break ties, then a targeted version (on selected objects) might be justified.

  - Item: Bigger comparative database of grave assemblages for analogue-matching
    Why cut: Analogue-matching assumes that similar residues imply similar causes, but without addressing phase averaging, survival asymmetry, or signature collapse, it risks amplifying existing biases. Also, building a big database is not method development per the constraint.
    Condition to revive: If we develop a method that accounts for the inference challenges (e.g., via the models from Rank 1) and then need a database for calibration, then a focused database for known cases might be useful.

  Resource split:

  - New measurement: 20% (for intensive measurements on hundreds of objects in Rank 3 and dating in Rank 2)
  - Formalisation and forward modelling: 30% (for Ranks 1, 2, and 4: building models)
  - Calibration with known outcomes: 25% (for Rank 1: testing models on known cases)
  - Translation into guidance: 25% (for Rank 5 and making outputs of other ranks usable)

  Justification: The bulk must go to building and testing the core inference machinery (formalisation and calibration) because without that, the guidance lacks foundation. New measurement is limited by budget, so only 20%. Translation is critical for output, so 25% to develop protocols and tools.

  Crux: "Whether forward modeling and calibration with known outcomes can produce validated models that are transferable to cases without independent evidence, such as Case U."

  Biggest risk: "That the models developed for known periods do not generalize to periods without documentary evidence, leaving Case U and similar pre-literate contexts no better resolved."

  Now, write the JSON.
