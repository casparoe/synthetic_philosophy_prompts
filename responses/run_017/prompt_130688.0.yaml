answer: |-
  Below is a taxonomy tree addressing whether it would be desirable to be maximally morally good. The tree branches on concrete, answerable questions (no prior philosophical expertise needed) and isolates the distinctions your group circled. Each leaf specifies a position (or notes if unnamed) and its "most awkward commitment"—the counterintuitive idea a holder must accept. The tree has **12 leaves**, fits on one page, and includes your requested elements.  

  ### **Taxonomy Tree: Would It Be Desirable to Be Maximally Morally Good?**  

  #### **Level 1: Is maximal moral goodness humanly attainable?**  
  *(Branches on whether "maximal" implies a realistic ideal or a limit we approach asymptotically)*  
  - **Yes (attainable maximum)**: Proceed to Level 2.  
  - **No (unattainable supremum)**:  
    - **Leaf 0: Unattainable Ideal**  
      - *Position*: Vacuous Question (nobody holds that being *maximal* is desirable, as it’s impossible).  
      - *Awkward commitment*: We must reframe the question to whether *incremental improvement* is desirable—and this reframed question inherits all the same problems below.  

  ---

  #### **Level 2 (for attainable maximum): Whose desirability are we evaluating?**  
  *(Branches on scope: individual vs. collective implications)*  
  - **A. Desirability for one individual** → Proceed to Level 3A.  
  - **B. Desirability if everyone were maximally good** → Proceed to Level 3B.  

  ---

  #### **Level 3A (one individual): What is the primary cost of saintliness?**  
  *(Branches on the nature of sacrifice for the individual)*  
  - **A1. Costs are external (scarcity of time/resources)**: Proceed to Level 4A.  
  - **A2. Costs are internal (conflict with non-moral attitudes)**: Proceed to Level 4A.  
  - **A3. Costs are social (saint undermines their own influence)**:  
    - **Leaf 1: Self-Undermining Saint**  
      - *Position*: Pragmatic Anti-Perfectionism (e.g., Susan Wolf’s "moral saints" critique).  
      - *Awkward commitment*: A saint’s extremeness makes them less effective at persuading others—so being maximally good *reduces* overall moral impact.  

  ---

  #### **Level 4A (one individual, costs are scarcity/attitudes): What shape is the moral theory?**  
  *(Branches on whether the theory demands maximization)*  
  - **Q: Does the moral theory require always choosing the *single best* action available?**  
    *(Concrete test: "In a case where you could donate 50% of your income to save lives, but 60% is possible, must you donate 60%?")*  
    - **Yes (maximizing, e.g., utilitarianism)**: Proceed to Level 5A.  
    - **No (non-maximizing, e.g., deontology/virtue ethics)**: Proceed to Level 5A.  

  ---

  #### **Level 5A (one individual, scarcity/attitudes + moral theory): Can non-moral goods coexist with saintliness under abundance?**  
  *(Branches on your point #1: scarcity vs. constitutive conflicts)*  
  - **Q: In a world with unlimited time/resources, could the saint pursue non-moral excellence (e.g., competitive sports, art) without moral compromise?**  
    - **Yes (scarcity conflict only)**:  
      - **Leaf 2 (maximizing): Sacrificial Saint**  
        - *Position*: Tragic Optimism (e.g., effective altruism).  
        - *Awkward commitment*: Saints must abandon non-moral goods (e.g., hobbies, relationships) due to finite resources—even though these goods are intrinsically valuable.  
      - **Leaf 3 (non-maximizing): Regrettable Saint**  
        - *Position*: Duty-Bound Moderate (unnamed; inspired by Kantian "imperfect duties").  
        - *Awkward commitment*: Saints *could* enjoy non-moral goods without failing duties—but in practice, they "overfulfill" and sacrifice anyway.  
    - **No (constitutive conflict)**:  
      - **Leaf 4 (maximizing): Self-Effacing Saint**  
        - *Position*: Williams/Sloterdijk Integrity Critique.  
        - *Awkward commitment*: Saints must abandon the *attitudes* enabling non-moral excellence (e.g., competitiveness, ambition)—which are inherently "selfish."  
      - **Leaf 5 (non-maximizing): Virtue-Diluted Saint**  
        - *Position*: Virtue Ethics Hybrid (e.g., modified Aristotelianism).  
        - *Awkward commitment*: Saints can pursue non-moral goods, but not *excel*—as true excellence requires "immoral" traits (e.g., pride) that saints lack.  

  ---

  #### **Level 3B (everyone maximally good): Is there a loss of non-moral excellence?**  
  *(Branches on division of labor and your point #4)*  
  - **B1. Yes—society lacks non-moral specialists**:  
    - **Leaf 6: Division of Moral Labor**  
      - *Position*: Pluralist Functionalism (e.g., Rawlsian "social division of labor").  
      - *Awkward commitment*: It is better for *some* people to be morally "mediocre" so they can excel as artists, scientists, etc.—even if each saint is individually fulfilled.  
  - **B2. No—no loss of excellence**: Proceed to Level 4B.  

  ---

  #### **Level 4B (everyone saints, no loss of excellence): What shape is the moral theory?**  
  *(Branches on whether grimness persists for non-maximizing theories)*  
  - **Q: Would saints in this society *still* face tough choices?**  
    *(Concrete test: "If a saint could save a life by missing their child’s birthday, must they do it?")*  
    - **Yes (maximizing)**:  
      - **Leaf 7: Grim Utilitopia**  
        - *Position*: Universal Sacrifice (unnamed; implied by Singer).  
        - *Awkward commitment*: Even with abundance, saints *choose* self-sacrifice (e.g., work 16-hour days)—making life joyless despite material comfort.  
    - **No (non-maximizing)**:  
      - **Leaf 8: Harmonious Society**  
        - *Position*: Virtue-Based Utopianism (e.g., Confucian ideal society).  
        - *Awkward commitment*: Saints can flourish non-morally—but only because the moral ideal is "watered down" (e.g., allows moderate self-interest).  

  ---

  ### **Empty Combinations & Notes**  
  - **Incoherent combinations (logically impossible)**:  
    - *Level 5A, non-maximizing + constitutive conflict* (Leaf 5): If non-moral excellence requires "immoral" attitudes, but the theory *allows* those attitudes, the saint isn’t "maximal" by maximizing standards. This is coherent only if "maximal" is redefined as "fulfilling all duties/virtues," not "doing the absolute best."  
  - **Unattractive/underexplored combinations**:  
    - *Level 3B, B2 + maximizing* (Leaf 7): "Grim Utilitopia" is rarely defended—most maximizers concede scarcity conflicts.  
    - *Level 3A, A3 + non-scarcity conflicts*: "Self-Undermining Saint" (Leaf 1) applies regardless of conflict type; no need to branch further.  
  - **Indistinguishable leaves**:  
    - *Leaf 0 (Unattainable Ideal)* and *Leaf 1 (Self-Undermining Saint)* address distinct problems (impossibility vs. effectiveness). The tree separates them.  
  - **Why scope matters**: Positions like *Leaf 6 (Division of Labor)* work only for "everyone," not "one individual." "Should I become a saint?" (individual) and "Should everyone?" (collective) yield different answers.  
  - **Why your point #3 (supremum) is partially pseudo-problem**: The supremum branch (Leaf 0) collapses into the same issues as the attainable branch when reframed as "incremental improvement." The tree isolates this.  
  - **Your point #4 handled**: Division of labor (Leaf 6) and self-undermining (Leaf 1) are distinct. The first is about collective value loss; the second is about individual effectiveness.  

  ### **How to Use This Handout**  
  - **In discussion**: Have participants answer the branching questions to "find their position," then debate the awkward commitments.  
  - **Key insight**: Grimness generalizes to *all* maximizing theories (Leaves 2,4,7) but softens for non-maximizing ones (Leaves 3,5,8). Constitutive conflicts (Leaves 4,5) are harder to resolve than scarcity ones (Leaves 2,3).  
  - **Missing pieces?** The tree excludes niche positions (e.g., "saints are undesirable because morality is fake") but covers all major debates from your group.
