                - B2: No

            Q4A: In a world of unlimited time and resources, could the saint engage in non-moral excellences without compromising their moral goodness? 
                - C1: Yes (scarcity conflict)
                - C2: No (constitutive conflict)

            Leaves:
            Leaf 1: B1, C1: "Costly Maximizing Saint"
                Awkward commitment: The saint must sacrifice non-moral goods that they could enjoy, even though in a better world they could have both.
            Leaf 2: B1, C2: "Constrained Maximizing Saint"
                Awkward commitment: The saint must abandon the attitudes necessary for non-moral excellences, so that even in abundance, those excellences are unattainable for them.
            Leaf 3: B2, C1: "Costly Non-Maximizing Saint"
                Awkward commitment: The saint might still face scarcity and give up non-moral goods, but the moral theory does not require them to do so (so they could choose to enjoy non-moral goods without moral failing, but in practice they don't? Or they do and then they are not maximal? This is awkward.)
            Leaf 4: B2, C2: "Constrained Non-Maximizing Saint"
                Awkward commitment: The moral theory allows non-moral pursuits, but the constitutive conflict means that the saint cannot excel in non-moral domains without compromising the moral ideal. However, the moral theory does not require maximal moral effort, so the saint can choose to be less than morally best to pursue non-moral goods. The commitment: the moral ideal is not as high as in maximizing theories.

    Level 3B (all individuals):
        Q2B: Would a society of saints lack non-moral excellences due to lack of specialization? 
            - D1: Yes (division of labor problem)
            - D2: No

        Leaf for D1: "Division of Labor"
            Position: It is undesirable for everyone to be a saint because society needs non-moral specialists.
            Awkward commitment: It is better for some individuals to be less than maximally good so that they can excel in non-moral domains.

        For D2 (no division of labor problem), we then ask about the costs to individuals scaled up:

            Q3B: Does the moral theory require always doing the morally best available action? 
                - E1: Yes
                - E2: No

            Q4B: In a world of unlimited resources, could the saints engage in non-moral excellences without compromising their moral goodness?
                - F1: Yes (scarcity)
                - F2: No (constitutive)

            Leaves:
            Leaf 5: E1, F1: "Costly Maximizing Society"
                Awkward commitment: In a society of saints, everyone is giving up non-moral goods due to scarcity of time, even though the society has material abundance.
            Leaf 6: E1, F2: "Constrained Maximizing Society"
                Awkward commitment: The saints collectively cannot achieve non-moral excellences because the attitudes required are incompatible with the moral ideal.
            Leaf 7: E2, F1: "Costly Non-Maximizing Society"
                Awkward commitment: The saints give up non-moral goods due to scarcity even though the moral theory does not require them to do so.
            Leaf 8: E2, F2: "Constrained Non-Maximizing Society"
                Awkward commitment: The saints could choose to pursue non-moral excellences (because the theory allows it) but the constitutive conflict means they cannot excel without compromising, so they either choose not to excel or they do and are not saints.

    Now, count leaves:
        Leaf 0: Unattainable Ideal
        Leaf A2: Self-Undermining Saint (one individual)
        Leaves 1-4: one individual, cost reason, with combinations (4 leaves)
        Leaf D1: Division of Labor (all individuals)
        Leaves 5-8: all individuals, no division of labor, cost reasons (4 leaves)

    Total: 1 + 1 + 4 + 1 + 4 = 11 leaves.

    But note: for the all individuals branch, we did not include an ineffectiveness reason. We could, but it might be redundant. The self-undermining might apply to individuals, not to the whole society. In a society of saints, they are all saints, so they might not need to promote morality to others. So we skip.

    Also, we have not addressed the possibility that in the all individuals branch, the division of labor might be the only concern, and then we have the cost leaves for when there is no division of labor problem.

    This tree meets the leaf count.

    Now, we need to check for empty combinations and pairs that are not separated.

    Empty combinations:

    - In the one individual branch, for a non-maximizing theory (B2) and scarcity conflict (C1): the position is that the saint gives up non-moral goods due to scarcity, but the moral theory does not require it. This might be a real position: the saint voluntarily chooses to work more, even though they are not required. Awkward commitment: they are being overly scrupulous.

    - In the all individuals branch, for non-maximizing and scarcity (Leaf 7: E2, F1): similarly, it's a society of people who are giving up non-moral goods even though their moral theory does not require it. Awkward: they are all workaholic volunteers.

    Also, for the unattainable ideal leaf, it is not empty.

    Now, are there any two leaves that the tree cannot separate? 

    The tree separates positions by: attainable vs not, scope, reason (costs vs effectiveness for individual), moral theory, and conflict type. For collective, by division of labor and then moral theory and conflict type.

    The only potential overlap is that the self-undermining saint leaf (under one individual) is not further split by moral theory or conflict type. So it is a catch-all for that reason. But that's intentional.

    Finally, the user wanted to know which combinations are empty. 

    Let's review the leaves:

    Leaf 0: Unattainable Ideal: not empty.

    One individual, effectiveness reason: Self-Undermining Saint: not empty.

    One individual, cost reason:
        Leaf 1: Maximizing, scarcity: e.g., a utilitarian who must work all day at a charity job, giving up the cello. (Susan Wolf's examples)
        Leaf 2: Maximizing, constitutive: e.g., a utilitarian who cannot be a competitive violinist because that requires selfishness. (Bernard Williams on integrity)
        Leaf 3: Non-maximizing, scarcity: e.g., a deontologist who has done all duties but still volunteers extra time, giving up the cello. Might be held by someone who thinks even non-required giving is part of saintliness.
        Leaf 4: Non-maximizing, constitutive: e.g., a virtue ethicist for whom the saint has all virtues, but the virtues are defined to include moderation, so they can have non-moral excellences? But if there is a constitutive conflict, then the virtues might rule out competitive attitudes. So the saint cannot be a top violinist. Awkward: the moral ideal is not as demanding as maximizing.

    For Leaf 4, it might be empty because if the moral theory is non-maximizing and there is a constitutive conflict, then the saint might not be required to give up the attitudes, but the conflict means they can't have both. So they might choose to be less than morally perfect to have the non-moral excellence. But then they are not a saint. So the leaf is for a position that says: even for a non-maximizing theory, the constitutive conflict means that being a saint requires giving up non-moral excellences. This might be held.

    For the collective branch:
        Leaf D1: Division of Labor: e.g., someone who thinks we need artists and scientists who are not saints.

        Leaf 5: Maximizing, scarcity for all: e.g., in a society of utilitarians, everyone is working to the bone and no one has time for the arts.
        Leaf 6: Maximizing, constitutive for all: e.g., a society of utilitarians could not produce great art because art requires attitudes incompatible with utilitarianism.
        Leaf 7: Non-maximizing, scarcity for all: e.g., a society of deontologists who all volunteer extra time and have no time for the arts, even though their duties are satisfied.
        Leaf 8: Non-maximizing, constitutive for all: e.g., a society of virtue ethicists who could in theory do art, but the virtues rule out the necessary attitudes, so they cannot produce great art.

    Leaf 7 might be rare: why would an entire society of non-maximizing saints all choose to overwork? But it's possible.

    Now, empty combinations:

    I don't see any that are incoherent. They might be unattractive, but they are positions someone might hold.

    Pairs that are not separated: 

    The tree separates all the leaves by different paths. The only thing is that the self-undermining saint is not further divided, but that's fine.

    Finally, names for the leaves? We can assign:

    Leaf 0: "Unattainable Ideal"
    For one individual, cost reason:
        Leaf 1: "Scarce-Resource Maximizing Saint"
        Leaf 2: "Constitutive-Attitude Maximizing Saint"
        Leaf 3: "Scarce-Resource Non-Maximizing Saint"
        Leaf 4: "Constitutive-Attitude Non-Maximizing Saint"
    One individual, effectiveness reason: "Self-Undermining Saint"
    All individuals, division of labor: "Specialization Defender"
    All individuals, no division of labor, cost reason:
        Leaf 5: "Scarce-Resource Maximizing Society"
        Leaf 6: "Constitutive-Attitude Maximizing Society"
        Leaf 7: "Scarce-Resource Non-Maximizing Society"
        Leaf 8: "Constitutive-Attitude Non-Maximizing Society"

    But these are descriptive. We can use more common names if available.

    Alternatively, we can use:

    Leaf 1: "Moral Overdemandingness (Scarcity Version)" for maximizing.
    Leaf 2: "Moral Overdemandingness (Constitutive Version)" for maximizing.
    Leaf 3: "Voluntary Self-Sacrifice" for non-maximizing scarcity.
    Leaf 4: "Virtue-Compatibility Problem" for non-maximizing constitutive.

