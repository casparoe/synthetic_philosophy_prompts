answer: |-
  Here are the eight objections you'll face, in predicted order of appearance, with verbatim phrasing and actionable replies. Weaknesses are flagged as [Soft Spot], and critical concessions marked with ⚠️.

  ---

  **1. (Hofstadter Skeptic)**  
  *"You're smuggling in souls through pattern-talk. A 'distributed I' is just dualism with extra steps."*  
  **Reply:** "Patterns aren't mystical—they're causal structures. A chess-playing program isn't 'in' the CPU; it's the logical shape of its state transitions. Hofstadter's 'I' is like that: the loop's topology, not a ghost. When Carol's habits fire in my brain *causally*—making me flinch at bad grammar like she would—that's her pattern running, not her essence."  
  [Soft Spot: Doesn't resolve whether "topology" is a sneaky substance. Concede upfront: "If you reject *all* self-models, we disagree at the root."]

  **2. (ML Interpretability Person)**  
  *"So if we train a GPT on your emails, it instantiates more of 'you' than your spouse does. That's ridiculous."*  
  **Reply:** "Ah, but *does* it? The LLM has inert traces—correlations frozen in weights. Your spouse has a *live pattern*: if you're sad, they react *as you would*, dynamically. The LLM just outputs tokens. Key difference: one can *engage* the strange loop (e.g., argue with you); the other can't. Fidelity isn't about data volume; it's about real-time causal responsiveness."  
  ⚠️ **THIS REPLY MUST LAND OR YOU LOSE THE ROOM.**  
  [Soft Spot: "Real-time" is arbitrary. Admit: "Yes, there's a continuum—but we draw lines for 'live' vs. 'dead' patterns everywhere (e.g., coma patients)."]

  **3. (Expected-Utility Theorist)**  
  *"Measure-weighted welfare? Just normalize it and you've got subjective probability. Why reinvent the wheel?"*  
  **Reply:** "Because normalization destroys information! If I split into two copies at 60% fidelity each, my total measure is 1.2. Normalizing to 1.0 would imply I should care *less* about each successor than if I were unique. But why? I have *more* instantiations now. Probability forces a zero-sum mindset; measure captures abundance."  
  [Soft Spot: If successors are mutually exclusive (they rarely are), probability applies. Concede: "For exclusive branches, yes—but most survival isn't a horse race."]

  **4. (Many-Worlds Enthusiast)**  
  *"Isn't this just quantum measure without the amplitudes? Why steal the math but ignore the physics?"*  
  **Reply:** "Quantum measure is one *type* of measure—I'm talking genus, not species. My 'degrees' work for classical branching too: ten backup tapes of you aren't quantum, but their total fidelity isn't capped at 1. Physics gives a *particular* measure; I need a *general* one for patterns."  
  [Soft Spot: Overlap with quantum debates distracts. Deflect: "Think of this as applied topology, not physics."]

  **5. (Retired Philosopher)**  
  *"Parfit already dissolved the self. You've added numbers, but it's still reductionism—or worse, you're sneaking in a further fact."*  
  **Reply:** "Parfit said 'what matters' is psychological continuity. I agree! But continuity isn't binary—it's scalar and distributable. And no further fact: the 'degree' isn't a soul-shard; it's how many of *your* dispositional triggers fire in another substrate. It's still just causality all the way down."  
  [Soft Spot: "Dispositional triggers" may sound fact-like. Double down: "It's no more 'further' than temperature is beyond particle motion."]

  **6. (Meditator)**  
  *"Why assume there's an 'I' to distribute? The self is an illusion—you're reifying it with your patterns."*  
  **Reply:** "I agree the *naive* self is illusory! But even illusions have structure. A mirage has a location; a self-model has a computational signature. When we say 'I', we point to that signature. Distributing *that* isn't reifying a soul—it's tracking where the mirage-projector's blueprints are running."  
  [Soft Spot: Risks conflating phenomenology with metaphysics. Grant: "If your view is 'no projector at all', mine doesn't touch that."]

  **7. (Hidden Objection You Feared)**  
  *"If my hard drive is 3% me, do I have to mourn formatting it? This devalues real people."*  
  **Reply:** "No—because the drive holds *inert* data, not a live pattern. Formatting it is like burning a photo: you lose information, but no one *acts* like Carol anymore. Mourning applies to losing *active* instantiations—where the loop *stops running*. The number isn't sacred; it's diagnostic."  
  [Soft Spot: "Active" is fuzzy. Use humor: "If you weep for your formatted disk, maybe see a therapist?"]

  **8. (Strawman You Invited)**  
  *"This sounds like spiritual oneness—we're all fragments of a universal mind!"*  
  **Defuse Without Condescension:** "Nope! This isn't cosmic unity—it's engineering. Your 'I' is as sharable as a PDF: limited, messy, and only 'running' where hardware executes it causally. No mysticism, just distributed systems."  

  ---

  **The Objection Most Likely to Decide the Room Against You:**  
  The **ML objection** (#2). If the audience thinks you're saying an LLM *is* Grandpa, you lose. Hammer the live/inert distinction with concrete examples:  
  *"Your childhood teddy bear has traces of you—but it won't *debate* you. Your friend will."*

  ---

  \answer{LLM as more you than family}
