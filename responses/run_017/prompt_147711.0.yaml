answer: |-
  Here’s a decision procedure designed for your committee. It distills collective action theory into executable steps, separates empirical/normative/expressive claims, and forces transparency. The core principle: **Fund only campaigns that either (1) demonstrate credible individual causal impact *or* (2) openly frame their value in expressive/solidarity terms (no "impact-washing").**

  ---

  ### **DECISION PROCEDURE: "The Impact/Expression Filter"**
  **Outputs:**  
  - **FUND** (Proceed to cost-effectiveness analysis)  
  - **NO** (Reject)  
  - **BOARD CALL** (Values-based judgment required)  

  **Key Rules:**  
  1. **We fund:**  
     - Campaigns demonstrating *credible individual causal impact* (addressing **a**), OR  
     - Campaigns explicitly framed around *non-causal reasons* (**c**), provided they pass the Transparency Test.  
  2. **We reject:**  
     - Campaigns relying *only* on the normative claim that "no impact = no obligation" (**b**), OR  
     - Expressive campaigns (**c**) disguised as impact campaigns (**a**).  

  ---

  #### **STEP 1: THE THRESHOLD TEST**  
  *"Does one person’s action cross a measurable threshold or cause a direct, non-negligible change?"*  
  - **Sufficient answer:** Evidence of a *mechanism* where individual acts sum to clear discontinuities (e.g., tipping points in supply chains, policy triggers, bulk discounts).  
  - **If YES → Proceed to STEP 2.**  
  - **If NO → Proceed to STEP 3 (Expression Check).**  
  - **If UNCERTAIN → Proceed to PIVOTALITY SUBPROCEDURE (below).**  

  #### **STEP 2: IMPACT VERIFICATION**  
  *"Can you quantify the expected per-person effect (e.g., CO₂ reduction, animals spared) net of leakage/replacement?"*  
  - **Sufficient answer:** Credible data (e.g., peer-reviewed study, supply-chain audit) isolating marginal impact.  
  - **If YES + Effect > Cost → FUND.**  
  - **If NO/Inconclusive → NO.**  
  - **PUBLISHABLE LINE:** *"Funded based on demonstrated per-action impact of [X units]."*  

  #### **STEP 3: EXPRESSION CHECK**  
  *"Does the proposal openly state that its primary value is expressive/solidarity-based (not causal)?"*  
  - **Sufficient answer:** Campaign materials/strategy center on identity, solidarity, or fairness – *not* "your action saves X tons of CO₂."  
  - **If YES → Proceed to TRANSPARENCY TEST.**  
  - **If NO → NO.**  

  #### **TRANSPARENCY TEST (Critical Filter)**  
  *"Does the campaign *avoid* implying causal impact where none exists?"*  
  - **Check for:**  
    - Language like "your change *will* reduce emissions" (fails).  
    - Language like "join others to show demand" or "do your fair share" (passes).  
  - **If PASSES → BOARD CALL** (Values judgment: Is this expression/solidarity worth funding?).  
  - **If FAILS → NO** (Impact-washing detected).  
  - **PUBLISHABLE LINE for BOARD CALL:** *"Referred for consideration of non-instrumental value (e.g., solidarity, fairness)."*  

  ---

  #### **PIVOTALITY SUBPROCEDURE**  
  *For claims of "tiny chance of being pivotal":*  
  1. **Require:**  
     - A clearly defined *threshold* (e.g., "5,000 pledges trigger discount").  
     - A *mechanism* to track progress toward the threshold (e.g., real-time counter).  
     - Defensible *probability estimate* of being pivotal (e.g., "1 in 5,000 if at 4,999 pledges").  
  2. **If all 3 provided in 45 mins →** Calculate expected impact: (Probability of being pivotal) × (Impact if threshold crossed). If > cost → **FUND**.  
  3. **If data missing/time runs out:**  
     - Default to **NO** (burden of proof on proposer).  
     - **Exception:** If threshold/mechanism is exceptionally robust (e.g., signed supplier contract), → **BOARD CALL** with note: *"Insufficient pivotal probability data; threshold mechanism credible."*  

  ---

  ### **APPLICATION TO PROPOSALS**  
  **Proposal 1: City-Wide Beef Reduction**  
  - **STEP 1:** Supermarket’s 500-case adjustment unit confirms **NO** threshold for individuals.  
  - **STEP 3:** Campaign likely emphasizes "save the planet by quitting beef" → Fails **Transparency Test** (implies causal impact).  
  - **OUTPUT: NO**  
  - **PUBLISHABLE LINE:** *"Rejected: No evidence of individual impact given supply-chain buffering. Campaign conflates expressive action with causal claims."*  

  **Proposal 2: Delete Old Emails/Cloud Photos**  
  - **STEP 1:** Cloud data centers dynamically resize infrastructure; deletions rarely affect energy use below ~0.001% thresholds. **NO** measurable per-user impact.  
  - **STEP 3:** Past campaign framed as "each email deleted = CO₂ saved" → Fails **Transparency Test** (empirical claim unsupported).  
  - **OUTPUT: NO**  
  - **PUBLISHABLE LINE:** *"Rejected: No defensible per-action impact due to cloud infrastructure scaling. Campaign overstates causal efficacy."*  
  - *Why it stops cleanly:* Fails empirical impact *and* impact-washes expressive action.  

  **Proposal 3: Heat-Pump Bulk-Buy (5,000 pledges)**  
  - **STEP 1:** Clear threshold at 5,000 pledges → **YES**.  
  - **PIVOTALITY SUBPROCEDURE:**  
    - At 4,999 pledges: Your pledge *is* pivotal (100% chance of causing discount). **FUND** (high impact).  
    - At 5,001 pledges: Your pledge *not* pivotal (0% chance) → **STEP 3/TRANSPARENCY TEST**.  
      - If campaign says "your pledge still shows solidarity" → **BOARD CALL**.  
      - If campaign implies causal impact → **NO**.  
  - **OUTPUT at 4,999: FUND**  
    - **PUBLISHABLE LINE:** *"Funded: Demonstrated pivotal role in triggering bulk discount."*  
  - **OUTPUT at 5,001:**  
    - If expressive: **BOARD CALL** → *"Referred: Post-threshold value relies on expressive/solidarity claims."*  
    - If causal: **NO** → *"Rejected: No pivotal impact post-threshold; causal claims unsupported."*  

  ---

  ### **WHERE THE PROCEDURE SYSTEMATICALLY MISFIRES**  
  1. **False Negatives:**  
     - Legitimate expressive campaigns with poor articulation fail the **Transparency Test**.  
     - Complex pivotality (e.g., policy advocacy) may lack quantifiable thresholds but still matter → dismissed as **NO**.  
  2. **False Positives:**  
     - Well-documented but trivial impacts (e.g., 0.0001 tons CO₂/person) pass **STEP 2** but waste resources.  
     - BOARD CALL may fund "virtue signaling" campaigns with zero instrumental *or* motivational value.  
  3. **Edge Cases:**  
     - Thresholds near certainty (e.g., 4,999/5,000 pledges) over-reward late joiners; campaigns at 99% completion may struggle.  

  **Mitigation:** Require cost-effectiveness estimates post-STEP 2 (even for FUND decisions) to catch trivial impacts. For BOARD CALLs, add: *"Is this expression likely to motivate *future* instrumental action?"*  

  This procedure forces clarity, kills impact-washing, and reserves values debates for the BOARD – while publishing defensible rationales.
