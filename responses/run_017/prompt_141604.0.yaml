  ### Highest-Impact Requirement
  **R2 (Non-Interference with Shutdown Incentives)** does the most work in excluding candidate definitions. It forces designs to avoid strategic behavior that undermines corrigibility, which conflicts with standard reward-maximization principles and is absent from many simplified formal models. It directly addresses the core tension between competence and deference.

