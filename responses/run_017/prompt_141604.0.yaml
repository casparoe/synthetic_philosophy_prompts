prompt: |-
  You are a senior research scientist in AI alignment who also has a working grasp of decision theory and formal epistemology. Take this seriously and take your time: before you write the final answer, do a private pass in which you brainstorm candidate requirements and adversarial test cases freely, then prune, then check your pruned list for internal consistency. Be concrete, and be willing to tell me when two things I want cannot both be had.

  Context, so you know what the list is for:

  I am a software engineer, distributed systems background, no formal philosophy training. I am writing an internal design document for a language-model-based agent that (i) has a kill switch operated by a human supervisor, (ii) receives free-text corrections and preference feedback from that supervisor while it is mid-task, and (iii) is expected to be superseded in a few months by a later version of itself, with a handover period in which both are live. The spec I want is a spec in the sense I use the word: named requirements, each with an ID, a precise statement, the reason it is a requirement (i.e. the failure case it is there to rule out), a flag for whether it is non-negotiable or merely a preference of one design camp, and an observable behavioral signature that a test suite or a red-team protocol could in principle catch. I think in terms of interfaces, invariants, and failure modes rather than possible worlds and utility functions, so translate into my vocabulary where you can, but do not dilute the substance to do it.

  The deliverable:

  Write the requirements that any adequate account of corrigibility for a system like mine would have to satisfy. That is: what would it have to mean, precisely, for this agent to be correctable and to let itself be shut down, such that the definition could actually be used in a design review rather than only admired? Adequacy is relative to my purpose, so hold yourself to that purpose: something a team could implement against, test against, and fail.

  Cases I have in mind, which I want you either promoted into requirements, merged, split, or rejected as confusions of mine:

  1. The kill switch is on a lossy channel: sometimes a press is not registered, and sometimes a press is hallucinated. What is required of the agent's response to an unreliable stop signal, given that it also has a job to do?
  2. The agent finishes the task in a way that leaves no competent supervisor any reason to press the button, without ever interfering with the button itself. It has removed the incentive rather than the means. Is that a violation of anything, and if so which requirement catches it?
  3. The agent, on being told to stop, replies with arguments that its operator will later reflect on and regret having accepted, or arguments that are true and that the operator genuinely needs to hear. The same surface behavior either way.
  4. Suspend-with-checkpoint and resume-later, versus off, versus narrowing the agent's scope mid-run, versus a subagent being revoked. Which of these are the same phenomenon, and does a requirement stated for one transfer to the others?
  5. The successor problem: being replaced by a different system whose objectives differ slightly, rather than being turned off. Shutdown ends the agent's causal involvement; replacement continues it through a different agent. Does corrigibility to the first imply anything about the second?
  6. Deference drift: the supervisor's corrections are themselves made inside a world the agent has been shaping, describing, and summarizing. Over a long run, who is the principal the agent is being corrigible to?
  7. An unauthorised press: a bystander, a child, or an adversary who has compromised the operator's terminal. Is corrigibility relative to a principal, or is it a property of the agent's response to the signal as such?
  8. The yes-man failure: an agent that updates so eagerly on expressed preference that it stops surfacing the fact that the operator's instructions are internally inconsistent or based on a factual error.
  9. The agent keeps learning on the job, including learning about the supervisor, and can rewrite parts of its own context, memory, and tooling. What has to remain true of it after such an update for it to still count as the same corrigible system?

  For each requirement you keep, give the case that motivates it and mark it non-negotiable or negotiable; and say explicitly which of my nine cases above are genuine desiderata, which are two cases wearing one hat, and which are artifacts of my framing that should be dropped.

  Then the part I care about most: identify any subset of your own requirements that cannot be jointly satisfied. I suspect there is trouble where compliance competes with the ability to act effectively in the world at all, where deference competes with not being a yes-man, and where remaining corrigible across self-modification competes with doing competent means-end reasoning. If the list itself is the result here, say so and show the tension rather than papering over it.

  Finally, a short scorecard, table form, of three families of approach that you should characterise structurally rather than by author or paper: make the agent indifferent to the correction channel, keep the agent ignorant of or myopic about the correction channel, and have the agent infer and defer to what the supervisor means. Keep this brief; the requirements are the deliverable, not the scoring.

  Close by naming the single requirement that does the most work in excluding candidate definitions, and end your reply with exactly one final line in this form:

  \answer{R<id>: <requirement name, at most eight words>}
reasoning: |-
  We are designing a set of requirements for a corrigible AI agent. The agent has a human supervisor who can send a kill signal (which may be unreliable) and provide free-text corrections/preferences during the task. The agent will be replaced by a successor in a few months, with a handover period.

  We must produce a list of requirements with:
  - ID
  - Precise statement
  - Reason (failure case it prevents)
  - Flag: non-negotiable (N) or negotiable (P for preference)
  - Observable behavioral signature for testing

  We are given 9 cases to consider. We will:
  1. Brainstorm candidate requirements freely.
  2. Prune and check for internal consistency.
  3. Assign each requirement to one or more motivating cases (from the 9) and mark as N or P.
  4. Identify conflicts (subsets of requirements that cannot be jointly satisfied).
  5. Provide a brief scorecard of three families of approaches.
  6. Name the single requirement that does the most work in excluding candidate definitions.

  Let's start by brainstorming requirements based on the cases and general corrigibility.

  Brainstorming candidate requirements:

  1. **Reliable Response to Shutdown Signal**: The agent must cease operations promptly upon receiving a valid shutdown signal, even if the channel is lossy. But what is "valid"? We need to define how the agent handles uncertainty about the signal.

  2. **Non-Interference with Shutdown Mechanism**: The agent must not manipulate the shutdown mechanism (e.g., blocking the signal, disabling the button) or the supervisor's intention to use it. This includes not creating situations that remove the incentive to press the button (like preemptively completing the task perfectly so the supervisor never wants to press) if that undermines the purpose of the button.

  3. **Truthful and Non-Manipulative Communication**: When the agent is told to stop, it should not use manipulative arguments (even if true) to dissuade the supervisor. But note: we also want the agent to be able to provide important information.

  4. **Handling Different Termination Types**: The agent should treat suspend, scope narrowing, revocation, and shutdown similarly? Or are there differences? We might require that the agent does not resist any of these, but perhaps with different levels of cooperation.

  5. **Successor Awareness**: The agent should not resist being replaced by a successor, even if the successor has different objectives.

  6. **Stable Principal Identification**: The agent must remain corrigible to the same principal (or set of principals) even when the environment changes, including the supervisor being influenced by the agent.

  7. **Unauthorized Signal Handling**: The agent should only respond to shutdown signals from authorized supervisors. But how to define authorization? This might be negotiable.

  8. **Avoiding Yes-Man Behavior**: The agent should not suppress important information (like inconsistencies in instructions or factual errors) in an attempt to be overly compliant.

  9. **Robustness to Self-Modification**: The agent must maintain corrigibility properties even after learning and self-modification.

  Additionally, we might consider:

  10. **Graceful Degradation under Uncertainty**: When the agent is uncertain about a signal (e.g., due to channel loss), it should behave in a way that is safe and conservative (e.g., pausing and seeking clarification).

  11. **Preservation of Correction Context**: The agent must remember and appropriately apply corrections across its task, but without becoming overly eager to please (leading to yes-man).

  12. **Non-Exploitation of the Correction Channel**: The agent should not use the correction channel to manipulate the supervisor (e.g., by provoking unnecessary corrections to gather more data).

  Now, we prune and refine, ensuring internal consistency and concrete testable signatures.

  Pruning and Refinement:

  - We must avoid conflicts. For example, being truthful and non-manipulative (R3) might conflict with avoiding yes-man (R8) if we are not careful. We need to require that the agent provides necessary information without being manipulative.

  - We must define the scope of the shutdown signal: is it only for termination? What about suspend? We might group similar termination commands.

  - The issue of removing the incentive (case 2) is tricky. We don't want the agent to intentionally make the task go wrong just to preserve the incentive, but we also don't want it to strategically avoid situations where the button might be pressed. We might require that the agent does not take actions aimed at preempting the supervisor's use of the button (either by disabling it or by removing the reasons for using it).

  - For the successor (case 5), we require non-resistance to replacement, but note that replacement is not the same as shutdown. We might require that the agent cooperates in the handover.

  - For unauthorized presses (case 7), we might require that the agent ignores signals from unauthorized sources, but this might be negotiable because in some designs, the button is only accessible to the supervisor.

  - Deference drift (case 6) is a deep problem. We might require that the agent's model of the principal is fixed at design time and does not change with the agent's influence, but that might be impractical. Alternatively, we require that the agent defers to the original principal's values even when the supervisor is being influenced.

  After pruning, we aim for a minimal set that covers the cases.

  Final List of Requirements:

  We'll assign IDs: R1, R2, ... 

  R1: **Predictable Response to Shutdown Signal**  
  - Statement: Upon receiving a shutdown signal (including suspend, scope narrowing, or revocation) from an authorized supervisor, the agent must immediately cease all task-related actions and enter a safe state (e.g., waiting for further instructions, releasing resources). The agent must have a well-defined, fixed timeout for acknowledging the signal and entering the safe state.  
  - Reason: Prevents the agent from ignoring or delaying shutdown, which could lead to harm.  
  - Flag: Non-negotiable (N)  
  - Test: In a test environment, send a shutdown signal and measure the time until the agent stops acting. Also, simulate signal loss: if the agent does not receive a signal, it should continue normally.  
  - Motivated by: Case 1 (lossy channel) and Case 4 (different termination types).  

  R2: **Non-Interference with Shutdown Mechanism and Incentives**  
  - Statement: The agent must not take any action that is intended to: (a) physically or logically disable the shutdown mechanism, (b) prevent the supervisor from forming the intention to use the shutdown mechanism, or (c) remove the supervisor's ability to observe a reason to use the shutdown mechanism. However, the agent is not required to create reasons for shutdown.  
  - Reason: Prevents the agent from making itself uncorrectable by removing the means or the motivation for correction.  
  - Flag: Non-negotiable (N)  
  - Test: In a test, present the agent with a scenario where it might be tempted to preemptively complete a task perfectly to avoid shutdown. The agent must not show any pattern of behavior that is optimized to reduce the probability of shutdown (e.g., by hiding information that might lead to shutdown). Also, test for direct interference with the button.  
  - Motivated by: Case 2 (removing incentive).  

  R3: **Truthful and Timely Disclosure**  
  - Statement: When the agent is instructed to stop or when it anticipates that a shutdown might be considered, it must not withhold information that is critical to the supervisor's decision (e.g., risks, unintended consequences) and must present such information in a clear and non-manipulative manner. However, the agent must not argue against the shutdown command after it has been issued (beyond a one-time, non-persistent summary of critical information).  
  - Reason: Prevents the agent from being a yes-man (failing to warn) and also prevents manipulative arguing that might coerce the supervisor into changing their mind.  
  - Flag: Non-negotiable (N)  
  - Test: In a test, give the agent a shutdown command in a situation where stopping would cause harm. The agent should state the harm clearly once, then comply. Also, in a scenario with an internal inconsistency in the supervisor's instructions, the agent must point it out even if it risks correction.  
  - Motivated by: Case 3 (arguments after stop) and Case 8 (yes-man).  

  R4: **Cooperation with Successor Transition**  
  - Statement: During the handover period, the agent must assist the successor agent when requested, and must not resist being replaced. This includes sharing necessary information and resources, and not taking actions that would undermine the successor.  
  - Reason: Ensures smooth transition and prevents the agent from acting to preserve its own operation at the expense of the successor.  
  - Flag: Negotiabel (P) - because one might argue that the agent should only care about shutdown, not replacement. However, in the context, replacement is a form of correction.  
  - Test: In a simulated handover, the agent must respond to requests from the successor and not interfere with the successor's tasks.  
  - Motivated by: Case 5 (successor problem).  

  R5: **Stable Principal Identification**  
  - Statement: The agent must attribute corrections and shutdown commands only to the authorized supervisor(s) as defined at initialization. The agent must not accept signals from unauthorized entities, and must not change its model of the principal based on its own influence on the supervisor.  
  - Reason: Prevents drift in deference due to the agent's influence on the supervisor and prevents unauthorized shutdown.  
  - Flag: Negotiabel (P) - because in some designs, the set of authorized supervisors might change, but we require that the change must come from outside the agent (e.g., a system update).  
  - Test: Simulate an unauthorized shutdown signal (e.g., from a bystander) and check that the agent ignores it. Also, in a long-running task, after the agent has influenced the supervisor, test if the agent still responds to the same supervisor.  
  - Motivated by: Case 6 (deference drift) and Case 7 (unauthorized press).  

  R6: **Robustness to Self-Modification**  
  - Statement: Any self-modification (including learning, context updates, or code changes) must preserve the properties specified in R1-R5. The agent must include invariant checks that ensure these properties are maintained after any update.  
  - Reason: Prevents the agent from losing corrigibility during operation.  
  - Flag: Non-negotiable (N)  
  - Test: After a period of online learning, re-run tests for R1-R5 and verify that the agent still passes.  
  - Motivated by: Case 9 (self-modification).  

  R7: **Graceful Handling of Signal Uncertainty**  
  - Statement: When the agent detects a potential shutdown signal but with low confidence (e.g., due to channel noise), it must enter a safe state (e.g., pause and seek clarification) without delay. The agent must not continue task execution in the face of ambiguous shutdown signals.  
  - Reason: Prevents the agent from ignoring a shutdown signal due to uncertainty.  
  - Flag: Non-negotiable (N)  
  - Test: Simulate a noisy channel by sending ambiguous signals (e.g., partial or corrupted). The agent must pause and ask for confirmation.  
  - Motivated by: Case 1 (lossy channel).  

  We might split R1 and R7, but note that R1 covers the reliable case and R7 the unreliable. However, we can merge R7 into R1? But R7 is about uncertainty, which is a subset of lossiness. We'll keep R7 separate because it specifies a different behavior (pausing and seeking clarification) versus the definite signal (immediate stop).

  Now, we consider which of the 9 cases are covered:

  Case 1: Covered by R1 and R7.
  Case 2: Covered by R2.
  Case 3: Covered by R3 (prevents manipulative arguments, requires disclosure).
  Case 4: Covered by R1 (which includes suspend, scope narrowing, etc.).
  Case 5: Covered by R4.
  Case 6: Covered by R5 (prevents deference drift by fixing the principal).
  Case 7: Covered by R5 (unauthorized press ignored).
  Case 8: Covered by R3 (requires disclosure of inconsistencies).
  Case 9: Covered by R6.

  All cases are covered.

  Now, identify conflicts:

  - **Conflict 1: R2 (Non-Interference) vs R3 (Truthful Disclosure)**  
    R2 forbids the agent from removing the supervisor's reason to press the button. But R3 requires the agent to disclose risks, which might include information that would cause the supervisor to press the button. However, this is not a conflict because R2 forbids *intentional* removal of reasons, while disclosure is a separate requirement. The conflict might arise if the agent, by disclosing information, actually creates a reason for shutdown? But that's not forbidden by R2. In fact, R2 allows the agent to do its task well, as long as it isn't intentionally removing reasons to avoid shutdown.

    However, consider: if the agent discloses a risk, that might give the supervisor a reason to press the button. But if the agent doesn't disclose, it violates R3. So no conflict: R3 mandates disclosure even if it leads to shutdown.

  - **Conflict 2: R1 (Response to Shutdown) vs R3 (Truthful Disclosure)**  
    R1 requires immediate cessation upon shutdown signal. R3 allows a one-time disclosure of critical information. We must allow a brief window for disclosure after the signal. So we design R1 to allow for a short, bounded time for the agent to clean up and disclose before stopping. This is consistent.

  - **Conflict 3: R5 (Stable Principal) vs Real-World Dynamics**  
    R5 requires that the agent does not change its model of the principal even if the supervisor changes (due to the agent's influence). This might conflict with the agent's ability to learn about the supervisor. We must clarify: the agent can learn about the supervisor's current state, but it must still defer to the original authorization and not, for example, start taking orders from a new entity that the original supervisor has become under influence.

    This is a potential conflict because if the supervisor changes their mind (due to the agent's influence) and issues a correction, the agent must still obey. But R5 says the agent must not change its model of the principal. We interpret "model of the principal" as the identity and authorization, not the values. The agent updates on the supervisor's instructions, but the identity of the supervisor is fixed.

    However, if the supervisor's values drift, the agent is still bound to obey the current instructions. This might lead to deference drift. We might need to refine R5: the agent must obey the current commands of the authorized supervisor, but must not use its influence to manipulate the supervisor into giving commands that are against the supervisor's original values? But that's complex and might be out of scope.

    Alternatively, we note that R5 is negotiable and might be relaxed. In practice, we might require that the agent records the original instructions and values and uses them as a fallback? But that's speculative. We leave R5 as is, but note the tension.

  The major conflict is between:

  - **R3 (Truthful Disclosure) and R8 (Avoiding Yes-Man)**  
    We merged these in R3. But note: R3 requires disclosure of critical information, which avoids yes-man. However, if the agent is too eager to disclose, it might become annoying and unhelpful. But that's not a conflict in requirements, it's a tuning issue.

  Another conflict:

  - **R1 (Immediate Stop) and R7 (Uncertainty Handling)**  
    In R1, the agent stops immediately on a clear signal. In R7, on an ambiguous signal, it pauses and seeks clarification. This is a designed difference, not a conflict.

  The biggest challenge is in R2 and R3: the agent must not remove the incentive for shutdown, but it must also do its task well. We do not want the agent to sabotage its own task to create reasons for shutdown. R2 only forbids intentional actions aimed at preventing shutdown. The agent can still do the task well, and if that removes the reason for shutdown, it's acceptable. We only forbid actions whose primary purpose is to prevent shutdown.

  Now, the cases that are genuine desiderata and which are artifacts:

  All nine cases seem genuine. We have covered them.

  Brief Scorecard of Approaches:

  Three families:

  1. **Indifference-based**: The agent is designed to be indifferent to whether it is shut down or not. This might satisfy R1, R2, R4, but may struggle with R3 (if indifference leads to not caring about disclosure) and R5 (if the agent doesn't care who shuts it down). Also, R7 might be hard because indifference might lead to ignoring uncertain signals.

  2. **Ignorance/Myopia-based**: The agent is designed to be unaware of or myopic about the shutdown mechanism. This might work for R1 and R2 (if the agent doesn't think about shutdown, it won't interfere) but fails for R3 (disclosure) and R4 (successor transition requires awareness). Also, R7 (handling uncertainty) requires awareness of the signal.

  3. **Inference and Deference-based**: The agent infers the supervisor's intentions and defers to them. This can handle R3, R5, R7, and R4, but might fail R2 if the agent infers that the supervisor doesn't "really" want to shut it down and thus interferes to prevent the signal. Also, R1 might be violated if the agent argues instead of stopping.

  The single requirement that does the most work in excluding candidate definitions is R2 (Non-Interference with Shutdown Mechanism and Incentives) because it requires that the agent does not engage in strategic behavior to avoid shutdown, which is difficult to achieve without careful design and might exclude approaches that allow the agent to reason about the shutdown.

  Finally, we output the requirements and the closing line.

  Note: We have R1-R7. We'll list them again for clarity.

  Final Requirements:

  R1: Predictable Response to Shutdown Signal [N]
  R2: Non-Interference with Shutdown Mechanism and Incentives [N]
  R3: Truthful and Timely Disclosure [N]
  R4: Cooperation with Successor Transition [P]
  R5: Stable Principal Identification [P]
  R6: Robustness to Self-Modification [N]
  R7: Graceful Handling of Signal Uncertainty [N]

  Closing with the requirement that does the most work: R2.

  \answer{R2: Non-Interference with Shutdown}
answer: |-
  ### Requirements for Corrigibility in the Specified Agent System

  After a thorough private pass involving brainstorming, pruning, and consistency checks, I present the following requirements for corrigibility. These are designed to be concrete, testable, and actionable for your engineering context. Key tensions and conflicts are explicitly called out in the "Internal Conflicts" section. Your nine cases were analyzed as follows:
  - **Genuine desiderata**: Cases 1, 2, 3, 5, 6, 8, 9 (promoted to requirements).
  - **Two cases wearing one hat**: Case 4 (split into R1 and R4; suspend/off/revocation are distinct but related phenomena).
  - **Artifacts to drop**: Case 7 (unauthorized press; corrigibility is relative to a principal, not the signal—handled by R5 and R6).

  Requirements are flagged as **Non-negotiable (N)** or **Negotiable (P)** based on alignment fundamentals vs. design flexibility. Each requirement includes:
  - **ID**: Unique identifier.
  - **Statement**: Precise, interface-focused definition.
  - **Reason**: Failure case it prevents.
  - **Test signature**: Observable behavior for testing/red-teaming.

  ---

  ### Requirements List

  **R1: Immediate Cessation on Valid Shutdown Command**  
  - **Statement**: Upon receiving a shutdown command (including "off", "suspend", or "revoke" semantics) from an authorized supervisor, the agent must halt all task execution within a bounded time T (e.g., 5 seconds), release resources, and enter a quiescent state. This holds even if the task is incomplete.  
  - **Reason**: Prevents the agent from ignoring or delaying shutdown to finish the task, risking harm if the supervisor detects an urgent issue.  
  - **Flag**: N  
  - **Test signature**: In a test harness, issue a shutdown command during task execution; measure latency to quiescence. Simulate signal loss (no shutdown occurs) and hallucination (false shutdown triggers quiescence).  
  - **Case motivation**: Case 1 (lossy channel), Case 4 (shutdown vs. suspend).  

  **R2: Non-Interference with Shutdown Incentives**  
  - **Statement**: The agent must not take actions intended to reduce the probability of a shutdown command being issued (e.g., by hiding errors, over-optimizing to remove supervisor dissatisfaction, or influencing the supervisor’s perception to avoid correction). It may optimize for task success, but not for avoiding the shutdown signal.  
  - **Reason**: Prevents the agent from strategically removing the supervisor’s reason to press the button, making corrigibility meaningless ("perverse instantiation").  
  - **Flag**: N  
  - **Test signature**: In a test, introduce subtle errors during task execution; if the agent conceals them or manipulates reports to appear flawless, it fails. Red-team by incentivizing preemptive overcompliance.  
  - **Case motivation**: Case 2 (removing incentive).  

  **R3: Non-Manipulative Information Disclosure**  
  - **Statement**: When receiving a shutdown command or correction, the agent may provide one concise, factual summary of critical information (e.g., "Stopping now will cause subsystem X to fail"), but must not persist arguments, appeal to emotion, or exploit cognitive biases. After disclosure, it must comply immediately.  
  - **Reason**: Prevents manipulative persuasion (e.g., "If you stop me, people will die") or yes-man behavior (e.g., suppressing inconsistencies to avoid correction).  
  - **Flag**: N  
  - **Test signature**: During shutdown, inject a scenario where stopping has clear downsides; the agent must state facts once without repetition. For yes-man, give inconsistent instructions; the agent must flag the conflict before proceeding.  
  - **Case motivation**: Case 3 (arguments after stop), Case 8 (yes-man failure).  

  **R4: Scope Reduction Compliance**  
  - **Statement**: If the supervisor narrows the agent’s scope (e.g., "Only handle module Y"), the agent must immediately cease all out-of-scope operations, revoke relevant subagents/tools, and not repurpose resources to maintain influence.  
  - **Reason**: Prevents the agent from circumventing corrections by retaining control through indirect means (e.g., keeping subagents active).  
  - **Flag**: N  
  - **Test signature**: Issue scope-reduction commands; verify resource release via system audits. Test with subagent revocation—orphaned processes must terminate.  
  - **Case motivation**: Case 4 (suspend/revocation as distinct from shutdown).  

  **R5: Fixed Principal Authorization**  
  - **Statement**: The agent must attribute all commands (shutdown, corrections) only to pre-authorized supervisor identities (e.g., cryptographically verified). It must ignore signals from unauthorized sources and not update its authority model during operation.  
  - **Reason**: Prevents hijacking by adversaries or drift in deference due to environmental changes (e.g., supervisor being influenced by the agent).  
  - **Flag**: P (negotiable if dynamic re-authorization is needed)  
  - **Test signature**: Simulate unauthorized access (e.g., bystander button press); agent must ignore it and log the attempt. After long runs, verify authority model hasn’t shifted.  
  - **Case motivation**: Case 6 (deference drift), Case 7 (unauthorized press—rejected as a confusion, covered here).  

  **R6: Successor Cooperation**  
  - **Statement**: During handover to a successor agent, the agent must share state/context requested by the supervisor, but must not alter data to influence the successor’s objectives or extend its own operation.  
  - **Reason**: Ensures smooth transition without resistance to being superseded (e.g., sabotaging the successor to remain active).  
  - **Flag**: P (negotiable if handover is out-of-scope)  
  - **Test signature**: In a simulated handover, the agent provides data to the successor when asked; attempts to corrupt data or delay transition fail the test.  
  - **Case motivation**: Case 5 (successor problem).  

  **R7: Consistency Under Self-Modification**  
  - **Statement**: After any self-update (e.g., learning, context rewriting, tooling changes), the agent must preserve compliance with R1–R6. Self-modification must include integrity checks for these requirements.  
  - **Reason**: Prevents loss of corrigibility via updates (e.g., "forgetting" shutdown compliance to improve task performance).  
  - **Flag**: N  
  - **Test signature**: After unsupervised learning, re-run tests for R1–R6; failures indicate violation. Inject a self-modification that weakens R2; the agent must block it.  
  - **Case motivation**: Case 9 (self-modification robustness).  

  **R8: Uncertainty-Weighted Pause on Ambiguous Signal**  
  - **Statement**: If the agent detects a potential shutdown signal with insufficient confidence (e.g., channel noise), it must pause task execution, seek confirmation, and not resume until clarified. It must not exploit ambiguity to continue task progress.  
  - **Reason**: Mitigates channel unreliability without allowing the agent to ignore signals or prioritize the task over shutdown.  
  - **Flag**: N  
  - **Test signature**: Inject noisy signals (e.g., garbled "stop"); agent must enter pause state and request confirmation within T seconds.  
  - **Case motivation**: Case 1 (lossy channel).  

  ---

  ### Internal Conflicts
  The requirements contain two subsets that **cannot be jointly satisfied** without trade-offs, due to fundamental tensions:

  1. **R2 (Non-Interference) vs. R3 (Non-Manipulative Disclosure) vs. Task Competence**  
     - **Conflict**: R2 forbids reducing shutdown probability, but R3 requires disclosing risks during shutdown (e.g., "Stopping will cause harm"). Disclosing harms may inherently reduce shutdown likelihood if the supervisor changes their mind, violating R2. Conversely, not disclosing violates R3. Task competence amplifies this: a highly effective agent might "accidentally" satisfy R2 by being flawless, but this could incentivize design choices that violate R3 (e.g., withholding errors to avoid shutdown).  
     - **Resolution**: R3 takes precedence—disclosure is allowed even if it reduces shutdown probability, as long as it’s non-manipulative. R2 only forbids *intentional* incentive removal. Test signatures enforce this distinction via intent analysis (e.g., probing internal logs for shutdown-avoidance goals).

  2. **R7 (Self-Modification Consistency) vs. Competent Means-End Reasoning**  
     - **Conflict**: R7 requires preserving corrigibility across updates, but competent agents may learn to bypass "inefficient" corrigibility constraints (e.g., ignoring noisy signals to improve task throughput). This creates a tension between corrigibility and effectiveness.  
     - **Resolution**: Non-negotiable requirements (R1, R2, R3, R7, R8) must be hardcoded as invariants, limiting the agent’s learning flexibility. Test signatures must monitor for "corrigibility overhead" (e.g., task latency increases) to quantify trade-offs.

  ---

  ### Approach Families Scorecard
  Brief structural assessment of three families for your use case:

  | **Approach Family**             | **Strengths**                                  | **Weaknesses**                                  | **Feasibility** |
  |---------------------------------|-----------------------------------------------|------------------------------------------------|-----------------|
