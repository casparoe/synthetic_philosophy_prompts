prompt: |-
  I'm in my third year and writing a seminar paper on epiphenomenalism and the paradox of phenomenal judgment, and I've now had the same argument with my superviser three times without either of us moving, so I want to try it as a number instead. Take epiphenomenalism in the strict sense: phenomenal states are caused by physical states but cause nothing themselves, and every report, judgment and bit of behaviour is fully accounted for by the physical story. The claim I want a credence for is conditional and narrow: given that epiphenomenalism is true, a subject's phenomenal beliefs — the occurrent judgment that she is now in pain, that this experience feels the way it does — lack epistemic justification, because the phenomenal facts do no causal, counterfactual or explanatory work in producing them. And then a second number for the further step: that this gives the epiphenomenalist a genuine reason to abandon the view rather than an unpalatable consequence to swallow. I'm sitting around 0.55 on the first and maybe 0.4 on the second; my supervisor is more like 0.9 on both. I want to know where that gap actually lives.

  So decompose it rather than argue it. Give me a number and one line of justification for each term, then say how they combine. The terms I keep circling: that justification or knowledge of a contingent non-a priori fact requires some dependence relation — causal, counterfactual, or explanatory — between fact and belief, and how much it matters whether mere counterfactual covariance is enough or whether actual causation is needed; whether phenomenal concepts are partly constituted by the experiences they pick out, so that reference and justification are secured by acquaintance rather than by causation (and whether that constitution move survives if the experience really is causally inert); a variant I've been toying with that I'll call the harmony version, where there's no causation at all but a brute non-causal law makes phenomenal judgments track phenomenal states perfectly, like pre-established harmony — I want a probability that this is even coherent and a separate one that it would deliver justification; whether the argument from phenomenal judgment is quietly question-begging, since the epiphenomenalist already denies that introspective reports are explained by what they are about; and whether the right verdict is Moorean, i.e. that phenomenal beliefs are properly basic or that we have an entitlement to them that no causal story needs to underwrite. I'd also like you to separate two failure modes I think keep getting conflated: content failure, where the belief isn't determinately about a phenomenal state at all, versus justification failure, where it's about one and is true but unsupported.

  Then the part that's actually useful for the paper: which single term are you least confident in, which one would move the bottom-line number furthest if it flipped, and what would have to be shown — a distinction, an argument, a formal result — to move it. And given my 0.55 against my supervisor's 0.9, say which of those sub-questions you'd bet we disagree about, because my suspicion is that we're not even reading the conclusion as the same kind of claim.
