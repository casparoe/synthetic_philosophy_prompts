prompt: |-
  I'm a high school senior, and for four months next term I'll be living with a host family in Verenna, a city whose everyday conventions I've been briefed on in some detail. I'm also writing about them for my ethics independent study, and I'd be grateful for your help with the conceptual part.

  Here is the situation as it has been described to me. First, restaurants add a mandatory fifteen percent charge labeled "service," but that money goes to the house rather than to the server; the local custom is to leave a further cash tip of roughly eight percent, and the figure is not written down anywhere. Second, at bakeries and ticket counters there is no line: people stand wherever they like near the counter, and a place in the queue is claimed by catching the eye of whoever is already waiting, so arrival order is tracked by mutual acknowledgment rather than by position in space. Third, pedestrians cross against the red figure as a matter of course, drivers anticipate this and treat a pedestrian who waits as an obstruction, and the ordinance is enforced perhaps once a year, usually against tourists.

  Two ideas I've been working with, which I haven't come across in anything I've read and would like to see taken seriously. Call the first legibility: the degree to which an outsider could work out the convention by watching, without being told. Eye-contact queueing scores very low, the extra cash tip somewhere in the middle (you can see people putting bills down, but not the percentage), crossing on red very high. Call the second ratchet-sensitivity: whether one person's overcompliance raises what everyone else is then expected to do. That seems true of the tip, since a visitor leaving twenty-five percent makes locals who leave eight look stingy and invites resentment toward visitors generally, and false of the jaywalking. My tentative principle is that a convention is a genuine moral obligation for a visitor only if it is high in legibility, and that where a convention is ratchet-sensitive the visitor's obligation is not merely to comply but to comply at exactly the local level, neither more nor less.

  Please describe the most important implications of applying that two-part test to the three Verennan conventions, for the broader question of whether everyday conventions are moral obligations at all and whether visitors must follow local ones. I especially want to know where the test yields conclusions I probably won't like: for example, whether it makes obligation depend on facts a visitor could not be blamed for failing to know, whether it handles the case where compliance is itself mildly dangerous, and whether ratchet-sensitivity could ever oblige someone to do less than they would otherwise freely choose to do.

  Please lead with your bottom line in the very first sentence and then give the reasoning, with no preamble and no restatement of the question. Please write in American English.
reasoning: |-
  Okay, the user is a high school senior preparing for an exchange program in Verenna and writing an ethics paper. They've described three local conventions: tipping practices where a mandatory service charge goes to the house but an additional 8% cash tip is expected; an eye-contact queuing system; and habitual jaywalking where waiting at red lights is seen as obstructive. 

  They've proposed two original concepts: "legibility" (how easily outsiders can deduce conventions through observation) and "ratchet-sensitivity" (whether overcompliance increases expectations for others). Their core argument is that visitors only have moral obligations to follow highly legible conventions, and must match local compliance levels exactly for ratchet-sensitive ones.

  Hmm, interesting framework. Let me analyze each convention through their lens. The tipping system has medium legibility (seeing cash left but not percentages) and high ratchet-sensitivity (over-tipping pressures locals). The queueing has low legibility (invisible acknowledgments) and likely low ratchet-sensitivity. Jaywalking has high legibility (visible behavior) but low ratchet-sensitivity. 

  The user specifically wants implications they "won't like." First uncomfortable implication: Their test makes obligation depend entirely on observable clues, which seems to excuse ignorance even when information is available (e.g., not researching tipping norms). Second, it treats dangerous but legible conventions (jaywalking) as obligatory. Third, ratchet-sensitivity could force them to undertip relative to their own values. 

  I should note deeper tensions too: Their test prioritizes convenience for visitors over local expectations, and risks reducing morality to mere visibility. Also, by requiring exact compliance in ratchet-sensitive cases, it may prevent visitors from expressing personal generosity. 

  For their paper, they'll need to address whether conventions can create moral duties without state enforcement, and how their test handles cultural learning curves. Might be worth contrasting with Scanlon's contractualism or Humean convention theories. 

  *Adjusting tone* Since they're a senior, I'll avoid oversimplifying but keep academic references implicit unless asked. The "uncomfortable" points deserve emphasis—they show intellectual honesty. And I should explicitly connect each convention analysis back to their two-part test in the response structure.
answer: |-
  Your moral obligation to follow Verennan conventions hinges entirely on their legibility and ratchet-sensitivity: you are obligated to jaywalk (high legibility, low ratchet-sensitivity), not obligated to eye-contact queue (low legibility), and obligated to tip *exactly* 8% cash (medium legibility, high ratchet-sensitivity), even if this conflicts with your personal norms or safety.

  **Implications & Uncomfortable Conclusions:**

  1.  **Obligation Depends on Observable Facts (Ignorance Excuses):** Your test makes moral obligation contingent on what you *can* reasonably observe, not what you *should* know through research. You have no duty to learn the invisible queueing convention beforehand or discover the precise tip percentage by asking. If you miss people leaving cash tips entirely, your test implies no obligation exists. This absolves visitors of blame for failing to uncover non-legible norms, potentially undermining local expectations of cultural effort.

  2.  **Compliance Despite Danger:** Jaywalking is highly legible, and your test finds no ratchet-sensitivity (your crossing doesn't raise expectations for others). Therefore, you *are* obligated to jaywalk. This is a conclusion you likely dislike: it forces you into behavior you recognize as "mildly dangerous" simply because it's the visible norm. Your principle prioritizes conformity to a legible convention over personal safety risk and possibly your own judgment about prudence.

  3.  **Ratchet-Sensitivity Forces Under-Compliance:** The tipping convention (medium legibility, high ratchet-sensitivity) creates the most uncomfortable demand. You are obligated to tip *exactly* 8% in cash. If your personal ethics or home custom would lead you to tip 15-20% freely, your principle *obliges you to tip less*. Giving more violates the duty to match the local level precisely, potentially harming locals (through resentment or expectation shifts) and visitors (creating a "rich tourist" stereotype). Your morality here requires active restraint of generosity to avoid disrupting the local equilibrium.

  4.  **Questioning the Moral Force of Conventions:** Applying your test rigorously suggests everyday conventions are only morally obligatory for visitors under very specific conditions (high legibility, plus precise matching for ratchet-sensitive cases). For low-legibility norms (queueing), they hold no moral weight for visitors. This implies convention alone lacks inherent moral authority; its force for outsiders derives purely from its perceptibility and potential to cause harm through disruption (via ratcheting). It sidelines arguments based on respect for local culture or gratitude to hosts unless those values are *themselves* legible conventions.

  5.  **Potential for Exploitation & Hypocrisy:** The test could incentivize preserving deliberately opaque (low-legibility) conventions that disadvantage visitors or vulnerable groups (e.g., if the "8%" tip was inconsistently applied, but you couldn't observe this). Conversely, demanding exact compliance (like 8% tipping) while locals might occasionally deviate slightly could feel hypocritical or overly rigid.

  **In essence, your test:**  
  - Makes obligation highly dependent on passive observation, excusing ignorance.  
  - Mandates compliance with dangerous but visible norms.  
  - Can require actively doing *less* than your conscience dictates to avoid social harm.  
  - Severely limits the scope of conventions creating moral duties for visitors, basing it solely on visibility and disruption risk, not cultural respect per se.  
  - Creates rigidity in compliance where locals might have flexibility.  
  This highlights tensions between visitor autonomy, local expectations, the practicality of cultural integration, and the inherent moral weight of social norms.
