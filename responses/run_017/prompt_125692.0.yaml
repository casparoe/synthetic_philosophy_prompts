prompt: |-
  I'm an observational cosmologist, and last term I sat in on a philosophy of science reading group that spent two full sessions stuck on a single exchange. Two of the members — call them Ingrid and Tobias — were arguing about whether a fact you already knew can be evidence for a new theory. They both asked me to referee and I genuinely could not tell who was ahead, so I'm reporting the exchange as faithfully as I can and asking for a verdict on the arguments as they were actually made, not on the tidied-up versions.

  The case that started it was Mercury's perihelion. Once the perturbations from the other planets are subtracted, Mercury's orbit precesses by roughly 43 arcseconds per century more than Newtonian theory predicts. That residual was on the books decades before general relativity, which then produced it as a consequence of the field equations, and it is standardly presented as one of the theory's great evidential triumphs.

  (1) Ingrid called this the problem of old evidence. If the datum was already known, then anyone updating by Bayes's rule assigned P(E) = 1 before the theory arrived; the theory entails the datum, so P(E|T) = 1; hence P(T|E) = P(T), and the datum confirms nothing. Yet every working scientist counts it as evidence, and not just here — she offered Darwin as a second case, where the theory's credit is largely credited to its making sense of homologies and geographic distributions that naturalists already knew about. So either the practice is irrational or Bayesian confirmation theory has a hole in it, and she thought the hole was real: conditioning on certainties can never move you, and a great deal of what scientists call evidence is already certain.

  (2) Tobias said the fix is to stop measuring confirmation as change in credence and measure it as fit. What matters is the ratio of P(E|T) to P(E|¬T): how well the theory would have anticipated the datum compared with its rivals. That ratio can be favorable even when E is old; you evaluate it against a hypothetical starting point from which E has been removed. Mercury's residual is exactly what the field equations give and was an unexplained anomaly for the Newtonian picture, so the ratio is high and the confirmation is secured without any updating at all.

  (3) Ingrid replied that the ratio cannot do the work, for two reasons. First, arithmetic: if P(E) = 1 and 0 < P(T) < 1, then expanding P(E) = P(E|T)P(T) + P(E|¬T)(1 − P(T)) shows both conditional probabilities must equal 1, since each product is bounded above by its multiplier and the two bounds sum to 1. So every hypothesis fits the datum perfectly and the ratio is exactly 1 — the escape route is closed by the probability calculus, not by philosophical taste. Second, the deletion is not well defined: remove the anomaly from what you know and you must also adjust everything else that leans on it, and there is no principled place to stop.

  (4) Tobias conceded the deletion was messy and offered a replacement that needs no deletion. What the scientist actually learns when a theory arrives is not the datum but the derivation — the fact that T entails E. For a non-ideal agent that is a genuine discovery: it can be news that the field equations yield the residual. Model the agent's credences as not closed under logical consequence, so that P(T → E) < 1 beforehand, and learning the entailment raises P(T) even while P(E) stays pinned at 1. The Mercury episode then has exactly the shape of learning something new.

  (5) Ingrid's objection was that this makes confirmation a reward for ignorance. The entailment is news only because the agent had not worked out the theory's consequences; and note that if P(E) = 1 then even a logically omniscient agent has P(T → E) = 1 automatically, since T ∧ ¬E has probability at most P(¬E) = 0. So the omniscient agent gets zero confirmation from Mercury. A theory on which a datum's evidential value falls as the agent gets smarter is, she said, a reductio.

  (6) Tobias answered that the omniscient agent is the wrong baseline: rational confirmation is a notion for agents like us, and for us working out what a theory implies is the central activity of theoretical science, so of course new entailments carry weight. Besides, the ideal agent does not need the boost — an agent who had already seen the entailment would already have assigned the theory a higher prior, so comparing that agent's before and after is comparing two different agents.

  (7) Ingrid then pressed a further point: both of Tobias's fixes give the same credit to a theory built to yield a datum as to one that yielded it unexpectedly. Imagine two rivals that both entail the residual, one deriving it from its core postulates and the other carrying an auxiliary parameter that was dialed until it fit. Practice plainly favors the first, and nothing in the machinery offered so far explains why. Tobias (8) replied that this is handled in the prior, not in the evidential relation: a theory with a freely tunable parameter is penalized before the data are ever considered, so no separate novelty requirement is needed — to which Ingrid said that this just relocates the puzzle, since priors are supposed to be independent of the evidence, and here the prior is where all the work about accommodation versus prediction is being done.

  Before they broke up they traded two cases neither of them could settle, and I'd especially like your reading of these.

  Case A. A researcher derives from her new theory a value for a quantity she and her collaborator measured years earlier and then forgot about. At the moment of derivation she experiences it as a striking success and her confidence in the theory jumps. Her collaborator then points out that this is just the number in their own old notebook. Her confidence does not drop when she is reminded. Ingrid said the reminder reveals the jump was never rational, since the datum was always in her evidence and she merely lost track of it. Tobias said the reminder is irrelevant, because what did the work was the derivation, which is new regardless of the datum's age; if you think the reminder should deflate her confidence, you have committed yourself to confirmation being a property of calendar dates.

  Case B. Suppose the residual had been known before the theory only as lying somewhere between about 30 and 60 arcseconds per century, and the theory says 42.98. Ingrid said this shows the problem is an artifact: how finely we slice the evidence is up to us, and no conclusion about confirmation can rest on our choice of description. Tobias said it shows the opposite — if the slicing is free then any old datum can be re-described as a novel precise prediction, and the old-evidence problem becomes trivially escapable and therefore toothless.

  Please go through the exchange and rate each numbered move from clearly mistaken to clearly right, with a brief justification for each, and check whether the arithmetic in move (3) is sound and whether it really bears on what Tobias was claiming. Then say how you read cases A and B — what each actually shows, which side if either it favors, and what the right unit of evidence is if a proposition, a derivation and an agent's access to a proposition can come apart. Finally: who is more right overall, and what is each of them missing?
reasoning: |-
  We are analyzing an exchange between Ingrid and Tobias on the problem of old evidence in Bayesian confirmation theory. The key issue is whether a fact already known (like Mercury's perihelion precession) can serve as evidence for a new theory (like general relativity). We'll go through each move and rate it, then address the two cases (A and B) and give an overall assessment.

  ### Step-by-Step Analysis of the Exchange

  **(1) Ingrid's Initial Problem of Old Evidence**
  - **Rating**: Clearly right about the problem as posed.
  - **Justification**: Ingrid correctly points out the Bayesian dilemma: if E (the evidence) is already known, then P(E)=1. If a new theory T entails E (so P(E|T)=1), then by Bayes' theorem, P(T|E) = [P(E|T) * P(T)] / P(E) = [1 * P(T)] / 1 = P(T). Thus, E does not increase the probability of T. However, in scientific practice, such old evidence (like Mercury's perihelion) is taken as strong confirmation. This is a well-known challenge to Bayesianism (the "problem of old evidence").

  **(2) Tobias's Proposal: Measure Confirmation by Fit (Likelihood Ratio)**
  - **Rating**: Partially right but incomplete.
  - **Justification**: Tobias suggests that we should measure confirmation by the likelihood ratio P(E|T)/P(E|¬T) (how well T predicts E compared to its rivals). He argues that even for old evidence, we can evaluate this ratio by hypothetically removing E from our knowledge. This avoids the updating issue. The idea has merit because in practice, scientists do consider how well a theory explains existing anomalies compared to alternatives. However, as Ingrid will point out, the probability calculus and the practical difficulty of "removing" E are problematic.

  **(3) Ingrid's Reply: Critique of Tobias's Fit Measure**
  - **Rating**: Clearly right about the arithmetic, but the bearing on Tobias's claim is debatable.
  - **Justification**:
    - **Arithmetic**: Ingrid is correct. If P(E)=1 and 0<P(T)<1, then:
      P(E) = P(E|T)P(T) + P(E|¬T)(1-P(T)) = 1.
      Since P(T) and 1-P(T) are positive, and each term on the right is at most the multiplier (because P(E|T) and P(E|¬T) are <=1), the only way the sum is 1 is if P(E|T)=1 and P(E|¬T)=1. Thus, the likelihood ratio is 1. This seems to undermine Tobias's proposal because it shows that if E is certain, then both T and ¬T must assign it probability 1, so the ratio is 1 and there is no confirmation.
    - **Bearing on Tobias's claim**: The arithmetic does bear on Tobias's claim because it shows that within the standard probability framework, if E is already known (P(E)=1), then the likelihood ratio cannot be greater than 1. However, Tobias's idea of "removing" E is an attempt to step outside the current probability distribution. So the arithmetic is sound and shows that if we do not adjust the probability of E, then the ratio is 1. But Tobias's proposal is to change the context by hypothetically setting P(E) to a value less than 1. Thus, the arithmetic does not directly refute Tobias if we interpret his proposal as requiring a change in the agent's state of knowledge. However, the second part of Ingrid's objection (the difficulty of deletion) remains a challenge.

  **(4) Tobias's Second Proposal: Learning the Entailment**
  - **Rating**: A step in the right direction, but problematic.
  - **Justification**: Tobias suggests that what is learned is not E (which is already known) but that T entails E. If the agent is not logically omniscient, then before the derivation, P(T → E) < 1. Learning the entailment (T → E) then updates the agent's credence in T. This is a well-known response to the problem of old evidence (e.g., by Garber). It models agents as not knowing all logical consequences. Thus, even with P(E)=1, learning that T implies E (which the agent did not know) can increase P(T). This move is reasonable and addresses the arithmetic problem by changing what is learned.

  **(5) Ingrid's Objection: Confirmation as Reward for Ignorance**
  - **Rating**: Clearly right about the implication, but the conclusion is debatable.
  - **Justification**: Ingrid points out that under Tobias's model, an agent who is logically omniscient (who already knows all entailments) would not get any confirmation from old evidence because for such an agent, P(T → E)=1 from the start. Thus, the less omniscient the agent, the more confirmation they get from deriving E from T. This seems counterintuitive: why should ignorance be rewarded? Moreover, it suggests that the ideal rational agent (logically omniscient) would not be confirmed by old evidence, which seems to contradict scientific practice. This is a valid concern.

  **(6) Tobias's Defense: Confirmation for Non-Omniscient Agents**
  - **Rating**: Reasonable, but does not fully resolve the issue.
  - **Justification**: Tobias argues that rational confirmation is for agents like us (not logically omniscient) and that working out the consequences of a theory is a central scientific activity. Thus, it is appropriate that learning an entailment confirms the theory. Moreover, an agent who had already worked out the entailment would have already assigned a higher prior to T, so we are comparing the same agent at different times (with and without the knowledge of the entailment). This is a pragmatic response and has some force. However, it does not address the normative question: should the ideal agent get confirmation from old evidence? And if not, does that mean our practice is irrational?

  **(7) Ingrid's Further Point: Accommodation vs. Prediction**
  - **Rating**: Clearly right about the scientific practice, and raises a new issue.
  - **Justification**: Ingrid notes that both of Tobias's proposals (likelihood ratio and learning entailments) would give the same credit to a theory that was built to fit the data (with adjustable parameters) as to one that predicted the data without adjustment. But in practice, a theory that predicts without ad hoc adjustments is more highly regarded. Tobias replies that the ad hoc theory is penalized in the prior (because it is more complex or has more free parameters). Ingrid counters that this moves the problem to the prior and that priors are supposed to be independent of the evidence, yet here the prior is being used to account for the difference in evidential weight (accommodation vs. prediction). This is a deep issue about whether Bayesianism can capture the distinction between prediction and accommodation without building it into the prior.

  **(8) Tobias on Priors Handling Accommodation**
  - **Rating**: Partially right, but Ingrid's relocation point is valid.
  - **Justification**: Tobias is right that in Bayesianism, the penalty for ad hoc adjustments (like free parameters) is typically encoded in the prior (e.g., via simplicity considerations). However, Ingrid is also right that this relocates the problem: now the prior is doing the work that we might have thought belonged to the evidential relation. Moreover, the requirement that priors be independent of the evidence is a standard Bayesian tenet, but if we set the prior based on the theory's structure (which might be influenced by known data), there is a risk of circularity. This remains a challenge.

  ### Analysis of Cases

  **Case A: The Forgotten Measurement**
  - **Scenario**: A researcher derives from her new theory a value that she and her collaborator had measured years earlier and forgotten. When she derives it, her confidence jumps. Then she is reminded that they had measured it. Her confidence does not drop.
  - **Ingrid's view**: The jump was irrational because the datum was always in the evidence (even if forgotten). The reminder should deflate the confidence.
  - **Tobias's view**: The reminder is irrelevant because what matters is the derivation (the entailment), which is new. The jump was rational, and the reminder doesn't change that.
  - **Assessment**: Tobias has the better argument here. The agent's epistemic state at the time of derivation did not include the memory of the old measurement. Thus, for her, the derivation was a genuine discovery. The reminder does not negate the fact that she has learned something new (the entailment). However, if she had remembered the old measurement, then the derivation would not have provided the same boost. This case highlights that evidence is relative to the agent's state of knowledge. The unit of evidence here is the agent's access to the proposition (or the entailment). Thus, the jump in confidence is rational for her at that moment.

  **Case B: Imprecisely Known Residual**
  - **Scenario**: Suppose the residual was known only to be between 30 and 60 arcseconds per century, and the theory predicts 42.98.
  - **Ingrid's view**: This shows that the problem is artificial because we can choose how finely to describe the evidence. If we describe it coarsely (the interval) then the theory's precise prediction is novel and confirms; if we describe it precisely (the exact value) then it's old and doesn't confirm. But we shouldn't base confirmation on arbitrary description choices.
  - **Tobias's view**: This shows that the old-evidence problem is toothless because we can always redescribe the evidence to make it novel (by using the precise value). Thus, the problem is avoidable.
  - **Assessment**: Both have a point, but Ingrid's is stronger. The problem of old evidence is not just about the calendar date but about the agent's knowledge. If the agent knew the precise value before the theory, then it is old evidence. But if the agent knew only an interval, then the theory's precise prediction is novel (even if the measurement that gave the interval was old). Thus, the unit of evidence is the proposition that the agent has in mind. However, the choice of description matters. In practice, scientists often treat a precise prediction of a known approximate value as novel and confirmatory. This suggests that the problem of old evidence is not just about time but about the specificity of the evidence. Tobias is right that we can escape the problem by considering the evidence at a more precise level, but Ingrid is right that this makes confirmation dependent on how we describe the evidence, which is arbitrary. A better approach might be to consider the entire evidence set and how the theory accounts for it at the appropriate level of precision.

  ### Overall Assessment

  - **Who is more right overall?** Both have valid points, but Ingrid's critique of Bayesianism is more fundamental. The problem of old evidence remains a challenge for Bayesian confirmation theory, and Tobias's fixes (while pragmatic) have limitations.
    - Ingrid correctly points out the core problem (move 1) and the issues with Tobias's proposals (moves 3 and 5). She also raises a valid concern about accommodation vs. prediction (move 7).
    - Tobias offers practical solutions (moves 2, 4, 6, 8) that work for non-ideal agents, but they do not resolve the problem for the ideal case and may lead to counterintuitive results (like rewarding ignorance).

  - **What is each missing?**
    - **Ingrid** might be underestimating the Bayesian responses that are tailored to real agents (like learning entailments). The fact that confirmation is agent-relative does not make it irrational. Also, the distinction between prediction and accommodation can be handled in the prior without violating Bayesian principles, but it requires a well-justified prior.
    - **Tobias** misses the force of the ideal agent problem. If Bayesianism is meant to be a normative theory, it should account for the ideal case. Moreover, the reliance on priors to handle ad hoc theories might be circular if the priors are set based on the same evidence.

  ### Conclusion
  The problem of old evidence is a genuine challenge for Bayesian confirmation theory. The most promising approach is to model agents as logically non-omniscient and to consider the learning of entailments as a source of confirmation (Tobias's move 4). However, this makes confirmation agent-relative and does not solve the problem for ideal agents. The likelihood ratio approach (move 2) is problematic because of the probability calculus (as Ingrid shows) and the difficulty of hypothetical deletion. 

  In Case A, the agent's confidence jump is rational because she learned the entailment, and the reminder does not negate that. In Case B, the evidence should be described at the level of precision known to the agent: if the agent knew only an interval, then the precise prediction is novel and confirmatory.

  Overall, Ingrid has the stronger arguments in exposing the problems, but Tobias offers a workable solution for real-world science. The debate shows that Bayesian confirmation theory must be augmented to account for logical learning and the context of discovery.
answer: |-
  ### Analysis of the Exchange

  #### (1) Ingrid: Problem of Old Evidence
  - **Rating**: Clearly right about the problem's existence.  
  - **Justification**: Ingrid correctly identifies the Bayesian dilemma: if \(P(E) = 1\) for known evidence \(E\), then \(P(T|E) = P(T)\) when \(T\) entails \(E\), so \(E\) cannot confirm \(T\). This contradicts scientific practice (e.g., Mercury’s perihelion confirming GR). Her point that conditioning on certainties cannot change credence is logically sound and exposes a genuine limitation of strict Bayesian updating. Darwin’s homologies reinforce that this is not a niche issue.

  #### (2) Tobias: Fix via Likelihood Ratio
  - **Rating**: Partially right but practically flawed.  
  - **Justification**: Tobias’s shift to likelihood ratios (\(P(E|T)/P(E|\neg T)\)) as a measure of "fit" is a standard move in Bayesian confirmation theory (e.g., I.J. Good’s work). It captures intuitive scientific reasoning: Mercury’s residual fits GR better than Newtonian mechanics. However, Ingrid’s next move shows this fails under \(P(E) = 1\).

  #### (3) Ingrid: Critique of Likelihood Ratio
  - **Rating**: Clearly right on arithmetic; partially right on relevance.  
  - **Arithmetic Soundness**: **Sound**. If \(P(E) = 1\) and \(0 < P(T) < 1\), then:  
    \[
    P(E) = P(E|T)P(T) + P(E|\neg T)(1 - P(T)) = 1.
    \]
    Since \(P(E|T) \leq 1\) and \(P(E|\neg T) \leq 1\), the equation holds only if \(P(E|T) = 1\) and \(P(E|\neg T) = 1\). Thus, the ratio \(P(E|T)/P(E|\neg T) = 1\), offering no confirmation.  
  - **Bearing on Tobias’s Claim**: Directly relevant. Tobias proposed ignoring \(E\)’s certainty by hypothetically removing \(E\), but Ingrid’s math shows that within standard probability theory, \(P(E) = 1\) forces the ratio to 1. Her second point (deletion’s messiness) is separate but valid—removing \(E\) requires arbitrary adjustments to background knowledge, lacking a principled method. Tobias’s "fit" fix is mathematically blocked by probability axioms.

  #### (4) Tobias: Learning the Entailment
  - **Rating**: Reasonable but incomplete.  
  - **Justification**: Tobias’s move—modeling agents with limited logical omniscience and updating on learning \(T \vdash E\)—is a recognized solution (e.g., Garber 1983). It reflects real science: deriving Mercury’s residual from GR’s field equations was a nontrivial achievement. For non-ideal agents, \(P(T \to E) < 1\) pre-derivation, so learning the entailment can boost \(P(T)\) even if \(P(E) = 1\). This addresses Ingrid’s arithmetic by changing what is learned.

  #### (5) Ingrid: Confirmation as Reward for Ignorance
  - **Rating**: Clearly right about the implication.  
  - **Justification**: Ingrid highlights a weakness: under Tobias’s model, an omniscient agent (\(P(T \to E) = 1\)) gets no confirmation from \(E\), while a less knowledgeable agent does. This penalizes rationality, as ideal agents "lose" evidence scientists value. It creates a *reductio*: if confirmation diminishes with increasing knowledge, the theory violates scientific norms where evidence should retain value regardless of when it was understood.

  #### (6) Tobias: Defense for Non-Omniscient Agents
  - **Rating**: Partially right but misses normative force.  
  - **Justification**: Tobias correctly notes that confirmation theory must apply to real agents (like scientists), for whom deriving consequences is central. The omniscient agent is irrelevant because they would have baked the entailment into their prior. However, this sidesteps Ingrid’s normative concern: evidence like Mercury’s perihelion *should* confirm \(T\) for all rational agents, not just the logically fallible. Tobias’s reply is descriptive but doesn’t resolve the ideal case.

  #### (7) Ingrid: Accommodation vs. Prediction
  - **Rating**: Clearly right about scientific practice.  
  - **Justification**: Ingrid identifies a new problem: both fixes (likelihood ratios or learning entailments) treat *ad hoc* theories (e.g., one with tuned parameters) and genuinely predictive theories equally. Scientists favor the latter, but Bayesianism lacks tools to distinguish them in the likelihood or entailment-based updates. This is a deeper issue about explanatory quality.

  #### (8) Tobias: Priors Handle Accommodation
  - **Rating**: Partially right but relocates the issue.  
  - **Justification**: Tobias is correct that priors can penalize *ad hoc* theories (e.g., via simplicity or parameter tuning). However, Ingrid’s rebuttal stands: priors are meant to be evidence-independent, yet here they absorb the distinction between prediction and accommodation. This risks circularity, as priors may tacitly depend on known evidence. The relocation doesn’t solve the problem; it hides it.

  ---

  ### Verdict on Cases A and B

  #### Case A: The Forgotten Measurement
  - **What it shows**: This tests whether evidence’s evidential power depends on the *agent’s epistemic state* or just the proposition’s truth.  
  - **Assessment**: **Favors Tobias**. The researcher’s confidence jump is rational because she learns the *entailment* (a new cognitive achievement), not because \(E\) is "new" chronologically. The reminder doesn’t negate the derivation’s confirmatory power; it only corrects her memory. Ingrid’s view conflates evidence (a proposition) with the agent’s access to it. If evidence required constant active awareness, science would collapse under memory burdens.  
  - **Right unit of evidence**: **Derivation + agent’s epistemic state**. Evidence is not just \(E\) or \(T \vdash E\); it’s the *agent learning* \(T \vdash E\). This separates the proposition (\(E\)), the derivation (\(T \vdash E\)), and the agent’s access (memory, attention).

  #### Case B: Imprecisely Known Residual
  - **What it shows**: This probes whether "old evidence" is a problem of *description granularity*.  
  - **Assessment**: **Favors Ingrid**. Tobias claims redescription trivially solves the problem (e.g., treating the precise prediction as "novel"), but this exposes arbitrariness: if slicing evidence finely (e.g., 42.98 arcseconds) makes it confirmatory, while coarse slicing (30–60 arcseconds) does not, confirmation becomes subjective. Ingrid is right that no robust theory should let confirmation hinge on descriptive choices. The case reveals that the old-evidence problem is not merely about time but about *how evidence is conceptualized*.  
  - **Right unit of evidence**: **The agent’s background knowledge**. The residual’s evidential value depends on what the agent knew pre-theory: if they knew only a range, GR’s precise prediction provides new information; if they knew the exact value, it does not. The unit is the *specific proposition in the agent’s knowledge base*.

  ---

  ### Overall Verdict
  - **Who is more right?** **Ingrid slightly edges out, but both miss key insights**.  
  - **What Ingrid misses**: Tobias’s learning-the-entailment fix (4) is pragmatically useful for real scientists. Dismissing it as "reward for ignorance" undervalues how scientific progress relies on deriving consequences. Her critique of likelihood ratios (3) is mathematically correct but could acknowledge that *hypothetical* probabilities (e.g., \(P(E|\neg T)\) sans \(E\)) have heuristic merit.  
  - **What Tobias misses**: Ingrid’s core challenge (1, 5, 7) stands: Bayesianism struggles with normative rationality. Priors (8) cannot fully resolve prediction vs. accommodation without risking circularity. His fixes work for non-ideal agents but fail for ideal cases, undermining Bayesianism as a normative framework.  
  - **Synthesis**: The problem of old evidence remains unresolved in Bayesian confirmation theory. Ingrid is right that it exposes a hole: standard updating cannot handle certainties, and agent-dependent fixes have counterintuitive consequences. Tobias’s entailment-based approach is the best practical patch but doesn’t fully align with scientific intuition (e.g., Mercury’s perihelion *should* confirm GR for all rational agents). A complete solution may require augmenting Bayesianism with non-probabilist elements (e.g., explanatory virtues). Ultimately, **Ingrid wins on points** for identifying deeper flaws, but Tobias offers tools for working scientists.
