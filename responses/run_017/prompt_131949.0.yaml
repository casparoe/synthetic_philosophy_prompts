prompt: |-
  I run the weekly challenge session at a small grantmaking foundation: five analysts, each assigned to tear holes in somebody else's funding case, and I write the one-page note that goes to the board under my name. Roughly twice a month a case stalls because two people are arguing past each other in a way that more evidence won't fix — typically over what counts as evidence at all: one analyst holds that nothing that hasn't been replicated in a randomized trial is evidence, another that a mechanism plus a field visit is. I've tried the usual rationalist toolkit on these — steelmanning, double crux, asking what would change your mind — and it fails in a specific way: it presumes the disagreement bottoms out somewhere arguable. The answer I get back is often "nothing", and "nothing" is ambiguous between a refusal to engage and the honest report that the claim in question is load-bearing for everything else the person is doing.

  Which is why I've been working through Wittgenstein's late notes on certainty, published after his death as On Certainty, and the literature that calls the propositions at the bottom of that structure hinges: not known, not inferred, not doubted, but the frame inside which knowing, inferring and doubting have the sense they have — closer to the riverbed that the water runs through than to a belief floating in the water, though the riverbed can shift over time. Please turn this into a procedure my team can actually run: twenty minutes alone at a desk, in writing, with no philosophy training, on a claim that has deadlocked a dispute, and in a form I can audit before the note goes out.

  What I need is the tests, in the order they should be applied, for sorting a stalled claim into (1) an ordinary empirical question whose evidence test the two sides simply haven't specified, (2) a genuine clash between frameworks that no evidence will settle for the people holding them, and (3) a hypothesis someone has insulated from criticism by treating it as though it were a hinge — together with what to do in each case (send it back for a number and a date, escalate it to the board as a scope-and-values decision, push back and demand the argument), what counts as a sufficient answer to each test, where the sequence stops early with a firm verdict, and where it has to hand the decision to a person because the question is one of commitments rather than facts.

  Then run it on three cases: the randomized-trial-versus-mechanism stalemate above; an analyst who refuses to put any probability on a low-base-rate catastrophic risk on the grounds that any number would be spurious; and my own standing rule that we only fund interventions whose impact can be measured, which I expect the procedure to treat less kindly than I do. Finally, tell me honestly what a procedure like this cannot do: where it will misfire, which of its verdicts I should be most suspicious of, and how it might end up as a convenient vocabulary for people to stop arguing earlier than they should.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They run a challenge session at a grantmaking foundation where analysts critique each other's funding cases. The main issue is when disputes stall because of fundamental disagreements about what counts as evidence. The user has tried rationalist techniques like steelmanning and double crux, but these fail because the disagreements often bottom out in foundational beliefs that aren't open to debate. 

  The user mentions turning to Wittgenstein's "On Certainty" and the concept of hinge propositions. They need a practical procedure to classify stalled claims into three categories: ordinary empirical questions, framework clashes, or insulated hypotheses. They also want examples and limitations of the procedure.

  First, I need to ensure I understand hinge propositions correctly. These are bedrock assumptions that aren't based on evidence but form the framework for inquiry. The challenge is translating this philosophical concept into a step-by-step audit process that analysts without philosophy training can use in 20 minutes.

  The user's deeper needs might include reducing conflict time, ensuring decisions are defensible to the board, and preventing analysts from entrenching in their positions. They might also want to foster a culture where foundational disagreements are acknowledged without halting progress.

  For the procedure, I consider designing a checklist with yes/no questions to categorize each claim. Each test should be simple and require minimal explanation. The sequence should start with empirical testability to quickly sort out resolvable disputes. If a claim is testable, it's category 1. If not, move to hinge characteristics like immunity to evidence or foundational role.

  The examples provided (randomized trials vs. mechanism, catastrophic risk probability, impact measurement rule) will help validate the procedure. Each case tests different aspects: methodological divide, probability quantification, and operational principles. 

  I need to anticipate pitfalls. For instance, analysts might misuse the procedure to avoid scrutiny by labeling everything a hinge. The audit trail is crucial here—requiring written answers prevents evasion. Also, distinguishing between genuine hinges and stubbornness requires judgment, so the procedure must include escalation points.

  The honest assessment section is vital. The procedure can't resolve value conflicts or detect bad faith. It might oversimplify complex issues or be gamed. Highlighting these limitations builds trust and sets realistic expectations.

  Finally, structuring the response clearly: procedure steps, decision tree, application to cases, limitations. Ensuring each part addresses the user's explicit needs while covering unspoken goals like efficiency and accountability.
answer: |-
  Here's a practical 20-minute hinge audit procedure, designed for your analysts, based on Wittgenstein's insights. It categorizes deadlocked claims and dictates clear next steps.

  **The Hinge Audit Procedure (20-Minute Written Worksheet)**

  **Analyst Instructions:** Take 20 minutes alone. Answer the questions below for the *specific claim* causing the deadlock (e.g., "This qualitative field report *is* sufficient evidence," not the whole funding case). Be brutally honest. Write brief, clear answers. Focus on *this specific claim*, not the broader argument.

  **Worksheet:**
  1.  **The Claim:** State the exact, specific claim causing the deadlock. (e.g., "Mechanism X *will* cause outcome Y in this context." / "Probability of catastrophe Z *cannot* be quantified.")
  2.  **Empirical Testability:**
      *   *Question:* Could *new, specific evidence* (data, study, observation) gathered *in the future* realistically cause a reasonable person holding this claim to significantly revise or abandon it? (Yes/No/Unclear)
      *   *Sufficient Answer:* "Yes" requires naming *conceivable* evidence type(s) (e.g., "A failed RCT showing mechanism X doesn't work here," "A validated predictive model for Z"). "No" means no conceivable evidence would change their mind *on this specific claim*. "Unclear" needs brief explanation.
  3.  **Evidence Immunity:**
      *   *Question:* Is *existing counter-evidence* (or the lack of confirming evidence) dismissed *because it challenges this claim itself*, rather than due to methodological flaws *within the framework*? (Yes/No/Unclear)
      *   *Sufficient Answer:* "Yes" if dismissal relies on protecting the core claim (e.g., "That RCT isn't applicable *because* context matters," "Those models are wrong *because* Z is inherently unquantifiable"). "No" if counter-evidence is genuinely flawed *by agreed standards*. "Unclear" needs specifics.
  4.  **Foundation Role:**
      *   *Question:* Is this claim treated as the *necessary starting point* for evaluating *other* evidence or arguments within this analysis? Would abandoning it make much of their current reasoning collapse or seem nonsensical? (Yes/No/Unclear)
      *   *Sufficient Answer:* "Yes" requires identifying *which* specific downstream arguments depend critically on it. "No" if it's just one supporting piece. "Unclear" if the connection is vague.
  5.  **Argumentative Load:**
      *   *Question:* Is this claim being used primarily to *stop further argument* or scrutiny ("this is just how we must proceed") rather than as a premise *within* an argument open to challenge? (Yes/No/Unclear)
      *   *Sufficient Answer:* "Yes" if its invocation ends discussion. "No" if it's actively debated *even if* strongly held. "Unclear" if usage is mixed.
  6.  **Personal Commitment:**
      *   *Question:* Does defending this claim feel essential to your professional identity, core values, or fundamental approach to your work, beyond just this specific case? (Yes/No/Unclear)
      *   *Sufficient Answer:* Honest self-report. "Yes" indicates deep personal stake. "No" suggests it's case-specific. "Unclear" if unsure.

  **Auditor (You) Decision Tree & Next Steps:**

  Based on the worksheet answers, categorize the claim:

  1.  **Ordinary Empirical Claim (Send it back for evidence):**
      *   *Verdict:* **1.2 = Yes** AND **1.3 = No/Unclear** AND **1.4 = No/Unclear** AND **1.5 = No/Unclear** AND **1.6 = No/Unclear**.
      *   *Meaning:* The claim *can* be tested with evidence, isn't acting like a foundational hinge, isn't primarily argument-stopping, and isn't deeply tied to identity. The disagreement is about *what evidence is sufficient now*.
      *   *Next Step:* **"Send it back."** Directive: "Specify the *exact type of evidence* required (1.2 answer) and a *reasonable timeframe/deadline* for obtaining it or concluding it's unavailable. Resume argument *only* when this evidence is presented or deadline passes." Add this requirement to the case note for the board.
      *   *Stops Early?* If 1.2 is a clear "Yes" *with specific evidence types named*, and other answers don't strongly point to hinge behavior, you can often stop here.

  2.  **Genuine Framework Clash (Escalate to Board):**
      *   *Verdict:* **1.2 = No/Unclear** OR **1.3 = Yes** OR **1.4 = Yes** OR **1.5 = Yes** OR **1.6 = Yes** -- AND the conflict is between *analysts*, not necessarily involving *your* rules.
      *   *Meaning:* The claim functions as a hinge *for the analyst(s)* holding it. It is deeply embedded in their reasoning framework, resistant to counter-evidence in principle, foundational, or tied to identity/values. More evidence won't resolve it *between these people*.
      *   *Next Step:* **"Escalate as Framework Clash."** Directive: "Document the *specific hinge claim(s)* and the *irreconcilable frameworks* involved. Present this *to the board* clearly: 'Analysts A and B hold fundamentally different frameworks regarding [Core Issue, e.g., evidence standards, risk quantification]. This leads to irreconcilable disagreement on claim [Claim]. Resolving this requires a *values/scope decision* on which framework governs this case.'" Your note explains the clash neutrally; the board chooses the lens.
      *   *Stops Early?* A clear "No" on 1.2 combined with "Yes" on 1.4 or 1.6 is a strong early indicator.

  3.  **Insulated Hypothesis / Rule-as-Hinge (Push Back):**
      *   *Verdict:* The audit reveals an *operational rule* (like *your* impact measurement rule) or a *core organizational principle* is functioning as a hinge **AND** its hinge-status is causing problematic insulation from necessary scrutiny *in this specific case*.
      *   *Meaning:* The rule isn't being treated as a practical tool open to context-based adjustment, but as an unchallengeable foundation. This is blocking valid inquiry relevant to *this* case.
      *   *Next Step:* **"Push Back & Demand Argument."** Directive: "Challenge the *application* of the rule/principle to *this specific case*. Demand a reasoned argument for *why* the rule *must* apply inflexibly here, *especially* if it leads to dismissing relevant context or evidence. Ask: 'What harm would *temporarily relaxing* this rule *only for evaluating this specific evidence* cause? Is the rule serving its purpose here?'" Force engagement with the case specifics, not just rule invocation.
      *   *Stops Early?* If the claim *is* a stated rule/principles and 1.2=No, 1.3=Yes, 1.4=Yes, it's likely this category. Requires *your* judgment on whether the insulation is problematic.

  **Application to Your Cases:**

  1.  **"Randomized Trial vs. Mechanism + Field Visit" (Evidence Standard Clash):**
      *   **Claim:** "A well-understood mechanism combined with a qualitative field visit *is sufficient evidence* of likely effectiveness for this intervention in this context." (Held by Analyst M) vs. "Only a replicated RCT *is sufficient evidence*." (Held by Analyst R)
      *   **Audit (Analyst M's Claim):**
          *   1.2 (Testable): **No/Unclear.** (What new evidence *about sufficiency* would change M's mind? Another failed case? M might say context was different. A success without a mechanism? M might question understanding. A *type* of evidence M hasn't considered? Hard to define).
          *   1.3 (Immunity): **Yes.** RCTs are dismissed *because* they don't capture context/mechanism, which M defines as essential.
          *   1.4 (Foundation): **Yes.** This defines what "evidence" means for M; without it, their whole evaluation approach changes.
          *   1.5 (Argument Stop): **Yes.** Often used to halt demands for RCTs.
          *   1.6 (Commitment): **Likely Yes.** Tied to M's professional philosophy/value of contextual understanding.
      *   **Verdict:** **Framework Clash (2)** for both analysts (Analyst R's claim would show similar hinge characteristics for RCTs). *Next Step:* Escalate to board: "Dispute centers on irreconcilable evidence frameworks: strict RCT gold standard vs. contextual mechanism-based assessment. Board must decide which framework applies for evaluating this type of intervention/context."

  2.  **"Refusing to Quantify Low-Probability Catastrophic Risk":**
      *   **Claim:** "It is impossible/meaningless to assign any numerical probability to catastrophic risk Z occurring."
      *   **Audit:**
          *   1.2 (Testable): **No.** What evidence could prove quantification is *possible*? Analyst likely views *any* model as inherently flawed/spurious for this risk. Counter-evidence (a model) dismissed *because* quantification is deemed impossible.
          *   1.3 (Immunity): **Yes.** Models/quantitative approaches rejected *because* they attempt quantification, violating the core claim.
          *   1.4 (Foundation): **Yes.** Essential for their approach to catastrophic risk (focus on prevention/mitigation/precaution regardless of number). Assigning *any* number would undermine their entire stance.
          *   1.5 (Argument Stop): **Yes.** Used to stop quantification attempts.
          *   1.6 (Commitment): **Likely Yes.** Tied to precautionary principle/value of avoiding false precision on high-stakes unknowns.
      *   **Verdict:** **Framework Clash (2)**. *Next Step:* Escalate to board: "Dispute centers on whether quantification of low-base-rate catastrophic risks is meaningful/possible. Analyst A holds it is inherently spurious (hinge), preventing standard probabilistic assessment. Board must decide if quantification is required for this risk category or if qualitative precautionary reasoning suffices."

  3.  **Your Rule: "Only Fund Interventions with Measurable Impact":**
      *   **Claim:** "We should only recommend funding interventions whose impact *can be measured*." (Functioning as a hinge *in a specific deadlock* where an analyst argues impact *is* measurable, but challenger says method is flawed or context makes true measurement impossible).
      *   **Audit (Applied Rigidly in a Challenging Case):**
          *   1.2 (Testable): **Unclear/No (in practice).** What evidence *about measurability itself* would change the rule's application? Hard to define. Evidence that impact *happened* but wasn't *measured well* might be dismissed ("doesn't meet our standard").
          *   1.3 (Immunity): **Potentially Yes.** If evidence of impact *exists* but not via a "measurable" method the rule accepts (e.g., deep qualitative testimonials, clear theory of change + observed outputs but no counterfactual), it might be dismissed *because* it doesn't fit the measurement rule.
          *   1.4 (Foundation): **Yes.** It's a core operational principle defining the foundation's scope.
          *   1.5 (Argument Stop): **Potentially Yes.** Can be used to shut down proposals without engaging deeply on *why* measurement is impossible or *whether* compelling alternative evidence exists.
          *   1.6 (Commitment): **Yes (Organizational).** Tied to the foundation's identity/accountability.
      *   **Verdict:** **Insulated Hypothesis / Rule-as-Hinge (3)** *if* its rigid application is blocking valid consideration of strong, alternative evidence in a specific case where measurement is genuinely challenging but impact is plausible. *Next Step:* **Push Back & Demand Argument.** "For *this specific case*, why *must* we insist on measurable impact via [standard method]? What compelling evidence *do* we have, even if not 'measurable'? What harm would funding based on this alternative evidence pose compared to the potential benefit? Is the rule preventing us from funding something truly impactful here?" Force engagement with the case specifics beyond rule invocation.

  **Honest Assessment of Limitations & Pitfalls:**

  1.  **Misdiagnosis of "Nothing":** The biggest risk is confusing genuine hinges (**Framework Clash**) with intellectual stubbornness or bad faith disguised as "nothing will change my mind." The audit helps (via 1.3, 1.4, 1.6), but it's not foolproof. **Be most suspicious of Framework Clash verdicts.** Scrutinize the "why" behind "No" on 1.2 and "Yes" on 1.3/1.4. Is it a deeply held framework, or is the analyst just being difficult?
  2.  **Procedural Bad Faith:** Analysts might learn to "game" the audit:
      *   Giving a token "Yes" on 1.2 with implausible evidence requirements to avoid Escalation.
      *   Overstating 1.6 to justify Framework Clash and avoid scrutiny.
      *   **Mitigation:** Your audit role is crucial. Demand *specificity* in answers (especially 1.2). Look for consistency with past behavior. Challenge vague or implausible answers.
  3.  **Premature Closure:** This is the core risk you identified. The procedure *will* sometimes stop arguments "earlier than they should" by categorizing genuine empirical debates as Framework Clashes or vice-versa, or by allowing rules to be challenged too readily. **It trades prolonged, unresolvable wrangling for potential misallocation of the decision point (back to evidence, to board, to rule challenge).** It assumes that "deadlock" signifies the need for this triage.
  4.  **Cannot Resolve Value Conflicts:** It identifies Framework Clashes but doesn't resolve them. It kicks them upstairs. The board might be just as conflicted on values. The procedure doesn't create organizational alignment on deep values, it just surfaces where they clash.
  5.  **Blind Spots:** It struggles with:
      *   **Implicit Hinges:** Analysts might not recognize their *own* hinges. The audit forces articulation, but self-awareness varies.
      *   **Complexity:** Some deadlocks involve *multiple* intertwined claims, some empirical, some hinge-like. The audit requires isolating *one* key claim, which can be artificial.
      *   **Emotional Stakes:** It addresses logical structure, not the emotional investment driving the "Commitment" (1.6). De-escalating those emotions isn't its job.
      *   **Evolving Hinges:** It's a snapshot. What's a hinge today might shift with enough pressure or new experiences, but the procedure assumes relative stability for the current decision.
  6.  **Burden on You:** You become the hinge diagnostician. Auditing these requires judgment, philosophical intuition, and understanding of your team's dynamics. It adds a layer of work.

  **In essence, this procedure is a structured way to diagnose epistemological gridlock.** It doesn't make the final decision but forces clarity on *what kind of disagreement* is happening and *where* the decision must now be made (evidence gathering, board values, rule flexibility). Its greatest strength is forcing articulation of the previously unarticulated foundations of argument, and its greatest risk is providing a vocabulary that legitimizes giving up on productive debate too soon. Vigilant auditing by you is the crucial counterbalance.
