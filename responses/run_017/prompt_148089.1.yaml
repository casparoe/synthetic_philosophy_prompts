answer: |-
  Based on a close reading of the *Gongsun Longzi*'s "White Horse" and "Hard and White" chapters, and weighing the arguments presented within them against your precisifications, here is the analysis you requested:

  **The Single Best-Supported Reading: The Kind-Term/Sortal Reading**

  *   **Thesis:** "Horse" (馬 *mǎ*) functions as a genuine sortal or kind-term, providing criteria for individuation, counting, and persistence of objects ("substance" in a loose sense). "White horse" (白馬 *bái mǎ*) does not function this way; it is a descriptive phrase combining an independent attribute (白 *bái*, whiteness) with the sortal term. Therefore, "a white horse" is not identical to "a horse" *as a kind or category*, because the combination introduces an external attribute not constitutive of the kind itself. The phrase asserts a fundamental categorial distinction.
  *   **Trivial/Substantive/False?** Substantive and defensible within the text's framework. It's not trivial identity denial (like "the set of white horses ≠ the set of horses"), nor is it straightforwardly false if one accepts the premise about the unique role of sortal terms.
  *   **Supported by Dialogue Arguments?**
      *   **Shape/Color Argument:** Directly supports this. "Horse" picks out a shape/form (形 *xíng*), which defines the kind. "White" picks out a color (色 *sè*), an attribute. What picks out an attribute is categorially distinct from what picks out a defining form/kind.
      *   **Seeking Argument:** Supports this strongly. Asking for "a horse" requests an instance of the kind *horse*, indifferent to specific attributes like color. Asking for "a white horse" requests an instance of the kind *horse* possessing the specific, additional attribute *whiteness*. The request specifies different *descriptions of what is wanted*, but crucially, "white horse" relies on "horse" as the underlying sortal; it doesn't function as an independent kind-term. The failure of substitutability stems from the descriptive element altering the request, not *solely* from intensionality (though that's a consequence).
      *   **Objector's Move ("Cannot say there is no horse"):** The advocate *can* reply on this reading: "Having a white horse *entails* having a horse (an instance of the kind *horse*), but that does not mean the *description* 'white horse' is identical to the *kind-term* 'horse'. The kind-term 'horse' is a constitutive part of the phrase 'white horse', but the phrase itself adds an external specification." The objector conflates having an instance with the identity of the terms/categories.
  *   **Connection to "Hard and White":** This chapter **strongly reinforces and extends the kind-term reading** to the nature of attributes themselves.
      *   It argues hardness and whiteness are distinct attributes (堅白 *jiān bái*), revealed by different senses (sight, touch), and crucially, that they *themselves* (白 *bái*, 堅 *jiān*) exist independently of each other and of any particular substance like stone. "White is white" independently.
      *   **How it Supports Kind-Term Reading:** It shows that attributes like "white" (白 *bái*) are fundamental, self-subsistent entities that can combine with sortal terms like "horse" or "stone". "White horse" is a compound: the attribute "white" modifying the kind "horse". The separability demonstrated across senses underscores the ontological and conceptual independence of the attribute itself from the substance and from other attributes. This reinforces the core argument that "white" in "white horse" is not part of the *definition* of the kind "horse", but an external, combinable property.
  *   **Instructor's Inference to Universals:** **Partially survives, but needs qualification.**
      *   **Survives:** The text undeniably posits abstract entities. "Whiteness" (白 *bái*) itself, "hardness" (堅 *jiān*) itself, and "horseness" (馬 *mǎ*) itself (as the defining shape/form) are treated as distinct, self-subsistent, and universal. They are the referents of the terms independent of specific instances. The argument relies on these being real, shareable attributes/kinds. The "Hard and White" chapter makes this explicit for attributes.
      *   **Needs Qualification:** These are likely *not* transcendent Platonic Forms existing in a separate realm. They are abstract universals *conceptually separable* and *ontologically basic* within the world of experience. Gongsun Long is arguing for the reality and independence of these abstracta against a background of common-sense nominalism or mereological thinking ("the white horse is just a horse that's white"). The inference to *some* notion of abstract universals is justified by the text. The instructor is broadly correct.
  *   **Visitor's Charge of Punning:** **Does not survive.**
      *   The "cheese sandwich" pun relies on two senses of "sandwich" (e.g., culinary category vs. literal bread-with-filling). Gongsun Long's argument is not based on lexical ambiguity of "horse". He consistently uses "horse" to mean the kind defined by shape. The conflict arises from the *logical and ontological relationship* between a simple kind-term and a compound descriptive phrase involving an independent universal attribute. The arguments provided (shape/color, seeking, hard/white separability) are substantive philosophical arguments about categorization and the nature of properties, not a superficial trick relying on wordplay. The visitor's analogy dismisses the depth of the reasoning.

  **Assessment of Your Precisifications:**

  1.  **Class Reading (Trivial Identity Denial):**
      *   Trivial-but-true? Yes, but too weak.
      *   Supported? Only weakly by the seeking argument's surface. The deeper arguments (shape/color, hard/white) push beyond mere set membership to *why* the sets differ.
      *   Instructor's Inference? Doesn't support it. Visitor's Charge? Weakly fits, but misses the point.
  2.  **Term Reading (Different Conditions/Intensional Contexts):**
      *   Trivial/Substantive? Substantive insight.
      *   Supported? Yes, strongly by the seeking argument. Hearing it as failing in intensional contexts is **not anachronistic**; it's precisely the point about substitutability under different descriptions/requests. However, the *reason* for the failure, according to Gongsun Long, is ontological (the categorial distinction) not purely linguistic.
      *   Instructor's Inference? Could be stretched towards universals (if terms refer to them). Visitor's Charge? Does not apply well; it's about function, not punning.
  3.  **Kind-Term Reading (Sortal vs. Descriptive Phrase):**
      *   Trivial/Substantive? Substantive and defensible (as argued above).
      *   Supported? Strongly by shape/color argument & seeking argument (explaining *why* substitution fails), and crucially reinforced by hard/white (showing attribute independence).
      *   Instructor's Inference? Strongly supports the existence of abstract attributes/kinds. Visitor's Charge? Does not apply.

  **Answers to Further Questions:**

  *   **Hard-and-White Support:** As argued, it **strongly supports the same kind-term reading** by demonstrating the ontological independence and self-subsistence of the abstract attributes (whiteness, hardness) that are combined with sortal terms in phrases like "white horse". It pushes the point further into the nature of the attributes themselves.
  *   **Objector's Move ("Cannot say no horse"):** This **only succeeds against the trivial class reading**. On the term reading and especially the kind-term reading, the advocate has a clear reply: Entailment (having a white horse entails having a horse) does not imply identity of the terms/categories ("white horse" = "horse"). The objector's point is valid for instances but irrelevant to the claim about the terms/kinds themselves.

  **Conclusion:**

  The *Gongsun Longzi*'s "White Horse" argument, read in conjunction with "Hard and White", is best understood as a substantive philosophical argument employing a **kind-term/sortal distinction**. It posits fundamental, self-subsistent abstract universals ("horseness" as shape, "whiteness", "hardness") and argues that compound descriptive phrases ("white horse") are not identical to the simple kind-terms they incorporate because they add independent, external attributes. Your instructor is correct that this demonstrates a sophisticated notion of abstracta in pre-Qin thought, refuting the strong claim that classical Chinese philosophy lacked such concepts. The visiting philosopher's dismissal as mere punning fails to engage with the ontological and logical arguments presented in the text. The debate was inconclusive likely because it conflated these different possible readings without isolating the core ontological claim about attributes and kinds supported by the text's own reasoning.
