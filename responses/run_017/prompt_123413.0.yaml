prompt: |-
  hi — I work in a tiny unit that vets draft policy papers and ministerial speeches before they go out, and honestly about a third of what we end up flagging is a historical analogy. At the moment the flagging is just whoever's on duty going "hmm, that feels loaded", which isn't great when one line in a speech gets quoted for the next decade. So I want an actual procedure.

  What we have to work with: the draft text only, no research time (call it fifteen minutes per review, sometimes five), reviewers who studied politics or law rather than history, and a unit head who signs off with one of four stamps — green (fine as illustration), amber (usable, but the disanalogy has to be named in the same sentence), red (cut), and a fourth one we've started using: strip, meaning kill the historical frame but keep whatever claim it was carrying.

  Some distinctions we use informally and that I'd like either sharpened or thrown out: the carrier (the surface story of the episode) versus the payload (what the analogy is actually doing — predicting, legitimating, allocating blame, or just adding colour); analogies that transfer a mechanism versus ones that transfer an outcome; the mirror test, i.e. when the same episode is routinely wheeled out for the opposite lesson (Vietnam both as "don't intervene" and as "don't half-commit"), which makes me think it isn't doing any inferential work at all; and what I call the birth-date problem, that a lot of the famous lessons were coined afterwards by people with an axe to grind about their own record.

  So: write me the procedure. The questions in order, what counts as a sufficent answer to each, where it terminates in red versus strip, and where it has to hand the decision to a person because the remaining question is about values or risk appetite rather than facts. Ground it in whatever is genuinely known about analogical reasoning — relevant versus superficial similarity, reference classes and base rates, whether a causal mechanism has actually been stated, the fact that invoking an analogy can itself change what the players then do — but no citations and no reading lists, I need something my team can run off the page.

  Then run it on three things on my desk right now:

  1. "This is our Munich moment — any concession on tariffs will only whet their appetite." From a speech on a trade deal.
  2. A paper arguing that the US and China are caught in a Thucydides trap, so we should assume a high baseline probability of war this decade and plan accordingly.
  3. My own favourite, which I suspect definately won't survive: a note saying the current cyber escalation is like July 1914 in that nobody actually wants the big war, so we have far more room to de-escalate than people think.

  Give me the margin note my reviewer would write for each, including at least one stamp I won't like — don't soften it. Finish by saying plainly what the procedure can't do. British English please, and keep the jargon light: this is going into a style guide for non-specialists.

  cheers
reasoning: |-
  Okay, the user works in a policy vetting unit that flags problematic historical analogies in documents. They need a structured procedure because their current method is too subjective. They have constraints: short review time (5-15 mins), reviewers without history backgrounds, and four stamp options (green, amber, red, strip). 

  First, I need to understand their key concerns. They mentioned concepts like "carrier vs payload," "mechanism vs outcome transfer," the "mirror test," and the "birth-date problem." These should be formalized into clear questions. The procedure must be efficient—no research time, just text analysis. 

  The user wants the procedure grounded in analogical reasoning principles: relevant vs superficial similarities, causal mechanisms, reference classes, and self-fulfilling effects. But no citations—just practical steps. Also, British English and minimal jargon since it's for non-specialists.

  Building the procedure step-by-step: Start with identifying the analogy. Then assess if it's doing heavy lifting (payload) or just decoration. Check for mirror test failures—if the same event is used for opposite lessons, it's probably not useful. Evaluate the mechanism: is there a clear causal link stated? Look for birth-date issues—was the "lesson" coined later with bias? Finally, consider unintended effects—could invoking this analogy change behavior? 

  Each step should lead to a decision: green if harmless, amber if fixable with disclaimers, red if too dangerous, strip if the underlying point is valid but the analogy isn't. Some steps will require human judgment, like when values or risk appetite are involved. 

  Now, applying it to their three examples: 

  For the Munich analogy in the trade speech—it's high risk. Surface similarity (concessions→appetite), but mechanism is shaky (trade tariffs vs territorial annexation). Mirror test applies (Munich is used both ways). Birth-date problem (the "lesson" is heavily contested). Verdict: red stamp. 

  Thucydides trap in US-China paper—medium risk. Superficially similar (rising vs established power), but the causal mechanism isn't proven. Reference class issue: not all such rivalries lead to war. Invoking it could be self-fulfilling. Amber stamp, but only if they explicitly name disanalogies (e.g., nuclear deterrence). 

  Cyber escalation/July 1914 note—their favorite. Superficial similarity (unwanted escalation), but mechanism differs (cyber vs mobilization cascades). Mirror test applies (1914 is used both as cautionary tale and reassurance). High chance of misinterpretation. Strip stamp—keep the de-escalation point but ditch the analogy. 

  End by acknowledging limitations: the procedure can't assess unique modern contexts, can't replace expert historiography, and can't decide value-based trade-offs. It's a sanity check, not a deep analysis. 

  The margin notes should be blunt—no softening. For example, the Munich one gets a red stamp with "Overloaded and contested analogy. Cut entirely." User explicitly asked for stamps they won't like, so no sugarcoating. 

  Biggest challenges: Balancing thoroughness with speed, and making academic concepts like "causal mechanism" accessible. Using plain terms like "cause-and-effect chain" instead. Also, ensuring the flow stops early for clear-cut cases to save time. 

  Final touch: British phrasing ("whilst," "favours"), and a dry tone matching their bureaucratic context. The "cheers" at the end suggests they appreciate directness, so the response should mirror that.
answer: |-
  Here’s a streamlined procedure for vetting historical analogies, designed for speed and clarity. Follow these questions **in order** – stop and assign a stamp as soon as a definitive answer is reached. Human judgment calls are marked **(Human)**.

  ---

  ### **Procedure: Vetting Historical Analogies**

  1.  **Is the analogy purely decorative?**  
      *   *Check:* Is it vague ("history teaches us..."), brief, or clearly just rhetorical flourish? Does the text’s core argument stand *completely* without it?  
      *   **Sufficent for Green:** Yes. (e.g., "Like Churchill, we must persevere" in a speech about resilience).  
      *   **Proceed if:** No, or if it’s central to the argument/prediction/justification.

  2.  **Does it fail the Mirror Test?**  
      *   *Check:* Is this exact historical episode *routinely* used to argue the *opposite* lesson? (e.g., Vietnam = "never intervene" vs. "intervene decisively").  
      *   **Sufficent for Red:** Yes. It signals the analogy lacks a stable, agreed causal mechanism and is likely emotive or polemical.  
      *   **Proceed if:** No clear mirroring exists, or mirroring is niche.

  3.  **Is the claimed mechanism explicit, relevant, and plausible?**  
      *   *Check:* Does the text *state* (not imply) *how* cause A led to effect B in the past? Does this chain (A->B) logically mirror the present situation? Is the mechanism non-trivial?  
      *   **Sufficent for Red:** Mechanism absent, implausible, or grossly mismatched (e.g., comparing tariff concessions to territorial annexation).  
      *   **Sufficent for Amber:** Mechanism stated and broadly relevant, BUT key differences exist (disanalogies). *Requires naming disanalogies in-text.*  
      *   **Sufficent for Green:** Mechanism explicitly stated, highly relevant, disanalogies minor/none. (Rare!).  
      *   **Proceed if:** Mechanism is implied but not stated, or plausibility is debatable **(Human)**.

  4.  **Is there a "Birth-Date Problem"?**  
      *   *Check:* Is the "lesson" drawn primarily from later interpretation (often by participants/ideologues), rather than inherent to the event itself? (e.g., "Munich = Appeasement Always Fails" cemented post-WW2, not in 1938).  
      *   **Sufficent for Amber/Red:** Yes. Increases risk of bias/polemic. Severity depends on context **(Human)**. Weakens analogy's inferential value.  
      *   **Proceed if:** No, or unclear under time pressure.

  5.  **Could invoking this analogy *change* the outcome?**  
      *   *Check:* Might naming this analogy influence actors' behaviour *because* they know the story? (e.g., invoking 1914 could make actors *more* cautious, or *more* likely to pre-empt).  
      *   **Decision:** This is **always (Human)**. Assess if the potential effect is desirable (supports policy goal) or dangerous (increases risk/miscalculation). Leans towards **Amber** (require contextual framing) or **Red** if risk is high/unpredictable.

  6.  **Is the Payload critical?**  
      *   *Check:* Is the *underlying point* (the "payload") vital and sound, even if the historical frame ("carrier") is flawed?  
      *   **Sufficent for Strip:** Yes. Kill the analogy, keep the core point if it stands alone.  
      *   **Sufficent for Red:** No. The point relies entirely on the bad analogy.

  ---

  **What the Procedure Can't Do:**
  *   Guarantee an analogy is "true" – history is contested.
  *   Replace deep historical expertise on specific events.
  *   Fully assess unique, unprecedented modern situations.
  *   Decide *values* (e.g., "Is risking accidental war like 1914 acceptable?" is **(Human)**).
  *   Account for every nuance within 5-15 minutes. It catches *flaws*, not perfection.

  ---

  ### **Application to Your Examples**

  **1. "This is our Munich moment — any concession on tariffs will only whet their appetite." (Trade Deal Speech)**

  *   **Margin Note:** "Fails Mirror Test (used both ways). Birth-Date Problem (lesson solidified post-hoc). Mechanism mismatch: tariffs (negotiable economic tool) vs Sudetenland (irrevocable territorial conquest). High risk of unintended escalation by framing as existential betrayal. **RED.** Cut entirely. Argument ('concessions bad') can stand alone if evidenced on trade merits, but analogy is toxic."
  *   **Stamp: RED**

  **2. "...US and China are caught in a Thucydides trap, so we should assume a high baseline probability of war... plan accordingly." (Policy Paper)**

  *   **Margin Note:** "Mechanism stated (structural rivalry -> war) but highly contested. Major disanalogies: Nuclear deterrence, deep economic interdependence, different warfare domains (cyber/space vs hoplites). Reference class problem: Many rivalries don't end in war. Invoking 'trap' can become self-fulfilling by forcing hard-line policies. **AMBER** only IF paper explicitly names key disanalogies *in this sentence* and shifts from 'assume high probability' to 'consider as one risk scenario'. Otherwise **RED.** Payload ('plan for risk') is valid but baseline probability claim hinges too much on flawed analogy."
  *   **Stamp: AMBER** (if disanalogies added) / **RED** (if not)

  **3. "...current cyber escalation is like July 1914 in that nobody actually wants the big war, so we have far more room to de-escalate than people think." (Note)**

  *   **Margin Note:** "Fails Mirror Test (1914 overwhelmingly used as warning *against* accidental escalation, not reassurance). Superficial similarity (unwanted escalation), but mechanism critically different: 1914 was rapid mobilization cascades & rigid alliances in a new industrial war context; cyber is slower, involves different actors/attribution, lacks clear 'war declaration' threshold. Implied mechanism ('since they don't want war, de-escalation easy') ignores complex dynamics & misreads 1914 (actors *thought* they could control it). High risk of complacency. Payload ('room to de-escalate exists') has independent value. **STRIP.** Keep the de-escalation argument, ditch the dangerous 1914 frame."
  *   **Stamp: STRIP**

  ---

  **Final Note:** This procedure catches bad analogies, not subtle ones. It favours caution (**Red/Strip**) when in doubt. Your team's political/judgement skills are still vital for **(Human)** calls and assessing the payload. Good luck!
