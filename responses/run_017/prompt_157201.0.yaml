    2: yes (employees have some independence) -> 3.
    3: yes (corporation has its own goals) -> leaf 3. (nested)

  - Human brain:
    1: no (neurons not goal-directed) -> 6.
    6: yes (brain is goal-directed) -> 7.
    7: yes (distributed structures) -> leaf 2. (matches)

  Now, leaf 4 (as-if) and leaf 5 (indeterminate) are not used in these cases. We can imagine a system that looks like it has goals but doesn't (like a thermostat) for leaf 4, and a rock for leaf 5.

  The key has 8 couplets.

  Now, which two leaves cannot be separated? 
  - The key separates all leaves. But leaf 2 and leaf 3 are clearly separated by the path (units' independence in goal-directedness).

  Unoccupied answer combinations:

  - A system that at 1: no (units not goal-directed alone), then at 6: no (whole not goal-directed), then at 8: no (not even as-if) -> leaf 5 (indeterminate). This is occupied by a rock.

  - A system that at 1: yes, then at 2: no, then at 4: no (not replaceable) -> leaf 1 (mind only in the units). Example: a group of people where each is essential and the whole has no organization beyond the individuals. But if the whole has no organization, then it might not be a system. This might be unattractive because if the units are replaceable then leaf 1 only if they are not controlled? But in this path, they are controlled (2: no) but not replaceable (4: no). Example: a unique set of irreplaceable ants? But ants are replaceable. This might be unclaimed or unattractive.

  - Another: 1: no, 6: no, 8: yes -> leaf 4 (as-if). Example: a simple algorithm that appears to have a goal.

  The most critical couplet: 
  - Couplet 1 because it splits between systems with potentially minded units and those without. If deleted, we lose the ability to separate the brain and the ant colony from the corporation.

  If we delete couplet 1, then we start with couplet 2, but couplet 2 assumes we know about the units' independent behavior. For a system like the brain, we wouldn't have the path for units without goal-directedness.

  So couplet 1 is doing the most work.

  Final key with 8 couplets:

  1. Do the individual units, when operating independently, exhibit goal-directed behavior? 
     - Yes: go to 2.
     - No: go to 6.

  2. When the units are part of the system, are they still able to exhibit goal-directed behavior that is not determined by the system? 
     - Yes: go to 3.
     - No: go to 4.

  3. Does the system as a whole exhibit goal-directed behavior that is not reducible to the sum of the units' goals? 
     - Yes: leaf 3 (nested minds: both the individuals and the colony have minds).
     - No: leaf 1 (mind only in the units).

  4. Can the system's organization and function be maintained when units are replaced? 
     - Yes: go to 5.
     - No: leaf 1 (mind only in the units).

  5. If the system is split into two parts, can each part become a full system with the same organization? 
     - Yes or No: leaf 2 (mind only in the colony; the units are not minded in the system context).

  6. Does the system as a whole exhibit flexible, goal-directed behavior? 
     - Yes: go to 7.
     - No: go to 8.

  7. Is the system's behavior guided by internal structures that are distributed and not localized to any one unit? 
     - Yes: leaf 2 (mind only in the colony).
     - No: leaf 4 (the system is a subject only in an as-if or instrumental sense).

  8. Does the system nevertheless appear to have goal-directed behavior from an external perspective? 
     - Yes: leaf 4 (as-if).
     - No: leaf 5 (indeterminate).

  Notes:
  - The key may not separate leaf 2 in couplet 5 and leaf 2 in couplet 7, but they are the same leaf.
  - For the split colony, we get leaf 2, which is intended.
  - The leaves are:
    - Leaf 1: mind only in the units.
    - Leaf 2: mind only in the colony.
    - Leaf 3: nested minds at both levels.
    - Leaf 4: the colony is a subject in an as-if or instrumental sense.
    - Leaf 5: indeterminate.

  Unoccupied combinations:
  - The path: 1: yes, 2: no, 4: no -> leaf 1. This might be unclaimed because if the units are not replaceable and are controlled by the system, but the system's organization depends on them, then why isn't the system minded? It might be that this combination is unattractive or rare.
  - The path: 1: no, 6: no, 8: no -> leaf 5. This is occupied by systems like a rock.

  Critical couplet: Couplet 1. If removed, the key would treat systems with units that are minded and those that are not the same from the start, leading to confusion between, for example, the corporation and the brain.

  This should fit on one page.
answer: |-
  Below is a dichotomous key designed for non-philosophers to explore the location and nature of mind in systems like ant colonies, corporations, and brains. It uses accessible, observable criteria (e.g., goal-directedness, replaceability, adaptability) and avoids jargon, thresholds of complexity, and unit counts. The key sorts your specified cases and outputs five possible verdicts:  
  - **Mind Only in Units**: Individual components (e.g., ants) have minds; the whole does not.  
  - **Mind Only in Colony**: The system as a whole has a mind; units are "cogs" without independent minds.  
  - **Nested Minds**: Both units and the whole have minds (e.g., units retain agency while contributing to a collective mind).  
  - **As-If/Instrumental**: The system acts *as if* it has a mind, but this is a useful fiction (e.g., for prediction), not a real mind.  
  - **Indeterminate**: Evidence is ambiguous; no clear verdict.  

  ### Dichotomous Key for Locating Mind  
  1. **Does the system as a whole pursue goals (e.g., survival, growth, resource gathering) that aren’t just the sum of its units’ actions?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 7.  

  2. **If you replaced *all* units with identical copies (e.g., swapping ants for rule-matching robots), would the system’s core behavior stay the same?**  
     - **Yes** → Go to 3.  
     - **No** → Go to 8.  

  3. **Is the system’s “memory” (e.g., trails, records, signals) stored in a way that no single unit holds it, but the collective does?**  
     - **Yes** → Go to 4.  
     - **No** → Go to 8.  

  4. **Can the system solve new problems (e.g., rerouting around obstacles) without changing its units’ basic rules?**  
     - **Yes** → Go to 5.  
     - **No** → Go to 9.  

  5. **Do units, when *part of the system*, still act on their own goals independently (e.g., an employee pursues hobbies while working)?**  
     - **Yes** → **Nested Minds**.  
     - **No** → Go to 6.  

  6. **If split into isolated halves, can each half rebuild the full system’s function?**  
     - **Yes** → **Mind Only in Colony**.  
     - **No** → **Mind Only in Colony**.  

  7. **Do the units *on their own* pursue flexible goals (e.g., foraging, avoiding threats)?**  
     - **Yes** → **Mind Only in Units**.  
     - **No** → Go to 10.  

  8. **Does the system’s behavior rely on a persistent core (e.g., a queen, CEO, or key region) that can’t be replaced?**  
     - **Yes** → **Mind Only in Units**.  
     - **No** → Go to 9.  

  9. **Does the system *appear* to learn, remember, or plan from an outside view?**  
     - **Yes** → **As-If/Instrumental**.  
     - **No** → **Indeterminate**.  

  10. **Does the system *as a whole* still seem goal-directed to an observer?**  
      - **Yes** → **As-If/Instrumental**.  
      - **No** → **Indeterminate**.  

  ---

  ### How Cases Sort  
  - **Normal colony**: 1Y→2Y→3Y→4Y→5N→6Y/N → **Mind Only in Colony**.  
    *(Units are replaceable cogs; memory is distributed; colony solves problems; units lack independence; splitting creates new colonies.)*  
  - **Queen-dead colony**: Same as above → **Mind Only in Colony**.  
    *(Organization persists without the queen; units remain replaceable.)*  
  - **Split colony**: 1Y→2Y→3Y→4Y→5N→6Y → **Mind Only in Colony**.  
    *(Each half becomes a new colony; units are replaceable.)*  
  - **Robot-swapped colony**: 1Y→2Y→3Y→4Y→5N→6Y/N → **Mind Only in Colony**.  
    *(Rules are preserved; system behavior unchanged.)*  
  - **Foraging team**: 1Y→2Y→3Y→4Y→5N→6N → **Mind Only in Colony**.  
    *(Acts as a single agent; units lack independence; splitting may not replicate the team.)*  
  - **Corporation**: 1Y→2Y→3Y→4Y→5Y → **Nested Minds**.  
    *(Employees have personal goals; company has collective goals; memory is distributed.)*  
  - **Human brain**: 1Y→2Y? → *See below*; or 1N→10Y→ **As-If/Instrumental**? *But wait*:  
    *(Units (neurons) aren’t goal-directed alone (1N→10), but the brain is goal-directed (10Y). However, neurons aren’t replaceable 1:1 (2N→8Y) → **Mind Only in Units**? Contradiction! This reveals a limitation—see notes.)*  

  ---

  ### Limitations & Unoccupied Combinations  
  - **Key Can’t Separate**: **Mind Only in Colony** and **As-If/Instrumental** for systems with distributed memory and adaptability but ambiguous "realness" (e.g., a colony with dead queen *might* be seen as a decaying system on autopilot, but the key sorts it as **Mind Only in Colony**).  
  - **Unoccupied Combinations**:  
    - **1Y→2Y→3Y→4N→9Y → As-If/Instrumental**: A system that appears adaptive but relies on unit-level changes. *Unclaimed*: Most systems (e.g., brains, colonies) adapt via collective structures, not unit changes.  
    - **1N→7Y → Mind Only in Units**: Units are goal-directed alone, but the whole isn’t. *Incoherent*: If units have minds and form a system, the whole likely pursues goals (making 1N false).  

  ---

  ### Critical Couplet: #2 (Replaceability)  
  - **Why it’s crucial**: It tests if the system’s identity depends on its organization (not specific units). Delete it, and the key conflates **Mind Only in Colony** (e.g., ants) with **Mind Only in Units** (e.g., a team of irreplaceable experts). Cases like the robot-swapped colony become unsortable.  
  - **Effect of deletion**: The key collapses toward behaviorism (focusing only on what the system *does*) and can’t distinguish systems where units are interchangeable (colony) from those where they’re unique (brain regions).  

  ---

  ### Key Design Notes  
  - **Anti-behaviorism**: Questions turn on *how* goals are pursued (e.g., distributed memory in #3) and *replaceability* (#2), not complexity.  
  - **Accessibility**: "Goals," "memory," and "problem-solving" are observable (e.g., trail networks = memory; rerouting = problem-solving).  
  - **Hofstadter alignment**: The key reflects his "signal clusters" (couplet #3) and colony-level cognition (outputs **Mind Only in Colony** for ant cases).  

  Print this key for your session—it fits one page and encourages debate without philosophy homework!
