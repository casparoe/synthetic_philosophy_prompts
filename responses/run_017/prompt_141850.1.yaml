answer: |-
  Below is a one-page diagnostic handout designed to sort students onto positions in the philosophy of art through concrete cases. Each question is answerable without prior theoretical knowledge. The scoring key maps answer patterns to major theories of art. **Do not skip ahead to the scoring key until you have answered all questions.**

  ---

  ### Art Status Diagnostic Quiz  
  *Answer each question based on your intuitive judgment. Choose one option per case.*

  1.  **The Undetected Forgery:** A painting is a perfect physical copy of the *Mona Lisa*, created by a forger to deceive. No one detects the forgery; it hangs in the Louvre, admired as the original. Is this painting a work of art?  
      A) Yes  
      B) No  

  2.  **The Repatriated Artifact:** A wooden mask is carved in a culture with no concept of art, used solely in sacred rituals. It is later displayed as art in a Paris museum. Finally, it is returned to its community and used in rituals again. During which period(s) is the mask a work of art?  
      A) Only when in the museum  
      B) When in the museum and after repatriation (in ritual use)  
      C) Never  

  3.  **The Isolated Creation:** In a remote society with no art traditions or institutions, a person creates an object physically identical to Van Gogh’s *Starry Night*. Is this object a work of art?  
      A) Yes  
      B) No  

  4.  **The Unseen Work:** A painter creates a canvas, never shows or describes it to anyone, and destroys it upon their death. Was it a work of art?  
      A) Yes  
      B) No  

  5.  **Elegant Creations:** A mathematical proof (written to solve a problem, not as art) and a composed chess problem (crafted for aesthetic elegance) are both widely praised for their beauty. Which, if either, is art?  
      A) Both  
      B) Only the chess problem  
      C) Neither  

  6.  **Found Object:** A curator places an unaltered, naturally formed stone in a gallery and declares it a work of art. Is it art?  
      A) Yes  
      B) No  

  7.  **Failed Art:** An artist sets out to create a profound sculpture but produces a piece critics call clumsy, derivative, and boring. Is it art?  
      A) Yes, it is (bad) art  
      B) No, it is not art  

  8.  **Ancient Artifact:** A decorated pot is made in 2000 BCE for storing grain. Its culture had no concept of art separate from craft. Was it art when created?  
      A) Yes  
      B) No  

  ---

  ### Scoring Key  
  Compare your answers to the patterns below. **Note:** *Anti-essentialism* (no definition exists) often overlaps with Institutional or Cluster views but resists fixed patterns.  

  | Theory                          | Answer Pattern (Q1–Q8)      | Core Commitment |  
  |---------------------------------|------------------------------|-----------------|  
  | **Institutional View**          | A, A, B, B, C, A, A, B      | Art-status requires current recognition by the artworld (e.g., museums, galleries). |  
  | **Intentional-Historical View** | B, C, B, A, B, B, A, B      | Art-status depends on the maker’s intention to relate to art history. |  
  | **Aesthetic Essentialism**      | A, B, A, A, A, B, A, A      | Art-status supervenes on perceptible aesthetic properties (e.g., beauty, form). |  
  | **Functionalist Essentialism**  | A, A, B, A, C, A, A, B      | Art-status requires fulfilling a function (e.g., aesthetic experience, expression). |  
  | **Cluster/Resemblance View**    | A, A, B, A, C, A, A, A      | Art-status is determined by multiple criteria (e.g., intention, form, context), no one essential. |  
  | **Evaluative Essentialism**     | A, B, A, A, A, B, B, A      | Art-status requires positive aesthetic value (bad art is not art). |  

  #### Diagnostics:  
  - **Unoccupied Combination Example:** `Q1=A, Q2=B, Q3=B, Q4=B, Q5=C, Q6=A, Q7=A, Q8=B`  
    - *Why empty?* Incoherent. Q2=B requires art-status to persist after institutional loss (permanent status), but Q4=B denies status to an intentionally created work. Few theories pair permanence with rejection of private art.  
  - **Indistinguishable Pair:** Institutional View vs. Functionalist Essentialism.  
    - *Separating Question:* Q4 (Unseen Work). Institutional: B (no public uptake), Functionalist: A (function fulfilled by creation).  
  - **Highest-Impact Question:** Q2 (Repatriated Artifact). Splits theories on relationality (A vs. B), permanence (B), and anti-relationality (C).  

  #### Design Notes:  
  - **Cases Cover:** Perceptible vs. relational properties (Q1, Q3, Q6), institutional vs. historical relations (Q2, Q8), status change (Q2), pre-art objects (Q3, Q8), and evaluation (Q7).  
  - **Compactness:** 8 questions fit one page. Cases avoid theoretical terms.  
  - **Anti-essentialism:** Not listed in the key as it rejects fixed patterns; emerges from inconsistent answers or resistance to groupings.  

