          - The key lesson: no matter what voting rule we use (plurality, thermometer, etc.), if there are at least three options, there is a possibility that voters can benefit by not voting sincerely. And this isn't because they are bad people; it's a feature of the rules.
          - The Gibbard-Satterthwaite theorem (which you can name now) says that any voting rule that is deterministic and allows any possible preference order will be manipulable in this way unless it is dictatorial.
          - Your pet hypothesis: throwing away intensity. In the plurality vote, we only recorded your top choice. In the thermometer, we tried to capture intensity, but we saw that it might be manipulated by exaggeration. So it's not a perfect solution.
          - What the activity shows: that strategic voting can happen and can change outcomes, and that it can be beneficial or harmful. But it doesn't show that every rule is always manipulable (we only tried two rules) or that every preference profile will have these issues. In particular, if preferences were restricted (like everyone agrees on the left-right spectrum) then some rules might be strategy-proof. But in general, when preferences are diverse, these problems arise.

     - Address potential wrong lessons:
          - Not "democracy is hopeless": there are ways to mitigate (like using different rules, or having runoffs) but no perfect solution.
          - Not "it's just human nature": the theorem says it's a mathematical inevitability given the rules.

     - What we couldn't show:
          - The theorem says it's impossible for any rule (with more than 2 options) to be both strategy-proof and non-dictatorial. We only tried two rules.
          - The generality: we used one preference profile. There are many others.
          - The difference between one manipulator and a bloc: we saw a bloc (Group3) manipulating. But sometimes one person can manipulate.

  Potential issues and solutions:
  - Someone votes insincerely out of contrarianism: In Round1, if someone does that, it might mess up the sincere outcome. Solution: remind them that the points are based on their true preferences, so they are only hurting themselves. But if they do, then in debrief we can use it as an example of why strategic voting might be harmful to the individual.
  - Doesn't get the scoring: Explain clearly and do an example.
  - Concludes democracy is hopeless: In debrief, emphasize that we can design better rules that are harder to manipulate, but none are perfect. And that's why we have institutions and norms.
  - Tries to coordinate out loud: Say that they must vote privately. If they do, remind them that the exercise is about private voting.

  For the thermometer round, we can add a twist: after they assign scores, we can ask if anyone wants to change their scores after hearing something? But we don't want to complicate.

  Given the complexity, we'll stick to the above.

  Preference card example (for Group1):

  "Your true preferences for the outing:
  1. Art Museum (A)
  2. Botanical Gardens (B)
  3. City Park (C)

  Payoff:
  - If Art Museum wins: 3 points
  - If Botanical Gardens wins: 2 points
  - If City Park wins: 1 point

  Keep this card private."

  Similarly for others.

  We'll assume 10 participants. If there are 9, adjust the numbers (e.g., 3,3,3).

  Run the game and adapt as needed.
answer: |-
  Below is a complete, runnable game designed for your "Great Questions" group. It uses physical materials (cards, ballots, a hat, whiteboard), requires no digital tools, and runs in 75 minutes. The game is structured to let participants experience strategic voting and the limits of voting systems through hands-on play, focusing on three rounds: blind plurality, peek plurality (with straw poll), and your "thermometer rule." The debrief explicitly connects their experiences to the key ideas without jargon until the end. Stakes are bragging rights (track points via tokens or whiteboard tallies).

  ---

  ### **Game Overview**
  - **Scenario**: The group is choosing where to go for their "end-of-term outing." Options are:
    - **A** = Art Museum  
    - **B** = Botanical Gardens  
    - **C** = City Park  
  - **Participants**: 9–10 players (adjust numbers slightly if needed; core math works for 9 or 10).  
  - **Materials**:  
    - Preference cards (one per player, hidden)  
    - Voting ballots (paper slips)  
    - Straw poll slips (for peek round)  
    - Thermometer ballots (for thermometer round)  
    - A hat or bowl for collecting votes  
    - Whiteboard to track results  
    - Tokens (e.g., poker chips) or whiteboard tally for points  
    - Bad coffee (essential).  

  ---

  ### **Step-by-Step Setup & Rules**  
  **Preference Cards Setup**  
  Create three types of hidden preference cards (distribute as below for 10 players; for 9, remove one "Group 1" card):  
  - **Group 1 (4 players)**: Prefers A > B > C. Payoff: A = 3 pts, B = 2 pts, C = 1 pt.  
    *Card text: "Your true preferences: Art Museum (A) > Botanical Gardens (B) > City Park (C). If A wins, you get 3 points. If B wins, 2 points. If C wins, 1 point."*  
  - **Group 2 (3 players)**: Prefers B > C > A. Payoff: B = 3 pts, C = 2 pts, A = 1 pt.  
    *Card text: "Your true preferences: Botanical Gardens (B) > City Park (C) > Art Museum (A). If B wins, 3 points. If C wins, 2 points. If A wins, 1 point."*  
  - **Group 3 (3 players)**: Prefers C > B > A. Payoff: C = 3 pts, B = 2 pts, A = 1 pt.  
    *Card text: "Your true preferences: City Park (C) > Botanical Gardens (B) > Art Museum (A). If C wins, 3 points. If B wins, 2 points. If A wins, 1 point."*  

  **Why this distribution?**  
  - In sincere voting, A wins (Group 1’s 4 votes dominate).  
  - In strategic voting, Group 3 may abandon C for B to avoid A (works), but if preferences differed slightly (e.g., C > A > B), this would backfire. The peek round creates tension around this.  

  **Payoff Scheme**  
  - Points = bragging rights. Track cumulative points per player on the whiteboard.  
  - Winner = player with most points after all rounds (small candy prize or "Outing Planner" title).  

  ---

  ### **Timeline (75 Minutes Total)**  
  #### **1. Introduction (5 min)**  
  - **Goal**: Set the scene. No theory, just rules.  
  - **Script**:  
    > "Today, we’re choosing our end-of-term outing! Options: Art Museum (A), Botanical Gardens (B), City Park (C). Each of you has a card with your personal preferences—keep it hidden. We’ll vote in three rounds. After each, you’ll get points based on the winner and your card. Most points wins bragging rights. Questions? Let’s play!"  

  #### **2. Round 1: Blind Plurality (15 min)**  
  - **Goal**: Show sincere voting "working" (A wins).  
  - **Rules**:  
    - Each player votes for **one option** on a ballot. No discussion.  
    - Tally votes openly on the whiteboard. Most votes wins.  
  - **Expected Outcome**: A wins (4 votes from Group 1).  
    - *Payoffs*: Group 1 gets 3 pts each, Group 2 gets 1 pt, Group 3 gets 1 pt.  
  - **Why this round?** Baseline where honesty doesn’t obviously backfire.  

  #### **3. Round 2: Peek Plurality (20 min)**  
  - **Goal**: Create temptation to vote strategically using a noisy straw poll.  
  - **Rules**:  
    - **Step 1 (Straw Poll)**: Hand out slips asking, "Which option are you leaning toward?" Collect and tally on whiteboard. *Do not enforce honesty*—players can lie or change their minds.  
    - **Step 2 (Real Vote)**: After showing the straw poll, players vote again (same ballot as Round 1).  
  - **Straw Poll Setup**:  
    - "Accidentally" make the poll noisy:  
      - Whisper to 1–2 players (e.g., the ex-councilman or an engineer) to "misreport" for realism (e.g., a Group 3 player says A to confuse others).  
      - Expected noisy tally: A: 4–5, B: 2–3, C: 2–3.  
    - **Why noisy?** Ensures partial information—players see C is weak but can’t trust the data.  
  - **Expected Behaviors**:  
    - Group 3 may abandon C for B to stop A (works: B wins with 6 votes).  
    - If no one defects, A wins again.  
  - **Outcomes to Highlight**:  
    - **Success**: If Group 3 switches, B wins → Group 2 gets 3 pts, Group 3 gets 2 pts, Group 1 gets 2 pts.  
    - **Backfire Risk**: If Group 3 had preferred A > B (they don’t), switching would give them 1 pt instead of 2. Debrief will contrast this.  
  - **Why this round?** Players see gaming is tempting and can work, but it’s fragile.  

  #### **4. Round 3: Thermometer Rule (20 min)**  
  - **Goal**: Test your hypothesis—does capturing "intensity" prevent gaming? Spoiler: No.  
  - **Rules**:  
    - Each player rates **all options** 0–10 on a ballot (10 = love, 0 = hate).  
    - Sum the scores for each option. Highest total wins.  
    - *No straw poll*—vote blind.  
  - **Key Instructions**:  
    > "Rate how much you genuinely like each place. But remember: your points depend on the winner matching your hidden card."  
  - **Expected Behaviors**:  
    - Sincere voters: Rate linearly (e.g., Group 1: A=10, B=5, C=0).  
    - Strategic voters: Exaggerate (e.g., Group 3: C=10, B=0, A=0 to boost C/hurt B).  
  - **Outcome**:  
    - Sincere tally: A=40, B=65, C=45 → B wins.  
    - If Group 3 exaggerates (C=10, B=0, A=0): B still wins (B=60, C=45, A=40).  
    - **The Hole**: Exaggeration doesn’t help Group 3, but if Group 1 exaggerates (A=10, B=0, C=0), B still wins. Players see pumping extremes doesn’t pay here—but the system is still manipulable (e.g., in other scenarios, exaggerating could work).  
  - **Why this round?** Tests intensity without fixing the core problem.  

  #### **5. Debrief (15 min)**  
  - **Goal**: Connect experiences to the big ideas. No jargon until the end.  
  - **Script**:  
    > "Let’s recap:  
    > - **Round 1 (Blind)**: We voted honestly. A won. Most got what they expected—no surprises.  
    > - **Round 2 (Peek)**: We saw the straw poll. Some changed votes to avoid ‘losing’ (e.g., C voters switching to B). When it worked, B won—better for some, worse for others. But if C voters had *liked A more than B* [show hypothetical card: C > A > B], switching would’ve backfired: they’d get 1 pt instead of 2.  
    > - **Round 3 (Thermometer)**: We added intensity. But did exaggerating your scores help? [Discuss responses.] In this case, no—but in other situations, it might.  
    >  
    > **The Big Lessons**:  
    > 1. When we added partial info (the peek), gaming became tempting—not because we’re ‘bad,’ but because the rules made it rational.  
    > 2. Even with intensity (thermometer), the rule can be gamed—exaggeration is a type of strategy.  
    > 3. This isn’t about ‘human nature’—it’s a math problem. One famous result (Gibbard-Satterthwaite) says: *With 3+ options, any fair voting rule can be manipulated.*  
    >  
    > **What We Didn’t See (Limitations)**:  
    > - The theorem says this is **universal**—no voting rule escapes it. We only tested two.  
    > - We assumed preferences are **unrestricted** (no shared ‘spectrum’). If everyone agreed on, say, left vs. right, some rules work better.  
    > - We saw **individual gaming**, but blocs can do it too (e.g., if Group 2 and 3 teamed up).  
    > - Your hypothesis about intensity? It *helps* but doesn’t fix the core issue—gaming is still possible.  
    >  
    > **Final Thought**: Democracy isn’t hopeless—we mitigate this with norms, runoffs, or ranked ballots. But perfection? Math says no."  

  ---

  ### **Handling Predictable Issues**  
  | Issue | Solution |  
  |-------|----------|  
  | **Contrarian voter** (votes insincerely "for fun") | Remind them points are tied to their hidden card: "You’re hurting your own score." If they persist, use it in debrief: "See? Gaming can backfire individually too." |  
  | **Confusion about scoring** | Walk through a payoff example publicly: "If your card says A>B>C and B wins, you get 2 points." |  
  | "**Democracy is hopeless!**" | Debrief emphasizes mitigation: "We reduce gaming with better rules—but perfection isn’t possible." |  
  | **Out-loud coordination** | Gently interrupt: "Let’s keep votes private so we all experience the system." |  
  | **Hard of hearing** | Print key rules on cards. Use whiteboard for all tallies. |  

  ---

  ### **What the Activity Can’t Replicate (and How to Explain)**  
  - **Generality of the theorem**:  
    > "We only tested two rules with one set of preferences. The theorem says *all* non-dictatorial voting rules with 3+ options suffer this—but we’d need infinite rounds to prove it."  
  - **Unrestricted preferences**:  
    > "We assumed diverse preferences (e.g., no ‘liberal-conservative’ spectrum). If preferences were aligned, some rules work better—but life isn’t that tidy."  
  - **Individual vs. bloc manipulation**:  
    > "We saw one person changing votes. But groups can collude—like parties—which is even harder to stop."  

  ---

  ### **Why This Works**  
  - Players **experience** gaming/backfiring, making the theorem feel visceral.  
  - Your "thermometer rule" is tested empirically—players see its limits without you lecturing.  
  - The debrief maps moments (Round 2’s peek, Round 3’s scores) to concepts, separating evidence ("we saw gaming work") from assertion ("all rules suffer this").  
  - No jargon until the end keeps focus on intuition.  

  Run this, and your group won’t just understand Gibbard-Satterthwaite—they’ll have *felt* it. And yes, the coffee should be bad. It’s tradition.
