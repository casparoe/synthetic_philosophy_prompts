prompt: |-
  I write literary fiction. My third novel is in its final revision, and it turns on a betrayal. My difficulty is not structural but moral: my own judgments about how much blame a character deserves, and my readers' judgments, keep shifting with things those characters did not choose, and the last chapter has to take a stand. I would like a principle that either licenses or forbids those shifts.

  Here are my verdicts, given as a novelist gives them — on the page, with the scene fixed.

  1. Two characters drive home drunk from the same party, at the same speed, down the same road. One arrives safely. The other strikes a child who runs out between parked cars. I blame the second substantially more, and so does every reader who has seen the draft. When I stipulate in the text that their carelessness and their indifference were exactly alike, the gap narrows and then stubbornly persists.

  2. Another character, born suspicious and quick to take offence, destroys a friendship. I do not treat her temperament as mitigating. She no more chose it than the second driver chose the child, and yet only one of these feels like luck to me.

  3. A man who would certainly have betrayed his brother under interrogation is never arrested. My early readers refuse to blame him at all. I blame him a little, on the strength of what the narrative shows of his dispositions.

  4. I drafted the same betrayal twice: once as a scene, in real time, and once summarised in retrospect by another character. The action, the motive, and the consequence were identical. Readers blamed the betrayer far more in the scenic version. I take this to be illegitimate, but I cannot make myself stop feeling it, and I have to decide which draft to keep.

  Cases 1 and 2 are the pair I cannot reconcile, and I would rather be told which to give up than be given a principle that silently accommodates both.

  The principle I have been working from, such as it is: blame tracks the quality of will an action manifests; facts outside the agent's control matter only as evidence of that will, and drop out once the evidence is held fixed. Case 1 survives the stipulation, so this principle fails it. Case 5 is worse for it, since the rendering changes no evidence at all.

  The case I go back and forth on is the one that makes the whole exercise feel like a trap: every one of these characters is determined, in the most literal sense, by me. I wrote the temperament, the child, the road, the arrest that never came. If absence of control excuses, then no fictional character is ever blameworthy and my book is a cheat; if it does not, then the control condition is doing no work anywhere. So I need to know which way the principle jumps here, and whether the fact that readers blame invented agents while knowing them to be invented tells us anything about what blame is for.

  What I want, in under 700 words: one sentence stating the principle you think survives; then a table with a row per clause — the clause, the case of mine that motivates it, the verdict of mine it overturns, and its prediction for one case I have not listed — including a row for the determined-character case; then two or three sentences on which of my verdicts you would throw out and what it costs me as a novelist to throw it out. No footnotes, and nothing that depends on my having read the literature; a friend at university gave me the labels resultant and constitutive luck for cases 1 and 2, and that is the extent of my vocabulary here.
reasoning: |-
  Hmm, the user is a literary fiction writer grappling with moral judgments in their novel about betrayal. They've presented four specific cases where their own and readers' blame assessments shift based on factors outside characters' control, creating tension in their final revision. They want a consistent moral principle that either allows or prohibits these shifts.

  The cases are fascinating: drunk drivers with different outcomes but identical choices (resultant luck), a character with innate temperament destroying a friendship (constitutive luck), a man who would've betrayed under interrogation but wasn't tested (dispositional blame), and the same betrayal presented scenically vs summarily (narrative framing effect). Their proposed "quality of will" principle fails when outcomes affect blame despite identical intentions.

  The core philosophical conflict they articulate is devastating: as the creator of these determined characters, how can any be truly blameworthy? If lack of control excuses everything, the novel loses moral weight; if not, control seems irrelevant. They specifically request a principle that survives scrutiny, a clause-by-clause analysis table, and guidance on which verdict to discard.

  I'll propose a principle focusing on *expressed agency* - blame attaches not to inner states but to how will manifests in the world. This resolves the drunk driver paradox: the actual collision expresses disregard in a way mere potential doesn't. For the temperament case, the expressed action (destroying friendship) matters more than unchosen traits. The table will show this principle upholding their verdicts except the dispositional blame case, which it rejects since no betrayal occurred.

  The narrative framing effect (case 4) gets special treatment: readers' increased blame in scenic rendering is legitimate because it better conveys the quality of will through immediacy. This validates keeping that version. The creator's dilemma gets its own row - blameworthiness depends on the story's internal logic, not characters' metaphysical freedom.

  I'll recommend discarding their verdict in case 3 (blaming the unarrested man) because without action, there's nothing to blame. The cost to them as a novelist is losing subtlety in portraying moral fragility, but gains consistency. The temperament case (2) stands because the action was taken - constitutive luck doesn't excuse the expressed choice.

  This approach preserves moral stakes while acknowledging luck's role: what matters is what characters *do* with what they're given. The 700-word limit means compressing each justification to its essence, using their terminology without philosophy jargon.
answer: |-
  Here is your principle, table, and verdict recommendation:

  **Principle:** Blame attaches to *expressed agency* – the concrete manifestation of will in action within the narrative world – not solely to inner states or hypotheticals; outcomes matter as the *realized expression* of disregard, while constitutive traits matter only as the *channel* through which will is expressed, not as independent excuses.

  | Clause                                      | Motivating Case | Overturns Verdict | Prediction for New Case: Character accidentally saves a life while committing a selfish act (e.g., pushing someone aside to steal, inadvertently knocking them out of a bullet's path) | Determined-Character Case |
  | :------------------------------------------ | :-------------- | :---------------- | :--------------------------------------------------------------------------------------------------------------------- | :------------------------ |
  | Blame requires a harmful *action* performed (or culpably omitted). | Case 3 (Unarrested Man) | Blaming the unarrested man based on disposition alone. | No blame for the saving outcome (it was accidental luck), but full blame remains for the attempted theft/selfish push. | Blame applies *within the story's logic* based on expressed agency, regardless of authorial determination. |
  | Outcomes matter as the *actual realization* of the risk inherent in the agent's disregard. | Case 1 (Drunk Drivers) | The gap in blame between drivers persists legitimately. | The negative *intended* action (theft/push) is blameworthy; the positive *unintended* outcome is not praiseworthy. | Outcomes are part of the determined character's expressed agency within the narrative. |
  | Constitutive traits (temperament) are the *mode* of agency, not its negation; blame attaches to the *choices made* using that temperament. | Case 2 (Suspicious Character) | Potential view that temperament inherently mitigates. | Temperament might explain *how* the selfish act was done, but doesn't excuse *that* it was done. | The character's temperament is part of their determined agency; choices made *with* it are blameworthy actions. |
  | Narrative rendering (scene vs. summary) shapes the *perception* of expressed agency; increased blame in scenic rendering is legitimate if it better reveals the *quality of will* in the action. | Case 4 (Scenic vs. Summary Betrayal) | View that the blame difference is illegitimate. | A scenic rendering of the accidental save would likely *reduce* any misplaced sense of praiseworthiness by emphasizing the selfish intent. | The author's choice of rendering determines how the character's agency (and thus blame) is *presented* to the reader. |

  **Verdicts to Throw Out & Cost:**
  Discard your verdict in **Case 3** (blaming the unarrested man). Without the *action* of betrayal, there is no expressed agency to blame, only a culpable disposition. The cost is losing the subtlety of blaming potential, but it gains consistency: blame requires a deed. Uphold **Case 2** – destroying the friendship *is* the harmful action expressing her will, regardless of unchosen temperament. The cost is accepting that blame can feel harsh when channeled through constitutive luck, but the principle demands it for the action taken. Keep the scenic draft of the betrayal **(Case 4)**; its power to convey the quality of will justifies the increased blame readers feel.
