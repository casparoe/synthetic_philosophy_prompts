prompt: |-
  I'm putting together the discussion notes for a graduate seminar on philosophy of mind that I'm TA-ing this term, and the session on emotion is the one I keep rewriting. I've got the cognitivist/judgmentalist material in decent shape, so I want to set that aside and spend the session on the two views that my students conflate most: on the one hand, the broadly perceptual picture, on which an emotion is an experience in which an evaluative property shows up for the subject — non-inferential, world-directed, recalcitrant in the face of the subject's own better judgment, and answerable to how things are rather than to what the subject wills; on the other hand, a conative or enactivist picture, on which what makes a state an emotion is not its representational content at all but the way it reorganizes the subject's field of salience and action-readiness — urgency, approach and avoidance, bodily and interpersonal posture, the takeover of attention — with the intentional object fixed by whatever that reorganization is a response to, and evaluative content entering only as a gloss the subject (or the theorist) puts on the orientation. A friend in the seminar insists these aren't really rivals, that one is describing what the emotion is *of* and the other what the emotion *does*, and I want to press hard on whether that's true or whether they genuinely collide.

  What I need is a structured comparison that works through the collision points rather than summarizing each view in turn. Please say, for each theory: what fixes the identity of an emotion type (what makes a given episode the same emotion as another, and what makes anger differ from fear); what does the explanatory work in accounting for the emotion's motivational force; what its correctness or fittingness conditions are and whether they are inherited from something independent of the emotion; and whether the emotion is held to detect its value or in any sense to confer or constitute it — think of love appearing to make its object matter, or something's becoming contemptible partly in virtue of one's contempt. Then run both theories, side by side, through four cases I've been collecting: (i) second-order emotions such as shame at one's own fear, anxiety about being anxious, or amusement at one's own grief, where the object is itself a state with content and one needs some account of how one emotion takes another as its object; (ii) objectless-but-situated states — caffeine dread, Sunday-evening dread, the free-floating elation of a manic episode — where no candidate proposition seems to be available; (iii) a double dissociation I've been using, between what I'll call motivational anesthesia (the full evaluative experience with no action-readiness or bodily mobilization) and affective blindsight (the full autonomic and behavioral profile of fear — avoidance, vigilance, startle — with the subject reporting no sense of anything being threatening); and (iv) emotions directed at causally inert, absent, or impossible objects — awe at a proof, indignation at a wrong done centuries ago, grief at the heat death of the universe, nostalgia for a place that never existed. Feel free to add one case of your own if some further case does more diagnostic work than these.

  Finish with a verdict section: which of the two is the more promising research program, what supplementary machinery each would have to bolt on in order to survive the cases it handles worst, and — this is the part I most want — one specific consideration that would make you abandon your verdict, plus an honest account of which parts of the disagreement are substantive and which are merely differences in what the two theories count as the theory's explanatory target. Aim for around 1,200 words, prose with headings rather than bullet dumps; assume an audience of graduate students who have read the standard literature, so you can use terms like direction of fit, recalcitrance, formal object, and fittingness without defining them. Please don't spend any words on citations, a bibliography, or suggestions for further reading — I'll insert the references myself, and the reading list is fixed by the syllabus.
reasoning: |-
  Okay, let me approach this request systematically. The user is a philosophy TA needing help structuring a graduate seminar discussion on two competing theories of emotion: perceptualism and enactivism. They've clearly done deep preparation but struggle with how to present the collision points effectively.

  First, I need to understand the core tension: perceptualism frames emotions as value-perceptions, while enactivism sees them as action-oriented engagements. The user's frustration with students conflating these suggests I should highlight where the theories genuinely disagree rather than complement each other. Their four test cases are carefully chosen to probe theoretical limits.

  For the structural comparison, I'll organize around:
  - Emotion identity criteria (what makes anger anger)
  - Motivational explanation (why emotions move us)
  - Fittingness conditions (when emotions are appropriate)
  - Value detection vs constitution (do emotions reveal or create value?)

  The four test cases are brilliant diagnostic tools:
  1. Second-order emotions challenge both views' object relations
  2. Objectless states strain perceptual content
  3. Dissociation cases pit experience against behavior
  4. Non-existent objects test intentionality mechanisms

  I'll add a fifth case about shared emotions (like collective grief) to test social dimension handling - an area both theories often neglect. 

  The verdict should avoid false compromise while acknowledging complementary strengths. Key will be showing where each theory needs "bolted-on" machinery to survive counterexamples, and specifying what evidence would make me reconsider the judgment. 

  Throughout, I'll maintain graduate-level discourse, using terms like "formal object" and "direction of fit" without explanation as requested. The tone should be rigorous but accessible - these are peers wrestling with complex material. Most importantly, the analysis must serve the user's pedagogical need to make the collision palpable in the seminar room.
answer: |-
  ## Perceptual vs. Enactivist Theories of Emotion: A Collision Analysis

  Your friend’s claim that perceptualism and enactivism describe different aspects (the "what it's of" vs. "what it does") captures an intuitive appeal but masks deep theoretical incompatibilities. Let’s dissect the collision points through core questions and diagnostic cases.

  **I. Core Theoretical Commitments: Side-by-Side**

  *   **1. Fixing Emotion Identity:**
      *   **Perceptualism:** Identity is primarily fixed by its *evaluative representational content* – the specific *formal object* perceived (e.g., the *offensive* for anger, the *threatening* for fear). An emotion is anger iff it presents its object *as offensive*. Similarity in perceived evaluative property determines similarity in emotion type.
      *   **Enactivism:** Identity is fixed by the *distinctive pattern of action readiness, bodily engagement, and salience organization* (e.g., anger = *readiness to aggress/remove obstacle* with specific bodily tension and narrowed focus on the offending object; fear = *readiness to avoid/escape* with hypervigilance and freezing/fleeing bodily set). The "what it's of" (intentional object) is determined by what *caused* or *is the focus of* this reorganization. Anger differs from fear because it prepares the body/mind for attack rather than flight.

  *   **2. Explaining Motivational Force:**
      *   **Perceptualism:** Motivation is *contingent* and *downstream*. Seeing something *as dangerous* (the fear-experience) typically *causes* a desire to avoid it and associated bodily changes. However, the core emotion *is* the evaluative perception; motivation is a frequent but separable consequence. Recalcitrant fear shows the perception can persist without motivation.
      *   **Enactivism:** Motivation is *constitutive*. The emotion *just is* the preparation for action – the readiness *is* the motivational force. Anger *is* the mobilization to aggress. The bodily changes, attentional focus, and action tendencies aren't effects; they *are* the core of the emotional state. Motivation isn't added; it's intrinsic to the emotion's identity.

  *   **3. Correctness/Fittingness Conditions:**
      *   **Perceptualism:** Fittingness is straightforward: an emotion is fitting iff its represented evaluative property is *instantiated* by the object (e.g., fear is fitting iff the object *is* dangerous). These conditions are *inherited* from the independent evaluative property it purports to detect. The emotion's job is to *track* objective (or at least intersubjective) evaluative facts.
      *   **Enactivism:** Fittingness is more complex and potentially *relational*. An emotion's orientation might be *appropriate* or *warranted* given the situation's demands on the organism's well-being, goals, or social context. However, the evaluative property ("dangerous," "offensive") is often seen as a *label* applied *post hoc* to the enacted pattern, not its core content. Fittingness may involve the *suitability of the enacted orientation* to the actual circumstances, not correspondence to a pre-existing evaluative fact detected. Value might be constituted *in* the response (e.g., the offense *is* constituted partly by the anger-response it elicits in a social context).

  *   **4. Value: Detection or Constitution?**
      *   **Perceptualism:** Primarily *detection*. Emotions (ideally) reveal pre-existing values in the world. Love seems to *discover* the beloved's lovable qualities. Fear detects danger. While emotions can shape attention, the core claim is epistemic: they are a mode of access to value.
      *   **Enactivism:** Leans towards *enactment/constitution*. The emotional response *shapes* the world's significance. Contempt *makes* its object contemptible (in the social space defined by the contemnor). Love actively *constitutes* the beloved's importance through care and engagement. Value emerges from the dynamic interaction between organism and world shaped by the emotion-orientation. The emotion doesn't primarily *detect* value; it *creates* salience and significance.

  **II. Diagnostic Cases: Testing the Theories**

  *   **Case 1: Second-Order Emotions (Shame at Fear)**
      *   **Perceptualism:** Struggles. What evaluative property is perceived? Shame presents the *fear* (or oneself *as fearful*) as *shameful*. But fear itself is already a perception (of threat). This requires complex meta-representation: perceiving one's own perception *as* possessing a further negative value (shamefulness). It feels clunky and risks infinite regress.
      *   **Enactivism:** Handles better. The shame is a distinct bodily-affective orientation (cringing, withdrawal, desire to hide) *triggered by* and *focused on* the prior state of being afraid. The object is fixed by what caused the shame-response (the awareness of one's own fearful state). The "shamefulness" is the enacted orientation *towards* the fear.

  *   **Case 2: Objectless-but-Situated States (Caffeine/Sunday Dread, Manic Elation)**
      *   **Perceptualism:** Problematic. If dread requires perceiving *something as dread-inducing*, what is represented? Attempts to posit diffuse objects ("the day," "existence") feel strained. The lack of a clear propositional object challenges the perceptual model's core structure. Recalcitrance is hard to define without a target proposition to contradict.
      *   **Enactivism:** Shines. These *are* paradigmatic enactivist states: global shifts in action readiness (avoidance, paralysis in dread; boundless energy and approach in elation) and salience (everything seems ominous or oppressively heavy; everything seems full of possibility), *caused by* a situation (Sunday evening, caffeine, neurochemistry) without a specific external *target*. The orientation *is* the emotion; the object is the situation prompting it.

  *   **Case 3: Dissociation (Motivational Anesthesia vs. Affective Blindsight)**
      *   **Dissociation A: Motivational Anesthesia (Value Perception w/o Readiness)**
          *   *Perceptualism:* Validates it. The core perception (e.g., seeing the snake *as dangerous*) remains intact, even if the typical motivational/bodily sequelae are absent (e.g., due to lesion or dissociation). The emotion (fear) *is* the evaluative experience.
          *   *Enactivism:* Challenges it. If the full action readiness/bodily profile is missing, enactivism struggles to call this "fear." It might relegate it to a cold cognitive judgment *about* danger, distinct from genuine emotion.
      *   **Dissociation B: Affective Blindsight (Readiness w/o Value Experience)**
          *   *Perceptualism:* Invalidates it. If there's no conscious perception of threat, but avoidance and physiological responses occur, perceptualism must deny this is fear *proper*. It's mere behavioral/physiological reactivity, perhaps sub-personal.
          *   *Enactivism:* Validates it. The full suite of action readiness (avoidance), bodily mobilization (startle, vigilance), and attentional focus *is* the fear, even if the subject doesn't report a conscious "feeling of fear." The orientation defines the state.

  *   **Case 4: Causally Inert/Absent/Impossible Objects (Awe at Proof, Indignation at Past Wrong, Grief for Heat Death, Nostalgia for Nowhere)**
      *   **Perceptualism:** Ambiguous. Can evaluative properties attach to abstract entities, past events, or non-existents? If so, the model holds: awe represents the proof *as sublime*, indignation represents the past wrong *as unjust*, grief represents the heat death *as a profound loss*. If not, it struggles. Recalcitrance is possible (knowing the past wrong is unchangeable but feeling indignation anyway).
      *   **Enactivism:** Handles well. The object is fixed by what *focuses* the enacted orientation: the proof triggers a stance of wonder and cognitive absorption (awe); the thought of the past wrong triggers a mobilization towards protest/condemnation (indignation); the contemplation of cosmic loss triggers a posture of profound withdrawal and sorrow (grief); the imagined place organizes a stance of yearning and bittersweet attention. The value (sublimity, injustice, loss, cherished past) is constituted *in* the act of taking this orientation towards the object.

  *   **Case 5 (Added): Shared/Collective Emotion (Grief at a Public Tragedy)**
      *   **Perceptualism:** Focuses on individuals perceiving the same value (the tragedy *as a loss*). The "shared" aspect is coincidental or based on shared judgment. Struggles to capture the *interpersonal synchrony* and *mutual reinforcement* as constitutive.
      *   **Enactivism:** Excels. The shared emotion *is* the coordinated field of action readiness (communal mourning, mutual support), bodily postures (shared silence, collective weeping), and attentional focus (on shared symbols, narratives) *among individuals*, constituting the event *as* a collective loss through their joint orientation. The social enactment *is* the shared emotion.

  **III. Verdict: Collision, Compromise, and Caveats**

  **The More Promising Program:** **Enactivism** emerges as the more resilient and explanatorily powerful framework *across the diagnostic cases*. It handles objectless states, second-order emotions, affective blindsight, and emotions towards non-standard objects more naturally. Its constitutive link to motivation and its ability to account for value-constitution (especially socially) are significant strengths. Perceptualism’s struggles with objectless dread, motivational anesthesia (as *full* emotion), and its requirement for complex meta-representation in second-order cases are substantial liabilities.

  **Bolting on Machinery:**

  *   **Perceptualism:** To survive, it needs:
      1.  **A broader notion of "object":** Accommodating diffuse situations, internal states, and abstracta as legitimate targets of evaluative perception.
      2.  **An account of motivation:** Explaining why evaluative perceptions *usually* cause motivation without making it essential, and handling cases like anesthesia without relegating them to non-emotion.
      3.  **A story about constitution:** Explaining how emotions *seem* to constitute value (e.g., in love, contempt) without abandoning core detection claims – perhaps via attention or commitment.

  *   **Enactivism:** Its main challenge is Dissociation A (Motivational Anesthesia):
      1.  **Accounting for "cold" emotion:** It must either deny these are full emotions (risking counter-intuition) or develop a nuanced account of diminished but still recognizable action readiness/salience shifts in such cases, perhaps linked to appraisal processes.

  **The Abandonment Condition:** I would abandon this verdict favoring enactivism if compelling evidence emerged for **systematic, non-inferential, and world-directed evaluative experiences that are motivationally and physiologically inert yet are reliably correlated with specific evaluative properties in a way that couldn't be explained as mere cognitive judgments plus enactivist residues.** If "pure" evaluative perceptions, decoupled from any action-readiness or bodily engagement signature, were robustly identified as the core of distinct emotion types, perceptualism would regain significant ground.

  **Substantive vs. Explanatory Target Differences:**

  *   **Substantive Disagreements:** These are deep and genuine collisions:
      1.  **Core Ontology:** Is emotion fundamentally a *perceptual state* with (contingent) effects, or an *embodied, action-oriented engagement*?
      2.  **Motivation:** Is it essential or contingent to emotion?
      3.  **Value:** Do emotions primarily detect pre-existing value or enact/constitute significance?
      4.  **Consciousness:** Is a conscious evaluative experience necessary for emotion (Perceptualism leans yes, Enactivism can accommodate blindsight)?

  *   **Explanatory Target Differences:** While both aim to explain emotion, they prioritize different facets:
      1.  Perceptualism prioritizes the *intentional content* and *epistemic role* (how emotions inform us about value).
      2.  Enactivism prioritizes the *functional role* and *embodied dynamics* (how emotions prepare us to act and structure our lived world).
      However, this difference in emphasis *doesn't* resolve the conflict. The enactivist argues the perceptualist's "content" is an abstraction from the lived orientation, while the perceptualist argues the enactivist's "orientation" presupposes an evaluative grasp of the situation. The core claims about what constitutes the emotion *type* and what does the *explanatory work* remain fundamentally incompatible. Your friend's point captures a surface complementarity but misses the underlying competition for primacy in explaining the phenomenon.
