prompt: |-
  I teach an upper-level undergraduate seminar on federalism and multilevel governance: 24 students, one 75-minute session. They have already read the standard statements of subsidiarity (the EU's, the German Basic Law's necessity test, and the Swiss constitutional version), so I do not want anything that restates them.

  Design a simulation that makes them feel one difficulty the reading slides past. Subsidiarity tells you to presume in favour of the smaller unit, but it does not say who gets to apply that presumption, and every candidate allocator — the union, the member units themselves, a court, a constituent convention — has an interest in the answer, because allocating competences is itself the most centralising power there is. I want them to run into this rather than hear it: they should spend the first part of the session arguing about which level should decide some concrete policy, and only later discover that the disagreement underneath was about who decides that question. Ideally I do not say the phrase "who decides who decides" until after they have tried to write a rule.

  Concretely: six regional delegations of four, each with a written brief giving it (i) a local preference that diverges from the union median on some issue, (ii) a spillover it imposes on or suffers from its neighbours, and (iii) at least one issue on which it would prefer union-wide rules — so that every delegation has a reason to want localism for itself and centralisation for others. Give me the policy domain, the six briefs, a scoring scheme using points or legitimacy tokens rather than money, a timeline with minute marks, and, the part I care most about, the moment where I hand them a ballot asking only who decides who decides and they have to draft a workable rule on the spot, with the moves I should have ready for the proposals they will predictably produce.

  Then a debrief that maps moments in the session onto the distinction between subsidiarity as a presumption about outcomes and as a rule about authority, says what will predictably go wrong the first time I run it, and is frank about which feature of the problem the simulation cannot reproduce and I will have to supply in discussion.
reasoning: |-
  We are designing a simulation for a 75-minute session on federalism and multilevel governance, focusing on the challenge of "who decides who decides" under subsidiarity. The students (24) are divided into six regional delegations of four students each. Each delegation has a brief with three elements: (i) a local preference diverging from the union median, (ii) a spillover (either imposing or suffering) affecting neighbors, and (iii) at least one issue where they prefer union-wide rules. The goal is for them to first argue about policy allocation and then realize the deeper issue of authority allocation.

  **Policy Domain**: Environmental Regulation (specifically, regulation of industrial emissions and waste management). This domain allows for clear local preferences, spillovers (like air and water pollution crossing borders), and issues where uniformity might be preferred (e.g., to avoid a "race to the bottom" or to harmonize standards for businesses operating in multiple regions).

  **Six Regional Delegations**:

  1. **Region A: Industrial Heartland**
     - (i) Prefers lax emissions standards to protect its heavy industries (diverges from union median which is moderate).
     - (ii) Suffers from air pollution from Region B (a neighboring industrial region) and also imposes water pollution on Region C (downstream).
     - (iii) Wants union-wide rules on waste disposal to prevent neighboring regions from dumping waste in its territory.

  2. **Region B: Industrial Coastal**
     - (i) Prefers moderate emissions standards (close to union median) but with exceptions for its shipping industry (so locally divergent).
     - (ii) Imposes air pollution on Region A and Region D (due to wind patterns) and suffers from water pollution from Region E (upstream river).
     - (iii) Wants union-wide rules on marine pollution because it suffers from pollution from other coastal regions.

  3. **Region C: Agricultural Downstream**
     - (i) Prefers strict emissions standards to protect its agriculture and clean water (diverges from union median).
     - (ii) Suffers from water pollution from Region A (upstream) and also from Region F (which uses pesticides that run off).
     - (iii) Wants union-wide rules on chemical use in agriculture to prevent unfair competition from regions with lax rules.

  4. **Region D: Mountainous Eco-Tourism**
     - (i) Prefers very strict environmental standards to preserve its natural beauty (diverges from union median).
     - (ii) Suffers from air pollution from Region B and Region E (industrial regions) and also imposes minimal spillover (but worries about tourism being affected by pollution from others).
     - (iii) Wants union-wide rules on air quality because pollution from other regions drifts into its territory.

  5. **Region E: Resource Extraction**
     - (i) Prefers lax standards for mining and extraction (diverges from union median).
     - (ii) Imposes water pollution on Region B (downstream) and air pollution on Region D (due to mining activities and wind patterns).
     - (iii) Wants union-wide rules on the definition of protected areas to avoid having to comply with multiple different regulations (since it has operations in multiple regions).

  6. **Region F: Agricultural Upstream**
     - (i) Prefers moderate standards but with flexibility in pesticide use (diverges from union median by wanting more flexibility for pesticides).
     - (ii) Imposes water pollution (pesticide runoff) on Region C (downstream) and suffers from air pollution from Region A (if wind blows).
     - (iii) Wants union-wide rules on packaging and labeling of agricultural products to facilitate trade.

  **Scoring Scheme**: Each delegation starts with 10 "Legitimacy Tokens". They will lose or gain tokens based on the outcomes:

  - For each policy area (emissions, waste, water, air, chemicals, etc.), if the decision level (local or union) is what they prefer for that issue, they gain 2 tokens. If it's the opposite, they lose 2 tokens.
  - Additionally, if a policy decision causes a spillover that affects them negatively (e.g., pollution from a neighbor because of lax rules there) and that issue was decided locally (so the union didn't step in), they lose 1 token for each such spillover that occurs. If the union steps in and sets a rule that prevents the spillover, they do not lose that token.
  - They can also gain or lose tokens during the negotiation by trading concessions (if allowed by the rules they set) but the primary mechanism is the policy allocation.

  However, note that the scoring must also account for the fact that the allocation of the power to decide (the "who decides") is itself a decision. Thus, we design:

  - After the initial policy negotiation, we will have a phase where they vote on "who decides who decides". The rule they set in that phase will then be used to re-score the initial policy decisions (if the rule they set would have led to a different allocation of competences) or to make new ones. But to keep it manageable, we will have two scoring rounds: one for the policy decisions they make initially and one after they set the rule for allocating competences.

  Alternatively, to avoid complexity, we can have the scoring only at the end, based on the final allocation of competences and the resulting policy outcomes. But we want them to feel the tension during the first phase.

  **Timeline (75 minutes total)**:

  1. **Introduction and Setup (5 minutes)**: Explain the scenario: "You are representatives of six regions in a union. Today you will negotiate which level of government (regional or union) should decide on environmental policies. Each region has a brief with its interests. Your goal is to maximize your legitimacy tokens. We will have two phases: first, you will try to agree on the allocation of specific policies; second, we will address a fundamental question about the process. Start by reading your briefs and preparing your strategy."

  2. **Delegation Preparation (10 minutes)**: Delegations read their briefs and plan their arguments.

  3. **Negotiation Round 1: Policy Allocation (25 minutes)**:
     - Each delegation has 2 minutes to state its position on the main policy areas (emissions, waste, water, air, chemicals, packaging). Focus on which level should decide each.
     - Then 15 minutes of open negotiation: they can form alliances, trade support, etc. They must try to agree on a set of policies (which level decides each). They can also propose a package deal. The instructor circulates to answer questions but does not intervene.
     - At the end of 25 minutes, they must vote on a package (majority vote? but we haven't set the rule). Here we deliberately leave the voting rule ambiguous to create tension. The instructor can say: "You must decide by a vote, but how? Majority? Unanimity? Let's start with a simple majority of delegations (not individuals)." (This ambiguity is intentional to set up the next phase.)

  4. **Interim Scoring and Reveal (5 minutes)**: The instructor quickly calculates and announces the token changes for each delegation based on the agreed policy allocations. This will show winners and losers. Then the instructor says: "But note: the way we decided the allocation (by simple majority of delegations) might not be what you wanted. What if we had used a different rule? And more importantly, who should have decided that rule?"

  5. **The Ballot (5 minutes)**: Hand out a ballot with the question: "Who should decide which level of government (union or regional) has the authority to make policy in a given area?" The options are:
     - The union legislature (by majority)
     - The regional governments (by unanimity or by some majority)
     - A court (interpreting the constitution)
     - A constituent convention (for each new policy area)
     - Other (please specify)

     But note: we don't want them to just vote; we want them to draft a rule. So instead of a ballot with options, we can ask: "Draft a rule for determining which level gets to decide the allocation of competences for any new policy area. You have 5 minutes to write a proposal."

  6. **Proposal Drafting and Presentation (10 minutes)**:
     - Delegations quickly draft a rule (2 minutes).
     - Each delegation presents its rule (1 minute each, 6 minutes total).
     - Then they vote on which rule to adopt (2 minutes). The voting rule for this vote? Again, we haven't specified! Let them propose how to vote. They might use the same simple majority, or they might try something else. This is part of the learning.

  7. **Debrief (15 minutes)**:
     - Map the experience: "In the first phase, you were arguing about policy allocation (subsidiarity as a presumption about outcomes). Then we revealed that the deeper issue is about authority (who decides)."
     - Highlight moments: 
       - When they disagreed on a policy, was it because they had different views on the merits or because they thought the wrong level was deciding?
       - When they voted in the first phase, some might have objected to the voting rule (if they were in the minority).
     - What will go wrong the first time? 
       - The first negotiation might be chaotic because they don't have a clear procedure. 
       - Some delegations might not realize the spillover effects until they see the token loss. 
       - They might not immediately grasp the recursive problem until the ballot is handed out.
     - What the simulation cannot reproduce: 
       - Real-world power dynamics (e.g., larger regions might have more influence, but in the simulation, all are equal). 
       - The long-term evolution of competences and the role of courts (which might have their own institutional interests). 
       - The fact that in reality, the rules for changing the rules (constitutional amendment) are usually rigid, but here they change rules on the fly.

  **The Ballot Moment and Expected Proposals**:

  After the first round, when they have seen the consequences of the allocation, hand them the task: "Now that you've experienced the difficulty of allocating competences, draft a rule for how such allocations should be decided in the future. You have 5 minutes to write a proposal."

  Predictable Proposals:

  1. **Union Legislature (Majority Vote)**: Some (especially regions that were in the majority) will propose that the union legislature decides by majority. 
     - Counter: "But that gives the union the power to centralize everything, violating subsidiarity."

  2. **Unanimity of Regions**: Others (especially those who lost) will propose that the regions must agree unanimously to assign a power to the union.
     - Counter: "Then nothing will ever get centralized, even when there are spillovers."

  3. **Court**: Some might propose an independent court that applies subsidiarity.
     - Counter: "But how does the court know? It might become a political body. And who appoints the court? The union? Then it's not independent."

  4. **Hybrid (e.g., regions propose, union ratifies)**: Some might propose a mixed system.
     - Counter: "This might lead to deadlock."

  5. **Constituent Convention for Each Issue**: Too cumbersome.

  In the debrief, the instructor should note that the simulation reveals the recursive nature of the problem: any rule about who decides is itself a centralizing or decentralizing decision. The only way out is to have a prior agreement (a constitution) but even that must be interpreted and amended.

  **Final Note**: The simulation is designed to be replayed in future years, so the instructor should be prepared to adjust based on the first run. The debrief should explicitly state that the simulation cannot capture the entire complexity (like historical path dependence or the role of political parties) but serves to highlight the core dilemma of "who decides who decides".
answer: |-
  ### Simulation Design: "The Competence Conundrum"

  **Policy Domain**: *Cross-Border Water Management*  
  Focuses on pollution standards, dam construction, and drought response in a shared river basin. Forces trade-offs between local economic needs and transnational externalities.

  ---

  ### **Regional Delegation Briefs**  
  *(Each of 6 groups gets one; all briefs include a map showing river flow between regions)*  

  1. **Upstream Highlands (Water Exporter)**  
     - *(i) Local Preference*: Lax pollution rules for mining (region relies on mineral exports).  
     - *(ii) Spillover*: Suffers from water shortages if midstream regions build dams; imposes pollution on downstream.  
     - *(iii) Wants Centralized*: Drought response (to force water-sharing from downstream).  

  2. **Midstream Industrial Core (Heavy Water User)**  
     - *(i) Local Preference*: Local control over dam construction (needs reservoirs for factories).  
     - *(ii) Spillover*: Imposes water scarcity on downstream; suffers pollution from upstream.  
     - *(iii) Wants Centralized*: Pollution standards (to stop upstream polluters).  

  3. **Downstream Delta (Ecosystem-Focused)**  
     - *(i) Local Preference*: Strict local pollution rules to protect fisheries.  
     - *(ii) Spillover*: Suffers pollution from all upstream; imposes saltwater intrusion on midstream if it overuses water.  
     - *(iii) Wants Centralized*: Dam construction rules (to prevent midstream from blocking water flow).  

  4. **Arid Plains (Agriculture-Dependent)**  
     - *(i) Local Preference*: Local control over groundwater extraction (for irrigation).  
     - *(ii) Spillover*: Imposes aquifer depletion on neighbors; suffers from midstream pollution.  
     - *(iii) Wants Centralized*: Pollution standards (to protect crops from midstream chemicals).  

  5. **Lakeside Tourism Region**  
     - *(i) Local Preference*: Strict local rules on shoreline development.  
     - *(ii) Spillover*: Suffers when upstream pollution affects lake water quality; imposes tourism congestion on neighbors.  
     - *(iii) Wants Centralized*: Water allocation during droughts (to guarantee lake levels).  

  6. **Transit Hub (Trade-Centric)**  
     - *(i) Local Preference*: Local dredging rights to maintain shipping channels.  
     - *(ii) Spillover*: Imposes sediment buildup on downstream; suffers if upstream dams reduce river flow.  
     - *(iii) Wants Centralized*: Pollution standards (to avoid costly ship maintenance).  

  ---

  ### **Scoring Scheme: "Legitimacy Points"**  
  - Each delegation starts with **10 points**.  
  - **Gain points** by:  
    - Getting *your preferred level* (local/union) to decide an issue (+2 per issue).  
    - Avoiding *negative spillovers* affecting you (+1 for each prevented spillover).  
  - **Lose points** by:  
    - Accepting a spillover-imposing policy (-1 per spillover suffered).  
    - Failing to resolve an issue (-2 per deadlocked topic).  
  - **Win condition**: Maximize points. Highest score "wins," but emphasize collective legitimacy.  

  ---

  ### **Timeline (75 Minutes Total)**  
  **Goal**: Force conflict over *who allocates authority*, not just policy outcomes.  

  1. **Intro & Briefing (5 min)**  
     - Frame: *"You represent regions negotiating a new River Basin Compact. Decide which level—local or union—sets rules for: (1) Pollution Standards, (2) Dam Construction, (3) Drought Response."*  
     - Distribute briefs. No mention of "who decides who decides."  

  2. **Group Strategy (10 min)**  
     - Delegations review briefs, plan demands. *Instructor circulates, answers questions neutrally.*  

  3. **Opening Statements (10 min)**  
     - Each group has 90 seconds to state positions on all three policies. *Example: "We demand local dam control but union pollution rules!"*  

  4. **Negotiation Round 1: Policy Battles (25 min)**  
     - Groups lobby, form alliances, trade favors. *Instructor notes:*  
       - Who invokes "subsidiarity" to demand local control?  
       - Who pushes centralization for spillover issues?  
       - Do they question *how* decisions are made? (Likely not yet.)  
     - **At 15 min**: Intervene—*"If you deadlock, propose a voting rule to break impasse."* (Groups often default to majority vote.)  
     - **End**: Groups submit policy decisions (local/union per issue). Record votes.  

  5. **The Reveal: Ballot on Authority (5 min)**  
     - Hand out ballots:  
       > *"Who should decide whether a policy is local or union?  
       > (A) Union legislature  
       > (B) Unanimous agreement of regions  
       > (C) Independent court  
       > (D) Regional majority vote  
       > (E) Other: ____"*  
     - *Then:* **"Draft a one-sentence rule for allocating competences."**  
     - *Key moment:* Silence as they realize the first fight was circular.  

  6. **Drafting Rules & Predictable Proposals (10 min)**  
     - Groups draft rules (3 min), then pitch (1 min each). **Anticipate and counter**:  
       - *"Regions decide by majority"* → *"But that lets big regions bully small ones!"*  
       - *"Union decides"* → *"That guarantees centralization—where’s subsidiarity?"*  
       - *"Court applies subsidiarity"* → *"Who defines the court’s jurisdiction? The union?"*  
       - *"Unanimous consent"* → *"Will anyone ever agree? What about spillovers?"*  
     - Vote on proposals (use their preferred rule from Round 1—highlight inconsistency).  

  7. **Scoring & Debrief (10 min)**  
     - Calculate points based on Round 1 outcomes. *Most groups lose points from spillovers.*  
     - Debrief:  

  ---

  ### **Debrief Structure**  
  1. **Map the Conflict**:  
     - *Phase 1 (Policy):* "You fought about *outcomes*—invoking subsidiarity to demand local control or centralization. But notice: everyone used subsidiarity selectively to serve their interests."  
     - *The Ballot:* "When I asked who decides, you hit the core problem: **allocating competences is itself a competence**. Whoever holds *this* power defines federalism."  

  2. **Link to Theory**:  
     - **Subsidiarity as Presumption vs. Rule**:  
       - *Presumption:* "Your briefs assumed subsidiarity means ‘local wins’—but you only applied it *against* others’ spillovers."  
       - *Rule:* "Drafting a ‘who decides’ rule exposed subsidiarity’s emptiness without an arbiter. Like the EU, you defaulted to courts or legislatures—but those actors have self-interest."  
     - **Real-World Parallels**:  
       - *German Basic Law:* Courts decide "necessity," but appointments are political.  
       *Swiss Constitution:* Cantons vote, but small regions fear outvoting.  

  3. **Predictable Pitfalls (First Run)**:  
     - Groups won’t question decision rules until forced.  
     - They’ll frame self-interest as "principle."  
     - Scoring reveals hypocrisy: e.g., *Upstream* demanded local pollution control but union drought response.  
     - Drafted rules will be self-serving (e.g., *Delta* proposes courts; *Industrial Core* pushes regional majority).  

  4. **Simulation Limits (Discuss Explicitly)**:  
     - **Missing**: Long-term institutional self-interest (e.g., courts centralize to expand power; legislatures logroll).  
     - **Supply in Discussion**: Ask, *"Who polices the arbiter? How do German courts avoid bias? Why do the EU/ECB keep gaining power post-crisis?"*  

  ---

  ### **Materials**  
  - **Briefs**: 1-page summaries with region-specific data (e.g., *"Mining = 30% of Upstream GDP"*).  
  - **Map**: River flow diagram showing spillovers.  
  - **Ballots**: Pre-printed with voting options.  
  - **Scoreboard**: Visible tally of legitimacy points.  

  This simulation forces students into the recursive dilemma of federalism. By making them draft a rule after policy failure, they experience why subsidiarity’s promise—"decisions at the lowest level"—collapses without a neutral authority... which doesn’t exist.
