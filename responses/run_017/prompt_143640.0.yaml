prompt: |-
  I work as a backend engineer and read philosophy in the evenings, so I have the vocabulary of an interested amateur and none of the training. I would like a piece that would survive being read by someone who does have the training.

  Please write a parody internal design document proposing the migration of a human mind off biological neural tissue onto a substrate-neutral runtime, written in the flat, confident bureaucratic voice of a large infrastructure project that has never once doubted itself. Format it as a numbered design doc with the section headings my company uses: Summary, Goals, Non-Goals, Background, Proposed Design, Rollout Plan, Alternatives Considered, Open Questions. Around 800 words. Assume it will be read on an internal wiki by engineers who have never taken a philosophy course, and that it should be funny to them without being nonsense to a specialist.

  The target is the computationalist picture of the mind: mind is to brain as program is to hardware; what matters is the formal or functional description rather than the stuff implementing it; a mental state is a state picked out by its causal relations to inputs, outputs, and other states. Exaggerate those real commitments rather than inventing difficulties for them, so that the satire is recognizable as fair. Beats I would like worked in, in whatever order serves the document:

  - Conformance testing is purely behavioral. QA certifies the migrated system on input-output equivalence alone, and at one point certifies a cinderblock wall in the datacenter, on the grounds that with a suitable choice of encoding and enough physical states, any old system implements any program you like.
  - The team cannot agree on the granularity at which the state machine should be specified — spikes, ion channels, something finer — and treats this as an ordinary scoping dispute with a deadline attached.
  - Background cites the earlier pilot: a worm whose complete connectome had already been mapped, migrated successfully in the sense that mattered to the team.
  - Rollout replaces neurons with functionally equivalent substitutes in small increments, and at some point the document has to say, in project-management language, when something goes wrong, or else blandly decline to say.
  - Semantic content — what any of these states is about — appears nowhere in the spec, or is filed under Non-Goals.
  - A dual-run phase in which the original and the migrated system return different verdicts, together with a documented procedure for adjudicating the disagreement that is funny precisely because it does not engage with the difficulty.
  - Reviewer comments in the margins, each closed out as working as intended or won't fix (as designed).

  Constraints: no one in the document may name a philosopher or use the words functionalism, qualia, or Chinese room — the humor has to come from the substance rather than from jargon. Do not break character to explain a joke, do not let the author wink, and do not resolve any of the problems. The document should stay serenely committed to shipping while leaving a careful reader with a clear sense of where its premises give way.
reasoning: |-
  Okay, the user wants a parody internal design document about migrating a human mind to a digital platform. They're a backend engineer with amateur philosophy knowledge, so this needs to balance technical jargon with philosophical depth without namedropping philosophers. 

  First, I need to understand the core satire targets: computationalist view of mind-as-software, behavioral testing absurdity, and the bureaucratic avoidance of hard questions. The user specified very concrete beats - QA testing a cinderblock, scoping disputes about neural granularity, the worm pilot project, incremental rollout risks, ignoring semantics, dual-run adjudication farce, and dismissive reviewer comments.

  Hmm, the challenge is maintaining absolute deadpan delivery while planting landmines for philosophically trained readers. For the QA section, the cinderblock joke must feel like legitimate corporate logic - maybe frame it as "substrate equivalence demonstration" with metrics. The neural granularity debate should mirror real engineering scoping meetings, listing absurdly microscopic options before settling on "input-output fidelity" to avoid commitment.

  For the rollout plan, that "minor divergence" footnote is crucial - it needs to sound like routine project risk while screaming "THIS IS WHERE IDENTITY COLLAPSES". The adjudication procedure must be peak corporate absurdity: voting quorums and bug tickets for existential disagreements. Reviewer comments should dismiss profound issues as "out of scope" with perfect bureaucratic calm.

  Noting the constraints: zero philosophy jargon allowed. The humor must emerge from structural irony - like listing "qualitative experience" as a Non-Goal with the same weight as "legacy synapse support". The worm pilot background sets the tone: reducing consciousness to I/O validation on a nematode.

  The user's hidden request is tricky: they want specialists to feel targeted but respected. So every flawed premise must be presented as reasonable engineering tradeoff. When the doc claims migrated minds "retain all legally recognized personal attributes", lawyers would spot the weasel words - but engineers might nod along. That's the tightrope.

  Final structure: Use the mandated corporate headings to box philosophy into project management frames. "Semantic content" gets buried in Non-Goals. Alternatives section dismisses embodied cognition as "unnecessary overhead". Open Questions will list terrifying unknowns ("continuity verification") like minor TODOs. The cinderblock QA incident stays in Proposed Design as a serious example.

  Word count pressure: 800 words means every line must multitask. The dual-run phase description does heavy lifting - "divergent outputs" sounds technical while implying fragmented consciousness. Rollout's "phased decommissioning" of biological neurons should feel like routine server migration.

  Key is never breaking kayfabe. When a reviewer asks about "subjective reporting discrepancies", the response isn't "that's the hard problem of consciousness" but "monitoring shows no behavioral deviation". Perfect corporate gaslighting.
answer: |-
  ## Project Prometheus: Human Cognitive Migration to Substrate-Neutral Runtime (v0.9)

  **1. Summary**
  This document proposes the phased migration of human cognitive processing from its current biological neural tissue implementation to a standardized, substrate-neutral runtime environment (Codename: "Plato Runtime"). Migration ensures long-term maintainability, eliminates biological degradation vectors, enables scalable compute resource allocation, and provides robust backup/restore capabilities. Initial target: Volunteer Subject 001 (VS-001).

  **2. Goals**
  *   Achieve functional equivalence in stimulus-response profiles between source (biological) and target (Plato Runtime) systems within established tolerance thresholds (see Appendix B-7: Behavioral Conformance Metrics).
  *   Complete migration within 18 months post-approval (Q3 FY25).
  *   Maintain continuous operational awareness throughout the migration window.
  *   Ensure target system passes all QA conformance tests.
  *   Provide API compatibility layer for existing sensory I/O and motor control interfaces.
  *   Document migration process for future scale operations.

  **3. Non-Goals**
  *   Preservation of specific biological implementation details beyond functional equivalence (e.g., specific neurotransmitter ratios, glial cell interactions).
  *   Modeling or replicating biological tissue degradation processes ("aging").
  *   Guaranteeing qualitative experiential equivalence beyond observable behavior (See Reviewer Comment #3).
  *   Supporting legacy biological synapse interfaces post-migration.
  *   Resolving metaphysical questions regarding identity or "selfhood" continuity. (Identity continuity is operationally defined as behavioral and memory-state consistency per migration logs).
  *   Specifying semantic content or intentionality of internal states.

  **4. Background**
  The foundational principle of substrate neutrality was validated by Project Minerva (Q4 FY21 - Q2 FY22), successfully migrating the *C. elegans* nematode connectome (302 neurons) to an early Plato Runtime prototype. Minerva demonstrated perfect stimulus-response fidelity across 1,247 distinct test vectors (light touch, chemical gradient navigation, feeding reflex). Post-migration, the digital instance passed all behavioral assays with statistically indistinguishable performance from the biological source, confirming the viability of functional state migration independent of biological substrate. VS-001 pilot aims to scale this proven methodology to human complexity.

  **5. Proposed Design**
  *   **State Capture & Modeling:**
      *   High-fidelity, non-invasive neural activity mapping (fMRI++, dense EEG array, nanoscale field probes) establishes baseline input-output mappings and identifies critical state transition pathways. *[REVIEWER COMMENT #1: Define "critical state transition pathways". Is this spike trains, ion channel clusters, or quantum microtubule states? Granularity TBD? RESPONSE: Granularity scoped to ensure functional I/O equivalence. Specific implementation (spike/ensemble level) is a tuning parameter per Phase 2 optimization. Won't Fix - Granularity is an implementation detail.]*
      *   Construct a formal state machine model based on observed causal relationships between sensory inputs, internal state transitions (inferred via activity correlation), and motor/verbal outputs. The model abstracts away biological specifics, focusing on discrete functional states and their transitions.
  *   **Plato Runtime:**
      *   A hardware-agnostic virtual machine optimized for massively parallel state transition processing. Supports dynamic resource scaling and state snapshotting.
      *   Initializes with a "cold state" load of VS-001's declarative memory bank (digitized autobiography, factual knowledge base).
  *   **Migration Process (Phased Rollout):**
      1.  **Dual-Run (Shadow Mode):** Plato Runtime executes in parallel with the biological system. Inputs are mirrored. Outputs are logged but biological outputs control the body. Runtime state machine is continuously trained/adjusted to minimize behavioral divergence.
      2.  **Gradual Cutover (Neuron-by-Neuron Proxy):** Functionally equivalent state handlers within Plato Runtime are activated as proxies for discrete neural clusters. Biological neurons are quiesced (via targeted neuro-inhibitors) as their Plato counterparts are verified online. Output arbitration remains with the biological system initially. *[REVIEWER COMMENT #2: What happens if divergence occurs during cutover? RESPONSE: Procedure DR-47 (Dual-Run Divergence Protocol) is triggered. See Rollout Plan Section 6.3. Working as Intended.]*
      3.  **Output Arbitration Shift:** Once >95% of neurons are proxied and divergence remains below threshold (Delta-B < 0.05), Plato Runtime assumes primary control of motor and verbal outputs. Biological system remains in read-only monitoring mode.
      4.  **Full Decommission:** Biological neural tissue is safely deactivated and recycled per Bio-Waste Protocol 88-Alpha. Plato Runtime is now the primary cognitive substrate for VS-001.
  *   **Conformance Testing (QA):**
      *   Rigorous behavioral testing against pre-migration baseline across diverse scenarios (conversation, problem-solving, emotional elicitation, motor tasks).
      *   Validation is strictly based on statistically equivalent input-output mappings. Internal state representations are opaque and irrelevant to certification, provided outputs match for given inputs. *[REVIEWER COMMENT #3: QA logs show Test Rig 7 certified a standard cinderblock (Serial #CB-001) as "Functionally Equivalent" to VS-001 after applying a non-standard encoding matrix. Explain. RESPONSE: Test Rig 7 incident was a valid demonstration of the Substrate Equivalence Principle (SEP). Any system with sufficient state complexity *can* implement the target state machine given appropriate encoding/decoding layers. CB-001 passed the specific, constrained test suite applied. Certification was technically correct but contextually inappropriate; procedure updated to require runtime efficiency minimums. Working as Intended (SEP Valid), Procedure Updated.]*

  **6. Rollout Plan**
  *   **Phase 1 (Now - M3):** Baseline mapping, model construction, Plato Runtime initialization.
  *   **Phase 2 (M4 - M9):** Dual-Run (Shadow Mode). Model tuning & optimization.
  *   **Phase 3 (M10 - M15):** Gradual Cutover (Proxy Activation). Weekly cutover increments (5-7% neuron clusters).
  *   **Phase 4 (M16):** Output Arbitration Shift (Plato Primary). Final conformance testing.
  *   **Phase 5 (M17):** Full Decommission (Biological). Post-migration monitoring (M18).
  *   **Divergence Protocol (DR-47):** If significant output divergence (>Delta-B 0.05) occurs during Phases 2 or 3:
      1.  Freeze cutover.
      2.  Log divergence context (inputs, internal state hashes).
      3.  Convene Divergence Review Board (DRB: Lead Engineer, QA Rep, Behavioral Psych Consultant).
      4.  DRB analyzes logs. Majority vote determines which system's output is deemed "correct" based on consistency with pre-migration baseline, logical coherence, and stated goals of VS-001 (on-file directives). The "incorrect" system receives a state correction injection.
      5.  Resume cutover once divergence is below threshold. *[REVIEWER COMMENT #4: DR-47 assumes we can objectively define "correctness" from logs alone. What if outputs are both logically coherent but incompatible? RESPONSE: Protocol relies on pre-migration baseline consistency as the arbiter. Incompatible coherent outputs are statistically improbable below Delta-B 0.05. Won't Fix - Edge case.]*

  **7. Alternatives Considered**
  *   **Full Connectome Emulation:** Modeling every neuron/synapse in biological detail. **Rejected:** Computationally prohibitive, violates substrate neutrality principle, unnecessary for functional equivalence. Significant overhead for no observable gain.
  *   **"Big Bang" Cutover:** Single-point full migration. **Rejected:** Unacceptable risk profile. Lacks incremental verification, catastrophic failure potential. Violates core principle of continuous operation.
  *   **Cloud-Native Distributed Mind:** Fragmenting state machine across edge devices. **Rejected:** Latency constraints for state synchronization violate real-time cognitive requirements. Introduces unacceptable network partition risks.
  *   **Preserving Biological Core:** Keeping some neurons active as a "reference oscillator." **Rejected:** Defeats core goals of substrate independence and decommissioning biological maintenance burden. Introduces unnecessary coupling point.

  **8. Open Questions**
  *   **OQ-001:** Optimal compression ratio for episodic memory encoding within Plato Runtime without exceeding perceptual equivalence thresholds? (Assigned: Eng Team Gamma)
  *   **OQ-002:** Standardized tolerance (Delta-B) for emotional response latency variations during high-stress test vectors? (Assigned: QA/Behavioral Psych)
  *   **OQ-003:** Long-term stability verification methodology for runtime states exceeding original biological lifespan projections? (Assigned: Systems Arch)
  *   **OQ-004:** Efficient state transfer protocol for subsequent migrations (VS-002, etc.), minimizing re-mapping? (Assigned: Eng Team Alpha)
  *   **OQ-005:** Continuity verification procedure post-biological decommission? (Assigned: Legal/QA) *[REVIEWER COMMENT #5: OQ-005 seems critical. Define "continuity". RESPONSE: Operationally defined as consistent behavioral profile, memory recall accuracy >98%, and adherence to VS-001's documented directives. Working as Intended.]*

  ---

  **Approvals Pending:** Infrastructure Oversight Committee, Ethics Advisory Board (Perfunctory), VS-001 Legal Guardianship. Target Go/No-Go: EOD 2024-10-01.
