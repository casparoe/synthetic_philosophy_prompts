  ### Diagnosis Table  

  |candidate_diagnosis | what the dispute is really about | strongest point in its favour | strongest point against it | what would count as progress if it's right | pct_of_the_action_it_explains |  
  |-------------------|----------------------------------|------------------------------|----------------------------|-------------------------------------------|-------------------------------|  
  | **Substantive metaphysical disagreement** | Which relation (numerical identity vs. counterpart similarity) *grounds* de re modality, given a fixed ontology of worlds. | Kripke’s "Humphrey objection": Only *identity* (not similarity) makes "Humphrey could have won" about *Humphrey himself*. Counterpart theory violates the necessity of identity. | Intertranslatability shows both frameworks can mimic each other’s predictions (e.g., counterpart relations induce equivalence classes that behave like transworld identities). | A new argument showing one relation violates essential constraints (e.g., rigidity, causal-historical constraints) the other satisfies. | 40% |  
  | **Verbal disagreement** | How to *interpret* modal operators and quantifiers across worlds, not the underlying reality. | Any counterpart-theoretic model can be recast as transworld identity over "world-bound individuals" (and vice versa) via trivial translation. Dispute reduces to "bookkeeping" preferences. | Hard cases (e.g., "I might not have existed") get *different explanations*: counterpart theory uses no counterparts, transworld identity uses non-existence in other worlds. Truth-conditional asymmetries remain. | Formal proof that all modal claims have identical truth conditions under both frameworks modulo relabeling. | 15% |  
  | **Conflation of two distinct issues** | (1) Nature of worlds (concrete pluralism vs. abstract/ersatz) and (2) Grounding relation for de re modality (identity vs. counterpart). | Lewis *bundles* concrete worlds with counterpart relations; Kripke *bundles* abstract worlds with transworld identity. But actualists *can* adopt counterpart theory (e.g., Forbes), and Lewisians *could* (but don’t) adopt transworld identity. | Hard cases pressure *both* axes: E.g., "Something with no counterpart" challenges the similarity relation *independently* of world-ontology. | Taxonomizing positions along both axes + showing key arguments target only specific bundles (e.g., Kripke’s "identity" attack fails against actualist counterpart theory). | 30% |  
  | **Clashing bedrock intuitions** | Whether modality requires *strict numerical persistence* (Kripke) or allows *representation by similarity* (Lewis). | "I could have been a poached egg" feels false if identity is required (no persistence), but true under counterpart theory if context allows extreme dissimilarity. No neutral ground for adjudication. | Context-sensitivity arguments suggest intuitions are malleable (e.g., importance-over-similarity weighting varies by discourse), undermining "bedrock" status. | Empirical work on modal intuitions (e.g., cross-cultural studies) showing which intuitions are universal vs. contingent. | 15% |  

