  ```  

  ### Argument for the Diagnosis  
  **On (a) Intertranslatability**:  
  - While counterpart structures *can* be recast as "identity" over world-bound individuals (e.g., defining "I" in another world as the counterpart), and transworld identity can be mimicked with trivial counterpart relations (e.g., identity as the only counterpart), this **relocates but does not defuse** the dispute. The core issue is *which relation is metaphysically apt*:  
    - Counterpart theory commits to **similarity-in-context** as primitive (Lewis: "counterparts are *by stipulation*").  
    - Transworld identity commits to **primitive cross-world sameness** (Kripke: identity is rigid, unanalyzable).  
  - The recoding debate becomes: "Is similarity (with contextual parameters) or primitive identity the *ground* of modal properties?" Intertranslatability masks this by making the disagreement about *which primitive to privilege*.  

  **On (b) Hard Cases**:  
  - **Asymmetry 1 (Non-existence)**: "I might never have existed" is **true iff no counterpart exists** (counterpart theory) vs. **true iff I don’t exist in some world** (transworld identity). Counterpart theory makes non-existence *contingent on counterpart relations*, while transworld identity treats it as a world-indexed fact.  
  - **Asymmetry 2 (No counterparts)**: A world containing an entity *with no counterparts anywhere* is **impossible under counterpart theory** (de re claims about it lack truthmakers) but **permissible under transworld identity** (if it exists only in one world, "it could not have been otherwise" is vacuously true). This pressures counterpart theory’s reliance on similarity.  
  - **Asymmetric work**: These cases test **contextual flexibility** (counterpart theory) vs. **existential absolutes** (transworld identity). They reveal counterpart theory’s vulnerability to incompleteness (no counterparts → no modal truths) and transworld identity’s vulnerability to haecceitism.  

  **On (c) Haecceitism & Cardinality**:  
  - **How many things could have existed?**  
    - Transworld identity: **Sum of all individuals across worlds** (e.g., infinitely many "alien" entities).  
    - Counterpart theory: **No transworld counting** (worlds are isolated; "things" are world-bound). You can only ask "How many counterparts of actual entities could exist?"  
  - **Haecceitistic differences**:  
    - Transworld identity: **Allows worlds qualitatively identical but differing only in which individuals occupy roles** (e.g., Adam and Eve swapped).  
    - Counterpart theory: **Rejects haecceitism** (worlds are qualitatively maximal; no primitive "thisness" transworld). A "swapped" world is either qualitatively distinct (if roles differ) or identical (if not).  
  - **Truth conditions diverge**: "Two worlds differ only haecceitistically" is **true under transworld identity** (if qualitative duplicates with permuted identities exist) but **false or meaningless under counterpart theory** (counterpart relations require qualitative grounds).  

  ### Why Progress Is Stalled (and What Would Help)  
  - **Stalemate drivers**:  
    1. **No neutral ground**: Kripke’s intuition ("identity is non-negotiable") vs. Lewis’s intuition ("identity across concrete worlds is incoherent") are foundational.  
    2. **Package-deal arguments**: Kripke’s "Humphrey" objection assumes abstract worlds + identity; Lewis’s "cheap haecceitism" reply assumes concrete worlds + counterparts.  
  - **Paths forward**:  
    - **Distinguish the axes**: Map positions onto a 2x2 grid (worlds: concrete/abstract × modality: identity/counterpart). Show Kripke’s arguments only threaten concrete-world identity, while Lewis’s only threaten abstract-world counterparts.  
    - **Formal results**: Prove that counterpart theory *requires* haecceitism-rejection or that transworld identity *entails* primitive cross-world "thisness."  
    - **Shift the question**: Ask "What is the *cognitive role* of de re modality?" If it’s about *representation* (not metaphysics), counterpart-like relations may be inevitable.  
  - **Honest reason for eternal stalling**: The dispute relies on **unprovable intuitions** about "what makes something *me* in another world." If these are bedrock (e.g., "identity is rigid" vs. "all representation is similarity-based"), no argument can bridge the gap.  

  **Recommendation**: Focus seminar time on *untangling the two axes* and testing hard cases *against specific combinations* (e.g., "Does Kripke’s 'poached egg' objection work against *actualist* counterpart theory?"). This exposes where the friction truly lies.
