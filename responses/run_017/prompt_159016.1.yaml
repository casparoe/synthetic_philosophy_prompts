  For the altered line in the final stanza, I consider changing "tired" to "bound"—a subtle shift implying the subject becomes trapped by systems interpreting their own words. This earns its place by demonstrating contextual transformation without breaking the poem's realism. The last repetition of the opening line now carries new weight, showing how meaning changes despite identical words. 

  Technical execution requires care: every repeated line must be verbatim (except that one change), contexts must feel authentic, and the inferred lines should emerge organically. The rhythm needs spoken-word cadence, with line breaks that work auditorily. Avoiding melodrama is crucial—this isn't about villains, but about ordinary bureaucratic machinery reshaping human statements.
answer: |-
  Here is a pantoum crafted to embody the philosophy of contextual integrity, adhering strictly to your constraints and leveraging the form's inherent structure to make the argument felt:

  **Pantoum for a Reading Group**

  She said, "I'm tired of being afraid."
  The room was cool, the light was low.
  Her hand lay open on the table.
  She said it to the one who held her hand.

  The room was cool, the light was low.
  The doctor wrote it in the chart.
  She said it to the one who held her hand.
  *Reason noted: patient distress.*

  The doctor wrote it in the chart.
  HR reviewed the absence file.
  *Reason noted: patient distress.*
  *Projected days lost: five to ten.*

  HR reviewed the absence file.
  The underwriter requested codes.
  *Projected days lost: five to ten.*
  *Risk profile: moderate concern.*

  The underwriter requested codes.
  The platform matched the anonymized tag.
  *Risk profile: moderate concern.*
  *Bid increment: 1.7 cents per.*

  The platform matched the anonymized tag.
  Her mother passed the serving dish.
  *Bid increment: 1.7 cents per.*
  "They say you might need time away..."

  Her mother passed the serving dish.
  "Are you afraid?" her uncle asked.
  "They say you might need time away..."
  The record states: *expressed fatigue.*

  "Are you afraid?" her uncle asked.
  Her hand lay open on the table.
  The record states: *expressed fatigue.*
  She said, "I'm bound by being afraid."

  ---

  ### How This Meets Your Requirements

  1.  **No Secrets:** The core statement ("I'm tired of being afraid") is spoken openly and voluntarily by the subject to a loved one in the first stanza. Nothing is stolen or exposed.
  2.  **No Villains:** Each transfer is structurally driven: clinical documentation, HR record-keeping, insurance underwriting, programmatic advertising (matching tags), family concern based on inferred information, and finally, a record summarizing the flow. No malice, hacking, or broken promises.
  3.  **No Jargon:** The words "privacy," "surveillance," and "data" never appear. The focus is solely on the flow and its context.
  4.  **Form as Philosophy:**
      *   **Inherited Lines = Disclosures:** The repeated lines are the actual spoken phrase ("I'm tired..."), the observed setting ("The room was cool..."), the physical state ("Her hand lay open..."), the direct quote ("She said it to the one..."), or *explicitly documented statements* (e.g., "*Reason noted: patient distress.*", "*Projected days lost...*", "*Risk profile...*", "*Bid increment...*", "*The record states...*"). These are things "said" or "written."
      *   **New Lines (Increasingly) = Inferences/Classifications:** The new lines introduce the *context* (doctor, HR, underwriter, platform, mother, uncle) and, crucially, the *derived claims*. These start as documentation ("The doctor wrote it...", "HR reviewed...") but evolve into inferences treated as facts: "*Projected days lost...*" (inferred from distress + context), "*Risk profile: moderate concern*" (inferred from projected days lost), "*Bid increment: 1.7 cents per*" (inferred from risk profile), "They say you might need time away..." (inferred by the family from the circulating information/record), "*The record states: expressed fatigue*" (a summary/reinterpretation of the original statement). The reader sees an inference ("Projected days lost") become the inherited "fact" for the next stanza ("HR reviewed... *Projected days lost...*"), laundered of its origin as a projection. The turn *is* the moment the derived claim ("*Projected days lost...*", "*Risk profile...*") starts behaving as the foundational disclosure.
  5.  **Altered Line:** The final inherited line is altered by one word: "tired" becomes "bound". This alteration is the poem's core answer/refusal:
      *   **Cost:** It breaks the strict repetition pattern, drawing attention.
      *   **Earning:** It powerfully demonstrates the contextual transformation. The *same information* ("being afraid") has, through its journey and reinterpretation across contexts (medical, HR, insurance, advertising, family, official record), fundamentally changed its meaning and consequence for the subject. She is no longer just *expressing* a state ("tired"); she is now *constrained* by how systems have interpreted and acted upon that expression ("bound"). The information is "the same" lexically in parts, but its nature and impact are utterly transformed by context and flow. The poem ends where it began, yet everything is different because of the journey between.

  ### Meeting the Bar

  *   **Contextual Integrity Recognizable:** A CI scholar will see the shifting contexts (clinic, HR, insurer, ad exchange, family dinner, record), the changing actors (subject, doctor, HR staff, underwriter, algorithm, mother, uncle, record-keeper), the attributes (subjective feeling -> clinical note -> projected absence -> risk score -> bid value -> family concern -> official summary), and the transmission principles (disclosure in intimacy -> clinical duty -> employment compliance -> actuarial calculation -> market logic -> familial care -> bureaucratic record-keeping). Norms of appropriateness (distress noted in clinic, risk assessed by insurer) and flow (clinical note to HR via subject? HR data to insurer?) are implicitly challenged by the flow itself.
  *   **No Secrecy/Control Model:** The injury isn't exposure (she said it openly) or loss of control (she likely consented to HR/medical data sharing in broad terms). The injury is the *transformation* and *consequence* arising from the flow violating contextual norms of distribution and use.
  *   **Accessible Poem:** Without CI knowledge, it reads as a stark narrative of how a personal statement migrates and mutates through systems, changing meaning and impacting the individual, with no clear villain, just structural processes.
  *   **Ambiguity:** The poem doesn't declare whether a "wrong" was done. It shows the process and the consequence ("bound"), leaving the ethical judgment precisely where the discussion stalled – for the reader to feel and debate.
  *   **Form & Sound:** The strict pantoum structure forces the laundering effect. Lines are speakable in one breath. The repetition creates a haunting, inevitable rhythm, making the returns audible. The alteration in the final line lands with significant weight.

  This poem uses the machinery of the pantoum to make tangible the core argument about contextual integrity and the transformative power of information flow, fulfilling your specific, challenging, and philosophically rich request.
