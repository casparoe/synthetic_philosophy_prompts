answer: |-
  Below is a disciplined analysis applying the stipulated definitions to the Cotton case, proceeding through the requested mappings and concluding with an epistemic commitment.

  ---

  ### **Downward Mapping: Theory → Case**

  #### **Common-Factor Theory (Argument from Illusion)**
  - **Thompson's perception during assault**: Her experience consists of an experiential core (e.g., visual sensations of a face, emotional intensity) that is *subjective* and mind-dependent. Confidence/vividness attach to this core, not directly to Poole (the actual attacker).  
  - **Later memory/identification**: The memorial state is a reconstruction *of the same experiential core*. When viewing the lineup, she matches the core (stored in memory) to Cotton’s photo/body, mistaking it for Poole. Confidence reflects the core’s vividness, not accuracy.  
  - **Evidence for police/jury**: They treat Thompson’s *confidence and vivid recollection* as evidence of reliability. Since the core is shared between veridical and non-veridical experiences, her certainty suggests the core accurately represents reality.  
  - **Options/conclusions**: Given this, they reasonably infer Cotton is the attacker. The theory implies no flaw in treating confidence as probative—mistakes arise from the core’s fallibility, not procedural error. The jury *should* have convicted based on Thompson’s testimony alone, absent contradictory evidence.  

  #### **Disjunctivism**
  - **Thompson's perception during assault**: If veridical, this was a *relational state* with Poole as a constituent. Confidence attaches to the perceived object (Poole), not an internal representation.  
  - **Later memory/identification**: Her lineup identification is *not a memory of the relational state* but a distinct, non-relational state (e.g., confabulation). Confidence attaches to an internal simulacrum, not Poole.  
  - **Evidence for police/jury**: They mistakenly treat Thompson’s certainty as evidence of a past relational state. But disjunctivism holds that only the *actual relational state* (with Poole) constitutes direct evidence; her lineup certainty is evidence only of her *current conviction*.  
  - **Options/conclusions**: They should have recognized that lineup identifications are *categorically different* from veridical perception and thus inherently unreliable. The procedure could not, in principle, access the original relational state. The jury *should* have excluded or heavily discounted eyewitness testimony.  

  ---

  ### **Upward Mapping: Case → Theory**

  #### **Does the case refute disjunctivism?**  
  The temptation (that Thompson’s indistinguishable experience "proves" a common core) *should be resisted*.  
  - **Disjunctivist defense**:  
    1. **Metaphysical, not epistemological**: Disjunctivism denies a *metaphysical* common kind between veridical and non-veridical states. Thompson’s first-person indistinguishability is an *epistemic* limitation, not evidence against the metaphysical distinction.  
    2. **Original perception was veridical**: She *did* relationally perceive Poole. Her later misidentification is a *different mental kind*—a failure of memory, not perception. The argument from illusion conflates these.  

  #### **Mnemonic Disjunctivism: Extension and Application**  
  - **Core claim**: Genuine remembering (relationally accessing the past event) and confabulation (internally generating a false memory) are distinct mental kinds.  
  - **Predictions for the case**:  
    - Thompson’s photo/lineup identification was *confabulation*, not genuine memory. The original relational perceptual state could not be "retrieved" in the lineup context.  
    - Her certainty reflects confidence in the *present confabulation*, not the past perception.  
    - The identification procedure was *inherently unreliable*: Lineups generate internal representations, not relational access.  
  - **Does this help or hurt disjunctivism?**  
    - **Helps**: Explains why the system failed—police treated confabulation as memory, ignoring the categorical gap.  
    - **Hurts**: Struggles to explain the *felt continuity* between Thompson’s memory and perception. Disjunctivism must argue this continuity is illusory (a feature of confabulation, not true memory), weakening intuitive appeal.  

  ---

  ### **Epistemic Commitment**  
  **The case is evidentially inert with respect to the dispute.**  
  - **Why?**  
    1. **Silent on perception’s metaphysics**: The case involves *memory and identification procedures*, not the nature of perception itself. Both theories accommodate the facts:  
       - Common-factor: Mistake arose from a shared experiential core misattributed to Cotton.  
       - Disjunctivism: Mistake arose from conflating a relational perception (of Poole) with a non-relational identification (of Cotton).  
    2. **Indistinguishability is not decisive**: Thompson’s subjective certainty is predicted by *both* theories:  
       - Common-factor: Confidence attaches to the core.  
       - Disjunctivism: Confidence attaches to a present mental state (confabulation).  
    3. **No leverage on the core dispute**: The metaphysical question—whether veridical/non-veridical states share a common kind—cannot be settled by a case where the *original perception was veridical* and the error occurred downstream.  

  **Points of silence**:  
  - Neither theory explains *why* Thompson misidentified Cotton (e.g., cross-race effect, suggestion in lineup).  
  - Neither prescribes *specific reforms* (e.g., double-blind lineups); both merely diagnose the error differently.  

  **Conclusion**: The Cotton case illustrates the *practical consequences* of misinterpreting subjective certainty, but it does not—and cannot—adjudicate between disjunctivism and the argument from illusion. The dispute turns on metaphysical commitments untouched by this case.
