prompt: |-
  I work in quantitative policy evaluation and read philosophy of social science on the side, and there is a configuration I keep running into that I have no word for.

  Two cases.

  (1) A model of a bank run. Each depositor withdraws because she expects the bank to fail, and she expects the bank to fail because she expects the other depositors to withdraw. Written out in full, the individual-level story is complete: the event is nothing but individual actions and the expectations behind them. But those expectations have the collective event as their content. You cannot specify the individual-level facts without already deploying the collective-level vocabulary — that the bank is failing, that everyone is pulling out — and you cannot fix which collective event is in question without the individual-level facts. Neither level is prior; each is statable only in terms of the other. What I keep noticing is that nobody in the individualism-versus-holism literature seems to count this as a defect. It does not read as circular, because the borrowed material sits inside the content of what the individuals believe rather than among the premises of the explanation.

  (2) The firm has become risk-averse since the merger. Pressed, no member is risk-averse: the traders are as aggressive as ever, the risk committee follows the same procedure, the new CEO takes large bets. Distribute the property across the members and it evaporates; yet the claim about the firm is plainly true and plainly about something. Now go the other direction. State every individual's dispositions and relations completely, and you still appear to need to be told whether they compose into a risk-averse firm — in the way you would need to be told whether this arrangement of parts is a pump.

  What I take to be shared: in both cases the individual-level and the collective-level descriptions depend on each other, and the dependence is not a causal loop in time. I am not claiming that next year's run causes this year's expectations. It is closer to a dependence in what can so much as be specified at one level without the other. And in both cases the two standing methodological programs each pick one direction as the respectable one — individualism says explain the collective by the individuals, holism says the collective is irreducible — and neither seems to have a category for the case where the direction of dependence is not well-defined at all.

  I have been told this is just supervenience, and separately that it is just the demand for microfoundations. I do not think either fits. Supervenience as I understand it is a one-directional claim about what can change without what changing; the microfoundations demand is an instruction to rebuild the macro out of the micro, and it is silent about what happens when the rebuilding quietly imports the macro vocabulary. Self-fulfilling prophecy and feedback loops are near misses as well, but they are causal and temporal, and what I am describing is not.

  So: does this configuration have a name of its own — the two-way dependence of levels, and the way it goes unnoticed because it hides either inside the content of what individuals believe or inside what counts as a property of the whole? If it does, I do not want only the label. I want the carving: its exact boundaries, the neighboring notions it is not (supervenience, emergence in its weak and strong varieties, non-aggregativity, constitutive as opposed to causal explanation, downward causation, and whatever else sits in that neighborhood), and an account of where a case like (1) and a case like (2) come apart, if they do. I am genuinely unsure whether these are one phenomenon or two that I have lumped together, and I would rather be told they are two than given a tidy answer. If there is no established concept, say so plainly, coin a name, and give me a definition together with the boundary cases that would decide membership — including what would count as evidence against treating (1) and (2) as instances of one thing.

  Please do not give me citations, references, or a reading list; I can find the literature once I know what to look for. Lead with your bottom line in the first sentence — the name, or the verdict that there is none — and then give the reasoning, with no preamble and without restating my question back to me. Say how confident you are in each of your main claims and single out the one you are least sure of. American English, please.
reasoning: |-
  Okay, let me tackle this systematically. The user describes a specific conceptual problem in social ontology - the mutual dependence between individual and collective levels that doesn't fit neatly into existing philosophical categories. 

  First, I recognize this isn't about standard emergence or supervenience. The user clearly distinguishes their cases from these concepts. The bank run example shows how individual beliefs reference the collective outcome that depends on those very beliefs. The firm's risk-aversion demonstrates a collective property that doesn't reduce to individual attributes. Both reveal a two-way conceptual interdependence.

  I consider how existing frameworks fall short. Supervenience is unidirectional - collective properties depend on individual ones but not vice versa conceptually. Microfoundations demand reductionism but ignore how macro concepts infiltrate individual descriptions. Feedback loops are causal/temporal, while this is about conceptual interdependence.

  The core issue seems to be what I'll call "hermeneutic holism" - where collective concepts are necessary to describe individual mental states (beliefs about collectives), and individual states are necessary to constitute collectives. This creates a circle that's not vicious because the collective reference is embedded in intentional content rather than explanatory premises.

  For the firm case, it's different - "constitutive context-dependence" where the whole's properties aren't predictable from parts alone because the property ascription depends on relational configurations recognized as meaningful only at the collective level. Like how piston arrangements become a "pump" through functional interpretation.

  I'm most confident about distinguishing these two phenomena. The bank run involves intentionality (beliefs about collectives), while the firm case is about property emergence from structure. Least confident about whether "hermeneutic holism" fully captures cases where collective concepts shape perception without explicit belief.

  To test if they're truly distinct: if we removed intentional states from the bank run, the interdependence collapses; but the firm's risk-aversion could persist through structural factors alone. This suggests separate mechanisms requiring different treatments.
answer: |-
  **Verdict: No established single concept covers both cases; they constitute distinct phenomena requiring separate terms—*hermeneutic holism* for (1) and *constitutive context-dependence* for (2).**  

  ### Core Reasoning & Boundaries:
  1.  **Your Case (1): Bank Run → *Hermeneutic Holism***  
      -   **Nature:** Individual actions are *intentionally directed* at a collective state (e.g., "the bank failing"), which is itself constituted solely by those actions. The collective description is *semantically necessary* to specify the content of individual mental states (beliefs, intentions).  
      -   **Boundaries:**  
          -   *Not circular explanation:* The collective term isn't a premise explaining actions; it's embedded in the *description* of the agents' reasons.  
          -   *Not supervenience:* Supervenience asserts dependence of collective on individual (A-properties fix B-properties). Here, individual-level descriptions *presuppose* collective vocabulary semantically.  
          -   *Not emergence:* No novel causal powers; the collective is "nothing but" individuals, yet individuals cannot be fully described without collective concepts.  
          -   *Key Evidence Against:* If agents acted based *only* on expectations of *individual* actions (e.g., "I expect Alice/Bob to withdraw"), not the *collective* state, the interdependence vanishes.  
      -   **Confidence:** High (95%). Least sure if non-mental phenomena (e.g., adaptive traits) could fit.  

  2.  **Your Case (2): Risk-Averse Firm → *Constitutive Context-Dependence***  
      -   **Nature:** Collective properties (e.g., "risk-averse") are *attributed based on the functional role* of the whole within a larger system, not by summing/distributing individual properties. The property holds *in virtue of* relational structure and external interpretation, even with complete individual-level knowledge.  
      -   **Boundaries:**  
          -   *Not aggregativity:* The property isn't a function of individual attributes alone; context defines what the property *is*.  
          -   *Not strong emergence:* No downward causation; the whole’s "risk-aversion" doesn't causally constrain parts.  
          -   *Not constitutive explanation failure:* The whole *is* constituted by parts/relations, but the *property ascription* requires external criteria (e.g., "does this pattern *count as* risk-aversion in a firm?").  
          -   *Key Evidence Against:* If "risk-aversion" were definable *only* via a specific distribution of individual dispositions (e.g., average risk-tolerance), the dependence collapses.  
      -   **Confidence:** High (90%). Least sure if all non-aggregative properties fit (e.g., liquidity vs. risk-aversion).  

  ### Why They Are Distinct Phenomena:
  -   **(1) Depends on Intentionality:** The interdependence in the bank run *requires* agents to have beliefs *about the collective state*. Remove intentionality (e.g., a mechanical system with feedback), and the semantic dependence dissolves.  
  -   **(2) Depends on Functional Interpretation:** The firm’s property depends on *external attribution of function/role* ("risk-aversion" as a behavioral disposition of the *organization*). Individual beliefs about the collective are irrelevant.  
  -   **Test for Separation:**  
      -   If you redescribe the bank run using *only* expectations of *individual* actions (not "bank failure"), (1) evaporates, but (2) persists (the firm can be risk-averse without any member believing it).  
      -   If you describe a non-intentional system (e.g., a biochemical network) with context-dependent properties, (2) holds, but (1) is inapplicable.  

  ### Neighboring Concepts Excluded:
  -   **Supervenience:** One-way dependency (individual → collective); cannot capture semantic or contextual two-way ties.  
  -   **Microfoundations:** Assumes individualism is achievable; ignores how collective concepts infect individual descriptions in (1) or contextual attributions in (2).  
  -   **Weak Emergence:** Focuses on predictability/complexity from micro, not semantic or contextual necessity.  
  -   **Downward Causation:** Irrelevant; no causal loops asserted.  
  -   **Self-Fulfilling Prophecy:** A causal instance of (1), but (1) is broader (semantic dependence) and (2) is non-causal.  
  -   **Constitutive Explanation:** Accepts parts constituting wholes, but doesn’t address why (1) needs collective *semantics* or (2) needs external *context* for property ascription.  

  ### Verdict Confidence:
  -   **Overall Confidence:** 85% that these are distinct and lack a unifying term.  
  -   **Weakest Claim:** That *all* non-aggregative properties fit (2). Some (e.g., "efficiency") might be reducible under idealization, unlike "risk-aversion" which is inherently contextual.
