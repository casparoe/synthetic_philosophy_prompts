answer: |-
  ## Remarks for the Transfer Ceremony: *Rent Strike* Archive

  Thank you all. Thank you to the library, its dedicated archivists and librarians, for welcoming this new collection into your care. Thank you to the producers and funders who believed in Hallie Brant’s story enough to bring it to the screen. Thank you to the documentary studies students – you’re why we do this, why we try to wrestle the past into shape. And most importantly, thank you, Naomi, for your generosity and trust throughout this long process. Having you here means more than I can say.

  We’re gathered today to mark the transfer of the production archive for *Rent Strike* into the same institution that safeguards Hallie Brant’s own papers: her letters, her case files, the crackling cassette recordings of meetings where her voice cut through the noise. It’s a profound gesture, placing our interpretation of Hallie’s life alongside the raw materials that shaped it. It’s also an act of faith – faith that these two archives, the factual and the fabricated, the documented and the dramatized, can coexist meaningfully. Sitting with that juxtaposition forces hard questions, questions I’ve wrestled with daily as the screenwriter, and which feel especially urgent today.

  Because *Rent Strike*, while deeply rooted in Hallie’s incredible life and work, is not a documentary. It’s a dramatization. A feature film. And like most films based on real lives, it makes choices – necessary choices, perhaps, for narrative coherence and emotional impact within a two-hour frame, but choices that inevitably alter the historical record. Today, as we commit both the *source* and the *interpretation* to the archive, I feel a responsibility to be transparent about three significant choices we made, choices that sit at the heart of the tension inherent in biographical fiction.

  **First,** there is a character named Del. Del is vital to our story. He represents the tenants, the organizers, the community members who stood shoulder-to-shoulder with Hallie through grueling fights. But Del is not one person. He’s a composite. We drew him from the lives and spirits of three remarkable individuals woven into Hallie’s journey. We did this to streamline a complex network of relationships, to give the audience a single, sustained point of connection to the struggle beyond Hallie herself. We gained narrative focus. But what we lost, undeniably, is the distinct individuality, the specific contributions, the unique voices of those three real people. Their specific histories blur into Del’s. That’s a cost. We condensed reality, and in doing so, we obscured it.

  **Second,** the film gives Hallie a powerful public speech. The passion, the outrage, the sharp legal reasoning, the unwavering belief in justice – that is all Hallie. The *sentences* she speaks in that scene were written by her. But they weren’t written for a rally. We found them scattered across deeply personal letters, moments of private frustration, determination, and clarity poured onto the page for a friend, a colleague, perhaps just for herself. We lifted those intimate thoughts, those private convictions, and placed them onto a public stage. We did it because those private words *felt* like the truest expression of her public fire, because they revealed the engine driving her relentless advocacy. We believed they articulated her core beliefs in a way no public record quite captured. But we undeniably changed their context. We took words meant for one audience, one moment, and gave them to another. We amplified a private voice into a public declaration she never made in exactly that way.

  **Third…** and this is the most difficult to address… the film depicts a moment near the end. A reconciliation. An estranged brother returns, words are spoken, a long silence is broken. This scene… did not happen. It’s invented. Furthermore, including it directly contradicts an undertaking – a promise sometimes called a "silence rule" – we made to Hallie’s estate, represented by Naomi. The promise was clear: Hallie Brant would never be given a line she was not on record as having said or written. In this one instance, we broke that promise. We invented words and put them in her mouth at a moment charged with finality. We did it driven by a narrative desire for closure, perhaps by a hope for healing that the historical record, in its starkness, did not provide. But the fact remains: we added a scene that Naomi, who knew her mother intimately, says is untrue. We overstepped a boundary we had agreed to respect.

  So why stand here and confess this? Why not let the film speak and the archive hold its secrets? Precisely *because* of the archive. Placing our fictional construct beside Hallie’s authentic papers demands honesty about the difference.

  My documentarian friend framed this dilemma for me powerfully. She said the potential wrong isn't necessarily a *harm* to Hallie herself – she is beyond harm. It’s something else: a **betrayal**. A misuse of a voice that can no longer answer back. Creating an unfairness in the record, one that can never be repaired *by the person it was done to*. It’s the fundamental asymmetry of speaking for the dead.

  But she also said the opposite. That dramatization can sometimes reach a different kind of **truth**. That a scene built from the very marrow of someone’s private convictions, even if rearranged, might resonate with an essential aspect of who they *were* in a way a strict recitation of facts cannot. That narrative compression, while obscuring individual truths, can sometimes illuminate a larger, more resonant pattern.

  Holding these two seemingly contradictory ideas – the *betrayal* and the *deeper truth* – is the tightrope we walk when we dramatize real lives. Especially lives like Hallie Brant’s, defined by a fierce commitment to truth-telling and justice. It feels like a particular responsibility. And it forces the question: **What do we owe someone who no longer exists?**

  We owe them memory. We owe them the effort to understand. We owe them the refusal to simplify their complexities into easy heroism. But when we craft a story, we also incur other debts: to the audience’s engagement, to narrative shape, to the emotional arc we believe does justice to the *spirit* of their struggle.

  We cannot owe Hallie Brant our certainty about what she would think of this film. I stand here utterly incapable of claiming that. She is the one person in this room who cannot correct me, who cannot lean over and whisper, "That’s not how it was," or "You got that part right." To claim to know her approval would be the ultimate presumption, another kind of speaking for her.

  What we *can* do, and what this archive placement compels, is acknowledge the distance between the record and the rendition. To the archivists: You are the guardians of distinction. This production archive doesn’t belong beside Hallie’s papers because it possesses the same *kind* of truth. It belongs here as an artifact of how her life and work inspired this *specific act of interpretation* at this *specific moment in time*. It’s evidence of the attempt, the wrestling match between fact and story, the ambition and the compromises. It’s a testament to the power her real actions had, power potent enough to generate this fiction. Use it to show students the gap, the choices, the consequences. The letters are the bedrock; our scripts and edits are the structure we built upon it – study both to understand the landscape and the architect.

  To Naomi: Thank you for your presence. Thank you for sharing your mother with us, even knowing the imperfections of the lens. That scene… I understand why it isn’t just a fictional flourish to you. It crosses a line we drew together. My acknowledgment here isn’t an apology crafted for ceremony, but a necessary statement of fact out of respect for you, for your mother, and for the promise made. The film contains an invention regarding a deeply personal matter, one you know did not occur. That truth stands alongside the film itself now.

  And to the students: Argue. Argue passionately. Is the composite Del a necessary evil or an erasure? Does putting private convictions into a public mouth illuminate Hallie’s essence or distort her history? Does the invented reconciliation, however emotionally satisfying, fundamentally betray the woman who lived the life we sought to portray? Does the *deeper truth* justify the factual betrayal? Where is the line? Is there a line? These aren’t abstract questions. They are the daily terrain of anyone trying to translate real lives into story. Your arguments *are* the honouring of the complexity.

  So, how do we honour Hallie Brant here today? Not by pretending the film is a flawless mirror. Not by claiming her spectral endorsement. Not by ignoring the choices made in her name.

  We honour her by **vigilance**. Vigilance about the power we wield when we shape stories of the departed. Vigilance about the gaps between the lived life and the told tale. Vigilance about the voices we borrow and the promises we keep.

  We honour her by **transparency**. By naming the inventions even as we present the art. By allowing the archive to hold both the source and the interpretation, clearly distinguished.

  We honour her by **reckoning**. By acknowledging the inherent tension, the potential betrayal alongside the aspiration for truth. By accepting that portraying a fighter for justice requires us to constantly question the justice of our own portrayal.

  We honour her, ultimately, by recognizing that the *real* Hallie Brant exists most powerfully not in our film, but in the letters you archivists preserve, in the cases she fought, in the lives she changed, and in the memories of those who loved her, like Naomi. Our film is a shadow, an echo, an attempt. Her papers are her voice.

  This archive placement is an invitation. An invitation to future researchers, students, storytellers: Look at Hallie’s words. Listen to her recordings. Study her fights. *Then* look at what we built from them. See the choices. Question them. Learn from them. Let the friction between the fact and the fiction spark deeper understanding, not just of Hallie Brant, but of the difficult, necessary, and always imperfect art of remembering.

  Thank you.
