  The appellants have three main arguments: sometimes they weren't pricing the same event (different reference classes), they might disagree on priors rather than evidence, and they object to the public marker implying irrationality. The data lead defends the rule, citing an 11% improvement in Brier score and arguing that persistent divergence indicates a failure to update, which undermines the shared-prior model.

