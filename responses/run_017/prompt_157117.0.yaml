  Okay, let me approach this step by step. The user presents a complex moral dilemma about blame and hypocrisy in their novel, with two sisters - Hannah who had an affair and lied about it, and Miriam who's hiding financial deception. Hannah discovers Miriam's deception and blames her, but the narrative needs to convey this blame feels "off" despite being factually correct. 

  The core challenge is articulating why Miriam might feel entitled to resist Hannah's blame, without falling into the philosophical trap that makes blame universally impossible. The user's philosopher friend has outlined a six-step argument leading to the problematic conclusion that virtually no one has standing to blame anyone. 

  First, I need to identify which premise is causing the issue. Premise (4) seems particularly vulnerable - the claim that "for any fault in another person that I might blame, there is some description under which I have done the same kind of thing myself." This overgeneralizes moral equivalence in a way that destroys meaningful distinctions between actions. 

  The user proposes an alternative: standing as reciprocal exposure rather than clean hands. This seems promising because it centers on the blamer's attitude rather than their moral purity. Hannah's blame becomes defective not because she's sinned, but because she implicitly claims moral superiority she wouldn't grant Miriam in reverse.

  For the novel's narration, I suggest showing rather than telling. Have Miriam notice the discrepancy between Hannah's current righteous anger and her past evasion when confronted about her affair. The key is Hannah's tone - the absence of humility that should accompany moral criticism from one who knows their own fallibility.

  Among philosophical solutions, the reciprocal exposure model costs least because it preserves blame's possibility while acknowledging how hypocrisy undermines its moral force. It avoids both the absurdity of universal standinglessness and the cheapness of treating hypocrisy as merely evidentiary.
answer: |-
  Your scene's moral tension is exquisite—Hannah's factual accuracy paired with a register that rings false captures exactly the kind of hypocrisy that feels visceral but defies easy logic. Let's dismantle the philosopher's argument, preserve what works for your novel, and find the precise lever for Miriam's entitlement.

  ### The Premise That Fails: (4) is Overreaching
  - **Why it looks fine**: It seems compassionate and humble—"we're all flawed." It echoes religious concepts of universal sin.
  - **Why it fails**: It flattens moral distinctions. "Deceiving a partner about an affair for years" and "lying to a child about Santa" both involve deception, but they aren't **morally equivalent acts**. The premise ignores:
    - **Scale**: Duration, harm, and stakes matter. A white lie ≠ systemic betrayal.
    - **Context**: Obligations to a spouse ≠ obligations to a stranger.
    - **Intention**: Malice, recklessness, or desperation alter the act’s moral character.
  - **Cost of rejecting it**: None, practically. We preserve the intuition that *some* hypocrisies undermine standing (Hannah’s) while allowing others (a repentant addict blaming a dealer) to retain it.

  ### Your "Reciprocal Exposure" Patch: Almost Perfect
  - **What it does**: Shifts focus from *past behavior* to *present attitude*. Standing depends on whether the blamer would accept being held to the *same standard by the blamed*. Hannah's blame is defective because she implies, "My past doesn’t negate my authority; yours does." If Miriam tried to blame Hannah for her affair *using Hannah’s own tone*, Hannah would dismiss it as irrelevant or disproportionate—exposing the asymmetry.
  - **Why it works for your scene**: 
    - Hannah *is* factually right about Miriam’s wrongdoing.
    - Her blame feels "off" because it carries an unspoken claim: *"I see clearly from a height you can’t reach."* 
    - Miriam’s entitlement isn’t to avoid blame, but to say: *"You don’t get to stand there, untouched by your own history, while you condemn me."*
  - **What it costs**: Very little. It allows for non-hypocritical blame (e.g., a victim blaming their abuser) and avoids the absurdity of (5).

  ### Ranking Other Solutions by Cost
  1. **"Hypocrisy is merely epistemic"**  
     *(i.e., it suggests the blamer might not truly believe the norm)*  
     **Cost**: High. Makes Hannah’s blame *irrational* rather than *morally defective*. But Hannah clearly believes in honesty—she’s violated it, not rejected it. This undermines your "register" problem.

  2. **"Standing requires equal moral position"**  
     *(e.g., both are spouses, both deceived partners)*  
     **Cost**: Too narrow. A child can blame a parent for cruelty even without being a parent. Also, Hannah *is* in an equal position (both betrayed trusted intimates)—yet her blame still feels illegitimate.

  3. **"No standing condition at all"**  
     **Cost**: Destroys your scene. If anyone can blame anyone, Miriam has no grounds for resistance. Hannah’s history becomes irrelevant.

  ### What the Narration Should Make Explicit
  Miriam’s entitlement isn't to avoid judgment or even anger—it's to reject Hannah’s **tone of uncontaminated virtue**. The narration should highlight:
  - **Hannah’s bodily certainty**: She stands straight, voice unwavering—no tremor of shared fallibility.
  - **Miriam’s flashback**: Contrast Hannah *now* with Hannah a decade ago: evasive, defensive, minimizing her affair when confronted. *That* Hannah understood moral gravity feels different from the inside.
  - **The unspoken asymmetry**: Hannah speaks as if her past is archived and irrelevant, while Miriam’s is an active indictment. Miriam thinks: *"You rebuilt your life on buried evidence. I get no such grace?"*
  - **A concrete image**: Hannah points a finger at Miriam. The narration notes it’s the same hand that, years prior, nervously twisted a wedding ring while lying.

  ### The Core Fix
  **Reject premise (4)**. Not all wrongs are equivalent, so Hannah *could* have standing if her blame acknowledged their shared frailty. But she doesn’t. Her blame fails **premise (2)**: She *claims* commitment to honesty, but her performance suggests she exempts her *past self* from its weight. This turns blame into "scolding" (as (2) warns). 

  **What Miriam is owed**: Blame that carries the shadow of the blamer’s own regret. Hannah’s should sound like: *"I know how lies take root because I fed mine. Don’t let yours grow."* Instead, it sounds like: *"I am the voice of truth, and you are its enemy."* That false separation is what Miriam—and the reader—rightly resists. 

  Your patch holds: **Standing is shattered not by dirty hands, but by the refusal to imagine them stained in reverse.** That’s where the moral mechanics crystallize for your scene.
