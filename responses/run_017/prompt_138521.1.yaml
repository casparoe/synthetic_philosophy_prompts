prompt: |-
  I help run a small forecasting group — we keep a shared spreadsheet of long-run predictions (decades-to-centuries scale), score them when their window closes, and every single meeting we have the same argument: which of the failed ones get tagged "wrong" and which get the coveted "not yet." Everyone claims their favourite theory was right but early and everyone else's was just wrong, and I've stopped trusting any of us including me. So I want the principle, not a survey. Here are my actual verdicts, in roughly the order I became confident about them.

  Wegener, continental drift: proposed around 1912, ridiculed for decades, vindicated by plate tectonics in the 1960s. Clear case of right-but-early. Any rule I accept has to hand this one to me.

  Malthus, the 1798 essay: population outruns food, geometric versus arithmetic, and misery or vice does the checking. Over the next two centuries food per head went up, real wages went up, and the checks never arrived in the countries he was writing about. My verdict: I don't want to say refuted and I don't want to say early either. I want to say something like "the mechanism was the binding constraint for the world he was actually in, and stopped being binding when industrial agriculture and then the demographic transition arrived." I can't tell whether that's a rescue or a surrender with better PR.

  Ehrlich, The Population Bomb: dated famine forecasts, hundreds of millions starving in the 1970s and 80s. Didn't happen. Refuted, not early — and I specifically don't want to credit him for the famines that did occur in Bangladesh and Ethiopia, because as far as I can tell they had political causes rather than the one he named. But then here's the thing that makes me suspicious of myself: I do think the metals bet he lost to Simon in 1990 counts as real evidence against him, and I refuse to count the Green Revolution as evidence against Malthus, and I cannot say what the difference is. Two centuries of the world not ending is not disconfirmation, but ten years of five commodity prices is?

  Limits to Growth: business as usual leads to overshoot and decline sometime within this century. Genuinely not yet — the window hasn't closed and I get irritated when people treat the 1980s oil glut or the long fall in commodity prices as a refutation. (I also have a vague half-memory of a reanalysis in the last few years claiming the observed data still track the business-as-usual-ish run, but I don't want to lean on it.)

  Hubbert's curve: he said US output would top out around 1970 and more or less it did, which feels like the cleanest hit on the board. The same curve applied to world production kept failing, and now people are saying we'll peak on the demand side instead, from electrification. My verdict: right on time in one domain and dead in another, and I feel uneasy about that, because it means whether a theory was "early" depends on which system you pointed it at, which sounds like a fact about luck rather than about the theory.

  Grand Banks cod, the 1992 moratorium: the stock collapsed after years of warnings. I want to count it as a hit for Malthusian-style reasoning about a commons, but I also suspect I shouldn't, since a fishery is a renewable stock and Malthus's engine was population.

  The sliding ones — fusion is twenty years away, human-level AI is twenty years away, and have been for sixty years. I'm most confident about these: not early, and the re-dating is itself the tell, because the horizon recedes about as fast as it approaches. (Some Lakatos thing about degenerating programmes that I only half remember from a methodology seminar.)

  Peak child: growth rates peaked decades ago and fertility is below replacement across much of the world. I genuinely don't know which way this cuts. Either Malthus is refuted by his own mechanism switching itself off, or the check finally arrived in a form he never predicted — prosperity-induced fertility decline instead of misery — and he gets credit anyway.

  The wrinkle I keep coming back to: some of these predictions are about systems that read their own predictions. Publishing Limits to Growth is arguably part of why business as usual didn't happen, and I can't decide if that's a point in the theory's favour or a disqualification.

  My tentative principle, such as it is: a prediction gets rescued as "early" only if the theorist stated in advance both a mechanism with a clock of its own and a dated trigger condition — and each rescue is allowed to re-date the trigger but never to re-specify the mechanism or re-set the clock. On my own rule Wegener passes and Ehrlich fails and the fusion people are out on the re-dating clause, and I think it gives me Hubbert-right-about-Texas-but-not-the-world, but I have no idea what it says about Malthus, which is the case I'm most protective of, since nobody writing in 1798 wrote down a falsification condition for anything. So I suspect "stated in advance" is doing far too much work and needs replacing with something a historian could apply to a text that predates the idea of a research programme.

  Give me one principle or a tight set of clauses, not a menu: tell me which clause is motivated by which case, tell me plainly which of my verdicts it forces me to drop and why I should accept losing it, and commit to the two I haven't scored yet — antibiotic resistance (the post-antibiotic era was announced decades ago, hasn't arrived on schedule, and the underlying trend keeps getting worse; I flip on this one monthly), and the "peak demand" move that rescues Hubbert by swapping the mechanism. If my own rule is basically right, say so and repair it; if it's wrong, say what replaces it. And tell me how confident you are that I'd still hold this principle a year from now.
reasoning: |-
  Okay, this is a fascinating and deeply thoughtful problem from someone running a forecasting group. The core tension is how to distinguish between "wrong" and "not yet" for long-term predictions without letting personal biases creep in. The user has provided several case studies with their own verdicts and a tentative principle, and they're clearly frustrated by the subjectivity in their group's evaluations.

  First, I need to understand the user's underlying concerns. They mention distrusting themselves and others in the group, which suggests a desire for objectivity. The examples span from continental drift to antibiotic resistance, showing they need a framework robust enough to handle diverse domains. Their tentative principle focuses on mechanisms and clock triggers, but they're worried it might be too text-dependent, especially for older theories like Malthus.

  Looking at their verdicts: Wegener is clearly "right-but-early" for them, Ehrlich is "refuted," Limits to Growth is "not yet," and Hubbert is split. The Malthus case is where they're most conflicted—they don't want to call it wrong but can't call it early either. Their mention of prediction systems that "read their own predictions" adds another layer of complexity.

  The user's tentative principle has merit but needs refinement. The requirement for "stated in advance" is problematic for historical texts. Instead, I should focus on whether the mechanism and trigger are inferable from the theory itself. For Malthus, the mechanism (population vs. resources) is clear, but the trigger isn't specified, making it unfalsifiable. That's why it gets "not applicable" rather than "early."

  For antibiotic resistance, the mechanism is clear (resistance evolution), and the trigger (widespread treatment failure) is observable, so it stays "not yet." Peak demand for oil involves a mechanism swap, so it fails the continuity test—Hubbert was right for Texas but not for the world under his original mechanism.

  The key is to enforce falsifiability while allowing for timing adjustments. The three-clause framework I'm considering would handle Wegener (clear mechanism and trigger), Ehrlich (dated forecasts failed), and fusion (re-dating). It also resolves their internal conflict about commodity prices vs. centuries of data: Ehrlich had a dated trigger that failed, while Malthus didn't.

  I feel confident this framework would hold up over time because it's rooted in scientific epistemology (falsifiability, Lakatos) rather than subjective preferences. It forces them to drop the Hubbert-world case as "wrong" due to mechanism drift, which might sting but is necessary for consistency. Most importantly, it protects Malthus not as "early" but as a different kind of insight—which aligns with their instinct to neither refute nor rescue him.
answer: |-
  Here’s a unified principle derived from your cases, designed to enforce objectivity and minimize hindsight bias. It has three strict clauses, each targeting a specific failure mode in your examples:

  **The Principle of Testable Mechanism Anchoring (PTMA)**  
  A prediction earns "not yet" status **only if**:  
  1. **Mechanism Specificity**: The core causal mechanism is explicitly defined and *distinct from competing explanations*.  
  2. **Trigger Falsifiability**: A *testable trigger condition* is stated (or strongly implied) *in advance*, allowing observers to identify when the mechanism should dominate.  
  3. **Continuity of Mechanism**: Subsequent developments use the *same causal engine*; no retroactive swaps of core drivers.  

  ---

  ### **How PTMA Resolves Your Cases**  
  *(Clause motivations in bold)*  

  - **Wegener** ✅ *Not yet*  
    - *Why*: Mechanism (continental movement) was specific. Trigger (discovery of plate-driving forces) was *implied* by data gaps he cited. Vindication used *identical* mechanism.  
    - *Clause Motive*: **Distinguishes testable delay (missing plate tectonics) from vagueness**.  

  - **Malthus** ❌ **Not applicable**  
    - *Why*: Mechanism (population geometry vs. linear food) was specific ✅. But NO falsifiable trigger ❌—no timeline or threshold for "outrunning." "Checks" (vice/misery) were redefined post-hoc (e.g., dem. transition ≠ misery).  
    - *Verdict Change*: Forces "not early" *or* "refuted." **Surrender**: Malthus described *a* constraint, but PTMA denies "early" status due to untestable triggers.  
    - *Clause Motive*: **Blocks retroactive mechanism-stretching (e.g., "checks" = fertility decline)**.  

  - **Ehrlich** ❌ *Refuted*  
    - *Why*: Dated triggers (1970s/80s famines) failed ❌. Bangladesh/Ethiopia famines invoked *different* mechanisms (war/policy), violating continuity ❌.  
    - *Commodity Bet*: Simon won *on Ehrlich’s trigger* (10-year price rise), making it valid disproof. Malthus lacks comparable test.  
    - *Clause Motive*: **Penalizes dated forecasts that fail AND mechanism-swapping (e.g., "any famine counts")**.  

  - **Limits to Growth** ✅ *Not yet*  
    - *Why*: Mechanism (systemic overshoot) defined ✅. Trigger ("collapse ~2100") remains open ✅. No mechanism swap ✅.  
    - *Self-Defeating?*: PTMA ignores reflexivity; focus is on *mechanism* validity. If policy avoids collapse, it neither confirms nor refutes the *model’s causal logic*.  

  - **Hubbert (US)** ✅ *Right on time*  
    **Hubbert (World)** ❌ *Refuted*  
    - *Why US*: Mechanism (resource depletion curves) + trigger (1970 peak) correct ✅.  
    - *Why World*: "Peak demand" invokes a *new mechanism* (electrification), violating continuity ❌. Original mechanism (depletion) failed.  
    - *Verdict Change*: Forces "refuted" for global peak oil. **Hubbert got lucky with Texas geology; theory wasn’t "early" globally.**  

  - **Fusion/AI** ❌ *Refuted*  
    - *Why*: Re-dating the *same trigger* ("20 years away") every decade fails Trigger Falsifiability ❌. No new *mechanistic* reason for delay.  
    - *Clause Motive*: **Flags degenerative re-dating (Lakatos core decay)**.  

  - **Grand Banks Cod** ⚠️ **Not Malthusian**  
    - *Why*: Commons collapse validates *institutional*, not Malthusian, theory. Renewables ≠ population geometry. PTMA blocks annexation.  

  - **Peak Child** ⚠️ **Irrelevant to Malthus**  
    - *Why*: Fertility decline uses *affluence*, not Malthus’ "misery/vice." Mechanism swap ❌. PTMA denies credit.  

  ---

  ### **Your Unscored Cases**  
  - **Antibiotic Resistance** ✅ *Not yet*  
    - *Why*: Mechanism (evolutionary pressure → untreatable infections) specific ✅. Trigger (widespread clinical failure) remains open ✅. Delays (new drugs, stewardship) don’t invalidate the core engine.  
  - **"Peak Demand" for Oil** ❌ **Rescue Attempt Fails**  
    - *Why*: Swaps Hubbert’s mechanism (supply depletion → scarcity) for a new one (demand destruction → abundance). Violates Continuity ❌. 

  ---

  ### **Why PTMA Over Your Tentative Rule?**  
  Your rule stumbled on Malthus because "stated in advance" is too textual. PTMA fixes this by:  
  1. **"Strongly implied" triggers** (e.g., Wegener’s data gaps implied a future discovery).  
  2. **Mechanism distinctness** blocking retroactive annexation (e.g., no claiming dem. transition for Malthus).  
  3. **No "falsification condition" requirement**—focuses on what the theory *does* claim.  

  **Confidence in Long-Term Hold**: **High (85%)**.  
  - PTMA is rooted in scientific epistemology (Popper/Lakatos), not your biases.  
  - It forces painful but consistent cuts (e.g., Malthus downgrade, Hubbert-world rejection).  
  - Survives stress tests: Reflexivity (e.g., climate warnings altering outcomes) is irrelevant to mechanism validity.  

  **Costs You Accept**:  
  1. **Malthus loses "early" status**—he becomes a *historical influencer*, not a vindicable theorist.  
  2. **Hubbert’s global peak oil is "wrong," not "misapplied."**  
  3. **No "partial credit" for mechanism-adjacent hits** (e.g., cod collapse ≠ Malthus).  

  This extracts a tax on vagueness and mechanism drift—which is precisely what your group’s arguments are exploiting. PTMA rewards only theories that risk being *disproved* on their own terms.
