answer: |-
  ### 1. Essay Question (Handout Version: 128 words)
  **Stem:** Gongsun Longzi argues "A white horse is not a horse" (Bái mǎ fēi mǎ). He claims: 'horse' designates shape; 'white' designates colour; what designates colour ≠ what designates shape. His key argument ("delivery") is: If you seek a horse, yellow/black horses suffice. If you seek a *white* horse, they do not. Thus, what is sought differs; acceptable/unacceptable are opposed. The objector notes having a white horse *is* having a horse, but the advocate concedes this while maintaining his thesis. Finally, he questions whether 'white' and 'horse' can be separated from a white horse.  
  **Your Task:** Using the **delivery argument**, explain why the claim "A wooden horse is not a horse" is plausibly true. Then, explain why the same argument applied to "A white horse is not a horse" seems problematic. Next, consider a language where 'white horse' is a single, unanalysable word (no parts meaning 'white' or 'horse'). Could the thesis and delivery argument still be meaningfully asserted? If not, what essential work is the shape-colour distinction doing? Finally, does the material on *separability* rescue a substantive philosophical thesis? What is that thesis?

  ---

  ### 2. Model Answer (1,058 words)

  Gongsun Longzi’s “white horse is not a horse” thesis relies crucially on the linguistic structure of compound terms and the delivery argument. Examining the stipulated cases reveals the argument’s limits and points to the chapter’s deeper, non-verbal core.

  **Delivery Argument: Wooden Horse vs. White Horse**
  The delivery argument distinguishes what fulfills a request. Applied to “A wooden horse is not a horse,” it works compellingly. If one seeks a *horse*, a wooden horse (e.g., a toy or statue) is unacceptable – it fails the functional essence of being a live, rideable animal. Yellow or black *living* horses are acceptable. Thus, “horse” and “wooden horse” designate distinct, opposed categories; what satisfies one request fails the other. The truth of “a wooden horse is not a horse” rests on a *substantive exclusion*: ‘wooden’ modifies ‘horse’ by negating its essential animacy or function.

  Applied to “a white horse is not a horse,” however, the delivery argument falters. Seeking a “horse” permits yellow/black horses; seeking a “white horse” excludes them. This suggests different requests. But crucially, fulfilling the request for a “white horse” *also* fulfills the request for “a horse” – one has a horse. The objector’s point holds: possessing a white horse *is* possessing a horse. Unlike ‘wooden’, ‘white’ doesn’t exclude the core essence designated by ‘horse’ (being an equine animal); it merely *specifies* an attribute within that category. The delivery argument shows the requests differ contextually, but it cannot establish that a white horse falls *outside* the category ‘horse’ itself. It confuses *intensional* difference (the concept requested) with *extensional* exclusion (not belonging to the class). It identifies ambiguity in reference but fails to prove non-identity or class exclusion for the white horse case.

  **The Unanalysable Word Case: Exposing Linguistic Dependency**
  Imagine a language where the concept ‘white horse’ is expressed by a single word, *zhuo*, with no constituent parts implying ‘white’ or ‘horse’. Asserting “*Zhuo* is not a horse” (*Zhuo fei ma*) is possible. However, Gongsun Longzi’s *delivery argument collapses entirely*. One cannot argue that seeking a *ma* (horse) permits bringing a yellow horse, but seeking a *zhuo* does not, because *zhuo* contains no element meaning ‘horse’ to be contrasted with ‘white’. The opposition between “what designates shape” and “what designates colour” vanishes, as *zhuo* designates neither shape nor colour in isolation; it designates the fused concept ‘white horse’ holistically. The argument relies entirely on the compositional structure of the compound term “bai ma”. Without the separable semantic components ‘bai’ (white) and ‘ma’ (horse), the internal tension the argument exploits disappears. One could still *assert* “*Zhuo* is not a horse,” but Gongsun Longzi’s specific reasoning based on designation, shape/colour distinction, and delivery becomes inapplicable. This shows the delivery argument is fundamentally a *linguistic* argument about compound terms, not a direct argument about reality or class membership.

  **The Role of Shape, Colour, and Separability: Salvaging Substance**
  If the delivery argument is linguistically contingent and insufficient to establish the thesis for the white horse case, what work do the opening (shape/colour designation) and closing (separability) passages do? They shift the ground from linguistic usage to *metaphysical* or *conceptual* distinctions.

  The claim that ‘horse’ designates *shape* (form, *xing*) and ‘white’ designates *colour* establishes a foundational ontology. It posits that distinct attributes (shape, colour) are designated by distinct names, and crucially, that these attributes are *ontologically separable*. The delivery argument attempts, poorly, to leverage this for exclusion. The separability discussion is key: “Can ‘white’ be separated from ‘horse’? Can ‘horse’ be separated from ‘white’?… When ‘white’ and ‘horse’ are combined, they form a thing.” (Paraphrasing GSLZ). This passage reveals the core thesis: **A ‘white horse’ is a concrete particular resulting from the combination of two distinct, universal attributes (‘whiteness’ and ‘horseness’).** The name ‘white horse’ designates this *composite particular*. The name ‘horse’ designates *only* the universal attribute ‘horseness’ (shape/form), abstracted from any specific colour.

  Therefore, “a white horse is not a horse” asserts that the *composite particular* (white horse) is not identical to the *abstract universal* (horseness) designated by ‘horse’. The wooden horse case is easily true because ‘wooden’ negates the essence of ‘horseness’. The white horse case is significant precisely because it seems false extensionally (“it *is* a horse!”) yet highlights an intensional distinction: the universal ‘horseness’ is not the same entity as the composite ‘horseness-combined-with-whiteness’. The unanalysable word *zhuo* designates only the composite particular; it cannot designate the universal ‘horseness’ alone, making the thesis “*Zhuo* is not a horse” trivially true but philosophically uninteresting without the contrast between universal and composite.

  **The Substantive Thesis**
  Demoting the delivery argument reveals Gongsun Longzi’s real target: **the relationship between abstract universals and concrete particulars.** The thesis is not sophistry about ambiguous language nor a simple denial of class membership. It is a claim about naming and reality: names like ‘horse’ designate abstract universals, while compound names like ‘white horse’ designate unique composites formed by combining universals. A particular white horse *instantiates* ‘horseness’ but is not *identical* to the abstract universal ‘horseness’ itself. The denial of identity is logical, not existential. The linguistic structure of compounds provides the *occasion* for this argument, but the core insight is metaphysical: universals are distinct from their instantiations in qualified particulars. This explains why the advocate concedes having a white horse *is* having a horse (extensionally, it instantiates the universal) while maintaining the identity claim is false (intensionally, the universal and the composite are distinct). The substantive thesis is that names track fundamental ontological distinctions between simple attributes and their combinations in objects.

  ---

  ### 3. Marking Scheme (5 items x 4 marks each = 20 marks)

  1.  **Delivery Argument Analysis (4 marks):**  
      *Must:* Clearly explain why delivery works for wooden horse (exclusion of essence) but fails for white horse (mere specification, extensional inclusion persists).  
      *Common Mistake:* Simply restates delivery argument for both cases without contrasting why it proves exclusion for 'wooden' but not 'white'.

  2.  **Unanalysable Word Case (4 marks):**  
      *Must:* Argue that the thesis *could* be asserted but the delivery argument *collapses* due to loss of compositional semantics; shape/colour distinction becomes inapplicable.  
      *Common Mistake:* Claims the thesis becomes impossible/meaningless, or fails to see the delivery argument's dependence on linguistic composition.

  3.  **Shape/Colour Distinction Role (4 marks):**  
      *Must:* Explain shape/colour distinction provides the *ontological groundwork* (distinct attributes/universals) enabling the separability argument, moving beyond mere linguistics.  
      *Common Mistake:* Treats it only as linguistic premise for delivery, or ignores its role in establishing distinct universals.

  4.  **Separability Passage & Substantive Thesis (4 marks):**  
      *Must:* Identify separability discussion as key to shifting to universal/particular distinction; articulate the core thesis as "composite particular ≠ abstract universal".  
      *Common Mistake:* Sees separability only as reiterating delivery, or fails to connect it to a coherent metaphysical claim beyond verbal trickery.

  5.  **Resolution & Significance (4 marks):**  
      *Must:* Synthesize points 1-4 to state what the *substantive* thesis is (universal vs. composite particular) and why it's significant (ontology of attributes/particulars), distinguishing it from sophistry/ambiguity.  
      *Common Mistake:* Concludes it's "just semantics" or sophistry, or offers a vague/unsupported "deeper meaning".

  **Thresholds:**  
  *   **A (17-20):** Secures all items, especially 3, 4 & 5. Demonstrates clear grasp of universal/particular distinction as the core thesis.  
  *   **B (13-16):** Secures 1, 2, and at least two of 3/4/5. Identifies limits of delivery & linguistic dependency but struggles to articulate/justify a fully coherent substantive thesis.  
  *   **C (9-12):** Secures 1 & 2, but falters on 3,4,5. Understands surface argument & cases but cannot move beyond linguistic analysis or identify the metaphysical core.  
  *(<9: Fails on core items 1/2 or shows fundamental misunderstanding).*

  ---

  ### 4. Closing Note (148 words)

  A genuinely good answer will seamlessly integrate the three cases to expose the delivery argument's inadequacy and leverage the shape/colour and separability passages to reconstruct a coherent, *non-verbal* philosophical thesis about universals and particulars. It won't just list points but show *how* the cases force this reconstruction. Fluency without depth might correctly analyze the cases and parrot terms like "universal/particular" but fail to demonstrate *why* the separability material necessitates this reading or *how* it resolves the tension between the thesis and the concession about having a horse. The strongest students will likely grapple effectively with the cases and the shift to metaphysics. However, the trickiest point is recognizing that the separability argument subtly *assumes* the distinctness of universals ('white', 'horse') to argue for the distinctness of the composite, potentially begging the question against an opponent who sees 'horse' as inherently instantiated. They might miss this nuance while still excelling elsewhere.
