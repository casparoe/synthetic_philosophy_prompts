prompt: |-
  Writing a piece on moral foundations theory — the five- or six-foundation setup, care and fairness on one side versus loyalty, authority, sanctity and liberty on the other, and the finding that self-described liberals score high on the first two and much flatter on the rest. Every person I interview reaches for the same analogy: morality is like taste. Foundations are receptors on the tongue, few of them, innate, the same ones in everybody; culture is the cuisine that activates them; political disagreement is just different palates. One source wheels it out to conclude that there is no fact of the matter about who is right — it is sweet versus sour, so the psychology of left and right tells us nothing about who is right. Another uses the exact same picture to conclude the opposite: that the left is missing receptors and should start cooking binding-foundation dishes if it wants to win elections.

  Can you audit it the way you would audit any analogy that is doing argumentative work? Give me the correspondence table — what plays the role of the receptors, the tongue, the dish, the cuisine, the supertaster — and then the places the mapping gives out.

  Two things I want flagged specifically. First: the picture of taste being imported looks like the old tongue map, sweet at the tip and bitter at the back, which as far as I can tell is not how taste works — receptors are distributed across the tongue, most of what we call flavour is actually retronasal smell, and the number of basic tastes is unsettled. Does it matter that the source domain as popularly imagined is itself wrong, and does the analogy get stronger or weaker if you swap in the real biology? Second: sensitivity to bitterness varies genetically, and if that is what carries the analogy then it quietly imports a genetic story about why left and right differ, and with it a cant-help-it excusing move. Does it have to?

  Then the payoff: once the disanalogies are on the table, can this analogy support either conclusion, or is it carrying them the whole way? And is there a better analogy — something with learning, training or expertise built into it rather than fixed receptors, music or language maybe — that does real work on the question I actually care about, whether the psych of left and right tells us anything about who is right?
reasoning: |-
  Okay, let me unpack this user's request. They're writing about Moral Foundations Theory and noticing every source uses the same taste analogy to make opposing arguments. The user wants me to critically audit this analogy like I would any argumentative tool.

  First, I need to map the analogy fully: 
  - Taste receptors = moral foundations
  - Tongue = human moral capacity 
  - Cuisine = culture 
  - Dishes = specific moral issues 
  - Supertasters = morally sensitive individuals

  But the analogy breaks in important ways. Moral foundations aren't physiologically fixed like taste receptors - they're more like cognitive templates shaped by experience. And unlike taste, moral reasoning involves justification and social negotiation.

  The user specifically flags two issues: 
  1) The popular tongue map is scientifically wrong. If we correct this, the analogy actually gets weaker because distributed taste receptors undermine the "fixed locations" metaphor used in MFT. 
  2) Genetic taste variations could imply moral differences are innate and unchangeable - a politically loaded implication the user calls a "cant-help-it excusing move."

  Neither conclusion drawn from the analogy holds up under scrutiny. The "no right answer" position ignores that moral claims require reasons beyond sensory input. The "left should adapt" position falsely assumes foundations are fixed rather than developable.

  For better analogies, I'm considering:
  - Language acquisition (universal capacity + cultural variation)
  - Musical training (innate response + cultivated expertise)
  - Color perception (biological basis + cultural categorization)

  These alternatives share key advantages: they allow for development, expertise, and avoid reducing morality to passive sensation. Most importantly, they don't predetermine whether psychological differences indicate normative truths - which is the user's core question.

  The user seems sophisticated about both the science and political implications. Their frustration with the overused taste analogy suggests they want to move beyond superficial comparisons to something that acknowledges moral psychology's complexity while leaving room for reasoned ethical debate.
answer: |-
  Here's a full audit of the "morality is like taste" analogy as applied to Moral Foundations Theory (MFT), addressing your specific concerns and exploring alternatives:

  ### Correspondence Table
  | **Taste Domain**          | **Moral Domain (MFT Analogy)**       | **Moral Reality (Where Mapping Fails)**                     |
  |---------------------------|--------------------------------------|-------------------------------------------------------------|
  | **Taste Receptors**       | Innate Moral Foundations (5-6)       | Foundations are *templates*, not fixed receptors; they develop through gene-culture interaction. |
  | **Tongue**                | Universal Human Moral Capacity       | Moral cognition involves complex brain networks, not a passive sensory organ. |
  | **Basic Tastes (e.g., 5)**| Care, Fairness, Loyalty, Authority, Sanctity, Liberty | Foundations aren't discrete "flavors"; they overlap and interact dynamically. |
  | **Dish**                  | Specific Moral Issue/Policy          | Moral issues engage *multiple* foundations simultaneously. |
  | **Cuisine**               | Culture/Political Ideology           | Culture *shapes* foundations, not just "activates" them. |
  | **Supertaster**           | Ideologue (High Sensitivity to Specific Foundations) | Sensitivity isn't just biological; it's shaped by experience and reasoning. |
  | **Taste Preference**      | Political/Moral Stance (Left/Right)  | Moral views involve reasoned justifications, not just "palate". |

  ### Critical Disanalogies & Your Specific Flags
  1. **The Flawed "Tongue Map" Model:**  
     - **Problem:** The analogy relies on an outdated view of taste (distinct zones, few basic tastes). Reality: receptors are distributed, flavor integrates smell/touch, and "basic tastes" are debated (e.g., umami, fat).  
     - **Impact on Analogy:**  
       - *Weakens the "fixed location" metaphor:* Foundations aren't modular "zones" but interconnected processes.  
       - *Strengthens the complexity argument:* Moral judgment, like flavor, is multisensory (emotion, reason, culture) — making "who is right?" harder to dismiss as mere preference.  
       - **Verdict:** Correcting the biology *weakens* the analogy's simplicity but *strengthens* its potential to model moral complexity.

  2. **Genetic Variation (e.g., Bitterness Sensitivity):**  
     - **Problem:** If political differences = genetic taste variation, it implies morality is biologically fixed and immutable.  
     - **Does it have to?** No. Genetic differences in taste *interact* with learning (e.g., acquired preference for bitter foods). MFT acknowledges foundations are *prepared* by evolution but *calibrated* by culture.  
     - **The "Can't-Help-It" Trap:** The analogy *risks* implying liberals "can't taste" loyalty/authority due to biology, excusing polarization. But MFT data shows liberals *do* respond to binding foundations — just less strongly. This is likely due to cultural/experiential factors, not broken "receptors."  
     - **Verdict:** The genetic angle is a *reductive misstep* if used to imply determinism. Better to see foundations as *learned sensitivities*.

  ### Can the Analogy Support Either Conclusion?
  - **"No Fact of the Matter" Conclusion:**  
    Fails. Taste preferences *are* subjective ("sweet vs. sour"). Moral claims involve *reasons* (harm, justice, rights) that can be debated objectively. The analogy ignores that moral disputes often hinge on *facts* (e.g., does this policy cause harm?) and *principled consistency*.  
  - **"Left Should Cook Binding-Foundation Dishes" Conclusion:**  
    Partially holds *tactically* but fails *conceptually*. Yes, appealing to loyalty/authority might win votes. But the analogy wrongly implies:  
    (a) Foundations are fixed ingredients (they’re adaptable),  
    (b) "Cooking" is mere marketing (not moral engagement),  
    (c) Liberals lack the "receptors" (they can authentically develop these concerns).  

  **Overall:** The analogy *carries* the conclusions by oversimplifying morality into passive sensation, ignoring agency, reason, and moral progress. It’s rhetorically catchy but philosophically bankrupt.

  ### Better Analogies: Learning, Expertise, and Development
  Here are alternatives that build in learning and avoid biological determinism:

  1. **Language Acquisition:**  
     - **Correspondence:**  
       - Universal grammar = Foundational moral templates.  
       - Native language = Cultural moral system.  
       - Fluency = Moral expertise/ideology.  
     - **Advantages:**  
       - Explains universality + diversity without fixed "receptors."  
       - Learning is *active*; proficiency varies with exposure/practice.  
       - Allows for "bilingual" morality (e.g., understanding conservative/liberal "dialects").  
     - **On "Who's Right?":** Like judging grammar, moral claims can be evaluated for coherence, consistency, and fit with human flourishing — not reduced to taste.

  2. **Musical Training:**  
     - **Correspondence:**  
       - Innate rhythm/pitch sensitivity = Moral foundations.  
       - Musical genre/tradition = Culture/ideology.  
       - Virtuosity = Moral expertise.  
     - **Advantages:**  
       - Sensitivity can be trained (a liberal can learn to "hear" authority concerns).  
       - Expertise allows nuanced appreciation beyond innate response.  
       - Distinguishes *preference* (liking jazz) from *competence* (understanding counterpoint).  
     - **On "Who's Right?":** While genres differ, we can judge technical skill, emotional depth, or innovation — just as we can assess moral reasoning for rigor, empathy, or justice.

  3. **Color Perception (Advanced):**  
     - **Correspondence:**  
       - Trichromatic vision = Foundational moral capacities.  
       - Color categories/language = Cultural moral framing.  
       - Expert discernment (e.g., painter) = Moral sensitivity.  
     - **Advantages:**  
       - Biology enables but doesn’t dictate categories (Himba tribe distinctions differ from English).  
       - Expertise refines discernment (seeing "liberty" in novel contexts).  
     - **On "Who's Right?":** While cultures categorize differently, color perception is constrained by reality (wavelengths). Similarly, moral claims must respond to real human needs/social dynamics.

  ### Conclusion
  The taste analogy **fails** to meaningfully address whether MFT tells us "who is right" because it reduces morality to passive sensation, ignoring reason, growth, and the objective stakes of moral claims. **Better analogies (language, music, color) incorporate learning and expertise**, showing that psychological differences reflect *developed sensitivities* — not immutable biology. This reframes the question: Not "who has broken receptors?" but "which moral traditions best cultivate wisdom, justice, and human flourishing?" MFT describes starting points, not endpoints. The psychology of left and right reveals *differently calibrated sensitivities*, but determining "who is right" requires ethical reasoning beyond psychology alone.
