answer: |-
  **Brainstormed Pitfalls**  
  1. **Philosophical Landmine**: Accidentally endorsing either the bride’s “loaned voice” theory or her supervisor’s “spokesperson” stance while delivering the mother’s words.  
  2. **Rule #1 Violation**: Slipping into descriptive claims about the couple ("you’re perfect together") while transitioning to the mother’s moment.  
  3. **Cultural Tokenism**: Reducing the Romanian tradition to a "quaint" performance, alienating the groom’s family.  
  4. **Awkward Exposure**: Putting the mother on the spot in a way that highlights her discomfort with the secular wedding.  
  5. **Exclusion**: Letting the Romanian moment feel like an untranslated ritual the rest of the room observes passively.  

  **Absolute Must-Not-Dos**  
  - ✘ **Don’t** assert *anything* about the couple’s past, present, or future.  
  - ✘ **Don’t** explain philosophical theories or use jargon (e.g., "performative utterance," "illocutionary act").  
  - ✘ **Don’t** read the mother’s original text (it breaks Rule #1).  
  - ✘ **Don’t** frame her moment as "sweet" or "traditional" (risks condescension).  
  - ✘ **Don’t** make the room analyze; make them *participate*.  

  ---

  **The Speech**  
  *(4 minutes; spoken plainly, standing at the head of the room)*  

  Alright, everyone. Deep breath. If you’ve met me, you know I’m a writer — which means I’m *very* good at saying things that sound true. [*Light pause*] But today? We’re not here to describe. We’re not here to predict. Honestly? We’re not even here to make sense. [*Smile*] We’re here to *do* something.  

  And that starts with Maria. [*Turn toward groom’s mother*] Maria, you’ve known Alex since… well, since he was a noisy lump in a blanket. You’ve seen him become the man who stands here today. And when he told you about this wedding — about *Sophie* — you did what mothers do: you reached for words. You wrote some down. Proper ones. Heartfelt ones. [*Pause*] But here’s the thing about weddings: words can slip. They can promise things. They can describe things that… well, maybe they’re not ours to describe.  

  So here’s what we’re going to do instead. Maria, you grew up in a village where some things aren’t *said* — they’re *done*. Where welcome isn’t a sentence. It’s an act. A habit. A thing you *give*. [*To room*] And today, I’m asking you — all of you — to help her give it.  

  Maria, I know you brought a phrase with you. One you’ve known forever. One that doesn’t *tell* us anything — it just *does* what it means. [*Softly*] Would you offer it now? For Alex. For Sophie. For all of us?  

  [*Maria stands, faces the couple, and says clearly in Romanian:*]  
  **“Bun venit în familie.”**  
  *(“Welcome to the family.”)*  

  [*You immediately turn to the room, raising your glass slightly*]  
  Now — right now — *all of us* say it back to her. In whatever language feels true. Just: **“Bun venit în familie.”**  
  [*Room repeats the phrase, some in Romanian, some phonetically, some in English*]  

  [*After the echo fades*]  
  …Because that? That wasn’t *about* welcome. That *was* welcome. [*Raise glass higher*] To Alex and Sophie — and the act of beginning.  

  ---

  **Load-Bearing Elements & Why**  
  1. **“We’re not here to describe…”**  
     - *Why*: Disarms Rule #1 immediately. Shifts focus from *truth claims* to *action*. Philosophers hear Austinian "performative" subtext; others hear "let’s not overthink this."  

  2. **“You reached for words… But here’s what we’ll do instead.”**  
     - *Why*: Explains *why* you’re not reading Maria’s text without criticizing her. Acknowledges her effort while pivoting to the ritual.  

  3. **“Where welcome isn’t a sentence. It’s an act.”**  
     - *Why*: Frames the Romanian phrase as *inherently performative*. The bride’s supervisor hears "fixed conventional procedure" (supporting his view); the bride hears "enactment over assertion."  

  4. **“All of us say it back to her.”**  
     - *Why*: The **critical move**. When the room echoes Maria, they transform her solo act into collective performance. Her words become *context*, not content. The repetition also lets non-Romanian speakers participate authentically.  

  5. **“That wasn’t *about* welcome. That *was* welcome.”**  
     - *Why*: Explicitly marks the act as successful performative (satisfying Rule #1). The toast "does" solidarity without describing the couple.  

  **How It Sidesteps the Traps**  
  - **Maria’s Discomfort**: She performs a formal gesture (not a personal sentiment), respecting her boundaries.  
  - **Loaned Voice Debate**: Maria *speaks*; the room *echoes*. She’s the source; they’re co-performers (pleases both philosopher camps).  
  - **Rule #1**: Zero claims about the couple. Only the phrase "Bun venit în familie" — which, as ritual, *enacts* inclusion.  
  - **Inclusion**: The call-and-response makes the room *complicit*, not spectators.  

  **Note for Delivery**  
  - **Pace**: Pause after Maria speaks. Let the room lean in.  
  - **Echo Cue**: Project confidence — "all of us" is a command, not a question.  
  - **Eye Contact**: Scan the room during the echo, especially table 4 (philosophers) and Romanian family.  

  No one needs to understand the theory. They just need to feel the room shift when 60 voices say *bun venit*. And Maria? She got to welcome her daughter-in-law *her* way.
