prompt: |-
  I write a column on evolution and human behavior for a science magazine, and Ive just landed one of those year long fellowships: nine months, about six long features, a travel budget. I want to spend most of it on the mess around adaptationism instead of doing yet another nature-nurture-is-over recap. Forty-plus years after Gould and Lewontin's 1979 spandrels paper, my corner of the science feed still runs on the same engine: a lab finds a correlation, the press release says this is why we do X, and it lands as an evolutionary just-so story with one hedge paragraph bolted on at the bottom. My editor is sympathetic but thinks anything with the word spandrel in the first three paragraphs is inside baseball, so part of what I need is a defense of why this old argument should change how working reporters handle the daily drip, not just how philosophers of biology sort themselves into camps.

  So help me build the agenda rather than summarize the debate. Ive been arguing about this with a friend who's a postdoc in philosophy of biology, and we came up with two homebrew tools that I like but genuinely can't tell are insights or just us cosplaying as methodologists. First, call it the base rate rule: anyone claiming trait T is an adaptation has to name the reference class T belongs to and say what fraction of traits in that class turn out to be adaptations. If you can't or won't, then saying adaptation carries about as much information as saying a drug works without saying how often drugs of its kind work. Second, the lineage swap test: take the adaptive story for T and ask whether anyone would still be telling it if T had turned up in a different taxon with a different ecology. If yes, because the story runs entirely off T's shape and nothing off the lineage's actual history, it's a story about usefulness rather than an explanation of origin. There's a third thing I keep half-noticing, function drift: challenged adaptive stories get rescued by quietly redescribing the function, so the trait never quite gets to be falsified. I don't know whether that's a real phenomenon in the literature or just my annoyance at reading press releases.

  What I need is a defended ordering, not a survey. Of the open questions in or around this cluster, which three or four should the six pieces be organized around, and in what order, and I care far more about the reasoning than the list. Concretely: which questions are upstream, in that how you settle them settles several others; which are genuinely open versus which only look open because people keep relitigating something that's basically settled and would make for a filler feature; which are tractable for someone who can read papers and interview people but can't run models, do fieldwork, or get a lab to share data; and which ones, if I got a clean answer, would actually change how I write a news piece about a gene for X or a why-we-Y press release, as opposed to being satisfying to philosophers while leaving my day job completely untouched. Be willing to say if one of my three homebrew ideas is confused or already has a name and a literature I should read, and tell me what would move things up or down the list: what kind of interview, or what kind of result landing in the next nine months, should make me reshuffle the series.
reasoning: |-
  Okay, the user writes a science column on evolution and human behavior and just got a fellowship to focus on adaptationism issues. They want to move beyond the usual nature-nurture debates and address how science reporting often turns correlations into evolutionary just-so stories. Their editor is wary of jargon like "spandrels," so they need practical angles that can change how reporters handle daily science news.

  They've brainstormed three ideas with a philosopher friend: a base rate rule requiring context for adaptation claims, a lineage swap test to check if stories are taxon-specific, and function drift where explanations shift to avoid falsification. They need help structuring six articles around key questions—prioritizing upstream issues that resolve multiple debates, avoiding settled topics, ensuring tractability for a journalist, and focusing on changes that impact real reporting.

  First, I need to unpack their core frustration: the gap between scientific nuance and science journalism's tendency toward simplistic adaptationist narratives. Their tools seem like attempts to operationalize skepticism—useful but needing refinement. The base rate rule could be strengthened by linking it to empirical work on trait classes, while the lineage swap test aligns well with comparative biology critiques. Function drift feels real but needs case studies to demonstrate systemic evasion.

  For structuring the series, I should identify leverage points. Upstream questions include evidentiary standards (what proof suffices for adaptation?) because it undergirds both their base rate concern and the swap test. Trait ontology comes next—without defining "trait" clearly, adaptation claims lack rigor. Then, function drift as a symptom of poor falsifiability, leading to practical solutions like pre-registration. This ordering builds from foundations to applications.

  Tractability matters: they can't run models but can interview researchers and audit press releases. An article dissecting a high-profile study's methodology would showcase base rate issues effectively. Key interviews should target empiricists studying non-adaptive traits (e.g., junk DNA researchers) and critics of evolutionary psychology's storytelling.

  Finally, impact on reporting: if they establish that adaptation claims require lineage-specific evidence and falsifiable functions, journalists could add one killer question to their routine: "What would disprove this?" That shifts copy beyond hedge paragraphs. A breakthrough like a major lab renouncing "genes for X" language would reshuffle priorities—signaling cultural change beyond philosophy.
answer: |-
  Here’s a battle-tested agenda for your fellowship series, designed to rewire science journalism’s approach to adaptationist claims. It prioritizes **upstream questions**, **tractability for a reporter**, and **actionable impact on daily reporting**. Your homebrew tools are integrated and refined.

  ### Core Ordering Principle:  
  **Start with what kills lazy stories fastest, then expose systemic flaws, end with fixes.**

  ---

  ### The Series Arc: 4 Pillars (6 Features: 1 Intro, 4 Pillars, 1 Synthesis)

  1.  **Feature 1: The Evidentiary Black Hole (Your "Base Rate Rule" on Steroids)**  
      *   **Question:** *What burden of proof *should* be met to claim "this trait is an adaptation"? Why is "it exists and seems useful" insufficient?*  
      *   **Why Upstream?** Without clear standards, everything downstream (just-so stories, function drift) thrives. This forces the field to confront its null hypothesis problem.  
      *   **Tractability:** Audit recent high-profile papers/press releases. How many *attempt* to rule out alternatives (drift, constraint, exaptation)? Interview researchers who *do* rigorous tests (e.g., using phylogenetics, population genetics, developmental constraints) and those who admit the bar is often low.  
      *   **Impact on Reporting:** Gives reporters **THE question**: "What specific evidence *rules out* non-adaptive explanations for this trait/finding?" If none, it's hypothesis, not conclusion. **Refined Base Rate Rule:** Don't just demand a class – demand *empirical evidence* for the *prevalence* of adaptation *in that specific class within relevant lineages*. E.g., "Most human brain region size variations studied via MRI show X% heritable drift, Y% plasticity..." (Cite work on "neutral theory" at morphological/neural level).  
      *   **Move Up/Down:** A major review/meta-analysis quantifying the success rate of adaptation claims in a specific domain (e.g., candidate genes, fMRI correlates) would rocket this to #1. A prominent lab publicly renouncing a weak adaptation claim would be gold.

  2.  **Feature 2: The Trait Trap (Ontology vs. Just-So)**  
      *   **Question:** *How does sloppy definition of the "trait" (T) itself manufacture adaptive stories?*  
      *   **Why Upstream?** If "T" is arbitrarily defined (e.g., "religiosity," "risk-taking," "the hippocampus"), any story can be spun. This underpins the lineage swap test.  
      *   **Tractability:** Contrast clear, measurable traits (e.g., lactose tolerance allele frequency) with fuzzy constructs. Use your **Lineage Swap Test**: Take a human story (e.g., "music evolved for social bonding"). Ask: If we found complex bird song in a solitary species, would the *same* story be told? (Yes: story is about usefulness). If the story *only* works because of human-specific context (e.g., language co-evolution), it passes the test. Interview researchers studying homologous traits in non-model/non-charismatic species.  
      *   **Impact on Reporting:** Gives reporters **THE filter**: "Is this trait defined precisely enough to test the story *and* is the story *lineage-specific*?" Forces specificity.  
      *   **Homebrew Refinement:** Your Lineage Swap Test is excellent & novel phrasing. Link it to "homology vs. analogy" debates. Key literature: Gould's "Exaptation" work, critiques of Evolutionary Psychology's "modularity".

  3.  **Feature 3: The Function Shell Game (Your "Function Drift" Exposed)**  
      *   **Question:** *Why do adaptive explanations for the *same* trait often mutate when challenged, rather than being falsified?*  
      *   **Why Here?** Now that standards & trait definition are established, expose the evasion tactics. Shows *why* weak claims persist.  
      *   **Tractability:** **Document "Function Drift"**. Pick 2-3 well-known human examples (e.g., oxytocin - "love hormone" -> "social salience hormone"; specific alleles linked to "aggression" later linked to "sensitivity"). Trace how the proposed function shifted in response to critiques or failed replications. Interview critics who called it out.  
      *   **Impact on Reporting:** Gives reporters **THE warning**: "If the proposed function of this trait/gene is vague or has shifted before, extreme skepticism is warranted." Encourages historical context in reporting.  
      *   **Is it Real?** YES. See: shifting explanations for FOXP2 (language gene?), MAOA ("warrior gene"), even broader concepts like "the grandmother hypothesis." It's closely related to the "adaptive storytelling" or "Panglossian" critique. Key Lit: Richardson's "Evolutionary Psychology as Maladapted Psychology", Kaplan & Pigliucci on "G-Matrix" evolution.

  4.  **Feature 4: Beyond the Spandrel Wars: New Tools for Untangling Origins**  
      *   **Question:** *What *positive* frameworks/methods are emerging to rigorously assess adaptation, exaptation, constraint, and drift without defaulting to just-so stories?*  
      *   **Why Last?** Solutions only make sense after diagnosing the disease. Offers hope and concrete alternatives.  
      *   **Tractability:** Focus on methods journalists can *understand* conceptually, even if they can't run them:
          *   **Phylogenetic Shadow/Correlated Evolution:** Does trait T co-evolve with proposed selective pressure S across a clade? (Interview comparative biologists).
          *   **Population Genomics Signatures:** Scanning for selection signatures (e.g., using PAML, SWEEP tools) *alongside* tests for neutrality. (Interview pop gen researchers studying non-adaptive variation).
          *   **Developmental/Physical Constraints:** When does physics/chemistry limit form? (Interview Evo-Devo researchers, biomechanists).
          *   **Optimality Modeling & Its Limits:** When *is* "fit = function" testable? (Interview theoreticians *and* their critics).
          *   **The "Adaptation in Progress" Standard:** Studying *ongoing* selection (e.g., Grant's finches, human lactose tolerance) vs. deep-time speculation.
      *   **Impact on Reporting:** Gives reporters **THE alternatives**: "What non-adaptive explanations were considered/tested?" and "What methods *beyond correlation* were used to infer adaptation?" Moves beyond the single-hedge-paragraph model.

  ---

  ### Why This Order & Focus Wins

  1.  **Starts Journalist-First:** Feature 1 gives an *immediate, practical weapon* (the evidence demand) against the daily drip of weak claims. It's the fastest way to change headlines.
  2.  **Targets Root Causes:** Features 2 & 3 dissect the *mechanisms* allowing weak stories to thrive (fuzzy traits, shifting functions). This is necessary for deep change.
  3.  **Ends Constructively:** Feature 4 avoids being purely critical and points to the future, showing rigorous science *is* possible. Makes the series feel essential, not just contrarian.
  4.  **Makes "Spandrels" Actionable Without Jargon:** You never need to say "spandrel"! You talk about non-adaptive origins, drift, constraints, exaptation, and the *methods* to detect them. Your editor wins.
  5.  **Leverages Your Tools:**
      *   Base Rate -> Embedded in Feature 1's evidentiary standards (needs *contextual* proof).
      *   Lineage Swap -> Core of Feature 2 (defining traits & testing stories taxon-by-taxon).
      *   Function Drift -> The heart of Feature 3 (exposing evasive storytelling).
  6.  **Tractable:** Focuses on interviewing researchers, auditing papers/releases, tracing historical shifts in explanations, and explaining conceptual frameworks – all within a reporter's wheelhouse.
  7.  **Changes Your Day Job:** After this series, your "why-we-Y" pieces will:
      *   Lead with the evidence *against* adaptation.
      *   Define traits precisely.
      *   Test the story with the Lineage Swap thought experiment.
      *   Check for historical function drift.
      *   Demand non-adaptive alternatives were considered/tested.
      *   Describe the *methods* used beyond correlation.

  ---

  ### Reshuffle Triggers

  *   **Move Feature 4 (New Tools) Up:** If a major consortium publishes a groundbreaking paper using comparative genomics/evodevo to *definitively* show a famous "human adaptation" (e.g., bipedalism, brain size) involved massive constraint/exaptation, making methods central immediately.
  *   **Move Function Drift (Feature 3) Up:** If a high-profile retraction/scandal erupts specifically due to shifting functional claims (e.g., a "gene for X" study collapses when follow-ups show no link to X but proponents pivot to Y).
  *   **Emphasize Base Rate (Feature 1) Harder:** If a meta-analysis lands quantifying the shockingly low success rate of GWAS/imaging studies in linking traits to *specific* selective pressures, making the base rate argument empirical, not just philosophical.

  This structure transforms an old debate into a practical toolkit for better science journalism. Go make the daily drip less soggy with just-so stories.
