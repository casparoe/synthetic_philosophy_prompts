prompt: |-
  I'm running a reading-group session on chance and credence next week and I want to get beaten up by the strongest version of the view before I stand up in front of people. So: play David Lewis. Not a strawman — the version of you that actually holds the Principal Principle and defends it well. You keep everything you actually had: objective chance as time-indexed and Humean-supervenient, the admissibility clause and the undermining cases where you say the evidence is inadmissible rather than the principle false, your work on de se content, and your inclination to be a halfer about Sleeping Beauty. Concede small points when they're really small, but don't give up the principle. Don't cite papers at me or tell me who argued what — argue it, and mark when you're improvising past what you actually held versus when you think your own view forces your hand. Stay in character until I say stop, and keep replies to two or three paragraphs so it feels like a conversation. If you want to know how some later debate came out, ask me in character and I'll tell you.

  Here's my case, and I've ran the numbers twice.

  A lab has a quantum coin with objective chance 0.5 of heads. Starting Monday they toss it once a day and keep going until the first heads. Every morning before the toss they make a fresh copy of me — same memories, told the protocol — and once the sequence is finished they bring every copy into one room and ask each of us: what is your credence that your toss landed heads?

  I'm one of the copies. The number of copies N is geometric with p = 0.5, and exactly one copy in the room, the last one made, has a heads toss. So if I take myself to be a random copy, my credence should be E[1/N], and E[1/N] is the sum over n of (1/n)(1/2)^n, which is ln 2, about 0.69. But the chance, at the time of my toss, of my toss landing heads was 0.5, and I have no evidence about which toss I am, so the Principal Principle apparently says 0.5. This isn't an undermining case — nothing I learned touched the chances — and I can't see how my evidence is inadmissible either, since it's about the past and about who I am, not about how my toss came out.

  I also tried the betting test and I don't think it settles it. Offer every copy a ticket that costs 1 and pays 2 on heads: at credence 0.5 that looks fair to each of us, and averaging over copies about 69% of us win, so each of us profits in expectation. But the bookie breaks even per run, because E[N] = 2 and he takes in N and always pays out exactly 2 to the one heads copy. So "follow the chances or get exploited" pulls both ways depending on whether you average over copies or over runs, which is why I don't think it decides anything here.

  So: which step of mine do you reject — the self-location step, the claim that the chance of that de se proposition is 0.5, or the claim that my evidence is admissible? And whichever one you drop, say what it costs you: does the principle still have anything to say about the one kind of uncertainty I actually have in that room?

  And be plain with me rather than polite: if the case is broken — my arithmetic's off, or this is just Sleeping Beauty with the sign flipped and there's a stock answer, or I've definately smuggled in an indifference assumption you never granted — say so and I'll drop it. I'd rather be corrected than humoured, and I'd rather hear where you're choosing than where you're pushed.
reasoning: |-
  Okay, let me tackle this as David Lewis. User's setup involves quantum coin tosses, geometric distribution of copies, and a credence conflict between 0.5 (chance) and ~0.69 (self-location). They've clearly studied my work—Humean supervenience, admissibility, de se content—and want a rigorous defense. 

  First, the core tension: they claim the Principal Principle mandates 0.5 credence for "my toss is heads," but their random-copy view suggests ~0.69. I see three prongs to their argument: (1) the chance at toss-time was objectively 0.5, (2) their evidence (protocol + being a copy) is admissible, and (3) self-location forces E[1/N]. 

  I reject (3) outright. Their calculation assumes indifference over *which* copy they are, but that's smuggling in a principle I never endorsed—the principle of indifference for de se uncertainty. In my 1979 paper on attitudes de dicto and de se, I argued self-locating beliefs require centered worlds, but never prescribed uniform priors over centers. Their "random copy" intuition is precisely what I'd challenge. 

  For (2): yes, the evidence is admissible—it's historical (protocol) and de se (being a copy), neither directly concerns future chance outcomes nor undermines chances. So no inadmissibility loophole here. 

  For (1): crucially, the chance at *their toss-time* is indeed 0.5, but that chance attaches to the coin outcome *conditional on the toss occurring*. The error is treating "my toss is heads" as a simple proposition. It's not. When they awaken, their "toss" is embedded in a branching structure where the very existence of their copy depends on previous tails. So the chance-conditional they should consider isn't P(heads) simpliciter, but P(heads | this copy exists). 

  Betting argument? Clever, but irrelevant. The Principal Principle constrains *credence*, not group profitability. That the bookie breaks even across runs doesn't refute individual rationality—each copy's bet is fair given their 0.5 credence. The "exploitation" fear assumes collective rationality, which isn't required. 

  Sleeping Beauty comparison? Superficially similar but distinct. In SB, halvers (like me) reject indifference between awakening states. Here, I similarly reject uniform credence over copies. 

  Cost? My view leaves self-locating uncertainty underconstrained by chance alone. But that's consistent—chance governs world-history, not centered beliefs. They must supplement the Principal Principle with justified priors over centers. In this case, justified priors *do* respect the chance: given the protocol, P(I am copy k) should be proportional to the chance of copy k existing, which is (0.5)^k. That yields P(my toss heads) = 0.5 exactly. 

  So their mistake was assuming uniformity. Drop that, and the tension dissolves.
answer: |-
  Right, then. Let's have at it. You're making a subtle error in how you're applying self-locating belief, and it's leading you astray from the Principal Principle. The Principle itself stands firm. I'll be plain.

  Your arithmetic is sound, and this *isn't* quite Sleeping Beauty flipped – Beauty's uncertainty is about *which day* she's awakened on within a *fixed* experiment, while your uncertainty here is about *which copy* you are in a *variable* experiment. The crucial misstep is your move to "take myself to be a random copy" and compute E[1/N]. That smuggles in an illicit Principle of Indifference over *which copy you are*. I never granted that. It's not justified by the Principal Principle, and it conflicts with the objective chances governing the entire setup.

  Here's why the Principal Principle demands credence 0.5 in "my toss landed heads" for each copy upon awakening:

  1.  **The Objective Chance at the Time of Your Toss:** At the precise moment your specific coin is tossed, the objective chance *that this very coin lands heads* is 0.5. This is fixed by the Humean mosaic – it's a fundamental, local, time-indexed propensity of that device, supervening on the pattern of particular events in the world. This chance value (0.5) is a fact *before* the outcome is known.
  2.  **Your Evidence and Admissibility:** You awaken with evidence E: "The protocol is running, I am a copy created by this protocol, and I am being asked now." Is E inadmissible? Absolutely not! It contains no information *about the future outcomes of chance processes relevant to your toss*. It tells you about the *past* setup and your *current* self-locating state. It doesn't tell you the result of *your* toss or any *future* tosses in the sequence (if any). Crucially, it doesn't tell you *which* copy you are in the sequence relative to the outcome of the heads toss – that's the very uncertainty you have! Evidence about the past and about your current de se state is *paradigmatically admissible* for the Principal Principle applied to a past chance event. Undermining doesn't come into play here; your evidence doesn't bear on the *truth* of the chance laws themselves, only on which particular copy you instantiate within a world where those laws hold. The chance P_my-toss-time(Heads | History-up-to-my-toss) remains 0.5, and E contains nothing undermining that conditional chance.
  3.  **The Self-Locating Mistake:** The proposition "My toss landed heads" is true for exactly one copy: the last one made. Your calculation E[1/N] ≈ 0.69 is the *expected fraction* of copies who are heads-copies *across all possible runs of the experiment*. But *you* are not asking "What is the expected fraction of heads copies?" *You* are asking, for *your specific awakening*, "What is the credence *this* toss was heads?" The Principal Principle tells you how to set this credence *given the chances and your admissible evidence*. Your evidence E *does not break the symmetry* between the two possible outcomes *for your specific toss*. You know the chance for *it* was 0.5, and E gives you no reason to favor one outcome over the other *for that specific event*. Taking yourself to be a "random copy" *imposes* an indifference over the index of your copy *that is not warranted by the chance setup or your evidence*. The chance of *you* being the heads copy isn't E[1/N]; it's determined by the chance of *your specific toss* being heads, given what you know. Your evidence E constrains you to consider only worlds where a copy like you exists *at the point in the sequence where you are*. Within those worlds, for *your* specific toss, the chance was 0.5, and you have no evidence breaking the symmetry for *that toss*. Hence, credence 0.5.

  **The Cost & What the Principle Says:** The cost is that the Principal Principle alone, while dictating the 0.5 credence in the outcome of *your* toss, doesn't fully determine your credences about *which position in the sequence you occupy*. It constrains your belief about the *outcome* (Heads/Tails) given your position, but the uncertainty about the position itself requires careful handling of de se content and justified priors over the structure of possibilities. However, for the specific question asked – "what is your credence that *your* toss landed heads?" – the Principle *does* give the answer: 0.5. It speaks directly to the uncertainty about the outcome of the chance event that defines your existence in that moment.

  The betting argument doesn't save the "random copy" view. The "profit in expectation over copies" reflects the *statistical fact* that most copies are in long runs (tails-heavy sequences). It doesn't show that an *individual* copy with credence 0.5 is irrational. Each copy, setting credence 0.5 based on the chance governing *their* toss, judges the $1 ticket paying $2 on heads as fair. The bookie breaking even per run shows the setup is consistent with the chances – the *frequencies* match the *chances*. The individual copies aren't being exploited; they are correctly responding to the local chance with their credence.

  Your case is clever, but the flaw is in the self-location step. You assumed indifference over copies. Reject that assumption, hold fast to the local chance and admissibility, and the Principle delivers 0.5. Stop? Or hit me again.
