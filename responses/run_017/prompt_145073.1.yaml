prompt: |-
  I have recently become the person who decides how much of our capital goes into each of a stream of small, repeatable bets on behalf of a scholarship fund, and the more I read the more I suspect the textbook setup doesn't describe us. Three mismatches worry me. The fund must make fixed real payouts every year, so wealth is being drawn down along the path rather than simply compounded. It also receives top-up gifts from a donor who is, if anything, more generous in the years we have done badly, so our bankroll is replenished in a way that is anti-correlated with our own returns. And the opportunities themselves are awkward: lumpier than the theory assumes, with a minimum cheque size, an edge that decays if we wait for a better price, and the occasional payout in something we cannot sell for years.

  I have roughly a year, and the equivalent of two junior researchers, to spend on getting our rule right rather than on picking bets. Which open questions should that year go to? I care most about the ones whose answer would actually change the fraction we commit, so for each please say how much you expect it to move that number, how tractable it is in a year with pencil-and-paper plus simulation, and which questions are upstream of which. Please also say which of my three worries — or of the standard ones, such as how much to haircut for uncertainty about our own edge, whether the time-average and expected-utility framings genuinely come apart in a case like ours, and what to do when the true model may not be in the set of models we are averaging over — is overrated, in the sense that settling it would leave our rule essentially unchanged. Finally, what result in the next six months, ours or someone else's, would move something up or down your list?
reasoning: |-
  Okay, let me start by understanding the user's situation. They manage a scholarship fund with unique challenges: fixed annual payouts, anti-correlated donor top-ups, and lumpy investment opportunities. They have a year and two junior researchers to refine their capital allocation rule. The goal is to identify which open questions would most impact their allocation fraction and prioritize them.

  First, I need to dissect the three main worries. The fixed payouts mean the fund isn't compounding wealth; it's drawing down, which affects sustainability. The donor's anti-correlated top-ups act as a hedge, replenishing more when returns are poor. This could reduce risk aversion. The lumpy opportunities with minimum sizes and decaying edges complicate position sizing and timing.

  The user mentions textbook setups don't apply. Standard Kelly or Merton frameworks assume compounding without withdrawals, continuous betting, and no external cash flows. So, traditional models need significant adjustments. The user also brings up standard concerns like haircutting for edge uncertainty, time-average vs. expected utility, and model misspecification. I should assess which of these are overrated for their context.

  Prioritizing questions requires evaluating impact on allocation, tractability, and dependencies. High-impact areas likely include integrating payouts and donor top-ups into the optimization model. The anti-correlated top-ups might lower the need for conservative hedging, potentially increasing allocation fractions. This seems counterintuitive but crucial. Modeling payouts as a negative drift in a Kelly-like framework could be tractable with simulations.

  Next, incorporating path-dependency from lumpy bets. Minimum cheque sizes might force overallocation in some periods, affecting future flexibility. Simulating different opportunity arrival processes and sizing rules could show how much to hold in reserves. This ties into the payout strategy, so it's upstream of other questions.

  Donor top-ups' anti-correlation is another high-priority area. Quantifying the covariance between returns and top-ups could allow leveraging this natural hedge. If top-ups are reliable during downturns, the fund can take more risk. This might reduce the allocation fraction's sensitivity to edge uncertainty, making that concern less critical.

  Assessing which worries are overrated: uncertainty about edge might be less pressing because the donor's behavior mitigates downside. Time-average vs. expected utility may not diverge significantly with regular payouts. Model misspecification remains important but could be managed through robust rules rather than complex averaging.

  Tractability is key. With pencil-and-paper and simulation, integrating payouts and donor effects into a Kelly-Merton hybrid seems feasible in a year. Modeling lumpy bets requires more simulation work but is manageable. Edge uncertainty might need Bayesian methods, which could be time-consuming, so it's lower priority if donor top-ups reduce its impact.

  Dependencies matter. Solving payout integration first informs reserve sizing for lumpy bets. Understanding donor effects influences how much to adjust for edge uncertainty. Results from ongoing research, like operations with external cashflows or state-contingent utility, could shift priorities if published soon.

  In summary, the top priorities should be: 1) Adjusting for payouts and top-ups in the optimization model, 2) Path-dependency from lumpy bets, and 3) Quantifying donor anti-correlation's impact. Edge uncertainty and model misspecification are lower priority if donor top-ups act as a hedge. New research on endowment spending rules or path-dependent sizing could validate approaches mid-year.
answer: |-
  Based on your unique constraints (fixed real payouts, anti-correlated top-ups, lumpy/decaying opportunities), here's a prioritization of open questions for your year, focusing on impact, tractability, dependencies, and overrated concerns:

  ### Top Priority Questions (High Impact, High Tractability)
  1.  **Integrating Payouts & Anti-Correlated Top-Ups into Optimization:**
      *   **Question:** How do fixed real payouts and *reliable* anti-correlated top-ups fundamentally change the optimal fraction to bet? Can we model top-ups as a state-contingent "negative risk"?
      *   **Why Impactful (Est. Δ: 10-30% Allocation):** Payouts act as a constant negative drift, demanding higher returns/capital preservation. Anti-correlated top-ups are a MASSIVE game-changer – they act like a built-in hedge, significantly *reducing* the need for conservative sizing after losses. This likely allows meaningfully *higher* allocation fractions than standard Kelly/Merton would suggest for the same edge/risk. Failing to model this leaves huge value on the table.
      *   **Tractability:** High. Start with a modified Merton-type PDE or discrete-time Kelly framework. Treat payouts as a constant negative cashflow. Model top-ups as a function of prior period drawdown (e.g., Top-up = α * Max(0, Target Wealth - Current Wealth)). Simulate paths incorporating bets, payouts, and top-up rules. Optimize long-term growth or probability of ruin/shortfall. Pencil-and-paper + simulation is perfect.
      *   **Upstream Of:** Everything else. This defines the core optimization landscape.

  2.  **Path Dependency & Liquidity Reserves for Lumpy Bets:**
      *   **Question:** Given minimum cheque sizes, decaying edge, and illiquid payouts, how much "dry powder" (cash/liquid reserves) should be maintained *specifically* to capture lumpy opportunities without forcing suboptimal bets or missing good ones due to illiquidity? How does this interact with the payout schedule?
      *   **Why Impactful (Est. Δ: 5-15% Allocation):** Minimum sizes force overallocation to small edges if you "must" invest. Decaying edges penalize waiting for liquidity. Illiquid payouts lock up capital. This pushes the *effective* allocation fraction lower than the theoretical optimal *for the opportunities you can actually take*. You need a reserve buffer rule.
      *   **Tractability:** Medium-High. Simulate an opportunity arrival process (e.g., Poisson with varying intensity/quality), incorporating minimum size, edge decay functions (e.g., edge = max(0, initial_edge - β*time)), and illiquidity periods. Test different reserve rules (% of AUM, fixed $ floor) against payout needs. Measure metrics like "missed opportunity cost" or "suboptimal sizing penalty".
      *   **Upstream Of:** Edge uncertainty haircuts (the reserve is partly for uncertainty). Depends on the core payout/top-up model (#1).

  ### Important Questions (Moderate Impact, Good Tractability)
  3.  **Quantifying the Impact of Anti-Correlation Strength:**
      *   **Question:** How sensitive is the optimal allocation fraction to the *degree* and *reliability* of the anti-correlation between fund returns and donor top-ups? What if top-ups are stochastic or have a cap?
      *   **Why Impactful (Est. Δ: 5-10% Allocation):** If top-ups are highly reliable and proportional to losses, you can push allocation much harder. If they are weak, noisy, or capped, the benefit diminishes. Understanding this sensitivity is crucial for practical implementation and donor communication.
      *   **Tractability:** High. An extension of #1. Parameterize the top-up function (magnitude α, reliability threshold, cap level, noise/variance). Run sensitivity analyses within your simulation framework from #1. Plot optimal fraction vs. top-up strength/reliability.

  ### Lower Priority / Overrated Concerns
  4.  **Edge Uncertainty Haircuts (Likely Overrated for YOU):**
      *   **Why Overrated?** The anti-correlated top-ups are a powerful natural mitigant *specifically for the downside risk* that edge uncertainty creates. While still important, the *degree* of haircut needed is likely significantly *smaller* than in a standard setup without such top-ups. Settling this precisely might change the fraction less than #1-#3 (<5% Δ). Focus first on incorporating the known top-up structure.
      *   **Tractability if Pursued:** Medium. Requires Bayesian updating or model averaging over edge estimates within your simulation. More complex, but doable.
      *   **Dependency:** Downstream of #1 & #3 (need the core model first).

  5.  **Time-Average vs. Expected Utility (Likely Overrated):**
      *   **Why Overrated?** For a scholarship fund with *mandatory fixed payouts*, maximizing the expected long-term growth rate (time-average) is almost certainly the correct objective. The payouts force a focus on capital sustainability/growth over the path. Pure expected utility maximization (e.g., CRRA) *without* considering the mandatory outflow constraint is less relevant. Using a standard Kelly/Merton growth-optimal approach, modified for payouts/top-ups (#1), is very likely sufficient. Settling this philosophically probably changes nothing practical.
      *   **Tractability:** N/A for core work, stick with growth-optimal.

  6.  **True Model Outside Model Set (Important but Less Actionable):**
      *   **Why Lower Priority?** This is a universal, profound problem ("unknown unknowns"). While crucial for robustness (e.g., stress-testing against black swans, donor behavior changes), it won't directly yield a *specific* optimized fraction. It informs *how robust* your chosen rule is, not necessarily the rule itself. Focus on getting the best rule for your *known* structure first (#1-#3), *then* stress-test it.
      *   **Tractability:** Low for definitive answers. Focus on scenario analysis (e.g., "what if top-ups stop?", "what if edge decay accelerates?") using your simulation from #1.

  ### Upstream/Downstream Summary
  *   **Upstream (Must Do First):** #1 (Core Payouts/Top-ups Model)
  *   **Downstream of #1:** #2 (Reserves), #3 (Top-up Sensitivity), #4 (Edge Haircuts - if pursued)
  *   **Parallel:** #6 (Robustness/Stress Testing) can be built upon #1's simulation framework later.

  ### What Could Move the Needle in 6 Months?
  *   **New Research:** A significant paper on **endowment spending rules under path-dependent returns** or **optimal betting with external, state-contingent cashflows** could boost the priority of #1 or provide new solution methods. Similarly, work on **optimal sizing for lumpy, decaying opportunities with liquidity constraints** would elevate #2.
  *   **Your Results:** If your initial simulations on #1 (**Payouts/Top-Ups**) show a *dramatically* higher optimal fraction than standard theory suggests (e.g., >15% Δ), this would strongly validate prioritizing refinements here. Conversely, if the impact is smaller than expected (<5% Δ), shift focus to #2 (**Lumpy Bets/Reserves**) or #3 (**Top-up Sensitivity**). Early results showing high sensitivity to top-up reliability in #3 would also emphasize its importance.

  **Your Year's Plan:**
  1.  **Months 1-4:** Junior Researchers build the core simulation framework (#1). Model wealth evolution with bets (fixed fraction initially), fixed payouts, and parameterized anti-correlated top-ups. Optimize fraction for long-term growth/survival. Pencil-and-paper derivation of expected behavior.
  2.  **Months 5-8:** Extend simulation to model lumpy opportunities (#2) – arrival, sizing constraints, decay, illiquidity. Test reserve rules. Concurrently, run sensitivity analysis on top-up parameters within the core model (#3).
  3.  **Months 9-12:** Integrate findings. Test edge uncertainty (#4) if time/results suggest it's material. Conduct robustness/stress tests (#6). Draft the final allocation rule incorporating the reserve buffer and top-up-adjusted optimal fraction. Document sensitivity guides.

  **In essence:** Your donor's anti-correlated generosity is your superpower – **prioritize quantifying how it radically changes the risk-taking calculus (#1 & #3).** Then tackle the practical frictions of lumpy bets (#2). The standard concerns about edge uncertainty and utility frameworks are likely less critical *for your specific context* than you fear, thanks to that unique donor behavior. Focus your precious time where the unique structure creates the biggest leverage.
