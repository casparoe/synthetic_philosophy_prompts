prompt: |-
  I've ended up defending a package of views about expectation and rational choice more confidently than I can really support, and I'd like to know how exposed it is. The package is this. (1) The St. Petersburg-style cases don't merely show that expected value is awkward to compute or unintuitive; they show it is the wrong currency, so the quantity that should govern choice isn't E[U] at all. (2) The decisive case is the Pasadena-style gamble: a fair coin is tossed until it lands heads; if the first heads is on toss n you receive a payoff that alternates in sign and grows like 2^n/n, so that the expected value series is the alternating harmonic series, conditionally convergent, with both the positive and the negative tails divergent. Any criterion that goes silent there, or that returns different verdicts depending on how the terms happen to be ordered, has misdescribed what it was measuring rather than hit a computational wall. (3) The replacement I favor is what I call the stabilization rule: truncate both options at a threshold — cap magnitudes, ignore outcomes beyond it, cut the tail however you like — take the difference of the two truncated expectations as a function of the threshold, and let the threshold go to infinity; where that limit exists and is nonzero, prefer accordingly, and where it fails to exist, treat the options as genuinely incomparable rather than manufacture a number. (4) The consequence I actually care about is that expected-value reasoning about very long-run futures — existential-risk mitigation, arguments of the form tiny probability, astronomically large payoff — inherits the pathology, since that is precisely the domain where the tails are heaviest and the bounds least settled.

  I was pressed on this by a friend who works on long-termist research funding and by someone in my department's decision-theory reading group, and I noticed I was doing most of the conceding. So: what would count against the package? Rank the defeaters from fatal to merely awkward, and separate what a sympathetic reader — someone who already grants that expectations can be undefined — would themselves concede counts against it from what only a committed expected-utility theorist would press. I'd like you to consider at least: whether the stabilization rule is extensionally equivalent to plain expectation wherever expectation is defined, since I take that as a desideratum I may not have earned; whether it can violate transitivity or stochastic dominance, or flip its verdict under changes confined to outcomes of arbitrarily small probability; my own suspicion that the rule just privileges one ordering of the terms — the order in which the tosses happen — without a principled story about why that ordering is the right one; whether incomparable is doing real work or is reluctance with a technical name; whether the whole package is otiose if the physical world bounds stakes and probabilities sharply enough that no real decision has an undefined expectation, which is where my friend pushed hardest and where I think I waved the question away; and whether (4) actually follows from (1)–(3) or needs an extra premise about how heavy the tails of real interventions are. If there is a result to the effect that a law-of-large-numbers style justification can be recovered for long-run reasoning even when only one of the two tails converges, tell me how much of (1) that would take down with it.

  What would move me most is evidence that has arguably already arrived — a case, a proof, or an established modeling practice — rather than a merely possible world. And please tell me honestly whether I have insulated the position: expectation is the wrong currency is a normative claim, and I can't tell whether my insistence that no numerical criterion survives the Pasadena case is a discovery or a stipulation. If it is insulated by construction, say whether that is a defect for a view of this kind. Lead with your verdict in a single sentence — how exposed the package is, and at which joint — then give the ranked defeaters and the reasoning, with no preamble and no restatement of what I've asked.
reasoning: |-
  Okay, the user has presented a detailed package of views on rational choice theory, particularly critiquing expected utility theory (EUT) in light of paradoxes like St. Petersburg and Pasadena. They've outlined four main points: rejecting EUT as fundamentally flawed due to these paradoxes, emphasizing the Pasadena game as a decisive counterexample, proposing a "stabilization rule" alternative that truncates expectations and allows for incomparability, and applying this to critique long-termist reasoning about existential risks.

  The user feels exposed after defending this position and wants to know where it's vulnerable. They've listed specific concerns: whether stabilization matches EUT where defined, possible violations of transitivity or dominance, ordering dependence in the truncation, whether "incomparable" is meaningful, whether real-world boundedness makes this irrelevant, and if their conclusion about long-termism follows. They also worry their view might be insulated by stipulation rather than discovery.

  Hmm, this is a sophisticated philosophical position. The user is clearly well-versed in decision theory but worries they've overcommitted. Their request for "already arrived" evidence suggests they want concrete objections, not just theoretical possibilities. The mention of being pressed by a long-termist friend and decision-theory group indicates real-world stakes in academic debates.

  First, the stabilization rule's extensional equivalence seems correct - where expectations converge absolutely, truncation should give the same limit. But the conditional convergence problem looms large. The user's suspicion about privileging the toss order is spot-on; their rule implicitly uses the temporal ordering, but why is that normatively special? 

  Transitivity violations might not be immediate, but stochastic dominance is tricky. If altering near-zero probability outcomes can flip the stabilization verdict, that violates standard dominance principles - a serious cost. The user recognizes this but may underestimate how damaging it is.

  The boundedness objection is powerful. If all real-world payoffs and probabilities are bounded (which physics suggests), then undefined expectations don't actually occur. The user's friend pushed here, and waving it away seems weak. For the long-termism application, this is fatal unless they can show real interventions have sufficiently heavy tails.

  The law-of-large-numbers point is subtle. Even with one divergent tail, long-run averages might still provide justification, but I'd need to recall precise results. This could partially defang the critique of long-termism without fully rehabilitating EUT.

  Most damning is the insulation worry. By defining "numerical criterion" to exclude their stabilization approach, they make their view unfalsifiable. That's methodologically suspicious for a normative theory. The Pasadena case shows EUT fails, but doesn't prove no better numerical approach exists - just that conditional convergence is problematic.

  The user seems most invested in the long-termism critique. If boundedness holds, that application collapses. Even if not, stabilization's ordering-dependence and dominance issues make it questionable for policy. They might need to retreat to a weaker position: EUT is incomplete for heavy-tailed distributions, rather than wholly wrong.

  Ranking objections: boundedness and dominance violations are fatal for real-world relevance; ordering-dependence is a major theoretical flaw; insulation makes it non-falsifiable; transitivity might be salvageable but needs work. The LLN point is interesting but doesn't save EUT in Pasadena cases.
answer: |-
  **Verdict:** The package is **critically exposed at its application to real-world decisions (4)**, due to physical boundedness making undefined expectations irrelevant, with serious theoretical vulnerabilities in the stabilization rule's ordering dependence, potential dominance violations, and insulation from counterexample.

  ### Ranked Defeaters (Fatal to Awkward)

  1.  **Fatal: Physical Boundedness Undercuts (4) & Motivation for (1)-(3)**
      *   **What:** If the physical universe imposes strict upper bounds on the magnitude of possible payoffs *and* lower bounds on the resolution of probabilities (e.g., Planck scale, finite energy/matter), then *no real decision* involves truly infinite expectations or the pathologies of the Pasadena game. Payoffs are capped, probabilities of physically impossible outcomes are zero, and expectations are always defined and finite.
      *   **Why it Counts (Sympathetic & Committed):** This directly attacks the *relevance* of (1)-(3) to the real-world domain the user cares most about (4). If undefined expectations are purely mathematical artifacts with no real-world instances, the motivation for replacing E[U] and the specific concerns about long-termism (tiny probabilities, huge payoffs) evaporate. The "tails" of real interventions are always bounded and convergent. Your friend's push is decisive here; waving it away is fatal to the package's practical significance.

  2.  **Major: Stabilization Rule Violates Statewise Stochastic Dominance**
      *   **What:** Altering *only* outcomes assigned arbitrarily small probability (e.g., very high `n` in Pasadena) can flip the stabilization verdict. Consider two Pasadena-like games, A and B, identical except that for some extremely improbable outcome (say, first heads on toss N > 10^100), A pays slightly more than B. Under stabilization using temporal order, A > B. Now modify *only* that single outcome in B to pay slightly more than in A. Stabilization now says B > A. Yet, A and B differ *only* on an outcome of negligible probability. Dominance requires that if A pays at least as much as B in *every* state (which they do, except one where B now pays more), B should not be strictly preferred to A.
      *   **Why it Counts (Sympathetic & Committed):** Violating dominance is a cardinal sin in normative decision theory. A sympathetic reader already wary of E[U]'s problems would likely see this as a *worse* flaw. It shows stabilization is hypersensitive to arbitrarily remote, low-probability details in a way that seems irrational. It directly challenges the rule's normative adequacy.

  3.  **Major: Ordering Dependence is Unprincipled**
      *   **What:** The stabilization rule implicitly privileges the temporal order of resolution (toss 1, toss 2, ...). Why this order? What if the gamble is described using a different indexing (e.g., grouping outcomes by payoff magnitude)? The limit (if it exists) and verdict can change. The user's suspicion is correct.
      *   **Why it Counts (Sympathetic & Committed):** A sympathetic reader granting undefined expectations will still demand a *justification* for why one ordering (temporal) is normatively privileged over others. Without this, stabilization seems arbitrary. A committed E[U] theorist sees this as evidence that the "real" value *should* be order-invariant, hence defined only when absolutely convergent.

  4.  **Major: "Incomparable" is Reluctance, Not Insight**
      *   **What:** Declaring options incomparable when stabilization diverges avoids giving a wrong answer but doesn't provide positive guidance. It feels like giving up precisely when the decision is hardest. Alternative approaches (e.g., relative utilitarianism for Pasadena, various "weak expectation" concepts, discounting remote tails) *do* provide verdicts, however contested. Stabilization defaults to "no answer" where others venture one.
      *   **Why it Counts (Sympathetic & Committed):** A sympathetic reader might see this as unsatisfying or incomplete, wishing for more guidance. A committed theorist sees it as an admission of the rule's failure to capture rational preference in those cases. It doesn't obviously do "real work" beyond acknowledging the problem stabilization itself creates by its dependence.

  5.  **Moderate: Insulation by Stipulation**
      *   **What:** Defining "numerical criterion" such that stabilization doesn't count as one (because it yields a limit/difference, not a single prior number like E[U]) makes "expectation is the wrong currency" partly stipulative. The Pasadena game shows E[U] *as classically defined* fails. It doesn't *prove* no useful numerical representation of preference exists *at all*; stabilization itself produces a numerical difference for comparisons where the limit exists. Claiming "no numerical criterion survives" leans on this definition.
      *   **Why it Counts (Sympathetic & Committed):** A sympathetic reader might accept the *spirit* that standard E[U] fails but find the strong claim overstated. A committed theorist sees it as defining the problem to fit the solution. For a normative view, this insulation risks being unfalsifiable, a significant defect.

  6.  **Moderate: Transitivity & Extensional Equivalence**
      *   **What:** Stabilization *is* extensionally equivalent to E[U] where E[U] is defined (absolutely convergent). Transitivity violations haven't been demonstrated but aren't ruled out, especially when comparing multiple options with divergent stabilization differences. They are a potential worry.
      *   **Why it Counts (Sympathetic):** Extensional equivalence is a strength. Transitivity is a potential vulnerability but less immediate than dominance. A sympathetic reader would likely accept the rule *if* the other major issues were resolved.
      *   **Why it Counts (Committed):** Transitivity is core; a violation would be fatal, but absence of proof isn't proof of absence. Extensional equivalence is necessary but insufficient.

  7.  **Moderate: LLN & Heavy Tails (Impact on (1))**
      *   **What:** A Law of Large Numbers justification *can* hold even if only one tail converges, *if* you fix the gamble and repeat it independently. The time-average payoff will converge to the expectation value *if it exists* (i.e., if the expectation converges absolutely). If the expectation diverges (e.g., positive St. Petersburg), the time-average diverges. The Pasadena expectation doesn't exist (conditionally convergent), so the LLN doesn't apply. This doesn't "take down" (1); it reinforces that undefined expectations break the standard LLN justification. However, it *doesn't* directly help justify long-termism under stabilization if tails are heavy but convergent.
      *   **Why it Counts (Sympathetic):** Confirms that (1) stands regarding the *theoretical* failure of E[U] and its justification via LLN in pathological cases. Doesn't rescue long-termist E[U] arguments if tails are heavy but convergent (where E[U] *is* defined).
      *   **Why it Counts (Committed):** Highlights that the standard justification fails precisely when E[U] is undefined, consistent with (1).

  **Regarding (4) Needing an Extra Premise:** Yes, (4) critically depends on the *empirical premise* that real-world interventions (especially long-termist ones) involve sufficiently heavy-tailed distributions to cause undefined expectations *under physical reality*. Defeater #1 argues this premise is false. If boundedness holds, (4) doesn't follow. If boundedness fails for some interventions, then (4) could hold *if* stabilization is viable – but Defeaters #2, #3, and #4 challenge that viability.
