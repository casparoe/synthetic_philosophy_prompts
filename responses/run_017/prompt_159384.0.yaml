answer: |-
  Here is the examination question, model answer, and marking scheme as requested:

  ### 1. Examination Question (Total: 30 Marks)

  **Question:** The debate between endurantism (objects persist by being wholly present at multiple times) and perdurantism (objects persist by having temporal parts at different times) often centres on three pressure points. First, both views seem equally capable of handling temporary intrinsics (e.g., being bent at *t* and straight at *t*′) via time-indexed properties, undermining a key argument for perdurantism. Second, perdurantists face a potential regress: the spacetime worm itself has temporary properties (e.g., being straight-shaped-at-segment-*S* and bent-shaped-at-segment-*S*′), seemingly requiring a *second-order* temporal-parts analysis. Third, temporal ordering appears fundamental to defining change, yet perdurantist mereology alone cannot supply it.

  To test the third point, consider this case:  
  *Ada runs a marathon. Her run consists of instantaneous stages. Crucially, the temporal order of these stages (their locations in time) diverges completely from their order along every other dimension relevant to persistence—including fatigue, memory, causal influence, and intrinsic similarity. The stage at which Ada crosses the finish line (exhausted, remembering most of the run) occupies the* **earliest** *time. The stage at which she leaves the start line (fresh, remembering nothing of the run) occupies the* **latest** *time. Intermediate stages (e.g., mile 5, mile 20) are temporally scattered between these endpoints with no correlation to their fatigue/memory/causal/intrinsic profiles, while maintaining pairwise causal links and intrinsic character identical to an ordinary marathon run. Call the ordering defined by increasing fatigue and accumulated memory the* **gradient ordering** *(e.g., start → mile 5 → mile 20 → finish).*

  Address the following:  
  **(a)** What does each theory (endurantism and perdurantism) say about whether Ada changes during this run? In which direction does each theory say she changes—from earlier-to-later times, or along the gradient ordering? (6 marks)  
  **(b)** Can the perdurantist account for change *solely* in terms of variation across temporal parts, without relying on temporal ordering as an independent primitive? Explain why or why not using the Ada case. (10 marks)  
  **(c)** Does this case provide the endurantist with a distinctive explanatory resource not equally available to the perdurantist? If so, what is it? If not, why not? (8 marks)  
  **(d)** Does Ada’s run, as described, genuinely constitute *persistence* and *change*? Briefly justify your view. (6 marks)

  ---

  ### 2. Model Answer (Definite Position: The Views Collapse)

  The central thesis here is that endurantism and perdurantism, when pressed, collapse into notational variants regarding change. Neither can define change without smuggling in primitive temporal ordering, and the Ada case exposes this shared dependency.

  **(a)** Both theories must say Ada changes *only* along the temporal ordering, not the gradient ordering. The perdurantist identifies Ada with the entire spacetime worm. Variation in properties (e.g., fatigue) across its temporal parts constitutes change. Since temporal parts are defined by their temporal location, change is variation *along time*. In Ada’s case, the "finish" stage is earliest and "start" latest; thus, she "changes" from exhausted (earlier) to fresh (later). The gradient ordering is irrelevant to temporal change. The endurantist, similarly, holds Ada is wholly present at each time. She instantiates different time-indexed properties (e.g., exhausted-at-*t*₁, fresh-at-*t*ₙ) at different times. Change is variation across these times. Again, temporal order dictates change: exhaustion (at *t*₁) precedes freshness (at *t*ₙ). Both views must reject the gradient ordering as defining change, as it contradicts the stipulated temporal sequence.

  **(b)** No. Perdurantism cannot define change without primitive temporal ordering. The perdurantist claims change *just is* qualitative variation across temporal parts. But in Ada’s case, the qualitative/causal/intrinsic variation perfectly matches the gradient ordering (start→finish), while temporal ordering is inverted (finish→start). If change were *merely* variation across parts, we should say Ada changes along the gradient: she becomes more fatigued and accumulates memories from start-stage to finish-stage. Yet perdurantists *must* deny this because their ontology individuates temporal parts *by their temporal positions*. The temporal part at *t*₁ *is* the finish-stage *because* it’s located at *t*₁. Change is therefore variation from temporal part *at t₁* to temporal part *at t₂*, etc.—demanding an antecedently given temporal sequence. Mereology alone cannot distinguish whether the worm "changes" from exhaustion to freshness or vice versa; only temporal ordering breaks the symmetry. Without this primitive ordering, the perdurantist cannot explain why variation across parts constitutes *temporal* change rather than mere spatial or abstract variation.

  **(c)** Yes. The endurantist can explain why the gradient ordering seems intuitively like "real" change, without conceding it *is* temporal change. Endurantism distinguishes the *object* (Ada) from the *times* at which she exists. Ada bears direct relations (e.g., causation, similarity) to other stages across time. In this case, the gradient ordering reflects robust causal-memorial connections: the finish-stage causally depends on earlier stages (in gradient order) like mile 20, which depend on mile 5, etc. While temporal ordering defines *when* Ada instantiates properties, the endurantist can point to the gradient as capturing the *narrative coherence* of her persistence—the diachronic unity perdurantism attributes to spacetime worms. Perdurantism, by reducing Ada to an aggregate of parts, struggles to privilege the gradient without reintroducing enduring entities *at the level of the worm*. The endurantist thus retains a resource: temporal ordering defines change, but causal/narrative relations explain persistence.

  **(d)** Yes, but minimally. Ada persists in the thin sense that there exists a series of stages causally linked and unified by being stages *of Ada*. She changes in the thin sense that she has different time-indexed properties at different times. However, this change violates ordinary expectations: she "recovers" fatigue rather than accumulates it temporally. The case shows that "persistence" and "change" are framework-dependent. Without temporal ordering, we lack the directionality essential to our concept of change. The gradient ordering provides narrative coherence but cannot override temporal position in defining change for either theory.

  **Crucial Contestable Assumption:** The argument assumes that temporal ordering is *metaphysically primitive* and cannot be reduced to (e.g.) causal relations. Perdurantists might argue temporal order emerges from the direction of causation. However, in Ada’s case, causation follows the *gradient* (finish-stage caused by mile 20, etc.), not the temporal order (where cause/effect are temporally inverted). Thus, adopting causal order as temporal order here would force perdurantists to accept gradient-defined change—contradicting their reliance on spacetime location. This tension reveals the primitiveness of temporal order.

  ---

  ### 3. Marking Scheme (30 Marks Total)

  #### Must-Hit Moves:
  1.  **(a) Identifies both theories define change via temporal order, not gradient** (3 marks).  
      *Reasoning:* Recognizes temporal location dictates change-direction for both views despite gradient.  
      *Common error:* Claims perdurantism uses the gradient due to causal links.

  2.  **(a) Explains *why* each theory must do so** (3 marks).  
      *Reasoning:* Endurantism: change = variation across times. Perdurantism: change = variation across parts defined by temporal position.  
      *Common error:* Only describes the case without linking to theory mechanics.

  3.  **(b) Diagnoses perdurantism’s reliance on temporal order to individuate parts** (4 marks).  
      *Reasoning:* Temporal parts are identified *by* their temporal location; mereology alone doesn’t order them.  
      *Common error:* Assumes parts can be ordered by intrinsic properties/causation alone.

  4.  **(b) Uses Ada to show symmetry-breaking requires temporal primitive** (4 marks).  
      *Reasoning:* Without temporal input, variation across parts is compatible with gradient or temporal "change"; only temporal order selects one.  
      *Common error:* Claims perdurantists can choose gradient ordering arbitrarily.

  5.  **(b) *Resists bad move:* Rejects dismissing Ada as impossible** (2 marks).  
      *Reasoning:* Stipulated possibility must be engaged; marks deducted for calling it "incoherent" without argument.

  6.  **(c) Credits endurantism with distinct narrative/causal unity resource** (4 marks).  
      *Reasoning:* Endurantism’s enduring subject can appeal to gradient ordering as explanatory of persistence without equating it to temporal change.  
      *Common error:* Equates this resource to perdurantism’s worm-unity.

  7.  **(c) Notes perdurantism’s difficulty privileging gradient without inconsistency** (4 marks).  
      *Reasoning:* Perdurantists cannot appeal to gradient as "real change" without undermining their temporal-parts account.  
      *Common error:* Claims perdurantists can easily adopt gradient as "temporal" order.

  8.  **(d) Affirms thin persistence/change exists** (2 marks).  
      *Reasoning:* Ada exists at multiple times with differing properties.  
      *Common error:* Denies persistence exists in the case.

  9.  **(d) Identifies temporal ordering as necessary for directional change** (4 marks).  
      *Reasoning:* Gradient alone cannot supply the directionality inherent in change without temporal input.  
      *Common error:* Prioritizes intuitive narrative (gradient) as "true" change.

  #### Grading Standards:
  - **A (25–30):** Hits all 9 moves. Explicitly connects pressure points (e.g., shows how (b) reinforces the first pressure point on time-indexing). Logically coherent position on collapse.
  - **B (18–24):** Hits moves 1–6 and 8. Engages Ada meaningfully but misses full implications of symmetry-breaking (b) or endurantist resource (c). May lapse into surveying options.
  - **C (12–17):** Hits moves 1, 2, 8, 9. Describes theories and case but misses dependency on temporal order (b/c). May dismiss Ada’s possibility or appeal to intuition/number of entities.
  - **D/F (<12):** Fails to engage Ada or key pressure points. Summarizes standard dialectic without applying it.
