  Alternatively, we want to assign a rate for the situation type (without the intention) and the old class was used for that situation type but with extra features.

  Let's reframe: We are flagging the situation type: "approaching a crosswalk with a pedestrian present." Then we look for candidate classes.

  *Step 1: Define the situation type:*
  - "Vehicle is within 50 meters of a crosswalk and a pedestrian is within 5 meters of the crosswalk."

  *Step 2: Candidate Classes:*
  1. The old class (which added intention and excluded takeovers) - but we cannot use it because intention is not logged? So we skip? Or we try to define it without intention? But then it's different.

  Actually, the procedure requires the class to be defined from logs. So we cannot use the old class definition. We must use only logged features.

  Candidate classes:
  1. New class: Same as situation type (from fleet data). But might have takeovers? We don't exclude.
  2. Broad class: All pedestrian interactions (with a pedestrian within 10 meters of the vehicle).

  *Step 3: Test Candidates*
  - Candidate 1 (new class):
    - Test 1: Pass (features: vehicle position, crosswalk, pedestrian position).
    - Test 2: Pass.
    - Test 3: Second analyst reproduces.
    - Test 4: Stability under remote assistance reduction? The class includes instances with and without takeovers. If we reduce takeovers, then the class will include more instances that would have been taken over? But the class definition doesn't change. So it's stable? But the event rate might change. However, the test is about the class definition. Pass.
    - Test 5: We need data. Suppose we have 10,000 instances (from fleet) and 2 events. But note: the old class had excluded takeovers. Now we are not excluding. The events might be in non-takeover cases. But we don't know. We compute with the data we have. Pass (if exposure is enough).

  But wait: the old class had a lower event rate because it excluded the takeover cases? And now we are not excluding? Then the rate might be higher? But we are not using the old class.

  The procedure catches the old class in Step 1: we cannot define a class with a feature that is not logged. So we don't even consider it.

  Moreover, in the stability test for any class we consider, we must not exclude takeovers if the policy change (reducing takeovers) would affect the class. In candidate 1, we are not excluding takeovers, so the class includes the takeover cases. That's stable. But the event rate might change when we reduce takeovers because the AV might have more events? But that's not a problem for the class definition.

  However, the procedure also requires that the class be defined by pre-outcome features. The takeover happens during the event? Or before? If the takeover happens before the event, then the takeover is a pre-outcome feature? But in the old class, they excluded takeovers that happened before the maneuver began. That might be a pre-outcome feature? But it's in the logs. So why didn't they use it? They did, but they also used intention.

  The old class failed because it used intention (not logged) and also because in the stability test: if we reduce takeovers, then the old class would change because it excludes takeovers. Specifically, the class definition includes "no takeover before the maneuver." If we reduce takeovers, then more instances would meet this condition? But the class definition would still be the same (it still requires no takeover). However, the event rate in this class might change because the AV might not handle the situation as well without the takeover? But the class definition is the same.

  The stability test (Test 4) is about the class definition being invariant. The old class definition is: "no takeover and intention to cross." The policy change (reducing takeovers) means that the condition "no takeover" will be met more often? But the class definition is still the same set of conditions. So it's stable? But the rate might change. The test only cares about the definition, not the rate.

  However, the old class also used a feature (intention) that is not logged. So it fails Test 2 (pre-outcome feature test) because the intention coding is done after the fact and is not in the logs. Moreover, Test 3: the second analyst cannot reproduce the intention coding without the same subjective judgment. So the old class would have failed the procedure.

  **How the procedure catches it:**
  - In Step 1, we cannot define the situation type with intention because it's not logged.
  - In Step 2, if we try to use the old class as a candidate, it fails Test 2 (pre-outcome feature test) because intention is not in the logs.
  - Also, in Test 3, the adversarial re-derivation fails because the second analyst cannot reproduce the intention coding.

  **Corrected number:**
  - We must use a class without intention. We use candidate 1: "vehicle within 50m of crosswalk and pedestrian within 5m." This class includes instances with and without takeovers. The event rate might be higher than the old class because it includes more instances (some of which are taken over and hence have no event). But we compute the rate from this class.

  Suppose in the fleet data, we have 10,000 instances (without any exclusion) and 2 events. The vehicle-miles: each instance is say 0.01 VMT (approaching a crosswalk) -> 100 VMT. Then rate = 2/100 * 1e6 = 20,000 per million VMT. Upper bound (95%): for 2 events, χ²(0.95,6)=12.592, so λ_upper = 12.592/(2*100)*1e6 = 62,960 per million VMT.

  **Safety case already filed:**
  - The procedure requires that we re-run the safety case with the corrected class and rate. We must audit the past safety cases that used the old class and recalculate the rates using the new class (if possible) or note the error. The regulator must be informed.

  ---

  **What the Procedure Cannot Do**

  1. **Endogeneity of Historical Data:** The procedure uses historical data that are conditional on past mitigations (e.g., remote takeovers). When we reduce takeovers, the event rate might increase, but the historical rate (which included takeovers) is not valid. The stability test (Test 4) only checks if the class definition would change, not if the rate would change. So the procedure does not adjust for the endogeneity of the rate. The analyst must be aware that the rate is conditional and might not hold under policy changes. This is left for the stability test to catch only if the class definition is unstable. If the class definition is stable but the rate changes, the procedure does not account for it.

  2. **Non-Nested Classes and Conservatism:** When choosing among non-nested classes, the procedure relies on a pre-specified hierarchy of axes. This hierarchy is a judgment call and might not capture the true relevance to the event mechanism. Also, the requirement to choose the narrowest class might lead to a class with high variance (and a very high upper bound) when a broader class might be more stable and conservative. The procedure tries to balance by conservatism (choosing the class with the highest rate in case of tie) but this might not be sufficient.

  3. **Simulator Validation:** The procedure relies on simulator validation for comparability. If the simulator is flawed in a way that hasn't been validated, the procedure will not catch it. Also, the validation criterion (within a factor of 2) is arbitrary and might not be sufficient for safety-critical events.

  4. **Rare Events:** When events are rare, even the data adequacy threshold (5 events) might be hard to meet. Then the analyst is forced to use a broader class, which might not be representative.

  5. **Gaming:** The procedure has some resistance to gaming:
     - By requiring multiple candidates and an adversarial test, it makes cherry-picking harder.
     - The ledger and periodic review by the lead can detect patterns (e.g., an analyst always picks the class with the lowest rate).
     - However, an analyst could still choose candidate classes that are more likely to pass and have lower rates, by manipulating the choice of candidates in Step 2. The requirement to have at least three distinct candidates and the periodic review by the lead are mitigations.

  6. **Subjectivity in Comparability:** The comparability assessment (Step 4) is subjective and might be influenced by the desired outcome. The documentation requirement makes this visible, but it's still a vulnerability.

  7. **Upper Bound Calculation:** The procedure uses a standard statistical upper bound (e.g., Poisson), but this does not account for model uncertainty (e.g., if the reference class is not perfectly representative). The bound might be too optimistic.

  The procedure will likely misfire in situations where the event mechanism is highly dependent on features that are not logged or not included in the hierarchy of axes. A regulator might point out that the chosen reference class is not the most appropriate and that a different class would have given a higher rate. The ledger and documentation will show the rationale, but it might not be enough.

  Overall, the procedure provides a structured and auditable process that reduces arbitrariness and cherry-picking, but it does not eliminate all the challenges of the reference class problem.
answer: |-
  Below is a complete, executable decision procedure for your risk-quantification analysts. It addresses the reference class problem by enforcing structure, auditability, and adversarial validation at every step. The procedure confronts your four obstacles head-on: non-nested classes, simulation entanglement, endogeneity, and cherry-picking. It is designed to be handed to an analyst on Monday.

  ---

  ### **Risk Quantification Decision Procedure**  
  **Version 1.0**  
  *For assigning injury-potential event rates (X per million vehicle-miles) to flagged situation types*

  #### **Inputs**  
  - Flagged situation type (e.g., "left turn across traffic at signalized intersection with no protected phase").  
  - Fleet telemetry logs (time-stamped, immutable, versioned).  
  - Scenario-mining pipeline outputs (simulation/fleet).  
  - Access to:  
    - Class Definition Ledger (CDL): A versioned database of all historical class definitions and decisions.  
    - Policy Change Register (PCR): A list of planned operational changes (e.g., "reduce remote assistance by 50%").  

  #### **Outputs**  
  - `X` (upper-bound rate per million vehicle-miles), **or** `ESCALATE` (with reason).  
  - Versioned reference class definition (stored in CDL).  

  ---

  ### **Step-by-Step Procedure**  
  *Analysts must complete steps in order. All answers and tests documented in CDL. No backtracking.*

  #### **Step 1: Define the Situation Type**  
  **Question:** *What is the exact mathematical definition of the flagged situation, using only pre-outcome features from the logged schema?*  
  - **Sufficient answer:**  
    - Features must be computable from telemetry logs (e.g., `signal_phase = "green" AND turn_direction = "left" AND oncoming_vehicles > 0`).  
    - No post-hoc coding (e.g., "after watching the clip").  
    - Features must exist in the schema version active when the data was logged.  
  - **Failure:** If definition relies on unlogged/derived features → `ESCALATE` to Group Lead.  
  - **Judgment?** None. Purely procedural.  

  #### **Step 2: Propose Candidate Reference Classes**  
  **Question:** *What are 3–5 candidate reference classes for this situation, and what axes define them?*  
  - **Sufficient answer:**  
    - Each candidate must specify:  
      - **Axes of definition** (e.g., "road type," "signal phase," "pedestrian density").  
      - **Data source** (fleet, simulation, or external).  
      - **Narrowness score** (see table below).  
    - Candidates must be structurally distinct (non-overlapping axes).  
    - At least one candidate must be simulation-based (if applicable).  
  - **Narrowness Score Calculation:**  
    | Axis Category | Weight |  
    |--------------|--------|  
    | Maneuver type (e.g., turn, lane change) | 3 |  
    | Agent interaction (e.g., pedestrians, vehicles) | 3 |  
    | Environmental (e.g., weather, road surface) | 2 |  
    | Temporal (e.g., time of day) | 1 |  
    | Geographic (e.g., metro area) | 1 |  
    - **Score =** Σ(Weights for all axes in class definition). Higher score = narrower.  
  - **Failure:** Cannot propose ≥3 distinct candidates → `ESCALATE` to Group Lead.  
  - **Judgment?** Low. Choice of candidates is constrained by weights and distinctness.  

  #### **Step 3: Apply Class Validation Tests**  
  *Each candidate must pass all tests below. Test in order; failure rejects candidate.*  

  **Test 1: Axis Specification**  
  - **Question:** *Are all axes objectively defined and pre-outcome?*  
  - **Pass:** Axes are in the log schema, computable without outcome data.  
  - **Failure:** Ambiguous axes (e.g., "appears risky") → Reject candidate.  

  **Test 2: Pre-Outcome Feature Audit**  
  - **Question:** *Can all features be computed from logs before event occurrence?*  
  - **Pass:** Feature extraction code is runnable on raw logs (no event flags).  
  - **Failure:** Features depend on post-event state → Reject candidate.  

  **Test 3: Adversarial Re-derivation**  
  - **Question:** *Can a second analyst reproduce the class using only the written definition?*  
  - **Pass:** Second analyst (blinded to outcomes) achieves ≥95% instance overlap.  
  - **Failure:** Overlap <95% → Reject candidate.  
  - **Judgment?** None. Purely procedural.  

  **Test 4: Policy Stability**  
  - **Question:** *Does the class definition remain invariant under planned policy changes (from PCR)?*  
  - **Pass:** Class does not reference mitigations being changed (e.g., no "remote_operator = false" if reducing assistance).  
  - **Failure:** Definition includes mutable conditions (e.g., "no remote takeover") → Reject candidate.  

  **Test 5: Data Adequacy**  
  - **Question:** *Does the class have sufficient data to estimate X?*  
  - **Pass criteria:**  
    - **Fleet/External data:** ≥100,000 vehicle-miles AND ≥5 injury-potential events.  
    - **Simulation data:** ≥1,000,000 vehicle-miles AND ≥10 events AND generator validated in comparable context (see Step 4).  
  - **Failure:** Insufficient data/events → Reject candidate.  

  **Test 6: Simulation-Fleet Pooling (if applicable)**  
  - **Question:** *Can simulation and fleet rates be pooled?*  
  - **Pass:** ALL of:  
    - Simulator validated on ≥3 distinct classes in same axis category (e.g., intersection maneuvers).  
    - Fleet vs. simulation event rates differ by ≤2x in validated classes.  
    - No active policy changes affecting simulator assumptions (per PCR).  
  - **Failure:** Unvalidated simulator or rate mismatch → Reject pooled candidate.  

  #### **Step 4: Comparability Assessment (External/Simulation Classes)**  
  **Question:** *Is the context of this class comparable to the target situation?*  
  - **Sufficient answer:**  
    - For **external data** (e.g., city crash stats): Document ≥3 shared risk factors (e.g., traffic density, road type) and ≤2 material differences (e.g., "siren patterns differ").  
    - For **simulation data:** Validation report exists for the dominant axis (e.g., "intersection interactions").  
  - **Failure:** Material differences without adjustment → Reject candidate.  
  - **Judgment?** High. Analyst must document rationale; Group Lead reviews.  

  #### **Step 5: Calculate Rates & Select Class**  
  **Question:** *What is X for each passing candidate? Which class is selected?*  
  - **Rate calculation:**  
    - Compute events per million vehicle-miles.  
    - Apply Clopper-Pearson 95% upper confidence bound (exact method for binomial).  
  - **Class selection rules (in order):**  
    1. Highest narrowness score (Step 2).  
    2. If tie: Highest event rate (to enforce conservatism).  
    3. If tie: Most stable under PCR changes (per Test 4).  
  - **Failure:** No candidates pass all tests → `ESCALATE` to Group Lead.  
  - **Judgment?** Low. Rules are deterministic.  

  #### **Step 6: CDL Documentation & Sign-off**  
  - **Document in CDL:**  
    - Situation type definition.  
    - All candidates, tests, rates, and selection rationale.  
    - Second analyst’s re-derivation report.  
  - **Sign-off:** Analyst + Second analyst attest in CDL.  
  - **Audit trigger:** Group Lead reviews 100% of escalations + 20% random selection.  

  ---

  ### **Procedure Run on Cases**  
  *Assumptions:*  
  - Fleet vehicle-mile conversion: 1 instance = 0.1 vehicle-miles (adjust as needed).  
  - Clopper-Pearson 95% upper bound used for X.  

  #### **Case 1: Left Turn Across Traffic**  
  - **Situation:** "Left turn at signalized intersection, no protected phase, oncoming vehicles >0."  
  - **Fleet data:** 40 instances (0 events).  
  - **Broad class:** 2,200 intersection interactions (3 events).  
  - **Procedure:**  
    1. **Step 1:** Definition = `turn_type = "left" AND signal_phase = "green" AND protected_phase = false AND oncoming_vehicles > 0` (logged features).  
    2. **Step 2: Candidates:**  
       - A: Narrow class (situation exactly): Axes = [Maneuver, Agent] → Narrowness = 6. Instances: 40 (0 events).  
       - B: Broad class (all intersections): Axes = [Maneuver] → Narrowness = 3. Instances: 2,200 (3 events).  
       - C: Sim class (left turns): Axes = [Maneuver, Environment] → Narrowness = 5. Sim data: 1M miles, 8 events.  
    3. **Tests:**  
       - A: Fails Test 5 (0 events, insufficient data).  
       - B: Passes Tests 1–5. Fleet data: 2,200 × 0.1 = 220K miles, 3 events → Adequate.  
       - C: Passes Tests 1–5 but fails Test 6 (sim not validated for "oncoming vehicles" axis).  
    4. **Selection:** Only B passes. Rate = (3 events / 220K miles) × 1M = 13.64/million. Upper bound (95%) = **24.6/million**.  
    5. **Output:** `X = 24.6` using broad intersection class.  

  #### **Case 2: New Metro Area Expansion**  
  - **Situation:** "Interaction with emergency vehicle in Metro Area X."  
  - **No fleet data.** Candidates: Simulator (validated in other cities), City crash stats, Fleet data from other cities.  
  - **Procedure:**  
    1. **Step 1:** Definition = `emergency_vehicle = true AND metro = "X"`.  
    2. **Step 2: Candidates:**  
       - A: Sim class: Axes = [Agent, Environment] → Narrowness = 6. Sim data: 1M miles, 12 events.  
       - B: External class (city stats): Axes = [Geographic] → Narrowness = 1. Data: 10 events in 50M miles (0.2/million).  
       - C: Fleet class (other cities): Axes = [Agent] → Narrowness = 3. Data: 200K miles, 0 events.  
    3. **Tests:**  
       - A: Passes Tests 1–3. Fails Test 6 (sim not validated for "siren patterns" in X → unstable per PCR).  
       - B: Passes Tests 1–3. Fails Test 4 (city stats assume human drivers, not AVs → endogenous).  
       - C: Passes Tests 1–3. Fails Test 5 (0 events).  
    4. **Comparability (Step 4):**  
       - A: Material differences (siren patterns, etiquette) → no validation for X.  
       - B: Material differences (human vs. AV behavior).  
    5. **Output:** `ESCALATE` (no candidates pass). **Action required:** Collect shadow-driving data in X or delay expansion.  

  #### **Case 3: Problematic Class (Excluding Remote Takeovers)**  
  - **Situation:** "Approaching crosswalk with pedestrian present."  
  - **Existing class:** "Pedestrian within 5m AND analyst_coded_intent = true AND remote_takeover = false" (used for 2 years).  
  - **Procedure:**  
    1. **Step 1:** New definition = `distance_to_pedestrian ≤ 5m` (logged feature). *Removes analyst coding and takeover exclusion.*  
    2. **Step 2: Candidates:**  
       - A: Old class: Axes = [Agent, Temporal] → Narrowness = 6. Data: 500K miles, 2 events (X = 4.0).  
       - B: New class: Axes = [Agent] → Narrowness = 3. Data: 1M miles, 5 events (X = 5.0).  
    3. **Tests for A (old class):**  
       - Fails **Test 1:** `analyst_coded_intent` not in logs (subjective).  
       - Fails **Test 2:** `remote_takeover = false` is pre-outcome but mutable.  
       - Fails **Test 4:** Class unstable under PCR "reduce remote assistance" (takeover rate changes).  
       - Fails **Adversarial Test:** Second analyst cannot reproduce `analyst_coded_intent`.  
    4. **Tests for B (new class):** Passes all tests. Rate = 5 events / 1M miles = 5.0. Upper bound = **10.5/million**.  
    5. **Catch:** Procedure rejects old class in Steps 1 (unlogged feature) and Test 4 (unstable under policy).  
    6. **Corrected rate:** `X = 10.5` (vs. historical 4.0).  
    7. **Safety case action:**  
       - Recalculate all historical safety cases using class B.  
       - File amended report with regulator, disclosing:  
         *"Reference class [ID] violated pre-outcome and stability tests. Revised rate: 10.5/million (was 4.0). Impact: +2.3% aggregate risk."*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Endogeneity of Historical Data:**  
     - The procedure forces acknowledgment of policy dependence (Test 4) but cannot "de-bias" historical rates. Rates remain conditional on past mitigations. Analysts must supplement with sensitivity analysis (e.g., "if remote assistance drops 50%, X increases by Y%").  

  2. **Non-Nested Classes and Narrowness:**  
     - The narrowness score (Step 2) imposes structure but is still a weighted heuristic. A regulator could dispute axis weights. Mitigation: Weights are fixed in the procedure (no analyst discretion).  

  3. **Simulation Reality Gap:**  
     - Test 6 validates the simulator but cannot detect unknown blind spots (e.g., "siren patterns not modeled"). Analysts won’t know until real-world events occur.  

  4. **Rare Events in Narrow Classes:**  
     - Test 5 rejects small samples, forcing broader classes. This protects against overfitting but can underrepresent high-risk edge cases.  

  5. **Gaming the System:**  
     - An analyst could "tune" candidate proposals (Step 2) to bias outcomes. The CDL ledger makes this visible over time (e.g., "Analyst A’s classes have 20% higher narrowness scores"). Escalation to Group Lead is the only mitigation.  

  6. **Value Judgments Masked as Fact:**  
     - Comparability assessment (Step 4) is inherently subjective. The procedure forces documentation but cannot eliminate discretion. A regulator could challenge "material differences."  

  **Where It Will Misfire (and Analysts Won’t Notice):**  
  - **False Stability:** Test 4 checks class *definition* stability, not *rate* stability. A class could pass but have volatile rates under policy changes.  
  - **Simulator Overfitting:** A simulator validated on "easy" axes (e.g., highway driving) could fail silently when applied to complex interactions (e.g., pedestrians).  
  - **Confidence Bound Blindness:** The Clopper-Pearson bound is statistically sound but assumes data independence. Fleet data from correlated routes could violate this.  

  ---

  **Final Note:** This procedure is a **baseline**, not a panacea. It replaces ad hoc choices with auditable structure, but its success depends on ruthlessly enforcing CDL documentation and adversarial reviews. Integrate it with your existing pipeline, and have analysts run practice batches on historical data to calibrate.
