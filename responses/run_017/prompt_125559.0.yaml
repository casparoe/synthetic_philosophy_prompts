  We are designing a decision procedure for risk quantification analysts. The goal is to assign a rate (X per million vehicle-miles) for a given situation type (flagged by the pipeline) in a way that is reproducible, auditable, and minimizes bias.

  The procedure must address:
  1. Non-nested candidate classes (narrow in one axis, broad in another).
  2. Simulation-derived classes and when to pool with fleet data.
  3. Endogeneity of historical data (conditional on past screening and mitigations).
  4. Preventing analysts from cherry-picking reference classes to get desired numbers.

  The procedure will be a step-by-step guide for an analyst. It will include:
  - Questions in order, with criteria for sufficient answers.
  - Tests a proposed reference class must pass (axis specification, pre-outcome feature test, adversarial re-derivation, stability under policy changes).
  - Escalation points when no number can be produced.
  - Points where judgment is required (and how to document it).

  We also need to run the procedure on three cases and identify the procedure's limitations.

  ---

  **Decision Procedure for Risk Quantification**

  **Objective:** For a flagged situation type, assign an upper bound on the event rate (with injury potential) per million vehicle-miles, using a reference class that is defensible and reproducible.

  **Inputs:** 
  - A flagged situation type (with a set of defining features).
  - Fleet telemetry and simulation data.
  - Access to historical event data (with injury potential).
  - A version-controlled class definition ledger.

  **Outputs:** 
  - An upper bound rate (X) for the situation type, or an escalation if one cannot be determined.
  - A fully documented and versioned reference class definition.

  **Procedure:**

  **Step 1: Define the Situation Type (Analyst)**
     - **Task:** Write a precise definition of the flagged situation type using only features that are logged (or can be derived from logs) and are available *before* the outcome (event or non-event). 
     - **Criteria:** 
       - The definition must be computable from the logs (i.e., no subjective coding without prior schema).
       - All features must be pre-outcome (no peeking at outcome).
     - **Documentation:** Record the definition in the ledger with a unique version ID, including the feature extraction method.
     - **Judgment Call:** None. This is procedural.

  **Step 2: Identify Candidate Reference Classes (Analyst)**
     - **Task:** Propose at least three candidate reference classes that include the situation type. These classes must be defined independently of the outcome and must be based on:
       - Fleet data (if available for the situation or similar).
       - Simulation data (if fleet data is insufficient or for new domains).
       - External data (e.g., human crash statistics) only if they meet the pre-outcome feature requirement and are from a context judged comparable (see Step 4).
     - **Criteria:**
       - Each candidate class must be defined by a set of features (axes) that are pre-outcome and logged.
       - The candidate classes must be distinct in their defining axes (to avoid near duplicates).
       - At least one candidate must be a "narrow" class (focused on the specific situation) and one a "broad" class (to provide a base rate from a larger set).
     - **Documentation:** For each candidate, record:
          - The defining features (axes).
          - The source (fleet, simulation, external).
          - The number of instances (and vehicle-miles) and events in the class.
          - The raw rate (events per million vehicle-miles) and the confidence interval (if computed).
     - **Judgment Call:** The choice of candidates is a judgment call, but the requirement for multiple distinct candidates is procedural.

  **Step 3: Test Candidate Classes (Analyst with Review)**
     Each candidate class must pass the following tests. If a candidate fails any test, it is rejected.

     - **Test 1: Axis Specification**
          - The class must be defined by a fixed set of features (axes) that are clearly specified and computable from logs.
          - The axes must be chosen without knowledge of the outcome in the specific instances of the candidate class (pre-outcome).
          - *Sufficiency:* The axes must be documented and reproducible.

     - **Test 2: Pre-Outcome Feature Test**
          - Verify that the features used to define the class are indeed available in the logs *before* the event (or non-event) occurs.
          - *Sufficiency:* The log schema and extraction code must be provided.

     - **Test 3: Adversarial Re-derivation Test (by Second Analyst)**
          - A second analyst, given only the written class definition (from Step 1 and Test 1) and access to the same logs, must be able to reproduce the set of instances (cases) in the class.
          - *Sufficiency:* The second analyst must achieve at least 95% overlap in the set of instances (by unique ID) and must not disagree on the inclusion of any instance that is critical (e.g., an event instance). Disagreements must be resolved by a third analyst or by escalation.

     - **Test 4: Stability Test under Policy Changes**
          - **Task:** Assess whether the class definition would remain invariant under planned policy changes (e.g., reducing remote assistance, expanding to new domains). Specifically, the class must not implicitly depend on the presence of mitigations that are being changed.
          - **Criteria:** 
              - If the class definition includes features that are affected by a planned policy change (e.g., "remote operator did not take over" when considering reducing remote assistance), then the class fails this test.
              - The class must be defined in a way that it would have been the same set of instances under the new policy (if we had data). If not, it fails.
          - *Sufficiency:* The analyst must list the planned policy changes (from a maintained list) and state whether the class is stable under each. If unstable for any, the class fails.

     - **Test 5: Data Adequacy (for Fleet and External Classes)**
          - For fleet or external data: The class must have at least 100,000 vehicle-miles of exposure (or an equivalent number of instances that map to vehicle-miles) and at least 5 events. If not, the class is rejected for being too small. (Adjust thresholds as needed, but fix them in the procedure.)
          - For simulation data: The class must be generated by a simulator that has been validated against fleet data in a comparable context (see Step 4). The simulation must have been run with a fixed, versioned scenario generator and must produce at least 1,000,000 simulated vehicle-miles (or equivalent) and at least 10 events (if the expected rate is low, adjust by power analysis). Also, the simulation parameters must not be tuned to this specific situation (to avoid overfitting).

     - **Test 6: Pooling Test (for Mixed Fleet/Simulation)**
          - If the candidate class uses a mix of fleet and simulation data, then:
              - The simulation must have been validated for the specific axes of the class (i.e., the simulator must accurately reproduce the event rate for similar classes in the fleet).
              - The validation must show that the simulator's rate for a set of control classes (from the same axes) is within a factor of 2 of the fleet rate (or within a pre-specified tolerance) and that the variance is consistent.
          - If the candidate class uses external data (e.g., human crash stats), then the analyst must show that the external context (road conditions, vehicle behavior, etc.) is comparable to the AV context for this class (see Step 4).

     - **Documentation:** For each candidate, record the results of each test (pass/fail and reasons). For Test 3, include the second analyst's report.

  **Step 4: Comparability Assessment (for External and Simulation Classes)**
     - **Task:** If a candidate class is based on simulation or external data, the analyst must assess the comparability to the current AV operating context.
     - **Criteria:**
          - For simulation: The simulator must have been validated in a context that shares the same critical features (e.g., intersection type, traffic density) as the situation type. The validation report (which must be versioned and available) must show no significant bias in the event rates for the validated classes.
          - For external data (e.g., human crash stats): The analyst must list the factors that might differ (e.g., driver behavior, vehicle design, road conditions) and argue that they do not materially affect the event rate. This argument must cite prior studies or internal validation work.
     - **Judgment Call:** This step requires judgment. The analyst must document the factors considered and the rationale for comparability. If the judgment is that the data are not comparable, the candidate is rejected.

  **Step 5: Rate Calculation and Aggregation (Analyst)**
     - **Task:** For each candidate class that passed all tests, compute the event rate and an upper confidence bound (e.g., 95% upper bound) using a predetermined method (e.g., Poisson distribution).
     - **Criteria:**
          - The rate must be computed as: (number of events) / (total vehicle-miles in the class) * 1,000,000.
          - The upper bound must be computed using a standard method (e.g., exact Poisson upper bound).
     - **Documentation:** Record the rate and the upper bound for each candidate.

  **Step 6: Select the Reference Class and Rate (Analyst with Oversight)**
     - **Task:** Among the candidate classes that passed all tests, select the one that provides the narrowest definition along the axes that are most relevant to the event mechanism, while meeting the data adequacy criterion.
     - **Criteria:**
          - The selection must be based on a pre-specified hierarchy of axes (e.g., "road type" and "maneuver type" are more important than "weather" for certain events). The hierarchy must be defined in a company guideline (to ensure consistency across analysts and time).
          - If there is no clear "narrowest" (because of non-nested axes), then the analyst must choose the class with the highest event rate (to be conservative) or the class that is most stable under policy changes (if one is clearly more stable). This choice must be justified and documented.
          - If no candidate class passes all tests, escalate to the group lead (you) for further direction.
     - **Judgment Call:** The choice of which candidate to use is a judgment call, but the criteria (hierarchy of axes, conservatism) are procedural. The analyst must document the rationale for the choice.

  **Step 7: Assign the Rate and Document (Analyst)**
     - **Task:** Assign the upper bound from the selected reference class as the rate for the situation type.
     - **Documentation:**
          - In the ledger, record:
              - The selected reference class and its definition.
              - All candidate classes considered and their test results.
              - The computed rate and upper bound.
              - The rationale for class selection.
          - The ledger entry must be versioned and signed by the analyst and the second analyst (for the adversarial test).

  **Step 8: Review and Sign-off (Group Lead)**
     - **Task:** The group lead reviews a random sample (e.g., 20%) of the assignments and all escalations. The lead also reviews the ledger periodically to look for patterns of class selection that might indicate bias (e.g., always choosing the class with the lowest rate).
     - **Criteria:** If the lead finds an issue, the assignment is sent back for rework.

  **Escalation Points:**
     - Step 3, Test 3: If the second analyst cannot reproduce the class (and after third analyst review, if needed), escalate to the group lead.
     - Step 6: If no candidate class passes all tests, escalate to the group lead.
     - Step 4: If the comparability assessment is too uncertain, escalate.

  **Judgment Calls (Documented as Such):**
     - Step 2: Choice of candidate classes.
     - Step 4: Comparability assessment for external and simulation classes.
     - Step 6: Selection among multiple passing candidates when the hierarchy does not break the tie.

