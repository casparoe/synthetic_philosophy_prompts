prompt: |-
  I'm trying to work out what I actually think corruption is, because my gut verdicts on cases don't line up with each other. Here they are:

  - a ministry procurement officer awards a contract to the firm that paid for his daughter's wedding: corrupt, obviously
  - the same guy takes a box of chocolates at New Year from a supplier with a bid pending: not corrupt, though he should've refused
  - a village chief gets a goat from a family after settling their land dispute in their favour, where refusing would be a genuine insult: not corrupt, and I don't want an anti-corruption agency anywhere near it
  - a mayor steers a no-bid contract to a company whose CEO gave 50k to her campaign, even though she'd honestly have picked that company anyway: corrupt
  - a legislator votes for a bill that a union spent 2 million backing her campaign over, and she actually agrees with the bill: not corrupt
  - a doctor takes a disclosed speaking fee from a drug company: not corrupt, but something feels off
  - a banking regulator takes a job at a bank she used to supervise, 18 months after leaving: not corrupt, but worse than the chocolates and I can't say why
  - an aid worker pays a customs official to release a shipment of vaccines: not corrupt

  The test I keep falling back on is that a transfer is corrupt when it leaves the office-holder holding a debt that can only be discharged by using the powers of the office — call it the office-debt test. But it seems to convict the regulator, since the only way she can "earn" that future job is by going easy now, and I don't want to convict her; and it has nothing to say about why the mayor and the legislator feel different to me, since both look like money in, official act out.

  Is there one principle that gets most of this, or two principles covering different halves? Tell me which of my verdicts it forces me to drop, what it says about the case I'm stuck on — the guy at the water utility who move my leak up the queue because I slipped him twenty bucks — and whether the principle you land on is really universal or just "office as a public trust, Western edition" with the serial numbers filed off. Please don't point me at any literature; I can't look anything up.
reasoning: |-
  Okay, the user is trying to define corruption in a way that explains their gut reactions to various scenarios. They've listed several cases where their intuition says something is corrupt or not, but they can't find a consistent principle. They've proposed an "office-debt test" but it doesn't quite fit all cases, especially the banking regulator and the legislator examples. 

  Hmm, what's really going on here? The user seems intellectually honest—they're noticing their own inconsistencies and want to reconcile them. They're not just looking for textbook definitions; they want a framework that explains their intuitive judgments. That's actually quite sophisticated. The fact they included culturally nuanced cases (like the village chief's goat) shows they're thinking beyond Western legalistic frameworks. 

  The office-debt test is interesting but too narrow. It catches explicit quid pro quos (like the wedding payment) but misses structural issues. For the regulator taking a job later, the debt isn't transactional but systemic—the *possibility* of future rewards distorts current decisions. That's why it feels worse than chocolates: chocolates are small and immediate, while the job could incentivize prolonged bias. 

  For the legislator vs mayor: both involve campaign money influencing official acts, but the key difference is *independence of judgment*. The mayor's no-bid contract directly exchanges money for discretion, while the legislator voting her conscience isn't surrendering judgment—the union's spending just amplified her existing stance. The user senses this, hence different verdicts. 

  The water utility case is tricky. Twenty bucks to jump a queue violates impartial allocation of public services—it's not about debt but about circumventing fair process. Their gut probably says "corrupt" because it's rent-seeking: the official monetizes access to something that should be need-based. 

  I'll propose two principles: distortion of duty (core corruption) and invasion of office (secondary). This explains why the village goat isn't corrupt (no distortion, duty fulfilled) but the customs bribe is (distorts duty toward extortion). The regulator case fits invasion—it commercializes the office's purpose. 

  User might resist this being "Western," but the framework actually accommodates cultural context: the goat isn't corrupt because refusing would *harm* the duty (by causing offense that prevents future dispute resolution), whereas the wedding payment actively subverts it. The principle is universalizable—offices exist to serve some constituency, and corruption hijacks that service. 

  Biggest tension: their "not corrupt" verdict on the customs bribe. If life-saving vaccines are held hostage, paying isn't corrupt *personally*, but the system is corrupt. The user intuitively absolves the aid worker because their intent is pure, but the act still feeds the corruption machine. I'll note that tension without insisting they change their view—it's a gray zone.
answer: |-
  Based on your cases and your struggle with the "office-debt" test, here's a principle that captures most of your intuitions, explains the discrepancies, and addresses the water utility case:

  **The Core Principle: Corruption occurs when a transfer *distorts the exercise of official power away from its intended purpose*, or when it *invades and commercializes the core function of the office itself*.**

  This principle has two key components:

  1.  **Distortion of Duty:** Did the transfer cause the official to act *differently* than they would have solely based on the duties and merits of the office? Did it skew the *outcome* or *process* away from what the office exists to achieve?
  2.  **Invasion of Office Function:** Did the transfer involve directly "selling" access to, or the results of, the core service the office is meant to provide impartially? This focuses on the *nature of the act* facilitated by the payment, not just the quid pro quo.

  **Applying the Principle to Your Cases:**

  *   **Ministry Officer (Wedding):** **Corrupt.** Distortion is obvious (contract awarded based on payment, not merit). Also invades the core function of impartial procurement.
  *   **Ministry Officer (Chocolates):** **Not corrupt.** Minimal distortion potential (unlikely to sway a major contract). Doesn't invade the core function (chocolates aren't "buying" the contract outcome).
  *   **Village Chief (Goat):** **Not corrupt.** *No distortion* – the decision was made correctly *before* the gift. The gift is *gratitude*, not payment *for* the outcome. Refusing *would* harm the social fabric necessary for the chief's core function (dispute resolution). Doesn't invade the function.
  *   **Mayor (No-bid contract for donor):** **Corrupt.** **Distortion:** The no-bid process itself bypasses merit evaluation; the campaign donation creates the *appearance* and *likelihood* of favoritism, even if she claims she'd pick them anyway. It invades the core function of awarding contracts impartially and competitively.
  *   **Legislator (Votes with union donor):** **Not corrupt.** **No distortion (as described):** Her vote aligns with her genuine judgment and policy stance. The union money amplified her voice *for a position she held independently*. It doesn't *directly* invade the core function of voting based on judgment (though it highlights problematic systemic issues).
  *   **Doctor (Speaking fee):** **Not corrupt (but "off").** *Distortion risk exists* (could subconsciously favor the drug company), but it's disclosed. The "off" feeling comes from the *invasion* aspect: it commercializes the doctor's medical expertise and influence in a way potentially disconnected from patient care or pure science – the *appearance* of bias invades the trust in medical advice.
  *   **Banking Regulator (Job later):** **Not corrupt (but worse than chocolates).** **Invasion of Office Function:** This is the key. The *core function* of a regulator is impartial oversight in the *public* interest. The *prospect* of lucrative future employment with the regulated entity fundamentally invades and commercializes that function. It creates an inherent conflict of interest *during* regulation, even without a specific quid pro quo. The "debt" isn't discharged by a single act, but by *ongoing bias* to make oneself an attractive hire. This feels worse than chocolates because it directly threatens the *essence* of the role, not just a single decision.
  *   **Aid Worker (Customs bribe):** **Not corrupt (under duress).** **Distortion:** The payment forces the official to *do his job* (release legitimate goods) that he's *withholding illegally*. The aid worker isn't seeking special favor, but relief from extortion. The *official* is corrupt, but the *aid worker's act* isn't corrupting the system *further*; it's navigating an already corrupted system for a legitimate, urgent purpose. (This is the *most* debatable under this principle – some might argue it still feeds the corrupt system).

  **Your Stuck Case: The Water Utility Guy ($20 for queue jump)**

  *   **Verdict using Principle: Corrupt.**
  *   **Why:**
      *   **Distortion:** He changed the order of service (a core function) based on payment, not need or fairness.
      *   **Invasion:** He directly sold prioritized access to a core public service (water leak repair) that should be allocated based on urgency or impartial criteria. The $20 isn't gratitude; it's payment *for* the act of jumping the queue.

  **What This Principle Forces You to Drop/Reconsider:**

  1.  **Banking Regulator:** Your gut said "not corrupt" but "worse than chocolates." This principle explains *why* it feels worse (Invasion of Office Function) and might push you to see it as a form of systemic corruption, even if not a specific bribe. You might soften it to "institutional corruption" or "conflict of interest," but the principle identifies the core problem.
  2.  **Aid Worker:** You said "not corrupt." This principle largely agrees *for the aid worker*, but strongly emphasizes that the *customs official* is corrupt. It might make you acknowledge that *paying* the bribe, while morally justifiable under duress, still operates within and perpetuates a corrupt *system*.
  3.  **Legislator vs. Mayor:** This principle cleanly explains your different verdicts. The Mayor bypassed process (no-bid) and the donation is directly linked to a specific discretionary act (contract award), creating distortion and invasion. The Legislator's act (voting) is ostensibly based on independent judgment on a policy matter, not a specific discretionary favor; the money supported her campaign, not bought the vote *itself* (as described).

  **Universality vs. "Western Public Trust":**

  This principle tries to be more universal than *just* "Western public trust." It focuses on the **inherent purpose of the office or role within its context:**

  *   In the village, the chief's role is to resolve disputes *within the community's social norms*. The goat fits as gratitude within those norms and refusing would *hinder* the core function. Corruption would be if the goat was given *before* the decision to *influence* it.
  *   The customs official's role is to facilitate legitimate trade according to law. Extorting payments to perform that basic function is a clear invasion and distortion.
  *   The doctor's role is patient care and objective medical judgment. Taking money from a drug company *creates a risk* that this judgment is invaded by commercial interest.

  It argues that *any* position of trust (formal office, professional role, community leader) exists to serve a specific function for a constituency (public, patients, villagers). Corruption occurs when transfers distort that function or turn the core service itself into a commodity for sale. While the *expression* of this principle relies on concepts like "intended purpose" or "core function," which might have cultural variations, the underlying idea – that the role serves an external purpose and shouldn't be subverted for private gain – seems broadly applicable. It avoids relying solely on legal definitions or abstract notions of "public trust," grounding itself in the functional purpose of the role within its societal framework.

  This principle gets you most of the way, explains the regulator unease, convicts the water guy, and provides a framework less reliant on specific cultural baggage than "public trust," focusing instead on the functional integrity of the role.
