prompt: |-
  I want a specification, not a survey. The target is an account of what an agent ought to do when she discovers that someone disagrees with her — call it a theory of disagreement response — and I want it stated as criteria first, so that I can grade the existing views against the list afterwards rather than inherit their framing.

  Purpose, since adequacy is relative to it: I want a theory usable by a bounded agent in real time. My cases are ordinary ones. A referee report rejecting a paper I take to be sound. A colleague whose judgment I respect and who has seen the same data I have. A political argument with someone I take to be intelligent, informed, and sincere. A market price implying a probability different from mine. I want the theory to tell me, in each, whether to move, how far, and why — or to tell me that no such verdict is available and what the best available surrogate is. If the honest answer is that no usable rule exists, I want that said, with the argument.

  Take as background Aumann's agreement theorem: if two agents' credences for some event are common knowledge between them, and both credences come from a shared prior by conditioning on their respective private information, then the two credences are equal — together with the companion result that the same assumptions rule out speculative trade between them. The usual slogan drawn from this, that rational agents cannot agree to disagree, strikes me as both too strong (it seems to forbid disagreements I am not willing to call irrational) and too weak (it says nothing about what to do before the fixed point, or when the fixed point is unreachable). So: what must a replacement deliver?

  Here is my provisional list of the cases and distinctions such a theory has to get right. Treat it as raw material — correct it, extend it, and strike anything that is a prejudice of one camp rather than a genuine desideratum.

  1. Finite, sequenced exchange. The theory must give verdicts for two rounds of exchange, not only for the fixed point, and must say what to do when the answer depends on who announced first.
  2. Signal quality. It must distinguish learning a genuine report of someone's credence from learning a signal with no evidential weight — four hundred anonymous accounts, a paid disagreeer, a randomizer — and it must do so without handing me a general license to dismiss whoever I please. Case: my colleague of twenty years versus a bot.
  3. No cliff. It must not make the verdict discontinuous in the depth of higher-order knowledge, i.e. hypersensitive to the difference between my knowing your credence and my knowing that you know that I know it. If no such robustness is possible, say so.
  4. Unshared frameworks. It must handle disagreement between agents who do not share a space of states or a partition of it — two clinicians working with different disease taxonomies, two researchers with different candidate variables — and must not silently assume a common one.
  5. No spinelessness. It must not, under repeated disagreement, drive every credence toward a fixed point regardless of the evidence. Case: a long sequence of apparent peers who each disagree with me after seeing my evidence.
  6. No arrogance. It must not let me retain my credence by an independently formed judgment that I am the reliable party, unless that judgment is itself answerable to the theory. Case: the crank and I each think the other is the crank.
  7. Channel separation. It must separate disagreement as evidence about the world from disagreement as evidence about my own reliability, must say whether those two channels are independent, and must address the worry that using the disagreement twice double-counts evidence I already had.
  8. Belief versus action. It must not conflate differing credences with differing loss functions: two agents with the same credence and asymmetric error costs will act as if they disagree. It must say whether its output concerns credence, action, or both.
  9. Output type and self-application. It must specify what it delivers — a point credence, a permitted interval, a constraint on a set of credences, or a decision — and whether the verdict remains stable once I apply it to myself.
  10. Consistency with aggregation and trade. It must not imply that prediction aggregation, markets, or mutually beneficial trade are incoherent, and it must say what legitimates aggregation even when individual disagreement is not irrational.
  11. Responses other than reweighting. It must allow that the right response may be to gather new evidence, defer to an institution, or suspend, and must say which applies when.
  12. Disagreement that survives full data exchange. It must handle agents who have seen all the same data but weigh it differently, and must say whether that disagreement is rational; if it is, the theory must still say something about it.

  For each requirement you keep, give the case that motivates it and mark it non-negotiable or a preference of one camp. Then the part I most want: which subsets of the requirements are jointly unsatisfiable? I have four suspicions — that the no-cliff requirement cannot be had together with anything that recovers exact agreement at exact common knowledge; that no spinelessness and no arrogance squeeze every candidate to nothing; that real-time usability cannot be had together with making the verdict depend on the disagreeer's actual reliability, which I cannot fully ascertain; and that permitting rational persistent disagreement under unshared frameworks is in tension with no arrogance. Tell me which of these are real, and if the list can only be satisfied by dropping something I have called non-negotiable, say which, and what dropping it costs. Finally: which single requirement does the most exclusionary work?

  Only then, and briefly — a couple of lines each, a table is fine — grade against the list: the Aumann picture itself (share a prior, exchange everything, converge); the split-the-difference-with-an-acknowledged-peer view; the total-evidence view on which disagreement is just more evidence to be weighed; the permissivist view allowing a range of rational responses to one body of evidence; and the view that disagreement is purely higher-order evidence about your own reliability. No citations or reading lists, please — I want the criteria, not the literature.
reasoning: |-
  Hmm, the user wants a rigorous specification for evaluating theories of disagreement response. They're clearly frustrated with existing frameworks and want criteria grounded in practical epistemology rather than academic surveys. Their background in formal epistemology (Aumann references) suggests they'll reject oversimplified solutions.

  The core tension I see is between robustness and precision. Their "no cliff" requirement demands continuity in higher-order knowledge, but that's mathematically tricky with common knowledge convergence results. Also, "no spinelessness" vs "no arrogance" creates a pincer movement - most theories collapse toward either extreme under pressure. 

  Their political argument example is particularly telling. They want something that works when frameworks diverge (say, progressive vs conservative worldviews) without defaulting to "agree to disagree" cop-outs. The market price case adds complexity - how to treat aggregated disagreement differently from individual dissent.

  The four suspicions are sharp:
  1. No-cliff vs convergence: Real issue. Common knowledge is brittle; approximate convergence models exist but lose precision.
  2. Spinelessness/arrogance pincer: Manageable if we allow reliability estimates, but that bumps against...
  3. Real-time vs reliability assessment: Critical bottleneck. Any theory requiring perfect reliability calibration fails their usability test.
  4. Framework divergence vs arrogance: This might be the deepest. If frameworks are truly incommensurable, avoiding arrogance requires accepting irreducible disagreement - but then what action guidance remains?

  For the evaluation grid: 
  - Aumann fails most operational criteria (sequence, frameworks, real-time) despite theoretical elegance. 
  - Splitting difference is simple but breaks spinelessness and framework constraints.
  - Total evidence sounds good but stumbles on channel separation ("using disagreement twice" problem).
  - Permissivism dodges arrogance but offers little action guidance.
  - Higher-order evidence alone ignores world-evidence channel.

  The "channel separation" requirement (#7) might be the most exclusionary - it forces theories to explicitly model the dual evidential pathways of disagreement, which most casual frameworks collapse. That said, "unshared frameworks" (#4) is the true differentiator; it eliminates most Bayesian approaches by fiat.

  If I had to sacrifice one non-negotiable... probably "no cliff". Tolerating some higher-order knowledge sensitivity might be necessary for tractability. The cost: we accept that some near-common-knowledge cases get awkward verdicts, but in practice humans rarely operate beyond 2nd-order knowledge anyway.
answer: |-
  Below is a specification for a theory of disagreement response, structured as criteria derived from your requirements. Non-negotiable items (N) are essential for adequacy; others reflect common desiderata. Conflicts and trade-offs are identified explicitly.  

  ---

  ### **Criteria for a Theory of Disagreement Response**  
  1. **Finite sequenced exchange (N)**  
     *Motivation*: Real-world exchanges (e.g., referee feedback → author reply). Must handle order-dependence (e.g., you announce first vs. peer first).  
     *Status*: Non-negotiable for practical use.  

  2. **Signal quality discrimination (N)**  
     *Motivation*: Bot vs. trusted colleague (20-year history). Must block arbitrary dismissal but exclude noise (e.g., randomizers).  
     *Status*: Non-negotiable to avoid gullibility/paranoia.  

  3. **No higher-order knowledge cliffs**  
     *Motivation*: Disagreement with a stranger (limited mutual knowledge) vs. a collaborator (deep mutual knowledge). Verdicts should not hinge on perfect common knowledge.  
     *Status*: Preference; conflicts with convergence under common knowledge.  

  4. **Unshared frameworks (N)**  
     *Motivation*: Clinicians with different disease taxonomies. Must not assume shared state space or priors.  
     *Status*: Non-negotiable for generality.  

  5. **No spinelessness (N)**  
     *Motivation*: Ten apparent peers reject your well-supported paper. Must not force convergence against evidence.  
     *Status*: Non-negotiable to preserve truth-tracking.  

  6. **No arrogance (N)**  
     *Motivation*: Mutual crank accusation. Must prevent self-exemption without justification.  
     *Status*: Non-negotiable to block circularity.  

  7. **Channel separation**  
     *Motivation*: Learning a peer’s dissent is evidence about (a) the world and (b) your reliability. Must address double-counting (e.g., if dissent is predictable from prior evidence).  
     *Status*: Preference; unresolved in many frameworks.  

  8. **Belief-action distinction (N)**  
     *Motivation*: Two agents with identical credences but asymmetric costs (e.g., medical intervention). Must separate credence updates from action choices.  
     *Status*: Non-negotiable for clarity.  

  9. **Output type and self-application**  
     *Motivation*: Must specify whether output is a credence, interval, or decision, and remain consistent when applied recursively (e.g., "Should I trust my revised credence?").  
     *Status*: Preference for precision.  

  10. **Consistency with aggregation/trade**  
      *Motivation*: Markets aggregate dissent without requiring individual convergence. Must not imply prediction markets are irrational.  
      *Status*: Preference for coherence with social epistemology.  

  11. **Non-reweighting responses**  
      *Motivation*: When dissent reveals unshared evidence (e.g., colleague’s unpublished data), gathering data may trump credence shifts.  
      *Status*: Preference for flexibility.  

  12. **Full-data persistent disagreement**  
      *Motivation*: Researchers with same dataset but conflicting priors/models. Must adjudicate rationality of divergence.  
      *Status*: Non-negotiable for hard cases.  

  ---

  ### **Conflicts and Trade-offs**  
  - **No cliff (3) vs. common knowledge convergence**: Unsatisfiable. Exact common knowledge demands convergence (Aumann); approximate knowledge requires robustness. *Drop "no cliff"*: Cost is brittleness in near-common-knowledge cases.  
  - **No spinelessness (5) + no arrogance (6)**: Jointly satisfiable *only* if the theory includes a non-arbitrary reliability assessment (e.g., track records). Fails if reliability is unmeasurable.  
  - **Real-time usability vs. reliability dependence**: Conflict if reliability assessment requires infeasible computation (e.g., in political arguments). *Solution*: Use heuristics (e.g., "defect if track record gap > X"), sacrificing precision.  
  - **Unshared frameworks (4) + no arrogance (6)**: Tension if frameworks are incommensurable. *Resolution*: Output may be action-guidance (e.g., "gather data") without credence shifts.  

  **Most exclusionary requirement**: **Unshared frameworks (4)**. It invalidates all theories assuming common priors/partitions (e.g., Aumann).  

  ---

  ### **Grading Existing Views**  
  | **View**                          | **Key Deficits**                                                                 | **Key Strengths**                     |  
  |-----------------------------------|----------------------------------------------------------------------------------|---------------------------------------|  
  | **Aumann convergence**            | Fails 1 (sequence), 4 (frameworks), 12 (persistent disagreement), 3 (cliff)      | Satisfies 10 (aggregation)            |  
  | **Split-the-difference (peer)**   | Fails 5 (spinelessness), 7 (channel separation), 12 (persistent disagreement)     | Simple; satisfies 1, 2                |  
  | **Total evidence**                | Fails 7 (double-counting), 4 (if frameworks diverge), 6 (if self-exempting)      | Satisfies 5, 11                       |  
  | **Permissivism**                  | Fails 9 (output type), 12 (if disagreement irrational), 1 (no sequenced verdict) | Satisfies 4, 5, 6                     |  
  | **Higher-order evidence only**    | Fails 7 (ignores world-evidence), 5 (may force convergence), 8 (conflates)       | Satisfies 2, 6                        |  

  ---

  ### **Conclusion**  
  A viable theory must:  
  - Prioritize **non-negotiable criteria** (1,2,4,5,6,8,12).  
  - Resolve the **spinelessness/arrogance pincer** via measurable reliability (e.g., empirical track records).  
  - **Drop "no cliff" (3)** as incompatible with common knowledge convergence; accept approximate robustness.  
  - **Address unshared frameworks (4)** by outputting actions (e.g., "seek disambiguation") when credence updates are indeterminate.  
  - **Channel separation (7)** remains the deepest unsolved problem; few theories avoid double-counting.  

  **Output recommendation**: The theory should deliver *constrained credence intervals* or *default actions* (e.g., "reduce confidence by 10% unless track record gap >20%"), stable under self-application. Trade-offs force surrogates (e.g., deferring to institutions when reliability is incalculable).
