  My diagnosis is that the core issue is about **evidential standards**. Nativists demand guarantees from proofs, seeing the lack as evidence for innateness. Empiricists accept existence proofs from models, seeing nativist demands as unrealistic. This explains why both sides dig in: their standards define what counts as explanation. 

