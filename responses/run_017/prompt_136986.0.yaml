  | **Disagreement about standards of evidence** | Nativists: Explanation requires guarantees. Empiricists: Existence proofs suffice.                      | Why empiricists dismiss proofs/nativists dismiss models. | No movement; findings satisfy neither standard fully.       | **45%**  |  
  | **Hidden empirical question about input** | Both implicitly disagree on how to measure input informativeness (direct evidence vs. latent cues). | Why empiricists focus on input richness/nativists on absence. | Empiricists demand analysis of indirect cues in (2).        | 20%      |  
  | **Two questions under one label**  | "Innate?" conflates (a) learning mechanism constraints and (b) evolutionary origins of those constraints. | Why replies slide across architecture/genes/domain-specificity. | Nativists cite (5) for (a); empiricists note (b) unaddressed. | 15%      |  
  | **The question is ill-posed**      | "Is it innate?" assumes a binary choice where constraints are always interactional (genes + environment). | Why both sides' arguments seem reductive.    | Debate stalls; progress requires abandoning the question.  | 5%       |  

  **Credence Sum:** 100%.  

  **Recommendation:** Replace "Is it innate?" with "What minimal biases enable learning from attested input, and what is their developmental origin?" This demands testable models of bias emergence and input measurement, sidestepping the proxy war. For Meridian, progress would be: (a) quantifying information-theoretic cues for C in signing, (b) testing if hierarchical bias emerges in non-linguistic learners, and (c) formalizing how much bias is *required* given realistic input.
