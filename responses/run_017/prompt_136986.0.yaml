  ### Diagnosis Table  
  | diagnosis                          | commitments                                                                                                | explains                                     | meridian prediction                                  | credence |  
  |------------------------------------|------------------------------------------------------------------------------------------------------------|----------------------------------------------|------------------------------------------------------|----------|  
