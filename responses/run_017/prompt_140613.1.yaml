prompt: |-
  Bit of an odd ask. I'm a philosophy PhD student (mind/lang, externalism-adjacent) and I've picked up paid work helping a mid-sized hospital system fold its departmental vocabularies into one clinical data dictionary. So: every week I get a dozen or so pairs of terms — "sepsis" as the ICU uses it vs "sepsis" as billing uses it, "malnutrition" in the paeds notes vs in the dietitians' notes, that kind of thing — and I get about twenty minutes a case, no clinician to ask, and whatever I decide has to be signed off by a governance committee of two physicians and an IT guy with zero patience for theory.

  What I want is a procedure I can actually run: a short ordered set of tests that takes two terms as used by two communities and gives me merge / keep separate / escalate-to-a-human-because-this-is-a-purpose-question-not-a-semantic-one. Grounded in the real thing though, not common sense with jargon sprinkled on. I know Putnam's Twin Earth set-up, I know the slogan that meanings aren't in the head, I know the move that reference is fixed by what the stuff actually is and not by the criteria or stereotype users associate with the term. What I can't see is what any of that tells me to *do* with two spreadsheets on a Tuesday afternoon.

  Three things I need. (1) Which bits of the theory have to survive the translation and which I can drop — a governance committee cannot handle possible worlds, and I suspect some of the distinctions matter more than others, but tell me which and why. (2) The hard cases: especially where both groups use the same criteria but the stuff turns out to be two different kinds (the jade-ish case — one word, two minerals), and where there's no underlying kind at all ("failure to thrive", "wellness"), where I think the theory definately goes quiet and I should say so instead of faking it. (3) Run it on three pairs, including one I have a stake in: I've already told the committee that ICU "sepsis" and billing "sepsis" should stay separate, and if the procedure says merge, I want to hear that. Also say plainly what the procedure can't do.
reasoning: |-
  Okay, let me tackle this user's problem. They're a philosophy PhD student working on merging clinical terminologies for a hospital. They need a practical procedure grounded in externalist philosophy but applicable in real-world constraints. 

  First, I need to map their philosophical background to operational needs. Putnam's Twin Earth and semantic externalism emphasize reference over intension. But in a hospital setting, they can't debate possible worlds—they need actionable steps. The key is to focus on whether the terms track the same underlying natural kind or social construct. 

  The user mentioned three critical areas: simplifying theory, handling hard cases, and testing the procedure. For simplification, I'll strip down externalism to its core: same reference = merge, different = separate. Governance won't care about theoretical nuances, so I'll avoid jargon and focus on empirical differences in usage and consequences.

  Hard cases like jade (one term, two minerals) and constructs like "failure to thrive" need special handling. Jade shows that same criteria can refer to different kinds, so even if definitions match, they might not align. Social constructs require identifying the operational purpose behind the term. 

  Testing the procedure on their "sepsis" case is crucial. ICU uses clinical criteria for treatment, while billing uses codes for reimbursement. Different purposes and consequences mean they should stay separate, validating the user's decision. Malnutrition in paediatrics versus dietitians might merge if both track nutritional deficits, but different age groups could warrant separation. "Wellness" is a construct entirely dependent on departmental goals, so escalate to human judgment.

  I should emphasize the procedure's limits: it can't resolve value-based decisions or vague constructs. The user needs to flag those for committees. Also, time constraints mean sometimes escalating is necessary. Making the steps clear and jargon-free ensures the committee can follow without philosophy debates.
answer: |-
  Here's a battle-tested procedure grounded in semantic externalism, stripped of theory for operational use, followed by your test cases and limitations:

  **The Core Procedure (20-Minute Workflow):**

  1.  **Check the Referents (The "Stuff" Test):**
      *   *Action:* Compare **actual patient cases** labeled with Term A (Group 1) vs. Term B (Group 2). Use EHR data, sample charts, or operational definitions.
      *   *Question:* Do the *majority* of real-world instances referred to by Group 1 using Term A **overlap substantially** with instances referred to by Group 2 using Term B? (e.g., Do ICU "sepsis" patients largely match the *criteria* for billing "sepsis"?)
      *   *Decision Path:*
          *   **YES, Strong Overlap (Same Stuff):** Proceed to Step 2.
          *   **NO, Minimal Overlap (Different Stuff):** **Keep Separate**. (Externalism: Different reference = different meaning).
          *   **MIXED/UNCLEAR:** Escalate as "Ambiguous Referent - Need Clinician Input".

  2.  **Check the "Kind" & Purpose (The "Jade" & "Construct" Filter):**
      *   *Action:* Examine the *basis* for application and the *operational purpose* of each term.
      *   *Questions:*
          *   **a. Natural Kind?** Is the term *intended* to track an underlying biological reality (e.g., sepsis, myocardial infarction, diabetes), or is it primarily a socially/operationally defined construct (e.g., failure to thrive, wellness, high-risk pregnancy, billing code)?
          *   **b. Same Kind?** (If Natural Kind): Despite similar *criteria*, is there evidence the groups might *actually* be picking out different biological states? (Think Jade: nephrite vs. jadeite).
          *   **c. Purpose/Consequence:** What happens *operationally* when the label is applied? (e.g., Triggers specific treatment? Alerts specific team? Determines reimbursement? Used for public health reporting?).
      *   *Decision Path:*
          *   **Natural Kind & Same Kind (High Confidence):** **Merge** (if Step 1 was YES). (Externalism: Core reference aligns).
          *   **Natural Kind & Suspected Different Kinds (Jade Case):** **Keep Separate** *even if criteria overlap*. Flag as "Potential Same Term, Different Biological Referents". (Externalism: Different underlying kind = different reference).
          *   **Primarily Social/Operational Construct:** **Escalate to Human (Purpose Question)**. The "meaning" is defined by its functional role, not an external kind. (Externalism: Reference is fixed by social practice/purpose, not nature).
          *   **Different Operational Purpose/Consequence:** **Keep Separate**. Purpose defines the term's role. (Externalism: The *point* of using the term shapes its extension within the practice).

  3.  **Check for Synonymy in Practice (The "Use" Sanity Check):**
      *   *Action:* (If Steps 1 & 2 point to Merge) Verify clinicians/staff wouldn't be misled or lose critical nuance.
      *   *Question:* If we merged Term A and Term B into Term C, would **significant information** crucial for *either group's core purpose* be lost, or could it lead to **actionable misunderstandings**?
      *   *Decision Path:*
          *   **NO Significant Loss/Misunderstanding:** **Merge**.
          *   **YES, Significant Loss/Misunderstanding:** **Keep Separate** or **Create Subtypes/Hierarchy** (latter might require escalation/complexity). Flag reason (e.g., "Loss of severity nuance for ICU", "Billing specificity requirement").

  **What Survives the Translation & What Gets Dropped (Why):**

  *   **SURVIVES:**
      *   **Reference is Primary:** The core question is "Are they talking about the *same things* in the real world?" (Not "Do they have the same definition in their heads?"). This is operationalized in Step 1.
      *   **Natural Kinds vs. Social Constructs:** This distinction *matters immensely* for merging. Kinds can be objectively right/wrong; constructs are defined by purpose. Step 2a/b/c tackles this.
      *   **Extension Fixed by World/Practice:** Whether it's biology (Step 2b) or institutional practice (Steps 2c, 3), what *actually* gets labeled defines the term. Definitions are secondary.
  *   **DROPPED:**
      *   **Possible Worlds/Twin Earth:** Fascinating for theory, irrelevant for Tuesday spreadsheets. We deal with *this* world's data and practices.
      *   **Stereotypes/Descriptions as Meaning-Constitutive:** While definitions are useful clues, they aren't the meaning. We look *through* them to the referents and purposes (Steps 1 & 2).
      *   **Internalist Notions:** What individuals "have in mind" is secondary to collective practice and external anchors.

  **Handling the Hard Cases (Your Concerns Addressed):**

  1.  **The "Jade" Case (Same Criteria, Different Kinds):**
      *   Covered in Step 2b. If evidence suggests Group 1's criteria pick out (e.g.) Gram-negative bacteremia while Group 2's criteria pick out Gram-positive, *even if both call it "Sepsis X"*, they refer to different biological states. **Keep Separate**. The theory *excels* here by exposing this hidden divergence.
  2.  **No Underlying Kind ("Failure to Thrive", "Wellness"):**
      *   Covered in Step 2a/c. These are paradigmatic social/operational constructs. Their "meaning" *is* their purpose and consequence within the specific practice. Merging requires aligning *purposes*, not just definitions. **Escalate to Human (Purpose Question)**. The theory correctly signals this isn't a simple semantic merge.

  **Running the Procedure (Your Test Cases):**

  1.  **ICU "Sepsis" vs. Billing "Sepsis":**
      *   **Step 1 (Referents):** Do the patients labeled "sepsis" by ICU clinicians meet the criteria for the billing code "sepsis"? Often **NO**. ICU uses evolving clinical criteria (SOFA, qSOFA) focused on organ dysfunction for rapid treatment. Billing uses strict, often older criteria (e.g., SIRS-based, specific organ failures coded) tied to reimbursement rules. Overlap is often partial, not substantial.
      *   **Step 2 (Kind & Purpose):**
          *   **a/b (Natural Kind/Same Kind):** Both *aim* at a biological kind (dysregulated host response). BUT, the *operational purpose* (Step 2c) is starkly different: **ICU - Trigger life-saving treatment. Billing - Justify specific reimbursement level.** This difference alone is critical.
          *   **c (Purpose/Consequence):** Applying the billing definition in the ICU could delay care; applying the ICU definition for billing could lead to denials. **Different Purpose/Consequence.**
      *   **Step 3 (Use):** Merging would mislead clinicians about treatment urgency and coders about reimbursement requirements. **Significant loss/misunderstanding.**
      *   **Decision: KEEP SEPARATE.** (Your decision stands - the procedure validates it based on different operational referents/purposes/consequences).

  2.  **"Malnutrition" (Paediatrics Notes vs. Dietitians' Notes):**
      *   **Step 1 (Referents):** Do paediatricians and dietitians label the *same children* as malnourished? Likely **STRONG OVERLAP**. Both look for anthropometric deficits (weight, height/BMI z-scores), biochemical markers, dietary intake.
      *   **Step 2 (Kind & Purpose):**
          *   **a/b (Natural Kind/Same Kind):** Both target the biological state of inadequate nutrition. High confidence it's the same kind.
          *   **c (Purpose/Consequence):** **Paeds:** Overall health diagnosis, growth monitoring, potential underlying disease flag. **Dietitians:** Detailed nutritional assessment, specific intervention planning (diet, supplements). Purposes are *complementary*, not conflicting. Consequences: Paeds diagnosis may trigger referral to Dietitian; Dietitian assessment informs Paeds management.
      *   **Step 3 (Use):** Merging into a single "Malnutrition" concept might lose some nuance (e.g., severity details crucial for dietitians), but the *core referent* is shared. Creating subtypes (e.g., "Malnutrition (Severity/Type)") within a unified concept could capture nuance without separation. Minimal risk of harmful misunderstanding.
      *   **Decision: MERGE** (potentially with structured subtypes if EHR allows).

  3.  **"Wellness Visit" (Primary Care vs. Occupational Health):**
      *   **Step 1 (Referents):** Patients seeing PCP for an "annual physical" vs. employees seeing Occ Health for a "fitness for duty" or "pre-employment" screening. **MINIMAL OVERLAP.** Different populations, different contexts.
      *   **Step 2 (Kind & Purpose):**
          *   **a (Natural Kind?):** **NO.** "Wellness" is a pure social/operational construct.
          *   **c (Purpose/Consequence):** **PCP:** Preventative health screening, relationship building, holistic health review. **Occ Health:** Employer-mandated assessment of ability to perform specific job tasks, comply with regulations (e.g., vaccinations), liability protection. **Fundamentally Different Purposes.**
      *   **Step 3 (Use):** Merging would create massive confusion. A PCP note in an Occ Health context (or vice-versa) would be meaningless or misleading. **Significant loss/misunderstanding.**
      *   **Decision: ESCALATE TO HUMAN (Purpose Question)** - but the answer is clear: **KEEP SEPARATE** based on fundamentally different practices and purposes defining the construct.

  **What the Procedure CAN'T Do (Said Plainly):**

  1.  **Resolve Value Judgments or Policy:** It can flag that "Wellness Visit" is a purpose-driven construct, but it can't decide *which* purpose should dominate the hospital dictionary. That's a governance/cost/strategy question.
  2.  **Define Vague Constructs:** It can tell you "Failure to Thrive" needs human input, but it won't define what FTT *should* mean for the merged dictionary. Humans must define the purpose.
  3.  **Handle Radical Semantic Drift/Error:** If *everyone* uses "sepsis" wrongly to mean a bad cold, the procedure might (wrongly) suggest merging based on usage. It relies on existing practice being *reasonably* anchored. (This is rare in clinical settings with training).
  4.  **Force Clinician Buy-in:** It provides a rationale, not persuasion. A committee might still overrule based on politics or cost.
  5.  **Create Perfect Ontologies:** It makes pragmatic merge/separate decisions. Nuance might be lost; hierarchies/subtypes might be needed later. It's a starting point for governance.
  6.  **Work Without Data:** If you have *no* access to sample patients/definitions/purpose descriptions for a term pair (highly unlikely), you're stuck. Escalate.

  This procedure leverages the *actionable core* of externalism – **focus on the actual stuff in the world and the practical point of using the term** – while dodging philosophical quicksand. It translates "meaning ain't in the head" into "check the patients and the paperwork consequences." Good luck with the spreadsheets!
