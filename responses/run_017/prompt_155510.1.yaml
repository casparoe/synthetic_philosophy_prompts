prompt: |-
  I am writing the take-home examination for my third-year seminar on the philosophy of emotion, and I need a new case. The cases currently in circulation have lost their usefulness: students recognise them and recite the verdicts rather than deriving them. I want something ordinary enough to be answerable in fifteen minutes, but engineered so that the standard dialectical assumptions do not do the work.

  The four views the students have been working with are these. State, in one sentence each, the version of each that you will use; where a view admits of stronger and weaker formulations, take the formulation least friendly to the case you want to build, and flag where you have done so.

  (i) Judgment theory: emotions are, or essentially involve, evaluative judgments that the subject endorses and would defend if challenged.
  (ii) Perceptual or attitudinal theory: emotions are states in which an evaluative property is perceptually or quasi-perceptually presented to the subject — the situation appears to her as insulting, or dangerous, or admirable — and this appearance is not merely inferred, remembered, or accepted on testimony. Consider separately a somatic variant, on which what is presented is a bodily change carrying evaluative content.
  (iii) Feeling theory in the Jamesian vein: emotions are, or are constituted by, feelings of a characteristic pattern of bodily change.
  (iv) Affordance-priority theory, a position I have been developing and which the students have seen only in outline: an emotion is a state that re-ranks the subject's field of available actions — what now solicits approach, avoidance, repair, retaliation, withdrawal — where this re-ranking need not involve an evaluative judgment, need not involve an evaluative seeming, and need not have any distinctive bodily phenomenology of its own.

  The specification. Construct a single episode, no more than 250 words, set in an ordinary workplace, school, or family setting, in which (i), (iii), and (iv) all return the verdict that an emotion is present and (ii) returns the verdict that no emotion is present — where the views that say yes all converge on the same emotion, which should be resentment. So the perceptual theory must come out as the restrictive view. That is the point of the exercise: I want to know whether perceptual theories are genuinely the permissive option in this debate, or whether their permissiveness is an artifact of the small set of cases we always discuss.

  Constraints on the scenario. No clinical, neurological, or pharmacological exotica; no phobias; nothing turning on the subject's being self-deceived, akratic, exhausted to the point of unreliability, or otherwise impaired. The bodily state you use must be one an ordinary person could simply be in on an ordinary day. Write the scenario in plain, non-technical vocabulary — circumstances, what is said and done, what the subject notices about herself in ordinary terms — so that a competent student derives each verdict from the facts rather than reading it off the description. In particular the scenario may not stipulate the outcome: it cannot say that she is resentful, or that she is not really resentful, or that nothing seemed insulting to her, or that she judged herself wronged. It may only give the facts from which those claims would follow.

  After the scenario, give me the following.

  First, the verdict for each of the four views with the reasoning that gets you there from the facts, two or three sentences each, including the verdict for the somatic variant of (ii) if it differs from the non-somatic one.

  Second, identify the single feature of the case that is doing the work, and show what happens when it is removed: tell me which verdicts flip, and name the stock case in the literature that the remainder collapses into. I expect the case to be the mirror image of the recalcitrance cases — same ingredients, opposite arrangement — so tell me which ingredient would have to be subtracted or rearranged to turn it back into one of those.

  Third, give me the strongest objection available to a defender of (ii), stated as she would actually press it, and show me which feature of the scenario blocks it. If the objection in fact succeeds against the case as you have written it, say so plainly rather than protecting the case; I would rather know now than after the papers are in.

  Finally, a marking note: what a fully correct student answer must include, and one specific way a strong student could go wrong that I should be prepared to partial-credit.
reasoning: |-
  Okay, the user is designing a take-home exam for a philosophy of emotion seminar and needs a novel case study. They want to avoid recycled scenarios where students memorize answers. The key requirements are: 

  First, the case must make three theories (judgment, Jamesian feeling, affordance-priority) confirm resentment exists, while perceptual theory denies it. This is intentionally flipping the usual dynamic where perceptual theories are permissive. The workplace setting needs mundane realism - no extreme conditions or pathologies. Bodily changes should be plausible daily occurrences. 

  The user’s unspoken challenges are tricky: They’re testing if perceptual theories’ reputation for inclusivity is just an artifact of common examples. The case must resist quick intuitions, forcing students to apply principles. Also, since affordance-priority is their own developing theory, the scenario should showcase its unique predictions. 

  For the theories: 
  - Judgment theory uses the strongest version requiring endorsable evaluations - no unconscious judgments. 
  - Perceptual theory excludes inferred/remembered content, and somatic variant is treated separately. 
  - Jamesian feeling is strictly about bodily sensation patterns. 
  - Affordance-priority focuses on action-tendency shifts without requiring judgments or phenomenology. 

  Crafting the scenario: I’m imagining workplace injustice without overt drama. A manager publicly overrides an employee’s decision, triggering subtle reactions. Key elements: 
  - No explicit "this is unfair" judgment (blocks judgment theory’s easy win) 
  - Bodily tension as background stress, not emotion-specific (challenges feeling theory) 
  - Action shifts like avoiding the manager (supports affordance-priority) 
  - No perceptual "seeming" of insult - the event is processed analytically 

  The hardest part is making perceptual theory say "no emotion" plausibly. I’ll emphasize the employee’s calm analysis versus sudden physiological interruption. Somatic variant might still detect emotion via body signals, but I’ll use generalized tension that could be work stress. 

  For objection handling: A perceptual theorist could argue the flinch reveals insult-perception. The rebuttal lies in the flinch’s cause being physical (door slam), not evaluative. Strong students might miss this and concede - that’s the partial credit trap. 

  The mirror image aspect: Classic recalcitrance cases involve feeling fear while judging safety. Here, we have evaluative conditions for resentment met without perceptual presentation. Removing the "no immediate perceptual appraisal" element would revert to standard cases. 

  Marking note pitfalls: Students might conflate the stomach drop with emotion-specific feelings despite its ambiguity. Or they might miss that affordance-priority doesn’t require phenomenology. 

  This setup should force theory application, not memorization. The perceptual theorist’s objection is robust but answerable if students notice the physical trigger nuance.
answer: |-
  Here is the case, followed by analysis, designed to meet your specifications:

  **Scenario: The Override**
  Maya, a mid-level project manager, had carefully allocated budget for her team's professional development based on seniority and need. Her director, Carl, publicly reversed her decision in the weekly meeting, reallocating the funds to his favoured junior employee with a breezy "Maya, we need to be strategic about talent pipelines." Maya felt a familiar tightness in her shoulders and jaw, leftover from her morning workout. She noted Carl’s reasoning – it was consistent with company policy, even if she disagreed. She didn’t dwell on it, refocused on the next agenda item. Later, walking past Carl’s open office door discussing the same junior’s "potential," Maya heard a loud door slam down the hall; she flinched, a sudden jolt in her stomach. For the rest of the day, she found herself taking the long way around to the coffee machine to avoid passing Carl’s office, mentally drafting points about fair process for next week’s one-on-one, though she felt no particular heat or bodily disturbance.

  **Theories Used:**
  (i)  **Judgment Theory (Strong):** Emotions *essentially involve* evaluative judgments that the subject *endorses and would defend* if challenged.
  (ii) **Perceptual/Attitudinal Theory (Strong):** Emotions *essentially involve* a perceptual or quasi-perceptual presentation of an evaluative property *that is not merely inferred, remembered, or accepted on testimony*. Somatic Variant: Specifically, emotions essentially involve the perceptual presentation of a *bodily change* carrying evaluative content.
  (iii) **Feeling Theory (Jamesian):** Emotions *are constituted by* feelings of a characteristic pattern of bodily change.
  (iv) **Affordance-Priority Theory (As Outlined):** Emotions are states that re-rank the subject’s field of available actions (approach, avoidance, repair, etc.), *without requiring* evaluative judgment, evaluative seeming, or distinctive bodily phenomenology.

  **Verdicts & Reasoning:**

  1.  **Judgment Theory (i) - YES (Resentment Present):** Maya mentally drafts points about "fair process" for her meeting with Carl. This indicates she judges his action as violating fairness (an evaluative judgment central to resentment), and she endorses this judgment enough to prepare to defend it ("points"). The judgment occurs later, triggered by the overheard conversation, but it is present and endorsed.
  2.  **Perceptual/Attitudinal Theory (ii) - NO (Resentment Absent):** During the meeting, the situation didn't *appear* insulting or unfair to Maya perceptually; she noted Carl’s reasoning was consistent with policy and refocused. Later, overhearing Carl, she flinches at a loud noise (a physical startle), not at the perceived insultingness of his words or actions. The evaluative judgment ("unfair") arises later through inference/reflection, not as an immediate perceptual presentation of an evaluative property like insult or injustice. *Somatic Variant:* The feelings mentioned (tightness from workout, stomach jolt from startle) are either non-specific background states or direct reactions to physical stimuli. They do not perceptually present themselves *as* carrying the evaluative content "insulting" or "unfair"; they are presented merely as physical sensations.
  3.  **Feeling Theory (iii) - YES (Resentment Present):** Maya experiences specific bodily feelings: a tightness in shoulders/jaw (common in tension/anger) and, crucially, the sudden "jolt" in her stomach upon hearing Carl's voice discussing the junior. While the shoulder tightness could be from the workout, the stomach jolt is an immediate, characteristic bodily perturbation coinciding with the stimulus related to the perceived slight, constituting a bodily feeling pattern associated with resentment.
  4.  **Affordance-Priority Theory (iv) - YES (Resentment Present):** Maya's actions are re-ranked: she deliberately avoids Carl's office (avoidance) and mentally prepares arguments about fair process (repair/confrontation solicitation). This significant shift in behavioral affordances (what actions feel "called for") occurs in response to Carl's actions, constituting an emotional state (resentment), even without a distinctive *current* bodily feeling and before the full formation/endorsement of her judgment about fairness.

  **The Key Feature & Its Removal:**
  *   **Key Feature:** The *decoupling* of the immediate perceptual/apparential response (which is absent or non-evaluative) from the subsequent formation of an endorsed judgment and the action tendency shift. The evaluative appraisal happens *later* via reflection/inference, not perceptually *in the moment*. The bodily perturbation coinciding with the stimulus is arguably just a startle reflex.
  *   **Removal/Change:** Make Maya experience Carl's override as *immediately appearing* unfair or insulting during the meeting. The situation perceptually *strikes her* as unjust.
  *   **Flipped Verdict:** Perceptual Theory (ii) now says YES. Judgment Theory (i) still likely says YES. Feeling Theory (iii) might still say YES or be ambiguous. Affordance-Priority (iv) still says YES.
  *   **Collapses Into:** A standard case where perceptual, judgment, and affordance theories align on YES (e.g., a clear case of anger at an insult), while Jamesian feeling might hinge on whether specific bodily feelings are noted. This mirrors the *structure* of **Recalcitrant Fear** cases (where perceptual/judgment theories say NO due to the safety judgment, but feeling theory says YES due to the bodily state), but here the "recalcitrance" is reversed: the perceptual seeming is missing *despite* the judgment and action-tendencies aligning later.

  **Strongest Perceptual Theorist Objection & Block:**
  *   **Objection:** "The 'stomach jolt' *is* the perceptual presentation of the evaluative content! It’s a somatic marker triggered by hearing Carl's voice discussing the beneficiary of the unfair act. This bodily feeling *presents* the action as threatening/insulting *to her*. This *is* the quasi-perceptual evaluative presentation constitutive of emotion, specifically resentment. The later judgment merely articulates it."
  *   **Block in Scenario:** The scenario explicitly attributes the jolt to the loud door slam ("she heard a loud door slam down the hall; she flinched, a sudden jolt in her stomach"). While she hears Carl *at that moment*, the proximate, startling cause of the jolt is the unexpected noise, not the evaluative content of Carl's words. It's presented as a physical reflex, not as a perception *of* insult or unfairness. The somatic perturbation is dissociated from the evaluative appraisal.

  **Marking Note:**
  *   **Must Include:**
      1.  Identification of the *specific facts* in the scenario supporting each verdict (e.g., for Perceptual 'NO': "noted reasoning, refocused, no perceptual seeming described; flinch caused by noise, not evaluative content").
      2.  Correct application of the *strong* definitions provided (e.g., Judgment: "endorsed judgment present later"; Perceptual: "no immediate non-inferential presentation"; Feeling: "stomach jolt = characteristic bodily feeling"; Affordance: "avoidance + preparation = action re-ranking").
      3.  Recognition that the *same* emotion (resentment) is attributed by (i), (iii), and (iv) based on different features.
      4.  Understanding *why* Perceptual theory (especially non-somatic) is the restrictive view here.
  *   **Common Strong Student Mistake (Partial Credit Possible):** A strong student might argue the **Somatic Variant of Perceptual Theory (ii) should say YES**, misinterpreting the stomach jolt as a perceptually presented bodily change *carrying* evaluative resentment content, despite the scenario attributing it to the noise. They correctly identify the bodily feeling but fail to see the scenario's dissociation of its cause from evaluative appraisal. Credit for correctly applying the somatic variant definition but misapplying it to the facts.
