answer: |-
  ### Joint Statement: Microfoundations and System-Level Properties in Social Explanations

  **Introduction**  
  This document represents a good-faith adversarial collaboration between two camps in our team: the "micro-only" camp, which holds that explanations of group-level phenomena must be reducible to individual states (beliefs, incentives, resources) and local interactions, and the "system-level" camp, which holds that some system-level properties (e.g., market liquidity, institutional legitimacy, segregation patterns) are irreducible and causally efficacious. After two years of debate, we converge on key points below, clarify disagreements, and propose tests to resolve them. We anchor all claims to our concrete case: a residential-segregation model where agents have a mild preference not to be in a small local minority (e.g., a Schelling-style model). We also incorporate simulation-based tests (swap, replay, and ablation) that allow us to manipulate variables impractical in field research.

  #### 1. Agreed Claims
  Both camps accept the following based on simulations of the residential-segregation model and general principles:

  1. **Model-Specific Mechanisms**: In the segregation model, global patterns (e.g., high segregation indices) emerge from individual agents' preferences (e.g., a tolerance threshold for neighborhood diversity) and local interactions (e.g., agents moving based on immediate neighbors' states). No global pattern is explicitly programmed.

  2. **Swap Tests**: Holding individual decision rules fixed and swapping only the interaction topology (e.g., grid vs. small-world network) can produce different macro outcomes (e.g., segregation levels). Conversely, holding topology fixed and swapping only decision rules (e.g., varying tolerance thresholds) can alter macro patterns. These tests demonstrate that interaction structures and rule distributions are key inputs.

  3. **Replay Tests**: Replaying a simulation with a single agent's state perturbed (e.g., changing one agent's location) and measuring trajectory divergence (e.g., via Hamming distance) can reveal sensitivity to initial conditions. However, divergence is often minimal, indicating robustness at the macro level to micro perturbations—e.g., one agent's move rarely alters overall segregation.

  4. **Ablation Tests**: For predicting macro properties (e.g., future segregation), a predictor using only individual states and local interactions (e.g., agent locations and neighbor states) can be compared to one using macro-state inputs (e.g., current segregation index). If the macro-augmented predictor outperforms, it shows informational value but not necessarily causal independence. Both camps agree such tests quantify predictive utility but not reduction.

  5. **Utility of Macro Descriptions**: Terms like "market liquidity" or "segregation pattern" are pragmatically useful for prediction and intervention, similar to database indexes. They compress micro-level data, enabling efficient reasoning.

  6. **Formal Distinction**: The evolution of the system is computable from individual states, interaction structures, and update rules. Whether it *must* include a macro-state term is a measurable formal question (via ablation tests).

  #### 2. Disagreements Table
  The table below lists core disputes, each camp's position, a judgment on whether the disagreement is verbal (arising from terminology) or substantive (factual), and the crux it hinges on. All rows reference the segregation model or simulations.

  | Disputed Claim | Micro-Only Camp Position | System-Level Camp Position | Judgment | Crux |
  |----------------|---------------------------|-----------------------------|----------|------|
  | What constitutes an explanation of a group-level phenomenon? | A claim is explanatory only if it can be reduced to individual states (e.g., agent beliefs) and local interactions (e.g., pairwise agent moves). Macro terms are descriptive conveniences. | A claim is explanatory if it references system-level properties (e.g., segregation index) that are irreducible and causally efficacious. Reduction loses explanatory power for why patterns persist or change. | Verbal | Whether "explanation" requires revealing generating mechanisms (micro) or can be a predictive summary (system-level). |
  | Do system-level properties have independent causal power? | No. Causal power resides solely in individuals and their interactions. For example, segregation changes are fully explained by agents' moves based on local neighborhoods. | Yes. The same individuals, with identical rules, behave differently under different system states (e.g., high vs. low segregation), and these states exert causal influence—e.g., a tipping point causes accelerated segregation. | Substantive | Whether the system's evolution function requires a macro-state term to predict behavior accurately. |
  | Are all macro predicates reducible to micro predicates? | Yes, in principle. Macro properties (e.g., "neighborhood segregation") are shorthand for complex micro states and pairwise relations, even if impractical to compute. | No. Some macro properties (e.g., institutional legitimacy) are emergent and irreducible; they cannot be expressed as a function of individual states and local interactions alone. | Substantive | Whether there exist macro properties not computable from micro inputs without loss of generality in key cases like path-dependent segregation. |

  #### 3. Cruxes, Tests, and Predictions
  For each substantive crux above, we outline a test or formal case, predictions from each camp, and what each would accept as evidence against their view. Tests use our segregation model simulations, with individual rules fixed (tolerance threshold = 30% minority preference), unless noted.

  **Crux 1: Whether the system's evolution function requires a macro-state term to predict behavior accurately.**  
  - **Test**: Ablation test for prediction. Train two predictors on simulation data:  
    - Predictor A: Uses only micro inputs (individual agent states + local interactions, e.g., agent locations and immediate neighbor counts).  
    - Predictor B: Uses micro inputs + macro-state inputs (e.g., global segregation index).  
    Task: Predict next-step agent moves or future segregation index. Metric: Mean squared error (MSE) over multiple runs.  
    Controlled: Unlimited data/compute; identical initial conditions.  
  - **Micro-only prediction**: In the segregation model, Predictor B will not outperform Predictor A, as agents only use local information. MSE difference will be negligible (≤ 1%).  
  - **System-level prediction**: Predictor B will outperform Predictor A (MSE reduction ≥ 5%) because macro state (e.g., segregation level) correlates with system-wide stability, affecting move probabilities non-locally.  
  - **Evidence against micro-only**: If Predictor B significantly outperforms Predictor A in varied topologies (e.g., grids with different densities).  
  - **Evidence against system-level**: If Predictor B shows no improvement, or if the gain is due to overfitting (e.g., vanishes with cross-validation).  

  **Crux 2: Whether there exist macro properties not computable from micro inputs without loss in path-dependent cases.**  
  - **Test**: Replay test with history dependence. Run two segregation simulations from identical micro states but different institutional histories (e.g., one pre-segregated, one mixed). Perturb an agent identically in both and measure macro-outcome divergence (e.g., segregation index at t+10).  
  - **Micro-only prediction**: Divergence will be minimal; history is encoded in current micro state (e.g., agent positions), so outcomes will converge. Path dependence reduces to initial conditions.  
  - **System-level prediction**: Divergence will be significant; history creates system-level constraints (e.g., "segregation momentum") not captured by current micro state, causing different trajectories.  
  - **Evidence against micro-only**: Large divergence (>10% in segregation index) that correlates with history, not local states.  
  - **Evidence against system-level**: Divergence is small and explainable by local factors (e.g., perturbed agent's neighborhood).  

  **For verbal crux (nature of explanation)**: No test is proposed, as it hinges on defining "explanation." Both camps agree to disambiguate: "Explanatory" in mechanism-generating sense (micro-only) vs. predictive-interventional sense (system-level). In practice, our tests focus on the substantive aspects.

  #### 4. Closing Note on Progress
  Progress here requires resolving the substantive cruxes via simulation tests. If ablation tests (Crux 1) show macro inputs improve prediction, it would challenge micro-only reductionism; if not, it would undermine claims of causal efficacy. Replay tests (Crux 2) can clarify reducibility in path-dependent scenarios. However, part of the dispute may be ill-posed: "Causal power" is conflated with "predictive utility," and system-level properties may supervene on micro states while having emergent effects. We should not expect full convergence if camps prioritize different explanatory goals (mechanism vs. intervention). A productive path is to run these tests, then refine definitions based on results. If tests are inconclusive, we may need new models incorporating institutional feedback (e.g., agents reacting to global segregation), but this should be evidence-driven, not ideological.

  \answer{Ablation test: macro inputs improve prediction yes/no}
