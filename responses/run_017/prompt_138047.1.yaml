prompt: |-
  I have been thinking about evolutionary debunking arguments and I have noticed that my reactions to them are wildly uneven in a way I cannot account for. I would like to know whether there is a principle behind the pattern. My own guess is that there is no principle that saves all of my reactions, and I would rather be told that than be humored.

  Below are seven cases. In each one, imagine that we had a well-confirmed account of the causal origins of one of my beliefs: an evolutionary story, or a story about gene-culture coevolution, of the ordinary ambitious kind. The question I am asking in each case is only whether acquiring that story lowers my confidence in the belief, and by how much.

  1. That I have special obligations to my own children. Verdict: not moved at all. If anything the story steadies me, because it tells me the machinery behind the belief is reliable in the way a device for keeping parents invested in dependents should be.

  2. That incest between adult siblings is wrong. Verdict: moved, and this is the case that bothers me. Suppose the mechanism is an aversion wired up in response to childhood co-residence rather than to shared genes. Then I notice that I am much more confident about co-reared step-siblings, where there is no genetic risk whatever, than about full siblings separated at birth who meet as adults, where all the genetic risk is. That is backwards if what I am tracking is a reason, and exactly right if what I am tracking is the trigger of the mechanism. So my verdicts inside this case look like the output of the very mechanism being debunked. I still do not want to say the conduct is permissible; what I want to say is weaker, something like: my confidence was never really about the reasons.

  3. That promise-breaking and free riding are wrong and warrant sanction. Verdict: unmoved. Here the causal story appears to run through the very feature in virtue of which the judgment would be true, since there really are gains from cooperation that a free rider takes while contributing nothing. The causal story and the justifying story seem to be, in part, the same story.

  4. That my own pain is bad. Verdict: unmoved, but I cannot say why in the way I could in case 3. The story cites a fact, roughly that pain hurts and that creatures who are hurting avoid it, which seems to be the badness itself rather than a reason for it. Cases 2 and 4 feel to me like the same shape, and I react to them in opposite ways.

  5. That modus ponens is valid and that small-number arithmetic is true. Verdict: unmoved. I have encountered the companion-in-guilt reply and I believe it: if these arguments worked merely by showing that a belief has causal origins independent of its truth, they would consume logic and mathematics as well, and I do not think they do. But I am not certain what the relevant difference is supposed to be.

  6. That all persons have equal moral standing, and that I owe real concern to distant strangers. Verdict: I lose my footing here. A debunking story is available, involving misfire, over-extension of a parochial instinct, or prestige-biased transmission of an egalitarian norm, but it is far more speculative than the stories in cases 1 through 3. What I notice is that the thinness of the story makes me more confident, and not merely leaves me where I was. A friend says this is straightforwardly a mistake, that a failed or half-built debunking argument confers no positive support, and I suspect she is right, but I cannot say what principle makes it a mistake.

  7. That the honor of the group must be avenged, carried as I carry it, as a claim about how things really are. Verdict: mixed in a way I find hard to state. The practice seems to have a rationale available to it, since credible retaliation deters aggression. But the rationale attaches to the practice and not to the content of what people believe when they avenge, so I want to say the belief is debunked while the practice is not, and I am unsure that is a coherent thing to say.

  My tentative principle, which I have been testing against these: an evolutionary explanation of a belief undermines that belief if and only if the explanation does not run through the very feature in virtue of which the belief would be true; where it does run through that feature, the explanation is inert or else mildly confirming.

  That handles cases 1 and 3. It misfires on case 4, where nothing that looks like a truth-maker is cited and I am nonetheless unmoved. It is indeterminate on case 5, since I do not know whether logic and arithmetic have truth-makers for a story to cite. It says nothing useful about case 2, where the interesting thing is not whether the story cites a truth-maker but that the mechanism's trigger has come apart from the property my judgment is about. And it is silent on case 6, where the variable is not whether the story is true but how speculative it is.

  What I would like from you:

  A principle, or two or three competing principles, stated precisely enough that I could apply one to a case you have not seen, with the case that motivates each clause.

  What your principle says about cases I have not listed. Two matter to me especially. First, a belief whose debunking story cites a proxy that was reliably correlated with the truth-maker in the ancestral environment but has since come apart from it, so that the mechanism was once a tracker and no longer is. Second, whether the unevenness across cases 1 through 5 is best read as evidence about the beliefs themselves or as evidence about me.

  Which of my verdicts your principle cannot accommodate, and which single verdict you would overturn if you had to give one up.

  On confidence: please mark which parts of your answer you would actually defend and which you would hold loosely, tell me how confident I should be that there is any unifying principle here at all, and say where a reasonable person who shared my verdicts would still come out somewhere else. And if you think I have set the question up badly, say so plainly rather than answering politely. In particular, tell me if degrees of undermining do not come in the kinds I am helping myself to, if the difference between case 2 and case 4 is not one that any principle of the sort I am asking for could register, or if reading a principle off gut reactions to cases is simply the wrong method for this subject.
reasoning: |-
  Okay, let me unpack this user's query. They're grappling with evolutionary debunking arguments (EDAs) and notice inconsistent reactions across different belief types. Their core frustration is the lack of a clear principle explaining why some beliefs feel debunked while others don't. 

  First, I need to map their seven cases:
  - Parental obligations (unmoved)
  - Incest taboo (moved, causing tension)
  - Promise-keeping (unmoved)
  - Pain's badness (unmoved but unexplained)
  - Logic/math (unmoved via companion-in-guilt)
  - Moral universalism (unstable confidence)
  - Honor vengeance (mixed feelings)

  Their proposed principle (explanations undermine unless they "run through the truth-maker") works for cases 1/3 but fails elsewhere. The pain case (4) is particularly telling—it lacks a clear truth-maker link yet feels immune to debunking. 

  Hmm... the incest case (2) reveals something deeper: it's not just about truth-makers but about judgment calibration. When the evolved trigger (co-residence) decouples from the purported reason (genetic risk), confidence crumbles. That suggests a second axis: whether the belief-forming mechanism tracks the property it claims to represent. 

  For case 6, their reaction seems meta-cognitive—speculative debunking attempts backfire, making the belief feel more robust. But as their friend notes, this might confuse "not debunked" with "confirmed." 

  The vengeance case (7) exposes a belief-practice rift. The practice has functional rationale (deterrence), but the belief in "honor" as objective property may be illusory. 

  So three candidate principles emerge:
  1. **Truth-Tracking**: Does the causal chain reference the actual truth-maker? (Saves cases 1/3)
  2. **Calibration**: Does the mechanism reliably map onto the represented property? (Saves case 2/4/7)
  3. **Robustness**: Does alternative grounding survive the debunking? (Saves case 5/6)

  Pain (case 4) is the litmus test. If pain's badness is phenomenologically self-justifying, no external truth-maker is needed—the calibration principle handles this because the mechanism (pain-avoidance) just is the manifestation of the property. 

  For new cases: 
  - A proxy tracker (e.g., "rustling grass = predators") would be debunked if modern contexts decouple the proxy from danger, per calibration principle. 
  - The unevenness likely reflects both belief properties (e.g., mathematical beliefs resist EDAs by nature) and personal epistemic commitments. 

  I'd overturn their case 6 reaction—speculative debunking failures shouldn't boost confidence. The tension in case 2 is warranted: the incest belief *is* partially debunked as tracking non-moral properties. 

  Methodologically, gut reactions aren't useless—they flag epistemic fault lines—but refining principles requires pressure-testing against hypotheticals. Degrees of undermining *do* vary, but the core issue is whether debunking severs justification from truth.
answer: |-
  Your query reveals deep engagement with evolutionary debunking arguments (EDAs) and a commendable willingness to confront inconsistencies. Below, I propose a unified principle, test it against your cases, address your requests, and flag limitations. I defend the core framework but hold specifics loosely—your intuitions expose genuine philosophical tensions.

  ---

  ### **Proposed Principle: The Calibrated Tracking Account**
  A belief is undermined by an evolutionary causal explanation iff:  
  **(i)** The explanation shows the belief-forming mechanism *did not evolve to track the property cited in the belief's content*, **and**  
  **(ii)** No *independent justification* (e.g., conceptual, rational, or empirical) renders the belief robust to the explanatory disconnect.

  #### **Motivation & Key Concepts**  
  - **Tracking**: The mechanism must be sensitive to the *actual property* the belief is about (e.g., "obligations" in case 1, "wrongness" in case 2).  
  - **Calibration**: Whether the mechanism is *reliably aligned* with the property in relevant contexts (past/present).  
  - **Independent justification**: Salvage paths (e.g., pain's phenomenology, logic's necessity) that persist even if evolution didn't "aim" at truth.  

  This handles cases where truth-makers are cited *or* bypassed (resolving your case 4 puzzle) and explains why speculative stories (case 6) fail to debunk.

  ---

  ### **Application to Your Cases**  
  | Case | Your Verdict | Principle's Verdict | Analysis |  
  |------|--------------|---------------------|----------|  
  | 1. Parental obligations | Unmoved | **Unmoved** | Mechanism tracks *actual caregiving demands* (truth-maker). Independent justification: moral reasoning. |  
  | 2. Incest wrongness | Moved | **Moved** | Mechanism tracks *co-residence* (a proxy), not moral wrongness. No independent justification when proxy/truth decouple (e.g., separated siblings). |  
  | 3. Promise-breaking wrong | Unmoved | **Unmoved** | Mechanism tracks *cooperation gains* (truth-maker). Independent justification: game theory/ethics. |  
  | 4. Pain's badness | Unmoved | **Unmoved** | Mechanism *is identical* to the property: pain *constitutes* badness phenomenologically. No "tracking" needed; belief is self-justifying. |  
  | 5. Logic/arithmetic | Unmoved | **Unmoved** | Independent justification: necessary truths knowable a priori. Evolution may explain access, not content. |  
  | 6. Moral universalism | Unstable | **Unmoved** (if story speculative) | *Speculative* stories fail (i): no proof mechanism ignores moral truth. Independent justifications (e.g., impartial reasoning) remain. |  
  | 7. Honor vengeance | Mixed | **Debunked belief, justified practice** | Belief: mechanism tracks tribal status (not "objective honor"). Practice: independent justification via deterrence. Coherent to split them. |  

  #### **Resolving Anomalies**  
  - **Case 2 vs. Case 4 (your "same shape" puzzle)**:  
    - Incest: Mechanism tracks a *proxy* (co-residence), not the property (genetic risk/wrongness).  
    - Pain: Mechanism *instantiates* the property (badness). No proxy = no debunking.  
  - **Case 6's Speculative Story**: Weak stories fail condition (i). Your boosted confidence *is* mistaken: absence of debunking ≠ confirmation. Principle agrees with your friend.  

  ---

  ### **New Cases & Your Tentative Principle**  
  1. **Proxy Tracker (e.g., "Rustling grass = predators")**:  
     - Ancestral reliability: High (correlated with danger).  
     - Modern decoupling: Rustling now = wind, not predators.  
     - **Verdict**: Debunked. Mechanism tracked a *proxy*, not danger itself. Your principle handles this (no truth-maker cited).  
     - *Calibrated Tracking adds*: Independent justification (e.g., evidence of actual danger) could salvage belief.  

  2. **Unevenness Across Cases 1–5**:  
     - Evidence about *belief types*, not just you. Pain (4) and logic (5) are intrinsically robust; incest (2) is contingent on alignment. Your reactions track this.  
     - Your tentative principle fails case 4 because it demands a "feature" for the story to "run through," but pain requires no external truth-maker.  

  ---

  ### **What the Principle Cannot Accommodate**  
  - **Your case 6 confidence boost**: The principle diagnoses it as irrational (speculative failure ≠ support), but doesn't *explain* your psychology. A supplemental point: Thin debunking attempts may trigger **belief polarization** (defensive strengthening when threats feel weak).  
  - **Case 2's lingering discomfort**: The principle endorses your loss of confidence—yet you resist permissibility. This is consistent: debunking removes *epistemic justification*, not necessarily moral truth. You may retain non-cognitive commitment (e.g., emotion).  

  #### **One Verdict to Overturn**  
  I'd overturn **case 6's boosted confidence**. Speculative EDAs lack force but confer no positive status—this is a cognitive bias. A reasonable person sharing your intuitions might still feel steadied here, mistaking resilience for vindication.

  ---

  ### **Confidence Assessment**  
  | Element | My Confidence | Notes |  
  |---------|---------------|-------|  
  | **Core principle** | High (defend) | Best explains tracking/justification split across domains. |  
  | **Pain case (4)** | High (defend) | Mechanism-property identity blocks debunking. |  
  | **Proxy cases** | Medium (hold loosely) | Depends on "independent justification" scope (e.g., moral realism vs. antirealism). |  
  | **Unifying principle exists?** | Medium-High | Patterns reflect belief metaphysics (necessary/contingent, subjective/objective). |  
  | **Methodology** | Medium | Gut reactions signal epistemic fault lines, but principles need stress-testing with hypotheticals. |  

  **Where a reasonable person might diverge**:  
  - A moral antirealist could debunk all normative beliefs (cases 1–3,6–7) since no "truth" to track.  
  - A naturalist might reject case 4’s immunity, arguing pain’s "badness" is illusory if evolution favored it.  

  **Caveats**:  
  - **Degrees of undermining**: Your spectrum (moved/unmoved) is valid. EDAs vary in strength (e.g., proxy misalignment vs. total disconnect).  
  - **Case 2 vs. 4 difference**: Registrable by principles focusing on *property-mechanism relations* (as above).  
  - **Method**: Gut reactions are data, not arbiters. Refine the principle by:  
    - Testing edge cases (e.g., aesthetic beliefs).  
    - Distinguishing *evolutionary role* (selected for truth-tracking?) from *current reliability*.  

  **Final View**: Your reactions are largely defensible. Case 2’s discomfort reflects genuine belief fragility; case 4’s steadfastness is sound. The unevenness stems from how tightly beliefs tether to evolutionarily inert truths. If this clarifies the pattern, I’ve succeeded. If not, I welcome pressure points.
