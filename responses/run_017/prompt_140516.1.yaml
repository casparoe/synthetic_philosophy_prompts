prompt: |-
  Im a PhD student and I've been handed one fifty-minute section next week in our intro Philosophy and Law course — first-years, about a third of them pre-law and the rest there to fill a requirement, whiteboard only, no handouts because the department printer is dead again. The topic is causation by omission: whether someone's failure to do something can be a cause of something happening. Please don't explain the topic to me; tell me how to explain it. What I keep going back and forth on is the order, because my sense is that before the question even means anything to them I have to seperate "did she cause it" from "is she to blame" — the pre-law kids have half-remembered duty and proximate cause from somewhere and will answer a causal question with a responsibility verdict all section if I let them — and also that they need causal claims to be contrastive or interest-relative (why did *these* plants die and not *those*) before an absence can even look like a possible answer. But I can't tell whether those are genuine prerequisites or whether I'm front-loading metaphysics that should come in later, and I'm not sure whether to present the "an omission only counts as a cause against a normative background" line as the live option it is or to hold it back so it doesn't swallow the whole discussion on contact.

  The example is the other thing I'm stuck on. My first thought was the obvious one — a lifeguard who's on her phone and doesn't notice a kid struggling — but it feels saturated with obligation, so I made up a pair instead: two identical greenhouses on the same street, same plants, both need daily watering. Sam is going away and asks her neighbour Priya to water; Priya says yes and then just forgets, all week. In the other greenhouse nobody was ever asked and nobody watered. Same deaths, same absence of water, one has a promise in it and one doesn't. Is that the right thing to carry the whole fifty minutes, or is it still smuggling in a norm when the question is supposed to be about causation? Either way, tell me what the carrying example has to have and what it has to lack. Then there's a case I want to use late: two people each promise Sam they'll water, each assumes the other did, neither does — now the but-for test says neither one caused it. I want that at the end, as a general worry about overdetermination that also afflicts perfectly ordinary actions, but I'm worried it detonates everything I just built, so tell me where it goes and how to frame it so it doesn't.

  The misconceptions I'm braced for: "an omission is nothing, and nothing can't do anything"; "if forgetting can be a cause then everyone who ever failed to water those plants caused their death, up to and including the Queen"; "causation needs a mechanism, a physical connection or a transfer of energy, so an absence can't qualify"; and the sharp one, that the only reason Priya looks like a cause is that she was supposed to water, so really it's blame dressed up as causation. For each, tell me where exactly in the sequence I should head it off and what has to already be on the board for the defusal to work. And give me one question to ask in the last five minutes that would show me whether they'd actually got the idea rather than just learned to say "omission" — plus what I should openly announce I'm not going to settle at this level and why.
reasoning: |-
  Okay, the user is a PhD student preparing a fifty-minute intro Philosophy and Law class on causation by omission. They need help structuring the lesson, choosing examples, and addressing misconceptions. Let me start by understanding their main concerns.

  First, they want to separate causation from blame, especially since pre-law students might conflate the two. They’re considering whether to introduce contrastive causal claims early. Also, they’re unsure about using a normative example like the lifeguard or their greenhouse scenario with Priya. They have another case where two people promise but neither waters, causing overdetermination, and they’re worried it might undermine previous points.

  Their misconceptions include: omissions as nothing can't cause anything, over-inclusion (everyone caused the death), lack of physical mechanism, and the idea that causation here is just blame in disguise. They need strategies to preempt these.

  I should structure the session step-by-step. Start with an intuitive example to hook them. Use the greenhouse scenario without promises first to isolate causation. Then introduce the promise to show how norms affect responsibility, not causation. Address misconceptions as they arise. For instance, when discussing the first greenhouse, tackle the "omission is nothing" point by comparing it to other absences like lack of oxygen. Use the contrastive approach early to show why we focus on specific omissions.

  The overdetermination case should come later, framed as a puzzle that applies to actions too, not just omissions. This shows the issue isn't unique. End with a question testing their understanding, like modifying the greenhouse example to see if they can distinguish causation from blame.

  Need to emphasize that causation is interest-relative and contrastive. Highlight that norms affect responsibility, not causation itself. Acknowledge that the debate exists but keep the focus on the conceptual separation for this session. Make sure examples are clear and misconceptions are addressed in the flow of the lesson where they naturally arise.
answer: |-
  Here's a battle-tested structure leveraging your insights and concerns, designed for 50 minutes with whiteboard-only and first-years. The key is **sequential scaffolding** and **strategic example deployment** to separate causation from blame, build contrastive thinking, and contain normative creep.

  **Core Structure & Flow (50 Min):**

  1.  **Hook & Contrastive Foundation (10 min):**
      *   **Start Simple:** "Why did *THESE* specific plants in Greenhouse A die last week, while those in Greenhouse B (same species, same conditions) are fine?" (Write on board: Greenhouse A: Dead | Greenhouse B: Alive).
      *   **Brainstorm Causes:** Students shout out: "No water!", "Heatwave?", "Disease?".
      *   **Focus on Absence:** Guide them: "Assume soil tests show no disease. Weather was identical for both. The *only* difference we find? Greenhouse A got no water all week. Greenhouse B got watered daily." (Update board: *Difference: Watering*).
      *   **Contrastive Claim:** "So, why did *A's* plants die *and not B's*? The absence of watering *for A* seems to make the difference." Introduce term: **Causation by Omission**.
      *   **Head Off "Nothingness":** *Right here* ask: "But wait, 'no watering' is... nothing happening! Can *nothing* cause something? What about the Queen? She didn't water them either!" Use this to introduce **contrastive relativity**: "We're asking why *these* died *compared to those*. The Queen wasn't part of the situation *we're contrasting against* (Greenhouse B *was* watered by *someone*). We're focused on the *relevant difference*." (Board: Key Idea 1: **Causal claims are contrastive** - Why *this* outcome vs. *that* alternative?).

  2.  **Introduce Normative Element - Separating Blame (15 min):**
      *   **Introduce Priya:** "Now, let's add detail. Sam owns Greenhouse A. Before leaving, they *asked Priya*, their neighbour, to water it. Priya *said yes*. Priya then forgot all week." (Board: Priya: Agreed + Forgot).
      *   **Introduce Control Greenhouse:** "Greenhouse C is identical, same street. Sam didn't ask *anyone* to water it. Nobody watered it. Plants died." (Board: Greenhouse C: Dead | No agreement).
      *   **The Crucial Question (Causation First):** "Focus ONLY on causation right now. Did the *absence of watering* cause the plants to die in *both* Greenhouse A and Greenhouse C?" (Target Answer: Yes, same as step 1).
      *   **The Normative Question:** "Now, is there a difference between Priya (A) and the situation with Greenhouse C regarding *responsibility* or *blame*? Why?" Elicit: Promise, agreement, expectation. (Board: Key Idea 2: **Causation ≠ Blame/Responsibility**. Blame depends on duties, promises, norms).
      *   **Why this Works:** The *causal* claim (absence of water caused death) is identical for A and C. The *normative* element (promise) explains why Priya might be *blamed* for the death caused by the omission, while the lack of watering in C is causally identical but lacks grounds for blame. This cleanly separates the concepts.

  3.  **Deepening Causation & Countering Misconceptions (15 min):**
      *   **"Mechanism" Challenge:** Pre-empt: "Someone might object: 'Causation needs a physical push, energy transfer! No watering is just... nothing. How can *nothing* transfer energy?'"
          *   **Counter:** "Is 'lack of oxygen' causing suffocation fundamentally different? We readily accept that absence *can* be causal in many contexts (no spark caused engine failure, lack of food caused starvation). The 'mechanism' here is the *failure of a sustaining process* necessary for the outcome. Water sustains plants; absence fails to sustain." (Board: Key Idea 3: **Absences cause via failure of sustaining/preventative processes**).
      *   **"Over-Inclusion" Challenge:** Pre-empt: "If Priya's omission caused it, did *everyone* who didn't water cause it? The Queen? Me?"
          *   **Counter:** Bring back **Contrastive Relativity**: "Remember our question: Why did *A's* plants die *vs. B's*? Priya's omission is *salient* because she was the *expected source* of the watering *in that specific scenario*. The Queen wasn't part of the expected chain *for Greenhouse A*. We aren't asking why the plants died instead of *every possible alternative* involving the Queen watering; that's a different contrast." (Reinforce Key Idea 1).
      *   **"Blame Disguised" Challenge:** Pre-empt: "Isn't Priya only a 'cause' *because* she promised? Isn't this just blame sneaking in?"
          *   **Counter:** Point back to Greenhouse C. "The plants in C died *because* of the absence of water. Is *that* causal claim dependent on blame? No. The causal fact is the same for A and C. Priya's promise makes her omission *salient* for the contrast (A vs. B) *and* grounds her blameworthiness, but it doesn't *create* the causal link between the absence and the death. The absence itself is the cause." (Reinforce Key Idea 2).

  4.  **The Overdetermination Puzzle & Nuance (7 min):**
      *   **Introduce the Case:** "Okay, trickier one. Sam asks *both* Priya *and* Alex to water Greenhouse A. Each assumes the other will do it. *Neither* waters. Plants die."
      *   **But-For Test Issue:** "The standard 'but-for' test (but for X, would Y have happened?) seems to fail for *each* omission. But for Priya's omission? If Alex had watered, they'd be alive. So Priya wasn't necessary? Same for Alex."
      *   **Reframe the Puzzle:** "This *is* a problem! But crucially, **it's not unique to omissions.** Think of two assassins shooting simultaneously – either bullet alone was fatal. But-for test fails for each *action* too. This is **overdetermination/causal preemption**."
      *   **Contain the Damage:** "This shows the 'but-for' test isn't perfect. Philosophers debate solutions (e.g., 'NESS' - Necessary Element of a Sufficient Set). The point *for us*: the puzzle exists for *actions* as well as omissions. It doesn't mean omissions *can't* be causes; it means we need sophisticated tools to handle complex cases. Priya's omission is *causally relevant*, even if the but-for test stumbles here." (Board: Key Idea 4: **Overdetermination challenges simple tests, but affects actions too**).

  5.  **Closing & Assessment (3 min):**
      *   **Synthesis:** Briefly recap the 4 Key Ideas on the board.
      *   **The Revealing Question:** "Imagine Greenhouse D: Sam *didn't* ask anyone, but Priya *saw* the plants wilting daily from her window and *deliberately decided not to water them* (no promise, just indifference). Did Priya's *omission* (not watering) cause the plants to die? *Should* she be *blamed*? Why/why not?" (This tests if they separate causation (yes, absence caused death) from blame (debatable - no duty? But morally repugnant? Opens discussion without clear answer, highlighting the separation).
      *   **What We're NOT Settling:** Openly announce: **"Today we established the *conceptual possibility* of causation by omission and separated it from blame. We are NOT settling the deep metaphysical debates: Is causation *fundamentally* contrastive or normative? Are absences *truly* causes or just explanatory tools? Those are live, complex debates in philosophy we're bracketing for intro purposes. Today's goal: understand the *distinction* and see why omissions *can* play a causal role in explanations."**

  **Why This Structure Works:**

  1.  **Contrastive First:** Starts with pure difference-making (Greenhouse A vs. B), building the causal intuition *before* norms enter. Key Idea 1 is foundational.
  2.  **Controlled Norm Introduction:** Priya's promise is introduced *alongside* the norm-free Greenhouse C. This forces the separation (causation identical, blame different). Key Idea 2 is cemented here.
  3.  **Misconceptions Addressed Proactively:** Each major misconception is tackled immediately *after* the concept it challenges is introduced, using the tools just built (contrast, separation, sustaining processes).
  4.  **Overdetermination Contained:** Presented late, framed as a general causal puzzle (not an omission-specific failure), preventing it from detonating the prior work. Key Idea 4 contextualizes it.
  5.  **Clear Bracketing:** Explicitly stating what *isn't* being resolved manages expectations and shows awareness of deeper debates without getting bogged down.
  6.  **Assessment Question:** The Greenhouse D scenario directly tests the core separation and contrastive thinking in a novel context.

  **Your Greenhouse Example is Perfect.** It has:
  *   **What it needs:** A clear, identical outcome caused by an absence; a clean way to introduce a norm (promise) *alongside* a norm-free parallel case (C); intuitive grasp.
  *   **What it lacks (initially):** Complicating factors like physical actions, ambiguity about necessity. Norms are *added* deliberately, not smuggled in. Greenhouse C is essential for the separation.

  **Go crush it.** Your instincts about separation, contrast, and normative containment are spot-on. This structure puts them into action. Remember: **Board = Anchor.** Keep those Key Ideas visible throughout!
