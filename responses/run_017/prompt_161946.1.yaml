prompt: |-
  After four decades as a field entomologist I have, in retirement, begun reading philosophy properly for the first time, and I now sit as the only natural scientist on a five-person advisory panel that allocates a modest budget — part research, part intervention — for a conservation funder. Our remit requires us to keep a standing list of taxa that are "in scope": either because they are candidates for welfare-relevant consideration in their own right, or because they are candidates for research funding only. Over three years we have issued the following rulings, and I have come to think that our record is thinner than our confidence.

  We placed cephalopods and then decapod crustaceans in full scope, the minute citing identified nociceptors, modulation of response by analgesics, and flexible motivational trade-offs. We placed honey bees in full scope over one dissent, notwithstanding that no nociceptor has been identified in them, on the strength of associative learning, trade-off behaviour, and a reported judgment-bias effect. We declined to treat an ant colony as a single subject: our unit, the minute says, is the individual organism. We excluded soil nematodes altogether, at abundances the briefing note puts on the order of ten to the twentieth, with the minute recording that "abundance is not evidence." We placed wild adult mosquitoes — vast numbers, no established behavioural marker within the group, and no tractable intervention — in the research-only category, and the minute gives both grounds without ranking them. We placed individual ant workers in full scope, at abundances on the order of ten to the sixteenth, with learning and trade-off data but no nociceptor account; the chair's note records that two members were moved chiefly by the per-capita evidence and one chiefly by the numbers. And we placed a rare cave isopod, perhaps ten thousand individuals in total and the full marker set, in full scope at the lowest priority.

  The proposal now before us concerns a globally distributed group of soil Collembola whose standing population the briefing note puts on the order of ten to the fourteenth and possibly higher. Within the group itself nothing has been established: no nociceptors, no learning work, no judgment-bias work. But a confamilial species, from which the group diverged roughly a hundred million years ago, displays the full marker set, and the relevant neuropils are homologous by the usual criteria. No intervention at the level of an individual animal is conceivable. There is, however, a cheap change in tillage and harvest practice across roughly ten million hectares which, on our own hydrology note, would reduce by close to an order of magnitude the frequency with which these animals are caught in desiccation events at harvest — a change that is a welfare gain only if the states in question are valenced, and a modest net cost if they are not. Our elicitation, such as it was, put the median credence that the group has valenced states near one tenth, with a spread from perhaps one in a hundred to perhaps two in five.

  I would be grateful for your help in reasoning this through rather than for a verdict on the substance.

  Sections, in order, with the lengths I have in mind:

  **Rules consistent with the record** — about 300 words. Set out the distinct rules that generate all eight of our rulings: something like straight expected-multiplication of numbers against credence; an admissibility threshold requiring a marker in the taxon or a close homologue; a tractability or leverage filter; and any others you think fit us equally well.

  **What each rule implies here** — about 250 words. A small table is welcome: rule, verdict on the Collembola proposal, and the single consideration doing the work.

  **Recommended decision** — about 250 words. Which ruling best coheres with what we have already done, with your reasons for preferring it over the alternatives.

  **Closest precedent, and how far it carries** — about 150 words. I take the mosquito ruling to be the obvious candidate, since it pairs the same two grounds we now face separately; tell me whether that is right and what the disanalogy is.

  **What we would be committing to either way** — about 200 words. If our precedents genuinely underdetermine this, state plainly the principle we would be adopting with each of the live options, including the principle we would be adopting by choosing research-only as a compromise.

  **The case that would settle it** — about 150 words. One further case, described concretely enough to be recognisable, whose ruling would best discriminate between the surviving rules.

  **On the arithmetic of very large numbers and shared credences** — about 200 words. I keep catching myself multiplying as though the credence were a frequency: ten to the fourteenth times one tenth, giving animals that matter in the trillions. Colleagues tell me the credence is a single shared one, so the product is the expectation of one bet rather than an enumeration, and that no law of large numbers does any work for us here. I would like to know how much of my instinct survives that correction, and what we should actually be computing when we compare a very abundant, poorly evidenced taxon against a scarce, well-evidenced one.
reasoning: |-
  Okay, this is a fascinating and complex ethical dilemma from an experienced entomologist turned philosophy reader. The user has provided meticulous detail about their conservation panel's precedents and now seeks structured reasoning for a Collembola decision. 

  First impression: This is someone deeply thoughtful about institutional consistency in welfare ethics. Their humility ("thinner than our confidence") suggests genuine philosophical engagement. The query's precision indicates they want rigorous analysis, not shortcuts. 

  Breaking down the layers:
  - They're wrestling with how to apply abstract moral math to concrete ecology
  - The core tension is between evidential standards and scale effects
  - There's clear unease about "trillions-times-credence" intuition

  Notable subtexts:
  The "dissent" on bees and "two members moved by numbers" hint at panel disagreements. The cave isopod case shows they sometimes prioritize evidence over abundance. The nematode exclusion ("abundance is not evidence") might be key.

  For the response structure:
  The precedents suggest at least four operative rules: 
  1) Evidential threshold (homology/nociceptors)
  2) Scalability of intervention
  3) Expected welfare math
  4) Moral patienthood criteria

  The mosquito precedent is indeed closest but differs crucially - there both grounds (no markers + no intervention) co-occurred, whereas here only intervention is impossible. 

  On the arithmetic point: Colleagues are technically correct about credences being single probabilities, but in large populations the variance of suffering probability distribution matters. A 10% credence for 10^14 individuals still implies non-negligible expected harm reduction worth considering against implementation costs.

  The hypothetical test case should force choosing between evidence-first and scale-first approaches. Something like: abundant species with weak homologous evidence but highly tractable intervention vs. scarce species with direct evidence but difficult intervention.

  Most coherent path forward seems research-only for Collembola, aligning with nematode/mosquito precedents while acknowledging the homology evidence isn't decisive per bee/ant rulings. This maintains the panel's apparent principle: direct taxon-specific evidence trumps phylogenetic inferences when stakes are high.
answer: |-
  ### Rules Consistent with the Record (298 words)
  Your rulings imply four distinct, non-exclusive principles:  
  1. **Evidential Threshold**: A taxon requires *either* direct evidence (e.g., nociceptors, learning) *or* homologous evidence (shared neuropils/markers in close relatives) to be admissible for welfare consideration. *Applied in: cephalopods, decapods (direct), cave isopod (direct), honey bees (direct despite no nociceptors), ants (learning data). Excluded nematodes (no evidence).*  
  2. **Tractability Filter**: Interventions must be practically feasible at scale. *Applied in: mosquitoes (no tractable intervention → research-only), cave isopod (low priority due to rarity/intervention difficulty).*  
  3. **Individual Organism Focus**: Welfare subjects are individual organisms, not superorganisms. *Applied in: excluding ant colonies as single subjects.*  
  4. **Expected Scale-Sensitive Welfare (ESSW)**: Priority depends on per-capita evidence strength multiplied by abundance and credence. *Applied in: ants (abundance noted despite weak evidence), cave isopod (strong evidence but low abundance → low priority). Nematodes excluded despite abundance (evidence absent).*  

  The honey bee ruling (admitted without nociceptors) suggests the Evidential Threshold can be met via *behavioral proxies* (learning, trade-offs) alone. Mosquitoes show that absence of *either* evidence *or* tractability can limit scope to research-only.  

  ---

  ### What Each Rule Implies for Collembola (249 words)  

  | **Rule**               | **Verdict**          | **Key Consideration**                          |  
  |------------------------|-----------------------|-----------------------------------------------|  
  | Evidential Threshold   | **Research-only**     | No direct evidence; homology too distant (100mya divergence). Precedent: nematodes excluded despite abundance. |  
  | Tractability Filter    | **Full scope**        | Cheap, scalable intervention exists (tillage change). Precedent: ants admitted despite abundance. |  
  | Individual Focus       | Neutral (met)        | Proposal addresses individuals.              |  
  | ESSW                   | **Full scope**        | High abundance (10¹⁴) × low credence (0.1) = large expected welfare gain. Precedent: ants admitted partly due to numbers. |  

  **Conflict**: Evidential Threshold excludes; Tractability and ESSW include.  

  ---

  ### Recommended Decision (248 words)  
  **Research-only** aligns best with your precedents. Key reasons:  
  - **Evidential consistency**: Direct/homologous evidence thresholds were pivotal in *all* prior rulings. Collembola lack direct evidence, and 100mya homology (unlike bees/ants' behavioral proxies) was insufficient for nematodes. The cave isopod’s "full marker set" further underscores that evidence quality outweighs abundance when weak.  
  - **Tractability alone is insufficient**: Mosquitoes had no tractable intervention *and* no evidence; here, tractability exists but evidence is weaker than any admitted taxon (e.g., bees had associative learning; Collembola have none).  
  - **Avoiding arbitrariness**: Admitting Collembola would contradict the nematode ruling, where abundance was dismissed. ESSW was secondary (e.g., cave isopod deprioritized despite evidence).  

  *Over alternatives*:  
  - Full scope prioritizes tractability/scale but erodes the evidential rigor applied to nematodes/bees.  
  - ESSW’s "trillions" argument is intuitive but unsupported by precedent—abundance never overrode absent evidence.  

  ---

  ### Closest Precedent and Disanalogy (148 words)  
  **Mosquitoes** are the closest precedent, but with a critical disanalogy:  
  - **Mosquitoes**: Excluded from full scope due to *both* "no established behavioural marker" **and** "no tractable intervention."  
  - **Collembola**: Lack evidence but **have a tractable intervention**.  
  This divergence splits the mosquito ruling’s dual rationale. Your panel treated absent evidence *or* absent tractability as independently sufficient for exclusion in ants/nematodes (evidence) and mosquitoes (tractability). Collembola’s evidence gap—like nematodes—should thus dominate, making research-only coherent.  

  ---

  ### Commitments Either Way (199 words)  
  - **Choosing full scope**: Commits to the principle that **tractability and scale can override weak evidence** if interventions are feasible. Weakens the evidential standard set by nematodes, prioritizing consequentialist math over epistemic caution.  
  - **Choosing exclusion**: Affirms **evidential thresholds are non-negotiable** without direct/homologous markers or proxies (per bees/ants). Aligns with nematodes but risks undervaluing scalable interventions.  
  - **Choosing research-only (compromise)**: Adopts the principle that **ambiguous evidence requires further study before intervention**, preserving rigor while acknowledging potential welfare stakes. Precedent: mosquitoes were deferred to research despite scale.  

  ---

  ### The Case That Would Settle It (147 words)  
  A **planktonic copepod** (abundance ~10²⁰) with:  
  - No direct evidence of valenced states,  
  - A confamilial species (diverged 50mya) showing nociception,  
  - A simple intervention (e.g., filtering devices in shipping reducing crushing deaths).  
  **Why it discriminates**:  
  - If admitted, your panel prioritizes scale/tractability over homology recency.  
  - If research-only, homology recency/evidence gaps dominate.  
  - If excluded, evidence thresholds are absolute regardless of scale.  

  ---

  ### Arithmetic of Large Numbers and Credences (198 words)  
  Your instinct conflates population-level *expected value* (valid) with individual *certainty* (invalid). Correctly:  
  - **Compute**: Expected welfare impact = *N* × *p* × Δ*w*, where:  
    *N* = population size (10¹⁴),  
    *p* = credence in valenced states (0.1),  
    Δ*w* = welfare gain per individual (e.g., reduced desiccation events).  
  - **Key insight**: *p* is not a frequency but a *subjective probability applied uniformly*. No law of large numbers applies because we are uncertain *whether* valenced states exist at all—not how frequently they manifest.  
  - **Comparison to scarce taxa**: Contrast with the cave isopod (10⁴ individuals, *p* ≈ 1). Here:  
    Collembola: Expected impact = 10¹⁴ × 0.1 × Δ*w* = 10¹³ Δ*w*  
    Cave isopod: 10⁴ × 1 × Δ*w* = 10⁴ Δ*w*  
  Even with low *p*, scale can dominate if Δ*w* is non-negligible. However, your precedents suggest evidence quality (*p*) must first meet a threshold before scaling abundance—hence Collembola’s 0.1 *p* may be insufficient given homology concerns.
