  This is actually a sophisticated epistemological puzzle wrapped in archaeological fieldwork drama. The user clearly understands the professor's framework well—they've meticulously catalogued eight precedent rulings with their rationales, and now want to reverse-engineer the underlying principles. Their core ask is methodological: not whether the enclosures exist, but how to systematize the classification logic. 

  The professor's track record reveals interesting patterns. He consistently rejects claims invoking lost advanced civilizations (Atlantis, Tartaria) or extraordinary agents (aliens), while accepting geologically-grounded challenges like the Sphinx erosion theory—even when unpopular. Crucially, he distinguishes between evidentiary gaps explained by suppression (pseudohistory) versus survey bias (legitimate). His tolerance for credentialed outsiders is high, as with the amateur archaeologist later vindicated. Most tellingly, he separates sound methodology from conclusions—Fomenko's math credentials didn't save his chronology, while the radiocarbon dating proposal was deemed "ordinary scholarship."

  Now to the Amazon case. Three elements stand out: 1) The team's pre-registration and testable prediction, 2) Their survey-bias explanation (not conspiracy), 3) Their institutional credentials. The failed first survey complicates things—their response (new prediction, transparency about technical failures) feels scientifically responsible, but critics see hypothesis-immunization. 

  I think the professor would evaluate this in two phases. Pre-survey, it clearly fits his "legitimate challenge" profile: testable, bias-not-suppression, credentialed researchers. Post-failure, their conduct—acknowledging failure, providing checkable reasons (permits/logging), doubling down with new test—aligns with his Sphinx/YDIH rulings where methods remained sound despite unpopular conclusions. The critics' "immunization" charge feels like the Tartaria-suppression logic he rejects. 

  The clincher is the second pre-registration. If they abandon testability now, it'd tip toward pseudohistory; if they publish null results, it confirms legitimacy. That's the discriminating factor—their next move will reveal whether this is science self-correcting or dogma masquerading. 

  User's clearly done their homework. Their suspicion that "rules come apart" between prediction and failure is astute—it shows they grasp how scientific process evolves. I'll structure the response around reconstructing principles from precedents, then phase-based analysis. Might add that the professor would likely withhold verdict until the second survey's transparency plays out, given his caution in the "civilisation later excavated" case.
answer: |-
  Based on your professor's track record, we can derive several consistent principles underpinning his distinctions between pseudohistory and legitimate scholarship. Applying these to the Interfluve Survey Project (ISP) case reveals how they might apply at different stages, and where potential verdicts lie.

  **Derived Principles from Precedents:**

  1.  **Testability & Methodological Accountability (TMA):** The core distinction hinges on whether the claim is framed in a *falsifiable* way and how proponents respond to *empirical challenges*. Pseudohistory immunises claims against evidence (e.g., Fomenko ignoring contradictory data, Tartaria invoking suppression). Legitimate scholarship engages empirically, makes testable predictions, and adapts methods when predictions fail without abandoning core accountability (e.g., Sphinx weathering hypothesis, YDIH, radiocarbon proposal, unexcavated civilisation inference). *Institutional position is secondary to methodology* (Fomenko's eminence irrelevant; uncredentialed amateur vindicated).
  2.  **Explanatory Mechanism & Parsimony (EMP):** Claims invoking *extraordinary, unsupported causes* (extraterrestrials, global catastrophes erasing advanced civs, chronologies requiring massive duplication/fabrication) are suspect. Legitimate challenges propose *plausible, naturalistic mechanisms* grounded in existing disciplines (geology for Sphinx erosion, astronomy for YDIH, standard archaeological inference for unexcavated civs). *"Lost advanced civs" per se aren't pseudohistorical if proposed via standard methods (like (viii)), but become so when reliant on catastrophism/suppression*.
  3.  **Evidentiary Accounting (EA):** Explaining *absence of evidence* via *suppression/conspiracy* is diagnostic of pseudohistory (Tartaria). Explaining absence via *recognised methodological limitations or biases* (e.g., survey bias, incomplete excavation, taphonomy) is legitimate, especially when testable (e.g., checking survey effort records). The burden is on the proponent to demonstrate the plausibility of the bias *and* propose ways to overcome it.
  4.  **Rhetoric & Institutional Engagement (RI):** While credentials aren't decisive, *framing opposition solely as "orthodoxy" suppressing truth* is a red flag often associated with pseudohistory (cf. Tartaria). Legitimate scholarship typically engages with counter-evidence and critiques within disciplinary frameworks, even if robustly defending its position. *Complaints about funding rejection alone aren't inherently pseudohistorical, but the* basis *and* rhetoric *matter*.

  **Application to ISP Case:**

  *   **Stage 1: Pre-Survey (Initial Proposal):**
      *   **TMA:** Strongly supports legitimacy. Pre-registration of a specific, falsifiable prediction (≥20 enclosures in 40 tiles) is gold-standard methodological accountability.
      *   **EMP:** Supports legitimacy. Proposes larger, more sedentary populations using earthworks/orchards – a *plausible* mechanism within Amazonian archaeology (cf. known complex societies like the Amazonian Dark Earths cultures). No reliance on extraordinary causes.
      *   **EA:** Supports legitimacy. Explains absence via well-documented, testable *survey bias* (river-centric focus), not suppression. Offers a method (lidar) to overcome it.
      *   **RI:** Neutral/Mild Warning. Complaints about "orthodoxy" *could* be a red flag, but framed alongside specific methodological arguments (survey bias) and backed by credentialed professionals actively seeking standard funding/publication, it’s not yet diagnostic.
      *   **Verdict Prediction (Pre-Survey):** **"Not Pseudohistory"** - Aligns perfectly with Sphinx hypothesis, YDIH, radiocarbon proposal, and the logic of the "later excavated civ" case by proposing a testable challenge based on methodological limitation (bias).

  *   **Stage 2: Post-Survey Failure & Response:**
      *   **TMA:** **Crucial Test.** ISP acknowledges failure (only 4 enclosures, 1 large). They provide specific, *independently checkable* reasons: 2 tiles not flown (permits), logging degrading baseline for automated detection. They then make a *new* pre-registered, testable prediction (30 enclosures in new tiles) with an improved, validated method. This mirrors how legitimate science responds to failure: diagnosing *methodological* issues and iterating the test. *Critics' "immunisation" charge reflects the pseudohistorical pattern, but ISP's actions contradict it by accepting failure and upping the ante.*
      *   **EMP:** Still supports legitimacy. Core claim (larger populations, earthworks) isn't abandoned *yet*, but the scale implied is reduced pending further testing. Mechanism remains plausible/naturalistic.
      *   **EA:** Still supports legitimacy. Absence in first survey is accounted for by specific, checkable methodological failures (permits, logging impact on detection), not suppression. The *survey bias* explanation for *historical* absence remains valid.
      *   **RI:** Neutral/Potential Concern. Continued framing of opposition as "orthodoxy" *could* become problematic if it replaces engagement with methodological critiques of their *new* approach. However, their focus remains on methodological iteration.
      *   **Verdict Prediction (Post-Failure):** **"Not Pseudohistory"** - The response strongly adheres to TMA: acknowledging failure, providing checkable reasons, refining methods, and making a new risky prediction. This contrasts sharply with pseudohistorical immunisation (Fomenko, Tartaria) and resembles how legitimate but contested hypotheses (Sphinx, YDIH) proceed despite setbacks. The EA remains sound.

  **Best Guess at Professor's Verdict:**

  Given his emphasis on methodology and response to evidence over credentials or popularity, and his specific rejection of "suppression" as the diagnostic move while accepting testable challenges accounting for bias, **he will likely classify the ISP project, even post-failure, as "Not Pseudohistory"**.

  *   **Reasons for preferring this verdict:**
      1.  **Core Principle Alignment:** ISP's actions exemplify TMA – the hallmark of legitimate science in his framework. Pre-registration, acknowledging failure, checkable explanations for failure, and renewed testing are the *antithesis* of pseudohistorical immunisation.
      2.  **Precedent Alignment:** It fits the Sphinx/YDIH pattern: a specific, testable (if initially unsuccessful) challenge based on a naturalistic mechanism and methodological critique (survey bias akin to weathering interpretation), pursued by credentialed researchers within the system (publishing, seeking grants), despite facing scepticism.
      3.  **Distinction from Pseudohistory:** Unlike Tartaria/Fomenko, ISP doesn't invoke conspiracy to explain failure; they cite concrete, verifiable methodological hiccups. Unlike Atlantis/aliens, their proposed civilisation isn't "advanced" in an anachronistic sense, just larger/sedentary than previously thought for *that specific zone*.
      4.  **Process Over Result:** He consistently distinguishes sound *method* from contested *conclusions*. ISP's method (lidar, pre-registration, transparency) remains sound; their *specific initial prediction* failed due to identifiable execution issues, not a flawed core premise *yet proven*.

  **Discriminating Evidence: Where the Rules Could Diverge**

  The principles mostly cohere here. However, **TMA** is the most decisive and could diverge from others if ISP's *future conduct* changes:

  1.  **Failure to Publish Null Results of Second Survey:** If the second survey also yields few enclosures and ISP *fails to publish* or significantly alters the pre-registered analysis *without compelling, checkable methodological justification*, **TMA** would strongly indicate pseudohistory (immunisation, lack of accountability). EMP/EA might still *potentially* support legitimacy if the core idea remains plausible elsewhere, but TMA would dominate.
  2.  **Shifting to Suppression Rhetoric:** If, after a second failure, ISP abandons methodological critique and solely blames "suppression by the orthodoxy" for their lack of acceptance *without engaging substantively with methodological critiques of their own work*, **RI** would become a strong pseudohistory indicator alongside a failing TMA. EMP/EA might be less decisive.
  3.  **Invoking Extraordinary Causes:** If ISP, facing persistent negative evidence, suddenly postulated an unknown cataclysm or deliberate erasure *unique to the interfluves* to explain the lack of findings, **EMP** would shift towards pseudohistory (akin to Tartaria/Atlantis logic), even if TMA was initially strong.

  **Underdetermination and Commitment:**

  While the precedents strongly favour "Not Pseudohistory", a strict reading shows they don't *absolutely compel* it. The **discriminator is the rigour of the response to failure.**

  *   **If he classifies it as "Not Pseudohistory":** He commits to the principle that **a testable hypothesis, pursued with methodological accountability (including transparent response to failed predictions and renewed testing), remains legitimate scholarship *regardless* of initial results or institutional friction.** It reinforces that the *process* defines the category, not the popularity of the claim or the credentials alone.
  *   **If he classifies it as "Pseudohistory":** He would be committing to the principle that **a single failed pre-registered prediction, even when specific methodological explanations are offered and a new test is initiated, can be sufficient to render a hypothesis pseudohistorical if it faces significant scepticism and complains of orthodoxy.** This would mark a significant departure from his acceptance of the Sphinx hypothesis or YDIH despite long-term controversy and lack of consensus, and would raise the bar for legitimate revisionism considerably. It would risk conflating *unpopular* or *initially unsuccessful* science with pseudoscience.

  **Conclusion:**

  The professor's precedents emphasise methodological accountability (TMA) and naturalistic explanations accounting for absence without conspiracy (EA) as the primary safeguards against pseudohistory. The ISP case, particularly its *response* to the failed first survey, exemplifies these safeguards. While the critics' concerns highlight a tension, the team's actions align more closely with the conduct of legitimate, if contentious, science (Sphinx, YDIH) than with pseudohistory (Fomenko, Tartaria). Therefore, the safest prediction is a verdict of **"Not Pseudohistory"**, both for the initial proposal and the post-failure response. The critical discriminating factor will be the transparency and adherence to the pre-registered plan for the *second* survey.
