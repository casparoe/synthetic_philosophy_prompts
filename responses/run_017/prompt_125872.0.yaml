  But wait: what about a world where after the accident and the personality change, she somehow regains her artistic side and repairs her hands? That might be too far-fetched. We want an ordinary scenario.

  To avoid science fiction, we can say that the hand injury is permanent and the personality change is a result of her life choices (so it's stable). Hence, in any world that is similar to w (with the injury and the personality), she cannot be a concert pianist. And the counterpart relation in w only picks out individuals that are similar to Alice1 in her current state (which includes the injury and the personality). So no counterpart of Alice1 has F (being a concert pianist).

