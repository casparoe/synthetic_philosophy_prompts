  We are to construct a scenario of "modal stranding": an individual who could have been such that, although she actually could have had some good F, in that alternative scenario she could no longer have had F. Moreover, we want the two frameworks (counterpart theory and transworld identity) to disagree on whether it is true that she could have been stranded (i.e., could have been in a situation where F is no longer attainable for her).

  Key elements:
  - The actual individual, call her Alice, could have borne F (so in some world, she or her counterpart has F).
  - But in some other world, a counterpart of Alice is such that none of its counterparts (so, in any world accessible from that one) have F. Yet, note that in that other world, it might be that some counterpart of the actual Alice (i.e., in that world) has F? But we want that counterpart (the one in the alternative scenario) to be such that F is not attainable for her in her own modal context.

  We also require:
  - The scenario is ordinary, no sci-fi, no fission, no duplication, no change of parents or matter.
  - The modal stranding is with respect to an ordinary attainable good (like a job, a skill, a relationship).

  Plan:
  We need a scenario where the counterpart relation is sensitive to context (in particular, to the alternative scenario) so that the counterparts of the counterpart in the alternative scenario are different from the counterparts of the actual individual. Specifically, we want that in the alternative scenario, the individual is in a state that makes her so different that the things that are similar to her in that state do not include any that have F. But note: the actual Alice has a counterpart in the alternative scenario (call it Alice1) and we want that Alice1 has no counterpart that has F. However, the actual Alice does have a counterpart (in some world) that has F (so F is attainable for her actually). The disagreement will arise when we ask: could Alice have been such that she could not have had F? That is, is there a world w and a counterpart of Alice in w (namely Alice1) such that in w, it is not possible for Alice1 to have F? (Meaning: no counterpart of Alice1 in any world has F.)

  But note: the transworld identity theorist (with S5) will say: if Alice1 is identical to Alice, then the worlds accessible from w are the same as from the actual world (because S5), so if in the actual world there is a world where Alice has F, then in w, there is a world (the same one) where Alice (i.e., Alice1) has F. Hence, the transworld identity theorist will deny that Alice1 could not have had F. So they will say: it is not possible that Alice could have been such that she could not have had F.

  But the counterpart theorist, because the counterpart relation is context-dependent and non-transitive, might allow that in the alternative scenario, the context shifts so that the counterparts of Alice1 are only those that are similar to her in that scenario, and they don't include any that have F.

  So we need a scenario where the alternative scenario (say, a particular career path or life choice) makes Alice so different that the individuals that are similar to her in that scenario are all without F, even though in the actual scenario, Alice is similar to some individuals that have F.

  Example sketch:

