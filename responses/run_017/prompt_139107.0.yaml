  The hard part is making fanaticism compelling here. If we calculate expected lives saved, even at tiny probabilities, it might dominate small costs. But anti-fanatic counters need to be defensible too. For probability truncation, setting any threshold will look arbitrary when applied to extinction risks. For value capping, claiming "more lives don't matter after X billion" seems ethically dubious. 

  I wonder... is the core tension actually about population ethics rather than probability? The fanatic and anti-fanatic already disagree about whether large populations have moral weight before probabilities enter. That might be the feature doing the work - removing it collapses back to Pascal's Mugging. 

  For the coda on repeated trials: if the same choice is offered millions of times, even tiny probabilities become near-certain over enough iterations. This exposes how arbitrary probability truncation is, since it can't handle accumulation of small chances. 

  The user seems sophisticated - they're anticipating objections and want the anti-fanatic's strongest reply. Probably they'll push back on whether population size can really create "astronomical value" without exotic utility. I should acknowledge that tension explicitly. 

  After several drafts, I settled on a biosecurity scenario with asteroid defense parallels. The calculation shows expected value dominates despite low probability. The honest bit admits population ethics is doing heavy lifting. Best anti-fanatic reply: our intuition here is contaminated by existential risk concerns. 

