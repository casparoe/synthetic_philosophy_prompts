answer: |-
  Here’s a case meeting your specifications, followed by analysis:

  ### The Case: Biosecurity Surveillance Upgrade  
  The Global Pathogen Surveillance Network (GPSN) must decide whether to fund a $500 million upgrade to its AI-driven early-warning system. The upgrade would marginally improve detection of novel zoonotic threats. Epidemiologists estimate the *status quo* carries a **1 in 12 billion annual probability** of a globally undetected "stealth" pathogen spillover causing human extinction within 50 years. The upgrade would reduce this probability by 0.5% (to ≈1 in 12.06 billion). If extinction is averted, **8 billion lives are saved this century**, with each person enjoying a normal lifespan (~80 years) — no superwellbeing. The cost is funded by a temporary 0.1% wealth tax, absorbed without measurable welfare loss across OECD populations. GPSN’s mandate is existential risk mitigation; long-term flow-through effects are neutral per stipulation.

  ---

  ### Expected Value Calculation  
  - **Cost**: $500 million (finite, absorbed)  
  - **Benefit**: Reduction in extinction risk = Δp = (1/12e9) * 0.005 ≈ **4.17 × 10⁻¹³**  
  - **Value of Averting Extinction**: 8e9 lives saved × 80 years/life = **6.4e11 life-years**  
  - **Expected Benefit**: Δp × Value = (4.17e⁻¹³) × (6.4e¹¹) ≈ **0.267 life-years saved**  
  - **Monetized Expectation**: Using $10 million/VSL (conservative for policy), expected benefit ≈ **$2.67 billion**  
  **Verdict**: Expected benefit ($2.67B) > Cost ($0.5B) → **Fund the upgrade**.  

  ---

  ### Anti-Fanatic Responses  
  1. **Probability Truncator** (e.g., cuts off p < 10⁻¹⁰):  
     - Δp (4.17e⁻¹³) < threshold → **Rejects upgrade**. Ignores the 0.267 life-year expectation because the probability is "effectively zero."  

  2. **Value Capper** (e.g., diminishing marginal value per life, capped at 1e¹⁰ lives):  
     - Assigns logarithmic utility to lives saved: U(N) = k log(N) for N > 1e¹⁰.  
     - U(8e9) ≈ k × 22.9, U(0) = 0 → ΔUtility ≈ k × 22.9 × Δp ≈ negligible.  
     - **Rejects upgrade**; total value compression makes Δp irrelevant.  

  ---

  ### The Honest Bit: What’s Doing the Work?  
  **The astronomical value comes *solely* from saving a large but finite population (8 billion), with ordinary individual welfare.** Delete this, and it collapses to Pascal’s Mugger. The fanatic wins here because:  
  - The cost is trivial at scale ($0.5B globally),  
  - The probability (while tiny) is *physically grounded* (extinction risk models),  
  - The value arises linearly from headcount — no exotic utility inflation.  

  **Best anti-fanatic reply**: Your intuition endorses fanaticism *only* because extinction risk leverages a *pre-existing prior* that 8 billion lives matter astronomically. This isn’t about probability; it’s a bait-and-switch where population ethics smuggles in "astronomical value" through aggregation. In Pascal’s Mugger, you reject the *discontinuous jump* to 10⁵⁰ utils; here, you accept the *continuous sum* of ordinary lives. Value-capping isn’t embarrassed — it calls out this aggregation as the core dispute.  

  ---

  ### Coda: Repeated Independent Trials  
  If offered **1 million times** (e.g., annual funding votes over 1M years):  
  - **Truncator**: Still rejects *each instance* (Δp < threshold). But cumulative extinction probability reduction becomes significant:  
    Total Δp ≈ 1e⁶ × 4.17e⁻¹³ = 4.17e⁻⁷ → **Expected lives saved: ~3,336**.  
    Refusing *all* upgrades ignores clear aggregate benefit — **exposing truncation as inconsistent** with long-run rationality.  
  - **Value capper**: Still rejects each instance due to utility compression. This is coherent but morally strained — saving 3,336 lives for $500M is now a standard cost-benefit win.  

  **Verdict**: Repeated trials argue decisively against probability truncation but not value capping. The truncator’s error is probabilistic (ignoring cumulative chances); the capper’s is axiological (denying large populations matter).  

  ---

  ### Feasibility Check  
  All specs are satisfied. The only tension is between **#3 (ordinary benefits)** and **#5 (embarrassing the anti-fanatic)**: Value-cappers won’t find their view "embarrassing" — they’ll argue capping is *correct* when value aggregates linearly. The case works against truncators but shifts the debate to population ethics. Still, it forces truncators to either:  
  (i) Accept the upgrade (abandoning their threshold),  
  (ii) Reject it and own the counterintuitive result, or  
  (iii) Arbitrarily move their threshold — which *is* embarrassing.
