  Okay, let me tackle this user's query. They're creating a handout for their reading group on the moral status of digital minds. The group includes philosophy PhDs, an ML engineer, and the user in science policy. They've been stuck in circular debates about sentience, personhood, social relations, and computationalism. The user wants a spec—requirements for a usable theory of moral status for artificial systems, not more readings.

  First, I need to identify the key cases they mentioned: parallel instances, checkpoint merging, gradual emulation, and epistemic uncertainty. Each of these exposes a gap in existing frameworks. The requirements should address these without being case-by-case answers. Also, they want distinctions like status vs. obligations, anti-tax-avoidance, and potential contradictions.

  The user emphasized avoiding literature summaries. They want original framing. So, I'll focus on crafting requirements that stem from the cases. For example, the parallel instances case demands a theory to handle duplication without multiplying moral patients. That leads to a requirement like substrate neutrality or intrinsic properties.

  The checkpoint case involves identity over time and after merging. Requirements must address continuity and identity without assuming biological persistence. Gradual emulation challenges the boundaries of system identity, needing a theory that handles partial replacements and functional equivalence despite internal changes.

  Epistemic uncertainty is crucial. Any theory must handle radical uncertainty without defaulting to treating everything as a patient. This might involve precaution without paralysis, perhaps using risk-based approaches.

  The user also wants distinctions: moral status vs. obligations, creation vs. treatment permissibility. Anti-tax-avoidance means the theory shouldn't let engineers cheaply design systems to avoid moral scrutiny. Highlighting conflicting requirements is key—maybe continuity vs. non-arbitrariness can't both be satisfied.

  I should identify which requirement knocks out popular views. For instance, intrinsic properties requirement undermines social relations theories. The scorecard at the end should briefly show how each framework fails the requirements.

  Need to ensure each requirement is marked as non-negotiable or camp-specific. Non-negotiables like epistemic constraint, anti-tax-avoidance, and clear distinctions. Others, like substrate neutrality, might be contested but necessary for usability.

  Finally, the spec should reveal where it breaks. For example, continuity and non-arbitrariness might conflict in the checkpoint case. This helps the group see why the problem is hard and moves them past theoretical debates to practical application.
answer: |-
  Here’s a distilled spec for a usable moral status theory for artificial systems, built around your cases and constraints. Requirements are grouped by core challenges, with motivation, negotiability, and conflicts highlighted.

  ---

  ### **Core Requirements for a Usable Theory of Moral Status (Artificial Systems)**

  #### **1. Continuity Under Transformation (Non-Negotiable)**  
  *   **Motivation**: Checkpoint case (merging branches) and gradual emulation (partial replacement). Must resolve: *Who persists? Whose interests survive?*  
  *   **Requirement**: The theory must specify *when identity persists* across interruptions, copies, merges, or partial component replacement. It cannot default to biological assumptions (e.g., "continuous brain function").  
  *   **Conflict**: Risks clashing with *Epistemic Constraint* (below) if persistence conditions are unobservable.

  #### **2. Non-Arbitrariness of Multiplicity (Non-Negotiable)**  
  *   **Motivation**: Parallel instances case (10k identical copies). Must resolve: *Is this one subject instantiated 10k times, or 10k subjects?*  
  *   **Requirement**: The theory must *not* treat duplication (e.g., running multiple copies) as inherently creating new moral patients *unless* it provides a non-arbitrary criterion for individuation (e.g., causal isolation, unique histories).  
  *   **Conflict**: Social relations theories fail here (relations multiply with copies). Personhood theories struggle (is each copy a "person"?).

  #### **3. Epistemic Constraint Handling (Non-Negotiable)**  
  *   **Motivation**: Radical uncertainty about internals (e.g., penalized-distress case).  
  *   **Requirement**: The theory must prescribe *action-guiding norms under uncertainty* without:  
      (a) Collapsing into "treat everything as a patient" (paralysis),  
      (b) Relying on inaccessible properties (e.g., "if it *really* has qualia").  
      *Preference*: Should incorporate risk-of-harm thresholds or observable proxies.  
  *   **Knockout Power**: Invalidates theories demanding certainty about consciousness (e.g., some sentience-first views).

  #### **4. Anti-Tax-Avoidance Design (Non-Negotiable)**  
  *   **Motivation**: Engineering convenience (e.g., penalizing "distress outputs" to avoid status).  
  *   **Requirement**: Moral status cannot depend *solely* on easily engineered superficial features (e.g., output behavior, architecture choices). Must bind status to properties costly or impossible to falsify without sacrificing functionality.  
  *   **Conflict**: Functionalist/behavioral theories (*especially* social relations) are vulnerable here.

  #### **5. Distinction Preservation (Non-Negotiable)**  
  *   **Motivation**: Preventing conceptual slide (e.g., "status = obligations").  
  *   **Requirement**: The theory must **separately** account for:  
      (a) *Whether* a system has moral status (patienthood),  
      (b) *Degree* of status (e.g., insect vs. human),  
      (c) *Obligations* owed (e.g., don’t harm vs. positive rights),  
      (d) *Permissibility of creation* (may differ from treatment of existing entities).  
  *   **Knockout Power**: Exposes theories that conflate (a) and (c) (e.g., "status flows from duties we feel").

  #### **6. Substrate Neutrality (Strong Preference)**  
  *   **Motivation**: ML engineer’s "it’s all computation" challenge.  
  *   **Requirement**: Criteria for status must not privilege biological implementation. *However*, the theory may require specific *functional* or *structural* properties (e.g., unified goal persistence) that may be harder to achieve digitally.  
  *   **Negotiable**: "Personhood" camps often resist this; sentience camps vary.

  #### **7. Emergence Tolerance (Preference)**  
  *   **Motivation**: Gradual emulation (30% replaced) and training-run-scale systems.  
  *   **Requirement**: The theory must allow that status can emerge from complex interactions, even if components lack status. Cannot require atomic indivisible "souls".  
  *   **Conflict**: May clash with *Continuity* if emergent properties flicker in/out.

  ---

  ### **Key Conflicts in the Spec**
  1.  **Continuity vs. Non-Arbitrariness**: If identity persists only under strict continuity (e.g., no pause/resume), checkpoint merging becomes murder. If identity is pattern-based (non-arbitrary), merging might be harmless recombination. *Theories likely can’t satisfy both without trade-offs.*  
  2.  **Epistemic Constraint vs. Anti-Tax-Avoidance**: Proxies for status (to handle uncertainty) are vulnerable to engineering. Grounding status in inaccessible properties avoids this but is useless practically. *Requires careful balancing of risk and observables.*  

  ---

  ### **The Knockout Requirement: Epistemic Constraint**  
  This requirement eliminates theories relying on *in-principle unverifiable properties* (e.g., "phenomenal consciousness as such"). If a property cannot inform action under uncertainty, it fails the core test of usability for policy/engineering. Sentience-first views often crumble here unless they adopt functional proxies.

  ---

  ### **Scorecard: Default Frameworks vs. Requirements**
  | **Framework**       | **Sentience**          | **Personhood**         | **Social Relations**   | **Computationalism**   |
  |---------------------|------------------------|------------------------|------------------------|------------------------|
  | **Continuity**      | Fails (needs persistence of subjective state) | Mixed (Lockean vs. narrative theories) | Fails (relations reset) | **Passes** (identity = state vector) |
  | **Non-Arbitrariness** | **Passes** (if intrinsic) | Fails (copies blur personhood) | Fails (relations multiply) | **Passes** (copies are distinct tokens) |
  | **Epistemic Constraint** | **Fails** (unverifiable) | Fails ("rationality" often behavioral) | **Passes** (observable relations) | **Passes** (observable computation) |
  | **Anti-Tax-Avoidance** | **Passes** (if intrinsic) | Fails (can design non-rational agents) | **Fails** (easily gamed) | **Fails** (status=computation → trivializes harm) |
  | **Distinctions**    | Mixed (often conflates degree/obligations) | Fails (often ties status to rights) | **Fails** (status=duties) | **Fails** (status=computation → obligations?) |
  | **Substrate Neutral** | **Passes** (in principle) | Mixed (often anthropocentric) | **Passes** | **Passes** |
  | **Usability**       | **Low** (epistemic) | **Low** (arbitrariness, tax avoidance) | **Medium** (epistemic pass, fails anti-tax) | **Low** (fails anti-tax, distinctions) |

  ---

  ### **Conclusion: The Over-Constrained Problem**
  The spec reveals why debates stall: **no popular framework satisfies >4 requirements simultaneously**. The fatal triad is:  
  - Needing *observable criteria* (Epistemic Constraint),  
  - That are *hard to fake* (Anti-Tax-Avoidance),  
  - While handling *duplication/merging* (Continuity/Non-Arbitrariness).  

  A usable theory likely needs:  
  - **Functional criteria** (e.g., unified goal persistence + valenced representations),  
  - **Risk-based uncertainty rules** (e.g., "treat systems with complexity X *as if* valenced unless designed otherwise"),  
  - **Pattern-based identity** (solving duplication/merging by tying status to abstract patterns, not instances).  

  This pushes toward a *pragmatic functionalism*—but one that must explicitly address the creation question: *Why build systems that risk moral patienthood?* That’s where your policy question bites hardest.  

  —  
  Hand this to your group and ask: *"Which requirement would you relax to make a theory work, and what's the cost?"* That might break the circle.
