answer: |-
  Below is a one-page, step-by-step procedure for testing counterfactual sentences about individuals. It draws on counterpart theory (without using the term) and emphasizes the distinction between **causal-origin counterparts** (same biological origin, e.g., same parents, gamete, or early history) and **narrative-role counterparts** (same function in the story, e.g., "the discoverer" or "the director"). The procedure prioritizes narrative-role counterparts by default (as they align with journalistic intent) but allows causal-origin counterparts when the story explicitly hinges on biological or historical continuity. It includes safeguards for non-unique counterparts, chained counterfactuals, and explanatory purpose.

  ---

  ### **Procedure: 5-Step Test for Counterfactual Sentences**  
  *Run this on each sentence referencing an individual in a "what if" scenario. Spend ~1 min per step.*

  #### **Step 1: Eliminate Impossible Identity**  
  **Test:** Does the sentence imply that an *actual, specific person* (e.g., named or definitively described) experiences something in the counterfactual world?  
  - **Pass:** No named/definite person is placed in the scenario (e.g., "a scientist would have discovered it").  
  - **Fail:** Yes (e.g., "Einstein would have won the Nobel Prize in 1910").  
  - **Rewrite:** Replace the proper name or definite description with an **existential phrase** (e.g., "some scientist") or a **role-based description** (e.g., "the lead researcher").  
    *Why: The copy desk’s rule targets this. No one "is" in two worlds; we discuss counterparts.*

  #### **Step 2: Resolve the Counterpart Type**  
  **Test:** Is the counterpart defined by *causal origin* (biological/historical continuity) or *narrative role* (function in the story)?  
  - **Pass:** The description matches the sentence’s purpose:  
    - Use **narrative-role** if the point is about events, positions, or discoveries (e.g., "the director" for a decision).  
    - Use **causal-origin** only if the point explicitly requires biological/historical continuity (e.g., "Marie Curie’s child" in a genetics piece).  
  - **Fail:** The description conflates types (e.g., using "Curie" when only her role matters).  
  - **Rewrite:**  
    - Default to **narrative-role** descriptions (e.g., "the lead researcher" instead of "Curie").  
    - If *causal-origin* is essential, specify it unambiguously (e.g., "the child born to X and Y").  
    - If types conflict, **narrative-role wins** unless the sentence’s logic relies on origin (rare).  
  *Why: Journalism usually cares about roles (discoveries, decisions), not biology. The copy desk’s rule assumes causal-origin; this avoids that bias.*

  #### **Step 3: Ensure Counterpart Uniqueness**  
  **Test:** Could multiple people fit the counterpart description in the scenario?  
  - **Pass:** The description implies a unique counterpart (e.g., "the committee chair" when only one exists) or uses existential phrasing.  
  - **Fail:** No unique counterpart exists (e.g., "the scientist" when many could fill the role).  
  - **Rewrite:** Use **existential phrasing** (e.g., "some scientist," "a person") or add specificity (e.g., "the first team to access the data").  
  *Why: Ambiguity implies transworld identity. Existential phrasing forces the reader to accept "someone" without assuming "someone specific."*

  #### **Step 4: Break Counterfactual Chains**  
  **Test:** Does the sentence chain multiple "what ifs" (e.g., "If X, then Y, then Z")? If yes, check if it assumes the *same* individual across steps.  
  - **Pass:** Each step uses role descriptions or allows for counterpart variation.  
  - **Fail:** It reuses a name/definite description across steps (e.g., "If X, Smith would have done Y, and then Smith would have done Z").  
  - **Rewrite:**  
    - Reset descriptions at each step (e.g., "If X, a new director would have been appointed. That person might then have done Y...").  
    - Add hedging words ("might," "could") to acknowledge counterpart variability.  
  *Why: Counterpart relations aren’t transitive. Chaining assumes one person’s journey across worlds, violating the metaphysics.*

  #### **Step 5: Align with Explanatory Purpose**  
  **Test:** Is the counterpart description *minimal* and focused *only* on what the sentence aims to explain?  
  - **Pass:** The description includes **only details relevant to the point** (e.g., "the discoverer" for a priority dispute).  
  - **Fail:** It adds irrelevant biographical/historical details (e.g., "the Harvard-trained director" when education doesn’t matter).  
  - **Rewrite:** Strip superfluous details. Use the leanest role/origin description.  
  *Why: "Closeness" is determined by explanatory goals, not overall similarity. Extraneous details imply identity.*

  ---

  ### **Applied to Your Cases**  
  *Each test run in sequence; rewrites reflect all steps.*

  #### **Case 1: Competing Labs and Discovery**  
  **Original:** "If the grant had gone to the other lab, Einstein would have discovered relativity by 1910."  
  - **Step 1:** Fail (uses "Einstein" as an experiencer).  
  - **Step 2:** Pass once rewritten (narrative-role is sufficient; origin isn’t needed).  
  - **Step 3:** Fail (no unique scientist in "other lab").  
  - **Step 4:** Pass (no chain).  
  - **Step 5:** Pass (role is explanatory).  
  - **Rewrite:** "If the grant had gone to the other lab, *someone there* might have discovered relativity by 1910."  
  *Why: Avoids implying Einstein exists twice. Uses existential phrasing for non-uniqueness.*

  #### **Case 2: Biography and Lost Potential**  
  **Original:** "Without the Holocaust, Anne Frank would have grown up to be a writer."  
  - **Step 1:** Fail (implies Anne Frank experiences the counterfactual).  
  - **Step 2:** **Conflict** – Narrative role ("diarist") vs. causal origin (Anne as a specific person).  
    - *Adjudication:* Causal-origin *seems* essential (it’s about *her*), but the sentence’s purpose is about *lost potential*. Narrative role suffices.  
  - **Step 3:** Pass if rewritten (no uniqueness issue).  
  - **Step 4:** Pass (no chain).  
  - **Step 5:** Fail if using origin (biographical details distract from the point about potential).  
  - **Rewrite:** "Without the Holocaust, *a young diarist like Anne Frank* might have grown up to become a writer."  
  *Why the Spoiler:* The rewrite feels impersonal but avoids claiming a *specific* person (Anne) could exist in two worlds. The argument: Your paragraph likely resonates because readers project Anne’s *story* onto the counterfactual. The procedure preserves that narrative role while dodging the copy desk’s rule. For "millions of children," rewrite: "Historical catastrophe X robbed the world of millions of potential futures—among them, *some who might have become* scientists or artists." Existential phrasing sidesteps assigning experiences to non-existent individuals.

  #### **Case 3: Office/Committee Decision**  
  **Original:** "If the committee had chosen Smith, the agency director would have opposed the policy."  
  - **Step 1:** Pass (no named experiencer in the role; "director" is a title).  
  - **Step 2:** **Conflict** – "Smith" implies causal-origin; "director" implies role.  
    - *Adjudication:* Narrative role wins unless Smith’s *personal traits* are key. If Smith is unknown to readers, rewrite for clarity.  
  - **Step 3:** Fail if "the director" is ambiguous (e.g., if others could hold the role).  
  - **Step 4:** Pass (no chain).  
  - **Step 5:** Pass if role-focused.  
  - **Rewrite:** "If the committee had chosen Smith, *that director* would have opposed the policy."  
  *Why:* "That director" anchors the role to the counterfactual choice. If Smith’s traits matter, add: "...and Smith, in that role, would likely have opposed..."

  ---

  ### **What the Procedure Cannot Do**  
  1. **Editorial Judgment Calls:**  
     - When causal-origin vs. narrative-role is *truly ambiguous* (e.g., "Einstein’s rival"), it flags the conflict but can’t resolve it—you must decide based on the column’s point.  
     - Sentences where existential phrasing gut-punches emotional impact (e.g., "a child like Anne Frank") are unavoidable trade-offs.  
  2. **Deadline Misfires:**  
     - Complex chains may require multiple rewrites; if stuck, default to role + existential phrasing ("someone in that position might...").  
     - Readers might *still* infer identity from role descriptions; the procedure minimizes this but can’t eliminate it.  
  3. **Metaphysical Limits:**  
     - It can’t predict how a sentence "lands" if readers ignore hedging (e.g., "might" vs. "would").  
     - If the explanatory purpose is vague, the procedure fails; you must clarify the goal first.  
     - It doesn’t handle "impossible counterparts" (e.g., a person with two birth parents) cleanly—rewrites get clunky.  

  **Bottom line:** This procedure enforces discipline by defaulting to narrative-role counterparts and existential phrasing. It resolves 80% of disputes by targeting the copy desk’s rule, but the final 20% requires your judgment on what the story needs. For your column, lean into role-based language—it’s the journalist’s tool, while the copy desk defaults to biology.
