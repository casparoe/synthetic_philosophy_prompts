answer: |-
  ## The Soft Ledger

  The air in the Ledger Room hung thick with dust motes and the scent of old paper and ozone. Arvel, his clerk’s visor low over his eyes, meticulously transcribed the latest soft finding into the great, leather-bound volume – the Soft Ledger. It concerned the *Martlet*, vanished three months ago somewhere between Singapore and Colombo: cargo, hull, freight, all swallowed by the indifferent sea. Now, the underwriters waited, their fortunes suspended in the Ledger’s probabilistic web.

  "Finding 147-M," Arvel murmured, his pen scratching. "Source: Wireless station, Penang. Text: 'Martlet passed 0600 GMT. Heavy squalls reported vicinity. Signal weak, garbled. Master’s voice… stress? Unclear.'" He paused, calculating the partition. This carved the space of possibilities into cells defined by *Weather Severity* – Calm, Moderate, Severe. The garbled report, hinting at stress but confirming squalls, shifted the odds. He applied the kinematics, holding fixed the conditional probabilities of the ultimate causes – *Foundered* (hull failure), *Sank* (external peril), *Other* – within each weather cell. The recomputed probabilities rippled through the Ledger, subtly tilting liability towards the Hull Underwriters. The Syndicate of the Dolphin would be pleased; the Golden Anchor Cargo Consortium, less so.

  Across the room, Senior Surveyor Magda Vance studied a grainy photograph. It showed the *Martlet* in Singapore harbour, taken by a dockworker days before sailing. The hull plating near the waterline was a blurry smudge. Finding 143-M. Filed earlier, it had partitioned on *Hull Integrity* – Sound, Questionable, Unsound – shifting odds towards Foundered. Magda squinted. "Arvel," she called, her voice sharp. "This blur… I initially thought it suggested pitting, corrosion. But look at the angle of the sun, the wake… the photographer was further out, on a moving lighter. At that distance, in that chop, *any* hull detail would blur. This might just be… motion."

  Arvel looked up, perturbed. "The finding is absorbed, Surveyor Vance. Sequential Integrity. We moved on."

  "But the *meaning*," Magda insisted, tapping the photo. "The conditional probability of 'Unsound Hull' *given* this blurry image… isn't fixed. The context changes it. If he was close, blur implies defect. If he was far out, blur is just… blur. Meaningless." She wasn't revising the *finding*, she was revising what the finding *indicated* about the state of the hull itself, undermining the fixed conditionals the kinematics relied upon. The doctrine had no grip on her intuition. Arvel simply adjusted his visor. The Ledger didn't accommodate epiphanies, only sequences.

  The crisis arrived like a quiet thunderclap. Two couriers entered simultaneously – one from the telegraph office bearing a flimsy yellow sheet, the other from the docks, clutching a sealed envelope smelling faintly of salt and engine oil.

  "Finding for the *Martlet*," announced the telegraph courier.
  "Finding for the *Martlet*," echoed the satchel carrier.

  Arvel took both. The telegraph sheet was Finding 149-M: "Statement from Able Seaman Jenkins (recovered fever, Batavia). Recalls Master arguing violently with Chief Engineer re: boiler pressures days before Singapore. Jenkins unsure if resolved." A partition on *Master's Conduct* – Prudent, Strained, Reckless. It bore the telegraph office timestamp: 14:03 GMT.

  The envelope contained Finding 150-M: "Oil sample, labeled 'Martlet Engine Room Bilge, Singapore Departure.' Lab analysis: High particulate count, viscosity abnormal. Origin verification: 'From Stevedore Foreman Cobb, memory hazy re: exact collection point.'" A partition on *Engine Condition* – Normal, Degraded, Critical. It was stamped 'Received Docks Registry' at 14:03 GMT.

  *Simultaneous*. Arvel’s blood ran cold. Sequential Integrity demanded an order. But which was first? The wire *sent* at 14:03? The sample *received* at 14:03? There was no deeper timestamp, no universal arbiter. The Ledger, the entire doctrine, froze.

  The tribunal convened in the oak-paneled hearing room, the weight of the *Martlet*'s loss pressing down. Syndicate representatives sat stiffly – Baines for Dolphin Hull, Mrs. Enderby for Golden Anchor Cargo, others lining the walls. Arvel presented the dilemma.

  "Two soft findings," Chief Adjuster Holmstead intoned, his voice gravelly. "149-M: Master's argument, suggestive of strained conduct. 150-M: Suspect oil sample, suggestive of degraded engines. Filed simultaneously. Sequential Integrity requires an order. Without it…" He spread his hands.

  "We must privilege the *evidential* sequence," argued Baines, Dolphin’s man. "The *oil sample* pertains to the *engine*, a physical state *existing* before the voyage, potentially causative. The *argument* is an *event* occurring later. The condition precedes the conduct! Sample 150-M *must* be absorbed first!"

  "Nonsense!" countered Mrs. Enderby, representing the cargo interests liable if the ship was lost due to external peril or crew fault. "The *argument* reveals the Master's *state of mind* *before* Singapore! It informs the *context* in which any engine condition existed! Did he ignore the problem? The argument finding 149-M *must* come first!"

  Arvel, under instruction, performed the calculations silently twice. He slid two sheets to Holmstead.

  *Sequence A (Oil Sample First):*
  1.  Finding 150-M (Engine Degraded? Partition): Shifts odds towards Foundered (hull/engine failure). Conditional probabilities of Foundered/Sank/Other *given* each engine state are held fixed.
  2.  Finding 149-M (Master Strained? Partition): Absorbed *into the new probability distribution*. The strained conduct finding, interpreted *after* the engine is already suspect, strongly suggests negligence in addressing it, further loading liability onto the Hull Underwriters. Dolphin Syndicate faces 62% of hull loss.

  *Sequence B (Argument First):*
  1.  Finding 149-M (Master Strained? Partition): Shifts odds slightly towards Reckless Conduct potentially leading to misadventure (Sank or Foundered). Conditionals held fixed.
  2.  Finding 150-M (Engine Degraded? Partition): Absorbed *now*. The suspect oil, interpreted *after* establishing potential recklessness, appears less like an inherent flaw and more like a consequence of poor management – shifting liability *away* from pure hull failure and towards the freight and cargo policies covering crew negligence. Dolphin Syndicate liability drops to 48%. Golden Anchor’s exposure increases sharply.

  A fourteen-percent swing. Over £12,000. Someone’s ruin, someone’s windfall, hinging on an unknowable sequence.

  "Preposterous!" Baines slammed a fist on the table. "The physical evidence of the *engine* must take precedence!"

  "Only if you ignore the human element!" Mrs. Enderby retorted. "A sound engine mismanaged is as deadly as a rotten one!"

  Magda Vance spoke from the corner, her gaze fixed on the blurred harbour photo she still held. "The doctrine fails here. Sequential Integrity crumbles because the channels themselves – the wire, the satchel, the fog of reporting – are *part* of the evidence, but not modeled. We treat the *finding* as a direct probability shifter, a fiat. But what we *have* is a *report* of an argument, a *sample* of dubious origin *labeled* as bilge oil. The *likelihood* of receiving *this specific report* or *this specific sample* given the *actual* state of the master or the engine… *that* might be order-independent."

  Holmstead steepled his fingers. "You propose… modeling the *process*? The chance a stressed seaman remembers an argument? The probability a hazy stevedore mislabels a sample?"

  "Exactly," Magda said. "Instead of saying 'this finding shifts the odds on Engine Condition by this amount,' we'd say '*given* the engine was Degraded, *this* is the likelihood we'd get *this specific* ambiguous oil report from Cobb.' And similarly for the argument report. Then, we condition *simultaneously* on the hard fact that *both reports exist*. The order vanishes. The Ledger…" she gestured at the great book, "...is under-described. It lacks the machinery to handle the noise in its own inputs."

  A heavy silence fell. The solution was clear, conceptually – build a generative model, include the evidence channels, condition on the existence of the findings. But it was monumental, alien to decades of practice. The mathematics existed, but the Ledger, the tribunal, the entire edifice of Sequential Integrity, did not.

  "And while we debate epistemology," Baines growled, "my syndicate faces ruin based on which pigeon flew faster?"

  "There *is* no fact of the matter," Holmstead said wearily. "No faster pigeon. No hidden timestamp. Sequential Integrity requires sequence. There is none."

  "Then privilege the temporal receipt!" insisted Mrs. Enderby. "The satchel arrived *at the door* simultaneously, but the wire was *logged* milliseconds earlier by the machine!"

  "Artefact!" Baines shot back. "Meaningless!"

  "Or privilege causation," suggested another adjuster. "The oil sample *existed* before the argument *occurred*..."

  "...But we *learned* of the argument *report_ first in some sense..."

  The arguments swirled, technical, desperate, philosophical. Principled grounds dissolved into special pleading. The formal beauty of Sequential Integrity lay shattered on the rocks of simultaneity. Magda watched them, thinking of her blurred photo. Her initial interpretation *had* changed. The conditionals weren't fixed, not really. The Ledger was a beautiful, fragile clockwork mechanism, precise only when fed discrete, ordered ticks. Reality was a storm of overlapping waves.

  Holmstead raised a hand, silencing the room. The air crackled with suspended fortunes. "The tribunal acknowledges the impasse. The doctrine of Sequential Integrity provides no resolution for simultaneous filings. The Soft Ledger, as currently constituted, cannot apportion the *Martlet*'s loss."

  He looked at the two findings lying side-by-side on the polished table – the flimsy wire report whispering of anger, the envelope holding the dark, dubious oil. They existed. They mattered. But their order did not, and the Ledger had no language for that.

  "The case," Holmstead pronounced, the word heavy as an anchor, "is held in abeyance. Pending…" he paused, looking at Magda, then at the vast, silent Ledger, "...pending reconsideration of the fundamental model. Adjourned."

  The representatives erupted, but Holmstead was already rising. Arvel stared at the open Ledger, the neat columns frozen mid-calculation. The probabilities for the *Martlet*, for hull, cargo, freight, hung suspended – not by the sea, but by the unresolved tension between two ambiguous whispers arriving at the same unmarked moment. The Soft Ledger, it seemed, needed to learn a new kind of arithmetic, or admit its own profound silence. The dust motes danced in the still air, undisturbed by the weight of the unmade decision.
