answer: |-
  ### Decision Procedure for Reparations Claims

  Below is a structured decision procedure designed for efficiency, honesty in degradation, and alignment with the statutory mandate. It prioritizes **enrichment claims** over harm claims to avoid counterfactual complexities, but retains harm claims as a fallback for cases where enrichment cannot be traced. The procedure addresses the "anyway" and "mixed-claimant" defenses explicitly and includes thresholds for evidence, clear denial points, Commissioner referrals, and handling of missing archives. It is designed for caseworkers with minimal training (half-day per file, 2 days training).

  #### Core Principles
  1. **Enrichment Claims Preferred**: Focus on identifiable assets/profits unjustly taken and still held. Avoids speculative harm tracing and counterfactuals (e.g., "claimants wouldn't exist" issue).
  2. **Harm Claims as Fallback**: Compensates for the initial loss when enrichment is untraceable, using the **value at the time of the wrong** (not group counterfactuals).
  3. **Defenses Neutralized**:
     - **"Anyway" defense**: Rejected—lawful future hypotheticals do not negate the wrong.
     - **Mixed-claimant cases**: Do not defeat claims—compensation is for past wrongs, not current ownership.
  4. **Degrades Honestly**: Returns "no" when evidence is missing or contradicted; never assumes silently.

  ---

  ### Procedure: Order of Questions, Thresholds, and Outcomes  
  *(Follow strictly; each file starts at Question 1)*  

  #### **Question 1: Qualifying Wrong?**  
  *Is the alleged wrong listed in the Act by date/category?*  
  - **Evidence Threshold**: Claimant must cite a specific wrong from the Act’s list (date + category: dispossession, forced labor, or cattle seizure). Caseworker checks the Act.  
  - **Missing Archives**: Accept claimant’s description unless implausible (e.g., wrong pre-dates Act’s scope).  
  - **Clear No**: Wrong not listed or implausible.  
  - **Proceed If**: Wrong is listed.  

  #### **Question 2: Claimant Group Link?**  
  *Does the claimant group trace to victims of the wrong?*  
  - **Evidence Threshold**: Claimant must describe a lineage (e.g., "we descend from households dispossessed in [year]"). Archives must not contradict; if silent, accept.  
  - **Missing Archives**: Accept claimant’s narrative unless internally inconsistent.  
  - **Clear No**: No link described or archives refute (e.g., victims were a different group).  
  - **Proceed If**: Link is plausible.  

  #### **Question 3: Wrong Occurred?**  
  *Did the wrong happen to the linked victims?*  
  - **Evidence Threshold**: Claimant’s account must align with the wrong’s nature (e.g., for dispossession: land held pre-wrong). Archives must not refute; if silent, accept.  
  - **Missing Archives**: Accept claimant’s account unless contradicted by other files or logic (e.g., land records show no transfer).  
  - **Clear No**: Archives refute (e.g., land was sold voluntarily).  
  - **Proceed If**: Wrong occurred.  

  #### **Question 4: Full Compensation?**  
  *Was there full compensation at the time of the wrong?*  
  - **Evidence Threshold**: Archives or claimant must show payment (e.g., receipts, treaties). If archives silent, assume no.  
  - **Missing Archives**: Assume no compensation.  
  - **Clear No**: Evidence of full compensation.  
  - **Proceed If**: No full compensation.  

  #### **Question 5: Enrichment Traceable?**  
  *Can a taken asset/profit be traced to a present holder?*  
  - **Evidence Threshold**:  
    - Asset (land/cattle): Chain of title from wrong to present.  
    - Forced labor: Profits generated (e.g., estate revenues) traceable to a holder.  
    - Caseworker checks for breaks (e.g., asset destroyed, proceeds spent on consumables).  
  - **Tracing Rules**:  
    - **Direct trace**: Asset/proceeds still exist (e.g., land, bank assets from profits).  
    - **No trace**: Proceeds commingled/dissipated (e.g., profits spent on salaries).  
  - **Missing Archives**: Accept claimant’s trace narrative if logical (e.g., "land became Park").  
  - **Clear No**: Trace broken (e.g., asset destroyed).  
  - **Proceed to Harm Claim (Question 7) If**: Untraceable.  
  - **Proceed to Question 6 If**: Traceable.  

  #### **Question 6: Present Holder is Claimant Group?**  
  *Does the claimant group legally own the asset/holder now?*  
  - **Evidence Threshold**: Current title deeds, shareholder registries, or trust documents showing claimant group as owner/beneficiary.  
  - **Focus**: Legal ownership—**not** indirect benefit (e.g., using a hospital ≠ owning it).  
  - **Missing Archives**: Assume no ownership unless claimant admits it.  
  - **Clear No**: Holder is claimant group (e.g., community owns the land now).  
  - **Valid Claim (Enrichment) If**: Holder ≠ claimant group.  

  #### **Question 7: Harm Reversed?** (Harm Claim Path)  
  *Was the initial loss reversed (e.g., asset returned or compensated later)?*  
  - **Evidence Threshold**: Archives show reversal (e.g., land returned, post-wrong payment).  
  - **Missing Archives**: Assume no reversal.  
  - **Clear No**: Reversal evidenced.  
  - **Valid Claim (Harm) If**: No reversal.  

  ### Commissioner Referrals  
  - **No referrals in this procedure**. All questions are factual. Values-based issues (e.g., "fairness" of mixed claimants) are resolved by the procedure’s rules.  

  ### Defenses Handled  
  1. **"Anyway" Defense**:  
     - Rejected at **Question 3**—hypothetical lawful takings do not negate the actual wrong.  
     - May affect quantum (not liability) if raised later.  
  2. **Mixed-Claimant Cases**:  
     - Addressed at **Question 6**—claimant group ownership defeats enrichment claims.  
     - Indirect benefits (e.g., pension funds) do **not** defeat claims—reparations address past harm, not present equity.  

  ### Missing Evidence  
  - **General Rule**: Accept claimant’s narrative unless archives contradict or it is implausible.  
  - **"Degrades Honestly"**: Returns "no" at clear denial points (e.g., trace broken in Q5, compensation in Q4). Never defaults to "no" silently—caseworker must note why.  

  --- 

  ### Test Cases  

  #### **Case 1: Community vs. National Park (Land, 1891)**  
  - **Defenses**: Anyway (1912 statute), successor state inherits perpetrators.  
  - **Procedure**:  
    1. **Q1**: Dispossession listed? → Yes.  
    2. **Q2**: Claimants descend from victims? → Yes (dispossessed + laborers).  
    3. **Q3**: Wrong occurred? → Archives support/silent → Yes.  
    4. **Q4**: Full compensation? → No.  
    5. **Q5**: Trace asset? → Land → Park (state) → Traceable.  
    6. **Q6**: Holder = claimant? → State ≠ claimants → **Valid (Enrichment)**.  
  - **Defenses Rejected**:  
    - Anyway: Irrelevant (Q3).  
    - Successor state: Reparations fund (not state liability) → ignored.  

  #### **Case 2: Community vs. Bank (Forced Labor Profits)**  
  - **Defenses**: Arm’s-length merger, mixed claimants (pension funds).  
  - **Procedure**:  
    1. **Q1**: Forced labor listed? → Yes.  
    2. **Q2**: Claimants descend from laborers? → Yes.  
    3. **Q3**: Wrong occurred? → Yes.  
    4. **Q4**: Full compensation? → No.  
    5. **Q5**: Trace profits? → Labor → estate profits → mortgage repayments → bank. Proceeds commingled? → **No trace** (money spent/dissipated).  
    6. **Q7**: Harm reversed? → No → **Valid (Harm)**.  
  - **Defenses Rejected**:  
    - Merger: Affects trace (Q5), not liability.  
    - Mixed claimants: Pension funds ≠ legal ownership (Q6 not reached).  

  #### **Case 3: Community vs. Religious Order (Forced Labor, 1934)**  
  - **Context**: Order insolvent; hospital/school serve claimants. Harm claim fails counterfactually.  
  - **Procedure**:  
    1. **Q1**: Forced labor listed? → Yes.  
    2. **Q2**: Claimants descend from laborers? → Yes.  
    3. **Q3**: Wrong occurred? → Yes.  
    4. **Q4**: Full compensation? → No.  
    5. **Q5**: Trace asset? → Labor value → mission → hospital/school (order) → **Traceable**.  
    6. **Q6**: Holder = claimant? → Order ≠ claimants → **Valid (Enrichment)**.  
  - **Outcome**: Claim valid. The hospital is **not charged**—reparations come from the fund. Serving claimants ≠ ownership.  
  - **Why Harm Claim Avoided**: Enrichment path succeeds; no need for counterfactuals.  

  ---  

  ### What the Procedure Cannot Do  
  1. **Ration the Fund**:  
     - The procedure **only establishes eligibility** (liability). It does not allocate amounts.  
     - Rationing is a **separate step**: Prorate compensation across valid claims based on initial loss value (enrichment: value at taking; harm: value at taking).  
     - The framework **does not sneak in rationing**—e.g., rejecting "mixed claimants" is based on legal ownership, not fund limits.  

  2. **Quantum Determination**:  
     - Assigns no dollar amounts. Requires a post-eligibility process (e.g., historical valuation + inflation).  

  3. **Novel Value Judgments**:  
     - Commissioner referrals are excluded—questions are factual. If values arise (e.g., "fairness" of partial reversals), they are deferred to rationing.  

  4. **Post-Wrong Changes**:  
     - Does not adjust for modern benefits (e.g., community using the hospital). This is intentional—reparations address history.  

  ### Weakest Step and Personal Overrule  
  - **Weakest Step**: **Question 5 (Tracing)**.  
    - Why: Tracing profits (e.g., forced labor → bank assets) is often speculative with commingled funds. Caseworkers may over/underestimate dissipation.  
    - Mitigation: Strict "direct trace" rule (no guesswork).  
  - **Personal Overrule Case**: If a claimant group **admitted** they reacquired the asset post-wrong (e.g., bought land back) but omitted it, I would reject even if archives are silent. The procedure (Q6) catches this only if documented.  

  ### Final Notes  
  - **Efficiency**: 5–7 clear yes/no questions. Caseworkers flag only complex traces (Q5) for legal review.  
  - **Honest Degradation**: Returns "no" at Q3–Q7 if evidence is missing or contradicted.  
  - **Statutory Alignment**: Focuses on the Act’s "qualifying wrong" and "loss" with minimal overreach.  

  This procedure prioritizes reparative justice while acknowledging practical constraints. Use it as the first word—not the last—on these claims.
