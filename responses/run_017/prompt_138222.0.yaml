  Okay, let me start by unpacking this user's dilemma. They're teaching a seminar on decision-making under normative uncertainty and have hit a logical wall. Their argument concludes that expected choice-worthiness (EC) maximization is impossible due to incommensurability issues, but they find this conclusion unacceptable because it invalidates many practical applications like legislative compromise or everyday moral hedging.

  First, I need to trace their argument step by step. Premise (1) states that rationality requires maximizing EC under moral uncertainty. (2) notes this requires intertheoretic comparisons, which (3) argues is impossible because theories assess different objects (acts, rules, etc.). This leads to (4)'s claim that EC is undefined. (5-6) show normalization fixes this but introduces option-set sensitivity, making rational choice arbitrary (7-8), concluding EC is empty (9).

  The user's distress comes from the argument overgeneralizing: it would also condemn cost-benefit analysis or legislative bargaining, and contradicts intuitive cases (e.g., abstaining when torn between "permissible" and "seriously wrong"). They'd rather keep (1) and (6) but need to resolve the contradiction.

  I recall Will MacAskill's work on this. The key flaw is in premise (3)'s claim that no common assessment unit exists. While theories *appear* to assess different objects, their *practical implications for action* can be compared indirectly. For example, a virtue ethicist's "act kindly" translates to concrete actions overlapping with deontological rules. 

  The normalization problems in (6) are real but manageable. Option-set sensitivity is mitigated by using fixed normalization anchors (e.g., theory-specific worst/best *possible* acts) or variance-stabilizing methods. The arbitrariness isn't fatal—it's analogous to setting measurement units in physics.

  For the user's intuitive case: even if theories disagree fundamentally, we *do* make cross-theoretic comparisons in practice. The regulator example succeeds because theories agree on a proxy (e.g., welfare metrics), showing premise (3) overstates incommensurability.

  Surrendering (3) preserves EC's core while acknowledging comparability isn't perfect. It commits the user to:  
  - Defending "practical equivalence" across theories  
  - Accepting some normalization arbitrariness as unavoidable  
  - Granting that EC works best when theories share implicit scales  

  This saves mundane cases (abstaining when uncertain) without overgeneralizing to legislative contexts where compromise operates differently. The key insight is that EC relies on *action-guiding outputs*, not ontological commitments of theories.
answer: |-
  Your argument is a powerful critique of expected choice-worthiness (EC) maximization under normative uncertainty. The flaw lies in **premise (3)**, which overstates the incommensurability problem. Let me diagnose why this premise fails and what surrendering it entails.

  ### The Problem with Premise (3)
  You claim:  
  > *"Theories disagree about what is assessed... There is no unit of assessment common to them all."*

  This is **not universally true**. While theories *do* differ in their *primary objects of evaluation* (acts, rules, motives, etc.), they **all ultimately imply practical verdicts about *actions***. Moral theories are action-guiding: they prescribe which actions we ought to take in concrete situations. A virtue ethicist might evaluate character, but when asked "Should I lie in this case?", the theory outputs a verdict on *the act of lying*. Similarly, a rule-utilitarian assesses rules, but for a specific act, it prescribes "follow rule R" (e.g., "don't lie").  

  **Why (3) looked sound**:  
  It correctly identifies that theories lack a *metaphysically unified* scale (e.g., "utils" or "deontic units"). But EC doesn't require this—it only needs *practically comparable* verdicts. We compare theories not at the level of their foundations but at the level of **action recommendations in context**.

  ### Surrendering (3) and Its Implications
  Rejecting (3) means accepting that:  
  **1. Theories *can* be compared via their action-guiding outputs.**  
     - *Example*: A deontologist says "lying is forbidden" (choice-worthiness = -10). A utilitarian says "lying maximizes welfare here" (choice-worthiness = +5). We don't need a "universal moral unit"; we need to know how strongly each theory *dis/prefers this act relative to alternatives*.  
     - *Commitment*: You must accept that cross-theoretic comparisons are possible *when theories share a common action set*, even if their justifications differ.  

  **2. Normalization (step 5) is necessary but manageable.**  
     - Yes, normalization is sensitive to the option set (step 6). But this isn't fatal:  
       - **Fix the scale independently**: Normalize each theory to a fixed range (e.g., "best possible act" = 1, "worst possible act" = 0) *across all conceivable acts*, not just available options. This avoids option-set sensitivity.  
       - **Use variance-sensitive normalization**: Scale theories by their *spread* across possible worlds, not just the current menu.  
     - *Commitment*: You must accept that normalization requires pragmatic choices—but this is true of *any* aggregation (e.g., currency exchange rates in cost-benefit analysis).  

  **3. Mundane cases are preserved.**  
     - Your "abstaining" example: Suppose you have 50% credence in Theory A (abstaining is permissible, worth 0) and 50% in Theory B (abstaining is seriously wrong, worth -10). EC = (0.5×0) + (0.5×-10) = -5. If voting "yes" has EC > -5, abstaining is irrational. This matches your intuition.  

  **4. Legislative/regulatory contexts are distinguishable.**  
     - Unlike moral uncertainty, these involve *interpersonal* aggregation (many people's preferences), not *intrapersonal* uncertainty. EC maximization applies to the latter—where *you* are uncertain, but must choose *one* action. Legislatures use voting or bargaining, not EC maximization.  
     - Cost-benefit analysis *assumes* a common scale (e.g., dollars) and isn't invalidated by your argument.  

  ### Where Your Argument Succeeds
  - **Step 6 is correct**: Naive normalization (e.g., rescaling to [0,1] over available options) *is* arbitrary and option-set-dependent.  
  - **Step 7 follows**: Without care, EC *can* be manipulated by adding irrelevant options.  

  But this doesn't doom EC—it shows we need **better normalization methods**. For example:  
  - **Intertheoretic comparisons via overlapping options**: If two theories both condemn torture but praise charity, we can anchor scales by assigning fixed values to these "pivotal acts."  
  - **Proxy comparisons**: Use shared empirical proxies (e.g., welfare, rights violations) to map theories onto a common metric.  

  ### Revised Position
  1. **Keep (1)**: EC maximization is rational under normative uncertainty *if* cross-theoretic comparisons are possible.  
  2. **Fix (3)**: Theories *can* be compared via their action verdicts.  
  3. **Mitigate (6)**: Use robust normalization (e.g., fixed anchors like "theory-specific best/worst possible acts").  

  **Cost of surrender**: You must defend that:  
  - Moral theories, despite foundational differences, output *action verdicts* that can be cardinally compared.  
  - Normalization is imperfect but feasible (e.g., like comparing temperature scales via fixed points like freezing water).  

  This preserves EC for mundane cases while acknowledging its limitations in radical incommensurability (e.g., comparing a Buddhist ethic of detachment with Roman honor ethics). But even there, we often *do* make rough comparisons—suggesting premise (3) overgeneralizes.  

  *"Uncertainty doesn't absolve us of the need to act; it demands we act with epistemic humility. EC maximization is that humility made practical."* — Your seminar deserves this nuance.
