  1. **Mapping players** - They want to test if Hardin's "boat" metaphor even fits a scenario where the crisis isn't about admitting outsiders but purging insiders. The dinghy's "capacity of zero" is a brilliant observation—it torpedoes Hardin's core premise. 
  2. **Capacity/selection split** - Here's their key insight: Lifeboat ethics quietly assumes the initial occupants deserve their spots. The Mignonette forces us to ask: what if they don't? 
  3. **Timing paradox** - Dudley killed early for blood, making the act seem *less* defensible by conventional "last resort" standards. The user wants this tradeoff formalized. 
  4. **Brooks' incoherence** - Can you reject participation but accept benefits? And since the killing "worked," must Hardin endorse it? 
  5. **William Brown contrast** - Why similar punishments for dissimilar acts? The user hints this exposes arbitrariness in real-world judgments. 
  6. **Metaphor reversal** - They suspect lifeboat dilemmas *actually* involve jettisoning people more often than rescuing them, inverting Hardin's intent. 

