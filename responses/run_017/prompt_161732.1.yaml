prompt: |-
  Hi — I help run a small survival server that's been going for about six years, and I'm trying to write an actual written conduct policy (we've been doing it by vibes until now), and I keep hitting the same wall in the arguements.

  Here's the shape of it. Player A spends four months building a cathedral. Player B blows it up with TNT, wich is obnoxious but isn't against any rule. A says: "you destroyed something real." B says: "nothing was destroyed, it's data on a hard drive, you're comparing a pile of blocks to losing your house." A then spends three pages arguing about how many hours went into it, which completely misses what B meant — B wasn't denying the hours, he was saying the loss doesn't weigh much. Then the reverse case: we announced a world reset last year, players said "you're erasing something real", I heard that as "this is as bad as demolishing a town", said something snippy about it being only a game, and only later realised they just meant "there is a thing here that we care about and you're ending it without asking us first."

  So my rough read is that "real" is doing two jobs — is-there-a-thing-there at all versus does-it-matter-enough — and each side hears the other as talking about the wrong one. But I think there might be a third thing going on too: sometimes people aren't claiming anything about what the object is and are instead saying what stance we should adopt ("griefing should count as a real offence in the rules even though this is a game"). I can't tell if that's a third sense or just what the second one turns into once you stop trying to settle it.

  Someone on our forum said it's plain equivocation, and someone else said it's a "merely verbal" dispute. Neither feels right to me. Both senses of "real" are perfectly coherent on their own, so it isn't a word shifting meaning mid-sentence in a way you can catch; and it doesn't feel empty either, because once you clear it up there's still a genuine fight about whether the loss counts for anything and how much.

  So: is there an established concept for this configuration — the slide between existence and significance, plus the projective "treat it as real" bit — or is it three separate things I'm lumping together? If it's nearest to some existing idea, tell me which one and where exactly my description stops matching it. If there's nothing, coin a term and define it, and give me the boundary cases: does the same thing cover money, insults, flags, anything whose existence depends on people agreeing? I need the carving more than the label, because the rule I'm writing has to be answering one specific question rather than three. I'm not an academic, so keep it plain where you can — and please answer in British English.
reasoning: |-
  Okay, the user runs a small survival Minecraft server and is struggling to write a conduct policy because of arguments about what's "real." They've noticed that the word "real" is causing confusion between players. For example, when someone destroys a build, one player says it's real because of the effort, while the other says it's just data. There's also the case of a world reset where players felt their creations were "real" and mattered, but the admin initially dismissed it as just a game.

  The user identifies two main uses of "real": existence (is there a thing) and significance (does it matter). They also mention a third aspect where "real" is about how rules should treat actions, like considering griefing a real offense. They want to know if there's an established concept for this or if they need a new term. The goal is to clarify the policy by addressing the right question without getting tangled in these debates.

  First, I need to recall philosophical concepts. The existence vs. significance split reminds me of ontology (what exists) and axiology (values). The third part about rules seems like deontology or norm-setting. John Searle's "institutional facts" come to mind—things that exist because of collective agreement, like money or property. That fits here because builds in Minecraft exist due to server rules and player effort, making them real in that context.

  Searle's distinction between brute facts (physical existence) and institutional facts (socially constructed) seems relevant. Players like B focus on brute facts (data on a hard drive), while A emphasizes institutional facts (the build as a creation with effort). The significance comes from the collective agreement on the server about what matters. The policy aspect ties into how rules formalize that agreement.

  The user mentioned money, insults, flags—all institutional facts. So this concept covers those cases. The boundary might be when there's no collective agreement; for example, if a player doesn't recognize the server's norms, but the policy would still apply based on server rules.

  The user needs clear policy language. Instead of using "real," the policy should focus on "protected creations" or "player effort." Define what constitutes a violation based on community effort and agreed norms. For the world reset, it's about consent and process, not whether it's real but how decisions are made.

  So, the key is to frame the policy around institutional facts: creations are valued because the community agrees they matter. The rule should protect player effort and require consensus for major changes. This avoids the "real" debate by shifting to shared norms and rules.
answer: |-
  Right, you've hit on a beautifully messy bit of human language and value assignment that's absolutely crucial for your conduct policy. This isn't *just* equivocation or a merely verbal dispute; it's a collision of **ontological levels** and **modes of valuation** specific to constructed realities like your server. The established concept you're grappling with is most precisely **John Searle's distinction between "Brute Facts" and "Institutional Facts"**, but it needs unpacking and applying to your context. Here's the carving:

  1.  **Brute Fact (What Player B Means by "Not Real"):**
      *   **Definition:** The raw, physical, non-social reality. Independent of human agreement or interpretation.
      *   **Your Server Example:** "A collection of data bytes stored magnetically/electronically on a hard drive." "A configuration of pixels on a screen."
      *   **Boundary Case:** Player B is factually correct at this level. No atoms were rearranged in physical space. The server hardware wasn't physically damaged. *This is the level where "it's only data" lives.*
      *   **Relevance to Policy:** *Almost none.* A conduct policy operating solely at this level is pointless ("No physically melting the server CPU with a blowtorch allowed").

  2.  **Institutional Fact (What Player A & The World-Reset Protesters Mean by "Real"):**
      *   **Definition:** Facts that only exist *because* of collective human agreement, assignment of function, and constitutive rules. Their existence and meaning are *socially constructed*.
      *   **Your Server Example:** "A cathedral." "Player A's build." "Griefing." "A valuable creation." "The server world." "Community effort."
      *   **Mechanism:** Your server has *constitutive rules*. "Placing block X at location Y relative to other blocks constitutes *building a wall*." "Player A spending 4 months placing blocks constitutes *creating a valuable community asset*." "Player B using TNT to scatter those blocks constitutes *griefing/destruction*." "The server admin announcing a reset constitutes *ending the shared world*."
      *   **Significance/Value:** This is where significance *emerges*. The value isn't inherent in the bytes; it's assigned by the community (or individuals within it) *because* of the shared understanding of effort, creativity, purpose, and the rules that govern the space. Player A's "real loss" and the world-reset protest are claims about the *institutional reality* being damaged or ended.
      *   **Boundary Cases:** Money (paper/coins = brute fact; £10 = institutional fact relying on collective belief/trust). Flags (cloth = brute fact; national symbol demanding respect = institutional fact). Insults (sounds/waves = brute fact; offence/harm = institutional fact relying on shared meaning and context). A house (bricks/wood = brute fact; *a home* = institutional fact laden with personal/social significance).
      *   **Relevance to Policy:** *This is the entire domain of your conduct policy.* Your rules exist *within* this institutional layer. They define what constitutes acceptable and unacceptable behaviour *within the constructed reality of the server*.

  3.  **The Normative Projection ("Treat it as real" - Your Third Point):**
      *   **Definition:** This isn't a separate *sense* of "real," but the *practical consequence* of recognising something as an institutional fact. It's the demand that the *significance* attached to the institutional fact be *respected* or *given weight* in rules and actions.
      *   **Your Server Example:** "Griefing *should be treated as* a real offence in the rules." "The potential loss of creations *should be given significant weight* when deciding on a world reset."
      *   **Mechanism:** Once you accept that "Player A's cathedral" is a real *institutional fact* within the server's social reality (not just a brute fact pile of blocks), the next step is determining *how much normative weight* that fact carries. Should its destruction be banned? Punished? Should its existence constrain admin decisions? This is the core of your policy argument.
      *   **Relevance to Policy:** This is the *purpose* of your policy. It translates the significance (value) recognised within the institutional layer into concrete rules and procedures.

  **Where Your Description Fits (and Where it Might Veer):**

  *   **Is-there-a-thing-there:** This maps directly to the recognition of an **Institutional Fact**. Player B denies it exists at this level (seeing only brute facts), while Player A asserts it.
  *   **Does-it-matter-enough:** This is the **Significance/Value** assigned *to* the recognised institutional fact. Player B might technically acknowledge the institutional fact ("Yeah, it's a build") but assigns it *very low significance* compared to Player A.
  *   **Projective "treat it as real":** This is the **Normative Projection** – demanding that the recognised significance be codified into rules (conduct policy) or influence decisions (world reset).

  **Why "Equivocation" and "Merely Verbal" Don't Quite Fit:**

  *   Players *are* often talking past each other by focusing on different levels (B on brute, A on institutional). But it's not *just* wordplay. The core conflict is whether the *institutional layer and its assigned values are legitimate and worthy of protection*. Player B's "it's just data" is often a *dismissal* of the institutional layer's validity or significance, not just a confusion of terms. Calling it equivocation oversimplifies the underlying value clash.

  **The Carving for Your Conduct Policy:**

  1.  **Acknowledge the Institutional Reality:** Explicitly state that within the context of the server, player creations (builds, farms, collaborative projects) are recognised as valuable expressions of effort, creativity, and time invested in the shared world. They are "real" *within the game's social framework*.
  2.  **Define Harm at the Institutional Level:** Frame prohibited actions (griefing, theft, vandalism) not as "destroying data" but as **"destroying or significantly damaging player creations or communal resources built within the game world."** This targets the *institutional fact*.
  3.  **Anchor Significance in Community Values:** State *why* this is prohibited: **"Because it disrespects the significant time, effort, and investment of other players, undermines trust within the community, and damages the shared environment we build together."** This addresses the *significance/value* and provides the rationale for the *normative projection* (the rule itself).
  4.  **For World Resets/Admin Actions:** Establish a principle based on respecting institutional significance: **"Major changes affecting the shared world (like resets) will be discussed transparently with the community well in advance, acknowledging the investment players have made, to reach consensus or provide ample time for adjustment."** This isn't saying the world is physically real, it's saying the *value players have created within it* is real *to them* and must be respected in decision-making *processes*.

  **In British English, Plainly Put:**

  > **Core Principle:** This server is a shared space built on player effort and mutual respect. While we all understand this is a game, the creations, resources, and time invested by players within our world hold real *value to our community*.
  >
  > **Griefing/Vandalism Rule:** Intentionally destroying, significantly damaging, or stealing the creations or major resources of another player without their consent is strictly prohibited. This includes using TNT, lava, creepers, or any other means to ruin builds, farms, or collaborative projects. *(Reason: It disrespects the hard work of others and spoils the shared environment we build together.)*
  >
  > **World Changes/Resets:** We recognise that players invest significant time and care into the server world. Any proposal for a major world-altering event (like a full reset) will be announced at least [X weeks/months] in advance, with clear reasons provided, and open discussion strongly encouraged to understand community views before a final decision is made.

  This approach cuts through the "real" debate by:
  1.  Explicitly recognising the *institutional layer* (creations have value *here*).
  2.  Defining harm *within* that layer (damage to creations).
  3.  Stating the *community-based significance* (respect for effort, shared space).
  4.  Tying the *normative rule* directly to protecting that significance.

  It sidesteps arguing about hard drives and focuses on the shared social contract that makes your server function. Good luck!
