  ## Joint Statement on Community Safety & Institutional Reform
  **Authors:** Marcus Iliffe, Nadia Okonjo
  **Date:** 17 October 2023

  After eighteen months serving on community safety panels following the Meadowgate Scandal, we offer this joint statement. We disagree profoundly on solutions, but find common ground on critical observations and aims. We present shared points, then delineate our core disagreements fairly, including testable differences.

  **Points of Agreement:**

  1.  **The status quo is unsustainable.** The Meadowgate Scandal exposed systemic flaws in trust, accountability, and effectiveness within the current policing model, causing significant community harm.
  2.  **Community safety is paramount.** Everyone deserves to live free from violence, fear, and coercion in their neighbourhoods.
  3.  **Prevention is preferable to response.** Significant investment is needed upstream in social support, mental health services, conflict mediation, youth provision, and economic opportunity to reduce incidents requiring coercive intervention.
  4.  **Victim and community voices are central.** Existing systems often fail to adequately hear, respect, or serve those most affected by harm or institutional failure. New approaches must prioritise their needs and agency.
  5.  **Transparency and accountability are non-negotiable.** All agencies involved in community safety must operate with radical transparency and robust, independent mechanisms for redress.
  6.  **Immediate harm reduction is necessary.** While debating long-term models, practical steps to reduce violence and rebuild trust cannot wait.

  **Enduring Disagreements:**

  | Core Issue          | Reformist Formulation (Marcus)                                                                 | Abolitionist Formulation (Nadia)                                                                 |
  | :------------------ | :--------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------- |
  | **Core Function**   | A reformed, transparent, and community-accountable institution is necessary to uphold the law, protect the vulnerable, and authorise the legitimate, limited use of coercive force when essential to prevent imminent, serious harm. | The function of policing – defined by its monopoly on state violence, coercive social control, and role in upholding systemic inequality – cannot be reformed and must be dissolved. Community safety requires entirely new, non-coercive structures rooted in prevention, social justice, and mutual aid. |
  | **Capacity Question (Test Case: Parkfield Incident)** | An immediate, violent domestic incident at 3am requires a small, highly-trained, specially-equipped, and accountable rapid response unit authorised to use necessary force to protect life. This unit must exist *somewhere* within a reformed public safety framework. | The Parkfield incident underscores the failure of prevention and social support. While immediate intervention is needed, embedding coercive capacity within *any* state institution perpetuates harm. Trained community crisis teams, backed by necessary resources and de-escalation skills, can manage such incidents without a standing armed force. |
  | **Substitution Test** | If all current police functions were transferred to new agencies with different uniforms, powers, and funding, but *any* retained the core authority and capacity for authorised coercive intervention in emergencies, this would constitute necessary reform. The objection is to the *institution's current form*, not the unavoidable need for limited, accountable force. | Transferring functions while retaining any agency with a monopoly on state-sanctioned coercive force merely replicates the core problem under a new name. True abolition requires dissolving the *capacity for authorised state violence* as we know it, shifting entirely to non-coercive models of community care and accountability. |
  | **Record-Keeping Monopoly** | Maintaining an accurate, impartial, and accessible official record of incidents is crucial for accountability, justice, and public transparency, regardless of which agency holds it. The objection is not to the *function* of record-keeping, but to its potential misuse or lack of independence within the current system. | The state's monopoly on defining the "official" version of events is a key mechanism of control, often silencing community narratives and obscuring systemic failures. Dissolving policing includes dissolving its authoritative claim over what happened. Community-led documentation and participatory processes are essential for truth-telling and justice. |

  **Cruxes: Testable Differences**

  | Crux                                                                 | Shared Evidence/Test Case                                   | Reformist Prediction (Marcus)                                                                 | Abolitionist Prediction (Nadia)                                                                 |
  | :------------------------------------------------------------------- | :---------------------------------------------------------- | :------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------- |
  | **1. Can a standing rapid-response unit with coercive capacity operate without causing disproportionate harm or undermining non-coercive approaches?** | The proposed "Community Safety Responder" pilot in the troubled Linden Estate (small teams, rigorous oversight, paired with social workers on day shifts). | The Linden pilot will demonstrate a coercive capacity can operate safely and effectively within strict boundaries, complementing prevention. Harm incidents involving responders will be rare and lower than historical police data. | The Linden pilot will show measurable harm (escalation, disproportionate use of force on minorities, undermining of local trust initiatives) directly linked to the coercive unit's presence and role. |
  | **2. Can non-coercive community crisis teams reliably prevent serious harm in the most acute, violent emergencies?** | Expanding the existing Haverhill Night Mediation Team (unarmed, community-trained) to handle all night calls in its ward for a 6-month trial, including potential violence. | The Haverhill team will struggle with acute violence (e.g., 3am domestic with weapons), requiring external coercive intervention in over 20% of violent calls, leading to delays and preventable harm. | The Haverhill team, with adequate resources and training, will successfully de-escalate over 95% of violent night incidents without external force, demonstrating community capacity when properly supported. |
  | **3. Does dissolving the state's authoritative incident record improve community justice outcomes?** | A parallel reporting trial in the Southfield ward: incidents documented both by a new independent community recorder *and* a pared-down official log, with outcomes tracked. | The independent recorder will produce valuable perspectives but lack the consistency and legal standing needed for reliable justice outcomes. The official log will remain essential. | The independent recorder will capture crucial context and community truth missed by the official log, leading to fairer resolutions and higher community satisfaction with justice processes. |

  **On Defunding:** We agree the call to "defund" represents a demand for immediate, significant reallocation of resources from policing to community-based prevention and social services. Nadia views it as an essential step towards abolition. Marcus views it as a necessary rebalancing within a reformed system containing a smaller, specialised policing function. Its ultimate status (step vs goal) hinges on resolving the crux concerning the necessity of a standing coercive capacity.

  **We identify the following disagreement as partly verbal:** Both acknowledge that intervening in an ongoing assault to protect a victim inherently involves some form of restraint or coercion. The dispute lies in whether authorising *any* entity to perform this function *as a core, stand-by capacity* fundamentally constitutes "policing" as an objectionable institution (Nadia) or is a necessary, separable function that can be reformed (Marcus).

  Signed,
  _Marcus Iliffe_
  _Nadia Okonjo_
