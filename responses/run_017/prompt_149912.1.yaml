  - Universalism: Every join creates a new materialized table (fusion).
  - Organicist: Materialization only happens when a specific life-trigger condition is met.
  - Brutalism: A brute-force CHECK constraint determines composition.

  Key challenges I anticipate:
  1) The "real existence" distinction collapses - in DB terms, materializing a view is just an optimization decision.
  2) Vagueness issues become predicate instability problems.
  3) Causal overdetermination resembles trigger duplication, which DB engineers would consider bad design.

  For the residue report:
  The core issue seems to be that database modeling lacks the concept of "ontologically real" that metaphysicians debate. When we materialize a view, we're making a performance decision, not discovering a truth. The exact breakdown happens when trying to map "brute facts" to CHECK constraints - there's no analogue for why certain constraints exist fundamentally.

  I should also flag where I might smuggle in DB assumptions:
  - Key-based individuation isn't necessary in metaphysics
  - Convention-based base tables don't match metaphysical realism
  - Performance considerations don't translate to ontological status

  The translation will show that from a DB perspective, the metaphysical debate appears to be about implementation decisions rather than fundamental truths.
answer: |-
  Here’s the translation and residue report, structured as requested. I’ll stick strictly to your terms and flag bends/breaks. Word count: 850.

  ---

  ### **Nihilism**  
  *Translation*: Only base tables (simples) exist. "Composition" is a `VIEW` defined by a query (e.g., `SELECT * FROM particles WHERE arrangement = 'chairwise'`). No `MATERIALIZED VIEW` or new base table is ever created for composites. The view isn’t updatable (no `INSTEAD OF` triggers), as there’s no underlying table to modify.  
  *Bends*: Simples must be atomic rows (indivisible, no further PK/FK). "Arranged chairwise" is a predicate, not a structure.  
  *Breaks*: Can’t capture why some views *feel* like candidates for materialization (e.g., persistent query patterns).  
  *Causal overdetermination*: Like a trigger firing on both base-table changes and phantom view changes—but since the view isn’t materialized, triggers only fire once (at simple level). Parsimony preserved.  

  ### **Universalism**  
  *Translation*: Every set of non-overlapping rows (xs) automatically materializes as a new base table (fusion) via an `INSERT INTO fusions TABLE (SELECT ... UNION ...)`. `ON COMMIT` is immediate. Fusions have surrogate keys (arbitrary object IDs). Overlap handled via `DISTINCT`.  
  *Bends*: Universalism assumes *every* selection is materializable, but DBs impose storage constraints. "Non-overlapping" requires a join predicate (`NOT EXISTS` subquery for shared parts).  
  *Gunk/Junk*: Junk (no atomic base tables) → no 1NF possible; all tables are views over deeper views. Gunk (no top) → infinite recursions in views, but DBs hit resource limits.  
  *Vagueness*: If selection is vague (e.g., `WHERE boundary_distance < 5`), materialization still occurs—but the row count becomes indeterminate (violates ACID).  

  ### **Organicism (van Inwagen)**  
  *Translation*: `MATERIALIZED VIEW y CREATED WHEN (SELECT xs FROM particles WHERE life_process = TRUE)`. Life is a hardcoded `INSTEAD OF` trigger condition. Swarm of bees is a `VIEW`; bee is a base table.  
  *Bends*: "Caught up in a life" is a black-box function—cannot define in SQL without smuggling biology. No clear FK from life to particles.  
  *Breaks*: Why is "life" the *only* trigger? DB analogy suggests other triggers could exist (e.g., for artifacts), but van Inwagen denies this.  

  ### **Brutalism**  
  *Translation*: There’s a `CHECK` constraint on composition: `CREATE TABLE composites (...) CHECK (brute_condition(xs))`. The constraint exists, but its logic isn’t queryable; it’s a brute `ENUM` of allowed configurations.  
  *Bends*: In DBs, constraints *are* defined (e.g., `CHECK (mass > 0)`); brutalism treats the condition as fundamental but inexplicable.  
  *Breaks*: DB constraints are human-defined; brutalism posits a *sui generis* metadata layer.  

  ### **Argument from Vagueness**  
  *Translation*: If composition requires a precise predicate (e.g., `fastened = TRUE`), but the predicate has borderline cases (e.g., `fastened` is fuzzy), then `EXISTS y` becomes non-boolean (NULL). But existence must be true/false (violates 2VL). Solution: avoid vague predicates—either materialize nothing (nihilism) or everything (universalism).  
  *Problem of the Many*: Like 1,000 near-identical candidate rows for `SELECT * FROM tables WHERE id = 42`, due to unstable boundary conditions. No `PRIMARY KEY` to force uniqueness.  

  ---

  ### **Residue Report**  
  **Core breakdown**: The dispute hinges on whether a view’s materialization reflects a *mind-independent fact*. Database vocabulary **cannot state this**. Materialization is a performance/design choice:  
  - If a view is queried often, materialize it to reduce joins.  
  - If updates are costly, keep it virtual.  
  - No "further fact" beyond usage patterns.  

  **Exact sentence where translation fails**: "When is there a *y* such that the *xs* compose *y*?" This assumes *y* is either "real" (base table) or "not real" (ephemeral view). But in DBs:  
  - A materialized view is a base table with automated syncing.  
  - "Real" reduces to "has storage allocated + supports updates/triggers".  
  - Metaphysicians treat "real" as binary *and* non-conventional; DBs treat it as pragmatic and continuous.  

  **Where you’re right**: The debate *does* collapse into engineering.  
  - Nihilism optimizes storage (only atoms).  
  - Universalism precomputes all joins (wastes storage).  
  - Organicism materializes only high-traffic views (e.g., "lives").  
  - Brutalism hardcodes a business rule no one understands.  
  Causal overdetermination is a *bad design* smell (e.g., double-counting writes via triggers), not an ontological flaw.  

  **Smuggled assumptions I flagged**:  
  1. **Individuation by keys**: Metaphysics allows "object" without a PK (e.g., mass nouns).  
  2. **Interest-relativity**: DBs exist for *users*; metaphysicians seek agent-neutral truth.  
  3. **Base-table conventionalism**: Realists see simples as discovered, not chosen.  

  **Verdict**: Your vocabulary maps the *structure* of the debate but exposes its engine as a cargo cult. The "stunt" works: it shows them wrestling with a distinction (base/view) that only makes sense in a purposive system. Hand this out, and let the nihilists and universalists fight over index tuning.  

