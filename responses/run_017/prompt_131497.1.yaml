prompt: |-
  I'm a retired experimental physicist who got into philosophy about four years ago, and next month I'm giving a 25-minute talk plus Q&A at the joint ethics seminar at the univerity here. My thesis: Anscombe's 1956 campaign against Oxford giving Truman an honorary degree has nothing essentially to do with the intending-versus-foreseeing distinction — the double-effect machinery people keep bolting onto it is doing no work — and what actually carries the charge is her claim that nobody has the authority to kill people who have themselves done nothing, for the good of everyone else. If that's right then the argument doesn't stop at Hiroshima; it also sticks to a precision raid on an aircraft-components plant where the workers' families live in a shanty town fifty metres outside the perimeter fence, which is exactly the sort of case everyone treats as the clean contrast case. I want to bite that bullet. Sketch: (1) the double-effect apparatus only ever redescribes what the agent is up to, it doesn't license it; (2) the licensing in these cases comes from an implicit appeal to supreme emergency / the good of the many, which is the thing she is denying; (3) so if (2) fails, the "clean" raid fails with it, and there's no principled place to stop short of something close to pacifism.

  Audience: three moral philosophers who publish on double effect and just war, one straight consequentialist, two people from war studies who teach this material to serving officers and think in terms of proportionality and military necessity, and one historian of the Pacific war who will have no patience with counterfactuals.

  Write me a Q&A prep sheet: the objections I'll actually get from this bunch, in the order they'll come at me, phrased the way each of them would phrase it rather than in my vocabulary, ranked by how much damage they'd do. For each: what I should concede up front, what I have to hold, a two-minute answer, and where that answer is softest. Include the question I'm hoping nobody asks.

  Last thing: be explicit about which claims about Anscombe's argument are settled among people who really know that literature and which are live interpretive fights. I don't want to stand up and present a contested reading of her as if it were the standard one.
reasoning: |-
  Okay, the user is a retired experimental physicist turned philosopher preparing for a seminar talk. Their thesis challenges the common interpretation of Anscombe's argument against Truman's honorary degree, arguing that the core issue isn't the intending vs. foreseeing distinction but rather the lack of authority to kill innocents for the greater good. They want to extend this to "clean" raids where collateral damage is foreseen but unintended.

  The user needs a Q&A prep sheet tailored to specific audience members: three moral philosophers, one consequentialist, two war studies experts, and a Pacific War historian. They want objections ranked by damage potential, with concessions, key holds, and soft spots in answers. They also need clarification on settled vs. contested interpretations of Anscombe.

  First, I'll analyze the audience. The moral philosophers will focus on double effect theory and just war principles. The consequentialist will reject deontology entirely. The war studies experts care about practical military application, proportionality, and necessity. The historian will avoid counterfactuals and focus on historical context.

  For the philosophers, the strongest objection would be that Anscombe explicitly uses double effect elsewhere. I need to acknowledge this but argue her Truman critique stands independently. The consequentialist will dismiss authority arguments, so I should reframe the debate on their terms regarding consequences. 

  The war studies objections about military necessity are critical - they'll say proportionality justifies collateral damage. The user must hold that authority precedes proportionality calculations. This is a soft spot because it challenges operational realities.

  The historian's likely objection about Truman's alternatives is dangerous. The user should concede factual uncertainty but maintain the moral principle. The "nobody asks" question would be about applying this to all state violence - a pacifism implication they must acknowledge.

  On Anscombe scholarship: It's settled that she endorsed double effect generally. But her Truman argument's emphasis on authority vs. foreseen/intended distinction is contested - some scholars see them as intertwined. The user should position their view as a minority but defensible interpretation.

  I'll structure the prep sheet by threat level: starting with war studies (practical damage), then philosophers (theoretical), consequentialist (foundational), historian (factual). Each entry will have the objection phrased in the questioner's language, concessions, holds, talking points, and vulnerabilities.
answer: |-
  Here's a Q&A prep sheet tailored to your audience and thesis, prioritizing threats, incorporating their perspectives, and flagging Anscombe scholarship:

  **Core Thesis Recap:** Anscombe's core objection to Truman/Hiroshima isn't *primarily* the Intending/Foreseeing (I/F) distinction of Double Effect (DE), but rather the **lack of legitimate authority** to deliberately kill innocents (non-combatants who've done no wrong) *even for the greater good*. If this authority argument holds, it invalidates not just Hiroshima, but also "clean" raids with *foreseen* collateral deaths of innocents, pushing towards near-pacifism.

  **Anscombe Scholarship Status:**
  *   **Settled:** She vehemently opposed Truman's degree due to the bombings. She was a staunch proponent of the I/F distinction and DE *in general*. Her 1956 pamphlet ("Mr. Truman's Degree") explicitly discusses both foreseen deaths and the authority to punish/kill.
  *   **Contested/Live:** The *relative weight* and *logical primacy* of the "authority to kill innocents" argument versus the I/F distinction *specifically within the Truman critique*. Most scholars see them intertwined or emphasize I/F. **Your interpretation (authority as primary/carrying the charge, DE as secondary/descriptive) is a defensible but minority/minimalist reading.** Key sources: Her 1956 pamphlet, "War and Murder" (1961), and discussions in Foot, Teichman, Diamond, and Gormally.

  ---

  **Q&A Prep Sheet (Ranked by Potential Damage)**

  1.  **Objection (War Studies / Military Necessity Expert):**
      *   **Phrasing:** "Professor, your argument ignores operational reality. Military necessity *requires* targeting legitimate military objectives like that component plant. Proportionality demands we weigh the *military advantage* against the *foreseen but unintended* collateral damage. If the military advantage is significant and the collateral damage is minimized and proportionate, the raid is not only justified but *obligatory* to shorten the war and save more lives overall. Your 'authority' argument paralyzes commanders facing real threats."
      *   **Damage:** High. Directly challenges practical applicability, core military ethics doctrine (proportionality/necessity), and implies dangerous inaction.
      *   **Concede:** The immense pressure commanders face; the genuine goal of shortening wars/saving lives; the *desire* to minimize harm; that proportionality/necessity *are* standard and necessary criteria *within* the Just War framework.
      *   **Hold:** Proportionality/necessity *presuppose* the legitimacy of the act *type*. Targeting the plant is legitimate. Killing the innocents next door as a *means* or *accepted cost* for the greater good is the illegitimate act *type* Anscombe denies *anyone* has the authority for. Military necessity doesn't create authority it lacks. The calculation *itself* assumes the permissibility of weighing innocent lives, which is the core issue.
      *   **2-Minute Answer:** "I fully acknowledge the doctrine of proportionality and the brutal calculus of military necessity. My point is that this calculus *only applies* once we've established the permissibility of the *kind of action* involved. Anscombe argues that deliberately accepting the killing of innocents as a cost for a greater good – even if unintended – is a *kind of action* that falls outside the legitimate authority of *any* political leader or commander. It's not about ignoring necessity, but about rejecting that necessity confers a moral license for this specific type of killing. The authority to wage war doesn't include the authority to use innocent lives as currency, however reluctantly. Proportionality can't justify an inherently impermissible act-type."
      *   **Soft Spot:** The practical implications for deterrence/defense against existential threats. Can feel like demanding inaction when action *seems* necessary. Requires firmly separating the *objective* (destroy military target) from the *foreseen lethal cost imposed on innocents* as the prohibited element.

  2.  **Objection (Moral Philosopher / DE Expert 1):**
      *   **Phrasing:** "I think you're misreading Anscombe. The I/F distinction *isn't* just descriptive redescription; it's *constitutive* of the moral evaluation for her. In 'War and Murder,' she explicitly uses DE to distinguish legitimate attacks on combatants (intended) from illegitimate attacks on non-combatants (intended). Her objection to Truman hinges precisely on the claim that the bombings *intended* the deaths of innocents as a means to end the war, making it murder. The 'authority' point reinforces this but isn't primary. Your clean raid case is *exactly* where DE *does* the licensing work by showing the deaths are *only* foreseen, not intended."
      *   **Damage:** High. Directly challenges your core interpretive claim about Anscombe and the role of DE. Attacks the foundation of your "DE does no licensing work" point.
      *   **Concede:** Anscombe absolutely used and championed the I/F distinction elsewhere and discussed intention regarding Hiroshima. Her language in the pamphlet connects intention to murder.
      *   **Hold:** In the *specific* Truman pamphlet argument, the *rhetorical force* and the *ultimate barrier* she presents is the lack of authority to kill innocents *for the common good*, framing it as "mass murder" or "murder" *because* of this lack of authority, regardless of fine-grained intention. The DE apparatus *in this context* serves to *describe* Truman's act *as* intentional murder (in her view), but the *moral prohibition invoked* is the underlying principle forbidding anyone from having this kind of power over innocent life *for the greater good*. The "clean" raid fails because even the *foreseen* killing as a cost *requires* the same unjustified authority over innocent life.
      *   **2-Minute Answer:** "You're right that Anscombe employs the language of intention in the pamphlet, and DE is central to her broader ethics. However, I contend that in this specific polemic, the *conclusive* argument she leans on hardest for her audience is the shocking claim that Truman killed 'the innocent as a means to an end' and that *no one*, not even a head of state, has the *right* to do this. Paragraphs like 'For men to choose to kill the innocent as a means to their ends is always murder...' place the emphasis on the *nature of the act* ('killing the innocent as a means') and the *lack of right/authority* ('always murder'), using intention descriptively *to classify* the act under this prohibited category. The DE machinery labels the act 'murder'; the authority argument explains *why* that label carries its absolute moral force in this context."
      *   **Soft Spot:** Requires a nuanced, context-specific reading of the pamphlet. Can seem like splitting hairs when she clearly mentions intention. Leaves open *why* she thought the Hiroshima deaths were intended if your reading is correct.

  3.  **Objection (Consequentialist):**
      *   **Phrasing:** "This entire 'authority' framework feels like a moral fetish. What matters are *consequences*. If flattening Hiroshima *actually* saved more net lives – Japanese *and* Allied – by ending the war instantly, then it was not only permissible but morally required. Ditto for the component plant: if destroying it significantly degrades the enemy's war machine and prevents more widespread death and suffering, the foreseen deaths of some innocents nearby, while tragic, are outweighed. Anscombe's absolutism about authority or intention leads to worse outcomes. The 'greater good' *is* the justification."
      *   **Damage:** High. Attacks the foundational moral framework. Rejects the core deontological constraint you're relying on.
      *   **Concede:** The consequentialist calculus *is* compelling and drives real-world decisions. Preventing greater suffering is a paramount goal. Outcomes matter immensely.
      *   **Hold:** Anscombe's argument (and mine) is precisely that consequentialism *in this domain* licenses atrocities. The "authority" point highlights that no individual or state possesses the moral *right* to deliberately sacrifice innocent lives, even for the greater good. It asserts a fundamental constraint on action based on the inviolability of the innocent person, regardless of consequences. Consequentialism ultimately reduces persons to vessels of value, violating a core principle of justice.
      *   **2-Minute Answer:** "I understand the consequentialist impulse, especially facing catastrophe. But Anscombe's argument exposes a deep flaw: it justifies *any* harm to innocents if the net balance seems positive. This erodes the fundamental prohibition against using people as mere tools. Her 'authority' point asks: who possesses the god-like wisdom and *right* to make such irrevocable calculations about who lives and who dies for the 'greater good'? We reject this authority for individuals (it's murder); why grant it to states? The constraint isn't a 'fetish' but a protection against barbarism disguised as necessity. The clean raid fails because it still involves commanders *knowingly* causing innocent deaths as the *price* for their objective – a price they lack the moral authority to set."
      *   **Soft Spot:** Struggles against the visceral "But what if millions die otherwise?" scenario (Supreme Emergency). Can feel morally counterintuitive when consequences are starkly asymmetrical. Requires asserting the primacy of deontological constraints over aggregate welfare.

  4.  **Objection (Moral Philosopher / DE Expert 2 / Just War):**
      *   **Phrasing:** "Doesn't your interpretation collapse the crucial Just War distinction between *direct attack* on civilians (Hiroshima/Nagasaki) and *collateral damage* (the component plant)? Jus in bello hinges on this! Anscombe, via DE, underpins this distinction. Your argument seems to erase it, making any foreseeable collateral damage tantamount to direct attack, which is both philosophically implausible and renders modern warfare (which unavoidably risks collateral damage) practically impossible to wage justly. Isn't this an overreach?"
      *   **Damage:** Medium-High. Challenges a cornerstone of accepted Just War Theory and the practical viability of your conclusion.
      *   **Concede:** The distinction between direct targeting and collateral damage is vital legally and morally within mainstream Just War Theory. Modern warfare aims rigorously at discrimination. Avoiding *all* foreseeable risk to civilians is impossible.
      *   **Hold:** Anscombe's authority argument *does* challenge the moral acceptability of *foreseen and accepted* collateral damage when innocents *are* killed, precisely because it involves knowingly bringing about their deaths for a greater good – an authority she denies exists. The legal/moral distinction rests *entirely* on the DE/I-F distinction which, in my argument, doesn't *license* the collateral damage but only *describes* it differently. If the core prohibition is on *deliberately causing* (intending or knowingly accepting as necessary cost) innocent deaths for the greater good, then both cases fall foul, differing only in the *description* of the agent's focus.
      *   **2-Minute Answer:** "I agree the direct/collateral distinction is fundamental to current Jus in Bello. My claim, following this reading of Anscombe, is that this distinction, while descriptively valid, doesn't *morally absolve* the collateral damage *if* the core wrong is understood as a leader/commander *knowingly bringing about* the deaths of innocents *as part of* their plan for the greater good. DE allows us to *say* the deaths weren't 'intended,' but it doesn't change the fact that they were foreseen, known to be certain or near-certain, and *accepted* as the cost of doing necessary military business. Anscombe's authority argument suggests *that acceptance itself* – the willingness to trade innocent lives for military objectives or the common good – is the illegitimate act, regardless of whether the deaths are 'intended' or 'merely' foreseen and accepted. The clean raid fails because it still involves *that acceptance*."
      *   **Soft Spot:** Appears to undermine a crucial practical moral distinction. Requires arguing that the "acceptance as cost" is morally equivalent (in terms of the authority violation) to direct intention in this context. Feels like a slippery slope.

  5.  **Objection (Historian of Pacific War):**
      *   **Phrasing:** "This is all very abstract. Truman faced an appalling choice: invasion, projected to cost a million Allied casualties and far more Japanese lives, or using the bomb to shock Japan into surrender. Blockade and bombardment were ongoing horrors. The Japanese leadership *was* intransigent. While the bombings were terrible, the counterfactual – *not* using them – likely meant vastly more death and suffering for *years*. Doesn't this context of 'supreme emergency' override your theoretical concerns about authority? What was the *realistic* alternative that didn't involve massive loss of innocent life?"
      *   **Damage:** Medium. Undercuts the historical grounding of the Hiroshima example. Appeals to the "supreme emergency" you want to reject. Historian has little patience for abstract ethics.
      *   **Concede:** The historical context was horrific, with terrible options. Projected invasion casualties were high. Japanese militarism was brutal. The desire to end the war swiftly was understandable and motivated by saving lives.
      *   **Hold:** Anscombe's argument is precisely that *even in supreme emergency*, no one has the authority to deliberately kill innocents as a means or accepted cost to overcome it. The historical facts about alternatives/debates (e.g., modified surrender terms, Soviet entry, effectiveness of blockade, internal Japanese politics) are contested, but the *moral principle* she asserts is absolute. If the principle holds, the historical context explains but does not *justify* the choice to kill innocents.
      *   **2-Minute Answer:** "I don't dispute the agonizing position Truman was in or the desire to save lives. My argument, following Anscombe, is that some actions remain morally forbidden *regardless* of the emergency or the perceived lack of alternatives. Her point is that killing the innocent *as a means or accepted cost* to achieve even a vital good like ending a war is an act of murder, and no emergency confers the authority to commit murder. We can debate the historical counterfactuals endlessly – the historian's point is well-taken on their complexity – but the moral question is whether *this kind of killing* is ever permissible. Anscombe, and I, argue it is not, even when the alternative seems worse. The tragedy lies in being forced into an immoral choice by prior circumstances, not in the choice becoming moral."
      *   **Soft Spot:** Can seem callously detached from historical reality and human suffering. Requires maintaining an absolute principle in the face of extreme historical duress.

  6.  **The Question You Hope Nobody Asks (But Prepare For):**
      *   **Phrasing (Likely from a Moral Philosopher or Sharp War Studies person):** "Okay, you bite the bullet. If *no one* has the authority to knowingly cause the death of innocents as a cost for the greater good, and this applies even to foreseen collateral damage in a 'clean' strike, then doesn't this principle logically extend to *any* act of state violence that foreseeably kills innocents? What about economic sanctions that cause mass starvation? Defensive bombing against an aggressor where civilians remain near targets? Drone strikes against terrorists hiding in population centers? Doesn't your position, consistently applied, condemn virtually all warfare and much coercive statecraft as inherently involving this forbidden killing? Are you effectively arguing for pacifism?"
      *   **Damage:** Extreme. Exposes the radical implication you acknowledge ("near-pacifism") and forces you to defend its feasibility or modify your principle.
      *   **Concede:** Yes, the implication *is* radical and pushes towards near-pacifism. Modern warfare and coercive state actions frequently involve foreseeably causing harm to innocents as part of achieving state goals.
      *   **Hold:** The principle *does* severely constrain state violence. It challenges the moral acceptability of most modern warfare as currently practiced. A truly just war might only be conceivable in scenarios of pure self-defense against direct aggression on clearly demarcated battlefields with no civilians present – a near-impossible ideal. Perhaps only *defensive actions against combatants* that *genuinely involve no foreseen killing of innocents* could pass. This *is* the bullet to bite: Anscombe's logic, taken seriously, reveals the deep moral problem inherent in almost all uses of force by modern states where civilians are present.
      *   **2-Minute Answer:** "You've hit the nail on the head, and it's the hardest part. Yes, applying Anscombe's principle consistently *does* lead to the conclusion that modern warfare, with its inevitable intermingling of combatants and non-combatants and its reliance on strategic effects that impact populations, almost invariably involves the state doing something it lacks the moral authority to do: knowingly causing the death or severe harm of innocents as part of its strategy. It forces us to confront whether war, as practiced, is morally salvageable, or whether we must embrace a much stricter near-pacifist position. Anscombe herself acknowledged this difficulty. My point today isn't to offer an easy solution, but to argue that the 'clean raid' doesn't provide an escape hatch from Hiroshima's core moral problem – the illegitimate exercise of power over innocent life. This principle exposes a profound tension between state security and fundamental morality."
      *   **Soft Spot:** Admits the position's radicalism and potential impracticality. Leaves little room for "just war" as commonly understood. Can feel like moral purity at the cost of realistic security.

  ---

  **Key Q&A Strategy:**
  *   **Acknowledge Expertise:** "That's a crucial point from the Just War perspective..." / "Your historical expertise highlights a vital context..."
  *   **Reframe to Core:** Constantly bring objections back to the central thesis: "My core point is that this appeal to [necessity/consequences/distinction] still relies on an assumed authority over innocent life that Anscombe denies exists."
  *   **Use "Clean Raid" as Litmus Test:** "Does your objection justify *only* Hiroshima, or does it also justify the foreseen deaths of the shanty town families? If the latter, then we agree on the principle but disagree on its permissibility. If the former, where is the principled line?"
  *   **Concede Where Necessary:** Shows you understand their points and aren't dogmatic.
  *   **Hold the Line on Authority:** The core of your thesis is the *lack of authority* as the primary barrier in Anscombe's argument. Don't let DE or consequences distract from this.
  *   **Don't Shy from Implications:** Be prepared to acknowledge the near-pacifist direction. Frame it as the uncomfortable conclusion Anscombe's logic points towards.

  Good luck! Your background brings a valuable analytical rigor to this deep ethical problem.
