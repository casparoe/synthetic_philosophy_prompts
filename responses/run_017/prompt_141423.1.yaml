answer: |-
  Here’s a decision tree for your applied ethics handout, designed around collective action problems like flying, meat consumption, or voting. It starts from the shared intuition that "my one act makes no difference," and branches through concrete cases to expose underlying ethical views. The tree has **7 nodes** (including your 5 requested cases plus 2 added for clarity) and **8 leaves** (ethical positions). Each node is a yes/no question based on a real-world scenario, and leaves are labeled with the ethical view they represent, plus one sentence on its "most awkward commitment." I’ve ordered the branching to maximize separation of views, starting with cases that test causal inefficacy, then moving to collective, symbolic, and character-based concerns.

  ### **Decision Tree: "Does My One Act Matter Ethically?"**
  **Start**: Your single act (e.g., one flight, one vote, one pack of factory-farmed chicken) seems to make no difference to any outcome anyone will ever notice.

  1. **Node 1 (Replaceable One)**  
     You skip buying factory-farmed chicken, but the store sells it to someone else immediately, and the next order size stays the same. **Is buying the chicken morally neutral in this case?**  
     - **Yes** → Go to Node 2.  
     - **No** → Go to Node 3.  

  2. **Node 2 (Overdetermined One)**  
     You’re one of 1,000 people each turning a key to start a harmful event (e.g., pollution). The harm happens whether or not you turn your key. **Is it permissible for you to turn your key?**  
     - **Yes** → **Leaf 1: Inefficacy Permissibility**  
       *View*: Acts are only wrong if they cause harm; no difference, no problem.  
       *Awkward commitment*: Lets you participate in atrocities (like the key-turning) if your role is redundant.  
     - **No** → **Leaf 2: Part-of-a-Sufficient-Set View**  
       *View*: Acts are wrong if you’re part of a group that *together* causes harm, even if your contribution is unnecessary.  
       *Awkward commitment*: Requires abstaining even when the harm is 100% guaranteed without you (e.g., the key turn changes nothing).  

  3. **Node 3 (Norm One)**  
     In your community, a visible convention (e.g., "people like us don’t fly for leisure") keeps a harmful practice rare. Your act (e.g., flying) won’t change anything directly, but it slightly erodes this norm. **Is your act wrong because of this erosion?**  
     - **Yes** → Go to Node 4.  
     - **No** → Go to Node 5.  

  4. **Node 4 (Private Version of Norm One)**  
     Suppose you could do the act (e.g., fly) in complete secrecy—no one knows, so no norm erosion occurs. **Would it then be permissible?**  
     - **Yes** → **Leaf 3: Norm-Sustenance View**  
       *View*: Acts are wrong only if they undermine beneficial social conventions.  
       *Awkward commitment*: Allows harmful acts if done secretly (e.g., private flights are fine if no one finds out).  
     - **No** → **Leaf 4: Expressive/Symbolic View**  
       *View*: Acts are wrong if they express approval of harm (e.g., "flying says you don’t care about climate"), regardless of consequences.  
       *Awkward commitment*: Condemns acts for their symbolism even if they have zero impact (e.g., a secret flight that expresses nothing to anyone).  

  5. **Node 5 (Unknown-Size One)**  
     Your emissions join millions of others, potentially crossing a threshold for harm (e.g., triggering a climate tipping point), but you have no idea where the threshold sits or how many others emit. **Do you have a moral reason to reduce your emissions?**  
     - **Yes** → **Leaf 5: Expected-Difference View**  
       *View*: Acts are wrong if their *expected* harm (probability × impact) is significant, even if actual harm is unlikely.  
       *Awkward commitment*: Demands action with near-zero personal impact (e.g., reducing emissions when your contribution is one in a billion).  
     - **No** → Go to Node 6.  

  6. **Node 6 (Offset One)**  
     You can’t avoid a necessary flight (e.g., for a family emergency), but you can pay into a trusted program that funds an equivalent emissions reduction elsewhere. **Is offsetting morally required?**  
     - **Yes** → **Leaf 6: Fair-Share-of-Collective-Duty View**  
       *View*: You must do your fair share to address collective harm, and offsetting "cancels out" your contribution.  
       *Awkward commitment*: Lets you "buy" permission for harmful acts (e.g., flying) if you pay, which may feel like paying for indulgences.  
     - **No** → Go to Node 7.  

  7. **Node 7 (Character Test)**  
     Imagine your act (e.g., eating factory-farmed meat) has no consequences—it doesn’t change outcomes, norms, or symbols. **Could it still be wrong because of what it reveals about your character?**  
     - **Yes** → **Leaf 7: Character/Virtue View**  
       *View*: Acts are wrong if they reflect or cultivate vices (e.g., callousness to suffering).  
       *Awkward commitment*: Ignores real-world impacts to focus on personal virtue (e.g., condemns an act even if it secretly helps others).  
     - **No** → **Leaf 8: Complicity-Style View**  
       *View*: Acts are wrong if they make you complicit in a harmful system, even if your role is tiny.  
       *Awkward commitment*: Forbids trivial participation in modern systems (e.g., buying a chocolate bar may implicate you in child labor).  

  ---

  ### **Notes on Design Choices**
  - **Branching Order**: I started with **Replaceable** (Node 1) because it tests whether "replaceability" defeats moral concern. A "yes" leads to causal-inefficacy views (Node 2), while "no" points to collective/norm-based concerns (Node 3). **Threshold** (Node 5) comes later to isolate uncertainty-driven views. **Offset** (Node 6) and **Character** (Node 7) are last because they often serve as "last resorts" for those rejecting all prior arguments.
    
  - **Unseparated Leaves**: This tree **cannot fully separate** two pairs:
    - **Complicity (Leaf 8) and Character (Leaf 7)**: Both condemn acts beyond consequences, but Complicity focuses on systemic entanglement, while Character focuses on personal vice. Node 7 forces a distinction: if you care about character *without* systemic harm, it’s Character; if not, it’s Complicity. Still, in practice, many theorists blend these.
    - **Fair Share (Leaf 6) and Expected Difference (Leaf 5)**: Both often endorse offsetting, but Expected Difference is probabilistic (you offset to reduce risk), while Fair Share is deontic (you offset to do your duty). Node 6 isolates Fair Share by asking about offsetting *after* rejecting uncertainty (Node 5 "no").

  - **Empty/Incoherent Combinations**: 
    - **"Node 1: Yes → Node 2: No"** (Replaceable neutral, but Overdetermined wrong) is rare. It implies replaceability neutralizes harm in one case but not another—incoherent unless you see the key-turning as inherently symbolic (but the tree routes symbolism to Node 4).
    - **"Node 3: No → Node 5: Yes"** (Norm erosion irrelevant, but threshold matters) is uncommon. It rejects social dynamics but endorses probabilistic harm—a niche stance (e.g., strict consequentialists who distrust norms).
    - **"Node 1: No → Node 2: Yes"** (Replaceability not neutral, but Overdetermined permissible) is logically unstable. If replaceability doesn’t excuse harm, neither should redundancy. This combination is unfashionable and rarely defended.

  - **Why Your Cases Aren’t Rigged**: Your cases are well-chosen to target specific tensions (e.g., **Replaceable** tests causal vs. moral participation; **Unknown-Size** tests uncertainty). I added **Private Act** (Node 4) to split norm-focused from expressive views, and **Character Test** (Node 7) to isolate virtue ethics. The tree avoids rigging by letting real-world intuitions (e.g., "secret acts feel less wrong") drive branching.

  - **Limitation of the Frame**: The tree assumes acts are *individually* inconsequential—which is realistic for climate/meat/voting. But it may obscure solutions emphasizing institutional change (e.g., lobbying) over individual acts. I focused on personal ethics since that’s your seminar’s scope.

  This tree should spark debate in your seminar. First-years can engage without background, and the "awkward commitments" highlight trade-offs. If you need a visual version (e.g., flowchart), I can sketch one!
