prompt: |-
  I'm putting together the function week for a grad seminar in philosophy of biology this spring, and I realised I don't actually know what I'm asking of a theory of biological function. My students do this thing where someone produces a case — a heart that has never pumped and never will, the very first heart token, the heart's thumping noise, a liver that does forty things — and everyone treats the case as decisive for or against an account, and I have no principled way to say how much weight it should carry. So before we read any more of the literature I want the spec instead. Write me the desiderata: what any account of what it is for a trait or part to have a function has to deliver, with the case or consideration behind each requirement, and mark which are non-negotiable and which are just preferences of one camp. To keep it honest, fix the purpose: I want a function concept that can (a) underwrite a notion of malfunction or dysfunction that does real work for my colleague in philosophy of medicine, who needs to separate pathology from mere statistical atypicality, and (b) still carry the naturalistic load that theories of mental content lean on it for. If those two customers want different things from the concept, I want that said explicitly, with each desideratum tagged for which customer it comes from. And please route some of the requirements through cases I can use to break the usual rut, because the ones in the literature are over-rehearsed: a de novo designed protein dropped into a synthetic cell, whose only history is a lab selection protocol run by a robot; an enzyme produced by directed evolution where the selecting was done by an automated pipeline rather than by anything ecological; a trait in a digital organism in an artificial-life platform; a gene-drive construct engineered to crash a wild population, whose function seems to be something no organism ever benefited from; a transposable element that spread by selfish replication and is now doing regulatory work it was never selected for; and a holobiont or extended-phenotype case like a beaver dam or a termite mound, where it isn't clear whose history is supposed to matter. Distinguish also between what a theory must explain — why the trait is there, what it currently does, how a part can be broken — and what it must merely respect, like the distinction between having a function and having that function well, or between a function and a useful side effect.

  The part I most want is the negative structure of the list: tell me which subset of the desiderata you think cannot be jointly satisfied, and say whether that's because the list is over-ambitious or because the concept is genuinely over-constrained (the origin-of-function problem plus the normativity requirement plus the explanatory-role requirement feel like they might not all fit together, but I want you to actually check rather than nod along). Tell me which single requirement excludes the most candidate theories, and which of the usual demands on a theory of function you think are prejudices dressed up as desiderata — the ones that just bake in an answer. A short scorecard at the end is fine: how the selected-effect/etiological account, the causal-role or systemic-capacity account, and some kind of pluralist or deflationary option do against your list, a few lines each. But keep the weight on the criteria and their motivating cases, since the criteria are where the thinking is and I can redo the scoring myself.

  And be explicit about where you're unsure. Give me the desideratum you'd abandon first if I pushed back on it, tell me what would actually change your mind — a case, an argument, a result from biology — and flag the step in your reasoning you think is most likely to be wrong, rather than presenting the list as if it dropped out of the sky fully justified.
reasoning: |-
  Okay, the user is teaching a grad seminar on philosophy of biology and wants to establish clear desiderata for theories of biological function. They're frustrated with students treating edge cases as decisive without a principled framework. The core request is for a set of criteria that any theory must satisfy, tagged by whether they're essential or negotiable, and linked to specific cases. 

  The user has two main applications in mind: supporting a philosophy of medicine colleague who needs a robust concept of pathology (malfunction), and serving naturalistic theories of mental content. This creates potential tension since medical malfunction requires normative force while mental content often relies on etiological history. 

  Notable challenges include:
  - Avoiding overused textbook examples in favor of fresh cases like synthetic biology constructs, digital organisms, and holobionts
  - Distinguishing between what a theory must explain (e.g., dysfunction) versus what it must merely accommodate (e.g., function/performance distinction)
  - Identifying irreconcilable conflicts in desiderata, especially between normative force and naturalizability

  The user's phrasing suggests they suspect inherent tensions - e.g., between etiological accounts (good for mental content) and systemic accounts (better for malfunction). Their request for "negative structure" implies wanting to know where compromises are inevitable.

  Key unspoken needs:
  1. Pedagogical scaffolding to help students evaluate theories systematically
  2. Clear demarcation between conceptual necessities and theoretical preferences
  3. Warning signs for when philosophers mistake partisan commitments for universal requirements
  4. Reality check on whether "function" can simultaneously serve medical and cognitive purposes

  The response will need to:
  - Tag each desideratum as [M] (medicine) or [C] (cognition) where relevant
  - Use the specified novel cases to illustrate requirements
  - Explicitly note where [M] and [C] pull in opposite directions
  - Distinguish explanatory burdens from compatibility conditions
  - Identify the "malfunction vs. mental content" tension as the central fault line
  - Confess uncertainty about reconciling normative force with purely causal histories
answer: |-
  Here is a structured desiderata list for a theory of biological function, designed to meet your specifications. I've prioritized clarity, tagged requirements by their primary customer (Philosophy of Medicine **[M]** or Mental Content **[C]**), marked non-negotiables (★), and used your novel cases. Crucially, I've identified tensions and trade-offs.

  ---

  ### **Core Desiderata**  
  *(What a theory MUST explain or respect)*  

  1. **Normative Force for Malfunction [M★]**  
     - **Requirement:** Must ground *objective* dysfunction (not just statistical deviance).  
     - **Case:** A human heart with a congenital defect that never pumped blood (despite typical structure). Medicine must call this dysfunctional even if it statistically exists.  
     - **Non-negotiable:** Yes (for [M]). Without this, "pathology" collapses to "atypicality."  

  2. **Etiological Grounding [C★]**  
     - **Requirement:** Must explain why a trait has the *specific* function it does (e.g., why hearts function to pump blood, not make noise).  
     - **Case:** A gene-drive construct designed to crash a population. Its function (population suppression) derives from design/selection history, not its current effects.  
     - **Non-negotiable:** Yes (for [C]). Mental content theories (e.g., teleosemantics) need history to fix content.  

  3. **Distinction: Function vs. Accidental Benefit**  
     - **Requirement:** Must differentiate a trait's function from mere byproducts or contingent benefits.  
     - **Case:** The heart's *thumping noise* may aid in diagnosis but isn't its function. A liver filtering toxins (function) vs. storing vitamin A (side effect).  
     - **Non-negotiable:** ★ (Essential for both [M] and [C]).  

  4. **Malfunction Without Extinction [M★]**  
     - **Requirement:** Must allow traits to malfunction *even if* their failure has never been selected against (e.g., late-onset diseases).  
     - **Case:** A hereditary disease that kills after reproduction. It’s pathological despite no selective history of failure.  

  5. **Novel Traits & Artificial Systems**  
     - **Requirement:** Must assign functions to traits with no evolutionary history.  
     - **Cases:**  
       - A *de novo protein* designed via robotic selection in a synthetic cell.  
       - A trait in a *digital organism* evolved in an ALife simulation.  
       - An enzyme from *directed evolution* (automated selection, no ecology).  
     - **Non-negotiable:** ★ (Plausibility for synthetic/engineered biology).  

  ---

  ### **Respect Constraints**  
  *(What a theory MUST accommodate, but needn't centrally explain)*  

  6. **Function-Performance Distinction**  
     - **Requirement:** Separate *having a function* from *performing it well*.  
     - **Case:** A diseased heart still *functions* to pump blood, even if poorly.  

  7. **Multi-Functionality**  
     - **Requirement:** Allow traits to have multiple functions without contradiction.  
     - **Case:** The liver detoxifies, stores glycogen, *and* produces bile.  

  8. **Non-Beneficial Functions [C]**  
     - **Requirement:** Assign functions that don't benefit the organism.  
     - **Case:** A selfish *transposable element*’s function is self-replication, even if it harms the host.  

  9. **Holobionts/Extended Phenotypes**  
     - **Requirement:** Assign functions to structures not bound by organismal boundaries.  
     - **Case:** A *beaver dam*’s function (flood control) isn't reducible to beaver genetics alone.  

  ---

  ### **Tensions & Trade-offs**  
  - **Major Conflict:** **Normativity [M] vs. Naturalism [C]**.  
    - [M] requires dysfunction to be *objective* and history-independent (e.g., a heart that never pumped is broken by design/structural standards).  
    - [C] requires *historical selection* to fix function (e.g., no history → no content).  
    - **Result:** Theories prioritizing [M] (e.g., systemic-capacity) struggle with specificity; theories prioritizing [C] (e.g., etiological) struggle with novel/malfunction cases.  

  - **Over-constrained?** Yes. The "origin-of-function" problem (requiring history) + normativity (requiring ahistorical standards) + explanatory role (for both [M] and [C]) **cannot be jointly satisfied** by monolithic theories. This is why pluralism is gaining traction.  

  - **Most Exclusionary Requirement:** **Novel Traits (Desideratum 5)**.  
    - Excludes strict etiological theories (e.g., Millikan, Neander) that require natural selection history.  

  - **Likely Prejudice:** "Functions must benefit the organism." This biases toward adaptationism and excludes selfish elements (e.g., transposons) or designed harms (e.g., gene drives).  

  ---

  ### **Uncertainties & Abandonment Priorities**  
  - **Weakest Desideratum:** **Non-Beneficial Functions (8)**. If pushed, I’d abandon this first—though it risks mischaracterizing selfish DNA.  
  - **What Would Change My Mind:** Evidence that biological normativity *only* arises from selective history (e.g., if all synthetic systems with novel traits are judged dysfunctional by default).  
  - **Biggest Doubt:** Whether normativity [M] can be fully naturalized without circularity. I suspect systemic theories (e.g., Cummins) can deliver [M] but at the cost of specificity for [C].  

  ---

  ### **Theory Scorecard (Brief)**  
  1. **Etiological (e.g., Millikan, Neander):**  
     - ✅: Strong on [C], history, specificity.  
     - ❌: Fails novel traits (5), late-onset malfunction (4), and normativity without history.  

  2. **Systemic-Capacity (e.g., Cummins):**  
     - ✅: Excels at [M] (malfunction via systemic contribution), handles novel traits (5), holobionts (9).  
     - ❌: Struggles with specificity (why pumping, not noise?), accidental benefits (3), non-beneficial functions (8).  

  3. **Pluralist/Deflationary (e.g., Godfrey-Smith, Griffiths):**  
     - ✅: Avoids over-constraint by using different concepts for [M] (systemic) and [C] (etiological).  
     - ❌: Risks disunity; may not satisfy purists who want one "real" function.  

  ---

  ### **Key Takeaway for Your Seminar**  
  Focus students on **which desiderata are non-negotiable for each project** ([M] vs. [C]). The heart of the debate is whether "function" is a unified concept. Use your cases to expose this:  
  - The *gene-drive* challenges etiological theories (no organismal benefit).  
  - The *de novo protein* challenges historical accounts.  
  - The *never-pumped heart* challenges systemic accounts (what "system" is it contributing to?).  

  This framework makes trade-offs explicit, preventing students from treating cases as decisive without specifying which desideratum they target.
