  There are two complicating factors: first, a descendant community claims oral tradition about the site being a place "where things were given back to the ground," but there's concern this tradition may have been influenced by earlier amateur excavations. Second, there's debate about whether ritual practices by one household constitute "institutional practice" under the ordinance.

