  Okay, the user is part of a metaphysics reading group where a debate about composite objects was dismissed as "merely verbal." They want a structured analysis of what that phrase could mean in this context. Let me start by breaking down the possible interpretations. The user mentioned several specific theses: different senses of expressions, agreement on non-linguistic facts, language-independent truth values, naturalness, and practical purposes. I need to list each clearly, assess their plausibility, and apply them to the user's scenario.

  First, I recall the core dispute: one side says only simples exist, the other says composites exist when simples are arranged. The dismissive claim is that both agree on simples and their arrangements, so the disagreement is just about words. But how exactly? Let me outline the readings. 

  The first reading is Lexical Ambiguity. Here, "composite object" means different things to each side. But is that accurate? In metaphysics, terms like "object" are usually stipulated, not ambiguous. This might be too simplistic and probably not what the group intended.

  Next, the Descriptive Equivalence thesis. This says both sides agree on all non-linguistic facts. That seems strong. If all facts are about simples and their arrangements, then adding composites doesn't add new facts. But does composition add a fact? That's contentious. This thesis might be defensible but not a platitude; it's a substantive claim. The group's comment likely leaned here, but it's dismissive only if accepted.

  Then, Contextual Relativism. Truth depends on linguistic context. So, "there is a table" is true in a composite-friendly language but false in a nihilist one. This avoids conflict but might not reflect how each side views their claims. The user's complication about each side calling the other false challenges this. If they assert the other is wrong, not just in their language, this reading fails.

  Ontological Deflationism claims there's no language-independent fact about composites. This is anti-realist. It dismisses the dispute as non-substantive. But if one side is a realist, they'd reject this. The second-order disagreement about naturalness would then be substantive, not verbal.

  The Language-Naturalness view shifts the debate to which language carves nature better. This is substantive and not dismissive. The group's comment probably wasn't this, as it moves the argument rather than ending it.

  Pragmatic Instrumentalism focuses on usefulness. Like naturalness, it's substantive. The dismissive force comes only if we prioritize utility over truth, which isn't assumed.

  Now, the complications. The second-order dispute about whether naturalness is objective or preference-based: if deflationism is accepted, even naturalness claims might be seen as verbal. But realists would see it as substantive. So the second-order disagreement persists unless both embrace deflationism.

  The second complication: both sides assert the other is false. This challenges Descriptive Equivalence and Contextual Relativism. Only if we adopt a strong deflationism or relativism does the dispute remain verbal. Otherwise, it's substantive. The dismissive force weakens here because each side believes there's a fact of the matter.

  The user's group likely invoked Descriptive Equivalence or Ontological Deflationism. But with the complications, especially mutual accusations of falsehood, Descriptive Equivalence might not hold. The initial dismissal might overlook that the disagreement isn't just about words but about what exists beyond simples. 

