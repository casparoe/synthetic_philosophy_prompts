answer: |-
  Here's a menu of distinct readings of "the dispute is merely verbal," analyzed for plausibility, dismissive force, and handling your complications. The likely group invocation is **Reading 2 (Descriptive Equivalence)** or **Reading 4 (Ontological Deflationism)**.

  ### The Menu of Readings

  1.  **Lexical Ambiguity (Different Senses):**
      *   **Thesis:** "Composite object" or "exists" means different things for each side (e.g., one side uses "object" only for simples, the other uses it for simples *and* arrangements). They talk past each other.
      *   **Platitude?** Close to core meaning of "verbal dispute."
      *   **Defensible?** Superficially plausible, but unlikely in *philosophical* contexts where terms are precisely stipulated. Both sides typically aim for the *same* meaning of "exists" and "composite object."
      *   **False?** Probably in this context. Both sides intend robust ontological claims using shared concepts.
      *   **Dismissive Force?** Strong, if true. Switching to a shared lexicon resolves it.
      *   **Complication 1 (Naturalness):** The second-order dispute *could* be verbal if "natural" is ambiguous, but likely survives as distinct.
      *   **Complication 2 (Mutual Falsehood):** Undermines this reading. Calling the other *false* suggests shared meaning/reference, not mere ambiguity.

  2.  **Descriptive Equivalence (Agreement on Non-Linguistic Facts):**
      *   **Thesis:** All non-linguistic facts are identical: simples, properties, relations, arrangements. Disagreement is *only* about which linguistic description ("There is a table" vs. "There are simples arranged tablewise") to apply to this single reality. Adding "composite object" adds no new fact.
      *   **Platitude?** Core idea behind common dismissals of ontological debates.
      *   **Defensible?** Highly substantive and controversial (assumes a sparse, Humean, or predicate-nominalist view of facts). Defended by deflationists, some empiricists. Attacked by realists who see composition as an *additional* fact.
      *   **False?** Realists argue composition *is* a non-linguistic fact. This thesis itself is the heart of the *substantive* debate for many.
      *   **Dismissive Force?** **Strongest dismissive force** *if accepted*. If true, arguing is pointless syntax.
      *   **Complication 1 (Naturalness):** The second-order dispute is **distinct and substantive**. Is "composition occurs here" a *natural* or *joint-carving* fact? This is a new ontological/metaphysical question.
      *   **Complication 2 (Mutual Falsehood):** Severely challenges this reading. If Side A says Side B's claim "There is no table" is false *simpliciter* (given simples arranged tablewise), they *deny* descriptive equivalence; they think reality *includes* the table fact. Dismissive force weakens significantly.

  3.  **Contextual Relativism / No Language-Independent Truth Value:**
      *   **Thesis:** Truth about composition is relative to linguistic frameworks/conventions. "There is a table" is true *in* a framework accepting unrestricted composition, false *in* a nihilist framework. Neither is absolutely true/false.
      *   **Platitude?** No, a substantive (often Carnapian) metaontological view.
      *   **Defensible?** Yes, defended by ontological relativists/conventionalists. Attacked by realists and some deflationists.
      *   **False?** Realists deny truth is framework-relative for fundamental ontology.
      *   **Dismissive Force?** Moderate. It dissolves *that specific dispute* ("Which framework is *absolutely* right?") as ill-posed, but shifts focus to framework choice.
      *   **Complication 1 (Naturalness):** The second-order dispute **survives**. Is framework choice *itself* constrained by a language-independent naturalness fact? Relativists say no (it's pragmatic), realists say yes.
      *   **Complication 2 (Mutual Falsehood):** **Directly contradicts** this reading. If each side calls the other *absolutely false*, they reject truth relativism. This reading becomes unavailable.

  4.  **Ontological Deflationism (No Fact of the Matter):**
      *   **Thesis:** There is simply no objective, language-independent fact about whether composition occurs beyond simples and arrangements. The dispute lacks a subject matter. "Exists" in this context is not a robustly factual predicate.
      *   **Platitude?** No.
      *   **Defensible?** Yes, a strong form of anti-realism or non-factualism about ontology (beyond base facts). Defended by some pragmatists, expressivists, or radical deflationists.
      *   **False?** Realists vehemently deny this.
      *   **Dismissive Force?** Very strong. If true, the dispute is *literally* about nothing substantive.
      *   **Complication 1 (Naturalness):** The second-order dispute *also* lacks a fact of the matter on this view. "Naturalness" claims would be similarly non-factual or expressive. The entire hierarchy collapses into non-factuality/pragmatics. **Becomes verbal/non-substantive all the way up.**
      *   **Complication 2 (Mutual Falsehood):** Challenges the reading. The *intensity* of mutual falsehood accusations suggests the parties *believe* there is a fact of the matter, even if the deflationist thinks they are mistaken. Dismissive force relies on convincing them of deflationism.

  5.  **Language-Naturalness (Debate is About Joint Carving):**
      *   **Thesis:** The parties agree on base facts but disagree about which linguistic/ontological framework (composites vs. simples only) *carves reality at its joints* or represents the *most natural* structure.
      *   **Platitude?** No.
      *   **Defensible?** Yes, a substantive metaontological view (Siderian realism about structure).
      *   **False?** Deflationists/relativists deny naturalness is objective; others might think it's irrelevant.
      *   **Dismissive Force?** **None.** It **transforms** the dispute into a substantive (arguably *more* fundamental) one about the objective structure of reality. It rejects the "merely verbal" dismissal.
      *   **Complication 1 (Naturalness):** This reading **is** the second-order dispute. It *is* the distinct and substantive question.
      *   **Complication 2 (Mutual Falsehood):** Compatible. Side A thinks "There is a table" is natural/true, Side B thinks it's unnatural/false *because* their frameworks track different (allegedly) objective structures. Mutual falsehood accusations reflect belief in objective naturalness.

  6.  **Pragmatic Instrumentalism (Debate is About Usefulness):**
      *   **Thesis:** The parties agree on base facts but disagree about which linguistic/ontological framework is *more useful* for explanation, prediction, communication, or practical purposes.
      *   **Platitude?** Common *move*, but not a platitude about "merely verbal."
      *   **Defensible?** Yes, a substantive pragmatic view (e.g., Carnap's tolerance + external questions).
      *   **False?** Realists argue truth/naturalness, not just utility, matters fundamentally.
      *   **Dismissive Force?** Moderate/Shifting. It dismisses the ontological dispute *as traditionally conceived* (about what *really* exists) by reducing it to utility. However, it opens a new (potentially very rich) dispute about *which framework is more useful* and *why*.
      *   **Complication 1 (Naturalness):** The second-order dispute **survives**. Is usefulness the *only* criterion, or is objective naturalness also a constraint/goal?
      *   **Complication 2 (Mutual Falsehood):** Compatible, but strained. Accusing the other of *falsehood* suggests a belief in objective correctness beyond mere pragmatics. Strong mutual falsehood leans against pure instrumentalism.

  **Most Likely Group Invocation:** The remark ("agree about which simples there are and how they are arranged") strongly points towards **Reading 2 (Descriptive Equivalence)**. It focuses on base-level agreement and implies no further fact to disagree about. **Reading 4 (Ontological Deflationism)** is also plausible, as the remark hints that the composite talk adds nothing factual beyond the arrangement description.

  ### Handling Complications

  1.  **Second-Order Disagreement (Naturalness):**
      *   **Survives as Substantive:** On Readings 2, 3, 5, 6, the question of whether naturalness is objective or pragmatic is a distinct and substantive meta-metaphysical dispute.
      *   **Collapses into Non-Substantive:** Only on **Reading 4 (Ontological Deflationism)** does the second-order dispute also lose its factual status. On **Reading 1 (Ambiguity)**, it *might* be verbal if "natural" is ambiguous, but likely isn't.
      *   **Is It Verbal?** Not on the most plausible readings of the *first*-order dispute being verbal (2 & 4). Reading 4 makes it non-substantive; others make it substantive.

  2.  **Mutual Falsehood Accusations & Ordinary Claims:**
      *   **Readings Still Counting as Verbal:** Only **Reading 4 (Deflationism)** genuinely maintains the dispute is non-substantive/non-factual *despite* the rhetoric. **Reading 3 (Relativism)** could, but is directly contradicted by the mutual falsehood claims.
      *   **Readings Challenged/Undermined:** Readings 1 (Ambiguity), 2 (Descriptive Equivalence), and 3 (Relativism) are significantly undermined. Reading 5 (Naturalness) and 6 (Instrumentalism) are compatible but the accusations suggest the parties *believe* their dispute is substantive (about nature or truth).
      *   **Dismissive Force Retention?** **Severely weakened.** Mutual accusations of falsehood indicate both sides perceive a *genuine conflict in belief about reality*, not just words or conventions. Only a committed deflationist (Reading 4) could confidently maintain dismissive force, arguing the parties are mistaken about the nature of their own dispute. The slogan loses most of its power to *convince the parties* to stop arguing.

  **Conclusion:** The "merely verbal" dismissal is far from simple. Its plausibility and dismissive force depend critically on accepting controversial metaontological theses (like Descriptive Equivalence or Ontological Deflationism). The complications reveal these underlying commitments. The mutual falsehood accusations strongly suggest the parties themselves reject the premises needed for the most straightforward dismissals (2 & 3), making the dismissal unlikely to persuade them and highlighting the substantive depth of the debate, particularly concerning naturalness (Reading 5). The group's remark likely invoked Descriptive Equivalence (Reading 2), but its dismissive force relies on a premise the realist side explicitly denies.
