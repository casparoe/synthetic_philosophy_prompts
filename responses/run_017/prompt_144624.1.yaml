  so I got into it with my officemate after the reading group last night and we couldn't locate the disagreement, so I want your number and how you got there.

  Here's the claim I want a credence on, stated as precisely as I can manage:

  P: the multiple-reductions problem for the natural numbers has no fully satisfactory answer. Concretely: the naturals have to be identified with some particular objects if platonism of the object-y kind is true; there are indefinitely many candidate reductions that do the number-job perfectly (von Neumann's 0 = ∅, 1 = {∅}, 2 = {∅, {∅}}, …; Zermelo's 0 = ∅, 1 = {∅}, 2 = {{∅}}, 3 = {{{∅}}}, …; any ω-sequence whatever); they disagree on mixed statements — under von Neumann 0 ∈ 2 comes out true, under Zermelo it comes out false; and every available response either (i) picks arbitrarily among candidates that are equally good at the job, (ii) makes the choice non-arbitrary only by changing the subject (no determinate truth value for the mixed statements, or reference fixed by our stipulation rather than by the object), or (iii) gives up on numbers being sets at all and then owes an account that just relocates the problem.

  I'm at about 0.55. My officemate is at about 0.2, and thinks the whole thing was basically defused decades ago. Give me your own number, but mostly the decomposition. The terms I'd like you to price, with a rough probability and a line of justification each, and then combine (say explicitly whether you're multiplying, or whether some terms are alternatives rather than conjuncts — I suspect that's where a lot of the slack is):

  1. That "which object is the number 2?" is even a well-posed question under platonism — i.e. whether there can be a non-structural, this-one-and-not-that-one fact here at all, over and above everything the two candidates share.
  2. That our actual practice fixes the reference anyway: we really do use von Neumann ordinals, 0 ∈ 2 is genuinely provable in the textbooks we teach from, so maybe use fixes reference here the way it plausibly fixes it elsewhere — and if so, whether that's a solution or a concession that this bit of mathematics is partly stipulated.
  3. The tie-breaker I keep coming back to and never see discussed: Zermelo's recursion has no limit stage, von Neumann's generalizes to the transfinite ordinals, and we need the finite ordinals to be the same objects as the finite numbers if set theory is going to do its usual work. Does that make the choice principled, or is the principled-ness being smuggled in by a second job description (representing order types) that isn't the job of being a number? Is "Zermelo for finite, von Neumann beyond" a real option or a mess?
  4. That the non-set route (numbers as their own kind of thing) escapes rather than relocates it, given that you still need numbers to apply to sets — eight planets, continuum-many reals — and the relation doing that applying looks like it can ask the same Caesar-flavoured question again.
  5. This hypothetical, which is the one I'm least sure how to read: suppose we had good reason to think the actual universe of sets admits a nontrivial automorphism that moves some pure set (so the two reductions are, as it were, structurally interchangeable from the inside, and every possible piece of evidence is neutral between them). Would that be evidence that there's no fact of the matter which reduction is the numbers, or evidence against that being the right background set theory? Which way does it cut, and how much of your number rides on that call?
  6. How much rides on what counts as solving: if the structuralist says any ω-sequence does fine and nothing is lost by there being no fact, is that a dissolution that should lower your credence in P, or is P's "no satisfactory answer" already meant to cover it? Be explicit about the stipulation you're using.

  Then: which single term is your number most sensitive to, and what one argument or result (a proof about rigidity or automorphisms of the set-theoretic universe, a worked-out account of reference-fixing by mathematical practice, an actual community of mathematicians using the other reduction and getting on fine) would move you the most, and in which direction? And finally: if you had to bet, which of those sub-questions is where my 0.55 and my officemate's 0.2 are actually disagreeing, as opposed to where we think we're disagreeing?
