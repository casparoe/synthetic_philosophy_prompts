  Okay, let me start by really understanding the user's problem. They're a philosophy professor on a working group tasked with recommending a teaching metric. The university needs a single number for the Board of Trustees after ditching student evaluations due to bias issues. There are two main proposals: the vendor's Clarity Index and the noise-and-secrecy approach. The pilot of the Clarity Index showed clear gaming—departments manipulating the LMS login and professors teaching to the rubric when observers are present. The noise-and-secrecy method aims to prevent gaming by hiding details and adding noise, but it risks faculty trust and union issues.

  Hmm, the user's explicit needs are a concrete recommendation with a timeline, addressing the main counterargument, distinguishing between gaming and genuine improvement, and including a clause for future evidence. But digging deeper, they might be struggling with the philosophical tension between measurable accountability and the intrinsic, complex nature of teaching quality. They mentioned Goodhart's law, which indicates they're aware of metrics distorting what they measure. Their field is social epistemology, so they probably value processes that foster genuine knowledge over performative compliance.

  The user also needs the memo to be actionable for the Senate. They don't want a vague compromise but a clear stance. The noise-and-secrecy model's trust issues are significant, especially in academia where faculty autonomy is prized. The union grievance risk is real. But the alternative—a transparent metric—gets gamed. So how to balance these?

  I recall Campbell's Law and Goodhart's Law as frameworks. The Clarity Index failed because the metrics became targets. Noise-and-secrecy tries to obscure the target, but that undermines transparency and trust. Is there a middle path? Maybe a hybrid where the metric is used only for broad institutional oversight, not individual evaluation, paired with peer reviews that aren't part of the metric. That way, the Board gets their number, but faculty aren't directly incentivized to game it. 

  Also, distinguishing types of metric movement is crucial. The user pointed out that "gaming" is used loosely. Real gaming (like TAs logging in), metric constitutive shift (teaching to the rubric), and actual improvement (better practices) need different responses. The recommendation should allow departments to analyze their data qualitatively to tell these apart.

  For the future evidence clause, specific indicators like gaming patterns or faculty surveys make sense. The Center for Teaching Excellence could monitor this. Including a sunset clause forces reevaluation, showing the recommendation is provisional based on evidence.

  The user’s identity as a philosopher suggests they’d appreciate grounding in theory (like constitutive effects) while needing practical solutions. Their mention of the department gaming without embarrassment indicates institutional culture matters. A solution must work within that culture without breeding cynicism.

  In the end, rejecting both proposals and suggesting a third way—using the metric only for institutional health, not individuals—might be best. It satisfies the Board’s need for a number but minimizes individual gaming incentives. Pairing it with local, formative peer reviews addresses teaching quality without the audit issue. This balances accountability with trust, using the metric as a diagnostic tool rather than a target.
answer: |-
  ## MEMORANDUM

  **To:** Faculty Senate  
  **From:** Undergraduate Teaching Metrics Working Group  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Institution-Wide Undergraduate Teaching Metric  

  ### 1. Introduction and Context
  This Working Group was charged with recommending a single, comparable metric for undergraduate teaching quality, following the discontinuation of student evaluations. The Board of Trustees requires an auditable number per section. We examined the vendor-proposed "Clarity Index" and an alternative "Noise-and-Secrecy" model during a pilot phase. Both approaches revealed significant flaws under real-world conditions, reflecting well-documented challenges in measurement theory (Goodhart's Law, Campbell's Law) and institutional design. Our analysis prioritizes a metric that minimizes perverse incentives while preserving faculty trust and pedagogical integrity.

  ### 2. Critical Assessment of Proposed Models
  We evaluated four distinct conceptual designs:

  *   **A. The Clarity Index (Explicit Composite):**
      *   *Design:* Weighted average of (i) scored observations (rubric-based), (ii) LMS login rates (Week 1), (iii) syllabus string compliance. Transparent weights and scores.
      *   *Failure Mode:* **Constitutive Shift & Direct Gaming.** As witnessed: LMS logins became a TA task, not student engagement. Observed classes rigidly conformed to the rubric's most visible elements (e.g., minute-12 think-pair-shares), irrespective of pedagogical fit. The metric ceased to measure *teaching quality* and began defining it narrowly. Syllabus compliance became box-ticking. This is a classic case where the proxy *becomes* the target, distorting the underlying activity.

  *   **B. Noise-and-Secrecy (Obfuscated Composite):**
      *   *Design:* Composite score (components similar to A, but undisclosed weights/algorithm), unannounced randomized observations, calibrated statistical noise injected into individual reports (precise institutional score retained).
      *   *Failure Mode:* **Erosion of Trust & Legitimacy.** While theoretically hindering precise gaming by obscuring the target, this model fundamentally undermines faculty agency and trust. Instructors cannot discern whether feedback reflects their efforts or random noise, leading to frustration, perceived unfairness, and disengagement. Union grievances over lack of transparency and due process are highly likely. Pedagogical improvement becomes guesswork, potentially fostering superstitious behaviors rather than informed reflection.

  *   **C. Pure Peer Review Audit Trail:**
      *   *Design:* Standardized peer review process generating a quantifiable "quality score" based on rubric application, with rigorous cross-departmental auditor training and documented audit trails for the Board.
      *   *Failure Mode:* **Rejection by Board (Auditability Concern).** The Board explicitly rejected holistic peer review as unauditable across campuses. While we believe robust audit protocols *could* be designed, the Board's stated requirement precludes this option currently.

  *   **D. Institutional Health Metric (Limited Scope Composite):**
      *   *Design:* A simplified composite (e.g., observation score *trend*, high-level LMS usage patterns, syllabus compliance) used **solely** for aggregate institutional/departmental health reporting *to the Board*, **decoupled entirely from individual faculty evaluation or reporting.** Individual assessment reverts to robust, formative, department-managed peer review and student *feedback* (not scores).
      *   *Mitigation of Failure Modes:* By removing high-stakes consequences for individuals, the incentive for intensive gaming is drastically reduced. The metric serves the Board's need for an auditable "institutional pulse" on teaching support/process compliance without distorting individual teaching. Gaming at the institutional level (e.g., pressuring departments on compliance) remains possible but is harder, slower, and more visible.

  ### 3. The Working Group Recommendation: Institutional Health Metric with Protected Peer Review
  **We recommend adopting Model D ("Institutional Health Metric") with immediate effect for Fall 2024, alongside a mandated revitalization of formative, non-punitive peer review processes at the department level.**

  *   **Concrete Implementation:**
      1.  **Metric Components (Board Reporting Only):**
          *   *Department-Level Observation Trend:* Median score change (using a refined, less prescriptive rubric) over 3 years. (Avoids targeting individuals, focuses on support impact).
          *   *LMS Health Indicator:* % of sections meeting a *minimum* threshold of basic LMS activity (e.g., >90% students have *some* activity by Week 3; excludes Week 1 logins specifically). Focuses on baseline tool usage, not engagement proxies.
          *   *Syllabus Compliance Pass/Fail:* Binary indicator if required policy strings are present.
          *   *No Single Instructor Score:* Components are aggregated to the department/program level annually. No individual composite score is calculated or reported, internally or externally.
      2.  **Individual Faculty Evaluation:** Remains the sole purview of departments via **enhanced peer review.** Senate mandates departments develop/revise peer review protocols (by end of Summer 2024) emphasizing formative feedback, multiple evidence sources (e.g., classroom visits, syllabus, assignments, *anonymous student feedback comments*), and calibration training. *These processes are entirely separate from the institutional metric.*
      3.  **Timeline:**
          *   Nov 2023: Senate approves framework.
          *   Dec 2023 - May 2024: Working Group refines metric specifics & rubric; CTL develops peer review training resources.
          *   June 2024: Senate approves final metric definition & peer review mandate.
          *   AY 2024-25: Full implementation. Data collected for institutional metric (dept-level); departments implement revised peer review.
          *   Spring 2026: Formal review (see Section 5).

  ### 4. Addressing the Strongest Counterargument: The Gaming Imperative
  The core argument for Noise-and-Secrecy (Model B) is powerful: *any fully transparent, high-stakes metric will inevitably be gamed, rendering it meaningless.* We agree this is a profound risk, evident in the Clarity Index pilot. However, we reject Model B because its "solution" – obscuring the target and injecting noise – is institutionally corrosive. It:

  *   **Undermines Trust:** Faculty cannot trust the feedback or the system, breeding cynicism and disengagement.
  *   **Hinders Real Improvement:** Without knowing what signals matter or if changes had an effect, instructors lack actionable guidance.
  *   **Creates Legitimacy & Labor Issues:** Secrecy conflicts with academic values and will inevitably provoke union challenges over fairness and due process, likely resulting in costly grievances and abandonment of the system.

  **Model D directly addresses the gaming imperative differently:** By decoupling the auditable institutional number from *individual consequences*, the primary driver of destructive gaming is removed. Departments have an interest in reasonable institutional scores (reflecting basic support and compliance), but individual faculty are not optimizing their teaching for a single, high-stakes number. Their focus remains on departmental peer review and genuine pedagogical development. The institutional metric becomes a diagnostic tool for support services, not a performance target for individuals.

  ### 5. Distinguishing Metric Movement: Beyond "Gaming"
  Our recommendation necessitates vigilance regarding how the metric behaves:
  *   **Gaming (Manipulation):** E.g., artificially boosting LMS "activity" via TA actions. Mitigated by removing individual stakes and using harder-to-fake indicators (e.g., activity spread over weeks, not a single login).
  *   **Constitutive Shift:** The metric subtly redefines "good teaching." Mitigated by using the metric only for broad institutional health (not defining individual quality) and protecting diverse pedagogical practices within peer review.
  *   **Genuine Improvement:** E.g., wider adoption of evidence-based practices *because they work*, not just for the metric. This is the desired outcome, fostered by the protected peer review space and CTL support. We must ensure metric changes are *interpreted* in light of these distinctions.

  ### 6. Sunset Clause and Evidence of Failure
  This recommendation is adopted with a built-in review trigger:

  *   **Formal Review:** By April 15, 2026, the Senate will commission an independent review team (faculty, assessment expert, union rep).
  *   **Evidence Requiring Action:**
      1.  **Systematic Gaming:** Evidence of widespread, deliberate distortion of the institutional metric components (e.g., systemic falsification of LMS data, rubric coaching focused solely on metric points).
      2.  **Peer Review Failure:** Evidence that departments have failed to implement robust, formative peer review, or that it has become corrupted by the institutional metric's existence.
      3.  **Trust Erosion:** Significant, documented faculty sentiment (via surveys or senate channels) that the system is unfair, opaque, or detrimental to teaching quality, irrespective of metric movement.
      4.  **Board Dissatisfaction:** The Board formally rejects the institutional metric as insufficient for its oversight role.
  *   **Consequence:** If *two or more* of these conditions are met, the Senate *must* reconvene the Working Group or a successor body by May 2026 to propose fundamental revisions or a new model to the Senate by December 2026. **The Provost's Office is responsible for initiating this review process and presenting findings.**

  ### 7. Conclusion
  The quest for a single, perfect, high-stakes teaching metric is a fool's errand, guaranteed to distort teaching or destroy trust. We reject both the transparent but gameable Clarity Index and the opaque, corrosive Noise-and-Secrecy model. Instead, we propose a practical separation of concerns: a **minimalist, aggregate Institutional Health Metric** satisfies the Board's need for an auditable number while **protecting individual faculty evaluation** within departments via **revitalized, formative peer review**. This approach acknowledges the limits of quantification, mitigates perverse incentives, preserves faculty autonomy and trust, and keeps genuine pedagogical improvement as the core focus. We urge the Senate to adopt this recommendation.

  Respectfully submitted,
  The Undergraduate Teaching Metrics Working Group
