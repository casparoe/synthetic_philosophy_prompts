  Hmm, the user wants me to analyze authorship policies in academic journals from a philosophical perspective. They work on research integrity for a consortium and are puzzled about what current authorship rules really imply about joint action and collective intentionality.

  The standard authorship regime has four conditions: substantial contribution, drafting/revision, final approval, and accountability for the entire work. There are also contributor-role statements for non-author contributions. The user notes several contradictions in practice: papers with thousands of authors where individual accountability is impossible, posthumous authors who can't approve or be accountable, and AI systems being excluded despite significant contributions.

  A new proposal called "distributed guarantee authorship" is being considered for large collaborations. Instead of listing individual authors, the byline would show the collaboration name, with individuals acting as guarantors for specific components. They'd sign statements of mutual reliance but wouldn't vouch for the whole paper. Retractions would attach to components and their guarantors, not the whole work.

  I need to reconstruct the implicit theory behind current practices and this proposal. The key philosophical frameworks I should consider include:

  - Shared intention theory (Bratman): Where authorship requires meshing subplans and commitment to joint activity
  - Plural subject theory (Gilbert): Where authors form a plural subject through joint commitment
  - Collective acceptance theory (Searle, Tuomela): Where authorship is a collectively assigned status function
  - Group agency theory (List & Pettit): Where the group itself is an agent with its own attitudes

  For the current four-condition regime, I notice several important features:
  1. The accountability requirement is central but problematic in edge cases
  2. There's insistence on individual identifiability of contributions
  3. Final approval implies a collective decision point
  4. The system maintains individual liability despite collective output
  5. AI exclusion suggests responsibility is constitutive of authorship

  The contradictions are revealing: large collaborations violate identifiability and accountability, dead authors can't approve or be accountable, yet we still call them authors. AI exclusion emphasizes responsibility as essential.

  For the distributed guarantee proposal, it seems to reject genuine group agency in favor of component-level accountability with mutual reliance. But it might accidentally create a minimal plural subject through the mutual reliance statement.

  I think the current practice implicitly relies on plural subject theory but with a flawed implementation. The accountability condition does real work but is inconsistently applied. The proposal offers a pragmatic solution for large teams but sacrifices holistic ownership of the work.

  If we switched theories:
  - Adopting shared intention theory would require evidence of joint planning
  - Collective acceptance would make authorship purely conventional
  - Group agency would require formal decision procedures

  The practice is underdetermined in places - for example, the approval condition could fit multiple theories. To resolve this, we'd need to examine how sanctions are applied and whether groups can be held liable.

  For the proposal, mutual reliance creates a weak plural subject but doesn't establish full group agency. Losing holistic accountability matters because it fragments epistemic responsibility.

  I'll argue that journals should treat small teams as plural subjects with individual accountability, while for large collaborations, distributed guarantee could work if formalized as a group agent with internal procedures. AI should be handled through contributor statements with human guarantors.
answer: |-
  ## The Implicit Social Ontology of Academic Authorship

  ### Reconstructing the Implicit Theory
  The standard four-condition authorship regime presupposes a **hybrid model leaning heavily toward Margaret Gilbert’s plural subject theory**, with significant concessions to individualism. It is *not* best read as describing a shared intention (à la Bratman) or a robust group agent (à la List & Pettit), nor is it a mere allocation of credit. Here’s why:

  1.  **Accountability as Constitutive:** The accountability condition ("agreement to be accountable for *every aspect* of the work") is the regime’s philosophical core, not an aspirational add-on. It transforms authorship from mere contribution into a deontic commitment. This mirrors Gilbert’s core idea: a plural subject arises when individuals jointly commit to espouse a goal *as a body*, creating mutual obligations. Authors don’t just contribute; they jointly commit to *standing behind the whole work* and holding each other answerable. This explains the insistence on mutual identification and confidence.

  2.  **The Indivisibility of the "Work":** The requirement for *each* author to be accountable for the *entire* work presupposes that the paper is a unified object owned and vouched for *collectively*. This aligns with the plural subject view of a collective "we" owning the act and its consequences. An individualist credit-allocation model could not explain why a methodologist must answer for a statistician’s fraud if they genuinely lacked oversight capacity – yet this is demanded by the rules.

  3.  **Approval as Joint Commitment:** Final approval isn’t merely individual assent; it’s the collective endorsement making this *the group’s* publication. This functions as the public act of joint commitment constitutive of a plural subject for this specific work.

  **Where Individualism Creeps In:** The regime is hybrid because it simultaneously insists on individual identifiability of contributions ("each author should be able to identify which co-author is responsible for which part"). This injects an individualist, credit-tracking element inconsistent with pure plural subjecthood. A true plural subject’s commitment is to the *joint* product, not its atomized parts. This tension reveals the regime’s struggle: it wants collective responsibility *built upon* traceable individual actions.

  **Rival Theories Rejected:**
  *   **Shared Intention (Bratman):** While meshing subplans exist (e.g., agreeing on methods), the regime doesn’t require the rich interdependence and bargaining about subplans central to Bratman. Authorship can arise from parallel contributions integrated later (e.g., in large labs), lacking true shared intention *during* creation.
  *   **Group Agency (List & Pettit):** There’s no requirement for the group to have decision procedures, unified beliefs, or attitudes irreducible to the authors' individual attitudes. The corresponding author acts as a coordinator/facilitator, not necessarily as the mouthpiece of a group mind.
  *   **Pure Individualism/Credit Allocation:** This fails utterly to explain the non-detachable accountability for the whole work. Credit could be allocated without demanding that a writer answer for a co-author’s fabricated data.

  ### Strains in the Practice: What They Reveal
  1.  **Mega-Authorship & Posthumous Authors:** These violate the core plural subject presuppositions. In mega-projects, mutual identification, confidence, and genuine joint commitment to whole-work accountability are impossible. Posthumous authors cannot *commit* (approve) or *discharge obligations* (be accountable). The persistence of authorship labels here exposes a conflict: the *credit/convention* aspect of authorship (individualist) is prioritized over the *responsibility* aspect (plural subject). This suggests the regime is philosophically unstable – it officially demands plural subjecthood but pragmatically retreats to conventionalism when plural subject formation is impractical.
  2.  **AI Exclusion:** This decisively shows that answerability is **constitutive** of authorship, not appended. The rationale ("cannot consent or take responsibility") explicitly ties authorship to the capacity for deontic commitment within a normative framework. Journals aren’t merely saying AI *shouldn’t* be accountable; they’re saying the *inability* to be part of such a commitment relation disqualifies it from authorship *by definition*. This exclusion is **principled** within the implicit plural subject framework but appears **ad hoc** if authorship is seen purely as causal contribution or credit.

  ### Distributed Guarantee Authorship: Mimicry or Mutation?
  Distributed Guarantee Authorship (DGA) explicitly **rejects the core plural subject element** of the standard regime and instead constructs a model of **structured mutual reliance undergirded by collective acceptance**.

  1.  **Rejection of Holistic Plural Subject:** By having no one vouch for the *paper as a whole* and making the "collaboration" (a name, not an agent) the nominal author, DGA abandons the idea of a plural subject jointly owning *the entire work*. Accountability is fractured and localized to components.
  2.  **Mutual Reliance as Collective Acceptance:** The guarantor’s statement ("produced in reliance... would have withdrawn...") is a performative act of **collective acceptance** (Searle, Tuomela). Guarantors collectively accept a framework where the validity of their contribution (and thus the published paper) depends normatively on the validity of others'. This creates a web of conditional commitments and entitlements.
  3.  **Minimal Group Agency?** DGA creates a *weak* form of collective intentionality, arguably a **minimal plural subject for the reliance framework itself**. Guarantors jointly commit ("we" agree) to the rule: "If component X is flawed, guarantor Y must withdraw." The "collaboration" becomes a collectively accepted status function ("the author") carrying this framework. However, it lacks the robust commitment to the *epistemic content of the whole paper* as "ours" that defines authorship under the standard regime. It’s agency *about the rules of reliance*, not agency *about the scientific claims*.

  **What is Lost?** The loss is **holistic epistemic responsibility**. Under the standard regime, *every author* is answerable for the truth, coherence, and integrity of the *entire* argument and dataset. This forces integrative review and creates a powerful, diffuse safeguard. DGA fragments this. While component-level accountability is strong locally, no one is responsible for ensuring the *integration* of components is sound or that the *overall conclusions* are justified by the assembled parts. The "collaboration" as author cannot *act* or *answer*; it’s a legal fiction. Sanctions fall only on individuals for *their* component’s failure, potentially missing systemic flaws arising from interaction.

  **Would a Demanding Group Agent Help?** If the collaboration *were* a genuine group agent (with decision procedures, ability to form beliefs, revise commitments), DGA would be unnecessary. Such an agent *could* holistically own the paper, approve it, and be accountable. Its internal procedures would determine how component failures impact the whole and trigger retraction. DGA arises precisely because forming such a demanding agent is impossible for very large groups, forcing a retreat to a reliance-based structure.

  ### What Would Change Under Rival Theories?
  Switching the implicit theory would necessitate concrete policy shifts:

  1.  **Adopt Bratmanian Shared Intention:**
      *   **Change:** Require evidence of *ongoing joint planning and intention meshing* during the research/writing (e.g., documented team meetings, shared protocols showing negotiation of subplans). Mere contribution + final approval wouldn’t suffice.
      *   **Consequence:** Many traditional lab structures (PI-driven, hierarchical contributions) might struggle to demonstrate genuine shared intention, potentially shrinking author lists. Ghost/guest authorship would be harder to hide.
      *   **Retraction:** Focus might shift to whether the *shared plan* was defective or violated by a member.

  2.  **Embrace Full Group Agency (List & Pettit):**
      *   **Change:** Require groups to have a formal constitution or decision procedure *before* listing as author. The group entity, not individuals, would sign the approval and accountability statements. The corresponding author would be the *group’s designated agent*.
      *   **Consequence:** Journals would need mechanisms to recognize and interact with group agents (e.g., requiring registration of group decision rules). Sanctions (retraction, bans) would primarily target the *group entity*, impacting its standing, not (directly) individuals. Individual guarantor roles like DGA would be redundant; the group agent would manage internal accountability.
      *   **Retraction:** Triggered by a failure of the group’s internal processes or a collective failure of belief/justification formation.

  3.  **Shift to Collective Acceptance/Conventionalism (Searle):**
      *   **Change:** Sever the *necessary* link between contribution and accountability. Authorship could be assigned by collective agreement based on convention or institutional needs. The accountability condition could be dropped or made optional/detachable ("We collectively accept X as author; X *may* choose to take on accountability").
      *   **Consequence:** Mega-authorship and posthumous authorship become unproblematic. AI exclusion loses its principled basis – if authorship is purely conventional status, why *couldn't* a group conventionally assign it to an AI? DGA would be a natural extension.
      *   **Retraction:** Primarily an act affecting the conventional status of the work; individual sanctions would rely entirely on external misconduct policies, not inherent to authorship.

  ### Underdetermination and Resolving Evidence
  The practice is **underdetermined** regarding:
  *   **The Approval Condition:** Signing off *could* signify individual assent (individualist), joint commitment (plural subject), or merely fulfilling a procedural requirement (conventionalism). Its *function* as the act making publication the "group's" act pushes towards plural subject.
  *   **Contributor Roles vs. Authorship:** The existence of non-author contributor roles shows authorship isn't *just* about contribution, but it doesn't specify *what else* is needed. Rival theories could explain this distinction: plural subject (the extra commitment), group agency (membership), conventionalism (status assignment).

  **Resolving the Underdetermination:** Key evidence lies in **how journals enforce sanctions and interpret accountability**:
  1.  **Do journals hold *all* authors responsible for a central fraud, even those demonstrably uninvolved in that part?** (Yes, usually, supporting plural subject).
  2.  **Can a group be *collectively* sanctioned (e.g., a collaboration banned), independent of individual sanctions?** (Rarely; sanctions target individuals, undermining pure group agency).
  3.  **Is authorship status readily transferable by convention alone, without contribution/commitment?** (Guest authorship is condemned, suggesting contribution/commitment are essential, not just conventional status).

  The current enforcement patterns (holistic accountability enforced where possible, pragmatic retreats when impractical) strongly suggest the **plural subject-with-tension** model is the actual, albeit imperfectly realized, presupposition.

  **Recommendation & Least Confident Point:** Your current standard regime implicitly relies on plural subject theory but is undermined by its own individualism (identifiability requirement) and pragmatic compromises (mega/dead authors). **DGA is a pragmatic adaptation for scale, creating a weaker collective acceptance structure focused on reliance, but sacrificing holistic epistemic responsibility.** To make DGA philosophically coherent and practically sound, explicitly frame the "collaboration" not as a faux-author, but as a *minimal plural subject constituted by the guarantors' joint commitment to the reliance framework*. Require clear documentation of this framework and its governance (e.g., how component disputes/retractions are handled collectively). For AI, maintain exclusion from authorship based on incapacity for commitment, but rigorously require human guarantors for AI-generated components listed in contributor roles.

  **Least Confident Point:** I am least confident about whether the *mutual reliance statement* in DGA genuinely creates a *new* plural subject for the reliance rules, or if it merely creates a complex set of individual conditional obligations. The performative act of signing *together* likely pushes it towards minimal plural subjecthood, but its depth is questionable compared to the standard regime's "whole work" commitment.
