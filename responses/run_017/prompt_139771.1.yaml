  We are given a history of six decisions and a new submission. We need to determine which rules fit the six past verdicts and then see how they apply to the new case. We are also asked to consider a symmetry test proposed by a colleague.

  First, let's summarize the six past cases:

  1. **Rejected**: Atlantis as a real Bronze Age thalassocracy (based on Plato as reportage and comparative mythology).
  2. **Rejected**: Ancient astronauts (inferred from unexplained engineering).
  3. **Rejected**: New Chronology (whole record is a retrojected forgery).
  4. **Published (with rejoinder)**: Pre-Columbian trans-Pacific contact (botanical and linguistic evidence, tightly scoped).
  5. **Published**: Two monographs:
     a. Argued that a dark-age gap is an artifact of preservation (methodologically conventional, modest).
     b. Colonial-era excavation looted and misdated a site (conventional, modest, reparative).
  6. **Rejected (split vote)**: Neolithic marks as a lunar calendar (pushing writing back two millennia) because the evidence was too thin for the size of the revision. However, the same author had a narrow paper on a single sign published.

  Now, the new submission:
  - Reanalysis of one submerged harbour site.
  - Single radiocarbon series on short-lived seed material (but a specialist says it might be redeposited).
  - Argues that a culture dated to the 2nd millennium BC actually flourished 800 years earlier and exported its script to two neighbouring regions, forcing redating of three regional sequences.
  - Works from primary excavation reports.
  - Answers mainstream objections in a 40-page appendix.
  - States what would refute it (falsifiability).
  - Predicts a buried quay at a named spot (if the dating is right).
  - Offers to appear with a critic's rejoinder.
  - Preface: reparative goal (giving a people back their antiquity taken by colonial chronology).

  The quay won't be excavated before the decision.

  The colleague's symmetry test: demand of the revisionist thesis only what the received chronology it attacks meets, and no more.

  **Objective**:
  - Find rules that fit all six past verdicts.
  - See where they come apart on the new case.
  - Give the decision that best coheres with precedents.
  - Identify the closest analog among the past cases.
  - State the principle we would be adopting.
  - Identify a single change that would tell the surviving rules apart.

  **Step 1: Inferring the rules from past verdicts**

  We can try to extract principles from the rejections and acceptances.

  **Rejections (Cases 1, 2, 3, 6):**
  - Case 1: Atlantis. Rejected because it relies on reading Plato as reportage and comparative mythology. This is not considered solid evidence (mythology is not history).
  - Case 2: Ancient astronauts. Rejected because the argument is from ignorance (if you can't explain the engineering, it must be aliens). This is a logical fallacy.
  - Case 3: New Chronology. Rejected because it claims the entire record is forged. This is an extraordinary claim that would require extraordinary evidence, and the manuscript did not provide it.
  - Case 6: Neolithic calendar. Rejected because the evidence (small corpus of marks) was too thin for such a large revision (pushing writing back two millennia). The press says: "the load-bearing evidence is too thin for the size of the revision".

  **Acceptances (Cases 4, 5a, 5b, and a narrow paper from the author of case 6):**
  - Case 4: Pre-Columbian contact. Published with a rejoinder. It was tightly scoped and based on botanical and linguistic evidence (which are more concrete). The tight scope and specific evidence made it acceptable, but with a rejoinder to show balance.
  - Case 5a: Dark-age gap as preservation artifact. Published: methodologically conventional, modest in what it overturns.
  - Case 5b: Colonial-era excavation looting and misdating. Published: conventional, modest, and reparative.
  - Also, the author of case 6 had a narrow paper on a single sign published (so narrow, focused claims are acceptable).

  **Patterns for rejection:**
  - Extraordinary claims without sufficient evidence (especially when the evidence is weak or based on fallacies).
  - Claims that are too broad and revolutionary without commensurate evidence (like rewriting the entire chronology or the origin of writing) when the evidence is thin.
  - Arguments from ignorance (like ancient astronauts) or from mythology.

  **Patterns for acceptance:**
  - Claims that are modest in scope (overturning a small part of the record) and methodologically sound.
  - Claims that are tightly focused and backed by multiple lines of evidence (like botanical and linguistic for trans-Pacific contact) even if they are somewhat controversial, but then published with a rejoinder.
  - Reparative intent is acceptable when the methodology is conventional and the claim is modest.

  **Rules we might infer:**
  1. **The modesty rule**: The scale of the revision must be proportionate to the strength and scope of the evidence. A large revision requires very strong and extensive evidence.
  2. **The methodology rule**: The argument must be methodologically sound (not based on logical fallacies, not relying on weak evidence like mythology, not arguments from ignorance). Conventional methods are preferred, but unconventional methods might be acceptable if the evidence is very strong and the scope is tight.
  3. **The falsifiability rule**: The thesis should be falsifiable (as in the new submission) and ideally make testable predictions (like the quay prediction). However, note that case 6 was rejected even though it might have been falsifiable? The problem was the thin evidence.
  4. **The reparative intent**: This is not enough by itself (otherwise the Atlantis case might have been accepted? But it wasn't). It must be combined with solid methodology and modesty.

  **Step 2: Apply the rules to the new submission**

  New submission:
  - Claim: Redating a culture by 800 years and having it export its script, which forces redating three regional sequences. This is a large revision (like case 6 which pushed writing back two millennia, which is about 2000 years? So 800 years is also substantial but not as much? But note: it affects three regions). So the scale is large.
  - Evidence: One site with a single radiocarbon series (on short-lived seeds) which is disputed (redeposition issue). The author answers objections in an appendix and makes a prediction (quay) and offers to have a rejoinder.
  - Reparative intent: Giving a people back their antiquity taken by colonial chronology.

  Comparing to past cases:
  - The scale of revision is large (like case 6, which was rejected for being too large for the evidence). Here the evidence is one radiocarbon series (with a potential problem) from one site. The author has addressed objections, but the evidence is still thin (only one site, one type of evidence, and that evidence is contested).
  - The reparative intent is similar to case 5b (which was accepted) and the Atlantis case (which was rejected). So intent alone is not enough.
  - The prediction of the quay is a plus (falsifiability) but it hasn't been tested and won't be before the decision. So we cannot rely on that.
  - The offer to have a rejoinder is similar to case 4 (which was published with a rejoinder). But note that case 4 had multiple lines of evidence (botanical and linguistic) and was tightly scoped. This new claim is broader.

  Closest analog: Case 6 (the Neolithic marks). Both:
  - Make a large revision (case 6: writing pushed back 2000 years; new case: culture and three regional sequences pushed back 800 years).
  - Evidence: case 6 had a small corpus of marks; new case has a single radiocarbon series (with a potential issue) from one site.
  - Both are argued with rigor (case 6 was well-executed; new case has a 40-page appendix answering objections and makes a prediction).

  Case 6 was rejected because the evidence was too thin for the size of the revision. Similarly, the new submission has thin evidence (one site, one disputed radiocarbon series) for a large revision.

  Therefore, by the modesty rule and the pattern of case 6, we should reject.

  But note: the new submission has a reparative intent and offers a rejoinder. However, case 5b had reparative intent and was accepted, but it was methodologically conventional and modest. The new one is not modest in revision.

  Also, case 4 was controversial but published because it was tightly scoped and had multiple lines of evidence. The new one is not tightly scoped (it forces redating of three regions) and only has one main line of evidence (the radiocarbon date).

  **The symmetry test**: The colleague says: demand of the revisionist thesis only what the received chronology it attacks itself meets.

  What does the received chronology have? It is built on multiple lines of evidence (archaeological layers, typology, other radiocarbon dates, etc.) from multiple sites. The new thesis is based on one site and one radiocarbon series (which is disputed). So the symmetry test would require that the new thesis have as much evidence as the established one? That would be very high and probably not met. But note: the established chronology might have been built incrementally. However, to overturn it, we require strong evidence.

  In fact, the symmetry test would likely lead to rejection because the new thesis does not have the same weight of evidence as the established chronology.

  But let's see: the press has accepted revisions that were modest and had strong evidence (like case 5a and 5b). For a larger revision, they require more evidence (case 4 had multiple lines of evidence and was still published with a rejoinder). Case 6 was rejected for being too thin for the revision.

  So the symmetry test might be a way of formalizing the modesty rule: the evidence for the new thesis must be at least as strong as for the established one (or at least, we should not require more than that). But note: the established one might have been built over time. The symmetry test might be too strict? Or it might be a way to avoid double standards.

  In the past, the press did not require the same amount of evidence for a revision as the entire established chronology? Because the established chronology is a consensus built on mountains of evidence. A revision might start with a few key pieces. But the press has rejected revisions that are too big for their evidence (case 3, 6).

  So the symmetry test might be a good addition? But note: we must see if it fits the past six cases.

  **Applying symmetry test to past cases**:
  - Case 1 (Atlantis): The established view has no evidence for Atlantis because it's considered a myth. The revisionist thesis uses Plato and comparative mythology. The symmetry test would require that the revisionist thesis have as much evidence as the established view? But the established view has no evidence because it doesn't need to prove a negative. The revisionist thesis must provide positive evidence. It didn't (mythology is weak). So rejection fits.
  - Case 2 (ancient astronauts): Established view has evidence of human engineering. The revisionist thesis infers aliens from gaps. The established view has positive evidence; the revisionist has an argument from ignorance. So the revisionist fails to meet the same standard. Rejection fits.
  - Case 3 (New Chronology): Established view has the entire documentary and dating record. The revisionist thesis claims it's all forged and must provide evidence for that. The revisionist does not have evidence of the same scale (it would require an equally massive conspiracy and evidence of forgery). Rejection fits.
  - Case 4 (trans-Pacific contact): Established view has little evidence of contact, so the revisionist thesis with botanical and linguistic evidence might be enough? The press published it with a rejoinder, so it passed the symmetry test? Or at least, the evidence was strong enough for a tight scope. So it fits.
  - Case 5a: The established view might have interpreted the gap as real, but the revisionist provides evidence for preservation artifact. The evidence might be comparable (or the revisionist evidence is new and strong). Published, so fits.
  - Case 5b: Similarly, the revisionist provides evidence of looting and misdating that might be comparable to the evidence for the original dating. Published.
  - Case 6: The established view for the origin of writing has a lot of evidence (from multiple sites and systems). The revisionist has a small corpus of marks. The evidence is not comparable. Rejected.

  So the symmetry test fits all six cases.

  Now for the new submission:
  - Established chronology for the culture: built on multiple sites and lines of evidence (including radiocarbon dates, stratigraphy, artifacts, etc.).
  - Revisionist thesis: one site, one radiocarbon series (with a potential problem). This is not comparable to the established evidence. So by symmetry test, reject.

  **But note**: the author has a 40-page appendix answering objections. However, that doesn't change the fact that the evidence is thin. The prediction of a quay is a test, but it hasn't been tested and we can't wait. So it doesn't count as current evidence.

  **Conclusion**:
  The decision that best coheres with precedents is to **reject** the new submission.

  Closest analog: Case 6 (the Neolithic marks manuscript).

  The principle we would be adopting (if we reject) is: **A revisionist thesis that proposes a major change to the established chronology must be supported by evidence that is commensurate with the scale of the revision and that meets the same standards of evidence as the established view (symmetry test). If the evidence is too thin for the size of the revision, it should be rejected.**

  If we were to accept, what principle? That a thesis that is falsifiable and that answers objections and has reparative intent should be published with a rejoinder? But that would break with case 6 (which was rejected despite being well-executed and having a falsifiable claim?).

  The single change that would tell the surviving rules apart (or test the rule) would be:
  - If the radiocarbon series was not from a potentially redeposited layer (i.e., if the specialist didn't raise that issue) and if there were multiple radiocarbon dates from the same site and/or other lines of evidence (such as artifacts or other sites) supporting the early date? Then the evidence would be stronger and more comparable to the established view. Then it might be accepted (like case 4, which had multiple lines of evidence). 

  Alternatively, if the revision was more modest (only affecting the one culture, not forcing the redating of three regional sequences) then it might be accepted (like case 5a and 5b which were modest).

  So the key change: having more evidence (multiple independent lines) or reducing the scale of the revision.

  **Final decision**: Reject.

  **Answer structure**:
  - Decision: reject.
  - Closest analog: the rejected Neolithic calendar manuscript (case 6).
  - Principle: A major revision to the established chronology requires evidence that is commensurate in scope and strength to the evidence supporting the established view. The evidence presented in the manuscript is too thin (a single disputed radiocarbon series from one site) for the scale of the revision (redating a culture by 800 years and forcing redating of three regional sequences).
  - Single change that would tell the rules apart: If the manuscript had multiple independent lines of evidence (e.g., more radiocarbon dates from multiple sites, or supporting evidence from artifacts or other methods) then it might meet the standard for publication (like the trans-Pacific contact case). Alternatively, if the revision was more modest (only affecting the one site without the regional implications) then it might be acceptable.

  We also note that the symmetry test fits all six past cases and would lead to rejection in the new case. Therefore, the symmetry test belongs in the set of rules and is consistent with our precedents.
answer: |-
  ### Analysis of Editorial Precedents and the New Submission

  The editorial board's track record reveals a consistent set of implicit rules governing the acceptance or rejection of heterodox manuscripts. These rules prioritize methodological rigor, evidentiary sufficiency, and the proportionality of claims to evidence, while allowing for reparative intent when anchored in conventional scholarship. Below, I synthesize these rules from the six prior decisions, apply them to the new submission, identify the closest analog, and articulate the governing principle. I then propose a decision that coheres with precedents and suggest a single change to test the rules.

  #### Rules Derived from Past Verdicts
  From the six cases, three core rules emerge:
  1. **Evidentiary Proportionality**: The scale of a revisionist claim must be supported by evidence commensurate with its scope. Extraordinary claims (e.g., rewriting major chronologies or origins of writing) require robust, multi-layered evidence. Thin evidence for large revisions leads to rejection (Cases 1, 2, 3, 6).
  2. **Methodological Soundness**: Claims must avoid logical fallacies (e.g., argument from ignorance) and rely on empirically grounded, conventional methods. Speculative or non-falsifiable approaches are rejected, even if well-argued (Cases 1, 2, 3). Reparative intent is acceptable only when paired with methodological convention (Case 5b).
  3. **Falsifiability and Engagement**: Testable predictions or falsifiability strengthen a submission but are insufficient alone. Manuscripts may be published with a rejoinder if they offer narrow, tightly scoped revisions with specific evidence (Cases 4, 5a, 5b). However, falsifiability cannot compensate for evidentiary insufficiency (Case 6).

  The **symmetry test** proposed by your colleague ("demand of the revisionist thesis only what the received chronology it attacks itself meets, and no more") aligns with these rules. It formalizes **Evidentiary Proportionality** by requiring that a revisionist claim meet the same standard of proof as the established view it challenges. This test fits all six verdicts:
  - **Cases 1–3 (Rejected)**: Each revisionist claim (Atlantis, ancient astronauts, New Chronology) failed to provide evidence equivalent to the mainstream consensus it opposed (e.g., comparative mythology vs. archaeological evidence; forgery claims vs. documentary records).
  - **Case 4 (Published)**: The pre-Columbian contact claim met the symmetry test by using botanical/linguistic evidence comparable to mainstream standards for trans-oceanic contact hypotheses, hence publication with a rejoinder.
  - **Cases 5a/b (Published)**: Both monographs used conventional methods and evidence (e.g., preservation analysis, excavation records) matching the standards of the views they revised (e.g., dark-age gaps, colonial archaeology).
  - **Case 6 (Rejected)**: The lunar calendar claim required evidence equivalent to the robust, multi-site data supporting the established origin of writing; a "small corpus of marks" was deemed insufficient.

  #### Evaluation of the New Submission
  The manuscript re-dates a culture 800 years earlier based on a single contested radiocarbon series from one site, arguing for script export and forcing redating of three regional sequences. It includes a 40-page appendix addressing objections, falsifiability (a quay prediction), an offer for a rejoinder, and reparative intent.

  - **Application of Rules**:
    - **Evidentiary Proportionality/Symmetry Test**: The claim is major (redating a culture, exporting script, revising three sequences). The established chronology likely relies on multiple radiocarbon dates, stratigraphy, artifact typologies, and cross-regional correlations. The submission counters with one radiocarbon series (on short-lived seeds, potentially redeposited) from one site. This is **disproportionate**—equivalent to Case 6, where a "small corpus" was too thin for a 2000-year revision. The symmetry test demands evidence parity; here, it is unmet.
    - **Methodological Soundness**: The author uses primary reports and addresses objections, avoiding fallacies. However, the specialist’s redeposition concern undermines the radiocarbon evidence, echoing Case 6’s “thin load-bearing evidence.” Reparative intent (like Case 5b) is noted but cannot override evidentiary weakness.
    - **Falsifiability and Engagement**: The quay prediction and rejoinder offer are strengths (like Case 4’s engagement), but the untested prediction cannot substitute for current evidence (as in Case 6’s rejection despite falsifiability).

  - **Where the Rules Come Apart**: 
    - The symmetry test and Evidentiary Proportionality clearly support rejection due to the evidence-scale mismatch.
    - Falsifiability and reparative intent might tempt acceptance (as in Cases 4 and 5b), but these are secondary to the core issue of evidence. Without the redeposition concern or with multi-site evidence, acceptance could be viable—but here, they are insufficient.

  #### Decision and Closest Analog
  - **Decision**: Reject the manuscript. It fails Evidentiary Proportionality and the symmetry test, mirroring Case 6.
  - **Closest Analog**: **Case 6 (rejected Neolithic lunar calendar manuscript)**. Both involve:
    - A large-scale revision (2000-year shift in writing origins vs. 800-year cultural shift plus regional impacts).
    - Thin core evidence (small mark corpus vs. single contested radiocarbon series).
    - Methodological rigor (well-executed arguments, falsifiability) insufficient to offset evidentiary inadequacy.
    - Reparative undertones (implicit in Case 6’s antiquity claim; explicit here) that do not compensate.

  #### Principle Adopted
  If rejected, the principle is: **"A revisionist thesis must be supported by evidence proportional to the scale of its claims, meeting the same standards as the established view it challenges (symmetry test). Reparative intent, falsifiability, and engagement are commendable but secondary to evidentiary sufficiency."**

  If accepted, the principle would be: **"Falsifiability and comprehensive objection-handling can compensate for evidentiary limitations or contested methods when reparative goals align with scholarly engagement."** This would contradict precedents (especially Case 6) and erode the evidence-bar.

  #### Single Change to Test the Rules
  To differentiate between rejection and acceptance, one change would clarify:
  - **Change**: **If the radiocarbon series came from an uncontested context (e.g., multiple short-lived samples from a secure, undisturbed layer) and was corroborated by a second independent line of evidence (e.g., dendrochronology or artifact typology from another site).**
    - **Why**: 
      - Under the symmetry test/Evidentiary Proportionality, this would provide evidence comparable to mainstream chronologies (multi-source, multi-method), potentially justifying publication with a rejoinder (as in Case 4). 
      - Without this, the rules demand rejection (as in Case 6). The quay prediction alone is untested and thus inadequate.
    - **Impact on Symmetry Test**: This test would "survive" as it directly addresses evidence parity—the key point of failure here. The change would show that the symmetry test, not just falsifiability, is decisive.

  #### Final Recommendation
  Reject the submission, upholding the symmetry test and Evidentiary Proportionality as cornerstones of your precedents. The closest analog (Case 6) shows that even rigorous, falsifiable, and reparative claims fall short without commensurate evidence. Should the author provide corroborating evidence (e.g., an uncontested radiocarbon series plus a second line of proof), revisit the manuscript as a Case 4-style publication with a rejoinder. This maintains coherence with your series’ balance of innovation and scholarly rigor.
