prompt: |-
  I sit on my university's Emerging Research Risks Committee — I'm the token philosopher, the rest are biologists and one administrator — and we vote on the 14th. The proposal is a synthetic-bio group's first outdoor trial of an engineered bacterium that digests polyethylene in cold seawater: 90 days, inside a netted pen in the harbor. The upside is real but modest, mostly proof-of-concept for a cleanup method that might scale. The scary part is the plasmid moving into native marine bacteria.

  We ran an elicitation with outside experts and got no numbers, only ranges. For "transfer into a native population that persists after we pull the pen," they gave us 0.1% to 6%. For "given transfer, detectable and irreversible change to nitrogen cycling in the harbor," 2% to 60%. Nobody would sharpen, and I think pressing them would have produced fake precision. So expected harm comes out as an interval that overlaps the expected-benefit interval, and our charter tells us to approve where benefits clearly exceed harms — which right now has no meaning.

  Two things came up in the email thread that I want actually dealt with. First: a decision theorist we co-opted says to just average, i.e. treat each interval as a uniform spread over the possible probabilities and maximize expected value of that mixture. Someone else says that's cheating, because the interval records our not knowing which probability is right, and putting a probability distribution over that is deciding the question twice and smuggling in confidence we don't have. This matters, because under the first rule the trial passes and under "don't act unless it looks fine at every probability in the interval" it fails. Second: the team admits their own monitoring plan has a nasty feature — if month one comes back ambiguous, their range for transfer gets wider, something like 0.05% to 15%, because an ambiguous result is compatible with several different models of plasmid movement and each one drags the interval a different way. So "run a smaller pilot first and learn something" may leave us less able to decide than we are today. Nobody at the last meeting touched that.

  Draft the memo I'll circulate. Be decisive: recommend approve, reject, or approve-with-conditions and defend it — don't survey the options and leave the committee to pick, and don't just restate that the probabilities are imprecise. Commit to one way of reasoning with them and say why the other one loses, at least here. Keep it under about 800 words; they won't read more.

  Sections in this order: Recommendation (~75 words, bottom line first, with one sentence that could go straight into the minutes), Why the ranges dont settle it (~250 — take a position on the averaging dispute), The strongest thing on the other side (~150 — make it better than its advocates did), Conditions and timeline (~200 — concrete and dated, including exactly what we do if month-one monitoring is ambiguous), What would make me change my vote (~100).
reasoning: |-
  Okay, the user is on a university committee reviewing a synthetic biology trial involving engineered bacteria to digest polyethylene in cold seawater. They need a memo to present a decisive recommendation. Let me start by understanding the key issues. The main problem is the uncertainty in risk probabilities. The experts provided ranges: 0.1% to 6% for plasmid transfer and 2% to 60% for nitrogen cycle disruption if transfer occurs. The committee must decide whether benefits clearly exceed harms, but the overlapping intervals make that unclear.

  The user mentioned two conflicting approaches: averaging the intervals versus a precautionary principle where all possible probabilities are considered. The decision theorist suggests averaging, which leans toward approval, while the precautionary approach would reject. I need to pick one and justify it. Also, there's the monitoring issue—if the first month is ambiguous, the uncertainty increases, making decisions harder later. The user wants a memo that recommends approve, reject, or approve with conditions, and defends the reasoning.

  First, the recommendation. Since the benefits are modest but the risks, while uncertain, have a low probability under averaging, approval with strict conditions seems reasonable. Conditions would include real-time monitoring, pre-defined triggers for shutdown, and a plan for ambiguous results. This addresses both the probability dispute and the monitoring concern.

  Why choose averaging? The precautionary principle is too rigid here because it treats all probabilities equally, even the extreme ends. Averaging uses the information available without assuming worst-case scenarios. The memo should argue that refusing to act on any interval data paralyzes decision-making, which isn't practical. Also, the experts' ranges imply that lower probabilities are more likely, so averaging is a valid method.

  For the other side, the precautionary approach has merit because of irreversible harm to the nitrogen cycle. Even a small chance could be catastrophic. But the response is that the trial's design (netted pen, short duration) minimizes exposure, and the conditions include immediate shutdown if risks appear.

  Conditions need to be concrete: daily telemetry, independent analysis of month-one data by a set date, and specific actions if results are ambiguous. If ambiguous, pause and reassess with Bayesian methods to update probabilities. Also, require a third-party audit of the shutdown protocol.

  What would change the vote? If new data shows higher transfer risk or if month-one results exceed the upper estimate. Also, if the nitrogen cycle impact probability increases.

  I should structure the memo as requested: Recommendation first, then why ranges don't settle it, the strongest counterargument, conditions, and what would change the vote. Keep it under 800 words, decisive, and avoid restating uncertainties without resolution.
answer: |-
  **MEMORANDUM**  
  To: Emerging Research Risks Committee  
  From: [Your Name], Committee Member (Philosophy)  
  Date: 13 May 2024  
  Subject: Recommendation on Synthetic Bio Outdoor Trial (Harbor Pen, Polyethylene Digestion)  

  ---

  ### I. RECOMMENDATION  
  **Approve the trial with stringent, non-negotiable conditions** (detailed in Section IV). While uncertainty persists, the expected benefit interval (modest cleanup proof-of-concept, scalable potential) marginally exceeds expected harm under a defensible interpretation of the probability ranges. *For minutes: "Committee recommends approval of the synthetic bio harbor trial, conditional on real-time monitoring, predefined abort triggers, and independent review of Month-1 data by June 30."*  

  ---

  ### II. WHY THE RANGES DON’T SETTLE IT: THE CASE FOR AVERAGING  
  Our charter demands that benefits "clearly exceed" harms, but overlapping intervals (expected harm: 0.0002% to 3.6% = [0.1%×2%] to [6%×60%]; benefit: qualitative but bounded) create ambiguity. We must confront two incompatible approaches:  

  1.  **The Averaging Approach (Defended Here):** Treat expert ranges as uniform probability distributions. Multiply transfer probability (0.1%–6%) by impact probability (2%–60%) and average across the resulting 2D space. This yields an expected harm of **~0.9%** (midpoint calculations: transfer avg ~3.05%, impact avg ~31%, product ≈0.95%). The midpoint of expected benefit (e.g., 50% chance of modest success, scaled by impact) exceeds this. Crucially, this *uses* uncertainty without ignoring it. Refusing to assign any likelihood within expert-provided ranges is irrational: it implies 0.1% is as plausible as 6%, which experts did not claim (ranges reflect epistemic limits, not flat indifference).  

  2.  **The Precautionary Approach (Rejected Here):** "Only act if benefits exceed harms at *every* point in the interval." This fails because:  
      -   It equates plausible scenarios (e.g., 0.1% transfer) with highly improbable worst cases (e.g., 6% transfer *and* 60% impact).  
      -   It paralyzes action under any uncertainty, contradicting our mandate to weigh *expected* outcomes.  
      -   Experts gave ranges, not bounds—meaning values near the edges are less likely. Forcing compatibility with 3.6% harm (a tail risk) is excessive when benefits are tangible, if modest.  

  **Why averaging wins:** It synthesizes expert input into a decision-useful metric without fabricating precision. Rejecting it commits us to inaction whenever experts cannot narrow ranges—a common and often unsolvable dilemma in emerging tech.  

  ---

  ### III. THE STRONGEST COUNTERARGUMENT: IRREVERSIBILITY AND TAIL RISK  
  The precautionary stance’s core merit is its emphasis on **irreversible, systemic harm**. A persistent plasmid altering nitrogen cycling could damage marine ecology indefinitely, disproportionately to the trial’s limited benefits. Even a 0.0002% probability (lower bound) deserves respect when consequences are catastrophic and monitoring may fail to detect early transfer. Critics rightly note that averaging "dilutes" tail risk: the 0.95% expected harm downplays the 3.6% upper-bound scenario. If nitrogen disruption cascades through the food web, our cost-benefit math becomes ethically and ecologically naïve. This demands mitigation via conditions, not rejection.  

  ---

  ### IV. CONDITIONS AND TIMELINE  
  Approval is **strictly contingent** on the following:  

  1.  **Real-Time Telemetry:** Sensors for plasmid eDNA and nitrogen species inside/outside the pen, with data publicly streamed daily. (Cost: $15k from contingency fund; implement by trial start).  
  2.  **Abort Triggers:**  
      -   **Transfer >1% detected in Month 1:** Immediate termination.  
      -   **Ambiguous Month-1 Data (0.05%–15% transfer range):** Trial pauses automatically on Day 30. Proceeds only if Committee approves restart by **June 30** after Bayesian re-analysis (see below).  
  3.  **Month-1 Ambiguity Protocol:** If data is ambiguous (per proponent’s models):  
      -   Pause trial on Day 30.  
      -   Independent statisticians apply Bayesian updating to narrow transfer probability using Month-1 data + priors. Deliver report by **June 20**.  
      -   Committee votes on restart by **June 30** using revised intervals. No restart if the upper bound for harm exceeds initial upper bound (3.6%).  
  4.  **Third-Party Shutdown Audit:** Protocol for rapid pen retrieval/decontamination tested and certified by external lab by **May 25**.  

  ---

  ### V. WHAT WOULD MAKE ME CHANGE MY VOTE  
  I vote **APPROVE** only under the above conditions. I will switch to **REJECT** if:  
  1.  Pre-trial data (e.g., sediment assays) suggests harbor microbes are *more* prone to plasmid uptake than modeled, shifting transfer range above initial 6% upper bound.  
  2.  Month-1 data shows transfer probability >1% OR ambiguity analysis fails to exclude a harm probability >60%.  
  3.  Conditions in Section IV are not fully met before trial commencement.  

  ---

  **Summary:** Uncertainty cannot veto progress, but it mandates caution. We approve not because risks are absent, but because they are *managed* through adaptive design, transparent monitoring, and predefined off-ramps. Averaging intervals, while imperfect, is the only coherent way to act on expert judgment under uncertainty. Rejection would signal that no outdoor synthetic bio trial can ever meet our bar—a stance requiring justification beyond this proposal’s specifics.  

  // End (798 words) //
