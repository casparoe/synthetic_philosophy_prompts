  ### Thought Experiment: The Correlated Trap

  Consider a single-molecule gas in a sealed box at temperature T, divided into two equal chambers (L and R) by a partition. The demon holds a physical memory system—a two-state device (0 or 1)—initially perfectly correlated with the molecule's position: memory = 0 if the molecule is in L, and memory = 1 if it is in R. The joint system starts in one of two equally likely states: (L,0) or (R,1). The demon then reversibly opens a door from the occupied chamber to a third, smaller chamber (the "trap"), allowing the molecule to enter and become confined there. The memory remains unchanged. The molecule is now trapped (state T), and the memory is decorrelated from it. The partition between L and R is then removed, leaving the molecule isolated in the trap, and the memory in its original state. No work is done, no heat is dumped, and all steps are frictionless and reversible.

  ### Entropy Bookkeeping

  **Initial State (before process):**  
  - *Gas states:* L or R (entropy: \( S_{\text{gas}} = k \ln 2 \)).  
  - *Memory states:* 0 or 1 (entropy: \( S_{\text{mem}} = k \ln 2 \)).  
  - *Joint system:* Two equally likely states (L,0) and (R,1) (joint entropy: \( S_{\text{joint}} = k \ln 2 \)).  
  - *Mutual information:* \( I_{\text{gas;mem}} = S_{\text{gas}} + S_{\text{mem}} - S_{\text{joint}} = k \ln 2 + k \ln 2 - k \ln 2 = k \ln 2 \).  

  **Final State (after process):**  
  - *Gas states:* Only T (entropy: \( S_{\text{gas}} = 0 \)).  
  - *Memory states:* 0 or 1 (entropy: \( S_{\text{mem}} = k \ln 2 \)—unchanged).  
  - *Joint system:* Two equally likely states (T,0) and (T,1) (joint entropy: \( S_{\text{joint}} = k \ln 2 \)).  
  - *Mutual information:* \( I_{\text{gas;mem}} = 0 + k \ln 2 - k \ln 2 = 0 \).  

  **Changes:**  
  - \( \Delta S_{\text{gas}} = -k \ln 2 \) (entropy decrease in gas).  
  - \( \Delta S_{\text{mem}} = 0 \) (memory entropy unchanged).  
  - \( \Delta S_{\text{joint}} = 0 \) (total entropy constant).  
  - \( \Delta I_{\text{gas;mem}} = -k \ln 2 \) (mutual information consumed).  

  The gas entropy decreases by \( k \ln 2 \), exactly matched by the loss of mutual information. The total entropy of the closed system (gas + memory) remains constant, with no heat flow or erasure.

  ### Key Feature and Its Removal
  The critical feature is the **pre-existing correlation** (mutual information) between the gas and memory. If this correlation is removed (e.g., memory starts in a fixed state like 0, uncorrelated with the gas), the demon cannot reliably trap the molecule. Half the time, the molecule is in the wrong chamber and remains untrapped, so the gas entropy remains \( k \ln 2 \). The entropy decrease fails, demonstrating that correlation is the resource enabling the process.

  ### Strongest Objection (Erasure Advocate)
  **Objection:** While no erasure occurs *during* the cycle, the memory is left in a mixed state. To run the device again, the memory must be reset to a known state (e.g., 0) to re-establish correlation with a new molecule, costing \( kT \ln 2 \) in work (via Landauer erasure). Thus, the "real" cost is deferred to erasure in future cycles.  

  ### Verdict
  The case **refutes the claim that the cost is *always* paid in erasure** and reveals erasure as a special case of a more general constraint:  
  - **General constraint:** The thermodynamic resource is **mutual information (correlation)**, which must be consumed to reduce entropy.  
  - **How it's paid:** Mutual information can be spent in two ways:  
    1. **Decorrelate and leave memory mixed** (as here, for one-time use; no immediate erasure cost).  
    2. **Erase and reset memory** (for reuse; cost paid via heat dump during erasure).  
  In both cases, the total entropy of the universe increases by at least the mutual information spent, satisfying the second law. The case isolates correlation—not measurement, erasure, or heat flow—as the fundamental resource expended in this cycle.
