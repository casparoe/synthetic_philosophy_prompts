  Breaking down their needs:
  - They need a scenario where (1) hypotheses only differ about unobservable contemporary populations, (2) observers sharing the evidence are equal, (3) SSA shifts odds by 1000x while SIA doesn't, (4) priors are even and non-anthropic, (5) there's an urgent decision, (6) no controversial elements, and (7) the setting is mundane.
  - Crucially, they want to prove SSA can force radical belief revisions from no evidence, flipping the "presumptuous" label.

  The key challenge is avoiding pitfalls like the Doomsday Argument redux. I consider a scenario involving exoplanet colonization: two hypotheses about whether a distant exoplanet was colonized long ago. Priors are 50-50. The reasoner's community is launching a probe to check. 

  For SSA: Treating oneself as a random sample from all observers (Earth + possible exo-colonists) dramatically favors the "no colonization" hypothesis because if colonization happened, Earth's current population would be a tiny fraction of all observers. This makes probe funding seem irrational.

  For SIA: The mere existence of observers doesn't distinguish between hypotheses since observer counts in "shared evidence" groups are equal. The probe remains worth funding based on priors.

  The structural feature making SSA extreme is the asymmetric reference class - only Earth observers share the evidence. If the exo-colonists shared identical evidence, SSA would become conservative too. 

  An SSA defender might argue the reference class should exclude unobservable aliens, but that's an ad hoc restriction on the theory itself, not the case. 

  This strongly supports the user's thesis: SSA's reputation for modesty depends on cherry-picked cases where the unobserved population shares evidence. Here, it forces abandoning empirical investigation based on zero new data. The case withstands objections unless one modifies SSA's core mechanics.
answer: |-
  Consider this scenario: The Astrobiology Advisory Committee convenes to decide whether to approve the costly Centauri Probe, designed to determine if Proxima Centauri b was colonized by an interstellar civilization 500,000 years ago. Humanity knows it arose independently on Earth. Two hypotheses are on the table:  

  **Hypothesis A (No Colonization):** Earth is alone. Proxima b is lifeless. Total observers: 10^11 (Earth's cumulative population).  
  **Hypothesis B (Colonization):** Proxima b was colonized long ago. It now hosts a thriving civilization of 10^15 biologically similar beings. Earth’s civilization arose independently later. Total observers: 10^11 (Earth) + 10^15 (Proxima) ≈ 10^15.  

  The committee has identical evidence *E*: "We are observers on Earth in 2200 CE, with access to our planet’s history up to now." Crucially:  
  - Both hypotheses agree *exactly* on Earth’s past, present population size, and projected future.  
  - They differ *only* on Proxima b’s current status – unobservable until the probe arrives.  
  - No birth ranks, sequence positions, or longevity clues are in *E*.  
  - Number of observers *with E* (i.e., current Earth observers) is identical under both: 10^10.  

  Priors are set at *P(A) = P(B) = 0.5* by non-anthropic standards, given equipoise about ancient interstellar colonization.  

  **SSA’s Verdict (Extravagant):**  
  - Reference class: All observers in cosmically local spacetime (Earth + Proxima if colonized).  
  - Under A, all observers (10^11) have *E*-like evidence (since only Earth exists).  
  - Under B, only 10^10 / 10^15 = 1/100,000 of observers have *E*.  
  - SSA weights hypotheses by the fraction of observers matching *E*. Thus:  
    *P(A|E) / P(B|E) = [P(A) × (Fraction of A-observers with E)] / [P(B) × (Fraction of B-observers with E)]*  
    = [0.5 × 1] / [0.5 × 10^{-5}] = 100,000.  
  **→ Odds for A: 99,999:1.** SSA concludes colonization is virtually impossible. Funding the probe is irrational.  

  **SIA’s Verdict (Modest):**  
  - SIA weights hypotheses by the *number* of observers with *E*.  
  - Observers with *E*: 10^10 under both A and B.  
  - Thus, *P(A|E) / P(B|E) = [P(A) × Number with E in A] / [P(B) × Number with E in B]*  
    = [0.5 × 10^10] / [0.5 × 10^10] = 1.  
  **→ Odds remain 1:1.** SIA leaves priors unchanged. The probe’s expected value justifies funding.  

  **Structural Feature:** The asymmetry in observer counts *without E*. Under B, a vast population (Proxima) lacks *E*, making Earth observers proportionally negligible for SSA. SIA ignores these non-*E* observers.  

  **Sensitivity Check:**  
  - If Proxima observers *also* had *E*, SSA’s fraction would be ~1 under both (since 10^10 Earth + 10^15 Proxima ≈ all have *E*). Odds stay 1:1.  
  - If SSA’s reference class is restricted to Earth observers, both hypotheses have identical observer sets with *E*. Odds stay 1:1.  
  The extreme shift *requires* many unobserved observers lacking *E*.  

  **Objection (SSA Defender):** "The reference class shouldn’t include aliens we’ve never observed! Restrict it to ‘observers in our causal past’ or ‘biologically connected lineages’."  
  **Rebuttal:** This modifies SSA *ad hoc* to avoid the verdict. The core SSA formulation uses "all observers" – and your objection targets the theory’s standard scope, not the case’s logic.  

  **Supports Your Thesis?** Decisively. SSA forces a 100,000-fold odds shift against colonization – an armchair dismissal of an empirical possibility – based *only* on the abstract possibility of unobserved aliens. SIA, by contrast, remains inert. The standard labeling assumes SIA’s "extra observers" imply presumptuousness, but here SSA’s insistence that "we should be typical" mandates a radical, evidence-free conclusion. A defender might argue that SSA’s modesty in *other* cases (e.g., Doomsday) still holds, but your core point stands: SSA’s reputation for caution is context-dependent, and in cases like this, it is SSA that is wildly revisionary. The case holds if one grants that "observers" includes biologically similar aliens – a concession both theories routinely make when discussing extraterrestrial life. No new distinction salvages the standard labeling; the roles reverse cleanly.  

  ---  
  *Convention note: I treated SIA as an addition to SSA’s sampling step. If SIA is a rival (*replacing* the sampling step), it still weights by number of *E*-observers, giving identical modest verdict here. The divergence is robust.*
