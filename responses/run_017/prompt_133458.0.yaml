answer: |-
  ### Thought Experiment: Tenant Improvement Contract  
  **Scenario**: Two tenants, Pat (δ=0% pure rate) and Imp (δ=8% pure rate), lease identical properties for two years from a profit-maximizing landlord. In Year 0, each tenant may invest effort (e.g., renovating) costing **e=25** utility units (disutility), yielding **R=30** utility units (consumption benefit) in Year 1. The landlord observes each tenant’s discount rate and sets Year 1 rent **r₁** to exactly offset the tenant’s discounted surplus from investing, ensuring they accept the lease. Both have linear utility over consumption/disutility and no savings/borrowing.  

  **Landlord’s Rent Calculation**:  
  - Tenant invests only if **-e + δ(R - r₁) ≥ 0** (participation constraint).  
  - Landlord sets **r₁ = R - e/δ** to bind constraint.  
  - For **Pat (δ=1)**: **r₁ᴾ = 30 - 25/1 = 5**.  
  - For **Imp (δ≈0.9259, 8% rate)**: **r₁ᴵ = 30 - 25/0.9259 ≈ 30 - 27 = 3**.  

  **Outcomes**:  
  - **Pat’s utility stream**: Year 0: **-25** (effort), Year 1: **30 - 5 = 25**.  
    - **Undiscounted sum: -25 + 25 = 0**.  
  - **Imp’s utility stream**: Year 0: **-25**, Year 1: **30 - 3 = 27**.  
    - **Undiscounted sum: -25 + 27 = 2**.  
  Imp ends up strictly better off by **2 units** in undiscounted terms—the metric Pat accepts.  

  **Key Feature**: The landlord tailors rent to each tenant’s discount rate. Pat’s patience allows a higher rent (**5 > 3**), as she values future compensation fully. Imp’s impatience forces a lower rent, letting her retain more future benefit. Pat cannot imitate Imp: if Pat tried to demand Imp’s rent (3), the landlord—knowing Pat values Year 1 fully—would reject it (losing profit), as Pat would pay 5.  

  **If Feature Removed**: If rent is fixed (e.g., **r₁=4**), both invest, and undiscounted sums equalize at **-25 + (30-4) = 1**. Impatience no longer confers an edge.  

  **Strongest Objection**: A defender of zero pure time preference would argue the scenario "cheats" by smuggling in *asymmetric bargaining*: the landlord exploits Pat’s patience to extract surplus, but this exploitation relies on an exogenous, profit-maximizing counterparty. In a symmetric negotiation (e.g., between equals) or competitive market, Pat’s patience would let her secure deferred rewards more efficiently, reversing the result. Thus, the edge stems not from time preference itself, but from how a shrewd actor weaponizes it against the patient agent—a context where patience becomes a strategic disadvantage.  

  **Conclusion**: The spec is met honestly. The case shows that in principal-agent settings with tailored contracts, positive time preference can dominate under the undiscounted-sum metric due to counterparty incentives. It does *not* imply impatience is generally optimal, but highlights that zero pure time preference can be costly when others strategically target patience.
