prompt: |-
  I serve on a small working group that is writing the consent chapter of an ethics manual for a clinical research network, and I have fallen into an argument with a colleague that we cannot settle. We agree on the verdict in nearly every case we throw at each other and still come out with different accounts of what consent requires, which makes me think each of us is quietly running a different principle and only noticing when the cases get strange. So I want to start from my own verdicts rather than from a theory. Here they are, as unlabelled as I can make them. (a) I agree to have blood drawn; the person who draws it is a first-week trainee, and I would have asked for someone experienced — my verdict: my consent was fine, but I was wronged anyway. (b) I donate blood because I am told it is going to the local children's hospital; it is in fact sold to a commercial lab. Not valid. (c) I donate blood because I am told there is a desperate shortage and one unit saves three lives; there is no shortage and the unit is discarded. I lean not-valid, without being able to say what does the work. (d) I donate blood because I am told there are free cookies afterwards, and there are none. Valid, and it would be absurd to say otherwise. (e) My partner removes a condom mid-act, or does not disclose a known infection. Not valid. (f) A friend lets me store boxes in her garage; she would have refused outright had she known the boxes held campaign literature for a party she detests. Valid — she has no complaint about what she authorized. (g) A landlord says: sleep with me or I evict you when the lease ends, which he is legally entitled to do. Not valid. (h) An unemployed father takes a hazardous, poverty-wage job because the benefit system leaves him nothing else. Valid, though the situation is unjust. (i) A devout Jehovah's Witness refuses transfusion while lucid and, hours later, delirious from blood loss, says yes. The yes does not count. (j) The case I keep reversing on: a woman with moderate dementia enrolled in a longitudinal study a year ago while fully competent and cheerful about it, and had also written, when competent, that she did not want to be enrolled in anything once she could no longer understand what it was; today she cannot recall the study but smiles and signs. (k) A hospital intake chatbot describes a procedure's side-effect as occasional tingling when the true risk is permanent numbness in one case in twenty; the phrasing was chosen by an administrator to reduce refusal rates; the patient would have signed anyway; the nurse who collected the signature never read the script and the clinician did not know it. I want to say not valid, but I cannot say whose act invalidated it. (l) A care home uses a model trained on a resident's recorded past choices to predict that she would consent to a daily blood-pressure check she now physically resists; the prediction is probably better than her present refusal. I want to say this is not consent at all, and I am not sure why.

  My own tentative principle, which I would like you to test rather than flatter, is this: a yes counts as valid consent just in case (1) the person was competent with respect to the kind of choice at issue at the time of the yes, (2) what they took themselves to be authorizing is, under some reasonable description, what actually happened, (3) no one in the chain of producing the yes used a fact about that person's alternatives that they had no standing to use, and (4) any false belief that moved them was about what they were authorizing, not merely about whether authorizing it was worth their while. Run it against the twelve cases, tell me which of my verdicts it cannot deliver and which clause is doing the failing, and then either repair it or replace it with something that does better, saying explicitly if some verdict of mine has to go and why that is the right place to give. If it matters, I care more about clause (4) than about the rest, because (b) and (c) feel the same to me and (d) does not, and I cannot articulate the difference. Finally, tell me what your preferred account predicts for three cases I have not listed: the chatbot script written by a clinician who had read the evidence and was merely negligent; consent given by someone competent but three days into acute grief; and an opt-out system in which silence is counted as agreement.

  Please lead with a single sentence stating the principle you are defending, then work through the cases and the three predictions, and keep the entire answer under 700 words.
reasoning: |-
  Hmm, the user presents a fascinating ethical puzzle about consent principles in clinical research. They've shared 12 nuanced cases where their intuitive judgments about consent validity don't neatly align with any obvious theoretical framework, and they've proposed their own tentative principle with four clauses. What's particularly interesting is how they emphasize clause (4) - about false beliefs needing to concern the act itself rather than its worthiness - as central to resolving their confusion between cases like (b/c) and (d).

  Looking at their cases, I notice several recurring tension points: deception about core aspects of the act versus peripheral details (b vs d), exploitation of vulnerability without direct coercion (g vs h), and the complex interplay between past and present autonomy (j). Their principle actually holds up surprisingly well across most scenarios, with only a couple of trouble spots worth examining.

  The dementia case (j) is especially thorny - their principle struggles because it focuses exclusively on the present moment ("time of the yes"), but advance directives clearly require temporal continuity of consent. This suggests we might need to explicitly recognize prior competent refusals as constraints. Similarly, the chatbot case (k) reveals how institutional responsibility can invalidate consent even when no individual actor intends deception.

  For their three additional cases: the negligent clinician would likely still invalidate consent under clause (4), acute grief might temporarily impair competence for significant decisions, and opt-out systems would fail clause (3) by exploiting the default option's power. What's elegant here is how these predictions align with their core intuition that consent requires authentic understanding of the act itself, not just strategic agreement to terms.

  The user's clearly done deep ethical reflection - they recognize their judgments in (c) and (l) might need refinement, showing intellectual honesty. I'll maintain their verdicts unless logically unavoidable, as they've carefully calibrated these intuitions. When addressing clause (4), I'll emphasize how beliefs about consequences become part of "what's authorized" when they're presented as inherent features rather than external incentives - this neatly explains why the cookie deception (d) feels trivial while the blood destination lie (b) strikes at consent's core.
answer: |-
  **Defended principle:** Consent is valid only when: (1) competent regarding the choice; (2) what they reasonably understood they authorized actually occurred; (3) no one exploited unjust control over their alternatives; (4) any motivating false beliefs concerned the nature of the act authorized, not merely its worthiness.

  **Testing your principle against your verdicts:**

  *   **(a) Blood draw by trainee:** Your principle **delivers your verdict**. (1) Competent. (2) Authorized blood draw; happened. (3) No standing issue (trainee status isn't an *alternative* you control). (4) False belief (skill) concerns worthiness, not act's nature. Wronged but consent valid.
  *   **(b) Blood sold to commercial lab:** Your principle **delivers your verdict**. (4) False belief (destination) concerns the nature of the act authorized (where/how blood used). Invalid.
  *   **(c) Blood discarded, no shortage:** **Delivers your leaning**. (4) False belief (shortage, lifesaving) concerns the nature/purpose of the act authorized. Invalid.
  *   **(d) No cookies:** **Delivers your verdict**. (4) False belief concerns worthiness (incentive), not the nature of donating blood. Valid.
  *   **(e) Stealthing/undisclosed infection:** **Delivers your verdict**. (2) Did not authorize unprotected sex/risk exposure; nature of act changed. Invalid. (Also (4)).
  *   **(f) Boxes for hated party:** **Delivers your verdict**. (2) Authorized storing boxes; happened. (4) Belief about *contents* concerns worthiness/context, not nature of storing boxes. Valid.
  *   **(g) Landlord threat:** **Delivers your verdict**. (3) Landlord exploits unjust control (power imbalance/housing need) over alternatives (eviction) to extract consent. Invalid.
  *   **(h) Hazardous job:** **Delivers your verdict**. (3) Employer/system doesn't have *direct, unjust standing* to control alternatives (systemic injustice ≠ specific actor's exploitation). Valid consent in an unjust context.
  *   **(i) Delirious transfusion consent:** **Delivers verdict**. (1) Not competent at time of yes. Invalid.
  *   **(j) Dementia, prior refusal:** **Fails your prior directive verdict** using this principle. Principle focuses on *time of yes*: (1) Current competence questionable (moderate dementia, can't recall study). If deemed minimally competent to assent *now* (smiles/signs), (2) she authorizes *this interaction* (signing), which happens. (4) No false belief *at that time*. Clause (1) is the weak spot regarding competence assessment for this specific choice. Principle **cannot deliver** verdict respecting prior refusal without modification. **Repair:** Add clause recognizing explicit prior competent refusal as invalidating later consent *unless* overridden by specific contemporary assent *with* competence to understand the act remains the same. **Verdict must change** or principle modified.
  *   **(k) Chatbot misdescription (intentional):** **Delivers your verdict**. (2) Patient did not authorize a procedure with a risk of permanent numbness (reasonable description violated). (4) False belief concerns the nature of the risk. Invalid. Responsibility lies with the administrator/process.
  *   **(l) Model overriding resistance:** **Delivers your verdict**. Not consent at all. (1) Current physical resistance indicates lack of assent/competence at that moment. (2) She is not authorizing *now*; the model is predicting past preference. Principle correctly invalidates on (1) and arguably (2).

  **Predictions for new cases:**

  1.  **Negligent clinician chatbot script:** (2) & (4) False belief (risk severity) still concerns the nature of the act. **Invalid consent.**
  2.  **Consent during acute grief:** (1) Competence likely impaired for significant choices due to overwhelming emotional state. **Invalid consent** (or requires heightened scrutiny).
  3.  **Opt-out system (silence = agreement):** (3) System exploits its standing to set defaults, controlling alternatives (imposing participation unless action taken). Often **invalid** as meaningful consent, though policy might permit it pragmatically with safeguards. Fails (3) and arguably (1)/(2) due to lack of affirmative authorization.
