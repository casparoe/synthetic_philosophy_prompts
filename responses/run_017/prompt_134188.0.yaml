prompt: |-
  So I've somehow ended up owning the risk register at the small housing association I work for — I'm not a risk person, I do comms — and the board wants, every quarter, a single likelihood × impact score for each risk so they can rank them and decide what to spend money on. I've been reading a bit about imprecise probabilities (upper and lower probabilities, intervals instead of point estimates, that old risk-versus-uncertainty distinction) and its obvious to me that half our entries just aren't single numbers, but I can't turn that into something I can actually run in the half-day I get per quarter, for a lay board who will only ever ask "so is it a 3 or a 4?".

  What I want is a procedure I can reuse. Concretely: how do I decide whether a risk gets a point estimate or a range; how wide is too wide to be useful any more; when is collapsing a range to one number legitimate and when is it just fake precision; how do I rank two ranges that overlap — and I assume that sometimes the honest answer is "these dont rank, and here's what the board should do instead"; and how do I say anything about the register as a whole when most of our risks share the same underlying cause, so adding them up feels like double counting. One more thing I keep hitting: sometimes new evidence makes my range wider rather than narrower, and I want the procedure to have something to say about that rather than treating it as me messing up.

  It has to be honest about which steps are judgment calls dressed up as method, and it has to be defensible by a non-specialist both to the finance director who signs it off and to an external auditor a year later.

  Please run it on three entries and show the working: (a) our main repairs contractor going insolvent in the next 12 months, where we do have some sector base rates; (b) a fine under a new building-safety regime that hasn't actually started enforcing yet, so there's no base rate at all; (c) reputational damage from a social media storm, where our own response changes the probability. And include at least one case where the procedure gives an answer the board is going to hate. British English please, plain language, and as little notation as you can get away with.
reasoning: |-
  Okay, the user is a comms professional who's been tasked with managing a risk register for a small housing association. They're struggling with how to handle risks that can't be boiled down to a single likelihood-impact score. The board wants simple numbers for ranking, but the reality is messier. 

  Hmm, this is such a classic problem - non-risk professionals inheriting risk processes designed for neat spreadsheets, not real-world uncertainty. The user clearly gets the conceptual issues (they've done their homework on imprecise probabilities), but needs something practical they can implement in half a day per quarter. 

  What they're really asking for is: how to be honest about uncertainty without getting bogged down, and how to communicate this to a board that just wants "a 3 or 4". There's also that sneaky requirement to include an unpopular outcome - smart, they're anticipating pushback.

  Breaking this down: First, we need a clear decision flow that distinguishes between measurable risks and true uncertainties. The key is having thresholds for when to use ranges versus points. Then we need rules for handling those ranges - when collapsing is acceptable, how to compare overlapping risks. Crucially, we must address dependency between risks (that double-counting worry) and normalize widening uncertainty as valid new information.

  For the examples: Contractor insolvency is perfect for showing base-rate anchoring. The unenforced regulation fine demonstrates pure uncertainty - here's where we force the board to accept "we don't know". Reputational risk lets us model feedback loops. And intentionally, the building safety fine will give that unpopular "can't rank" outcome. 

  The procedure must wear its subjectivity on its sleeve. Every time we say "assess" or "judge", we're flagging it's informed opinion. For audit trails, we'll require reasoning logs. And crucially, we'll reframe the whole register as a tool to reveal knowledge gaps, not pseudo-science.

  Notation must be minimal - no Greek letters. British English throughout (insolvency, not bankruptcy; programme, not program). And we'll explicitly call out where we're making judgment calls versus following rules. 

  The tone should be pragmatic - this isn't academic perfection, it's about better decisions. Like calling the collapsed scores "rough guides" not gospel. And always circling back to "here's what this means for your budget meeting".
answer: |-
  Here's a practical, defensible procedure designed for your constraints – prioritising honesty, auditability, and minimal time over theoretical perfection. It embraces the core truth: **some risks resist tidy numbers, and forcing them creates false certainty.**

  **Core Principles of the Procedure:**

  1.  **Honesty First:** Clearly state where uncertainty is high. A range *is* a valid answer when justified.
  2.  **Thresholds Rule:** Define clear, pre-agreed rules for when a point *must* become a range, and when a range *can* be collapsed.
  3.  **Comparisons are Fuzzy:** Accept that ranking overlapping ranges is subjective. Focus on grouping risks into clear "priority tiers" instead of strict 1-to-N ranks.
  4.  **Dependency is Key:** Don't just add scores. Explicitly state where risks are linked to avoid double-counting. Aggregate *causes*, not just *risks*.
  5.  **Widening Uncertainty is OK:** New evidence *can* increase uncertainty – document why.
  6.  **Judgment is Explicit:** Flag every step involving judgment. Record the reasoning briefly.
  7.  **Outputs Beyond Scores:** Provide clear "So What?" actions for high-uncertainty risks.

  **The Procedure (Step-by-Step):**

  **1. Define Your Thresholds (Do this ONCE, get FD/Board sign-off):**
      *   **Point -> Range Threshold:** *If you cannot justify a single likelihood/impact number within a +/- 0.5 band (on your 1-5 scale) with reasonable confidence, based on evidence or expert judgment, you MUST use a range.*
      *   **Range Width Threshold:** *If the likelihood range is wider than 2 points (e.g., 1-3, 2-4) OR the impact range is wider than 3 points (e.g., 3-5, 1-4), the risk moves into the "High Uncertainty" category.*
      *   **Collapsing Range -> Point:** *A range can ONLY be collapsed to a point if:*
          *   The range is narrow (likelihood range <=1 point; impact range <=2 points), *AND*
          *   There's a strong, documented reason to pick one end (e.g., "Base rate suggests lower end is far more probable"; "Worst-case impact requires specialist equipment we don't have").
      *   **High Uncertainty Category:** Risks meeting the Range Width Threshold. These *cannot* be ranked numerically against others. They require specific management actions.

  **2. Assess Each Risk (Likelihood & Impact):**
      *   **Gather:** Use existing data, expert opinion (e.g., FD, Operations Manager), sector reports, past incidents. Spend max 15-30 mins per significant risk.
      *   **Judge:** Apply thresholds rigorously.
          *   Can you pick *one* number confidently? **Point.** *(Judgment: Confidence level)*
          *   If not, define the plausible min/max. **Range.** *(Judgment: Min/Max bounds)*
          *   Does the range exceed width thresholds? **Flag as High Uncertainty.** *(Automatic)*
      *   **Document:** 1-2 sentences justifying point/range choice *and any key judgments*. (e.g., "Base rate 5%, but recent sector volatility suggests could be higher. L: 2-3"; "No enforcement precedent, impact depends on regulator interpretation. I: 3-5").
      *   **Widening Range?** If new info *increases* uncertainty (e.g., new regulation published, contractor profit warning), widen the range. Document: "New info: [X]. Previously L:2-3, now wider uncertainty suggests L:1-3."

  **3. Calculate Initial Score (Point or Range):**
      *   `Likelihood x Impact = Score` (or `Score Min = Lmin x Imin`; `Score Max = Lmax x Imax`).
      *   **Collapse?** Check thresholds. Can/should you collapse the range to a point? Only if narrow AND justified. *(Judgment: Collapse reason)*. If collapsed, note it's an "Estimate: X (from range Y-Z)".

  **4. Handle Dependencies & Overall Register:**
      *   **Identify Clusters:** Visually group risks sharing a major cause (e.g., "Dependence on Contractor X", "New Building Safety Regime", "Social Media Vulnerability").
      *   **Cluster Scores DON'T Add:** State clearly: "Risks #A, #B, #C are primarily driven by [Common Cause]. Their *combined* maximum plausible impact is approximately [Highest single I score + 1 or 2?], not the sum of individual scores. Mitigating [Common Cause] addresses all."
      *   **Overall Risk Picture:** Report:
          *   Number/List of High Uncertainty risks.
          *   Key dependency clusters.
          *   Top 3-5 highest *point* scores / narrowest range mid-points (as rough guide).
          *   "The greatest potential losses stem from [Common Cause 1] and [Common Cause 2]."

  **5. Rank/Group Risks:**
      *   **Tier 1 - High Priority:** Point Scores >= 12 (e.g., 4x3, 5x3) OR Narrow Range Mid-Points >= 12.
      *   **Tier 2 - Medium Priority:** Point Scores 6-11 OR Narrow Range Mid-Points 6-11.
      *   **Tier 3 - Low Priority:** Point Scores <=5 OR Narrow Range Mid-Points <=5.
      *   **Tier HU - High Uncertainty:** Risks flagged under step 1. *DO NOT RANK NUMERICALLY.* List them separately.
      *   **Overlapping Ranges:** If two risks have *overlapping* score ranges but don't fall neatly into the same tier:
          *   State: "Risk A (Score 8-14) and Risk B (Score 10-15) have overlapping potential. Both are Tier 2 (Medium), but Risk B has a higher potential maximum."
          *   Use judgment to nudge one tier up *if* the *worst-case* is significantly higher. *(Judgment: Relative worst-case severity)*. Document the reason.

  **6. Define Actions:**
      *   **For High Uncertainty Risks:** Mandatory actions: "Requires specific research/scenario planning by [Role/Dept] by [Date]" or "Board decision needed on risk appetite/tolerance for this uncertainty".
      *   **For Dependency Clusters:** "Mitigation focus: Address root cause [Common Cause]".
      *   **Standard Risks:** Existing mitigation plans.

  **7. Report to Board:**
      *   **Simple Table:** Risk Name | Likelihood (Point or Range) | Impact (Point or Range) | **Score (Point or Range)** | **Tier** | Key Dependency/Notes.
      *   **Clear Summary:**
          *   "Top Immediate Concerns (Tier 1): [List]"
          *   "Key Uncertainties Requiring Attention (Tier HU): [List] - We *cannot* reliably rank these numerically. Actions proposed: [Actions]."
          *   "Major Risk Drivers: The main sources of potential loss are [Common Cause 1] and [Common Cause 2], affecting multiple risks."
          *   "Changes: Since last quarter, [Key changes, esp. widening uncertainties]."

  ---

  **Running the Examples (Applying the Procedure):**

  **Assumptions:** Scale 1-5 (Likelihood: 1=Rare, 5=Almost Certain; Impact: 1=Negligible, 5=Catastrophic). Thresholds as defined above.

  **(a) Main Repairs Contractor Insolvency (Next 12 Months)**
  *   **Likelihood:** Sector base rate = ~3% (Likelihood 2). BUT news of financial strain in contractor's group (+ your judgment). *Confidence in single point?* Low - volatility suggests it could be higher. **Range L: 2-3** (Min: Base rate ~2, Max: Signs of stress suggest plausible up to 3). *Width (1) < Threshold (2). OK.*
  *   **Impact:** Would cause major repairs delays, cost overruns finding alternatives, potential tenant issues. Significant but manageable. *Confidence in single point?* Medium-High. **Point I: 4** (Major).
  *   **Score:** `Lmin x Imin = 2x4 = 8`; `Lmax x Imax = 3x4 = 12`. **Range: 8-12**.
  *   **Collapse Range?** Range width = 4 (12-8). Impact range width = 0 (point). Likelihood range width=1 (<2 threshold). *Can* consider collapse. *Should we?* Mid-point is 10. Justification: Base rate anchors us lower, but stress signs are real. Judgment call: **Collapse to L:2.5 (Estimate) -> Score: 10**. *(Judgment: Signs of stress are concerning but not acute; base rate still relevant. Estimate leans slightly conservative).* Alternatively, keep range – here we collapse.
  *   **Dependencies:** Likely a root cause for other risks (delays, tenant complaints). Note cluster.
  *   **Tier:** Score 10 -> **Tier 2 (Medium Priority)**. *(Note: If range kept 8-12, Mid-Point=10 -> Still Tier 2)*.
  *   **Audit Note:** "L: Sector base rate ~3% (L2) but contractor group financial stress reported. Plausible L up to 3. Used range L:2-3, collapsed to estimate L:2.5 (Score:10) due to narrow likelihood range and lack of immediate crisis signs. I:4 based on operational disruption assessment."

  **(b) Fine under New Building Safety Regime (No enforcement yet)**
  *   **Likelihood:** No base rate. Regulator hasn't fined *anyone* yet. Will they enforce? How strictly? *Confidence in single point?* Zero. **Range L: 1-4** (Could be rare if light touch, could be frequent if aggressive. Genuine unknown).
  *   **Impact:** Fines could be large per incident. Potential for multiple findings. *Confidence in single point?* Low. Depends on violation severity/regulator mood. **Range I: 3-5** (Significant to Catastrophic financially).
  *   **Score:** `Min = 1x3 = 3`; `Max = 4x5 = 20`. **Range: 3-20**.
  *   **Collapse Range?** L Range Width=3 (>2 threshold). I Range Width=2 (<=3 threshold). **Hits High Uncertainty Threshold (L Width >2). DO NOT COLLAPSE. Flag as Tier HU.**
  *   **Tier:** **High Uncertainty (Tier HU)**. Cannot rank numerically.
  *   **Action Required:** "High Uncertainty: Requires urgent scenario planning with Legal/Compliance: What triggers a fine? What are typical fine levels elsewhere? Can we influence the regime? Report back by [Next Board]."
  *   **Board Hates This:** They want a number to compare. Tough. You say: "We have *no data* and the rules aren't clear. Giving you a single number like '3' or '4' would be pure guesswork and misleading. We've flagged it as High Uncertainty because it needs specific investigation before we can reliably assess it. Your decision here is about funding that investigation and deciding our risk appetite for unknown regulatory threats."
  *   **Audit Note:** "New regime, zero enforcement history. L: Impossible to estimate reliably (1-4). I: Potential fines significant but scale unknown (3-5). Range 3-20. L range width=3 > threshold (2) -> High Uncertainty. Requires specific research."

  **(c) Reputational Damage from Social Media Storm (Response changes probability)**
  *   **Likelihood:** *Without* effective response: High chance of escalation (L4). *With* good response: Can be contained (L2). Response effectiveness is key & uncertain. *Confidence in single point?* Low - depends entirely on our actions. **Range L: 2-4** (Min: If we respond well; Max: If we respond poorly/don't respond).
  *   **Impact:** Can be significant (tenant trust, regulator attention, media scrutiny). *Confidence in single point?* Medium. Severity depends somewhat on response, but baseline is high. **Point I: 4** (Major).
  *   **Score:** `Min = 2x4 = 8`; `Max = 4x4 = 16`. **Range: 8-16**.
  *   **Collapse Range?** L Range Width=2 (== threshold). I Range Width=0. *Can* consider collapse. *Should we?* Collapsing hides the critical factor: *Our response controls the likelihood*. **DO NOT COLLAPSE.** The range *is* the valuable insight. *(Judgment: The dependency on our action is the key risk characteristic).*
  *   **Tier:** Range 8-16. Mid-point=12. **Tier 1 (High Priority)**. Note: Wide range highlights action dependency.
  *   **Action:** "High Tier 1 risk. Critical Mitigation: Ensure robust social media monitoring & crisis response protocol is in place, tested, and team trained. Score range (8-16) reflects that likelihood is primarily within our control via response quality."
  *   **Audit Note:** "L: Highly dependent on speed/quality of our response. Estimated L:2 (good response) to L:4 (poor/no response). I:4 based on potential damage to reputation/stakeholder trust. Range kept (8-16) to emphasise control via response plan."

  ---

  **Defending the Procedure:**

  *   **To Finance Director:** "It's efficient (uses thresholds/judgment), honest (flags uncertainty), auditable (documents reasoning), and focused on decisions (actions for HU risks, clusters). It stops us pretending we know things we don't, which is a bigger risk."
  *   **To Auditor:** "We have a documented, consistent procedure approved by the Board. It clearly defines when subjectivity is applied (judgment flags) and requires justification. It avoids artificial precision and highlights knowledge gaps (High Uncertainty tier). The audit trail shows the rationale for each score/range."
  *   **To Board:** "This gives you the clearest possible view of what we know, what we don't, and where the biggest *potential* problems lie. The 'High Uncertainty' category tells you where a number wouldn't be trustworthy and where you need to make decisions based on appetite or fund further research. The clusters show you where spending money on one root cause tackles multiple risks."

  **Key Outputs the Board Actually Needs:**

  1.  **The 2-3 things most likely to cause serious damage *right now* (Tier 1 points/narrow ranges).**
  2.  **The big question marks where we're flying blind and need to decide: investigate more or accept the unknown risk? (Tier HU).**
  3.  **Where to get the most bang for their buck: tackling root causes (Clusters).**

  This procedure delivers that honestly, within your time constraints, and provides a robust audit trail. It embraces the messiness of real-world risk.
