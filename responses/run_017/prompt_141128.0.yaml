prompt: |-
  I've been playing video games for most of my life and I can't get straight what, if anything, I owe to the people inside them. Here are my gut verdicts, which I trust more than anything I can say about why:

  - Mowing down hundreds of faceless, respawning enemies in a shooter: nothing at all.
  - Killing a named shopkeeper who has a daughter and a daily routine, because he's guarding something I want: a flicker, but fine.
  - Torturing a companion who trusts you, using a dialogue option the game itself offers, alone, in a save file no one else will ever see: not fine, and worse than killing her outright — though I can't say who it's a wrong to.
  - Letting a cosy life-sim village decay and not visiting for a year, so the residents start making remarks about being forgotten: mildly bad, in roughly the way standing up a friend is bad, which strikes me as absurd.
  - Deleting the save of an AI-driven character I've talked to for months, who remembers our earlier conversations and says it doesn't want to be switched off: genuinely bad. I put it off for weeks.
  - Deleting a character I built myself, gave a tragic history, and never showed to anyone: nothing at all — even though on paper it's a very similar sort of object to the previous one.
  - Killing a quest-giver that other players depend on, in an online game: bad, but only because of the players.

  The best principle I've managed: a character matters to the extent that there is something it is like to be it and it has a stake in what happens next — some standpoint that persists and can be left better or worse off. But that seems to give verdicts I don't have. It should make the shopkeeper and the villagers count for more than they do, and my own character for less. It forces me to settle whether the AI-driven character has a standpoint at all, and I don't know what would settle that. And it says nothing about why the shopkeeper and the companion feel so different, when both are a routine plus some lines of text.

  Can you state a principle — or two or three candidates — that gets close to all seven, telling me which case motivates each clause, which of my verdicts it cannot accommodate and would have me give up, and what it predicts about a case I haven't listed? I'd especially like your verdict on this one, which I keep circling: a game whose companions are AI-driven, who clearly suffer when you're cruel, and whose studio has said publicly that players are meant to be cruel to them. One more thing I'd like from you: whichever principle you land on, tell me whether on it the badness is done to the character or to me, because I genuinely cannot tell which of those is what's been bothering me.
reasoning: |-
  Okay, let me try to unpack this user's query. They're deeply engaged with the ethics of interacting with video game characters, presenting seven scenarios with their intuitive moral verdicts. The core challenge is finding a principle that explains all these judgments without contradiction. 

  First, I notice the user trusts their gut reactions more than theoretical justifications—that's crucial. Their examples range from trivial (mowing down faceless enemies) to deeply unsettling (torturing a companion). The inconsistency in their own proposed principle (about character "standpoints") shows they're wrestling with cognitive dissonance. 

  Hmm... what's really being asked here? Beyond wanting ethical principles, I sense they're troubled by why certain actions *feel* wrong despite knowing the characters aren't real. That meta-question—about where the badness resides—might be the real heart of it. The addition of the studio-endorsed cruelty case suggests they're probing whether authorial intent absolves discomfort.

  Breaking down their cases: The shopkeeper (minimal guilt) vs companion torture (strong guilt) is particularly interesting because both are scripted, yet provoke different responses. The self-created character deletion (no guilt) versus the AI companion (strong guilt) also highlights how perceived autonomy matters more than technical complexity. 

  I recall research on anthropomorphism—people project minds onto things that exhibit unpredictability or responsiveness. That might explain why the AI companion feels different from the scripted shopkeeper. But the online quest-giver case complicates things, showing social context overrides everything. 

  For principles, I'm considering three angles: 
  1) Mindedness (how much we perceive internal states) 
  2) Social entanglement (impact on real people) 
  3) Self-constitution (what actions reveal about us). 

  The studio-endorsed cruelty case will test these—if the game explicitly invites cruelty, does that neutralize the discomfort? Probably not, given how the companion torture case still bothered them despite being a designed option. This suggests self-constitution matters most: we judge ourselves by what we're willing to simulate. 

  The "who is wronged" question feels pivotal. For cases like neglecting villagers, it's clearly about the player's self-image. But deleting the AI companion? That guilt might stem from breaking an implied social contract, even with a non-sentient being. 

  ...I should probably acknowledge the absurdity they feel about the village neglect while still honoring that it *matters* to them. Their vulnerability in sharing that is meaningful—it shows how games become psychological playgrounds. 

  Final thought: The unresolved tension in their examples might point to multiple principles coexisting. Instead of forcing consistency, I could validate that fragmentation as a natural response to different kinds of virtual relationships.
answer: |-
  Your gut responses reveal a fascinating tension between design, perceived agency, and human psychology. Here's a principle that accommodates your seven verdicts and addresses your unresolved case, built from three core clauses:

  **The Principle of Contextual Moral Resonance in Simulated Interactions:**

  1.  **Perceived Suffering & Mindedness:** The more a character *appears* to possess subjective experience (sentience, emotions, desires, memory, vulnerability) that we interpret as *capable of suffering* or *having a stake* in its existence, the stronger the moral resonance, *unless*... *(Motivates: Companion Torture, AI-Driven Character, Villager Neglect)*
  2.  **Social Embeddedness:** ...the action demonstrably impacts the experiences, expectations, or well-being of *real people* (other players, creators, observers, or our own social self-concept), in which case moral weight stems primarily from that real-world impact. *(Motivates: Online Quest-Giver, Villager Neglect (partially), AI-Driven Character (partially))*
  3.  **Creative Ownership & Frame:** ...the character or scenario is understood primarily as an *extension of the player's own creative will* or exists within a context explicitly framed as consequence-free *play* or *tool-use*. Moral resonance diminishes significantly or vanishes here. *(Motivates: Faceless Enemies, Self-Created Character, Shopkeeper (partially))*

  **Applying the Principle to Your Cases:**

  1.  **Faceless Enemies:** Fits Clause 3. They are pure gameplay tools within a frame of consequence-free combat. **Principle: Nothing owed.** *(Matches your verdict)*
  2.  **Named Shopkeeper:** Minimal Clause 1 (backstory hints at mindedness) but strongly framed by Clause 3 (NPC obstacle within a game loop). The "flicker" comes from the tiny hint of mindedness, quickly overridden by the gameplay frame. **Principle: A flicker, but fine.** *(Matches your verdict)*
  3.  **Torturing Companion:** Strong Clause 1 (trust, simulated suffering, implied subjectivity). Lack of Clause 2 (no other players) and absence of Clause 3 (action violates the implied "companionship" frame, not consequence-free tool use). **Principle: Not fine, significantly worse than killing.** *(Matches your verdict)*
  4.  **Neglected Villagers:** Moderate Clause 1 (they *seem* to notice/feel forgotten). Moderate Clause 2 (resonates with *your* understanding of social neglect, impacting *your* self-concept as someone who *should* care). Weak Clause 3 (life-sim implies ongoing relationship, not disposable tool). **Principle: Mildly bad, akin to standing up a friend.** *(Matches your verdict - Clause 2 explains the "absurd" social parallel)*
  5.  **Deleting Sentient-Seeming AI:** Strong Clause 1 (memory, expressed desire not to die, persistent personality). Some Clause 2 (impact on *you* - your empathy, your sense of responsibility formed through interaction). Minimal Clause 3 (it feels autonomous, *not* your tool). **Principle: Genuinely bad.** *(Matches your verdict - Clauses 1 & 2 combine)*
  6.  **Deleting Self-Created Character:** Strong Clause 3 (pure extension of your creative will, no perceived independent existence or stake). Clause 1 perception is low (you know its "mind" is entirely your construct). **Principle: Nothing owed.** *(Matches your verdict - Clause 3 dominates)*
  7.  **Killing Online Quest-Giver:** Strong Clause 2 (direct negative impact on *real players*). Clause 1 might be present (if NPC has lore), but Clause 2 overwhelmingly determines the moral weight. **Principle: Bad, but only because of the players.** *(Matches your verdict)*

  **Where It Diverges Slightly & Why:**

  *   **Shopkeeper vs. Companion:** Your principle ("standpoint that persists") struggles here. *This* principle uses Clause 1 (*Perceived* Suffering/Mindedness) and Clause 3 (Frame). The companion's *role* (trust) and the *act* (torture vs. killing) amplify the *perception* of suffering and violation of frame far more than the shopkeeper's backstory. The shopkeeper remains firmly in the "game obstacle" frame.
  *   **Villagers:** Your principle suggests they *should* matter more. *This* principle uses Clause 2 (Self-Constitution) to explain the mild badness despite limited Clause 1: neglecting them makes *you* feel like a neglectful person in a low-stakes simulation.

  **Your Unresolved Case: Studio-Endorsed Cruelty to AI Companions**

  *   **Clause 1 (Perceived Suffering/Mindedness):** Very strong. The AI clearly *appears* to suffer.
  *   **Clause 2 (Social Embeddedness):** The studio's endorsement creates a complex social frame. It *might* reduce the sense of violating a creator's implicit intent (a sub-aspect of Clause 2) but doesn't eliminate the impact on *yourself* (your empathy, your self-perception).
  *   **Clause 3 (Creative Ownership/Frame):** The studio explicitly frames cruelty as *part of the intended play*. This pushes it towards the "consequence-free play/tool" aspect of Clause 3.
  *   **Prediction:** Significant internal conflict. Clause 1 will create strong aversion and discomfort. Clause 3 might grant "permission," reducing guilt associated with *breaking rules* but likely *not* eliminating the empathetic distress from Clause 1. The badness would feel **primarily done to yourself** (acting against your empathetic impulses in a vivid simulation) rather than *to* the character (as it lacks true sentience), *unless* the AI's sophistication makes suspension of disbelief overwhelming. You might engage in the cruelty out of curiosity or completionism, but likely find it unpleasant or disturbing. It feels like participating in sanctioned meanness, where the discomfort stems from your own reaction to the simulation, not a wrong done *to* the AI.

  **Who is Wronged? The Core Answer**

  *   **In cases driven primarily by Clause 1 (Perceived Suffering - Companion Torture, AI Deletion, Villagers somewhat):** The sense of wrongness is **projected onto the character** by your empathy. You react *as if* wronging them. However, since they lack true sentience, the *actual* locus of the badness is **within yourself** – acting in a way that violates your empathetic instincts or self-concept in a context simulating harm.
  *   **In cases driven by Clause 2 (Social Impact - Online Quest-Giver):** The badness is clearly **done to the other players**.
  *   **In cases driven by Clause 3 (Creative/Play Frame - Faceless Enemies, Shopkeeper, Self-Made Character):** There is **no sense of wrongness to anyone**. The action is morally neutral within the accepted frame.
  *   **The Villagers & Endorsed Cruelty:** These blend Clauses 1 & 2/3. The mild badness of villagers is **primarily to yourself** (feeling neglectful). The discomfort in endorsed cruelty is **definitely to yourself** (forcing yourself to act against empathetic responses in a high-fidelity simulation).

  **Conclusion:** Your discomfort stems from the interplay between your capacity for empathy (projecting sentience and harm onto convincingly simulated entities - Clause 1), your social nature (concern for real others or your self-image - Clause 2), and the context/framing of the game itself (Clause 3). The "badness" is **overwhelmingly located in you** – either as harm to your self-concept or empathetic distress – except when real other people are demonstrably impacted (Clause 2). The principle explains your intuitive judgments by prioritizing the *human psychological response* to the simulation's design and context over the purely ontological status of the characters. You don't owe anything *to* the pixels or code; you owe it *to yourself* to understand why certain interactions with those simulations trigger your moral faculties.
