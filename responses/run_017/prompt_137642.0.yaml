prompt: |-
  I teach a fourth-year seminar on prediction and its failures, and I'm writing the final exam. The last unit was on Malthus, and I need one essay question — answerable in about 45 minutes, worth 25 marks — that a student cannot clear by reciting the familiar sequence: population grows geometrically, subsistence only arithmetically, and then the green revolution, Boserupian induced innovation, and the demographic transition arrive to explain why it never happened.

  What I want tested is whether students can adjudicate the three moves by which a long-run prediction gets rescued once its apparent deadline has passed: re-dating (the mechanism stands, only the timing was off), re-scaling (the unit or the window was wrong — not England but the planet, not one century but several), and re-describing the variables (not mouths but consumption-weighted demand, not grain but whatever resource happens to bind). In lectures I set these against a deadline test I sketched rather than borrowed from anyone: a claim advertised as predictive about the long run retains content only if it commits to some date, threshold, or observable difference that could in principle be missed, so that some finite run of prosperity would refute it.

  Please write the question, a model answer of roughly 600 words, and a marking scheme out of 25 built around five must-hit moves, with the marks for each and a line on how otherwise strong candidates typically botch it. The question should put a concrete hypothetical in front of them — a twentieth-century Malthusian who reformulates the original claim so that no finite run of prosperity can count against it — and ask whether that reformulation is a degenerating research programme, an unfalsifiable tautology, or a genuine constraint that behaves more like an accounting identity or a budget constraint than a forecast. An A answer should state what would have to be specified for 'right but early' to be more than a face-saving formula; an answer that merely sorts the three moves into Popperian or Lakatosian boxes should be capped at a B.
reasoning: |-
  Okay, the user teaches a fourth-year seminar on prediction failures and needs a final exam essay question about Malthus. They want to avoid students just regurgitating the standard rebuttal (geometric vs. arithmetic growth + Green Revolution/Boserup/demographic transition). Instead, they want students to analyze how long-run predictions get "rescued" after failing—specifically through re-dating, re-scaling, and re-describing variables. 

  Hmm, the user is clearly sophisticated—they're using terms like "degenerating research programme" (Lakatos) and "unfalsifiable tautology" (Popper). They want students to engage with the epistemology of predictions, not just facts. The deadline test they mentioned (a prediction must have a falsifiable timeframe/threshold) is crucial here. 

  The tricky part is designing a question that forces analysis of these "rescue moves" without being answerable by textbook tropes. A hypothetical 20th-century Malthusian reformulation seems perfect—it makes the abstraction concrete. But I need to ensure the hypothetical can't be dismissed with "but Boserup solved it." 

  For the model answer, I'll need to: 
  - Show how re-dating/re-scaling/re-describing make the theory unfalsifiable 
  - Contrast "empirical constraint" vs. "tautology" 
  - Explain what would make "right but early" meaningful (i.e., specifying testable thresholds) 
  - Avoid Lakatos/Popper jargon overload since the user wants analysis beyond labeling 

  The marking scheme should penalize: 
  - Reciting the standard Malthusian rebuttal (automatic B cap) 
  - Vague handwaving about "complexity" 
  - Missing the deadline test requirement 

  Strong answers must: 
  1) Identify all three rescue moves in the hypothetical 
  2) Explain why they undermine falsifiability 
  3) Contrast with testable formulations 
  4) Use the deadline test explicitly 
  5) Link to the "accounting identity" vs. "prediction" distinction 

  ...And all in 45 minutes! Better make the question crystal clear. The "model answer" will need tight pacing—about 100 words per key point.
answer: |-
  ### Exam Question  
  **Section C: Malthusian Logic and Predictive Integrity (25 marks)**  
  *A 20th-century Malthusian, Dr. Thorn, reformulates Malthus’s principle to address 20th-century prosperity: “Human demand for ecological resources grows inherently faster than biophysical regeneration. Affluence merely delays crisis by accelerating resource substitution and intensifying depletion. Collapse is inevitable when aggregate consumption exhausts a critical planetary boundary (e.g., phosphorous, freshwater, or climate stability), regardless of temporary innovations.” Thorn insists this revised principle remains empirically vital, though it rejects fixed timelines or local failures as counterevidence.*  

  **Evaluate Thorn’s reformulation:** Is it (a) a **degenerating research programme** (protecting a core theory via ever-more-complicated adjustments), (b) an **unfalsifiable tautology** (true by definition but untestable), or (c) a **genuine constraint** (like a budget equation), revealing real trade-offs? Support your analysis using Thorn’s three key moves: **re-dating** (timing is flexible), **re-scaling** (shifting analysis to global/planetary units), and **re-describing variables** (subsistence → “critical planetary boundaries”).  

  *Crucially, explain what Thorn must specify for their claim to be “right but early” rather than unfalsifiable. Answers merely classifying moves as “Popperian” or “Lakatosian” without engaging predictive content will not receive full credit.*  

  ---

  ### Model Answer (Approx. 600 words)  
  Thorn’s reformulation transforms Malthus’s predictive claim into an unfalsifiable tautology (option b) by systematically evading empirical accountability through re-dating, re-scaling, and re-describing variables. While it gestures toward a material constraint, its refusal to define testable failure conditions strips it of predictive power, rendering it a circular justification for inevitable collapse.  

  **Re-dating** eliminates temporal accountability. Malthus originally tied crisis to observable demographic/agricultural trends, allowing refutation by sustained growth (e.g., Britain’s 19th-century industrialization). Thorn discards deadlines, arguing collapse occurs “when aggregate consumption” crosses a threshold—without specifying *when* this occurs or what finite prosperity would falsify it. This allows perpetual deferral: any non-collapse becomes “temporary delay,” making the claim immune to timing-based refutation.  

  **Re-scaling** shifts the unit of analysis from local/societal (e.g., England 1798) to planetary systems. While global ecology matters, this move exploits scale to deflect counterexamples. For instance, regional escapes from Malthusian traps (e.g., post-Green Revolution India) are dismissed as irrelevant because Thorn’s principle operates only at the planetary level. Yet without defining *which* global thresholds are binding or how their breach manifests observably (e.g., measurable famine vs. abstract “collapse”), the theory retreats from concrete testing.  

  **Re-describing variables** replaces concrete terms (grain, population) with malleable constructs (“critical planetary boundaries,” “aggregate consumption”). Malthus’s “subsistence” was measurable via grain yields/prices; Thorn’s “boundaries” are ex-post designations. If climate stability fails as a boundary, advocates can substitute soil degradation or phosphorous depletion without revising the core claim. This re-description severs the theory from measurable variables, allowing any ecological stress to retroactively validate it.  

  Thorn’s model resembles a budget constraint only superficially. A genuine constraint (e.g., “coal reserves will deplete in 50 years at current use”) specifies *testable parameters*: the resource stock, extraction rates, and depletion signals. Thorn offers no analogous criteria. Without defining:  
  1. **Quantifiable thresholds**: What constitutes “exhaustion”? (e.g., ppm CO₂, years of phosphorous reserves left),  
  2. **Observable failure signatures**: How would collapse materially differ from temporary scarcity? (e.g., global GDP contraction >20%, not regional droughts),  
  3. **Bounded substitutions**: Which innovations “count” as delays versus permanent solutions? (e.g., lab-grown meat invalidates land constraints?),  
  “right but early” becomes a face-saving formula, not an empirical claim.  

  The reformulation is tautological because it reduces to: “Collapse occurs when unsustainable consumption becomes unsustainable.” Its rescue moves dissolve falsifiability—the hallmark of a degenerating programme—but without producing novel, testable predictions (Lakatos’s criterion for progressive science). While material constraints exist (e.g., climate physics), Thorn’s framing obscures them by refusing to engage measurable reality. To regain predictive content, Thorn must specify *finite prosperity tests*: e.g., “Global food prices will rise 300% within 30 years if renewable water use exceeds X% of recharge.” Only then does “early” imply a measurable deadline rather than infinite deferral.  

  ---

  ### Marking Scheme (25 Total)  
  **Aim for five must-hit analytical moves**:  

  1. **Diagnose evasion of falsifiability** via Thorn’s three moves (6 marks)  
     - *Re-dating (2)*: Explains how flexible timing voids deadlines.  
     - *Re-scaling (2)*: Shows planetary shift deflects local counterexamples.  
     - *Re-describing (2)*: Notes variables are retroactively redefined to fit events.  
     *Common botch: Lists moves without linking to unfalsifiability.*  

  2. **Contrast tautology vs. genuine constraint** (5 marks)  
     - Distinguishes circular logic (“collapse when unsustainable”) from testable constraints (e.g., budget equations with measurable parameters).  
     *Common botch: Equates planetary boundaries with falsifiable claims without addressing testability.*  

  3. **Apply “deadline test”** (6 marks)  
     - States that “right but early” requires specifying a *missable* threshold/timeline (e.g., “Collapse occurs if resource use exceeds Y by 2050”).  
     - Identifies that Thorn’s version lacks bounded prosperity that could refute it.  
     *Common botch: Praises flexibility as “scientific adaptation” without critiquing empirical evasion.*  

  4. **Articulate conditions for predictive content** (5 marks)  
     - Specifies 2–3 concrete requirements (e.g., quantifiable thresholds, observable failure signals, bounded substitutions).  
     *Common botch: Vague calls for “better data” without structural fixes.*  

  5. **Synthesis and judgement** (3 marks)  
     - Clear verdict (e.g., unfalsifiable tautology) and insight beyond Popper/Lakatos labels (e.g., “masquerades as physics, functions as prophecy”).  

  **Grading Boundaries**:  
  - **A (21–25)**: Hits all five moves, specifies deadline-test requirements.  
  - **B (16–20)**: Identifies moves but vague on falsifiability; or fixates on Lakatos/Popper without deadline test.  
  - **C (11–15)**: Superficial analysis; confuses Thorn with original Malthus or recites Green Revolution rebuttal.  
  - **D/F (0–10)**: Ignores question, describes Malthus/Boserup without engagement.  

  *Note: Answers reciting “geometric vs. arithmetic + Green Revolution solves it” capped at 14 (C+).*
