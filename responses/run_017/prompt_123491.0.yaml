answer: |-
  Here's the breakdown you requested, dissecting the phenomenon you've observed in the Blackwick jug tradition:

  **1. What already exists (~200 words):**

  *   **Essentialism vs. Nominalism:** This philosophical debate asks whether categories (like "Blackwick") have a single, defining, unchanging essence (e.g., workshop origin) or are merely convenient labels based on observable properties (e.g., shape). Your case shows elements of both: insiders act like essentialists (the *real* essence is origin), while external codification relies on nominalism (defining by observable traits). Putnam's "Division of Linguistic Labor" fits here: experts (insiders) know the hidden essence (origin), while the public uses a stereotype (shape).
  *   **Institutional Facts (Searle):** These are realities created by collective agreement or authority (e.g., money, borders, artistic movements). The insiders' "inherited list" functions as an internal institution defining authenticity, separate from observable properties. The conflict arises when external institutions (museums, fairs) impose a different, observable-based definition.
  *   **Tacit Knowledge (Polanyi):** The insiders' judgment, learned through handling and immersion ("nobody wrote a rule down"), is a form of tacit knowledge – understood and applied but difficult to articulate fully. This contrasts sharply with the codified rules based on explicit, observable features.

  **2. Why each one misses (~250 words):**

  *   **Essentialism/Nominalism/Linguistic Labor:** While capturing the expert/layperson split and the essence/shape tension, they miss the *dynamic conflict and historical revisionism*. Putnam assumes the experts are "right" about the essence. In your case, the insiders' "essence" (origin) *is* the defining criterion *for them*, but crucially, **it cannot be verified independently by anyone outside the tradition once the object is separated from its provenance.** When external bodies codify the shape, they aren't just simplifying; they *actively overwrite history*, reclassifying authentic originals as "atypical" because they clash with the new, codified "essence" (the shape). The linguistic labor model doesn't account for this institutional power to redefine the category *against* the expert community's criteria.
  *   **Institutional Facts:** This gets closer, recognizing the power of social agreement. The insiders have their institution (the list/experience). The museums/fairs are competing institutions. Searle's model explains *that* different institutions create different facts, but it doesn't fully capture the **asymmetric power and the erasure of the original institution's criteria**. The external codification doesn't just offer an alternative definition; it suppresses the original one and rewrites the historical evidence ("in five years people remember them that way"). The internal institution lacks the formal power to resist this.
  *   **Tacit Knowledge:** This perfectly describes *how* the insiders know, but it doesn't address the **external conflict and codification problem**. Polanyi explains the nature of their expertise, not the societal mechanism by which a different, explicit definition supersedes and distorts the historical record tied to that tacit knowledge. The problem isn't *just* that the tacit knowledge is hard to codify; it's that attempts to codify *replace* it with something fundamentally different and then retroactively apply that new code to the past.

  **3. The name and the definition (~150 words):**

  *   **Name:** **Contextual Authentication vs. Codified Definition Conflict (leading to Historical Revisionism)**
  *   **Definition:** This is the phenomenon where the authentic membership within a culturally significant category is determined not by fixed, observable properties, but by context (specifically, origin/provenance within a defined tradition, known through tacit knowledge and an inherited corpus of exemplars). This contextual authentication comes into irreconcilable conflict with attempts by external institutions to define the category solely through codified, observable characteristics (due to necessity or ignorance). The codified definition, possessing institutional authority and verifiability, inevitably supersedes the contextual one. Crucially, this leads not just to misclassification of new objects, but to the *retroactive reclassification and marginalization ("early," "provincial," "atypical") of historically authentic exemplars that don't conform to the new codified standard*, thereby eroding the original contextual basis of the category.

  **4. Cases and non-cases (~200 words):**

  *   **Case (Different Domain - Wine):** **Burgundy Wine Appellation.** Authenticity is strictly defined by geographic origin (specific vineyards) and production rules, not *just* taste profile or grape variety (Pinot Noir/Chardonnay). A wine made from the same grapes, in the same style, but from a vineyard 100m outside the boundary is *not* Burgundy, regardless of taste similarity. Critics might praise a "Burgundian-style" wine from elsewhere, but they cannot label it "Burgundy." Conversely, a wine *from* Burgundy that tastes "off" in a particular vintage is still Burgundy. If a powerful external body (e.g., a major retailer or critic group) decided to define "Burgundy" purely by taste profile and grape, they would mislabel non-Burgundy wines as such and force authentic Burgundies that deviated from that profile (due to vintage variation or terroir expression) to be labeled as inferior or atypical, rewriting the understanding of what constitutes the region's character.
  *   **Non-Case 1 (Similar but Different - Borderline Issues):** Classifying a specific shade as "red" or "orange." This involves prototype/family resemblance and borderline cases – the core problem is ambiguity at the edges, not a conflict between origin and observable properties as defining criteria. There's no "inherited list" of canonical reds overriding the perception of a borderline color.
  *   **Non-Case 2 (Similar but Different - Evolving Standard):** The definition of "planet" changing to exclude Pluto. This was a deliberate scientific redefinition based on new understanding and the need for a clear, observable criterion (clearing its orbit). It caused controversy, but it wasn't a conflict between an origin-based authenticating context and a codified observable property; Pluto's origin wasn't the prior authenticating factor. The reclassification didn't retroactively label past observations of Pluto as "atypical planets"; it redefined the category itself.
