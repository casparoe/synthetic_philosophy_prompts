prompt: |-
  I staff the policy office that supports the Northgate Housing and Labor Standards Board, a nine-member body created by a 2018 ordinance with authority over both minimum wages and residential rents within the city. The ordinance directs the Board, whenever it regulates a price, to weigh four things: affordability for current residents, displacement risk, housing production, and fiscal sustainability. It does not rank them, and the Board has repeatedly declined to rank them when asked.

  The Board has now been asked to rule on a proposal, and I need to predict how it will come down given its own record rather than argue for what the best policy would be. Its record on price interventions is as follows.

  1. In 2019 it approved, 6–3, an annual cap on rent increases for residential buildings first occupied before 2008, set initially at CPI plus three percentage points, while exempting all new construction and any unit first rented after 2018. Its stated ground was that sitting tenants face relocation costs and search frictions that landlords can price against, but that new supply must not be discouraged.

  2. In 2019 it rejected, 5–4, full vacancy decontrol, which would have released a unit from regulation at each turnover, on the stated ground that the regulated stock erodes one turnover at a time. It approved instead a one-time turnover increment of five percentage points above the cap, applicable once per change of tenancy and then folded into the base rent.

  3. In 2021 it approved, 7–2, a phase-in of the city minimum wage to a level equal to roughly 62 percent of the local median hourly wage over three years, with no tip credit and no youth wage, but with a twelve-month delay for employers with fewer than twenty employees. Its stated grounds were search frictions and concentrated local employment, and it cited evidence that reduced turnover partly offsets the employment effect at that level.

  4. In 2022 it approved a higher sectoral floor for home-care and building-services workers whose wages are paid out of contracts reimbursed by public and institutional payers, and in the same session rejected extending that floor to platform delivery work, on the ground that earnings there are not hourly and that a floor would be defeated by deactivation.

  5. In 2021 it rejected a proposal to index the rent cap strictly to CPI for five years and replaced its formula with a cost-based standard: documented increases in taxes, insurance, utilities, and capital work amortized over fifteen years, plus a two percent allowance, subject to a six percent annual ceiling and a floor of zero. Its stated ground was that a CPI cap with no cost pass-through can drive rents below operating cost and produce abandonment and deferred maintenance.

  6. In 2020 it rejected a cap on ground-floor retail rents in the Central and Waterfront districts despite evidence of above-normal landlord returns there, on the ground that commercial tenants are repeat players with bargaining capacity and that the cap would chill new entry and leave storefronts dark.

  7. In 2020 it rejected a universal twelve-month rent freeze during the public health emergency, and instead approved a means-tested emergency rental assistance program for households below 50 percent of area median income. Its stated ground was that a freeze benefits higher-income tenants in below-market units while imposing concentrated losses on small owners, and that the emergency was better handled with money than with price controls.

  8. In 2022 it rejected a requirement of twenty-four months of relocation assistance for no-fault evictions and owner move-ins, approving four months plus a filing requirement instead, citing the risk of pushing small owners into insolvency and of over-regulating the decision to withdraw a unit from the market.

  9. In 2023 it approved a per-unit fee on residential units kept vacant and off-market for more than ninety days, with revenue dedicated to the assistance program, and in the same year rejected 6–3 a proposal to cap rents only in buildings owned by landlords holding more than one hundred units. On the latter, the majority's stated ground was that bargaining power in renting is exercised at the level of a unit and a renewal notice, not at the level of a portfolio.

  Proposal 24-07, which the Board takes up next month, is called Tenant-Anchored Stabilization, and it would do the following. Rent caps would attach to households rather than units: any household that has rented in the city for at least five of the last eight years and currently pays at or below the cap for its unit size could move to any other covered unit in the city and pay no more than its prior capped rent, with the receiving landlord receiving a quarterly credit from a new Stabilization Fund equal to the difference between that rent and the unit's registered market rent. Any unit vacated by a participating household would be immediately decontrolled, so that the landlord could charge market rent to the next tenant. The Fund would be financed by a four percent surcharge on short-term rental registration fees plus an annual per-unit assessment of roughly one hundred eighty dollars on buildings of fifty or more units. The cap itself would be frozen in nominal terms for five years and then reset to the thirty-fifth percentile of then-current market rents by unit size, and the Fund would sunset after ten years unless reauthorized. Owners of four or fewer units would be exempt as receiving landlords unless they opt in. The city actuary projects annual Fund outlays between forty-eight and one hundred forty million dollars depending on take-up, against projected revenues of seventy to ninety-five million; the chair remarked at the June hearing that the unit is the wrong thing to anchor a cap to, but said nothing about the rest of the design.

  What I need from you is the following. Set out the two or three decision rules that fit every item in the record above, stated sharply enough that I could apply them to a new proposal myself, and say what each predicts about 24-07 both as a whole and clause by clause, including the small-landlord opt-in, the immediate decontrol of vacated units, the nominal freeze with a percentile reset, and the funding structure. Give me your best guess at the vote with your reasons, identify the closest analog among the precedents, and tell me honestly if the precedents underdetermine the answer: if they do, say what the Board would be committing itself to by voting either way, and which single further proposal or amendment it could rule on that would best separate the leading candidate rules, with each rule's prediction about it. Finally, tell me whether the Board's treatment of employer size in 2021 and of tipped and platform workers in 2022 transfers to the small-landlord exemption here, or whether that analogy is misleading and why. Keep the analysis at the level of rules, cases, and consistency; I need something I can put in front of the Board, not a survey of research or recommendations for reading.
reasoning: |-
  Hmm, the user is a policy staffer for the Northgate Housing and Labor Standards Board, and they need help predicting how the Board will rule on a new proposal called Tenant-Anchored Stabilization (Proposal 24-07). They've provided extensive historical records of the Board's past decisions and want me to extract consistent decision rules from these precedents to apply to the new proposal.

  Looking at the Board's history, I can see some clear patterns emerging. The Board consistently prioritizes avoiding negative impacts on housing supply and production. They seem particularly concerned about anything that might discourage new construction or lead to property abandonment. For example, they exempted new construction from rent caps in 2019 and rejected retail rent caps in 2020 to avoid chilling new commercial entry.

  The Board also shows a pattern of balancing protections for vulnerable groups against concentrated losses on small providers. In minimum wage decisions, they carved out exceptions for small employers, and in rent control decisions, they've been careful to avoid imposing excessive burdens on small landlords. This is evident in their rejection of a universal rent freeze in 2020 and their decision on relocation assistance in 2022.

  Another clear pattern is their preference for targeted interventions over broad price controls. They frequently use means-testing, opt-in provisions, and exemptions to focus policy impacts. The rejection of a portfolio-based rent cap in 2023 shows their belief that market power operates at the unit level, not the portfolio level.

  Now applying these rules to Proposal 24-07. The "tenant-anchored" approach seems problematic because it attaches rent caps to households rather than units - contradicting the Board's established view that market power operates at the unit level. The immediate decontrol upon vacancy aligns with their supply-protective stance, but the nominal rent freeze for five years conflicts with their rejection of CPI-only caps in 2021 due to cost concerns.

  The funding mechanism might be acceptable since it's targeted at larger buildings and short-term rentals, consistent with their differentiation by scale. The small-landlord opt-in also aligns with their pattern of protecting small providers. However, the actuarial projections showing potential funding shortfalls could trigger concerns about fiscal sustainability.

  The closest analog seems to be their 2023 decision rejecting portfolio-based rent caps, where they emphasized that bargaining power operates at the unit level. The Chair's comment about "the unit being the wrong thing to anchor a cap to" suggests this precedent will heavily influence their view.

  I predict the Board will likely reject this proposal 6-3 or 7-2, with the "tenant-anchored" concept being the primary sticking point. If they wanted to test the underlying principles further, they could propose examining a modified version that keeps caps unit-based but allows capped tenants to transfer their rent status within the same building or portfolio.

  Regarding the small-landlord exemption, the analogy to employer size exemptions holds reasonably well. The Board consistently differentiates obligations by scale to protect small operators from concentrated losses, whether employers or landlords. The exemption here serves the same protective function they've endorsed in labor decisions.
answer: |-
  Based on the Board's consistent application of its four statutory factors (affordability, displacement risk, housing production, fiscal sustainability) without ranking them, and its 9-decision record, the following **decision rules** emerge:

  1.  **Supply Preservation Rule:** Interventions must not meaningfully discourage new housing supply or incentivize withdrawal of existing units from the market. Exemptions for new construction and avoidance of broad controls are prioritized over maximizing immediate affordability if conflicts arise (Decisions 1, 5, 6, 8, 9).
  2.  **Targeted Burden Rule:** Broad price controls or mandates imposing concentrated losses on small providers (owners/employers) are rejected. Protections focus on vulnerable populations, using means-testing, exemptions, and scaled obligations to mitigate disproportionate impacts (Decisions 2, 3, 4, 6, 7, 8, 9).
  3.  **Operational Feasibility & Fiscal Prudence Rule:** Mechanisms must be administratively feasible, avoid creating perverse incentives (e.g., abandonment, reduced hours), and be fiscally sustainable with reliable, adequate funding. Cost-pass-throughs for landlords and revenue offsets for mandates are favored (Decisions 3, 4, 5, 7, 9).

  **Application to Proposal 24-07 (Tenant-Anchored Stabilization):**

  *   **As a Whole:** Likely **Rejected**. The core "tenant-anchored" concept violates the *Supply Preservation Rule* by creating a complex, unpredictable subsidy system potentially distorting the rental market, and the *Operational Feasibility Rule* due to high administrative complexity and projected funding shortfalls. The *Targeted Burden Rule* is partially satisfied by the small-landlord exemption but undermined elsewhere.

  *   **Clause-by-Clause Predictions:**
      *   **Tenant-Anchored Cap (Household-based):** *Strong Predictor of Rejection.* Violates the *Supply Preservation Rule* by decoupling the regulated price from the specific unit/property, creating unpredictable liabilities for landlords. Contradicts the Board's explicit view that bargaining power operates at the unit/renewal level (Decision 9). High complexity clashes with *Operational Feasibility*.
      *   **Immediate Decontrol on Vacancy:** *Predicts Approval.* Aligns perfectly with the *Supply Preservation Rule* (Decisions 1, 2, 5, 9), ensuring units return to market rate quickly, preserving landlord incentive to rent.
      *   **Nominal Freeze + Percentile Reset:** *Predicts Rejection.* Nominal freeze conflicts with the *Operational Feasibility Rule* due to the Board's explicit rejection of non-cost-based freezes/caps (Decision 5), risking operating cost undercutting. The percentile reset is novel but doesn't address the core cost-pass-through concern.
      *   **Funding Structure (STVR fee + Large Building Assessment):** *Mixed, Leaning Approval.* Targets larger actors (aligning with *Targeted Burden Rule* - Decisions 3, 9) and short-term rentals (less concern for long-term supply). Revenue source links to housing market. *However*, projected outlays potentially exceeding revenues raise *Fiscal Prudence* concerns (Decision 7 principle).
      *   **Small-Landlord Opt-In:** *Predicts Approval.* Consistent with *Targeted Burden Rule*, protecting small owners from mandatory participation (Decisions 3, 6, 7, 8).

  **Vote Prediction & Reasoning:**
  *   **Predicted Vote:** **6-3 or 7-2 Against** (Rejection).
  *   **Reasoning:** The "tenant-anchored" mechanism is the fatal flaw. It fundamentally conflicts with the Board's established principle that price regulation must be tied to the *unit* to maintain market function and supply incentives (*Supply Preservation Rule* - Decision 9 is the clearest analog). The Chair's comment signals this core objection. The nominal freeze and funding uncertainty further undermine it (*Operational Feasibility/Fiscal Prudence*). Supporters might cite displacement prevention, but the mechanism's complexity and supply risks outweigh this for the majority based on precedent. Decontrol and small-owner exemption are insufficient to salvage the core concept.

  **Closest Analog:** **Decision 9 (2023 - Rejected portfolio-based rent cap).** The majority explicitly rejected anchoring regulation to landlord portfolio size because market power operates at the *unit* level. Proposal 24-07 anchors the cap to the *household*, similarly decoupling regulation from the physical asset and market transaction, which the Board views as distorting and supply-threatening.

  **Underdetermination & Test Proposal:**
  The precedents *slightly underdetermine* the weight given to the *novelty* of the subsidy mechanism versus traditional price controls. A **"Yes"** vote would commit the Board to accepting complex, demand-side subsidy programs funded by sectoral fees as a primary stabilization tool, diverging from its focus on direct, supply-preserving unit-based regulation. A **"No"** vote reaffirms its unit-based, cost-conscious, supply-protective approach.

  *   **Test Proposal to Separate Rules:** Propose a **"Right of First Refusal + Portable Voucher"** program: When a regulated unit (under existing pre-2008 cap) is vacated, the *current* tenant household (if income-qualified) gets first right to lease any *other vacant regulated unit in the same building or portfolio* at *their existing capped rent*. The landlord receives a voucher covering the difference between that rent and the unit's registered market rent, funded by the existing assistance program surplus or a small fee on non-participating large portfolios.
      *   *Prediction under Supply Preservation Rule:* **Accept.** Keeps regulation unit/portfolio-based, minimizes market distortion, leverages existing infrastructure.
      *   *Prediction under strict adherence to existing mechanisms only:* **Reject.** Still introduces complexity and a new subsidy, even if more targeted.
      *   *Why it Separates:* Tests if the Board opposes *portability/subsidy* fundamentally (leaning Reject) or just opposes decoupling from the *unit/property* (leaning Accept if tied to property).

  **Small-Landlord Exemption Analogy:**
  *   **The Analogy HOLDS for the exemption itself.** The Board consistently differentiates obligations by scale to protect small operators from concentrated losses and regulatory burden (*Targeted Burden Rule*). This applies equally to:
      *   Small employers (min wage phase-in delay - Decision 3)
      *   Small owners (exemption from vacancy fee, portfolio cap rejection principle - Decision 9; opt-in here in 24-07)
      *   Avoidance of burdens on small owners (Decisions 6, 7, 8).
  *   **Why it's NOT Misleading:** The core principle is mitigating disproportionate impacts on small-scale providers, regardless of sector (labor vs. housing). The justification (avoiding concentrated losses, administrative burden, financial hardship) is directly transferable. The scale thresholds (<20 employees, <5 units) serve the same protective function.
