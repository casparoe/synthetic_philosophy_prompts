  ### Decision Tree: Is DNA a Code?  
  *Starting point: DNA base sequence reliably determines amino acid sequence (central dogma).*  
  *Nodes use cases to force distinctions; leaves include the view's "ugliest commitment." Empty cells marked with diagnoses.*  

  #### Tree Structure  
  1. **Case: Test tube.** A DNA strand sits in a test tube (no ribosomes, no cell). Does it encode a protein?  
     - **Yes** (strand alone encodes) → Go to 2.  
     - **No** (requires cellular context) → Go to 5.  

  2. **Case: Recoded organism.** An engineered bacterium uses a reassigned stop codon (e.g., UAG → pyrrolysine). A normal cell would "misread" this. Does this show the code depends on the decoder?  
     - **No** (strand's code is fixed; recoded cell is "wrong") → Go to 3.  
     - **Yes** (code is strand-plus-decoder; no "misreading") → **Leaf A: Relational Code.**  
       - *View:* Codehood requires strand + specific decoder (e.g., ribosomes, tRNA).  
       - *Ugly commitment:* A strand without its decoder is code-free (e.g., test tube DNA is inert).  
       - *(Collapses into Leaf E? No—Leaf E requires actual reading; Leaf A does not.)*  

  3. **Arbitrariness.** Is the codon → amino acid mapping arbitrary (not chemically forced)? (e.g., multiple codons for serine, or mitochondrial code variations.)  
     - **No** (mapping is chemically necessary) → **Leaf B: Deflationary View.**  
       - *View:* Not a code; just chemistry (like crystal growth).  
       - *Ugly commitment:* Must deny observed arbitrariness (e.g., alternative codes in nature).  
     - **Yes** (mapping is arbitrary) → Go to 4.  

  4. **Error.** Must a code admit possible errors? (e.g., mutation/translation creating a mismatch between sequence and product.)  
     - **No** → **Leaf C: Infallible Specification.**  
       - *View:* DNA is a code, but errors are irrelevant (e.g., "mutations are features, not bugs").  
       - *Ugly commitment:* No distinction between "correct" and "incorrect" translation (e.g., cancer drivers aren't "mistakes").  
     - **Yes** → **Leaf D: Teleosemantic Code.**  
       - *View:* DNA is a code because selection history assigns functions (e.g., "stop codon" functions to terminate).  
       - *Ugly commitment:* Vestigial DNA has no function (e.g., pseudogenes are "gibberish").  
       - *(Flags: Teleosemantics (D) and Interpreter-Requiring (E) agree on cases but split on function source. Tree separates them via Q7.)*  

  5. **Case: Methylation/prion.** Heritable methylation marks or prions affect traits without changing DNA sequence. Are these codes?  
     - **Yes** (non-sequence carriers can be codes) → *Empty cell.*  
       - *Diagnosis:* Incoherent—non-arbitrary (methylation is direct chemical effect) and no decoder-dependence (prions self-template).  
     - **No** (contrast case; e.g., tree rings or hormone levels aren't codes) → Go to 6.  

