  ### Breakdown of JSON Strategy
  - **concede_up_front**: Start by granting the empirical underspecification (neural implementation). This buys goodwill with scientists by showing humility and frames your talk as a hypothesis to test, not dogma.  
  - **must_land**: Objection #1 (GWT comparison). If you don’t clearly differentiate your "local availability" from GWT’s "global broadcast," the empirical crowd will dismiss you as reinventing the wheel.  
  - **hope_nobody_asks**: Dreams (#2) is indeed the worst—I expanded your self-assessment with specifics. If pressed, emphasize the *richness* of dream content to dodge the memory-theory bullet.  
  - **rehearsal_order**: Practice replies in this sequence: start with high-likelihood, high-damage empirical objections (#1, #2, #3, #9), then philosophical (#4, #8), then lower-stakes (#5–7). This mirrors the talk’s flow: defend novelty, then dreams, then mechanics.  
  - **sounds_helpful_but_lethal**: The "lucid dreams" question (not in the table as it’s niche but dangerous). It sounds supportive but forces you to admit lucid dreams *do* involve real-time meta-states, contradicting your claim that dreams aren’t conscious during sleep. If asked, say: *"In lucid dreams, a partial meta-state may occur, but it’s unstable and not action-guiding (you rarely 'act' in dreams). Full endorsement still happens on waking."* Concede it’s a wrinkle.  

  ### Final Tips
  - **Dreams are your Achilles' heel**: Prep a crisp 90-second reply for #2, but steer Q&A away from it if possible. If cornered, pivot to "this explains why dreams feel fragmentary—endorsement is patchy."  
  - **Empirical > Philosophical**: The scientists will dominate Q&A. Focus replies on testable predictions (no-report paradigms, neural correlates) to keep them engaged.  
  - **Piggybacking is your strength**: Use it to bat away "coldness" objections—emphasize it’s not "inner observation" but feedback within perception.  
  - **Bluntness delivered**: Your retrospective endorsement move is fragile, and the disjunctivist will hate your framing. But the table gives you survival tools.  

