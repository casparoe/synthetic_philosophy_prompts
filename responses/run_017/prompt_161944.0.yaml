answer: |-
  Your archive is sharp, I'll grant that—but it doesn't cut incommensurability. Let me dissect why. First, the metric *isn't* neutral: "failure load" as measured by the plumb frame is **lexically parasitic** on the old paradigm. The device was designed to measure *Cordil load*, a point scalar. Ostvik theorists don't reject the numbers, but they reinterpret them as emergent integrals of flux—a derivative, not a primitive. When the archive says "Vault 12 failed at 300 stone-weights," Cordil reads this as confirmation of its scalar field overflowing a material boundary; Ostvik reads it as a critical flux integral across a stress topology. The *number* is shared, but its **ontological reference** shifted. You have commensurability of numerals, not of concepts.  

  Second, the victory isn't decisive for paradigm choice. You note Ostvik was initially less simple, required auxiliaries, and faltered on crown settlement. Why did the field adopt it? Not *just* the archive (which Cordil defenders might dismiss as "saving the phenomena" with uglier math). The shift came when Ostvik's flux-based taxonomy **reorganized practice**: it explained why "singing vaults" in lime *always* preceded shear cascades, while in gypsum they signaled torsion—enabling targeted reinforcements. Cordil couldn't parse this; its material taxonomy blinded it to structural mechanisms. The archive validated accuracy, but **values**—fruitfulness, scope, coherence with mechanics—drove conversion. Truth-closeness? Ostvik is *more accurate* on this task, but "truth" here is tethered to a task defined by the old paradigm. If tholometry's *aims* shifted (e.g., toward predicting dynamic fatigue), the metric might not decide.  

  To concede your horn, I'd need:  
  1. **Truly theory-neutral metrics**: Not percentages of a contested quantity, but raw observations—e.g., "vault collapsed at plumb-frame reading X," absent *any* load theory.  
  2. **Exhaustive problem-solving**: The archive containing cases Cordil *couldn't* even describe (like pre-failure rattle-back dynamics), where Ostvik succeeds not just quantitatively but **categorically**.  

  You built a strong case, but lexical incommensurability bends; it doesn't break. The world constrains—yes, Ostvik fits the data better—but values mediate the fit.
