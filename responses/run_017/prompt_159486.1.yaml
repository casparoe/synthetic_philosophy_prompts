prompt: |-
  I'm taking an upper-level course on the sources for Jesus and early Christianity, and I've realized I'm much more confused about the method the field actually uses than about any of its conclusions, so I want to ask about the method as a practice. As it's been taught to us, historians reconstruct what Jesus of Nazareth said and did by running individual sayings and stories through a short list of tests. A tradition is treated as probably authentic if it is dissimilar — if it fits neither the concerns of first-century Judaism nor the concerns of the church that preserved it; if it is embarrassing, in the sense that the church would not have invented material that made it look bad or created problems for it; if it is multiply attested across strands of tradition thought to be independent; or if it coheres with a core already secured by the other tests. There are minor variants too — traces of Aramaic phrasing, Palestinian geography, details that fit the setting. Two features of how the tests get used strike me as strange. First, failure to meet them is normally reported as unproven or unverifiable rather than as inauthentic, so the tests seem to license only positive verdicts. Second, the whole procedure is applied unit by unit, to a pericope or a logion, even though what everyone actually wants at the end is a figure who explains how the movement started.

  The worry I can't shake is that dissimilarity, taken seriously, defines the historical Jesus negatively, as the residue left once everything Jewish and everything Christian has been subtracted — which would make him a figure at home in no context at all. Our professor, who is skeptical of the whole approach, raised two further ideas in seminar that I keep turning over. One is what he called the criterion of costly retention: privilege traditions the churches kept even at some cost to themselves, material they evidently had to explain away, soften, or argue about, on the thought that communities do not pay the costs of transmitting what they find useless. The other is a control-corpus test: run the existing criteria on material where we independently have good reason to expect them to fail — traditions about John the Baptist, or episodes the sources themselves frame as retrospective — and see whether the criteria discriminate or simply hand back whatever they are fed. I don't especially need to know whether these two ideas are good; I want to know what adopting them would commit someone to.

  So here is what I'd like. Reconstruct the implicit epistemology of the standard practice: what it must assume about the sources, about how bias in a tradition can be detected and corrected for, about what authenticity is a property of, and about what a historical claim has to be like to be established by inference from interested testimony. Distinguish what the practice strictly presupposes from what it merely sits comfortably with, and say where it is genuinely underdetermined, so that several different theories of the sources would license the same procedure. Tell me whether the tests are mutually consistent — whether dissimilarity and coherence really pull together, and whether the newer plausibility approach, on which a tradition must be at home in first-century Galilee and also help explain what the movement became, is a refinement of the same practice or a quiet replacement of it. Then say what would change if the costly-retention and control-corpus tests were added, and what historians would lose the ability to claim if the criteria were abandoned for an approach that treats the whole remembered portrait, rather than the individual saying, as the unit of assessment. Please don't spend space on citations or a reading list; I can supply those. Do say how confident you are in the reconstruction you give, and single out the specific move in it you are least sure of, since I want to know which parts are your reading of the practice and which parts are contested.
reasoning: |-
  Okay, this user is deep into an upper-level course on Jesus and early Christianity sources, and they're grappling with methodological confusion. They understand the standard criteria (dissimilarity, embarrassment, multiple attestation, coherence) but have two main concerns: the criteria only allow positive verdicts (failure means "unproven" not "inauthentic"), and the unit-by-unit approach feels disconnected from the goal of reconstructing a coherent historical figure. 

  Their professor introduced two provocative ideas—costly retention and control-corpus testing—and while the user isn't asking for an evaluation of those ideas, they want to understand what adopting them would imply methodologically. More importantly, they want a dissection of the implicit epistemology behind the standard criteria: what assumptions about sources, bias, and historical inference are baked into the practice? 

  The user is clearly sophisticated—they spot the "negative residue" problem with dissimilarity and sense the tension between coherence and dissimilarity. Their real itch is epistemological: How can we trust inferences from biased sources? What even counts as "authenticity" if we're just sifting fragments? And they're wary of the method's unspoken premises. 

  Hmm. The challenge is to reconstruct the method's hidden foundations without getting bogged down in citations. Start with its core assumptions: that traditions are discrete units, that bias leaves detectable traces (embarrassment, dissimilar motifs), and that independence of sources can be established. Note where it's flexible (e.g., multiple attestation doesn't require specific source theories) and where it's brittle (dissimilarity assumes we can perfectly map "Jewish" and "early Christian" concerns). 

  The coherence-vs.-dissimilarity tension is critical—they pull opposite directions unless "coherence" is narrowly defined as fitting the dissimilar core. The plausibility shift (Wright/Dunn) is arguably a replacement, not a refinement, since it demands positive contextual fit. 

  Then, the professor's additions: Costly retention assumes communities only preserve problematic material if forced to—a stronger claim than embarrassment. Control-corpus testing is a meta-criterion that could validate or destabilize the whole system. Both would make the method more conservative (fewer "authentic" units) but more rigorous. 

  Finally, shifting to a "portrait" unit would sacrifice granularity for narrative coherence—we'd gain a contextualized Jesus but lose the ability to isolate "reliable" fragments. The trade-off is precision for holism. 

  Least confident point? Whether the criteria truly assume traditions are "hermetically sealed." Historians might counter that they check units against broader patterns—but in practice, the tests are applied atomistically. That's where the method feels most fragile.
answer: |-
  Here’s a reconstruction of the implicit epistemology of the standard criteria-based method, its assumptions, tensions, and the implications of altering it—with confidence assessments flagged throughout. I’ll proceed stepwise as requested.

  ---

  ### **Core Epistemology of the Standard Criteria Approach**
  1. **Assumption about Sources**:  
     - The gospel traditions are **aggregates of discrete units** (pericopae/logia) that circulated independently before redaction.  
     - Sources are **layered** (e.g., Mark → Matthew/Luke; hypothetical Q; John’s independence) and **detachable** from their theological frameworks.  
     - *What it strictly presupposes*: Units can be assessed in isolation; later theological bias is a contaminant to be stripped away.  
     - *Underdetermined*: Compatible with diverse source theories (e.g., Two-Source, Farrer, oral fragments).  

  2. **Detecting and Correcting Bias**:  
     - Bias is seen as **purposeful distortion** (e.g., suppressing embarrassment, inventing prophecy fulfillment).  
     - Criteria act as **filters**:  
       - *Dissimilarity*: Rejects material explicable by Judaism or early Church interests.  
       - *Embarrassment*: Flags material counter to the Church’s agenda (e.g., Jesus’ baptism by John, crucifixion).  
       - *Multiple Attestation*: Leverages source independence to counter individual biases.  
     - *Assumed*: Bias is identifiable through contradiction with known Jewish/Christian tendencies; "neutral" observation is possible.  
     - *Contested*: Whether "unbiased" transmission exists; whether criteria merely isolate *unusual* (not authentic) material.  

  3. **Nature of Authenticity**:  
     - Authenticity is a property of **individual units**, not narratives. A "historical Jesus" is the sum of authenticated units.  
     - *Implied ontology*: History is atomic; the whole is reconstructed from verified parts.  

  4. **Inference from Interested Testimony**:  
     - Testimony is treated as **guilty until proven innocent**. A claim is accepted only if it passes criteria that *override* suspicion of bias.  
     - *Assumed*: The burden of proof lies on authenticity; failure leaves material in epistemic limbo ("unverifiable").  

  ---

  ### **Tensions and Coherence in the Criteria**
  - **Dissimilarity vs. Coherence**:  
    - *Tension*: Dissimilarity isolates Jesus from Judaism and Christianity; coherence requires him to fit *some* context (e.g., Galilean Judaism).  
    - *Resolution in practice*: Coherence is often applied *secondarily* to material already deemed authentic via dissimilarity/embarrassment—making Jesus coherent only with a pre-filtered "core."  
    - **Confidence**: High (this circularity is well-documented).  

  - **The "Plausibility" Shift (e.g., Dunn, Theissen)**:  
    - Replaces dissimilarity with **historical contextual plausibility** (Jesus must make sense in 1st-century Judaism) **and** **explanatory plausibility** (he must explain the movement’s rise).  
    - **Not a refinement but a replacement**: It abandons the "negative residue" approach for positive contextualization, treating Jesus as embedded in Judaism *and* generative of Christianity.  
    - *Underdetermined*: Could align with criteria if coherence dominates, but rejects dissimilarity’s core premise.  

  ---

  ### **Adding the Professor’s Criteria: Implications**
  1. **Costly Retention**:  
     - Privileges material preserved despite imposing **practical or theological costs** (e.g., Jesus’ baptism, rejection of family, crucifixion).  
     - *What it commits to*:  
       - Communities are **rationally self-interested**—they only retain costly material if compelled (by authenticity, authority, or inertia).  
       - Stronger than embarrassment: Embarrassment might be retained passively; costly retention implies **active effort** (defending, reinterpreting).  
     - *Effect*: Narrows the authentic corpus to "high-cost" units; emphasizes tradition’s *resistance* to community interests.  

  2. **Control-Corpus Test**:  
     - Validates criteria against known cases (e.g., John the Baptist material, post-resurrection stories).  
     - *What it commits to*:  
       - Criteria must **falsify some material** to be credible. If criteria "authenticate" control inauthentic material, they fail.  
       - Forces methodological humility: Criteria are tools, not magic.  
     - *Effect*: Could debunk criteria (e.g., if dissimilarity authenticates post-resurrection appearances) or refine their application.  

  **Net Change with Both Additions**:  
  - The method becomes **more conservative** (smaller authentic corpus) and **self-critical**.  
  - "Authenticity" shifts from "surviving filters" to "resisting community interests + passing external validation."  

  ---

  ### **Abandoning Criteria for a "Portrait" Approach**
  - **What is lost**:  
    - Ability to make **granular claims** (e.g., "Jesus probably said *this logion*").  
    - The **falsifiability** of individual units (portraits are holistic; contradictions may be harmonized).  
  - **What is gained**:  
    - A **contextualized Jesus** embedded in social memory, avoiding the "negative residue" problem.  
    - Focus on **narrative logic**: Why did *this* portrait inspire a movement?  
  - **Epistemic shift**: Authenticity becomes a property of the **general impression** (e.g., Jesus as eschatological prophet) rather than specific sayings.  

  ---

  ### **Confidence Assessment**
  - **High confidence** in:  
    - The criteria’s unit-based epistemology and its "guilty until proven innocent" approach.  
    - The tension between dissimilarity and coherence.  
    - The plausibility approach as a substantive replacement.  
  - **Least confident move**:  
    - **Whether the criteria assume traditions are "hermetically sealed."** Critics (e.g., Chris Keith) argue traditions evolved interactively; the criteria may ignore how units are reshaped by communal use. *I reconstruct this as implicit, but some historians might claim they account for development*.  
  - **Moderate confidence** in the implications of adding costly retention/control tests—these depend on unverifiable assumptions about community behavior.  

  ---

  ### **Summary: The Method’s Unspoken Premises**
  The standard approach assumes history is accessed by **extracting uncontaminated fragments** from biased sources. It works best if:  
  - Traditions are stable units;  
  - Jewish/Christian "interests" are fully knowable;  
  - Authenticity is binary (yes/no) and atomic.  

  Adding costly retention/control tests injects **pragmatic realism** (communities curate traditions) and **empirical validation**. Shifting to a portrait approach abandons fragmentation for **narrative explanation**—at the cost of precision. The field’s methodological ferment reflects deeper divides over whether history is built from **reliable fragments** or **coherent stories**.  

