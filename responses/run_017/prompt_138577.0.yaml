  We are building a decision tree for the bootstrapping/easy-knowledge problem in epistemology. The tree starts from a fixed commitment: a single report from a source whose reliability you have never checked can still give you knowledge. We branch on questions that split the literature, using concrete cases at every node.

  The cases we'll use are:
  1. **One-shot case (OS)**: Roxanne looks at her gas gauge, which reads 'F'. She has no prior reason to trust the gauge. She believes the tank is full because the gauge says so. And indeed, it is full. Does she know it?
     - We start by assuming she does (fixed commitment).

  2. **Repeated-use case with selective logging (RSL)**: Roxanne uses her gas gauge repeatedly. Each time the gauge reads 'F', she looks at the tank to check. She only logs the cases where the gauge reads 'F' and she checks. She finds that in all logged cases, when the gauge reads 'F', the tank is full. She concludes the gauge is reliable. Then, on a new occasion, she sees the gauge reads 'F' and believes without checking that the tank is full.

  3. **Two-source case without independence (TS)**: Roxanne has two gas gauges, G1 and G2. She has no reason to think their errors are independent. She uses G1 to generate a dataset: she notes when G1 says 'F' and then checks the tank. She finds that when G1 says 'F', the tank is full 95% of the time. Then, on a new occasion, she sees G1 reads 'F' and G2 reads 'F'. She believes the tank is full because both say so.

  4. **LLM-evaluation pipeline (LLM)**: We have a model A that is used to judge outputs. We want to evaluate A's reliability. We take a set of inputs, have A label them. Then we have A (or a sibling model from the same training) re-label the same inputs (or a new set, but same distribution). We observe a high agreement rate (say 95%) between A's first labels and its own (or sibling's) second labels. We conclude A is reliable. Then we use A to grade the outputs of a new model B.

  The branching questions (with concrete cases):

  1. **Transmission of Knowledge via Track-record Inference?**  
     In the RSL case: After Roxanne has built the track record and infers the gauge is reliable, and then on a new occasion uses the gauge to form the belief that the tank is full, does she know the tank is full?  
     - Yes: The track-record inference transmits knowledge (or justification) to the new belief.  
     - No: The track-record inference does not transmit.

  2. **Defect Location (if transmission fails)?**  
     If the answer to the first question is "No", then where is the defect?  
     - The defect is in the track-record inference itself (the belief that the gauge is reliable is not justified).  
