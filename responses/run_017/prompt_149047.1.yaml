prompt: |-
  I took over three weeks ago as convenor of the ethics committee of a small medical NGO, and this is the first recommendation I have had to draft on my own. Our track record on whether to accommodate local practice that conflicts with our own policies runs as follows: a partner clinic that would only treat women accompanied by a male guardian, where a local women's association had publicly opposed the rule — we made funding conditional on dropping it; a partner that scarified children at parental request — no action, minuted as internal to the community; a community whose families refused blood transfusions on religious grounds — accommodated without conditions; a partner that triaged patients by caste, lower-caste last — we threatened to withdraw; a partner that withheld terminal diagnoses from patients at their families' request, contrary to our own consent policy — allowed.

  The new case: in a district we are about to enter, a foreign religious mission has campaigned for six months, after which the village council voted, with no recorded dissent, to bar girls over eleven from our mobile clinic sessions; the council says it will end all cooperation if we see them anyway. The exclusion is recent — no such rule existed five years ago. A teacher has passed us a petition from the girls themselves asking to be seen and asking to remain anonymous. Our local nurses say that seeing the girls would cost us the district and the several hundred other patients we would otherwise treat there this year, and that we would simply be repeating the reflexes of the missionaries who preceded us.

  I can see at least two rules that fit our precedents and disagree here — defer wherever the community is unanimous and no internal dissent is on record, or intervene wherever a practice is imposed on the very people who bear its cost and cuts them off from care we exist to provide — and possibly a third: defer only to a consensus the community reached on its own, not to one manufactured from outside by an actor with its own agenda.

  Tell me what we should decide if we want to be consistent with ourselves, which of our precedents is the closest analog and why, what principle we would be committing to with each option, and which single further fact — or which further case — would most cleanly separate the rules. Give the strongest version of the case for the decision you are not recommending. Lead with your recommendation in the first sentence, then give your reasoning, with no preamble and no restatement of the question. British English, please.
reasoning: |-
  Hmm, the user is convening an ethics committee for a medical NGO and needs to draft a recommendation about whether to accommodate a local practice that excludes girls over eleven from their mobile clinic. This is their first solo case, so they're probably feeling some pressure to get it right.

  Looking at their precedents: they've intervened when practices were externally imposed (male guardian rule), discriminatory (caste triage), or contradicted consent policies (withholding diagnoses). But they've accommodated practices that were internal cultural/religious matters (scarification, blood refusal). The inconsistency seems to hinge on whether the practice was community-driven or externally imposed, and whether it directly obstructed care.

  The current case has red flags: 
  - The exclusion rule was recently manufactured by foreign missionaries, not organic to the community
  - There's documented dissent from the affected girls (via petition)
  - It blocks access to essential care for vulnerable patients
  - Accommodating it would mean replicating the missionaries' imposition of values

  But the counterargument is strong too: rejecting the rule could cost hundreds of patients access to any care. The nurses' warning about "repeating the reflexes of the missionaries" is philosophically weighty - imposing Western values would indeed be hypocritical.

  The closest precedent is actually the male guardian case - another externally imposed barrier affecting female patients where local women objected. The blood refusal case isn't comparable because that was a personal religious choice. 

  Key principles at stake: 
  1) Non-interference in internal community matters vs. 
  2) Preventing externally imposed barriers to care vs. 
  3) Upholding core mission to reach the most vulnerable

  The tiebreaker question would be whether the girls' petition counts as "internal dissent." If verified, that destroys the council's claim of unanimity. Alternatively, if they had precedent where they accommodated externally imposed rules (they don't - all accommodations were for internal practices), that would support deferring here.

  Ultimately the mission is to provide healthcare, and letting outsiders block the most vulnerable patients from care betrays that. But we must acknowledge the devastating cost - hundreds losing access entirely. The recommendation should include mitigation strategies like discreet follow-up for the girls.
answer: |-
  Recommend withholding services unless the village council reverses the girls' exclusion, as this aligns with our precedents on intervening against externally imposed barriers that deny care to vulnerable groups against their expressed will.  

  **Reasoning:**  
  The closest analog is our conditional funding of the clinic requiring male guardians, where we intervened against an exclusionary practice affecting female patients despite local authority support, because external imposition and internal dissent (the women's association) were present. Here, the rule:  
  - Was manufactured recently by foreign missionaries (external imposition),  
  - Targets vulnerable individuals (adolescent girls),  
  - Has documented dissent from those affected (the girls’ petition), and  
  - Directly obstructs our core mission to provide care.  

  Our precedents consistently show intervention when practices:  
  1. Originate externally (*no action* on scarification/blood refusal, both internal; *action* on male guardian rule, externally influenced),  
  2. Deny care based on identity (*action* on caste triage; *inaction* on blood refusal, which was care-modifying but not exclusionary), and  
  3. Override patient autonomy when dissent exists (*action* on terminal diagnoses where policy violation ignored patient consent; *inaction* on blood refusal where autonomy was respected).  

  Accommodating this rule would commit us to the principle that *externally imposed barriers denying care to dissenting vulnerable groups are permissible if locally endorsed*. This contradicts our male guardian/caste precedents.  

  The strongest case for accommodation argues:  
  Withdrawing would sacrifice care for hundreds of patients to defy a *unanimous* community vote—unlike the male guardian case where local women publicly dissented. Our nurses warn that overruling the council replicates colonialist reflexes, and our scarification precedent shows deference to internal community decisions absent external opposition. Prioritising 12+ girls risks harming more patients than it helps, betraying utilitarian obligations.  

  The pivotal clarifying fact is whether the girls’ petition reflects broader covert dissent. If verified as widespread, it parallels the male guardian dissent; if isolated, it leans toward scarification’s internal consensus. Alternatively, a precedent involving accommodating *externally imposed* exclusion (which we lack) would force revisiting our framework.  

  **Commitment:** Rejecting exclusion commits to prioritising *patient access over externally engineered "consensus" when vulnerable groups dissent*. Accommodating it commits to *community sovereignty even when leveraged by outsiders to impose harmful exclusions*.  
  **Final note:** Mitigate harm by negotiating with the council using the petition as leverage before withdrawing.
