prompt: |-
  I help run a university effective-altruism group and I've been asked to give this term's ninety-minute intro session on cause prioritization. The room will be quantitatively literate newcomers who have already absorbed the standard three-factor decomposition — importance, tractability, neglectedness — from online write-ups and can recite it. I've read the standard posts and the standard pushback; I don't want the session to be a vocabulary lesson, and I suspect the recitation is exactly what stops people from being able to use the framework.

  So plan the session rather than writing it. I care most about three places where I think the usual treatment is wrong or silent. First, neglectedness as normally stated (roughly, how many resources already go here) looks like the wrong quantity: what does the work is whether my next unit of resources causes something that would not otherwise have happened, and a cause can be starved of funding while my dollar merely displaces another funder's, or crowded while one keystone input is the binding constraint. I want that taught, and I want it to fall out of the framework rather than arrive as a bolt-on fourth factor. Second, the framework returns different rankings depending on whether you apply it to a cause, an intervention, or the funding ecosystem as a whole, and I don't know which level to open with. Third, the three factors do not literally multiply: their units don't match and cost enters twice.

  Tell me what has to be in place before each of those can be raised and why, the one worked example that should carry the session and what it must have and lack (I've seen the many-people-mopping-one-spill picture and think it teaches the wrong thing), the mistakes this specific audience will make in the order they'll make them with the point in the sequence where each should be headed off, one closing question that would show me they can apply the framework rather than restate it, and what I should openly decline to cover in ninety minutes.
reasoning: |-
  Okay, the user is running a university effective altruism group and needs to plan a 90-minute intro session on cause prioritization. They've identified three key issues with the standard ITN framework: neglectedness being misleading, confusion about the level of analysis (cause/intervention/ecosystem), and the multiplicative assumption being problematic. The audience is quantitatively literate newcomers familiar with ITN but unable to apply it effectively.

  First, I need to address the session structure. The user wants to avoid a vocabulary lesson and instead focus on practical application. The key is to start with a concrete example that highlights the limitations of naive ITN. The "mopping a spill" metaphor is rejected because it suggests linear addition of resources. Instead, I should find an example where marginal impact and displacement are central. Maybe something like vaccine funding where additional dollars might displace other funders or face binding constraints.

  The user's three main points need to be woven into the session. For neglectedness, it's crucial to reframe it as the marginal counterfactual impact. The level of analysis issue means I should clarify whether we're evaluating a cause area, a specific intervention, or the funding ecosystem. The multiplication problem involves unit mismatches and double-counting cost. Each point requires foundational understanding before introduction.

  I'll plan the session in phases. Start with a baseline exercise to surface misconceptions. Use malaria prevention as a case study because it's familiar but complex. Participants might initially rank it highly due to importance and tractability, neglecting that funding might be saturated. Then introduce the reframed neglectedness as marginal impact per dollar. This leads into counterfactuals and displacement effects.

  Next, transition to the level of analysis problem. Show how ITN changes when applied to different scopes. For instance, a cause area like global health vs. a specific intervention like distributing bed nets. Highlight the ecosystem level where funding flows affect each other. This addresses the second point.

  The multiplication issue comes last. Explain unit incompatibility and how cost factors into both tractability and neglectedness. Use a simple equation to show that impact is proportional to the product of the factors divided by cost, but only if units align. Emphasize that ITN is a heuristic, not a formula.

  For the closing question, ask participants to compare two interventions using ITN while considering counterfactuals and constraints. This tests application beyond recitation. Openly decline to cover speculative cause areas like AI risk, sticking to tangible examples.

  Potential mistakes: overlooking displacement, conflating levels, misapplying multiplication. Sequence corrections after each concept introduction. Use group discussions to reinforce learning. The worked example must involve resource constraints and displacement to illustrate the reframed neglectedness. Avoid interventions where impact scales linearly. Ensure the example shows that even underfunded areas can have low marginal impact due to displacement.

  In summary, structure the session to progressively build complexity, starting with familiar ITN, exposing flaws through a case study, reframing concepts, and applying the refined framework. Allocate time for interactive elements to engage participants and solidify understanding. Openly set boundaries to manage expectations and maintain focus.
answer: |-
  Here’s a battle-tested session plan targeting your core concerns, designed to transform recitation into application. Prioritize conceptual shifts over vocabulary, using a single anchoring example.

  ### **Session Structure (90m)**
  **PART 0: Baseline & Icebreaker (10m)**  
  - *Activity:* Quick poll: "Rank these 3 causes using ITN: AI safety, malaria bednets, biosecurity." (Reveal divergent answers).  
  - *Why:* Surfaces overconfidence in naive ITN application. Shows identical framework → different rankings.  
  - *Declare scope:* "Today we dissect *how* to use ITN rigorously, not *what* to prioritize. We won't cover speculative cause comparisons (e.g., AI vs bio)."

  **PART 1: Rebuilding Neglectedness (25m)**  
  - *Prerequisite:* Participants must grasp ITN *as they know it* (poll confirms this).  
  - *Key shift:* **Neglectedness isn’t "total resources" but "marginal counterfactual impact per resource unit."**  
  - *Worked Example:* **"Expanding a Vaccine Program"**  
    - *Context:* A life-saving vaccine program in Region X needs $1M to scale.  
    - *Must have:*  
      - **Displacement risk:** Gates Foundation is actively considering funding it. Your $1M *might* displace theirs.  
      - **Binding constraint:** Scaling requires local nurses. Current nurse shortage = hard constraint.  
    - *Lacks:* Linear scaling (e.g., "each $ saves 1 life").  
    - *Activity:* Groups calculate ITN:  
      - Naive: High importance/tractability, low neglectedness (other funders → low impact).  
      - Refined: If your $ displaces Gates, impact ≈ $0. If nurses are bottleneck, even with funding, impact = 0.  
    - *Why this example:* Shows "underfunded" ≠ "your dollar helps". **Neglectedness = slack in the *marginal impact pipeline*.**  

  **PART 2: Level of Analysis (20m)**  
  - *Prerequisite:* Understanding marginal impact (from Part 1).  
  - *Key shift:* **ITN answers change based on *what you're evaluating*.**  
    - **Cause area** (e.g., "Global Health"): Broad, hard to quantify tractability/neglectedness.  
    - **Intervention** (e.g., "Distribute bednets in Malawi"): Concrete, but neglects interactions.  
    - **Funding ecosystem** (e.g., "Malaria funding in Malawi"): Reveals displacement/crowding.  
  - *Activity:* Revisit vaccine example. Groups apply ITN to:  
    1. Cause: "Infectious Disease Prevention"  
    2. Intervention: "Vaccine Program in Region X"  
    3. Ecosystem: "Health Funding in Region X"  
  - *Reveal:* Different neglectedness/tractability conclusions at each level. **Open with interventions:** They anchor abstract causes to concrete actions and reveal ecosystem constraints.  

  **PART 3: Why Multiplication Fails (15m)**  
  - *Prerequisite:* Marginal impact + levels of analysis.  
  - *Key shift:* **ITN factors aren't multiplicative because:**  
    - Units mismatch (lives/$ ≠ dimensionless multipliers).  
    - Cost appears twice: Tractability (cost-effectiveness) *and* Neglectedness (resources needed).  
  - *Activity:* Sketch: Impact ∝ [Importance × Tractability × (1/Neglectedness)] / Cost.  
    - Emphasize: **"Tractability ≈ % problem solved per resource unit. Neglectedness ≈ how many units needed before saturation/displacement."** Cost is the denominator.  
  - *Visual:* A pipe (problem) with valves (constraints). Importance = pipe size. Tractability = valve openness. Neglectedness = pressure (low pressure = easy to add flow).  

  **PART 4: Synthesis & Mistakes (15m)**  
  - *Common mistakes in sequence:*  
    1. **Ignoring displacement** (e.g., "This charity is underfunded → my donation helps!"): Head off in Part 1 with vaccine example.  
    2. **Mixing levels** (e.g., "AI safety is neglected" without specifying intervention): Head off in Part 2 with level-switch activity.  
    3. **Forcing multiplication** (e.g., "ITN score = I×T×N"): Head off in Part 3 with unit analysis.  
  - *Closing Question:* **"How could an intervention be *simultaneously* high-importance, high-tractability, and high-neglectedness, yet *low-priority*?"**  
    - *Testing application:* Ideal answer identifies displacement ("my $ replaces another funder"), binding constraints ("no nurses to hire"), or misaligned levels ("cause is neglected but my intervention isn’t").  

  **PART 5: Wrap-up (5m)**  
  - *Key takeaway:* **ITN is a heuristic to spot bottlenecks.** Ask: "Where is the next unit of resources *counterfactually impactful*?"  
  - *Openly exclude:*  
    - Long-termism vs. near-termism debates.  
    - Moral weight calculations (human vs. animal lives).  
    - Deep dives into specific causes (focus on *how*, not *what*).  

  ### **Why This Works**  
  - **Anchoring example** is realistic, shows displacement + constraints, and lacks linear scaling (unlike the mopping metaphor).  
  - **Mistakes are preempted** by structuring the session around their emergence (displacement → levels → multiplication).  
  - **Closing question** requires synthesizing all three insights to answer correctly.  
  - **Time management:** Cuts speculative debates, focuses on mechanics.  

  **Prep Tip:** Pre-load the vaccine example with fake data (e.g., cost/life saved, Gates funding probability, nurse training capacity) to make calculations tangible. Use live polls (Slido/Mentimeter) for instant feedback during activities.
