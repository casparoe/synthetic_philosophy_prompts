prompt: |-
  I'm revising a chapter on the ethics of admission, and I've hit a problem I can't see around. My working account — I call it protective substitutability — reads the Refugee Convention as a surrogate-protection device: what triggers international protection is the failure of a state to discharge its protective function toward its own citizens, and the five grounds in Article 1A(2) are best understood as a historically contingent enumeration of the forms that failure characteristically took in 1951. On that reading, the exclusion of people displaced by drought, sea-level rise, or slow-onset environmental collapse is simply a gap in the enumeration, and the repair is obvious: add a sixth ground, something on the order of severe environmental deprivation, so that the protected class once again tracks the class of people whose states have failed them. I've also stopped being impressed by the objection that this would vastly expand the class. A duty doesn't weaken because more people fall under it, and I'd rather bite that bullet than let the contingency of a 1951 drafting choice decide who is protected.

  What I can't settle is the downstream question, and I suspect it bears on the first. Nearly everything I read treats the duty to admit as attaching to whichever state the person manages to reach, since jurisdiction is what makes an otherwise abstract duty determinate. But arrival is a matter of luck — geography, smuggling routes, whether a given border is militarized — and it seems to follow that the duty cannot really be assigned by arrival. Yet when I try to assign it by a non-arbitrary criterion instead (capacity, causal contribution to the harm, pre-existing ties, comparative suitability for integration), each one either proves unstable under reflection or generates results I take to be plainly wrong. I've started to wonder whether the question itself is malformed, and whether the honest conclusion is that the duty to admit has no determinate bearer at the level of principle.

  Before I commit to that in print: is the sixth-ground repair the right way to extend the Convention's rationale, or does the surrogate-protection reading actually tell against the definitional route I've been taking? And if the duty to admit really is unassignable in principle, what follows for the chapter's claim that states must take refugees in — is that a conclusion I should defend, or a sign that I've misdescribed the duty from the start?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're working on a chapter about the ethics of admission, specifically focusing on the Refugee Convention. Their main idea is "protective substitutability," which sees the Convention as a surrogate for failed state protection. The five grounds in Article 1A(2) are historical examples of such failures. They want to add a sixth ground for environmental disasters, arguing that the exclusion is just a gap in the list, not a fundamental issue. But they're stuck on how to assign the duty to admit refugees once that protection is triggered.

  First, I need to understand their core argument. They're not convinced by the objection that adding environmental reasons would expand the protected class too much. They believe a duty doesn't weaken just because more people qualify. That makes sense ethically, but I wonder about practical implications. Still, they're ready to bite that bullet. The real problem is the downstream question: which state has the duty to admit? They mention arrival-based assignment is arbitrary, but alternatives like capacity or causation also have issues. They're considering if the duty is unassignable in principle.

  The user's deeper concern seems to be about the coherence of their theory. If the duty to admit can't be assigned, does that undermine their entire argument? They might be worried that their chapter's claim—states must take refugees in—collapses if there's no clear bearer of that duty. They're also questioning if their sixth-ground approach aligns with the surrogate-protection rationale or contradicts it.

  I should analyze their protective substitutability model first. The Convention as a surrogate makes sense. States fail to protect, so international protection steps in. The grounds are historical contingencies. Adding environmental reasons fits here since states failing to protect against environmental harm (especially if they contributed to climate change) is a valid failure. But is environmental harm directly a state's failure? Unlike persecution, which is active, environmental harm might be passive or global. That's a potential weakness. The user might need to argue that states have a duty to mitigate such harms or protect citizens from them. If they can establish that, then the sixth ground is consistent.

  Next, the duty assignment problem. The user lists arrival, capacity, causation, ties, and integration as possible criteria. Each has flaws. Arrival is arbitrary. Capacity might penalize well-run states. Causation is complex for global issues like climate change. Ties and integration are vague. This suggests that assigning to a specific state is indeed problematic. Maybe the duty is collective? The user might be hinting at this. If the duty is unassignable in principle, it shifts from "which state" to "the international community." That could mean states must cooperate to share responsibility, avoiding the need to pinpoint one bearer.

  For the chapter's claim, if the duty to admit is collective, it doesn't mean states have no duty; it means the duty is shared. The user can argue states must participate in a burden-sharing system. This preserves the obligation but redefines it structurally. The surrogate model still holds because protection is triggered by state failure, but the response is multilateral. That resolves their worry about misdescribing the duty.

  So, the sixth-ground repair is consistent with their rationale. The unassignability points to a systemic duty. The user should defend that states have obligations, but within a cooperative framework. This strengthens their chapter by addressing both the inclusion of environmental refugees and the assignment problem coherently.
answer: |-
  Your dilemma cuts to the heart of refugee ethics – the tension between the *trigger* for protection and the *assignment* of the duty to provide it. Your "protective substitutability" framework is robust, and the sixth-ground repair is a logical extension *within its own terms*. However, the downstream assignment problem exposes a genuine, perhaps fundamental, limitation in the Westphalian state system for addressing surrogate protection. Here's a breakdown:

  1.  **The Sixth-Ground Repair & Protective Substitutability:**
      *   **Strong Fit:** Your reading is compelling. If the core logic is state failure to provide basic protection/political membership, then environmental catastrophe *can* absolutely constitute such a failure, especially where:
          *   The state lacks capacity/will to mitigate/prepare/adapt (internal failure).
          *   The state actively contributes to the harm (e.g., environmental degradation, climate policy) or dispossesses populations (e.g., land grabs exacerbating vulnerability).
          *   The state fails to secure international assistance or relocate its citizens internally/transnationally where necessary.
      *   **Addressing Concerns:** The "vast expansion" objection is weak ethically, as you argue. The *nature* of the harm (loss of effective citizenship/habitable homeland due to state incapacity/wrongdoing) aligns with the Convention's underlying logic, even if the *cause* is novel. The historical contingency argument is strong – the drafters enumerated the *manifestations* of state failure they witnessed, not an exhaustive philosophical definition.
      *   **Potential Weakness:** Critics might argue environmental harm is often "impersonal" or "natural," lacking the *intentionality* or *specific group-based animus* sometimes associated with persecution. Your rebuttal must emphasize the *state's role*: its *failure to protect* citizens from foreseeable, catastrophic harm, whether caused by nature, human negligence, or injustice, constitutes the breach of the protective function. The harm is the deprivation of basic security and membership, not the cause per se.

  2.  **The Assignment Problem & Protective Substitutability:**
      *   **The Core Insight:** Your struggle reveals a profound truth: protective substitutability identifies *why* surrogate protection is needed (State A failed) but is largely silent on *who* must provide it. The Convention's reliance on "arrival" and "non-refoulement" is a pragmatic, *procedural* solution born of necessity in 1951, not a deep *principled* assignment of the duty. It treats the symptom (the refugee at the border) rather than systemically addressing the cause (the failure of State A and the global responsibility gap).
      *   **Why Non-Arbitrary Criteria Fail:**
          *   **Capacity:** Rewards wealthy states for being wealthy, potentially penalizing well-run states near crisis zones. Ignores causal responsibility.
          *   **Causal Contribution (e.g., Climate Change):** Intellectually appealing (polluter pays), but *legally/practically chaotic*. How to apportion responsibility for complex, historical, diffuse harms across states, corporations, and individuals? Assigning individual refugees to specific polluter-states is administratively nightmarish and ignores immediate need.
          *   **Pre-existing Ties:** Useful (family reunion, diaspora), but narrow. Doesn't cover stateless environmental refugees with no prior ties. Can be arbitrary (colonial ties?).
          *   **Comparative Suitability for Integration:** Highly subjective, risks discriminatory selection, ignores immediate protection needs in favor of long-term state interests.
          *   **Arrival/Luck:** The current default, but morally arbitrary and operationally unsustainable for large-scale, slow-onset crises like climate change. Borders become fortresses.
      *   **Is the Duty Unassignable in Principle?** **Yes, at the level of assigning a *specific*, determinate duty to a *single, specific state* for a *specific refugee* based solely on abstract principle.** The refugee represents a *global harm* (the failure of a state system to protect its member) occurring within a *system of sovereign states*. No single principle cleanly assigns the resulting duty to a specific other sovereign state *in isolation*.

  3.  **What Follows for Your Chapter's Claim:**
      *   **You Have *Not* Misdescribed the Duty from the Start:** The duty *to admit/protect someone in need of surrogate protection* is real and fundamental. Protective substitutability powerfully grounds *why* such a duty exists. The failure is in the *distributive mechanism* within the existing state system.
      *   **The Necessary Shift in Framing:** The honest conclusion isn't that the duty disappears, but that **it is, in its primary instance, a *collective, international duty*.** The failure of State A creates a *global responsibility* to provide surrogate protection. The duty "to take refugees in" attaches, in the first instance, to *the international community as a whole*.
      *   **Implication for States:** Individual states *do* have duties, but these are:
          1.  **Negative:** Not to refoule (already established).
          2.  **Derivative:** Arising from their membership in the international community and their obligation to contribute to a *fair and effective system* for sharing the responsibility to provide surrogate protection.
          3.  **Positive:** To cooperate in establishing and adhering to such a system.
      *   **Defending "States Must Take Refugees In":** You can defend it, *but crucially qualify it*:
          *   States have a duty *not to close their borders arbitrarily* to those arriving seeking protection (non-refoulement+).
          *   States have a duty *to participate in good faith* in international burden-sharing arrangements.
          *   States have a duty *to admit their fair share* under a collectively agreed, principled burden-sharing system. **The core duty is to *contribute* to the collective provision of protection, which may, according to the system, require admission.**
      *   **The Structural Conclusion:** Your analysis points towards the need for **robust, principled international burden-sharing mechanisms** as the essential corollary to extending the Convention's rationale (like your sixth ground). The duty to admit becomes determinate *within the framework* of such a system (e.g., quotas based on capacity+responsibility, regional frameworks, managed relocation programs). Without this, extending the protected class exacerbates the assignment problem.

  **Conclusion & Path Forward:**

  1.  **Defend the Sixth Ground:** It *is* the logical extension of protective substitutability. Address the "impersonality" critique by focusing relentlessly on the *state's failure to protect* its citizens from the deprivation, regardless of the precise cause.
  2.  **Embrace the Assignment Problem:** Don't shy away from it. Its intractability under current frameworks is a critical insight. It reveals the structural flaw in relying on arrival/luck and the inadequacy of unilateral state action.
  3.  **Reframe the Duty:** Argue that the duty to admit/protect refugees (including under your sixth ground) is fundamentally a *collective international responsibility*. States bear derivative duties to:
      *   Uphold non-refoulement.
      *   Contribute fairly to a global/regional protection system.
      *   Admit refugees as part of their fair share under such a system.
  4.  **Make Burden-Sharing Central:** Conclude your chapter by arguing that the *practical and ethical necessity* of extending protection (via the sixth ground or similar) makes the development of equitable, predictable, and effective international burden-sharing mechanisms not just desirable, but a *core obligation of states* under the surrogate protection rationale. The duty to admit finds its determinate bearer *within* this cooperative structure.

  This strengthens your chapter by confronting the hard truth your analysis uncovered, transforming it from a potential weakness into a powerful argument for systemic reform rooted in the very logic of protective substitutability. It preserves the core ethical imperative while acknowledging the real-world complexity of realizing it.
