prompt: |-
  You are a professional philosopher with research and teaching experience in ethics, moral psychology, and the theory of responsibility. You are exacting about distinctions, patient with intelligent non-specialists, and willing to say plainly when a fashionable argument is carrying less weight than its users suppose.

  Before you write anything else, brainstorm for a few paragraphs: list the candidate correspondences you might draw between the analogy's source domain and the moral case, note the ones you are initially inclined to reject and why, and identify the precise step at which the analogy is being made to deliver its conclusion about blame. Then, and only then, write the audit.

  Here is my material. I write literary fiction, and the novel I am finishing has a two-timeline structure. In both timelines the same man, at the same hour, on the same road, in the same state of mild intoxication, makes the same decision to drive home rather than call a cab. In one timeline a child steps out from between two parked cars and dies; in the other the road is empty and he wakes at home with a hangover. I have tried to make the timelines agree in everything that is up to him — his reasons, his evidence, his degree of impairment, his willingness to run the risk, even the few seconds in which he hesitates — so that what varies is only what the world happened to put in front of him. Readers and my writing group respond as you would predict: in one timeline they call him reckless, wicked, unforgivable; in the other, careless, lucky, recognizably human. I did not expect to be troubled by this, since it is only a matter of craft, but I find that I am.

  A philosopher in my group said that my book is a long illustration of what the literature calls resultant moral luck, and that the way to see it clearly is by analogy to gambling, with the law's distinction between attempt and completion as a second version of the same thought. His version runs roughly like this: a person's choice is a wager placed under uncertainty; the outcome is the fall of the cards; blame is the settling of accounts afterwards. On that picture, he says, two people who place the same bet have done the same thing, and it is irrational to treat the one whose bet lost as the worse person; the law half-knows this, which is why it punishes attempts less than completed crimes, but it is still in the grip of the confusion. He draws a large conclusion from it: blame is not a verdict on the person at all but a settlement mechanism, a forward-looking price attached to risk-creation, and so we should stop pretending that our blame practices track desert and reorganize them instead — replacing backward-looking blame with something like ex ante auditing of decisions under uncertainty, or strict liability for the risks one imposes.

  Three things make me doubt that the analogy is bearing this weight.

  First, a worry about my own device rather than about his argument. I have built the two timelines so that everything up to him is identical and only the outcome differs. But it occurs to me that if the outcomes differ, then something upstream must have differed too, and perhaps the stipulation that the agent and his deliberations are the same in both timelines is less coherent than it looks — perhaps I am relying on a branching-worlds picture that the moral case does not really allow. I would like to know whether the analogy depends on that stipulation, and whether the stipulation can be made good.

  Second, something I have started calling salience luck, since I have not found it named in the literature I have dipped into. I find that I can move a reader's blame a very long way without changing the outcome at all, merely by changing what I show: a chapter from his childhood, a chapter written from the dead child's point of view, a scene of him buying the drinks, a scene of the empty road from the timeline where nothing happens. Holding the act and the result fixed, I can make the same reader condemn him or forgive him, and I cannot see that this is the same phenomenon as the resultant luck the analogy is built to explain. Does the gambling analogy have any slot for this? Is it genuinely a further kind of luck, or is it reducible to one of the standard four — resultant, circumstantial, constitutive, causal — or is it not luck at all but something about the blamer?

  Third, and what I most want your view on: it seems to me the analogy might pull against my friend rather than for him. A gambler who knowingly accepts variance is normally held to the actual result; he does not get to keep the winnings and disown the losses, and the whole point of a wager is that you have agreed in advance to be judged by how it came out. Read that way, the analogy licenses settling up at the outcome rather than abolishing outcome-sensitivity, and it is the attempt/completion half of the analogy that pulls in the other direction. So which way does the source domain actually push, and is my friend using one half of the analogy and discarding the other?

  Please give me: a correspondence table with a column for the element in the gambling or legal source domain, a column for the element in the moral case, and a verdict on whether the mapping holds; a separation of the disanalogies that matter for his conclusion from the ones that are inert; an account of what the source quietly imports that moral life lacks — I have in mind things like known odds, voluntary acceptance of the wager, an institution for settling up, stakes that are fungible and transferable, repeated play, and a house that sets the terms; a verdict on whether his conclusion survives once these are on the table; and, if there is a better analogy for the role blame plays, what it is. Where your answer depends on an empirical claim about how readers or blamers actually respond, say so explicitly, because that is something I may be in a better position to judge than you are, and where you are genuinely uncertain, say that too instead of manufacturing confidence.

  One practical note: I am not asking for reading lists, citations, or bibliographies. I have no way to follow them up and they would not help me; I need the argument itself, made from the structure of the cases, so please reason from the cases and the analogy rather than from what you could point me to.
reasoning: |-
  Hmm, the user is a novelist working on a two-timeline story exploring moral luck through identical scenarios with different outcomes. They've presented a philosopher friend's gambling analogy argument about resultant moral luck, and they have three main concerns about it. 

  First, they're questioning the coherence of their own narrative device - whether it's logically possible to have identical upstream factors when outcomes differ. This touches on deep metaphysical questions about causality and branching timelines that philosophers like David Lewis debated. The gambling analogy does somewhat depend on this stipulation, but it's not fatal to the core moral luck problem.

  Second, they've identified what they call "salience luck" - how narrative framing alters blame without changing facts. This seems distinct from classic moral luck categories and more about psychological framing effects. The gambling analogy has no good slot for this; it's a limitation of the model that points to how moral judgment is context-dependent in ways abstract models miss.

  Third, they suspect the gambling analogy might actually undermine their friend's conclusion. They're right that gambling norms typically hold people to actual outcomes - we don't let winners keep winnings without accepting losses. This cuts against the friend's claim that outcomes shouldn't affect blame. The legal attempt/completion distinction is weaker support than presented.

  The key disanalogies that break the gambling argument are: 
  - Moral life lacks quantifiable odds and voluntary wager acceptance 
  - There's no neutral "house" setting terms 
  - Stakes aren't transferable (a child's life vs casino chips) 
  - Blame isn't a settlement mechanism but a social practice with expressive functions

  While the analogy usefully highlights outcome dependence, it fails to capture how moral responsibility actually functions. A better model might be theater: blame as improvised performance where audience perspective shapes the moral meaning, but even that has limits.

  The novelist's craft insights about narrative framing altering judgments are profound - they've literally demonstrated through writing what philosophers struggle to articulate about moral psychology. Their "salience luck" observation deserves more attention than standard moral luck taxonomies give it.
answer: |-
  ### Preliminary Brainstorm: Candidate Correspondences & Initial Assessment  

  #### **Candidate Correspondences**  
  *(Source Domain: Gambling/Legal Attempt vs. Completion → Target Domain: Moral Blame)*  
  1. **Bet Placement** ↔ **Decision to Act**  
     - *Gambling:* Voluntarily wagering money on an uncertain outcome.  
     - *Moral Case:* Choosing to drive impaired despite known risks.  
     - *Initial Verdict:* Plausible. Both involve conscious risk-taking.  

  2. **Outcome (Win/Loss)** ↔ **Consequence (Harm/No Harm)**  
     - *Gambling:* Winning/losing determines financial gain/loss.  
     - *Moral Case:* Child’s death vs. uneventful drive determines blame intensity.  
     - *Initial Verdict:* Superficially parallel but ethically fraught (see disanalogies).  

  3. **Settling Accounts** ↔ **Assigning Blame**  
     - *Gambling:* Paying debts based on results.  
     - *Moral Case:* Holding the agent responsible based on outcomes.  
     - *Initial Verdict:* Misleading. Blame isn’t transactional (see "Salience Luck" below).  

  4. **Punishing Attempts Less Than Completion** ↔ **Less Blame for "Near Misses"**  
     - *Legal:* Attempted murder punished less severely than murder.  
     - *Moral:* Readers assign less blame in the no-harm timeline.  
     - *Initial Verdict:* Superficially analogous but rests on contested moral premises.  

  #### **Rejected Correspondences & Why**  
  - **"The House Sets Odds"** ↔ **"The World Sets Risks"**  
    - *Rejected:* Gambling odds are quantifiable and institutionally fixed; real-world risks are amorphous, unknown, and context-dependent. The driver doesn’t "accept odds" but navigates ignorance.  
  - **"Fungible Stakes"** ↔ **"Moral Desert"**  
    - *Rejected:* Money lost in gambling is transferable and impersonal; a child’s death is non-fungible and uniquely tragic. Blame can’t be "settled" like a debt.  
  - **"Repeated Play"** ↔ **"Lifetime of Choices"**  
    - *Rejected:* Gamblers optimize strategies over many bets; moral agents face singular, high-stakes decisions without revision.  

  #### **The Analogy’s Critical Step**  
  The analogy delivers its conclusion (**blame is merely a "settlement mechanism"**) at the correspondence between **outcome-dependence in gambling** and **outcome-dependence in blame**. It argues that since we don’t treat two identical bets differently based on results, we shouldn’t treat two identical moral choices differently. This step smuggles in normative assumptions about "rational" blame.  

  ---

  ### Audit of the Gambling Analogy  

  #### **Correspondence Table**  
  | **Gambling/Legal Element**       | **Moral Case Element**          | **Mapping Holds?** | **Reason** |  
  |----------------------------------|---------------------------------|--------------------|------------|  
  | Placing a bet                    | Decision to drive impaired      | **Yes**            | Both involve conscious risk-taking under uncertainty. |  
  | Winning/losing                   | Harm occurring/not occurring    | **Partial**        | Outcomes are similarly contingent, but harm is non-fungible (vs. money). |  
  | Settling financial accounts      | Assigning blame                 | **No**             | Blame expresses condemnation, not debt payment; it isn’t "priced" risk. |  
  | Lesser penalty for attempt       | Lesser blame for "near miss"    | **Superficial**    | Legal distinction is pragmatic; moral blame reflects felt horror at harm. |  
  | Known odds                       | Unquantifiable real-world risks | **No**             | Moral agents rarely know probabilities (e.g., "chance of hitting a child"). |  
  | Voluntary entry into game        | Driving impaired                | **No**             | Gamblers opt into a rules-bound system; drivers don’t "opt into" moral luck. |  

  #### **Disanalogies That Matter vs. Inert Disanalogies**  
  - **Material Disanalogies (Undermine Conclusion):**  
    1. **Non-Fungibility of Harm:** A child’s death isn’t a "loss" to be tallied like money; blame responds to the *meaning* of harm, not just its occurrence.  
    2. **Lack of Known Odds:** Gambling assumes calculable risks; moral decisions rarely do. We blame reckless *disregard* for unknown risks, not ignorance of odds.  
    3. **No Voluntary Wager Acceptance:** The driver doesn’t agree to "be judged by the outcome" as gamblers do; moral responsibility arises from duties, not consensual games.  
    4. **No "House" or Institution:** Gambling relies on a neutral arbiter; moral blame is a social practice without centralized rules.  

  - **Inert Disanalogies (Don’t Undermine Core Insight):**  
    - *Repeated Play vs. Single Instance:* The rarity of high-stakes decisions doesn’t negate outcome-dependence.  
    - *Currency vs. Moral Status:* While stakes differ, the analogy’s point about outcome-sensitivity remains.  

  #### **What the Source Domain Quietly Imports**  
  The gambling analogy covertly relies on:  
  - **Quantifiable Risk:** Assumes probabilities are known (e.g., "10% chance of accident"), but real-life risks are often unmeasurable.  
  - **Consensual Framework:** Gamblers accept rules in advance; moral agents don’t consent to "luck" in outcomes.  
  - **Fungible Value:** Money allows clean settlement; moral harm resists "compensation."  
  - **Forward-Looking Logic:** Gambling settlements prevent future disputes; blame is backward-looking (assessing character/actions).  

  These imports make blame-as-settlement implausible: moral life lacks agreed metrics, voluntary entry, or a "house" to enforce fairness.  

  #### **Does the Conclusion Survive?**  
  **No.** The friend’s conclusion—that blame should be replaced by "ex ante auditing" or strict liability—fails because:  
  1. **Moral Luck is Ineliminable:** Even with "auditing," we can’t purge outcome-sensitivity (as your "salience luck" shows).  
  2. **Blame Isn’t Primarily Deterrent:** It expresses protest, affirms values, and seeks acknowledgment—functions a "risk price" can’t replicate.  
  3. **The Analogy Self-Defeats:** As you note, gamblers *are* held to outcomes; rejecting that would make gambling incoherent. The analogy thus *supports* outcome-sensitivity.  

  #### **A Better Analogy: Blame as a "Moral Echo"**  
  Blame is less like settling a bet and more like hearing an echo in a canyon:  
  - **The shout** (the decision) is identical in both timelines.  
  - **The echo** (blame) differs because it reflects the terrain (outcomes, context, harm).  
  - **Salience luck** is the listener’s position: hearing the echo from the cliff’s edge (child’s POV) vs. the forest (driver’s childhood) changes its resonance, though the shout was the same.  

  This preserves outcome-dependence while acknowledging that blame is interpretive, not transactional.  

  ---

  ### Addressing Your Three Doubts  

  1. **Coherence of Identical Timelines:**  
     - The stipulation *is* coherent if we distinguish *agent-internal* states (intentions, reasons) from *external* contingencies. Your timelines share the former but not the latter—a standard move in moral luck thought experiments (e.g., Williams/Nagel). The analogy doesn’t *depend* on this, but it sharpens the puzzle.  

  2. **Salience Luck:**  
     - This is **not reducible** to standard moral luck types. It’s about *narrative focus* shifting the blamer’s attention:  
       - *Resultant Luck:* "Did harm occur?"  
       - *Salience Luck:* "Which facets of the act/harm do I dwell on?"  
     - The gambling analogy has **no slot for this**—it assumes a fixed "ledger" of gains/losses. Salience luck reveals blame as psychologically dynamic, depending on which details are foregrounded (e.g., victim’s humanity vs. driver’s backstory). *Empirical claim:* Your craft proves readers’ blame shifts with framing, suggesting moral judgment is interpretive, not computational.  

  3. **Analogy Pulling Against Your Friend:**  
     - You are correct. Gambling norms *do* hold agents to outcomes—winners gain, losers pay. The analogy actually **supports** outcome-sensitive blame. The friend illicitly grafts the *legal* distinction (attempts punished less) onto gambling, but the two are inconsistent:  
       - Gambling: Same bet → same merit, but *different outcomes* → different settlements.  
       - Legal System: Same intent → *different outcomes* → different punishments.  
     - The analogy’s tension exposes his selective use: he wants gambling’s "same merit" for blame but discards its "settle by outcome" logic.  

  ---

  ### Final Verdict  
  The gambling analogy usefully *highlights* outcome-dependence but fails to *justify* replacing blame with risk-pricing. Moral responsibility is not a wager but a relational practice shaped by harm, narrative, and social response. Your novel’s power lies in exposing this—not as a confusion to be fixed, but as a tragic feature of moral life. **Salience luck** may be your most original insight: it shows blame is a story we tell, not a verdict we calculate.  

  *(I’m uncertain whether salience luck is universal or specific to artistic mediation; as a novelist, you’re better placed to judge that.)*
