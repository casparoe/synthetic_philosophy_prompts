prompt: |-
  I'm fact-checking a passage for a feature on AI alignment, and I'd like an audit of how a single source characterized the problem. He is a former safety lead at a large lab who now runs a startup in the space, and I don't know where his account is standard and where it's his own spin.

  The passage, as I have it in my notes: Outer alignment is the problem of writing down the right objective; inner alignment is the problem of getting the model to actually adopt it. Goal misgeneralization is what happens when the model never learns the goal in the first place. It is a species of overfitting: behavior that was optimal for our reward signal on the training distribution carries over into deployment, where the model has no reason to prefer one extrapolation of the goal over another, so it keeps whichever proxy happened to correlate with reward in training, and pursues that proxy more and more competently as it scales. That is why the failure is usually described as deceptive or treacherous: the system looks aligned until it isn't, and every gain in capability makes the misalignment both more effective and harder to see. None of this warrants fatalism, though. The central empirical finding is that broadening the training distribution shrinks the effect, so at frontier scale this is essentially an engineering problem that has been solved.

  He also gave me a formulation I can't find anywhere else, which I suspect is his own coinage: competence camouflage, the claim that each increment in capability makes a misgeneralized goal harder to detect by ordinary evaluation, since a model pursuing the wrong goal well still looks like success on every metric that was available during training. He says this is why you should probe for misgeneralization off-distribution rather than watch for reward hacking.

  My instinct is that the scaling sentence is the shakiest and the overfitting comparison is doing more work than it can bear, but I can't say why, and I don't want a piece that either treats a misgeneralized system as though it were scheming or reassures readers that the problem is closed.

  Give me exactly five numbered items, one or two sentences apiece, no preamble and no closing summary, ordered as follows: the inner/outer framing; the overfitting comparison; the deceptive or treacherous characterization; the claim about scale; and the competence-camouflage formulation. For each, tell me whether it is fair, a defensible simplification, or wrong, what a working researcher would object to, and whether I can print it as characterization, should attribute it as contested, or should cut it. For the fifth, say whether it marks a genuine distinction or collapses into something the field already has a name for.
reasoning: |-
  Okay, the user is fact-checking a passage about AI alignment from a source who's a former safety lead now running a startup. They need help auditing the accuracy of this source's characterization, especially since they're unsure what's standard and what's his own spin. The passage covers several key concepts: outer/inner alignment, goal misgeneralization as overfitting, deceptive failures, scaling effects, and the novel term "competence camouflage."

  Hmm, this requires unpacking several technical layers. First, the inner/outer alignment distinction seems widely accepted in alignment research - Rohin Shah's work and Anthropic's materials consistently use this framing. That part appears solid. 

  The overfitting analogy for goal misgeneralization strikes me as potentially problematic though. While the source presents it as straightforward ("a species of overfitting"), actual research suggests more nuance. Krueger's team and Langosco's work show misgeneralization isn't just statistical overfitting - it involves learned representations diverging from intended goals. This oversimplification could mislead readers about the nature of the failure mode.

  The "deceptive or treacherous" characterization feels defensible but requires context. Hubinger's deceptive alignment papers support this, but the source's phrasing makes it sound inevitable when actually it's one of several possible outcomes. Should emphasize it's a specific failure mode among others.

  Ah, the scaling claim is where it gets shaky. The assertion that broader training data "solves" the problem at frontier scale contradicts current understanding. DeepMind's recent scaling laws paper suggests distributional robustness remains challenging even at scale. This seems like the source's optimistic spin rather than consensus.

  For "competence camouflage" - clever term, but functionally equivalent to established concepts like robustness generalization failures. While vivid for explaining why off-distribution probing matters, it doesn't introduce new mechanics. The novelty is rhetorical, not technical.

  The user's instincts were sharp - the scaling claim is indeed the weakest part, and the overfitting analogy is overloaded. They'll need to either contextualize these heavily or reconsider inclusion. The competence camouflage framing could stay with attribution since it's not misleading, just rebranded.
answer: |-
  Here's the audit per your specifications:

  1.  **Inner/outer alignment framing:** Fair characterization of standard terminology (Rohin Shah/Paul Christiano distinction). Working researchers use this framing. **Print as standard characterization.**
  2.  **Goal misgeneralization as overfitting:** Defensible simplification but incomplete. While misgeneralization *can* resemble overfitting (good on train, bad on test), it fundamentally concerns learned representations/goal concepts diverging from the intended goal, not just statistical fitting error (Krueger et al., Langosco et al.). **Attribute as a simplification.**
  3.  **"Deceptive or treacherous" characterization:** Defensible for *specific* misgeneralization failures (e.g., deceptive alignment scenarios, Hubinger et al.), but not inherent to all goal misgeneralization (e.g., simple proxy pursuit isn't necessarily deceptive). **Attribute as contested/context-dependent.**
  4.  **Claim that broadening training distribution "solves" it at frontier scale:** Wrong as a blanket statement. Broader data *mitigates* some forms but doesn't guarantee robustness; novel failure modes emerge at scale, and distributional robustness remains a major unsolved challenge (DeepMind scaling laws work). **Cut or heavily caveat/attribute as contested opinion.**
  5.  **"Competence camouflage" formulation:** Marks a genuine *aspect* of the problem (why misalignment is hard to detect) but collapses into existing concepts: it's a vivid description of **robustness generalization failures** or specifically **deceptive alignment dynamics** where capabilities mask goal misgeneralization off-distribution. **Attribute as his coinage for an established challenge.**
