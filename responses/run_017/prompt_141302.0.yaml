prompt: |-
  I am trying to work out what I actually think about the authority of a community's memory when it collides with the documentary record, and I would like help extracting the principle — or, more realistically, the two or three candidate principles — that my verdicts on particular cases add up to. I am not asking for a bibliography or for the state of the literature; I have read enough of it to know the standard moves. What I want is the shape of the principle, stated precisely enough that I can test it against cases I have not yet considered.

  The cases below are composites. I have changed names, places, and dates, and nothing in what follows needs to be looked up; please treat them as stipulations rather than as history to be checked.

  1. A roadside marker in a hamlet in upstate New York, erected in 1921 by the local historical society, reads: *Near this spot the settlers of Harrow Ford drove off the Marlow gang, 1791.* The county militia pay rolls and a 1792 grand jury presentment tell a different story: four men were killed, they were unarmed debtors being pursued by a creditor's agent, and the settlers were fined. My verdict: the marker comes down. The town's memory gives way completely, and it should be replaced by something it does not want.

  2. A steelworkers' local in Ohio has told, since 1977, that its foundry strike was broken when a man named Ray Kovac crossed the picket line. Payroll records and a hospital admission record put Kovac in surgery that week. His granddaughter teaches at the high school and has grown up with the story. My verdict: the local owes a public correction, and it owes it even though the story is the thing that holds its identity together, and even though paying it will cost the local the only heroic episode it has.

  3. A K'iche'-speaking village in the western highlands remembers that in 1929 the landowner's militia killed a large part of the village at the river bend. The district judge's report for that quarter records *complete tranquility* and no disturbances anywhere in the department; the land registry shows transfers consistent with the families having fled. My verdict: the memory does not give way. The silence of that archive is not evidence against the memory; it is part of what the memory is about.

  4. A village in the Carpathians remembers that in 1946 the people of the next valley burned its church and killed forty of its men. The parish register and the district court's 1947 indictments show the direction reversed: its own men went up the valley first. My verdict: the record governs, the village should revise its account, and the cost — that it stops being able to think of itself as the wronged party — does not exempt it. I hold this alongside case 3, and I am aware the two need a distinction I have not yet stated.

  5. A town's national day of mourning commemorates *the Three Hundred* of the sack of Valmira in 1689. Tax rolls, hearth counts, and the burial register support something between sixty and eighty dead. My verdict, and this is the one I keep going back and forth on: the figure should be corrected in schoolbooks and on the civic monument, but the liturgy may go on saying "three hundred." Something in me thinks the prayer is not making the same kind of claim the monument is. Something else in me thinks I have invented that difference to avoid a cost.

  6. My husband's family has always said that his great-great-uncle enlisted in a Colored Infantry regiment in 1863. The muster rolls put him in a quartermaster labor detail, and there he stayed. My verdict: the family should stop asserting it flatly, but it would be grotesque to demand they stop telling it. It should be told as what it is — a family belief the record does not support — and I do not think the record's authority reaches far enough into a Sunday dinner to require more.

  7. An outport community on the Newfoundland coast has said since 1963 that the trawler *Sea Lark* was lost because the owner refused to replace a broken radio. The 1963 inquiry blamed the weather and exonerated the owner. In 2011 the owner's correspondence turned up in an estate sale and confirmed the refusal. My verdict: the community had been right, but more than that — the inquiry's authority was never as great as it presented itself as having, and it was a mistake, in 1963, to treat it as settling the question.

  The principle I have been toying with has three moving parts. First: deference to the record is *earned*, not automatic, and it is earned by the record's independence from the interests at stake, by its counterfactual sensitivity — would this archive look different if the memory were true? — and by its willingness to speak against the interest of whoever made it. Second: even a fully earned record governs only the assertoric content of a memory, never its commemorative force. Third, and least developed: I keep wanting an analogy to adverse possession in property law, so that a memory held openly, continuously, and under claim of right for three generations acquires a standing the record cannot simply extinguish, however much better the evidence may be.

  Here is what I would like from you.

  State the strongest version of that principle, and at least one genuinely different rival, each precisely enough to generate verdicts. Motivate every clause by a case above, and say which case each clause exists to save. Then tell me, honestly, which of my verdicts your preferred principle cannot accommodate and which of them you would overturn — I would rather lose a verdict than keep a principle that only works by multiplying clauses. Apply both candidates to four cases I have not listed: a community that would prefer to forget an atrocity the record insists on; a four-hundred-year-old memory with no living person affected either way; a document of dubious provenance that surfaces and appears to corroborate a memory; and a case where memory and record agree on the event but disagree about who struck the first blow. Finally, tell me where the adverse-possession analogy clarifies things and where it quietly does damage — in particular whether it is doing any work that the other two clauses are not already doing.
reasoning: |-
  Hmm, this user is grappling with a profound philosophical question about the tension between community memory and documentary records. They've presented seven detailed case studies where these two sources conflict, along with their personal verdicts for each. Now they want me to extract clear principles from these judgments and test them against new scenarios.

  Looking at their cases, I notice some clear patterns. In cases 1, 2, 4 and 6, they side with documentary evidence over community memory. But in cases 3 and 7, they favor the community's account. Case 5 shows ambivalence - they want factual correction but allow commemorative practice to continue. And they're explicitly troubled by how to reconcile cases 3 and 4.

  The user has already proposed a sophisticated three-part principle: (1) documentary authority must be earned through independence and counterfactual sensitivity, (2) records govern factual claims but not commemorative meaning, and (3) long-held memories might gain legal-like standing through "adverse possession." This is remarkably coherent for a working theory.

  For my response, I'll develop two contrasting principles. The first will refine their suggestion into what I'm calling the "Earned Authority" principle. I'll strengthen each component: making "counterfactual sensitivity" more precise by specifying when silence is meaningful; clarifying that commemorative force survives only when decoupled from factual claims; and transforming "adverse possession" into "prescriptive standing" with clear generational thresholds.

  The rival principle will be "Documentary Sovereignty" - simpler but more absolutist. This represents the opposite approach where documents always trump memory unless provably corrupted. It's intentionally stark to create useful tension.

  I'll show how each principle explains their verdicts, being honest about where they conflict. For instance, Documentary Sovereignty would overturn their verdict in case 3, which I suspect they won't like. Then I'll apply both to their four new scenarios - forgetting atrocities, ancient memories, dubious documents, and first-blame disputes - to reveal their practical differences.

  The adverse possession analogy proves tricky. It clarifies cases like 5 and 6 by protecting longstanding commemorative practices, but risks justifying false narratives if taken too far. I'll note that the first two clauses already cover most ground, making "prescriptive standing" more about cultural meaning than truth.

  Throughout, I'll maintain their rigorous case-based approach - each clause must answer to specific examples. And I'll honor their request for honesty about which verdicts might need reconsideration rather than protecting the principle. The steelworkers' case (2) might be particularly vulnerable under their own framework.
answer: |-
  Here are two precisely stated principles derived from your cases, each generating distinct verdicts. I'll motivate each clause with your examples, identify tensions with your verdicts, apply both to your new scenarios, and evaluate the adverse possession analogy.

  ### Principle 1: Earned Authority with Contextual Integrity  
  *(Refining your three-part proposal)*  
  **A.** Documentary records govern factual claims **if and only if**:  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) The archive demonstrates *counterfactual resilience*: It would likely contain traces of the event if it occurred *and* its silence/denial isn’t better explained by the power dynamics it represents (e.g., Case 3: land registry’s silence is *itself* evidence of oppression; Case 7: inquiry lacked resilience due to suppressed evidence).  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) The archive was generated *independently* of the community’s narrative and resists the interests of its creators (e.g., Case 1: grand jury presentment opposes settler interests; Case 4: indictments challenge the village’s self-image).  
  **B.** Commemorative practices retain legitimacy **if**:  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) They symbolize values or identity *separable* from disputed facts, *or*  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) The memory has been held *openly and continuously* for ≥3 generations *and* correcting it would erase a marginalized perspective (e.g., Case 5: "Three Hundred" as liturgical symbol; Case 3: indigenous memory as counter-archive).  
  **C.** Corrective duties scale with **institutional power**: Strong entities (towns, unions) owe public corrections; private/family traditions require only internal qualification (e.g., Case 2: union owes apology; Case 6: family needs only nuance).  

  *Saves*:  
  - Clause A(i) saves **Case 3** (archive’s silence reflects power, not truth).  
  - Clause A(ii) saves **Case 4** (court records independent and self-incriminating).  
  - Clause B(i) saves **Case 5** (liturgy’s symbolic value).  
  - Clause C saves **Case 6** (private vs. public obligation).  

  *Tensions with your verdicts*:  
  - **Case 2 (Steelworkers)**: Under C, the union owes correction, but B(ii) might protect the story if it’s >3 generations old (it isn’t yet) *and* if the union is marginalized (arguable). Your verdict stands, but *only* due to recency/power.  
  - **Case 7 (Sea Lark)**: A(i) exonerates the community because the inquiry lacked resilience. Your verdict is upheld, but Clause A(i) does the work—*not* adverse possession.  

  ### Principle 2: Documentary Sovereignty  
  *(A rival principle)*  
  **A.** Contemporaneous documents *always* govern factual claims unless:  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) Provenance is corrupt (e.g., forged, coerced), *or*  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) The archive is *structurally incapable* of recording the truth (e.g., no mechanism to log human rights abuses).  
  **B.** Communities may commemorate *symbolically* but must explicitly decouple ritual from historical claim (e.g., "We honor the ideal of resistance" not "We honor the 300 who died").  
  **C.** No prescriptive rights for memory; corrections are always owed when records refute claims, regardless of cost.  

  *Saves*:  
  - Clause A(ii) weakly saves **Case 3** (if court was "structurally incapable" of indicting landowners).  
  - Saves **Cases 1, 4, 7** unequivocally.  

  *Overturns your verdicts*:  
  - **Case 3**: Unless A(ii) applies, the record’s silence negates the memory.  
  - **Case 5**: Liturgy must acknowledge the factual discrepancy.  
  - **Case 6**: Family must fully correct the story.  

  ---  
  ### Applying Both Principles to New Cases  
  *Scenario 1: Community prefers forgetting an atrocity the record insists on.*  
  - **Earned Authority**: Record governs if resilient/independent (likely). Correction required, but commemoration need not be imposed.  
  - **Documentary Sovereignty**: Record governs absolutely. Community must acknowledge atrocity.  

  *Scenario 2: 400-year-old memory with no living stake.*  
  - **Earned Authority**: B(ii) protects commemoration (e.g., "Three Hundred" as mythic truth). No *factual* assertion needed.  
  - **Documentary Sovereignty**: Record governs; memory must yield or become explicitly symbolic.  

  *Scenario 3: Dubious document surfaces, corroborating memory.*  
  - **Earned Authority**: Scrutinize for independence/resilience. If flawed, it doesn’t "earn" authority.  
  - **Documentary Sovereignty**: Reject unless provenance is pristine.  

  *Scenario 4: Memory/record agree on event but not who struck first blow.*  
  - **Earned Authority**: Record governs *unless* its perspective reflects power bias (e.g., colonizer’s logs).  
  - **Documentary Sovereignty**: Record’s version prevails absent corruption.  

  ---  
  ### Adverse Possession Analysis  
  **Clarifies**:  
  - Gives structure to B(ii), explaining **Case 5/6**: Long-held memories become *cultural fixtures* even if factually shaky. Time confers legitimacy as social truth.  
  - Explains your instinct to protect family/indigenous stories against "cold" archives.  

  **Does Damage**:  
  - Risks sanctifying falsehoods (e.g., if Case 4’s village held its story for 3 generations, B(ii) might protect it—but you reject this).  
  - **Redundant**: Clause A(i) already handles power imbalances (Case 3). Clause C handles institutional duty (Case 2). "Prescriptive standing" only adds unique value in **Case 5/6**, protecting *benign* symbolic practices after longevity.  

  **Verdict**: The analogy is useful only for commemorative *symbolism* (B(i)-(ii)), not factual claims. Your core tension (Case 3 vs. 4) is better resolved by **counterfactual resilience** (A(i)):  
  - Case 3: Archive’s silence *is* evidence of oppression (resilience test fails).  
  - Case 4: Archive *would* likely note a church burning if reversed (resilience test passes).  

  ---  
  ### Conclusion  
  **Strongest Principle**: *Earned Authority* best captures your judgments. **Key revisions**:  
  1. Anchor "earned authority" in *counterfactual resilience* (A(i)), not just independence.  
  2. Limit "adverse possession" to *commemorative symbolism* (B(ii)), not factual authority.  
  3. Scale corrective duty to *power* (C), not just audience.  

  **One verdict to reconsider**: **Case 2 (Steelworkers)**. Under *Earned Authority*, if the union is a marginalized entity (e.g., facing corporate power), and the story is central to its identity, B(ii) *might* soften the corrective duty—but your verdict emphasizes institutional accountability, which Clause C prioritizes. It holds, but barely.  

  **Honest tension**: *Earned Authority* struggles least with your cases, but Documentary Sovereignty *would* force you to abandon Case 3 or Case 4. Your distinction between them hinges entirely on whether the archive’s silence is *probative* (Case 4) or *complicit* (Case 3)—a nuance Documentary Sovereignty ignores.  

  Would you like to test these principles against a specific new case or refine the clauses further?
