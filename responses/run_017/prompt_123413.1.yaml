prompt: |-
  hi — I work in a tiny unit that vets draft policy papers and ministerial speeches before they go out, and honestly about a third of what we end up flagging is a historical analogy. At the moment the flagging is just whoever's on duty going "hmm, that feels loaded", which isn't great when one line in a speech gets quoted for the next decade. So I want an actual procedure.

  What we have to work with: the draft text only, no research time (call it fifteen minutes per review, sometimes five), reviewers who studied politics or law rather than history, and a unit head who signs off with one of four stamps — green (fine as illustration), amber (usable, but the disanalogy has to be named in the same sentence), red (cut), and a fourth one we've started using: strip, meaning kill the historical frame but keep whatever claim it was carrying.

  Some distinctions we use informally and that I'd like either sharpened or thrown out: the carrier (the surface story of the episode) versus the payload (what the analogy is actually doing — predicting, legitimating, allocating blame, or just adding colour); analogies that transfer a mechanism versus ones that transfer an outcome; the mirror test, i.e. when the same episode is routinely wheeled out for the opposite lesson (Vietnam both as "don't intervene" and as "don't half-commit"), which makes me think it isn't doing any inferential work at all; and what I call the birth-date problem, that a lot of the famous lessons were coined afterwards by people with an axe to grind about their own record.

  So: write me the procedure. The questions in order, what counts as a sufficent answer to each, where it terminates in red versus strip, and where it has to hand the decision to a person because the remaining question is about values or risk appetite rather than facts. Ground it in whatever is genuinely known about analogical reasoning — relevant versus superficial similarity, reference classes and base rates, whether a causal mechanism has actually been stated, the fact that invoking an analogy can itself change what the players then do — but no citations and no reading lists, I need something my team can run off the page.

  Then run it on three things on my desk right now:

  1. "This is our Munich moment — any concession on tariffs will only whet their appetite." From a speech on a trade deal.
  2. A paper arguing that the US and China are caught in a Thucydides trap, so we should assume a high baseline probability of war this decade and plan accordingly.
  3. My own favourite, which I suspect definately won't survive: a note saying the current cyber escalation is like July 1914 in that nobody actually wants the big war, so we have far more room to de-escalate than people think.

  Give me the margin note my reviewer would write for each, including at least one stamp I won't like — don't soften it. Finish by saying plainly what the procedure can't do. British English please, and keep the jargon light: this is going into a style guide for non-specialists.

  cheers
reasoning: |-
  Okay, the user works in a policy vetting unit that flags problematic historical analogies in draft documents. They need a clear, step-by-step procedure that their team—mostly non-historians—can apply quickly during reviews. The key constraints are tight time limits (5-15 minutes per review), no research time, and four possible outcomes: green, amber, red, or strip. 

  The user mentioned several informal distinctions their team uses (carrier vs payload, mechanism vs outcome, mirror test, birth-date problem), so the procedure should formalize the useful ones and discard the rest. The core challenge is balancing historical accuracy with policy pragmatism—they need to catch misleading analogies without overburdening reviewers.

  Hmm, the user’s examples reveal classic pitfalls: Munich (overused, misapplied), Thucydides Trap (deterministic framing), and July 1914 (false equivalence in cyber context). They’re clearly frustrated by "loaded" analogies haunting speeches for years—this suggests the procedure must prioritize preventing high-profile blunders. 

  The procedure should mirror cognitive psychology principles (superficial vs structural similarity, reference classes) but stay jargon-free. It needs clear off-ramps: terminate early if an analogy fails basic checks (e.g., mirror test or key difference check), and escalate only when value judgments are needed (e.g., "is this risk acceptable?"). 

  For the three examples: 
  - Munich gets red: it’s not just flawed but actively dangerous due to oversimplification. 
  - Thucydides Trap gets amber: the mechanism is plausible but needs caveats about determinism. 
  - July 1914 gets strip: the cyber escalation point might be valid, but the historical framing adds nothing. 

  The biggest gap? The procedure can’t assess whether an analogy is rhetorically effective—only whether it’s historically defensible. Also, without research, it might miss niche historical errors, but that’s a necessary trade-off for speed. 

  Final touch: British English, no citations, and margin notes must be blunt. The user wants "at least one stamp I won’t like"—Munich’s red stamp should sting.
answer: |-
  Here's a vetting procedure for historical analogies, designed for speed and clarity, grounded in known pitfalls of analogical reasoning. Keep it by your screens:

  **Procedure: Historical Analogy Vetting (HAV)**

  1.  **What's the PAYLOAD?** (What job is the analogy doing?)
      *   *Check:* Is it primarily **illustrating** (adding colour), **predicting** (claiming X will happen), **legitimising** (making action Y seem right/normal), **assigning blame/responsibility**, or **implying a mechanism** (saying process Z will repeat)?
      *   *Sufficient Answer:* Clearly state the payload (e.g., "Predicting that concessions lead to more demands"). If *just* illustration, proceed carefully. **Terminate to GREEN only if *pure* illustration AND uncontroversial/harmless.** Otherwise, proceed.

  2.  **MIRROR TEST:** Is this exact historical episode routinely used to argue the *opposite* point?
      *   *Check:* Common offenders: Vietnam (intervention vs. half-measures), Appeasement/Munich (weakness vs. buying time), Roman Empire (decadence vs. overextension).
      *   *Sufficient Answer:* Yes or No. **If YES: Terminate to RED or STRIP (see Step 4).** The analogy is too contested to reliably carry inferential weight. Proceed if NO.

  3.  **KEY DIFFERENCE CHECK:** What is the *one* most critical difference between the historical event and the current situation that might break the analogy?
      *   *Check:* Ignore superficial differences (e.g., technology, names). Focus on core drivers: motivations of key actors, power structures, institutional context, available information, cultural norms, or the specific mechanism involved.
      *   *Sufficient Answer:* Identify *one* plausible, fundamental difference relevant to the payload (e.g., "1938 Nazis had explicit expansionist ideology; current trade partner's aims are economic, not territorial conquest").
      *   *Hand-off:* If no obvious critical difference emerges quickly, proceed. If one is found, note it – it drives the next step.

  4.  **MECHANISM vs. OUTCOME / PAYLOAD TEST:**
      *   *Check A (Mechanism):* If the payload is **predicting** or **implying a mechanism**, has a *specific causal mechanism* linking the past event to the prediction been stated *or* is it genuinely obvious and uncontested? (e.g., "Concessions interpreted as weakness, emboldening aggressors").
          *   *Sufficient Answer:* Yes (mechanism stated/obvious & plausible) OR No (mechanism vague, assumed, or disputed).
          *   *Action:* **If NO: Terminate to AMBER (must name disanalogy) or STRIP.** The prediction lacks a clear causal basis.
      *   *Check B (Outcome/Legitimising/Blame):* If the payload is **legitimising, assigning blame, or predicting a specific outcome** (without a clear mechanism): Is the claimed similarity *structural* (core dynamics) or just *superficial/situational* (surface details)?
          *   *Sufficient Answer:* Structural (core drivers match) OR Superficial (just surface events resemble).
          *   *Action:* **If SUPERFICIAL: Terminate to AMBER (must name disanalogy) or STRIP.** Superficial similarity is misleading for these payloads.

  5.  **BIRTH-DATE PROBLEM:** Is the "lesson" being drawn one that emerged *long after* the event, primarily pushed by actors justifying their own later actions/views?
      *   *Check:* Common offenders: "Domino Theory" (post-Vietnam justification), rigid "Thucydides Trap" (modern framing of ancient history), "Munich = Always Appease Bad".
      *   *Sufficient Answer:* Likely Yes or No (use common sense/historical knowledge - e.g., "The 'lesson' of Munich as *always* don't concede solidified post-WW2, not in 1938").
      *   *Action:* **If LIKELY YES: Strongly consider AMBER (must name this is a contested *interpretation*) or STRIP.** Reduces historical determinism.

  6.  **CURRENT CONTAGION RISK:** Could *using* this analogy publicly change how other actors behave, potentially making the situation *worse*? (e.g., invoking WW1 escalation might make actors *more* jumpy).
      *   *Check:* Does the analogy frame the situation as inherently unstable, zero-sum, or doomed? Could it be seen as provocative or fatalistic?
      *   *Sufficient Answer:* Plausible Risk or Unlikely.
      *   *Hand-off:* **This is VALUES/RISK APPETITE.** Reviewer flags the plausible risk ("Invoking July 1914 may increase perceived stakes, making de-escalation harder"). **Unit Head decides AMBER (accept risk), RED (risk too high), or STRIP (keep point, ditch loaded frame).**

  **Decision Flow Summary:**
  *   **GREEN:** Only for pure, harmless illustration passing Mirror Test.
  *   **AMBER:** Analogy *can* be used, but **must explicitly name the key disanalogy** (from Step 3) *in the same sentence/paragraph*. Mandatory for: Superficial similarity (Step 4B), Birth-Date problems (Step 5), or if Mechanism is weak but acceptable (Step 4A).
  *   **RED:** Terminate early (Mirror Test fail). Or: Mechanism missing for prediction (Step 4A - if not stripped), Superficial similarity used for heavy lifting (Step 4B - if not stripped), or Unit Head judges Contagion Risk (Step 6) too high.
  *   **STRIP:** Keep the underlying point (e.g., "We must be firm on tariffs" / "War risk is elevated" / "We have room to de-escalate") but **remove the historical framing entirely.** Use when analogy is flawed (Mirror Test, Key Difference, Mechanism, Superficiality, Birth-Date) but the core point is valid and doesn't rely *solely* on the history.

  **What the Procedure CAN'T Do:**
  1.  Guarantee historical accuracy for obscure events (no research time).
  2.  Judge if an analogy is *rhetorically effective* (only if it's *historically defensible* and *logically sound*).
  3.  Resolve deep historical debates – it flags contested interpretations (Mirror Test, Birth-Date) forcing explicit acknowledgement (Amber) or removal (Strip/Red).
  4.  Make the value judgment on Contagion Risk (Step 6) – that's the Unit Head's call.

  ---

  **Margin Notes for Your Examples:**

  1.  **"This is our Munich moment..."**
      *   *Payload:* Predicting (concessions whet appetite) & Legitimising (firm stance).
      *   *Mirror Test:* **YES.** Routinely used both ways. *Margin: "MIRROR TEST FAIL. Red/Strip. (Payload: Predict/Legitimise. Overused, contested lesson.)"*
      *   *Decision:* **RED.** (Strip possible if core point "Be firm on tariffs" is kept, but analogy itself is toxic and unreliable).

  2.  **US/China in Thucydides Trap...**
      *   *Payload:* Predicting (high baseline probability of war).
      *   *Mirror Test:* NO (specific opposite lesson less common).
      *   *Key Difference:* Many possible (Nuclear deterrence? Globalised economy? Nature of "war"?). *Margin: "Key Difference: Nuclear deterrence absent in ancient Greece. Mechanism implied but contested."*
      *   *Mechanism:* Implied (rising power vs. established power -> war) but **not stated explicitly and heavily contested/deterministic.** *Margin: "Mechanism weak/contested for prediction. Birth-Date Problem: Modern deterministic framing."*
      *   *Birth-Date:* **YES.** Modern popularisation/oversimplification. *Margin: See above.*
      *   *Contagion Risk:* Plausible (could frame relationship as inherently conflictual). *Margin: "Contagion Risk: May reinforce fatalism. Flag for UH."*
      *   *Decision:* **AMBER (Mandatory: Name disanalogies - e.g., nuclear deterrence, economic interdependence - & note contested nature of 'trap').** OR **STRIP** to "Assume elevated war risk due to power transition tensions".

  3.  **Cyber escalation like July 1914...**
      *   *Payload:* Predicting (More room to de-escalate exists).
      *   *Mirror Test:* NO (Not usually used for *this* specific point, though 1914 causes debated).
      *   *Key Difference:* **Fundamental.** *Margin: "CRITICAL DIFFERENCE: July 1914 featured rapid, binding military mobilisation cascades; cyber allows pauses, rewinds, anonymous actions. Core mechanisms vastly different."*
      *   *Mechanism:* Implied (unwanted escalation due to complex systems) but **invalidated by Key Difference.** *Margin: "Mechanism transfer invalid - mobilisation vs. cyber ops not analogous."*
      *   *Superficiality Check:* **SUPERFICIAL.** Resembles "unwanted escalation" surface, not structure. *Margin: "Superficial similarity only. Unsuitable for prediction payload."*
      *   *Contagion Risk:* Plausible (Invoking 1914 might *increase* perceived escalation risk). *Margin: "Contagion Risk: Invoking 1914 could heighten tension. Flag for UH."*
      *   *Decision:* **STRIP.** The core point "We have more room to de-escalate than people think" about cyber *might* be valid on its own merits, but the July 1914 frame is deeply misleading and adds no reliable support. (Could also be **AMBER** with massive caveats, but **STRIP** is cleaner). **Unit Head might consider RED** if they think the core point *also* lacks merit without the analogy.

  ---
  **Final Stamp You Won't Like:** Example 1 gets a firm **RED.** Munich is the unit vector of bad historical analogy – overused, misapplied, and carrying too much dangerous baggage. Letting it through risks the exact decade-long quoting nightmare you fear. Strip the frame and let "any concession on tariffs will only whet their appetite" stand or fall on its *current* merits. Good luck!
