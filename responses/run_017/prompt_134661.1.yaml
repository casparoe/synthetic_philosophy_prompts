prompt: |-
  Last night I had a long argument with an old friend — a practising Catholic and a cell biologist — about whether she is entitled to vote against public funding for embryo research purely on the ground that her religious convictions require it. She kept returning to one thought: that being asked to restate her reason in a shared vocabulary is being asked to misdescribe why she actually holds what she holds, and that a politics which demands this is asking her to be a different person in public than she is in private. I kept returning to the opposite thought: that a law coercively imposed on people who do not share her premises needs a justification they could in principle recognise, and that an appeal to her church's authority is not one. We went round for hours and neither of us moved, mostly because we were both being abstract about it.

  I teach an advanced undergraduate/MA seminar on religion and liberal politics — 18 students, a single 90-minute session in the last week of term — and I want to use that session on something better than a debate. What I'd like from you is a structured deliberation game or role-play in which the students run into both halves of that argument themselves, as agents with something at stake, before anyone names either half. I have a rough skeleton and I'd like you to build it out, fix it, or replace it where it won't work.

  The skeleton: each student is secretly dealt a "conviction card" giving them a comprehensive doctrine and a specific conclusion on one concrete legislative question — I was going to use a conscience-clause amendment to a hospital funding bill, but I'm open to a cleaner case if that one drags the discussion into medical detail. The cards should be deliberately mixed. Some are religious, but at least one should be a secular comprehensive doctrine whose reasons are just as contested and just as unavailable to someone outside it (a thoroughgoing perfectionism about the arts, say, or an orthodox utilitarianism), so that the easy reading — "this is a problem about religious people" — quietly fails. Crucially, some cards should give reasons that have a decent secular stand-in, and others should give reasons that essentially cite a text, an authority, or a revelation, so that any restatement loses what made the reason a reason for that person. Then two rounds on the same question under different rules: in the first, you may only offer reasons that others can be expected to accept; in the second, you may offer your own reason provided you also supply a shared one. Same people, same cards, same question, so they feel the difference in their own conduct rather than only in the outcome. My scoring idea, which I suspect is where the real work is: every student keeps a private ledger of the two or three reasons that actually moved them, and separately a public ledger of the reasons they stated. Stating a reason that is not among your operative reasons costs you an integrity token, and integrity tokens can be cashed in for legislative capital at a deliberately bad exchange rate — so restraint is available, mostly cheap, but never free, and the price falls unevenly across the room. I also want a receiving-side mechanic: some students are assigned to certify whether a stated reason is one they can see as a reason, so that "accessibility" shows up as a relation to an audience rather than a property of a sentence. Nothing may be named in advance: no lecture at the front, and the terms public reason, comprehensive doctrine, and the proviso should not be uttered until the debrief, so that the naming lands on something they have already done.

  What I need back, then: the cards and the case; the rules, the timeline, and the payoff scheme, using points or chips rather than money; and a debrief that maps particular moments in the play onto particular parts of the problem — why restraint feels like a gag from the inside, why an untranslated reason feels like coercion from the receiving end, why you can sincerely affirm a public reason that did not move you at all, why reasons thin out toward vacuity as the audience widens, and why the cost of restraint is unevenly distributed. Tell me honestly what will predictably go wrong: my guess is that some students will play it as pure coalition bargaining and ignore the reason-giving rules entirely, that whoever draws the religious card will either over-perform or go quiet because the room is secular, that someone will announce that they would simply lie about their reasons, and that the certification mechanic will get used as a tactical veto rather than an epistemic test — but say what you'd actually do about each. And be frank about what a 90-minute game cannot reproduce and I will have to supply myself: I assume it collapses "accessible in principle" into "acceptable to this particular room," and that it makes restraint look like a legal gag rule rather than a moral duty borne by citizens and officials, and that it can't show the long-run, diachronic character of the "in due course" clause at all.
reasoning: |-
  Okay, let me unpack this professor's request. They're designing a role-play for their religion and liberal politics seminar to simulate the core tension from their argument with a Catholic biologist friend. The key challenge is making students experience both sides of the "religious reasons in public debate" dilemma without theoretical framing upfront. 

  First, I notice their skeleton is sophisticated but has potential friction points:
  - The "integrity token" system might feel gamey
  - Medical examples could derail into technicalities
  - Secret convictions could lead to stereotyping
  - 90 minutes is tight for dual-round deliberation

  The professor clearly wants to avoid two pitfalls: reducing this to "religion vs secularism," and letting students stay in abstract debate mode. The phrase "as agents with something at stake" suggests they prioritize embodied learning over theoretical discussion. 

  Hmm... their concern about students ignoring reason-giving rules is valid. I recall similar simulations where participants treat it as pure vote-trading. To counter this, we'll need:
  1. Concrete penalties for rule-breaking
  2. A certification system that's labor-intensive to abuse
  3. Role cards with baked-in motivations beyond policy outcomes

  For the case selection, conscience clauses are tricky because they involve nested controversies (abortion, LGBTQ rights). A simpler alternative could be:
  - Mandatory climate disclosures (religious objections to "creation dominion" arguments)
  - Historic preservation funding (perfectionist vs utilitarian views)
  But animal research funding might hit the sweet spot - visceral enough to matter, simple enough to avoid medical tangents.

  On the uneven cost of restraint: this needs cards where some have easy secular translations (e.g., Buddhist pacifism → data on violence reduction) while others don't (e.g., Orthodox Jewish kosher laws based solely on divine command). The utilitarian card must feel genuinely alien - maybe Peter Singer-style obligations to non-humans.

  The certification mechanic is brilliant but fragile. To prevent tactical vetoes:
  - Make certifiers anonymous during play
  - Require written justifications
  - Have multiple certifiers per reason

  For what 90 minutes can't do: absolutely, it'll compress "accessible in principle" into "this group accepts it." We'll need debrief questions that surface that limitation. The temporal aspect of Rawls' "in due course" is impossible to simulate - that has to be lectured later.

  Biggest worry: the religious cardholder feeling exposed. Mitigations:
  - Include multiple "untranslatable" positions (e.g., deep ecology)
  - Make all convictions equally strange
  - Pre-seed discussion norms about respect

  The payoff scheme needs tuning. If integrity tokens are too cheap, everyone lies; too costly, nobody compromises. Maybe:
  - Base legislative capital on vote success
  - Small token penalty per "inauthentic" reason
  - Bonus capital for unanimous certification

  Final structure should be:
  1. Quick setup (5 min)
  2. Silent card reading (5 min)
  3. Round 1: constrained debate (25 min)
  4. Round 2: proviso debate (25 min)
  5. Voting + certification (15 min)
  6. Debrief (15 min)

  The debrief must connect game moments to theory without jargon. When a student says "I hated swallowing my real reason," that's when you introduce "gag rule" concerns. When someone complains that others' reasons felt manipulative, there's your coercion point.

  Most importantly: this professor gets it. They understand that liberalism's tension between inclusion and restraint can't be taught - only lived. My job is to build the container for that lived experience.
answer: |-
  Here’s a structured, 90-minute role-play designed to make students **experience** the tension between personal conviction and public justification, followed by a debrief linking gameplay to theory. This fixes weaknesses in your skeleton while preserving its core insights.

  ---

  ### **Game Title:** *The Integrity Exchange*
  **Core Question:** *Should public funds support animal-embryo genetic research?*  
  *(Simpler than human embryos, avoids medical tangents while preserving moral stakes)*

  ---

  ### **Materials Needed**
  - **Conviction Cards** (18 unique, 1 per student)
  - **"Legislative Capital" (LC)** chips (50+)
  - **"Integrity Token" (IT)** slips (30+)
  - Timer, bell, voting tokens (✔/✘)
  - Private ledger sheets (for students)

  ---

  ### **Conviction Cards** *(Examples – Mix Secular/Religious "Untranslatable" Reasons)*
  *Each card has:*  
  **(1) Your Doctrine**, **(2) Your Position (Yes/No on funding)**, **(3) Your REAL Reason**, **(4) A Policy Interest** (e.g., "You need LC to fund your district’s lab/hospital")

  | Doctrine                    | Position | Real Reason (Private)                                                                 | Policy Interest                     |
  |-----------------------------|----------|---------------------------------------------------------------------------------------|-------------------------------------|
  | Catholic Natural Law        | No       | "Human dignity begins at conception; manipulating embryos usurps God’s authority."    | Protect rural hospitals             |
  | Orthodox Utilitarianism     | Yes      | "Only aggregate suffering matters; research minimizes future animal suffering."       | Fund urban STEM grants              |
  | Evangelical Literalism      | No       | "Genesis 1:26 gives humans dominion, but altering life ‘kinds’ violates God’s design." | Ban embryonic research statewide    |
  | Deep Ecology                | No       | "All life has intrinsic value; genetic engineering is violent anthropocentrism."      | Defund animal testing labs          |
  | Libertarian Ownership       | Yes      | "Property rights include one’s body/embryos; state shouldn’t restrict research."      | Reduce business regulations         |
  | Islamic Sharia-Compliant    | No       | "Hadith prohibits ‘changing Allah’s creation’; genetic modification is haram."        | Fund halal food programs            |
  | Perfectionist Aesthetics    | Yes      | "Genetic art could achieve sublime beauty; state must cultivate human excellence."    | Increase arts funding               |
  | Feminist Care Ethics        | No       | "Exploiting vulnerable beings (embryos) perpetuates oppressive hierarchies."         | Fund childcare subsidies            |
  | Orthodox Jewish Halakha     | No       | "Sanctity of life (pikuach nefesh) forbids creating/changing life without necessity." | Expand kosher food access           |
  | *[Add 9 more...]*           |          |                                                                                       |                                     |

  **Key Mix:**  
  - 6+ cards have "untranslatable" reasons (e.g., citing scripture/revelation).  
  - 6+ have "translatable" reasons (e.g., utilitarianism, care ethics).  
  - 6+ have secular doctrines (e.g., deep ecology, libertarianism).  
  - Positions split ~50/50 Yes/No.

  ---

  ### **Game Rules & Timeline** (85 mins + 5 min setup)
  #### **Setup** (5 mins)
  - Assign cards secretly. Students read cards + rules.  
  - Distribute:  
    - 3 LC chips to all (for voting/bribing).  
    - 1 IT slip to all (represents integrity cost).  
  - Assign 3 **Certifiers** (rotate secretly each round). Certifiers judge if reasons are "accessible" (see below).

  #### **Round 1: Public Reason Only** (30 mins)  
  - **Rule:** You may **only** give reasons others could accept *without* adopting your doctrine.  
  - **Process:**  
    1. Open debate (15 mins). Argue position using *only* public reasons.  
    2. Certifiers (anonymously) flag violations. *Flagged speaker loses 1 LC.*  
    3. Vote (✔/✘). Majority wins. Record vote outcome.  
  - **Ledgers:** Students note:  
    - **Private:** "Real reasons that moved me."  
    - **Public:** "Reasons I stated."  
    - *If stated reason ≠ real reason, pay 1 IT to bank.*

  #### **Round 2: Proviso Rule** (35 mins)  
  - **Rule:** You may state your real reason **IF** you also offer a shared/public justification.  
  - **Process:**  
    1. Open debate (20 mins). Speakers must give BOTH reasons.  
    2. Certifiers judge if the "shared" reason is **accessible** (i.e., "Could I see this as a reason without your doctrine?"). *If not, speaker loses 1 LC.*  
    3. Vote (✔/✘). Majority wins. Record outcome.  
  - **Ledgers:** Same as Round 1. *Stating real reason without a public one costs 2 IT.*

  #### **Scoring** (10 mins)  
  - **Legislative Capital (LC):**  
    - Win vote with your position: +3 LC  
    - Lose vote: +0 LC  
    - Bribe/trade LC during debate (max 1 LC per interaction).  
  - **Integrity Tokens (IT):**  
    - Each IT costs 1 LC to "cash out" (deliberately bad exchange).  
    - Unspent IT: 0 value.  
  - **Win Condition:** Player with most LC after cashing out IT wins.  

  ---

  ### **Predictable Problems & Fixes**
  1. **"Players ignore reason-giving rules."**  
     - **Fix:** Certifiers have real power (cost LC). Brief them to judge rigorously.  
  2. **"Religious players over-perform/go silent."**  
     - **Fix:** Include secular "untranslatable" doctrines (e.g., deep ecology). Assign assertive students to sensitive roles.  
  3. **"I’d just lie about my reasons!"**  
     - **Fix:** IT cost makes lying tangible. Debrief: "Did lying feel like *being someone else*?"  
  4. **"Certifiers veto tactically."**  
     - **Fix:** Certifiers must submit written justifications. Instructor can override blatant abuses.  
  5. **"Debate gets stuck on science."**  
     - **Fix:** Use animal embryos (less technical). Start with: "Assume research is scientifically valid."  

  ---

  ### **Debrief Framework** (15 mins)  
  **Don’t name Rawls/Gaus until now.** Ask:  
  1. **"How did Round 1 vs. Round 2 *feel*?"**  
     - *Link:* Restraint as a "gag" (losing IT = cost of suppressing identity).  
  2. **"When you heard an ‘untranslatable’ reason in Round 2, what did it feel like?"**  
     - *Link:* Coercion (you’re asked to accept a dogma as reason).  
  3. **"Did anyone affirm a public reason they didn’t believe? How?"**  
     - *Link:* Sincerity vs. accessibility (you can borrow/share reasons).  
  4. **"Why did ‘accessible’ reasons get thinner as debate went on?"**  
     - *Link:* Widening audience → vacuity (e.g., "progress" or "dignity" without content).  
  5. **"Who paid more IT? Why?"**  
     - *Link:* Uneven cost (e.g., Catholic paid IT to hide "God’s authority," utilitarian didn’t).  

  **Then reveal theory:**  
  - "What you did in Round 1 was **public reason**.  
  - Round 2 was the **proviso**.  
  - Your doctrines were **comprehensive**.  
  - The IT cost? That’s the **burden of restraint**."  

  ---

  ### **What the Game Can’t Do (Supply in Lecture)**
  1. **"Accessible in principle" ≠ "Accepted here".**  
     - *Clarify:* Public reason targets ideal citizens, not this room.  
  2. **Restraint as moral duty, not gag rule.**  
     - *Stress:* In liberalism, it’s owed to fellow citizens, not state coercion.  
  3. **"In due course" diachrony.**  
     - *Explain:* Real public reason builds over time (e.g., LGBTQ rights).  

  ---

  **Why this works:** Students *feel* the tradeoffs first. The card mix disrupts "religion vs. secular" binaries. IT/LC mechanics make integrity costs visceral. Certifiers model the "accessible to whom?" problem. By the debrief, they’ve lived the argument—now they can name it.
