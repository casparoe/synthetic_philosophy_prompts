     **What the activity cannot capture:**
     - The first-personal aspect: being the same person twice. In our activity, we have different students representing the same person's awakenings. This is a limitation.
     - The argument that "she already knew she'd be woken, so she learned nothing new" is not directly addressed. We can mention it in the debrief.

