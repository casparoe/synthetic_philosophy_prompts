     **Detailed Timeline:**

     - 0-5 min: Introduction. Explain the setup. Tell them they are one person. Explain the procedure for a round: eyes closed, music, taps, write slip, then collect. Explain that we will run two blocks with different scoring rules.

     - 5-15 min: Block 1 (Per-Trial Scoring)
          - Explain the scoring rule for per-trial.
          - Let them discuss for 2 minutes: what number to report? (They must commit to a number for the round. All woken members will write that number.)
