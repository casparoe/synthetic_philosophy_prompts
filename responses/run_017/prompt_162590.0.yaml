            Tails: tap two -> P(not tapped) = 18/20

            Then P(Tails | not tapped) = [ (18/20) * (1/2) ] / [ (1/2)(19/20) + (1/2)(18/20) ] = (18/40) / (37/40) = 18/37.

          This is close to 1/2 (18/37≈0.486). So the information is minimal. We can do this.

          Revised: one big team of 20 students.

          In each round:
            - Flip coin.
            - If heads, instructor taps one student at random.
            - If tails, instructor taps two students at random (without replacement).

          Each woken student writes a slip. Then we score per the rule.

          The algebra for the optimal report remains the same because the probability for a woken student is still 1/3 for heads? 

          Why? The probability of being woken given heads: 1/20. Given tails: 2/20. So P(Heads | woken) = [ (1/20)*(1/2) ] / [ (1/20)*(1/2) + (2/20)*(1/2) ] = (1/40) / (3/40) = 1/3.

          So the algebra holds. And the scoring rule algebra also holds because we are still having one slip in heads and two in tails.

          Therefore, we change to one big team: the entire class.

          But then we lose the team competition? We can still have a class bank of points and aim for a high score. Or we can not worry about the team aspect and just have one big experiment.

          However, we want teams for the design phase. So we can do:

            - For Phase 1 and 2, the entire class is one team.
            - For Phase 3, split into teams.

          But then the scoring in Phase 1 is for the whole class. We can do that.

     - **Students who know the problem:** They might recognize it. We can recruit them as helpers. Tell them before the activity: "I know some of you might have heard of a problem like this. I ask you to not reveal the name until the debrief. You can participate and help your classmates think through the scoring rules."

     - **Time:** The timeline might be tight. We have 75 minutes. We might skip Phase 3 if time runs short.

     **Materials:**
     - Coin
     - Phone for music
     - Slips of paper and boxes for slips
