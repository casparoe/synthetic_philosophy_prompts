  What I need in the write-up: rules tight enough to run cold, materials, minute-by-minute timeline, the exact payoff scheme (no money), and a debrief that maps specific moments in the room onto specific parts of the disagreement. Also: be honest about what will predictably go wrong — there are always two or three who've seen a YouTube video on this and I'd rather recruit them than shut them down, and I'm worried about peeking and about students inferring how many were tapped. And be straight about which part of the problem the activity can't reproduce at all and I'll just have to supply by talking (I'm guessing the actual first-personal weirdness of being the same person twice, and the "she already knew she'd be woken, so she learned nothing new" line of argument).

