answer: |-
  ### Classroom Activity: "The Coin and the Wake-Up Call"

  #### **Overview**
  This 75-minute activity simulates the Sleeping Beauty problem without naming it, forcing students to confront the 1/2 vs. 1/3 credence split through scoring mechanics. The key insight: **the dispute reduces to whether the *trial* or the *awakening* is the scoring unit**. Students experience this via two scoring rules that shift the optimal report from 1/2 to 1/3. The captain mechanic is deferred to the debrief to show how extra information (e.g., "you're the captain") flips the answer.

  #### **Materials**
  - Coin
  - Phone (for music)
  - Slips of paper (60+)
  - 4 boxes (one per team)
  - Whiteboard/projector (display scores)
  - Timer
  - Movable chairs (for team huddles)

  #### **Setup**
  - **Teams**: 4 teams of ~5 students each.  
  - **Roles**: Each team is a single "person" with one shared point ledger.  
  - **Core Mechanic**:  
    - A fair coin is flipped (Heads = wake 1 student; Tails = wake 2).  
    - "Woken" students: Eyes closed, heads down, music playing. Instructor taps shoulders (masks sound).  
    - Woken students write a credence (0–1) on a slip (no peeking/talking).  
    - Slips collected; scoring depends on the phase.  

  ---

  ### **Timeline** (75 min total)

  #### **Phase 1: Per-Trial Scoring** (20 min)  
  **Goal**: Optimal report = 1/2.  
  - **0–5 min**: Explain rules.  
    - "Your team is one person. I flip a coin: Heads → tap 1 of you; Tails → tap 2. Woken students write a number *p* (belief in Heads). Scoring:  
      - **Per-Trial**: Team score = average score of all slips this round.  
        - If Heads: Score = `1 - (1 - p)^2`  
        - If Tails: Score = `[ (1 - p₁^2) + (1 - p₂^2) ] / 2`  
      - Honest reporting maximizes points. 3 rounds. After each, I reveal coin + score. Adjust *p* next round."  
  - **5–15 min**: Run 3 rounds.  
    - *Round flow*: Flip coin → tap students (music on) → collect slips → reveal coin → compute/display score.  
    - **Algebra Check**:  
      - Expected score for report *p*:  
        `(1/2) * [1 - (1 - p)^2] + (1/2) * [ (1 - p^2) + (1 - p^2) ] / 2`  
        Simplify to `p + 1/2 - p^2`. Maximize at **p = 1/2**.  
      - Teams should trend toward 1/2.  
  - **15–20 min**: Quick discussion.  
    - "Why did you settle near 0.5? What did the scoring rule emphasize?"  

  #### **Phase 2: Per-Awakening Scoring** (20 min)  
  **Goal**: Optimal report = 1/3.  
  - **20–25 min**: New rules.  
    - "Scoring changes:  
      - **Per-Awakening**: Team score = sum of slip scores.  
        - If Heads: Score = `1 - (1 - p)^2`  
        - If Tails: Score = `(1 - p₁^2) + (1 - p₂^2)`  
      - Same 3 rounds."  
  - **25–35 min**: Run 3 rounds.  
    - Same flow as Phase 1.  
    - **Algebra Check**:  
      - Expected score:  
        `(1/2) * [1 - (1 - p)^2] + (1/2) * [2(1 - p^2)]`  
        Simplify to `p + 1 - (3/2)p^2`. Maximize at **p = 1/3**.  
      - Teams should shift toward 0.33.  
  - **35–40 min**: Contrast phases.  
    - "Why did reports change? What differed?" (Nudge: "trial" vs. "awakening" as unit.)  

  #### **Phase 3: Design the Protocol** (25 min)  
  **Goal**: Teams engineer scoring rules to *force* 1/2 or 1/3.  
  - **40–45 min**: Assign targets.  
    - Teams 1–2: Target = 1/2. Teams 3–4: Target = 1/3.  
    - "Design a scoring rule where your target is optimal. Rules:  
      - Must use quadratic scores (`1 - (1 - p)^2` for Heads, `1 - p^2` for Tails).  
      - Define how slips are aggregated (e.g., sum, average, max).  
      - 10 minutes to design."  
  - **45–55 min**: Teams design.  
    - *Expected designs*:  
      - Target 1/2 → Per-trial average (as in Phase 1).  
      - Target 1/3 → Per-awakening sum (as in Phase 2).  
  - **55–60 min**: Swap and deduce.  
    - Teams swap protocols → deduce opponent’s target.  
  - **60–65 min**: Report findings.  
    - "Which target was the other team assigned? How could you tell?"  

  #### **Debrief** (10 min)  
  **Goal**: Link activity to Sleeping Beauty.  
  - **65–70 min**: Reveal the problem.  
    - "This simulated *Sleeping Beauty*: Fair coin; woken once (Heads) or twice (Tails, memory erased). On waking: credence in Heads?  
      - **Halfers** (1/2): Score per *trial* (like Phase 1). Unit = experiment.  
      - **Thirders** (1/3): Score per *awakening* (like Phase 2). Unit = subjective experience.  
      - Both are rational—dispute is about indexing."  
  - **70–72 min**: Captain variant (theory only).  
    - "What if only one 'captain' is scored per trial?  
      - Before knowing you’re captain: report 1/3 (like Phase 2).  
      - After knowing: **P(Heads | captain) = 1/2** (updates credence!).  
      Algebra:  
        - *P(Heads | woken) = 1/3*.  
        *P(captain | Heads) = 1*; *P(captain | Tails) = 1/2*.  
        *P(Heads | captain) = [1 * 1/3] / [ (1 * 1/3) + (1/2 * 2/3) ] = 1/2*.  
      - Changes *without new coin info*—just indexing shift."  
  - **72–75 min**: Monday credence divergence.  
    - "Halfers: P(Monday) = 3/4.  
      *P(Heads) = 1/2 → Monday. Tails: P(Monday) = 1/2 → P(Monday) = (1/2)*1 + (1/2)*1/2 = 3/4*.  
      Thirders: P(Monday) = 2/3.  
      *3 equiprobable states: Mon/Heads, Mon/Tails, Tue/Tails → P(Monday) = 2/3*."  

  ---

  ### **Predictable Issues & Mitigation**
  1. **Peeking/inferring taps**:  
     - Music + eyes closed reduces this. If a student isn’t tapped:  
       - In a team of 5, *P(Tails | not tapped) = 3/7* (not 1/2).  
       - Mitigate by emphasizing: "Your credence is for *if you are woken*. If not tapped, you ‘sleep’—no report."  
  2. **Students who know Sleeping Beauty**:  
     - Recruit as "co-instructors": "You’ve seen this? Help your team *without* naming it. Focus on scoring math."  
  3. **First-personal weirdness**:  
     - Activity can’t replicate memory erasure/identical awakenings.  
     - Debrief explicitly: "In the real problem, Beauty *is* the same person twice—our teams are proxies."  
  4. **"She knew she’d be woken" argument**:  
     - Activity can’t resolve this. Debrief: "Halfers argue no new info; thirders say awakening *is* new info."  

  ---

  ### **Why This Works**
  - **Mechanics → Philosophy**: Scoring rules force the 1/2 vs. 1/3 split without lectures.  
  - **Diagnosis Validated**: The dispute *is* about indexing (trial vs. awakening), and the captain variant proves it.  
  - **No Frills**: Uses your constraints (no money, no laptops, no pre-teaching).  

  Run it cold—algebra checks out, and the "aha!" at the debrief is golden. Let me know how it goes!
