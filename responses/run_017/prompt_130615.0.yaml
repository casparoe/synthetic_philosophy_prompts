  2. **SystemOwnBadness=yes → RewardIsValence=yes → ConsciousRequired=no** → This leaf is Non-Conscious Behaviorist Suffering, with the awkward commitment that any system receiving negative reward suffers, even a feedforward regressor. For the purely feedforward regressor with high loss, it suffers due to the negative reward signal (high loss), despite having no recurrence or complex architecture.  
  3. **SystemOwnBadness=yes → RewardIsValence=yes → ConsciousRequired=yes → TemporalSubject=yes** → This leaf is Phenomenal Conservative Suffering, with the awkward commitment that suffering requires consciousness markers like a self-model with persistence targets. For the failing PPO agent, it only suffers if it has such a self-model and temporal extension, not just from frequent negative rewards.  
  4. **SystemOwnBadness=yes → RewardIsValence=no → TrackRewardOrSurprise=Surprise → ConsciousRequired=no** → This leaf is Prediction-Error Suffering, with the awkward commitment that suffering arises solely from prediction errors, not absolute rewards. For the agent with per-step reward constant and clipped, suffering occurs only during negative temporal-difference errors, not from the unchanging reward.  
  5. **SystemOwnBadness=yes → RewardIsValence=no → TrackRewardOrSurprise=Reward → ConsciousRequired=yes → TemporalSubject=yes** → This leaf is unoccupied (unexplored), with the awkward commitment that suffering requires both functional role valence (e.g., attention capture) tied to reward and phenomenal consciousness. For the model-based agent whose world model predicts unavoidable failure, it would suffer only if the failure prediction triggers valence roles and the agent has a self-model, but this combination is not defended.
