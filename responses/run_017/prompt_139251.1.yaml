prompt: |-
  Hi — I'm marking a batch of second-year philosophy of language problem sheets and I'd like a second opinion before I write any marks down. Im going a bit cross-eyed at this point, so please be picky rather than generous. Below is the question and one student's answer, pasted as it came in.

  THE QUESTION (30 marks, 10 for each part)

  Kripke argues that proper names are rigid designators, and that this gives us truths which are necessary but knowable only a posteriori.

  (a) Explain what a rigid designator is, and explain why the rigidity of the two names in "Hesperus is Phosphorus" is supposed to make that identity necessary if it is true. Contrast this with "Hesperus is the brightest object visible in the evening sky", which Kripke takes to be contingent.

  (b) An objector says: if it is necessary that Hesperus is Phosphorus, then the astronomers who established this did not discover anything about the world — they only discovered something about our language. Explain carefully how Kripke can answer this objection, and say what work the notion of epistemic possibility is doing in his answer.

  (c) In 1908 a team of astronomers introduces the name "Turok" by stipulating that it is to name the largest satellite of the planet Cygnus — the body they take themselves to have observed through the telescope. In fact the body they observed was Cygnus's small inner satellite; the large outer one was not spotted until 1961. Later astronomers go on using "Turok" for the body the 1908 team observed. Using this case, explain Kripke's distinction between fixing the reference of a name and giving its meaning, and say whether "Turok" is a rigid designator.

  THE ANSWER

  (a) A rigid designator is a term that picks out the same object in every possible world. Unlike a definite description, its reference is not routed through a condition that different objects might satisfy in different worlds, so there is no possible situation in which it fails to refer: Venus exists in every possible world, and the worlds we have to consider when we evaluate "Hesperus is Phosphorus" are only worlds in which Venus has different properties — worlds where it is not visible in the evening, worlds where it is a cloud of gas, and so on. Now take the sentence "Hesperus is Phosphorus". Both names are rigid, so in every world they pick out the objects they actually pick out, namely Venus and Venus. The sentence therefore says, in every world, of one and the same object that it is identical with itself, and that cannot be false. So if the identity is true at all, it is necessarily true. That is the sense in which it is necessary a posteriori: necessary because of rigidity, a posteriori because only observation told us that the two names pick out the same thing. Contrast "Hesperus is the brightest object visible in the evening sky". The description is not rigid — in some worlds Mars is the brightest thing in the evening sky, or a comet is — so in those worlds the sentence is false even though "Hesperus" is still picking out Venus. Hence it is contingent. The general moral is that descriptions are never rigid, which is why the argument goes through for names and not for descriptions: what a name contributes to what is said is just its bearer.

  (b) The objector is running together necessity and apriority. What the astronomers could not rule out before looking was that "Hesperus" and "Phosphorus" name two different bodies: a situation in which they do is compatible with everything the astronomers could know a priori, and so is epistemically possible for them, even though no such situation is metaphysically possible. Their discovery was the discovery of which of these epistemic possibilities actually obtains. What they ended up knowing was a necessary truth, but they could only come to know it empirically. So there is no pressure to say that they discovered something merely linguistic — they found out about Venus, not about our words. The distinction doing the work is the one between how things could have been and what can be known independently of experience: Kripke's cases show these can come apart, and the objector's premise is simply the assumption that they cannot. This is why the description theory has to go. If names meant descriptions, then any necessary truth stated using names would be knowable by reflecting on those meanings, and these are not. What replaces it is the causal theory: a name refers to whatever object stands at the far end of the appropriate causal chain running back to the original baptism, which finally supplies the necessary and sufficient conditions for reference that the description theory never managed to give.

  (c) The distinction is between fixing the reference and giving the meaning. A speaker can use a description to fix the reference of a name — to settle which object the name is to be used for — without that description becoming the meaning of the name, since for Kripke the meaning of a name is just its bearer. In the Turok case the description "the largest satellite of Cygnus" was used at the baptism to fix the reference, and fixing is what settles what a name refers to: the reference is whatever uniquely satisfies the description. So "Turok" refers to the large outer satellite discovered in 1961. The 1908 team simply misidentified what they were looking at, and the later astronomers who use "Turok" for the inner satellite have changed the subject — or else are speaking falsely every time they use the name. The causal chain of communication Kripke describes only transmits a reference that has already been fixed by the description at the baptism; it cannot swap in a different object. So "Turok" is a rigid designator, but one which picks out the 1961 body in every possible world. And the sentence "Turok is the satellite observed in 1908" is therefore not merely false but necessarily false, since it pairs a rigid designator with a non-rigid description.

  WHAT I WANT FROM YOU

  - A mark out of 30, split across (a), (b) and (c), with a one-line justification for each part mark.
  - The margin comments you would actually write: quote the specific line or phrase you are responding to, then say what is wrong (or right) with it and why. Point by point, not an overall impression.
  - A separate list of anything that reads fluently and confidently but is confused, or where a step does not follow. That is what I most want caught. Also say which claims are fine as they stand, so I know what I can pass over quickly.
  - If you think any part of my question is under-specified, or does more work than I realised when I set it, say so and tell me what you would add.
  - Please dont bother with reading lists or citations — I know the literature. Write the comments in British English (the students get them back and the department is fussy about it), and keep each one the length of a real margin note: a sentence or two, not an essay.

  I'm deliberately not telling you what I've pencilled in for this one, because I don't want to anchor you.
reasoning: |-
  Alright, let me tackle this philosophy of language marking request. The user is a philosophy instructor needing a second opinion on a student's problem sheet about Kripke's rigid designators. They want rigorous marking with specific marginal comments and clear justifications.

  First, I need to carefully analyze each part of the student's answer against Kripke's actual theories. For part (a), the student correctly defines rigid designators but makes a subtle error about their referential behavior in possible worlds. The claim that rigid designators "have no possible situation in which they fail to refer" is problematic - Kripke allows for worlds where Venus doesn't exist. I should flag this while acknowledging their correct contrast with descriptions.

  Part (b) shows strong understanding of the necessity/apriority distinction but overreaches by bringing in the causal theory of reference unprompted. The student conflates two separate Kripkean arguments here - the main point about epistemic possibility is well made, but the causal theory digression is irrelevant to the question. 

  The Turok case in (c) reveals a significant misunderstanding. The student correctly states the reference-fixing distinction but misapplies it to this fictional scenario. Kripke's actual position (from his Gödel/Schmidt example) would have "Turok" referring to the originally baptized object (the inner satellite), not the one satisfying the description. This fundamental error needs highlighting.

  I'll structure the feedback with:
  - Precise marginal comments quoting problematic phrases
  - A mark breakdown with one-line justifications
  - A separate "confidence vs confusion" list identifying dangerously fluent errors
  - All in concise British English as requested

  The user's emphasis on catching confidently-stated errors suggests they've encountered students misunderstanding Kripke's baptism/reference distinction before. I should be particularly vigilant about that in part (c).
answer: |-
  Here is a strict assessment following your specifications. Marks and comments are based solely on philosophical accuracy and relevance to the question.

  **Marks (Total: 21/30)**  
  - (a) **7/10** *Good definition but flawed modal claim; correct necessity explanation but misses Venus' non-necessity.*  
  - (b) **8/10** *Strong on epistemic/metaphysical distinction; overreaches with causal theory & misstates objector's premise.*  
  - (c) **6/10** *Correctly states distinction but misapplies it to the case; rigid designator claim confused by reference error.*  

  ---

  **Margin Comments (British English)**  
  *(Quoted text from student > Comment)*  

  **(a)**  
  > *"no possible situation in which it fails to refer"*  
  > **Incorrect.** Kripke allows worlds where Venus doesn’t exist – rigid designators *can* fail to refer if the object doesn’t exist in that world. Rigidity means it designates *that object* when it exists, not that it exists necessarily.  

  > *"worlds in which Venus has different properties"*  
  > **Correct and key.** Rigid designators track the same object across worlds where it exists, regardless of property changes.  

  > *"descriptions are never rigid"*  
  > **Overgeneralised.** Kripke allows rigid uses of descriptions (e.g., "the square root of 25" designates 5 in all worlds), though names are rigid *de jure*.  

  **(b)**  
  > *"What the astronomers could not rule out... is that 'Hesperus' and 'Phosphorus' name two different bodies"*  
  > **Spot on.** Epistemic possibility allows scenarios later ruled out by empirical evidence, even if metaphysically impossible.  

  > *"the objector's premise is simply the assumption that [necessity and apriority] cannot come apart"*  
  > **Slightly misstated.** The objector assumes necessity *implies* apriority (or that a posteriori truths can’t be necessary), not that they can’t come apart *at all*.  

  > *"What replaces it is the causal theory"*  
  > **Irrelevant.** The question asks only for Kripke’s *answer to the objector* (re epistemic possibility), not his positive theory of reference. This digresses.  

  **(c)**  
  > *"'the largest satellite of Cygnus' was used at the baptism to fix the reference... So 'Turok' refers to the large outer satellite"*  
  > **Fundamental error.** For Kripke, reference is fixed to the object *actually baptised* (the inner satellite seen in 1908), not the object satisfying the description. The description is a *reference-fixing tool*, not a meaning.  

  > *"the later astronomers... have changed the subject — or else are speaking falsely"*  
  > **Confused.** If later astronomers use "Turok" for the inner satellite (the baptised object), they refer correctly *even if misdescribed*. If they use it for the outer one, they refer to nothing (or a different object).  

  > *"Turok is a rigid designator, but one which picks out the 1961 body"*  
  > **Inconsistent.** If "Turok" rigidly designates the 1961 body, the student contradicts their own claim that the baptism fixed reference to the outer satellite via description. Rigidity requires consistency.  

  ---

  **Confidence vs. Confusion**  
  ✅ **Fluently correct:**  
  - Explanation of why "Hesperus is Phosphorus" is necessary (a).  
  - Epistemic possibility allowing scenarios where Hesperus ≠ Phosphorus (b).  
  - Meaning/reference-fixing distinction *stated* (c).  

  ⚠️ **Confident but confused:**  
  - *"no possible situation in which it fails to refer"* (a). **Dangerously wrong** – implies metaphysical necessity of Venus.  
  - Linking necessity/apriority distinction to *refuting description theory* (b). **Misplaced** – Kripke’s argument against descriptivism is separate from the objector’s point.  
  - Claiming "Turok" refers to the *outer* satellite (c). **Critical error** – misses Kripke’s core point that reference is fixed by baptism, not satisfaction of description.  

  ---

  **Question Critique**  
  - **(c)’s scenario** is ambiguous: Are later astronomers *intending* to use "Turok" for the 1908-observed object or the description’s satisfier? The student assumes the latter, but Kripke’s paradigm (e.g., "Gödel") favours the former. **Suggestion:** Add: "Later astronomers use 'Turok' exclusively for the inner satellite."  
  - **(b)** could explicitly ask for the *epistemic possibility* role to avoid causal theory digressions.  

  ---  
  **Final Mark Justification**  
  (a) 7/10: −3 for modal existence error; otherwise solid.  
  (b) 8/10: −1 for misstated objector premise, −1 for irrelevant causal theory.  
  (c) 6/10: −3 for misidentifying reference (fatal), −1 for rigidity confusion.
