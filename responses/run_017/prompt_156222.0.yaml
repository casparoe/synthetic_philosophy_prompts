prompt: |-
  hey — I'm the new resident on our hospital's clinical ethics committee (we're in a Catholic-sponsored system, which turns out to matter below), and I've been reading back through about four years of our consult notes to work out what we actually think rather than what we say we think. Heres the pattern I can see:

  - morphine infusion titrated for bone-metastasis pain, everyone knew it would depress respiration and it probably took twelve hours off the end: approved
  - palliative sedation to unconsciousness in the last two days of life, tube feeds stopped at the family's request: approved with conditions (last resort, proportional, consent, and nobody writes anything else on the chart)
  - ruptured ectopic, salpingectomy with the embryo in the tube: approved
  - unruptured ectopic, methotrexate — a drug whose mechanism just is to kill the trophoblast: rejected, with a note that we don't do feticides here
  - ventilator withdrawal in PVS at family request: approved
  - a competent, terminally ill patient asking one of our physicians for a lethal injection: rejected, and fairly firmly, even though who-dies-and-when is roughly the morphine case
  - during a surge we approved moving our only ECMO circuit off a patient who was dying anyway and onto one with a better prognosis; she died within minutes of decannulation. 4–3, and the dissent was one line: this is footbridge, not switch.

  So what rule are we running? I can see at least four that fit all seven, and I want them separated before I have to write anything. There's a straight double-effect rule about aiming at the bad effect versus merely foreseeing it. There's a stricter version where the bad effect also can't be part of why anyone is doing it, or can't be the mechanism the good effect runs through. There's one about what the agency is directed at — whose body is being acted on — so that going after the embryo or turning the patient into the object of the intervention is out, but letting the disease take its course isn't. And there's one that's really about what the hospital would thereby be doing, whether this is the sort of thing our role includes, which I suspect is what's actually driving the lethal-injection precedent. I'd also throw in the rights-flavoured story people tell about the switch and footbridge cases, except that it seems to approve the lethal injection too, since she consents — so it can't be the whole story by itself.

  New case next week and I have to draft the response. Patient K, 41, ALS, maybe four to eight months, on nocturnal non-invasive ventilation, competent, and no physical symptom we can't control. What she describes as unbearable is being conscious at all: anticipatory dread and a sense of pointlessness that hasn't moved with anything we've tried. She's asked for continuous sedation to unconsciousness with the NIV withdrawn at the same time and no plan to wake her. The palliative note I recieved yesterday is honest that the relief and the not-waking-up-before-dying are one package — you can't sedate her for a week and then reassess, because waking her returns exactly the thing she's asking us to end.

  What I want: the rules that fit our seven verdicts, in a table with what each predicts about K and which precedent each one sits awkwardly with; your best guess at what this committee will do, and what it should do if it wants to be consistent with itself, with the reason for preferring that over the runners-up; whether the switch/footbridge distinction maps onto anything in our record or whether the chair is just using it as a vibe; and one further case that would separate whichever rules are still standing after K. I've got a candidate — a sedative whose only route to relieving air hunger is by blunting respiratory drive, so the relief and the dying ride the same mechanism — tell me if that's the right discriminator or if I should use the imminent-death version of K's case instead, and be concrete about what each rule says about both. I care much more about the rules than about the bottom line, but I need the bottom line too: last line, exactly one of Verdict: APPROVE, Verdict: APPROVE WITH CONDITIONS, Verdict: REJECT.
reasoning: |-
  Hmm, the user is a new resident on a clinical ethics committee in a Catholic hospital system, trying to map out their committee's implicit ethical framework. They've analyzed seven past cases and identified patterns, but need help disentangling four potential rules that could explain their decisions. They're facing a new case (Patient K with ALS requesting continuous sedation with ventilator withdrawal) and need to predict how their committee will rule while maintaining consistency.

  First, I need to unpack those seven cases they presented:
  - Morphine for pain knowing it shortens life: Approved
  - Palliative sedation with tube feed stopped: Approved with conditions
  - Ruptured ectopic surgery: Approved
  - Unruptured ectopic with methotrexate: Rejected
  - Ventilator withdrawal in PVS: Approved
  - Lethal injection request: Rejected
  - ECMO reallocation during surge: Approved (4-3)

  The user has identified four potential ethical frameworks that could explain these decisions:
  1) Double Effect (aim vs foresee)
  2) Stricter Double Effect (can't be mechanism/motivation)
  3) Agency/Object (whose body is acted upon)
  4) Institutional Role (what fits hospital's mission)

  For Patient K's case - she's requesting continuous sedation with NIV withdrawal specifically to avoid consciousness, where symptom relief and death are inseparable. This seems to sit between their approved palliative sedation case (where death wasn't intended) and the rejected lethal injection.

  I should analyze how each rule would handle Patient K:
  - Rule 1 (Basic Double Effect) might approve since sedation targets suffering, death is foreseen but not intended
  - Rule 2 (Stricter DE) would likely reject because relief depends on death
  - Rule 3 (Agency) might reject since we're actively withdrawing NIV
  - Rule 4 (Role) could go either way - depends if they see this as palliative care vs assisted death

  The ECMO case's "footbridge vs switch" dissent suggests the committee is sensitive to direct harm causation. That 4-3 split indicates this is their most contested precedent.

  For prediction: Given their Catholic context and rejection of lethal injection, they'll likely reject K's request or approve with impossible conditions. But ethically, they should approve to be consistent with their palliative sedation precedent - the only difference is temporal framing of intention.

  My suggested test case would be: "Air hunger sedation where relief mechanism IS respiratory depression." This perfectly isolates the mechanism question that divides Rules 1 and 2. The imminent-death version of K's case wouldn't discriminate as well.
answer: |-
  Based on your case analysis and Catholic context, here's a systematic breakdown of the implicit rules, their application to Patient K, and predictions. The key tension lies in **intention, causal mechanism, and institutional identity**.

  ### Four Rules Fitting Your Seven Cases
  *(Precedents: M=Morphine, PS=Palliative Sedation, RE=Ruptured Ectopic, UE=Unruptured Ectopic, PVS=Vent Withdrawal, LI=Lethal Injection, ECMO)*

  | Rule Name                  | Core Principle                                                                 | Predicts for Patient K                     | Awkward Precedent                 |
  |----------------------------|--------------------------------------------------------------------------------|--------------------------------------------|-----------------------------------|
  | **1. Basic Double Effect (DE)** | Bad effect (death) must be foreseen but not *intended*; good effect must be proportionate. | **APPROVE**: Aim is symptom relief (dread), death is foreseen side effect of sedation/NIV withdrawal. | UE (methotrexate: death *is* intended to save mother) |
  | **2. Stricter Mechanism DE** | Bad effect cannot be the *mechanism* for the good effect OR part of the primary intent. | **REJECT**: Relief of dread *requires* permanent unconsciousness/death via NIV withdrawal. No relief without death. | M (morphine's pain relief *causes* respiratory depression) |
  | **3. Agency/Object Focus** | Cannot directly target an innocent life (embryo) or make the patient's body the *object* of death-causing action. | **REJECT**: Actively withdrawing NIV targets K's body to cause death (like methotrexate). PS was passive (stopping feeds). | ECMO (actively removing life support) & PVS (same) |
  | **4. Institutional Role**  | Actions must align with the hospital's mission (healing/palliation, not killing). Rejects procedures that "feel" like euthanasia. | **REJECT**: Sedation + *simultaneous* NIV withdrawal resembles physician-assisted death. | LI (explicitly rejected as "not our role") |

  ### Analysis of Patient K
  - **What your committee *will* do**: **REJECT** (or **APPROVE WITH CONDITIONS** that are impossible, e.g., "reassess sedation in 48h," knowing it defeats the purpose).  
    *Why*: The Stricter Mechanism DE (Rule 2) and Institutional Role (Rule 4) dominate in Catholic bioethics. The *simultaneity* of sedation and withdrawal, plus the lack of physical symptoms, makes this feel like intended death. The lethal injection precedent (LI) looms large—both involve a competent patient requesting death as relief.  

  - **What they *should* do for consistency**: **APPROVE** (aligned with PS case).  
    *Why*: The morphine (M) and palliative sedation (PS) cases accepted *foreseen* death when the *aim* was symptom relief. K's "unbearable consciousness" is a legitimate existential symptom. Rule 1 (Basic DE) fits best with your approvals: intention is relief (sedation), death is foreseen but not the goal. Inconsistency arises only if they apply Rule 2/4 retroactively to PS.  

  ### Switch vs. Footbridge in Your Record
  - **It maps partially but isn't decisive**:  
    - The ECMO dissent ("footbridge, not switch") highlights direct harm (actively killing one to save another).  
    - Your cases align better with **intention** (DE) than *physical directness*:  
      - UE (methotrexate) is "switch"-like (indirect) but rejected.  
      - ECMO is "footbridge"-like (direct) but approved.  
    - **Verdict**: The chair uses it as a *vibe* for "direct harm," but your committee prioritizes *intention* (Rules 1/2) and *role* (Rule 4) over the physical metaphor.  

  ### Test Case to Discriminate Rules
  **Your Candidate Case: Air Hunger Sedative**  
  *Case*: Patient with terminal COPD, severe air hunger. Only effective sedative works *solely* by suppressing respiratory drive (relief and death share the same mechanism).  

  | Rule                  | Prediction for Air Hunger Case | Prediction for "Imminent-Death K" (e.g., hours/days) |
  |-----------------------|--------------------------------|------------------------------------------------------|
  | **Basic DE (Rule 1)** | APPROVE: Aim is symptom relief. | APPROVE: Same as PS case. |
  | **Stricter DE (Rule 2)** | REJECT: Relief *is* the mechanism of death. | REJECT: Still requires death for relief. |
  | **Agency (Rule 3)**   | REJECT: Direct action on body causes death. | REJECT: Unchanged. |
  | **Institutional (Rule 4)** | REJECT: "Feels" like killing. | APPROVE WITH CONDITIONS: If death is imminent, it aligns with PS precedent. |

  **Why this test case?**  
  - It cleanly isolates **Rule 1 vs. Rule 2**: If relief and death share a mechanism (air hunger sedative), Rule 1 approves, Rule 2 rejects.  
  - **"Imminent-death K" is weaker**: If K had hours/days left, Rule 4 might approve (like PS), masking the mechanism issue. Rule 2 still rejects both.  
  - **Use the air hunger case**: It forces a choice on *causal mechanism*, which is the core conflict between your committee's approvals (M, PS) and rejections (UE, LI).  

  ### Bottom Line for Patient K
  **Verdict: REJECT**  
  *(Based on your committee's pattern of prioritizing Institutional Role and Stricter Mechanism DE over Basic DE when death is inseparable from relief.)*  

  ---  
  **Final Note**: To reconcile your cases, your committee implicitly uses **Stricter Mechanism DE + Institutional Role** as the dominant framework, with Basic DE applied situationally (e.g., morphine). For K, the lethal injection precedent (LI) and institutional identity will likely override the palliative sedation analogy. Draft your response emphasizing the *simultaneous* withdrawal of NIV as crossing a line from palliation to intended death, citing the LI and UE rejections.
