answer: |-
  Below is a decision tree designed to guide someone from the premise "there are true *de re* modal claims about ordinary objects" (e.g., "I could have been taller") to a specific modal metaphysics position, based solely on logical commitments. It avoids labels until the end and uses diagnostic cases (e.g., worlds where you have no counterpart, indistinguishable candidates, or fission) to reveal implications. The tree has **6 branch nodes**, phrased for accessibility to first-year students. Empty cells in the logical space are marked with brief explanations (incoherent, unattractive, or never tried).

  ---

  ### **Modal Metaphysics Decision Tree**
  *Start with: "There are true de re modal claims about ordinary objects."*

  1. **Do possible worlds (as truthmakers for modal claims) exist?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 6.  

  2. **Are possible worlds concrete (like physical universes) or abstract (like stories)?**  
     - **Concrete** → Go to 3.  
     - **Abstract** → Go to 4.  

  3. **Can the same individual exist in multiple worlds?**  
     - **Yes** → **Incoherent** (Leads to contradictions: e.g., you could be both tall and not tall).  
     - **No** → Go to 5.  

  4. **How do we link individuals across worlds?**  
     - **Same individual exists in multiple worlds** → Go to 7.  
     - **Different individuals represent counterparts** → Go to 5.  

  5. **How is the counterpart relation fixed?**  
     - **By qualitative similarity** (e.g., matching properties like height, personality):  
       - If from 3 (concrete worlds) → **Lewis's modal realism**.  
       - If from 4 (abstract worlds) → **Ersatz modal realism**.  
     - **Primitive** (no further explanation; it just *is* a relation):  
       - If from 3 → **Unattractive** (Similarity is intuitive; primitive adds mystery).  
       - If from 4 → **Never tried** (No clear reason to avoid similarity).  
     - **Context-sensitive** (depends on perspective or contrast):  
       - If from 3 or 4 → **Never tried** (No major theory develops this).  

  6. **How are modal claims true without worlds?**  
     - **Via a useful fiction** (truths are "according to the story" of worlds) → **Modal fictionalism**.  
     - **Primitive modal facts** (no reduction; e.g., "I could have been taller" is brute) → **Modal primitivism**.  

  7. **How is identity across worlds determined?**  
     - **By non-qualitative essences** (e.g., a unique "thisness" beyond properties) → **Actualist transworld identity with haecceities**.  
     - **By qualitative properties alone** (e.g., matching memories, appearance) → **Unattractive** (Indistinguishable candidates cause ambiguity: both could be "you").  

  ---

  ### **Key to Leaves (Named Positions)**
  - **Lewis's modal realism**: Concrete worlds, no transworld identity, similarity-based counterparts.  
  - **Ersatz modal realism**: Abstract worlds, counterparts, similarity-based.  
  - **Actualist transworld identity with haecceities**: Abstract worlds, same individual across worlds, non-qualitative essences.  
  - **Modal fictionalism**: No worlds; truths are fictional.  
  - **Modal primitivism**: No worlds; modal truths are brute facts.  

  ### **Empty Cells & Why**
  - **Concrete worlds + transworld identity (3→Yes)**: Incoherent (violates logic: e.g., you gain/lose properties across worlds).  
  - **Abstract worlds + qualitative transworld identity (7→Qualitative)**: Unattractive (indistinguishable candidates force arbitrary choices).  
  - **Concrete/abstract worlds + primitive/context-sensitive counterparts (5→Primitive/Context)**: Never tried (similarity is dominant; alternatives lack motivation).  

  ---

  ### **How Diagnostic Cases Resolve**
  | Case | Lewis/Ersatz (similarity) | Actualist w/ haecceities | Fictionalism | Primitivism |
  |------|---------------------------|--------------------------|--------------|-------------|
  | **(1) World with no counterpart** | True (you might not exist) | True (your essence uninstantiated) | True (fiction says so) | True (primitive fact) |
  | **(2) Two indistinguishable candidates** | Both can be counterparts (de re claims true of both) | Only one has your haecceity (determinate) | Fiction determines | Primitive fact determines |
  | **(3) Fission (two successors)** | Both are counterparts (you might fission) | Neither is identical to you (problematic) | Fiction determines | Primitive fact determines |

  ---

  ### **Design Notes**
  - **Branch Logic**: The tree separates all named positions. It *cannot* distinguish similarity-based, primitive, or context-sensitive counterpart relations purely from the cases (all handle Case 2 similarly), but Branch 5 forces explicit commitment.  
  - **Accessibility**: Jargon (e.g., "haecceities") is avoided; key ideas are described intuitively (e.g., "non-qualitative essences" as "unique thisness").  
  - **Efficiency**: 6 nodes cover the logical space. Empty cells reflect historical/metaphysical constraints (e.g., accidental intrinsics argument blocks concrete transworld identity).  
  - **Output**: Handout-ready; users never choose labels—positions emerge from answers.  

  This tree isolates core commitments, uses cases to stress-test views, and exposes why some cells are vacant. Ideal for sparking discussion in a reading group!
