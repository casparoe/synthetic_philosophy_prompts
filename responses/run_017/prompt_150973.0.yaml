    - *Pre-registered Prediction:* Invariant to unit; posterior odds remain 1:1.  
  - **Camp I (SIA):**  
    - Unit = Persons: Likelihood(Swarm) ∝ 10^15, Likelihood(Marathon) ∝ 1. Posterior odds = 10^15:1 in favor of Swarm.  
    - Unit = Moments: Likelihood(Swarm) ∝ 10^15, Likelihood(Marathon) ∝ 10^15. Posterior = 1:1.  
    - *Pre-registered Prediction:* Depends on unit; Camp I is divided on the correct unit, but the update is as above.  

  **Crux (b): SIA Formulation and Presumptuous Philosopher**  
  *Test Case: Presumptuous Philosopher (not detailed here, but standard version)*  
  - **Camp S Prediction:** Naive SIA (without conditioning on total evidence) leads to an extreme update in favor of a universe with many observers, which is incorrect. The split in Camp I shows the problem.  
  - **Camp I Prediction:** The bullet-biting subgroup accepts the update; the conditioning subgroup avoids it by noting that we must condition on the total evidence, including that we exist in a universe with observers like us.  

  **Crux (c): SSA-SIA Cancellation**  
  *Argument:* If we apply SIA and then condition on our evidence via SSA using the same reference class, the factors cancel, yielding the same as updating without anthropics.  
  - **Camp S:** Agrees that if SIA is applied first and then SSA, they cancel. But this shows SIA is redundant; SSA alone is the correct update.  
  - **Camp I:** The cancellation shows that the combination is consistent. However, SIA is still needed for hypothesis comparison before conditioning on evidence.  

  **Crux (d): Non-Arbitrariness of Reference Class**  
  *Test Case: The Smear*  
  - **Setup:** At duplication degree d=0.5, we assess hypotheses H1 (one observer) and H2 (two observers).  
  - **Camp S (SSA):** In H1, likelihood = 1; in H2, likelihood = 1. Posterior = prior. The vagueness in observer count does not affect the update.  
  - **Camp I (SIA):** Likelihood(H1) ∝ 1, likelihood(H2) ∝ 2. Posterior odds = 1:2 in favor of H2. The vagueness in whether d=0.5 is one or two observers propagates to the probability (e.g., if we model it as 1.5 observers, then likelihood ∝ 1.5).  
  - *Pre-registered Prediction:* Camp S says the update is unchanged by vagueness; Camp I says the update scales with the (vague) observer count.  

  **4. Closing Section**

  The most tractable crux is **(a) the unit question**, as it can be tested with clear cases like Swarm vs. Marathon. Both camps agree on the mathematical update under each unit choice but disagree on which unit is appropriate. 

  - **Camp S** would count as evidence against its view if a case showed that SSA with observer-moments yields counterintuitive results in sequential scenarios (e.g., extending Sleeping Beauty).  
  - **Camp I** would count as evidence against its view if a case showed that SIA with persons leads to unacceptable inferences (e.g., Swarm vs. Marathon favoring Swarm by 10^15:1 despite identical experiences).  

  Parts of the dispute are **merely verbal**, particularly the choice between "observers" and "observer-moments" in some cases. If both camps adopt observer-moments, then in Swarm vs. Marathon, they agree on 1:1 odds. However, the camps substantively disagree on whether to weight by the number of moments (SIA) or to condition on being in a random moment (SSA) when the moments are the same. 

  Overall, the debate hinges on whether we should reason from being a random sample (SSA) or from the fact of our existence (SIA). The cases reveal that the choice of reference class and the handling of vagueness are critical, but not insurmountable. Future work should focus on experimental design in anthropic scenarios (e.g., duplication experiments) to test these principles empirically. 

