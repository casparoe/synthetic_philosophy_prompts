  #### 1. Agreed Claims  
  Both camps endorse these claims without reservation:  
  1. **Anthropic reasoning is distinct**: Standard Bayesian updates alone cannot resolve cases where hypotheses imply different numbers of observers, and centered evidence (indexical information) is relevant.  
  2. **Priors are symmetric**: In the test cases below, the physical evidence and prior odds between hypotheses are stipulated as 1:1.  
  3. **Observer-centric evidence**: All observers in both test cases have subjectively indistinguishable experiences, including apparent memories and time perception.  
  4. **No external time**: Observers cannot access objective time; differences are only physical (detectable by a super-observer).  
  5. **Reference class challenge**: Defining the "observer" unit (e.g., persons, person-moments) is non-trivial and context-dependent.  
  6. **SSA and SIA as likelihood engines**: Both camps compute posterior odds as: Prior × (anthropic likelihood factor), where the factor differs by camp.  
  7. **Presumptuous philosopher (PP) is a problem**: Unconditional SIA leads to extreme updates in favor of large universes (e.g., 99.99% credence for a theory with 10^50 observers).  
  8. **Doomsday argument (DA) is a problem**: SSA implies we are "typical" observers, penalizing hypotheses with large future populations.  
  9. **Vagueness propagation**: If the number of observers is vague (e.g., The Smear), probabilities inherit that vagueness.  
  10. **Cancellation under total evidence**: If SSA and SIA use the same reference class, their likelihood factors cancel, reducing to ordinary conditioning on evidence.  
  11. **No privileged unit**: Neither persons nor person-moments are ontologically "fundamental"; the choice is modeling-dependent.  
  12. **Test cases are valid**: Swarm vs. Marathon and The Smear fairly illustrate core disputes; neither camp claims they are rigged or identical.  

