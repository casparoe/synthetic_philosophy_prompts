prompt: |-
  I am drafting a two-page pitch for internal seed funding: one researcher for twelve months, no teaching, to work on a single question in collective decision-making. The topic is safe Pareto improvements, and I want the money to go to a question I think the literature has left in an awkward place.

  The notion as I am working with it: there is a status quo policy, a feasible set of alternatives, finitely many people, and finitely many states of the world. Each person has a utility function over outcomes and a probability distribution over states. A move from the status quo to an alternative is a safe Pareto improvement when, for every person, that person's own expected utility — computed from their own probabilities and their own utility function — is higher under the alternative than under the status quo. Its appeal is that it needs no interpersonal comparison and no social welfare function: a planner who has no view at all on the merits can apparently still make everyone better off, where better off is spelled out in terms each person would accept.

  My half-formed worry is that the guarantee is conditional on people's actual beliefs, and beliefs are precisely what the planner does not observe. If the planner has to ask, then anyone who expects to dislike the proposed change can report probabilities under which it looks bad, and reporting pessimism is costless; symmetrically, people can report confident beliefs to push through changes they favour. So safety may turn out to be safety relative to reported beliefs only. Behind that strategic point sits a structural one: the status quo is the disagreement point, no change is available for free, and anyone can in principle secure it by reporting suitably unhelpful probabilities. I suspect some kind of impossibility is available — that a rule which (i) selects a safe Pareto improvement whenever one exists relative to the true beliefs, (ii) never gives anyone an expected gain from misreporting their probabilities, and (iii) is neither a rule that always keeps the status quo nor one that consults a single designated person, either cannot be had or can be had only under a characterization so narrow that it shows the notion is not institutionally usable. But I do not know whether the honest conclusion is pessimistic about safe Pareto improvements or reconstructive of them, and that ambiguity is partly why I want the project scoped properly.

  What I need is a proposal that does the following. State the question so that it has a determinate answer — a theorem, a characterization, or a clearly described counterexample space — rather than a topic. Fix and justify the modelling choices: whether utilities are taken as observable while beliefs are private, or both are private; whether the people are assumed to share a prior; whether the planner can commit to a rule in advance. Explain why the existing answers leave it open: say what the standard treatments of safe Pareto improvements are doing when they help themselves to each person's beliefs, and say why the familiar impossibility results about strategy-proofness and about the tension between incentive compatibility and efficiency do not simply settle the matter, given that here the private object is a probability rather than a preference over outcomes and the default is the status quo rather than an arbitrary alternative. Argue for one approach over the obvious alternatives — in particular over the move to a robust or ambiguity-set version, where a change must raise each person's expected utility under every probability in a set attributed to them, and over a purely dynamic treatment in which each step is an improvement but the sequence may be exploitable — and say which of these belongs in the twelve months and which has to be left for later. Give a month-by-month plan for the year, including one minimal worked example with two or three people and two or three states that fixes intuitions and that the project would actually solve early on. Say what the possible conclusions are and which considerations would decide between them. Say what would count as the project having failed, and what would count as a disappointing but still useful result. Finally, describe a concrete deliverable and make the case, in a sentence or two, for why twelve months of one person's time is the right size for this and not for something larger.

  Describe positions and arguments by their content, not by author or paper: I will fill in the references myself, and I do not want the proposal's plausibility to rest on a citation list. Be straight about what could make the project too big for the time available.
reasoning: |-
  We are drafting a two-page pitch for internal seed funding for a one-year research project on safe Pareto improvements in collective decision-making. The project aims to resolve a specific problem: the vulnerability of safe Pareto improvements to strategic reporting of beliefs when those beliefs are private information. The pitch needs to be structured to address the key points outlined.

  Below, I outline the content for the pitch in a structured manner, following the requirements. The goal is to present a clear, focused, and compelling case for the project.

  ---

  **Project Title:** Incentive-Compatible Safe Pareto Improvements: Resolving the Strategic Belief Reporting Problem

  **Introduction and Motivation:**
  The concept of a safe Pareto improvement (SPI) offers a compelling way to make collective decisions without interpersonal utility comparisons. Given a status quo policy and a set of feasible alternatives, an SPI is a move that increases every individual's expected utility according to their own beliefs and utilities. This approach is appealing because it requires no social welfare function and respects individual subjectivity. However, a critical gap exists: the literature typically assumes that the planner observes each individual's true beliefs. In reality, beliefs are private and individuals may report them strategically. If individuals can misreport their beliefs without cost, they can block or force changes to serve their own interests, rendering the notion of an SPI vulnerable to manipulation and potentially unusable in practice.

  **Core Research Question:**
  The project will address the following question: 
  *Can we design a mechanism for selecting safe Pareto improvements that is strategy-proof (i.e., individuals cannot gain by misreporting their beliefs) and that satisfies minimal efficiency and non-dictatorial conditions? If not, what are the precise limitations (in terms of impossibility theorems) and what alternative approaches (e.g., robust or dynamic) become necessary?*

  This question has a determinate answer: we aim to produce either a constructive mechanism (with a characterization of when it works) or an impossibility theorem (with a clear delineation of the boundary conditions under which SPI can be implemented without manipulation).

  **Modelling Choices and Justification:**
  We fix the model with the following features:
  - **Utilities and Beliefs:** Both utilities over outcomes and probability distributions over states are private information. This is realistic because both are subjective and unobservable. However, we note that if utilities were observable (or could be elicited truthfully in a prior stage), the problem would reduce to belief reporting. Our base model treats both as private to cover the general case.
  - **Shared Prior:** We do not assume a shared prior. Individuals may have different beliefs, and the planner has no prior over the state of the world. This avoids imposing unrealistic agreement and allows for genuine disagreement.
  - **Commitment:** The planner can commit to a mechanism (a rule mapping reported beliefs and utilities to a policy choice). This is essential for analyzing incentive compatibility.

  **Why Existing Literature Leaves the Question Open:**
  The standard treatment of SPI (e.g., in welfare economics under uncertainty) takes beliefs as given and observable. The literature on strategy-proofness (e.g., in mechanism design) typically focuses on preferences over outcomes (not beliefs) and often assumes a fixed state space. Moreover, classic impossibility results (like Gibbard-Satterthwaite) apply to preferences, not to beliefs, and they do not account for the status quo as the default. The problem here is distinct because:
  1. The private information is a probability distribution (a continuous object) and not a preference ordering over discrete alternatives.
  2. The requirement is to improve upon the status quo for every individual according to their true beliefs, which is a specific form of efficiency.
  3. The status quo acts as a natural disagreement point, which might alter the strategic incentives.

  **Approach and Alternatives:**
  We focus on developing a direct revelation mechanism where individuals report their beliefs and utilities, and the planner selects an SPI if one exists relative to the reported information. We will investigate whether such a mechanism can be made strategy-proof (truth-telling is a dominant strategy) and non-dictatorial.

  We argue against two obvious alternatives at this stage:
  - **Robust/Ambiguity-Set Approach:** Requiring the improvement to hold for every belief in a set (e.g., a set of priors) is more demanding and might lead to no SPI existing. This approach is important but should come after we understand the base case with point beliefs.
  - **Dynamic Approach:** Breaking the change into a sequence of small SPI steps might circumvent the problem, but it introduces new challenges (e.g., manipulability of the sequence, commitment over time). This is a natural extension but not the starting point.

  Our initial focus (within 12 months) is on the static mechanism design problem. The robust and dynamic approaches are noted as future work.

  **Research Plan and Timeline:**
  The project will unfold over 12 months as follows:

  1. **Months 1-2:** Formalize the model and the desired properties (SPI existence relative to true beliefs, strategy-proofness, non-dictatorship, and individual rationality). Develop a minimal example with two people and two states of the world to fix intuitions. This example will be solved completely to illustrate the problem and potential solutions or impossibilities.

     *Minimal Example:*
     - Two people: A and B.
     - Two states: s1 and s2.
     - Status quo: policy SQ.
     - Alternative: policy ALT.
     - Utilities: Assign specific utilities for each person in each state (e.g., A: SQ gives (1,0) in (s1,s2), ALT gives (0,1); B: SQ gives (0,1), ALT gives (1,0)).
     - Beliefs: A believes s1 with probability p (so s2 with 1-p); B believes s1 with q.
     - SPI condition: ALT is an SPI if p*1 + (1-p)*0 > p*0 + (1-p)*1 for A? Actually, we need to compute expected utilities and see when both are better off. This example can be set to have an SPI for some beliefs but not others, and then we can see how reporting beliefs strategically might break it.

     We will solve this example by designing a mechanism and checking for strategy-proofness or proving that none exists.

  2. **Months 3-4:** Extend the example to three people and three states to identify patterns and general obstacles. Investigate whether a mechanism that uses transfers (even if only hypothetical) can help. Explore the connection to dominant strategy implementation.

  3. **Months 5-6:** Generalize to n individuals and m states. Investigate the possibility of an impossibility theorem. If an impossibility result is found, characterize the conditions under which it holds (e.g., the number of states, the richness of the utility functions).

  4. **Months 7-8:** Explore constructive approaches. For example, can we use scoring rules to elicit beliefs truthfully? But note: even if beliefs are truthfully elicited, the planner must then choose an SPI based on them. However, the existence of an SPI depends on the true beliefs, and if the planner uses reported beliefs to choose the policy, then even with truthful reporting, the condition for SPI is with respect to reported beliefs, not true ones. This is the crux: we need the change to be an improvement relative to true beliefs. This may require a mechanism that uses the reports in a way that the outcome is an SPI relative to true beliefs. We will explore mechanisms that are robust to misreporting by having the outcome depend on the reports in a way that makes misreporting unprofitable.

  5. **Months 9-10:** Consider restricted domains (e.g., state-independent utilities, or common prior) and see if positive results emerge. Also, consider the case where utilities are known and only beliefs are private.

  6. **Months 11-12:** Consolidate results, write up findings, and prepare the deliverable. If the main question is resolved, explore one extension (e.g., a simple dynamic setting) to show the path forward.

  **Possible Conclusions:**
  1. **Positive Result:** We find a mechanism that is strategy-proof and selects an SPI whenever one exists relative to true beliefs (and satisfies non-dictatorship). This would be a breakthrough, making SPI institutionally viable.
  2. **Impossibility Result:** We prove that no such mechanism exists (under reasonable conditions). This would show that SPI is inherently vulnerable to manipulation, shifting the focus to robust or dynamic approaches.
  3. **Partial Possibility:** We identify conditions (e.g., on the number of states, the utility functions, or the beliefs) under which a strategy-proof SPI mechanism exists.

  The deciding considerations will be:
  - The mathematical analysis of incentive constraints (e.g., if the SPI condition is too sensitive to beliefs, then manipulation may be inevitable).
  - The trade-off between the strength of the SPI requirement and the flexibility of the mechanism.

  **Risks and Contingencies:**
  - **Project Failure:** We cannot find a strategy-proof mechanism and cannot prove an impossibility theorem (i.e., the problem remains open). This would be a failure of the project's core goal.
  - **Disappointing but Useful Result:** We prove an impossibility theorem under very general conditions, showing that SPI is not implementable in a strategy-proof way. This would be disappointing for the hope of using SPI but still valuable because it redirects research. Alternatively, we might find a positive result only under very restrictive conditions (e.g., two states, two people) that do not generalize.

  **Deliverable:**
  A paper (approximately 30 pages) that answers the core research question, including either a constructive mechanism with a characterization of its domain or an impossibility theorem with a clear boundary between possibility and impossibility. The paper will include the minimal example and at least one more complex example to illustrate the results.

  **Why Twelve Months?**
  This project is tightly scoped to a single, well-defined question with a clear endpoint (a theorem or counterexample). The timeline allows for deep engagement with the technical challenges without being open-ended. A longer project would be needed to explore robust or dynamic alternatives in depth, but this initial year will provide the necessary foundation by resolving the core strategic issue.

  ---

  This structure ensures that the proposal is self-contained, addresses the key concerns, and sets a realistic and focused research agenda.
answer: |-
  ### Project Pitch: Incentive Compatibility in Safe Pareto Improvements  

  **Core Research Question:**  
  Can a mechanism achieve safe Pareto improvements (SPIs) that are *incentive-compatible*—ensuring truthful revelation of beliefs—while satisfying three minimal requirements: (i) selecting an SPI when one exists (relative to true beliefs), (ii) never rewarding belief misreporting, and (iii) avoiding triviality (i.e., not always defaulting to the status quo or delegating to one person)?  

  This question yields a determinate answer: a theorem characterizing feasible mechanisms, an impossibility result, or a formal description of environments where incentive-compatible SPIs are achievable.  

  #### Modelling Choices and Justification  
  - **Utilities and Beliefs as Private Information:** Both are unobservable to the planner. Assuming observability is unrealistic; the strategic problem arises precisely because both are hidden.  
  - **No Shared Prior:** Agents hold distinct beliefs without common grounding. Imposing a shared prior obscures the core challenge of belief heterogeneity.  
  - **Planner Commitment:** The planner commits to a mechanism *ex ante*. This is essential for analyzing incentives and mirrors institutional decision-making (e.g., policy votes).  

  **Why Existing Literature Leaves This Open:**  
  - **Standard SPI Treatments** assume reported beliefs are truthful, sidestepping incentives. They focus on existence (e.g., "Does an SPI exist given fixed beliefs?") but ignore *elicitation*.  
  - **Classic Impossibility Results** (e.g., strategy-proofness in voting) apply to *preferences over outcomes*, not *beliefs about states*. Here, the planner must handle private *probabilities* (continuous reports), not ordinal rankings, and the status quo as default alters incentives (e.g., agents can "veto" via pessimistic beliefs). Existing results do not address this unique combination.  

  #### Approach and Alternatives  
  **Primary Approach:** Mechanism design with direct belief/utility reporting. Agents report beliefs and utilities; the planner selects a policy (status quo or alternative) satisfying SPI conditions *relative to reports*. We test for strategy-proofness: can agents gain by lying?  

  **Excluded Alternatives (for Scope):**  
  - **Robust/Ambiguity-Set SPIs:** Requiring improvements over *all* beliefs in a set (e.g., "Does the alternative improve utility for every prior in my ambiguity set?"). This overcomes elicitation but shrinks the SPI set, often to emptiness. It is a fallback if incentive compatibility proves impossible.  
  - **Dynamic Sequences:** Breaking changes into small SPI steps. While promising, this introduces path dependency, renegotiation risks, and multi-stage manipulation. It requires distinct methods (e.g., dynamic programming) and is deferred.  

  *Justification:* The robust approach assumes bounded rationality (ambiguity sets) and the dynamic approach assumes commitment across time—both add complexity. We first resolve the base case: *static, single-step SPIs with rational agents*.  

  #### Month-by-Month Plan  
  1. **Months 1–2:** Formalize the model and minimal example. Define properties: SPI existence (true beliefs), strategy-proofness, non-triviality.  
  2. **Months 3–4:** Solve a **minimal example** (2 agents, 2 states, 1 alternative) to fix intuitions.  
     - *Example Setup:*  
       - States: Rain (prob. *p* for Agent 1, *q* for Agent 2).  
       - Status quo: Outdoor event (Agent 1: 4 if rain, 0 if sun; Agent 2: 0 if rain, 4 if sun).  
       - Alternative: Indoor event (Agent 1: 1 always; Agent 2: 1 always).  
       - *SPI Condition:* Indoor is SPI if *p*×4 + (1−*p*)×0 < 1 (Agent 1 better off) and *q*×0 + (1−*q*)×4 < 1 (Agent 2 better off). Simplifies to *p* < 0.25, *q* < 0.25.  
       - *Strategic Problem:* If Agent 1 believes *p* = 0.2 (truth), but reports *p* = 0.3, SPI fails—status quo persists. Can a mechanism prevent this?  
  3. **Months 5–6:** Generalize to 3 agents/3 states. Test mechanisms (e.g., using transfers, scoring rules, or randomized choices).  
  4. **Months 7–8:** Explore impossibility: Identify conditions where no strategy-proof mechanism exists (e.g., if state/agent richness exceeds a threshold).  
  5. **Months 9–10:** Analyze domains with positive results (e.g., state-independent utilities, restricted belief spaces).  
  6. **Months 11–12:** Consolidate findings, draft paper, and outline extensions (robust/dynamic SPIs).  

  #### Possible Conclusions and Deciding Factors  
  - **Optimistic:** A non-trivial mechanism works for rich environments (e.g., any finite states/agents). *Deciding factor:* Robustness to "belief manipulation cycles" (e.g., no agent can profit by lying regardless of others’ reports).  
  - **Pessimistic:** Impossibility under general conditions. *Deciding factor:* Dependence of SPI existence on belief correlations—if agents can unilaterally block SPIs via reports, dictatorship is unavoidable.  
  - **Mixed:** Partial possibility (e.g., SPIs achievable only with transfers, common knowledge of payoffs, or risk-neutral agents). *Deciding factor:* Whether relaxing properties (e.g., allowing *ex post* regret) enables solutions.  

  #### Success Metrics  
  - **Failure:** No clear answer (e.g., impossibility conjectured but unproven; mechanism found only for trivial cases).  
  - **Disappointing but Useful:** Impossibility proven for general case, directing focus to robust/dynamic SPIs.  
  - **Success:** A characterization theorem (e.g., "Incentive-compatible SPIs exist iff agent beliefs satisfy pairwise consistency") or a non-trivial mechanism.  

  #### Deliverable and Scope Justification  
  **Deliverable:** A paper proving one of three outcomes: (i) a strategy-proof SPI mechanism, (ii) an impossibility theorem, or (iii) a formal boundary between possible/impossible environments (e.g., based on state space cardinality). Includes the minimal example as a pedagogical tool.  

  **Why 12 Months?** This is the "minimal viable proof": time to isolate the static problem, test mechanisms in simple cases, and derive a general result. A larger project (e.g., 2–3 years) would extend to robust/dynamic SPIs or empirical tests—but *this must wait* until the core incentive problem is resolved.  

  ---  
  **Summary for Pitch:** This project tackles a foundational gap in SPI theory: its vulnerability to strategic belief reporting. By formalizing the incentive problem and delivering a crisp theorem, we resolve whether SPIs can be institutionally operational—or if alternatives (robust/dynamic SPIs) are unavoidable. The one-year scope isolates the critical first step: static, strategy-proof SPIs.
