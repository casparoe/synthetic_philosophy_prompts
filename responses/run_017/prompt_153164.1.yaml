prompt: |-
  Next month I am giving a work-in-progress paper at a joint session of the philosophy of mind group and the epistemology group in a department I am visiting: forty minutes of talk, forty minutes of discussion, seminar table rather than lectern. The room will be roughly this: two internalists of the older sort, one of whom has argued at length that the extended-mind literature trades on confusing causal coupling with constitution and arrives expecting my paper to be one more instance of that confusion; a younger colleague working in predictive processing and active inference, who thinks the boundary-of-cognition question dissolves once you have Markov blankets and who will be impatient with anything framed as a dispute about where mental states are located; a social epistemologist whose work concerns epistemic injustice and how institutions decide which informants and which instruments get credited with knowledge, and who will want to know what my view implies about artifacts that are not neutrally or equally available; a philosopher of psychiatry working on confabulation and delusion, who is the reason I settled on the case I did; and fifteen or so graduate students who are broadly sympathetic to externalism about content but anxious about whether this literature makes any checkable claim about the world.

  The thesis is a reformulation of the extended mind thesis. I argue that the parity principle is close to toothless, because any causal coupling to an environment can be given a functional description that matches some putative internal process, so parity will always return yes; the real work in the classic cases is being done by something the principle never states. I replace it with what I call the delegation condition: a subject counts as having extended a cognitive process into an artifact just in case (i) she has assigned the artifact a specific cognitive sub-task rather than merely using it opportunistically, (ii) she treats its outputs as presumptively authoritative for that sub-task, in the sense that she acts on them without re-deriving them, and (iii) she is disposed to answer for its errors the way she answers for her own slips — that is, she offers corrections rather than excuses, and treats a failure as a reason to revise the artifact or her reliance on it rather than as a bare fact about the world.

  The case I build the talk around is what I have been calling the confabulating surrogate. A woman with a degenerative memory condition wears a device that records her days and plays them back on request; the device, like any compression scheme, fills gaps with plausible invented detail; she relies on it entirely, acts on what it returns, corrects it when it fails her, and never considers the possibility that it invents. On my condition the surrogate is part of her memory process, and so the consequence I have to face is that she genuinely remembers, and arguably comes to know, episodes that never happened. My planned response is two-part: first, separate membership in a cognitive process from entitlement to its deliverances, so that externality of process is compatible with failure of justification; second, argue that objections from unreliability, contamination, or opacity are parochial, since structurally identical problems arise for neural memory in the confabulation syndromes, and so cannot be doing the work the internalist needs them to do.

  What I want from you is a Q&A prep sheet, not a defense of the view. Give me the eight or so objections this particular room will actually produce, ordered by how much damage they would do, each phrased in the idiom of the person who will raise it rather than in neutral philosophical English, each with a reply I can deliver in about two minutes and a note on where that reply is soft. Tell me which of my three clauses is most likely to be the pressure point, and tell me honestly whether the delegation condition quietly collapses into an internalist criterion for an externalist conclusion, since if it does I would rather say so in the talk than be told so at the table. Tell me what I should concede in the body of the paper rather than in discussion, and which single reply has to land if the proposal is to survive the hour. Finally, give me the question I am hoping nobody asks. You can set aside the objections I already have stock answers to — the coupling-constitution complaint, the regress about where the boundary stops, and the usual conditions of trust, reliability and portability.
reasoning: |-
  Okay, the user is preparing for a philosophy presentation on their extended mind thesis reformulation. They need a targeted Q&A prep sheet anticipating objections from a specific audience. Let me unpack this.

  First, the audience composition is crucial. There's an older internalist who hates coupling-constitution confusion, a predictive processing enthusiast who dismisses boundaries, a social epistemologist focused on epistemic injustice, a psychiatry philosopher studying confabulation, and externalism-leaning but skeptical grad students. Each will attack differently.

  The user's thesis replaces parity principle with a delegation condition: (i) assigned cognitive sub-task, (ii) presumptive authority, (iii) error ownership. Their confabulating surrogate case is provocative - claiming invented memories count as extended cognition. Key defenses: separate process membership from justification, note neural memory has similar flaws.

  Top objections would logically be... The social epistemologist will pounce on how artifacts aren't equally available - that's a justice issue. The predictive processing person will call boundary debates obsolete. The internalist will claim delegation is just disguised internalism. The psychiatry expert might say confabulation comparisons fail. 

  For damage levels... The "disguised internalism" charge could be fatal if true - it'd unravel the whole externalist premise. Availability injustice is both philosophically deep and politically resonant. Predictive processing dismissal threatens relevance. 

  The third clause (error ownership) seems most vulnerable - when does "correction" stop being cognitive ownership? And yes, delegation might secretly internalism if criteria are all subject-dependent. User should preempt this by admitting it's a "negotiated externalism."

  Concessions needed: the grad students' "checkable claims" worry is valid - user should admit empirical tests are messy. The psychiatry comparison isn't perfect - neural and artifact failures differ in kind. 

  The make-or-break reply is defending why boundary questions still matter even with Markov blankets. If user can't show delegation does work predictive processing can't, they lose the room.

  And the nightmare question... "What does your criterion exclude?" If everything from muscle memory to Google counts, it's vacuously permissive. Better prep an answer about task-specificity and ownership thresholds.

  Hmm, also that grad student anxiety about testability - user should probably bake a "here's how we'd falsify this" slide into the main talk rather than winging it in Q&A.
answer: |-
  Here’s your Q&A prep sheet, calibrated for this room and ordered by potential damage (high to moderate). I’ve flagged the pressure point, concessions, and the "must-land" reply. The delegation condition’s Clause (iii) is the weakest link, and yes, **it risks collapsing into an internalist criterion**—but strategically, this can be framed as *negotiated externalism*.

  ---

  ### **Top 8 Objections & Replies**  
  *(Phrased in the objector’s idiom, 2-minute replies, soft spots noted)*  

  1. **Older Internalist** (Coupling-Constitution Hawk):  
      *"This is just causal coupling in a tuxedo! You’ve swapped ‘parity’ for ‘delegation,’ but all three clauses describe the* subject’s attitude *toward the artifact. That’s a recipe for cognitive inflation—anything I ‘delegate to’ becomes ‘my mind’? My coffee cup when I rely on it to wake me up?"*  
      **Reply:** "Delegation requires *task-specific cognitive outsourcing*, not mere reliance. Your coffee cup isn’t assigned a *memory sub-task*; it’s a trigger. Clause (i) filters opportunistic use. But you’re right: this shifts focus to agent-artifact *negotiation*, not brute constitution. That’s the point—it’s *how we integrate tools* that extends cognition."  
      **Soft Spot:** Still vulnerable to "cognitive inflation" if task-specification is too loose.  

  2. **Social Epistemologist** (Epistemic Injustice Focus):  
      *"Your ‘presumptive authority’ [Clause ii] ignores power. If my ‘delegation’ is coerced (e.g., predictive policing algorithms), or the artifact is inaccessible to marginalized groups (expensive surrogates), doesn’t your view whitewash epistemic exploitation as ‘extended cognition’?"*  
      **Reply:** "Brilliant point—delegation can be unjust! But my condition is *descriptive*: it identifies *when* cognition extends, not whether it’s ethical or equitable. Your concern shows why we need *complementary* analyses of epistemic justice. I’ll concede this in the paper’s ethics section."  
      **Soft Spot:** Risks decoupling normative/descriptive; conceding early disarms this.  

  3. **Predictive Processing Colleague** (Markov Blanket Skeptic):  
      *"Why reframe this as ‘where cognition is’? Once you see minds as prediction machines, the ‘boundary’ is a dynamic Markov blanket. Your ‘delegation’ is just precision-weighting external signals. Stop reifying containers!"*  
      **Reply:** "Agreed—Markov blankets dissolve *metaphysical* boundaries. But *phenomenologically*, we *experience* delegation (e.g., trusting GPS). My account captures *that* layer: how agents *organize* cognitive labor. Your framework explains *mechanisms*; mine explains *agency*. They’re complementary."  
      **Soft Spot:** If PP explains all cognition, delegation may be redundant. **This reply must land.**  

  4. **Philosophy of Psychiatry Scholar** (Confabulation Expert):  
      *"You equate neural and artifact confabulation? But neural confabulation (e.g., Korsakoff’s) is a *breakdown* of memory systems. Your surrogate *systematically* implants falsehoods. Calling both ‘memory’ obscures pathology!"*  
      **Reply:** "Both involve *unreliable processes the subject treats as authoritative*. The difference is etiology, not functional role. If we deny the surrogate is memory because it’s unreliable, we must also deny neural confabulation is memory—but we don’t. Unreliability cuts across internal/external."  
      **Soft Spot:** Etiology *might* matter for cognitive taxonomy.  

  5. **Anxious Grad Student** (Externalist but Skeptical):  
      *"How is this falsifiable? If your criterion is ‘what the agent treats as authoritative,’ it’s unfalsifiable psychologism. Where’s the *third-person* check?"*  
      **Reply:** "Clause (i) and (iii) are behavioral: *task assignment* (e.g., diary vs. random notes) and *error correction* (does she debug the device or blame the world?). We observe practices, not just attitudes."  
      **Soft Spot:** Still interpretive—e.g., is "debugging" cognitive or practical?  

  6. **Older Internalist** (Part 2):  
      *"Clause (iii) is viciously circular! ‘Answering for errors as her own’ *presupposes* the artifact is part of her cognition. But that’s the very question at issue!"*  
      **Reply:** "Not circular: it’s a *criterion*, not a presupposition. We *infer* cognitive incorporation from patterns of repair (e.g., Otto fixing his notebook vs. replacing a broken pen). It’s no more circular than inferring belief from avowal."  
      **Soft Spot:** Heavy reliance on interpretation of "ownership."  

  7. **Social Epistemologist** (Part 2):  
      *"What about *opaque* artifacts? If I delegate to a black-box AI I don’t understand, I can’t ‘correct’ it [Clause iii]—I can only reject outputs. Doesn’t that exclude most tech?"*  
      **Reply:** "Correction needn’t mean *comprehension*. You might retrain the AI, adjust inputs, or limit its domain—just as we ‘correct’ unreliable biological memory by cross-checking sources. Opaque delegation still counts if you take *agency* over its failures."  
      **Soft Spot:** Can you "correct" what you don’t comprehend? Fuzzy boundary.  

  8. **Grad Student** (Externalist Sympathizer):  
      *"Doesn’t Clause (ii) (‘presumptive authority’) collapse into Andy Clark’s ‘trust and glue’? How is delegation *new*?"*  
      **Reply:** "Clark’s ‘trust’ is about *reliance*; mine adds *task-specific assignment* and *error ownership*. Otto trusts his notebook like Clark describes—but so might a detective trust a clue. Delegation requires *incorporation into one’s cognitive architecture*."  
      **Soft Spot:** Nuanced, but risks being a distinction without a difference.  

  ---

  ### **Pressure Point & Collapse Risk**  
  - **Clause (iii) (Error Ownership)** is the weakest link. It’s ambiguous (what counts as "correction"?), anthropomorphic (can we "correct" neural processes?), and invites circularity charges.  
  - **Yes, delegation risks internalist collapse**: All criteria are *agent-relative* (attitudes/practices), making "extension" dependent on the subject’s perspective. *This is a feature, not a bug*—it captures *how cognition is enacted*. Preempt it:  
  > *"This isn’t your grandpa’s extended mind—it’s ‘extended’ only through the agent’s cognitive self-governance. Call it *internalist-regulated externalism* if you like. The world hooks into cognition via our practices of delegation."*  

  ### **Concessions for the Paper Body**  
  1. **Social Epistemology**: Acknowledge that delegation can reinforce epistemic injustice.  
  2. **Predictive Processing**: Admit your account is "agent-centric" complement to mechanistic PP.  
  3. **Grad Students**: Clarify that delegation *describes* a phenomenon but doesn’t resolve metaphysical disputes.  

  ### **The Must-Land Reply**  
  **To Predictive Processing**: If you fail to show *why agency-centric delegation matters* when PP explains mechanisms, you lose the room. Stress:  
  > *"Markov blankets don’t tell us why *this* artifact becomes *my* memory while *that* one doesn’t—delegation does."*  

  ### **The Question You Hope Nobody Asks**  
  *"If the confabulating surrogate ‘remembers’ false episodes, and neural confabulation is ‘memory,’ is* any *false belief produced by an authoritative-seeming process ‘memory’? Does this erase the factivity of memory?"*  
  **Why it’s deadly**: Forces you to either (a) abandon factivity (heresy!), or (b) make an ad hoc distinction between internal/external unreliability. **Dodge by reframing**:  
  > *"Memory is a process, not an archive. We can have genuine memory *processes* that produce false outputs—just as vision is genuine even when hallucinating."*  

  ---

  **Summary Strategy**: Preempt the "internalist collapse" critique early. Anchor replies in the *confabulating surrogate* case—it’s your strongest intuition pump. If Clause (iii) gets shredded, retreat to Clauses (i) and (ii) as core. Good luck!
