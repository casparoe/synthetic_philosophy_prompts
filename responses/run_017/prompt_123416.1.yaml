  **Lab Notes for the Bookkeeper (After the Seminar)**  
  *by Ila*

  This lamp’s stark glare demands a **measure**,  
  not theory’s cool, abstracted **count**.  
  See here: my dial spins. What **weight**  
  assigns the hand that turns, before worlds **branch**?  
  At midpoint’s hum, we’d call it **half**—  
  your Census claims that truth is **one**.

  But watch the needle drift from **one**  
  fixed mark. The future’s felt **measure**  
  shrinks below that steady **half**  
  your tally takes as simple **count**.  
  The waveform swells, prepares to **branch**—  
  feel the coming outcome’s **weight**?

  It’s not the future’s crowding **weight**  
  that thins when chance drifts far from **one**.  
  It’s *all* real, every **branch**,  
  but my *concern* must have its **measure**.  
  Not how many futures **count**,  
  but where the *bulk* of me will land. Call it more than **half**.

  This dial, smooth, denies a sharp-edged **half**.  
  The amplitude, not branch-folk, bears the **weight**.  
  At equal split, your rule fits— **count**  
  agrees: one outcome, amplitude root-**one**-over-root-two. Clean. But spin! The **measure**  
  slides... the branching’s symmetric split seems harsh,

  forced symmetry where none lives in the **branch**-  
  ing wave. Continuity squeezes pure **half**-  
  beliefs to breaking. What principle fixes **measure**?  
  Not mere being, but the heft, the **weight**  
  of futures interleaved. The state is **one**,  
  but futures aren’t born equal. Can you **count**

  that difference? Your **count**  
  ignores how amplitudes knit across each **branch**.  
  The whole, entangled, still is **one**,  
  yet weights that must compose like waves, resist mere **half**-  
  truths of independence. Future **weight**  
  demands a rule that fits the spin, a coherent **measure**.

  Look: my tally grows. Not **half**, not **one**  
  bright count. The lamp-light shows the **weight**  
  of branch on thin branch. Squared. My **measure**.

  ---

  **(Note: 120 words)**  
  The "squeeze" occurs in **Stanza 4** ("This dial, smooth, denies a sharp-edged **half**..."), where continuous amplitude variation breaks the symmetry justifying the Census Rule at midpoint. The "extra ingredient" is invoked in **Stanza 5** ("weights that must compose like waves") – the constraint that measures must compose multiplicatively across independent systems/repeated runs, like probability amplitudes (or actual probabilities), not additively like bare branch counts. **Line length/caesura carries amplitude**: Lines ending with "**weight**" (stanzas 2,3,4,6) are longer with mid-line pauses ("feel the coming outcome’s **weight**? /"), mimicking heft. Lines for thin branches ("branch on thin branch", envoi) are shorter/fragmented. "**Half**" lines often start abruptly, emphasizing its insufficiency.
