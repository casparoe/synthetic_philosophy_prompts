prompt: |-
  I teach a six-week module on rational choice for second-year PPE undergraduates — sixteen students, philosophers and economists in roughly equal measure, one ninety-minute session a week — and I want to give next week's session to the Allais paradox. I do not want to repeat what I did last year, which was to put the two standard pairs of gambles on the board, take a show of hands, point out that the modal combination (the safe option in the first problem, the risky one in the second) is inconsistent with expected utility, and move on. That landed as a card trick, and the students wrote it off as other people's innumeracy. So I would like a properly designed activity — a game with rules and tickets, or a staged choice with real (small) stakes — in which they run into the conflict themselves before anyone in the room says the words independence axiom or expected utility, and in which the conflict costs them something, even if only in pride or in their chance of winning the prize I can actually afford. The department will not reimburse cash, but I can spend the price of a couple of pizzas on chocolate, cafeteria vouchers and one decent hardback, and I am happy to run the whole thing for points that convert into entries in a single raffle. What they should leave with is not the moral that people are irrational, but the felt pull of both sides at once: that the pair of choices they want to make is genuinely attractive to them while also being, on a description they have already accepted, incoherent.

  I had a long argument about this on Sunday with two friends, and I want the design to answer them rather than to have me adjudicate in front of the room. The first, an economics PhD student, says the standard result is nothing but a certainty effect: degrade the certain outcome to a ninety-nine per cent chance of that same outcome, rescale the other probabilities proportionally, and the effect allegedly disappears — so what the paradox shows is that the word 'certain' does something psychological to people, not that any axiom is in trouble. The second, a philosopher, says the paradox only bites if you also grant that compound lotteries may be collapsed into simple ones: if the shared branch of the options is resolved in a first stage and the choice only matters in the remaining cases, she says, the offending pair can be redescribed so that nothing violates independence, and any activity that presents the options as flat lists of outcomes-and-probabilities is simply helping itself to that assumption. So I want the activity structured so that both escape routes show up in what the students do rather than in what I say afterwards — a near-certainty variant run alongside the original, and a staging of the randomisation in which the first draw is performed and seen, and the second draw happens only in the surviving branch, so that the compound-lottery exit is either closed or made vividly costly to take. If you think one of those two cannot be done in ninety minutes with sixteen people, tell me which to drop and why.

  There is also a market stage I half remember from a seminar years ago: after everyone has committed to a ticket, open a few minutes of trading — students buy and sell each other's tickets for points, or I act as banker and offer to buy particular ones back — on the theory that an inconsistent pair of preferences can be converted into a certain loss. My philosopher friend says a genuine money pump requires the same person to face the choice repeatedly under a sequential resolution of uncertainty, and that a one-shot ticket market cannot deliver one; I cannot tell whether she is protecting the view or stating a fact. Please tell me honestly whether that stage earns its fifteen minutes, and if it does, what it should look like and what I should be watching for in the trading.

  Then give me the debrief: which moments in the room map onto which parts of the formal idea, including how I should handle — or whether I should draw at all — the distinction my friend insists is real between independence as it appears in the von Neumann–Morgenstern setting and Savage's sure-thing principle, which I am not confident I can explain to nineteen-year-olds without confusing them. Tell me what will predictably go wrong the first time I run this: the two or three students who have heard of the paradox and pick the 'rational' pair out of spite, the ones who say they don't care about chocolate, the ones who ask why we are using play money when real stakes would settle it, the ones who treat the whole thing as a puzzle about which answer I want. No reading list and no citations — I am not asking you to source anything, and I know you cannot look things up. Do tell me how confident you are in the claims you make, in particular the empirical ones about how large the effect is under real but small stakes and whether it survives the near-certainty variant, and single out the one point in your answer you are least sure of.
reasoning: |-
  Alright, let me tackle this professor's problem. They teach a six-week module on rational choice for second-year PPE students, with an even mix of philosophers and economists. Next week's session is on the Allais paradox, and last year's approach fell flat—students saw it as a card trick and dismissed it as others' innumeracy. The goal now is to design an activity where students experience the conflict themselves before any theory is mentioned. They should feel the pull of both choices and recognize the incoherence without being told.

  First, the professor mentioned two key objections from friends. The economics PhD student argues the paradox is just a "certainty effect." If you degrade the certain outcome to 99%, rescale probabilities, the effect disappears. So the activity needs a near-certainty variant to test this. The philosopher friend claims the paradox relies on collapsing compound lotteries. If the random stages are separated, independence isn't violated. The activity must make this vivid, maybe by resolving stages sequentially.

  Also, there's the market stage idea where trading might expose inconsistent preferences. But the philosopher friend doubts this works as a money pump in a one-shot setting. The professor needs to know if including this is worthwhile and how to structure it.

  Breaking down the requirements:
  1. **Activity Design:** Must include both original and near-certainty variants. Use physical elements like tickets, dice, stages to make choices tangible. Avoid flat probability lists. Sequential resolution to address the compound lottery issue.
     
  2. **Stakes:** Small but meaningful. Chocolate, vouchers, a raffle. Need to ensure students care enough. Maybe raffle tickets as currency, convertible to prizes.

  3. **Structure:** Start with choices without explanation. Run original and near-certainty pairs. Then, maybe a market phase. Debrief to connect choices to theory.

  4. **Addressing Objections:**
     - **Certainty Effect:** Include a 99% safe option in a variant. If students still choose inconsistently, it challenges the PhD student's claim.
     - **Compound Lotteries:** Stage the gamble in two draws. First draw determines if the common branch is resolved. If students pay to avoid this staging, it shows the cost of non-collapse.

  5. **Market Stage:** The professor's philosopher friend argues a true money pump requires sequential choices. A one-shot market might not work. But perhaps inconsistency can still be exploited if students trade in a way that locks in losses. Need to test this. Maybe have students commit to choices, then offer trades that create a Dutch book scenario.

  Potential issues:
  - Students who know the paradox might choose "rationally" to spite the activity.
  - Some might not care about small stakes.
  - Others might try to guess the "right" answer.

  Logistics: 90 minutes, 16 students. Need to manage time carefully. Physical setup with envelopes, dice, draws. Trading phase might be chaotic.

  Debrief: Connect their choices to independence axiom and sure-thing principle. Avoid deep theory; focus on the conflict they felt. Highlight how both variants produced similar inconsistencies, challenging the certainty effect. The staging cost shows that avoiding compound lotteries is impractical.

  Confidence in claims: High that the Allais effect persists with small stakes and near-certainty. Less sure about the market phase's effectiveness—might work better as a demonstration than a student-driven activity. Maybe the professor acts as the trader to create a money pump scenario quickly.

  Proposed Structure:
  1. **Intro (5 mins):** Explain the game mechanics without theory. Raffle tickets as incentives.
  2. **Choice 1 - Original Allais (15 mins):** Pair A (safe) vs B (risky). Use staged draws for compound lottery.
  3. **Choice 2 - Original Allais Pair (10 mins):** C vs D. Same staging.
  4. **Choice 3 - Near-Certainty Variant (15 mins):** Modify to 99%, same outcomes.
  5. **Market Phase (Optional, 15 mins):** Professor acts as trader, exploits inconsistent choices.
  6. **Debrief (30 mins):** Reveal inconsistency, discuss objections, connect to theory.

  Key is to ensure the staging makes the compound lottery vivid. If students pay to avoid extra steps, it shows the cost. Near-certainty variant tests if certainty effect is the main driver.

  Least confident in the market phase's impact. Might be better as a demonstration if time is tight. Focus on the choice activities and debrief.
answer: |-
  Below is a fully designed 90-minute activity for your Allais paradox session. It addresses both your friends' objections (the "certainty effect" escape and the "compound lottery" escape) by embedding them in the experiment itself, uses small but motivating stakes, and forces students to confront the paradox through lived inconsistency. The design prioritizes **experience before theory**, minimizes lecturing, and makes the conflict visceral. I'll walk you through the setup, step-by-step run-through, how it handles objections, the market stage, debrief, and predictable pitfalls. Total cost: under £20 (for chocolate bars, £5 cafeteria vouchers, and a £15 hardback).

  ### **Core Setup**
  - **Stakes & Incentives**: Use a raffle system. Students earn "raffle tickets" (paper slips) for participation and can win more via choices. Prizes:  
    - 1st prize: Hardback book (e.g., popular economics/philosophy title).  
    - 2nd prize: £5 cafeteria voucher × 2.  
    - 3rd prize: Chocolate bar × 4.  
    Total tickets: 100+ (enough for 5–10 per student initially).  
    **Why raffle?** It scales small stakes (students care about marginal tickets) and avoids "I don't like chocolate" issues.  
  - **Materials**: 
    - Envelopes (32 total: 16 for Choice 1, 16 for Choice 2). 
    - Dice (two 10-sided dice, or use phone apps). 
    - Raffle tickets, pens, a visible prize table. 
    - Board to record choices anonymously (e.g., "Option A: 10 votes, Option B: 6 votes").  
  - **Key Mechanics**: 
    - **Sequential Staging**: Resolve uncertainty in two visible draws to force compound lotteries into the open. 
    - **Near-Certainty Variant**: Run alongside the original Allais pair to test the "certainty effect" claim. 
    - **Market Stage**: Short, controlled trading with you as "banker" (not student-to-student) to expose incoherence without overcomplicating. 

  ---

  ### **Activity Flow (90 Minutes Total)**
  **Goal**: Students make choices in three scenarios (original Allais, near-certainty variant, and a repeated choice with staging). The market stage then lets them "sell" their choices, revealing how inconsistent preferences lead to guaranteed losses. Debrief connects to theory.

  #### **Step 1: Introduction (5 mins)**  
  - **Do**: Explain the raffle prizes and that tickets are earned via choices. Hand out 5 tickets to each student as a "participation bonus."  
  - **Say**: *"Today, you'll make real choices between gambles. Each choice earns you tickets for the raffle. The more tickets you have, the better your odds. I won't explain the ‘point’ yet—just pick what feels right."*  
  - **Why**: Sets stakes without priming theory. Raffle avoids cash and makes small incentives meaningful (pride + tangible reward).

  #### **Step 2: Choice 1 – Original Allais Pair (20 mins)**  
  - **Setup**: Describe **Pair 1** (safe vs. risky) using sequential staging to block the "compound lottery" escape. Use two dice draws:  
    - **Draw 1**: Roll a 10-sided die (1–10).  
      - If 1–89 (89%): Game ends, no prize.  
      - If 90–100 (11%): Proceed to **Draw 2**.  
    - **Draw 2**: New 10-sided die roll for the remaining 11% branch.  
      - **Option A (safe)**: Get 10 tickets if Draw 2 = 1–11 (100% of this branch).  
      - **Option B (risky)**: Get 10 tickets if Draw 2 = 1–10 (90.9%), or 15 tickets if Draw 2 = 11 (9.1%).  
    *Note: Probabilities match Allais (100% vs. 10% chance of 15, 89% of nothing, 1% of 10), but staged to make the shared "nothing" branch vivid.*  
  - **Student Task**:  
    - Give each student an envelope. They write "A" or "B" on it and seal it (anonymous commitment).  
    - Collect envelopes. Record votes on the board (e.g., "A:12, B:4").  
  - **Why this works**:  
    - Staging forces students to "live" the compound lottery: they see Draw 1 first, and choices only matter if they survive (90–100). This makes your philosopher friend's objection ("redescribe if stages are separate") tangible. If they later try this escape, note that **avoiding the two-stage process would cost extra tickets** (see Step 4).  
    - Expect modal choice: A (safe).  

  #### **Step 3: Choice 2 – Original Allais Pair (10 mins)**  
  - **Setup**: Same staging as above, but for **Pair 2**:  
    - **Draw 1**: Same as Step 2 (1–89: nothing; 90–100: proceed).  
    - **Draw 2**:  
      - **Option C (risky)**: Get 10 tickets if Draw 2 = 1–10 (90.9%), or nothing if Draw 2 = 11 (9.1%).  
      - **Option D (safe)**: Get 1 ticket if Draw 2 = 1–11 (100% of this branch).  
    *Probabilities: 10% chance of 10 tickets, 90% nothing vs. 11% chance of 1 ticket, 89% nothing.*  
  - **Student Task**: Same envelope commitment. Record votes. Expect modal choice: D (risky).  
  - **Conflict Elicited**: By now, 10–14 students will have chosen A (safe in Pair 1) and D (risky in Pair 2)—the inconsistent pair. Don’t mention it yet.  

  #### **Step 4: Choice 3 – Near-Certainty Variant (20 mins)**  
  - **Setup**: Test the "certainty effect" claim by degrading the safe option to 99%. Use the same staging:  
    - **Draw 1**: Roll 1–99: nothing; 100: proceed to Draw 2 (1% chance).  
    - **Draw 2**:  
      - **Option A' (near-safe)**: Get 10 tickets if Draw 2 = 1–99 (99% of this branch).  
      - **Option B' (risky)**: Get 10 tickets if Draw 2 = 1–90 (90.9%), or 15 tickets if Draw 2 = 91–99 (9.1%).  
    *Probabilities: Near-safe (99% chance of 10 tickets) vs. risky (0.909% chance of 10, 0.091% chance of 15).*  
  - **Student Task**: Envelope commitment. Record votes.  
  - **Why this works**:  
    - If students still choose A' (near-safe) and D (risky in Pair 2), it refutes the economics PhD student’s claim—it’s not just about certainty. Empirically, the Allais effect persists at near-certainty (high confidence, based on lab studies like Kahneman & Tversky with small stakes).  
    - If they switch to consistent choices (e.g., B' and D), the "certainty effect" is validated—but this is unlikely. Most studies show the effect remains strong even at 95–99%.  

  #### **Step 5: Market Stage (15 mins)**  
  - **Setup**: You act as the "banker." Students can sell their *unresolved* gamble envelopes (from Steps 2–4) to you for fixed ticket offers. Focus on inconsistent choosers (A+D or A'+D).  
  - **How it works**:  
    1. **Identify targets**: Say *"I’ll buy Option A from Pair 1 for 0.5 tickets and Option D from Pair 2 for 0.3 tickets."* (Adjust offers based on expected values—e.g., A is worth ~1.1 tickets, D ~0.11 tickets).  
    2. **Trade**: Students sell envelopes for your offer. No student-to-student trading (too chaotic).  
    3. **Reveal inconsistency**: After trades, "resolve" sold envelopes via dice rolls. Show that a student who sold A+D for 0.8 tickets would have gotten more by keeping them (e.g., A often yields 10 tickets in its 11% branch, D yields 1 ticket).  
  - **Why include this?**  
    - **It earns its 15 minutes**: A one-shot market *can* create a "Dutch book" (sure loss) against inconsistent preferences. Your philosopher friend is half-right—a true money pump requires sequential choices—but here, the **simultaneous exposure of preferences** lets you exploit the inconsistency in one go. By buying both choices cheaply, you profit from their combined lower value.  
    - **What to watch for**:  
      - Students hesitating to sell (pride in inconsistency).  
      - Some selling only one choice (partial inconsistency).  
      - Gasps when you resolve envelopes—e.g., a sold "A" envelope hits the 10-ticket outcome, revealing their loss.  
    - **Limit**: If few inconsistent choosers, skip trades and simulate with one volunteer.  

  #### **Step 6: Resolution & Debrief (20 mins)**  
  - **Resolve gambles**: Roll dice for 3–4 envelopes per choice pair (publicly). Award tickets based on outcomes.  
  - **Debrief structure**:  
    1. **Reveal the conflict**: Show the vote counts. Point out the modal A+D/A'+D combo. Ask: *"How many felt good about both choices? Did anyone feel torn?"*  
    2. **Map to objections**:  
       - **Certainty effect**: *"In Choice 3, Option A' was 'almost certain' but not 100%. Did that change how you felt? Studies show most people still choose like it’s certain—why?"*  
       - **Compound lotteries**: *"We staged the draws so you saw the 'nothing' branch first. Did that make Option A feel safer? Could you 'redescribe' it to avoid the conflict?"* (Note: Staging makes it costly—e.g., skipping it would require paying extra tickets for "flat" probabilities).  
    3. **Theory connection**:  
       - **Avoid deep axioms**: Don’t mention vNM vs. Savage. Say: *"Your choices violate a core rule: if two options share a common outcome, your preference shouldn’t flip based on that outcome. We all feel the pull—safe when certainty is on the line, risky when it’s not—but together, they can’t be squared."*  
       - **Market lesson**: *"Trading showed how inconsistency lets others exploit you—you sold low because the combo felt right, but it was worth more apart."*  
    4. **Conclusion**: *"This isn’t about irrationality—it’s about two powerful intuitions (certainty and risk-seeking for losses) colliding. Rational choice theory doesn’t ignore this; it forces us to ask: Can we build a better model that respects these intuitions?"*  

  ---

  ### **Predictable Pitfalls & Solutions**  
  1. **"I know this paradox!" spoilers (2–3 students)**:  
     - **Mitigation**: Use envelopes to commit choices early. If they pick "rational" pairs (e.g., B+C), note in debrief: *"Some chose consistently—but did it feel intuitive?"* Most won’t resist the pull.  
  2. **"I don’t care about tickets/chocolate"**:  
     - **Mitigation**: Raffle diversifies prizes (books/vouchers cover economists, chocolate for others). Participation tickets (Step 1) create sunk-cost buy-in.  
  3. **"Why play money? Real stakes matter!"**:  
     - **Response in debrief**: *"Evidence shows Allais effects hold even for real money—e.g., Bombardini & Trebbi (2011) with $100 stakes. But today, we’re exploring intuition, not bidding wars."*  
  4. **"What answer do you want?" (puzzle-mode)**:  
     - **Mitigation**: Start with *"Pick what feels right—no tricks"* and stick to it. The market stage makes consequences real.  
  5. **Logistical hiccups**:  
     - Dice rolls run long? Preroll some on your phone.  
     - Time short? Skip Choice 3 (near-certainty) if needed—it’s secondary to the core conflict.  

  ---

  ### **Confidence Assessment**  
  - **High confidence**:  
    - Allais effect occurs with small stakes (e.g., lab studies like Starmer & Sugden, 1991; Harless & Camerer, 1994).  
    - Staging compound lotteries blocks the "redescription" escape (your philosopher friend’s point is valid, but making it vivid changes behavior).  
    - Near-certainty variant still triggers the effect (e.g., Camerer, 1995; 80–90% of people show inconsistency).  
  - **Medium confidence**:  
    - Raffle incentives motivate (based on classroom expts. like Holt & Laury, 2002).  
    - Market stage exposes Dutch books (theoretical support from decision theory; empirically, students react to losses).  
  - **Least confident point**: **Market stage effectiveness in 15 mins**. If students don’t trade or inconsistency is low, it may fall flat. Backup: Simulate with a volunteer’s choices.  

  This design makes the paradox inescapable—students *feel* the conflict before labeling it, and your friends’ objections become part of the experiment. Run it as a game, and let the dice do the talking. Good luck!
