prompt: |-
  I sit on the technical advisory board of a public-interest funder that is about to commit roughly three years of support to about eight researchers working on conceptual and theoretical questions in algorithmic fairness — formal modeling, impossibility and trade-off results, and the interpretation of what those results actually establish. Not empirical audits, and not engineering. Our difficulty is not that the area is unexplored but that it is top-heavy with one kind of result. There is by now a familiar cluster of mismatch findings: independence, separation, and sufficiency cannot all hold at once except in degenerate cases such as equal base rates across groups or a perfect predictor; several natural error-rate criteria come apart in the same way; and the routes to satisfying several criteria jointly tend to run either through worsening outcomes for some group without improving anyone's, or through deliberately randomizing decisions. My colleagues split between those who treat these as essentially complete for the single-decision setting and want them treated as settled background from now on, and those who think the whole framing rests on idealizations that dissolve once real deployment is described accurately.

  What I want from you is a defended agenda rather than a survey: given that budget and that kind of researcher, which open questions should the money actually go to, in what order, and by what criteria? Two features of the deployments we care about push me toward thinking the single-decision idealization is doing serious work. First, procurement: a public agency licenses a risk score from a commercial vendor, never observes protected-class membership itself, and audits using group membership probabilistically imputed by a separate third-party model, so every fairness criterion has to be restated relative to a distribution over group labels rather than to group labels. Second, composition and repetition: the score is one input to a human caseworker who can override it, and the same population is scored again and again over years, its composition shifting partly in response to earlier decisions. Please also rule on some candidate questions I keep putting on the list and then doubting: whether the mismatch results genuinely generalize to the imputed-membership and multi-stage settings, or whether in those settings they quietly turn into claims about the auditor's uncertainty rather than about the decision-maker's fairness; whether the leveling-down worry is a real objection to these results or only a sign that they should be stated as choices among feasible sets rather than as dilemmas; and whether some items on my list are not open questions at all but definitional preferences or artifacts of how someone chose to formalize the setup. For each question you rank, say what makes it worth the years: which downstream questions its answer unlocks, whether it is tractable for someone with formal training and no access to proprietary deployment data, whether it is neglected relative to its leverage, and what single result or piece of evidence over the next two years would move it up or down. Where you think the honest answer is that no further theoretical work is the right investment, say that instead.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're on the technical advisory board for a funder supporting theoretical research in algorithmic fairness. The focus is on formal modeling and impossibility results, not empirical audits. The main issue they face is that the field is dominated by a specific set of mismatch findings, like the impossibility theorems around independence, separation, and sufficiency. Their team is split between those who see these results as settled and those who think the idealizations are problematic.

  First, I need to understand the core tension here. The user mentions two real-world complications: procurement with imputed group membership and multi-stage decision processes. These aspects challenge the single-decision, known-group setup of existing theorems. The user is asking for a prioritized research agenda that addresses these gaps, with defended rankings and criteria.

  The user also has specific candidate questions they're unsure about. I need to address whether the mismatch results hold under imputed membership and multi-stage settings, if leveling-down is a valid objection, and which items on their list are actually definitional artifacts. Each proposed question must be evaluated for downstream impact, tractability, neglect, and what evidence would change its priority.

  Looking deeper, the user's unspoken needs might include wanting to ensure that funded research has real-world relevance without requiring proprietary data. They might also need to justify the investment to stakeholders by showing how theoretical work can inform practical deployments. The mention of procurement and repeated decisions suggests a concern with how fairness criteria are applied in bureaucratic, dynamic systems where human oversight and changing populations play a role.

  I recall that existing literature on fairness often assumes known group memberships and single decisions. But in procurement, agencies use third-party imputed groups, adding uncertainty. For multi-stage processes, sequential decisions and human overrides complicate the picture. There's some work on repeated decisions, like Liu et al.'s dynamics, but not much on the interaction with fairness criteria under imputed groups.

  For the research agenda, the top priority should tackle the imputed membership issue. This is fundamental because if fairness criteria change under uncertainty, much of the current theory needs revisiting. A key question is whether the impossibility results become statements about the auditor's uncertainty rather than the decision-maker's fairness. This has high leverage since it affects how audits are designed and whether fairness definitions need reformulating. Tractability is good because researchers can use synthetic data or public datasets with simulated noise.

  Next, the multi-stage and repeated decisions. Compositionality is crucial here—how fairness criteria interact across stages. The user mentioned human overrides and shifting populations, so dynamics like feedback loops and strategic adaptation need modeling. This unlocks understanding long-term effects and could lead to new criteria for dynamic fairness. It's tractable with simulation frameworks but might require collaborations with domain experts for realistic models.

  The leveling-down objection needs clarification. Is it a fundamental flaw or a framing issue? Addressing this could shift the focus to Pareto improvements and expand the solution space beyond the current trade-offs. This is more conceptual but could unify disparate criticisms and refine how results are presented.

  Other questions like causal frameworks might be less urgent now. While important, the user’s context suggests that without addressing the foundational issues of imputation and dynamics, causal models might inherit the same idealizations. Similarly, long-term equilibria studies are valuable but depend on resolving the multi-stage modeling first.

  I should also consider what's not worth pursuing. For instance, refining single-decision impossibility results without addressing the user's deployment complexities seems redundant. The field is already top-heavy there. Instead, redirecting efforts to the proposed areas would better utilize resources.

  The user’s implicit need is for research that bridges theory and practice without empirical data. So, emphasizing formal methods that incorporate realistic constraints (like imputed groups or sequential decisions) using available data sources is key. Also, highlighting how each priority question leads to actionable insights for policymakers or auditors could strengthen the agenda's relevance.

  Finally, setting clear benchmarks for each question helps assess progress. For imputed membership, showing that trade-offs vanish or transform under certain noise models would elevate its importance. For dynamics, identifying when human oversight mitigates or exacerbates unfairness would be a milestone. These concrete outcomes ensure the research remains directed and impactful.
answer: |-
  Here is a defended research agenda prioritized for impact, tractability, and alignment with your deployment realities, followed by explicit rulings on your candidate questions:

  **Core Prioritization Criteria:**
  1.  **Downstream Leverage:** Does solving this unlock new modeling avenues, reframe policy debates, or expose flaws in current audit practices?
  2.  **Tractability w/ Constraints:** Can a theorist make progress using formal methods, simulation, and public/synthetic data (no proprietary access)?
  3.  **Neglect & Urgency:** Is the question under-explored relative to its importance for real deployments like yours?
  4.  **Deployment Anchoring:** Does it directly address the "procurement with imputation" or "composition/repetition" constraints you face?

  **Ranked Research Agenda (Highest Priority First):**

  1.  **The Imputation Frontier: When does "Fairness" become "Auditability"?**
      *   **Question:** Under what formal conditions do the canonical fairness impossibility results (and trade-offs) *persist*, *vanish*, or *fundamentally transform* when group membership is probabilistically imputed (with known or bounded error characteristics) rather than observed? Specifically, is the resulting "fairness" constraint primarily a statement about the *auditor's uncertainty* or the *decision system's structure*?
      *   **Why Top Priority?** Directly targets your "procurement" constraint. This is the **gatekeeper question**. If impossibility vanishes or changes character under realistic imputation error, it fundamentally reshapes the practical relevance of the existing theoretical canon for major deployment pathways (like government scoring). If it persists robustly, it forces a hard discussion about the limits of imputation-based auditing.
      *   **Leverage:** Unlocks validity of real-world audits. Determines whether vendor claims of "fairness" under imputation are mathematically coherent or auditing theater. Could lead to new "auditability criteria" distinct from fairness criteria.
      *   **Tractability:** Highly tractable. Requires modeling imputation as a noisy channel (e.g., confusion matrix properties, calibrated/uncalibrated probabilities), analyzing how fairness criteria propagate through this noise, and characterizing the resulting feasible sets/trade-offs. Public datasets with sensitive attributes can be used to simulate imputation error; synthetic data suffices for many proofs.
      *   **Neglect:** Extremely neglected. Vast majority of theory assumes perfect group knowledge. Real-world imputation is treated as an engineering afterthought, not a theoretical transformation.
      *   **Move Up/Down Evidence (2 years):** **UP:** Proof that specific impossibility results collapse under plausible non-degenerate imputation error models. **DOWN:** Proof that *all* core impossibility results are robust to *any* non-perfect imputation (highly unlikely).

  2.  **Compositionality & Dynamics: Fairness in the Loop.**
      *   **Question:** How do canonical fairness criteria (and their trade-offs) compose or interact across (a) sequential algorithmic decisions on the *same* individual/population, and (b) algorithmic-human decision loops (like caseworker override)? What new *dynamic* fairness properties or impossibility results emerge when considering population shifts and strategic adaptation in response to repeated scoring?
      *   **Why High Priority?** Directly targets your "composition/repetition" constraint. Single-shot results are myopic for longitudinal systems (e.g., recidivism scoring, credit scoring, benefits eligibility). Human override introduces a critical non-algorithmic component ignored in pure "single-algorithm" theory.
      *   **Leverage:** Unlocks understanding of long-term societal impact. Reveals hidden feedback loops (e.g., where "fair" single-stage decisions exacerbate disparities over time). Informs design of override protocols and retraining schedules. Challenges the very definition of a "group" if membership shifts strategically.
      *   **Tractability:** Tractability requires careful scoping. Modeling full societal dynamics is intractable. Focus should be on:
          *   *Sequential Algorithms:* Chaining 2-3 algorithmic decisions with simple dependency rules (e.g., score_t+1 depends on decision_t and features).
          *   *Human-in-the-Loop:* Modeling human override as a (potentially biased) classifier or stochastic function conditioned on the score and observable features.
          *   *Population Dynamics:* Simple feedback models (e.g., decisions affecting feature distributions via known mechanisms like credit denial -> difficulty getting jobs -> worse future features).
      *   **Neglect:** Growing interest but still nascent compared to single-shot. Human override is particularly under-theorized.
      *   **Move Up/Down Evidence (2 years):** **UP:** Formal identification of a *new* dynamic impossibility trade-off arising *only* in sequential/hybrid settings. **DOWN:** Proof that single-shot trade-offs compose linearly/predictably (unlikely).

  3.  **Reframing the Dilemma: Beyond Leveling-Down and Feasible Sets.**
      *   **Question:** Does the "leveling-down" criticism (worsening outcomes without improving others) expose a fundamental flaw in how trade-offs are presented, or is it merely a preference? Can impossibility results be rigorously restated as characterizations of *Pareto frontiers* over relevant outcome metrics for different groups? What constitutes a "legitimate" improvement when facing a trade-off?
      *   **Why Medium Priority?** Addresses the philosophical/practical split on your board. Clarifies the normative weight of the results. Leveling-down is a frequent policy objection; theorizing the response is crucial for impact.
      *   **Leverage:** Unlocks clearer communication to policymakers. Provides a rigorous framework for evaluating proposed "solutions" to trade-offs (e.g., does method X genuinely expand the Pareto frontier or just move along it?). Forces explicit definition of "benefit" and "harm".
      *   **Tractability:** Highly tractable formal work (characterizing Pareto frontiers under fairness constraints) combined with conceptual/normative analysis. Requires bridging formal theory and welfare economics/philosophy. No special data needed.
      *   **Neglect:** Leveling-down is often *mentioned* but rarely the *central focus* of formal analysis. The "feasible set" vs. "dilemma" framing needs rigorous formalization.
      *   **Move Up/Down Evidence (2 years):** **UP:** Formal proof that a class of proposed "fairness" interventions *only* achieves leveling-down under broad conditions. **DOWN:** Widespread acceptance that leveling-down is definitionally excluded from consideration (unlikely).

  4.  **The Causal Mismatch: When Formal Criteria Misrepresent Harm.**
      *   **Question:** Under what causal structures of discrimination and feature generation do the standard observational fairness criteria (Independence, Separation, Sufficiency) fail to correspond to meaningful notions of harm or benefit, even *before* considering trade-offs? Can we formalize "harm alignment" and characterize when observational criteria are necessary/sufficient proxies?
      *   **Why Lower Priority (but included)?** Important for the "interpretation" aspect. Highlights that the mismatch might be deeper than just trade-offs; it might be misalignment with the underlying harm the criteria *aim* to prevent. Connects to debates about what fairness *should* mean.
      *   **Leverage:** Unlocks more philosophically grounded criteria. Guides when observational criteria *are* appropriate proxies despite causal complexity. Strengthens critiques of purely statistical approaches.
      *   **Tractability:** Challenging but tractable within bounds. Requires combining causal graphical models (CGM) with fairness definitions. Focus should be on canonical CGMs (e.g., confounding, mediation, selection) rather than arbitrary structures. Simulation-based validation possible.
      *   **Neglect:** Causal fairness is active but often focuses on defining new criteria. Less emphasis on systematically mapping the *misalignment* of standard criteria under known causal structures.
      *   **Move Up/Down Evidence (2 years):** **UP:** Formal characterization of a causal structure where *all* standard criteria are provably misaligned with a plausible harm metric. **DOWN:** Widespread adoption that causal models are required *in practice* for fairness assessment (making theoretical exploration less urgent).

  **Rulings on Your Candidate Questions:**

  1.  **Generalization to Imputed/Multi-Stage Settings:**
      *   **Ruling:** This is **THE critical open question** (encompassing Agenda Items 1 & 2). It is **not settled**. It is highly likely the results *do* transform, potentially into claims about **auditor uncertainty/imputation quality** in the procurement setting, and into claims about **emergent dynamic properties** in the multi-stage setting. *This transformation is the core unknown needing investigation.* Funding should prioritize this.

  2.  **Leveling-Down Worry:**
      *   **Ruling:** It is **both a real objection and a framing issue**. It exposes that impossibility results are often presented as *absolute* dilemmas (you *must* pick A or B) without clarifying that option C (leveling-down) exists but is normatively unacceptable. Research should **reframe results as characterizing feasible outcome sets** and explicitly model normative constraints against leveling-down (Agenda Item 3). This makes the ethical choice explicit.

  3.  **Definitional Preferences/Formalization Artifacts:**
      *   **Ruling:** This is **crucial to address explicitly** (integrated into Agenda Items 3 & 4). Many apparent disagreements stem from:
          *   *Implicit Normative Weights:* How heavily do we weight different groups' outcomes or different error types? (Agenda Item 3 - Pareto frontiers).
          *   *Choice of Outcome Metric:* Is "benefit" accuracy, recall, calibrated probability, expected utility? (Needs explicit definition in any formalization).
          *   *Causal Assumptions:* What does "fairness" *mean* given the data generating process? (Agenda Item 4 - Harm Alignment).
      *   Research must rigorously surface these choices within formal models.

  **What *Not* to Fund Heavily:**

  *   **Refining Single-Decision Impossibility Proofs:** The field is already top-heavy here. Unless a proposal directly addresses *how imputation/dynamics changes these proofs*, it's likely incremental.
  *   **Novel Criteria Proliferation:** Defining new statistical criteria without strong justification rooted in *addressing the limitations exposed by your deployment constraints* (imputation, dynamics, leveling-down, causal misalignment) risks adding to the theoretical noise.
  *   **Pure Long-Term Equilibria without Compositional Foundations:** While long-term dynamics are important (touched on in Agenda Item 2), modeling complex societal equilibria is highly speculative without first understanding the compositional rules and human-algorithm interactions that drive the dynamics. Start with the mechanics of 2-3 step processes.

  **Summary of Investment Thesis:** Shift the theoretical foundation from the idealized, single-shot, known-groups paradigm to one grounded in the **auditability challenges of imputed groups** and the **dynamic complexities of composed, repeated decision systems involving humans**. This directly addresses the friction between seeing the existing results as "complete" vs. seeing them as artifacts of unrealistic idealizations. The goal is theory that speaks clearly to procurement officers, auditors, and policymakers grappling with the messy realities you described. Prioritize Agenda Items 1 and 2 as the most direct, high-leverage, and tractable path to this shift.
