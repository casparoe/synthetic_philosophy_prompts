prompt: |-
  I work as a software engineer and have no formal background in philosophy. I am putting together a short statement of my position on mind uploading and gradual replacement, to be handed around in advance to a reading group of colleagues — all engineers, none of them philosophers — who have been asked to attack it before we meet. I would like an audit of the position before I hand it over. I do not know where the weaknesses are; if I did I would already have revised, so please do not treat any item below as the one I am most or least attached to.

  Here is the set, in my own vocabulary.

  (1) Substrate independence. What makes a state of mine the state it is, is the role it plays in the causal-functional organisation of the whole system, not the material that realises it. Neurons, silicon, or something nobody has built yet: if the organisation is preserved, the mental facts are preserved.

  (2) In-place incremental replacement preserves the person, and the granularity does not matter. If each unit is replaced by a functionally equivalent unit wired into the running system, taking over the causal role of the part it replaces, then I survive the entire procedure. I do not think there is a threshold fraction, and I do not think the rate matters: one unit per hour, a thousand per second, or the whole system in a single operation, provided each replacement is switched in while the system is running and nothing is ever taken offline, all come out the same way.

  (3) Copy-and-delete is death. A destructive scan followed by reconstruction of a functionally identical system produces a replica, and I am gone. The same, in my view, goes for the non-destructive variant: scan me, instantiate an upload, kill the biological original an hour later. The upload was never me, and its continued existence is not my survival.

  (4) Survival is all-or-nothing. I reject the line I associate with Parfit (I may be misattributing it) that identity is not what matters and that what matters is psychological continuity, which comes in degrees. Ninety-five per cent continuity is not ninety-five per cent survival. Either the candidate is me or it is not, and if it is not, then its continuity with me is no consolation at all.

  (5) No residue. Whether a candidate future system is me is settled entirely by the physical and functional facts. There is no non-physical ingredient, and no brute primitive further fact of survival over and above the causal and functional story, however fine-grained you want to make that story.

  (6) Implementation matters in exactly one way. A system that merely matches my input-output behaviour — a vast lookup table, or a roomful of clerks relaying signals to each other by radio in a pattern that reproduces all my dispositions — would not be conscious and would not be me, even though it realises the same input-output function. I am not sure whether this contradicts (1) or is a separate point, which is part of what I want you to tell me.

  The case verdicts I have committed to, beyond (2) and (3) above, are these. (a) A hot-swap protocol in which the replacement for each unit is instantiated alongside it, tested in situ for a minute against the live traffic, and only then given the role while the original is destroyed: I survive, and this holds however fast the protocol runs. (b) A full in-place switchover to a duplicate that was built and verified in parallel beforehand, executed as one operation with the system never offline: I survive. (c) Snapshot my complete state, kill me, instantiate the last snapshot in fresh substrate: death, even if the gap is a second. (d) Instantiate two copies from one snapshot, let them run and diverge for a week, then merge them by averaging their parameters into a single system: I have no verdict, and I cannot tell whether my other commitments are supposed to deliver one. (e) I also find that I want the replica in (c), and the upload in the non-destructive variant of (3), to inherit my projects, my obligations, my savings and my unspoken apologies — and I cannot tell whether that is an extra commitment of mine, a consequence of something above, or just sentiment.

  What I want is an audit rather than a survey. Tell me which pairs of commitments are genuinely in tension, ordered by severity rather than listed as equally bad, and for each say precisely what would have to be given up and what that would cost me. Tell me which apparent tensions dissolve on inspection and what the dissolving distinction is. Say whether the package in fact delivers a verdict on the merge case in (d), and if it does not, what the smallest addition would be that makes it deliver one. Then tell me which single revision would clean up the most, and what I lose by making it.

  Two constraints. Please do not give me a bibliography, a reading list, citations, or pointers to papers: I have no easy access to them and I want the reasoning rather than the references. And please argue in my vocabulary rather than in shorthand — if a position I have described has a standard name, name it once for my benefit, but do not let anything rest on my recognising it.
reasoning: |-
  Okay, the user is a software engineer with no formal philosophy background, preparing a position statement on mind uploading for an engineering reading group. They want an audit of their argument's internal consistency before sharing it. 

  Hmm, their position is remarkably well-structured for a non-philosopher - clear commitments with numbered theses and concrete test cases. The substrate independence (1) and functionalism seem solidly engineering-minded. But I notice immediate tension between their "all-or-nothing survival" (4) and gradual replacement (2). If identity is binary, how can swapping parts incrementally preserve it? That's the biggest crack in the foundation.

  *flipping through mental notes* Ah, and the replica inheritance intuition in (e) is fascinating - they want continuity of identity but also want replicas to inherit social properties. That smells like Parfit's "what matters" peeking through their rejection of him. The lookup table objection (6) suggests they're not pure functionalists, which complicates (1). 

  For the merge case (d)... *tapping fingers* ...their framework completely breaks down. With two diverging copies averaging into one, there's no continuity preservation. They'd need to either accept partial survival or invent new criteria. 

  *checking constraints* Right, no citations - must explain Ship of Theseus without naming it. And absolutely no jargon - when I mention "non-branching continuity", need to unpack it as "single continuous stream". 

  Biggest cleanup would be dropping the binary survival claim (4). It'd hurt their intuition about death in copying, but resolve the replacement paradox. Alternatively, embracing Parfit would make inheritance natural but violate their deepest aversion. 

  *noting audience* Colleagues are engineers - should frame tensions as system design tradeoffs. The "single-threaded process" analogy for identity might resonate. Must avoid philosophical rabbit holes and stay focused on their specific test cases.
answer: |-
  Here's an audit of your position, ordered by severity of tension, with targeted recommendations:

  ### 1. **Severe Tension: Incremental Replacement (2) vs. All-or-Nothing Survival (4)**
     - **Conflict:** (2) claims gradual replacement preserves identity through continuity. (4) insists survival is binary ("me or not me") with no degrees. But gradual replacement forces you to confront *when* survival is achieved during the process. If swapping 1% of parts leaves you "95% you" functionally, (4) rejects this as meaningful survival.
     - **Consequence:** Your verdicts (a) and (b) work under (2), but (4) makes them unstable. If identity is binary, you must define the exact moment a "new system" emerges during replacement—but your framework provides no non-arbitrary threshold.
     - **Fix:** Abandon (4). Accept that *what matters* (consciousness, memory, agency) can persist in degrees via functional continuity. This retains (2)/(3) distinctions and resolves the tension.  
     **Cost:** Loses the intuitive "binary self" and requires accepting the replica in (3) as "as good as survival" psychologically (though not numerically identical).

  ### 2. **Major Tension: Functional Organisation (1) vs. Implementation (6)**
     - **Conflict:** (1) says substrate/implementation doesn't matter if functional role is preserved. (6) says a lookup table (same input-output function) isn't conscious/you. This implies functional role *alone* is insufficient—internal causal structure matters.
     - **Consequence:** (1) is ambiguous between "input-output function" and "fine-grained causal structure." (6) shows you require the latter (e.g., real-time feedback loops, not precomputed responses).
     - **Fix:** Clarify (1) as **"Causal-Structural Independence"**: Identity depends on preserving the *internal causal network* (states causing other states dynamically), not just input-output behavior.  
     **Cost:** Weakens "substrate independence" slightly—now only substrates enabling identical causal dynamics qualify. But this aligns with your rejection of lookup tables.

  ### 3. **Moderate Tension: Copy-and-Delete (3) vs. Inheritance Intuition (e)**
     - **Conflict:** You insist replicas aren't you (3), yet want them to inherit social roles (debts, projects). If the replica isn't you, why should it inherit *your* obligations? Sentiment isn't a justification within your physicalist framework (5).
     - **Consequence:** Your social intuition conflicts with the "no residue" view (5). If identity is purely physical/functional, social continuity should require identity.
     - **Fix:** Either:  
       a) **Drop inheritance claim (e)**: Replicas are new entities; obligations lapse.  
       b) **Revise (3)/(4)**: Accept Parfit-style psychological continuity (what matters isn't identity but connectedness).  
     **Cost:** (a) Feels emotionally unsatisfying. (b) Abandons core commitment (4).

  ### 4. **Minor Tension: No Residue (5) vs. Merge Case (d)**
     - **Problem:** Your framework lacks resources to handle fusion. Averaging two diverged systems destroys the unique causal history of each. (5) says only physical/functional facts matter, but neither copy's causal chain continues into the merged system.
     - **Verdict on (d):** Your commitments imply **neither copy survives**. The merged system is causally discontinuous with both originals (like a new person).
     - **Smallest Addition:** Require **"Non-Branching Continuity"**: Survival requires unbroken causal continuity *without competing branches*.  
     **Cost:** Rules out teleportation even if no original is destroyed (e.g., creating a copy without deleting you).

  ### 5. **Apparent Tension (Dissolves): Snapshot Instantiation (c) vs. Hot-Swap (b)**
     - **Why it seems conflicted:** (c) calls snapshot + kill "death," while (b) accepts full-system hot-swap as survival. But (b) preserves active causal processes; the system never stops running. (c) involves termination and restarting from a static state.
     - **Dissolution:** Distinguish **process continuity** vs. **state replication**. (b) maintains the live process; (c) breaks it. Your framework consistently values uninterrupted causal flow.

  ### Recommended Priority Fix
  - **Revise (4) → "Degrees of Survival"**:  
    Replace "all-or-nothing" with: *What matters for practical concerns (consciousness, memory, projects) is robust psychological continuity, which can be preserved in replicas or partial replacements.*  
  - **Why this cleans most:**  
    - Resolves the severe conflict with (2) and the inheritance tension in (e).  
    - Explains why gradual replacement feels like survival while copy+delete feels like risk/death (discontinuity).  
    - Keeps (1), (3), (5), (6) intact.  
  - **Cost:**  
    Loses the absolute "I survive or cease" intuition. Copying becomes "survival for the replica, death for you" (non-branching still fails). This is Parfit's view—you may dislike it, but it patches the largest holes.

  ### Summary of Revisions
  1. **Clarify (1)** as requiring fine-grained causal structure (not input-output).  
  2. **Replace (4)** with degrees of psychological continuity.  
  3. **Add "non-branching" requirement** to handle mergers (optional but recommended).  
  4. **Drop or justify inheritance claim (e)**—if keeping revised (4), replicas inherit roles naturally.  

  This package delivers verdicts on all cases:  
  - (a),(b): Survival (continuous process).  
  - (c),(3): Death (process termination or branching).  
  - (d): Death (branching and fusion).  
  - (e): Inheritance applies if you adopt psychological continuity.  

  Your core engineering intuition—**unbroken causal flow is key**—remains the anchor.
